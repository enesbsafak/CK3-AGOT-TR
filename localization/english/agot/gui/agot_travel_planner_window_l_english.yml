 historical_battle_rape_of_the_sisters:0 "Kız Kardeşlerin Tecavüzü"

 historical_battle_rape_of_the_sisters_desc:0 "Üç Kız Kardeş'e Tecavüz, Kuzeylilerin adaları yıkıcı işgali, Stark ve Arryn Hanedanlarının kralları arasındaki Su Üstü Savaşı'nda, Kız Kardeşler'in Vadi'ye dahil edilmesine yol açan bir dönemdi."

 historical_battle_end_of_the_mudds:0 "Mudd'ların Sonu"

 historical_battle_end_of_the_mudds_desc:0 "Andallara düşen İlk İnsanların ikinci büyük krallığı, Nehirler ve Tepeler Krallığı'ydı. Mudd Hanedanı'nın kralları yiğitçe ve kahramanca savaştı; ama ünlü Adalet Çekici Tristifer IV Mudd bile yüzüncü savaşında düştü ve hanedan da ondan uzun yaşamadı."

 historical_battle_battle_of_seven_stars:0 "Yedi Yıldız Savaşı"

 historical_battle_battle_of_seven_stars_desc:0 "Andalların İlk İnsanlara karşı büyük zaferi, Yedi Yıldız Savaşı, Vadi'yi Arryn Hanedanı için güvence altına aldı ve Dağ ve Vadi Krallığı'nı kurdu."

 historical_battle_feast_of_skane:0 "Skane Ziyafeti"

 historical_battle_feast_of_skane_desc:0 "Skane Ziyafeti, Skagosluların Skane'i kötü şöhretli yağmalaması, Skagosluların ada nüfusunun tamamını yamyamlığa kurban etmesiyle hatırlanır; ada bu güne dek ıssız kalmıştır."

 historical_battle_of_the_weeping_water:0 "Ağlayan Su Savaşı"

 historical_battle_of_the_weeping_water_desc:0 "Andal istilası sırasında, Kral Theon Stark önderliğindeki Stark ve Bolton güçleri arasındaki nadir bir ittifak, Argos Yedi Yıldız'ın Andal güçlerini Ağlayan Su nehri yakınında yendi."

 historical_teague_crowning:0 "Teague'lerin Taç Giyme Töreni"

 historical_teague_crowning_desc:0 "Son büyük Nehirli krallar Teague Hanedanı'ndandı — diyarlarının içinde ve dışında kötü nam salmışlardı; taçlarını Batı Toprakları'na akınlar düzenleyerek kazandılar ve ardından Bakire Limanı'nda taç giydiler."

 historical_burning_of_lannisport:0 "Lannisport'un Yakılması"

 historical_burning_of_lannisport_desc:0 "Greyjoy İsyanı bir bildiriyle değil, Lannister filosuna ev sahipliği yapan Lannisport'un Yakılması'yla başladı."

 historical_battle_of_ruby_ford:0 "Yakut Geçit Savaşı"

 historical_battle_of_ruby_ford_desc:0 "Targaryen Hanedanı'nın yüzyıllar süren hükümdarlığı, Prens Rhaegar Targaryen'in ölümüyle Kızıl Üçgünde parçalanmaya başladı. Lord Robert Baratheon'un çekici Rhaegar'ın göğüs zırhını parçaladığında, Ejderhalar öldü."

 historical_battle_redgrass_field:0 "Kırmızı Ot Tarlası Savaşı"

 historical_battle_redgrass_field_desc:0 "Neredeyse bir yıl süren savaşın ardından, İlk Blackfyre İsyanı Kırmızı Ot Tarlası Savaşı ile sona erdi. Daemon Blackfyre'nin güçleri, sadık Targaryen güçleriyle çarpıştı; bu, Daemon'un ve ikiz oğullarının ölümüne ve isyanın çökmesine yol açtı."

 historical_sack_of_high_tide:0 "Yüksek Gelgit'in Yağmalanması"

 historical_sack_of_high_tide_desc:0 "Velaryon Hanedanı'nın zenginliğinin ve gücünün simgesi olan Yüksek Gelgit kalesi, Ejderhaların Dansı sırasında Boğaz Savaşı'nın ardından yağmalandı. Lord Corlys 'Deniz Yılanı'nın meşhur hazine sandığı, kaleyle birlikte yandı."

 historical_battle_vulture_hunts:0 "Akbaba Avı"

 historical_battle_vulture_hunts_desc:0 "İlk Akbaba Kral'ın isyanı, Dorne'un İlk Dorne Savaşı'nda çektiği acıların intikamını arıyordu. İlk zaferlerin ardından yenilgiye uğratıldı. Kaçan isyancılar, Akbaba Avı olarak bilinen olayda avlanıp öldürüldü."

 historical_battle_last_storm:0 "Son Fırtına"

 historical_battle_last_storm_desc:0 "Son Fırtına, Aegon'un Fethi sırasında yapılan bir savaştı. Kral Argilac Durrandon'un güçleri, Aegon 'Fatih'in yakın dostu Orys Baratheon'un Kral Argilac'ı tek dövüşte öldürmesinin ardından nihayet yenildi. Orys, savaşın ardından Argilac'ın krallığını, kalesini ve kızını aldı."

 historical_burning_of_harrenhall:0 "Harrenhal'ın Yakılması"

 historical_burning_of_harrenhall_desc:0 "Hoare Hanedanı ve Demirdoğumluların Nehir Toprakları üzerindeki hâkimiyeti, Harrenhal'ın Yakılması ile sona erdi. Aegon 'Fatih' kaleye ejderha ateşini saldı; kuleleri ve içindekilerin hepsini eritti."

 historical_battle_field_of_fire:0 "Ateş Tarlası"

 historical_battle_field_of_fire_desc:0 "Aegon'un Fethi sırasında üç Targaryen ejderhasının da savaştığı tek savaş olan Ateş Tarlası, Gardener Hanedanı'nın sonunu, Highgarden'ın teslimini ve Kaya'nın boyun eğmesini getirdi."

 historical_battle_wendwater:0 "Wendwater Köprüsü Savaşı"

 historical_battle_wendwater_desc:0 "Dördüncü Blackfyre İsyanı, Blackfyre ordusunun Wendwater Köprüsü Savaşı'nda ezilmesi ve Daemon III Blackfyre'nin Kral Muhafızı Uzun Duncan tarafından öldürülmesiyle sona erdi."

 historical_kingswood_brotherhood:0 "Kral Ormanı Kardeşliği"

 historical_kingswood_brotherhood_desc:0 "Kardeşlik, Kral II. Aerys Targaryen'in hükümdarlığı sırasında Kral Ormanı'nda kol gezen, Simon Toyne önderliğindeki bir haydut çetesiydi. Kral Muhafızı Ser Arthur Dayne 'Sabahın Kılıcı' önderliğindeki güçler tarafından yenildiler; Dayne, kötü şöhretli Gülümseyen Şövalye'yi bir düelloda öldürdü."

 historical_battle_of_the_bells:0 "Çanlar Savaşı"

 historical_battle_of_the_bells_desc:0 "Bir yenilginin ardından Lord Robert Baratheon, Lord Eddard Stark'ın güçlerine katılmak amacıyla Stoney Sept'e çekildi. El Kralı Lord Jon Connington önderliğindeki Targaryen güçleri onu oraya kadar takip etti; bu da Çanlar Savaşı'na ve bir isyancı zaferine yol açtı."

 poi_notable_castle_visit:0 "[province.Custom('CastleName')]'i ziyaret etti"

 poi_notable_castle_visit.tt:0 "[province.Custom('CastleDesc')]"

 runestone_name:0 "Rün Taşı"

 runestone_desc:0 "Kadim Runestone kalesi, Bronz Krallar olarak hüküm sürdükleri Şafak Çağı'ndan bu yana Royce Hanedanı'nın yüksek makamıdır."

 nightfort_name:0 "Gece Kalesi"

 nightfort_desc:0 "Duvar'daki en büyük ve en eski kale olan Gece Kalesi, eski halinin bir gölgesidir; şimdi harabe halindedir. Geriye kalan, tüneller, kuleler ve taştan oluşan bir labirenttir."

 shadowtower_name:0 "Gölge Kulesi"

 shadowtower_desc:0 "Duvar'ın batı ucunda yer alan Gölge Kulesi, Nöbetçi Duruşu ile Köprü Kıyısı Batı Nöbeti arasında durur ve bu güne dek Gece Nöbeti'nin elinde kalır."

 castleblack_name:0 "Kara Kale"

 castleblack_desc:0 "Kadim bir kale olan Kara Kale, Yüce Komutan'a ev sahipliği yapar ve Gece Nöbeti'nin harekât üssüdür."

 eastwatch_name:0 "Deniz'deki Doğu Nöbeti"

 eastwatch_desc:0 "Gece Nöbeti'nin elindeki en doğudaki kale olan Doğu Nöbeti, bir muhafız garnizonuna, az sayıda gemiye ve ara sıra uğrayan yabanıl tüccarlara ev sahipliği yapar."

 starpike_name:0 "Starpike"

 starpike_desc:0 "Peake Hanedanı'nın kadim yurdu Starpike, Dorne Sınırları içinde yer alır. Menzil Krallığı'nın büyük güçlerinden birine ev sahipliği yapan kale, çok eski zamanlardan beri savaşlar görmüştür."

 bitterbridge_name:0 "Acı Köprü"

 bitterbridge_desc:0 "Taş Köprü uzun zamandır Mander'ın bir geçiş noktasıydı; ama yeni adını, İnanç Ordusu ayaklanması sırasında kazandı: Acı Köprü."

 shield_islands_name:0 "Kalkan Adaları"

 shield_islands_desc:0 "Bir zamanlar Sisli Adalar olarak bilinen ve korkulan Demircilere ev sahipliği yapan Kalkan Adaları, o günden beri eski efendilerine karşı bir siper haline geldi."

 ashford_name:0 "Ashford"

 ashford_desc:0 "Bir pazar kasabasıyla çevrili küçük, üçgen bir kale olan Ashford, Ashford Hanedanı'nın makamıdır."

 ashford_tourney_desc:0 "Prens Baelor 'Kargı Kıran' Targaryen'in sonunu getiren ve geleceğin Kralı ile Yüce Komutanı arasındaki dostluğu başlatan mızrak dövüşü. Ashford, bununla sonsuza dek anılacak."

 horn_hill_name:0 "Boynuz Tepesi"

 horn_hill_desc:0 "Tarly Hanedanı'na ev sahipliği yapan Boynuz Tepesi, uzun zamandır Menzil'in sadakındaki bir oktur ve düzenli olarak olası düşmanlara karşı yaya yerleştirilen bir ok."

 golden_tooth_name:0 "Golden Tooth"

 golden_tooth_desc:0 "Lefford Hanedanı'nın yurdu Altın Diş kalesi, uzun zamandır Batı Toprakları'nı doğudan gelebilecek tehditlerden koruyan bir siperdir."

 pyke_name:0 "Pyke"

 pyke_desc:0 "Demircilerin büyük kalesi Pyke, Deniztaşı Tahtı'nın ve Greyjoy Hanedanı'nın makamıdır."

 moat_cailin_name:0 "Cailin Hendeği"

 moat_cailin_desc:0 "Kuzey'in kapısı olan ve güneyden gelen tüm olası fatihleri geri çevirmesiyle ünlü Cailin Kalesi, eski büyüklüğünden düştü; ama hâlâ korkulan bir düşmandır."

 fist_name:0 "İlk İnsanların Yumruğu"

 fist_desc:0 "İlk İnsanların Yumruğu, Duvar'ın kuzeyinde uzanan tek başına bir tepedir; özgür halk, toprağı yarıp çıkmış bir yumruğa benzediği için bu adı vermiştir. Tepenin zirvesinde, İlk İnsanlar tarafından inşa edilmiş kadim bir halka kalenin kalıntıları vardır."

 bloody_gate_name:0 "Kanlı Kapı"

 bloody_gate_desc:0 "Kanlı Kapı, Arryn Vadi'sine giden dar yüksek yol boyunca uzanan bir dizi tahkimattır."

 dragonstone_name:0 "Dragonstone"

 dragonstone_desc:0 "Targaryen Hanedanı'nın kadim makamı olan kale, mimarisiyle ejderhalardan ilham alır. Fatihlere, krallara ve nice prense ev sahipliği yapmıştır. Adada, ejderhaların yuva yaptığı Ejderha Dağı adlı bir yanardağ vardır."

 storms_end_name:0 "Fırtına Ucu"

 storms_end_desc:0 "Storm's End, Baratheon Hanedanı'na ev sahipliği yapar. Diyarın en zorlu kalelerinden biridir; duvarlarına işlenmiş büyülerle korunduğu söylenir. Yüzyıllardır ayaktadır; eskiden Durrandon Hanedanı'na ev sahipliği yapardı. Nice fırtına esti geçti; yine de Storm's End güçlü durur."

 wyl_name:0 "Wyl"

 wyl_desc:0 "Aynı adlı evin makamı olan Wyl, Dorne Sınırları'nın kalelerinden biridir. Bu yüzden savunmasını güçlendirmek için altına tüneller oyulmuştur. Kral I. Aegon Targaryen, Kara Dehşet Balerion'un sırtında saldırdığında, Wyl Hanedanı bu tünellerde ve mağaralarda barındı."

 yronwood_name:0 "Yronwood"

 yronwood_desc:0 "Yronwood kalesi, Kemik Yolu'nun güney ucunda durur ve başlıca Yronwood Hanedanı'nın makamı olarak hizmet eder."

 brimstone_hall_name:0 "Cehennem Kapısı Salonu"

 brimstone_hall_desc:0 "Kükürt nehri boyunca uzanan Cehennem Kapısı Konağı, Kükürt'ün son kralları Dryland Hanedanı'nın makamıydı. Soyunun Sonuncusu Kral Lucifer Dryland, Nymeria Savaşı'ndaki yenilgisinin ardından Duvar'a gönderildi."

 second_blackfyre_name:0 "İkinci Blackfyre İsyanı"

 second_blackfyre_desc:0 "Bittersteel, Blackfyre Hanedanı'nın kalıntılarını Essos'a götürdüğünde, Demir Taht sahtekârların geri döneceğini biliyordu; bir düğünde, Whitewalls'de dönmeleri şaşırtıcı olacaktı; ancak Uzun Duncan ve yaverinin çabaları sayesinde bu ikinci isyan başlamadan sona erdi."

 dunstonbury_name:0 "Dunstonbury"

 dunstonbury_desc:0 "Manderly Hanedanı'nın atalarının yurdu olan kale, onları Menzil'den kovup kendileri için sahiplenen Peake Hanedanı yüzünden onlara kaybedildi."

 meraxes_death_name:0 "Meraxes'in Ölümü"

 meraxes_death_desc:0 "Meraxes, Aegon 'Fatih'in kız kardeşi-eşi Kraliçe Rhaenys Targaryen'in bindiği dişi bir ejderhaydı. İlk Dorne Savaşı sırasında Meraxes'in gözüne demir bir cıvata isabet etti ve onu anında öldürdü; Kraliçe Rhaenys, ejderha gökten düşünce hayatını kaybetti."

 defiance_duskendale_name:0 "Duskendale'in İsyanı"

 defiance_duskendale_desc:0 "Lord Denys Darklyn, protesto amacıyla vergi ödemeyi bıraktığında Kral II. Aerys Targaryen'i şikâyetlerini dinlemesi için davet etti; ama kral gelir gelmez onu hapsetti. Altı aylık bir çıkmazın ardından kral, Kral Muhafızı Ser Barristan Selmy tarafından cüretkâr bir solo kurtarma göreviyle kurtarıldı."

 red_keep_name:0 "Kızıl Kale"

 red_keep_desc:0 "Kızıl Kale, Kralın Şehri'nde soluk kırmızı taştan inşa edilmiş bir kaledir. Devasa surlarının içinde Maegor'un Kalesi, El'in Kulesi, Beyaz Kılıç Kulesi ve içinde Demir Taht bulunan Büyük Salon yer alır."

 whispers_name:0 "Fısıltılar"

 whispers_desc:0 "Fısıltılar, Çatlak Pençe Burnu'ndaki Crabb Hanedanı'nın harabe bir kalesidir. Efsanelere göre, efsanevi şövalye Ser Clarence Crabb'in eşi, öldürdüğü düşmanlarının kesik başlarını diriltirdi. Başlar daha sonra birbirleriyle konuşarak fısıltıya benzer bir ses çıkarırdı; kale adını bundan alır."

 sunspear_name:0 "Sunspear"

 sunspear_desc:0 "Güneşmızrağı sarayı, Rhoynar'lı Prenses Nymeria'nın Lord Mors Martell ile evlenip Dorne'u hükümdarlıkları altında birleştirmesinden bu yana Nymeros Martell Hanedanı'nın makamıdır."

 starry_sept_name:0 "Yıldızlı Ayin Evi"

 starry_sept_desc:0 "Yüce Aydınlatıcı'nın asıl yurdu olan Yıldızlı Ayin Evi, İnanç'ın atan kalbidir. Siyah mermerden yapılmıştır; Baba'nın Hugor'u kutsamak için yedi yıldızı çektiği gece göğünü çağrıştırır."

 citadel_name:0 "Üstad Kalesi"

 citadel_desc:0 "Üstad Kalesi, üstatların kadim yurdudur. Efsaneye göre, Hightower'ların hükümdarlığının ilk günlerine dayanır ve bugün dünyadaki bilgi ve öğrenimin işaret fenerlerinden biridir."

 seven_shrines_name:0 "Yedi Mabed"

 seven_shrines_desc:0 "Yedi Mabed, tanrıları onurlandırmak için yükseltilmiş, bahçeleriyle ünlü yedi ayin evidir."

 nagga_name:0 "Nagga'nın Tepesi"

 nagga_desc:0 "Deniz Ejderhası Nagga'nın kalıntıları, bir zamanlar Gri Kral'ın salonuna ev sahipliği yapan tepede hâlâ duruyor."

 jonquil_name:0 "Jonquil'in Havuzu"

 jonquil_desc:0 "Yedi Krallık'ın dört bir yanında ve ötesinde, Florian ile Jonquil'in aşk hikâyesi anlatılır. Florian'ın aşkını ilk kez gördüğü havuz işte burasıdır."

 snowy_sept_name:0 "Karlı Ayin Evi"

 snowy_sept_desc:0 "Kuzey'de bulunan tek büyük ayin evi olan Karlı Ayin Evi, Manderly Hanedanı'nın himayesine dayanır ve kış ile kar diyarındaki tüm inananları kabul eder."

 arrival_andals_name:0 "Andalların Gelişi"

 arrival_andals_desc:0 "Andalların gelişi, onların Essos'tan Westeros'a göçünü ifade eder. Andallar, Westeros'a yazıyı, çelik silahları ve Yediler İnancı dinini getirdi. Andallar ile İlk İnsanlar arasındaki savaş yüzlerce yıl sürdü."

 gate_of_gods_name:0 "Tanrıların Kapısı"

 gate_of_gods_desc:0 "Tanrılar Kapısı, Kralın Şehri'nin devasa surlarındaki yedi büyük kapıdan biridir. Karmaşık oymalarla süslenmiş kapı binası ve düşey kapı, içeri giren herkesin hareketlerini izliyor gibi görünen gözler taşır. Kral Yolu, Kralın Şehri'ne kuzeyden Tanrılar Kapısı'ndan girer."

 hammer_waters_name:0 "Suların Çekici"

 hammer_waters_desc:0 "Efsaneye göre, orman çocuklarının yeşilgörenleri, İlk İnsanların Westeros'a göçünü durdurmak için karanlık büyü kullandı ve Kırılma olarak bilinen felaket benzeri bir olaya yol açtı. Bu olay, Dorne'un Kolu'nu parçalayıp Basamak Taşları'nı ve Kırık Kol'u oluşturdu; Westeros'u Essos'tan ayırdı."

 sept_remembrance_name:0 "Anma Tapınağı"

 sept_remembrance_desc:0 "Kralın Şehri'nin ilk ayin evlerinden biri olan Hatıra Ayin Evi, Fatih Aegon'un kız kardeşi-eşi Rhaenys Targaryen'i onurlandırmak için Rhaenys Tepesi'nde inşa edildi. İnanç Ordusu ayaklanması sırasında Savaşçı Oğulları'nın karargâhı olarak kullanılan ayin evi, Kara Dehşet Balerion'un sırtındaki Kral I. Maegor Targaryen tarafından yok edildi."

 sept_baelor_name:0 "Baelor'un Büyük Ayin Evi"

 sept_baelor_desc:0 "Baelor'un Büyük Ayin Evi, Yediler İnancı'nın ibadetinin odak noktası olarak durur. Kralın Şehri'nde bulunur ve Yüce Aydınlatıcı'nın ikametgâhı olarak hizmet eder. Ayin evi, saygıdeğer aydınlatıcı-kral Kutsal Baelor'un onuruna adlandırılmıştır."

 highgarden_name:0 "Highgarden"

 highgarden_desc:0 "Highgarden, Bahçıvan Kral'ların makamıydı; Bahçıvan Garth tarafından yükseltildi. Yaygın olarak tüm diyarın, belki de dünyanın en güzel kalesi olduğu söylenir."

 fair_isle_name:0 "Adil Ada"

 fair_isle_desc:0 "Farman Hanedanı'na ev sahipliği yapan Güzel Ada, Gün Batımı Denizi'nde bir cennettir. Bereketli suları ve bol topraklarıyla adını fazlasıyla hak etmiştir."

 lonely_light_name:0 "Yalnız Işık"

 lonely_light_desc:0 "Yalnızca Demircilerin değil, bilinen dünyanın en batıdaki karakolu olan Yalnız Işık, Farwynd Hanedanı'nın küçük bir limanıdır."

 riverrun_name:0 "Riverrun"

 riverrun_desc:0 "Tully Hanedanı'nın atalarının yurdu Riverrun, Tumblestone ile Kızıl Çatal'ı birleştirerek oluşturulan hendeğiyle ünlüdür."

 wrestling_bears_island_name:0 "Ayı Adası"

 wrestling_bears_island_desc:0 "Ayı Adası, Mormont Hanedanı'nın yurdudur; Westeros'un kuzeybatı kıyısındaki Buz Körfezi'nde yer alır. Kadim meşeler, yükselen çamlar ve engebeli tepelerle karakterize, pitoresk ve izole bir yerdir."

 eyrie_name:0 "Kartal Yuvası"

 eyrie_desc:0 "Kartal Yuvası, Arryn Hanedanı'nın kadim kalesi ve makamıdır. Alttaki vadiden binlerce fit yüksekte, Ay Dağları'na tünemiştir. Konumu nedeniyle çoğu kişi tarafından saldırıya karşı neredeyse geçilmez kabul edilir."

 moon_mountain_name:0 "Ay Dağları"

 moon_mountain_desc:0 "Ay Dağları, Arryn Vadi'sindeki bir dizi dağdır. Çorak ve yaşanmaz olan bu dağlarda, hem Arryn Hanedanı'nın hem de Demir Taht'ın otoritesini reddeden dağlı boyları yaşar."

 kingswood_name:0 "Kral Ormanı"

 kingswood_desc:0 "Kral Ormanı, Kralın Şehri'nin karşısında Kara Su Akıntısı'nın ötesine uzanan, güney kral topraklarını ve kuzey Fırtına Toprakları'nı kapsayan ve Kral Yolu tarafından kesilen uçsuz bucaksız bir ormandır. Ormanda krala ayrılmış özel bir av alanı bulunur."

 tarth_name:0 "Tarth"

 tarth_desc:0 "Safir Ada olarak bilinen Tarth adası, Westeros'un doğu kıyısı açıklarındaki dar denizde yer alır. Fırtına Toprakları'nın bir parçası olan Tarth, Evenfall Konağı'ndaki makamlarından Tarth Hanedanı tarafından yönetilir."

 rainwood_name:0 "Yağmur Ormanı"

 rainwood_desc:0 "Fırtına Toprakları'ndaki Wrath Burnu üzerinde yer alan Yağmur Ormanı, sisli ve verimli ortamıyla ünlü uçsuz bucaksız bir ormandır. Kürkü, kerestesi ve kehribarıyla değerli olan orman, çeşitli bir bitki örtüsüne ev sahipliği yapar."

 dragon_mummer_name:0 "Lord Toland'ın Deli Soytarısı"

 dragon_mummer_desc:0 "İlk Dorne Savaşı sırasında Toland Hanedanı, hileyle ejderhalara direndi. Kral I. Aegon Targaryen, Lord Toland'ın şampiyonuyla karşılaşıp onu kolayca öldürdüğünde, şampiyonun aslında lordun deli soytarısı olduğunu — ve Lord Toland'ın kendisinin kaçtığını keşfetti."

 nymeria_ships_name:0 "Nymeria'nın On Bin Gemisi"

 nymeria_ships_desc:0 "Rhoynar, Valyria Serbest Diyarı tarafından fethedildikten sonra, Prenses Nymeria Rhoynar halkını Dorne'a götürdü. Efsaneye göre, on bin gemilik bir filoyla yola çıktılar; yolculuklarında birçok zorlukla karşılaştılar ve yalnızca az sayıda gemi Westeros'a ulaştı."

 aegonfort_name:0 "Aegon Kalesi"

 aegonfort_desc:0 "Aegon 'Fatih' tarafından dikilen küçük bir tepe-kale olan Aegon Kalesi, onun Westeros'taki ilk tutunma noktasını işaret etti; bugünkü Kızıl Kale'nin bulunduğu yerde, Kralın Şehri'nde yer alıyordu. Aegon'un yendiği düşmanlarının kılıçları Aegon Kalesi'ne gönderildi ve Demir Taht yaratıldı."

 hightower_name:0 "Hightower"

 hightower_desc:0 "İnsan eliyle yapılmış harikalardan biri olan Hightower, Eski Kent şehrinin yükseklerinde durur. Kadim bir siyah taş kalenin kalıntıları üzerine inşa edilmiş olan kule, herkes için bir işaret feneri olarak durur."

 oldtown_name:0 "Eski Şehir"

 oldtown_desc:0 "Eski Kent, Westeros'un en eski ve tartışmasız en büyük şehridir — Üstad Kalesi'ne, Yıldızlı Ayin Evi'ne ve Hightower'a ev sahipliği yapar."

 hornvale_name:0 "Boynuz Vadisi"

 hornvale_desc:0 "Brax Hanedanı'nın yurdu olan Boynuz Vadisi, Kızıl Çatal'ın doğduğu yerdir. Büyük vadi demir açısından zengindir; bu da topraklara kırmızımsı bir renk verir."

 lordsport_name:0 "Lordsport"

 lordsport_desc:0 "Demir Adalar'ın en büyük kasabası olan Lordsport, uzun zamandır Demircilerin başlıca limanıdır."

 fairmarket_name:0 "Adil Çarşı"

 fairmarket_desc:0 "Mavi Çatal'ın kasabası olan bu yer, bir zamanlar Demirci krallarına ev sahipliği yaptı; Nehir Toprakları'nda kilit bir mali merkez olarak hizmet etme konusunda uzun bir geçmişe sahiptir."

 winterfell_name:0 "Winterfell"

 winterfell_desc:0 "Kuzey'in kalbi ve Stark Hanedanı'nın yurdu olan Winterfell, Westeros'un en büyük kalelerinden biridir ve kaplıcaları ile cam bahçeleriyle ünlüdür."

 gulltown_name:0 "Martı Şehri"

 gulltown_desc:0 "Vadi'nin en büyük yerleşimi olan Martı Kenti, aynı zamanda Özgür Şehirler, Kralın Şehri ve Kuzey arasında seyreden gemiler için başlıca uğrak limanıdır."

 morne_name:0 "Morne"

 morne_desc:0 "Tarth adasındaki kadim bir Andal harabesi olan Morne, gizemle örtülüdür. Ünlü kahraman Morne'lu Ser Galladon'un memleketi olması dışında hakkında çok az şey bilinir."

 plankytown_name:0 "Planky Kasabası"

 plankytown_desc:0 "Dornelilerin bir şehre en yakın sahip oldukları şey olduğu söylenen Planky Kasabası, Yeşilkan'ın ağzında hareketli bir ticaret kasabasıdır. Birbirine halatlarla bağlanmış mavnalardan inşa edilen kasaba, nehrin üzerinde yüzer."

 TRAVEL_POINT_OF_INTEREST_TT_agot_poi_dragonlore:0 "Ejderha Açısından Önemli Alan"

 agot_poi_dragonlore_tt:0 "Bir Ejderha Bilgisi Etkinliği tetikleyecek"

 TRAVEL_POINT_OF_INTEREST_TT_agot_poi_wild_dragon:0 "#X Vahşi Ejderha#! "

 agot_poi_wild_dragon_tt:0 "Bu bölgede vahşi, tam yetişkin bir ejderha yaşıyor."
