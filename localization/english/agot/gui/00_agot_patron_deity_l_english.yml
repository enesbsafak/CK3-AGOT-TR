l_english:

 FAITH_PATRON_HEADING:0 "Koruyucu Tanrı Yönünü Seç"

 PATRON_WINDOW_SHOW_EFFECTS:0 "Etkileri Göster"

 FAITH_PATRON:0 "Koruyucu Tanrı Yönleri"

 CHOOSE_PATRON_TOOLTIP:0 "Yön Seç"

 select_patron_confirm_text_1:0 "Yap "

 select_patron_confirm_text_2:0 " koruyucu tanrın yönün?"

 patron_select_confirm:0 "Bu benim koruyucu tanrım!"

 action_pick_patron:0 "Bir Koruyucu Tanrı Yönü Seç"

 action_pick_patron_label:0 "$action_pick_patron$"

 action_pick_patron_desc:0 "Koruyucu tanrıları olan bir inancın takipçisi olarak, koruyucun olması için belirli bir tanrı seçebilirsin."

 action_pick_patron_click:0 "#I Olası koruyucu tanrıları görüntülemek için tıklayın#!"

 patron_god_the_father:0 "Baba"

 patron_god_desc_the_father:0 "Baba ya da Yüce Baba, yargıya hükmeder; inançlılar adalet ve bilgelik dağıtması için sık sık ona yakarır. Çoğu kişi tarafından büyük saygı görür ve kimilerince Yediler'in 'lideri' olarak kabul edilir."

 patron_god_the_mother:0 "Ana"

 patron_god_desc_the_mother:0 "Ana ya da Yüce Ana, sevgi dolu ve koruyucudur; sevdiklerini güvende tutması için sık sık ona yakarılır. Ayrıca bereket ve analık rolleriyle de ilişkilendirilir."

 patron_god_the_warrior:0 "Savaşçı"

 patron_god_desc_the_warrior:0 "Savaşçı, kutsal kılıcıyla inançlıları korur. Cesaret aşılayan, zafer getiren ve savaşın ortasında askerleri koruyan Savaşçı'ya askerler, şövalyeler ve generaller sık sık yakarır."

 patron_god_the_smith:0 "Demirci"

 patron_god_desc_the_smith:0 "Demirci, kutsal çekiciyle kırılan şeyleri onaran ve insanların dünyasını düzene sokan kişidir. Savaşçı ile birlikte, güç ve koruma ile ticaret ve zanaatta yardım için sık sık ona dua edilir."

 patron_god_the_maiden:0 "Bakire"

 patron_god_desc_the_maiden:0 "Güzel ve masum Bakire, genç kadınların koruyucusudur; bakirelere cesaret vermesi ve masumiyetlerini koruması için ya da kadınların iffetsizliklerinin affı için sık sık ona dua edilir."

 patron_god_the_crone:0 "Bilge Kadın"

 patron_god_desc_the_crone:0 "Kocakarı, kutsal lambasıyla bilgeliğiyle inançlılara yol gösterir. Öğretileri sayesinde inançlılar yükselir ve destek bulur."

 patron_god_the_stranger:0 "Yabancı"

 patron_god_desc_the_stranger:0 "Yabancı — ne erkek ne kadın, yine de ikisi birden; sürgün, uzak diyarlardan bir gezgin, insandan az ve fazla — bilinmeyendir ve bilinemezdir. Yüzü ölümün yüzüdür, eli ruhları öbür dünyaya götürendir."

 patron_god_drownedgod:0 "Boğulmuş Tanrı"

 patron_god_desc_drownedgod:0 "Boğulmuş Tanrı, Demir Doğumlular'ın geleneksel tanrısıdır ve Sekiz Yönden biri olarak Denizin ve dehşetinin Yönü olarak görülür."

 patron_god_baelor:0 "Kutsanmış Baelor"

 patron_god_desc_baelor:0 "Septon-Kral, çoğu zaman sıradan bir ölümlü olarak görülse de bu inanç tarafından neredeyse Yedi Yön ile aynı ışıkta kabul edilir."

 patron_god_qarlon:0 "Büyük Qarlon"

 patron_god_desc_qarlon:0 "Tüm Andalların son Kralı ve Essos'ta bir Andal krallığı için son şans olan o, mitik bir kahramana dönüştü: yıkılmış bir geçmişten söz eden Yediler'in bir avatarı."

 patron_god_weirwood_deity:0 "Weirwoodlar"

 patron_god_desc_weirwood_deity:0 "Kurt ağacı, Eski Tanrılar'a inananlar tarafından uzun süredir kutsal sayılır; ancak Eski ve Yeni İnanç'a bağlı olanlara göre onlar, Bir Olan Yediler'in ilk insanları izlediği pencerelerdir."

 patron_god_moon_pale_maiden:0 "Ay Soluklu Bakire"

 patron_god_desc_moon_pale_maiden:0 "Ay tanrıçası; kimileri onun Uzak Doğu'daki Işıktan Yapılmış Bakire tanrıçasının bozulmuş bir biçimi olduğuna inanır. Her ne olursa olsun, takipçileri denizlerde sık sık onun korumasını diler ve ışığının onları eve götüreceğini umar."

 patron_god_lion_of_night:0 "Gecenin Aslanı"

 patron_god_desc_lion_of_night:0 "Gecenin Aslanı, Uzak Doğu'dan gelen bir tanrıydı; insanları Kan İhaneti için cezalandırmak amacıyla Uzun Gece'yi getirdiği söylenir. Kötü bir tanrı olmasa da daha karanlık bir tanrı olarak görülür."

 patron_god_father_of_waters:0 "Suların Babası"

 patron_god_desc_father_of_waters:0 "Suların Babası, denizlerin tanrısıdır. Sakin sular umuduyla denizciler tarafından yüceltilir."

 patron_god_merling_king:0 "Deniz Halkı Kralı"

 patron_god_desc_merling_king:0 "Deniz Halkı Kralı dalgaların altında yaşar ve arada bir eş karşılığında insanlara armağanlar ve lütuflarla yardım ettiği söylenir."

 patron_god_the_pattern:0 "Örüntücü"

 patron_god_desc_the_pattern:0 "Bir tanrı değil; büyük acılar çekerek hayatın, gerçekliğin merkezine ulaşmak için aşılması gereken büyük bir örüntü olduğunu sezmiş bir peygamber."

 patron_god_semosh_and_selloso:0 "Semosh ve Selloso"

 patron_god_desc_semosh_and_selloso:0 "Kardeş tanrılar — birleşik ama yine de ayrı, doğu ve batı, gün doğumu ve gün batımı — Semosh ile Selloso dünyayı aralarında iter ve çeker."

 patron_god_trios:0 "Trios"

 patron_god_desc_trios:0 "Üç Yüzlü Tanrı Trios'un kendini üçe böldüğü söylenir. Her yüz farklı bir duyguyu temsil eder: Neşe, Öfke ve Şaşkınlık."

 patron_god_drunken_god:0 "Sarhoş Tanrı"

 patron_god_desc_drunken_god:0 "Sarhoş Tanrı sık sık küçümsenir, oysa ona bağlananlar en sadık inançlılardan bazılarıdır."

 patron_god_weeping_lady:0 "Ağlayan Leydi"

 patron_god_desc_weeping_lady:0 "Ağlayan Leydi, Lys'in baş tanrısıdır ve sikkelerini süsler. Kötülük için, sevinç için ve ikisi arasındaki her şey için ağlar."

 patron_god_pantera:0 "Pantera"

 patron_god_desc_pantera:0 "Pantera, tapınımı Lys'te yoğunlaşmış, altı göğüslü bir kedi tanrıçasıdır."

 patron_god_yyndros:0 "Yyndros"

 patron_god_desc_yyndros:0 "Alacakaranlığın Yyndros'u gündüz erkek, gece kadındır. Ona tapanlar, sevişme sırasında erkek ve kadın arasında dönüşebilir."

 patron_god_bakkalon:0 "Bakkalon"

 patron_god_desc_bakkalon:0 "Solgun Çocuk, Kılıcın Bakkalon'u, kılıcı hepimizin üzerinde sallanan bir ölüm tanrısıdır."

 patron_god_saagael:0 "Saagael"

 patron_god_desc_saagael:0 "Acının Vericisi Saagael, Özgür Şehirler'in en aşırı kültlerinden birinin odağıdır."

 patron_god_aquan:0 "Kızıl Boğa Aquan"

 patron_god_desc_aquan:0 "Kızıl Boğa Aquan, Özgür Şehirler'in pek çok savaşçısı ve paralı askeri tarafından tapınılan bir savaş ve çarpışma tanrısıdır."

 patron_god_hooded_wayfarer:0 "Kukuletalı Gezgin"

 patron_god_desc_hooded_wayfarer:0 "Yoksullar ve kimsesizlerce tapınılan Kukuletalı Gezgin, görünmeden ve fark edilmeden aramızda yürür."

 patron_god_silent_god:0 "Sessiz Tanrı"

 patron_god_desc_silent_god:0 "Sessiz Tanrı takipçileriyle konuşmaz; yine de gerçeği bulmalarına izin verir."

 patron_god_gelenei:0 "Gelenei"

 patron_god_desc_gelenei:0 "Gelenei'nin, genellikle gümüş yapraklı bir ağaçla temsil edilen bir doğa tanrısı olduğu söylenir."

 patron_god_pearl_emperor:0 "İnci İmparator"

 patron_god_desc_pearl_emperor:0 "Yeryüzündeki Tanrı'nın haleflerinin ilki olan İnci İmparator, büyük bilgeliği ve saltanatı boyunca bilgide elde edilen büyük ilerlemelerle hatırlanır."

 patron_god_jade_emperor:0 "Yeşim İmparator"

 patron_god_desc_jade_emperor:0 "İkinci Halef olan Yeşim İmparator'un, pek çok yabancı toprağı ve halkı kılıçla değil sözle Büyük Şafak İmparatorluğu'na kattığı söylenir."

 patron_god_tourmaline_emperor:0 "Turmalin İmparator"

 patron_god_desc_tourmaline_emperor:0 "Üçüncü Halef olan Turmalin İmparator, Mücevherli Saray'ın daima tetikte şampiyonu idi. Kılıç, yay ya da mızrak — hangi silahla olursa olsun, en ölümcül tehdit olduğu söylenir."

 patron_god_onyx_emperor:0 "Oniks İmparator"

 patron_god_desc_onyx_emperor:0 "Dördüncü Halef olan Oniks İmparator, imparatorluğu dışarıdaki ordulardan içerideki isyanlara dek pek çok tehdide karşı savundu. Orduları her girişimde zafere taşıdı."

 patron_god_topaz_emperor:0 "Topaz İmparator"

 patron_god_desc_topaz_emperor:0 "Topaz İmparator, Beşinci Halef olarak selefinin kazanımlarını devraldı ve Büyük Şafak İmparatorluğu'nun her yanında düzeni ve medeniyeti yeniden tesis etti."

 patron_god_opal_emperor:0 "Opal İmparator"

 patron_god_desc_opal_emperor:0 "Altıncı Halef olan Opal İmparator, imparatorluk genelinde bugün hâlâ ayakta duran ya da zamana yenik düşen harikalar inşa etti."

 patron_god_amethyst_empress:0 "Ametist İmparatoriçe"

 patron_god_desc_amethyst_empress:0 "Son ve Yedinci Halef olan Ametist İmparatoriçe kalıcı bir miras bırakmadı, ancak şimdi Mücevherli Saray'ın kurtarıcısı ve olabilecekler için bir umut sembolü olarak görülür."

 patron_god_itaya:0 "Itaya"

 patron_god_desc_itaya:0 "Itaya, Yaz Adaları'nın Baş Tanrıçası ve Bereket Tanrıçası'dır. O, Yazın Anası'dır."

 patron_god_qunda:0 "Qunda"

 patron_god_desc_qunda:0 "Qunda, Yaz Adaları'nda Diriliğin Tanrısı'dır."

 patron_god_tolaq:0 "Tolaq"

 patron_god_desc_tolaq:0 "Tolaq, Yaz Adaları'nda Zenginlik Tanrısı'dır."

 patron_god_dhosu:0 "Dhosu"

 patron_god_desc_dhosu:0 "Dhosu, Olacakların Tanrısı'dır ve Yaz Adaları'nda Qhubar'ın kardeşidir."

 patron_god_qhubar:0 "Qhubar"

 patron_god_desc_qhubar:0 "Qhubar, Bilgi Tanrıçası'dır ve Yaz Adaları'nda Dhosu'nun kız kardeşidir."

 patron_god_chatana:0 "Chatana"

 patron_god_desc_chatana:0 "Chatana, Yayın ve Savaşın Tanrıçası'dır ve Yaz Adaları'nı başta köle tacirleri olmak üzere tüm tehditlerden korur."

 patron_god_hulabhar:0 "Hulabhar"

 patron_god_desc_hulabhar:0 "Hulabhar, Yaz Adaları'nın Düzenbaz Tanrısı'dır."

 patron_god_xholthar:0 "Xholthar"

 patron_god_desc_xholthar:0 "Xholthar, Ölüm ve Gece Tanrısı'dır ve Yaz Adaları'nın son koruyucusudur."

 patron_god_anayana:0 "Anayana"

 patron_god_desc_anayana:0 "Anayana, Suların ve Denizcilerin Tanrıçası'dır. Kuğu gemileri onun onuruna adanmıştır."

 patron_god_qoanasa:0 "Qoanasa"

 patron_god_desc_qoanasa:0 "Qoanasa, Gizli Yol'un Tanrıçası'dır; takipçilerine Yedi Krallık'ta cadı denirdi."
