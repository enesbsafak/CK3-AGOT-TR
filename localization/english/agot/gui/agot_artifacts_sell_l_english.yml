 agot_events_artifacts_sell.1001.t:0 "Ejderha Yumurtası Satılıyor"

 agot_events_artifacts_sell.1001.desc.1:0 "Myr Hazine Borsası'ndan Hazine Muhafızı, bir grup değerleme uzmanını diyarıma getirir. Ejderha yumurtamı dikkatle inceleyip gerçekliğini doğrulamaya çalışırlar. Ardından Hazine Muhafızı bana şöyle der:\n\n"

 agot_events_artifacts_sell.1001.desc.2:0 ""Bu gerçek bir ejderha yumurtası, #bold paha biçilmez#!; ve onu en yüksek piyasa fiyatından satın almaya razıyız.""

 agot_events_artifacts_sell.1001.desc.3:0 ""Bu gerçekten kıymetli bir ejderha yumurtası, ama bizim için #italic o kadar#! nadir değil. Hâlâ satmak istersen, onu en yüksek tarihî fiyatın yüzde yetmişiyle alırız.""

 agot_events_artifacts_sell.1001.desc.4:0 ""Bu gerçek bir ejderha yumurtası ve değerinin ölçülemez olduğunu düşünebilirsiniz, ama biz #italic ardı ardına#! böyle yumurtalar gördük. Onu en fazla tarihî fiyatın yüzde ellisiyle satın alabiliriz.""

 agot_events_artifacts_sell.1001.desc.5:0 ""Bu tür şeyleri defalarca gördük; kıymetliler, ama size üzülerek bildiririz ki artık satın almayacağız; kasalarımız çoktan onlarla doldu. Orijinal fiyatın yüzde on beşine satmaya razı olmadıkça...""

 agot_events_artifacts_sell.1001.a:0 "Bu tekliften memnunum."

 agot_events_artifacts_sell.1001.b:0 "Belki zarara gireceğim, ama şartlar beni zorluyor; bunu yapmak zorundayım."

 agot_events_artifacts_sell.1001.c:0 "Teklifin çok düşük olduğunu düşünüyorum, ama ne yazık ki başka seçeneğim yok."

 agot_events_artifacts_sell.1001.d:0 "Peki... tamam... kabul ediyorum."

 agot_events_artifacts_sell.1001.e:0 "Ejderha yumurtamı satmayacağım."

 agot_events_artifacts_sell.1002.t:0 "Ejderha Yumurtası Satılıyor"

 agot_events_artifacts_sell.1002.desc:0 "Myr Hazine Borsası'ndan Hazine Muhafızı, ejderha yumurtanı görmeye gelmeyi reddetti. Özürlerini bildiren bir mektup gönderdiler, ancak şu anda daha fazla ejderha yumurtası satın almaya niyetli değiller."

 agot_events_artifacts_sell.1002.a:0 "Kahretsin!"

 agot_events_artifacts_sell.1003.t:0 "Valyria Çeliği Kılıcı Satılıyor"

 agot_events_artifacts_sell.1003.desc:0 "Valyria Çeliği'nden kılıcımı biraz altın karşılığında satmak istediğimi duyan tüm saray mensuplarım, beni bu işten caydırmak için hep bir ağızdan konuştu.\n"

 agot_events_artifacts_sell.1003.desc.westeros:0 "Bir [ROOT.Char.GetLadyLord] olarak, Valyria Çeliği'nden bir kılıç satmak beni Westeros'un her yanında mutlaka küçük düşürür, hatta hanedanıma utanç getirir."

 agot_events_artifacts_sell.1003.desc.essos:0 "Bir [ROOT.Char.GetLadyLord] olarak, Valyria Çeliği'nden bir kılıç satmak beni Essos'un her yanında mutlaka küçük düşürür, hatta aileme utanç getirir."

 agot_events_artifacts_sell.1003.desc.else:0 "Bir [ROOT.Char.GetLadyLord] olarak, Valyria Çeliği'nden bir kılıç satmak beni tüm dünyada mutlaka küçük düşürür, hatta hanedanıma utanç getirir."

 agot_events_artifacts_sell.1003.a:0 "Kararımı verdim."

 agot_events_artifacts_sell.1003.b:0 "Bu gerçekten #bold kötü#! bir karar."

 agot_events_artifacts_sell.0005.opening:0 "En içten taziyelerimle,"

 agot_events_artifacts_sell.0005.desc:0 "Davranışların, Myr Hazine Borsası'nın saygıdeğer Hazine Muhafızlarını tamamen çileden çıkardı. Bundan böyle ailen, Borsa'da ticaret yapmaktan kalıcı olarak men edildi."

 agot_events_artifacts_sell.0005.a:0 "Ne hakkında konuştuklarını bilmiyorum..."

 agot_stolen_artifact_from_artifact_keeper_desc:0 "Ailen, Myr Hazine Borsası tarafından kara listeye alındı."

 house_be_banned_exchange_artifact:0 "Bunun sonucunda aile, hazine borsası tarafından kara listeye alındı."

 targs_sold_dargon_egg:0 "Satılan Ejderha Yumurtası"

 agot_events_artifacts_sell.0006.opening:0 "En içten taziyelerimle,"

 agot_events_artifacts_sell.0006.desc:0 "Ailendeki [who_hurt_artifact_keeper.GetName]'in rezil davranışları, ailenin Myr Hazine Borsası ile ilişkisini sonsuza dek lekeledi. Bundan böyle ailen, Hazine Borsası tarafından kara listeye alınacak."

 agot_events_artifacts_sell.0006.a:0 "O iğrenç korkak!"

 agot_stolen_artifact_from_artifact_keeper_dec_desc:0 "Ailen kara listeye alınmadı."

 agot_artifact_value_breakdown_head:0 "Fiyat Dökümü"

 agot_events_artifacts_sell.0007.opening:0 "Büyük üzüntüyle,"

 agot_events_artifacts_sell.0007.desc:0 "Size üzülerek bildiririm ki Myr Hazine Borsası'nın şu anda eserinizi satın alacak yeterli fonu bulunmuyor. Gelecekte dostane ticari ilişkileri sürdürmeyi içtenlikle diliyoruz."

 agot_events_artifacts_sell.0007.a:0 "Anlıyorum."

 agot_no_money_buy_artifact_from_artifact_keeper_desc:0 "Eserin satılmadı."

 agot_sell_artifacts_cooldown_tooltip:0 "Son bir yıl içinde zaten bir eser sattın."

 agot_buy_artifacts_ban_tooltip:0 "@warning_icon! İnancın, eser satın almanı engelliyor."

 agot_events_artifacts_sell.0008.opening:0 "En içten dileklerimle,"

 agot_events_artifacts_sell.0008.desc:0 "Size üzülerek bildiririm ki kasalarınızdaki tüm hazine ve üstüne abartılı vaatlerinizle bile bu eseri satın almaya yetecek kadar mal varlığınız yok."

 agot_events_artifacts_sell.0008.a:0 "Başka ne diyebilirim ki..."

