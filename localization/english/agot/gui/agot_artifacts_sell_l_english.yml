 agot_artifact_keeper_head_text:0 "Hazine Muhafızı"

 agot_artifact_welcome_word_text:0 "Myr Borsası'na hoş geldiniz, lordum. Ben Myr Borsası'nın Hazine Muhafızı'yım. Tüm eser işlemlerini yönetirim ve değerli her eseri satın alırım.\n\nGörev unvanımın da ima ettiği gibi bu eserleri korurum; eğer uygunsuz niyetleriniz olursa, siz ve aileniz kalıcı olarak kara listeye alınır ve bir daha hazine işlemleri yapamazsınız."

 agot_not_wilding_desc_trigger_desc:0 "Bir yabanıl değilsin"

 agot_events_artifacts_sell.1004.t:0 "Ejderha Yumurtası Satılıyor"

 agot_events_artifacts_sell.1004.desc:0 "Ejderha yumurtası satmak istediğimi öğrenen Myr Borsası'nın Hazine Muhafızı, çabucak sarayıma geldi."

 agot_events_artifacts_sell.1004.desc.first:0 "Ejderha yumurtalarını gerçekten satmak istediğimi teyit ettikten sonra [GetGlobalVariable('agot_artifact_keeper').Char.GetSheHe], sanki bir şakayla karşılaşmış gibi garip bir ifadeyle bana baktı. Öfkemi bastırdım ve [GetGlobalVariable('agot_artifact_keeper').Char.GetHerHis] teklifini dinledim."

 agot_events_artifacts_sell.1004.desc.others:0 "Hazine Muhafızı sarayıma kibirli bir tavırla girdi ve utanmadan benimle alay etmeye başladı: "Ejderha binicileri çocuklarını da mı satmak ister? Pazar bulamama diye bir derdin olmasın""

 agot_events_artifacts_sell.1004.a:0 "Onu sana satacağım."

 agot_events_artifacts_sell.1004.b:0 "Cehenneme git!"

 agot_events_artifacts_sell.1004.common.tt:0 "Myr Hazine Borsası tarafından kara listeye alınacaksın"

 agot_events_artifacts_sell.1004.b.tt:0 "Hazine muhafızını yakacaksın"

 agot_events_artifacts_sell.1004.c:0 "Muhafız, [GetGlobalVariable('agot_artifact_keeper').Char.GetHerHim] herkese ibret olacak şekilde başını kes!"

 agot_events_artifacts_sell.1004.d:0 "Ejderha yumurtalarımı satacağımı sana kim söyledi?"

 targs_burn_artifact_keeper:0 "Eser muhafızını yaktın"

 agot_trags_kill_artifact_keeper_desc:0 "Myr Hazine Borsası tarafından kara listeye alındın."

 agot_events_artifacts_sell.1005.opening:0 "Myr Hazine Borsası'ndan Mektup"

 agot_events_artifacts_sell.1005.desc:0 "Aile üyen [agot_artifact_killer.GetName]'in davranışları yüzünden, bizimle ticaret yapman yasaklandı."

 agot_events_artifacts_sell.1005.a:0 "Anlıyorum."
