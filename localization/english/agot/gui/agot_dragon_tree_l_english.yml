### TODO NOT-IN-ST: game_concept_dragon_matriarch_desc [AGOT: $game_concept_dragon_matriarchs$ are the known founders of [dragon_family_trees|E]. As such, collectively they are responsible for all other dragons in the world.\n\nIf a hatchling is born without a known grandmother, the mother of the hatchling will become a $game_concept_dragon_matriarch$ and a new $game_concept_dragon_family_tree$ will be recorded for the mother and their child.]
 game_concept_dragon_matriarch_desc:0 "$game_concept_dragon_matriarchs$ are the known founders of [dragon_family_trees|E]. As such, collectively they are responsible for all other dragons in the world.\n\nIf a hatchling is born without a known grandmother, the mother of the hatchling will become a $game_concept_dragon_matriarch$ and a new $game_concept_dragon_family_tree$ will be recorded for the mother and their child."
