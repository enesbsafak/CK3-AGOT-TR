### TODO NOT-IN-ST: game_concept_dragon_family_tree_desc [AGOT: $game_concept_dragon_family_trees$ are the recorded lineages of [dragons_plural|E]. As such, they contain and display all of the dragons which descended from the [dragon_matriarchs|E] that founded their respective tree.\n\nWhen a hatchling is born and their mother already belongs to a tree, the hatchling will be added to the existing tree. If a dragon hatchling is born and their mother does not belong to a tree, the hatchling will be added to a newly created tree of which their mother becomes the $game_concept_dragon_matriarch$.]
 game_concept_dragon_family_tree_desc:0 "$game_concept_dragon_family_trees$ are the recorded lineages of [dragons_plural|E]. As such, they contain and display all of the dragons which descended from the [dragon_matriarchs|E] that founded their respective tree.\n\nWhen a hatchling is born and their mother already belongs to a tree, the hatchling will be added to the existing tree. If a dragon hatchling is born and their mother does not belong to a tree, the hatchling will be added to a newly created tree of which their mother becomes the $game_concept_dragon_matriarch$."
