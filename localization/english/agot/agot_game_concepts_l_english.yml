### TODO NOT-IN-ST: game_concept_dragon_desc [AGOT: $game_concept_dragons_plural$ are magical beasts, famously used by the dragonlords of old Valyria in their conquest of the known world. To see one is to see fire made flesh, to ride one is to be a master of your destiny and a shaper of the world.\n\nEach dragon will have their own [personality|E], [traits|E], and [education|E], which will affect their [draconic_dread|E], [temperament|E], and [taming_chance|E]. A dragon's [dragon_combat_effectiveness|E] will affect its use in combat, and will increase as it ages and gains [dragon_size|E].\n\nThere are three [dragon_type|E]: [wild_dragon|E], [owned_dragon|E], and [tamed_dragon|E]. Tamed and owned dragons can be stored in a [dragonpit|E] if one is available.]
 game_concept_dragon_desc: "$game_concept_dragons_plural$ are magical beasts, famously used by the dragonlords of old Valyria in their conquest of the known world. To see one is to see fire made flesh, to ride one is to be a master of your destiny and a shaper of the world.\n\nEach dragon will have their own [personality|E], [traits|E], and [education|E], which will affect their [draconic_dread|E], [temperament|E], and [taming_chance|E]. A dragon's [dragon_combat_effectiveness|E] will affect its use in combat, and will increase as it ages and gains [dragon_size|E].\n\nThere are three [dragon_type|E]: [wild_dragon|E], [owned_dragon|E], and [tamed_dragon|E]. Tamed and owned dragons can be stored in a [dragonpit|E] if one is available."
