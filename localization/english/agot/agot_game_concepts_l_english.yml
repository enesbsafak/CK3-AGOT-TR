### TODO NOT-IN-ST: game_concept_owned_dragon_desc [AGOT: $game_concept_owned_dragons$ are dragons that are owned by a [ruler|E] with a [dragonpit|E], but have not been tamed by a [GetTrait('dragonrider').GetName(GetNullCharacter)]. They will remain in their owner's capital. $game_concept_owned_dragons$ cannot be used in combat or to travel, but are easier to tame than $game_concept_wild_dragons$. Characters who have not tamed a [dragon|E] will be able to interact with an owned dragon in their court either to try to form a bond with them, or to tame them directly.\n\nThey are one of the three types of [dragon|E]. The other two are [wild_dragons|E] and [tamed_dragons|E].]
 game_concept_owned_dragon_desc:0 "$game_concept_owned_dragons$ are dragons that are owned by a [ruler|E] with a [dragonpit|E], but have not been tamed by a [GetTrait('dragonrider').GetName(GetNullCharacter)]. They will remain in their owner's capital. $game_concept_owned_dragons$ cannot be used in combat or to travel, but are easier to tame than $game_concept_wild_dragons$. Characters who have not tamed a [dragon|E] will be able to interact with an owned dragon in their court either to try to form a bond with them, or to tame them directly.\n\nThey are one of the three types of [dragon|E]. The other two are [wild_dragons|E] and [tamed_dragons|E]."
