l_english:
 game_concept_personal_steward:0 "Kişisel Kahya"
 game_concept_personal_steward_desc:0 "The $game_concept_personal_steward$, [realm|E]'in Lord Kumandanı'nın ihtiyaçlarıyla ilgilenen [councillor|E]'dir."
 game_concept_agot_knight:0 "Şövalye"
 game_concept_agot_knights:0 "Şövalyeler"
 game_concept_agot_knightspossessive:0 "Şövalyenin"

 game_concept_agot_knight_desc:0 "The $game_concept_agot_knight$, kendisine şövalyelik onur unvanı bahşedilmiş bir [character|E]'dir.\n\nŞövalyelik, [GetFaithDoctrine('tenet_knighthood').GetBaseName] ilkesine sahip inançlar tarafından yüceltilse de, herhangi bir karakter inancı ne olursa olsun bir başka şövalye ya da bir hükümdar tarafından şövalye ilan edilebilir.\n\nBir şövalye en fazla iki [squires|E] alabilir ve onları #V karakter etkileşimleri#! ve #V olaylar#! aracılığıyla şövalyeliğin yollarında eğitebilir.\n\nBir karakter, 16 yaş ve üzerindeyken — ya da olağanüstü yüksek [prowess|E] değerine sahipse 12 yaşında — ve elverişsiz özelliklere sahip değilse şövalye olabilir. Şövalyelik; yaverlik, turnuva [prizes|e], [battles|e], şövalyelerin teklifleri veya unvanı doğrudan satın alarak elde edilebilir."
 game_concept_squire:0 "Yaver"
 game_concept_squires:0 "Yaverler"
 game_concept_squirepossessive:0 "Yaverin"

 game_concept_squire_desc:0 "Bir [squire|e], [agot_knight|e] olmak için eğitim gören bir [character|e]'dir. Bir şövalyenin yardımcısı olarak, ister sıradan ister şanlı olsun tüm görevlerde ona destek olurlar. Yaverler, şövalyelerine [GetModifier('agot_has_squire_modifier').GetNameWithTooltip] adlı bir değiştirici sağlar. \n\nBir karakter, 9 ile 21 yaşları arasında yaver olabilir.\n\nYaver olarak, şövalyeliğe doğru ilerlemelerini — özellik deneyimi biçiminde temsil edilen — artıran veya azaltan #V olaylar#! otomatik olarak alırlar. Bu olaylar ayrıca bir yaverin [martial_skill|e], [diplomacy_skill|e] ve/veya [prowess_skill|e] becerilerini de geliştirebilir.\n\nBir yaverin şövalyeliğe yolculuğu [traits|e] ve [personality|e] özelliklerinden etkilenir; bazı karakterler bunun üstesinden diğerlerinden daha iyi gelir!"
 game_concept_agot_dynastic_stability:0 "Hanedan İstikrarı"

 game_concept_agot_dynastic_stability_desc:0 "Hanedan istikrarı, babasoylu [succession|E] ile yönetilen bir krallıkta [houses|E]'in hayatta kalmasını sağlayan bir mekanikdir.\n\nDaha küçük bir hanenin üyesi, atalarından bağlarla bağlı olduğu daha büyük bir hanenin [title|E]'ini miras alırsa, o büyük hanenin adını alır."
 game_concept_agot_legitimate_house:0 "Meşru Hane"

 game_concept_agot_legitimate_house_desc:0 "Westeros, hükümdarları meşruiyetlerini yalnızca çağdaş güçten değil, sahiplendikleri kadim kan bağlarından alan kadim bir diyardır. The $game_concept_agot_legitimate_house$, bir [title|E]'in meşru hükümdarları sayılan [house|E]'dir. Bir unvanın $game_concept_agot_legitimate_house$ üyeleri, o unvan üzerinde atalardan kalma bir hak iddiasına sahiptir; ilgili krallığı yönetmeyi daha kolay bulur ve unvanı kaybederlerse hak iddiacıları için ek destek görürler.\n\nBir unvanın $game_concept_agot_legitimate_housei olmayan bir hane o unvanı kontrol ederse, o unvanın $game_concept_agot_legitimate_housei olma yolunda ilerleme kaydetmeye başlar. Bu ilerleme, unvanın geçmişinde görülebilir ve çeşitli etkenlere bağlıdır. O hane unvanı bir kez kaybederse, $game_concept_agot_legitimate_house$ olma yolundaki tüm ilerlemeleri yitirilir."
 game_concept_agot_legitimate_house_the_north_remembers:0 "Kuzey Hatırlar"
 game_concept_agot_legitimate_house_the_north_remembers_desc:0 "Kuzey, inatçı insanların yaşadığı inatçı bir diyardır. Hükümdarlarını kolay unutmaz ve yeni bir [agot_legitimate_house|E]'ye diğer krallıklardan daha yavaş ısınır."
 game_concept_agot_legitimate_house_iron_price:0 "Demir Bedel"
 game_concept_agot_legitimate_house_iron_price_desc:0 "Demir doğumlular, tacı alacak güce sahip olanların onu takmaya layık olduğuna inanır. Anakaranın kadim kan bağlarıyla pek ilgilenmezler ve yeni bir [agot_legitimate_house|E]'ye diğer krallıklardan daha çabuk ısınırlar."
 game_concept_agot_landed_knight:0 "Toprak Sahibi Soylular"
 game_concept_agot_landed_knights:0 "Toprak Sahibi Soylular"

 game_concept_agot_landed_knight_desc:0 "The $game_concept_agot_landed_knights$, [liege|E] lordlarının hizmetinde bir kaleyi ve ona bağlı toprakları elinde tutan [characters|E]'dir. Konumları kalıtsal olsa ve $game_concept_agot_landed_knights$ kendi köylülerine ve askerlerine komuta edebilse de, Westeros soyluluğunun en alt basamağında kalırlar — tam anlamıyla lord değildirler — ve böyle bir mevkinin getirdiği [prestige|E] eksikliğinden sık sık mustarip olurlar.\n\nDerebeylerinin izni olmadan mahkûmları idam etme hakları yoktur ve evlilik konusunda çoğunlukla daha yüksek soylular lehine göz ardı edilirler.\n\nKuzey'de ve Demir Adalar'da en yaygın olarak 'Efendi' diye anılırlar. Güneyde ise genellikle 'Ser' diye hitap edilir; resmi şövalyelikleri yoksa 'Muhafız' unvanını alırlar."
 game_concept_lord_commander:0 "Kral Muhafızı Lord Kumandanı"
 game_concept_lord_commander_desc:0 "The $game_concept_lord_commander$, kraliyet ailesinin kişisel savunmasından sorumlu olan ve onları canları pahasına koruyan seçkin [knights|E]'ten oluşan küçük bir birliğe komuta eden [councillor|E]'dir."
 game_concept_kingsguard:0 "Kral Muhafızı"
 game_concept_kingsguardpossessive:0 "Kral Muhafızının"
 game_concept_kingsguard_desc:0 "The $game_concept_kingsguard$, derebeylerinin hizmetine yemin eden ve canını onlarınki için feda etmeyi taahhüt eden, krallığın en büyük savaşçılarından oluşan bir topluluktur."
 game_concept_maester:0 "Üstat"
 game_concept_maesters:0 "Üstatlar"

 game_concept_maester_desc:0 "Westeros'un Zihin Şövalyeleri: Kale'nin Üstatları, bilimin en ileri noktasında eğitilir ve sınırları zorlamaya devam ederler. Boyunlarında bu öğretinin yükünü, emeklerini ve görevlerini simgeleyen metal halkalar hâlinde taşırlar; Yedi Krallık'ın dört bir yanındaki saraylara atanarak yerleşik lordlara şifacı, eğitmen ve danışman olarak hizmet ederler. Kendi adlarını daha büyük bir iyilik uğruna bir kenara bırakmış, bilgi hatırına güçlülerle oda toplantıları yürüten bilginler ağı."
 game_concept_monastery_holding:0 "Manastır"
 game_concept_monastery:0 "Manastır"
 game_concept_monasteries:0 "Manastırlar"
 game_concept_monastery_holdings:0 "Manastır Toprakları"

 game_concept_monastery_holding_desc:0 ""
 game_concept_unknown_holding:0 "Bilinmiyor"
 game_concept_unknown:0 "Bilinmiyor"
 game_concept_unknown_holdings:0 "Bilinmeyen Topraklar"
 game_concept_unknown_holding_desc:0 "Bu krallığın toprağı bilinmiyor; diplomatik görüş alanının ötesinde kalıyor."
 game_concept_wilderness_holding:0 "Vahşi Doğa"
 game_concept_wilderness:0 "Vahşi Doğa"
 game_concept_wildernesses:0 "Vahşi Doğalar"
 game_concept_wilderness_desc:0 "Sahipsiz ve son derece seyrek nüfuslu, geniş ve boş bir diyar."
 game_concept_wilderness_holdings:0 "Vahşi Doğa Toprakları"
 game_concept_wilderness_holding_desc:0 "Vahşi doğa toprakları tamamen verimsizdir; potansiyellerini açığa çıkarmak için [colonization|E] sırasında bir [settlement_holding|E] ile değiştirilmeleri gerekir."
 game_concept_settlement_holding:0 "Yerleşim"
 game_concept_settlement:0 "Yerleşim"
 game_concept_settlements:0 "Yerleşimler"
 game_concept_settlement_holdings:0 "Yerleşim Toprakları"
 game_concept_settlement_holding_desc:0 "Yerleşim Toprakları, [colonization|E] sürecinin bir parçası olarak kurulan küçük karakolları, kasabaları ve kolonileri temsil eder.\n\nDiğer [holding_types|E]'den daha az verimlidirler; ancak tüm [colonization_blockers|E]'in temizlenmesi ve [county_development|E] artırılması, verimliliklerinin büyümesini sağlar ve sonunda standart bir [holding|E]'e dönüştürülmelerine imkân tanır."
 game_concept_ruin_holding:0 "Harabe"
 game_concept_ruin_holding_desc:0 "Uzun zaman önce unutulup terk edilmiş, eski halinin yalnızca bir gölgesi olan toprak. Harabelerin kendisiyle etkileşime girilerek [reconstruction_effort|E] başlatılabilir."
 game_concept_ruin:0 "Harabe"
 game_concept_ruins:0 "Harabeler"
 game_concept_ruin_holdings:0 "Harap Topraklar"
 game_concept_ruin_holdings_desc:0 "Uzun zaman önce unutulup terk edilmiş, eski hallerinin yalnızca birer gölgesi olan topraklar."
 game_concept_ruin_reconstruction:0 "Harabe Onarımı"
 game_concept_ruin_reconstruction_desc:0 "Bir harabenin [buildings|E]'ini yükselterek, harabe uygun bir toprağa yeniden inşa edilebilir, ancak bu süreç uzun ve zahmetlidir.\n\nYeniden inşaya başlamak için harabeyi elinde tutan harabe karakterine tıkla; bu seni başka bir pencereye götürür. Orada 'Harabeleri Onar' düğmesine tıkla."
 game_concept_reconstruction:0 "Harabe Onarımı"
 game_concept_reconstruction_desc:0 "Bir harabenin [buildings|E]'ini yükselterek, harabe uygun bir toprağa yeniden inşa edilebilir, ancak bu süreç uzun ve zahmetlidir.\n\nYeniden inşaya başlamak için harabeyi elinde tutan harabe karakterine tıkla; bu seni başka bir pencereye götürür. Orada 'Harabeleri Onar' düğmesine tıkla."
 game_concept_reconstruction_effort:0 "Harabe Onarımı"
 game_concept_reconstruction_effort_desc:0 "Bir harabenin [buildings|E]'ini yükselterek, harabe uygun bir toprağa yeniden inşa edilebilir, ancak bu süreç uzun ve zahmetlidir.\n\nYeniden inşaya başlamak için harabeyi elinde tutan harabe karakterine tıkla; bu seni başka bir pencereye götürür. Orada 'Harabeleri Onar' düğmesine tıkla."
 game_concept_colonization:0 "Koloni Kurma"
 game_concept_colonize:0 "Koloni Kur"
 game_concept_colony:0 "Kolon"
 game_concept_colonization_desc:0 "Kolonizasyon, [independent_ruler|E] bir hükümdarın [realm|E]'ini komşu [wilderness|E] [counties|E]'e doğru genişletme yöntemidir.\n\n[gold|E] cinsinden yapılan ilk yatırımın ardından bir [settlement_holding|E] kurulabilir ve [county|E] hükümdarın [domain|E]'ine katılır. Başlangıçta bu yerleşim verimsiz olur ve [holding|E] içinde standart [buildings|E] inşa edilemez. Bunun yerine, yeni yerleşimde [development|E] artırmak ve mevcut [colonization_blockers|E]'i temizlemek için zaman ve [gold|E] yatırımı yapılmalıdır.\n\nTüm engeller temizlendiğinde, [settlement_holding|E] tamamen geliştirildiğinde ve koloni [county_development|E] değeri üç veya daha yükseğe ulaştığında, yerleşim standart bir [holding|E]'e dönüştürülebilir."
 game_concept_colonization_blocker:0 "Kolonizasyon Engelleyicisi"
 game_concept_colonization_blockers:0 "Kolonizasyon Engelleyicileri"
 game_concept_blockers:0 "Engelleyiciler"
 game_concept_colonization_blocker_desc:0 "Kolonizasyon Engelleyicileri, bölgenin [colonization|E]'ine engel teşkil eden [wilderness|E] [counties|E]'indeki [buildings|E]'dir.\n\nBu engelleyiciler kontluğa olumsuz [modifiers|E] uygular; verimliliğini düşürür ve standart bir [holding|E]'e dönüştürülmesini engeller."
 game_concept_ongoing_colonies:0 "Devam Eden Koloniler"
 game_concept_settlement_holding_limit:0 "Yerleşim Sınırı"

 game_concept_settlement_holding_limit_i:0 "@hud_wilderness! [Character.MakeScope.Var('num_settled_wilderness').GetValue]/[Character.MakeScope.ScriptValue('settlement_title_tier_limit')|0]"
 game_concept_settlement_holding_limit_desc:0 "Bir [ruler|E]'in herhangi bir anda tutabileceği yerleşim sayısı, unvan seviyesine göre belirlenir.\n\n$EFFECT_LIST_BULLET$Bir #bold [count|E] #![additional_settlement_upkeep|E] ödemeden en fazla 1 [settlement_holding|E] tutabilir.\n\n$EFFECT_LIST_BULLET$Bir #bold [duke|E] #![additional_settlement_upkeep|E] ödemeden en fazla 2 [settlement_holdings|E] tutabilir.\n\n$EFFECT_LIST_BULLET$Bir #bold [king|E] #![additional_settlement_upkeep|E] ödemeden en fazla 3 [settlement_holdings|E] tutabilir.\n\n$EFFECT_LIST_BULLET$Bir #bold [emperor|E] #![additional_settlement_upkeep|E] ödemeden en fazla 4 [settlement_holdings|E] tutabilir."
 game_concept_additional_settlement_upkeep:0 "Ek Bakım"
 game_concept_additional_settlement_upkeep_desc:0 "Ek bakım, çok fazla [settlement_holdings|E] tutulması nedeniyle aylık gelirde meydana gelen düşüşü ifade eder.\n\nBakım, [realm|E] ekonomisini mahvetmeye başlarsa hükümdarlar yerleşim topraklarını #V terk edebilir#!."
 game_concept_bastard_house:0 "Piç Kol"
 game_concept_bastard_branch:0 "Piç Kol"
 game_concept_bastard_houses:0 "Piç Kollar"
 game_concept_bastard_branches:0 "Piç Kollar"
 game_concept_bastard_house_desc:0 "[bastard|E] üyeleri çocuk sahibi olduklarında kendi [house|E]'lerini kurarlar. Bu yan kollar, [cadet_branches|E] gibi işler — daha büyük hanedan içinde ayrı bir kol olarak faaliyet gösterirler."
 game_concept_reaving:0 "Yağma"

 game_concept_reaving_desc:0 "Hükümdarların yakın bir kıyıyı yağmalamak için sefere çıktığı bir [activity|E].\n\nBu etkinliğin başlıca amacı [gold|E] yağmalamaktır.\n\nBir [ruler|E], yakın akrabalarını, [courtiers|E]'i, [guests|E]'i ve [vassals|E]'i davet eder."
 game_concept_admiral:0 "Amiral"
 game_concept_admirals:0 "Amiraller"

 game_concept_admiral_desc:0 "The $game_concept_admiral$, deniz ve donanma işlerinden sorumlu [councillor|E]'indir. [fleet|E]'inin Büyük Kaptanı ve ordularının [embark|E] zamanlarının denetçisidir."
 game_concept_castellan:0 "Kale Muhafızı"

 game_concept_castellan_desc:0 "The $game_concept_castellan$, senin sağ kolun sıfatıyla hareket eden [councillor|E]'indir. Yeteneklerine bağlı olarak çeşitli [councillor_tasks|E]'i yerine getirebilir, senin ağzından konuşabilir ve senin elinle hareket edebilir."
 activity_kinguard_bodyguard_name:0 "Koruma Görevleri"
 activity_kinguard_bodyguard:0 "Koruma Görevleri"
 activity_location_set:0 "Gezgin"
 activity_location_set_name:0 "Gezgin"
 game_concept_agot_personal_coa:0 "Kişisel Arma"
 game_concept_agot_personal_coa_desc:0 "The $game_concept_agot_personal_coa$, [house|e] yerine bireye ait bir dizi hanedan armasıdır.\n\nBir oyuncu kendi kişisel armalarını dilediği gibi özelleştirebilir; ancak bazen — lakapları veya doğum sıraları gibi — başka koşullara bağlı olarak da bir arma bahşedilebilir."
 game_concept_pirate_den_holding:0 "Korsan İni"
 game_concept_pirate_den:0 "Korsan İni"
 game_concept_pirate_dens:0 "Korsan İnleri"
 game_concept_pirate_den_holdings:0 "Korsan İnleri"
 game_concept_pirate_den_holding_desc:0 "Korsan inleri, korsanların karaya çıkmak zorunda kaldıklarında toplandıkları, hafif tahkim edilmiş kamplar olan standart [holding_type|E]'dir. [GetGovernment( 'pirate_government' ).GetName] [rulers|E] için mevcut olan başlıca toprak türüdür."
 game_concept_dragon:0 "Ejderha"
 game_concept_dragons_plural:0 "Ejderhalar"
 game_concept_dragon_type:0 "Ejderha Türleri"

 game_concept_dragon_type_desc:0 "The $game_concept_dragons_plural$ üç farklı türde gelir: [wild_dragons|E], [owned_dragons|E] ve [tamed_dragons|E]. Bir ejderhanın türü; dünyayla nasıl etkileşime girdiğini, bir [ruler|e]'in onunla nasıl etkileşebileceğini ve savaşta kullanılıp kullanılamayacağını etkiler."
 game_concept_wild_dragon:0 "Yaban Ejderhası"
 game_concept_wild_dragons:0 "Vahşi Ejderhalar"

 game_concept_wild_dragon_desc:0 "The $game_concept_wild_dragons$, hiçbir [ruler|E]'e ait olmayan, doğal halleriyle yaşayan ejderhalardır. Dünyayı özgürce dolaşabilirler, ancak inlerine yakın durmayı tercih ederler. Vahşi bir ejderha savaşta kullanılamaz veya seyahat edilemez; avlanma menzilindeki herhangi bir [ruler|E] veya [realm|E] için büyük ölçüde bir tehlike oluşturur.\n\nÜç [dragon|E] türünden biridirler. Diğer ikisi [owned_dragons|E] ve [tamed_dragons|E]'dir.\n\nBir [dragonpit|E]'e sahip hükümdar, bir $game_concept_wild_dragonı yakalayıp $game_concept_owned_dragona dönüştürmeyi deneyebilir; yakınlardaki hükümdarlar ve [courtiers|E] ise onu doğrudan ehlileştirmeyi deneyebilir."
 game_concept_owned_dragon:0 "Sahiplenilen Ejderha"
 game_concept_owned_dragons:0 "Sahipli Ejderhalar"

 game_concept_owned_dragon_desc:0 "The $game_concept_owned_dragons$, bir [dragonpit|E]'e sahip bir [ruler|E] tarafından sahiplenilen, ancak bir [GetTrait('dragonrider').GetName(GetNullCharacter)] tarafından ehlileştirilmemiş ejderhalardır. Sahiplerinin başkentinde kalırlar. The $game_concept_owned_dragons$ savaşta kullanılamaz veya seyahat edilemez; ancak $game_concept_wild_dragonsdan daha kolay ehlileştirilirler. Bir [dragon|E] ehlileştirmemiş karakterler, saraylarındaki sahipli bir ejderhayla ya onunla bağ kurmayı denemek ya da onu doğrudan ehlileştirmek için etkileşime geçebilir.\n\nÜç [dragon|E] türünden biridirler. Diğer ikisi [wild_dragons|E] ve [tamed_dragons|E]'dir."
 game_concept_tamed_dragon:0 "Ehlileştirilmiş Ejderha"
 game_concept_tamed_dragons:0 "Ehlileştirilmiş Ejderhalar"

 game_concept_tamed_dragon_desc:0 "The $game_concept_tamed_dragons$, bir [GetTrait('dragonrider').GetName(GetNullCharacter)] tarafından ehlileştirilmiş ejderhalardır. Binicileri bir [ruler|E] ise başkentlerinde kalırlar; değilse binicilerinin işvereninin başkentinde kalırlar. Bir [army|E]'de olmadıkları veya [travel|E] için kullanılmadıkları sürece böyledir.\n\nÜç [dragon|E] türünden biridirler. Diğer ikisi [wild_dragons|E] ve [owned_dragons|E]'dir. Ehlileştirilmiş ejderhalar, bir [dragonpit|E]'te tutulmazken binicileri ölürse vahşileşir."
 game_concept_dragon_size:0 "Ejderha Boyu"
 game_concept_dragons_size:0 "Ejderhanın Boyu"

 game_concept_dragon_size_desc:0 "The $game_concept_dragon_size$, bir [dragon|E]'ın fiziksel boyutudur. Ejderhanın uzunluğunun, kanat açıklığının ve ağırlığının ortak bir ölçüsüdür. Bir ejderhanın boyu; [dragon_combat_effectiveness|E] ile birlikte [draconic_dread|E] ve [taming_chance|E] değerlerini büyük ölçüde etkiler.\n\nBir ejderha asla büyümeyi bırakmaz; ancak yaşlandıkça büyüme hızı yavaşlar. İnsan yapımı bir [dragonpit|E]'te tutulan ejderhalar, vahşi doğada veya [natural_dragonpit|E]'te büyüyenlerden daha yavaş büyür."

 game_concept_dragon_size_i:0 "@dragon_size_stat_icon!"

 game_concept_dragon_size_lists_i:0 "@dragon_size_lists_icon! [Character.MakeScope.ScriptValue('dragon_size')|0]"
 game_concept_dragon_combat_effectiveness:0 "Savaş Etkinliği"

 game_concept_dragon_combat_effectiveness_desc:0 "The $game_concept_dragon_combat_effectiveness$, bir [dragon|E]'ın savaştaki etkinliğinin ölçüsüdür. Büyük ölçüde [dragons_size|E]'den etkilenir; ancak [traits|E] ve [GetTrait('dragonrider').GetName(GetNullCharacter)] deneyiminden de etkilenebilir. Yüksek savaş etkinliğine sahip bir ejderha, muharebede daha etkili olur."

 game_concept_dragon_combat_effectiveness_num:0 "[Character.MakeScope.Var('current_dragon').Char.MakeScope.ScriptValue('dragon_combat_effectiveness')|0]"

 game_concept_dragon_combat_effectiveness_i:0 "@dragon_combat_effectiveness_stat_icon!"

 game_concept_dragon_combat_effectiveness_lists_i:0 "@dragon_combat_effectiveness_lists_icon!  [Character.MakeScope.ScriptValue('dragon_combat_effectiveness')|0]"
 game_concept_draconic_dread:0 "Ejderha Dehşeti"

 game_concept_draconic_dread_desc:0 "The $game_concept_draconic_dread$, bir hükümdarın değil, bir [dragon|E]'ın sahip olduğu [dread|E]'dir. Yaratığın insanların yüreklerine saldığı içsel korkuyu temsil eder. Büyük ölçüde [dragons_size|E]'i yansıtsa da [personality|E] ve yaptıklarından da etkilenebilir."

 game_concept_draconic_dread_i:0 "@draconic_dread_stat_icon!"

 game_concept_draconic_dread_lists_i:0 "@draconic_dread_lists_icon! [Character.MakeScope.ScriptValue('draconic_dread')|0]"
 game_concept_temperament:0 "Mizaç"

 game_concept_temperament_desc:0 "The $game_concept_temperament$, bir [dragon|E]'ın sergilediği genel huy ve tutumdur. Pozitif değerler daha sosyal bir ejderhaya işaret ederken, negatif mizaca sahip bir ejderha daha vahşi ve inatçı bir yaratıktır. Bir ejderhanın mizacı; [education|E], [personality|E] ve deneyimlerinden etkilenir."

 game_concept_temperament_i:0 "@temperament_stat_icon!"

 game_concept_temperament_lists_i:0 "@temperament_lists_icon! [Character.MakeScope.ScriptValue('temperament')|0]"
 game_concept_taming_chance:0 "Ehlileştirme Şansı"

 game_concept_taming_chance_desc:0 "The $game_concept_taming_chance$, bir [dragon|E]'ın ehlileştirilme ve bağ kurulma olasılığıdır. Daha yüksek bir ehlileştirme şansı, insan etkileşimine daha açık bir ejderhaya işaret ederken; daha düşük bir şans, en güçlü iradeler dışında herkesin ehlileştirmekte zorlanacağı bir ejderhayı temsil eder. Bir ejderhanın ehlileştirme şansı; [education|E], [personality|E] ve deneyimlerinden etkilenir."
 game_concept_dragonpit:0 "Ejderha Çukuru"
 game_concept_dragonpits:0 "Ejderha Çukurları"

 game_concept_dragonpit_desc:0 "The $game_concept_dragonpit$, hem [owned_dragons|E] hem [tamed_dragons|E] barındırmak için kullanılan bir [building|E]'dir. Bu binaların inşası çok pahalıdır; ancak tamamlandığında sahibine ejderhaları için artırılmış güvenlik, benzersiz etkileşimler ve bir $head_dragonkeeper_court_position$ [court_position|E] atama imkânı sağlar. Özellikle, binicisinin ölmesi hâlinde ehlileştirilmiş bir ejderhayı sahipli bir ejderha olarak tutmanın tek yoludur.\n\nDragonstone'daki Ejderha Dağı, türünün tek örneği olan bir [natural_dragonpit|E] işlevi görür."

 game_concept_dragon_pit:0 "$game_concept_dragonpit$"

 game_concept_dragon_pit_desc:0 "$game_concept_dragonpit_desc$"
 game_concept_natural_dragonpit:0 "Doğal Ejderha Çukuru"
 game_concept_natural_dragonpits:0 "Doğal Ejderha Çukurları"

 game_concept_natural_dragonpit_desc:0 "The $game_concept_natural_dragonpit$, bir [dragonkeepers|E] tarikatının [dragons_plural|E] barındırmak ve korumak için doğal mağaralardan yararlandığı bir [dragonpit|E]'dir. [dragons_size|E] değeri, insan yapımı bir ejderha çukuruna kapatılmış bir ejderha kadar zarar görmez."
 game_concept_anti_dragon_maa:0 "Ejderha Karşıtı"

 game_concept_anti_dragon_maa_desc:0 "[dragons_plural|E] tehdidiyle mücadele etmek için özel olarak inşa edilen [men_at_arms|E]. Bu alaylar, amaçlanan düşmanla karşılaşmadıkça değerlerini göstermez; ancak bir [army|E], bir ejderhayla karşı karşıya kaldığında onu korumayı umabilecek çok az şey vardır."
 game_concept_dragon_gender:0 "Ejderha Cinsiyeti"

 game_concept_dragon_gender_desc:0 "Kale'nin [maesters|E]'i uzun zamandır [dragons_plural|E]'ın gerçek doğasını tartışıyor; kimileri gerektiğinde erkek ile dişi arasında değiştiklerine, kimileri ise hiçbir belirli cinsiyete sahip olmadıklarına inanıyor. Tarihsel olarak yumurta bıraktığı gözlemlenen ejderhalara dişi denilmiştir; ancak dişi olduğu bilinen bazı ejderhalar yumurta bırakmamıştır.\n\nHer ne olursa olsun, insanların gelenekleri ejderhaların gerçekten de cinsiyetlerine göre ayrıldığını kabul eder; bu yüzden, bir binici ya da bir kavrama aksini söyleyene dek bu şekilde anılırlar."
 game_concept_dragonblood:0 "Ejderha Kanı"

 game_concept_dragonblood_desc:0 "The $game_concept_dragonblood$, bir [character|e]'in ya bir [GetTrait('dragonrider').GetName( GetNullCharacter )|LV]'den ya da [GetModifier('dragonrider_house_modifier').GetNameWithTooltip|L] değiştiricisine sahip bir [house|E]'ten geldiğini gösteren bir işarettir."
 game_concept_authorized_tamer:0 "Yetkili Ehlileştirici"

 game_concept_authorized_tamer_desc:0 "The $game_concept_authorized_tamer$, yasalarından bağımsız olarak belirli bir [dragonpit|e]'e erişim için özel izin verilmiş bir [character|e]'dir. Ejderha çukurunun sahibi bu ayrıcalığı dilediği zaman kaldırabilir.\n\nBir karakter, aynı anda yalnızca bir ejderha çukurunun $game_concept_authorized_tameri olabilir."
 game_concept_dragonkeeper:0 "Ejderha Bekçisi"
 game_concept_dragonkeepers:0 "Ejderha Bekçileri"

 game_concept_dragonkeeper_desc:0 "The $game_concept_dragonkeepers$ Tarikatı, [dragonpits|E]'in ve barındırılan tüm [dragons_plural|E]'ın bakımını denetlemekle görevlidir. Tarikat, göreve başladığında çeşitli [dragonpit_interactions|E]'i açan bir $head_dragonkeeper_court_position$ tarafından yönetilir."
 game_concept_dragonpit_interactions:0 "Ejderha Çukuru Etkileşimleri"

 game_concept_dragonpit_interactions_desc:0 "The $game_concept_dragonpit_interactions$, bir [character|E]'in $head_dragonkeeper_court_position$ [court_position|E]'i işe almasıyla açılan bir dizi [interactions|E]'dir. Bu etkileşimler, bir [dragonpit|e] sahibine daha ince bir kontrol derecesi sağlar.\n\n$EFFECT_LIST_BULLET$#V Ejderha Bilgisi Öğret #!Etkileşimi — Çocuklara, torunlara veya [house|E] üyelerine Ejderha Bilgisi öğret.\n$EFFECT_LIST_BULLET$#V Ejderha Çukuruna Erişimi Yasakla #!Etkileşimi — Normalde çukurun [laws|e] nedeniyle erişimi olan bir karakterin erişimini kısıtla.\n$EFFECT_LIST_BULLET$#V Ejderha Çukuru Yasağını Kaldır #!Etkileşimi — Yasaklanmış bir karakterin ejderha çukuruna erişimini geri ver.\n$EFFECT_LIST_BULLET$#V Ejderha Çukuruna Erişim Ver #!Etkileşimi — Bir karakteri belirli bir ejderha çukurunun [authorized_tamer|E]'i yap.\n$EFFECT_LIST_BULLET$#V Çukura Yumurta Gönder #!Etkileşimi — Bir ejderha yumurtası [artifact|e]'ini, kendi kendine çatlayabileceği ya da güvende tutulması için çukura gönder.\n$EFFECT_LIST_BULLET$#V Çukurdan Yumurta Al #!Etkileşimi — Çukura konmuş bir yumurtayı ejderha çukurundan geri al."

 game_concept_story_content_robert_baratheon_282:0 "$game_concept_story_generic_prefix$ $bookmark_282_robert_baratheon$"

 game_concept_story_content_robert_baratheon_282_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nRobert Baratheon olarak, Aerys II Targaryen ve sadıklarına karşı savaşacaksın. Savaş boyunca, Targaryen Hanesi'ne karşı zafere — ya da yenilgiye — doğru ilerlerken senaryolu hikâye olayları tetiklenecek."

 game_concept_story_content_rhaegar_targaryen_282:0 "$game_concept_story_generic_prefix$ $bookmark_282_rhaegar_targaryen$"

 game_concept_story_content_rhaegar_targaryen_282_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nRhaegar Targaryen olarak, Robert Baratheon ve müttefiklerine karşı savaşta babana, Aerys II Targaryen'e katılacaksın. Devam eden savaş ve krallığın kaderiyle ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_aerys_targaryen_282:0 "$game_concept_story_generic_prefix$ $bookmark_282_aerys_targaryen$"

 game_concept_story_content_aerys_targaryen_282_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nAerys II Targaryen olarak, Robert Baratheon ve müttefiklerinin güçlerine karşı savaşacaksın. Çatışma boyunca, isyancılara karşı zafere — ya da yenilgiye — doğru ilerlerken savaş, krallık ve ailenle ilgili senaryolu hikâye olayları tetiklenecek."

 game_concept_story_content_tywin_lannister_282:0 "$game_concept_story_generic_prefix$ $bookmark_282_tywin_lannister$"

 game_concept_story_content_tywin_lannister_282_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nTywin Lannister olarak, dostken rakibe dönüşen Aerys II Targaryen, Robert Baratheon önderliğindeki isyancı lordlar ittifakına karşı savaşırken tarafsız bir gözlemcisin. Savaş ilerledikçe tarafsızlığın ve savaşa katılma isteğinle ilgili hikâye olaylarıyla karşılaşabilirsin."

 game_concept_story_content_eddard_stark_282:0 "$game_concept_story_generic_prefix$ $bookmark_282_eddard_stark$"

 game_concept_story_content_eddard_stark_282_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nNed Stark olarak, ömür boyu dostun Robert Baratheon'un yanında Aerys II Targaryen'e karşı savaşacaksın. Kayıp kız kardeşin Lyanna Stark'ın kaderiyle ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_aegon_targaryen_259:0 "$game_concept_story_generic_prefix$ $bookmark_259_aegon_targaryen$"

 game_concept_story_content_aegon_targaryen_259_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nAegon V Targaryen olarak ailen, krallık ve en derin arzuların arasında denge kurmalısın. Ailen ve hükümdarlığınla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_maelys_blackfyre_259:0 "$game_concept_story_generic_prefix$ $bookmark_259_maelys_blackfyre$"

 game_concept_story_content_maelys_blackfyre_259_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nMaelys Blackfyre olarak, senin olanı — Yedi Krallık'ı — geri almak için müttefiklerinin yanında savaşacaksın. Çevrendeki krallıkların fethine imkân tanıyan ve nihai hedefin olan Westeros için bir savaşla sonuçlanan senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_viserys_targaryen_109:0 "$game_concept_story_generic_prefix$ $bookmark_106_viserys_targaryen$"

 game_concept_story_content_viserys_targaryen_109_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nI. Viserys Targaryen olarak, büyükbabandan Jaehaerys Targaryen'den miras kalan bir barış içindeki krallığın hükümdarısın. Ailen ve onların maceralarıyla — yani kardeşin Prens Daemon Targaryen'le — ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_daemon_targaryen_109:0 "$game_concept_story_generic_prefix$ $bookmark_106_daemon_targaryen$"

 game_concept_story_content_daemon_targaryen_109_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nDaemon Targaryen olarak, Adımtaşlar üzerinde hak iddia eden, Triarchy tarafından desteklenen korsanlara karşı savaşacaksın. Fetihlerin ilerledikçe hükümdarlığın ve ailenle ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_corlys_velaryon_109:0 "$game_concept_story_generic_prefix$ $bookmark_106_corlys_velaryon$"

 game_concept_story_content_corlys_velaryon_109_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nCorlys Velaryon olarak, Adımtaşlar üzerinde hak iddia eden, Triarchy tarafından desteklenen korsanlara karşı Daemon Targaryen'in yanında savaşacaksın. Fetihlerin ilerledikçe süregelen savaşlardaki rolünle ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_craghas_drahar_109:0 "$game_concept_story_generic_prefix$ $bookmark_106_craghas_drahar$"

 game_concept_story_content_craghas_drahar_109_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nCraghas Drahar olarak, Daemon Targaryen ve Corlys Velaryon'un istilacı güçlerine karşı savaşacaksın. Zafere — ya da yenilgiye — doğru ilerlerken savaşla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_duncan_the_tall_211:0 "$game_concept_story_generic_prefix$ $bookmark_211_duncan_tall$"

 game_concept_story_content_duncan_the_tall_211_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nUzun Duncan olarak, Eustace Osgrey ile Rohanne Webber arasındaki anlaşmazlıkla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_eustace_osgrey_211:0 "$game_concept_story_generic_prefix$ $bookmark_211_eustace_osgrey$"

 game_concept_story_content_eustace_osgrey_211_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nEustace Osgrey olarak, komşun Rohanne Webber'le bir toprak anlaşmazlığıyla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_daemon_blackfyre_211:0 "$game_concept_story_generic_prefix$ $bookmark_211_daemon_blackfyre$"

 game_concept_story_content_daemon_blackfyre_211_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nDaemon Blackfyre olarak, I. Daemon Blackfyre'ın halefi olarak yerinin durumuyla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_rohanne_webber_211:0 "$game_concept_story_generic_prefix$ $bookmark_211_rohanne_webber$"

 game_concept_story_content_rohanne_webber_211_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nRohanne Webber olarak, evlilik durumun ve komşun Eustace Osgrey'le bir toprak anlaşmazlığıyla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_tytos_lannister_259:0 "$game_concept_story_generic_prefix$ $bookmark_259_tytos_lannister$"

 game_concept_story_content_tytos_lannister_259_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nTytos Lannister olarak, büyük hırslara sahip kibirli vasallarla uğraşan bir lordsun. Savaşın patlak vermesine yol açabilecek, vasallarından birkaçının durumu ve konumuyla ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_roger_reyne_259:0 "$game_concept_story_generic_prefix$ $bookmark_259_roger_reyne$"

 game_concept_story_content_roger_reyne_259_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nRoger Reyne olarak, derebeyin Tytos Lannister'e pek saygı duymayan hırslı bir lordsun. Bağlılığınla ilgili, derebeyine karşı bir isyana yol açabilecek senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_maekar_targaryen_233:0 "$game_concept_story_generic_prefix$ $bookmark_233_maekar_targaryen$"

 game_concept_story_content_maekar_targaryen_233_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nI. Maekar Targaryen olarak, filizlenen bir ayaklanmayla ve yaklaşan bir veraset kriziyle başa çıkmalısın. İsyan ve seçtiğin varisle ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_aerys_targaryen_277:0 "$game_concept_story_generic_prefix$ $bookmark_277_aerys_targaryen$"

 game_concept_story_content_aerys_targaryen_277_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nAerys II Targaryen olarak, çökmekte olan limanını kurtarmak için bir ferman talep eden Denys Darklyn tarafından esir tutuluyorsun. Esaretin, Kralın Eli'nin ve oğlun ile varisinin eylemleri etrafında dönen senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_rhaegar_targaryen_277:0 "$game_concept_story_generic_prefix$ $bookmark_277_rhaegar_targaryen$"

 game_concept_story_content_rhaegar_targaryen_277_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nRhaegar Targaryen olarak, baban Kral Aerys II Targaryen'i kurtarmaya nasıl yaklaşacağına karar vereceksin. Onun kurtarılması — ya da kurtarılamaması — ve hem Duskendale'in hem de krallığın kaderiyle ilgili büyük kararlar içeren senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_denys_darklyn_277:0 "$game_concept_story_generic_prefix$ $bookmark_277_denys_darklyn$"

 game_concept_story_content_denys_darklyn_277_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nDenys Darklyn olarak, Kral Aerys II Targaryen'i rehin aldın. Kralı koz olarak kullanıp krallıkta daha büyük bir konum için mücadele ederken, taleplerin ve bunların kabul edilip edilmemesiyle ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_tywin_lannister_277:0 "$game_concept_story_generic_prefix$ $bookmark_277_tywin_lannister$"

 game_concept_story_content_tywin_lannister_277_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nTywin Lannister olarak, hapsedilen Kral Aerys II Targaryen'e Kralın Eli olarak hizmet ediyorsun ve kralın güvenle serbest bırakılması için Denys Darklyn'le yüzleşmek sana düşüyor. Kralın kurtarılması — ve girişimlerinin yankıları — ile ilgili senaryolu hikâye olaylarıyla karşılaşacaksın."

 game_concept_story_content_lyonel_baratheon_236:0 "$game_concept_story_generic_prefix$ $bookmark_236_lyonel_baratheon$"

 game_concept_story_content_lyonel_baratheon_236_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nLyonel Baratheon olarak, hanenin onurunu geri kazanmaya kararlı bir lordsun. Kaynayan isyan etrafında dönen senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_aegon_v_236:0 "$game_concept_story_generic_prefix$ $bookmark_236_aegon_targaryen$"

 game_concept_story_content_aegon_v_236_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nAegon V Targaryen olarak, çocuklarının yanlışlarının sonuçlarıyla yüzleşmelisin. Büyüyen isyanla ilgili senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_bittersteel_236:0 "$game_concept_story_generic_prefix$ $bookmark_236_bittersteel$"

 game_concept_story_content_bittersteel_236_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nAegor Rivers olarak, Altın Şirket'in Kaptan-General'isin. Kral III. Daemon'un hırsına bağlı senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_daemon_blackfyre_236:0 "$game_concept_story_generic_prefix$ $bookmark_236_daemon_blackfyre$"

 game_concept_story_content_daemon_blackfyre_236_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nKral III. Daemon Blackfyre olarak, Blackfyre Ordusu'na liderlik ediyorsun. Demir Taht'ı geri alma hırsına bağlı senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_lyonel_baratheon_239:0 "$game_concept_story_generic_prefix$ $bookmark_239_lyonel_baratheon$"

 game_concept_story_content_lyonel_baratheon_239_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nLyonel Baratheon olarak, hanenin onurunu geri kazanmaya kararlı bir lordsun. Kaynayan isyan etrafında dönen senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_aegon_v_239:0 "$game_concept_story_generic_prefix$ $bookmark_239_aegon_targaryen$"

 game_concept_story_content_aegon_v_239_desc:0 "#tooltip_heading Hikâye Tarzı: Kapsamlı#!\n\nAegon V Targaryen olarak, çocuklarının yanlışlarının sonuçlarıyla yüzleşmelisin. Büyüyen isyanla ilgili senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_bloodraven_239:0 "$game_concept_story_generic_prefix$ $bookmark_239_bloodraven$"

 game_concept_story_content_bloodraven_239_desc:0 "#tooltip_heading Hikâye Tarzı: Orta#!\n\nBrynden Rivers olarak, Gece Nöbeti'nin yeni seçilen Lord Kumandanı'sın. Görülerinle ilgili senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_bittersteel_239:0 "$game_concept_story_generic_prefix$ $bookmark_239_bittersteel$"

 game_concept_story_content_bittersteel_239_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nAegor Rivers olarak, Altın Şirket'in Kaptan-General'isin. Canavar Maelys'in hırsına bağlı senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_garlan_tyrell_239:0 "$game_concept_story_generic_prefix$ $bookmark_239_garlan_tyrell$"

 game_concept_story_content_garlan_tyrell_239_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nGarlan Tyrell olarak, krala sadakat ile Gülümseyen Fırtına'nın safına geçmek arasında seçim yapmalısın. Aegon Targaryen'in çocuklarının nişanlarıyla ilgili senaryolu hikâye olayları deneyimleyeceksin."

 game_concept_story_content_runceford_redwyne_239:0 "$game_concept_story_generic_prefix$ $bookmark_239_runceford_redwyne$"

 game_concept_story_content_runceford_redwyne_239_desc:0 "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nRunceford Redwyne olarak, kızın Olenna, Daeron Targaryen ile nişanlı — ancak bu hızla değişebilir ve buna göre hareket etmelisin. Aegon Targaryen'in çocuklarının nişanlarıyla ilgili senaryolu hikâye olayları deneyimleyeceksin."
 game_concept_nw_govt:0 "Gece Nöbetçileri"
 game_concept_nw_govt_desc:0 "The $game_concept_nw_govt$ [government_form|E] altında, en üstteki [liege|E], [land|E]'i yönetmeleri ve korumaları için [vassals|E]'e dağıtır. Bu yönetim biçiminde yalnızca Gece Nöbeti'nin yeminli kardeşleri unvan sahibi olabilir ve öldüklerinde unvanları derebeylerine geri döner."

 game_concept_nw_govt_i:0 "@nights_watch_government!"
 game_concept_pirate_govt:0 "Korsan"
 game_concept_pirate_govt_desc:0 "The $game_concept_pirate_govt$ [government_form|E] altında, [rulers|E] seçimli bir [succession|E] biçimiyle, benzersiz korsan [buildings|E]'iyle sınırlandırılır ve yalnızca [pirate_den_holdings|E] tutabilir. Bu kısıtlamalara rağmen korsan hükümdarlar [raid|E] yapabilir ve fetih [casus_belli|E] kullanabilir.\n\nKorsanlar ayrıca, bu $game_concept_government_form$ için topraksız oynanışı mümkün kılan bir [domicile|E]'e, [agot_landless_pirate_domicile|E]'e erişebilir."

 game_concept_pirate_govt_i:0 "@pirate_government!"
 game_concept_pirate_no_dlc_govt:0 "Özgür Korsan"
 game_concept_pirate_no_dlc_govt_desc:0 "The $game_concept_pirate_govt$ [government_form|E] altında, [rulers|E] seçimli bir [succession|E] biçimiyle, benzersiz korsan [buildings|E]'iyle sınırlandırılır ve yalnızca [pirate_den_holdings|E] tutabilir. Bu kısıtlamalara rağmen korsan hükümdarlar [raid|E] yapabilir ve fetih [casus_belli|E] kullanabilir."

 game_concept_pirate_no_dlc_govt_i:0 "@pirate_government!"
 game_concept_citadel_govt:0 "Meclis"
 game_concept_citadel_govt_desc:0 "The $game_concept_citadel_govt$, üstatlar tarikatını temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_citadel_govt_i:0 "@the_citadel_government!"
 game_concept_kg_govt:0 "Kral Muhafızı"
 game_concept_kg_govt_desc:0 "The $game_concept_kg_govt$, Demir Taht hükümdarının seçkin muhafız tarikatını temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_kg_govt_i:0 "@kingsguard_government!"
 game_concept_command_govt:0 "Komuta"
 game_concept_command_govt_desc:0 "The $game_concept_command_govt$, bir unvanı denetleyen atanmış bir komutanı temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_command_govt_i:0 "@command_government!"
 game_concept_silent_sisters_govt:0 "Sessiz Kız Kardeşlik"
 game_concept_silent_sisters_govt_desc:0 "The $game_concept_silent_sisters_govt$, Yedililer İnancı'nda ölülerle ilgilenen kadın tarikatını temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_silent_sisters_govt_i:0 "@silent_sisters_government!"
 game_concept_ruins_govt:0 "Harabe"
 game_concept_ruins_govt_desc:0 "The $game_concept_ruins_govt$, harabeye dönmüş ve onarılana dek Muhafızlar tarafından bakılan krallıkları temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_ruins_govt_i:0 "@ruins_government!"
 game_concept_unknown_govt:0 "Bilinmiyor"
 game_concept_unknown_govt_desc:0 "The $game_concept_unknown_govt$, diplomatik menzilinin sınırlarının ötesindeki krallıkları temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_unknown_govt_i:0 "@unknown_government!"
 game_concept_wilderness_govt:0 "Vahşi Doğa"
 game_concept_wilderness_govt_desc:0 "The $game_concept_wilderness_govt$, ıssız ya da bir yönetim biçimini sürdüremeyecek kadar seyrek nüfuslu krallıkları temsil eden oynanamaz bir yönetim biçimidir."

 game_concept_wilderness_govt_i:0 "@wilderness_government!"
 game_concept_agot_spoils_of_war:0 "Savaş Ganimetleri"

 game_concept_agot_spoils_of_war_desc:0 "$game_concept_agot_spoils_of_war$ is an event that can fire following a claimant's victory over [empire|E] and [hegemony|E] tier [titles|e]. The top 3 war attackers who achieved a minimum 10% war score may request certain boons from the newly crowned claimant.\n\nThese boons include:\n$EFFECT_LIST_BULLET$#V Gold#!\n$EFFECT_LIST_BULLET$#V A small council position#!\n$EFFECT_LIST_BULLET$#V A royal marriage#!\n$EFFECT_LIST_BULLET$#V Place a family member into the [kingsguard|E]#!\n$EFFECT_LIST_BULLET$#V A lord paramountcy#!"
 game_concept_agot_mega_wars:0 "Mega Savaş"

 game_concept_agot_mega_wars_desc:0 "Mega savaş, büyük bir krallık içindeki küçük veya büyük şiddette olabilen geniş çaplı bir çatışmadır: Güçlü imparatorluklar bir [Concept('agot_major_mw', 'major')|E] savaşa sürüklenirken, diğerleri bir [Concept('agot_minor_mw', 'minor')|E] savaşa sürüklenir. Savaşın etkisi o kadar ağır kabul edilir ki her katılımcı bir taraf seçmek zorundadır veya bir [Concept('agot_major_mw', 'major')|E] savaşta tarafsız kalabilir.\nSavaşın sonunda kazanan taraf, kaybeden tarafın cezalandırılması konusunda genişletilmiş seçeneklere sahiptir."
 game_concept_agot_major_mw:0 "Büyük Mega Savaş"

 game_concept_agot_major_mw_desc:0 "Büyük bir [Concept('agot_mega_wars', 'Mega War')|E]'de krallık üç tür katılımcıya ayrılır: [Concept('agot_loyalists', 'Loyalists')|E], [Concept('agot_neutrals', 'Neutrals')|E], [Concept('agot_rebels', 'Rebels')|E].\nSavaş sırasında tarafsızlar hâlâ bir taraf seçebilir ve ilk kararlarına bağlı değildir."
 game_concept_agot_minor_mw:0 "Küçük Mega Savaş"

 game_concept_agot_minor_mw_desc:0 "Küçük bir [Concept('agot_mega_wars', 'Mega War')|E]'de krallık yalnızca iki tür katılımcıya ayrılır: [Concept('agot_loyalists', 'Loyalists')|E] ve [Concept('agot_rebels', 'Rebels')|E]."
 game_concept_agot_loyalists:0 "Sadıklar"

 game_concept_agot_loyalists_desc:0 "Bir [Concept('agot_mega_wars', 'Mega War')|E] sırasında Taç'a sadık kalanlara sadıklar denir. Taç, birden fazla [Concept('agot_rebels', 'rebel leaders')|E] tarafından hedef alınabilir."
 game_concept_agot_neutrals:0 "Tarafsızlar"

 game_concept_agot_neutrals_desc:0 "Bir [Concept('agot_mega_wars', 'Mega War')|E]'deki tarafsızlar, henüz savaşan taraflardan birine bağlılık bildirmemiş vasallardır. Kimilerinin savaşla hiçbir ilgisi olmak istemez, kimileri savaşın gelgitlerinin yeni fırsatlar getirmesini bekler...\n\nBu tutum yalnızca bir [Concept('agot_major_mw', 'major')|E] savaştayken alınabilir"
 game_concept_agot_rebels:0 "Asiler"

 game_concept_agot_rebels_desc:0 "İsyancılar, bir [Concept('agot_mega_wars', 'Mega War')|E] sırasında [Concept('agot_loyalists', 'Crown')|E]'a karşı çıkanlardır. İsyancıların, savaş çabalarını yöneten bir isyan lideri vardır. Farklı savaşlarda aynı [Concept('agot_loyalists', 'Crown')|E]'ı hedef alan birden fazla isyan lideri olabilir."
 game_concept_agot_expel_character:0 "Sürgün Et"
 game_concept_agot_expel_character_desc:0 "Söz konusu karakter krallığından ayrılmak zorunda kalacak ve asla geri dönemeyecek. Kaderi sürgündür."
 game_concept_agot_take_main_titles:0 "Birincil unvanları almak"
 game_concept_agot_take_main_titles_desc:0 "Bu, bir hainin tüm en üst unvanlarına el koyar."
 game_concept_agot_bank:0 "Banka"
 game_concept_agot_banking:0 "Bankacılık"
 game_concept_agot_banks:0 "Bankalar"

 game_concept_agot_bank_desc:0 "The $game_concept_agot_bank$, altını elinde tutan, borç veren ve yatırım yapan bir kurumdur. Bankalar, faaliyetlerini denetleyen bir [agot_bank_director|E] tarafından yönetilir. Banka hissedarları, bankanın fonlarında pay sahibidir ve kâr payı biçiminde gelir elde eder.\n\n#weak Oyuncular bankalardan kredi talep edebilir; ancak ödeyemeyecekleri bir borcun altına girmemelidir.#!"
 game_concept_agot_bank_director:0 "Müdür"
 game_concept_agot_bank_directors:0 "Müdürler"

 game_concept_agot_bank_director_desc:0 "Bir [agot_bank|E]'ın $game_concept_agot_bank_directori faaliyetlerini denetler. $game_concept_agot_bank_directori, defter tutma etkinliği sırasında her beş yılda bir bankanın hissedarları tarafından seçilir."
 game_concept_agot_bank_profits:0 "Kârlar"
 game_concept_agot_bank_profit:0 "Kâr"

 game_concept_agot_bank_profits_desc:0 "Bir [agot_bank|E]'ın $game_concept_agot_bank_profitsi, tüm kredi faizlerinden elde edilen gelir ile yatırım fonundan elde edilen gelirin toplamından [agot_bank_expenses|E]'in çıkarılmasıyla bulunur."
 game_concept_agot_bank_expenses:0 "Giderler"
 game_concept_agot_bank_expense:0 "Gider"

 game_concept_agot_bank_expenses_desc:0 "Bir [agot_bank|E]'ın $game_concept_agot_bank_expensesi, ödenmemiş kredilerden kaynaklanan toplam zararı, kredi tahsilatıyla ilgili maliyetleri, kayıp kredileri tahsil etmekle görevli ajanlara ödenen primleri, yatırım fonundan kaynaklanan tüm zararları ve bankanın genel işletme maliyetlerini (bankanın değerinin yılda yüzde biri) temsil eder."
 game_concept_agot_bank_interest_rate:0 "Faiz Oranı"

 game_concept_agot_bank_interest_rate_l:0 "faiz oranı"
 game_concept_agot_bank_interest_rates:0 "Faiz Oranları"

 game_concept_agot_bank_interest_rates_l:0 "faiz oranları"

 game_concept_agot_bank_interest_rate_desc:0 "The $game_concept_agot_bank_interest_rate$, bir borçlunun [agot_bank|E]'a ödemesi gereken yıllık faizin temel seviyesini tanımlar ve üç kademeye ayrılır: #difficulty_hard Yüksek#!, #difficulty_medium Orta#! ve #difficulty_easy Düşük#!. Kesin faiz oranı, her müşteri için ayrı ayrı yapılan karmaşık bir hesaplamadır."
 game_concept_agot_bank_risk_level:0 "Risk Seviyesi"
 game_concept_agot_bank_risk_level_l:0 "risk seviyesi"
 game_concept_agot_bank_risk_levels:0 "Risk Seviyeleri"
 game_concept_agot_bank_risk_levels_l:0 "risk seviyeleri"

 game_concept_agot_bank_risk_level_desc:0 "The $game_concept_agot_bank_risk_level$, [agot_bank|E]'ın kredi dağıtırken ve yatırım fonu aracılığıyla yatırım yaparken kabul edeceği riskin ne kadar olduğunu tanımlar ve üç kademeye ayrılır: #difficulty_hard Yüksek#!, #difficulty_medium Orta#! ve #difficulty_easy Düşük#!. Kredi puanın, risk seviyesinin tanımladığı azami değerin üzerindeyse banka sana borç vermeyi reddeder."
 game_concept_agot_bank_dividend_level:0 "Temettü Seviyesi"
 game_concept_agot_bank_dividend_level_l:0 "kâr payı seviyesi"
 game_concept_agot_bank_dividends:0 "Kâr Payları"

 game_concept_agot_bank_dividend_level_desc:0 "The $game_concept_agot_bank_dividend_level$, [agot_bank|E]'ın hissedarlarına kâr payı olarak dağıtılan 5 yıllık kârların oranını tanımlayan bir etkendir: #difficulty_hard %50#!, #difficulty_medium %75#! veya #difficulty_easy %100#!."
 game_concept_agot_bastard_surnames:0 "Piç Soyadları"

 game_concept_agot_bastard_surnames_desc:0 "Westeros geleneğine göre, soylu lordların ve hanımefendilerin [bastards|E]'i genellikle doğdukları veya büyüdükleri yeri belirten bölgesel soyadları alır. Bu uygulama, gayrimeşru çocukları ebeveynlerinin hanelerinden ve meşru kardeşlerinden ayırmak için tasarlanmıştır.\n\nZorunlu olmasa da, piçlerin meşru çocuklarının çoğu ebeveynlerinin piç soyadını korur veya kendi meşru statülerini belirtmek için onu bir şekilde değiştirir."
 game_concept_agot_surname:0 "Soyadı"
 game_concept_agot_spy:0 "Casus"
 game_concept_agot_spies:0 "Casuslar"

 game_concept_agot_spy_desc:0 "Casuslar, herhangi bir sarayda konuşlanabilen ve sır bulduklarında işverenlerine rapor veren ajanlardır. İşverenleri, küçük bir ücret ödeyerek bu sırların herhangi birini öğrenebilir.\n\nTek bir işveren için çalışan ajanların oluşturduğu gruba [agot_spy_network|E] denir."
 game_concept_agot_spy_network:0 "Casus Ağı"

 game_concept_agot_spy_network_desc:0 "Hepsi aynı işveren için çalışan [agot_spies|E] topluluğu. Bu ağ, uygun karakterler üzerinde doğrudan Casus Topla etkileşimi kullanılarak veya belirli bir hükümdar üzerinde Casusları Ara etkileşimi kullanılarak fırsatlar için sarayının incelenmesiyle genişletilebilir.\n\nDiğer saraylardaki casuslar, bir [spymaster|E] tarafından Sır Bul konsey görevi kullanılarak doğal yoldan toplanır; senin sarayında ise Komploları Boz konsey görevi kullanılarak keşfedilebilir.\n\nBir [agot_spy_network|E]'in etkinliği, azami casus sayısını artırmak, saray mensuplarının hizmetlerini sunmaya daha istekli olmasını sağlamak veya casusların [innovations|E] keşfetmesine izin vermek gibi etkilerle belirli kararlar alınarak artırılabilir."
 game_concept_royal_scion:0 "Hanedan Soyluları"

 game_concept_royal_scion_desc:0 "Hanedan soyluları, kraliyet kanı taşıdığı resmen kabul edilen Kraliyet [house|E] üyeleridir. Geleneğe göre, bir hükümdarın tüm meşru çocukları ve hükümdarın Hanesi'ne mensup tüm meşru torunları doğumda otomatik olarak Prens veya Prenses unvanını alır. Bunun ötesinde, Hanedan soylusu statüsünün verilmesi tamamen hükümdarın takdirine bağlıdır."
 game_concept_agot_paramour:0 "Metres"
 game_concept_agot_paramours:0 "Gözdeler"

 game_concept_agot_paramour_desc:0 "The $game_concept_agot_paramour$, [marriage|E] dışında var olan, iki [characters|E] arasındaki kabul görmüş romantik bağı ifade eden bir $game_concept_relationdir. Bazı kültürlerde soylular, skandala yol açmadan gözde edinebilir ve bu tür ilişkiler saraylarında toplumsal kabul görebilir.\n\nThe $game_concept_agot_paramours$, kabul edilmiş yoldaşlardır; ancak hem rol hem statü bakımından [spouses|E] ve [concubines|E]'den ayrılırlar.\n\nBöyle bir birliktelikten bir çocuk doğarsa, o çocuk bir [bastard|E] sayılır."
 game_concept_agot_milk_name:0 "Süt Adı"
 game_concept_agot_milk_names:0 "Süt Adları"

 game_concept_agot_milk_name_desc:0 "The $game_concept_agot_milk_name$, özgür halk arasında bir [character|E]'e gerçek adını almadan önce verilen geçici çocukluk adıdır.\n\nDuvar'ın ötesindeki zorlu koşullar ve bebek ölümü riski yüzünden, bir çocuğa çok erken kalıcı bir ad vermenin uğursuzluk getirdiğine inanılır. Bunun yerine, en erken yıllarında basit bir takma ad kullanılır.\n\nİki yaygın biçimi vardır. Bazı çocuklara, sağlıklı biçimde erken çocukluğa ulaşıp uygun bir ad aldıklarında tamamen atılan genel süt adları verilir. Diğerlerine, genç bir yaratığın adını alan hayvan süt adları verilir; çocuk büyüdükçe ad, o hayvanın erişkin biçimine olgunlaşır ve yetişkinliğe ulaşıldığında tanımlayıcı bir sıfat kazanır."