 game_concept_agot_major_mw_desc:0 "In a major [Concept('agot_mega_wars', 'Mega War')|E] the realm is split up into three kinds of participants: [Concept('agot_loyalists', 'Loyalists')|E], [Concept('agot_neutrals', 'Neutrals')|E], [Concept('agot_rebels', 'Rebels')|E].\nDuring the war, neutrals might still choose a side and are not bound to their initial decision."
