### TODO NOT-IN-ST: game_concept_dragon_gender_desc [AGOT: The [maesters|E] of the Citadel have long debated the true nature of [dragons_plural|E], some believing that they change as needed between male and female, and others believing them to have no particular gender at all. Historically, dragons that have been observed to lay eggs have been referred to as female, though some that are known as female have not done so.\n\nRegardless, the conventions of men hold that dragons are indeed distinguished by their sex, and so they are referred to as such until either rider or a clutch state otherwise.]
 game_concept_dragon_gender_desc:0 "The [maesters|E] of the Citadel have long debated the true nature of [dragons_plural|E], some believing that they change as needed between male and female, and others believing them to have no particular gender at all. Historically, dragons that have been observed to lay eggs have been referred to as female, though some that are known as female have not done so.\n\nRegardless, the conventions of men hold that dragons are indeed distinguished by their sex, and so they are referred to as such until either rider or a clutch state otherwise."
