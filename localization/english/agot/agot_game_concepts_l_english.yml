### TODO NOT-IN-ST: game_concept_agot_mega_wars_desc [AGOT: A mega war is a large-scale conflict within a major realm that can be of minor or major severity: Mighty empires will fall into a [Concept('agot_major_mw', 'major')|E] war, whilst others will fall into a [Concept('agot_minor_mw', 'minor')|E] one. The war's impact is considered so severe that every participant must choose a side or, if in a [Concept('agot_major_mw', 'major')|E] war, stay neutral.\nAt the end of the war the winning side has extended options regarding the punishment of the losing side.]
 game_concept_agot_mega_wars_desc:0 "A mega war is a large-scale conflict within a major realm that can be of minor or major severity: Mighty empires will fall into a [Concept('agot_major_mw', 'major')|E] war, whilst others will fall into a [Concept('agot_minor_mw', 'minor')|E] one. The war's impact is considered so severe that every participant must choose a side or, if in a [Concept('agot_major_mw', 'major')|E] war, stay neutral.\nAt the end of the war the winning side has extended options regarding the punishment of the losing side."
