### TODO NOT-IN-ST: game_concept_agot_bastard_surnames [AGOT: Bastard Surnames]
 game_concept_agot_bastard_surnames:0 "Bastard Surnames"
### TODO NOT-IN-ST: game_concept_agot_bastard_surnames_desc [AGOT: By Westerosi custom, [bastards|E] of highborn lords and ladies typically receive regional surnames denoting the place of their birth or where they were raised. The practice is designed to hold illegitimate children apart from their parent's houses and legitimate siblings.\n\nAlthough not required, many legitimate children of bastards keep their parent's bastard surname or alter it in some way to denote their own legitimate status.]
 game_concept_agot_bastard_surnames_desc:0 "By Westerosi custom, [bastards|E] of highborn lords and ladies typically receive regional surnames denoting the place of their birth or where they were raised. The practice is designed to hold illegitimate children apart from their parent's houses and legitimate siblings.\n\nAlthough not required, many legitimate children of bastards keep their parent's bastard surname or alter it in some way to denote their own legitimate status."
