 game_concept_agot_paramours:0 "Paramours"
### TODO NOT-IN-ST: game_concept_agot_paramour_desc [AGOT: A $game_concept_agot_paramour$ is a $game_concept_relation$ denoting a recognized romantic bond between two [characters|E], existing outside of [marriage|E]. In certain cultures, nobles may take paramours without scandal, and such relationships can carry social acceptance within their courts.\n\n$game_concept_agot_paramours$ are acknowledged companions, but remain distinct from [spouses|E] and [concubines|E] in both role and status.\n\nIf a child is born of such a union, they will be considered a [bastard|E].]
 game_concept_agot_paramour_desc:0 "A $game_concept_agot_paramour$ is a $game_concept_relation$ denoting a recognized romantic bond between two [characters|E], existing outside of [marriage|E]. In certain cultures, nobles may take paramours without scandal, and such relationships can carry social acceptance within their courts.\n\n$game_concept_agot_paramours$ are acknowledged companions, but remain distinct from [spouses|E] and [concubines|E] in both role and status.\n\nIf a child is born of such a union, they will be considered a [bastard|E]."
