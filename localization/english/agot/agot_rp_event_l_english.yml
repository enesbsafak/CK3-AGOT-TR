l_english:

 rp_hunters_spear:0 "Domuz Mızrağı"

 rp_hunters_spear_desc:0 "Yaban domuzu avında kullanılan bir mızrak. Bu tür yaratıkları avlamanın riskleri nedeniyle mızrak özenle yapılmış ve bakılmıştır; ucu kale dövmesi çelikten."

 rp_spear:0 "Piyade Mızrağı"

 rp_spear_desc:0 "Demir ağacından bir sapın üzerinde kale dövmesi çelik mızrak ucu. İyi yapılmış; yine de ustasının işareti solmuş."

 rp_sword:0 "İyi Yapılmış Kılıç"

 rp_sword_desc:0 "Aşırı süslü olmasa da bilgili biri bu kılıcın iyi yapıldığını anlayabilir. İyi ağızlı, kale dövmesi çelik; yine de ustasının işareti solmuş."

 rp_sell_sword:0 "Paralı Asker Kılıcı"

 rp_sell_sword_desc:0 "İyi ağızlı, kale dövmesi çelik; bu kılıç, biçimden çok işlev için yapılmış. Ustasının işaretinin solmasından da anlaşılacağı üzere kılıç yoğun kullanım görmüş."

 rp_axe:0 "Yağmacının Baltası"

 rp_axe_desc:0 "Demir Adalar'dan çıkarılan cevherden kale dövmesi. Bu balta iyi yapılmış; yine de ustasının işareti solmuş."

 rp_mace:0 "Komutan Topuzu"

 rp_mace_desc:0 "Kale dövmesi bu topuz, bir paralı asker bölüğünün komutanı için liderlik nişanesi ve silah olarak hizmet etmiş. Ustanın işareti yılların kullanımıyla solmuş."

 rp_torture_dagger:0 "İşkencecinin Hançeri"

 rp_torture_dagger_desc:0 "Kale dövmesi bu hançerin üzerinde usta işareti yok. Sır söktürmedeki kullanımları, onu az kişinin ilişkilendirilmek isteyeceği bir silah yapıyor."

 agot_rp_event.0001.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0001.desc_westeros:0 ""Selamlar, [ROOT.Char.GetLadyLord]'im; Kale, lordluğa yükseldiğinizin haberini alır almaz beni gönderdi. Hayır, sizin üstadınız değilim. Burada, yeni makamınızın ve yeni [house|E]'nizin doğuşunun kaydını tutmak için bulunuyorum; tabii Kale için böyle bir kayıt tutmama izin verirseniz?""

 agot_rp_event.0001.desc:0 ""Selamlar, [ROOT.Char.GetLadyLord]'im. Lordluğa yükseldiğinizi öğrendikten sonra size vakanüvis olarak hizmetlerimi sunmak için yola çıktım. Burada, yeni makamınızın ve yeni [house|E]'nizin doğuşunun kaydını tutmak için bulunuyorum; tabii böyle bir kayıt tutmama izin verirseniz?""

 agot_rp_event.0001.a:0 "Elbette, ne bilmek istersin?"

 agot_rp_event.0001.a.tt_westeros:0 "Hikâyeni üstada anlatmak sana değiştiriciler kazandıracak, efendin üzerinde görüş değiştiricileri oluşturacak ve başka etkileri olacak."

 agot_rp_event.0001.a.tt:0 "Hikâyeni vakanüvise anlatmak sana değiştiriciler kazandıracak, efendin üzerinde görüş değiştiricileri oluşturacak ve başka etkileri olacak."

 agot_rp_event.0001.b:0 "Elbette, ne bilmek istersin?"

 agot_rp_event.0001.c_westeros:0 "Üstatların kitaplarına ayıracak vaktim yok!"

 agot_rp_event.0001.c:0 "Vakanüvislere ayıracak vaktim yok!"

 agot_rp_event.0001.c.tt:0 "Bu seçenek "Bir Hanedan Doğuyor" olayını kapatır; hiçbir değiştirici veya efendine karşı görüş değiştiricisi olmadan başlarsın."

 agot_rp_event.0001.d:0 "Hanedanımın görünümünü kaydet"

 agot_rp_event.0001.d.tt:0 "Bu seçenek özel bir güçlü tohum oluşturmana izin verir."

 agot_rp_event.0001.d.tt_warning:0 "@warning_icon! #X Menüde yalnızca bu noktadan itibaren özel bir güçlü tohum seçebilirsiniz.#!"

 agot_rp_event.0002.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0002.desc:0 ""Bu uzun sürmez; Hanenizin doğuşunun bir özeti için; derinlemesine bir tarih ya da emeller için değil. Lordluğunuzu nasıl elde ettiğiniz ve geçmiş yaşamınızla başlayalım mı?""

 agot_rp_event.0002.a:0 "Efendime ihtiyaç anında yardım eden bir #bold avcıydım#!."

 agot_rp_event.0002.a.tt:0 "Efendinin hayatını vahşi bir hayvandan kurtararak ya da ormanda yaralandığında ona yardım ederek lordluğunu kazandın."

 agot_rp_event.0002.b:0 "Bir #bold askerdim#!; savaş alanındaki başarılarım unvanımı kazandırdı."

 agot_rp_event.0002.b.tt:0 "Savaş alanı sana zafer ve efendinin dikkatini getirdi; ister ona yardım ederek ister kazandığın zaferle; sana bir lordluk bağışlandı."

 agot_rp_event.0002.c:0 "Efendimi etkileyen bir #bold tüccardım#!."

 agot_rp_event.0002.c.tt:0 "Yükselişin kâr elde ederek oldu; ister efendinin kasasını dolaylı ister doğrudan destekleyerek; bir lordluk kazandın."

 agot_rp_event.0002.d:0 "Unvanımı sırları bilerek kazandım..."

 agot_rp_event.0002.d.tt:0 "Bir suçlu, dilenci ya da casus efendilerinin çalıştırdığı küçük kuşlardan biri olarak başladın. Bu mütevazı başlangıç ne olursa olsun, sır ticaretiyle merdivenleri tırmandın."

 agot_rp_event.0002.e:0 "Efendimin yakın sırdaşıyım."

 agot_rp_event.0002.e.tt:0 "Efendinle #bold çok yakınsın#! ve onun sana olan güveni sayesinde lordluğuna kavuştun."

 agot_rp_event.0002.f:0 "Daha fazla seçenek."

 agot_rp_event.0002.f.tt:0 "Sonraki hikâye sayfası."

 agot_rp_event.0003.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0003.desc:0 ""Bu uzun sürmez; Hanenizin doğuşunun bir özeti için; derinlemesine bir tarih ya da emeller için değil. Lordluğunuzu nasıl elde ettiğiniz ve geçmiş yaşamınızla başlayalım mı?""

 agot_rp_event.0003.a:0 "Bir #bold çit şövalyesiydim#!; artık toprak sahibi bir şövalyeyim."

 agot_rp_event.0003.a.tt:0 "Turnuva ya da muharebe; aslen mütevazı bir çit şövalyesiydin ama artık bir parça toprak kazanıp çitlere veda ettin."

 agot_rp_event.0003.b:0 "Bir #bold kaptandım#! ve geçimimi denizde kazandım."

 agot_rp_event.0003.b.tt:0 "Korsan, kaçakçı ya da belki de dürüst bir kaptan; lordluğunu denizden kazandın..."

 agot_rp_event.0003.c:0 "Ben bir bilgi arayıcısıyım ve bilgim efendime yardımcı oldu."

 agot_rp_event.0003.c.tt:0 "Şifa sanatlarını biliyorsun ya da belki kimsenin bilemeyeceği şeyleri? Yine de bilgin efendin için hayati önem taşıdı ve sana bir lordluk kazandırdı."

 agot_rp_event.0003.d:0 "Ben bir #bold yetimim#!; anne babamın başarıları ve ölümü bana lordluğumu kazandırdı."

 agot_rp_event.0003.d.tt:0 "Unvanı kazandıran iş ya babanın ya da annenin, belki de ikisinin; ama canları pahasına. Onların fedakârlığı sayesinde artık hayatta daha yüksek bir makamdasın."

 agot_rp_event.0003.e:0 "Usta bir #bold yağmacıydım#!."

 agot_rp_event.0003.e.tt:0 "Çoğu kişinin yalnızca adını duyduğu yerlere yelken açtın ve kıyıları yağmaladın. İster büyük başarılar, ister hüner, isterse de efendinin hayatını kurtarmak; bir lordluk kazandın."

 agot_rp_event.0003.f:0 "Daha fazla seçenek."

 agot_rp_event.0003.f.tt:0 "Sonraki hikâye sayfası."

 agot_rp_event.0004.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0004.desc:0 ""Bu uzun sürmez; Hanenizin doğuşunun bir özeti için; derinlemesine bir tarih ya da emeller için değil. Lordluğunuzu nasıl elde ettiğiniz ve geçmiş yaşamınızla başlayalım mı?""

 agot_rp_event.0004.a:0 "Bir #bold paralı kılıçtım#!."

 agot_rp_event.0004.a.tt:0 "Kılıçta öylesine hünerlisin ki onu satarak geçimini sağladın. Bazıları sana tepeden bakabilir, bazıları yöntemlerini sorgulayabilir; yine de lordluğa yükseldin."

 agot_rp_event.0004.b:0 "Bir #bold kâhyaydım#!."

 agot_rp_event.0004.b.tt:0 "Başlangıçta efendinin topraklarını yönetmesine yardım ettin. Belki de şimdi senin olan kalenin başında sen duruyordun; ne olursa olsun, hünerin efendini etkilemeye ve sana unvan bağışlatmaya yetti."

 agot_rp_event.0004.c:0 "Ben bir #bold soytarıyım#!."

 agot_rp_event.0004.c.tt:0 "Efendinin soytarısısın. Belki sana bir ödül olarak lordluk verildi ya da belki unvanı bağışlamakta gizli bir şaka var. Sebebi ne olursa olsun, artık bir hükümdarsın."

 agot_rp_event.0004.d:0 "Bir #bold paralı asker kaptanıydım#!."

 agot_rp_event.0004.d.tt:0 "İnsanları savaşa, ne onur ne de bir kral için değil, #bold altın#! için götürdün. Belki yeni efendin için beklenenden fazlasını yaptın - ya da belki unvan, hizmetlerinin karşılığıydı?"

 agot_rp_event.0004.e:0 "Bir #bold çit büyücüsüydüm#!."

 agot_rp_event.0004.e.tt:0 "Bazıları sana şarlatan diyor; bazıları ise şifa sanatlarındaki ya da mistik sanatlardaki bilgini arıyor. Hangisi olursan ol, efendin ihtiyaç anında sana geldi ve sen ona yardım ederek kendine bir lordluk kazandın."

 agot_rp_event.0004.f:0 "İlk seçeneklere dön."

 agot_rp_event.0004.f.tt:0 "Hikâyelerin ilk sayfası."

 agot_rp_event.0005.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0005.desc:0 ""Bazı yeni lordlar, Hanelerinin kaydında kendilerine yakın birini anmak ister. Sizin de bu şekilde onurlandırmak istediğiniz biri var mı?""

 agot_rp_event.0005.a:0 "Evet, yakın bir dost olan bir genç."

 agot_rp_event.0005.a.tt:0 "Bu adam senin en yakın dostun; iyi günde kötü günde birlikte oldunuz."

 agot_rp_event.0005.b:0 "Evet, yakın bir dost olan bir genç kız."

 agot_rp_event.0005.b.tt:0 "Bu kadın senin en yakın dostun; iyi günde kötü günde birlikte oldunuz."

 agot_rp_event.0005.c:0 "Bana #bold çok#! yakın bir genç."

 agot_rp_event.0005.c.tt:0 "Bir zamanlar dosttunuz, artık daha fazlası oldunuz. Umarım bu bir skandala yol açmaz."

 agot_rp_event.0005.d:0 "Bana #bold çok#! yakın bir genç kız."

 agot_rp_event.0005.d.tt:0 "Bir zamanlar dosttunuz, artık daha fazlası oldunuz. Umarım bu bir skandala yol açmaz."

 agot_rp_event.0005.e:0 "Kimsem yok."

 agot_rp_event.0005.e.tt:0 "Yükselişin yalnız bir yolculuk oldu. Yine de yol boyunca dostlar edinilebilir. Ya da belki yalnız olmak daha iyidir..."

 agot_rp_event.0006.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0006.desc_westeros:0 ""Özür dilerim, birinin adımı andığını duydum sanmıştım?" der söz konusu [rp_friend.GetWomanMan]; [rp_friend.GetSheHe] odaya girerken [rp_friend.Custom('quirk_pos_pp')]; onun bu zamanlamasına gülümsemekten kendimi alamıyorum. Üstat, kendini tanıtıp amacını bildirmekte hızlı davranır ve sonra yeniden bana döner. "Pekâlâ, bu bir özet için yeterli olur, [ROOT.Char.GetLadyLord]'im. Gelecek için size en iyi dileklerimle," der üstat bir reveransla."

 agot_rp_event.0006.desc:0 ""Özür dilerim, birinin adımı andığını duydum sanmıştım?" der söz konusu [rp_friend.GetWomanMan]; [rp_friend.GetSheHe] odaya girerken [rp_friend.Custom('quirk_pos_pp')]; onun bu zamanlamasına gülümsemekten kendimi alamıyorum. Vakanüvis, kendini tanıtıp amacını bildirmekte hızlı davranır ve sonra yeniden bana döner. "Pekâlâ, bu bir özet için yeterli olur, [ROOT.Char.GetLadyLord]'im. Gelecek için size en iyi dileklerimle," der vakanüvis bir reveransla."

 agot_rp_event.0006.a:0 "Hanemin doğumu böyle başlıyor!"

 agot_rp_event.0006.a.tt:0 "Hanedanın yükselecek mi, yoksa çökecek mi?"

 agot_rp_event.0006.b:0 "Lütfen üstatım olarak kal."

 agot_rp_event.0006.b.tt:0 "Elbette Kale'nin bir itirazı olmaz."

 agot_rp_event.0007.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0007.a:0 "Hanemin doğumu böyle başlıyor!"

 agot_rp_event.0007.a.tt:0 "Hanedanın yükselecek mi, yoksa çökecek mi?"

 agot_rp_event.0007.b:0 "Lütfen üstatım olarak kal."

 agot_rp_event.0007.b.tt:0 "Elbette Kale'nin bir itirazı olmaz."

 agot_rp_event.0008.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0008.desc_westeros:0 "Üstat, ona anlattığım her şeyin karalamalarını çabucak yapar. Bitirince notlarından başını kaldırıp bana bakar. "Pekâlâ, bu bir özet için yeterli olur, [ROOT.Char.GetLadyLord]'im. Gelecek için size en iyi dileklerimle," der üstat bir reveransla."

 agot_rp_event.0008.desc:0 "Vakanüvis, ona anlattığım her şeyin karalamalarını çabucak yapar. Bitirince notlarından başını kaldırıp bana bakar. "Pekâlâ, bu bir özet için yeterli olur, [ROOT.Char.GetLadyLord]'im. Gelecek için size en iyi dileklerimle," der vakanüvis bir reveransla."

 agot_rp_event.0008.a:0 "Hanemin doğumu böyle başlıyor!"

 agot_rp_event.0008.a.tt:0 "Hanedanın yükselecek mi, yoksa çökecek mi?"

 agot_rp_event.0008.b:0 "Lütfen üstatım olarak kal."

 agot_rp_event.0008.b.tt:0 "Elbette Kale'nin bir itirazı olmaz."

 agot_rp_event.0009.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0009.desc_westeros:0 ""Demir Adalıların yollarını bilirim; kölelikten gelen bir soydan mı geliyorsunuz?" diye sorar üstat; soruyu sormanın en iyi yolundan emin değildir."

 agot_rp_event.0009.desc:0 ""Demir Adalıların yollarını bilirim; kölelikten gelen bir soydan mı geliyorsunuz?" diye sorar vakanüvis; soruyu sormanın en iyi yolundan emin değildir."

 agot_rp_event.0009.a:0 "Evet."

 agot_rp_event.0009.a.tt:0 "Hanedanın kölelerden ve tuz eşlerinden geliyor; bu nedenle Demir Adalılar Hanedanına tepeden bakıyor."

 agot_rp_event.0009.b:0 "Hanedanım böyle bir soydan geldiğini iddia etmiyor."

 agot_rp_event.0009.b.tt:0 "Kölelerden ya da tuz eşlerinden gelen bir soydan geldiğini iddia etmiyorsun."

 agot_rp_event.0010.t:0 "Bir Hanedan Doğuyor"

 agot_rp_event.0010.desc:0 ""Affedersiniz, görünüşünüz ve tavırlarınız merakımı cezbetti... acaba Ejderhakayası, Driftmark ya da Pençe Adası'ndan mı geliyorsunuz?" diye sorar üstat, epey cüretkâr bir tavırla."

 agot_rp_event.0010.a:0 "Evet, bir #bold ejderha tohumu#! olduğum söylenebilir."

 agot_rp_event.0010.a.tt:0 "Damarlarında biraz ejderha kanı var. Targaryen Hanesi'nin ve diğer Valyria Hanelerinin kanı, çağlar boyunca lordların ve leydilerin aşk maceralarıyla yerel küçük halkla karışıyor. Kan bağları öylesine güçlü ki geçmişte 'ejderha tohumu' denenler ejderhalara binmeyi bile başarmıştı."

 agot_rp_event.0010.b:0 "Özür dilerim, üstat, ama yanılıyorsunuz."

 agot_rp_event.0010.b.tt:0 "Hiçbir değiştirici almayacaksın."

 agot_rp_event.0019.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0019.desc:0 "Bu ormanlarda yalnız olduğumu sanıyordum; ama bana yaklaşan ayak sesleri duyuyorum; davetsiz misafiri selamlamak için dönerken elim baltamı çözer. "Lütfen, benimle dövüşmene gerek yok; sadece konuşmak istiyorum. Görüyorsun ya, ben bir ozanım ve hikâyenden bir şarkı yapmak istiyorum," der davetsiz misafir, boş ellerini göstererek. "Ne dersin? Efsanen büyüyecek; ben de şarkıyı anlattığımda birçok kabilenin ateşinin başında uyuyacak sıcak bir yer ve yemek bulurum." Kendini ozan diye tanıtan adam senin yanıtını bekliyor."

 agot_rp_event.0019.a:0 "Beni efsaneleştirerek onurlandırmak mı istiyorsun? Pekâlâ."

 agot_rp_event.0019.a.tt:0 "Hikâyeni ozana anlatmak sana değiştiriciler ve başka etkiler kazandıracak."

 agot_rp_event.0019.b:0 "Defol, ozan, yoksa seni karda deşerim..."

 agot_rp_event.0019.b.tt:0 "Hiçbir değiştirici veya etki uygulanmayacak."

 agot_rp_event.0020.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0020.desc:0 "Ozan bir kahkaha atıp sırıtıyor. "You will not regret this, I promise!" I still keep my axe close as I watch him. The bard finds a nearby stone and uses it as a seat. "So, shall we begin with who you were before becoming a Chief — and how you accomplished the task?" he asks."

 agot_rp_event.0020.a:0 "Şef olmadan önce bir #bold avcıydım#!."

 agot_rp_event.0020.a.tt:0 "Usta bir avcı olarak kabileini vahşi hayvanlardan korudun ve onlara yiyecek ile kürk sağladın. Bu sayede kazandığın saygı, kabileinin seni Şef yapmasını sağladı."

 agot_rp_event.0020.b:0 "#bold Akıncı#! olarak hünerlerim sayesinde Şef oldum."

 agot_rp_event.0020.b.tt:0 "Efsanevi bir akıncısın; belki Sur'un ötesine birçok yolculuk yaptın ya da başka kabilelere akın ederek nam saldın. Hangisi olursa olsun, kabileinin sana saygısı var ve seni Şef yaptı."

 agot_rp_event.0020.c:0 "Yükselişime karşı çıkan herkesi saf dışı bırakarak Şef oldum."

 agot_rp_event.0020.c.tt:0 "Sana karşı çıkan herkes kayboluyor ya da talihsiz sonlarla karşılaşıyor; belki de bu sonlar pek de örtülü değil. Şef oldun çünkü sen istedin ve kabilede yaşayan hiç kimse seni sorgulamaya cesaret edemez."

 agot_rp_event.0020.d:0 "Bir #bold kargaydım#!; Şef olmak kolay bir yolculuk değildi."

 agot_rp_event.0020.d.tt:0 "Başlangıçta kabileye yabancıydın; Kara Kardeş olduğun dönemde bir zamanlar onların azılı düşmanıydın. Yine de, Güney'deki yaşamından gelen azim ve bilgi sayesinde kabile sana Şef gözüyle bakmaya başladı."

 agot_rp_event.0020.e:0 "Bir #bold gemi kazası kurtulanıyım#!; yükteki servet Şefliğe yükselmemi sağladı."

 agot_rp_event.0020.e.tt:0 "Korsanlık, ticaret ya da Deniz'i içeren başka bir uğraş. Kendini gemi kazası geçirmiş buldun. Geminin ambarındaki mallar sayesinde bir kabilenin Şefi olarak kendini kabul ettirebildin."

 agot_rp_event.0020.f:0 "Daha fazla seçenek."

 agot_rp_event.0020.f.tt:0 "Seçeneklerin sonraki sayfası."

 agot_rp_event.0021.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0021.desc:0 "Ozan bir kahkaha atıp sırıtıyor. "You will not regret this, I promise!" I still keep my axe close as I watch him. The bard finds a nearby stone and uses it as a seat. "So, shall we begin with who you were before becoming a Chief — and how you accomplished the task?" he asks."

 agot_rp_event.0021.a:0 "Bir #bold orman cadısıydım#!; bilgim beni Şef yaptı."

 agot_rp_event.0021.a.tt:0 "Şifa sanatlarında bilgi ve hüner sahibisin. Bu hünerler kabilein için hayati önem taşıdı ve sana duydukları saygı nedeniyle seni Şef yaptılar."

 agot_rp_event.0021.b:0 "İnsanları bir araya getirme yeteneğim beni Şef yaptı."

 agot_rp_event.0021.b.tt:0 "Başkalarını yanına çeken doğuştan bir lidersin; eski düşmanların bile sana çabucak dostum der. Bu hüner, kabile içindeki sorunları çözmene ve Şeflik makamına yükselmene yardımcı oldu."

 agot_rp_event.0021.c:0 "Ben bir #bold warg'ım#!; bu yüzden Şef oldum."

 agot_rp_event.0021.c.tt:0 "Korku ya da saygı; bir hayvanın derisine bürünebilme yeteneğin seni Şef yaptı."

 agot_rp_event.0021.d:0 "Önceki seçenekler."

 agot_rp_event.0021.d.tt:0 "Seçeneklerin ilk sayfasına dön."

 agot_rp_event.0022.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0022.desc:0 "Ozan merakla bir kaşını kaldırır. "Oh, yani demek ki şu büyük Güney Hanelerinden birinden misin?""

 agot_rp_event.0022.a:0 "Evet."

 agot_rp_event.0022.a.tt:0 "Bu seçenek, 'Bir Şefin Yükselişi' bittikten sonra Hane Özelleştirici'yi tetikler ve parçası olacağın bir Hane seçmene izin verir. Ayrıca Gece Nöbeti özelliğini kaldırıp Kaçak özelliğini ekler."

 agot_rp_event.0022.b:0 "Hayır, Hanem pek tanınmaz."

 agot_rp_event.0022.b.tt:0 "Bu seçenek Gece Nöbeti özelliğini kaldırır ve Kaçak özelliğini ekler."

 agot_rp_event.0023.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0023.desc:0 ""Büyük şarkıların bazıları, kahramana yardım eden bir yoldaşı da anlatır; sizin böyle biri var mı?""

 agot_rp_event.0023.a:0 "Evet, yakın bir dost olan bir #bold savaşçı#!."

 agot_rp_event.0023.a.tt:0 "Bu adam senin en yakın dostun; iyi günde kötü günde birlikte oldunuz."

 agot_rp_event.0023.b:0 "Evet, yakın bir dost olan bir #bold mızraklı eş#!."

 agot_rp_event.0023.b.tt:0 "Bu kadın senin en yakın dostun; iyi günde kötü günde birlikte oldunuz."

 agot_rp_event.0023.c:0 "Bana #bold çok#! yakın bir savaşçı."

 agot_rp_event.0023.c.tt:0 "Bir zamanlar dosttunuz, artık daha fazlası oldunuz. Umarım bu bir skandala yol açmaz."

 agot_rp_event.0023.d:0 "Bana #bold çok#! yakın bir mızraklı eş."

 agot_rp_event.0023.d.tt:0 "Bir zamanlar dosttunuz, artık daha fazlası oldunuz. Umarım bu bir skandala yol açmaz."

 agot_rp_event.0023.e:0 "Kimsem yok."

 agot_rp_event.0023.e.tt:0 "Yükselişin yalnız bir yolculuk oldu; yine de yol boyunca dostlar edinilebilir ya da belki yalnız olmak daha iyidir."

 agot_rp_event.0024.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0024.desc:0 ""Kıpırdama, seni deler geçerim! Şef, iyi misin?" der elinde mızrakla bir adam. Gülümseyip her şeyin yolunda olduğunu belirtirim. "Hakkımda şarkı yapmak isteyen bir ozan. Aslında az önce senden söz ediyorduk!"\n\nSırtına mızrak dayanmış olmanın sarsıntısını hâlâ üzerinden atamayan ozan bana döner. "Pekâlâ, sanırım bir şarkı yapmak için gereken her şeye sahibim; teşekkürler, Şef." Ozan ormanın içinde aceleyle uzaklaşır."

 agot_rp_event.0024.a:0 "Umarım şarkım güzeldir!"

 agot_rp_event.0024.b:0 "Sanırım şarkıdan çok yemeği tercih ederim..."

 agot_rp_event.0025.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0025.desc:0 ""Kıpırdama, seni deler geçerim! Şef, iyi misin?" der elinde mızrakla bir kadın. Gülümseyip her şeyin yolunda olduğunu belirtirim. "Hakkımda şarkı yapmak isteyen bir ozan. Aslında az önce senden söz ediyorduk!"\n\nSırtına mızrak dayanmış olmanın sarsıntısını hâlâ üzerinden atamayan ozan bana döndü. "Pekâlâ, sanırım bir şarkı yapmak için gereken her şeye sahibim; teşekkürler, Şef." Ozan ormanın içinde aceleyle uzaklaşır."

 agot_rp_event.0025.a:0 "Umarım şarkım güzeldir!"

 agot_rp_event.0025.b:0 "Sanırım şarkıdan çok yemeği tercih ederim..."

 agot_rp_event.0026.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0026.desc:0 "Ozan başını sallar. "Tek başına yükseliş; yalnızca kendi zekâna ve çeliğine dayanarak, evet, sanırım bir şarkı yapabilirim. Teşekkürler!" Ozan bana veda edip ormanın içinden uzaklaşır."

 agot_rp_event.0026.a:0 "Umarım şarkım güzeldir!"

 agot_rp_event.0026.b:0 "Sanırım şarkıdan çok yemeği tercih ederim..."

 agot_rp_event.0027.t:0 "Bir Şefin Yükselişi"

 agot_rp_event.0027.desc:0 "Ozan tedirgin tedirgin etrafına bakındı. "Bir warg... ne... ne tür bir canavar derisi giyiyorsun?" *BU GEÇİCİDİR, WARG SİSTEMİ HAYATA GEÇİRİLDİĞİNDE DEĞİŞECEKTİR*."

