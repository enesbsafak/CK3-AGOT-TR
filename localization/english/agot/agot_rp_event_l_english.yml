 agot_rp_event.0100.desc:0 "Hanedanının güçlü tohum görünümünün özelliklerini seçmek için menüyü kullan. Her kategoriden bir özel güçlü tohum seçebilirsin.\n\nSağdaki karakteri, her öğenin renk veya boyut açısından nasıl göründüğüne dair örnek olarak kullanabilirsin."

