 agot_rp_event.0105.t:0 "Özel Güçlü Tohum"

 agot_rp_event.0105.desc:0 "Hükümdarını daha da özelleştirmek istersen, mevcut seçeneklere dayalı özel bir güçlü tohum ekleyebilirsin.\n\nOluşturmayı seçersen, özel güçlü tohumun oyun kurallarına bağlı olarak çocuklarına miras kalacaktır.\n\n@warning_icon! #X Özel bir güçlü tohum kullanmak hükümdarının görünümünü geçersiz kılabilir.#!"

 agot_rp_event.0105.a:0 "Evet, beni Özel Güçlü Tohum Menüsü'ne götür!"

 agot_rp_event.0105.b:0 "Hayır, şimdi oynamak istiyorum."

