 admiral_court_position:0 "Amiral"

 admiral_court_position_desc:0 "Denizcilik ve donanma işlerinden sorumlu $admiral_court_position$. [fleet|E] donanmanın Baş Kaptanı ve ordularının [embark|E] gemiye binme zamanlarını denetler."

 admiral_fleet:0 "Filoları Dağıt"

 admiral_fleet_desc:0 "Bu karakter, diyarın filolarını daha geniş suları devriye gezmek ve kıyı boyunca tehditlere hızla karşılık vermek üzere dağıtıyor."

 admiral_maritime:0 "Ticareti Koru"

 admiral_maritime_desc:0 "Bu karakter, deniz ticaret yollarını korumak ve limanlarından geçen mal akışının kesintisiz sürmesini sağlamakla görevlendirilmiştir."

 admiral_raid:0 "Akıncıları Cesaretlendir"

 admiral_raid_desc:0 "Bu karakter denizde saldırgan hareket etmeyi teşvik eder; tedbir ve ihtiyattan ziyade hızlı darbeleri ve yağmayı tercih eder."

 septon_court_position:0 "Septon"

 septon_tradition_bonus:0 "[culture_tradition|E]'den"

 septon_court_position_desc:0 "$septon_court_position$, [court|E] sarayında Yedi'nin İnancı'na bağlı üyeler için dinî hizmetler sunar."

 septa_court_position:0 "Septa"

 septa_tradition_bonus:0 "[culture_tradition|E]'den"

 septa_court_position_desc:0 "$septa_court_position$, [guardian|E] vasisi olmayan kız [children|E] çocuklarını eğitmekten sorumludur."

 gaoler_court_position:0 "Hücrelerin Bekçisi"

 gaoler_court_position_desc:0 "Kalenin nemli derinliklerinde, mahkûmların inlediği zindanlar uzanır ve $gaoler_court_position$ nöbet tutar."

 harbormaster_court_position:0 "Liman Reisi"

 harbormaster_tradition_bonus:0 "[culture_tradition|E]'den"

 harbormaster_court_position_desc:0 "$harbormaster_court_position$, deniz ticaretini düzenleyen ve limanlarındaki gümrükleri denetleyen görevlidir."

 warden_of_the_north_court_position:0 "Kuzey Muhafızı"

 warden_of_the_north_court_position_desc:0 "Kuzey Muhafızı, yabancı tehdit ya da istila durumlarında Kuzey'in savunmasından sorumludur."

 warden_of_the_east_court_position:0 "Doğu Muhafızı"

 warden_of_the_east_court_position_desc:0 "Doğu Muhafızı, yabancı tehdit ya da istila durumlarında Doğu'nun savunmasından sorumludur."

 warden_of_the_west_court_position:0 "Batı Muhafızı"

 warden_of_the_west_court_position_desc:0 "Batı Muhafızı, yabancı tehdit ya da istila durumlarında Batı'nın savunmasından sorumludur."

 warden_of_the_south_court_position:0 "Güney Muhafızı"

 warden_of_the_south_court_position_desc:0 "Güney Muhafızı, yabancı tehdit ya da istila durumlarında Güney'in savunmasından sorumludur."

 goldcloaks_court_position:0 "Şehir Muhafızları Komutanı"

 goldcloaks_tradition_bonus:0 "[culture_tradition|E]'den"

 goldcloaks_court_position_desc:0 "$goldcloaks_court_position$, Kral Toprakları'nın Şehir Muhafızları'na komuta eder; önemli bir itibar ve ehemmiyet taşıyan bir makamdır."

 goldcloaks_employer_custom_effect_description:0 "#!\n@warning_icon!#X Sana karşı [hostile_schemes|E] içinde güçlü [agent|E]#!"

 generic_scheme_warning_employer_custom_effect_description:0 "#!\n@warning_icon!#X Sana karşı [hostile_schemes|E] içinde güçlü [agent|E]#!"

 sea_watch_commander_court_position:0 "Deniz Nöbeti Komutanı"

 sea_watch_commander_court_position_desc:0 "Kral Toprakları çevresindeki Karasu Körfezi sularını koruyan devriye filosunun başı; Çatlak Pençe Burnu'na, Kral Ormanı kıyılarına ve Massey Kancası'na kadar uzanır."

 royal_counter_court_position:0 "Kraliyet Saymanı"

 royal_counter_court_position_desc:0 "$royal_counter_court_position$, diyarın vergilendirilmesini yönetmekten ve tüm gelirin doğru biçimde toplandığından emin olmaktan sorumludur."

 royal_scales_court_position:0 "Kraliyet Terazileri"

 royal_scales_court_position_desc:0 "Kraliyet ölçü ve tartılarının resmî muhafızı olan $royal_scales_court_position$, bunları diyar genelinde standart olarak uygulatmakla görevlidir."

 high_reeve_court_position:0 "Yüksek Mübaşir"

 high_reeve_court_position_desc:0 "$high_reeve_court_position$, başkentte hırsızlık ve yankesicilik gibi tüm düşük adalet davalarını yargılamakla görevlidir."

 justiciar_court_position:0 "Adalet Bakanı"

 justiciar_court_position_desc:0 "Yüksek Yargıçlar, yüksek yargı yetkilerini doğrudan tahtta oturan hükümdardan alırlar. Diyarı dolaşır, kuyu ve darağacı gerektiren davalara bakmaya yetkilidirler ve gerektiği her yerde kraliyet adına adaleti sağlarlar. Bu, kendi kılıçlarıyla ya da adamlarının kılıçlarıyla yapılabilir."

 royal_mint_officer_court_position:0 "Kraliyet Darphanesi Muhafızı"

 royal_mint_officer_court_position_desc:0 "Kraliyet darphanesi görevlileri, kendi şehirlerindeki kraliyet darphanelerinde sikkelerin üretimini denetler."

 keeper_of_keys_court_position:0 "Anahtar Muhafızı"

 keeper_of_keys_court_position_desc:0 "$keeper_of_keys_court_position$, kraliyet hanesindeki belirli kapıları ve sandıkları açan anahtarları kontrol etmekle sorumludur. Kimisi taç mücevherlerini, kimisi hükümdarın kişisel fonlarını korur; hepsi önemlidir."

 grey_cloaks_commander_court_position:0 "Arnavut Kaldırımı Muhafızları Komutanı"

 grey_cloaks_commander_court_position_desc:0 "$grey_cloaks_commander_court_position$, iyi finanse edilen Eski Şehir Şehir Muhafızları'na komuta eder."

 crimson_cloaks_commander_court_position:0 "Kızıl Pelerinler Komutanı"

 crimson_cloaks_commander_court_position_desc:0 "$crimson_cloaks_commander_court_position$, iyi eğitimli ve iyi finanse edilen Lannisport Şehir Muhafızları'na komuta eder."

 white_knife_court_position:0 "Beyaz Bıçak Muhafızı"

 white_knife_court_position_desc:0 "$white_knife_court_position$, Beyaz Bıçak nehrinin Isırık'taki ağzını korumaktan sorumludur."

 stone_way_court_position:0 "Taş Yolu Muhafızı"

 stone_way_court_position_desc:0 "$stone_way_court_position$, daha çok 'Kemik Yolu' diye bilinen geçidin başlıca savunucusuna verilir. Bu makam, Taş Yolu'nun savunması sırasında diğer tüm vasallar üzerinde askerî üstünlük sağlar."

 princes_pass_court_position:0 "Prens Geçidi Muhafızı"

 princes_pass_court_position_desc:0 "$princes_pass_court_position$, tarihsel olarak 'Geniş Yol' diye bilinen geçidin başlıca savunucusuna verilir. Bu makam, Prens Geçidi'nin savunması sırasında diğer tüm vasallar üzerinde askerî üstünlük sağlar."

 master_at_arms_court_position:0 "Silah Ustası"

 master_at_arms_court_position_desc:0 "$master_at_arms_court_position$, diyarın silahlarından sorumludur; arma ve hanedan işlerini korur ve yönetir; çoğu zaman üstünün saray müjdecisi olarak da hizmet eder."

 court_smith_court_position:0 "Saray Demircisi"

 court_smith_court_position_desc:0 "$court_smith_court_position$, maden işlerinin bakımından ve korunmasından sorumludur."

 court_position_reforge_vs:0 "Valyria Çeliği'ni yeniden dövmenin sırlarını bilir"

 bloodrider_court_position:0 "Kan Sürücüsü"

 bloodrider_court_position_desc:0 "$bloodrider_court_position$, liderini korumaya ant içmiş, kanda kardeşlikle ve yoldaşlıkla bağlanmış bir muhafızdır. Bu, yalnızca bir hizmet bağından ibaret değildir; liderleri düşene dek ruhlarının kopmaz bir birleşimidir. Koruma görevinde başarısız olurlarsa, görev intikama, sonra da ölüme dönüşür; liderlerine öbür dünyada katılırlar."

 bloodrider_employer_custom_effect_description:0 "$BULLET$Suikast [GetScheme('murder').GetTypeName] [schemes|E] planlarını önleme şansı verir#!\n$BULLET$İkinizin de savaştığı [battles|E] savaşlarda ölme ya da esir düşme riskini azaltır#!\n$BULLET$[GetTrait('loyal').GetName( GetNullCharacter )] [trait|E] özelliğini kazanır ve henüz değilse [friend|E] arkadaşın olur\n$BULLET$Kan yeminini onurlandırmak için senin ölümünün ardından intihar eder"

