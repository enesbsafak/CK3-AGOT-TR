l_english:

 innovation_agot_gavelkind:0 "Gavelkind"

 innovation_agot_gavelkind_desc:0 "İstikrar ve refah el ele gider. Eski hükümdar vefat ettiğinde vasalların güç için yarışması yerine, veraset sırasında geleneksel olarak yaşanan istikrarsızlığın büyük bölümünü ortadan kaldıracak önceden belirlenmiş, hakkaniyetli bir veraset sistemi tanımlayabiliriz."

 innovation_agot_heraldry:0 "Arma"

 innovation_agot_heraldry_desc:0 "Soylu ailelerimizi tanımlayacak kalıtsal arma tasarımları oluşturmak, üyelerini kişisel statüye kafayı takmak yerine kendilerini daha büyük bir bütünün parçası olarak görmeye teşvik eder ve hanedanlarının itibarını artırmaya özendirir."

 innovation_agot_siege_01:0 "Koç Başı"

 innovation_agot_siege_01_desc:0 "İnsanlar kaleler ve burçlar inşa ederken, başkaları da bu savunmaları yıkmanın yollarını buldu."

 unlock_maa_battering_ram:0 "[GetMaA('battering_ram').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_sword_bound:0 "Kılıca Bağlı"

 innovation_agot_sword_bound_desc:0 "Dünya zor bir yerdir; kişi yolunu kılıçla açmalı, yakınlarını ve yuvasını kılıçla korumalı ve ihtiyacı olanı kılıçla almalıdır."

 unlock_master_at_arms_court_position:0 "[GetCourtPositionType('master_at_arms_court_position').GetName]'ini açar."

 innovation_agot_mail:0 "Zincir Zırh"

 innovation_agot_mail_desc:0 "Bu kültür, kapitone zırhın ötesine geçmiş ve artık ana savunma olarak zincir zırh kullanmaktadır. Güçlü, dayanıklı ve esnek olan bu zırh, bu halkın savaşçılarını gerçekten zorlu kılmıştır."

 innovation_agot_professional_lances:0 "Profesyonel Kargılar"

 innovation_agot_professional_lances_desc:0 "Westeros'un gücü ağır süvarisinde yatar ve bu kültür hareketli savaşı benimsemiştir. Ağır süvarileri azgınlıkları ve hızlarıyla ünlüdür."

 innovation_maesters:0 "Üstatlar"

 innovation_maesters_desc:0 "Kale'de her türlü bilgiyle eğitilen üstatlar, Westeros lordları tarafından yönetimlerinin istikrarı ve sağlıklarının korunması açısından hayati bulunmuştur."

 innovation_agot_landed_gentry:0 "Toprak Sahibi Soylular"

 innovation_agot_landed_gentry_desc:0 "Westeros'un dört bir yanında ortak bir küçük soyluluk sınıfı ortaya çıkmıştır. Kuzey'de ve Demir Adalar'da usta, güneyde ise toprak sahibi şövalye gibi farklı adlandırılsalar da aynı rolü oynarlar; efendilerinin hizmetinde toprak ve unvan taşırlar."

 unlock_landed_knight_contract:0 "#high [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_landed_knight' )]#! [vassal_contract|E]'ini açar"

 innovation_agot_valyrian_knights:0 "Ejderha Şövalyeleri"

 innovation_agot_valyrian_knights_desc:0 "Valyrialılar Westeros'a geldiklerinde yerel savaş yöntemlerini benimsemiş ve savaş alanında dehşet saçan siyah plaka zırhlı korkunç şövalyeler kurmuşlardır."

 unlock_knights_of_the_dragon:0 "[GetMaA('knights_of_the_dragon').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_northern_fighting:0 "Kış Savaşı"

 innovation_agot_northern_fighting_desc:0 "Ünlü demirağacı, kimseninkine benzemeyen bir odun üretir ve bundan yapılan kargılarla Kuzey'in adamları her türlü tehdide karşı koyabilir."

 unlock_northern_spears:0 "[GetMaA('northern_spears').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_dorne_fighting:0 "Kumul Savaşı"

 innovation_agot_dorne_fighting_desc:0 "Dornlu'lar ve savaş yöntemleri hakkında çok şey söylenir, ancak hiç kimse toprağın engereklerinin — hem gerçek hem mecaz anlamda — istilacıya hissettireceği ölümcül ısırıktan şüphe edemez."

 unlock_dornish_crossbows:0 "[GetMaA('dornish_crossbows').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_vale_fighting:0 "Dağ Savaşı"

 innovation_agot_vale_fighting_desc:0 "Ay Dağları, Vadi'yi uzun süredir koruyor, ancak bunları yuva edinenler için bir kılıç da işlevi görebilir. Yabanılların tehlikeleri ve hain arazi süvariyi daha az etkili kılmış, bu da Ay Muhafızları'nın örneklediği gibi atsız çarpışmaya bel bağlanmasına yol açmıştır."

 unlock_vale_heavy_infantry:0 "[GetMaA('vale_heavy_infantry').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_reach_fighting:0 "Yeşillik Savaşı"

 innovation_agot_reach_fighting_desc:0 "İkinci büyük krallık olan Menzil, ekin ve tahılla dolu geniş, açık tarlalarıyla bilinir. Bu açıklık onu saldırılara karşı savunmasız kılar; bu yüzden istilaları her yönden haber verecek hızlı haberci atları yetiştirilir."

 unlock_reach_light_cavalry:0 "[GetMaA('reach_light_cavalry').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_crownlands_fighting:0 "Karasu Savaşı"

 innovation_agot_crownlands_fighting_desc:0 "Karasu Körfezi çevresindeki topraklar her zaman çatışma görmüş, bu da yerel askerlerin uyguladığı kendine özgü bir kargı kullanma üslubunun doğmasına yol açmıştır."

 unlock_crownlands_spears:0 "[GetMaA('crownlands_spears').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_riverlands_fighting:0 "Üç Mızrak Savaşı"

 innovation_agot_riverlands_fighting_desc:0 "İçten ve dıştan uzun süredir tehdit edilen Nehir Toprakları, tehlikelere hızlı karşılık vermek için nehirlerine ve onlarda seyreden mavnalara bel bağlamıştır."

 unlock_riverlands_light_infantry:0 "[GetMaA('riverlands_light_infantry').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_westerlands_fighting:0 "Tepe Savaşı"

 innovation_agot_westerlands_fighting_desc:0 "Batı Toprakları'nın kayalık tepeleri, bölgeye egemen olan güçlü ve dayanıklı ağır süvarilerin yetişmesini sağlamıştır."

 unlock_westerlands_knights:0 "[GetMaA('westerlands_knights').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_stormlands_fighting:0 "Fırtınalı Savaş"

 innovation_agot_stormlands_fighting_desc:0 "Fırtına Toprakları'nın fırtınaları yalnızca kaleleri değil, adamları da döver; bu da şok birlikleri olarak hizmet etmeye çok uygun dayanıklı bir halk ortaya çıkarır."

 unlock_stormlands_heavy_infantry:0 "[GetMaA('stormlands_heavy_infantry').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_free_companies:0 "Özgür Bölükler"

 innovation_agot_free_companies_desc:0 "Serbest Diyar'ın çöküşünden sonra Essos'ta çatışmalar baş gösterince, pek çok Westeroslu ve savaşçı eğilimli Essoslu, çalkantı içindeki çeşitli diyarlar için savaşmak üzere Özgür Bölükler — paralı kılıçlar ve paralı yelkenler — kurdular."

 unlock_westerosi_sellswords:0 "[GetMaA('westerosi_sellswords').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_stepstone_fighting:0 "Basamak Adaları Yağmaları"

 innovation_agot_stepstone_fighting_desc:0 "Dar Deniz birçok ticaret merkezini birbirine bağlar ve ticaret nerede gelişirse korsanlık da orada gelişir. Basamak Adaları, en sefil haydutlardan güçlü korsan prenslerine kadar sayısız korsana ev sahipliği yapar; hepsi adalar arasında servetlerini arar."

 unlock_stepstone_sailors:0 "[GetMaA('stepstone_sailors').GetName]'i [men_at_arms|E] olarak toplayabilir"

 innovation_agot_giants:0 "Devlerle Yürümek"

 innovation_agot_giants_desc:0 "Duvar'ın ötesinde, güneyde unutulmuş pek çok şey yatar. Devler hâlâ bu topraklarda dolaşıyor ve bazen bir tanesi bilinmeyen nedenlerle bir kabileye ya da topluluğa katılır."

 unlock_giants:0 "[GetMaA('giant_regiment').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_goldenheart_bowmen:0 "Altın Yürek Okçuları"

 innovation_agot_goldenheart_bowmen_desc:0 "Çok eski zamanlarda Yaz Adaları korsanlar ve köle tacirlerince kuşatılmıştı — ta ki Xanda Qo gelene dek. O, okçularını, ejderha kemiğinden yapılanlar dışında eşi benzeri olmayan altın kalpli ağaçtan yaylarla donattı. Bu okçular ve kuğu gemileri, korsanlar ve köle tacirleri tarafından korkulan hâle geldi."

 unlock_goldenheart_bowmen:0 "[GetMaA('goldenheart_bowmen').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_rubies_and_iron:0 "Yakutlar ve Demir"

 innovation_agot_rubies_and_iron_desc:0 "Hyrkoon Yadigârı'nın ayakta kalan kaleleri ve halkları garip bir topluluktur. Başka diyarların aksine burada erkeklerin savaşması yasaktır ve kadın savaşçılar yanaklarına yakut ve demir halka küpeler takarak süslenirler."

 unlock_ruby_spearwomen:0 "[GetMaA('ruby_spearwomen').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 unlock_crossbowmen:0 "[GetMaA('crossbowmen').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 unlock_armored_footmen:0 "[GetMaA('armored_footmen').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 unlock_armored_horsemen:0 "[GetMaA('armored_horsemen').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 innovation_agot_anti_dragon_fighting:0 "Ejderha Karşıtı Savaş"

 innovation_agot_anti_dragon_fighting_desc:0 "Ne kadar korkunç ve yıkıcı olsalar da [dragons_plural|E] ölümsüz değildir. Öldürülebilirler. Anahtar, onların sert pullarını delmektir; bu yüzden tam da bunu başarmak için akrepler yeniden kullanıma sokulmuştur."

 unlock_maa_scorpions:0 "[GetMaA('scorpions').GetName]'i [men_at_arms|E] olarak toplayabilirsiniz"

 unlock_scorpion_defenses:0 "Akrep savunmaları, kale seviyeleri 10 ve 20'de otomatik olarak inşa edilip geliştirilecektir"

 unlock_anti_dragon_workshop_bonuses:0 "Yüksek seviyelerdeki #V $building_type_workshops_01$#! [buildings|E] hattı, gelişmiş ejderha savunması sağlar"

 scorpions_prepared:0 "Hazır Akrepler"
