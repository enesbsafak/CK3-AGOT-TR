 tradition_agot_insular_marriage_name:0 "İçine Kapalı Evlilik"

 tradition_agot_insular_marriage_desc:0 "İzolasyonist olmasa da bu kültür yine de kendi halkı içinde evlenmeyi tercih eder."

 tradition_agot_debug_name:0 "Hata Ayıklama"

 tradition_agot_debug_desc:0 "Buraya nasıl geldin?"

 tradition_agot_fashionistas_name:0 "Kumaşı Okşa"

 tradition_agot_fashionistas_desc:0 "Görüyorum ki moda, adamdan çok giysiyi yıpratıyor."

 tradition_agot_blackwater_bay_name:0 "Tacın Diyarı"

 tradition_agot_blackwater_bay_desc:0 "Tacın Toprakları, Westeros'un en yeni bölgesidir; doğrudan Demir Taht'a yeminli hanedanlar ve halklar tarafından kurulmuştur. Sonuç olarak, onun özelliklerini ve yaşam biçimlerini benimsemişlerdir. Kral Toprakları şehrinin hakimiyetinde olan bölgede, giderek daha fazla insan şehirlerde yaşamaya ve daha kentsel yaşam tarzlarını benimsemeye başlıyor."

 tradition_agot_vale_andal_heritage_name:0 "İnanç ve Öfke"

 tradition_agot_vale_andal_heritage_desc:0 "Andallar, kimse tam olarak nereden olduğunu bilmese de Kuzey Essos'tan gelir. Toprak açlığı çeken Valyria Özgür Diyarı'nın sürekli genişlemesiyle Andallar, anavatanlarından Westeros'a kaçmak zorunda kaldı; Neck'in güneyindeki her yeri kaplayarak dini ateşleri ile şövalyelik ve mertlik geleneklerini de beraberlerinde getirdiler."

 tradition_agot_valeman_finger_name:0 "Mütevazı Hizmet"

 tradition_agot_valeman_finger_desc:0 "Parmaklar, kasvetli ve rüzgara açık bir yerdir; dondurucu kuzeyden esen rüzgarlar öyle şiddetlidir ki uçlarında pek az bitki yetişir. Otlayan hayvanları gütmek dışında, halkın geçimini sağlayacak pek az yol vardır, zira ekilebilir toprağa dönüştürülebilecek çok az arazi vardır. Bu yüzden Parmaklılar mütevazı bir yaşam sürer ve keçi çobanları ile ortakçılar bu acımasız evlerinde bir ölçüde huzur bulur."

 tradition_agot_valeman_upper_name:0 "Yükseklerde"

 tradition_agot_valeman_upper_desc:0 "Evlerini Vale'in verimli vadilerinde kuran soydaşlarından ayrı olarak, Ay Dağları'nın yükseklerinde yaşayan adamlar çok daha sert ve dayanıklı bir halktır. Savaş zamanlarında dış saldırılara karşı ilk savunma hatlarını onlar tutar ve yüksek irtifadaki yaşamları nedeniyle dağ klanları mensuplarının akınlarıyla en çok uğraşanlar da onlardır."

 tradition_agot_riverlands_name:0 "Nehrin Ödülleri"

 tradition_agot_riverlands_desc:0 "Nehirliler, çevrelerindeki güçlerin arasında sıkışıp kalmış bir halktır; ancak kendi güçlü kralları olduğunda gelişme eğilimi gösterirler. Trident ve kolları, hayatlarını her şeyden çok tanımlar ve bu sulardan refaha ererler."

 tradition_agot_stormlands_name:0 "Havaları Gibi"

 tradition_agot_stormlands_desc:0 "Fırtınalılar, askeri eğilimleri ve çabuk öfkelenmeleriyle tanınan dayanıklı bir topluluktur. Fırtına Toprakları'nın erkekleri ve kadınları, insanların, doğanın ve hatta tanrıların gazabına göğüs gerdi; yine de yalnızca ayakta kalmakla kalmadılar, refaha da erdiler."

 tradition_agot_marches_name:0 "Sayılamayan Savaşlar"

 tradition_agot_marches_desc:0 "Sınır Bölgeleri uzun zamandır Fırtına Toprakları, Reach ve Dorne'un kavşağı olmuş; Şafak Çağı'ndan beri sayısız savaşa tanıklık etmiştir. Oraları vatan edinen halk, askeri mahareti, azimli inatçılığı ve her olası tehdide karşı sürekli tetikte olmasıyla bilinir."

 tradition_agot_vale_name:0 "Dağ ve Vadi"

 tradition_agot_vale_desc:0 "Arrynlerin eski krallığına, Ay Dağları ve aralarındaki vadiler, başta Vale of Arryn hakimdir. Bu iki doğal unsur, doğularındaki halkları Westeros'un geri kalanından ayırmış ve birleştirmiştir."

 tradition_agot_north_name:0 "Bronz ve Demirle Bağlanmış"

 tradition_agot_north_desc:0 "Kuzeyliler, Kuzey'i vatan edinen erkek ve kadınlar, sert ve dayanıklı bir halktır. Binlerce yıl önce Aç Kurt tarafından birleştirilen halklar, vatan edindikleri topraklar kadar çeşitlidir; yine de hepsi kadim yeminleriyle bağlıdır."

 tradition_agot_westerlands_name:0 "Merhametten Gelen Zenginlik"

 tradition_agot_westerlands_desc:0 "Batı Toprakları'nın insanları, engebeli toprakları ve altındaki zenginlik tarafından şekillenir. Uzun süredir çevrelerindeki topraklardan ve Günbatımı Denizi'nden gelen tehditlerle kuşatılan Batılılar, evlerinin tepelerinden ve kayalarından bir krallık oymuştur."

 tradition_agot_sisterman_name:0 "Tuzlu Suyun Altında"

 tradition_agot_sisterman_desc:0 "Tarihlerinin büyük bölümünde Kızkardeşliler, Vale ya da Kuzey halkından çok Demirdoğanlarla ortak yönlere sahipti. Binlerce yıl boyunca Kızkardeşliler korsan kralları tarafından yönetildi; rüzgara açık adalarının sağlayamadığını kendilerine sağlamak için Bite kıyılarını yağmaladı ve hem Andalların hem de İlk İnsanların bilmediği tuhaf tanrılara taptı."

 tradition_agot_ironmen_name:0 "Soluk Ağaçtan Oyulmuş"

 tradition_agot_ironmen_desc:0 "Demir adamlar denizlerden gelen bir beladır; yine de etkileri, onları getiren gelgitler gibi alçalıp yükselir. Kimi zaman yalnızca Günbatımı Denizi'ndeki adalarıyla sınırlı kalırlar; kimi zaman Yeşil Topraklar'a yayılıp orada hüküm sürmüşlerdir. Ancak her zaman, aşağıda ikamet eden Gri Kral ile olan kadim bağlarıyla birleşik kalırlar."

 tradition_agot_dorne_name:0 "Kum ve Taş Engerekleri"

 tradition_agot_dorne_desc:0 "Dornelular, Westeros'un geri kalanından ayrı bir halktır. İlk olarak kuzeyli komşuları gibi Andallar tarafından fethedilmiş olsalar da, daha sonra Martell Hanedanı ile birleşen Rhoynarlar tarafından fethedildiler. Rhoyne gelenekleri onları, diğer krallıklardan Kuzey kadar ayrı kıldı; bu ayrım izleyen yüzyıllarda daha da derinleşti."

 tradition_agot_dorne_rhoynish_heritage_name:0 "Ana Rhoyne'un Çocukları"

 tradition_agot_dorne_rhoynish_heritage_desc:0 "Rhoyne uygarlığı kadim ve parlak bir uygarlıktır. Rhoynarların tarihi o kadar derindir ki bazıları, Andallara demirciliği ve demir işlemeyi onların öğrettiğine inanır. Rhoyne nehri kıyısındaki şehir devletlerinden gelen Rhoynarlar, nehrin sayısız tanrısına tapar ve küçük balıkçı teknelerinden rezil zevk mavnalarına kadar her türden tekneye karşı özel bir ilgi duyar. Rhoyne kültürü, kadın ve erkek için eşit mirasın norm olduğu ve eşcinsel ilişkilerin kabul gördüğü Andal kültüründen belirgin biçimde farklıdır. Rhoynarların sanat eserlerine ve müziğe değer vermesiyle bilinmesi, Rhoynarlar Dorne'a geldiğinde bazı Rhoyne kültürel uygulamalarının bu kadar çabuk benimsenmesinin kısmen nedeni olabilir."

 tradition_agot_reach_name:0 "Yeşilin Meyveleri"

 tradition_agot_reach_desc:0 "Reach, Westeros'un en büyük çiftliklerine ve tarlalarına ev sahipliği yapan, uçsuz bucaksız ve bereketli bir diyardır — bir bolluk ülkesi. Halkı, şövalyeleri ve mertlikleri kadar Dornelularla süregelen düşmanlıklarıyla da ünlüdür."

 tradition_agot_wildling_name:0 "Yırtıcı, Vahşi ve Yaban"

 tradition_agot_wildling_desc:0 "Halkların ve toplumların çoğunluğu ilerleyip büyürken, ilerlemenin önünde eğilmeyi reddeden gruplar vardır; Westeros'taki birçok Yabanıl buna örnektir. Çoğunluğu Sur'un Ötesinde bulunur, ancak Ay Dağları'nda da gruplar vardır. Bu kabilesel gruplar, gelişmemiş de olsalar vahşidirler ve çok sayıda toplandıklarında tehdit oluşturabilirler."

 tradition_agot_rushlander_name:0 "Nehirlerin Tepelerle Buluştuğu Yer"

 tradition_agot_rushlander_desc:0 "Vale ve Nehir Toprakları sınırında doğmuş bir kültür olan Rushlendırlar, tepelerdeki ve nehirlerdeki yaşama uyum sağlamış dayanıklı bir halktır."

 tradition_agot_harsh_laws_name:0 "Sert Yönetim"

 tradition_agot_harsh_laws_desc:0 "Toplum yasaları şekillendirir. Tarih, sert bir toprağın sert insanlar doğurmasının doğal olduğunu ve onların da yönetmek için sert yasalar yaptığını göstermiştir."

 tradition_agot_andalos_name:0 "Yıldızlar Altında Tepeler"

 tradition_agot_andalos_desc:0 "Andalos'taki tepede yedi yıldızla meshedilen ve Andalları Westeros'a getirmekle görevlendirilen kişi Hugor'du; bu, Bir Olan Yedi ile yapılan anlaşmayı sürdürmelerinin ilahi ödülüydü."

 tradition_agot_braavos_name:0 "Köle Tacirlerinin Zincirlerinden Kurtulmuş"

 tradition_agot_braavos_desc:0 "Özgür Şehirler arasında eşsiz olan Braavos, Valyria'ya giderken kaçan köleler tarafından kuruldu ve bu yüzden bilinen dünyanın her yerinden ve ötesinden gelen halklardan oluşur. Bu, Braavos'u birçok halkın şehri ve ulusu haline getirdi; burada her şeyin üzerinde tek bir kural hüküm sürer: 'Braavos'ta hiçbir erkek, kadın ya da çocuk asla köle, esir ya da bağlı olmayacak.'"

 tradition_agot_religious_fc_name:0 "Dini Saflık Arayışında"

 tradition_agot_religious_fc_desc:0 "Özgür Diyar, Valyrialılardan Andallara, Rhoynarlara, Giskarlılara ve daha nicelerine uzanan, sınırlarının ötesinden gelen sayısız köleyi saymazsak, birçok halkın karışımıydı. Böylesine çeşitli halkları kontrol altında tutmak için Ejderha Lordları herkesin ibadetine izin verdi; bu, en ateşli tebaalarından bazılarınca nefretle karşılandı ve onlar, dini saflık arayışında kendi şehirlerini kurmak için ayrıldılar."

 tradition_agot_three_daughters_name:0 "Kardeşler Arasında Sıkışmış"

 tradition_agot_three_daughters_desc:0 "Özgür Diyar Kıyamet'e yenik düştüğünde imparatorluğu parçalandı ve farklı şehirlerin hepsi üstünlük için çabaladı. Bu en açık şekilde, Lys, Myr ve Tyrosh'un birbirine karşı mücadele ettiği, sıradan halkın bitmek bilmeyen çatışmalarının arasında sıkışıp kaldığı İhtilaflı Topraklar'da görülür."

 tradition_agot_pentos_name:0 "Karışım Sonucu Doğan"

 tradition_agot_pentos_desc:0 "Pentosluların, Valyria yerleşimcilerinin ve bölgeyi daha önce vatan edinen yerli Andalların ürünü olduğuna inanılır; Pentoslular böyle doğdu."

 tradition_agot_doom_name:0 "Kıyamet'in Örttüğü"

 tradition_agot_doom_desc:0 "Kıyamet dünyayı sonsuza dek değiştirdi ve bugün hâlâ bir gizem olmayı sürdürüyor. Felaket niteliğindeki yıkımdan kaçanlar, bugün hâlâ onun gölgesi altında yaşıyor."

 tradition_agot_slavers_bay_name:0 "Ticaretin Esiri"

 tradition_agot_slavers_bay_desc:0 "Eski İmparatorluğun ve hatta Özgür Diyar'ın can damarı köle ticaretiydi. Bir halk, başka bir halkın özgürlüğü pahasına olsa bile, kendi geleceğini inşa etmek için bu ticaretten beslenerek refaha erebilir ve büyüyebilir."

 tradition_agot_ghis_name:0 "Büyüklerin Pençesinde"

 tradition_agot_ghis_desc:0 "Eski Gis İmparatorluğu, disiplin ve metanet sayesinde yükselip yayıldı. Köle kullanımına rağmen Eski İmparatorluk, Uyumlu Adım Lejyonları'ndaki özgür adamların silah gücü üzerine kuruldu; eğitimleri ve düzenleri o kadar büyüktü ki karşılarında hiçbir insan ordusu duramazdı, yalnızca ejderhalar ve alevleri durabilirdi."

 tradition_agot_rhoynar_name:0 "Nehirlerin Anası Üzerinde"

 tradition_agot_rhoynar_desc:0 "Dünyanın büyük uygarlıklarından biri, batı Essos'un büyük nehri Rhoyne üzerinde doğdu. Rhoynarlar, şehirlerinin güzelliği ve demir eritme kullanımı ile öğretimiyle ünlüdür."

 tradition_agot_candling_name:0 "Büyük Mum'un Altında"

 tradition_agot_candling_desc:0 "Büyük Mum'a selam olsun. Herkes Büyük Mum'a tapacak. Büyük Mum bilgedir. Büyük Mum efendimizdir; kimin gideceğini, kimin kalacağını o seçecektir. MUM, MUM, MUM..."

 tradition_agot_andalosi_name:0 "Alevle Arınmış"

 tradition_agot_andalosi_desc:0 "#italic “Büyük Qarlon ordusuyla birlikte yandı ve ardından ejderha lordları, Lorath adalarına kan ve ateş getirerek uçup gitti. Qarlon'un büyük kalesi alevlere teslim oldu; kıyılarındaki kasabalar ve balıkçı köyleri de. Adaları kasıp kavuran ateş fırtınaları, labirentlerin büyük taşlarını bile kömürleştirip kararttı. Lorath'ın Temizlenmesi'nde tek bir erkek, kadın ya da çocuğun hayatta kalmadığı söylenir; öyle kızgındı ki o ateşler.#!"

 tradition_agot_andal_name:0 "Günbatımını Kovalamak"

 tradition_agot_andal_desc:0 "#italic “...Yedi'nin bizzat Andalos tepelerinde halkları arasında yürüdüğü ve Tepeli Hugor'u taçlandırarak ona ve soyundan gelenlere yabancı bir diyarda büyük krallıklar vaat ettiği söylenir. Septonlar ve septalar, Andalların Essos'tan ayrılıp batıya Westeros'a yönelmesinin nedeni olarak bunu öğretir,”#!"

 tradition_agot_braavosi_name:0 "Mor Yelkenlerle Taşınan"

 tradition_agot_braavosi_desc:0 "#italic “Ve özgürlük uğruna hayatlarını riske attıkları için, yeni şehrin anne ve babaları, Braavos'ta hiçbir erkek, kadın ya da çocuğun asla köle, esir ya da bağlı olmaması gerektiğine ant içti. Bu, Uzun Kanal'ı aşan kemerin üzerine taşa kazınmış Braavos'un Birinci Yasası'dır. O günden bugüne Braavos'un Deniz Lordları, köleliğin her biçimine karşı çıktı ve köle tacirleri ile müttefiklerine karşı pek çok savaş verdi.#!"

 tradition_agot_lorathi_name:0 "Ada ve Labirentin Körlüğünde"

 tradition_agot_lorathi_desc:0 "#italic “Bu yeni Lorathlılar, ilk başlarda kendilerinden önce gelen Boash taraftarlarına tabiydi ve Kör Tanrı'nın rahipleri uzun yıllar adaları yönetmeye devam etti. Ancak zamanla yeni gelenlerin sayısı arttı, sadıkların safları ise azaldı. Boash'a tapınma yok oldu; kalan rahipler daha dünyevi ve yozlaşmış hale gelerek kıl gömleklerini, keşküllerini ve dindarlıklarını bırakıp, yönettikleri halktan topladıkları vergilerle şişmanlayıp zenginleştiler. Sonunda balıkçılar, çiftçiler ve diğer sıradan halk ayaklanarak Boash'ın prangalarını üzerlerinden attı.#!"

 tradition_agot_lyseni_name:0 "Alacakaranlık Sevgisi"

 tradition_agot_lyseni_desc:0 "#italic “Lys'liler aynı zamanda büyük köle yetiştiricileridir; giderek daha zarif ve güzel kurtizanlar ve yatak köleleri üretme umuduyla güzelliği güzellikle çiftleştirirler. Valyria'nın kanı Lys'te hâlâ güçlü akar; sıradan halk bile çoğu zaman soluk ten, gümüş-altın saç ve eski ejderha lordlarının mor, leylak ve uçuk mavi gözleriyle övünür. Lys soyluluğu her şeyin üzerinde kan saflığına değer verir ve birçok ünlü (ve kötü şöhretli) güzellik yetiştirmiştir.#!"

 tradition_agot_myrish_name:0 "Merceğin Berraklığı"

 tradition_agot_myrish_desc:0 "#italic “O günden beri ticaret Myr'ın can damarı olmuştur ve Myr gemileri yüzyıllardır Dar Deniz'in sularında seyreder. Çoğu köle doğumlu olan Myr zanaatkarları da büyük ölçüde ünlüdür; Myr dantelinin ve Myr duvar halılarının ağırlığınca altın ve baharat değerinde olduğu söylenir ve Myr merceklerinin tüm dünyada eşi benzeri yoktur.#!"

 tradition_agot_norvoshi_name:0 "Çan ve Saç Sesinde"

 tradition_agot_norvoshi_desc:0 "#italic “Bugün Büyük Norvos, Rhoyne'un kaynak sularına hakim olsa da, Norvoshlular eski çağlarda o güçlü nehre hükmeden Rhoynarların soyundan gelmez. Diğer Özgür Şehirler gibi Norvos da Valyria'nın bir kızıdır.#!"

 tradition_agot_pentoshi_name:0 "Borç Zincirleriyle"

 tradition_agot_pentoshi_desc:0 "#italic “İlk Pentoslular tüccarlar, tacirler, denizciler ve çiftçilerdi; aralarında soylu doğumlu çok az kişi vardı; belki de bu yüzden Valyria kanlarını daha az koruyucuydular ve yönettikleri toprakların asıl sakinleriyle evliliğe daha istekliydiler.#!"

 tradition_agot_hartalari_name:0 "Üç Topuğun Altında"

 tradition_agot_hartalari_desc:0 "#italic “Tyrosh, Lys ve Myr arasındaki savaşlar yalnızca İhtilaflı Topraklar'daki özgür birliklerin doğuşunu körüklemekle kalmamış, aynı zamanda ödeyen herkes için savaşmaya hazır yelken satıcıları olan korsan ve deniz paralı asker filolarının oluşmasını da sağlamıştır. Çoğunun üssü, Kırık Kol ile doğu kıyısı arasındaki dar denizi nokta nokta süsleyen adalar olan Stepstones'tedir.#!"

 tradition_agot_qohorik_name:0 "Orman ve Ocağın Karanlığında"

 tradition_agot_qohorik_desc:0 "#italic “Qohor'un zanaatkarları çok ünlüdür. Başta şehrin kadınları ve çocukları tarafından dokunan Qohor duvar halıları, Myr'da dokunanlar kadar ince, ancak daha az maliyetlidir. Qohor'un pazarında zarif (her ne kadar biraz rahatsız edici olsa da) ahşap oymalar satın alınabilir ve şehrin ocaklarının benzeri yoktur.#!"

 tradition_agot_tyroshi_name:0 "Salyangozların Zenginliği"

 tradition_agot_tyroshi_desc:0 "#italic “Tyrosh boyacıları, salyangozların beslenmesini değiştirerek kısa sürede kızıl, koyu kızıl ve derin çivit boyaları da üretmeyi öğrendi. İlerleyen yüzyıllarda, bazıları doğal yollarla, bazıları simya ile yüzlerce başka ton ve renk boya geliştirdiler. Parlak renkli giysiler dünyanın dört bir yanındaki lordların ve prenslerin beğenisini kazandı ve bunları üreten boyaların hepsi Tyrosh'tan geldi. Şehir zenginleşti ve zenginlikle birlikte gösteriş geldi. Tyroshlular cafcaflı gösterişten hoşlanır; hem erkekler hem kadınlar saçlarını çirkin ve doğal olmayan renklere boyamaktan keyif alır.#!"

 tradition_agot_volantene_name:0 "Kızların İlki"

 tradition_agot_volantene_desc:0 "#italic “Kıyamet Valyria'yı ve Uzun Yaz Toprakları'nı yutunca Volantis, dünyadaki diğer tüm Valyria kolonileri üzerinde hüküm sürme hakkını öne sürdü. #italic “İlk Kız”#! öylesine güçlüydü ki bir süre diğer Özgür Şehirlerin birçoğu üzerinde hegemonya kurmayı başardı...”#!"

 tradition_agot_essosi_valyrian_name:0 "Eskinin Kanı"

 tradition_agot_essosi_valyrian_desc:0 "#italic “Volantis'in Eski Kanı'ndan birçoğu hâlâ Valyria'nın eski tanrılarına bağlıdır, ancak inançları başta Kara Surlar'ın içinde bulunur. Dışarıda ise kızıl tanrı R'hllor, özellikle şehrin köleleri ve azatlıları arasında olmak üzere birçokları tarafından tercih edilir.#!"

 tradition_agot_astapori_name:0 "İyi Efendilerce Yönetilen"

 tradition_agot_astapori_desc:0 "#italic “Tuğla ve kan Astapor'u inşa etti, tuğla ve kan da halkını, diye bir eski kafiyenin dediği gibi; bu, şehrin kızıl tuğlalı surlarını ve onları inşa ederken yaşayıp, çalışıp, ölecek olan binlerce kölenin döktüğü kanı anlatır. Kendilerine İyi Efendiler diyen adamlar tarafından yönetilen Astapor, en çok Temizlenmişler denen hadım köle-askerlerin yaratılmasıyla bilinir — çocukluktan acı hissetmeyen korkusuz savaşçılar olarak yetiştirilen adamlar.#!"

 tradition_agot_yunkaii_name:0 "Bilge Efendilerce Yönetilen"

 tradition_agot_yunkaii_desc:0 "#italic “Sarı şehir Yunkai hakkında fazla bir şey söylemeye gerek yok, zira orası son derece itibarsız bir yerdir. Kendilerine Bilge Efendiler diyen yöneticileri yozlaşmışlığa gömülmüştür; yatak köleleri ve oğlan fahişeler satarlar, daha kötüsünü de yaparlar.#!"

 tradition_agot_meereenese_name:0 "Büyük Efendilerce Yönetilen"

 tradition_agot_meereenese_desc:0 "#italic “Köleci Körfezi kıyısındaki şehirlerin en heybetlisi kadim Meereen'dir, ancak diğerleri gibi o da yıkılmakta olan bir yerdir; nüfusu, Eski İmparatorluk'un zirvesinde desteklediğinin bir kesridir. Çok renkli tuğladan surları sonsuz acıyı barındırır, zira Meereen'in Büyük Efendileri, kanla ıslanmış dövüş çukurlarında köleleri diledikleri gibi dövüşüp ölmek üzere eğitir.#!"

 tradition_agot_ghiscari_name:0 "Yıldırımları Yakalayarak"

 tradition_agot_ghiscari_desc:0 "#italic “Eski Gis: kölelik üzerine kurulmuş bir şehir. Şehrin efsanevi kurucusu Büyük Grazdan öylesine saygı görür ki köle taciri ailelerin erkeklerine hâlâ sık sık onun adı verilir. Giskarların en eski tarihlerine göre, yüksek kalkanları ve üç mızraklarıyla disiplinli kitleler halinde savaşan ilk birlikler olan uyumlu adım lejyonlarını kuran da oydu. Eski Gis ve ordusu, önce çevresini kolonileştirdi, ardından ilerleyerek komşularını boyunduruğu altına aldı. İlk imparatorluk böyle doğdu ve yüzyıllar boyunca mutlak hüküm sürdü.#!"

 tradition_agot_rhoynish_name:0 "Su Kabuklarıyla Yeminli"

 tradition_agot_rhoynish_desc:0 "#italic “Rhoynarlar gibi birkaçı, gelgite karşı yüzyıllarca, hatta binlerce yıl dayandı. Rhoyne kıyısında büyük şehirler kuran Rhoynarların, demir işleme sanatını öğrenen ilk halk olduğu söylenir.#!"

 tradition_agot_chroyanar_name:0 "Festival Sevgisiyle"

 tradition_agot_chroyanar_desc:0 "#italic “...ve hepsinin en büyüğü, büyük Aşk Sarayı ile festival şehri Chroyane;#!"

 tradition_agot_mellar_name:0 "Çiçek Bataklığının Üzerinde"

 tradition_agot_mellar_desc:0 "#italic “...çiçeklerin solgun Sar Mell'i;”#!"

 tradition_agot_qhoynar_name:0 "Mermer Yumruklarla Yükselmiş"

 tradition_agot_qhoynar_desc:0 "#italic “Qhoyne üzerindeki Ar Noy, yeşil mermer salonlarıyla;”#!"

 tradition_agot_sarhar_name:0 "Tuz Kanallarıyla Beslenen"

 tradition_agot_sarhar_desc:0 "#italic “...denizle çevrili Sarhoy, kanalları ve tuzlu su bahçeleriyle;”#!"

 tradition_agot_sarar_name:0 "Çeşmelerin Şarkısıyla Canlı"

 tradition_agot_sarar_desc:0 "#italic “Çeşmeler şehri Ny Sar, şarkıyla canlı;”#!"

 ibbenese_heritage_trigger:0 "[culture|E], Ibbenese [heritage|E]'sinden olmalıdır"

 westerosi_heritage_trigger:0 "[culture|E], Westeros [heritage|E]'sinden olmalıdır"

 tradition_agot_axemen_name:0 "Baltayı Kavramak"

 tradition_agot_axemen_desc:0 "#italic “Andallar beraberlerinde demir silahlar ve demir plaka zırhlar getirdi; o topraklarda yaşayan kabileler bunlara karşı çok az şey yapabildi.#!"

 tradition_agot_essari_name:0 "Güneşin ve Göğün Görünümünde"

 tradition_agot_essari_desc:0 "#italic “Valyria kolonisi Essaria, kimi zaman Kayıp Özgür Şehir olarak hatırlanır,”#!"

 tradition_agot_noynar_name:0 "Kürk Tepelerin Arasından"

 tradition_agot_noynar_desc:0 "#italic “...Ana'nın Vahşi Kızı Noyne'u kollarında topladığı yerde,”#!"

 tradition_agot_valyrian_original_name:0 "Özgür Diyar'ın İradesi"

 tradition_agot_valyrian_original_desc:0 "#italic “Valyrialıların kralı yoktu; bunun yerine kendilerine Özgür Diyar dediler, çünkü toprak sahibi tüm yurttaşların söz hakkı vardı.#!"

 tradition_agot_dothraki_sea_name:0 "Büyük Çimen Denizi Üzerinde"

 tradition_agot_dothraki_sea_desc:0 "#italic “Evlerini Büyük Çimen Denizi üzerinde kuranlar göçebe bir yaşam tarzı sürer,”#!"

 tradition_agot_dothraki_name:0 "Dünyaya Binmek"

 tradition_agot_dothraki_desc:0 "#italic “Gezginler, bu toprakları üzerlerini süsleyen sayısız harabe şehir nedeniyle Lanetli Topraklar, boşlukları nedeniyle de Büyük Çoraklık olarak adlandırır; ancak bu otlaklar bugün en çok Dothraki denizi olarak bilinir. Yine de bu kullanım nispeten yenidir, zira Dothraki genç bir ırktır ve khalasarları, Kıyamet Valyria'yı yok ettikten sonra bu topraklara hakim oldu; doğudan ateş ve çelikle süpürüp gelerek bir zamanlar burada gelişen kadim şehirleri fethedip yıktı ve halklarını esarete sürükledi.#!"

 tradition_agot_grass_sea_name:0 "Toynağın Altında"

 tradition_agot_grass_sea_desc:0 "#italic “...Dothraki denizi üzerinde güneş ışığı, toprak ve ölüm kokularıyla zengin, canlı ova. Rüzgar otları kımıldattı ve onlar su gibi dalgalandı.#!"

 tradition_agot_lhazareen_name:0 "Birleşik Bir Sürü"

 tradition_agot_lhazareen_desc:0 "#italic “...bu ülkenin halkı kendilerine Lhazareen adını verdi, ancak Dothrakiler onlara haesh rakhi, Kuzu Adamlar diyordu.#!"

 tradition_agot_omberi_name:0 "Gönüllü Bir Haraççı"

 tradition_agot_omberi_desc:0 "#italic “Daha da doğuya devam edecek kadar cesur olanlar, bir sonraki durakta küçük, kırsal Omber Krallığı'nın kıyılarından geçecektir; korkak kralları ve güçsüz prensleri, rahatsız edilmemek için her yıl Dothraki at efendilerine ödedikleri tahıl, mücevher ve kızlarla bilinir.#!"

 tradition_agot_sarnori_name:0 "Balıkçı Kraliçelerin Soyu"

 tradition_agot_sarnori_desc:0 "#italic “Sarnor Krallığı (kırk rakip kralı olduğu halde böyle anılırdı) iki bin yıldan fazla bir süre bilinen dünyanın büyük uygarlıkları arasındaydı; yine de onlar hakkında bildiklerimizin çoğu, başta Yaz ve Kış Yıllıkları olmak üzere kaybolmuş tarihlerinin parçalarından ve Qarth, Köleci Körfezi ile Özgür Şehirler'deki kayıtlardan gelir. Sarnor tüccarları Valyria'ya ve Yi Ti'ye, Leng'e ve Asshai'ye seyahat etti. Sarnor gemileri Titreyen Deniz'de Ib'e, Bin Adalar'a ve Uzak Mossovy'ye yelken açtı. Sarnor kralları Qaathilere ve Eski Gis İmparatorluğu'na karşı savaştı ve doğularındaki bozkırlarda dolaşan göçebe atlı çetelerine karşı birçok akına öncülük etti.#!"

 tradition_agot_tagaez_fen_name:0 "Kulelerin Soyu"

 tradition_agot_tagaez_fen_desc:0 "#italic “Westeros onları fethedenleri Sarnoriler olarak hatırlar, zira zirvesindeyken büyük krallıkları, Sarne ve kollarının suladığı tüm toprakları ve küçülen Gümüş Deniz'den geriye kalan üç büyük gölü kapsıyordu. Kendilerine Uzun Adamlar derlerdi (kendi dillerinde Tagaez Fen). Zoqoralar gibi uzun bacaklı ve esmer tenliydiler, ancak saçları ve gözleri gece gibi siyahtı. Savaşçılar, büyücüler ve bilginler olarak, soy çizgilerini, Balıkçı Kraliçeler'in sonuncusundan doğan, Şaşırtıcı diye çağırdıkları kahraman kral Huzhor Amai'ye dayandırıyorlardı,”#!"

 tradition_agot_trimbaez_fen_name:0 "Kervanların Soyu"

 tradition_agot_trimbaez_fen_desc:0 "#italic “Doğuda Kervanlar Şehri Kasath yükseliyordu;”#!"

 tradition_agot_goraez_fen_name:0 "Gölün Soyu"

 tradition_agot_goraez_fen_desc:0 "#italic “Kanallarıyla Göl Kıyısındaki Gornath;”#!"

 tradition_agot_zanhar_fen_name:0 "Bilginlerin Soyu"

 tradition_agot_zanhar_fen_desc:0 "#italic “Gümüş Kıyı'daki Sallosh, Bilginler Şehri, devasa kütüphanesi ve Boyalı Surları ile.#!"

 tradition_agot_madekh_fen_name:0 "Askerlerin Soyu"

 tradition_agot_madekh_fen_desc:0 "#italic “Burada da, Yenilmez Mardosh olarak ünlü Askerler Şehri Mardosh duruyordu.#!"

 tradition_agot_gilal_fen_name:0 "Şelalelerin Soyu"

 tradition_agot_gilal_fen_desc:0 "#italic “Sarne'in iki kolunun birleştiği noktadaki Şelale Şehri Sathar;”#!"

 tradition_agot_giren_fen_name:0 "Tepelerin Soyu"

 tradition_agot_giren_fen_desc:0 "#italic “Sarnor tüccarları Valyria'ya ve Yi Ti'ye, Leng'e ve Asshai'ye seyahat etti.#!"

 tradition_agot_cenaakh_fen_name:0 "Tapınakların Soyu"

 tradition_agot_cenaakh_fen_desc:0 "#italic “Sarnor Krallığı'nın yüz tanrısı yalnızca orada hâlâ tapınılıyor.#!"

 tradition_agot_zivylar_fen_name:0 "Sikkelerin Soyu"

 tradition_agot_zivylar_fen_desc:0 "#italic “Aşağı yönde, Sarne'in kuzeye döndüğü yerde, müreffeh nehir şehirleri Rathylar, Hornoth ve Kyth, onun koyu mavi sularında seyreden gemilere hizmet ediyordu.#!"

 tradition_agot_cewi_fen_name:0 "İkiz'in Soyu"

 tradition_agot_cewi_fen_desc:0 "#italic “Yüzyıllar önce bir Dothraki khal tarafından yağmalanıp yok edilen Saath'ın kardeş şehri Sarys'in kalıntıları, deltanın genişliği boyunca bulunabilir.#!"

 tradition_agot_dawiz_fen_name:0 "Sonun Soyu"

 tradition_agot_dawiz_fen_desc:0 "#italic “...bugün yalnızca Saath yıkılmamış durumdadır ve o liman şehri, bir zamanlar olduğundan çok küçülmüş, hüzünlü bir yerdir,”#!"

 tradition_agot_cymmeri_name:0 "Bir Eşin Göğüs Zırhıyla"

 tradition_agot_cymmeri_desc:0 "#italic “...Cymer eşi zırhını yaptı (zira onun halkı demir işleyen ilk halktı)”#!"

 tradition_agot_gipps_name:0 "Bir Eşin Kalkanıyla"

 tradition_agot_gipps_desc:0 "#italic “...hasır kalkanları ve kireçle sertleştirilmiş saçlarıyla uzun bacaklı Gippler,”#!"

 tradition_agot_zoqora_name:0 "Bir Eşin Sürüşüyle"

 tradition_agot_zoqora_desc:0 "#italic “Zoqora eşinin savaş arabasını sürdüğü söylenir,”#!"

 tradition_agot_first_clans_name:0 "Boynuz Üfleyenler"

 tradition_agot_first_clans_desc:0 "#italic “...ve kadim günlerde Kış Boynuzu'nu üfleyip devleri topraktan uyandıran Joramun.#!"

 tradition_agot_nonteloshi_name:0 "Nezaket Bağlarıyla"

 tradition_agot_nonteloshi_desc:0 "#italic “Dokuz Özgür Şehir deriz, ancak Essos'un eni boyunca, bazıları Gulltown, White Harbor ve hatta Lannisport'tan daha büyük ve kalabalık birçok başka Valyria kasabası, yerleşimi ve karakolu bulunabilir. Dokuz'u ayıran ayrım boyutları değil, kökenleridir.#!"

 tradition_agot_valemen_main_name:0 "Şahinlerin Mertliği"

 tradition_agot_valemen_main_desc:0 "#italic “Valeliler gibi bazıları Andallara boyun eğdi, hatta Yedi inancını bile benimsedi. Çoğu durumda Andallar, hüküm sürme haklarını sağlamlaştırmanın bir yolu olarak, yenilmiş kralların eşlerini ve kızlarını kendilerine eş aldı. Zira her şeye rağmen İlk İnsanlar Andallardan çok daha kalabalıktı ve basitçe kenara itilemezdi.#!"

 tradition_agot_valemen_finger_name:0 "Taşa Kazınmış Yıldızlar"

 tradition_agot_valemen_finger_desc:0 "#italic “Septonlar, şarkıcılar ve maesterler, Andalların karaya ilk çıktığı yerin Vale of Arryn'deki Parmaklar olduğu konusunda hemfikirdir. Yedi uçlu yıldız oymaları o bölgedeki kayalar ve taşların üzerine dağılmıştır — bu uygulama, Andal fetihleri ilerledikçe sonunda kullanımdan düşmüştür.#!"

 tradition_agot_valemen_upper_name:0 "Hepsinin Üzerinde Yükseklerde"

 tradition_agot_valemen_upper_desc:0 "#italic “Nehir topraklarından Ay Dağları üzerinden geçen yüksek yol çok kan dökülmüş bir yoldur; dik ve taşlı olduğu halde, bir ordunun Vale'e girmesi için en olası yolu sağlar.#!"

 tradition_agot_sistermen_name:0 "Dalgayla Kıyıya Vuran Hazineler"

 tradition_agot_sistermen_desc:0 "#italic “Vale'e son evlenen adalar Üç Kızkardeş'ti. Binlerce yıl boyunca bu adalar, uzun tekneleriyle Bite'ta, dar denizde ve hatta Titreyen Deniz'de cezasız seyreden, dilediği gibi yağmalayıp akın eden ve altın ve kölelerle yüklü olarak Kızkardeşler'e dönen kendi zalim krallarına, korsanlarına ve akıncılarına sahipti.#!"

 tradition_agot_rivermen_main_name:0 "Trident'in Çatalları Üzerinde"

 tradition_agot_rivermen_main_desc:0 "#italic “Trident lordları, kadim haksızlıkların ve geçmiş ihanetlerin anılarını sık sık bir kenara bırakmazdı; düşmanlıkları, topraklarını sulayan nehirler kadar derindi.#!"

 tradition_agot_crownlander_name:0 "Blackwater'dan Doğan"

 tradition_agot_crownlander_desc:0 "#italic “Sadık lordlarını Kral Toprakları'na çağırdı, ancak gelenlerin hepsi taç topraklarının küçük lordlarıydı...”#!"

 tradition_agot_clawmen_name:0 "Pençenin İradesi"

 tradition_agot_clawmen_desc:0 "#italic “...onlara Crackclaw Burnu hikayeleri anlatıyordu. Her kasvetli vadinin bir lordu vardı, dedi; hepsi yalnızca yabancılara duydukları güvensizlikle birleşiyordu. Damarlarında İlk İnsanlar'ın kanı koyu ve güçlü akıyordu. "The Andals tried t' take Crackclaw, but we bled them in the valleys and drowned them in the bogs. Only what their sons couldn't win with swords, their pretty daughters won with kisses. They married into the houses they couldn't conquer, aye."”#!"

 tradition_agot_high_valyrian_name:0 "Ejderhanın Kanı"

 tradition_agot_high_valyrian_desc:0 "#italic “Eski Valyria'nın ejderha lordları, bineklerini bağlama büyüleri ve büyülü boynuzlarla kontrol ederdi.#!"

 tradition_agot_western_valyrian_name:0 "Gelgitin Armağanları"

 tradition_agot_western_valyrian_desc:0 "#italic “...Targaryenlerden önce Westeros'a gelmiş, eski ve efsanevi Valyria mirasına sahip bir aile,”#!"

 tradition_agot_ironborn_name:0 "Demir Bedeli Ödemek"

 tradition_agot_ironborn_desc:0 "#italic “Savaş, demir adamın asıl mesleğiydi. Boğulmuş Tanrı onları akın edip yağmalamak, krallıklar oymak ve adlarını ateşe, kana ve şarkıya yazmak için yaratmıştı.#!"

 tradition_agot_greenborn_name:0 "Yeşil Topraklara Hükmetmek"

 tradition_agot_greenborn_desc:0 "#italic “Bir demir adamı ipeklere ve kadifelere büründürebilir, okuma yazma öğretip kitaplar verebilir, onu mertlik, nezaket ve İnanç'ın gizemleri konusunda eğitebilirsin... ama gözlerinin içine baktığında deniz yine orada olacaktır; soğuk, gri ve acımasız.#!"

 tradition_agot_first_men_name:0 "Bronz ve Binekle Fethetmek"

 tradition_agot_first_men_desc:0 "#italic “Beraberlerinde tuhaf tanrılar, atlar, sığırlar ve bronz silahlar getiren İlk İnsanlar, aynı zamanda çocuklardan daha iri ve daha güçlüydü; bu yüzden ciddi bir tehdittiler.#!"

 tradition_agot_northmen_name:0 "Kurtlar ve Kışla Yönetilen"

 tradition_agot_northmen_desc:0 "#italic “Ocağı, yüreği ve hasadı sana teslim ediyoruz, lordum. Kılıçlarımız, mızraklarımız ve oklarımız emrine amadedir. Zayıflarımıza merhamet, çaresizlerimize yardım ve herkese adalet ver; biz de seni asla yarı yolda bırakmayalım... Toprak ve su üzerine ant içerim... Bronz ve demir üzerine ant içerim... Buz ve ateş üzerine ant içeriz.#!"

 tradition_agot_bearmen_name:0 "Ayı ve Akraba ile Ayakta"

 tradition_agot_bearmen_desc:0 "#italic “"She-bears, aye," said Lady Maege. "We have needed to be. In olden days the ironmen would come raiding in their longboats, or wildlings from the Frozen Shore. The men would be off fishing, like as not. The wives they left behind had to defend themselves and their children, or else be carried off."”#!"

 tradition_agot_wolfswood_clansmen_name:0 "Diş ve Tüyle Avlanmak"

 tradition_agot_wolfswood_clansmen_desc:0 "#italic “Kurtağacı tehlikelerle doludur; son seferin sana bunu öğretmiş olmalı.#!"

 tradition_agot_northern_clans_name:0 "Zincir Zırh ve Buzla Silahlanmış"

 tradition_agot_northern_clans_desc:0 "#italic “Harita, arazi değildir, derdi babam sık sık. İnsanlar binlerce yıldır yüksek vadilerde ve dağ çayırlarında yaşadı, klan reisleri tarafından yönetildi.#!"

 tradition_agot_barrowmen_name:0 "Derecikler ve Tepeler Üzerinde Hücum"

 tradition_agot_barrowmen_desc:0 "#italic “Kuzeyde her yerde tümülüsler vardır, Yüce Hükümdarım... Bu toprak eskidir... Ve soğuktur.#!"

 tradition_agot_stoneborn_name:0 "Taş ve Et Ziyafeti"

 tradition_agot_stoneborn_desc:0 "#italic “...şey, kalp ağaçları bile Skagos'ta yapılanların ancak yarısını görür.#!"

 tradition_agot_krakenmen_name:0 "Tuz ve Kardan Doğan"

 tradition_agot_krakenmen_desc:0 "#italic “Gerçekten de Demir Adalar'a en yakın olan Cape Kraken öylesine çok el değiştirdi ki birçok maester, halkının kanda Kuzeylilerden çok demir adamlara daha yakın olduğuna inanır.#!"

 tradition_agot_crannogmen_name:0 "Toprak ve Suyla Yeminli"

 tradition_agot_crannogmen_desc:0 "#italic “Halkı da en az o kadar tehlikeliydi; nadiren görülür ama her zaman pusuda beklerdi: bataklıkta yaşayanlar, kurbağa yiyenler, çamur adamlar.#!"

 tradition_agot_harbormen_name:0 "Kar ve Gümüşle Karşılanan"

 tradition_agot_harbormen_desc:0 "#italic “Mander kıyısında büyük lordlardı; ta ki hadlerini aşıp yeşil eller onları yere çarpana dek. Kurt kral altınlarını aldı, ama onlara toprak verdi ve tanrılarını korumalarına izin verdi.#!"

 tradition_agot_stormlander_main_name:0 "Gök Gürültüsü Savaşçıları"

 tradition_agot_stormlander_main_desc:0 "#italic “Yine de fırtına topraklarında ev kurmayı seçenler — ister dar denizin taşlı kıyılarında, ister yağmur ormanının damlayan yeşil ormanlarının ortasında, ister rüzgara açık sınır bölgelerinde — özel bir türdür. Fırtına topraklarının insanları, havaları gibidir, denmiştir sık sık: gürültülü, şiddetli, amansız, öngörülemez.#!"

 tradition_agot_marcher_name:0 "Kılıçların Şarkısı"

 tradition_agot_marcher_desc:0 "#italic “Kızıl Dağlar'ın görüş alanında, Sınır Bölgesi lordlarının büyük kaleleri durur; güneyden gelen Dorne akınlarına ve batıdan gelen Reach Kralları'nın çelik zırhlı kullarına karşı fırtına topraklarının sınırlarını korumak için inşa edilmiştir.#!"

 tradition_agot_westermen_main_name:0 "Kayalardan Altın"

 tradition_agot_westermen_main_desc:0 "#italic “Bu ailelerin her biri birer güç haline geldi ve bazıları zamanla lord, hatta kral unvanlarını aldı. Yine de batı topraklarındaki en büyük lordlar, makamı Günbatımı Denizi'nin yanında yükselen devasa bir kayada olan Kaya'nın Casterlylarıydı.#!"

 tradition_agot_stone_dornish_name:0 "Kan ve Akbaba Geçitleri"

 tradition_agot_stone_dornish_desc:0 "#italic “Taşlı Dornelular, dağların kuzeyindekilerle en çok ortak yöne sahiptir ve Rhoyne geleneklerinden en az etkilenenlerdir. Ancak bu, onları Sınır Bölgesi lordlarıyla ya da Reach Lordlarıyla yakın müttefik yapmamıştır; tam tersine, dağ lordlarının, Vale'in dağ klanlarınınki kadar vahşi bir geçmişe sahip olduğu söylenmiştir; binlerce yıldır Reach'le, fırtına topraklarıyla ve birbirleriyle savaşmışlardır.#!"

 tradition_agot_salt_dornish_name:0 "Güneş ve Mızrağın Evliliği"

 tradition_agot_salt_dornish_desc:0 "#italic “Tuzlu Dornelular, Rhoynarların soyu, yüzyıllar içinde ana dillerini kaybetti; ancak o dil, Dorneluların Ortak Dil'i konuşma biçimini hâlâ damgalar — bazı sesleri uzatır, bazılarını yuvarlar ve bazılarını tuhaf yerlerde ahenkle söyler. Dorne konuşması, kimilerince büyüleyici, kimilerince (başta ve haksızca sınır bölgesi halkı tarafından) anlaşılmaz olarak tanımlanmıştır. Ama bundan da öte, Rhoynarlar beraberlerinde geleneklerini ve yasalarını getirdi,”#!"

 tradition_agot_sand_dornish_name:0 "Çöl ve Kumul Tehlikeleri"

 tradition_agot_sand_dornish_desc:0 "#italic “Kumlu Dornelular daha Rhoyne'lidir ve çölün zorlu yaşam tarzına alışıktırlar. Dorne'un nehirleri Mander ya da Trident ile karşılaştırıldığında cılızdır, ancak tarlaları sulamaya ve köyler ile kasabaları ayakta tutmaya yetecek kadar su getirirler. Yine de onların dışında insanlar farklı bir biçimde yaşar: çöl vahasından çöl vahasına göç eder, çoraklığın ortasında bildikleri kuyuların yardımıyla kumları geçer, çocuklarını keçileri ve atlarıyla birlikte büyütürler.#!"

 tradition_agot_greenblood_name:0 "Yeşil ve Bela Mavnaları"

 tradition_agot_greenblood_desc:0 "#italic “Rhoynarların bazıları gemilerin kaybının yasını tuttu ve yeni topraklarını benimsemek yerine, tapınmaya devam ettikleri Ana Rhoyne'un soluk bir gölgesi olarak buldukları Yeşilkan'ın sularında seyretmeye başladı. Bugün hâlâ varlıklarını sürdürüyorlar; Yeşilkan'ın öksüzleri olarak bilinirler.#!"

 tradition_agot_thenns_name:0 "İlklerin Sonuncusu"

 tradition_agot_thenns_desc:0 "#italic “...kendi halkının lorddan çok tanrı saydığı Thenn'in Magnar'ı;”#!"

 tradition_agot_cave_dweller_name:0 "Toprağın Derinliklerinde"

 tradition_agot_cave_dweller_desc:0 "#italic “Daha derine indi, hem de daha derine; geri dönmeyi denediğinde, tanıdık görünen yollar gökyüzü yerine taşta son buluyordu. Kısa süre sonra meşaleleri birer birer sönmeye başladı, ta ki sonunda karanlıktan başka bir şey kalmayana dek. Gendel'in halkı bir daha görülmedi, ama durgun bir gecede tepelerin altında, hâlâ yukarı dönüş yolunu arayan çocuklarının çocuklarının çocuklarının hıçkırıklarını duyabilirsin. Dinle? Onları duyuyor musun?#!"

 tradition_agot_fangmen_name:0 "Taş ve Buz Vahşetinde"

 tradition_agot_fangmen_desc:0 "#italic “Kaç yabanıl var? Savaş çağında kaç adam? Kimse kesin olarak bilmiyor. Frostfangs acımasız, yaşanmaz, taş ve buzdan bir vahşiliktir. Uzun süre büyük sayıda insanı barındıramaz. Bu toplanmada tek bir amaç görebiliyorum.#!"

 tradition_agot_forestmen_name:0 "Bükülmeyen Dizler"

 tradition_agot_forestmen_desc:0 "#italic “Biz özgür halk, siz diz çökenlerin unuttuğu şeyleri biliriz. Bazen kısa yol en güvenlisi değildir, Jon Snow. Boynuzlu Lord bir zamanlar büyünün kabzasız bir kılıç olduğunu söylemişti. Onu kavramanın güvenli bir yolu yoktur.#!"

 tradition_agot_frozen_shoremen_name:0 "Diş ve Kazma ile"

 tradition_agot_frozen_shoremen_desc:0 "#italic “...ve daha da tuhaf yerler: vahşi köpek sürülerinin çektiği, mors kemiklerinden yapılmış savaş arabalarına binen Donmuş Kıyı adamları,”#!"

 tradition_agot_hornfoots_name:0 "Ayaklarını Koru"

 tradition_agot_hornfoots_desc:0 "#italic “Jon kendi gözleriyle, haşlanmış deri kadar sert çıplak tabanlarıyla kol düzeninde tırıs giden Hornfoot adamlarını görmüştü.#!"

 tradition_agot_ice_river_clans_name:0 "Eriyen Bir Buz Parıltısı"

 tradition_agot_ice_river_clans_desc:0 "#italic “insan etiyle ziyafet çektikleri söylenen korkunç buz nehir klanları,”#!"

 tradition_agot_lake_folk_name:0 "Bırak Gitsin"

 tradition_agot_lake_folk_desc:0 "#italic “Adamların kürekle temizlediği yerler dışında kar her yerde diz boyuydu; donmuş zemine balta, kürek ve kazma ile delikler açıyorlardı. Rüzgar batıdan savruluyor, göllerin donmuş yüzeyi boyunca daha da fazla kar sürüklüyordu.#!"

 tradition_agot_milkwatermen_name:0 "Krallar ve Kahramanlar Vadisi"

 tradition_agot_milkwatermen_desc:0 "#italic “...yüz mezar açtılar . . . Süt Suyu vadisinin her yanında kralların ve kahramanların mezarları, ama asla . . .”#!"

 tradition_agot_nightrunners_name:0 "Solgun Ay Işığında Dans"

 tradition_agot_nightrunners_desc:0 "#italic “...Harma Köpekbaş ile Kemik Lordu arasında, Hornfootlar ile Gecekoşanları arasında barış sağlamak,”#!"

 tradition_agot_moon_clans_name:0 "Yukarıdan Gelen Öfke"

 tradition_agot_moon_clans_desc:0 "#italic “...ancak çok daha fazlası batıya, Ay Dağları'nın yüksek vadilerine ve taşlı geçitlerine kaçtı. Bir zamanlar gururlu olan bu halkın soyundan gelenler, tam da bugün orada, zirveler arasında haydut ve kaçak olarak kısa, vahşi ve acımasız hayatlar sürüyor; güçlü bir refakat olmadan dağlarına girecek kadar aptal olan herkese musallat oluyorlar. Sur'un ötesindeki özgür halktan pek de iyi olmayan bu dağ klanlarına da uygarlar tarafından yabanıl deniyor.#!"

 tradition_agot_the_sorrows_name:0 "Kederin Sisinde"

 tradition_agot_the_sorrows_desc:0 "#italic “Burası kötü bir yerdi; umutsuzluk ve ölüm kokuyordu. Ysilla haksız değil. Bu sis doğal değil. Buradaki sularda iğrenç bir şey büyümüş ve havada kemikleşmiş. Taş adamların delirmesine şaşmamak gerek.#!"

 tradition_agot_stonemen_name:0 "Griden Öpülmüş"

 tradition_agot_stonemen_desc:0 "#italic “Kederler Prensi gri öpücüğünü öyle kolay vermez.#!"

 tradition_agot_mandermen_name:0 "El Tarafından Yönlendirilen"

 tradition_agot_mandermen_desc:0 "#italic “Reach'in ta kendisi; tarlalar ve çiftlikler, göller ve nehirler, tepeler ve ormanlar ile mis kokulu çayırlar, değirmenler ve madenlerden oluşan uçsuz bucaksız bir alan; Günbatımı Denizi'ndeki Kalkan Adaları'ndan Mander'in ağzına, Highgarden'ın ötesinden Kızıl Göl'e, Goldengrove'a ve Bitterbridge'e, ta Tumbleton'a ve Mander'in kaynak sularına dek küçük köyler, gelişen pazar kasabaları ve kadim kalelerle bezenmiş bir diyar.#!"

 tradition_agot_honeywiner_name:0 "Düşünce ve İnançla"

 tradition_agot_honeywiner_desc:0 "#italic “Reach'in hiçbir tarihi, Westeros'un en ihtişamlı ve en kadim şehri olan, Kral Toprakları nüfus bakımından onu gölgede bırakmış olsa bile hâlâ en zengin, en büyük ve en güzel şehir olmaya devam eden Oldtown'a bakılmadan tamamlanmaz.#!"

 tradition_agot_shieldmen_name:0 "Sisteki Kalkanlar"

 tradition_agot_shieldmen_desc:0 "#italic “En belirleyici darbeyi, Reach Kralı Altın El Kral Garth VII indirdi: demir adamları Sisli Adalar'dan kovdu, adaları Kalkan Adaları olarak yeniden adlandırdı ve Mander'in ağzını savunmak için onları kendi en vahşi savaşçıları ve en iyi denizcileriyle yeniden iskan etti.#!"

 tradition_agot_arbormen_name:0 "Yelkenlerimizde Şarapla"

 tradition_agot_arbormen_desc:0 "#italic “...bir kadeh daha şarap için; Arbor'dan, meyveli ve dolgun, altın rengi bir mahsul.#!"
