﻿﻿﻿﻿﻿﻿﻿l_english:

 ethos_festive_name:0 "Şenlikli"

 ethos_festive_desc:0 "Yaşamın kasvetli zorlukları karşısında bu kültür, toplu şenliklerde ve paylaşılan kahkahalarda kurtuluş bulur."

 ethos_mystic_name:0 "Mistik"

 ethos_mystic_desc:0 "Tanrıların tasarımları kapalı ve bilinmezdir, ancak bu, bu kültürün sisin ardından bu dünyanın daha derin gizemlerine bakmasını engellemez."

 ethos_methodical_name:0 "Yöntemli"

 ethos_methodical_desc:0 "Sağlam adım düşüşü önler ve bu kültürün insanları, tüm olası sonuçları planlamadan hiçbir harekette bulunmaz."

 ethos_assertive_name:0 "Baskın"

 ethos_assertive_desc:0 "Bir uygarlık ancak ihtiyacı olanı alarak gelişir; bu kültürün benimsediği düşünce budur. Bunu silahla ya da sözle yapmalarının hiçbir önemi yoktur."

