l_english:

 tradition_agot_frozen_flats_name:0 "Buz Raflarının Üzerinde"

 tradition_agot_frozen_flats_desc:0 "Bu insanlar, dünyanın soğuk bölgelerinde bulunan büyük donmuş düzlüklerde yuva kurmuşlardır. Bu kışlık topraklardan en iyi şekilde yararlanarak, başkalarının yok olacağı yerlerde hayatta kalmışlardır."

 culture_in_frozen_flats_desc:0 "[culture|E], Frozen Flats [terrain|E]'li hiçbir [county|E]'de bulunmuyor"

 tradition_agot_glacier_name:0 "Buz ve Taşın Tepesinde"

 tradition_agot_glacier_desc:0 "Dünyanın dağlarının ve buzullarının tepesinde, bu insanlar kaba bir yaşam biçmişlerdir. Yaşadıkları topraklar gibi soğuk ve sert."

 culture_in_glacier_desc:0 "[culture|E], Glacier [terrain|E]'li hiçbir [county|E]'de bulunmuyor"

 tradition_agot_cloudforest_name:0 "Bulutun Ormanının İçinde"

 tradition_agot_cloudforest_desc:0 "Derin bulut ormanlarının içinde yaşam çok daha farklıdır. Görkemli ağaçların arasında güneşten bile saklanan bu insanlar geçimlerini böyle sağlar."

 culture_in_cloudforest_desc:0 "[culture|E], Cloudforest [terrain|E]'li hiçbir [county|E]'de bulunmuyor"

 tradition_agot_highlands_name:0 "Yaylaların Arasında"

 tradition_agot_highlands_desc:0 "Yaylalardaki yaşam daha gelenekseldir; şehirlerin koşuşturmacasından uzak olduklarından, buradaki insanlar kendi geleneklerini koruyabilir."

 culture_in_highlands_desc:0 "[culture|E], Highlands [terrain|E]'li hiçbir [county|E]'de bulunmuyor"

 tradition_agot_taiga_bog_name:0 "Bataklıkların Arasında"

 tradition_agot_taiga_bog_desc:0 "Kuzey iklimlerinin bataklıklarında tehlikeler boldur. Ama bu kıvrımlı çevreler güçlü bir halk yetiştirir."

 culture_in_taiga_bog_desc:0 "[culture|E], Taiga Bog [terrain|E]'li hiçbir [county|E]'de bulunmuyor"

 tradition_agot_urban_name:0 "Şehirliler"

 tradition_agot_urban_desc:0 "Birçokları onları hor görse de, kasaba halkı yaşamlarının ilk bakışta göründüğü kadar parlak olmadığını bilir. Büyük bir şehrin tehlikesinin, doğanın yabanıl uçsuz bucaksızlıklarından utanmasına gerek yoktur; zira kentsel ormanda, karanlık sokak araları çamurlu bataklıklar kadar haindir ve bir uçurumun kenarındaki yanlış bir adım kadar kesin biçimde ölümünüze imza atabilir."

 culture_in_urban_desc:0 "[culture|E], Urban [terrain|E]'li hiçbir [county|E]'de bulunmuyor"

 tradition_agot_the_bog_name:0 "Boyun'un Sakinleri"

 tradition_agot_the_bog_desc:0 "Çocuklar toprağı bir kez daha kırmaya çalıştığında, Suların Çekici Boyun'u yarattı — hem faunası hem florasıyla, dünyada tehlikeleriyle eşsiz bir yer."

 culture_in_the_bog_desc:0 "[culture|E], Bog [terrain|E]'li hiçbir [county|E]'de bulunmuyor"
