l_english:

 agot_culture_desc_fallback:0 "Kayıtlarımız bu kültür hakkında hiçbir bilgi içermiyor."

 AGOT_CULTURE_COOLTIP_CLICK:0 "#I Görüntülemek için [Culture.GetNameNoTooltip] üzerine tıklayın#!"

 AGOT_CULTURE_COOLTIP_RD:0 "#weak [Culture.MakeScope.Var('agot_culture_tt_desc').Char.Custom('GetAGOTCultureDesc')]#!"

 agot_culture_children_desc:0 "Yeryüzünün Şarkısını Söyleyenler, Woh Dak Nag Gram ya da Orman Çocukları — hangi adla anılırlarsa anılsınlar, uzun zaman önce dünyadan silindiler. Şafak Çağı'ndan ve insanın gelişinden bu yana azaldılar; artık yalnızca mitlere ve efsanelere kaldılar."

 agot_culture_dragon_desc:0 "Ejderhalar, Valyria'nın büyük silahları ve harikalarıdır. Onlar hayat bulan ateş, kanatlanan zırh ve kurnazlık kazanmış ölümdür."

 agot_culture_giant_desc:0 "Devler, Batı Diyarları'nın iki yerli türünden biridir; diğeri Orman Çocukları'dır. Çocuklar gibi Devler de insanın gelişiyle azalmıştır; ancak Duvar'ın ötesindeki uzak kuzeyde hâlâ bazıları yaşamaktadır."

 agot_culture_ifequevron_desc:0 "Kuzey Essos'un orman yürüyücüleri — Dothrakilerin Ifequevron adını verdiği halk — çağlar içinde kaybolmuş bir başka halktır. Oyma ağaçlarla ilgili anlatılara inanılacak olursa, Orman Çocukları ile akraba olabileceklerine inanılır."

 agot_culture_jhogwin_desc:0 "Kuzeydeki Kemik Dağları'nın taş devleri — Dothrakilerin Jhogwin adını verdiği yaratıklar — Jogos Nhai tarafından yok edilen, dev gibi görünen bir topluluktu."

 agot_culture_stonemen_desc:0 "Uzun süredir dünyanın uygar yerlerinden sürgün edilmiş Taş Adamlar, Hüzünler'de toplanmıştır. Orada, Örtülü Lord'un hükümdarlığı altında eski hayatlarını terk edip yeni varlıklarını benimserler."

 agot_culture_fisher_queen_race_desc:0 "Balıkçı Kraliçeler, Uzun Gece'den önce Gümüş Deniz üzerinde kurulu efsanevi bir diyara hükmediyordu. Diyarın Uzun Gece sırasında çöktüğüne inanılır; son Balıkçı Kraliçe, Huzhor Amai'yi doğurmuş ve böylece Sarnorlular ortaya çıkmıştır."

 agot_culture_others_desc:0 "Ak Gezenler — Daima Kış Diyarı'nın beyaz yürüyücüleri — en azından Kalenin dediğine göre yalnızca mitlerde ve efsanelerde yaşar. Ancak Duvar'ın ötesindeki en uzak bölgelerdeki yabanıl kabileler ve Kuzey'deki yaşlı erkekler ile kadınlar, ikinci bir Uzun Gece'nin ve onunla birlikte Ak Gezenlerin geleceğini savunur."

 agot_culture_mazemaker_desc:0 "Dünyanın dört bir yanında, Oldtown'dan Lorath'a kadar siyah taştan yapılmış labirentler görülebilir; en büyüğü ve en görkemlisi Lorassoyon'dadır. Bu labirentleri yapanlar, insan ile devin birleşimi olabilir. Çoktan yok olmuş olsalar da, bazıları onların deniz cinleri, fok adamlar, mors adamlar ya da Derinlerin Varlıkları tarafından öldürüldüğünü söyler."

 agot_culture_andal_desc:0 "İlahi bir görevle Andallar batıya yelken açtı ve fetihlere başladı. Bunu kılıçla ve sözle yaptılar; tüm güney diyarlarını ya ele geçirdiler ya da kendi inançlarına döndürdüler."

 agot_culture_andalosi_desc:0 "Tüm Andalların Kralı Qarlon, Norvos'a yürüdüğünde eski Serbest Diyar'ı kızdırdı ve ejderha ateşini kendi başına, diyarına ve halkına getirdi. Hayatta kalanlar artık, Özgür Şehirler ve diğer Essos güçleri tarafından yönetilen, dağılmış ve bölünmüş bir halktır."

 agot_culture_crownlander_desc:0 "Karakova Körfezi çevresindeki halk, yalnızca Ejderhaların gelişi ve Taç Diyarları'nın kurulmasıyla birleşti. Öncesinde farklı krallıklar arasında bölünmüşlerdi. Ancak Demir Taht ve Krallık Şehri ile halkın etrafında birleşeceği bir çekirdek oluştu."

 agot_culture_vineman_desc:0 "Arbor, şaraplarıyla dünya çapında ünlüdür ve halkı asmaya olan ustalıklı yaklaşımıyla tanınır. Üzümlerini pazara taşımak için hem askerî hem ekonomik açıdan korkulan büyük bir donanma inşa etmişlerdir."

 agot_culture_groveman_desc:0 "Kuzey Yürüyüşü'nün adamları, uzun süredir Ertaş için Batı Diyarları'na ve Nehir Adamlarına karşı bir siper olmuştur. Güneydeki Yürüyüşçüler Kızıl Dağlar'ı koruma olarak bulurken, orada tek savunma çevrelerindeki ormanlar ve mızraklarıdır."

 agot_culture_honeywiner_desc:0 "Ballı Şarap Nehri kıyılarında ve kollarında yaşayan halk, Ertaş'a katılan son halk oldu. Yüksek Bahçe'den çok Oldtown'a itibar ediyorlardı ve çoğu hâlâ öyle yapıyor."

 agot_culture_reachman_desc:0 "Mander Nehri ve kollarında yaşayan halk, Ertaş'ın kadim kalbini oluşturdu. Komşularını topraklarına katmadan önce Gardener Krallarının yönettiği diyar buydu ve halkı hâlâ Yeşil El'in yoluna bağlıdır."

 agot_culture_shieldman_desc:0 "Kalkan Adaları'nın erkekleri ve kadınları dayanıklı bir halktır; adlarının hakkını vererek Ertaş halkını Demir Adamların ve diğer deniz kaynaklı tehditlerin belalarından korurlar."

 agot_culture_riverlander_desc:0 "Mızrak'a doğrudan sınırı olan Nehir Adamları, ticaret, savaş ve besin için nehrin kollarında sefer yapar. Nehir Toprakları'nın üç büyük krallığının çekirdeğini oluşturdular ve bir sonrakinin de çekirdeği olacaklar."

 agot_culture_bay_riverman_desc:0 "Dar Deniz'in körfezlerine sınırı olan Nehir Adamları, Mızrak kıyısındaki kardeşlerine çok benzer; ancak Nehir Toprakları dışındaki komşularıyla çok daha fazla buluşur ve kaynaşırlar."

 agot_culture_cape_riverman_desc:0 "Kartal Burnu'nun Nehir Adamları, en nefret ettikleri düşmana — Demir Adamlara — karşı uzun süredir mızrağın ucu olmuştur. Nehir Toprakları'nın geri kalanını, Gün Batımı Denizi'nin akıncılarına ve yağmacılarına karşı gözetir ve korurlar."

 agot_culture_green_riverman_desc:0 "Yeşil Çatal'ın kuzey ucunda Neck'e sınırı olan Nehir Adamları, uzun süredir Kuzey'in Bataklık Şeytanlarıyla mücadele etmiştir. Bu mücadeleye rağmen oradaki adamlar, bölgeden geçen ticaret sayesinde zenginleşmiştir."

 agot_culture_highland_riverman_desc:0 "Yeşil Çatal'ın doğusunda, Ay Dağları'ndan önceki yaylalar ve tepeler arasında yaşayan Nehir Adamları, münzevi bir gruptur. Vadi'nin adamlarıyla bazı benzerlikler paylaşırlar; ancak Nehir Adamı kardeşleriyle bağlarını korumaya devam ederler."

 agot_culture_lake_riverman_desc:0 "Tanrının Gözü çevresinde yaşayan Nehir Adamları, geçimlerini su üzerinden sağlar. Farklıdırlar, çünkü gölün kendisi onların evidir. Sık sık şu ya da bu yabancı gücün egemenliği altında kalmışlardır; yine de inançlarını ve geleneklerini her zaman korumuşlardır."

 agot_culture_rush_riverman_desc:0 "Nehir Adamlarının en güneydekileri — Karakova Çağlayanı kıyısındaki halk — düzenli olarak Andal güneyinin büyük krallıkları arasında bir kavşak olmuş ve böylece aralarındaki belirleyici savaşların çoğuna tanıklık etmiştir."

 agot_culture_cape_stormlander_desc:0 "Öfke Burnu'nda yaşayan Fırtına Topraklıları, evlerine egemen olan büyük ormanı döven sağanak yağmurlara dayanma becerileriyle bilinir. Orada geçim sağlamak ıslak bir iştir, ancak asla vazgeçmeyecekleri bir iştir."

 agot_culture_hook_stormlander_desc:0 "Kral Ormanı ve Massey Burnu'nun Fırtına Topraklıları çoğu zaman yabancılaşmış bir gruptur. Komşularıyla pek çok benzerliği, hatta bazen sadakati paylaşsalar da ahlak konusunda katıdırlar."

 agot_culture_stormlander_desc:0 "Eski Durrandon krallığının çekirdeğindeki erkekler ve kadınlar, insan, fırtına ve hatta ejderha olsun, tüm tehditlere karşı kararlılıkla durmuş olanlardır."

 agot_culture_tarthman_desc:0 "Safir Ada'nın Fırtına Topraklıları gururlu bir halktır. Anakaradaki kardeşlerinden daha fazla Andal olan bu halkın adası, bir zamanlar mermerden inşa edilmiş güçlü bir krallığa ev sahipliği yapıyordu."

 agot_culture_marcher_desc:0 "Dorne Yürüyüşü'nün erkekleri ve kadınları dayanıklı bir halktır. Uzun süredir Kızıl Dağlar'ın güneyinden gelen akıncılarla uğraşmaya alışkın olduklarından, olası her tehditle uzun yaylarıyla başa çıkarlar."

 agot_culture_dornish_andal_desc:0 "Dorne, Batı Diyarları'nın her zaman en az nüfuslu bölgesi olmuştur; Andallar geldiklerinde kum tepelerini ve kıyıları kolayca işgal edebildiler. Kızıl Dağlar'ın kadim krallıkları bile eninde sonunda kılıçla ya da evlilikle Andalların eline geçti."

 agot_culture_bite_valeman_desc:0 "Isırık Körfezi'nin Vadi Adamları, komşularına en çok benzeyenlerdir. Hem Nehir Toprakları'na hem de Kuzey'e yakınlıkları, iki bölgenin bazı geleneklerinin kültürlerine sızmasına olanak tanımıştır."

 agot_culture_valeman_finger_desc:0 "Andalların Batı Diyarları'na ayak bastığı ilk yer Parmaklar'dı ve hem toprağa hem de halka izlerini bıraktılar. Daha yoksul bölgelerden biri olan Parmaklar'da yaşayan Vadi Adamları, evleri dedikleri, rüzgâr ve dalgaların savurduğu kayalar üzerinde zor bir hayat sürerler."

 agot_culture_valeman_desc:0 "Aşağı Vadi Adamları, eski Dağ ve Vadi Krallığı'nın asıl Vadi'si olan ovalarda yaşar. Batı Diyarları'nın en verimli bölgeleri arasında, şövalyelik, yiğitlik ve şövalye ülküleri üzerine kurulu bir toplum yarattılar."

 agot_culture_sisterman_desc:0 "Kız Kardeşler Adaları'nın adamları, diğer Vadi Adamlarının ölçütlerine göre tuhaf bir topluluktur. Vadi'nin geri kalanı gibi Andallar tarafından fethedilmiş olsalar da, önceki geleneklerinin çoğunu sürdürdüler. Çoğu zaman perdeli ayak ve el parmaklarıyla doğarlar; bunun kadim tanrıçalarının izi olduğu söylenir."

 agot_culture_valeman_upper_desc:0 "Ay Dağları'na daha yakın yaşayan Yukarı Vadi Adamları, geleneksel bir tiptir. Topraklarını uzun süredir hain Dağ Klanlarına karşı savundukları için hem savaşta hem de yönetimde savunmacıdırlar; kadim törenlerini korumayı tercih ederler."

 agot_culture_green_westerman_desc:0 "Batı Diyarları'nın güney ucundaki Batılılar, güneydeki Ertaşlılarla benzerlikler taşır. Tepelerini işlemede usta olan bu halk, toprağın içindeki madenlerin dışında ek bir zenginlik kaynağı geliştirmiştir."

 agot_culture_hill_westerman_desc:0 "Batı Diyarları'nın iç kesimlerindeki tepelerde ve yaylalarda yaşayan Batılılar, Nehir Toprakları'na açılan kara geçitlerini korur ve Batı Diyarları'nın düşmanlarına karşı ilk saldırıyı yapanlar onlardır."

 agot_culture_westerman_desc:0 "Eski Kaya Krallığı'nın çekirdek bölgesindeki Batılılar, geniş madenleri ve onlardan inşa ettikleri yeraltı salonlarıyla ünlüdür."

 agot_culture_shore_westerman_desc:0 "Batı Diyarları'nın kıyılarında ve adalarında yaşayan Batılılar, zenginlik ve şeref arayışıyla Gün Batımı Denizi'nde sefer yapmıştır. Bu aynı zamanda, Batılı kardeşlerinden önce Demir Adamlarla uğraşmak zorunda kalanların onlar olduğu anlamına gelir."

 agot_culture_clawman_desc:0 "Çatlak Pençe Burnu'nun adamları, yarı vahşi oldukları söylenen tuhaf bir halktır. Büyük ölçüde hâlâ İlk İnsan soyundan gelirler; Andalları halktan çok toprak yenilgiye uğratmıştır. Yine de İnanç orada kök saldı ve her zaman kavgacı bir halk olmuşlardır."

 agot_culture_first_man_desc:0 "İlk İnsanlar tunç ve atlarla geldi ve Batı Diyarları'nın ovalarını ve tepelerini kasıp kavurdu."

 agot_culture_barrowman_desc:0 "Höyük Adamları, Kuzey'deki ikinci en büyük gruptur; Höyük Toprakları'na ve doğularındaki Rills bölgesine hâkimdirler. Buradaki halk, bölgede dolaşan eğitimli ve vahşi atlarla kurdukları derin bağla bilinir."

 agot_culture_bearman_desc:0 "Ayı Adası'nın halkı dayanıklı bir topluluktur; uzun süredir hem Demir Adamların hem de Yabanılların akınlarına alışkındır. Böylesine sürekli bir mücadele hayatı, adanın kadınlarının erkeklerinin yanında silaha sarılmasına yol açtı ve yavrularını koruyan dişi ayı kadar korkunç oldukları söylenir."

 agot_culture_crannogman_desc:0 "Bataklık Adamları münzevi bir halktır; kısa boyları ve zehir kullanımları nedeniyle sık sık küçümsenirler. Ateşli dost, ölümcül düşmandırlar. Binlerce yıldır Kuzey'i güneydeki Andallara karşı korudular ve bu onlara, olası işgalciler tarafından Bataklık Şeytanları unvanını kazandırdı."

 agot_culture_harborman_desc:0 "Beyaz Liman ve çevresinin adamları tuhaf bir topluluktur. Hâlâ Kuzey'dendirler ve çevrelerindekilerle pek çok benzerlik paylaşırlar. Ancak yalnızca şehrin kendisinden değil, Dar Deniz'in diğer güçleriyle yaptıkları geniş ticaret sayesinde de çok daha kozmopolittirler."

 agot_culture_krakenman_desc:0 "Kraken Adamları, bir zamanlar Demir Adamlar tarafından yönetilen Kuzey halkıdır. Ancak bu ortak tarih, iki halk arasında iyi niyet yaratmamıştır. Kraken Adamları, Demir Adalar'dan gelecek tehditler için her zaman Gün Batımı Denizi'ni gözetler."

 agot_culture_northern_clan_desc:0 "Kuzey'in tepelerinde ve dağlarında yaşayan klanlar, azgın ve kabileci bir halktır. Güneyin ve daha gelişmiş bölgelerin mallarını reddeden Kuzey Klanları sade insanlardır; ancak yeminlerine ve geleneklerine son derece sadıktırlar."

 agot_culture_northman_desc:0 "Kuzeyli — Kuzey halklarının en büyüğü ve en önde geleni — İlk İnsanların soyundan gelir ve eski geleneklerini sürdürür. Soyları bir gurur kaynağıdır; çünkü Andalları püskürten ve bunu başaran Batı Diyarları'ndaki tek bölge olan Kuzey'e önderlik etmişlerdir."

 agot_culture_skagosi_desc:0 "Taş Doğanlar, Skagos'un halkıdır ve Kuzey halklarının en az uygar olanıdır. Kuzeyli kardeşleri tarafından Yabanıldan pek farkı olmayan 'Skagglar' diye küçümsenirler; yine de Eski Dil'i kullanmaya devam eden tek Kuzeylidirler. Eski gelenekleri — daha karanlık olanları bile — gerçek anlamda yalnızca onlar korur."

 agot_culture_wolfswood_clansman_desc:0 "Kurt Ormanı'nın adamları, evleri dedikleri büyük ormanla tanımlanır. Orman ihtiyaçları olan her şeyi sağlar: İçinde yaşayan hayvanlardan besin, ağaçlarından da malzeme."

 agot_culture_first_clan_desc:0 "Uzun Gece'nin ardından Kurucu Brandon Duvar'ı yükselttiğinde, öteki tarafta bazı İlk İnsanlar kalmıştı. Gerçek Kuzey'i dolduran farklı halklar işte bu ilk klanlardan türemiştir."

 agot_culture_axeman_desc:0 "Andalların çoğu batıya giderken, Balta Adamları doğuya, kadim anayurtları Balta'ya geri döndü. Orada yalnızlık ve güvenlik buldular; diğer güçlere saygı göstermekle birlikte kendi topraklarında güvende kalırlar."

 agot_culture_chroyanar_desc:0 "Şenlik şehri Chroyane'nin Rhoynarları, tartışmasız tüm Rhoynarların en büyüğüydü. Savaşta ve barışta başkalarının gözünü çevirdiği halk onlardı."

 agot_culture_mellar_desc:0 "Sar Mell'in ve doğu bataklıklarının Rhoynarları, uzun süredir doğudan gelen tehditlere karşı siper olmuştur."

 agot_culture_noynar_desc:0 "Rhoynarlar Noyne boyunca genişledi ve Norvos'u kendilerine aldı. Tepeleri benimserken, içlerinden akan suları — özellikle de Noyne'un coşkun sularını — kutsal saymaya devam ettiler."

 agot_culture_qhoynar_desc:0 "Qhoyne kıyısındaki Rhoynarlar, mermerden büyük eserleri ve Hançer Gölü'nde seyretme becerileriyle bilinir."

 agot_culture_rhoynar_original_desc:0 "Büyük nehrin halkı, Ana Rhoyne'nin çocukları olan Rhoynarlar, demiri erken kullanımları ve nehir ustalıklarıyla ünlüdür. Uzun süre büyük ana nehirlerinde ve kollarında sefer yaptılar."

 agot_culture_sarhar_desc:0 "En güneydeki şehir Sarhoy'un Rhoynarları, Rhoynish ölçütlerine göre tuhaf bir halktır. Çoğu Rhoynar büyük nehir Ana'ya ve kollarına bağlı kalırken, Sarhoy halkı daha da ileri giderek Yaz Denizi'nin sularında da seyretmiştir."

 agot_culture_sarar_desc:0 "Çeşmeler şehri Ny Sar, kuzeydeki Rhoyne ve Noyne üzerinde Rhoynarların başlıca gücüydü. Garin, ordularını Kıllı Adamlara karşı oradan yönetti ve Nymeria da oradan hükmetti."

 agot_culture_trimbaez_fen_desc:0 "Kasath halkı — Trimbaez Fen, ya da Konuşan Adamlar — geniş yolculukları ve sayısız kervanlarıyla bilinir."

 agot_culture_cymmeri_desc:0 "Gümüş Deniz çevresine yerleşen kabileci bir halk olan Cymmeriler, demir kullanımlarıyla ünlüydü."

 agot_culture_gipps_desc:0 "Gümüş Deniz çevresine yerleşen kabileci bir halk olan Gipler, hasır kalkanlarıyla ünlüydü."

 agot_culture_zoqora_desc:0 "Gümüş Deniz çevresine yerleşen kabileci bir halk olan Zoqoralar, savaş arabalarıyla ünlüydü."

 agot_culture_goraez_fen_desc:0 "Göl kıyısındaki Gornath'ta yaşayan Goraez Fen — ya da Göl Adamları — hastalıkları tedavi etmek için göl kenarında yetişen otları kullanmalarıyla bilinir."

 agot_culture_zanhar_fen_desc:0 "Sallosh halkı — Zanhar Fen, ya da Çalışkan Adamlar — bilgi arayışları ve büyük kütüphaneleriyle bilinir."

 agot_culture_madekh_fen_desc:0 "Mardosh şehri halkı — Madekh Fen, ya da Savaşçı Adamlar — savaşa ve disipline bağlılıklarıyla bilinir."

 agot_culture_tagaez_fen_desc:0 "Tagaez Fen — halk dilinde Uzun Adamlar — Balıkçı Kraliçelerin varisi Huzhor Amai'nin halkıydı ve Cymmeri, Zoqora ile Giplerin birliğiydi. Uzun Gece'nin ardından dünyanın büyük uygarlıklarından birini kurdular."

 agot_culture_gilal_fen_desc:0 "Sathar'ın Gilal Fen'i — ya da Müzik Adamları — şehri çevreleyen şelalelerin çevresinde düzenlenen festivalleriyle ünlüdür."

 agot_culture_cenaakh_fen_desc:0 "Cenaakh Fen — Rahip Adamlar — dindarlıkları ve takvalarıyla tüm Sarnor'da bilinir; gerçekten de Kyth'i Tapınaklar Şehri yaparlar."

 agot_culture_giren_fen_desc:0 "Giren Fen — ya da Tepe Adamları — Sarnorlular ile Essaria tepelerinin yerlilerinden doğan karışık bir halktır ve bu huysuz halkların en geçimsizi olarak bilinirler."

 agot_culture_zivylar_fen_desc:0 "Paralar Şehri Rathylar'da yaşayan Altın Adamlar — ya da Zivylar Fen — Sarnor'da şehirlerinin ürettiği büyük zenginlikle bilinir."

 agot_culture_cewi_fen_desc:0 "Sarys'in adamları — Delta Adamları, Cewi Fen — Sarne Deltası'nın sulak arazilerinde yaşar."

 agot_culture_dawiz_fen_desc:0 "Ayakta kalan tek Sarnori şehri olan Saath'ta, adamlar Dawiz Fen — Son Adamlar — adını almıştır. Sarnori halkının yeniden doğuşu olacaksa, bu oradan gelir."

 agot_culture_essosi_valyrian_desc:0 "Eski Valyria'nın çöküşü ve diğer halklarla kaynaşma bile, Özgür Şehirler boyunca ve ötesinde Eski Valyria geleneklerinin çoğunu koruyan ailelerin bulunmasını engellemez. Ejderha Lordlarının soyundan gelmeseler de kadim miraslarını hâlâ benimserler."

 agot_culture_valyrian_original_desc:0 "Uzun Yaz Diyarları, dünyanın bildiği en büyük uygarlığı — Valyria Serbest Diyarı'nı — doğurdu. Valyrialıların ejderhalar, büyücülük ve kan üzerindeki ustalığı sayesinde hayat buldu."

 agot_culture_braavosi_desc:0 "Braavoslular çalışkan bir halktır; bankacılıkta, boya üretiminde ve gemi yapımında başarı yakalarlar. Gemileri, koyu mor yelkenleriyle ayırt edilir ve dünyanın her limanında bulunabilir."

 agot_culture_essarian_desc:0 "Her şey Güneş'ten — Şanlı Olan'dan — gelir; Essariler böyle inanır. Valyria'nın dinî hoşgörüsünü terk eden bu halk, tanrılarına diledikleri gibi ibadet edebilecekleri saf bir yer aradı."

 agot_culture_lorathi_desc:0 "Ünlü labirentler ve Andalların yanık kalıntıları arasında Lorathlılar kendilerine bir yer buldu. Boash'ın ilk tapınanlarından uzaklaşan Lorath, bugün daha misafirperverdir; ancak anakaradaki çıkarlarını çoğu zaman yabancı tehditlere karşı korurken görülür."

 agot_culture_norvoshi_desc:0 "Norvoslular, pek çok farklı dine hoşgörü göstermeyi küfür olarak görüyordu ve bu yüzden saf biçimde ibadet edebilecekleri bir yer aradılar. O günden beri topraklarını ve kutsal metinlerini tüm tehditlere karşı şevkle savundular."

 agot_culture_pentoshi_desc:0 "Pentoslular, Özgür Şehirler'deki pek çok kişi gibi kendilerini para peşinde koşmaya adamıştır. Bunu yaparken iyi günde de kötü günde de kendilerini onun akışına bağlamışlardır."

 agot_culture_nonteloshi_desc:0 "Pentos ile Myr arasında kalan topraklar, Üç Kızın bitmek bilmeyen çatışmalarına sahne olan İhtilaflı Topraklar'dan çok farklıdır. Nonteloshiler bunun yerine diplomasiye ve nezakete güvenmiş, sadakat isteyen her yeni hâkimi memnuniyetle karşılamıştır."

 agot_culture_qohorik_desc:0 "Qohorlular, karanlık tanrılarına ibadet etmek ve karanlık sanatlarını icra etmek için Kara Orman'ın yanında bir yer buldu. Özellikle demirci ocaklarının sırlarını uzun süredir saklıyorlar; Valyria çeliğini yeniden dövmesini bilen tek halk olmayı sürdürüyorlar."

 agot_culture_hartalari_desc:0 "Üç Kız arasındaki kavgalarda arada kalan, Topuk'un yerli halkı Hartalarilerdir. Kesintisiz çatışmalar bir zamanlar verimli olan Topuk'u harap etti ve onu savaşla yıkılmış İhtilaflı Topraklar'a dönüştürdü."

 agot_culture_lyseni_desc:0 "Güzel Lys'in halkı, şehirleri gibidir: Dışı güzel ve parlaktır, içi ise karanlık ve çıkarcıdır. Lyseniler kölelik ve korsanlık bağlarıyla iyi bilinir; ancak cennet gibi evlerine herkesi kabul etmeleriyle de bilinirler."

 agot_culture_myrish_desc:0 "Myrlılar tuhaf bir halktır; gösterişli komşularından çok daha çekingendirler. Kölelerin desteklediği üretim becerileri rakipsizdir ve savaşçıları ölümcül arbaletlerle silahlanmıştır."

 agot_culture_tyroshi_desc:0 "Tyroshlılar tutkulu bir halktır; savaş, aşk, zanaat, ticaret ya da herhangi bir uğraş olsun, yaptıkları her işe tüm benliklerini koyarlar. Miğferleri ve boyalarıyla ünlüdürler; bireyselliklerini ifade etmek için ikisini de kullanırlar."

 agot_culture_volantene_desc:0 "Volantisliler gururla kendilerine Valyria'nın İlk Kızı derler ve bir zamanlar kardeşlerini boyun eğdirerek annelerini taklit etmeye çalıştılar. Ancak zamanla kendi yollarını buldular; triarklar, filler, kaplanlar ve düşmüş atalarından ayrışan çıkarlarla."

 agot_culture_ghaeni_desc:0 "Beşinci Ghiscari Savaşı'nda Eski Ghis'in çöküşüyle birlikte, pek çok Ghiscari Serbest Diyar'ın erişemeyeceği bir yerde yaşam tarzlarını yeniden kurmaya çalıştı. Böylece Ghaen adasında Yeni Ghis doğdu; orada eski gelenekleri taklit ederken bir kralın yönetimi de dahil olmak üzere yenilerini benimsediler."

 agot_culture_ghardaqi_desc:0 "Meereen'in nehrin yukarısındaki Ghiscari yerleşimcileri, Büyük Çimen Denizi ile güney topraklarının sınırındaki hayatı benimsedi; at beylerini kullanarak topladıkları köleleri, Ghis'in kalbine güneye sevk ettiler."

 agot_culture_ghiscari_original_desc:0 "Ghis imparatorluğu, Sarnor Krallıkları ve Yi Ti'nin Altın İmparatorluğu ile kıyaslandığında bile kadimdi. Kan ve tuğla üzerine kurulmuştu — hem kölelerin hem de Ghiscarilerin kanı; disiplinli lejyonlarında yürüyenlerin ve büyük piramitlerini yükseltenlerin kanı."

 agot_culture_shuzduni_desc:0 "Lhazaareen'in güneyine yerleşen Ghiscari yerleşimciler, Büyük Çimen Denizi'nin at beylerinin yollarını benimsedi ve bölgede hızlı ile verimli biçimde hareket etti."

 agot_culture_hazdahni_desc:0 "Kuzeydeki Ghiscari yerleşimciler, Büyük Çimen Denizi'nin tepelerinin ve ovalarının derinliklerinde, ovaların kabileleri ve halklarıyla ticareti benimsedi."

 agot_culture_astapori_desc:0 "Astapor ve halkı, uzun süredir kendilerini Eski Ghis'in savaşçı varisleri olarak görür. Disiplinli lejyonlar onlardan, Ghiscari'nin yeniden doğuşunun bel kemiği olacak Leşsizler olarak yeniden doğdu."

 agot_culture_meereenese_desc:0 "Kardeş şehirlerinin iddialarına rağmen Meereen, Ghiscari halkının ayakta kalan en büyük merkezidir; her Meereenli bunu belirtmeyi ihmal etmez. En büyük piramitle, en kalabalık nüfusla ve büyük dövüş çukurlarının evi olmakla övünür."

 agot_culture_yunkaii_desc:0 "Şehirlerin gerçek Kraliçesi Yunkai, zaten hepsinden üstün olan Ghiscari şehirlerinin en güzeli ve en kültürlüsüdür. Yunkai'liler Eski Ghis'in daha yüce yönlerini benimsedi; daha çıkarci yönleri kardeş şehirlerine bıraktı."

 agot_culture_gorgari_desc:0 "Gorgai, güney bölgelerinin en büyük Ghiscari şehridir. Gorgariler, Gözyaşı Adası'ndan yerlileri işleyip Ghiscari anayurduna sevk ederek, anayurttaki her pazarla rekabet eden bir pazar yaratır."

 agot_culture_goroshari_desc:0 "Gorosh, Yılan Ejderi Burnu'nun kıyılarına kurulmuştur; halkı yalnızca üstlerindeki uçan kertenkelelerden değil, aşağıdaki bataklık ve sazlıkların sayısız tehlikesinden de tehdit alır; bu da Goroshları kuzenlerinden daha güçlü kılar."

 agot_culture_zamettari_desc:0 "Zamoyos'un ağzına kurulan Zamettar, amansız ormana karşı bir kale görevi görür; halkını nehrin yukarısındaki tehditlerle savaşmaya zorlar."

 agot_culture_dothraki_desc:0 "Büyük Çimen Denizi'nin büyük ve korkulan at beyleri Dothrakiler, uygarlık ve diğer insan krallıkları için bir beladır. Halklarının Büyük Anası olarak gördükleri yeryüzünün yüzünü bozacak herkese yıkım getirirler."

 agot_culture_lhazareen_desc:0 "Lhazaar halkı barışçıl bir çoban toplumudur. Dinleri pasifizmi öğütler; bu da onları komşularının gözünde ideal köleler yapar; ancak büyük şehir duvarları, Dothraki ve Ghiscari tehditlerini hâlâ dışarıda tutar."

 agot_culture_omberi_desc:0 "Omber halkı sessiz insanlardır; yollarına çıkan her Khal'a cömert armağanlar vererek ve bunun dışında topraklarında hoşnut kalarak Dothraki komşularının elinden kurtulmuşlardır."

 agot_culture_hairy_forest_desc:0 "Kıllı Adamlar, bilinen dünyaya korku salan kadim bir halktı. Bazı kabileler Essos'un büyük ormanlarına yerleşti; tüm komşularıyla savaştı ve onlara akın düzenledi."

 agot_culture_hairy_isle_desc:0 "Kıllı Adamlar, bilinen dünyaya korku salan kadim bir halktı. Bazı kabileler Titreyen Deniz'in adalarına ve kıyılarına yerleşti; tüm komşularıyla savaştı ve onlara akın düzenledi."

 agot_culture_hairy_rivers_desc:0 "Kıllı Adamlar, bilinen dünyaya korku salan kadim bir halktı. Bazı kabileler Rhoyne'un kuzey kollarını çevreleyen tepelere yerleşti; tüm komşularıyla savaştı ve onlara akın düzenledi."

 agot_culture_bayasabhadan_desc:0 "Kemik Dağları'nın derinliklerinde Hyrkoon Mirası'nın son kalıntıları bulunur. Güneyde, Kum Yolu üzerinde büyük kale şehri Bayasbhad yer alır. Halkı, diğer şehirlerdeki kuzenleri gibi tüm olası tehditleri püskürtürken, doğu ile Kemikler'in ötesindeki topraklar arasındaki kara ticaretinin kilit halkası olarak hizmet eder."

 agot_culture_hyrkoonan_original_desc:0 "Hyrkoon Mirası'nın halkı, dünyayı kurtaran ve Uzun Gece'yi geri püskürten büyük kahramanın gerçek soyundan gelir. Bu miras büyük bir sorumluluktur; yalnızca en güçlü ve en iyi insanlar miraslarını gelecek kuşaklara aktarabilir; böylece Uzun Gece geri döndüğünde en güçlüler hazır bekler."

 agot_culture_kayakayanayan_desc:0 "Kemik Dağları'nın derinliklerinde Hyrkoon Mirası'nın son kalıntıları bulunur. Kuzeyde, Çelik Yolu üzerinde büyük kale şehri Kayakayanaya yer alır. Halkı, diğer şehirlerdeki kuzenleri gibi tüm olası tehditleri püskürtür; özellikle de kadim ve acı bir düşmanlık besledikleri Jogos N'hai'yi."

 agot_culture_shamyrianan_desc:0 "Kemik Dağları'nın derinliklerinde Hyrkoon Mirası'nın son kalıntıları bulunur. Taş Yolu üzerinde büyük kale şehri Shamyriana yer alır. Halkı, diğer şehirlerdeki kuzenleri gibi tüm olası tehditleri püskürtürken, kalelerini ve ileri karakollarını daha da güçlendirmek için Kemikler'i madenler ve taş ocaklarıyla işler."

 agot_culture_shan_ren_desc:0 "Çok uzun zaman önce, Miras yalnızca üç ileri karakoldan ibaret değilken, topraklar Büyük Kum Denizi'nin tozuna dönüşmeden önce şehirlerinden biri Asabhad'dı. Miras çöktüğünde Asabhad ve halkı, Altın İmparatorluk'ta yeni bir ev ve koruyucu buldu. Onun yollarını benimsemek ve halkıyla kaynaşmak, imparatorluk içindeki pek çok halktan biri olan Shan Renleri doğurdu."

 agot_culture_ibbatese_desc:0 "Evleri olan adanın dağlarında ve yaylalarında teselli arayan İb adamları, kıyıdaki kardeşlerinden bile daha münzevidir; ancak en az onlar kadar azgındırlar."

 agot_culture_ibbenese_desc:0 "İb adamları münzevi bir halktır; ancak gemileri dört bir yanda bulunabilir. Sadık müttefik ve azgın düşmandırlar; büyük balina avcısı gemileriyle iyi bilinirler."

 agot_culture_ib_sarese_desc:0 "İb Sar, bir ceza kolonisi olarak başladı ve bu miras halkına işlemiştir. İb Sar adamları, ana adadaki kardeşlerinden daha azgın bir topluluktur."

 agot_culture_greenborn_desc:0 "Yeşil Topraklar'a yerleşen Demir Adamlar, Demir Doğanlar tarafından küçümsenebilir; ancak Boğulmuş Tanrı'nın hükümranlığını en geniş sınırlarına ulaştıranlar onlardır."

 agot_culture_ironborn_desc:0 "Demir Adalar'da doğan herkes Demir Doğandır; Gri Kral'ın varisleri ve Boğulmuş Tanrı'nın soyudur. Gün Batımı Denizi'nden ya da ötesinden olsun, denizlerin tuzunu koklayabilen herkesin korkusudurlar."

 agot_culture_jade_islander_desc:0 "Yeşim Denizi'nin adalarına yerleşen Yeşim Adalılar, uzun süredir parıltılı sularında ticaret ve savaş için seyreder."

 agot_culture_lengii_desc:0 "Kutsal Leng Adası'nın halkı Lengililer, son derece bağımsızdır; onları boyunduruk altına almaya çalışacak her yabancı güce direnirler."

 agot_culture_manticorian_desc:0 "Akrep Adaları'nın halkı, ünlü böcekleri kadar tehlikeli olmakla bilinir."

 agot_culture_marahaiian_desc:0 "Cennet ada Marahai'nin halkı, adalarının sağladığı büyük armağanları fazlasıyla takdir eder."

 agot_culture_bloodless_man_desc:0 "Kansız Adamların, Beş Kale'nin ötesindeki şehirlerde yaşadığı söylenir; efsane ve mitler, kurbanlarının kanını emdiklerini ya da kendilerinin mermeri andıracak kadar solgun olduklarını iddia eder."

 agot_culture_carcosan_desc:0 "Şafak Dağları'nın derinliklerinde, Gizli Deniz'in kıyısında Carcosa şehri yer alır. Oradaki adamların, derinliklerin karanlık tanrılarıyla anlaşmalar yapan büyücüler ve sihirbazlar olduğu söylenir."

 agot_culture_dathian_desc:0 "Kanayan Deniz'in doğusundaki büyük ovalarda yer alan K'Dath sakinleri, Kemik Kasabası, Şrikeler Diyarı ve kuzeydeki Gri Çorak Topraklar gibi komşuları üzerinde egemenliklerini genişletmeye çalışmakla bilinir."

 agot_culture_grey_man_desc:0 "Gri Çorak Topraklar'ın adamları, eve zenginlik ve kaynak getirmek için akınlara bel bağlar; zira Gri Çorak Topraklar adının hakkını verir ve sakinlerine çok az şey sağlar."

 agot_culture_fish_man_desc:0 "Bin Adalar'a evim diyenler, tuhaf mitler ve söylentilerle çevrili yabancı düşmanı bir halktır. Yarım balık oldukları ve adalarını ziyaret eden herkesi yuttukları söylenir."

 agot_culture_lion_man_desc:0 "Kan İhaneti'nden önce, Beş Kale'nin ötesindeki toprakların Gece Aslanı'na ait olduğu söylenir. Işıktan Yaratılmış Bakire ile Yeryüzündeki Tanrı, Şafak İmparatorluğu'na sırtlarını döndüğünde, Aslan Adamlar insanları ihanetleri için cezalandırmakta serbest kaldı."

 agot_culture_mossovite_desc:0 "Uzak Mossovy'nin adamları, soğuk ve mesafeli doğaları ve inançlarına olan derin bağlarıyla bilinir."

 agot_culture_shryke_desc:0 "Şrikeler, abartılı masallarda ve meyhane dedikodularında adı geçen bir halktır. Güvenle varsayılabilecek şey, Beş Kale'nin ötesinde geniş bir toprak parçasına hükmetmeleri ve hızlı ile hareketli olmalarıdır."

 agot_culture_winged_man_desc:0 "Kanatlı Adamlar, Beş Kale'nin ötesinde kanatlarla uçtukları söylenen bir halktır; ancak bu büyük olasılıkla abartıdır. Kaotik bölgede şehirler kurdukları söylenir."

 agot_culture_farosi_desc:0 "Farosiler, Büyük Moraq'ın kuzey-orta bölümüne hükmeder. Şehirleri, Yeşim Kapıları ile Qarth'ı atlayan tarçın yolları üzerindeki başlıca ticaret limanlarından biridir; bu da iki halk arasında önemli bir düşmanlık yaratır."

 agot_culture_moraqi_desc:0 "Moraqiler, Büyük Moraq'ın halkıdır. Qarthlılar kuzeyi aldıktan ve Farosiler orta topraklara hükmetmeye başladıktan sonra, ulus adanın güney bölümünde toplanmıştır."

 agot_culture_vahari_desc:0 "Vahariler, özellikle Yeşim Kapıları'nın güneyinde baharat ve diğer malların ticaretiyle zenginleşmiş, doğuştan tüccar ve denizcidirler."

 agot_culture_zabhadi_desc:0 "Zabhadiler Fil Adası'nda yaşar ve zenginliklerini bu hayvanlardan sağlar. Fildişi, hem önemli bir ihracat ürünü hem de kültürlerinde prestij ve toplumsal statü sembolüdür."

 agot_culture_jogos_nhai_desc:0 "Kemikler'in ötesindeki korkulan göçebeler Jogos N'hai, çok eski zamanlardan beri Yi Ti, Hyrkoon, N'ghai, Jhogwin ve diğerlerinin belası olmuştur. Koni biçimli kafaları ve çizgili zebra atlarıyla saldırarak tüm yabancılara yıkım ve ölüm getirirler; ancak birbirleriyle asla savaşmazlar."

 agot_culture_nefer_desc:0 "N'ghailer, bir zamanlar geniş bir krallığa yayılmış, azalmış bir halktır. Jogos N'hai onları son sığınakları Nefer'e sürdü; ancak gizli şehirde, koni kafalıları geri püskürtme ve uluslarını yeniden kurma umudu güçlü bir biçimde sürmektedir."

 agot_culture_qaathi_desc:0 "Qaathiler azalmakta olan bir halktır. Bir zamanlar Gümüş Deniz kıyısındaki ovalara yerleşen pek çok kabileden biriydiler; Sarnorlular tarafından sürüldüler. Sayısız savaşın ardından, o zamanlar yeşil ve bereketli olan ama kısa sürede kuruyup kızıla dönen güney topraklarına kaçtılar. Ancak Qaarth dışındaki Qaathilerin sonu, Dothrakilerin gelişine kadar gelmedi."

 agot_culture_qaleen_desc:0 "Qaleenler, soylarını Qaarth'ın lonca üyeleri ve tüccarları ile Qal adasının yerli Yeşim Adalılarına dayandırır. Artık Yeşim Kapıları'nın doğu siperi ve kalesi olarak hizmet ederler."

 agot_culture_qartheen_desc:0 "Qaathilerin son kalıntısı olan Qartheenler, Qaathi halkının tek kalıntısı olan şehirlerine sımsıkı tutunsalar da kendilerini dünyadaki tek gerçekten uygar halk olarak görürler."

 agot_culture_greenblood_desc:0 "Rhoynarların çoğu Dorne yerlileriyle kaynaşırken, Yeşilkanlılar kaynaşmadı. Kadim yollarını olabildiğince saf tuttular ve Analarına dönmeyi hayal ederler."

 agot_culture_salt_dornish_desc:0 "Yarımadanın doğu bölgelerinde yaşayan Dorneliler, en fazla Rhoynar kanına sahiptir. Rhoynar ile Batılı'nın karışımının en gerçek ifadesi, iki kültürün en yakın evliliğidir."

 agot_culture_sand_dornish_desc:0 "Dorne'un iç kesimlerinin kum tepeleri ve çölleri, halkını fatihleri kadar şekillendirmiştir. Az suyla yaşamayı ve kum denizlerinde görünmeden kaybolmayı öğrenmek, bu Dornelileri ölümcül düşmanlar yapar."

 agot_culture_stone_dornish_desc:0 "Kızıl Dağlar'ın Dornelileri, sadık ve kavgacı bir halktır. Dorne'daki en az Rhoynar etkisine sahip olmalarına rağmen, kum tepelerindeki ve kıyılardaki kardeşleri gibi kuzeydeki Andallar tarafından yabancı görülürler. Akınları ve vahşetleriyle ünlü, tehlikeli ve acımasız düşmanlardır."

 agot_culture_abular_desc:0 "Nymeria Rhoynarları birleştirip Serbest Diyar'dan kaçtığında, doğrudan Dorne'a gitmediler. Önce talihsiz olduğu anlaşılan Sothoryos'a, ardından Yaz Adaları'na gittiler; orada bazıları Kadınlar Adası'nda kalarak yerli adalıların yollarını benimsedi."

 agot_culture_asshaii_desc:0 "Gölge'nin gölgesinde, Asshai'nin yağlı siyah taş binaları ve duvarları arasında Asshai'liler tuhaf ve karanlık bir halktır. Ciddi oldukları söylenir; cilalı maskeler takmalarıyla ünlüdürler."

 agot_culture_shadowman_desc:0 "Gölge'ye yerleşen adamlar, Asshai'lilerin bile korktuğu bir halktır. Başkalarının yalnızca ziyaret ettiği karanlığı kucaklar ve orada serpilirler."

 agot_culture_basiliskite_desc:0 "Basilisk Adaları'na yerleşen adamlar, bölünmüş ve korsanca yollarıyla bilinir. Sık sık Özgür Şehirleri, Naath'ı ve Yaz Adaları'nı bela ederek denizlerin çoğuna dert olurlar."

 agot_culture_brindled_man_desc:0 "Derilerindeki yaygın çizgili lekelerden dolayı Çizgili Adamlar diye anılanlar, Sothoryos'un yerlileridir. İzolasyoncu ve çoğu zaman yabancı düşmanı bir halk olarak, küçük kıyı topluluklarıyla sınırlı temas kurarlar; kısıtlı ticaret yapar ama başka pek az şey yaparlar."

 agot_culture_gogossite_desc:0 "Gogossitler, Valyria hâkimleri ile Gorgari yerlilerinden oluşmuş bir halktır. Adalarının ve yakındaki Yeen'in karanlık tarihini benimsemişlerdir."

 agot_culture_yeenite_desc:0 "Sothoryos'un karanlık şehri Yeen'in yerlileri geri döndü ve uluslarını yeniden genişletmeye başladı."

 agot_culture_naathi_desc:0 "Naathiler — ya da Barışçıl Halk — Kelebekler Adası'nda yaşar. Barışçıl yollarıyla bilinen bu halk, ne yazık ki köle avcıları ve akıncıların avıdır."

 agot_culture_jhalai_desc:0 "Yaz Adaları'nın en büyüğü olan Jhala'nın halkı canlıdır ve çoğu zaman diğer adalardaki kardeşlerinden daha savaşçıdır. Köle avcıları tam da oradan kovulmuştur."

 agot_culture_moluuni_desc:0 "Moluuniler batı adalarında yaşar; tüm Yaz Adalıları üretken denizciler olsa da en büyükleri Moluunilerdir. Denizleri ve okyanusları haritalandıran büyük kuğu gemileri oradan çıkmıştır."

 agot_culture_omborui_desc:0 "Omboru halkı, festivalleri ve şölenleriyle ünlüdür. Uzun süredir yabancılara açık olduklarından, kendi halklarının çoğu da sürgün ya da gezgin olur."

 agot_culture_walanoi_desc:0 "Walanoiler kuzey adaların halkıdır. Çoğu zaman dış dünyayla en fazla temas onlardadır ve canlı ağaçlar üzerinde tuttukları ayrıntılı kayıtlarıyla bilinirler."

 agot_culture_painted_clansman_desc:0 "Eski Serbest Diyar'ın topraklarında bile, Boyalı Dağlar'ın halklarında görüldüğü gibi kabile halkları yaşıyordu. Uygar güneyli kuzenleriyle ortak bir mirası paylaşan bu vahşi grup, kuzenlerinin evcilleştirdiği ejderhalara tapar."

 agot_culture_elyrian_desc:0 "Valyria Serbest Diyarı tarafından kurulan Elyria ve halkı, Ghiscari şehirleriyle köle ticaretini tüm kalbiyle benimsedi; öyle ki bağları Valyria'dan çok Ghis'e yakınlaştı. Bugün Elyrianlar hâlâ soylarını Valyrialılara dayandırır, ancak Ghis'in yollarının çoğunu benimserler."

 agot_culture_bhorashi_desc:0 "Bhorash bir zamanlar Mantarys ile Meereen arasındaki şeytan yolunun kenarında harabe halindeydi; ancak şimdi, kötü ünlü patikalarında ticaret yapan cesur ruhlarla dolup taşıyor."

 agot_culture_mantaryan_desc:0 "Mantarys ve halkının uğursuz ve canavarca olduğu söylenir. Deformiteler ve hastalıklar nüfusu adeta sarmıştır; yine de Özgür Şehirler ile Köle Körfezi arasındaki kilit kara yolunu — Şeytan Yolu'nu — kontrol eden güçlü bir güçtürler."

 agot_culture_tolosi_desc:0 "Kara Uçurumlar'da, Tolos ve halkı sapan taşıyıcılarıyla dünya çapında ünlüdür. Komşuları gibi doğudaki Ghiscari şehirleriyle köle ticaretini benimsemişler ve Köle Körfezi'ne giderek daha da yaklaşmışlardır."

 agot_culture_high_valyrian_desc:0 "Valyria Serbest Diyarı'nın hükümdarları Yüksek Valyrialılar, ayrı bir halktı. Ejderhalarının sırtından hükmederler ve kendilerini hem insandan hem tanrıdan üstün görürlerdi. Bu kibir, evlerini ve imparatorluklarını kaybettikleri Felaket'ten sonra bile sürdü; yine de ejderhaları vardı ve herkesin üzerinde süzülüyorlardı."

 agot_culture_westerosi_valyrian_desc:0 "Targaryen Hanedanı'nın Ejderha Lordları Batı Diyarları'na gelmeden önce, diğer Valyrialılar Gün Batımı Diyarları'na çoktan yerleşmişti. Bu Valyrialılar, eski Serbest Diyar'a dair bazı gelenek ve bağlarını korurken yerli Batılı yolların çoğunu benimsedi."

 agot_culture_cave_dweller_desc:0 "Gorne ve Gendel, Özgür Halk'ı Gorne'un Yolu'ndan Duvar'ın altından güneye götürdüğünde, takipçilerinin çoğunu mahkûm ettiler. Starklar tarafından bozguna uğratılınca Gorne öldürüldü; Gendel ise bozguna uğrayan halkı yer altına geri götürdü, ancak aşağıdaki mağaralarda kayboldular. Bugün hâlâ mağaralarda yaşayan halk işte böyle ortaya çıktı."

 agot_culture_fangman_desc:0 "Don Dişleri'ne evim diyen halk dayanıklı ve korkutucudur. Duvar'a bile tırmanma konusundaki güçlü yatkınlıklarıyla bilinen bu halk, ölümcül akıncılardır."

 agot_culture_forestman_desc:0 "Lanetli Orman'a yerleşen halk, Gece Nöbetçileri ve üstatların en sık karşılaştığı Yabanıllardır. Kavgacıdırlar ve diyarlarını olabildiğince küçük parçalara bölmeye eğilimlidirler."

 agot_culture_frozen_shoreman_desc:0 "Donmuş Kıyı'nın halkı, diğer Yabanıllarla kıyaslandığında bile tuhaftır. Foklar ve morslar tarafından çekilen kemik kızaklar hakkında söylentiler eksik olmaz; kesin bilinen şey ise usta akıncılar olduklarıdır."

 agot_culture_hornfoot_desc:0 "Boynuzayaklar, uzak kuzeyde bir kabiledir; Gece Koşucularıyla sık çatışmaları ve ayakkabısızlıklarıyla bilinirler. Ayaklarının tümünün soğuk ısırığına kurban gitmemiş olması bir mucizedir."

 agot_culture_ice_riverman_desc:0 "Batıdaki buz sahanlıklarında buz nehirleri boyunca yaşayan klanlar münzevidir. Başka et kaynaklarının olmaması nedeniyle yamyamlık uygulamasının yaygın olduğu söylenir."

 agot_culture_lakefolk_desc:0 "Uzak kuzeydeki büyük buz göllerinin çevresinde bulunan halk, donmuş göllerin yanında ve bazen de üzerinde bir hayat kurmayı başarmıştır. Bu sular, ufak bir kısmı bile eritecek kadar sıcaklık görmez — nadiren, hatta hiç."

 agot_culture_milkwaterman_desc:0 "Kuzeydeki Don Dişleri'nden Buz Körfezi'ne akan büyük nehir Süt Suyu'na tutunan halk. Büyük Yabanıl kahramanların höyükleri, tam da bu nehrin akışı boyunca bulunur."

 agot_culture_nightrunner_desc:0 "Gece Koşucuları, uzak kuzeyde bulunan bir kabiledir; usta gece akınları ve neredeyse gececil programlarıyla bilinirler. Tek gözü açık uyumayan herkes için korkutucu bir düşmandırlar."

 agot_culture_thenn_desc:0 "Thenler, uzak kuzeyde münzevi bir kabiledir; çevredeki soğuktan koruyan bir vadide yaşarlar. Komşularının çoğundan daha düzenli olan bu halk, tunç eritmeleriyle bilinir ve Duvar'ın ötesinde disiplinli topluma en yakın şeydir."

 agot_culture_moon_clan_desc:0 "Ay Dağları'nda bulunan klanlar, Arryn krallarına boyun eğmeyi reddedenlerin soyundan gelir. Bir gün krallıklarını geri almayı umarak uygarlığı ve toplumu terk edip kanun kaçağı olarak yaşadılar."

 agot_culture_aobao_ren_desc:0 "Aobao Renler, orta ovaların YiTishleridir. Verimli tebaalar olarak iyi bilinirler; bir kez verilen sadakatleriyle ünlüdürler."

 agot_culture_bixi_ren_desc:0 "Doğu topraklarının Bixi Renleri, sürekli olarak Gölge Adamlarının akınlarıyla ve Beş Kale'nin ötesinden gelen tehditlerle yüzleşir. Doğu sınırlarını savunmaya adanmış, kararlı bir halktır."

 agot_culture_haungyu_ren_desc:0 "Haungyu Renler, Yeşim Kıyısı'nın kuzeyindeki orta ormanlarda yaşar. Çoğu zaman budalalık derecesine varan güçlü inançları ve gezgin mistikleriyle bilinirler."

 agot_culture_heinao_ren_desc:0 "Kuzeyin Heinao Renleri dayanıklı bir halktır; savaşçı miraslarıyla iyi bilinirler. Jogos N'hai ile yüzleşir ve İmparatorluğu bu nefret edilen düşmanlara karşı savunmaya çalışırlar."

 agot_culture_feicui_ren_desc:0 "Feicui Renler, kozmopolit güney YiTish halkıdır. Yeşim Denizi kıyısındaki büyük şehirleri kurdular, kıyılarında ticaret yaptılar ve Altın İmparatorluğu en geniş sınırlarına ulaştırdılar."

 agot_culture_zhenzhu_ren_desc:0 "Zhenzhu Renler, öyle söylendiği üzere asıl YiTish halkıdır. Altın İmparatorluk'un âlim-rahipleridir; Yi Ti'nin tarihini özenle, ta Büyük Şafak İmparatorluğu'na kadar izlerler."
