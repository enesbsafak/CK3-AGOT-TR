### TODO NOT-IN-ST: agot_culture_crannogman_desc [AGOT: The Crannogmen are a reclusive people, often looked down upon for their short stature and use of poisons. They are a fierce friend and a deadly foe. They have protected the North from the Andals to the south for thousands of years, earning them the title of Bog-Devils from would-be invaders.]
