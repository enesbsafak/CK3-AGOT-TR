### TODO NOT-IN-ST: agot_culture_mazemaker_desc [AGOT: Across the world, mazes made of black stone can be seen, from Oldtown to Lorath, with the largest and greatest being on Lorassoyon. The makers of these mazes may have been the union of man and giant. Though they are long gone, some say they were killed by merlings, selkies, walrus-men, or the Deep Ones.]
 agot_culture_mazemaker_desc:0 "Across the world, mazes made of black stone can be seen, from Oldtown to Lorath, with the largest and greatest being on Lorassoyon. The makers of these mazes may have been the union of man and giant. Though they are long gone, some say they were killed by merlings, selkies, walrus-men, or the Deep Ones."
