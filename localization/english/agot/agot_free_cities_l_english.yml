### TODO NOT-IN-ST: free_city_events.0001.desc [AGOT: A letter bearing the sigil of [request_sender.GetTitledFirstName] has been delivered to our court, its contents speaking of a decision of great consequence.\n\n[request_sender.GetTitledFirstNameNoTooltip] extends an olive branch, proposing the renewal of an ancient alliance that once gave rise to the mighty Triarchy. The memory of those days, when our cities stood united in strength and purpose, stirs within us once more.\n\n[request_sender.GetSheHe|U] now seeks to raise again the banner of the Kingdom of the Three Daughters, uniting Myr, Lys, and Tyrosh in common cause and shared ambition.\n\nShall we, as proud and sovereign cities, cast aside the animosities of the past and restore this alliance of old? Will we stand together, shoulder to shoulder, and face the coming storms as a united Triarchy, or will we instead follow our own courses, as lone ships braving the tempest?]
 free_city_events.0001.desc:0 "A letter bearing the sigil of [request_sender.GetTitledFirstName] has been delivered to our court, its contents speaking of a decision of great consequence.\n\n[request_sender.GetTitledFirstNameNoTooltip] extends an olive branch, proposing the renewal of an ancient alliance that once gave rise to the mighty Triarchy. The memory of those days, when our cities stood united in strength and purpose, stirs within us once more.\n\n[request_sender.GetSheHe|U] now seeks to raise again the banner of the Kingdom of the Three Daughters, uniting Myr, Lys, and Tyrosh in common cause and shared ambition.\n\nShall we, as proud and sovereign cities, cast aside the animosities of the past and restore this alliance of old? Will we stand together, shoulder to shoulder, and face the coming storms as a united Triarchy, or will we instead follow our own courses, as lone ships braving the tempest?"
