### TODO NOT-IN-ST: free_city_events.0004.desc [AGOT: [request_sender.GetTitledFirstNamePossessive] attempt to restore the alliance of the Three Daughters has failed. Though the cause was noble, the Triarchy shall not rise again at this time. Yet perhaps, one day, the dream will be rekindled from the ashes.\n\nThe vision of a united realm, where Myr, Lys, and Tyrosh stand together to reclaim their rightful lands and cast back their foes, remains distant. For now, we will go our separate ways and pursue our own fates.\n\nHad the stars aligned differently, the known world might have bent beneath our strength...]
 free_city_events.0004.desc:0 "[request_sender.GetTitledFirstNamePossessive] attempt to restore the alliance of the Three Daughters has failed. Though the cause was noble, the Triarchy shall not rise again at this time. Yet perhaps, one day, the dream will be rekindled from the ashes.\n\nThe vision of a united realm, where Myr, Lys, and Tyrosh stand together to reclaim their rightful lands and cast back their foes, remains distant. For now, we will go our separate ways and pursue our own fates.\n\nHad the stars aligned differently, the known world might have bent beneath our strength..."
