### TODO NOT-IN-ST: free_city_events.1002.desc_elector [AGOT: The war has finally ended, and the city prepares to resume the election for a new First Magister. \n\nWith the conflict behind them, the Conclave sets to convene and choose a leader to guide the city through its recovery and into a prosperous future. \n\nEarly indications suggest that [magister_winner.GetFullName] may have the support needed to be chosen. As the Magisters and the Gonfaloniere gather, the citizens are filled with anticipation and hope for stability and a return to normalcy.]
 free_city_events.1002.desc_elector:0 "The war has finally ended, and the city prepares to resume the election for a new First Magister. \n\nWith the conflict behind them, the Conclave sets to convene and choose a leader to guide the city through its recovery and into a prosperous future. \n\nEarly indications suggest that [magister_winner.GetFullName] may have the support needed to be chosen. As the Magisters and the Gonfaloniere gather, the citizens are filled with anticipation and hope for stability and a return to normalcy."
### TODO NOT-IN-ST: free_city_events.1002.desc_liege [AGOT: With the war concluded, the question of relinquishing the emergency powers assumed during the conflict looms large. \n\nThe Conclave is preparing to resume the election of a new First Magister, but the process is uncertain. [magister_winner.GetFullName] appears to be a likely candidate, but the final decision has yet to be made. \n\nAs the Magister who maintained stability through the war, you contemplate whether stepping down is truly in the city's best interest, or well, your best interest, or if your continued leadership could provide the guidance needed in these precarious times.]
 free_city_events.1002.desc_liege:0 "With the war concluded, the question of relinquishing the emergency powers assumed during the conflict looms large. \n\nThe Conclave is preparing to resume the election of a new First Magister, but the process is uncertain. [magister_winner.GetFullName] appears to be a likely candidate, but the final decision has yet to be made. \n\nAs the Magister who maintained stability through the war, you contemplate whether stepping down is truly in the city's best interest, or well, your best interest, or if your continued leadership could provide the guidance needed in these precarious times."
