### TODO NOT-IN-ST: free_city_events.0003.desc [AGOT: Once more, the Three Daughters stand united. Myr, Lys, and Tyrosh have sworn anew the eternal bonds of the Triarchy, their alliance proclaimed far and wide across Essos and Westeros alike.\n\nStanding shoulder to shoulder, we have pledged to reclaim every inch of our rightful lands and drive our foes back to the far corners from whence they came.\n\nLet it be known that a new era has dawned, as the Three Daughters rise again, strong and united, to wield their combined might!]
 free_city_events.0003.desc:0 "Once more, the Three Daughters stand united. Myr, Lys, and Tyrosh have sworn anew the eternal bonds of the Triarchy, their alliance proclaimed far and wide across Essos and Westeros alike.\n\nStanding shoulder to shoulder, we have pledged to reclaim every inch of our rightful lands and drive our foes back to the far corners from whence they came.\n\nLet it be known that a new era has dawned, as the Three Daughters rise again, strong and united, to wield their combined might!"
### TODO NOT-IN-ST: free_city_events.0003.a [AGOT: Let our alliance be eternal, now and always!]
