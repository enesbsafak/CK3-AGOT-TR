 agot_seize_control:0 "Kontrolü Ele Geçir"

 agot_seize_control_desc:0 "Bir diktatörlük sonsuza dek süremez; hanedanımın verasetini güvence altına almak istiyorsam demokrasi iddiasından vazgeçmeliyim."

 agot_seize_control_tooltip:0 "Feodal bir yönetime geçerek seçimlere sonsuza dek son ver"

