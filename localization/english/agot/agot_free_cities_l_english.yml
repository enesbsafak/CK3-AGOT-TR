 agot_stepstones_rhoynish_culture_desc:0 "Uzun zamandır bu adalarda mahsur kaldık ve Rhoyne ile Eski Prenslikler'den gelen köklerimize uzun süre sadık kaldık. Ama gerçekten böyle kalmak istiyor muyuz?"

