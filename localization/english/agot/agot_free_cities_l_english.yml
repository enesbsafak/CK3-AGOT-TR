### TODO NOT-IN-ST: free_city_events.1001.desc_elector [AGOT: With the realm embroiled in a war against the [war_enemy.GetPrimaryTitle.GetName], the Conclave has deemed it unsafe to proceed with the election of a new First Magister.\n\nInstead, the [current_ruler.GetFullNameNicknamed] has temporarily assumed new powers to help maintain order and stability until the war ends.\n\nThe Conclave and the Gonfaloniere declare in an announcement that they acknowledge the First Magister's authority during this period of crisis, aware that their city's future hangs in the balance. The citizens now sit awaiting the end of the conflict, seemingly divided, either cheering on the decrees or uncertain what lies ahead once peace is restored.]
 free_city_events.1001.desc_elector:0 "With the realm embroiled in a war against the [war_enemy.GetPrimaryTitle.GetName], the Conclave has deemed it unsafe to proceed with the election of a new First Magister.\n\nInstead, the [current_ruler.GetFullNameNicknamed] has temporarily assumed new powers to help maintain order and stability until the war ends.\n\nThe Conclave and the Gonfaloniere declare in an announcement that they acknowledge the First Magister's authority during this period of crisis, aware that their city's future hangs in the balance. The citizens now sit awaiting the end of the conflict, seemingly divided, either cheering on the decrees or uncertain what lies ahead once peace is restored."
