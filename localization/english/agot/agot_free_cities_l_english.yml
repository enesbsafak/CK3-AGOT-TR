 agot_break_braavos_pentos_treaty:0 "Braavos-Pentos Antlaşması'nı Boz"

 agot_break_braavos_pentos_treaty_desc:0 "209'dan beri Braavoslular gururlu Pentos şehrini sert bir antlaşmaya uymaya zorluyor. Pentos'un bu antlaşmayı yırtıp atmaya ve kendini özgürce yönetmeye hazır olma zamanı geldi!"

 agot_break_braavos_pentos_treaty_effect_tt:0 "Braavos-Pentos Antlaşması bozulacak. Pentos bir kez daha #bold ordusunu geliştirebilecek, paralı asker tutabilecek ve köle ticaretine katılabilecek#!."

 agot_break_braavos_pentos_treaty_effect_2_tt:0 "Braavos, antlaşmayı yeniden dayatmaya çalışmalarına olanak tanıyan #bold 15 yıl#! süreli bir savaş sebebi kazanacak."

 agot_break_braavos_pentos_treaty_tooltip:0 "Braavos-Pentos Antlaşması'nı Boz"

 agot_break_braavos_pentos_treaty_confirm:0 "Pentos için!"

 agot_create_braavos_pentos_treaty_effect_tt:0 "[GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip], Pentos diyarındaki tüm karakterlere kalıcı olarak eklenecek. Yalnızca Pentos savaşla özgürleşirse kaldırılabilir."

 agot_break_braavos_pentos_treaty_as_braavos:0 "$agot_break_braavos_pentos_treaty$"

 agot_break_braavos_pentos_treaty_as_braavos_desc:0 "209 Braavos-Pentos Antlaşması'nda anlaşıldığı gibi Pentos sınırlarına sadakatle saygı gösterdik. Ama genişleme zamanı olgunlaştı; fetih karşısında bir kâğıt parçası ne ki?"

 agot_break_braavos_pentos_treaty_as_braavos_effect_tt:0 "Sen ve Braavoslu tüm vasalların, Pentos'a ve vasallarına savaş ilan etmekte özgür olacaksınız."

