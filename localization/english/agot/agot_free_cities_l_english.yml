 agot_form_undisputed_lands_decision_desc:0 "Bu topraklar Valyria'nın Kıyameti'nden beri savaşılıp didikleniyordu, ama ben sonunda onları birleştirdim."

 agot_form_undisputed_lands_decision_tooltip:0 "Bir zamanlar ihtilaflı olan bu topraklardan bir krallık kur"

 agot_form_undisputed_lands_confirm:0 "Kötü şöhrete ve ölümsüzlüğe!"

