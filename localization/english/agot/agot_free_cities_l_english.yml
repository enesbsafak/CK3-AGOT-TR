l_english:

 free_city_events.0001.t:0 "İttifak Teklifi İçeren Bir Mektup"

 free_city_events.0001.desc:0 "[request_sender.GetTitledFirstName]'in mührünü taşıyan bir mektup sarayımıza ulaştı; içeriği büyük sonuçları olan bir karardan söz ediyor.\n\n[request_sender.GetTitledFirstNameNoTooltip] bir zeytin dalı uzatıyor ve bir zamanlar kudretli Triarşi'yi doğuran kadim ittifakın yenilenmesini teklif ediyor. Şehirlerimizin güç ve amaç birliğiyle ayakta durduğu o günlerin hatırası içimizde bir kez daha canlanıyor.\n\n[request_sender.GetSheHe|U] şimdi Üç Kız Krallığı'nın sancağını yeniden yükseltmek, Myr, Lys ve Tyrosh'ü ortak dava ve paylaşılan hırs etrafında birleştirmek istiyor.\n\nGururlu ve egemen şehirler olarak geçmişin düşmanlıklarını bir kenara bırakıp bu kadim ittifakı yeniden kuracak mıyız? Birleşik bir Triarşi olarak omuz omuza durup gelecek fırtınalarla yüzleşecek miyiz, yoksa fırtınaya göğüs geren yalnız gemiler gibi kendi rotamızı mı izleyeceğiz?"

 free_city_events.0001.a:0 "Triarşi bir kez daha birlikte denizlere açılsın!"

 free_city_events.0001.b:0 "Çok önceden karara bağlandı ve geri dönmeyecek, henüz..."

 free_city_events.0003.t:0 "Üç Kız'ın Yeniden Kuruluşu"

 free_city_events.0003.desc:0 "Bir kez daha Üç Kız birleşik duruyor. Myr, Lys ve Tyrosh, Triarşi'nin ebedi bağlarını yeniden yemin etti; ittifakları Essos ve Westeros'un her yanında ilan edildi.\n\nOmuz omuza durarak hak ettiğimiz toprakların her karışını geri almaya ve düşmanlarımızı geldikleri uzak köşelere sürmeye ant içtik.\n\nBilinsin ki yeni bir çağ başladı; Üç Kız, birleşik güçlerini kullanmak üzere güçlü ve birlik içinde yeniden yükseliyor!"

 free_city_events.0003.a:0 "İttifakımız ebedi olsun, şimdi ve her zaman!"

 free_city_events.0004.t:0 "Küllerde Bir Düş"

 free_city_events.0004.desc:0 "[request_sender.GetTitledFirstNamePossessive] Üç Kız ittifakını yeniden kurma girişimi başarısız oldu. Dava asil olsa da Triarşi bu kez yeniden doğmayacak. Yine de belki bir gün, bu hayal küllerinden yeniden alevlenir.\n\nMyr, Lys ve Tyrosh'ün hak ettikleri toprakları geri almak ve düşmanlarını geri püskürtmek için bir arada durduğu birleşik bir diyar hayali hâlâ uzakta. Şimdilik yollarımızı ayıracağız ve kendi kaderimizin peşinden gideceğiz.\n\nYıldızlar farklı dizilseydi, bilinen dünya bizim gücümüzün önünde eğilirdi..."

 free_city_events.0004.a:0 "Yıldızlar farklı dizilseydi..."

 free_city_events.0004.b:0 "Demek karar verildi."

 free_city_events.1000.t:0 "Özgür Şehirleri Özgürleştir"

 free_city_events.1000.desc:0 ""[dead_ruler.GetNamePossessive] zorbalığının sonsuza dek süreceğini mi sandın? [free_city.GetName], [dead_ruler.GetHerHis] lekesinden kurtulduğuna göre seçimlere yeniden başladık ve bizim seçtiğimiz kişi sen değilsin.""

 free_city_events.1000.a:0 "Ah hayır..."

 free_city_events.1001.t:0 "Seçim Ertelendi"

 free_city_events.1001.desc_elector:0 "Diyar, [war_enemy.GetPrimaryTitle.GetName]'e karşı bir savaşa girmişken Conclave, yeni Birinci Magister seçiminin yapılmasını güvensiz buldu.\n\nBunun yerine [current_ruler.GetFullNameNicknamed], savaş bitene dek düzen ve istikrarı sağlamak için geçici olarak yeni yetkiler üstlendi.\n\nConclave ve Gonfaloniere, yaptıkları duyuruda, şehirlerinin geleceğinin terazide asılı olduğunun farkında olarak bu kriz döneminde Birinci Magister'in otoritesini tanıdıklarını bildiriyor. Yurttaşlar şimdi çatışmanın sonunu bekliyor; görünüşe göre bölünmüş durumdalar, kimisi kararnameleri alkışlıyor kimisi barış sağlandığında ne olacağından emin değil."

 free_city_events.1001.desc_liege:0 "Diyar, [war_enemy.GetPrimaryTitle.GetName]'e karşı bir savaşa girmişken Conclave, yeni Birinci Magister seçiminin yapılmasını güvensiz buldu ve şimdilik makamımı koruyor.\n\nBunun yerine Conclave, savaş bitene dek düzen ve istikrarı sağlamama yardımcı olması için bana geçici olarak yeni yetkiler verildiğini ilan etti.\n\nConclave ve Gonfaloniere, kamuoyuna yaptıkları duyuruda, şehirlerinin geleceğinin terazide asılı olduğunun farkında olarak bu kriz döneminde otoritemi tanıdıklarını bildiriyor. Yurttaşlarım şimdi çatışmanın sonunu bekliyor; görünüşe göre bölünmüş durumdalar, kimisi kararnameleri alkışlıyor kimisi barış sağlandığında ne olacağından emin değil."

 free_city_events.1001.a:0 "Özgürlük böyle mi ölür?... gürleyen alkışlarla mı?"

 free_city_events.1001.a_liege:0 "Beni alkışlıyorlar..."

 free_city_events.1001.a.tt:0 "Conclave, seçimi savaş bitene dek erteler."

 free_city_events.1001.war_delayed_due_to_war_tt:0 "Seçim, süregelen savaş yüzünden ertelendi."

 free_city_events.1002.t:0 "Savaşın Sonu"

 free_city_events.1002.desc_elector:0 "Savaş nihayet sona erdi ve şehir, yeni Birinci Magister seçimine yeniden başlamaya hazırlanıyor. \n\nÇatışma geride kaldığı için Conclave, şehri toparlanma sürecinden geçirip müreffeh bir geleceğe taşıyacak bir lider seçmek üzere toplanıyor. \n\nİlk belirtiler, [magister_winner.GetFullName]'in seçilmek için gereken desteğe sahip olabileceğini gösteriyor. Magisterler ve Gonfaloniere bir araya gelirken yurttaşlar, istikrar ve normal hayata dönüş umuduyla heyecan içinde."

 free_city_events.1002.desc_liege:0 "Savaş sona ererken, çatışma sırasında üstlenilen olağanüstü yetkilerden vazgeçme meselesi büyüyor. \n\nConclave, yeni Birinci Magister seçimine yeniden başlamaya hazırlanıyor ama süreç belirsiz. [magister_winner.GetFullName] muhtemel bir aday gibi görünüyor, ancak nihai karar henüz verilmedi. \n\nSavaş boyunca istikrarı koruyan Magister olarak, görevi bırakmanın gerçekten şehrin çıkarına mı olduğunu—ya da şey, senin çıkarına mı—yoksa liderliğinin devamının bu kırılgan zamanlarda gereken yönlendirmeyi sağlayıp sağlayamayacağını düşünüyorsun."

 free_city_events.1002.a:0 "[current_ruler.GetPrimaryTitle.GetName] çok yaşa! Seçim başlasın!"

 free_city_events.1002.a_liege:0 "[current_ruler.GetPrimaryTitle.GetName] hatırına, usulüne uygun davranacağım!"

 free_city_events.1002.a.tt:0 "Conclave, yeni Birinci Magister seçimine yeniden başlar."

 free_city_events.1002.b_liege:0 "Şehrin güçlü bir lidere ihtiyacı var ve ona yol gösterecek kişi ben olacağım!"

 free_city_events.1002.b.tt:0 "Devleti bir Diktatörlüğe dönüştürerek Birinci Magister konumunu korumaya çabalıyorsun."

 free_city_events.1003.t:0 "Görev Süresi Sona Eriyor"

 free_city_events.1003.desc:0 "Yeni bir Birinci Magister seçildi ve [current_ruler.GetTitledFirstName], [current_ruler.GetHerHis] görevinden alındı. [current_ruler.GetHerHis] hükümdarlığı sona ererken bir başkası başlıyor; [magister_winner.GetFullName], Conclave tarafından seçildi. Büyük bir törenle Magisterler ve Gonfaloniere, yeni Birinci Magister'e bağlılık yemini ediyor ve [magister_winner.GetHerHis] otoritesi halk tarafından resmî olarak kabul ediliyor. [magister_winner.GetFullNameNoTooltip]'in nasıl yöneteceği belirsizliğini koruyor ve Magisterler şimdiden yeni liderlerini kendi taraflarına çekmenin yollarını planlıyor."

 free_city_events.1003.a:0 "Birinci Magister çok yaşa! [magister_winner.GetPrimaryTitle.GetName] çok yaşa!"

 free_city_events.1004.t:0 "Karanlık Bir Dönemeç"

 free_city_events.1004.desc:0 "Şok edici bir gelişmeyle [current_ruler.GetFullName], [current_ruler.GetHerHis] olağanüstü yetkilerinden vazgeçmeyeceğini açıkladı. Bunun yerine [current_ruler.GetSheHe], kontrolü elinde tutmayı ve şehri bir diktatörlüğe dönüştürmeyi niyetliyor. Bu duyuru, demokratik yönetime dönüş umudu taşıyan Conclave ve halk arasında şok dalgaları yarattı. Gerilim yükselirken, yurttaşlar arasında belirsizlik ve korku yayılıyor; diyarın geleceği terazide asılı duruyor."

 free_city_events.1004.a:0 "Diyarımıza ne olacak?"

 free_city_events.2000.t:0 "Prensin Bedeli"

 free_city_events.2000.desc:0 "Kalabalığın önünde duruyorum, ellerim bağlı; başarısızlıklarımın ağırlığı zincirlerden daha ağır. Savaşı kaybettiğim için halkım şimdi tanrıları yatıştırmak adına beni kurban edecek.\n\nSoğuk bıçak boğazıma dayanıyor. Kalabalığın mırıltılarını duyabiliyorum ama artık hiçbiri önemli değil; kaderim mühürlendi.\n\nNe olabilirdi diye düşünüyorum: bir zamanlar taşıdığım hırsları ve peşimden gelen adamları. Şimdi hepsi çok uzakta görünüyor.\n\nSon bir nefesle bıçak sessizliği yarıyor ve ben artık yokum."

 free_city_events.2000.a:0 "..."

 PENTOS_LOST_WAR:0 "[loser.GetName]'in kurban edilmesinin ardından imzalanan ateşkes"

 free_city_events.9999.t:0 "[term_limit_country.GetAdjective] Seçimi"

 free_city_events.9999.desc_old_holder:0 "Demek oldu. Yerime biri geçti. \n\n[magister_winner.GetFullName] yeni Birinci Magister ve ben—şey, şimdilik kenara çekiliyorum. Magisterler ve Gonfaloniere yeni lidere bağlılık yemini etti; sesleri, bir zamanlar bana edilen sözlerle salonda yankılanıyor. \n\nKabul etmesi zor, ama daha önce de buradaydım. Güç parmakların arasından kum gibi akıp gider, ama oyunun bitmediğini biliyorum. Unutulmayacağım. Unutulmamalıyım."

 free_city_events.9999.desc_magister_winner:0 "Beni seçtiler. Conclave, yeni Birinci Magister olarak beni seçti. [old_holder.GetTitledFirstName] görevden alındı ve şimdi ben, bir zamanlar onların durduğu yerde duruyorum..\n\nMagisterler ve Gonfaloniere bana bağlılık yemini etti; otoritem pekişirken sadakat sözü verdiler. Ama ya şimdi? Nasıl yöneteceğim? Şimdiden bazı Magisterler açıkça entrika çeviriyor, bazılarıysa yüzüme tatlı sözler fısıldarken bir yandan da cebimi yokluyor. Tetikte olmalı ve önüme çıkacak her şeye hazırlanmalıyım."

 free_city_events.9999.desc_vassal:0 "Yeni bir Birinci Magister seçildi ve [old_holder.GetFirstName], [old_holder.GetHerHis] görevinden alındı. \n\n[old_holder.GetHerHis] hükümdarlığı sona ererken bir başkası başlıyor; [magister_winner.GetFullName], Conclave tarafından seçildi. Büyük bir törenle Magisterler ve Gonfaloniere, yeni Birinci Magister'e bağlılık yemini ediyor ve [magister_winner.GetHerHis] otoritesi halk tarafından resmî olarak kabul ediliyor. \n\n[magister_winner.GetFullNameNoTooltip]'in nasıl yöneteceği belirsizliğini koruyor ve Magisterler şimdiden yeni liderlerini kendi taraflarına çekmenin yollarını planlıyor."

 free_city_events.9999.a:0 "Birinci Magister çok yaşa! [term_limit_country.GetName] çok yaşa!"

 free_city_events.9999.b:0 "[magister_winner.GetFirstName] nasıl bir hükümdar olacak acaba..."

