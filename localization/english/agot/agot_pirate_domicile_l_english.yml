game_concept_pirate_port_rates:0 "Korsan Liman Ücretleri"

game_concept_pirate_port_rate:0 "Korsan Liman Ücreti"

game_concept_pirate_port_rates_desc:0 "$game_concept_pirate_port_rates$, [pirate_govt|E] hükümdarlarının elindeki bir yere varıldığında [agot_landless_pirate_domiciles|E]'lerin ödemesi gereken iki tür @gold_icon! ücretten oluşur.\n\nİlk ücret, #bold tek seferlik yanaşma ücreti#!dir; Topraksız Korsan, yeni bir [pirate_den_holding|E]'e girer girmez bunu ödemek zorundadır. İkinci ücret, korsan o konumda kaldığı sürece her yıl ödenmesi gereken #bold yıllık yanaşma ücreti#!dir.\n\nKontluğu yöneten Toprak Sahibi Korsanlar bu ücretleri [laws|E] aracılığıyla değiştirebilir."

game_concept_pirate_ship_designated_heir:0 "Belirlenmiş $game_concept_agot_landless_pirate_domicile$ Varisi"

game_concept_pirate_ship_designated_heirs:0 "Belirlenmiş [agot_landless_pirate_domicile|E] Varileri"

game_concept_pirate_ship_designated_heir_desc:0 "$game_concept_pirate_ship_designated_heir$, bir [agot_landless_pirate_domicile|E]'ine mirasçı olmak üzere belirlenmiş bir [character|E]'dir.\n\nMevcut $game_concept_agot_landless_pirate_domicile$ Kaptanı ile akraba olmaları gerekmez, ancak o karakterin saray mensubu olmaları şarttır. Yalnızca topraksız bir [pirate_govt|E] [ruler|E]'i bir $game_concept_pirate_ship_designated_heir$ belirleyebilir."

agot_pirate_events.8032.desc:0 "Şafak nihayet [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]'e demirlemiş [target.GetFirstNamePossessive] korsan gemisinden haber getiriyor ve başarımızı doğruluyor!\n\n[target.Custom('InsultNounPlural')] tamamen habersiz yakalandı"

agot_pirate_events.8032.kill:0 "ve [target.GetFirstNamePossessiveNoTooltip] adamlarından birkaçı ölü yatıyor — sağ kalanlar bu başarısızlıkla yaşamak zorunda..."

agot_pirate_events.8032.fallback:0 "ve herkesin gözü önünde yere serildi!"

agot_pirate_events.8034.t:0 "Korsan Gemisine Baskın Düzenlendi"

agot_pirate_events.8034.desc:0 "Şafakta, [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]'teki korsan gemisine yapılan baskına dair panik dolu söylentiler bana hızla ulaşıyor,"

agot_pirate_events.8034.kill:0 "\n\nBana, saray mensuplarımdan birkaçının saldırıda, düşmanlarım tarafından hayvanlar gibi katledildiğini söylüyorlar..."

agot_pirate_events.8034.discovered:0 "\n\nSonrasında herkes bunun açıkça [owner.GetName]'in işi olduğunda hemfikir..."

agot_pirate_events.8033.desc:0 "Şafak nihayet [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]'teki [target.GetFirstNamePossessive] korsan gemisinden haber getiriyor, her ne kadar duymak istediğimiz haber olmasa da...\n\n[target.Custom('InsultNounPlural')] bir şekilde saldırıya hazırdı ve herhangi bir hasar verme şansı bulamadan saldırganlarımızı boşa çıkardı."

agot_pirate_events.8033.captured:0 "\n\nDaha da kötüsü, [owner.Custom2('RelationToMeShort', SCOPE.sC('captured'))]'im [captured.GetTitledFirstName] baskın sırasında esir düşmüş gibi görünüyor..."

agot_pirate_events.8033.fallback:0 "\n\nEn azından içimiz rahat edebilir, çünkü kaybedilen tek şey benim kıymetli zamanımdı..."

