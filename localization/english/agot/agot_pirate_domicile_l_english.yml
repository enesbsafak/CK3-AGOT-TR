game_concept_agot_landless_pirate_domicile:0 "Korsan Gemisi"

game_concept_agot_landless_pirate_domiciles:0 "Korsan Gemileri"

game_concept_agot_landless_pirate_domicile_desc:0 "$game_concept_agot_landless_pirate_domiciles$, [pirate_govt|E] [government_form|E]'ine özel bir [domicile|E]'dir.\n\n$game_concept_agot_landless_pirate_domiciles$ hem toprak sahibi hem de topraksız [characters|e] tarafından kullanılır. Toprak sahibi korsanlar $game_concept_agot_landless_pirate_domicile$'lerini başkentlerinin dışına taşıyamaz; topraksız korsanlar ise $game_concept_agot_landless_pirate_domicile$'lerini yalnızca [pirate_den_holdings|E], [settlement_holdings|E] ve [wilderness_holdings|E] arasında taşıyabilir.\n\nTopraksız korsanlar $game_concept_agot_landless_pirate_domiciles$'lerini yeni bir $game_concept_pirate_den$'e taşıdıklarında, tek seferlik bir yanaşma ücreti ve yıllık bir ücret ödemek zorundadırlar ve [county|e] sahibinin savunma savaşlarına katılmakla yükümlü olurlar. Toprak sahibi korsanlar bu liman ücretlerinin miktarını [laws|E] aracılığıyla belirleyebilir."

agot_cannot_become_adventurer_as_pirate_with_valid_relocation_target:0 "Topraksız bir [agot_landless_pirate_domicile|e] sahibi olarak hiçbir geçerli seyahat hedefiniz olmamalıdır"

game_concept_pirate_dominate_title:0 "Unvana Hükmet"

game_concept_pirate_domination_war:0 "Korsan Hâkimiyet Savaşı"

game_concept_pirate_dominate_title_desc:0 "Unvanlarını daha yüksek bir [title_tier|E]'e çıkarmak isteyen korsanlar, bir bölgenin yerel sakinleriyle bir unvan için savaşmak zorundadır.\n\nSöz konusu unvan birine aitse, unvanı ondan gasp etmek için o hedefe karşı savaş başlatırlar. Eğer unvan kimseye ait değilse, bunun yerine unvanın [de_jure|E] alanındaki [tributary|E] ve [ally|E] olmayan herkesle savaşırlar.\n\nZafer hâlinde saldırgan söz konusu unvanı kazanır ve tüm savunanlar onun Haraçgüzarları hâline gelir. Yenilgi hâlinde saldırgan savunana [gold_i][gold|E] öder ve önemli miktarda [dread_i][dread|E] kaybeder.\n\n[decision|E] alıcısı De Jure alanının tamamına sahipse, savaşılacak savunan olmadığı için unvanı hemen kazanır."

pirate_domination_war_holder_custom_tooltip:0 "[title_scope.GetName] üzerinde [main_defender.GetShortUIName]'e karşı bir [pirate_domination_war|E] başlat#weak (@soldier_icon![main_defender.MakeScope.ScriptValue('dominate_title_current_ally_strength')|N0])#!"

pirate_domination_war_no_holder_custom_tooltip:0 "[title_scope.GetName] üzerinde [main_defender.GetShortUIName]'e karşı bir [pirate_domination_war|E] başlat\n\t$BULLET$[title_scope.GetName]'in [de_jure|E] [county|E] alanındaki [tributary|E] ve [ally|E] olmayan her [holder|E], [main_defender.GetShortUIName]'e savunan olarak katılacak #weak (@soldier_icon![root_scope.MakeScope.ScriptValue('dominate_title_current_enemy_strength')|N0])#!"

agot_raid_pirate_domicile:0 "$agot_pirate_ship_domicile_type$'ne Baskın"

agot_raid_pirate_domicile_desc:0 "[SCHEME.GetTargetCharacter.GetShortUIName] fazla cüretkâr oluyor — bir baskın, [SCHEME.GetTargetCharacter.GetHerHim]'i [SCHEME.GetTargetCharacter.GetHerHis] yerine koyacaktır."

agot_raid_pirate_domicile_desc_general:0 "$agot_raid_pirate_domicile$, başka bir korsanın [agot_landless_pirate_domicile|E]'ine baskın düzenlemeyi amaçlayan bir [hostile_scheme|E]'dir. [intrigue|E]'ye dayanır ve [agents|E] toplayabilir.\n\nBaşarılı bir $agot_raid_pirate_domicile$, hedefin [gold|E] ve [artifacts|E]'inin çalınmasına, [agot_landless_pirate_domicile|E]'inin hasar görmesine ve hatta saray mensuplarının ölümüne yol açabilir."

