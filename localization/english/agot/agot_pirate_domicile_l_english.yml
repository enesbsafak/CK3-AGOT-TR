RAID_PIRATE_SHIP_IN_HIGH_PORT_RATE_DESC:0 "[target.GetShortUINamePossessive] [agot_landless_pirate_domicile|E], $pirate_tax_rate_04$ [pirate_port_rate|E] uygulanan bir [realm|E]'de demirli: $VALUE|+=0$"

