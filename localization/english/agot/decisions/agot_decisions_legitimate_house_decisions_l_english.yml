 agot_become_legitimate_house_decision_desc_dorne:0 "Dorne'un kumlarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_dorne').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Dorne'un gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; Kızıl Dağlar'ın çöllerinden Yaz Denizi'nin kıyılarına, Dorne sonsuza dek bizim!"

 agot_become_legitimate_house_decision_dorne_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Dorne unvanını yeterince uzun süre elinde tutarsa, Dorne'un [agot_legitimate_house|E] olabileceğiz."

