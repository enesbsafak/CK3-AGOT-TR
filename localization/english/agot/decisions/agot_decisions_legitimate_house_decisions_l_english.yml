 agot_become_legitimate_house_decision_desc_crownlands:0 "Taç Toprakları'nın topraklarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_crownlands').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Taç Toprakları'nın gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; Kara Su'dan Kral Ormanı'na, Taç Toprakları sonsuza dek bizim!"

