l_english:

 agot_become_legitimate_house_decision_generic:0 "Meşru Hanedan Ol"

 agot_become_legitimate_house_decision_desc_generic:0 "Hanedanınız içinde bir unvanı nesiller boyu elinde tuttuktan sonra, House [ROOT.Char.GetHouse.GetNameNoTooltip] nihayet bölgenin [agot_legitimate_house|E] oldu. Artık halkın gözünde bu toprakların gerçek hükümdarı sensin ve soyundan gelenler bu toprakları sonsuza dek elinde tutacak!"

 agot_become_legitimate_house_decision_generic_tooltip:0 "House [ROOT.Char.GetHouse.GetName] unvanlarımızı yeterince uzun süre elinde tutarsa, bölgemizin [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_generic_effect:0 "Bölgenin [agot_legitimate_house|E] olacaksın."

 agot_become_legitimate_house_decision_has_doesnt_have_own_decision_trigger:0 "[agot_legitimate_house|E] olmak için kendine özel bir [decision|E]'i yok"

 agot_become_legitimate_house_decision_generic_confirm:0 "Biz Gerçek Hükümdarlarız!"

 agot_become_legitimate_house_decision_100_percent_trigger:0 "[agot_legitimate_house|E] olma yolunda %100 ilerleme var"

 agot_become_legitimate_house_decision_north:0 "Kuzey'in Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_north:0 "Kuzey'in geniş topraklarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_north').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık soğuğa karşı koruyucu olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; Boyun'dan Duvar'a, Kuzey sonsuza dek bizim!"

 agot_become_legitimate_house_decision_north_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Kuzey unvanını yeterince uzun süre elinde tutarsa, Kuzey'in [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_north_confirm:0 "Biz Gerçek Kış Krallarıyız!"

 agot_become_legitimate_house_decision_vale:0 "Vadi'nin Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_vale:0 "Vadi'nin dağlarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_vale').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Vadi'nin gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; Kanlı Kapı'dan Parmaklar'a, Vadi sonsuza dek bizim!"

 agot_become_legitimate_house_decision_vale_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Vadi unvanını yeterince uzun süre elinde tutarsa, Vadi'nin [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_vale_confirm:0 "Bu Dağlar Bizim!"

 agot_become_legitimate_house_decision_riverlands:0 "Nehir Toprakları'nın Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_riverlands:0 "Nehir Toprakları'nın verimli tarlalarını ve sularını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_riverlands').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Nehir Toprakları'nın gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; İkizler'den Kavşak'a, Nehir Toprakları sonsuza dek bizim!"

 agot_become_legitimate_house_decision_riverlands_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Nehir Toprakları unvanını yeterince uzun süre elinde tutarsa, Nehir Toprakları'nın [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_riverlands_confirm:0 "Bizim Nehirlerimiz, Bizim Topraklarımız!"

 agot_become_legitimate_house_decision_westerlands:0 "Batı Toprakları'nın Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_westerlands:0 "Batı Toprakları'nın tepelerini nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_westerlands').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Batı Toprakları'nın gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; Casterly Kayası'nın zirvesinden Derin İn'in derinliklerine, Batı Toprakları'nın zenginliği sonsuza dek bizim!"

 agot_become_legitimate_house_decision_westerlands_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Batı Toprakları unvanını yeterince uzun süre elinde tutarsa, Batı Toprakları'nın [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_westerlands_confirm:0 "Altın Topraklar, Altın Hanedan!"

 agot_become_legitimate_house_decision_iron_islands:0 "Demir Adaları'nın Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_iron_islands:0 "Demir Adaları'nın kayalık kıyılarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_iron_islands').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Demir Adaları'nın gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; tüm dünya sancaklarımızın kıyılarına ulaşmasından korkacak!"

 agot_become_legitimate_house_decision_iron_islands_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Demir Adaları unvanını yeterince uzun süre elinde tutarsa, Demir Adaları'nın [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_iron_islands_confirm:0 "Biz Gerçek Demir Doğumluyuz!"

 agot_become_legitimate_house_decision_reach:0 "Reach'in Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_reach:0 "Reach'in tarlalarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_reach').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Reach'in gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; küçücük Dört Kalkan'dan koca Altınkoru'ya, her şey bizim korumamız altında yeşeriyor!"

 agot_become_legitimate_house_decision_reach_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Reach unvanını yeterince uzun süre elinde tutarsa, Reach'in [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_reach_confirm:0 "Gücümüz Artıyor!"

 agot_become_legitimate_house_decision_stormlands:0 "Fırtına Toprakları'nın Meşru Hanedanı Ol"

 agot_become_legitimate_house_decision_desc_stormlands:0 "Fırtına Toprakları'nın çeşitli topraklarını nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('e_the_stormlands').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Fırtına Toprakları'nın gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde bu toprakların gerçek hükümdarı; Kızıl Dağ'dan Kara Su'ya, Fırtına Toprakları sonsuza dek bizim!"

 agot_become_legitimate_house_decision_stormlands_tooltip:0 "House [ROOT.Char.GetHouse.GetNameNoTooltip] Fırtına Toprakları unvanını yeterince uzun süre elinde tutarsa, Fırtına Toprakları'nın [agot_legitimate_house|E] olabileceğiz."

 agot_become_legitimate_house_decision_stormlands_confirm:0 "Hiçbir Fırtına Bizi Yıkamaz!"

