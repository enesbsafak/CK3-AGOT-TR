 agot_become_legitimate_house_decision_desc_iron_throne:0 "Demir Taht'ı nesiller boyu hanedanınızda tuttuktan sonra, House [GetTitleByKey('h_the_iron_throne').MakeScope.Var('legitimate_house').House.GetNameNoTooltip] artık Demir Taht'ın gerçek hükümdarı olarak görülmüyor. House [ROOT.Char.GetHouse.GetNameNoTooltip], lordların ve küçük halkın gözünde artık bu toprakların gerçek hükümdarı; Westeros'un ta kendisi sonsuza dek bizim!"

