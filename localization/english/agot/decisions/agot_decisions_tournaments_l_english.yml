 agot_hold_an_epic_tournament:0 "Büyük Turnuva Düzenle"

 agot_hold_an_epic_tournament_tooltip:0 "Büyük Turnuva Düzenle"

 agot_hold_an_epic_tournament_desc:0 "Yüzyıllarca hatırlanacak kadar görkemli bir turnuva düzenleyelim!"

 agot_hold_an_epic_tournament_confirm:0 "Hazırlıklara başla"

 agot_hold_an_epic_tournamentREALMTOURNEY1:0 "Krallıkta başka hiçbir yerde sürmekte olan turnuva yok"

 agot_hold_an_epic_tournamentCOOLDOWN:0 "Son 10 yılda turnuva düzenlememiş"

 agot_hold_an_epic_tournamentATTENDING:0 "Şu anda başka bir turnuvaya katılmıyor"

 agot_tourney.1.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.1.desc:0 "Yüzyıllarca hatırlanacak kadar görkemli bir turnuva düzenleyelim! Üstat, olası her savaşçıya davetiye taşıyan kuzgunlar göndersin."

 agot_tourney.1.a:0 "Her mızrak dövüşünü izleyeceğim."

 agot_tourney.1.b:0 "Sadece final mızrak dövüşlerini izleyeceğim."

 agot_tourney.1.b.tt:0 "Sadece yarı finalleri ve final mızrak dövüşünü göreceksin."

 agot_tourney.99.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.99.desc:0 "Komşu dükalıklardan katılımcılar davet eden bölgesel bir turnuva mı düzenlemek istersin, yoksa krallık içindeki her yiğide kuzgun mu gönderelim?"

 agot_tourney.99.a:0 "Bölgesel bir turnuva yeterli olur."

 agot_tourney.99.a.tt:0 "Yalnızca komşu beyliklerden olası katılımcılar davet edilecek."

 agot_tourney.99.b:0 "Kocaman bir turnuva olacak!"

 agot_tourney.2.desc:0 "İşbu mektupla [host_location.GetName]'te düzenlenecek büyük turnuvaya davet edildin."

 agot_tourney.2.a:0 "Köşe başları titreyecek."

 agot_tourney.2.b:0 "Daha iyi yapacak işlerim var."

 agot_tourney.2.c:0 "Turnuvalarla hiç ilgilenmiyorum."

 agot_tourney.2.c.tt:0 "Bir daha asla turnuvaya davet edilmeyeceksin."

 agot_tourney.3.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.3.desc:0 "Krallığın lordları ve şampiyonları, köşe başlarında kendilerini sınamaya hazır şekilde geldi. Yüz çadırda yüz kalkan asılı, büyük ve küçük hanedanların armaları gururla sergileniyor.\n\nMızrağı ve atı olan her savaşçı girebilir, ancak sonraki mızrak dövüşlerine yalnızca en hünerliler kalacaktır."

 agot_tourney.3.a:0 "Başlayalım."

 agot_tourney.31.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.31.desc:0 "Turnuva alanına nihayet ulaştığımda, manzarayı ve sesleri bir an için sindirmek için duraksıyorum. Krallığın soylularının hemen hepsi gelmiş görünüyor; sancakları ve bayrakları rüzgârda dalgalanıyor, kalkanları ve armaları gururla sergileniyor. Burada kazanılacak şan var.\n\nBir borazanın sesi, eleme turlarının yakında başlayacağını duyuruyor. Atımı köşe başlarına doğru sürüyorum."

 agot_tourney.31.a:0 "Şan için!"

 agot_tourney.5.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.5.desc:0 "Ne yazık ki çağrıya yanıt verecek kadar savaşçı cesaret bulamadı ve [host_location.GetName] Turnuvası iptal edilecek."

 agot_tourney.5.a:0 "Gerçekten yazık."

 agot_tourney.52.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.52.desc:0 "Ne yazık ki çağrıma yanıt verecek kadar savaşçı cesaret bulamadı ve [host_location.GetName] Turnuvası iptal edilmek zorunda."

 agot_tourney.52.a:0 "Gerçekten yazık."

 agot_tourney.53.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.53.desc:0 "Bir trajedi yaşandı. [dead_host.GetTitledFirstName]'in ölümüyle turnuva iptal edilmek zorunda."

 agot_tourney.53.a:0 "Gerçekten, tanrılar zalim."

 agot_tourney.54.t:0 "Turnuva"

 agot_tourney.54.desc:0 "Savaş, herhangi bir turnuvanın gösterişinden önce gelmek zorundadır. Son çatışmanın patlak vermesiyle turnuva iptal edilmek zorunda."

 agot_tourney.54.a:0 "Acı bir hayal kırıklığı."

 agot_tourney.55.t:0 "Turnuva"

 agot_tourney.55.desc:0 "Savaş, herhangi bir turnuvanın gösterişinden önce gelmek zorundadır. Son çatışmanın patlak vermesiyle turnuva iptal edilmek zorunda."

 agot_tourney.55.a:0 "Acı bir hayal kırıklığı."

 agot_tourney.8.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.8.desc:0 "Tüm çabalarıma rağmen eleme turlarında yenildim ve turnuvadan erkenden elendim; kimseyi etkilemeyecek bir sonuç bu."

 agot_tourney.8.a:0 "Kalan mızrak dövüşlerini izleyeceğim."

 agot_tourney.8.b:0 "Ne rezillik! Diğer mızrak dövüşlerini izlemeye dayanamam."

 agot_tourney.8.b.tt:0 "Başka hiçbir mızrak dövüşünden haberdar edilmeyeceksin."

 agot_tourney.9.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.9.desc:0 "Eleme turları sona erdi ve pek çok yiğit yarışmacı yaralarını yalayıp zedelenmiş gururunu okşamak zorunda kaldı. Yarıştan kopmayanlar final turlarına hazırlanıyor. Seyirciler bahislerini koyup yarışmacılar gösteriş yaparken turnuva alanı beklentiyle uğulduyor."

 agot_tourney.9.a:0 "Şans cesurdan yanadır!"

 agot_tourney.6.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.6.desc:0 "Cesaretim ve eğitimim sayesinde eleme turlarını geçtim ve krallığın en güçlü savaşçıları arasında yerimi aldım. Kalabalığın kükremesi kulaklarımda gürlüyor ve final turlarının başlangıcını haber veren borazanları güçlükle duyuyorum."

 agot_tourney.6.a:0 "Her mızrak dövüşünü keskin bir gözle izliyorum."

 agot_tourney.6.b:0 "Diğer karşılaşmaların dikkatimi dağıtmasından kaçınıyorum."

 agot_tourney.6.b.tt:0 "Diğer katılımcıların mızrak dövüşlerinden haberdar edilmeyeceksin."

 agot_tourney.10.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.10.desc:0 "Müjdeci sıradaki mızrak dövüşünü duyuruyor. [jouster1.GetTitledFirstName] ve [jouster2.GetTitledFirstName] köşe başlarında yerlerini alıyor. Kalabalığın uğultusunda heyecan, beklenti ve yadsınamaz bir kan susuzluğu seziliyor."

 agot_tourney.10.a:0 "Heyecan elle tutulur gibi."

 agot_tourney.10.b:0 "Ortada birkaç altın varsa heyecan daha da elle tutulur olacak."

 agot_tourney.10.b.tt:0 "Bahis koy."

 agot_tourney.10.c:0 "Fikrimi değiştirdim, pes edip turnuvadan ayrılıyorum"

 agot_tourney.14.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.14.desc:0 "Kalkanlar sarsıldı, mızraklar parçalandı ve iyi adamlar attan düşürüldü; tüm bunlar toplanan savaşçılar arasından çayırağını samandan ayıklamak içindi.\n\nTurnuvaya giren tüm şövalyeler ve serbest atlılar arasından yalnızca [winner.GetTitledFirstName] yenilgisiz kaldı. Küçük halk [winner.GetHerHis] adını haykırırken daha soylu kesim daha vakur biçimde alkışlıyor; ama [winner.GetSheHe] şampiyon ilan edildiğinde herkes coşkuyla haykırıyor."

 agot_tourney.14.a:0 "Eve giden uzun yol seni bekliyor."

 agot_tourney.15.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.15.desc:0 "Karşıma çıkan her rakibi tek tek alt ettim, her zaferle özgüvenim arttı ve sonunda geriye hiç düşman kalmadı. Adım her erkek, kadın ve çocuğun dilinde; yakında unutulmayacağını biliyorum.\n\nHangisi daha iyi: zaferin heyecanı mı, Hanem için kazanılan şan mı, yoksa şampiyona verilen hazinenin parıltısı mı? Hiç fark etmez. Üçü de benim."

 agot_tourney.15.a:0 "Şanlı bir gün!"

 agot_tourney.151.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.151.desc:0 "Zafere bu kadar yaklaşıp son anda tökezlemek, yutulması güç acı bir yudum. İnsanlar iyi binip adıma saygı gösterdiğimi söyleyecek, ama ben her zaman küçük halkın benim olmayan bir adı haykırdığını hatırlayacağım.\n\nÖte yandan, ikincilik ödülü kesesi hayal kırıklığıma iyi gelecek bir merhem olacak."

 agot_tourney.151.a:0 "İkincilik o kadar da kötü değil."

 agot_tourney.16.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.16.desc:0 "Final mızrak dövüşü çekişmeli geçti ve sonunda tribünler gürültülü tezahüratlarla inledi; [winner.GetTitledFirstName] zaferle ayrıldı.\n\nTurnuvam şanlı bir iş oldu; [winner.GetTitledFirstNamePossessive] adı kuşkusuz küçük halkın da soylunun da zihninde yankılanacak olsa da, belki benim adım da akıllarında kalır."

 agot_tourney.16.a:0 "Gerçekten çağlara damga vuracak bir turnuva!"

 agot_tourney.11.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.11.desc:0 "[jouster1.GetTitledFirstName] ve [jouster2.GetTitledFirstName] köşe başlarına girip sıradaki mızrak dövüşüne hazırlanıyor. Atları hücum için sabırsızlanıp yeri eşeliyor."

 agot_tourney.11.a:0 "Daha iyi savaşçı kazansın!"

 agot_tourney.11.b:0 "Ortada birkaç altın varsa daha heyecanlı olacak..."

 agot_tourney.11.b.tt:0 "Bahis koy."

 agot_tourney.101.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.101.desc:0 "Her mızrak düellosunda bir şans unsuru vardır ama tanrılar en çok silah ustalığı yüksek savaşçıya güler.\n\nParamı kimin hünerine yatırayım?"

 agot_tourney.101.a:0 "[jouster1.GetTitledFirstName] bugün korkutucu bir görünüme sahip."

 agot_tourney.101.b:0 "Bana kalırsa kazanmaya daha yakın olan [jouster2.GetTitledFirstName]."

 agot_tourney.102.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.102.desc:0 "Her mızrak düellosunda bir şans unsuru vardır ama tanrılar en çok silah ustalığı yüksek savaşçıya güler.\n\nParamı kimin hünerine yatırayım?"

 agot_tourney.102.a:0 "[jouster1.GetTitledFirstName] bugün korkutucu bir görünüme sahip."

 agot_tourney.102.b:0 "Bana kalırsa kazanmaya daha yakın olan [jouster2.GetTitledFirstName]."

 agot_tourney.111.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.111.desc:0 "Kendimi toprağın içinde yatarken buluyorum; zırhım parçalanmış, bedenimde düzinelerce taze acı filizleniyor."

 agot_tourney.111.a:0 "Bu yaraların iyileşmesi zaman alacak."

 agot_tourney.112.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.112.desc:0 "Sırt üstü uyanıyorum, gökyüzü tepemde dönüyor, ama görüşüm çoktan kararıyor. Sesler var, duyumlar var; onlar da kayboluyor. Bir şeyler ters. Dünyam acıya dönüşüyor, sonra o da kayboluyor."

 agot_tourney.112.a:0 "Bu son."

 agot_tourney.12.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.12.desc:0 "[victor.GetTitledFirstName], [loser.GetTitledFirstName]'e karşı üstün geldi ve bir sonraki tura yükseldi."

 agot_tourney.12.betwon.desc:0 "Benim için daha önemlisi, [victor.GetTitledFirstName]'e bahis oynayacak kadar ileri görüşlü olduğum için kesemi güzelce şişireceğim. Sağ ol, [victor.GetTitledFirstName]!"

 agot_tourney.12.betlost.desc:0 "Ak Gezenler [victor.GetTitledFirstName]'i götürsün, [victor.GetSheHe] bana güzel paralara mal oldu!"

 agot_tourney.12.a:0 "Nefes kesen bir mızrak düellosuydu."

 agot_tourney.13.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.13.desc:0 "Onur konuklarına ayrılmış yerimden [victor.GetTitledFirstName]'in [loser.GetTitledFirstName]'e karşı zaferini izliyorum. Kazanan bir sonraki tura yükselecek."

 agot_tourney.13.betwon.desc:0 "Benim için daha önemlisi, [victor.GetTitledFirstName]'e bahis oynayacak kadar ileri görüşlü olduğum için kesemi güzelce şişireceğim. Sağ ol, [victor.GetTitledFirstName]!"

 agot_tourney.13.betlost.desc:0 "Ak Gezenler [victor.GetTitledFirstName]'i götürsün, [victor.GetSheHe] bana güzel paralara mal oldu!"

 agot_tourney.13.a:0 "Nefes kesen bir mızrak düellosuydu."

 agot_tourney.2.t:0 "[host_location.GetName] Turnuvası"

 agot_tourney.122.t:0 "Mızrak Düellosu"

 agot_tourney.122.desc:0 "Atım sağlam duruyor, nişanım isabetli ve mızrağımın ucuyla rakibime vuruyorum. Kalabalık kükrüyor ve ben bir zafer selinde yıkanıyorum.\n\nRakibim eyerinde sallanıyor, can havliyle atına tutunuyor."

 agot_tourney.122.a:0 "Düş, budala!"

 agot_tourney.123.t:0 "Mızrak Düellosu"

 agot_tourney.123.desc:0 "Köşe başlarında toynaklar gürlüyor ve rakibime nişan alıyorum, ama çıkışa geç kalmışım. Bir dağın ağırlığı göğsüme çarpıyor, görüşüm binlerce kırık parçaya bölünüyor."

 agot_tourney.123.a:0 "Bu hiç ideal değil."

 agot_tourney.125.t:0 "Mızrak Düellosu"

 agot_tourney.125.desc:0 "İrademin ve eğitimimin her zerresini toplayarak eyerde kalmayı başarıyorum. Gözümün önündeki yıldızları silkip nefesimi topluyor ve bir mızrak dövüşü daha için atımı çeviriyorum."

 agot_tourney.125.a:0 "Bu daha bitmedi!"

 agot_tourney.126.t:0 "Mızrak Düellosu"

 agot_tourney.126.desc:0 "Çarpışma dayanılamayacak kadar şiddetli. Havada süzülürken rüzgârı hissediyorum; ardından ikinci bir çarpışma ciğerlerimdeki havayı dışarı sıkıyor."

 agot_tourney.126.a:0 "Acı var... korkunç bir acı."

 agot_tourney.127.t:0 "Mızrak Düellosu"

 agot_tourney.127.desc:0 "İstemeyerek de olsa hayranlık duyduğum bir kararlılık ve hüner gösterisiyle rakibim at üstünde kalmayı başarıyor.\n\nAtımı çevirip bir mızrak dövüşü daha için mahmuzlarımı batırıyorum."

 agot_tourney.127.a:0 "Zafer benim olacak!"

 agot_tourney.128.t:0 "Mızrak Düellosu"

 agot_tourney.128.desc:0 "Yaşayan hiçbir adam darbeme dayanamazdı; düşmanımın toprağa yuvarlandığını görmekle mest oldum. Bu an, kendimi yarım bir tanrı gibi hissediyorum."

 agot_tourney.128.a:0 "Zafer benim!"
