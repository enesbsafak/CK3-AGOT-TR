l_english:

 agot_expose_true_parentage_decision:0 "Gerçek Soyu Açığa Çıkar"

 agot_expose_true_parentage_decision_tooltip:0 "Talepkarın soyunun gerçeğini açığa çıkaracaksınız."

 agot_expose_true_parentage_decision_tooltip.jon:0 "Sevinç Kulesi'nde gerçekte ne olduğunu açığa çıkaracaksınız."

 agot_expose_true_parentage_decision_desc.jon:0 "Kış gülleri arasında edilen sözleri fazlasıyla iyi hatırlıyorum... ve yine de karşımda, tüm hayatı bir yalan üzerine kurulu bir çocuk var. Lyanna'nın çocuğunun gerçeği hiç öğrenmeden yaşayıp ölmesi adil değil."

 agot_expose_true_parentage_decision_desc.man:0 "Bildiklerim bana musallat olmaktan başka bir şey yapamaz. Bu kadar aşağıda olduğuna inanıp da bu kadar yüksekten gelmiş olmak. Karşımda, tüm hayatı bir yalan üzerine kurulu bir çocuk var. Artık büyümüş bir adam olan bir çocuk. Gerçeği hiç öğrenmeden yaşayıp ölmesi adil değil."

 agot_expose_true_parentage_decision_desc.woman:0 "Bildiklerim bana musallat olmaktan başka bir şey yapamaz. Bu kadar aşağıda olduğuna inanıp da bu kadar yüksekten gelmiş olmak. Karşımda, tüm hayatı bir yalan üzerine kurulu bir çocuk var. Artık büyümüş bir kadın olan bir çocuk. Gerçeği hiç öğrenmeden yaşayıp ölmesi adil değil."

 agot_expose_true_parentage_decision_requirement_yes:0 "Yetişkin olan gizli bir kraliyet piçinden haberdarsınız ve ona henüz söylemediniz."

 agot_expose_true_parentage_decision_confirm:0 "Gerçek bilinmeli!"

 agot_expose_my_true_parentage_decision:0 "Gerçek Soyunuzu Açığa Çıkarın"

 agot_expose_my_true_parentage_decision_tooltip:0 "Kendi soyunuzun gerçeğini açığa çıkaracaksınız."

 agot_expose_my_true_parentage_decision_cadet_tooltip:0 "Sen ve çocukların yeni bir [bastard_house|E] kuracaksınız."

 agot_expose_my_true_parentage_decision_desc:0 "Bildiklerim bana musallat olmaktan başka bir şey yapamaz. Bu kadar aşağıda olduğuma inanmış, oysa bu kadar yüksekten gelmiş olmak. Tüm hayatım bir yalan üzerine kuruluydu. Artık değil. Kendi topraklarımla saygı duyulan biri olduğuma göre, gerçek açığa çıkacak. Ben kraliyet kanıyım ve dünya bunu öğrenecek!"

 agot_expose_my_true_parentage_decision_confirm:0 "Gerçek bilinmeli!"

 agot_royal_bastard_claim_decision:0 "Demir Taht Üzerindeki Hakkını Savun"

 agot_royal_bastard_claim_decision_tooltip:0 "Kraliyet kanınız sayesinde doğuştan hakkınızı talep edeceksiniz."

 agot_royal_bastard_claim_decision_desc.forswore:0 "Aşağı doğumlu kökenlerime rağmen, Westeros'un gözünde yüksek bir mertebeye yükseldim. Açıkça bir niyet ilan etmesem de, gerçek şu ki damarlarımda akan kraliyet kanı bana Yedi Krallık üzerinde inkar edilemez bir hak veriyor. Elbette, geçmişteki eylemlerim göz önüne alındığında böyle bir ilan onuruma leke sürer; üstelik tahta böylesine açık bir meydan okuma, beni çıktığımda geri dönemeyeceğim bir savaş yoluna sokar."

 agot_royal_bastard_claim_decision_desc:0 "Aşağı doğumlu kökenlerime rağmen, Westeros'un gözünde yüksek bir mertebeye yükseldim. Damarlarımda akan kraliyet kanı, istersem Yedi Krallık'ı talep etme hakkını bana veriyor. Elbette, tahta böylesine açık bir meydan okuma, beni çıktığımda geri dönemeyeceğim bir savaş yoluna sokar."

 agot_royal_bastard_claim_decision_confirm:0 "Doğuştan hakkımı almalıyım!"
