l_english:

 agot_go_on_reaving_decision:0 "Bir Yağma Akınına Çık"

 agot_go_on_reaving_decision_opening_desc:0 "#F Demir Bedeli'ni ödeyin ve Dar Deniz'in ötesindeki toprakları talan etmek için büyük bir yağma organize edin. Diyarın dört bir yanından Demirdoğanlar, safran ve ipek diyarlarını yağmalamak için donanmanıza katılacak!#!"

 reaving_effect_1:0 "Yağma için olgun bir hedef seçeceksiniz"

 reaving_effect_2:0 "Yağma akının ne kadar başarılı olursa, o kadar çok [piety|E] ve [prestige|E] kazanırsın"

 reaving_effect_3:0 "[GetTrait('viking').GetName( GetNullCharacter )] özelliğini kazanabilirsiniz"

 agot_go_on_reaving_decision_tooltip:0 "Büyük bir [reaving|E] çağrısı yapılacak."

 agot_go_on_reaving_decision_confirm:0 "Yeşilliciler Demirdoğanlardan korkacak!"

 agot_buy_diving_bell:0 "Dalış Çanı Satın Al"

 agot_buy_diving_bell_desc:0 "Gemime bir dalış çanı taktıracağım; böylece hanem, batık hazinelerin eski haritalarını takip edip okyanus tabanındaki enkazlara dalabilir."

 agot_buy_diving_bell_tooltip:0 "Geminize bir dalış çanı taktırın"

 agot_buy_diving_bell_effect_tooltip:0 "$agot_sailing_type_treasure$ [GetActivityType('activity_agot_sailing').GetName] [activity|E]'ini açar"

 agot_buy_diving_bell_confirm_text_desc:0 "Gemi ustasını çağır"

 agot_buy_ship:0 "Gemi Satın Al"

 agot_buy_ship_desc:0 "Denizler, onları yelkenle aşmaya cesaret edenlere zenginlik, şan ve macera sunar. İyi bir gemi Hanem'e iyi hizmet eder; sancağımı uzak kıyılara taşır ve dalgaların üzerinde yeni fırsatlar açar. Şimdi yalnızca nasıl bir gemi sipariş edeceğime karar vermeliyim."

 agot_buy_ship_tooltip:0 "Hane'niz için bir gemi sipariş edin"

 agot_buy_ship_effect_1_tooltip:0 "$agot_sailing_type_raid$ [GetActivityType('activity_agot_sailing').GetName]'ini açar"

 agot_buy_ship_effect_2_tooltip:0 "$agot_sailing_type_valyria$ [GetActivityType('activity_agot_sailing').GetName]'ini açar"

 agot_buy_ship_confirm_text_desc:0 "Gemi ustalarını çağır"

 agot_buy_ship_small_ship:0 "Bir $owns_small_ship$ satın al"

 agot_buy_ship_small_ship_desc:0 "Hazinemi boşaltmadan sancağımı denizlerin ötesine taşımaya uygun, mütevazı bir gemi."

 agot_buy_ship_small_ship_tooltip:0 "$agot_buy_ship_small_ship_desc$"

 agot_buy_ship_big_ship:0 "Bir $owns_big_ship$ satın al"

 agot_buy_ship_big_ship_desc:0 "Güçlü bir Haneye yakışır görkemli bir gemi; demir attığı her yerde hayran bakışları üzerine çekecek."

 agot_buy_ship_big_ship_tooltip:0 "$agot_buy_ship_big_ship_desc$"
