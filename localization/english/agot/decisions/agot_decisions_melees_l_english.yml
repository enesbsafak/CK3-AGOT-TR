l_english:

 agot_hold_an_epic_melee:0 "Büyük Melee Düzenle"

 agot_hold_an_epic_melee_tooltip:0 "Büyük Melee Düzenle"

 agot_hold_an_epic_melee_desc:0 "En büyük savaşçının kim olduğunu belirlemenin tek bir yolu var. Büyük bir melee düzenleyelim!"

 agot_hold_an_epic_melee_confirm:0 "Hazırlıklara başla"

 agot_hold_an_epic_meleeREALMMELEE1:0 "Krallığın başka yerinde devam eden rakip bir melee yok"

 agot_hold_an_epic_meleeCOOLDOWN:0 "Son 10 yılda melee düzenlenmedi"

 agot_hold_an_epic_meleeATTENDING:0 "Şu anda başka bir melee'ye katılmıyor"

 agot_is_not_busy_trigger_tooltip:0 "Şu anda meşgul değil"

 agot_melee.1.t:0 "[host_location.GetName] Büyük Büyük Melee'si"

 agot_melee.1.desc:0 "En büyük savaşçının kim olduğunu belirlemenin tek bir yolu var. Üstada, her savaşçı adayına davetiye göndermesi için kuzgunları salmasını söyleyin!"

 agot_melee.1.a:0 "Her dövüşü izleyeceğim."

 agot_melee.1.b:0 "Yalnızca final dövüşlerini izleyeceğim."

 agot_melee.2.desc:0 "İşbu mektupla, [host_location.GetName]'te düzenlenecek büyük bir melee'ye davet edildiniz."

 agot_melee.2.a:0 "Biraz kemik kırmanın zamanı."

 agot_melee.2.b:0 "Yapacak daha iyi işlerim var"

 agot_melee.2.c:0 "Melee'lerle hiç ilgilenmiyorum."

 agot_melee.3.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.3.desc:0 "Diyarın lordları ve şampiyonları, melee alanlarında hünerlerini sınamaya hazır şekilde geldiler. Savaşçılar gelecek karşılaşmalar için çalışırken talim kılıçlarının zırhlara çarpma sesi yankılanıyor.\n\nBurada bir mızrak turnuvasının gösterişinden eser yok. Bu bir savaş olacak, festival değil."

 agot_melee.3.a:0 "Başlayalım."

 agot_melee.31.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.31.desc:0 "Diyarın dört bir yanından gelen savaşçılarla birlikte Büyük Melee'nin alanına varıyorum. Kimileri, kılıç sallamayı zar zor bilen toy delikanlılardan farksız; kimileri ise sayısız sefer ve muharebenin izlerini taşıyor. Hepsini birleştiren tek şey cesaret. Melee çemberi korkaklara göre değil, ama tek başına cesaret de zafer getirmez.\n\nDüşmanlarıma, benimle çembere adım attıkları güne pişman olacaklarını göstermeyi planlıyorum."

 agot_melee.31.a:0 "Şan için!"

 agot_melee.5.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.5.desc:0 "Ne yazık ki yeterince savaşçı çağrıya yanıt verme cesareti bulamadı ve [host_location.GetName] Büyük Melee'si iptal edilecek"

 agot_melee.5.a:0 "Gerçekten yazık."

 agot_melee.52.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.52.desc:0 "Ne yazık ki yeterince savaşçı çağrıma yanıt verme cesareti bulamadı ve [host_location.GetName] Büyük Melee'si, katılımcı eksikliği nedeniyle iptal edilmek zorunda"

 agot_melee.52.a:0 "Gerçekten yazık."

 agot_melee.53.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.53.desc:0 "Trajedi yaşandı. [dead_host.GetTitledFirstName]'in ölümüyle melee'nin iptal edilmesi gerekiyor."

 agot_melee.53.a:0 "Gerçekten, tanrılar zalim."

 agot_melee.54.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.54.desc:0 "Büyük Melee başlı başına bir savaş olmaya aday olsa da, savaşın vaktinden önce patlak vermesi öncelik taşımalı. Muhtemel rakipler görevlerince çağrılıyor ve [host_location.GetName] Büyük Melee'si başlayamadan sona eriyor."

 agot_melee.54.a:0 "Acı bir hayal kırıklığı."

 agot_melee.55.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.55.desc:0 "Melee başlı başına bir savaş olmaya aday olsa da, savaşın vaktinden önce patlak vermesi öncelik taşımalı. Diğer muhtemel rakiplerle birlikte ben de daha ciddi görevlerce çağrılıyorum ve [host_location.GetName] Büyük Melee'si başlayamadan sona eriyor."

 agot_melee.55.a:0 "Acı bir hayal kırıklığı."

 agot_melee.8.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.8.desc:0 "Çembere tam bir güvenle adım atmış olsam da, acı bir utançla melee'nin ilk turlarında elendim. Yalnızca bedenimde değil, gururumda da kesikler ve morluklarla oradan ayrılıyorum."

 agot_melee.8.a:0 "İzleyeceğim ve eğlenmeye çalışacağım."

 agot_melee.8.b:0 "Kalan dövüşleri izlemeye kendimi zorlayamam."

 agot_melee.9.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.9.desc:0 "Ön eleme turları üstatlara sürekli olarak düzeltilecek kırık kemikler ve sarılacak yaralar sağladı, ancak finaller çok daha azgın geçmeye aday. Yarışta kalan rakipler diyarın en ölümcül savaşçıları arasında ve turnuva kılıcı olsun ya da olmasın, şampiyon taçlanmadan daha fazla kan döküleceğine şüphe yok. Seyirciler bahislerini yatırıp rakipler övünürken melee alanı beklentiyle uğulduyor."

 agot_melee.9.a:0 "Şans cesurdan yanadır!"

 agot_melee.6.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.6.desc:0 "Melee'nin ön eleme turları bitti ve birçok iyi savaşçı yere serildi, ama ben yenilgisiz ayaktayım. Kalan rakipleri süzüyorum: kır saçlı gaziler, usta silah üstatları ve kendilerini kanıtlamaya can atan açgözlü genç lordlar — hepsi tehlikeli savaşçılar.\n\nGüm güm öten davul, finallerin başladığını haber veriyor. En zor dövüşler henüz gelmedi."

 agot_melee.6.a:0 "Her karşılaşmayı keskin bir gözle izliyorum."

 agot_melee.6.b:0 "Diğer karşılaşmaların yarattığı dikkat dağınıklığından kaçınarak, adımın okunmasını sabırla bekliyorum."

 agot_melee.10.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.10.desc:0 "İki zırhlı figür savaş alanında karşı karşıya geliyor. Tellal isimlerini duyuruyor — [fighter1.GetTitledFirstName] ve [fighter2.GetTitledFirstName] — ve dövüşçüler, açıklık kollayan avcılar gibi birbirlerinin çevresinde dönüyor. Karşılaşma başladı."

 agot_melee.10.a:0 "Hünerin daha hakiki bir sınavı olamaz."

 agot_melee.14.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.14.desc:0 "[host_location.GetName]'in melee alanı, parçalanan kalkanlara ve kırılan kılıçlara, öfke ve acı çığlıklarına tanık oldu ve payına düşen kanı içti. Nihayetinde [winner.GetTitledFirstName] tek başına ayakta kalarak kalabalığın hayranlığını topluyor. Eşi görülmemiş hüneriyle [winner.GetSheHe] şampiyon olarak taçlanıyor.\n\nKüçük halk [winner.GetHerHis] adını kolay kolay unutmayacak; [winner.GetHerHis] düşmanları da [winner.GetHerHis] elinden aldıkları yaraları unutmayacak."

 agot_melee.14.a:0 "Eve giden uzun yol seni bekliyor."

 agot_melee.15.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.15.desc:0 "Bedenim sızlıyor, zırhım göçmüş ve soluğum kesik kesik, ama melee alanında tüm rakiplerimi yenmiş olarak zaferle ayaktayım. Hangisinin daha tatmin edici olduğunu söylemek güç - kalabalığın tezahüratı mı, yoksa yenik düşen rakiplerimin sendeleyerek uzaklaşırken gözlerindeki mağlup ifade mi. [host.GetTitledFirstName] hak ettiğim ödülü bana takdim ettiğinde sevincim daha da artıyor. "

 agot_melee.15.a:0 "Bu gün hafızamda uzun süre yaşayacak."

 agot_melee.16.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.16.desc:0 "Final savaşı başlarken kılıç kalkana çarpıyor ve ne savaş ama! [winner.GetTitledFirstName] son darbeyi indirip [winner.GetHerHis] zaferini perçinlerken tribünler tezahüratlarla çınlıyor.\n\nBu Büyük Melee görkemli bir iş oldu ve [winner.GetTitledFirstName]'in adı kuşkusuz küçük halkın da soyluların da zihninde yankılanacak olsa da, benim adım da belki onların hafızasında kalacaktır."

 agot_melee.16.a:0 "Çağlara damga vuracak bir savaştı!"

 agot_melee.11.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.11.desc:0 "Tellal iki isim okuyor — [fighter1.GetTitledFirstName] ve [fighter2.GetTitledFirstName] — ve iki savaşçı savaş alanına adım atıyor. Hava gerilimle dolu, ama ilk darbe indiğinde gerilim eriyip yerini saf heyecana bırakıyor. Karşılaşma başladı."

 agot_melee.11.a:0 "Gösteri nefes kesiyor."

 agot_melee.12.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.12.desc:0 "[victor.GetTitledFirstName], [loser.GetTitledFirstName] karşısında zaferle duruyor. Küçük halkın haykırışları gök gürültüsü gibi ve soylular bile dayanamayıp tezahürat ediyor."

 agot_melee.12.a:0 "Ne dövüş!"

 agot_melee.13.t:0 "[host_location.GetName] Büyük Meleesi"

 agot_melee.13.desc:0 "[victor.GetTitledFirstName], [loser.GetTitledFirstName] karşısında zaferle duruyor. Küçük halkın haykırışları gök gürültüsü gibi ve soylular bile dayanamayıp tezahürat ediyor."

 agot_melee.13.a:0 "Ne dövüş!"

 agot_melee.2.t:0 "[host_location.GetName] Büyük Meleesi"
