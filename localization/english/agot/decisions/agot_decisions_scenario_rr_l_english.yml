l_english:

 agot_scenario_rr_ha_initialization_decision:0 "Harrenhal'ın Sonrası"

 agot_scenario_rr_ha_initialization_decision_desc:0 "Babam Kral II. Aerys'in saltanatı, Westeros'un lordları ve leydileri için — ve Yedi Krallık'ın tüm halkı için — bir kabusa dönüştü. Paranoya ve ateş takıntısıyla beslenen öngörülemez patlamaları, diyar ve Hanem için bir yüktür. Zulmü, Targaryen Hanesi'ni yıkımın eşiğine getirdi ve buna bir son verilmeli..."

 agot_scenario_rr_ha_initialization_decision_tooltip:0 "Taca sadık kalan diyarın önemli hanelerine kuzgunlar gönderecek ve onlardan bir savaş konseyi için harekete geçmelerini isteyeceksiniz."

 agot_scenario_rr_ha_initialization_decision_requirement:0 "Deli Kral, Demir Taht'ta oturuyor."

 agot_scenario_rr_ha_initialization_decision_confirm:0 "Kuzgunlar uçsun!"

 agot_scenario_rr_ha_tell_the_king_decision:0 "Krala Rhaegar'ın İhanetini Bildir"

 agot_scenario_rr_ha_tell_the_king_decision_desc:0 "Veliaht prens, babasını devirip zamanından önce tahtı ele geçirmeye çalışmakla kurnazlık yaptığını sanabilir. Ama Kral II. Aerys'in hâlâ sadık vassalleri var, ben de onlardanım. Krala derhal, bu aşağılık komployu kınayan bir haber göndermeliyim."

 agot_scenario_rr_ha_tell_the_king_decision_tooltip:0 "Rhaegar'ın darbe girişimini ifşa etmek için Kralın Şehri'ne bir kuzgun göndereceksiniz."

 agot_scenario_rr_ha_tell_the_king_decision_confirm:0 "Şeref ve görev için!"

 agot_scenario_rr_false_banner_decision:0 "Sahte Sancak Altında"

 agot_scenario_rr_false_banner_decision_desc:0 "Kral II. Aerys, isyan eden Lord Robert Baratheon'a karşı savaş yürütürken, ben tarafsız kaldım. Eski dostum Aerys, şüphesiz ordumu yardımına yürüterek onu destekleyeceğimden şüpheleniyor — özellikle de altın oğlum Jaime'yi yeminli kalkanı olarak rehin tuttuğu için. Ama ne yazık ki Deli Kral, Yedi Krallık'ı kargaşaya attı ve kendine sığınak olarak Kızıl Kale'den başka bir şey bırakmadı. Destek sancağı altında Kralın Şehri'ne yürüseydim, şehri kolayca yağmalayabilir ve bir delinin hükümranlığına son verebilirdim."

 agot_scenario_rr_false_banner_decision_tooltip:0 "Böyle bir aldatmaca büyük tehlike içerir, ama diyarın hatrına — ya da #bold mirasının#! hatrına — kurnazlığını sınayabilirsin."

 agot_scenario_rr_false_banner_decision_confirm:0 "Hazırlıklara başla!"
