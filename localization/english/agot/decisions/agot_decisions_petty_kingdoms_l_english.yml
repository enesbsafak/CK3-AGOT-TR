 agot_proclaim_pk_the_torrentine_desc:0 "Onurlu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Torrentine, Dorne'da büyük tarihsel ve stratejik öneme sahip bir bölgedir.\n\nEfsanevi şövalyeleriyle ünlü House [ROOT.Char.GetHouse.GetName], halkının şövalyeliğini ve savaşçı hünerini temsil eder. [ROOT.Char.GetLadyLord] olarak, toprakları yeniden birleştirmek ve Torrentine'i eski ihtişamına kavuşturmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

