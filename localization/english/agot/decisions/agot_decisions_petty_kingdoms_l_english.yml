 agot_proclaim_pk_godsgrace_desc:0 "Soylu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Tanrı Lütfu Krallığı, Dorne'un can damarının kalbinde yer alır.\n\nScourge ile Vaith'in birleştiği noktada konumlanan bu geçidin kontrolü, uzun zamandır Dorne'un savunma kilit taşı olarak hizmet etmiştir. [ROOT.Char.GetLadyLord] olarak, bu toprakları birleştirmek ve gerçek bir Yeşilkan Krallığı kurmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

