 agot_proclaim_pk_runestone:0 "Runestone Krallığı'nı İlan Et"

 agot_proclaim_pk_runestone_tooltip:0 "Bu karar, Runestone Krallığı'nı kurmanı sağlayacak"

 agot_proclaim_pk_runestone_desc:0 "İlk İnsanların kadim bir toprağı olan Runestone, House [ROOT.Char.GetHouse.GetName] sancağı altında birleştirildi.\n\nBir zamanlar Tunç Krallar tarafından yönetilen bu toprak, Vadi'de büyük tarihsel ve stratejik önem taşır. [ROOT.Char.GetLadyLord] olarak, vasallarını bir araya çağırıp yeni bir Tunç Krallar soyu başlatacak kişi sen olmalısın.\n\nBu meydan okumaya göğüs gerip şanı House [ROOT.Char.GetHouse.GetNameNoTooltip] için mi alacaksın?"

 agot_proclaim_pk_runestone_confirm:0 "Kuzgunları sal"

 raise_pirate_kingdom_decision:0 "Bir Korsan Krallığı İlan Et"

 raise_pirate_kingdom_decision_desc:0 "Kızkardeşler halkı, Kızkardeşler'in Tecavüzü ve bin yıllık Suyun Ötesindeki Savaş'tan önce bir zamanlar bağımsız korsan krallardı. Şimdi, kudretimiz yeniden büyüdü ve [ROOT.Char.GetLiege.GetNameNicknamedRegnal]'in boyunduruğunu kırmanın zamanı geldi!"

 raise_pirate_kingdom_decision_tooltip:0 "Bağımsızlığını ilan edecek ve Üç Kızkardeş'i hak ettikleri korsan krallığı konumuna yükselteceksin."

 raise_pirate_kingdom_decision_confirm:0 "Dalgalar ve Gökyüzü için!"

 agot_proclaim_pk_bear_island:0 "Ayı Adası Krallığı'nı İlan Et"

 agot_proclaim_pk_bear_island_tooltip:0 "Bu karar, Ayı Adası Krallığı'nı kurmanı sağlayacak"

 agot_proclaim_pk_bear_island_desc:0 "Ormanlık kıyıları soylu House [ROOT.Char.GetHouse.GetName] tarafından yönetilen Ayı Adası, uzun zamandır Demir Doğumluların Kuzey'e baskınlarına karşı bir siper olarak durdu.\n\nAzimli savaşçıları ve sarsılmaz sadakatiyle House [ROOT.Char.GetHouse.GetNameNoTooltip], halkının sadık bir koruyucusu olduğunu kanıtladı. Onların [ROOT.Char.GetLadyLord]'u olarak, bir sonraki adımı atıp adaya bir taç giydirmek senin görevin.\n\nBu meydan okumaya göğüs gerip şanı mı alacaksın?"

 agot_proclaim_pk_bear_island_confirm:0 "Kuzgunları sal"

 agot_proclaim_pk_the_stony_shore:0 "Taşlı Kıyı Krallığı'nı İlan Et"

 agot_proclaim_pk_the_stony_shore_tooltip:0 "Bu karar, Grataş Krallığı'nı kurmanı sağlayacak"

 agot_proclaim_pk_the_stony_shore_desc:0 "Soylu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Taşlı Kıyı Krallığı, Kuzey'de büyük stratejik öneme sahip bir bölgedir.\n\nSarp arazisi ve dirençli halkıyla tanınan Taşlı Kıyı, uzun zamandır Kuzeylilerin kalesi olmuştur. [ROOT.Char.GetLadyLord] olarak, toprakları birleştirmek ve Taşlı Kıyı'yı öne çıkarmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

 agot_proclaim_pk_the_stony_shore_confirm:0 "Kuzgunları sal"

