 agot_proclaim_pk_the_tor_tooltip:0 "Bu karar, Tor Krallığı'nı kurmanı sağlayacak"

 agot_proclaim_pk_the_tor_desc:0 "House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Tor, Dorne'da büyük tarihsel ve stratejik öneme sahip bir bölgedir.\n\nKadim soyları ve zengin kültürel miraslarıyla tanınan House [ROOT.Char.GetHouse.GetNameNoTooltip], Dornlu direncinin ve soyluluğunun bir simgesi olarak durur. Onların [ROOT.Char.GetLadyLord]'u olarak, toprakları birleştirmek ve Tor Krallığı'nı kurmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

