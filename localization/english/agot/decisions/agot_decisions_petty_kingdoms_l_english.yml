 agot_proclaim_pk_blackwood_vale_tooltip:0 "Bu karar, Karaağaç Vadisi Krallığı'nı kurmanı sağlayacak"

 agot_proclaim_pk_blackwood_vale_desc:0 "Soylu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Karaağaç, Nehir Toprakları'nda büyük tarihsel ve stratejik öneme sahip bir bölgedir.\n\nKadim soyları ve Eski Tanrılar'a olan azimli sadakatleriyle tanınan halkı, uzun zamandır direnç ve onurun simgesi olarak durmuştur. Onların [ROOT.Char.GetLadyLord]'u olarak, toprakları yeniden birleştirmek ve Karaağaç Vadisi'nde şanlı bir krallık kurmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

