 agot_proclaim_pk_great_wyk_desc:0 "Soylu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Büyük Wyk adası, Demir Adaları'nın en büyük ve en önemli adalarından biridir.\n\nAzimli bağımsızlıkları ve savaşçı hünerleriyle tanınan halkı, uzun zamandır Demir Doğumlu yaşam tarzının sadık savunucuları olmuştur. [ROOT.Char.GetLadyLord] olarak, toprakları yeniden birleştirmek ve adayı şana kavuşturacak bir krallık kurmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

 agot_proclaim_pk_great_wyk_confirm:0 "Kuzgunları sal"

