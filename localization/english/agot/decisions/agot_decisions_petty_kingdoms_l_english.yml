 agot_proclaim_pk_stone_and_sky_tooltip:0 "Bu karar, Taş ve Gökyüzü Krallığı'nı kurmanı sağlayacak"

 agot_proclaim_pk_stone_and_sky_desc:0 "House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Geniş Yol, Dorne'a giden en emin güzergâhtır.\n\nBir zamanlar Taş ve Gökyüzü Kralları tarafından yönetilen House [ROOT.Char.GetHouse.GetNameNoTooltip], böyle bir mirası sahiplenebilecek kadar kontrol sağlamıştır. Onların [ROOT.Char.GetLadyLord]'u olarak, bu adımı atıp uzun zamandır yitik olan bu tahta ihtişamını geri kazandırmak senin görevin.\n\nBu meydan okumaya göğüs gerip şanı House [ROOT.Char.GetHouse.GetNameNoTooltip] için mi alacaksın?"

