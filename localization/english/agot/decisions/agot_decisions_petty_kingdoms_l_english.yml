 agot_proclaim_pk_southstone_desc:0 "Soylu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Güneytaşı, Nehir Toprakları'nda büyük tarihsel ve stratejik öneme sahip bir bölgedir.\n\nTrident kıyısındaki verimli topraklarıyla tanınan House [ROOT.Char.GetHouse.GetNameNoTooltip], uzun zamandır direnç ve gücün simgesi olarak hüküm sürmüştür. Onların [ROOT.Char.GetLadyLord]'u olarak, toprakları yeniden birleştirmek ve Güneytaşı Krallığı'nı eski ihtişamına kavuşturmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip]'in onurunu mu geri alacaksın?"

