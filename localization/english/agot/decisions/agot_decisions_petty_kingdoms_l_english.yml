 agot_proclaim_pk_fair_isle_desc:0 "Soylu House [ROOT.Char.GetHouse.GetName] tarafından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten yönetilen Güzel Ada, Batı Toprakları için büyük ticari öneme sahip bir bölgedir.\n\nGüçlü donanması ve pitoresk kıyıları, House [ROOT.Char.GetHouse.GetNameNoTooltip]'i bölgenin hâkim gücü haline getirdi. [ROOT.Char.GetLadyLord] olarak, toprakları birleştirmek ve Güzel Ada Krallığı'nı kurmak senin görevin.\n\nBu meydan okumaya göğüs gerip House [ROOT.Char.GetHouse.GetNameNoTooltip] için şan mı alacaksın?"

