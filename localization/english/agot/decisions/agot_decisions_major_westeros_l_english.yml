l_english:

 agot_proclaim_iron_throne:0 "Demir Taht'ı İlan Et"

 agot_proclaim_iron_throne_tooltip:0 "Bu karar, krallığı Demir Taht altında birleştirmeni sağlayacak."

 agot_proclaim_iron_throne_desc:0 "Demir Taht, Westeros'ta uzun süre birlik ve gücün simgesi olarak durdu. Krallığın sayısız küçük tımarı artık sancaklarımızın altındayken, yenilgilerin kılıçlarını toplayıp tüm krallık için yeni bir Demir Taht dövmenin zamanı geldi.\n\nDemir Taht'a sahip çıkacak güce, kurnazlığa ve iradeye sahip miyim? House [ROOT.Char.GetHouse.GetName], Westeros'un tek gerçek hükümdarı olmak için gerekenlere sahip mi?"

 agot_proclaim_iron_throne_confirm:0 "Kuzgunları sal"

 set_capital_kingslanding_decision:0 "Kral Toprağı'nı Geri Al"

 set_capital_kingslanding_decision_tooltip:0 "Kral Toprağı'nı krallığının başkenti olarak yeniden kur."

 set_capital_kingslanding_decision_desc:0 "Kral Toprağı, Demir Taht'ın meşru başkentidir ve bu yüzden bana aittir."

 set_capital_kingslanding_decision_confirm:0 "Krallığın gerçek makamını yeniden kur!"

 end_the_ironborn_decision:0 "Demir Doğumlulara Son Ver"

 end_the_ironborn_decision_desc:0 "Yüzyıllardır melez köpekler olan Demir Doğumlular, Westeros'u ve ötesini yağmalayıp talan ederek geçti. Bu denizci haydutlara karşı harekete geçmemiz ve güçlerini kesin olarak ezmemiz artık kaçınılmaz hale geldi. Onlara karşı öyle yıkıcı bir savaş yürütmeliyiz ki bir daha asla bir Demir Kral, Deniztaşı Koltuk'ta oturmasın."

 end_the_ironborn_decision_confirm_text_desc:0 "Silahlara!"

 end_the_ironborn_decision_tooltip:0 "Demir Doğumlulara ölüm."

 regrow_oakenseat_decision:0 "Meşe Makamı'nı Yeniden Büyüt"

 regrow_oakenseat_decision_tooltip:0 "Meşe Makamı'nı yeniden büyütmesi için hünerli bir bahçıvan çağır."

 regrow_oakenseat_decision_desc:0 "Garth Yeşilel tarafından dikilen yaşayan bir taht olan Meşe Makamı, Kral X. Garth Gardener'ın hükümdarlığı sırasında bir Dornlu kral tarafından yok edildi ve artık bir efsaneden ibaret.\n\nKüçümsenecek bir iş olmasa da, Meşe Makamı'nı yeniden büyütmek Hanem'e Reach içinde — ve Yedi Krallık'ın tamamında — büyük şan, otorite ve nüfuz kazandırır."

 regrow_oakenseat_decision_confirm:0 "Tohumu ek"

 regrow_oakenseat_excellent_aptitude:0 "$court_gardener_court_position$'nizin #V Mükemmel#! bir yetenek düzeyine sahip olması gerekir"

 agot_major_decisions_events.1001.t:0 "Yeniden Büyüyen Meşe Makamı"

 agot_major_decisions_events.1001.desc:0 "Efsaneye göre [greenhand.GetFullNameNicknamed], orijinal yaşayan Meşe Makamı'nı kendi yeşil eliyle oymuştu ve [greenhand.GetHouse.GetName] kralları nesiller boyunca tam da o tahttan hüküm sürdü.\n\nYok edilişi, Highgarden'ın kökünü — ve yüreğini — söktü.\n\nSonunda, on yıllarca süren özenli büyütme, budama ve çoğaltmanın ardından, bir zamanlar gururlu olan Meşe Makamı yeniden büyütüldü. Yakın ve uzak herkes, şanlı makamımız için House [ROOT.Char.GetHouse.GetName]'in ihtişamını bilecek. Belki de ben, Garth Yeşilel'in kendisinin gerçek halefi olduğumu bile iddia edebilirim..."

 agot_major_decisions_events.1001.a:0 "Yeniden hayat bulan bir efsane!"

 ironborn_rebellion_decision:0 "Demir Taht'a Karşı Ayaklan"

 ironborn_rebellion_decision_desc:0 "Çok uzun zamandır yeşil toprakların adamları yataklarında rahatça uyuyor. Gerçekten de Harren Kara'nın ölümünden beri Westeros Demir Doğumlulardan korkmayı unuttu; yalnızca ara sıra demir bedelini ödetmek için karaya çıkan yağmacı çeteleri kaldı. Krallar birbiri ardına Demir Taht'a oturdu. Ama bizim de kendi tahtımız olduğunu, yüzyıllar boyunca kendi krallarımızın olduğunu unuttuk mu?\n\nBaşkaları unutmuş olabilir, ama ben unutmadım. Halkımızı bağlayan zincirleri kıracağım; ben Tuz ve Kaya Kralı olacağım. Andallar, Rhoynarlar ve İlk İnsanlar, Demir Doğumlulardan korkmanın ne demek olduğunu bir kez daha öğrenecek."

 ironborn_rebellion_decision_tooltip:0 "Ağla, ey Westeros, Adalar yeniden yükseliyor!"

 ironborn_rebellion_decision_confirm_text_desc:0 "Demir bedeli ödeyeceğiz!"

 defy_winter_lords_decision:0 "Kış Lordlarına Meydan Oku"

 defy_winter_lords_decision_desc:0 "Taş Doğumlular, Kuzeylilerin bizi Yabanıllardan beter gördüğü aşağılamalardan başka bir şey bilmiyor. Skagos bir zamanlar Kış Lordları'ndan özgür ve bağımsızdı; yeniden öyle olacak. Kudretimiz [ROOT.Char.GetLiege.GetNameNicknamedRegnal]'i titretecek!"

 defy_winter_lords_decision_tooltip:0 "Bağımsızlığını ilan edecek ve Skagosluları bir kez daha denizlere döndüreceksin."

 defy_winter_lords_decision_confirm_text_desc:0 "Kuzey, Skagos'tan korkmayı hatırlayacak!"

 agot_minor_decisions_events.0001:0 "Kış Lordlarına Meydan Oku"

 agot_minor_decisions_events.0001.desc:0 "Pek çok Taş Doğumlu, Skagos'un özgürlüğünü yeniden kazandığı günün hayalini kurdu. Kral Brandon Stark gücümüzü kırdığında bize denizi yasakladı. Şimdi, gemilerimiz yaklaştığında Kuzey titreyecek!"

 agot_minor_decisions_events.0001.a:0 "Artık #bold bağlılık yemini etmeyeceğiz#!."

 agot_minor_decisions_events.0001.a_tt:0 "Kuzey bu sadakatsizlik karşısında savaşmadan durmayacaktır elbette. Savaşa hazır mısın?"

 agot_minor_decisions_events.0002:0 "Bağımsız Bir Skagos"

 agot_minor_decisions_events.0002.desc:0 "Taş Doğumlular bir kez daha kendi kendilerini yönetiyor! Fok Koyu sancaklarımızı tanıyacak.\n\nMirasımı taşa kazıdım ve tüm Taş Doğumlular adımı hatırlayacak."

 agot_minor_decisions_events.0002.a:0 "Mirasım zamanın sınavına dayanacak."

 agot_minor_decisions_events.0002.a_tt:0 "Skagos bağımsızlığını kazanır."

 agot_adopt_kneeler_ways_decision:0 "Güneyli Geleneklere Uy"

 agot_adopt_kneeler_ways_decision_desc:0 "Uzak Kuzey'in acımasız çorak topraklarındaki yaşam bizi, Duvar'ın öte yakasındakilerden çok farklı, acımasız ve boyun eğmez bir halk yaptı. Artık aramızda yaşamımızı kurduğumuza göre, belki de onların yaşam tarzına, yasalarına ve geleneklerine uyum sağlamak akıllıca olur."

 agot_adopt_kneeler_ways_decision_confirm:0 "Dizlerimizi gevşetme zamanı"

 agot_adopt_kneeler_ways_decision_tooltip:0 "Halkın, Demir Taht'ın tebaasının yaşam tarzını benimseyecek. Bu, Duvar'ın güneyindeki hükümdarlarla daha fazla etkileşim sağlayacak; ama özgür halk olmanın faydalarına mal olacak."

 is_culture_head:0 "Kültürünün başındasın"

 hybridized_with_kneelers:0 "Kültürün, Duvar'ın güneyinde var olan bir kültürle melezleşti"

 capital_south_of_the_wall:0 "Başkentin Duvar'ın güneyinde"

 agot_major_decisions_events.1003.t:0 "Öte Yakada..."

 agot_major_decisions_events.1003.desc:0 "Duvar'ın yanlış yakasındaki yaşamın zor gerçeklerinden kaçma hayalimiz, nesillerdir süren, artık gerçekleşti. Orada olduğumuz gibi inatla devam etmek ve yeni komşularımızın yasalarını ve geleneklerini görmezden gelmek bir kibir gösterisi olmaz mıydı? Duvar'ın güneyindeki halk çekingen ve yumuşak olabilir; ama hayatları uzun ve rahat. Bu hoş topraklardan en iyi şekilde faydalanmayı açıkça biliyorlar ve yasaları buna yardımcı oluyorsa, biz de onları benimsemeliyiz."

 agot_major_decisions_events.1003.a:0 "Yeni, daha yumuşak bir geleceğe!"

 every_freefolk_ruler_tt:0 "Her Özgür Halk Reisi"
