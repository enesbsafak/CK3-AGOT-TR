 agot_appoint_dragonkeeper_head_effect_tooltip:0 "Ejderha ini olanağı finansmanına göre yeni bir Baş Ejderha Bakıcısı belirlenecek."

 agot_restore_dragonstone_dragonkeepers:0 "Dragonmont Ejderha Bakıcılarını Yeniden Kur"

 agot_restore_dragonstone_dragonkeepers_desc:0 "Yıllarca boş kaldıktan sonra [GetBuilding('agot_dragonmont_01').GetName], onu korumak için yeniden bir [dragonkeepers|e] tarikatı gerektiriyor."

 agot_restore_dragonmont_dragonkeepers_effect_tooltip:0 "[GetTitleByKey('c_dragonstone').GetNameNoTier]'te yeni bir [GetCourtPositionType('head_dragonkeeper_court_position').GetName()] ve ejderha bakıcıları tarikatı kurulacak."

 conduct_terror_campaign:0 "Terör Kampanyası Yürüt"

 conduct_terror_campaign_desc:0 "Büyük bir ejderhanın binicisi olarak, onun savaşta nasıl kullanılacağına karar vermek bana düşer. Tarih boyunca kullanımları çoğunlukla düşman ordularıyla sınırlı kalmış olsa da, onu düşmanlarımın sivil halkını yerle bir etmek için kullanmamı engelleyen hiçbir şey yok."

 conduct_terror_campaign_effect:0 "Savaştayken çevrendeki tüm eyaletlere zarar veren bir ejderha terörü harekâtı başlatacaksın.\n\n#X @warning_icon! Bu tür bir yıkım hem düşmanlarının hem de daha vicdanlı müttefiklerinin aşırı öfkesine yol açacak.#!"

 conduct_terror_campaign_tooltip:0 "#X @warning_icon! Bu tür bir yıkım hem düşmanlarının hem de daha vicdanlı müttefiklerinin aşırı öfkesine yol açacak.#!"

 conduct_terror_campaign_dragon_condition:0 "Ejderhanın en az 100 [dragon_combat_effectiveness|E] var"

 conduct_terror_campaign_confirm:0 "Hepsini yakın!"

 stop_terror_campaign:0 "Terör Kampanyasını Bitir"

 stop_terror_campaign_show_condition:0 "Bir terör harekâtı yürütüyorsun"

 stop_terror_campaign_desc:0 "Şu anda bir ejderha terörü harekâtı yürütüyorum. Benim ya da ejderhamın içinde bulunduğu ordular, çevredeki topraklara yıkım yağdırmak için bir üs olarak kullanılacak. Kuşkusuz etkili olsa da, bu tür taktikler onurlu savaş kurallarının tüm teamüllerine aykırıdır."

 stop_terror_campaign_tooltip:0 "Terör harekâtını sona erdireceksin"

 stop_terror_campaign_confirm:0 "Yıkıma son ver"

 ride_dragon_decision:0 "[ROOT.Var('current_dragon').Char.GetFirstNameNoTooltip]'e Bin"

 ride_dragon_decision_desc:0 "[ROOT.Var('current_dragon').Char.GetFirstName] ile birlikte sadece binmenin üzerinden çok uzun zaman geçti. Rüzgârın üzerimden geçişini ve açık gökyüzünün özgürlüğünü hissetmeyi özlüyorum."

 ride_dragon_decision_tooltip:0 "Ejderhana bin"

 ride_dragon_decision_confirm:0 "Ejderhana bin"

 ride_dragon_effect_tooltip:0 "Biraz [stress|E] kaybedecek ve ejderhanla arandaki bağı güçlendirebilirsin."

 use_dragon_decision:0 "[ROOT.Var('current_dragon').Char.GetFirstNameNoTooltip]'i Savaşta Kullan"

 use_dragon_decision_desc:0 "Bir ejderham var; kitle imha silahı. Askerlerimle çamurda yürümek zorunda değilim; savaş alanının üzerinde uçup düşmanlarımın üzerine ateş yağdırabilirim."

 use_dragon_decision_tooltip:0 "Savaştayken ejderhanı bir kez daha kullanmayı seçebilirsin"

 use_dragon_decision_confirm:0 "Ejderhanı kullan"

 use_dragon_decision_effect:0 "[dragon|E] ordulara katılabilecek ve onunla birlikte savaşacaksın"

 dont_use_dragon_decision:0 "[ROOT.Var('current_dragon').Char.GetFirstNameNoTooltip]'i Savaşta Kullanma"

 dont_use_dragon_decision_desc:0 "Güçlü olsa da, emrindeki her kaynağı kullanmak her zaman akıllıca değildir. Güvenlik, gurur ya da başka bir nedenle, ejderhamı savaşta kullanmamayı seçebilirim."

 dont_use_dragon_decision_tooltip:0 "Güçlü bir varlık olsa da, ejderhanı savaşta kullanmamayı seçebilirsin"

 dont_use_dragon_decision_confirm:0 "Ejderhanı kullanma"

 dont_use_dragon_decision_effect:0 "[dragon|E] ordulara katılmayacak ve onsuz savaşacaksın"

