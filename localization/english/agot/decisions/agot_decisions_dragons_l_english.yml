 call_for_dragonseeds_decision_confirm:0 "Müjdeciyi gönder"

 call_for_dragonseeds_decision_tooltip:0 "Ejderha tohumları sarayına katılmak üzere çağrılır"

 drink_wildfire_decision:0 "Yaban Ateşi İç"

 drink_wildfire_decision_desc:0 "Simyagerler Loncası maddeyi ilk ürettiğinden beri, insanı ejderhaya dönüştürme gücüne sahip olduğu söylenir."

 drink_wildfire_decision_confirm:0 "Kadehim getirin!"

