 show_me_dragons_decision_effect_tooltip:0 "Sana yaşayan tüm ejderhaların bir listesi getirilecek"

 become_dragonrider_house_decision:0 "Ejderha Binicisi Hanesi Ol"

 become_dragonrider_house_decision_desc:0 "Bu dünyada ejderha binicisi olmaktan daha itibarlı çok az şey vardır. Canavarımın tehdidi çoğu zaman düşmanlarımı diz çöktürmeye yeter.\n\nBir ejderha beni kabul etti, ateşli kan damarlarımda akıyor. Varislarımın benim gibi göklere yükselip hükmetmesini sağlamak için atılacak yalnızca son bir adım kaldı."

 become_dragonrider_house_decision_living_house_member_count_tt:0 "[house|E]'nüzün yaşayan en az 5 üyesi ejderha binicisi"

 become_dragonrider_house_decision_confirm:0 "Göklere!"

 become_dragonrider_house_decision_tooltip:0 "Hanedanının ejderhalarla bağını teyit et"

 call_for_dragonseeds_decision:0 "Ejderha Tohumlarını Davet Et"

 call_for_dragonseeds_decision_desc:0 "Bir ejderhaya sahip çıkma yeteneği kanda bulunur, isimde değil. Ejderhanın kanını taşıyan ama hiçbir büyük hanedanın adını taşımayan kişiler olabilir. Çağırırsam bazıları yanıt verebilir. Riskler büyük olurdu; ama hepsi bağlılık yemini ettiği sürece ödül, hanedanımın güçlenmesi olabilir."

 call_for_dragonseeds_decision_unclaimed_dragons_tt:0 "Ejderha inlerinde ehlileştirilebilecek en az bir [owned_dragon|E] var"

