 agot_appoint_dragonkeeper_head_desc:0 "Baş Ejderha Bakıcısı makamı boşaldı. [dragonpit|e]'imizi koruyup sürdürmek için yeni birini atamalıyız."

 agot_appoint_dragonkeeper_head_dragonmount_desc:0 "Baş Ejderha Bakıcısı makamı boşaldı. Dragonmont'u korunaklı ve bakımlı tutmak için yeni birini atamalıyız."

