l_english:

 restore_the_nights_watch:0 "Gece Nöbetçilerini Yeniden Kur"

 restore_the_nights_watch_desc:0 "Yok edildiklerinden beri surlarımız ve halkımız, uzak kuzeyde pusuya yatmış vahşilerin ve diğer tanrıtanımaz yaratıkların tehdidi altındaydı. Kuzeyde düzenin yeniden tesis edilmesi ve kadınlarımızın ile çocuklarımızın gece rahatça uyuyabilmesi için Gece Nöbetçileri'ni geri getirmeliyiz."

 restore_the_nights_watch_tooltip:0 "Kuzeyde düzenin yeniden tesis edilmesi ve kadınlarımızın ile çocuklarımızın gece rahatça uyuyabilmesi için Gece Nöbetçileri'ni geri getirmeliyiz."

 restore_the_nights_watch.tooltip.1:0 "Duvar'ı tutup yönetmek üzere yeni bir Yüce Kumandan bulunacak."

 restore_the_nights_watch.tooltip.2:0 "#N Duvar'ı çevreleyen toprakları kaybedeceksin! #!"

 restore_the_nights_watch_confirm:0 "Krallık için!"

 dissolve_the_nights_watch:0 "Gece Nöbetçilerini Feshet"

 dissolve_the_nights_watch_desc:0 "Halkımız, Gece Nöbetçileri ve onların Duvar'ı tarafından çok uzun süredir tehdit ediliyor! Duvar'ın kontrolünü ele geçirdikten sonra, siyah kardeşliğe nihayet son vermenin ve binlerce yıldır elimizden çalınan özgürlüğü ve barışı halkımıza geri vermenin zamanı geldi."

 dissolve_the_nights_watch_tooltip:0 "Gece Nöbetçileri'nin hükümranlığı sona erecek."

 dissolve_the_nights_watch_confirm:0 "Halk için!"

 rebuild_nights_watch_fort:0 "Duvar'da Bir Kale Yeniden İnşa Et"

 rebuild_nights_watch_fort_desc:0 "Yüzyıllardır Gece Nöbetçileri'nin kadim tarikatı çöküşe sürükleniyor. Bu da Duvar boyunca sıralanan sayısız kalenin zamanın tahribatına boyun eğmesine yol açtı. Nöbet'in maliyesindeki son düzelme sayesinde, çoğu kişi kaybedilenleri yeniden inşa etmenin zamanının geldiğine inanıyor."

 rebuild_nights_watch_fort_tooltip:0 "Duvar boyunca bir kale yeniden inşa et."

 rebuild_nights_watch_fort_confirm:0 "Baş İnşacı'yı huzuruma getirin!"

 desert_the_nw:0 "$game_concept_agot_desert_nw$"

 desert_the_nw_desc:0 "Duvar çok şey aldı, az şey verdi. Gece Nöbetçileri'nden kaçmak, yeminlerimi, kardeşlerimi ve görevin güvenliğini terk etmektir; ama özgürlük Duvar'ın ötesinde, onu sahiplenmeye cüret edersem."

 desert_the_nw_tooltip:0 "[nw_govt|E]'ten kaçacaksın"

 desert_the_nw_confirm:0 "Nöbet'ten Kaç"

 reclaim_brandons_gift_decision:0 "Brandon'ın Armağanı'nı Geri Al"

 reclaim_brandons_gift_decision_desc:0 "Brandon'un Armağanı toprakları bir zamanlar Gece Nöbetçileri'ne değil, Kuzey'e bağlılık yemini etmişti. Haklarımız olan toprakları geri almanın ve Nöbet'in kötü yönettiği toprakları geliştirecek yeni lordlar yetiştirmenin zamanı geldi."

 reclaim_brandons_gift_decision_tooltip:0 "Brandon'ın Armağanı'nı Geri Al"

 reclaim_gift_decision.requirements:0 "Şunlardan biri geçerli olmalı:\n$EFFECT_LIST_BULLET$Gece Nöbetçileri ile ittifak halindesin\n$EFFECT_LIST_BULLET$[GetPerk('diplomat_perk').GetName( GetNullCharacter )] yeteneğine sahipsin\n$EFFECT_LIST_BULLET$Gece Nöbetçileri'nin Yüce Kumandanı'nın sana görüşü 100"

 reclaim_brandons_gift_decision_confirm:0 "$reclaim_brandons_gift_decision_tooltip$"

 reclaim_gift_decision:0 "Yeni Armağan'ı Geri Al"

 reclaim_gift_decision_desc:0 "Yeni Armağan toprakları bir zamanlar Gece Nöbetçileri'ne değil, Kuzey'e bağlılık yemini etmişti. Haklarımız olan toprakları geri almanın ve Nöbet'in kötü yönettiği toprakları geliştirecek yeni lordlar yetiştirmenin zamanı geldi."

 reclaim_gift_decision_tooltip:0 "Yeni Armağan'ı Geri Al"

 reclaim_gift_decision_confirm:0 "$reclaim_gift_decision_tooltip$"

 reclaim_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.GetName]'e, [GetTitleByKey('d_new_gift').GetNameNoTier]'in Kuzey'e iadesiyle ilgili bir öneri gönderilecek."

 reclaim_brandons_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.GetName]'e, [GetTitleByKey('d_brandons_gift').GetNameNoTier]'in Kuzey'e iadesiyle ilgili bir öneri gönderilecek."

 reclaim_gift_decision_desc_use_hook_tt:0 "[top_liege|E] üzerindeki [hook|e]'in kullanılacak."

 agot_nights_watch.3000.t:0 "Yeni Armağan"

 agot_nights_watch.3000.desc:0 "[winterfell_petitioner.GetName], büyük bir altın karşılığında Yeni Armağan'ı Kuzey'e geri vermemizi istedi. Bu topraklarda dört yeni lord yetiştirilecek, ama onlar Kuzey'e bağlı olacak; böylece Gece Nöbetçileri'nin bu topraklar üzerindeki hâkimiyeti nesiller sonra ilk kez sona erecek."

 agot_nights_watch.3000.desc_brandons_gift:0 "[winterfell_petitioner.GetName], büyük bir altın karşılığında Brandon'un Armağanı'nı Kuzey'e geri vermemizi istedi. Bu topraklarda üç yeni lord yetiştirilecek, ama onlar Kuzey'e bağlı olacak; böylece Gece Nöbetçileri'nin bu topraklar üzerindeki hâkimiyeti nesiller sonra ilk kez sona erecek."

 agot_nights_watch.3000.a:0 "Kabul ediyorum, Kuzey topraklarını geri alabilir."

 agot_nights_watch.3000.b:0 "Reddediyorum. Toprak, Gece Nöbetçileri'nin mülküdür."

 agot_nights_watch.3001.t:0 "Armağan: Talep Kabul Edildi"

 agot_nights_watch.3001.desc:0 "[nw_lc.GetName], Armağan'ı Kuzey'in hâkimiyetine geri vermeyi kabul etti.\n\nŞimdi bölgedeki kontluklara yerleşecek yeni lordları atamanın zamanı."

 agot_nights_watch.3001.a:0 "Yeni lordları bizzat ben seçeceğim."

 agot_nights_watch.3001.b:0 "Toprakları herkese devret."

 agot_nights_watch.3003.t:0 "Yeni Armağan'ın Yeni Lordları"

 agot_nights_watch.3003.desc:0 "[new_gift_county_to_give_away.GetNameNoTier]'e bir lord seçmenin zamanı geldi."

 agot_nights_watch.3003.a:0 "Bu kişi olur."

 agot_nights_watch.3003.b:0 "Aslında, unvanı rastgele birine ver."

 nw_proposal_rejected:0 "Öneri Reddedildi"

 agot_nights_watch.3004.t:0 "Armağanlar Geri Alındı"

 agot_nights_watch.3004.desc:0 "Yeni Armağan, yıllarca Gece Nöbetçileri'nin yönetiminde kaldıktan sonra Kuzey'in hâkimiyetine geri döndü. [winterfell_petitioner.GetName] topraklara yerleşmek üzere şu lordları yetiştirdi:\n\n$BULLET$[GetTitleByKey('c_norlinton').GetNameNoTier] lordu [norlinton_holder.GetFirstName] [norlinton_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_boreharrow').GetNameNoTier] lordu [boreharrow_holder.GetFirstName] [boreharrow_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_whitecross').GetNameNoTier] lordu [whitecross_holder.GetFirstName] [whitecross_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_giantsbeard').GetNameNoTier] lordu [giantsbeard_holder.GetFirstName] [giantsbeard_holder.GetHouse.GetName]"

 agot_nights_watch.3004.desc_brandons_gift:0 "Brandon'un Armağanı, yıllarca Gece Nöbetçileri'nin yönetiminde kaldıktan sonra Kuzey'in hâkimiyetine geri döndü. [winterfell_petitioner.GetName] topraklara yerleşmek üzere şu lordları yetiştirdi:\n\n$BULLET$[GetTitleByKey('c_weatherback_ridge').GetNameNoTier] lordu [weatherback_ridge_holder.GetFirstName] [weatherback_ridge_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_moles_town').GetNameNoTier] lordu [moles_town_holder.GetFirstName] [moles_town_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_hoarburn').GetNameNoTier] lordu [hoarburn_holder.GetFirstName] [hoarburn_holder.GetHouse.GetName]"

 agot_nights_watch.3004.a:0 "Yaptıklarım gelecek nesiller boyunca Kuzey'e fayda sağlayacak."

 agot_nights_watch.holding_conversion_tt:0 "[new_gift_county_to_give_away.GetNameNoTier] bir [castle_holding|E]'e dönüştürülecek"

 agot_nights_watch.new_capital_tt:0 "[new_capital.GetName], [new_gift_county_to_give_away.GetNameNoTier]'in başkenti olacak."

 donate_land_to_nw_decision_desc:0 "Gece Nöbetçileri'nin tarihi topraklarının bir kısmını elimizde tutuyoruz. Belki toprakları onlara geri vermek konumlarını güçlendirebilir."

