 agot_nights_watch.3005.t:0 "Toprak İade Edildi"

 agot_nights_watch.3005.desc:0 "Kuzey Yeni Armağan'ı geri almış olsa da, şimdi cömertçe onu Gece Nöbetçileri'nin kontrolüne geri verdi.\n\n[GetTitleByKey('c_norlinton').GetNameNoTier], [GetTitleByKey('c_boreharrow').GetNameNoTier], [GetTitleByKey('c_whitecross').GetNameNoTier] ve [GetTitleByKey('c_giantsbeard').GetNameNoTier] artık yeniden Gece Nöbetçileri'nin mülkü!"

 agot_nights_watch.3005.desc_brandons_gift:0 "Kuzey Brandon'un Armağanı'nı geri almış olsa da, şimdi cömertçe onu Gece Nöbetçileri'nin kontrolüne geri verdi.\n\n[GetTitleByKey('c_weatherback_ridge').GetNameNoTier], [GetTitleByKey('c_moles_town').GetNameNoTier] ve [GetTitleByKey('c_hoarburn').GetNameNoTier] artık yeniden Gece Nöbetçileri'nin mülkü!"

 agot_nights_watch.3005.a:0 "Bu cömertliği israf edemeyiz."
