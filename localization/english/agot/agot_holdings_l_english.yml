 unknown_holding:0 "Bilinmiyor"

 unknown_holding_concept_key:0 "[unknown_holding|E]"

 unknown_generic:0 "Dünya geniştir ve çoğu, kendi köşelerine bağlı olanların anlayışının veya ilgisinin ötesindedir. Haritalar uzak kıyıları ve fısıltıyla anılan diyarları gösterse de, bu yerler lordların ve kralların erişiminden çok uzakta; bilinen diyarları şekillendiren işlerden ise daha da uzaktadır. Ötesinde ne olduğunu bilmek bize düşmez. Odak, yakında olana, yönetilip kaydedilebilene kalır. Geri kalan her şey, şimdilik, önemin sınırlarının ötesinde, dokunulmamış ve aldırılmamış haldedir."

 wilderness_holding:0 "Vahşi Doğa"

 wilderness_holding_concept_key:0 "[wilderness_holding|E]"

 wilderness_generic:0 "Dünyanın dört bir yanında, donmuş tundralardan bunaltıcı ormanlara, uçsuz bucaksız otlaklardan derin ve gölgeli ormanlara dek sayısız sahipsiz toprak uzanır. Bazıları bir zamanlar büyük diyarların parçasıydı; yüzyıllarca ihmal edildikten sonra doğanın pençesiyle geri kazanıldı. Bazıları ise o kadar sert ve acımasız ki, hiçbir hükümdar onları gerçekten sahiplenemedi. Çoğu gizli tehlikeler, tuhaf yaratıklar veya çoktan unutulmuş sırlar barındırıyor.\n\nBir vahşi doğa eyaletini sahiplenmek ve yerleşimi başlatmak için, toprak görünümüne gidin ve "Koloni Kur" seçeneğini seçin. Bir yerleşim baronluğuna sahip olduğunuzda, kalkınmayı başlatmak için ana yerleşim binasını yükseltebilirsiniz."

