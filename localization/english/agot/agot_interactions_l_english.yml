 agot_dragon.0004.desc:0 "Gecenin erken saatlerinde iki yabancı muhafız tarafından uyandırıldım. Olacakları karanlık anlarımda elbette düşünmüştüm. Ama hiçbir zihinsel canlandırma beni bununla yüzleşmeye hazırlayamazdı. [actor.GetShortUINamePossessive] ejderhasının önünde yürütülürken, dingin ve kusursuz bir berraklık anı yaşıyorum. Eylemlerimizi, kararlarımızı ve bunların dünyayı nasıl etkilediğini düşünerek ne kadar uzun zaman harcıyoruz. Ama hepsi bir yalan. Ben bir et, sinir ve kemik torbasından başka bir şey değilim. Şu anda avcının aç bakışıyla gözlerimin içine bakan bu varlık, işte bu onların dünyası; biz sadece içinde yaşıyoruz.\n\nYa da, şey, yaşıyorduk."

