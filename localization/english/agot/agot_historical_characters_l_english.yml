l_english:

 historical_character.dunk:0 "Uzun Ser Duncan, önce 'Beklenmedik' V. Aegon olarak tanınacak olan Prens Aegon Targaryen ile yaptığı sayısız yolculukla ünlenen bir çit şövalyesiydi. Aegon kral olduğunda, Duncan Kral Muhafızı'nın Komutan Efendisi konumuna yükseldi. Komutan Efendi olarak başarıları arasında, fırtına lordunun isyanını sona erdiren bir düelloda 'Gülen Fırtına' Lyonel Baratheon'u yenmesi ve Üçüncü Blackfyre İsyanı sırasında teke tek çarpışmada III. Daemon Blackfyre'ı öldürmesi yer alır."

 historical_character.nettles:0 "Nettles, Ejderhaların Dansı olarak bilinen Targaryen iç savaşı sırasında bir ejderha tohumuydu. Koyun Hırsızı ejderhasını, canavara istikrarlı bir yiyecek akışıyla yavaşça güvenini kazanarak sahiplendi. Bir ejderha binicisi olduktan sonra Boğaz Muharebesi'nde Siyahların safında savaşa uçtu, Kralın Şehri'nin ele geçirilmesine yardım etti ve Nehir Toprakları seferinde Prens Daemon Targaryen'a yardımda bulundu. Kraliçe Rhaenyra Targaryen'ın gönderdiği idam emrinden kaçtıktan bir süre sonra Vadi'de ortadan kayboldu."

 historical_character.tormund:0 "Devkıran 'Tormund', Ruddy Hall'dan ünlü bir yabanıl akıncısıydı. Mance Rayder'ın özgür halk ordusuna katıldı ve Duvar'ın altındaki savaşta çarpıştı. Mance esir alındığında, Duvar'ın öteki yakasında kalan özgür halkın birçoğunun lideri oldu; Ak Gezenler kendisi ve halkına yaklaşınca, en sonunda Komutan Efendi Jon Snow'un güneye taşınma koşullarını kabul etti."

 historical_character.davos:0 "Soğan Şövalyesi 'Davos Seaworth', Pire Dibi'nde doğmuş bir kaçakçıydı. Robert'ın İsyanı sırasında Fırtına Burnu'nun acımasız kuşatmasında, hayati erzakları Redwyne ablukasını geçirerek Stannis Baratheon'a ulaştırdıktan sonra hizmetinden ötürü şövalye ilan edildi, ancak geçmiş suçları için de cezalandırıldı. Stannis, sol elinin her parmağının ilk boğumunu aldı; ama bu süreçte ona toprak ve bir amaç verdi. Beş Kralın Savaşı boyunca ve sonrasında Stannis'e sadakatle hizmet etti."

 historical_character.smilingknight:0 "Gülen Şövalye 'Jack', Kral Ormanı Kardeşliği'nin tehlikeli bir üyesiydi. Deli ve zorlu bir haydut şövalye olarak Kardeşlik ile birlikte Kral Ormanı'nı terörize etti; yerel küçük halkın yardımıyla yakalanmaktan kaçtı ve çoğunlukla soyluları soyarak kaçırdı. Gülen Şövalye, aralarında Barristan Selmy ve Jaime Lannister'in de bulunduğu birçok ünlü Kral Muhafızı ve kılıç ustasıyla çatıştı; sonunda kendisini büyük kılıcı Şafak ile öldüren Ser Arthur Dayne ile karşı karşıya geldi."

 historical_character.illyrio:0 "Illyrio Mopatis, kariyerine Pentos sokaklarında çalışan az bilinen bir Bravo olarak başladı. 'Örümcek' Varys ile beklenmedik bir dostluk kurduktan sonra güçlü bağlantılar edindi ve sonunda bir magister oldu. Daha sonra Dilenci Kral Viserys ile kız kardeşi Daenerys'i koruyup kolladı ve Daenerys'in Khal Drogo ile evliliğinin ayarlanmasına yardım etti."

 historical_character.uthor:0 "Yaprakgölge 'Uthor', profesyonel bir turnuva şövalyesiydi; günlerini küçük turnuvadan küçük turnuvaya at sürerek, şöhretten kaçınarak ve dikkatli bahisler ile yenilen şövalyelerin sağladığı fidyelerle servetini kurarak geçirdi. Daemon II Blackfyre'ın ikinci bir Blackfyre isyanı başlatma girişiminin yarıda kaldığı Whitewalls Turnuvası'nda hazır bulundu. Uthor komplonun bir üyesi değildi ve zarar görmeden kurtuldu."

 historical_character.rattleshirt:0 "Çıngırakgömlek'in öz adı bilinmemekle birlikte, Kemiklerin Efendisi olarak büyük ün kazanmıştır. Mance Rayder'ın ordusuna katıldı ve Jon Snow ile 'Yarı El' Qhorin'i keşif görevlerinde yakalayan grubun üyesiydi. Çıngırakgömlek, Duvar'ın altındaki savaşta Stannis Baratheon tarafından esir alındı ve Kızıl Rahibe Melisandre tarafından Mance Rayder'ın yerine öldürüldü."

 historical_character.thoros:0 "Myr'lı Thoros, sekiz kardeşin en küçüğüydü ve küçük bir çocukken Kızıl Rahipler'e verildi. Yeminlerini edip, güçlü kusurları olsa da tam teşekküllü bir din adamı olduktan sonra, Westeros Kralı'nı kızıl tanrının dinine döndürmekle görevlendirildi. Ne Kral II. Aerys Targaryen'ı ne de Robert Baratheon'u inancına döndürmeyi başaramadıysa da, ikincisinin içki arkadaşı oldu. En sonunda, daha sonra Sancaksız Kardeşlik'e dönüşen Beric Dondarrion'ın grubunun bir üyesi olarak Ned Stark tarafından Gregor Clegane'i adalete teslim etmeye gönderildi."

 historical_character.varys:0 "Varys'in kökeni ne olursa olsun, Pentos sokaklarında çok zorlandığını ve daha yetişkinliğe erişmeden bir kan ritüelinde kullanılmak üzere satıldığını biliyoruz. Zor bir hayat yaşadı; ta ki Illyrio Mopatis adlı genç bir Bravo ile şans eseri karşılaşana dek. Illyrio'da bir dost buldu ve işbirlikleri ikisine de yeni ufuklar açtı. Kral II. Aerys Targaryen, Varys'ten haberdar olup onu Fısıltıların Efendisi olarak işe aldı. Saltanatının sonundaki çalkantılı günlerde krala danışmanlık ve hizmet etti; eski efendisi Kralın Şehri kuşatmasında düştüğünde ise yeni taç giyen Robert Baratheon'a hizmet etmeye devam etti."

 historical_character.jenny:0 "Eski Taşlar'ın Jenny'si, hakkında yazılan birçok şarkıyla bilinir — özellikle de #italic Jenny'nin Şarkısı#! — Yusufçuklar Prensi Duncan Targaryen'in soylu olmayan karısıydı. Saçlarında sık sık çiçekler taşıyan Jenny'nin, çoktan ölmüş İlk İnsan krallarının soyundan geldiğini iddia eden tuhaf ama güzel bir kız olduğu söylenir. Prens Duncan, 239 A.C.'de Nehir Toprakları'nda seyahat ederken onunla tanışıp aşık olmuştur. Babası Kral V. Aegon, Fırtına Burnu Efendisi Lyonel Baratheon ile kırılgan bir ittifakı korumak için evliliği iptal ettirmeye çalışsa da, Prens Duncan barışı sürdürmek için sonunda onun uğruna Demir Taht üzerindeki haklarından vazgeçmiştir."
