 friend_jarryn_robert:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], kanı aşan bir babalık sevgisi bağıyla bağlıdır. [CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName]'i [GetScriptedCharacterByHistoryID('Stark_3').GetShortUIName] ile birlikte [GetTitleByKey('c_the_eyrie').GetNameNoTier]'de [CHARACTER.GetHerHisYour] öz oğulları gibi yetiştirdi. [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'You believe', 'Robert maintains')], tanrıların [CharYouHerHim(TARGET_CHARACTER)] iki erkek kardeş ve zar zor tanıdığı bir baba vermesine rağmen, [CharYouSheHe(TARGET_CHARACTER)]'i gerçekten şekillendiren adamın [Select_CString(CHARACTER.IsLocalPlayer, 'you are', 'Jon Arryn is')] olduğunu savunur."

