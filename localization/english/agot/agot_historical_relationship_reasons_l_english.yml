 nemesis_aerys_ddarklyn:0 "[CHARACTER.GetShortUIName] ve [TARGET_CHARACTER.GetShortUIName] arasındaki derin nefret, [CharYouSheHe(TARGET_CHARACTER)] [TARGET_CHARACTER.GetHerHisYour] kralı hapsettiği anda doğdu. [Select_CString(CHARACTER.IsLocalPlayer, 'The ultimate act of treason — a vassal who dared to lay hands upon the Lord of the Seven Kingdoms and strip', 'A desperate act against a tyrant whose erratic whims threatened to bleed House Darklyn dry, the imprisonment served to remind')] [CharYouHerHim(CHARACTER)] [CHARACTER.GetHerHisYour] [Select_CString(CHARACTER.IsLocalPlayer, 'divine dignity, an insult that can only be answered in fire and blood', 'fragile humanity, a grim lesson that even dragons can be caged and made to bleed')]."

