 lmf_heir.1655.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki ilk birkaç haftasında sessiz ve görev bilincine sahip bir [your_heir.Custom('polite_gender_ref')] olduğunu gösterdiği söyleniyor.\n\n[ROOT.Char.Custom('FortifiedBuilding')] hizmetkârları, [your_heir.GetTitledFirstNameNoTooltip]'in her zaman kibar olduğunu, kendisiyle konuşulduğunda her zaman yanıt verdiğini ve [ROOT.Char.Custom('FortifiedBuilding')] konuklarından beklenen tüm gelenek ve göreneklere özenle uyduğunu söylüyor.\n\n[your_heir.GetHerHim]'in [your_heir.GetHerHis] kabuğundan biraz daha fazla çıkmasını görmeye itiraz etmezdim; ama kendime [your_heir.GetSheHe]'in yalnızca yerleşmekte olduğunu hatırlatıyorum. Ziyaretin bundan sonrasını göreceğiz; ama bu en azından hayırlı bir başlangıç."

