 agot_court_ongoing.court_start_song.intro.0503.relative.desc:0 "[target.GetFirstName]'e birebir uyan klasik bir [target.GetCulture.GetNameNoTooltip] aşk baladı buldum! Tekrar tekrar çalışıyorum — her şey kusursuz olmalı!\n\n[owner.Custom2('LMF_RelationToMeShort', SCOPE.sC('target'))]'imi [target_location.GetNameNoTooltip] bahçelerinde, [target.GetHerHis] dostlarıyla çevrili yürürken buluyorum. Kalbim çekiç gibi atarken [target.GetHerHim]'in önünde diz çöküp şarkı söylüyorum."

 agot_court_ongoing.court_start_song.success.0503.relative.desc:0 "\n\n[target.GetFirstNamePossessiveNoTooltip] yanakları koyu bir nar kırmızısına dönüyor ama [target.GetSheHe] sözümü kesmiyor. [target.GetHerHis|U] arkadaşlarının hepsi memnun, ya da kıskanç görünüyor — kesinlikle iyi bir işaret!\n\n"You have a beautiful voice, [target.Custom2('LMF_RelationToMeShort', SCOPE.sC('owner'))]," [target.GetFirstNameNoTooltip] says before [target.GetSheHe] hurries off. [target.GetHerHis|U] friends are quick to follow. I stand up on shaking legs, watching them disappear between the hedges, my heart beating harder than ever."

 agot_court_ongoing.court_start_sneaky_love_letter.success.spouse.0503.desc:0 "\n\nBekleyiş dayanılmaz. Reddedilme düşüncesi midemi bulandırıyor! [target.GetHerHis] yanıtı geldiğinde mührü titreyen ellerimle yırtıyorum.\n\n"Your words are pretty, [owner.Custom2('RelationToMeAddress', ROOT.Char)], and I am grateful for them. Perhaps the bonds of our matrimony will become bonds of love, in time? Perhaps we shall see. Yours in faith, [target.GetFirstNameNoTooltip].""

 agot_court_ongoing.court_start_sneaky_love_letter.success.relative.0503.desc:0 "\n\nBekleyiş dayanılmaz. Reddedilme düşüncesi midemi bulandırıyor! [target.GetHerHis] yanıtı geldiğinde mührü titreyen ellerimle yırtıyorum.\n\n"Your words came as a shock, [owner.Custom2('RelationToMeAddress', ROOT.Char)], but I admit they were pretty nevertheless. I will keep your letter hidden away somewhere secret, to be read again whenever it pleases me. Your [owner.Custom2('LMF_RelationToMeShort', SCOPE.sC('target'))], [target.GetFirstNameNoTooltip].""

 agot_court_ongoing.public_regular_rejection.0503.desc:0 "[target.GetFirstNamePossessiveNoTooltip] tepkisi umduğum gibi değil. "Desist this ridiculous public display, [ROOT.Char.Custom2('RelationToMeAddress', target)], and do not embarrass yourself further. I have no interest in your attentions, nor shall I ever!""

 agot_court_ongoing.written_regular_rejection.0503.desc:0 "\n\n[target.GetFirstNamePossessiveNoTooltip] cevabı hızlı ve net. "I received your note, [ROOT.Char.Custom2('RelationToMeAddress', target)], if indeed it is yours and not a cruel jest played by some villain. If it was you after all, then I insist you stop this foolish endeavor immediately. I have no romantic interest in you, nor shall I ever.""

 agot_court_ongoing.1000.t:0 "$court_event_title$ Rahatsız Edici Dans"

 agot_court_ongoing.1000.desc:0 "[location.GetNameNoTooltip]'deki bir sosyal etkinliğe katılırken — [target.GetFirstNameNoTooltip]'e yakınlaşmak için bir çabaydı bu — müzisyenler neşeli bir ezgi çalmaya başlıyor ve bir dans başlıyor. Gözlerim gönlümün nesnesini arıyor; ama artık çok geç... [target.GetSheHe] şimdiden [social_bore.GetTitledFirstNameNoTooltip] ile dans ediyor. Görünüşe göre bu onun tercihi değil; zira [target.GetSheHe] [social_bore.GetTitledFirstNameNoTooltip]'i pek sevmediği gibi, [social_bore.Custom('polite_gender_ref')] berbat dans ediyor ve [target.GetFirstNameNoTooltip], kurtulmak için can atmasına rağmen ayrılmak için fazlasıyla kibar.\n\n[target.GetFirstNameNoTooltip] dans pistinin öbür ucundan bana bakıyor ve [target.GetHerHis] gözleriyle kurtarmaya gelmemi diliyor."

 agot_court_ongoing.1000.a:0 "Zarifçe araya girmeyi dene."

 agot_court_ongoing.1000.a.success:0 "[target.GetFirstNameNoTooltip] ile araya girip kendin dans ediyorsun"

 agot_court_ongoing.1000.a.failure:0 "[social_bore.GetTitledFirstNameNoTooltip] reddediyor ve durumu daha da tuhaf hale getiriyor"

 agot_court_ongoing.1000.b:0 "Korkarım [target.GetFirstNameNoTooltip] yapayalnız."

 agot_court_ongoing.1300.t:0 "$court_event_title$ Edebiyat Zevkleri"

 agot_court_ongoing.1300.desc:0 "[target.GetFirstNameNoTooltip]'i aramaya çıkıyorum ve onu güneşli bir öğleden sonra [location.GetNameNoTooltip]'deki avluda kitap okurken buluyorum. Yaklaşınca kitabın ağır bir cilt olduğunu ve [target.GetFirstNameNoTooltip]'in ondan pek hoşlanmadığını fark ediyorum. Beni görünce [target.GetSheHe] kitabı bırakıyor ve şüphelerimi doğrulayarak kitaptan uzun uzun şikâyet ediyor.\n\nKaşını kaldırıp daha iyi bir şey önerebilecek olup olmadığımı soruyor. Bu hem bir rica hem de bir meydan okuma; beni anında zor duruma sokuyor."

 agot_court_ongoing.1300.a:0 "[target.GetSheHe]'in beğenebileceğini düşündüğüm bir şey öner."

 agot_court_ongoing.1300.a.success:0 "[target.GetSheHe|U] önerdiğin kitabı beğeniyor!"

 agot_court_ongoing.1300.a.failure:0 "[target.GetSheHe|U] seçiminden etkilenmiyor"

 agot_court_ongoing.1300.b:0 "Bahane uydurup bunun yerine [target.GetHerHim]'e iltifat etmeyi dene..."

 agot_court_ongoing.1310.t:0 "Talim Çalışması"

 agot_court_ongoing.1310.opening.martial:0 "Avluda askerlerle talim yaparken [target.GetTitledFirstNameNoTooltip]'in de pek uzakta olmayan bir yerde talim yaptığını görüyorum. "

 agot_court_ongoing.1310.opening:0 "Avludan geçerken [target.GetTitledFirstNameNoTooltip]'in pek uzakta olmayan askerlerle talim yaptığını görüyorum. "

 agot_court_ongoing.1310.mid:0 "[target.GetSheHe|U] rakibine saldırganca yükleniyor; [target.GetHerHis] alnında ter damlaları birikmiş, gerçekten etkileyici bir görüntü çiziyor.\n\n[target.GetSheHe]'in beni henüz fark etmediğini varsayabilirim ancak; ama bu uzun sürmez. Belki de bu yakınlaşma şansımdır? "

 agot_court_ongoing.1310.ending.martial:0 "[target.HerHim]'i tekniğimle etkilerken kılıç kılıça gelebilir, yoldaşlık ruhuyla yakınlaşabilir, hatta [target.GetHerHim]'e birkaç sağlam vuruş şansı bile tanıyabilirdim..."

 agot_court_ongoing.1310.ending.spectator:0 "Kılıç oyunları pek bana göre değildir; ama ona tezahürat yapabilirim. Belki talim bittikten sonra [target.GetHerHim] ve askerlere içki içmek için katılma fırsatı bile olur..."

 agot_court_ongoing.1310.ending:0 "Bir [owner.GetWomanMan]'in müsabakalara katılmasına izin vermezlerdi; ama izleme fırsatını da engelleyemezlerdi. Belki [target.GetTitledFirstNameNoTooltip]'e desteğimi gösterişli biçimde sunabilir, bu süreçte [target.GetHerHim]'i büsbütün kendime hayran bırakabilirdim..."

 agot_court_ongoing.1310.a:0 "Talime katıl!"

 agot_court_ongoing.1310.b:0 "[target.GetHerHim]'i kenardan tezahüratla destekle."

 agot_court_ongoing.1310.c:0 "Cazibeyi açmanın zamanı geldi!"

 agot_court_ongoing.1310.d:0 "[target.GetSheHe] beni görmeden aceleyle geçip git..."

 agot_court_ongoing.1310.a.success:0 "[target.GetSheHe|U] yeteneğinden etkileniyor"

 agot_court_ongoing.1310.a.failure:0 "Müsabakada kendini rezil ediyorsun"

 agot_court_ongoing.1310.b.success:0 "[target.GetSheHe|U] cazibene kapılıyor"

 agot_court_ongoing.1310.b.failure:0 "Biraz tuhaf bir hal alıyor..."

 court_outcome.0003.d:0 "[owner.GetHerHim] ile evlenmeyi umuyorum!"

 court_outcome.0003.e:0 "Ne olursa olsun [owner.GetHerHim] ile olmak istiyorum!"

 court_outcome.0003.e.them.elope.tt:0 "[owner.GetShortUIName|U] razıysa, [owner.GetSheHe] benimle kaçmak için bir entrika başlatıp Ruh Eşim olacak"

 court_outcome.0003.e.me.elope.tt:0 "[owner.GetShortUIName|U] razıysa, [owner.GetHerHim] ile kaçmak için bir entrika başlatıp [owner.GetHerHis] Ruh Eşi olacağım"

 court_outcome.0003.e.no.elope.tt:0 "İkimiz de kaçma entrikası başlatamayız; ama [owner.GetShortUIName|U] razıysa, bir söz verilecek ve Ruh Eşleri olacağız"

 court_outcome.0003.d.propose.tt:0 "[owner.GetShortUIName|U] razıysa, [owner.GetHerHim] ile evlenecek ve [owner.GetHerHis] Ruh Eşi olacaksın"

 court_outcome.0003.d.permission.tt:0 "[owner.GetShortUIName|U] razıysa, [owner.GetHerHis] Ruh Eşi olacak ve [owner.GetHerHim] ile evlenmek için izin isteyeceksin"

 agot_court_outcome.1001.c:0 "Birliğimiz [owner.GetFaith.FertilityGodName] tarafından tanık olunmalı!"

 agot_court_outcome.1001.d:0 "Bir gün ne olursa olsun evleneceğiz!"

 agot_court_outcome.1003.b:0 "Bal gibi tatlı tek bir öpücük paylaşıyoruz."

 agot_court_outcome_seek_permission_both_to_marry_tt:0 "[proposer.GetTitledFirstNameNoTooltip] önce evlilik için hem [proposer.GetHerHis] hükümdarı [proposer_liege.GetTitledFirstName]'den hem de [proposer_target.GetTitledFirstNamePossessiveNoTooltip] hükümdarı [proposer_target_liege.GetTitledFirstName]'den izin istemeli"

 agot_court_outcome_seek_permission_proposer_both_liege_to_marry_tt:0 "[proposer.GetTitledFirstNameNoTooltip] önce evlilik için senin hükümdarın [proposer_liege.GetTitledFirstName]'den izin istemeli"

 agot_court_outcome_seek_permission_proposer_own_liege_to_marry_tt:0 "[proposer.GetTitledFirstNameNoTooltip] önce evlilik için [proposer.GetHerHis] hükümdarı [proposer_liege.GetTitledFirstName]'den izin istemeli"

 agot_court_outcome_seek_permission_proposer_target_liege_to_marry_tt:0 "[proposer.GetTitledFirstNameNoTooltip] önce evlilik için [proposer_target.GetTitledFirstNamePossessiveNoTooltip] hükümdarı [proposer_target_liege.GetTitledFirstName]'den izin istemeli"

 agot_court_outcome.1105.a:0 "[owner.GetSheHe|U] evlenme teklif etti ve ben kabul ettim!"

 agot_court_outcome.1105.b:0 "[owner.GetSheHe|U] bir gün ne olursa olsun evleneceğimize söz vermişti!"

 agot_court_outcome_elope_promise_tt:0 "[owner.GetFirstNameNoTooltip]'in en kısa sürede [target.GetFirstNameNoTooltip] ile kaçmak için bir entrika başlatacağına dair ciddi bir söz verilir!"

 agot_court_outcome.1200.t:0 "Büyük Jest"

 agot_court_outcome.1200.courtier.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de divan toplarken seyircilerin arasında [target.GetTitledFirstNameNoTooltip]'i fark ettim ve [target.GetHerHim]'i görünce kalbim yerinden fırladı.\n\n"

 agot_court_outcome.1200.ruler.desc:0 "[target.GetTitledFirstNamePossessiveNoTooltip] sarayına, [target.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de katıldım; [target.GetHerHim]'i uzun zamandır görmemiştim. [target.GetHerHim]'i herkesin önünde orada görmek kalbimi hoplattı.\n\n"

 agot_court_outcome.1200.desc:0 "[target.GetTitledFirstNamePossessiveNoTooltip]'in [target_host.Custom2('NamePossessiveCharacterIntroduction', target)] sarayına katılabileceğini duymuştum; o yüzden kendim görmeye gittim. Haklı çıktım ve seyircilerin arasında [target.Custom('LoverPetName')]'imi görmek kalbimi sevinçle hoplattı.\n\n"

 agot_court_outcome.1200.end.desc:0 "O an aklıma geldi: ya [target.GetHerHim]'e olan aşkımı oracıkta, herkesin önünde ilan edersem? Elbette ikimizi de utandırabilirdim; ama büyük bir jest, [target.GetTitledFirstNameNoTooltip]'i aşkımın gerçek olduğuna ve kolayca görmezden gelinemeyeceğine ikna etmek için tam da gereken şey olabilirdi."

 agot_court_outcome.1200.a:0 "Öne çıkıp kendimi ilan edeceğim!"

 agot_court_outcome.1200.b:0 "Hayır, utanç düşüncesine bile dayanamam..."

 agot_court_outcome.1201.start.desc:0 "Derin bir nefes alıp kalabalığa adım attım. Sanki bir şeyler olacağını sezmiş gibi ikiye ayrıldılar; açıkça afallamış [target.GetTitledFirstNameNoTooltip]'in yanına yürüyüp [target.GetHerHis] ellerini ellerime aldığımda tüm gözler bize döndü. Yükselttiğim sesle, tüm sarayın göreceği şekilde bu [target.Custom('polite_gender_ref')]'e duyduğum kalıcı aşkı ilan ettim."

 agot_court_outcome.1201.diplomacy.desc:0 "Sözler istenmeden döküldü dilimden; hem belagatli hem sadedeydiler. Çevremizdeki hanımlar keyifle bayılıyordu. Erkekler kıskançlıkla dudaklarını büzüyordu. [target.GetTitledFirstNameNoTooltip] gülümseyerek karşılık verince, tatlı dilimin bana ihanet etmediği anlaşıldı.\n\n"

 agot_court_outcome.1201.desc:0 "İtiraf edeyim, ne diyeceğimi düşünmemiştim ve bal gibi tatlı konuşan bir [owner.GetWomanMan] değilim. Kalabalık, arada çıkan tuhaf öksürükler dışında çoğunlukla sessizdi. Buna rağmen [target.GetTitledFirstNameNoTooltip] gülümsedi; niyetimin ciddi olduğu [target.GetHerHim] için aşikârdı.\n\n"

 agot_court_outcome.1201.end.desc:0 "Ardından [target.GetSheHe] beni tenha bir yere çekip pervasız aptallığım için azarladı; ne var ki [target.GetHerHis] sözlerinde öfke yoktu. [target.GetHerHim]'i zar zor duydum; çünkü o an [target.GetHerHis] kalbinin, istersem benim olacağını biliyordum."

 agot_court_outcome.1201.b:0 "Tatlı bir öpücük, o zaman, ve orada biter."

 agot_court_outcome.1201.c:0 "Anın sıcağında evlenme teklif et."

 agot_court_outcome.1202.diplomacy.desc:0 "\n\nBal gibi tatlı duygularla bezeli belagatli sözlerime rağmen, kötü bir seçim yaptığım hemen anlaşıldı."

 agot_court_outcome.1202.desc:0 "\n\nKorkunç bir yargı hatası yaptığım hemen anlaşıldı. Sözlerim birbirine takıldı ve [target.GetTitledFirstNamePossessiveNoTooltip] ifadesi dehşete dönüşürken paniğe kapıldım, işler daha da kötüleşti."

 agot_court_outcome.1202.end:0 "Çevremizdeki kalabalık, arada çıkan tuhaf öksürükler dışında ciddi bir sessizliğe büründü. [target.GetTitledFirstNameNoTooltip] ellerini ellerimden çekti ve çevredekilere, bana bu sözleri söyleten şeyin ne olduğuna dair hiçbir fikri olmadığını telaşla itiraf etti. [target.GetSheHe] dönüp odadan çıktığında yalnızca bir soğukluk hissettim ve o an bunun son olduğunu anladım."

 agot_court_outcome.1202.a:0 "Kendimi ne kadar rezil ettim."

 agot_court_outcome.1203.start.desc:0 "Sarayda, kendi işime bakıp yanımdaki bir asilzadeyle boş boş sohbet ederken, birden çevremizdeki kalabalık ikiye ayrıldı. Şaşkınlıkla döndüm ve [owner.GetTitledFirstNameNoTooltip]'in bana doğru yürüdüğünü gördüm.\n\n[owner.GetSheHe|U] ellerimi [owner.GetHerHis] ellerine aldı ve yükselttiği sesiyle [owner.GetHerHis] kalıcı aşkını herkesin duyacağı şekilde ilan etti."

 agot_court_outcome.1203.diplomacy.desc:0 "[owner.GetHerHis|U] baldan tatlıydı, anlık bir dürtüyle yapıldığı belli olmasına rağmen sanki prova edilmiş gibiydi. Çevremizdeki hanımlar keyifle bayılıyor, erkekler kıskançlıkla dudaklarını büzüyor ve kalbim tamamen eriyordu.\n\n"

 agot_court_outcome.1203.desc:0 "[owner.GetTitledFirstNameNoTooltip]'in bunu planlamadığı besbelliydi. [owner.GetHerHis|U] sözleri belagatsizce birbirine takılıyordu ve [owner.GetSheHe] panikledikçe işler daha da kötüleşiyordu. Kalabalık, arada çıkan tuhaf öksürükler dışında sessizleşti. Yine de önemi yoktu; [owner.GetHerHis] niyetinin saf olduğunu biliyordum. Kalbim tamamen eriyordu.\n\n"

 agot_court_outcome.1203.end.desc:0 "Sonra [owner.Custom('polite_gender_ref')]'i tenha bir yere çekip [owner.GetHerHis] pervasız aptallığı için azarladım. İkimiz de utanabilirdik! Yine de [owner.GetSheHe]'in söylediklerimin tek kelimesini bile duyduğundan şüpheliyim; her halükârda önemi yoktu. İş olup bitmişti ve ben âşıktım."

 public_grand_gesture:0 "[TARGET_CHARACTER.GetShortUIName|U] ve [CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUIName] büyük bir jestle [CHARACTER.GetShortUIName]'e duyduğu hayranlığı herkesin önünde ilan ettikten sonra sonsuz aşkı buldu."

 public_grand_gesture_corresponding:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUIName] büyük bir jestle [TARGET_CHARACTER.GetShortUIName]'e duyduğu hayranlığı herkesin önünde ilan ettikten sonra sonsuz aşkı buldu."

 agot_court_outcome.1300.t:0 "Bahçede Buluşma"

 agot_court_outcome.1300.same.desc:0 "[target.Custom('LoverPetName')]'imi uzun zamandır görmedim, o yüzden [target.GetHerHim]'i aramaya çıkıyorum. Gün alacakaranlığa dönerken en sonunda [target.GetHerHim]'i [target.GetCurrentLocation.GetNameNoTooltip]'in en güzel bahçelerinde yapayalnız gezinirken buluyorum. "

 agot_court_outcome.1300.desc:0 "[target.Custom('LoverPetName')]'imi uzun zamandır görmedim, o yüzden [target.GetHerHim]'i bulma umuduyla [target.GetCurrentLocation.GetNameNoTooltip]'e yöneliyorum. Epey çaba gerektiriyor ve gün alacakaranlığa dönerken en sonunda [target.GetHerHim]'i uçsuz bucaksız bahçelerde yapayalnız gezinirken buluyorum. "

 agot_court_outcome.1300.end.desc:0 "[target.GetSheHe|U] dalgın görünüyor; belki de aklı önemli bir meseleyle meşgul, hatta birini bekliyor olabilir. Buna rağmen kalbim sevinçle çarpıyor.\n\nBu tenha yerin, gün batımının göz kamaştıran renkleri altında, aşkımı ilan etmek için en iyi fırsat olabileceği aklıma geliyor. Böyle bir itirafın utancını şimdi göze alamazsam, ne zaman alabilirim?"

 agot_court_outcome.1300.a:0 "Öne çıkmak için kendimi hazırlıyorum..."

 agot_court_outcome.1301.desc:0 "Endişelenmeme gerek yokmuş. [target.GetFirstNameNoTooltip] beni gördüğüne memnun oldu ve aslında o da beni düşündüğünü itiraf etti. Alacakaranlık koyu geceye dönerken bahçelerde yalnız dolaştık ve çok şey konuştuk — yıldızlar, çiçekler, geçmişlerimiz ve geleceklerimiz. [target.GetHerHis] sesini duymak beni büyülüyordu, benimki de onu.\n\nKuytu bir mağaradaki en güzel dereyi bulduğumuzda, tepemizde ay parlarken, sanırım mesele çözülmüştü. Âşıktık."

 agot_court_outcome.1302.start.desc:0 "Gölgelerden çıkıp [target.GetFirstNameNoTooltip]'i selamladığım anda bunun bir hata olduğunu anladım. [target.GetSheHe|U] irkildi ve buzları eritmeye, ardından gelen yapmacık sohbeti daha çekici bir şeye dönüştürmeye çalışırken sinirli sinirli özür diledi. [target.GetSheHe|U] kendini mazur göstermeye devam etti ve nedenini bulmam uzun sürmedi.\n\n"

 agot_court_outcome.1302.target.desc:0 "Gölgelerin arasından bir [targets_meeting.Custom('polite_gender_ref')] belirdi. [targets_meeting.GetTitledFirstName] varlığımdan açıkça rahatsız olarak yanımıza yaklaştı ve [targets_meeting.GetSheHe] sohbetimize katılınca, ikisinin birbirine attığı bakışlardan [target.GetTitledFirstNameNoTooltip]'in beni değil [targets_meeting.GetHerHim]'i beklediğini anlamaya başladım. Ne konuşmak istediklerine dair hiçbir fikrim yok; ama belli ki önemliydi ve ben davetsiz misafirdim.\n\n"

 agot_court_outcome.1302.desc:0 "Gölgelerin arasından hizmetkârlardan biri belirdi. Genç adam ihtiyatla, kendini açıkça aşan bir durumda yanımıza yaklaştı; ilk başta bu müdahaleye içerledimse de, hizmetkâr ile [target.GetTitledFirstNameNoTooltip] arasındaki bakışmalardan [target.GetSheHe]'in beni değil onu beklediğini çabucak fark ettim. [target.GetSheHe]'in bir hizmetkârla ne konuşacağına dair hiçbir fikrim yok; ama belli ki önemliydi ve ben davetsiz misafirdim.\n\n"

 agot_court_outcome.1302.end:0 "Sonunda gerginliğe daha fazla dayanamadım. Kibarca izin isteyip gölgeli bahçelere çekildim; [target.GetTitledFirstNameNoTooltip] gitmemi rahatlamış bir halde karşıladı. O günden beri [target.GetHerHim]'i görmedim; muhtemelen en iyisi de bu."

 agot_court_outcome.1303.desc:0 "Kaderin bir cilvesi olarak, bir akşam [target.GetCurrentLocation.GetNameNoTooltip]'deki uçsuz bucaksız bahçelerde dolaşıyordum; alacakaranlığın parlak renkleri yıldızlı bir gökyüzüne yer açarken düşüncelerim [owner.GetTitledFirstNameNoTooltip]'e kayıyordu. Karşımda, sanki çağrılmış gibi, [owner.GetTitledFirstNameNoTooltip] [owner.GetHerselfHimself]'inden başkası beliriverdi.\n\n[owner.Custom('polite_gender_ref')] bir rüyadan çıkar gibi gölgelerin arasından bana yaklaştı, elimi tuttu ve birlikte bahçelerde yürüyüp pek çok şey konuştuk — yıldızlar, çiçekler, geçmişlerimiz ve geleceklerimiz, zar zor hatırlıyorum. [owner.GetHerHis] sesini duymak beni büyülüyordu, benimki de onu.\n\nKuytu bir mağaradaki en güzel dereyi bulduğumuzda, tepemizde ay parlarken, sanırım mesele çözülmüştü. Âşıktık."

 garden_meeting:0 "[TARGET_CHARACTER.GetShortUIName|U] ve [CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUIName] [CHARACTER.GetShortUIName]'i büyülü bir bahçede bulduktan sonra sonsuz aşkı buldu."

 garden_meeting_corresponding:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUIName] [TARGET_CHARACTER.GetShortUIName]'i büyülü bir bahçede bulduktan sonra sonsuz aşkı buldu."

 agot_court_outcome.1400.t:0 "Gecenin Geç Saatlerine Dek"

 agot_court_outcome.1400.desc:0 "[target.GetFirstNameNoTooltip] ile evliliğimizin inişli çıkışlı dönemleri oldu; ama son zamanlarda işler farklı. Tartışmalar yaşandı, çoğunlukla önemsiz şeyler yüzünden; ama bazıları bağrışmaya dönüştü... ve aklım almıyor, nedenini çözemiyorum. İşler o kadar iyi gidiyordu ki; ben de [target.GetHerHis] kalbini kazanmak için elimden gelenin en iyisini yaptım!\n\n[target.GetHerHim]'i şimdi, [target.GetHerHis] yatak odasının kapısından izlerken, bunu kesin olarak çözmenin zamanının gelip gelmediğini ya da girişimin yalnızca bir kavga daha çıkarıp uçurumu derinleştirip derinleştirmeyeceğini merak ediyorum."

 agot_court_outcome.1400.a:0 "Zamanı geldi."

 agot_court_outcome.1400.b:0 "Hayır. Dedikleri gibi, uyuyan köpek uyandırılmaz."

 agot_court_outcome.1401.desc:0 "Ne rahatlama!\n\n[target.GetFirstNameNoTooltip] ilk başta konuşmakta tereddüt etti; ama benim ısrarımla, sonunda gergin atmosferin [target.GetHerHis] kuşkularına bir tepki olduğunu itiraf etti... evliliğimiz, geleceğimiz ve herkesçe zaten benim olan bir [target.GetWomanMan]'e kur yapma girişimlerimin ardındaki gerçek anlam hakkındaki kuşkularına. [target.GetHerHim]'e, elimden geldiğince açık bir şekilde, kur yapmamda gizli bir niyet olmadığına dair güvence verdim. Evliliğimizin mutlu bir evlilik olmasını istiyordum. Mesele bu kadar basitti.\n\n[target.GetHerHis|U] yüzü sözlerimle aydınlandı; [target.GetHerHis] rahatlaması hissediliyordu; sonrasında konuştuk. Saatlerce, sanki, gecenin geç vakitlerine dek. El ele tutuştuk ve daha önce söylemeye cesaret edemediğimiz sözleri birbirimize söyledik. Bütün evlilikler aşkla dolu değildir, doğru. Artık bizimki öyle."

 agot_court_outcome.1402.desc:0 "Zamanlamam daha kötü olamazdı.\n\n[target.GetFirstNameNoTooltip], bu gerginliği çözme çabalarıma diklendi ve sonunda hepsinin, uzun kur yapmamın ardındaki nedenlere dair temel bir kafa karışıklığından kaynaklandığını itiraf etti. "You are courting a [target.GetWomanMan] who has already married you!" [target.GetSheHe] exclaimed. I tried to explain that I wished our union to be one of love, but [target.GetFirstNameNoTooltip] balked at the idea. When I pressed if there was someone else [target.GetSheHe] had feelings for, since [target.GetSheHe] held no room in [target.GetHerHis] heart for me, that proved to be the wrong choice. We ended up in another fight, one that lasted hours, until finally I stalked out of the bedchambers alone. This was going nowhere."

 agot_court_outcome.1402.a:0 "Öyle olsun!"

 agot_court_outcome.1403.desc:0 "[owner.GetFirstNameNoTooltip] ile evliliğimizin inişli çıkışlı dönemleri oldu; ama son zamanlarda işler farklı. Tartışmalar yaşandı, çoğunlukla önemsiz şeyler yüzünden; ama bazıları bağrışmaya dönüştü... ve aklım almıyor, nedenini çözemiyorum. [owner.GetSheHe|U] son zamanlarda sevgi dolu; şefkat gösteriyor, bana kur yapıyor; ama [owner.GetSheHe] zaten evli olduğu bir [target.GetWomanMan]'in kalbini kazanmak için neden bu kadar uğraşsın?\n\nBu gece [owner.GetSheHe] yatak odama geldi ve ellerimi tuttu.\n\n[owner.GetSheHe|U] bana açık sözlerle, [owner.GetHerHis] çabalarında gizli bir niyet olmadığına dair güvence verdi. [owner.GetSheHe|U], evliliğimizin bir aşk evliliği olmasından başka bir şey istemiyor. Rahatlamam hissediliyordu; sonrasında konuştuk. Saatlerce, sanki, gecenin geç vakitlerine dek. El ele tutuştuk ve daha önce söylemeye cesaret edemediğimiz sözleri birbirimize söyledik. Bütün evlilikler aşkla dolu değildir, doğru. Artık bizimki öyle."

 late_into_the_night:0 "[TARGET_CHARACTER.GetShortUIName|U] ve [CHARACTER.GetShortUIName], anlaşmazlıklarını çözmekle geçen uzun bir gecenin ardından evliliklerinde sonsuz aşkı buldu."

