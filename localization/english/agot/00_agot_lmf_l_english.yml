 lmf_interaction.1327.desc.secrec.friends:0 "Aslında ikimizin de gerçek bir bağ bulduğunu düşünüyorum... illa âşık olarak değil. Henüz değil, her halükârda. Ama dost olarak. Düşünsene! Hem [secondary_actor.GetWifeHusband] hem de en yakın yoldaşım olan biri."

 lmf_interaction.1327.desc.secrec.end:0 "[actor.Custom('FortifiedBuilding')]'e döndüğümüzde, [actor.GetTitledFirstNameNoTooltip]'in hazırlıkların başlaması için can attığını anlayabiliyordum.\n\nO halde asıl soru: benim istediğim bu mu?"

 lmf_interaction.1327.desc.start:0 "[secondary_recipient.GetFirstNameNoTooltip]'ten haber aldım; [secondary_recipient.GetSheHe], [secondary_recipient.GetHerHis] [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ziyaretinin başarılı geçtiğini yazıyor.\n\nGörünüşe göre ikisi "

 lmf_interaction.1327.desc.hunting:0 "[actor.Custom('FortifiedBuilding')]'in pek uzağında olmayan bir yerde rahat bir ava çıktılar. Amaç elbette av değil, ikisinin konuşmasıydı. "

 lmf_interaction.1327.desc.hike:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] çevresindeki topraklarda gezdiler; [secondary_actor.GetFirstNameNoTooltip] çeşitli tarihi yerleri gösteriyordu. Elbette asıl amaç ikisinin konuşmasıydı. "

 lmf_interaction.1327.desc.garrison:0 "[actor.Custom('FortifiedBuilding')] garnizonuna gittiler; [secondary_actor.GetFirstNameNoTooltip] [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile idman yaparken [secondary_recipient.GetFirstNameNoTooltip] izliyordu. [secondary_actor.GetSheHe] mola verdiğinde konuşurlardı. "

 lmf_interaction.1327.desc.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler... duyduğuma göre biraz fazla yakın. Satır aralarını okuduğumda, [secondary_actor.GetFirstNamePossessiveNoTooltip] davranışının kimi zaman uygunsuz olduğunu söyleyebilirim. Yine de konuşma fırsatı buldular. "

 lmf_interaction.1327.desc.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdiler; [secondary_recipient.GetFirstNameNoTooltip], [secondary_actor.GetFirstNameNoTooltip]'in aşk ve yiğitlik üzerine [secondary_actor.GetCulture.GetNameNoTooltip] şiirleri okumasını dinliyordu. Ama çoğunlukla konuştular. "

 lmf_interaction.1327.desc.library:0 "[actor.Custom('FortifiedBuilding')]'in kütüphanesini gezdiler; [secondary_actor.GetFirstNameNoTooltip] [secondary_recipient.GetFirstNameNoTooltip]'e en kıymetli ciltlerini gösterirken rafları karıştırdılar. Amaç elbette kitaplardan çok, ikisinin konuşmasıydı. "

 lmf_interaction.1327.desc.church:0 "[actor.GetFaith.HouseOfWorship|l]'e gittiler; konuşmadıkları zamanlarda dindarlık üzerine vaazları dinlediler. "

 lmf_interaction.1327.desc.tavern:0 "[actor.Custom('FortifiedBuilding')] yakınındaki bir köye gittiler, çoğunlukla bir meyhanede. [secondary_recipient.GetSheHe], [secondary_actor.GetFirstNameNoTooltip]'in eğlenmeye kararlı olduğunu yazıyor; ama buna rağmen konuşmak için pek çok fırsatları olmuş. "

 lmf_interaction.1327.desc.poor:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l] dışındaydılar, yoksullara sadaka ve teselli dağıtıyorlardı. Değerli bir uğraş olsa da, elbette asıl amaç konuşmalarıydı. "

 lmf_interaction.1327.desc.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdiler. [secondary_actor.GetFirstNameNoTooltip] [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in sunduklarını gururla sergiledi; ama asıl amaç, elbette, ikisinin konuşmasıydı. "

 lmf_interaction.1327.desc.garden:0 "günün büyük bölümünde [actor.Custom('FortifiedBuilding')] bahçelerinde gezdiler; ikisinin konuşma fırsatı bulduğu yeterince huzurlu bir ortam. "

 lmf_interaction.1327.desc.hated:0 "[secondary_actor.Custom('lmf_intro_activity_short')]'e pek aldırış etmemesine rağmen, [secondary_recipient.GetSheHe] sonunda kazanıldı.\n\n"

 lmf_interaction.1327.desc.loved:0 "[secondary_recipient.GetSheHe|U] [secondary_actor.Custom('lmf_intro_activity_short')]'i açıkça çok beğenmişti, hem de fazlasıyla; sonunda tamamen kazanıldı.\n\n"

 lmf_interaction.1327.desc.neutral:0 "Tam da bunu yaptılar ve her an üzerlerinde gözler olmasına rağmen dostça konuştular.\n\n"

 lmf_interaction.1327.desc.end:0 "İkisi de birbirinden hoşlanıyor ve [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l]'e razı görünüyor. [actor.GetTitledFirstNameNoTooltip], hazırlıkların en kısa sürede başlamasını istiyor.\n\nO halde asıl sorular: bu hâlâ istediğim şey mi?"

 lmf_interaction.1327.b:0 "Başka bir sevgiliye ihtiyacım yok; yalnızca bir [secondary_actor.GetWifeHusband]'a."

 lmf_interaction.1327.e:0 "Evleneceğiz ve [secondary_actor.GetSheHe] sevgilim olacak."

 lmf_interaction.1327.f:0 "Evet, [secondary_actor.GetSheHe] benim [secondary_actor.GetWifeHusband]'im ve dostum olacak."

 overrode_marriage_wishes:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] [CharYourHerHis(CHARACTER)] kendi özgür iradesiyle evlenme arzusunu görmezden geldi."

 overrode_marriage_wishes_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] [CharYourHerHis(TARGET_CHARACTER)] kendi özgür iradesiyle evlenme arzusunu görmezden geldi."

 married_to_someone_I_dislike:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'i [CharYouSheHe(TARGET_CHARACTER)] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'hoşlanmadığı', 'hoşlanmadığı' )] biriyle evlendirdi."

 married_to_someone_I_dislike_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINameNoTooltipNoFormat]'i [CharYouSheHe(CHARACTER)] [Select_CString( CHARACTER.IsLocalPlayer, 'hoşlanmadığı', 'hoşlanmadığı' )] biriyle evlendirdi."

 force_marriage_intro_ask_rec.tt:0 "[recipient.GetTitledFirstName] razı olsa da olmasa da [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] devam edecek"

 became_enemies_at_introduction:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], [Select_CString( Or( CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer ), 'siz', 'onlar' )] evlilik için tanıştırıldığında anında birbirlerinden nefret ettiler."

 became_enemies_at_introduction_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [CHARACTER.GetShortUINameNoTooltipNoFormat], [Select_CString( Or( CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer ), 'siz', 'onlar' )] evlilik için tanıştırıldığında anında birbirlerinden nefret ettiler."

 lmf_interaction.1328.t:0 "Felaket Bir Eşleşme"

 lmf_interaction.1328.desc.secact.actor.start:0 "[secondary_recipient.GetFirstNamePossessiveNoTooltip] ile geçirilen gün bir felakete dönüştü.\n\n"

 lmf_interaction.1328.desc.secact.both.loved:0 "Tuhaf bir şeydi; çünkü [secondary_recipient.GetTitledFirstNameNoTooltip], [secondary_actor.Custom('lmf_intro_activity_short')]'den epey keyif alıyor gibiydi... en azından ilk başta. "

 lmf_interaction.1328.desc.secact.both.hated:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] [secondary_actor.Custom('lmf_intro_activity_short')]'den şiddetle nefret etti ve oradan sonra işler daha da kötüleşti. "

 lmf_interaction.1328.desc.secact.both.neutral:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] [secondary_actor.Custom('lmf_intro_activity_short')]'i sorun etmiyor gibi görünüyordu; ama ikimiz en başından beri su ile yağ gibiydik. "

 lmf_interaction.1328.desc.secact.both.hunting:0 "Birlikte at sürerken sohbetimiz çabucak tartışmaya ve soğuk sessizliklere dönüştü. Bir noktada yeterince çektim diyerek öne geçtim ve [secondary_recipient.GetHerHim]'i arkada bıraktım; ama [secondary_recipient.GetSheHe] yeniden bana yetiştiğinde bile işler pek düzelmedi.\n\n"

 lmf_interaction.1328.desc.secact.both.hike:0 "Sohbetimiz çabucak tartışmaya ve soğuk sessizliklere dönüştü; o yüzden yürüyüşü, [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] çevresindeki yerel mekânları işaret edip tarihlerini anlatarak geçirmeyi denedim; karşılığında yalnızca göz devirmeler ve iç çekişler aldım.\n\n"

 lmf_interaction.1328.desc.secact.both.garrison:0 "[actor.Custom('FortifiedBuilding')] garnizonunda [actor.Custom('KnightCulturePluralNoTooltipLowercase')]'larımla talim yaptım; ama [secondary_recipient.GetSheHe] sabırsızlandı. Ne var ki talimler arasında [secondary_recipient.GetHerHim]'e her yaklaştığımda işler daha da kötüleşiyor gibiydi.\n\n"

 lmf_interaction.1328.desc.secact.both.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezerken [secondary_recipient.GetHerHim]'i şiirlerimle eğlendirdim; ama [secondary_recipient.GetSheHe] seçimlerime pek aldırış etmiyor gibiydi. Sonra, şiirlerim tükenince işler daha da tuhaflaştı.\n\n"

 lmf_interaction.1328.desc.secact.both.library:0 "[secondary_recipient.GetHerHim]'e etrafı gezdirdim; en kıymetli ciltlerimi [secondary_recipient.GetHerHim]'e göstermek için heyecanlıydım; ama [secondary_recipient.GetSheHe] söylediklerime pek aldırış etmiyordu. Edebiyatla ilgili her düşünce [secondary_recipient.GetHerHim]'in gözlerini devirmesine yol açıyordu.\n\n"

 lmf_interaction.1328.desc.secact.both.church:0 "Vaazları dinledik; ama [secondary_recipient.GetSheHe] halsizleşti. İnanç hakkında söylediğim her şey yalnızca göz devirmeler getirdi ve en sonunda [secondary_recipient.GetSheHe] kollarını kavuşturup öylece oturdu.\n\n"

 lmf_interaction.1328.desc.secact.both.poor:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önündeydik; konuşma şansımız azdı. [secondary_recipient.GetHerHim]'e her yaklaştığımda [secondary_recipient.GetSheHe] geri çekildi.\n\n"

 lmf_interaction.1328.desc.secact.both.tour:0 "[secondary_recipient.GetHerHim]'i [actor.Custom('FortifiedBuilding')]'in ve çevredeki toprakların etrafında gezdirdim; ama işler tuhaftı. [secondary_actor.GetSheHe|U] her özel bir şeyden söz etmeye çalıştığımda rahatsız olmuş görünüyordu ve sohbetimiz çabucak tartışmaya ve soğuk sessizliklere dönüştü.\n\n"

 lmf_interaction.1328.desc.secact.both.garden:0 "Sohbetimiz çabucak tartışmaya ve soğuk sessizliklere dönüştü. [secondary_recipient.GetFirstNameNoTooltip] birkaç kez, bahçeleri daha az bilmesine rağmen hızlanıp öne geçti; ben de yetişmek için koşmak zorunda kaldım.\n\n"

 lmf_interaction.1328.desc.secact.both.mid:0 "Sürekli izlenme hissi tüylerimizi diken diken etti; bu da gerilimi daha da artırdı. Söylediğim hiçbir şey [secondary_recipient.GetHerHim]'i memnun etmiyor gibiydi; [secondary_recipient.GetSheHe]'in söylediği her şey de gitmek istetiyordu."

 lmf_interaction.1328.desc.secact.secact.loved:0 "İlk başta işlerin iyi gittiğini düşündüm. [secondary_recipient.GetTitledFirstNameNoTooltip], [secondary_actor.Custom('lmf_intro_activity_short')]'den epey keyif alıyor gibiydi. "

 lmf_interaction.1328.desc.secact.secact.hated:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] en başından beri [secondary_actor.Custom('lmf_intro_activity_short')]'den nefret etti; ama oradan sonra işlerin düzeldiğini düşündüm. "

 lmf_interaction.1328.desc.secact.secact.neutral:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] [secondary_actor.Custom('lmf_intro_activity_short')]'i sorun etmiyor gibi görünüyordu ve işler yeterince iyi gidiyor gibiydi. "

 lmf_interaction.1328.desc.secact.secact.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den çıkış yolculuğu keyifliydi ve [secondary_actor.GetSheHe] iyi bir av yoldaşıydı. [secondary_recipient.GetSheHe] benimle dostça sohbet etti"

 lmf_interaction.1328.desc.secact.secact.hike:0 "Temposuna özen gösterdim, sayısız mekânı işaret edip tarihlerini anlattım. Bence [secondary_recipient.GetSheHe|U] ilgili görünüyordu; pek çok soru sordu"

 lmf_interaction.1328.desc.secact.secact.garrison:0 "[actor.Custom('FortifiedBuilding')] garnizonunda [actor.Custom('KnightCulturePluralNoTooltipLowercase')]'larımla kıyasıya talimler yaptım; gösteriş yaptığımı itiraf ederim. Her maçtan sonra konuşurduk"

 lmf_interaction.1328.desc.secact.secact.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_recipient.GetHerHim]'i şiirlerimle eğlendirdim; [secondary_recipient.GetSheHe] sessizce dinledi. Şiirler tükenince uzun uzun konuştuk"

 lmf_interaction.1328.desc.secact.secact.library:0 "[secondary_recipient.GetHerHim]'e ciltler arasındaki favorilerimi gösterdim. [secondary_recipient.GetSheHe] az konuştu; ama sessizlik bize uzun uzun konuşma fırsatı verdi"

 lmf_interaction.1328.desc.secact.secact.church:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'de vaazları dinledik. Bu bize pek konuşma fırsatı vermedi; ama sonunda konuştuğumuzda"

 lmf_interaction.1328.desc.secact.secact.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önünde geçirdik; kalabalıklar bizi meşgul etti. Sonunda konuşma fırsatı bulduğumuzda"

 lmf_interaction.1328.desc.secact.secact.tour:0 "[secondary_recipient.GetHerHim]'i [actor.Custom('FortifiedBuilding')]'in ve çevredeki toprakların her yerine götürdüm, her şeyin tarihini ayrıntılı biçimde anlattım. [secondary_actor.GetSheHe|U] hoş bir eşlikti"

 lmf_interaction.1328.desc.secact.secact.garden:0 "Gezinirken, en azından ilk başta, hoş hissettiren bir sohbete daldık. [secondary_recipient.GetSheHe]'in konuşmaya fazlasıyla istekli olduğu çeşitli ilgi alanları vardı"

 lmf_interaction.1328.desc.secact.secact.mid:0 ", ve [secondary_recipient.GetHerHis] tavırlarından hoşlanıverdim.\n\nNe var ki zamanla [secondary_recipient.GetSheHe]'in aynı şeyleri hissetmediğini fark ettim. Konuştuğumda [secondary_recipient.GetHerHim]'i göz devirirken yakaladım ve ne zaman yaklaşsam [secondary_recipient.GetSheHe] irkiliyordu. Gerginlik dayanılmaz hale geldi."

 lmf_interaction.1328.desc.secact.secrec.loved:0 "İlk başta işler yeterince iyi gitti. Örneğin [secondary_recipient.GetTitledFirstNameNoTooltip], [secondary_actor.Custom('lmf_intro_activity_short')]'den açıkça epey keyif aldı. "

 lmf_interaction.1328.desc.secact.secrec.hated:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] [secondary_actor.Custom('lmf_intro_activity_short')]'den belli ki nefret ediyordu; ama katlandı ve ilgilenmeye çalıştı. "

 lmf_interaction.1328.desc.secact.secrec.neutral:0 "İlk başta işler yeterince iyi gitti. [secondary_recipient.GetTitledFirstNameNoTooltip], [secondary_actor.Custom('lmf_intro_activity_short')]'i sorun etmedi; günü baltalayacak kadar değil. "

 lmf_interaction.1328.desc.secact.secrec.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den çıkış yolculuğu keyifliydi ve [secondary_actor.GetSheHe] hoş görünüyordu. Zaman zaman sohbet ettik; tuhaftı ama beklenmedik biçimde değil."

 lmf_interaction.1328.desc.secact.secrec.hike:0 "Temposuna özen gösterdim, sayısız mekânı işaret edip tarihlerini anlattım. [secondary_recipient.GetSheHe|U] ilgili görünüyordu; ama oldukça geçiştirircesine. Yine de [secondary_recipient.GetSheHe]'in denemesini takdir ettim."

 lmf_interaction.1328.desc.secact.secrec.garrison:0 "[actor.Custom('FortifiedBuilding')] garnizonunda [actor.Custom('KnightCulturePluralNoTooltipLowercase')]'larımla kıyasıya talimler yaptım; gösteriş yaptığımı itiraf ederim. Her maçtan sonra konuşurduk ve bu hiç de nahoş değildi."

 lmf_interaction.1328.desc.secact.secrec.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_recipient.GetHerHim]'i şiirlerimle eğlendirdim; [secondary_recipient.GetSheHe] sessizce dinledi. Şiirlerim tükenince uzun uzun konuştuk... ya da denedik, her halükârda, yeterince hoştu."

 lmf_interaction.1328.desc.secact.secrec.library:0 "[secondary_recipient.GetHerHim]'e ciltler arasındaki favorilerimi gösterdim. [secondary_recipient.GetSheHe] az konuştu; ama sessizlik bize uzun uzun konuşma fırsatı verdi; tuhaf olsa da büsbütün nahoş değildi."

 lmf_interaction.1328.desc.secact.secrec.church:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'de vaazları dinledik. Bu bize pek konuşma fırsatı vermedi; ama sonunda konuştuğumuzda yeterince hoştu."

 lmf_interaction.1328.desc.secact.secrec.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önünde geçirdik; kalabalıklar bizi meşgul etti. Sonunda konuşma fırsatı bulduğumuzda, tuhaf olsa da yeterince hoştu."

 lmf_interaction.1328.desc.secact.secrec.tour:0 "[secondary_recipient.GetHerHim]'i [actor.Custom('FortifiedBuilding')]'in ve çevredeki toprakların her yerine götürdüm, her şeyin tarihini ayrıntılı biçimde anlattım. [secondary_recipient.GetSheHe|U] hoş ama bir o kadar tuhaf bir eşlikti."

 lmf_interaction.1328.desc.secact.secrec.garden:0 "Gezinirken, en azından ilk başta, yeterince hoş hissettiren bir sohbete daldık. [secondary_recipient.GetSheHe]'in konuşmaya fazlasıyla istekli olduğu çeşitli ilgi alanları vardı; her ne kadar onları oldukça banal bulsam da."

 lmf_interaction.1328.desc.secact.secrec.mid:0 "\n\nYavaş yavaş, ancak, giderek daha çok rahatsız olduğumu fark ettim. [secondary_recipient.GetHerHis|U] tavırları sinirime dokundu, [secondary_recipient.GetHerHis] gözlerimi devirtti ve gerginlik büyüdü. [secondary_recipient.GetSheHe] fark ettiyse bile söylemedi. Gerçekten de [secondary_recipient.GetSheHe] benden tamamen büyülenmiş görünüyordu... ama ya ben? Ben aynı hissetmiyordum."

 lmf_interaction.1328.desc.rival.actor:0 "Bir ara tökezledim ve [secondary_recipient.GetFirstNameNoTooltip] güldü -- güldü! Yemin ederim, o an [secondary_recipient.GetHerHis] boynunu sıkabilirdim."

 lmf_interaction.1328.desc.end.actor:0 "\n\nGüneş battığında ve [actor.Custom('FortifiedBuilding')]'e döndüğümüzde, bunun bir eşleşme olmadığı açıktı."

 lmf_interaction.1328.desc.start:0 "[secondary_actor.GetFirstNameNoTooltip] ve [secondary_recipient.GetFirstNameNoTooltip]'in birbirlerinin eşliğinde geçirdiği gün bir felakete dönüştü.\n\nGözcülük edenlerin anlattığına göre,"

 lmf_interaction.1328.desc.both.start:0 "ikisi de en başından beri birbirini umursamıyor gibiydi. "

 lmf_interaction.1328.desc.both.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den yolculukta tartıştılar; [secondary_actor.GetFirstNameNoTooltip] sürekli [secondary_recipient.GetFirstNameNoTooltip]'in önünde at sürüyor, [secondary_recipient.GetHerHim]'i yetişmek için zorlarken bırakıyordu. [secondary_recipient.GetSheHe] yetiştiğinde bile, anlatıldığına göre konuşmaları, gerçekleştiği nadir anlarda tuhaftı."

 lmf_interaction.1328.desc.both.hike:0 "Yürüyüşleri sırasındaki sohbet başlangıçta yeterince hoştu... ta ki bir tartışma soğuk sessizliklere yol açana dek. [secondary_actor.GetFirstNameNoTooltip] amansız bir tempo tutturdu ve [secondary_recipient.GetFirstNamePossessiveNoTooltip] arazideki aşinalık eksikliğinden rahatsız olmuş görünüyordu. İkisi de orada olmak istemiyordu; ama o noktada artık çok geçti."

 lmf_interaction.1328.desc.both.garrison:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_actor.GetHerHis] silah arkadaşları [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile talim yaparken [secondary_recipient.GetFirstNameNoTooltip]'i neredeyse görmezden geldi; talimler bitince de işler pek düzelmedi. Yaşanan birkaç konuşma da tuhaftı ve soğuk sessizliklerle doluydu."

 lmf_interaction.1328.desc.both.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler, az konuştular. Sonra [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'e fazla yakın durmaya başladı; anlatılanlara göre uygunsuz davranıyor ve [secondary_recipient.GetSheHe]'in açıkça ilgilenmediği imalı tavırlar sergiliyordu. İşler oradan sonra daha da kötüye gitti."

 lmf_interaction.1328.desc.both.poetry:0 "[secondary_actor.GetFirstNameNoTooltip], [actor.Custom('FortifiedBuilding')] bahçelerinde gezerlerken [secondary_recipient.GetFirstNameNoTooltip]'i [secondary_actor.GetCulture.GetName] şiirleriyle eğlendirdi; ama [secondary_recipient.GetSheHe] ya şiirden ya da [secondary_actor.GetHerHim]'den sıkılmıştı. Her iki durumda da [secondary_actor.GetSheHe] alındı ve işler oradan sonra daha da kötüye gitti."

 lmf_interaction.1328.desc.both.library:0 "[actor.Custom('FortifiedBuilding')] kütüphanesini gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'e ciltler arasındaki en sevdiği kitapları gösterdi. [secondary_actor.GetSheHe|U], [secondary_recipient.GetSheHe]'in ilgisizliğinin büsbütün farkında değilmiş gibi görünüyordu; işler oradan sonra daha da kötüye gitti."

 lmf_interaction.1328.desc.both.church:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'e götürdü; orada vaazları dinlediler ama başka pek bir şey yapmadılar. Yaşanan konuşmalar en iyi ihtimalle yapmacık ve tuhaftı."

 lmf_interaction.1328.desc.both.tavern:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bir meyhaneye getirmek gibi tuhaf bir seçim yaptı; orada [secondary_actor.GetSheHe] eğlenirken [secondary_recipient.GetHerHim]'i neredeyse bir köşeye terk etti. Anlatıldığına göre [secondary_actor.GetSheHe] daha sonra [secondary_recipient.GetHerHim]'e döndüğünde, [secondary_recipient.GetSheHe] çileden çıkmıştı."

 lmf_interaction.1328.desc.both.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önünde yoksullara sadaka dağıtarak geçirdiler; ama birbirlerinden uzak durdular ve nadiren konuştular. Konuştuklarında da sohbetleri tuhaftı ve soğuk sessizliklerle doluydu."

 lmf_interaction.1328.desc.both.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdiler; anlatıldığına göre [secondary_actor.GetFirstNameNoTooltip] her şeyin tarihini büyük bir ayrıntıyla anlatıyordu... ve [secondary_recipient.GetFirstNameNoTooltip]'in hiç ilgilenmediği gerçeğinin farkında değildi. [secondary_recipient.GetSheHe], iç çekip esnemek dışında neredeyse hiç konuşmadı."

 lmf_interaction.1328.desc.both.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdiler; ama birbirlerinden uzak durdular ve açıkça başka herhangi bir yerde olmayı tercih edecekleri belliydi. Anlatıldığına göre yaşanan konuşmalar yapmacık ve tuhaftı; [secondary_actor.GetFirstNameNoTooltip] [secondary_recipient.GetFirstNameNoTooltip]'in söylediği her şeye göz deviriyordu."

 lmf_interaction.1328.desc.both.mid:0 "\n\nSu ve yağ gibiydiler; aralarında tek bir kıvılcım bile görülmedi."

 lmf_interaction.1328.desc.secrec.start:0 "[secondary_actor.GetFirstNameNoTooltip] ilk başta yeterince hevesli görünüyordu. "

 lmf_interaction.1328.desc.secrec.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den at sürüp çıktılar; anlatıldığına göre [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [secondary_actor.GetHerHis] sohbet becerileriyle büyülemek için elinden geleni yaptı. Gerçekten de [secondary_actor.GetSheHe] öylesine kafayı sıyırmış görünüyordu ki pek az av gerçekleşti."

