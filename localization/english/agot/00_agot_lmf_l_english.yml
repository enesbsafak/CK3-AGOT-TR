 lmf_scheme.1031.target.leavescourt:0 "Bunun [proposer_target.GetSheHe]'in [proposer_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geleceği anlamına geldiğinin farkındayım; ama "

 lmf_scheme.1031.proposer.arrivescourt:0 "Bunun sarayına gelmek anlamına geleceğinin farkındayım; ama "

 lmf_scheme.1031.target.arrivescourt:0 "Bunun [proposer_target.GetSheHe]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geleceği anlamına geldiğinin farkındayım; ama "

 lmf_scheme.1031.neither.family:0 "Bunun alışılmadık olduğunun ve bizi kötü bir eşleşme sayabileceğinin farkındayım; ama "

 lmf_extoll_knight:0 "sana [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] olarak faydalı olabilecek yetenekli bir savaşçı."

 lmf_extoll_physician:0 "[GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()|l] olarak hizmet edebilecek bilgili bir [ROOT.GetCharacter.GetWomanMan]?"

