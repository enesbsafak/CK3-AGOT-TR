 lmf_lover.101.t:0 "Sabah Olur"

 lmf_lover.101.desc.start:0 "[lover.GetFirstNameNoTooltip] ile geçirdiğim bir gecenin ardından [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'deki yatak odamda uyanıyorum ve [lover.GetHerHim]'i pek uzakta olmayan bir yerde dikilirken görüyorum. [lover.GetSheHe|U] endişeli bir ifadeyle pencereden dışarı bakıyor; [lover.GetHerHis] çabaları az önce ne kadar... hevesliyse bu şaşırtıcı.\n\nNazikçe soruşturunca endişesinin ardındaki gerçeği öğreniyorum.\n\n"

 lmf_lover.101.desc.soulmate:0 ""I adore you more than I can express, my love. It's true, yet "

 lmf_lover.101.desc.lover:0 ""I'm not unhappy about our... arrangement, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]. Quite the contrary. Yet "

 lmf_lover.101.desc.samesex:0 "sen bir [ROOT.Char.GetWomanMan]'sin, ben de öyleyim. İkimizin birlikte olması yasak. "

 lmf_lover.101.desc.incest:0 "sen benim [lover.Custom2('LMF_RelationToMeShort', ROOT.Char )]'imsin. İkimizin birlikte olması yalnızca imkânsız değil, aynı zamanda yasak. "

 lmf_lover.101.desc.lover.married:0 "Ben evli bir [lover.GetWomanMan]'im. [lover_spouse.GetFirstNameNoTooltip]'i düşünmekten kendimi alamıyorum. "

 lmf_lover.101.desc.married:0 "sen evli bir [ROOT.Char.GetWomanMan]'sin ve [my_spouse.GetTitledFirstNameNoTooltip]'i düşünmekten kendimi alamıyorum. "

 lmf_lover.101.desc.both.married:0 "ikimiz de evliyiz. [lover_spouse.GetFirstNameNoTooltip] ve [my_spouse.GetTitledFirstNameNoTooltip]'i düşünmekten kendimi alamıyorum. "

 lmf_lover.101.desc.not.married:0 "karı koca değiliz. Ben senin sevgilinim. "

 lmf_lover.101.desc.ruler:0 "sen [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'in [ROOT.Char.GetTitleAsNameNoTooltip]'isin; bense? Onun yanında hiç kimseyim. "

 lmf_lover.101.desc.nobility:0 "ikimiz de mevkilerimiz arasındaki farkı biliyoruz. Seninle kıyaslandığında ben sadece bir köylüyüm. "

 lmf_lover.101.desc.default:0 "yine de... "

 lmf_lover.101.desc.secret:0 "Birileri bizi öğrenecek olursa..."\n\n"

 lmf_lover.101.desc.public:0 "Herkesin bizi zaten bilmesi gerçeği. Bakışları..."\n\n"

 lmf_lover.101.desc.end:0 "[lover.GetHerHim]'i rahatlatmaya çalıştım; fayda etmedi. "I suppose I just need to know what this means," [lover.GetSheHe] sighed."

 lmf_lover.101.a:0 ""I will do whatever it takes to make you happy.""

 lmf_lover.101.b:0 ""We are here for our own pleasure.""

 lmf_lover.101.c:0 ""You and I are meant to be together.""

 lmf_lover.101.d:0 ""Bah! Why does it have to mean anything?""

 lmf_lover_promise_tt:0 "#italic [lover.GetFirstNameNoTooltip] bunu birlikte daha büyük bir geleceğin üstü kapalı sözü olarak alacak #!"

 lmf_lover_no_promise_tt:0 "#italic [lover.GetFirstNameNoTooltip] bunu, ilişkinin nihayetinde ciddi olmadığı anlamında alacak #!"

 lmf_lover.102.t:0 "Bahçelerde"

 lmf_lover.102.desc.start:0 "[lover.GetFirstNameNoTooltip] ve ben bahçenin kuytusunda aşkımızı daha yeni yaşamayı bitirmiştik ki [lover.GetHerHim]'e dönüyorum. [lover.GetHerHis] bedenine hayranlıkla bakıyorum; teri hâlâ teninde soğuyor ve [lover.GetSheHe], [lover.GetHerHim]'i izlediğimi fark edince bana attığı muzip sırıtışı görüyorum.\n\n"What are you thinking now, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]?" [lover.GetSheHe] asks.\n\n"I wonder where this leads, this thing we have."\n\nThis made [lover.GetFirstNameNoTooltip] chuckle. "Why does it have to lead anywhere? "

 lmf_lover.102.desc.married:0 "Bir [my_spouse.GetWifeHusband]'in var. "

 lmf_lover.102.desc.theymarried:0 "Bir [lover_spouse.GetWifeHusband]'im var. "

 lmf_lover.102.desc.samesex:0 "Birbirinden keyif alan iki [ROOT.Char.GetWomenMen]'iz. "

 lmf_lover.102.desc.incest:0 "Ben senin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('lover'))]'inim. "

 lmf_lover.102.desc.end:0 "Doğrusu, tek şaşırdığım şey bunu ilk... birlikte geçirdiğimiz gecenin ötesine taşımak istemen." [lover.GetSheHe|U] raised an eyebrow at me. "If you want something more for us, well... I suppose that's for you to decide, isn't it?"

 lmf_lover.102.a:0 ""I will do whatever it takes to make you happy.""

 lmf_lover.102.b:0 ""I agree. We are here for our own pleasure.""

 lmf_lover.102.c:0 ""You and I are meant to be together, whether you believe it or not.""

 lmf_lover.102.d:0 ""You're right. This means nothing to me.""

 lmf_lover.103.t:0 "[Select_CString( lover.IsFemale, 'Güzel', 'Yakışıklı' )] [ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))|U]"

 lmf_lover.103.desc.start:0 "[lover.GetFirstNameNoTooltip] ve ben yatakta uzanmış, en son aşk kaçamağımızı daha yeni bitirmiştik ki [lover.GetHerHim]'e dönüyorum. [lover.GetHerHis] bedenine hayranlıkla bakıyorum; teri hâlâ teninde soğuyor ve [lover.GetSheHe], [lover.GetHerHim]'i izlediğimi fark edince bana attığı muzip sırıtışı görüyorum.\n\n"What are you thinking now, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]?" [lover.GetSheHe] asks.\n\n"Are you happy? With this?"\n\nThe question gives [lover.GetHerHim] pause. "Happy to be [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] "

 lmf_lover.103.desc.secret:0 "gizli [ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))], demek istiyorsun? "

 lmf_lover.103.desc.public:0 "[ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))], tüm sarayının bildiği? "

 lmf_lover.103.desc.end:0 "Bunda utanılacak bir şey yok ve ben yeterince mutluyum. Belki #EMP senin#! mutlu olup olmadığını sormalıyım, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]."\n\nI'm uncertain how to respond to my own question, but [lover.GetSheHe] persists. "Where do you see this thing between us going, if anywhere at all?""

 lmf_lover.103.a:0 ""I will do whatever it takes to make you happy.""

 lmf_lover.103.b:0 ""We are here for our own pleasure. That's enough for me.""

 lmf_lover.103.c:0 ""You and I are meant to be together.""

 lmf_lover.103.d:0 ""It's not going anywhere, and I prefer it that way.""

 lmf_lover.104.t:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'de Bir Gece Daha"

 lmf_lover.104.desc.start:0 "[lover.GetFirstNameNoTooltip] ile işler şimdiye dek keyifli gidiyor; bu kadar yeni bir aşk ilişkisine yakışır şekilde. Örneğin bu gece, en sevdiğim 'saraylıdan [ROOT.Char.GetLadyLord]'e' senaryosunu oynayabilmek için [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki taht odasını boşalttım ve her şey umduğum gibiydi.\n\nAma sonrasında, tenimizdeki ter hâlâ soğurken [lover.GetFirstNameNoTooltip]'in biraz... ketum olduğunu fark ettim. Pişmanlık belki? Şehvetime fazla mı düşkünlük gösteriyordum? Aynen bunu sordum.\n\n"

 lmf_lover.104.desc.end:0 "[lover.GetHerHis] düşüncelerine kıkırdadım. Bunları ilk duyuşum değildi; ama eğlenmem [lover.GetFirstNameNoTooltip]'i daha da tedirgin etti. "I simply... need to know what this is," [lover.GetSheHe] said. "If it means anything at all to you, or if I'm fooling myself.""

 lmf_lover.105.t:0 "Tüm Güzel Şeyler Sona Erer"

 lmf_lover.105.desc:0 "Uzun zamandır [lover.GetFirstNameNoTooltip]'i hiç düşünmediğim aklıma geliyor; [lover.GetSheHe]'in de beni düşündüğünden şüpheliyim.\n\nNedenlerin listesi uzun; ama gerçek karşısında hepsi önemsiz: [lover.GetFirstNameNoTooltip] ile ne yaşadıysak, ne paylaştıysak ya da ne hissettiysek, ilişkimiz bitti."

 lmf_lover.105.a:0 "Ne yazık."

 lmf_lover.1000.t:0 "Ruh Eşinin Mutluluğu"

 lmf_lover.1000.desc.army:0 "Bugün, ordu kampa yerleştikten sonraki nadir bir huzur anında, [lover.GetFirstNameNoTooltip] beni bulmaya geldi.\n\n"

 lmf_lover.1000.desc.travel:0 "Gün için çadırlarımıza yerleşmiştik, neredeyse bitkindik; derken [lover.GetFirstNameNoTooltip] beni bulmaya geldi.\n\n"

 lmf_lover.1000.desc.activity:0 "Öğleden sonra yoğun programımıza bir mola verip [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'deki avluda gezinirken başımı kaldırdım ve [lover.GetFirstNameNoTooltip]'in yakınlarda durduğunu gördüm.\n\n"

 lmf_lover.1000.desc.notlocal:0 "[lover.GetFirstNameNoTooltip] bugün beni [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'de ziyarete geldi; en hafif tabirle hoş bir sürpriz.\n\n"

 lmf_lover.1000.desc.local:0 "Bugün [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'deki avluda, neredeyse düşüncelere dalmış halde gezinirken başımı kaldırdım ve [lover.GetFirstNameNoTooltip]'in yakınlarda durduğunu gördüm.\n\n"

 lmf_lover.1000.desc.end:0 "[lover.GetHerHim]'i gördüğüm an gülümsedim; [lover.GetSheHe] de aynı şekilde karşılık verdi. Neredeyse tek kelime etmeden yan yana yürümeye başladık. Bizi gören herkesin, iyi dostlardan başka bir şey olmadığımızı düşünmesi kolayca affedilir; ama elbette [lover.GetFirstNameNoTooltip] benim için bundan çok daha fazlasını ifade ediyor.\n\n[lover.GetSheHe|U] çeşitli sorunlarımdan yakınırken beni dikkatle dinledi; pek tavsiye vermedi, daha çok dert yanmam için bir vesile oldu. Her derin iç çekişimde [lover.GetSheHe] yumuşakça kıkırdıyor ve bir şekilde kendimi daha iyi hissediyordum.\n\nFarkına varmadan saatler geçmişti; yine de [lover.GetHerHis] eşliğinden sıkılmamıştım. Sanırım gerçek bir ruh eşine sahip olmak demek budur."

 lmf_lover.1000.a:0 "Bundan asla sıkılmayacağım."

 lmf_lover.1005.t:0 "[lover_trait.GetNameNoTooltip( ROOT.Char )|U] Ruh Eşim"

 lmf_lover.1005.desc.sinful:0 "Yıllar boyunca birlikte olduğumuz süreçte, [lover.GetFirstNameNoTooltip]'in üzerimde kötü bir etki yaratabileceği öne sürüldü"

 lmf_lover.1005.desc.good:0 "Yıllar boyunca birlikte olduğumuz süreçte, [lover.GetFirstNameNoTooltip]'in üzerimde iyi bir etki yarattığı öne sürüldü"

 lmf_lover.1005.desc.normal:0 "Yıllar boyunca birlikte olduğumuz süreçte, [lover.GetFirstNameNoTooltip]'in üzerimde güçlü bir etki yarattığı öne sürüldü"

 lmf_lover.1005.desc.mid:0 "... ve bunda bazı gerçekler var.\n\nÖrneğin, [lover.GetSheHe|U] epeyce [lover_trait.GetNameNoTooltip( ROOT.Char )|l],"

 lmf_lover.1005.desc.opposite:0 "oysa ben ise [lover_opposite_trait.GetNameNoTooltip( ROOT.Char )|l]. Bu, ilişkimizde kendini küçük yollarla gösteren bir çekişme noktası; zira [lover.GetFirstNameNoTooltip] beni değiştirmeye hiç çalışmadıysa da [lover.GetSheHe]'in onaylamadığını anlayabiliyorum.\n\n"

 lmf_lover.1005.desc.notopp:0 "ve [lover.GetFirstNameNoTooltip] beni hiç değiştirmeye çalışmadıysa da, ince bakışlarında ve ara sıra çatılan kaşlarında [lover.GetHerHis] etkisini hâlâ hissediyorum.\n\n"

 lmf_lover.1005.desc.end:0 "Birlikte olduğumuzda kendimi sık sık davranışlarımı değiştirirken buluyorum. Bağımız öylesine güçlü ki buna gerçekten aldırmıyorum; çünkü birbirine benzemek doğal geliyor... ama istediğim bu mu? [lover.GetSheHe] gibi daha [lover_trait.GetNameNoTooltip( ROOT.Char )|l] olmak?\n\nDik durursam, mantık gereği bu "

 lmf_lover.1005.desc.opposite2:0 "anlaşmazlık noktası gerçek bir soruna dönüşene dek büyüyebilir. Oysa bizi ilk etapta bir araya getiren farklılıklarımız değil miydi?"

 lmf_lover.1005.desc.notopp2:0 "ilişkimizde gerçek bir anlaşmazlık noktasına dönüşene dek büyüyebilir. Ya da belki de en başta sorun olmaması gereken şeyi fazla analiz ediyorum?"

 lmf_lover.1005.a:0 "Olsun."

 lmf_lover.1005.b:0 "Hayır, ben benim ve bu değişmeyecek."

 lmf_lover.1005.b.tt:0 "Farklılıkların büyüyor"

 lmf_lover.1010.t:0 "Sevgilim [lover_trait.GetNameNoTooltip( ROOT.Char )|U] Etkisi"

 lmf_lover.1010.desc.sinful:0 "Yıllar boyunca birlikte olduğumuz süreçte, [lover.GetFirstNameNoTooltip] üzerinde kötü bir etki yarattığım öne sürüldü"

 lmf_lover.1010.desc.good:0 "Yıllar boyunca birlikte olduğumuz süreçte, [lover.GetFirstNameNoTooltip] üzerinde iyi bir etki yarattığım öne sürüldü"

 lmf_lover.1010.desc.normal:0 "Yıllar boyunca birlikte olduğumuz süreçte, [lover.GetFirstNameNoTooltip] üzerinde güçlü bir etki yarattığım öne sürüldü"

 lmf_lover.1010.desc.mid:0 "... ve bunda bazı gerçekler var.\n\nÖrneğin, ben sık sık [lover_trait.GetNameNoTooltip( ROOT.Char )|l] olurum, "

 lmf_lover.1010.desc.opposite:0 "oysa [lover.GetSheHe] ise [lover_opposite_trait.GetNameNoTooltip( ROOT.Char )|l]. Bu, ilişkimizde kendini küçük yollarla gösteren bir çekişme noktası; zira [lover.GetHerHim]'i değiştirmek için hiç çaba göstermediysem de, [lover.GetSheHe] onaylamadığımı anlayabiliyor.\n\n"

 lmf_lover.1010.desc.notopp:0 "ve [lover.GetHerHim]'i değiştirmek için hiç çaba göstermediysem de, [lover.GetSheHe]'in ince bakışlarımın ve ara sıra çattığım kaşlarımın etkisini hissettiği açık.\n\n"

 lmf_lover.1010.desc.end:0 "Giderek, [lover.GetFirstNameNoTooltip] birlikte olduğumuzda davranış biçimini değiştiriyor. Beni memnun etmek için ve farklılıklarımızın ilişkimizde bir çekişme noktasına dönüşmesini önlemek için, sanırım; her ne kadar [lover.GetHerHim]'den böyle bir şey istemesem de. Bağımız öylesine güçlü ki [lover.GetSheHe] şikâyet etmiyor; ve gerçekten inanıyorum ki bu, daha derin bir değişime yol açıyor... zamanla bizi ancak daha da yakınlaştırabilecek bir değişime."

 lmf_lover.1010.a:0 "Bu yüzden [lover.GetHerHim]'i çok seviyorum."

 lmf_lover.1015.t:0 "Bir Kaçış?"

 lmf_lover.1015.desc.start:0 "[lover.GetFirstNameNoTooltip] [lover.GetHerHis] yüzündeki sırıtışla ortaya çıktığı anda bir şeyler planladığını bilmeliydim.\n\n"Let's elope," [lover.GetSheHe] announced, with utter certainty.\n\n"

 lmf_lover.1015.desc.bold:0 "[lover.GetFirstNameNoTooltip] her zaman cüretkâr olmuştu; ama bu bambaşka bir şeydi.\n\n"

 lmf_lover.1015.desc.irrational:0 "Doğrusu [lover.GetFirstNameNoTooltip] her zaman biraz mantıksız olmuştu; ama bu bambaşka bir seviyedeydi.\n\n[lover.GetHerHis] planındaki çeşitli sorunları açıklamaya başladım"

 lmf_lover.1015.desc.married:0 ", benim [my_spouse.GetWifeHusband]'den başlayarak, ama [lover.GetSheHe] beni durdurdu. "Is [my_spouse.GetTitledFirstNameNoTooltip] your soulmate? No? Then there's nothing else to discuss, is there?\n\n"

 lmf_lover.1015.desc.them.married:0 ", [lover.GetHerHis] [lover_spouse.GetWifeHusband]'den başlayarak, ama [lover.GetSheHe] beni durdurdu. "Is [lover_spouse.GetTitledFirstNameNoTooltip] my soulmate? No? Then there's nothing else to discuss, is there?\n\n"

 lmf_lover.1015.desc.liege:0 ", [lover.GetHerHis] hükümdarının böyle bir plana kesinlikle karşı çıkacağı gerçeğinden başlayarak, ama [lover.GetSheHe] beni durdurdu. "Is [lover.GetLiege.GetTitledFirstNameNoTooltip] my soulmate? No? Then there's nothing else to discuss, is there?\n\n"

 lmf_lover.1015.desc.default:0 ", ama [lover.GetSheHe] beni durdurdu. "I am your soulmate. Is there truly anything else to discuss?"\n\n"

 lmf_lover.1015.desc.end:0 "Buna hızlı bir cevabım yoktu. "

 lmf_lover.1015.desc.end.happy:0 ""When we first fell in love, you said you'd do whatever it took to make me happy," [lover.GetSheHe] reminded me. "#EMP This#! would make me happy.""

 lmf_lover.1015.desc.end.meant:0 ""When we first fell in love, you said we were meant to be together," [lover.GetSheHe] reminded me. "So let's be together.""

 lmf_lover.1015.desc.end.now:0 ""Maybe we didn't start this relationship expecting to be where we are," [lover.GetSheHe] reminded me, "but we're here! So let's be happy.""

 lmf_lover.1015.a:0 "[lover.GetSheHe|U] çok haklı bir noktaya değiniyor."

 lmf_lover.1015.b:0 "Bu olmayacak."

 lmf_lover.1020.t:0 "Uzun Zamanın Sonunda"

 lmf_lover.1020.desc.army:0 "[lover.GetFirstNameNoTooltip], akşam geç saatlerde, askerler çadırlarına çekilip ortalık nihayet sakinleşince ateşin başında bana katıldı.\n\n"

 lmf_lover.1020.desc.travel:0 "[lover.GetFirstNameNoTooltip] bugün, maiyetimizin çoğu çoktan çekildikten sonra akşamın geç saatlerinde ateşin başında bana katıldı.\n\n"

 lmf_lover.1020.desc.activity:0 "Günün yoğun olayları sona ererken, [lover.GetFirstNameNoTooltip] beni bahçede buldu.\n\n"

 lmf_lover.1020.desc.notlocal:0 "Bu öğleden sonra bahçede gezinirken, [lover.GetFirstNameNoTooltip]'in yalnızca günü benimle geçirmek için [lover.GetCurrentLocation.GetNameNoTooltip]'ten özel bir yolculuk yaptığını öğrendim.\n\n"

 lmf_lover.1020.desc.local:0 "Bu öğleden sonra bahçede gezinirken [lover.GetFirstNameNoTooltip] beni buldu ve bana katıldı.\n\n"

 lmf_lover.1020.desc.desc:0 "İtiraf etmeliyim ki [lover.GetHerHim]'i gördüğüme memnun oldum. Bir zamanlar [lover.GetHerHim]'i yalnızca bir sevgili sayardım; ama en başında [lover.GetHerHim]'e ilişkimizin özel olduğunu söylemiştim ve bunun yalan olmadığı ortaya çıktı, zira gerçekten de daha fazlasına dönüştü.\n\nSaatlerce konuştuk ve en sonunda ilişkimiz konusu açıldı. [lover.GetFirstNameNoTooltip] tereddüt etti; ama ikimizin gerçekten de ruh eşi olup olmadığımızı araştırmanın zamanı gelmiş miydi, diye merak ettim."

 lmf_lover.1020.a:0 "[lover.GetHerHim]'i aşkımızın gerçek olduğuna ikna edeceğim!"

 lmf_lover.1020.a.success.tt:0 "[lover.GetFirstNameNoTooltip] ikna olmuş durumda"

 lmf_lover.1020.a.failure.tt:0 "[lover.GetFirstNameNoTooltip] bu adım için hazır değil"

 lmf_lover.1020.b:0 "Hayır, işleri olduğu gibi bırakmak en iyisi."

 lmf_lover.1025.t:0 "Yastık Sohbeti"

 lmf_lover.1025.desc.courtier.other:0 "[lover.GetFirstNameNoTooltip] akşamı geçirmek için [lover.GetLiege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den geldiği anda bir şeylerin döndüğünü bilmeliydim. "

 lmf_lover.1025.desc.courtier:0 "[lover.GetFirstNameNoTooltip] akşamı geçirmek için yatak odama geldiği anda bir şeylerin döndüğünü bilmeliydim. "

 lmf_lover.1025.desc:0 "[lover.GetWomanMan]'in gözlerinde muziplikten bahseden bir parıltı vardı.\n\n"I have something to tell you, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]," [lover.GetSheHe] said.\n\n"Oh?" I did my best to pretend to unintrigued, though it was untrue.\n\n"It's a secret I overheard at court today, and I thought you just might be interested to hear it...""

 lmf_lover.1025.a:0 ""How clever of you, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('lover'))]!""

 lmf_lover.1030.t:0 "Yetenekli [ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))|U]"

 lmf_lover.1030.desc.start:0 "[lover.GetFirstNameNoTooltip]'in gerçekte ne kadar yetenekli olduğunu unutmak bazen kolaydır.\n\n"

 lmf_lover.1030.desc.diplomacy:0 "Yine de son zamanlarda [lover.GetSheHe] epey yardımcı oluyor; yatakta oturup diğer hükümdarlara yazışmalarımı kaleme alışımı dinliyor ve ardından sözcüklerimi nasıl düzelteceğime dair en içgörülü tavsiyeleri sunuyor.\n\n"

 lmf_lover.1030.desc.martial:0 "Yine de geçenlerde [lover.GetSheHe], masamdaki askerlerimizin iaşesi hakkında sıkıcı ayrıntılara inen bazı kâğıtları fark etti ve şaşırtıcı derecede faydalı iyileştirme önerileri sundu.\n\n"

 lmf_lover.1030.desc.stewardship:0 "Yine de geçenlerde, ikimiz yatakta uzanırken vassallarımla vergi düzenlemeleri hakkında bitmek bilmeden yakınırken, [lover.GetSheHe] gelişigüzel bazı önerilerde bulundu; bu öneriler o düzenlemeleri kayda değer biçimde iyileştirdi.\n\n"

 lmf_lover.1030.desc.intrigue:0 "[lover.GetHerHis|U] gözleri her zaman tetikte; özel muhafızımdaki bazı eksiklikleri işaret ediyor ve saraydaki hangi entrikaları ne şekilde dikkate almam gerektiğini gösteriyor.\n\n"

 lmf_lover.1030.desc.learning:0 "[lover.GetSheHe|U] en son saplantılarım hakkındaki saçmalamalarıma büyük ilgi gösteriyor, hatta zaman zaman [lover.GetHerHis] bilgi hazinesinden çıkardığı faydalı ipuçları da veriyor.\n\n"

 lmf_lover.1030.desc.end:0 "İlk başta [lover.GetHerHis] yardımını kabul etmeye direndim; uygunsuz olmasından korkuyordum. Ama giderek, iyiliğimi bu kadar açıkça düşünen bir saraylının yardımını kabul etmenin en akıllıcası olduğuna karar verdim."

 lmf_lover.1030.a:0 "[lover.GetSheHe|U] harika, değil mi?"

 lmf_lover.1035.t:0 "Küçük Bir Hediye"

 lmf_lover.1035.desc.ruler:0 "[lover.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den bir haberci geldiği söylendiğinde bunu oldukça tuhaf buldum; o yüzden onu karşılamak için avluya indim.\n\n"

 lmf_lover.1035.desc.notlocation:0 "[lover.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den bir haberci geldiği söylendiğinde bunu oldukça tuhaf buldum; o yüzden onu karşılamak için avluya indim.\n\n"

 lmf_lover.1035.desc.location:0 "[lover.GetFirstNameNoTooltip]'in beni görmek için avluya geldiği söylendiğinde bunu oldukça tuhaf buldum. Bu kadar resmi mi? Ne kadar acayip. Hemen [lover.GetHerHim]'i karşılamaya indim.\n\n"

 lmf_lover.1035.desc.courtier:0 "[ROOT.Char.Custom('FortifiedBuilding')]'in avlusundan geçerken [lover.GetTitledFirstNameNoTooltip]'i orada dikilirken, deli gibi sırıtırken gördüm. Ne... beklenmedik. Tabii ki hemen [lover.GetHerHim] ile konuşmaya gittim.\n\n"

 lmf_lover.1035.desc.messenger:0 "'mesaj', değerli taşlarla dolu bir keseydi ve basit bir notla birlikte geldi:\n\n"#EMP They shall never shine as brightly as you — a small gift, from one who loves you.#!"\n\nThe note was unsigned, but I know precisely who it's from."

 lmf_lover.1035.desc.inperson:0 ""I have a small gift for you," [lover.GetSheHe] said. With that, [lover.GetSheHe] passed me a small bag filled with valuable gemstones.\n\nI was about to object at [lover.GetHerHis] unnecessary generosity, but [lover.GetFirstNameNoTooltip] cut me off before I could even speak. [lover.GetSheHe|U] knows me too well.\n\n"You have meant so much to me, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]. Please accept it in the spirit with which it was given." And, with that, [lover.GetSheHe] departed before I had a chance to reply."

 lmf_lover.1035.a:0 "[lover.GetHerHim] ne kadar düşünceli."

 lmf_lover.1036.t:0 "Muhtaç Bir [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('lover'))|U]"

 lmf_lover.1036.desc.start:0 "[lover.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den haber aldım ve [lover.GetFirstNameNoTooltip] için son zamanlarda işler... iyi gitmiyor.\n\nAnladığım kadarıyla [lover.GetSheHe]'in borçları [lover.GetHerHis] gözlerine kadar yükselmiş ve elbette [lover.GetSheHe] de "

 lmf_lover.1036.desc.proud:0 "gururlu "

 lmf_lover.1036.desc.stubborn:0 "inatçı "

 lmf_lover.1036.desc.humble:0 "mütevazı "

 lmf_lover.1036.desc.shy:0 "utangaç "

 lmf_lover.1036.desc.paranoid:0 "paranoyak "

 lmf_lover.1036.desc.craven:0 "korkmuş "

 lmf_lover.1036.desc.content:0 "isteksiz "

 lmf_lover.1036.desc.end:0 "yardımımı gerçekten #EMP istemek#! için.\n\nBelki de sadece öyle yapmalı ve [lover.GetHerHim]'e reddetme seçeneği vermemeliyim. Yine de içimden bir ses, [lover.GetFirstNameNoTooltip]'in sessizce beklediğinin tam da bu olduğunu ve kenarda durup hiçbir şey yapmazsam [lover.GetSheHe]'in hayal kırıklığına uğrayacağını, hatta üzüleceğini merak ediyor."

 lmf_lover.1036.a:0 "Elbette yardım ederim!"

 lmf_lover.1036.b:0 "[lover.GetFirstNameNoTooltip] yapayalnız."

 lmf_lover.1036.b.tt:0 "[lover.GetFirstNameNoTooltip] yardımını bekliyordu..."

 lmf_lover.1040.t:0 "Küçük Bir Tavsiye"

 lmf_lover.1040.desc.start:0 "[lover.GetFirstNameNoTooltip] bugün [lover.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den gelir gelmez aklından bir şey geçtiğini anladım.\n\n[lover.GetSheHe|U] o kadar meşguldü ki [lover.GetHerHis] kaşları stres ve endişeyle düğümlenmişti. [lover.GetSheHe]'in günü benimle geçirmek için değil, tavsiye istemek için geldiğini anlamaya başladım.\n\n"Is something amiss, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('lover'))]?" I finally asked.\n\n[lover.GetSheHe|U] sighed heavily. "I know you have your own concerns managing [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], but I need your help "

 lmf_lover.1040.desc.diplomacy:0 "hassas bir diplomasi meselesi hakkında "

 lmf_lover.1040.desc.martial:0 "bir strateji meselesiyle "

 lmf_lover.1040.desc.stewardship:0 "vassallarımdan biriyle sözleşmesi hakkında görüşürken "

 lmf_lover.1040.desc.intrigue:0 "azami gizlilik gerektiren acil bir meseleyle "

 lmf_lover.1040.desc.end:0 "bende olmayan bir bilginin olduğu bir alan. Lütfen... Korkarım oldukça çaresizim.""

 lmf_lover.1040.a:0 ""I'll do my best, whatever you require.""

 lmf_lover.1040.a.success:0 "Yardımın başarılı olur ve [lover.GetHerHim] memnun kalır"

 lmf_lover.1040.a.fail.angry:0 "Yardımın ters teper ve [lover.GetSheHe] kudurur"

 lmf_lover.1040.a.fail.disappointed:0 "Yardımın ters teper; ama [lover.GetSheHe] seni affeder"

 lmf_lover.1040.b:0 "Buradan muğlak laflar ve savuşturmalarla sıyrıl."

 lmf_lover.1040.b.success:0 "[lover.GetSheHe|U] yardım edemeyeceğini kabul ediyor"

 lmf_lover.1040.b.fail:0 "[lover.GetSheHe|U] aldatmacanı görüyor"

 lmf_lover.1045.t:0 "[ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))|U]'imin Tavsiyesi"

 lmf_lover.1045.desc.start:0 "[lover.GetFirstNameNoTooltip]'in ne kadar becerikli ve zeki bir [lover.GetWomanMan] olduğunu unutmak bazen çok kolay geliyor.\n\nBugün [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bahçelerde yürüyorduk ki [lover.GetSheHe] "

 lmf_lover.1045.desc.diplomacy:0 "bir vassalla yaşadığım bazı güncel sorunlardan ve bunları barışçıl yollarla nasıl çözebileceğimden bahsetmeye başladı.\n\n"

 lmf_lover.1045.desc.martial:0 "silahşorlarla yaşadığımızı söylediğim bazı iaşe sorunlarından bahsetti ve bunları nasıl çözebileceğime dair birkaç seçenek sundu.\n\n"

 lmf_lover.1045.desc.stewardship:0 "vassallarımla yaşadığımı söylediğim bir vergi anlaşmazlığı hakkında konuştu; önce isteksizce, sonra daha büyük bir inançla. Aslında [lover.GetSheHe] bana bu işi büsbütün aşmanın bir yolunu gösterdi.\n\n"

 lmf_lover.1045.desc.intrigue:0 "[ROOT.Char.Custom('FortifiedBuilding')]'in güvenliğinden, daha doğrusu güvensizliğinden bahsetti. İçine sızılabilecek yollar. Bir tehdit olarak değil, iyiliğime duyduğu içten kaygıyla.\n\n"

 lmf_lover.1045.desc.learning:0 "[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'deki kütüphaneleri nasıl destekleyebileceğim ve bunun diyarım genelinde artan gelişmeyi nasıl destekleyebileceği hakkında uzun uzun konuştu.\n\n"

 lmf_lover.1045.desc.end:0 "[lover.GetSheHe|U] öğleden sonranın büyük bölümünde anlatmaya devam etti ve ben büyülenmiş bir halde dinledim. [lover.GetHerHis|U] tavsiyeleri gerçekten işe yarayabilirdi, eğer [lover.GetSheHe] vermeye devam etmeye istekliyse."

 lmf_lover.1045.a:0 "Çok minnettarım!"

 lmf_lover.1050.t:0 "İmdada"

 lmf_lover.1050.desc.start:0 "Hastalığım beni yatağa düşürdü ve öksürüyorum; odama birinin girdiğini duyunca gözlerim bulanık biçimde derhal gitmesini emrediyorum.\n\n"Nonsense, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]. "

 lmf_lover.1050.desc.ruler:0 "Hasta olduğunu duyar duymaz [lover.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den ta buraya kadar geldim." "

 lmf_lover.1050.desc.location:0 "Seninle ilgilenebilecek durumdayken seni burada eriyip bitmeye terk edecek değilim." "

 lmf_lover.1050.desc.notlocation:0 "Hasta olduğunu duyar duymaz [lover.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den ta buraya kadar geldim." "

 lmf_lover.1050.desc.mid:0 "[lover.GetFirstNameNoTooltip] içeri dalıyor ve bakımımı derhal üstlenerek bana pek seçenek bırakmıyor.\n\n"B-but, you'll catch this sickness for certain!" I object between bouts of coughing.\n\n[lover.GetSheHe|U] shrugs. "If [lover.GetFaith.HighGodName] wills, then so be it."\n\n"

 lmf_lover.1050.desc.secret:0 "İtiraz edemeyecek kadar zayıfım denecek haldeyim; ama [lover.GetFirstNameNoTooltip]'in hizmetkârları, [lover.GetHerHis] şefkatli davranışlarının tamamen masum olduğuna ikna etmesinin inanılmaz zor olacağı aklıma geliyor. [lover.GetSheHe|U] iyi niyetli olabilir; ama bu, sırrımızı kolayca ifşa edebilir!"

 lmf_lover.1050.desc.public:0 "İtiraz edemeyecek kadar zayıfım denecek haldeyim; hem ne faydası olur? [lover.GetFirstNameNoTooltip] ve ilişkimizi herkes zaten biliyor... ve [lover.GetSheHe] hayır cevabını kabul edecek gibi görünmüyor."

 lmf_lover.1050.a:0 "[lover.GetHerHis] hizmetlerine teslim ol."

 lmf_lover.1050.a.success:0 "[lover.GetFirstNameNoTooltip] şüphe uyandırmaktan kurtuluyor"

 lmf_lover.1050.a.fail:0 "[lover.GetFirstNamePossessiveNoTooltip] sadakati gerçeği ortaya çıkarıyor"

 lmf_lover.1050.b:0 "[lover.GetHerHim]'i derhal gönder! İtiraz yok!"

 lmf_lover.1055.t:0 "Dil Sürçmesi"

 lmf_lover.1055.desc:0 "Bunu söylemek istememiştim.\n\nİster 'yastık sohbeti' deyin, ister dikkatsizlik, hatta ister aptallık. [lover.GetFirstNameNoTooltip] ve ben her zaman yaptığımız gibi bir akşam sohbet ediyorduk ve ağzımdan söylemek istediğimden çok daha fazlası çıktı.\n\n[lover.GetSheHe|U] ilk başta beni anlamamış gibi yaptı; ama [lover.GetHerHis] gözlerindeki anlayışı görebiliyordum. [lover.GetSheHe|U] biliyor."

 lmf_lover.1055.a:0 "Artık yapılacak bir şey yok..."

 lmf_lover.1055.b:0 "[lover.GetHerHis] sessizliği karşılığında [lover.GetHerHim]'e her şeyi vaat et."

 lmf_lover.1055.c:0 "[lover.GetSheHe|U] hücresinden kimseye bir şey anlatamayacak!"

 lover_promise_to_keep_secret:0 "[lover.GetFirstNameNoTooltip] [secret|E]'i ifşa etmeyeceğine söz veriyor"

 lover_jailed_to_keep_secret:0 "[lover.GetFirstNameNoTooltip]'ten [secret|E]'i ifşa etmemesi için zorla söz aldı"

 lmf_lover.1060.t:0 "[lover.GetHerHis] Dil Sürçmesi"

 lmf_lover.1060.desc:0 "[lover.GetFirstNameNoTooltip]'in bunu söylemek istemediği açık.\n\nİster 'yastık sohbeti' deyin, ister dikkatsizlik, hatta ister aptallık. [lover.GetFirstNameNoTooltip] bir akşam sohbet ediyordu ve [lover.GetSheHe] gerçekten söylememesi gereken bir şeyi ağzından kaçırdı.\n\nSonrasında [lover.GetSheHe]'in anında donup kalması, az önce söylediği şeyin tam olarak ne olduğunu bildiğini gösteriyordu... ve benim de bildiğimi biliyordu. Hâlâ inanmakta zorlansam bile."

 lmf_lover.1060.a:0 "Bu beklenmedikti."

 lmf_lover.1065.t:0 "Evlilik Teklifi"

 lmf_lover.1065.desc.start:0 ""Why aren't we married?"\n\n[lover.GetFirstNameNoTooltip] asked me this today as we both lay in bed, [lover.GetHerHis] face one of consternation.\n\n"

 lmf_lover.1065.desc.secret:0 "[lover.GetHerHim]'e ilişkimizin gizli olduğunu hatırlattım; [lover.GetSheHe] de karşılığında bana, evlenmiş olsaydık bunun bir öneminin olmayacağını hatırlattı.\n\n"

 lmf_lover.1065.desc.public:0 "Tereddüt ettim ve [lover.GetSheHe] bana ilişkimizi herkesin zaten bildiğini hatırlattı. Evlenirsek, insanlar zamanla unutur ve bakışlar kesilirdi.\n\n"

 lmf_lover.1065.desc.happy:0 ""You did tell me, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)], back when this began years ago, you'd do whatever it took to make me happy. Well, this would." "

 lmf_lover.1065.desc.meant:0 ""You did tell me, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)], back when this began years ago, that we were meant to be together. So let's be together. Properly." "

 lmf_lover.1065.desc.now:0 ""Maybe this wasn't on either of our minds, back when this first began years ago, but [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]... we're here now." "

 lmf_lover.1065.desc.end:0 "[lover.GetSheHe]'in kararlı olduğunu anlayabiliyordum."

 lmf_lover.1065.a:0 "Kabul ediyorum. Yapalım!"

 lmf_lover.1065.b:0 "Hayır, bu kesinlikle mümkün değil."

 lmf_lover.1070.t:0 "Zamanı mı?"

 lmf_lover.1070.desc.start:0 "[lover.GetFirstNameNoTooltip] ve ben bugün yatakta uzanırken evlilik konusu açıldı.\n\nBu, [lover.GetHerHis] tercihi değildi; [lover.GetSheHe] sık sık evlilik fikrinden hoşlanmadığını söylerdi. Bu benim işimdi.\n\n"

 lmf_lover.1070.desc.happy:0 "[lover.GetHerHim]'e, yıllar önce bu başladığında [lover.GetHerHim]'i mutlu etmek için ne gerekiyorsa yapacağımı söylediğimi hatırlattım. "

 lmf_lover.1070.desc.meant:0 "[lover.GetHerHim]'e, yıllar önce bu başladığında birlikte olmak için yaratıldığımızı söylediğimi hatırlattım. "

 lmf_lover.1070.desc.now:0 "[lover.GetHerHim]'e, yıllar önce bu başladığında ikimizin de bunun ciddi olmasını beklemediğini hatırlattım... ama işler değişti. "

 lmf_lover.1070.desc.secret:0 "Üstelik bu, ilişkimizi gizli tutarak etrafta sinsice dolaşmanın da sonu anlamına gelirdi.\n\n"

 lmf_lover.1070.desc.public:0 "Üstelik herkes ilişkimizi zaten biliyordu. Bu, [lover.GetSheHe]'in maruz kaldığını bildiğim fısıltıların ve bakışların sonu anlamına gelirdi.\n\n"

 lmf_lover.1070.desc.end:0 "[lover.GetFirstNameNoTooltip] bu fikri düşündü. Üstelersem [lover.GetHerHis] isteksizliğinin aşınacağını anlayabiliyordum. Üstlemezsem de konunun bir daha hiç açılmayacağı belliydi."

 lmf_lover.1070.a:0 "Üstüne git. Evlenelim!"

 lmf_lover.1070.b:0 "Konu burada ve şimdi kapansın."

 lmf_lover.1075.t:0 "Saraya Varış"

 lmf_lover.1075.desc.start:0 ""What is #EMP [lover.GetSheHe]#! doing here?"\n\nI heard the whispers from my courtiers and, when I looked up, sure enough there was [lover.GetFirstNameNoTooltip] boldly striding into my throne room as if [lover.GetSheHe] owned the place. [lover.GetSheHe|U], "

 lmf_lover.1075.desc.known:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'deki her skandal fısıltının konusu olan, herkesçe bilinen sevgilim.\n\n"

 lmf_lover.1075.desc.lowborn:0 "soyu düşük bir [lover.GetWomanMan] ve bu yüzden tamamen yersiz.\n\n"

 lmf_lover.1075.desc.courtier.realm:0 "[lover.GetLiege.GetTitledFirstNamePossessiveNoTooltip] [lover.GetLiege.Custom2('LMF_RelationToMeShort', SCOPE.sC('lover'))] ve burada olmak için hiçbir nedeni yok.\n\n"

 lmf_lover.1075.desc.courtier.foreign:0 "burada olmak için hiçbir nedeni olmayan, [lover.GetLiege.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]'ten bir [lover.GetWomanMan].\n\n"

 lmf_lover.1075.desc.culture:0 "burada olmak için hiçbir nedeni olmayan bir [lover.GetCulture.GetNameNoTooltip] [lover.GetWomanMan].\n\n"

 lmf_lover.1075.desc.religion:0 "burada olmak için hiçbir nedeni olmayan, [lover.GetFaith.GetNameNoTooltip]'in bir takipçisi.\n\n"

 lmf_lover.1075.desc.default:0 "ne hükümdarı, ne sarayı ne de burada olmak için dünyevi bir nedeni olmayan bir [lover.GetWomanMan].\n\n"

 lmf_lover.1075.desc.mid:0 "[lover.GetSheHe]'in neyi başarmayı umduğunu hayal bile edemiyordum. "

 lmf_lover.1075.desc.secret:0 "Daha da kötüsü, fısıltılar çoktan başlamışken, hazır bir hikâye olmadan [lover.GetHerHis] varlığını açıklamak inanılmaz derecede zor olurdu.\n\n"

 lmf_lover.1075.desc.public:0 "Belki [lover.GetSheHe], bana ne olduğunu tam olarak bilenlerin, dedikoducuların ve söylenti yayanların gözlerinin içine bakmak istiyordu; bu onları daha da kışkırtacak olsa bile.\n\n"

 lmf_lover.1075.desc.end:0 "Yapılacak en temkinli şey [lover.GetHerHim]'i sessizce uzaklaştırtmak olurdu. Ama [lover.GetFirstNameNoTooltip]'i bilirsin; [lover.GetSheHe] bundan fazlasıyla rahatsız olurdu."

 lmf_lover.1075.a:0 "[lover.GetFirstNameNoTooltip] kalsın ve [lover.GetHerHis] eğlensin."

 lmf_lover.1075.a.success:0 "[lover.GetFirstNamePossessiveNoTooltip] varlığını açıklamayı başarıyorsun"

 lmf_lover.1075.a.fail:0 "Açıklama girişimini beceriyorsun"

 lmf_lover.1075.b:0 "Hayır, bu uygunsuz. [lover.GetHerHim]'i uzaklaştırın."

 lmf_lover.1080.opening:0 "Sevgilim,"

 lmf_lover.1080.desc.start:0 "Mesafenin gönlü yakınlaştırdığını söylerler. Görünüşe göre doğruymuş; zira kalbim sana gerçekten çok bağlı.\n\nBana anlatıldığına göre "

 lmf_lover.1080.desc.army:0 "ordun çok uzaklarda bir yerde kamp kurmuş: "

 lmf_lover.1080.desc.travel:0 "yolculukların çok uzaklara ulaştı "

 lmf_lover.1080.desc.event:0 "artık çok uzaklardasın: "

 lmf_lover.1080.desc.end:0 "[my_camp.GetNameNoTierNoTooltip], ve öyleyse bu mektubun sana ulaşmasını ve seni neşeli ve sağlıklı bulmasını umuyorum. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönüşüne kadar seni düşüneceğim."

 lmf_lover.1080.a:0 "Umarım [lover.GetHerHim]'i yakında görürüm."

 lmf_lover.1085.t:0 "Hırslı [ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))|U]"

 lmf_lover.1085.desc.start:0 "[lover.GetFirstNamePossessiveNoTooltip] aklından bir şey geçtiğini anlayabiliyordum ve nitekim odamda soyunurken [lover.GetSheHe] durdu.\n\n"I want to be useful," [lover.GetSheHe] said. "I exist in your court," [lover.GetFirstNameNoTooltip] said pointedly, "but I have nothing to do. No purpose other than to serve you." "

 lmf_lover.1085.desc.target:0 "[lover.GetSheHe|U] derin bir nefes aldı. "I want to be your [lover.Custom('GetTargetCourtPosition')]."\n\nI was surprised, admittedly. "Oh, is that all?"\n\n"I'm serious! "

 lmf_lover.1085.desc.bodyguard:0 "Gece gündüz seninle olan biri senden daha iyi kim muhafızlık edebilir? "

 lmf_lover.1085.desc.lady:0 "Bir düşün! Gece gündüz sana hizmet ederdim ve kimse buna karşı konuşamazdı! "

 lmf_lover.1085.desc.oldholder:0 "Sana, [old_holder.GetTitledFirstNameNoTooltip]'in asla olamayacağı kadar sadakatle hizmet ederim! "

 lmf_lover.1085.desc.noholder:0 "Mevki hâlâ açık, değil mi? "

 lmf_lover.1085.desc.backup:0 "Ya da... ya da belki onun yerine senin [lover.Custom('GetBackupCourtPosition')]'in olabilirim? "

 lmf_lover.1085.desc.onlybackup:0 "[lover.GetSheHe|U] derin bir nefes aldı. "I want to be your [lover.Custom('GetBackupCourtPosition')]."\n\nI was surprised, admittedly. "Oh, is that all?"\n\n"I'm serious! "

 lmf_lover.1085.desc.nothing:0 "Ona nasıl #EMP hizmet edebileceğini#! sordum; ama o ne diyeceğini bilemedi. ""

 lmf_lover.1085.desc.end:0 "Lütfen, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)], #EMP bir şeyler#!! yapmak istiyorum."\n\nI could tell [lover.GetSheHe] wasn't about to let this go, and that the evening wouldn't progress until I answered."

 lmf_lover.1085.a:0 ""Very well, you may be my [lover.Custom('GetTargetCourtPosition')].""

 lmf_lover.1085.b:0 ""Very well. [old_holder.GetTitledFirstNameNoTooltip] will step aside for you.""

 lmf_lover.1085.a.lady_in_waiting_soulmate:0 ""What a pair we shall make!""

 lmf_lover.1085.a.lady_in_waiting_lover:0 ""Ahem, yes you may attend me.""

 lmf_lover.1085.a.bodyguard_soulmate:0 "#EMP Ah, yiğit Patroclus'um...#!"

 lmf_lover.1085.a.bodyguard_lover:0 ""You must never leave my side, [lover.GetFirstNameNoTooltip].""

 lmf_lover.1085.c:0 ""You may be my [lover.Custom('GetBackupCourtPosition')], then.""

 lmf_lover.1085.d:0 ""Why not join the ranks of my [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]?""

 lmf_lover.1085.e:0 ""No, this wouldn't be appropriate.""

 lmf_lover.1086.title.tt:0 "Bozulan Söz"

 lmf_lover.1086.desc:0 "[lover.GetFirstNameNoTooltip]'e verdiğin sözü bozdun; [lover.GetHerHis] sarayındaki görevini geri aldın."

 lmf_lover.1090.opening:0 "Zavallı aşkım,"

 lmf_lover.1090.desc:0 "Bu mektup sana ulaşıyorsa, rüşvet verdiğim genç asker sözünü tutmuş ve [my_imprisoner.GetTitledFirstNameNoTooltip] ([my_imprisoner.GetHerHis] adına tükürüyorum) bir şeyden habersiz demektir.\n\nHapsedildiğini öğrenir öğrenmez yazdım. Keşke bir kaçış yolu ayarlayabilseydim! Ne yazık ki yapabileceğim tek şey sana teselli sözleri sunmak ve yakında serbest bırakılman için dua etmek.\n\nYeniden bir araya geleceğimiz o anı bekleyeceğim."

 lmf_lover.1090.a:0 "[lover.GetHerHim] düşünceleri burada vakit geçirtir."

 lmf_lover.1095.t:0 "Soğuyan Ateş"

 lmf_lover.1095.desc:0 "[lover.GetFirstNameNoTooltip] ile ilk âşık olduğumuzda, gerçek ruh eşimi bulduğumdan öylesine emindim ki. Şimdi mi? O kadar emin değilim.\n\nDuygularımızın hâlâ güçlü olduğunu inkâr etmiyorum; ama [lover.GetHerHim]'i düşündüğümde yüzüm kızarmıyor. [lover.GetSheHe|U] günün her saatinde düşüncelerimi işgal etmiyor... ve [lover.GetHerHis] gözlerinin içine baktığımda [lover.GetSheHe]'in de aynı şeyleri hissettiğini anlayabiliyorum.\n\nBelki bu normaldir; aşkın zamanla başına gelen bir şey. Ya da belki aşkımızın ateşini canlı tutmak için yeterince çabalamadığım içindir. Bu, biraz çabayla düzeltilebilir mi?\n\nPeki bu, artık istediğim bir şey mi?"

 lmf_lover.1095.a:0 "Duygular değişir."

 lmf_lover.1095.b:0 "Elimden gelirse, aşkımızdaki kıvılcımı yeniden canlandırmayı dene."

 lmf_lover.1095.b.success.tt:0 "Tutkuyu yeniden alevlendirmeyi başarıyorsun"

 lmf_lover.1095.b.failure.tt:0 "Girişimlerin yalnızca işleri daha da kötüleştiriyor"

 lmf_lover.1098.t:0 "Gizli [my_bastard.Custom('GetDaughterSon')|U]"

 lmf_lover.1098.courtier:0 "[lover.GetFirstNameNoTooltip] bugün benimle görüşmek istediğinde şaşırdım; bir buluşma ayarlamamıştık. "

 lmf_lover.1098.notcourtier:0 "[lover.GetFirstNameNoTooltip] bugün [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gelip benimle görüşmek istediğinde şaşırdım; onu beklemiyordum. "

 lmf_lover.1098.start:0 "[my_bastard.Custom('polite_gender_ref')]'in arkadan geldiğini görünce daha da şaşırdım: [my_bastard.GetFirstNameNoTooltip], onun [my_bastard.Custom('GetDaughterSon')]'i "

 lmf_lover.1098.notsecret:0 "ve gizlice benim de.\n\nSessiz duran [my_bastard.GetFirstNameNoTooltip]'i bana gösterdi ve sonra gözlerimin içine baktı. "It's time that people knew who [my_bastard.GetHerHis] father is."\n\n"

 lmf_lover.1098.secret:0 ".\n\nSessiz duran [my_bastard.GetFirstNameNoTooltip]'i bana gösterdi ve sonra sadece şunları söyledi,"It's time you knew that [my_bastard.GetSheHe]'s your [my_bastard.Custom('GetDaughterSon')], as well." I'd always suspected, but I was shocked to hear it stated so plainly?\n\nYet she wasn't done. "It's also time that people knew who [my_bastard.GetHerHis] father is."\n\n"

 lmf_lover.1098.criminal:0 "[lover.GetFirstNameNoTooltip]'i böyle bir ifşanın getireceği ciddi sonuçlar konusunda uyarmaya çalıştım; ama o her zamanki gibi kararlıydı. "This isn't about what happens to me," she said. "This is about [my_bastard.GetHerHis] future, as well as the truth.""

 lmf_lover.1098.notcriminal:0 "Onca zamanın ardından neden şimdi böyle cüretkâr bir talepte bulunmayı seçtiğini sordum. "This isn't about me, or even you," she said. "This is about [my_bastard.GetHerHis] future. [my_bastard.GetSheHe|U] deserves to come out of hiding.""

 lmf_lover.1098.a:0 "Onu bunu yapmaması için ikna et. Şimdi değil."

 lmf_lover.1098.a.success:0 "İkna oldu, her ne kadar bundan memnun olmasa da"

 lmf_lover.1098.a.failure:0 "Senin onayın olmadan gerçeği ifşa ediyor"

 lmf_lover.1098.b:0 "Bunu yaparsa, hükümdarı olarak onu tehdit et."

 lmf_lover.1098.b.angry:0 "Kudurmuş durumda; ama geri adım atıyor"

 lmf_lover.1098.b.dumped:0 "Sırrı ifşa etmeyecek; ama bitti"

 lmf_lover.1098.c:0 "Belki haklıdır. Zamanı geldi."

 lmf_lover.1098.c.tt:0 "[lover.GetFirstNameNoTooltip]'e uygulanan tüm suçları otomatik olarak affedeceksin"

 lmf_lover.1100.t:0 "Gözler Ödülde"

 lmf_lover.1100.desc.start:0 "Bu akşamki gayretin teri soğurken, [lover.GetFirstNamePossessiveNoTooltip] aklından bir şey geçtiğini hemen anlayabiliyordum. [lover.GetSheHe|U]'in gözlerinde, [lover.GetSheHe] bir şey istediğinde takındığı o bakış vardı.\n\n"I saw "

 lmf_lover.1100.desc.jewelry:0 "en harika mücevher parçası "

 lmf_lover.1100.desc.sword:0 "en muhteşem kılıç "

 lmf_lover.1100.desc.book:0 "en inanılmaz kitap "

 lmf_lover.1100.desc.manuals:0 "en dikkat çekici kılavuz dizisi "

 lmf_lover.1100.desc.robe:0 "o kadar özenle işlenmiş inanılmaz bir cübbe "

 lmf_lover.1100.desc.end:0 "bugün çarşıda. Onu çok istedim, elbette #EMP çok#! pahalı olsa da..."\n\nThe intention was clear: [lover.GetFirstNameNoTooltip] wanted me to get it for [lover.GetHerHim] as a gift. In fact, before the evening was even over, [lover.GetSheHe] was practically pleading for [lover.GetHerHis] coveted prize. "Surely it's not too much to ask for, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)]? You adore me, do you not?""

 lmf_lover.1100.a:0 "[lover.GetHerHim]'i daha da #EMP pahalı#! bir şeyle şaşırtacağım!"

 lmf_lover.1100.b:0 "Dayanamayıp [lover.GetHerHim]'e hediyeyi ver."

 lmf_lover.1100.c:0 "[lover.GetSheHe] şaka mı yapıyor? Kesinlikle hayır!"

 lmf_lover.1105.t:0 "Ağır Hakaret"

 lmf_lover.1105.desc.start:0 "[lover.GetFirstNameNoTooltip] öfkeden köpürerek odaya daldığında, ilk başta sebebin ben olduğumu sandım.\n\nAma hayır, meğer [lover.GetSheHe] [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_courtier'))] ile bir sürtüşme yaşamış. "

 lmf_lover.1105.desc.relation:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('my_courtier'))] "

 lmf_lover.1105.desc.norelation:0 "[my_courtier.GetWomanMan] "

 lmf_lover.1105.desc.end:0 "[lover.GetSheHe]'in kulağına gelen bir yorum yaptı; hadi buna... pek de nazik olmayan bir yorum diyelim. Bu bir yüzleşmeye, ardından bağrışmaya yol açtı; şimdi [lover.GetFirstNameNoTooltip] bana [my_courtier.GetFirstNameNoTooltip]'in [lover.GetHerHim] hakkında '[ROOT.Char.Custom('FortifiedBuilding')]'de dolaşıp yalanlar yaydığını' söylüyor.\n\nSanırım bu kaçınılmazdı; zira saraydaki herkes ilişkimizi biliyor. Bana bir şey söyleyemiyorlar; ama [lover.GetHerHim]'e?\n\n[lover.GetFirstNameNoTooltip] tam olarak bir şey yapmamı istemedi; ama [lover.GetSheHe]'in yapmam gerektiğini düşündüğünü anlayabiliyorum."

 lmf_lover.1105.a:0 "[my_courtier.GetFirstNameNoTooltip]'i göndereceğim. Derhal."

 got_me_kicked_from_court:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetSheHe] [CharYouHerHim(TARGET_CHARACTER)]'i aşağıladıktan sonra [CHARACTER.GetShortUIName]'in saraydan atılmasını sağladı."

 got_me_kicked_from_court_corresponding:0 "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetSheHe] [CharYouHerHim(CHARACTER)]'i aşağıladıktan sonra [TARGET_CHARACTER.GetShortUIName]'in saraydan atılmasını sağladı."

 lmf_lover.1105.b:0 "[my_courtier.GetFirstNameNoTooltip] bu hakaret için ağır biçimde azarlanacak."

 lmf_lover.1105.b.success:0 "[my_courtier.GetFirstNameNoTooltip] hakkıyla pişman"

 lmf_lover.1105.b.failure:0 "Şimdi [my_courtier.GetFirstNameNoTooltip] ikinize de kızgın"

 got_me_reprimanded_unjustly:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetFirstNameNoTooltip] onları aşağıladıktan sonra [CHARACTER.GetShortUIName]'in haksız yere azarlanmasını sağladı."

 got_me_reprimanded_unjustly_corresponding:0 "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetFirstNameNoTooltip] onları aşağıladıktan sonra [TARGET_CHARACTER.GetShortUIName]'in haksız yere azarlanmasını sağladı."

 reprimanded_me_unjustly:0 "[TARGET_CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetHerHisMy] sevgilisine yapılan bir hakaret yüzünden [CHARACTER.GetShortUIName]'i haksız yere azarladı."

 reprimanded_me_unjustly_corresponding:0 "[CHARACTER.GetShortUIName|U], [CHARACTER.GetHerHisMy] sevgilisine yapılan bir hakaret yüzünden [TARGET_CHARACTER.GetShortUIName]'i haksız yere azarladı."

 lmf_lover.1105.c:0 "[lover.GetFirstNameNoTooltip] buna alışmak zorunda kalacak."

 insulted_lover:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetShortUIName]'i aşağıladı ve cezasız kaldı."

 insulted_lover_corresponding:0 "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName]'i aşağıladı ve cezasız kaldı."

 lmf_lover.1110.t:0 "Daima Yanımda"

 lmf_lover.1110.desc.start:0 "[lover.GetFirstNameNoTooltip] son günlerde hep yanımda.\n\nYa birlikte yataktayız, ya bahçelerde birlikte yürüyoruz, ya sarayda birlikteyiz... "

 lmf_lover.1110.desc.secret:0 "ilişkimizin gerçeğini gizli tutma zorunluluğuna rağmen, [lover.GetSheHe] her nasılsa her zaman yanımda olmayı başarıyor.\n\n"

 lmf_lover.1110.desc.public:0 "Ne de olsa ilişkimizi gizli tutmaya gerek yok; o yüzden [lover.GetHerHim]'i yanımdan uzak tutmaya da gerek yok.\n\n"

 lmf_lover.1110.desc.mid:0 "Mantıklı sayılır, düşününce "

 lmf_lover.1110.desc.courtier:0 "[lover.GetFirstNameNoTooltip]'in [lover.GetLiege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de [lover.GetHerHis] dikkatini meşgul edecek özel görevleri yok"

 lmf_lover.1110.desc.mycourtier:0 "[lover.GetFirstNameNoTooltip]'in burada sarayda [lover.GetHerHis] dikkatini meşgul edecek özel görevleri yok"

 lmf_lover.1110.desc.pool:0 "[lover.GetFirstNameNoTooltip]'in hükümdarı yok, dolayısıyla [lover.GetHerHis] dikkatini meşgul edecek görevleri de yok"

 lmf_lover.1110.desc.male:0 ", ve bir [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] değil.\n\n"

 lmf_lover.1110.desc.female:0 ", ve büyütecek çocuğu yok.\n\n"

 lmf_lover.1110.desc.end:0 "Yine de, birlikte geçirdiğimiz zamandan keyif alsam da, [ROOT.Char.GetTitleAsNameNoTooltip] olarak kendi görevlerimden oldukça... alıkoyuyor. Elbette [lover.GetHerHim]'e bunu asla söylemem; ama bu böyle sürerse söylemek zorunda kalabilirim; yoksa [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'e olan dikkatim zarar görecek."

 lmf_lover.1110.a:0 "Ne olmuş? Bu oyalanmayı seviyorum."

 lmf_lover.1110.b:0 "[lover.GetHerHim]'i gönder. Görevlerime odaklanmam gerekiyor."

 lmf_lover.1115.t:0 "Sürpriz Bir Ziyaret"

 lmf_lover.1115.desc.start:0 "[lover.GetFirstNameNoTooltip]'i ve [lover.GetHerHim]'i görme fırsatını ne kadar nadir yakaladığımı düşünüyordum; karşımda kim mi belirdi? [lover.GetSheHe] saraya girdiğinde ve beni görünce [lover.GetHerHis] yüzünde ışıl ışıl bir gülümseme belirdiğinde neredeyse inanamadım.\n\n"What are you doing here?" I asked, still in shock. "

 lmf_lover.1115.desc.courtier:0 ""I thought you were still in [lover.GetLiege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]!"\n\n"

 lmf_lover.1115.desc.away:0 ""Last I heard, you were still in [lover.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]!"\n\n"

 lmf_lover.1115.desc.local:0 ""I knew you were still in [lover.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], but I didn't expect to see you!"\n\n"

 lmf_lover.1115.desc.mid:0 ""I had a feeling you missed me," [lover.GetSheHe] said. "Why? Are you going to turn me away?"\n\nI answered that with a laugh, taking [lover.GetHerHis] hand and leading [lover.GetHerHim] up the stairs. "

 lmf_lover.1115.desc.secret:0 "Normalde bunun hakkında çok gizli davranmamız gerekirdi; ama "

 lmf_lover.1115.desc.public:0 "Gizli olmamıza gerek yoktu, ne de olsa; ama yine de "

 lmf_lover.1115.desc.end:0 "[ROOT.Char.Custom('FortifiedBuilding')]'de bir kez olsun sessiz bir gündü. Sonuç, ikimizin de kolay kolay unutamayacağı bir akşam oldu."

 lmf_lover.1115.a:0 "Sürprizleri severim!"

 lmf_lover.1120.t:0 "Bahçede Bir Gün"

 lmf_lover.1120.desc.start:0 "[lover.GetFirstNameNoTooltip] sarayımın bir parçası olsa da, günü birlikte geçirmemiz pek sık olmuyor. "

 lmf_lover.1120.desc.secret:0 "Gizlilik ihtiyacı, şüphe uyandırmamak için mümkün olduğunca ayrı vakit geçirmemizi gerektiriyor, aslında.\n\n"

 lmf_lover.1120.desc.public:0 "İlişkimiz herkesçe bilinse de, görev beni [lover.GetHerHis] yanından, edep de öyle, uzak tutuyor.\n\n"

 lmf_lover.1120.desc.end:0 "Ne var ki bugün, çoğu gün gibi değildi. [ROOT.Char.Custom('FortifiedBuilding')]'de bir kez olsun sessizlik vardı ve sarayın çoğu başka meselelerle meşguldü. [lover.GetFirstNameNoTooltip] sessizce yanıma geldi. "I know just the place we can be alone," [lover.GetSheHe] whispered.\n\n[lover.GetSheHe|U] took me deep into the gardens, and though I looked around for the groundskeepers, I saw none.\n\n"I sent them away," [lover.GetFirstNameNoTooltip] said.\n\nHow [lover.GetSheHe] managed such a feat, I didn't ask and didn't care, as the day that followed is one neither of us is likely to soon forget."

 lmf_lover.1120.a:0 "O bahçeyi #EMP gerçekten#! seviyorum."

 lmf_lover.1130.t:0 "Kamp'ta Çalınmış Bir An"

 lmf_lover.1130.desc:0 "Uzun bir günün ardından ordu [army_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de kamp kurmuştu. Geç olmuştu; askerlerin ve [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ların çoğu çoktan çadırlarına çekilmişti; ben de az sonra onlara katılacaktım.\n\nDerken [lover.GetFirstNameNoTooltip] beliriverdi; sanki hiç yoktan; [lover.GetSheHe] [lover.GetHerHis] miğferini çıkardığında yüzündeki muzip sırıtış görünüyordu. "Come with me," [lover.GetSheHe] said.\n\nFor a moment, I thought something might be amiss. When [lover.GetFirstNameNoTooltip] led me to a more secluded part of the camp and began to remove [lover.GetHerHis] armor, I knew that was very much not the case.\n\n"The soldiers might see us," I warned with a chuckle.\n\n"See what? Two [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] in love? Why should they care?" With that, my resistance crumbled, and it's a good thing it did."

 lmf_lover.1130.a:0 "Kampın bu kadar eğlenceli olabileceğini kim bilirdi?"

 lmf_lover.1135.t:0 "Kırık Çark"

 lmf_lover.1135.desc.start:0 "Vagonlardan birinin tekerleği kırılmış, diyorlar; yolculuğumuz için büyük bir gecikme anlamına gelmeyecekti; ama yine de başkalarının bir şeyleri tamir etmesini bekleyerek epey ayakta dikilmek demekti.\n\nDerken, hiç yoktan, [lover.GetFirstNameNoTooltip] arkamda beliriverdi. "I have an idea," [lover.GetSheHe] said with a wink.\n\nI wasn't certain what [lover.GetSheHe] meant until I spotted the basket and blanket on [lover.GetHerHis] arm. I let [lover.GetHerHim] lead me to a secluded spot nearby, away from the prying eyes of our entourage, and after laying down the blanket [lover.GetFirstNameNoTooltip] began to remove [lover.GetHerHis] clothes.\n\n"

 lmf_lover.1135.desc.cold:0 ""A little cold for that here, isn't it?" I laughed.\n\n"Not if you're next to me," [lover.GetSheHe] smiled. "

 lmf_lover.1135.desc.sand:0 ""Careful you don't get sand into... places," I laughed.\n\n"I'll need you to check," [lover.GetSheHe] smiled. "

 lmf_lover.1135.desc.bugs:0 ""Not worried about the insects, I see," I laughed.\n\n"Not if you're next to me," [lover.GetSheHe] smiled. "

 lmf_lover.1135.desc.default:0 ""You know, anyone could come by and see us," I laughed.\n\n"Then they'll get quite the show," [lover.GetSheHe] smiled. "

 lmf_lover.1135.desc.end:0 "Bu, reddedemeyeceğim bir teklif oldu."

 lmf_lover.1135.a:0 "Seyahat etmeyi gerçekten seviyorum."

 lmf_lover.1140.opening:0 "Sevgilim,"

 lmf_lover.1140.courtier:0 "Bu konuyu uzun uzun düşündüm ve [lover_liege.GetTitledFirstNamePossessiveNoTooltip] sarayından ayrılıp şunu istiyorum: "

 lmf_lover.1140.pool:0 "Bu konuyu uzun uzun düşündüm ve şunu istiyorum: "

 lmf_lover.1140.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de sana katılmak.\n\n"

 lmf_lover.1140.spouse:0 "[lover_spouse.GetFirstNameNoTooltip] benimle gelmeye razı ve hiçbir şey bilmiyor, [lover_spouse.GetHerHim] için endişelenme. "

 lmf_lover.1140.bastard:0 "[my_bastard.GetFirstNameNoTooltip]'in büyüyeceği bir yere ve [my_bastard.GetHerHis] [ROOT.Char.GetMotherFather]'ini tanımaya ihtiyacı var. Ayrıca,"

 lmf_lover.1140.child:0 "[my_bastard_courtier.GetFirstNameNoTooltip] için o kadar endişeleniyorum ki. [my_bastard_courtier.GetHerHim]'e daha yakın olmak istiyorum"

 lmf_lover.1140.mid:0 "Sana yakın olmamın önemli olduğunu düşünüyorum"

 lmf_lover.1140.public:0 ". Zaten sana ne olduğumu herkes biliyor. Saraydaki bakışlarla başa çıkabilirim.\n\n"

 lmf_lover.1140.myspouse:0 ", bu [ROOT.Char.GetPrimarySpouse.GetTitledFirstNamePossessiveNoTooltip] gözlerinin tüm süre boyunca üzerimde olacağı anlamına gelse bile. Umurumda değil, senin de umurunda olmamalı.\n\n"

 lmf_lover.1140.secret:0 ", gizlice âşık olmaya devam etmemiz gerekse bile. Umurumda değil, senin de umurunda olmamalı.\n\n"

 lmf_lover.1140.end:0 "Lütfen bunu yap. Benim için. İkimiz için."

 lmf_lover.1140.a:0 "Elbette [lover.GetSheHe] burada hoş karşılanır."

 lmf_lover.1140.b:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gelip kalmak mı? Hiç sanmam!"

 lmf_lover.1145.t:0 "[my_spouse.GetWifeHusband|U]'imi Kıskanıyor"

 lmf_lover.1145.desc.start:0 "Akşamın gayretiyle oluşan terimiz soğurken bile [lover.GetFirstNameNoTooltip]'te bir terslik olduğunu biliyordum. [lover.GetSheHe|U] akşam boyunca sessizdi; yatağa girip sevişirken de dalgındı.\n\n"You love [my_spouse.GetHerHim] more than you love me," [lover.GetSheHe] finally blurted out.\n\nI was startled, and truthfully said I had no idea who [lover.GetSheHe] was referring to.\n\n"Your [my_spouse.GetWifeHusband]!" [lover.GetSheHe] snapped angrily. "

 lmf_lover.1145.desc.soulmate:0 ""I see the way you are when you're with [my_spouse.GetHerHim]. The [my_spouse.GetTitleAsNameNoTooltip|l] is your true soulmate, and everyone knows it!"\n\n"

 lmf_lover.1145.desc.bestfriend:0 ""I see the way you act around [my_spouse.GetHerHim]. The two of you are so at ease, it's like you're best friends! With your [my_spouse.GetWifeHusband]! Who ever heard of such a thing?!"\n\n"

 lmf_lover.1145.desc.lover:0 ""I see the way you are with the [my_spouse.GetTitleAsNameNoTooltip|l]. The touching, the little smiles you exchange! How could I hope to compete with [my_spouse.GetHerHim]?!"\n\n"

 lmf_lover.1145.desc.friend:0 ""I see the way you act around the [my_spouse.GetTitleAsNameNoTooltip|l]. The two of you are so at ease, so friendly! How could I hope to compete with [my_spouse.GetHerHim]?!"\n\n"

 lmf_lover.1145.desc.ruler:0 ""It's because [lover.GetSheHe]'s a high and mighty [my_spouse.GetTitleAsNameNoTooltip|l], off in [my_spouse.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], isn't it? And I'm no-one. How could I ever hope to compete with [my_spouse.GetHerHim]?!"\n\n"

 lmf_lover.1145.desc.smart:0 ""It's because [lover.GetSheHe]'s smarter than I am, isn't it? Oh, the [my_spouse.GetTitleAsNameNoTooltip|l] is soooo brilliant, everyone says so! How could I hope to compete with that?!"\n\n"

 lmf_lover.1145.desc.pretty:0 ""It's because [lover.GetSheHe]'s more [Select_CString( my_spouse.IsFemale, 'beautiful', 'handsome' )] than I am, isn't it? Admit it! Everyone already says so! How could I hope to compete?!"\n\n"

 lmf_lover.1145.desc.end:0 "[lover.GetFirstNamePossessiveNoTooltip] kıskançlık dolu atışması sürerken, [lover.GetSheHe] giderek daha da mantıksızlaştı; ta ki sonunda öfkeyle çekip gidene dek."

 lmf_lover.1145.a:0 "[lover.GetHerHim]'i, [my_spouse.GetWifeHusband]'imin bir tehdit olmadığına ikna etmeye çalışmalıyım."

 lmf_lover.1145.a.success:0 "[lover.GetHerHim]'i ikna etmeyi başarıyorsun... çoğunlukla"

 lmf_lover.1145.a.failure:0 "Artık [lover.GetFirstNameNoTooltip] de sana kudurmuş durumda"

 lover_jealousy:0 "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName|U]'ye karşı inanılmaz derecede kıskançlık duymaya başladı."

 lover_jealousy_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetShortUIName|U]'ye karşı inanılmaz derecede kıskançlık duymaya başladı."

 lmf_lover.1145.b:0 "[my_spouse.GetFirstNameNoTooltip] benim [my_spouse.GetWifeHusband]'im. Ne yapalım, durum bu."

 lmf_lover.1150.desc:0 "[lover.GetFirstNameNoTooltip] ile ilk âşık olduğumuzda, gerçek ruh eşimi bulduğumdan öylesine emindim ki. Şimdi mi? O kadar emin değilim.\n\nArtık gerçekten âşık olduğumuzu söyleyebilir miyiz, ondan bile emin değilim. Ah, [lover.GetHerHim]'e hâlâ sevgi duyuyorum ve [lover.GetSheHe]'in de bana aynısını hissettiğine inanıyorum; ama [lover.GetSheHe] düşüncelerimi işgal ediyor mu? Kalbim [lover.GetHerHim] için yanıyor mu? Ne yazık ki, hayır.\n\nBunun ilişkimizin yavaşça sona erdiği anlamına gelip gelmediğini söyleyemem. En ufak bir şüphe olmadan söylenebilecek şey şu: [lover.GetFirstNameNoTooltip] ve ben artık kendimizi ruh eşi sayamayız."

 lmf_lover.1155.t:0 "Güvenilmez Sevgili mi?"

 lmf_lover.1155.desc:0 "Doğru olabilir mi?\n\n[lover.GetFirstNameNoTooltip]'in yakın zamanda [my_rival.GetTitledFirstNameNoTooltip] ile temasa geçtiğine dair raporlar aldım. [lover.GetSheHe] neden benim bir rakibime mektup yazsın, hiçbir fikrim yok. [lover.GetSheHe|U] bunu yaptığını reddediyor; meseleyi daha yakından araştırtmaya çalıştıysam da her şeyin bir söylenti olması çok mümkün... [lover.GetFirstNameNoTooltip]'in öne sürdüğüne göre, bu söylentiyi kuşkusuz [lover.GetHerHis] iyi adını lekelemek isteyen biri yaymış.\n\nGerçeği doğrulamanın yolu olmadığından, [lover.GetHerHis] sözüne güvenmekten başka çarem yok; ama bu beni içten içe yiyor. Bir şeylerin doğru olmadığını biliyorum. Ortada bir tür dolaplar dönüyor."

 lmf_lover.1155.a:0 "Umarım bir şey çıkmaz."

 lmf_lover.1156.opening:0 "Sevgilim [lover.Custom2('GreetingToGenericPositive', ROOT.Char )],"

 lmf_lover.1156.stranger:0 "Beni tanımıyorsun; ama "

 lmf_lover.1156.start:0 "Sende [player_rival.GetTitledFirstName] hakkında çok ilgini çekebilecek bazı bilgiler var, zira seninle [player_rival.GetSheHe]'in rakip olduğunuz herkesçe biliniyor.\n\nKarşılığında istediğim tek şey, zahmetim için küçük bir miktar altın ve beni asla anmaman: "

 lmf_lover.1156.know:0 "bu, sevgilin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('lover'))|l]'den geldi."

 lmf_lover.1156.stranger2:0 "bu bilgiyi aldığın kişi."

 lmf_lover.1156.a:0 "[player_rival.GetTitledFirstNameNoTooltip]'in bir sırrı mı var? Evet, lütfen!"

 lmf_lover.1156.b:0 "Bununla ilgim yok. Defol."

 lmf_lover.1160.t:0 "Alevler Nasıl Körüklenir?"

 lmf_lover.1160.desc:0 "Aklıma geliyor ki son zamanlarda [lover.GetFirstNameNoTooltip]'i pek görmüyorum. Aramızda yanlış bir şey yok, en azından benim bildiğim kadarıyla. İkimiz de sadece başka şeylerle meşgulüz.\n\n[ROOT.Char.Custom('FortifiedBuilding')] şu an alışılmadık biçimde sessizken, belki de aşkımızın alevlerini körüklemek için bir fırsatım var? Elbette gereken tek şey biraz çaba, değil mi? Ne kadar zor olabilir ki?"

 lmf_lover.1160.a:0 "[lover.GetHerHim]'e bir şiir yazacağım!"

 lmf_lover.1160.a.success:0 "[lover.GetSheHe|U] şiire bayılıyor"

 lmf_lover.1160.a.failure:0 "[lover.GetSheHe|U] şiirsel çabaların eğlendiriyor"

 lmf_lover.1160.b:0 "Sadece birlikte daha çok vakit geçirmemiz gerekiyor, hepsi bu."

 lmf_lover.1160.b.success:0 "Birlikte geçirilen zaman tam da ihtiyacın olan şey"

 lmf_lover.1160.b.failure:0 "[lover.GetSheHe|U] bu jesti takdir ediyor"

 lmf_lover.1160.c:0 "[lover.GetHerHim]'e [lover.GetSheHe]'in bayılacağı gösterişli bir şey alacağım."

 lmf_lover.1160.c.success:0 "[lover.GetSheHe|U] hediyeye bayılıyor"

 lmf_lover.1160.c.failure:0 "[lover.GetSheHe|U] hediye için minnettar ama daha fazlası değil"

 lmf_lover.1160.d:0 "Belki birlikte vahşi doğada yürüyüş yapmak?"

 lmf_lover.1160.d.success:0 "Yürüyüş, mükemmel bir baş başa zaman oluyor"

 lmf_lover.1160.d.failure:0 "[lover.GetSheHe|U] her şeyden çok yürüyüşten rahatsız oluyor"

 lmf_lover.1160.e:0 "Yatak odasında işleri kızıştırmanın zamanı geldi!"

 lmf_lover.1160.e.success:0 "[lover.GetSheHe|U] çabalarından büyüleniyor"

 lmf_lover.1160.e.failure:0 "[lover.GetSheHe|U] çabaların onu soğutuyor"

 lmf_lover.1160.f:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in en hareketli meyhanesine gideceğiz, kılık değiştirerek!"

 lmf_lover.1160.f.success:0 "Gece gezmesi büyük bir başarı!"

 lmf_lover.1160.f.failure:0 "[lover.GetSheHe|U] akşam için minnettar ama daha fazlası değil"

 lmf_lover.1160.g:0 "Buna gerek yok. Olduğumuz gibi iyiyiz."

 lmf_lover.1165.t:0 "Alev Almak"

 lmf_lover.1165.desc.start:0 "Son zamanlarda kendimi [lover.GetFirstNamePossessiveNoTooltip] eşliğinde giderek daha fazla zaman geçirirken buluyorum.\n\n"

 lmf_lover.1165.desc.secret:0 "Elbette kimsenin bir şeyden haberdar olmamasını sağlamak için dikkatli olmalıyız... yine de bu o kadar zor görünmüyor. Ya da belki istediğim için kendimi kandırıyorum, bilmiyorum.\n\n"

 lmf_lover.1165.desc.public:0 "Belki de herkes ilişkimizi zaten bildiği içindir. Parmak uçlarında dolaşmaya gerek yok; ama bunun tamamen bu olduğunu sanmıyorum.\n\n"

 lmf_lover.1165.desc.end:0 "Gerçek şu ki [lover.GetSheHe] ile pek çok yönden birbirimize benziyoruz. [lover.GetSheHe]'in başladığım bir cümleyi tamamlayabilmesi neredeyse komik. Her zaman bu kadar iyi gideceğini sanmıyorum; ama şimdilik? İkimiz için de yeterli görünüyor."

 lmf_lover.1165.a:0 "Bunun nereye varacağını görmek ilgimi çekiyor."

 lmf_lover.1165.b:0 "Belki bu, ilk düşündüğümüzden daha ciddi..."

 lmf_lover.1165.c:0 "Bunun ilerlemesine gerek yok."

 lmf_lover.1170.t:0 "Geçen Bir Gölge"

 lmf_lover.1170.desc.start:0 "[lover.GetFirstNameNoTooltip] hasta.\n\n"

 lmf_lover.1170.desc.courtier:0 "Az önce [lover.GetHerHim]'i görmek için [lover.GetHerHis] odasına uğradım; [lover.GetSheHe] ateşin etkisiyle sayıklıyordu. [lover.GetSheHe|U] defalarca adımı inledi ve [lover.GetSheHe] beni fark ettiği anda umutsuz bir el uzatıp yaklaşmam için yalvardı.\n\nElbette kalamadım; şimdi ise kalmam gerekir miydi diye düşünüyorum. "

 lmf_lover.1170.desc.pool:0 "[lover.GetSheHe|U] son buluşmamıza gelmedi, o yüzden araştırma başlattım. Az önce haber aldım; [lover.GetSheHe] şu anda [lover.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'in bir yerlerinde, ateş ve [ROOT.Char.GetFaith.FertilityGodName] bilir başka nelerle boğuşuyor.\n\n[lover.GetSheHe|U]'in bir hekime ihtiyacı var ve [lover.GetSheHe] hekime ancak [lover.GetHerHim]'i buraya, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e getirirsem kavuşacak. "

 lmf_lover.1170.desc.secret:0 "Bunu yapmak bizi ifşa etme riskini taşır elbette... [lover.GetFirstNamePossessiveNoTooltip] yanındaki sürekli varlığımı nasıl açıklamaya başlardım ki?\n\n"

 lmf_lover.1170.desc.public:0 "[lover.GetFirstNameNoTooltip]'in kim olduğunu ne de olsa herkes biliyor. Artık saklayacak hiçbir şeyimiz yok. Risk ettiğim tek şey [lover.GetHerHis] hastalığına yakalanmak.\n\n"

 lmf_lover.1170.desc.end:0 "[lover.GetHerHim]'in orada yattığını, belki de ölmek üzere olduğunu düşünmek acı veriyor; [lover.GetSheHe] uyanık ve ayıkken ise ben hiçbir yerde görünmüyorum. [lover.GetSheHe] bunu atlatırsa ve en çok ihtiyaç duyduğu anda yanında olmadıysam, [lover.GetSheHe] bilecek."

 lmf_lover.1170.a:0 "Elbette [lover.GetHerHis] başucunda kalacağım!"

 lmf_lover.1170.a.success:0 "Özenli açıklaman kabul ediliyor"

 lmf_lover.1170.a.fail:0 "Herkes açıklamanı görüyor"

 lmf_lover.1170.b:0 "[lover.GetHerHim]'i derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e getirt!"

 lmf_lover.1170.c:0 "[lover.GetSheHe|U] diğer saraylılar gibi tedavi görecek."

 lmf_lover.1170.d:0 "[lover.GetSheHe|U] olduğu yerde idare etmek zorunda kalacak."

 lmf_lover.1175.t:0 "Öfkeden Kuduran [my_spouse.GetWifeHusband|U]"

 lmf_lover.1175.desc.start:0 "[my_spouse.GetTitledFirstNameNoTooltip], taht odası boşalana dek bekledi ve öyle fırtına gibi içeri girdi. [my_spouse.GetHerHis] gözlerindeki öfkeden bir şeylerin ters gittiğini hemen anladım.\n\n"You must end things with [my_spouse.Custom2('direct_address_by_familiarity', SCOPE.sC('lover'))]," [my_spouse.GetSheHe] snapped. "Immediately."\n\n"

 lmf_lover.1175.desc.secret:0 "İlk başta inkâr etmeye çalıştım; ama [my_spouse.GetSheHe] sözümü kesti. "I know about your affair. "

 lmf_lover.1175.desc.public:0 "Bilmiyormuş gibi yapmaya çalıştım; ama [my_spouse.GetSheHe] sözümü kesti. "Everyone in [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] knows the truth. "

 lmf_lover.1175.desc.mid:0 "Beni bir kez daha aşağılamaya cüret etme."\n\nThis escalated into a heated argument that lasted almost an hour. "For the sake of our marriage bed, for the sake of your own honor, I don't care why you end it but you #EMP must#! end it! "

 lmf_lover.1175.desc.courtier:0 "Buna son vermeli ve [lover.GetHerHim]'i [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den çok uzağa göndermelisin! "

 lmf_lover.1175.desc.end:0 "Eğer yapmazsan..."\n\n[my_spouse.GetSheHe|U] stopped, leaving the warning an implied one, before turning and storming out of the chamber."

 lmf_lover.1175.a:0 "Huzuru korumak için [my_spouse.GetSheHe]'in istediğini yapacağım."

 lmf_lover.1175.a.rivalry:0 "[lover.GetFirstNameNoTooltip], ilişkinin bitmesi için senin [my_spouse.GetWifeHusband]'ini suçluyor"

 spouse_made_lover_break_up:0 "[TARGET_CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetHerHis] eşini [CHARACTER.GetShortUIName] ile ayrılmaya zorladı."

 spouse_made_lover_break_up_corresponding:0 "[CHARACTER.GetShortUIName|U], [CHARACTER.GetHerHis] eşini [TARGET_CHARACTER.GetShortUIName] ile ayrılmaya zorladı."

 lmf_lover.1175.b:0 "[lover.GetFirstNameNoTooltip] uzaklaştırılacak ama ben ilişkiyi bitirmiyorum."

 spouse_had_me_kicked_out:0 "[TARGET_CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetHerHis] eşini [CHARACTER.GetShortUIName]'i saraydan kovmaya zorladı."

 spouse_had_me_kicked_out_corresponding:0 "[CHARACTER.GetShortUIName|U], [CHARACTER.GetHerHis] eşini [TARGET_CHARACTER.GetShortUIName]'i saraydan kovmaya zorladı."

 lmf_lover.1175.c:0 "[my_spouse.GetWifeHusband]'im tam olarak ne yapabilir ki? Reddediyorum."

 lmf_lover.1175.c.rivalry:0 "[my_spouse.GetTitledFirstNameNoTooltip] öfkesini [lover.GetFirstNameNoTooltip]'e çeviriyor"

 refused_to_dump_lover:0 "[TARGET_CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetHerHisMy] sevgilisiyle ilişkiyi kesmeyi reddetti."

 spouse_wont_dump_lover:0 "[CHARACTER.GetShortUINamePossessiveNoTooltip|U] [CHARACTER.Custom('WifeHusbandOpp')], [CHARACTER.Custom('GetHerHisOpposite')] sevgilisi [TARGET_CHARACTER.GetShortUIName] ile ilişkiyi kesmeyi reddetti."

 spouse_wont_dump_lover_corresponding:0 "[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip|U] [TARGET_CHARACTER.Custom('WifeHusbandOpp')], [TARGET_CHARACTER.Custom('GetHerHisOpposite')] sevgilisi [CHARACTER.GetShortUIName] ile ilişkiyi kesmeyi reddetti."

 lmf_lover.1180.t:0 "Gizliliğin Yükü"

 lmf_lover.1180.desc.start:0 "İlişkimizin [lover.GetFirstNameNoTooltip] üzerindeki etkisini görebiliyorum.\n\n"

 lmf_lover.1180.desc.honest:0 "[lover.GetSheHe|U] özünde dürüst bir [lover.GetWomanMan]; o yüzden defalarca yalan söylemek zorunda olmanın sıkıntısı "

 lmf_lover.1180.desc.just:0 "[lover.GetSheHe|U] doğru ve yanlış konusunda net fikirleri olan bir [lover.GetWomanMan] ve bir sırrı, hele de ahlaksız bir sırrı saklamak zorunda olmanın yükü "

 lmf_lover.1180.desc.paranoid:0 "Doğrusu [lover.GetSheHe|U] her zaman biraz paranoyak olmuştur; o yüzden bir gün yakalanırsak ne olacağına dair düşünceler "

 lmf_lover.1180.desc.craven:0 "Doğrusu [lover.GetSheHe|U] [lover.GetWomenMen]'in en cesuru değil; o yüzden bir gün yakalanırsak yaşanacak sonuçlara dair sürekli düşünceler "

 lmf_lover.1180.desc.intrigue:0 "[lover.GetHerHis] eğitimine bakılırsa, [lover.GetSheHe]'in sır saklamada daha iyi olacağı düşünülebilir; ama doğrusu bu [lover.GetHerHis] doğal eğilimi değil ve yalanlar "

 lmf_lover.1180.desc.bold:0 "[lover.GetSheHe] bu kadar cüretkârken, sır saklamanın ona zor gelmeyeceği düşünülebilir; ama sanırım [lover.GetWomenMen]'in en cüretkârı bile yıpranabilir ve yalanlar "

 lmf_lover.1180.desc.default:0 "Doğrusu [lover.GetSheHe|U] hileye ve entrikaya yatkın değil ve [lover.GetWomenMen]'in en cüretkârı sayılmaz; o yüzden sürekli yalan söylemek "

 lmf_lover.1180.desc.end:0 "açıkça [lover.GetHerHim]'i içten içe kemiriyor.\n\nBunun [lover.GetFirstNameNoTooltip]'i ne kadar strese soktuğunu görebiliyorum; öyle ki birbirimize duyduğumuz aşkı etkilemeye başladı ve bu konuda yapabileceğim hiçbir şey yok gibi görünüyor."

 lmf_lover.1180.a:0 "Keşke bu [lover.GetHerHim] için daha kolay olsaydı."

 lmf_lover.1185.t:0 "Günahın Yükü"

 lmf_lover.1185.desc.start:0 "İlişkimizin [lover.GetFirstNameNoTooltip] üzerindeki etkisini görebiliyorum.\n\n"

 lmf_lover.1185.desc.incest:0 "[lover.GetFaith.GetNameNoTooltip]'in her standardına göre [lover.GetHerHis] [lover.Custom2('LMF_RelationToMeShort', ROOT.Char )] ile yatmak bir günahtır, doğru. "

 lmf_lover.1185.desc.gay:0 "[lover.GetFaith.GetNameNoTooltip]'in her standardına göre başka bir [ROOT.Char.GetWomanMan] ile yatmak bir günahtır, doğru. "

 lmf_lover.1185.desc.married:0 "Bir [lover.GetWomanMan] tarafından işlenen zina yalnızca günah değil, aynı zamanda suçtur. "

 lmf_lover.1185.desc.unmarried:0 "Zinayla yakalanıp suçlanan bir [lover.GetWomanMan] mı? Yalnızca günah değil, aynı zamanda suç. "

 lmf_lover.1185.desc.secret:0 "Sırrımızı korumak için sürekli tetikte olmamız gerektiği gerçeği, [lover.GetSheHe]'in hissettiği strese yalnızca ekleniyor, eminim.\n\n"

 lmf_lover.1185.desc.public:0 "İlişkimizin açıktan açığa olmasının işleri kolaylaştıracağını, sonuçların çoktan yaşandığını düşünürdüm; ama durum tam tersi görünüyor.\n\n"

 lmf_lover.1185.desc.end:0 "[lover.GetFirstNamePossessiveNoTooltip] günahlarının [lover.GetHerHis] ruhuna yükü, [lover.GetHerHim]'i açıkça çok rahatsız ediyor. [lover.GetSheHe]'in hissettiği stresi görebiliyorum; etkileri her gün birbirimize duyduğumuz aşka sızıyor... ve görünüşe göre bu konuda yapabileceğim hiçbir şey yok."

 lmf_lover.1185.a:0 "Keşke bu [lover.GetHerHim] için daha kolay olsaydı."

 lmf_lover.1190.t:0 "Tüm Gözler [lover.GetHerHim|U]'in Üzerinde"

 lmf_lover.1190.desc:0 "İlişkimizin gizli olmamasının [lover.GetFirstNameNoTooltip] için işleri kolaylaştıracağını düşünürdüm.\n\nNe var ki durum öyle görünmüyor. [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] sevgilisi olmak, tüm gözlerin üzerinde olması demekti. [lover.GetFirstNameNoTooltip], nereye giderse gitsin sürekli yargılanıyormuş gibi hissettiğini söyledi.\n\n[lover.GetHerHim]'in hepsini sırtından atmasının basit bir mesele olmasını dilerdim; ama değil. Bunun stresi, ilişkimizi etkilediği kadar [lover.GetFirstNameNoTooltip]'i de açıkça etkiliyor. Ve görünüşe göre bu konuda yapabileceğim hiçbir şey yok."

 lmf_lover.1190.a:0 "Keşke bu [lover.GetHerHim] için daha kolay olsaydı."

 lmf_lover.1195.t:0 "Gizliliğin Yükü"

 lmf_lover.1195.desc.start:0 "[lover.GetFirstNameNoTooltip] ile ilişkimi gizli tutmanın üzerimde hiçbir etkisi olmadığını söyleyebilmeyi dilerdim; ama bu bir yalan olurdu.\n\n"

 lmf_lover.1195.desc.honest:0 "Doğrusu özümde dürüst bir [ROOT.Char.GetWomanMan]'im; o yüzden sürekli yalan söylemek ve sonra tüm o yalanları hatırlamak zorunda olmak "

 lmf_lover.1195.desc.just:0 "Güçlü bir adalet duygum var. Doğru ile yanlışın farkını bilirim. Bu kadar açıkça yanlış bir şey yapmak ve sonra yapmaya #EMP devam#! etmek "

 lmf_lover.1195.desc.paranoid:0 "Kaçınılmaz olarak yakalandığımızda ne olacağından başka bir şey düşünemiyorum. Biri bize baktığında, ne düşündüğünü çözmeye çalışıyorum. Bu çıldırtıcı ve "

 lmf_lover.1195.desc.craven:0 "Doğrusu [ROOT.Char.GetWomenMen]'in en cesuru olduğumu söyleyemem. Yakalandığımızda ne olacağı korkusu giderek büyüyor ve bu "

 lmf_lover.1195.desc.intrigue:0 "Eğitimimi düşününce, insan bu işte daha iyi olacağımı sanır; ama doğrusu entrika bana doğal gelmiyor. Sürekli aldatma "

 lmf_lover.1195.desc.bold:0 "Pek çok kişi bana cüretkâr der; bunda doğruluk payı var. Ama cüretkârlık tek başına insanı sorumluluktan kurtarmaz ve sürekli aldatma ihtiyacı "

 lmf_lover.1195.desc.default:0 "Doğrusu hile ve entrikadan hoşlanan biri değilim. [ROOT.Char.GetWomenMen]'in en cüretkârı da sayılmam; itiraf edeyim ki sürekli sinsilik ve yalan "

 lmf_lover.1195.desc.end:0 "beni içten içe yiyor.\n\n[lover.GetFirstNameNoTooltip] stresin beni nasıl etkilediğini görüyor ve elbette düşünmememi salık veriyor; ama elimde değil. [lover.GetSheHe]'in bu konuda kendimi iyi hissettirecek yapabileceği hiçbir şey yok."

 lmf_lover.1195.a:0 "Ne yapacağım ben?"

 lmf_lover.1200.t:0 "Günahın Yükü"

 lmf_lover.1200.desc.start:0 "[lover.GetFirstNameNoTooltip] ile ilişkim üzerimde bir etki yaratıyor; ne kadar öyle olmamasını dilesem de.\n\n"

 lmf_lover.1200.desc.incest:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('lover'))]'imle yatmak bir günahtır, doğru. "

 lmf_lover.1200.desc.gay:0 "Başka bir [lover.GetWomanMan] ile yatmak bir günahtır, doğru. "

 lmf_lover.1200.desc.married:0 "Bir [ROOT.Char.GetWomanMan] tarafından işlenen zina yalnızca günah değil, aynı zamanda suçtur. "

 lmf_lover.1200.desc.unmarried:0 "Zinayla yakalanıp suçlanan bir [ROOT.Char.GetWomanMan] mı? Yalnızca günah değil, aynı zamanda suç. "

 lmf_lover.1200.desc.secret:0 "Sırrımızı korumak için sürekli tetikte olmamız gerektiği gerçeği, hissettiğim strese yalnızca ekleniyor.\n\n"

 lmf_lover.1200.desc.public:0 "İlişkimizin açıktan açığa olmasının işleri kolaylaştıracağını, sonuçların çoktan yaşandığını düşünürdüm; ama durum öyle değil.\n\n"

 lmf_lover.1200.desc.independent:0 "Hükümdarım olmadığı için sonuçlardan korktuğumdan değil,"

 lmf_lover.1200.desc.liege:0 "[lover.GetFirstNameNoTooltip] hükümdarımken sonuçlardan korkmama gerek yok,"

 lmf_lover.1200.desc.ruler:0 "Kesin konuşmak gerekirse sonuçlardan korktuğumdan değil,"

 lmf_lover.1200.desc.end:0 "daha çok bu günahların ölümsüz ruhuma ne yapacağı meselesi. Düşüncesi beni içten içe yiyor; [lover.GetFirstNameNoTooltip] aklımdan çıkarmamı salık verse de yapamıyorum. [lover.GetSheHe]'in bu konuda kendimi iyi hissettirecek yapabileceği hiçbir şey yok."

 lmf_lover.1200.a:0 "Ne yapacağım ben?"

 lmf_lover.1205.t:0 "Tüm Gözler Üzerimde"

 lmf_lover.1205.desc:0 "İlişkimizin gizli olmamasının işleri kolaylaştıracağını düşünürdüm.\n\nNe de olsa yalan söylemeye gerek yok. [lover.GetFirstNameNoTooltip] ile buluşmalarımızı gizleme ihtiyacı yok. Ben [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'in [ROOT.Char.GetTitleAsNameNoTooltip|l]'iyim ve dilediğimi yapabilirim, değil mi?\n\nAma bakışlar... saraylılarım ve vassallarım hiçbir şey söylemiyor, çünkü nasıl söylesinler? Yine de gözlerindeki yargıyı görebiliyorum. Geçiştirmeye çalışıyorum; ama [lover.GetFirstNameNoTooltip] ile birlikte oldukça bu daha da artıyor ve itiraf etmeliyim ki beni biraz kemiriyor."

 lmf_lover.1205.a:0 "Ne kadar inanılmaz sinir bozucu."

 lmf_lover.1210.t:0 "Fısıltılar Başladı"

 lmf_lover.1210.desc:0 "Dikkatli davrandığımızı sanıyordum.\n\nBelli ki değilmişiz; sarayda [lover.GetFirstNameNoTooltip] ve benim hakkımda fısıltılar dolaşıyor... ne kadar sık birlikte görüldüğümüz, ne kadar samimi göründüğümüz, belki de işin daha da ileri gittiği şüpheleri.\n\n"I knew this would happen," [lover.GetFirstNameNoTooltip] said when I told [lover.GetHerHim] the news.\n\nMaybe so, but now we have to do something about it, before our secret is out in the open."

 lmf_lover.1210.a:0 "Bu fısıltıları durdurmaya çalışacağım."

 lmf_lover.1210.b:0 "[lover.GetFirstNameNoTooltip] bu fısıltıları durdurmayı denesin."

 lmf_lover.1210.a.success.tt:0 "Söylentiler başarıyla bastırıldı"

 lmf_lover.1210.a.failure.tt:0 "Sır her halükârda sızar"

 lmf_lover.1210.c:0 "[lover.GetFirstNameNoTooltip] ve benin bir süre ayrı kalmamız gerekiyor, ortalık durulana dek."

 lmf_lover.1215.t:0 "Seçim Zamanı"

 lmf_lover.1215.desc.start:0 "[lover.GetFirstNameNoTooltip]'in bir şeye öfkeli olduğunu anlayabiliyordum.\n\nYakın zamanda geceyi birlikte geçirmiştik ve [lover.GetSheHe] neredeyse hiç konuşmadı. Sonunda, üstüne gidince [lover.GetSheHe] patladı. "I want you to end things with [other_lover.GetTitledFirstNameNoTooltip]!"\n\n"

 lmf_lover.1215.desc.spouse:0 ""End things... with my #EMP [other_lover.Custom2('GetYourConsortType', ROOT.Char )]#!?"\n\n"[other_lover.GetSheHe|U]'s more than your [other_lover.Custom2('GetYourConsortType', ROOT.Char )]! You dote on [other_lover.GetHerHim], you can't keep your hands off [other_lover.GetHerHim], you're in #EMP love#! with [other_lover.GetHerHim]!"\n\n"

 lmf_lover.1215.desc.secret:0 "[lover.GetSheHe]'in [other_lover.GetFirstNameNoTooltip] hakkında bilgisinin olması bile beni afallattı. "Yes, I know about it!" [lover.GetSheHe] raged. "I'm not going to reveal your secret, I'm not a fool, but you can't be in love with [other_lover.GetHerHim] while you say you're in love with #EMP me!#!"\n\n"

 lmf_lover.1215.desc.public:0 "Ah. Bunun er ya da geç gündeme geleceğini biliyordum. "You parade about with [other_lover.GetHerHim]!" [lover.GetSheHe] raged. "Flaunting it in front of me, as if I have nothing to say about it or feel about it! Are you in love with [other_lover.GetHerHim]? Are you even in love with me?!"\n\n"

 lmf_lover.1215.desc.end:0 "Tartışmamız tırmandı; ta ki [lover.GetFirstNameNoTooltip] sonunda [lover.GetHerHis] ültimatomunu verene dek: aralarında seçim yapmam gerekiyordu, yoksa bitmiştik."

 lmf_lover.1215.a:0 ""Of course I choose you!""

 lmf_lover.1215.b:0 ""If I must, then I choose [other_lover.GetHerHim].""

 lmf_lover.1215.c:0 ""You can't make me choose. I won't!""

 lmf_lover.1215.c.angry:0 "[lover.GetFirstNameNoTooltip] öfkeden kuduruyor ama geri adım atıyor"

 lmf_lover.1215.c.dumped:0 "[lover.GetFirstNameNoTooltip] tehdidini gerçeğe dönüştürüyor"

 lmf_lover.1220.t:0 "Beklenmedik Çocuk Bakıcılığı?"

 lmf_lover.1220.desc:0 "[lover.GetFirstNameNoTooltip] bana günü birlikte geçirmek istediğine dair bir mesaj gönderdiğinde memnun oldum. [ROOT.Char.Custom('FortifiedBuilding')] bir kez olsun sessizdi; bu yüzden sıvışabildim.\n\nBu yüzden, yanında [my_bastard.Custom('ChildhoodPersonalityTrait')|l] bir [my_bastard.Custom('polite_gender_ref')] ile geldiğini görünce epey şaşırdım: [my_bastard.GetFirstNameNoTooltip], onun [my_bastard.Custom('GetDaughterSon')]... ki aynı zamanda benim [my_bastard.Custom('GetDaughterSon')]'im.\n\n"I want [my_bastard.GetFirstNameNoTooltip] to get to know [my_bastard.GetHerHis] father," she said. "You see [my_bastard.GetHerHim] so seldom, [lover.Custom2('spoken_address_by_familiarity', ROOT.Char)], this may be your only chance before [my_bastard.GetSheHe]'s grown."\n\nI could see she was determined to make this happen, but... a whole day with the [my_bastard.Custom('GetLassLad')]?"

 lmf_lover.1220.a:0 "Belki bu, bir baba-[my_bastard.Custom('GetDaughterSon')] ilişkisi için bir şanstı?"

 lmf_lover.1220.a.success:0 "Birlikte geçirilen gün bir başarı"

 spent_time_with_me:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], baba ve [CHARACTER.Custom('GetDaughterSon')] olarak birbirlerini tanımak için vakit geçirdi."

 spent_time_with_me_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ve [CHARACTER.GetShortUIName], baba ve [TARGET_CHARACTER.Custom('GetDaughterSon')] olarak birbirlerini tanımak için vakit geçirdi."

 lmf_lover.1220.a.failure:0 "Tuhaf ve hayal kırıklıklarıyla dolu bir gün"

 lmf_lover.1220.b:0 "Bunun için ne zamanım ne de sabrım var!"

 refused_to_spend_time_with_me:0 "[CHARACTER.GetShortUINamePossessive|U] gerçek babası [TARGET_CHARACTER.GetShortUIName], [Select_CString( CHARACTER.IsLocalPlayer, 'beni', CHARACTER.GetHerHim )] kapı dışarı etti."

 refused_to_spend_time_with_me_corresponding:0 "[CHARACTER.GetShortUIName|U], gizli [TARGET_CHARACTER.Custom('GetDaughterSon')] [TARGET_CHARACTER.GetShortUIName]'i kapı dışarı etti."

 lmf_lover.1225.opening:0 "Sevgilim,"

 lmf_lover.1225.secret:0 "Bunun sürpriz olabileceğini biliyorum; ama artık bilme vaktin geldi: sevgili [my_bastard.Custom('polite_gender_ref')] [my_bastard.GetFirstName], senin [my_bastard.Custom('GetDaughterSon')]'in.\n\n"

 lmf_lover.1225.public:0 "Sana sevgili [my_bastard.Custom('polite_gender_ref')] [my_bastard.GetFirstName] hakkında yazıyorum; her geçen gün biraz daha büyüyor ve uzuyor.\n\n"

 lmf_lover.1225.courtier:0 "[my_bastard.GetHerHim]'in iyi bir eğitim ve bir gelecek sahibi olmasını istiyorum; bu da [lover.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de olmayacak. "

 lmf_lover.1225.pool:0 "[my_bastard.GetHerHim]'in iyi bir eğitim ve bir gelecek sahibi olmasını istiyorum; ikisini de [my_bastard.GetHerHim]'e veremem. "

 lmf_lover.1225.end:0 "[my_bastard.GetHerHim]'i [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki sarayına göndermek istiyorum; orada [my_bastard.GetSheHe], usulüne uygun genç bir [my_bastard.GetWomanMan] olarak yetiştirilebilir. Bunu benim için yapabilir misin?"

 lmf_lover.1225.a:0 "[new_guardian.GetTitledFirstNameNoTooltip], [my_bastard.Custom('GetLassLad')] için harika bir vasi olur."

 lmf_lover.1225.b:0 "Eminim burada [my_bastard.GetHerHis] vasisi olacak birini buluruz, evet."

 lmf_lover.1225.c:0 "[my_bastard.GetHerHim]'i buraya mı getireyim? Hayır, o olmayacak."

 lmf_lover.1230.t:0 "[my_bastard.Custom('GetDaughterSon')|U] için Bir Yer?"

 lmf_lover.1230.desc.start:0 "[lover.GetFirstNameNoTooltip] benimle özel görüşmek istediğini resmen talep ettiğinde, tereddütle kabul ettim.\n\nMeğer konuşmak istediği şey — daha doğrusu, kişi — bizim [my_bastard.Custom('GetDaughterSon')]'imizmiş. "

 lmf_lover.1230.desc.othercourt:0 ""[my_bastard.GetFirstNamePossessiveNoTooltip] potential is wasted in [my_bastard.GetLiege.GetTitledFirstNamePossessiveNoTooltip] court," she complained. "

 lmf_lover.1230.desc.otherknight:0 ""[my_bastard.GetFirstNamePossessiveNoTooltip] potential is wasted as one of [my_bastard.GetLiege.GetTitledFirstNamePossessiveNoTooltip] [my_bastard.GetLiege.Custom('KnightCulturePluralNoTooltipLowercase')]," she complained. "

 lmf_lover.1230.desc.other:0 ""[my_bastard.GetFirstNameNoTooltip] has no duties in [my_bastard.GetLiege.GetTitledFirstNamePossessiveNoTooltip] court. All that potential! Wasted!" she complained. "

 lmf_lover.1230.desc.court:0 ""[my_bastard.GetFirstNamePossessiveNoTooltip] potential is wasted here in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]," she complained. "You need to give [my_bastard.GetHerHim] something useful to do!"\n\n"

 lmf_lover.1230.desc.pool:0 ""[my_bastard.GetFirstNameNoTooltip] has so much potential, but no liege to properly serve," she complained. "

 lmf_lover.1230.desc.bring:0 ""I want you to bring [my_bastard.GetHerHim] here, where [my_bastard.GetSheHe] can be useful."\n\n"

 lmf_lover.1230.desc.mid:0 ""Define 'useful'," I asked.\n\n"

 lmf_lover.1230.desc.target:0 "Hazır bir cevabı vardı: "Make [my_bastard.GetHerHim] your [my_bastard.Custom('GetTargetCourtPosition')]." I almost guffawed, but [lover.GetFirstNameNoTooltip] was adamant. "

 lmf_lover.1230.desc.notarget:0 "Artık [lover.GetFirstNameNoTooltip] daha az emindi. "I... I don't know. #EMP Something#!!" I told her that was less than useful, but she was adamant. "

 lmf_lover.1230.desc.backup:0 ""Or your [my_bastard.Custom('GetBackupCourtPosition')], perhaps!" she shouted. "

 lmf_lover.1230.desc.end:0 ""[my_bastard.GetFirstNameNoTooltip] is your actual blood! You #EMP owe#! [my_bastard.GetHerHim] a chance!""

 lmf_lover.1230.a:0 ""Very well, [my_bastard.GetFirstNameNoTooltip] will be my [my_bastard.Custom('GetTargetCourtPosition')].""

 lmf_lover.1230.b:0 ""I... suppose [my_bastard.GetSheHe] could be my [my_bastard.Custom('GetBackupCourtPosition')], certainly.""

 lmf_lover.1230.c:0 ""[my_bastard.GetSheHe|U] may come and join the ranks of my [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')].""

 lmf_lover.1230.d:0 ""I do not, in fact, owe [my_bastard.GetHerHim] #EMP anything#!.""

 lmf_lover.1231.title.tt:0 "Bozulan Söz"

 lmf_lover.1231.desc:0 "[lover.GetFirstNameNoTooltip]'e verdiğin sözü bozdun; [my_bastard.GetFirstNamePossessive] sarayındaki görevini geri aldın."

 lmf_lover.1235.t:0 "Meşru Bir Talep"

 lmf_lover.1235.desc:0 "[lover.GetFirstNameNoTooltip] ile geçirdiğim yakın bir akşamın ardından, [my_bastard.Custom('GetDaughterSon')] [my_bastard.GetFirstName] konusunu açtı.\n\n"Everyone knows who I am to you," she said, "and they know who [my_bastard.GetSheHe] is, as well. It's time for [my_bastard.GetHerHim] to be legitimized."\n\n"Legitimized?" I was genuinely surprised. "But you and I aren't married, my love."\n\nThe look she shot me said, very clearly, that this was #EMP my#! doing and not hers. "Yet [my_bastard.GetSheHe] is your [my_bastard.Custom('GetDaughterSon')]! It's not right that [my_bastard.GetSheHe] be treated differently, and you can change that!" I could tell that [lover.GetFirstNameNoTooltip] was going to insist."

 lmf_lover.1235.a:0 "Belki haklıdır. Pekâlâ."

 lmf_lover.1235.topliege.tt:0 "[recipient.GetShortUIName]'e, [secondary_recipient.GetShortUIName]'in meşrulaştırılması için bir talepte bulunacaksın"

 lmf_lover.1235.b:0 "Hayır, kesinlikle olmayacak."

 lmf_lover.1240.t:0 "Uzun Zamanın Sonunda"

 lmf_lover.1240.desc:0 "[lover.GetFirstNameNoTooltip] ilişkimizi ilk başlattığında, bu kadar yıl sonra hâlâ birlikte olacağımız kimin aklına gelirdi?\n\nBenim bile; ve ilişkimizi ciddi saymadığımı açıkça belli eden bendim. Yine de hâlâ birlikteyiz; tutkumuzdaki parıltının bir kısmı sönmüş olsa da [lover.GetHerHim]'e hâlâ büyük bir sevgi duyduğumu inkâr edemem.\n\nAma bunun devam etmesini istiyorsam, çok daha fazla çaba göstermeye başlamam gerekebilir. Belki de ilişkimizin gerçekten bir yere #EMP gittiği#! fikrini düşünmem gerekebilir. Yine de... bunu #EMP istiyor#! muyum?"

 lmf_lover.1240.a:0 "Bunu gerçekten istiyorum. Olması için çaba göstereceğim."

 lmf_lover.1240.b:0 "Hayır. Ne yapalım, durum bu."

 lmf_lover.1245.t:0 "Aşk ve Nefret"

 lmf_lover.1245.desc:0 "[lover.GetFirstNameNoTooltip] bana kızgın.\n\nYa da belki [lover.GetSheHe] benden hoşlanmamaya, hatta nefret etmeye başladı. Her neyse, son aylarda [lover.GetHerHim]'i nadiren görüyorum. Karşılaştığımız zamanlarda [lover.GetSheHe] mesafeli ve bazen soğuk.\n\nBunun geçmesi mümkün, doğru. Ya da belki bu sonun başlangıcı. Bunu zaman gösterecek."

 lmf_lover.1245.a:0 "[lover.GetHerHim]'i elimde tutacaksam harekete geçmeliyim."

 lmf_lover.1250.t:0 "Söylediğim bir şey mi var?"

 lmf_lover.1250.desc:0 "[lover.GetFirstNameNoTooltip] ile son buluşmamda bir şeyler çok ters gitti.\n\nAkşamın güzel kısmına daha gelemeden [lover.GetSheHe] çok sessizleşti. [lover.GetSheHe|U] öfkeliydi, anlayabiliyordum; ama ne söyleyip [lover.GetHerHim]'i böyle kızdırdığımı bir türlü hatırlayamıyordum. Daha kötüsü, [lover.GetHerHim]'e sorunun ne olduğunu sormak için yaptığım her girişim [lover.GetHerHim]'i daha da çok sinirlendiriyor gibiydi! Sonunda bir tartışmaya dönüştü; ardından [lover.GetSheHe] [lover.GetHerHis] giysilerini toplayıp gitti.\n\nSorunun çok vahim olduğunu sanmıyorum; ama [lover.GetFirstNameNoTooltip] ile arayı düzeltmek için hiçbir şey yapmazsam bunun ilişkimizi etkileyeceğinden korkuyorum."

 lmf_lover.1250.a:0 "Öyleyse en iyisi deneyeyim."

 lmf_lover.1250.a.success:0 "[lover.GetFirstNameNoTooltip] çabaların karşısında gülümseyerek yumuşuyor"

 lmf_lover.1250.a.failure:0 "Çabaların [lover.GetHerHim]'i daha da rahatsız ediyor"

 lmf_lover.1250.b:0 "Bence uyuyan köpekleri uyandırmamalı."

 lmf_lover.1255.t:0 "Zıtlar Çatışır"

 lmf_lover.1255.desc.courtier:0 "Sonunda [lover.GetFirstNameNoTooltip] ile baş başa bir akşam geçirme fırsatı bulduğum için memnundum;"

 lmf_lover.1255.desc.notcourtier:0 "[lover.GetFirstNameNoTooltip]'in sürpriz ziyareti, [lover.GetHerHim] ile baş başa bir akşam geçirme fırsatıyla denk geldiği için memnundum;"

 lmf_lover.1255.desc.mid:0 "son günlerde nadir görülen bir şey.\n\nİşler iyi başladı sayılır; ama çok geçmeden didişmeye başladık. Önce küçük şeyler. [lover.GetSheHe]'in dişlerimi gıcırdatan seçme bir lafı. Benim [lover.GetHerHim]'i kaş çatıran talihsiz bir sözüm. Yatak odasına vardığımızda iş, çözümsüz tam bir kavgaya dönüşmüştü... ve kesinlikle aşk yaşanmadı.\n\n"

 lmf_lover.1255.desc.courtier2:0 "[lover.GetFirstNameNoTooltip] öfkeyle [ROOT.Char.Custom('FortifiedBuilding')]'deki kendi odasına çekildi,"

 lmf_lover.1255.desc.notcourtier2:0 "[lover.GetFirstNameNoTooltip] öfkeyle çıkıp gitti, [ROOT.Char.Custom('FortifiedBuilding')]'den erkenden ayrılarak,"

 lmf_lover.1255.desc.end:0 "ve düşünmek zorunda kaldım. Birbirimizden o kadar farklıyız ki, kimi zaman nasıl âşık olduğumuzu bile merak ediyorum. Arayı onarmayı deneyebilirim; ama bu çaba gerektirecek."

 lmf_lover.1255.a:0 "Denemek zorundayım."

 lmf_lover.1255.a.success.tt:0 "İşleri yoluna koymayı başarıyorsun"

 lmf_lover.1255.a.failure.tt:0 "[lover.GetFirstNameNoTooltip] çabalarını geri çeviriyor"

 lmf_lover.1255.b:0 "Bir anlamı yok. Değişmesi gereken [lover.GetSheHe|U], ben değil."

 lmf_lover.1260.t:0 "Görev Yüzünden Ayrı"

 lmf_lover.1260.desc:0 "[lover.GetFirstNameNoTooltip] ve ben ikimiz de çok meşgulüz.\n\nBen [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de hüküm sürüyorum; [lover.GetTitleAsNameNoTooltip|l] olmanın görevleri ise [lover.GetHerHim]'i [lover.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de meşgul ediyor. Bu yüzden birbirimizi görme fırsatlarımız çok az ve seyrek.\n\nZor olabilir ama belki daha fazla çaba göstermemiz gerekiyor. Göstermezsek, aşkımızın yavaş yavaş gelip geçici bir hevese dönüşeceğine dair bir his var içimde..."

 lmf_lover.1260.a:0 "Daha fazla çaba göstermeliyiz!"

 lmf_lover.1260.b:0 "Yapılacak pek bir şey yok. Ne yapalım, durum bu."

 lmf_lover.1265.t:0 "Yanlış Yer, Yanlış Zaman"

 lmf_lover.1265.desc:0 "[lover.GetFirstNameNoTooltip] ve ben birbirimizin eşliğinde bir başka keyifli akşamı daha yeni bitirmiştik. Aslında [lover.GetSheHe] giysilerini toplamayı bitirip yatak odasından süzülüp çıkmıştı ki kapının yeniden açıldığını duydum.\n\n[lover.GetHerHim] olduğunu sanarak yataktan fırladım. "Did you forget something, my love?" I called out.\n\nIt was only then, belatedly, that I realized my [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('my_courtier'))|l] stood in the doorway and not [lover.GetHerHim], having come to deliver a message.\n\nDid [my_courtier.GetFirstNameNoTooltip] hear what I'd said? Had [my_courtier.GetSheHe] seen [lover.GetFirstNameNoTooltip] leave, not moments before? I had to think quickly..."

 lmf_lover.1265.a:0 "[my_courtier.GetFirstNameNoTooltip]'i her şeyin bir yanlış anlama olduğuna ikna et."

 lmf_lover.1265.a.success.tt:0 "[my_courtier.GetFirstNameNoTooltip] hiçbir şey olmadığına ikna oluyor"

 lmf_lover.1265.a.failure.tt:0 "[my_courtier.GetFirstNameNoTooltip] yalan söylediğini biliyor"

 lmf_lover.1265.b:0 "[my_courtier.GetFirstNameNoTooltip]'e tek kelime etmemesi için yalvar."

 lmf_lover.1265.b.success.tt:0 "[my_courtier.GetFirstNameNoTooltip] [my_courtier.GetHerHis] ağzını kapalı tutmayı kabul ediyor"

 courtier_promised_not_to_reveal_tt:0 "[my_courtier.GetFirstNameNoTooltip] [secret|E]'i ifşa etmeyeceğine söz veriyor"

 lmf_lover.1265.b.failure.tt:0 "Pek ikna edici değilsin"

 lmf_lover.1265.c:0 "[my_courtier.GetHerHim]'i işten çıkar ve sonra ne olacağını bekle."

 lmf_lover.1265.c.knows.tt:0 "[my_courtier.GetFirstNameNoTooltip] her şeyi gördü ve biliyor"

 lmf_lover.1265.c.revealed.tt:0 "[my_courtier.GetFirstNameNoTooltip] birine anlatıyor ve söz yayılıyor..."

 lmf_lover.1265.c.learned.tt:0 "[my_courtier.GetFirstNameNoTooltip] sırrı şimdilik [my_courtier.GetHerselfHimself]'ine saklıyor"

 lmf_lover.1270.t:0 "Beklenmedik Tanık"

 lmf_lover.1270.desc:0 "[lover.GetFirstNameNoTooltip] ve ben öğleden sonra kaçamağının ortasındaydık; [ROOT.Char.Custom('FortifiedBuilding')]'in çoğu meşgulken yatak odama süzülmüştük ki [lover.GetFirstNamePossessiveNoTooltip] gözleri aniden şaşkınlıkla kocaman açıldı.\n\nBaktım ve orada dikilen, gözleri faltaşı gibi açık ve kafası karışmış genç [my_courtier.GetFirstNameNoTooltip]'ten başkası değildi.\n\n[my_courtier.Custom('GetLassLad')]'in nasıl içeri girdiğini ya da burada ne yaptığını sandığını bilemem; ama pijamalarımı hızla çekerken karar vermem gerekiyordu: [my_courtier.Custom('GetLassLad')]'i, gördüğü şeyin aslında gördüğü şey olmadığına ikna etmeye mi çalışayım? Yoksa insanların, [my_courtier.GetSheHe]'in [my_courtier.GetHerHis] gençliği yüzünden anlatacağı hikâyeleri ciddiye almayacağına mı güveneyim?"

 lmf_lover.1270.a:0 "Hızlı konuşma zamanı!"

 lmf_lover.1270.a.success.tt:0 "[my_courtier.GetHerHim]'i hepsinin bir oyun olduğuna ikna ediyorsun"

 lmf_lover.1270.a.failure.tt:0 "[my_courtier.GetHerHim]'i ikna etmeye çalışmak işleri daha da kötüleştiriyor"

 lmf_lover.1270.b:0 "[my_courtier.GetHerHim]'e kimse inanmayacak, eminim."

 lmf_lover.1270.c:0 "Aşk için yaptıklarım..."

 lmf_lover.1270.c.tt:0 "#EMP [my_courtier.GetShortUIName]'i pencereden aşağı itiyorsun; aşağıdaki avluya düşüşün [my_courtier.GetHerHim]'i büyük ihtimalle öldürecek!#!\n"

 lmf_lover.1270.c.death.tt:0 "#EMP [my_courtier.GetTitledFirstNameNoTooltip], görünüşte kaza olan düşüşte hayatını kaybediyor.#!"

 lmf_lover.1270.c.death.title:0 "[my_courtier.GetTitledFirstNameNoTooltip] bir düşüş sonucu ölüyor"

 lmf_lover.1270.c.death.desc:0 "[my_courtier.GetShortUIName], yatak odasının penceresinden avluya düşerek can verdi. Düşüşün bir kaza olduğu sanılıyor."

 lmf_lover.1270.c.death2.title:0 "[my_courtier.GetTitledFirstNameNoTooltip] düşüşten ölüyor"

 lmf_lover.1270.c.death2.desc:0 "[my_courtier.GetShortUIName], [my_courtier.GetHerHis] pencereden düşüşünden sonra toparlanamadı. Sırrın güvende."

 lmf_lover.1270.c.crippled.tt:0 "#EMP [my_courtier.GetTitledFirstNameNoTooltip] düşüşü atlatıyor ama ağır yaralı ve sakat kalıyor. [my_courtier.GetSheHe|U] iyileşince herkese ne olduğunu anlatabilecek.#!"

 lmf_lover.1270.c.crippled.title:0 "[my_courtier.GetTitledFirstNameNoTooltip] düşüşü atlatıyor"

 lmf_lover.1270.c.crippled.desc:0 "[my_courtier.GetShortUIName] düşüşten güç bela kurtuldu; hem ağır yaralı hem de sakat kaldı. İyileşince herkese ne olduğunu anlatmayı başardı!"

 lmf_lover.1270.c.survive.tt:0 "#EMP [my_courtier.GetTitledFirstNameNoTooltip] mucizevi şekilde düşüşü gerçek bir yara almadan atlatıyor ve herkese ne olduğunu anlatabiliyor.#!"

 lmf_lover.1270.c.survive.desc:0 "[my_courtier.GetShortUIName] mucizevi şekilde düşüşten neredeyse yara almadan kurtuldu ve herkese ne olduğunu anlatmayı başardı!"

 lmf_lover.1271.t:0 "Lütuftan Düşüş"

 lmf_lover.1271.start:0 "Bugün [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_courtier'))]'in [ROOT.Char.Custom('FortifiedBuilding')]'in pencerelerinden birinden düştüğü bilgisi verildi bana; [my_courtier.GetHerHis] genç hayatına son vermesi gereken, avluya doğru bir çakılış.\n\n"

 lmf_lover.1271.crippled:0 "Bunun yerine, [my_courtier.Custom('GetLassLad')] hayatta kalmayı başardı... ama kıl payı. [my_courtier.GetHerHis] yaralarının oldukça ağır olduğu ve [my_courtier.GetSheHe]'in bir daha asla yürüyemeyebileceği söylendi bana.\n\n"

 lmf_lover.1271.survived:0 "Bunun yerine, görünüşe göre [my_courtier.Custom('GetLassLad')] yalnızca birkaç yara aldı; iyileşmesi kesin. Ah, gençliğin dayanıklılığı!\n\n"

 lmf_lover.1271.end:0 "Daha da endişe verici olan, [my_courtier.GetSheHe]'in #EMP neden#! düştüğü. [my_courtier.GetTitledFirstName] konuşabildiği anda, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murderer'))] ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('lover'))]'i yatak odasında... hani derler ya, uygunsuz bir durumda yakaladığını söyledi. İlişkilerinin ifşa olma riskini göze alamayan [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murderer'))], [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_courtier'))]'i yatak odasının penceresinden aşağı itti! [murderer.GetHerHis] kendi ayıplarını örtmek için bir cinayet girişimi!"

 lmf_lover.1271.a:0 "İnanılmaz!"

 lmf_lover.1271.a.tt1:0 "[scope:my_courtier.GetShortUINameNoTooltip], [scope:murderer.GetShortUINamePossessive] Sevgili Sırrını ifşa ediyor"

 lmf_lover.1271.a.tt2:0 "[scope:my_courtier.GetShortUINameNoTooltip], [scope:murderer.GetShortUINamePossessive] Suikast Girişimi Sırrını ifşa ediyor"

 lmf_lover.1275.t:0 "[ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))|U]'imin Sevgilisi"

 lmf_lover.1275.desc.start:0 "[lover.GetFirstNameNoTooltip] son zamanlarda farklı davranıyor. İlla şüpheli bir şey değil; ama mesafeli. Dalgın. O kadar ki ben "

 lmf_lover.1275.desc.courtier:0 "ben ortalıkta yokken [ROOT.Char.Custom('FortifiedBuilding')]'deki bazı hizmetkârların [lover.GetHerHim]'i gözetlemesini sessizce sağladı.\n\n"

 lmf_lover.1275.desc.othercourtier:0 "son buluşmamızın ardından [lover.GetSheHe] [lover.GetLiege.GetTitledFirstNamePossessiveNoTooltip] sarayına döndüğünde [lover.GetHerHim]'i gözetlemeleri için birkaç hizmetkâra para ödedi.\n\n"

 lmf_lover.1275.desc.landed:0 "[lover.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [lover.GetHerHis] sarayında, [lover.GetHerHim]'i gözetlemeleri için birkaç hizmetkâra para ödedi.\n\n"

 lmf_lover.1275.desc.other:0 "son buluşmamızın ardından [lover.GetSheHe] [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den ayrılırken [lover.GetHerHim]'i takip etmeleri için birkaç hizmetkâra para ödedi.\n\n"

 lmf_lover.1275.desc.end:0 "Niyetim yalnızca neyin ters gittiğini öğrenmekti; belki de yardım edebileceğim bir şeydi. Ne var ki hizmetkârların rapor ettikleri beni şaşırttı.\n\n[lover.GetFirstNameNoTooltip], [other_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ile birkaç kez bir arada görülmüş... ve bunlar masum buluşmalar değildi. İkisi gülüşürken, birbirlerine dokunurken, samimiyet kurarken görülmüş; yakınlarda başka biri olduğunu düşündüklerinde ise anında ayrılıp masum rolü oynuyorlarmış.\n\nArtık benim için açık: [lover.GetFirstNameNoTooltip]'in kendine ait gizli bir sevgilisi var."

 lmf_lover.1275.a:0 "Şey, #EMP bu#! beklenmedikti..."

 lmf_lover.1280.t:0 "[lover.GetHerHis|U] Diğer Sevgilisi"

 lmf_lover.1280.desc:0 "Onları aklımdan çıkaramıyorum.\n\n[lover.GetFirstNameNoTooltip] ve [other_lover.GetTitledFirstNameNoTooltip], çarşafların arasında birbirine dolanmış bedenler, karışan terler, dudaklarından kaçan soluklar...\n\n#EMP Hayır.#! Delirmeden önce bu konuda bir şeyler yapmalıyım, mutlaka."

 lmf_lover.1280.a:0 "[lover.GetFirstNameNoTooltip] aramızda seçim yapmak zorunda."

 lmf_lover.1280.a.you:0 "[lover.GetFirstNameNoTooltip] seni seçiyor"

 lmf_lover.1280.a.them:0 "[lover.GetFirstNameNoTooltip] [other_lover.GetHerHim]'i seçiyor"

 lmf_lover.1280.b:0 "Aklımdan çıkarmaya çalışacağım..."

 lmf_lover.1280.c:0 "Hayır, yeterince çektim. Bu burada bitiyor."

 lmf_lover.1285.t:0 "Solan Bir Aşk"

 lmf_lover.1285.desc:0 "Bugün aklıma geldi: son zamanlarda [lover.GetFirstNameNoTooltip]'i neredeyse hiç görmüyorum.\n\n[lover.GetSheHe|U] ne beni görmeye geldi ne de bir not gönderdi... üstelik ben de fark etmemişim. Belki de dedikleri doğrudur; aşk zamanla sönüp gider. Ya da ikimizin eskiden yaşadıklarını ayakta tutmak için gereken çabayı göstermedim.\n\nDenemeli miyim? Yoksa buna şimdi son verip işin içinden çıkmak mı lazım?"

 lmf_lover.1285.a:0 "Kıvılcımı yeniden alevlendirmenin bir yolunu bulacağım!"

 lmf_lover.1285.a.success.tt:0 "Çabaların takdir ediliyor"

 lmf_lover.1285.a.failure.tt:0 "Ne yazık ki, sadece işleri daha da kötüleştiriyorsun"

 lmf_lover.1285.b:0 "Ne yazık ki, sanırım bitti..."

 lmf_lover.1500.t:0 "Gözden Irak, Gönülden Irak"

 lmf_lover.1500.desc:0 "[lover.GetFirstNameNoTooltip]'den son mektubu aldığımda, [lover.GetSheHe] [lover.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'in bir yerlerindeydi; ama o mektubun bile buraya, [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'e ulaşması aylar sürdü; o yüzden [lover.GetSheHe] hâlâ orada mı, kim bilir? [lover.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] o kadar uzak ki haber göndermek ya da almak neredeyse imkânsız.\n\n[lover.GetSheHe]'in yakında döneceğine dair umut beslediğimi söylemek isterim; ama kuşkularım var... ve aylar geçtikçe kendimi [lover.GetHerHim]'i giderek daha az düşünürken buluyorum.\n\n[lover.GetSheHe]'in de aynı şeyi hissettiğinden şüpheleniyorum."

 lmf_lover.1500.a:0 "Öyle olsun."

 lmf_lover.1505.t:0 "Uzak [ROOT.Char.Custom2('GetYourConsortType', SCOPE.sC('lover'))|U]"

 lmf_lover.1505.desc.start:0 "[lover.GetFirstNameNoTooltip]'den haber alamayalı epey oldu.\n\nEn son duyduğuma göre [lover.GetSheHe] "

 lmf_lover.1505.desc.courtier:0 "[lover.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]'deki [lover.GetLiege.GetTitledFirstNamePossessiveNoTooltip] sarayının bir parçası,"

 lmf_lover.1505.desc.pool:0 "uzaktaki [lover.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'in bir yerlerinde,"

 lmf_lover.1505.desc.end:0 "[lover.GetSheHe]'in orada ne yaptığını tam olarak söyleyemesem de.\n\nSöyleyebileceğim şey [lover.GetHerHim]'i özlediğim. Belki [lover.GetFirstNameNoTooltip]'in izini bulmaları ve onu [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de bana katılmaya ikna edip edemeyeceklerini görmeleri için birkaç muhafız tutmalıyım... tabii [lover.GetHerHim]'i bulabilirlerse."

 lmf_lover.1505.a:0 "Onları derhal göndereceğim."

 lmf_lover.1505.a.success.tt:0 "[lover.GetTitledFirstNameNoTooltip] bulundu ve sarayına katılmayı kabul ediyor"

 lmf_lover.1505.b:0 "[lover.GetSheHe] dönmek isterse, döner."

