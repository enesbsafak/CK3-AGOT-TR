 lmf_heir.1664.desc.notrain:0 "Bana şöyle dendi: "

 lmf_heir.1664.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftayı [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] ile birlikte geçirdi; kendisi [your_heir.Custom('GetLassLad')]'i [ROOT.Char.Custom('FortifiedBuilding')] garnizonuna götürüp [your_heir.GetHerHim]'e [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larımın neler yapabildiğini gösterdi.\n\n[your_heir.GetTitledFirstNameNoTooltip] acımasızca talim yaptı... ama anlatılanlara göre epey başarılıydı. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] bana [your_heir.GetSheHe]'in çok az şikâyet ettiğini ve yalnızca [your_courtier.GetHerHim] ile değil, diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larla da iyi geçindiğini söylüyor.\n\nGörünüşe göre [heir_liege.GetTitledFirstNameNoTooltip]'in [heir_liege.GetHerHis] [heir_liege.Custom2('LMF_RelationToMePossessive', your_heir )] ilerlemesi hakkında hiçbir şikâyeti olmamalı."

 lmf_heir.1664.a:0 "Harika iş çıkardın, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))]!"

 lmf_heir.1665.t:0 "Talihsiz Bir Düello"

 lmf_heir.1665.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftayı [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] ile birlikte geçirdi; kendisi [your_heir.Custom('GetLassLad')]'i [ROOT.Char.Custom('FortifiedBuilding')] garnizonuna götürüp [your_heir.GetHerHim]'e [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larımın neler yapabildiğini gösterdi.\n\nNe yazık ki işler iyi gitmedi. [your_heir.Custom('GetLassLad')] bir şey öğrenmekten çok kendini kanıtlamakla ilgileniyordu; üstelik ikisi de anlaşamadı. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] [your_heir.GetHerHis] tavırlarını aşağılayıcı buldu ve tartışmaları, [your_heir.GetTitledFirstNameNoTooltip]'in [your_courtier.GetHerHim]'i düelloya davet etmesiyle sonuçlandı.\n\n"

 lmf_heir.1665.desc.child:0 "Görünüşe göre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] ilk başta bir çocukla düello yapmayı reddetmiş... ama bu, [your_heir.GetTitledFirstNameNoTooltip]'i o kadar gücendirmiş ki [your_heir.Custom('GetLassLad')] [your_heir.GetHerHis] kılıcını çekip saldırmış; o noktada düello kaçınılmaz olmuş. "

 lmf_heir.1665.desc.adult:0 "Görünüşe göre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] ilk başta reddetmiş; çünkü [your_heir.GetTitledFirstNameNoTooltip] benim konuğummuş. Ama [your_heir.Custom('GetLassLad')] [your_heir.GetHerHis] kılıcını çekip saldırarak meseleyi zorladı; o noktada düello kaçınılmaz olmuş. "

 lmf_heir.1665.desc.end:0 "Nasıl sona erdiği önemli değil; bütün mesele bir rezalet."

 lmf_heir.1665.a:0 "Umarız bunun sonuncusudur."

