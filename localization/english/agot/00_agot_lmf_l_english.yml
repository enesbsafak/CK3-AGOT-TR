 lmf_heir.1700.relative.t:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('bastard_child_father'))|U] Piç [bastard_child.Custom('GetDaughterSon')|U] mu?"

 lmf_heir.1700.bastard.me.start:0 "Bugün [ROOT.Char.Custom('FortifiedBuilding')] kapılarına genç bir köylü [visitor.GetWomanMan] geldi; alışılmadık olan tek şey, bu genç [visitor.GetWomanMan]'in benim [bastard_child.Custom('GetDaughterSon')] olduğunu iddia etmesiydi.\n\nKendim görmeye gittim ve itiraf edeyim, [bastard_child.GetSheHe]'de bana benzer bir hal vardı. [bastard_child.GetHerHim]'in anlattığına göre [bastard_child.GetHerHis] annesiyle tanışmışım; "

 lmf_heir.1700.bastard.me.heirvisit:0 "[story.MakeScope.Var('story_stray_seed_heir_visit_target').Char.GetTitledFirstNameNoTooltip]'i [story.MakeScope.Var('story_stray_seed_location').Province.GetTitle.GetNameNoTierNoTooltip]'de ziyaret ettiğim zamanlarda sarhoş bir meyhane eğlencesi gecesinde... üzerinden epey ay geçti ama o vesileyi hatırlıyorum.\n\n"

 lmf_heir.1700.bastard.me.campfollower:0 "[story.MakeScope.Var('story_stray_seed_location').Province.GetTitle.GetNameNoTierNoTooltip]'de bir gece, kadın ordu kampı izleyicisiyken. O geceyi gerçekten de hatırlıyorum.\n\n"

 lmf_heir.1700.bastard.me.taverngirl:0 "[story.MakeScope.Var('story_stray_seed_location').Province.GetTitle.GetNameNoTierNoTooltip]'deki bir meyhanede; kadın orada garson kızmış. O geceyi gerçekten de hatırlıyorum.\n\n"

 lmf_heir.1700.bastard.me.lostguide:0 "[story.MakeScope.Var('story_stray_seed_location').Province.GetTitle.GetNameNoTierNoTooltip]'de kaybolduğumda ve kadın beni ordu kampına geri götürdüğünde. O geceyi gerçekten de hatırlıyorum.\n\n"

 lmf_heir.1700.bastard.me.campcaughteye:0 "[story.MakeScope.Var('story_stray_seed_location').Province.GetTitle.GetNameNoTierNoTooltip]'de bir gece gözüme takılan bir askerken. O geceyi gerçekten de hatırlıyorum.\n\n"

 lmf_heir.1700.bastard.me.foundpool:0 "ordunun kamp kurduğu yerin yakınındaki [story.MakeScope.Var('story_stray_seed_location').Province.GetTitle.GetNameNoTierNoTooltip]'deki bir şifa havuzunda. O günü gerçekten de hatırlıyorum.\n\n"

