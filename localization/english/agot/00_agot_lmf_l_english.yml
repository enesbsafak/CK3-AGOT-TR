 lmf_heir.1660.t:0 "Varisle Zaman"

 lmf_heir.1660.desc.first.annoy:0 "Buna neden razı oldum?\n\n[your_heir.GetTitledFirstNameNoTooltip] son birkaç haftayı her hareketimi gölge gibi izleyerek geçirdi; sorular da bitmek bilmiyor.\n\n"Why do you do it that way, my [ROOT.Char.GetLadyLord]?"\n"What are you going to do now, my [ROOT.Char.GetLadyLord]?"\n"Why did you say that, my [ROOT.Char.GetLadyLord]?"\n\nEvery time I turn around, there [your_heir.GetSheHe] is, trying to be helpful but, more often than not, getting in the way.\n\nI sigh every time I think about the fact that the [your_heir.Custom('polite_gender_ref')]'s visit is far from over."

 lmf_heir.1660.desc.first.helpful:0 "Şimdiye dek [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'in eğitimi oldukça iyi gitti.\n\n[your_heir.Custom('polite_gender_ref')] yöntemlerimi nispeten çabuk kavradı ve ayak altında olmamak için elinden geleni yapıyor. Bazen [your_heir.GetSheHe]'in orada olduğunu neredeyse unutuyorum.\n\nElbette, işlerin daha değişmesi için epey zaman var, değil mi?"

 lmf_heir.1660.desc.second.begin:0 "[heir_liege.GetSheHe]'in istediği gibi, [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'ini eğitmekle birkaç hafta daha geçirdim;"

 lmf_heir.1660.desc.second.annoy.wasannoy:0 "ve [your_heir.Custom('polite_gender_ref')] eskisinden daha az sinir bozucu olmadı.\n\n"

 lmf_heir.1660.desc.second.annoy.washelpful:0 "ve itiraf edeyim ki [your_heir.Custom('polite_gender_ref')]'in sürekli ortalıkta olması beni rahatsız etmeye başladı.\n\n"

 lmf_heir.1660.desc.second.helpful.wasannoy:0 "ve neyse ki işler düzeldi. [your_heir.Custom('polite_gender_ref')] neredeyse katlanılabilir oldu.\n\n"

 lmf_heir.1660.desc.second.helpful.washelpful:0 "ve [your_heir.Custom('polite_gender_ref')] etrafta olması keyif veren biri olmaya devam ediyor.\n\n"

 lmf_heir.1660.desc.second.annoy:0 "[your_heir.GetSheHe]'in yardımcı olmak için [your_heir.GetHerHis] elinden geleni yaptığını biliyorum; ama çoğunlukla sadece ayağıma dolanıyor. Daha az gördüğüm hizmetkârlarım var!\n\nNeyse ki ziyaret artık çok uzun sürmeyecek."

 lmf_heir.1660.desc.second.helpful:0 "[your_heir.GetSheHe|U] rutinime alıştı; güvenilir bir hizmetkâr gibi çoğu zaman ihtiyaç duyacağım şeyleri önceden seziyor. Hatta [your_heir.GetSheHe] birkaç kez, ben yapılmasını istemeyi düşünmeden can sıkıcı işleri kendisi hallediverdi.\n\nNe yazık ki ziyaret artık çok uzun sürmeyecek."

 lmf_heir.1660.desc.third.begin:0 "[your_heir.GetTitledFirstNameNoTooltip], [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki neredeyse tüm [your_heir.GetHerHis] süresini bana gölge gibi eşlik ederek geçirmeye devam ediyor,"

 lmf_heir.1660.desc.third.annoy.wasannoy:0 "ve [your_heir.Custom('polite_gender_ref')] başımın belası olmaya devam ediyor. [your_heir.GetSheHe]'in [your_heir.GetHerHis] zamanını harcayabileceği başka bir şey yok mu?\n\n"

 lmf_heir.1660.desc.third.annoy.washelpful:0 "ve şimdiden söyleyeyim: [your_heir.Custom('polite_gender_ref')] nihayet aramızdan ayrıldığında memnun olacağım.\n\n"

 lmf_heir.1660.desc.third.helpful.wasannoy:0 "ve neyse ki işler düzeldi. [your_heir.Custom('polite_gender_ref')] neredeyse katlanılabilir oldu.\n\n"

 lmf_heir.1660.desc.third.helpful.washelpful:0 "ve [your_heir.GetSheHe] gittiğinde [your_heir.Custom('polite_gender_ref')]'i neredeyse özleyeceğimi sanıyorum.\n\n"

 lmf_heir.1660.desc.third.annoy:0 "[your_heir.Custom('GetLassLad')]'in beni ne kadar sinirlendirdiğinin tamamen farkında olduğundan ve ders planlamadığım zamanlarda benden kaçtığından neredeyse eminim.\n\n[heir_liege.GetTitledFirstNameNoTooltip], [your_heir.GetHerHim] için harcadığım tüm bu zaman için minnettar olsa iyi olur."

 lmf_heir.1660.desc.third.helpful:0 "Genel olarak eğitim iyi gitti, sanırım. [your_heir.Custom('GetLassLad')] ve ben rahat bir rutine oturduk; sanırım [your_heir.GetHerHim]'e denetimim olmadan pek çok işi halletmesi için neredeyse güvenebilirim.\n\nZiyaretin neredeyse bittiğini düşünmek üzücü."

 lmf_heir.1660.a:0 "Ne kadar iyi bir [your_heir.Custom('GetLassLad')]."

 lmf_heir.1660.b:0 "[heir_liege.GetTitledFirstNameNoTooltip] minnettar olsa iyi olur."

