 lmf_interaction.1329.desc.secrec.secact.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] yakınlarındaki av gezisi keyifliydi; [secondary_actor.GetFirstNameNoTooltip] hoş görünüyordu. [secondary_actor.GetSheHe|U] iyi bir av yoldaşıydı"

 lmf_interaction.1329.desc.secrec.secact.hike:0 "[secondary_actor.GetFirstNameNoTooltip] yürüyüş boyunca yeterince hoştu ve temposuna da özen gösteriyordu. [secondary_actor.GetSheHe|U] sayısız mekânı işaret edip tarihlerini anlattı"

 lmf_interaction.1329.desc.secrec.secact.garrison:0 "[secondary_actor.GetFirstNameNoTooltip] beni [actor.Custom('FortifiedBuilding')] garnizonuna götürdü; orada [secondary_actor.GetSheHe], [secondary_actor.GetHerHis] silah arkadaşları [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile kıyasıya talimler yaptı. Her maç arasında konuşuyorduk"

 lmf_interaction.1329.desc.secrec.secact.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_actor.GetFirstNameNoTooltip] beni [secondary_actor.GetCulture.GetNameNoTooltip] şiirleriyle eğlendirdi. [secondary_actor.GetSheHe|U] bunu zarifçe yaptı; her ne kadar prova edilmiş bir havayla olsa da"

 lmf_interaction.1329.desc.secrec.secact.library:0 "[actor.Custom('FortifiedBuilding')] kütüphanesini gezdik; [secondary_actor.GetFirstNameNoTooltip] bana ciltler arasındaki en sevdiği kitapları gösterdi. [secondary_actor.GetSheHe] edebiyattan söz ettiğinde [secondary_actor.GetHerHis|U] gözleri neredeyse parıldıyordu"

 lmf_interaction.1329.desc.secrec.secact.church:0 "[secondary_actor.GetFirstNameNoTooltip] beni [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'e götürdü; orada dindarlık üzerine vaazları dinledik. [secondary_actor.GetSheHe|U] inançla ilgili her şeye o kadar meraklı görünüyordu ki"

 lmf_interaction.1329.desc.secrec.secact.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önünde yoksullara sadaka dağıtarak geçirdik. [secondary_actor.GetFirstNameNoTooltip] [secondary_actor.GetHerHis] şefkatiyle öyle içten ve gerçek görünüyordu ki"

 lmf_interaction.1329.desc.secrec.secact.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdik; [secondary_actor.GetFirstNameNoTooltip] her şeyin tarihini büyük bir ilgi ve ayrıntıyla anlatıyordu. [secondary_actor.GetSheHe|U] öyle düşünceli görünüyordu ki"

 lmf_interaction.1329.desc.secrec.secact.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdik; en azından ilk başta canlı hissettiren bir sohbete daldık. [secondary_actor.GetFirstNameNoTooltip]'in konuşmaya fazlasıyla istekli olduğu çeşitli ilgi alanları vardı"

 lmf_interaction.1329.desc.secrec.secact.mid:0 ", ve [secondary_actor.GetHerHis] tavırlarından hoşlanıverdim.\n\nNe var ki zamanla [secondary_recipient.GetSheHe]'in aynı şeyleri hissetmediğini fark ettim. Konuştuğumda [secondary_recipient.GetHerHim]'i göz devirirken yakaladım ve ne zaman yaklaşsam [secondary_recipient.GetSheHe] irkiliyordu. Gerginlik dayanılmaz hale geldi."

 lmf_interaction.1329.desc.secrec.secrec.start:0 "İlk başta işler yeterince iyi gitti. "

 lmf_interaction.1329.desc.secrec.secrec.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] yakınlarındaki av gezisi keyifliydi; [secondary_actor.GetFirstNameNoTooltip] hoş görünüyordu ve [secondary_actor.GetSheHe|U] iyi bir av yoldaşıydı... en azından başlangıçta."

 lmf_interaction.1329.desc.secrec.secrec.hike:0 "[secondary_actor.GetFirstNameNoTooltip] yürüyüş boyunca yeterince hoştu ve temposuna da özen gösteriyordu. [secondary_actor.GetSheHe|U] sayısız mekânı işaret edip tarihlerini, kuru bir dille olsa da, enine boyuna anlattı."

 lmf_interaction.1329.desc.secrec.secrec.garrison:0 "[secondary_actor.GetFirstNameNoTooltip] beni [actor.Custom('FortifiedBuilding')] garnizonuna götürdü; orada [secondary_actor.GetSheHe], [secondary_actor.GetHerHis] silah arkadaşları [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile talimler yaptı, ama her maç arasında düşünceli bir şekilde benimle ilgilendi."

 lmf_interaction.1329.desc.secrec.secrec.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_actor.GetFirstNameNoTooltip] beni [secondary_actor.GetCulture.GetNameNoTooltip] şiirleriyle eğlendirdi. [secondary_actor.GetSheHe|U] [secondary_actor.GetHerselfHimself]'ini yeterince iyi idare etti; her ne kadar [secondary_actor.GetHerHis] şiir seçimleri tartışılır olsa da."

 lmf_interaction.1329.desc.secrec.secrec.library:0 "[actor.Custom('FortifiedBuilding')] kütüphanesini gezdik; [secondary_actor.GetFirstNameNoTooltip] bana ciltler arasındaki en sevdiği kitapları gösterdi. [secondary_actor.GetHerHis] seçimlerinden bazılarını sorguladım; ama [secondary_actor.GetHerHis] öğrenmeye duyduğu belirgin tutku beni rahatlattı."

 lmf_interaction.1329.desc.secrec.secrec.church:0 "[secondary_actor.GetFirstNameNoTooltip] beni [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'e götürdü; orada dindarlık üzerine vaazları dinledik. Bence [secondary_actor.GetFirstNameNoTooltip] gerçekten inançlı görünüyordu; sohbet çabaları daha az içten olsa da."

 lmf_interaction.1329.desc.secrec.secrec.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önünde yoksullara sadaka dağıtarak geçirdik. [secondary_actor.GetFirstNameNoTooltip] açıkça beni [secondary_actor.GetHerHis] cömertliğiyle etkilemeye çalışıyordu; bu ilk başta eğlenceliydi."

 lmf_interaction.1329.desc.secrec.secrec.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdik; [secondary_actor.GetFirstNameNoTooltip] her şeyin tarihini büyük bir ilgi ve ayrıntıyla anlatıyordu. Hoştu; her ne kadar araya tek kelime sıkıştıramasam da."

 lmf_interaction.1329.desc.secrec.secrec.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdik; en azından ilk başta canlı hissettiren bir sohbete daldık. [secondary_actor.GetFirstNameNoTooltip]'in o kadar çok ilgi alanı vardı ki [secondary_actor.GetSheHe]'in onlar hakkında dile getirebileceği görüşlerin sonu yok gibi görünüyordu."

 lmf_interaction.1329.desc.secrec.secrec.mid:0 "\n\nYavaş yavaş, ancak, giderek daha çok rahatsız olduğumu fark ettim. [secondary_recipient.GetHerHis|U] tavırları sinirime dokundu, [secondary_recipient.GetHerHis] gözlerimi devirtti ve gerginlik büyüdü. [secondary_recipient.GetSheHe] fark ettiyse bile söylemedi. Gerçekten de [secondary_recipient.GetSheHe] benden tamamen büyülenmiş görünüyordu... ama ya ben? Ben aynı hissetmiyordum."

 lmf_interaction.1329.desc.rival.secrec:0 "Bir ara tökezledim ve [secondary_actor.GetSheHe] bana güldü -- güldü! Yemin ederim, o an [secondary_actor.GetHerHis] boynunu sıkabilirdim."

 lmf_interaction.1329.desc.end.secrec:0 "\n\nGüneş battığında ve [actor.Custom('FortifiedBuilding')]'e döndüğümüzde, bunun bir eşleşme olmadığı açıktı."

 lmf_interaction.1329.desc.end.secrec.nomarry:0 "[actor.GetTitledFirstNameNoTooltip] açıkça kabul etti ve [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarını derhal iptal etti."

 lmf_interaction.1329.desc.end.secrec.marry:0 "[actor.GetTitledFirstNameNoTooltip] ise aynı fikirde değildi ve [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarına yine de devam etmek istiyor. O halde soru şu: ben istiyor muyum?"

 lmf_interaction.1329.desc.start:0 "[secondary_recipient.GetFirstNameNoTooltip]'ten haber aldım; [secondary_recipient.GetSheHe], [secondary_recipient.GetHerHis] [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ziyaretinin bir felaket olduğunu yazıyor.\n\n"

 lmf_interaction.1329.desc.both.loved:0 "Görünüşe göre işler yeterince iyi başladı. [secondary_recipient.GetSheHe|U] [secondary_actor.Custom('lmf_intro_activity_short')]'den keyif aldı; yalnızca [secondary_actor.GetFirstNameNoTooltip] [secondary_actor.GetHerselfHimself]'inden değil. "

 lmf_interaction.1329.desc.both.hated:0 "[secondary_recipient.GetSheHe|U] [secondary_actor.Custom('lmf_intro_activity_short')]'den nefret etti ve işler oradan sonra hep aşağı gitti. "

 lmf_interaction.1329.desc.both.neutral:0 "[secondary_recipient.GetSheHe|U] [secondary_actor.Custom('lmf_intro_activity_short')]'i katlanılabilir buldu; yalnızca [secondary_actor.GetFirstNameNoTooltip] [secondary_actor.GetHerselfHimself]'ini değil. "

 lmf_interaction.1329.desc.both.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den yolculukta tartıştılar; [secondary_actor.GetSheHe] sürekli [secondary_recipient.GetHerHim]'in önünde at sürüyor, [secondary_recipient.GetHerHim]'i yetişmek için zorlarken bırakıyordu. [secondary_recipient.GetSheHe] yetiştiğinde bile, anlatıldığına göre konuşmaları, gerçekleştiği nadir anlarda tuhaftı."

 lmf_interaction.1329.desc.both.hike:0 "Sohbet başlangıçta yeterince hoştu... ta ki bir tartışma soğuk sessizliklere yol açana dek. [secondary_actor.GetSheHe|U] amansız bir tempo tutturdu ve [secondary_recipient.GetHerHis] arazideki aşinalık eksikliğinden rahatsız olmuş görünüyordu. İkisi de orada olmak istemiyordu; ama o noktada artık çok geçti."

 lmf_interaction.1329.desc.both.garrison:0 "[secondary_actor.GetSheHe|U], [secondary_actor.GetHerHis] silah arkadaşları [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile talim yaparken [secondary_recipient.GetHerHim]'i neredeyse görmezden geldi; talimler bitince de işler pek düzelmedi. Yaşanan birkaç konuşma da tuhaftı ve soğuk sessizliklerle doluydu."

 lmf_interaction.1329.desc.both.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler, az konuştular. Sonra [secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHim]'e fazla yakın durmaya başladı; anlatılanlara göre uygunsuz davranıyor ve [secondary_recipient.GetSheHe]'in açıkça ilgilenmediği imalı tavırlar sergiliyordu."

 lmf_interaction.1329.desc.both.poetry:0 "[secondary_actor.GetSheHe|U], [actor.Custom('FortifiedBuilding')] bahçelerinde gezerlerken [secondary_recipient.GetHerHim]'i [secondary_actor.GetCulture.GetName] dizeleriyle eğlendirdi; ama [secondary_recipient.GetSheHe] ya şiirden ya da [secondary_actor.GetHerHim]'den sıkılmıştı. Her iki durumda da [secondary_actor.GetSheHe] alındı."

 lmf_interaction.1329.desc.both.library:0 "[secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHim]'e ciltler arasındaki en sevdiği kitapları gösterdi ve [secondary_recipient.GetSheHe]'in ilgisizliğinin büsbütün farkında değilmiş gibi görünüyordu."

 lmf_interaction.1329.desc.both.church:0 "Dindarlık üzerine vaazları dinlediler ama görünüşe göre başka pek bir şey yapmadılar. Yaşanan konuşmalar en iyi ihtimalle yapmacık ve tuhaftı."

 lmf_interaction.1329.desc.both.tavern:0 "[secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHim]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bir meyhaneye getirmek gibi tuhaf bir seçim yaptı; orada [secondary_recipient.GetHerHim]'i neredeyse bir köşeye terk etti. [secondary_actor.GetSheHe] sonunda [secondary_recipient.GetHerHim]'e döndüğünde, [secondary_recipient.GetSheHe] çileden çıkmıştı."

 lmf_interaction.1329.desc.both.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'de geçirdiler; ama birbirlerinden uzak durdular ve nadiren konuştular. Konuştuklarında da sohbetleri tuhaftı ve soğuk sessizliklerle doluydu."

 lmf_interaction.1329.desc.both.tour:0 "[secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHim]'e [actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gösterdi, her şeyin tarihini büyük bir ayrıntıyla anlattı... ve görünüşe göre [secondary_recipient.GetSheHe]'in hiç ilgilenmediği gerçeğinin farkında bile değildi."

 lmf_interaction.1329.desc.both.garden:0 "Gezinirken birbirlerinden uzak durdular ve açıkça başka herhangi bir yerde olmayı tercih edecekleri belliydi. Anlatıldığına göre yaşanan konuşmalar yapmacık ve tuhaftı; [secondary_actor.GetHerHim] [secondary_recipient.GetSheHe]'in söylediği her şeye göz deviriyordu."

 lmf_interaction.1329.desc.both.mid:0 "\n\nSu ve yağ gibiydiler; bir gün boyunca birbirlerinin eşliğinde vakit geçirdikten sonra birbirlerinden daha da az hoşlandılar."

 lmf_interaction.1329.desc.secact.start:0 "[secondary_actor.GetFirstNameNoTooltip] ilk başta yeterince hevesli görünüyordu, diye yazıyor [secondary_recipient.GetSheHe]. "

 lmf_interaction.1329.desc.secact.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den at sürüp çıktılar; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [secondary_actor.GetHerHis] sohbet becerileriyle büyülemek için elinden geleni yaptı. Gerçekten de [secondary_actor.GetSheHe] öylesine kafayı sıyırmış görünüyordu ki pek az av gerçekleşti."

 lmf_interaction.1329.desc.secact.hike:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] yakınlarındaki patikalarda yürüyüş yaptılar; [secondary_actor.GetFirstNameNoTooltip] yumuşak bir tempo tutturdu ve çok özenli davrandı. [secondary_actor.GetSheHe] en başından beri [secondary_recipient.GetFirstNameNoTooltip]'e gönül vermiş görünüyordu; her fırsatta [secondary_recipient.GetHerHim]'i etkilemeye çalışıyordu."

 lmf_interaction.1329.desc.secact.garrison:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.Custom('FortifiedBuilding')] garnizonuna götürdü; orada [secondary_actor.GetSheHe], [secondary_actor.GetHerHis] [actor.Custom('KnightCulturePluralNoTooltipLowercase')] yoldaşlarıyla müsabakalar yaptı, görünüşe göre [secondary_recipient.GetHerHim]'i etkilemek için ekstra çabalıyordu. [secondary_recipient.GetSheHe|U] aslında âşık görünüyordu."

 lmf_interaction.1329.desc.secact.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i sohbetiyle etkilemeye çalıştı. [secondary_actor.GetSheHe|U] görünüşe göre [secondary_recipient.GetHerHis] sessizliğini cesaret saydı, çünkü [secondary_recipient.GetSheHe]... uygunsuz davranmaya başladı. Fazla yakın durup imalı yorumlar yapıyor, her şeyin harika gittiğine kesin inanıyordu."

 lmf_interaction.1329.desc.secact.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetHerHim]'i [secondary_actor.GetCulture.GetNameNoTooltip] şiirleriyle eğlendirdi. [secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHis] göreli sessizliğini cesaret sayıp okumalarıyla daha da çok denedi; açıkça âşık olmuştu."

 lmf_interaction.1329.desc.secact.library:0 "[actor.Custom('FortifiedBuilding')] kütüphanesini gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'e ciltler arasındaki en sevdiği kitapları gösterdi. [secondary_actor.GetSheHe|U] bitmek bilmeden konuştu ve [secondary_recipient.GetHerHis] göreli sessizliğini cesaret saydı; [secondary_actor.GetSheHe] açıkça gönül vermişti."

 lmf_interaction.1329.desc.secact.church:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'e götürdü; orada dindarlık üzerine vaazları dinlediler. [secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHim]'i [secondary_actor.GetHerHis] inancıyla etkilemeye çalıştı; [secondary_recipient.GetHerHis] onayı onun için açıkça önemliydi."

 lmf_interaction.1329.desc.secact.tavern:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bir meyhaneye götürmek gibi tuhaf bir seçim yaptı; orada [secondary_actor.GetSheHe], [secondary_recipient.GetHerHim] ile eğlenmeye çalıştı. Rivayete göre [secondary_actor.GetSheHe] çok içti ve ikisinin de harika vakit geçirdiğini sandı."

 lmf_interaction.1329.desc.secact.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l] önünde yoksullara sadaka dağıtarak geçirdiler. [secondary_actor.GetFirstNameNoTooltip] açıkça âşık olmuştu; [secondary_recipient.GetFirstNameNoTooltip]'i cömertliğiyle etkilemeye çok çalışıyordu."

 lmf_interaction.1329.desc.secact.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'e her şeyin tarihini büyük bir ilgi ve ayrıntıyla anlatıyordu. Belki de fazlasıyla; [secondary_actor.GetHerHis] hevesi öyleydi."

 lmf_interaction.1329.desc.secact.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezerek, [secondary_recipient.GetSheHe]'in oldukça tek taraflı olduğunu söylediği bir sohbete daldılar. [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i etkilemeye hevesliydi ve [secondary_recipient.GetHerHim]'i büyülemek için çok uğraştı... ve [secondary_actor.GetSheHe]'in başarılı olduğunu düşündüğü açıktı."

 lmf_interaction.1329.desc.secact.hated:0 "\n\n[secondary_recipient.GetSheHe|U] ise aynı şeyleri hissetmediğini yazıyor. [secondary_recipient.GetSheHe] en başından beri [secondary_actor.Custom('lmf_intro_activity_short')]'den hoşlanmadı ve gün ilerledikçe bu [secondary_recipient.GetHerHim]'i giderek daha çok rahatsız etti."

 lmf_interaction.1329.desc.secact.loved:0 "\n\n[secondary_recipient.GetSheHe] [secondary_actor.Custom('lmf_intro_activity_short')]'den keyif aldığını yazmasına rağmen aynı şeyleri hissetmedi. [secondary_recipient.GetHerHis|U] keyfi gün ilerledikçe azaldı ve sonunda sıkıntı ve içerlemeye dönüştü."

 lmf_interaction.1329.desc.secact.neutral:0 "\n\n[secondary_recipient.GetSheHe|U] ise aynı şeyleri hissetmediğini yazıyor. [secondary_recipient.GetSheHe|U], ya sıkıldığını ya da rahatsız olduğunu söylüyor; gün ilerledikçe bu durum düzelmedi."

 lmf_interaction.1329.desc.secrec.start:0 "[secondary_recipient.GetFirstNameNoTooltip], [secondary_recipient.GetSheHe]'in ilk başta yeterince hevesli olduğunu yazıyor. "

 lmf_interaction.1329.desc.secrec.hunting:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den at sürüp çıktılar; [secondary_recipient.GetFirstNameNoTooltip], [secondary_actor.GetFirstNameNoTooltip]'i [secondary_recipient.GetHerHis] sohbet becerileriyle büyülemeye çalıştı. Gerçekten de [secondary_recipient.GetSheHe], [secondary_actor.GetHerHim]'i o kadar oyaladı ki pek az av yapıldı. [secondary_recipient.GetSheHe]'in gönlü kesinlikle kaymıştı."

 lmf_interaction.1329.desc.secrec.hike:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] yakınlarındaki patikalarda yürüyüş yaptılar; [secondary_actor.GetFirstNameNoTooltip] yumuşak bir tempo tutturdu ve anlatıldığına göre çok özenli davrandı. [secondary_recipient.GetFirstNameNoTooltip], en başından beri [secondary_actor.GetHerHim]'e gönül verdiğini, her fırsatta [secondary_actor.GetHerHim]'i etkilemeye çalıştığını söylüyor."

 lmf_interaction.1329.desc.secrec.garrison:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.Custom('FortifiedBuilding')] garnizonuna götürdü; orada [secondary_actor.GetSheHe], [secondary_actor.GetHerHis] silah arkadaşları [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile kıyasıya talimler yaptı. [secondary_recipient.GetFirstNameNoTooltip] etkilenmişti; her maçtan sonra [secondary_actor.GetHerHim]'e hayranlıkla bakıyordu."

 lmf_interaction.1329.desc.secrec.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip] ile fazlasıyla uygunsuz davrandı... en azından ilk başta. [secondary_actor.GetSheHe|U] fazla yakın durdu, imalı ve fazla samimiydi; ama [secondary_recipient.GetSheHe] hiç aldırış etmediğini iddia ediyor. Öğlene doğru [secondary_recipient.GetSheHe] kafayı sıyırmıştı."

 lmf_interaction.1329.desc.secrec.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_actor.GetFirstNameNoTooltip], [secondary_actor.GetHerHim]'i seçme [secondary_actor.GetCulture.GetNameNoTooltip] şiirleriyle eğlendirdi. [secondary_recipient.GetSheHe|U] hevesle karşılık verdi ve öğlene doğru [secondary_actor.GetHerHim]'den büsbütün etkilendiğini söylüyor."

 lmf_interaction.1329.desc.secrec.library:0 "[actor.Custom('FortifiedBuilding')] kütüphanesini gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetHerHim]'e ciltler arasındaki en sevdiği kitapları gösterdi. [secondary_recipient.GetSheHe|U] memnun kaldı ve [secondary_recipient.GetSheHe] keyifle sohbet ederken [secondary_actor.GetHerHim]'e gönül verdiğini söylüyor."

 lmf_interaction.1329.desc.secrec.church:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'e götürdü; orada vaazları dinlediler. Sonrasında uzun uzun konuştuklarında, [secondary_recipient.GetSheHe] kısa sürede gönlünün kaydığını yazıyor."

 lmf_interaction.1329.desc.secrec.tavern:0 "[secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bir meyhaneye getirmek gibi tuhaf bir seçim yaptı; orada [secondary_actor.GetSheHe], [secondary_recipient.GetHerHim] ile eğlenmeye çalıştı. [secondary_recipient.GetSheHe|U] bu oyuna ayak uydurdu; bol bol içti ve her fırsatta [secondary_actor.GetHerHim]'e sevgisini gösterdi."

 lmf_interaction.1329.desc.secrec.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in önünde yoksullara sadaka dağıtarak geçirdiler. [secondary_recipient.GetFirstNameNoTooltip] gönül vermişti ve [secondary_actor.GetFirstNameNoTooltip]'i [secondary_recipient.GetHerHis] cömertliğiyle etkilemeye çalıştı."

 lmf_interaction.1329.desc.secrec.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'e her şeyin tarihini büyük bir ilgi ve ayrıntıyla anlatıyordu. [secondary_recipient.GetSheHe|U] bu muameleden keyif aldı ve her fırsatta [secondary_actor.GetHerHim]'i etkilemeye çok çalıştı."

 lmf_interaction.1329.desc.secrec.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezerek uzun bir sohbete daldılar. [secondary_recipient.GetFirstNameNoTooltip], [secondary_actor.GetFirstNameNoTooltip]'i etkilemeye hevesliydi ve [secondary_actor.GetHerHim]'i büyülemek için çok uğraştı... ve [secondary_recipient.GetSheHe], başarılı olduğunu düşündüğünü söylüyor."

 lmf_interaction.1329.desc.secrec.hated:0 "\n\n[secondary_actor.GetFirstNameNoTooltip] ise aynı şeyleri açıkça hissetmiyordu. [secondary_actor.GetSheHe|U] kimi zaman [secondary_recipient.GetFirstNameNoTooltip]'ten sıkılmış, kimi zaman [secondary_recipient.GetHerHim]'e içerlemiş görünüyordu. [secondary_recipient.GetHerHis|U] hayal kırıklığı hissediliyor."

 lmf_interaction.1329.desc.secrec.loved:0 "\n\n[secondary_recipient.GetHerHis] [secondary_actor.Custom('lmf_intro_activity_short')]'den bariz şekilde keyif almasına rağmen, [secondary_actor.GetFirstNameNoTooltip]'in aynı şeyleri hissetmediği açıktı. [secondary_actor.GetSheHe|U] gün ilerledikçe [secondary_recipient.GetHerHim]'den yavaş yavaş sıkıldı ve bu, içerlemeye dönüştü. [secondary_recipient.GetHerHis|U] hayal kırıklığı hissediliyor."

 lmf_interaction.1329.desc.secrec.neutral:0 "\n\n[secondary_actor.GetFirstNameNoTooltip] ise aynı şeyleri açıkça hissetmiyordu. [secondary_recipient.GetSheHe|U], [secondary_actor.GetSheHe]'in kimi zaman [secondary_recipient.GetHerHim]'den sıkılmış, kimi zaman [secondary_recipient.GetHerHim]'e içerlemiş göründüğünü yazıyor. [secondary_recipient.GetHerHis|U] hayal kırıklığı hissediliyor."

 lmf_interaction.1329.desc.rival:0 "[secondary_recipient.GetFirstNameNoTooltip]'in aslında söyleyecek tek bir hoş sözü yoktu. Saf ve tam bir nefret."

 lmf_interaction.1329.desc.end.nomarry:0 "\n\n[actor.GetTitledFirstNameNoTooltip] bunun uygun bir eşleşme olmadığı konusunda hemfikir oldu ve önerilen [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarına son verdi. [secondary_recipient.GetFirstNameNoTooltip] derhal geri dönecek."

 lmf_interaction.1329.desc.end.marry:0 "\n\nNe var ki tuhaf bir şekilde, [actor.GetTitledFirstNameNoTooltip] bunun uygun bir eşleşme olmadığına katılmıyor ve [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarına yine de devam etmek istiyor. [secondary_recipient.GetFirstNameNoTooltip] bunun iyi bir fikir olmadığını düşünüyor... ama belki de en iyisi budur?"

 lmf_interaction.1329.a:0 "[secondary_actor.GetTitledFirstNameNoTooltip] ile evleneceğim."

 lmf_interaction.1329.b:0 "Kabul ediyorum. [secondary_recipient.GetSheHe|U], [secondary_actor.GetTitledFirstNameNoTooltip] ile evlenecek."

 lmf_interaction.1329.c:0 "Hayır. [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarını iptal et."

 lmf_interaction.1329.d:0 "Bu da böyle gitti."

 lmf_interaction.1331.t:0 "Kaçak"

 lmf_interaction.1331.desc.reject:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('rebel'))], [rebel.GetHerHis] [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('intended_spouse'))] ile yaklaşan evliliği haberini hiç de iyi karşılamadı. Hiç de.\n\n"

 lmf_interaction.1331.desc.start:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('rebel'))], [rebel.GetHerHis] kendi başına bir [rebel.Custom('WifeHusbandOpp')] seçme hakkını elimden almamı hiç de iyi karşılamadı. Hiç de.\n\n"

 lmf_interaction.1331.desc.mid:0 "İlk başta herkes [rebel.GetSheHe]'in öfkeyle odadan çıkıp gittiğini sandı. Sonra [rebel.GetSheHe]'in [actor.Custom('FortifiedBuilding')]'den büsbütün kaybolduğu, üstelik tek bir not bile bırakmadan sıvıştığı anlaşıldı.\n\n"

 lmf_interaction.1331.desc.septon:0 "[rebel.GetSheHe]'in, istemediği bir [intended_spouse.GetWifeHusband] kabul etmektense İnanç'a katılmak için yemin ettiğini ancak sonradan öğrendik.\n\n"

 lmf_interaction.1331.desc.maester:0 "[rebel.GetSheHe]'in Kaledonya'ya gittiğini ancak sonradan öğrendik; istemediği bir [intended_spouse.GetWifeHusband] kabul etmektense üstat olmayı seçmiş.\n\n"

 lmf_interaction.1331.desc.wall:0 "[rebel.GetSheHe]'in Gece Nöbetçileri'ne katıldığını ancak sonradan öğrendik. [rebel.GetSheHe], istemediği bir [intended_spouse.GetWifeHusband] kabul etmektense Sur'daki hayata katlanmayı tercih etmiş görünüyordu.\n\n"

 lmf_interaction.1331.desc.ranoff:0 "[rebel.GetSheHe]'in tamamen kaçtığını ancak sonradan öğrendik; en son yakındaki bir köyden geçerken görülmüş. Birkaç arama ekibi gönderildi; ama eli boş döndüler ve [rebel.GetSheHe]'in bir daha dönüp dönmeyeceğini kimse bilmiyor. Bütün bunlar, istemediği bir [intended_spouse.GetWifeHusband] kabul etmektense.\n\n"

 lmf_interaction.1331.desc.end.reject:0 "Söylemeye gerek yok, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('intended_spouse'))] ile düğün iptal."

 lmf_interaction.1331.desc.end:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('rebel'))]'in bu kadar inatçı olacağını kim tahmin edebilirdi?"

 lmf_interaction.1331.a:0 "Bu da böyle gitti."

 lmf_interaction.1500.opening.spouseliege:0 "[actor.GetLadyLord]'üm ve [actor.GetWifeHusband]'im,"

 lmf_interaction.1500.opening.liege:0 "[actor.GetLadyLord]'üm,"

 lmf_interaction.1500.opening.love:0 "Sevgilim,"

 lmf_interaction.1500.opening.spouse:0 "[actor.GetWifeHusband|U],"

 lmf_interaction.1500.nemesis:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e, sırf senin emrine amade olmanın sözde keyfi için gönüllü gitmektense kafamı taş duvara vurmayı tercih ederim.\n\nElbette bu daveti şaka olarak yazmış olmalısın."

 lmf_interaction.1500.rival:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gelmek için bir davet mi? Yaptıklarından sonra seni görmek için mi?\n\nHayır, şimdilik olduğum yerde kalayım diyorum, teşekkürler."

 lmf_interaction.1500.betray:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gelmek için bir davet mi? Seni görmek için mi?\n\nHayır, sanırım ihanetin hâlâ çok taze; en azından şimdilik seninle daha fazla vakit geçirmeye dayanamam."

 lmf_interaction.1500.spouse:0 "Karı koca olarak birlikte vakit geçirmemizin zamanı geldiğine katılıyorum; ama şu an [recipient.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]'den kendimi koparmam imkânsız.\n\nAnlayacağından eminim."

 lmf_interaction.1500.lover:0 "Ah, bu daveti geri çevirmek zorunda kalmasam ne kadar iyi olurdu; ama korkarım çevirmek zorundayım. Şu an [recipient.GetCurrentLocation.GetTitle.GetNameNoTier]'den ayrılmam imkânsız.\n\nYakında, aşkım! Söz veriyorum."

 lmf_interaction.1500.a:0 "Eh, denemeye değerdi."

 lmf_interaction.1501.lover:0 "Tam seni düşünüyordum ki işte bu hoş davet geldi!\n\n[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e yolculuğum için hazırlanacağım; yakında görüşürüz."

 lmf_interaction.1501.spouse:0 "Evet, sanırım karı koca olarak birbirimizle vakit geçirme zamanı, değil mi?\n\n[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e yolculuğum için hazırlanacağım."

 lmf_interaction.1501.a:0 "Sabırsızlanıyorum!"

 lmf_interaction.1503.t:0 "Ziyaret İptal Edilsin mi?"

 lmf_interaction.1503.desc.atwar.betrayed:0 "Kahpe hain! [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))]'im ziyaretimi bir oyalama olarak kullandı; daha yoldayken saldırdı.\n\nDerhal [origin.GetTitle.GetNameNoTierNoTooltip]'e dönmeliyim!"

 lmf_interaction.1503.desc.atwar.betrayer:0 "Artık [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))]'ime karşı bir savaşın içine çekildim.\n\n[destination.GetTitle.GetNameNoTierNoTooltip]'de beni bekleyen karşılamanın şu an sıcak olacağından şüpheliyim; o yüzden [origin.GetTitle.GetNameNoTierNoTooltip]'e dönmekten başka bir şey kalmıyor."

 lmf_interaction.1503.desc.atwar.rootdefender:0 "Seyahat ederken, her şeyin ortasında [attacker.GetPrimaryTitle.GetNameNoTooltip] tarafından saldırıya uğruyorum.\n\nSanırım soru şu: [origin.GetTitle.GetNameNoTierNoTooltip]'e geri dönüyor muyum? Zamanında varıp bir fark yaratabilecek miyim?"

 lmf_interaction.1503.desc.atwar.rootattacker:0 "Ve şimdi [defender.GetPrimaryTitle.GetNameNoTooltip] ile savaştayım, yolculuğumun tam ortasındayım.\n\nSanırım soru şu: [origin.GetTitle.GetNameNoTierNoTooltip]'e geri dönüyor muyum? Zamanında varıp bir fark yaratabilecek miyim?"

 lmf_interaction.1503.desc.atwar.actorattacker:0 "Az önce [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))]'imin [defender.GetPrimaryTitle.GetNameNoTooltip]'e karşı savaşa gittiği haberini aldım; [actor.GetSheHe] geleceğimi bilmesine rağmen.\n\nŞimdi soru şu: [origin.GetTitle.GetNameNoTierNoTooltip]'e geri dönüyor muyum, yoksa devam edip en iyisini mi umuyorum?"

 lmf_interaction.1503.desc.atwar.actordefender:0 "Az önce [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))]'imin [attacker.GetPrimaryTitle.GetNameNoTooltip] tarafından saldırıya uğradığı haberini aldım. Ne korkunç bir zamanlama!\n\nŞimdi soru şu: [origin.GetTitle.GetNameNoTierNoTooltip]'e geri dönüyor muyum, yoksa devam edip en iyisini mi umuyorum?"

 lmf_interaction.1503.desc.atwar.actor:0 "Az önce [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))]'imin bir savaşa çekildiği haberini aldım; her ne kadar [destination.GetTitle.GetNameNoTierNoTooltip] yakın bir tehlike altında görünmese de.\n\nYine de [origin.GetTitle.GetNameNoTierNoTooltip]'e geri dönüyor muyum, yoksa devam edip en iyisini mi umuyorum?"

 lmf_interaction.1503.desc.atwar:0 "Az önce bir savaşa çekildiğim haberini aldım; seyahatteyim ve evime hiç yakın değilim.\n\nSanırım soru şu: [origin.GetTitle.GetNameNoTierNoTooltip]'e geri dönüyor muyum? Zamanında varıp bir fark yaratabilecek miyim?"

 lmf_interaction.1503.a:0 "Derhal geri dönmeliyim."

 lmf_interaction.1503.a.title:0 "Ziyaret İptal Edildi"

 lmf_interaction.1503.a.desc:0 "[recipient.GetShortUINameNoTooltip|U], savaş yüzünden ziyareti iptal edip [origin.GetTitle.GetNameNoTierNoTooltip]'e dönmek zorunda kaldı."

 lmf_interaction.1503.b:0 "Bir anlamı yok. [destination.GetTitle.GetNameNoTierNoTooltip]'e devam et."

 lmf_interaction.1504.t:0 "Üzücü Haber"

 lmf_interaction.1504.desc:0 "En kötü haber! [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))]'im öldü ve ben burada, bu konuda hiçbir şey yapamadan duruyorum.\n\n[destination.GetTitle.GetNameNoTierNoTooltip]'e yolculuğumu sürdürmenin bir anlamı yok. [origin.GetTitle.GetNameNoTierNoTooltip]'e dönmeliyim."

 lmf_interaction.1504.a:0 "Ah, [actor.GetFirstNameNoTooltip]!"

 lmf_interaction.1504.tt:0 "[recipient.GetShortUINameNoTooltip|U], [actor.GetShortUINamePossessiveNoFormat] erken ölümü yüzünden ziyareti iptal edip [origin.GetTitle.GetNameNoTierNoTooltip]'e dönmek zorunda kaldı."

 lmf_interaction.1505.a.title:0 "Ziyaret İptal Edildi"

 lmf_interaction.1505.desc.begin:0 "[recipient.GetShortUINameNoTooltipNoFormat|U], [CharYourHerHis(recipient)] [destination.GetTitle.GetNameNoTierNoTooltip] ziyaretini iptal etmek zorunda kaldı [CharWereWas(recipient)]"

 lmf_interaction.1505.desc.norelationship:0 "çünkü [CharYourHerHis(recipient)] [actor.GetShortUINameNoTooltipNoFormat] ile ilişkisi sona erdi."

 lmf_interaction.1505.desc.notprovince:0 "çünkü burası artık [CharYourHerHis(actor)] başkenti değil."

 lmf_interaction.1505.desc.actorleft:0 "çünkü [CharYouSheHe(actor)] artık orada [CharAreIs(actor)] değil."

 lmf_interaction.1505.desc.actorill:0 "çünkü [CharYouSheHe(actor)] ciddi bir hastalığa yakalanmış [CharHaveHas(actor)]."

 lmf_interaction.1505.desc.rootill:0 "çünkü [CharYouSheHe(recipient)] ciddi bir hastalığa yakalanmış [CharHaveHas(recipient)]."

 lmf_interaction.1505.desc.actorimprison:0 "çünkü [CharYouSheHe(actor)] hapsedilmiş [CharHaveHas(actor)]."

 lmf_interaction.1505.desc.rootimprison:0 "çünkü [CharYouSheHe(recipient)] hapsedilmiş [CharHaveHas(recipient)]."

 lmf_interaction.1505.desc.actorpregnant:0 "çünkü [CharYouSheHe(actor)] artık hamile [CharAreIs(actor)]."

 lmf_interaction.1505.desc.rootpregnant:0 "çünkü [CharYouSheHe(recipient)] artık hamile [CharAreIs(recipient)]."

 lmf_interaction.1505.desc.actorhealth:0 "çünkü [CharYouSheHe(actor)] yeterince sağlıklı [CharAreIs(actor)] değil."

 lmf_interaction.1505.desc.roothealth:0 "çünkü [CharYouSheHe(recipient)] yeterince sağlıklı [CharAreIs(recipient)] değil."

 lmf_interaction.1505.desc.default:0 "."

 lmf_interaction.1506.t.reclove:0 "Buradayım, Aşkım!"

 lmf_interaction.1506.t.rec:0 "[actor.GetWifeHusband|U] ile Bir Akşam"

 lmf_interaction.1506.t.love:0 "Aşkım Geliyor"

 lmf_interaction.1506.t:0 "[recipient.GetWifeHusband|U] ile Bir Akşam"

 lmf_interaction.1506.desc.reclove.notspouse:0 "Nihayet! [destination.GetTitle.GetNameNoTierNoTooltip]'e ulaştım; bitkinim ama [actor.GetFirstNameNoTooltip]'i görmek için şimdiden heyecanlıyım.\n\nVe işte [actor.GetSheHe] orada; şimdiden gülümsüyor, planladığımız güne birlikte başlamak için can atıyor... ve birden kendimi o kadar yorgun hissetmiyorum.\n\n[actor.GetFirstNameNoTooltip] bizi [actor.Custom('FortifiedBuilding')]'in meraklı gözlerden uzak özel bir köşesine götürüyor ve orada elimizdeki azıcık zamanın kıymetini birlikte biliyoruz."

 lmf_interaction.1506.desc.reclove.spouse:0 "Nihayet! [destination.GetTitle.GetNameNoTierNoTooltip]'e ulaştım; bitkinim ama [actor.GetFirstNameNoTooltip]'i görmek için şimdiden heyecanlıyım.\n\nVe işte [actor.GetSheHe] orada; şimdiden gülümsüyor, bana mesaj iletmek ve [actor.GetLadyLord]'ünün [recipient.GetWifeHusband]'iyle görüşmek için can atan bir hizmetkâr sürüsüyle sarılı. Neyse ki [actor.GetFirstNameNoTooltip], planladığımız güne birlikte başlamak için can attığından, birkaç dakika içinde hepsini kovuyor.\n\n[actor.GetSheHe|U] beni [actor.GetHerHis] yatak odasına çıkarıyor; [actor.Custom('FortifiedBuilding')] görevlilerinin bu kanata büsbütün girmesini yasaklıyor. İyi bir gece olacak."

 lmf_interaction.1506.desc.rec.spouse:0 "Nihayet! [destination.GetTitle.GetNameNoTierNoTooltip]'e ulaştım; bitkinim ve dinlenmek için can atıyorum... ama bana mesaj iletmek ve [actor.GetLadyLord]'ünün [recipient.GetWifeHusband]'iyle görüşmek için can atan bir sürü hizmetkâr çoktan hazır. Onlarla bir süre uğraşıp kovaladıktan sonra [actor.GetFirstNameNoTooltip]'in [actor.Custom('FortifiedBuilding')]'de benim için ayırdığı odalara çekiliyorum.\n\n[actor.GetSheHe|U] daha sonra, neyse ki hazır olduğumda geliyor ve ikimiz hiç de nahoş olmayan bir akşamı birbirimizin eşliğinde geçirmeye başlıyoruz."

 lmf_interaction.1506.desc.love.notspouse:0 "Nihayet! [recipient.GetFirstNameNoTooltip], yolculuğun yorgunluğuyla ama beni gördüğüne açıkça memnun bir halde [destination.GetTitle.GetNameNoTierNoTooltip]'e ulaştı.\n\nOnu avluda gülümseyerek karşılıyorum; planladığımız güne birlikte başlamak için can atıyorum... ve birden [recipient.GetFirstNameNoTooltip] artık o kadar yorgun görünmüyor.\n\n[recipient.GetHerHim]'i [actor.Custom('FortifiedBuilding')]'in çoğunlukla kullanılmayan, meraklı gözlerden uzak özel bir köşesine götürüyorum ve orada elimizdeki azıcık zamanın kıymetini birlikte biliyoruz."

 lmf_interaction.1506.desc.love.spouse:0 "Nihayet! [recipient.GetFirstNameNoTooltip], yolculuğun yorgunluğuyla ama beni gördüğüne açıkça memnun bir halde [destination.GetTitle.GetNameNoTierNoTooltip]'e ulaştı.\n\nOnu avluda karşılıyorum; etrafı, [recipient.GetHerHim]'e mesaj iletmek ve [actor.GetLadyLord]'ünün [recipient.GetWifeHusband]'iyle görüşmek için can atan bir hizmetkâr sürüsüyle sarılı. Neyse ki [actor.GetFirstNameNoTooltip], planladığımız güne birlikte başlamak için can attığından, birkaç dakika içinde hepsini kovuyor.\n\n[recipient.GetHerHim]'i yatak odama çıkarıyorum; [actor.Custom('FortifiedBuilding')] görevlilerinin bu kanata büsbütün girmesini yasaklıyorum. İyi bir gece olacak."

 lmf_interaction.1506.desc.spouse:0 "Nihayet! [recipient.GetFirstNameNoTooltip], [origin.GetTitle.GetNameNoTierNoTooltip]'den gelen uzun yolculuğun yorgunluğuyla [destination.GetTitle.GetNameNoTierNoTooltip]'e ulaştı.\n\n[recipient.GetHerHim]'e [actor.Custom('FortifiedBuilding')]'de kendisi için ayırdığım odalarda dinlenip hazırlanması için zaman tanıyorum ve [recipient.GetHerHim]'i, [recipient.GetHerHim]'e mesaj iletmek ve [actor.GetLadyLord]'ünün [recipient.GetWifeHusband]'iyle görüşmek için bekleyen onlarca hizmetkârla baş başa bırakıyorum.\n\nNihayet kapıyı çaldığımda [recipient.GetFirstNameNoTooltip] fazlasıyla hazır ve ikimiz hiç de nahoş olmayan bir akşamı birbirimizin eşliğinde geçirmeye başlıyoruz."

 lmf_interaction.1506.a:0 "Bu geceler fazlasıyla seyrek."

 lover_rating_reduce_to_4_tt:0 "@warning_icon! [lover.GetFirstNameNoTooltip] ile [lmf_lover_rating|E]'in #difficulty_hard Kalıcı Aşk#! seviyesine düşürülecek"

