 lmf_interaction.1328.desc.secrec.hated:0 "\n\n[secondary_recipient.GetSheHe|U] ise aynı şeyleri açıkça hissetmiyordu. [secondary_recipient.GetSheHe] en başından beri [secondary_actor.Custom('lmf_intro_activity_short')]'den hoşlanmadı ve gün ilerledikçe bu [secondary_recipient.GetHerHim]'i giderek daha çok rahatsız etti."

