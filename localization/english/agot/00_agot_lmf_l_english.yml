 lmf_feast.1002.desc:0 "İşler öyle güzel başlamıştı ki.\n\nAile, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in büyük salonunda bir ziyafet için toplandı; ilk başta oldukça keyifliydi. [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family'))|U] [dinner_pos_family.Custom('dinner_activity_pos_past')].\n\nDerken [family_rival.GetFirstNameNoTooltip] ile tartışmaya başladık.\n\n[family_rival.Custom2('dinner_rival_root_reason', ROOT.Char )] [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_rival'))] ile ikimiz de iyiden iyiye kafayı bulmuştuk; [family_rival.GetHerHim]'in birbiri ardına sivri yorumlar yaptığını hatırlıyorum... o kadar ki [family_rival.GetHerHim]'e durmasını emrettim.\n\nSonra bağırıyorduk, gittikçe daha yüksek sesle; ta ki diğerleri telaşlanıp araya girene dek. Ama artık çok geçti. İkimiz de önümüzdeki günlerde pişman olacağımız sözler söyledik."

 lmf_feast.1002.a:0 "Şey, bu talihsizlikti."

