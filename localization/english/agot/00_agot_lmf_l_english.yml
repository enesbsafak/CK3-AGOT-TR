 lmf_heir.1675.t:0 "Avda"

 lmf_heir.1675.desc.invite:0 "Kısa bir süre önce [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'in yakındaki bir ormana av gezisine katılmam için davetiyesini almak beni memnun etti. [your_heir.Custom('polite_gender_ref')]'in ne kadar eğitim alacağını bilmiyorum; ama yalnızca ikimiz ve birkaç muhafızla birlikte, gezinin en azından birbirimizi daha iyi tanımak için bir fırsat olacağı kesin gibiydi.\n\n"

 lmf_heir.1675.desc.invite.poorly:0 "Şey, tam da bunu yaptı ve sonuçlar iyi olmadı. Neredeyse hemen yağmur yağdı; [your_heir.GetTitledFirstNameNoTooltip] durmadan şikâyet etti... av bulmakta zorlandığımızda daha da çok. Sonunda bulduğumuzda, [your_heir.GetSheHe] canavara nişanını ıskaladı ve sonra [your_heir.GetHerHim]'i oyaladığım için #EMP beni#! suçlama cüretini gösterdi!\n\n[your_heir.GetHerHis] bitmek bilmeyen sefaletine neredeyse bir hafta daha katlandıktan sonra, [ROOT.Char.Custom('FortifiedBuilding')]'e dönüp [your_heir.GetTitledFirstNameNoTooltip]'i ait olduğu ormanda bırakmaktan memnundum."

 lmf_heir.1675.desc.invite.well:0 "Tam da bunu yaptı. [your_heir.GetTitledFirstNameNoTooltip] ve ben kamp ateşinin başında bazı güzel akşamlar geçirdik; [your_heir.Custom('polite_gender_ref')]'e, başka türlü aklıma gelmeyecek hükümdarlık yönleri hakkında tavsiyeler verebildim. Biraz av bulmayı başardık ve [your_heir.GetSheHe]'in baştan sona ne kadar hoş bir eşlik olduğunu memnuniyetle fark ettim.\n\n[ROOT.Char.Custom('FortifiedBuilding')]'e döndüğümüzde, bunun sona erdiğini görmeye neredeyse üzülüyordum."

 lmf_heir.1675.desc.start:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )], [ROOT.Char.Custom('FortifiedBuilding')] yakınlarındaki küçük bir ormana, yanına yalnızca birkaç muhafız alarak av gezisine çıktı. [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'inin böyle bir oyalanmaya ne diyeceğini bilmiyorum; bu, [your_heir.GetSheHe]'in buraya eğitim için geldiği türden bir şeye hiç benzemiyordu. Ama belki [your_heir.GetTitledFirstNameNoTooltip]'in molaya ihtiyacı vardı?\n\n"

 lmf_heir.1675.desc.poorly:0 "Ne yazık ki [your_heir.GetSheHe]'in pek bir şey öğrendiğini sanmıyorum. [your_heir.GetSheHe] uzaktayken haftaların çoğu yağmurlu geçti ve [your_heir.GetSheHe] hem eli boş hem de perişan bir halde döndü. En azından [your_heir.GetSheHe] vahşi bir hayvana yem olmadı. [heir_liege.GetTitledFirstNameNoTooltip] ne derdi acaba?"

 lmf_heir.1675.desc.well:0 "Neyse ki [your_heir.GetHerHis] yolculuğu iyi geçmiş görünüyor. Hava güzeldi; [your_heir.GetSheHe] birkaç hafta sonra elinde kürkler ve yüzünde kocaman bir gülümsemeyle döndü."

 lmf_heir.1675.desc.notrain:0 "Anladığım kadarıyla [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki zamanının çoğunu yakındaki ormanlarda avlanarak geçirdi. Sanırım aynısını [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'de de yapabilirdi; ama [your_heir.GetTitledFirstNameNoTooltip]'in [ROOT.Char.Custom('FortifiedBuilding')]'e girmesine izin vermediğim için [your_heir.GetSheHe]'in eğlencesini başka yerde bulmaktan başka çaresi kalmadığını düşünüyorum.\n\n"

 lmf_heir.1675.desc.notrain.poorly:0 "Ne yazık ki, bana söylendiğine göre yolculuk iyi geçmemiş. Hava berbattı ve av kıttı; bir ara [your_heir.GetTitledFirstNameNoTooltip], onu çıkaracak kimsenin olmadığı çamurlu bir uçuruma düşüp oldukça ağır yaralandı. Görünüşe göre [your_heir.GetSheHe] günlerce orada mahsur kaldı!\n\nUmarım [your_heir.GetSheHe] kötü geçen bu gezileri bana karşı tutmaz."

 lmf_heir.1675.desc.notrain.well:0 "En azından yolculuk iyi geçti, bana söylendiğine göre. Hava iyi gitti ve [your_heir.GetTitledFirstNameNoTooltip] nihayet döndüğünde elinde bir yığın kürk ve yüzünde oldukça gülünç bir gülümseme vardı.\n\nBelki [your_heir.GetSheHe] bu harika av gezisini, eğitim eksikliği için yeterli bir telafi sayar? İnsan ancak umut eder."

 lmf_heir.1675.a:0 "Ne güzel bir zaman!"

 lmf_heir.1675.b:0 "[your_heir.GetSheHe]'in [your_heir.GetHerselfHimself]'inden keyif aldığına sevindim."

 lmf_heir.1675.c:0 "İkimiz için de ne sefil bir deneyim."

 lmf_heir.1675.d:0 "Ne yazık."

 excellent_hunting_trip:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], yakındaki bir ormanda birlikte çıktıkları av gezisinde yakınlaştılar."

 excellent_hunting_trip_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [CHARACTER.GetShortUINameNoTooltipNoFormat], yakındaki bir ormanda birlikte çıktıkları av gezisinde yakınlaştılar."

 disastrous_hunting_trip:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], birlikte çıktıkları felaket av gezisinde [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] sinirlerini bozdu."

 disastrous_hunting_trip_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], birlikte çıktıkları felaket av gezisinde [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] sinirlerini bozdu."

 lmf_heir.1676.t:0 "Gezen Varis"

 lmf_heir.1676.train:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftayı "

 lmf_heir.1676.notrain:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç ayı büyük ölçüde "

 lmf_heir.1676.desc.begin:0 "[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] çevresini gezerek, yerel köyleri ve [ROOT.Char.GetCapitalLocation.GetCounty.GetFaith.HouseOfWorshipPlural|l]'leri ziyaret edip insanları tanıyarak. Doğrusu övgüye değer bir çaba.\n\n"

 lmf_heir.1676.desc.poorly:0 "Ne yazık ki, işlerin [your_heir.GetTitledFirstNameNoTooltip]'in umduğu kadar iyi gittiğini sanmıyorum. Hava berbattı; o yüzden [your_heir.Custom('polite_gender_ref')] yolculuğunun yarısını, yapacak pek bir şeyi olmayan hüzünlü bir [ROOT.Char.GetCapitalLocation.GetCounty.GetCulture.GetNameNoTooltip] çiftlik evinde geçirdi. Sonra, daha sonra, sanırım [your_heir.GetSheHe] haydutlar tarafından soyuldu... her ne kadar [your_heir.GetSheHe] bu konuda yorum yapmayı reddetse de.\n\nUmarız [your_heir.GetSheHe] en azından bundan öğretici bir şey çıkarmıştır, değil mi?"

 lmf_heir.1676.desc.well:0 "Anladığım kadarıyla yolculuk oldukça iyi geçti. Hava beklenenden iyiydi; o yüzden [your_heir.Custom('polite_gender_ref')] işi bitene dek kontluğun yarısından fazlasını gezdi. İlginç tarihî yerlerden inşaat projelerine, eski mezarlıklara kadar her şey ziyaret edildi... Doğrusu [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'in bu kadarını bile #EMP görmüşlüğüm#! yoktur.\n\n[your_heir.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom('FortifiedBuilding')]'e döndüğünde keyfi yerinde görünüyordu; umarız bu gezi [your_heir.GetHerHim]'e umduğu eğitimi sağlamıştır, değil mi?"

 lmf_heir.1676.a:0 "Muhteşem!"

 lmf_heir.1676.b:0 "Her şeye sahip olamayız, değil mi?"

 lmf_heir.1677.t:0 "Eğlenceden Anlayan Varis"

 lmf_heir.1677.desc.castle:0 "Görünüşe göre [ROOT.Char.Custom('FortifiedBuilding')]'den bir mola ihtiyacı duyarak,"

 lmf_heir.1677.desc.away:0 "Hâlâ [ROOT.Char.Custom('FortifiedBuilding')]'e gelmemeyi tercih ederek,"

 lmf_heir.1677.desc.none:0 "[ROOT.Char.Custom('FortifiedBuilding')]'de herhangi bir vakit geçirmek yerine,"

 lmf_heir.1677.desc.invite:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )], çok uzak olmayan bir kasabadaki meşhur bir meyhanede [your_heir.GetHerHim]'e katılmamı istedi. İlk başta gitmeye gönülsüzdüm; ama sonra [your_heir.GetTitledFirstNameNoTooltip] gibi bir [your_heir.Custom('polite_gender_ref')]'in sıradan halkın arasında ne tür bir belaya bulaşabileceğini düşününce en iyisinin ona eşlik etmek olduğunu anladım... tabii yakın mesafede birkaç muhafızla birlikte.\n\n"

 lmf_heir.1677.desc.invite.poorly:0 "Meğer içgüdülerim doğruymuş. [your_heir.GetTitledFirstNameNoTooltip], [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'inin gözünün önünden çıktığı için biraz rahatlamaya can atıyordu ve gece boyunca [your_heir.GetSheHe]'in [your_heir.GetHerselfHimself]'ini zar zor kontrol edebileceği kadar sarhoş oldu. [your_heir.GetSheHe|U] bir meyhane kavgası çıkardı, beni defalarca aşağıladı ve "

 lmf_heir.1677.desc.invite.well:0 "Meğer endişelenmeme gerek yokmuş. [your_heir.GetTitledFirstNameNoTooltip] [your_heir.GetHerHis] soğukkanlılığını korudu ve harika bir akşam geçirdi. Hatta benim de öyle yaptığımı söyleyebilirim. İkimiz bir kadeh eşliğinde onlarca hikâye paylaştık, meyhane müşterilerine şarkı söylettik ve "

 lmf_heir.1677.desc.invite.woman:0 "Hatta sanırım her şeyin ortasında hoş bir genç kızın [your_heir.GetHerHim]'i tenha bir yere götürdüğünü bile gördüm.\n\n"

 lmf_heir.1677.desc.invite.man:0 "Hatta sanırım her şeyin ortasında yakışıklı bir adamın [your_heir.GetHerHim]'i tenha bir yere götürdüğünü bile gördüm.\n\n"

 lmf_heir.1677.desc.invite.nosex:0 "hatta sonra ayakkabılarımın üzerine kustu.\n\n"

 lmf_heir.1677.desc.invite.poorly.end:0 "Genel olarak, baştan sona kaos. Üzgünüm ama akşam bitmeden çok önce [your_heir.GetHerHim]'i terk ettim."

 lmf_heir.1677.desc.invite.well.end:0 "Genel olarak, ikimiz için de hatırlanası bir gece. Sanırım o hikâyelerde [your_heir.GetHerHim]'e biraz eğitim bile vermeyi başardım; övünmek gibi olmasın."

 lmf_heir.1677.desc.noinvite:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] çok uzak olmayan bir kasabaya gitti; anladığım kadarıyla [your_heir.GetSheHe] yerel bir meyhanede epey neşeli bir akşam geçirmiş.\n\n"

 lmf_heir.1677.desc.noinvite.poorly:0 "Görünüşe göre [your_heir.GetTitledFirstNameNoTooltip], [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'inin gözünün önünden çıktığı için biraz rahatlamaya can atıyordu; akşamdan yayılan hikâyeler gerçekten göz açıcı. Sarhoşluk, bir meyhane kavgası... [your_heir.GetSheHe] her nasılsa müşterileri o kadar kızdırmayı başarmış ki kasabadan kovulmuş.\n\nSanırım eğitim almanın bir yolu da bu, değil mi?"

 lmf_heir.1677.desc.noinvite.well:0 "Görünüşe göre [your_heir.GetTitledFirstNameNoTooltip] biraz rahatlamaya can atıyordu; önümüzdeki haftanın büyük bölümünde keyif çatıldı. Yine de [your_heir.Custom('polite_gender_ref')]'in aşağı yukarı [your_heir.GetHerselfHimself]'ine yakışır davrandığına inanıyorum. Sarhoş kavgaları yoktu, aşırı sarhoşluk yoktu ve [your_heir.GetSheHe] öfkeli yerlilerce kasabadan kovulmadı. Yalnızca saf neşe ve [your_heir.GetTitledFirstNamePossessiveNoTooltip] karizmasından büyülenen, [your_heir.GetHerHis] dönüşünü bekleyen kasaba halkı.\n\nBence pek öğretici değildi; ama [your_heir.GetSheHe]'in bu molaya sevindiğini tahmin ediyorum."

 lmf_heir.1677.desc.start:0 "[your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'inden özel olarak duydum ki [your_heir.GetTitledFirstNameNoTooltip] şu bahaneyi kullanmayı planlamış olabilir: "training" to get away from [heir_visit_origin.GetCounty.GetTitle.GetNameNoTierNoTooltip]... and that seems to be the case, as the [your_heir.Custom('polite_gender_ref')] has spent much of the last few months carousing from one tavern to the next throughout [ROOT.Char.GetCapitalLocation.GetCounty.GetCulture.GetNameNoTooltip], and I have a sneaking suspicion it would be no different had I let [your_heir.GetHerHim] come to the [ROOT.Char.Custom('FortifiedBuilding')].\n\n"

 lmf_heir.1677.desc.poorly:0 "[your_heir.Custom('polite_gender_ref')]'in daha iyi vakit geçirdiğini söyleyebilmeyi dilerdim; ama görünüşe göre [your_heir.GetHerHis] eğlencesi, sarhoş kavgalarından, [your_heir.GetSheHe] günlerce bir ahıra sürünene dek hastalanmaktan ve hesabı kabartıp yerlileri kızdırmaktan ibaretti. Pek de hoş hikâyeler değil; ama en azından [your_heir.GetSheHe] şimdilik hepsini içinden atmış görünüyor."

 lmf_heir.1677.desc.well:0 "Anlatılanlara göre [your_heir.Custom('polite_gender_ref')] harika vakit geçirdi. [your_heir.GetSheHe|U] aşağı yukarı [your_heir.GetHerselfHimself]'ine yakışır davrandı ve birkaç taşkınlık hikâyesi dışında kontluğun dört bir yanındaki halkı kazandı. [your_heir.GetHerHim]'in meyhane kalabalıklarına şarkı söylettiği anlatıları oldukça dikkat çekici. Görünüşe göre eğlence artık sona erdi; ama [your_heir.GetHerHim] için ne harika bir zamandı!"

 lmf_heir.1677.a:0 "Ne güzel bir zaman!"

 lmf_heir.1677.b:0 "Aferin, [your_heir.Custom('GetLassLad')]."

 lmf_heir.1677.c:0 "Of, ne gösteri ama!"

 lmf_heir.1677.d:0 "#EMP Bu mu#! [heir_liege.GetTitledFirstNamePossessiveNoTooltip] varisi?"

 excellent_party_with_heir:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], bir meyhanede geçen çılgın bir eğlence gecesinde yakınlaştılar."

 excellent_party_with_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [CHARACTER.GetShortUINameNoTooltipNoFormat], bir meyhanede geçen çılgın bir eğlence gecesinde yakınlaştılar."

 disastrous_party_with_heir:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], bir meyhanede felaketle sonuçlanan bir gece eğlencesinin ardından [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'ten tiksinmişti [CharWereWas(CHARACTER)]."

 disastrous_party_with_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], bir meyhanede felaketle sonuçlanan bir gece eğlencesinin ardından [CHARACTER.GetShortUINameNoTooltipNoFormat]'ten tiksinmişti [CharWereWas(TARGET_CHARACTER)]."

 lmf_heir.1678.t:0 "Hiçbir Şey Yapmadan"

 lmf_heir.1678.desc.all:0 "İnanması güç; ama [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geleli beri geçen aylarda [your_heir.GetSheHe]... şey, hiçbir şey yapmadı.\n\n"

 lmf_heir.1678.desc.two:0 "Neden olduğundan pek emin değilim; ama [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] [ROOT.Char.Custom('FortifiedBuilding')]'deki zamanının büyük bölümünü... şey, hiçbir şey yapmadan geçirdi.\n\n"

 lmf_heir.1678.desc.one:0 "Belki de [your_heir.GetSheHe]'in önceki gayretlerinden bir mola alması gerektiğine karar verdi; [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftayı [ROOT.Char.Custom('FortifiedBuilding')]'de... şey, hiçbir şey yapmadan geçirdi.\n\n"

 lmf_heir.1678.desc.castle:0 "[your_heir.GetTitledFirstNameNoTooltip] çoğunlukla [your_heir.GetHerHim]'e verdiğimiz yatak odasındaydı; ya okuyor, [your_heir.GetHerHis] günlüğüne yazıyor ya da ortalıkta dolanıyordu. [your_heir.GetSheHe|U] sarayda yalnızca birkaç kez göründü; o zamanlarda bile çoğunlukla [your_heir.GetHerselfHimself]'ine çekildi.\n\n"

 lmf_heir.1678.desc.town:0 "[your_heir.GetTitledFirstNameNoTooltip]'i [ROOT.Char.Custom('FortifiedBuilding')]'de ağırlamayı reddettiğimden, [your_heir.GetSheHe] çoğunlukla yerel kasabalarda dolandı... gerçekten bir şey #EMP yapmaya#! ya da öğrenmeye çalışmadan, daha çok manzarayı seyretmek için. Ya da en azından bana söylenen bu.\n\n"

 lmf_heir.1678.desc.end:0 "Bu tembellik mi, yoksa [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'deki tüm gözlerden uzak biraz zaman bulduğu için minnettar olan bir [your_heir.Custom('polite_gender_ref')] mi, gerçekten söyleyemem. En azından [your_heir.GetSheHe] bir bela çıkarmadı."

 lmf_heir.1678.a:0 "En azından [your_heir.GetSheHe] #EMP benim#! varisim değil."

 lmf_heir.1680.t:0 "[your_heir.GetHerHis|U] Yolda"

 lmf_heir.1680.desc.notrain:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] bugün son bir kez [ROOT.Char.Custom('FortifiedBuilding')]'e geldi,"

 lmf_heir.1680.desc.notrain.away:0 "elbette [your_heir.GetHerHim]'i uğurlamak için orada değildim.\n\n"

 lmf_heir.1680.desc.notrain.ill:0 "[your_heir.GetHerHim]'i uğurlamak için avluya inmeyecek kadar hastaydım.\n\n"

 lmf_heir.1680.desc.notrain.busy:0 "[your_heir.GetHerHim]'i uğurlamak için avluya inmek için fazlasıyla meşgul olsam da.\n\n"

 lmf_heir.1680.desc.notrain.nomeet.end:0 "Böylece [your_heir.Custom('polite_gender_ref')], [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'e ve [your_heir.GetHerHis] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'ine dönüş yolculuğuna başlamadan önce ortalıkta olan birkaç kişiye sert bir veda etti. [your_heir.GetSheHe], [your_heir.GetHerHim]'i [ROOT.Char.Custom('FortifiedBuilding')]'de ağırlamama kararımdan hiç hoşnutsuzluk duyduysa... şey, bunu asla bilemeyeceğiz, değil mi? [your_heir.GetTitledFirstNamePossessiveNoTooltip] ziyareti artık sona erdi."

 lmf_heir.1680.desc.notrain.meet:0 "bu yüzden en azından [your_heir.GetHerHim]'i uğurlamak için avluya indim.\n\n[your_heir.Custom('polite_gender_ref')] yeterince kibardı; [your_heir.GetSheHe], [your_heir.GetHerHim]'i [ROOT.Char.Custom('FortifiedBuilding')]'de ağırlamama kararımdan hiç hoşnutsuzluk duyduysa bile, bunu iyi gizledi.\n\nBirkaç kısa nezaket sözünün ardından [your_heir.GetSheHe], [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'e ve [your_heir.GetHerHis] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'ine dönüş yolculuğuna başladı. [your_heir.GetTitledFirstNamePossessiveNoTooltip] ziyareti artık sona erdi."

 lmf_heir.1680.desc.train:0 "[your_heir.GetTitledFirstNamePossessiveNoTooltip] [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki son akşamı olduğundan, onuruna küçük bir akşam yemeği verildi,"

 lmf_heir.1680.desc.train.away:0 "ne yazık ki orada olamasam da.\n\n"

 lmf_heir.1680.desc.train.ill:0 "ne yazık ki katılamayacak kadar hastaydım.\n\n"

 lmf_heir.1680.desc.train.busy:0 "başka meselelerle fazlasıyla meşgul olduğum için katılamasam da.\n\n"

 lmf_heir.1680.desc.train.meet.friend:0 "ve katılıp [your_heir.GetHerHim]'i yolcu etmekten fazlasıyla memnundum.\n\n"

 lmf_heir.1680.desc.train.meet.enemy:0 "ve bu vesileden tamamen kaçınmayı tercih ederdim; ama yine de [your_heir.GetHerHis] ev sahibiydim ve burası benim [ROOT.Char.Custom('FortifiedBuilding')]'imdi.\n\n"

 lmf_heir.1680.desc.train.meet.neutral:0 "ve ben hem [your_heir.GetHerHis] ev sahibi hem de [ROOT.Char.Custom('FortifiedBuilding')]'imin [ROOT.Char.GetLadyLord]'i olarak katıldım.\n\n"

 lmf_heir.1680.desc.train.success:0 "[your_heir.Custom('polite_gender_ref')], [your_heir.GetHerHis] ziyaretinin başarısından inanılmaz derecede memnundu ve bu yüzden akşam boyunca keyfi yerindeydi.\n\n"

 lmf_heir.1680.desc.train.failure:0 "[your_heir.Custom('polite_gender_ref')], [your_heir.GetHerHis] ziyaretinin feci başarısızlığı göz önüne alındığında, boyunca oldukça sessizdi ve kibarlık gereği çekilebileceği an çekildi.\n\n"

 lmf_heir.1680.desc.train.neutral:0 "[your_heir.Custom('polite_gender_ref')] kibardı; her ne kadar çoğunlukla [your_heir.GetHerselfHimself]'ine saklandıysa da... belki [your_heir.GetHerHis] ziyaretinin karışık başarısını düşünüyordu.\n\n"

 lmf_heir.1680.desc.train.end:0 "Ertesi sabah geldiğinde [your_heir.GetTitledFirstNameNoTooltip] [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'e ve [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'ine dönüş yolculuğuna çıkmıştı. [your_heir.GetSheHe]'in buradaki zamanı hakkında ne söyleyeceğini merak etmekten kendimi alamıyorum... ama her halükârda, [your_heir.GetHerHis] yolculuğu artık sona erdi."

 lmf_heir.1680.a:0 "Umarım [your_heir.GetSheHe] [your_heir.GetHerHis] ziyaretinden keyif almıştır. #EMP Ben#! aldım biliyorum."

 lmf_heir.1680.b:0 "Umarız [your_heir.GetHerHim]'i son görüşümüzdür."

 lmf_heir.1680.c:0 "Hem iyi bir [your_heir.Custom('polite_gender_ref')] hem de bir dost."

 lmf_heir.1680.d:0 "[your_heir.GetSheHe]'in [your_heir.GetHerHis] yolculuğundan bu kadar çok şey kazandığına sevindim."

 lmf_heir.1680.e:0 "Şey, o iş de bitti."

 lmf_heir.1680.f:0 "Şimdi kendi işlerime!"

 lmf_heir.1680.end.tt:0 "[your_heir.GetTitledFirstNameNoTooltip], [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'e dönüş yolculuğuna başlayacak"

 lmf_heir.1681.desc.start:0 "Az önce [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))]'den haber aldım; [your_heir.GetHerHis] [heir_visit_target.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] yolculuğu sona ermiş.\n\nGörünüşe göre,"

 lmf_heir.1681.desc.notrain:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_visit_target'))], [your_heir.GetHerHim]'i [heir_visit_target.Custom('FortifiedBuilding')]'de ağırlamayı reddetti; bunun yerine [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))] orada geçirdiği sürenin çoğunu "

 lmf_heir.1681.desc.notrain.hunt.good:0 "çevredeki vahşi doğada harika vakit geçirerek avlanıyor.\n\n"

 lmf_heir.1681.desc.notrain.hunt.poor:0 "çevredeki vahşi doğada avlanarak geçirdi; hava berbattı ve ortada neredeyse hiçbir şey yoktu.\n\n"

 lmf_heir.1681.desc.notrain.tour.good:0 "çevredeki toprakları gezerek, insanları ve geleneklerini tanıyarak... görünüşe göre hepsi oldukça iyi geçti.\n\n"

 lmf_heir.1681.desc.notrain.tour.poor:0 "çevredeki toprakları gezerek, kötü havaya ve [your_heir.GetHerHis] varlığını hiç umursamayan halka katlanarak.\n\n"

 lmf_heir.1681.desc.notrain.party.good:0 "yakındaki birkaç köyün meyhanelerinde eğlenerek... duyduğuma göre çok heyecanlıymış, pek verimli olmasa da.\n\n"

 lmf_heir.1681.desc.notrain.party.poor:0 "yakındaki birkaç köyün meyhanelerinde eğlenerek... ya da en azından eğlenmeye çalışarak. Satır aralarını okuduğumda, [your_heir.GetSheHe] çoğunlukla perişandı.\n\n"

 lmf_heir.1681.desc.notrain.sick:0 "yakındaki bir köy hanında dinlenmekten başka pek bir şey yapamayacak kadar hasta.\n\n"

 lmf_heir.1681.desc.notrain.nothing:0 "...şey, neredeyse hiçbir şey yapmıyor. Yakındaki bazı köyleri geziyor, hanlarda konaklıyor; ama sonuçta verimli diyebileceğim hiçbir şeye imza atmıyor.\n\n"

 lmf_heir.1681.desc.notrain.end:0 "Teknik olarak, bu [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_visit_target'))]'in verdiği sözü yerine getiriyor. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))], [ROOT.Char.Custom('FortifiedBuilding')] olmasa da [heir_visit_target.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e erişim sağladı; ama buna düzgün bir misafirperverlik demek zor."

 lmf_heir.1681.desc.train:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))]'i [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_visit_target'))] bizzat karşıladı ve her türlü misafirperverliği gösterdi. [your_heir.GetSheHe|U]'e [heir_visit_target.Custom('FortifiedBuilding')]'de bir oda verildi ve "

 lmf_heir.1681.desc.train.castle:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_visit_target'))] [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))]'i bizzat eğitmese de, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))]'e her türlü misafirperverlik gösterildi ve [heir_visit_target.Custom('FortifiedBuilding')]'de bir oda verildi; [your_heir.GetHerHis] süresinin "

 lmf_heir.1681.desc.train.all:0 "[your_heir.GetHerHis] yolculuğunun neredeyse tamamını "

 lmf_heir.1681.desc.train.most:0 "[your_heir.GetHerHis] yolculuğunun büyük bölümünü "

 lmf_heir.1681.desc.train.some:0 "[your_heir.GetHerHis] süresinin çoğunu "

 lmf_heir.1681.desc.train.rest:0 "ve geri kalanını "

 lmf_heir.1681.desc.train.second:0 ","

 lmf_heir.1681.desc.train.third:0 ", ve "

 lmf_heir.1681.desc.host:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_visit_target'))] [heir_visit_target.GetHerselfHimself] tarafından bizzat eğitiliyor"

 lmf_heir.1681.desc.castle:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_visit_target'))]'in sarayında"

 lmf_heir.1681.desc.sick:0 "dinlenmekten başka bir şey yapamayacak kadar hasta olmak"

 lmf_heir.1681.desc.hunt:0 "çevredeki vahşi doğada bir av gezisinde"

 lmf_heir.1681.desc.tour:0 "toprakları gezerek insanları ve geleneklerini tanıyor"

 lmf_heir.1681.desc.party:0 "yakındaki meyhanelerde kafa çekerek harika vakit geçiriyor"

 lmf_heir.1681.desc.nothing:0 "neredeyse hiçbir şey yapmıyor"

 lmf_heir.1681.desc.train.good:0 ".\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))]'in mektupta yazdıklarına bakılırsa, genel olarak mükemmel ve son derece verimli bir deneyimdi."

 lmf_heir.1681.desc.train.poor:0 ".\n\nBununla birlikte, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))]'in mektupta yazdıklarına bakılırsa, genel olarak sefil ve pek de verimli olmayan bir deneyimdi."

 lmf_heir.1681.desc.train.neutral:0 ".\n\nSatır aralarını okuduğumda, yolculukta her şeyin iyi gitmediğinden şüpheleniyorum; yine de [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_heir'))] genel olarak en azından çoğunlukla memnun görünüyor."

 lmf_heir.1681.a:0 "[your_heir.GetHerHis] yakında dönüşünü dört gözle bekliyorum."

