 agot_court_outcome.2000.both.my.courtier:0 "Son aylarda burada, sarayda [proposer_target.GetTitledFirstName] adlı bir [proposer_target.Custom('polite_gender_ref')] ile iffetli ve usulüne uygun bir kur yapma ilişkisi içindeyim ve [proposer_target.GetHerHim]'i gerçek bir ruh eşi olarak görmeye başladım.\n\n"

 agot_court_outcome.2000.my.courtier:0 "Son aylarda sarayının bir parçası olan [proposer_target.GetTitledFirstName] adlı bir [proposer_target.Custom('polite_gender_ref')] ile iffetli ve usulüne uygun bir kur yapma ilişkisi içindeyim ve [proposer_target.GetHerHim]'i gerçek bir ruh eşi olarak görmeye başladım.\n\n"

