 lmf_heir.1661.t:0 "Yakın Temasta"

 lmf_heir.1661.desc.start:0 "Son birkaç haftayı [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'in eşliğinde geçirdim; [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'inin istediği gibi [your_heir.GetHerHim]'i düzgün bir hükümdar olması için eğitiyorum; son zamanlarda [your_heir.Custom('GetLassLad')]'in davranışlarının... farklılaştığını fark ettim.\n\n"

 lmf_heir.1661.desc.child:0 "[your_heir.GetTitledFirstNameNoTooltip] bana kur yapıyor; söylediğim hemen her şeye gülümsüyor, gülüyor ve ne zaman karşılaşsak [your_heir.GetHerHis] yanaklarının kızardığını fark ediyorum. Doğal olarak [your_heir.Custom('GetLassLad')] daha bir çocuk; ama gözü olan herkes [your_heir.GetSheHe]'in gönlünü kaptırdığını anlar.\n\n"

 lmf_heir.1661.desc.adult:0 "[your_heir.GetTitledFirstNameNoTooltip] sık sık gülümsüyor, elimi ya da omzumu tutmak için her bahaneyi kullanıyor; göz göze geldiğimizde de yoğun bir ilgi hissi kalıyor. Bunu daha ileri götürmek [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMePossessive', heir_liege )] güvenini kuşkusuz zedeler; ama [your_heir.Custom('GetLassLad')]'in tam da bunu yapmak istediği de çok açık.\n\n"

 lmf_heir.1661.desc.end:0 "O halde seçim bende: bunu çok ileri gitmeden, şimdi ve burada bitiriyor muyum?"

 lmf_heir.1661.a:0 "[your_heir.Custom('GetLassLad')] bunu istiyorsa, neden bitsin?"

 lmf_heir.1661.b:0 "Eğlenceli bir oyalanma; ama [your_heir.GetHerHis] ziyareti biter bitmez işimiz biter."

 lmf_heir.1661.c:0 "Gururlandım. Belki [your_heir.GetSheHe] büyüyünce...?"

 lmf_heir.1661.d:0 "Evet, daha ileri gitmeden bunu kapatalım."

