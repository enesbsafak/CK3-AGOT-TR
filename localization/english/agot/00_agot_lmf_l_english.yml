 lmf_interaction.1328.desc.secrec.poor:0 "Öğleden sonrayı [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l] önünde yoksullara sadaka dağıtarak geçirdiler. [secondary_actor.GetFirstNameNoTooltip] açıkça âşık olmuştu; [secondary_recipient.GetFirstNameNoTooltip]'i cömertliğiyle etkilemeye çok çalışıyordu."

 lmf_interaction.1328.desc.secrec.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetHerHim]'e her şeyin tarihini büyük bir ilgi ve ayrıntıyla anlatıyordu. Belki de fazlasıyla; [secondary_actor.GetHerHis] hevesi öyleydi."

