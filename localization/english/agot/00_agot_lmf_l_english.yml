 agot_court_outcome.2004.t:0 "İzin Reddedildi!"

 agot_court_outcome.2004.desc:0 "[permission_refuser.GetTitledFirstNameNoTooltip] evlilik için izin vermeyi reddetti; üstelik [permission_refuser.GetWomanMan] bir gerekçe bile sunmadı! Planlarımız suya düştü. [proposer_target.GetTitledFirstNameNoTooltip] ve ben şimdi ne yapacağız?"

 agot_court_outcome.2004.a:0 "Geriye tek bir seçenek kaldı: kaçıyoruz!"

 agot_court_outcome.2004.b:0 "Evli olsak da olmasak da, aşkımız asla ölmeyecek!"

 agot_court_outcome.2004.c:0 "Birlikte olamayacaksak, anlamı ne?"

 agot_court_outcome.2004.b.tt:0 "İkiniz, evlilik dışında da Ruh Eşleri olarak kalacaksınız"

 agot_court_outcome.2004.c.tt:0 "Son bir öpücük, sonra ayrılırsın..."

 agot_court_outcome.2005.elope:0 "[proposer.GetTitledFirstNameNoTooltip], [permission_refuser.GetTitledFirstNameNoTooltip] ile görüşmesinden dönüp yanıma geldi... ve haber iyi değildi. [permission_refuser.GetTitledFirstNameNoTooltip] bize evlenme izni vermedi! Yılmadan, [proposer.GetFirstNameNoTooltip] elimi tuttu ve bunun yolumuza engel olmasına izin vermeyeceğine yemin etti. "I will come for you," [proposer.GetSheHe] swore. "If it takes a hundred years, I will come for you and we will be wed no matter what anyone says!""

 agot_court_outcome.2005.continue:0 "[proposer.GetTitledFirstNameNoTooltip] bana geldi, [permission_refuser.GetTitledFirstNameNoTooltip] ile görüşmeden yeni dönmüştü... ve haberler iyi değildi. [permission_refuser.GetTitledFirstNameNoTooltip] evlenmemize izin vermedi! "It does not matter," [proposer.GetFirstNameNoTooltip] avowed. [proposer.GetSheHe|U] took me in [proposer.GetHerHis] arms and kissed me sweetly on the lips. "Married or not, our love will flourish no matter what anyone tells us!""

 agot_court_outcome.2005.breakup:0 "[proposer.GetTitledFirstNameNoTooltip] bana geldi, [permission_refuser.GetTitledFirstNameNoTooltip] ile görüşmeden yeni dönmüştü... ve haberler iyi değildi. [permission_refuser.GetTitledFirstNameNoTooltip] evlenmemize izin vermedi! "What is the point of being together," [proposer.GetFirstNameNoTooltip] sighed, "if we must do so in secret? No, I cannot bear it." With that, [proposer.GetSheHe] kissed me one last time, ever so sweetly, and then left for good."

 agot_court_outcome.2005.a:0 ""I will wait for you, my love!""

 agot_court_outcome.2005.b:0 ""I need you here and now, my love!""

 agot_court_outcome.2005.c:0 "Ne yazık ki o son öpücükle yetinmek zorunda kalacağım..."

 agot_court_outcome.2010.opening:0 "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"

 agot_court_outcome.2010.imprison:0 "Bu zindana kapatılmış haldeyken, itiraf edeyim ki bir araya gelebilme şansımız uzak görünüyor. Yüzünü görmeyeli çok uzun zaman oldu.\n\n"

 agot_court_outcome.2010.normal:0 "Bir gün karı koca olarak birlikte olacağımıza dair sözün verildiği anı düşünüyorum; çok uzun zaman önceymiş gibi geliyor. Hatta fazlasıyla uzun.\n\n"

 agot_court_outcome.2010.hate:0 "Bir şekilde beni aldattığını hissetmekten kendimi alamıyorum. Hatta belki sahip olabileceğim hayatı çaldın benden. "

 agot_court_outcome.2010.nothate:0 "Doğrusu seni suçlayamam. Kader aleyhimize çalıştı ve reddedilmeyecek. "

 agot_court_outcome.2010.end:0 "Her neyse, sanırım işleri oldukları gibi kabul etme zamanı. Sözünden seni azat ediyorum, eğer böyle bir sözü kabul ediyorsan; ve yollarımızı ayıracağız."

 agot_court_outcome.2010.a:0 "Ne yazık ki kısmet değilmiş."

 agot_elope.1004.t:0 "Gece Sıvıştı"

 agot_elope.1004.start:0 "Sabah uyandığımda şaşırtıcı bir haberle karşılanıyorum: gece boyunca,"

 agot_elope.1004.both:0 "görünüşe göre [owner.GetTitledFirstName] ve [target.GetTitledFirstName] birlikte [ROOT.Char.Custom('FortifiedBuilding')]'den kaçıp evlendiler. "

 agot_elope.1004.target:0 "görünüşe göre [owner.GetFullName], [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki kaleye süzülüp [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstNameNoTooltip] ile kaçtı. "

 agot_elope.1004.mid:0 "Bütün bu iş uzun süredir planlanmış olmalı; zira muhafızları atlatıp hiçbir dikkati çekmeden kaçmayı başardılar. Doğrusu oldukça etkileyici.\n\n"

 agot_elope.1004.refused:0 "Daha önce evlenmelerine izin vermemiştim ama görünüşe göre işleri kendi ellerine aldılar ve ikisine de onursuzluk getirdiler."

 agot_elope.1004.owner.refused:0 "Görünüşe göre [owner.GetLiege.GetTitledFirstNameNoTooltip], [owner.GetTitledFirstNamePossessiveNoTooltip] evlenme talebini reddetmiş; o yüzden [owner.GetSheHe] işi [owner.GetHerHis] eline almış. [owner.GetHerHis] içinde bulunduğu duruma duyduğum sempatiye rağmen, kanun kanundur. Yaptıkları ikisine de onursuzluk getirdi."

 agot_elope.1004.target.refused:0 "Görünüşe göre [target.GetLiege.GetTitledFirstNameNoTooltip], [target.GetTitledFirstNamePossessiveNoTooltip] evlenme talebini reddetmiş; o yüzden [owner.GetTitledFirstNameNoTooltip] işi [owner.GetHerHis] eline almış. İçinde bulundukları duruma duyduğum sempatiye rağmen, kanun kanundur. Yaptıkları ikisine de onursuzluk getirdi."

 agot_elope.1004.granted:0 "Daha önce evlenmelerine izin vermiştim; ama bu, bunun olmasına yetmemiş görünüyor... ve şimdi işleri kendi ellerine aldılar. İçinde bulundukları duruma duyduğum sempatiye rağmen, kanun kanundur. Yaptıkları ikisine de onursuzluk getirdi."

 agot_elope.1004.married:0 "Sanırım [owner.GetTitledFirstNameNoTooltip], [target.GetTitledFirstNameNoTooltip] zaten evli olduğu için [target.GetHerHis] elini usulünce isteyemedi! Her halükârda, artık kanunu çiğnediler ve ikisine de onursuzluk getirdiler."

 agot_elope.1004.end:0 "[owner.GetTitledFirstNameNoTooltip] neden [target.GetHerHis] elini usulünce istemeyi düşünmedi, hayal edemiyorum. Her halükârda, benim iznim olmadan evlenerek kanunu çiğnediler ve ikisine de onursuzluk getirdiler."

 agot_elope.1004.a:0 "Umarım buna değmiştir."

 agot_elope.1004.b:0 "Dönebileceklerini bildir. Bu taşkınlığı geride bırakacağız."

 agot_elope.1005.t:0 "Yeni Bir Geliş"

 agot_elope.1005.start:0 "Sabah uyandığımda oldukça şaşırtıcı bir haberle karşılanıyorum: gece boyunca [owner.GetTitledFirstNameNoTooltip], [target_liege.GetTitledFirstNamePossessive] [target_liege.Custom('FortifiedBuilding')]'ine süzülüp [target.GetTitledFirstNameNoTooltip] ile kaçmış. İkisi şu anda dışarıda bir yerlerde evleniyor.\n\n"

 agot_elope.1005.refused:0 "Daha önce evlenmelerine izin vermemiştim ama görünüşe göre işleri kendi ellerine aldılar ve ikisine de onursuzluk getirdiler."

 agot_elope.1005.granted:0 "Daha önce evlenmelerine izin vermiştim; ama bu, bunun olmasına yetmemiş görünüyor... ve şimdi işleri kendi ellerine aldılar. İkisine de onursuzluk getiren bir kaçış."

 agot_elope.1005.neither:0 "[owner.GetTitledFirstNameNoTooltip]'i böyle aceleci bir harekete iten şey neydi, hayal bile edemiyorum. Her halükârda, hükümdarlarının izni olmadan evlenmek ikisine de onursuzluk getirir."

 agot_elope.1005.end:0 "Geriye tek soru kalıyor: [owner.GetTitledFirstNameNoTooltip] ve [owner.GetHerHis] yeni [target.Custom('WifeHusband')] sarayımda hoş karşılanacak mı?"

 agot_elope.1005.a:0 "Umarım buna değmiştir."

 agot_elope.1005.b:0 "Artık burada hoş karşılanmıyorlar."

 agot_elope.1005.c:0 "Hoş karşılandıklarını bildir. Bu taşkınlığı geride bırakacağız."

 pregnancy.3003.c:0 "Derhal evlenmeliyiz!"

 seduce_outcome.4900.failure.tt:0 "[owner.GetTitledFirstNamePossessive] [target.GetTitledFirstName]'i baştan çıkarma entrikası başarısız oldu ve ortaya çıktı!"

 agot_seduce_outcome.4901.opening:0 "Akşamın geç saatlerinde, [ROOT.Char.Custom('FortifiedBuilding')]'in içinden gelen bağrışmalarla herkes birden yerinden sıçrıyor.\n\nNe olduğunu görmeye gittiğimde, [target.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)] yatak odasının girişinde bir hizmetkâr ve muhafız kalabalığıyla karşılaşıyorum... görünüşe göre [target.GetSheHe] az önce oraya gelmiş ve kendisini üzerinde bir çul bile olmayan [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] karşılamış!\n\n[owner.GetTitledFirstNameNoTooltip] ne tür bir karşılama umduysa, umduğunu bulamadı. "

 agot_seduce_outcome.4901.reject:0 "[target.GetTitledFirstNameNoTooltip]'in [owner.GetHerHim]'e öfkeyle bağırdığını, defolup bir daha dönmemesini söylediğini gördüm.\n\n[owner.GetSheHe] geri kalanımızın yaklaştığını görünce, [owner.GetHerHis] giysilerini toplamaya bile vakit ayırmadan kaçtı!"

 agot_seduce_outcome.4901.normal:0 "[target.GetTitledFirstNameNoTooltip] açıkça dehşete kapılmıştı ve [target.GetSheHe] beni gördüğü anda bunların hiçbiriyle bir ilgisi olmadığını yeminle söyledi.\n\n[owner.GetTitledFirstNameNoTooltip] ise bu sırada [owner.GetHerHis] giysilerini toplayıp mahcup bir şekilde kaçtı; bütün olayın besbelli bir yanlış anlama olduğunu iddia ederek..."

 agot_seduce_outcome.4901.a:0 "Şok edici; ama bir o kadar da eğlenceli..."

 agot_seduce_outcome.4902.opening:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] bahçelerinde gezinirken, ilk bakışta bir tartışma gibi gelen sesler duyuyorum.\n\nNeyin ters gittiğini görmek için koştuğumda karşımda [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]'e [target.Custom2('MyCharacterIntroduction', ROOT.Char)] tarafından bağırıldığı manzarası var. "

 agot_seduce_outcome.4902.reject:0 "[target.GetSheHe|U] açıkça küplere binmiş; [target.GetSheHe] öfkeyle uzaklaşırken varlığımı ancak geç fark ediyor. "That [owner.GetWomanMan]," [target.GetSheHe] snapped, "needs to leave me alone. I won't bear another minute of [owner.GetHerHis] attentions!"\n\n[owner.GetTitledFirstNameNoTooltip], at least, had the grace to look sheepish as [owner.GetSheHe] fled with what little dignity [owner.GetSheHe] had left."

 agot_seduce_outcome.4902.normal:0 "Ne var ki [target.GetSheHe|U] öfkeli olmaktan çok şaşkın ve üzgün; [target.GetSheHe] beni görünce koşarak yanıma geliyor. "Thank [target.GetFaith.PantheonTerm2] you arrived! I couldn't bear another minute of [owner.GetHerHis] constant pawing!"\n\n[owner.GetTitledFirstNameNoTooltip] blushed furiously and attempted to claim the entire thing was just a misunderstanding... but I think it's pretty clear what was happening there."

 agot_seduce_outcome.4902.a:0 "[owner.GetSheHe]'in hiç utanması yok mu?! Rezalet!"

 agot_seduce_outcome.4903.opening:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki odama dönerken [target.Custom2('MyCharacterIntroduction', ROOT.Char)] ile [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]'ü bir kuytuda, birbirlerine oldukça yakın dururken görüyorum. Neredeyse... fazla mı yakın? Olabilir mi yani...?\n\n[target.GetTitledFirstNameNoTooltip] beni fark eder etmez,"

 agot_seduce_outcome.4903.reject:0 "[target.GetSheHe] bilinçli bir adım geri atıyor. "This is not my doing, my [ROOT.Char.GetLadyLord]! This [owner.GetWomanMan] has been hounding me for weeks, now! I cannot get [owner.GetHerHim] to desist!"\n\nIt's clear [target.GetHerHis] anger is sincere, and this is only underlined by [owner.GetTitledFirstNamePossessiveNoTooltip] embarrassed spluttering. [owner.GetSheHe|U] does [owner.GetHerHis] best to claim the entire thing was a misunderstanding, but by then [target.GetTitledFirstNameNoTooltip] was already gone."

 agot_seduce_outcome.4903.normal:0 "[target.GetSheHe] rahatlıyor. "Thank [target.GetFaith.PantheonTerm2] you arrived," [target.GetSheHe] muttered, "I don't think I could have taken another minute of this."\n\n[owner.GetTitledFirstNameNoTooltip] tried to pass the whole thing off as simply a misunderstanding, but I don't believe it was. Either way, it seems unlikely any plans [owner.GetSheHe] had for [target.GetTitledFirstNameNoTooltip] will come to fruition now."

 agot_seduce_outcome.4903.a:0 "Zamanında geldiğim iyi oldu!"

 agot_seduce_outcome.4904.opening:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de bir gece ziyafeti daha; ama bu ziyafet, başta [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]'ün maskaralıkları yüzünden epey olaylı geçiyor.\n\n[owner.Custom('polite_gender_ref')] açıkça iyiden iyiye kafayı bulmuş durumda ve [target.Custom2('MyCharacterIntroduction', ROOT.Char)]'e cilveli iltifatlar yağdırıyor. "

 agot_seduce_outcome.4904.reject:0 "Sonunda [target.GetSheHe] ayağa kalkıp haykırdı,"I have had enough of your lecherous attentions! Desist, I tell you! Desist!"\n\nWith that, [target.GetSheHe] furiously strode from the hall, leaving [owner.GetTitledFirstNameNoTooltip] to stand there in shock... with everyone else staring at [owner.GetHerHim].\n\nWhatever [owner.GetHerHis] intentions with [target.GetTitledFirstNameNoTooltip] might have been, it seems they are well and truly ended."

 agot_seduce_outcome.4904.normal:0 "[target.GetSheHe|U] açıkça ilgisizdi ve [owner.GetHerHis] varlığına zar zor katlanıyordu.\n\n"What in [ROOT.Char.GetFaith.HighGodName]'s name is going on?" I asked as I walked over, and [target.GetTitledFirstNameNoTooltip] used the distraction as an opportunity to flee... leaving [owner.GetTitledFirstNameNoTooltip] standing there, spluttering in indignation while everyone stared at [owner.GetHerHim]."

 agot_seduce_outcome.4904.a:0 "Utanç verici bir gösteri."

 agot_seduce_outcome.4905.desc:0 "[target.GetTitledFirstNameNoTooltip] bu gece öfkeden köpürerek yanıma geldi.\n\n"I've had it with that [owner.Custom('InsultNounSexual')]! I told [owner.GetHerHim] no a thousand times, but does [owner.GetSheHe] listen? This has to stop!"\n\nThe [owner.Custom('polite_gender_ref')] [target.GetSheHe] is so furious with is, it appears, none other than [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]... who has now been barred from ever speaking with [target.GetTitledFirstNameNoTooltip] again, of course, much to [target.GetHerHis] relief. Even so, the sheer gall! Trying to seduce my [target.Custom('WifeHusband')], under my very nose and in my very own [ROOT.Char.Custom('FortifiedBuilding')]!"

 agot_seduce_outcome.4905.a:0 "[owner.GetSheHe] ne cüret!"

 agot_seduce_outcome.4906.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki odama dönerken [target.Custom('WifeHusband')]'imi ve [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]'ü karanlık bir kuytuda, birbirlerine oldukça yakın dururken görüyorum. Neredeyse... fazla mı yakın? Olabilir mi yani...?\n\n[target.GetFirstNameNoTooltip] beni fark eder etmez, açıkça rahatlamış bir halde geri çekiliyor. "Thank [target.GetFaith.PantheonTerm2] you arrived," [target.GetSheHe] mutters, "I don't think I could have taken another minute of this!"\n\n[owner.GetTitledFirstNameNoTooltip] splutters with indignation and fear, trying to pass the entire thing off a simple misunderstanding, but it was clearly no such thing. Lucky for [owner.GetHerHim], [owner.GetSheHe] ran off before I could call the guards!"

 agot_seduce_outcome.4906.a:0 "Şu [owner.Custom('InsultNounSexual')]! [owner.GetSheHe] ne cüret!"

 tried_to_seduce_spouse:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetShortUINamePossessive] eşini baştan çıkarmaya çalıştı."

 tried_to_seduce_spouse_corresponding:0 "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUINamePossessive] eşini baştan çıkarmaya çalıştı."

 agot_seduce_outcome.4907.opening:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de sarayda bir gün daha; üstelik sıkıcı bir gün. Derken birden işler ilginç bir hal alıyor.\n\n"

 agot_seduce_outcome.4907.reject:0 ""Enough is enough!" I hear a [target.GetWomanMan] shout from amidst the crowd of on-lookers. All attention turns in that direction, and when the crowd parts I see it is [target.Custom2('MyCharacterIntroduction', ROOT.Char)] who is shouting at [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. [target.GetSheHe|U] is clearly furious, and stops only when [target.GetSheHe] suddenly realizes all eyes are now on them.\n\n"Apologies, my [ROOT.Char.GetLadyLord]! It's just that this... this [owner.Custom('InsultNounSexual')] won't leave me be! For the sake of my reputation, I want his to end!" With that, [target.GetFirstNameNoTooltip] turned and stormed from the chamber, and [owner.GetFirstNameNoTooltip] was left to stand awkwardly and endure the withering, judgemental stares of the gathered court.\n\nWhatever [owner.GetSheHe] had hoped to gain from [owner.GetHerHis] efforts, [owner.GetHerHis] plan has clearly failed."

 agot_seduce_outcome.4907.normal:0 ""Please stop this! I'm begging you!" I hear a [target.GetWomanMan] shout from amidst the crowd of on-lookers. All attention turns in that direction, and when the crowd parts I see it is [target.Custom2('MyCharacterIntroduction', ROOT.Char)] addressing [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. [target.GetSheHe|U] appears mortified, even more so when [target.GetSheHe] realizes all eyes in the court were now on them.\n\n"Apologies, my [ROOT.Char.GetLadyLord]! I simply... I cannot endure this any longer." [target.GetFirstNameNoTooltip] gives one last glare at [owner.GetFirstNameNoTooltip] before fleeing from the chamber.\n\nSince [target.GetSheHe] never explained, I'm left to conjecture over what, exactly, [owner.GetFirstNameNoTooltip] did to prompt the behavior... yet I suspect we all know. Despite [owner.GetHerHis] quiet smirk in response to the stares, we can safely say [owner.GetHerHis] efforts have come to naught."

 agot_seduce_outcome.4907.a:0 "Skandal!"

 agot_seduce_outcome.4908.desc:0 "Gece yatak odama giderken koridordan geçiyorum ki birden bir [target.GetWomanMan] yanıma koşup benimle yürümeye başlıyor. Bu, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]; rahatsız ve gergin... ama kesinlikle sebep ben değilim.\n\n"Just keep walking," [target.GetSheHe] pleads. "It's a good thing you showed up when you did, as I've been trying to avoid [owner.GetHerHis] advances all day." Unsure who [target.GetSheHe] could be referring to, I looked back, and spotted [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] lurking in the shadows attempting to appear there completely by accident and uninterested in [target.GetFirstNamePossessiveNoTooltip] whereabouts.\n\n"Don't believe a word [owner.GetSheHe] says," [target.GetFirstNameNoTooltip] whispered. "[owner.GetHerHis|U] behavior is most inappropriate, but this is all I can do to protect my dignity, if not my good name." As soon as we were out of sight, [target.GetFirstNameNoTooltip] thanked me profusely and ran off."

 agot_seduce_outcome.4908.a:0 "Acaba araya girmeli miyim?"

 agot_seduce_outcome.4909.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki çalışma odasındayım, birkaç saraylıyı ağırlıyorum ki [target.Custom2('MyCharacterIntroduction', ROOT.Char)] birden kapıyı açıp daldı. [target.GetWomanMan] oldukça tedirgin bir halde, kocaman bir mektup destesi taşıyordu. Bir an [target.GetSheHe]'in beni aradığını sandım; ama bunun yerine [target.GetSheHe] odanın diğer tarafında oturan [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'ün önüne dikildi.\n\n"Take these back," [target.GetSheHe] said. "Take all of them! I beg you, my [owner.GetLadyLord], stop writing me. This fascination of yours needs to end!" With that, [target.GetFirstNameNoTooltip] threw the letters at [owner.GetFirstNamePossessiveNoTooltip] feet and then stormed out of the study, leaving [owner.GetFirstNameNoTooltip] to stare in shock.\n\nThe content of the letters can only be guessed at, but by the shame-faced way [owner.GetSheHe] collected them and the judgemental stares of the others in the room, it was clear to me that everyone knew what [owner.GetFirstNameNoTooltip] had been up to. It was equally clear, as well, that it was now over."

 agot_seduce_outcome.4909.a:0 "Aman Tanrım!"

 lmf_army.1010.t:0 "Kamp İzleyicisi"

 lmf_army.1010.female.start:0 "Ordu yürürken ona her zaman en az birkaç köylü kadın eşlik eder. Çoğunlukla aşçılar ve çamaşırcılar; ama bazılarına ayrıca şöyle de denir: "camp followers" — those who hope to catch the eye of a [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], either to attract a husband or just to earn a few coins by providing him a night of comfort.\n\nNormally, I don't pay much attention to these women, but just lately one #EMP has#! caught my eye. She's [follower.GetCulture.GetNameNoTooltip], she smiles at me whenever I pass, and would be amenable to a late night visit... that much is clear.\n\n"

 lmf_army.1010.male.start:0 "Ordu yürürken ona her zaman en az birkaç köylü eşlik eder. Çoğu kadındır; aşçılar ve çamaşırcılar ile meşhur "camp followers" who hope to attract the eye of a handsome [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] and who are tolerated for the comfort they're willing to provide.\n\nNormally, I don't pay much attention to them, but lately I've noticed a handsome young [follower.GetCulture.GetNameNoTooltip] lad among their number — the son of a laundress, I'm told, who helps fix the wagons. The way he smiles at me whenever I pass, it's clear he would be more than amenable to a late night visit.\n\n"

 lmf_army.1010.end:0 "Soru şu: #EMP ben#! razı mıyım?"

 lmf_army.1010.a:0 "Neden olmasın? [follower.GetHerHim]'i ziyaret edeceğim."

 lmf_army.1010.b:0 "Hayır, bu tür dolanıklıklardan kaçınmak en iyisi."

 lmf_army.1020.t:0 "Meyhane Garsonu"

 lmf_army.1020.desc:0 "Kamp yemeklerinden bıkan birkaç [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ile ben, [army.GetLocation.GetTitle.GetNameNoTierNoTooltip] yakınındaki bir köydeki küçük yerel bir meyhaneye içki ve eğlence için uğradık.\n\nAkşam yeterince keyifliydi ve meyhane garsonlarından birinin gözünün kesinlikle üzerimde olduğunu fark ettim. Masamıza katıldı, şansımıza kadeh kaldırdı, şakalarımıza güldü; ama tüm akşam gülümsemeleri yalnızca bana ve yalnızca bana ayrılmıştı.\n\nBirkaç içkiyle rahatlamak başka şey. Tutkulu bir geceye de ilgi duyuyor muydum? Öyleyse, tek yapmam gerekenin sormak olduğu açıktı."

 lmf_army.1020.a:0 "Zahmet etme, hallederim."

 lmf_army.1020.b:0 "Hayır, onunla ilgilenmiyorum."

 lmf_army.1030.t:0 "Meyhanede Gürültülü Gece"

 lmf_army.1030.desc:0 "Birkaç [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ve ben, [army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'deki ordu kampından, adamların birinin meyhane olduğunu bildiği yakındaki bir köye kısa bir yolculuk yaptık.\n\nFena bir yerdi sayılmazdı; kısa süre içinde hepimiz iyice kafayı bulmuş, avazımız çıktığı kadar şarkı söylüyor ve askerlerin adet edindiği gibi eğleniyorduk.\n\nZamanla, yerlilerin sabrı tükenince işler biraz kontrolden çıkmış olabilir. Birkaç ateşli laf atıldı, birkaç yumruk sallandı ve ben farkına varmadan kendimi öfkeden kudurmuş kaba bir yerliyle burun buruna buldum."

 lmf_army.1030.a:0 "Rahatlamanın zamanı geldi!"

 lmf_army.1030.a.injury.tt:0 "[champion.GetShortUINameNoTooltipNoFormat|U] kavgada yaralandı"

 lmf_army.1030.a.injury.desc:0 "[player.Custom('KnightCultureNoTooltipLowercase')] [champion.GetShortUIName], [province.GetTitle.GetNameNoTierNoTooltip] yakınındaki bir köy meyhanesinde kavga çıkardıktan sonra yaralandı."

 lmf_army.1030.b:0 "Belki işler kötüleşmeden herkesi sakinleştirebilirim..."

 lmf_army.1030.c:0 "İşler #EMP fazla#! kızışmadan çekip gitmek en iyisi."

 lmf_army.1040.t:0 "Neşe Dolu Bir Gece"

 lmf_army.1040.siege.start:0 "Kuşatma sürüyor ve sonu görünmüyor gibi. Kampta gerginlikler tırmanıyor; itiraf edeyim ki stresi ben de hissediyorum.\n\nBu yüzden, güneş battığında kendimi, çevremde [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'lar alkışlayıp bana tezahürat ederken bir içki âleminin ortasında bulmam hiç de sürpriz değil. Levazım çadırını basıp sert içkileri çıkardık; bunun sabahı ağır olabilecek bir gece olduğunu şimdiden görebiliyorum.\n\n"

 lmf_army.1040.march.start:0 "Yürüyüş sonsuza dek sürecekmiş gibi geliyor. Kampta gerginlikler tırmanıyor; itiraf edeyim ki stresi ben de hissediyorum.\n\nBu yüzden, güneş battığında kendimi, kamptaki [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larla birlikte yakındaki küçük bir [army.GetLocation.GetCounty.GetCulture.GetNameNoTooltip] köyündeki bir meyhaneyi basarken bulmam hiç de sürpriz değil. Yerliler gürültücü grubumuzdan hızla kaçışıyor; meyhane sahipleri gölgelerden çaresizce izlerken biz bağırıp çağırıyor, içiyoruz. Bunun sabahı ağır olabilecek bir gece olduğunu şimdiden görebiliyorum.\n\n"

 lmf_army.1040.end:0 "Durmalıyım, diyorum kendi kendime. Ama bir çıkış yoluna ihtiyacım var. #EMP Bir şeye.#!"

 lmf_army.1040.a:0 "Onun yerine geceyi geçirecek biri bulacağım."

 lmf_army.1040.a.male.camp:0 "Yatmak için kampta genç bir adam arıyorsun."

 lmf_army.1040.a.male.tavern:0 "Yatmak için meyhanede genç bir adam arıyorsun."

 lmf_army.1040.a.female.camp:0 "Yatmak için bir kamp izleyicisi arıyorsun."

 lmf_army.1040.a.female.tavern:0 "Yatmak için genç bir meyhane kızı arıyorsun."

 lmf_army.1040.b:0 "Onun yerine gidip talim yapacak biri bulacağım."

 lmf_army.1040.c:0 "Elbette katılabileceğim bir kumar vardır, değil mi?"

 lmf_army.1040.d:0 "İştahımı içki yerine yemeğe yönlendireceğim!"

 lmf_army.1040.e:0 "Taşkınlık dolu bir gece tam da ihtiyacım olan şey!"

 lmf_army.1040.f:0 "Ayartmaya direnebilirim. En iyisi şimdi çekilmek."

 lmf_army.1050.t:0 "Silah Arkadaşları"

 lmf_army.1050.march.start:0 "[army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de yürüyüşle geçen günler uzun oldu,"

 lmf_army.1050.siege.start:0 "[army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'i kuşatmakla geçen günler uzun,"

 lmf_army.1050.end:0 "askerler arasında her zaman dostça bir yoldaşlık yaşanmaz. Gerginlikler sık sık tırmanır.\n\nBu gece ise ateşin başında dinlenirken [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))] yanıma geldi ve sohbet kendiliğinden akıp gitti. [army_friend.GetSheHe|U] beni eğlenceli hikâyelerle oyaladı, gönlümü ferahlattı; alevler sönmeye yüz tuttuğunda neredeyse nerede olduğumu tamamen unutuyordum.\n\nBir göz kırpmayla, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))]'in ruh halimin gayet farkında olduğunu ve akşamını bilerek beni eğlendirmeye adadığını anlayabiliyordum. İyi bir [army_friend.GetWomanMan] doğrusu."

 lmf_army.1050.a:0 "Aslında, sanırım yeni bir dost buldum."

 lmf_army.1050.a.friend.tt:0 "[player.Custom('KnightCulturePluralNoTooltip')] Dost Olun"

 lmf_army.1050.a.friend.desc:0 "[player.Custom('KnightCulturePluralNoTooltipLowercase')] [champion.GetShortUIName] ve [army_friend.GetShortUIName], [province.GetTitle.GetNameNoTierNoTooltip]'deki ordu kampındayken dost oldular."

 made_friend_at_army_camp:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], [PROVINCE.GetNameNoTooltip]'de kamp kurmuş ordunun parçasıyken dost oldular."

 lmf_army.1050.b:0 "[army_friend.GetHerHis] çabalarını takdir ediyorum; ama bu gecenin ötesine geçmesine gerek yok."

 lmf_army.1060.t:0 "Silah Rakipleri"

 lmf_army.1060.mid:0 "askerler arasında her zaman dostça bir yoldaşlık yaşanmaz. Gerginlikler sık sık tırmanır.\n\nBu gece tam da bunun bir örneğiydi. Gün boyunca [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_rival'))] ile birkaç kez sürtüşme yaşamıştım; dişlerimi sıkıp sırf uzaklaşmakla sonuçlanan tartışmaya dönüşmek üzere olan kavgalardı. Ama sonra, ateşin çevresinde otururken, [army_rival.GetHerHim]'in diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'lara benim hakkımda yorumlar yaptığını duydum.\n\nBunların hepsi şunun etkisiyle yapılıyordu: "

 lmf_army.1060.revenge:0 "[army_rival.GetHerHis] intikam arzusu,"

 lmf_army.1060.impious:0 "[army_rival.GetHerHis] benim [army_rival.GetSheHe]'in saydığı şeylere duyduğu garez,"impiety", "

 lmf_army.1060.pious:0 "[army_rival.GetHerHis] dindarlığıma duyduğu garez,"

 lmf_army.1060.faith:0 "[army_rival.GetHerHis] inancıma duyduğu nefret,"

 lmf_army.1060.jealous:0 "kıskançlık,"

 lmf_army.1060.differences:0 "aşırı farklılıklarımız,"

 lmf_army.1060.hatred:0 "[army_rival.GetHerHis] bana karşı her zamanki nefreti, yeni bir şey değil,"

 lmf_army.1060.end:0 "Eminim; ama [army_rival.GetHerHim]'in, duyabileceğim bir yerde yalanlar yaymasını dinlemeyi çoktan bırakmıştım.\n\nAyağa kalktım, [army_rival.GetHerHim]'e meydan okudum ve çok geçmeden [army_rival.GetSheHe] ile boğuşuyorduk. Diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'lar, kimin neyi başlattığını belirleyemeden bizi ayırmak zorunda kaldı. Hatta [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_rival'))], suçun #EMP benim#! olduğunu iddia etti!"

 lmf_army.1060.a:0 "Bu affedilemez!"

 lmf_army.1060.a.rival.tt:0 "[player.Custom('KnightCulturePluralNoTooltip')] Rakipler Olun"

 lmf_army.1060.a.rival.desc:0 "[player.Custom('KnightCulturePluralNoTooltipLowercase')] [champion.GetShortUIName] ve [army_rival.GetShortUIName], [province.GetTitle.GetNameNoTierNoTooltip]'deki ordu kampındayken rakip oldular."

 became_rivals_army_camp:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], [PROVINCE.GetNameNoTooltip]'de kamp kurmuş ordunun parçasıyken azılı rakip oldular."

 lmf_army.1060.b:0 "Onu sakinleştirmeye çalışacağım. Elimden geldiğince gönlünü almaya çalışacağım."

 lmf_army.1060.c:0 "Dişlerimi sıkıp uzaklaşma zamanı. Yine."

 lmf_army.1070.t:0 "Taşma Noktası"

 lmf_army.1070.mid:0 "ve ordu kampında [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_rival'))]'in bulunması işleri kesinlikle kolaylaştırmıyor.\n\n[army_rival.GetHerHis|U] bana karşı alaycı tavrı ilk günden beri beni rahatsız ediyor; bu gece ise ikimizin de bitkinliği işleri daha da kötüleştirdi. Birbirini izleyen asitli yorumlar; derken geçerken birbirimize çarpıyoruz — #EMP [army_rival.GetHerHis]#! bilerek yapıyor, eminim — ve birden [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_rival'))] [army_rival.GetHerHis] kılıcını çekip beni düelloya davet etti.\n\n"

 lmf_army.1070.liege:0 "Teknik olarak konuşmak gerekirse, orduda bu tür izinsiz düellolara izin verilmez. [army_rival.GetHerHis] hükümdarı olarak bu kuralı görmezden gelmeye karar verebilirim... ayrıca [army_rival.GetHerHis] hükümdarına saldırmaya kalkıştığı için [army_rival.GetHerHim]'i zincire vurabilirim; bu teknik olarak vatana ihanettir, değil mi? Ama #EMP ah#! [army_rival.GetHerHim]'e ders vermek ne kadar iyi hissettirir!"

 lmf_army.1070.commander:0 "Teknik olarak konuşmak gerekirse, orduda bu tür izinsiz düellolara izin verilmez. Ama [army_rival.GetHerHis] komutanı olarak bu kuralı görmezden gelmeye karar verebilirim... #EMP ah#! [army_rival.GetHerHim]'e ders vermek ne kadar iyi hissettirir!"

 lmf_army.1070.knight:0 "Tek sorun mu? Orduda bu tür izinsiz düellolara izin verilmez. Emirlere itaatsizlik yüzünden ikimiz de zincire vurulabiliriz... ama #EMP ah#! [army_rival.GetHerHim]'e ders vermek ne kadar iyi hissettirir!"

 lmf_army.1070.a:0 "[army_rival.GetSheHe] düello istiyorsa, öyle olsun!"

