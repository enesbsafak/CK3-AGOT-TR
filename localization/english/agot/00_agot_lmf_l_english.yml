 lmf_interaction.1328.desc.secrec.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'i sohbetiyle etkilemeye çalıştı. [secondary_actor.GetSheHe|U] görünüşe göre [secondary_recipient.GetHerHis] sessizliğini cesaret saydı, çünkü [secondary_recipient.GetSheHe]... uygunsuz davranmaya başladı. Fazla yakın durup imalı yorumlar yapıyor, her şeyin harika gittiğine kesin inanıyordu."

 lmf_interaction.1328.desc.secrec.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerini gezerken [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetHerHim]'i [secondary_actor.GetCulture.GetNameNoTooltip] şiirleriyle eğlendirdi. [secondary_actor.GetSheHe|U], [secondary_recipient.GetHerHis] göreli sessizliğini cesaret sayıp okumalarıyla daha da çok denedi; açıkça âşık olmuştu."

 lmf_interaction.1328.desc.secrec.library:0 "[actor.Custom('FortifiedBuilding')] kütüphanesini gezdiler; [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetFirstNameNoTooltip]'e ciltler arasındaki en sevdiği kitapları gösterdi. Anlatılanlara göre [secondary_actor.GetSheHe] bitmek bilmeden konuştu ve [secondary_recipient.GetHerHis] göreli sessizliğini cesaret saydı. [secondary_actor.GetSheHe|U] açıkça gönül vermişti."

