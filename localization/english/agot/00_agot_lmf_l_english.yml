 lmf_interaction.1202.opening:0 "[recipient.Custom2('LMF_RelationToMeShort', ROOT.Char )|U],"

 lmf_interaction.1202.start:0 "Talebini çok düşündüm ve karar verdim ki, "

 lmf_interaction.1202.adulterer:0 "herkesten önce senin bana erdem konusunda ders vermenin koca bir ironi olması, "

 lmf_interaction.1202.soulmate:0 "[family_lover.GetHerHim]'in gerçekten ruh eşim olduğuna inandığım gerçeği,"

 lmf_interaction.1202.angry:0 "böyle bir biçimde araya girmen beni ne kadar rahatsız ediyor, "

 lmf_interaction.1202.open:0 "ilişkimizin zaten açıktan açığa olduğu ve yapabileceği zararın zaten yapıldığı gerçeği,"

 lmf_interaction.1202.default:0 "[family_lover.GetHerHim]'e ne kadar çok hayran olduğumu,"

 lmf_interaction.1202.end:0 "İstediğini yapacağım.\n\n[family_lover.GetTitledFirstNameNoTooltip] ile yolları ayırmanın gerçekten benim iyiliğime olduğunu düşünüyorsan, işleri derhal bitireceğim."

 lmf_interaction.1202.a:0 "Evet, öyle yap."

 lmf_interaction.1202.b:0 "Belki aşırı tepki veriyorum..."

 lmf_interaction.1203.start:0 "Talebin üzerinde uzun uzun düşündüm. Ama sonunda, [family_lover.GetTitledFirstNameNoTooltip] ile işleri bitirmemeye karar verdim.\n\n"

 lmf_interaction.1203.adulterer:0 "Dürüst olmak gerekirse, herkesten önce senin bana erdem konusunda ders vermen? Bu inanılır gibi değil.\n\n"

 lmf_interaction.1203.soulmate:0 "[family_lover.GetSheHe|U] ruh eşim ve [family_lover.GetHerHim]'i seviyorum; [family_lover.GetHerHim]'den ayrılmam, kendi kalbimden ayrılmamdan daha kolay değil.\n\n"

 lmf_interaction.1203.open:0 "Ne de olsa ilişkimiz meselesi zaten açıktan açığa; itibarıma daha ne zarar verebilir ki? Doğrusu bu böyle olduğu için rahatım.\n\n"

 lmf_interaction.1203.default:0 "Basit gerçek şu ki [family_lover.GetHerHim]'i seviyorum ve gerçekten önemli olan tek şey bu.\n\n"

 lmf_interaction.1203.end.rival:0 "Senin böyle bir müdahalenin olumlu karşılık vereceğimi düşünmen aklımı zorluyor."

 lmf_interaction.1203.end.malicious:0 "Bu seni hayal kırıklığına uğratıyorsa, [recipient.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], öyle olsun. Gerçekten umurumda değil."

 lmf_interaction.1203.end.dominant:0 "Bu seni hayal kırıklığına uğratıyorsa, öyle olsun. Bu benim kararım ve yalnızca bana ait."

 lmf_interaction.1203.end.submissive:0 "Bu seni hayal kırıklığına uğratırsa gerçekten, gerçekten üzgünüm. Bu yüzden ne kadar kıvrandığımı bilemezsin."

 lmf_interaction.1203.end.default:0 "Bu seni hayal kırıklığına uğratıyorsa, [recipient.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], üzgünüm."

 lmf_interaction.1203.a:0 "Belki bazı hediyeler seni ikna eder...?"

 lmf_interaction.1203.a.lover.tt:0 "[family_lover.GetTitledFirstNameNoTooltip]'in evliliği onaylaması için ikna edilmesi gerekecek..."

 lmf_interaction.1203.b:0 "O halde bunun yerine doğrudan [family_lover.GetTitledFirstNameNoTooltip] ile konuşacağım."

 lmf_interaction.1203.c:0 "Bana karşı gelmenin sonuçları var!"

 lmf_interaction.1203.d:0 "Pekâlâ. Meseleyi burada bırakacağım."

 lmf_interaction.1204.opening:0 "[family_lover.Custom2('GreetingToForeignRulerPositive', ROOT.Char )],"

 lmf_interaction.1204.secret:0 "Senin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'inle ilişkimi biliyorsun demek?\n\n"

 lmf_interaction.1204.open:0 "Doğrusu, [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'inle ilişkim kamuoyuna duyulduğundan beri bu günün geleceğini bekliyordum.\n\n"

 lmf_interaction.1204.end:0 "Bu konuyu uzun uzun düşündüm. [recipient.GetTitledFirstNameNoTooltip]'e çok değer veriyorum... ama elbette sen de veriyorsun, yoksa böyle bir fedakârlık istemezdin. O halde, tüm kuşkularıma rağmen, gerçekten istediğin buysa emrettiğini yapacağım ve [recipient.GetHerHim] ile işleri derhal bitireceğim."

 lmf_interaction.1205.opening:0 "[family_lover.Custom2('GreetingToForeignRuler', ROOT.Char )],"

 lmf_interaction.1205.start:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'ine değer verdiğini biliyorum. Ben de veriyorum; tıpkı [recipient.GetFirstNameNoTooltip]'in bana değer verdiğini bildiğim gibi. O yüzden sırf sen emrettin diye [recipient.GetHerHim]'i terk edemem.\n\n"

 lmf_interaction.1205.end.rival:0 "Bu seni üzüyorsa, iyi. [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('recipient'))]'inin işlerine karıştığın için bunu hak ettin."

 lmf_interaction.1205.end.malicious:0 "[recipient.GetFirstNameNoTooltip] bana her işe burnunu sokan bir [recipient.Custom2('LMF_RelationToMeShort', ROOT.Char )] olduğunu söylemişti ve görünüşe göre [recipient.GetSheHe] haklıymış."

 lmf_interaction.1205.end.dominant:0 "Bu seni üzüyorsa, öyle olsun; ama bu, benimle [recipient.GetFirstNameNoTooltip]'e ait bir karar."

 lmf_interaction.1205.end.submissive:0 "Bu seni üzerse gerçekten üzgünüm, [ROOT.Char.GetLadyLord]'im. Bu karar üzerinde ne kadar kıvrandığımı bilemezsin."

 lmf_interaction.1205.end.benevolent:0 "Bu seni üzerse gerçekten üzgünüm; ama bunu [recipient.GetFirstNameNoTooltip]'ten ve yalnızca ondan duymam gerekiyor."

 lmf_interaction.1205.end.default:0 "Kararım seni üzerse, [ROOT.Char.GetLadyLord]'im, gerçekten üzgünüm; ama başka yapabileceğim bir şey yok."

 lmf_interaction.1205.a:0 "Gidip gitmemen için ne gerekir?"

 lmf_interaction.1205.b:0 "O halde doğrudan [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'imle konuşmaktan başka çarem yok."

 lmf_interaction.1206.start:0 "Talebini çok düşündüm ve karar verdim ki, "

 lmf_interaction.1206.adulterer:0 "herkesten önce senin bana erdem konusunda ders vermenin koca bir ironi olması, "

 lmf_interaction.1206.angry:0 "böyle bir biçimde araya girmen beni ne kadar rahatsız ediyor, "

 lmf_interaction.1206.default:0 "tüm ilişkilerime son vermemi istemenin düpedüz cüretkârlığı,"

 lmf_interaction.1206.end:0 "İstediğini yapacağım.\n\nSevgililerimle yolları ayırmanın gerçekten benim iyiliğime olduğunu düşünüyorsan, nedenlerin olduğuna güvenip işleri derhal bitireceğim."

 lmf_interaction.1207.start:0 "Talebin üzerinde uzun uzun düşündüm. Ama sonunda, sırf sen öyle uygun gördüğün için sevgililerimden vazgeçmemeye karar verdim.\n\n"

 lmf_interaction.1207.adulterer:0 "Dürüst olmak gerekirse, herkesten önce senin bana erdem konusunda ders vermen? Bu inanılır gibi değil.\n\n"

 lmf_interaction.1207.default:0 "Her biri kalbimde ve yatağımda bir yere sahip; benim hakkım bu.\n\n"

 lmf_interaction.1207.end.rival:0 "Böyle bir müdahaleye olumlu karşılık vereceğimi düşünmen aklımı zorluyor."

 lmf_interaction.1207.end.malicious:0 "Bu seni hayal kırıklığına uğratıyorsa, [recipient.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], öyle olsun. Gerçekten umurumda değil."

 lmf_interaction.1207.end.dominant:0 "Bu seni hayal kırıklığına uğratıyorsa, öyle olsun. Bu benim hayatım ve benim kararım."

 lmf_interaction.1207.end.submissive:0 "Bu seni hayal kırıklığına uğratırsa gerçekten, gerçekten üzgünüm. Her şeyi tercih ederdim; ama kendi hayatımı yaşamak zorundayım."

 lmf_interaction.1207.end.default:0 "Bu seni hayal kırıklığına uğratıyorsa, [recipient.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], üzgünüm."

