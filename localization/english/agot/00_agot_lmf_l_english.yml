 lmf_feast.1001.desc.opening:0 "Aile bu akşam [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in büyük salonunda bir şölen için toplandı ve daha en başından işler iyi gitmedi.\n\nHava gerilim doluydu. Sonra, neredeyse hiçbir uyarı olmadan, [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_rival_2'))] şununla tartışmaya başladı: "

 lmf_feast.1001.desc.relation:0 "[family_rival_2.GetHerHis] [family_rival_2.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_rival_1'))], [family_rival_1.GetFirstNameNoTooltip].\n\n"

