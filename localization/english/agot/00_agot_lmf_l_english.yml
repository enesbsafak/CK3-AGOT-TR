 lmf_spouse_court_benevolent:0 "ilk başta tereddüt etti. Ama [ROOT.GetCharacter.GetHerHis] doğasının saf yumuşaklığı herkesçe görülebiliyordu; çok geçmeden sarayın yarısı [ROOT.GetCharacter.GetHerHim]'e hayran oldu ve [ROOT.GetCharacter.GetSheHe], sanki yıllardır buradaymış gibi nazik ve tanıdık bir gülümsemeyle aralarında dolaştı"

 lmf_spouse_court_levelheaded:0 "meseleye soğukkanlılıkla yaklaştı. [ROOT.GetCharacter.GetSheHe|U] önünde duran görevi açıkça takdir etti ve [ROOT.GetCharacter.GetHerHis] pratik doğası herkesçe görülüyordu"

 lmf_spouse_court_gregarious:0 "çabucak [second.Custom('FortifiedBuilding')]'in neşesi haline geldi. [ROOT.GetCharacter.GetHerHis|U] çabuk gülümsemesi ve taşkın doğası, kazanılmak istemeyenleri bile kazandı. Bana söylendiğine göre ziyafetlerdeki [ROOT.GetCharacter.GetHerHis|U] kahkahası avludan duyuluyordu"

 lmf_spouse_court_diligent:0 "[ROOT.GetCharacter.GetSheHe]'in onların [ROOT.GetCharacter.GetTitleAsNameNoTooltip|l]'i olma görevini ne kadar ciddiye aldığını açıkça dile getirdi. Bunun [ROOT.GetCharacter.GetSheHe]'in kaçınacağı bir şey olmadığı herkesçe açıktı ve herkes biliyordu"

 lmf_spouse_court_smart:0 "zekice, doğru kişilerle doğru şeyler hakkında konuştu; sarayın en önemli üyelerinden [ROOT.GetCharacter.GetSheHe]'in [second.Custom('FortifiedBuilding')]'i gerçekten yöneten hizmetkârlar olduğunu sezdiği kişilere kadar. [ROOT.GetCharacter.GetSheHe]'in onları ne kadar çabuk avucunun içine aldığını görmek gerçekten hayranlık vericiydi"

 lmf_spouse_court_lunatic:0 "...en iyi halinde değildi. [ROOT.GetCharacter.GetSheHe|U] çoğu zaman nerede olduğunu bilmiyormuş gibi davrandı. Bir ara [ROOT.GetCharacter.GetSheHe] sarayın ortasında ayağa kalktı, çığlık attı ve odadan fırladı. [ROOT.GetCharacter.GetHerHim]'i #EMP saatlerce#! bulamadık!"

 lmf_spouse_court_malicious:0 "tüm bu konuşmalara alayla baktı. [ROOT.GetCharacter.GetSheHe|U], [ROOT.GetCharacter.GetSheHe] sahibiymiş gibi [second.Custom('FortifiedBuilding')]'e girdi; [ROOT.GetCharacter.GetHerHis] asitli doğası [ROOT.GetCharacter.GetHerHim]'e sarayımda kolay dost kazandırmadı"

 lmf_spouse_court_temper:0 "kudurmuştu. [ROOT.GetCharacter.GetSheHe|U] tüm dedikodulardan nefret ediyor ve [second.Custom('FortifiedBuilding')]'deki herkesin de aynı şekilde hissettiğini varsayıyordu. [ROOT.GetCharacter.GetHerHis|U] öfkesi hizmetkârlar arasında şimdiden meşhur olduğu gibi sarayın da konusu"

 lmf_spouse_court_arrogant:0 "her nasılsa kendini her şeyin üstünde görüyordu. Özellikle de artık [ROOT.GetCharacter.GetSheHe] benim [ROOT.GetCharacter.GetWifeHusband]'im ve onların yeni [ROOT.GetCharacter.GetLadyLord]'i olduğuna göre. [ROOT.GetCharacter.GetHerHis|U] ani kibir, [ROOT.GetCharacter.GetHerHim]'e sarayımda kesinlikle hayran kazandırmadı"

 lmf_spouse_court_drunkard:0 "...çoğunlukla sarhoştu. [ROOT.GetCharacter.GetSheHe|U] karşılama yemeğinde, [ROOT.GetCharacter.GetHerHis] ilk sarayında ve doğrusu neredeyse her başka vesilede aşırıya kaçtı. Kimse bir şey söylemek istemedi; ama ben [ROOT.GetCharacter.GetHerHis] büyük gösterisinin fazlasıyla farkındaydım"

 lmf_spouse_court_dumb:0 "gerçekten işin üstesinden gelemiyordu. [ROOT.GetCharacter.GetHerHim]'in önündeki görevleri açıklamaya çalıştığımda [ROOT.GetCharacter.GetSheHe|U] boş gözlerle kırpıştırdı ve çoğunlukla [second.Custom('FortifiedBuilding')]'de sendeleyerek dolaştı... nereye gittiğini ve ne yapması gerektiğini sürekli unutarak"

 lmf_spouse_court_dull:0 "gerçekten işin üstesinden gelemiyordu. [ROOT.GetCharacter.GetHerHis] ilk sarayında, [ROOT.GetCharacter.GetHerHim] ile konuşan herkes sıkıcı sohbetinden hızla uzaklaştı; ta ki sonunda [ROOT.GetCharacter.GetSheHe] orada tuhaf ve yapayalnız dikilene dek. O günden beri de düzelmedi"

 lmf_spouse_court_submissive:0 "kendisine söyleneni yaptı, ondan fazlasını değil. [ROOT.GetCharacter.GetSheHe|U] sarayımın büyüklüğünden bunalmış halde boynunu büküp [ROOT.GetCharacter.GetHerHis] başını öne eğdi ve kendisiyle ilk konuşan olunmadıkça çoğunlukla sessiz kaldı"

 lmf_spouse_court_introverted:0 "hepsini oldukça bunaltıcı buldu. Saraya ya da bir yemeğe açıkça çağrılmadığında [ROOT.GetCharacter.GetSheHe] [ROOT.GetCharacter.GetHerHis] yatak odasında saklanıyordu. Dışarı çıktığında bile çoğunlukla geride duruyor ve kimseyle konuşmuyordu"

 lmf_spouse_court_depressed:0 "her şeye karşı çoğunlukla duygusuz görünüyordu. [ROOT.GetCharacter.GetHerHis|U] hüznü [ROOT.GetCharacter.GetHerHim]'e bir kefen gibi yapışmıştı; herkesin dikkatini çeken bir keder... yeni evli bir [new_spouse.GetWomanMan] neşeli olmaz mıydı? Ne yazık ki öyle değildi"

 lmf_spouse_court_fallthrough:0 "elinden gelenin en iyisini yaptı. Neyse ki [ROOT.GetCharacter.GetSheHe] kimseyi etkilemese de, kimseyi gücendirmedi ya da kayda değer bir hata yapmadı. Doğrusu saraylılarım [ROOT.GetCharacter.GetHerHim]'i çoğunlukla görmezden geldi; belki de en iyisi buydu"

 lmf_spouse.101.t.lowborn:0 "Bir Halktan Kişi ve [new_spouse.GetTitleAsNameNoTooltip|U]"

 lmf_spouse.101.t.ruler:0 "[new_spouse.GetTitleAsNameNoTooltip|U] [spouse_title.GetNameNoTierNoTooltip]'den Geliyor"

 lmf_spouse.101.t.relative:0 "[ROOT.Char.Custom2('LMF_BloodRelationToMe', SCOPE.sC('new_spouse'))|U] ve [new_spouse.GetTitleAsNameNoTooltip|U]"

 lmf_spouse.101.t.default:0 "Yeni [new_spouse.GetTitleAsNameNoTooltip|U]"

 lmf_spouse.101.desc.start:0 "Evliliğimizden önce [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] halkı "

 lmf_spouse.101.desc.start.lowborn:0 "muhtemelen yeni [new_spouse.GetWifeHusband]'imin sıradan bir doğumdan geldiğinden başka bir şey bilmiyordu. Pek çokları için bir sürpriz olmalı.\n\n"

 lmf_spouse.101.desc.start.relative:0 "yeni [new_spouse.GetWifeHusband]'imi, eğer biliyorsa, başta [ROOT.Char.Custom2('LMF_BloodRelationToMe', SCOPE.sC('new_spouse'))]'im olarak tanıyordu.\n\n"

 lmf_spouse.101.desc.start.ruler:0 "muhtemelen yeni [new_spouse.GetWifeHusband]'imin, eğer biliyorsa, [spouse_title.GetNameNoTooltip]'e hüküm sürdüğünden başka bir şey bilmiyordu.\n\n"

 lmf_spouse.101.desc.start.rulerdistant:0 "muhtemelen yeni [new_spouse.GetWifeHusband]'imin, uzaktaki [spouse_top_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]'de [spouse_title.GetNameNoTooltip|l]'e hüküm sürdüğünden başka bir şey bilmiyordu.\n\n"

 lmf_spouse.101.desc.start.rulerrelative:0 "muhtemelen yeni [new_spouse.GetWifeHusband]'imi, eğer biliyorsa, yalnızca [spouse_relative.GetPrimaryTitle.GetNameNoTierNoTooltip]'in [spouse_relative.GetTitleAsNameNoTooltip]'inin [spouse_relative.Custom2('LMF_BloodRelationToMe', SCOPE.sC('new_spouse'))|l] olarak tanıyordu.\n\n"

 lmf_spouse.101.desc.start.dynasty:0 "yeni [new_spouse.GetWifeHusband]'imi, eğer biliyorsa, yalnızca [new_spouse.GetDynasty.GetBaseName] hanedanından bir [new_spouse.Custom('polite_gender_ref')] olarak tanıyor olabilir.\n\n"

 lmf_spouse.101.desc.start.default:0 "muhtemelen yeni [new_spouse.GetWifeHusband]'im hakkında hiçbir şey bilmiyordu. [new_spouse.GetSheHe] tam bir muammaydı.\n\n"

 lmf_spouse.101.desc.hasrep2:0 "Sonra, söz yayıldıkça, her şey bir yana, [new_spouse.Custom('first_spouse_reputation_comment')] ve [new_spouse.Custom('second_spouse_reputation_comment')] hakkında dedikodu yaptılar. "

 lmf_spouse.101.desc.hasrep1:0 "Sonra, söz yayıldıkça, çoğunlukla [new_spouse.Custom('first_spouse_reputation_comment')] hakkında dedikodu yaptılar. "

 lmf_spouse.101.desc.hasrep0:0 "Çeşitli söylentiler dışında, [new_spouse.GetHerHim]'den ne bekleyeceklerini bilmiyorlardı. "

 lmf_spouse.101.desc.hasrem2:0 "[ROOT.Char.Custom('FortifiedBuilding')]'e yolculuk edip [new_spouse.GetHerHim]'i sarayda gerçekten görenler, [new_spouse.Custom('first_spouse_remarkable_comment')] ve [new_spouse.Custom('second_spouse_remarkable_comment')] hakkında fısıldaştılar.\n\n"

 lmf_spouse.101.desc.hasrem1:0 "[ROOT.Char.Custom('FortifiedBuilding')]'e yolculuk edip [new_spouse.GetHerHim]'i sarayda gerçekten görenler, çoğunlukla [new_spouse.Custom('first_spouse_remarkable_comment')] ve [new_spouse.Custom('random_spouse_remarkable_comment')] hakkında fısıldaştılar.\n\n"

 lmf_spouse.101.desc.hasrem0:0 "[ROOT.Char.Custom('FortifiedBuilding')]'e yolculuk edip [new_spouse.GetHerHim]'i sarayda gerçekten görenler, [new_spouse.Custom('first_random_spouse_remarkable_comment')] ve [new_spouse.Custom('second_random_spouse_remarkable_comment')] hakkında fısıldaştılar.\n\n"

 lmf_spouse.101.desc.mid:0 "[new_spouse.GetFirstNameNoTooltip] ise, kendi açısından, [new_spouse.Custom2('spouse_court_introduction', ROOT.Char )].\n\n"

 lmf_spouse.101.desc.good:0 "Son derece hayırlı bir başlangıç. Umarız bu, geleceğin bir işaretidir."

 lmf_spouse.101.desc.goodsick:0 "[new_spouse.GetFirstNameNoTooltip] baştan sona o kadar hastayken, daha fazlasını isteyebileceğimi sanmıyorum."

 lmf_spouse.101.desc.bad:0 "En hayırlı başlangıç sayılmaz, kabul ediyorum. Umarız bu, geleceğin bir işareti değildir."

 lmf_spouse.101.desc.badsick:0 "Kuşkusuz [new_spouse.GetFirstNamePossessiveNoTooltip] hastalığı, [new_spouse.GetHerHis] davranışına katkıda bulundu. Umarız [new_spouse.GetSheHe] iyileşince işler düzelir."

 lmf_spouse.101.desc.default:0 "Genel olarak daha kötü olabilirdi. Umuyoruz ki gelecekte işler düzelir."

 lmf_spouse.101.desc.defaultsick:0 "[new_spouse.GetFirstNameNoTooltip] baştan sona o kadar hastayken, işler çok daha kötü olabilirdi. Umarız [new_spouse.GetSheHe] çabucak iyileşir."

 lmf_spouse.101.a:0 "[new_spouse.GetTitledFirstNameNoTooltip]'e şerefler olsun!"

 lmf_spouse.1000.t:0 "Ruh Eşinin Mutluluğu"

 lmf_spouse.1000.desc.army:0 "Bugün, ordu kampa yerleştikten sonraki nadir bir huzur anında, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im beni bulmaya geldi.\n\n"

 lmf_spouse.1000.desc.travel:0 "Gün için çadırlarımıza yerleşmiştik, neredeyse bitkindik; derken [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im beni bulmaya geldi.\n\n"

 lmf_spouse.1000.desc.activity:0 "Öğleden sonra yoğun programımıza bir mola verip [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'deki avluda gezinirken başımı kaldırdım ve [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin yakınlarda durduğunu gördüm.\n\n"

 lmf_spouse.1000.desc.notlocal:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bugün beni [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'de ziyarete geldi; en hafif tabirle hoş bir sürpriz.\n\n"

 lmf_spouse.1000.desc.local:0 "Bugün [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'deki avluda, neredeyse düşüncelere dalmış halde gezinirken başımı kaldırdım ve [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin yakınlarda durduğunu gördüm.\n\n"

 lmf_spouse.1000.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'i gördüğüm an gülümsedim; [ROOT.Char.GetPrimarySpouse.GetSheHe] de aynı şekilde karşılık verdi. Neredeyse tek kelime etmeden yan yana yürümeye başladık. İzleyen biri için bu sıradan bir karı koca gezintisiydi; ama ben her zamanki gibi [ROOT.Char.GetPrimarySpouse.GetHerHis] varlığında kaybolmuştum.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] çeşitli sorunlarımdan yakınırken beni dikkatle dinledi; pek tavsiye vermedi, daha çok dert yanmam için bir vesile oldu. Her derin iç çekişimde [ROOT.Char.GetPrimarySpouse.GetSheHe] yumuşakça kıkırdıyor ve bir şekilde kendimi daha iyi hissediyordum.\n\nFarkına varmadan saatler geçmişti; yine de [ROOT.Char.GetPrimarySpouse.GetHerHis] eşliğinden sıkılmamıştım. Sanırım gerçek bir ruh eşine sahip olmak demek budur."

 lmf_spouse.1000.a:0 "Bundan asla sıkılmayacağım."

 lmf_spouse.1005.t:0 "[lover_trait.GetNameNoTooltip( ROOT.Char )|U] [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1005.desc.sinful:0 "Evliliğimiz boyunca, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin üzerimde kötü bir etki yaratabileceği öne sürüldü"

 lmf_spouse.1005.desc.good:0 "Evliliğimiz boyunca, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin üzerimde iyi bir etki yarattığı öne sürüldü"

 lmf_spouse.1005.desc.normal:0 "Evliliğimiz boyunca, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin üzerimde güçlü bir etki yarattığı öne sürüldü"

 lmf_spouse.1005.desc.mid:0 "... ve bunda bazı gerçekler var.\n\nÖrneğin, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] epeyce [lover_trait.GetNameNoTooltip( ROOT.Char )|l],"

 lmf_spouse.1005.desc.opposite:0 "oysa ben ise [lover_opposite_trait.GetNameNoTooltip( ROOT.Char )|l]. Bu, ilişkimizde kendini küçük yollarla gösteren bir çekişme noktası; zira [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] beni değiştirmeye hiç çalışmadıysa da [ROOT.Char.GetPrimarySpouse.GetSheHe]'in onaylamadığını anlayabiliyorum.\n\n"

 lmf_spouse.1005.desc.notopp:0 "ve [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] beni hiç değiştirmeye çalışmadıysa da, ince bakışlarında ve ara sıra çatılan kaşlarında [ROOT.Char.GetPrimarySpouse.GetHerHis] etkisini hâlâ hissediyorum.\n\n"

 lmf_spouse.1005.desc.end:0 "Birlikte olduğumuzda kendimi sık sık davranışlarımı değiştirirken buluyorum. Bağımız öylesine güçlü ki buna gerçekten aldırmıyorum; çünkü birbirine benzemek doğal geliyor... ama istediğim bu mu? [ROOT.Char.GetPrimarySpouse.GetSheHe] gibi daha [lover_trait.GetNameNoTooltip( ROOT.Char )|l] olmak?\n\nDik durursam, mantık gereği bu "

 lmf_spouse.1005.desc.opposite2:0 "anlaşmazlık noktası gerçek bir soruna dönüşene dek büyüyebilir. Oysa bizi ilk etapta bir araya getiren farklılıklarımız değil miydi?"

 lmf_spouse.1005.desc.notopp2:0 "ilişkimizde gerçek bir anlaşmazlık noktasına dönüşene dek büyüyebilir. Ya da belki de en başta sorun olmaması gereken şeyi fazla analiz ediyorum?"

 lmf_spouse.1005.a:0 "Olsun."

 lmf_spouse.1005.b:0 "Hayır, ben benim ve bu değişmeyecek."

 lmf_spouse.1005.b.tt:0 "Farklılıkların büyüyor"

 lmf_spouse.1010.t:0 "Sevgilim [lover_trait.GetNameNoTooltip( ROOT.Char )|U] Etkisi"

 lmf_spouse.1010.desc.sinful:0 "Evliliğimiz boyunca, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im üzerinde kötü bir etki yarattığım öne sürüldü"

 lmf_spouse.1010.desc.good:0 "Evliliğimiz boyunca, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im üzerinde iyi bir etki yarattığım öne sürüldü"

 lmf_spouse.1010.desc.normal:0 "Evliliğimiz boyunca, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im üzerinde güçlü bir etki yarattığım öne sürüldü"

 lmf_spouse.1010.desc.mid:0 "... ve bunda bazı gerçekler var.\n\nÖrneğin, ben sık sık [lover_trait.GetNameNoTooltip( ROOT.Char )|l] olurum, "

 lmf_spouse.1010.desc.opposite:0 "oysa [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ise [lover_opposite_trait.GetNameNoTooltip( ROOT.Char )|l]. Bu, ilişkimizde kendini küçük yollarla gösteren bir çekişme noktası; zira [ROOT.Char.GetPrimarySpouse.GetHerHim]'i değiştirmek için hiç çaba göstermediysem de, [ROOT.Char.GetPrimarySpouse.GetSheHe] onaylamadığımı anlayabiliyor.\n\n"

 lmf_spouse.1010.desc.notopp:0 "ve [ROOT.Char.GetPrimarySpouse.GetHerHim]'i değiştirmek için hiç çaba göstermediysem de, [ROOT.Char.GetPrimarySpouse.GetSheHe]'in ince bakışlarımın ve ara sıra çattığım kaşlarımın etkisini hissettiği açık.\n\n"

 lmf_spouse.1010.desc.end:0 "Giderek, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] birlikte olduğumuzda davranış biçimini değiştiriyor. Beni memnun etmek için ve farklılıklarımızın ilişkimizde bir çekişme noktasına dönüşmesini önlemek için, sanırım; her ne kadar [ROOT.Char.GetPrimarySpouse.GetHerHim]'den böyle bir şey istemesem de. Bağımız öylesine güçlü ki [ROOT.Char.GetPrimarySpouse.GetSheHe] şikâyet etmiyor; ve gerçekten inanıyorum ki bu, daha derin bir değişime yol açıyor... zamanla bizi ancak daha da yakınlaştırabilecek bir değişime."

 lmf_spouse.1010.a:0 "Bu yüzden [ROOT.Char.GetPrimarySpouse.GetHerHim]'i çok seviyorum."

 lmf_spouse.1015.t:0 "Yastık Sohbeti"

 lmf_spouse.1015.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im akşamı geçirmek için yatak odamıza geldiği anda bir şeylerin döndüğünü bilmeliydim. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in gözlerinde muziplikten bahseden bir parıltı vardı.\n\n"I have something to tell you, [ROOT.Char.GetPrimarySpouse.Custom2('spoken_address_by_familiarity', ROOT.Char)]," [ROOT.Char.GetPrimarySpouse.GetSheHe] said.\n\n"Oh?" I did my best to pretend to be unintrigued, though it was untrue.\n\n"It's a secret I overheard at court today, and I thought you might just be interested to hear it...""

 lmf_spouse.1015.a:0 ""How clever of you, my love!""

 lmf_spouse.1020.t:0 "Yetenekli [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1020.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin gerçekte ne kadar yetenekli olduğunu unutmak bazen kolaydır.\n\n"

 lmf_spouse.1020.desc.diplomacy:0 "Yine de son zamanlarda [ROOT.Char.GetPrimarySpouse.GetSheHe] epey yardımcı oluyor; yatakta oturup diğer hükümdarlara yazışmalarımı kaleme alışımı dinliyor ve ardından sözcüklerimi nasıl düzelteceğime dair en içgörülü tavsiyeleri sunuyor.\n\n"

 lmf_spouse.1020.desc.martial:0 "Yine de geçenlerde [ROOT.Char.GetPrimarySpouse.GetSheHe], masamdaki askerlerimizin iaşesi hakkında sıkıcı ayrıntılara inen bazı kâğıtları fark etti ve şaşırtıcı derecede faydalı iyileştirme önerileri sundu.\n\n"

 lmf_spouse.1020.desc.stewardship:0 "Yine de geçenlerde, ikimiz yatakta uzanırken vassallarımla vergi düzenlemeleri hakkında bitmek bilmeden yakınırken, [ROOT.Char.GetPrimarySpouse.GetSheHe] gelişigüzel bazı önerilerde bulundu; bu öneriler o düzenlemeleri kayda değer biçimde iyileştirdi.\n\n"

 lmf_spouse.1020.desc.intrigue:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis|U] gözleri her zaman tetikte; özel muhafızımdaki bazı eksiklikleri işaret ediyor ve saraydaki hangi entrikaları ne şekilde dikkate almam gerektiğini gösteriyor.\n\n"

 lmf_spouse.1020.desc.learning:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] en son saplantılarım hakkındaki saçmalamalarıma büyük ilgi gösteriyor, hatta zaman zaman [ROOT.Char.GetPrimarySpouse.GetHerHis] bilgi hazinesinden çıkardığı faydalı ipuçları da veriyor.\n\n"

 lmf_spouse.1020.desc.end:0 "İlk başta [ROOT.Char.GetPrimarySpouse.GetHerHis] yardımını kabul etmeye direndim; ama giderek, iyiliğimi bu kadar açıkça düşünen bir [ROOT.Char.GetPrimarySpouse.GetWomanMan]'in yardımını kabul etmenin en akıllıcası olduğuna karar verdim."

 lmf_spouse.1020.a:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] harika, değil mi?"

 lmf_spouse.1025.t:0 "Küçük Bir Hediye"

 lmf_spouse.1025.desc.ruler:0 "[ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den bir haberci geldiği söylendiğinde bunu oldukça tuhaf buldum; o yüzden onu karşılamak için avluya indim.\n\n"

 lmf_spouse.1025.desc.notlocation:0 "[ROOT.Char.GetPrimarySpouse.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den bir haberci geldiği söylendiğinde bunu oldukça tuhaf buldum; o yüzden onu karşılamak için avluya indim.\n\n"

 lmf_spouse.1025.desc.location:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin beni görmek için avluya geldiği söylendiğinde bunu oldukça tuhaf buldum. Bu kadar resmi mi? Ne kadar acayip. Hemen [ROOT.Char.GetPrimarySpouse.GetHerHim]'i karşılamaya indim.\n\n"

 lmf_spouse.1025.desc.courtier:0 "[ROOT.Char.Custom('FortifiedBuilding')]'in avlusundan geçerken [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imi orada dikilirken, deli gibi sırıtırken gördüm. Ne... beklenmedik. Tabii ki hemen [ROOT.Char.GetPrimarySpouse.GetHerHim] ile konuşmaya gittim.\n\n"

 lmf_spouse.1025.desc.messenger:0 "'mesaj', parıldayan bir değerli taşla süslü göz kamaştırıcı bir yüzüktü ve basit bir notla birlikte geldi:\n\n"#EMP They shall never shine as brightly as you - a small gift, from one who loves you as none other.#!"\n\nThe note was unsigned, but I know precisely who it's from."

 lmf_spouse.1025.desc.inperson:0 ""I have a small gift for you," [ROOT.Char.GetPrimarySpouse.GetSheHe] said. With that, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] passed me a brilliant ring, adorned with a glittering gemstone.\n\nI was about to object at [ROOT.Char.GetPrimarySpouse.GetHerHis] unnecessary generosity, but [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] cut me off before I could even speak. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] knows me too well.\n\n"You mean so much to me, [ROOT.Char.GetPrimarySpouse.Custom('WifeHusbandOpp')]. Please accept it as a token of our enduring bond." And, with that, [ROOT.Char.GetPrimarySpouse.GetSheHe] departed before I had a chance to reply."

 lmf_spouse.1025.a:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim] ne kadar düşünceli."

 lmf_spouse.1030.t:0 "Muhtaç Bir [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1030.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den haber aldım ve [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im için son zamanlarda işler... iyi gitmiyor.\n\nAnladığım kadarıyla [ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip]'in borçları [ROOT.Char.GetPrimarySpouse.GetHerHis] gözlerine kadar yükselmiş ve elbette [ROOT.Char.GetPrimarySpouse.GetSheHe] de "

 lmf_spouse.1030.desc.proud:0 "gururlu "

 lmf_spouse.1030.desc.stubborn:0 "inatçı "

 lmf_spouse.1030.desc.humble:0 "mütevazı "

 lmf_spouse.1030.desc.shy:0 "utangaç "

 lmf_spouse.1030.desc.paranoid:0 "paranoyak "

 lmf_spouse.1030.desc.craven:0 "korkmuş "

 lmf_spouse.1030.desc.content:0 "isteksiz "

 lmf_spouse.1030.desc.end:0 "yardımımı gerçekten #EMP istemek#! için.\n\nBelki de sadece araya girmeli ve [ROOT.Char.GetPrimarySpouse.GetHerHim]'e reddetme seçeneği vermemeliyim. Yine de içimden bir ses, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in sessizce beklediğinin tam da bu olduğunu ve kenarda durup hiçbir şey yapmazsam [ROOT.Char.GetPrimarySpouse.GetSheHe]'in hayal kırıklığına uğrayacağını, hatta üzüleceğini merak ediyor."

 lmf_spouse.1030.a:0 "Elbette yardım ederim!"

 lmf_spouse.1030.b:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] yapayalnız."

 lmf_spouse.1030.b.tt:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] yardımını bekliyordu..."

 lmf_spouse.1035.t:0 "Küçük Bir Tavsiye"

 lmf_spouse.1035.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bugün [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den gelir gelmez aklından bir şey geçtiğini anladım.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] o kadar meşguldü ki [ROOT.Char.GetPrimarySpouse.GetHerHis] kaşları stres ve endişeyle düğümlenmişti. [ROOT.Char.GetPrimarySpouse.GetSheHe]'in günü benimle geçirmek için değil, tavsiye istemek için geldiğini anlamaya başladım.\n\n"Is something amiss, my dear?" I finally asked.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] sighed heavily. "I know you have your own concerns managing [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], but I need your help "

 lmf_spouse.1035.desc.diplomacy:0 "hassas bir diplomasi meselesi hakkında "

 lmf_spouse.1035.desc.martial:0 "bir strateji meselesiyle "

 lmf_spouse.1035.desc.stewardship:0 "vassallarımdan biriyle sözleşmesi hakkında görüşürken "

 lmf_spouse.1035.desc.intrigue:0 "azami gizlilik gerektiren acil bir meseleyle "

 lmf_spouse.1035.desc.end:0 "bende olmayan bir bilginin olduğu bir alan. Lütfen... Korkarım oldukça çaresizim.""

 lmf_spouse.1035.a:0 ""I'll do my best, whatever you require.""

 lmf_spouse.1035.a.success:0 "Yardımın başarılı olur ve [ROOT.Char.GetPrimarySpouse.GetHerHim] memnun kalır"

 lmf_spouse.1035.a.fail.angry:0 "Yardımın ters teper ve [ROOT.Char.GetPrimarySpouse.GetSheHe] kudurur"

 lmf_spouse.1035.a.fail.disappointed:0 "Yardımın ters teper; ama [ROOT.Char.GetPrimarySpouse.GetSheHe] seni affeder"

 lmf_spouse.1035.b:0 "Buradan muğlak laflar ve savuşturmalarla sıyrıl."

 lmf_spouse.1035.b.success:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] yardım edemeyeceğini kabul ediyor"

 lmf_spouse.1035.b.fail:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] aldatmacanı görüyor"

 lmf_spouse.1040.t:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]'imin Tavsiyesi"

 lmf_spouse.1040.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin ne kadar becerikli ve zeki bir [ROOT.Char.GetPrimarySpouse.GetWomanMan] olduğunu unutmak bazen çok kolay geliyor.\n\nBugün [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bahçelerde yürüyorduk ki [ROOT.Char.GetPrimarySpouse.GetSheHe] "

 lmf_spouse.1040.desc.diplomacy:0 "bir vassalla yaşadığım bazı güncel sorunlardan ve bunları barışçıl yollarla nasıl çözebileceğimden bahsetmeye başladı.\n\n"

 lmf_spouse.1040.desc.martial:0 "silahşorlarla yaşadığımızı söylediğim bazı iaşe sorunlarından bahsetti ve bunları nasıl çözebileceğime dair birkaç seçenek sundu.\n\n"

 lmf_spouse.1040.desc.stewardship:0 "vassallarımla yaşadığımı söylediğim bir vergi anlaşmazlığı hakkında konuştu; önce isteksizce, sonra daha büyük bir inançla. Aslında [ROOT.Char.GetPrimarySpouse.GetSheHe] bana bu işi büsbütün aşmanın bir yolunu gösterdi.\n\n"

 lmf_spouse.1040.desc.intrigue:0 "[ROOT.Char.Custom('FortifiedBuilding')]'in güvenliğinden, daha doğrusu güvensizliğinden bahsetti. İçine sızılabilecek yollar. Bir tehdit olarak değil, iyiliğime duyduğu içten kaygıyla.\n\n"

 lmf_spouse.1040.desc.learning:0 "[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'deki kütüphaneleri nasıl destekleyebileceğim ve bunun diyarım genelinde artan gelişmeyi nasıl destekleyebileceği hakkında uzun uzun konuştu.\n\n"

 lmf_spouse.1040.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip|U] öğleden sonranın büyük bölümünde anlatmaya devam etti ve ben büyülenmiş bir halde dinledim. [ROOT.Char.GetPrimarySpouse.GetHerHis|U] tavsiyeleri gerçekten işe yarayabilirdi, eğer [ROOT.Char.GetPrimarySpouse.GetSheHe] vermeye devam etmeye istekliyse."

 lmf_spouse.1040.a:0 "Çok minnettarım!"

 lmf_spouse.1045.t:0 "İmdada"

 lmf_spouse.1045.desc.start:0 "Hastalığım beni yatağa düşürdü ve öksürüyorum; odama birinin girdiğini duyunca gözlerim bulanık biçimde derhal gitmesini emrediyorum.\n\n"Nonsense, my love. "

 lmf_spouse.1045.desc.ruler:0 "Hasta olduğunu duyar duymaz [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den ta buraya kadar geldim." "

 lmf_spouse.1045.desc.location:0 "Seninle ilgilenebilecek durumdayken seni burada eriyip bitmeye terk edecek değilim." "

 lmf_spouse.1045.desc.notlocation:0 "Hasta olduğunu duyar duymaz [ROOT.Char.GetPrimarySpouse.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den ta buraya kadar geldim." "

 lmf_spouse.1045.desc.mid:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im içeri dalıyor ve bakımımı derhal üstlenerek bana pek seçenek bırakmıyor.\n\n"B-but, you'll catch this sickness for certain!" I object between bouts of coughing.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] shrugs. "If [ROOT.Char.GetPrimarySpouse.GetFaith.PantheonTerm2] wills, then so be it."\n\nWhen some panicked servants show up, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] begins barking orders and leaves no question as to who is in charge. It certainly isn't me."

 lmf_spouse.1045.a:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] hizmetlerine teslim ol."

 lmf_spouse.1050.t:0 "Dil Sürçmesi"

 lmf_spouse.1050.desc:0 "Bunu söylemek istememiştim.\n\nİster 'yastık sohbeti' deyin, ister dikkatsizlik, hatta ister aptallık. [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im ve ben her zaman yaptığımız gibi bir akşam sohbet ediyorduk ve ağzımdan söylemek istediğimden çok daha fazlası çıktı.\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip|U] ilk başta anlamamış gibi yaptı; ama [ROOT.Char.GetPrimarySpouse.GetHerHis] gözlerindeki anlayışı görebiliyordum. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] biliyor."

 lmf_spouse.1050.a:0 "Artık yapılacak bir şey yok..."

 lmf_spouse.1050.b:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] sessizliği karşılığında [ROOT.Char.GetPrimarySpouse.GetHerHim]'e her şeyi vaat et."

 lmf_spouse.1050.c:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] hücresinden kimseye bir şey anlatamayacak!"

 spouse_promise_to_keep_secret:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] [secret|E]'i ifşa etmeyeceğine söz veriyor"

 spouse_jailed_to_keep_secret:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'ten [secret|E]'i ifşa etmemesi için zorla söz aldı"

 learned_terrible_secret:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINameNoTooltipNoFormat] hakkında [CharYouHerHim(TARGET_CHARACTER)]'i derinden üzen korkunç bir sır öğrendi."

 learned_terrible_secret_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] hakkında [CharYouHerHim(CHARACTER)]'i derinden üzen korkunç bir sır öğrendi."

 lmf_spouse.1055.t:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] Dil Sürçmesi"

 lmf_spouse.1055.desc:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in bunu söylemek istemediği açık.\n\nİster 'yastık sohbeti' deyin, ister dikkatsizlik, hatta ister aptallık. [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im ve ben her zaman yaptığımız gibi bir akşam sohbet ediyorduk ve [ROOT.Char.GetPrimarySpouse.GetSheHe] gerçekten söylememesi gereken bir şeyi ağzından kaçırdı.\n\nSonrasında [ROOT.Char.GetPrimarySpouse.GetSheHe]'in anında donup kalması, az önce söylediği şeyin tam olarak ne olduğunu bildiğini gösteriyordu... ve benden kaynaklanan bir yanlış anlama olmadığını.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] benim de bildiğimi biliyordu. Hâlâ inanmakta zorlansam bile."

 lmf_spouse.1055.a:0 "Bu beklenmedikti."

 lmf_spouse.1060.opening:0 "Canım aşkım,"

 lmf_spouse.1060.desc.start:0 "Mesafenin gönlü yakınlaştırdığını söylerler. Görünüşe göre doğruymuş; zira kalbim sana gerçekten çok bağlı.\n\nBana söylendiğine göre "

 lmf_spouse.1060.desc.army:0 "ordun çok uzaklarda bir yerde kamp kurmuş: "

 lmf_spouse.1060.desc.travel:0 "yolculukların çok uzaklara ulaştı "

 lmf_spouse.1060.desc.event:0 "artık çok uzaklardasın: "

 lmf_spouse.1060.desc.end:0 "[my_camp.GetNameNoTierNoTooltip], ve öyleyse bu mektubun sana ulaşmasını ve [ROOT.Char.GetWifeHusband]'imi neşeli ve sağlıklı bulmasını umuyorum. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönüşüne kadar seni düşüneceğim."

 lmf_spouse.1060.a:0 "Umarım [ROOT.Char.GetPrimarySpouse.GetHerHim]'i yakında görürüm."

 lmf_spouse.1065.opening:0 "Zavallı aşkım,"

 lmf_spouse.1065.desc:0 "Bu mektup sana ulaşıyorsa, rüşvet verdiğim genç asker sözünü tutmuş ve [my_imprisoner.GetTitledFirstNameNoTooltip] ([my_imprisoner.GetHerHis] adına tükürüyorum) bir şeyden habersiz demektir.\n\nHapsedildiğini öğrenir öğrenmez yazdım. Keşke bir kaçış yolu ayarlayabilseydim!\n\nNe yazık ki yapabileceğim tek şey sana teselli sözleri sunmak ve yakında serbest bırakılman için dua etmek.\n\nGüzel [ROOT.Char.GetWifeHusband]'imle yeniden bir araya gelebileceğim o anı bekleyeceğim."

 lmf_spouse.1065.a:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim] düşünceleri burada vakit geçirtir."

 lmf_spouse.1070.t:0 "Gözler Ödülde"

 lmf_spouse.1070.desc.start.lover:0 "Bu akşamki gayretin teri soğurken,"

 lmf_spouse.1070.desc.start.notlover:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bu akşam oturma odasına girerken,"

 lmf_spouse.1070.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] aklından bir şey geçtiğini hemen anlayabiliyordum. [ROOT.Char.GetPrimarySpouse.GetSheHe|U]'in gözlerinde, [ROOT.Char.GetPrimarySpouse.GetSheHe] bir şey istediğinde takındığı o bakış vardı.\n\n"I saw "

 lmf_spouse.1070.desc.jewelry:0 "en harika mücevher parçası "

 lmf_spouse.1070.desc.sword:0 "en muhteşem kılıç "

 lmf_spouse.1070.desc.book:0 "en inanılmaz kitap "

 lmf_spouse.1070.desc.manuals:0 "en dikkat çekici kılavuz dizisi "

 lmf_spouse.1070.desc.robe:0 "o kadar özenle işlenmiş inanılmaz bir cübbe "

 lmf_spouse.1070.desc.end:0 "bugün çarşıda. Onu çok istedim, elbette #EMP çok#! pahalı olsa da..."\n\nThe intention was clear: [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] wanted me to get it for [ROOT.Char.GetPrimarySpouse.GetHerHim] as a gift. In fact, before the evening was even over, [ROOT.Char.GetPrimarySpouse.GetSheHe] was practically pleading for [ROOT.Char.GetPrimarySpouse.GetHerHis] coveted prize. "Surely it's not too much to ask for, "

 lmf_spouse.1070.desc.end.lover:0 "aşkım? Bana hayransın, değil mi?""

 lmf_spouse.1070.desc.end.notlover:0 "canım [ROOT.Char.GetWifeHusband]? Bu tür lüksleri kaldırabiliriz, değil mi?""

 lmf_spouse.1070.a:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'i daha da #EMP pahalı#! bir şeyle şaşırtacağım!"

 lmf_spouse.1070.b:0 "Dayanamayıp [ROOT.Char.GetPrimarySpouse.GetHerHim]'e hediyeyi ver."

 lmf_spouse.1070.c:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe] şaka mı yapıyor? Kesinlikle hayır!"

 lmf_spouse.1075.t:0 "Ağır Hakaret"

 lmf_spouse.1075.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im öfkeden köpürerek odaya daldığında, ilk başta sebebin ben olduğumu sandım.\n\nAma hayır, meğer [ROOT.Char.GetPrimarySpouse.GetSheHe] [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_courtier'))] ile bir sürtüşme yaşamış. "

 lmf_spouse.1075.desc.relation:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('my_courtier'))] "

 lmf_spouse.1075.desc.norelation:0 "[my_courtier.GetWomanMan] "

 lmf_spouse.1075.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in kulağına gelen bir yorum yaptı; hadi buna... pek de nazik olmayan bir yorum diyelim. Bu bir yüzleşmeye, ardından bağrışmaya yol açtı; şimdi [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bana [my_courtier.GetFirstNameNoTooltip]'in [ROOT.Char.GetPrimarySpouse.GetHerHim] hakkında '[ROOT.Char.Custom('FortifiedBuilding')]'de dolaşıp yalanlar yaydığını' söylüyor.\n\nSanırım bu kaçınılmazdı; zira "

 lmf_spouse.1075.desc.commoner:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] sıradan doğumu... kimileri [ROOT.Char.GetPrimarySpouse.GetHerHim]'i araya girmiş biri olarak görecek.\n\n"

 lmf_spouse.1075.desc.rival:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] [my_courtier.GetFirstNameNoTooltip] ile süregelen düşmanlığı. Eninde sonunda doruğa çıkacaktı.\n\n"

 lmf_spouse.1075.desc.temper:0 "[my_courtier.GetFirstNamePossessiveNoTooltip] meşhur öfkesi. Eninde sonunda [my_courtier.GetHerHim]'i belaya sokacağını bilmeliydim.\n\n"

 lmf_spouse.1075.desc.end2:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] tam olarak bir şey yapmamı istemedi ama [ROOT.Char.GetPrimarySpouse.GetSheHe]'in yapmam gerektiğini düşündüğünü anlayabiliyorum."

 lmf_spouse.1075.a:0 "[my_courtier.GetFirstNameNoTooltip]'i göndereceğim. Derhal."

 lmf_spouse.1075.b:0 "[my_courtier.GetFirstNameNoTooltip] bu hakaret için ağır biçimde azarlanacak."

 lmf_spouse.1075.b.success:0 "[my_courtier.GetFirstNameNoTooltip] hakkıyla pişman"

 lmf_spouse.1075.b.failure:0 "Şimdi [my_courtier.GetFirstNameNoTooltip] ikinize de kızgın"

 reprimanded_me_unjustly_spouse:0 "[TARGET_CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetHerHisMy] eşine yapılan bir hakaret yüzünden [CHARACTER.GetShortUIName]'i haksız yere azarladı."

 reprimanded_me_unjustly__spouse_corresponding:0 "[CHARACTER.GetShortUIName|U], [CHARACTER.GetHerHisMy] eşine yapılan bir hakaret yüzünden [TARGET_CHARACTER.GetShortUIName]'i haksız yere azarladı."

 lmf_spouse.1075.c:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] buna alışmak zorunda kalacak."

 lmf_spouse.1080.t:0 "Daima Yanımda"

 lmf_spouse.1080.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im son günlerde hep yanımda.\n\nYa birlikte yataktayız, ya bahçelerde birlikte yürüyoruz, ya sarayda birlikteyiz... [ROOT.Char.GetPrimarySpouse.GetSheHe]'in [ROOT.Char.Custom('FortifiedBuilding')]'imin [ROOT.Char.GetPrimarySpouse.GetLadyLord]'i olarak yeterince işi olduğunu düşünürdüm; ama belli ki öyle değil, zira neredeyse her an birlikteyiz.\n\nBeni yanlış anlamayın, birlikte geçirdiğimiz zamandan büyük keyif alıyorum. Mesele şu ki [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip], [ROOT.Char.GetTitleAsNameNoTooltip] olarak kendi görevlerimden epey alıkoyuyor.\n\nElbette bunu [ROOT.Char.GetPrimarySpouse.GetHerHim]'e asla söylemem; ama bu böyle sürerse söylemek zorunda kalabilirim; yoksa [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'e olan dikkatim zarar görecek."

 lmf_spouse.1080.a:0 "Ne olmuş? Bu oyalanmayı seviyorum."

 lmf_spouse.1080.b:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'i gönder. Görevlerime odaklanmam gerekiyor."

 lmf_spouse.1085.t:0 "Bahçede Bir Gün"

 lmf_spouse.1085.desc.courtier:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im sarayımın bir parçası olsa da, günü birlikte geçirmemiz pek sık olmuyor.\n\n"

 lmf_spouse.1085.desc.ruler:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin [ROOT.Char.GetPrimarySpouse.GetHerHis] yöneteceği kendi sarayı olduğundan, günü birlikte geçirmemiz pek sık olmuyor.\n\n"

 lmf_spouse.1085.desc.start:0 "Ne var ki bugün, çoğu gün gibi değildi. [ROOT.Char.Custom('FortifiedBuilding')]'de bir kez olsun sessizlik vardı ve sarayın çoğu önemsiz meselelerle meşguldü. "

 lmf_spouse.1085.mid.courtier:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] sessizce yanıma geldi. "

 lmf_spouse.1085.mid.ruler:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] hiç yoktan belirdi - [ROOT.Char.GetPrimarySpouse.GetSheHe]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de olduğunu bilmiyordum bile! "

 lmf_spouse.1085.desc.mid:0 ""I know just the place we can be alone," [ROOT.Char.GetPrimarySpouse.GetSheHe] whispered.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] took me deep into the gardens, and though I looked around for the groundskeepers, I saw none.\n\n"I sent them away," [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] said.\n\nHow [ROOT.Char.GetPrimarySpouse.GetSheHe] managed such a feat, I didn't ask and didn't care, as the day that followed is one neither of us is likely to soon forget."

 lmf_spouse.1085.a:0 "O bahçeyi #EMP gerçekten#! seviyorum."

 lmf_spouse.1090.t:0 "Kamp'ta Çalınmış Bir An"

 lmf_spouse.1090.desc:0 "Uzun bir günün ardından ordu [army_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de kamp kurmuştu. Geç olmuştu; askerlerin ve [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ların çoğu çoktan çadırlarına çekilmişti; ben de az sonra onlara katılacaktım.\n\nDerken [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im beliriverdi; sanki hiç yoktan; [ROOT.Char.GetPrimarySpouse.GetSheHe] [ROOT.Char.GetPrimarySpouse.GetHerHis] miğferini çıkardığında yüzündeki muzip sırıtış görünüyordu. "Come with me," [ROOT.Char.GetPrimarySpouse.GetSheHe] said.\n\nFor a moment, I thought something might be amiss. When [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] led me to a more secluded part of the camp and began to remove [ROOT.Char.GetPrimarySpouse.GetHerHis] armor, I knew that was very much #EMP not#! the case.\n\n"The soldiers might see us," I warned with a chuckle.\n\n"See what? A [ROOT.Char.GetPrimarySpouse.GetWomanMan] who loves and adores [ROOT.Char.GetPrimarySpouse.GetHerHis] [ROOT.Char.GetWifeHusband]? Why should they care?" With that, my resistance crumbled, and it's a good thing it did."

 lmf_spouse.1090.a:0 "Kampın bu kadar eğlenceli olabileceğini kim bilirdi?"

 lmf_spouse.1095.t:0 "Kırık Çark"

 lmf_spouse.1095.desc.start:0 "Vagonlardan birinin tekerleği kırılmış, diyorlar; yolculuğumuz için büyük bir gecikme anlamına gelmeyecekti; ama yine de başkalarının bir şeyleri tamir etmesini bekleyerek epey ayakta dikilmek demekti.\n\nDerken, hiç yoktan, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im arkamda beliriverdi. "I have an idea," [ROOT.Char.GetPrimarySpouse.GetSheHe] said with a wink.\n\nI wasn't certain what [ROOT.Char.GetPrimarySpouse.GetSheHe] meant until I spotted the basket and blanket on [ROOT.Char.GetPrimarySpouse.GetHerHis] arm. I let [ROOT.Char.GetPrimarySpouse.GetHerHim] lead me to a secluded spot nearby, away from the prying eyes of our entourage, and after laying down the blanket [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] began to remove [ROOT.Char.GetPrimarySpouse.GetHerHis] clothes.\n\n"

 lmf_spouse.1095.desc.cold:0 ""A little cold for that here, isn't it?" I laughed.\n\n"Not if you're next to me," [ROOT.Char.GetPrimarySpouse.GetSheHe] smiled. "

 lmf_spouse.1095.desc.sand:0 ""Careful you don't get sand into... places," I laughed.\n\n"I'll need you to check," [ROOT.Char.GetPrimarySpouse.GetSheHe] smiled. "

 lmf_spouse.1095.desc.bugs:0 ""Not worried about the insects, I see," I laughed.\n\n"Not if you're next to me," [ROOT.Char.GetPrimarySpouse.GetSheHe] smiled. "

 lmf_spouse.1095.desc.default:0 ""You know, anyone could come by and see us," I laughed.\n\n"Then they'll get quite the show," [ROOT.Char.GetPrimarySpouse.GetSheHe] smiled. "

 lmf_spouse.1095.desc.end:0 "Bu, reddedemeyeceğim bir teklif oldu."

 lmf_spouse.1095.a:0 "Seyahat etmeyi #EMP gerçekten#! seviyorum."

 lmf_spouse.1100.t:0 "Güvenilmez [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U] mi?"

 lmf_spouse.1100.desc:0 "Doğru olabilir mi?\n\n[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin yakın zamanda [my_rival.GetTitledFirstNameNoTooltip] ile temasa geçtiğine dair raporlar aldım. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] neden benim bir rakibime mektup yazsın, hiçbir fikrim yok. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] elbette bunu yaptığını reddediyor; meseleyi daha yakından araştırtmaya çalıştıysam da her şeyin bir söylenti olması çok mümkün... [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in öne sürdüğüne göre, bu söylentiyi kuşkusuz [ROOT.Char.GetPrimarySpouse.GetHerHis] iyi adını lekelemek isteyen biri yaymış. Gerçeği doğrulamanın yolu olmadığından, [ROOT.Char.GetPrimarySpouse.GetHerHis] sözüne güvenmekten başka çarem yok; ama bu beni içten içe yiyor.\n\n#EMP Bir şeylerin#! doğru olmadığını #EMP biliyorum#!. Ortada bir tür dolaplar dönüyor."

 lmf_spouse.1100.a:0 "Umarım bir şey çıkmaz."

 lmf_spouse.1101.opening:0 "Sevgilim [lover.Custom2('GreetingToGenericPositive', ROOT.Char )],"

 lmf_spouse.1101.stranger:0 "Benim kim olduğum önemli değil; ama "

 lmf_spouse.1101.start:0 "Sende [player_rival.GetTitledFirstName] hakkında çok ilgini çekebilecek bazı bilgiler var, zira seninle [player_rival.GetSheHe]'in rakip olduğunuz herkesçe biliniyor.\n\nKarşılığında istediğim tek şey, zahmetim için küçük bir miktar altın ve beni asla anmaman: "

 lmf_spouse.1101.know:0 "bu, sevgilin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('lover'))|l]'den geldi."

 lmf_spouse.1101.stranger2:0 "bu bilgiyi aldığın kişi."

 lmf_spouse.1101.a:0 "[player_rival.GetTitledFirstNameNoTooltip]'in bir sırrı mı var? Evet, lütfen!"

 lmf_spouse.1101.b:0 "Bununla ilgim yok. Defol."

 lmf_spouse.1105.t:0 "Geçen Bir Gölge"

 lmf_spouse.1105.desc.start:0 "Sevgili [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im hasta.\n\n"

 lmf_spouse.1105.desc.courtier:0 "Az önce [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'i görmek için yatak odamıza uğradım; [ROOT.Char.GetPrimarySpouse.GetSheHe] ateşin etkisiyle sayıklıyordu. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] defalarca adımı inledi ve [ROOT.Char.GetPrimarySpouse.GetSheHe] beni fark ettiği anda umutsuz bir el uzatıp yaklaşmam için yalvardı.\n\nElbette kalamadım; şimdi ise kalmam gerekir miydi diye düşünüyorum.\n\n"

 lmf_spouse.1105.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'in orada yattığını, belki de ölmek üzere olduğunu düşünmek acı veriyor; [ROOT.Char.GetPrimarySpouse.GetSheHe] uyanık ve ayıkken ise ben hiçbir yerde görünmüyorum. [ROOT.Char.GetPrimarySpouse.GetSheHe] bunu atlatırsa ve en çok ihtiyaç duyduğu anda yanında olmadıysam, [ROOT.Char.GetPrimarySpouse.GetSheHe] bilecek."

 lmf_spouse.1105.a:0 "Elbette [ROOT.Char.GetPrimarySpouse.GetHerHis] başucunda kalacağım!"

 lmf_spouse.1105.c:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] hekimimizden uygun tedavi görecek."

 lmf_spouse.1115.t:0 "Aşk ve Nefret"

 lmf_spouse.1115.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bana kızgın.\n\nYa da belki [ROOT.Char.GetPrimarySpouse.GetSheHe] benden hoşlanmamaya, hatta nefret etmeye başladı. Her neyse, son aylarda [ROOT.Char.GetPrimarySpouse.GetHerHim]'i nadiren görüyorum. Karşılaştığımız zamanlarda [ROOT.Char.GetPrimarySpouse.GetSheHe] mesafeli ve bazen soğuk.\n\nBunun geçmesi mümkün, doğru. Ya da belki bu, sevgi dolu ilişkimizin sonunun başlangıcı... evliliğimizin sonu değilse bile."

 lmf_spouse.1115.a:0 "Olması kaçınılmazdı, doğrusu."

 lmf_spouse.1120.t:0 "O Kadar Benzer"

 lmf_spouse.1120.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle birbirimize çok benzediğimiz söylendi bana.\n\nDoğru olduğunu kabul ediyorum. "

 lmf_spouse.1120.desc.low:0 "Belki dedikoducuların iddia ettiği kadar benzemiyoruz; ama anlaştığımız konuların, ayrı düştüklerimizden fazla olduğu haklı olarak söylenebilir... ve evli bir çift için bu, küçümsenecek bir başarı değil.\n\n"

 lmf_spouse.1120.desc.mid:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] çoğu zaman cümlelerimi tamamlar, ben de [ROOT.Char.GetPrimarySpouse.GetHersHis]'ini; ve ben de [ROOT.Char.GetPrimarySpouse.GetSheHe]'in hemen her konuda ne hissedeceğini çoğu zaman önceden tahmin edebiliyorum. Evli bir çift için bu hiç de küçümsenecek bir başarı değil.\n\n"

 lmf_spouse.1120.desc.high:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] cümlelerimi tamamlıyor, her arzumu önceden seziyor ve neredeyse hiçbir konuda anlaşmazlık yaşamıyoruz. En azından son zamanlarda. Dedikoducuların doğru bildiği nadir konulardan biri bu; evli bir çift için hiç de küçümsenecek bir başarı değil.\n\n"

 lmf_spouse.1120.desc.end:0 "Bu, her zaman anlaşacağımız anlamına gelmiyor, elbette; ama son zamanlarda bu aşinalık, hoşuma giden bir rahatlık sağladı. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] yakın zamanda [ROOT.Char.Custom('FortifiedBuilding')]'e döndüğümde beni avluda karşıladı ve [ROOT.Char.GetPrimarySpouse.GetSheHe]'in bana lütfettiği içten gülümseme, benimkinin de kolayca karşılık vermesini sağladı.\n\nŞimdilik? İyi."

 lmf_spouse.1120.a:0 "Ah, evlilik hayatı!"

 lmf_spouse.1125.t:0 "Ortak Bir Şey"

 lmf_spouse.1125.desc.diplomat:0 "Sarayda çok hassas bir diplomatik meseleyle ilgili bir soruyu yanıtlamak üzereyim... ama daha konuşmadan, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im soruyu benim yerime yanıtlıyor. "Apologies, dear [ROOT.Char.GetWifeHusband]," [ROOT.Char.GetPrimarySpouse.GetSheHe] says to me with a wink. Truthfully, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] answered the question better than I could have and saved me some trouble in the process.\n\nThe benefit of having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] as equally versed in diplomatic manners as I myself am."

 lmf_spouse.1125.desc.reveler:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [ROOT.Char.Custom('FortifiedBuilding')]'de birkaç küçük asilzadeyi ağırlıyorum; gerçek güç sahibi olmaktan çok idare edilmesi gereken küçük belalar. Saat geç olmasına rağmen hâlâ gitmiyorlar. Odaya [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imden başkası mı girecek... duruma bir bakıp gülümsüyor ve işi devralıyor. Kısa süre içinde ortamın neşesi geri geliyor ve asilzadeler, böylesine güzel bir eğlenceden memnun bir halde yavaşça uğurlanıyor.\n\nBenim kadar eğlenceye düşkün bir [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'e sahip olmanın faydası."

 lmf_spouse.1125.desc.blademaster:0 "Bir öğleden sonra kılıç talimi yaparken kaslarım ağrıyor. Formlara hâkim olmak, kılıçtaki yeteneğimin paslanmamasını sağlamak kolay değil.\n\nPeki karşımda, elinde kılıç, beni düelloya davet etmeye hazır kim beliriveriyor? Bana benimkiyle eşit rahat bir gülümseme veren [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im. "Are you ready, dear [ROOT.Char.GetWifeHusband]? You're looking a little sloppy today, and we should correct that." [ROOT.Char.GetPrimarySpouse.GetHerHis|U] cockiness makes me laugh.\n\nThis is the benefit, I suppose, of having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] whose interest in swordsmanship matches mine."

 lmf_spouse.1125.desc.hunter:0 "Günü, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [ROOT.Char.Custom('FortifiedBuilding')] yakınlarındaki küçük bir ormanda küçük bir avla geçirdik. Yormasız bir işti; her ne kadar avımız sinir bozucu biçimde ele avuca sığmasa da. Saat geçtikçe saraylılarım yorulup huysuzlaşmaya başlıyor... bu, #EMP beni#! bile huysuzlaştırmaya yetiyor.\n\nO sırada yanıma yaklaşıp bana hevesli bir gülümseme fırlatan kim olabilir? [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im, elbette. "We should send the others home, dear [ROOT.Char.GetWifeHusband], and finish this hunt ourselves." It's enough to draw a laugh out of me.\n\nThis is the benefit, I think, of having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] who shares my love of the hunt."

 lmf_spouse.1125.desc.strategist:0 "Geç oldu. [ROOT.Char.Custom('FortifiedBuilding')]'de en kıdemli komutanlarımdan birini ağırlıyorum; ama akşam, çok çok uzaktaki bir yerde yaşanmış eski bir savaş hakkında uzayan bir tartışmaya dönüştü.\n\nBen o generalin tek seçeneğinin bu olduğunu söylüyorum. O ise daha iyisini yapabileceğine inandığını, ama tam olarak nasıl yapacağı konusunda can sıkıcı biçimde muğlak konuşuyor. Öfkemin büyüyüşü, ta ki [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bir anda yoktan belirene dek sürüyor. "Have either of you considered an alternative?" Before long, [ROOT.Char.GetPrimarySpouse.GetSheHe]'s joined our conversation and turned it into something actually interesting... and gives me a knowing wink, aware of exactly what [ROOT.Char.GetPrimarySpouse.GetSheHe]'s done.\n\nThe benefit, I suppose, of having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] whose knowledge of strategy rivals my own."

 lmf_spouse.1125.desc.architect:0 "Geç oldu. [ROOT.Char.Custom('FortifiedBuilding')]'in çoğu uykuya daldı; peki ben ne yapıyorum? [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de yeni bir [ROOT.Char.GetFaith.HouseOfWorship] için planların üzerinde çalışıyorum; bir ayarlama üstüne bir ayarlama yapıyorum, yine de, can sıkıcı biçimde, bütünüyle tatminsizim.\n\nBirden [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im arkadan yaklaşıyor. Geriliyorum; [ROOT.Char.GetPrimarySpouse.GetSheHe]'in beni yatmaya göndereceğini düşünüyorum; ama bunun yerine [ROOT.Char.GetPrimarySpouse.GetSheHe] planların bir bölümünü işaret ediyor. "Have you considered making this its own enclosure, dear [ROOT.Char.GetWifeHusband]? It's throwing off the balance entirely." Before long, we've solved my issue and hashed out a plan I'm actually satisfied with, and at #EMP last#! I can sleep.\n\nThis, I suppose, is the benefit of having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] whose interest in architecture matches my own."

 lmf_spouse.1125.desc.intrigue:0 "Geç oldu. Danışmanlarımla karanlık bir iş hakkında konuşuyorum... hiç gerçekleşmeyebilecek bir plan; ama gerektiğinde hazır olmak istiyoruz.\n\nNe yazık ki bir yere varamıyoruz. Tartışma defalarca aynı yerde dönüp duruyor; şu an gözlerimi ovuşturup her şeyi çöpe atmayı düşünüyorum.\n\nBirden [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im gölgelerin arasından beliriyor; elinde bir mum ve bana yumuşak bir gülümseme uzatıyor. "Have you considered, dear [ROOT.Char.GetWifeHusband], that there are far easier ways to accomplish what you want?" I wasn't aware [ROOT.Char.GetPrimarySpouse.GetSheHe]'d been listening in, but of course I should have realized [ROOT.Char.GetPrimarySpouse.GetHerHis] input would be invaluable, as it's not long before a new plan is drawn up and everyone agrees it's quite good. If rather grim. I'm relieved.\n\nA benefit, I suppose, in having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] whose skill at intrigue rivals my own." 

 lmf_spouse.1125.desc.celibate:0 "Bekârlık kolay bir iş değil.\n\n[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin yeminime ortak olması ne büyük şans. Birbirimizden beklentimiz yok ve etin arzuları söz konusu olduğunda birlikte birbirimizin zayıf anlarını destekleyebiliyoruz. Görünüşe göre o evreyi aştık; her ne kadar bunu pek az evli çift anlayabilse de."

 lmf_spouse.1125.desc.learning:0 "Son zamanlarda, düşünceleri üslubu kadar karmaşık olan kadim bir filozofun epey yoğun bir cildini okuyorum. Baş ağrısı veriyor ve bütününü anlamakta zorlanıyorum... çok istememe rağmen.\n\nO halde tavsiye için [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'ime başvurmak basit bir mesele. "Oh yes, I believe I've read that one," [ROOT.Char.GetPrimarySpouse.GetSheHe] nods, and is all too happy to explain it in a way that suddenly makes it all so obvious. I'm so delighted I could kiss [ROOT.Char.GetPrimarySpouse.GetHerHim]!\n\nA side benefit, I suppose, of having a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] as equally learned as I."

 lmf_spouse.1125.desc.family:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle bir akşam geç saatlere kadar oturup oldukça hassas aile meselelerini konuşuyoruz.\n\nÇözmesi kolay bir iş değil ve ikimiz de tutumumuzdan taviz vermeye yanaşmıyoruz. Yine de aklıma geliyor: bu çekişmenin bir kolaylığı da var... ikimiz de aynı şeyi istediğimiz için kimse üzülmüyor ya da kişisel algılamıyor. Aileyi her şeyin önüne koyuyoruz. [ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] gözlerinin içine bakıyorum; [ROOT.Char.GetPrimarySpouse.GetSheHe] gülümseyerek karşılık verdiğinde bunun doğru olduğunu görüyorum.\n\nAilemizin [ROOT.Char.Custom('MatriarchPatriarch')]'i bensem, [ROOT.Char.GetPrimarySpouse.GetSheHe] de onun [ROOT.Char.GetPrimarySpouse.Custom('MatriarchPatriarch')]'i; ve işler böyle, böyle de olmalı."

 lmf_spouse.1125.desc.sadistic:0 "[ROOT.Char.Custom('FortifiedBuilding')]'in zindanındayım; muhafızlarımın nihayet yakaladığı oldukça ele avuca sığmaz bir haydudu sorguluyorum. Yoldaşları hakkında ondan almam gereken bilgiler var; ama şimdiye dek üç kez yüzüme tükürdü... o yüzden itiraf edeyim, onu sadece pişman etme isteği duyuyorum.\n\n"Are you going to let this simpleton disrespect you so, dear [ROOT.Char.GetWifeHusband]?" my [ROOT.Char.GetPrimarySpouse.GetWifeHusband] says suddenly as [ROOT.Char.GetPrimarySpouse.GetSheHe] appears by my side. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] gives me a mischievous wink as [ROOT.Char.GetPrimarySpouse.GetSheHe] turns [ROOT.Char.GetPrimarySpouse.GetHerHis] attention back to the brigand. "Because I can think of a few ways to make him talk #EMP and#! make him pay."\n\nAhh, to have a [ROOT.Char.GetPrimarySpouse.GetWifeHusband] whose interests so match my own."

 lmf_spouse.1125.desc.lunatic:0 "Geç oldu. Karanlık.\n\nBen... [ROOT.Char.Custom('FortifiedBuilding')]'in koridorlarından birinde miyim? Ve ellerimde kan mı var?\n\nZihnim deli gibi çalışıyor. #EMP Ne yaptım ben?#! Yine mi oldu?\n\nSonra arkamdan bir kıkırdama duyuyorum. Dönüyorum; ama bana sırıtan [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imden başkası değil. [ROOT.Char.GetPrimarySpouse.GetHerHis] gözlerinde bir parıltı var; şöyle diyor:"Off having fun without me, dear [ROOT.Char.GetWifeHusband]? Well, let's get you cleaned up, shall we?" Before long, I'm in a bath and [ROOT.Char.GetPrimarySpouse.GetSheHe]'s made everything feel better again.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe]'s so good to me. I hope I can do the same for [ROOT.Char.GetPrimarySpouse.GetHerHim] one night."

 lmf_spouse.1125.a:0 "Evlilikler böyle ayakta kalır."

 lmf_spouse.1130.t:0 "Farklılıklarımız"

 lmf_spouse.1130.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramızda iyi bir hafta olmadı.\n\nDoğrusu, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in en iyi zamanlarda bile tartışma başlatması için fazla bir şey gerekmiyor. Oldukça farklıyız; [ROOT.Char.GetPrimarySpouse.GetHerHim]'i en çok kızdıran şey, onun epey [their_trait.GetNameNoTooltip( ROOT.Char )|l] benimse daha çok [my_trait.GetNameNoTooltip( ROOT.Char )|l] olduğum yönündeki yaygın algı... büyük ölçüde doğru olsa bile.\n\nBu sefer, haftayı birbirimizin sinirlerini bozmakla geçirdik. [ROOT.Char.GetPrimarySpouse.GetHerHis] [ROOT.Char.Custom('FortifiedBuilding')] hizmetkârlarına verdiği emirlerin birkaçını çelişkiyle karşıladım; o ise saraydaki zamanını, her beyanıma görünür biçimde kaş çatıp göz devirerek geçirdi. Koridorlarda her karşılaşmamız bir savaştı; o yüzden olabildiğince az karşılaşmaya çalıştık.\n\nHiç kolay değil."

 lmf_spouse.1130.a:0 "#EMP Of.#!"

 lmf_spouse.1135.t:0 "Sergileniyor"

 lmf_spouse.1135.desc.start:0 "Her şey soğuk bir sessizlikle başladı.\n\nDanışmanlarımla konuşurken [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im masada oturmuş, kollarını kavuşturmuş bana dik dik bakıyordu. Ne olduğunu sormaya niyetim yoktu, diğerlerinin önünde; o yüzden [ROOT.Char.GetPrimarySpouse.GetHerHim]'i görmezden geldim. Bu, elbette, işleri daha da kötüleştirdi.\n\nYirmi dakika öfkesiyle kaynadıktan sonra [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] birden bana yönelik bir eleştiriye girişti - toplantıyı böldü - ve hepsi de konsey işleriyle hiç ilgisi olmayan şeylere dayanıyordu. Çok geçmeden ikimiz bağrışıyorduk; diğer danışmanlar bu gösteriye tanıklık ederken koltuklarında tuhaf bir kıvranışla. Sonunda [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im ayağa kalkıp odadan çıkıp gitti.\n\n"

 lmf_spouse.1135.desc.unfaithful:0 "Kuşkusuz [ROOT.Char.GetPrimarySpouse.GetSheHe] sadakatsizliğime hâlâ kızgın; [ROOT.Char.GetPrimarySpouse.GetSheHe] söylemeyi reddetse bile. "

 lmf_spouse.1135.desc.revenge:0 "Kuşkusuz [ROOT.Char.GetPrimarySpouse.GetSheHe] bana hâlâ kudurmuş durumda ve intikam istiyor; [ROOT.Char.GetPrimarySpouse.GetSheHe] bunun böyle olduğunu söylemeyi reddetse bile. "

 lmf_spouse.1135.desc.rival:0 "Bu yeni bir şey değil, elbette. İlişkimizin bu noktasında [ROOT.Char.GetPrimarySpouse.GetSheHe] ile ben pratikte düşman sayılabiliriz. "

 lmf_spouse.1135.desc.hate:0 "Bu kadar zaman sonra, [ROOT.Char.GetPrimarySpouse.GetSheHe]'in benden nefret ettiğini rahatlıkla söyleyebilirim. Belki de [ROOT.Char.GetPrimarySpouse.GetHerHim]'i suçlayamam. "

 lmf_spouse.1135.desc.friend:0 "Bu [ROOT.Char.GetPrimarySpouse.GetHerHim]'e pek benzemiyor; normalde ikimiz dostuz. Sanırım dostların bile bazen kavga etmesi gerekir. "

 lmf_spouse.1135.desc.lover:0 "Bunun [ROOT.Char.GetPrimarySpouse.GetSheHe]'in beni sevmediği anlamına gelmediğini biliyorum; tıpkı benim [ROOT.Char.GetPrimarySpouse.GetHerHim]'i sevdiğim gibi. Yine de bazen kavga etmeyeceğimiz anlamına gelmiyor, can yaksa da. "

 lmf_spouse.1135.desc.soulmate:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe]'in ruh eşim olduğunu biliyorum ve ben de [ROOT.Char.GetPrimarySpouse.GetHersHis]'i... ama böyle bir günde hatırlamak güç. "

 lmf_spouse.1135.desc.like:0 "Doğrusu biraz şaşırdım. İkimizin epey iyi anlaşmaya başladığını sanıyordum. "

 lmf_spouse.1135.desc.end:0 "O günden beri [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'ten kaçındım; ama sanırım eninde sonunda [ROOT.Char.GetPrimarySpouse.GetHerHim]'i görüp arayı düzeltmeye çalışmam gerekecek."

 lmf_spouse.1135.a:0 "Tabii [ROOT.Char.GetPrimarySpouse.GetSheHe] izin verirse."

 lmf_spouse.1140.t:0 "Hoş Bir Eve Dönüş"

 lmf_spouse.1140.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den pek uzak olmayan bir kasabaya yaptığım kısa geziden döndüğümde [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im beni [ROOT.Char.Custom('FortifiedBuilding')] avlusunda bekliyordu. "

 lmf_spouse.1140.desc.ruler:0 "Bir sürpriz; zira [ROOT.Char.GetPrimarySpouse.GetSheHe]'in hâlâ [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de olduğunu sanıyordum.\n\n"

 lmf_spouse.1140.desc.default:0 "Bir sürpriz; zira bu [ROOT.Char.GetPrimarySpouse.GetHerHis] alışılmış tarzı değil.\n\n"

 lmf_spouse.1140.desc.unfaithful:0 "Bir kez daha soğuk bir karşılama bekleyerek gerildim... [ROOT.Char.GetPrimarySpouse.GetSheHe] sadakatsizliğimi öğrendiğinden beri hepsi böyleydi. Ama hayır, bunun yerine o "

 lmf_spouse.1140.desc.revenge:0 "Bunun bana yönelik bir öfke gösterisi daha mı olacağını merak ederek gerildim. [ROOT.Char.GetPrimarySpouse.GetHerHis|U] intikam arzusu ne de olsa hâlâ sürüyor. Ama hayır, bunun yerine o "

 lmf_spouse.1140.desc.rival:0 "Bir kez daha sivri sözler ve yakan bakışlar için fazlasıyla yorgun, gerildim. Rakibimi değil, yatağımı istiyordum. Ama hayır, bunun yerine o "

 lmf_spouse.1140.desc.hate:0 "Bana pek değer vermediğini bildiğim bir [ROOT.Char.GetPrimarySpouse.GetWomanMan]'den bir kez daha soğuk bir karşılama hayal ederek gerildim. Ama hayır, bunun yerine o "

 lmf_spouse.1140.desc.friend:0 "Her zaman aynı fikirde olmasak da dost saydığım [ROOT.Char.GetPrimarySpouse.GetWomanMan]'i gördüğüme memnun, sırıttım. O "

 lmf_spouse.1140.desc.lover:0 "Öyle çok sevdiğim [ROOT.Char.GetPrimarySpouse.GetWomanMan]'i gördüğüme memnun, sırıttım. Keşke her [ROOT.Char.GetWifeHusband] benim kadar şanslı olabilseydi! O "

 lmf_spouse.1140.desc.soulmate:0 "Ruh eşim saydığım, karşıtım olduğu kadar dengim olan [ROOT.Char.GetPrimarySpouse.GetWomanMan]'i gördüğüme memnun, sırıttım. O "

 lmf_spouse.1140.desc.like:0 "Ne tür bir karşılama görebileceğimi merak ederek durakladım. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] çoğu zaman varlığıma kayıtsız görünür, kimi zaman soğuk bile. Ama bugün o "

 lmf_spouse.1140.desc.end:0 "bana başını salladı ve hizmetkârlara yolculuk pelerinimi almamalarını söyledi. "It's good to see you return, [ROOT.Char.GetPrimarySpouse.Custom2('spoken_address_by_familiarity', ROOT.Char )]."\n\n"Was I gone so very long?" I joked.\n\n"Long enough to be missed." [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] walked me back to the keep and we fell into an easy stride as she recounted the events of the day. "

 lmf_spouse.1140.desc.end.poor:0 "Değişiklik olsun diye güzeldi. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] sıcaktı ve kendimi, keşke daha sık böyle olabilse diye düşünürken buldum."

 lmf_spouse.1140.desc.end.good:0 "Her zamanki gibi güzeldi. [ROOT.Char.GetPrimarySpouse.GetHerHim]'in her zamanki gibi yanımda olmasına şükrediyorum."

 lmf_spouse.1140.a:0 "Bunun ihtimali ne, acaba?"

 lmf_spouse.1140.b:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'i bir gün kaybedersem ne yapacağım?"

 lmf_spouse.1145.t:0 "Ortak Dostumuz"

 lmf_spouse.1145.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('mutual_friend'))]'in birlikte vakit geçirdiklerini duyduğumda ne düşüneceğimi bilemedim. İkisinin dostane ilişkiler içinde olduğunu elbette biliyordum; tıpkı [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('mutual_friend'))] ile benim aramdaki gibi; ama ne yaptıklarını hayal edemiyordum.\n\nBunun ne olduğunu ancak sonradan öğrendim: "

 lmf_spouse.1145.desc.relation:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('mutual_friend'))]'im "

 lmf_spouse.1145.desc.norelation:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('mutual_friend'))] "

 lmf_spouse.1145.desc.mid:0 "tüm zamanı beni [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'e öve öve satmaya çalışmakla geçirmişti.\n\n Neden mi? Sanırım [mutual_friend.GetSheHe] şöyle düşünüyordu: "

 lmf_spouse.1145.desc.rival:0 "sanırım [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramızı düzeltmeli ve karşılıklı düşmanlığımıza son vermeliyiz.\n\n"

 lmf_spouse.1145.desc.revenge:0 "sanırım [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im beni affetmeli. [mutual_friend.GetSheHe|U] daha önce de aynısını söylemişti.\n\n"

 lmf_spouse.1145.desc.hate:0 "Sanırım [ROOT.Char.GetPrimarySpouse.GetHerHis] benden hoşlanmaması işleri daha da zorlaştırıyordu. [mutual_friend.GetSheHe|U] daha önce de aynen bunu söylemişti.\n\n"

 lmf_spouse.1145.desc.like:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe] beni daha iyi tanımaya çalışmalı. Ne de olsa dost olmasak da yeterince samimiyiz. Gerçi karı kocaların pek azı dost olur, öyle değil mi?\n\n"

 lmf_spouse.1145.desc.neutral:0 "Sanırım [ROOT.Char.GetPrimarySpouse.GetSheHe] [ROOT.Char.GetPrimarySpouse.GetHerHis] kararsızlığını aşıp bana bir şans vermeli.\n\n"

 lmf_spouse.1145.desc.end:0 "Hayal bile edemeyeceğim şey, [mutual_friend.GetSheHe]'in başarılı olmasıydı. [mutual_friend.GetSheHe] ne dediyse, [ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] tavrı son birkaç haftada belirgin biçimde değişti. Bundan bir şey çıkıp çıkmayacağını göreceğiz."

 lmf_spouse.1145.a:0 "Hoş bir değişiklik."

 talked_up_by_friend:0 "[TARGET_CHARACTER.GetShortUINamePossessiveNoFormat|U] [CHARACTER.GetShortUINameNoFormat] hakkındaki görüşü, ortak bir dostla yapılan bir konuşmanın ardından büyük ölçüde düzeldi."

 talked_up_by_friend_corresponding:0 "[CHARACTER.GetShortUINamePossessiveNoFormat|U] [TARGET_CHARACTER.GetShortUINameNoFormat] hakkındaki görüşü, ortak bir dostla yapılan bir konuşmanın ardından büyük ölçüde düzeldi."

 lmf_spouse.1150.t:0 "Açığı Kapamak"

 lmf_spouse.1150.desc.start:0 "İtiraf edeyim: Son zamanlarda stresliyim. Ve [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin bunu fark ettiği açık. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] son zamanlarda hayatımı kolaylaştırmak için [ROOT.Char.GetPrimarySpouse.GetHerHis] yolundan çıkıyor.\n\n"

 lmf_spouse.1150.diligent:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] saraya gelenlerle görüşüp küçük meselelerin onun yerine daha alt kademedeki biri tarafından halledilmesini sağlıyor. [ROOT.Char.GetPrimarySpouse.GetSheHe] hizmetkârlarla konuşup endişelerini yatıştırıyor, ben fazla kısa kesince talimatlarımı açıklıyor. [ROOT.Char.GetPrimarySpouse.GetSheHe] danışmanların beni en önemli meseleler dışında rahatsız etmesini engelliyor.\n\n"

 lmf_spouse.1150.dominant:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] bir gece çalışma odamın kapısında belirdi, beni uzun uzun süzdü ve sonra şöyle dedi,"Alright, that's quite enough of that."\n\n"What do you mean by that?" I asked, startled.\n\n"You need to delegate, dear [ROOT.Char.GetWifeHusband], and you can start by delegating to me. Allow me to take some of your burden, here in the [ROOT.Char.Custom('FortifiedBuilding')] and at court." Then, without waiting for my agreement, that's precisely what [ROOT.Char.GetPrimarySpouse.GetSheHe] proceeded to do.\n\n"

 lmf_spouse.1150.compassionate:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] bir gece çalışma odamın kapısında belirdi, bana acıyan bir bakış attı ve sonra şöyle dedi,"You cannot keep doing this, [ROOT.Char.GetWifeHusband]."\n\n"What choice do I have?"\n\n"You can delegate. To me, for instance. There is much I could take off your plate, and I'm willing to do so." While I was reluctant, I had to admit [ROOT.Char.GetPrimarySpouse.GetSheHe] was right...so that's what [ROOT.Char.GetPrimarySpouse.GetSheHe] proceeded to do.\n\n"

 lmf_spouse.1150.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe]'in yaptığı, benim habersiz olduğum çok daha fazla şey olduğundan hiç şüphem yok; hepsi benim stresimi azaltmak için... elbette kendininkiler pahasına."

 lmf_spouse.1150.a:0 "Çok minnettarım."

 lmf_spouse.1155.t:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis|U] Aklının Sonunda"

 lmf_spouse.1155.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im son zamanlarda [ROOT.Char.GetPrimarySpouse.GetHerHis] saray görevlerini yerine getirmekte zorlanıyor.\n\n"

 lmf_spouse.1155.submissive:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] hiçbir zaman çok girişken olmadı ve anladığım kadarıyla [ROOT.Char.GetPrimarySpouse.GetSheHe], saraylılarımızın pek çoğunun [ROOT.Char.GetPrimarySpouse.GetHerHim]'in üstünden geçmesine izin veriyor; iyi huyluluğunu istismar ederek birçok görevden kaçmalarına göz yumuyor... ki [ROOT.Char.GetPrimarySpouse.GetSheHe] daha sonra elbette bu görevleri [ROOT.Char.GetPrimarySpouse.GetHerselfHimself] üstlenmek zorunda kalıyor.\n\n"

 lmf_spouse.1155.introvert:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] hiçbir zaman sosyal bir yaratık olmadı. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] yalnızken ve burnu kitaptayken çok daha mutlu. Oysa [ROOT.Char.Custom('FortifiedBuilding')]'in [ROOT.Char.GetPrimarySpouse.GetLadyLord]'i olarak yaşam, [ROOT.Char.GetPrimarySpouse.GetHerHim]'in saraylılar ve soylularla aktif biçimde ilgilenmesini gerektiriyor; üstelik [ROOT.Char.GetPrimarySpouse.GetSheHe]'in doğrusu göstermekte zorlandığı bir zarafet ve soğukkanlılık bekleniyor.\n\n"

 lmf_spouse.1155.lazy:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] hiçbir zaman pek enerjik olmadı. Kimileri [ROOT.Char.GetPrimarySpouse.GetHerHim]'e #EMP tembel#! diyebilir; ama doğrusu [ROOT.Char.GetPrimarySpouse.GetSheHe] rahat ve lüks bir yaşamı tercih eder... oysa sarayın gerekleri [ROOT.Char.GetPrimarySpouse.GetHerHim]'in sürekli faal olmasını gerektirir. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] ne de olsa [ROOT.Char.Custom('FortifiedBuilding')]'in [ROOT.Char.GetPrimarySpouse.GetLadyLord]'i ve yapılacak çok iş var.\n\n"

 lmf_spouse.1155.desc.end:0 "Sonuç olarak [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im epey stresli hale geldi. Araya girip [ROOT.Char.GetPrimarySpouse.GetHerHim] için işleri kolaylaştırabilirdim; ama benim de ilgilenmem gereken kendi görevlerim yokmuş gibi değil."

 lmf_spouse.1155.a:0 "Elbette [ROOT.Char.GetPrimarySpouse.GetHerHim]'e yardım edeceğim!"

 lmf_spouse.1155.b:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] bununla [ROOT.Char.GetPrimarySpouse.GetHerHis] başına buyruk başa çıkmalı."

 lmf_spouse.1160.t:0 "[ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip|U]'in Çilesi"

 lmf_spouse.1160.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im son zamanlarda zor zamanlar geçiriyor.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U], benim yanımda saraydaki [ROOT.Char.GetPrimarySpouse.GetHerHis] görevlerinin yanı sıra [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki haneyi de yönetiyor; son zamanlarda birbiri ardına bir şeyler ters gidiyor gibi. "It's as if [ROOT.Char.GetPrimarySpouse.GetFaith.HighGodName] has decided I should be plagued by problems!" I heard [ROOT.Char.GetPrimarySpouse.GetHerHim] exclaim.\n\n"Is there something I can do to help?" I offered.\n\n"

 lmf_spouse.1160.rival:0 ""Help? From you?" [ROOT.Char.GetPrimarySpouse.GetSheHe] scoffed. "I'd sooner choke."\n\n"

 lmf_spouse.1160.dominant:0 ""I will handle this myself," [ROOT.Char.GetPrimarySpouse.GetSheHe] said with determination.\n\n"

 lmf_spouse.1160.levelheaded:0 ""This can't go on forever, dear [ROOT.Char.GetWifeHusband]," [ROOT.Char.GetPrimarySpouse.GetSheHe] said, taking a deep breath. "It will soon pass."\n\n"

 lmf_spouse.1160.malicious:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] düşündü. "No," [ROOT.Char.GetPrimarySpouse.GetSheHe] finally said. "I will find the troublemakers and I will fill them with regret. You'll see."\n\n"

 lmf_spouse.1160.benevolent:0 ""It's kind of you to offer," [ROOT.Char.GetPrimarySpouse.GetSheHe] sighed, "but I don't want to add to your burden. I will handle it as best I can."\n\n"

 lmf_spouse.1160.diligent:0 ""This is my duty," [ROOT.Char.GetPrimarySpouse.GetSheHe] said firmly, "and mine alone. I will do as any [ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip|l] should."\n\n"

 lmf_spouse.1160.default:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe]'in bunu ciddi ciddi düşündüğünü anlayabiliyordum. "No," [ROOT.Char.GetPrimarySpouse.GetSheHe] finally said, with a tinge of regret. "I'll keep trying."\n\n"

 lmf_spouse.1160.desc.end:0 "İşte buydu. Görünüşe göre, [ROOT.Char.GetPrimarySpouse.GetHerHim]'e ne kadar stres verse de, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] rotadan sapmamaya kararlıydı."

 lmf_spouse.1160.a:0 "#EMP Bu kadar#! mı zor?"

 lmf_spouse.1165.t:0 "Kayıtsız [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1165.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin [ROOT.Char.GetPrimarySpouse.GetHerHim]'i meşgul edecek hiçbir şeyi yokmuş gibi değil... [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ne de olsa [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in [ROOT.Char.GetPrimarySpouse.GetLadyLord]'i. Ama son zamanlarda [ROOT.Char.GetPrimarySpouse.GetHerHim]'i koridorlarda ve bahçelerde dolaşırken, görünüşe göre can sıkıntısıyla iç çekerken gördüm.\n\n"I need something to #EMP do#!," [ROOT.Char.GetPrimarySpouse.GetSheHe] finally complained to me. "I am guardian to no children, I have no real position, and I have no role at your court other than being your [ROOT.Char.GetPrimarySpouse.GetWifeHusband]."\n\n"Is that not enough?"\n\nThe withering look I received said that, no, it was not. At least, not for [ROOT.Char.GetPrimarySpouse.GetHerHim]. Evidently, [ROOT.Char.GetPrimarySpouse.GetSheHe] wanted some advice."

 lmf_spouse.1165.a:0 ""Perhaps all you need is a new friend.""

 lmf_spouse.1165.b:0 ""There are skills you could hone for the future?""

 lmf_spouse.1165.c:0 ""I suppose the two of us could spend more time together...""

 spent_more_time_together:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], birlikte daha çok vakit geçirerek evlilik ilişkilerini geliştirdiler."

 spent_more_time_together_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [CHARACTER.GetShortUINameNoTooltipNoFormat], birlikte daha çok vakit geçirerek evlilik ilişkilerini geliştirdiler."

 lmf_spouse.1165.d:0 ""I'm sure you'll figure it out.""

 lmf_spouse.1165.e:0 ""How about I appoint you as my [ROOT.Char.GetPrimarySpouse.Custom('GetTargetCourtPosition')]?""

 spurned_spouse_request_for_advice:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYourHerHis(TARGET_CHARACTER)] tavsiye isteğini geri çevirerek [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'i kızdırdı."

 spurned_spouse_request_for_advice_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYourHerHis(CHARACTER)] tavsiye isteğini geri çevirerek [CHARACTER.GetShortUINameNoTooltipNoFormat]'i kızdırdı."

 lmf_spouse.1170.t:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis|U] [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('ward'))|U]'ini Yetiştirmek"

 lmf_spouse.1170.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bugün [ROOT.Char.GetPrimarySpouse.GetHerHis] yüzünde kararlı bir ifade ve basit bir istekle taht odasına geldi.\n\n"

 lmf_spouse.1170.desc.ruler:0 ""I want [ward.GetFirstNameNoTooltip] to come to [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] and become my ward."\n\n"

 lmf_spouse.1170.desc.courtier:0 ""I want [ward.GetFirstNameNoTooltip] to be my ward."\n\n"

 lmf_spouse.1170.desc.hasguardian:0 ""[ward.GetFirstNameNoTooltip] already has a guardian," I said. "What's wrong with [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('spouse_ward_guardian'))]?"\n\n"

 lmf_spouse.1170.desc.rival:0 ""You know very well what's wrong. I detest [ROOT.Char.GetPrimarySpouse.Custom2('direct_address_by_familiarity', SCOPE.sC('spouse_ward_guardian'))]. [ward.GetFirstNameNoTooltip] is my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('ward'))] and [ward.GetSheHe]'s far better off with #EMP me#!."\n\n"

 lmf_spouse.1170.desc.skill:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] kayıtsızca elini salladı. "I'm at least as good a tutor as [ROOT.Char.GetPrimarySpouse.Custom2('direct_address_by_familiarity', SCOPE.sC('spouse_ward_guardian'))]. My point is that [ward.GetFirstNameNoTooltip] is my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('ward'))] and [ward.GetSheHe]'s far better off with me."\n\n"

 lmf_spouse.1170.desc.noguardian:0 "Meseleyi düşündüm. "I suppose that [ward.GetFirstNameNoTooltip] doesn't have a guardian at present..."\n\n"Then who better but me to raise [ward.GetHerHim]? [ward.GetSheHe|U] is my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('ward'))] and this is the best way for me to spend time with [ward.GetHerHim]."\n\n"

 lmf_spouse.1170.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in bu işi bırakmayacağını anlayabiliyordum."

 lmf_spouse.1170.a:0 "Pekâlâ. [ward.GetFirstNamePossessiveNoTooltip] vasisi olabilirsin."

 lmf_spouse.1170.b:0 "Hayır. İşler olduğu gibi kalacak."

 lmf_spouse.1175.t:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]'imin Onaylamaması"

 lmf_spouse.1175.desc.start:0 "[focus_child.GetFirstNameNoTooltip]'in gerçek kılıç talimine başlamasına izin verdiğimden beri [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bu meseleye açık bir hoşnutsuzlukla bakıyor. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] izlemek için silahlığa iniyor; [focus_child.GetFirstNameNoTooltip] hiç aldırış etmese de, her darbe aldığında ya da yere düştüğünde irkiliyor.\n\n"

 lmf_spouse.1175.desc.religion:0 ""It's #EMP unseemly#! for a girl with a pious upbringing to be playing with swords!" she finally said to me.\n\n"

 lmf_spouse.1175.desc.paranoid:0 ""What will people #EMP think#!?" she said later, when we were alone. "And what will they say about you? And #EMP me#!, that we should allow such a thing?!"\n\n"

 lmf_spouse.1175.desc.dominant:0 ""I forbid it," she said to me later, with a determined look in her eyes. "What will you do? Send [focus_child.GetFirstNameNoTooltip] into #EMP battle#!? Absolutely not."\n\n"

 lmf_spouse.1175.desc.end:0 ""The decision has already been made," I sighed.\n\n"Then #EMP un-#!make it!""

 lmf_spouse.1175.a:0 ""Very well, I'll do as you demand.""

 stopped_my_swordsmanship_education:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'in kılıç talimine devam etmesini engelledi."

 stopped_my_swordsmanship_education_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINameNoTooltipNoFormat]'in kılıç talimine devam etmesini engelledi."

 lmf_spouse.1175.b:0 ""No, [focus_child.GetFirstNamePossessiveNoTooltip] training will continue as it has.""

 lmf_spouse.1180.t:0 "Bir Annenin Gururu"

 lmf_spouse.1180.desc.start:0 ""[focus_child.GetFirstNameNoTooltip] should be allowed to take up training in proper swordsmanship," my wife informed me this evening. "She's already practically doing so, whether we like it or not."\n\nI was startled. "And what? You wish me to send [focus_child.GetFirstNameNoTooltip] to war? As a #EMP [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]#!?!""

 lmf_spouse.1180.desc.knight:0 ""Why not?" the look [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] gave me was a dangerous one. "You've sent #EMP me#!."\n\n"

 lmf_spouse.1180.desc.cynic:0 ""Why not?" [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] spat with derision. "Because she's a sweet and pious little girl?"\n\n"

 lmf_spouse.1180.desc.just:0 ""It's the right thing to do, if that's what [focus_child.GetFirstNameNoTooltip] wishes to do," she shrugged, "and she does."\n\n"

 lmf_spouse.1180.desc.compassion:0 ""Would you deny her the right to her calling? If it's something she truly desires?" She looked uncertain, but finally shook her head. "I could not."\n\n"

 lmf_spouse.1180.desc.end:0 "Mesele hakkında bir süre konuştuk; ama [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in bir karar verilmeden konuyu bırakmayacağını anlayabiliyordum."

 lmf_spouse.1180.a:0 "Pekâlâ, dilediğini yapacağız."

 lmf_spouse.1180.b:0 "Hayır, ve konu kapandı."

 lmf_spouse.1185.t:0 "[ROOT.Char.GetPrimarySpouse.GetMotherFather|U] ve [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('focus_child'))|U]"

 lmf_spouse.1185.desc.start:0 "Tartışmayı birkaç oda öteden duydum. Tiz çığlıklar, ardından çarpan kapılar ve en sonunda [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin bulunduğum odaya fırtına gibi dalması; [ROOT.Char.GetPrimarySpouse.GetHerHis] yanakları öfke ve hüsrandan kızarmıştı. "That... that #EMP child#! will be the death of me!" [ROOT.Char.GetPrimarySpouse.GetSheHe] declared.\n\nAfter finally getting [ROOT.Char.GetPrimarySpouse.GetHerHim] to calm down, I learned the fight had been between [ROOT.Char.GetPrimarySpouse.GetHerHim] and our [focus_child.Custom('GetDaughterSon')], [focus_child.GetFirstNameNoTooltip]. "

 lmf_spouse.1185.desc.rowdy:0 "Görünüşe göre [focus_child.GetFirstNameNoTooltip] her zamanki yaramaz haliyle bir vazoyu devirdi; [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] de [focus_child.GetHerHim]'i bunun için azarladı.\n\n"

 lmf_spouse.1185.desc.bossy:0 "Görünüşe göre [focus_child.GetFirstNameNoTooltip] her zamanki otoriter halindeydi, herkese emir yağdırıyordu... ve bugün emir yağdırdıkları arasında [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather] de vardı.\n\n"

 lmf_spouse.1185.desc.wrathful:0 "[focus_child.GetFirstNamePossessiveNoTooltip] huyu en iyi zamanında bile iyi değil ve görünüşe göre şu sıralar oldukça huysuz; [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather]'ine hiçbir şey yüzünden patladı.\n\n"

 lmf_spouse.1185.desc.arrogant:0 "Görünüşe göre [focus_child.GetFirstNameNoTooltip], [ROOT.Char.Custom('FortifiedBuilding')]'in hizmetkârlarından biri hakkında oldukça kaba bir şey söyledi ve [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather] [focus_child.GetHerHim]'i [focus_child.GetHerHis] kibri yüzünden uyardı.\n\n"

 lmf_spouse.1185.desc.paranoia:0 "Görünüşe göre [focus_child.GetFirstNamePossessiveNoTooltip] paranoyası bugün tam anlamıyla ortadaydı. [focus_child.GetSheHe|U] uzun uzun endişelendi ve şikâyet etti; ta ki [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather] sonunda [focus_child.GetHerHim]'e sakin olmasını söyleyene dek.\n\n"

 lmf_spouse.1185.desc.stubborn:0 "Görünüşe göre [focus_child.GetFirstNamePossessiveNoTooltip] inatçılık huyu bugün tam anlamıyla ortadaydı; [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather] defalarca deneyip çok sabır gösterdiği halde [focus_child.GetHerHim]'i bir görevde iş birliğine ikna edemedi.\n\n"

 lmf_spouse.1185.desc.impatient:0 "Görünüşe göre [focus_child.GetFirstNamePossessiveNoTooltip] sabırsızlığı bugün tam anlamıyla ortadaydı; geçen gün gördüğü bir süsü satın almak için yeterince para istedi... [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather]'in haklı olarak reddettiği bir talep.\n\n"

 lmf_spouse.1185.desc.callous:0 "Görünüşe göre [focus_child.GetFirstNameNoTooltip], [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather]'ine oldukça duygusuz bir söz söyledi... [ROOT.Char.GetPrimarySpouse.GetSheHe]'i hem şaşırtan hem de afallatan bir söz.\n\n"

 lmf_spouse.1185.desc.potential:0 "Kavgayı neyin başlattığı önemsiz; zira bu, ikisi arasında epey zamandır demleniyordu. Sözlerin söylendiğini söylemek yeterli.\n\n"

 lmf_spouse.1185.desc.rival:0 "Kavgayı neyin başlattığı önemsiz; zira [ROOT.Char.GetPrimarySpouse.GetMotherFather] ve [focus_child.Custom('GetDaughterSon')] bir süredir birbirlerinin boğazındaydı. Belki birbirlerine yanlış baktılar, belki sözler söylendi.\n\n"

 lmf_spouse.1185.desc.end:0 "Bu, gerçek ve hayalî hakaretleri gün yüzüne çıkaran büyük bir tartışmaya yol açtı; öyle ki [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] bile şaşırdı. "Honestly, I don't know what's gotten into [focus_child.GetHerHim]."\n\nI know this is the way of young [focus_child.GetWomenMen] [focus_child.GetHerHis] age... but I doubt now is the time to mention that to my [ROOT.Char.GetPrimarySpouse.GetWifeHusband]."

 lmf_spouse.1185.a:0 "Zamanla çözerler... umarım."

 had_massive_argument:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] büyük bir tartışma yaşadılar; [CharYourTheir(CHARACTER)] ilişkilerini ekşitmiş bir tartışma."

 had_massive_argument_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [CHARACTER.GetShortUINameNoTooltipNoFormat] büyük bir tartışma yaşadılar; [CharYourTheir(TARGET_CHARACTER)] ilişkilerini ekşitmiş bir tartışma."

 lmf_spouse.1190.t:0 "[ROOT.Char.GetMotherFather|U] ve [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('focus_child'))|U]"

 lmf_spouse.1190.desc.start:0 "Ortalıkta bir şeylerin dolaştığını bilmeliydim.\n\n[focus_child.GetFirstNameNoTooltip] kendine özgü olmayan bir asabiyet içindeydi; ben başka işlere odaklanmaya çalışırken beni rahatsız ediyordu. "

 lmf_spouse.1190.desc.rowdy:0 "Sonra, tahta bir kılıç sallarken [focus_child.GetSheHe] onunla tam kafama vurdu. [focus_child.GetSheHe] oynarken bir kaza olduğunu biliyorum; yine de patladım ve [focus_child.GetHerHim]'e defolmasını emrettim.\n\n"

 lmf_spouse.1190.desc.bossy:0 "Ne var ki [focus_child.GetSheHe|U], bugünün [ROOT.Char.Custom('FortifiedBuilding')]'deki herkese emir yağdırma günü olduğunu kafasına koymuştu... bana bile. Patladım ve [focus_child.GetHerHim]'e defolmasını emrettim.\n\n"

 lmf_spouse.1190.desc.wrathful:0 "[focus_child.GetSheHe|U] her küçük şeyde tartışma çıkarıyordu ve sonunda önemsiz bir isteğini reddettiğimde bana düpedüz öfkeyle bağırdı.\n\n"

 lmf_spouse.1190.desc.arrogant:0 "[focus_child.GetSheHe|U] [ROOT.Char.Custom('FortifiedBuilding')]'deki hizmetkârlar hakkında bitmek bilmeyen bir konuşmaya dalmıştı; [focus_child.GetHerHis] kibri bütün çıplaklığıyla ortadaydı, iğneleyici söz üstüne iğneleyici söz söylüyordu. Sonunda patladım ve [focus_child.GetHerHim]'e defolmasını emrettim.\n\n"

 lmf_spouse.1190.desc.paranoia:0 "[focus_child.GetSheHe|U] hayati önem taşıdığını düşündüğü ama benim hiç önemsemediğim bir karar hakkında durmadan endişeleniyordu. İnsanlar ne düşünür, ya her şey ters giderse... sinirle [focus_child.GetHerHim]'e defolmasını emredene dek bir endişe üstüne bir endişe.\n\n"

 lmf_spouse.1190.desc.stubborn:0 "[focus_child.GetHerHim]'e defalarca defolmasını söylemiştim; ama [focus_child.GetSheHe] inatla reddediyor, her seferinde daha da öfkeleniyordu. Sonunda [focus_child.GetSheHe] yanıma gelip beni sandalyemde #EMP itti#!.\n\n"

 lmf_spouse.1190.desc.impatient:0 "[focus_child.GetSheHe|U] inanılmaz derecede sabırsızdı. Akşam yemeği yeterince çabuk gelmiyordu, [focus_child.GetHerHis] geleceği yeterince çabuk gelmiyordu... sonunda [focus_child.GetHerHim]'e defolmasını emredene dek şikâyet üstüne şikâyetti.\n\n"

 lmf_spouse.1190.desc.callous:0 "[focus_child.GetSheHe|U] [focus_child.GetHerHis] dostlarından bahsediyordu... ya da en azından [focus_child.GetHerHis] dostları olduklarını varsaymalıyım, çünkü [focus_child.GetSheHe]'in onlar hakkında söyledikleri o kadar zalimceydi ki insan gerçekten merak etmek zorundaydı. [focus_child.GetHerHim]'i duygusuzluğu yüzünden uyardığımda [focus_child.GetSheHe] #EMP benim#! hakkında homurdanan bir laf etti.\n\n"

 lmf_spouse.1190.desc.rival:0 "Defalarca duyduğum tek şey, bana yöneltilmiş mırıldanılmış pasif-agresif yorumlardı. [focus_child.GetSheHe]'den o sözleri net biçimde tekrarlamasını istediğimde ise reddediyordu. Nefret dolu bir davranıştı ve bunu biliyordum.\n\n"

 lmf_spouse.1190.desc.potential:0 "[focus_child.GetHerHis] tarafına her baktığımda surat asıyor ve dik dik bakıyordu. [focus_child.GetSheHe|U]'in aklında bir kin vardı; ama gerçek mi hayal mi olduğunu öğrenmek için zaman harcamaya gönlüm yoktu, o yüzden [focus_child.GetHerHim]'e defolmasını emrettim.\n\n"

 lmf_spouse.1190.desc.end:0 "Bu bir tartışmaya yol açtı ve o tartışma, ikimiz birbirimize bağırıncaya dek uzayıp gitti; şimdi ne hakkında olduğunu bile hatırlamıyorum. Eski şeyler gün yüzüne çıkarıldı, sözler söylendi ve sonunda [focus_child.GetFirstNameNoTooltip] öfkeyle çıkıp gitti; yüzünde "I #EMP hate#! you!"\n\nMy [ROOT.Char.GetPrimarySpouse.GetWifeHusband] consoled me later. "Young [focus_child.GetWomenMen] [focus_child.GetHerHis] age... this is simply what they're like," [ROOT.Char.GetPrimarySpouse.GetSheHe] sighed. That didn't make it much easier."

 lmf_spouse.1190.a:0 "Atlatacaktır. Umarım."

 lmf_spouse.1195.t:0 "Bir [ROOT.Char.GetPrimarySpouse.GetMotherFather|U]'in Etkisi"

 lmf_spouse.1195.desc:0 "Son zamanlarda [focus_child.GetFirstNameNoTooltip] ile [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin birlikte epey vakit geçirdiklerini gördüm.\n\nBu kötü bir şey değil, elbette. Hangi ebeveyn [ROOT.Char.GetHerHis] [focus_child.Custom('GetDaughterSon')]'inin [focus_child.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetMotherFather] ile daha çok vakit geçirmesine kızar?\n\nAma ikisi canciğer dost gibi görünüyor. [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im [focus_child.Custom('GetLassLad')]'i [ROOT.Char.GetPrimarySpouse.GetHerHis] parmağına dolamış durumda; dolayısıyla [ROOT.Char.GetPrimarySpouse.GetHerHis] etkisi derin. Umarım bu iyi şeyler demektir."

 lmf_spouse.1195.a:0 "Göreceğiz!"

 spent_quality_time_together:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], [CHARACTER.GetMotherFather] ve [TARGET_CHARACTER.Custom('GetDaughterSon')] olarak yakınlaşarak birlikte çok vakit geçirdiler."

 spent_quality_time_together_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [CHARACTER.GetShortUINameNoTooltipNoFormat], [TARGET_CHARACTER.GetMotherFather] ve [CHARACTER.Custom('GetDaughterSon')] olarak yakınlaşarak birlikte çok vakit geçirdiler."

 lmf_spouse.1200.t:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]'imin İnançları"

 lmf_spouse.1200.desc:0 "Son zamanlarda [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile [focus_child.GetFirstNameNoTooltip]'in birlikte epey vakit geçirdiklerini gördüm.\n\nİlk başta bunun, bir [ROOT.Char.GetPrimarySpouse.GetMotherFather]'in [ROOT.Char.GetPrimarySpouse.GetHerHis] [focus_child.Custom('GetDaughterSon')]'ine ilgi göstermesinden ve bir yakınlaşma fırsatından başka bir şey olmadığını sandım. Sonra kazara ikisinin konuşmasına denk geldim ve [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin inanç meselelerinden bahsettiği izlenimine açıkça kapıldım. [ROOT.Char.GetPrimarySpouse.GetSheHe]... [focus_child.GetFirstNameNoTooltip]'e [ROOT.Char.GetPrimarySpouse.GetFaith.GetNameNoTooltip]'i mi öğretiyor? [focus_child.GetHerHim]'i din değiştirmeye mi çalışıyor?\n\nSonra [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile yüzleştim; [ROOT.Char.GetPrimarySpouse.GetSheHe] öğretmeyi kabul etti; ama bunun [focus_child.GetFirstNamePossessiveNoTooltip] ısrarı üzerine olduğunu iddia ediyor. "This is [focus_child.GetHersHis] heritage as well as mine," [ROOT.Char.GetPrimarySpouse.GetSheHe] complained. "Is that #EMP so#! wrong?""

 lmf_spouse.1200.a:0 "Pekâlâ, devam etmesine izin vereceğim."

 lmf_spouse.1200.b:0 "Kesinlikle olmaz. Bu artık son buluyor."

 lmf_spouse.1200.b.success.tt:0 "[focus_child.GetFirstNameNoTooltip], [focus_child.GetFaith.GetNameNoTooltip]'in bir takipçisi olarak gönülsüzce kalıyor"

 lmf_spouse.1200.b.secret.tt:0 "[focus_child.GetFirstNameNoTooltip], [ROOT.Char.GetPrimarySpouse.GetFaith.GetNameNoTooltip]'i #EMP gizlice#! öğrenmeye devam ediyor."

 lmf_spouse.1205.t:0 "Soğuk Bir Karşılama"

 lmf_spouse.1205.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramızdaki ilişkinin dibe vurduğunun fazlasıyla farkındayım.\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] benden isteneni yapmayı, saraya katılmayı ve [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in [ROOT.Char.GetPrimarySpouse.GetLadyLord]'i olarak [ROOT.Char.GetPrimarySpouse.GetHerHim]'den beklenen tüm görevleri yerine getirmeyi çok iyi biliyor... ama bunu, [ROOT.Char.GetPrimarySpouse.GetHerHis] hoşnutsuzluğunun boyutunu her seferinde bana hatırlatacak şekilde yapıyor.\n\nSoğuk bakışlar, sessizlikler, [ROOT.Char.GetPrimarySpouse.GetSheHe]'in [ROOT.Char.GetPrimarySpouse.GetHerHim] ile ne zaman konuşsam arkasını dönmesi. Sinirlerimi bu kadar bozmaması gerekirdi; ama bozuyor. "

 lmf_spouse.1205.desc.courtier:0 "Her gün beni bekleyen karşılamanın ne olduğunu bilerek [ROOT.Char.Custom('FortifiedBuilding')]'e dönmekten neredeyse tiksinirim."

 lmf_spouse.1205.desc.ruler:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe] her [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönüşünde rahat bir nefes alıyorum... yine de, [ROOT.Char.GetPrimarySpouse.GetSheHe] açıkça ne hissetse de, her zaman geri dönmek için bir neden buluyor: beni üzmek için."

 lmf_spouse.1205.a:0 "#EMP of...#!"

 lmf_spouse.1210.t:0 "[ROOT.Char.Custom('FortifiedBuilding')|U]'deki Sorunlar"

 lmf_spouse.1210.desc:0 "Mesajlar 'kayboluyor'. Hizmetkârlar aracılığıyla gönderilen emirler bir türlü yerine ulaşmıyor. Bazı emirler düpedüz çiğneniyor; yine de suçlu bir türlü bulunamıyor. Yeterince personel yok. Fazla personel var. Çalışma odam yeterli malzemeden yoksun.\n\n[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [ROOT.Char.Custom('FortifiedBuilding')]'de karşılaştığım sayısız küçük sorunu saymakla bitiremem; ama buna gerek yok. Suçlunun kim olduğunu biliyorum.\n\n[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im.\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in beni sabote etmenin pek çok yolu var... onu resmen azarlamam için yeterli olmayan, ama hissettirecek kadar olan."

 lmf_spouse.1210.a:0 "Ne kadar sinir bozucu."

 lmf_spouse.1215.t:0 "Yolda Durdurulan Mesaj"

 lmf_spouse.1215.desc:0 ""Where is my letter to [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('focus_vassal'))]?" I demanded of my [ROOT.Char.GetPrimarySpouse.GetWifeHusband].\n\nNaturally, [ROOT.Char.GetPrimarySpouse.GetSheHe] shrugged. "I have no idea what you're referring to, [ROOT.Char.GetWifeHusband]."\n\nYet [ROOT.Char.GetPrimarySpouse.GetHerHis] overly innocent manner meant that [ROOT.Char.GetPrimarySpouse.GetSheHe] did indeed know of the letter. What's more, [ROOT.Char.GetPrimarySpouse.GetSheHe] #EMP wanted#! me to know that [ROOT.Char.GetPrimarySpouse.GetSheHe] knew. "It wasn't ready to be sent! There were changes yet to be made. Important changes!"\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] merely shrugged. "Then it would be unfortunate indeed if someone sent it off. I'll ask the servants."\n\n[ROOT.Char.GetPrimarySpouse.GetSheHe|U] walked away, but I could already guess what had occurred: #EMP Sabotage.#!"

 lmf_spouse.1215.a:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin rekabetinin sınırı yok gibi görünüyor."

 waylaid_message:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINameNoTooltipNoFormat] tarafından yanlışlıkla gönderilen bir mektup aldığında öfkeden köpürmüştü [CharWereWas(TARGET_CHARACTER)]."

 waylaid_message_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] tarafından yanlışlıkla gönderilen bir mektup aldığında öfkeden köpürmüştü [CharWereWas(CHARACTER)]."

 lmf_spouse.1220.t:0 "Uzak Bir [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1220.desc:0 ""Absolutely not!"\n\nAfter yet another argument with my [ROOT.Char.GetPrimarySpouse.GetWifeHusband] in the council chamber, [ROOT.Char.GetPrimarySpouse.GetSheHe]'d stiffly risen from [ROOT.Char.GetPrimarySpouse.GetHerHis] chair and left the chamber. An awkward silence ensued as I and the other councillors waited for [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] to return, but it soon became clear [ROOT.Char.GetPrimarySpouse.GetSheHe] wasn't about to.\n\nI found [ROOT.Char.GetPrimarySpouse.GetHerHim] in the corridor later, and [ROOT.Char.GetPrimarySpouse.GetSheHe] vowed that [ROOT.Char.GetPrimarySpouse.GetSheHe] wasn't going to serve on my council any longer. "I am your [ROOT.Char.GetPrimarySpouse.GetWifeHusband]," [ROOT.Char.GetPrimarySpouse.GetSheHe] snapped, "but you and I both know that is mostly a technicality at this point. Let the world know it as such, I care not."\n\nThere was nothing I could do to convince [ROOT.Char.GetPrimarySpouse.GetHerHim] otherwise. We'll have to wait and see if [ROOT.Char.GetPrimarySpouse.GetHerHis] position softens in the weeks to come."

 lmf_spouse.1220.a:0 "İhtimali ne, acaba?"

 lmf_spouse.1120.tt:0 "[THIS.Char.GetPrimarySpouse.GetShortUINameNoFormat|U], konseyindeki [THIS.Char.GetPrimarySpouse.GetHerHis] görevinden ayrıldı ve yeniden işe alınamaz"

 lmf_spouse.1221.t:0 "[angry_spouse.GetShortUINameNoTooltipNoFormat|U] saraya dönebilir"

 lmf_spouse.1221.desc:0 "[angry_spouse.GetShortUINamePossessive|U] tavrı yumuşadı ve [angry_spouse.GetSheHe] artık yeniden konseyine atanabilir."

 lmf_spouse.1225.t:0 "Kaç Tanesi Yeterli?"

 lmf_spouse.1225.desc.start:0 "Karım bu sabah beni kenara çekti; bana soracağı önemli bir şey olduğunu söyledi.\n\n"

 lmf_spouse.1225.desc.hasnochildren:0 "Ben... çocuk istemiyorum," she finally admitted.\n\n"At #EMP all?#!", I asked in surprise.\n\n"

 lmf_spouse.1225.desc.haschildrennotyours:0 "Ben... daha fazla çocuk istemiyorum," she finally admitted.\n\n"Not even one of our own?" I asked in surprise.\n\n"

 lmf_spouse.1225.desc.hasyourchildren:0 "Ben... daha fazla çocuğumuz olmasını istemiyorum" she finally admitted.\n\n"

 lmf_spouse.1225.desc.notattracted:0 "İtiraf etmeliyim ki bu pek sürpriz olmadı. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] cinsel ilişkilere... hatta dürüst olmak gerekirse genel olarak erkeklere ilgi duymaya hiç heves göstermemişti.\n\n"

 lmf_spouse.1225.desc.chaste:0 "İtiraf etmeliyim ki tavrı beni şaşırtmadı. [ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] cinsel ilişkilere karşı tavrı her zaman... hani derler ya, isteksizlik olmuştur.\n\n"

 lmf_spouse.1225.desc.depressed:0 "Bunun onun süregelen hüznünün sonucu olup olmadığını merak etmek zorunda kaldım. Böylesine sürekli bir üzüntü, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'i hayata, çocuklara ya da herhangi bir şeye dair #EMP tüm#! istekten yoksun bırakıyor gibiydi.\n\n"

 lmf_spouse.1225.desc.lunatic:0 "Bunun hayalî bir düşüncenin sonucu olup olmadığını merak etmek zorunda kaldım. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in tuhaf fikirleri olurdu; kimi zaman aklına takılan delice düşünceler. Ya da belki böyle bir durumu aktarmaktan çekiniyordu? Bilemem.\n\n"

 lmf_spouse.1225.desc.callous:0 "Talebi öyle sıradan, hatta soğuk bir şekilde yaptı ki. Sanki evlilik ilişkilerimiz kurtulunacak bir yükmüş gibi. Doğru, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile pek âşık sayılmazdık; ama nasıl bu kadar #EMP duygusuz#! olabilirdi?\n\n"

 lmf_spouse.1225.desc.paranoid:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] en büyük korkularından birinin doğumda ölmek olduğunu biliyordum. Bu fikir karşısında neredeyse paranoyaklaşırdı. Bu korku mu bunun arkasındaydı?\n\n"

 lmf_spouse.1225.desc.reclusive:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] son zamanlarda öylesine içine kapanmıştı ki. Benden, herkesten uzaklaştı. Zaten görmek zorunda olduğundan bile daha az görmeyi istemesinin bir parçası mıydı bu, acaba?\n\n"

 lmf_spouse.1225.desc.twoheirs:0 ""You already have more than enough heirs, my lord," she continued. "

 lmf_spouse.1225.desc.heir:0 ""I've already given you at least one heir, my lord," she continued. "

 lmf_spouse.1225.desc.end:0 ""Surely you don't need more children, not from me."\n\nTrue, perhaps... but did I #EMP want#! them?"

 lmf_spouse.1225.a:0 ""Very well, I'll abide by your wishes.""

 lmf_spouse.1225.a.tt:0 "Sen ve [THIS.Char.GetPrimarySpouse.GetShortUINameNoTooltipNoFormat] artık birlikte çocuk sahibi olmayacaksınız"

 lmf_spouse.marriagebed.notify1.tt:0 "Sen ve [std_partner.GetShortUINameNoTooltipNoFormat] artık birlikte çocuk sahibi olmayacaksınız"

 lmf_spouse.marriagebed.notify2.tt:0 "Sen ve [other_partner.GetShortUINameNoTooltipNoFormat] artık birlikte çocuk sahibi olmayacaksınız"

 lmf_spouse.marriagebed.notify3.tt:0 "Sen ve [THIS.Char.GetShortUINameNoTooltipNoFormat] artık birlikte çocuk sahibi olmayacaksınız"

 granted_request_no_more_children:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] birlikte daha fazla çocuk sahibi olmama isteğini kabul etti."

 granted_request_no_more_children_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] birlikte daha fazla çocuk sahibi olmama isteğini kabul etti."

 lmf_spouse.1225.b:0 ""Absolutely not! Providing more children is your #EMP duty#!.""

 refused_request_no_more_children:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] birlikte daha fazla çocuk sahibi olmama isteğini reddetti."

 refused_request_no_more_children_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] birlikte daha fazla çocuk sahibi olmama isteğini reddetti."

 lmf_spouse.1230.t:0 "Zaman ve Çaba"

 lmf_spouse.1230.desc.start:0 "Gece geç saatlerde [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im, [ROOT.Char.GetPrimarySpouse.GetHerHis] gözlerindeki o bakışla yanıma geldi.\n\n"I think it's time we worked at having a child," [ROOT.Char.GetPrimarySpouse.GetSheHe] said."

 lmf_spouse.1230.desc.myheir:0 " "Ne de olsa bana düzgün bir varis gerektiği söylendi."\n\n"

 lmf_spouse.1230.desc.yourheir:0 " "Ne de olsa sana düzgün bir varis gerekiyor... ya da bana sık sık söylendiği gibi."\n\n"

 lmf_spouse.1230.desc.unfruitful:0 " "Bir süre geçtiğini biliyorum..."\n\nİtiraf edeyim, şaşırdım. "Daha fazla çocuk istemediğini sanıyordum," diye belirttim.\n\n"İşler değişti, değil mi?"\n\n"

 lmf_spouse.1230.desc.end:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] şaşkınlığımı tereddüt sandı. "If you prefer, [ROOT.Char.GetWifeHusband], I can instead leave you to your own bed for tonight. It's simply that these things require time and effort."\n\nWith that, [ROOT.Char.GetPrimarySpouse.GetSheHe] favored me with a wink, turned, and walked into our bedchambers."

 lmf_spouse.1230.a:0 "Daha fazla söyleme!"

 lmf_spouse.1230.b:0 "Aslında, ben pek istemem..."

 lmf_spouse.1235.t:0 "Evlilik Yatağı"

 lmf_spouse.1235.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle evliliğimizi tükettiğimiz zamanlar son zamanlarda oldukça... seyrekleşti.\n\nÇoğu evlilik için bunun normal olduğunu anlıyorum; ama [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile durum farklı. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] dokunuşumdan irkiliyor; o noktaya gelebildiysek eğer.\n\nŞimdi ise kendimi evlilik yatağından büsbütün kovulmuş buluyorum. [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im [ROOT.Char.GetPrimarySpouse.GetHerHis] bildiğini okursa, [ROOT.Char.GetPrimarySpouse.GetSheHe] bir daha asla benimle yatmayacak.\n\n"

 lmf_spouse.1235.desc.rival:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] bana duyduğu nefretin ne kadar açıktan açığa hale geldiği düşünülürse, şaşırmamalıyım. Evliliğimiz neredeyse bir formalite ve bu sadece onu daha da formalite haline getiriyor."

 lmf_spouse.1235.desc.attraction:0 "Şaşırmamalıyım. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] cinsel eylemi hiçbir zaman umursamadı ve doğrusu [ROOT.Char.GetPrimarySpouse.GetSheHe]'in [ROOT.Char.GetWomenMen]'e o şekilde ilgi duyduğundan da şüpheliyim. Bu, her zaman kuşkulandığım şeyi kanıtlıyor."

 lmf_spouse.1235.desc.malicious:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile aramızda pek bir sevgi kalmadığı doğru olabilir ve [ROOT.Char.GetPrimarySpouse.GetSheHe] zaten [ROOT.Char.GetPrimarySpouse.GetWomenMen]'in en kibarı sayılmaz. Sanırım işlerin böyle olduğunu kabul etmek zorundayım."

 lmf_spouse.1235.desc.dominant:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile aramızda pek bir sevgi kalmadığı doğru olabilir ve [ROOT.Char.GetPrimarySpouse.GetSheHe] her zaman [ROOT.Char.GetPrimarySpouse.GetHerHis] bildiğini okumaya kararlı. Bu konuda [ROOT.Char.GetPrimarySpouse.GetHerHim] ile savaşmayacağım, orası kesin."

 lmf_spouse.1235.a:0 "Ne kadar aşağılayıcı."

 lmf_spouse.1236.t:0 "[angry_spouse.GetShortUINameNoTooltipNoFormat|U] fikrini değiştirmiş [CharHaveHas(angry_spouse)]"

 lmf_spouse.1236.desc:0 "[angry_spouse.GetShortUINameNoFormat|U] evlilik yatağına sana yeniden katılmaya karar vermiş [CharHaveHas(angry_spouse)]."

 lmf_spouse.1240.t:0 "Ziyarete Gidiyor"

 lmf_spouse.1240.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bugün bir istekle yanıma geldi: "I wish to visit [ROOT.Char.GetPrimarySpouse.Custom2('direct_address_by_familiarity', SCOPE.sC('spouse_visit_target'))]."\n\n"[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('spouse_visit_target'))]? In "

 lmf_spouse.1240.desc.foreign:0 "[visit_kingdom.GetNameNoTierNoTooltip] mi? Neden bu kadar uzak?"\n\n"

 lmf_spouse.1240.desc.ruler:0 "[spouse_visit_target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] mi? Neden olsun?"\n\n"

 lmf_spouse.1240.desc.courtier:0 "[spouse_visit_target.GetLiege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] mi? Neden olsun?"\n\n"

 lmf_spouse.1240.desc.grandchildren:0 ""To see my grandchildren, of course, as if I needed an additional reason to visit my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('spouse_visit_target'))]," [ROOT.Char.GetPrimarySpouse.GetSheHe] said, a little annoyed by my question. "

 lmf_spouse.1240.desc.grandson:0 ""Do I need a reason to visit my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('spouse_visit_target'))] and my infant grandson?" [ROOT.Char.GetPrimarySpouse.GetSheHe] said, a little annoyed by my question. "

 lmf_spouse.1240.desc.granddaughter:0 ""Do I need a reason to visit my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('spouse_visit_target'))] and my infant granddaughter?" [ROOT.Char.GetPrimarySpouse.GetSheHe] said, a little annoyed by my question. "

 lmf_spouse.1240.desc.relation:0 ""Do I truly need a reason to visit my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('spouse_visit_target'))]?" [ROOT.Char.GetPrimarySpouse.GetSheHe] said, a little annoyed by my question. "

 lmf_spouse.1240.desc.sick:0 ""[spouse_visit_target.GetSheHe|U] is sick, and I want to make sure [spouse_visit_target.GetSheHe]'s getting the proper care," [ROOT.Char.GetPrimarySpouse.GetSheHe] said. "

 lmf_spouse.1240.desc.pregnant:0 ""My [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('spouse_visit_target'))] is pregnant, if you haven't heard," [ROOT.Char.GetPrimarySpouse.GetSheHe] said, frowning at me. "

 lmf_spouse.1240.desc.bestfriend:0 ""Because [spouse_visit_target.GetSheHe]'s my best friend. Surely you know this? It's been too long since we've seen each other," [ROOT.Char.GetPrimarySpouse.GetSheHe] said with a sigh. "

 lmf_spouse.1240.desc.potfriend:0 ""[spouse_visit_target.GetSheHe|U] and I have long been on good terms and I'd like to see if there's an actual friendship to be had," [ROOT.Char.GetPrimarySpouse.GetSheHe] said thoughtfully. "

 lmf_spouse.1240.desc.lover:0 ""Because [spouse_visit_target.GetSheHe] and I have business, which happens to be no business of yours," [ROOT.Char.GetPrimarySpouse.GetSheHe] said with obvious annoyance. "

 lmf_spouse.1240.desc.friend:0 ""Because it's been too long and I miss [spouse_visit_target.GetHerHim]," [ROOT.Char.GetPrimarySpouse.GetSheHe] said with an exasperated sigh. "

 lmf_spouse.1240.desc.end:0 ""I won't be gone from [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] more than a few months, six at the most, if that's your concern."\n\nIt wasn't, though I did wonder why [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] wants to go by [ROOT.Char.GetPrimarySpouse.GetHerselfHimself] and didn't ask me to come. Such a trip could potentially be quite dangerous, after all."

 lmf_spouse.1240.a:0 ""Of course you may go.""

 lmf_spouse.1240.a.tt:0 "[THIS.Char.GetPrimarySpouse.GetShortUINameNoFormat|U], [spouse_visit_target.GetShortUINameNoFormat]'i ziyaret etmek için yola çıkacak ve altı aya kadar kalacak."

 lmf_spouse.1240.a.nocouncil.tt:0 "[THIS.Char.GetPrimarySpouse.GetHerHis] ziyareti [THIS.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] dışında gerçekleştiğinden, [THIS.Char.GetPrimarySpouse.GetShortUINameNoFormat], [THIS.Char.GetPrimarySpouse.GetHerHis] ziyareti boyunca danışman olarak müsait olmayacak."

 lmf_spouse.1240.b:0 ""No, it's far too dangerous. Another time.""

 lmf_spouse.1242.title:0 "[visiting_spouse.GetShortUINamePossessiveNoTooltipNoFormat|U] ziyareti tamamlandı"

 lmf_spouse.1242.desc:0 "[visiting_spouse.GetShortUINameNoFormat|U], [CharYourHerHis(visiting_spouse)] [destination.GetTitle.GetNameNoTierNoTooltip]'de [actor.GetShortUINameNoFormat] ile ziyaretini tamamladı [CharHaveHas(visiting_spouse)] ve şimdi [origin.GetTitle.GetNameNoTierNoTooltip]'deki evine dönüyor [CharAreIs(visiting_spouse)]."

 came_for_a_long_visit:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] ile ilişkisi, uzun bir yalnız ziyaretin ardından iyileşti."

 came_for_a_long_visit_corresponding:0 "[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [CHARACTER.GetShortUINameNoTooltipNoFormat] ile ilişkisi, uzun bir yalnız ziyaretin ardından iyileşti."

 lmf_spouse.1250.t:0 "Eşim [spouse_stress.GetNameNoTooltip( ROOT.Char )|U] [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1250.desc.start:0 "Eşim [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'in görevleri "

 lmf_spouse.1250.desc.courtier:0 "burada, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de "

 lmf_spouse.1250.desc.ruler:0 "[ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [ROOT.Char.GetPrimarySpouse.GetHerHis] sarayında "

 lmf_spouse.1250.desc.mid:0 "kolay değil, bundan hiç şüphem yok. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] çektiği stres hakkında sık sık yakınır. Ne var ki [ROOT.Char.GetPrimarySpouse.GetSheHe]'in o stresle #EMP başa çıkma#! biçimi kimi zaman arzu edilenden çok uzak.\n\n"

 lmf_spouse.1250.desc.drunkard:0 "Bugün, [ROOT.Char.GetPrimarySpouse.GetHerHim] sabahın erken saatlerinden itibaren içmeye başlayarak başladı. Çoğunlukla şarap; bir kadeh burada, bir kadeh orada, ta ki birden [ROOT.Char.GetPrimarySpouse.GetHerHis] sözleri gevelenir ve [ROOT.Char.GetPrimarySpouse.GetSheHe] ayakta sallanana dek. Akşama doğru sarhoş saçmalama ve bağırıp çağırmaya dönüştü; birkaç kişi [ROOT.Char.GetPrimarySpouse.GetHerHim]'i yakalayıp yatağına yatırabilene dek hizmetkârlara bağırdı.\n\n"

 lmf_spouse.1250.desc.hashishiyah:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] afyona bir hayli merak saldı; o kadar düzenli haşhaş sütü içiyor ki [ROOT.Char.GetPrimarySpouse.GetSheHe] çoğu zaman kendinden geçmiş halde. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] yatak odasındaki minderlerde pinekliyor; kimi gün kalkmaya bile mecali yok... kimi günlerde ise inanılmaz derecede hasta. Hizmetkârlardan biri tam bir çaresizlikle [ROOT.Char.GetPrimarySpouse.GetHerHis] stoğunu saklamaya çalıştı ve [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin buna tepkisi gerçekten görülmeye değerdi.\n\n"

 lmf_spouse.1250.desc.rakish.nolover:0 "Eşim [ROOT.Char.GetPrimarySpouse.GetSheHe|U] hizmetkârlara saldırıyor, [ROOT.Char.GetPrimarySpouse.GetSheHe]'in nasıl ihtiyacı olduğundan yakınıyor: "release"... and, when even that's not enough, I've heard reports that [ROOT.Char.GetPrimarySpouse.GetSheHe]'ll head into a nearby village in disguise. Whether it's in search of fleeting encounters or [ROOT.Char.GetPrimarySpouse.GetSheHe] has a lover, I've yet to determine, but it's not hard to imagine when [ROOT.Char.GetPrimarySpouse.GetSheHe] gets like this.\n\n"

 lmf_spouse.1250.desc.rakish.lover:0 "Eşim [ROOT.Char.GetPrimarySpouse.GetSheHe|U] hizmetkârlara saldırıyor, [ROOT.Char.GetPrimarySpouse.GetSheHe]'in nasıl ihtiyacı olduğundan yakınıyor: "release"... and, when even that's not enough, I've heard reports that [ROOT.Char.GetPrimarySpouse.GetSheHe]'ll leave the [ROOT.Char.Custom('FortifiedBuilding')] in disguise... to meet [ROOT.Char.GetPrimarySpouse.GetHerHis] lover, no doubt. Honestly, [ROOT.Char.GetPrimarySpouse.GetSheHe] doesn't even hide it particularly well. Nor does [ROOT.Char.GetPrimarySpouse.GetSheHe] hide the fact that [ROOT.Char.GetPrimarySpouse.GetHerHis] needs are more than I can fulfill.\n\n"

 lmf_spouse.1250.desc.irritable:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] sürekli patlıyor - bana, saraylılara, hizmetkârlara. [ROOT.Char.GetPrimarySpouse.GetHerHis] varlığında biri en ufak bir hata yapsa [ROOT.Char.GetPrimarySpouse.GetHerHis] öfkesinin tüm ağırlığını hisseder. Bu da demek oluyor ki [ROOT.Char.GetPrimarySpouse.GetSheHe] her strese girdiğinde herkes [ROOT.Char.GetPrimarySpouse.GetHerHim]'in çevresinde pamuk ipliğine basarak yürüyor. O günlerde [ROOT.Char.Custom('FortifiedBuilding')] neredeyse insanı çıldırtan sessiz bir gerilimle doluyor.\n\n"

 lmf_spouse.1250.desc.flagellant:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'i geceleri, [ROOT.Char.GetPrimarySpouse.GetHerHis] odasında [ROOT.Char.GetPrimarySpouse.GetFaith.HighGodName]'e hararetle dua ederken duyabiliyorum. Sonra kırbaç sesleri başlıyor, ardından [ROOT.Char.GetPrimarySpouse.GetHerHis] acı ve ıstırap çığlıkları geliyor. Kimi zaman bir hizmetkâr [ROOT.Char.GetPrimarySpouse.GetHerHim]'i yerde baygın buluyor; [ROOT.Char.GetPrimarySpouse.GetHerHis] sırtı paramparça. Hekim her seferinde [ROOT.Char.GetPrimarySpouse.GetHerHim]'i tedavi etti; ama eninde sonunda [ROOT.Char.GetPrimarySpouse.GetSheHe]'in [ROOT.Char.GetPrimarySpouse.GetHerselfHimself]'ine onarılamayacak zarar vereceğini söylüyor.\n\n"

 lmf_spouse.1250.desc.profligate:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] çarşıya gidiyor ya da yakındaki bir şehre kısa geziler yapıyor; her seferinde göz yaşartan borçlar biriktiriyor. Peki [ROOT.Char.GetPrimarySpouse.GetSheHe] ne satın alıyor? Doğrusu, önemli hiçbir şey. [ROOT.Char.GetPrimarySpouse.GetHerHis] gözüne kestirdiği her şeyi. "I #EMP need#! these things!" [ROOT.Char.GetPrimarySpouse.GetSheHe] insists, but [ROOT.Char.GetPrimarySpouse.GetSheHe] and I both know that [ROOT.Char.GetPrimarySpouse.GetSheHe] does not. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] is shoveling gold into a hole that never seems to fill.\n\n"

 lmf_spouse.1250.desc.contrite:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] [ROOT.Char.GetPrimarySpouse.GetFaith.HouseOfWorship|l]'e sık sık gidiyor, kendisini dinleyecek herhangi bir [ROOT.Char.GetPrimarySpouse.GetFaith.PriestNeuter]'e içini döküyor... öyle ki [ROOT.Char.GetPrimarySpouse.GetFaith.PriestNeuterPlural] ondan bütünüyle kaçınmaya başladı. Üstelik yalnızca onlar değil. [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im gerçek ya da hayali hataları yüzünden vicdan azabı çekiyor ve aklını ancak nedametle rahatlatabildiği besbelli.\n\n"

 lmf_spouse.1250.desc.comfort_eater:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] yemek yiyor. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] sabah başlıyor; [ROOT.Char.GetPrimarySpouse.GetHerHis] kahvaltısını çoğu insanın bütün günde yediğinden büyük bir yemekle yapıyor. [ROOT.Char.GetPrimarySpouse.GetSheHe] [ROOT.Char.GetPrimarySpouse.GetHerselfHimself]'ini kekler, tatlılarla dolduruyor ve "little nothings", followed by an evening meal that [ROOT.Char.GetPrimarySpouse.GetSheHe] eats so quickly others in the room begin to stare. And still? Somehow [ROOT.Char.GetPrimarySpouse.GetSheHe]'s never sated.\n\n"

 lmf_spouse.1250.desc.inappetetic:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim] yemek yemiyor. [ROOT.Char.GetPrimarySpouse.GetHerHim]'i masada görüyorum; belli belirsiz bir tiksintiyle tabağındaki kırıntıları aval aval karıştırıyor, yemeğinin çoğuna dokunmuyor. [ROOT.Char.GetPrimarySpouse.GetHerHis] yemek #EMP yediğine#! dair ısrarına rağmen bu sürekli böyle. Elbette [ROOT.Char.GetPrimarySpouse.GetSheHe] yemek yemek zorunda, yoksa kim yaşayabilir ki; ama yine de bunu hiç görmüyorum. Her geçen gün [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin gözlerimin önünde biraz daha eridiğini izliyorum.\n\n"

 lmf_spouse.1250.desc.reclusive:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] kaybolacak, kimi zaman günlerce. Hizmetkârlar genellikle [ROOT.Char.GetPrimarySpouse.GetSheHe]'in nereye gittiğini bilir; [ROOT.Char.Custom('FortifiedBuilding')]'in daha kuytu bölgelerinden birine kapanır, ama bazen onu orada da bulamazlar. Çoğu zaman [ROOT.Char.GetPrimarySpouse.GetHerHim]'i odasında yalnız bulurum; pencereden dışarı bakar, az konuşur. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] dokunuşumdan irkilir ama yine de bir şey söylemez.\n\n"

 lmf_spouse.1250.desc.same:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] dürtülerini [ROOT.Char.GetPrimarySpouse.GetSheHe]'in sandığından daha iyi anlıyorum. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile [ROOT.Char.GetPrimarySpouse.GetHerHis] nöbetlerinden birinin ardından birbirimize attığımız manalı bakışlar, tuhaf biçimde, ilişkimizi iyileştirdi. Yine de bu iyi değil."

 lmf_spouse.1250.desc.default:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] dürtülerini anladığımı söyleyemem. [ROOT.Char.GetPrimarySpouse.GetHerHim] ile bu konuda konuşmayı denedim, bunun böyle süremeyeceğini anlatmayı denedim; ama bir yere varamıyor."

 lmf_spouse.1250.a:0 "Ne yazık ki, işler böyle."

 lmf_spouse.1260.t:0 "Eşim [spouse_stress.GetNameNoTooltip( ROOT.Char )|U] [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1260.desc.start:0 "Eşim [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'in görevleri "

 lmf_spouse.1260.desc.courtier:0 "burada, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de "

 lmf_spouse.1260.desc.ruler:0 "[ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [ROOT.Char.GetPrimarySpouse.GetHerHis] sarayında "

 lmf_spouse.1260.desc.mid:0 "çoğu zaman [ROOT.Char.GetPrimarySpouse.GetHerHim]'i bitkin ve stresli bırakıyor, doğru. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] bunu bana sık sık söylüyor. Ama son zamanlarda [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] o stresi verimli bir şeye yönlendirmeye başladı.\n\n"

 lmf_spouse.1260.desc.athletic:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe] her zaman atletik tipli biri olmuştu; [ROOT.Char.Custom('FortifiedBuilding')]'in çevresinde uzun yürüyüşlere çıkıyor - surların üstünde yürüyor, bahçelerin halini kontrol ediyor, hatta kimi zaman [ROOT.Char.Custom('FortifiedBuilding')] arazisinin çok ötesine kadar gidiyor. Bununla yetinmemiş; bunu hizmetkârlarla ve diğer halktan kişilerle bağ kurduğu bir zamana dönüştürdü. [ROOT.Char.GetPrimarySpouse.GetSheHe] her biriyle durup görüşüyor, [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki işlerin gidişatını ve ilerlemelerini konuşuyor; onlar da karşılığında [ROOT.Char.GetPrimarySpouse.GetHerHim]'i iyiden iyiye sevmeye başlamışlar. Görünüşe göre [ROOT.Char.GetPrimarySpouse.GetHerHis] gezilerinin her birini iple çekiyor, en yeni haberleri yalnızca [ROOT.Char.GetPrimarySpouse.GetHerHis] kulağına söylemek için saklıyorlar... [ROOT.Char.GetPrimarySpouse.GetHerHis] keyfi yerinde!\n\n"

 lmf_spouse.1260.desc.journaller:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe]'in yazdığı günlükleri gördüm; hem kapsamlılar hem de etkileyiciler. Bunlar, ilk başta sandığım gibi günün boş düşünceleri değil; [ROOT.Char.GetPrimarySpouse.GetHerHim]'i ilgilendiren çeşitli konularda keşifler. [ROOT.Char.GetPrimarySpouse.GetSheHe] bunların bazılarını, faydalanabileceğini (ve okuyabildiğini) düşündüğü bazı saraylılara bile gönderiyor ve her biri onları almaktan memnun olmuş görünüyor. Gördüklerime bakılırsa, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin bu günlüklerden bazılarını entelektüel bir uğraş olarak yayımlamak isteyip istemediğini merak ediyorum.\n\n"

 lmf_spouse.1260.desc.confider:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im konuşmayı sever, bilirsiniz. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] neredeyse herkesle, neredeyse her şey hakkında konuşur; ben de [ROOT.Char.GetPrimarySpouse.GetHerHim]'i neredeyse her gün yeni bulduğu biriyle gülerken görürüm. İlk başta bunun hepsi boş dedikodu sanıyordum; ama kısa sürede [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in, insanların [ROOT.Char.GetPrimarySpouse.GetHerHim]'e içini dökmesini sağlamada, kendisinin onlara içini dökmesinde olduğu kadar iyi olduğunu fark ettim. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] bu yolla [ROOT.Char.GetPrimarySpouse.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki olup bitenler hakkında epey bilgi ediniyor ve önemli olan her şeyi bana aktarıyor. Doğrusu, casusluk başkanı olacak yetenekte; her ne kadar [ROOT.Char.GetPrimarySpouse.GetSheHe] bunu sırf hoşuna gittiği için yaptığını iddia etse de.\n\n"

 lmf_spouse.1260.desc.canlearn:0 ""You could learn to do it as well," [ROOT.Char.GetPrimarySpouse.GetSheHe] told me one evening. "Who knows? It might even do you good.""

 lmf_spouse.1260.desc.same:0 "Bunu izlemekten o kadar keyif alıyorum ki; çünkü benim de aynı dürtülerim var ve [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile günün sonunda birbirimize attığımız manalı bakışlar bizi tuhaf biçimde birbirimize biraz daha yaklaştırdı."

 lmf_spouse.1260.desc.default:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis] yapabileceğime dair ısrarına rağmen, aynısını kendimin de yapabileceğinden emin değilim. Yine de görmek güzel."

 lmf_spouse.1260.a:0 "En azından sağlıklı bir çıkış yolu."

 lmf_spouse.1260.b:0 "Belki [ROOT.Char.GetPrimarySpouse.GetHerHim] gibi olabilirim..."

 lmf_spouse.1270.t:0 "Kara Bir Bulut"

 lmf_spouse.1270.desc:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin üzüntüsü, [home_ruler.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in üzerine bir duman gibi çökmüş durumda; tüm [home_ruler.Custom('FortifiedBuilding')]'i etkisi altına alan kara bir bulut.\n\nHizmetkârlar daha yavaş hareket ediyor, koridorlarda temkinli adımlarla süzülüyorlar. Dikkatle dinleyen biri, [ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] sessiz hıçkırıklarını [ROOT.Char.GetPrimarySpouse.GetHerHis] yatak odasından duyabilir. Kimi gün [ROOT.Char.GetPrimarySpouse.GetSheHe] iyi görünüyor; diğer günlerde mi? Sanki dünyadaki hiçbir güç [ROOT.Char.GetPrimarySpouse.GetHerHim]'i içinde boğulduğu umutsuzluktan çekip çıkaramaz.\n\nNe yapabilirim? [ROOT.Char.GetPrimarySpouse.GetHerHim] ile bunun hakkında konuşmayı denersem, [ROOT.Char.GetPrimarySpouse.GetSheHe] susuyor. [ROOT.Char.GetPrimarySpouse.GetHerHim]'e bağırabilir, meydan okuyabilir, en azından yataktan kalkıp #EMP denemesini#! yalvarabilirim... ama hiçbiri işe yaramıyor gibi.\n\nHer zaman bu kadar kötü değil. Bir zamanlar gülümseyen bir [ROOT.Char.GetPrimarySpouse.GetWifeHusband] hatırlıyorum sanki. Ama son zamanlarda bu, gerçekten de uzak bir anı gibi geliyor."

 lmf_spouse.1270.a:0 "Ne yapalım, durum bu."

 lmf_spouse.1270.b:0 "Daha çok çabalamalı ve [ROOT.Char.GetPrimarySpouse.GetHerHim]'in yanında olmalıyım."

 lmf_spouse.1270.success.tt:0 "[THIS.Char.GetPrimarySpouse.GetFirstName]'i [THIS.Char.GetPrimarySpouse.GetHerHis] karanlık ruh halinden çekip çıkarıyorsun"

 lmf_army.1270.success.title:0 "[THIS.Char.GetPrimarySpouse.GetFirstNameNoTooltip] yumuşuyor"

 lmf_spouse.1270.fail.tt:0 "[THIS.Char.GetPrimarySpouse.GetFirstName] girişiminden rahatsız oluyor"

 lmf_army.1270.fail.title:0 "[THIS.Char.GetPrimarySpouse.GetHerHim]'i etkilemeyi başaramıyorsun"

 lmf_spouse.1280.t:0 "Yaşlanan [ROOT.Char.GetPrimarySpouse.GetWifeHusband|U]"

 lmf_spouse.1280.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] yaşlanıyor.\n\nYine de mesele yalnızca [ROOT.Char.GetPrimarySpouse.GetHerHis] yaşı değil. "

 lmf_spouse.1280.desc.infirm:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] daha yavaş hareket ediyor, daha geç tepki veriyor. [ROOT.Char.GetPrimarySpouse.GetHerHis|U] teni sarkmaya başladı ve [ROOT.Char.GetPrimarySpouse.GetHerHis] uzuvları birer çöp gibi kuruyormuş gibi görünüyor. "It's just the infirmity of old age," [ROOT.Char.GetPrimarySpouse.GetSheHe] says dismissively whenever I bring the topic up. "There's nothing to be done about it." Even so, when I suggest that perhaps [ROOT.Char.GetPrimarySpouse.GetSheHe] needs to start being more careful, [ROOT.Char.GetPrimarySpouse.GetSheHe] denies that anything about [ROOT.Char.GetPrimarySpouse.GetHerHis] life needs to change.\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] may think that for now, but I'm starting to wonder if the time will soon come when we need to restrict [ROOT.Char.GetPrimarySpouse.GetHerHis] movements and have [ROOT.Char.GetPrimarySpouse.GetHerHim] constantly monitored for [ROOT.Char.GetPrimarySpouse.GetHerHis] own good... whether [ROOT.Char.GetPrimarySpouse.GetSheHe] likes it or not. "

 lmf_spouse.1280.desc.withering_mind:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe|U] bir şeyleri unutmaya başladı... kimi zaman basit şeyleri, mesela bir şeyi nereye koyduğunu ya da bir saraylının adını. Ama bazen [ROOT.Char.GetPrimarySpouse.GetHerHim]'i bir odada dikilirken görüyorum ve [ROOT.Char.GetPrimarySpouse.GetHerHis] yüzündeki korkudan, [ROOT.Char.GetPrimarySpouse.GetSheHe]'in nerede olduğunu büsbütün unuttuğu besbelli. Hatta [ROOT.Char.GetPrimarySpouse.GetHerHim]'i sessiz bir panik içinde bana bakarken yakaladım ve eminim [ROOT.Char.GetPrimarySpouse.GetSheHe] #EMP benim#! kim olduğumu bilmiyor!\n\nYine de [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] her zaman toparlanıyor; ama [ROOT.Char.GetPrimarySpouse.GetSheHe]'in toparlanamayacağı günün gelip gelmeyeceğini merak etmeye başladım. "

 lmf_spouse.1280.desc.clouded_eyes:0 "Dün gece [ROOT.Char.GetPrimarySpouse.GetHerHim]'in koridorda bana doğru yürüdüğünü gördüm; çok uzakta olmamama rağmen [ROOT.Char.GetPrimarySpouse.GetSheHe]'in beni görmediği besbelliydi. Sonunda, tam çarpışacakken [ROOT.Char.GetPrimarySpouse.GetHerHim]'e seslendim ve [ROOT.Char.GetPrimarySpouse.GetSheHe] telaşla yerinden sıçradı. "My eyes aren't what they used to be," [ROOT.Char.GetPrimarySpouse.GetSheHe] admitted with a chuckle... and that's very true. They're beginning to cloud over, however. Even I can see that.\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] is compensating for now, but I'm starting to wonder if the day will soon come when [ROOT.Char.GetPrimarySpouse.GetSheHe] will be completely blind. "

 lmf_spouse.1280.desc.faltering_heart:0 "Kısa bir yürüyüş bile [ROOT.Char.GetPrimarySpouse.GetHerHim]'i nefessiz bırakıyor; ara sıra [ROOT.Char.GetPrimarySpouse.GetHerHim]'i gözleri kapalı, eli [ROOT.Char.GetPrimarySpouse.GetHerHis] göğsünde, öylece dururken yakalıyorum. "My heart keeps racing," [ROOT.Char.GetPrimarySpouse.GetSheHe] explained after one of those occasions. "Sometimes it's all I can do even just to keep standing!" I tell [ROOT.Char.GetPrimarySpouse.GetHerHim] that [ROOT.Char.GetPrimarySpouse.GetSheHe] #EMP shouldn't #! keep standing, that [ROOT.Char.GetPrimarySpouse.GetSheHe] should lie down, but [ROOT.Char.GetPrimarySpouse.GetSheHe] waves away the concern.\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] doesn't think the problem a large one, but I'm starting to wonder if the day will come when [ROOT.Char.GetPrimarySpouse.GetHerHis] heart gives out completely. "

 lmf_spouse.1280.desc.fragile_bones:0 "Geçen yıl boyunca [ROOT.Char.GetPrimarySpouse.GetSheHe] ürkütücü sayıda yaralanma geçirdi: önemsiz gibi görünen bir düşüşün ardından kırık kalça, bir kayma sonrası kırık ayak bileği, merdivenlerde bir tökezleme sonrası [ROOT.Char.GetPrimarySpouse.GetHerHim]'i neredeyse en alta yuvarlayacak olan kırık bilek. Her seferinde durum bir öncekinden daha endişe verici; [ROOT.Char.GetPrimarySpouse.GetSheHe] endişemi geçiştirse de. "It's just my aging bones," [ROOT.Char.GetPrimarySpouse.GetSheHe] says dismissively. "What's the alternative? That I stay in bed and never emerge?"\n\nI can tell that [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] is more frightened of [ROOT.Char.GetPrimarySpouse.GetHerHis] situation than [ROOT.Char.GetPrimarySpouse.GetSheHe] lets on, and I'm starting to wonder if the time will come when we #EMP do #! need to restrict [ROOT.Char.GetPrimarySpouse.GetHerHis] movements for [ROOT.Char.GetPrimarySpouse.GetHerHis] own good. "

 lmf_spouse.1280.desc.same:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'e üzülüyorum. Yaşlılık beni de tıpatıp aynı biçimde yakaladı ve [ROOT.Char.GetPrimarySpouse.GetHerHim]'de önümde uzanan yolun bir aynasını görmek rahatsız edici."

 lmf_spouse.1280.desc.other:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'e üzülüyorum. Ben aynı şekilde mustarip olmasam da yaşlılık bana da kendi oyunlarını oynuyor. Görünüşe göre birlikte çöküp gideceğiz."

 lmf_spouse.1280.desc.old:0 "Ben de artık genç bir [ROOT.Char.GetWomanMan] değilim; ama yaşlılık bana, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'ime vurduğu kadar vurmadı henüz. O günün gelmesini de dört gözle beklemiyorum."

 lmf_spouse.1280.desc.default:0 "Belki bir gün, yaşlandığımda böyle olacağım. Şimdilik, en azından, bana kalan gençlik için şükretmeliyim."

 lmf_spouse.1280.a:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim] için zor olmalı."

 lmf_spouse.1280.a.rival:0 "Sanırım yakında [ROOT.Char.GetPrimarySpouse.GetHerHim]'den kurtulacağım, değil mi?"

 lmf_spouse.1290.t.reason:0 "Hâlâ Kudurmuş"

 lmf_spouse.1290.t.default:0 "Söylediğim bir şey mi var?"

 lmf_spouse.1290.desc.reason:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bana kızmaya devam ediyor. Sebepsiz değil, biliyorum. Yine de soğuk sessizliklere ve suçlayıcı bakışlara katlanmak zor.\n\n[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] ile sayısız kez konuşmayı denedim; özür dilemek ya da en azından kendimi anlatmak için; ama böyle zamanlarda [ROOT.Char.GetPrimarySpouse.GetSheHe]'in yaptığı tek şey çekip gitmekse kendimi şanslı sayıyorum. Genellikle bu konuşmalar bir başka tartışmayla biter; [ROOT.Char.Custom('FortifiedBuilding')] hizmetkârlarını kaçıran bir tartışmayla.\n\n"

 lmf_spouse.1290.desc.default.start:0 "Son zamanlarda [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im bana kudurmuş durumda.\n\nKeşke kesin nedenini bildiğimi söyleyebilseydim. "

 lmf_spouse.1290.desc.lover:0 "Normalde [ROOT.Char.GetPrimarySpouse.GetSheHe] öyle sevgi dolu bir [ROOT.Char.GetPrimarySpouse.GetWomanMan] ki... [ROOT.Char.GetPrimarySpouse.GetHerHim]'e ne oldu böyle? "

 lmf_spouse.1290.desc.friend:0 "Normalde [ROOT.Char.GetPrimarySpouse.GetHerHim]'i bir [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'den fazlası sayarım. [ROOT.Char.GetPrimarySpouse.GetSheHe|U] dostum. Ama şimdi...? [ROOT.Char.GetPrimarySpouse.GetHerHim]'e ne oldu böyle? "

 lmf_spouse.1290.desc.warm:0 "Normalde aramız görece sıcaktır; [ROOT.Char.GetHerHis] [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'i ile olunabilecek kadar sıcak. Ama şimdi...? "

 lmf_spouse.1290.desc.cool:0 "Çoğu gün aramızın pek iyi olmadığını söyleyebilirim; yine de [ROOT.Char.GetPrimarySpouse.GetHerHim] kendini açıklamadan böyle öfke patlamaları yaşadığını nadiren görüyorum. Ama şimdi...?"

 lmf_spouse.1290.desc.default.end:0 "Yanlış bir şey mi söyledim? [ROOT.Char.GetPrimarySpouse.GetSheHe]'in içerlediği bir şey mi yaptım? [ROOT.Char.GetPrimarySpouse.GetSheHe|U] sadece söylemiyor.\n\n"

 lmf_spouse.1290.desc.end:0 "Son zamanlarda, en azından, [ROOT.Char.GetPrimarySpouse.GetHerHis] tavrının yumuşadığı hissine kapılıyorum. Sanırım içten bir girişimde bulunursam [ROOT.Char.GetPrimarySpouse.GetSheHe] sonunda bir özrü dinlemeye razı olabilir. Ya da işleri daha da kötüleştirebilir."

 lmf_spouse.1290.a:0 "Öyleyse en iyisi deneyeyim."

 lmf_spouse.1290.a.success:0 "[angry_spouse.GetFirstNameNoTooltip] özrünü kabul ediyor"

 spouse_apologized_profusely:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] ile ilişkisi, [CharYouSheHe(CHARACTER)] defalarca özür diledikten sonra dikkat çekici şekilde iyileşti."

 spouse_apologized_profusely_corresponding:0 "[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [CHARACTER.GetShortUINameNoTooltipNoFormat] ile ilişkisi, [CharYouSheHe(TARGET_CHARACTER)] defalarca özür diledikten sonra dikkat çekici şekilde iyileşti."

 lmf_spouse.1290.a.failure:0 "Çabaların [angry_spouse.GetHerHim]'i daha da öfkelendiriyor"

 lmf_spouse.1290.b:0 "Bence uyuyan köpekleri uyandırmamalı."

 lmf_spouse.1300.t:0 "Arayı Düzeltme Zamanı mı?"

 lmf_spouse.1300.desc.reason:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramız, çok haklı nedenlerden ötürü, iyi değil.\n\n"

 lmf_spouse.1300.desc.default:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle ilişkim, en iyi ihtimalle, soğuk oldu. Eşler arasında bile yakın sayılmayız.\n\n"

 lmf_spouse.1300.desc.mid:0 "O yüzden, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] bugün, görünüşte pişmanlık içinde yanıma geldiğinde şaşırdığımı itiraf ederim. "

 lmf_spouse.1300.desc.reason2:0 ""I'd like to ask for your forgiveness, [ROOT.Char.GetFirstNameNoTooltip]. I may not deserve it, yet I ask anyhow. "

 lmf_spouse.1300.desc.default2:0 ""I know things have been... difficult, and I haven't been the best [ROOT.Char.GetPrimarySpouse.GetWifeHusband] to you. "

 lmf_spouse.1300.desc.end:0 "İşlerin daha iyi olmasını isterdim."\n\n"You would?" I asked. "Why now?"\n\n"Because I'm tired of fighting you. As tired as you are of fighting me, I think." [ROOT.Char.GetPrimarySpouse.GetSheHe|U] paused, taking a deep breath. "If you're willing, that is.""

 lmf_spouse.1300.a:0 "Bu iyi haber."

 was_apologized_to_profusely:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] ile ilişkisi, [CharYouSheHe(TARGET_CHARACTER)] geçmişteki hataları telafi etmeye çalıştıktan sonra iyileşti."

 was_apologized_to_profusely_corresponding:0 "[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [CHARACTER.GetShortUINameNoTooltipNoFormat] ile ilişkisi, [CharYouSheHe(CHARACTER)] geçmişteki hataları telafi etmeye çalıştıktan sonra iyileşti."

 lmf_spouse.1300.b:0 "Hayır, işler olduğu gibi iyi."

 lmf_spouse.1310.t:0 "Harika [good_child.Custom('GetDaughterSon')|U]"

 lmf_spouse.1310.desc.start:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle yakın zamanda [ROOT.Char.Custom('FortifiedBuilding')] avlusundaydık,"

 lmf_spouse.1310.desc.courtier.child:0 "genç [good_child.GetFirstNameNoTooltip]'i oynarken izlemek,"

 lmf_spouse.1310.desc.courtier.adult:0 "genç [good_child.GetFirstNameNoTooltip]'i [good_child.GetHerHis] gündelik işlerini yaparken izlemek,"

 lmf_spouse.1310.desc.default:0 "yakın zamanda yapılan bir ziyaretin ardından [good_child.GetFirstNameNoTooltip] ile vedalaşmışken,"

 lmf_spouse.1310.desc.mid:0 "ve [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] aniden bana dönüp gülümsedi.\n\n"[good_child.GetSheHe|U]'s a good [good_child.Custom('GetLassLad')], isn't [good_child.GetSheHe]? A fine [good_child.Custom('GetDaughterSon')]."\n\nI had to smile. "That [good_child.GetSheHe] is."\n\n"And we made [good_child.GetHerHim]."\n\n"

 lmf_spouse.1310.desc.rival:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle pek çok konuda - gerçekten her konuda - aynı fikirde olmayabilirim; ama bu konuda? [good_child.Custom('GetDaughterSon')]'imizi iyi yetiştirdik. Birlikte."

 lmf_spouse.1310.desc.lover:0 "O an [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imi daha çok sevmek mümkün olsaydı, severdim. [ROOT.Char.GetPrimarySpouse.GetHerHis] gözlerindeki parıltı her şeydi."

 lmf_spouse.1310.desc.friend:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'ime her zaman düşkündüm; ve o an, dost olmanın yanı sıra gerçek birer yol arkadaşı olmanın ne kadar şanslı bir şey olduğunu anladım."

 lmf_spouse.1310.desc.warm:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramız sıcak; sevgi dolu olmasa da. Ama o an, bazen gerçek ortaklıkların en iyisi olduğunu kabul etmek zorunda kaldım."

 lmf_spouse.1310.desc.cool:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramız en sıcak ilişki sayılmaz, en kibar tabirle. Pek az konuda anlaşırız. Ama bu konuda mı? [good_child.Custom('GetDaughterSon')]'imizi iyi yetiştirdik. Birlikte."

 lmf_spouse.1310.a:0 "Aferin, diyorum."

 lmf_spouse.1320.t:0 "Boş Bir [ROOT.Char.Custom('FortifiedBuilding')|U]"

 lmf_spouse.1320.desc:0 "Bu akşam karımı [ROOT.Char.Custom('FortifiedBuilding')] çalışma odasında buldum ve çeşitli mektupları ayıklamakta olduğunu fark ettim. Bunda hiçbir olağanlık yok; yalnızca gözlerinin yaşlı ve kızarmış olduğunu, sanki ağlamış gibi göründüğünü de fark ettim.\n\n"What's wrong, my love?" I asked, suddenly concerned.\n\n"It's nothing," she said. When she noticed my concern hadn't lessened, she sighed and showed me the letters. "These are letters. From our children. I don't normally get them all at once, but they all arrived within the last few days."\n\n"And that's... a bad thing?"\n\nShe chuckled. "It just reminded me that they're all grown up and gone. The [ROOT.Char.Custom('FortifiedBuilding')] was once so full, it seems like it was yesterday, but it's quieter now." Her eyes filled with tears once again. "And there won't be any more children, not from me."\n\nShe wasn't truly unhappy, I knew that, but I hugged her anyhow and reminded her that we still had each other."

 lmf_spouse.1320.a:0 "İşler basitçe böyle."

 lmf_spouse.1330.t:0 "Vefat Edenleri Anmak"

 lmf_spouse.1330.desc.start:0 "İş için [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] yakınlarındaki bir kasabadan geçerken yerel bir kadı, [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin yerel bir [ROOT.Char.GetPrimarySpouse.GetFaith.HouseOfWorship|l]'i ziyaret etmekte olduğunu bildirdi... bu bir sürprizdi, her ne kadar kadıya söylemesem de.\n\nNitekim [ROOT.Char.GetPrimarySpouse.GetHerHim]'i daha sonra orada buldum; sunağın yanında, üzgün üzgün oturuyordu. "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]? Is something amiss?" I asked.\n\nMy presence took [ROOT.Char.GetPrimarySpouse.GetHerHim] by surprise, but [ROOT.Char.GetPrimarySpouse.GetSheHe] quickly recovered [ROOT.Char.GetPrimarySpouse.GetHerHis] composure. "I... was just thinking of my [ROOT.Char.GetPrimarySpouse.Custom2('LMF_RelationToMeShort', SCOPE.sC('dead_relative'))|l]."\n\nAh, that made sense. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('dead_relative'))] died "

 lmf_spouse.1330.desc.month:0 "daha geçenlerde. [dead_relative.GetSheHe] elbette [ROOT.Char.GetPrimarySpouse.GetFirstNamePossessiveNoTooltip] aklında olacaktı.\n\n"

 lmf_spouse.1330.desc.6month:0 "birkaç ay önce. Cenazenin üzerinden çok geçmesine rağmen [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in şimdi burada olması tuhaf; ama [dead_relative.GetHerHim]'i [ROOT.Char.GetPrimarySpouse.GetSheHe] kadar tanımıyordum.\n\n"

 lmf_spouse.1330.desc.year:0 "sanırım neredeyse bir yıl önce. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]'in bu kadar uzun zaman sonra burada olması tuhaf; ama [dead_relative.GetHerHim]'i [ROOT.Char.GetPrimarySpouse.GetSheHe] kadar tanımıyordum.\n\n"

 lmf_spouse.1330.desc.rival:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imle aramız pek dostça sayılmaz; yine de "

 lmf_spouse.1330.desc.lover:0 "Bu benim canımdan çok sevdiğimdi; o yüzden "

 lmf_spouse.1330.desc.friend:0 "[ROOT.Char.GetPrimarySpouse.GetWifeHusband]'im aynı zamanda dostum; o yüzden "

 lmf_spouse.1330.desc.default:0 "Bir sakınca görmedim, o yüzden " 

 lmf_spouse.1330.desc.end:0 "Oturup [ROOT.Char.GetPrimarySpouse.GetWifeHusband]'imin [dead_relative.GetHerHim] hakkında konuşmasını dinledim. [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] kalkmaya hazır olana dek saatler geçti; [ROOT.Char.GetPrimarySpouse.GetSheHe]'in eşliğime minnettar olduğunu anlayabiliyordum."

 lmf_spouse.1330.a:0 "[ROOT.Char.GetPrimarySpouse.GetHerHim]'in yanında olduğuma sevindim."

 lmf_spouse.1340.t:0 "[ROOT.Char.GetPrimarySpouse.GetHerHis|U] Dikeni"

 lmf_spouse.1340.desc.start:0 ""I want [bastard_child.GetHerHim] #EMP gone#!."\n\nThis wasn't the first time my [ROOT.Char.GetPrimarySpouse.GetWifeHusband] had brought up the presence of my bastard [bastard_child.Custom('GetDaughterSon')] at my court in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], but it was the first time [ROOT.Char.GetPrimarySpouse.GetSheHe]'d actually demanded that I send [bastard_child.GetFirstNameNoTooltip] away. I sighed, seeing that [ROOT.Char.GetPrimarySpouse.GetSheHe] was determined to have [ROOT.Char.GetPrimarySpouse.GetHerHis] way. "

 lmf_spouse.1340.desc.child:0 ""[bastard_child.GetSheHe|U]'s a #EMP child #!, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]," I objected.\n\n"That's the point! [bastard_child.GetSheHe|U] is not #EMP my #! child! "

 lmf_spouse.1340.desc.adult:0 ""[bastard_child.GetSheHe|U]'s my #EMP [bastard_child.Custom('GetDaughterSon')] #!, [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]," I objected.\n\n"[bastard_child.GetSheHe|U]'s a fully grown [bastard_child.GetWomanMan]! "

 lmf_spouse.1340.desc.end:0 "[bastard_child.GetHerHim]'i sarayda tutmanın beni nasıl göstereceğine dair fikrin var mı? #EMP Umurunda mı#!?!"\n\nWith that, [ROOT.Char.GetPrimarySpouse.GetSheHe] turned and stormed out of the room... though I could tell that wasn't going to be the last I'd hear on the topic."

 lmf_spouse.1340.a:0 ""Very well, I'll send [bastard_child.GetHerHim] to [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('bastard_home'))]'s court.""

 had_me_sent_away_from_court:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetShortUINamePossessiveNoFormat] [TARGET_CHARACTER.Custom('GetMotherFatherOpposite')|l]'ini [CharYouHerHim(CHARACTER)]'i saraydan kovmaya zorladı."

 had_me_sent_away_from_court_corresponding:0 "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoFormat] [CHARACTER.Custom('GetMotherFatherOpposite')|l]'ini [CharYouHerHim(TARGET_CHARACTER)]'i saraydan kovmaya zorladı."

 lmf_spouse.1340.b:0 ""Fine. Out [bastard_child.GetSheHe] goes. Are you happy?!""

 lmf_spouse.1340.c:0 ""No. [bastard_child.GetSheHe|U]'s my [bastard_child.Custom('GetDaughterSon')] and thus my responsibility.""

 refused_to_kick_bastard_child:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoFormat] [CharYouSheHe(CHARACTER)]'in [CharYourHerHis(CHARACTER)] piç çocuğunu saraydan kovma talebini reddetti."

