 intro_marriage_notification_recipient_personal_matri:0 "İkiniz arasında anasoylu bir evlilik olması için [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.GetShortUIName] ile tanışman amacıyla [actor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'e gelmeye davet ediyorum... tabii ziyaretin sonunda ikiniz de razıysanız."

