 lmf_interaction.1329.desc.secrec.both.hike:0 "Yürüyüş sırasındaki sohbetimiz çabucak tartışmaya ve soğuk sessizliklere dönüştü. [secondary_actor.GetFirstNameNoTooltip] amansız bir tempo tutturdu ve arazideki aşinalık eksikliğimden rahatsız olmuş görünüyordu. "

