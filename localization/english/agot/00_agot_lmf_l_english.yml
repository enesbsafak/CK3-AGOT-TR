 agot_court_outcome.2003.t:0 "İzin Verildi!"

 agot_court_outcome.2003.proposer:0 "Harika haber! [permission_granter.GetTitledFirstNameNoTooltip], [proposer_target.GetTitledFirstNameNoTooltip] ve benim evlenmemize izin verdi! [proposer.GetCurrentLocation.GetName]'deki yerel bir [proposer.GetFaith.HouseOfWorship]'de, olayın aniliği karşısında şaşkına dönmüş yaşlı bir [proposer.GetFaith.DevoteeNeuterPlural] tarafından yönetilen küçük bir tören yapıldı... ama umurumda değil. Hayatımın aşkıyla evlendim ve iş tamam!"

 agot_court_outcome.2003.proposer_target:0 "Harika haber! [proposer.GetTitledFirstNameNoTooltip], [proposer.GetSheHe] ve benim evlenmemiz için izin aldı! [proposer_target.GetCurrentLocation.GetName]'deki yerel bir [proposer_target.GetFaith.HouseOfWorship]'de, olayın aniliği karşısında şaşkına dönmüş yaşlı bir [proposer_target.GetFaith.DevoteeNeuterPlural] tarafından yönetilen küçük bir tören yapıldı... ama umurumda değil. Hayatımın aşkıyla evlendim ve iş tamam!"

 agot_court_outcome.2003.a:0 "Bu günü asla unutmayacağım!"

