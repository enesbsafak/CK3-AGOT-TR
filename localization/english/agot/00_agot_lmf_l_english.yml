 lmf_interaction.1311.t:0 "Varış"

 lmf_interaction.1311.initial.secrep:0 "Nihayet günün erken saatlerinde [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e ulaşıyorum ve [actor.Custom('FortifiedBuilding')] avlusunda beni [secondary_actor.GetTitledFirstNameNoTooltip] [secondary_actor.GetHerselfHimself]'inden başkası karşılamıyor.\n\n"

 lmf_interaction.1311.initial.actor:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] nihayet günün erken saatlerinde [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e ulaştı; ben de [secondary_recipient.GetHerHim]'i bizzat karşılamak ve yorucu yolculuklarının ardından [secondary_recipient.GetHerHis] alayını ağırlamaları için hizmetkârlara talimat vermek üzere yola koyuldum.\n\n"

 lmf_interaction.1311.initial:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] nihayet günün erken saatlerinde [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e ulaştı ve [ROOT.Char.Custom('FortifiedBuilding')] avlusunda kendisini [secondary_actor.GetTitledFirstNameNoTooltip] [secondary_actor.GetHerselfHimself]'inden başkası karşılamadı.\n\n"

 lmf_interaction.1311.act.pleased.secrep:0 "[secondary_actor.GetSheHe|U] beni zarafetle karşıladı; [secondary_actor.GetSheHe] beni süzerken [secondary_actor.GetHerHis] yüzünde bir onay izi sezdiğimi sandım. Belki [secondary_actor.GetSheHe] fark etmeyeceğimi düşündü?\n\n"

 lmf_interaction.1311.act:0 ""

 lmf_interaction.1311.secact.pleased.secrep:0 "İtiraf edeyim, [secondary_actor.GetSheHe]'in beni gördüğüne memnun görünmesi beni hoş bir şekilde şaşırttı. [secondary_actor.GetSheHe|U] derin bir eğilip [secondary_actor.GetHerHis] [secondary_actor.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))] adına beni karşıladı; ama [secondary_actor.GetHerHim]'in beni de dikkatle süzdüğünü görebiliyordum.\n\n"

 lmf_interaction.1311.act.displeased.secrep:0 "Davet [secondary_actor.GetHerHim]'den gelmiş olmasına rağmen, [secondary_actor.GetSheHe]'in beni gördüğüne pek memnun olmuş görünmediğini söyleyemem. [secondary_actor.GetSheHe] fikrini mi değiştirdi? Görünüşümü mü beğenmedi? Öyleyse daha şimdiden dezavantajlı durumdayım gibi.\n\n"

 lmf_interaction.1311.secact.displeased.secrep:0 "[secondary_actor.GetSheHe] hoş bir tavır takınsa da beni gördüğüne pek memnun olmuş görünmediğini söyleyemem. Belki davet [secondary_actor.GetHerHis] fikri değildi ve [secondary_actor.GetSheHe] bu evliliğe karşı? Öyleyse önümde çok iş var.\n\n"

 lmf_interaction.1311.secact.pleased:0 "Neyse ki [secondary_actor.GetSheHe] ziyaret fikrinden ve potansiyel olarak temsil ettiği şeyden hâlâ memnun görünüyor; [secondary_actor.GetSheHe] [secondary_recipient.GetHerHim]'i karşılarken yaptıkları ilk konuşmalar da bu izlenimi hiç bozmadı.\n\n"

 lmf_interaction.1311.secact.displeased:0 "Ne yazık ki [secondary_actor.GetSheHe]'in ziyaret fikrinden ve potansiyel olarak temsil ettiği şeyden hâlâ hoşlanmadığı açıktı; [secondary_actor.GetSheHe] [secondary_recipient.GetTitledFirstNameNoTooltip]'i resmen karşılarken gösterdiği soğukluk, sürecin üzerine anında bir soğukluk çöktürdü.\n\n"

 lmf_interaction.1311.reaction.secrep:0 ""

 lmf_interaction.1311.reaction.actor.pleased:0 "[secondary_recipient.GetSheHe|U] beni gördüğüne memnun görünüyordu; [secondary_recipient.GetSheHe] beni süzerken [secondary_recipient.GetHerHis] yüzünde bir onay izi sezdiğimi sandım. [secondary_recipient.GetFirstNameNoTooltip] bu evlilik fikrinden hoşlanıyorsa, bu yaklaşan ziyareti ikimiz için de o kadar kolaylaştırır.\n\n"

 lmf_interaction.1311.reaction.pleased:0 "Bu arada [secondary_recipient.GetTitledFirstNameNoTooltip] samimi ve terbiyeliydi. Hatta [secondary_recipient.GetSheHe] işlerin başlaması için can atıyordu.\n\n"

 lmf_interaction.1311.reaction.actor.displeased:0 "[secondary_recipient.GetSheHe|U] beni gördüğüne pek memnun olmamış gibiydi, diye düşündüm. Soğuk ve gergin; belki tüm ziyareti ve temsil ettiği şeyi onaylamıyor. Öyleyse işler zorlaşabilir.\n\n"

 lmf_interaction.1311.reaction.displeased:0 "Bu arada [secondary_recipient.GetTitledFirstNameNoTooltip] gergin ve kasılmıştı. [secondary_recipient.GetSheHe]'in tüm ziyaretten rahatsızlık duyduğu açıktı... ya da belki uzun yolculuktan fazlasıyla bitap düşmüştü. Göreceğiz.\n\n"

 lmf_interaction.1311.us.end:0 "Asıl tanışma iki gün sonra başlayacak; baş başa vakit geçirip birbirimizi daha iyi tanıyacağız."

 lmf_interaction.1311.end:0 "Asıl tanışma iki gün sonra başlayacak; ikisi de baş başa vakit geçirip birbirlerini daha iyi tanıyacak."

 lmf_interaction.1311.a:0 "Bakalım nasıl gidecek, değil mi?"

 lmf_interaction.1312.t:0 "Bir Destek Talebi"

 lmf_interaction.1312.desc.start:0 "O gece ilerleyen saatlerde [secondary_recipient.GetTitledFirstNameNoTooltip] benimle özel konuşmaya geldi.\n\n"I truly do wish to marry"

 lmf_interaction.1312.desc.name:0 "[secondary_actor.GetFirstNameNoTooltip],"

 lmf_interaction.1312.desc.stranger:0 "senin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('secondary_actor'))]'in,"

 lmf_interaction.1312.desc.end:0 "[ROOT.Char.GetLadyLord]'im. Korktuğum şey, [secondary_actor.GetSheHe]'in benimle evlenmek istemeyebileceği."\n\n"So why come to me?" I asked.\n\n"Because I wish your support." The [secondary_recipient.Custom('polite_gender_ref')] was clearly nervous, but I could see [secondary_recipient.GetHerHim] steeling [secondary_recipient.GetHerselfHimself] as we spoke. "[secondary_actor.GetTitledFirstNameNoTooltip] trusts your judgment. You are [secondary_actor.GetHerHis] [secondary_actor.Custom2('LMF_RelationToMeShort', ROOT.Char )]. If you were to support my cause tomorrow, maybe..."\n\nI suspect the [secondary_recipient.Custom('polite_gender_ref')] overestimates the effect of my good opinion on [secondary_actor.GetFirstNameNoTooltip], but perhaps [secondary_recipient.GetSheHe] is right."

 lmf_interaction.1312.a:0 "[secondary_recipient.GetHerHis] davasını sessizce destekleyeceğim."

 lmf_interaction.1312.b:0 "[secondary_recipient.GetSheHe|U] yapayalnız."

 lmf_interaction_intro_chance_pos_tt:0 "Tanışmanın başarılı sonuçlanma şansı #positive_value artar#!"

 lmf_interaction_intro_chance_neg_tt:0 "Tanışmanın başarılı sonuçlanma şansı #negative_value azalır#!"

 lmf_interaction.1313.t:0 "Endişe Verici Davranış"

 lmf_interaction.1313.desc.start:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de ağırlandı; ilk başta her şey sakin görünüyordu ve herkes ertesi günkü usulüne uygun tanışmalara hazır olacaktı.\n\nSonra, o akşam ilerleyen saatlerde, bir hizmetkâr beni şu haberle uyandırdı: "

 lmf_interaction.1313.desc.lunatic:0 "[secondary_recipient.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom('FortifiedBuilding')]'in koridorlarında, üzerinde bir çul bile olmadan, çılgınca gülerek dolaşırken bulunmuştu.\n\nHizmetkârlar sonunda [secondary_recipient.GetHerHim]'i sakinleştirip [secondary_recipient.GetHerHis] odasına geri götürebildi; "

 lmf_interaction.1313.desc.lustful:0 "[secondary_recipient.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom('FortifiedBuilding')]'den gizlice çıkıp yakındaki bir köye gitmiş ve orada birkaç yerliyle tartışmaya girmişti... görünüşe göre [secondary_recipient.GetHerHis] 'ahlaksız davranışları' yüzünden.\n\nMuhafızlarım [secondary_recipient.Custom('polite_gender_ref')]'i tanıdı ve daha fazla bela çıkmadan [secondary_recipient.GetHerHim]'i geri getirdi; "

 lmf_interaction.1313.desc.sadistic:0 "[secondary_recipient.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom('FortifiedBuilding')]'in hizmetçilerinden biriyle kavga etmişti. Hizmetçi, görünüşe göre [secondary_recipient.Custom('polite_gender_ref')]'in odasına izinsiz girmiş ve [secondary_recipient.GetTitledFirstNameNoTooltip]'ten öyle bir azar işitmişti ki [ROOT.Char.Custom('FortifiedBuilding')]'in neredeyse yarısı araya girmek için oraya üşüştü. Hizmetçi, [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] zalim huyu yüzünden sarsılmış olsa da, çoğunlukla iyi durumda; "

 lmf_interaction.1313.desc.end:0 "gerçek bir zarar olmadı; ama yine de... endişe verici.\n\nDaha da kötüsü, görünüşe göre [secondary_actor.GetFirstNameNoTooltip] de olayı benimle aynı anda duydu."

 lmf_interaction.1313.a:0 "Sanırım hiç yaşanmamış gibi davranmamız gerekecek."

 lmf_interaction.1314.t:0 "Salonda Kavga"

 lmf_interaction.1314.desc:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de ağırlandı; ilk başta her şey iyi gidiyor gibiydi. [secondary_actor.GetFirstNameNoTooltip]'in katılmadığı küçük, samimi bir akşam yemeği verildi ve işte o akşam her şey ters gitmeye başladı.\n\n[secondary_recipient.GetTitledFirstNameNoTooltip] en başından beri kötü bir ruh halindeymiş gibi görünüyordu, o yüzden [secondary_recipient.GetHerHim]'den uzak durdum... bu yüzden bağırmalar başlayana dek ne olduğunu görmedim. [secondary_recipient.GetTitledFirstNameNoTooltip], [your_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]'e küfürler savurmaya başladı; ikisi arasındaki bağrışmalar o kadar kızıştı ki ayırmasalar neredeyse kavga edeceklerdi!\n\nBuna neyin yol açtığı önemli değil. Önemli olan şu ki [your_courtier.GetFirstNameNoTooltip] tüm bu yaşananlardan inanılmaz derecede utandı, her şey herkesin gözü önünde oldu ve [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] korkunç davranışlarını duydu."

 lmf_interaction.1314.a:0 "Talihsizlik."

 fought_during_introduction:0 "[CHARACTER.GetShortUIName] ve [TARGET_CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] evlilik tanışması sırasında düello ettikten sonra düşman oldular."

 fought_during_introduction_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] ve [CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessiveNoTooltip] evlilik tanışması sırasında düello ettikten sonra düşman oldular."

 lmf_interaction.1315.t:0 "Hiçbir Yerde Bulunamıyor"

 lmf_interaction.1315.desc:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti gece için ağırlandıktan sonra, herkes çekilmeden önce küçük ve samimi bir toplantı düzenlemeyi düşündüm. [secondary_recipient.GetHerHim]'in, üzerlerinde yüz çift gözün baskısı olmadan [secondary_actor.GetFirstNameNoTooltip] ile konuşması için bir fırsattı.\n\nNe var ki [secondary_recipient.GetTitledFirstNameNoTooltip] hiçbir yerde bulunamadı.\n\nBir süre [secondary_recipient.Custom('polite_gender_ref')]'in kaybolduğunu, hatta kaçırıldığını düşündük! [secondary_recipient.GetSheHe|U] yatak odasında yoktu, büyük salonda yoktu. [secondary_recipient.GetHerHis] kendi hizmetkârları bile şaşkına dönmüştü. Bir arama ekibi toplandı.\n\nDerken, herkes bir saatten fazla panikle aradıktan sonra, hizmetçilerimden biri [secondary_recipient.GetHerHim]'i çalışma odasında buldu. [secondary_recipient.GetSheHe|U], görünüşe göre, bu kadar çok yabancıyla tanışmanın stresi yüzünden oraya saklanmıştı; arandığının bile farkında değildi.\n\n[secondary_actor.GetFirstNameNoTooltip] hiç etkilenmemişti."

 lmf_interaction.1315.a:0 "Doğrusu, ben de öyleydim."

 lmf_interaction.1316.t:0 "Akşam Yemeğini Bozmak"

 lmf_interaction.1316.desc.start:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti gece için ağırlandıktan sonra büyük salonda küçük bir akşam yemeği verdim. Bence bu, [secondary_actor.GetFirstNameNoTooltip] ile [secondary_recipient.Custom('polite_gender_ref')]'in yarınki daha resmi tanışmadan önce konuşması için bir fırsattı.\n\nİşler iyi gitmedi.\n\n"

 lmf_interaction.1316.desc.gluttonous:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] neredeyse hiç konuşmadı; ne [secondary_actor.GetFirstNameNoTooltip] ile ne de başkasıyla. [secondary_recipient.GetSheHe|U] yalnızca yemeğe önem veriyordu; tabağına değen her şeyi ağzına tıkıştırıyordu. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('secondary_actor'))]'imin [secondary_recipient.GetHerHim]'i sohbete katma girişimlerine, höpürtüler arasında zar zor duyulan mırıltılarla karşılık verildi.\n\n"

 lmf_interaction.1316.desc.paranoid:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] açıkça orada olmak istemiyordu. [secondary_recipient.GetSheHe|U] kendisiyle konuşulunca irkiliyor, [secondary_recipient.GetHerHis] gözlerini her kapıda tutuyor ve bir hizmetkâr yaklaştığında şüpheyle bakıyordu. İnsan onu öldürmeye çalışıyoruz sanırdı! [secondary_actor.GetFirstNameNoTooltip] bile etkileşim kurmaya çalıştığında bakışlardan fazlasını alamadı.\n\n"

 lmf_interaction.1316.desc.lazy:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] açıkça orada olmak istemiyordu. [secondary_recipient.GetSheHe|U] geç geldi, esneyerek ve pek de etkileyici olmayan bir kılıkla; yemeğin çoğunu dalgın dalgın [secondary_recipient.GetHerHis] yemeğini karıştırıp esneyerek geçirdi. [secondary_actor.GetFirstNameNoTooltip] yolculuğun [secondary_recipient.GetHerHim]'i yorup yormadığını manalı bir şekilde sorunca [secondary_actor.GetSheHe] "not really" as a response, and that was the end of that.\n\n"

 lmf_interaction.1316.desc.fallthrough:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] sohbete katılmak için [secondary_recipient.GetHerHis] elinden geleni yapıyor gibiydi; ama [secondary_recipient.GetSheHe] beceriksizdi ve açıkça rahatsızdı. Belki [secondary_recipient.GetSheHe] kendi ortamının dışındaydı ya da yolculuktan bitap düşmüştü? Her halükârda, bu ıstırap verici bir yemekti; [secondary_actor.GetFirstNameNoTooltip] izin isteyip kalktığında [secondary_recipient.Custom('polite_gender_ref')]'in yüzündeki apaçık rahatlama işleri pek düzeltmedi.\n\n"

 lmf_interaction.1316.desc.end:0 "Umarız yarınki tanışma işleri tersine çevirir; çünkü bu pek de iyi bir başlangıç değildi."

 lmf_interaction.1316.a:0 "Daha iyi gidebilirdi."

 lmf_interaction.1317.t:0 "İyi Bir İzlenim"

 lmf_interaction.1317.desc.start:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti gece için ağırlandıktan sonra büyük salonda küçük bir akşam yemeği verdim. Bence bu, [secondary_actor.GetFirstNameNoTooltip] ile [secondary_recipient.Custom('polite_gender_ref')]'in yarınki daha resmi tanışmadan önce konuşması için bir fırsattı.\n\nİşler umduğumdan daha iyi gitti.\n\n"

 lmf_interaction.1317.desc.gregarious:0 "[secondary_recipient.GetTitledFirstNameNoTooltip], büyük salona adım attığı andan itibaren ilginin odağıydı. [secondary_recipient.GetHerHis] gülümsemesi, [secondary_recipient.GetHerHis] kahkahası, kendisiyle konuşulduğunda dikkatle dinleyişi... hepsi ortamı epey neşelendirdi. [secondary_actor.GetFirstNameNoTooltip] bile [secondary_actor.GetHerselfHimself]'ini kıkırdarken buldu.\n\n"

 lmf_interaction.1317.desc.diligent:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ağırbaşlılığın ve görgünün ta kendisiydi; herkesi sohbete katmaya özen gösteriyor, konuştuklarında can kulağıyla dinliyordu. [secondary_recipient.GetSheHe] dikkatini sana çevirdiğinde kendini dışlanmış hissetmek zordu. [secondary_recipient.GetTitledFirstNameNoTooltip], [secondary_actor.GetHerHim]'i hafif bir şakalaşmaya çektiğinde [secondary_actor.GetFirstNameNoTooltip] bile açıkça etkilenmişti; masadakilerin keyfi yerindeydi.\n\n"

 lmf_interaction.1317.desc.temperate:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] görgünün ve itidalin ta kendisiydi. [secondary_recipient.GetSheHe|U] içkiye düşkünlük göstermedi, yemeğinden yalnızca küçük bir porsiyon yedi; ama hepsini öyle bir zarafetle yaptı ki [secondary_recipient.GetSheHe] gibi yemediği için kimse obur hissetmedi. İçmeyen bir [secondary_recipient.Custom('WomanManGirlBoy')]'i küçümseyecekler olsa da, [secondary_actor.GetFirstNameNoTooltip] bunu fazlasıyla fark etti... ve açıkça onayladı.\n\n"

 lmf_interaction.1317.desc.fallthrough:0 "[secondary_recipient.GetTitledFirstNameNoTooltip]'in bu tür vesilelerde normalde nasıl davrandığından emin değilim; ama bu gece [secondary_recipient.GetSheHe] açıkça neşeliydi. Evinden çok uzakta olmasına rağmen herkesle gülüyor, şakalaşıyor ve rahattı. [secondary_recipient.GetSheHe|U], sessiz ve tuhaf geçebilecek bir akşam yemeğini keyifli bir olaya dönüştürdü; bir bakıma [secondary_recipient.GetSheHe] zaten ailenin bir parçasıymış gibi hissettirdi. Daha da önemlisi, [secondary_actor.GetFirstNameNoTooltip] bunu fark etti... ve onayladı.\n\n"

 lmf_interaction.1317.desc.end:0 "Umarız bu ivme yarınki tanışmaya da taşınır."

 lmf_interaction.1317.a:0 "Başlamak için mükemmel bir yoldu."

 lmf_interaction.1318.t:0 "Beni Kazanmak"

 lmf_interaction.1318.desc:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti gece için ağırlandıktan sonra [ROOT.Char.Custom('FortifiedBuilding')]'de işler sessizdi. [secondary_recipient.GetTitledFirstNameNoTooltip]'i, [secondary_recipient.GetSheHe] ve [secondary_actor.GetFirstNameNoTooltip]'in üzerlerinde yüz çift göz olmadan baş başa konuşma fırsatı bulabilecekleri umuduyla özel odama küçük bir akşam yemeğine davet ettim.\n\nNe var ki bir şekilde tüm konuşmayı [secondary_recipient.GetTitledFirstNameNoTooltip] ve ben yaptık!\n\nBirkaç kadeh eşliğinde dostça sohbet ettik; ben farkına varmadan [secondary_recipient.Custom('polite_gender_ref')]'in şakalarına gülüyor, kendi şakalarımdan da anlatıyordum. Belki [secondary_recipient.GetSheHe] düğünün kaderine karar veren benimle iyi geçinmeye çalışıyordu; ama öyle hissettirmiyordu. Sadece iyi anlaşıyorduk!\n\n[secondary_actor.GetFirstNameNoTooltip] akşam yemeğini erken terk etti; sıkılmıştı ve kimse fark etmemişti."

 lmf_interaction.1318.a:0 "Güzel bir akşam!"

 got_along_at_introduction:0 "[CHARACTER.GetShortUIName] ve [TARGET_CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] evlilik tanışması ziyareti sırasında yakınlaştılar."

 got_along_at_introduction_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] ve [CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessiveNoTooltip] evlilik tanışması ziyareti sırasında yakınlaştılar."

 lmf_interaction.1319.t:0 "Kılıçlarla Oynamak"

 lmf_interaction.1319.desc.start:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti gece için ağırlandıktan sonra, bana söylendiğine göre [secondary_recipient.GetSheHe] hızla kışlaya inip [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larımla talim yaparak vakit geçirdi.\n\nBelki sıra dışıdır; ama [secondary_recipient.GetTitledFirstNameNoTooltip]'in, bir [secondary_actor.GetWifeHusband] arayan saraylı [secondary_recipient.GetWomanMan] rolü oynamaktansa kılıç sallamaya daha yatkın olması mümkün.\n\nDaha da önemlisi, [secondary_actor.GetFirstNameNoTooltip] haberi benimle aynı anda almış ve bu gösteriyi [secondary_actor.GetHerselfHimself] için izlemek üzere silahlığa inmiş gibi görünüyor. "

 lmf_interaction.1319.desc.impressed:0 "Görünüşe göre [secondary_actor.GetSheHe], [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] gösterisinden epey memnun kalmıştı; [secondary_recipient.GetHerHim]'i kenardan tezahüratla destekliyor, [secondary_recipient.GetSheHe] her talimi kazandığında da [secondary_recipient.GetHerHim]'i övgülere boğuyordu."

 lmf_interaction.1319.desc.unimpressed:0 "Görünüşe göre [secondary_actor.GetSheHe], [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] gösterisinden pek etkilenmemişti; özellikle de [secondary_actor.GetSheHe] [secondary_recipient.GetWomanMan] ile sohbete başlamaya çalışıp elinin tersiyle itilince. O noktada, doğal olarak, [secondary_actor.GetFirstNameNoTooltip] dönüp gitti."

 lmf_interaction.1319.a:0 "Şey, en azından [secondary_actor.GetSheHe] etkilendi."

 lmf_interaction.1319.b:0 "Hayırlı bir başlangıç değil."

 lmf_interaction.1320.t:0 "Beklenmedik Bir Düello"

 lmf_interaction.1320.desc:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti gece için ağırlandıktan sonra, sakin bir akşam olacağından emindim. Ama durum bundan çok uzaktı.\n\n[ROOT.Char.Custom('FortifiedBuilding')]'in çoğu uyurken, [secondary_recipient.GetTitledFirstNameNoTooltip] kışlaya inip [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larımla vakit geçirdi... büyük ihtimalle içip kumar oynadı, her ne kadar inkar etseler de.\n\nBir ara [secondary_recipient.Custom('polite_gender_ref')], [your_courtier.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ile bir oyuna tutuştu. Hile yapma suçlaması oldu, işler kontrolden çıktı ve birden düello ilan edildi.\n\nBunun benim haberim olmadan yaşanması yeterince kötüydü; ama her nasılsa [secondary_actor.GetFirstNameNoTooltip] düellonun kokusunu aldı ve [secondary_actor.GetHerHis] potansiyel müstakbel [secondary_recipient.GetWifeHusband]'inin neler yapabildiğini görmek için koşarak aşağı indi."

 lmf_interaction.1320.a:0 "Daha kötü olabilirdi, sanırım..."

 lmf_interaction.1320.a.win.tt:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] düelloyu kazanıyor"

 lmf_interaction.1320.a.lose.tt:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] düelloyu kaybediyor"

 lmf_interaction.1321.t:0 "Ev Özlemi"

 lmf_interaction.1321.desc:0 "[secondary_recipient.GetTitledFirstNameNoTooltip] ve [secondary_recipient.GetHerHis] maiyeti ağırlanıp odalarına yerleştirildikten sonra sakin bir geceydi. Sanırım olayın sonu bu olacaktı.\n\nAma bunun yerine [ROOT.Char.Custom('FortifiedBuilding')] hizmetkârlarından birinden haber aldım: [secondary_recipient.GetTitledFirstNameNoTooltip], kendini [secondary_recipient.GetHerHis] odasına kilitlemiş, teselli kabul etmiyor ve gözyaşları içindeydi.\n\nBizzat aşağı inmek zorunda kaldım; [secondary_recipient.Custom('polite_gender_ref')] ile kapı arkasından konuşarak [secondary_recipient.GetHerHim]'i sakinleştirmeye çalıştım; ta ki [secondary_recipient.GetSheHe] en sonunda gönülsüzce beni içeri alana dek.\n\nMeğer [secondary_recipient.GetSheHe|U] evini özlemiş. Başka bir şey değil. Kendime [secondary_recipient.GetTitledFirstNameNoTooltip]'in aslında daha bir çocuk olduğunu hatırlatmak ve [secondary_actor.GetFirstNameNoTooltip]'in o acıklı sahneye tanık olmadığına şükretmek zorundaydım."

 lmf_interaction.1321.a:0 "[secondary_recipient.Custom('GetLassLad')] için ne kadar utanç verici."

 intro_planned_activity_hunting:0 "plan, günü avlanarak geçirmek"

 intro_planned_activity_hike:0 "plan, günü uzun bir yürüyüşe çıkarak geçirmek"

 intro_planned_activity_garrison:0 "plan, [ROOT.GetCharacter.GetHerHisMy] kılıçtaki yeteneğini sergilemek"

 intro_planned_activity_seduction:0 "plan, günü yakın temas içinde geçirmek"

 intro_planned_activity_poetry:0 "plan, [ROOT.GetCharacter.GetHerHisMy] şiirdeki yeteneğini sergilemek"

 intro_planned_activity_library:0 "plan, günü kütüphanede geçirmek"

 intro_planned_activity_church:0 "plan, günü [ROOT.GetCharacter.GetFaith.HouseOfWorship|l]'de geçirmek"

 intro_planned_activity_tavern:0 "plan, [ROOT.GetCharacter.Custom('FortifiedBuilding')]'den çıkıp en yakın köyü keşfetmek"

 intro_planned_activity_poor:0 "plan, günü yoksullara sadaka dağıtarak geçirmek"

 intro_planned_activity_tour:0 "plan, günü [ROOT.GetCharacter.Custom('FortifiedBuilding')] arazisini gezerek geçirmek"

 intro_planned_activity_garden:0 "plan, günü [ROOT.GetCharacter.Custom('FortifiedBuilding')]'in bahçelerinde geçirmek"

 lmf_interaction.1325.t:0 "Ertesi Gün"

 lmf_interaction.1325.t.same:0 "Potansiyel Bir Eşleşme"

 lmf_interaction.1325.desc.same.actor.start:0 "Buna gerçek bir … demek zor "introduction", considering [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_recipient'))] is part of my court here at [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], but nevertheless we shall stick to the forms.\n\n"

 lmf_interaction.1325.desc.same.actor.willnotwed:0 "[secondary_recipient.GetSheHe|U], [secondary_recipient.GetHerselfHimself]'ini taht odasında huzuruma çıkarırken oldukça gergin görünüyor. [secondary_recipient.GetSheHe|U] ne de olsa [secondary_recipient.GetHerHis] onayını kazanmayan biriyle evlenmeyeceğini açıkça ilan ediyordu... ve bu istekleri görmezden gelme gücü bende. Ama bunu yapmak istesem neden bu dansa gireyim?\n\n"

 lmf_interaction.1325.desc.same.actor:0 "[secondary_recipient.GetSheHe|U], [secondary_recipient.GetHerselfHimself]'ini taht odasında huzuruma çıkarırken oldukça gergin görünüyor. Ne de olsa [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l]'in ilerleyip ilerlemeyeceğine, günün sonunda birbirimiz hakkında ne hissedersek hissedelim, ben karar vereceğim. Ama uyumumuzu düşünmeden [secondary_recipient.GetFirstNameNoTooltip] ile evlenmek isteseydim, bunu yapmaz mıydım?\n\n"

 lmf_interaction.1325.desc.same.actor.end:0 "Böylece [secondary_recipient.GetHerHim]'in elinden tutup [secondary_recipient.GetHerHim]'i dışarı çıkarıyorum. Konuşurken [secondary_actor.Custom('lmf_intro_planned_activity')]'mizi yapacağız. Saraydaki her göz üzerimizde olsa da, elimizden geldiğince eğlenmeye çalışacağız."

 lmf_interaction.1325.desc.same.start:0 "Buna gerçek bir … demek zor "introduction", considering [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_recipient'))] resides here in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Yet the point is that they spend a day determining how compatible they are... "

 lmf_interaction.1325.desc.same.both.willnotwed:0 "[secondary_recipient.GetSheHe] ve [secondary_actor.GetFirstNameNoTooltip] ne de olsa ikisi de yalnızca istedikleri biriyle evleneceklerini ilan etti; isteklerini ezip geçmek isteseydim, en başta buna hiç gerek olmazdı.\n\n"

 lmf_interaction.1325.desc.same.secact.willnotwed:0 "[secondary_actor.GetFirstNamePossessiveNoTooltip]'in, [secondary_actor.GetSheHe]'in onayladığı bir [secondary_recipient.GetWomanMan] dışında kimseyle evlenmeme arzusunu ezip geçmek isteseydim, ne de olsa bunu en başta ayarlamama gerek olmazdı.\n\n"

 lmf_interaction.1325.desc.same.secrec.willnotwed:0 "[secondary_recipient.GetFirstNamePossessiveNoTooltip]'in, [secondary_recipient.GetSheHe]'in onayladığı bir [secondary_actor.GetWomanMan] dışında kimseyle evlenmeme arzusunu ezip geçmek isteseydim, ne de olsa bunu en başta ayarlamama gerek olmazdı.\n\n"

 lmf_interaction.1325.desc.same:0 "Onları, karşılıklı isteklerini göz önünde bulundurmadan evlendirmek isteseydim, ne de olsa öyle yapardım.\n\n"

 lmf_interaction.1325.desc.same.end:0 "İkisi de toplanmış saraya sakin bir yüzle duruyor; süreç hakkındaki gerçek düşüncelerini özenle gizliyorlar. Sonra [secondary_actor.GetFirstNameNoTooltip], [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] elinden tutup [secondary_recipient.GetHerHim]'i salondan çıkarıyor. Görünüşe göre [secondary_actor.GetHerHis|U] [secondary_actor.Custom('lmf_intro_planned_activity')] zamanı gelmiş.\n\nTanışma başlamak üzere."

 lmf_interaction.1325.desc.secrec.start:0 "Sabah olduğunda, kendimi taht odasında takdim ediyorum; hazırlanmış, süslenmiş ve günü [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_actor'))] ile geçirmeye hazır.\n\nGergin hissettiğimi itiraf ederim. Geleceğim belirlenecek olmasa bile, tüm sarayın gözleri üzerimde. Böyle bir baskı altında kim terlemez?\n\nYine de ifademi zararsız bir tarafsızlıkla dizginliyorum.\n\n"

 lmf_interaction.1325.desc.start:0 "Sabah olduğunda, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetHerselfHimself]'ini taht odasında takdim ediyor; hazırlanmış, süslenmiş ve günü [Select_CString( secondary_actor.IsLocalPlayer, 'benimle', secondary_actor.GetFirstNameNoTooltip )] geçirmeye hazır.\n\n[secondary_recipient.GetSheHe|U] gergin görünüyor; tüm sarayın gözleri [secondary_recipient.GetHerHim]'in üzerinde olduğu düşünülürse anlaşılır bir durum. [secondary_recipient.GetSheHe]'in herhangi bir çekincesi varsa, [secondary_recipient.GetSheHe] en azından bunları belli etmeme zarafetini gösteriyor.\n\n"

 lmf_interaction.1325.desc.actor:0 "Bana gelince, ifademin o kadar kontrollü olduğundan şüpheliyim. Yine de günün nasıl geçeceği konusunda [secondary_recipient.GetSheHe]'den daha emin olduğumu söyleyemem.\n\n"

 lmf_interaction.1325.desc.secact.disapprove:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_actor'))]'e gelince, [secondary_actor.GetSheHe] [secondary_actor.GetHerHis] görüşü konusunda çok daha az ihtiyatlı. [secondary_actor.GetSheHe|U], [Select_CString( secondary_recipient.IsLocalPlayer, 'ben', secondary_recipient.GetFirstNameNoTooltip )] ortaya çıktığı andan itibaren [Select_CString( secondary_recipient.IsLocalPlayer, 'ben', secondary_recipient.GetSheHe )]'e kaş çatıyor ve hiç gevşemiyor.\n\n"

 lmf_interaction.1325.desc.secact:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_actor'))]'e gelince, [secondary_actor.GetSheHe] [secondary_actor.GetHerHis] görüşü konusunda çok daha az ihtiyatlı. [secondary_actor.GetSheHe|U], [Select_CString( secondary_recipient.IsLocalPlayer, 'ben', secondary_recipient.GetFirstNameNoTooltip )] ortaya çıktığı andan itibaren [Select_CString( secondary_recipient.IsLocalPlayer, 'ben', secondary_recipient.GetSheHe )]'e ışıl ışıl gülümsüyor; güne başlamak için açıkça can atıyor.\n\n"

 lmf_interaction.1325.desc.end:0 "Saray izlerken, [Select_CString( secondary_actor.IsLocalPlayer, 'ben', secondary_actor.GetFirstNameNoTooltip )] [Select_CString( secondary_actor.IsLocalPlayer, 'öne çıkıp', 'öne çıkıp' )] [Select_CString( secondary_recipient.IsLocalPlayer, 'beni', secondary_recipient.GetHerHim )] salondan [Select_CString( secondary_actor.IsLocalPlayer, 'çıkarıyorum', 'çıkarıyor' )]. [secondary_actor.GetHerHisMy|U|U] [secondary_actor.Custom('lmf_intro_planned_activity')][Select_CString( secondary_actor.IsLocalPlayer, '.', ', görünüşe göre.' )]\n\nTanışma başlamak üzere."

 lmf_interaction.1325.a:0 "Bakalım nasıl gidecek."

 lmf_interaction.1325.a.tt:0 "[secondary_actor.GetShortUIName|U] ve [secondary_recipient.GetShortUIName] günü birbirlerini daha iyi tanıyarak geçirecek"

