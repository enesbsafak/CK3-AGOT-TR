 agot_court_outcome.2000.second.liege:0 "Hükümdarım [proposer_liege.GetTitledFirstName] zaten onay verdiğinden,"

 agot_court_outcome.2000.proposer.family.willnotwed:0 "[proposer.GetHerHis] kalbinin sesini dinleme fırsatı sözü verilen sadık bir [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('proposer'))] olarak,"

