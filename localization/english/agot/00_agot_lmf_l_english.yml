 lmf_heir.1674.t:0 "Yeni Bir Dost?"

 lmf_heir.1674.desc.start:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftanın çoğunu [ROOT.Char.Custom2('LMF_RelationToMeShort', your_courtier )] ile birlikte geçirdi. Bence bu, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))]'in [your_heir.GetTitledFirstNamePossessiveNoTooltip] eğitimine yardım etmek için sarf ettiği bir çabaydı.\n\n"

 lmf_heir.1674.desc.adult:0 "Şey, ikisi daha iyi anlaşamazdı. Kısa sürede [your_heir.GetTitledFirstNameNoTooltip] ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] neredeyse birbirinden ayrılmaz oldu. [ROOT.Char.Custom2('LMF_RelationToMeShort', your_courtier )] [your_heir.GetHerHim]'e [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in iç işleyişini gösterirken ikisi [ROOT.Char.Custom('FortifiedBuilding')]'in her yerine birlikte gidiyor, gülüyor ve şakalaşıyordu.\n\nSarayda ikisinin dostluktan öte bir şeye dönüşmüş olabileceğine dair fısıltılar mı vardı? Ama bu kesinlikle sadece dedikodu."

 lmf_heir.1674.desc.bothchild:0 "Şey, ikisi daha iyi anlaşamazdı. Kısa sürede [your_heir.GetTitledFirstNameNoTooltip] ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] neredeyse birbirinden ayrılmaz oldu. [ROOT.Char.Custom2('LMF_RelationToMeShort', your_courtier )] [your_heir.GetHerHim]'e [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in iç işleyişini gösterirken ikisi [ROOT.Char.Custom('FortifiedBuilding')]'in her yerine birlikte gidiyor, gülüyor ve şakalaşıyordu.\n\nSarayda ikisinin dostluktan öte bir şeye dönüşmüş olabileceğine dair fısıltılar vardı; ama ikisi de daha birer çocuk. En iyi ihtimalle bir gönül çelme; daha fazlası sadece boş dedikodu."

 lmf_heir.1674.desc.child:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] bana sonradan, eğitim iyi giderken ve [your_courtier.GetSheHe] [your_heir.GetTitledFirstNameNoTooltip]'e [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in iç işleyişini göstermeye çabalarken, [your_heir.Custom('polite_gender_ref')]'in [your_courtier.GetHerHim]'e karşı bir şeyler hissediyor gibi göründüğü izlenimine kapılmaktan kendini alamadığını anlattı. [your_courtier.GetSheHe|U] [your_heir.GetTitledFirstNameNoTooltip]'i gayet seviyor ve [your_heir.GetHerHis] ilgisinden gurur duyuyor; ama doğal olarak [your_heir.GetSheHe] daha bir çocuk.\n\nOldukça doğal bir şey ve eminim [your_heir.Custom('polite_gender_ref')] bunu atlatacak."

 lmf_heir.1674.a:0 "Endişelenecek hiçbir şeyim yok, değil mi?"

 lmf_heir.1674.b:0 "Ah, gençlik aşkı."

 fell_in_love_heir_training:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouHerHim(TARGET_CHARACTER)]'den varis eğitimi alırken [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'e âşık oldu."

