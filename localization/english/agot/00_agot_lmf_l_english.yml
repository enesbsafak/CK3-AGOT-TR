 lmf_heir.1662.desc.chancellor:0 "[your_heir.Custom('polite_gender_ref')]'e [ROOT.Char.Custom('FortifiedBuilding')]'i gezdirdi ve [your_councillor.GetHerHis] benim [your_councillor.GetCouncilTitle|l]'im olarak konumunun inceliklerini anlattı.\n\n"

 lmf_heir.1662.desc.steward:0 "[your_heir.Custom('polite_gender_ref')]'e, bir [your_councillor.GetCouncilTitle|l]'in bir [ROOT.Char.Custom('FortifiedBuilding')]'i yönetmek ve çevresindeki toprakları idare etmek için gerekenleri gösterdi.\n\n"

 lmf_heir.1662.desc.marshal:0 "[your_heir.Custom('polite_gender_ref')]'i kışlaya götürdü ve [your_heir.GetHerHim]'e bir [your_councillor.GetCouncilTitle|l]'in [your_councillor.GetHerHis] [ROOT.Char.GetLadyLord]'ünün ordularını nasıl yönettiğini gösterdi.\n\n"

 lmf_heir.1662.desc.spymaster:0 "[your_heir.Custom('polite_gender_ref')]'e [ROOT.Char.Custom('FortifiedBuilding')]'in az kullanılan bölümlerini gezdirdi ve bir [your_councillor.GetCouncilTitle|l]'in işinin önemini anlattı.\n\n"

 lmf_heir.1662.desc.admiral:0 "[your_heir.Custom('polite_gender_ref')]'e rıhtımları gezdirdi ve diyarın ticaret yollarını korumanın inceliklerini ve düzgün bir [your_councillor.GetCouncilTitle|l] olmak için gerekenleri anlattı.\n\n"

 lmf_heir.1662.desc.castellan:0 "[your_heir.Custom('polite_gender_ref')]'e [ROOT.Char.Custom('FortifiedBuilding')]'i gezdirdi ve bir [your_councillor.GetCouncilTitle|l] olmanın ve kişinin hükümdarını desteklemesinin inceliklerini anlattı.\n\n"

 lmf_heir.1662.desc.well:0 "Eğitim iyi geçmiş gibi görünüyor; hem [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_councillor'))] hem de [your_heir.GetTitledFirstNameNoTooltip] birbirleriyle muhteşem anlaştılar. [heir_liege.GetTitledFirstNameNoTooltip]'in [heir_liege.GetHerHis] [heir_liege.Custom2('LMF_RelationToMePossessive', your_heir )] ilerlemesi hakkında hiçbir şikâyeti olmamalı."

 lmf_heir.1662.desc.poorly:0 "İşlerin iyi gitmediği söylendi bana. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_councillor'))] ile [your_heir.GetTitledFirstNameNoTooltip] pek anlaşamamış ve [your_heir.Custom('GetLassLad')] çoğunlukla sıkılmış. Yine de [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_councillor'))]'e çaba gösterdiği için teşekkür etmeyi hatırlamalıyım."

 lmf_heir.1662.a:0 "İyi haber!"

 lmf_heir.1662.b:0 "Ne yazık."

