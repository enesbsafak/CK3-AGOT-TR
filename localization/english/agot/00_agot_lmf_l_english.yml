 lmf_interaction.1300.start:0 "Gereken düşünmenin ardından, tanışma teklifini reddetmek zorundayım.\n\n"

 lmf_interaction.1300.youandi:0 "Sen ve ben birbirimiz için yaratılmamışız."

 lmf_interaction.1300.youandthem:0 "Sen ve [secondary_recipient.GetTitledFirstName] birbiriniz için yaratılmamışsınız."

 lmf_interaction.1300.themandi:0 "[secondary_actor.GetTitledFirstName] ve ben birbirimiz için yaratılmamışız."

 lmf_interaction.1300.them:0 "[secondary_actor.GetTitledFirstName] ve [secondary_recipient.GetTitledFirstName] birbirleri için yaratılmamış."

 lmf_interaction.1301.t:0 "Bir Tanışma"

 lmf_interaction.1301.desc.start:0 "Davet kabul edildi ve [secondary_recipient.GetTitledFirstNameNoTooltip] [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e doğru yola çıktı.\n\n"

 lmf_interaction.1301.desc.actor:0 "Hazırlanacak çok şey var. Ne de olsa bu, müstakbel [secondary_recipient.GetWifeHusband]'im olabilir. Ya da [secondary_recipient.GetHerHim]'i ilk görüşte sevmeyip ziyaret biter bitmez [secondary_recipient.GetHerHim]'i evine gönderebilirim.\n\nSeçim, her zamanki gibi, benim."

 lmf_interaction.1301.desc.pleased.willnotwed:0 "[secondary_actor.GetFirstNameNoTooltip] en azından, [secondary_actor.GetHerHis] potansiyel müstakbel [secondary_recipient.GetWifeHusband]'i haberini verdiğimde temkinli bir memnuniyet gösteriyor. "You're bringing [secondary_recipient.GetHerHim] all the way here?" [secondary_actor.GetSheHe] asked. "[secondary_actor.Custom2('lmf_has_relation', SCOPE.sC('secondary_recipient'))] [secondary_actor.Custom2('lmf_pos_reaction', SCOPE.sC('secondary_recipient'))]".\n\nThen [secondary_actor.GetSheHe] paused, considering. "And if I decide I don't want to marry [secondary_recipient.GetHerHim] after all? Do I get a say?"\n\n"We shall see," I said, and that was enough to satisfy [secondary_actor.GetFirstNameNoTooltip]... at least for the moment."

 lmf_interaction.1301.desc.pleased:0 "[secondary_actor.GetFirstNameNoTooltip] en azından, [secondary_actor.GetHerHis] potansiyel müstakbel [secondary_recipient.GetWifeHusband]'i haberini verdiğimde memnun oluyor. "[secondary_recipient.GetSheHe|U]'s coming here? To meet me?" [secondary_actor.GetSheHe] asked excitedly. "[secondary_actor.Custom2('lmf_has_relation', SCOPE.sC('secondary_recipient'))] [secondary_actor.Custom2('lmf_pos_reaction', SCOPE.sC('secondary_recipient'))]"\n\nThen [secondary_actor.GetSheHe] paused, considering. "But what if [secondary_recipient.GetSheHe] doesn't like me? Does that mean we won't be married, even after [secondary_recipient.GetSheHe] comes all this way?"\n\n"We shall see," I said, and that was enough to placate [secondary_actor.GetFirstNamePossessiveNoTooltip] worries... at least for the time being."

 lmf_interaction.1301.desc.displeased:0 "Şimdi sıra [secondary_actor.GetFirstNameNoTooltip]'e gelecek ziyaretçiden bahsetmeye gelmişti; [secondary_actor.GetSheHe] bundan hiç de memnun değildi.\n\n"[secondary_actor.Custom2('lmf_has_relation', SCOPE.sC('secondary_recipient'))] [secondary_actor.Custom2('lmf_neg_reaction', SCOPE.sC('secondary_recipient'))]" [secondary_actor.GetSheHe] [secondary_actor.Custom('lmf_neg_reaction_type')].\n\nI tried to convince [secondary_actor.GetHerHim] to wait before forming an opinion about [secondary_recipient.GetTitledFirstNameNoTooltip], that under normal circumstances the [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] arrangements would already have been finalized, but nothing I said did much good.\n\nWe'll have to wait and see how the visit goes."

 lmf_interaction.1301.a:0 "Hazırlanma zamanı!"

 lmf_interaction.1302.t:0 "[secondary_recipient.GetHerHisMy|U] Yolda"

 lmf_interaction.1302.desc.recipient:0 "[actor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'e, muhtemelen müstakbel [secondary_actor.GetWifeHusband]'imle tanışmak için yolculuğa çıkmak üzereyim.\n\nNormal şartlarda düğün hazırlıkları çoktan tamamlanmış olurdu... ama bu, [secondary_actor.GetTitledFirstNameNoTooltip] ile tanışmam ve [secondary_actor.GetHerHim]'in de benimle tanışması için bir fırsat; sonrasında bu düğünün devam edip etmeyeceğine kendimiz karar verebiliriz.\n\nSanırım bu ziyaretin nasıl geçeceğini göreceğiz."

 lmf_interaction.1302.desc.pleased.willnotwed:0 "Daveti kabul ettik ve [secondary_recipient.GetFirstNameNoTooltip] şimdiden [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gitmek için hazırlık yapıyor.\n\nİtiraf etmeliyim ki [secondary_recipient.GetSheHe], [secondary_recipient.GetHerHis] potansiyel müstakbel [secondary_actor.GetWifeHusband] olarak [secondary_actor.GetTitledFirstNameNoTooltip]'i seçişime temkinli bir hevesle karşılık verince rahatladım.\n\n"[secondary_recipient.Custom2('lmf_has_relation', SCOPE.sC('secondary_actor'))] [secondary_recipient.Custom2('lmf_pos_reaction', SCOPE.sC('secondary_actor'))] But... what if I don't like [secondary_actor.GetHerHim], after the visit is over?" [secondary_recipient.GetSheHe] asked. "Do I get a say in my future?"\n\n"We shall see," I said, and then wished [secondary_recipient.GetHerHim] safe travels as [secondary_recipient.GetHerHis] retinue departed from the [ROOT.Char.Custom('FortifiedBuilding')]."

 lmf_interaction.1302.desc.pleased:0 "Daveti kabul ettik ve [secondary_recipient.GetFirstNameNoTooltip] şimdiden [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gitmek için hazırlık yapıyor.\n\nİtiraf etmeliyim ki [secondary_recipient.GetSheHe], [secondary_recipient.GetHerHis] potansiyel müstakbel [secondary_actor.GetWifeHusband] olarak [secondary_actor.GetTitledFirstNameNoTooltip]'i seçişime hevesle karşılık verince rahatladım.\n\n"[secondary_recipient.Custom2('lmf_has_relation', SCOPE.sC('secondary_actor'))] [secondary_recipient.Custom2('lmf_pos_reaction', SCOPE.sC('secondary_actor'))] But... what if [secondary_actor.GetSheHe] doesn't like me?" [secondary_recipient.GetSheHe] asked, suddenly worried. "Does that mean we won't be married, even after I traveled all the way there?"\n\n"We shall see," I said, and then wished [secondary_recipient.GetHerHim] safe travels as [secondary_recipient.GetHerHis] retinue departed from the [ROOT.Char.Custom('FortifiedBuilding')]."

 lmf_interaction.1302.desc.displeased:0 "Daveti kabul ettik ve [secondary_recipient.GetFirstNameNoTooltip] şimdiden [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e gitmek için hazırlık yapıyor.\n\n[secondary_recipient.GetSheHe|U], [secondary_recipient.GetHerHis] yolculuk haberini ve [secondary_recipient.GetHerHis] potansiyel müstakbel [secondary_actor.GetWifeHusband] olarak [secondary_actor.GetTitledFirstNameNoTooltip]'i seçişimi duyduğunda fazlasıyla üzüldü.\n\n"[secondary_recipient.Custom2('lmf_has_relation', SCOPE.sC('secondary_actor'))] [secondary_recipient.Custom2('lmf_neg_reaction', SCOPE.sC('secondary_actor'))]", [secondary_recipient.GetSheHe] [secondary_recipient.Custom('lmf_neg_reaction_type')].\n\nI tried to convince [secondary_recipient.GetHerHim] to wait before forming an opinion about [secondary_actor.GetTitledFirstNameNoTooltip], that under normal circumstances the [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] arrangements would already have been finalized, but nothing I said did much good.\n\nWe'll have to wait and see how the visit goes."

 lmf_interaction.1302.a:0 "Haberi dört gözle bekliyorum."

 lmf_interaction.1302.b:0 "Yola koyuluyoruz!"

 lmf_interaction.1304.t:0 "Önümüzdeki Savaş"

 lmf_interaction.1304.desc.atwar.actor:0 "Artık [actor.GetTitledFirstNameNoTooltip] ile savaşta olduğumuza göre, [recall_char.GetFirstNamePossessiveNoTooltip] [actor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] ziyaretini sürdürmesi oldukça uygunsuz görünüyor."

 lmf_interaction.1304.desc.atwar.self.rootattacker:0 "[defender.GetTitledFirstNameNoTooltip]'e karşı savaşım, derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönmem gerekip gerekmediği sorusunu gündeme getiriyor."

 lmf_interaction.1304.desc.atwar.rootattacker:0 "[defender.GetTitledFirstNameNoTooltip]'e karşı savaşım, [recall_char.GetFirstNameNoTooltip]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağrılıp çağrılmaması sorusunu gündeme getiriyor.\n\nDoğrusu [recall_char.GetSheHe], [actor.GetTitledFirstNamePossessiveNoTooltip] sarayında yeterince güvende olmalı; ama bunun süreceğinin garantisi yok."

 lmf_interaction.1304.desc.atwar.self.rootdefender:0 "[attacker.GetTitledFirstNamePossessiveNoTooltip] bana karşı savaşı, derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönmem gerekip gerekmediği sorusunu gündeme getiriyor."

 lmf_interaction.1304.desc.atwar.rootdefender:0 "[attacker.GetTitledFirstNamePossessiveNoTooltip] bana karşı savaşı, [recall_char.GetFirstNameNoTooltip]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağrılıp çağrılmaması sorusunu gündeme getiriyor.\n\nDoğrusu [recall_char.GetSheHe], [actor.GetTitledFirstNamePossessiveNoTooltip] sarayında yeterince güvende olmalı; ama bunun süreceğinin garantisi yok."

 lmf_interaction.1304.desc.atwar.self:0 "Artık [attacker.GetPrimaryTitle.GetNameNoTierNoTooltip] ile [defender.GetPrimaryTitle.GetNameNoTierNoTooltip] arasındaki savaşın parçası olduğuma göre, derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönmem gerekip gerekmediği sorusu gündeme geliyor."

 lmf_interaction.1304.desc.atwar:0 "Artık [attacker.GetPrimaryTitle.GetNameNoTierNoTooltip] ile [defender.GetPrimaryTitle.GetNameNoTierNoTooltip] arasındaki savaşın parçası olduğuma göre, [recall_char.GetFirstNameNoTooltip]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağrılıp çağrılmaması sorusu gündeme geliyor.\n\nDoğrusu [recall_char.GetSheHe], [actor.GetTitledFirstNamePossessiveNoTooltip] sarayında yeterince güvende olmalı; ama bunun süreceğinin garantisi yok."

 lmf_interaction.1304.a:0 "[recall_char.GetHerHim]'i derhal geri çağır."

 lmf_interaction.1304.b:0 "Geri dönmeliyim."

