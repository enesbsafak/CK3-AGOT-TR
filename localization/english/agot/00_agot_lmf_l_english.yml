 lmf_interaction.1209.start:0 "[family_lover.GetTitledFirstNameNoTooltip] ile evlenmemi mi istiyorsun? Delirdin mi?!\n\n[family_lover.GetWomanMan] sevgilim; ama [family_lover.GetHerHim]'in [family_lover.GetWifeHusband]'im olmasına kesinlikle ihtiyacım yok! "

 lmf_interaction.1209.open:0 "İtibarım için endişeleniyorsan, endişelenmene gerek yok. Bildiğin gibi, hasar çoktan verildi.\n\n"

 lmf_interaction.1209.secret:0 "İtibarım için gösterdiğin ilgiye teşekkür ederim; ama bizi dünyaya anlatmayı planlamıyorsan, şansımı deneyeceğim.\n\n"

 lmf_interaction.1209.a:0 "O halde bu ilişkiye derhal son vermelisin."

 lmf_interaction.1210.desc:0 "Pekâlâ.\n\n[recipient.GetFirstNameNoTooltip] ve ben konuyu konuştuk; istediğin buysa... [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'inle evlenmeye ve ilişkimizin [family_lover.GetFaith.FertilityGodName] tarafından kutsanmasına razıyım."

 lmf_interaction.1211.start:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'inle evlenmemi mi istiyorsun? Delirdin mi?!\n\n[recipient.GetFirstNamePossessiveNoTooltip] itibarı için endişeni anlıyorum; ama [recipient.GetHerHim]'in [recipient.GetWifeHusband]'im olmasına kesinlikle ihtiyacım yok!\n\n"

 lmf_interaction.1211.end.rival:0 "Bu seni üzüyorsa, iyi. Hoş karşılanmadığın yerlere karıştığın için bunu hak ettin."

 lmf_interaction.1211.end.malicious:0 "Bir dahaki sefere, bu kadar saçma taleplerde bulunmadan önce meseleyi biraz daha düşün."

 lmf_interaction.1211.end.dominant:0 "Bu kararın seni üzebileceğini biliyorum, öyle olsun. [recipient.GetFirstNameNoTooltip] ile evlenirsem, bu bizim kararımız olacak, senin değil."

 lmf_interaction.1211.end.submissive:0 "Keşke başka bir yol olsaydı, [ROOT.Char.GetLadyLord]'im; ama imkânsız. Üzgünüm."

 lmf_interaction.1211.end.benevolent:0 "Bu seni üzerse gerçekten üzgünüm; ama bu, yalnızca [recipient.GetFirstNameNoTooltip] ve benim verebileceğimiz bir karar."

 lmf_interaction.1211.end.default:0 "Kararım seni üzerse, [ROOT.Char.GetLadyLord]'im, özür dilerim."

 lmf_interaction.1212.desc:0 "Peki, madem ısrar ediyorsun, [family_lover.GetTitledFirstNameNoTooltip] ile evleneceğim.\n\nNe var ki [family_lover.GetHerHim]'i bu planına ikna etmek zorunda kalacaksın; bu konuda benden yardım bekleme."

