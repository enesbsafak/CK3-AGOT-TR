 lmf_heir.1663.desc.physician:0 "[your_heir.GetHerHim]'i bir [GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()]'in uygulamalarıyla, otların kullanımı ve modern hastalık önleme yöntemleri eğitimiyle birlikte tanıştırdı.\n\n"

 lmf_heir.1663.desc.chronicler:0 "[your_heir.GetHerHim]'e kütüphanemizdeki zengin tarihî kayıtları gösterdi ve bir [GetCourtPositionType('chronicler_court_position').GetNameNoTooltip()]'in bu kayıtları, bugünkü diplomatik etkileşimleri etkileyen hikâyeler örmek için nasıl kullandığını anlattı.\n\n"

 lmf_heir.1663.desc.horse:0 "[your_heir.GetHerHim]'e [ROOT.Char.Custom('FortifiedBuilding')]'in ahırlarını gösterdi; bir [GetCourtPositionType('master_of_horse_court_position').GetNameNoTooltip()]'in yalnızca atları savaşa hazır tutmakta değil, gerekli iaşenin naklinde de oynadığı rolü açıkladı.\n\n"

 lmf_heir.1663.desc.seneschal:0 "[your_heir.Custom('polite_gender_ref')]'e, bir [GetCourtPositionType('seneschal_court_position').GetNameNoTooltip()]'in bir [ROOT.Char.Custom('FortifiedBuilding')]'i yönetmek ve yalnızca çevresindeki toprakları değil [ROOT.Char.GetLadyLord]'ünün diyarını da idare etmek için gerekenleri gösterdi.\n\n"

 lmf_heir.1663.desc.taster:0 "[your_heir.GetHerHim]'e bir şölende [GetCourtPositionType('food_taster_court_position').GetNameNoTooltip()]'in görevini ve [your_heir.GetSheHe] dikkatli olmazsa genç bir hükümdarın hayatını tehdit edebilecek çeşitli saray entrikalarını açıkladı.\n\n"

 lmf_heir.1663.desc.well:0 "Zaman iyi değerlendirilmiş gibi görünüyor. [your_heir.GetTitledFirstNameNoTooltip] ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] harika anlaştılar; [your_heir.Custom('GetLassLad')] bilgileri saygı ve amaç duygusuyla özümsüyor gibiydi. [heir_liege.GetTitledFirstNameNoTooltip]'in [heir_liege.GetHerHis] [heir_liege.Custom2('LMF_RelationToMePossessive', your_heir )] ilerlemesi hakkında hiçbir şikâyeti olmamalı."

 lmf_heir.1663.desc.poorly:0 "Ne yazık ki, işler pek iyi gitmedi. [your_heir.GetTitledFirstNameNoTooltip] ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] anlaşamadı; [your_heir.Custom('GetLassLad')] de [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))]'in söylediklerinin çoğunu, şöyle biri olan birinden geldiği için önemsiz sayıp görmezden geldi: "only" a member of my court.\n\nGalling, if true."

