 lmf_heir.1665.heir.severe.duel.desc:0 "[your_heir.GetShortUINameNoFormat|U], [heir_visit_target.GetShortUINamePossessiveNoFormat|U] [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [your_courtier.GetShortUINameNoFormat]'e meydan okuyup düelloyu kaybettikten sonra ağır yaralandı."

