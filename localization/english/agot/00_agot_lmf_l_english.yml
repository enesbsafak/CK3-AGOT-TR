 lmf_feast.1029.t:0 "Aile Ziyafeti: Hor Görme"

 lmf_feast.1029.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bu geceki aile şöleni sessizdi. [public_lover.GetFirstNameNoTooltip]'in bu geceyi katılmak için seçmesi ise daha da talihsiz.\n\n"

 lmf_feast.1029.desc.notfamily:0 "[public_lover.GetHerHim]'e defalarca, ilişkimiz artık herkesçe bilindiğine göre bu tür etkinliklere gelmekte özgür olduğunu söyledim. Ama bu gece, ailemin odaklanacak başka bir şeyi olmadığı için dikkatleri #EMP [public_lover.GetHerHim]'in#! üzerindeydi.\n\n"

 lmf_feast.1029.desc.family:0 "Aile olmamıza rağmen, herkes ilişkimizi bildiği için [public_lover.GetSheHe] hiç gelmekten kaçınabilirdi; ama [public_lover.GetSheHe] beni görmek istedi. Bu gece ise ailenin geri kalanının odaklanacak başka bir şeyi olmadığı için dikkatleri #EMP [public_lover.GetHerHim]'in#! üzerindeydi.\n\n"

 lmf_feast.1029.desc.end:0 "[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_hater'))|U] özellikle [public_lover.GetHerHis] varlığına itiraz etti.\n\nFısıltılar ve bakışlar hemen başladı; [public_lover.GetFirstNameNoTooltip]'in rahatsız olduğunu görebiliyordum. [public_lover.GetSheHe]'e gitmesini önerecektim ki [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_hater'))] daldı. İkisi tartışmaya tutuştu, bütün salonun dikkatini üzerine çekti ve [public_lover.GetFirstNameNoTooltip]'e yüksek sesle birkaç seçme söz söylenince [public_lover.GetSheHe] dönüp gitmeye karar verdi.\n\nBir şey yapmak için artık çok geçti ve şenlik havası iyice soğumuştu."

 lmf_feast.1029.a:0 "Şey, bu talihsizlikti..."

 lover_showed_at_family_feast:0 "[CHARACTER.GetShortUINameNoTooltip|U], bir aile şölenine gelmeye cüret ettiği için [TARGET_CHARACTER.GetShortUINameNoTooltip]'i aşağıladı."

 lover_showed_at_family_feast_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltip|U], bir aile şölenine gelmeye cüret ettiği için [CHARACTER.GetShortUINameNoTooltip]'i aşağıladı."

 lmf_feast.1030.t:0 "Aile Şöleni: Kültür Çatışması"

 lmf_feast.1030.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki şölen başlangıçta yeterince sessizdi; en azından [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_hater'))] ile [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_react'))] tartışmaya başlayana dek.\n\nİlk başta ikisinin sadece bir tartışma yaptığı görünüyordu ve kimse aldırış etmiyordu. Sonra sesleri yükseldi. Görünüşe göre tartışma, [family_hater.GetCulture.GetNameNoTooltip] ya da [family_react.GetCulture.GetNameNoTooltip] mutfağının daha iyi olduğu meselesine dönüşmüştü. Sonra [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_react'))] [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_hater'))]'in alındığı bir şey söyledi; çünkü bağrışmalar tam o an gerçekten başladı.\n\nAilenin diğer üyeleri araya girip ayırmadan önce ikisi neredeyse kavga edecekti; ama hasar çoktan verilmişti. Akşamın geri kalanında birbirlerinden kaçındılar ve büyük salondaki hava iyice soğudu."

 lmf_feast.1030.a:0 "Ne kadar nahoş."

 argued_over_different_culture:0 "[CHARACTER.GetShortUINameNoTooltip|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltip], bir aile şöleninde kültürel farklılıklar yüzünden tartıştılar."

 lmf_feast.1031.t:0 "Aile Şöleni: Gösteri"

 lmf_feast.1031.desc.start:0 "Bu akşamki aile şöleninde işler sessizdi... bir süreliğine.\n\nSonra [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_fool'))] "

 lmf_feast.1031.desc.drunkard:0 "o kadar sarhoş oldu ki [family_fool.GetSheHe] [family_fool.GetHerselfHimself]'ini büsbütün rezil etti. Bir içki üstüne bir içki; ta ki [family_fool.GetSheHe] büyük salonda dört bir yana sendeleyerek dolaşıp, tuhaf bakışlara rağmen ailenin geri kalanını eğlenceye katılmaya çağırana dek.\n\n[family_fool.GetSheHe|U] hizmetkârlara sarktı, birkaç kez düştü ve sonunda [family_fool.GetSheHe] kendisini bırakmaları için bağırırken ailenin diğer üyeleri tarafından salondan çıkarılmak zorunda kaldı."

 lmf_feast.1031.desc.hashishiyah:0 "haşhaş sütüne öyle kendini kaptırdı ki [family_fool.GetSheHe] [family_fool.GetHerselfHimself]'ini büsbütün rezil etti. Ailenin birkaç üyesi [family_fool.GetHerHim]'i yavaşlaması için uyarmaya çalıştı; ama [family_fool.GetSheHe] endişelerini sinirle savuşturdu.\n\nSonunda [family_fool.GetSheHe] öyle bir noktaya geldi ki büyük salonda, neredeyse kendinden geçmiş halde sendeleyerek dolaşıyordu. [family_fool.GetSheHe|U] birkaç kez kustu ve yığıldı; geri kalanımız tuhaf bir sessizlik içinde bakarken [family_fool.GetHerHis] baygın bedeni hizmetkârlar tarafından dışarı taşındı."

 lmf_feast.1031.desc.lunatic:0 "masalardan birinin üzerine çıkıp herkesin dikkatini isteyerek bağırdı ve saçmalamaya başladı. İlk başta herkes bunun bir tür kadeh kaldırma ya da belki bir hikâye olduğunu sandı; [family_fool.GetSheHe] hiçbir anlam ifade etmese de tuhaf tuhaf kıkırdadılar.\n\nSonra işler daha da kötüye gitti. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_fool'))|U] dengesizleşti; kimi zaman çığlık atıyor, kimi zaman gözyaşları içinde hıçkırıklara boğuluyordu. [family_fool.GetSheHe] bıçaklardan birini kaptı ve [family_fool.GetHerselfHimself]'ini gözlerinden bıçaklamakla tehdit edince, [family_fool.GetHerHis] kendi güvenliği için [family_fool.GetHerHim]'i salondan çıkarttım."

 lmf_feast.1031.desc.irritable:0 "tartışmaya başladı... önce [family_fool.GetHerHim]'in yanında oturanlarla, ama sonra [family_fool.GetSheHe] ayağa kalkıp bütün aileye bağırmaya başladı. Eski husumetler gün yüzüne çıkarıldı, eski hatalar — gerçek ya da hayali — sayılıp döküldü, herkes suçluydu ve berbat bir akrabaydı.\n\n[family_fool.GetHerHis|U] öfkesinin sonu yok gibiydi; geri kalanımız şok bir sessizlik içinde birbirimize bakakaldık; ta ki [family_fool.GetSheHe] en sonunda çaresizlikle ellerini havaya kaldırıp öfkeyle çıkana dek."

 lmf_feast.1031.desc.depressed:0 "ağlamaya başladı. İlk başta sessiz gözyaşlarıydı; [family_fool.GetHerHis] halsizliği yalnızca [family_fool.GetHerHim]'in yanında oturanların ilgisini ve tesellisini çekiyordu. Ama teselli edilemiyordu; [family_fool.GetSheHe] tam anlamıyla hıçkırmaya başladı... ve bu tüm aileyi telaşlandırdı.\n\nÇok geçmeden neredeyse herkes [family_fool.GetHerHim]'in çevresini sardı, ne olduğunu sorup yardım etmeye çalıştı; ama bu, eğer bir şey yaptıysa, işleri daha da kötüleştirdi. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_fool'))] salondan kaçtığında, geri kalanımızı şok ve tuhaf bir sessizlik içinde birbirimize bakakaldık."

 lmf_feast.1031.desc.rakish:0 "[family_fool.GetHerselfHimself]'ini tam bir rezilliğe dönüştürdü. [family_fool.GetSheHe|U] akşamı sarhoş sarhoş hizmetkârlara sarkarak ve herkesin net biçimde duyduğu müstehcen cinsel yorumlar yaparak geçirdi. Bazıları o kadar küfürlüydü ki ailenin daha iffetli üyelerinin nefesini kesti.\n\n[family_fool.GetSheHe] genç [dummy_attracted_gender.Custom('FemaleMale')] hizmetkârlardan birini yakalayıp, [dummy_attracted_gender.GetHerHis] çılgınca itirazlarına rağmen, ailenin önünde elleşmeye başlayınca sonunda araya girdim ve herkes şok ve tuhaf bir sessizlik içinde bakarken [family_fool.GetHerHim]'i salondan sürükletip attırdım."

 lmf_feast.1031.desc.reclusive:0 "görünüşe göre [family_fool.GetSheHe] bizim sohbetimizden bıkmıştı. [family_fool.GetSheHe|U] ayağa kalktı, dikkatimizi istedi ve her birimize tam olarak ne düşündüğünü söylemeye başladı... ve [family_fool.GetHerHis] düşünceleri hiç de kibar değildi.\n\n"Why I bother coming to these gatherings at all is beyond me!" [family_fool.GetSheHe] shouted. "I don't want to be here! None of you want me here! So, if you'll excuse me, I'll #EMP happily#! take my leave of you all!" With that, [family_fool.GetSheHe] stormed out of the hall and left the rest of us staring at each other in shocked silence."

 lmf_feast.1031.desc.deviant:0 "[family_fool.GetHerselfHimself]'ini tam bir rezilliğe dönüştürdü. [family_fool.GetSheHe|U] akşamı hizmetkârlara sarkarak ve herkesin net biçimde duyduğu müstehcen cinsel yorumlar yaparak geçirdi. Bazıları o kadar küfürlüydü ki ailenin daha iffetli üyelerinin nefesini kesti.\n\nSonunda [family_fool.GetSheHe], [family_fool.GetHerHis] giysilerini yırtıp bir masanın üzerine çıkarak ve bedenlerimizin tadını çıkarmayacak kadar namus düşkünü olduğumuz için hepimizi azarlayarak hepimizi şoke etti. [family_fool.GetSheHe|U], [family_fool.GetHerHim]'i attırmama fırsat kalmadan öfkeyle çıkıp gitti; geri kalanımız şok bir sessizlik içinde birbirimize bakakaldık."

 lmf_feast.1031.desc.contrite:0 "masalardan birinin üzerine çıkarak herkesi şaşırttı. [family_fool.GetSheHe|U] bir an orada durdu, [family_fool.GetHerHis] ellerini endişeyle ovuşturdu; ta ki oda sessizleşip herkes [family_fool.GetSheHe]'in ne söyleyeceğini bekleyene dek.\n\n"I can't bear it anymore," [family_fool.GetSheHe] said. "The weight of this secret, it's... it's too much! [family_fool.GetFaith.HighGodName] is judging me for my silence and I'll bear it no longer!" Then [family_fool.GetSheHe] revealed [family_fool.GetHerHis] secret and then, while we were all stunned to utter silence by it, fled from the hall."

 lmf_feast.1031.desc.newtrait:0 "\n\nBuna neyin yol açtığını kimse söyleyemedi; zira [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_fool'))] normalde böyle değildir. Büyük ihtimalle stres.\n\n"

 lmf_feast.1031.desc.trait:0 "\n\nBu, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_fool'))] için yeni bir davranış sayılmaz, doğru; ama bunu bir toplantıda yapmak? [family_fool.GetSheHe|U] büyük bir stres altında olmalı.\n\n"

 lmf_feast.1031.desc.end:0 "Sebebi ne olursa olsun, büyük salondaki hava iyice soğudu... her ne kadar ailenin aylarca dedikodu yapacak bir şeyi olacaksa da, eminim."

 lmf_feast.1031.a:0 "Şey, bu... bir şeydi, gerçekten."

 lmf_feast.1032.t:0 "Aile Şöleni: Sevinç"

 lmf_feast.1032.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bu akşamki aile şöleninde hava hafifti; neşe boldu.\n\nSonra işler, birkaç elebaşı sayesinde daha da canlandı: [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_celebrate_1'))], [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_celebrate_2'))] ve [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_celebrate_3'))].\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_celebrate_2'))] müzisyenlerden hareketli bir şey çalmalarını isteyerek işi başlattı; [family_celebrate_2.GetSheHe] dans etmeye başlayınca diğer ikisi de çabucak katıldı.\n\nAilenin diğer üyelerini tek tek piste çektiler ve ben farkına varmadan bütün salon sevinçli bir şenliğe kapılmıştı. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_celebrate_1'))] masalardan birinin üzerine çıkıp dans yeteneğimi sergilememi istedi; itiraf edeyim ki tam da bunu yaptım, herkesin büyük keyfi için.\n\nAkşam sona erdiğinde hepimiz bitkindi... ama hoş bir bitkinlikti; zira bu, aileden hiç kimsenin kolay kolay unutmayacağı bir gece olacak."

 lmf_feast.1032.a:0 "Evet! Lütfen böyle daha fazla."

 all_stressed_family_dinner_guests:0 "Tüm aile şöleni konukları"

 lmf_feast.1033.t:0 "Aile Ziyafeti: Hor Görme"

 lmf_feast.1033.desc.start:0 "Bu akşamki aile şöleninde işler yeterince iyi başladı; derken [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_rival_1'))] [family_rival_1.GetHerHis] [family_rival_2.Custom('WifeHusband')] ile tartışmaya başladı.\n\nSanırım başlatan [angry_spouse.GetSheHe|U] oldu. [angry_spouse.GetHerHis] [target_spouse.Custom('WifeHusband')]'e soğuk bakışlar, ardından çevresindekileri sessiz ve tuhaf bırakan asitli yorumlar; ta ki sonunda [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))] daha fazla dayanamayana dek.\n\nBağrışmalar tam o an başladı. Duyabildiğim kadarıyla,"

 lmf_feast.1033.desc.sodomy:0 "bu, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))]'in başka erkeklerle gönül eğlendirmeleriyle ilgiliydi; odadaki herkesin iyi bildiği bir skandal.\n\n"

 lmf_feast.1033.desc.incest:0 "bu... şey, ensestle ilgiliydi. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))]'in skandalı hepimizce bilinir, elbette.\n\n"

 lmf_feast.1033.desc.deviant:0 "bu, evlilik yataklarıyla ilgili bir meseleydi ve [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))]'in meşhur zevkleri düşünülürse... bu şaşırtıcı değil.\n\n"

 lmf_feast.1033.desc.secretsodomy:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))] başka bir adamla ilişki kurmakla suçlanıyordu... aile için sarsıcı bir ifşaattı, kesinlikle.\n\n"

 lmf_feast.1033.desc.secretincest:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))] ensestten başka bir şeyle değil, düpedüz ensestle suçlanıyordu... aile için sarsıcı bir ifşaattı, kesinlikle.\n\n"

 lmf_feast.1033.desc.secretdeviant:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('angry_spouse'))], [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))]'in 'cinsel sapkınlığından' tiksinmişti... hepimiz için yeni bilgi, kesinlikle.\n\n"

 lmf_feast.1033.desc.infidelity:0 "hepsi [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))]'in evlilik sadakatsizliğiyle ilgiliydi; ailenin tamamının zaten iyi bildiği bir konu.\n\n"

 lmf_feast.1033.desc.secretinfidelity:0 "hepsi [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('target_spouse'))]'in gizli ilişkisiyle ilgiliydi; hepimiz için şok edici bir ifşa.\n\n"

 lmf_feast.1033.desc.rival:0 "bu, birbirlerine duydukları nefretin bir kez daha taşmasından başka bir şey değildi. Aynı eski tartışmalar, şimdi tüm ailenin duyacağı şekilde ortaya dökülmüştü.\n\n"

 lmf_feast.1033.desc.potrival:0 "bir anda dışarı taşan uzun süredir birikmiş bir nefretti; [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('angry_spouse'))]'de bir süredir biriktiği besbelli bir şey.\n\n"

 lmf_feast.1033.desc.end:0 "Ya da, en azından, işlerin #EMP başladığı#! yerin burası olduğunu söylemeliyim. Bağrışmalar ve suçlamalar neredeyse bir saat sürdü; ta ki [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('target_spouse'))]'im geri kalanımızdan araya girmemiz için yalvarana dek. Araya girdiğimde [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('angry_spouse'))] öfkesini #EMP bana#! çevirdi.\n\nİşte o an, akşama son vermenin zamanı geldiğini anladım."

 lmf_feast.1033.a:0 "Hepimiz için ne kadar utanç verici."

 lmf_heir.1501.t:0 "Gizli Eğitim"

 lmf_heir.1501.start:0 "İstihkâmları teftiş ederken [new_educator.Custom2('MyCharacterIntroduction', ROOT.Char)] benimle özel görüşmek istediğini söylüyor.\n\n"Your [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('focus_child'))] has been coming to me often in recent months, my [ROOT.Char.GetLadyLord], asking for lessons in swordsmanship. I have not denied [focus_child.GetHerHim], as I see [focus_child.GetHerHis] passion, but... I cannot continue on like this, in secret."\n\n"[focus_child.GetTitledFirstNameNoTooltip] has great potential," [new_educator.GetSheHe] insists, "and [focus_child.GetSheHe] is miserable in [focus_child.GetHerHis] current studies."\n\n"

 lmf_heir.1501.unusual:0 ""I know it is most unusual for a [focus_child.Custom('GirlBoy')] to take up the blade, but"

 lmf_heir.1501.default:0 ""I know you must have other plans for [focus_child.GetHerHis] future, but"

 lmf_heir.1501.end:0 "İzin verirseniz [focus_child.GetHerHim]'i eğitmeye ve zamanı telafi etmeye razıyım. [focus_child.GetSheHe|U] çabuk öğrenir, söz veriyorum.""

 lmf_heir.1500.a.tt_change:0 "[focus_child.GetFirstNamePossessiveNoTooltip] [education_focus|E] [martial|E]'e dönüşüyor"

 lmf_heir.1500.a.tt_tutor:0 "[new_educator.GetTitledFirstNameNoTooltip], kaçan eğitimi telafi etmek için [focus_child.GetFirstNameNoTooltip]'i bizzat eğitiyor"

 lmf_heir.1501.a:0 "Pekâlâ. Bakalım [focus_child.GetFirstNameNoTooltip] nasıl idare edecek."

 lmf_heir.1501.b:0 "Kesinlikle olmaz. [focus_child.GetFirstNameNoTooltip] mevcut derslerine odaklanmalı."

 lmf_heir.1501.c:0 "[new_educator.GetFirstNameNoTooltip] yardımcı olabilir ama [focus_child.GetFirstNameNoTooltip]'i kılıçta ben eğiteceğim."

 lmf_heir.1501.d:0 "[new_educator.GetFirstNameNoTooltip] yardımcı olabilir ama ben [focus_child.GetFirstNamePossessiveNoTooltip] hocası olarak kalacağım."

 lmf_heir.1503.t:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('focus_child'))|U] Eğitimi"

 lmf_heir.1503.start:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('focus_child'))|U] savaş eğitimi hakkında haber aldım ve... iyi değil.\n\n"[focus_child.GetTitledFirstNameNoTooltip] is still young, it's true," [focus_child.GetHerHis] latest instructor confides, "but it's clear [focus_child.GetHerHis] heart simply isn't in it, my [ROOT.Char.GetLadyLord]. [focus_child.GetSheHe|U] "

 lmf_heir.1503.female:0 "[focus_child.GetSheHe]'in gerçekte asla silah kuşanmasına izin verilmeyeceğini biliyor; öyle olmasa bile,"

 lmf_heir.1503.end:0 "strateji meselelerinde hem yetenekten hem ilgiden yoksun."\n\nThis isn't the first such report I've received. Disappointing as it might be, perhaps the time has come to consider moving [focus_child.GetFirstNameNoTooltip] onto another area of study where [focus_child.GetSheHe] might excel."

 lmf_heir.1503.a:0 "Belki [new_diplomacy_educator.GetFirstName] onun yerine [focus_child.GetHerHim]'e diplomasi dersi verebilir."

 lmf_heir.1503.b:0 "[focus_child.GetFirstNameNoTooltip] onun yerine diplomasi öğrenebilir, biz de daha sonra uygun bir hoca buluruz."

 lmf_heir.1503.c:0 "Belki [new_stewardship_educator.GetFirstName] onun yerine [focus_child.GetHerHim]'e idarecilik dersi verebilir."

 lmf_heir.1503.d:0 "[focus_child.GetFirstNameNoTooltip] onun yerine idareciliği öğrenebilir, biz de daha sonra uygun bir hoca buluruz."

 lmf_heir.1503.e:0 "Belki [new_intrigue_educator.GetFirstName] onun yerine [focus_child.GetHerHim]'e ders verebilir."

 lmf_heir.1503.f:0 "[focus_child.GetFirstNameNoTooltip] onun yerine entrika öğrenebilir, biz de daha sonra uygun bir hoca buluruz."

 lmf_heir.1503.g:0 "Belki [new_learning_educator.GetFirstName] onun yerine [focus_child.GetHerHim]'e ders verebilir."

 lmf_heir.1503.h:0 "[focus_child.GetFirstNameNoTooltip] onun yerine düzgün bir eğitim alabilir, biz de daha sonra uygun bir hoca buluruz."

 lmf_heir.1503.i:0 "Hayır, [focus_child.GetFirstNameNoTooltip] sadece [focus_child.GetHerselfHimself]'ini işine vermeli ve daha çok denemeli."

 lmf_heir.1503.a.tt_change:0 "[focus_child.GetFirstNamePossessiveNoTooltip] [education_focus|E] [diplomacy|E]'ye dönüşüyor"

 lmf_heir.1503.a.tt_tutor:0 "[new_diplomacy_educator.GetTitledFirstNameNoTooltip], kaçan eğitimi telafi etmek için [focus_child.GetFirstNameNoTooltip]'i bizzat eğitiyor"

 lmf_heir.1503.tt_no_tutor:0 "[focus_child.GetFirstNameNoTooltip], kaçan eğitimi telafi etmek için iki kat fazla çalışacak"

 lmf_heir.1503.b.tt_change:0 "[focus_child.GetFirstNamePossessiveNoTooltip] [education_focus|E] [stewardship|E]'ye dönüşüyor"

 lmf_heir.1503.b.tt_tutor:0 "[new_stewardship_educator.GetTitledFirstNameNoTooltip], kaçan eğitimi telafi etmek için [focus_child.GetFirstNameNoTooltip]'i bizzat eğitiyor"

 lmf_heir.1503.c.tt_change:0 "[focus_child.GetFirstNamePossessiveNoTooltip] [education_focus|E] [intrigue|E]'ye dönüşüyor"

 lmf_heir.1503.c.tt_tutor:0 "[new_intrigue_educator.GetTitledFirstNameNoTooltip], kaçan eğitimi telafi etmek için [focus_child.GetFirstNameNoTooltip]'i bizzat eğitiyor"

 lmf_heir.1503.d.tt_change:0 "[focus_child.GetFirstNamePossessiveNoTooltip] [education_focus|E] [learning|E]'e dönüşüyor"

 lmf_heir.1503.d.tt_tutor:0 "[new_learning_educator.GetTitledFirstNameNoTooltip], kaçan eğitimi telafi etmek için [focus_child.GetFirstNameNoTooltip]'i bizzat eğitiyor"

 lmf_heir.1505.t:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('focus_child'))|U] Eğitimi"

 lmf_heir.1505.desc:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('focus_child'))]'imin savaş eğitimi hakkında haber aldım.\n\n"[focus_child.GetTitledFirstNameNoTooltip] is still young, it's true," [focus_child.GetHerHis] latest instructor confides, "but she shows such determination and natural talent. She keeps demanding to be allowed to take up training in proper swordsmanship, my [ROOT.Char.GetLadyLord], and I think if we do not let her she will go off and learn it in secret."\n\nIt is most improper for a girl to learn to fight... but then again, why should she be restricted to learning solely strategy and armycraft?"

 lmf_heir.1505.a:0 "Bırak savaşmayı öğrensin. Nasıl gideceğini göreceğiz."

 lmf_heir.1505.b:0 "Mevcut eğitimi yeterli. Ona odaklanmalı."

 lmf_heir.1511.t:0 "Aşk için Evlenmek mi?"

 lmf_heir.1511.desc.start:0 "[focus_child.GetFirstNameNoTooltip] henüz genç ama bir nişanın kapıda olduğu yaşa geldiğinin farkında.\n\n"If I marry, I want to marry for love!" [focus_child.GetSheHe] boldly declared at the dinner table one evening. "[focus_child.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], you wouldn't force me to marry someone against my wishes, would you?"\n\n"

 lmf_heir.1511.desc.sex:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('focus_child'))]'imin [focus_child.Custom('GetGirlsBoysOpposite')]'in peşinden koşmaya pek meraklı olmadığı giderek daha açık hale geliyor. Belki bu ani bağımsızlık ilgisi bundan kaynaklanıyor?\n\n"

 lmf_heir.1511.desc.lustful:0 "Giderek daha çok fark ediyorum ki [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('focus_child'))]'im, bu kadar genç yaşta bile, şehvetli bir [focus_child.Custom('GetLassLad')]'e dönüşüyor. Belki bu ani bağımsızlık ilgisi, biraz delikanlılık yapma arzusundan kaynaklanıyor. İtiraf edeyim, [focus_child.GetHerHis] yaşındayken ben de aynısını hissetmiştim.\n\n"

 lmf_heir.1511.desc.sibling:0 "[focus_child.GetSheHe]'in böyle bir şeyi neden soracağı konusunda şaşkın göründüğümde, [focus_child.GetSheHe] devam etti. "You allowed [favored_sibling.GetFirstNameNoTooltip] to marry whoever [favored_sibling.GetSheHe] wanted! Why shouldn't I be allowed the same thing?" Ah. Envious of [focus_child.GetHerHis] [focus_child.Custom2('LMF_RelationToMePossessive', SCOPE.sC('favored_sibling'))] freedom. Now it all makes sense.\n\n"

 lmf_heir.1511.desc.adventure:0 "İtiraf edeyim, [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('focus_child'))]'imin bağımsızlığa ani ilgisinin nereden geldiğinden emin değilim. Belki bir macera arzusu? [focus_child.Custom('WifeHusbandOpp')] yükü olmadan [focus_child.GetHerHis] gençliğini yaşamak için mi?\n\n"

 lmf_heir.1511.desc.end.female:0 "Soru, bu tür arzuların teşvik edilip edilmemesi gerektiği. Hanedanımızın üyelerinin evlenmesi ve çocuk sahibi olması bir sorumluluk; ve adil olsun ya da olmasın, kadınlar bunu henüz gençken ve hayatlarının baharında yapmalı. Yine de... belki bu henüz bir endişe olmak zorunda değil?"

 lmf_heir.1511.desc.end:0 "Soru, bunun teşvik edilip edilmemesi gerektiği. Ne de olsa hanedanımızın üyelerinin evlenmesi ve çocuk sahibi olması bir sorumluluk. Yine de... belki bu bekleyebilir? [focus_child.GetFirstNameNoTooltip] hâlâ çok genç ve görünüşe göre bu konuda [focus_child.GetHerHis] bildiğini okumaya kararlı."

 lmf_heir.1511.a:0 "[focus_child.GetHerHis|U] evliliği bir süre bekleyebilir."

 lmf_heir.1511.b:0 "[focus_child.GetSheHe|U] ben dediğimde evlenecek, konu kapandı."

 allowed_to_marry_at_will:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'in [CharYourHerHis(TARGET_CHARACTER)] kendi özgür iradesiyle evlenmesine izin verdi."

 allowed_to_marry_at_will_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINameNoTooltipNoFormat]'in [CharYourHerHis(CHARACTER)] kendi özgür iradesiyle evlenmesine izin verdi."

 invite_suitor_1_introduction_tt:0 "[suitor_1.GetTitledFirstName], [secondary_actor.GetTitledFirstNameNoTooltip] ile tanışma için [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e davet edilecek"

 invite_suitor_2_introduction_tt:0 "[suitor_2.GetTitledFirstName], [secondary_actor.GetTitledFirstNameNoTooltip] ile tanışma için [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e davet edilecek"

 invite_suitor_3_introduction_tt:0 "[suitor_3.GetTitledFirstName], [secondary_actor.GetTitledFirstNameNoTooltip] ile tanışma için [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e davet edilecek"

 lmf_heir.1516.warning.matrilineal_tt:0 "Tanışma evlilikle sonuçlanırsa, #X anasoylu#! olacak"

 lmf_heir.1516.warning.patrilineal_tt:0 "Tanışma evlilikle sonuçlanırsa, #X babasoylu#! olacak"

 lmf_heir.1516.t:0 "Bir Tanışma mı?"

 lmf_heir.1516.desc.start:0 "İyi haber şu ki, [secondary_actor.GetSheHe] dilediği zaman evlenme izni verilmiş olmasına rağmen, [secondary_actor.GetFirstNameNoTooltip] konu hakkında [secondary_actor.GetHerHis] kendi fikirlerine sahip görünüyor.\n\n[secondary_actor.GetSheHe|U] bugün şununla yanıma geldi: "

 lmf_heir.1516.desc.one:0 "[secondary_actor.GetSheHe]'in ilgilenebileceği bir [suitor_1.Custom('WomanManGirlBoy')] adı "

 lmf_heir.1516.desc.two:0 "[secondary_actor.GetSheHe]'in ilgilenebileceği iki [suitor_1.Custom('WomenMenGirlsBoys')] adı "

 lmf_heir.1516.desc.three:0 "[secondary_actor.GetSheHe]'in ilgilenebileceği birkaç [suitor_1.Custom('WomenMenGirlsBoys')] listesi "

 lmf_heir.1516.desc.matrilineal:0 "matrilineal evlenerek.\n\n"

 lmf_heir.1516.desc.normal:0 "toplantı.\n\n"

 lmf_heir.1516.desc.end:0 "Kabul edersem, [suitor_1.GetHerHim]'i usulüne uygun bir tanışma için buraya, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e davet etmem gerekecek. Umarım [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('secondary_actor'))]'im bu konuda ciddidir ve zamanımı boşa harcamıyordur. Eninde sonunda [secondary_actor.GetHerHim]'i evlendirmek için [secondary_actor.GetHerHis] isteklerini ezip geçmek zorunda kalırsam, öyle yapacağım."

 lmf_heir.1516.a:0 "[suitor_1.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'i davet edelim."

 lmf_heir.1516.b:0 "[suitor_2.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'i davet edelim."

 lmf_heir.1516.c:0 "[suitor_3.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'i davet edelim."

 lmf_heir.1516.d:0 "Saçmalık, kendim daha iyisini bulurum."

 lmf_heir.1517.t:0 "Evlenme Zamanı"

 lmf_heir.1517.t.directed:0 "Aramanın Sonu"

 lmf_heir.1517.desc:0 "[focus_child.GetFirstNameNoTooltip] bu sabah bana geldi, oldukça mahcup görünüyordu.\n\n"I know I've said that I want to marry on my own, [focus_child.Custom2('spoken_address_by_familiarity', ROOT.Char )], but the truth is that I haven't met a [focus_child.Custom('GetWomanManOpposite')] worth marrying."\n\n"Does this mean what I think it means?" I asked, smiling.\n\n[focus_child.GetSheHe|U] nodded, sighing. "Yes, I think it's time. If you could find a proper [focus_child.Custom('WifeHusbandOpp')] for me, I would appreciate it.""

 lmf_heir.1517.desc.directed:0 "[focus_child.GetFirstNameNoTooltip] bu sabah bana geldi, oldukça mahcup görünüyordu.\n\n"I know you directed me to find a [focus_child.Custom('WifeHusbandOpp')] on my own, [focus_child.Custom2('spoken_address_by_familiarity', ROOT.Char )], but the truth is that I haven't found a [focus_child.Custom('GetWomanManOpposite')] worth marrying."\n\n"Does this mean you intend to give up the search?" I asked.\n\n[focus_child.GetSheHe|U] nodded, sighing. "I appreciate your offer, [focus_child.Custom2('spoken_address_by_familiarity', ROOT.Char )], but it appears I need your assistance if you still wish to see me properly wed.""

 lmf_heir.1517.a:0 "Nihayet!"

 lmf_heir.1517.b:0 "Öyle olsun."

 lmf_heir.1518.t:0 "Geri Dönme Zamanı mı?"

 lmf_heir.1518.desc:0 "Bugün [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('focus_child'))]'imden haber aldım.\n\nGörünüşe göre [focus_child.GetFirstNameNoTooltip], [focus_child.GetHerHis] başıboşluğa son vermenin zamanı geldiğini düşünüyor; yerleşip benim [focus_child.GetSheHe]'e uygun gördüğüm herhangi bir [focus_child.Custom('WifeHusbandOpp')]'i kabul etmek anlamına gelse bile. Tabii [focus_child.GetHerHim]'in buraya, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönmesine izin vermeyi kabul edersem.\n\n[focus_child.GetFirstNamePossessiveNoTooltip] isyanı, görünüşe göre, sona erdi."

 lmf_heir.1518.a:0 "[focus_child.GetHerHim] gelsin."

 lmf_heir.1518.b:0 "Hayır, [focus_child.GetSheHe] olduğu yerde kalabilir."

 lmf_heir.1519.t:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))|U] Âşık"

 lmf_heir.1519.desc.start.secret:0 "Ne yazık ki, [heir.GetFirstNameNoTooltip]'in evliliğe neden bu kadar isteksiz olduğunu zaten bildiğimi sanıyorum: [heir.Custom('GirlBoy')] âşık.\n\nNe yazık ki,"

 lmf_heir.1519.desc.start:0 "Sanırım [heir.GetFirstNamePossessiveNoTooltip] evliliğe isteksizliğinin kaynağını sonunda buldum: [heir.Custom('GirlBoy')] âşık.\n\nNe yazık ki,"

 lmf_heir.1519.desc.samesex:0 "[heir.GetHerHis] gönlünün nesnesi de bir [heir_lover.GetWomanMan]. Kesinlikle oldukça tuhaf bir durum.\n\n"

 lmf_heir.1519.desc.order:0 "[heir.GetHerHis] gönlünün nesnesi, kutsal bir tarikata yemin etmiş biri çıkıyor. [heir_lover.GetSheHe|U], [heir_lover.GetHerHis] yeminlerine sadık kaldığı sürece evlenemez.\n\n"

 lmf_heir.1519.desc.married:0 "[heir.GetHerHis] gönlünün nesnesi zaten evli çıkıyor. Eski bir hikâye, utanç verici olsa da.\n\n"

 lmf_heir.1519.desc.betrothed:0 "[heir.GetHerHis] gönlünün nesnesi, henüz evlenmemiş olsa da başkasıyla nişanlı. O nişan sürdüğü sürece [heir_lover.GetSheHe|U], [heir.GetHerHim] ile evlenemez.\n\n"

 lmf_heir.1519.desc.permission.lover.man:0 "[heir.GetHerHis] sevgilisine evlenme iznini daha önce vermediğim için, adam artık [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'imin elini düzgünce istemeye açıkça isteksiz.\n\n"

 lmf_heir.1519.desc.permission.lover.woman:0 "[heir.GetHerHis] sevgilisine evlenme iznini daha önce vermediğim için, [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'im bu reddin kendisi için de geçerli olduğunu açıkça düşünüyor.\n\n"

 lmf_heir.1519.desc.permission.both:0 "evlenmelerine daha önceki izin vermeyişim, artık gizlice devam etmeyi planladıkları anlamına geliyor. Sürdürülürse oldukça tuhaf bir durum.\n\n"

 lmf_heir.1519.desc.permission.heir.man:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))]'im, önceki reddim göz önüne alındığında, [heir_lover.GetHerHim] ile evlenmek için izin istemeye açıkça gönülsüz.\n\n"

 lmf_heir.1519.desc.permission.heir.woman:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))]'imin elini isteme teklifini zaten reddetmiş olduğum için, adamın [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))]'imle evlenmek için izin istemeye gönülsüz olduğu açık.\n\n"

 lmf_heir.1519.desc.generic:0 "İkisinin evlenmesi imkânsız. Bu yüzden gizlice devam ediyorlar ve [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))]'im, [heir.GetSheHe]'in sevdiği bu [heir_lover.GetWomanMan]'den daha büyük bir görevi olduğunu düşünebilecek kadar aklı başında değil.\n\n"

 lmf_heir.1519.desc.end.canact:0 "Belki [heir.GetFirstNameNoTooltip]'e bildiğimi söylemeli ve yine de evlenmelerini sağlamalıyım. Ya da [heir.GetHerHim]'e bu umutsuz duruma son vermesini söylemeliyim. Her iki durumda da, bir şeyler yapılmalı."

 lmf_heir.1519.desc.end:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'imin gönül işine karışabilirim, ama [heir.GetSheHe]'in bunun için bana teşekkür edeceğinden şüpheliyim."

 lmf_heir.1519.a:0 "[heir.GetFirstNameNoTooltip] buna son vermeli. Bu hiçbir yere varmaz."

 lmf_heir.1519.b:0 "Onlara fikrimi değiştirdiğimi söyleyeceğim."

 lmf_heir.1519.c:0 "[heir_lover.GetFirstNameNoTooltip], [heir_lover.GetHerHis] yeminlerinden vazgeçip [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))] ile evlenmek zorunda."

 lmf_heir.1519.d:0 "[heir_lover.GetFirstNameNoTooltip], [heir_lover.GetHerHis] nişanını bozup [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))] ile evlenmek zorunda."

 lmf_heir.1519.e:0 "Hayır, [heir.GetFirstNameNoTooltip] fırsatı varken [heir.GetHerHis] eğlensin."

 lmf_heir.1530.heir_training.tt:0 "[trainee_heir.GetFirstNamePossessiveNoTooltip] Hükümdarlığa Hazırlık"

 lmf_heir.1530.heir_begin_training.tt:0 "[trainee_heir.GetFirstNameNoTooltip] Varis Eğitimine Başlıyor"

 lmf_heir.1601.t:0 "Sarayda Bir Gün"

 lmf_heir.1601.desc:0 "Bugün [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki sarayda işler nispeten olaysızdı... ya da öyle sanıyordum.\n\nTaht odası büyük ölçüde boşaldıktan sonra [your_heir.GetFirstNameNoTooltip] sorularla yanıma yaklaştı. Benim haberim olmadan gün boyu yargılamaları izlemiş ve hakkında hüküm verdiğim bazı şeylerin [your_heir.GetHerHis] anlayışının ötesinde olduğu açıktı.\n\nNe var ki her cevap iki soru daha getirdi ve bir saat sonra [your_heir.GetFirstNameNoTooltip]'in hükümdarlığın iç işleyişini anlamaya başladığımızdan daha yakın olmadığı açıktı.\n\n"Where is this coming from, [your_heir.Custom('GetLassLad')]?" I asked, bewildered."

 lmf_heir.1601.a:0 "Ne kadar sürerse sürsün açıklamayı dene."

 lmf_heir.1601.b:0 "[your_heir.GetHerHis] tüm sorularını cevaplayacak başka birini bul."

 lmf_heir.1601.a.success.tt:0 "[your_heir.GetFirstNameNoTooltip] anlıyor"

 lmf_heir.1601.a.success.effect.tt:0 "[your_heir.GetFirstNamePossessiveNoTooltip] varis eğitimi önemli ölçüde ilerliyor"

 lmf_heir.1601.a.failure.tt:0 "[your_heir.GetFirstNameNoTooltip] anlamıyor"

 lmf_heir.1601.a.failure.effect.tt:0 "[your_heir.GetFirstNamePossessiveNoTooltip] varis eğitimi ilerlemiyor"

 lmf_heir.1601.a.critfail.tt:0 "[your_heir.GetFirstNameNoTooltip] tamamen yanlış anlıyor"

 lmf_heir.1601.a.critfail.effect.tt:0 "[your_heir.GetFirstNamePossessiveNoTooltip] varis eğitimi önemli ölçüde geriliyor"

 lmf_heir.1602.t:0 "Bahçede Öfke"

 lmf_heir.1602.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de sakin bir gün, bir muhafızın gelip [your_heir.GetFirstNameNoTooltip] ile [angry_family.GetFirstNameNoTooltip]'in bahçede kavga ettiğini ve adamın onları ayırmak zorunda kaldığını bildirmesiyle bölündü.\n\n"Fighting?" I exclaimed. "Each other? You must be mistaken!"\n\nYet he was not, I soon learned. [angry_family.GetFirstNameNoTooltip] started the entire altercation, blowing up over some imagined slight of [your_heir.GetFirstNamePossessiveNoTooltip]... though, in truth, I suspect it came from the jealousy [angry_family.GetFirstNameNoTooltip] clearly feels over [angry_family.GetHerHis] [angry_family.Custom2('LMF_RelationToMePossessive', SCOPE.sC('your_heir'))] role as my heir.\n\nWhatever the cause, while they both mumbled apologies after my reprimand, I suspect the bad blood will only continue after this."

 lmf_heir.1602.a:0 "Çocuklar neden anlaşamıyor?"

 fought_over_heir_status:0 "[CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] varis statüsüne duyduğu kıskançlık yüzünden [TARGET_CHARACTER.GetShortUIName] ile kavga başlattı."

 fought_over_heir_status_corresponding:0 "[TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessiveNoTooltip] varis statüsüne duyduğu kıskançlık yüzünden [CHARACTER.GetShortUIName] ile kavga başlattı."

 lmf_heir.1603.t:0 "O Kadar Çok Soru"

 lmf_heir.1603.desc:0 "Genç [your_heir.GetFirstNameNoTooltip]'i [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]'e hükmedecek şekilde yetiştirmenin kimi zaman zorlukları oluyor. Bugün de öyle bir gün.\n\n[your_heir.GetFirstNameNoTooltip] şafakta başladı; önce önceki günün dersi hakkında zararsız sorular sorarak. [your_heir.GetSheHe|U] hükmetmeyi anlamak istediğini söyledi. "Starting a bit early, [your_heir.Custom('GetLassLad')], aren't we?" I chuckled. This, however, only seemed to encourage [your_heir.GetHerHim].\n\nFor the rest of the day, [your_heir.GetFirstNameNoTooltip] followed me about, from the throne room to the courtyard to the stables... even to the privy! I had to bar the [your_heir.Custom('GirlBoy')] from following me inside!\n\n"I just want to understand, [your_heir.Custom2('LMF_RelationToMeShort', ROOT.Char )|U]!" [your_heir.GetSheHe] said from outside the door, while I sat within and rubbed my temples."

 lmf_heir.1603.a:0 "Çocuklar görülmeli, duyulmamalı."

 lmf_heir.1604.t:0 "Neden Savaştayız?"

 lmf_heir.1604.desc:0 "Eğitimdeki genç varisim [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki garnizonu teftiş etmemde bana eşlik etti; ama [your_heir.GetHerHis] sorularının çoğu savaş hakkındaydı.\n\n"Why does [war_target.GetPrimaryTitle.GetNameNoTierNoTooltip] hate us so?"\n"What will we do with [war_target.GetTitledFirstNameNoTooltip] when we defeat [war_target.GetHerHim]?"\n"We will defeat [war_target.GetHerHim], won't we?"\n"What will happen if [war_target.GetHerHis] armies come to [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]?"\n\nThese were good questions, there's no doubt about that, questions a future ruler of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] should ask... but I was there to review the garrison, first and foremost."

 lmf_heir.1604.a:0 "Elinizden geldiğince sabırla açıklamayı dene."

 lmf_heir.1604.b:0 "[your_heir.GetHerHim]'i [ROOT.Char.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName]'ine devret."

 lmf_heir.1605.t:0 "Öfkeli Bir [your_councillor.GetCouncilTitle|U]"

 lmf_heir.1605.desc.start:0 "Günün geç saatlerinde, danışmanlarımdan birinin öfkeyle taht odasına dalmasıyla sözüm aniden kesiliyor.\n\n"Your [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('your_heir'))] today had the temerity to give me orders — orders!" [your_councillor.GetTitledFirstNameNoTooltip] shouted. "As if I were some common servant and not your [your_councillor.GetCouncilTitle|l]!"\n\nI raised my hands, urging the [your_councillor.GetWomanMan] to calm [your_councillor.GetHerselfHimself]. "You must remember I am training [your_heir.GetTitledFirstNameNoTooltip] to one day rule, and [your_heir.GetSheHe] will "

 lmf_heir.1605.desc.same:0 "ben gittikten sonra [ROOT.Char.GetTitleAsNameNoTooltip] ol."\n\n"[your_heir.GetSheHe|U] is not the [ROOT.Char.GetTitleAsNameNoTooltip] #EMP yet#!!""

 lmf_heir.1605.desc.opposite:0 "ben gittikten sonra [ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip] ol."\n\n"[your_heir.GetSheHe|U] is not the [ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip] #EMP yet#!!""

 lmf_heir.1605.desc.default:0 "ben gittikten sonra senin hükümdarın ol."\n\n"[your_heir.GetSheHe|U] does not rule [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] #EMP yet#!!""

 lmf_heir.1605.a:0 "[your_heir.GetFirstNameNoTooltip]'e daha incelikli olmayı öğretmeyi dene."

 lmf_heir.1605.b:0 "[your_councillor.GetTitledFirstNameNoTooltip]'i [your_heir.GetFirstNamePossessiveNoTooltip] eğitimine yardım etmeye ikna et."

 lmf_heir.1605.b.success.tt:0 "[your_councillor.GetSheHe|U] [your_heir.GetFirstNameNoTooltip]'e yardım etmeyi kabul ediyor"

 lmf_heir.1605.b.failure.tt:0 "[your_councillor.GetSheHe|U] [your_heir.GetFirstNameNoTooltip]'e yardım etmeyi reddediyor"

 lmf_heir.1605.b.critfail.tt:0 "[your_councillor.GetSheHe|U] isteğinden alınıyor"

 convinced_to_help_heir:0 "[CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessive] varis olarak eğitimine yardım etmeye başladı."

 convinced_to_help_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessive] varis olarak eğitimine yardım etmeye başladı."

 not_convinced_to_help_heir:0 "[CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessive] [CHARACTER.GetHerHis] danışmanlık görevlerine karışması karşısında öfkeden köpürdü."

 not_convinced_to_help_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessive] [TARGET_CHARACTER.GetHerHis] danışmanlık görevlerine karışması karşısında öfkeden köpürdü."

 lmf_heir.1605.c:0 "Bırak ikisi kendi aralarında çözsün."

 lmf_heir.1605.c.success.tt:0 "İkisi işleri yoluna koyuyor"

 lmf_heir.1605.c.failure.tt:0 "Aralarındaki kan davası büyüyor"

 lmf_heir.1606.t:0 "Sürekli Saygısızlık"

 lmf_heir.1606.desc:0 ""[your_courtier.GetSheHe|U] won't listen to me!" [your_heir.GetFirstNameNoTooltip] shouted, enraged, as [your_heir.GetSheHe] stormed into my study.\n\nIt took a fair amount of calming and cajoling, but eventually I learned the source of [your_heir.GetFirstNamePossessiveNoTooltip] ire was none other than my [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('your_courtier'))], [your_courtier.GetTitledFirstNameNoTooltip]. Apparently the [your_courtier.Custom('WomanManGirlBoy')] has been consistently dismissive of [your_heir.GetFirstNameNoTooltip], ignoring [your_heir.GetHerHis] orders and rude to the point of offense.\n\n"And your first thought was to come to me?" I asked, amused.\n\n[your_heir.GetFirstNameNoTooltip] threw [your_heir.GetHerHis] hands up in frustration. "I don't know what to do!""

 lmf_heir.1606.a:0 "[your_heir.GetSheHe|U] affetmeyi ve unutmayı öğrenmeli."

 lmf_heir.1606.b:0 "[your_heir.GetSheHe|U] [your_heir.GetHerselfHimself]'inin hakkını savunmak zorunda."

 lmf_heir.1606.c:0 "[your_heir.GetHerHim]'e, [your_courtier.GetWomanMan]'e unutamayacağı bir ders vermesini söyle."

 will_not_listen_to_heir:0 "[CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessive] saraydaki sürekli saygısızlığı ve kabalığı yüzünden bıkkınlığa kapıldı."

 will_not_listen_to_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessive] saraydaki sürekli saygısızlığı ve kabalığı yüzünden bıkkınlığa kapıldı."

 lmf_heir.1606.d:0 "[your_heir.GetFirstNameNoTooltip]'e bu tür durumlarla daha iyi başa çıkmayı öğret."

 lmf_heir.1606.e:0 "[your_courtier.GetTitledFirstNameNoTooltip]'i azarla. Bu böyle süremez."

 forced_to_listen_to_heir:0 "[CHARACTER.GetShortUIName], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] varisine sürekli saygısızlık gösterdiği için [TARGET_CHARACTER.GetShortUIName] tarafından azarlandı."

 forced_to_listen_to_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUINamePossessiveNoTooltip] varisine sürekli saygısızlık gösterdiği için [CHARACTER.GetShortUIName] tarafından azarlandı."

 lmf_heir.1607.t:0 "Varis Müdahalesi"

 lmf_heir.1607.desc:0 "[your_heir.GetFirstNameNoTooltip]'in hükmetmeyi öğrenmesi önemli; çünkü bir gün [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] [your_heir.GetHersHis] olacak. Ama son zamanlarda [your_heir.Custom('GetLassLad')] çok ileri gitti.\n\nİki kez saraylılara emir verdim ve sonradan [your_heir.GetSheHe]'in onları iptal ettiğini öğrendim. Bir kanun kaçağına verdiğim yakın tarihli bir hüküm sessizce geri alındı; [your_heir.GetFirstNameNoTooltip] belli ki aynı fikirde değildi ama bana söylemeyi ihmal etti. Daha da sinir bozucu olan şu: birkaç kez bir emir verdim ve adam onay arar gibi [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('your_heir'))]'ime baktı!\n\nBelki de en iyisi budur... ama ben hâlâ [ROOT.Char.GetTitleAsNameNoTooltip] değil miyim?"

 lmf_heir.1607.a:0 "Devam etmesine izin ver. [your_heir.GetSheHe|U] hazır olmalı."

 lmf_heir.1607.b:0 "[your_heir.GetFirstNameNoTooltip] usulüne uygun saygıyı öğrenmek zorunda!"

 lmf_heir.1608.t:0 "Kışlada Öfke"

 lmf_heir.1608.desc:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('your_heir'))]'imin kışlada [your_heir.GetHerHis] kılıç talimini yapışını izlerken, itiraf edeyim ki diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ların bazılarından [your_heir.GetSheHe]'in ne kadar az saygı gördüğünü görmek beni endişelendirdi.\n\nÖzellikle [your_courtier.GetTitledFirstNameNoTooltip], [your_heir.GetHerHis] her görüşünü görmezden geliyor, hatta [your_heir.Custom('GetLassLad')] [your_courtier.GetHerHim]'den tavsiye istediğinde [your_heir.Custom('GetLassLad')]'i başından savıyordu.\n\nSonrasında [your_heir.GetFirstNameNoTooltip] de değerlendirmemi doğruladı. "[your_courtier.GetSheHe|U] benden çok daha fazlasını biliyor, doğru; ama bir gün [your_courtier.GetHerHis] hükümdarı olacağım. [your_courtier.GetHerHis] saygısına ihtiyacım var!""

 lmf_heir.1608.a:0 "[your_heir.GetFirstNameNoTooltip]'in [your_heir.GetHerHis] savaş bilgisini geliştirmesine yardım et."

 lmf_heir.1608.b:0 "[your_courtier.GetTitledFirstNameNoTooltip]'i azarla. [your_courtier.GetSheHe|U] [your_courtier.GetHerHis] yerini bilmeli."

 lmf_heir.1608.c:0 "Bırak ikisi kendi aralarında çözsün."

 does_not_respect_heir:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] kışladaki küstah saygısızlığı karşısında öfkeden köpürmüştü [CharWereWas(TARGET_CHARACTER)]."

 does_not_respect_heir_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] kışladaki küstah saygısızlığı karşısında öfkeden köpürmüştü [CharWereWas(CHARACTER)]."

 lmf_heir.1609.t:0 "Varis Yaralandı"

 lmf_heir.1609.desc:0 "Gün henüz erkenden [ROOT.Char.Custom('FortifiedBuilding')]'in içinde çılgınca bir haber alıyorum: [your_heir.GetFirstNameNoTooltip] ağır yaralanmış!\n\nEn kötüsünden korkarak kışlaya koşuyorum; [your_heir.GetHerHim]'in diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ların arasında yer almasına izin verdiğim için kendi aptallığıma lanet okuyorum.\n\nRahatlıyorum: [your_heir.GetSheHe] ölmemiş. Ne var ki, bana söylendiğine göre talim sırasında yaşanan garip bir kazada korkunç şekilde yaralanmış.\n\n[GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()]'i çağırıyorum — ne olursa olsun, işin hızla yapılması gerekecek!"

 lmf_heir.1609.a:0 "Göründüğü kadar kötü olmaması için dua etmekten başka elimden bir şey gelmiyor."

 lmf_heir.1609.a.injured.tt:0 "[your_heir.GetTitledFirstNameNoTooltip] yaralandı!"

 lmf_heir.1610.t:0 "Hazırdaki Varis"

 lmf_heir.1610.desc:0 "Yaşlandıkça, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'i yönetmekle ilgili bitmek bilmeyen gündelik işler giderek daha da yorucu geliyor.\n\nDanışmanlarım, yardım için varisime başvurmanın utanılacak bir şey olmadığını söylüyor. [your_heir.GetFirstNameNoTooltip] ne de olsa [ROOT.Char.Custom('FortifiedBuilding')]'de, [your_heir.GetHerHis] kendine ait bir unvanı olmadan yaşıyor. [your_heir.GetSheHe|U] ara sıra büyük salonda adalet dağıtabilir, hatta [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]'in dört bir yanından gelen heyetlerle görüşmelerde beni temsil edebilir.\n\nİtiraf edeyim, dinlenmek için daha çok zamanım olması rahatlatıcı olabilir... ama [your_heir.GetFirstNameNoTooltip] bu tür sorumluluklara gerçekten hazır mı?"

 lmf_heir.1610.a:0 "Hazır olsun olmasın, [your_heir.GetHerHis] yardımına ihtiyacım var."

 lmf_heir.1610.b:0 "Hayır, kendi başıma halledebilirim."

 lmf_heir.1610.a.success.tt:0 "[your_heir.GetFirstNameNoTooltip] [your_heir.GetHerHis] görevlerini iyi yerine getiriyor"

 lmf_heir.1610.a.failure.tt:0 "[your_heir.GetFirstNameNoTooltip] iyi performans göstermiyor"

 lmf_heir.1610.a.critfail.tt:0 "Çaba bir felaket"

 lmf_heir.1611.t:0 "Yeni Bir Proje?"

 lmf_heir.1611.desc:0 "Danışmanlarım [project_county.GetNameNoTierNoTooltip]'de olası bir kalkınma projesi hakkında haber getirdi. Ne yazık ki gözetmenlere bırakılamayacak kadar iddialı; ama benim ya da danışmanlarımın denetimine değecek kadar küçük.\n\nYine de [your_heir.GetFirstNameNoTooltip]'in onu denetlemek için biçilmiş kaftan olabileceği fikri ortaya atıldı. Bu, [your_heir.GetHerHim]'e [ROOT.Char.Custom('FortifiedBuilding')] dışında yerlilerle etkileşim kurma şansı ve paha biçilmez bir deneyim kazandırır.\n\nAma endişeleniyorum... [your_heir.GetHerHis] omuzlarına yüklenecek sorumluluk fazla mı? Ya [your_heir.GetSheHe] işi beceremezse?"

 lmf_heir.1611.a:0 "[your_heir.GetFirstNameNoTooltip] derhal başlamalı."

 lmf_heir.1611.a.success.tt:0 "Kalkınma projesi büyük bir başarı"

 lmf_heir.1611.a.failure.tt:0 "Kalkınma projesi başarısız"

 lmf_heir.1611.a.critfail.tt:0 "Kalkınma projesi bir felaket"

 lmf_heir.1611.b:0 "Hayır, riske değmez."

 lmf_heir_trait_lustful:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar şehvet düşkünü olduğunu. Arzularla öyle dolu ki; yine de [ROOT.GetCharacter.GetSheHe] asla tatmin olmuyor."

 lmf_heir_trait_chaste:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar iffetli olduğunu. [ROOT.GetCharacter.GetSheHe|U] en ufak bir dokunuşta irkiliyor ve cinsellikle ilgili her söz [ROOT.GetCharacter.GetHerHim]'i utandırıyor."

 lmf_heir_trait_gluttonous:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar obur olduğunu. [ROOT.GetCharacter.GetSheHe]'in tek istediği yemek, yemek, yemek!"

 lmf_heir_trait_temperate:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar ölçülü olduğunu. O kadar seçici ve asla aşırıya kaçmamaya öyle dikkatli ki, küçük bir sevinç için bile."

 lmf_heir_trait_greedy:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar açgözlü olduğunu. [ROOT.GetCharacter.GetSheHe]'in [ROOT.GetCharacter.GetHerselfHimself]'ini ilgilendiren tek şey servet ve [ROOT.GetCharacter.GetHersHis]'i olan."

 lmf_heir_trait_generous:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar aşırı cömert olduğunu. Tutumluluğa hiç değer verilmiyor ve sanırım [ROOT.GetCharacter.GetSheHe] düşünmeden bütün paraları dağıtırdı."

 lmf_heir_trait_lazy:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar inanılmaz tembel olduğunu. Her şey fazla zahmetli. Daha kolay bir yol varsa, [ROOT.GetCharacter.GetSheHe] o yolu seçer."

 lmf_heir_trait_diligent:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar çalışkan ve özverili olduğunu. [ROOT.GetCharacter.GetSheHe]'in tek düşündüğü görev ve iş; dinlenmeye dair tek bir düşünce yok."

 lmf_heir_trait_wrathful:0 "[ROOT.GetCharacter.GetSheHe]'in her zaman ne kadar öfkeli olduğunu. [ROOT.GetCharacter.GetHerHis|U] öfkesi her an patlayıp [ROOT.GetCharacter.GetHerHis] sağduyusunu bastırmaya hazır."

 lmf_heir_trait_calm:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tam anlamıyla sakin olduğunu. Hiçbir şey [ROOT.GetCharacter.GetHerHim]'i üzmüyor. Hiçbir şey [ROOT.GetCharacter.GetHerHim]'i etkilemiyor, asla."

 lmf_heir_trait_patient:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar sabırlı olduğunu. Sanırım [ROOT.GetCharacter.GetSheHe|U] dünyanın sonuna kadar bekler ve tamamen mutlu olur."

 lmf_heir_trait_impatient:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar sabırsız olduğunu. Hiçbir şey yeterince çabuk olmuyor. Gelse bile daha önce gelmeliydi."

 lmf_heir_trait_arrogant:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar kibirli olduğunu. [ROOT.GetCharacter.GetSheHe|U] çevresindeki herkese, hatta bana bile tepeden bakıyor."

 lmf_heir_trait_humble:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tam anlamıyla mütevazılaştığını. [ROOT.GetCharacter.GetSheHe] neden bu kadar mütevazı olsun? [ROOT.GetCharacter.GetHerHis] gururu nerede?"

 lmf_heir_trait_deceitful:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar yalancı olduğunu. Bugünlerde [ROOT.GetCharacter.GetHerHis] dudaklarından çıkan tek bir söze bile inanmak güç!"

 lmf_heir_trait_honest:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar dürüst olduğunu. Sanırım [ROOT.GetCharacter.GetSheHe], [ROOT.GetCharacter.Host.GetPrimaryTitle.GetTierAsNameNoTooltip]'in kaderi buna bağlı olsa bile yalan söyleyemez!"

 lmf_heir_trait_craven:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar korkak olduğunu. [ROOT.GetCharacter.GetSheHe|U] tamamen omurgasız; her şeyden çok yalnızca [ROOT.GetCharacter.GetHerHis] kendi canını düşünüyor."

 lmf_heir_trait_brave:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tam anlamıyla küstah olduğunu. Cesur, evet; ama aynı zamanda gözü kara. [ROOT.GetCharacter.GetSheHe|U] birazcık şan uğruna [ROOT.GetCharacter.GetHerHis] canını ortaya atardı."

 lmf_heir_trait_shy:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar utangaç olduğunu. [ROOT.GetCharacter.GetSheHe|U] tüm sosyal etkinliklerden kaçınıyor ve başkalarıyla konuşmanın [ROOT.GetCharacter.GetHerHim] için işkence olduğunu anlayabiliyorum."

 lmf_heir_trait_gregarious:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar sokulgan olduğunu. Hayat bir partiden ibaret gibi ve [ROOT.GetCharacter.GetHerHis] geleceği, bitmeyen eğlenceden çok daha az önemli."

 lmf_heir_trait_ambitious:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tam anlamıyla hırslı olduğunu. [ROOT.GetCharacter.GetHerHis] gözlerindeki parıltı ürkütücü; [ROOT.GetCharacter.GetHerHis] hırsının nerede sona erdiğini merak edip duruyorum."

 lmf_heir_trait_content:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar korkunç derecede halinden memnun olduğunu. [ROOT.GetCharacter.GetHerHis] hayatından, [ROOT.GetCharacter.GetHerHis] mevkiinden memnun. [ROOT.GetCharacter.GetSheHe|U]'in hiç azmi yok."

 lmf_heir_trait_arbitrary:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar keyfi davranır olduğunu. [ROOT.GetCharacter.GetHerHis] değişken zihninden bir saniye sonra değişmeyecek hiçbir düşünce geçmiyor."

 lmf_heir_trait_just:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar korkunç derecede adil ve kanunlara bağlı olduğunu. [ROOT.GetCharacter.GetSheHe|U] sürekli doğru-yanlış muhasebesiyle [ROOT.GetCharacter.GetHerselfHimself]'ine işkence ediyor."

 lmf_heir_trait_cynical:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar alaycı ve dinsiz olduğunu. [ROOT.GetCharacter.GetSheHe|U] [ROOT.GetCharacter.GetFaith.GetNameNoTooltip]'i durmadan sorguluyor."

 lmf_heir_trait_zealous:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar korkunç derecede bağnaz olduğunu. [ROOT.GetCharacter.GetFaith.GetNameNoTooltip]'in dindar bir takipçisi olmaya öyle odaklanmış ki diğer her şey yanında sönük kalıyor."

 lmf_heir_trait_paranoid:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar paranoyak olduğunu. Her şey ve herkes [ROOT.GetCharacter.GetHerHim]'i yok etmeye çalışıyor. [ROOT.GetCharacter.GetSheHe|U] sonsuza dek tetikte."

 lmf_heir_trait_trusting:0 "[ROOT.GetCharacter.GetSheHe]'in şimdi ne kadar korkunç derecede güvenilir olduğunu. Ne ihtiyata ne tedbire, hatta [ROOT.GetCharacter.GetFaith.PantheonTerm2] göstermesin, nefsi müdafaaya bile aldırış yok."

 lmf_heir_trait_compassionate:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar şefkatli olduğunu. [ROOT.GetCharacter.GetSheHe|U] [ROOT.GetCharacter.GetHerHis] kalbini herkesin göreceği şekilde kolunda taşıyor."

 lmf_heir_trait_callous:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tam anlamıyla duygusuzlaştığını. [ROOT.GetCharacter.GetHerHis] ruhunda bir insan duygusu var mı? Zor anlaşılır."

 lmf_heir_trait_sadistic:0 "[ROOT.GetCharacter.GetSheHe]'in şimdi ne kadar sadist olduğunu. Sanırım [ROOT.GetCharacter.GetSheHe|U] sırf keyfi için başkalarına işkence etmekten mutluluk duyacaktır."

 lmf_heir_trait_stubborn:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar inanılmaz inatçı olduğunu. [ROOT.GetCharacter.GetHerHis] aklı bir kez bir şeye kesti mi [ROOT.GetCharacter.GetHerHim]'i yerinden oynatmak imkânsız; mantık bile işe yaramıyor."

 lmf_heir_trait_fickle:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar kararsız olduğunu. Bir gün uygun görülen şey bugün iğrenç. [ROOT.GetCharacter.GetHerHim]'i neyin memnun edeceği asla bilinemez, hiçbir zaman."

 lmf_heir_trait_eccentric:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tuhaf ve eksantrik olduğunu. Acaba [ROOT.GetCharacter.GetHerHis] aklı yerinde mi? Eminim bu soruyu soran tek kişi ben değilim."

 lmf_heir_trait_vengeful:0 "[ROOT.GetCharacter.GetSheHe]'in geliştirdiği ne korkunç bir intikam duygusu. [ROOT.GetCharacter.GetSheHe]'in korkunç bir bedel ödetmeyeceği kadar küçük bir haksızlık yok."

 lmf_heir_trait_forgiving:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar tuhaf bir şekilde affedici olduğunu. Sanırım [ROOT.GetCharacter.GetSheHe|U] herhangi bir hakaret için herkesi affeder. Bunun sonu nerede?"

 lmf_heir_trait_drunkard:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar içmeye meyilli olduğunu. [ROOT.GetCharacter.GetSheHe]'in iddia ettiği gibi yalnızca neşelenmek için değil, her zaman ve aşırı derecede! Kimileri zararsız diye gülüp geçiyor; ama hükümdarı olarak salyalı bir ayyaş isteyen var mı?"

 lmf_heir_trait_rakish:0 "[ROOT.GetCharacter.GetSheHe]'in tanıştığı neredeyse her genç [ROOT.GetCharacter.Custom('WomanManOpposite')]'e ne kadar sarktığını. [ROOT.GetCharacter.GetSheHe|U]'in hiç edep anlayışı yok, bu yakışıksız."

 lmf_heir_trait_rakish_homosexual:0 "[ROOT.GetCharacter.GetSheHe]'in tanıştığı neredeyse her genç [ROOT.GetCharacter.Custom('GetLassLad')]'e ne kadar sarktığını — sanki ben fark etmeyecekmişim! [ROOT.GetCharacter.GetHerHis] arzularını kontrol edemem, doğru; ama bu? Bu yakışıksız."

 lmf_heir_trait_rakish_bisexual:0 "[ROOT.GetCharacter.GetSheHe]'in karşılaştığı neredeyse her güzel genç şeye ne kadar sarktığını — oğlan, kız, hiç fark etmiyor! [ROOT.GetCharacter.GetHerHis] arzularını kontrol edemem, doğru; ama bu? Bu yakışıksız."

 lmf_heir_trait_reclusive:0 "[ROOT.GetCharacter.GetSheHe]'in işler stresli olduğu anda gözden kaybolmaya ne kadar meyilli olduğunu. [ROOT.GetCharacter.GetSheHe|U] [ROOT.GetCharacter.GetHerHis] odasına kapanıp dışarı çıkmıyor."

 lmf_heir_trait_irritable:0 "[ROOT.GetCharacter.GetHerHis] öfkesinin işler stresli olduğu anda ne kadar çabuk patladığını. [ROOT.GetCharacter.GetSheHe|U] hizmetkârları parmak uçlarında dolaştırıyor; [ROOT.GetCharacter.GetSheHe]'in her an bir canavara dönüşebileceğinden korkarak."

 lmf_heir_trait_profligate:0 "[ROOT.GetCharacter.GetSheHe]'in parasıyla ne kadar kötü olduğunu. [ROOT.GetCharacter.GetSheHe|U] parayı hiçbir şeymiş gibi, dağlar dolusu parası varmış gibi harcıyor; ne için? [ROOT.GetCharacter.GetHerHim]'i iyi hissettirmek için, diyor [ROOT.GetCharacter.GetSheHe]."

 lmf_heir_trait_improvident:0 "[ROOT.GetCharacter.GetSheHe]'in [ROOT.GetCharacter.GetHerHis] paralarını dağıtmaya ne kadar çabuk olduğunu. Biri en ufak bir sıkıntı gösterdi mi, [ROOT.GetCharacter.GetSheHe] orada onu paralara boğuyor. Kimileri buna cömertlik diyor, kimileri sırf düşüncesizlik; ama bu? Bu bir dürtü bozukluğu."

 lmf_heir_trait_contrite:0 "[ROOT.GetCharacter.GetSheHe]'in dinleyecek birine [ROOT.GetCharacter.GetHerHis] her sırrını gevezelikle anlatmaya ne kadar çabuk olduğunu. Ruhunu boşaltmanın bir yolu, evet; ama kendi sırrını bile tutamayan hükümdarın ne faydası var?"

 lmf_heir_trait_inappetetic:0 "[ROOT.GetCharacter.GetSheHe]'in ne kadar az yediğini. İşler stresli olduğu anda [ROOT.GetCharacter.GetSheHe] [ROOT.GetCharacter.GetHerHis] yemeğini iter; bu basit bir ölçülülük değil. Zamanla [ROOT.GetCharacter.GetHerHis] sağlığını etkileyeceğinden korkuyorum."

 lmf_heir.1612.t:0 "[heir_trait.GetNameNoTooltip( your_heir )|U] Varisim"

 lmf_heir.1612.desc.opening:0 "[your_heir.GetFirstNameNoTooltip]'i varisim olarak eğitmekle o kadar çok zaman geçirdim ki [your_heir.Custom('heir_trait_description')] fark ettim.\n\nBu nasıl olur? "

 lmf_heir.1612.desc.opposite:0 "[your_heir.GetSheHe] nasıl benden bu kadar farklı biri olarak büyüyebildi?\n\n"

 lmf_heir.1612.desc.alsosinful:0 "Erdem örneği olduğum söylenemez; ama bu? Buna katlanamam.\n\n"

 lmf_heir.1612.desc.sinful:0 "Nasıl bu kadar günah dolu bir varis yetiştirdim?\n\n"

 lmf_heir.1612.desc.default:0 "Bu, [your_heir.GetHerHis] mevkiindeki genç bir [your_heir.GetWomanMan]'e yakışan bir davranış değil.\n\n"

 lmf_heir.1612.desc.end:0 "Daha da önemlisi: bu konuda ne yapmalıyım? Birbirimizin eşliğinde o kadar çok vakit geçiriyoruz ki, [your_heir.Custom('GetLassLad')]'i [your_heir.GetHerHis] alışkanlıklarını değiştirmeye zorlamayı deneyebilirim."

 lmf_heir.1612.a:0 "[your_heir.GetHerHim] için zor olabilir; ama denemeliyim."

 lmf_heir.1612.a.success.tt:0 "[your_heir.GetFirstNameNoTooltip] değişmeye ikna ediliyor"

 lmf_heir.1612.a.failure.tt:0 "[your_heir.GetFirstNameNoTooltip] bu girişime içerliyor"

 tried_to_change_heir:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] kişiliğini zorla değiştirmeye çalıştı."

 tried_to_change_heir_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] kişiliğini zorla değiştirmeye çalıştı."

 lmf_heir.1612.b:0 "İşleri olduğu gibi bırak."

 lmf_heir.1613.t:0 "İsteksiz Varis"

 lmf_heir.1613.desc:0 "Görmek üzücü; ama [your_heir.GetFirstNameNoTooltip] son zamanlarda varis olarak [your_heir.GetHerHis] görevlerini pek ciddiye almıyor.\n\n[your_heir.GetHerHim]'in öğreneceği çok şey var, [your_heir.GetSheHe]'in kabul etmesi gereken pek çok sorumluluk var; ta ki bir gün [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'e hükmetmeye hazır olana dek... ama son zamanlarda [your_heir.GetFirstNameNoTooltip] bunların dışında her şeyi yapmayı tercih ediyor gibi.\n\nÜzücü bir durum, kesinlikle."

 lmf_heir.1613.a:0 "Umarız [your_heir.GetSheHe] yakında farklı bir havaya girer."

 lmf_heir.1614.t:0 "Gerçek Özveri"

 lmf_heir.1614.desc:0 "Son zamanlarda [your_heir.GetFirstNameNoTooltip]'in, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'in gelecekteki hükümdarı olarak [your_heir.GetHerHis] görev ve sorumluluklarına bu kadar bağlı olmasını görmek güzel.\n\n[your_heir.GetSheHe|U] saraya katılıyor, [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] işlerinden haberdar olmak için konseyimle görüşüyor, hatta halkın derdinden haberdar olmak için düzenli olarak kırsalı geziyor.\n\n[your_heir.GetHerHim]'i mola almaya ikna etmek için yapabildiğim tek şey bu!"

 lmf_heir.1614.a:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] emin ellerde olacak gibi görünüyor."

 lmf_heir.1615.t:0 "En İçten Dalkavukluk"

 lmf_heir.1615.desc:0 "Birbirimizin eşliğinde o kadar çok vakit geçiriyoruz ki, [your_heir.GetFirstNameNoTooltip]'in giderek bana benzemesinin kaçınılmaz olduğunu düşünüyorum.\n\nSon zamanlarda [your_heir.GetSheHe]'in beni dikkatle izlediğini, hizmetkârlarla benim gibi konuşmaya çalıştığını ve davranışlarımı taklit ettiğini fark ediyorum... benim bile farkında olmadığım ya da [your_heir.GetSheHe]'in taklit etmemesini tercih ettiğim şeyleri bile.\n\nSanırım gurur duymalıyım?"

 lmf_heir.1615.a:0 "Belki [your_heir.GetSheHe]'in [your_heir.GetHerHis] başına daha fazla zamana ihtiyacı var?"

 lmf_heir.1625.t:0 "Yurt Dışında Seyahat"

 lmf_heir.1625.desc.start:0 "[your_heir.GetFirstNameNoTooltip] bu sabah oldukça ilginç bir planla yanıma geldi.\n\n"

 lmf_heir.1625.desc.family:0 ""[your_heir.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], "

 lmf_heir.1625.desc.notfamily:0 ""My [ROOT.Char.GetLadyLord], "

 lmf_heir.1625.desc.mid:0 "Beni varisin olarak eğitmek için elinden geleni yaptığını biliyorum; ama eğitimimin hepsi [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de bulunmuyor. Belki bir süreliğine [your_heir.Custom2('direct_address_by_familiarity', SCOPE.sC('your_vassal'))]'i ziyaret edebilirim diye düşünüyordum?"\n\nNoticing my reluctance, [your_heir.GetSheHe] quickly continued. "[your_vassal.GetSheHe|U] is "

 lmf_heir.1625.desc.diplomacy:0 "diplomaside oldukça bilgili,"

 lmf_heir.1625.desc.martial:0 "savaş işlerinde bir uzman,"

 lmf_heir.1625.desc.stewardship:0 "idarecilik meselelerinde iyi bilgili,"

 lmf_heir.1625.desc.intrigue:0 "entrika sanatlarında oldukça becerikli,"

 lmf_heir.1625.desc.learning:0 "kendi başına bilgili bir [your_vassal.GetWomanMan],"

 lmf_heir.1625.desc.bridge:0 "ne de olsa, ve "

 lmf_heir.1625.desc.myfriend:0 "aynı zamanda iyi bir dostum. "

 lmf_heir.1625.desc.friend:0 "aynı zamanda dostun. "

 lmf_heir.1625.desc.ally:0 "aynı zamanda müttefikin. "

 lmf_heir.1625.desc.alsofamily:0 "aynı zamanda aileden. "

 lmf_heir.1625.desc.vassal:0 "aynı zamanda senin yeminli vassalın. "

 lmf_heir.1625.desc.liege:0 "aynı zamanda hükümdarımız. "

 lmf_heir.1625.desc.realm:0 "[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]'den ayrılmıyorum bile! "

 lmf_heir.1625.desc.end:0 "[your_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip]'de [your_vassal.GetHerHim] ile birkaç ay geçirmek bana çok şey öğretebilir."\n\nIt's possible [your_heir.GetFirstNameNoTooltip] has ulterior motives and simply wishes to finally get out of the [ROOT.Char.Custom('FortifiedBuilding')], but then who could blame [your_heir.GetHerHim]?"

 lmf_heir.1625.a:0 "[your_heir.GetSheHe|U] gidebilir."

 lmf_heir.1625.a.tt:0 "[your_heir.GetTitledFirstName], [your_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e yolculuk edecek ve [your_vassal.GetTitledFirstName] ile altı aya kadar kalacak; orada [your_heir.GetSheHe], senin varisin olarak [your_heir.GetHerHis] eğitimine katkı sağlayabilir"

 lmf_heir.1625.a.player.tt:0 "[your_vassal.GetTitledFirstName]'e önce [your_vassal.GetSheHe]'in [your_heir.GetTitledFirstName]'i kabul etmeye istekli olup olmadığı sorulmalı"

 lmf_heir.1625.b:0 "Hayır, [your_heir.GetSheHe] burada, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de kalıyor."

 lmf_heir.1626.opening:0 "[heir_liege.Custom2('direct_address_by_familiarity', ROOT.Char)|U],"

 lmf_heir.1626.desc.opening.family:0 "[heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] [your_heir.GetFirstNameNoTooltip], önümüzdeki aylarda seni ziyaret etme arzusunu dile getirdi.\n\n"

 lmf_heir.1626.desc.opening:0 "Varisim [your_heir.GetTitledFirstName]'in önümüzdeki aylarda seni ziyaret etmesi için izin istemek üzere yazıyorum.\n\n"

 lmf_heir.1626.desc:0 "[your_heir.Custom('GetLassLad')]'in eğitimine yardımcı olabilirsen minnettar olurum; ama vermeye istekli olduğunun ötesinde bir zaman taahhüdü istemiyorum. Yalnızca [your_heir.GetFirstNamePossessiveNoTooltip] güvenliğinin garantisini ve [your_heir.GetSheHe]'in [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'e erişimine izin verilmesini rica ediyorum; böylece orayı ve halkını daha iyi tanıyabilir."

 lmf_heir.1626.a:0 "Elbette [your_heir.GetSheHe] hoş karşılanır."

 lmf_heir.1626.a.tt:0 "[your_heir.GetTitledFirstName], [your_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e yolculuk edecek ve altı aya kadar kalacak"

 lmf_heir.1626.b:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_liege'))]'e üzüntülerimi ilet."

 lmf_heir.1627.opening:0 "[your_vassal.Custom2('GreetingToLiegePositive', ROOT.Char)],"

 lmf_heir.1627.desc:0 "Elbette [your_heir.GetTitledFirstNameNoTooltip] hoş karşılanır. [your_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bizler [your_heir.GetHerHis] gelişini dört gözle bekliyoruz."

 lmf_heir.1627.a:0 "Mükemmel."

 lmf_heir.1628.opening:0 "[your_vassal.Custom2('GreetingToLiege', ROOT.Char)],"

 lmf_heir.1628.desc:0 "Ne yazık ki, [your_heir.GetTitledFirstNameNoTooltip]'in [your_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'i ziyaret etmesi için uygun bir zaman değil. Keşke öyle olmasa; ama [your_heir.GetSheHe]'in bir yolculuğun emeğini boşa harcamaması en iyisi."

 lmf_heir.1628.a:0 "[your_heir.GetSheHe|U] onun yerine [alternate_vassal.GetFullName]'i ziyaret edebilir."

 lmf_heir.1628.b:0 "Bu da böyle gitti."

 lmf_heir.1630.t.cancel:0 "Ziyaret İptal Edildi"

 lmf_heir.1630.desc.title:0 "[your_heir.GetTitledFirstName], [your_heir.GetPrimaryTitle.GetNameNoTierNoTooltip]'in [your_heir.GetTitleAsNameNoTooltip|U] olduğu için [your_heir.GetHerHis] ziyaretini iptal etmek zorunda kaldı."

 lmf_heir.1630.desc.war:0 "[heir_liege.GetTitledFirstName], savaşın patlak vermesi üzerine [your_heir.GetTitledFirstName]'i evine geri çağırdı."

 lmf_heir.1630.desc.target.death:0 "[your_heir.GetFirstName], [heir_visit_target.GetTitledFirstName]'in ölümü yüzünden [your_heir.GetHerHis] ziyaretini iptal etmek zorunda kaldı."

 lmf_heir.1630.desc.heir.death:0 "[your_heir.GetTitledFirstNamePossessive] ziyareti, [your_heir.GetHerHis] erken ölümü yüzünden iptal edildi."

 lmf_heir.1630.desc.imprisoned:0 "[your_heir.GetTitledFirstName], [your_heir.GetHerHis] hapsedilmesi yüzünden [heir_visit_location.GetTitle.GetNameNoTierNoTooltip]'e yapacağı [your_heir.GetHerHis] ziyareti iptal etmek zorunda kaldı."

 lmf_heir.1630.desc.incapable:0 "[your_heir.GetTitledFirstName], [your_heir.GetSheHe] artık [GetTrait('incapable').GetName(your_heir)] olduğu için [heir_visit_location.GetTitle.GetNameNoTierNoTooltip]'e yapacağı [your_heir.GetHerHis] ziyareti iptal etmek zorunda kaldı."

 lmf_heir.1630.desc.notheir:0 "[your_heir.GetTitledFirstName], [your_heir.GetSheHe] artık [heir_liege.GetShortUINamePossessiveNoFormat] varisi olmadığı için [heir_visit_location.GetTitle.GetNameNoTierNoTooltip]'e yapacağı [your_heir.GetHerHis] ziyareti iptal etmek zorunda kaldı."

 lmf_heir.1630.desc.notruler:0 "[your_heir.GetTitledFirstName], [heir_liege.GetShortUINameNoFormat] artık bir hükümdar olmadığı için [heir_visit_location.GetTitle.GetNameNoTierNoTooltip]'e yapacağı [your_heir.GetHerHis] ziyareti iptal etmek zorunda kaldı."

 lmf_heir.1631.t.cancel:0 "[your_heir.GetFirstNameNoTooltip] Eve Dönüyor"

 lmf_heir.1631.desc.dead:0 "[your_heir.GetFirstName], [heir_visit_target.GetShortUINamePossessiveNoFormat] ani ölümü yüzünden [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı."

 lmf_heir.1631.desc.notruler:0 "[your_heir.GetFirstName], [heir_visit_target.GetShortUINameNoFormat] artık [target_county.GetNameNoTierNoTooltip]'de [Select_CString( heir_visit_target.IsLocalPlayer, 'hüküm sürmüyorsun', 'hüküm sürmüyor' )] olduğu için [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı."

 lmf_heir.1631.desc.imprisoned:0 "[your_heir.GetFirstName], [heir_visit_target.GetShortUINamePossessiveNoFormat] hapsedilmesi yüzünden [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı."

 lmf_heir.1631.desc.siege:0 "[your_heir.GetFirstName], [heir_visit_location.GetTitle.GetNameNoTierNoTooltip] [heir_visit_target.GetShortUINamePossessiveNoFormat] düşmanlarınca kuşatma altına alındığı için [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı."

 lmf_heir.1631.desc.isolating:0 "[your_heir.GetFirstName], [heir_visit_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de yayılan hastalık yüzünden [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı; [heir_visit_target.GetShortUINameNoFormat] [CharYourHerHis(heir_visit_target)] tüm ailesini tecrit etmeden hemen önce ayrıldı."

 lmf_heir.1631.desc.capital:0 "[your_heir.GetFirstName], [heir_visit_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de yayılan hastalık yüzünden [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı; [heir_visit_target.GetShortUINameNoFormat] [heir_visit_location.GetTitle.GetNameNoTierNoTooltip]'i kapatmadan hemen önce ayrıldı."

 lmf_heir.1631.desc.incapable:0 "[your_heir.GetFirstName], [heir_visit_target.GetShortUINamePossessiveNoFormat] [GetTrait('incapable').GetName(heir_visit_target)] hale geldiği [CharHaveHas(heir_visit_target)] için [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı."

 lmf_heir.1631.desc:0 "[your_heir.GetFirstName], [your_heir.GetHerHis] yolculuğu kısa kesmek zorunda kaldı."

 lmf_heir.1632.t:0 "[your_heir.GetFirstNameNoTooltip]'i geri çağır?"

 lmf_heir.1632.desc.atwar.primary:0 "Artık [heir_host.GetTitledFirstNameNoTooltip] ile savaşta olduğumuza göre, [your_heir.GetFirstNameNoTooltip]'in şu anda [heir_host.GetHerHim]'i ziyaret etmekte olduğu endişe verici bir mesele var.\n\n[ROOT.Char.Custom2('LMF_RelationToMeShort', your_heir )]'i derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağırmalıyız."

 lmf_heir.1632.desc.atwar.rootattacker:0 "[defender.GetTitledFirstNameNoTooltip]'e karşı savaşım, [heir_host.GetTitledFirstNameNoTooltip] ile de savaş halinde olduğum anlamına geliyor; bu da [your_heir.GetFirstNameNoTooltip]'in şu anda [heir_host.GetHerHim]'i ziyaret etmekte olduğu endişe verici gerçeğini ortaya çıkarıyor.\n\n[ROOT.Char.Custom2('LMF_RelationToMeShort', your_heir )]'i derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağırmalıyız."

 lmf_heir.1632.desc.atwar.rootdefender:0 "[attacker.GetTitledFirstNamePossessiveNoTooltip] bana karşı savaşı, [heir_host.GetTitledFirstNameNoTooltip] ile de savaş halinde olduğum anlamına geliyor ve bu da [your_heir.GetFirstNameNoTooltip]'in şu anda [heir_host.GetHerHim]'i ziyaret etmekte olduğu endişe verici gerçeğini ortaya çıkarıyor.\n\n[ROOT.Char.Custom2('LMF_RelationToMeShort', your_heir )]'i derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağırmalıyız."

 lmf_heir.1632.desc.atwar:0 "[defender.GetTitledFirstNameNoTooltip] ile [attacker.GetTitledFirstNameNoTooltip] arasındaki savaş ne yazık ki artık [heir_host.GetTitledFirstNameNoTooltip] ile de savaş halinde olduğum anlamına geliyor; bu da [your_heir.GetFirstNameNoTooltip]'in şu anda [heir_host.GetHerHim]'i ziyaret etmekte olduğu endişe verici gerçeğini ortaya çıkarıyor.\n\n[ROOT.Char.Custom2('LMF_RelationToMeShort', your_heir )]'i derhal [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geri çağırmalıyız."

 lmf_heir.1632.desc:0 "Savaş, [your_heir.GetFirstNameNoTooltip]'i [heir_host.GetTitledFirstNameNoTooltip] ile ziyaretinden geri çağırıp çağırmama sorusunu gündeme getiriyor.\n\n[your_heir.GetSheHe|U] yakın bir tehlikede değil, doğru; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', your_heir )]'ime burada, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de ihtiyacım olmasa bile, [heir_host.GetTitledFirstNamePossessiveNoTooltip]'in [heir_host.GetHerHis] güvenliği garantisinin artık çok daha az kesin olduğu gerçeği de var."

 lmf_heir.1632.a:0 "[your_heir.GetHerHim]'e derhal gitmesini söyle."

 lmf_heir.1632.b:0 "[your_heir.GetFirstNameNoTooltip] olduğu yerde gayet iyi."

 lmf_heir.1633.t:0 "Yeni Bir Ziyaretçi"

 lmf_heir.1633.desc.begin:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )], kararlaştırıldığı gibi [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e vardı,"

 lmf_heir.1633.desc.away:0 "ne yazık ki [your_heir.GetHerHim]'i karşılamak için orada değildim ve [your_heir.GetHerHis] ziyareti sırasında [your_heir.GetHerHim] ile çok vakit geçirebilmem de olası değil.\n\n[your_heir.GetHerHim]'e [ROOT.Char.Custom('FortifiedBuilding')]'de serbest dolaşma izni verip, [your_heir.GetHerHim]'in ortalığı karıştırıp bulduğu her şeyi [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'ine rapor etme riskini mi alacağıma, yoksa [your_heir.GetHerHim]'i çevredeki kırsalda [your_heir.GetSheHe] ne isterse onu yapmaya mı bırakacağıma karar vermem gerekecek."

 lmf_heir.1633.desc.end:0 "bu yüzden [your_heir.GetHerHim]'i bizzat karşılamak için avluya indim.\n\nÖnümüzdeki birkaç ay [your_heir.GetHerHim] ile vakit geçirip geçirmeyeceğime karar vermem gerekecek; [your_heir.GetHerHim]'e [ROOT.Char.Custom('FortifiedBuilding')]'de serbest dolaşma izni vererek... ki [your_heir.GetSheHe]'in ortalığı karıştırıp bulduğu her şeyi [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'ine rapor etme riski var; ya da [your_heir.GetHerHim]'i çevredeki kırsalda [your_heir.GetSheHe] ne isterse onu yapmaya bırakmalıyım."

 lmf_heir.1633.a:0 "Bu, birbirimizi daha iyi tanımamız için bir fırsat."

 lmf_heir.1633.a.tt:0 "#EMP [your_heir.GetShortUINameNoTooltipNoFormat|U] önümüzdeki birkaç ayı [THIS.Char.Custom('FortifiedBuilding')]'de, senin ve saraylılarının yanında talim yaparak geçirecek. Muhtemelen ilişkinizi iyileştirecek; ama [your_heir.GetSheHe] ortalığı karıştırabilir ve bazı sırlarını öğrenebilir.#!"

 spent_time_with_visiting_heir:0 "[CHARACTER.GetShortUIName] ve [TARGET_CHARACTER.GetShortUIName], [CharYourHerHis(TARGET_CHARACTER)] [CHARACTER.GetShortUINamePossessiveNoTooltip] [CHARACTER.Custom('FortifiedBuilding')]'ine ziyareti sırasında birlikte vakit geçirdiler"

 spent_time_with_visiting_heir_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] ve [CHARACTER.GetShortUIName], [CharYourHerHis(CHARACTER)] [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] [TARGET_CHARACTER.Custom('FortifiedBuilding')]'ine ziyareti sırasında birlikte vakit geçirdiler"

 lmf_heir.1633.b:0 "[your_heir.GetSheHe|U] kalabilir ama benim ilgileneceğim daha önemli işlerim var."

 lmf_heir.1633.c:0 "[your_heir.GetSheHe]'in eğlendirilmesini sağlayacağız."

 lmf_heir.1633.c.tt:0 "#EMP [your_heir.GetShortUINameNoTooltipNoFormat|U] önümüzdeki birkaç ayı [THIS.Char.Custom('FortifiedBuilding')]'de, saraylılarınla talim yaparak geçirecek. [your_heir.GetSheHe|U] ortalığı karıştırabilir ve bazı sırlarını öğrenebilir; ama daha kötü bir şey olma ihtimali çok az.#!"

 lmf_heir.1633.d:0 "[your_heir.GetSheHe]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de ne yaptığı beni ilgilendirmez."

 lmf_heir.1633.d.tt:0 "#EMP [your_heir.GetShortUINameNoTooltipNoFormat|U] [THIS.Char.Custom('FortifiedBuilding')]'e alınmayacak; bunun yerine önümüzdeki birkaç ayı çevredeki kırsalda geçirecek. [your_heir.GetSheHe|U] [your_heir.GetHerHis] başına bela bulabilir ve [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )] mutsuz olabilir; ama orada kimseye zararı dokunmayacak.#!"

 lmf_heir.1651.t:0 "Etkileyici Bir Varis"

 lmf_heir.1651.desc.away:0 "Bizzat görmesem de bana şöyle dendi: "

 lmf_heir.1651.desc.busy:0 "[your_heir.GetHerHim] ile az zaman geçirdim ama şunları duydum: "

 lmf_heir.1651.desc.there:0 "Şunu memnuniyetle not ediyorum: "

