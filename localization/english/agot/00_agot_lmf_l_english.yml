 lmf_interaction.1326.t:0 "Güzel Bir Başlangıç"

 lmf_interaction.1326.desc.start.actor:0 "[secondary_recipient.GetFirstNamePossessiveNoTooltip] ile geçirilen gün güzel geçti.\n\nBiz "

 lmf_interaction.1326.desc.start.actor.hunting:0 "[actor.Custom('FortifiedBuilding')]'in pek uzağında olmayan bir yerde rahat bir ava çıktılar. Amaç elbette bir şey yakalamak değil, konuşmaktı. "

 lmf_interaction.1326.desc.start.actor.hike:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in hemen çevresindeki topraklarda gezdik; ben çeşitli tarihî yerleri işaret ediyordum. Asıl amaç elbette konuşmaktı. "

 lmf_interaction.1326.desc.start.actor.garrison:0 "[actor.Custom('FortifiedBuilding')] garnizonuna gittik; [secondary_recipient.GetHerHim] [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larla görkemli bir şekilde talim yapışımı izlerken. Her mola verdiğimde konuşurduk. "

 lmf_interaction.1326.desc.start.actor.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdik; [secondary_recipient.GetHerHim] ben aşk ve yiğitlik üzerine [actor.GetCulture.GetNameNoTooltip] şiirleri okurken dinliyordu. Ama çoğunlukla konuştuk. "

 lmf_interaction.1326.desc.start.actor.library:0 "kütüphaneyi gezdik; [secondary_recipient.GetHerHim]'e en kıymetli ciltlerimi gösterirken rafları karıştırdık. Amaç elbette kitaplardan çok, konuşmaktı. "

 lmf_interaction.1326.desc.start.actor.poor:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l]'in dışındaydılar; yoksullara sadaka ve teselli dağıtıyorlardı. Övgüye değer bir uğraş olsa da, asıl hedef elbette bizim konuşmamızdı. "

 lmf_interaction.1326.desc.start.actor.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdik. [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in sunduklarını gururla sergiledim; ama asıl amaç, elbette, bizim konuşmamızdı. "

 lmf_interaction.1326.desc.start.actor.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde dolaştık; sonunda konuşmamız için huzurlu ve güzel bir ortam. "

 lmf_interaction.1326.desc.start.actor.hated:0 "Ve gerçekten konuştuk.\n\n[secondary_recipient.GetFirstNameNoTooltip] [secondary_actor.Custom('lmf_intro_activity_short')]'i açıkça inanılmaz sıkıcı buldu; ama yine de "

 lmf_interaction.1326.desc.start.actor.loved:0 "Ve gerçekten konuştuk.\n\n[secondary_recipient.GetFirstNameNoTooltip] [secondary_recipient.GetHerselfHimself]'inden muazzam keyif alıyor gibiydi ve biz "

 lmf_interaction.1326.desc.start.actor.neutral:0 "Ve gerçekten konuştuk.\n\nGün boyunca biz "

 lmf_interaction.1326.desc.start.actor.mid:0 "gelecek hakkında ve ondan ne umduğumuz hakkında uzun uzun konuştuk. Her yerde gözler olduğunu bilmemize rağmen, sanırım ikimiz de kendimizi bir şekilde rahat hissettik.\n\nGüneş batmaya başladığında bana netleşti: evlenebileceğim bir [secondary_recipient.Custom('WomanManGirlBoy')] bu ve [secondary_recipient.GetSheHe]'in de aynı şeyi hissettiğinden eminim."

 lmf_interaction.1326.desc.actor.lover:0 "Aslında [secondary_recipient.GetHerHis] gözlerinde bir parıltı vardı; belki de [secondary_actor.GetWifeHusband] olmanın ötesinde bana ilgi duyuyordu. Belki âşık da olabilirdik."

 lmf_interaction.1326.desc.actor.friends:0 "Aslında ikimizin de gerçek bir bağ bulduğunu düşünüyorum... illa âşık olarak değil. Henüz değil, her halükârda. Ama dost olarak. Düşünsene! Hem [secondary_recipient.GetWifeHusband] hem de en yakın yoldaşım olan biri."

 lmf_interaction.1326.desc.actor.end:0 "\n\nO halde asıl soru: benim istediğim bu mu?"

 lmf_interaction.1326.desc.start:0 "[secondary_actor.GetFirstNameNoTooltip] ve [secondary_recipient.GetFirstNameNoTooltip]'in birbirlerinin eşliğinde geçirdiği gün başarılı geçti.\n\nOnlar "

 lmf_interaction.1326.desc.hunting:0 "[actor.Custom('FortifiedBuilding')]'in pek uzağında olmayan bir yerde rahat bir ava çıktılar. Amaç elbette av değil, ikisinin konuşma fırsatı bulmasıydı. "

 lmf_interaction.1326.desc.hike:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] çevresindeki topraklarda gezdiler; [secondary_actor.GetFirstNameNoTooltip] çeşitli tarihi yerleri gösteriyordu. Elbette asıl amaç ikisinin konuşmasıydı. "

 lmf_interaction.1326.desc.garrison:0 "[actor.Custom('FortifiedBuilding')] garnizonuna gittiler; [secondary_actor.GetFirstNameNoTooltip] [actor.Custom('KnightCulturePluralNoTooltipLowercase')] ile idman yaparken [secondary_recipient.GetFirstNameNoTooltip] izliyordu. [secondary_actor.GetSheHe] mola verdiğinde konuşurlardı. "

 lmf_interaction.1326.desc.seduction:0 "[actor.Custom('FortifiedBuilding')] arazisinde gezdiler... bildirilenlere göre biraz fazla yakın. Hatta [secondary_actor.GetFirstNamePossessiveNoTooltip] davranışının kimi zaman uygunsuz olduğu söylenebilir; oysa amaç ikisinin konuşmasıydı. "

 lmf_interaction.1326.desc.poetry:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdiler; [secondary_recipient.GetFirstNameNoTooltip], [secondary_actor.GetFirstNameNoTooltip]'in aşk ve yiğitlik üzerine [secondary_actor.GetCulture.GetNameNoTooltip] şiirleri okumasını dinliyordu... ya da öyle bildirildi. Ama çoğunlukla konuştular. "

 lmf_interaction.1326.desc.library:0 "kütüphaneyi gezdiler; [secondary_actor.GetFirstNameNoTooltip] [secondary_recipient.GetFirstNameNoTooltip]'e en kıymetli ciltlerimizi gösterirken rafları karıştırdılar. Amaç elbette kitaplardan çok, ikisinin konuşmasıydı. "

 lmf_interaction.1326.desc.church:0 "[actor.GetFaith.HouseOfWorship|l]'e gittiler; bana söylendiğine göre, konuşmadıkları zamanlarda dindarlık üzerine vaazları dinlediler. "

 lmf_interaction.1326.desc.tavern:0 "[actor.Custom('FortifiedBuilding')] yakınındaki bir köye gittiler, çoğunlukla bir meyhanede. Bana söylendiğine göre [secondary_actor.GetFirstNameNoTooltip] eğlenmeye kararlıydı; ama buna rağmen konuşmak için pek çok fırsatları olmuş. "

 lmf_interaction.1326.desc.poor:0 "[actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki [actor.GetFaith.HouseOfWorship|l] dışındaydılar, yoksullara sadaka ve teselli dağıtıyorlardı. Değerli bir uğraş olsa da, elbette asıl amaç konuşmalarıydı. "

 lmf_interaction.1326.desc.tour:0 "[actor.Custom('FortifiedBuilding')]'i ve çevredeki toprakları gezdiler; [secondary_actor.GetFirstNameNoTooltip] [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in sunduklarını gururla sergiledi... ama asıl amaç, elbette, ikisinin konuşmasıydı. "

 lmf_interaction.1326.desc.garden:0 "[actor.Custom('FortifiedBuilding')] bahçelerinde gezdiler; sonunda konuşmaları için huzurlu ve güzel bir ortam. "

 lmf_interaction.1326.desc.hated:0 "[secondary_recipient.GetFirstNameNoTooltip]'in [secondary_actor.Custom('lmf_intro_activity_short')]'i sıkıcı bulduğu açık olsa da,"

 lmf_interaction.1326.desc.loved:0 "[secondary_recipient.GetFirstNameNoTooltip], anlatıldığına göre, [secondary_actor.Custom('lmf_intro_activity_short')]'i tam bir keyif olarak buldu ve "

 lmf_interaction.1326.desc.neutral:0 "[secondary_recipient.GetFirstNameNoTooltip] [secondary_actor.Custom('lmf_intro_activity_short')]'den epey hoşlanmış görünüyordu ve "

 lmf_interaction.1326.desc.mid:0 "dostça sohbet ettiler. Her hareketlerini izleyen gözler olmasına rağmen rahat görünüyorlardı ve gün bir başarı gibiydi.\n\nGüneş batmaya başlayıp çift akşam yemeği için [ROOT.Char.Custom('FortifiedBuilding')]'e çağrıldığında, [secondary_actor.GetFirstNameNoTooltip] bunu özel olarak itiraf etti.\n\n"This is the [secondary_recipient.Custom('WomanManGirlBoy')] I want to marry," [secondary_actor.GetSheHe] said.\n\n"

 lmf_interaction.1326.desc.secrec.player:0 "O halde soru şu: [secondary_recipient.GetTitledFirstNameNoTooltip] de aynı şeyleri hissediyor mu? Ve onların [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l]'i hâlâ istediğim şey mi?"

 lmf_interaction.1326.desc.end:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('secondary_recipient'))]'in de aynı şeyleri hissettiği açık. O halde soru şu: onların [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l]'i hâlâ istediğim şey mi?"

 lmf_interaction.1326.a:0 "Evet, dengimi buldum."

 lmf_interaction.1326.b:0 "Başka bir sevgiliye ihtiyacım yok; yalnızca bir [secondary_recipient.GetWifeHusband]'a."

 lmf_interaction.1326.c:0 "Evleneceğiz; ama başka bir dosta ihtiyacım yok."

 lmf_interaction.1326.d:0 "[secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] ile devam et!"

 lmf_interaction.1326.e:0 "Evleneceğiz ve [secondary_recipient.GetSheHe] sevgilim olacak."

 lmf_interaction.1326.f:0 "Evet, [secondary_recipient.GetSheHe] benim [secondary_recipient.GetWifeHusband]'im ve dostum olacak."

 lmf_interaction.1326.g:0 "Fikrimi değiştirdim. Bunu iptal et."

 agree_to_marriage_intro_ask_rec.tt:0 "[recipient.GetTitledFirstName] [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l]'e razı olursa, devam edecek"

 agree_to_marriage_intro_tt:0 "[secondary_actor.GetShortUIName] ile [secondary_recipient.GetShortUIName] arasındaki [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıkları devam edecek"

 refuse_marriage_intro_send_rec.tt:0 "[recipient.GetTitledFirstName], [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarının iptal edildiğinden haberdar edilecek"

