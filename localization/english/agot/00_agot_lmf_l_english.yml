 lmf_army.1070.b:0 "[army_rival.GetSheHe|U] cüret eder mi?! [army_rival.GetHerHim] zincire vurun!"

 lmf_army.1070.b.imprison.tt:0 "[champion.GetShortUINameNoTooltipNoFormat|U], [army_friend.GetShortUINameNoTooltipNoFormat]'i hapsediyor"

 lmf_army.1070.b.imprison.desc:0 "[champion.GetShortUIName], [province.GetTitle.GetNameNoTierNoTooltip]'deki ordu kampında [champion.GetHerHim]'i düelloya davet ettiği için şövalyemiz [army_rival.GetShortUIName]'i hapsetti."

 lmf_army.1070.c:0 "Daha büyük [ROOT.Char.GetWomanMan] olarak çekip gideceğim."

 lmf_army.1080.t:0 "Silah Yoldaşı Âşıklar"

 lmf_army.1080.desc:0 "Son zamanlarda [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_lover'))]'in eşliğinde epey zaman geçiriyorum. Birlikte talim yapıyoruz, yemeklerimizi ateşin çevresinde birlikte yiyoruz, birbirimizle şakalaşıp memleket hikâyeleri anlatıyoruz. Dostluk gibi görünüyor; ama birbirimizin yakınındayken bir de.... #EMP gerilim#! var. Sadece bende olduğunu sanıyordum; ama ara sıra [army_lover.GetHerHim]'den, [army_lover.GetSheHe]'in de bunu sezdiğini ima eden bir bakış yakalıyorum.\n\nBu gece çadırıma çekilirken birden [army_lover.GetSheHe] oradaydı. Girişte duruyordu; üzerinde giysi yoktu ve bana, gecenin daha yeni başlayabileceğini söyleyen niyetli bir bakışla bakıyordu..."

 lmf_army.1080.a:0 "Bu, özel bir şeyin başlangıcı olabilir."

 army_camp_rendezvous:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], [PROVINCE.GetNameNoTooltip]'de kamp kurmuş orduda hizmet ederken âşık oldular."

 lmf_army.1080.b:0 "[army_lover.GetHerHim]'i kollarıma al; ama yalnızca bu gece için."

 lmf_army.1080.c:0 "Hayır, bu olmayacak."

 lmf_army.1090.t:0 "Bir Nefes Alma Anı"

 lmf_army.1090.desc:0 "Günlerdir orduyla yürümek zor. Bitmek bilmeyen sürünüş, bitmek bilmeyen şikâyetler, kötü yemek ve alnına vuran amansız güneş.\n\nAma bazen diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ların eşliği bunların bir kısmını telafi edebiliyor. Bu gece de böyle bir geceydi. [army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'de kamp kurduk; yoldaşlık had safhadaydı, bira akıyordu ve adamlar alışılmadık biçimde keyifliydi.\n\nÖzellikle [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_entertainer'))], [army_entertainer.GetSheHe]'in ortamı neşelendirmek gibi bir görevi varmış gibi görünüyordu. Askerlerden biri yanında getirdiği lavtada bir ezgi tıngırdatınca, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_entertainer'))] gülüp ateşin çevresinde dans etmeye başladı.\n\nGülmemek elde değildi; ben de neşeye katıldım. İyi bir geceydi."

 lmf_army.1090.a:0 "Hatırlanası bir gece!"

 lmf_army.1100.t:0 "Geceler Uzuyor"

 lmf_army.1100.end:0 "ve geceler daha da uzun.\n\nKampı bir hastalık kasıp kavurdu; bu da çoğumuzun, başka yerde gerekmediğimizde çadırlarımıza kapanmamız anlamına geliyor... fena olmazdı, ama yapacak #EMP hiçbir şey#! yok.\n\nYaklaşan çatışma hakkında duyabileceğim her türlü endişenin yerini can sıkıntısı aldı. Ara sıra yaptığım talimler bile, sonsuza dek buradaymışım hissini kovmaya yetmiyor.\n\nÜstelik diğer [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ların da aynı şeyi hissettiğini görebiliyorum."

 lmf_army.1100.a:0 "Bu sonsuza dek süremez..."

 lmf_army.1110.t:0 "Yağmurlu Günler"

 lmf_army.1110.t.desert:0 "Kum Fırtınaları"

 lmf_army.1110.normal:0 "ve aralıksız yağan yağmur yüzünden daha da uzun hissedildi.\n\nGünlerdir hiç durmadan uluma rüzgâr ve askerleri döven soğuk yağmur perdelerinden başka bir şey yok. Bu kadar perişan hissettiğim nadir olmuştur... aslında yağmur nihayet dindikten sonra bile iliklerime işleyen o soğuğun hiç çıkmadığını fark ettim. "

 lmf_army.1110.desert:0 "ve aralıksız kum fırtınaları yüzünden daha da uzun hissedildi.\n\nGünlerdir hiç durmadan uluma rüzgâr ve zırhının her yerine dolan kumdan başka bir şey yok. Ağzına kaçıyor, kulaklarına kaçıyor, çadırlara ve yemeğine kaçıyor... kum ile kavurucu sıcak arasında çöl beni kuru ve kırılgan hissettirdi; fırtınalar nihayet dindikten sonra bile bu his hiç kaybolmadı. "

 lmf_army.1110.end:0 "Ciğerlerime yerleşmiş bir öksürüğüm var ve görünüşe göre giderek kötüleşiyor.\n\nAskerlere karşı cesur bir yüz takınmaya çalıştım; ama daha fazla dayanabileceğimi sanmıyorum."

 lmf_army.1110.a:0 "Hekimi çağırın!"

 lmf_army.1120.t:0 "Çok İleri Bir Adım"

 lmf_army.1120.war:0 "Ordu [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den geçiyor ve ben iaşe için yağmaladığımız yerel köylerden birinde devriye geziyorum"

 lmf_army.1120.nowar:0 "Ordu [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'den geçiyor ve ben birkaç askerle birlikte iaşe aramak için yerel köylerden birine gittim"

 lmf_army.1120.end:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_bully'))]'in sokakta [army.GetLocation.GetCounty.GetCulture.GetNameNoTooltip] yerlilerinden birini taciz ettiğine rastladığımda.\n\n[army_bully.GetSheHe]'in kadının bir suç işlediğine ya da ihtiyacımız olan bilgiye sahip olduğuna ikna olduğu açık; ama şu zavallı yaratığın ikisine de sahip olmadığı — en azından bana göre — besbelli. Kadın acınası bir şekilde canı için yalvarıyor; bu da [army_bully.GetHerHis] zalimliğini yeni zirvelere taşımaya yarıyor gibi.\n\nBu kadar çok yerli ve hatta kendi askerlerimiz yaşanan sahneye şokla bakakalırken, araya girmek zorundaymışım gibi hissediyorum... her ne kadar [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_bully'))] müdahalemden kesinlikle hoşlanmayacak olsa da."

 lmf_army.1120.a:0 "[army_bully.GetSheHe]'in neyi takdir ettiği umurumda değil. Bu artık son bulmalı."

 interfered_with_army_bully:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] yerel bir köylüyü sorgulamasına karıştı."

 interfered_with_army_bully_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] yerel bir köylüyü sorgulamasına karıştı."

 lmf_army.1120.b:0 "Bu [army_bully.GetHerHis] işi, beni ilgilendirmez."

 lmf_army.1130.t:0 "Şanslı Bir Yakalayış"

 lmf_army.1130.desc:0 "[army.GetLocation.GetTitle.GetNameNoTierNoTooltip] kuşatması sanki sonsuza dek sürüyormuş gibi geliyor; ilerleme de yavaş.\n\nNe büyük şans ki bugün askerlerim, hatlarımızdan fark edilmeden sızmaya çalışan bir yerliyi yakaladı. İçlerinden biri tesadüfen okuma biliyor olmasa ve yerlinin üzerindeki küçük kitapçığın işe yarayabilecek bilgiler içerdiğini fark etmeseydi, büyük ihtimalle onu olay yerinde idam ederlerdi.\n\nBöylece bunun yerine esir alındı ve bana bildirildi. Biraz sorgulamanın ardından askerin gerçekten de haklı olduğunu öğrendim. Düşmanın müttefiklerine ulaştırılmak üzere hazırlanan bu kitapçıktaki bilgiler, [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'deki düşman mevzilerinin istihkâmları, iaşesi ve zayıflıkları hakkında faydalı notlarla dolu.\n\nBu adamla #EMP çok#! konuşmamız gerekecek!"

 lmf_army.1130.a:0 "Sanırım bu, buradaki işleri hızlandıracak."

 lmf_army.1130.a.title:0 "Kuşatma Bilgisi Edinildi"

 lmf_army.1130.a.desc:0 "[commander.GetShortUIName|U], [army.GetLocation.GetTitle.GetNameNoTier]'deki düşmanın istihkâmları ve iaşesi hakkında bir esirden bilgi edindi."

 lmf_army.1140.t:0 "Umut Vaat Eden Bir Asker"

 lmf_army.1140.desc:0 "Askerlerle geçirdiğim aylarda, diğerlerinin arasından sıyrılan birini fark ettim.\n\nBaşka kayda değer üyesi olmayan küçük bir [army_potential.GetCulture.GetNameNoTooltip] soylu ailesinden gelen bu [army_potential.GetWomanMan], kendini becerikli ve hizmete hevesli kanıtladı. Nitekim akşam boyunca birkaç laf ettikten sonra [army_potential.GetSheHe] çadırıma geldi ve onu [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de bir [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] olarak almamı kabul edersem bağlılık yemini etmeyi teklif etti.\n\nElbette ilgimi çekiyor; ama [army_potential.GetSheHe] bu kadar becerikli olsa bile bana bir [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] daha gerekli mi?"

 lmf_army.1140.a:0 "[army_potential.GetHerHim] için [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larımın arasında bir yer bulacağım."

 lmf_army.1140.b:0 "Hayır, [army_potential.GetHerHis] hizmetlerine ihtiyacım yok."

 lmf_army.1150.t:0 "Rastlantısal Bir Karşılaşma"

 lmf_army.1150.begin:0 "[army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de birkaç askerle devriye gezerken ilk başta bir ceset olduğunu sandığımız şeyle karşılaştık: çalıların arasında bir [army_stranger.GetWomanMan] cesedi; kuşkusuz [army.GetLocation.GetCounty.GetCulture.GetNameNoTooltip] haydutlarının bir saldırısının ürünü. Yakından bakınca [army_stranger.GetWomanMan]'in ölmediğini fark ettik; [army_stranger.GetHerHim]'i tedavi için kampa taşıttım.\n\nİyileşince [army_stranger.GetSheHe] minnettarlığını dile getirdi. [army_stranger.GetHerHis] adının [army_stranger.GetFirstNameNoTooltip] olduğunu öğrendim; "

 lmf_army.1150.poet:0 "saldırıya uğradığında [army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'e gitmekte olan bir şair,"

 lmf_army.1150.monk:0 "kutsal bir tarikata mensup olan ve [army_stranger.GetSheHe] saldırıya uğradığında yakındaki bir [army_stranger.GetFaith.HouseOfWorship]'ten seyahat etmekte olan bir [army_stranger.GetWomanMan],"

 lmf_army.1150.scholar:0 "saldırıya uğradığında uzak bir üniversiteye yolculuk eden bir âlim,"

 lmf_army.1150.pilgrim:0 "saldırıya uğradığında hac yolculuğundaki sade bir [army_stranger.GetFaith.GetAdherentNameNoTooltip],"

 lmf_army.1150.merchant:0 "saldırıya uğradığında [army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'e gitmekte olan bir tüccar,"

 lmf_army.1150.architect:0 "saldırıya uğradığında iş aramak için [army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'e yolculuk eden bir mimar,"

 lmf_army.1150.gallowsbait:0 "ve bölgedeki işi konusunda ketum davransa da, talihsiz bir kaderle karşılaştığı besbelliydi: saldırıya uğramış,"

 lmf_army.1150.end:0 "[army_stranger.GetHerHis] eşyalarından soyulmuş ve ölüme terk edilmişti.\n\n[army_stranger.GetWomanMan], bana [army_stranger.GetHerHis] canını borçlu olduğunu söyledi ve sarayımın sadık bir üyesi olarak hizmet etmeyi teklif etti... tabii [army_stranger.GetHerHim]'i kabul etmeye istekliysem."

 lmf_army.1150.a:0 "[army_stranger.GetHerHim]'in bana katılmasına sevinirim."

 lmf_army.1150.b:0 "Hayır, [army_stranger.GetHerHim]'in [army_stranger.GetHerHis] yoluna gitme zamanı geldi."

 lmf_army.1160.t:0 "Bir Yabancı Tarafından Kurtarıldı"

 lmf_army.1160.begin:0 "[army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'de kampın pek uzağında devriye gezerken ben ve yanımdaki birkaç asker aniden bir [army.GetLocation.GetCounty.GetCulture.GetNameNoTooltip] haydut grubunun pususuna düştük. O kadar ani ve o kadar şiddetliydi ki, bir yabancının ansızın belirmesi olmasa işler çok kötü bitebilirdi.\n\n[army_stranger.GetWomanMan] hiç yoktan koşarak geldi, delice haykırıyordu ve [army_stranger.GetHerHis] kılıcıyla haydutlara daldı... [army_stranger.GetHerHis] becerisiyle benimki birleşince haydutları kaçırmayı başardık.\n\nSonrasında yabancı kendini [army_stranger.GetFirstNameNoTooltip] diye tanıttı; "

 lmf_army.1160.mercenary:0 "buralardan bir paralı asker, ama [army.GetLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstNameNoTooltip]'e karşı sevgisi olmayan biri,"

 lmf_army.1160.gallowsbait:0 "[army_stranger.GetSheHe] [army_stranger.GetHerHis] gizemli geçmişi hakkında başka pek bir şey söylemese de,"

 lmf_army.1160.end:0 "neyse ki tam yakınlarda olan biri. Bir içki paylaştık ve oldukça iyi anlaştık... doğrusu, [army_stranger.GetSheHe]'in bana katılma davetine açık olabileceğinden şüpheleniyorum, eğer yapmayı istersem..."

 lmf_army.1160.a:0 "Sarayda bir dost daha edinmekten memnuniyet duyarım."

 saved_by_army_stranger:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouSheHe(TARGET_CHARACTER)] bir haydut pususunda [CharYouSheHe(CHARACTER)]'i kurtardıktan sonra [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] ile dost oldu."

 saved_by_army_stranger_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouSheHe(CHARACTER)] bir haydut pususunda [CharYouSheHe(TARGET_CHARACTER)]'i kurtardıktan sonra [CHARACTER.GetShortUINameNoTooltipNoFormat] ile dost oldu."

 lmf_army.1160.b:0 "[army_stranger.GetHerHim]'den sarayımda hizmet etmesini isteyeceğim."

 lmf_army.1160.c:0 "[army_stranger.GetHerHis] yardımı için [army_stranger.GetHerHim]'e teşekkür edip yoluma devam ediyorum."

 lmf_army.1170.t:0 "Bir İaşe Sorunu"

 lmf_army.1170.desc:0 "Ordu [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'in içlerine doğru ilerledikçe iaşe azalıyor.\n\nİzcilerimiz çevredeki kırsalda çok sayıda büyük çiftlik ve malikâne olduğunu bildirdi. İhtiyacımız olanlar için yağmalamaları üzere birlikler gönderebilirim; ama adamları böyle bir işe saldığımda... onları kontrol etmek neredeyse imkânsız olur. Masumlar öldürülür, binalar yakılır, zulümler işlenir ve hepsinin sorumluluğu bana kalır.\n\nÖte yandan, eğer #EMP emri vermezsem#!, askerlerimin birçoğu açlığa ya da daha kötüsüne kurban gidebilir."

 lmf_army.1170.a:0 "[army.GetLocation.GetCounty.GetCulture.GetNameNoTooltip]'in acısı beni ilgilendirmez."

 lmf_army.1170.b:0 "Hayır, elimizdekilerle idare ederiz."

 lmf_army.1180.t:0 "Kayıp ve Bulunan"

 lmf_army.1180.desc:0 "[army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'de kamp kurduktan sonra birkaç şövalyeyle küçük bir ava çıktım ve — itiraf etmekten ne kadar hoşlanmasam da — onlardan ayrı düştüm, yabancı arazide hızla kayboldum.\n\nNeyse ki yolda dost canlısı genç bir yerliye rastladım. [army_stranger.GetSheHe|U] kendini [army_stranger.GetFirstNameNoTooltip] diye tanıttı; [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'ten geçen tüccarlara rehberlik ediyormuş ve [army_stranger.GetSheHe] beni hızla kampa geri götürmeyi başardı.\n\nYol boyunca evim hakkında uzun uzun sohbet ettik... ve [army_stranger.GetSheHe]'in buradan uzaklaşmayı özlediğini anlayabiliyordum.\n\nHatta [army_stranger.GetHerHis] gülümsemelerinden ve bariz ilgisinden [army_stranger.GetSheHe]'in beni de özlediği apaçıktı."

 lmf_army.1180.a:0 "Birlikte bir gece geçireceğiz; ama sonra yoluma devam etmeliyim."

 lmf_army.1180.b:0 "[army_stranger.GetSheHe|U], yeni sevgilim olarak [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'de bana katılabilir."

 army_camp_lost_guide:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] [PROVINCE.GetNameNoTooltip]'de kaybolduğunda, [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] [CharYouHerHim(CHARACTER)]'i kampa geri götürdü ve yolda birbirlerine âşık oldular."

 army_camp_lost_guide_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat] [PROVINCE.GetNameNoTooltip]'de kaybolduğunda, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharYouHerHim(TARGET_CHARACTER)]'i kampa geri götürdü ve yolda birbirlerine âşık oldular."

 lmf_army.1180.c:0 "[army_stranger.GetHerHis] yardımı için [army_stranger.GetHerHim]'e teşekkür edeceğim; ama bu kadar."

 lmf_army.1190.t:0 "[candidate.GetCulture.GetNameNoTooltip] Hekimi"

 lmf_army.1190.t.maester:0 "Yardımsever Üstat"

 lmf_army.1190.start:0 "Son zamanlarda hekim çadırının işinin üstün kalitede olduğunu fark ettim; doktoru kutlamaya gittiğimde ise işin aslında şu kişinin olduğunu keşfettim: "

 lmf_army.1190.maester:0 "bir üstat.\n\nAdam kendini [candidate.GetFirstNameNoTooltip] diye tanıttı; askerlerimle ilgilenen bir üstat bulduğuma şaşırdığımı belirttiğimde üzgün üzgün başını salladı ve yakın zamana dek [enemy.GetTitledFirstNameNoTooltip]'e hizmet ettiğini söyledi. Sonra ikisi küs müş, o da [enemy.GetTitledFirstNamePossessiveNoTooltip] düşmanlarına yardım etmeye karar vermiş.\n\nBu kadar ilginç bir yorum karşısında kaşlarım kalktı; ama [candidate.GetFirstNameNoTooltip] sadece omuz silkti.\n\n"

 lmf_army.1190.disgraced:0 "bir üstat.\n\nAdam kendini [candidate.GetFirstNameNoTooltip] diye tanıttı; askerlerimle ilgilenen bir üstat bulduğuma şaşırdığımı belirttiğimde yüzü karardı. Bir zamanlar hizmet ettiği [enemy.GetTitledFirstNameNoTooltip]'in oyunları yüzünden artık üstat olmadığını açıkladı. Nazikçe daha fazla bilgi almak için üstüne gittim; ama onun utancını tartışmaya pek hevesli olmadığı hiç şaşırtıcı değildi... her neyse.\n\n"

 lmf_army.1190.physician:0 "yerel bir gönüllü.\n\nAdam kendini [candidate.GetFirstNameNoTooltip] diye tanıttı; işinin bir savaş meydanı çadırına değil de bir saraya yakıştığını söylediğimde gülümsedi ve gerçekten de [enemy.GetTitledFirstNameNoTooltip]'e hizmet ettiğini, ta ki ikisi küsene dek... ve görünüşe göre aralarında pek bir sevgi de yok.\n\n"

 lmf_army.1190.end:0 "[candidate.GetSheHe], şimdilik [candidate.GetHerHis] becerilerine en çok ihtiyaç duyulan yerde çalışmaktan memnun olduğunu söyledi."

 lmf_army.1190.a:0 "Şey, [candidate.GetHerHis] hizmetlerini burada kesinlikle kullanabiliriz."

 lmf_army.1190.b:0 "Bu, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e döndüğümde işime yarayabilecek bir [candidate.GetWomanMan]!"

 lmf_army.1190.c:0 "[candidate.GetHerHim]'i [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e dönüşte bana katılmaya davet edeceğim. [candidate.GetHerHis] becerileri işe yarayabilir!"

 lmf_army.1200.t:0 "Eğitim Rejimi"

 lmf_army.1200.desc:0 "Ordumda şu an işler sakin; ama bunun kolayca değişebileceğini biliyorum.\n\nYine de askerlerin çoğunun bunu fark etmediği hissi var. Aylaklık ediyorlar, görev dağılımlarından şikâyet ediyorlar ve [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'lar talim çağırdığında ağır davranıyorlar. [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'larımdan bazıları, daha iyi hazırlanmaları için talimi sıkılaştırıp şimdikinden daha sert çalıştırmamızı öneriyor. Bazıları ise gevşeyebileceğimizi söylüyor... disiplinden o kadar endişelenmeden dinlenmelerine ve güçlerini saklamalarına izin verelim.\n\nİkisinden birini yapmalı mıyım?"

 lmf_army.1200.a:0 "Onları sıkı çalıştır. Hazır olmaları gerekiyor."

 lmf_army.1200.b:0 "Güçlerini ihtiyaç duydukları an için saklasınlar."

 lmf_army.1200.c:0 "Hiçbir şeyi değiştirme. Biz iyiyiz."

 lmf_army.1210.t:0 "Kayıp Bir Şövalye"

 lmf_army.1210.desc:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))] ile devriyedeyken hava bozuldu... ve sonra, birden, [army_friend.GetSheHe] ortadan kayboldu. Aradım taradım; ama onu hiçbir yerde bulamadım.\n\n[army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] düşman toprağı; [army_friend.GetHerHim]'i aramaya devam edersem başım belaya girebilir. Ama kampa koşarsam, [army_friend.GetHerHim]'i sağ salim bulma şansım giderek azalıyor.\n\nEn iyisi hızlı düşünmek."

 lmf_army.1210.a:0 "[army_friend.GetHerHim]'i kendim arayacağım."

 lmf_army.1210.b:0 "Kampa koşup bir arama ekibi düzenleyeceğim."

 lmf_army.1210.c:0 "[army_friend.GetSheHe|U] artık büyümüş bir [army_friend.GetWomanMan]. [army_friend.GetSheHe|U] [army_friend.GetHerselfHimself]'ine bakabilir."

 lmf_army.1210.wounded.tt:0 "[army_friend.GetHerHim]'i bulamıyor ve düşmanla karşılaşıyorsun"

 lmf_army.1210.fail.tt:0 "[army_friend.GetHerHim]'i bulma girişimi başarısız oluyor"

 lmf_army.1210.succeed.tt:0 "[army_friend.GetSheHe|U] bulundu!"

 lmf_army.1210.knight.lost.title:0 "[army_friend.GetTitledFirstNameNoTooltip], [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de kayıp"

 lmf_army.1210.knight.lost.desc:0 "[army_friend.GetTitledFirstName], [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de devriye gezerken kayboldu ve [army_friend.GetHerHim]'e ne olduğu bilinmiyor."

 lmf_army.1210.knight.found.title:0 "[army_friend.GetTitledFirstNameNoTooltip] bulundu!"

 lmf_army.1210.knight.found.desc:0 "Uzun bir aramanın ardından [army_friend.GetTitledFirstName], [army.GetLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'de bulundu; yaralıydı ve kurtarılmasına minnettardı."

 lmf_army.1211.knight.newliege.desc:0 "Uzun bir aramanın ardından [army_friend.GetTitledFirstName], [army_friend.GetLiege.GetShortUIName]'in sarayında bulundu; [army_friend.GetLiege.GetShortUIName], [army_friend.GetHerHis] başından geçenlerden sonra [army_friend.GetHerHim] ile ilgilenmiş ve [army_friend.GetSheHe] artık orada kalmayı tercih ediyor."

 searched_for_me_after_lost:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouSheHe(CHARACTER)] bir devriye sırasında kaybolunca [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'in [CharYouHerHim(CHARACTER)]'i aramasına minnettar kalmıştı [CharWereWas(CHARACTER)]."

 searched_for_me_after_lost_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouSheHe(TARGET_CHARACTER)] bir devriye sırasında kaybolunca [CHARACTER.GetShortUINameNoTooltipNoFormat]'in [CharYouHerHim(TARGET_CHARACTER)]'i aramasına minnettar kalmıştı [CharWereWas(TARGET_CHARACTER)]."

 lmf_army.1211.knight.found.desc:0 "[lost_in.GetTitle.GetNameNoTierNoTooltip]'de haftalarca kaybolduktan sonra, [army_friend.GetTitledFirstName] nihayet bulundu ve [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e döndü."

 lmf_army.1220.t.commander:0 "Eğitimdeki Komutan"

 lmf_army.1220.t.knight:0 "Eğitimdeki Şövalye"

 lmf_army.1220.desc:0 "Son haftalarda [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))] ile epey talim yaptım... itiraf etmeliyim ki benden üstün bir kılıç ustası [army_friend.GetWomanMan].\n\nİlk başta bana öğretebilecekleri pek bir şey olmadığını düşündüm; ama zaman ilerledikçe gerçekten çok şey öğrendiğimi fark ettim. Mükemmel bir öğretmen oldular; ordu kampındaki sıradan gündelik yaşamdan bir kaçış gibi de."

 lmf_army.1230.desc:0 "Son haftalarda [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))] ile epey vakit geçirdim... illa dostça değil; ama stratejiyi ve bu büyüklükte bir ordunun idamesinin pratik meselelerini tartışarak.\n\nİlk başta pek ilgim yoktu. Ne de olsa bir ordunun nasıl çalıştığını öğrenmek istesem, etrafıma bakmam yeterdi. Ama [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))]'in konu hakkında, [army_friend.GetHerHim]'e asla yakıştırmayacağım kadar derin bir kavrayışı vardı; ve itiraf edeyim ki bu bir eğitim gibi oldu."

 lmf_army.1240.desc:0 "Son haftalarda [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))]'in altında eğitim görüyorum; ince kılıç sanatını öğrenmeye çalışıyorum.\n\nDoğrusu, başlangıçta niyetim bu değildi. Ama [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('army_friend'))], ben talim yaparken yanıma geldi ve yeteneğim hakkında bazı yorumlar yaptı... Sanırım [army_friend.GetSheHe] bunları öneri olarak söylemişti; ama ben alındım.\n\nArka arkaya üç maçta kaybeden taraf olduktan sonra, belki de [army_friend.GetSheHe]'in gerçekten bana öğretecek bir şeyleri olduğunu ve sürecin kolayca itiraf edebileceğimden daha keyifli olduğunu kabul ettim."

 lmf_army.1220.a:0 "Bu işe yarayabilir."

 lmf_army.1220.a.improves.tt:0 "@knight_icon! [player.Custom('KnightCultureNoTooltip')] Gelişiyor"

 lmf_army.1220.a.prowess.desc:0 "[player.Custom('KnightCultureNoTooltipLowercase')] [champion.GetShortUIName], [army_friend.GetShortUIName]'in altında eğitim aldıktan sonra [champion.GetHerHis] [prowess|E]'ini [prowess_i] 1 artırdı #P#!."

 lmf_army.1230.a.martial.desc:0 "[player.Custom('KnightCultureNoTooltipLowercase')] [champion.GetShortUIName], [army_friend.GetShortUIName]'in altında eğitim aldıktan sonra [champion.GetHerHis] [martial|E]'ini [martial_i] 1 artırdı #P#!."

 lmf_army.1240.a.blademaster.desc:0 "[player.Custom('KnightCultureNoTooltipLowercase')] [champion.GetShortUIName], [army_friend.GetShortUIName]'in altında eğitim aldıktan sonra [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] Özelliğini kazandı."

 lmf_army.1250.t:0 "Bir Askerin Gözü"

 lmf_army.1250.mid:0 "ve itiraf edeyim ki gerginlik yavaş yavaş beni yıpratıyor. Bu gece kamp ateşinin çevresinde çoğunlukla sessizce içtik.\n\nYine de gözüme takılmaya devam eden bir [army_lover.GetWomanMan] vardı. [army_lover.GetSheHe|U] er rütbeli askerlerden biriydi,"

 lmf_army.1250.male:0 "ama yakışıklı ve yaşıtlarının çoğundan görünüşe göre çok daha becerikli. "

 lmf_army.1250.female:0 "ama güzel yüzlü ve erkek yaşıtlarının çoğundan görünüşe göre çok daha becerikli. "

 lmf_army.1250.end:0 "Daha önce hiç karşılaşmadığımızı düşünüyorum; ama [army_lover.GetSheHe] tuhaf biçimde tanıdık görünüyordu.\n\nSonra çadırımın yakınında aynı [army_lover.GetWomanMan]'e rastladım. [army_lover.GetSheHe|U] kendini [army_lover.GetFirstNameNoTooltip] diye tanıttı... ve [army_lover.GetHerHim]'i içeri davet edecek olursam [army_lover.GetSheHe]'in seve seve kabul edeceğini anlayabiliyordum.\n\nİtiraf edeyim, ciddi biçimde aklım çeliniyor."

 lmf_army.1250.a:0 "Neden olmasın? [army_lover.GetHerHim]'i bu gece için içeri davet edeceğim."

 army_camp_caught_eye:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouThey(TARGET_CHARACTER)] [PROVINCE.GetNameNoTooltip]'deki ordu kampındayken [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] dikkatini çeken bir askerdi [CharWereWas(CHARACTER)]."

 army_camp_caught_eye_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CharYouThey(CHARACTER)] [PROVINCE.GetNameNoTooltip]'deki ordu kampındayken [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] dikkatini çeken bir askerdi [CharWereWas(TARGET_CHARACTER)]."

 lmf_army.1250.b:0 "Aslında bu [army_lover.Custom('GetLassLad')] sarayımda kalıcı bir yeri hak ediyor."

 lmf_army.1250.c:0 "Hayır, gerçekten iyi bir fikir değil."

 lmf_army.1260.t:0 "Kaynakta Yakalanmak"

 lmf_army.1260.begin:0 "Orduyla yürürken yıkanma fırsatı pek olmuyor.\n\nBu yüzden, [army.GetLocation.GetTitle.GetNameNoTierNoTooltip]'de kamp kurduğumuzda ve yerlilerden biri bir "

 lmf_army.1260.oasis:0 "yakınlarında berrak bir kaynak olan vaha,"

 lmf_army.1260.spring:0 "yakınlardaki doğal bir kaynak,"

 lmf_army.1260.mid:0 "Fırsatı kaçırmadım. Bulmak kolay değildi; ama buldum ve neredeyse tamamen terk edilmiş olduğunu görünce rahatladım. Ne var ki sudan çıktığımda, yakınlarda durup beni ilgiyle izleyen bir [army_stranger.GetWomanMan] görünce şok oldum.\n\nŞaşkınlığımı fark eden [army_stranger.GetSheHe] özür dileyip kendini [army_stranger.GetFirstNameNoTooltip] diye tanıttı; "

 lmf_army.1260.septon.female:0 "uzak olmayan bir [army_stranger.GetFaith.HouseOfWorship]'ten gelen bir [army_stranger.GetFaith.PriestFemale].\n\n"

 lmf_army.1260.septon.male:0 "uzak olmayan bir [army_stranger.GetFaith.HouseOfWorship]'ten gelen bir [army_stranger.GetFaith.PriestMale].\n\n"

 lmf_army.1260.devoted.female:0 "uzak olmayan bir [army_stranger.GetFaith.HouseOfWorship]'ten gelen bir [army_stranger.GetFaith.DevoteeFemale].\n\n"

 lmf_army.1260.devoted.male:0 "uzak olmayan bir [army_stranger.GetFaith.HouseOfWorship]'ten gelen bir [army_stranger.GetFaith.DevoteeMale].\n\n"

 lmf_army.1260.peasant:0 "uzak olmayan bir köyden.\n\n"

 lmf_army.1260.end:0 "[army_stranger.GetSheHe|U] bana kaynağın iyileştirici özelliklerinin olduğu söylendiği için orada bulunduğunu söyledi; ama [army_stranger.GetHerHis] bakışlarından [army_stranger.GetSheHe]'in artık bambaşka bir şeyle ilgilendiğini anlayabiliyordum..."

 lmf_army.1260.a:0 "[army_stranger.GetHerHim]'i suda bana katılmaya davet edeceğim."

 lmf_army.1260.b:0 "İhtiyata riayet edip giysilerimi topluyor ve hızla çıkıyorum."

 lmf_birth.1001.t:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('relative'))|U] Utancı"

 lmf_birth.1001.opening:0 "[spymaster.GetTitledFirstNameNoTooltip] bana rahatsız edici bir haberle geldi: evli olmayan [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))] [relative.GetTitledFirstName], [spymaster.GetHerHim]'i onun hamile olduğuna inandıran belirtiler gösteriyor! "

 lmf_birth.1001.know:0 "[spymaster.GetTitledFirstNameNoTooltip] babasının [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('suspected_father'))] [suspected_father.GetTitledFirstName] olduğundan güçlü şekilde şüpheleniyor; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))]'i sorgulayıp tüm meseleyi anında gün yüzüne çıkarmadan emin olmanın yolu yok.\n\n"

 lmf_birth.1001.secret:0 "[spymaster.GetTitledFirstNameNoTooltip]'in babasının kim olabileceğine dair henüz bir fikri yok; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))]'i sorgulamak tüm meseleyi anında gün yüzüne çıkaracaktır.\n\n"

 lmf_birth.1001.convent:0 "Yine de bir seçenek var. [relative.GetTitledFirstNameNoTooltip]'i, çocuk doğana dek, sarayın meraklı gözlerinden güvenle uzak küçük bir kırsal malikânede inzivaya gönderebiliriz. Kimsenin ne olduğunu ya da çocuğun gerçek annesinin kim olduğunu bilmesine gerek yok... tabii yaşarsa. [relative.GetTitledFirstNamePossessiveNoTooltip] itibarı da bizimki de güvende olur."

 lmf_birth.1001.end:0 "Ne yazık ki [relative.GetTitledFirstNameNoTooltip]'i inzivaya gönderecek uygun bir yer yok. Sarayda kalırsa, er ya da geç herkes bilecek."

 lmf_birth.1001.a:0 "Onu inzivaya gönder — bu hiç yaşanmadı."

 lmf_birth.1001.b:0 "Onu derhal sürgüne gönder!"

 lmf_birth.1001.c:0 "Onun taşkınlığının sonuçlarıyla ilgileneceğiz."

 lmf_birth.1001.d:0 "[suspected_father.GetTitledFirstNameNoTooltip] doğru olanı derhal yapacak... yoksa."

 lmf_birth.1003.t:0 "Üzücü Haber"

 lmf_birth.1003.alive:0 "[relative.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]'den kötü haberlerimiz var. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))] [relative.GetTitledFirstNameNoTooltip], şu an yaşayan ve oldukça iyi görünen bir çocuğu... doğururken öldü. Hizmetçilerinin ellerinden gelen her şeyi yaptığına dair güvence verildi; ama fayda etmedi. [relative.GetFirstNameNoTooltip], [child.GetHerHim]'i '[child.GetFirstNameNoTooltip]' diye adlandırmaya ve [child.Custom('GetDaughterSon')]'ini kollarında tutmaya yetecek kadar zaman bulabildi; sonra bayıldı ve bir daha kendine gelemedi.\n\nMesele kapanmışken, çocukla ne yapılacağı sorusu hâlâ duruyor."

 lmf_birth.1003.dead:0 "[relative.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]'den kötü haberlerimiz var. [relative.GetTitledFirstNameNoTooltip] doğumda öldü. Hizmetçilerinin ellerinden gelen her şeyi yaptığına dair güvence verildi; ama fayda etmedi. Hem o hem de çocuk artık aramızda değil."

 lmf_birth.1003.a:0 "Çocuğu ne görmek ne de haberini almak istiyorum."

 lmf_birth.1003.a.tt:0 "[relative.GetTitledFirstNamePossessiveNoTooltip] piç çocuğu sırra kadem basacak"

 lmf_birth.1003.b:0 "Artık saklamanın bir anlamı yok."

 lmf_birth.1003.b.tt:0 "[relative.GetTitledFirstNamePossessiveNoTooltip] piç çocuğu büyütülmek üzere sarayına getirilecek"

 lmf_birth.1003.c:0 "[ROOT.Char.GetFaith.PantheonTerm2] ikisinin de üzerinde gözetleyici olsun."

 lmf_birth.1004.t:0 "Tamamlandı"

 lmf_birth.1004.desc:0 "[relative.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]'den haberlerimiz var. [relative.GetTitledFirstNameNoTooltip] doğum yaptı ve iş tamamlandı; sanki skandal hiç yaşanmamış gibi. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))]'ini eve dönmesi için çağıralım mı?"

 lmf_birth.1004.a:0 "Elbette! Bu meseleyi kapatalım."

 lmf_birth.1004.b:0 "Olduğu yerde kalabilir. Umurumda değil."

 lmf_birth.1006.t:0 "Kaybolan Şey"

 lmf_birth.1006.opening:0 "[ROOT.Char.GetCurrentLocation.GetName]'de seyahat ederken arabamdan, sokaktan geçen genç bir [stray_bastard.GetWomanMan] görüyorum. Başka açıdan sıradan olsa da [stray_bastard.GetHerHim]'de ürpertici derecede tanıdık bir şey var... o kadar ki bu karşılaşmayı sonradan hatırlayıp [stray_bastard.GetSheHe]'in izinin sürülmesini istiyorum.\n\n"

 lmf_birth.1006.mother:0 "Gerçek, hayal edebileceğim her şeyin ötesinde. Görünüşe göre o genç [stray_bastard.GetWomanMan], yıllar önce inzivaya gönderildiğimde doğurduğum [stray_bastard.Custom('GetDaughterSon')]'den başkası değil. [stray_bastard.GetHerHim]'i kaybettiğimi, hatta öldüğünü sanmıştım; ama işte [stray_bastard.GetSheHe] burada! Belki bu yalnızca o çocuk olduğunu iddia eden biridir; ama [stray_bastard.GetSheHe] bir şey istemek için beni hiç aramadı... ve ne olduğunu başka kim bilirdi ki?\n\n"

 lmf_birth.1006.family:0 "Gerçek, hayal edebileceğim her şeyin ötesinde. Görünüşe göre o genç [stray_bastard.GetWomanMan], [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))] [relative.GetTitledFirstNameNoTooltip]'in, yıllar önce inzivaya gönderildiğinde gizlice doğurduğu çocuğundan başkası değil. Belki bu yalnızca o çocuk olduğunu iddia eden biridir; ama [stray_bastard.GetSheHe] bir şey istemek için [stray_bastard.GetHerHis] ailesini hiç aramadı... ve ne olduğunu başka kim bilirdi ki?\n\n"

 lmf_birth.1006.other:0 "Hizmetkârlarımın sonradan rapor ettikleri, hayal edebileceğim her şeyin çok ötesindeydi. Görünüşe göre o genç [stray_bastard.GetWomanMan], yıllar önce [birthplace.GetNameNoTooltip]'de inzivaya gönderildiğinde doğan [relative.GetGetFullName]'in [stray_bastard.Custom('GetDaughterSon')]'inden başkası değil. Belki bu yalnızca o çocuk olduğunu iddia eden biridir; ama [stray_bastard.GetSheHe] bir şey istemek için [stray_bastard.GetHerHis] ailesini hiç aramadı... ve ne olduğunu başka kim bilirdi ki? Gizli tutulmuş utanç verici bir sırdı.\n\n"

 lmf_birth.1006.knight:0 "Genç [stray_bastard.GetWomanMan], [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'de küçük bir lordun hizmetinde olan, [stray_bastard.GetHerHis] kendine ait küçük bir şöhret edinecek kadar becerikli, umut vadeden bir [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] oldu. "

 lmf_birth.1006.physician:0 "Genç [stray_bastard.GetWomanMan], [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'de birkaç yıldır umut vadeden bir hekim olarak çalışıyor; [stray_bastard.GetHerHis] kendine ait küçük bir şöhret edinecek kadar becerikli. "

 lmf_birth.1006.monk:0 "Görünüşe göre genç adam yeminlerini edip bir [stray_bastard.GetFaith.DevoteeMale] oldu... duyduğumuza göre kayda değer bir öğrenim ve erdem sahibi. Yaşına rağmen küçümsenmeyecek başarılara sahip bir [stray_bastard.GetFaith.GetAdherentNameNoTooltip] adamı. "

 lmf_birth.1006.nun:0 "Görünüşe göre genç kadın yeminlerini edip bir [stray_bastard.GetFaith.DevoteeFemale] oldu... duyduğumuza göre kayda değer bir öğrenim ve erdem sahibi. Yaşına rağmen küçümsenmeyecek başarılara sahip bir [stray_bastard.GetFaith.GetAdherentNameNoTooltip] kadını. "

 lmf_birth.1006.rogue:0 "Genç [stray_bastard.GetWomanMan]'in epey gölgeli bir şöhreti var. [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'de [stray_bastard.GetSheHe], işi bitiren biri olarak biliniyor. Hem zeki hem becerikli derler; ama rehberlik olmazsa [stray_bastard.GetSheHe]'in eninde sonunda kanunun yanlış tarafına düşeceği muhtemel görünüyor. "

 lmf_birth.1006.beauty:0 "Genç kadın, [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'de küçük bir lordun hanesinde çalışıyor ve güzelliği ile zarif tavırlarıyla şimdiden bir şöhret edindi. Çok geçmeden daha yüksek çevrelerin dikkatini çekeceği neredeyse kesin görünüyor. "

 lmf_birth.1006.end:0 "[stray_bastard.GetSheHe] [stray_bastard.GetHerHis] doğumunu [stray_bastard.GetHerHis] lehine kullanmaya hiç çalışmadıysa da, belki [stray_bastard.GetHerHim] için sarayımda bir yer bulabilirim? [stray_bastard.GetHerHim]'i rahat da bırakabilirdik; ama [stray_bastard.GetHerHis] varlığı ve doğumuyla ilgili söylentiler eninde sonunda başka kulaklara ulaşacaktır."

 lmf_birth.1006.a:0 "[stray_bastard.GetHerHim] için sarayımda bir yer bulacağım."

 lmf_birth.1006.b:0 "Piç, karanlıkta kalsın. Umurumda değil."

 lmf_birth.1006.c:0 "[stray_bastard.GetSheHe|U] çoktan ölmüş olmalıydı. Bu hatayı düzeltelim."

 lmf_birth.1007.t:0 "Tamamlandı"

 lmf_birth.1007.desc:0 "[relative.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]'den haberlerimiz var. Çocuk vadeye ulaşamadı; ama [relative.GetTitledFirstNameNoTooltip] başka bakımdan zarar görmemiş görünüyor. Yani, doğrusu, sanki skandal hiç yaşanmamış gibi. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('relative'))]'ini eve dönmesi için çağıralım mı?"

 lmf_birth.1008.t:0 "Ortaya Çıktı!"

 lmf_birth.1008.desc.start:0 "Günlerdir sevdiğimden haber alamıyordum ve endişelenmeye başlamıştım. Yoksa benden çoktan bıkmış mıydı?\n\nSonra bana gerçek bildirildi: [relative.GetFirstNameNoTooltip], [relative.Custom2('LMF_RelationToMeShort', relative_liege )] tarafından [convent.GetNameNoTooltip]'in kasvetli bir köşesindeki küçük bir malikâneye kaçırılmış ve orada inzivaya kapatılmıştı. Neden mi? Çünkü [relative_liege.GetSheHe], [relative.GetFirstNameNoTooltip]'in hamile olduğunu öğrenmişti. BENİM çocuğuma.\n\n[relative_liege.GetTitledFirstNameNoTooltip]'in [relative_liege.GetHerHis] [relative_liege.Custom2('LMF_RelationToMeShort', relative )]'iyle benim aramda daha fazla temas görmek istemediği açık,"

 lmf_birth.1008.desc.secret:0 "[relative_liege.GetSheHe] babalığımı bile bilse,"

 lmf_birth.1008.desc.end:0 "ama [relative.GetFirstNameNoTooltip] ne istiyor derseniz? Hiçbir fikrim yok. Elbette bu olamaz!"

 lmf_birth.1008.a:0 "Ne yazık ki bu konuda yapabileceğim hiçbir şey yok."

 lmf_birth.1008.b:0 "Onu buraya getir. Onu [convent.GetNameNoTooltip]'de bırakmayacağım."

 lmf_birth.1008.c:0 "Onu kurtarıp evleneceğim; [relative.Custom2('LMF_RelationToMePossessive', relative_liege )]'inin izni olsa da olmasa da!"

 rival_took_secluded_family:0 "[TARGET_CHARACTER.GetShortUIName|U], o inzivadayken [CHARACTER.GetShortUINamePossessiveNoTooltip] [CHARACTER.Custom2('LMF_RelationToMeShort', TARGET_CHARACTER_2 )]'ini kaçırdı."

 rival_took_secluded_family_corresponding:0 "[CHARACTER.GetShortUIName|U], o inzivadayken [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] [TARGET_CHARACTER.Custom2('LMF_RelationToMeShort', TARGET_CHARACTER_2 )]'ini kaçırdı."

 lmf_birth.1009.t:0 "Kaçırıldı"

 lmf_birth.1009.desc.start:0 "Bu sabah erkenden haber geldi.\n\n[relative.GetFirstNameNoTooltip], [convent.GetNameNoTooltip]'deki uzak malikâneye yerleştirilir yerleştirilmez, askerler onu alıp [baby_father.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e götürmek üzere belirdi. [baby_father.GetTitledFirstNameNoTooltip] onu nereye gönderdiğimi nasıl öğrendi bilmiyorum; ama kendini [relative.GetFirstNamePossessiveNoTooltip] sevgilisi ve doğmamış çocuğunun babası olarak açıkladı.\n\n"

 lmf_birth.1009.desc.elope:0 "İkisinin [baby_father.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e varır varmaz evlendiklerini anlıyorum. Bunun bizi bir piçin utancından kurtardığını düşünsem de, bu yine de bir kaçış. Herkes bunun benim bilgim ve rızam olmadan olduğunu bilecek!"

 lmf_birth.1009.desc.abduct:0 "Artık ikisi de [baby_father.GetTitledFirstNamePossessiveNoTooltip] [baby_father.Custom('FortifiedBuilding')]'ine yerleşmiş durumda; adam bu göz göre göre kaçırmanın ardından onunla evlenecek nezaketi bile göstermiyor!"

 lmf_birth.1009.a:0 "Ailesine utanç getirdi."

 lmf_birth.1101.t:0 "Komplikasyonlar"

 lmf_birth.1101.depressed.t:0 "En Karanlık Geceler"

 lmf_birth.1101.depressed.death.opening:0 "Bir yavrucak kaybetmek... Ne yapacağımı bilmiyorum. Kimse beni ağlatmaktan korktuğu için bebekten bahsetmek istemiyor; ama bahsetmemek, bahsetmekten neredeyse daha kötü. Hayatımın üzerine bir kefen gibi çökmüş, değdiği her şeyi karartan kara bir buluta dönüştü.\n\n"

 lmf_birth.1101.depressed.sick.child.opening:0 "Bebek ağlıyor, ağlıyor ve bu hiç bitmeyecekmiş gibi görünüyor. Bunun bir şekilde benim suçum olduğu hissine kapılmaktan kendimi alamıyorum; bilmem gereken, yapmam gereken bir şey varmış gibi... her şeyin üzerine bir karanlık gibi çöküyor, değdiği her şeyi lekeliyor.\n\n"

 lmf_birth.1101.depressed.sick.opening:0 "Hastalık beni tırmalıyor, zayıf ve çaresiz hissettiriyor. Yeni bebeğimin yanında olmalıyım; ama kımıldamak için güç bulmakta zorlanıyorum. Bu bir şekilde benim suçum, biliyorum. Daha güçlü olmalıydım. Karanlık değdiği her şeyin üzerine gölgesini düşürüyor; ondan kaçamıyorum.\n\n"

 lmf_birth.1101.depressed.opening:0 "Sevinçten havalara uçmalıyım, değil mi? Hayatımızda yeni bir bebek var. Bu iyi bir şey olmalı. Ama düşüncelerimin üzerinde bir gölge asılı duruyor, değdiği her şeyi karartıyor ve bir türlü ondan kaçamıyorum.\n\n"

 lmf_birth.1101.opening:0 "Doğumdan beri işler aynı değil. Biliyorum. Hissedebiliyorum. Olması gerekenden fazla kanama var ve her zaman zayıf hissediyorum.\n\n"

 lmf_birth.1101.end.infertile:0 "Hekimler yatak odama gelip geçtiler; her seferinde onaylamazcasına dillerini şaklattılar. İyileşebileceğimi, ama doğumdan yaşadığım komplikasyonların bir daha çocuk sahibi olamayacağım anlamına gelebileceğini söylüyorlar."

 lmf_birth.1101.end.infertile.long:0 "Hekimler yatak odama gelip geçtiler; her seferinde onaylamazcasına dillerini şaklattılar. İyileşeceğim, diyorlar; ama doğumdan kaynaklanan komplikasyonlar ağır. Zaman alacak. Ne kadar, onların da bilmediği görünüyor."

 lmf_birth.1101.end.age:0 "Hekimler bunun geçeceğini, tüm bunların normal olduğunu söylüyor... özellikle benim yaşımda bir kadın için. Hiç çocuk sahibi olmuş olmam bile bir mucize."

 lmf_birth.1101.end:0 "Hekimler bunun geçeceğini, tüm bunların normal olduğunu söylüyor. Sadece ona biraz zaman tanımam gerekiyor."

 lmf_birth.1101.a:0 "Umarım haksızdırlar."

 lmf_birth.1101.b:0 "Umarım haklılardır."

 lmf_birth.1101.tt:0 "Doğum Sonrası Komplikasyonlar"

 lmf_birth.1102.husband.tt:0 "[ROOT.Char.GetFirstNamePossessiveNoTooltip] Karanlık Ruh Hali Geçti"

 lmf_birth.1102.tt:0 "Karanlık Ruh Halin Geçti"

 dinner_past_temperate:0 "yemeğinden yalnızca birazcık yedi, zamanının çoğunu konuşarak geçirdi"

 dinner_past_chaste_male:0 "çoğunlukla kendine saklandı, elleri [ROOT.GetCharacter.GetHerHis] kucağında özenle kavuşturulmuş halde"

 dinner_past_chaste_female:0 "çoğunlukla kendine saklandı, erkek hizmetkârların bakışlarından ağırbaşlılıkla kaçındı"

 dinner_past_generous:0 "hizmetkârların masaları toplamasına yardım ederek [ROOT.GetCharacter.GetHerselfHimself]'ini epey meşgul etti"

 dinner_past_diligent:0 "sohbete ailenin her üyesini dahil etmeye özenle dikkat etti"

 dinner_past_calm:0 "normalde gürültülü geçen bir ortama sakinleştirici bir hava kattı, [ROOT.GetCharacter.GetHerHis] her zamanki haliyle"

 dinner_past_patient_adult:0 "yeni hizmetkârlardan birine inanılmaz derecede sabırlı davrandı; genç adama düzgün hizmet etmeyi gösterdi"

 dinner_past_patient_child:0 "[ROOT.GetCharacter.GetHerHis] genç yaşına rağmen inanılmaz derecede sabırlıydı; her yemeğin getirilmesini bekledi"

 dinner_past_humble:0 "her zamanki gibi mütevazıydı; hizmetkârların her birine adıyla hitap ediyor ve onlara büyük saygı gösteriyordu"

 dinner_past_honest:0 "yakın tarihli bir macerasızlık hakkında hikâyeler anlattı; [ROOT.GetCharacter.GetSheHe]'in en ufak bir abartıya kaçmadığını fark ettim"

 dinner_past_brave:0 "[ROOT.GetCharacter.GetHerHis] yakın tarihli maceralarından biri hakkında büyük bir hikâye anlattı; herkesin büyük keyfi için"

 dinner_past_gregarious:0 "[ROOT.GetCharacter.GetHerHis] hikâyeleriyle herkesi güldürerek bir kez daha akşamın neşesi oldu"

 dinner_past_just:0 "danışmanlarımla tatlı tatlı sohbet etti, sarayda tanık olduğu yakın tarihli bir haksızlık hakkında endişesini dile getirdi"

 dinner_past_zealous:0 "her zamanki şevkiyle aileye [ROOT.GetCharacter.GetFaith.PantheonTerm2]'ye dua ettirdi"

 dinner_past_trusting:0 "kendisine anlatılan her hikâyeyi gözleri kocaman açılmış, duyulur nefes sesleriyle dinledi"

 dinner_past_compassionate:0 "zarafetin timsaliydi; sohbet [ROOT.GetCharacter.GetHerHis] tarafına döndüğünde sıcak bir şekilde gülümsüyordu"

 dinner_past_stubborn:0 "gevezeliğiyle aileyi masada tuttu, kimsenin ortalıktan kaybolmasına inatla izin vermedi"

 dinner_past_forgiving:0 "akşam boyu arabuluculuk yaptı, birden çok aile tartışmasını yatıştırdı"

 dinner_past_charming:0 "kendiyle şıpıdık bir çocuktu; geniş geniş gülümsüyor ve masadaki neredeyse herkesi büyülüyordu"

 dinner_past_curious:0 "yemekler ve hizmetkârlar hakkında masum sorular sorarak herkesi eğlendirdi"

 dinner_past_pregnant:0 "karnı çocukla şişmiş halde, açıkça herkesin ilgi odağıydı"

 dinner_past_beauty_good_female:0 "bu gece güzellik saçıyordu; etkinlik için yeni bir tuvalet seçmeye özen göstermişti"

 dinner_past_beauty_good_male:0 "kadın hizmetkârların başını döndürdü; neredeyse komik bir özen ve ilgiyle çevresinde dolaşıyorlardı"

