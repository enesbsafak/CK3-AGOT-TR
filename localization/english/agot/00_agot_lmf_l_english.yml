 refuse_marriage_intro.tt:0 "[secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))] [secondary_recipient.GetShortUIName] ile [secondary_actor.GetShortUIName] arasındaki hazırlıklar derhal iptal edilecek"

 attraction_at_introduction:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], evlilik için tanıştırılırken birbirlerine âşık oldular."

 attraction_at_introduction_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ve [CHARACTER.GetShortUIName], evlilik için tanıştırılırken birbirlerine âşık oldular."

 friends_at_introduction:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], evlilik için tanıştırılırken gerçek dostlar olarak yakınlaştılar."

 friends_at_introduction_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ve [CHARACTER.GetShortUIName], evlilik için tanıştırılırken gerçek dostlar olarak yakınlaştılar."

 lmf_interaction_no_marriage.tt:0 "[secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))] Hazırlıklar İptal Edildi"

 lmf_interaction_no_marriage.success.actor.tt:0 "Tanışmanın başarısına rağmen, [actor.GetShortUIName] fikrini değiştirdi ve yaklaşan [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarını iptal etti."

 lmf_interaction_no_marriage.success.rec.tt:0 "Tanışmanın başarısına ve onayına rağmen, [recipient.GetShortUIName] fikrini değiştirdi ve yaklaşan [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarını iptal etti."

 lmf_interaction_no_marriage.failure.rec.tt:0 "Devam etme isteğine rağmen, [recipient.GetShortUIName] karşılıklı anlayış eksikliğinin yaklaşan [secondary_actor.Custom2('BetrothalMarriage', SCOPE.sC('secondary_recipient'))|l] hazırlıklarını iptal etmek için yeterli neden olduğuna karar verdi."

