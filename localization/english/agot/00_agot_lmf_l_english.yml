 lmf_heir.1666.t:0 "Sinsi Bir Varis"

 lmf_heir.1666.desc.away:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den uzakta olduğumdan,"

 lmf_heir.1666.desc.busy:0 "Başka işlerle meşgul olduğumdan,"

 lmf_heir.1666.desc.train:0 "[your_heir.GetSheHe]'in zamanı benimle geçireceğini ummuştum; ama bunun yerine "

 lmf_heir.1666.desc.notrain:0 "Şu bilgi verildi bana: "

 lmf_heir.1666.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftayı ortalıkta görünmeyerek geçirdi. [ROOT.Char.Custom('FortifiedBuilding')]'den uzakta değil, daha çok... ortalıkta sinsice dolaşarak.\n\nGörünüşe göre [your_heir.GetTitledFirstNameNoTooltip] bazı hizmetkârlarla yakınlaşıp en iyi 'yoklama' diye tanımlanabilecek konuşmalar yaptı. [your_heir.GetSheHe|U] ayrıca [ROOT.Char.Custom('FortifiedBuilding')]'in etrafında da dolaşıp duruyor; ara sıra beklenmedik yerlerde görülüyor ama asla şüpheli sayılacak bir şekilde değil. Daha iyisini bilmeseydim, [your_heir.Custom('polite_gender_ref')]'in ya benim ya da sarayımın sırlarını ortaya çıkarmaya çalıştığını söylerdim.\n\n[your_heir.GetSheHe] bir şey buldu mu? Hiçbir fikrim yok; [your_heir.GetSheHe]'in bulduğu herhangi bir şeyi [your_heir.GetHerHis] [your_heir.Custom2('LMF_RelationToMeShort', heir_liege )]'ine ifşa etmek niyetinde olup olmadığını da bilmiyorum.\n\n[your_heir.GetSheHe|U] epey zeki... ve hayal ettiğimden daha ihtiyatlı."

 lmf_heir.1666.a:0 "Endişelenmeli miyim?"

 lmf_heir.1667.t:0 "Ketum Olmayan Bir Varis"

 lmf_heir.1667.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftayı ortalıkta görünmeyerek geçirdi. [ROOT.Char.Custom('FortifiedBuilding')]'den uzakta değil, daha çok... ortalıkta sinsice dolaşarak.\n\nGörünüşe göre [your_heir.GetTitledFirstNameNoTooltip] bazı hizmetkârlarla yakınlaşıp en iyi 'yoklama' diye tanımlanabilecek konuşmalar yaptı ve [your_heir.GetSheHe] ayrıca [ROOT.Char.Custom('FortifiedBuilding')]'in etrafında da dolaşıp durdu. Bunu biliyorum çünkü [your_heir.Custom('polite_gender_ref')] yakalandı. Birkaç kez. Öyle bir noktaya geldi ki [your_heir.GetSheHe]'den [ROOT.Char.Custom('FortifiedBuilding')]'in bazı bölümlerinden uzak durması istendi ve hizmetkârların [your_heir.GetHerHim] ile konuşması yasaklandı.\n\n[your_heir.GetSheHe] sırları ortaya çıkarmaya çalışıyorsa, bunu [your_heir.GetHerHim]'den bekleyeceğimden çok daha beceriksizce yaptı."

 lmf_heir.1667.a:0 "[your_heir.GetHerHim]'i ağırladığım için aldığım teşekkür bu mu?"

 heir_digging_up_secrets:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] [CharMyHerHis(CHARACTER)] sırlarını ortaya çıkarmaya yönelik beceriksiz girişimlerine gücenmişti [CharWereWas(CHARACTER)]."

 heir_digging_up_secrets_corresponding:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] [CharMyHerHis(TARGET_CHARACTER)] sırlarını ortaya çıkarmaya yönelik beceriksiz girişimlerine gücenmişti [CharWereWas(TARGET_CHARACTER)]."

 lmf_heir.1668.t:0 "Kitap Kurdu"

 lmf_heir.1668.desc.start:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftanın çoğunu [ROOT.Char.Custom('FortifiedBuilding')]'in kütüphanesinde saklanarak geçirdi.\n\nŞey, belki 'saklanmak' doğru kelime değil. [your_heir.Custom('polite_gender_ref')] kimseyle pek etkileşime girmedi ve bir hizmetkâr [your_heir.GetHerHim]'i kontrol etmeye gittiğinde, [your_heir.GetTitledFirstNamePossessiveNoTooltip] burnu neredeyse her zaman tozlu bir ciltte oluyordu.\n\n"

 lmf_heir.1668.desc.well:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki kitapların [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'dekilerden çok daha üstün olduğunu varsayabilirim ancak; zira [your_heir.GetTitledFirstNameNoTooltip]'in bulduğu her şeyden epey memnun kaldığını duyuyorum. Görünüşe göre [your_heir.GetSheHe] çok şey öğrendi... ve herkesin isteyebileceği de ancak bu, değil mi?"

 lmf_heir.1668.desc.poorly:0 "[your_heir.GetSheHe] tek istediği okumaksa, neden [heir_visit_origin.GetTitle.GetNameNoTierNoTooltip]'e dönene dek beklemedi bilmiyorum. Görünüşe göre [your_heir.GetSheHe|U] zaten burada okumaya değer pek bir şey bulamadı ve en sonunda bıkıp kütüphaneyi hayal kırıklığıyla terk ettiğini anlıyorum. Belki de en iyisi bu; [your_heir.GetHerHim]'in yapacak çok başka şeyi var, değil mi?"

 lmf_heir.1668.a:0 "Kitaplarımızın [your_heir.GetHerHis] standartlarını karşıladığına sevindim."

 lmf_heir.1668.b:0 "Belki [your_heir.GetSheHe] bunun yerine yaparak öğrenmeye odaklanır?"

 lmf_heir.1669.t:0 "Sevilen Varis"

 lmf_heir.1669.desc.impressive:0 "[your_heir.GetSheHe] başlangıçta ne kadar etkileyiciyse, şaşırmamalıyım; ama "

 lmf_heir.1669.desc.unpleasant:0 "[your_heir.GetSheHe] en başta çok nahoş göründüğünden, bu biraz sürpriz; ama "

 lmf_heir.1669.desc.trouble:0 "[your_heir.GetSheHe]'in her şeyden çok baş belası olacağını varsaydığımdan, bu biraz sürpriz; ama "

 lmf_heir.1669.desc.dutiful:0 "[your_heir.GetSheHe] çok daha sessiz ve ağırbaşlı biri gibi göründüğünden, bu biraz sürpriz; ama "

 lmf_heir.1669.desc.homesick:0 "Görünüşe göre [your_heir.GetSheHe] ev özlemini sonunda yenmiş; zira "

 lmf_heir.1669.desc.avoid:0 "Görünüşe göre [your_heir.GetSheHe] buradaki insanlara sonunda ısınmış; zira "

 lmf_heir.1669.desc:0 "Bana söylendiğine göre [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )], [ROOT.Char.Custom('FortifiedBuilding')]'in çevresinde bir hayli sevilen bir figür haline gelmiş.\n\n[your_heir.GetTitledFirstNameNoTooltip] her gün hizmetkârları neşeyle selamlıyor ve sonra saraydaki işlere, hatta soylu kanından birinden normalde beklemeyeceğim işlere bile karışmak için elinden geleni yapıyor. Mutfakta çalışmak mı? Muhafızlarla sohbet mi? Kâhyalarım için ayak işleri mi? [your_heir.GetSheHe|U] hepsini, kimseye ayak bağı olmadan neşeyle yapıyor.\n\nDoğrusu oldukça harika."

 lmf_heir.1669.a:0 "Ne hoş bir gelişme."

 lmf_heir.1670.t:0 "Baş Belası Varis"

 lmf_heir.1670.desc.impressive:0 "[your_heir.GetSheHe] başlangıçta çok etkileyici olduğundan, bu biraz sürpriz; ama "

 lmf_heir.1670.desc.unpleasant:0 "[your_heir.GetSheHe] en başta ne kadar nahoş göründüyse, şaşırmamalıyım; ama "

 lmf_heir.1670.desc.trouble:0 "[your_heir.GetSheHe]'in beladan başka bir şey olmayacağına dair ilk beklentim şimdiye dek doğrulandı; zira "

 lmf_heir.1670.desc.dutiful:0 "[your_heir.GetSheHe] başlangıçta çok görev bilinçli göründüğünden, bu biraz sürpriz; ama "

 lmf_heir.1670.desc.homesick:0 "Görünüşe göre [your_heir.GetSheHe] ev özlemini henüz yenememiş; zira "

 lmf_heir.1670.desc.avoid:0 "[your_heir.GetSheHe] başlangıçta ne kadar içine kapanıksa, şaşırmamalıyım; ama "

 lmf_heir.1670.desc:0 "Bana söylendiğine göre [heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )], [ROOT.Char.Custom('FortifiedBuilding')]'in çevresinde bir baş belası haline gelmiş.\n\nGörünüşe göre [your_heir.GetTitledFirstNameNoTooltip], [your_heir.GetHerselfHimself]'ini sarayımın üyelerine sevdirmeye çalışmış; ama bu işe yaramayınca surat asmaya ve ortalıkta dolanmaya başlamış. Hizmetkârlardan bazıları [your_heir.GetHerHim]'i işe koşmayı denemiş; ama hiçbir şey ona 'layık' gelmemiş ve [your_heir.GetSheHe]'in hakkında az şey bildiği işlere karışıp hep ayak bağı olduğuna dair pek çok şikâyet duydum.\n\nHizmetkârların çoğu [your_heir.GetHerHim]'den büsbütün kaçınmaya başlamış. Ne kadar yorucu."

 lmf_heir.1670.a:0 "İyi bir işaret değil."

 lmf_heir.1671.t:0 "Çalışkan Varis"

 lmf_heir.1671.desc.start:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] birkaç hafta önce [ROOT.Char.Custom('FortifiedBuilding')] arazisinin hemen dışındaki bir inşaat projesine yardım etmek için gönüllü oldu. Sanırım bu tür projelerin nasıl yürütüldüğü ve diyara sağladıkları fayda hakkında deneyim kazanmak için.\n\n"

 lmf_heir.1671.desc.well:0 "Meğer işler herkesin beklediğinden iyi gitmiş. [your_heir.GetTitledFirstNameNoTooltip] projeyi devralmaya hiç kalkışmadı. Bunun yerine gözetmenden öğrenebildiği kadarını öğrendi ve işçilere bizzat yardım etti. Sonrasında [ROOT.Char.Custom('FortifiedBuilding')]'e dönen herkes, [your_heir.Custom('polite_gender_ref')]'in ne kadar yardımsever olduğunu ve yaptıkları işi gerçekten anlamak istediğini belirtti.\n\nDoğrusu beklenmedik bir sonuç; ama hoş bir sonuç."

 lmf_heir.1671.desc.poorly:0 "[your_heir.GetTitledFirstNameNoTooltip]'in gerçekte ne kadar yardımcı olabileceğine dair bazı sorular vardı... ve görünüşe göre bu endişeler yerindeymiş. Gözetmen daha sonra bana, [your_heir.Custom('polite_gender_ref')]'in en iyi ihtimalle bir baş belası, çoğu zaman da düpedüz bir engel olduğunu itiraf etti. [your_heir.GetSheHe|U] işten durmadan şikâyet etti, [your_heir.GetHerselfHimself]'ini köylü işçi ekibinin üstünde gördüğü besbelliydi ve hiçbir şey bilmediği halde projeyi devralmak için defalarca denedi.\n\nDoğrusu beklenmedik bir sonuç değil; ama yine de hayal kırıklığı."

 lmf_heir.1671.a:0 "[your_heir.GetSheHe]'in [your_heir.GetHerHim]'de bunun olduğunu kim bilirdi?"

 lmf_heir.1671.b:0 "Belki [your_heir.GetSheHe] [ROOT.Char.Custom('FortifiedBuilding')]'de kalsaydı daha iyiydi."

 lmf_heir.1672.t:0 "Talihsiz Bir Olay"

 lmf_heir.1672.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftanın çoğunu [ROOT.Char.Custom2('LMF_RelationToMeShort', your_courtier )] ile birlikte geçirdi. Bence bu, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))]'in [your_heir.GetTitledFirstNamePossessiveNoTooltip] eğitimine yardım etmek için sarf ettiği bir çabaydı.\n\nMeğer işler bundan kötü gidemezmiş. İkili başta iyi anlaştıysa da, görünüşe göre bir tartışma yaşadılar... ve bu, için için kaynayan bir kızgınlığa dönüştü; ta ki sonunda [your_heir.GetTitledFirstNameNoTooltip] sarayın ortasında [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))]'e patlayana dek. Ağza alınmayacak sözler söylendi, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] inanılmaz derecede utandı ve ikisi de birbirini affedecek gibi değil.\n\nYani [your_heir.Custom('polite_gender_ref')] yalnızca buraya geldiği eğitimi neredeyse hiç ilerletmedi; sarayımdaki bir üyede de kendine yeni bir düşman edindi."

 lmf_heir.1672.a:0 "Aferin, [your_heir.Custom('GetLassLad')]."

 fight_during_heir_training:0 "[TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat|U], bir ziyaret sırasında sarayda [CHARACTER.GetShortUINameNoTooltipNoFormat]'i affedilemeyecek şekilde aşağıladı."

 fight_during_heir_training_corresponding:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], bir ziyaret sırasında sarayda [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat]'i affedilemeyecek şekilde aşağıladı."

 lmf_heir.1673.t:0 "Yeni Bir Dost"

 lmf_heir.1673.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )] son birkaç haftanın çoğunu [ROOT.Char.Custom2('LMF_RelationToMeShort', your_courtier )] ile birlikte geçirdi. Bence bu, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))]'in [your_heir.GetTitledFirstNamePossessiveNoTooltip] eğitimine yardım etmek için sarf ettiği bir çabaydı.\n\nİkisi daha iyi anlaşamazdı. Kısa sürede [your_heir.GetTitledFirstNameNoTooltip] ile [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('your_courtier'))] neredeyse birbirinden ayrılmaz oldu. [ROOT.Char.Custom2('LMF_RelationToMeShort', your_courtier )] [your_heir.GetHerHim]'e [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in iç işleyişini gösterirken ikisi [ROOT.Char.Custom('FortifiedBuilding')]'in her yerine birlikte gidiyor, gülüyor ve şakalaşıyordu; muhtemelen [your_heir.GetHerHim]'e benim verebileceğimden daha iyi bir eğitim veriyordu.\n\nİkisi sarayda hâlâ canciğer dosttu; bu da bana dostluklarının kısa ömürlü olmadığını düşündürüyor."

 lmf_heir.1673.a:0 "Muhteşem!"

 befriended_during_heir_training:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ve [TARGET_CHARACTER.GetShortUINameNoTooltipNoFormat], [CharYouSheHe(CHARACTER)] bir ziyaret sırasında [CharYouHerHim(TARGET_CHARACTER)]'i eğitirken yakınlaştılar."

