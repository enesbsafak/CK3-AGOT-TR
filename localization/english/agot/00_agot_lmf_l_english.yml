 game_concept_lmf_heir_training:0 "Varis Eğitimi"

 game_concept_lmf_heir_training_desc:0 "12 yaşından itibaren bir hükümdarın [player_heir|E]'i, [GetTrait('heir_in_training').GetName( GetNullCharacter )] [trait|E]'ini alır ve hükümdarlık ve devlet yönetme sanatı eğitimine başlar:\n\n$EFFECT_LIST_BULLET$Bu eğitim, varisin hükümdarın [court|E]'inde olmasını gerektirir; varis ve [guardian|E]'i (ya da varis yetişkin olduktan sonra [liege|E]'i) müsait ve sağlıklı olduğu sürece eğitim yıllık olarak ilerler.\n\n$EFFECT_LIST_BULLET$İlerleme miktarı, varisin ve vasisi/hükümdarının ikisinin [learning|E]'ine, varisin yaşına (yaşlandıkça eğitim yavaşlar) bağlıdır ve zekâ, çalışkanlık, sabır gibi çeşitli şeyler tarafından değiştirilir.\n\n$EFFECT_LIST_BULLET$Varis [GetTrait('education_heir_training_1').GetName( GetNullCharacter )] seviyesine ulaştığında 'eğitilmiş' sayılır ve bu özellik, unvan aldıktan sonra bile korunur. Eğitime devam ederse, özellik en sonunda [GetTrait('education_heir_training_4').GetName( GetNullCharacter )]'e kadar ilerleyebilir.\n\n$EFFECT_LIST_BULLET$Varis, unvan aldığında olduğu gibi, hükümdarıyla aynı sarayda olmadığı anda eğitim durur."

 game_concept_lmf_lover_rating:0 "Sevgili Puanı"

 game_concept_lmf_lover_rating_desc:0 "Bir karakter [lover|E]'in ya da [soulmate|E]'in olduğunda, ilişkin duygularının yoğunluğunu gösteren bir puan alır. Bu, alacağın sevgiliyle ilgili olayların türünü güçlü biçimde etkiler.\n\nBu puan zamanla yükselir ve düşer; her ne kadar yükseltmek zaman ve çaba gerektirse de.\n\nPuanlar, en yüksekten en düşüğe doğru:\n\n$EFFECT_LIST_BULLET$#difficulty_hard Hayranlık#!: bir [soulmate|E] için başlangıç puanı; bu puanda bir [lover|E] [soulmate|E]'e yükseltilebilir\n$EFFECT_LIST_BULLET$#difficulty_hard Kalıcı Aşk#!\n$EFFECT_LIST_BULLET$#difficulty_hard Aşk#!: bir [lover|E] için başlangıç puanı; bu puanda bir [soulmate|E] [lover|E]'e düşürülebilir\n$EFFECT_LIST_BULLET$#difficulty_hard Sevgi#!: bir [soulmate|E] kesinlikle [lover|E]'e düşürülür\n$EFFECT_LIST_BULLET$#difficulty_hard Solan Aşk#!\n$EFFECT_LIST_BULLET$#difficulty_hard Kayıp Aşk#!: bu puanda ilişki her zaman sona erer"

