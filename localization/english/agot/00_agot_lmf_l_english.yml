 lmf_heir.1656.desc:0 "[heir_liege.GetTitledFirstNamePossessiveNoTooltip] [heir_liege.Custom2('LMF_RelationToMeShort', your_heir )]'in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e geldiği andan itibaren baş belası olduğu söyleniyor. [your_heir.GetHerHis|U] ilk birkaç haftası, [ROOT.Char.Custom('FortifiedBuilding')] konuklarının uyması beklenen kuralların çoğunu görmezden gelerek ortalıkta serserilik ederek ve [ROOT.Char.Custom('FortifiedBuilding')] hizmetkârlarının başına sürekli dert olarak geçti. Belki [your_heir.GetSheHe] bu geziyi bir tatil sanıyor?\n\nKendime [your_heir.GetSheHe]'in yalnızca yerleşmekte olduğunu ve ziyaretin bundan sonrasını göreceğimizi söylüyorum; ama bu kesinlikle hayırlı bir başlangıç değil."

