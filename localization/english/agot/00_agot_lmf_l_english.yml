 lmf_feast.1003.b.makeup.tt:0 "Sonunda arayı düzeltiyorlar"

 lmf_feast.1003.b.nomakeup.tt:0 "Gerçek bir barışma yok"

 lmf_feast.1004.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki büyük salondaki bu geceki toplantı nispeten sessiz bir etkinlikti. Patlamalar yok, dram yok; sadece ailem görece huzurlu bir anın tadını çıkarıyordu.\n\nDaha da şaşırtıcı olan, belki, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_rival'))] ile benim gerçekten konuşmuş olmamız.\n\nİkimiz de iyiden iyiye kafayı bulmuştuk, doğru; ama sohbetimizde uzun zamandır olmayan bir rahatlık vardı. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_rival'))]'im şakalarımdan birine güldüğünde merak etmeye başladım... rekabetimiz nihayet sona erebilir miydi? Burada, bu gece bitebilir miydi?"

 lmf_feast.1004.a:0 "Arayı düzeltme zamanı geldi."

 lmf_feast.1004.a.success.tt:0 "[family_rival.GetHerHim]'i rekabete son vermeye ikna ediyorsun"

 lmf_feast.1004.a.failure.tt:0 "[family_rival.GetSheHe|U] girişiminden rahatsız oluyor"

 lmf_feast.1004.b:0 "İyi bir gece geçirmiş olmamız yeter."

 lmf_feast.1005.t:0 "Aile Şöleni: Anma"

 lmf_feast.1005.desc.start:0 "Bu geceki aile şöleni kasvetli bir etkinlikti.\n\n[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('dead_relative'))]'imin yakın tarihli ölümü hâlâ büyük salonun üzerinde kara bir bulut gibi asılı. "

 lmf_feast.1005.desc.miscarriage.start:0 "Bu geceki aile şöleni kasvetli bir etkinlikti.\n\n[dead_child.Custom('GetDaughterSon')]'imin yakın tarihli ölü doğumu hâlâ büyük salonun üzerinde kara bir bulut gibi asılı. "

 lmf_feast.1005.desc.miscarriage:0 "[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dead_relative'))|U] masada oturdu, zar zor konuşuyordu ama üzüntüsü neredeyse hissediliyordu.\n\nİçimizden çok azı konuştu; konuştuğumuzda da onu — hatta hepimizi — hayatın devam ettiğini nazikçe hatırlatmak içindi.\n\nO konuşmanın ona ne kadar yardımcı olduğunu bilmiyorum ama yemek bittiğinde [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('dead_relative'))] masanın altında elimi tuttu. En azından bir şeydi ve ailenin bu karanlık anda bir arada olması, öncesindeki sessizlikten daha iyiydi."

 lmf_feast.1005.desc.old:0 "İçimizden çok azı konuştu; konuştuğumuzda da çoğunlukla [dead_relative.GetFirstNameNoTooltip]'ten söz ettik.\n\n[dead_relative.GetSheHe|U] uzun bir ömür sürdü ve [dead_relative.GetHerHis] vefatı sarayımda kolay kolay dolmayacak bir boşluk bıraktı. [dead_relative.GetHerHim]'e dair güzel anıları yâd ettik, pek hoş olmayanları görmezden geldik ve... bir bakıma, birlikte yas tutmak için orada olmamız yardımcı oldu."

 lmf_feast.1005.desc.adult:0 "İçimizden çok azı konuştu; konuştuğumuzda da çoğunlukla [dead_relative.GetFirstNameNoTooltip]'ten söz ettik.\n\n[dead_relative.GetHerHim]'e dair güzel anıları yâd ettik, pek hoş olmayanları görmezden geldik ve... bir bakıma, birlikte yas tutmak için orada olmamız yardımcı oldu."

 lmf_feast.1005.desc.child:0 "İçimizden çok azı konuştu; konuştuğumuzda da çoğunlukla [dead_relative.GetFirstNameNoTooltip]'ten söz ettik.\n\n[dead_relative.GetSheHe|U] o kadar genç öldü ki doğrusu [dead_relative.GetHerHim]'i zar zor tanıdık. O yüzden bunun yerine [dead_relative.GetHerHis] muzipliklerini ve büyüyebilseydi nasıl biri olabileceğini konuştuk... ve bir bakıma, birlikte yas tutmak için orada olmamız yardımcı oldu."

 lmf_feast.1005.desc.baby:0 "İçimizden çok azı konuştu; konuştuğumuzda da çoğunlukla [dead_relative.GetFirstNameNoTooltip]'ten söz ettik.\n\n[dead_relative.GetSheHe|U] daha bir bebekken öldü ve [ROOT.Char.GetFaith.DeathDeityName]'in [dead_relative.GetHerHim]'i daha şimdiden aramızdan alması bir şekilde çok haksız görünüyordu. Bunu konuşmak hepimiz için acıydı... ama bir bakıma, birlikte yas tutmak için orada olmamız yardımcı oldu."

 lmf_feast.1005.a:0 "[ROOT.Char.GetFaith.DeathDeityName] [dead_relative.GetHerHis] ruhuna rahmet etsin."

 lmf_feast.1005.b:0 "[dead_relative.GetSheHe|U] unutulmayacak."

 lmf_feast.1005.c:0 "[ROOT.Char.GetFaith.DeathDeityName] [dead_child.GetHerHis] minicik ruhuna rahmet etsin."

 lmf_feast.1006.t:0 "Aile Şöleni: Kakofoni"

 lmf_feast.1006.desc:0 "Aile, akşam yemeği için [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in büyük salonunda toplandı ve daha en başından tımarhane gibiydi.\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family_1'))|U] [dinner_neg_family_1.Custom('dinner_activity_neg_past')].\n\nSonra [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family_2'))] [dinner_neg_family_2.Custom('dinner_activity_neg_past')].\n\nAyrıca [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family_3'))] [dinner_neg_family_3.Custom('dinner_activity_neg_past')].\n\nHerkes bağırıyordu ve kakofoni o kadar rahatsız edici hale geldi ki sonunda sesimi yükseltip hepsine susmalarını emrettim. Pişman olduğum bazı şeyler söylemiş olabilirim; ama o ortamdan çıkmam gerekiyordu."

 lmf_feast.1006.a:0 "Daha iyi anlarım da oldu, doğru."

 lmf_feast.1007.t:0 "Aile Şöleni: Huzur"

 lmf_feast.1007.desc:0 "Ara sıra, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki ailemizin başka herhangi bir aile gibi olabileceğini hissediyorum. Bu gece o anlardan biriydi.\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family_1'))|U] [dinner_pos_family_1.Custom('dinner_activity_pos_past')].\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family_2'))|U] [dinner_pos_family_2.Custom('dinner_activity_pos_past')].\n\nHatta [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family_3'))] [dinner_pos_family_3.Custom('dinner_activity_pos_past')].\n\nHerkes iyi geçindi; gülüyor, hatta şarkı söylüyorduk. Bir ara ayağa kalkıp ailemi gözleri yaşaran bir konuşma yaptım. Güzeldi... gerçekten güzeldi."

 lmf_feast.1007.a:0 "Güzel bir akşam."

 lmf_feast.1008.t:0 "Aile Şöleni: Arkadaşlık"

 lmf_feast.1008.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki büyük salondaki bu geceki aile şöleni oldukça iyi geçti.\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family'))|U] [dinner_pos_family.Custom('dinner_activity_pos_past')].\n\nSonra [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_friend_1'))]'in şununla harika anlaştığını fark ettim: "

 lmf_feast.1008.desc.relation:0 "[family_friend_1.GetHerHis] [family_friend_1.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_friend_2'))], [family_friend_2.GetTitledFirstNameNoTooltip]. "

 lmf_feast.1008.desc.norelation:0 "[ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_friend_2'))]. "

 lmf_feast.1008.desc.child:0 "Ortalıkta koşuşturuyorlardı; çocukların en iyi yaptığı şeyi yapıyorlardı. Gülüyor, oynuyorlardı.\n\n"

 lmf_feast.1008.desc.twomen:0 "Birbirlerinin sırtına vuruyor, gülüyor ve hikâyeler anlatıyorlardı.\n\n"

 lmf_feast.1008.desc.twowomen:0 "Fısıltıyla dedikodu yapıyor, gülüyor ve eğleniyorlardı.\n\n"

 lmf_feast.1008.desc.mixed:0 "Uzun uzun sohbet ediyorlardı... romantik bir biçimde değil; ama gerçek bir ilgi ve saygıyla.\n\n"

 lmf_feast.1008.desc.end:0 "Sanırım gerçek bir dostluğun başlangıcına tanıklık ediyorum."

 lmf_feast.1008.a:0 "Harika!"

 lmf_feast.1009.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki büyük salondaki bu geceki aile şöleni oldukça iyi geçti.\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family'))|U] [dinner_pos_family.Custom('dinner_activity_pos_past')].\n\nAyrıca [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_friend'))] ile gerçekten çok iyi anlaştım. "

 lmf_feast.1009.desc.child:0 "Yemek biter bitmez [family_friend.GetSheHe|U] bana bir oyunda eşlik etti ve ben farkına varmadan ikimiz de daha önce hiç olmadığı gibi gülüyor ve eğleniyorduk.\n\n"

 lmf_feast.1009.desc.adult:0 "Yemek biter bitmez [family_friend.GetSheHe|U] benimle içki içti ve ben farkına varmadan ikimiz de gülüyor, birbirimize hikâyeler anlatıyorduk.\n\n"

 lmf_feast.1009.desc.end:0 "Bu yeni bir dostluğun başlangıcı mı?"

 lmf_feast.1009.a:0 "Bu bir! Yeni bir dost!"

 lmf_feast.1009.b:0 "Hayır, [family_friend.GetSheHe] en fazla bu kadar yaklaşır."

 lmf_feast.1010.t:0 "Aile Şöleni: Soğuk"

 lmf_feast.1010.desc.start:0 "Bu akşamki aile şöleninde büyük salonda tuhaf bir hava vardı.\n\nİlk olarak, [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family'))] [dinner_neg_family.Custom('dinner_activity_neg_past')].\n\nSonra [family_friend_1.GetFirstNameNoTooltip] ile [family_friend_2.GetFirstNameNoTooltip]'in konuşmadığını fark ettim.\n\nNormalde birbirlerinden ayrılmazlar; ama birden [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_friend_1'))]'im ve "

 lmf_feast.1010.desc.relation:0 "[family_friend_1.GetHerHis] [family_friend_1.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_friend_2'))] "

 lmf_feast.1010.desc.norelation:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_friend_2'))]'im "

 lmf_feast.1010.desc.end:0 "masanın zıt uçlarında oturdular; birbirlerine yaklaştıkları olursa da aralarında belirgin bir soğukluk vardı.\n\nGörünüşe göre dostlukları sona ermiş."

 lmf_feast.1010.a:0 "Çok yazık."

 lmf_feast.1011.desc:0 "Bu akşamki aile şöleninde büyük salonda tuhaf bir hava vardı.\n\nİlk olarak, [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family'))] [dinner_neg_family.Custom('dinner_activity_neg_past')].\n\nSonra [family_friend.GetFirstNameNoTooltip]'in benden kaçındığını fark ettim. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_friend'))]'ime yaklaşmaya çalıştığımda [family_friend.GetSheHe] uzaklaştı... ve o günden beri aramızda belirgin bir soğukluk var. Ne yaptım ben? [family_friend.GetSheHe] neden benimle konuşmuyor?"

 lmf_feast.1011.a:0 "Ne değişti anlamıyorum..."

 lmf_feast.1012.t:0 "Aile Şöleni: İfşa"

 lmf_feast.1012.desc.start:0 "Bu geceki aile şöleni, olaysız ve sessiz bir etkinlikti. Aslında akşam için çekilmek üzereydim ki [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('tattler'))] ile konuştum.\n\n"

 lmf_feast.1012.desc.child:0 "[tattler.Custom('polite_gender_ref')]'in söylediklerinin tüm sonuçlarını bile bildiğini sanmıyorum; sadece masumca şunu duymuş olduğunu:"

 lmf_feast.1012.desc.adult:0 "[tattler.GetFirstNameNoTooltip]'in bana söylediklerinin tüm sonuçlarını bile bildiğini sanmıyorum; sadece şunu duymuş olduğunu:"

 lmf_feast.1012.desc.relation:0 "[tattler.GetHerHis] [tattler.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_secret'))] "

 lmf_feast.1012.desc.norelation:0 "[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_secret'))] "

 lmf_feast.1012.desc.child2:0 "bunun hakkında fısıldaşıyor ve hepsini inanılmaz derecede eğlenceli buluyordu.\n\n"

 lmf_feast.1012.desc.temperate:0 "konuşuyordu ve konunun oldukça rahatsız edici olduğunu buldum.\n\n"

 lmf_feast.1012.desc.drunk:0 "fısıldaşıyor ve sonra, iyiden iyiye kafayı bulmuşken, laf arasında bana bahsetti.\n\n"

 lmf_feast.1012.desc.end:0 "Şey, [tattler.GetFirstNameNoTooltip] anlamasa da ben sonuçları çok iyi anladım. [family_secret.GetTitledFirstNameNoTooltip]'in bir sırrı var; [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_secret'))]'imin istemeden ifşa ettiği bir sır."

 lmf_feast.1012.a:0 "Ne ilginç..."

 lmf_feast.1013.t:0 "Aile Şöleni: Çekim"

 lmf_feast.1013.start:0 "Bu geceki aile şöleni nispeten sessiz ve sıradandı... kayda değer tek bir istisna dışında.\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_lover_1'))]'in oldukça tuhaf davrandığını fark ettim. [family_lover_1.GetSheHe|U] büyük salonun öbür ucuna, şuna doğru beklercesine bakıp duruyordu: "

 lmf_feast.1013.desc.relation:0 "[family_lover_1.GetHerHis] [family_lover_1.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_lover_2'))], [family_lover_2.GetTitledFirstNameNoTooltip]"

 lmf_feast.1013.desc.norelation:0 "[ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_lover_2'))]"

 lmf_feast.1013.end:0 ", o da görmezden geldi. Ne var ki [family_lover_1.GetFirstNameNoTooltip] sonunda izin isteyip kalkınca, bir dakika sonra [family_lover_2.GetFirstNameNoTooltip] sessizce peşinden gitti.\n\nNeyle uğraştıklarını görmeye karar verdim ve ikiliyi karanlık bir koridorda tutkulu bir kucaklaşmaya kilitlenmiş halde fark ettim. Hızla geri çekildim, kimseye bir şey söylemedim... en azından henüz."

 lmf_feast.1013.a:0 "Şok edici!"

 lmf_feast.1014.t:0 "Aile Şöleni: Şiddet"

 lmf_feast.1014.start:0 "Bu akşamki hareketli aile şöleninde gerginlikler had safhadaydı.\n\nHerkes bağırıyordu. [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family'))|U] [dinner_neg_family.Custom('dinner_activity_neg_past')].\n\nEn kötüsü, salonun öbür ucundan [family_duel_starter.GetFirstNameNoTooltip]'in [family_duel_target.GetFirstNameNoTooltip] ile tartıştığını duyabiliyordunuz. [family_duel_starter.GetFirstNameNoTooltip]'in giderek daha da öfkelendiğini izledim; ta ki sonunda [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_duel_starter'))]'im bir hançer çekip saldırana dek "

 lmf_feast.1014.desc.relation:0 "[family_duel_starter.GetHerHis] [family_duel_starter.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_duel_target'))]. "

 lmf_feast.1014.desc.norelation:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_duel_target'))]'im. "

 lmf_feast.1014.end:0 "\n\nYere kan damlarken herkes şokla durup baktı. Rekabetlerinin kontrolden çıktığı açıktı."

 lmf_feast.1014.a:0 "Bu işten uzak dur."

 lmf_feast.1014.b:0 "Sanırım kavga ettikleri an bu?"

 lmf_feast.1014.a.start.kill.tt:0 "[family_duel_starter.GetFirstNameNoTooltip] düelloda [family_duel_target.GetFirstNameNoTooltip]'i öldürüyor"

 lmf_feast.1014.a.start.win.tt:0 "[family_duel_starter.GetFirstNameNoTooltip] düelloyu kazanıyor"

 lmf_feast.1014.a.target.win.tt:0 "[family_duel_target.GetFirstNameNoTooltip] düelloyu kazanıyor"

 lmf_feast.1014.a.target.kill.tt:0 "[family_duel_target.GetFirstNameNoTooltip] düelloda [family_duel_starter.GetFirstNameNoTooltip]'i öldürüyor"

 family_feast_duel:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], bir aile şöleninde düello ettiler."

 lmf_feast.1014.c:0 "[family_duel_starter.GetFirstNameNoTooltip]'i sakinleşene dek hapse at."

 lmf_feast.1015.t:0 "Aile Şöleni: Saadet"

 lmf_feast.1015.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki şölen bu gece güzeldi. Herkes sessiz ve usluydu; ailemin arasındaki ruh hali samimiyetti.\n\n"

 lmf_feast.1015.desc.newborn:0 "Yemekler kaldırıldıktan kısa süre sonra bir hizmetçi, küçük [show_child.GetFirstNameNoTooltip]'i kreşten çıkarıp getirdi; hâlâ kundaklıydı ve olması gerekenden çok daha geç bir saatte uyanıktı. Yine de [family_spouse.GetFirstNameNoTooltip] ve ben dayanamadık. Bebeği kollarımıza aldık, [show_child.GetHerHim]'e sevgi sözleri mırıldandık... ve [family_spouse.GetFirstNamePossessiveNoTooltip] ile gözlerimizin şunu söyler gibi buluştuğu bir an oldu:\n\nBunu biz yaptık. Bu kusursuz küçük [show_child.Custom('GirlBoy')]'ü biz yaptık."

 lmf_feast.1015.desc.smallchild:0 "Yemekler kaldırıldıktan kısa süre sonra bir hizmetçi, genç [show_child.GetFirstNameNoTooltip]'i bize iyi akşamlar demesi için kreşten çıkardı. [show_child.Custom('GirlBoy')] elbette homurdandı; büyük salonda olup bitenlere o kadar meraklıydı ki. Uyanık kalabilmek için bizi eğlenceli bir dansla eğlendirdi. [family_spouse.GetFirstNameNoTooltip] ve ben gönülden güldük; gözlerimizin şunu söyler gibi buluştuğu bir an oldu:\n\nBu bizim küçük [show_child.Custom('GirlBoy')]'ümüz. Bizim ailemiz."

 lmf_feast.1015.desc.youngchild:0 "Yemekler kaldırıldıktan kısa süre sonra genç [show_child.GetFirstNameNoTooltip] sevinçle sıçrayarak geldi; hem [family_spouse.GetFirstNameNoTooltip]'i hem de beni neşeli bir şarkı ve dansla eğlendirmeye kararlıydı. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_spouse'))] ve ben elbette gönülden güldük; gözlerimizin şunu söyler gibi buluştuğu bir an oldu:\n\nBu bizim [show_child.Custom('GetDaughterSon')]'imiz. Biz bir aileyiz."

 lmf_feast.1015.desc.stillgotit:0 "Yemekler kaldırıldıktan sonra [family_spouse.GetFirstNameNoTooltip] ve ben, eğlenceye ve sohbete dalmış herkese baktık. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_spouse'))]'im doygunlukla iç çekti; sonra [family_spouse.GetSheHe] bana döndü... ve [family_spouse.GetHerHis] gözlerindeki parıltıyı gördüm. [family_spouse.GetSheHe|U] açıkça geceyi karı koca olarak geçirmek istiyordu, hem de hemen başlamak üzere!"

 lmf_feast.1015.desc.chaste:0 "Yemekler kaldırıldıktan sonra [family_spouse.GetFirstNameNoTooltip] ve ben, eğlenceye ve sohbete dalmış herkese baktık. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_spouse'))]'im doygunlukla iç çekti ve göz göze geldik. Bizimki ateş gibi yanan bir tutku olmayabilir; ama yine de aşk. Bu bizim ailemiz ve bu güzel."

 lmf_feast.1015.a:0 "[family_spouse.GetTitledFirstNameNoTooltip]'e bir kadeh kaldır!"

 friend_family_feast:0 "[CHARACTER.GetShortUIName|U] ve [TARGET_CHARACTER.GetShortUIName], sıcak bir aile şöleninde yakınlaştılar."

 lmf_feast.1016.t:0 "Aile Ziyafeti: Hor Görme"

 lmf_feast.1016.desc.start:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_spouse'))]'imle aram bu akşamki aile şöleninin daha başından gergindi.\n\nİlk başta zar zor konuştuk; aramızda geçen birkaç söz buz gibi ve nahoştu. Sonra, yemek bitince, işler daha da kötüleşti. "

 lmf_feast.1016.desc.object.to.me:0 "[family_spouse.GetSheHe|U] bana tiksinti dolu bakışlar fırlattı, dokunuşumdan irkildi. "

 lmf_feast.1016.desc.object.to.me.sodomy:0 ""Truly? With other men?!" [family_spouse.GetSheHe] hissed. And now I knew what it was about, even if knowing improved nothing.\n\n"

 lmf_feast.1016.desc.object.to.me.incest:0 ""Truly? With your own family?!" [family_spouse.GetSheHe] hissed. And now I knew what it was about, even if knowing improved nothing.\n\n"

 lmf_feast.1016.desc.object.to.me.secret.sodomy:0 ""Truly? With other men?" [family_spouse.GetSheHe] hissed. Yet [family_spouse.GetSheHe] utterly refused to elaborate.\n\n"

 lmf_feast.1016.desc.object.to.me.secret.incest:0 ""Truly? With your own family?" [family_spouse.GetSheHe] hissed. Yet [family_spouse.GetSheHe] utterly refused to elaborate.\n\n"

 lmf_feast.1016.desc.object.to.me.deviant:0 ""I know what you are," [family_spouse.GetSheHe] hissed. And now I knew what it was about, even if knowing improved nothing.\n\n"

 lmf_feast.1016.desc.object.to.me.secret.deviant:0 ""I know what you are," [family_spouse.GetSheHe] hissed. Yet [family_spouse.GetSheHe] utterly refused to elaborate.\n\n"

 lmf_feast.1016.desc.object.to.them:0 "[family_spouse.GetHerHis] hakkında bildiklerimi bildiğim için tiksintimi içimde tutamadım; "

 lmf_feast.1016.desc.object.to.them.sodomy:0 "başka erkeklerle gönül eğlendirmeleri. "I know what you are!" I hissed at one point.\n\n"

 lmf_feast.1016.desc.object.to.them.incest:0 "[family_spouse.GetHerHis] kendi yakınlarına duyduğu yasak arzu. "I know what you are!" I hissed at one point.\n\n"

 lmf_feast.1016.desc.object.to.them.secret.sodomy:0 "başka erkeklerle gizli gönül eğlenceleri. "I know what you are!" I hissed at one point.\n\n"

 lmf_feast.1016.desc.object.to.them.secret.incest:0 "[family_spouse.GetHerHis] kendi yakınlarıyla gizli ve yasak gönül eğlenceleri. "I know what you are!" I hissed at one point.\n\n"

 lmf_feast.1016.desc.object.to.them.deviant:0 "tuhaf ve sapkın şehvetler. "I know what you are!" I hissed at one point.\n\n"

 lmf_feast.1016.desc.object.to.them.secret.deviant:0 "gizli ve sapkın cinsel uygulamalar. "I know what you are!" I hissed at one point.\n\n"

 lmf_feast.1016.desc.betrayed:0 "[family_spouse.GetSheHe|U] tartışmacı, hatta alaycı bir tavra büründü. Bunun evlilik yeminlerimize ihanetimle ilgili olduğunu biliyordum... [family_spouse.GetSheHe] bunu asla affetmeyecekti.\n\n"

 lmf_feast.1016.desc.they.betrayed:0 "Tartıştım ve [family_spouse.GetHerHis] her dokunuşundan irkildim. [family_spouse.GetHerHis] evlilik yeminlerimize ihanetini ne affedebilir ne de unutabilirdim. Yapamazdım!\n\n"

 lmf_feast.1016.desc.they.secret.lover:0 "Tartıştım ve [family_spouse.GetHerHis] her dokunuşundan irkildim. [family_spouse.GetHerHim]'in [suspected_lover.GetTitledFirstNameNoTooltip] ile yattığı görüntüsünü aklımdan çıkaramıyordum ve bu beni delirtiyordu!\n\n"

 lmf_feast.1016.desc.secret.lover:0 ""Did it have to be with [suspected_lover.GetFirstNameNoTooltip]?" [family_spouse.GetSheHe] hissed, but refused to elaborate on just how much [family_spouse.GetSheHe] knew about [suspected_lover.GetHerHim].\n\n"

 lmf_feast.1016.desc.rivalry:0 "[family_spouse.GetSheHe|U] her sözüme alayla karşılık verdi, dokunuşumdan irkildi. Son zamanlarda aramız iyi değildi ama artık [family_spouse.GetSheHe] aradaki uçurumu kapatmaya yönelik her girişimi reddediyordu.\n\n"

 lmf_feast.1016.desc.end:0 "Akşam sona erdiğinde, bağrışmalarımız ailenin geri kalanının dehşet dolu bakışlarını üzerimize çekmişti. [family_spouse.GetFirstNameNoTooltip] öfkeyle çıkıp gitti ve hepsi... bu kadardı."

 lmf_feast.1016.a:0 "Ay."

 nemesis_family_feast:0 "[CHARACTER.GetShortUIName|U], aile şöleninde yaşanan bir patlamanın ardından [TARGET_CHARACTER.GetShortUIName|U]'in baş düşmanı oldu."

 nemesis_family_feast_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], aile şöleninde yaşanan bir patlamanın ardından [CHARACTER.GetShortUIName|U]'in baş düşmanı oldu."

 rival_family_feast:0 "[CHARACTER.GetShortUIName|U], aile şöleninde evlilikleri yüzünden [TARGET_CHARACTER.GetShortUIName|U] ile büyük bir kavga etti."

 rival_family_feast_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], aile şöleninde evlilikleri yüzünden [CHARACTER.GetShortUIName|U] ile büyük bir kavga etti."

 lmf_feast.1017.t:0 "Aile Şöleni: Kaza"

 lmf_feast.1017.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki aile şöleni kalabalıktı ve yeterince iyi başladı.\n\n[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family'))|U] [dinner_pos_family.Custom('dinner_activity_pos_past')].\n\nSonra işler birden tersine döndü.\n\nHizmetkârlardan biri panikle büyük salona koşarak girdi ve bana [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_accident'))] "

 lmf_feast.1017.desc.fire:0 "mutfakta çıkan ani bir yangında ağır yanmıştı. "

 lmf_feast.1017.desc.stairs:0 "hemen dışarıdaki merdivenlerden düşmüştü. "

 lmf_feast.1017.desc.window:0 "hemen üst kattaki pencerelerden birinden düşmüştü. "

 lmf_feast.1017.desc.fall:0 "avluda korkunç bir düşüş yaşamıştı. "

 lmf_feast.1017.desc.trample:0 "hayvanlardan biri çıldırınca avluda ezilmişti. "

 lmf_feast.1017.desc.accident:0 "avluda korkunç bir yaralanma geçirmişti; ama ne olduğunu zar zor anlatabiliyordu. "

 lmf_feast.1017.desc.end:0 "\n\nElbette bir kazaydı ve hepimiz derin bir endişeye kapıldık. Herkesi derhal gönderdim ve [family_accident.GetFirstNamePossessiveNoTooltip] tedavisiyle ilgilenmeye gittim."

 lmf_feast.1017.a:0 "Umarım fazla ciddi değildir!"

 lmf_feast.1017.injured.tt:0 "[family_accident.GetTitledFirstName] yaralandı!"

 lmf_feast.1018.t:0 "Aile Şöleni: Hastalık"

 lmf_feast.1018.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki aile şöleni bu akşam oldukça iyi gidiyordu, en azından başlangıçta.\n\nHerkes gülüp eğleniyordu; ta ki birden biri "

 lmf_feast.1018.desc.child:0 "küçük [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_sick'))]'in fazlasıyla sessizleştiğini fark etti.\n\n[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_sick'))]'im gerçekten de kül rengi bir hal almıştı; derken [family_sick.GetSheHe] [family_sick.GetHerHis] sandalyesinden düştü! "

 lmf_feast.1018.desc.adult:0 "telaşla bağırdı. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_sick'))] [family_sick.GetHerHis] tabağına kusmuştu! İlk başta aşırı içkinin sonucu olduğu sanılan şeyin, çok daha ciddi bir şey olduğu çabucak anlaşıldı.\n\n[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_sick'))]'im kül rengi bir yüzle titriyordu; teni soğuktu. "

 lmf_feast.1018.desc.end:0 "[family_sick.GetHerHim]'i derhal götürmeleri için hizmetkârları çağırdım ve hastalığın yayılma ihtimaline karşı herkesi gönderdim.\n\nAkşamın sonunda bu ani hastalığın ne kadar ciddi olduğunu hâlâ tam olarak bilmiyoruz."

 lmf_feast.1018.a:0 "Umarım [family_sick.GetSheHe] çabucak iyileşir!"

 lmf_feast.1019.t:0 "Aile Şöleni: Her Şey Yolunda"

 lmf_feast.1019.desc.opening:0 "Ailem [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki büyük salonda toplandı,"

 lmf_feast.1019.desc.atwar:0 "bir akşamlığına savaş cephesinden gelen haberleri görmezden gelip ziyafet çekerken.\n\n"

 lmf_feast.1019.desc.nowar:0 "ziyafet çekerken diyarın görece huzurunun tadını çıkarıyorduk.\n\n"

 lmf_feast.1019.desc.end:0 "[ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family'))|U] [dinner_pos_family.Custom('dinner_activity_pos_past')].\n\nBu arada [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_neg_family'))] [dinner_neg_family.Custom('dinner_activity_neg_past')].\n\nYine de güzeldi. Hepimiz bir aradaydık ve en önemlisi buydu."

 lmf_feast.1019.a:0 "[ROOT.Char.GetFaith.FertilityGodName] hepimizi kutsasın."

 lmf_feast.1019.b:0 "Böyle bir huzur elbette kalıcı olamaz..."

 lmf_feast.1019.c:0 "Böyle anlar çok nadir hale geldi."

 lmf_feast.1019.d:0 "Doğrusu ayakta zor duruyordum..."

 lmf_feast.1019.e:0 "Savaş alanına dönmeyi ne kadar çok özlüyorum."

 lmf_feast.1019.f:0 "Onların bitmek bilmeyen gevezeliğine zar zor katlanabiliyorum."

 lmf_feast.1019.g:0 "Doğrusu, yalnız başıma bir yerlerde olmayı tercih ederim."

 lmf_feast.1019.h:0 "Öyle mi? Ben daha çok yemekle ilgileniyordum."

 lmf_feast.1019.i:0 "Öyle mi? Ben daha çok içkiyle ilgileniyordum."

 lmf_feast.1019.j:0 "Hatırlayacağımız anlar bunlar."

 lmf_feast.1020.t:0 "Aile Şöleni: Umut"

 lmf_feast.1020.desc.start:0 "Bu geceki aile şöleni canlıydı; ama doğrusu, ben pek fark etmedim.\n\nBen de ailenin çoğu gibi, karıma ve kabaran karnına büyük ilgi gösterdim. [family_spouse.GetFirstNameNoTooltip] büyük salona geç geldi; solgundu ve bitkindi. Hakkını vermek gerekirse, neredeyse hiç şikâyet etmedi ve halini hatırını sormaya gelen her iyi niyetli aile üyesine gülümsemeye çalıştı. Akşam sona ererken gözlerimiz buluştu... ve orada gerçek bir şefkat vardı.\n\n"

 lmf_feast.1020.desc.resolution:0 ""Things have not been well between us, husband," she said. "If there is to be any hope for this child, I wonder if the time hasn't come to put our differences aside?" [family_spouse.GetFirstNameNoTooltip] didn't wait for an answer. She merely sighed heavily and asked attendants to take her back to her bedchamber, leaving me to wonder: is she right?"

 lmf_feast.1020.desc.love:0 ""I adore you so, my husband," she said suddenly, unprompted. "I had no idea what to expect when we married, but I am so glad that we did." I barely had time to smile in response when she waved her attendants over to return her to her bedchamber, leaving me to bask in the warm glow of her love."

 lmf_feast.1020.desc.possibility:0 ""I had no idea what to expect when we married," she said suddenly. "I thought perhaps ours would be a cold marriage, one in name only. But now I wonder differently. Is there hope for you and I, husband?" [family_spouse.GetFirstNameNoTooltip] didn't wait for an answer. She merely sighed heavily and asked attendants to take her back to her bedchamber, leaving me to wonder at the answer to her question."

 lmf_feast.1020.desc.fallback:0 ""I hope the child pleases you, husband," she said. When I responded that it surely would, [family_spouse.GetFirstNameNoTooltip] beamed with pride. "Then I am glad." Sighing heavily, she called her attendants to take her back to her bedchamber, and I watched her go with a smile on my lips."

 lmf_feast.1020.a:0 "Çocuğun iyiliği için, evet. Buna son vermenin zamanı geldi."

 lmf_feast.1020.b:0 "İşte [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_spouse'))]'im gidiyor."

 lmf_feast.1020.c:0 "Evet, bizim için umut olduğunu düşünüyorum."

 lmf_feast.1020.d:0 "Sanırım çocuk doğunca eski haline dönecek."

 lmf_feast.1020.e:0 "Hayır, henüz bırakmaya hazır değilim."

 lmf_feast.1020.f:0 "Son zamanlarda çok duygusal. Bunu görmezden geleceğim."

 lmf_feast.1021.t:0 "Aile Şöleni: Dostluk"

 lmf_feast.1021.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki büyük salondaki bu geceki aile toplantısı bir kez olsun sessizdi.\n\nBana [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_friend'))] ile hasret giderme fırsatı verdi. Akşam ilerledikçe ailenin giderek daha çoğu çekildi; doğrusu biz zar zor fark ettik. Birbirimizi hikâyelerle eğlendirdik. [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] için planlarımdan bahsettim; [family_friend.GetSheHe] can kulağıyla dinledi. [family_friend.GetSheHe|U] bana şunları anlattı: "

 lmf_feast.1021.desc.spouse:0 "[family_friend.GetSheHe]'in [family_friend.GetHerHis] evliliğinde yaşadığı çeşitli sorunlar. "

 lmf_feast.1021.desc.ruler:0 "[family_friend.GetSheHe]'in [family_friend.GetPrimaryTitle.GetNameNoTierNoTooltip]'e hükmederken karşılaştığı küçük imtihanlar. "

 lmf_feast.1021.desc.court:0 "[family_friend.GetSheHe]'in benim [family_friend.Custom('GetCouncilOrCourtPosition')] olarak karşılaştığı küçük meseleler. "

 lmf_feast.1021.desc.courtier:0 "[ROOT.Char.Custom('FortifiedBuilding')]'deki çeşitli olup bitenler, nadiren duyduğum küçük şeyler. "

 lmf_feast.1021.desc.end:0 "Başımı sallayıp [family_friend.GetHerHis] endişelerini anlıyormuş gibi yaptım.\n\nDurduğumuzda ikimiz de herkesin gittiğini ve havanın karardığını fark ettik. [family_friend.GetFirstNameNoTooltip] güldü ve zamanımın çoğunu tekeline aldığı için özür diledi... ama doğrusu, böyle bir zamanı bir dostla geçirmek iyi hissettiriyordu."

 lmf_feast.1021.a:0 "Sadık [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_friend'))]'ime!"

 lmf_feast.1022.t:0 "Aile Şöleni: Rekabet"

 lmf_feast.1022.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bu geceki şölen yeterince keyifli olurdu, sanırım. [family_rival.GetFirstNamePossessiveNoTooltip] varlığı olmasa. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_rival'))]'imin bu akşam yemeklerine katılmaya neden devam ettiği anlayışımın ötesinde. Bana inat, sanırım.\n\nBunun en belirgin olduğu an bu geceydi; [family_rival.GetFirstNameNoTooltip] bana, [family_rival.GetHerHis] yorumlarını zar zor duyabileceğim kadar uzakta oturdu; [family_rival.GetSheHe]'in yanında oturanlara söylediği, kimseyi hedef almıyormuş gibi gizlenmiş ama açıkça doğrudan bana yönelik sivri laflardı. [family_rival.GetFirstNameNoTooltip] içtikçe akşam boyunca hem sesleri hem asitliği giderek arttı; benim yapabildiğim tek şey dişlerimi sıkıp görmezden gelmekti.\n\nSonunda, yeterince çektiğimde ayağa kalktım ve [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_rival'))]'ime masadan kalkmasını emrettim; [family_rival.GetSheHe] öyle masum ve gücenmiş edalar takındı ki dayanılmazdı. Ben de dönüp salondan çıktım; köpürüyordum ve doğrusu [family_rival.GetHerHim]'i sarayımdan büsbütün yasaklamayı düşünüyordum."

 lmf_feast.1022.a:0 "[family_rival.GetSheHe]'in ailesi olması iyi bir şey..."

 lmf_feast.1023.t:0 "Aile Şöleni: [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('dead_relative'))|U]"

 lmf_feast.1023.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bu akşamki toplantı sessiz ve çoğunlukla olaysızdı. Seçebildiğim hiçbir neden olmadan, sohbetin konusu yıllar önce ölüp giden [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('dead_relative'))]'ime döndü.\n\nAile [dead_relative.GetHerHim]'den kısık fısıltılarla bahsetti; kimi zaman keyifli kıkırdamalarla, kimi zaman acılıkla; ta ki sonunda [family_toaster.GetFirstNameNoTooltip] ayağa kalkıp herkesin dikkatini isteyene dek.\n\n"Let us all raise a glass in the memory of [dead_relative.GetTitledFirstName]," my [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_toaster'))] called to those assembled in the great hall.\n\n"[dead_relative.GetSheHe|U] ruled well over the [dead_relative.GetPrimaryTitle.GetNameNoTooltip] while [dead_relative.GetSheHe] lived and resides now in [dead_relative.GetFaith.PositiveAfterLife], but the memory of [dead_relative.GetHerHim] will remain with us always. May [dead_relative.GetFaith.DeathDeityName] watch over [dead_relative.GetHerHim] for all eternity!""

 lmf_feast.1023.a:0 "Bravo, bravo!"

 lmf_feast.1024.t:0 "Aile Şöleni: Yerine Ait Olmayan"

 lmf_feast.1024.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki aile şöleni bu gece hareketliydi; gürültülü, şamatacı ve neşeyle doluydu.\n\nGenç [family_hostage.GetTitledFirstNameNoTooltip] dışında herkes, görünüşe göre. [family_hostage.Custom('GetLassLad')]'in masanın en ucunda yalnız oturduğunu, başını öne eğmiş ve belirgin biçimde rahatsız göründüğünü fark ettim.\n\nZor olmalı, diye düşündüm;"

 lmf_feast.1024.desc.language.none:0 "[ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] konuşmuyor; şölende [family_hostage.GetCulture.GetLanguage.GetNameNoTooltip] konuşan tek bir kişi bile yok.\n\n"

 lmf_feast.1024.desc.language.one:0 "[ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] konuşmuyor; şölende [ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_hostage_common'))] dışında [family_hostage.GetCulture.GetLanguage.GetNameNoTooltip] konuşan kimse de yok.\n\n"

 lmf_feast.1024.desc.religion.none:0 "şölende [family_hostage.GetFaith.GetNameNoTooltip]'e inanan tek kişi olmak; kimsenin geleneklerine uymaması, hatta muhtemelen ne olduklarını bile bilmemesi.\n\n"

 lmf_feast.1024.desc.religion.one:0 "şölende [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_hostage_common'))] dışında [family_hostage.GetFaith.GetNameNoTooltip]'e inanan tek kişi olmak ve kimsenin geleneklerine uymaması.\n\n"

 lmf_feast.1024.desc.culture.none:0 "[family_hostage.GetCulture.GetNameNoTooltip] olmak ve şölende [family_hostage.GetCulture.GetNameNoTooltip] geleneklerini bilen ya da umursayan tek bir ruhun bile olmaması.\n\n"

 lmf_feast.1024.desc.culture.one:0 "[family_hostage.GetCulture.GetNameNoTooltip] olmak ve [family_hostage.GetCulture.GetNameNoTooltip] geleneklerini bilip umursayacak yalnızca [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_hostage_common'))]'in olması.\n\n"

 lmf_feast.1024.desc.end:0 "Doğrusu o an [family_hostage.GetHerHim] için üzüldüm. Belki bir şeyler yapılması gerekiyordu?"

 lmf_feast.1024.a:0 "[family_hostage.GetHerHim]'i evinde hissettirmek için elimden geleni yapacağım."

 lmf_feast.1024.b:0 "Ben [family_hostage.GetHerHis] [ROOT.Char.GetMotherFather]'i değilim. [family_hostage.GetSheHe|U] [family_hostage.GetHerselfHimself]'inin başının çaresine bakabilir."

 lmf_feast.1025.t:0 "Aile Şöleni: Vesayetimdeki Çocuk"

 lmf_feast.1025.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bu geceki şölen oldukça sıkıcı bir etkinlikti ve koltuğumda uyuklamak üzereydim ki çok uzakta olmayan genç [family_ward.GetFirstNameNoTooltip]'in bir sohbete can kulağıyla kulak verdiğini fark ettim; "

 lmf_feast.1025.desc.relation:0 "[family_ward.GetHerHis] [family_ward.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_example'))] "

 lmf_feast.1025.desc.norelation:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_example'))]'im "

 lmf_feast.1025.desc.mid:0 "başka biriyle yapıyordu.\n\nSonunda, merakım kabarınca yanlarına gidip [family_ward.Custom('GetLassLad')]'e [family_ward.GetHerHim]'i bu kadar büyüleyen şeyin ne olduğunu sordum. Görünüşe göre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_example'))] şunları yapıyormuş: "

 lmf_feast.1025.desc.diplomacy:0 "yabancı bir krallığı ilgilendiren oldukça hassas bir diplomatik meseleyi tartışarak; yeterince karmaşık bir meseleydi "

 lmf_feast.1025.desc.intrigue:0 "sessizce entrika meselelerini tartışarak; ilgili ahlâkı yeterince karmaşıktı "

 lmf_feast.1025.desc.martial:0 "başka bir krallıktaki yakın tarihli bir savaştan bahsediyordu; ilgili stratejiler yeterince karmaşıktı "

 lmf_feast.1025.desc.learning:0 "ileri felsefe meselesi üzerine nutuk çekerek; yeterince karmaşık bir konuydu "

 lmf_feast.1025.desc.stewardship:0 "sarayımın yakın zamanda ele aldığı bir adalet meselesini açıklayarak; ayrıntıları yeterince karmaşıktı "

 lmf_feast.1025.desc.end:0 "[family_ward.GetFirstNameNoTooltip]'i büsbütün şaşkına çevirmişti.\n\nBana dönüp [family_ward.GetSheHe] bir açıklama talep etti. Belki şaşırtıcı değil; zira [family_ward.GetSheHe] gerçekten de benim vesayetimdeki çocuk ve sorumluluğum."

 lmf_feast.1025.a:0 "Şey, görüyorsun, mesele şöyle..."

 lmf_feast.1025.a.success:0 "[family_ward.GetFirstNameNoTooltip] anlıyor ve [family_ward.GetHerHis] [education_focus|E] ilerliyor."

 lmf_feast.1025.a.success.tt:0 "[family_ward.GetFirstNameNoTooltip] anlıyor"

 lmf_feast.1025.a.success2.tt:0 "[family_ward.GetHerHis|U] [education_focus|E] ilerliyor."

