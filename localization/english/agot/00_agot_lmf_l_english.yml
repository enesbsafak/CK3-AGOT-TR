 lmf_feast.1026.t:0 "Aile Şöleni: Dua Vakti"

 lmf_feast.1026.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki bu geceki şölen oldukça sıkıcı bir etkinlikti; [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('family_religious'))]'in dindarlık ve erdemin önemi üzerine ailenin geri kalanına uzun bir vaaz vermek için bu akşamın iyi bir akşam olduğuna karar vermesi de işi hiç kolaylaştırmadı.\n\n"

 lmf_feast.1026.desc.zealous:0 "Can kulağıyla dinledim,"

 lmf_feast.1026.desc.cynical:0 "Gözlerimi fazla sık devirmemek için elimden geleni yaptım;"

 lmf_feast.1026.desc.nozeal:0 "Bir süre, esneme dürtümü bastırarak dinledim,"

 lmf_feast.1026.desc.impatient:0 "ama itiraf edeyim ki bu, kısıtlı sabrım için katlanması güç bir şeydi.\n\n"

 lmf_feast.1026.desc.patient:0 "ve neyse ki sabrım, odadaki çoğu kişinin çoktan kadehlerine dönmeyi tercih edeceği noktanın çok ötesine dayanmamı sağladı.\n\n"

 lmf_feast.1026.desc.family:0 "odadaki çoğu kişi kadehlerine hasretle bakıp kafa sallamaya başlamışken bile.\n\n"

 lmf_feast.1026.desc.loved:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_religious'))] ailenin en az bir üyesini kazanmıştı:"

 lmf_feast.1026.desc.relation:0 "[family_religious.GetHerHis] [family_religious.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_react'))], [family_react.GetTitledFirstNameNoTooltip],"

 lmf_feast.1026.desc.norelation:0 "[ROOT.Char.Custom2('my_relation_by_name_no_comma', SCOPE.sC('family_react'))],"

 lmf_feast.1026.desc.loved2:0 "memnun görünüyordu ve [family_religious.GetFirstNameNoTooltip]'i, [family_religious.GetSheHe]'in başka türlü çoktan bırakacağı noktanın çok ötesinde tezahüratla destekledi.\n\nAkşamın sonunda, ailenin çoğu çoktan sessizce çekilmişken, ikisi salonun öbür ucunda kendilerini kaptırmış bir dini tartışma içinde görülebiliyordu."

 lmf_feast.1026.desc.hated:0 "Topluluktaki en az bir kişi bu eğlenceden özellikle rahatsız oldu: "

 lmf_feast.1026.desc.hated2:0 "[family_react.GetHerHis] dişlerini bir saatten fazla gıcırdattı; ta ki sonunda alay edip neredeyse her fırsatta [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_religious'))]'i bölene dek.\n\nVaaz sonunda, odadakilerin çoğunun rahatına, bittiğinde, ikisi odanın uzak köşesinde dini meseleler üzerine bitmek bilmeyen bir tartışmaya girmiş halde görülebiliyordu. İçimde, bunun ikisi tarafından da uzun süre hatırlanacağına dair bir his var."

 lmf_feast.1026.desc.default:0 "Bir süre uzayıp gitti; ta ki ailenin çoğu sessizce büyük salondan çekilene dek. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_religious'))] en sonunda devam edecek enerjisi tükenince, ben bile [family_religious.GetHerHis] dayanıklılığını alkışlamak zorunda kaldım. Gerçekten de kayda değer bir tahammüle sahip bir [family_religious.GetFaith.GetAdherentNameNoTooltip]!"

 lmf_feast.1026.a:0 "Doğrusu vaazlarımı [ROOT.Char.GetFaith.HouseOfWorship|l]'de tercih ederim."

 loved_family_feast_sermon:0 "[CHARACTER.GetShortUIName|U], bir aile şöleninde [TARGET_CHARACTER.GetShortUINamePossessive] vaazını beğendi."

 loved_family_feast_sermon_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], bir aile şöleninde [CHARACTER.GetShortUINamePossessive] vaazını beğendi."

 hated_family_feast_sermon:0 "[CHARACTER.GetShortUIName|U], bir aile şöleninde [TARGET_CHARACTER.GetShortUINamePossessive] vaazına kötü tepki verdi."

 hated_family_feast_sermon_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], bir aile şöleninde [CHARACTER.GetShortUINamePossessive] vaazına kötü tepki verdi."

 lmf_feast.1027.t:0 "Aile Şöleni: Eğlence"

 lmf_feast.1027.desc.start:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_entertainer'))] bu akşamki aile şöleninde gerçekten kendini aştı.\n\nAkşamın çoğu sakindi, ta ki [family_entertainer.GetSheHe] bunun olmayacağına karar verene dek... [family_entertainer.GetSheHe] masalardan birinin üzerine atlayıp "

 lmf_feast.1027.desc.poet:0 "Bize destansı bir [family_entertainer.GetCulture.GetNameNoTooltip] şiiriyle şölen verdi.\n\nBu sıradan bir dize takımı değildi, hayır. Bu, kahramanlık efsanesiyle ilgili bir destandı ve [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_entertainer'))]'im onu ustalıkla anlattı. [family_entertainer.GetSheHe|U] tam doğru anlarda dramatik duraklamalar yaptı ve her role ayrı ayrı hayat verdi. Canavar başını kaldırdığında [family_entertainer.GetSheHe] [family_entertainer.GetHerHis] ellerini havaya kaldırıp kükredi; çocuklar hem korku hem keyifle ciyakladı.\n\n"

 lmf_feast.1027.desc.bard:0 "şarkılarla bize eğlenceye başladı.\n\nO gece [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_entertainer'))]'imin içine hangi ruh girdi bilmiyorum; ama [family_entertainer.GetSheHe]'in çıkardığı müzik ustalıktan başka bir şey değildi. Her nota kusursuz, her dize özenle seçilmiş ve tam isabetle söyleniyordu. Bir şarkının sonuna geldiğini sandığımız anda [family_entertainer.GetFirstNameNoTooltip] kusursuzca diğerine geçiyordu.\n\n"

 lmf_feast.1027.desc.end:0 "Bunun ailede iyi karşılandığını söylemek hafif kalır. Sonunda yarısımız gözyaşları içindeydi; [family_entertainer.GetFirstNameNoTooltip] son reveransını yapıp masadan ayrıldığında, toplanan herkesin gök gürültüsü gibi alkışlarıyla uğurlandı.\n\nBunu kolay kolay unutmayacağız, eminim."

 lmf_feast.1027.a:0 "Ne harika bir akşam!"

 lmf_feast.1028.t:0 "Aile Şöleni: Sohbet"

 lmf_feast.1028.desc.start:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'deki aile şöleninde güzel bir geceydi.\n\nBaşlangıç olarak, [ROOT.Char.Custom2('my_relation_by_name', SCOPE.sC('dinner_pos_family'))] [dinner_pos_family.Custom('dinner_activity_pos_past')].\n\nSonra [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('family_expert'))] ile kolay bir sohbete daldım; kendisi "

 lmf_feast.1028.desc.diplomat:0 "diplomasi meseleleri ve [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'in komşularıyla fırsatları hakkında uzun uzun konuştu. [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im, tarih boyunca hiç duymadığım, her biri bir öncekinden daha etkileyici birkaç diplomatik başarısızlık hikâyesi bile anlattı.\n\n"

 lmf_feast.1028.desc.family_first:0 "aile hakkında uzun uzun konuştu... normalde ilgimi çekmeyecek bir konu; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im ailelerin birbirleriyle nasıl daha iyi geçinebileceğine dair büyüleyici bir kavrayışa sahipti. [family_expert.GetSheHe]'in bahsettiği fikirlerin benzerini daha önce hiç duymamıştım.\n\n"

 lmf_feast.1028.desc.august:0 "hükümdarlık hakkında, hüküm süren bir [ROOT.Char.GetLadyLord] ile [ROOT.Char.GetHerHis] vassalları arasındaki ilişki ve iki taraf arasında nasıl daha iyi bir anlayış kurulabileceği hakkında uzun uzun konuştu. Gerçekten büyüleyiciydi; [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'imin bu kavrayışa sahip olduğunu bile bilmezdim.\n\n"

 lmf_feast.1028.desc.strategist:0 "bir dizi tarihî savaş hakkında hikâyeler anlattı: komutanların yaptığı hatalar, savaşın gidişatını değiştiren dahiyane son dakika kurtarışları, her şeyin çoğu zaman hangi tarafın daha iyi iaşe yollarına sahip olduğuna nasıl indiği. Bu hikâyeleri daha önce duyduğumu sanıyorum; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'imin hepsini öyle yeni ve anlamlı görünen bir dille anlatma yolu var.\n\n"

 lmf_feast.1028.desc.overseer:0 "ordu iaşesinin sıradan meseleleri hakkında uzun uzun konuştu... normalde beni ağlatacak kadar sıkıcı bir konu; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im onu büyüleyici göstermenin bir yolunu buluyor. Ah, en güçlü ordunun bile günlük ekmeğin yokluğuyla nasıl çökertilebileceğini bir düşünün! İaşe zincirleri hakkında konuşurken bu kadar güleceğim kimin aklına gelirdi?\n\n"

 lmf_feast.1028.desc.gallant:0 "aşk ve şövalyelikten bahsetti; normalde oldukça sıkıcı, hatta yapay bulduğum konular; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im hepsini efsane malzemesi gibi göstermenin bir yolunu buluyordu. [family_expert.GetSheHe] bunlardan bahsederken [family_expert.GetHerHis] gözlerinin parlaması, konuları bir şekilde inanılmaz derecede anlamlı gösteriyordu.\n\n"

 lmf_feast.1028.desc.architect:0 "mimarlık hakkında uzun uzun konuştu... normalde pek ilgimi çekmeyecek bir konu, kesinlikle; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im hepsini çok önemli ve büyüleyici göstermenin bir yolunu buluyordu. Bir [ROOT.Char.GetFaith.HouseOfWorship] inşa etmenin ne kadar emek gerektirdiğini bilmezdim! Ya da basit bir taş sütunun önemini!\n\n"

 lmf_feast.1028.desc.administrator:0 "diyar yönetimi meseleleri hakkında konuştu... normalde beni ağlatacak kadar sıkıcı bir konu; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im her nasılsa her sıradan meseleyi destansı sonuçları olan bir hikâyeye dönüştürmenin bir yolunu buluyordu! [family_expert.GetHerHis|U] nadiren düşündüğüm şeylere dair kavrayışı neredeyse tuhaf hissettiriyordu; [family_expert.GetHerHis] bana önerileri de hep özenle düşünülmüştü.\n\n"

 lmf_feast.1028.desc.avaricious:0 "çoğunlukla [family_expert.GetHerHis] para sevgisinden ve para kazanmanın çeşitli yollarından bahsetti... normalde biraz iğrenç bulabileceğim bir konu; yine de [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im sonsuz biçimde büyüleyici görünen hikâyelerle doluydu. Kâr etmenin her yolu ahlaktan yoksun olmak zorunda değil, dedi [family_expert.GetSheHe]; ve nitekim [family_expert.GetHerHis] iddiasını destekleyecek bir sürü hikâyesi vardı.\n\n"

 lmf_feast.1028.desc.schemer:0 "[family_expert.GetSheHe]'in içine daldığı çeşitli entrikalar hakkında uzun uzun konuştu. Çeşitli noktalarda geri dönmek istedim; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im her nasılsa ilgimi canlı tutmayı başardı. Her hikâye, [family_expert.GetHerHis] entrika bilgisinin ne kadar derin olduğunu anlatıyordu ve dönemeçlerin sonu yoktu! [family_expert.GetHerHis] zihninin bu kadar şeytanca zekice olduğunu bilmiyordum.\n\n"

 lmf_feast.1028.desc.seducer:0 "çoğunlukla [family_expert.GetHerHis] çeşitli cinsel fetihlerinden bahsetti; normalde pek ilgimi çekmeyecek bir konu; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im, [family_expert.GetSheHe]'in normalde [family_expert.GetHerselfHimself]'ine saklayacağı konularda dilinin çözülmesine yetecek kadar sarhoştu. Birbirini izleyen şaibeli hikâyeler, zar zor inanabildiğim skandal ayrıntılarla dolu olarak dikkatimi esir aldı.\n\n"

 lmf_feast.1028.desc.torturer:0 "çoğunlukla işkencenin faydasından bahsetti. İlk başta tiksinmiştim; ta ki [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'imin, [family_expert.GetSheHe]'in normalde [family_expert.GetHerselfHimself]'ine saklayacağı konularda dilinin çözülmesine yetecek kadar sarhoş olduğunu fark edene dek. Ayrıntılar, daha önce hiç duymadığım yöntemleri açığa vurdukları kadar şok ediciydi; ve bir şekilde kendimi koparamıyordum.\n\n"

 lmf_feast.1028.desc.whole_of_body:0 "insan bedeni ve hastalık ile çeşitli sıvılar gibi şeylerin doğası hakkında uzun uzun konuştu... normalde biraz kuru bir konu; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im hepsini bir şekilde çok ilginç kılmanın bir yolunu buluyor. [family_expert.GetSheHe|U] çok azimli görünüyordu, hep daha fazlasını bilmek istiyordu; bu da bende aynı hissi uyandırdı.\n\n"

 lmf_feast.1028.desc.scholar:0 "çoğunlukla akademik meseleler hakkında konuştu; ama bu kadar bilgili birinden beklenebilecek kuru felsefe ve tarih aktarımları yerine, [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'im her problemi büyüleyici bir bulmacaya dönüştürdü. "We know so little of [family_expert.GetFaith.CreatorNamePossessive] creation," [family_expert.GetSheHe] said, shaking [family_expert.GetHerHis] head sadly.\n\n"

 lmf_feast.1028.desc.theologian:0 "çoğunlukla ilahiyat meseleleri hakkında konuştu... bir şölen için kuru bir konu; ama [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_expert'))]'imin, [family_expert.GetSheHe]'in normalde [family_expert.GetHerselfHimself]'ine sakladığı konularda dilinin çözülmesine yetecek kadar sarhoş olduğunu fark ettim. [family_expert.GetSheHe]'in [ROOT.Char.GetFaith.CreatorName] ve yaratılış hakkında, [ROOT.Char.GetFaith.GetNameNoTooltip] ve insanlığın rolü hakkında söyledikleri... Doğrusu bunların hiçbirini bu şekilde ifade edildiğini duymamıştım!\n\n"

 lmf_feast.1028.desc.end:0 "Çoğunlukla dinleyenin ben olduğumu söylemek hafif kalır. Neredeyse herkes çekilene dek [family_expert.GetHerHis] her sözüne asılarak oturdum. En sonunda etrafımıza bakıp bunu fark ettiğimizde [family_expert.GetSheHe], akşam boyunca beni tekeline aldığı için hararetle özür diledi; ama ben [family_expert.GetHerHis] endişesini geçiştirdim. Doğrusu, çok şey öğrenmiştim."

 lmf_feast.1028.a:0 "Ne öğretici bir akşam!"

 good_family_feast_conversation:0 "[CHARACTER.GetShortUIName|U], bir aile şöleninde uzun bir akşam boyunca [TARGET_CHARACTER.GetShortUIName] ile sohbet ederken çok şey öğrendi."

