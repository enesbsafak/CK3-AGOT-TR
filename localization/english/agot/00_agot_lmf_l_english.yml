 lmf_heir.2050.t:0 "Varisimin [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))|U] Arzusu"

 lmf_heir.2050.start:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir'))] uzunca bir süre tereddüt etti, belki de önerdiğimi tam anlayamadı — ya da inanamadı. "You are allowing me," [heir.GetSheHe] repeated back carefully, "to marry... whomever I wish?"\n\nI told [heir.GetHerHim] that was so, at least for now, and then [heir.GetSheHe] took a deep breath. "Then you should know, there #EMP is #! a [heir_lover.GetWomanMan] who I love, and who I wish to marry."\n\n"

 lmf_heir.2050.knows:0 "İç çektim; [heir.GetSheHe]'in kimi kastettiğinin gayet farkındaydım. "You're referring to [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_lover'))]."\n\n"

 lmf_heir.2050.secret:0 "Bu beni şaşırttı. "You... have a lover?"\n\n"

 lmf_heir.2050.soulmate:0 "[heir.GetFirstNameNoTooltip] utanmış görünmemeye çalışarak başını salladı. "[heir_lover.GetTitledFirstName] and I are soulmates. We're meant to be together, I know it. "

 lmf_heir.2050.lover:0 "[heir.GetFirstNameNoTooltip] utanmış görünmemeye çalışarak başını salladı. "What [heir_lover.GetTitledFirstName] and I have is real love, I know it is. "

 lmf_heir.2050.end:0 "Seçimimin bir anlamı varsa, kendim için seçeceğim biri varsa," here [heir.GetSheHe] looked up at me, perhaps wondering if I would take back my offer after all, "it would be [heir_lover.GetHerHim].""

 lmf_heir.2050.a:0 "Hayır, [heir_lover.GetSheHe] uygun değil. Buna derhal son vermelisin."

 lmf_heir.2050.b:0 "Pekâlâ, hayırduam seninle."

 lmf_heir.2050.c:0 "Öyleyse! [heir_lover.GetHerHis] hükümdarına gidip [heir_lover.GetLiege.GetTitledFirstNameNoTooltip]'in razı olup olmadığına bakalım."

 lmf_heir.2050.c.tt:0 "[heir_lover.GetLiege.GetShortUINameNoFormat|U]'e evlilik teklifiyle gidilecek"

 lmf_heir.2050.d:0 "Öyleyse! Bakalım [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_lover'))] seninle aynı şeyleri hissediyor mu."

 lmf_heir.2050.d.tt:0 "[heir_lover.GetShortUINameNoFormat|U]'e evlilik teklifiyle gidilecek"

 lmf_heir.2050.matrilineal.tt:0 "Önerilen evlilik #X anasoylu#! olacak"

 lmf_heir.2050.patrilineal.tt:0 "Önerilen evlilik #X babasoylu#! olacak"

 lmf_heir.2051.t:0 "Varisimin [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))|U] Arzusu"

 lmf_heir.2051.start:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir'))] uzunca bir süre tereddüt etti, belki de önerdiğimi tam anlayamadı — ya da inanamadı. "You are allowing me," [heir.GetSheHe] repeated back carefully, "to marry... whomever I wish?"\n\nI told [heir.GetHerHim] that was so. [heir.GetSheHe|U] took an even deeper breath "

 lmf_heir.2051.knows:0 "ve sonra zaten bildiğim şeyi açıkladı: [heir.GetSheHe] âşık. Ne yazık ki,"

 lmf_heir.2051.secret:0 "ve sonra [heir.GetHerHis] sırrını ve [heir.GetHerHis] tereddütünün kaynağını açıkladı: [heir.GetSheHe] âşık. Ne yazık ki,"

 lmf_heir.2051.desc.samesex:0 "[heir.GetHerHis] gönlünün nesnesi de bir [heir_lover.GetWomanMan]. Oldukça tuhaf bir durum.\n\n"

 lmf_heir.2051.desc.order:0 "[heir.GetHerHis] gönlünün nesnesi, dini bir tarikata yemin etmiş biri çıkıyor. [heir_lover.GetSheHe|U], [heir_lover.GetHerHis] yeminlerine sadık kaldığı sürece evlenemez.\n\n"

 lmf_heir.2051.desc.married:0 "[heir.GetHerHis] gönlünün nesnesi zaten evli çıkıyor. Eski bir hikâye, utanç verici olsa da.\n\n"

 lmf_heir.2051.desc.betrothed:0 "[heir.GetHerHis] gönlünün nesnesi, henüz evlenmemiş olsa da başkasıyla nişanlı. O nişan sürdüğü sürece [heir_lover.GetSheHe|U], [heir.GetHerHim] ile evlenemez.\n\n"

 lmf_heir.2051.desc.permission.lover.man:0 "[heir.GetHerHis] sevgilisine evlenme iznini daha önce vermediğim için, adam artık [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'imin elini düzgünce istemeye açıkça isteksiz.\n\n"

 lmf_heir.2051.desc.permission.lover.woman:0 "[heir.GetHerHis] sevgilisine evlenme iznini daha önce vermediğim için, [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'im bu reddin kendisi için de geçerli olduğunu açıkça düşünüyor.\n\n"

 lmf_heir.2051.desc.permission.both:0 "evlenmelerine daha önceki izin vermeyişim, artık gizlice devam etmeyi planladıkları anlamına geliyor. Sürdürülürse oldukça tuhaf bir durum.\n\n"

 lmf_heir.2051.desc.permission.heir.man:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'im, önceki reddim göz önüne alındığında, [heir_lover.GetHerHim] ile evlenmek için izin istemeye açıkça gönülsüz.\n\n"

 lmf_heir.2051.desc.permission.heir.woman:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'imin elini isteme teklifini zaten reddetmiş olduğum için, adamın [ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'imle evlenmek için izin istemeye gönülsüz olduğu açık.\n\n"

 lmf_heir.2051.desc.generic:0 "İkisinin evlenmesi imkânsız. Bu yüzden gizlice devam ediyorlar ve [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))]'im, [heir.GetSheHe]'in sevdiği bu [heir_lover.GetWomanMan]'den daha büyük bir görevi olduğunu düşünebilecek kadar aklı başında değil.\n\n"

 lmf_heir.2051.desc.end.canact:0 "Belki yine de evlenmelerini sağlamalıyım. Ya da [heir.GetHerHim]'e bu umutsuz duruma son vermesini söylemeliyim. Her iki durumda da, bir şeyler yapılmalı."

 lmf_heir.2051.desc.end:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('heir'))]'imin gönül işine karışabilirim, ama [heir.GetSheHe]'in bunun için bana teşekkür edeceğinden şüpheliyim."

 lmf_heir.2051.a:0 "[heir.GetFirstNameNoTooltip] buna son verip uygun bir [heir.Custom('WifeHusbandOpp')] bulmalı."

 lmf_heir.2051.b:0 "Onlara fikrimi değiştirdiğimi söyleyeceğim."

 lmf_heir.2051.c:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_lover'))], [heir_lover.GetHerHis] yeminlerinden vazgeçip [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))] ile evlenmek zorunda."

 lmf_heir.2051.d:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir_lover'))], [heir_lover.GetHerHis] nişanını bozup [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('heir'))] ile evlenmek zorunda."

 lmf_heir.2051.e:0 "[heir.GetHerHis|U] gönül işleri [heir.GetHerHis] bileceği iş. [heir.GetSheHe|U] yine de biriyle #EMP evlenmek zorunda#!..."

 lmf_heir.2051.f:0 "O halde [heir.GetHerHis] geleceğini yeniden kendi ellerime alma zamanı."

 lmf_heir.2052.t:0 "Başlamaya Hevesli"

 lmf_heir.2052.t.notwant:0 "Başlamakta İsteksiz"

 lmf_heir.2052.desc.start:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir'))] uzunca bir süre tereddüt etti, belki de önerdiğimi tam anlayamadı — ya da inanamadı. "You are allowing me," [heir.GetSheHe] repeated back carefully, "to marry... whomever I wish?"\n\n[heir.GetSheHe|U] seemed pleased with that, nodded, and left. I assumed that was the last I would hear of the topic until [heir.GetSheHe] was ready, but [heir.GetSheHe] returned later that evening with "

 lmf_heir.2052.desc.start.notwant:0 "Peki ya evlenmek #EMP istemiyorsam#!, [heir.Custom2('spoken_address_by_familiarity', ROOT.Char )|U]?" [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir'))] finally asked following my proposal.\n\n"You must be married eventually," I replied. "Whether by your choice or mine. I am allowing it to be yours... for now."\n\n[heir.GetSheHe|U] seemed content with that and left. I assumed it was the last I'd hear of the topic until I pressed the matter further, but [heir.GetSheHe] returned later that evening with "

 lmf_heir.2052.desc.one:0 "[secondary_actor.GetSheHe]'in ilgilenebileceği bir [suitor_1.Custom('WomanManGirlBoy')] adı "

 lmf_heir.2052.desc.two:0 "[secondary_actor.GetSheHe]'in ilgilenebileceği iki [suitor_1.Custom('WomenMenGirlsBoys')] adı "

 lmf_heir.2052.desc.three:0 "[secondary_actor.GetSheHe]'in ilgilendiği birkaç [suitor_1.Custom('WomenMenGirlsBoys')] listesi "

 lmf_heir.2052.desc.matrilineal:0 "matrilineal evlenerek.\n\n"

 lmf_heir.2052.desc.normal:0 "toplantı.\n\n"

 lmf_heir.2052.desc.end:0 "Kabul edersem, [suitor_1.GetHerHim]'i usulüne uygun bir tanışma için buraya, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'e davet etmem gerekecek. Umarım [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('secondary_actor'))]'im bu konuda ciddidir ve zamanımı boşa harcamıyordur."

 lmf_heir.2052.a:0 "[suitor_1.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'i davet edelim."

 lmf_heir.2052.b:0 "[suitor_2.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'i davet edelim."

 lmf_heir.2052.c:0 "[suitor_3.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]'i davet edelim."

 lmf_heir.2052.d:0 "Saçmalık, kendim daha iyisini bulurum."

 lmf_heir.2053.t:0 "Gerçek Su Yüzüne Çıkıyor"

 lmf_heir.2053.desc.ruler:0 ""I can't believe [heir_lover.GetSheHe] said #EMP no #!."\n\n"

 lmf_heir.2053.desc.liege:0 ""I can't believe [heir.Custom2('direct_address_by_familiarity', SCOPE.sC('recipient'))] #EMP refused #!."\n\n"

 lmf_heir.2053.desc.end:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir'))] reddedildiği haberi gelince çalışma odamda boynu bükük oturdu. Şaşırmamıştım; yine de [heir.GetHerHim]'e bunu söylemenin pek teselli olmayacağından şüpheliydim.\n\n"Sometimes," I said slowly, "there's a difference between love and marriage, at least in the world we live in."\n\n[heir.GetSheHe|U] sighed and nodded. "It doesn't matter any more. [heir_lover.GetFirstNameNoTooltip] and I aren't together any longer, not in that way. I'll think about what you said, [heir.Custom2('spoken_address_by_familiarity', ROOT.Char )]."\n\nWith that, [heir.GetSheHe|U] left the study, though I knew I'd hear more from [heir.GetHerHim] in time."

 lmf_heir.2053.a:0 "[heir.GetSheHe|U] zamanla birini bulacak, eminim."

 lmf_heir.2053.b:0 "[heir.GetHerHis] geleceğini yeniden kendi ellerime alma zamanı."

 lmf_heir.2054.t:0 "Başlamakta İsteksiz"

 lmf_heir.2054.desc.start:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('heir'))] uzunca bir süre tereddüt etti, belki de önerdiğimi tam anlayamadı — ya da inanamadı. "You are allowing me," [heir.GetSheHe] repeated back carefully, "to marry... whomever I wish?"\n\nI told [heir.GetHerHim] that was so, at least for now, to which [heir.GetSheHe] nodded... though I noticed [heir.GetSheHe] was still hesitant. "Why? Do you have someone in mind?" I asked.\n\n"

 lmf_heir.2054.desc.lover:0 ""No!" [heir.GetSheHe] blurted out, though I wasn't sure I believed [heir.GetHerHim]. [heir.GetSheHe|U] #EMP did #! have someone in mind, but was unwilling to tell me. At least, for now.\n\n"

 lmf_heir.2054.desc.default:0 ""No," [heir.GetSheHe] replied. "It's more that I wonder if there's anyone who'd wish to marry #EMP me #!." There was some truth to [heir.GetHerHis] concern, I know, but I was confident [heir.GetSheHe] would figure it out, in time.\n\n"

 lmf_heir.2054.desc.end:0 ""I'll think about this more, [heir.Custom2('spoken_address_by_familiarity', ROOT.Char )]." With that, [heir.GetSheHe|U] left the study, and I was left to wonder how long I'd need to wait before I pressed the matter further."

 lmf_heir.2054.a:0 "Öyle olsun."

 lmf_interaction.0001.t:0 "Mirastan Mahrum Bırakma"

 lmf_interaction.0001.opening.submissive:0 "[recipient.GetTitledFirstNameNoTooltip] bu sabah taht odamda benimle konuşmak istedi; saygıyla tek dizinin üzerine çöktü ve sakin ama kararlı sözlerle konuştu.\n\n"

 lmf_interaction.0001.opening.dominant:0 "[recipient.GetTitledFirstNameNoTooltip] bu sabah özel bir görüşme talep ederek taht odama girdi. Merak edip kabul ettim. [recipient.GetSheHe] önümde durup konuştuğunda, [recipient.GetHerHis] sözleri kendinden emindi... ama yine de cüretkârlığını ele veren bir tedirginlik seziliyordu.\n\n"

 lmf_interaction.0001.opening:0 "[recipient.GetTitledFirstNameNoTooltip] bu sabah taht odasında özel bir görüşme talep etti. [recipient.GetSheHe]'in ne söyleyeceğini merak ederek kabul ettim. [recipient.GetSheHe] önümde dururken, [recipient.GetHerHis] tavrında sözlerini uzun süre tartmış birinin ciddiyeti vardı.\n\n"

 lmf_interaction.0001.address.family:0 "\"[recipient.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor'))|U], "

 lmf_interaction.0001.address:0 "\"My [actor.GetLadyLord], "

 lmf_interaction.0001.disinheritor:0 "Beni mirasımdan mahrum bırakmaya neden karar verdiğini kesin olarak söyleyemem. Belki de beni şöyle gördüğün için: "

 lmf_interaction.0001.dynast:0 "Neden mirasımdan mahrum bırakıldığımı kesin olarak söyleyemem. Belki de şöyle algılandığım için: "

 lmf_interaction.0001.worst.deviant:0 "bir tür cinsel sapık, unvan verilmeye layık olmayan biri. Oysa ben de "

 lmf_interaction.0001.worst.unintelligent:0 "zekâdan yoksun, bir hükümdarın gerektirdiği kararlara emanet edilemeyecek biri. Oysa ben de "

 lmf_interaction.0001.worst.crazy:0 "dengesiz ve kararsız, iktidara emanet edilemeyecek biri. Oysa ben de "

 lmf_interaction.0001.worst.unskilled:0 "beceriksiz, bir hükümdarda gereken niteliklerden yoksun. Oysa ben de "

 lmf_interaction.0001.worst.cowardly:0 "hiçbir cesareti olmayan bir korkak. Oysa ben de "

 lmf_interaction.0001.worst.dishonorable:0 "onurdan ve zarafetten yoksun. "

 lmf_interaction.0001.worst.faithless:0 "inancı olmayan ve bu yüzden [ROOT.Char.GetFaith.GetNameNoTooltip]'in kötü bir takipçisi olan biri. Oysa ben de "

 lmf_interaction.0001.worst.callous:0 "başkalarına karşı sorumluluk verilemeyecek kadar duygusuz ve zalim. Oysa ben de "

 lmf_interaction.0001.worst.untrustworthy:0 "çok güvenilmez ve ahlâkî karakterden yoksun. Oysa ben de "

 lmf_interaction.0001.worst.drunkard:0 "asla kendimi toparlayamayacak bir ayyaş. Oysa ben de "

 lmf_interaction.0001.worst.weak:0 "çok zayıf ve narin, bir hükümdarda gereken dayanıklılıktan yoksun. Oysa ben de "

 lmf_interaction.0001.worst.submissive:0 "çok uysal, gerçek bir hükümdarda gereken cesaretten yoksun. Oysa ben de "

 lmf_interaction.0001.worst.malicious:0 "çok kötü niyetli, bir hükümdarda gereken iyi karakterden bir şekilde yoksun. Oysa ben de "

 lmf_interaction.0001.worst.unworthy:0 "layık olmayan, büyüklük için gereken bilinmeyen bir nitelikten yoksun biri. Oysa ben de "

 lmf_interaction.0001.best.intelligent:0 "zeki mi? Tüm akıl melekelerim yerinde, üstelik fazlasıyla.\"\n\n"

 lmf_interaction.0001.best.skilled:0 "becerikli mi? Bir hükümdarın gerektirdiği her konuda yetenekliyim.\"\n\n"

 lmf_interaction.0001.best.bold:0 "cüretkâr mı? Gerekirse tereddüt etmeden kendimi ateşe atarım.\"\n\n"

 lmf_interaction.0001.best.zealous:0 "[ROOT.Char.GetFaith.GetNameNoTooltip]'in sadık ve şevkli bir takipçisi?\"\n\n"

 lmf_interaction.0001.best.warrior:0 "güçlü bir savaşçı mı? Ne de olsa en çok savaş alanında rahat ederim.\"\n\n"

 lmf_interaction.0001.best.honorable:0 "onurlu mu? Bu, [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] hanedanına yakışır bir nitelik değil mi?\"\n\n"

 lmf_interaction.0001.best.compassionate:0 "duygulu ve şefkatli mi? Bunlar [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] hanedanına yakışır nitelikler değil mi?\"\n\n"

 lmf_interaction.0001.best.levelheaded:0 "sağlam ve aklı başında mı? En kötü zamanlarda bile aklımı yitirmemem için bana güvenilebilir, bunu bilirsin.\"\n\n"

 lmf_interaction.0001.best.benevolent:0 "erdem sahibi bir [ROOT.Char.GetWomanMan] mı? Kalbi saf bir hükümdar hanedanımıza elbette yalnızca şeref getirir?\"\n\n"

 lmf_interaction.0001.best.just:0 "sadece mi? Bilgelik ve hukuka yatkınlık, bir hükümdarda bulunması gereken en önemli niteliklerden biri değil mi?\"\n\n"

 lmf_interaction.0001.best.proud:0 "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip] hanedanının gururlu bir üyesi?\"\n\n"

 lmf_interaction.0001.main:0 "[recipient.Custom2('disinherit_worst_trait', SCOPE.sC('actor'))][recipient.Custom2('disinherit_best_trait', SCOPE.sC('actor'))]"

 lmf_interaction.0001.ending.dynast:0 "\"I know you were not the one who made this decision, and thus I now request"

 lmf_interaction.0001.ending.submissive:0 "\"I kneel before you today to ask with all due respect and humility"

 lmf_interaction.0001.ending.dominant:0 "\"I stand before you today to respectfully demand"

 lmf_interaction.0001.ending:0 "\"I stand before you today to request"

 lmf_interaction.0001.close.family:0 ", senin [actor.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'in olarak,"

 lmf_interaction.0001.close.dynast:0 "bu kararı geri almanı ve bu hanedanın bir üyesi olarak itibarımı geri kazandırmasını.\""

 lmf_interaction.0001.close:0 "bu hanedanın bir üyesi olarak itibarımı geri kazandırmak için fikrini değiştirmeni.\""

 lmf_interaction.0001.a:0 "Beni ikna ettin."

 lmf_interaction.0001.b:0 "Ne yazık ki istediğini yapamam."

 lmf_interaction.0001.b.tt:0 "[recipient.GetTitledFirstNameNoTooltip] kararına kötü tepki verebilir..."

 lmf_interaction.0002.t:0 "Miras Reddedildi!"

 lmf_interaction.0002.desc:0 "[actor.GetTitledFirstName]'in önünde yerlere kapanıp davamı anlatmama rağmen, [actor.GetWomanMan] hak ettiğim mirasımı iade etmeyi reddetti. "I understand why you feel as you do," [actor.GetSheHe] said, "but there are reasons why this is for the best and I cannot change them. You will have to accept your fate.""

 lmf_interaction.0002.a:0 "Hayır, bunu kabul edemem!"

 lmf_interaction.0002.a.tt:0 "[recipient.GetTitledFirstNameNoTooltip] reddine öfkeleniyor"

 refused_to_restore_inheritance:0 "Mirası İade Etmeyi Reddetti"

 jealous_of_inheritance:0 "Mirası Kıskanıyor"

 lmf_interaction.0002.nw.tt:0 "[recipient.GetTitledFirstNameNoTooltip] Gece Nöbetçileri'ne katılmak için ayrıldı"

 lmf_interaction.0002.took_vows.tt:0 "[recipient.GetTitledFirstNameNoTooltip] dini yeminler etti"

 lmf_interaction.0002.maester.tt:0 "[recipient.GetTitledFirstNameNoTooltip] Kaledonya'ya gitti"

 lmf_interaction.0002.left_court.tt:0 "[recipient.GetTitledFirstNameNoTooltip] sarayından ayrılmaya karar verdi"

 lmf_interaction.0002.b:0 "Sanırım [actor.GetSheHe] haklı..."

 lmf_interaction.0002.b.tt:0 "[recipient.GetTitledFirstNameNoTooltip] kararını mütevazılıkla kabul ediyor"

 disinherited_betrothal_upset_tt:0 "[disinherited_character.betrothed.liege.GetTitledFirstName], mirastan mahrum bırakmaya üzülüp [disinherited_character.betrothed.GetTitledFirstName] ile nişanı bozmaya karar verebilir"

 lmf_interaction.0004.desc:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('disinherited_betrothed'))]'im bugün bana üzücü bir haber getirdi: [disinherited_betrothed.GetHerHis] nişanlısı, [disinherited_character.GetHerHis] [disinherited_character.Custom2('LMF_RelationToMeShort', SCOPE.sC('disinheritor'))] [disinheritor.GetTitledFirstName] tarafından mirastan mahrum bırakılmış! Bu, [disinherited_character.GetTitledFirstNamePossessiveNoTooltip] gelecek beklentileriyle ilgili anlaşmamızı açıkça ihlal ediyor."

 lmf_interaction.0004.a:0 "Bunu nişanın ihlali sayacağım."

 lmf_interaction.0004.b:0 "Artık çok geç. Nişan devam edecek."

 lmf_interaction.0005.opening:0 "[betrothed_liege.Custom2('GreetingToForeignRulerNegative', ROOT.Char )],"

 lmf_interaction.0005.desc:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('disinherited_character'))]'inin mirastan mahrum bırakılması, [disinherited_character.GetHerHis] gelecek beklentileri ve [disinherited_character.GetSheHe]'in [betrothed_liege.Custom2('LMF_RelationToMeShort', SCOPE.sC('disinherited_betrothed'))] ile yaşayacağı hayat hakkındaki anlaşmamızı zedeliyor. Bana göre bu, [disinherited_character.GetHerHis] [disinherited_betrothed.GetTitledFirstName] ile nişanını geçersiz ve hükümsüz kılıyor."

 lmf_interaction.0005.a:0 "Şaşırtıcı değil, sanırım."

 lmf_interaction.1200.t:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('recipient'))|U] Sevgilileri"

 lmf_interaction.1200.desc.three:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('recipient'))]'imin pek çok sevgilisi olduğunun farkındayım,"

 lmf_interaction.1200.desc.two:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'imin bir değil iki sevgilisi var; en azından benim bildiğim kadarıyla,"

 lmf_interaction.1200.desc.mid:0 "ve ailenin şerefi için bir şeyler yapmanın zamanı geldi.\n\nTek soru şu: meseleyi yalnızca biriyle mi görüşmek istiyorum, yoksa [recipient.GetFirstNameNoTooltip]'in işleri derhal bitirmesini mi talep ediyorum; "

 lmf_interaction.1200.desc.three.end:0 "hepsi mi?"

 lmf_interaction.1200.desc.two.end:0 "ikisiyle de mi?"

 lmf_interaction.1200.a:0 "Mesele [lover_1.GetTitledFirstName]."

 lmf_interaction.1200.b:0 "Mesele [lover_2.GetTitledFirstName]."

 lmf_interaction.1200.c:0 "Mesele [lover_3.GetTitledFirstName]."

 lmf_interaction.1200.d:0 "[recipient.GetSheHe|U] tüm bu ilişkilere son vermeli!"

 lmf_interaction.1200.e:0 "[recipient.GetSheHe|U] bu iki ilişkiye de son vermeli!"

 lmf_interaction.1200.a.success.tt:0 "[recipient.GetFirstNameNoTooltip] aşk ilişkilerine son vermeyi kabul ediyor"

 lmf_interaction.1200.a.failure.tt:0 "[recipient.GetFirstNameNoTooltip] reddediyor ama [recipient.GetHerHim]'i ikna etmenin başka yolları olabilir..."

 lmf_interaction.1201.t:0 "[ROOT.Char.Custom2('LMF_RelationToMePossessive', SCOPE.sC('recipient'))|U] Sevgilisi"

 lmf_interaction.1201.desc.secret:0 "Utancımdan söylemeye dilim varmıyor; [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'im şununla gizli bir ilişki yürütüyor: "

 lmf_interaction.1201.desc.open:0 "Utancımdan söylemeye dilim varmıyor; [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('recipient'))]'im şununla açıkça gönül eğlendiriyor: "

 lmf_interaction.1201.desc.theirs:0 "[recipient.GetHerHis] [recipient.Custom2('LMF_RelationToMeShort', SCOPE.sC('family_lover'))], [family_lover.GetTitledFirstName].\n\n"

 lmf_interaction.1201.desc.default:0 "[family_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\n"

 lmf_interaction.1201.desc.mid:0 "Artık durumu ele almak bana düşüyor... "

 lmf_interaction.1201.desc.secret.end:0 "şanslıysam, ilişki dünyaya ifşa edilmeden, sessizce."

 lmf_interaction.1201.desc.open.end:0 "şanslıysam, bu skandalın sürmesine izin verilmeden, çabucak."

 lmf_interaction.1201.a:0 "[recipient.GetFirstNameNoTooltip] işi derhal bitirmeli."

