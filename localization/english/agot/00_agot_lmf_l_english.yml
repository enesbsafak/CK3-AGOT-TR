 lmf_scheme.1031.both.my.courtier:0 "Sarayda birlikte çalıştığım arkadaşım [proposer_target.GetTitledFirstName] ile evlenmek için iznini istemeye geldim.\n\n"

 lmf_scheme.1031.my.courtier:0 "[Select_CString(proposer_liege.IsLocalPlayer, 'senin', proposer_liege.GetShortUINamePossessive )] sarayının bir parçası olan [proposer_target.GetFullName] adlı bir [proposer_target.Custom('polite_gender_ref')] ile evlenmek için iznini istemeye geldim.\n\n"

 lmf_scheme.1031.other.courtier:0 "[Select_CString(proposer_target_liege.IsLocalPlayer, 'senin', proposer_target_liege.GetShortUINamePossessive )] sarayının bir parçası olan [proposer_target.GetFullName] adlı bir [proposer_target.Custom('polite_gender_ref')] ile evlenmek için iznini istemeye geldim.\n\n"

 lmf_scheme.1031.stranger:0 "[proposer_target.GetFullName] adlı bir [proposer_target.Custom('polite_gender_ref')] ile evlenmek için iznini istemeye geldim.\n\n"

 lmf_scheme.1031.both.family:0 "Bizim için kuşkusuz başka planların var, ya da bizi fazla yakın akraba sayıyorsun; ama "

 lmf_scheme.1031.only.target.family:0 "[proposer_target.GetHerHim] için kuşkusuz başka planların var; ama "

 lmf_scheme.1031.only.proposer.family:0 "Benim için kuşkusuz başka planların var; ama "

 lmf_scheme.1031.proposer.wanderer:0 "Hükümdarı olmayan bir [proposer.GetWomanMan] olduğumun farkındayım; ama "

 lmf_scheme.1031.target.wanderer:0 "[proposer_target.GetSheHe]'in hükümdarı olmayan bir [proposer_target.GetWomanMan] olduğunun farkındayım; ama "

