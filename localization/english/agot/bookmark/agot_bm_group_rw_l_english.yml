l_english:
 agot_bm_group_RW:0 "Rhoynish Savaşları\n7100 A.D. - 7300 A.D."
 agot_bm_7100:0 "Kaplumbağa Savaşı"
 agot_bm_7100_desc:0 "Rhoynar ile Rhoyne kıyısındaki Valyrialı kolonistler arasındaki ilişkiler uzun zamandır gergin. Volantislilerin Rhoyne'da yaşayan dev kaplumbağalardan birini yakalayıp katletmesiyle bu çatışma tırmandı. Rhoynar, bu büyük yaratıkları kutsal sayar."
 agot_bm_7294:0 "Sarhoy'un Yağmalanması"
 agot_bm_7294_desc:0 "İkinci Baharat Savaşı, Rhoyne'un ağzında Rhoynish şehri Sarhoy ile Özgür Şehir Volantis arasında patlak verdi."
 agot_bm_7297:0 "On Bin Gemi"
 agot_bm_7297_desc:0 "Sarhoy'un yıkılmasıyla Rhoynar halkları, Büyük olarak bilinen Chroyane Prensi Garin'in önderliğinde birleşti. Prens Garin, Volantislileri yaptıkları için ezmeye yemin eder. Ancak tüm Rhoynar, Garin'in hislerini paylaşmaz. Ny Sar'ın Prensesi Nymeria, böyle bir savaşı kazanamayacaklarını öğütlemiştir."
 agot_bm_7300:0 "Nymeria'nın Çıkarması"
 agot_bm_7300_desc:0 "Denizlerde geçen uzun yılların ardından Prenses Nymeria, filosundan geriye kalanları Dorne'a getirdi. Orada Lord Mors Martell tarafından karşılandı ve onunla evlendi. Mors Martell, Rhoynish geleneğine uyarak kendisini Prens olarak adlandırdı ve tüm Dorne üzerindeki egemenliğini ilan etti; yeni müttefiki Rhoynarlarla birlikte çeşitli küçük kralları fethetmeyi amaçlıyor."
