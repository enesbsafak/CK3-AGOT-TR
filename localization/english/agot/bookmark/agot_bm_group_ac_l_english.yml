l_english:
 agot_bm_group_AC:0 "Aegon'un Fethi\n4 B.C. - 0 A.C."
 agot_bm_7898:0 "Kan Yüzyılı"
 agot_bm_7898_desc:0 "Valyria Serbest Toprakları çöktü. Yarımadanın başına bir Çöküş geldi; Valyria artık yok, Serbest Topraklar yıkıldı. Ateş ve dumanın o kadar sıcak olduğu söyleniyor ki ejderhalar bile küle döndü. Valyria'nın yıkımı, bilinen dünyada kalan ejderha lordu sayısını büyük ölçüde azalttı: Targaryen Hanedanı çoktan Ejderha Kayası'na taşınmıştı; Çöküş anında Valyria'da bulunmayan diğer ejderha lordları da hayatta kaldı.\nValyria'nın yıkımı Essos'ta bir güç boşluğu bıraktı. Qohor'u ziyaret eden ejderha lordu Aurion, kendisini Valyria'nın ilk İmparatoru ilan etti ve Qohorlulardan kuvvet topladı. Dokuz Özgür Şehir'in en güçlüsü Volantis, Valyria'nın imparatorluğu üzerinde hak iddia etti. Bu sırada doğudan atlarıyla gelen Dothraki söylentileri dolaşıyor..."
 agot_bm_7932:0 "Harwyn Sert El"
 agot_bm_7932_desc:0 "Babası Kral Qhorwyn Hoare'nin ölümüyle 'Sert El' olarak bilinen Harwyn, Deniztaşı Koltuk üzerinde hak iddia etmek için Özgür Şehirler turundan döndü. Babası gibi temkinli bir adam olmayan Harwyn, Fırtına Kralları'nın yönetimi altında ezilen nehir lordlarının yaşadığı yeşil topraklara göz dikiyor."
 agot_bm_7974:0 "Sarnor'un Çöküşü"
 agot_bm_7974_desc:0 "Sarnor'un Uzun Adamları, Dothraki Khal'larının oluşturduğu tehdidi çok uzun süre görmezden geldi. Şehir üstüne şehir yağmalanıp yerle bir edilirken Uzun Adamlar surlarının ardına saklandı. Şimdi nihayet Yüksek Kral Mazor Alexi'nin arkasında birleşen Sarnor adamları, at lordlarına karşı son direnişlerine hazırlanıyor."
 agot_bm_7996:0 "Kanayan Yıllar"
 agot_bm_7996_desc:0 "Fetih'ten önce Westeros'ta yedi kral hüküm sürüyordu; her biri diğerine üstün gelmek için güç ve iktidar mücadelesi veriyordu. Aegon Targaryen'i örnek alıp tüm Westeros'u tek bir kralın altında birleştirebilir misin?"
 agot_bm_7998:0 "Fetih Savaşı"
 agot_bm_7998_desc:0 "Aegon Targaryen ve kız kardeşleri, üç güçlü ejderhayla silahlanmış halde Karasu Nehri'nin ağzına çıktı. Kibirli Argilac, Aegon'un arkadaşı Orys ile Argilac'ın kızı arasındaki evlilik teklifini reddetti; Aegon'un elçisinin ellerini kesip geri gönderdi. Bunun üzerine Aegon, 'Yalnızca tek bir kral olacak' diye ilan ederek Yedi Krallık'ı fethetmeye ant içti."
 agot_bm_8000:0 "Taçlı Ejderha"
 agot_bm_8000_desc:0 "YER TUTUCU"
 agot_bm_8043:0 "Militan İnanç Ayaklanması"
 agot_bm_8043_desc:0 "Fatih Aegon'un ölümü ve oğlu Aenys'in Demir Taht'a çıkışının ardından Yüce Septon, ensestten doğan bu uğursuzluğa karşı ayaklandı. Şimdi, yıllar sonra, hasta Aenys öldü ve üvey kardeşi Zalim Maegor Demir Taht'a oturdu; bu ayaklanmayı sona erdirmeye kararlı."
