### TODO NOT-IN-ST: bookmark_170_donalo_prestayn_desc [AGOT: Once the Sealord of Braavos, the loquacious Donalo Prestayn was a master of politics and trade, whose feats abroad once brought wealth and power to the city. But his reign ended in betrayal, as rivals conspired to unseat him and install Tenesio Velaron in his place. Now, Donalo lurks in the shadows, weaving a web of disgruntled allies and plotting to reclaim the title he believes is rightfully his.\n\n#bold The Braavosi-Pentoshi war presents an opportunity to strike, but his ambitions threaten to plunge the city into chaos — or worse, lead to its destruction.#!]
 bookmark_170_donalo_prestayn_desc:0 "Once the Sealord of Braavos, the loquacious Donalo Prestayn was a master of politics and trade, whose feats abroad once brought wealth and power to the city. But his reign ended in betrayal, as rivals conspired to unseat him and install Tenesio Velaron in his place. Now, Donalo lurks in the shadows, weaving a web of disgruntled allies and plotting to reclaim the title he believes is rightfully his.\n\n#bold The Braavosi-Pentoshi war presents an opportunity to strike, but his ambitions threaten to plunge the city into chaos — or worse, lead to its destruction.#!"
