l_english:
 agot_bm_group_8170:0 "170 A.C."
 agot_bm_8170:0 "Titan Yürüyüşü"
 agot_bm_8170_desc:0 "Braavoslu-Pentoslu savaşları Dar Deniz'in iki yakasını kasıp kavuruyor; Özgür Şehirler'i yutmakla tehdit eden acımasız bir üstünlük mücadelesi. Braavos'ta yeni seçilen Deniz Lordu Tenesio Velaron, Pentos'u ezmek için şehrin filosunu seferber ediyor. Ne var ki yönetimi, tahttan indirilmiş Deniz Lordu Donalo Prestayn tarafından tehdit ediliyor; Prestayn, unvanını geri alıp Braavos'u iç savaşa sürüklemeyi planlıyor. Güneyde Prens Syssilio Estatis, halkını Braavos saldırısına karşı direnmek için topluyor; denizde zayıf kalsa da Pentos'un zenginliği ve kurnazlığı onu zorlu bir düşman yapıyor. Pentoslular, şehrin ünlü tüccar filolarını savaş aracına dönüştürdü; Pentos'un köleleştirilmiş kitleleri arasındaysa huzursuzluk kaynıyor.\n\nBatıda 'Kutsanmış' Baelor, Yedi Krallık'ı dindarlığı kadar pratikten uzak bir elle yönetiyor. Kral, saltanatını görkemli tapınaklar inşa etmeye ve kız kardeşlerini Bakire Kasası'nda saklamaya adıyor; güzelliklerinin erkekleri günaha sürükleyeceğinden korkuyor. Oysa yönetimi ihmal etmesi krallığı başıboş bırakıyor ve lordlar arasında hoşnutsuzluk fısıltıları büyüyor.\n\n#bold Dar Deniz yanarken Westeros uyuyor — ama en kutsal rüyalar bile bir gün sona ermek zorunda.#!"
 bookmark_170_tenesio_velaron:0 "Deniz Lordu Tenesio"
 bookmark_170_tenesio_velaron_subheading:0 "Braavos'un Deniz Lordu"
 bookmark_170_tenesio_velaron_desc:0 "Saygın bir amiral olan Tenesio Velaron, savaş zamanında Braavos'un başına geçti. Gizli Şehir'in filosu Dar Deniz'in en güçlüsü ve Tenesio onu Pentos'u ezmek ve Braavos'un üstünlüğünü güvence altına almak için seferber etti. Ama yönetimi, tahttan indirilmiş Deniz Lordu Donalo Prestayn tarafından tehdit ediliyor; Prestayn, unvanını geri alıp Braavos'u iç savaşa sürüklemeyi planlıyor.\n\n#bold Deniz Lordu'nun hırsı Braavos'u zafere mi taşıyacak, yoksa düşmanları şehrin yıkılışını mı görecek?#!"
 bookmark_170_syssilio_estatis:0 "Prens Syssilio"
 bookmark_170_syssilio_estatis_subheading:0 "Pentos Prensi"
 bookmark_170_syssilio_estatis_desc:0 "Prens Syssilio Estatis, Braavos saldırısına direnmek için Pentos'u topluyor; ama Valyria'nın piç kızını boyunduruğa almak için müttefiklere ihtiyacı olacak. Denizde zayıf kalan tüccar limanı, gelecek savaşlarda ayakta kalabilmeyi umuyorsa köleleştirilmiş kitleleri arasındaki huzursuzluğu bastırmak zorunda. Prens, şehrini ve halkını savunmaya kararlı; ama koşullar aleyhine."
 bookmark_170_donalo_prestayn:0 "Donalo"
 bookmark_170_donalo_prestayn_subheading:0 "Sürgün Deniz Lordu"
 bookmark_170_donalo_prestayn_desc:0 "Bir zamanlar Braavos'un Deniz Lordu olan lafazan Donalo Prestayn, siyaset ve ticaretin ustasıydı; yurtdışındaki başarıları şehre bir zamanlar zenginlik ve güç kazandırmıştı. Ama saltanatı ihanetle sona erdi: Rakipler, onu devirmek ve yerine Tenesio Velaron'u geçirmek için komplo kurdu. Şimdi Donalo gölgelerde pusuya yatmış, hoşnutsuz müttefiklerden oluşan bir ağ örüyor ve kendisinin hakkı olduğuna inandığı unvanı geri almayı planlıyor.\n\n#bold Braavoslu-Pentoslu savaşı ona saldırma fırsatı sunuyor; ama hırsları şehri kaosa sürüklemekle — hatta yıkıma götürmekle — tehdit ediyor.#!"
 bookmark_170_baelor_targaryen:0 "Kral I. Baelor"
 bookmark_170_baelor_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_170_baelor_targaryen_desc:0 "Demir Taht'a oturmuş en dindar kral olan 'Kutsanmış' Kral Baelor, saltanatını Yediler'in şerefine adadı. Yönetiminin onuncu yılında Baelor'un şevki yalnızca derinleşti. Kralın Şehri'nde bir Büyük Tapınak inşa edilmesini emretti, kafirce bulduğu kitapları yaktı ve hatta tövbe yemini eden suçluları serbest bıraktı. En tartışmalı hamlesiyse kız kardeşlerini Bakire Kasası'nda saklamak: güzelliklerinin erkekleri günaha sürükleyeceğinden korkuyor.\n\n#bold Kralın dindarlığı ona küçük halkın sevgisini kazandırdı; ama sarayı giderek huzursuzlanıyor — kimileri dindarlığının deliliğe dönüştüğünü sorguluyor.#!"
 bookmark_170_aryse_ranennox:0 "Leydi Aryse"
 bookmark_170_aryse_ranennox_subheading:0 "Andal Kılıcı"
 bookmark_170_aryse_ranennox_desc:0 "Babasının genişletme döneminin ardından Aryse Ran Ennox, babasının hayalinin bir kıvılcımını görüyor: kadim bir Andal krallığını yeniden kurmak. Andalos Sınırları'nda kendisine ve halkına bir diyar kurmak için tüm gücünü ve kurnazlığını bu işe koyması gerekecek.\n\n#bold Braavoslu-Pentoslu savaşları sürerken Aryse, Andalos sınırını aşıp hamle yapmak için bir fırsat görüyor.#!"
