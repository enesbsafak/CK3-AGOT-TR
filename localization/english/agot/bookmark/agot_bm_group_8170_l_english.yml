### TODO NOT-IN-ST: agot_bm_8170_desc [AGOT: The Braavosi-Pentoshi wars rage across the Narrow Sea, a brutal struggle for dominance that threatens to consume the Free Cities. In Braavos, Tenesio Velaron, the newly elected Sealord, drives the city’s fleet to crush Pentos. Yet his rule is challenged by Donalo Prestayn, the deposed Sealord, who plots to reclaim his title and plunge Braavos into civil war. To the south, Prince Syssilio Estatis rallies his people to resist the Braavosi onslaught; though outmatched at sea, the wealth and cunning of Pentos make it a formidable foe. The Pentoshi have turned the city’s famed merchant fleets into instruments of war, while unrest simmers among Pentos’s enslaved masses.\n\nTo the west, Baelor ‘the Blessed’ rules the Seven Kingdoms with a hand as pious as it is impractical. The king dedicates his reign to building grand septs and secluding his sisters in the Maidenvault, fearing their beauty might tempt men to sin. Yet his neglect of governance leaves the realm adrift, and whispers of discontent grow among the lords.\n\n#bold While the Narrow Sea burns, Westeros sleeps — but even the holiest dreams must end.#!]
 agot_bm_8170_desc:0 "The Braavosi-Pentoshi wars rage across the Narrow Sea, a brutal struggle for dominance that threatens to consume the Free Cities. In Braavos, Tenesio Velaron, the newly elected Sealord, drives the city’s fleet to crush Pentos. Yet his rule is challenged by Donalo Prestayn, the deposed Sealord, who plots to reclaim his title and plunge Braavos into civil war. To the south, Prince Syssilio Estatis rallies his people to resist the Braavosi onslaught; though outmatched at sea, the wealth and cunning of Pentos make it a formidable foe. The Pentoshi have turned the city’s famed merchant fleets into instruments of war, while unrest simmers among Pentos’s enslaved masses.\n\nTo the west, Baelor ‘the Blessed’ rules the Seven Kingdoms with a hand as pious as it is impractical. The king dedicates his reign to building grand septs and secluding his sisters in the Maidenvault, fearing their beauty might tempt men to sin. Yet his neglect of governance leaves the realm adrift, and whispers of discontent grow among the lords.\n\n#bold While the Narrow Sea burns, Westeros sleeps — but even the holiest dreams must end.#!"
