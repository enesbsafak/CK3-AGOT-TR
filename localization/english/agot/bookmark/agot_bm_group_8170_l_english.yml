### TODO NOT-IN-ST: bookmark_170_baelor_targaryen_desc [AGOT: King Baelor ‘the Blessed,’ the most pious king to ever sit the Iron Throne, has dedicated his reign to the glory of the Seven. A decade into his rule, Baelor’s fervor has only deepened. He has ordered a Great Sept be built in King’s Landing, burned books he deems heretical, and even released criminals who swore oaths of repentance. Yet his most controversial act remains the seclusion of his sisters in the Maidenvault, fearing their beauty might tempt men to sin.\n\n#bold The king’s devotion has won him the love of the smallfolk, but his court grows restless — some even question whether his piety has crossed into madness.#!]
 bookmark_170_baelor_targaryen_desc:0 "King Baelor ‘the Blessed,’ the most pious king to ever sit the Iron Throne, has dedicated his reign to the glory of the Seven. A decade into his rule, Baelor’s fervor has only deepened. He has ordered a Great Sept be built in King’s Landing, burned books he deems heretical, and even released criminals who swore oaths of repentance. Yet his most controversial act remains the seclusion of his sisters in the Maidenvault, fearing their beauty might tempt men to sin.\n\n#bold The king’s devotion has won him the love of the smallfolk, but his court grows restless — some even question whether his piety has crossed into madness.#!"
