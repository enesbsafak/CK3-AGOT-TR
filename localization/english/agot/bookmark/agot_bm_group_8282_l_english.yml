 agot_bm_group_8282:0 "282 A.C."
 agot_bm_8282:0 "Robert'ın İsyanı"
 agot_bm_8282_desc:0 "Sahte Bahar Yılı geçti ve #italic kış geliyor#! — beraberinde Yedi Krallık'ı tutuşturacak bir kıvılcım da.\n\nDemir Taht'ın varisi Rhaegar Targaryen, Kuzey'in Koruyucusu'nun kızı ve Fırtına Toprakları'nın Yüksek Lordu'nun nişanlısı Lyanna Stark'ı kaçırdı. Kardeşi Brandon Stark, bu kaçırılmanın hesabını sormak için güneye at sürdüğünde, Deli Kral II. Aerys Targaryen ona adil bir dinleme hakkı tanımadı; babasıyla birlikte acımasızca idam ettirdi.\n\nAma Deli Kral, genç Lordlar Eddard Stark ile Robert Baratheon'un kellesini isteyince Vadi Lordu Jon Arryn bunun yerine isyan bayrağını açtı. #bold Savaş Westeros'a orman yangını gibi yayılırken, krallığın kaderine karar vermek sana düşüyor. Çünkü Taht Oyunları'nı oynarken ya kazanırsın ya ölürsün.#!"
 bookmark_282_eddard_stark:0 "Lord Eddard"
 bookmark_282_eddard_stark_subheading:0 "Winterfell Lordu"
 bookmark_282_eddard_stark_desc:0 "[Concept( 'story_content_eddard_stark_282', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_eddard_stark_282', '$bm_story_content_available_copy|q$' )|E]\nEddard gençliğini, arkadaşı Robert Baratheon ile birlikte Vadi'de Jon Arryn'in vesayetinde geçirdi; sarsılmaz onur ve adalet anlayışıyla tanındı. Babası ve kardeşinin Deli Kral'ın elinde vahşice ölmesiyle Ned artık Winterfell Lordu — ve canı pahasına bir savaş veriyor.\n\n#bold Ned, kız kardeşini Prens Rhaegar'dan kurtarabilecek mi, yoksa akrabalarının kaderini paylaşıp ejderhanın altındaki küllere mi karışacak?#!"
 bookmark_282_lyanna_stark:0 "Lyanna Stark"
 bookmark_282_benjen_stark:0 "Benjen"
 bookmark_282_catelyn_tully:0 "Leydi Catelyn"
 bookmark_282_rhaegar_targaryen:0 "Prens Rhaegar"
 bookmark_282_rhaegar_targaryen_subheading:0 "Ejderha Kayası Prensi"
 bookmark_282_rhaegar_targaryen_desc:0 "[Concept( 'story_content_rhaegar_targaryen_282', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_rhaegar_targaryen_282', '$bm_story_content_available_copy|q$' )|E]\nDemir Taht'ın varisi Rhaegar, soylularca saygı görür, küçük halk tarafından sevilir. Babasının akli dengesi eridikçe Rhaegar kendini şüphe ağına yakalanmış buluyor. Harrenhal Turnuvası'nda Rhaegar, karısını değil de Kuzey'in bir kızını Aşk ve Güzellik Kraliçesi taçlandırdığında skandal diyarı sarstı. Bir yıl sonra Rhaegar, sevdiği Lyanna ile kaçtı — kimileri onu kaçırdığını söylese de.\n\n#bold Babasının vahşi eylemleri durumu diplomasinin ötesine taşırken, Ejderha Prens hanesini unutulmaktan kurtarabilecek mi?#!"
 bookmark_282_elia_martell:0 "Prenses Elia"
 bookmark_282_aerys_targaryen:0 "Kral II. Aerys"
 bookmark_282_aerys_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_282_aerys_targaryen_desc:0 "[Concept( 'story_content_aerys_targaryen_282', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aerys_targaryen_282', '$bm_story_content_available_copy|q$' )|E]\nTargaryen Hanedanı'ndan II. Aerys, Andalların, Rhoynarların ve İlk İnsanların Kralı, Yedi Krallık'ın Lordu ve Diyarın Koruyucusu saltanatına büyük vaatle başladı; ama Duskendale İsyanı'ndan bu yana geçen yıllar, deliliğe keskin bir inişe tanıklık etti. Etrafında — gerçek ya da asılsız — tehditler duyan Deli Kral, giderek ateşe kafayı taktı.\n\n#bold Yedi Krallık bir iç savaşla yüzleşirken, Aerys Demir Taht'taki güce gevşekçe tutunacak mı, yoksa hepsini yakıp kül mü edecek?#!"
 bookmark_282_rhaella_targaryen:0 "Kraliçe Rhaella"
 bookmark_282_viserys_targaryen:0 "Prens Viserys"
 bookmark_282_tywin_lannister:0 "Lord Tywin"
 bookmark_282_tywin_lannister_subheading:0 "Batı'nın Koruyucusu"
 bookmark_282_tywin_lannister_desc:0 "[Concept( 'story_content_tywin_lannister_282', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_tywin_lannister_282', '$bm_story_content_available_copy|q$' )|E]\nHesaplayıcı ve acımasız olarak bilinen Tywin, babasının zayıf saltanatının ardından hanesini yeni zirvelere taşıdı. Bir zamanlar Kral Aerys'in Eli — ve dostu — olan Tywin, çok sayıda hakaretin ardından istifa edip Casterly Kayası'na döndü. Şimdi, Deli Kral'ın savaş çağrısına rağmen Tywin dikkatle savaşın dışında kaldı.\n\n#bold Tywin bir zamanların dostunu ve kralını destekleyecek mi, yoksa bu savaşı kendi hanesinin yararına mı çevirecek?#!"
 bookmark_282_jaime_lannister:0 "Ser Jaime"
 bookmark_282_cersei_lannister:0 "Cersei"
 bookmark_282_robert_baratheon:0 "Lord Robert"
 bookmark_282_robert_baratheon_subheading:0 "Fırtına Toprakları'nın Yüksek Lordu"
 bookmark_282_robert_baratheon_desc:0 "[Concept( 'story_content_robert_baratheon_282', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_robert_baratheon_282', '$bm_story_content_available_copy|q$' )|E]\nVadi'de Jon Arryn'in vesayeti altında yetişen Robert, Ned Stark ile ömür boyu dost oldu ve kısa sürede hem azılı bir savaşçı hem de bir içkici ve zamparacı olarak ün kazandı. Nişanlısı kaçırılıp ölümü emredilince Robert'ın, Fırtına Toprakları'nı Deli Kral'a karşı toplamaktan başka çaresi kalmadı.\n\n#bold Targaryen'ları yok etmeye kararlı Robert'ın başarılı olmak için tüm gücüne ihtiyacı olacak. Ama sevdiği Lyanna bir gün onun olabilecek mi?#!"
 bookmark_282_stannis_baratheon:0 "Ser Stannis"
