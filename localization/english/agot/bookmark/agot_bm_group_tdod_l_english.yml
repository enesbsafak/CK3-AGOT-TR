 agot_bm_group_TDOD:0 "Ejderhaların Dansı\n96 A.C. - 129 A.C."
 agot_bm_8096:0 "Üç Kızın Yükselişi"
 agot_bm_8096_desc:0 "Özgür Şehirler'de Volantis'in Triarch'ları, şehirlerinin Eski Valyria'nın gerçek varisleri olduğunu iddia ederek kendilerini Valyria Serbest Toprakları'nın diğer eski kolonilerinden üstün görürler. Yıllarca süren acı rekabetin ardından Lys ve Myr aralarındaki farklılıkları bir kenara bırakmaya karar verir ve Tyrosh ile birlikte, güçlü Volantis'e karşı kendi yenilmez ittifaklarını kurmak umuduyla savaşa girerler."
 agot_bm_8129:0 "Ejderhaların Dansı"
 agot_bm_8129_desc:0 "Kral Viserys'in 129 A.C.'de ölümü üzerine, Kral Muhafızları'nın Lord Kumandanı Ser Criston Cole — sonradan 'Kral Yapan' olarak anılacaktır — merhum kralın kızı Prenses Rhaenyra'yı varis gösteren vasiyetine karşı çıkar ve onun yerine küçük kardeşi Prens Aegon'u Kral II. Aegon olarak taçlandırır. Demir Taht'ın kontrolü için II. Aegon Targaryen ile Rhaenyra Targaryen arasında patlak veren iç savaş, sonradan 'Ejderhaların Dansı' olarak bilinir."
