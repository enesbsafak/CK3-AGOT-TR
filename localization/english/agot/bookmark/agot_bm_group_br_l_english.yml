 agot_bm_group_BR:0 "Blackfyre İsyanı\n157 A.C. - 259 A.C."
 agot_bm_8157:0 "Dorne'un Fethi"
 agot_bm_8157_desc:0 "Genç Ejderha Prens Daeron, 157 A.C.'de Demir Taht'a çıktığında, atası Fatih Aegon'un mirasını tamamlamak ve Yedi Krallık'ı Targaryen yönetimi altında birleştirmek için bağımsız Dorne Krallığı'na savaş ilan etti. Daeron savaşı hızla kazandı; bu zaferi Dorne'un Fethi adlı kitabında ölümsüzleştirdi: 'Martell Hanedanı'nın arması güneş ile mızrağı taşır — Dorneli'nin en sevdiği iki silah; ama ikisinden güneş daha ölümcüldür.' İstilanın ardından Genç Ejderha, Reach'in Yüksek Lordu'nu yerine Dorne'u yönetmesi için bıraktı. Yenilgiye uğramış olsalar da gururlu Dorneliler ne bir Ejderha'ya ne de bir Tyrell'e boyun eğecekti. Komplolar ve ayaklanmalar orman yangını gibi Dorne'a yayıldı ve sonunda Lord Tyrell'in ölümüyle sonuçlandı. Ölümü Dorne'un her yanında isyana yol açtı ve iki hafta içinde Daeron'un elde ettiği her şey boşa gitti."
 agot_bm_8195:0 "İlk Blackfyre İsyanı"
 agot_bm_8195_desc:0 "Westeros iç savaşın eşiğinde: Kral IV. Aegon'un meşrulaştırılmış piç oğlu Daemon Blackfyre, öz kardeşi Kral II. Daeron'a karşı isyan bayrağını açtı ve Westeros lordlarını Kara Ejder ile Kızıl Ejder arasında seçim yapmaya zorladı. Bu sırada Kuzey'de Stark Hanedanı, tehlikeli Skagosi'lerin önderlik ettiği bir isyanla karşı karşıya; Dar Deniz'in ötesinde Özgür Şehirler Braavos ile Pentos savaş halinde. Yedi Krallık'ın kaderine karar vermek sana düşüyor. Taht Oyunları'nı oynarken ya kazanırsın ya ölürsün."
 agot_bm_8219:0 "Üçüncü Blackfyre İsyanı"
 agot_bm_8219_desc:0 "Daemon Blackfyre'ın dördüncü oğlu Haegon Blackfyre ve Aegor Acıçelik, Demir Taht'ı Blackfyre'lar için ele geçirmek amacıyla Aerys Targaryen'e saldırı başlattı."
 agot_bm_8226:0 "Raymun Kızılsakal'ın İstilası"
 agot_bm_8226_desc:0 "Raymun Kızılsakal, özgür halkı birleştirdi ve kendisini Sur'un Ötesi Kralı olarak taçlandırdı. Gece Nöbetçileri'nin gerilediğini ve sürpriz bir saldırıya yakalanmak için en uygun durumda olduklarını görerek onlara saldırma cesaretini gösterdi."
 agot_bm_8236:0 "Dördüncü Blackfyre İsyanı"
 agot_bm_8236_desc:0 "233 A.C.'de Büyük Konsey toplandığında Aenys Blackfyre, Demir Taht üzerindeki iddiasını barışçıl yollarla öne sürmeye çalıştı. Güvenli geçiş vaadiyle Kralın Şehri'ne gitti; dönemin Kralın Eli Brynden 'Kan Kargası' Rivers'ın emriyle derhal tutuklandı ve öldürüldü.\n\nYeni taç giyen Kral V. Aegon Targaryen'in cezalandırdığı bu onursuzluk, geriye kalan Blackfyre'ların tahta olan iştahını dindirmedi. Haegon Blackfyre'ın en büyük oğlu III. Daemon Blackfyre, Tyrosh'ta Aegor 'Acıçelik' Rivers tarafından taçlandırıldı ve ikisi, Altın Bölük ile Blackfyre Ordusu'nun tüm gücüyle Westeros'u istila etmeye hazırlanıyor.\n\n#bold Bu yeni Kara Ejder, diğerlerinin düştüğü yerde başarıya ulaşabilecek mi?#!"
