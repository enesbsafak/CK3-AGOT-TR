l_english:
 agot_bm_group_8106:0 "106 A.C."
 agot_bm_8106:0 "Serseri Prens"
 agot_bm_8106_desc:0 "Kral I. Viserys Targaryen'in saltanatının ilk yıllarında baş belası, öz kardeşiydi: Prens Daemon Targaryen. Daemon çabuk öfkelenir, çabuk darılır; ama aynı zamanda gözüpek, atılgan ve tehlikeliydi. Büyük Konsey'de kardeşinin en pervasız destekçilerinden biriydi — kimilerine göre bunun nedeni, varis ilan edileceğine inanmasıydı. Ancak varis olarak Daemon'un yeğeni Rhaenyra seçildi ve kral şimdi genç Alicent Hightower ile yeniden evlendi.\n\nBir taç için beklemekten yorulmuş görünen Daemon, artık kendi krallığını kurmaya kararlı. Bu uğurda Lord Corlys Velaryon ile ortak dava kurdu; bunun sebebi, Üç Kız'ın Triarchy'sinin yağmacılığı. Lys, Myr ve Tyrosh'tan oluşan bu yeni ittifak, Adımtaşları'ndan akan ticareti tehdit ediyor ve #bold Serseri Prens onları durduracağına ant içti#!."
 bookmark_106_daemon_targaryen:0 "Prens Daemon"
 bookmark_106_daemon_targaryen_subheading: "Serseri Prens"
 bookmark_106_daemon_targaryen_desc:0 "[Concept( 'story_content_daemon_targaryen_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_daemon_targaryen_109', '$bm_story_content_available_copy|q$' )|E]\nSerseri Prens, bir taç için beklemekten yoruldu. Varis olacağına inanarak Büyük Konsey'de kardeşi Kral I. Viserys'in pervasız bir destekçisi olmuştu — hatta kardeşinin adına bir ordu toplamıştı. Ancak Rhaenyra'nın varis ilan edilmesi ve Viserys'in yeniden evlenmesiyle Daemon, taht şansının eriyip gittiğini görüyor. Artık kendi krallığını kurmaya kararlı; ejderha Caraxes'in sırtında, Triarchy'nin Adımtaşları üzerindeki hâkimiyetini yok etmek için Velaryon filosuyla birlikte uçuyor.\n\n#bold Bu serseri prens krallığına kavuşabilecek mi, yoksa getirdiği ateş ve ölüm onu mu bulacak?#!"
 bookmark_106_rhea_royce:0 "Leydi Rhea"
 bookmark_106_mysaria:0 "Mysaria"
 bookmark_106_viserys_targaryen:0 "Kral I. Viserys"
 bookmark_106_viserys_targaryen_subheading: "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_106_viserys_targaryen_desc:0 "[Concept( 'story_content_viserys_targaryen_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_viserys_targaryen_109', '$bm_story_content_available_copy|q$' )|E]\nSevilen — saygı duyulmasa da — Kral I. Viserys Targaryen, Yedi Krallık'ı üç yılı biraz aşkın süredir yönetiyor ve bu süre boyunca tek bir diken battı: kardeşi Prens Daemon. Daemon'u varis ilan etmeyi reddetmesi, kardeşinin Adımtaşları'nda kendi krallığını kurmak için Lord Corlys Velaryon ile ittifak kurmasına yol açtı. Triarchy'nin bu ticaret yolları üzerindeki hâkimiyetini kırmak Westeros için bir kazanç olsa da, Viserys kardeşine duyduğu sevgiyi — ve onun başarılı olduğunu görme arzusunu — bir başka Targaryen yöneticisinin oluşturacağı tehditle dengelemek zorunda.\n\n#bold Viserys, kardeşinin hırsı ile Üç Kız'ın sıkı boyunduruğu arasında ince çizgiyi yürüyebilecek mi?#!"
 bookmark_106_rhaenyra_targaryen:0 "Prenses Rhaenyra"
 bookmark_106_alicent_hightower:0 "Kraliçe Alicent"
 bookmark_106_corlys_velaryon:0 "Lord Corlys"
 bookmark_106_corlys_velaryon_subheading: "Gelgitlerin Lordu"
 bookmark_106_corlys_velaryon_desc:0 "[Concept( 'story_content_corlys_velaryon_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_corlys_velaryon_109', '$bm_story_content_available_copy|q$' )|E]\nDriftmark'ın Deniz Yılanı, dünyada kendi yolunu çizmiş gururlu bir adam; ailesinin servetini diyarın en zenginleri arasına taşıdı. Corlys'in bir ömür boyunca kurduğu servet, artık Triarchy'nin ticaret kısıtlamalarının tehdidi altında. Prens Daemon Targaryen ile ittifak kurdu; birlikte Triarchy'yi kırıp Adımtaşları'ndaki ticaret yollarını yeni bir kralın altında restore etmeye kararlılar.\n\n#bold Deniz Yılanı'nın bu son yolculuğu en tehlikelisi olabilir — kralına karşı geliyor, bir ejderhayla ittifak kuruyor ve bir imparatorluğa karşı yelken açıyor.#!"
 bookmark_106_rhaenys_targaryen:0 "Prenses Rhaenys"
 bookmark_106_laenor_velaryon:0 "Laenor"
 bookmark_106_craghas_drahar:0 "'Yengeç Besleyen' Craghas"
 bookmark_106_craghas_drahar_subheading: "Triarchy'nin Amirali"
 bookmark_106_craghas_drahar_desc:0 "[Concept( 'story_content_craghas_drahar_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_craghas_drahar_109', '$bm_story_content_available_copy|q$' )|E]\nTartışmalı Topraklar savaşlarının deneyimli bir komutanı olan 'Yengeç Besleyen' Craghas, Triarchy'nin Adımtaşları'nın korsan lordlarını fethetme davasını ilerletmek için yeniden yükseldi. Craghas, korsan lordlarını adanın yengeçlerine yedirme gibi acımasız yöntemiyle başarı kazandı ve şimdi geçen gemilerden alınan ağır geçiş ücretleriyle zenginleşiyor. Ancak kuzeyden bu dengeyi bozmak isteyen yeni bir meydan okuyucu yelken açıyor — ve uçuyor. Yengeç Besleyen, kariyerinin en büyük düşmanıyla karşı karşıya; Triarchy'nin kaderi omuzlarında olabilir.\n\n#bold Yengeç Besleyen, Dar Deniz'in en büyük filosunu ve 'Fatih' Aegon'un dünyayı yeniden yazdığından bu yana görülmemiş bir hırsı nasıl alt edecek?#!"
