### TODO NOT-IN-ST: agot_bm_8106_desc [AGOT: In the early part of King Viserys I Targaryen’s reign, his chief annoyance was his own brother: Prince Daemon Targaryen. Daemon was mercurial and quick to take offense, but he was also daring, dashing, and dangerous. He was one of his brother’s brashest supporters in the Great Council — though some say he was motivated by the belief he would be named heir. However, Daemon’s niece Rhaenyra was named heir instead, and now the king has remarried to the young Alicent Hightower.\n\nSeemingly grown tired of waiting for a crown, Daemon is now determined to carve out a kingdom of his own. In this, he and Lord Corlys Velaryon have made common cause, thanks to the predation of the Triarchy of the Three Daughters. This fledgling alliance of Lys, Myr, and Tyrosh is menacing the trade flowing through the Stepstones, and #bold the Rogue Prince has pledged to stop them#!.]
 agot_bm_8106_desc:0 "In the early part of King Viserys I Targaryen’s reign, his chief annoyance was his own brother: Prince Daemon Targaryen. Daemon was mercurial and quick to take offense, but he was also daring, dashing, and dangerous. He was one of his brother’s brashest supporters in the Great Council — though some say he was motivated by the belief he would be named heir. However, Daemon’s niece Rhaenyra was named heir instead, and now the king has remarried to the young Alicent Hightower.\n\nSeemingly grown tired of waiting for a crown, Daemon is now determined to carve out a kingdom of his own. In this, he and Lord Corlys Velaryon have made common cause, thanks to the predation of the Triarchy of the Three Daughters. This fledgling alliance of Lys, Myr, and Tyrosh is menacing the trade flowing through the Stepstones, and #bold the Rogue Prince has pledged to stop them#!."
