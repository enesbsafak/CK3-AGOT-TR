### TODO NOT-IN-ST: bookmark_106_corlys_velaryon_desc [AGOT: [Concept( 'story_content_corlys_velaryon_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_corlys_velaryon_109', '$bm_story_content_available_copy|q$' )|E]\nThe Sea Snake of Driftmark is a proud man who has made his own way in the world, building his family’s wealth to among the richest in the realm. The wealth that Corlys has spent a lifetime building is now under threat from the Triarchy’s trade restrictions. He has allied himself with Prince Daemon Targaryen, and together they are determined to break the Triarchy and restore the trade routes through the Stepstones under a new king.\n\n#bold This latest of the Sea Snake’s voyages may prove his most perilous — as he defies his king, allies with a dragon, and sails against an empire.#!]
 bookmark_106_corlys_velaryon_desc:0 "[Concept( 'story_content_corlys_velaryon_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_corlys_velaryon_109', '$bm_story_content_available_copy|q$' )|E]\nThe Sea Snake of Driftmark is a proud man who has made his own way in the world, building his family’s wealth to among the richest in the realm. The wealth that Corlys has spent a lifetime building is now under threat from the Triarchy’s trade restrictions. He has allied himself with Prince Daemon Targaryen, and together they are determined to break the Triarchy and restore the trade routes through the Stepstones under a new king.\n\n#bold This latest of the Sea Snake’s voyages may prove his most perilous — as he defies his king, allies with a dragon, and sails against an empire.#!"
