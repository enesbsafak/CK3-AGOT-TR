### TODO NOT-IN-ST: bookmark_106_daemon_targaryen_desc [AGOT: [Concept( 'story_content_daemon_targaryen_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_daemon_targaryen_109', '$bm_story_content_available_copy|q$' )|E]\nThe Rogue Prince has grown tired of waiting for a crown. Believing he would be heir, he was a brash supporter of his brother, King Viserys I, in the Great Council — even raising an army in his brother’s name. However, with Rhaenyra named heir and Viserys married once more, Daemon sees his chance at the throne crumbling. He is now determined to carve out his own kingdom, and astride the dragon Caraxes, he flies alongside the Velaryon fleet to destroy the Triarchy’s hold on the Stepstones.\n\n#bold Will this rogue prince have his kingdom, or will the fire and death he brings come to him instead?#!]
 bookmark_106_daemon_targaryen_desc:0 "[Concept( 'story_content_daemon_targaryen_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_daemon_targaryen_109', '$bm_story_content_available_copy|q$' )|E]\nThe Rogue Prince has grown tired of waiting for a crown. Believing he would be heir, he was a brash supporter of his brother, King Viserys I, in the Great Council — even raising an army in his brother’s name. However, with Rhaenyra named heir and Viserys married once more, Daemon sees his chance at the throne crumbling. He is now determined to carve out his own kingdom, and astride the dragon Caraxes, he flies alongside the Velaryon fleet to destroy the Triarchy’s hold on the Stepstones.\n\n#bold Will this rogue prince have his kingdom, or will the fire and death he brings come to him instead?#!"
