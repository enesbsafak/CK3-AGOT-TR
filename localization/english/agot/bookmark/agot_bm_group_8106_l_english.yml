### TODO NOT-IN-ST: bookmark_106_craghas_drahar_desc [AGOT: [Concept( 'story_content_craghas_drahar_109', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_craghas_drahar_109', '$bm_story_content_available_copy|q$' )|E]\nAn experienced commander of the wars for the Disputed Lands, Craghas ‘Crabfeeder’ once again rose to further the cause of the Triarchy in their conquest of the pirate lords of the Stepstones. Craghas found success with his brutal method of feeding the pirate lords to the crabs of the island, and now grows wealthy off the steep tolls levied on passing ships. However, a new challenger sails — and flies — from the north that seeks to upset this balance. The Crabfeeder faces the greatest foe of his career, and the fate of the Triarchy may rest on his shoulders.\n\n#bold How will the Crabfeeder defeat the greatest fleet of the Narrow Sea, along with an ambition not seen since Aegon ‘the Conqueror’ rewrote the world?#!]
