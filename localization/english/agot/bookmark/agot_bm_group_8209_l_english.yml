 agot_bm_group_8209:0 "209 A.C."
 agot_bm_8209:0 "Ashford'un Gölgeleri"
 agot_bm_8209_desc:0 "Ashford Çayırı'ndaki Turnuva'nın ardından gölgeler toplanıyor. Ejderha Kayası Prensi, Kralın Eli ve Diyarın Koruyucusu Baelor Targaryen ölü — küçük kardeşi Maekar tarafından, sıradan bir çit şövalyesini savunurken trajik biçimde katledildi. Baelor Kırıkkargı'nın sağlam eli artık Demir Taht'ı hiç süslemeyecek; yerinde oğlu, sınanmamış Prens Valarr duruyor. Ashford'a küçük bir zafer kazanmaya gelmişti ama omuzlarında dünyanın yüküyle değişmiş bir adam olarak ayrılıyor.\n\nKralın Şehri'nin üzerinde belirsizlik bulutları yükselirken Demir Taht'ı tehdit etmek isteyenler cesaretleniyor. Özgür şehir Tyrosh'ta Kara Ejder'in çocukları, amcaları Acıçelik'in gözetiminde olgunluğa erişti. Pyke'ın Biçen Lordu da Targaryen Hanedanı'nın zayıflamasından bir kez daha keyif duyuyor. #bold Her gölgede, İyi Kral'a bir kez daha meydan okumak için doğru anı kollayan düşmanlar var.#!"
 bookmark_209_daeron_targaryen:0 "Kral II. Daeron"
 bookmark_209_daeron_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_209_daeron_targaryen_desc:0 "İyi Daeron'un başına bir kez daha trajedi geldi. Oğlu ve varisi Baelor Targaryen, Ashford Turnuvası sırasında bir çit şövalyesini savunurken trajik biçimde can verdi. Daeron'un en küçük oğlu Maekar tarafından kazayla öldürülen Baelor'un ölümü, Ejderha Evi'ni bir kez daha zayıflattı. Baelor'un oğlu Valarr'ın yeni Ejderha Kayası Prensi ve Kralın Eli olarak onaylanmasıyla Daeron, Kırıkkargı'nın ölümünün Westeros'un son on üç yıldır bildiği kırılgan barışı bozmamasını sağlamalı.\n\n#bold İyi Daeron, Westeros'u bir kez daha bir refah dönemine taşıyabilecek mi, yoksa kardeşinin ve oğlunun hayaletleri onu mahvedecek mi?#!"
 bookmark_209_aerys_targaryen:0 "Prens Aerys"
 bookmark_209_brynden_bloodraven:0 "Brynden Kan Kargası"
 bookmark_209_dagon_greyjoy:0 "Biçen Lord Dagon"
 bookmark_209_dagon_greyjoy_subheading:0 "Demir Adalar Lordu"
 bookmark_209_dagon_greyjoy_desc:0 "Demir Adalar Lordu Dagon Greyjoy, Eski Yol'u onurlandırıyor. Aksini söylemek, Pyke'ın Biçen Lordu'nun gücüne meydan okumaktır. Ejderha Evi'nin solduğunu ve yeşil toprakları çürümeye sürüklediğini izledi; Targaryen zayıflığının boyunduruğu altında kalmaya artık razı değil.\n\n#bold Westeros doğuya bakarken, Dagon atalarının yolunu gerçekten onurlandırmayı başarabilecek mi?#!"
 bookmark_209_daemon_blackfyre:0 "II. Daemon"
 bookmark_209_daemon_blackfyre_subheading:0 "Blackfyre Varisliği"
 bookmark_209_daemon_blackfyre_desc:0 "I. Daemon Blackfyre'ın ölümünün üzerinden on üç uzun yıl geçti. Şimdi adaşı ve hayatta kalan en büyük oğlu II. Daemon, Tyrosh'ta sürgünde kendi yolunu çiziyor. Acıçelik, Daemon'un üzerinde tehditkâr bir gölge gibi dolanıyor ve Westeros'u istila etmenin şu an doğru zaman olmadığını söylüyor. Ama Aegor paralı asker olarak hizmet etmek için ayrıldı ve Daemon, Tyrosh'ta yalnızca kardeşlerinin yoldaşlığıyla kara kara düşünüyor. Kuzeni Baelor'un ölümüyle Daemon, amcasının göremediği bir potansiyel görüyor.\n\n#bold Genç Daemon, Westeros'u Targaryen gaspçılarından arındırıp babasının hak ettiği tahtı alabilecek mi?#!"
 bookmark_209_valarr_targaryen:0 "Prens Valarr"
 bookmark_209_valarr_targaryen_subheading:0 "Ejderha Kayası Prensi"
 bookmark_209_valarr_targaryen_desc:0 "Ejderha Kayası Prensi ve Demir Taht'ın varisi... Çoğu insanın yalnızca rüyalarında ulaştığı bir şan, ama Valarr Targaryen'in bir nesil daha duymayı ummadığı sözler. Babası Baelor Kırıkkargı'nın ölümüyle genç prens, babasının saygın konumunu miras alıyor: tahtın bir sonraki sahibi ve büyükbabası Kral II. Daeron'un Kralın Eli. Valarr, babasının anısına iyi ve adil olacağına, onun gibi yöneteceğine ant içti; ama Westeros, Blackfyre İsyanı'ndan bu yana görülmemiş bir belirsizlik dönemine yaklaşıyor.\n\n#bold Prens Valarr, Targaryen Hanedanı'nın güvenliğini ve istikrarını korumak için babasının mirasını ayakta tutabilecek mi?#!"
 bookmark_209_maekar_targaryen:0 "Prens Maekar"
 bookmark_209_maekar_targaryen_subheading:0 "Summerhall Prensi"
 bookmark_209_maekar_targaryen_desc:0 "Kardeşini ilgilendiren korkunç kazanın ardından, huysuz ve sabırsız Prens Maekar Targaryen daha da sertleşti. Baelor Kırıkkargı diyarın dört bir yanında seviliyordu; ama küçük kardeşi onun karizmasının yarısına bile sahip değil. Diyar kaybettiği prensin yasını tutarken lordlar ve halk kardeş katli suçlamalarını fısıldıyor; ama hiçbiri Prens Maekar'ın ömrünün sonuna dek yüzleşeceği acıyı bilemeyecek.\n\n#bold Baelor Kırıkkargı'nın anısı Maekar'ı sonsuza dek kovalayacak mı?#!"
 bookmark_209_ambrose_butterwell:0 "Lord Ambrose"
 bookmark_209_ambrose_butterwell_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_209_ambrose_butterwell_desc:0 "Lord Ambrose'un rahmetli Değersiz Aegon ile dostluğu biliniyordu — ister eski hazine sorumlusu konumu sayesinde, ister büyükbabasına hediye edilen paha biçilmez ejderha yumurtası sayesinde. Lord Butterwell, Blackfyre İsyanı'nda oğullarını karşıt saflara göndererek gizemli bir yol izlemiş ve çatışmada ikisini de kaybetmişti.\n\n#bold Lord Ambrose, bir ejderha yumurtasıyla neyi başarabilir — başarabilirse?#!"
 bookmark_209_duncan_tall:0 "'Uzun' Ser Duncan"
 bookmark_209_duncan_tall_subheading:0 "Çit Şövalyesi"
 bookmark_209_duncan_tall_desc:0 "Pire Dibi'nden bir yetim; ne bir ada ne de bir prestiji var. Ama Ser Duncan, Prens Aerion Targaryen'i bir Yediler Denemesi'nde yenerek olasılıklara meydan okudu ve kendini diyarın tarihine yazdırdı. Bir şövalye ve savaşçı olarak değerini kanıtlayan Dunk, artık yanında kraliyet kanından yeni bir yaverle diyarı çit şövalyesi olarak dolaşıyor.\n\n#bold Ser Duncan, genç yaverine alçakgönüllülüğü ve bir şövalyenin diğer erdemlerini öğretebilecek mi?#!"
 bookmark_209_egg:0 "Egg"
 bookmark_209_aegon_targaryen:0 "Prens Aegon"
 bookmark_209_aerion_brightflame:0 "Aerion Parlakalev"
 bookmark_209_aerion_brightflame_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_209_aerion_brightflame_desc:0 "Prens Aerion Targaryen — 'Parlakalev' — taht sıralamasında gerilerde bir yerde. Onu bekleyen bir gelecek yok, sadece boş zamanı dolduran hayaller ve kuruntular var. Kimileri onun deli olduğunu fısıldıyor; kimileriyse içten içe bunun doğru olduğunu biliyor. Ama 209 A.C. Ashford Turnuvası'nda kraliyet ailesinin önünde küçük düşürüldüğü günden beri, Aerion'un zihninde yeni bir fikir filizlendi: kendi kraliyet kanının onu ölümsüz kılacağına dair bir inanç.\n\n#bold Aerion, Yediler'e olan ateşli inancıyla ne yapacak — ve bu inanç onu nereye sürükleyecek?#!"
 war_fourth_BP:0 "Dördüncü Braavoslu-Pentoslu Savaşı"
 war_sixth_BP:0 "Altıncı Braavoslu-Pentoslu Savaşı"
