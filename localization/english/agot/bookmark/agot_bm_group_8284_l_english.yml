l_english:
 agot_bm_group_8284:0 "284 A.C."
 agot_bm_8284:0 "Taçlı Geyik"
 agot_bm_8284_desc:0 "Gaspçının Savaşı, Robert'ın İsyanı — küçük halkın ona ne dediği önemli değil; önemli olan, #italic bittiği.#!\n\nTargaryen'lar neredeyse tümüyle yok edildi; son varisleri, bir delikanlı ve kucağındaki bir bebek olarak Özgür Şehirler'e savruldu. I. Robert Baratheon artık Westeros'un Demir Tahtı'nda oturuyor; ama kısa sürede fark ediyor ki kral olmak, beklediği kadar kolay değil.\n\n"Onur mu? Yönetecek Yedi Krallığım var! Bir Kral, Yedi Krallık! Onları hizada tutanın onur olduğunu mu sanıyorsun? Barışı koruyanın onur olduğunu mu? #bold Onları korku hizada tutar! Korku ve kan!#!"
 bookmark_284_robert_baratheon:0 "Kral I. Robert"
 bookmark_284_robert_baratheon_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_284_robert_baratheon_desc:0 "Baratheon Hanedanı'ndan I. Robert'a selam olsun: Andalların, Rhoynarların ve İlk İnsanların Kralı, Yedi Krallık'ın Lordu ve Westeros Diyarı'nın Koruyucusu! Artık Demir Taht'ta oturan Robert, barışçıl ve refah dolu bir yönetim güvence altına almak için diyarı bir araya getirmeli. Güzel — ve sinsi — Cersei Lannister ile kraliyet evliliğiyle Lannister'lara bağlanan Robert, kendini dalkavuklarla ve daha kötüsüyle kuşatılmış buluyor.\n\n#bold Taçlı Geyik, Baratheon Hanedanı için tahtta kalıcı bir miras yaratabilecek mi?#!"
 bookmark_284_cersei_lannister:0 "Kraliçe Cersei"
 bookmark_284_jon_arryn:0 "Lord Jon"
 bookmark_284_tywin_lannister:0 "Lord Tywin"
 bookmark_284_tywin_lannister_subheading:0 "Batı'nın Koruyucusu"
 bookmark_284_tywin_lannister_desc:0 "Casterly Kayası Lordu, Lannisport'un Kalkanı ve Batı'nın Koruyucusu Tywin Lannister, aslanın mirasını güvence altına aldı: yeni taç giymiş Westeros Kralı I. Robert Baratheon ile bir evlilik anlaşması. Ama kızı Cersei, babasının entrikalarına pek aldırmıyor; kendi planlarını ve oyunlarını tercih ediyor. Altın oğlu Jaime sonsuza dek Kralkatili olarak anılacak. Varisiyse, babasının gözünde asla uzun boylu duramayacak olan genç İmp Tyrion.\n\n#bold Büyük aslan, diyarın hizmetinde hanesinin geleceğini nasıl iyileştirecek?#!"
 bookmark_284_tyrion_lannister:0 "Tyrion"
 bookmark_284_jaime_lannister:0 "Ser Jaime"
 bookmark_284_renly_baratheon:0 "Lord Renly"
 bookmark_284_renly_baratheon_subheading:0 "Fırtına Toprakları'nın Yüksek Lordu"
 bookmark_284_renly_baratheon_desc:0 "Yalnızca yedi yaşında bir çocuk olan Renly Baratheon, Fırtına Ucu'nun yeni Lordu ve Fırtına Toprakları'nın Yüksek Lordu; ailesinin ata koltuğuna büyük vaat getiriyor. Kolayca dost kazanan karizmatik bir çocuk olan Renly'nin, zamanı gelince Robert'ın gücünü ve heybetini yansıtması olası. Ama önce ağabeyinin yeni yönetiminin karmaşasında yolunu bulmalı ve kendine yeni ittifaklar kurmalı.\n\n#bold Renly, kral olan ağabeyine ve kraliyetin ilgisi için yaltaklanan Westeros'un tüm lord ve hanımlarına değerini nasıl kanıtlayabilir?#!"
 bookmark_284_stannis_baratheon:0 "Lord Stannis"
 bookmark_284_stannis_baratheon_subheading:0 "Ejderha Kayası Lordu"
 bookmark_284_stannis_baratheon_desc:0 "Suskun bir adam olan Stannis Baratheon, savaştan saf azim ve kararlılıkla sağ çıktı. Başka adamların açlıktan ölüp çökeceği yerde Stannis, Fırtına Ucu'nu bir yılı aşkın süre savundu. Robert tarafından kralın varisinin geleneksel koltuğuyla — prens unvanı olmadan — onurlandırılan Stannis, krallığı yeniden refaha taşımaya yardım etmek için artık kardeşinin yanında yerini alıyor.\n\n#bold Ama Ejderha Kayası sarayındaki yeni etkiler, genç lordun görüşlerini ve gelecekteki yönetimini şekillendirecek mi?#!"
 bookmark_284_davos_seaworth:0 "Ser Davos Seaworth"
 bookmark_284_cressen:0 "Üstat Cressen"
 bookmark_284_balon_greyjoy:0 "Lord Balon"
 bookmark_284_balon_greyjoy_subheading:0 "Demir Adalar Lordu"
 bookmark_284_balon_greyjoy_desc:0 "Demir Adalar Lordu ve Büyük Kraken'in kaptanı Balon Greyjoy, Eski Yol'a dönüş istiyor. Babası Quellon, yönetimi boyunca yeşil topraklarla ilişkileri iyileştirmeye — yağmalamaya ve köle almaya son vermeye — adadıktan sonra, Demirdoğanlar'ın yeni hükümdarı yeni kralın altında, devrilen Targaryen yönetiminin çalkantılı izinde kendi rotasını çizmek için bir fırsat görüyor.\n\n#bold Değişim rüzgârları arkasındayken, Balon Westeros tarihinin sayfalarında yerini nasıl alacak?#!"
 bookmark_284_euron_greyjoy:0 "Euron"
 bookmark_284_victarion_greyjoy:0 "Victarion"
