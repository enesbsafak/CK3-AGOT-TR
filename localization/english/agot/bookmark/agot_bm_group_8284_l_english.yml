### TODO NOT-IN-ST: agot_bm_8284_desc [AGOT: The War of the Usurper, Robert’s Rebellion — it matters not what smallfolk call it, but that #italic it is done.#!\n\nThe Targaryens are all but wiped out, their last scions scattered to the Free Cities in the form of a young man and a babe in arms. Robert I Baratheon now sits upon the Iron Throne of Westeros, but he soon realizes that being a king is not so easy as he had expected.\n\n“Honor? I’ve got Seven Kingdoms to rule! One King, Seven Kingdoms! Do you think honor keeps them in line? Do you think it’s honor that’s keeping the peace? #bold It’s fear! Fear and blood!#!”]
 agot_bm_8284_desc:0 "The War of the Usurper, Robert’s Rebellion — it matters not what smallfolk call it, but that #italic it is done.#!\n\nThe Targaryens are all but wiped out, their last scions scattered to the Free Cities in the form of a young man and a babe in arms. Robert I Baratheon now sits upon the Iron Throne of Westeros, but he soon realizes that being a king is not so easy as he had expected.\n\n“Honor? I’ve got Seven Kingdoms to rule! One King, Seven Kingdoms! Do you think honor keeps them in line? Do you think it’s honor that’s keeping the peace? #bold It’s fear! Fear and blood!#!”"
