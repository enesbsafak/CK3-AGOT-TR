### TODO NOT-IN-ST: bookmark_284_robert_baratheon_desc [AGOT: All Hail, Robert I of the House Baratheon, King of the Andals, the Rhoynar, and the First Men, Lord of the Seven Kingdoms and Protector of the Realm of Westeros! Now sitting atop the Iron Throne, Robert must bring the realm together to secure a peaceful and prosperous rule. Tied to the Lannisters via a royal marriage to the beautiful — if devious — Cersei Lannister, Robert finds himself surrounded by sycophants and worse.\n\n#bold How will the Crowned Stag create a lasting legacy for House Baratheon upon the throne?#!]
 bookmark_284_robert_baratheon_desc:0 "All Hail, Robert I of the House Baratheon, King of the Andals, the Rhoynar, and the First Men, Lord of the Seven Kingdoms and Protector of the Realm of Westeros! Now sitting atop the Iron Throne, Robert must bring the realm together to secure a peaceful and prosperous rule. Tied to the Lannisters via a royal marriage to the beautiful — if devious — Cersei Lannister, Robert finds himself surrounded by sycophants and worse.\n\n#bold How will the Crowned Stag create a lasting legacy for House Baratheon upon the throne?#!"
