### TODO NOT-IN-ST: bookmark_284_renly_baratheon_desc [AGOT: Renly Baratheon, a boy of only seven, and the new Lord of Storm’s End and Lord Paramount of the Stormlands, brings much promise to his family’s ancestral seat. A charismatic child who wins friends easily, Renly is like to mirror Robert’s strength and stature in due time. But first he must navigate the tumult of his older brother’s new rule, and forge new alliances for himself.\n\n#bold How might Renly prove his worth to his brother, the King — and all the lords and ladies of Westeros fawning for royal attention?#!]
