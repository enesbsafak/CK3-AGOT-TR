### TODO NOT-IN-ST: bookmark_239_lyonel_baratheon_desc [AGOT: [Concept( 'story_content_lyonel_baratheon_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_lyonel_baratheon_239', '$bm_story_content_available_copy|q$' )|E]\nNot since the days of Argilac ‘the Arrogant’ has a Storm King ruled the Stormlands — until now. Once the most steadfast of the great houses, House Baratheon has severed its ties with the Iron Throne, driven by the grievous dishonor inflicted upon Lyonel’s daughter by Duncan, the Prince of Dragonstone. The so-called heir abandoned her for another, and a lowborn woman at that.\n\n#bold Shall Lyonel have his revenge, no matter the cost?#!]
