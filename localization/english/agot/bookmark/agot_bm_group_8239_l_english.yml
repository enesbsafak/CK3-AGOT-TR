### TODO NOT-IN-ST: bookmark_239_bloodraven_desc [AGOT: [Concept( 'story_content_bloodraven_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_bloodraven_239', '$bm_story_content_available_copy|q$' )|E]\nFrom the halls of power to the frozen wastes, Brynden Rivers — the infamous ‘Bloodraven’ — has walked many paths. A master of secrets, a hand of kings, and now, the sword in the darkness. Elected Lord Commander of the Night’s Watch, he finds himself far from the intrigue of court, but the shadows that once plagued him are never truly far. Here, at the end of the world, where the cold wind bites and men are tested, Bloodraven must rally the Watch to face threats both within and beyond the Wall.\n\n#bold Will Brynden find redemption, or will the shadow of his past claim him once more?#!]
