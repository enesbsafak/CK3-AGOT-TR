 agot_bm_group_8239:0 "239 A.C."
 agot_bm_8239:0 "Gülen Fırtına"
 agot_bm_8239_desc:0 "Fırtına Toprakları'nın Lordu Lyonel Baratheon, korkulan ve saygı duyulan bir adam; azılı ama öngörülemez doğasıyla 'Gülen Fırtına' adını kazandı. Yedi Krallık'ta heybetli bir figür olan Lyonel'in kızının Prens Duncan Targaryen ile nişanı, iki büyük haneyi birleştirmek içindi. Ancak Prens Duncan, krallığı şimşek gibi sarsan bir hareketle bu ittifakı, Eski Taşlar'lı Jenny adında alçak doğumlu bir kızın aşkı için bozdu.\n\nBaratheon'lar için bu yalnızca bozulan bir nişan değil — hanelerinin onurunu lekeleyen ağır bir hakaretti. Şimdi Gülen Fırtına öfkeyle esiyor. Diyarı bir arada tutan bağlar çözülüyor ve Fırtına Toprakları'nda isyan rüzgârları esiyor. Gururu incinmiş, yüreği öfkeyle dolu Lord Lyonel, krallığın barışını bükecek mi, yoksa kıracak mı; kaderini Demir Taht'ın karşısına mı atacak, karar vermelidir.\n\nDiyarın üzerinde bir kefen gibi bir soru asılı: #bold Gülen Fırtına, hanesinin onurunu kurtarmak için ne kadar ileri gidecek?#!"
 bookmark_239_lyonel_baratheon:0 "Lord Lyonel"
 bookmark_239_lyonel_baratheon_subheading:0 "Fırtına Toprakları'nın Yüksek Lordu"
 bookmark_239_lyonel_baratheon_desc:0 "[Concept( 'story_content_lyonel_baratheon_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_lyonel_baratheon_239', '$bm_story_content_available_copy|q$' )|E]\n'Kibirli' Argilac günlerinden beri Fırtına Toprakları'nı bir Fırtına Kralı yönetmemişti — şimdiye dek. Bir zamanlar büyük hanelerin en sadığı olan Baratheon Hanedanı, Lyonel'in kızına Ejderha Kayası Prensi Duncan'ın yaptığı ağır onursuzluk yüzünden Demir Taht ile bağlarını kopardı. Sözde varis onu bir başkası için terk etti — üstelik alçak doğumlu bir kadın için.\n\n#bold Lyonel, bedeli ne olursa olsun intikamını alacak mı?#!"
 bookmark_239_ormund_baratheon:0 "Ormund"
 bookmark_239_cassandra_baratheon:0 "Cassandra"
 bookmark_239_aegon_targaryen:0 "Kral V. Aegon"
 bookmark_239_aegon_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_239_aegon_targaryen_desc:0 "[Concept( 'story_content_aegon_v_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aegon_v_239', '$bm_story_content_available_copy|q$' )|E]\nKüçük halkın sevdiği 'Şanslı' Aegon, birçokları tarafından Demir Taht'ı şereflendiren en büyük krallardan biri olarak selamlanıyor. Ne var ki çocuklarının pervasızca davranışları yüzünden diyar parçalanmanın eşiğinde. Fatih günlerinden beri hiçbir hükümdar Fırtına Toprakları'nda krallık iddia etmemişti; ama şimdi Fırtına Ucu'nda yeni bir Fırtına Kralı yaşıyor. Aegon ve kraliçesinin özenle kurduğu ittifaklar yıkıntı halinde ve diyarı yeniden birleştirmek için çabalamalılar.\n\n#bold Bir Zamanlar Egg Olan Kral, krallığın kendisinin çatlamasını önleyebilecek mi?#!"
 bookmark_239_duncan_targaryen:0 "Prens Duncan"
 bookmark_239_duncan_tall:0 "Lord Kumandan Duncan"
 bookmark_239_garlan_tyrell:0 "Lord Garlan"
 bookmark_239_garlan_tyrell_subheading:0 "Reach'in Yüksek Lordu"
 bookmark_239_garlan_tyrell_desc:0 "[Concept( 'story_content_garlan_tyrell_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_garlan_tyrell_239', '$bm_story_content_available_copy|q$' )|E]\nTyrell Hanedanı, Targaryen Hanedanı'na çok şey borçlu ve her zaman sadık kaldı. Ancak Prens Jaehaerys'in kız kardeşi Prenses Shaera ile alışılmadık biçimde çok zaman geçirdiğine dair söylentiler dolaşırken, fısıltılar ağabeyleri Prens Duncan gibi aşk için nişanlarını bozarak Leydi Celia Tully ve Lord Luthor Tyrell ile nişanlarını bitirebileceklerini öne sürüyor. Bu tedirgin edici olasılık, iki hane arasındaki kadim bağları gerdi ve Lord Garlan bu dikenli durumu dikkatle yönetmek zorunda.\n\n#bold Tohumları kaos içinde ekilmişken Garlan, hanesini güçlü büyümeye devam ettirebilecek mi?#!"
 bookmark_239_luthor_tyrell:0 "Luthor"
 bookmark_239_gormon_tyrell:0 "Gormon"
 bookmark_239_runceford_redwyne:0 "Lord Runceford"
 bookmark_239_runceford_redwyne_subheading:0 "Arbor Lordu"
 bookmark_239_runceford_redwyne_desc:0 "[Concept( 'story_content_runceford_redwyne_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_runceford_redwyne_239', '$bm_story_content_available_copy|q$' )|E]\nRedwyne Hanedanı — Baratheon'lar, Tyrell'ler ya da Tully'ler kadar öne çıkmasa da — yaklaşan çatışmada önemli bir rol oynayabilir. Olenna Redwyne, Prens Daeron Targaryen ile nişanlı olduğundan, Targaryen ailesi içindeki herhangi bir karışıklık Redwyne Hanedanı'nı çatışmanın içine çekebilir. Bozulabilecek nişanlar ve değişen ittifak söylentilerinin geniş kapsamlı sonuçları olabilir; Redwyne Hanedanı olası bir krize hazırlıklı olmalı.\n\n#bold Redwyne Hanedanı, statülerini yükseltmek için bu fırsatı yakalayacak mı, yoksa kenarda mı kalacak?#!"
 bookmark_239_denys_redwyne:0 "Denys"
 bookmark_239_olenna_redwyne:0 "Olenna"
 bookmark_239_bloodraven:0 "Brynden 'Kan Kargası'"
 bookmark_239_bloodraven_subheading:0 "Gece Nöbetçileri'nin Lord Kumandanı"
 bookmark_239_bloodraven_desc:0 "[Concept( 'story_content_bloodraven_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_bloodraven_239', '$bm_story_content_available_copy|q$' )|E]\nİktidar koridorlarından donmuş çorak topraklara, Brynden Rivers — kötü şöhretli 'Kan Kargası' — birçok yol yürüdü. Sırların ustası, kralların eli ve şimdi de karanlıktaki kılıç. Gece Nöbetçileri'nin Lord Kumandanı seçilen Brynden, kendini sarayın entrikalarından uzakta buluyor; ama bir zamanlar onu kemiren gölgeler asla gerçekten uzakta değil. Dünyanın sonunda, soğuk rüzgârın ısırdığı ve insanların sınandığı bu yerde, Kan Kargası Nöbetçileri Sur'un içindeki ve ötesindeki tehditlerle yüzleşmek için toplamalı.\n\n#bold Brynden kefaretini bulacak mı, yoksa geçmişinin gölgesi onu bir kez daha mı ele geçirecek?#!"
 bookmark_239_aemon:0 "Üstat Aemon"
 bookmark_239_jon_karstark:0 "Birinci Korucu Jon"
 bookmark_239_bittersteel:0 "Kaptan-General Aegor"
 bookmark_239_bittersteel_subheading:0 "Altın Bölük'ün Kaptan-Generali"
 bookmark_239_bittersteel_desc:0 "[Concept( 'story_content_bittersteel_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_bittersteel_239', '$bm_story_content_available_copy|q$' )|E]\nAteş ve öfkeyle yönlenen 'Acıçelik' olarak bilinen Aegor Rivers, Yedi Krallık'ın ötesinde şan kazandı. Bir zamanlar saraydaki bir piç, şimdi Altın Bölük'ün azılı Komutanı; tek bir amaçla sürgünlerden ve paralı askerlerden oluşan bir orduyu yönetiyor: Demir Taht'ta bir Blackfyre görmek. Elinde kralların kılıcı, ünlü Blackfyre'ın kendisi; yüreğindeyse ailesine yanlış yapanlara karşı yakıcı bir nefret.\n\n#bold Acıçelik Blackfyre'ları şana kavuşturacak mı, yoksa ejderhaların mirası paramparça mı kalacak?#!"
 bookmark_239_daemon:0 "Daemon"
 bookmark_239_maelys:0 "'Canavar' Maelys"
