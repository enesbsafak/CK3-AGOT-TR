### TODO NOT-IN-ST: bookmark_239_garlan_tyrell_desc [AGOT: [Concept( 'story_content_garlan_tyrell_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_garlan_tyrell_239', '$bm_story_content_available_copy|q$' )|E]\nHouse Tyrell owes much to House Targaryen and has always remained loyal. However, as rumors swirl that Prince Jaehaerys spends an unusual amount of time with his sister, Princess Shaera, whispers suggest they might break their respective betrothals to Lady Celia Tully and Lord Luthor Tyrell to follow the path of their elder brother, Prince Duncan, who forsook his betrothal for love. This unsettling possibility has strained the ancient bonds between the two houses, and Lord Garlan must navigate this thorny situation with caution.\n\n#bold How will Garlan keep his House growing strong when his seeds seem sown in chaos?#!]
