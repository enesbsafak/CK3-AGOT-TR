### TODO NOT-IN-ST: bookmark_239_bittersteel_desc [AGOT: [Concept( 'story_content_bittersteel_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_bittersteel_239', '$bm_story_content_available_copy|q$' )|E]\nDriven by fire and fury, Aegor Rivers — known as ‘Bittersteel’ — has carved out fame beyond the Seven Kingdoms. Once a bastard at court, now the fierce Commander of the Golden Company, he leads an army of exiles and sellswords with one singular purpose: to see a Blackfyre upon the Iron Throne. In his hand is the sword of kings, the famed Blackfyre itself, and in his heart, a burning hatred for those who wronged his family.\n\n#bold Will Bittersteel restore the Blackfyres to glory, or will the legacy of the dragons remain shattered?#!]
