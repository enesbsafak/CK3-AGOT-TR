### TODO NOT-IN-ST: bookmark_239_aegon_targaryen_desc [AGOT: [Concept( 'story_content_aegon_v_239', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aegon_v_239', '$bm_story_content_available_copy|q$' )|E]\nAegon ‘the Fortunate,’ beloved by the smallfolk, is hailed by many as one of the greatest kings to have ever graced the Iron Throne. Yet, through the reckless actions of his children, the realm teeters on the brink of fracturing. Not since the days of the Conqueror has a ruler claimed kingship over the Stormlands, but now Storm’s End is home to a new Storm King. The careful alliances forged by Aegon and his queen lie in ruins, and they must strive to reunite the realm.\n\n#bold Can the King Who Was An Egg keep the kingdom itself from cracking?#!]
