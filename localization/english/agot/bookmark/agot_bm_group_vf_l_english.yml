l_english:
 agot_bm_group_VF:0 "Valyria Serbest Toprakları\n6478 A.D. - 6699 A.D."
 agot_bm_7600:0 "Ejderha Kayası'nın Kuruluşu"
 agot_bm_7600_desc:0 "Essos'taki egemenliklerini güvence altına alan Valyrialılar, Karasu Körfezi'ndeki kayalık bir adada küçük bir koloni kurdular."
 agot_bm_7615:0 "Çekirgekuşu'nun Savaşı"
 agot_bm_7615_desc:0 "Boğulmuş rahip Çekirgekuşu'nun emriyle Kraliçe Lelia Lannister sakat bırakıldı ve zincirlere vurulmuş halde Kaya'ya geri gönderildi. Şimdi öfkeli yeğeni, misilleme olarak Demirdoğanlar'a karşı savaş başlattı."
 agot_bm_7679:0 "Teague Hanedanı'nın Çöküşü"
 agot_bm_7679_desc:0 "Yüzyıllardır nehir lordları Teague Hanedanı'nın boyunduruğu altında eziliyordu. Şimdi Roderick Blackwood'un önderliğindeki bir koalisyon, Teague'leri devirmek için Durrandon'ların desteğini kazandı."
 agot_bm_7700:0 "Braavos'un Perdesinin Kaldırılması"
 agot_bm_7700_desc:0 "Gizli Şehir Braavos, 100 yıl sonra varlığını dünyaya açıklamak için bu anı seçti."
 agot_bm_7800:0 "Çöküşten Önce"
 agot_bm_7800_desc:0 "Çöküş Valyria'ya gelmeden önce dünya böyleydi"
