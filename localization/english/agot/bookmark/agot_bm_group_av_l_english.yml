l_english:
 agot_bm_group_AV:0 "Andal İstilası\n6478 A.D. - 6699 A.D."
 agot_bm_6478:0 "Lorath'ın Arındırılması"
 agot_bm_6478_desc:0 "Andalos üzerindeki hâkimiyetini sağlamlaştıran Yüksek Kral Büyük Qarlon, gözünü Özgür Şehir Norvos'u fethetmeye dikti."
 agot_bm_6538:0 "Yedi Yıldız Savaşı"
 agot_bm_6538_desc:0 "Kral Robar Royce'un önderliğinde birleşen Vadi'nin İlk İnsanları, Andal istilacılarına karşı son direnişlerini yapmak için toplandı. Andallar da Şahin Şövalye olarak bilinen genç savaşçı Ser Artys Arryn'in arkasında birleşti."
 agot_bm_6583:0 "Greyiron'ların Çöküşü"
 agot_bm_6583_desc:0 "Andallar, Parmaklar'a ayak basmalarından bin yıl sonra gözlerini Demir Adalar'a çevirdi. Andallar nehir topraklarına, batı topraklarına ve Reach'e akın edip yerleşirken yeni yerleşimler ve sağlam kaleler inşa etmeye başladılar. Bu güçlü savunmalar, Andalların denizcilik yeteneğiyle birleşince Demirdoğanlar'ın Günbatımı Denizi üzerindeki kavrayışını zayıflattı. Andallar, çoğu zaman rakip Demirdoğan lordlarının desteğiyle Demir Adalar'ı dalga dalga istila etmeye başladı. Şimdi Demir Adalar Kralı II. Rognar Greyiron, Drumm, Greyjoy, Hoare ve Orkwood haneleriyle ittifak kuran Andallarla yüzleşmek zorunda."
 agot_bm_6610:0 "Aç Kurt"
 agot_bm_6610_desc:0 "Kral Theon Stark, her cepheden kuşatılmış bir dönemde Kuzey'i yönetiyor. Demirdoğanlar batı kıyılarını yağmalıyor, güneydeki zaferleriyle cesaretlenen Andallar doğu kıyılarına çıkarma yapıyor ve Sur'un ötesindeki Yabanıllar'ın tehdidi asla göz ardı edilemez. Westeros'un başka yerlerinde İlk İnsanlar, görünüşte bitmek bilmeyen Andal istilacı dalgasına karşı mücadeleyi sürdürüyor."
 agot_bm_6650:0 "Adaletin Çekici"
 agot_bm_6650_desc:0 "Andallar Westeros'u istila etmeye devam ederken Nehir Toprakları Kralı Trister Mudd, kendisini İlk İnsanlar'ın en büyük savunucusu olarak kanıtlıyor. Adaletin Çekici olarak bilinen kral, istilacılara karşı 99 savaş kazandı. Kral Roland Arryn'in istilasını yeni püskürten Adaletin Çekici, şimdi güçlü bir Andal savaş lordu olan Armistead Vance'in saldırısıyla karşı karşıya."
 agot_bm_6699:0 "Yedilerin Işığı"
 agot_bm_6699_desc:0 "Savaşlar büyük ölçüde sona erdi ve en büyük kahramanlar yenildi; İlk İnsanlar'ın en bilge üyeleri, istilacıların dalgasına direnmenin imkânsız olduğunu anladı. Çoğu, Andalların yedi tanrısına tapınmayı benimsemenin yolunu buldu. Bu yeni çağda Westeros'u nasıl bir gelecek bekliyor?"
