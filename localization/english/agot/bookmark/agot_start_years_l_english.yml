l_english:
 start_year_8082_01_01_desc:0 "Maegor 'Zalim'in ölümünün üzerinden otuz dört yıl geçti ve Westeros hiç böyle bir altın çağ yaşamamıştı. Barış ve refah dolu bir nesil — tamamı Barıştıran ve İyi Kraliçe'nin gözetiminde. Bir düzineyi bulan varisle veraset güvence altında ve Targaryen Hanedanı'nın hükümdarlığına yönelik tehditler, kralın ustaca diplomasisiyle etkisiz hale getirildi.\n\nAma barış sonsuza dek sürmez. Dorne'da gerginlik yükseliyor: Prensliğin varisi Demir Taht'a karşı intikam savaşı istiyor; Ejderha Evi içindeyse genç varisler kendilerini ihmal edilmiş hissedip babalarının iradesine karşı geliyor.\n\n#bold Küçük halk arasında fısıltılar yayılıyor; çoğu, altın çağın yakında solacağını — ya da çoktan paslandığını — söylüyor.#!"
 start_year_8106_04_18_desc:0 "Kral I. Viserys Targaryen'in saltanatının ilk yıllarında baş belası, öz kardeşiydi: Prens Daemon Targaryen. Daemon çabuk öfkelenir, çabuk darılır; ama aynı zamanda gözüpek, atılgan ve tehlikeliydi. Büyük Konsey'de kardeşinin en pervasız destekçilerinden biriydi — kimilerine göre bunun nedeni, varis ilan edileceğine inanmasıydı. Ancak varis olarak Daemon'un yeğeni Rhaenyra seçildi ve kral şimdi genç Alicent Hightower ile yeniden evlendi.\n\nBir taç için beklemekten yorulmuş görünen Daemon, artık kendi krallığını kurmaya kararlı. Bu uğurda Lord Corlys Velaryon ile ortak dava kurdu; bunun sebebi, Üç Kız'ın Triarchy'sinin yağmacılığı. Lys, Myr ve Tyrosh'tan oluşan bu yeni ittifak, Adımtaşları'ndan akan ticareti tehdit ediyor ve #bold Serseri Prens onları durduracağına ant içti#!."
 start_year_8170_12_11_desc:0 "Braavoslu-Pentoslu savaşları Dar Deniz'in iki yakasını kasıp kavuruyor; Özgür Şehirler'i yutmakla tehdit eden acımasız bir üstünlük mücadelesi. Braavos'ta yeni seçilen Deniz Lordu Tenesio Velaron, Pentos'u ezmek için şehrin filosunu seferber ediyor. Ne var ki yönetimi, tahttan indirilmiş Deniz Lordu Donalo Prestayn tarafından tehdit ediliyor; Prestayn, unvanını geri alıp Braavos'u iç savaşa sürüklemeyi planlıyor. Güneyde Prens Syssilio Estatis, halkını Braavos saldırısına karşı direnmek için topluyor; denizde zayıf kalsa da Pentos'un zenginliği ve kurnazlığı onu zorlu bir düşman yapıyor. Pentoslular, şehrin ünlü tüccar filolarını savaş aracına dönüştürdü; Pentos'un köleleştirilmiş kitleleri arasındaysa huzursuzluk kaynıyor.\n\nBatıda 'Kutsanmış' Baelor, Yedi Krallık'ı dindarlığı kadar pratikten uzak bir elle yönetiyor. Kral, saltanatını görkemli tapınaklar inşa etmeye ve kız kardeşlerini Bakire Kasası'nda saklamaya adıyor; güzelliklerinin erkekleri günaha sürükleyeceğinden korkuyor. Oysa yönetimi ihmal etmesi krallığı başıboş bırakıyor ve lordlar arasında hoşnutsuzluk fısıltıları büyüyor.\n\n#bold Dar Deniz yanarken Westeros uyuyor — ama en kutsal rüyalar bile bir gün sona ermek zorunda.#!"
 start_year_8209_02_01_desc:0 "Ashford Çayırı'ndaki Turnuva'nın ardından gölgeler toplanıyor. Ejderha Kayası Prensi, Kralın Eli ve Diyarın Koruyucusu Baelor Targaryen ölü — küçük kardeşi Maekar tarafından, sıradan bir çit şövalyesini savunurken trajik biçimde katledildi. Baelor Kırıkkargı'nın sağlam eli artık Demir Taht'ı hiç süslemeyecek; yerinde oğlu, sınanmamış Prens Valarr duruyor. Ashford'a küçük bir zafer kazanmaya gelmişti ama omuzlarında dünyanın yüküyle değişmiş bir adam olarak ayrılıyor.\n\nKralın Şehri'nin üzerinde belirsizlik bulutları yükselirken Demir Taht'ı tehdit etmek isteyenler cesaretleniyor. Özgür şehir Tyrosh'ta Kara Ejder'in çocukları, amcaları Acıçelik'in gözetiminde olgunluğa erişti. Pyke'ın Biçen Lordu da Targaryen Hanedanı'nın zayıflamasından bir kez daha keyif duyuyor. #bold Her gölgede, İyi Kral'a bir kez daha meydan okumak için doğru anı kollayan düşmanlar var.#!"
 start_year_8211_03_01_desc:0 "Büyük Bahar Hastalığı yaklaşık iki yıldır Westeros'u kasıp kavurdu ve ardında on binlerce ceset bıraktı. Ölenler arasında 'İyi' Kral Daeron ile torunu ve varisi Prens Valarr da vardı. Bu ölümlerle birlikte yeni bir kral taç giydi: Daeron'un ikinci oğlu, birinci adının sahibi Aerys. Aerys, piç doğumlu amcası Brynden 'Kan Kargası'nı El olarak seçti; bu, en küçük kardeşi Maekar'ı çileden çıkardı — Ashford Çayırı'ndaki felaket turnuvasının ardından sevgiyle değil, akraba katili olarak anılıyor.\n\nSummerhall Prensi küskün bir halde topraklarına döndü. Bu sırada onun dördüncü oğlu Prens Aegon, 'Uzun' Ser Duncan olarak bilinen bir çit şövalyesiyle yolculuk ediyor. #bold Pire Dibinin sıradan piç oğlu Egg'in akıl hocası, yakında lordların, hanımların, prenslerin ve kralların büyük şarkılarının merkezinde bulabilir kendini.#!"
 start_year_8233_02_08_desc: "Yüz yıllık bir gerilemenin ve Demir Taht'a üç kez başarısız Blackfyre iddiacısı oturtma girişiminin ardından Peake Hanedanı, 'İyi' Daeron'un soyuna karşı bir kez daha isyan bayrağını açtı.\n\nYaşına rağmen Kral I. Maekar Targaryen güçlü bir savaşçı olmayı sürdürüyor ve bu küçük, umutsuz ayaklanmayı ezmek için Kral Toprakları ile Batı Toprakları'nın ordusuna bizzat önderlik ediyor. Maekar'ın yaklaşık altmış yıllık hayatında göğüs gerdiği her meydan okumadan sonra, #italic bu#! elbette en kolayı olacak.\n\n#bold Peake'ler tüm olasılıklara rağmen başarılı olacak mı, yoksa bir zamanlar gururlu hanedan daha da derin bir karanlığa mı sürüklenecek?#!"
 start_year_8236_02_13_desc:0 "233 A.C.'de Büyük Konsey toplandığında Aenys Blackfyre, Demir Taht üzerindeki iddiasını barışçıl yollarla öne sürmeye çalıştı. Güvenli geçiş vaadiyle Kralın Şehri'ne gitti; dönemin Kralın Eli Brynden 'Kan Kargası' Rivers'ın emriyle derhal tutuklandı ve öldürüldü.\n\nYeni taç giyen Kral V. Aegon Targaryen'in cezalandırdığı bu onursuzluk, geriye kalan Blackfyre'ların tahta olan iştahını dindirmedi. Haegon Blackfyre'ın en büyük oğlu III. Daemon Blackfyre, Tyrosh'ta Aegor 'Acıçelik' Rivers tarafından taçlandırıldı ve ikisi, Altın Bölük ile Blackfyre Ordusu'nun tüm gücüyle Westeros'u istila etmeye hazırlanıyor.\n\n#bold Bu yeni Kara Ejder, diğerlerinin düştüğü yerde başarıya ulaşabilecek mi?#!"
 start_year_8239_01_11_desc:0 "Fırtına Toprakları'nın Lordu Lyonel Baratheon, korkulan ve saygı duyulan bir adam; azılı ama öngörülemez doğasıyla 'Gülen Fırtına' adını kazandı. Yedi Krallık'ta heybetli bir figür olan Lyonel'in kızının Prens Duncan Targaryen ile nişanı, iki büyük haneyi birleştirmek içindi. Ancak Prens Duncan, krallığı şimşek gibi sarsan bir hareketle bu ittifakı, Eski Taşlar'lı Jenny adında alçak doğumlu bir kızın aşkı için bozdu.\n\nBaratheon'lar için bu yalnızca bozulan bir nişan değil — hanelerinin onurunu lekeleyen ağır bir hakaretti. Şimdi Gülen Fırtına öfkeyle esiyor. Diyarı bir arada tutan bağlar çözülüyor ve Fırtına Toprakları'nda isyan rüzgârları esiyor. Gururu incinmiş, yüreği öfkeyle dolu Lord Lyonel, krallığın barışını bükecek mi, yoksa kıracak mı; kaderini Demir Taht'ın karşısına mı atacak, karar vermelidir.\n\nDiyarın üzerinde bir kefen gibi bir soru asılı: #bold Gülen Fırtına, hanesinin onurunu kurtarmak için ne kadar ileri gidecek?#!"
 start_year_8258_12_21_desc:0 "Doğuda bir Blackfyre iddiacısı yeniden yükseliyor: Gözü Demir Taht'ta olan ürkütücü yeni bir kaptan-general, Altın Bölük'ün komutasını ele geçirdi.\n\nCanavar Maelys adına yakışır biri; korsanların, kanun kaçaklarının ve sürgünlerin büyüyen ittifakı bu müstakbel krala destek sözü verdi. Kendi kendini Dokuzlar Çetesi diye adlandıran bu topluluk, Westeros'un lordlarına ve hanımlarına daha çok dert açabilir.\n\nAma Kral V. Aegon Targaryen'in, dışarıdaki tehdide denk düşen iç meseleleri de var. Küçük halkın şampiyonu olan kralın birçok reformu Yedi Krallık'taki yöneticileri huzursuz etti; çocuklarının geri çevirdiği nişanlar, sahip olduğu azıcık desteği de ekşitti. Batıda kargaşa hararete dönüştü: Kurnaz Lord Roger Reyne'in isyan riski, tekinsiz bir belirsizlikte bekliyor.\n\n#bold Kralın umudu, Asshai'nin kadim metinlerinde: Yeni bir refah çağını müjdeleyecek ejderhaların yeniden doğuşu. Ama etrafındaki cehennem büyüdükçe, onu bütünüyle yutma tehlikesi de büyüyor.#!"
 start_year_8277_01_01_desc:0 "Kral II. Aerys Targaryen'in bir zamanlar umut vaat eden saltanatı tehlikeli bir noktaya geldi: Yıllardır Kral ile El'i hakkında söylentiler ve entrikalar dolaşıyor, iki eski dostun arasındaki uçurum iyice açıldı. Şimdi Lord Denys Darklyn, bu yarılmayı kendi lehine kullandı: Kralı Duskendale'de görüşmeye çekti — yalnızca rehin alınmak için.\n\nLord Tywin Lannister ile Kral arasındaki güç oyunları, Darklyn'lerin Demir Taht üzerinde hiçbir hanenin ulaşamadığı bir koz elde etmesini sağladı... #bold Ne var ki yüksek hırslar çoğu zaman pervasız kararlara yol açar ve efsanevi Darklyn Hanedanı'nın kaderi ipin ucunda.#!"
 start_year_8282_09_15_desc:0 "Sahte Bahar Yılı geçti ve #italic kış geliyor#! — beraberinde Yedi Krallık'ı tutuşturacak bir kıvılcım da.\n\nDemir Taht'ın varisi Rhaegar Targaryen, Kuzey'in Koruyucusu'nun kızı ve Fırtına Toprakları'nın Yüksek Lordu'nun nişanlısı Lyanna Stark'ı kaçırdı. Kardeşi Brandon Stark, bu kaçırılmanın hesabını sormak için güneye at sürdüğünde, Deli Kral II. Aerys Targaryen ona adil bir dinleme hakkı tanımadı; babasıyla birlikte acımasızca idam ettirdi.\n\nAma Deli Kral, genç Lordlar Eddard Stark ile Robert Baratheon'un kellesini isteyince Vadi Lordu Jon Arryn bunun yerine isyan bayrağını açtı. #bold Savaş Westeros'a orman yangını gibi yayılırken, krallığın kaderine karar vermek sana düşüyor. Çünkü Taht Oyunları'nı oynarken ya kazanırsın ya ölürsün.#!"
 start_year_8284_06_02_desc:0 "Gaspçının Savaşı, Robert'ın İsyanı — küçük halkın ona ne dediği önemli değil; önemli olan, #italic bittiği.#!\n\nTargaryen'lar neredeyse tümüyle yok edildi; son varisleri, bir delikanlı ve kucağındaki bir bebek olarak Özgür Şehirler'e savruldu. I. Robert Baratheon artık Westeros'un Demir Tahtı'nda oturuyor; ama kısa sürede fark ediyor ki kral olmak, beklediği kadar kolay değil.\n\n"Onur mu? Yönetecek Yedi Krallığım var! Bir Kral, Yedi Krallık! Onları hizada tutanın onur olduğunu mu sanıyorsun? Barışı koruyanın onur olduğunu mu? #bold Onları korku hizada tutar! Korku ve kan!#!"
