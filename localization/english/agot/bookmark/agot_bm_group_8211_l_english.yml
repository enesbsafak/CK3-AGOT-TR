 agot_bm_group_8211:0 "211 A.C."
 agot_bm_8211:0 "Baharın Ardından"
 agot_bm_8211_desc:0 "Büyük Bahar Hastalığı yaklaşık iki yıldır Westeros'u kasıp kavurdu ve ardında on binlerce ceset bıraktı. Ölenler arasında 'İyi' Kral Daeron ile torunu ve varisi Prens Valarr da vardı. Bu ölümlerle birlikte yeni bir kral taç giydi: Daeron'un ikinci oğlu, birinci adının sahibi Aerys. Aerys, piç doğumlu amcası Brynden 'Kan Kargası'nı El olarak seçti; bu, en küçük kardeşi Maekar'ı çileden çıkardı — Ashford Çayırı'ndaki felaket turnuvasının ardından sevgiyle değil, akraba katili olarak anılıyor.\n\nSummerhall Prensi küskün bir halde topraklarına döndü. Bu sırada onun dördüncü oğlu Prens Aegon, 'Uzun' Ser Duncan olarak bilinen bir çit şövalyesiyle yolculuk ediyor. #bold Pire Dibinin sıradan piç oğlu Egg'in akıl hocası, yakında lordların, hanımların, prenslerin ve kralların büyük şarkılarının merkezinde bulabilir kendini.#!"
 bookmark_211_daemon_blackfyre:0 "II. Daemon"
 bookmark_211_daemon_blackfyre_subheading:0 "Rüya Gören Ejderha"
 bookmark_211_daemon_blackfyre_desc:0 "[Concept( 'story_content_daemon_blackfyre_211', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_daemon_blackfyre_211', '$bm_story_content_available_copy|q$' )|E]\nOn beş yıl önce I. Daemon Blackfyre, üvey kardeşi Kral II. Daeron Targaryen'e karşı isyan bayrağını açtı. Kendisi ve en büyük oğulları Kızılçayır Tarlası'nda öldü; tartışmalı iddiasının varisi olarak küçük oğlu Daemon kaldı. Kralın ölümü ve kitapkurdu I. Aerys'in taç giymesiyle, 'Genç' Daemon için Demir Taht'a uzanmaktan daha iyi bir fırsat olamazdı. Yolunda 'Acıçelik' duruyor: amcası şimdiye dek hem babasının kılıcını hem de tacını ondan esirgedi.\n\n#bold Babasının başaramadığını başarıp Demir Taht'ı ele geçirebilecek mi?#!"
 bookmark_211_bittersteel:0 "Prens Aegor 'Acıçelik'"
 bookmark_211_duncan_tall:0 "'Uzun' Ser Duncan"
 bookmark_211_duncan_tall_subheading:0 "Yeminli Kılıç"
 bookmark_211_duncan_tall_desc:0 "[Concept( 'story_content_duncan_the_tall_211', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_duncan_the_tall_211', '$bm_story_content_available_copy|q$' )|E]\nPrens Baelor 'Kırıkkargı'nın Ashford Çayırı'ndaki ölümünün üzerinden iki yıl geçti. Bu süre zarfında Duncan, yaveriyle — Prens Maekar'ın oğlu, gizli Prens Aegon Targaryen ile — yolculuklarına devam etti. Bahar Hastalığı Westeros'u kasıp kavururken Dunk ve Egg, Dorne'un kumlarında sığınak buldu. Şimdi yaşlanan Ser Eustace Osgrey'e yeminli kılıç olarak hizmet ediyor ve Standfast kulesine yerleşiyor.\n\n#bold Dunk yeminine sadık kalacak mı, yoksa daha büyük bir efendi mi bulacak?#!"
 bookmark_211_egg:0 "Egg"
 bookmark_211_rohanne_webber:0 "Leydi Rohanne"
 bookmark_211_rohanne_webber_subheading:0 "Coldmoat Leydisi"
 bookmark_211_rohanne_webber_desc:0 "[Concept( 'story_content_rohanne_webber_211', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_rohanne_webber_211', '$bm_story_content_available_copy|q$' )|E]\nRohanne Webber, Bahar Hastalığı'nın ardından Coldmoat'ı miras aldı; babası arkasında erkek varis bırakmamıştı. Konumu güvenli görünse de rahmetli Lord Webber bir koşul bırakmıştı: Rohanne beşinci bir koca bulmalı ya da unvanını bir kuzenine bırakmalı. Bir evlilik ayarlasa bile, gücünü sınamak isteyenlerle her yandan kuşatılmış durumda.\n\n#bold 'Kızıl Dul' koltuğunu güvence altına alabilecek mi, yoksa düşmanlarının ağına mı düşecek?#!"
 bookmark_211_longinch:0 "'Uzunparmak' Ser Lucas"
 bookmark_211_eustace_osgrey:0 "Ser Eustace"
 bookmark_211_eustace_osgrey_subheading:0 "Standfast Şövalyesi"
 bookmark_211_eustace_osgrey_desc:0 "[Concept( 'story_content_eustace_osgrey_211', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_eustace_osgrey_211', '$bm_story_content_available_copy|q$' )|E]\nEustace Osgrey her şeyini Blackfyre İsyanı'na kaybetti. Kara Ejder'a verdiği destek, oğullarına, karısına, kızına... ve umutlarına mal oldu. Bir zamanlar gururlu hanesi yalnızca Standfast kulesine, kendisi de yaşamının baharını geçmiş, ölümü bekleyen yaslı bir adama dönüştü. Çevresinde zayıflık gören, yaşlı şövalyenin elinde kalan azıcık şeyi kapmak isteyenler var. Hizmetine Kahverengi Kalkan'lı Ser Bennis ile 'Uzun' Ser Duncan'ı aldı.\n\n#bold Bu yaşlı Damalı Aslan, gururunu ve kulesini koruyabilecek mi, yoksa hanesinin son görkemiyle birlikte mi çöküşecek?#!"
 bookmark_211_bennis:0 "'Kahverengi Kalkan'lı Ser Bennis"
