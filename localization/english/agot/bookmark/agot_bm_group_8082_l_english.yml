l_english:
 agot_bm_group_8082:0 "82 A.C."
 agot_bm_8082:0 "Barıştıran'ın Saltanatı"
 agot_bm_8082_desc:0 "Maegor 'Zalim'in ölümünün üzerinden otuz dört yıl geçti ve Westeros hiç böyle bir altın çağ yaşamamıştı. Barış ve refah dolu bir nesil — tamamı Barıştıran ve İyi Kraliçe'nin gözetiminde. Bir düzineyi bulan varisle veraset güvence altında ve Targaryen Hanedanı'nın hükümdarlığına yönelik tehditler, kralın ustaca diplomasisiyle etkisiz hale getirildi.\n\nAma barış sonsuza dek sürmez. Dorne'da gerginlik yükseliyor: Prensliğin varisi Demir Taht'a karşı intikam savaşı istiyor; Ejderha Evi içindeyse genç varisler kendilerini ihmal edilmiş hissedip babalarının iradesine karşı geliyor.\n\n#bold Küçük halk arasında fısıltılar yayılıyor; çoğu, altın çağın yakında solacağını — ya da çoktan paslandığını — söylüyor.#!"
 bookmark_82_jaehaerys_targaryen:0 "Kral I. Jaehaerys"
 bookmark_82_jaehaerys_targaryen_subheading: "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_82_jaehaerys_targaryen_desc:0 "Barıştıran doğduğunda, çok az kişi onun bir gün tahta oturacağını düşünüyordu; Jaehaerys'in kendisi bile Fatih'ten daha büyük bir kral olarak selamlanacağını hayal edemezdi. Zorba amcasının ölümünün ardından diyar birleşmiş olsa da, aile meseleleri artık kralın hayatına çok farklı bir biçimde egemen. İyi Kraliçe'nin yanında, şimdi ailesini bir arada tutmaya bakmalı.\n\n#bold Jaehaerys üçte bir asırdır barışı korudu — ama lordlarının, yabancı prenslerin ve kendi çocuklarının baskısı altında, daha ne kadar koruyabilecek?#!"
 bookmark_82_alysanne_targaryen:0 "'İyi Kraliçe' Alysanne"
 bookmark_82_septon_barth:0 "Septon Barth"
 bookmark_82_aemon_targaryen:0 "Prens Aemon"
 bookmark_82_aemon_targaryen_subheading: "Ejderha Kayası Prensi"
 bookmark_82_aemon_targaryen_desc:0 "Barıştıran ile İyi Kraliçe'nin ikinci doğan ve hayatta kalan en büyük oğlu, soluk saçlı Aemon, kendisinden önceki Targaryen prenslerinin standartlarına göre rahat bir hayat sürdü. Savaşsız ve isyansız geçen yılların ardından tahta çıkışı kesin görünüyor. Kendi verasetiyse daha belirsiz: Yalnızca bir kızı — Baratheon annesine çeken — olan Ejderha Kayası Prensi, kendisinden kaçan bir oğul için Yediler'e dua etmek ya da kızının başa geçmesi için düzeni yeniden kurmak zorunda.\n\n#bold Aemon veraseti güvence altına alıp babasının mirasını onurlandırabilecek ve bir nesil daha barışı koruyabilecek mi?#!"
 bookmark_82_rhaenys_targaryen:0 "Prenses Rhaenys"
 bookmark_82_jocelyn_baratheon:0 "Jocelyn Baratheon"
 bookmark_82_mors_martell:0 "Prens VI. Mors"
 bookmark_82_mors_martell_subheading: "Dorne Prensi"
 bookmark_82_mors_martell_desc:0 "Fatih'in Dorneliler'i kırma girişiminde Rhaenys ve Meraxes yere serildiğinden beri, gurur ve endişe Dorne'un Martell'lerini sarmış durumda. Ejderha'nın ilerleyişini durduran tek yöneticiler olmanın gururu; bir gün kara kanatların gölgesinde tüm kasabaları yeniden yutabileceğini bilmenin endişesi. Prens'in varisi Morion kıvılcımları körüklüyor; kimileri oğul başa geçtiğinde Ejderhaları Dorne'a karşı yeniden savaşa süreceğinden korkuyor.\n\n#bold Prens Mors Martell, Dorne'a özgür bir gelecek güvence altına alabilecek mi — boyun eğmeden, bükülmeden ve kırılmadan kalabilmek için?#!"
 bookmark_82_manfryd_redwyne:0 "Lord Manfryd"
 bookmark_82_manfryd_redwyne_subheading: "Arbor Lordu"
 bookmark_82_manfryd_redwyne_desc:0 "Eşsiz bir prestije sahip Lord Manfryd, Velaryon Hanedanı'ndan olmayan ilk donanma sorumlusu olarak görev yapıyor. Bir oğlu kılıcını Kral Muhafızları'na adamış, diğeri Kralın Şehri'nin Şehir Nöbeti'ne önderlik ediyor; Redwyne Hanedanı, Ejderhalar gelmeden bu yana böyle yükseklikler görmedi. Ama lord-amiral bunun gelip geçici bir an olacağından korkuyor: Deniz Yılanı ve bilinen dünya çapındaki efsanevi yolculukları varken, Ser Robert'ın konsey koltuğunda onun yerini alması neredeyse imkânsız görünüyor.\n\n#bold Manfryd taçla ilişkisini sağlamlaştırabilecek mi, yoksa o ya da Bilge Kral öldüğü anda bu ilişki sönecek mi?#!"
 bookmark_82_ryam_redwyne:0 "Ser Ryam"
 bookmark_82_robert_redwyne:0 "Ser Robert"
 bookmark_82_lyman_beesbury:0 "Lord Lyman"
 bookmark_82_lyman_beesbury_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_82_lyman_beesbury_desc:0 "Hiçbir zaman büyük bir hane olmayan Beesbury'lerin mali yetenekleri, Lord Lyman'ı Kral Jaehaerys'in dikkatine taşıdı; birçok kişi Lyman'ın bir gün Küçük Konsey'e oturup oturmayacağını sorguluyor. Ama bir skandal Lyman'ın — ve hanesinin — geleceğini tehdit ediyor. Oğlu ve varisi Ser Braxton, kendisini Prenses Saera ve nedimelerine fazlasıyla yakın buldu. Honeyholt Lordu, bu beceriksizliğin oğlunu ölüme ya da sürgüne mahkûm edebileceğinden, kendi elleriyle yarattığı bir kaderden korkuyor.\n\n#bold Lyman oğlunu hizaya sokup hanesine daha fazla zafer ve güç kazandırabilecek mi? Yoksa sonsuza dek Hightower'ın gölgesinde mi çabalayacak?#!"
 bookmark_82_braxton_beesbury:0 "Ser Braxton"
 bookmark_82_roy_connington:0 "'Kızıl' Lord Roy"
 bookmark_82_roy_connington_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_82_roy_connington_desc:0 "Çekici, cesur ve kendi hakkıyla lord olan 'Kızıl' Roy, soylu genç hanımların lord-kocalarında aradığı her şey. Kusursuz bir şövalye olmasa da, arkadaşları Jonah Mooton ve Ser Braxton Beesbury ile birlikte gençliğin şehvetine kapıldı; Perianne Moore, Alys Turnburry ve en tehlikelisi de Prenses Saera Targaryen ile yattılar. Bilge Kral, 'Kızıl' Roy ve arkadaşlarının suçlarını öğrenirse, cezaları ölüm ya da Sur olabilir.\n\n#bold 'Kızıl' Roy, tacın dikkatli gözlerinden kaçıp layık bir yönetici olduğunu kanıtlayabilecek mi? Yoksa sonsuza dek yolunu şaşırmış bir çocuk mu kalacak?#!"
 bookmark_82_osmund_strong:0 "Lord Osmund"
 bookmark_82_osmund_strong_subheading: "Tanrıların Gözü Lordu"
 bookmark_82_osmund_strong_desc:0 "Kralın gözdesi Strong Hanedanı, yalnızca on yıl önce tacın lütfuyla Harrenhal'ın lordluğunu kazandı. Hanedanın geleceği şu anda Kale'de: zincirine halkalar ekleyerek bir gün bilge ve adil bir yönetici olarak eve dönmek için. Ama Lyonel'in de dürtüleri yok değil: Kısa süre önce dedesinin kalesinin kapılarına bir bebek ulaştı. Üstatlığa soyunan varisin piç kızı Alys — annesinin kimliği Kale'den dönüş yolculuğunda kaybolmuştu — Osmund'un mirasına bir leke getiriyor.\n\n#bold Osmund ve soyu Harrenhal'da hayatta kalıp refaha erebilecek mi, yoksa Kara Harren'in lanetinin bir başka kurbanı mı olacaklar?#!"
 bookmark_82_simon_strong:0 "Ser Simon"
 bookmark_82_lyonel_strong:0 "Lyonel"
