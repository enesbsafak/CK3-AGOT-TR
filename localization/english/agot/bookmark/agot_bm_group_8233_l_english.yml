l_english:
 agot_bm_group_8233:0 "233 A.C."
 agot_bm_8233:0 "Peake Ayaklanması"
 agot_bm_8233_desc:0 "Yüz yıllık bir gerilemenin ve Demir Taht'a üç kez başarısız Blackfyre iddiacısı oturtma girişiminin ardından Peake Hanedanı, 'İyi' Daeron'un soyuna karşı bir kez daha isyan bayrağını açtı.\n\nYaşına rağmen Kral I. Maekar Targaryen güçlü bir savaşçı olmayı sürdürüyor ve bu küçük, umutsuz ayaklanmayı ezmek için Kral Toprakları ile Batı Toprakları'nın ordusuna bizzat önderlik ediyor. Maekar'ın yaklaşık altmış yıllık hayatında göğüs gerdiği her meydan okumadan sonra, #italic bu#! elbette en kolayı olacak.\n\n#bold Peake'ler tüm olasılıklara rağmen başarılı olacak mı, yoksa bir zamanlar gururlu hanedan daha da derin bir karanlığa mı sürüklenecek?#!"
 peake_uprising_name:0 "Peake Ayaklanması"
 bookmark_233_maekar_targaryen:0 "Kral I. Maekar"
 bookmark_233_maekar_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_233_maekar_targaryen_desc:0 "[Concept( 'story_content_maekar_targaryen_233', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_maekar_targaryen_233', '$bm_story_content_available_copy|q$' )|E]\nKral II. Daeron'un son oğlu I. Maekar Targaryen, hayatının büyük bölümünü Ejderha Evi'nin giderek kırılganlaşan yönetimine karşı ihanetleri bastırmakla geçirdi. İkinci Blackfyre İsyanı'ndan bu yana, Lord Estyn Peake'in beceriksiz ayaklanması kadar güdük bir isyan görülmedi. Bir zamanlar ona yardım eden akrabaları artık zamana karışmış olsa da, 'Örs'ün bu düşmanları ezmesi zor olmamalı.\n\n#bold Yaşlanmış ve yorgun Maekar, görevini yerine getirip Targaryen Hanedanı'nın geleceğini son bir kez güvence altına alabilecek mi?#!"
 bookmark_233_brynden_bloodraven:0 "Brynden"
 bookmark_233_aemon_targaryen:0 "Üstat Aemon"
 bookmark_233_aegon_targaryen:0 "Prens Aegon"
 bookmark_233_aegon_targaryen_subheading:0 "Summerhall Prensi"
 bookmark_233_aegon_targaryen_desc:0 "Bir dördüncü oğulun dördüncü oğlu; hayatının çoğunda, büyük oğullardan gelen amcalar ve kuzenler bir düzineyi bulduğu için bu umulmadık Egg'in Targaryen hanedanının geleceğinde küçük bir rol bile oynayacağı düşünülmüyordu. Ama hastalık ve çekişme hepsini alıp götürdü. Aegon'un ağabeyi Aerion'un akılsızca ölümünün ardından Kral I. Maekar, yeni bir Ejderha Kayası Prensi — ve varis — belirlemedi. Yine de fısıltılar, bu oğlun babasının günleri bittiğinde tahta oturacağını söylüyor.\n\n#bold Aegon, kraldan başka Ejderha Evi'nin bağlanmamış son yetişkin erkeği olarak hayatla nasıl başa çıkacak?#!"
 bookmark_233_betha_blackwood:0 "'Kara' Betha"
 bookmark_233_duncan_tall:0 "Ser Duncan"
 bookmark_233_estyn_peake:0 "Lord Estyn"
 bookmark_233_estyn_peake_subheading:0 "Starpike Lordu"
 bookmark_233_estyn_peake_desc:0 "Yüz yıl önce bir Peake, Naip Lord, Kralın Eli ve Diyarın Koruyucusu olarak hizmet etmişti; kızı neredeyse Kraliçe oluyordu. Ama güçlüler ne kadar düştü. Lord Unwin'in Kralın Şehri'nde hüküm sürdüğü günden beri Peake Hanedanı trajediden trajediye koştu. Peake'ler Kara Ejder'la üç kez ayaklandı ve Sahte Doğan Daeron ile oğulları tarafından üç kez yere serildi. Sadakat onlara çok pahalıya mal oldu.\n\n#bold Estyn, hanesini atalarının gördüğü yüksekliklere taşıyabilecek mi, yoksa Peake Hanedanı daha da derine düşmeye mahkûm mu?#!"
 bookmark_233_gerold_lannister:0 "'Altın' Lord Gerold"
 bookmark_233_gerold_lannister_subheading:0 "Batı'nın Koruyucusu"
 bookmark_233_gerold_lannister_desc:0 "Casterly Kayası Lordu ve Batı'nın Koruyucusu Gerold Lannister, hayatının çoğunda trajedi ve söylentilerle kuşatıldı. Kardeşinin ve yeğeninin ölümünden karısının kayboluşuna dek, Gerold'u suçlayan fısıltılar var. Taban beyi Lord Robert Reyne, Peake isyancılarını bastırmak için bir ordu topladı ve oğulları Lord Reyne'in yanında güneye yürüyor.\n\n#bold Diyarının adamları savaşa giderken, bazıları eve dönmediğinde Gerold ve Batı Toprakları nasıl başa çıkacak?#!"
 bookmark_233_tywald_lannister:0 "Tywald"
 bookmark_233_tion_lannister:0 "Ser Tion"
 bookmark_233_robert_reyne:0 "Lord Robert"
 bookmark_233_robert_reyne_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_233_robert_reyne_desc:0 "Lord Robert Reyne — kraldan ya da taban beyinden bir savaş çağrısı bile gelmeden — sancaklarını açtı ve adamlarını topladı. Ama Robert, davet edilse de edilmese de Peake Ayaklanması'nı bastırmaya yardım edecekti. Neyse ki herkes için Kral I. Maekar, niyeti ne olursa olsun bu yardımı memnuniyetle karşıladı.\n\n#bold Hırslı aslan lordu şan açlığını giderebilecek mi, yoksa bu güney yürüyüşü Reyne Hanedanı'nın kaderini sonsuza dek mi değiştirecek?#!"
 bookmark_233_roger_reyne:0 "Ser Roger"
 bookmark_233_ellyn_reyne:0 "Ellyn"
