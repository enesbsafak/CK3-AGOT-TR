 agot_bm_group_8277:0 "277 A.C."
 agot_bm_8277:0 "Duskendale İsyanı"
 agot_bm_8277_desc:0 "Kral II. Aerys Targaryen'in bir zamanlar umut vaat eden saltanatı tehlikeli bir noktaya geldi: Yıllardır Kral ile El'i hakkında söylentiler ve entrikalar dolaşıyor, iki eski dostun arasındaki uçurum iyice açıldı. Şimdi Lord Denys Darklyn, bu yarılmayı kendi lehine kullandı: Kralı Duskendale'de görüşmeye çekti — yalnızca rehin alınmak için.\n\nLord Tywin Lannister ile Kral arasındaki güç oyunları, Darklyn'lerin Demir Taht üzerinde hiçbir hanenin ulaşamadığı bir koz elde etmesini sağladı... #bold Ne var ki yüksek hırslar çoğu zaman pervasız kararlara yol açar ve efsanevi Darklyn Hanedanı'nın kaderi ipin ucunda.#!"
 bookmark_277_tywin_lannister:0 "Lord Tywin"
 bookmark_277_tywin_lannister_subheading:0 "Batı'nın Koruyucusu"
 bookmark_277_tywin_lannister_desc:0 "[Concept( 'story_content_tywin_lannister_277', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_tywin_lannister_277', '$bm_story_content_available_copy|q$' )|E]\nGururlu Lord Tywin, on beş yıldır Kralın Eli olarak hizmet ediyor — kendi çocuklarının yaşından uzun. Bu makamda oturmuş en büyük adamlardan biri olarak övülen Tywin hakkında, kralın giderek tutarsızlaşan heveslerinden diyarı kurtararak tahta gerçekte onun oturduğu fısıldanıyor. İlişkileri gerilmişken, Tywin artık zamanının çoğunu bir zamanlar yakın dostu olan kralı büyüyen paranoyasına rağmen yatıştırmaya harcıyor.\n\n#bold Aerys, El'inin öğütlerini görmezden gelip Darklyn Hanedanı'yla bizzat görüşmeye gitti ve Tywin bir kez daha Kral'ın ardından toplamak zorunda.#!"
 bookmark_277_cersei_lannister:0 "Cersei"
 bookmark_277_jaime_lannister:0 "Jaime"
 bookmark_277_denys_darklyn:0 "Lord Denys"
 bookmark_277_denys_darklyn_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_277_denys_darklyn_desc:0 "[Concept( 'story_content_denys_darklyn_277', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_denys_darklyn_277', '$bm_story_content_available_copy|q$' )|E]\nDarklyn Hanedanı, Kral Muhafızları'na diğer tüm hanelerden daha çok yeminli kılıç vermesiyle ünlüdür; tacına sadakatlerini sayısız kez kanıtlamışlardır. Ama Denys Darklyn uçlara sürüklenmiş bir adam — kimileri şehrinin halkına yardım etmek için, kimileriyse Myrli karısının öğütleriyle. Her iki durumda da artık kapılarının önünde, rehin aldığı Kral'ın korkulan El'i tarafından yönetilen bir orduyla karşı karşıya.\n\n#bold Darklyn Hanedanı'nın şöhreti bir anda şebeke adına mı dönüşecek, yoksa Lord Denys halkının daha büyük refahı için Kral'ın güvenliğini koz olarak kullanmayı başarabilecek mi?#!"
 bookmark_277_lady_serala:0 "Leydi Serala"
 bookmark_277_jon_hollard:0 "Ser Jon"
 bookmark_277_aerys_targaryen:0 "Kral II. Aerys"
 bookmark_277_aerys_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_277_aerys_targaryen_desc:0 "[Concept( 'story_content_aerys_targaryen_277', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aerys_targaryen_277', '$bm_story_content_available_copy|q$' )|E]\nBir zamanlar hanedanının çekici ve çalışkan bir üyesi olarak bilinen II. Aerys, artık söylentiler ve fısıltılarla kuşatılmış durumda. Sık sık bir plandan diğerine atlayan kralın, El'i — ve bir zamanlar en yakın dostu — Tywin Lannister ile giderek artan bir çatışmaya sürüklendiği söyleniyor.\n\n#bold Kral'ın Duskendale Darklyn'leriyle başa çıkarken kendi iradesini ve becerisini gösterme girişimi geri tepti; ama kendi taban beyi tarafından hapsedilmişken tüm umutlar yitirildi mi?#!"
 bookmark_277_barristan_selmy:0 "'Gözüpek' Barristan"
 bookmark_277_rhaegar_targaryen:0 "Prens Rhaegar"
 bookmark_277_rhaegar_targaryen_subheading:0 "Ejderha Kayası Prensi"
 bookmark_277_rhaegar_targaryen_desc:0 "[Concept( 'story_content_rhaegar_targaryen_277', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_rhaegar_targaryen_277', '$bm_story_content_available_copy|q$' )|E]\nEjderha Kayası Prensi Rhaegar, ciddi ve sessiz bir adam olarak bilinir; ama özellikle babasının tutarsız doğasıyla karşılaştırıldığında, büyük bir zekâ ve istikrar sahibidir. Henüz evlenmemiş olan Rhaegar'a, büyük ve küçük birçok hane kızlarıyla kur yapmayı umuyor; ne var ki hem kendisinin hem babasının böyle bir eş için katı ölçütleri var.\n\n#bold Duskendale'deki son çatışmayla birlikte, Rhaegar Demir Taht'taki zamanının beklediğinden çok daha erken başladığını görecek mi?#!"
 bookmark_277_elia_martell:0 "Prenses Elia"
 bookmark_277_arthur_dayne:0 "Arthur Dayne"
