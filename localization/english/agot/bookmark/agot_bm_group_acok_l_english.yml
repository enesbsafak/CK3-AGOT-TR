 agot_bm_group_ACOK:0 "299 A.C. & 300 A.C."
 agot_bm_8299:0 "Kralların Çarpışması"
 agot_bm_8299_desc:0 "Westeros savaşta. Robert Baratheon'un beklenmedik ölümünün ardından, sınanmamış ilk oğlu Joffrey Demir Taht'a oturur. Kuzey'in Lordu ve Kralın Eli Eddard Stark, Stannis Baratheon'a Joffrey'in Robert'ın oğlu olmadığını, Kraliçe Cersei ile kardeşi Ser Jaime Lannister arasındaki ensest ilişkinin ürünü olduğunu bildirmiştir. Lord Eddard'ın suçlamalarına öfkelenen Joffrey onu idam ettirmiştir. Şimdi Eddard'ın oğlu Robb, Nehir Toprakları'ndaki Tully'lerin desteğiyle sancaklarını yükseltmiş ve Kralın Şehri'ne yürümektedir. Bu sırada fırsatçı Lord Balon Greyjoy, Deniztaşı Koltuk üzerinde hak iddia etmiş ve eskilerin Demirdoğanları gibi yağmalamayı ummaktadır. Son olarak, Dar Deniz'in ötesinde, kocasının ve doğmamış çocuğunun yasını tutan Daenerys Targaryen, Westeros'a dönüş yolculuğuna başlar. Bu senaryoda George R.R. Martin'in 'Buz ve Ateşin Şarkısı' eserinin merkezî çatışmasını yeniden yaşayın — ama unutmayın: Kış Geliyor."
 agot_bm_8300:0 "Kargaların Ziyafeti"
 agot_bm_8300_desc:0 "Beş Kralın Savaşı sona ermek üzere gibi görünüyor. Robb Stark, Joffrey Baratheon, Renly Baratheon ve Balon Greyjoy ölü. Kral Stannis Baratheon, Jon Snow'un Lord Kumandan olduğu Sur'a kaçtı. Joffrey'in sekiz yaşındaki kardeşi Kral Tommen Baratheon, annesi Naip Kraliçe Cersei Lannister'ın gözetiminde Kralın Şehri'nde hüküm sürüyor. Lord Tywin Lannister, şehirden kaçışı sırasında oğlu Tyrion tarafından öldürüldü. Sansa Stark, karısı Lysa Arryn'i öldüren ve kendisini Vadi'nin Koruyucusu ile sekiz yaşındaki Lord Robert Arryn'in vasisi ilan eden Petyr Baelish'in koruması altında Vadi'de saklanıyor."
