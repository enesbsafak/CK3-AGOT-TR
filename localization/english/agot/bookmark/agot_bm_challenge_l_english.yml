l_english:
 challenge_character_106_jeyne_arryn:0 "Leydi Jeyne"
 challenge_character_106_jeyne_arryn_desc:0 "Leydi Jeyne Arryn, Vadi'yi daha üç yaşındayken miras aldı. Ne gençliği ne de cinsiyeti taban beyleri arasında güven uyandırdı; hırslı erkek akrabalarsa onu devirmek için her fırsatı kollayarak zamanlarını bekliyor. #bold Naiplik döneminin sınavlarından sağ çıkıp yüksek tahtına tutunabilecek mi?#!"
 challenge_character_239_steffon_tully:0 "Yüksek Lord Steffon"
 challenge_character_239_steffon_tully_desc:0 "Prens Duncan'ın pervasız evliliği ve ardından gelen mirastan feragatiyle Tully Hanedanı nadir bir ödüle ulaştı: Genç Celia'nın Prens Jaehaerys ile nişanı onu bir gün kraliçe yapacak. #bold Tabii Lord Steffon Tully, nişanın sürmesini sağlayabildiği sürece...#!"
 challenge_character_259_tancred_crane:0 "Lord Tancred"
 challenge_character_259_tancred_crane_desc:0 "Bir Targaryen prensesinin oğlu olan Lord Tancred Crane, unvanının tek başına sağlayacağının çok ötesinde bir prestij ve etkiye sahip. Gerçekten de kral, kendisini yeni nesil Targaryen'ları kutlamak için Summerhall'da düzenlenecek büyük bir kutlamaya kişisel olarak davet etti. #bold Orada toplananları nasıl bir parlak gelecek bekliyor?#!"
 challenge_character_106_rhaenyra_targaryen:0 "Prenses Rhaenyra"
 challenge_character_106_rhaenyra_targaryen_desc:0 "Yalnızca neredeyse yarım düzine akrabasının talihsiz ölümü, Rhaenyra Targaryen'in Ejderha Kayası Prensesi ilan edilmesini sağladı — ne var ki konumu kırılgan. Kralın Eli ve müttefikleri, 'Diyarın Neşesi'ni baltalamak için yeni kraliçeyi kullanıyor; Demir Taht'a Hightower kanından birini oturtmayı planlıyorlar. #bold Saraydaki kötücül güçler onun doğuştan hakkını elinden almaya çalışabilir; ama Rhaenyra veraseti güvence altına alıp yeni bir düzen kurabilir mi?#!"
 challenge_character_209_danelle_lothston:0 "'Deli' Danelle"
 challenge_character_209_danelle_lothston_desc:0 "Harrenhal Laneti, kalenin çürüyen kapılarından geçen herkesin üzerine ağır çöker; ama hiç kimse 'Deli' Danelle Lothston'dan daha fazla taşımıyor. Sayısız kaza ve ihanet ailesini neredeyse tümüyle yok etti — onu genç yaşta yönetici yaptı ve kimilerine göre deliliğe sürükledi. #bold Hizmetkârlar ay ışığında büyü ritüellerinden ve dev yarasalardan söz ediyor; et şölenleri ve kanla dolu küvetler hakkında söylentiler dolaşıyor. Bu hikâyeler gerçek mi?#!"
 challenge_character_209_viserys_plumm:0 "Lord Viserys"
 challenge_character_209_viserys_plumm_desc:0 "Piçler, sahte babalardan toprak iddia ettiğinde savaşlar başlar; ama Viserys Plumm için durum farklı. Başka bir kabul edilebilir varisin olmayışı — ve 'Değersiz' Aegon'un öfkesini çekmek istemeyişi — tüm şüpheleri bir kenara bıraktırdı. Bir lordun hayatına yerleşen Viserys, tahta karşı pek hırs göstermiyor ve bir taşra lordunun hayatının tadını çıkarıyor. #bold Peki onu izleyecek gizlenmiş ejderha nesli ne olacak? Viserys mor maskaralığını bir kenara bırakıp kırmızı ve siyahın pelerinini üstlenebilir mi?#!"
 challenge_character_239_gerold_lannister:0 "Lord Gerold"
 challenge_character_239_gerold_lannister_desc:0 "'Altın' Gerold'u bin bir söylenti sarıyor. Batı'yı yönetimi büyük refah getirmiş olabilir; ama küçük halk, kardeşini, yeğenini ve iki karısını yollarına çıktıkları anda öldürdüğünü fısıldıyor. Şimdi oğullarından ikisi tacın düşmanlarıyla savaşırken düştü; Reyne Hanedanı ile evlilik anlaşmasıysa bir Blackfyre kılıcıyla paramparça oldu. Yine de Ellyn Reyne, ölümün yoluna çıkmasına izin verecek biri değil. #bold Lannister Hanedanı bir nesil daha refah getirebilecek mi, yoksa zayıf iradeli bir yavru Gerold'un kurduğu her şeyi mi yok edecek?#!"
 challenge_character_259_aemon_tarth:0 "Lord Aemon"
 challenge_character_259_aemon_tarth_desc:0 "Pire Dibi'nden bir köylünün ve yükseklerden bir prensesin günahlarının sonucu olarak ne elde edersiniz? Günlerini Safir Adası'nda geçirmeye çalışan sessiz bir lord. Verasetine dair her soruyu ortadan kaldırmak için kuzeniyle evlenen Lord Aemon bir isyanla karşı karşıya değil. #bold Ama Dar Deniz'in ötesinde, piç ejderha kanından bir başkası bir ordu topluyor; Aemon, doğumunun sırrını saklayıp Tarth'ı 'Canavar' denen adamdan koruyabilecek mi?#!"
 challenge_character_277_loreza_martell:0 "Prenses Loreza"
 challenge_character_277_loreza_martell_desc:0 "Kral zincire vurulmuş durumda; Ejderha Kayası Prensi ise hâlâ nişansız. Belki de yakışıklı Prens Rhaegar, Demir Taht ile en güneydeki tebaası arasındaki köklü bağları güçlendirmek için bir Dorne Prensesi'ni gelin almaya ikna edilebilir. #bold Diyar nefesini tutmuş beklerken, Prenses Loreza Martell kızı Elia ile veliaht arasında bir nişan ayarlayabilecek mi?#!"
 challenge_character_277_beric_dayne:0 "Lord Beric"
 challenge_character_277_beric_dayne_desc:0 "Lord Beric Dayne için hayat güzel: Soyu sürdürmeye hazır bir ağabey oğul ve varis, diyarın en büyük şövalyelerinden sayılan küçük bir oğul, olgunlaşan güzel bir kız ve yanında sevgi dolu bir eş. Duskendale'deki bir isyan haberi manzarayı bulandırsa da, düşen bir yıldız Dayne Hanedanı için bir kez daha bereketli olabilir. #bold Prens Rhaegar Targaryen henüz evli değilken, Yıldız Düşüşü'nün kâhyaları geleceğin kralıyla bir nişan ayarlayabilecek mi?#!"
 challenge_character_282_walter_whent:0 "Lord Walter"
 challenge_character_282_walter_whent_desc:0 "O kader turnuvasından bu yana ne çok şey değişti... Açık elli olduğu kadar zengin biri olarak bilinen Lord Walter Whent, Harrenhal tarihinin en önemli anlarından birine ev sahipliği yaptı: Diyarı paramparça eden turnuva. Prens Rhaegar'ın zaferi ve Lyanna Stark'ı Aşk ve Güzellik Kraliçesi olarak taçlandırması, bu lanetli savaşı — ve onun körüklediği bölünmeyi — ateşledi. #bold Diyar savaşa hazırlanırken Walter, kayınbiraderi ve taban beyi Lord Hoster Tully ile kendi kardeşi ve Kral Muhafızı Ser Oswell Whent arasında seçim yapmak zorunda.#!"
 challenge_character_282_walder_frey:0 "Lord Walder"
 challenge_character_282_walder_frey_desc:0 "Yedi Krallık'ta çok az kişi Lord Walder Frey kadar uzun yönetmiştir; ailesine yapılan haksızlıkları bu kadar uzun hatırlayan ise daha da azdır. Savaş diyarı kasıp kavururken iki taraftaki ittifaklar, uzun zamandır kendi aralarında evlilik pazarlıkları yapan lordlar için sıradan bir muhasebe gibi görünüyor — istenmeyen haneler her fırsatta geri çevrilmiş. #bold Kimileri kaosa merdiven der; ama Walder onu bir köprü olarak görüyor... Frey Hanedanı ve sayısız, #italic sayısız#! çocuğu için daha iyi bir hayata uzanan bir köprü.#!"
 challenge_character_284_jon_arryn:0 "Kralın Eli Jon"
 challenge_character_284_jon_arryn_desc:0 "Savaş kazanmak başka şey, diyarı yönetmek başka. Kral I. Robert Baratheon Demir Taht'a oturduğuna göre, akıl hocası ve dostu Lord Jon Arryn'i Kralın Eli olarak barış ve refahı güvence altına almasına yardım etmesi için seçti. #bold Yanında genç, #italic elbette#! güvenilir bir Tully geliniyle Jon, Kralın Şehri'ndeki yeni görevinden hem Yedi Krallık'ı hem de Vadi'deki kendi verasetini güvence altına alabilecek mi?#!"
 challenge_character_284_petyr_baelish:0 "'Serçeparmak' Lord Petyr"
 challenge_character_284_petyr_baelish_desc:0 "Düşmanlarını her zaman şaşkın tut. Kim olduğundan ya da ne istediğinden asla emin olamazlarsa, sırada ne yapacağını da bilemezler. Bazen onları şaşırtmanın en iyi yolu, hiçbir amacı olmayan — hatta sana karşı işliyormuş gibi görünen — hamleler yapmaktır. #bold Tek oyunu oynamaya geldiğinde bunu hatırla... #italic taht oyunlarını#!!#!"
