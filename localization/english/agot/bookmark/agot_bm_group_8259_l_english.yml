 agot_bm_group_8259:0 "258 A.C."
 agot_bm_8259:0 "Dokuzpenny Kralları"
 agot_bm_8259_desc:0 "Doğuda bir Blackfyre iddiacısı yeniden yükseliyor: Gözü Demir Taht'ta olan ürkütücü yeni bir kaptan-general, Altın Bölük'ün komutasını ele geçirdi.\n\n'Canavar' Maelys adına yakışır biri; korsanların, kanun kaçaklarının ve sürgünlerin büyüyen ittifakı bu müstakbel krala destek sözü verdi. Kendi kendini Dokuzlar Çetesi diye adlandıran bu topluluk, Westeros'un lordlarına ve hanımlarına daha çok dert açabilir.\n\nAma Kral V. Aegon Targaryen'in, dışarıdaki tehdide denk düşen iç meseleleri de var. Küçük halkın şampiyonu olan kralın birçok reformu Yedi Krallık'taki yöneticileri huzursuz etti; çocuklarının geri çevirdiği nişanlar, sahip olduğu azıcık desteği de ekşitti. Batıda kargaşa hararete dönüştü: Kurnaz Lord Roger Reyne'in isyan riski, tekinsiz bir belirsizlikte bekliyor.\n\n#bold Kralın umudu, Asshai'nin kadim metinlerinde: Yeni bir refah çağını müjdeleyecek ejderhaların yeniden doğuşu. Ama etrafındaki cehennem büyüdükçe, onu bütünüyle yutma tehlikesi de büyüyor.#!"
 bookmark_259_maelys_blackfyre:0 "Kral I. Maelys"
 bookmark_259_maelys_blackfyre_subheading:0 "Blackfyre Varisliği"
 bookmark_259_maelys_blackfyre_desc:0 "[Concept( 'story_content_maelys_blackfyre_259', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_maelys_blackfyre_259', '$bm_story_content_available_copy|q$' )|E]\n'Canavar' Maelys'in damarlarında piç kanı akıyor; grotesk derecede güçlü bir savaşçı ve vahşi bir lider. Altın Bölük'ün kontrolünü ele geçirmek için tek yumrukla bir savaş atını öldürdü ve kuzeni Daemon'un kafasını gövdesinden kopardı. Şimdi, kötü niyetli destekçilerle kuşatılmış halde, Kara Ejder'in kaderini gerçekleştirecek güce sahip olabilir.\n\n#bold Kaba kuvvet savaşlar kazandırabilir; ama Maelys, Yedi Krallık'ı kendisi için alacak kurnazlığa ve inceliğe sahip olabilecek mi?#!"
 bookmark_259_aegon_targaryen:0 "Kral V. Aegon"
 bookmark_259_aegon_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_259_aegon_targaryen_desc:0 "[Concept( 'story_content_aegon_targaryen_259', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aegon_targaryen_259', '$bm_story_content_available_copy|q$' )|E]\nBir dördüncü oğulun dördüncü oğlu 'Beklenmedik' Aegon'un Demir Taht'a oturması kaderde yazmıyor gibiydi. Ama kader cilveli bir hanımefendidir: cana yakın Egg, Yedi Krallık'ı yirmi beş yıldır ustalıkla yönetiyor — küçük halkın hayatını iyileştirdi, bozulan nişanların üstesinden geldi, küçüğünden büyüğüne ayaklanmalara son verdi.\n\n#bold Bir isyanın daha eşiğinde, 'Canavar' Maelys'in komutasında bir Blackfyre ordusu toplanırken Aegon, ejderhaları geri getirme hayaliyle tükeniyor; ama bu hayal onun sonu mu olacak?#!"
 bookmark_259_betha_blackwood:0 "Kraliçe Betha"
 bookmark_259_duncan_targaryen:0 "Prens Duncan"
 bookmark_259_jaehaerys_targaryen:0 "Prens Jaehaerys"
 bookmark_259_jaehaerys_targaryen_subheading:0 "Ejderha Kayası Prensi"
 bookmark_259_jaehaerys_targaryen_desc:0 "Ejderha Kayası Prensi, büyük olasılıkla hastalıklı yapısı yüzünden birçokları tarafından zayıf sayılıyor; ama sınandığında kararlılığı hiç sarsılmıyor. Kız kardeşi Prenses Shaera'ya duyduğu aşkta olduğu gibi. Ağabeyleri 'Küçük' Prens Duncan, bir sıradanı gelin almak için kendi mirasını bir kenara bıraktığında Jaehaerys ders çıkardı — ve Shaera ile geleneksel Targaryen evliliğini gizlice yaptı ve gerdeğe girdi.\n\n#bold Doğuda isyan kaynarken, genç prens kaderinin dizginlerini ele alıp Targaryen Hanedanı'nın geleceğine nasıl yön verecek?#!"
 bookmark_259_shaera_targaryen:0 "Prenses Shaera"
 bookmark_259_aerys_targaryen:0 "Prens Aerys"
 bookmark_259_tytos_lannister:0 "Lord Tytos"
 bookmark_259_tytos_lannister_subheading:0 "Batı'nın Koruyucusu"
 bookmark_259_tytos_lannister_desc:0 "[Concept( 'story_content_tytos_lannister_259', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_tytos_lannister_259', '$bm_story_content_available_copy|q$' )|E]\n'Dişsiz Aslan' Tytos hiçbir zaman güçlü iradeli bir adam olmadı ve fazlasıyla güvenilir biriydi. Bir zamanlar neşeli doğasıyla 'Gülen Aslan' olarak bilinen Tytos, karısı Leydi Jeyne Marbrand'ın vefatıyla enerjisinin çoğunu kaybetti; başıboş taban beyleri de affedici taban beyinden yararlanmakta gecikmedi.\n\n#bold Castamere koltuğundan yeni bir aslan dişlerini gösterirken, Tytos Batı Toprakları'na düzeni geri getirecek iradeyi — ve bir yolu — bulabilecek mi? Yoksa inatçı yavruları, Lannister Hanedanı için işleri kendi ellerine mi alacak?#!"
 bookmark_259_tywin_lannister:0 "Ser Tywin"
 bookmark_259_kevan_lannister:0 "Kevan"
 bookmark_259_roger_reyne:0 "Lord Roger"
 bookmark_259_roger_reyne_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_259_roger_reyne_desc:0 "[Concept( 'story_content_roger_reyne_259', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_roger_reyne_259', '$bm_story_content_available_copy|q$' )|E]\n'Kızıl Aslan' Roger, kız kardeşi Ellyn ile Kaya'nın varisi Tion Lannister'ın kısa süren evliliği boyunca Casterly Kayası'nda çok zaman geçirdi. Ama Dördüncü Blackfyre İsyanı sırasında Tion'un ölümünün ardından, ailesinin geleceğini planlamak için Castamere madenlerine döndü.\n\n#bold Aslanın pençeleri keskindir; ama Lannister Hanedanı'nın neredeyse geçilmez koltuğuna uzanacak kadar uzunlar mı?#!"
 bookmark_259_walderan_tarbeck:0 "Lord Walderan"
 bookmark_259_ellyn_reyne:0 "Leydi Ellyn Reyne"
