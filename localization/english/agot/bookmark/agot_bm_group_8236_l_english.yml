 agot_bm_group_8236:0 "236 A.C."
 bookmark_236_lyonel_baratheon:0 "Lord Lyonel"
 bookmark_236_lyonel_baratheon_subheading:0 "Fırtına Toprakları'nın Yüksek Lordu"
 bookmark_236_lyonel_baratheon_desc:0 "[Concept( 'story_content_lyonel_baratheon_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_lyonel_baratheon_236', '$bm_story_content_available_copy|q$' )|E]\n'Gülen Fırtına' olarak bilinen Lord Lyonel Baratheon, kendini beğenmiş bir dev. 209 A.C.'de Ashford Çayırı turnuvasında şanla donandı; ne var ki o kader müsabakasının üzerinde karanlık bir gölge asılı. Genç Prens Aegon, Lord Lyonel'i Ser 'Uzun' Duncan'ın Yediler Denemesi'ne katılmaya davet etmişti... Bedeli ağır bir zafer.\n\nŞimdi bir Blackfyre isyanı yaklaşırken, Kral V. Aegon Targaryen en büyük oğlu ve varisi Prens Duncan Targaryen'i Lord Lyonel'in kızıyla nişanlayarak bir ittifak kurmayı umuyor — #bold ama Gülen Fırtına bir kez daha kazanan tarafta mı yer alacak?#!"
 bookmark_236_ormund_baratheon:0 "Ormund"
 bookmark_236_cassandra_baratheon:0 "Cassandra"
 bookmark_236_aegon_targaryen:0 "Kral V. Aegon"
 bookmark_236_aegon_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_IRON_THRONE_DEFAULT$"
 bookmark_236_aegon_targaryen_desc:0 "[Concept( 'story_content_aegon_v_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aegon_v_236', '$bm_story_content_available_copy|q$' )|E]\nKral V. Aegon Targaryen'in saltanatı, sonunda sona eren sert bir kışın ortasında başladı. Yönetiminin ilk yıllarında Beklenmedik Kral, açlıktan kırılan halka yardım için devasa yiyecek ve tahıl sevkiyatları göndererek küçük halkın hayranlığını kazandı. Köylüler onu sevse de diyarın lordları arasında, kralın yeni reformlarıyla güçlerinin kısıtlandığını hissedenler var.\n\n#bold Diyarın lordları hak ettikleri kralın arkasında mı toplanacak, yoksa yüzlerini mi döndürüp Daemon Blackfyre'ın davasına katılacak?#!"
 bookmark_236_duncan_targaryen:0 "'Küçük' Prens Duncan"
 bookmark_236_duncan_targaryen_subheading:0 "Ejderha Kayası Prensi"
 bookmark_236_duncan_targaryen_desc:0 "Kralın akıl hocası ve eski dostu Ser 'Uzun' Duncan'ın adını taşıyan 'Küçük' Prens Duncan, kralın ilk oğlu, Ejderha Kayası Prensi ve Demir Taht'ın varisi. Babasının, Targaryen Hanedanı'nın diyarın yüksek lordlarıyla bağlarını güçlendirmek ve kralın reformları ışığında incinen egolarını yatıştırmak için nişanıyla ilgili yüksek planları var. Ne var ki Duncan inatçı bir prens. Babası aşk için evlendiyse, o neden yapmasın?\n\n#bold 'Küçük' Duncan diyara ve kralına karşı görevini koruyacak mı, yoksa kendi seçtiği bir gelinle mi evlenecek?#!"
 bookmark_236_jaehaerys_targaryen:0 "Prens Jaehaerys"
 bookmark_236_betha_blackwood:0 "'Kara' Betha"
 bookmark_236_duncan_tall:0 "Ser Duncan"
 bookmark_236_gerold_lannister:0 "'Altın' Lord Gerold"
 bookmark_236_gerold_lannister_subheading:0 "Batı'nın Koruyucusu"
 bookmark_236_gerold_lannister_desc:0 "Casterly Kayası Lordu ve Batı'nın Koruyucusu Gerold Lannister, kardeşi Tybolt ile yeğeni Cerelle'in şüpheli ve erken ölümlerinin ardından yönetime başladı. Hem taban beyleri hem küçük halk, onun bir akraba katili olduğuna inanarak ona sevgi beslemiyor. Yine de yönetimi refah getirdi ve 'Altın' Gerold, Lannister Hanedanı'nın zenginliğini ve etkisini büyük ölçüde artırabildi. Ama bir zamanlar yetenekli lord artık yatak odasına hapsolmuş durumda; Casterly Kayası'nın yönetimi, oğlu ve varisi Tion'un karısı hırslı Leydi Ellyn Reyne'e kaldı.\n\n#bold Altın aslan, gücünün ve mirasının kırmızı bir dişi aslanın kapmacı pençelerine düşmesine izin verecek mi?#!"
 bookmark_236_ellyn_reyne:0 "Ellyn"
 bookmark_236_tion_lannister:0 "Ser Tion"
 bookmark_236_bittersteel:0 "Kaptan-General Aegor"
 bookmark_236_bittersteel_subheading:0 "Altın Bölük'ün Kaptan-Generali"
 bookmark_236_bittersteel_desc:0 "[Concept( 'story_content_bittersteel_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_bittersteel_236', '$bm_story_content_available_copy|q$' )|E]\nAteş ve öfkeyle yönlenen Aegor 'Acıçelik', Yedi Krallık'ın ötesinde şan kazandı. Altın Bölük'ün azılı Kaptan-Generali, III. Daemon Blackfyre'ı Demir Taht'ın hak ettiği Kral olarak taçlandırdı ve ikili Westeros'u istila etmeyi planlıyor. Altın Bölük, Blackfyre Ordusu ve davalarına katılmayı seçen lordların birleşik gücü, sahte Kral V. Aegon ve sadıkları için kesinlikle müthiş bir meydan okuma olacak.\n\n#bold Acıçelik sonunda Demir Taht'a bir Blackfyre oturtabilecek mi?#!"
 bookmark_236_daemon_blackfyre:0 "Kral III. Daemon"
 bookmark_236_daemon_blackfyre_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_236_daemon_blackfyre_desc:0 "[Concept( 'story_content_daemon_blackfyre_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_daemon_blackfyre_236', '$bm_story_content_available_copy|q$' )|E]\nI. Haegon Blackfyre'ın en büyük oğlu ve üçüncü adının sahibi III. Daemon Blackfyre, Tyrosh'ta Aegor 'Acıçelik' Rivers tarafından taçlandırıldı. Blackfyre Hanedanı için sonunda Demir Taht'ı almak umuduyla, sürgün şövalyeler ve Özgür Şehirler'in savaşçılarından oluşan bir orduyu Dar Deniz'in ötesine yelken açtırıyor. Korkunç Acıçelik yanında dursa da Daemon'un diyarın bazı lordlarını kendi davasına çekmesi gerekiyor.\n\n#bold Dördüncü Blackfyre İsyanı sonunda başarılı olacak mı?#!"
 bookmark_236_maelys:0 "'Canavar' Maelys"
 bookmark_236_aemond_blackfyre:0 "Prens Aemon"
