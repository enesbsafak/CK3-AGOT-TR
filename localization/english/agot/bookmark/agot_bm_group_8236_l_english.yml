### TODO NOT-IN-ST: bookmark_236_duncan_targaryen_desc [AGOT: Named after the king’s mentor and old friend, Ser Duncan ‘the Tall,’ Prince Duncan ‘the Small’ is the king’s firstborn son, Prince of Dragonstone, and heir to the Iron Throne. His father has lofty plans for his betrothal, to strengthen House Targaryen’s ties to the high lords of the realm and soothe their wounded egos in the light of the king’s reforms. Duncan, however, is a willful prince. If his father married for love, why shouldn’t he do so as well?\n\n#bold Will Duncan ‘the Small’ keep his duty to the realm and his king, or will he wed a bride of his own choosing?#!]
 bookmark_236_duncan_targaryen_desc:0 "Named after the king’s mentor and old friend, Ser Duncan ‘the Tall,’ Prince Duncan ‘the Small’ is the king’s firstborn son, Prince of Dragonstone, and heir to the Iron Throne. His father has lofty plans for his betrothal, to strengthen House Targaryen’s ties to the high lords of the realm and soothe their wounded egos in the light of the king’s reforms. Duncan, however, is a willful prince. If his father married for love, why shouldn’t he do so as well?\n\n#bold Will Duncan ‘the Small’ keep his duty to the realm and his king, or will he wed a bride of his own choosing?#!"
