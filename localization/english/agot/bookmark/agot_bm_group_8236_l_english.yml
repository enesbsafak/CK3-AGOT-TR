### TODO NOT-IN-ST: bookmark_236_aegon_targaryen_desc [AGOT: [Concept( 'story_content_aegon_v_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aegon_v_236', '$bm_story_content_available_copy|q$' )|E]\nKing Aegon V Targaryen’s reign began in the midst of a harsh winter, which has now finally ended. In the first years of his rule, the Unlikely King sent massive shipments of food and grain to aid a starving population, winning himself the admiration of the smallfolk. Though he is beloved by the peasantry, among the lords of the realm there are those who feel their powers curtailed by the king’s new reforms.\n\n#bold Will the lords of the realm rally behind their rightful king, or will they turn cloak and join Daemon Blackfyre’s cause?#!]
 bookmark_236_aegon_targaryen_desc:0 "[Concept( 'story_content_aegon_v_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aegon_v_236', '$bm_story_content_available_copy|q$' )|E]\nKing Aegon V Targaryen’s reign began in the midst of a harsh winter, which has now finally ended. In the first years of his rule, the Unlikely King sent massive shipments of food and grain to aid a starving population, winning himself the admiration of the smallfolk. Though he is beloved by the peasantry, among the lords of the realm there are those who feel their powers curtailed by the king’s new reforms.\n\n#bold Will the lords of the realm rally behind their rightful king, or will they turn cloak and join Daemon Blackfyre’s cause?#!"
