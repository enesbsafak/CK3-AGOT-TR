### TODO NOT-IN-ST: bookmark_236_lyonel_baratheon_desc [AGOT: [Concept( 'story_content_lyonel_baratheon_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_lyonel_baratheon_236', '$bm_story_content_available_copy|q$' )|E]\nKnown as the ‘Laughing Storm,’ Lord Lyonel Baratheon is a swaggering giant of a man. He wreathed himself in glory at the tourney at Ashford Meadow in 209 A.C., though a dark shadow hangs over that fateful hastilude. It was a young Prince Aegon who bid Lord Lyonel join Ser Duncan ‘the Tall’ in his Trial of the Seven... A victory with a steep cost.\n\nNow, with another Blackfyre rebellion looming, King Aegon V Targaryen hopes to secure an alliance by betrothing his eldest son and heir, Prince Duncan Targaryen, to Lord Lyonel’s daughter — #bold but will the Laughing Storm join the winning side once more?#!]
 bookmark_236_lyonel_baratheon_desc:0 "[Concept( 'story_content_lyonel_baratheon_236', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_lyonel_baratheon_236', '$bm_story_content_available_copy|q$' )|E]\nKnown as the ‘Laughing Storm,’ Lord Lyonel Baratheon is a swaggering giant of a man. He wreathed himself in glory at the tourney at Ashford Meadow in 209 A.C., though a dark shadow hangs over that fateful hastilude. It was a young Prince Aegon who bid Lord Lyonel join Ser Duncan ‘the Tall’ in his Trial of the Seven... A victory with a steep cost.\n\nNow, with another Blackfyre rebellion looming, King Aegon V Targaryen hopes to secure an alliance by betrothing his eldest son and heir, Prince Duncan Targaryen, to Lord Lyonel’s daughter — #bold but will the Laughing Storm join the winning side once more?#!"
