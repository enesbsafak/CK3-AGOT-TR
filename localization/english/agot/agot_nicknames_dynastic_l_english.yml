 agot_nicknames.9000.t:0 "Hanedan Takma Adı"

 agot_nicknames.9000_desc:0 "Büyük haneler kurtlarıyla, aslanlarıyla, krakenleriyle ve köprüleriyle övünür; her biri armasının onları eşsiz kıldığına inanır. Oysa sembolleri övünçten ve böbürlenmekten başka bir şey değildir.\n\nBizim hanemiz farklı olacak. Sancağımız düşmanlarımıza korku, müttefiklerimize hayranlık aşılayacak. Bugünden itibaren [ROOT.Char.GetHouse.GetName] Hanesi, ilişkilendirildiği şeyle hatırlanacak...\n\n #help Seçilen kelime, Hanenize Hanedan Takma Adları sağlamak için çeşitli şablonlarda kullanılacaktır.\n\nÖrn. 'Kara X' 'Kızıl X'\n\nEn iyi sonuç için bir isim seçin!#"

