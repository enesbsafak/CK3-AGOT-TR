l_english:

 trait_esr_social_standing_neutral:0 "Sosyal Şahsiyet"

 trait_esr_social_standing_good:0 "İyi Bağlantılı"

 trait_esr_social_standing_bad:0 "Sosyal Dışlanmış"

 trait_esr_social_standing_mixed:0 "Karmaşık Karşılama"

 trait_track_esr_well_connected:0 "Sosyal Bağlantı"

 trait_track_esr_well_connected_desc:0 "Bir kalenin büyük salonunun işlemeli duvar halısı gibi, asil bir yürek sayısız bağ örer ve hayatın yolculuğunu zenginlik ve neşeyle süsler."

 trait_track_esr_popular_among_peers:0 "Akranlar Arası Popülerlik"

 trait_track_esr_popular_among_peers_desc:0 "Bir vasalın popülaritesinin gürültüsü salonlarda yankılandığında, tetikte bir derebeyi yalnızca çınlayan övgülere değil, fısıldayan endişelere de kulak verir."

 trait_track_esr_friends_in_high_places:0 "Yüksek Makamlarda Dostlar"

 trait_track_esr_friends_in_high_places_desc:0 "Yüksek dostların yanında kişi kendi talihinin de yükseldiğini görür; zira güç ve nüfuz salonlarında, henüz keşfedilmemiş fırsatların kapıları ardına kadar açılır."

 trait_track_esr_social_pariah:0 "Rakiplerden İftiralar"

 trait_track_esr_social_pariah_desc:0 "Güçlü hasımların zehirli dillerinden dökülen iftiralar kalpleri zehirler ve itibarları karalar; hakikatin savunması üzerine güneş battıktan çok sonra bile süren gölgeler bırakır."

 trait_esr_social_standing_neutral_desc:0 "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]'in hayatı, [ROOT.Char.GetSheHe]'nin edindiği dostlar ve düşmanlar yüzünden birden fazla şekilde etkileniyor."

 trait_esr_social_standing_good_desc:0 "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]'in köklü sosyal çevresi, [ROOT.Char.GetHerHis] diplomasi ve entrika çabalarını daha az zorlu kılıyor."

 trait_esr_social_standing_bad_desc:0 "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]'in sayısız güçlü düşmanının anlattığı hikâyeler, [ROOT.Char.GetHerHis] hakkında hiç de hoş olmayan bir tablo çizdi. Doğrulukları ne olursa olsun, iktidardakileri kızdırmaya cüret eden birinden korkmamak zordur."

 trait_esr_social_standing_mixed_desc:0 "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]'in adı farklı insanlar için çok farklı şeyler ifade ediyor. [ROOT.Char.GetHerHim] hakkında ne kadar çok soru sorulursa, [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]'in karakteri o kadar belirsizleşir."

 TRAIT_FLAG_DESC_esr_increased_swing_relation:0 "#bold Akranlar Arası Popülerlik#! [trait_level_track|E] seviyesini yükselterek [relations|E] kaynaklı [scales_of_power|E] salınımlarını artır #weak (seviye başına %10)#!"
