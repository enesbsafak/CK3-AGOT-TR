 agot_nw_ranger_events.0025.desc.intro_a:0 "[my_ranger.GetTitledFirstName] dönüyor; yaklaşırken nefesi soğuk havada görünüyor. Raporunu sunmaya hazırlanırken yüzü sakindir."

 agot_nw_ranger_events.0025.desc.intro_b:0 "[my_ranger.GetTitledFirstName] kampa geri adım atıyor, kırağı elbiselerine yapışmış; günün getirdiklerini anlatmaya hazırlanıyor."

 agot_nw_ranger_events.0025.desc.intro_c:0 "Kışın ısırıcı soğuğu hâlâ üzerindeyken [my_ranger.GetTitledFirstName] dönüyor; soğuğa rağmen adımları sağlam."

 agot_nw_ranger_events.0025.desc.intro_d:0 "[my_ranger.GetTitledFirstName] kampa yürüyor, pelerini kırağıdan ağır; ama rapor vermeye hazırlanırken gözünde bir amaç parıltısı var."

 agot_nw_ranger_events.0025.desc.intro_e:0 "[my_ranger.GetTitledFirstName] kampa giriyor, silueti kar yağışının önünde gölgeleniyor. Yüzü okunmuyor, ama üzerinde bir kesinlik havası var."

 agot_nw_ranger_events.0025.desc.mid_a:0 "O ve adamları, sert gecelerde kampı sıcak tutacak yakacak odun toplamak için ellerinde baltalarla ormana süzüldüler."

 agot_nw_ranger_events.0025.desc.mid_b:0 "Soğuk rüzgâr, ormanda yakacak odun ararken onları takip etti. Yıpratıcı bir işti, ama bir ateşin sıcaklığı her şeyi değiştirebilirdi."

 agot_nw_ranger_events.0025.desc.mid_c:0 "Adamlarını ormanın derinliklerine götürdü; donan gecelerde kampın ihtiyaç duyduğu sıcaklığı sağlayacak kadar kereste arıyordu."

 agot_nw_ranger_events.0025.desc.mid_d:0 "Ormanın derinliklerinde, ısıran soğuğa rağmen çalıştılar; kampa sıcaklık ve rahatlık getirecek odunları kestiler."

 agot_nw_ranger_events.0025.desc.mid_e:0 "O ve diğerleri günü odun keserek geçirdi; her kütüğün ateşleri yanık tutacağını ve Kuzey'in amansız soğuğunu savacağını biliyorlardı."

 agot_nw_ranger_events.0025.desc.success_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], başarılarını bildirirken hafifçe gülümsüyor. Topladıkları odun kamp ateşlerini yanık tutacak; soğuğu ve içeridekilerin zihnini hafifletecek."

 agot_nw_ranger_events.0025.desc.success_b:0 "\n\nBir baş sallamayla [my_ranger.GetTitledFirstNameNoTooltip], ateşleri kuvvetli tutacak kadar odun toplandığını, kampa sıcaklık ve ferahlık getirdiğini bildiriyor."

 agot_nw_ranger_events.0025.desc.success_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], görevin başarıyla sonuçlandığını açıklıyor. Kampın ateşleri artık daha parlak yanacak; sert soğuk bir süre daha uzak tutulacak."

 agot_nw_ranger_events.0025.desc.success_d:0 "\n\nYakacak odunun yeteceğini bildiriyor; soğuğun kampa yükünü hafifletiyor. Sıcaklık yalnızca ısı değil, amansız kıştan bir ferahlık getiriyor."

 agot_nw_ranger_events.0025.desc.success_e:0 "\n\nTopladıkları odun, ateşleri güçlü tutmaya yetecek kadar yığılmış. [my_ranger.GetTitledFirstNameNoTooltip], sıcaklığın kamptaki sinirleri yatıştırmaya yardımcı olacağını biliyor."

 agot_nw_ranger_events.0025.desc.fail_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] iç çekiyor, çabalarının boşa gittiğini anlatıyor. Soğuk çok derine işledi ve az odun toplandı. Soğuk hâlâ kampa musallat oluyor."

 agot_nw_ranger_events.0025.desc.fail_b:0 "\n\nKaşlarını çatarak [my_ranger.GetTitledFirstNameNoTooltip], görevin beklenenden zor olduğunu itiraf ediyor. Çok az odun getirildi ve kampın ateşleri yanık kalmakta zorlanıyor."

 agot_nw_ranger_events.0025.desc.fail_c:0 "\n\nBaşını öne eğiyor; toplanan yakacak odunun uzun süre yetmeyeceğini açıklıyor. Soğuk hâlâ sürüyor ve ısırığı kamptakilerin yüreklerini kemiriyor."

 agot_nw_ranger_events.0025.desc.fail_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] kaşlarını çatıyor, çabalarının yeterli odun üretmediğini itiraf ediyor. Kamp soğuk kalıyor ve ateşler zayıfça titriyor."

 agot_nw_ranger_events.0025.desc.fail_e:0 "\n\nTopladıkları odun, ateşleri yanık tutmaya yetmiyor. [my_ranger.GetTitledFirstNameNoTooltip], soğuğun, onu uzaklaştıracak bir sıcaklık olmadan kampı kemirmeye devam edeceğini biliyor."

 agot_nw_ranger_events.0025.a.success:0 "Kamp bu gece sıcak olacak."

 agot_nw_ranger_events.0025.a.failure:0 "Soğuk hâlâ sürüyor... en azından şimdilik."

