 agot_nw_ranger_events.0001.t.fr_to_lc:0 "Yeni Lord Kumandan"

 agot_nw_ranger_events.0001.desc:0 "Salonda ateşler kısık yanıyor ve Kara Kale'nin üzerine uzun gölgeler düşürüyor. Az önce bana bir haber ulaştı: Sur'un ötesine liderlik etmek için güvendiğim adam, Birinci Korucu [dead_first_ranger.GetFirstName] ölmüş. Kaybı ağır, ama Gece Nöbetçileri tereddüt edemez.\n\nKuzey'in soğuk rüzgârları yas için durmaz. Onun yerini alacak başka biri ayağa kalkmalı; güçlü, yetkin ve duvarlarımızın ötesindeki tehlikelerle yüzleşmeye hazır biri."

 agot_nw_ranger_events.0001.desc.fr_to_lc:0 "Salonda ateşler kısık yanıyor ve Kara Kale'nin üzerine uzun gölgeler düşürüyor. Az önce bana bir haber ulaştı: Lord Kumandan [dead_first_ranger.GetFirstName] ölmüş.\n\nKardeşler sözlerini söyledi ve artık Lord Kumandanlık yükünü ben taşımalıyım.\n\nKuzey'in soğuk rüzgârları yas ya da şüphe için durmaz. Benim yerime Birinci Korucu olacak biri bulunmalı; bir zamanlar benim yaptığım gibi Sur'un ötesini gözetleme yükünü taşıyabilecek bir adam."

 agot_nw_ranger_events.0001.desc.incapable:0 "Bana bir haber ulaştı: Şerefle ve cesaretle hizmet etmiş bir adam olan Birinci Korucu [dead_first_ranger.GetFirstName] artık görevini yerine getiremiyor. Sur'un ötesindeki tehlikeler ve geçen zaman sonunda ona yetişti.\n\nNöbet, Birinci Korucusuz kalmayı göze alamaz.\n\nKuzey'in soğuk rüzgârları yumuşamıyor ve artık [dead_first_ranger.GetFirstNameNoTooltip] bir zamanlar yaptığı gibi insanları Sur'un ötesine taşıyabilecek birini, onun halefini seçmek bana düşüyor."

 agot_nw_ranger_events.0001.desc.fr_deserted:0 "Bir zamanlar güvendiğim adam olan Birinci Korucu [dead_first_ranger.GetFirstName] kaçmış. İhaneti Nöbet'in üzerine ağır bir yük bindirdi ve hızla doldurulması gereken bir boşluk bıraktı.\n\nKuzey beklemez ve Sur'un ötesindeki tehlikeler her geçen gün artar. Saflarımızda tereddüte yer veremeyiz.\n\nŞimdi yeni bir Birinci Korucu atamalıyım; yetkin, güçlü ve ötedeki yüzleşmeye hazır biri. Nöbet buna bel bağladı ve biz tereddüt etmeyeceğiz."

 agot_nw_ranger_events.0001.desc.fr_to_lc_reclaim:0 "Sur bir kez daha elimizde. Kaybedilenler, yalnızca yeminlerle değil; kanla, azimle ve fedakârlıkla geri kazanıldı. Nöbet'i yıkımdan kurtaranların arasındaydım ve şimdi kardeşler beni Lord Kumandan seçti.\n\nYine de yeniden kuruluş bir unvanla bitmez. Gece Nöbetçileri, olması gerektiği gibi; berrak bir komuta ve yerlerinde güvenilir adamlarla yeniden inşa edilmeli.\n\nArtık eskisi gibi devriye gezemiyorum. Yeni bir Birinci Korucu seçilmeli; Sur'un ötesine önderlik edecek ve bu zor kazanılmış dönüşün boşa harcanmamasını sağlayacak biri."

 agot_nw_ranger_events.0001.a:0 "Yeni bir korucu ayağa kalkmalı."

 agot_nw_ranger_events.0001.a.tt:0 "[fr_candidate.GetTitledFirstName], Birinci Korucunuz olur"

 agot_nw_ranger_events.0002.t:0 "Yeni Bir Korucu Yükseliyor"

 agot_nw_ranger_events.0002.desc:0 "Karar verildi. Yeni Birinci Korucu [new_first_ranger.GetTitledFirstName] artık karşımda duruyor, Sur'un ötesindeki sorumluluğun yükünü taşımaya hazır. Yetenekli; becerisi ve cesareti için seçildi.\n\nGece Nöbetçileri'nin vahşi doğada gözü ve kulağı olmalı, o da öncümüz olacak. Şimdi içinde görev ateşi yanıyor ve çok geçmeden Kuzey'in soğuğuyla ve gölgesiyle yüzleşecek. Hikâyesinin nasıl ilerleyeceğini zaman gösterecek."

 agot_nw_ranger_events.0002.a:0 "Nöbet, her zaman olduğu gibi yoluna devam ediyor."

 agot_nw_ranger_events.0002.b:0 "Onu hangi tehlikelerin ve maceraların beklediğini merak ediyorum."

 agot_nw_ranger_events.0003.t:0 "Taşınacak Yeni Bir Görev"

 agot_nw_ranger_events.0003.desc:0 "Yeni unvanımın ağırlığı omuzlarıma çöküyor: Gece Nöbetçileri'nin Birinci Korucusu. Bu bir onur, ama beraberinde Sur'un ötesinde taşımam gereken bir yük getiriyor. Kaybedecek zaman yok. Yeni kampımı hazırlamam, erzak toplamam ve buz tutmuş vahşi doğada yanımda duracak adamları seçmem gerekecek.\n\nÖnümüzdeki tehlikeler sayısız, ama artık benim görevim bu. Sur'un savunması uyanıklığımıza bağlı ve ben başarısız olmayacağım.\n\nVahşi doğa çağırıyor ve cevap verme zamanı."

 agot_nw_ranger_events.0003.a:0 "Önümüzdeki yolculuk için hazırlanma zamanı geldi."

 agot_nw_ranger_events.0004.t:0 "Kuzgunun Kılıcı"

 agot_nw_ranger_events.0004.desc:0 "Bir kar fırtınası bizi hazırlıksız yakaladı; adamlarım ve ben yakındaki bir mağaraya sığınmak zorunda kaldık. Dışarıda rüzgâr şiddetli ve amansızca uluyor, ama bu buzlu duvarların içinde tuhaf bir sessizlik var. Fırtınadan huzursuz ve canı sıkılan ben, mağaranın daha derinlerini keşfetmeye karar verdim. Buz duvarlar loş ışıkta hafifçe parıldıyor ve gözüme gizli bir şey çarpıyor.\n\nİlk başta donmuş bir kaya parçası sanmıştım, ama buzu temizlediğimde bir farkındalık beni sarstı.\n\nEllerimde kayıp Valyria çeliği kılıcı [newly_created_artifact.GetName] duruyordu. Bir zamanlar Kan Kuzgunu diye bilinen [bloodraven.GetTitledFirstName] tarafından kuşanılan bu kılıç, burada unutulmuş ve buzun içine gömülmüş olarak yatıyordu. Soğuk, keskin ucuna elimi gezdirdiğimde kalbim hızla çarpıyor. Kuşaklar boyunca kayıp olan efsane kılıç bulundu."

 agot_nw_ranger_events.0004.a:0 "Kara Kız Kardeş... hangi sırlara tanık oldun?"

 agot_nw_ranger_events.0005.t:0 "Dönek Korucu"

 agot_nw_ranger_events.0005.desc:0 "Bana bir haber ulaştı, keşke doğru olmasaydı: Birinci Korucum görevini terk etmiş. İnsan diyarlarını korumak, Gece Nöbetçileri'ni savunmak için güvenilen bir adam, pelerinini ters çevirip Sur'un ötesindeki vahşi doğada kayboldu. İhaneti, Kuzey'in soğuk rüzgârlarından daha derin yaralıyor. Yeminleri, hepimizi bağlayan görevi biliyordu; yine de onları bozmayı seçti.\n\nNöbet, kaçaklara hoşgörü göstermez. Şimdi yeni bir av başlıyor. Nereye kaçarsa kaçsın onu bulacağız, çünkü kardeşlerine ihanet edenleri tek bir kader bekler."

 agot_nw_ranger_events.0005.a:0 "Kaçak, Nöbet'in adaletiyle yüzleşecek."

 agot_nw_ranger_events.0006.t:0 "Korucunun Haraçı"

 agot_nw_ranger_events.0006.desc:0 "Gelenek gereği, Sur'un ötesinden döndükten sonra topladığım altını Lord Kumandan'a sunmak bana düşer."

 agot_nw_ranger_events.0006.desc.gold:0 "Nöbet'in sert kışlara ve bitmek bilmeyen tehditlere karşı ayakta kalabilmesi için her sikkeye ihtiyacı var. Elimden geleni katmak benim görevim. Kesemdeki altın ağır; riskle ve kanla kazanılmış küçük bir servet.\n\nLord Kumandan bekliyor, Nöbet'i ayakta tutacak haraç. Burada işler böyle yürür: her şeyin üstünde görev."

 agot_nw_ranger_events.0006.desc.nogold:0 "Nöbet, hayatta kalmak için her sikkeye güvenir. Ama bu sefer kesem boş. Hazine bulunamadı ve Sur'u ayakta tutacak tek bir sikke bile sunulamaz. Lord Kumandan haraç bekliyor, ama verecek hiçbir şeyim yok. Boş bir kesenin sessizliği, altının ağırlığından bile daha ağır."

 agot_nw_ranger_events.0006.a:0 "Her şeyin üstünde görev; her sikkeyi Nöbet'e veriyorum."

 agot_nw_ranger_events.0006.b:0 "Bir kısmını kendime saklayacağım... kimsenin bilmesine gerek yok."

 agot_nw_ranger_events.0006.b.tt:0 "Lord Kumandan öğrenirse sonuçları ağır olabilir"

 agot_nw_ranger_events.0006.c:0 "Bu sefer sunacak hiçbir şeyim yok."

 agot_nw_ranger_events.0007.t:0 "Korucunun Haraçı"

 agot_nw_ranger_events.0007.desc:0 "Birinci Korucum, Sur'un ötesindeki yolculuğundan yorgun düşmüş halde döndü. Karşımda dururken ne getirdiğini görmeyi bekliyorum. Sur'un ötesinde kaynaklar kıttır ve toplanabilen her ganimet, Nöbet'in hayatta kalması için hayati önem taşır.\n\nOrada hayatta kalmak başlı başına bir ödüldür, ama burada, Kara Kale'de bizi ayakta tutan haracın ta kendisidir."

 agot_nw_ranger_events.0007.a:0 "Nöbet buna bel bağlamış durumda. Her sikke önemlidir."

 agot_nw_ranger_events.0007.a.broke:0 "Hiç mi? Nöbet'in erzağa umutsuzca ihtiyacı var."

 agot_nw_ranger_events.0007.a.insult:0 "Fark etmeyeceğimi mi sandın? Bir şeyler gizliyorsun."

 agot_nw_ranger_events.0007.a.suspicion:0 "Umarım hepsi bu kadardır ve dönüş yolunda bir kısmı #italic 'kaybolmamıştır'#!?"

 agot_nw_ranger_events.0008.t:0 "Bir Kardeşin İhaneti"

 agot_nw_ranger_events.0008.desc:0 "Sabah soğuk ve sessiz doğuyor, kamp hâlâ kar altında. Ateşin çevresinde toplanırken aydınlanıyorum: bir adamımız eksik. Kardeşlerimin yüzlerini tarıyorum ve gerçek gün yüzüne çıkıyor. [turncloak.GetTitledFirstName] ortada yok. Adamlarımdan biri öne çıkıyor, haber üzerimize bir gölge gibi çöküyor: [turncloak.GetTitledFirstNameNoTooltip] yeminini bozmuş, Nöbet'i terk etmiş ve bir yabanıl reisine kaçmış.\n\nBir dönek. Bu düşünce bile içimi yakıyor; kampta esen rüzgârlar kadar soğuk bir ihanet. O bizden biriydi, aynı göreve yemin etmişti ve şimdi hepsini çöpe attı.\n\nAramızda düşmanlar varken vahşi doğa zaten yeterince tehlikeli."

 agot_nw_ranger_events.0008.a:0 "[turncloak.GetTitledFirstNameNoTooltip] şu ya da bu şekilde adalete teslim edilecek."

 agot_nw_ranger_events.0009.t:0 "Bir Sıcaklık Anı"

 agot_nw_ranger_events.0009.desc:0 "Ateş hafifçe çıtırdıyor, sıcaklığı gecenin keskin soğuğunu kırıyor. Bir an için başımı çevirip [ranger_camper_one.GetTitledFirstName] ve [ranger_camper_two.GetTitledFirstName]nın gülüştüğünü görüyorum; Sur'un ötesinde katlandığımız zorlu koşullara rağmen moralleri yerinde. Rüzgâr uluyabilir, soğuk ısırabilir, ama şimdilik ateşin çevresinde bir kardeşlik duygusu var.\n\nNadir olduğu kadar bu anlar, karanlığa ve buza neden katlandığımızı bana hatırlatıyor.\n\nBuz tutmuş vahşi doğada bile, kardeşler arasındaki bağ bizi bir arada tutuyor."

 agot_nw_ranger_events.0009.a:0 "Bu anlar, zorlukları katlanılır kılıyor."

 agot_nw_ranger_events.0010.t:0 "Soğukta Gerginlik"

 agot_nw_ranger_events.0010.desc:0 "Ateş kısık yanıyor, sıcaklığı kamptaki gerginliği pek hafifletmiyor. [ranger_camper_one.GetTitledFirstName] ve [ranger_camper_two.GetTitledFirstName] yine kavga ediyor, sesleri alevlerin çıtırtısını bastırıyor. Önemsiz bir anlaşmazlık olarak başlayan şey, çabucak hararetli bir tartışmaya dönüştü.\n\nSur'un ötesindeki buz gibi rüzgârlar amansız, ama kardeşler arasındaki soğukluk da aynı derecede keskin olabiliyor. Aramızda çatlaklar oluşurken burada hayatta kalmak zaten yeterince zor. Buranın sertliği yalnızca bedenlerimizi değil, bağlarımızı da sınıyor. Ve şu anda bu bağlar kırılgan görünüyor.\n\nVahşi doğa affetmez ve bizi yavaş yavaş yıpratmaya başladığı besbelli."

 agot_nw_ranger_events.0010.a:0 "Soğuk, yalnızca kemikleri kırmaz."

 agot_nw_ranger_events.0011.t:0 "Yolun Sonu"

 agot_nw_ranger_events.0011.desc:0 "Artık her adımın ağırlığını hissediyorum, her biri bir öncekinden daha acı verici. Soğuk kemiklerime işledi ve bir zamanlar sahip olduğum güç yok oldu.\n\nBirinci Korucu olarak hizmet ettim, insanları Sur'un ötesine taşıdım, başkalarını kıracak tehlikelerle yüzleştim; ama şimdi kırılan benim. Bu görevde daha fazla devam edemem.\n\nKenara çekilme zamanım geldi; Lord Kumandan'a Birinci Korucu'nun yükünü taşıyacak birini bulması gerektiğini bildirmem gerek. Nöbet'in güçlü, yetkin ve liderliğe hazır birine ihtiyacı var.\n\nO artık ben değilim."

 agot_nw_ranger_events.0011.a:0 "Lord Kumandan'a yeni bir Birinci Korucu seçmesini bildirmeliyim."

 agot_nw_ranger_events.0012.t:0 "Kuzguna Ölüm"

 agot_nw_ranger_events.0012.desc:0 "Kuzgun, o sözde Birinci Korucu, halkımın özgürlüğünü tehdit ediyor. [recipient.GetSheHe|U] bize, Özgür Halk'a karşı duruyor ve [recipient.GetHerHim]nın bir devriyeye daha liderlik etmesine izin vermeyeceğim. Harekete geçme zamanı.\n\nSavaşçılarımdan birini [recipient.GetHerHim]nı avlaması için göndereceğim ve bu tehdidi kesin olarak sona erdireceğim. Kuzgun ölmeli ve bunu yalnızca en güçlü, en kurnaz savaşçı başarır."

 agot_nw_ranger_events.0012.a:0 "Git ve [recipient.GetSheHe]nın bir daha geri dönmemesini sağla."

 agot_nw_ranger_events.0012.b:0 "Bunu kendim yapacağım."

 agot_nw_ranger_events.0013.t:0 "Vahşi Doğada Pusu"

 agot_nw_ranger_events.0013.desc:0 "Sur'un ötesinde görevlerimi yerine getirirken ani bir hareket gözüme çarpıyor. Daha tepki veremeden bir yabanıl, elinde mızrak, [wildling_ambusher.GetHerHis] gözlerinde öfkeyle ağaçların arasından fırlıyor. [wildling_ambusher.GetSheHe]nın kan için, benim kanım için burada olduğu açık. Düşünecek zaman yok, yalnızca savaşmak var.\n\nSoğuk rüzgâr ulurken beni olduğum yerde öldürmeye kararlı o yabanılla [wildling_ambusher.GetHerHim] yüzleşmeye hazırlanıyorum."

 agot_nw_ranger_events.0013.a:0 "[wildling_ambusher.GetSheHe]nın buna pişman olmasını sağlayacağım."

 agot_nw_ranger_events.0014.t.win:0 "Kuzgunun Sonu"

 agot_nw_ranger_events.0014.t.lose:0 "Kuzgun Kaçıyor"

 agot_nw_ranger_events.0014.desc.win:0 "Savaşçım geri dönüyor ve yüzüme bir gülümseme yayılıyor. Kuzgun öldü. [wildling_ambusher.GetFirstNameNicknamed], [wildling_ambusher.GetHerHis] ellerinde Birinci Korucu'nun kanıyla dönüyor: Özgür Halk için bir zafer.\n\nSur'un ötesinde pusuya yatan tehdit susturuldu ve kuzgunlar liderlerinin kaybıyla titreyecek."

 agot_nw_ranger_events.0014.desc.lose:0 "Geri dönen haber umduğum gibi değil. Kuzgun yaşıyor. Savaşçım başarısız oldu ve Birinci Korucu hâlâ bir tehdit. Hesabı yanlış yaptık; artık kuzgunlar üzerlerine geldiğimizi biliyor. Bu savaş henüz bitmedi."

 agot_nw_ranger_events.0014.a.win:0 "Kuzgunlar artık bizden korkacak."

 agot_nw_ranger_events.0014.a.lose:0 "[recipient.GetSheHe|U] bir dahaki sefere kaçamayacak."

 agot_nw_ranger_events.0016.t:0 "Gölgeler İçin Bir Kılıç"

 agot_nw_ranger_events.0016.desc:0 "Sur'a geri döndüğümde, Lord Kumandan'ın makamının huzurunda duruyorum. Saflar, şan ve Sur'un ötesinde kendilerini kanıtlama şansı arayan adamlarla dolu\n\nŞimdi içlerinden birini kampımıza katılması ve vahşi doğada yanımızda durması için seçme şansım var. Güçlü, güvenilir ve Sur'un ötesindeki tehlikelerle yüzleşmeye hazır birine ihtiyacım var."

 agot_nw_ranger_events.0016.desc.first:0 "Lord Kumandan'ın makamının huzurunda duruyorum. Saflar, şan ve Sur'un ötesinde kendilerini kanıtlama şansı arayan adamlarla dolu\n\nŞimdi içlerinden birini kampımıza katılması ve vahşi doğada yanımızda durması için seçme şansım var. Güçlü, güvenilir ve Sur'un ötesindeki tehlikelerle yüzleşmeye hazır birine ihtiyacım var."

 agot_nw_ranger_events.0016.desc.second:0 "Bir korucu daha, ve Sur'un ötesine sefere çıkmaya hazır olacağız."

 agot_nw_ranger_events.0016.a:0 "Umarım hazırsındır."

 agot_nw_ranger_events.0016.a.tt:0 "[ranger_candidate.GetTitledFirstName], Korucu Kampınıza katılıyor"

 agot_nw_ranger_events.0017.t:0 "Yeni Bir Gün"

 agot_nw_ranger_events.0017.desc.fr:0 "Sur, her zaman olduğu gibi, bilinmeyene karşı bir nöbetçi gibi ayakta duruyor. Görevlerimi yerine getiriyorum, arazide devriye geziyor ve adamları düzene sokuyorum. Uzakta, Lord Kumandan'ın günün işlerini yönettiğini görüyorum; sesi buz gibi havayı yarıyor. Her kararı, Nöbet'in ağırlığını ve ona yemin etmiş canları taşıyor.\n\nİçimde bir parça, böyle bir sorumluluğu taşımanın nasıl bir his olduğunu merak ediyor."

 agot_nw_ranger_events.0017.desc.lc:0 "Lord Kumandan olarak görevlerimi yerine getirirken Sur, ufka karşı amansızca yükseliyor. Adamların arasında Birinci Korucu'yu seçiyorum. Sur'un ötesindeki tehlikeleri bilen birinin sessiz gücüyle taşıyor kendini.\n\nOnu izlerken, onun yerine geçmenin, vahşi doğayla ve bilinmeyenle doğrudan yüzleşmenin nasıl olacağını merak ediyorum."

 agot_nw_ranger_events.0017.a:0 "Kendi görevlerime odaklanmalıyım."

 agot_nw_ranger_events.0017.b:0 "Onun yerinde olmanın nasıl bir his olduğunu merak ediyorum."

 agot_nw_ranger_events.0017.c:0 "Şu an meşgulüm."

 agot_nw_ranger_events.0017.c.tt:0 "Yeni bir Lord Kumandan seçilene dek bir daha size sorulmayacak."

 agot_nw_ranger_events.0018.t:0 "Yeni Bir Gün"

 agot_nw_ranger_events.0018.desc.lc:0 "Lord Kumandan olarak liderliğin ağırlığı omuzlarımda. Kardeşler yol göstermemi bekliyor ve her karar Nöbet'in geleceğini şekillendirecek. Soğuk hava, komutanın dile getirilmemiş yüklerini taşıyor; ama görev çağırıyor ve Sur dayanmalı."

 agot_nw_ranger_events.0018.desc.fr:0 "Sur'un ötesinde bilinmeyen yatıyor ve onunla yüzleşmeye hazır olmamızı sağlamak benim görevim. Karda her iz, rüzgârda her fısıltı; dinlemek ve harekete geçmek benim görevim. Sur dayanır, ben de dayanmalıyım."

 agot_nw_ranger_events.0018.a:0 "Yapılacak işler var."

 agot_nw_ranger_events.0019.t:0 "Gece Nöbetçileri'nin Çöküşü"

 agot_nw_ranger_events.0019.desc:0 "Sur hâlâ ayakta, ama artık bizim değil. Nöbet'in sancakları indirildi, kaleleri bir başkası tarafından sahiplenildi. Bir zamanlar kardeşim diyenler şimdi diz çöküyor ya da karda ölü yatıyor. Ettiğimiz yeminler, artık burayı yönetenler için hiçbir anlam ifade etmiyor.\n\nArtık Birinci Korucu değilim. Görevim elimden alındı ve önümdeki yol belirsiz."

 agot_nw_ranger_events.0019.desc.republic:0 "Sur hâlâ ayakta, ama bir zamanlar tanıdığım Nöbet yok oldu. Yeminler, gelenekler, uğruna yemin ettiğimiz gaye; hepsi bir kenara atıldı. Artık burada yeni bir düzen hüküm sürüyor; eski yolları izlemeyen bir düzen. Gece Nöbetçileri başka bir şeye, artık tanımadığım bir şeye dönüştü.\n\nÖnemli olan hiçbir anlamıyla artık Birinci Korucu değilim. Buradaki yerim kayboldu ve önümdeki seçim net."

 agot_nw_ranger_events.0019.a:0 "Ve artık nöbetim sona erdi..."

 agot_nw_ranger_events.0019.a.tt:0 "...ama yeni bir yolculuk başlıyor."

 agot_nw_ranger_events.0019.c:0 "Her şey böyle bitmez."

 agot_nw_ranger_events.0019.c.tt:0 "Kalan yıllarınızı Gece Nöbetçileri'ni yeniden inşa etmeye adarsınız."

 agot_nw_ranger_events.0019.b:0 "Benim için geriye hiçbir şey kalmadı."

 agot_nw_ranger_events.0019.b.tt:0 "Oyun bitti."

 agot_nw_ranger_events.0020.t:0 "Kuzeye Taşınan Bir İsim"

 agot_nw_ranger_events.0020.desc:0 "Bana söylenenlerin ağırlığını kavramam bir anımı alıyor. [SCOPE.sC('family_member').Custom2('RelationToMeShort', SCOPE.sC('first_ranger'))] [first_ranger.GetTitledFirstName], Birinci Korucu seçildi; Sur'un ötesindeki çetin yola ve o yolda yürüyeceklerin canlarına emanet edildi. Bu, don ve gölgenin, uzun gecelerin ve daha uzun anıların çağrısı.\n\nİçimde gurur kabarıyor, ama kaygının hemen yanı başında yürüyor; çünkü Sur'un kuzeyindeki hiçbir onur bedelsiz ödenmez."

 agot_nw_ranger_events.0020.a:0 "Lord Kumandan iyi bir seçim yapmış."

 agot_nw_ranger_events.0020.b:0 "Onun yerinde durmanın nasıl olacağını merak ediyorum."

 agot_nw_ranger_events.0021.t.success:0 "İzci: Yabanıllar Adımı Duyuyor"

 agot_nw_ranger_events.0021.t.failed:0 "İzci: Sözlerim Buzlu Kulaklarda Yitiyor"

 agot_nw_ranger_events.0021.desc.intro_a:0 "[my_ranger.GetTitledFirstName] kampa adım atıyor, nefesi soğuk havada buğulanıyor. Kararlı adımlarla yürüyor, yolculuğunun ağırlığı belli."

 agot_nw_ranger_events.0021.desc.intro_b:0 "[my_ranger.GetTitledFirstName], vahşi doğada geçirdiği günlerin ardından dönüyor. Buz gibi rüzgârlar izini bırakmış, ama gözlerinde başka bir şey var: rapor vermeye hazır olmanın işareti."

 agot_nw_ranger_events.0021.desc.intro_c:0 "Ateşin çıtırtısı sessizliği zar zor bölüyor; [my_ranger.GetTitledFirstName], yabanıllar arasındaki görevinden yeni dönmüş olarak öne adım atıyor."

 agot_nw_ranger_events.0021.desc.intro_d:0 "[my_ranger.GetTitledFirstName] kampa giriyor, pelerini kardan ağırlaşmış. Kaşlarındaki buzu silip öğrendiklerini paylaşmaya hazırlanıyor."

 agot_nw_ranger_events.0021.desc.intro_e:0 "Kalın karın içinden [my_ranger.GetTitledFirstName] dönüyor; yüzü sakindir ama gözleri yolculuğunun ağırlığını ele veriyor."

 agot_nw_ranger_events.0021.desc.mid_a:0 "[my_ranger.GetTitledFirstNameNoTooltip], adımı ve yaptıklarımı yaymak için tehlikeli arazide yol alarak yabanıl kampları arasında vakit geçirdi."

 agot_nw_ranger_events.0021.desc.mid_b:0 "Yabanıllar etkilenmesi güç bir halktır, ama [my_ranger.GetTitledFirstNameNoTooltip] yine de saygının tohumlarını ekmeyi umarak onlarla konuştu."

 agot_nw_ranger_events.0021.desc.mid_c:0 "Yabanıl kamplarında [my_ranger.GetTitledFirstNameNoTooltip], hayatta kalmanın her şeyden önemli olduğu bir yerde kulaklarını kazanmayı umarak gücümden ve liderliğimden söz eden hikâyeler anlattı."

 agot_nw_ranger_events.0021.desc.mid_d:0 "[my_ranger.GetTitledFirstNameNoTooltip], Kuzey'in sertliğinin orada yaşayanlara daha da sıkı yapıştığı yabanıl kamplarına girerek başarılarıma dair hikâyeler paylaştı."

 agot_nw_ranger_events.0021.desc.mid_e:0 "Yabanıl kamplarının ateşlerinin başında [my_ranger.GetTitledFirstNameNoTooltip] adımı andı; gönüllerini kazanmak için güç ve şeref hikâyeleri ördü."

 agot_nw_ranger_events.0021.desc.success_a:0 "\n\nÇabaları meyve verdi. Yabanıllar artık adımı temkinli bir saygıyla anıyor ve [my_ranger.GetTitledFirstNameNoTooltip] sözlerinin iz bıraktığını biliyor."

 agot_nw_ranger_events.0021.desc.success_b:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] başarıyı bildirirken hafifçe gülümsüyor. Yabanıllar gücümü kabul ederek benden fısıltıyla söz etmeye başladı."

 agot_nw_ranger_events.0021.desc.success_c:0 "\n\nBaşını sallıyor; adımı andığında yabanıl reislerinin nasıl dinlediğini anlatıyor. [my_ranger.GetTitledFirstNamePossessiveNoTooltip] sözleri, sizin hakkınızdaki algılarını değiştirmeye başladı."

 agot_nw_ranger_events.0021.desc.success_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], adımın artık yabanıl kamplarında yayıldığını, ateşlerinin başında yeni bir saygıyla fısıldandığını bildiriyor."

 agot_nw_ranger_events.0021.desc.success_e:0 "\n\n[my_ranger.GetTitledFirstNamePossessiveNoTooltip] görevi tamamlandı. Yabanıllar adımı temkinle anıyor, ama gücümü fark ettikleri besbelli."

 agot_nw_ranger_events.0021.desc.fail_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] iç çekiyor, çabalarının boşa gittiğini itiraf ediyor. Yabanıllar soğuk ve etkilenmemiş kaldı; adım rüzgârlara karıştı."

 agot_nw_ranger_events.0021.desc.fail_b:0 "\n\nBaşını öne eğiyor; yabanılların sözlerine kulak asmadığını söylüyor. [my_ranger.GetTitledFirstNameNoTooltip], Kuzey'in adımı yuttuğunu biliyor."

 agot_nw_ranger_events.0021.desc.fail_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] kaşlarını çatıyor, yabanılların kayıtsız kaldığını itiraf ediyor. Sözleri tutunacak yer bulamadı; adım güneşteki kar gibi eriyip gidiyor."

 agot_nw_ranger_events.0021.desc.fail_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], yabanılların nasıl sırtını döndüğünü anlatırken sesinde bir hayal kırıklığı asılı kalıyor; adım onların kamp ateşleri arasında kayboldu."

 agot_nw_ranger_events.0021.desc.fail_e:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] eli boş dönüyor, sözleri havada asılı kalmış. Yabanıllar etkilenmedi ve adım soğukta yok oldu."

 agot_nw_ranger_events.0021.a.success:0 "Bu iyi haber."

 agot_nw_ranger_events.0021.a.failure:0 "Başarısız bir girişim, ama bir dahaki sefere."

 agot_nw_ranger_events.0022.t.success:0 "İzci: Geçiş İçin Yollar Temizlendi"

 agot_nw_ranger_events.0022.t.failed:0 "İzci: Yolda Tehlikeler Bekliyor"

 agot_nw_ranger_events.0022.desc.intro_a:0 "[my_ranger.GetTitledFirstName] keşfinden dönüyor, soğuk elbiselerine yapışmış; rapor vermek için yaklaşırken adımları sağlam."

 agot_nw_ranger_events.0022.desc.intro_b:0 "[my_ranger.GetTitledFirstName] kampa adım atıyor, arkasından kar sürükleniyor. Yüzü sakindir, ama gözleri kat ettiği yabanıl yolların zorluklarını yansıtıyor."

 agot_nw_ranger_events.0022.desc.intro_c:0 "Pelerinini kırağı kaplamış halde [my_ranger.GetTitledFirstName] yaklaşıyor; yolculuk onu belirgin şekilde yıpratmış, ama adımlarında kararlılık var."

 agot_nw_ranger_events.0022.desc.intro_d:0 "[my_ranger.GetTitledFirstName], günlerce bilinmeyen yolları izledikten sonra dönüyor. Yüz ifadesi okunmuyor, ama varlığı dikkat istiyor."

 agot_nw_ranger_events.0022.desc.intro_e:0 "İzci kampa geri dönüyor, soğuk rüzgârlar hâlâ tenini ısırıyor. Keşfinin haberini vermeye hazır şekilde ayakta duruyor."

 agot_nw_ranger_events.0022.desc.mid_a:0 "[my_ranger.GetTitledFirstNameNoTooltip], sert kuzey vahşi doğasında aşmamız için daha güvenli yollar arayarak yakınlardaki yolları ve güzergâhları keşfetti."

 agot_nw_ranger_events.0022.desc.mid_b:0 "Vahşi doğa sayısız tehlike barındırır, ama [my_ranger.GetTitledFirstNameNoTooltip] yılmadı; yolları haritalandırdı, güzergâhlarımızın güvenli olduğundan emin oldu ya da güvenli olmayanları işaretledi."

 agot_nw_ranger_events.0022.desc.mid_c:0 "[my_ranger.GetTitledFirstNameNoTooltip], günlerce toprağın unutulmuş patikalarını izledi; bu tehlikeli günlerde çok az kişinin gitmeye cesaret ettiği yolları keşfetti."

 agot_nw_ranger_events.0022.desc.mid_d:0 "Karla kaplı arazide ve gizli tehlikeler arasında [my_ranger.GetTitledFirstNameNoTooltip], kampı yönlendirmek için güvenli güzergâhlar arayarak vahşi doğanın derinliklerine süzüldü."

 agot_nw_ranger_events.0022.desc.mid_e:0 "[my_ranger.GetTitledFirstNameNoTooltip], önümüzdeki yolları değerlendirerek çok uzaklara gezdi. Kuzey'in vahşi doğası affetmez, ama keskin gözü daha güvenli bir geçit bulabilir."

 agot_nw_ranger_events.0022.desc.success_a:0 "\n\nÇabaları meyvesini verdi. Yollar ve güzergâhlar temiz; [my_ranger.GetTitledFirstNameNoTooltip], topraklar arası yolculuğun bizim için daha güvenli olacağını doğruluyor."

 agot_nw_ranger_events.0022.desc.success_b:0 "\n\nMemnun bir baş sallamayla [my_ranger.GetTitledFirstNameNoTooltip], önümüzdeki güzergâhların artık çok daha güvenli olduğunu bildiriyor. Çabaları, gelecekteki yolculuklarımız için yolu temizledi."

 agot_nw_ranger_events.0022.desc.success_c:0 "\n\nİzci, işinin bizim için daha güvenli bir geçiş sağladığını bilerek hafifçe gülümsüyor. Vahşi doğanın tehlikeleri, en azından şimdilik, uzak tutuldu."

 agot_nw_ranger_events.0022.desc.success_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] başarı bildiriyor; güvenli güzergâhlar belirlendi ve kamp, pusu ya da tehlike korkusu daha azla hareket edebilir."

 agot_nw_ranger_events.0022.desc.success_e:0 "\n\n[my_ranger.GetTitledFirstNamePossessiveNoTooltip] sayesinde, yakınlardaki yollar kamp için güvenli geçiş sunacak. Görevi tamamlandı ve risk azaldı."

 agot_nw_ranger_events.0022.desc.fail_a:0 "\n\nÇabalarına rağmen [my_ranger.GetTitledFirstNameNoTooltip], yolların hâlâ tehlikeli olduğunu itiraf ediyor. Vahşi doğa affetmez ve yolculuk tehlikeli olacak."

 agot_nw_ranger_events.0022.desc.fail_b:0 "\n\nBaşını öne eğiyor; güvenli güzergâh sağlama çabalarının başarısız olduğunu söylüyor. Yollar tehlike dolu ve kamp kendi riskine yol alacak."

 agot_nw_ranger_events.0022.desc.fail_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] kaşlarını çatıyor, yolların hâlâ tehlikeli olduğunu anlatıyor. Keşifleri, kaçınamayacağımız tehlikeleri ortaya çıkardı."

 agot_nw_ranger_events.0022.desc.fail_d:0 "\n\nİzci, görevinin başarısız olduğunu itiraf ediyor. Yabanıl yollar hâlâ tehlikeli ve kamp bir süre daha sinsi koşullarla yüzleşecek."

 agot_nw_ranger_events.0022.desc.fail_e:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], güvenli güzergâh bulamadan eli boş dönüyor. Vahşi doğa hâlâ sinsi ve yollarımız güvenlikten uzak."

 agot_nw_ranger_events.0022.a.success:0 "Yollarımız artık daha güvenli."

 agot_nw_ranger_events.0022.a.failure:0 "Yabanıl yollar affetmez, ama devam etmeliyiz."

 agot_nw_ranger_events.0023.t.success:0 "İz Sürücü: Harabeler Arasında Altın"

 agot_nw_ranger_events.0023.t.failed:0 "İz Sürücü: Boş Kamp, Boş Cepler"

 agot_nw_ranger_events.0023.desc.intro_a:0 "[my_ranger.GetTitledFirstName] kampa adım atıyor, pelerini kırağı kaplı. Bana başını sallayarak rapor edecek bir şeyi olduğunu ima ediyor."

 agot_nw_ranger_events.0023.desc.intro_b:0 "[my_ranger.GetTitledFirstName], vahşi doğada uzun bir aramanın ardından yaklaşıyor. Gözleri yabanılın soğuğunu taşıyor, ama adımlarında bir odaklanma var."

 agot_nw_ranger_events.0023.desc.intro_c:0 "Çizmelerine kar yapışmış halde [my_ranger.GetTitledFirstName] vahşi doğadan dönüyor; bulduklarından söz etmeye hazırlanırken yüzü ciddi."

 agot_nw_ranger_events.0023.desc.intro_d:0 "[my_ranger.GetTitledFirstName] öne adım atıyor, soğuk hava hâlâ üzerinde. Gözleri, dinlemeye değer bir şeyi olduğunu söylüyor."

 agot_nw_ranger_events.0023.desc.intro_e:0 "Isıran rüzgârın içinden [my_ranger.GetTitledFirstName] vahşi doğadan dönüyor, pelerini karla tozlanmış; bulgularını paylaşmaya hazır."

 agot_nw_ranger_events.0023.desc.mid_a:0 "Yarısı kara gömülmüş, kalıntıları darmadağın olmuş terk edilmiş bir yabanıl kampı buldu. Enkazı karıştırarak değerli bir şey aradı."

 agot_nw_ranger_events.0023.desc.mid_b:0 "Vahşi doğanın derinliklerinde boş bir yabanıl kampına rastladı. Geride bırakılanları eşeleyerek hazine ya da altın aradı."

 agot_nw_ranger_events.0023.desc.mid_c:0 "Uzun zaman önce terk edilmiş bir kamp keşfetti. Yabanıllar onu geride bırakmıştı, ama kalıntılarının içinde değerli bir şey bulma umudu hâlâ vardı."

 agot_nw_ranger_events.0023.desc.mid_d:0 "Kuzey'in buzlu derinliklerinde unutulmuş bir yabanıl kampına rastladı. Harabelerin arasında değerli bir şey bulmayı umarak her yeri taradı."

 agot_nw_ranger_events.0023.desc.mid_e:0 "Terk edilmiş yabanıl kampını araştırdı; soğuk külleri, sakinlerinin hikâyesini anlatıyordu. Görevi, uzun süredir boş olan kampta değerli bir şey bulmaktı."

 agot_nw_ranger_events.0023.desc.success_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] hafifçe gülümsüyor, harabelerin arasında gizlenmiş bir altın kesesini ortaya çıkarıyor. Araması meyve verdi ve altını haraç olarak sunuyor."

 agot_nw_ranger_events.0023.desc.success_b:0 "\n\nMemnun bir baş sallamayla [my_ranger.GetTitledFirstNameNoTooltip], karın altında gömülü bulduğu küçük bir altın hazinesini teslim ediyor. Çabaları ödüllendirildi."

 agot_nw_ranger_events.0023.desc.success_c:0 "\n\nBir kese açıyor, içinden altının parıltısı sızıyor. Terk edilmiş kamp yalnızca anılardan ibaret değilmiş; [my_ranger.GetTitledFirstNameNoTooltip] bir ödülle döndü."

 agot_nw_ranger_events.0023.desc.success_d:0 "\n\nBelli belirsiz bir gülümsemeyle [my_ranger.GetTitledFirstNameNoTooltip] bana altınla dolu bir kese uzatıyor. Yabanıl kampı terk edilmiş olsa da gizli hazinesini teslim etti."

 agot_nw_ranger_events.0023.desc.success_e:0 "\n\n[my_ranger.GetTitledFirstNamePossessiveNoTooltip] arayışı boşa gitmedi. Kampın harabelerinden çıkardığı altınla dönüyor ve kampa yardım için sunuyor."

 agot_nw_ranger_events.0023.desc.fail_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] iç çekiyor, arayışının hiçbir sonuç vermediğini itiraf ediyor. Yabanıl kampı, içinden esen soğuk rüzgârlar kadar boştu."

 agot_nw_ranger_events.0023.desc.fail_b:0 "\n\nKaramsar bir ifadeyle [my_ranger.GetTitledFirstNameNoTooltip], kampta hiçbir hazine olmadığını bildiriyor. Arayışı, donmuş küllerden başka bir şey ortaya çıkarmadı."

 agot_nw_ranger_events.0023.desc.fail_c:0 "\n\nBaşını öne eğiyor, kampın çorak olduğunu anlatıyor. Bulunacak değerli hiçbir şey yoktu ve yolculuk boşunaydı."

 agot_nw_ranger_events.0023.desc.fail_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] kaşlarını çatıyor, yabanıl kampının alınmaya değer her şeyden çoktan soyulduğunu itiraf ediyor. Harabeler yalnızca hayal kırıklığı barındırıyordu."

 agot_nw_ranger_events.0023.desc.fail_e:0 "\n\nKamp umut verici olsa da hazine barındırmıyordu. [my_ranger.GetTitledFirstNameNoTooltip] eli boş dönüyor; soğuk rüzgâr, değer bulma umudunu süpürüp götürdü."

 agot_nw_ranger_events.0023.a.success:0 "Bu altın bize iyi hizmet edecek."

 agot_nw_ranger_events.0023.a.failure:0 "Sonuçsuz bir arama."

 agot_nw_ranger_events.0024.t.success:0 "İz Sürücü: Vahşi Doğadan Av"

 agot_nw_ranger_events.0024.t.failed:0 "İz Sürücü: Av Eli Boş Döndü"

 agot_nw_ranger_events.0024.desc.intro_a:0 "[my_ranger.GetTitledFirstName] vahşi doğadan dönüyor, soluğu ağır; ama yüzünde kararlı bir ifade var."

 agot_nw_ranger_events.0024.desc.intro_b:0 "[my_ranger.GetTitledFirstName] kampa adım atıyor; vahşi doğada geçirdiği saatlerin ardından alnında kar ve ter iç içe."

 agot_nw_ranger_events.0024.desc.intro_c:0 "Sırtında soğuk bir rüzgârla [my_ranger.GetTitledFirstName] yaklaşıyor, adımları ağır ve hesaplı. Yolculuğunun ağırlığı üzerine çökmüş."

 agot_nw_ranger_events.0024.desc.intro_d:0 "[my_ranger.GetTitledFirstName] avdan dönüyor, nefesi donmuş havada buğu oluyor. Gözlerinde bir şey var: ya başarının heyecanı ya da başarısızlığın yükü."

 agot_nw_ranger_events.0024.desc.intro_e:0 "[my_ranger.GetTitledFirstName] kampa geri yürüyor, kıyafetleri kırağıdan sertleşmiş; donmuş vahşi doğada yiyecek bulma girişimini rapor etmeye hazır."

 agot_nw_ranger_events.0024.desc.mid_a:0 "Vahşi doğanın çok uzağına süzüldü; hayvanların izini sürdü ve bulabildiği kaynakları topladı. Donmuş arazi çok az şey sundu, ama o ilerlemeye devam etti."

 agot_nw_ranger_events.0024.desc.mid_b:0 "Sert Kuzey, avını kolay kolay vermez; ama o, kampı doyurabilecek bir şey arayarak vahşi doğayı didik didik etti."

 agot_nw_ranger_events.0024.desc.mid_c:0 "Donmuş boş topraklarda avlanmak kolay iş değildir, ama o izleri takip etti ve bu sert günlerde kampı ayakta tutacak herhangi bir şey aradı."

 agot_nw_ranger_events.0024.desc.mid_d:0 "Soğuğa göğüs gerdi; hayvanların izini sürdü ve toplayıcılık yaptı, kampın depolarını dolduracak bir şeyle dönmeyi umarak."

 agot_nw_ranger_events.0024.desc.mid_e:0 "Karlı vahşi doğayı aradı; av ya da erzak bulmayı umarak, kardeşlerini doyuracak kadarını getirme ihtiyacıyla yola çıktı."

 agot_nw_ranger_events.0024.desc.success_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] elinde yiyecekle dönüyor. Avı başarılıydı; topladığı erzak, soğuk gecelerde kampın doyurulmasına yardımcı olacak."

 agot_nw_ranger_events.0024.desc.success_b:0 "\n\nEmeğinin meyvelerini sunuyor: et ve toplanmış yiyecekler. [my_ranger.GetTitledFirstNameNoTooltip], kampın depolarını güçlendirecek kadar çok şeyle döndü."

 agot_nw_ranger_events.0024.desc.success_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], yiyecekleri teslim ederken hafifçe gülümsüyor. Çabaları kampın geçimini sağladı ve yolculuğu, verdiği emeğe değdi."

 agot_nw_ranger_events.0024.desc.success_d:0 "\n\nBelli belirsiz bir baş sallamayla [my_ranger.GetTitledFirstNameNoTooltip], topladığı erzakları teslim ediyor. Kampın erzakları yenilendi ve emeği meyve verdi."

 agot_nw_ranger_events.0024.desc.success_e:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], vahşi doğadan toplanmış taze av ve yiyecekle dönüyor. Erzaklar hoş bir manzara; kampın aç kalmayacağını garanti ediyor."

 agot_nw_ranger_events.0024.desc.fail_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] iç çekiyor, avın hiçbir şey vermediğini itiraf ediyor. Vahşi doğa affetmedi ve bu girişimde daha fazla erzak kaybedildi."

 agot_nw_ranger_events.0024.desc.fail_b:0 "\n\nKaramsar bir ifadeyle [my_ranger.GetTitledFirstNameNoTooltip], yiyecek arayışının boş çıktığını bildiriyor. Bu çaba bize pahalıya mal oldu ve kampın depoları azaldı."

 agot_nw_ranger_events.0024.desc.fail_c:0 "\n\nBaşını öne eğiyor; vahşi doğanın ne av ne de nimet sunduğunu anlatıyor. Kamp kazandığından fazlasını kaybetti ve depolar bu yüzden zayıfladı."

 agot_nw_ranger_events.0024.desc.fail_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] kaşlarını çatıyor, yiyecek toplama çabalarının başarısız olduğunu itiraf ediyor. Av, kampa sağladığından fazla erzağa mal oldu."

 agot_nw_ranger_events.0024.desc.fail_e:0 "\n\nVahşi doğa yiyecek sunmadı ve [my_ranger.GetTitledFirstNameNoTooltip] eli boş dönüyor. Bu girişim, kampı öncesinden daha az erzakla bıraktı."

 agot_nw_ranger_events.0024.a.success:0 "Bu bizi beslemeye yardımcı olacak."

