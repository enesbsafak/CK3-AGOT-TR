 agot_nw_ranger_events.0028.desc.intro_a:0 "Soğuk gece göğünün altında kamp sessizdi; derken aniden sessizlik paramparça oldu. Bir yabanıl, gölgelerin arasından fırlayıp vahşi bir öfkeyle saldırdı."

 agot_nw_ranger_events.0028.desc.intro_b:0 "Kamp dinlenirken bir yabanıl içeri girmeye çalıştı; geceden bir hayalet gibi belirdi, [wildling_intruder.GetSheHe] hamlesini yaparken gözleri umutsuzlukla parlıyordu."

 agot_nw_ranger_events.0028.desc.intro_c:0 "Gece sakindi, ama tehlike sinsice yaklaşmıştı. Bir yabanıl karanlıktan fırladı; yoluna çıkan herkes için bir tehdit."

 agot_nw_ranger_events.0028.desc.intro_d:0 "Kampın ateş ışığı zayıfça titrerken yabanıl saldırdı; gecenin karanlığını saldırısı için siper aldı. Varlığı ani ve şiddetliydi."

 agot_nw_ranger_events.0028.desc.intro_e:0 "Kamp hareketsizdi, rüzgâr karın üzerinde uluyordu; derken bir yabanıl saldırdı; azgın ve kamptan alabildiğini almaya kararlı."

 agot_nw_ranger_events.0028.desc.mid_a:0 "Gece Bekçisi, her zamanki gibi tetikte, davetsiz misafirle ilk karşılaşan oldu; kampı savunmak için yabanılla çaresiz bir mücadelede çarpıştı."

 agot_nw_ranger_events.0028.desc.mid_b:0 "Gece Bekçisi hızla davrandı; davetsiz misafirin yoluna çıkıp [wildling_intruder.GetHerHim] geri püskürtmeye ve kampı güvende tutmaya çalıştı."

 agot_nw_ranger_events.0028.desc.mid_c:0 "Çevikti; yabanıl belirir belirmez tepki verdi, [wildling_intruder.GetSheHe] zarar verip kamptan bir şey çalmadan istilacıyı durdurmaya kararlıydı."

 agot_nw_ranger_events.0028.desc.mid_d:0 "Gece Bekçisi [wildling_intruder.GetHerHim] engellemek için harekete geçtiğinde yabanıl sert bir direnişle karşılaştı; saldırıyı savuşturmaya ve kampı korumaya çalışıyordu."

 agot_nw_ranger_events.0028.desc.mid_e:0 "Soğuk yıldızların altında yabanılla savaştı; davetsiz misafirin kamptan hiçbir şey götürmesini engellemeye kararlıydı."

 agot_nw_ranger_events.0028.desc.success_a:0 "\n\nYabanıl yere yığıldı; [my_ranger.GetTitledFirstNamePossessiveNoTooltip] hızlı savunmasına yenildi. Kamp güvende; tehdit zarar vermeden etkisiz hale getirildi."

 agot_nw_ranger_events.0028.desc.success_b:0 "\n\nGece Bekçisi hızlı bir vuruşla yabanılı devirdi, [wildling_intruder.GetHerHim] kara gönderdi. Kamp yara almadan kaldı, saldırgan püskürtüldü."

 agot_nw_ranger_events.0028.desc.success_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] yabanılı alt etti; kampa hiçbir zarar gelmemesini sağladı. Davetsiz misafir durduruldu ve her şey güvende."

 agot_nw_ranger_events.0028.desc.success_d:0 "\n\nYabanılın saldırısı Gece Bekçisi tarafından durduruldu; bedeni artık karda yatıyor. Hızlı müdahale sayesinde kamp güvende."

 agot_nw_ranger_events.0028.desc.success_e:0 "\n\nYabanıl yenildi; kamptan çalma girişimi [my_ranger.GetTitledFirstNamePossessiveNoTooltip] kılıcıyla boşa çıkarıldı. Tehlike, geldiği kadar çabuk geçti."

 agot_nw_ranger_events.0028.desc.fail_a:0 "\n\nYabanıl sert ve hızlı vurdu; kamptan alabildiğini kapıp geceye karışmadan önce [my_ranger.GetTitledFirstNameNoTooltip] alt etti."

 agot_nw_ranger_events.0028.desc.fail_b:0 "\n\nKarmaşada yabanıl, Gece Bekçisi'ni yenmeyi başardı; kimse [wildling_intruder.GetHerHim] durduramadan erzakları kaptı ve karanlığa kaçtı."

 agot_nw_ranger_events.0028.desc.fail_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] yabanılı uzak tutmaya çalıştı, ama davetsiz misafir onu alt etti; [wildling_intruder.GetSheHe], vahşi doğada kaybolmadan önce alabildiğini kaptı."

 agot_nw_ranger_events.0028.desc.fail_d:0 "\n\nGece Bekçisi cesurca savaştı, ama yabanıl çok hızlıydı. [wildling_intruder.GetSheHe|U] erzakları alıp gölgelere süzüldü; kampı savunmasız bıraktı."

 agot_nw_ranger_events.0028.desc.fail_e:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] [wildling_intruder.GetHerHim] durdurmaya çalışsa da yabanıl onu yendi ve çaldığı mallarla kayboldu; kampı tedirgin bıraktı."

 agot_nw_ranger_events.0028.a.success:0 "Kamp bir kez daha güvende."

 agot_nw_ranger_events.0028.a.failure:0 "Bunun yaralarını sarmalıyız."

 agot_nw_ranger_events.0100.t:0 "Nöbet Sustuğunda"

 agot_nw_ranger_events.0100.t.after:0 "Geriye Kalanlar"

 agot_nw_ranger_events.0100.desc:0 "Nöbet sustu. Yabanıllar düzenimizi bozdu; kardeşleri dağıttı ve geriye kalan azıcık komutayı paramparça etti. Siyah pelerinler kulelerden kayboldu ve bir zamanlar bizi bağlayan yeminler artık yalnızca anılarda yaşıyor.\n\nBir zamanlar elinde tuttuğum rütbe ne olursa olsun artık bir ağırlık taşımıyor. Gerçek anlamda artık Birinci Korucu değilim; yalnızca Nöbet'in ne olması gerektiğini hatırlayan bir adamım.\n\nGece Nöbetçileri bir daha var olacaksa, bu törenle ya da sözlerle değil; zor seçimlerle ve daha zor işlerle olacak."

 agot_nw_ranger_events.0100.desc.after:0 "Gece Nöbetçileri bir süre önce çöktü ve Kuzey, onun yokluğuna alıştı. Toprakları sahipsiz, görevi karşılıksız kaldı ve bu boşluğu dolduracak açık bir otorite öne çıkmadı.\n\nSur'un ötesindeki tehlike değişmedi; değişen yalnızca onunla yüzleşme isteği. Nöbet'i yeniden kurmaya değip değmediği, denemeye cüret ya da budalalık edenlere bırakılmış bir soru.\n\nGeri dönecekse, bu gelenekle değil; bir kararla olacak."

 agot_nw_ranger_events.0100.a:0 "Belki Kuzey, Nöbet'e bir kez daha cevap verir."

 agot_nw_ranger_events.0100.a.tt:0 "Gece Nöbetçileri'ni yeniden kurmak için [northern_lord_title.GetNameNoTier] [Select_CString(northern_lord.IsFemale,'hanımefendisi','efendisi')|U] [northern_lord.GetTitledFirstName]dan yardım isteyeceksiniz."

 agot_nw_ranger_events.0100.b:0 "O halde ben, Nöbet'in yapamadığını yapacağım."

 agot_nw_ranger_events.0100.c:0 "Bu yük bana taşıtılacak bir yük değil."

 agot_nw_ranger_events.0101.t:0 "[northern_lord_title.GetNameNoTierNoTooltip] [Select_CString(northern_lord.IsFemale,'hanımefendisi','efendisi')|U]nun huzurunda"

 agot_nw_ranger_events.0101.desc:0 "[destination_1.GetNameNoTier], uzak Kuzey'de başımıza gelenlerden etkilenmemiş, ebedi bir şey gibi kardan yükseliyor. Salonlarına Birinci Korucu olarak değil; elinde komuta olmayan, siyah giyinmiş bir adam olarak çıkarılıyorum.\n\nGece Nöbetçileri çökmüş, kardeşleri dağılmış, gayesi solmaya terk edilmiş durumda. Yeniden kurulacaksa, bu yalnızca silah gücüyle olmayacak. Kuzey her zaman Nöbet'in en sadık müttefiki olmuştur ve şimdi o bağın hâlâ ayakta olup olmadığını sormak zorundayım.\n\nKuzey'de neyin kaybedildiğini ve neyin yeniden inşa edilebileceğini anlatırken [northern_lord.GetTitledFirstName] dinliyor."

 agot_nw_ranger_events.0101.desc.after:0 "[destination_1.GetNameNoTier], uzak Kuzey'de başımıza gelenlerden etkilenmemiş, ebedi bir şey gibi kardan yükseliyor.\n\nGece Nöbetçileri çökmüş, kardeşleri dağılmış, gayesi solmaya terk edilmiş durumda. Yeniden kurulacaksa, bu yalnızca silah gücüyle olmayacak. Kuzey her zaman Nöbet'in en sadık müttefiki olmuştur ve şimdi o bağın hâlâ ayakta olup olmadığını sormak zorundayım.\n\nKuzey'de neyin kaybedildiğini ve neyin yeniden inşa edilebileceğini anlatırken [northern_lord.GetTitledFirstName] dinliyor."

 agot_nw_ranger_events.0101.a:0 "Nöbet'in kaderini [northern_lord.GetHerHim]nın önüne koyacağım."

 agot_nw_ranger_events.0102.t:0 "Eski Bağ"

 agot_nw_ranger_events.0102.desc:0 "Huzuruma siyah giyinmiş bir adam çıkarılıyor; bir zamanlar Birinci Korucu rütbesini taşıyan biri. Onu gönderen Gece Nöbetçileri artık yok; yabanıllar tarafından parçalandı ve uzak Kuzey'e dağıldı. Ondan geriye kalanlar, gayesini hâlâ hatırlayanların kararlılığına bağlı.\n\nNöbet'i yeniden kurmak için [northern_lord_title.GetNameNoTierPossessive] yardımını istiyor; kendi şerefi için değil, eski görev bir kez daha ayakta durabilsin diye. Bu ağır bir taleptir. Nöbet her zaman ayrı durmaya yemin etmiştir; ama Kuzey, kalkan gerektiğinde uzun zamandır onun kalkanı olmuştur.\n\nHarekete geçersek savaş olacak. Reddedersek, yük başkalarına düşecek — ya da hiç yüklenilmeyecek."

 agot_nw_ranger_events.0102.desc.after:0 "Huzuruma siyah giyinmiş bir adam çıkarılıyor. Gece Nöbetçileri artık yok; yabanıllar tarafından parçalandı ve uzak Kuzey'e dağıldı. Ondan geriye kalanlar, gayesini hâlâ hatırlayanların kararlılığına bağlı.\n\nNöbet'i yeniden kurmak için [northern_lord_title.GetNameNoTierPossessive] yardımını istiyor; kendi şerefi için değil, eski görev bir kez daha ayakta durabilsin diye. Bu ağır bir taleptir. Nöbet her zaman ayrı durmaya yemin etmiştir; ama Kuzey, kalkan gerektiğinde uzun zamandır onun kalkanı olmuştur.\n\nHarekete geçersek savaş olacak. Reddedersek, yük başkalarına düşecek—ya da hiç yüklenilmeyecek."

 agot_nw_ranger_events.0102.a:0 "[northern_lord_title.GetNameNoTierNoTooltip] görevini terk etmeyecek."

 agot_nw_ranger_events.0102.a.tt:0 "Yakında Gece Nöbetçileri'ni yeniden kurmaya yardım etmek için silaha sarılacaksınız."

 agot_nw_ranger_events.0102.b:0 "Nöbet, kendi gücüyle ayakta durmalı ya da kendi gücüyle düşmeli."

 agot_nw_ranger_events.0103.t.accepted:0 "[northern_lord_title.GetNameNoTierNoTooltip] Cevap Veriyor"

 agot_nw_ranger_events.0103.t.refused:0 "[northern_lord_title.GetNameNoTierNoTooltip] Sırtını Dönüyor"

 agot_nw_ranger_events.0103.desc.accepted:0 "[northern_lord.GetTitledFirstName], cevabını gösterişsiz verir. [northern_lord_title.GetNameNoTier], Gece Nöbetçileri'nden geriye kalanlarla birlikte duracak; ödül ya da şan için değil, çünkü bazı görevler bir kenara bırakılmak için yazılmamıştır.\n\nAdamlar çağrılacak, sancaklar yükselecek ve hazırlıklar yapılacak. Önümüzdeki yol yeniden kanın ve soğuğun içine çıkıyor, ama bu yolu yalnız yürümeyeceğim."

 agot_nw_ranger_events.0103.desc.refused:0 "[northern_lord.GetTitledFirstName] beni sonuna dek dinler, sonra reddeder. [northern_lord_title.GetNameNoTier] bu davayı üstlenmeyecek; ne şimdi ne de böyle bir bedelle. Gece Nöbetçileri kendi yolunu bulmalı ya da anılarda silinmeli.\n\nKışyarı'ndan arkamda hiçbir sancak olmadan ayrılıyorum; yalnızca hâlâ önümde duran seçimin ağırlığıyla."

 agot_nw_ranger_events.0103.a:0 "O halde sancaklar yükselecek."

 agot_nw_ranger_events.0103.a.alone:0 "O halde yalnız yürüyeceğim."

 agot_nw_ranger_events.0103.b:0 "Bu an değil."

 agot_nw_ranger_events.0103.b.tt:0 "Savaşı erteleyecek ve daha iyi bir fırsat bekleyeceksiniz."

 agot_nw_ranger_events.0104.t:0 "Son Nöbet"

 agot_nw_ranger_events.0104.desc:0 "Savaş kaybedildi. Peşimden gelen adamlar öldü ya da dağıldı ve taşıdığım dava zincirlerle son buldu.\n\n[wildling.GetTitledFirstName]nın kampında bağlı duruyorum; kaderimi çoktan kararlaştırmış biri. Kurtuluş yok, son bir pazarlık yok. Bana kalan son saatler bunlar.\n\nGece Nöbetçileri bir daha yükselecekse bile, bu benim elimle olmayacak. Geriye kalan tek şey, hayatım boyunca soğukla yüzleştiğim gibi sonla yüzleşmek."

 agot_nw_ranger_events.0104.a:0 "Nöbetim sona erdi."

 agot_nw_ranger_events.0105.t:0 "Son Kuzgun"

 agot_nw_ranger_events.0105.desc:0 "Çarpışma bitti. Hücuma önderlik eden siyah pelerinli adam [first_ranger.GetTitledFirstName], dövülmüş ve bitkin halde önümde bağlı yatıyor. Yeminlerden ve görevden, bir zamanlar karşımızda duran bir düzenden söz ediyor; ama o sözlerin burada hiçbir gücü yok.\n\nOnun savaşı bitti. Onu canlı bırakmanın hiçbir faydası yok ve merhamet yalnızca yeni bir kavgaya davetiye çıkarır. Mesele basit.\n\nŞimdi bitiriyoruz."

 agot_nw_ranger_events.0105.a:0 "Bitir işini."

 agot_nw_ranger_events.0106.t:0 "Yeniden Dövülen Nöbet"

 agot_nw_ranger_events.0106.desc:0 "Çarpışma bitti. Yabanıllar geri püskürtüldü ve Gece Nöbetçileri bir kez daha ayakta — zayıflamış, yaralı, ama kırılmamış. Siyah pelerinler kulelere dönüyor ve neredeyse susmak üzere olduğu yerde yeminler yeniden ediliyor.\n\nKardeşler artık bana bakıyor. Onlara komuta etmek için yola çıkmamıştım, ama yükü alacak başka kimse yok. Onların iradesiyle Lord Kumandan ilan ediliyorum; parçalananı bir arada tutmakla görevlendirildim.\n\nNöbet yeniden kuruldu, ama eskisiyle aynı Nöbet değil. Bundan sonrası yalnızca güçle kazanılmayacak."

 agot_nw_ranger_events.0106.a:0 "Nöbet dayanır."

 agot_nw_ranger_events.0107.t:0 "Yeniden Kurulan Nöbet"

 agot_nw_ranger_events.0107.desc:0 "Uzak Kuzey'den Gece Nöbetçileri'nin bir kez daha ayakta olduğu haberi yayılıyor. Acı bir mücadelenin ardından düzeni bozan yabanıllar geri püskürtüldü ve siyah pelerinler yeniden Sur boyunca kalelerde nöbet tutuyor.\n\nÇöküşten sağ kurtulanlar arasından yeni bir Lord Kumandan seçildi: [the_new_lc.GetFirstName]. Eski yeminlerin yeniden edildiği söyleniyor. Nöbet'in eskisi gibi ayakta kalıp kalmayacağını zaman gösterecek, ama şimdilik ateşi sönmedi."

 agot_nw_ranger_events.0107.a:0 "Demek Sur'un yine gözcüleri var."

 agot_nw_ranger_events.0108.t:0 "Gece Nöbetçileri'nin Çöküşü"

 agot_nw_ranger_events.0108.desc:0 "Uzak Kuzey'den güneye huzursuz edici haberler süzülüyor. Gece Nöbetçileri paramparça oldu; kardeşleri öldürüldü ya da dağıldı, kaleleri sessizliğe gömüldü. Siyah pelerinlerin bir zamanlar durduğu yerlerde yabanılların serbestçe dolaştığı söyleniyor.\n\nSınırı tutacak bir Nöbet olmadığından, uzak Kuzey kendi kaderine terk edildi."

 agot_nw_ranger_events.0108.a:0 "Bu iyiye işaret değil."

 game_concept_agot_ranger_mission:0 "Korucu Görevi"

 game_concept_agot_ranger_mission_plural:0 "Korucu Görevleri"

 game_concept_agot_ranger_mission_desc:0 "$game_concept_agot_ranger_mission_plural$, [agot_ranger_camp|E]nın [gold|E] ya da [prestige|E] kazanmasının başlıca yoludur. Ayrıca [provisions|E], [piety|E] ve hatta [artifacts|E] ödüllendirebilirler.\n\nHer biri, Birinci Korucu'nun bir söylenti aracılığıyla öğrendiği bir görevdir.\n\nSur'un ötesinde yeni bir konuma seyahat ederek daha fazla $game_concept_agot_ranger_mission_plural$ ortaya çıkarılır.\n\n#alert_trial Görevlerin çoğu tehlikelidir; her biri Birinci Korucu'nun canını alma potansiyeli taşır.#!"

 ranger_laamp_contract_1101_contract:0 "Av Sahaları"

 ranger_laamp_contract_1101_request:0 "Bu [agot_ranger_mission|E] için bir av sahasını ziyaret etmeniz gerekir"

 ranger_laamp_contract_1101_desc_title:0 "Birinci Korucu [TaskContract.GetTaker.GetFirstNameNoTooltip]!"

 ranger_laamp_contract_1101_desc:0 "Buralardan pek uzak olmayan umut verici bir yer buldum.\n\nAv izleri taze ve vahşi hayvanların işaretleri her yerde. Yakında yola çıkarsak kampımızın depolarını dolduracak kadar yiyecek toplayabilmeliyiz. Soğuk daha da şiddetli ısırmadan avlanıp kendimize yiyecek sağlamak için iyi bir fırsat olabilir."

 agot_nw_ranger_event_success:0 "Girişimim başarılı olur"

 agot_nw_ranger_event_failure:0 "Girişimim başarısız olur"

 agot_nw_ranger_events_duel_begins:0 "#X @warning_icon! Hemen [opponent.GetFirstName] ile [character_death_death|E] üzerine bir düelloya girersiniz#!"

 agot_nw_ranger_events.1101.t:0 "Vahşi Doğaya"

 agot_nw_ranger_events.1101.desc.intro_a:0 "Hava berrak ve yola çıkmaya hazırlanırken tepedeki gökyüzü açık. [my_ranger.GetTitledFirstNamePossessive] raporu umut vericiydi; bulunacak av var ve kampın taze erzağa ihtiyacı var."

 agot_nw_ranger_events.1101.desc.intro_b:0 "Önümüzdeki patikanın bizi çok ihtiyaç duyulan bir nimetin olduğu yere götürebileceğini bilerek kuşanıyoruz. Vahşi doğa affetmez, ama avın olduğu yerde kampın erzakı için umut da vardır."

 agot_nw_ranger_events.1101.desc.intro_c:0 "Yola koyulurken rüzgâr ısırıyor, ama başarılı bir avın vaadi buna değer. [my_ranger.GetTitledFirstNamePossessive] sözü güvenilir; yiyecek toplama şansı varsa, onu değerlendirmeliyiz."

 agot_nw_ranger_events.1101.desc.intro_d:0 "Adamların hareket etmesi için işaret verirken soğuk pelerinine yapışıyor. Yakınlarda iyi bir av sahası; [my_ranger.GetTitledFirstName] iyi iş çıkardı. Vahşi doğanın bize yiyecek verip vermeyeceğini görme zamanı."

 agot_nw_ranger_events.1101.desc.intro_e:0 "Yüzlerimizi ısıran soğuk rüzgârla teçhizatımızı hazırlıyoruz. [my_ranger.GetTitledFirstName] haklıysa av yakında. Sert günler gelmeden kampı yiyecekle doldurmak için bir şans."

 agot_nw_ranger_events.1101.desc.outro:0 "\n\nVahşi doğaya çıkıyoruz; gözler keskin, kulaklar tetikte. Avlanacak av var, geri getirilecek erzak var. Bu yolculuğun başarısı, kollarımızın gücüne ve avın sabrına bağlı."

 agot_nw_ranger_events.1101.a:0 "Hadi gidip avlanalım."

 agot_nw_ranger_events.1101.b:0 "Kampı av sahalarına yaklaştır."

 agot_nw_ranger_events.1101.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1102.t:0 "Canavar ve Yabancı"

 agot_nw_ranger_events.1102.desc.intro_a:0 "Kendimi diğerlerinden ayrı düşmüş buluyorum. Çevremdeki orman sakinleşirken onların kovalamacanın sesleri uzakta kayboluyor."

 agot_nw_ranger_events.1102.desc.intro_b:0 "Avcı grubu ormanın içinde avı kovalıyor, ama ben geride kaldım. Sessizlik beni sarıyor, soğuk ağaçların arasından ısırıyor."

 agot_nw_ranger_events.1102.desc.intro_c:0 "Diğerleri kovalamacaya devam ederken ben vahşi doğada yapayalnız kalıyorum. Kar adımlarımı yutuyor ve toprağa tuhaf bir dinginlik çöküyor."

 agot_nw_ranger_events.1102.desc.intro_d:0 "Diğerleri öndeki avın izini sürerken ben ormanın sessiz bir köşesine süzülüyorum. Avın sesleri kayboldu, beni yalnız bıraktı."

 agot_nw_ranger_events.1102.desc.intro_e:0 "Gruptan ayrılırken rüzgâr ağaçların arasında fısıldadı. Yapayalnız, vahşi doğa etrafımı sarmış gibiydi; sessiz ve soğuk bir varlık."

 agot_nw_ranger_events.1102.desc.mid_a:0 "Gölgelerden gelen ani hırıltı, kurt saldırmadan önce bana çok az uyarı verdi; dişleri görünüyor, gözleri açlıkla yanıyordu. Silahımı zar zor kaldırabildim."

 agot_nw_ranger_events.1102.desc.mid_b:0 "Kocaman bir ayı çalıların arasından gürleyerek çıkıyor; kükrerken soluğu havayı bulandırıyor. Saldırmadan, pençeleri soğuk havayı yırtmadan önce tepki verecek zamanı zar zor buluyorum."

 agot_nw_ranger_events.1102.desc.mid_c:0 "Ayaklarımın altındaki kar kayıyor ve daha hareket edemeden kocaman bir kurt, hırlayarak gölgelerden fırlıyor; çeneleri boğazımdan birkaç santim uzakta şaklıyor."

 agot_nw_ranger_events.1102.desc.mid_d:0 "Ormandan bir ayı üzerime saldırıyor, koşarken ağır pençeleri yere çarpıyor. Kılıcımı kaldırıp canavarın öfkesine karşı kendimi hazırlıyorum."

 agot_nw_ranger_events.1102.desc.mid_e:0 "\n\nSıska ve gözleri yabanıl bir kurt gölgelerden fırlıyor. Darbeyi zar zor savuşturabiliyorum; hırıltısı durgun havada yankılanıyor."

 agot_nw_ranger_events.1102.desc.outro_a:0 "\n\nCanavar bir kez daha saldırmadan önce bir yabanıl, elinde mızrakla ağaçların arasından fırlıyor. Bir an için hepimiz donup kalıyoruz: canavar, yabanıl ve ben, hepimiz ölümcül bir üçgenin içinde."

 agot_nw_ranger_events.1102.desc.outro_b:0 "\n\nHayvanın saldırısını uzak tutmaya çalışırken bir yabanıl görüş alanıma giriyor, mızrağı hazır. Canavar yeni gelene yöneliyor ve artık üçümüz birbirine kenetlenmiş bir açmazda duruyoruz; kimin ilk hareket edeceği belli değil."

 agot_nw_ranger_events.1102.desc.outro_c:0 "\n\nCanavar bir kez daha hamle yapıyor, ama saldırısı yeni gelene dönmesiyle kesiliyor. Ormandan elinde mızrakla bir yabanıl çıktı. Artık üç kişiyiz; her biri diğerinden temkinli, her biri vurmaya hazır."

 agot_nw_ranger_events.1102.desc.outro_d:0 "\n\nBaşka bir saldırıya hazırlanırken gölgelerden bir yabanıl belirdi. Üçümüz, yabanıl, canavar ve ben, huzursuz bir açmazda kenetlenmiş duruyorduk."

 agot_nw_ranger_events.1102.desc.outro_e:0 "\n\nCanavar bir kez daha saldırmak için dönüyor, ama mızrağını kaldırmış bir yabanıl öne çıkıyor. Artık üçümüz bir açmazda kilitlenmiş durumdayız; herkes diğerini izliyor, kimin ilk hamleyi yapacağı belli değil."

 agot_nw_ranger_events.1102.a:0 "Birlikte savaşmayı önermeye çalışıyorum."

 agot_nw_ranger_events.1102.b:0 "Silahımı kaldırıp ikisini de yenmeye hazırlanıyorum."

 agot_nw_ranger_events.1102.c:0 "Onları birbirine düşürüp aralarından sıvışıyorum."

 agot_nw_ranger_events_1102.a.tt.win:0 "Canavarı birlikte yeneriz"

 agot_nw_ranger_events_1102.a.tt.lose:0 "Yabanıl niyetimi yanlış anlar"

 agot_nw_ranger_events_1102.b.tt.win:0 "Hem yabanılı hem canavarı alt ederim"

 agot_nw_ranger_events_1102.b.tt.lose:0 "Yabanıl çok güçlüdür ve ben yenilirim"

 agot_nw_ranger_events_1102.c.tt.win:0 "Yabanıl ve canavar birbirine girer, ben fark edilmeden kaçarım"

 agot_nw_ranger_events_1102.c.tt.lose:0 "Oyunum başarısız olur ve ikisi de gözünü bana diker"

 agot_nw_ranger_events.1104.t:0 "Av Sona Eriyor"

 agot_nw_ranger_events.1104.desc.one.a:0 "Yabanıl ve ben birlikte canavarı devirdik; birleşen gücümüz onun vahşetine fazlasıyla yetti. Canavar yıkılırken kendi yaramdan keskin bir sızı hissettim.\n\nYabanıl, nadir bir ateşkes anında yanıma diz çöküp yarayla ilgilendi ve [main_figure.GetHerHis] dilinde bir şeyler mırıldandı. Kalıcı bir çözüm değildi, ama günü atlatmama yetti."

 agot_nw_ranger_events.1104.desc.one.b:0 "Yan yana canavarla savaştık. Yabanılın mızrağı ve benim kılıcım yaratığı yere serdi; ağır bedeni önümüzde cansız düştü. Bitkin halde, fark etmediğim bir yaradan kan damladığını fark ettim.\n\nYabanıl, ben tepki veremeden fark etti ve yarayı bir kumaş parçasıyla hızla sardı. [main_figure.GetSheHe|U] bir kez başını salladı ve tek söz etmeden ormanda kayboldu."

 agot_nw_ranger_events.1104.desc.one.c:0 "Yabanıl ve ben tek vücut gibi hareket etmeden önce hızlı bir bakış alışverişinde bulunduk. Birleşen çabalarımız canavarı hızlı ve kesin bir vuruşla devirdi.\n\nAn gergindi, ama ikimizden biri düşmanca davranmadan önce [main_figure.GetSheHe] yaramı işaret etti. Şaşırtıcı bir ustalıkla çabucak sardı; [main_figure.GetHerHis] dokunuşu kaba ama etkiliydi. [main_figure.GetSheHe] yaramı onardıktan sonra gölgelere süzülüp kayboldu."

 agot_nw_ranger_events.1104.desc.one.d:0 "Bir anlayış baş sallamasıyla yabanıl ve ben birlikte savaştık; çelik ve mızrağın karışımında canavarı yere serdik. Çarpışma başladığı kadar çabuk bitti, ama yaramın acısı daha belirgin hale geldi.\n\nYabanıl öne adım attı ve şaşırtıcı biçimde, kaba ama etkili bir sargıyla yarayı sarıverdi. Tek söz etmeden [main_figure.GetSheHe] ağaçların arasında kayboldu."

 agot_nw_ranger_events.1104.desc.one.e:0 "Birlikte savaşırken yabanıl tereddüt etmedi. Silahlarımız canavarın postuna işledi ve önümüzde yıkıldı.\n\nKendi kanım kara karıştı; ama yabanıl, ölü canavara kısa bir bakış attıktan sonra yaklaşıp yaramı onardı. [main_figure.GetHerHis|U] işi hızlıydı, ama beni ayakta tutmaya yetti. Başka hiçbir alışveriş olmadan [main_figure.GetSheHe] vahşi doğada kayboldu."

 agot_nw_ranger_events.1104.desc.two.a:0 "Azgın bir savuruşla canavarı yere serdim; kılıcım hedefini buldu. Yaratık yıkılırken dikkatimi yabanıla çevirdim, ama [main_figure.GetSheHe] çoktan gölgelere karışmıştı.\n\nAğır soluk alarak yaralarımı değerlendirmek için bir an durdum.\n\nYara derindi, ama taşıdığım erzakla kendim onarmayı başardım. Tehlike geçmişti, ama yabanıl ortalıkta yoktu."

 agot_nw_ranger_events.1104.desc.two.b:0 "Canavar hamle yaptı, ama kılıcım hücumuna karşılık verdi. Son bir vuruşla onu devirdim; yabanıl, gücümü görünce hiç ses çıkarmadan ağaçların arasında kayboldu. Karmaşanın ardından kendimi savaştan kalma bir yarayı kavramış buldum. Özenle, elime ne geçtiyse onunla sıkıca sararak yarayı kapattım. Yara kontrol altındaydı, ama yabanıl çoktan gitmişti."

 agot_nw_ranger_events.1104.desc.two.c:0 "Kılıcım canavarı yardı; hırıltısı rüzgâra karıştı. Gölgelerden izleyen yabanıl, [main_figure.GetHerHim] karşıma almama fırsat vermeden kaçtı.\n\nTehdit gittikten sonra canavarın bıraktığı yarayla ilgilendim. Kaba bir işti, ama kanamayı durdurmayı başardım. Yabanılın kaçışı beni tedirgin etti, ama en azından hayatta kalmıştım."

 agot_nw_ranger_events.1104.desc.two.d:0 "Yaratık kılıcımın önünde yıkıldı; savaşın hızlı bir sonu. Artık gücümden temkinli olan yabanıl, ben tepki veremeden geceye süzüldü.\n\nCanavar öldükten sonra nihayet aldığım yarayla ilgilenecek zaman buldum. Elimdeki az şeyle yarayı sararak diğerlerine dönüş yolculuğuna hazırlandım."

 agot_nw_ranger_events.1104.desc.two.e:0 "Güçlü bir vuruşla canavarın canına kıydım; bedeni yenilgiyle yere çarptı. Maharetimden açıkça gözü korkan yabanıl, arkasına bakmadan vahşi doğaya kaçtı.\n\nYapayalnız, aldığım yarayı inceledim. Hızlı ve acılı bir pansumanın ardından geri dönmeye hazırdım; yine de yabanılın gidişi beni hâlâ tedirgin ediyordu."

 agot_nw_ranger_events.1104.desc.three.a:0 "Canavar ve yabanıl birbiriyle savaşırken ben sessizce sıvıştım; karmaşada birbirlerini parçalamalarına izin verdim.\n\nKoşarken yaram zonkluyordu, ama diğerlerine ulaşana dek durmadım. Korucu arkadaşlarımı bulur bulmaz yarayla ilgilenmeme yardımcı oldular. Canavar ve yabanıl geride kaldı; kaderleri meçhul."

 agot_nw_ranger_events.1104.desc.three.b:0 "Canavar ve yabanıl birbirine düşerken ben ağaçların arasında kayboldum; vahşice savaşırken ikisinin de dikkatinden kaçtım.\n\nBöğrümden kan süzülüyordu, ama kampımın güvenliğine ulaşana dek ilerledim. Orada yoldaşlarım yaranın sarılmasına yardım etti; canavarın saldırısından da kıl payı kaçışımdan da kurtulabilmemi sağladılar."

 agot_nw_ranger_events.1104.desc.three.c:0 "Yabanıl ve canavar şiddetle çarpıştı; kavgaları ikisini de tüketirken benim de görünmeden sıvışmama olanak tanıdı.\n\nDiğer koruculara ulaştığımda çoktan kan kaybediyordum, ama yaramı onarmak için hızla harekete geçtiler. Yabanıldan da canavardan da kurtulmuştum, ama kıl payı kaçışımı hatırlatacak bir iz olmadan değil."

 agot_nw_ranger_events.1104.desc.three.d:0 "Yabanıl ve canavar savaşırken ben gölgelere karıştım. Fark ettiklerinde çoktan gitmiştim. Yaram beni yavaşlattı, ama diğerlerine dönmeyi başardım.\n\nYarayı sarmama yardım ettiler; ava devam edebilmemi sağladılar, gerçi bu karşılaşma hâlâ aklımı kurcalıyordu."

 agot_nw_ranger_events.1104.desc.three.e:0 "Yabanıl canavarla meşgulken ben sıvışma şansımı kullandım; ikisini acımasız bir kavgaya kilitlenmiş halde bıraktım. Kısa süre sonra yoldaşlarıma rastladım; yaram şiddetle kanıyordu.\n\nBeni çabucak sardılar ve hayatta kalmış olsam da yabanıl ve canavar geride kaldı; kaderleri bir sır."

 agot_nw_ranger_events.1104.a:0 "Av bitti ve kampa dönmeliyiz."

 agot_nw_ranger_events.1105.t:0 "Av Ters Gidiyor"

 agot_nw_ranger_events.1105.desc.one.a:0 "Yabanılla iletişim kurmayı denedim, ama sözlerim sağır kulaklara düştü. Niyetimi yanlış anlayan [main_figure.GetSheHe] düşmanca davrandı. Canavar üzerimize atıldı ve karmaşada zar zor kurtuldum, ama yaralanmadan değil."

 agot_nw_ranger_events.1105.desc.one.b:0 "Yabanıla minnettarlık gösterme girişimim ters tepti. [main_figure.GetSheHe|U] beni [main_figure.GetHerHim] kandırmaya çalışıyorum sanmış olmalı; çünkü benimle yan yana savaşmak yerine [main_figure.GetSheHe] bana yöneldi. Yaralı halde kaçtım; hem yabanılı hem canavarı geride bıraktım."

 agot_nw_ranger_events.1105.desc.one.c:0 "Yabanılı yardım etmeye ikna etmeye çalıştım, ama [main_figure.GetHerHis] gözleri şüpheyle karardı. O an paramparça oldu ve canavar saldırdı. Kaçmayı başardım, ama yaram şiddetle kanıyordu ve yabanıl ormanın içinde kayboldu."

 agot_nw_ranger_events.1105.desc.one.d:0 "Barış jestim yanlış okundu. Yabanıl hareketlerimi tehdit olarak gördü ve kendimi birden hem [main_figure.GetHerHim] hem de canavara karşı savunurken buldum. Canımı zor kurtararak, yaralı halde geriye sendeleyerek çıktım."

 agot_nw_ranger_events.1105.desc.one.e:0 "Yabanıla uzandım; [main_figure.GetHerHis] yardımı için [main_figure.GetHerHim] teşekkür etmeye çalıştım, ama [main_figure.GetSheHe] beni yanlış anladı. Canavarı bitirmeme yardım etmek yerine [main_figure.GetSheHe] üzerime atıldı. Yaralı halde koştum; yabanıl ve canavar uzakta savaşmaya bırakıldı."

 agot_nw_ranger_events.1105.desc.two.a:0 "Silahımı kaldırdım; hem yabanılı hem canavarı yenmeye kararlıydım, ama beni alt ettiler. Sert savaştım, ama gücüm tükendi. Kanlar içinde, canımı zor bela kurtarabildim."

 agot_nw_ranger_events.1105.desc.two.b:0 "Canavar azgındı ve yiğitçe savaşmama rağmen bedenim beni ele verdi. Yabanılın çevik saldırıları ile canavarın amansız hücumu arasında, yaralı ve mağlup halde kaçmak zorunda kaldım."

 agot_nw_ranger_events.1105.desc.two.c:0 "İkisini de yere sermek niyetiyle kılıcımı savurdum. Ama yabanıl beklediğimden hızlı hareket etti ve canavar vahşi bir güçle vurdu. Zar zor ayakta, sendeleyerek uzaklaşırken görüşüm bulanıklaşıyordu."

 agot_nw_ranger_events.1105.desc.two.d:0 "İkisini de alt edebileceğimi sanmıştım, ama yabanıl usta ve canavar amansızdı. Kazanamayacağımı anladıkça yaralarım derinleşiyordu. Kaçtım; gururum da bedenim de yaralıydı."

 agot_nw_ranger_events.1105.desc.two.e:0 "Gücüm yetmedi. Canavar ve yabanıl, pençelerin ve kılıçların ölümcül dansında birlikte çalıştı. Kanlar içinde, zar zor ayakta kalarak koşmaktan başka çarem yoktu."

 agot_nw_ranger_events.1105.desc.three.a:0 "Yabanıl ile canavar arasına nifak ekmeye çalıştım, ama hilemi fark ettiler. İkisi de bana yöneldi; yaralı ve nefes nefese, öfkelerinden zor kurtularak kaçtım."

 agot_nw_ranger_events.1105.desc.three.b:0 "Onları birbirine düşürme girişimim fena halde başarısız oldu. Yabanıl durumu kavradı ve canavar dikkatini bana çevirdi. Koştum; hayatta kalma mücadelemde yaram beni yavaşlatıyordu."

 agot_nw_ranger_events.1105.desc.three.c:0 "Onları alt edebileceğimi sanmıştım, ama yabanıl fazlasıyla kurnazdı. Birbirine düşmek yerine hem canavar hem yabanıl üzerime atıldı. Kurtuldum, ama ağır bir yara almadan değil."

 agot_nw_ranger_events.1105.desc.three.d:0 "Yabanıl oyunumu fark edince onları birbirine düşürme planım çöktü. Canavar peşime düştü ve ben yaralı ve aşağılanmış halde vahşi doğaya kaçtım."

 agot_nw_ranger_events.1105.desc.three.e:0 "Onlar savaşırken sıvışmaya çalıştım, ama planım ters tepti. Yabanıl durumu kavradı ve canavar kovalamaya başladı. Güvenliğe doğru sendeleyerek dönerken yaram sızlıyordu; zar zor hayatta kaldım."

 agot_nw_ranger_events.1105.a:0 "Av bitti ve iyileşmek için kampa dönmeliyim."

 ranger_laamp_contract_1201_contract:0 "Düşman Görüş Alanında"

 ranger_laamp_contract_1201_request:0 "Bu [agot_ranger_mission|E], [TaskContract.GetEmployer.GetName]'e karşı dövüşüp kazanmanı gerektirir"

 ranger_laamp_contract_1201_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1201_desc:0 "Kampımızdan pek uzak olmayan bir yerde bir yabanıl reisi gördüm.\n\n[TaskContract.GetEmployer.GetName|U] bizim düşmanımız olarak biliniyor ve görünen o ki [TaskContract.GetEmployer.GetSheHe] şu an savunmasız; [TaskContract.GetEmployer.GetHerHis] adamlarının çoğu etrafta yok. Hızlı davranırsak [TaskContract.GetEmployer.GetHerHim] pusuya düşürüp [TaskContract.GetEmployer.GetHerHis] nüfuzunu zayıflatabiliriz. [TaskContract.GetEmployer.GetSheHe] daha fazla sorun çıkarmadan [TaskContract.GetEmployer.GetHerHim] saf dışı bırakmak için iyi bir fırsat olabilir.."

 agot_nw_ranger_events.1201.t:0 "Pusuya"

 agot_nw_ranger_events.1201.desc.intro_a:0 "Gecenin karanlığının altında harekete geçmeye hazırlanıyoruz. [my_ranger.GetTitledFirstNamePossessive] raporu net: [main_figure.GetTitledFirstNamePossessive] bize yeterince sorun çıkardı ve artık vurma zamanı."

 agot_nw_ranger_events.1201.desc.intro_b:0 "Ayrılmaya hazırlanırken rüzgâr soğuk. Yabanıl reisi yakında ve bu, [main_figure.GetHerHim] hazırlıksız yakalamak için en iyi şansımız. Kamp kıpırdanıyor, ava can atıyor."

 agot_nw_ranger_events.1201.desc.intro_c:0 "Kamp sessiz, ama zihnim odaklanmış. Tehlikeli bir reis yakında ve bu pusu, [main_figure.GetSheHe] bize bir kez daha saldırmadan [main_figure.GetHerHim] işini bitirmek için tek şansımız olabilir."

 agot_nw_ranger_events.1201.desc.intro_d:0 "Yabanıl reisi bizden çok uzun süredir kaçıyor. Ama şimdi, [my_ranger.GetTitledFirstNamePossessive] keskin gözü sayesinde [main_figure.GetHerHim] devirme şansımız var. Kamp görev için hazırlanıyor."

 agot_nw_ranger_events.1201.desc.intro_e:0 "Teçhizatımız hazır, adamlar hazır. Bu yabanıl reisini devirmek için yeterince bekledik. Bu bizim şansımız ve onu boşa harcamayacağız."

 agot_nw_ranger_events.1201.desc.outro:0 "\n\nYola koyuluyoruz; silahlar hazır, karda hızla ilerliyoruz. İzcinin bilgisi doğru çıkarsa, bu tehlikeli bir düşmanın sonu olacak."

 agot_nw_ranger_events.1201.a:0 "Hadi gidip [main_figure.GetHerHim] pusuya düşürelim."

 agot_nw_ranger_events.1201.b:0 "Kampı pusu yerine yaklaştır."

 agot_nw_ranger_events.1201.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1202.t:0 "Tuzak Kuruldu"

 agot_nw_ranger_events.1202.desc.intro_a:0 "Karanlığın örtüsü altında yabanıl kampına yaklaşıyoruz. [main_figure.GetTitledFirstNamePossessive] çadırını seçmek kolay; [main_figure.GetHerHis] muhafızları az ve dağınık."

 agot_nw_ranger_events.1202.desc.intro_b:0 "Kamplarının hemen dışında çömelirken rüzgâr hafifçe uluyor. [main_figure.GetTitledFirstName] merkezde oturuyor; varlığımızdan habersiz, [main_figure.GetHerHis] adamları boş boş duruyor."

 agot_nw_ranger_events.1202.desc.intro_c:0 "[main_figure.GetTitledFirstNamePossessive] kampı ileride, bir ağaç korusunda gizlenmiş yatıyor. [main_figure.GetHerHis|U] muhafızları rahat görünüyor; bize görünmeden vurma şansı veriyor."

 agot_nw_ranger_events.1202.desc.intro_d:0 "Ağaçların arasından [main_figure.GetTitledFirstName] görüyoruz. [main_figure.GetHerHis|U] ateşi parlak yanıyor; ısısı soğuk havada titriyor. Harekete geçme zamanı."

 agot_nw_ranger_events.1202.desc.intro_e:0 "Karla kaplı tepenin hemen ötesinde, yabanıl kampı bir açıklıkta yatıyor. [main_figure.GetTitledFirstName] ateşin yanında oturuyor; [main_figure.GetHerHis] adamları çevreye dağılmış."

 agot_nw_ranger_events.1202.desc.mid_a:0 "Muhafızlar sıkılmış görünüyor, tehlikeden habersiz. Yabanıl reisi [main_figure.GetHerHis] adamlarından biriyle derin bir sohbete dalmış; [main_figure.GetHerHis] sırtı bize dönük."

 agot_nw_ranger_events.1202.desc.mid_b:0 "Birkaç yabanıl ateşin yanında oyalanıyor, alçak sesle konuşuyor. Reis oturuyor; [main_figure.GetHerHis] dikkati başka yerde, kurduğumuz tuzaktan bihaber."

 agot_nw_ranger_events.1202.desc.mid_c:0 "Kamp sessiz. Yabanıl reisi [main_figure.GetHerHis] yardımcılarından biriyle konuşuyor; [main_figure.GetHerHis] muhafızları kendi işleriyle meşgul. Burada olduğumuzu bildiklerine dair hiçbir belirti yok."

 agot_nw_ranger_events.1202.desc.mid_d:0 "Yabanıl kampı hafif korunuyor. Reis, [main_figure.GetHerHis] adamlarından biriyle konuşuyor; yaklaşan tehlikeden habersiz."

 agot_nw_ranger_events.1202.desc.mid_e:0 "Muhafızlar az, kampın her yanına dağılmış. Reis ateşin yakınında oturuyor; [main_figure.GetHerHis] dikkati [main_figure.GetHerHis] adamlarda, yaklaşımımızdan bihaber."

 agot_nw_ranger_events.1202.desc.outro_a:0 "\n\nDaha da yaklaşıyoruz; ateş ışığı karda titriyor. Vurma zamanı yakın, ama şimdi [main_figure.GetHerHim] en iyi nasıl devireceğime karar vermeliyim."

 agot_nw_ranger_events.1202.desc.outro_b:0 "\n\nYabanıl reisi savunmasız, ama aceleyle dalmak [main_figure.GetHerHis] adamlarını alarma geçirebilir. An kaçmadan en iyi yaklaşıma karar vermeliyiz."

 agot_nw_ranger_events.1202.desc.outro_c:0 "\n\nKonumumuz şimdilik güvenli, ama beklediğimiz her saniye bize pahalıya mal olabilir. Yabanıl reisi tehlikeyi sezmeden yakında harekete geçmeliyim."

 agot_nw_ranger_events.1202.desc.outro_d:0 "\n\nVurmak için yeterince yakınız, ama yabanıllar öngörülemez. Hızlı davranmazsak sürpriz avantajını kaybetme riskiyle karşı karşıyayız."

 agot_nw_ranger_events.1202.desc.outro_e:0 "\n\nYabanıl reisi hâlâ habersiz, ama [main_figure.GetHerHis] adamları her an bir şey fark edebilir. Harekete geçme zamanı geldi."

 agot_nw_ranger_events.1202.a:0 "Yabanıl reisine hücum ederim."

 agot_nw_ranger_events.1202.b:0 "Yaklaşmak için kendimizi yabanıl kılığına sokarız."

 agot_nw_ranger_events.1202.c:0 "Yabanılları kuşatmak için taktiksel bir plan kurarım."

 agot_nw_ranger_events_1202.b.tt.win:0 "Kılık değiştirmelerimiz işe yarar ve hiçbir aksaklık olmadan kampa sızarız"

 agot_nw_ranger_events_1202.b.tt.lose:0 "Saldırmadan önce fark ediliriz ve kaos başlar"

 agot_nw_ranger_events_1202.c.tt.win:0 "Stratejim kusursuz işler, kampı çevreler ve reisi esir alırız"

 agot_nw_ranger_events_1202.c.tt.lose:0 "Plan ters gider ve pusuyu uygulamadan yabanıllar kaçar"

 agot_nw_ranger_events.1204.t:0 "Şef Düşüyor"

 agot_nw_ranger_events.1204.desc.one.a:0 "Hücum ettiğim an, yabanıl reisinin gözleri şaşkınlıkla büyüdü. Çarpıştığımızda kılıcım [main_figure.GetHerHis] ile buluştu, ama gücüm [main_figure.GetHerHim] alt etti. [main_figure.GetHerHis|U] muhafızları dağıldı ve son bir vuruşla reis yıkıldı."

 agot_nw_ranger_events.1204.desc.one.b:0 "Yaklaşımım hızlıydı ve reisin tepki verecek zamanı zar zor oldu. [main_figure.GetHerHis|U] adamları araya girmeye çalıştı, ama becerime denk değildiler. Güçlü bir savuruşla yabanıl reisinin saltanatına son verdim."

 agot_nw_ranger_events.1204.desc.one.c:0 "Yabanıl reisi [main_figure.GetHerHis] adamlarını toplamaya çalıştı, ama hücumumuz karşısında duraksadılar. Karmaşada [main_figure.GetHerHim] yere serdim; [main_figure.GetHerHis] yabanıllar üzerindeki saltanatı tek bir vuruşla sona erdi."

 agot_nw_ranger_events.1204.desc.one.d:0 "Yabanıl reisi [main_figure.GetHerselfHimself] savunmak için savaşırken çelik çeliğe karşı geldi, ama [main_figure.GetSheHe] kararlılığımla boy ölçüşemezdi. [main_figure.GetHerHis|U] adamları ben yaklaştıkça kaçtı ve son bir vuruşla [main_figure.GetSheHe] ayaklarımın dibine yıkıldı."

 agot_nw_ranger_events.1204.desc.one.e:0 "Yabanıl reisine öfkeyle hücum ettim; [main_figure.GetHerHis] adamları korkuyla dağıldı. Çarpışma hızlıydı ve kılıçlarımız kesiştiğinde [main_figure.GetHerHim] alt ettim. Reis'in terör saltanatı sona ermişti."

 agot_nw_ranger_events.1204.desc.two.a:0 "Kılık değiştirmelerimiz işe yaradı; fark edilmeden kampın kalbine süzüldük. Reis kuşku duymadan otururken hızla ve etkili şekilde vurduk; [main_figure.GetSheHe] tepki veremeden [main_figure.GetHerHim] yere serdik."

 agot_nw_ranger_events.1204.desc.two.b:0 "Yabanılların arasında gölgeler gibi hareket ettik; kılık değiştirmelerimiz bize üstünlük sağladı. Kusursuz bir zamanlamayla reisi çevreledik ve [main_figure.GetHerHis] adamları tepki veremeden [main_figure.GetSheHe] yenildi."

 agot_nw_ranger_events.1204.desc.two.c:0 "Kendi içlerine karışarak yaklaştığımızda yabanıllar hiçbir şeyden şüphelenmedi. Reise ulaştığımızda [main_figure.GetHerHim] sürprizle yakaladık; [main_figure.GetHerHis] saltanatına tek, isabetli bir vuruşla son verdik."

 agot_nw_ranger_events.1204.desc.two.d:0 "Yabanıl kılığında, kampın içinde fark edilmeden ilerledik. Reise ulaştığımızda tereddüt yoktu. [main_figure.GetSheHe], [main_figure.GetSheHe] alarma bile geçiremeden yıkıldı."

 agot_nw_ranger_events.1204.desc.two.e:0 "Kılık değiştirmelerimizin örtüsü altında hiçbir direnişle karşılaşmadan yabanıl reisine ulaştık. Vuruş hızlıydı ve [main_figure.GetHerHis] adamları durumu anladığında liderleri çoktan yıkılmıştı."

 agot_nw_ranger_events.1204.desc.three.a:0 "Taktiksel planım kusursuz işledi. Yabanıl kampını kuşattık, reisi tuzağa düşürdük. Kaçış yolu olmayan [main_figure.GetSheHe] savaşmayı denedi, ama koordineli saldırımız [main_figure.GetHerHim] ezdi. Reis yıkıldı."

 agot_nw_ranger_events.1204.desc.three.b:0 "Kusursuz bir düzenle hareket edip yabanıl kampını çevreledik. Reis, [main_figure.GetSheHe] köşeye sıkıştığını çok geç fark etti ve kısa bir çatışmanın ardından [main_figure.GetSheHe] üstün taktiklerimize yenildi."

 agot_nw_ranger_events.1204.desc.three.c:0 "Stratejim kusursuz işledi. Yabanıl reisi ve [main_figure.GetHerHis] adamları tuzaktan kaçamayarak yakalandı. Kaçacak yer bulamayan reis cesurca savaştı, ama sonunda [main_figure.GetSheHe] yenildi."

 agot_nw_ranger_events.1204.desc.three.d:0 "Plan beklenenden daha iyi işledi. Yabanıllar kendilerini çevrilmiş buldu ve reisin bize cepheden karşı koymaktan başka çaresi kalmadı. Kısa bir savaşın ardından [main_figure.GetSheHe] yıkıldı; [main_figure.GetHerHis] terör saltanatı sona erdi."

 agot_nw_ranger_events.1204.desc.three.e:0 "Taktiklerimiz bize üstünlük sağladı; yabanıl kampını çevreleyip her türlü geri çekilmeyi kestik. Reis yiğitçe savaştı, ama koordineli darbemiz [main_figure.GetHerHim] yere serdi."

 agot_nw_ranger_events.1204.a:0 "Reis yenilgiye uğratıldı ve kampa dönmeliyiz."

 agot_nw_ranger_events.1205.t:0 "Pusu Başarısız Oluyor"

 agot_nw_ranger_events.1205.desc.one.a:0 "Yabanıl reisiyle müzakere etmeye çalıştım, ama sözlerim yalnızca [main_figure.GetHerHis] öfkesini körükledi. [main_figure.GetSheHe|U] bir işaret verdi ve [main_figure.GetHerHis] adamları etrafımızı sardı. Ben tepki veremeden ezildik, geri çekilmek zorunda kaldık."

 agot_nw_ranger_events.1205.desc.one.b:0 "Reisle akıl yürütme girişimim yalnızca alayla karşılandı. [main_figure.GetHerHis|U] adamları hızla hareket edip bizi hazırlıksız yakaladı. Sayıca az ve manevrada yenik düşünce kaçmaktan başka çaremiz kalmadı."

 agot_nw_ranger_events.1205.desc.one.c:0 "Reisi teslim olmaya ikna edebileceğimi sandım, ama [main_figure.GetHerHis] adamları etrafımızı sararken [main_figure.GetHerHis] kahkahası kampın içinde yankılandı. Pusu dağıldı ve canımızı zor kurtardık."

 agot_nw_ranger_events.1205.desc.one.d:0 "Reise müzakere sözleriyle yaklaşırken [main_figure.GetHerHis] adamları çoktan etrafımızı sarıyordu. Yabanıllar merhametsizce saldırdı ve biz mağlup halde geri çekilmek zorunda kaldık."

 agot_nw_ranger_events.1205.desc.one.e:0 "Yabanıl reisini sakinleştirme girişimim fena halde başarısız oldu. [main_figure.GetHerHis|U] adamları hızla saldırıp anında etrafımızı sardı. Toparlanma şansı olmadan geri çekilmek zorunda kaldık."

 agot_nw_ranger_events.1205.desc.two.a:0 "Yabanıl reisine hücum ettim, ama [main_figure.GetHerHis] adamları beklediğimden hızlıydı. Çabucak sarıldık; sayıları bizi ezdi. Sert savaştık ama kurtulamadık, geri çekilmek zorunda kaldık."

 agot_nw_ranger_events.1205.desc.two.b:0 "\n\nYabanıl reisini zorla devirmeye çalıştım, ama [main_figure.GetHerHis] adamları amansızdı. Çarpışma şiddetliydi ve kısa sürede sayıca azınlıkta kaldık. Canımızı zor kurtardık."

 agot_nw_ranger_events.1205.desc.two.c:0 "\n\nSert vurdum, ama yabanıl reisi hazırdı. [main_figure.GetHerHis|U] adamları her yönden sıkıştırdı ve daha toparlanamadan kanlar içinde ve mağlup halde geri çekilmek zorunda kaldık."

 agot_nw_ranger_events.1205.desc.two.d:0 "\n\nİçeri daldım, kılıç hazır, ama reisin adamları fazlasıyla hızlıydı. Çabucak ezildik; saldırımız sayılarının karşısında çöktü. Kaçmaktan başka çaremiz yoktu."

 agot_nw_ranger_events.1205.desc.two.e:0 "\n\nYabanıl reisine cepheden saldırdım, ama düzgün bir vuruş yapamadan [main_figure.GetHerHis] adamları üzerimize üşüştü. Kuşatılmış ve ezilmiş halde, canımızı zor kurtardık."

 agot_nw_ranger_events.1205.desc.three.a:0 "\n\nKılık değiştirmelerimiz işe yaramadı. Yabanıllar hilemizi görüp alarma geçti. Daha tepki veremeden reisin adamları saldırdı ve bizi kaos içinde geri çekilmeye zorladı."

 agot_nw_ranger_events.1205.desc.three.b:0 "\n\nYabanıllara karışarak yaklaşmaya çalıştık, ama kimliğimiz çok erken ortaya çıktı. Reisin adamları etrafımızı sardı ve kaçmaktan başka çaremiz kalmadı."

 agot_nw_ranger_events.1205.desc.three.c:0 "\n\nYabanıl kılığına girme planı ters tepti. Daha harekete geçemeden reis bizi fark etti ve [main_figure.GetHerHis] adamları üzerimize üşüştü. Canımızı zor kurtardık."

 agot_nw_ranger_events.1205.desc.three.d:0 "\n\nFark edilmeden sızma girişimimiz, reisin adamları kılıklarımızı görünce başarısız oldu. Yabanıllar hızla vurdu ve daha toparlanamadan geri çekilmek zorunda kaldık."

 agot_nw_ranger_events.1205.desc.three.e:0 "\n\nReis beklenenden daha tetikteydi. [main_figure.GetSheHe|U] bizi anında tanıdı ve daha bir hamle yapamadan [main_figure.GetHerHis] adamları etrafımızı sardı. Kaçtık, ama ancak zar zor."

 agot_nw_ranger_events.1205.a:0 "Bu son olamaz."

 ranger_laamp_contract_1301_contract:0 "Yükselen Tehdit"

 ranger_laamp_contract_1301_request:0 "Bu [agot_ranger_mission|E], [TaskContract.GetEmployer.GetName]'e karşı dövüşüp kazanmanı gerektirir"

 ranger_laamp_contract_1301_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1301_desc:0 "İzlediğimiz yabanıl reisi güç kazanıyor.\n\n[TaskContract.GetEmployer.GetHerHis] nüfuzu yayılıyor ve daha fazla klan [TaskContract.GetEmployer.GetHerHis] safına toplanıyor. Yakında harekete geçmezsek [TaskContract.GetEmployer.GetSheHe] durdurulamaz hale gelebilir. [TaskContract.GetEmployer.GetSheHe] hâlâ savunmasızken, [TaskContract.GetEmployer.GetHerHis] gücü erişemeyeceğimiz bir seviyeye ulaşmadan şimdi hareket etmeliyiz."

 agot_nw_ranger_events.1301.t:0 "Büyüyen Fırtına"

 agot_nw_ranger_events.1301.desc.intro_a:0 "Yeterince bekledik. Yabanıl reisinin gücü artıyor ve yakında harekete geçmezsek [main_figure.GetSheHe], yenilmesi imkânsız hale gelecek. [main_figure.GetSheHe] [main_figure.GetHerHis] davasına daha fazla kişiyi toplayamadan [main_figure.GetHerHim] durdurma zamanı."

 agot_nw_ranger_events.1301.desc.intro_b:0 "Yabanıl reisi her geçen gün güç kazanıyor. [main_figure.GetHerHis] nüfuzu daha fazla yayılmadan harekete geçmeliyiz. Kamp hazır ve vurma zamanı şimdi."

 agot_nw_ranger_events.1301.desc.intro_c:0 "Yabanıl tehdidi her zamankinden daha büyük görünüyor. [main_figure.GetHerHim] şimdi durdurmazsak bu reis hepimiz için ciddi bir tehlike haline gelecek. Daha fazla beklemeyi göze alamayız."

 agot_nw_ranger_events.1301.desc.intro_d:0 "[main_figure.GetHerHis|U] sayıları artıyor ve daha fazla yabanıl [main_figure.GetHerHis] sancağına akın ediyor. Bunun devam etmesine izin veremeyiz. Harekete geçme zamanı şimdi; [main_figure.GetSheHe] durdurulamaz hale gelmeden."

 agot_nw_ranger_events.1301.desc.intro_e:0 "[main_figure.GetTitledFirstName] cüretkârlaştı, [main_figure.GetHerHis] gücü her geçen gün artıyor. Çok geç olmadan [main_figure.GetHerHim] durdurma şansımız var ve bunu boşa harcayamayız."

 agot_nw_ranger_events.1301.desc.outro:0 "\n\nAyrılmaya hazırlanıyoruz, silahlar elimizde. Yabanıl reisi durdurulmalı ve yolumuza çıkan her şeyle yüzleşeceğiz."

 agot_nw_ranger_events.1301.a:0 "Hadi gidip bu tehditle ilgilenelim."

 agot_nw_ranger_events.1301.b:0 "Kampı yabanıl şefinin topraklarına yaklaştır."

 agot_nw_ranger_events.1301.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1302.t:0 "Kartlar Ters Döndü"

 agot_nw_ranger_events.1302.desc.intro_a:0 "Karda sessizce ilerliyoruz, yabanıl kampı hemen önümüzde. Muhafızlar az görünüyor ve [main_figure.GetTitledFirstName] elimizin altında; vurmaya hazırız."

 agot_nw_ranger_events.1302.desc.intro_b:0 "Planımız net: muhafızları hızla saf dışı bırak ve [main_figure.GetSheHe] tepki veremeden [main_figure.GetTitledFirstName] pusuya düşür. Mevzilendik; saldırı başlamak üzere."

 agot_nw_ranger_events.1302.desc.intro_c:0 "Yabanıl kampı önümüzde uzanıyor, muhafızları dağınık. Her şey kusursuz bir pusu için yerinde görünüyor ve içeri sızmaya hazırlanıyoruz."

 agot_nw_ranger_events.1302.desc.intro_d:0 "[main_figure.GetTitledFirstNamePossessive] kampına sessizce yaklaşıyoruz, muhafızlar habersiz görünüyor. Pusuyu hazırlarken avantaj elimizdeymiş gibi hissettiriyor."

 agot_nw_ranger_events.1302.desc.intro_e:0 "Karanlığın örtüsü altında kampa yavaşça yaklaşıyoruz. [main_figure.GetTitledFirstNamePossessive] muhafızları az ve vurma zamanımız geldi."

 agot_nw_ranger_events.1302.desc.mid_a:0 "Birden ağaçların arasında bir haykırış yankılanıyor. Reis bizi fark ediyor ve [main_figure.GetHerHis] adamları saklandıkları yerden fırlıyor. Pusuya düşen biziz."

 agot_nw_ranger_events.1302.desc.mid_b:0 "Hiçbir uyarı olmadan yabanıl reisi ve [main_figure.GetHerHis] adamları ağaçların arasından beliriyor. Bizi bekliyorlardı; pusumuzu kendi tuzaklarına çevirdiler."

 agot_nw_ranger_events.1302.desc.mid_c:0 "Yabanıl reisi gölgelerden öne çıkıyor, [main_figure.GetHerHis] adamları [main_figure.GetHerHim] kanatlardan sarıyor. Pusuumuz artık bir sürpriz değil ve kendimizi kuşatılmış buluyoruz."

 agot_nw_ranger_events.1302.desc.mid_d:0 "Daha saldıramadan yabanıllar, reis [main_figure.GetHerselfHimself] önderliğinde ağaçların arasından hücuma geçiyor. Kartları ters çevirdiler ve artık kuşatılmış durumdayız."

 agot_nw_ranger_events.1302.desc.mid_e:0 "Saldırıya hazırlanırken yabanıl reisi ve [main_figure.GetHerHis] adamları saklandıkları yerden atılıyor. Tuzaklarına yürüdük ve artık avantaj onlarda."

 agot_nw_ranger_events.1302.desc.outro_a:0 "\n\nKuşatıldık, yabanıllar sayıca üstün. Kaybedecek zaman yok; hızla hareket etmeliyiz ya da her şeyi riske atacağız."

 agot_nw_ranger_events.1302.desc.outro_b:0 "\n\nYabanıllar yaklaşırken durum vahim. Hızla düşünmeli ve bir sonraki hamlemizi dikkatle seçmeliyiz, yoksa eziliriz."

 agot_nw_ranger_events.1302.desc.outro_c:0 "\n\nYabanıllar her yandan sıkıştırıyor. Bu pusudan kurtulmak için güçten fazlasına ihtiyacımız var; tek umudumuz akıllı bir plan."

 agot_nw_ranger_events.1302.desc.outro_d:0 "\n\nKuşatılmış ve sayıca az, tehlikeli bir durumdayız. Yabanıllar avantajlı ve gidişatı tersine çevirmek için hızlı düşünmek gerekecek."

 agot_nw_ranger_events.1302.desc.outro_e:0 "\n\nPusuumuz tersine döndü ve artık tehlikede olanlar biziz. Durumun kontrolünü yeniden ele almak için hızla hareket etmeliyiz."

 agot_nw_ranger_events.1302.a:0 "Reise hücum ederiz."

 agot_nw_ranger_events.1302.b:0 "Araziyi kendimizi savunmak için kullanarak daha yüksek zemine çekiliriz."

 agot_nw_ranger_events.1302.c:0 "Aldatmaca kullanırız: ağaçları ateşe verip onları şaşırtır ve sıvışırız."

 agot_nw_ranger_events_1302.b.tt.win:0 "Yüksek zemin bize avantaj sağlar ve onları uzak tutarız"

 agot_nw_ranger_events_1302.b.tt.lose:0 "Yabanıllar savunmamızı ezer ve kaçmak zorunda kalırız"

 agot_nw_ranger_events_1302.c.tt.win:0 "Ateş kaos yaratır ve fark edilmeden kaçarız"

 agot_nw_ranger_events_1302.c.tt.lose:0 "Yabanıllar oyunumuzu görür ve ateş bizi tuzağa düşürür"

 agot_nw_ranger_events.1304.t:0 "Şef Düşüyor"

 agot_nw_ranger_events.1304.desc.one.a:0 "Yabanılların üzerine öfkeyle hücum ediyoruz. Yabanıl reisi [main_figure.GetHerHis] adamlarını toplamaya çalışıyor, ama gücümüz fazla geliyor. Güçlü bir vuruşla reisi yere seriyorum ve [main_figure.GetHerHis] adamları geceye kaçıyor."

 agot_nw_ranger_events.1304.desc.one.b:0 "Hücumumuz yabanılları kar gibi yaran bir bıçak gibi geçiyor. Reis karşıma çıkıyor, ama [main_figure.GetSheHe] becerimle boy ölçüşemez. [main_figure.GetSheHe] yıkılırken [main_figure.GetHerHis] adamları dağılıyor ve zafer bizim kalıyor."

 agot_nw_ranger_events.1304.desc.one.c:0 "Hücuma öncülük ediyor, yabanıl saflarını yarıyorum. Reis karşı saldırıya geçmeye çalışıyor, ama [main_figure.GetSheHe] [main_figure.GetHerHis] adamlarını toplayamadan [main_figure.GetHerHim] yere seriyorum. [main_figure.GetHerHis|U] savaşçıları kaçıyor ve biz zaferle ayakta kalıyoruz."

 agot_nw_ranger_events.1304.desc.one.d:0 "Hücum ederken yabanıllar tereddüt ediyor ve karmaşada reisi buluyorum. Kılıçlarımız çarpışıyor, ama gücüm [main_figure.GetHerHim] eziyor. [main_figure.GetSheHe] yıkılırken [main_figure.GetHerHis] adamları cesaretini kaybedip kaçıyor."

 agot_nw_ranger_events.1304.desc.one.e:0 "Yabanıl reisinin adamları hücumumuzla baş edemiyor. Reis ile teke tek çarpışıyorum ve [main_figure.GetHerHim] hızla yere seriyorum. [main_figure.GetHerHis|U] kalan adamları vahşi doğaya dağılıyor."

 agot_nw_ranger_events.1304.desc.two.a:0 "Yüksek zemine çekilip mevzimizi koruyoruz. Savunmamızı yarmayı başaramayan yabanıl reisi son hücumda yıkılıyor. [main_figure.GetHerHis|U] adamları kaçıyor, kampı karmaşada bırakıyor."

 agot_nw_ranger_events.1304.desc.two.b:0 "Yüksek zeminden yabanılları kolayca uzak tutuyoruz. Reis bir hücum daha yönetmeye çalışıyor, ama ben [main_figure.GetHerHim] yere seriyorum. [main_figure.GetHerHis|U] adamları, [main_figure.GetHerHim] yıkılışını görünce vahşi doğaya çekiliyor."

 agot_nw_ranger_events.1304.desc.two.c:0 "Yüksek zeminden savunmamız geçirilmez. Yabanıl reisi üzerime hücum ediyor, ama tek bir vuruşla [main_figure.GetHerHim] yere seriyorum. [main_figure.GetHerHis|U] adamları, lidersiz ve mağlup halde kaçıyor."

 agot_nw_ranger_events.1304.desc.two.d:0 "Yüksek zemini azimle savunuyoruz ve yabanıl reisi [main_figure.GetHerselfHimself] son hücuma öncülük ediyor. [main_figure.GetHerHim] teke tek çarpışıyor ve [main_figure.GetHerHim] yere seriyorum; [main_figure.GetHerHis] adamlarını kaçırıyorum."

 agot_nw_ranger_events.1304.desc.two.e:0 "Yüksek zemini avantaja çevirerek dalga dalga gelen yabanıl saldırılarını püskürtüyoruz. Reis son hücuma öncülük ettiğinde [main_figure.GetHerHim] yere seriyorum ve [main_figure.GetHerHis] adamları vahşi doğaya kaçıyor."

 agot_nw_ranger_events.1304.desc.three.a:0 "Ateşi yakıyoruz ve yabanılların arasında kaos yayılıyor. Karmaşada reisi bulup [main_figure.GetHerHim] yere seriyorum. [main_figure.GetHerHis|U] adamları, alevlerden ve liderlerinin ölümünden paniğe kapılıp gölgelere kaçıyor."

 agot_nw_ranger_events.1304.desc.three.b:0 "Ateş yayılırken yabanıllar kaosa sürükleniyor. Anı yakalıyorum; [main_figure.GetHerHis] adamları oyalanırken reisi deviriyorum. Liderleri gidince yabanıllar kaçıyor."

 agot_nw_ranger_events.1304.desc.three.c:0 "Aldatmacamız kusursuz işliyor. Ateş yabanılları oyalarken ben içeri süzülüp reisi yere seriyorum. [main_figure.GetHerHis] adamları, afallamış ve lidersiz, korkuyla dağılıyor."

 agot_nw_ranger_events.1304.desc.three.d:0 "Ateşin karmaşasının ortasında yabanıl reisine ulaşıyorum. [main_figure.GetHerHim] hızla yere seriyorum; [main_figure.GetHerHis] adamları, liderlerinin yıkılışını görünce geceye kaçıyor."

 agot_nw_ranger_events.1304.desc.three.e:0 "Ateş yabanılları altüst ediyor. Kaostan yararlanıp reisi öldürüyorum; [main_figure.GetHerHis] adamları, dehşete kapılmış ve yönsüz, vahşi doğaya kaçıyor."

 agot_nw_ranger_events.1304.a:0 "Reis öldü ve zaferle dönüyoruz."

 agot_nw_ranger_events.1305.t:0 "Pusu Çöküyor"

 agot_nw_ranger_events.1305.desc.one.a:0 "Yabanıllara hücum ediyoruz, ama sayıları fazla. Yabanıl reisi [main_figure.GetHerHis] adamlarını topluyor ve çabucak eziliyoruz. Reis'in kılıcı hedefini buluyor ve mağlup halde geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.one.b:0 "Yabanıllar yaklaşırken saldırımız duraksıyor. Reis dik duruyor, [main_figure.GetHerHis] adamları etrafımızı sarıyor. Yiğitçe savaşıyoruz, ama yarıp çıkamıyoruz. Yabanıllar bizi eziyor ve kaçmak zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.one.c:0 "Hücuma öncülük ediyorum, ama yabanıllar sağlam duruyor. Reis [main_figure.GetHerselfHimself] bizimle çarpışıyor, [main_figure.GetHerHis] gücü eşsiz. Birer birer geri itiliyoruz ve kısa sürede savaş alanını yabanıllara bırakarak geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.one.d:0 "Hücumumuz yabanıl saflarında kayaya çarpan dalgalar gibi kırılıyor. Reis ürkütücü bir ustalıkla savaşıyor ve yabanıllar yaklaşırken geri itilip savaşı bırakmak zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.one.e:0 "Tüm gücümüzle hücum ediyoruz, ama yabanıl reisinin adamları fazla. Saldırıları amansız ve kısa sürede eziliyoruz. Savaş kaybedildi ve vahşi doğaya kaçıyoruz."

 agot_nw_ranger_events.1305.desc.two.a:0 "Yüksek zemini ele geçiriyoruz, ama yabanıl reisi fazlasıyla kurnaz çıkıyor. [main_figure.GetHerHis|U] adamları bizi kanatlardan sarıyor ve daha tepki veremeden kuşatılıyoruz. Savaş alanını yabanıllara bırakarak geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.two.b:0 "Yabanıllar yarıp geçerken yüksek zemindeki savunmamız çöküyor. Reis amansız bir saldırı yönetiyor ve tüm çabalarımıza rağmen eziliyoruz. Geri çekilmekten başka çaremiz yok."

 agot_nw_ranger_events.1305.desc.two.c:0 "Yüksek zemini tutmamıza rağmen yabanıl reisi bizi akıllıca alt ediyor. [main_figure.GetHerHis|U] adamları her yönden saldırıp savunmamızı eziyor. Savaş kaybedildi ve kaçmak zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.two.d:0 "Yabanıllar her yönden akın ederken yüksek zemin pek az koruma sağlıyor. Reis'in taktikleri bize fazla geliyor ve mağlup halde geri püskürtülüyoruz."

 agot_nw_ranger_events.1305.desc.two.e:0 "Stratejik avantajımıza rağmen yabanıl reisinin adamları bizi eziyor. Saldırıları amansız ve kısa sürede savunmamız çöküyor. Tek seçenek geri çekilip yeniden toparlanmak."

 agot_nw_ranger_events.1305.desc.three.a:0 "Ateşi yakma planımız ters teper. Yabanıllar aldatmacayı çabucak görür ve alevleri bize çevirir. Reis, [main_figure.GetHerHis] adamlarını hızlı bir karşı saldırıya yönlendirir ve bizi geri çekilmeye zorlar."

 agot_nw_ranger_events.1305.desc.three.b:0 "Ateş kaos yaratmak içindi, ama yabanıllar hazırdı. Bizi manevrayla alt ediyorlar; reis, [main_figure.GetHerHis] adamlarını kurnaz bir hassasiyetle yönetiyor. Tuzaklarına yakalanıp kaçmak zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.three.c:0 "Aldatmaca girişimimiz fena halde başarısız oluyor. Yabanıl reisi hileyi görür ve [main_figure.GetHerHis] adamlarına saldırı emri verir. Karmaşada eziliriz ve canımızı zor kurtarırız."

 agot_nw_ranger_events.1305.desc.three.d:0 "Ateş çok hızlı yayılıyor; yabanıllar yerine bizi tuzağa düşürüyor. Reis, [main_figure.GetSheHe] [main_figure.GetHerHis] adamlarını yıkıcı bir karşı saldırıya yönlendirirken kahkaha atıyor. Mağlup ve dağılmış halde geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1305.desc.three.e:0 "Ateşi siper olarak kullanma planımız, yabanıllar onu bize çevirince başarısız oluyor. Reis'in adamları fazlasıyla düzenli ve çabucak eziliyoruz. Utanç içinde geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1305.a:0 "Savaş kaybedildi."

 agot_nw_ranger_events.1305.a.tt.super_dead:0 "Savaştım, kaybettim, artık dinleniyorum.."

 agot_nw_ranger_events.1305.a.tt.im_wounded:0 "Ama sıyrıklarla kurtulmayı başardım.."

 ranger_laamp_contract_1401_contract:0 "Reis Tarafından Çağrıldık"

 ranger_laamp_contract_1401_request:0 "Bu [agot_ranger_mission|E], [TaskContract.GetEmployer.GetName]'i ziyaret edip [TaskContract.GetEmployer.GetHerHis] niyetini öğrenmeni gerektirir"

 ranger_laamp_contract_1401_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1401_desc:0 "Sizinle görüşmekle ilgilenen bir yabanıl reisiyle temas kurdum.\n\n[TaskContract.GetEmployer.GetSheHe|U] adınızı duymuş ve yüz yüze konuşmak istiyor. Bunun güvenli olacağının garantisi yok, ama [TaskContract.GetEmployer.GetSheHe] düşmanca görünmüyordu. [TaskContract.GetEmployer.GetHerHim] ile görüşüp [TaskContract.GetEmployer.GetSheHe] ne istiyor görmeye değer olabilir."

 agot_nw_ranger_events.1401.t:0 "Bilinmeyen Topraklara"

 agot_nw_ranger_events.1401.desc.intro_a:0 "Daha önce yabanıl reisleriyle uğraştık, ama bu farklı. [main_figure.GetSheHe|U] benimle şahsen görüşmek istiyor. Bu tuhaf karşılaşmaya hazırlanırken kamp huzursuz."

 agot_nw_ranger_events.1401.desc.intro_b:0 "Bir yabanıl reisi beni çağırdı ve kampta hava beklentiyle yüklü. [main_figure.GetHerHis] niyetlerini bilmiyoruz, ama [main_figure.GetSheHe] ne istiyor öğrenmeye hazırız."

 agot_nw_ranger_events.1401.desc.intro_c:0 "Bu yabanıl reisinden ne bekleyeceğimi bilmiyorum. [main_figure.GetHerHis|U] daveti bir hile de olabilir, bir fırsat da. Her halükârda, toplantı için hazırlanıyoruz."

 agot_nw_ranger_events.1401.desc.intro_d:0 "Yabanıl reisinin mesajı beklenmedikti. Kampın bir düşmanı tarafından çağrılmak riskli hissettiriyor, ama bu müzakere etmek ya da planları hakkında daha fazla bilgi edinmek için ender bir şans olabilir."

 agot_nw_ranger_events.1401.desc.intro_e:0 "Daha önce hiç böyle çağrılmadık. Bir yabanıl reisi beni görmek istiyor ve [main_figure.GetHerHim] ile görüşmeye hazırlanırken kamp gerilim içinde. Bunun barışa mı tehlikeye mi yol açacağını yakında öğreneceğiz."

 agot_nw_ranger_events.1401.desc.outro:0 "\n\nHazırlıklarımızı yaparken kamp kıpırdanıyor. Bu görüşmenin barış mı çatışma mı getireceğini yakında öğreneceğiz."

 agot_nw_ranger_events.1401.a:0 "Hadi gidip reisle görüşelim."

 agot_nw_ranger_events.1401.b:0 "Kampı reisin bulunduğu yere yaklaştır."

 agot_nw_ranger_events.1401.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1402.t:0 "Ateş Başında Hikâyeler"

 agot_nw_ranger_events.1402.desc.intro_a:0 "Ateşin çevresinde oturuyoruz; hikâyeler paylaşırken [main_figure.GetTitledFirstName] beni yakından izliyor. [main_figure.GetHerHis|U] adamları sessiz, ama reis konuşurken gözlerini üzerimde hissedebiliyorum."

 agot_nw_ranger_events.1402.desc.intro_b:0 "[main_figure.GetTitledFirstName] beklediğim gibi değil. [main_figure.GetSheHe|U], kampımızın hikâyelerini anlatırken beni dikkatle dinliyor; söz alışverişi yaparken [main_figure.GetHerHis] gözleri merakla parlıyor."

 agot_nw_ranger_events.1402.desc.intro_c:0 "Kamp ateşinin çevresinde oturup hikâyeler değiş tokuş ediyoruz. [main_figure.GetTitledFirstName] savaşlardan ve akınlardan söz ediyor, ben de Sur'un ötesinden hikâyeler anlatıyorum. [main_figure.GetHerHis|U] bize olan merakı apaçık."

 agot_nw_ranger_events.1402.desc.intro_d:0 "[main_figure.GetTitledFirstName] karşımda oturuyor, [main_figure.GetHerHis] yüzü ateşle aydınlanıyor. Hikâyeler değiş tokuş ediyoruz; [main_figure.GetHerHis] adamları sessizce dinliyor. [main_figure.GetSheHe|U] bizim hakkımızda daha fazlasını öğrenmek istiyor."

 agot_nw_ranger_events.1402.desc.intro_e:0 "[main_figure.GetTitledFirstName], Sur'un ötesindeki yolculuklarımızı [main_figure.GetHerHim] anlatırken sessizce dinliyor. [main_figure.GetSheHe|U] ara sıra başını sallıyor, karşılığında [main_figure.GetHerHis] kendi hikâyelerini anlatıyor. [main_figure.GetSheHe|U] savaştan çok bizimle ilgileniyor gibi."

 agot_nw_ranger_events.1402.desc.mid_a:0 "Yabanıl yaşam biçiminden, sert vahşi doğada hayatta kalmaktan söz ediyor. Karşılığında, [main_figure.GetHerHim] Sur'u koruyarak geçirdiğimiz uzun yılları anlatıyor, karşılaştığımız zorlukları paylaşıyorum."

 agot_nw_ranger_events.1402.desc.mid_b:0 "Geçmiş savaşlardan, sert kışlardan ve Sur'un ötesinde hayatta kalma mücadelesinden konuşuyoruz. Reis akınların hikâyelerini anlatıyor, ben de devriyelerden ve Gece Nöbetçileri'nin görevlerinden söz ediyorum."

 agot_nw_ranger_events.1402.desc.mid_c:0 "Reis, [main_figure.GetHerHis] halkının donmuş vahşi doğadaki zorluklarının hikâyelerini anlatıyor. Ben de aramızda bir anlayış köprüsü kurmayı umarak kendi mücadelelerimizin hikâyelerini sunuyorum."

 agot_nw_ranger_events.1402.desc.mid_d:0 "Hayatta kalmanın hikâyelerini değiş tokuş ediyoruz; [main_figure.GetSheHe] vahşi doğada toplayıcılık yapmaktan söz ediyor, ben de [main_figure.GetHerHim] diyarı korumak için katlandığımız acımasız eğitimden bahsediyorum."

 agot_nw_ranger_events.1402.desc.mid_e:0 "Sohbetimiz akıcı ilerliyor. [main_figure.GetSheHe|U] yabanılların aralıksız hayatta kalma savaşından söz ediyor, ben de [main_figure.GetHerHim] Sur'un ötesindeki uzun devriyelerimizi anlatıyorum."

 agot_nw_ranger_events.1402.desc.outro_a:0 "\n\nAteş çıtırdarken, bu anın bize daha fazla yararı olup olmayacağını düşünüyorum. Belki [main_figure.GetHerHim] etkilersem, reis bize destek sunabilir; belki kampa dönüş yolculuğumuz için biraz yiyecek."

 agot_nw_ranger_events.1402.desc.outro_b:0 "\n\nGece koyulaşıyor, ama bir fırsat seziyorum. Kartlarımı doğru oynarsam, belki reisi dönüş yolculuğumuz için biraz erzak sunmaya ikna edebilirim."

 agot_nw_ranger_events.1402.desc.outro_c:0 "\n\nKonuşmamız biterken aklıma bir fikir geliyor. [main_figure.GetHerHim] sözlerimle ya da davranışlarımla etkilersem, belki reis bize ev yolculuğumuz için erzak sunar."

 agot_nw_ranger_events.1402.desc.outro_d:0 "\n\nReis hikâyelerimizden etkilenmiş görünüyor. İyi bir izlenim bırakabilirsem, kampımız için biraz yiyecek ya da erzak sağlayabilirim."

 agot_nw_ranger_events.1402.desc.outro_e:0 "\n\nReis beni yakından, merakla izliyor. [main_figure.GetHerHim] etkileyebilirsem, [main_figure.GetSheHe] kampa uzun dönüş yolculuğumuz için erzak sunabilir."

 agot_nw_ranger_events.1402.a:0 "[main_figure.GetHerHis] kampını daha iyi yönetmesi için [main_figure.GetHerHim] öğüt veririm."

 agot_nw_ranger_events.1402.b:0 "[main_figure.GetHerHis] kampını ve [main_figure.GetHerHis] liderliğini överim."

 agot_nw_ranger_events.1402.c:0 "[main_figure.GetHerHis] merhametini ve yiyeceğini kazanmak için bir hikâye uydururum."

 agot_nw_ranger_events_1402.a.tt.win:0 "Reis etkilenir ve [main_figure.GetHerHis] erzaklarını paylaşmayı kabul eder"

 agot_nw_ranger_events_1402.a.tt.lose:0 "Reis öğütlerime gücenir ve hiçbir yardım sunmayı reddeder"

 agot_nw_ranger_events_1402.b.tt.win:0 "Reis onurlanır ve yolculuğumuz için bize yiyecek sunar"

 agot_nw_ranger_events_1402.b.tt.lose:0 "Reis sözlerimin ardını görür ve bize hiçbir erzak vermez"

 agot_nw_ranger_events_1402.c.tt.win:0 "Reis hikâyeme inanır ve bize erzak sunar"

 agot_nw_ranger_events_1402.c.tt.lose:0 "Reis yalanımı fark eder ve yardım etmeyi reddeder"

 agot_nw_ranger_events.1404.t:0 "Beklenmedik Bir Nimet"

 agot_nw_ranger_events.1404.desc.one.a:0 "Öğütlerim yabanıl reisinde yankı buldu. [main_figure.GetSheHe|U] yalnızca önerilerimi gönülden kabul etmekle kalmadı, beklediğimin çok ötesinde bir ödül verdi. [main_figure.GetHerHis|U] adamları, kampımızı haftalarca doyuracak kadar yiyecek çuvalları çıkarıyor."

 agot_nw_ranger_events.1404.desc.one.b:0 "Reis önerilerimi onaylayarak başını sallayıp dikkatle dinliyor. [main_figure.GetHerHis] minnettarlığının göstergesi olarak [main_figure.GetSheHe] bize hayal bile edemeyeceğimizden fazla erzak sunuyor. Yolculuğumuzda bizi ayakta tutmaya fazlasıyla yetecek."

 agot_nw_ranger_events.1404.desc.one.c:0 "Yabanıl reisine [main_figure.GetHerHis] kampını düzenlemesi için değerli tavsiyeler verdim ve [main_figure.GetSheHe] açıkça etkilendi. [main_figure.GetSheHe] bize beklenmedik bir yiyecek fazlası sununca [main_figure.GetHerHis|U] cömertliği beni şaşırtıyor."

 agot_nw_ranger_events.1404.desc.one.d:0 "Reis tavsiyelerimi takdir etti ve beklediğimden çok daha fazla yiyecek sundu. [main_figure.GetHerHis|U] adamları çantalarımızı, bizi uzun süre iyi besleyecek kadar erzakla doldurdu."

 agot_nw_ranger_events.1404.desc.one.e:0 "[main_figure.GetHerHis] kampının yönetimini iyileştirme sözlerim yabanıl reisinde yankı buldu. Karşılığında [main_figure.GetSheHe] bize hayal edebileceğimden çok daha fazlasını verdi; tüm kampımızı doyuracak kadar yiyecek sundu."

 agot_nw_ranger_events.1404.desc.two.a:0 "Yabanıl reisine ettiğim iltifatlar beklenenden iyi işe yaradı. [main_figure.GetSheHe|U] gülümsedi, açıkça onurlanmıştı ve [main_figure.GetHerHis] adamlarını, istediğimden bile fazla erzak getirmeleri için çağırdı."

 agot_nw_ranger_events.1404.desc.two.b:0 "Reisin kampını ve liderliğini övmem karşılığını buldu. [main_figure.GetSheHe] yalnızca yardım etmeyi kabul etmekle kalmadı, [main_figure.GetHerHis] adamlarını olası görmediğimizden çok daha fazla yiyecek getirmeye gönderdi. Taşıyabileceğimizden fazlasıyla ayrılıyoruz."

 agot_nw_ranger_events.1404.desc.two.c:0 "Reis sözlerime gülümsedi, iltifatlarımdan açıkça memnundu. [main_figure.GetSheHe|U] bize beklediğimizin çok ötesinde erzak sunuyor; tüm kampımızı günlerce doyuracak kadar."

 agot_nw_ranger_events.1404.desc.two.d:0 "Sözlerimden onurlanan reis bizi cömertçe ödüllendirdi. Biraz erzak için yapılan basit bir istek, beklemediğimiz bir yiyecek bolluğuna dönüştü."

 agot_nw_ranger_events.1404.desc.two.e:0 "Sözlerim yabanıl reisinde doğru teli titretti. [main_figure.GetHerHis|U] minnettarlığı eziciydi ve çantalarımızı ağzına kadar doldurarak, olası gördüğümüzden daha fazla yiyecekle ayrıldık."

 agot_nw_ranger_events.1404.desc.three.a:0 "Yabanıl reisi uydurma hikâyemin her sözüne inandı. [main_figure.GetSheHe] yalnızca yiyecek vermekle kalmadı, beklediğimizden çok daha fazlasını sundu; çantalarımızı beklenmedik bir nimetle doldurdu."

 agot_nw_ranger_events.1404.desc.three.b:0 "Yalanım kusursuz işledi. Hikâyemden etkilenen yabanıl reisi, [main_figure.GetHerHis] adamlarına umduğumdan çok daha fazla yiyecek çıkarmalarını emretti. Yolculuk için erzakla yüklendik."

 agot_nw_ranger_events.1404.desc.three.c:0 "Aldatmacam karşılığını buldu. Bizim çaresiz durumda olduğumuzu sanan reis, [main_figure.GetHerHis] adamlarını aklımıza bile getiremeyeceğimiz kadar yiyecek toplamaya gönderdi. Çantalarımız patlama noktasına kadar dolu halde ayrılıyoruz."

 agot_nw_ranger_events.1404.desc.three.d:0 "Yabanıl reisi hikâyeme bütünüyle inandı; [main_figure.GetHerHis] cömertliği beklentilerimin çok üzerindeydi. [main_figure.GetHerHis|U] adamları ihtiyacımızdan çok daha fazla erzak çıkardı; tam bir şans eseri."

 agot_nw_ranger_events.1404.desc.three.e:0 "Uydurduğum hikâye yabanıl reisini duygulandırdı. [main_figure.GetSheHe] yalnızca bana inanmakla kalmadı, hayal edebileceğimizden çok daha fazla erzak sundu; çantalarımızı beklenmedik bir yiyecek bolluğuyla doldurdu."

 agot_nw_ranger_events.1404.a:0 "Ne tuhaf bir [Select_CString(main_figure.IsFemale,'kadın','adam')]."

 agot_nw_ranger_events.1405.t:0 "Eli Boş"

 agot_nw_ranger_events.1405.desc.one.a:0 "[main_figure.GetHerHis] kampını iyileştirme öğütlerim planlandığı gibi gitmedi. Yabanıl reisi kaşlarını çattı, açıkça etkilenmemişti ve bize soğuk bakışlardan başka bir şey sunmadı. Elimiz boş ayrılıyoruz."

 agot_nw_ranger_events.1405.desc.one.b:0 "Reis önerilerimi dinledi, ama [main_figure.GetSheHe] ilgilenmediği belliydi. Sonunda [main_figure.GetSheHe] öğütlerimi görmezden geldi ve kampa götüreceğimiz hiçbir erzak vermedi."

 agot_nw_ranger_events.1405.desc.one.c:0 "Yabanıl reisine [main_figure.GetHerHis] kampını yönetme konusunda öğüt verme girişimim başarısız oldu. [main_figure.GetSheHe|U] gücenmiş görünüyordu ve bu karşılaşmadan hiçbir şey kazanmadan eli boş ayrıldık."

 agot_nw_ranger_events.1405.desc.one.d:0 "Yabanıl reisinin [main_figure.GetHerHis] kampını geliştirmesine yardım etmeye çalıştım, ama [main_figure.GetSheHe] sözlerimi hoş karşılamadı. [main_figure.GetSheHe], [main_figure.GetHerHis] elini sallayarak bizi, ortada hiçbir kazanç olmadan yolumuza gönderdi."

 agot_nw_ranger_events.1405.desc.one.e:0 "Öğüt sözlerim yabanıl reisinin hoşuna gitmedi. [main_figure.GetSheHe|U] önerilerimden rahatsız olmuş görünüyordu ve hiçbir destek ya da erzak almadan ayrılmak zorunda kaldık."

 agot_nw_ranger_events.1405.desc.two.a:0 "Yabanıl reisini pohpohlamaya çalıştım, ama sözlerim etkisiz kaldı. [main_figure.GetSheHe|U] etkilenmemiş görünüyordu ve [main_figure.GetHerHis] kampından hayal kırıklığından başka bir şeyle ayrılmadık."

 agot_nw_ranger_events.1405.desc.two.b:0 "İltifatlarım yabanıl reisini etkilemedi. [main_figure.GetSheHe|U], [main_figure.GetHerHim] memnun etme çabalarımı gördü ve yolculuk için hiçbir erzak sunmadan bizi gönderdi."

 agot_nw_ranger_events.1405.desc.two.c:0 "Reisi etkilemeye çalıştım, ama çabalarım boşa gitti. [main_figure.GetSheHe|U] sözlerimle ilgilenmedi ve görüşmemizden ortada hiçbir şey olmadan, eli boş kampından ayrıldık."

 agot_nw_ranger_events.1405.desc.two.d:0 "Yabanıl reisini övme girişimlerim ters tepti. [main_figure.GetSheHe|U] dalkavukluğu takdir etmedi ve kampa götürecek tek bir erzak bile vermeden bizi gönderdi."

 agot_nw_ranger_events.1405.desc.two.e:0 "Nazik sözlerimin bize biraz iyilik kazandıracağını ummuştum, ama yabanıl reisi etkilenmedi. [main_figure.GetSheHe|U], yolculuklarımız için hiçbir destek sunmadan bizi geri çevirdi."

 agot_nw_ranger_events.1405.desc.three.a:0 "Yalanım planlandığı gibi gitmedi. Yabanıl reisi aldatmacamı görüp şüphelendi. [main_figure.GetSheHe] bize yardım etmek yerine elimiz boş gönderdi."

 agot_nw_ranger_events.1405.desc.three.b:0 "Uydurma hikâyemin bize merhamet kazandıracağını sanmıştım, ama yabanıl reisi aldanmadı. [main_figure.GetSheHe|U] yalanı gördü ve bize hiçbir erzak sunmayı reddetti."

 agot_nw_ranger_events.1405.desc.three.c:0 "Hikâyem kuşkuyla karşılandı ve yabanıl reisi yalan söylediğimi çabucak anladı. Öfkelenen [main_figure.GetSheHe], bizi hiçbir erzak ve görüşmeden kazanılacak hiçbir şey olmadan gönderdi."

 agot_nw_ranger_events.1405.desc.three.d:0 "Reis hikâyeme inanmadı ve düşmanca davranmaya başladı. [main_figure.GetSheHe|U], bize yolculuk için hiçbir yiyecek ya da destek vermeyi reddederek [main_figure.GetHerHis] kampını terk etmemizi emretti."

 agot_nw_ranger_events.1405.desc.three.e:0 "Yabanıl reisini aldatma girişimim fena halde başarısız oldu. [main_figure.GetSheHe|U] yalanlarımı görüp bize hiçbir şey sunmayı reddetti; elimiz boş kaldık."

 agot_nw_ranger_events.1405.a:0 "Kampa geri dönsek iyi olur."

 ranger_laamp_contract_1501_contract:0 "Tehlikedeki Çocuk"

 ranger_laamp_contract_1501_request:0 "Bu [agot_ranger_mission|E] için bir yabanıl çocuğunun hayatını kurtarmanız gerekir"

 ranger_laamp_contract_1501_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1501_desc:0 "Bölgeyi keşfederken beklenmedik bir şey buldum: derin bir uçurumun üzerinde ince bir dalda mahsur kalmış bir çocuk.\n\nDal her an kırılacak gibi görünüyor ve aşağıdaki boşluk sinsi. Tehlikeli bir durum; onları kurtarmak istiyorsak hızla harekete geçmeliyiz."

 agot_nw_ranger_events.1501.t:0 "Kurtarma"

 agot_nw_ranger_events.1501.desc.intro_a:0 "[my_ranger.GetTitledFirstNamePossessive] raporu acil ve kaybedecek zamanımız yok. Bir çocuk tehlikede, bir uçurumun üzerinde mahsur kalmış. Hızlı davranmazsak hayatta kalamayacak."

 agot_nw_ranger_events.1501.desc.intro_b:0 "Sur'un ötesinde birçok tehlikeyle yüzleştik, ama bu farklı hissettiriyor. Bir çocuğun hayatı tehlikede; ölümcül bir boşluğun üzerinde kıl payı asılı. Kaybedecek zamanımız yok."

 agot_nw_ranger_events.1501.desc.intro_c:0 "Bir çocuk mahsur kalmış, hayatı kılı kırk yarıyor. Böyle genç bir canın tehlikede olması düşüncesi bizi daha hızlı hareket etmeye itiyor. Çok geç olmadan ona ulaşmalıyız."

 agot_nw_ranger_events.1501.desc.intro_d:0 "[my_ranger.GetTitledFirstNamePossessive] raporu ürpertici: ölümcül bir düşüşün üzerinde bir dala mahsur kalmış bir çocuk. En kötüsü olmadan oraya hızla varmalıyız. Bu kurtarma görevinde hataya yer yok."

 agot_nw_ranger_events.1501.desc.intro_e:0 "Bir çocuğun hayatı risk altında; derin bir uçurumun üzerinde kırılgan bir dala asılı duruyor. Her geciktirdiğimiz anın onu felakete yaklaştırdığını bilerek hızla yola çıkmaya hazırlanıyoruz."

 agot_nw_ranger_events.1501.desc.outro:0 "\n\nGöreve hazırlanırken hava ivedilikle ağırlaşmış. Çocuğun hayatı hızımıza ve becerimize bağlı; tereddüde yer yok."

 agot_nw_ranger_events.1501.a:0 "Hadi gidip çocuğu kurtaralım."

 agot_nw_ranger_events.1501.b:0 "Yardım etmek için kampı uçuruma yaklaştır."

 agot_nw_ranger_events.1501.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1502.t:0 "Korku Dolu Kurtarma"

 agot_nw_ranger_events.1502.desc.intro_a:0 "Uçurumun kenarına varıyoruz ve orada, kırılgan bir dala tutunmuş halde çocuk duruyor. [main_figure.GetHerHis|U] iri gözleri korku dolu ve [main_figure.GetSheHe] bize güvenmediği açık."

 agot_nw_ranger_events.1502.desc.intro_b:0 "Yaklaşırken yabanıl çocuğunu dalda sallanırken görüyoruz; aşağısı dehşet verici. [main_figure.GetSheHe|U] bizi korucu olarak tanıyıp dehşetle bakıyor ve donup kalıyor."

 agot_nw_ranger_events.1502.desc.intro_c:0 "Sırttan nihayet çocuğu seçiyoruz. [main_figure.GetSheHe|U] çaresizce dala tutunuyor, ama [main_figure.GetHerHis] gözleri bizimkilerle buluşunca korku çöküyor. [main_figure.GetSheHe|U] kim olduğumuzu biliyor ve bu işi zorlaştırıyor."

 agot_nw_ranger_events.1502.desc.intro_d:0 "Uçurumun kenarına ulaşıyoruz ve çocuk orada, zor bela tutunuyor. [main_figure.GetHerHis|U] korkusu elle tutulur ve [main_figure.GetSheHe] bizi görünce geri çekiliyor. [main_figure.GetSheHe|U] kolayca işbirliği yapmayacak."

 agot_nw_ranger_events.1502.desc.intro_e:0 "Çocuk can havliyle tutunuyor, ama [main_figure.GetHerHis] bize, koruculara duyduğu korku açık. [main_figure.GetHerHis|U] küçük bedeni titriyor ve dal, [main_figure.GetHerHim] altında uğursuzca gıcırdıyor."

 agot_nw_ranger_events.1502.desc.mid_a:0 "Yaklaştıkça çocuğun korkusu daha da büyüyor. [main_figure.GetHerHis|U] kavrayışı sıkılaşıyor, ama [main_figure.GetSheHe] sanki [main_figure.GetHerHim]a yardım etmek yerine zarar vermemizi bekliyormuş gibi bizden uzaklaşıyor."

 agot_nw_ranger_events.1502.desc.mid_b:0 "Yaklaşmaya çalıştığımız her seferinde çocuk geri çekiliyor; [main_figure.GetHerHis] korkusu [main_figure.GetHerHis] hayatta kalma içgüdüsüne galip geliyor. Dal tehlikeli biçimde sallanıyor ve zaman tükeniyor."

 agot_nw_ranger_events.1502.desc.mid_c:0 "[main_figure.GetHerHim] sakinleştirmeye çalışıyoruz, ama bizi görmek [main_figure.GetHerHim] daha da korkutuyor gibi. [main_figure.GetHerHis|U] hareketleri çılgınlaşıyor ve dal, [main_figure.GetHerHis] ağırlığı altında eğilmeye başlıyor."

 agot_nw_ranger_events.1502.desc.mid_d:0 "Ne kadar yaklaşırsak çocuğun korkusu o kadar ele geçiriyor. [main_figure.GetSheHe|U] her konuştuğumuzda irkiliyor ve [main_figure.GetHerHis] bedeni kırılgan dalda santim santim daha da dışa kayıyor."

 agot_nw_ranger_events.1502.desc.mid_e:0 "Gözleri bizimle aşağıdaki tehlikeli boşluk arasında gidip geliyor; hangisinden daha çok korktuğu belirsiz. Ama [main_figure.GetHerHis] yaklaşma konusundaki isteksizliği açık; [main_figure.GetSheHe] bize güvenmiyor."

 agot_nw_ranger_events.1502.desc.outro_a:0 "\n\nDal çökmeden hızla hareket etmeliyiz. Çocuğun korkusu [main_figure.GetHerHim] işbirliğine yanaştırmıyor, ama [main_figure.GetHerHis] güvenini kazanmanın ya da bir çözümü zorlamanın bir yolu olmalı."

 agot_nw_ranger_events.1502.desc.outro_b:0 "\n\nKaybedecek zaman yok. Çocuk dehşet içinde; [main_figure.GetHerHim] sakinleştirmenin bir yolunu bulmaz ya da kararlı davranmazsak [main_figure.GetSheHe] bu düşüşü atlatamayacak."

 agot_nw_ranger_events.1502.desc.outro_c:0 "\n\nDurum vahimleşiyor. Çocuğun korkusu aleyhimize işliyor ve dal eğiliyor. [main_figure.GetHerHim] ulaşmanın bir yolunu bulmalıyız, yoksa bu kurtarma başarısız olacak."

 agot_nw_ranger_events.1502.desc.outro_d:0 "\n\nÇocuğun korkusu bizi geri tutuyor ve dal daha fazla dayanamayacak. Şimdi harekete geçmezsek [main_figure.GetSheHe] [main_figure.GetHerHis] ölümüne düşecek. Zeki, güçlü ya da ikna edici olmalıyız."

 agot_nw_ranger_events.1502.desc.outro_e:0 "\n\nAz zamanımız kaldı. Çocuk işbirliği yapmayacak ve tehlike her saniye büyüyor. İster zorla ister akılla, harekete geçme zamanı."

 agot_nw_ranger_events.1502.a:0 "Dal kırılmadan çocuğu yakalamak için gücümü kullanmayı denerim."

 agot_nw_ranger_events.1502.b:0 "Tehlikeyi anlatarak çocuğu yaklaşmaya ikna etmeye çalışırım."

 agot_nw_ranger_events.1502.c:0 "Çocuğu hileyle yaklaştırmaya çalışırım."

 agot_nw_ranger_events_1502.a.tt.win:0 "Gücüm, [main_figure.GetHerHim] tam zamanında yakalamamı sağlar"

 agot_nw_ranger_events_1502.a.tt.lose:0 "Dal, [main_figure.GetHerHim] ulaşamadan kırılır"

 agot_nw_ranger_events_1502.b.tt.win:0 "Çocuk tehlikeyi anlar ve yaklaşır"

 agot_nw_ranger_events_1502.b.tt.lose:0 "Çocuk dinlemez ve korkuyla donuk kalır"

 agot_nw_ranger_events_1502.c.tt.win:0 "Sözlerim [main_figure.GetHerHim] aldatır ve [main_figure.GetSheHe] erişilebilecek mesafeye gelir"

 agot_nw_ranger_events_1502.c.tt.lose:0 "Çocuk oyunuma gelmez ve olduğu yerde kalır"

 agot_nw_ranger_events.1504.t:0 "Kurtarma Başarılı Olur"

 agot_nw_ranger_events.1504.desc.one.a:0 "Hızla hareket ediyorum; dal [main_figure.GetHerHim] altında çatlar çatlamaz çocuğu yakalıyorum. [main_figure.GetHerHis|U] korkusu hâlâ görünür, ama [main_figure.GetSheHe], [main_figure.GetHerHim] güvenliğe çekerken bana tutunuyor."

 agot_nw_ranger_events.1504.desc.one.b:0 "Bir güç patlamasıyla çocuğa ulaşıyorum ve dal kırılmadan [main_figure.GetHerHim] dalın üzerinden çekiyorum. [main_figure.GetHerHis|U] gözleri korkudan iri, ama [main_figure.GetSheHe] kavrayışımda güvende."

 agot_nw_ranger_events.1504.desc.one.c:0 "An gergin, ama hızla davranıyorum; dal kırılmadan çocuğu dalın üzerinden yakalıyorum. [main_figure.GetSheHe|U] bana tutunuyor, hâlâ titriyor, ama sonunda güvende."

 agot_nw_ranger_events.1504.desc.one.d:0 "Dal çökerken çocuğu kollarıma çekmeyi başarıyorum. Tehlikeli kenardan uzaklaşırken [main_figure.GetHerHis|U] korkusu rahatlamaya dönüşüyor."

 agot_nw_ranger_events.1504.desc.one.e:0 "Dal [main_figure.GetHerHim] altında sarsılırken çocuğu yakalamak için gücümün her zerresini kullanıyorum. [main_figure.GetSheHe|U] dehşet içinde ama güvende; [main_figure.GetHerHim] sağlam zemine taşırken sıkıca tutuyorum."

 agot_nw_ranger_events.1504.desc.two.a:0 "Sözlerim çocuğun korkusunu kırıyor. [main_figure.GetSheHe|U] dinliyor ve bana doğru hareket ediyor; dal [main_figure.GetHerHim] altında çökmeden [main_figure.GetHerHim] güvenliğe çekmemi sağlıyor."

 agot_nw_ranger_events.1504.desc.two.b:0 "Tehlikeyi sakinlikle anlatıyorum ve çocuk karşılık verip [main_figure.GetHerHim] güvenle yakalayabileceğim noktaya kadar yaklaşıyor. [main_figure.GetHerHim] sağlam zemine çeker çekmez dal kırılıyor."

 agot_nw_ranger_events.1504.desc.two.c:0 "Çocuk tereddüt ediyor ama sonunda sözlerime güvenip [main_figure.GetHerHim] ulaşabileceğim kadar yaklaşıyor. Dal kırılırken birlikte tehlikeden kurtuluyoruz."

 agot_nw_ranger_events.1504.desc.two.d:0 "Durumu özenle anlatıyorum ve çocuğun korkusu anlayışa yerini bırakıyor. [main_figure.GetSheHe|U] yaklaşıyor ve [main_figure.GetHerHim] tam zamanında güvenliğe çekiyorum."

 agot_nw_ranger_events.1504.desc.two.e:0 "Sakin açıklamam çocuğu rahatlatıyor ve [main_figure.GetSheHe] ihtiyatla yaklaşıyor. Dal çöker çökmez [main_figure.GetHerHim] yukarı çekiyor; [main_figure.GetHerHim] ölümcül bir düşüşten kurtarıyorum."

 agot_nw_ranger_events.1504.desc.three.a:0 "Oyunum işe yarıyor. Hâlâ korkan çocuk bana yaklaşıyor ve dal çökmeden [main_figure.GetHerHim] hızla dalın üzerinden yakalıyorum."

 agot_nw_ranger_events.1504.desc.three.b:0 "Çocuğu bana doğru hareket etmeye ikna etmek için hızlı bir yalan kullanıyorum. [main_figure.GetSheHe|U] tereddüt ediyor, sonra yaklaşıyor; dal kırılmadan [main_figure.GetHerHim] yakalamamı sağlıyor."

 agot_nw_ranger_events.1504.desc.three.c:0 "Çocuk oyunuma geliyor ve santim santim yaklaşıyor. Dal, [main_figure.GetHerHis] ağırlığı altında parçalanır parçalanmaz [main_figure.GetHerHim] güvenliğe çekiyorum."

 agot_nw_ranger_events.1504.desc.three.d:0 "Sözlerim çocuğu bir anlığına bana güvendiriyor ve bana gereken de bu. Dal kırılmadan [main_figure.GetHerHim] dalın üzerinden yakalıyorum."

 agot_nw_ranger_events.1504.desc.three.e:0 "Aldatmacam işe yarıyor; korku güvene yerini bırakıyor ve çocuk [main_figure.GetHerHim] güvenliğe çekebileceğim kadar yaklaşıyor. Dal kırılıyor, ama o artık tehlikeden uzak."

 agot_nw_ranger_events.1504.a:0 "Çocuk güvende ve tehlike geçti."

 agot_nw_ranger_events.1505.t:0 "Çocuk Kaybedildi"

 agot_nw_ranger_events.1505.desc.one.a:0 "Hızla hareket ediyorum, ama yeterince hızlı değil. Çocuğa uzanır uzanmaz dal kırılıyor ve [main_figure.GetSheHe] aşağıdaki uçuruma düşerken çaresizce izliyorum."

 agot_nw_ranger_events.1505.desc.one.b:0 "Çocuğu yakalamaya çalışıyorum, ama dal sarsılıyor ve [main_figure.GetHerHim] ulaşamadan çöküyor. Bir anda çocuk yok oluyor; [main_figure.GetSheHe] düşerken çığlık atıyor."

 agot_nw_ranger_events.1505.desc.one.c:0 "[main_figure.GetHerHim] kurtarmak için öne atılırken dal sonunda dayanamıyor. Parmaklarım [main_figure.GetHerHis] pelerinine değiyor, ama ıskalıyorum ve çocuk aşağıdaki derinliklere yuvarlanıyor."

 agot_nw_ranger_events.1505.desc.one.d:0 "Çocuğu yukarı çekmek için zorluyorum, ama [main_figure.GetHerHim] kavrayamadan dal kırılıyor. [main_figure.GetSheHe] uçurumda kaybolurken [main_figure.GetHerHis|U] dehşet dolu çığlığı yankılanıyor."

 agot_nw_ranger_events.1505.desc.one.e:0 "Bedenimi sınıra kadar zorluyorum, [main_figure.GetHerHim] ulaşmaya çalışıyorum, ama dal kırılıyor. Çocuk düşerken dehşetle izliyorum; olacakları durduramıyorum."

 agot_nw_ranger_events.1505.desc.two.a:0 "Sözlerim çocuğa ulaşamıyor. [main_figure.GetHerHis|U] korku akla galip geliyor ve [main_figure.GetSheHe] yaklaşmak yerine geri çekiliyor. Dal kırılıyor ve [main_figure.GetSheHe] uçuruma kapılıyor."

 agot_nw_ranger_events.1505.desc.two.b:0 "Tehlikeyi anlatmaya çalışıyorum, ama çocuğun dehşeti çok büyük. [main_figure.GetSheHe|U] yaklaşmayı reddediyor ve dal, [main_figure.GetHerHim] altında kırılıyor. [main_figure.GetSheHe|U] aşağıdaki boşluğa düşüyor."

 agot_nw_ranger_events.1505.desc.two.c:0 "Sakin konuşuyorum, ama çocuk karşılık vermiyor. [main_figure.GetHerHis|U] korkusu [main_figure.GetHerHim] alt ediyor ve daha harekete geçemeden dal kırılıp [main_figure.GetHerHim] derinliklere yuvarlıyor."

 agot_nw_ranger_events.1505.desc.two.d:0 "Açıklamam çocuğu sakinleştirmeye hiç yaramıyor. [main_figure.GetSheHe|U] korkuyla donuk kalıyor ve dal kırılıp [main_figure.GetSheHe] uçuruma düşerken yalnızca izleyebiliyorum."

 agot_nw_ranger_events.1505.desc.two.e:0 "Çocukla mantık kurmaya çalışıyorum, ama sözlerim sağır kulaklara düşüyor. [main_figure.GetHerHim] altındaki dal kırılıyor ve [main_figure.GetSheHe] uçurumda kaybolurken [main_figure.GetHerHis] çığlığı yankılanıyor."

 agot_nw_ranger_events.1505.desc.three.a:0 "Oyunum işe yaramıyor. Çocuk aldatmacamı seziyor ve yaklaşmayı reddediyor. Dal çöküyor ve [main_figure.GetSheHe], [main_figure.GetHerHim] kurtaramadan düşüyor."

 agot_nw_ranger_events.1505.desc.three.b:0 "Çocuğu yönlendirmeye çalışıyorum, ama [main_figure.GetSheHe] korkuyla donuk kalıyor. [main_figure.GetHerHim] altındaki dal kırılıyor ve son bir çığlıkla [main_figure.GetSheHe] uçurumda kayboluyor."

 agot_nw_ranger_events.1505.desc.three.c:0 "Aldatmacam [main_figure.GetHerHim] ikna edemiyor. Çocuk dalda kalıyor ve [main_figure.GetHerHim] ulaşamadan dal kırılıyor. [main_figure.GetSheHe] düşerken çaresizce izliyorum."

 agot_nw_ranger_events.1505.desc.three.d:0 "Çocuk yalanıma inanmıyor ve [main_figure.GetSheHe] olduğu yere kök salıyor. [main_figure.GetHerHim] altındaki dal kırılıyor ve [main_figure.GetSheHe] aşağıdaki karanlığa dalıyor."

 agot_nw_ranger_events.1505.desc.three.e:0 "Çocuğu kandırma girişimim başarısız oluyor. [main_figure.GetSheHe|U] olduğu yerde kalıyor ve dal, [main_figure.GetHerHis] ağırlığı altında kırılıyor. [main_figure.GetSheHe] uçurumda kaybolurken [main_figure.GetHerHis|U] çığlığı sönüyor."

 agot_nw_ranger_events.1505.a:0 "Burada yapabileceğimiz başka bir şey yok."

 ranger_laamp_contract_1601_contract:0 "Reisin Hazinesi"

 ranger_laamp_contract_1601_request:0 "Bu [agot_ranger_mission|E] için [TaskContract.GetEmployer.GetNamePossessive] eserini almanız gerekir"

 ranger_laamp_contract_1601_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1601_desc:0 "Yabanıl kamplarından birinden, yakındaki bir reisin değerli bir şeye, bir yadigâra sahip olduğunu duydum.\n\nİyi korunduğu söyleniyor, ama hızlı davranırsak [TaskContract.GetEmployer.GetSheHe] geldiğimizi anlamadan onu ele geçirebiliriz. Bu bizim için gerçek bir fırsat olabilir."

 agot_nw_ranger_events.1601.t:0 "Yadigârın Peşinde"

 agot_nw_ranger_events.1601.desc.intro_a:0 "[my_ranger.GetTitledFirstNamePossessive] bilgisi, değerli bir şeyin anahtarı olabilir. Bir yabanıl reisinin eserini almak bize koz ya da güç kazandırabilir. Erzaklarımızı topluyor ve göreve hazırlanıyoruz."

 agot_nw_ranger_events.1601.desc.intro_b:0 "Yabanıl reisinin elindekinin ne olduğunu bilmemesi ihtimali var, ama biz biliyoruz. Bu eser önemli olabilir. Kaybedecek zamanımız yok; reis değerini fark etmeden ona ulaşmalıyız."

 agot_nw_ranger_events.1601.desc.intro_c:0 "Yabanıl ellerindeki değerli bir yadigâr, görmezden gelebileceğimiz bir şey değil. Kamp hazır olduğu için, ne olursa olsun onu geri almaya ve kendimize mal etmeye hazırlanıyoruz."

 agot_nw_ranger_events.1601.desc.intro_d:0 "[my_ranger.GetTitledFirstNamePossessive] keşfi ender bir fırsat. Yabanıl reisi değerli bir şeyi, ihtiyaç duyabileceğimiz bir şeyi koruyor. Kamp kıpırdanırken yola çıkıp onu ele geçirmeye hazırlanıyoruz."

 agot_nw_ranger_events.1601.desc.intro_e:0 "Bir yabanıl reisinin elindeki yadigâr, bela ya da fırsat anlamına gelebilir. Elimizden kaymadan hızla vurmamız gerektiğini bilerek çabucak kuşanıyoruz."

 agot_nw_ranger_events.1601.desc.outro:0 "\n\nGörev için kendimizi hazırlıyoruz. Eser daha büyük bir şeyin anahtarı olabilir, ama başarılı olacaksak hızlı ve akıllıca hareket etmemiz gerekecek."

 agot_nw_ranger_events.1601.a:0 "Hadi gidip eseri geri alalım."

 agot_nw_ranger_events.1601.b:0 "Kampı yabanıl şefinin topraklarına yaklaştır."

 agot_nw_ranger_events.1601.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1602.t:0 "Yadigâra Yaklaşırken"

 agot_nw_ranger_events.1602.desc.intro_a:0 "[main_figure.GetTitledFirstNamePossessive] kampının kıyısına varıyoruz; yadigâr içeride bir yerde gizli. Reis'in adamları nöbet tutuyor ve kamp tetikte. Dikkatle hareket etmeliyiz."

 agot_nw_ranger_events.1602.desc.intro_b:0 "Kamp gözümüze girince [main_figure.GetTitledFirstNamePossessive] adamlarını nöbet tutarken görüyoruz. Yadigâr içeride, ama ona ulaşmak kolay olmayacak. Davetsiz misafirlere hazırlılar; dikkatsiz olmayı göze alamayız."

 agot_nw_ranger_events.1602.desc.intro_c:0 "Yabanıl kampı ileride; iyi korunuyor ve tetikte. Yadigâr içeride bir yerde gizli, ama [main_figure.GetTitledFirstNamePossessive] adamları dikkatle izliyor. Fark edilmeden içeri girmek zor olacak."

 agot_nw_ranger_events.1602.desc.intro_d:0 "[main_figure.GetTitledFirstNamePossessive] topraklarına ulaştık. [main_figure.GetHerHis|U] kampı iyi savunuluyor ve yadigâr büyük olasılıkla derinlerde gizli. Muhafızlar tetikte; ilerlemek için sağlam bir plana ihtiyacımız olacak."

 agot_nw_ranger_events.1602.desc.intro_e:0 "Gölgelerden yabanıl kampını gözlüyoruz. [main_figure.GetTitledFirstNamePossessive] muhafızları iyi silahlanmış ve uyanık. Peşinde olduğumuz yadigâr içeride bir yerde, ama yaklaşmak kolay olmayacak."

 agot_nw_ranger_events.1602.desc.mid_a:0 "Kamp beklediğimizden daha sağlam; muhafızlar çevrede devriye geziyor. Yanlış bir hareket yabanılları alarma geçirebilir ve bu olursa yadigâr elimizden kaçar."

 agot_nw_ranger_events.1602.desc.mid_b:0 "Kilit noktalarda duran birkaç muhafız seçiyoruz; bu da fark edilmeden yaklaşmayı zorlaştırıyor. Yabanıllar belaya hazırlı görünüyor ve yadigâr büyük olasılıkla kampın derinlerinde gizli."

 agot_nw_ranger_events.1602.desc.mid_c:0 "Yabanıl reisi [main_figure.GetHerHis] mevzisini iyi sağlamlaştırmış. Her girişte muhafızlar konuşlu ve kamp hareket halinde. Alarma geçirmeden yadigâra ulaşmak bir meydan okuma olacak."

 agot_nw_ranger_events.1602.desc.mid_d:0 "Yabanıl devriyelerinin kampın içinde hareket ettiğini izliyoruz. Reis'in adamları uyanık ve yadigâr sıkı korunuyor. Onu geri almayı umuyorsak akıllarını çekmemiz gerekecek."

 agot_nw_ranger_events.1602.desc.mid_e:0 "Yabanıl muhafızlar stratejik konumlanmış ve kamp bir savaş için iyi hazırlanmış görünüyor. Yadigâra ulaşmak için ya güç ya da fark edilmekten kaçınacak akıllıca bir hile gerekecek."

 agot_nw_ranger_events.1602.desc.outro_a:0 "\n\nYadigâra yaklaşırken yabanıl reisi beni görüyor. [main_figure.GetSheHe] [main_figure.GetHerHis] silahını çekerken [main_figure.GetHerHis|U] gözleri kısılıyor; savaşa hazır. İster güçle, ister zekâyla, ister stratejiyle hızla harekete geçmeliyim."

 agot_nw_ranger_events.1602.desc.outro_b:0 "\n\nYadigâr görüş alanında, ama yabanıl reisi beni fark ediyor. [main_figure.GetHerHis|U] eli [main_figure.GetHerHis] silahına gidiyor ve gergin bir açmaz başlıyor. [main_figure.GetHerHim] savaşmak, aldatmak ya da manevrayla alt etmek arasında karar vermeliyim."

 agot_nw_ranger_events.1602.desc.outro_c:0 "\n\nYadigâra kol mesafesindeyim, ama yabanıl reisi beni görüyor. [main_figure.GetHerHis|U] adamları hemen arkada ve artık geri dönüş yok. [main_figure.GetHerHim] manevrayla alt etmezsem savaş kaçınılmaz görünüyor."

 agot_nw_ranger_events.1602.desc.outro_d:0 "\n\nYabanıl reisi, yadigâr için burada olduğumu anlayarak göz göze geliyor. [main_figure.GetSheHe|U] onu savunmaya hazır ve [main_figure.GetHerHis] adamları mevziye geçiyor. Karar zamanı: [main_figure.GetHerHim] savaş, [main_figure.GetHerHim] aldat ya da akıllıca bir şey dene."

 agot_nw_ranger_events.1602.desc.outro_e:0 "\n\nReis beni görüyor ve gerilim artıyor. [main_figure.GetSheHe|U] neden burada olduğumu biliyor ve [main_figure.GetHerHis] adamları toplanıyor. İster güçle, ister kurnazlıkla, ister taktikle, hamlemi şimdi yapmalıyım."

 agot_nw_ranger_events.1602.a:0 "Reisi yadigâr için dövüşe davet ederim."

 agot_nw_ranger_events.1602.b:0 "Reisin gözüne toprak atarak [main_figure.GetHerHim] kör eder ve yadigârı kaparım."

 agot_nw_ranger_events.1602.c:0 "Reisi tuzağa çekmek için sahte bir geri çekilme emri veririm."

 agot_nw_ranger_events_1602.b.tt.win:0 "Toprakla kör olan reis sendeleyerek düşer ve [main_figure.GetSheHe] tepki veremeden yadigârı alırım"

 agot_nw_ranger_events_1602.b.tt.lose:0 "Reis çabucak toparlanır ve yadigârı kapamadan beni yakalar"

 agot_nw_ranger_events_1602.c.tt.win:0 "Reis hileye kanar ve yadigârı geride bırakarak doğrudan pusumuza yürür"

 agot_nw_ranger_events_1602.c.tt.lose:0 " reis manevrayı görür ve karşılık vererek yadigârla birlikte kaçar"

 agot_nw_ranger_events.1604.t:0 "Hazine"

 agot_nw_ranger_events.1604.desc.one.a:0 "Çarpışma şiddetli, ama gücüm ağır basıyor. Yabanıl reisi önümde yenik düşüyor ve yadigâr bizim oluyor. [main_figure.GetHerHis|U] adamları dağılıyor, bizi zaferle bırakıyor."

 agot_nw_ranger_events.1604.desc.one.b:0 "İsabetle vuruyor, reisi alt ediyorum. [main_figure.GetHerHis|U] gücü tükeniyor ve [main_figure.GetSheHe] yere yığılıyor. [main_figure.GetHerHim] yenilgiye uğratılmışken yadigâr avucumun içinde."

 agot_nw_ranger_events.1604.desc.one.c:0 "Tek bir hızlı hamleyle yabanıl reisini yere seriyorum. [main_figure.GetSheHe|U] azimle savaşıyor, ama yetmiyor. [main_figure.GetHerHis] yenilgisiyle yadigârı güvence altına alıyorum ve kamp sessizliğe gömülüyor."

 agot_nw_ranger_events.1604.desc.one.d:0 "Kılıcım hedefini buluyor ve yabanıl reisi yere düşüyor. [main_figure.GetHerHis|U] adamları, liderlerinin yıkılışını izleyerek duraksıyor. Yadigâr benim ve savaş bitti."

 agot_nw_ranger_events.1604.desc.one.e:0 "Çarpışma başladığı kadar çabuk bitiyor. Reis, son darbemin gücü altında yığılıyor ve [main_figure.GetHerHis] yenilgisiyle yadigârı ve zaferi ele geçiriyoruz."

 agot_nw_ranger_events.1604.desc.two.a:0 "Yabanıl reisi, [main_figure.GetHerHis] gözlerine attığım topla kör olup sendeliyor. Karmaşada yadigârı kapıp sıvışıyorum; [main_figure.GetHerHim] şaşkın ve yenik bırakıyorum."

 agot_nw_ranger_events.1604.desc.two.b:0 "Oyunum işe yarıyor. Reis topla kör oluyor ve [main_figure.GetHerHis] kafa karışıklığı içinde yadigârı güvenceye alıyorum. [main_figure.GetSheHe] toparlandığında biz çoktan gitmişiz; [main_figure.GetHerHim] aşağılanmış halde bırakıyoruz."

 agot_nw_ranger_events.1604.desc.two.c:0 "Aldatmacamla kör olan reis, yadigârı alırken çaresizce duruyor. [main_figure.GetSheHe|U] öfkeyle saldırıyor, ama [main_figure.GetHerHis] çabaları boşuna. Ödülle ayrılıyor ve [main_figure.GetHerHim] geride bırakıyoruz."

 agot_nw_ranger_events.1604.desc.two.d:0 "Reisin şaşkınlığı [main_figure.GetHerHis] çöküşü oluyor. [main_figure.GetSheHe] afallamışken yadigârı kapıyor ve [main_figure.GetSheHe] toparlanamadan gölgelere kayboluyorum. Yadigâr bizim ve reis aşağılanmış halde kalıyor."

 agot_nw_ranger_events.1604.desc.two.e:0 "Toprak, reisi yadigârı kapmama yetecek kadar uzun süre kör ediyor. [main_figure.GetSheHe] neler olduğunu anlamadan ben gitmiş oluyorum ve kamp kaos içinde kalıyor."

 agot_nw_ranger_events.1604.desc.three.a:0 "Sahte geri çekilme kusursuz işliyor. Reis tuzağa adım atıyor ve [main_figure.GetHerHim] kolayca eziyoruz. [main_figure.GetHerHis] yenilgisiyle yadigârı alıyor ve [main_figure.GetHerHis] kampını altüst bırakıyoruz."

 agot_nw_ranger_events.1604.desc.three.b:0 "Taktiksel pusumuz kusursuz. Reis tam içine yürüyor ve [main_figure.GetHerHim] hızla yeniyoruz. [main_figure.GetHerHis|U] adamları kaçıyor ve yadigârı almak bizim elimizde."

 agot_nw_ranger_events.1604.desc.three.c:0 "Reis hileye kanıyor ve güçlerimiz tam doğru anda vuruyor. [main_figure.GetHerHim] yoldan çekilmişken yadigârı alıyor ve kamptan zaferle ayrılıyoruz."

 agot_nw_ranger_events.1604.desc.three.d:0 "Planımız kusursuzca işliyor. Reis tuzağımıza adım atıyor ve [main_figure.GetHerHis] yenilgisi çabuk geliyor. Yadigâr bizim ve yabanıllar dağılmış halde kalıyor."

 agot_nw_ranger_events.1604.desc.three.e:0 "Pusu başarılı. Bunu çok geç fark eden reis, birleşen gücümüzün altında yıkılıyor. [main_figure.GetHerHis|U] adamları geri çekiliyor ve yadigâr elimizde."

 agot_nw_ranger_events.1604.a:0 "Reis yenildi ve yadigâr bizim."

 agot_nw_ranger_events.1605.t:0 "Reis Kaçıyor"

 agot_nw_ranger_events.1605.desc.one.a:0 "Çarpışma kötü gidiyor. Yabanıl reisinin gücü beni şaşırtıyor ve geri itiliyorum. Sonunda eziliyoruz ve reis, yadigâr elinde kaçıyor."

 agot_nw_ranger_events.1605.desc.one.b:0 "Öne hücum ediyorum, ama reis acımasız bir vuruşla karşılık veriyor. [main_figure.GetHerHis|U] adamları saldırıyı sıkıştırıyor ve tüm çabalarıma rağmen yadigârsız geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1605.desc.one.c:0 "Kılıcım reisin kılıcıyla buluşuyor, ama [main_figure.GetSheHe] beklediğimden güçlü. Geriye sendeleyerek çekiliyorum ve [main_figure.GetHerHis] adamları yaklaşıp bizi eziyor. Yadigâr erişemeyeceğimiz yerde kalıyor."

 agot_nw_ranger_events.1605.desc.one.d:0 "Reisle çarpışıyorum, ama [main_figure.GetHerHis] savunması sağlam duruyor. [main_figure.GetHerHis|U] adamları bizi eziyor ve yadigârı geride bırakarak eli boş geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1605.desc.one.e:0 "Yabanıl reisi vahşetle savaşıyor. Tüm çabalarıma rağmen denk değiliz. Reis zaferle yadigârı havaya kaldırırken kamptan geri çekiliyoruz."

 agot_nw_ranger_events.1605.desc.two.a:0 "Toprağı reise atıyorum, ama [main_figure.GetSheHe] oyunumu görüp kaçıyor. Ben tepki veremeden [main_figure.GetHerHis|U] adamları üzerimize üşüşüyor. Yadigâr kaybedildi ve kaçmak zorunda kalıyoruz."

 agot_nw_ranger_events.1605.desc.two.b:0 "Reisi aldatma girişimim başarısız oluyor. [main_figure.GetSheHe|U] hilemi görüyor ve keskin bir komutla [main_figure.GetHerHis] adamları bizi alt ediyor. Geri çekilirken yadigâr elimizden kayıyor."

 agot_nw_ranger_events.1605.desc.two.c:0 "Reisi akılla alt etmeye çalışıyorum, ama [main_figure.GetSheHe] çabucak kavrıyor. [main_figure.GetHerHis|U] karşılığı hızlı ve geri itiliyoruz; kaçarken yadigârı geride bırakıyoruz."

 agot_nw_ranger_events.1605.desc.two.d:0 "Reis aldatmacamı görüyor ve [main_figure.GetHerHis] adamları hızla yaklaşıyor. Yadigâr [main_figure.GetHerHis] ellerinde kalıyor; biz mağlup halde geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1605.desc.two.e:0 "Reis oyunu görünce planım çözülüyor. [main_figure.GetHerHis|U] adamları bizi eziyor ve yadigâr hâlâ erişemeyeceğimiz yerdeyken kamptan mağlup ayrılıyoruz."

 agot_nw_ranger_events.1605.desc.three.a:0 "Sahte geri çekilmemiz başarısız oluyor. Reis tuzağa düşmüyor; tersine [main_figure.GetHerHis] adamları bizi eziyor. Yadigârı geride bırakarak geri çekilmek zorunda kalıyoruz."

 agot_nw_ranger_events.1605.desc.three.b:0 "Pusu başarısız oluyor. Reis taktiklerimizi görüyor ve [main_figure.GetHerHis] adamları şaşırtıcı bir güçle karşılık veriyor. Geri çekilmek zorunda kalırken yadigâr elimizden kayıyor."

 agot_nw_ranger_events.1605.desc.three.c:0 "Planımız ters teper. Reis hamlemizi öngörüyor ve daha tepki veremeden [main_figure.GetHerHis] adamları bizi alt ediyor. Yadigârı geride bırakarak mağlup geri çekiliyoruz."

 agot_nw_ranger_events.1605.desc.three.d:0 "Reis taktiklerimiz için fazlasıyla akıllı. [main_figure.GetSheHe|U] hatlarımızı yarıyor, [main_figure.GetHerHis] adamları bizi geri itiyor. Yadigâr hâlâ [main_figure.GetHerHis] mülkiyetindeyken kamptan mağlup ayrılıyoruz."

 agot_nw_ranger_events.1605.desc.three.e:0 "Reis bizi manevrayla alt ederken pusumuz çöküyor. [main_figure.GetHerHis|U] adamları bizi geri çekilmeye itiyor ve kamptan kaçarken yadigâr [main_figure.GetHerHis] kavrayışında kalıyor."

 agot_nw_ranger_events.1605.a:0 "Artık yapabileceğimiz başka bir şey yok."

 ranger_laamp_contract_1701_contract:0 "Özgür Kuzgun"

 ranger_laamp_contract_1701_request:0 "Bu [agot_ranger_mission|E], [TaskContract.GetEmployer.GetName]'i ziyaret edip [TaskContract.GetEmployer.GetHerHis] niyetini öğrenmeni gerektirir"

 ranger_laamp_contract_1701_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1701_desc:0 "Yabanıl reisi tuhaf bir mesaj gönderdi; [TaskContract.GetEmployer.GetSheHe] sizinle görüşmek istiyor ve 'kuzgunu özgür bırakacağını' söylüyor.\n\n[TaskContract.GetEmployer.GetSheHe] ne demek istediği bir sır ve [TaskContract.GetEmployer.GetHerHis] gerçek niyetlerinin ne olduğunu kestirmek imkânsız. Bir tuzak ya da çok daha beklenmedik bir şey olabilir. Dikkatle ilerlemeli ve [TaskContract.GetEmployer.GetSheHe] gerçekte ne istiyor öğrenmeliyiz."

 agot_nw_ranger_events.1701.t:0 "Bilinmeze Doğru"

 agot_nw_ranger_events.1701.desc.intro_a:0 "[main_figure.GetTitledFirstNamePossessive] mesajı, huzursuz edici olduğu kadar muammalı. #italic 'Kuzgunu özgür bırak.'#! Yolculuğa hazırlanırken bu sözler zihnimde yankılanıyor. [main_figure.GetSheHe] ne demek isterse istesin, her şeye hazır olmalıyız."

 agot_nw_ranger_events.1701.desc.intro_b:0 "[main_figure.GetTitledFirstNamePossessive] mesajında görünenden fazlası olduğu hissini üzerimden atamıyorum. #italic 'Kuzgunu özgür bırak.'#! [main_figure.GetSheHe] gerçekte ne istiyor? Hazırlıklarımızı yaparken belirsizlik içimi kemiriyor."

 agot_nw_ranger_events.1701.desc.intro_c:0 "[main_figure.GetTitledFirstName] yoluma bir bilmece attı. #italic 'Kuzgunu özgür bırak.'#! Bu sözler zihnimde asılı kalıyor; tuhaf ve uğursuz. Bu görevin nelere yol açabileceğini bilerek erzaklarımı topluyorum."

 agot_nw_ranger_events.1701.desc.intro_d:0 "Ayrılmaya hazırlanırken [main_figure.GetTitledFirstNamePossessive] sözleri beni etkilemeye devam ediyor: #italic 'kuzgunu özgür bırak.'#! Bu bir uyarı mı, yoksa bir davet mi? Her adımla bilmeceye daha da çekiliyorum."

 agot_nw_ranger_events.1701.desc.intro_e:0 "#italic 'Kuzgunu özgür bırak.'#! [main_figure.GetTitledFirstNamePossessive] muammalı mesajı aklımdan çıkmıyor. Kamp yolculuk için hazırlanırken, bu bilinmeyen görüşmenin öteki ucunda bizi neyin beklediğini merak ediyorum."

 agot_nw_ranger_events.1701.desc.outro:0 "\n\nYola çıkarken belirsizlik üzerimize ağır çöküyor. Reis'in niyetleri belirsiz, ama ne olursa olsun, bununla cepheden yüzleşeceğiz."

 agot_nw_ranger_events.1701.a:0 "Hadi gidip reisle görüşelim."

 agot_nw_ranger_events.1701.b:0 "Kampı buluşma noktasına yaklaştır."

 agot_nw_ranger_events.1701.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1702.t:0 "Reisin Teklifi"

 agot_nw_ranger_events.1702.desc.intro_a:0 "Yabanıl kampına varıyoruz; reis bizi karşılıyor. [main_figure.GetHerHis|U] ifadesi sakin, ama [main_figure.GetHerHis] gözlerinde daha fazlasının bir izi var. [main_figure.GetSheHe] bu anı özenle planladığı açık."

 agot_nw_ranger_events.1702.desc.intro_b:0 "Yabanıl reisi, [main_figure.GetHerHis] gözlerine pek ulaşmayan bir gülümsemeyle bizi karşılıyor. [main_figure.GetHerHis] ateşinin çevresinde toplanıp [main_figure.GetHerHim] niyetlerini açıklamasını beklerken hava söylenmemiş sözlerle yoğun."

 agot_nw_ranger_events.1702.desc.intro_c:0 "Yabanıl reisinin karşısında dururken bunun sıradan bir görüşme olmadığını seziyorum. [main_figure.GetSheHe|U] yalnızca konuşmak için burada değil; [main_figure.GetSheHe] benden bir şey istiyor ve [main_figure.GetSheHe] bunu açıklaması yalnızca bir zaman meselesi."

 agot_nw_ranger_events.1702.desc.intro_d:0 "Reisin huzuruna götürülürken kamp gergin. [main_figure.GetSheHe|U] ateşin yanında oturuyor, konuşmadan önce sanki [main_figure.GetHerHis] sözlerini tartıyormuş gibi beni yakından izliyor. [main_figure.GetSheHe] ne söylerse söylesin önemli olacağını biliyorum."

 agot_nw_ranger_events.1702.desc.intro_e:0 "Yabanıl reisinin kampına varıyoruz ve ortamda bir beklenti havası var. Reis oturmamızı işaret ediyor, ama [main_figure.GetHerHis] hareketinde hiçbir sıcaklık yok. [main_figure.GetSheHe] bir teklif yapmak üzere olduğunu seziyorum."

 agot_nw_ranger_events.1702.desc.mid_a:0 "Reis öne eğiliyor, [main_figure.GetHerHis] sesi alçak. [main_figure.GetSheHe|U] beni hazırlıksız yakalayan bir şey teklif ediyor: toprak. [main_figure.GetHerHim] [main_figure.GetHerHis] rakibine karşı savaşında yardım edersem, bana ait toprak. Teklif, bir bıçak gibi havada asılı kalıyor."

 agot_nw_ranger_events.1702.desc.mid_b:0 "\n\nKonuşurken reis [main_figure.GetHerHis] teklifini açıkça yapıyor. [main_figure.GetSheHe|U] bir rakibe karşı savaşında yardımımı istiyor; karşılığında [main_figure.GetSheHe] bana toprak sözü veriyor. Bu cazip olmaktan öte; ihanet."

 agot_nw_ranger_events.1702.desc.mid_c:0 "\n\nReisin tonu rahat, ama [main_figure.GetHerHis] sözleri hiç de öyle değil. [main_figure.GetSheHe|U], [main_figure.GetHerHim] bir rakibe karşı savaşında yardım edersem bana toprak teklif ediyor. Bu, Gece Nöbetçileri'ne sırtımı dönmek anlamına gelecek bir anlaşma."

 agot_nw_ranger_events.1702.desc.mid_d:0 "\n\nReis sonunda [main_figure.GetHerHis] elini gösteriyor. [main_figure.GetSheHe|U] bir rakibe karşı savaşta yardımımı istiyor. Karşılığında [main_figure.GetSheHe] bana ait toprak sözü veriyor. Teklifin ağırlığı içime işliyor: bu her şeye ihanet etmek anlamına gelir."

 agot_nw_ranger_events.1702.desc.mid_e:0 "\n\nYabanıl reisi açıkça konuşuyor; [main_figure.GetHerHis] savaşındaki yardımım karşılığında bana toprak teklif ediyor. [main_figure.GetHerHis|U] sözleri, cazip oldukları kadar tehlikeli. [main_figure.GetHerHim] yardım etmek yeminlerimi bozmak anlamına gelir."

 agot_nw_ranger_events.1702.desc.outro_a:0 "\n\nTeklif havada asılı dururken önümdeki seçimin ağırlığını fark ediyorum. [main_figure.GetHerHis] teklifini kabul etmek, Gece Nöbetçileri'ni terk etmek, korumaya yemin ettiğim her şeye ihanet etmek demektir."

 agot_nw_ranger_events.1702.desc.outro_b:0 "\n\nTeklif havada asılı dururken reisin gözleri gözlerime çakılıyor. Seçim net: [main_figure.GetHerHim] katıl ve yeminlerinden vazgeç, ya da [main_figure.GetHerHim] reddet ve şerefini koru."

 agot_nw_ranger_events.1702.desc.outro_c:0 "\n\nReisin sözlerini tartarken aramızda ateş çıtırdıyor. [main_figure.GetSheHe|U] bana toprak, güç sunuyor; ama korumaya yemin ettiğim her şey pahasına. Karar kolay değil."

 agot_nw_ranger_events.1702.desc.outro_d:0 "\n\nReis cevabımı beklerken gerilimin yükseldiğini hissediyorum. [main_figure.GetSheHe] sunulan toprak cazip, ama bedeli ağır. İhanetin ağırlığının üzerime çöktüğünü hissedebiliyorum."

 agot_nw_ranger_events.1702.desc.outro_e:0 "\n\nReisin teklifini değerlendirirken iki seçimin de sonuçları netleşiyor. Kabul etmek kaçak olmak demek; reddetmekse [main_figure.GetHerHim] düşman edinmek olabilir. Kolay bir yol yok."

 agot_nw_ranger_events.1702.a:0 "Size katılıyorum. Birlikte bu toprakları fethedeceğiz."

 desert_and_war:0 "Gece Nöbetçileri'ni terk eder ve [an_enemy.GetTitledFirstNameNoTooltip] karşı savaş ilan edersiniz."

 agot_nw_ranger_events.1702.b:0 "Gece Nöbetçileri'ne ihanet etmemi istemeye nasıl cüret edersin?"

 agot_nw_ranger_events.1704.t:0 "Nöbet'e İhanet"

 agot_nw_ranger_events.1704.desc:0 "Karar verildi. Gece Nöbetçileri'ni geride bıraktım ve yeminlerimi bir kenara attım. Yabanıl reisi ve ben birlik olmuş durumdayız; [main_figure.GetHerHis] rakibine karşı savaşımızı başlatmaya hazırlanıyoruz. Bir zamanlar bana kardeşim diyenler yakında beni düşman olarak tanıyacak. Hareket ederken soğuk rüzgâr uluyor ve her adımda seçimimin ağırlığını hissediyorum. Artık geri dönüş yok.\n\nSavaş başlıyor ve bu topraklar yakında bizim olacak."

 agot_nw_ranger_events.1704.a:0 "Savaşa! Topraklar bizim olacak!"

 agot_nw_ranger_events.1705.t:0 "Son Günaha"

 agot_nw_ranger_events.1705.desc:0 "Reis [main_figure.GetHerHis] teklifini sıkıştırıyor; [main_figure.GetHerHis] sözleri giderek daha çaresiz, [main_figure.GetHerHis] tonu daha ısrarcı oluyor. [main_figure.GetSheHe|U] bana her şeyi vaat ediyor: güç, özgürlük ve toprak. Ama ben kararımı çoktan verdim. Gece Nöbetçileri'ne karşı görevimden dönüş yok. Yine de günahın cazibesi sürüyor ve anın ağırlığını hissediyorum.\n\n[main_figure.GetHerHim] önünde dururken seçeneklerimi değerlendiriyorum."

 agot_nw_ranger_events.1705.a:0 "Bunun bedelini ödeyeceksin."

 agot_nw_ranger_events.1705.b:0 "Ben giderim. [main_figure.GetHerHis|U] kaderi beni ilgilendirmez."

 agot_nw_ranger_events.1706.t:0 "Kuzgundan Reise"

 agot_nw_ranger_events.1706.desc:0 "Bir zamanlar siyah pelerini kuşandım; Gece Nöbetçileri'nin Birinci Korucusu olarak hizmet ettim. Ama o günler geride kaldı. Şimdi Sur'un ötesinde duruyorum; eski kardeşlerimin gözünde bir kaçak, ama Özgür Halk için çok daha fazlasıyım.\n\nVahşi doğa beni çağırıyor, Özgür Halk'ın yolu da öyle. Bu yeni hayatı bütünüyle benimseyip benimsemeyeceğime ya da ondan ayrı mı kalacağıma karar verme zamanı."

 agot_nw_ranger_events.1706.desc_wildling:0 "Bir zamanlar siyah pelerini kuşandım; Gece Nöbetçileri'nin Birinci Korucusu olarak hizmet ettim, ama gerçek kanım her zaman vahşi doğaya aitti. Kuzgunların arasında yürüdüm, oysa benim başladığım yer Özgür Halk'tı. Şimdi Sur arkamda ve bir kez daha onun ötesinde duruyorum; bir kaçak olarak değil, evine dönmüş biri olarak.\n\nVahşi doğa beni eski bir dost gibi çağırıyor ve Özgür Halk'ın yolu bir kez daha önümde uzanıyor. Her zaman olduğum şeyi bütünüyle benimseyip benimsemeyeceğime ya da bir zamanlar yaşadığım hayata tutunup tutunmayacağıma karar verme zamanı."

 agot_nw_ranger_events.1706.a:0 "Artık bana Eski Tanrılar yol gösteriyor."

 agot_nw_ranger_events.1706.b:0 "Artık ben bir Özgür Halk üyesiyim."

 agot_nw_ranger_events.1706.c:0 "Burası artık benim evim."

 agot_nw_ranger_events.1706.d:0 "Bu hiçbir şeyi değiştirmez."

 ranger_laamp_contract_1801_contract:0 "Terk Edilmiş Ateşler"

 ranger_laamp_contract_1801_request:0 "Bu [agot_ranger_mission|E] için terk edilmiş bir yabanıl kampını araştırmanız gerekir"

 ranger_laamp_contract_1801_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1801_desc:0 "Bölgeyi keşfederken terk edilmiş bir yabanıl kampına rastladım.\n\nYabanıllar aceleyle ayrılmış gibi görünüyor; ateşler hâlâ tütüyor, erzaklar darmadağın. Kontrol etmeliyiz. Orada ilginç bir şey olabilir ya da en azından neden bu kadar ani ayrıldıklarına dair bazı cevaplar bulabiliriz."

 agot_nw_ranger_events.1801.t:0 "Bilinmeyene Hazırlık"

 agot_nw_ranger_events.1801.desc.intro_a:0 "Yolculuğa hazırlanırken [my_ranger.GetTitledFirstNamePossessive] raporu hâlâ zihnimde asılı. Aceleyle terk edilmiş bir yabanıl kampı. Karıştırılmış kara baktıkça bunun ardında fazlası olduğunu biliyorum. Her şeye hazır olmalıyız."

 agot_nw_ranger_events.1801.desc.intro_b:0 "Erzak toplarken yabanılların kampı neden bu kadar aniden terk edeceklerini düşünmeden edemiyorum. Orada ne bulacağımızı kestirmek imkânsız, ama ne olursa olsun hazır olacağız."

 agot_nw_ranger_events.1801.desc.intro_c:0 "Önümüzdeki yolculuk için kendimizi hazırlıyoruz. Kamp terk edilmiş olabilir, ama cevapsız sorular ağır çöküyor. Terk edilmiş ateşler, darmadağın erzaklar; burada açığa çıkarılacak bir hikâye var."

 agot_nw_ranger_events.1801.desc.intro_d:0 "[my_ranger.GetTitledFirstNamePossessive] terk edilmiş kampı keşfi görevimizi harekete geçirdi. Korucular toplanmışken yola çıkmaya hazırlanıyoruz. Yabanılları kaçıran ne ise hâlâ bizi bekliyor olabilir."

 agot_nw_ranger_events.1801.desc.intro_e:0 "Yolculuk için eşyalarımızı toplarken havadaki soğuk daha ağır görünüyor. Yaşamın son kalıntılarıyla hâlâ ılık, terk edilmiş bir kamp. Orada ne olduğunu öğreneceksek aklımızı başımızda tutmalıyız."

 agot_nw_ranger_events.1801.desc.outro:0 "\n\nKampa giden yol uzun olmayacak, ama bulabileceklerimizin ardındaki gizem her adımı ağırlaştırıyor. Yabanılları kaçıran şey hâlâ orada olabilir."

 agot_nw_ranger_events.1801.a:0 "Hadi yola çıkıp kampı araştıralım."

 agot_nw_ranger_events.1801.b:0 "Hazır olduğumuzdan emin olmak için tüm korucu kampını yaklaştır."

 agot_nw_ranger_events.1801.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1802.t:0 "Vahşi Doğada Esir"

 agot_nw_ranger_events.1802.desc.intro_a:0 "Terk edilmiş kampa varıp araştırmamıza başlıyoruz. Korucular, burada ne olduğuna dair işaretler arayarak dağılıyor. Gruptan uzaklaşıyorum ve çok geçmeden kendimi diğerlerinden ayrı düşmüş buluyorum."

 agot_nw_ranger_events.1802.desc.intro_b:0 "Aramamıza başladığımızda kamp ürkütücü bir sessizlik içinde. Dağınık erzakları incelemeye odaklanmışken diğer koruculardan giderek uzaklaşıyorum ve birden yalnız olduğumu fark ediyorum."

 agot_nw_ranger_events.1802.desc.intro_c:0 "Kampı didik didik ederken bozulmuş bir zemin izini takip ederek diğerlerinden ayrılıyorum. Sessizlik huzursuz edici, ama merakım beni gruptan daha da uzaklaştırıyor."

 agot_nw_ranger_events.1802.desc.intro_d:0 "Korucular, beni kendi başıma araştırmaya bırakarak yayılıyor. Derinlere indikçe terk edilmiş kamp daha uğursuz hissettiriyor ve çok geçmeden diğerlerinden fazla uzaklaştığımı fark ediyorum."

 agot_nw_ranger_events.1802.desc.intro_e:0 "Kamp içindeki aramamız bizi farklı yönlere çekiyor. Cevap bulmaya kararlı bir halde alanın derinliklerine ilerliyorum, ama kısa süre sonra diğerlerinden ayrı düştüğümü fark ediyorum."

 agot_nw_ranger_events.1802.desc.mid_a:0 "Birden arkamda bir varlık hissediyorum. Daha tepki veremeden sert eller beni kavrayıp gölgelere sürüklüyor. Yabanıllar tarafından yakalandım; yüzleri azgın, ama tuhaf biçimde meraklı."

 agot_nw_ranger_events.1802.desc.mid_b:0 "Bir ses duyuyorum, kırılan bir dal; ama çok geç. Yabanıllar karanlıktan beliriyor ve beni çabucak alt ediyorlar. Liderleri, beni yakından izleyen bir [Select_CString(main_figure.IsFemale,'kadın','adam')], öne çıkıyor."

 agot_nw_ranger_events.1802.desc.mid_c:0 "Daha haykıramadan bir grup yabanıl beni yere seriyor. Liderleri öne çıkarken ellerimi hızla bağlıyorlar. [main_figure.GetSheHe|U] sakindir, ama [main_figure.GetSheHe] beni izlerken [main_figure.GetHerHis] gözlerinde bir şey var."

 agot_nw_ranger_events.1802.desc.mid_d:0 "Daha tepki veremeden bir grup yabanıl etrafımı sarıyor. Bileklerimi hızla bağlıyorlar; ben direnirken liderleri, bir [Select_CString(main_figure.IsFemale,'kadın','adam')], görüş alanıma giriyor; [main_figure.GetHerHis] bakışı benimkinden ayrılmıyor."

 agot_nw_ranger_events.1802.desc.mid_e:0 "Yabanıllar tarafından pusuya düşürülüyorum; beni bağlarken elleri sert. Liderleri, hesapçı bir ifadeyle bir [Select_CString(main_figure.IsFemale,'kadın','adam')], yaklaşıyor. [main_figure.GetSheHe|U] beni izliyor; [main_figure.GetHerHis] gözleri keskin ve dikkatli."

 agot_nw_ranger_events.1802.desc.outro_a:0 "\n\nYabanıl reisi, bir [Select_CString(main_figure.IsFemale,'kadın','adam')], yaklaşıyor; [main_figure.GetHerHis] gözleri beklenenden uzun süre üzerimde asılı kalıyor. [main_figure.GetSheHe|U] hafifçe, neredeyse şakacı bir tavırla gülümsüyor; sanki [main_figure.GetHerHis] ilgisini yönlendiren şey meraktan fazlası."

 agot_nw_ranger_events.1802.desc.outro_b:0 "\n\n[main_figure.GetHerHis] bakışıyla karşılaştığımda [main_figure.GetSheHe], benimle düşman olarak değil, daha çok merakla ilgileniyor gibi. [main_figure.GetHerHis|U] sözleri alaycı, [main_figure.GetHerHis] gülümsemesi rahatsız edici. [main_figure.GetSheHe]nın ilgilendiği açık, ama yalnızca esir alınışımla değil."

 agot_nw_ranger_events.1802.desc.outro_c:0 "\n\n[main_figure.GetSheHe] beni incelerken [Select_CString(main_figure.IsFemale,'kadın','adam')]ın bakışı yumuşuyor. [main_figure.GetHerHis|U] tonu değişiyor, neredeyse flörtöz; [main_figure.GetHerHis] gülümsemesi, belki de [main_figure.GetHerHis] aklında beni esir tutmaktan başka şeyler olduğunu düşündürüyor."

 agot_nw_ranger_events.1802.desc.outro_d:0 "\n\n[main_figure.GetSheHe|U] yaklaşıyor; [main_figure.GetHerHis] sesi alçak, neredeyse şakacı. [main_figure.GetHerHis] gözlerinde, [main_figure.GetSheHe] herhangi bir fidye ya da takastan çok benimle ilgilendiğini gösteren bir parıltı var. [main_figure.GetHerHis|U] gülümsemesi düşmanca olmaktan çok uzak."

 agot_nw_ranger_events.1802.desc.outro_e:0 "\n\nYabanıl [Select_CString(main_figure.IsFemale,'kadın','adam')] beni tepeden tırnağa süzüyor; [main_figure.GetHerHis] ifadesi temkinlilikten daha şakacı bir şeye dönüşüyor. [main_figure.GetSheHe|U] açıkça benimle oynuyor; [main_figure.GetHerHis] sözlerinde bir flört kırıntısı var."

 agot_nw_ranger_events.1802.a:0 "Özgürlüğümü kazanmak için [main_figure.GetHerHim] baştan çıkarmaya çalışırım."

 agot_nw_ranger_events.1802.b:0 "[main_figure.GetHerHis] beğenisini kazanmayı umarak [main_figure.GetHerHim] dost edinmeye çalışırım."

 agot_nw_ranger_events.1802.c:0 "[main_figure.GetHerHim] mantık yoluyla, beni özgür bırakması için çağrıda bulunurum."

 agot_nw_ranger_events_1802.a.tt.win:0 "[main_figure.GetSheHe|U] sözlerimden etkilenir ve ben serbest bırakılırım"

 agot_nw_ranger_events_1802.a.tt.lose:0 "[main_figure.GetSheHe|U] girişimlerimi görür ve beni esir tutar"

 agot_nw_ranger_events_1802.b.tt.win:0 "[main_figure.GetSheHe|U] yumuşar, beni salıvermeyi kabul eder"

 agot_nw_ranger_events_1802.b.tt.lose:0 "[main_figure.GetSheHe|U] etkilenmez ve ben bağlı kalırım"

 agot_nw_ranger_events_1802.c.tt.win:0 "[main_figure.GetSheHe|U] mantığımdan etkilenir ve beni salıvermeyi kabul eder"

 agot_nw_ranger_events_1802.c.tt.lose:0 "[main_figure.GetSheHe|U] gerekçelerimi yok sayar ve beni [main_figure.GetHerHis] esiri olarak tutar"

 agot_nw_ranger_events.1804.t:0 "Kurulan Bağ"

 agot_nw_ranger_events.1804.desc.one.a:0 "Sözlerim büyüsünü gösteriyor ve aramızdaki gerilim değişiyor. [main_figure.GetTitledFirstName], [main_figure.GetHerHis] bakışı yumuşuyor. Artık yalnızca sözlerden fazlasını paylaşıyoruz. [main_figure.GetSheHe|U] artık bir düşman değil, bir sevgili."

 agot_nw_ranger_events.1804.desc.one.b:0 "[main_figure.GetHerHis|U] gülümsemesi muzipleşiyor ve başardığımı biliyorum. Bir meydan okuma olarak başlayan şey çok daha derin bir şeye dönüştü. [main_figure.GetTitledFirstName] cazibeme kapıldı ve bağımız artık mühürlendi."

 agot_nw_ranger_events.1804.desc.one.c:0 "Konuşurken [main_figure.GetHerHis] bakışı üzerimde asılı kalıyor; [main_figure.GetHerHis] gülümsemesi yeni bir ilgi ele veriyor. Aramızdaki hava değişiyor ve çok geçmeden farklı bir toprağa geçtiğimizi biliyorum. Artık yalnızca esir alan ve esir değiliz."

 agot_nw_ranger_events.1804.desc.one.d:0 "Cazibem inkâr edilemez ve çok geçmeden [main_figure.GetHerHis] flörtöz tonu daha fazlasına dönüşüyor. Artık yalnızca müttefik değiliz; bağımız derinleşti ve önümüzdeki gece yalnızca hayatta kalmaktan fazlasını vaat ediyor."

 agot_nw_ranger_events.1804.desc.one.e:0 "[main_figure.GetSheHe|U] oyuna katılıyor ve planımın işe yaradığını fark ediyorum. Aramızdaki çekim büyüyor ve artık mesele yalnızca kaçış değil. [main_figure.GetHerHim] kazandım; artık düşmandan daha fazlasıyız."

 agot_nw_ranger_events.1804.desc.two.a:0 "Sözlerim [main_figure.GetHerHim] ulaşıyor ve [main_figure.GetSheHe] gevşiyor. [main_figure.GetTitledFirstName] bana bir tehdit olarak değil, potansiyel bir dost olarak bakıyor. Artık, işlerin seyrini değiştirebilecek karşılıklı bir saygıyı paylaşıyoruz."

 agot_nw_ranger_events.1804.desc.two.b:0 "Uzun bir sohbetin ardından [main_figure.GetHerHis] savunması sonunda düşüyor. Bir bakıma müttefik olduk; hikâyeler paylaşıyor ve ortak bir zemin buluyoruz. Düşmanlığa dönüşebilecek şey arkadaşlığa dönüştü."

 agot_nw_ranger_events.1804.desc.two.c:0 "Sakin sözler ve sabırla [main_figure.GetHerHim] kazanıyorum. [main_figure.GetSheHe|U] artık beni bir düşman olarak değil, güvenilir biri olarak görüyor. [main_figure.GetTitledFirstName] ile artık yabancıdan fazlasıyız; arkadaşız."

 agot_nw_ranger_events.1804.desc.two.d:0 "[main_figure.GetTitledFirstName] dinliyor ve çabalarım meyve veriyor. [main_figure.GetSheHe|U] gülümsüyor, sözlerimi kabul ediyor ve çok geçmeden ortak bir zemin buluyoruz. Gerilimle başlayan şey, yeni kurulan bir dostlukla son buluyor."

 agot_nw_ranger_events.1804.desc.two.e:0 "Barıştan söz ediyorum ve yavaşça [main_figure.GetSheHe] bana farklı bakmaya başlıyor. [main_figure.GetHerHis|U] düşmanca tavrı sönüyor ve kendimizi esir alan ile esir olarak değil, dostlar olarak konuşurken buluyoruz. Bağ kuruldu."

 agot_nw_ranger_events.1804.desc.three.a:0 "Mantığım [main_figure.GetHerHim] yankı buluyor. [main_figure.GetTitledFirstName] dinliyor, sözlerimi dikkatle değerlendiriyor. Çok geçmeden [main_figure.GetHerHis] tavrı yumuşuyor ve [main_figure.GetHerHim] kendi safıma çektiğimi biliyorum."

 agot_nw_ranger_events.1804.desc.three.b:0 "Sabır ve mantıkla [main_figure.GetHerHim] görüşümü yavaşça kabul ettiriyorum. [main_figure.GetTitledFirstName] onaylayarak başını sallıyor ve [main_figure.GetHerHis] benim hakkımdaki görüşünün değiştiğini anlayabiliyorum. [main_figure.GetHerHis] gözünde artık bir esir değilim."

 agot_nw_ranger_events.1804.desc.three.c:0 "[main_figure.GetSheHe|U] savımı ortaya koyarken beni dikkatle dinliyor ve çok geçmeden [main_figure.GetHerHis] düşmanca bakışı anlayış dolu bir bakışa dönüşüyor. [main_figure.GetTitledFirstName] etkilendi, [main_figure.GetHerHis] ilgisi kabardı ve [main_figure.GetHerHim] kazandığımı biliyorum."

 agot_nw_ranger_events.1804.desc.three.d:0 "Mantığa çağrım [main_figure.GetHerHis] savunmasını deliyor. [main_figure.GetTitledFirstName] olayları benim bakış açımla görmeye başlıyor ve çok geçmeden [main_figure.GetSheHe] artık bir tehdit değil, bir bakıma müttefik. [main_figure.GetHerHim] etkilemeyi başardım."

 agot_nw_ranger_events.1804.desc.three.e:0 "[main_figure.GetSheHe|U] sözlerimi dikkatle değerlendiriyor ve bir an sonra [main_figure.GetHerHis] tavrının değiştiğini görüyorum. [main_figure.GetTitledFirstName] artık düşmanca değil, düşünceli. [main_figure.GetHerHim] bakış açımı görecek şekilde etkilemeyi başardım."

 agot_nw_ranger_events.1804.a:0 "Bu, bir şeylerin başlangıcı olabilir."

 agot_nw_ranger_events.1805.t:0 "Reisin Bakışı Altında"

 agot_nw_ranger_events.1805.desc.one.a:0 "Cazibe girişimim etkisiz kalıyor. Yabanıl reisi sözlerimin ardını görüyor, [main_figure.GetHerHis] gülümsemesi sönüyor. Elimi fazla zorladım ve şimdi [main_figure.GetSheHe] beni soğuk bir şüpheyle izliyor. Bağlı kalıyorum."

 agot_nw_ranger_events.1805.desc.one.b:0 "[main_figure.GetHerHim] etkilemeye çalışıyorum, ama yabanıl reisi aldanmıyor. [main_figure.GetHerHis|U] ifadesi sertleşiyor ve başarısız olduğum açık. [main_figure.GetHerHim] kazanmak yerine [main_figure.GetHerHis] üzerimdeki kavrayışını sıkılaştırdım."

 agot_nw_ranger_events.1805.desc.one.c:0 "Flörtüm soğuk bir kayıtsızlıkla karşılanıyor. Yabanıl reisi etkilenmeden yüzünü çeviriyor ve kaçış şansım parmaklarımın arasından kayıp gidiyor. Bileklerimdeki bağlar sıkı kalıyor."

 agot_nw_ranger_events.1805.desc.one.d:0 "Sözlerim umduğum gibi karşılık bulmuyor. Reis [main_figure.GetHerHis] gözlerini kısıyor, oyunumu ta baştan görüyor. Özgürlük yerine, bağlanmış ve mağlup halde hapishanemin duvarlarına bakakalıyorum."

 agot_nw_ranger_events.1805.desc.one.e:0 "[main_figure.GetSheHe|U] girişimlerimden etkilenmeden gülüyor. Yabanıl reisi kolay kolay büyülenmez ve ben yalnızca [main_figure.GetHerHis] küçümsemesini kazandım. Çevremdeki ipler her zamanki kadar sıkı."

 agot_nw_ranger_events.1805.desc.two.a:0 "Mantığa başvurmayı deniyorum, ama yabanıl reisinin yüzü soğuk kalıyor. [main_figure.GetSheHe|U] dostluk ya da ittifak umurunda değil. Sözlerim sağır kulaklara düşüyor ve ben [main_figure.GetHerHis] esiri kalıyorum."

 agot_nw_ranger_events.1805.desc.two.b:0 "Ortak zemin bulma girişimim başarısız oluyor. Yabanıl reisinin bana ilgisi sönüyor ve [main_figure.GetHerHis] gözleri uzaklaşıyor. [main_figure.GetSheHe|U] yeniden bağlanmamı işaret ediyor. Hiçbir yere gidemiyorum."

 agot_nw_ranger_events.1805.desc.two.c:0 "[main_figure.GetHerHim] mantıkla ikna etme çabalarıma rağmen yabanıl reisi, sunacaklarımla ilgilenmeden bana sırtını dönüyor. Başarısız olduğumu fark ettikçe çevremdeki bağlar sıkılaşıyor."

 agot_nw_ranger_events.1805.desc.two.d:0 "Konuşarak kurtulmaya çalışıyorum, ama sözlerim hiçbir şey ifade etmiyor gibi. Reis bana güvenmiyor ve [main_figure.GetHerHis] halkı [main_figure.GetHerHis] izinden gidiyor. Bağlı kalıyorum, kaçış şansım yok olmuş."

 agot_nw_ranger_events.1805.desc.two.e:0 "[main_figure.GetSheHe|U] bir an dinliyor, ama [main_figure.GetHerHis] bakışı sertleşiyor. Sözlerim [main_figure.GetHerHim] etkilemeye yetmedi; özgürlük yerine, ellerim hâlâ bağlı, sessizlikte oturmaya bırakılıyorum."

 agot_nw_ranger_events.1805.desc.three.a:0 "Mantığım yetersiz kalıyor ve yabanıl reisi daha da temkinli oluyor. [main_figure.GetSheHe|U] mantığımı görmüyor; ben de bağlı ve [main_figure.GetHerHis] uyanık bakışı altında kalıyorum."

 agot_nw_ranger_events.1805.desc.three.b:0 "[main_figure.GetHerHis] mantık duygusuna seslenmeye çalışıyorum, ama faydasız. Yabanıl reisi mantıkla etkilenmiyor. Kendimi özgürleştirme girişimim başarısız oldu ve bağlar yerinde duruyor."

 agot_nw_ranger_events.1805.desc.three.c:0 "[main_figure.GetSheHe|U] gerekçelerimi dinliyor, ama reis ikna olmuyor. [main_figure.GetSheHe|U] başını sallıyor ve özgürlük şansı kayıp gidiyor. Çevremdeki ipler sıkı kalıyor ve ben [main_figure.GetHerHis] esiri oluyorum."

 agot_nw_ranger_events.1805.desc.three.d:0 "Mantığım sağır kulaklara düşüyor. Yabanıl reisi beni yok sayıyor, [main_figure.GetHerHis] ilgisi sönmüş. Soğukta, bağlanmış ve esir halde kalıyorum; kaçış planım tümüyle paramparça."

 agot_nw_ranger_events.1805.desc.three.e:0 "[main_figure.GetHerHim] mantıkla ikna etmeye çalışsam da yabanıl reisi dinlemeyi reddediyor. Savım çöküyor ve [main_figure.GetHerHis] kavrayışında kalıyorum; özgürlüğüm her zamanki kadar uzakta."

 agot_nw_ranger_events.1805.a:0 "Görünüşe göre bir süre daha burada kalacağım."

 ranger_laamp_contract_1901_contract:0 "Hain"

 ranger_laamp_contract_1901_request:0 "Bu [agot_ranger_mission|E] için dönekle savaşmanız ve kazanmanız gerekir"

 ranger_laamp_contract_1901_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_1901_desc:0 "Gece Nöbetçileri'nden kaçan biri hakkında haber aldım.\n\nYakınlarda, vahşi doğada saklanıyor. Bu ihanetin cezasız kalmasına izin veremeyiz. Hızlı hareket edersek dönek daha da kaçmadan onu izini sürüp adalete teslim edebiliriz."

 agot_nw_ranger_events.1901.t:0 "Bir Hainin Peşinde"

 agot_nw_ranger_events.1901.desc.intro_a:0 "[my_ranger.GetTitledFirstName] raporu zihnimde asılı. Gece Nöbetçileri'ne ihanet etmiş bir kaçak yakınlarda saklanıyor. Kaybedecek az zamanımız var. Ava hazırlanırken rüzgârlar kampın içinde uluyor."

 agot_nw_ranger_events.1901.desc.intro_b:0 "Gece Nöbetçileri'nden bir kaçak... bundan büyük ihanet olamaz. [my_ranger.GetTitledFirstNamePossessive] bilgisi taze ve hızla hareket edersek [main_figure.GetSheHe] vahşi doğada kaybolmadan [main_figure.GetHerHim] yakalayabiliriz."

 agot_nw_ranger_events.1901.desc.intro_c:0 "Gece Nöbetçileri'nden kaçmak suçların en kötüsüdür ve bunun kayıp gitmesine izin vermeyeceğim. Bu kovalamacanın uzun ve acımasız olabileceğini bilerek av için hazırlanıyoruz."

 agot_nw_ranger_events.1901.desc.intro_d:0 "Gece Nöbetçileri kaçakları nadiren uzağa gidebilir; bu da istisna değil. [my_ranger.GetTitledFirstNamePossessive] raporu bizi bir yola soktu. [main_figure.GetHerHim] bir kez bulduğumuzda Kuzey'in soğuk ısırığı [main_figure.GetHerHis] dertlerinin en küçüğü olacak."

 agot_nw_ranger_events.1901.desc.intro_e:0 "[my_ranger.GetTitledFirstNamePossessive] raporu bize izleyeceğimiz taze bir iz veriyor. Gece Nöbetçileri'nden bir kaçak. Bu, affedilemeyecek bir ihanettir ve [main_figure.GetHerHim] şu ya da bu şekilde geri getirmek için yolculuğa hazırlanıyoruz."

 agot_nw_ranger_events.1901.desc.outro:0 "\n\nHızlı hareket etmemiz gerekecek. Bir kaçak nasıl koşulacağını bilir, ama uzun süre değil. Av şimdi başlıyor."

 agot_nw_ranger_events.1901.a:0 "Hadi gidelim. [main_figure.GetHerHim] yakalayacağız."

 agot_nw_ranger_events.1901.b:0 "Kampı yaklaştır, daha fazla desteğe ihtiyacımız olabilir."

 agot_nw_ranger_events.1901.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.1902.t:0 "Kaçak Bulundu"

 agot_nw_ranger_events.1902.desc.intro_a:0 "Ormanın kenarına vardık ve kaçak [main_figure.GetTitledFirstName] seçmek uzun sürmüyor. [main_figure.GetSheHe|U] hızla hareket ediyor, ama [main_figure.GetSheHe] henüz burada olduğumuzu bilmiyor. Bu bizim şansımız."

 agot_nw_ranger_events.1902.desc.intro_b:0 "Ormanlar sık, ama kaçak [main_figure.GetTitledFirstName] çok uzakta değil. [main_figure.GetHerHim] ağaçların arasından görebiliyorum; üzerine kapandığımızdan habersiz. [main_figure.GetHerHim] için zaman tükeniyor."

 agot_nw_ranger_events.1902.desc.intro_c:0 "Ormanın derinliklerine ilerliyoruz ve çok geçmeden dönek işte orada. [main_figure.GetHerHis|U] kafası gergin biçimde sağa sola dönüyor. [main_figure.GetSheHe|U] ne kadar yaklaştığımızın henüz farkında değil."

 agot_nw_ranger_events.1902.desc.intro_d:0 "Ağaçların arasında [main_figure.GetHerHim] seçiyorum. Kaçak [main_figure.GetTitledFirstName] bizi henüz fark etmedi. [main_figure.GetHerHis|U] duruşu gergin, ama şimdilik üstünlük bizde."

 agot_nw_ranger_events.1902.desc.intro_e:0 "Bir süre izi takip ettikten sonra nihayet kaçak [main_figure.GetTitledFirstName] gözümüze çarpıyor. [main_figure.GetSheHe|U] ormanda ilerliyor; onu bulduğumuzdan habersiz."

 agot_nw_ranger_events.1902.desc.mid_a:0 "[main_figure.GetSheHe|U] yalnız; ormanda hızla yol almaya çalışıyor, ama hatalar yapıyor. [main_figure.GetSheHe] burada olduğumuzu fark etmeden harekete geçme şansımız bu."

 agot_nw_ranger_events.1902.desc.mid_b:0 "[main_figure.GetHerHis|U] hareketleri aceleci, çaresiz. [main_figure.GetSheHe] ormanda ilerlerken [main_figure.GetHerHis] gözlerindeki korkuyu görebiliyorum; üzerine kapandığımızdan habersiz."

 agot_nw_ranger_events.1902.desc.mid_c:0 "Kaçak panikliyor; [main_figure.GetHerHis] adımları aceleci ve dağınık. [main_figure.GetSheHe|U] savunmasız, ama yanlış bir hareket [main_figure.GetHerHim] ürkütüp kaçırabilir."

 agot_nw_ranger_events.1902.desc.mid_d:0 "[main_figure.GetSheHe|U] hızla ilerliyor, ama [main_figure.GetHerHis] panik [main_figure.GetHerHim] yavaşlatıyor. Orman [main_figure.GetHerHim] aleyhine işliyor ve bu bize vurmak için bir pencere açıyor."

 agot_nw_ranger_events.1902.desc.mid_e:0 "[main_figure.GetHerHim] çalılıkların arasında sendeleyerek ilerlerken izliyorum; [main_figure.GetHerHis] gözleri oraya buraya kayıyor, ne kadar yakın olduğumuzdan habersiz. [main_figure.GetSheHe|U] korkmuş ve bu bizim avantajımız."

 agot_nw_ranger_events.1902.desc.outro_a:0 "\n\n[main_figure.GetSheHe] burada olduğumuzu fark etmeden hızla hareket etmeliyiz. Yanlış bir hareket [main_figure.GetSheHe]nın kaçmasına yol açar, ama avantaj bizde. Bunu nasıl ele alacağımıza karar verme zamanı."

 agot_nw_ranger_events.1902.desc.outro_b:0 "\n\n[main_figure.GetSheHe|U] gergin, ama bizi henüz görmedi. Üstünlük bizde; ancak [main_figure.GetSheHe] fark etmeden hamlemizi yapmalıyız."

 agot_nw_ranger_events.1902.desc.outro_c:0 "\n\nKaybedecek zaman yok. Kaçak savunmasız ve şimdi harekete geçersek [main_figure.GetHerHim] yakalayabiliriz. Bunu nasıl ele alacağımıza karar verme zamanı."

 agot_nw_ranger_events.1902.desc.outro_d:0 "\n\nKaçak yakında ve sürpriz avantajı bizde. Ama [main_figure.GetSheHe] kaçma şansı bulamadan hamlemizi yapmalıyız."

 agot_nw_ranger_events.1902.desc.outro_e:0 "\n\nBu bizim anımız. [main_figure.GetSheHe|U] paniklemiş ve şimdi hareket edersek [main_figure.GetHerHim] yakalayabiliriz. Nasıl ilerleyeceğime karar vermeliyim."

 agot_nw_ranger_events.1902.a:0 "[main_figure.GetHerHim] hücum edip yere sererim."

 agot_nw_ranger_events.1902.b:0 "[main_figure.GetHerHim] yardım için burada olduğumuza inandırarak kandırırım."

 agot_nw_ranger_events.1902.c:0 "Adamlarıma [main_figure.GetHerHim] kuşatmaları için işaret veririm."

 agot_nw_ranger_events_1902.b.tt.win:0 "[main_figure.GetSheHe|U] hileye kanar ve [main_figure.GetHerHim] kolayca yakalarız"

 agot_nw_ranger_events_1902.b.tt.lose:0 "[main_figure.GetSheHe|U] aldatmacayı görür ve kaçar"

 agot_nw_ranger_events_1902.c.tt.win:0 "Yaklaşıp [main_figure.GetHerHim] kaçış yolu olmadan tuzağa düşürürüz"

 agot_nw_ranger_events_1902.c.tt.lose:0 "[main_figure.GetSheHe|U] boşluklardan sızar ve kaçar"

 agot_nw_ranger_events.1904.t:0 "Döneğin Sonu"

 agot_nw_ranger_events.1904.desc.one.a:0 "Öne hücum ediyorum ve kaçağın tepki verecek zamanı olmuyor. Kılıcım hedefini buluyor ve tek bir vuruşla [main_figure.GetSheHe] yere düşüyor. Hainin yolculuğu burada sona eriyor."

 agot_nw_ranger_events.1904.desc.one.b:0 "[main_figure.GetHerHim] sert vuruyorum; darbem hızlı ve kesin. Dönek, [main_figure.GetSheHe] kılıcımın altında yığılmadan önce [main_figure.GetHerHis] kaderini anlayacak zamanı zar zor buluyor. Gece Nöbetçileri'nin adaleti hızlıdır."

 agot_nw_ranger_events.1904.desc.one.c:0 "Saldırım hızlı ve kaçak sendeliyor; [main_figure.GetHerHim] yere sererken kan dökülüyor. [main_figure.GetHerHis|U] ihaneti, soğuk ormanda son bir nefesle son buluyor."

 agot_nw_ranger_events.1904.desc.one.d:0 "[main_figure.GetHerHim] atılıyorum ve kaçış yok. Çarpışma başladığı kadar çabuk bitiyor; kılıcım [main_figure.GetHerHis] savunmasını delip geçiyor. Hain ayaklarımın dibinde ölü yatıyor."

 agot_nw_ranger_events.1904.desc.one.e:0 "Hücumum [main_figure.GetHerHim] sürprizle yakalıyor. Merhamet yok, tereddüt yok. [main_figure.GetSheHe|U] cansız halde yere düşüyor; [main_figure.GetHerHis] ihaneti kılıçla cezalandırılıyor."

 agot_nw_ranger_events.1904.desc.two.a:0 "Kaçak oyunuma geliyor, [main_figure.GetHerHis] savunmasını tam gerektiği kadar düşürüyor. Tek, hızlı bir hamleyle bitiriyorum; kılıcım [main_figure.GetHerHis] ihanetin başlattığını tamamlıyor. Vahşi doğa [main_figure.GetHerHim] sahipleniyor."

 agot_nw_ranger_events.1904.desc.two.b:0 "Sözlerime, çok geç olana dek inanıyor. [main_figure.GetHerHis] savunması düştüğü an vuruyorum. Kaçağın hayatı sona eriyor ve [main_figure.GetHerHis] ihaneti, [main_figure.GetHerHim] ile birlikte karda ölüyor."

 agot_nw_ranger_events.1904.desc.two.c:0 "Oyunum kusursuz işliyor. [main_figure.GetSheHe|U] yeterince yaklaşmama izin veriyor ve hızlı bir vuruşla [main_figure.GetHerHim] bitiriyorum. [main_figure.GetSheHe] son nefesini alırken gözleri şokla büyüyor."

 agot_nw_ranger_events.1904.desc.two.d:0 "Aldatmacam kusursuz işliyor ve kaçak neler olduğunu anlayamadan [main_figure.GetHerHim] yere seriyorum. [main_figure.GetHerHis|U] bedeni kara yığılıyor ve adalet yerini buluyor."

 agot_nw_ranger_events.1904.desc.two.e:0 "Sözlerimden ikna olan kaçak [main_figure.GetHerHis] savunmasını düşürüyor ve ben tam o an vuruyorum. [main_figure.GetHerHis] bedeni soğuk vahşi doğaya yığılırken ihanet kanla son buluyor."

 agot_nw_ranger_events.1904.desc.three.a:0 "Adamlarım işaretimi kusursuz takip ediyor, her yandan yaklaşıyor. Kaçak kaçmaya çalışıyor, ama kaçacak yer yok. Merhametsizce [main_figure.GetHerHim] yere seriyorum. Hainin sonu çabuk geliyor."

 agot_nw_ranger_events.1904.desc.three.b:0 "Tuzak kuruldu ve adamlarım yaklaşırken kaçağın kaçacak yeri kalmıyor. Öldürmek için yaklaşıyorum ve [main_figure.GetHerHis] ihaneti bu ormanda can veriyor."

 agot_nw_ranger_events.1904.desc.three.c:0 "[main_figure.GetHerHim] kuşatıyoruz ve kaçış yolu olmayan kaçak kılıcıma düşüyor. Gece Nöbetçileri'ne adaleti getirirken hainin kanı karı lekeliyor."

 agot_nw_ranger_events.1904.desc.three.d:0 "Düzenimiz kusursuz. Kaçak kıstırıldı ve kaçış yok. Tek vuruşla bitiriyorum. Hain ölü yatıyor; [main_figure.GetHerHis] ihaneti cezalandırıldı."

 agot_nw_ranger_events.1904.desc.three.e:0 "Adamlarım kaçağı kuşatıyor, [main_figure.GetHerHim] kaçacak yer bırakmıyor. İnfaz hızlı ve dönek yere yıkılıyor; [main_figure.GetHerHis] canı Gece Nöbetçileri'nin kılıcıyla alınıyor."

 agot_nw_ranger_events.1904.a:0 "Adalet yerini buldu."

 agot_nw_ranger_events.1905.t:0 "Kaçan"

 agot_nw_ranger_events.1905.desc.one.a:0 "[main_figure.GetHerHim] hücum ediyorum, ama kaçak beklediğimden çevik. [main_figure.GetSheHe|U] darbemden kaçıyor ve daha tepki veremeden sık ağaçların arasında kayboluyor. Kovalama kaybedildi ve hain sıvışıyor."

 agot_nw_ranger_events.1905.desc.one.b:0 "Öne atılıyorum, ama saldırım hedefini ıskalıyor. Kaçak göründüğünden hızlı ve daha farkına varmadan [main_figure.GetSheHe] orman tarafından yutulup gitmiş oluyor. [main_figure.GetHerHim] kaybettim."

 agot_nw_ranger_events.1905.desc.one.c:0 "Kılıcım havayı yarıyor, ama [main_figure.GetSheHe] fazlasıyla çevik. Kaçak darbemden kaçıp vahşi doğada kayboluyor. [main_figure.GetHerHim] koştuğunu duyabiliyorum, ama [main_figure.GetHerHim] gözden çoktan kaybettim."

 agot_nw_ranger_events.1905.desc.one.d:0 "Hücum ediyorum, ama hain hamlemi öngörüyor. [main_figure.GetSheHe|U] kılıcımın altından eğilip ağaçların gölgelerinde kayboluyor. Ormanlar [main_figure.GetHerHim] sahipleniyor ve ben elim boş kalıyorum."

 agot_nw_ranger_events.1905.desc.one.e:0 "Savuruyorum, ama kaçak darbemden kaçıyor; [main_figure.GetHerHim] yakalayamadan ağaçların arasından sıvışıyor. [main_figure.GetSheHe|U] gitmiş ve [main_figure.GetHerHim] ile birlikte onu adalete teslim etme şansı da."

 agot_nw_ranger_events.1905.desc.two.a:0 "[main_figure.GetHerHim] aldatmaya çalışıyorum, ama kaçak oyunumu görüyor. [main_figure.GetSheHe|U] sırıtıp dönüyor ve ormana dalıp kaçıyor; beni [main_figure.GetHerHis] kaçışının sessizliğinde geride bırakıyor."

 agot_nw_ranger_events.1905.desc.two.b_hashfix:0 "Hilem başarısız oluyor ve kaçağın gözleri durumu anlayınca kısılıyor. [main_figure.GetSheHe|U] bir kez daha denememi beklemiyor; [main_figure.GetSheHe] gitmiş, erişemeyeceğim kadar uzağa, ormanın gölgelerine koşuyor."

 agot_nw_ranger_events.1905.desc.two.c:0 "Kaçak oyunuma gelmiyor. [main_figure.GetHerHis|U] ifadesi şaşkınlıktan durumu kavramaya dönüşüyor ve [main_figure.GetHerHim] durduramadan [main_figure.GetSheHe] ağaçların arasına dalıp vahşi doğada kayboluyor."

 agot_nw_ranger_events.1905.desc.two.d:0 "Kaçağı kandırma girişimim çöküyor. [main_figure.GetSheHe|U] durumu kavrıyor ve kaçmakta hiç vakit kaybetmiyor. Ormanın gölgeleri [main_figure.GetHerHim] bütünüyle yutuyor ve ben elim boş kalıyorum."

 agot_nw_ranger_events.1905.desc.two.e:0 "[main_figure.GetHerHim] kandırmaya çalışıyorum, ama kaçak aldanmıyor. [main_figure.GetSheHe|U] çabucak kavrıyor ve daha harekete geçemeden kaçıyor. Ormanlar [main_figure.GetHerHim] çevresinde kapanıyor ve ben [main_figure.GetHerHim] kayboluşunu izlemekle kalıyorum."

 agot_nw_ranger_events.1905.desc.three.a:0 "[main_figure.GetHerHim] kuşatmak için hareketleniyoruz, ama kaçak düzenimizde bir boşluk seziyor. [main_figure.GetSheHe|U] koşmaya başlıyor; daha ayarlayamadan ağaçların arasından sıvışıyor. [main_figure.GetSheHe] ormanlarda kaybolurken izliyorum."

 agot_nw_ranger_events.1905.desc.three.b:0 "Stratejim sendelemiyor... Stratejim zayıflıyor ve kaçak bir açıklık buluyor. [main_figure.GetSheHe|U] ağaçların arasına dalıp kavrayışımızdan kaçıyor. Hatayı fark ettiğimde [main_figure.GetSheHe] çoktan gitmiş, ormana kapılmış."

 agot_nw_ranger_events.1905.desc.three.c:0 "[main_figure.GetHerHim] tuzağa düşürmeye çalışıyoruz, ama kaçak saflarımızdaki bir zayıflığı seziyor. Daha tepki veremeden [main_figure.GetSheHe] hatlarımızdan sıvışıyor ve ormanın gölgelerinde kayboluyor."

 agot_nw_ranger_events.1905.desc.three.d:0 "Plan sağlam, ama kaçak öngördüğümden çevik. [main_figure.GetSheHe|U] düzenimizde bir boşluk bulup vahşi doğaya koşuyor. Av burada sona eriyor; [main_figure.GetHerHim] parmaklarımızın arasından kayıyor."

 agot_nw_ranger_events.1905.desc.three.e:0 "Yaklaşıyoruz, ama kaçak beklenenden hızlı. [main_figure.GetSheHe|U] mevzilenmemizdeki bir hatadan yararlanıp ormanlara kaçıyor; biz de hayal kırıklığıyla [main_figure.GetHerHim] arkasından bakakalıyoruz."

 agot_nw_ranger_events.1905.a:0 "Hayır!"

 ranger_laamp_contract_2001_contract:0 "Yabanıllar Tarafından Kovalanan"

 ranger_laamp_contract_2001_request:0 "Bu [agot_ranger_mission|E] için bir siyahkardeşi [TaskContract.GetEmployer.GetNamePossessive] gazabından kurtarmanız gerekir"

 ranger_laamp_contract_2001_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_2001_desc:0 "Az önce siyahkardeşlerimizden birinin bir yabanıl reisi tarafından avlandığı haberini aldım.\n\nKaçıyor ve hayatı kılı kırk yarıyor. Ona yardım edeceksek hızla hareket etmeliyiz. Yabanıllar yaklaşmadan önce ona pek fazla zaman tanımayacak."

 agot_nw_ranger_events.2001.t:0 "Zamana Karşı Yarış"

 agot_nw_ranger_events.2001.desc.intro_a:0 "Siyahkardeşin [rescued_bb.GetHerHis] canı için kaçtığı haberi zihnime ağır çöküyor. Yabanıllar durmayacak ve biz zaman kaybedemeyiz. [main_figure.GetTitledFirstName] ondan önce [main_figure.GetHerHim] ulaşmalıyız."

 agot_nw_ranger_events.2001.desc.intro_b:0 "Bir siyahkardeş avlanıyor ve biz onun [rescued_bb.GetHerHis] tek umuduyuz. Yabanıllar yaklaşıyor ve her an önemli. Ölümcül olabilecek bir kovalamaca için korucuları topluyorum."

 agot_nw_ranger_events.2001.desc.intro_c:0 "Kaybedecek zaman yok. Bir siyahkardeş [rescued_bb.GetHerHis] canı için koşuyor ve [main_figure.GetTitledFirstName] [rescued_bb.GetHerHis] izini sıkı takip ediyor. Yola çıkmaya hazırlanırken rüzgâr uluyor. Neredeyse onun kadar hızlı hareket etmemiz gerekecek."

 agot_nw_ranger_events.2001.desc.intro_d:0 "Bir kardeş tehlikede; [main_figure.GetTitledFirstName] onu avlıyor. Ayrılmaya hazırlanırken soğuk hava ısırıyor. Hataya yer yok; tek bir hata [rescued_bb.GetSheHe]nın sağ çıkamaması demek."

 agot_nw_ranger_events.2001.desc.intro_e:0 "Yabanıllar avda ve avları bizden biri. Hızlı hareket etmezsek siyahkardeşin hiçbir şansı olmayacak. Görev için ihtiyacımız olanı toplarken kamp kıpırdanıyor."

 agot_nw_ranger_events.2001.desc.outro:0 "\n\nYabanıl reisi yaklaşıyor ve ne kadar beklersek şansımız o kadar azalıyor. Çok geç olmadan şimdi harekete geçmeliyiz."

 agot_nw_ranger_events.2001.a:0 "Kaybedecek zaman yok."

 agot_nw_ranger_events.2001.b:0 "Kampı yaklaştır."

 agot_nw_ranger_events.2001.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.2002.t:0 "Kovalama Kısalıyor"

 agot_nw_ranger_events.2002.desc.intro_a:0 "Açıklığın kenarına ulaşıyoruz ve siyahkardeşimiz işte orada; [main_figure.GetHerHis] peşini bırakmayan yabanıl reisiyle çaresizce kaçıyor. Harekete geçecek zaman zar zor var, ama tam zamanında yetiştik."

 agot_nw_ranger_events.2002.desc.intro_b:0 "İleride siyahkardeşi seçiyoruz; yabanıl reisi hızla yaklaşırken ağaçların arasında sendeleyerek ilerliyor. Aralarındaki mesafe daralıyor ve [main_figure.GetHerHim] kurtarma penceremiz neredeyse kapandı."

 agot_nw_ranger_events.2002.desc.intro_c:0 "Siyahkardeş görüş alanına giriyor; yabanıl reisi yaklaşırken [rescued_bb.GetHerHis] yüzü dehşetten bembeyaz. Çok geride değiliz, ama her kalp atışıyla tehlike büyüyor."

 agot_nw_ranger_events.2002.desc.intro_d:0 "Siyahkardeşi, bitkin ve sendeleyerek görünce tam zamanında varıyoruz; yabanıl reisi [main_figure.GetHerHim] yetişiyor. Kaybedecek daha fazla zaman yok; reis [main_figure.GetHerHim] neredeyse yakaladı."

 agot_nw_ranger_events.2002.desc.intro_e:0 "Siyahkardeş ormanda koşuyor, ama yabanıl reisi tam [main_figure.GetHerHim] arkasında, hızla yetişiyor. Tam zamanında vardık, ama şimdiki her tereddüt ölümcül olacak."

 agot_nw_ranger_events.2002.desc.mid_a:0 "[main_figure.GetTitledFirstName] amansız; [main_figure.GetSheHe] vurmaya hazırlanırken [rescued_bb.GetHerHis] adımları hızlanıyor. Siyahkardeş sendeleyiyor ve [main_figure.GetHerHis] gözlerindeki paniği görebiliyorum. Şimdi harekete geçmeliyiz, yoksa her şey bitti."

 agot_nw_ranger_events.2002.desc.mid_b:0 "[main_figure.GetTitledFirstName] [main_figure.GetHerHim] neredeyse yakaladı; [main_figure.GetHerHis] mızrağı öldürmek için kalkık. Yabanıl giderek yaklaşırken siyahkardeş takılıp nefes nefese kalıyor. Çok geç olmadan önümüzde yalnızca saniyeler var."

 agot_nw_ranger_events.2002.desc.mid_c:0 "[main_figure.GetTitledFirstName] neredeyse orada; [main_figure.GetHerHis] gözleri siyahkardeşe kilitlenmiş. Aralarındaki mesafe her saniye kısalırken havadaki gerilim yoğun. Harekete geçme anı şimdi."

 agot_nw_ranger_events.2002.desc.mid_d:0 "Siyahkardeş bir kez daha sendeleyiyor ve [main_figure.GetTitledFirstName] anı yakalıyor. [main_figure.GetHerHis|U] mızrağı soğuk ışıkta parlıyor, vurmaya hazır. Aciliyetin arttığını hissedebiliyorum. Harekete geçmeliyiz."

 agot_nw_ranger_events.2002.desc.mid_e:0 "[main_figure.GetTitledFirstName] neredeyse vuruş mesafesinde. [main_figure.GetHerHis|U] adımları ağır ve niyet dolu; siyahkardeşin dehşeti elle tutulur. Harekete geçme penceresi hızla kapanıyor."

 agot_nw_ranger_events.2002.desc.outro_a:0 "\n\nDüşünecek daha fazla zaman yok; yalnızca harekete geçme zamanı var. Yabanıl reisinin vurmasına saniyeler kaldı ve siyahkardeşimizi nasıl kurtaracağımıza karar vermek bana düşüyor."

 agot_nw_ranger_events.2002.desc.outro_b:0 "\n\nZamanımız tükendi. Yabanıl vurmak üzere ve [main_figure.GetHerHim] durdurup siyahkardeşi kurtaracaksak hızla hareket etmeliyim."

 agot_nw_ranger_events.2002.desc.outro_c:0 "\n\nYabanıl reisi öldürmek için yaklaşıyor ve kardeşimizin kaderi kılı kırk yarıyor. Hamlemi yapma zamanı."

 agot_nw_ranger_events.2002.desc.outro_d:0 "\n\nYabanıl [main_figure.GetHerHim] ulaşmak üzere. Reisin son darbeyi indirmesini engelleyeceksek şimdi harekete geçmeliyim."

 agot_nw_ranger_events.2002.desc.outro_e:0 "\n\nDaha fazla zaman yok. Yabanıl reisi vurmaya hazır ve çok geç olmadan nasıl müdahale edeceğime karar vermeliyim."

 agot_nw_ranger_events.2002.a:0 "Yabanıla hücum ederim."

 agot_nw_ranger_events.2002.b:0 "Yabanılla mantık kurmaya çalışırım."

 agot_nw_ranger_events.2002.c:0 "Yabanılı kandırıp [main_figure.GetHerHim] salıvermesini sağlarım."

 agot_nw_ranger_events_2002.b.tt.win:0 "Yabanıl reisi tereddüt eder ve [main_figure.GetHerHim] geri durmaya ikna ederim"

 agot_nw_ranger_events_2002.b.tt.lose:0 "Sözlerim sağır kulaklara düşer ve vurur"

 agot_nw_ranger_events_2002.c.tt.win:0 "Yabanıl reisi oyunuma gelir ve siyahkardeşi salıverir"

 agot_nw_ranger_events_2002.c.tt.lose:0 "Yabanıl aldatmacamı görür ve vurur"

 agot_nw_ranger_events.2004.t:0 "Vahşi Doğada Zafer"

 agot_nw_ranger_events.2004.desc.one.a:0 "Hücumum hızlı ve yabanıl reisinin tepki verecek zamanı olmuyor. Tek, güçlü bir vuruşla [main_figure.GetHerHim] yere seriyorum. Siyahkardeş güvende; [rescued_bb.GetHerHis] canı hızlı müdahalemizle kurtarıldı."

 agot_nw_ranger_events.2004.desc.one.b:0 "Yabanıl reisi [main_figure.GetHerHis] saldırısını bitiremeden hareket ediyorum. Kılıcım havayı yarıp [main_figure.GetHerHim] bir hızla yere seriyor. Siyahkardeş sonunda güvende olduğu için rahatlamış halde [rescued_bb.GetHerHis] dizlerinin üzerine çöküyor."

 agot_nw_ranger_events.2004.desc.one.c:0 "[main_figure.GetSheHe] vurmak üzereyken yabanıl reisine ulaşıyorum. Kılıcım hedefini buluyor ve çarpışma saniyeler içinde bitiyor. Siyahkardeş, ölümün eşiğinden kurtarılmış olarak bana rahatlamış gözlerle bakıyor."

 agot_nw_ranger_events.2004.desc.one.d:0 "Bir kükremeyle kavgaya dalıyorum; [main_figure.GetSheHe] siyahkardeşe zarar veremeden yabanıl reisini yere seriyorum. Çarpışma çabuk biter ve siyahkardeşin canı bağışlanır."

 agot_nw_ranger_events.2004.desc.one.e:0 "Kılıcım isabetle vuruyor ve yabanıl reisi ayaklarımın dibine yıkılıyor. Korkudan titreyen siyahkardeş, [rescued_bb.GetHerHim] güvenliğe çekerken [rescued_bb.GetHerHis] teşekkürünü baş sallayarak gösteriyor."

 agot_nw_ranger_events.2004.desc.two.a:0 "Sözlerim yabanıl reisine tam zamanında ulaşıyor. [main_figure.GetSheHe|U] tereddüt ediyor, teklifimi değerlendiriyor. Gergin bir anın ardından [main_figure.GetSheHe] [main_figure.GetHerHis] silahını indirip yürüyüp gidiyor; siyahkardeşi sağ bırakıyor."

 agot_nw_ranger_events.2004.desc.two.b:0 "Hızla konuşuyor, yabanıl reisine bir çıkış yolu sunuyorum. [main_figure.GetHerHis|U] gözleri kısılıyor, ama sonunda [main_figure.GetSheHe] yumuşuyor. Siyahkardeş güvende ve yabanıl dönüp ormanda kayboluyor."

 agot_nw_ranger_events.2004.desc.two.c:0 "Konuştuğumda yabanıl reisi duraklıyor, [main_figure.GetHerHis] mızrağı kavrayışı gevşiyor. Bir an düşündükten sonra [main_figure.GetSheHe] dönüp gidiyor; siyahkardeşin canını bağışlıyor ve bizi huzur içinde bırakıyor."

 agot_nw_ranger_events.2004.desc.two.d:0 "Günü kazandıran silahlar değil sözler. Yabanıl reisi mantığı dinliyor, [main_figure.GetHerHis] mızrağını indirip geri çekiliyor. Siyahkardeş güvende; [rescued_bb.GetHerHis] canı bağışlandı."

 agot_nw_ranger_events.2004.desc.two.e:0 "Sözlerim yabanıl reisinde yankı buluyor. [main_figure.GetSheHe|U] siyahkardeşe, sonra bana bakıyor; en sonunda başını sallayıp yürüyor. Tehdit gitti ve siyahkardeş güvende."

 agot_nw_ranger_events.2004.desc.three.a:0 "Elimi özenle oynuyorum; yabanıl reisini sahte bir sözle oyalıyorum. [main_figure.GetHerHis] kafa karışıklığı anında siyahkardeş kaçıyor ve [main_figure.GetHerHis] hatasını fark eden yabanıl reisi de kaçıyor."

 agot_nw_ranger_events.2004.desc.three.b:0 "Oyunum işe yarıyor. Yabanıl reisi hileye kanıyor ve [main_figure.GetSheHe] sırtını döndüğünde siyahkardeş sıvışıyor. [main_figure.GetSheHe] aldatıldığını anlayan reis, vahşi doğaya kaçıyor."

 agot_nw_ranger_events.2004.desc.three.c:0 "Yabanıl reisini yanlış yönlendiriyor, [main_figure.GetHerHim] başka tarafa bakmaya ikna ediyorum. [main_figure.GetSheHe] gerçeği fark ettiğinde siyahkardeş çoktan güvende ve yabanıl, akıllıca alt edilmiş halde ormanda kayboluyor."

 agot_nw_ranger_events.2004.desc.three.d:0 "Oyunum kusursuz işliyor. Yabanıl reisi, siyahkardeşin kaçmasına yetecek kadar tereddüt ediyor. Yenilgiyi kabul eden yabanıl reisi, [main_figure.GetSheHe] manevrayla alt edildiğini bilerek geri çekiliyor."

 agot_nw_ranger_events.2004.desc.three.e:0 "Sözlerimle aldatılan yabanıl reisi duraksıyor. Siyahkardeş sıvışma şansını kullanıyor ve [main_figure.GetSheHe] kandırıldığını anlayan yabanıl vahşi doğada kayboluyor."

 agot_nw_ranger_events.2004.a:0 "Artık güvendeyiz."

 agot_nw_ranger_events.2005.t:0 "Başarısızlığın Bedeli"

 agot_nw_ranger_events.2005.desc.one.a:0 "İçeri hücum ediyorum, ama çok geç. Yabanıl reisinin kılıcı isabetle vuruyor ve [main_figure.GetHerHim] ulaşamadan siyahkardeş yıkılıyor. Olay yerine vardığımda iş işten geçmiş; [rescued_bb.GetSheHe] gitmiş."

 agot_nw_ranger_events.2005.desc.one.b:0 "Savuruşum ıskalıyor ve yabanıl reisinin vuruşu hızlı geliyor. Siyahkardeş yere yığılıyor; biz çaresizce izlerken [rescued_bb.GetHerHis] canı kısa kesiliyor. Başarısızlığımız tamamlandı."

 agot_nw_ranger_events.2005.desc.one.c:0 "Sert savaşıyorum, ama yetmiyor. Yabanıl reisinin darbesi isabet ediyor ve siyahkardeş cansız yere yıkılıyor. Yabanılın zaferle sıvışmasını izlemekten başka yapabileceğim bir şey yok."

 agot_nw_ranger_events.2005.desc.one.d:0 "Öne hücum ediyorum, ama yabanıl reisi daha hızlı. [main_figure.GetHerHis|U] silahı, onlara ulaşamadan siyahkardeşi yere seriyor. Yoldaşımızın düşüşünü izlerken yenilgi acı veriyor."

 agot_nw_ranger_events.2005.desc.one.e:0 "Yabanıl reisi, daha tepki veremeden hareket ediyor ve siyahkardeşin canı bir anda alınıyor. Bunu durdurmaya çalışıyorum, ama çabalarım çok geç kalıyor; savaş kaybedildi."

 agot_nw_ranger_events.2005.desc.two.a:0 "Yabanıl reisiyle mantık kurmaya çalışıyorum, ama sözlerim sağır kulaklara düşüyor. [main_figure.GetHerHis|U] kılıcı parıldıyor ve daha ben hareket edemeden siyahkardeş ölü yere düşüyor."

 agot_nw_ranger_events.2005.desc.two.b:0 "Hızla konuşuyor, durumu yatıştırmaya çalışıyorum, ama yabanıl reisi etkilenmiyor. [main_figure.GetHerHis|U] silahı siyahkardeşi yere seriyor ve [main_figure.GetHerHim] kurtarma şansım yok oluyor."

 agot_nw_ranger_events.2005.desc.two.c:0 "Müzakere girişimim başarısız oluyor. Yabanıl reisinin öfkesi azalmıyor ve hızlı bir darbeyle [main_figure.GetSheHe] siyahkardeşi öldürüyor. Sözlerim [main_figure.GetHerHim] kurtarmaya yetmedi."

 agot_nw_ranger_events.2005.desc.two.d:0 "Ortak zemin bulmaya çalışıyorum, ama yabanıl reisi dinlemiyor. [main_figure.GetHerHis|U] kılıcı siyahkardeşi biçiyor ve savaşın yenilgiyle bitişini dehşetle izlemekten başka yapabileceğim bir şey yok."

 agot_nw_ranger_events.2005.desc.two.e:0 "Barış yalvarışım karşılıksız kalıyor. Yabanıl reisi vuruyor ve siyahkardeş, [rescued_bb.GetSheHe] durduğu yerde can veriyor. Yenilgi ezici ve bize yalnızca kayıp kalıyor."

 agot_nw_ranger_events.2005.desc.three.a:0 "Yabanıl reisini aldatmaya çalışıyorum, ama [main_figure.GetSheHe] oyunumu görüyor. Hızlı bir hamleyle [main_figure.GetHerHis] kılıcı siyahkardeşi yere seriyor. Yenilgi hızlı ve inkâr edilemez."

 agot_nw_ranger_events.2005.desc.three.b:0 "Yabanılı yanlış yönlendirme planım başarısız oluyor. [main_figure.GetSheHe|U] hileyi görüyor ve ben [main_figure.GetHerHim] durduramadan siyahkardeşi öldürüyor. Hilekârlığım [main_figure.GetHerHim] kurtarmaya yetmedi."

 agot_nw_ranger_events.2005.desc.three.c:0 "Yabanıl reisini akılla alt etmeye çalışıyorum, ama planım çöküyor. [main_figure.GetHerHis|U] darbesi isabet ediyor ve siyahkardeş gözlerimin önünde ölü yere düşüyor. Yenilgi acı ve stratejim başarısız oluyor."

 agot_nw_ranger_events.2005.desc.three.d:0 "Aldatmacam başarısız oluyor. Yabanıl reisi aldanmıyor ve hızlı bir vuruşla [main_figure.GetSheHe] siyahkardeşi öldürüyor. Kayıp keskin ve çabalarım boşa çıkıyor."

 agot_nw_ranger_events.2005.desc.three.e:0 "Yabanıl reisini kandırma girişimim feci biçimde ters gidiyor. [main_figure.GetSheHe|U] kolayca görüyor ve [main_figure.GetHerHis] kılıcı siyahkardeşi yere seriyor. Yenilgiyle ayakta kalıyorum."

 agot_nw_ranger_events.2005.a:0 "Bitti... [main_figure.GetHerHim] kaybettik."

 agot_nw_ranger_events.2005.a.tt:0 "Yabanıl kaçar"

 ranger_laamp_contract_2101_contract:0 "Kardaki İzler"

 ranger_laamp_contract_2101_request:0 "Bu [agot_ranger_mission|E], bölgedeki tuhaf izlerin ve gizli ipuçlarının dikkatli bir araştırmasını gerektirir"

 ranger_laamp_contract_2101_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_2101_desc:0 "Dışarıda tuhaf bir şey buldum: bir iz, karda işaretler.\n\nBunları neyin bıraktığını çıkaramıyorum, ama altında bir şey var, Birinci Korucu. Daha derin araştırırsak tüm bunların ardındakini ortaya çıkarabiliriz."

 ranger_laamp_contract_2101_reward_win:0 "[gold_i|E][gold|E], [prestige_i|E][prestige|E] ya da [piety_i|E][piety|E] dahil rastgele bir ödül kazanabilirsiniz"

 ranger_laamp_contract_2101_reward_lose:0 "[prestige_i|E][prestige|E] ya da [piety_i|E][piety|E] kaybetmek gibi küçük cezalarla karşılaşabilirsiniz"

 agot_nw_ranger_events.2101.t:0 "Bilinmeze Doğru"

 agot_nw_ranger_events.2101.desc.intro_a:0 "İzcinin bulduğu izi takip etmek için hazırlanıyoruz. Hava soğuk ve keskin; bilinmeyen bir şeyin ağırlığını taşıyor. Dışarıda bulacağımız ne olursa olsun değerli ya da tehlikeli olabilir. İzler bizi bekliyor."

 agot_nw_ranger_events.2101.desc.intro_b:0 "Adamlar harekete hazır, gözler buzlu araziyi tarıyor. [my_ranger.GetTitledFirstName] raporu zihnimde asılı: bölgeye yayılmış olağandışı bir şeyin işaretleri. Kendimiz görmenin zamanı."

 agot_nw_ranger_events.2101.desc.intro_c:0 "Erzak toplarken izlerin gizemi bizi çağırıyor. Dışarıda bir şey var ve [my_ranger.GetTitledFirstNamePossessive] keşfi kampı hareketlendirdi. Bu işaretleri, nereye götürürse götürsün takip edeceğiz."

 agot_nw_ranger_events.2101.desc.intro_d:0 "Teçhizatımız hazır, adamlar huzursuz ve önümüzde izler uzanıyor. Sıradan ya da tehlikeli bir şeye mi götürüyorlar, öğrenmeliyiz. Bu topraklar sırlar saklıyor ve biz birini ortaya çıkarmak üzereyiz."

 agot_nw_ranger_events.2101.desc.intro_e:0 "Güneş Sur'un üzerinde zar zor yükselirken yola çıkmaya hazırlanıyoruz. [my_ranger.GetTitledFirstNamePossessive] keşfi ötede bekliyor; bizi mağaraya, ormanlara ya da tepelere çağırıyor. İz, beklenmedik bir şeyi ya da gizli kalması en iyisi olan bir şeyi açığa çıkarabilir."

 agot_nw_ranger_events.2101.desc.outro:0 "\n\nKarda bırakılan işaretler uzun süre dayanmaz. Vahşi doğa her izi silmeden hızla hareket etmeliyiz. Yola çıkıp ileride ne olduğunu bulmanın zamanı."

 agot_nw_ranger_events.2101.a:0 "Kaybedecek zaman yok."

 agot_nw_ranger_events.2101.b:0 "Kampı yaklaştır."

 agot_nw_ranger_events.2101.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.2102.t:0 "Güneş Batmadan"

 agot_nw_ranger_events.2102.desc.intro_a:0 "Güneş alçalmaya başladığı anda alana ulaştık. Hava soğuyor, gölgeler yere yayılıyor. Zaman kısa ve bir seçim yapmamız gerekecek; yalnızca bir bölgeyi iyice arayacak kadar ışık kaldı."

 agot_nw_ranger_events.2102.desc.intro_b:0 "Arazi önümüzde uzanıyor, izler uzakta sönüyor. Her iz bir hikâye anlatıyor; mağaraya, ormanlara ve tepelere doğru uzanıyor. Dikkatle seçmeliyiz; gece çökmeden ikinci bir şansımız olmayacak."

 agot_nw_ranger_events.2102.desc.intro_c:0 "Varır varmaz alacakaranlığın soğuğu çöküyor. Mağaraya, ormanlara ya da kayalık tepelere giden her yol, geride bırakılmış bir şeyi ima ediyor. Burada tuhaf bir enerji var ve şimdi yapacağımız seçim ne bulacağımızı belirleyebilir."

 agot_nw_ranger_events.2102.desc.intro_d:0 "Bölgeyi değerlendirirken gölgeler uzuyor. İzler farklı yönlere gidiyor; her güzergâh kendi gizemini sunuyor. Güneş bizi beklemeyecek; hava kararmadan bir şey ortaya çıkaracaksak yolumuzu akıllıca seçmeliyiz."

 agot_nw_ranger_events.2102.desc.intro_e:0 "Solan gün ışığı araziye loş bir parıltı düşürüyor. Bir yol ayrımında duruyoruz; yollar mağaraya, ormanlara ve tepelere gidiyor. Hepsini keşfedecek zaman yok, ama akıllıca seçmek burada gizlenen sırları açığa çıkarabilir."

 agot_nw_ranger_events.2102.desc.outro:0 "\n\nGünün son ışığı kayıp gidiyor ve bizi tek bir seçimle baş başa bırakıyor."

 agot_nw_ranger_events.2102.a:0 "Yakındaki mağarayı araştırmalıyız."

 agot_nw_ranger_events.2102.b:0 "Yakındaki ormanlarda arayacağız."

 agot_nw_ranger_events.2102.c:0 "Kayalık tepelere tırmanmamız gerekiyor."

 agot_nw_ranger_events.2103.t.cave:0 "Gölgelerin İçine"

 agot_nw_ranger_events.2103.desc.intro_a.cave:0 "Tepenin yamacını yaran karanlık bir boşluk olan mağaranın ağzına yaklaşıyoruz. Buradaki hava daha ağır hissettiriyor; sanki nefesini tutuyor."

 agot_nw_ranger_events.2103.desc.intro_b.cave:0 "Mağara girişi, sivri kayalarla çerçevelenmiş halde kara kara yükseliyor. Gölgeler dışarı taşıyor; içeride yatan sırları gizliyor."

 agot_nw_ranger_events.2103.desc.intro_c.cave:0 "Mağaraya giden yol tehlikeli; keskin kayalar ve gevşek taşlarla dolu. İçeriden gelen soğuk hava bize değiyor."

 agot_nw_ranger_events.2103.desc.intro_d.cave:0 "Mağaranın kenarında durup karanlığa bakıyoruz. İçerisi sessiz; huzursuz edici biçimde sessiz, sanki bir şey bekliyor."

 agot_nw_ranger_events.2103.desc.intro_e.cave:0 "Mağaranın ağzı önümüzde esniyor; derin ve ürkütücü. İçeriden, nemli toprak ve taş kokusu taşıyan bir ürperti yükseliyor."

 agot_nw_ranger_events.2103.desc.mid_a.cave:0 "Daha da ilerledikçe karanlık üzerimize çöküyor. Gölgeler her adımda kıpırdıyor; gözlerimiz karanlığın içini görmeye çalışarak zorlanıyor."

 agot_nw_ranger_events.2103.desc.mid_b.cave:0 "Her sese karşı tetikte, dikkatle ilerliyoruz. Sessizlik sinir bozucu; yalnızca içeriden yankılanan hafif su damlalarıyla bölünüyor."

 agot_nw_ranger_events.2103.desc.mid_c.cave:0 "Ayak seslerimiz taş duvarlarda yankılanıyor ve hava soğuyor. Artık daha derindeyiz; girişten gelen ışığın ulaşamadığı yerde."

 agot_nw_ranger_events.2103.desc.mid_d.cave:0 "Derinlere indikçe mağara daralıyor, duvarlar yaklaşıyor. Her ses yükselerek gerilimimizi artırıyor."

 agot_nw_ranger_events.2103.desc.mid_e.cave:0 "Karanlığa atılan her adım yalnızca daha fazla gölgeyi açığa çıkarıyor. Hava yoğun ve bir şeyler... yanlış; sanki izleniyoruz."

 agot_nw_ranger_events.2103.desc.outro_a.cave:0 "\n\nİleride, molozun altında yarı gömülü soluk bir parıltı gözümüze çarpıyor. Mağara gölgelerden fazlasını barındırıyor; bir şeyler gizliyor."

 agot_nw_ranger_events.2103.desc.outro_b.cave:0 "\n\nGözlerimiz alışıyor ve kayaların arasında yatan sıra dışı bir şey var. Bu mağara, aradığımız cevapları barındırıyor olabilir."

 agot_nw_ranger_events.2103.desc.outro_c.cave:0 "\n\nUzakta bir şey seçince duraksıyoruz. Karanlıkta zar zor görülen, metal ya da kemikten soluk bir parıltı."

 agot_nw_ranger_events.2103.desc.outro_d.cave:0 "\n\nGeri dönmeyi düşünürken kısmen gizlenmiş bir şeyi fark ediyoruz; tuhaf izleri açıklayabilecek bir keşif."

 agot_nw_ranger_events.2103.desc.outro_e.cave:0 "\n\nGölgeler bir parıltı açığa çıkarıyor; mağaranın karanlığında yeri olmayan bir biçim. Bir şey bulduk... ama ne?"

 agot_nw_ranger_events.2103.a.cave:0 "Karanlığın derinlerini ararız."

 agot_nw_ranger_events.2103.b.cave:0 "Parıltıyı yakından inceleriz."

 agot_nw_ranger_events.2103.c.cave:0 "Yakın zamandaki faaliyetlerin işaretlerini ararız."

 agot_nw_ranger_events_2103.a.tt.win.cave:0 "Gizli bir yadigâr ortaya çıkarırım."

 agot_nw_ranger_events_2103.a.tt.lose.cave:0 "Dengemi kaybederim, yalnızca tehlike bulurum."

 agot_nw_ranger_events_2103.b.tt.win.cave:0 "Göz önünde gizlenmiş değerli bir bulgu."

 agot_nw_ranger_events_2103.b.tt.lose.cave:0 "Nesne bir tuzaktır; yakından incelenince kırılır."

 agot_nw_ranger_events_2103.c.tt.win.cave:0 "Taze izler seçerim."

 agot_nw_ranger_events_2103.c.tt.lose.cave:0 "İzler hiçbir yere çıkmıyor."

 agot_nw_ranger_events.2103.t.woods:0 "Fısıldayan Orman"

 agot_nw_ranger_events.2103.desc.intro_a.woods:0 "Ağaçlar çevremizi sarıyor, dalları kırağının ağırlığıyla sarkıyor. Orman sessiz; neredeyse fazla durgun."

 agot_nw_ranger_events.2103.desc.intro_b.woods:0 "Kalın ağaçlar sütunlar gibi yükseliyor, dalları karanlık bir örtü oluşturuyor. Orman sonsuz görünüyor; gölge ve kabuktan bir labirent."

 agot_nw_ranger_events.2103.desc.intro_c.woods:0 "Ormana adım atıyoruz; ayaklarımızın altındaki zemin yumuşak. Her ses, kalın yaprak tabakası tarafından yutuluyor."

 agot_nw_ranger_events.2103.desc.intro_d.woods:0 "Orman bizi içine çekiyor; ağaçların arasında kıvrılan patikalar var. Tepedeki dallar ışığın çoğunu engelliyor."

 agot_nw_ranger_events.2103.desc.intro_e.woods:0 "Derinlere indikçe sessizlik neredeyse sağır edici. Her ayak sesi daha yüksek duyuluyor; sanki ormanın ta kendisi dinliyor."

 agot_nw_ranger_events.2103.desc.mid_a.woods:0 "Tepede dallar gıcırdıyor ve soğuk bir rüzgâr sıyrılıp geçiyor; sanki görünmeyen bir şey çevremizde dolaşıyor."

 agot_nw_ranger_events.2103.desc.mid_b.woods:0 "Yakında hafif bir hışırtı duyuyoruz. Orman boş olmaktan çok uzak ve her gölge bir sır saklıyor."

 agot_nw_ranger_events.2103.desc.mid_c.woods:0 "Üzerimize bir huzursuzluk duygusu çöküyor; ağaçların altındaki gölgeler sönen ışıkta kayıyor."

 agot_nw_ranger_events.2103.desc.mid_d.woods:0 "İlerledikçe ağaçlar daha da çarpıklaşıyor; kolları uzanıp kapan pençeler gibi."

 agot_nw_ranger_events.2103.desc.mid_e.woods:0 "Her dönemeç yeni gölgeler açığa çıkarıyor ve derinlere indikçe hava soğuyor. Bu ormanda bir şey gizli."

 agot_nw_ranger_events.2103.desc.outro_a.woods:0 "\n\nİleride, köklerin arasına sıkışmış bir şey görüyoruz; geride bırakılmış ya da düşürülmüş küçük bir alamet."

 agot_nw_ranger_events.2103.desc.outro_b.woods:0 "\n\nBir açıklık buluyoruz ve yerde, yaprakların altında yarı gizlenmiş tuhaf bir bohça yatıyor."

 agot_nw_ranger_events.2103.desc.outro_c.woods:0 "\n\nGözümüze bir parıltı çarpıyor; biri tarafından, bilinmeyen bir şey için bırakılmış gizli bir istif ya da bir adak."

 agot_nw_ranger_events.2103.desc.outro_d.woods:0 "\n\nGeri dönmeyi düşünürken gölgelerde parıldayan bir şey seçiyoruz; buradan geçen şeye dair bir ipucu."

 agot_nw_ranger_events.2103.desc.outro_e.woods:0 "\n\nAğaçlar hafifçe aralanıyor, yerde bir nesneyi açığa çıkarıyor. Küçük, ama cevaplar barındırıyor olabilir."

 agot_nw_ranger_events.2103.a.woods:0 "Tuhaf alameti inceleriz."

 agot_nw_ranger_events.2103.b.woods:0 "Toprakta iz ararız."

 agot_nw_ranger_events.2103.c.woods:0 "Çalılıkları dikkatle ararız."

 agot_nw_ranger_events_2103.a.tt.win.woods:0 "Değerli bir yadigârdır."

 agot_nw_ranger_events_2103.a.tt.lose.woods:0 "Nesne kırılır, hiçbir şey sunmaz."

 agot_nw_ranger_events_2103.b.tt.win.woods:0 "Derinlere giden taze izler bulurum."

 agot_nw_ranger_events_2103.b.tt.lose.woods:0 "İzler hiçbir yere çıkmıyor."

 agot_nw_ranger_events_2103.c.tt.win.woods:0 "Gizli bir istif ortaya çıkarırım."

 agot_nw_ranger_events_2103.c.tt.lose.woods:0 "Burada gölgelerden başka bir şey yok."

 agot_nw_ranger_events.2103.t.hill:0 "Kayalık Yükseklerde"

 agot_nw_ranger_events.2103.desc.intro_a.hill:0 "Kayalık tepeler önümüzde yükseliyor; sarp ve kaya yığınlarından oluşan bir arazi. Tırmanınca bölgenin geniş bir manzarasıyla karşılaşıyoruz."

 agot_nw_ranger_events.2103.desc.intro_b.hill:0 "Gevşek taşların üzerinde tırmanıyoruz; yükseldikçe rüzgâr şiddetleniyor. Tepeler sessiz, ama manzara uçsuz bucaksız."

 agot_nw_ranger_events.2103.desc.intro_c.hill:0 "Kayalar ve dik yamaçlar zorlu bir tırmanış sağlıyor, ama buradan Sur'un çok ötesini görebiliyoruz."

 agot_nw_ranger_events.2103.desc.intro_d.hill:0 "Kayalık arazi önümüzde uzanıyor; her adım bir meydan okuma. Tırmanırken ayaklarımızın altında gevşek taşlar şakırdıyor."

 agot_nw_ranger_events.2103.desc.intro_e.hill:0 "Tepeler sarp; keskin kenarlar ve dar patikalarla dolu. Tırmanırken yakın zamandaki faaliyetlerin işaretlerini arıyoruz."

 agot_nw_ranger_events.2103.desc.mid_a.hill:0 "Nefes almak için duraklıyor, ufku tarıyoruz. Rüzgâr tepeleri keskin ve soğuk biçimde yarıyor."

 agot_nw_ranger_events.2103.desc.mid_b.hill:0 "Kayaların arasında kasıtlı görünen işaretler fark ediyoruz; biri tarafından bırakılmış silik bir işaret."

 agot_nw_ranger_events.2103.desc.mid_c.hill:0 "Tırmanırken ayaklarımızın altında gevşek taşlar dağılıyor, ama ilerideki kayaların arasında bir şey parıldıyor."

 agot_nw_ranger_events.2103.desc.mid_d.hill:0 "Bir platoya ulaştığımızda, kayaların arasına sıkışmış, kısmen gizlenmiş, bekleyen bir şey görüyoruz."

 agot_nw_ranger_events.2103.desc.mid_e.hill:0 "Rüzgâr yön değiştiriyor ve bir anlığına silik bir duman kokusu geliyor; sanki biri çok uzun zaman önce değil, buradaydı."

 agot_nw_ranger_events.2103.desc.outro_a.hill:0 "\n\nİleride, iki kaya arasında, içine bir şey gizlenmiş küçük bir oyuk seçiyoruz."

 agot_nw_ranger_events.2103.desc.outro_b.hill:0 "\n\nTepede, kayaların arasına sıkışmış küçük bir bohça yatıyor; geride bırakılmış ya da bilerek gizlenmiş."

 agot_nw_ranger_events.2103.desc.outro_c.hill:0 "\n\nKayalık yamaçta yarı gömülü tuhaf bir nesne gözümüze çarpıyor. Burada yeri yokmuş gibi görünüyor."

 agot_nw_ranger_events.2103.desc.outro_d.hill:0 "\n\nYaklaşıyoruz; kayaların arasına yerleşmiş olağandışı bir şey seçiyoruz, peşinde olduğumuz şeye dair bir ipucu."

 agot_nw_ranger_events.2103.desc.outro_e.hill:0 "\n\nDaha da tırmanmaya hazırlanırken yarı gömülü bir şey seçiyoruz; taşların arasında bir keşif."

 agot_nw_ranger_events.2103.a.hill:0 "Kayalık yarıkları ararız."

 agot_nw_ranger_events.2103.b.hill:0 "Kaya üzerindeki işaretleri inceleriz."

 agot_nw_ranger_events.2103.c.hill:0 "Çevrede yakın zamandaki faaliyetlerin işaretlerini ararız."

 agot_nw_ranger_events_2103.a.tt.win.hill:0 "Gizli bir yadigâr bulurum."

 agot_nw_ranger_events_2103.a.tt.lose.hill:0 "Soğuk taştan başka bir şey yok."

 agot_nw_ranger_events_2103.b.tt.win.hill:0 "İşaretler değerli bir şeye götürüyor."

 agot_nw_ranger_events_2103.b.tt.lose.hill:0 "İşaretler anlamsız."

 agot_nw_ranger_events_2103.c.tt.win.hill:0 "Yakın zamanda yakılmış bir kamp ateşi ortaya çıkarırım."

 agot_nw_ranger_events_2103.c.tt.lose.hill:0 "Yer el değmemiş görünüyor."

 agot_nw_ranger_events.2104.t:0 "Keşif Yapıldı"

 agot_nw_ranger_events.2104.desc.a:0 "Daha derin bir araştırmanın ardından değerli bir şey ortaya çıkarıyoruz; bölge ve sırları hakkındaki anlayışımızı derinleştiren bir ipucu."

 agot_nw_ranger_events.2104.desc.b:0 "Aramamız değerini kanıtlıyor; geride bırakılmış gizli izleri açığa çıkarıyor. Burada ne varsa ardında değerli bir şey bırakmış."

 agot_nw_ranger_events.2104.desc.c:0 "Kapsamlı bir araştırmanın ardından gizli bir nesne buluyoruz; burada yaşananlara dair içgörü sunan beklenmedik bir ödül."

 agot_nw_ranger_events.2104.desc.d:0 "Çabalarımız karşılığını buluyor; hikâyenin bir parçasını taşıyan bir yadigâr gün yüzüne çıkarıyoruz. Bu bulgu beklediğimizden fazlası."

 agot_nw_ranger_events.2104.desc.e:0 "İzi takip etmek bizi gölgeler altına gömülü değerli bir şeye götürüyor. Görevimize değer katan bir bulgu."

 agot_nw_ranger_events.2104.desc.artifact:0 "\n\nAyrılmadan hemen önce ayağım toprağın altına gizlenmiş bir şeye, bir silaha takılıyor. Onu alıp kampa geri götürmeye karar veriyorum."

 agot_nw_ranger_events.2104.a:0 "Kampa geri dönelim."

 agot_nw_ranger_events.2105.t:0 "Boş Gölgeler"

 agot_nw_ranger_events.2105.desc.a:0 "Daha derin bir araştırmanın ardından elimiz boş çıkıyor. Burada ne varsa izleyebileceğimiz hiçbir iz bırakmamış."

 agot_nw_ranger_events.2105.desc.b:0 "Aramamız değerli hiçbir şey sunmuyor; daha fazlasını umduğumuz yerde yalnızca gölgeler ve sessizlik var."

 agot_nw_ranger_events.2105.desc.c:0 "Çabalarımıza rağmen kayda değer hiçbir şey bulamıyoruz. İpuçları sönüp gitti; bize yalnızca sorular kaldı."

 agot_nw_ranger_events.2105.desc.d:0 "Her santimi didik didik aradıktan sonra, elimiz boş ve neyi kaçırdığımıza dair süregelen şüphelerle ayrılıyoruz."

 agot_nw_ranger_events.2105.desc.e:0 "Araştırmamız değerli hiçbir şey ortaya çıkarmıyor; yalnızca kayıp zaman ve büyüyen bir beyhudelik duygusu."

 agot_nw_ranger_events.2105.a:0 "Sonuçsuz bir arama."

 ranger_laamp_contract_2201_contract:0 "Yabanıl Reisini Değerlendir"

 ranger_laamp_contract_2201_request:0 "Bu [agot_ranger_mission|E] için [TaskContract.GetEmployer.GetName] ziyaret edip [TaskContract.GetEmployer.GetHerHim] değerlendirmeniz gerekir"

 ranger_laamp_contract_2201_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_2201_desc:0 "Lord Kumandan, Sur'un ötesinde dalgalar yaratan [TaskContract.GetEmployer.GetName] araştırmamızı emretti. [TaskContract.GetEmployer.GetHerHis] halkının sayısı artıyor ve söylentiler [TaskContract.GetEmployer.GetHerHis] öngörülemez doğasından söz ediyor. Kimileri [TaskContract.GetEmployer.GetSheHe] bizim için bir tehlike diyor, kimileriyse [TaskContract.GetEmployer.GetSheHe] yalnızca hayatta kalmaya çalışan başka bir savaşçı topluluğu iddiasında. [TaskContract.GetEmployer.GetHerHis] kampının yerini buldum. Hızlı hareket edersek tehdidi, başa çıkılamayacak kadar büyümeden değerlendirebiliriz."

 agot_nw_ranger_events.2201.t:0 "Dikkatli Bir Göz"

 agot_nw_ranger_events.2201.desc.intro_a:0 "Lord Kumandan'ın emirleri net — [main_figure.GetTitledFirstName] yakından izlenmeli. [main_figure.GetSheHe] Sur için bir tehditse, bunu çok geç olmadan bilmeliyiz."

 agot_nw_ranger_events.2201.desc.intro_b:0 "Sur'un ötesinde, giderek cüretkârlaşan bir reisin fısıltıları yayılıyor. Kimileri [main_figure.GetSheHe] başkalarını etrafında topluyor diyor, kimileriyse [main_figure.GetSheHe] gürültücü bir budaladan başka bir şey değil. Gerçeği öğrenmeliyiz."

 agot_nw_ranger_events.2201.desc.intro_c:0 "Donmuş vahşi doğada bir yabanıl reisi daha yükseliyor. Kimi reisler akın düzenler, kimileri ticaret yapar, kimileri kendi halinde yaşar. [main_figure.GetSheHe] hangisi, biz belirleyeceğiz."

 agot_nw_ranger_events.2201.desc.intro_d:0 "Adamlar, Özgür Halk'ın daha büyük sayılarda toplandığından, [main_figure.GetHerHis] gözlerinde ateşle yürüyen bir liderden söz ediyor. Bir tehlike varsa, onu gören ilk biz olmalıyız."

 agot_nw_ranger_events.2201.desc.intro_e:0 "Nöbet'in doğası budur — gözetlemek. Bu yabanıl bir belaysa, Lord Kumandan bela kapımıza dayanmadan önce bilmeli."

 agot_nw_ranger_events.2201.desc.outro:0 "\n\nErzaklar toplanmış ve kılıçlar bileğelenmiş halde donmuş uçsuz bucaksızlığa yöneliyoruz. Yakında [main_figure.GetTitledFirstNamePossessive] topraklarının önünde duracak ve [main_figure.GetSheHe] gerçekte nasıl bir [Select_CString(main_figure.IsFemale,'kadın','adam')] öğreneceğiz."

 agot_nw_ranger_events.2201.a:0 "Yola çıkalım."

 agot_nw_ranger_events.2201.b:0 "Tüm kampı daha yakına taşımalıyız."

 agot_nw_ranger_events.2201.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.2202.t:0 "Onların Dünyasının Kıyısında"

 agot_nw_ranger_events.2202.desc.intro_a:0 "Donun ve gölgenin örtüsü altında yabanıl kampının yakınına varıyoruz. İleride ateşler titriyor; savaşçıları ağaçların altında hayaletler gibi hareket ediyor."

 agot_nw_ranger_events.2202.desc.intro_b:0 "Sırtın ötesinde yabanıl kampı donmuş zemine yayılıyor. Sayıları belirsiz, tehditleri muallakta."

 agot_nw_ranger_events.2202.desc.intro_c:0 "Duman kokusu soğuk havada süzülüyor. Bir savaş kampı mı? Bir toplantı mı? Söylemek için çok erken."

 agot_nw_ranger_events.2202.desc.intro_d:0 "Yerleşimin çevresini kaba bir savunma hattı sarıyor — donmuş toprağa çakılmış kazıklar. Savunma için mi yoksa gösteriş için mi, henüz söyleyemeyiz."

 agot_nw_ranger_events.2202.desc.intro_e:0 "Kahkaha ve keskin sesler gece havasında yankılanıyor. Savaşçılara mı yoksa budalalara mı ait, zaman gösterecek."

 agot_nw_ranger_events.2202.desc.mid_a:0 "\n\nLiderleri [main_figure.GetHerHis] çadırından çıkıyor; zalim bir sırıtışlı, geniş omuzlu bir [Select_CString(main_figure.IsFemale,'kadın','adam')]. Buradan bile [main_figure.GetHerHis] varlığı huzursuz edici."

 agot_nw_ranger_events.2202.desc.mid_b:0 "\n\nKadınlar ve çocuklar kaba kulübelerin arasında dolaşıyor, ama kampın kalbinde reisleri, özgüven saçarak duruyor."

 agot_nw_ranger_events.2202.desc.mid_c:0 "\n\nBüyük bir ateşin önünde uzun boylu bir figür oturuyor; [main_figure.GetHerHis] savaşçıları yakınına toplanmış. [main_figure.GetSheHe] hak ediyor mu etmiyor mu, sadakatleri açık."

 agot_nw_ranger_events.2202.desc.mid_d:0 "\n\nİlk bakışta sıradan görünüyorlar. Sonra reis konuşuyor ve [main_figure.GetHerHis] sesinde aklımı kemiren bir şey var."

 agot_nw_ranger_events.2202.desc.mid_e:0 "\n\n[main_figure.GetTitledFirstName] bir içki boynuzu kaldırırken izliyorum; [main_figure.GetHerHis] adamları buna kükreyerek karşılık veriyor. Bir güç gösterisi mi... yoksa çaresizlik mi?"

 agot_nw_ranger_events.2202.desc.outro_a:0 "\n\nKarar verme zamanı geldi — bu [Select_CString(main_figure.IsFemale,'kadın','adam')] bir tehlike mi, yoksa [main_figure.GetSheHe] büyük hırsları olmayan sıradan bir yabanıl mı?"

 agot_nw_ranger_events.2202.desc.outro_b:0 "\n\nBir lider, adamları savaşçıya ya da canavara dönüştürebilir. Bu ise ikisi arasında ince bir çizgide yürüyor."

 agot_nw_ranger_events.2202.desc.outro_c:0 "\n\n[main_figure.GetSheHe] Nöbet'e meydan okumayı düşünse de düşünmese de, [main_figure.GetSheHe] çağırırsa [main_figure.GetHerHis] halkı [main_figure.GetHerHim] savaşa kadar izlerdi."

 agot_nw_ranger_events.2202.desc.outro_d:0 "\n\n[main_figure.GetSheHe|U] bizim dostumuz değil, ama bu [main_figure.GetHerHim] düşman mı yapar? Neyi rapor edeceğimize karar vermeliyiz."

 agot_nw_ranger_events.2202.desc.outro_e:0 "\n\nSonsuza dek oyalanamayız. Lord Kumandan gördüklerimizi duymalı."

 agot_nw_ranger_events.2202.a:0 "Bu reis tehlikeli. [main_figure.GetSheHe|U] işi halledilmeli."

 agot_nw_ranger_events.2202.b:0 "[main_figure.GetSheHe|U] bir müttefik değil, ama [main_figure.GetSheHe] gerçek bir tehdit de sayılmaz."

 ranger_report_danger:0 "Lord Kumandan [main_figure.GetTitledFirstNameNoTooltip] karşı savaş ilan edebilir"

 agot_nw_ranger_events.2204.t:0 "Sur'un Ötesindeki Bir Tehdit"

 agot_nw_ranger_events.2204.desc:0 "[first_ranger.GetTitledFirstName]dan endişe verici haberler taşıyan bir ulak geliyor. Birinci Korucu, [main_figure.GetTitledFirstName] araştırdı ve [main_figure.GetHerHim] gerçek bir tehlike olarak buldu. [main_figure.GetHerHis|U] gücü büyüyor ve [main_figure.GetHerHis] hırsları yakında Sur'a yönelebilir. Hiçbir şey yapmazsak, [main_figure.GetHerHis] akıncıları güçlü geldiğinde pişman olabiliriz.\n\nKarar benim — Sur'un ötesine yürüyüp ilk darbeyi mi vururuz, yoksa yerimizi koruyup şimdilik mi izleriz?"

 agot_nw_ranger_events.2204.a:0 "Sur boş durmayacak. Yürüyoruz!"

 agot_nw_ranger_events.2204.b:0 "Bekleyip izleyeceğiz. Zamanı değil."

 agot_nw_ranger_events.2205.t:0 "Dikkatli Bir Göz"

 agot_nw_ranger_events.2205.desc:0 "[first_ranger.GetTitledFirstName]dan [main_figure.GetTitledFirstName] hakkındaki raporunu taşıyan bir ulak geliyor. [Select_CString(main_figure.IsFemale,'kadın','adam')] Nöbet'in dostu olmasa da [main_figure.GetSheHe] yakın bir tehdit gibi görünmüyor. [main_figure.GetHerHis|U] halkı Sur'a saldırmak için toplanmak yerine kendi hayatta kalma derdiyle meşgul.\n\nŞimdilik savaşa gerek yok. Ama onları denetimsiz bırakmak akıllıca mı?"

 agot_nw_ranger_events.2205.a:0 "O halde onları rahat bırakalım."

 agot_nw_ranger_events.2205.b:0 "Pişman olmadan önce ilk darbeyi biz vuralım."

 ranger_laamp_contract_2301_contract:0 "Düşen Korucu"

 ranger_laamp_contract_2301_request:0 "Bu [agot_ranger_mission|E] için düşen bir korucunun ölümünü araştırmanız gerekir"

 ranger_laamp_contract_2301_desc_title:0 "$ranger_laamp_contract_1101_desc_title$"

 ranger_laamp_contract_2301_desc:0 "Lord Kumandan, bizden birinin ölümünü araştırmamızı emretti. Sur'un ötesinde, cansız ve yapayalnız bir korucu bulundu; bedeni net bir hikâye anlatmayan yaralarla kaplı. Yabanıllar mıydı, canavarlar mı, yoksa daha kötüsü mü? Daha fazla can kaybedilmeden gerçeği ortaya çıkarmalıyız."

 agot_nw_ranger_events.2301.t:0 "Cevapsız Bir Ölüm"

 agot_nw_ranger_events.2301.desc.intro_a:0 "Bizden biri Sur'un ötesinde düştü; bedeni soğuğa terk edildi. Lord Kumandan cevaplar istiyor ve onları bulmak bana düşüyor."

 agot_nw_ranger_events.2301.desc.intro_b:0 "Nöbet ölümü her zaman tanımıştır, ama bir kardeş tek başına, net bir sebep olmadan öldüğünde, bu görmezden gelemeyeceğimiz bir gizemdir."

 agot_nw_ranger_events.2301.desc.intro_c:0 "Vahşi doğada bir korucunun bedeni bulundu; cansız ve yaralı. Onu neyin bitirdiğini kimse görmedi ve beni en çok rahatsız eden de bu."

 agot_nw_ranger_events.2301.desc.intro_d:0 "Sur'un ötesinde ölüm her zaman yakındır. Ama bu? Bu basit bir kaza değildi. Canını alan bir şey — ya da biri — vardı."

 agot_nw_ranger_events.2301.desc.intro_e:0 "Nöbet'in bir kardeşi Sur'un ötesinde son buldu ve katili meçhul. Cevapsız dönmeyeceğim."

 agot_nw_ranger_events.2301.desc.outro:0 "\n\nGerçeği ortaya çıkarmanın tek bir yolu var — izi takip etmeli ve nereye gittiğini görmeliyim."

 agot_nw_ranger_events.2301.a:0 "Yola çıkalım."

 agot_nw_ranger_events.2301.b:0 "Tüm kampı daha yakına taşımalıyız."

 agot_nw_ranger_events.2301.tt.destination:0 "Hemen [destination_1.GetBaseNameNoTier]'e yolculuğa başlıyorsun"

 agot_nw_ranger_events.2302.t:0 "Soğuk İşaretler"

 agot_nw_ranger_events.2302.desc.intro_a:0 "Korucunun bulunduğu yere ulaşıyoruz. Bedeni, üzerinden süpürüp geçen soğuk rüzgâr dışında el değmemiş halde, düştüğü yerde hareketsiz yatıyor."

 agot_nw_ranger_events.2302.desc.intro_b:0 "Sahne ürkütücü biçimde sessiz; çizmelerimin altındaki karın gıcırtısı dışında. Korucu önümde yatıyor; son anları bir gizem."

 agot_nw_ranger_events.2302.desc.intro_c:0 "Bedeni kırağıdan sertleşmiş, ama yaralar taze. Onu öldüren neyse buradan uzakta değil."

 agot_nw_ranger_events.2302.desc.intro_d:0 "Cesedin çevresine izler dağılmış — kimileri insan, kimileri değil. İşaretler net bir hikâye anlatmıyor, ama burada bir şey asılı kalıyor."

 agot_nw_ranger_events.2302.desc.intro_e:0 "Kılıcı, kavrayışında donmuş halde yanında duruyor. Ne ile karşılaştıysa, sonuna dek savaşmış."

 agot_nw_ranger_events.2302.desc.mid_a:0 "Silah yok, yağmalanmış teçhizat yok. Yabanıllar olsaydı hiçbir şey almazlar mıydı? Ama onlar değilse... o zaman kim?"

 agot_nw_ranger_events.2302.desc.mid_b:0 "Yaraları derin ve pürüzlü — bir kılıçtan değil, bambaşka bir şeyden. Bir canavar mı? Pençeler mi? Dişler mi?"

 agot_nw_ranger_events.2302.desc.mid_c:0 "Kar, izin çoğunu kaplıyor, ama ipuçları duruyor — bir boğuşma, bir kovalamaca. Kolay ölmemiş."

 agot_nw_ranger_events.2302.desc.mid_d:0 "Soğuk bedenini iyi korumuş. Yaraları hâlâ kanıyor, yüzü hâlâ son acı ifadesinde donmuş."

 agot_nw_ranger_events.2302.desc.mid_e:0 "Yanında diz çöküp sahneyi inceliyorum. Güçlüydü, iyi bir dövüşçüydü; yine de onu yere seren şey bunu kolayca yapmış."

 agot_nw_ranger_events.2302.desc.outro_a:0 "\n\nGerçek, kırağının bir yerinde yatıyor. İzler sonsuza dek kaybolmadan nasıl araştıracağıma karar vermeliyim."

 agot_nw_ranger_events.2302.desc.outro_b:0 "\n\nKolay cevaplar sunulmuyor. Ne olduğunu öğreneceksem geride bırakılan işaretleri takip etmeliyim."

 agot_nw_ranger_events.2302.desc.outro_c:0 "\n\nOnu neyin öldürdüğünü bilmeden ayrılamam. Önümdeki seçimler neyi ortaya çıkaracağımı belirleyecek."

 agot_nw_ranger_events.2302.desc.outro_d:0 "\n\nSur'un daha fazla ölü korucuya ihtiyacı yok. Burada bir tehdit varsa, o bizi bulmadan ben onu bulmalıyım."

 agot_nw_ranger_events.2302.desc.outro_e:0 "\n\nBu yer cevaplar barındırıyor, ama yalnızca nereye bakacağımı bilirsem. Bir sonraki kararımı akıllıca vermeliyim."

 agot_nw_ranger_events.2302.a:0 "Uzaklaşan izleri incele."

 agot_nw_ranger_events.2302.b:0 "Cesette gizli ipuçları ara."

 agot_nw_ranger_events.2302.c:0 "Çevredeki bölgeyi tehlike için keşfet."

 agot_nw_ranger_events_2302.a.tt.win:0 "İzler beklenenden fazlasını açığa çıkarır"

 agot_nw_ranger_events_2302.a.tt.lose:0 "İşaretler çözülemeyecek kadar dağınık"

 agot_nw_ranger_events_2302.b.tt.win:0 "Gizli bir yara, ilk bakışta görülmeyen bir ipucu"

 agot_nw_ranger_events_2302.b.tt.lose:0 "Zaten bilinenlerin ötesinde kayda değer bir şey yok"

 agot_nw_ranger_events_2302.c.tt.win:0 "Keskin bir göz yakınlarda gizlenen bir şeyi seçer"

 agot_nw_ranger_events_2302.c.tt.lose:0 "Ben hiçbir şey görmüyorum, ama bu hiçbir şeyin beni görmediği anlamına gelmez"

 agot_nw_ranger_events.2304.t:0 "Açığa Çıkan Cevap"

 agot_nw_ranger_events.2304.desc.a:0 "İzler hikâyeyi anlatıyor. Öldüğünde yalnız değildi ve katilinin yolu vahşi doğanın derinliklerine gidiyor."

 agot_nw_ranger_events.2304.desc.b:0 "Gizli bir yara, tuhaf bir işaret — bu sıradan bir çarpışma değildi. İşin içinde daha sinsi bir şey var"

 agot_nw_ranger_events.2304.desc.c:0 "İşaretler artık net — korucu avlanmıştı ve avcısı hâlâ yakınlarda gizleniyor olabilir."

 agot_nw_ranger_events.2304.a:0 "Bu bilgi Lord Kumandan'a ulaşmalı."

 agot_nw_ranger_events.2304.b:0 "Bunu daha derin araştırmalıyım."

 agot_nw_ranger_events.2305.t:0 "Net Cevap Yok"

 agot_nw_ranger_events.2305.desc.a:0 "İzler dağınık, zamana karışmış. Buradaki her cevap kara gömülmüş."

 agot_nw_ranger_events.2305.desc.b:0 "Hiçbir gizli ipucu kendini göstermiyor. Korucunun ölümü eskisi kadar gizemli kalıyor."

 agot_nw_ranger_events.2305.desc.c:0 "Aramama rağmen gerçek parmaklarımın arasından kayıyor. Burada bir tehlike asılıysa, görünmez kalıyor."

 agot_nw_ranger_events.2305.a:0 "Bulduğum az şeyi rapor etmeliyim."

 agot_nw_ranger_events.2306.t:0 "Karda Kalanlar"

 agot_nw_ranger_events.2306.artifact.desc:0 "Korucunun ölümünün gerçeği hâlâ ele avuca sığmıyor. Hiçbir iz beni bir katile götürmüyor, hiçbir işaret kimliğini açığa çıkarmıyor.\n\nBölgeyi son bir kez tararken elim karın altında bir şeye değiyor — eski ama işe yarar bir silah. Sorularıma cevap vermeyebilir, ama yine de işe yarar."

 agot_nw_ranger_events.2306.gold.desc:0 "Rüzgâr, sanki başarısızlığımla alay ediyormuş gibi ağaçların arasında uluyor. Korucuyu kim — ya da ne — öldürdüyse arkasında net bir iz bırakmamış.\n\nAyrılmak için dönerken kırağıda bir şey parıldıyor. Altın. Çok değil, ama merak ettirmeye yetiyor — bu bir korucunun para kesesi miydi? Yoksa biri aceleyle mi bırakmıştı?"

 agot_nw_ranger_events.2306.food.desc:0 "Vahşi doğa kolay cevaplar vermiyor. Korucunun katilinden hiçbir iz kalmamış, buzun altına gömülü gizli gerçekler yok.\n\nBölgeyi ararken beklenmedik bir şey buluyorum — kara yarı gömülü, bohçalanmış erzak. Düşen korucuya mı yoksa başka birine mi aitti, boşa gitmeyecek."

 agot_nw_ranger_events.2306.nothing.desc:0 "Bölgenin her santimini didik didik aradım, ama hiçbir cevap kendini göstermiyor. İz yok, ipucu yok — yalnızca soğuk, uçsuz bucaksız beyazlık.\n\nKorucuyu öldüren kimse çoktan gitmiş ve ben yalnızca sorularla ayrılıyorum."

 agot_nw_ranger_events.2306.a:0 "Bulgularımı Lord Kumandan'a rapor etmeliyim."

 ranger_reward_sword:0 "Kış Kılıcı"

 ranger_reward_sword_desc:0 "Sur'un ötesinde bulunan keskin bir kılıç. Etkinliği, kaba işçiliği kadar tartışılmaz."

 ranger_reward_spear:0 "Kış Mızrağı"

 ranger_reward_spear_desc:0 "Sur'un ötesinde bulunan sağlam bir mızrak. Erişimi ölümcül; onunla boy ölçüşebilecek tek şey, işlenmemiş ve yıpranmış sapı."

 ranger_reward_axe:0 "Kış Baltası"

 ranger_reward_axe_desc:0 "Sur'un ötesinde bulunan acımasız bir balta. Ağırlığı ve keskinliği, kaba ve yıpranmış sapı kadar vahşidir."

 ranger_reward_bow:0 "Kış Yayı"

 ranger_reward_bow_desc:0 "Sur'un ötesinde bulunan ölümcül bir yay. Çekimi, kaba ve zamandan yıpranmış gövdesi kadar öldürücüdür."
