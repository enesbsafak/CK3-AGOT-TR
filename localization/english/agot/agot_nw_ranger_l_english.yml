 agot_nw_ranger_events.0026.t.failed:0 "Kılıç Ustası: Keskinlik Köreliyor"

 agot_nw_ranger_events.0026.desc.intro_a:0 "[my_ranger.GetTitledFirstName], keskin bir bakışla yaklaşıyor; eli kılıcının kabzasında hafifçe duruyor, bir tur talim daha için hazır."

 agot_nw_ranger_events.0026.desc.intro_b:0 "[my_ranger.GetTitledFirstName] öne adım atıyor, kılıcı soğuk ışıkta parıldıyor; talim alanında becerilerimi sınamaya hazır."

 agot_nw_ranger_events.0026.desc.intro_c:0 "Kamptaki hava soğuk, ama [my_ranger.GetTitledFirstName] yaklaşırken hiç etkilenmemiş görünüyor; gözlerinde bir meydan okuma parıltısı var. Talim düellosuna hazır."

 agot_nw_ranger_events.0026.desc.intro_d:0 "[my_ranger.GetTitledFirstName] karşımda duruyor, kılıcı çekilmiş, duruşu sağlam. Bir kez daha güç ve beceri sınamasının vakti geldi."

 agot_nw_ranger_events.0026.desc.intro_e:0 "[my_ranger.GetTitledFirstName] sağlam adımlarla yaklaşıyor, kılıcı parıldıyor. Aramızdaki soğuk hava, düellonun beklentisiyle yüklü gibi."

 agot_nw_ranger_events.0026.desc.mid_a:0 "Beni talim alanına götürüyor; birbirimizin gücünü sınarken kılıçlar çarpışıyor. Hareketleri çevik, vuruşları isabetli."

 agot_nw_ranger_events.0026.desc.mid_b:0 "Karşı karşıya geliyoruz, kılıçlar çekik; birbirimizin sınırlarını sınayarak vuruşlarımızı değiş tokuş ederken çarpışan çeliğin sesi havayı dolduruyor."

 agot_nw_ranger_events.0026.desc.mid_c:0 "Düello alanında beni zorluyor; her kılıç savuruşu dayanıklılığımı ve becerimi sınamak için tasarlanmış. Vuruşlarının keskinliği beni tetikte tutuyor."

 agot_nw_ranger_events.0026.desc.mid_d:0 "Düello keskin ve odaklı hareketlerle başlıyor; her vuruş ve savuşturma, becerimi [my_ranger.GetTitledFirstNamePossessiveNoTooltip] ustalığına karşı sınıyor."

 agot_nw_ranger_events.0026.desc.mid_e:0 "Talim alanında çelik çeliğe karşı geliyor; [my_ranger.GetTitledFirstNameNoTooltip] ile talim yaparken her vuruş hesaplı, her hareket bilinçli; birbirimizi sınırlarımıza kadar zorluyoruz."

 agot_nw_ranger_events.0026.desc.success_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] onaylayarak başını sallıyor, gelişmemi fark ediyor. Talim becerimi keskinleştirdi; kendimi daha güçlü ve daha yetkin hissediyorum."

 agot_nw_ranger_events.0026.desc.success_b:0 "\n\nKılıcını kınına koyarken hafifçe gülümsüyor, artan gücümü takdir ediyor. Talim beni daha keskin ve yeteneklerimden daha emin bıraktı."

 agot_nw_ranger_events.0026.desc.success_c:0 "\n\nMemnun bir baş sallamayla [my_ranger.GetTitledFirstNameNoTooltip] geri çekiliyor, kazandığım beceriyi takdir ediyor. Talim, maharetimi güçlendirdi."

 agot_nw_ranger_events.0026.desc.success_d:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] bir baş sallamayla gelişmemi onaylıyor. Talim gücümü inceltti, savaştaki keskinliğimi bileğeledi."

 agot_nw_ranger_events.0026.desc.success_e:0 "\n\nDüello beni daha güçlü bıraktı. [my_ranger.GetTitledFirstNameNoTooltip] geri çekiliyor; eğitimin becerimi ve özgüvenimi nasıl bileğelediğini söylüyor."

 agot_nw_ranger_events.0026.desc.fail_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] hafifçe kaşlarını çatıyor, her zamankinden yavaş olduğumuzu fark ediyor. Talim planlandığı gibi gitmedi; kendimi bitkin ve daha az keskin hissediyorum."

 agot_nw_ranger_events.0026.desc.fail_b:0 "\n\nKılıcını indiriyor, bakışlarında hayal kırıklığı var. Talim soluğumu kesti; gücüm bileğelenmek yerine azalmış gibi."

 agot_nw_ranger_events.0026.desc.fail_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], gözlerinde endişeyle geri çekiliyor. Düello bana verdiğinden fazlasını almış gibi; beni yorgun ve güçsüz bıraktı."

 agot_nw_ranger_events.0026.desc.fail_d:0 "\n\nKaşlarını çatarak geri çekiliyor; düellonun beni güçlendirmekten çok yorduğunu söylüyor. Talim bedelini ödetti ve becerim körelmiş gibi."

 agot_nw_ranger_events.0026.desc.fail_e:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], tempoya yetişmekte zorlanırken beni izliyor. Talim gücümü tüketti; kendimi öncesinden daha zayıf hissediyorum."

