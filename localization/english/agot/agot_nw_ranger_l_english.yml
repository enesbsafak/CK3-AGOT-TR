 agot_nw_ranger_events.0027.desc.intro_a:0 "[my_ranger.GetTitledFirstName], kamp ateşinin gölgelerine adım atıyor; konuşmayı seçene dek varlığı zar zor fark ediliyor. Bakışları sakindir, görevi hakkında rapor vermeye hazırdır."

 agot_nw_ranger_events.0027.desc.intro_b:0 "[my_ranger.GetTitledFirstName], gecenin bir parçasıymış gibi sessizce kampta süzülerek yaklaşıyor. Yüz ifadesi okunmuyor, ama çevresindeki hava ağırlaşmış gibi."

 agot_nw_ranger_events.0027.desc.intro_c:0 "Kamp ateşinin titrek ışığı yüzüne gölgeler düşürürken [my_ranger.GetTitledFirstName] öne adım atıyor. Yaydığı fısıltılar hakkındaki raporu hazır."

 agot_nw_ranger_events.0027.desc.intro_d:0 "[my_ranger.GetTitledFirstName] karanlıktan beliriyor; sessiz ve soğukkanlı. Hareket edişinde rahatsız edici bir şey var; sanki gölgelerin ta kendisi kulağına sırlar fısıldamış."

 agot_nw_ranger_events.0027.desc.intro_e:0 "[my_ranger.GetTitledFirstName] dönüyor; hareketleri sessiz ama kararlı, sanki gecenin ta kendisi ona yapışmış. Görevi tamamlandı ve konuşmaya hazır bekliyor."

 agot_nw_ranger_events.0027.desc.mid_a:0 "Kampın içinde gezindi; her sözcükle korku ve saygının büyümesini sağlayarak gücümden ve kudretimden hikâyeler örerken sesi alçaktı."

 agot_nw_ranger_events.0027.desc.mid_b:0 "Adamların arasında yürüdü; her hikâyenin orman yangını gibi yayılmasını, korku ve hayranlık ekeceğini umarak maharetimi fısıltılı bir tonla anlattı."

 agot_nw_ranger_events.0027.desc.mid_c:0 "Kampın rutin işleri arasındaki sessiz anlarda, gücüm hakkında karanlık hikâyeler anlattı; karşısına çıkılmaması gereken bir lider resmi çizdi."

 agot_nw_ranger_events.0027.desc.mid_d:0 "Korku sözcüklerini doğru kulaklara ulaştırdığından emin oldu; beni hem korkulan hem de saygı duyulan bir figür olarak özenle tasvir etti."

 agot_nw_ranger_events.0027.desc.mid_e:0 "Kampın içinde bir gölge gibi hareket etti; gücümün hikâyelerini paylaştı, her sözcük adamların arasında bir korku ve hayranlık duygusu yeşertmek için tasarlanmıştı."

 agot_nw_ranger_events.0027.desc.success_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], hikâyelerinin kök saldığını bildiriyor. Adamlar adımı fısıltılı bir tonla anıyor ve saygı, korkunun keskinliğiyle birlikte geliyor."

 agot_nw_ranger_events.0027.desc.success_b:0 "\n\nBelli belirsiz bir gülümsemeyle [my_ranger.GetTitledFirstNameNoTooltip], kampın artık benden daha temkinli olduğunu açıklıyor. Korku yerleşti ve onunla birlikte saygı da büyüdü."

 agot_nw_ranger_events.0027.desc.success_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] işinden memnun şekilde başını sallıyor. Kamp fısıltılarla dolu ve itibarım artık dehşet ve güç üzerine kurulu."

 agot_nw_ranger_events.0027.desc.success_d:0 "\n\nHikâyeler iyi yayıldı ve [my_ranger.GetTitledFirstNameNoTooltip], korkunun artık kampta asılı durduğunu, adıma bir gölge gibi işlendiğini doğruluyor."

 agot_nw_ranger_events.0027.desc.success_e:0 "\n\n[my_ranger.GetTitledFirstNamePossessiveNoTooltip] görevi başarılı oldu. Adamlar artık bana korku ve saygı merceğinden bakıyor; adım temkinle anılıyor."

 agot_nw_ranger_events.0027.desc.fail_a:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] başını öne eğiyor, sözlerinin etkisiz kaldığını itiraf ediyor. Adamlar etkilenmedi ve adım korku uyandırmıyor."

 agot_nw_ranger_events.0027.desc.fail_b:0 "\n\nBir iç çekişle [my_ranger.GetTitledFirstNameNoTooltip], adamların hikâyelerine pek kulak asmadığını bildiriyor. Kamp etkilenmedi ve bana duyulan saygı zayıfladı."

 agot_nw_ranger_events.0027.desc.fail_c:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip] kaşlarını çatıyor, hikâyelerin tutunmadığını itiraf ediyor. Adamlar, varlığımı eskisinden daha az önemsiyor gibi."

 agot_nw_ranger_events.0027.desc.fail_d:0 "\n\nBaşını sallıyor, sözlerinin yok sayıldığını anlatıyor. Gücümün hikâyeleri yayılmadı ve kamp, artan saygıya dair hiçbir belirti göstermiyor."

 agot_nw_ranger_events.0027.desc.fail_e:0 "\n\n[my_ranger.GetTitledFirstNameNoTooltip], korku aşılama girişiminin başarısız olduğunu bildiriyor. Adım, bir zamanlar taşıdığı ağırlığı taşımıyor ve saygı azaldı."

 agot_nw_ranger_events.0027.a.success:0 "Kamp, burada asıl gücün kimin elinde olduğunu biliyor."

