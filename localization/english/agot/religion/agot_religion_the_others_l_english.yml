l_english:

 the_others_religion:0 "Uzak Kuzeyin Ak Gölgeleri"

 the_others_religion_adj:0 "Ak Gezenler"

 the_others_religion_adherent:0 "Yatıştıran"

 the_others_religion_adherent_plural:0 "Yatıştıranlar"

 the_others_religion_desc:0 "Uzak Kuzey'de, Daimi Kış Toprakları'ndaki insan diyarlarının ötesinde, ibadet daha soğuk bir doğaya sahiptir; Buz ve Ölüm Tanrıları ile Varlıkları çevresinde yoğunlaşmıştır."

 cold_gods:0 "Daimi Kışın Soğuk Tanrıları"

 cold_gods_adj:0 "Daimi Kış"

 cold_gods_adherent:0 "Yatıştıran"

 cold_gods_adherent_plural:0 "Yatıştıranlar"

 cold_gods_desc:0 "İnsan, dev ve orman çocuklarının tanrıları ve inançları olduğu gibi, Ak Gezenlerin de vardır. Onların ibadeti zalimcedir, tüm vahşetiyle kışa adanmıştır."

 cold_gods_wildling:0 "Zalim Kışın Soğuk Tanrıları"

 cold_gods_wildling_adj:0 "Soğuk Tanrılar"

 cold_gods_wildling_adherent:0 "Yatıştıran"

 cold_gods_wildling_adherent_plural:0 "Yatıştıranlar"

 cold_gods_wildling_desc:0 "Bazıları doğaya, bazıları göklerdeki tanrılara ya da ateş kalplerine taparken, ölümün sert soğuğunu hissetmiş olanlar gerçek tek tanrıların, bir gün yeniden güneye yürüyüp Uzun Gece'yi yeniden getirecek Daimi Kışın Soğuk Tanrıları olduğunu bilir."
