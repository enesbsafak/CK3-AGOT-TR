### TODO NOT-IN-ST: rhllor_hyrkoon_desc [AGOT: In the Bone Mountains, Azor Ahai is known as Hyrkoon the Hero. It is from him that the Patrimony of Hyrkoon was born, and from him that the Great Fathers and the warrior women of the last three city-bastions descend. They understand the price of war and will meet it with Fire and Blade, with Rubies and Iron.]
 rhllor_hyrkoon_desc:0 "In the Bone Mountains, Azor Ahai is known as Hyrkoon the Hero. It is from him that the Patrimony of Hyrkoon was born, and from him that the Great Fathers and the warrior women of the last three city-bastions descend. They understand the price of war and will meet it with Fire and Blade, with Rubies and Iron."
