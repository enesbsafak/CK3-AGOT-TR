l_english:

 the_rhllor_religion:0 "Ateşin Kalbi"

 the_rhllor_religion_adj:0 "R'hllor"

 the_rhllor_religion_adherent:0 "R'hllorcu"

 the_rhllor_religion_adherent_plural:0 "R'hllorcular"

 the_rhllor_religion_desc:0 "Essos'un Uzak Doğusu'nda ortaya çıkan R'hllor'a, Ateşin Kalbi'ne tapınma bilinen dünyaya yayılmıştır. Müritler, R'hllor ile Büyük Öteki arasındaki hesaplaşmaya dünyayı hazırlamayı ve bu sözü yaymayı kendilerine görev bilir."

 rhllor_asshai:0 "Duman ve Gölgenin Kalbi"

 rhllor_asshai_adj:0 "Gölgenin Kalbi"

 rhllor_asshai_adherent:0 "Azorcu"

 rhllor_asshai_adherent_plural:0 "Azorcular"

 rhllor_asshai_desc:0 "Uzak Doğu'da R'hllor'a tapınma, Asshai çevresinde ve Azor Ahai'nin yeniden doğuşuna dair kadim kehanetler üzerinde yoğunlaşmıştır. Ateşin Kalbi'nin bu kolu, Asshai'nin kendisinin karanlık yönlerini ve orayı yurt edinen Gölge Bağlayıcılarını bünyesinde barındırır."

 rhllor_fc:0 "R'hllor"

 rhllor_fc_adj:0 "R'hllor"

 rhllor_fc_adherent:0 "R'hllorcu"

 rhllor_fc_adherent_plural:0 "R'hllorcular"

 rhllor_fc_desc:0 "Işık Efendisi ve Ateşin Kalbi olan R'hllor'a tapınma Essos'a yayılmıştır ve müritleri her Serbest Şehir'de bulunabilir. İbadet edenler, efendilerinden görüler bahşedilmesini umarak ateşlerin çevresinde toplanır. Tarikat, Volantis'teki Baş Rahip tarafından yönetilir."

 rhllor_fots:0 "Kızıl Tanrı"

 rhllor_fots_adj:0 "Kızıl Tanrı"

 rhllor_fots_adherent:0 "R'hllorcu"

 rhllor_fots_adherent_plural:0 "R'hllorcular"

 rhllor_fots_desc:0 "R'hllor'a tapınma Serbest Şehirler'den Westeros'a yayılırken, Doğu'nun temel geleneklerini koruyarak Westeros kültürüyle kaynaştı. Şövalyeler artık Yediler'in önünde yemin etmek yerine bir mangalın önünde yemin edip Kızıl Tanrı'ya bağlılık sözü veriyor."

 rhllor_hyrkoon:0 "Ateş ve Kılıcın Kalbi"

 rhllor_hyrkoon_adj:0 "Kılıcın Kalbi"

 rhllor_hyrkoon_adherent:0 "Kahramancı"

 rhllor_hyrkoon_adherent_plural:0 "Kahramancılar"

 rhllor_hyrkoon_desc:0 "Kemik Dağları'nda Azor Ahai, Kahraman Hyrkoon olarak bilinir. Hyrkoon Mirası ondan doğdu ve Büyük Babalar ile son üç şehir-kalenin savaşçı kadınları onun soyundan gelir. Onlar savaşın bedelini bilir ve onun karşısına Ateş ve Kılıçla, Yakutlar ve Demirle çıkarlar."
