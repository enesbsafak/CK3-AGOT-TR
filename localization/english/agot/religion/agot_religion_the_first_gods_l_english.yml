### TODO NOT-IN-ST: fg_pan_sisters_desc [AGOT: Before the arrival of the Andals and their worship of the Seven Who Are One, the native peoples of the Three Sisters worshipped their own gods, prime amongst them the Lady of the Waves and her mate, the Lord of the Skies. She is revered as a lustful and demanding goddess, whose trysts with her mate are thought to cause the storms that plague the region.\n\nShe is known to demand her followers cast those born stunted or deformed into the sea, returning them to her domain. However, her demanding nature is not without benevolence — or love for her worshippers. Those born with the mark of webbing between their digits are rewarded with her favor freely.]
 fg_pan_sisters_desc:0 "Before the arrival of the Andals and their worship of the Seven Who Are One, the native peoples of the Three Sisters worshipped their own gods, prime amongst them the Lady of the Waves and her mate, the Lord of the Skies. She is revered as a lustful and demanding goddess, whose trysts with her mate are thought to cause the storms that plague the region.\n\nShe is known to demand her followers cast those born stunted or deformed into the sea, returning them to her domain. However, her demanding nature is not without benevolence — or love for her worshippers. Those born with the mark of webbing between their digits are rewarded with her favor freely."
