### TODO NOT-IN-ST: fg_pan_bronze_desc [AGOT: The First Men did not originally worship the Old Gods; that was only after the Pact between Man and Children. They originally worshipped their own gods, gods much more knowable and similar to themselves. The Chiefs of these were the Gods of Bronze and Hoof, who led the First Men to Westeros from Essos.]
 fg_pan_bronze_desc:0 "The First Men did not originally worship the Old Gods; that was only after the Pact between Man and Children. They originally worshipped their own gods, gods much more knowable and similar to themselves. The Chiefs of these were the Gods of Bronze and Hoof, who led the First Men to Westeros from Essos."
