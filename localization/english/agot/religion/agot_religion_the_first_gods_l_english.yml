l_english:

 the_first_gods_religion:0 "İnsanların İlk Tanrıları"

 the_first_gods_religion_adj:0 "İlk Tanrılar"

 the_first_gods_religion_adherent:0 "Takipçi"

 the_first_gods_religion_adherent_plural:0 "Takipçiler"

 the_first_gods_religion_desc:0 "Akit'in dövülmesinden önce, İlk İnsanlar kendi tanrılarına — Gümüş Deniz çevresindeki otlaklara yakın asıl yurtlarından getirdikleri tanrılara — taparlardı. Bu İlk Tanrılar'a tapınma büyük ölçüde ortadan kalktı, ancak yine de Westeros'ta ve ötesinde bazı müritler bulunabilir."

 fg_pan_bronze:0 "Tunç ve Toynak Tanrıları"

 fg_pan_bronze_adj:0 "Tunç Tanrılar"

 fg_pan_bronze_adherent:0 "Takipçi"

 fg_pan_bronze_adherent_plural:0 "Takipçiler"

 fg_pan_bronze_desc:0 "İlk İnsanlar başlangıçta Eski Tanrılar'a tapmıyorlardı; bu yalnızca İnsan ile Orman Çocukları arasındaki Akit'ten sonraydı. Başlangıçta kendi tanrılarına, çok daha bilinebilir ve kendilerine benzeyen tanrılara taparlardı. Bunların başlıcaları, İlk İnsanları Essos'tan Westeros'a götüren Tunç ve Toynak Tanrıları'ydı."

 fg_pan_sisters:0 "Dalga ve Gökyüzü Tanrıları"

 fg_pan_sisters_adj:0 "Kız Kardeşlerin Tanrıları"

 fg_pan_sisters_adherent:0 "Takipçi"

 fg_pan_sisters_adherent_plural:0 "Takipçiler"

 fg_pan_sisters_desc:0 "Andalların ve Yedi Olan'a tapınmalarının gelişinden önce, Üç Kız Kardeş'in yerlileri kendi tanrılarına taparlardı; bunların başında Dalgaların Hanımı ve eşi Göklerin Efendisi gelirdi. O, şehvetli ve talepkâr bir tanrıça olarak yüceltilir; eşiyle olan buluşmalarının, bölgeyi rahatsız eden fırtınalara yol açtığı düşünülür.\n\nOnun, müritlerinden cüce veya sakat doğanları denize atarak kendi diyarına geri göndermelerini istediği bilinir. Ancak talepkâr doğası iyilikten — ya da müritlerine duyduğu sevgiden — yoksun değildir. Parmak aralarında perde işaretiyle doğanlar, onun lütfuna bedava kavuşur."

 fg_pan_elenei:0 "Deniz ve Rüzgâr Tanrıları"

 fg_pan_elenei_adj:0 "Fırtına Tanrıları"

 fg_pan_elenei_adherent:0 "Takipçi"

 fg_pan_elenei_adherent_plural:0 "Takipçiler"

 fg_pan_elenei_desc:0 "İlk İnsanların tanrıları çok ve çeşitliydi, ancak Gemi Kıran Körfezi çevresinde deniz tanrısı ve karısı rüzgâr tanrıçası başı çeker. Çünkü kızları Elenei, Durran Tanrıtası ile evlendi ve Durrandonlar ile onların soyu ondan geldiklerini iddia eder."

 fg_pan_merling:0 "Deniz Kızı Sarayı Tanrıları"

 fg_pan_merling_adj:0 "Deniz Kızı Tanrıları"

 fg_pan_merling_adherent:0 "Takipçi"

 fg_pan_merling_adherent_plural:0 "Takipçiler"

 fg_pan_merling_desc:0 "Deniz Kızı Kralı, birçok toprakta ve birçok halk tarafından tapınılan bir tanrıdır, ancak İlk İnsanlarla ilişkisi diğerlerinden daha yakındı. Karısını Deniz Kızı Kraliçesi Ursula Upcliff'te bulduğu yer, özellikle Upcliff Hanesi olmak üzere İlk İnsanların arasındaydı."

 fg_pan_sni:0 "Kar ve Buz Tanrıları"

 fg_pan_sni_adj:0 "Kar Tanrıları"

 fg_pan_sni_adherent:0 "Takipçi"

 fg_pan_sni_adherent_plural:0 "Takipçiler"

 fg_pan_sni_desc:0 "Buz nehirlerinin aktığı uçsuz bucaksız donmuş düzlüklerde halk, Akit'ten çok önceye dayanan kar ve buz tanrılarına tapar."

 fg_pan_garth:0 "Yeşillik Tanrısı"

 fg_pan_garth_adj:0 "Yeşil Tanrı"

 fg_pan_garth_adherent:0 "Başparmak"

 fg_pan_garth_adherent_plural:0 "Başparmaklar"

 fg_pan_garth_desc:0 "Garth Yeşil, Garth Yeşilel, Garth Yeşilsaç — efsanevi bu adam birçok adla bilinir ve Menzil'in ve ötesinin birçok hanesi ondan geldiklerini iddia eder. Kimilerinin İlk Kral olarak gördüğü bu kişiyi, kimileri İlk İnsanların baş tanrısı olarak görür. Ona tapanlar Yeşillik'i yaymayı amaçlar."

 fg_unknown:0 "Bilinmiyor"

 fg_unknown_adj:0 "Bilinmiyor"

 fg_unknown_adherent:0 "Bilinmiyor"

 fg_unknown_adherent_plural:0 "Bilinmiyor"

 fg_unknown_desc:0 "Bu inanç senin için bir muamma."
