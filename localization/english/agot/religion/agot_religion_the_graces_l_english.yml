l_english:

 the_graces_religion:0 "Ghis'in Zarafetleri"

 the_graces_religion_adj:0 "Zarafetler"

 the_graces_religion_adherent:0 "Zarif"

 the_graces_religion_adherent_plural:0 "Zarif"

 the_graces_religion_desc:0 "Valyria'nın ve Özgür Topraklar'ının yükselişinden çok önce, disiplin ve kanla bir imparatorluk kuran Ghis ve Tanrılarıydı. İmparatorluğun çöküşüne ve dillerini kaybetmelerine rağmen, Ghiscari Tanrıları varlığını sürdürdü ve hatta nefret ettikleri düşmanlarının sonunu gördü."

 sc_harpy:0 "Harpinin Soyları"

 sc_harpy_adj:0 "Harpi"

 sc_harpy_adherent:0 "Zarif"

 sc_harpy_adherent_plural:0 "Zarif"

 sc_harpy_desc:0 "Büyük Grazdan'ın zamanından beri, İmparatorluğu ve Ghiscarileri izleyen ve koruyan Harpi olmuştur. İmparatorluğun ve Ghis'in kendisinin çöküşünden sonra bile, Harpi hâlâ halkın üzerinde duruyor."

 sc_spear:0 "Mızrakların Leydisi'nin Soyları"

 sc_spear_adj:0 "Mızrakların Leydisi"

 sc_spear_adherent:0 "Mızraklı"

 sc_spear_adherent_plural:0 "Mızraklılar"

 sc_spear_desc:0 "Ghis'in küçük tanrıçalarından biri olan Mızrakların Leydisi, eski İmparatorluk topraklarında Lekesizler ve diğer profesyonel asker güçleri tarafından büyük ölçüde benimsenmiştir. O onların koruyucusu ve hamisidir; her şey kaybedilip alınmış olsa bile, o onların yanında olacaktır."
