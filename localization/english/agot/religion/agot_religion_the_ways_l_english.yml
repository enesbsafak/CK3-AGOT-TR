l_english:

 the_ways_religion:0 "Deniz ve Fırtınanın Yolları"

 the_ways_religion_adj:0 "Yollar"

 the_ways_religion_adherent:0 "Denizdoğumlu"

 the_ways_religion_adherent_plural:0 "Denizdoğumlu"

 the_ways_religion_desc:0 "Deniz ve Fırtınanın Yolları Westeros'ta uzun süredir vardır ve birçokları bunların bazı İlk Tanrı kültlerinin kalıntıları olduğuna inansa da, Yollar'ın uygulamaları ve inançları, Güney ve Doğu'nun karanlık Tanrılarının Şantıları'na ve Kiliseleri'ne çok daha yakındır. Yollar'ın insanın Westeros'a gelişinden çok öncesine dayandığına dair kanıtlar vardır ve bunun karanlık imaları dehşet ve korku ilham eder."

 drowned_god:0 "Boğulmuş Tanrı'nın Yolu"

 drowned_god_adj:0 "Boğulmuş Tanrı"

 drowned_god_adherent:0 "Demirdoğan"

 drowned_god_adherent_plural:0 "Demirdoğan"

 drowned_god_desc:0 "Boğulmuş Tanrı, Eski Tanrılar Akidi'nden ve Andalların İnancı'ndan sağ çıkmış olarak Demir Adamların tanrısıdır. Din, ölü tanrıyı yüceltir; müntesipler su altındaki salonlarında ona katılmayı umar, çünkü ölen bir daha asla ölmez, daha sert ve daha güçlü olarak yeniden yükselir."

 fots_drowned:0 "Sekizlerin İnancı"

 fots_drowned_adj:0 "Sekizlerin İnancı"

 fots_drowned_adherent:0 "Tuzlu Sadık"

 fots_drowned_adherent_plural:0 "Tuzlu Sadık"

 fots_drowned_desc:0 "Sekizler'in İnancı, Boğulmuş Tanrı'nın Yolu ile Yediler'in İnancı'nı birleştirmeye çalışan II. Harmund Hoare tarafından kuruldu. Boğulmuş Tanrı'nın, İlahi Olan'ın yalnızca bir başka yönü olduğu söylenirdi."

 storm_god:0 "Fırtına Tanrısı'nın Yolu"

 storm_god_adj:0 "Fırtına Tanrısı"

 storm_god_adherent:0 "Fırtınadoğan"

 storm_god_adherent_plural:0 "Fırtınadoğan"

 storm_god_desc:0 "Fırtına Tanrısı'nın Yolu, Boğulmuş Tanrı'nın ezeli düşmanı Fırtına Tanrısı'na tapınma uygulamasıdır."
