l_english:

 the_seven_religion:0 "Andalların İnancı"

 the_seven_religion_adj:0 "Yedilerin İnancı"

 the_seven_religion_adherent:0 "Sadık"

 the_seven_religion_adherent_plural:0 "Sadık"

 the_seven_religion_desc:0 "Andalların İnancı, seçilmiş halk olan Andallara kendini yedi ayrı yönüyle göstererek onları yüceliğe yönlendiren tek bir tanrının, tek bir ilahi varlığın varlığı inancı etrafında şekillenmiş inançların bütünüdür."

 fots_stars:0 "Yıldızların İnancı"

 fots_stars_adj:0 "Yıldızların İnancı"

 fots_stars_adherent:0 "Sadık"

 fots_stars_adherent_plural:0 "Sadık"

 fots_stars_desc:0 "Yedi Olan kendini Andallara ve kralları Tepeli Hugor'a gösterdi. Andallara demir işlemeyi öğrettiler, onlara Şövalyelik törelerini verdiler ve onları Westeros'un gün batımı topraklarını fethetmekle görevlendirdiler."

 fots_seven:0 "Yedilerin İnancı"

 fots_seven_adj:0 "Yedilerin İnancı"

 fots_seven_adherent:0 "Sadık"

 fots_seven_adherent_plural:0 "Sadık"

 fots_seven_desc:0 "Yediler'in İnancı, Westeros'un hâkim dinidir. İnsanların ve toprakların çoğunluğu İnançlılar arasında sayılır ve Andalların, Rhoynarların ve İlk İnsanların tüm Kralları, üye olmanın yanı sıra Yüce Septon tarafından taçlandırılmaya çalışmıştır. İnanç, Yedi Uçlu Yıldız'da ortaya konan vahiy ve hakikatler üzerine kuruludur ve En Dindarlar ile Yüce Septon'un rehberliğinde yönetilir."

 fots_blessed:0 "Kutsanmışların İnancı"

 fots_blessed_adj:0 "Kutsanmışların İnancı"

 fots_blessed_adherent:0 "Sadık"

 fots_blessed_adherent_plural:0 "Sadık"

 fots_blessed_desc:0 "Kutsanmış Baelor, Demir Taht'a oturan en dindar adamdı. Yüce Septon'a yeni bir makam olarak Büyük Ayin Evi'ni inşa ettiren ve diyarı en sadık yollarına yönlendiren oydu. Onun izinden gidenler, büyük eserlerinin Yediler adına sürmesini görmek ister."

 fots_sword:0 "Kılıcın İnancı"

 fots_sword_adj:0 "Kılıcın İnancı"

 fots_sword_adherent:0 "Sadık"

 fots_sword_adherent_plural:0 "Sadık"

 fots_sword_desc:0 "Andallar Westeros'a geldiklerinde ateş ve demirle, kılıç ve yıldızla geldiler. O zamandan beri İnançlılar yanlış yönlendirildi, çünkü Yüce Septon ve En Dindarlar artık siyasi ve yabancı baskılara boyun eğiyor. İnanç, Yediler'in lütfunu ancak Kılıç aracılığıyla yeniden kazanacaktır."

 fots_pure:0 "Saf Olanların İnancı"

 fots_pure_adj:0 "Saf Olanların İnancı"

 fots_pure_adherent:0 "Sadık"

 fots_pure_adherent_plural:0 "Sadık"

 fots_pure_desc:0 "Eski Tanrılar'ın ve Boğulmuş Tanrı'nın varlığı İnançlıları lekelemiştir. Çünkü Baba Tepeli Hugor ile konuştuğunda, Westeros topraklarının yalnızca Andallara ve İnançlılara ait olduğunu söylemedi mi? İnançlılar, bu sapkınlıkların ve küfürlerin bulaşısını reddederek Yediler'in onlar için planladıklarını ancak bu şekilde başarabilir."

 fots_oldnew:0 "Eski ve Yeni İnanç"

 fots_oldnew_adj:0 "Eski ve Yeni İnanç"

 fots_oldnew_adherent:0 "Sadık"

 fots_oldnew_adherent_plural:0 "Sadık"

 fots_oldnew_desc:0 "Andallar gelmeden çok önce, Eski Tanrılar ve onların Ak Yüzlü Ağaçları buradaydı. Ancak Eski ve Yeni Tanrılar karşıt değildir, ayrı tanrılar da değildir. Eski Tanrılar, Yedi Olan'ın kendilerini tanıtmadan önce insanlarla konuşma biçimiydi ve Ak Yüzlü Ağaçlar onlar için her zaman kutsal olmuştur."

 fots_sands:0 "Kumların İnancı"

 fots_sands_adj:0 "Kumların İnancı"

 fots_sands_adherent:0 "Sadık"

 fots_sands_adherent_plural:0 "Sadık"

 fots_sands_desc:0 "Dorne, dış gruplarla ilişkilerinde her zaman eşsiz olmuştur ve İnanç da farklı değildir. Yetimler hariç neredeyse tüm Dorneli İnançlılar arasında olsa da, diğerleri gibi En Dindarlar'ın veya Yüce Septon'un kural ve yönetmeliklerine asla boyun eğmemişlerdir. Yediler'e taparlar, ancak sırf Menzilli bir Yüce Septon öyle söyledi diye yaşam tarzlarını, Dorneli yaşam tarzını bir kenara atmazlar. Ve böylece Dorneliler En Dindarlar'dan koptu ve Yedi Olan'ı kendi yollarınca izleyecekler."

 fots_axe:0 "Baltanın İnancı"

 fots_axe_adj:0 "Baltanın İnancı"

 fots_axe_adherent:0 "Sadık"

 fots_axe_adherent_plural:0 "Sadık"

 fots_axe_desc:0 "Andalların, Andalos tepelerine gelmeden önce Balta topraklarında ortaya çıktığı söylenir. Geri dönenler, yabancı etkilerle lekelenmemiş, aslına daha yakın olan kendi İnanç markalarını da beraberlerinde getirdiler."

 fots_scourged:0 "Kırbaçlananların İnancı"

 fots_scourged_adj:0 "Kırbaçlananların İnancı"

 fots_scourged_adherent:0 "Sadık"

 fots_scourged_adherent_plural:0 "Sadık"

 fots_scourged_desc:0 "Büyük Qarlon, Essos'taki son kralken, kıtadaki tüm Andalları birleştireceğini söyledi. Ne yazık ki seferleri ateşle sona erdi, ancak hayatta kalanlar, Yedi Olan'ın yanı sıra Tüm Andalların Kralı efsanesine tapınmaya başladı."

 highsepton:0 "Yüce Septon"

 nick_high_septon:0 "Yüce Septon"

