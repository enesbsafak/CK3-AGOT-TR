l_english:

 the_churches_religion:0 "Karanlık Tanrıların Kiliseleri"

 the_churches_religion_adj:0 "Kiliseler"

 the_churches_religion_adherent:0 "Sorgulayan"

 the_churches_religion_adherent_plural:0 "Sorgulayanlar"

 the_churches_religion_desc:0 "Altın İmparatorluk'un ötesindeki topraklar karanlık ve dehşet vericidir; kiliseleri de farklı değildir. Bu kiliselerin tanrıları ve felsefeleri gizemli, kasvetli ve ürkütücüdür."

 eldritch_fishgod:0 "Balık Tanrılar Kilisesi"

 eldritch_fishgod_adj:0 "Balık Tanrıları"

 eldritch_fishgod_adherent:0 "Balık Adam"

 eldritch_fishgod_adherent_plural:0 "Balık Adamlar"

 eldritch_fishgod_desc:0 "Balık Tanrılar Kilisesi, Bin Ada'daki hâkim ibadet biçimidir. Oradaki adamların balığa benzediği, yeşil tenli, perde parmaklı ve keskin dişli olduğu söylenir. Dalgaların derinliklerinde yaşadığı söylenen dehşet verici balıklara benzer tanrılara taparlar ve hizmetkârlarıyla rüyalar aracılığıyla konuşurlar."

 eldritch_bloodgod:0 "Kansızlar Kilisesi"

 eldritch_bloodgod_adj:0 "Kansız"

 eldritch_bloodgod_adherent:0 "Kansız adam"

 eldritch_bloodgod_adherent_plural:0 "Kansız adamlar"

 eldritch_bloodgod_desc:0 "Beş Kale'nin ötesindeki Kansız Adamlar tapınışı, topraklarının derinliklerine hapsedilmiş canavarımsı bir tanrı olan Kansız'a odaklanır. Tutsaklığına rağmen müritleriyle rüyalarında konuşur. Bir gün onu özgür bırakmayı umarlar."

 eldritch_yellow:0 "Sarı İşaret Kilisesi"

 eldritch_yellow_adj:0 "Sarı İşaret"

 eldritch_yellow_adherent:0 "İşaretçi"

 eldritch_yellow_adherent_plural:0 "İşaretçiler"

 eldritch_yellow_desc:0 "Derinlerde zincirlenmiş Karanlık Tanrılar'dan bir diğeri. Tüm tarihin büyük bir gözlemcisi, her şeyi bilen biri olduğu söylenir ve bazen Carcosa'da bir Kral olarak anılır. Onun adına karanlık ve dehşet verici işler sürdürülür ve sarı işaret, gerçek adını müritleri dışında herkesten gizler; ona bakan başka herkesi lanetler."

 eldritch_deep_dreams:0 "Bilinmeyen Rüyalar Kilisesi"

 eldritch_deep_dreams_adj:0 "Bilinmeyen Rüyalar"

 eldritch_deep_dreams_adherent:0 "Enohçı"

 eldritch_deep_dreams_adherent_plural:0 "Enohçılar"

 eldritch_deep_dreams_desc:0 "Derinlerde, kadim ve devasa bir şehirde, ölü bir tanrı rüya görür. Bu rüyalar müritlerine dokunur ve onları ahlakın ve aklın zincirlerini, bağlarını kırmaya yönlendirir — ya da Bilinmeyen Rüyalar Kilisesi böyle iddia eder."

 eldritch_starry_wisdom:0 "Yıldızlı Hikmet Kilisesi"

 eldritch_starry_wisdom_adj:0 "Yıldızlı Hikmet"

 eldritch_starry_wisdom_adherent:0 "Sorgulayan"

 eldritch_starry_wisdom_adherent_plural:0 "Sorgulayanlar"

 eldritch_starry_wisdom_desc:0 "Kan Taşı İmparatoru, Yıldızlı Hikmet Kilisesi'nin kurucusuydu, ancak Kilise kısa sürede onu aştı. Bugün neredeyse bilinen dünyanın her yerinde bulunabilir; ancak öğretilerini izleyenler ketum ve seçicidir. Bilinen şu ki, Yeen'inkinden, Kurbağa Taşı'ndan, Asshai'den hatta Deniz Taşı Koltuk'tan farksız, büyük bir yağlı siyah taş parçasına taparlar. Bu taşın, gerçekliğin asıl doğasını ve birçok insanın aklını dağıtan büyük kozmik ilkeleri açığa çıkardığı söylenir."

 eldritch_leng:0 "Kadim Büyükler Kilisesi"

 eldritch_leng_adj:0 "Kadim Büyükler"

 eldritch_leng_adherent:0 "Rüya Gören"

 eldritch_leng_adherent_plural:0 "Rüya Görenler"

 eldritch_leng_desc:0 "Tanrılar soyut varlıklar ya da yabancı kavramlar değildir; hayır, Kadim Büyükler adanın kendisinin altında yatar. Bu başkalarınca da biliniyordu, çünkü Altın İmparatorluk — adı lanet olsun — geldiğinde tanrıların girişlerini mühürledi. Şimdi, sevinçle, Tanrı-İmparatoriçe onları yeniden açtı ve Kadim Büyükler ile Lengii halkı arasındaki bağlantıyı bir kez daha kurdu!"
