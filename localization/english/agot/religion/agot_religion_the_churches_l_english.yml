### TODO NOT-IN-ST: eldritch_leng_desc [AGOT: The gods are not intangible aspects or foreign concepts; no, the Great Old Ones lie below the island itself. This was known to others, for when the Golden Empire, curse its name, came, they sealed the entrances to the gods. Now, joyfully, the God-Empress has unsealed them and once again opened the connection between the Great Old Ones and the Lengii people!]
 eldritch_leng_desc:0 "The gods are not intangible aspects or foreign concepts; no, the Great Old Ones lie below the island itself. This was known to others, for when the Golden Empire, curse its name, came, they sealed the entrances to the gods. Now, joyfully, the God-Empress has unsealed them and once again opened the connection between the Great Old Ones and the Lengii people!"
