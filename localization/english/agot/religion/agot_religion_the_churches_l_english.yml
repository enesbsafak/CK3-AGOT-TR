### TODO NOT-IN-ST: eldritch_starry_wisdom_desc [AGOT: The Bloodstone Emperor was the founder of the Church of Starry Wisdom, but the Church soon surpassed him. Today, it can be found nearly across the known world, though those who follow its teachings are secretive and selective. What is known is that they worship a great piece of oily black stone, not unlike that of Yeen, the Toad Stone, Asshai, or even the Seastone Chair. This stone is said to have revealed the true nature of reality and great cosmic principles that shatter many men's minds.]
 eldritch_starry_wisdom_desc:0 "The Bloodstone Emperor was the founder of the Church of Starry Wisdom, but the Church soon surpassed him. Today, it can be found nearly across the known world, though those who follow its teachings are secretive and selective. What is known is that they worship a great piece of oily black stone, not unlike that of Yeen, the Toad Stone, Asshai, or even the Seastone Chair. This stone is said to have revealed the true nature of reality and great cosmic principles that shatter many men's minds."
