 the_flames_religion_desc:0 "Uzun Yaz Toprakları, Alev ve Kanat Tanrılarına ev sahipliği yapıyordu; bu tanrılar bölgenin alt tabakaları için çoğu zaman ejderha biçimine bürünürdü."

 valyrian_pan_freehold:0 "On Dört Alev"

 valyrian_pan_freehold_adj:0 "On Dört Alev"

 valyrian_pan_freehold_adherent:0 "Bağlı"

 valyrian_pan_freehold_adherent_plural:0 "Bağlılar"

 valyrian_pan_freehold_desc:0 "Valyria Özgür Toprakları'nın kadim dini olan bu inanç, Uzun Yaz Toprakları'nı çevreleyen on dört volkanın kişileşmesine tapar. Bu tanrılara tapınılmasına rağmen, Valyrialılar diğer inanç ve tanrılara karşı çok hoşgörülüydü."

 fots_dragon:0 "Ejderhaların İnancı"

 fots_dragon_adj:0 "Ejderhaların İnancı"

 fots_dragon_adherent:0 "Sadık"

 fots_dragon_adherent_plural:0 "Sadık"

 fots_dragon_desc:0 "On Dört Alev'in Alevleri ile Yediler'in İnancı'nın bir birleşimi olan bu doktrin, On Dört'ün Yedi yönünün yalnızca başka yorumları olduğunu ve hepsinin de Bir'in parçası olduğunu söyler."

 valyrian_pan_dragon:0 "Kanatlıların Alevleri"

 valyrian_pan_dragon_adj:0 "Kanatlı Alevler"

 valyrian_pan_dragon_adherent:0 "Bağlı"

 valyrian_pan_dragon_adherent_plural:0 "Bağlılar"

 valyrian_pan_dragon_desc:0 "Özgür Topraklar'ın ejderhaları pek çok şeydi: kıymetli yoldaşlar, savaş canavarları ve dünyanın en büyük binekleri. Ancak birçok insan için onlar, ete bürünmüş ateş, ilahlar olarak görülür. Bu inanç, Ay Dağları'ndaki bir kabileden Senrili halklarına ve Boyalı Dağlar'ın kabilelerine kadar bilinen dünyaya yayılmıştır."

