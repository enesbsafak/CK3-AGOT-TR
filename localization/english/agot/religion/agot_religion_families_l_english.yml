l_english:

 rf_sunset:0 "Gün Batımı İnançları"

 rf_sunset_desc:0 "Westeros'un Gün Batımı Toprakları'ndan doğan inançlar; topraklara insanın gelişinden öncesine dayanırlar, ancak bazıları günümüz sakinlerine dek sürmüştür."

 rf_western_essos:0 "Batı Essos Tarikatları"

 rf_western_essos_desc:0 "Dar Deniz boyunca batı Essos'tan, Daimi Yaz Toprakları'ndan ve Rhoyne kıyısındakilerden doğan çok sayıda ve çeşitli tarikatlar."

 rf_azorian:0 "Azorcu Kehanetler"

 rf_azorian_desc:0 "Asshai'den gelen, Azor Ahai'den ve onun nihai yeniden doğuşundan bahseden kehanetlere adanmış dinler ve inançlar."

 rf_grasslands:0 "Otlakların Mezhepleri"

 rf_grasslands_desc:0 "Bir zamanlar Gümüş Deniz ve Balıkçı Kraliçelerinin Diyarı olan otlaklarda doğmuş sayısız mezhep."

 rf_dawn:0 "Şafağın Bin Tanrısı"

 rf_dawn_desc:0 "Yi Ti'nin ve Altın İmparatorluk'un birçok tanrısı; bu dinler ve inançlar imparatorluktan da önce, Şafak Çağı'na dayanır."

 rf_southseas:0 "Güney Denizlerinin Tanrıları"

 rf_southseas_desc:0 "Güney denizlerinin adalarında ve topraklarında bulunan dinler ve inançlar."
