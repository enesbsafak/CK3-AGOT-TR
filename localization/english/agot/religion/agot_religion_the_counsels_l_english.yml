 the_counsels_religion:0 "Doshi'nin Meclisleri"

 the_counsels_religion_adj:0 "Meclisler"

 the_counsels_religion_adherent:0 "Drogikh"

 the_counsels_religion_adherent_plural:0 "Drogikhler"

 the_counsels_religion_desc:0 "Dothrakiler uzun süredir, Güneş ve tanrıça karısı Ay dahil olmak üzere çok sayıda tanrıya inanmıştır. Ancak Dothrakileri inançta birleştiren, tıpkı oğlunun onları bir Halasar'da birleştirmesi gibi, Büyücü Doshi oldu."

 dothraki_faith:0 "Büyük Aygır'ın Halasarı"

 dothraki_faith_adj:0 "Büyük Aygır"

 dothraki_faith_adherent:0 "Drogikh"

 dothraki_faith_adherent_plural:0 "Drogikhler"

 dothraki_faith_desc:0 "Dothrakilerin dini ve inançları büyük ölçüde kadim geleneklerinden ve ilk büyük Hal'ın annesi büyücü-kraliçe Doshi'nin öğretilerinden türemiştir. Doğal dünyanın çoğu birçok tanrıyla temsil edilir: Güneş ve karısı Ay; dünyanın kendisi; ve hepsinden önemlisi Büyük Aygır. Diğer toprakların ve halkların tanrılarını kabul etseler de, onlara tapınılmamalıdır. Aksine, kırılıp sürüklenerek Vaes Dothrak'a getirilmeli ve Dothrakilerin ve tanrılarının yüceliğinin mağlup tanıkları olmalıdırlar."
