 tenet_stars_and_axes_desc:0 "Tanrılar toprakları seçtiklerine verdiğinde, bu karşılıksız verilmedi. Seçilmişler, gerekirse yıldız ve balta yoluyla kendi krallıklarını oymak zorunda kalacaktı."

