 tenet_bounties_of_the_river_desc:0 "Hepimizin anası olan nehirden ihtiyacımız olan tüm bereketler gelir: metal işleme becerisi, ekinleri besleyen su, şehirlerimizi döşeyen mallar ve yuvalarımızı savunan silahlar."

