l_english:

 doctrine_not_both_marriage_and_concubinage:0 "[faith|E] hem birden fazla eşe hem cariyelere sahip olamaz"

 incompatible_doctrine_dualistic_ditheistic_trigger:0 "[faith|E] ya İkili Tanrılı ya da Ötesi Tanrılı Tanrı anlayışına sahip olmalıdır"

 incompatible_doctrine_chaos_into_world_polytheistic_trigger:0 "[faith|E] birden fazla Tanrıya inanmalıdır"

 allowed_clergy_appointed_to_monks:0 "[clergy|E] üyeleri keşiş veya rahibe olmalıdır."

 disallowed_clergy_appointed_to_monks:0 "[clergy|E] üyeleri keşiş veya rahibe olmamalıdır."

 doctrine_pantheon_name:0 "Panteon ve Törenler"

 doctrine_fots_pantheon_name:0 "Yediler"

 doctrine_fots_pantheon_desc:0 "Bu inanç, Eski Andalos'ta doğan ve Andalların Fethiyle Westeros'a yayılan Bir Olan Yediler'e tapar. Panteonları Baba, Anne, Savaşçı, Demirci, Bakire, Kocakarı ve Yabancı'dan oluşur."

 doctrine_parameter_faith_of_the_seven_patrons:0 "Bu [faith|E]nin [characters|E]ne, Yediler'den birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_the_seven_baelor_name:0 "Yediler ve Baelor"

 doctrine_pantheon_the_seven_baelor_desc:0 "Bir Olan Yediler'in yanı sıra, Kutsanmış Baelor, Septon-Kral, Ölümlülerin En Kutsalı'na da dua edilir; kişinin adına Yediler'e aracılık etmesi umulur."

 doctrine_pantheon_the_seven_name:0 "Bir Olan Yediler"

 doctrine_pantheon_the_seven_desc:0 "Bir Olan Yediler, yedi yönüyle temsil edilen tek bir tanrıdır: Sert ve adil Baba; sevgi dolu ve koruyucu Anne; cesur ve güçlü Savaşçı; güzel ve saf Bakire; azimli ve gayretli Demirci; bilge ve düşünceli Kocakarı; ve karanlık ve gölgeli Yabancı."

 doctrine_pantheon_the_seven_old_gods_name:0 "Bir Olan Yediler ve Eski Tanrılar"

 doctrine_pantheon_the_seven_old_gods_desc:0 "Kimileri Eski ve Yeni Tanrıları iki ayrı şey olarak görse de, bu inanca mensup olanlar onların gerçekte bir olduğunu, aynı madalyonun karşıt yüzleri olduğunu bilir."

 doctrine_parameter_faith_of_the_seven_weirwood_patrons:0 "Bu [faith|E]nin [characters|E]ne, Yediler'den veya Akteber ağacından birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_the_seven_qarlon_name:0 "Bir Olan Yediler ve Büyük Qarlon"

 doctrine_pantheon_the_seven_qarlon_desc:0 "Bir Olan Yediler'in yanı sıra, Tüm Andalların Kralı Büyük Qarlon da anılır ve kendisine dua edilir; yabancılardan ve inançsızlardan korunmak umulur."

 doctrine_parameter_faith_of_the_seven_qarlon_patrons:0 "Bu [faith|E]nin [characters|E]ne, Yediler'den veya Yediler'in avatarlarından Büyük Qarlon'dan birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_parameter_baelorist_patrons:0 "Bu [faith|E]nin [characters|E]ne, Yediler'den veya Yediler'in avatarlarından Baelor I'den birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_old_gods_name:0 "Eski Tanrılar"

 doctrine_pantheon_old_gods_desc:0 "Bu inanç, Westeros'un dört bir yanında bulunan Akteber Ağaçlarıyla bağlantılı, toprağın isimsiz tanrıları olan dere, orman ve taşın Eski Tanrıları'na tapar."

 doctrine_parameter_old_gods_patrons:0 "Bu [faith|E]'in [characters|E]'i, çevreleri üzerinde etkisi olan birçok yerel tanrıya inanır."

 doctrine_old_gods_btw_pantheon_name:0 "Uzak Kuzeyin Eski Tanrıları"

 doctrine_old_gods_btw_pantheon_desc:0 "Bu inanç, Westeros'un dört bir yanında bulunan Akteber Ağaçlarıyla bağlantılı, toprağın isimsiz tanrıları olan dere, orman ve taşın Eski Tanrıları'nın yanı sıra Duvar'ın ötesinden gelen tuhaf tanrılara da tapar."

 doctrine_parameter_free_folk_patrons:0 "Bu [faith|E]'in [characters|E]'i, çevreleri üzerinde etkisi olan birçok yerel tanrıya inanır."

 doctrine_parameter_rhllor_volantene_patrons:0 "Bu [faith|E]nın [characters|E]i Işık Efendisi'ne inanır."

 doctrine_parameter_magnar_patron:0 "Bu [faith|E]nın [characters|E]i, krallarının insanlıktan çok tanrılığa yakın olduğuna inanır ve ona tapılır."

 doctrine_pantheon_old_gods_magnar_name:0 "Magnar ve Eski Tanrılar"

 doctrine_pantheon_old_gods_magnar_desc:0 "Eski Tanrılar'ın sayılamaz ve bilinemez olduğu bilinir; ta ki dünyada etle kemikle dolaşan biri hariç: Magnar."

 doctrine_parameter_bronze_gods_pantheon:0 "Bu [faith|E]'in [characters|E]'i, tanrılarının Tunç ile Kalay ve Bakır'ın vücut bulmuş hâli olduğuna, onlara iyi talih ve zenginlik getirdiğine inanır."

 doctrine_bronze_ones_name:0 "Tunç Tanrılar"

 doctrine_bronze_ones_desc:0 "Bu [faith|E]'in [characters|E]'i, tanrılarının Tunç ile Kalay ve Bakır'ın vücut bulmuş hâli olduğuna, onlara iyi talih ve zenginlik getirdiğine inanır."

 doctrine_parameter_lady_of_the_waves_pantheon:0 "Bu [faith|E]'in [characters|E]'i, dalgalara hükmeden bir Tanrıça'ya ve göklere hükmeden bir Tanrı'ya inanır."

 doctrine_waves_and_skies_name:0 "Dalgalar ve Gökyüzü"

 doctrine_waves_and_skies_desc:0 "Bu [faith|E]'in [characters|E]'i, dalgalara hükmeden bir Tanrıça'ya ve göklere hükmeden bir Tanrı'ya inanır."

 doctrine_parameter_others_pantheon:0 "Bu [faith|E]nın [characters|E]i, Ak Gezenler'in dünyanın yeni ve haklı bir yıkım ve viranını müjdeleyecek özel varlıklar olduğuna inanır ve onlara yeni doğanları kurban eder."

 doctrine_pantheon_the_others_name:0 "Ak Gezenler"

 doctrine_pantheon_the_others_desc:0 "Ak Gezenler, Beyaz Yürüyüşçüler, Soğuk Gölgeler: Hangi adla bilinirlerse bilinsinler, Soğuk ve Ölüm getirirler ve Uzun Gecenin habercileridirler."

 doctrine_old_gods_vale_pantheon_name:0 "Vadi'nin Eski Tanrıları"

 doctrine_old_gods_vale_pantheon_desc:0 "Bu inanç, Vadi'nin dört bir yanında bulunan Akteber Ağaçlarıyla bağlantılı, toprağın isimsiz tanrıları olan dere, orman ve taşın Eski Tanrıları'na tapar."

 doctrine_parameter_vale_clans_patrons:0 "Bu [faith|E]nın [characters|E]ne, Vadi'nin sayısız Eski Tanrısı'ndan birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_drowned_god_name:0 "Boğulmuş Tanrı"

 doctrine_pantheon_drowned_god_desc:0 "Bu inanç, su dolu salonlarında Dalgaların Altında İkamet Eden Boğulmuş Tanrı'ya tapar. Denizlerin Yaratıcısı ve inanlıların babası olan Boğulmuş Tanrı, dünyanın denizleriyle bağlantılıdır."

 doctrine_parameter_drowned_god_patrons:0 "Bu [faith|E]ye Boğulmuş Tanrı'nın Koruyucularına erişim verir."

 doctrine_pantheon_the_seven_drowned_god_name:0 "Demir Adamların Sekizlisi"

 doctrine_pantheon_the_seven_drowned_god_desc:0 "Bu inanç, Yediler'e ve su dolu salonlarında Dalgaların Altında İkamet Eden Boğulmuş Tanrı'ya tapar. Denizlerin Yaratıcısı ve inanlıların babası olan Boğulmuş Tanrı, dünyanın denizleriyle bağlantılıdır ve Andalların Yedi Tanrısı üzerinde açıkça hüküm sürer."

 doctrine_parameter_faith_of_eight_patrons:0 "Bu [faith|E]ye, Yedilerin İnancı ve Boğulmuş Tanrı'nın Koruyucularına senkretik bir biçimde erişim verir."

 doctrine_pantheon_drowned_god_storm_name:0 "Fırtına Tanrısı"

 doctrine_pantheon_drowned_god_storm_desc:0 "Bu inanç, bulutlu salonlarında Göklerin Üzerinde İkamet Eden Fırtına Tanrısı'na tapar. Göklerin Yaratıcısı ve inanlıların babası olan Fırtına Tanrısı, dünyanın gökleriyle bağlantılıdır."

 doctrine_parameter_storm_god_patrons:0 "Bu [faith|E]ye Fırtına Tanrısı'nın Koruyucularına erişim verir."

 doctrine_parameter_can_execute_drown:0 "#V Boğma#! [execution|E] yöntemine erişim sağlar."

 doctrine_rhllor_westerosi_pantheon_name:0 "Kızıl Tanrı"

 doctrine_rhllor_westerosi_pantheon_desc:0 "Bu inanç, Kızıl Tanrı'nın törenlerini izler; tek gerçek tanrı R'hllor'a, Işık Efendisi'ne ve karanlığı kesin olarak söndürmek için yeniden gelecek kahraman Azor Ahai'ye tapar."

 doctrine_pantheon_rhllor_name:0 "R'hllor"

 doctrine_pantheon_rhllor_desc:0 "R'hllor, Ateşin Kalbidir, Işık Efendisi, Alev ve Gölge Tanrısıdır. Büyük Öteki ile savaşan odur ve Kan İhaneti'nden sonra Uzun Gece'de dünyayı kurtarması için Azor Ahai'ye yol göstermiştir."

 doctrine_rhllor_asshai_pantheon_name:0 "Asshai Töresi"

 doctrine_rhllor_asshai_pantheon_desc:0 "Bu inanç, R'hllorizmin Asshai Töresi'ni izler; tek gerçek tanrı R'hllor'a, Işık Efendisi'ne ve karanlığı kesin olarak söndürmek için yeniden gelecek kahraman Azor Ahai'ye tapar."

 doctrine_rhllor_hyrkooni_pantheon_name:0 "Hyrkoon Töresi"

 doctrine_rhllor_hyrkooni_pantheon_desc:0 "Bu inanç, R'hllorizmin Hyrkoon Töresi'ni izler; tek gerçek tanrı R'hllor'a, Işık Efendisi'ne ve karanlığı kesin olarak söndürmek için yeniden gelecek kahraman Azor Ahai'ye tapar."

 doctrine_valyrian_pantheon_name:0 "Valyria Panteonu"

 doctrine_valyrian_pantheon_desc:0 "Bu inanç, Eski Valyria Panteonu'nun tanrılarına, hem ejderha hem insan suretinde simgelenen ateş ve kan tanrılarına tapar."

 doctrine_pantheon_the_seven_valyrian_name:0 "Bir Olan Ondört"

 doctrine_pantheon_the_seven_valyrian_desc:0 "Ejderhaların İnancı vaaz edildiğinde, Ondört Alev'in yalnızca Bir'in daha küçük yönleri olduğu fark edildi; tıpkı Bir'in Andallara Bir Olan Yediler olarak göründüğü gibi."

 doctrine_valyrian_pantheon_painted_name:0 "Alev ve Kanat Tanrıları"

 doctrine_valyrian_pantheon_painted_desc:0 "Tanrılar bir zamanlar aramızdaydı; ama yürümediler, dehşet kanatlarıyla tepemizde uçtular ve alev soludular."

 doctrine_pantheon_braavos_name:0 "Dünyanın Panteonu"

 doctrine_pantheon_braavos_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Tanrılar Adası'nda en çok kutlananlar Ay-Karığı Bakire, Gecenin Aslanı, Suların Babası ve Denizadamı Kral'dır."

 doctrine_parameter_braavosi_patrons:0 "Bu [faith|E]nın [characters|E]ne, Braavos panteonundan bir tanrıyı Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_black_goat_name:0 "Kara Keçi"

 doctrine_pantheon_black_goat_desc:0 "Kara Keçi'ye başlıca Qohor'da tapılır ve talep ettiği kanlı kurbanlarla bilinir."

 doctrine_pantheon_boash_name:0 "Kör Tanrı"

 doctrine_pantheon_boash_desc:0 "Kör Tanrı Boash, inanlılarının varlığın daha yüksek düzlemlerini görmesini isteyen katı bir tanrıdır."

 doctrine_pantheon_josimakazma_name:0 "Josimakazma"

 doctrine_pantheon_josimakazma_desc:0 "İlahi Güneş Josimakazma, tüm yaşamın kaynağı ve her şeyin atasıdır. Sahip olduğumuz her şeyi ona borçluyuz."

 doctrine_pantheon_volantis_name:0 "Layık Olanlar"

 doctrine_pantheon_volantis_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Volantis'te en çok kutlananlar Gecenin Aslanı, ikizler Semosh ve Selloso, Pantera ve Kızıl Boğa Aquan'dır."

 doctrine_parameter_volantene_patrons:0 "Bu [faith|E]nın [characters|E]ne, Volantis panteonundan bir tanrıyı Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_lorath_name:0 "Örüntünün Koruyucuları"

 doctrine_pantheon_lorath_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Lorath'ta en çok kutlananlar Örüntü, Suların Babası, Kapüşonlu Yolcu ve Bakkalon'dur."

 doctrine_parameter_lorath_patrons:0 "Bu [faith|E]nın [characters|E]ne, Lorath panteonundan bir tanrıyı Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_pentos_name:0 "Prensin Merhametleri"

 doctrine_pantheon_pentos_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Pentos'ta Prens aracı olarak görülür: tanrıların sesi olan ve tanrıları yatıştırmak için sunulan nihai kurban."

 doctrine_pantheon_myr_name:0 "Meclis"

 doctrine_pantheon_myr_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Myr'da en çok tapılanlar Kızıl Boğa Aquan, Kapüşonlu Yolcu, Sessiz Tanrı ve Gelenei'dir."

 doctrine_parameter_myrish_patrons:0 "Bu [faith|E]nın [characters|E]ne, Myr panteonundan bir tanrıyı Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_tyrosh_name:0 "Trios'un Tonları"

 doctrine_pantheon_tyrosh_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Tyrosh'ta en çok kutlananlar Trios, ikizler Semosh ve Selloso, Sarhoş Tanrı ve Örüntü'dür."

 doctrine_parameter_tyroshi_patrons:0 "Bu [faith|E]nın [characters|E]ne, Tyrosh panteonundan bir tanrıyı Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_lys_name:0 "İnci Tanrıçalar"

 doctrine_pantheon_lys_desc:0 "Özgür Şehirler'de tüm tanrılar kabul görürken, Lys'te diğerlerinden üstün tutularak tapılanlar Ağlayan Leydi, Pantera, Alacakaranlığın Yndros'u, Bakkalon ve Saagael'dir."

 doctrine_parameter_lyseni_patrons:0 "Bu [faith|E]nın [characters|E]ne, Lys panteonundan bir tanrıyı Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_faceless_men_name:0 "Çok Yüzlü Tanrı"

 doctrine_pantheon_faceless_men_desc:0 "Herkes Çok Yüzlü Tanrı'yı bilir, farkında olmasa bile; kişi Andalların Babası'na, Gecenin Aslanı'na, Alacakaranlığın Yndros'una, Yeryüzündeki Tanrı'ya vb. dua ettiğinde, Çok Yüzlü Tanrı'ya dua ediyordur. Ölüm onun ödülüdür ve ölüm onun armağanıdır; hepimize o verilecektir."

 doctrine_pantheon_mother_rhoyne_name:0 "Ana Rhoyne"

 doctrine_pantheon_mother_rhoyne_desc:0 "Ana Rhoyne yüce Tanrıçadır. Diğer tüm tanrılar ve elbette insanlar ondan doğar. İhtiyaç duyulan her şeyi besleyen ve sağlayan odur."

 doctrine_pantheon_mother_summer_name:0 "Ana Rhoyne ve Yaz Tanrıları"

 doctrine_pantheon_mother_summer_desc:0 "Ana Rhoyne her şeyi doğurmuş olsa da, artık bize yol gösterip bakımımızı sağlayan onun çocukları, Yaz Tanrıları'dır."

 doctrine_parameter_rhoynish_patrons:0 "Bu inanç, Ana Rhoyne'ye, yani Ana Nehir'e tapar."

 doctrine_pantheon_bearded_god_name:0 "Sakallı Tanrı"

 doctrine_pantheon_bearded_god_desc:0 "Bu inanç Sakallı Tanrı'ya tapar."

 doctrine_parameter_norvoshi_patrons:0 "Bu inanç Sakallı Tanrı'ya tapar."

 doctrine_pantheon_summer_naath_name:0 "Uyumun Lordu"

 doctrine_pantheon_summer_naath_desc:0 "Uyum Efendisi, Büyük Kelebek, şiddete başvurmadan bile halkını korur."

 doctrine_pantheon_eldritch_fishgod_name:0 "Balık Tanrıları"

 doctrine_pantheon_eldritch_fishgod_desc:0 "Balık Tanrıları, dalgaların altında yatan büyük tanrılardan bazılarıdır. Bin Ada'nın insanları, soylarının onlardan geldiğine inanır."

 doctrine_pantheon_eldritch_bloodless_name:0 "Kansız"

 doctrine_pantheon_eldritch_bloodless_desc:0 "Kansız Tanrı, doymak bilmez açlığıyla bilinir ve kurban ister."

 doctrine_pantheon_eldritch_yellow_name:0 "Sarı İşaret"

 doctrine_pantheon_eldritch_yellow_desc:0 "Sarı İşaret'in ardında gizlenen Tanrı her şeyi görür."

 doctrine_pantheon_eldritch_dreams_name:0 "Yabancı"

 doctrine_pantheon_eldritch_dreams_desc:0 "Rüyaların gücü, eski Valyrialılardan efsanelerin yeşilgörürlerine dek iyi bilinir. Ancak daha doğuda, Yer'in ve göklerin ötesindeki tanrılara inanırlar."

 doctrine_pantheon_eldritch_wisdom_name:0 "Karanlık Avcı"

 doctrine_pantheon_eldritch_wisdom_desc:0 "Kan Taşı İmparatoru, Yıldızlı Bilgelik Kilisesi'nin ilk Yüce Rahibiydi; Karanlık Avcı'dan düşen, yağlı siyah taş olan bilgi armağanını ilk tanıyan kişiydi."

 doctrine_pantheon_eldritch_leng_name:0 "Kadimler ve Tanrı-İmparatoriçe"

 doctrine_pantheon_eldritch_leng_desc:0 "Kadimler, Leng'in derinliklerindeki tünellerde yatar. Tanrı-İmparatoriçe aracılığıyla tasarıları ve istekleri bilinir."

 doctrine_pantheon_dothraki_name:0 "Büyük Aygır"

 doctrine_pantheon_dothraki_desc:0 "Tanrılar çoktur ve çeşitlidir, tüm halkların kendi tanrıları vardır; yine de hepsi, Dothrakileri dünyanın uçlarına götürecek Büyük Aygır tarafından ezilecektir."

 doctrine_pantheon_yiti_celestial_name:0 "Yi Ti Tanrıları"

 doctrine_pantheon_yiti_celestial_desc:0 "Yi Ti'nin Bin Tanrısı, aşağıdaki orta krallık gibi dizilir: Başında, ışıktan yaratılan Bakire ile Gecenin Aslanı olan anne babasının yanına yükselen Yeryüzündeki Tanrı bulunan devasa bir ilahi bürokrasi."

 doctrine_pantheon_yiti_jewels_name:0 "Şafak İmparatorları ve İmparatoriçe"

 doctrine_pantheon_yiti_jewels_desc:0 "Şafak Büyük İmparatorluğu'nda Yeryüzündeki Tanrı'nın halefleri olan bu kişiler yükselmiş ve büyük manevi bürokraside ilahi görevler verilmiştir."

 doctrine_parameter_yiti_imperial_patrons:0 "Bu [faith|E]nın [characters|E]ne, Yi Ti'li imparatorluk hükümdarlarından birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_yiti_ancestral_name:0 "Tanrı-İmparatorlar ve Atalar"

 doctrine_pantheon_yiti_ancestral_desc:0 "En alt hanelerden büyük Tanrı-İmparator hanedanlarına dek herkesin ataları, büyük ilahi bürokraside hizmet etmeye devam eder ve torunlarını gözetir."

 doctrine_pantheon_yiti_bloodstone_name:0 "Kan Taşı İmparatoru"

 doctrine_pantheon_yiti_bloodstone_desc:0 "Kan İhaneti'nin izinden gidecek olanlar, Kan Taşı İmparatoru'nu yalnızca bir kahraman olarak değil, yükselmiş bir tanrı olarak görür. Onları bir kez daha görkemli yeni bir dünyaya götürecek."

 doctrine_pantheon_yiti_leng_name:0 "Tanrı-İmparatoriçe ve Atalar"

 doctrine_pantheon_yiti_leng_desc:0 "Kutsal Leng ayakta kaldığı sürece Leng'in Tanrı-İmparatoriçesi her zaman vardı ve her zaman var olacak."

 doctrine_pantheon_first_men_bronze_name:0 "Tunç Olanlar"

 doctrine_pantheon_first_men_bronze_desc:0 "İlk İnsanlar'ın tanrıları çok yönlüydü; halklarını yansıttıkları kadar halkları da onları yansıtırdı. Bu yüzden aralarındaki en büyük grubun, İlk İnsanlar'ın en büyük silahı olan tunç yansımaları olması şaşırtıcı değildir."

 doctrine_pantheon_first_men_sisters_name:0 "Dalgalar ve Gökler"

 doctrine_pantheon_first_men_sisters_desc:0 "Dalgaların Leydisi ve Göklerin Efendisi, Andallar tarafından fethedildikten sonra bile Kız Kardeşler'e yerleşenler tarafından her zaman tapılan isimler olmuştur. Ve onların armağanı olan İşaret, bugün bile onurlandırılmaktadır."

 doctrine_pantheon_first_men_elenei_name:0 "Deniz ve Rüzgârlar"

 doctrine_pantheon_first_men_elenei_desc:0 "Deniz Tanrısı ve karısı Rüzgârlar Tanrıçası, ilahi Elenei'yi doğurdu; Durran'ın eş olarak aldığı Elenei, ölümlü tercihi yüzünden anne babasına keder ve acı getirdi."

 doctrine_pantheon_first_men_merling_name:0 "Denizadamı Sarayı"

 doctrine_pantheon_first_men_merling_desc:0 "Denizadamı Kral'ın tapınması, tuzlu suyun bulunduğu her yerde görülür; ancak kraliçesini, cadı Ursulla Upcliff'i karada bulmuştur, ya da Hanesi böyle söyler."

 doctrine_pantheon_first_men_sni_name:0 "Kar ve Buz"

 doctrine_pantheon_first_men_sni_desc:0 "Kar ve Buz kardeşlerin, kız ve erkek kardeş tanrıların bir zamanlar tüm dünyayı tehdit ettiğine inanılır. Onları durdurmak için diğer tanrılar isimlerini çaldı. Misilleme olarak, Kar ve Buz'un inanlıları, isimlerini de almak için düşmanlarını ve tutsaklarını tüketir."

 doctrine_pantheon_first_men_garth_name:0 "Yeşilel Garth"

 doctrine_pantheon_first_men_garth_desc:0 "Yeşil Garth'ın Reach'te pek çok sadık takipçisi vardı; kimileri onu tanrı mertebesine bile çıkardı."

 doctrine_pantheon_lhazar_name:0 "Büyük Çoban"

 doctrine_pantheon_lhazar_desc:0 "Bir çoban sürüsünü nasıl koruyup yönlendirirse, Büyük Çoban da Lhazaar halkını öyle yönlendirir ve korur."

 doctrine_pantheon_ghis_name:0 "Ghis Tanrıları"

 doctrine_pantheon_ghis_desc:0 "Ghis'in eski tanrıları, Özgür Toprak daha akla gelmeden önce saygıdeğerdi. Oktarklar sekiz tepeden vaaz verip halkı yönetti ve Grazdan'dan sonra eski imparatorluğu büyüklüğe taşıdı."

 doctrine_pantheon_ghis_spears_name:0 "Mızrakların Leydisi"

 doctrine_pantheon_ghis_spears_desc:0 "Ghis'in kadim tanrılarından biri olan Mızrakların Leydisi, özgür ve köle tüm askerlerin, özellikle de Lekesizler'in gözdesidir."

 doctrine_pantheon_warlocks_name:0 "Ölümsüzler"

 doctrine_pantheon_warlocks_desc:0 "En yaşlı ve en büyük büyücüler, artık ölümlülükle bağlanmamış olan Ölümsüzler olur; Akşam Gölgesi ve Kara Kabuklu Ağaçlar tarafından sonsuz yaşam verilir."

 doctrine_pantheon_pureborn_name:0 "Tahtlar ve Ölümsüzler"

 doctrine_pantheon_pureborn_desc:0 "Uygarlık insanın en büyük uğraşıdır ve en büyük uygarlık Qarth'ınkidir. Bu uğraş ve onun korunması, Safdoğanlar'ın bugüne dek sürdürdüğü ilahi ve kutsal bir görevdir."

 doctrine_pantheon_qaathi_name:0 "Hatıralar ve Tahtlar"

 doctrine_pantheon_qaathi_desc:0 "Qarthlılar, Kızıl Çoraklık'tan, Dothrakilerden ve çöküşlerinden önceki günleri hatırlar. Onları ayakta tutan da işte bu hatıralardır."

 doctrine_pantheon_sarnori_name:0 "Yüz Tanrı"

 doctrine_pantheon_sarnori_desc:0 "Kadim günlerde, Gümüş Deniz küçülmeden önce, Yüz Tanrı Balıkçı Kraliçeler aracılığıyla konuşur ve herkese uyum ve refah getirirdi."

 doctrine_pantheon_order_eternal_name:0 "Sonsuz Döngü"

 doctrine_pantheon_order_eternal_desc:0 "Dünyadan kaçmak için kişi zihnini zevklerle kırmalıdır."

 doctrine_pantheon_order_manticore_name:0 "Ölümcül Böcek"

 doctrine_pantheon_order_manticore_desc:0 "Dünyadan kaçmak için kişi diğer herkesi öldürmelidir."

 doctrine_pantheon_order_spice_name:0 "Akan Baharat"

 doctrine_pantheon_order_spice_desc:0 "Dünyadan kaçmak için kişi onun ötesini görmelidir."

 doctrine_pantheon_order_cow_name:0 "Taş İnek"

 doctrine_pantheon_order_cow_desc:0 "Dünyadan kaçmak için kişi taştan süt çıkarmalıdır."

 doctrine_pantheon_order_chain_name:0 "Zincirli Olan"

 doctrine_pantheon_order_chain_desc:0 "Dünyadan kaçmak için kişi onun içinde zincirlenmelidir."

 doctrine_pantheon_shanty_skull_name:0 "Kafatası Yığını"

 doctrine_pantheon_shanty_skull_desc:0 "Kafatası Adası'nda, eklenen her kafatasıyla büyüyen büyük Kafatası Yığını durur."

 doctrine_pantheon_shanty_toad_name:0 "Kurbağa Taşı"

 doctrine_pantheon_shanty_toad_desc:0 "Yağlı Kara Taş'tan yapılmış büyük Kurbağa Taşı, kucağını arayan herkesi izleyip yönlendirerek durur."

 doctrine_pantheon_shanty_brindle_name:0 "Brindelli Şarkısı"

 doctrine_pantheon_shanty_brindle_desc:0 "Alacalı Şarkı, Sothoryos'un kıyı halklarının davranışlarını belirler ve onlar için hem yasa hem din gibidir."

 doctrine_pantheon_shanty_yeen_name:0 "Yeen"

 doctrine_pantheon_shanty_yeen_desc:0 "Yeen, Sothoryos'un büyük, terk edilmiş şehri. Yağlı siyah taştan yapılmış şehir, çevresindeki yutucu orman tarafından el değmemiş bırakılmıştır ve oraya giden herkes huzursuz hisseder."

 doctrine_pantheon_summer_gods_name:0 "Yaz Tanrıları"

 doctrine_pantheon_summer_gods_desc:0 "Yaz, Tutku ve Aşk Tanrıları, Yaz Adalıları tarafından kutsanır."

 doctrine_parameter_summer_gods_patrons:0 "Bu [faith|E]nın [characters|E]ne, Yaz Tanrıları'ndan birini Koruyucuları olarak seçme yeteneği verir."

 doctrine_pantheon_ib_god_king_name:0 "Tanrı-Kral"

 doctrine_pantheon_ib_god_king_desc:0 "Ib'in Tanrı-Kralı, Taşın ve Sesin Efendisi, Ibbenlilerin gerçek tanrısıdır."

 doctrine_pantheon_ib_sound_name:0 "Denizin Sesleri"

 doctrine_pantheon_ib_sound_desc:0 "Denizin Sesleri'ni, dalgaların ritmini, kabarışların vuruşunu dinleyerek kişi anlayışı, bilgiyi ve kendini bulabilir."

 doctrine_pantheon_song_moon_name:0 "Ay ve Yıldızlar"

 doctrine_pantheon_song_moon_desc:0 "Ay ve Yıldızların Şarkıları, nerede olurlarsa olsunlar onu dinleyen ve söyleyenlere yol gösterebilir."

 doctrine_pantheon_song_nefer_name:0 "Yer ve Taşlar"

 doctrine_pantheon_song_nefer_desc:0 "Yerin ve Taşların Şarkıları, dinleyecek kulağı olan herkesi yönlendiren sürekli bir ritimdir."

 doctrine_pantheon_song_mossovy_name:0 "Kar ve Tipi"

 doctrine_pantheon_song_mossovy_desc:0 "Kar ve Tipinin Şarkıları, bir kar tanesi kadar sessiz ya da bir fırtına kadar gürültülü olabilir."

 doctrine_syncretism_name:0 "Senkretizm"

 doctrine_no_syncretism_name:0 "Tek Gerçek İnanç"

 doctrine_no_syncretism_desc:0 "Bu İnanç başka hiçbir dini ve başka hiçbir tanrıyı tanımaz; kendi öğretilerine saf ve sadıktırlar."

 doctrine_parameter_counties_harder_to_convert:0 "Bu inancın kontlukları artırılmış din değiştirme direncine sahiptir."

 doctrine_general_syncretism_name:0 "Tüm İnançlara Açık"

 doctrine_general_syncretism_desc:0 "Bu İnanç, diğer tüm inançları ve öğretileri kendilerinden aşağı görse de geçerli kabul eder."

 doctrine_parameter_hostility_override_special_doctrine_agot_is_any_faith:0 "[GetReligionByKey('the_others_religion').GetName] dini dışındaki tüm diğer [faiths|E] [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] olarak kabul edilir"

 doctrine_syncretism_the_pact_name:0 "Ahit Senkretizmi"

 doctrine_syncretism_the_pact_desc:0 "Eski Tanrılar, kendi tanrılarımızın daha eski ve daha az resmi bir tapınış biçimi olabilir; bu yüzden onların haklarına, geleneklerine ve tapınışlarının kutsallığına saygı duyacağız."

 doctrine_syncretism_the_others_name:0 "Beyaz Gölgeler Senkretizmi"

 doctrine_syncretism_the_others_desc:0 "Ak Gezenler, kendi tanrılarımızın yalnızca bir başka yönüdür; bu yüzden onlara tapanların haklarına ve geleneklerine saygı duyacağız."

 doctrine_parameter_can_sacrifice_children_to_others:0 "İnanlılar, [piety|E] karşılığında çocuklarını ve torunlarını Ak Gezenler'e kurban edebilir"

 doctrine_syncretism_the_faith_name:0 "İnanç Senkretizmi"

 doctrine_syncretism_the_faith_desc:0 "Bir Olan Yediler, kendi ilahiliğimizin yalnızca bir başka yüzüdür; bu yüzden İnanlıların haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_mother_name:0 "Anne Senkretizmi"

 doctrine_syncretism_the_mother_desc:0 "Ana Rhoyne ve Çocukları, panteonumuzun diğer ilahileridir; bu yüzden çocuklarının haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_cults_name:0 "Tarikatlar Senkretizmi"

 doctrine_syncretism_the_cults_desc:0 "Özgür Şehirler Tarikatlarının sayısız tanrısı, tanrılarımızın yalnızca başka yönleridir; bu yüzden sayısız tapınağın haklarına ve geleneklerine saygı duyacağız."

 doctrine_parameter_cannot_demand_conversion:0 "İnanlılar, farklı inançlardaki karakterlerin din değiştirmesini talep edemez."

 doctrine_syncretism_the_flames_name:0 "Alevler Senkretizmi"

 doctrine_syncretism_the_flames_desc:0 "Valyria'nın tanrıları, taptığımız tanrıların başka yönleridir; bu yüzden Alevler'in takipçilerinin haklarına ve geleneklerine saygı duyacağız."

 doctrine_parameter_can_send_food_to_dragons:0 "İnanlılar, [piety|E] karşılığında [dragons_plural|E]e yiyecek gönderebilir."

 doctrine_syncretism_the_rhllor_name:0 "Kalp (R'hllor) Senkretizmi"

 doctrine_syncretism_the_rhllor_desc:0 "Kızıl Tanrı panteonumuzdan değildir, ancak yine de bir tanrı olabilir; bu yüzden rahiplerinin haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_graces_name:0 "Lütuflar Senkretizmi"

 doctrine_syncretism_the_graces_desc:0 "Ghis'in tanrıları eski ve yıpranmıştır; bu yüzden Lütufların öğrettiği haklara ve geleneklere saygı duyacağız."

 doctrine_parameter_unlock_maa_unsullied:0 "$culture_parameter_unlock_maa_unsullied$"

 doctrine_syncretism_the_flocks_name:0 "Sürüler Senkretizmi"

 doctrine_syncretism_the_flocks_desc:0 "Büyük Çoban gerçek bir tanrı olmayabilir, ancak öğretileri adil ve erdemlidir; bu yüzden sürüsünün haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_counsels_name:0 "Konseyler Senkretizmi"

 doctrine_syncretism_the_counsels_desc:0 "Büyük Aygır, khalasarını Büyük Çimen Denizi boyunca yönlendirdi; bu yüzden onun konseylerini konuşanların haklarına ve geleneklerine saygı duyacağız."

 doctrine_parameter_unlocks_dothraki_screams_maa:0 "İnanlılar [GetMaA('dothraki_screamers').GetName]yi [men_at_arms|E] olarak toplayabilir"

 doctrine_syncretism_the_liturgies_name:0 "Ayinler Senkretizmi"

 doctrine_syncretism_the_liturgies_desc:0 "Ayinler gerçekleri ve bilgeliği anlatır; bu yüzden onlara tapanların haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_houses_name:0 "Haneler Senkretizmi"

 doctrine_syncretism_the_houses_desc:0 "Haneler sırlar ve gizli gerçekler barındırır; bu yüzden öğretilerini izleyenlerin haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_first_gods_name:0 "İlk Tanrılar Senkretizmi"

 doctrine_syncretism_the_first_gods_desc:0 "İlk Tanrılar, panteonumuzun başka tanrılarıdır; bu yüzden onlara tapanların haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_venerations_name:0 "Hürmetler Senkretizmi"

 doctrine_syncretism_the_venerations_desc:0 "Hürmetler gerçekleri söyler; bu yüzden onları hürmet edenlerin haklarına ve geleneklerine saygı duyacağız."

 doctrine_parameter_can_join_defensive_wars:0 "İnanlılar, aynı inanca sahip hükümdarların savunma savaşlarına serbestçe katılabilir"

 doctrine_syncretism_the_courts_name:0 "Saraylar Senkretizmi"

 doctrine_syncretism_the_courts_desc:0 "Saraylar gerçeği ve adaleti elinde tutar; bu yüzden tebaalarının haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_songs_name:0 "Şarkılar Senkretizmi"

 doctrine_syncretism_the_songs_desc:0 "Şarkılar gerçeği ve bilgeliği aktarır; bu yüzden onları söyleyenlerin haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_churches_name:0 "Kiliseler Senkretizmi"

 doctrine_syncretism_the_churches_desc:0 "Kiliseler karanlık gerçekleri ve gizli sırları vaaz eder; bu yüzden cemaatlerinin haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_shanties_name:0 "Şarkılar Senkretizmi"

 doctrine_syncretism_the_shanties_desc:0 "Güneyin Şarkıları ve Karanlık Tanrıları, bizim inancımızla hemen hemen aynı inançları dile getirir; bu yüzden onların haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_ways_name:0 "Yollar Senkretizmi"

 doctrine_syncretism_the_ways_desc:0 "Boğulmuş Tanrı, kendi tanrılarımızın bir başka yönüdür; bu yüzden yollarının haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_orders_name:0 "Tarikatlar Senkretizmi"

 doctrine_syncretism_the_orders_desc:0 "Yeşim ve Tarçın Tarikatları tanrılarımıza tapmayabilir, ancak felsefeleri bir miktar gerçek ve mantık içerir; bu yüzden haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_chosen_name:0 "Seçilmişler Senkretizmi"

 doctrine_syncretism_the_chosen_desc:0 "Uyum Efendisi bir tanrı olabilir de olmayabilir de; ancak kelebek tanrının öğretileri barışçıl ve uysaldır; bu yüzden haklarına ve geleneklerine saygı duyacağız."

 doctrine_syncretism_the_temples_name:0 "Tapınaklar Senkretizmi"

 doctrine_syncretism_the_temples_desc:0 "Yaz Tanrıları ve takipçileri barışçıl ve çalışkan bir gruptur; bu yüzden haklarına ve geleneklerine saygı duyacağız."

 faith_of_the_seven_hostility_doctrine_name:0 "Yedilerin İnancı Düşmanlığı"

 faith_of_the_seven_hostility_doctrine_desc:0 "Aynı aile içindeki diğer [faiths|E]i [faith_astray|L], Ebedi Kış Tanrıları'nı [faith_evil|L] ve diğer tüm dinleri [faith_hostile|L] olarak kabul eder."

 western_essosi_hostility_doctrine_name:0 "Batı Essos Düşmanlığı"

 western_essosi_hostility_doctrine_desc:0 "Ebedi Kış Tanrıları dışındaki tüm diğer [faiths|E]i [faith_astray|L] olarak kabul eder; Ebedi Kış Tanrıları ise [faith_evil|L] olarak kabul edilir."

