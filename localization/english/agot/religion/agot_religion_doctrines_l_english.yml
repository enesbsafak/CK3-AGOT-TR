### TODO NOT-IN-ST: tenet_weirwoods_desc [AGOT: When the Pact was signed between the Children of the Forest and the First Men, the men gave up their own god for the Old Gods. In doing so they created Godswoods, groves in which they can worship and commune with the Old Gods. The center of every Godswood is the Heart Tree, for those who follow the Old Gods a Weirwood with a carved face, for others often another type of tree, and it is from the Heart Tree that the gods listen and see the world.]
