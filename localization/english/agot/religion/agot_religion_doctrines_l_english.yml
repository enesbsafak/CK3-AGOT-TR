 tenet_the_most_devout_name:0 "En Dindarlar"

 tenet_the_most_devout_desc:0 "İnanlıların kutsal liderleri olan En Dindarlar, Yedilerin İnancı'nın kalbi ve aklıdır. Yüce Septon'u seçip yücelten onlardır; her ne kadar zaman zaman Lordlar ve Krallar Dindarları etkilemeye çalışmış olsa da."

 tenet_the_mark_name:0 "İşaret"

 tenet_the_mark_desc:0 "Şanslı doğanların, İlahi tarafından perde ayaklı eller ve ayaklarla belirgin biçimde işaretlendiği söylenir. Açıkça kayrılan bu insanlar, aramızda en uygun görülenlerdir elbette."

 doctrine_parameter_more_likely_born_with_mark:0 "İnanlıların İşaret ile doğma olasılığı daha yüksektir"

 tenet_oily_black_stone_name:0 "Yağlı Kara Taş"

 tenet_oily_black_stone_desc:0 "Tuhaf ve karanlık tanrılara inananlar, kökenleri veya inançları ne olursa olsun, yağlı kara taşa çekilir; ondan anıtlar yapar ya da onu bir ziynet eşyası olarak saklar; içinde hangi sırları barındırır?"

 doctrine_parameter_access_to_dark_communion_event:0 "İlgili [artifacts|E]e veya [holy_sites|E]e sahipken #V Karanlık Komünyon#! [decision|E]ine erişim açar"

