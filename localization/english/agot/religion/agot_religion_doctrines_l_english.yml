 azorian_hostility_doctrine_name:0 ""

 azorian_hostility_doctrine_desc:0 ""

 grasslands_hostility_doctrine_name:0 ""

 grasslands_hostility_doctrine_desc:0 ""

 doctrine_parameter_hostility_override_doctrine_clerical_marriage_allowed:0 "Doktrin farklılıkları ne olursa olsun, diğer tüm [faiths|E]i her zaman [faith_astray|L] olarak kabul eder"

 doctrine_parameter_hostility_override_doctrine_clerical_marriage_disallowed:0 "[county_opinion|E], [faith_hostility|E]den etkilenmez"

 doctrine_slavery_name:0 "Kölelik"

 doctrine_slavery_crime_name:0 "Suç"

 doctrine_slavery_crime_desc:0 "Kölelik her yönüyle tanrılara ve insanlara karşı bir suçtur."

 doctrine_slavery_indentured_name:0 "Borç Karşılığı Hizmet"

 doctrine_slavery_indentured_desc:0 "Burada kölelik yoktur; yalnızca efendilerine borçlu olan özgür bağlı hizmetkarlar vardır."

 doctrine_slavery_thralls_name:0 "Köleler"

 doctrine_slavery_thralls_desc:0 "Köleler, satın alınıp satılamaz; ancak hayatları daha kolay değildir."

 doctrine_slavery_accepted_name:0 "Kabul Edilmiş"

 doctrine_slavery_accepted_desc:0 "Herkes ilahiye nasıl zincirlenmişse, erkekler ve kadınlar da dünyevi efendilerine öyle zincirlenmiştir."

 doctrine_parameter_slavery_crime:0 "Kölelik her yönüyle bir [crime|E] olarak kabul edilir."

 doctrine_parameter_slavery_indentured:0 "Kölelik hoş karşılanmaz, ancak borç karşılığı hizmetkâr tutmak tamamen kabul edilir."

 doctrine_parameter_slavery_thralls:0 "Köle edinmek ve köle tutmak tamamen kabul edilir, ancak satın alınıp satılamazlar."

 doctrine_parameter_slavery_accepted:0 "Kölelik her yönüyle tamamen kabul edilir."

 agot_exceptionalism_doctrine_name:0 "İstisnacılık Doktrini"

 agot_exceptionalism_doctrine_desc:0 "İnanç, ensestin iğrençlik sayıldığı Andalos'ta doğmuştur. Ancak Targaryenler gibi Yüksek Valyrialıların kökleri, farklı geleneklerin hüküm sürdüğü Andalos'ta değil Valyria'dadır. Tanrılar Valyrialıları erkek kardeş ve kız kardeşin evlenmesi için yarattı; bu yüzden İnanç onları bu uygulama için yargılamayacaktır."

 agot_exceptionalism_name:0 "$agot_exceptionalism_doctrine_name$"

 doctrine_parameter_targaryen_incest_active:0 "Targaryen hanedanı üyeleri yasal olarak erkek kardeşle kız kardeşi evlendirebilir."

 doctrine_parameter_old_gods_buildings:0 "#V Tanrıkorusu#! [buildings|E] serisi ek bonuslara sahiptir"

 tenet_weirwoods_name:0 "Weirwoodlar"

 tenet_weirwoods_desc:0 "Ormanın Çocukları ile İlk İnsanlar arasında Ahit imzalandığında, insanlar kendi tanrılarından vazgeçip Eski Tanrılar'ı benimsedi. Böylece, içinde Eski Tanrılar'a tapıp onlarla iletişim kurabilecekleri korular olan Tanrıkorusu'nu yarattılar. Her Tanrıkorusu'nun merkezinde Kalp Ağacı bulunur; Eski Tanrılar'a bağlı olanlar için oyulmuş yüzlü bir Akteber, diğerleri içinse genellikle başka bir ağaç türüdür ve tanrılar dünyayı Kalp Ağacı'ndan dinleyip görür."

 doctrine_parameter_can_visit_weirwood_groves:0 "Bu ilkeye sahip [rulers|E], çeşitli olaylar yaşayabilecekleri bir Akteber Korusu'nu veya Tanrıkorusu'nu ziyaret etmeye [decide|E] edebilir."

 doctrine_parameter_can_build_weirwood_groves:0 "#V Tanrıkorusu#! [buildings|E] serisi inşa edilebilir"

 tenet_the_pact_exclusive_trigger:0 "Bu yollar yalnızca [GetReligionByKey('the_pact_religion').GetName] tarafından bilinir."

 tenet_god_kings_name:0 "Tanrı Krallar"

 tenet_god_kings_desc:0 "Tanrılardan kim şüphe edebilir, özellikle de biri aramızda yürürken? İlahilerin hepsi ölümlü eti giymekten vazgeçmez ve bu inancın mensupları, böyle bir varlık tarafından yönetilecek kadar şanslıdır."

 doctrine_parameter_can_change_crown_authority_frequently:0 "Hükümdarlar her 3 yılda bir Taç Otoritesini değiştirebilir"

 tenet_greensight_name:0 "Yeşilgörü"

 tenet_greensight_desc:0 "Eski Tanrılar pek çok armağan verir, ancak hiçbiri Yeşilgörü kadar büyük değildir; insanın dünyayı kuşların ve canavarların gözünden görebilmesi, geçmiş çağlardan ve gelecek çağlardan şeyleri görebilmesi, dünyayı tanrıların kendi bakış açısından görebilmesi... bundan daha büyük ne olabilir?"

 doctrine_parameter_increased_chance_of_greenseers:0 "[GetTrait('greensight').GetName( GetNullCharacter )] [trait|E]ni geliştirme şansı artar"

 doctrine_parameter_increased_chance_of_wargs:0 "Warg olma şansı artar"

 tenet_always_winter_name:0 "Daima Kış Toprakları"

 tenet_always_winter_desc:0 "Bu topraklarda soğuk rüzgârlar eser; yazın kendisi bile kıştan ve onu getirenlerden kaçmıştır. Ve donmuş çağrıya kulak veren insanlar — eğer insan denebilirse — getirdiği her şeyi memnuniyetle karşılar."

 doctrine_parameter_always_winter:0 "[realm|E]deki tüm topraklar yıl boyunca kış yaşar."

 tenet_the_others_exclusive_trigger:0 "Bu yollar yalnızca [GetReligionByKey('the_others_religion').GetName] tarafından bilinir."

 tenet_ever_growing_armies_name:0 "Sürekli Büyüyen Ordular"

 tenet_ever_growing_armies_desc:0 "Ak Gezenler'in orduları ölülerin kendisidir. Çünkü dışlanmışların dinlenmeye, yemeğe, barınağa ihtiyacı yoktur ve düşmanın kendileri tarafından takviye edilirler. Böylesine hangi güç karşı durabilir?"

 doctrine_parameter_raise_wights_from_dead:0 "Ak Gezenler'in yönettiği savaşlarda öldürülen düşmanlar, dışlanmış olarak diriltilip ordularınıza katılır"

 wight_army_name:0 "Dışlanmış Ordusu"

 tenet_knighthood_name:0 "Kutsanmış Şövalyelik"

 tenet_knighthood_desc:0 "Andallar demir ve baltalarla geldiğinde, en büyük savaşçıları Septonları tarafından kutsanır ve [agot_knights|e] olarak anılırdı. Bugün [agot_knights|e] hâlâ Yedilerin İnancı tarafından kutsanır ve cesaretin, metanetin ve onurun örnekleri olarak şövalyeliğin kaleleri olarak hizmet eder."

