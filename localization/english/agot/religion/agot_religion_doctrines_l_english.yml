 tenet_life_givers_life_takers_desc:0 "Bir yaşamı almak, ister savaşta ister yargıda olsun, ciddi bir meseledir; çünkü o eylemden ne çıkabileceğini kim bilebilir? Bunu anlayabilecek olanlar yalnızca yaşam verenlerdir; bu yüzden yük kadınların omuzlarına düşer."

