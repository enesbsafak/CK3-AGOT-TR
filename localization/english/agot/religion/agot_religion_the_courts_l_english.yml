### TODO NOT-IN-ST: yt_court_bloodstone_desc [AGOT: The Bloodstone Emperor conducted his own court, doing away with the right and pious ways of his forebears and of the gods. He took a Tiger-Woman for a wife and turned to worshipping the oily black stone that fell from the sky in the Blood Betrayal. Today, rebels, dissidents, sorcerers, and other impious individuals worship the Bloodstone Emperor and attempt to return the world to its ways under his rule.]
 yt_court_bloodstone_desc:0 "The Bloodstone Emperor conducted his own court, doing away with the right and pious ways of his forebears and of the gods. He took a Tiger-Woman for a wife and turned to worshipping the oily black stone that fell from the sky in the Blood Betrayal. Today, rebels, dissidents, sorcerers, and other impious individuals worship the Bloodstone Emperor and attempt to return the world to its ways under his rule."
