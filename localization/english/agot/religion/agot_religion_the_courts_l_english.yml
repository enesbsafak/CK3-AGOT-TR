l_english:

 the_courts_religion:0 "Şafağın Sarayları"

 the_courts_religion_adj:0 "Saraylar"

 the_courts_religion_adherent:0 "Adanmış"

 the_courts_religion_adherent_plural:0 "Adanmış"

 the_courts_religion_desc:0 "Yi Ti, bin tanrının ve yüzlerce prensin toprağıdır ve ilahi diyar da orta diyar gibi örgütlenmiştir. Tüm tanrılar kabul edilip bunlara inanılırken, çeşitli Saraylar bir grubun ya da bireyin kendini adadığı belirli tanrılardır."

 yt_court_celestial:0 "Cennetin Göksel Sarayı"

 yt_court_celestial_adj:0 "Göksel Saray"

 yt_court_celestial_adherent:0 "Adanmış"

 yt_court_celestial_adherent_plural:0 "Adanmış"

 yt_court_celestial_desc:0 "Gök kubbenin altındaki her şey Cennet'in İradesiyle doğar ve imparatorlar Altın İmparatorluk'u yönettiği gibi, Yeryüzündeki Tanrı da Göksel Saray'ı yönetir. Sarayda, Yeryüzündeki Tanrı'nın baş danışmanları olarak hizmet eden Işıktan Yapılmış Bakire ve Gece Aslanı dahil başka ilahi varlıklar da vardır. Gerektiğinde Gece Aslanı, cellat ve uygulayıcı olarak hizmet eder."

 yt_court_jewel:0 "Şafağın Mücevherli Sarayı"

 yt_court_jewel_adj:0 "Mücevherli Saray"

 yt_court_jewel_adherent:0 "Adanmış"

 yt_court_jewel_adherent_plural:0 "Adanmış"

 yt_court_jewel_desc:0 "Yeryüzündeki Tanrı'nın doğrudan soyundan gelen İnci, Yeşim, Turmalin, Oniks, Topaz, Opal İmparatorları ve Ametist İmparatoriçesi, bizim gibi kadın ve erkek değil, kendileri de ilahi bir doğaya sahipti. Bu ilahilik kıvılcımı zamanla sönmüş olsa da, bugün hâlâ onlara dua edenlere rehberlik ve yol gösterirler."

 yt_court_ancestor:0 "Yi Ti'nin Atalar Sarayı"

 yt_court_ancestor_adj:0 "Atalar Sarayı"

 yt_court_ancestor_adherent:0 "Adanmış"

 yt_court_ancestor_adherent_plural:0 "Adanmış"

 yt_court_ancestor_desc:0 "Tanrıların ve şafak imparatorlarının büyük saraylarının ötesinde, kişinin kendi ailesi ve ataları, yaşayan torunlarına rehberlik etmek ve onları korumak için kendi saraylarını kurar. En yüksek prens hanelerinden en düşük hizmetkâr hanelerine kadar herkes atalarına saygı gösterir."

 yt_court_bloodstone:0 "Gecenin Kan Taşı Sarayı"

 yt_court_bloodstone_adj:0 "Kan Taşı Sarayı"

 yt_court_bloodstone_adherent:0 "Adanmış"

 yt_court_bloodstone_adherent_plural:0 "Adanmış"

 yt_court_bloodstone_desc:0 "Kan Taşı İmparatoru, atalarının ve tanrıların doğru ve dindar yollarını bir kenara bırakarak kendi sarayını kurdu. Bir Kaplan-Kadın'ı eş olarak aldı ve Kan İhaneti'nde gökten düşen yağlı siyah taşa tapınmaya başladı. Bugün asiler, muhalifler, büyücüler ve diğer dinsiz kişiler Kan Taşı İmparatoru'na tapar ve dünyayı onun hükümdarlığındaki eski günlerine döndürmeye çalışır."

 yt_court_leng:0 "Leng'in Kutsal Sarayı"

 yt_court_leng_adj:0 "Kutsal Saray"

 yt_court_leng_adherent:0 "Adanmış"

 yt_court_leng_adherent_plural:0 "Adanmış"

 yt_court_leng_desc:0 "Büyük Khiara'dan bu yana Tanrı-İmparatoriçe, hem hükümdar hem de Leng inancının başı olarak yüceltiliyor. O, Lengii ulusunun yapısını yansıtan, Leng'in ruhunun tecessümüdür."
