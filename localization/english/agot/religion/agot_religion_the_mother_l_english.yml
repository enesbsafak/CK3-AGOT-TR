l_english:

 the_mother_religion:0 "Ana'nın Çocukları"

 the_mother_religion_adj:0 "Ana"

 the_mother_religion_adherent:0 "Çocuk"

 the_mother_religion_adherent_plural:0 "Çocuklar"

 the_mother_religion_desc:0 "Ana'nın Çocukları çoktur ve şimdi birçok toprağa yayılmışlardır. Hepsi, yalnızca onları değil tüm yaratılışı doğuran tanrıça Ana Rhoyne'nin çocukları oldukları inancıyla birbirine bağlıdır."

 mother_rhoyne:0 "Ana Rhoyne'nin Çocukları"

 mother_rhoyne_adj:0 "Ana Rhoyne"

 mother_rhoyne_adherent:0 "Çocuk"

 mother_rhoyne_adherent_plural:0 "Çocuklar"

 mother_rhoyne_desc:0 "Rhoynarların dini, tüm uygarlıkları gibi Rhoyne nehri üzerine kuruludur. Nehir baş tanrıça, diğer tüm tanrıların ve halkların Anası'dır ve Rhoynarların gözü ondadır."

 mother_orphan:0 "Ana Rhoyne'nin Yetimleri"

 mother_orphan_adj:0 "Yetimler"

 mother_orphan_adherent:0 "Yetim"

 mother_orphan_adherent_plural:0 "Yetimler"

 mother_orphan_desc:0 "Evlerini kaybetmekle birlikte Rhoynarlar, tanrıçaları Ana Rhoyne'yi de kaybetti. Bu, ibadetlerini anlatılamaz şekillerde şekillendirdi. Ana artık hazır ve bağlantılı değil; aksine çocuklar artık yetimdir ve onları ayakta tutan tek şey Analarının hatırasıdır."

 mother_summer:0 "Ana Yaz'ın Çocukları"

 mother_summer_adj:0 "Ana Yaz"

 mother_summer_adherent:0 "Çocuk"

 mother_summer_adherent_plural:0 "Çocuklar"

 mother_summer_desc:0 "Ana Rhoyne her şeyin kaynağı olsa da, bereketli sularını kaybetmesiyle çocukları, özellikle Yaz Tanrıları olmak üzere onun diğer çocuklarına tapınmaya yöneldi."
