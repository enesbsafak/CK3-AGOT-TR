 the_venerations_religion:0 "Ib'in Hürmetleri"

 the_venerations_religion_adj:0 "Hürmetler"

 the_venerations_religion_adherent:0 "Katılımcı"

 the_venerations_religion_adherent_plural:0 "Katılımcılar"

 the_venerations_religion_desc:0 "Ibbenese dini tuhaf ve içine kapanık bir şeydir; çoğu zaman liderlerinin ya da doğanın, özellikle de denizin hürmetine dönüşür."

 ib_ven_god_king:0 "Tanrı-Kral'a Hürmet"

 ib_ven_god_king_adj:0 "Ib'in Tanrı-Kralı"

 ib_ven_god_king_adherent:0 "Vasal"

 ib_ven_god_king_adherent_plural:0 "Vasaller"

 ib_ven_god_king_desc:0 "Ib'in Tanrı-Kralı geri döndü ve Ibbeneseleri dünyaya hükmetmenin doğru yollarında bir kez daha yönetiyor."

 ib_ven_sound:0 "Ses'e Hürmet"

 ib_ven_sound_adj:0 "Ses"

 ib_ven_sound_adherent:0 "Katılımcı"

 ib_ven_sound_adherent_plural:0 "Katılımcılar"

 ib_ven_sound_desc:0 "Ibbeneseler tuhaf bir halktır; bir zamanlar tapacakları bir Tanrı-Kral varken, şimdi Ses adını verdikleri bir inanca itibar ediyorlar. Ses, kıyıya vuran dalgalardan dağlardaki rüzgârlara kadar dünyanın ve onu oluşturan her şeyin doğal uyumudur."
