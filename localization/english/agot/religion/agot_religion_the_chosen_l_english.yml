 the_chosen_religion:0 "Kelebeklerin Seçilmişleri"

 the_chosen_religion_adj:0 "Seçilmişler"

 the_chosen_religion_adherent:0 "Uyumlu"

 the_chosen_religion_adherent_plural:0 "Uyumlu"

 the_chosen_religion_desc:0 "Naath halkı kelebeklerin Seçilmişleridir. Barışçıl olsalar da, tanrıları onları kutsal adalarına ayak basacak herkesi hastalık ve dert biçiminde vurarak korur."

 god_naath:0 "Uyum Efendisi Cemaati"

 god_naath_adj:0 "Uyumun Lordu"

 god_naath_adherent:0 "Uyumlu"

 god_naath_adherent_plural:0 "Uyumlu"

 god_naath_desc:0 "Naath'ta büyük kelebek tanrısı Uyum Efendisi halkını korur. Akıncılar, korsanlar ve kabadayılar köle ve diğer mallar için adayı yağmaladığında, halkını koruyan tanrı, adanın kelebekleri ve yabancıları uzak tutmak için yaydıkları hastalıklardır."
