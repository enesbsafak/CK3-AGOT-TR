 god_naath_desc:0 "Upon Naath, the great butterfly god, the Lord of Harmony, protects his people. When raiders, corsairs, and pirates pillage the isle for slaves and other goods, it is the god who protects his people through the butterflies of the island and the diseases they spread to keep out foreigners."
