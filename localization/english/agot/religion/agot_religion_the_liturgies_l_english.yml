 the_liturgies_religion_desc:0 "Ayinlerin Tanrıları, Uzun Gece'den önce de var olmuştur ve bugüne dek varlığını sürdürmüştür. Müritleri azalmış olsa bile kadim ve güçlüdürler."

 sarnori_faith:0 "Gümüş Deniz'in Yüz Tanrısı"

 sarnori_faith_adj:0 "Yüz Tanrı"

 sarnori_faith_adherent:0 "Dilekçeci"

 sarnori_faith_adherent_plural:0 "Dilekçeciler"

 sarnori_faith_desc:0 "Yüz Tanrı bir zamanlar dünyanın içinde yaşardı ve dünya halklarını refaha götürenler onların sesleri, Balıkçı Kraliçeleriydi. Ancak Uzun Gece'den ve son Balıkçı Kraliçe'nin ölümünden beri Yüz Tanrı dünyayı terk etti ve inancı, dönüşlerine hazırlık olarak şimdi Ayinlerin Müritleri yaşatmaktadır."
