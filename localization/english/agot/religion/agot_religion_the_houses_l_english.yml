l_english:

 the_houses_religion:0 "Qaathi Haneleri"

 the_houses_religion_adj:0 "Haneler"

 the_houses_religion_adherent:0 "Qaathi"

 the_houses_religion_adherent_plural:0 "Qaathi"

 the_houses_religion_desc:0 "Qaathiler tuhaf ve egzotik bir halktır; tanrıları ve inançları da farklı değildir. Gizemli ve gizli geleneklere bürünmüş Qaathi dini, hayatın her yönüne, özellikle de siyasi ve ekonomik yönüne işlemiştir."

 qh_warlock:0 "Ölümsüzler Hanesi"

 qh_warlock_adj:0 "Büyücüler"

 qh_warlock_adherent:0 "İçici"

 qh_warlock_adherent_plural:0 "İçiciler"

 qh_warlock_desc:0 "Ölümsüzler Hanesi'nin derinliklerinde, Qarth Büyücüleri karanlık sanatlarını icra eder ve Kara Kabuklu Ağaçlar'dan Akşam Gölgesi'ni üretir. Ölümsüz Olanlar, ruhani ve dünyevi çabalarında tarikatı buradan yönetir."

 qh_pureborn:0 "Tahta Çıkmışların Hanesi"

 qh_pureborn_adj:0 "Tahtlar"

 qh_pureborn_adherent:0 "Tahta Çıktı"

 qh_pureborn_adherent_plural:0 "Tahta Çıktı"

 qh_pureborn_desc:0 "Qartheenler dünyanın en eski ve en uygar halkı olduklarını iddia eder ve kendi kültürleriyle miraslarına, Westerosluların Yediler'e taptığı gibi taparlar. Bu tapınma, özellikle kendilerini uygarlığın ve nezaketin koruyucuları ve yargıçları olarak gören Safdoğanlar arasında baş tacıdır. Bin Taht Salonu'ndan Şehirlerin Kraliçesi'ni yönetirler."

 qh_commoner:0 "Hatıralar Hanesi"

 qh_commoner_adj:0 "Hatıralar"

 qh_commoner_adherent:0 "Ağlayan"

 qh_commoner_adherent_plural:0 "Ağlayanlar"

 qh_commoner_desc:0 "Qarth'un sıradan halkı, Tahta Çıkmışlar'ın ve Ölümsüzler'in izinden gider; ancak onların ibadeti daha çok, Qaathi halkının Qarth ile sınırlı olmadığı, çevrelerindeki topraklar Kızıl Çöle dönüşmeden ve Dothrakiler diğer kalelerini yerle bir etmeden önceki günlerin hatırası içindir."
