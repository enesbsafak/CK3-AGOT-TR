 the_temples_religion:0 "Yaz Tanrılarının Tapınakları"

 the_temples_religion_adj:0 "Tapınaklar"

 the_temples_religion_adherent:0 "Takipçi"

 the_temples_religion_adherent_plural:0 "Takipçiler"

 the_temples_religion_desc:0 "Yaz Adaları halkı, çoğunlukla tropikal yuvalarını yansıtan sayısız tanrı ve tanrıçaya tapar. Yaz Tanrıları sıcaklık ve sevgi ilahlarıdır ve halkları onlara derinden bağlıdır."

 summer_gods_pan:0 "Yaz ve Aşk Tapınakları"

 summer_gods_pan_adj:0 "Yaz Tanrıları"

 summer_gods_pan_adherent:0 "Takipçi"

 summer_gods_pan_adherent_plural:0 "Takipçiler"

 summer_gods_pan_desc:0 "Yaz Adaları'nın inancı, genellikle yaz, aşk ve tutkuyla ilişkilendirilen büyük bir ilahlar panteonu etrafında şekillenmiştir. Bu ilahlar adaların halkını bir bütün olarak gözetir; savaşların kutsal meydan okumalar olarak sürdürülmesini, köle tacirlerinin kovulmasını ve sevginin herkese uzatılmasını buyururlar."
