l_english:

 the_shanties_religion:0 "Basilisklerin ve Ejderha Kuşlarının Şantıları"

 the_shanties_religion_adj:0 "Şantılar"

 the_shanties_religion_adherent:0 "Şantıcı"

 the_shanties_religion_adherent_plural:0 "Şantıcılar"

 the_shanties_religion_desc:0 "Sothoryos topraklarında ve kıyısındaki adalarda birçok tuhaf ve çeşitli tanrıya tapınılır. Bu uygulamaların tümünü birleştiren ortak bağ, ibadetlerini yayan ve müntesiplerin karanlık açlıklarını gidermek için kullandıkları şantılardır."

 shanty_base_desc:0 "Basilisk Adaları'nda ve Sothoryos topraklarında krallıkların, halkların ve hatta dinlerin yazılı kayıtları bulunmaz. Ancak büyük şantılar, güney kıtasına özgü olmayan halklar dahil farklı halkları birleştirir ve bağlar. Bu şantılar neredeyse felsefi ve dini bir rehberlik üstlenir; genellikle gereklilikler veya arzu edilen davranışlar hakkında dizeler taşır."

 shanty_basilisks:0 "Kafatası Şantısı"

 shanty_basilisks_adj:0 "Kafatası Şantısı"

 shanty_basilisks_adherent:0 "Kafatasçı"

 shanty_basilisks_adherent_plural:0 "Kafatasçılar"

 shanty_basilisks_desc:0 "$shanty_base_desc$\nBöyle bir şantı olan Kafatası Şantısı'nda korsanlar ve diğer halklar öldürdüklerinin kafataslarını Kafatası Adası'na getirir; kafatasları dini bir törenin parçası olarak orada bırakılır."

 shanty_toad:0 "Kurbağa Şantısı"

 shanty_toad_adj:0 "Kurbağa Şantısı"

 shanty_toad_adherent:0 "Kurbağacı"

 shanty_toad_adherent_plural:0 "Kurbağacılar"

 shanty_toad_desc:0 "$shanty_base_desc$\nBöyle bir şantı olan Kurbağa Şantısı, yağlı siyah bir taştan yapılmış büyük bir kurbağa heykeline tapar."

 shanty_brindle:0 "Brindelli Şarkısı"

 shanty_brindle_adj:0 "Benekli Şantı"

 shanty_brindle_adherent:0 "Kıyıcı"

 shanty_brindle_adherent_plural:0 "Kıyıcılar"

 shanty_brindle_desc:0 "$shanty_base_desc$\nBöyle bir şantı olan Benekli Şantı, Sothoryos'un kıyı halklarının davranışlarını belirler ve onlar için hem yasa hem de din görevi görür."

 shanty_black:0 "Kara Şantı"

 shanty_black_adj:0 "Kara Şantı"

 shanty_black_adherent:0 "Yeenite"

 shanty_black_adherent_plural:0 "Yeenite"

 shanty_black_desc:0 "$shanty_base_desc$\nBöyle bir şantı olan Kara Şantı, Sothoryos'un büyük terk edilmiş şehri Yeen'e tapınmada Sothoryilere önderlik eder. Yağlı siyah taştan yapılmış şehir, onu saran yiyici ormandan etkilenmemiş haldedir ve oraya giden herkes huzursuz hisseder."

 shanty_greenhell:0 "Yeşil Şantı"

 shanty_greenhell_adj:0 "Yeşil Şantı"

 shanty_greenhell_adherent:0 "Yeşilci"

 shanty_greenhell_adherent_plural:0 "Yeşilciler"

 shanty_greenhell_desc:0 "$shanty_base_desc$\nYeşil Cehennem'in derin ormanlarında, doğanın insanlar için taban tabana zıt olduğu, hastalıkların yaygın ve tedavisiz olduğu, insanlığın artık zirve avcı olmadığı yerlerde yerliler, hayatın ne pahasına olursa olsun devam etmesi gerektiğine inanır."
