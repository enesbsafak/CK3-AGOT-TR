l_english:

 the_songs_religion:0 "Nhai'nin Şarkıları"

 the_songs_religion_adj:0 "Şarkılar"

 the_songs_religion_adherent:0 "Nhai"

 the_songs_religion_adherent_plural:0 "Nhai"

 the_songs_religion_desc:0 "Tanrılarla konuşurken kişi saygısını nasıl göstermeli? Yi Ti'nin kuzeyindekiler için cevap şarkıdadır. Tanrılar insanları ancak şarkı aracılığıyla duyabilir ve onlara yanıt verebilir."

 song_moon:0 "Ayın Şarkıları"

 song_moon_adj:0 "Ayın Şarkıları"

 song_moon_adherent:0 "Nhai"

 song_moon_adherent_plural:0 "Nhai"

 song_moon_desc:0 "Jogos Nhailer, Altın İmparatorluk'un en eski kayıtlarından bu yana Yi Ti'nin kuzeyindeki düzlüklerin belası olmuştur. Bu süre boyunca ruhani liderleri Ay Şarkıcıları olmuştur. Onlar Ay'ın Şarkılarını dinler ve ruhani liderlik ve rehberlik sağlarken, Jhatlar dünyevi liderliği sunar."

 fc_pan_moon:0 "Ay Şarkıcılarının Müritleri"

 fc_pan_moon_adj:0 "Ay Şarkıcıları"

 fc_pan_moon_adherent:0 "Dinleyici"

 fc_pan_moon_adherent_plural:0 "Dinleyiciler"

 fc_pan_moon_desc:0 "Özgür Topraklar'ın köleleri, hem Topraklar'ın fethettiği halklardan hem de sınırlarının ötesinden, doğrudan karşılaşılmayan diğerlerinden sayısız halktan oluşuyordu. Bu gruplardan biri, kaçak kölelerden oluşan bir grubu günümüzde Braavos olacak lagüne götüren Jogos Nhai Ay Şarkıcılarıydı. O zamandan beri Ay Şarkıcıları, gizli şehirde saygın ve etkili, küçük de olsa bir inanç olarak kalmıştır."

 song_nefer:0 "Dip'in Şarkıları"

 song_nefer_adj:0 "Dip'in Şarkıları"

 song_nefer_adherent:0 "Tarakçı"

 song_nefer_adherent_plural:0 "Tarakçılar"

 song_nefer_desc:0 "N'Ghailerin sonuncusu Nefer, toprağın derinliklerine çekilerek Jogos Nhai sürülerini geri tutabildi; burada Yerin Altınının Şarkıları sakinleri koruyup ısıttı. Çevrelerini saran toprak duvarların ritmini ve temposunu dinleyerek toprağın derinliklerinde genişlediler."

 song_mossovy:0 "Karın Şarkıları"

 song_mossovy_adj:0 "Karın Şarkıları"

 song_mossovy_adherent:0 "Monomakh"

 song_mossovy_adherent_plural:0 "Monomakh"

 song_mossovy_desc:0 "Uzak diyar Mossovy'nin tuhaf ve acayip bir yer olduğu söylenir. Toprak soğuğa ve kara kilitlidir, ancak yaşanmaz Daimi Kış Toprakları'nın aksine Mossovyalılar bu donmuş diyarda hayat bulur ve büyür. Onlara göre karlar ve kar fırtınaları şarkılar söyler; bu şarkılardan düzen kurup beslenirler."
