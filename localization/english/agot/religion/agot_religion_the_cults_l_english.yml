### TODO NOT-IN-ST: fc_pan_bearded_desc [AGOT: Unlike many of the other Free Cities cults, the Disciples of the Bearded God only acknowledge and worship their own god. The name of this god is secret only to their highest priests, but since only their priests are allowed beards, it has generally been called the Bearded God by outsiders. Indeed, the allowance of hair seems to be of import: only men are permitted to have hair on their heads, and only priests are allowed beards, while women are required to shave their heads bald.]
 fc_pan_bearded_desc:0 "Unlike many of the other Free Cities cults, the Disciples of the Bearded God only acknowledge and worship their own god. The name of this god is secret only to their highest priests, but since only their priests are allowed beards, it has generally been called the Bearded God by outsiders. Indeed, the allowance of hair seems to be of import: only men are permitted to have hair on their heads, and only priests are allowed beards, while women are required to shave their heads bald."
