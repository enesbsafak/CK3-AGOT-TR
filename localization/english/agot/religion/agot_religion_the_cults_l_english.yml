l_english:

 the_cults_religion:0 "Tanrıların Kültleri"

 the_cults_religion_adj:0 "Kültler"

 the_cults_religion_adherent:0 "Mürit"

 the_cults_religion_adherent_plural:0 "Müritler"

 the_cults_religion_desc:0 "Essos'taki Serbest Şehirler'in kültlerinin taptığı sayısız tanrı, oradaki insanlar kadar çeşitlidir. Her şehrin kendi başlıca tanrıları vardır ve yine de çoğu diğerlerini hoş karşılar."

 fc_pan_braavos:0 "Vhugyahar"

 fc_pan_braavos_adj:0 "Vhugyahar"

 fc_pan_braavos_adherent:0 "Mürit"

 fc_pan_braavos_adherent_plural:0 "Müritler"

 fc_pan_braavos_desc:0 "Müritler, Vhugyahar'ın, 'Panteonlar Panteonu'nun bütün erdemlerine inanırlar. Dünyanın tüm tanrıları ve inançları, insanların doğuştan gelen özgürlüğünü engellemeyecek şekilde tapınıldıkları sürece hoş karşılanır ve değer görür."

 fc_pan_faceless:0 "Çok Yüzlü Tanrı'nın Müritleri"

 fc_pan_faceless_adj:0 "Çok Yüzlü Tanrı"

 fc_pan_faceless_adherent:0 "Yüzsüz Adam"

 fc_pan_faceless_adherent_plural:0 "Yüzsüz Adamlar"

 fc_pan_faceless_desc:0 "Çok Yüzlü Tanrı, Tüm Ölümün Tanrısı'dır ve dünyada tapınılan diğer ölüm tanrıları aslında onun "yüzleri" ya da tecessümleridir. Yaşamak acı çekmektir ve Çok Yüzlü Olan, bu acıya merhametli bir son sunar."

 fc_pan_tyrosh:0 "Trios'un Tonları"

 fc_pan_tyrosh_adj:0 "Trios'un Tonları"

 fc_pan_tyrosh_adherent:0 "Mürit"

 fc_pan_tyrosh_adherent_plural:0 "Müritler"

 fc_pan_tyrosh_desc:0 "Çok eskiden, sayısız tanrının müritleri savaş sancakları ve ticaret sancakları altında birlikte çalışırdı. Bu iş birliği içinde, tanrılarının hakkı olan efendisi olarak Trios'u kayırıp savunmaya başladılar."

 fc_pan_lys:0 "İnci Tanrıçalar"

 fc_pan_lys_adj:0 "İnci Tanrıçalar"

 fc_pan_lys_adherent:0 "Mürit"

 fc_pan_lys_adherent_plural:0 "Müritler"

 fc_pan_lys_desc:0 "İnci Tanrıçalar'ın müritleri — Ağlayan Leydi, Pantera, Yyndros, Bakkalon ve Saagael'in önderlik ettiği bir tanrıça ve tanrı panteonu — güzelliği yüceltme ve gücün daha dişil yorumlarını yükseltme eğilimindedir."

 fc_pan_myr:0 "Altın Bahçeler"

 fc_pan_myr_adj:0 "Altın Bahçeler"

 fc_pan_myr_adherent:0 "Mürit"

 fc_pan_myr_adherent_plural:0 "Müritler"

 fc_pan_myr_desc:0 "Kutsal Altın Bahçeler'e inananlar, sözde güzelliklerini sıkı sıkıya saklanan bir sır olarak tutarlar. Gelenei ve kurulu, gizemli ritüeller ve esrarengiz kutsal metinlerle kutlanır."

 fc_pan_pentos:0 "Prensin Merhametleri"

 fc_pan_pentos_adj:0 "Prensin Merhametleri"

 fc_pan_pentos_adherent:0 "Mürit"

 fc_pan_pentos_adherent_plural:0 "Müritler"

 fc_pan_pentos_desc:0 "Büyük Prens, halkının iyiliği için seçilmiş bir vasıta aracılığıyla refah ve rehberlik sunar. Başkanlık ettiği panteon olan Merhametler, kutsamaları tükendiğinde vasıtanın hayatını bir haraç olarak talep edebilir."

 fc_pan_lorath:0 "Desen"

 fc_pan_lorath_adj:0 "Desen"

 fc_pan_lorath_adherent:0 "Mürit"

 fc_pan_lorath_adherent_plural:0 "Müritler"

 fc_pan_lorath_desc:0 "Desenci'nin öğretileri, gerçeğin büyük bir labirentin kalbinde yattığını söyler — her zaman duvarlarla ya da dönemeçlerle değil, seçimlerle, çelişkilerle ve vahiylerle işaretlenmiş bir labirent. Herkes onun dolambaçlı yollarında yürüyebilir, ancak yalnızca alçakgönüllülük ve sabır sahipleri hayatın değişken yollarında bilgelik bulabilir."

 fc_pan_volantis:0 "Miras"

 fc_pan_volantis_adj:0 "Miras"

 fc_pan_volantis_adherent:0 "Mürit"

 fc_pan_volantis_adherent_plural:0 "Müritler"

 fc_pan_volantis_desc:0 "Miras inancı, Valyria tanrılarının Kıyamet'le birlikte öldüğünü ve güçleriyle tahtlarının onları almaya layık olanlara geçtiğini söyler. Bu tanrılar ve müritleri — azimli, parlak ve boyun eğmez — geçmişin yaratımları olarak değil, meşru mirasçıları olarak görülür. Hürmet kökene değil, veraset zincirine sunulur."

 fc_pan_essaria:0 "Josimakazma'nın Müritleri"

 fc_pan_essaria_adj:0 "Josimakazma"

 fc_pan_essaria_adherent:0 "Mürit"

 fc_pan_essaria_adherent_plural:0 "Müritler"

 fc_pan_essaria_desc:0 "Yeniden ve Yeniden Yükselen Büyük Olan Josimakazma, müritlerini kendi bedeninden bir yıldız fırlatarak çok tanrılı Özgür Topraklar'ın kuzeyine yönlendirdi. Orada, yıldızın Büyük Issızlık tepelerine düştüğü yerde, günün birinde gökleri karartacak günahkârlardan uzakta, Güneş Tanrısı'na tüm saflıklarıyla tapınabilirlerdi."

 fc_pan_boash:0 "Boash'ın Müritleri"

 fc_pan_boash_adj:0 "Boash"

 fc_pan_boash_adherent:0 "Mürit"

 fc_pan_boash_adherent_plural:0 "Müritler"

 fc_pan_boash_desc:0 "Kör Tanrı Boash'a binlerce yıldır tapınılıyor. Müritleri et ve şarap tüketmemeyi içeren katı bir kurala uyar ve daha yüksek gerçeklerin ancak diğer iki göz yalnızca karanlık gördüğünde açılabilen Üçüncü Göz'le görülebileceğine inanır."

 fc_pan_blackgoat:0 "Kara Keçi'nin Müritleri"

 fc_pan_blackgoat_adj:0 "Kara Keçi"

 fc_pan_blackgoat_adherent:0 "Mürit"

 fc_pan_blackgoat_adherent_plural:0 "Müritler"

 fc_pan_blackgoat_desc:0 "Qohor'da tapınılan, diğer birçok inanç tarafından bir iblis olarak görülen karanlık bir tanrı olan Kara Keçi, tanrıyı yatıştırmak için gereken günlük kan kurbanlarıyla bilinir."

 fc_pan_bearded:0 "Sakallı Tanrı'nın Müritleri"

 fc_pan_bearded_adj:0 "Sakallı Tanrı"

 fc_pan_bearded_adherent:0 "Mürit"

 fc_pan_bearded_adherent_plural:0 "Müritler"

 fc_pan_bearded_desc:0 "Diğer Serbest Şehir kültlerinin çoğunun aksine, Sakallı Tanrı'nın Müritleri yalnızca kendi tanrılarını tanır ve ona taparlar. Bu tanrının adı yalnızca en yüksek rahiplerinin bildiği bir sırdır; ancak sakal bırakmasına yalnızca rahipler izinli olduğu için, dışarıdakiler tarafından genellikle Sakallı Tanrı olarak anılır. Gerçekten de saç izni önemli görünüyor: yalnızca erkeklerin başlarında saç taşımasına izin verilir, sakal yalnızca rahiplere serbesttir, kadınların ise başlarını tamamen kazımaları şarttır."
