 old_gods_btw_sas_desc:0 "Duvar'ın ötesindeki kıyıda, Eski Tanrılar'a tapınma doğal olarak denize yöneldi; bir zamanlar tapınmanın tümünde görülen vahşi ve ilkel yönlerin birçoğunu benimsedi."

