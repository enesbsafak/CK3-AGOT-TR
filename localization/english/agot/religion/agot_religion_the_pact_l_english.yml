 old_gods_btw_valyrian_desc:0 "Bazı kabileler, Eski Tanrılar'ın bazen et giyip insanların arasında yürüdüğüne inanır. Yanmış Adamlar, Ay Dağları'nda canlı alevlere hükmettiği söylenen, muhtemelen bir ejderha olan bir ateş cadısına tapar."

 old_gods_children:0 "Şarkının Eski Tanrıları"

 old_gods_children_adj:0 "Gerçek Eski Tanrılar"

 old_gods_children_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_children_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_children_desc:0 "İnsanlar onlara Ormanın Çocukları der, Devler [Glossary('woh dak nag gram', 'CHILDREN_FOREST_GLOSS')] diye söz eder; ama onlar kendilerine 'Dünyanın Şarkısını Söyleyenler' adını verdi. Eski Tanrılar'ı — Kışın ve Ormanın, Nehirlerin ve Tepelerin, Ayın ve Vadinin, Kayanın ve Altının, Tarlanın ve Korunun, Fırtınanın ve Dalganın, Kumulun ve Kumun, Dumanın ve Tuzun, Kırağının ve Ormanın, Karın ve Buzun, Dağın ve Taşın, Zirvenin ve Vadinin, Karanlığın ve Mağaranın, Denizin ve Kabuğun — anlamak ve onlara tapmak gerçek anlamda o şarkıdan doğar."
