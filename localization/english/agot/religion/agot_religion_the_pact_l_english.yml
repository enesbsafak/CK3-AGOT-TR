### TODO NOT-IN-ST: old_gods_fng_desc [AGOT: The Reach was the home of the Faith of the Seven for most of its history, yet it still maintains ties to the Old Gods. Tales of Garth Greenhand, the Living Throne of the Oakenseat, the Skinchangers by the Red Lake, and others, persist. These ties have been wholly embraced with the return of the worship of the Old Gods, although the influence of the Faith can still be seen in some of the tenets and traditions practiced in the Reach.]
 old_gods_fng_desc:0 "The Reach was the home of the Faith of the Seven for most of its history, yet it still maintains ties to the Old Gods. Tales of Garth Greenhand, the Living Throne of the Oakenseat, the Skinchangers by the Red Lake, and others, persist. These ties have been wholly embraced with the return of the worship of the Old Gods, although the influence of the Faith can still be seen in some of the tenets and traditions practiced in the Reach."
