### TODO NOT-IN-ST: old_gods_rng_desc [AGOT: The Westerlands has long been a sacred place for the worship of the Old Gods. It was here that Corlos showed mercy upon the lion cubs and was rewarded by the Old Gods. The worship of the Old Gods has begun anew in the region, adopting some traits from the Faith of the Seven, such as knighthood, while also embracing the core tenets of the Pact.]
 old_gods_rng_desc:0 "The Westerlands has long been a sacred place for the worship of the Old Gods. It was here that Corlos showed mercy upon the lion cubs and was rewarded by the Old Gods. The worship of the Old Gods has begun anew in the region, adopting some traits from the Faith of the Seven, such as knighthood, while also embracing the core tenets of the Pact."
