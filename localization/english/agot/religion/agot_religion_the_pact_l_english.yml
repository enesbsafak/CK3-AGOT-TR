l_english:

 the_pact_religion:0 "Yüzler Adası'nın Paktı"

 the_pact_religion_adj:0 "Pakt"

 the_pact_religion_adherent:0 "Pakt'ın İzleyeni"

 the_pact_religion_adherent_plural:0 "Pakt'ın İzleyenleri"

 the_pact_religion_desc:0 "Yüzler Adası Paktı, İlk İnsanlar ile Ormanın Çocukları arasındaki çatışmayı sona erdiren anlaşmadır. Westeros'a barışı getiren ve Eski Tanrılar'a tapınmayı insanlara tanıtan budur. Pakt bugüne dek korunmuştur ve İlk İnsanların kanı insanlığın damarlarında aktığı sürece de sürecektir."

 old_gods_wnw:0 "Kışın ve Ormanın Eski Tanrıları"

 old_gods_wnw_adj:0 "Eski Tanrılar"

 old_gods_wnw_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_wnw_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_wnw_desc:0 "Pakt'ın ardından benimsenen Eski Tanrılar'a tapınma, Kuzey'de Yedi Krallık'ın başka hiçbir yerinden daha uzun süre varlığını sürdürdü. Eski Tanrılar'a tapınma sadedir; Yediler İnancı'ndan çok daha kişiseldir; az sayıda buyruk ve hiçbir kutsal kitap yoktur. Tanrıları nasıl onurlandıracağı kişisel bir meseledir. Temel ilkeler, gölge ağaçlarının kutsallığı, misafir hakkının dokunulmazlığı ve yüreğin ağacının önünde edilen yeminlerin kutsallığıdır."

 old_gods_rnh:0 "Nehirlerin ve Tepelerin Eski Tanrıları"

 old_gods_rnh_adj:0 "Nehir Eski Tanrıları"

 old_gods_rnh_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_rnh_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_rnh_desc:0 "Kuzey'in dışında, Eski Tanrılar'a tapınmanın en büyük ikinci kalesi Nehir Toprakları'dır. Uyanıştan önce bile, Kuzey'den insanlar buraya yerleşirken önde gelen hanedanlar tapınmayı sürdürdü. Onların uygulamaları kuzeydeki komşularından farklıdır; güneydeki Yediler İnancı'yla harmanlanmıştır. Gölge ağaçlarının ve misafir hakkının kutsallığına ek olarak bu insanlar şövalyeliği de benimsedi; yeminleri bir septte değil, yüreğin ağacının önünde edilir."

 old_gods_mnv:0 "Ayın ve Vadinin Eski Tanrıları"

 old_gods_mnv_adj:0 "Vadi Eski Tanrıları"

 old_gods_mnv_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_mnv_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_mnv_desc:0 "Vadi ile Ay Dağları, Andallar tarafından fethedilen ilk yer ve Yediler İnancı'nın Westeros'ta kök saldığı ilk yer olsa da, İlk İnsanlara ve inançlarına dair hâlâ eski ve güçlü bağlar vardır. Bu nedenle bölge, Vadi halkının İnançlılar olarak bildiği pek çok gelenek ve hakkı korurken Eski Tanrılar'a tapınmaya dönüş yaşamıştır."

 old_gods_rng:0 "Kayanın ve Altının Eski Tanrıları"

 old_gods_rng_adj:0 "Batı Eski Tanrıları"

 old_gods_rng_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_rng_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_rng_desc:0 "Batı Toprakları uzun zamandır Eski Tanrılar'a tapınma için kutsal bir yerdir. Corlos'un aslan yavrularına merhamet gösterip Eski Tanrılar tarafından ödüllendirildiği yer burasıydı. Bölgede Eski Tanrılar'a tapınma yeniden başladı; şövalyelik gibi Yediler İnancı'ndan bazı özellikleri benimserken Pakt'ın temel ilkelerini de benimsiyor."

 old_gods_fng:0 "Tarlanın ve Korunun Eski Tanrıları"

 old_gods_fng_adj:0 "Reach Eski Tanrıları"

 old_gods_fng_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_fng_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_fng_desc:0 "Reach, tarihinin büyük bölümünde Yediler İnancı'nın yurduydu; yine de Eski Tanrılar'la bağlarını sürdürüyor. Yeşilel Garth'ın, Meşe Makamı'nın Yaşayan Tahtı'nın, Kızıl Göl kıyısındaki Deri Değiştirenlerin ve başkalarının hikâyeleri hâlâ yaşıyor. Eski Tanrılar'a tapınmanın dönüşüyle bu bağlar tamamen benimsendi; ancak İnancın etkisi, Reach'te uygulanan ilke ve geleneklerin bazılarında hâlâ görülebiliyor."

 old_gods_snw:0 "Fırtınanın ve Dalganın Eski Tanrıları"

 old_gods_snw_adj:0 "Fırtına Eski Tanrıları"

 old_gods_snw_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_snw_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_snw_desc:0 "Fırtına Toprakları, Ormanın Çocukları ile bağlarını uzun süre korudu; Kutsal Kardeşlik'e karşı savaşmak üzere ittifak kurmaları meşhurdur. Bu bağlar, bölgede Eski Tanrılar'a tapınmanın yeniden güçlenmesine yol açtı; yine de küçük halkın ve büyüklerin İnanç altında benimsediği geleneklerin bir kısmı korunuyor."

 old_gods_dns:0 "Kumulun ve Kumun Eski Tanrıları"

 old_gods_dns_adj:0 "Dorne Eski Tanrıları"

 old_gods_dns_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_dns_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_dns_desc:0 "Dorne, Çocukların Eski Tanrılar'ın yardımıyla en büyük işlerini gerçekleştirdiği yerdir. Andallar aşağı toprakların büyük bölümüne egemen olsa da, Eski Tanrılar'a olan bağlar varlığını sürdürdü. Şimdi Eski Tanrılar'a tapınma geri döndü; yalnızca İnancın değil, Ana'nın da yönlerini içine kattı."

 old_gods_sns:0 "Dumanın ve Tuzun Eski Tanrıları"

 old_gods_sns_adj:0 "Taç Toprakları Eski Tanrıları"

 old_gods_sns_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_sns_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_sns_desc:0 "Kara Su Koyu ve içindeki adalar, Westeros'un güneyinde uzun zamandır Eski Tanrılar'ın kalesi olmuştur; özellikle Çatlak Pençe Burnu ve sakinleri. Bu da, bölgeye yerleşen Valyrialıların ve İnancın yönlerini içine katan yaygın bir Eski Tanrılar tapınmasını beslemiştir."

