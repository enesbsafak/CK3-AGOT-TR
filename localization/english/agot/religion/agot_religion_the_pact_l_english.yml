### TODO NOT-IN-ST: old_gods_rnh_desc [AGOT: Outside of the North, the next greatest bastion of the worship of the Old Gods is the Riverlands. Even before the revival, as men from the North settled here, key houses kept the worship. Their practice differs from their northern neighbors, melding with the Faith of the Seven to the south. In addition to the sacredness of the weirwoods and guest right, these people have adopted knighthoods — whose oaths are sworn not in a sept, but before the heart tree.]
 old_gods_rnh_desc:0 "Outside of the North, the next greatest bastion of the worship of the Old Gods is the Riverlands. Even before the revival, as men from the North settled here, key houses kept the worship. Their practice differs from their northern neighbors, melding with the Faith of the Seven to the south. In addition to the sacredness of the weirwoods and guest right, these people have adopted knighthoods — whose oaths are sworn not in a sept, but before the heart tree."
