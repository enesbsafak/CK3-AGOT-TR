 old_gods_btw_fnf_desc:0 "Eski Tanrılar'la gerçek anlamda konuşup hissedebilmek ancak Duvar'ın ötesinde, Gerçek Kuzey'de mümkündür. Duvar'ın güneyinde toprak, Eski Tanrılar'ın fısıltılarını duyamayacak kadar ekilmiş, ormansızlaşmış ve uygarlaşmıştır."

