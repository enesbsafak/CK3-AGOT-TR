 old_gods_btw_pnv_desc:0 "Thennler, kalan tek gerçek İlk İnsan olduklarını ve Pakt'ı koruyup Eski Tanrılar'a doğru biçimde tapan yalnızca kendilerinin kaldığını öne sürer. [Glossary('Magnar', 'MAGNAR_GLOSS')], Eski Tanrılar'ın yanında görülür; yalnızca etten yapılmış bir tanrıdır, ötekiler taştan, dal parçasından ve nehirden yapılmışken."

