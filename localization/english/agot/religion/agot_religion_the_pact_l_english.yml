### TODO NOT-IN-ST: old_gods_mnv_desc [AGOT: Though the Vale and Mountains of the Moon were the first to be conquered by the Andals and the first place where the Faith of the Seven took root in Westeros, there are still old and strong ties to the First Men and their beliefs. As such, the region has seen a return to the worship of the Old Gods, while still maintaining many of the traditions and rights that the people of the Vale knew as the Faithful.]
 old_gods_mnv_desc:0 "Though the Vale and Mountains of the Moon were the first to be conquered by the Andals and the first place where the Faith of the Seven took root in Westeros, there are still old and strong ties to the First Men and their beliefs. As such, the region has seen a return to the worship of the Old Gods, while still maintaining many of the traditions and rights that the people of the Vale knew as the Faithful."
