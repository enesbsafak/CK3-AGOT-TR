 old_gods_btw_sni_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_btw_sni_desc:0 "Eski Tanrılar'a tapınma, Duvar'ın ötesindeki buz gibi yerlerde güçlüdür. Ancak izleyenleri tanrıları derelerin fısıltısında ya da yaprakların hışırtısında değil; buzun çatırtısında ve karın düşüşünde dinler. Donmuş topraklar soğuk ve ıssızdır; insanlar da tapınmaları gibi bu sert çevre tarafından biçimlenmiştir."

