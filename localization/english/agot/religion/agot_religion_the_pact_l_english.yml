 old_gods_btw_mns_adj:0 "Ay Eski Tanrıları"

 old_gods_btw_mns_adherent:0 "Eski Tanrıların Takipçisi"

 old_gods_btw_mns_adherent_plural:0 "Eski Tanrıların Takipçileri"

 old_gods_btw_mns_desc:0 "Eski Tanrılar'ı terk edip House Arryn'in Andal krallarına boyun eğmeyi reddedenler, Ay Dağları'nın yükseklerine ve vahşi doğasına kaçtı. Neredeyse her şeyi yitirmelerine rağmen tanrılara tapınmalarını ve yeminlerini sürdürdüler. Ovalıklara duydukları düşmanlık, tapınmalarını acımasız bir hale getirdi."

