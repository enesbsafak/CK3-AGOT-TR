 old_gods_btw_dnc_desc:0 "Aşağıda, Frostfang Dağları'nın mağaralarında ve tünellerinde yaşayanlar, başkaları ne düşünürse düşünsün hâlâ Eski Tanrılar'a tapar. Ancak tapınmaları yer üstündekilerinkinden çok daha karanlıktır; Eski Tanrılar'ın bu kolunda ölü ya da diri insan eti yemek serbesttir."

