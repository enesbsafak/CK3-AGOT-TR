### TODO NOT-IN-ST: old_gods_wnw_desc [AGOT: Adopted after the Pact, the worship of the Old Gods has persisted in the North more than in any other part of the Seven Kingdoms. The worship of the Old Gods is a simple one, much more personal than that of the Faith of the Seven — there are few commandments and no scriptures. How one honors the gods is a personal matter. The key tenets are the sacredness of the weirwoods, the sanctity of guest right, and the holiness of oaths sworn before the heart tree.]
 old_gods_wnw_desc:0 "Adopted after the Pact, the worship of the Old Gods has persisted in the North more than in any other part of the Seven Kingdoms. The worship of the Old Gods is a simple one, much more personal than that of the Faith of the Seven — there are few commandments and no scriptures. How one honors the gods is a personal matter. The key tenets are the sacredness of the weirwoods, the sanctity of guest right, and the holiness of oaths sworn before the heart tree."
