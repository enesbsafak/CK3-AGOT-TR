### TODO NOT-IN-ST: old_gods_dns_desc [AGOT: Dorne is where the Children worked their greatest of feats with the aid of the Old Gods. While the Andals came to dominate much of the lower lands, the ties to the Old Gods still lingered. Now, the worship of the Old Gods has returned, incorporating aspects not only of the Faith but also of the Mother.]
 old_gods_dns_desc:0 "Dorne is where the Children worked their greatest of feats with the aid of the Old Gods. While the Andals came to dominate much of the lower lands, the ties to the Old Gods still lingered. Now, the worship of the Old Gods has returned, incorporating aspects not only of the Faith but also of the Mother."
