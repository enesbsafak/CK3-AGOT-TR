l_english:

 the_orders_religion:0 "Yeşim ve Tarçın Tarikatları"

 the_orders_religion_adj:0 "Tarikatlar"

 the_orders_religion_adherent:0 "Tarikatçı"

 the_orders_religion_adherent_plural:0 "Tarikatçılar"

 the_orders_religion_desc:0 "Güneydoğu Tarikatlarının tanrıları ve ilahları olsa da, geleneksel anlamda din olarak kabul edilebilecek şeyin çok ötesindedirler. Her birinin felsefi çerçevesi tapınaklarının çok ötesine uzanır ve gerçekten de müntesiplerinin hayatlarının her yönüne işlemiştir."

 order_paradise:0 "Ebedi Cennet Tarikatı"

 order_paradise_adj:0 "Ebedi Cennet"

 order_paradise_adherent:0 "Ebediyetçi"

 order_paradise_adherent_plural:0 "Ebediyetçiler"

 order_paradise_desc:0 "Yeşim Denizi'nin güney adalarında ve Tarçın Boğazları'nda yaşayan halklar yalnızca tanrılara değil, ideallere ve kavramlara da taparlar. Bu ideallerden biri, dünyanın zevklerinin kurtuluşa açılan gerçek kapı olduğunu ve insanları dünyaya bağlayan ebedi döngüden kurtardığını öğreten Ebedi Döngü'dür."

 order_sting:0 "Son İğne Tarikatı"

 order_sting_adj:0 "Son İğne"

 order_sting_adherent:0 "Finalist"

 order_sting_adherent_plural:0 "Finalistler"

 order_sting_desc:0 "Yeşim Denizi'nin güney adalarında ve Tarçın Boğazları'nda yaşayan halklar yalnızca tanrılara değil, ideallere ve kavramlara da taparlar. Bu ideallerden biri, dünyadan kurtuluşun armağanı olarak görülen, suikast ve entrikalar üzerine kurulu kin dolu bir inanç olan Ölümcül Böcek'tir."

 order_spice:0 "Akan Baharat Tarikatı"

 order_spice_adj:0 "Akan Baharat"

 order_spice_adherent:0 "Akışçı"

 order_spice_adherent_plural:0 "Akışçılar"

 order_spice_desc:0 "Yeşim Denizi'nin güney adalarında ve Tarçın Boğazları'nda yaşayan halklar yalnızca tanrılara değil, ideallere ve kavramlara da taparlar. Bu ideallerden biri, insanlara gelecek ve uzayın doğası hakkında anlayış ve içgörü kazandırdığı söylenen kutsal bir baharatın tüketilmesi olan Akan Baharat'tır."

 order_cow:0 "Taş İnek Tarikatı"

 order_cow_adj:0 "Taş İnek"

 order_cow_adherent:0 "Taşçı"

 order_cow_adherent_plural:0 "Taşçılar"

 order_cow_desc:0 "Yeşim Denizi'nin güney adalarında ve Tarçın Boğazları'nda yaşayan halklar yalnızca tanrılara değil, ideallere ve kavramlara da taparlar. Bu ideallerden biri, tıpkı bir Taş İnek'in taştan süt vermesi gibi, bir maddenin diğerine dönüştürülmesi kavramını anlatan Taş İnek'tir."

 order_chain:0 "Zincirli Yara İzleri Tarikatı"

 order_chain_adj:0 "Zincirli Yara İzleri"

 order_chain_adherent:0 "Zincirci"

 order_chain_adherent_plural:0 "Zincirciler"

 order_chain_desc:0 "Yeşim Denizi'nin güney adalarında ve Tarçın Boğazları'nda yaşayan halklar yalnızca tanrılara değil, ideallere ve kavramlara da taparlar. Bu ideallerden biri, dünyadan kaçmanın tek yolunun köle olup başkalarına hizmet ederek kendini tamamen alçaltmak olduğunu öğreten Zincirli Olan'dır."
