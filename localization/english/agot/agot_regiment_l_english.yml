﻿﻿﻿﻿﻿l_english:

 winter_wolves:0 "Kış Kurtları"

 winter_wolves_flavor:0 "Yıllarca süren derin karlarla kaplı bir toprakta, günü belirleyen çoğu zaman süvariler değil ağır piyadelerdir; ancak bu Kuzeyli savaşçılar her savaş alanında kendilerini evlerinde gibi hisseder."

 wolfswood_hunters:0 "Kurtağacı Avcıları"

 wolfswood_hunters_flavor:0 "Kurtağacı'nın uçsuz bucaksızlığı yalnızca vahşi hayvanlara değil, onları avlayarak geçimini sağlayan adamlara da ev sahipliği yapar. Savaş alanında bu adamlar kurnaz okçular olurlar."

 clan_champions:0 "Klan Şampiyonları"

 clan_champions_flavor:0 "Doğası gereği kavgacı bir halk olan Kuzey'in dağ klanları, deneyimli savaşçılardan oluşan müthiş alaylar çıkarabilir."

 barrow_knights:0 "Barrow Şövalyeleri"

 barrow_knights_flavor:0 "Güneyli benzerlerine göre daha sade zırhlı olsalar da, Barrow Toprakları'nın ağır süvarileri en disiplinli düzenler dışında herkesi hızla halledebilir."

 unicorn_riders:0 "Tekboynuz Binicileri"

 unicorn_riders_flavor:0 "Birçokları tarafından gerçekten çok efsane sanılan Skagos tekboynuzları, üzerlerine binen adamlar kadar dayanıklı, sağlam ayaklı yaratıklardır. Savaş alanında görülmesi korkunç bir manzaradır."

 cape_watch:0 "Cape Muhafızları"

 cape_watch_flavor:0 "Cape Kraken uzun zamandır Demirdoğanlar ile Kuzeyliler arasında bir savaş alanı olmuştur ve buradaki savaşçılar her iki tarafın askeri geleneklerinden beslenir."

 frog_spears:0 "Kurbağa Mızrakları"

 frog_spears_flavor:0 "Geleneksel silahları olan kurbağa mızrağıyla avlanan bu hafif silahlı birlikler, kendilerine av olan herkes için bir tehdittir."

 green_hand:0 "Yeşil El Şövalyeleri"

 green_hand_flavor:0 "Reach'li bir kral tarafından kurulan kadim bir tarikatın son kalıntısı olan bu kuzeyli şövalyeler, güney şövalyelik anlayışını ve taktiklerini piyade düzenlerine karşı yıkıcı bir etkiyle kullanırlar."

 bronze_cavalry:0 "Bronz Süvariler"

 bronze_cavalry_flavor:0 "İlk İnsanlar Günbatımı Toprakları'nı toynak ve bronzla fethetti — ve bir kez daha fethedecekler."

 ironborn_reavers:0 "Akıncılar"

 ironborn_reavers_flavor:0 "Westeros kıyılarının belası olan bu korkunç ağır piyadeler, daha hafif silahlı yaya askerler için ciddi bir tehdit oluşturur."

 black_blood_cavalry:0 "Kara Kan Süvarileri"

 black_blood_cavalry_flavor:0 "Demir adamlar yeşil topraklara gelip istediklerini alırken, adalardaki soydaşları gibi uzun tekneler ve akıncılara artık güvenemezler. Yeşil topraklarda at onların teknesi, Kara Kan Süvarileri ise akıncıları olacak."

 royal_crossbowmen:0 "Kraliyet Arbaletçileri"

 royal_crossbowmen_flavor:0 "Arbaletler geleneksel yaylardan daha az eğitim gerektirir ancak en kaliteli zırhları kolayca deler, ağır piyade ve süvarilerin avantajını etkisiz kılar."

 marsh_walkers:0 "Bataklık Gezgini"

 marsh_walkers_flavor:0 "Andal İstilası'nın Crackclaw Burnu'nu fethedememesi yalnızca zorlu araziye değil, bu araziden faydalanan hafif silahlı savaşçılara da bağlıydı. Bu alaylar, vur-kaç taktikleri mirasını büyük bir etkinlikle sürdürür."

 dragonguard:0 "Ejderha Muhafızları"

 dragonguard_flavor:0 "Ejderha Muhafızları, Targaryen Hanedanı'nın ve Dar Deniz'in diğer Yüksek Valyria lordlarının hizmetine yeminli, ağır silahlı ve ağır zırhlı adamlardır."

 sea_snakes:0 "Deniz Yılanları"

 sea_snakes_flavor:0 "Blackwater Körfezi adalarından gelen ve deniz çatışmalarının kaosuna alışkın olan bu alayların çevikliği ve saldırganlığı, hem kovalamada hem geri çekilmede işlerine yarar."

 winged_knights:0 "Kanatlı Şövalyeler"

 winged_knights_flavor:0 "Westeros'ta Andal kültürünün doğduğu yer olan Vale, kökleri bin yıllara uzanan gururlu bir şövalyelik geleneğine ev sahipliği yapar. Vale şövalyeleri piyade düzenleri için neredeyse durdurulamazdır."

 finger_scouts:0 "Parmak İzcileri"

 finger_scouts_flavor:0 "Hücumları daha ağır zırhlı şövalyelerinki kadar yıkıcı olmasa da, Parmaklı süvarilerinin hızı onları daha yavaş düzenleri korumak ve kaçan düşmanları kovalamak için paha biçilmez kılar."

 hunters_of_the_moon:0 "Ay Avcıları"

 hunters_of_the_moon_flavor:0 "Az maliyetli teçhizat gerektiren bu Ay Dağları okçuları, hafif zırhlı piyadelere karşı etkili bir karşılıktır."

 sistermen_pirates:0 "Kızkardeş Korsanları"

 sistermen_pirates_flavor:0 "Neredeyse yönetilemez sayılan Üç Kızkardeş korsanları, savaş alanında çevik ve baş belası bir güçtür."

 summer_knights:0 "Yaz Şövalyeleri"

 summer_knights_flavor:0 "Reach'in şövalyeleri barış zamanında görülmeye değer güzel bir manzara, savaş zamanında ise piyadeler için dehşet verici bir düşmandır."

 honeywine_quirrels:0 "Balşarabı Ciritleri"

 honeywine_quirrels_flavor:0 "Reach'li arbaletçiler, şövalyelerin ve ağır piyadelerin plaka zırhlarına karşı koymak için çok uygundur; ancak sıradan okçulardan daha pahalıya donatılırlar."

 misty_shields:0 "Sisli Kalkanlar"

 misty_shields_flavor:0 "Kalkan Adaları'ndan gelen bu alaylar, en korkunç Demirdoğan akıncılarına karşı savaşta sınanmıştır ve akınlara anında karşılık vermeye hazır olmalıdır."

 arbor_marines:0 "Arbor Deniz Piyadeleri"

 arbor_marines_flavor:0 "Redwyne filosunun gemilerinde savaşmaya alışkın olan bu hafif zırhlı alaylar, usta çatışmacılardır."

 river_bows:0 "Nehir Yayları"

 river_bows_flavor:0 "Nehir Toprakları'nın okçuları, savaş alanındaki değişen koşullara hızla tepki verebilen ve düşman piyade düzenlerini her yanlış adım için cezalandırabilen hafif ve çevik bir güçtür."

 storm_knights:0 "Fırtına Şövalyeleri"

 storm_knights_flavor:0 "Vatanlarının adını aldığı gök gürültüsü gibi, Fırtına Toprakları'nın şövalyeleri hücuma geçtiklerinde toprağı da adamı da sarsar."

 marcher_longbowmen:0 "Marcher Uzunyaycıları"

 marcher_longbowmen_flavor:0 "Dorne Sınır Bölgeleri'nin gururlu bir geleneğini sürdüren bu savaşçılar, yavaş hareket eden piyade düzenlerini bozmak için güçlü uzun yaylar kullanır."

 rain_bringers:0 "Yağmur Getirenler"

 rain_bringers_flavor:0 "Bazılarınca onursuz bir silah sayılan arbaletleri, Batı Toprakları'nın adamları savaş alanında — ya da başka yerlerde — kullanmakta hiçbir beis görmez."

 greenblood_oars:0 "Yeşilkan Kürekçileri"

 greenblood_oars_flavor:0 "Yeşilkan üzerindeki sallarda kıt kanaat bir geçim sağlayan bu savaşçılar, yine de kadim Rhoyne'lu atalarına dair gururlu anılar taşır."

 sun_spears:0 "Güneş Mızrakları"

 sun_spears_flavor:0 "Dorne'un eğilmez mızrakları, hafif ya da ağır — hatta fil — fark etmeksizin her tür süvari için inatçı ve tehlikeli bir düşman oluşturur."

 sand_steeds:0 "Kum Binekleri"

 sand_steeds_flavor:0 "Güzellikleri ve zarafetleriyle ünlü Dorne kum binekleri, dünyanın en hızlı atları arasındadır, ancak dayanıklılıkları da aynı derecede etkileyicidir. Savaşta Dorne hafif süvarileri, daha yavaş düşmanları kanattan çevirme ve kovalama konusunda rakipsizdir."

 pass_pikes:0 "Geçit Kargıları"

 pass_pikes_flavor:0 "Yüzyıldan fazla bir süre Targaryen istilalarına karşı dağ geçitlerini tutan Dorneluların soyundan gelen bu savaşçılar, her tür süvariye karşı gururla dikilir."

 she_bears:0 "Dişi Ayılar"

 she_bears_flavor:0 "Ayı Adası'nın kadınları, ana karadaki benzerlerine kıyasla sert ve dayanıklı yetişmiştir — ve bir Demir adamın kafatasını ikiye ayırmaya fazlasıyla muktedirdir."

 stolen_spears:0 "Çalınmış Mızraklar"

 stolen_spears_flavor:0 "Ova askerlerinden daha ilkel donanımlı olsalar da, dağ klanlarının mızraklıları nefret ettikleri Andal düşmanlarının atlarını şişlemekten zevk alır."

 bronze_raiders:0 "Bronz Akıncılar"

 bronze_raiders_flavor:0 "Thenn Vadisi'nin engebeli tundrasından gelen Bronz Akıncılar, yerli yapımı metal silahlar kullanan birkaç Yabanıl askerden biridir. Etkileyici donanımlarının yanı sıra Bronz Akıncılar savaşta korkunçtur — Sur'un kuzeyinde bulunan nadir ağır piyadelerdendir."

 sons_of_gendel:0 "Gendel'in Oğulları"

 sons_of_gendel_flavor:0 "Gorne ve Gendel Kuzey'i işgal ettiğinde, adamlarının tamamı yer üstüne geri dönemedi. Birçoğu bunun yerine toprağın altında kaldı ve en ölümcül savaşçıları artık kendilerine Gendel'in Oğulları diyor."

 fire_flingers:0 "Ateş Atanlar"

 fire_flingers_flavor:0 "Frostfangs'ta yaşamak, ölümle günlük bir savaştır ve ateş en önemli silahtır. Ancak ateş yalnızca doğaya karşı değil, başkalarına karşı savaşmak ve kamplarını yok etmek için de kullanılır."

 cannibal_bows:0 "Yamyam Yayları"

 cannibal_bows_flavor:0 "Buz Nehir Klanları, yamyamlık eğilimleri nedeniyle kuzeyin uzak diyarlarında korkulur ve okçuları, potansiyel akşam yemeklerini öldürmeden sabitlemekte ustadır."

 bat_catchers:0 "Yarasa Avcıları"

 bat_catchers_flavor:0 "Gecekoşanları'nın savaşçıları çocukluktan itibaren geceleri yarasa yakalayarak eğitilir, sessiz ve hızlı hareket etmeyi öğrenir; bu yüzden diğer kabileler onlara Yarasa Avcıları der."

 wildling_raiders:0 "Yabanıl Akıncılar"

 wildling_raiders_flavor:0 "Sur'un ötesinde yaşam zordur ve topraklar soğuktur. Hayatta kalmak için insanlar yiyecek, silah ve hatta eş için birbirine akın düzenler. Yabanıllar için akın yapmak yaşamın ta kendisidir."

 dogsled_chariots:0 "Köpek Kızağı Savaş Arabaları"

 dogsled_chariots_flavor:0 "Donmuş Kıyı'da kabileler ve adamlar, doğudaki adamların savaş arabaları kullandığı gibi köpeklerin çektiği kızaklar kullanır. Buz tabakaları ve kar tepeleri üzerinde bundan daha büyük bir tehdit yoktur."

 black_soles:0 "Kara Tabanlar"

 black_soles_flavor:0 "Hornfootlar, Sur'un ötesinde ayakkabı giymemeleriyle ünlüdür. Ayakları donmadan kararır ve onları güçlü, soğuk ve boyun eğmez savaşçılara dönüştürür."

 ice_skatters:0 "Buz Kıranlar"

 ice_skatters_flavor:0 "Uzak kuzeyde, Hayalet Ormanı'nın ötesinde, devasa donmuş göllerin üzerinde insanlar uçsuz bucaksız buz tabakaları üzerinde savaşır. Ayaklarına metal ya da kemik bıçaklar takarak buzun üzerinde uçtukları söylenir."

 cairn_wardens:0 "Cairn Muhafızları"

 cairn_wardens_flavor:0 "Sur'un ötesindeki yabanılları birleştiren çok az şey vardır; ancak Süt Suyu Vadisi'ndeki krallarının ve kahramanlarının tümülüslerine duyulan ortak saygı bunlardan biridir. Ölülere saygısızlık edenlerle Cairn Muhafızları ilgilenir."

 purple_marines:0 "Mor Deniz Piyadeleri"

 purple_marines_flavor:0 "Braavos, Özgür Şehirler arasındaki ikinci büyük güçtür ve başlıca güç kaynağı donanmasıdır. Lagündeki salyangozlardan elde edilen boyayla renklendirilmiş mor yelkenler, o şehrin deniz piyadelerini denizlerin ötesine taşır."

 indentured_legion:0 "Borç Esiri Lejyonu"

 indentured_legion_flavor:0 "Adı dışında her şeyiyle köleleştirilmiş Pentos'un 'lejyon' çatışmacıları isteksiz ve motivasyonsuzdur; yalnızca, olmamayı göze alamadıkları için hizmet ederler."

 sun_guard:0 "Güneş Muhafızları"

 sun_guard_flavor:0 "Kayıp Özgür Şehir Essari'nin muhafızı. Şehir yeniden inşa edilip geri döndüğüne göre, güneş ışığı Güneş Muhafızları'nın altın kalkanlarında parlıyor."

 moroshi_pikes:0 "Morosh Kargıları"

 moroshi_pikes_flavor:0 "En küçük ve çoğu zaman unutulan Özgür Şehir olmasına rağmen Lorath, Sarne'in ağzındaki kolonilerini ve müttefiklerini koruyan güçlü bir muhafız bulundurur. Diğer şehirler Dothrakileri parayla savuştururken, Lorath Morosh'u mızrak ve kargıyla korumak zorunda kalmıştır."

 stair_guard:0 "Merdiven Muhafızları"

 stair_guard_flavor:0 "Sakallı Rahipler'in Kutsal Muhafızları karşısında çoğu zaman gözden kaçan Norvos şehir muhafızları, adını Norvos'un alt ve üst şehirlerini birbirine bağlayan ve yerlilerin Günahkar Basamakları dediği büyük merdivenden alır."

 cohort_of_the_three_thousand:0 "Üç Bin'in Kohortu"

 cohort_of_the_three_thousand_flavor:0 "Qohor doğunun ordularınca tehdit edildiğinde onları kurtaran özgür birlikler, yerel askerler ve hatta Özgür Şehir müttefikleri değildi. Hayır — at efendilerini on sekiz kez geri püskürten, Astapor'un üç bin köle askeri, Temizlenmişler'di. Üç Bin, o günden beri şehri koruyor."

 disputant_scouts:0 "İhtilaf İzcileri"

 disputant_scouts_flavor:0 "Bir zamanlar büyük Valyria Özgür Diyarı'nın ambarı olan, şimdi İhtilaflı Topraklar olarak bilinen bölge, Hartalari halkına ev sahipliği yapar. Üç Kız'ın büyük ordularından kaçmaya alışkın olan izcileri hızlı ve sessizdir."

 weeping_guard:0 "Ağlayan Muhafız"

 weeping_guard_flavor:0 "Lys'in özgür adamları silah ve zırhı kendilerine yakıştırmaz; bu yüzden şehrin güvenliğini Ağlayan Muhafız sağlar — Güzel Lys'i korumaya yeminli, egzotik silahlarla donanmış kölelerden oluşan ağır piyadeler."

 myrish_crossbows:0 "Myr Arbaletleri"

 myrish_crossbows_flavor:0 "Bazılarınca korkakça sayılsa da, Myr'lıların kullandığı arbaletler kullanımı basit ve savaşta yıkıcıdır — bu da bu tür düşünceleri dağıtmalarını sağlar."

 ornate_helms:0 "Süslü Miğferler"

 ornate_helms_flavor:0 "Ana şehirlerinin işlemeli miğferleriyle donanmış Süslü Miğferler, İhtilaflı Topraklar'daki savaşlarıyla ünlü bir kargıcı birliğidir."

 slave_legion:0 "Köle Lejyonları"

 slave_legion_flavor:0 "Büyük Valyria Özgür Diyarı, kan büyüsü ve ejderha ateşiyle — ve kölelerin sırtında — inşa edildi. Ejderha binicilerinin ya da kan büyücülerinin doğrudan bulunmadığı yerlerde, Özgür Diyar'ın köle lejyonları bulunurdu."

 tiger_cloaks:0 "Kaplan Pelerinleri"

 tiger_cloaks_flavor:0 "Volantis'in ve bağlı topraklarının muhafızı olan Kaplan Pelerinleri, keskin mızrakları ve gümüş zincir zırhlarıyla triarkların iradesini yerine getirmeye adanmış köle askerlerdir."

 black_wall_chariots:0 "Kara Sur Savaş Arabaları"

 black_wall_chariots_flavor:0 "Volantis'in Eski Kanı kendini şehrin geri kalanından ayrı tutar ve görkemini Kara Surlar'ın üzerindeki yıllık savaş arabası yarışıyla sergiler — ölümcül savaş makineleri için eğitim görevi de gören bir gösteri."

 dragonsworn:0 "Ejderhaya Bağlılar"

 dragonsworn_flavor:0 "Boyalı Dağlar'ın Senrillian kabileleri korkunç ve vahşi bir halktır; en büyük savaşçıları da farklı değildir. Kendilerini ejderha tanrılarından birinin şampiyonu olarak gören bu savaşçılar, her düşmanı kovalar ve büyük kılıçlarıyla öldürür."

 demon_guards:0 "İblis Muhafızları"

 demon_guards_flavor:0 "Mantarys halkı, yaşadıkları topraklara çok benzer — çarpık ve lanetli. Muhafızları bu korkunç ünü kendi lehlerine kullanır, grotesk ve dehşet verici maskeler takar."

 elyrian_sailors:0 "Elyria Denizcileri"

 elyrian_sailors_flavor:0 "Elyria'nın denizcileri yalnızca Köleci Körfezi'nde değil, ötesindeki sularda da seyreder; körfez şehirlerinden eğitimli köleleri Lys ve Volantis'e taşır, yalnızca eğitimsiz kölelerle dönüp döngüyü tekrarlar."

 tolosi_slingers:0 "Tolos Sapancıları"

 tolosi_slingers_flavor:0 "Tolos sapancıları, ölümcül isabetleriyle Essos'un dört bir yanında ünlüdür. Bir ejderhayı iki gözüne de isabet ettirerek yere serebilecekleri söylenir."

 pit_fighters:0 "Çukur Dövüşçüleri"

 pit_fighters_flavor:0 "Meereen'in dövüş çukurları, Eski İmparatorluk topraklarında ünlüdür ve bu çukurlardan çıkan dövüşçüler acımasız ve zalimdir."

 collared_bows:0 "Tasmalı Yaylar"

 collared_bows_flavor:0 "Yunkai, köleleri savaş sanatları konusunda eğitmesiyle bilinmez; yine de orada bile köleler şehri korumak için eğitilir — yalnızca yaylarla da olsa."

 unsullied:0 "Temizlenmişler"

 unsullied_flavor:0 "Astapor'un köle lejyonları olan Temizlenmişler, Kızıl Şehir'in Grazdan ve Eski İmparatorluk'un adım adım yürüyen lejyonlarını yeniden yaratma girişimidir."

 lockstep_legion:0 "Uyumlu Adım Lejyonu"

 lockstep_legion_flavor:0 "Eski Gis İmparatorluğu, Büyük Grazdan ve onun Uyumlu Adım Lejyonları tarafından kuruldu; disiplinleri sayesinde Gis, birçok savaşta Valyria'yı ve ejderhalarını tehdit edebildi."

 iron_legion:0 "Demir Lejyon"

 iron_legion_flavor:0 "Astapor, Uyumlu Adım Lejyonları'nı kölelerle yeniden yaratmayı denerken, Yeni Gis Grazdan'ın öğretilerini izlemeyi seçerek azatlıları — şehrin hayatta kalmasında çıkarı olanları — kullandı ve Demir Lejyonları sadık ve disiplinli kıldı."

 star_carved:0 "Yıldız Kazılılar"

 star_carved_flavor:0 "Andal savaşçıları, Bir Olan Yedi'ye olan inançlarını göstermek için ellerinde demir ve alınlarına kazınmış yıldızlarla savaşa giderdi."

 qarlons_fallen:0 "Qarlon'un Düşenleri"

 qarlons_fallen_flavor:0 "Essos'taki son Andal kralı olan Büyük Qarlon, halkını Essos'un kuzeyindeki savaşlara ve fetihlere önderlik etti. Andallar bugün hâlâ onun öğrettiği taktik ve geleneklere göre savaşır."

 smiths_axes:0 "Demircinin Baltaları"

 smiths_axes_flavor:0 "Balta Andal'larının adını silahtan mı yoksa silahın adını onlardan mı aldığı belirsizdir, ancak bu savaşçılar kılıçtan çok büyük baltaları tercih eder."

 mother_sworn:0 "Ana'ya Yeminliler"

 mother_sworn_flavor:0 "Büyük Rhoyne nehri üzerinde yaşayanlar, hayatlarını Ana'ya adar ve onu son nefese kadar savunurlar."

 festival_guards:0 "Festival Muhafızları"

 festival_guards_flavor:0 "Chroyane, yıl boyunca şehrin her yanında düzenlenen görkemli festivalleriyle ünlüdür ve muhafızları — parıldayan çelik zırhlar ve yüksek miğferlerle donanmış — başlı başına bir görsel şölendir."

 shrouded_guard:0 "Kefenli Muhafızlar"

 shrouded_guard_flavor:0 "Sorrows'un Taş Adamları, Rhoyne boyunca korkulan bir varlıktır, zira dokunuşları ölüm cezasıdır."

 flower_spears:0 "Çiçek Mızrakları"

 flower_spears_flavor:0 "Rhoyne'in doğu kıyısındaki solgun şehir, sayısız çiçeğiyle bilinir ve çoğu zaman çiçeklerle süslenen uzun mızraklarıyla ünlü bir kuvvet tarafından korunur."

 green_daggers:0 "Yeşil Hançerler"

 green_daggers_flavor:0 "Qhoyne kıyısında yer alan Ar Noy, yeşil mermer kuleleri ve surlarıyla bilinir. Denizcileri, adlarını aldıkları Qhoyne ve Hançer Gölü'nde devriye gezer."

 garden_guard:0 "Bahçe Muhafızları"

 garden_guard_flavor:0 "Ana Nehir'in ağzındaki büyük Rhoynar limanı Sarhoy, adını şehrin ünlü tuzlu su bahçelerinden alan Bahçe Muhafızları tarafından korunurdu."

 grey_spears:0 "Gri Mızraklar"

 grey_spears_flavor:0 "Ny Sar, diğer Rhoynar şehirlerinden daha fazla olmak üzere, uzun bir askeri mücadele geçmişine sahiptir. Kıllı Adamları Noyne'dan süren Gri Prens Garris'ti ve şehir muhafızları adını ondan aldı."

 market_guard:0 "Pazar Muhafızları"

 market_guard_flavor:0 "Köle ticareti Giskar şehirlerine büyük zenginlik getirdi; hiçbirine Hazdahn Mo'dan fazla değil. Ancak rakip tüccarlar arasında öfkeler sıkça alevlenir ve köle isyanı tehdidi her an mevcuttur — bu yüzden Pazar Muhafızları'na ihtiyaç vardır."

 skahazdahn_wardens:0 "Skahazadhan Muhafızları"

 skahazdahn_wardens_flavor:0 "Skahazadhan Nehri, Gis'in kalbini büyük ovalardaki uzak karakollarına bağlar. Nehir devriye edilmeli ve korunmalıdır, zira ovalardaki köleler eğitim veya satış için körfeze gönderilmelidir."

 dothraki_archers:0 "Dothraki Okçuları"

 dothraki_archers_flavor:0 "Tüm khalasar savaşçıları gibi atlı olan Dothraki okçuları, şaşmaz bir isabete sahiptir. Pek çok orduyu, şehri ve krallığı yıkıma uğratmışlardır."

 shepherds:0 "Çobanlar"

 shepherds_flavor:0 "Çobanların sürülerini koruduğu gibi, bu adamlar da Lhazareen halkını geniş dünyanın tehlikelerinden korur."

 tribute_guards:0 "Haraç Muhafızları"

 tribute_guards_flavor:0 "Omber'in başarısının büyük kısmı ödediği haraçlara bağlıdır — hem birbirlerine hem dış tehditlere — bu yüzden bu sunular her ne pahasına olursa olsun korunur."

 sarsfield_horse_archers:0 "Sarsfield Okçuları"

 sarsfield_horse_archers_flavor:0 "Bu seçkin atlı okçu maiyeti, Sarsfield Hanedanı'na armalarının vücut bulmuş hali olarak hizmet eder — efendilerinin gönderdiği yere amansızca süzülürler."

 caravan_guards:0 "Kervan Muhafızları"

 caravan_guards_flavor:0 "Büyük Çimen Denizi'ni geçmek — Sarne kıyısındaki yerleşik bölgelerde bile — kolay bir iş değildir ve kervanlar, kendilerine saldırmak isteyenlere karşı iyi korunmalıdır."

 cymmeri_iron_shirts:0 "Cymmeri Demir Gömlekleri"

 cymmeri_iron_shirts_flavor:0 "Demir ustalıkları ve ondan dövdükleri zincir zırhlarla ünlü Cymmeriler, Büyük Çimen Denizi'nin çoğu göçebe halkından daha iyi korunur."

 gipp_wicker_shields:0 "Gipp Hasır Kalkanları"

 gipp_wicker_shields_flavor:0 "Büyük Çimen Denizi'nde hız çoğu zaman en büyük avantajdır. At sırtı yerine yaya savaşsalar da, hasır kalkanlar bu savaşçıların dikkat çekici bir çeviklikle hareket etmesini sağlar."

 zoqora_chariots:0 "Zoqora Savaş Arabaları"

 zoqora_chariots_flavor:0 "Zoqoralar, Büyük Çimen Denizi'nde hızla ilerleyen ve önlerine çıkan herkesi biçen büyük savaş arabalarıyla ünlüdür."

 lake_wardens:0 "Göl Muhafızları"

 lake_wardens_flavor:0 "Goraez Bataklığı'nın Göl Muhafızları, hem şehirlerini hem de Gümüş Deniz'in son kalıntılarından biri olan büyük gölü korumaya yeminlidir."

 library_guard:0 "Kütüphane Muhafızları"

 library_guard_flavor:0 "Sallosh'un Kütüphane Muhafızları, şehrin geniş ve kadim bilgi hazinesini savunmaya yönelik sarsılmaz bağlılıklarıyla ünlüdür."

 silver_shields:0 "Gümüş Kalkanlar"

 silver_shields_flavor:0 "Askerler Şehri'nin ünlü Gümüş Kalkanları, tüm Sarnor'un en disiplinli ve çalışkan savaşçıları olarak bilinir."

 clan_raiders:0 "Klan Akıncıları"

 clan_raiders_flavor:0 "Brandon Suru'nun kuzeyinde yakalanan adamlar, daha sıcak ve daha uysal topraklardan koparıldı ve klanlar hayatta kalmak için birbirlerine akın düzenlemek zorunda kaldı."

 scythed_chariots:0 "Tırpanlı Savaş Arabaları"

 scythed_chariots_flavor:0 "Tagaez Fen, Sarnor'un Uzun Adamları, birçok kadim mirasın varisiydi. Büyük Çimen Denizi'nde korkulan tırpanlı savaş arabalarını kullanma geleneğini sürdürdüler."

 shining_cataphracts:0 "Parlayan Katafraktlar"

 shining_cataphracts_flavor:0 "Sathar'ın Parlayan Katafraktları, düşmanlarının üzerine paramparça olmuş taşa düşen bir şelale gibi çarpılır."

 coin_collectors:0 "Sikke Toplayıcıları"

 coin_collectors_flavor:0 "Rathylar'da sikke kraldır ve onu toplamakla görevli olanlar çoğu zaman her yönden tehlikeyle karşı karşıya kalır; bu da silahlanmayı zorunlu kılar."

 temple_guardians:0 "Tapınak Muhafızları"

 temple_guardians_flavor:0 "Kyth'in tapınak muhafızları, tanrıların evlerini savunma kutsal görevinde sebatla dururlar."

 hill_runners:0 "Tepe Koşucuları"

 hill_runners_flavor:0 "Hornoth'un Tepe Koşucuları, şehrin topraklarını ve diyarlarını gözetleyen uyanıklıklarıyla bilinir."

 firstborne:0 "İlk Doğanlar"

 firstborne_flavor:0 "Sarys şehrinde, her ilk doğan yurttaşın onuru, şehrin savunmasında surlarda hizmet etmektir."

 lastborne:0 "Son Doğanlar"

 lastborne_flavor:0 "Sarnorilerin son şehri olan Saath'ın savunucuları, kadim mirası son ayakta tutanlar oldukları için kendilerine Son Doğanlar der."

 ar_archers:0 "Ar Okçuları"

 ar_archers_flavor:0 "Nonteloshiler, yalnızca coğrafi olarak değil askeri açıdan da Myr ile Pentos arasında sıkışmıştır. Myrlılar gibi arbaletleri seri üretme imkanları olmasa da, mükemmel okçular çıkarırlar."

 civic_guard:0 "Şehir Muhafızları"

 civic_guard_flavor:0 "Qarth'un Saf Doğanları, diğer diyarların barbarları gibi atlara binmez. Bunun yerine çok daha üstün bir binek olan develere binerler. Bu, bu topraklara geldiklerinden beri Şehirlerin Kraliçesi'ni korumalarını ve yönetmelerini sağlamıştır."

 pale_cavalry:0 "Solgun Süvariler"

 pale_cavalry_flavor:0 "Qaathiler kuzeyin ovalarından geldi. O bölgenin birçok halkı gibi atçılıkla bilinirlerdi; Qaathiler sabino atlarına değer verirdi."

 gate_sailors:0 "Kapı Denizcileri"

 gate_sailors_flavor:0 "Yeşim Kapılar'ın hemen içinde yer alan Qal, çoğu zaman Qarth'un kapılar üzerindeki hakimiyetini savunduğu kale olmuştur."

 port_guard:0 "Liman Muhafızları"

 port_guard_flavor:0 "Ibbenliler denize çağrılır ve bu yüzden büyük makamları büyük ya da küçük limanlar olma eğilimindedir; bu da liman muhafızlarını sahip oldukları en yakın profesyonel asker konumuna getirir."

 mountain_spears:0 "Dağ Mızrakları"

 mountain_spears_flavor:0 "Adalarının içlerine göçen Ibbenliler, insanlardan çok ayılarla ve diğer tehditlerle uğraşır; mızrak kullanımları bu tehlikeleri kendilerinden uzak tutar."

 sar_wardens:0 "Sar Muhafızları"

 sar_wardens_flavor:0 "Bir ceza kolonisi olarak başladığı mütevazı başlangıcından bu yana Ib Sar büyüdü ve savunucuları hâlâ kendilerine muhafız der."

 patriarchal_guard:0 "Patrik Muhafızları"

 patriarchal_guard_flavor:0 "Patrikler, Kahraman'ın kanını taşıyan son kişilerdir; onlardan geri dönecektir ve bu yüzden soyun devamını sağlamak için korunmaları gerekir."

 bone_collectors:0 "Kemik Toplayıcıları"

 bone_collectors_flavor:0 "Kemik Dağları'nın üç kale-şehri de sürekli tehditlerle karşı karşıya kalsa da, en büyük tehlikelerle kuzeyde, Kemik Yolu üzerinde Kayakayanayalılar yüzleşir. Yine de savaşçıları hepsiyle yüzleşir ve düşmanlarının kemiklerini şehrin surlarına eklemek için toplar."

 stone_shields:0 "Taş Kalkanlar"

 stone_shields_flavor:0 "Kemik Dağları'nda yaşam zordur ve Taş Yol üzerinde yaşayanlar, kimsenin delemediği büyük kalkanlarla doğudan ve batıdan gelen tehditlere karşı savaşır."

 sand_couriers:0 "Kum Ulakları"

 sand_couriers_flavor:0 "Büyük Kum Yolu boyunca Bayasabhadanlar, uzak doğu ile Essos'un geri kalanı arasında aracılık yapar. Ulakları, ister doğa olayı, ister canavar, ister insan olsun her tehdide göğüs gerer."

 asa_scouts:0 "Asa İzcileri"

 asa_scouts_flavor:0 "Asabhad'ın savaşçıları, hem dağda hem ormanda aynı kolaylıkla yol alan hızlı ve sessiz izcileriyle ünlüdür."

 pearl_phoenixes:0 "İnci Anka Kuşları"

 pearl_phoenixes_flavor:0 "Anka kuşunun alevleri saf olmayanları ve dinsizleri yaktığı gibi, bu askerlerin ciritleri de efendilerine zarar vermek isteyenleri bulur."

 jade_dragons:0 "Yeşim Ejderhalar"

 jade_dragons_flavor:0 "Deniz Yeşili İmparatorların liderliğinde, Feicui Ren'in denizcileri Yeşim Denizi'ne ve ötesine hükmetti. Gemilerinin su ejderhaları tarafından korunduğu söylenirdi."

 tourmaline_tortoises:0 "Turmalin Kaplumbağalar"

 tourmaline_tortoises_flavor:0 "Doğuda Gölge yer aldığından, Bixi Ren uzun zamandır akınlarla ve diğer saldırılarla karşı karşıya. Büyük kaplumbağalar gibi askerleri, Gölge Adamları'nı kovmak için ağır zırhlara bürünür."

 onyx_crows:0 "Oniks Kargalar"

 onyx_crows_flavor:0 "Yi Ti'nin kuzeyinde, Jogos N'hai ovalarının sınırında Heinao Ren, kargı ve iradeyle Altın İmparatorluğu şiddetle savunur."

 topaz_tigers:0 "Topaz Kaplanlar"

 topaz_tigers_flavor:0 "Orta bölgedeki ormanlar birçok yırtıcıya ev sahipliği yapar; bunların arasında o topraklarda avlanan kaplanlar başı çeker. Yine de Haungyu Ren okçuları da en az onlar kadar tehlikelidir. Onlar Topaz Kaplanlar'dır ve pençeleri ile ısırıkları da aynı derecede ölümcüldür."

 opal_cranes:0 "Opal Turnalar"

 opal_cranes_flavor:0 "Yi Ti'nin orta ovalarında hız, hem savaşta hem ticarette büyük bir avantajdır. Bu yüzden Aobao Ren, gökyüzünü dolduran turnalarla boy ölçüşecek bir çabuklukla savaşır."

 depth_killers:0 "Derinlik Katilleri"

 depth_killers_flavor:0 "Lengliler uzun zamandır gerilla savaşı sanatında ustalaşmış ve Altın İmparatorluğu topraklarından sürmüştür. Canlı yakalanan her düşmanın, adanın derinliklerinde kaybolduğu söylenir."

 jade_sailors:0 "Yeşim Denizciler"

 jade_sailors_flavor:0 "Yeşim Denizi'ndeki yaşam fırsatlarla doludur; ancak her zaman inşa etmekten çok almaya bakan biri vardır. Bu yüzden dürüst denizciler kendilerini korumak için silahlı seyreder."

 poison_stings:0 "Zehirli İğneler"

 poison_stings_flavor:0 "Yeşim Denizi adalarının cenneti arasında bile tehlikeler gizlidir. Çoğu zaman en güzel böceğin iğnesi en ölümcülüdür."

 crescent_blades:0 "Hilal Kılıçlar"

 crescent_blades_flavor:0 "Cennet Adası'nda bile muhafızlara ihtiyaç vardır. En büyükleri, kullandıkları ay biçimli kılıçlardan adını alan Hilal Kılıçlar'dır."

 moraqi_elephants:0 "Moraq Filleri"

 moraqi_elephants_flavor:0 "Moraq fillerinin ünü çok geniş bir alana yayılmıştır ve sık sık hediye ve haraç olarak verilirler. En büyük ve en güçlüleri asla Büyük Moraq'tan ayrılmaz; bunun yerine güçlü ve korkunç bir kuvvet olan Moraqlıların ordularının bir parçası olarak kalırlar."

 shans_herd:0 "Shan'ın Sürüsü"

 shans_herd_flavor:0 "Fil Adası'nda, fildişi sarayından, Shan bilinen dünyanın en büyük ve en vahşi filleri tarafından korunur."

 blue_eyes:0 "Mavi Gözler"

 blue_eyes_flavor:0 "Vaharilerin en tehlikelileri mavi gözlü olanlardır, zira amansızca eğitilirler."

 stone_ranchers:0 "Taş Sığırtmaçları"

 stone_ranchers_flavor:0 "Sığırtmaçlar ve çiftçiler sürülerini koruduğu gibi, Taş Sığırtmaçları da Taş Boğa'yı ve onun sürüsünü — Farosi halkını — koruyup kollar."

 ash_wardens:0 "Kül Muhafızları"

 ash_wardens_flavor:0 "Kül, Asshai'nin büyük zehirli atardamarıdır ve zaman zaman Gölge'den gelen tehditler nehri takip eder. Kül Muhafızları onlarla hızla ilgilenmelidir."

 shadow_raiders:0 "Gölge Akıncıları"

 shadow_raiders_flavor:0 "Gölge'nin altındaki yaşamın her yerden daha sert olduğu söylenir. Orada yaşayan adamlar, hem Gölge'nin içinde hem ötesinde komşularına akın düzenleyerek hayat bulur."

 lions_of_night:0 "Gecenin Aslanları"

 lions_of_night_flavor:0 "İnsan Göksel Saray ile yapılan sözleşmeye ihanet ettiğinde, Gecenin Aslanı iblislerini insan diyarlarının üzerine saldı. Bunların en büyükleri kocaman aslan biçimini aldı ve bu yüzden Beş Kale'nin ötesindeki insanlar bugün onların suretinde dövülmüş zırhlara bürünür."

 vassals_in_yellow:0 "Sarı Giysili Vassallar"

 vassals_in_yellow_flavor:0 "Beş Kale'nin ötesinde bile Carcosa, daha tuhaf ve gölgeli olarak ayrı durur. Sakinleri Sarı İmparator'a adanmıştır ve uzun kargılarla silahlanmış olarak çevrelerindeki herkesi tehdit ederler."

 dream_questors:0 "Rüya Arayıcıları"

 dream_questors_flavor:0 "Uzak K'Dath'ta gerçek büyüklüğün yalnızca rüyalarda bulunduğu, çoğu zaman delilikle el ele gittiği söylenir. Bu adamlar doğaüstü fısıltıları takip etti ve artık korkusuz savaşçılardır."

 drainers:0 "Kan Emiciler"

 drainers_flavor:0 "Beş Kale'nin ötesinde, Kansız Adamlar'ın toprakları dünyanın dört bir yanında korkulur. Oraya giden herkesin kanının tamamen emileceği söylenir."

 waste_raiders:0 "Çorak Akıncılar"

 waste_raiders_flavor:0 "Beş Kale'nin ötesinde, gri çorak topraklar kasvetli ve tehlikeli bir yerdir. Hayatta kalmak için dost düşman demeden akın yapmak gerekir."

 wind_demons:0 "Rüzgar İblisleri"

 wind_demons_flavor:0 "Beş Kale'nin ötesinde insanların tuhaf ve canavarca olduğu söylenir; Kanatlı Adamlar ise en başta gelir. Kuşkusuz bu masallar, onların at sırtındaki hız ve maharetlerinin birer metaforudur."

 venom_bites:0 "Zehir Isırıkları"

 venom_bites_flavor:0 "Beş Kale'nin ötesindeki Shrykeler, zehirli bir yılanın ısırığı gibi hızlı ve zehirle vurur."

 black_brothers:0 "Kara Kardeşler"

 black_brothers_flavor:0 ""

 shrikes:0 "Shrikeler"

 shrikes_flavor:0 "Boğulmuş Tanrı'nın rahipleri, Shrike'nın Harmund III'e yaptığı gibi, Adalar'dan kafirleri ve dinsizleri kovmak için silaha sarıldı."

 poorfellow_skirmishers:0 "Yoksul Kardeşler'in Yıldızları"

 poorfellow_skirmishers_flavor:0 "Bu adamlar ve kadınlar kendilerini Yoksul Kardeşler'e adamıştır."

 warriors_sons_heavy_infantry:0 "Savaşçının Oğulları'nın Kılıçları"

 warriors_sons_heavy_infantry_flavor:0 "Savaşçının Oğulları'nın Asil ve Kudretli Tarikatı'nın bu şövalyeleri yaya savaşmayı seçer."

 warriors_sons_heavy_cav:0 "Savaşçının Oğulları Şövalyeleri"

 warriors_sons_heavy_cav_flavor:0 "Savaşçının Oğulları'nın Asil ve Kudretli Tarikatı'nın bu şövalyeleri at sırtında savaşmayı seçer."

 holy_guard:0 "Sakallı Rahipler'in Kutsal Muhafızları"

 holy_guard_flavor:0 "Sakallı Rahipler'in köle askerleri olan Kutsal Muhafızlar, korkunç bir topluluktur. Genç yaştan itibaren eğitilen bu askerler, Norvos'un rahiplerine ve magisterlerine hizmette büyük baltalar kuşanır."

 fiery_hand:0 "R'hllor'un Ateşli Eli"

 fiery_hand_flavor:0 "Özgür Şehirler'deki R'hllor köle askerleri olan Ateşli El, Volantis'teki Başrahip'in yönlendirdiği şekilde Işık Lordu'nun iradesini yerine getirmeye adanmıştır."

 dothraki_screamers:0 "Dothraki Çığlıkçıları"

 dothraki_screamers_flavor:0 "Dothraki çığlıkçıları zırhsız biner; yalnızca kavisli arakh'ları ve dehşet verici çığlıkları vardır. Rüzgar kadar hızlı ve ateş kadar acımasız olarak, eşsiz bir vahşetle düşmanlarının üzerine çullanırlar. Ovanın ötesinden çığlıklarını duymak, ölümün dörtnala yaklaştığını bilmektir."

 battering_ram:0 "Koç Başı"

 battering_ram_flavor:0 "Herhangi bir düşmanın kapılarını ve surlarını yıkmak için bir koçbaşı!"

 knights_of_the_dragon:0 "Ejderha Şövalyeleri"

 knights_of_the_dragon_flavor:0 "Valyrialılar Westeros'un yollarını benimsedikçe, en büyük savaşçıları şövalyelik geleneklerini de kucakladı. Korkunç plaka zırhlar kuşanıp ejderha süsleri taşıyan bu şövalyeler, savaş alanında korkunç bir güçtür."

 northern_spears:0 "Demir Odun Mızrakları"

 northern_spears_flavor:0 "Demir odunundan mızraklarla silahlanmış bu kuzeyli birlikler, güneyin şövalyelerine karşı ölümcül bir karşılıktır."

 dornish_crossbows:0 "Dorne Engerekleri"

 dornish_crossbows_flavor:0 "Arbaletlerle silahlanmış bu Dornelular, ölümcül isabetleri ve zehirli uçlu ciritleriyle bilinir."

 vale_heavy_infantry:0 "Kanlı Muhafız"

 vale_heavy_infantry_flavor:0 "Kanlı Kapı'yı savunmalarıyla bilinen bu kılıç ustaları, Vale'i korumada kararlıdır."

 crownlands_spears:0 "Alacakaranlık Mızrakları"

 crownlands_spears_flavor:0 "Bu mızraklılar Blackwater Körfezi topraklarını iyi bilir ve şehir içi savaşlardaki ünleriyle tanınır."

 reach_light_cavalry:0 "El Habercileri"

 reach_light_cavalry_flavor:0 "Hızlı ve hafif olan bu öncü atlılar, haber ulaştırmak ya da düşmanı taciz etmek için Reach'in enini boyunu diğer tüm atlı kuvvetlerden daha hızlı kat edebilir."

 riverlands_light_infantry:0 "Mavna Adamları"

 riverlands_light_infantry_flavor:0 "Trident ve sayısız kolu boyunca yol alan bu mavna adamları, efendilerine hızlı ve hareketli bir piyade gücü sağlar."

 westerlands_knights:0 "Aslan Şövalyeleri"

 westerlands_knights_flavor:0 "Güçlü ve dayanıklı olan Batı Toprakları şövalyeleri, aslanlar kadar vahşidir."

 stormlands_heavy_infantry:0 "Boynuzlu Adamlar"

 stormlands_heavy_infantry_flavor:0 "Soğuk çelikle zırhlanıp silahlanan bu adamlar, öfkelerini göstermek için miğferlerini geyik boynuzlarıyla süsler."

 westerosi_sellswords:0 "Westeroslu Paralı Askerler"

 westerosi_sellswords_flavor:0 "Birçok Westeroslu şövalye, Essos'un Özgür Birlikleri'nde hizmet bulur. Westeros'ta lordlara yeminli olanlar kadar bağlı değillerdir, zira para asla bir yemin kadar güçlü değildir."

 stepstone_sailors:0 "Stepstones Korsanları"

 stepstone_sailors_flavor:0 "Stepstones korsanları, Parçalanma'dan bu yana baş belasıdır ve Uzun Gece dönene dek öyle kalacaktır."

 giant_regiment:0 "Devler"

 giant_regiment_flavor:0 "Uzak kuzeyin ünlü devlerinden bazıları olan bu devasa yaratıklar, Sur'un ötesinden bir kabile için savaşmaya karar verdi."

 goldenheart_bowmen:0 "Altın Yürek Okçuları"

 goldenheart_bowmen_flavor:0 "Yaz Adaları ve kuğu gemileri, korsanlar ve köle tacirleri tarafından korkulur; zira yayları yalnızca nadir ejderha kemiği yayları tarafından aşılan Altın Kalp Okçuları alayları tarafından korunurlar."

 ruby_spearwomen:0 "Yakut Mızraklı Kadınlar"

 ruby_spearwomen_flavor:0 "Kemik Dağları'nın korkunç kadınları, büyük mızraklarıyla vahşi ve maharetlidir; yakıtları ve demir halkalarıyla ünlüdürler."

 goldcloaks:0 "Altın Pelerinler"

 goldcloaks_flavor:0 "Kral Toprakları'nın Şehir Muhafızları, daha çok altın pelerinler olarak bilinen bu birlik, dikkate alınması gereken bir güçtür. Altın boyalı yün pelerinler, kısa mızraklar, topuzlar ile siyah zincir zırh ve eldivenlerle donanmış olarak, toprakların her yerinde tanınırlar."

 sea_watch:0 "Deniz Nöbeti"

 sea_watch_flavor:0 "Demir Taht'ın Deniz Nöbeti, Blackwater Körfezi'ni ve Kral Toprakları şehrine giden yolu korumaya adanmış bir deniz birliğidir. Kaçakçılar onlardan korkar ve yakaladıklarını idam ederler."

 redcloaks:0 "Kızıl Pelerinler"

 redcloaks_flavor:0 "Lannisport Şehir Muhafızları, ya da kızıl pelerinler, verimlilikleri ve eğitimleriyle bilinir. Arkalarında Lannisport'un zenginliğiyle, iyi donanımlı ve iyi talimlidirler."

 greycloaks:0 "Kaldırımtaşı Muhafızları"

 greycloaks_flavor:0 "Kaldırımtaşı Muhafızları olarak bilinen Oldtown'un Şehir Muhafızları, Westeros'un en eski şehir muhafızıdır ve profesyonellikleri ile düzenli tutumlarıyla tanınır."

 cailin_archers:0 "Cailin Okçuları"

 cailin_archers_flavor:0 "Moat Cailin, Kuzey'in kapısıdır; geçidin ucundaki güçlü konumu ve Neck tarafından korunması sayesinde okçular, kaleyi — harabe ya da yeniden inşa edilmiş — her düşmana karşı kolayca savunabilir."

 grey_wolves:0 "Gri Kurtlar"

 grey_wolves_flavor:0 "Warg Kralı'nın Kalesi yeniden inşa edildiğinden, büyük savaşçılar Gaven Greywolf'un adını almak ve Warg Kralı'nın mirasını sürdürmek için akın etti."

 hammers_of_justice:0 "Adalet Çekiçleri"

 hammers_of_justice_flavor:0 "Oldstones yeniden inşa edildiğinden, büyük savaşçılar Tristifer Mudd'un adını almak ve Nehir Kralı'nın mirasını sürdürmek için akın etti."

 morne_guardians:0 "Kusursuz Şövalyeler"

 morne_guardians_flavor:0 "Morne yeniden inşa edildiğinden, büyük savaşçılar Ser Galladon'un adını almak ve Kusursuz Şövalye'nin mirasını sürdürmek için akın etti."

 dust_devils:0 "Toz Şeytanları"

 dust_devils_flavor:0 "Cehennem Kapısı Konağı yeniden inşa edildiğinden, büyük savaşçılar Lucifer Dryland'ın adını almak ve Kükürt Kralı'nın mirasını sürdürmek için akın etti."

 head_collectors:0 "Kafa Toplayıcıları"

 head_collectors_flavor:0 "Fısıltılar yeniden inşa edildiğinden, büyük savaşçılar Clarence Crabb'ın adını almak ve Yaban Sığırı Binicisi'nin mirasını sürdürmek için akın etti."

 cruel_chains:0 "Zalim Zincirler"

 cruel_chains_flavor:0 "Hoare Kalesi yeniden inşa edildiğinden, büyük savaşçılar Qhored Hoare'un adını almak ve Zalim Yüce Kral'ın mirasını sürdürmek için akın etti."

 bloody_blades:0 "Kanlı Kılıçlar"

 bloody_blades_flavor:0 "Kanlı Kale yükseltildiğinden, büyük savaşçılar Kanlı Kılıç'lı Brandon'ın adını almak ve Kanlı Kılıç'ın mirasını sürdürmek için akın etti."

 sharp_claws:0 "Keskin Pençeler"

 sharp_claws_flavor:0 "Castamere yeniden inşa edildiğinden, büyük savaşçılar Roger Reyne'un adını almak ve Kızıl Aslan'ın mirasını sürdürmek için akın etti."

 ursulas_screams:0 "Ursula'nın Çığlıkları"

 ursulas_screams_flavor:0 "Denizkızı Kalesi inşa edildiğinden, büyük savaşçılar Ursula Upcliff'in adını almak ve Denizkızı Gelin'in mirasını sürdürmek için akın etti."

 wildling_cavalry:0 "Özgür Halk Binicileri"

 wildling_cavalry_flavor:0 "Yabanıllar, diz çökenlerden daha az süvari kullanır; soğuğa ve kıt otlağa dayanabilen küçük ve dayanıklı bir at cinsine güvenirler."

 pirate_archers:0 "Baş Kasaralı Adamlar"

 pirate_archers_flavor:0 "Baş kasaraya atanan gözcüler olan bu adamlar yaylarla silahlanmıştır ve ilk kanı dökenlerdir."

 pirate_pikemen:0 "Uzun Kancalar"

 pirate_pikemen_flavor:0 "Düşman gemilerine takılmak için kullanılan uzun kanca, özellikle at üzerindekilere karşı mükemmel bir silahtır."

 pirate_skirmishers:0 "Siyah Pala"

 pirate_skirmishers_flavor:0 "Palalarla silahlanmış ve siyahlar giyinmiş bu korsanlar, kendileriyle ganimetleri arasına giren herkesi biçer."

 nw_rangers:0 "Korucular"

 nw_rangers_flavor:0 "Gece Nöbeti'nin ana savaşçı gücü olan korucular, düzenli olarak Sur'un ötesine geçer ve Hayalet Ormanı'nda ve ötesinde yabanıllarla çatışır."

 nw_trackers:0 "İz Sürücüler"

 nw_trackers_flavor:0 "Zaman zaman Gece Nöbeti üyeleri, önemli hedefleri izlemek ya da kritik bilgiler toplamak için uzak diyarlara gönderilir. Sayıca az olan bu birlikler, ata binen ender kişiler arasındadır."

 sworn_brothers:0 "Yeminli Kardeşler"

 sworn_brothers_flavor:0 "Geçmiş günlere kıyasla sayıca azalmış olsalar da, yeminli kardeşler hâlâ hesaba katılması gereken bir güçtür — özellikle Sur'un ötesindeki yabanıllarla karşılaştırıldığında."

 shadow_spears:0 "Gölge Mızrakları"

 shadow_spears_flavor:0 "Gölge Kulesi'nin adamları uzun zamandır Kafatasları Köprüsü'nü koruyor. Böylesine kritik bir darboğazda düşmanları uzak tutmak için uzun mızrak kullanımında ustalaşmışlardır."

 eastwatch_sailors:0 "Eastwatch Denizcileri"

 eastwatch_sailors_flavor:0 "Gece Nöbeti'nin tek limanı olarak, Deniz Kıyısındaki Eastwatch'ın kardeşleri, Titreyen Deniz'de devriye gezmeye alışkın usta denizcilerdir."

 anti_dragon:0 "[anti_dragon_maa|E]"

 scorpions:0 "Akrepler"

 scorpions_flavor:0 "En kalın zırhları delebilen büyük bir cirit fırlatıcısı. Geleneksel savaşta geride kalsa da, akrebin rakipsiz olduğu bir yön vardır — ejderha pullarını delebilme yeteneği."

 water_wizards:0 "Su Büyücüleri"

 water_wizards_flavor:0 "Rhoynarlar, Ana Tanrıça olarak taptıkları büyük nehirle olan bağlarıyla ünlüydü. Bu tapınma en güçlü şekilde, ejderhaları bile öldürmek için Ana'nın bedeninin ta kendisini kullanan Su Büyücüleri'nde kendini gösterir."

 dragons_regiment:0 "[dragons_plural|E]"

 dragons_flavor:0 "Ejderhalar dünyanın en korkunç silahıdır; koca orduları küle çevirebilirler. Biriyle yüzleşmek, ölümün ta kendisinin yüzünü görmektir."

 laamp_settler_maa:0 "Yerleşimciler"

 laamp_settler_maa_flavor:0 "Gerçek askerler olmasalar da, yerleşimciler yeni bir başlangıç arayanların derme çatma bir topluluğudur. Her toprakta bulunabilirler ve #V Yerleşimci Kafilesi#! [building|E]'nde yer olan herhangi bir [adventurer|E]'ye katılmaya isteklidirler."

