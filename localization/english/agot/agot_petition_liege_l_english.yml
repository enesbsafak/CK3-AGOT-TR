l_english:

 agot_petition_liege.0001.t:0 "Sadık sancaktarım,"

 agot_petition_liege.0001.desc:0 "Bununla [petition_vassal.GetTitledFirstName]'e karşı tüm düşmanlıkları durdurman emrediliyorsun. Vassallerim arasında barış olması ve soylu konumlarına yakışır bir vakarla davranmaları benim dileğimdir. Topraklarımızın savaşla parçalanmasına izin vermeyeceğim."

 agot_petition_liege.0001.a:0 "Emrinizdeyim, hükümdarım."

 agot_petition_liege.0001.b:0 "Anlaşmazlığımız seni ilgilendirmez."

 agot_petition_liege.0002.t:0 "Sözverenim,"

 agot_petition_liege.0002.desc:0 "[petition_vassal.GetTitledFirstName] konusunda hakkımı kullanıyorum."

 agot_petition_liege.0002.a:0 "[second_party.GetSheHe|U] bana karşı gelmeye cüret mi ediyor?!"

 agot_petition_liege.0003.t:0 "Sadık sancaktarım,"

 agot_petition_liege.0003.desc:0 "Vassallerim arasında barış olması benim dileğim olsa da, bazı tebaam bana karşı gelmeyi uygun görmeye devam ediyor. Görünüşe göre [second_party.GetTitledFirstName], size karşı [second_party.GetHerHis] savaşını sürdürmeye niyetli ve şimdilik yapabileceğim çok az şey var. [second_party.GetHerHim]'e elinizden geldiğince direnin ya da kendi koşullarınızla barışın."

 agot_petition_liege.0003.a:0 "Efendimin otoritesinin daha... etkili olmasını beklerdim."

 agot_petition_liege.0004.t:0 "Sözverenim,"

 agot_petition_liege.0004.desc:0 "Bilgeliğiniz ve iyiliğiniz tartışılmaz. Diyarın ve halkının hatrına, aracılığınız için teşekkürlerle, [petition_vassal.GetTitledFirstName] ile derhal barışacağım."

 agot_petition_liege.0004.a:0 "[second_party.GetSheHe]'in aklı başına alacağını biliyordum."
