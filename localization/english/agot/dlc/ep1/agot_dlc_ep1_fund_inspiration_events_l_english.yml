### TODO NOT-IN-ST: fund_inspiration.1051.desc.epic.valyrian_steel [AGOT: lies a Valyrian steel blade — both a relic of a long-gone empire and a most deadly weapon of extraordinary quality.\n\nSaid to be forged in dragonfire, rippling patterns flow through its dark blade as if trapped by ancient magic.\n\nI wonder to whom it may have belonged in the past, but it makes no difference — such an invaluable possession will bring glory to the [ROOT.Char.GetDynasty.GetNameNoTooltip] dynasty forevermore!]
 fund_inspiration.1051.desc.epic.valyrian_steel:0 "lies a Valyrian steel blade — both a relic of a long-gone empire and a most deadly weapon of extraordinary quality.\n\nSaid to be forged in dragonfire, rippling patterns flow through its dark blade as if trapped by ancient magic.\n\nI wonder to whom it may have belonged in the past, but it makes no difference — such an invaluable possession will bring glory to the [ROOT.Char.GetDynasty.GetNameNoTooltip] dynasty forevermore!"
