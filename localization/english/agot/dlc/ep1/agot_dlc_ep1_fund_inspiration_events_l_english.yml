### TODO NOT-IN-ST: fund_inspiration.1051.desc.epic.redbeard_axe [AGOT: lies the axe of Raymun Redbeard, the King-Beyond-the-Wall who brought his savage host south and faced the lords of the North in the battle at Long Lake. \n\nIt is unknown whether it was Redbeard's axe that lopped William Stark's head off, but examining this hefty, yet expertly balanced weapon, much sharper than what I considered possible in a bronze blade, I have no doubts that it was a suitable tool for the job.]
 fund_inspiration.1051.desc.epic.redbeard_axe:0 "lies the axe of Raymun Redbeard, the King-Beyond-the-Wall who brought his savage host south and faced the lords of the North in the battle at Long Lake. \n\nIt is unknown whether it was Redbeard's axe that lopped William Stark's head off, but examining this hefty, yet expertly balanced weapon, much sharper than what I considered possible in a bronze blade, I have no doubts that it was a suitable tool for the job."
### TODO NOT-IN-ST: fund_inspiration.1051.desc.epic.skinchangers_second_pelt [AGOT: I see a pelt of a furry predator, unremarkable in any respect besides the unusual amount of punctures and cuts suggesting a far more labored kill than what is expected from an expert hunter. \n\nStill, running my hand across the fur evokes such a strong sensation of uneasy excitement that I feel it would be palpable even without knowing that this skin was taken off a human being.]
 fund_inspiration.1051.desc.epic.skinchangers_second_pelt:0 "I see a pelt of a furry predator, unremarkable in any respect besides the unusual amount of punctures and cuts suggesting a far more labored kill than what is expected from an expert hunter. \n\nStill, running my hand across the fur evokes such a strong sensation of uneasy excitement that I feel it would be palpable even without knowing that this skin was taken off a human being."
### TODO NOT-IN-ST: fund_inspiration.1051.desc.epic.giants_tooth [AGOT: there is a gargantuan tooth. It is almost comical how immediately this one feature of prodigious size distinguishes the finding as something special. \n\nThe giant tooth is, in fact, a tooth of a giant, there are no two ways about it.]
 fund_inspiration.1051.desc.epic.giants_tooth:0 "there is a gargantuan tooth. It is almost comical how immediately this one feature of prodigious size distinguishes the finding as something special. \n\nThe giant tooth is, in fact, a tooth of a giant, there are no two ways about it."
