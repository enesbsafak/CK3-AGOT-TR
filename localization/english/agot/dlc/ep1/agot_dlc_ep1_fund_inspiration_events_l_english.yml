 fund_inspiration.1051.desc.epic.valyrian_steel:0 "hem çoktan yok olmuş bir imparatorluğun kalıntısı hem de olağanüstü kalitede ölümcül bir silah olan bir Valyria çeliği kılıcı yatıyor.\n\nEjderha ateşinde dövüldüğü söylenen karanlık bıçağının üzerinde, kadim bir büyüyle hapsedilmiş gibi dalgalı desenler akıyor.\n\nGeçmişte kime ait olduğunu merak ediyorum, ama fark etmez — böyle paha biçilmez bir hazine, [ROOT.Char.GetDynasty.GetNameNoTooltip] hanedanına sonsuza dek şan getirecek!"

 fund_inspiration.1051.desc.epic.dragon_egg:0 "bir ejderha yumurtası yatıyor. Olabilir mi?\n\n[inspiration_owner.GetFirstNameNoTooltip] gururla gülümsüyor: "[epic.GetDesc]""

 fund_inspiration.1051.desc.epic.redbeard_axe:0 "vahşi ordusunu güneye getiren ve Uzun Göl'deki savaşta Kuzey'in lordlarıyla karşılaşan Duvar'ın Ötesindeki Kral Raymun Kızılsakal'ın baltası yatıyor. \n\nWilliam Stark'ın kafasını koparanın Kızılsakal'ın baltası olup olmadığı bilinmiyor; ama bu ağır, ustalıkla dengelenmiş ve bronz bir bıçakta mümkün olduğunu düşündüğümden çok daha keskin olan silahı incelerken, bu iş için uygun bir alet olduğundan hiç şüphem yok."

 fund_inspiration.1051.desc.epic.skinchangers_second_pelt:0 "Kürklü bir yırtıcının postunu görüyorum; uzman bir avcıdan beklenenden çok daha zahmetli bir ölüme işaret eden alışılmadık sayıdaki delik ve kesik dışında hiçbir açıdan sıradan. \n\nYine de elimi kürkün üzerinde gezdirmek öyle güçlü bir huzursuz heyecan uyandırıyor ki, bu derinin bir insandan alındığını bilmesem bile bunun hissedilebilir olduğunu düşünüyorum."

 fund_inspiration.1051.desc.epic.giants_tooth:0 "devasa bir diş var. Muazzam boyuttaki bu tek özelliğin, buluntuyu hemen özel bir şey olarak ayırması neredeyse komik. \n\nDev diş aslında, hiç şüphesiz, bir devin dişidir."
