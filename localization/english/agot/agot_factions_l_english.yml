 agot_loyalist_faction:0 "Sadıklar Hizbi"

 agot_loyalist_faction_desc:0 "Sadıklar [faction|E] üyeleri, müttefikler, dostlar ve hükümdarın üzerinde güçlü kanca sahibi olduğu vassaller gibi sadakatinden şüphe edilmeyenlerin ötesinde, [liege|E]'lerinin diyarını korumaya adanmıştır.\n\n#S Etkiler#!\nDüşmanca bir [faction|E] tarafından başlatılan bir [war|e] durumunda, tüm Sadıklar üyeleri [liege|e]'lerini savunmak için ordularını toplayacaktır."

 agot_loyalist_faction_short_effect_desc:0 "[liege|e]'lerini düşman [factions|e]'lerden koruyor."

