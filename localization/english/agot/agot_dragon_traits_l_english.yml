l_english:

 trait_dragon_generic:0 "Ejderha"

 trait_dragon_wild:0 "Yaban Ejderhası"

 trait_dragon_owned:0 "Sahiplenilen Ejderha"

 trait_dragon_tamed:0 "Ehlileştirilmiş Ejderha"

 trait_dragon_bound:0 "Bağlı Ejderha"

 trait_dragon_desc:0 "Kan büyüsüyle, ateşten beden bulmuş bir parçayla, aydan kopan bir parçayla ya da yeryüzündeki ilahi bir bedenle yaratılmış olsunlar da, kimse [dragons_plural|El] dünyanın en etkileyici türlerinden biri olduğunu inkâr edemez."

 trait_dragon_character_desc:0 "Kan büyüsüyle, ateşten beden bulmuş bir parçayla, aydan kopan bir parçayla ya da yeryüzündeki ilahi bir bedenle yaratılmış olsun da, kimse [ROOT.Char.GetNameNoTooltip]'in dünyanın en etkileyici türlerinden birinin üyesi olduğunu inkâr edemez: eski Valyria'nın bir [dragon|El]."

 trait_dragonrider:0 "Ejderha Binicisi"

 trait_dragonrider_desc:0 "Ejderha binicileri, bir ejderhayla bağ kurmuş ve o korkunç gücü kendi amaçları için kullanan az sayıdaki kadın ve erkektir."

 trait_dragonrider_character_desc:0 "'[ROOT.Var('current_dragon').Char.GetName]' ejderhasını evcilleştirip bağ kuran [ROOT.GetCharacter.GetFirstNameNoTooltip], artık [ROOT.Var('current_dragon').Char.Custom('GetDragonHerHim')] sürebilir."

 trait_dragonbinder_desc:0 "Eski Valyria'nın kan büyüsüyle '[ROOT.Var('current_dragon').Char.GetNameNicknamed]' ejderhasını bağlayan [ROOT.GetCharacter.GetFirstNameNoTooltip], artık [ROOT.Var('current_dragon').Char.Custom('GetDragonHerHim')] sürebilir."

 trait_dragon_name_dragon_alive:0 "[ROOT.Var('current_dragon').Char.GetNamePossessive|U] Binicisi"

 trait_track_dragon_training:0 "Ejderha Eğitimi"

 trait_track_dragon_training_desc:0 "Birlikte eğitimde veya savaşta geçirilen zaman, bir binicinin ejderhasının muazzam gücünü kullanma becerisini ve hızını artırır.\n\nHer eğitim seviyesi [dragon_combat_effectiveness|E] ekler: @dragon_combat_effectiveness_icon! #P +10%#!, en fazla #P +30%#!."

 trait_track_dragon_bond:0 "Ejderha Bağı"

 trait_track_dragon_bond_desc:0 "Bir ejderha ile binicisi arasındaki bağ her zaman güçlüdür, ancak en büyüklerinin büyülü bir şekilde bağlandığı söylenir. Daha yakın bir bağ, ejderhanın en stresli koşullarda bile binicisine hizmet etmesini sağlar."

 trait_dragonless_dragonrider:0 "Ejderhasız Binici"

 trait_dragonless_dragonrider_desc:0 "Daha önce bir ejderhayla bağ kurmuş olan bu karakter, bir zamanlar dünyanın en büyük gücüne sahipti; ancak şu anda ejderhasızdır."

 trait_dragonless_dragonrider_character_desc:0 "Daha önce bir ejderhayla bağ kuran [ROOT.GetCharacter.GetFirstNameNoTooltip], bir zamanlar dünyanın en büyük gücüne sahipti; ancak [ROOT.GetCharacter.GetSheHe] şu anda ejderhasızdır."

 trait_dragonwidowed:0 "Bağı Kırılmış"

 trait_dragonwidowed_desc:0 "Daha önce bir ejderhayla bağ kurmuş olan bu karakter, bağının kaybı nedeniyle bir başka ejderhayla bağ kurmayı düşünemez hale gelmiştir."

 trait_dragonwidowed_character_desc:0 "Daha önce bir ejderhayla bağ kuran [ROOT.GetCharacter.GetFirstNameNoTooltip], bağlı yoldaşının kaybı nedeniyle bir başka ejderhayla bağ kurmayı düşünemez hale gelmiştir."

 trait_dragonslayer:0 "Ejderha Katili"

 trait_dragonslayer_desc:0 "Çok az kişi ejderha katili unvanını taşıyabilir, ancak bu karakter tam da bunu yapmıştır!"

 trait_dragonslayer_character_desc_alive:0 "[ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.MakeScope.Var( 'slain_dragon' ).GetCharacter.GetNameNoTooltip] ejderhasını öldürdü; gerçekten etkileyici bir savaş ustalığı!"

 trait_dragonslayer_character_desc_dead:0 "[ROOT.Char.GetFirstNameNoTooltip] kudretli bir ejderhayı öldürdü; gerçekten etkileyici bir savaş ustalığı!"

 trait_dragon_aggressive:0 "Saldırgan"

 trait_dragon_aggressive_desc:0 "Her durumda her yaratığa saldırmaya hazır olan bu ejderha, öfkesiyle kötü ün yapmıştır."

 trait_dragon_aggressive_character_desc:0 "Her durumda her yaratığa saldırmaya hazır olan [ROOT.Char.GetFirstNameNoTooltip], öfkesiyle kötü ün yapmıştır."

 trait_dragon_friendly:0 "Dostça"

 trait_dragon_friendly_desc:0 "Bu ejderha, çoğu yaratığa karşı şaşırtıcı derecede sakin ve düşüncelidir; çoğu zaman dingin, hatta oyuncu bile olabilir."

 trait_dragon_friendly_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], çoğu yaratığa karşı şaşırtıcı derecede sakin ve düşüncelidir; çoğu zaman dingin, hatta oyuncu bile olabilir."

 trait_dragon_cooperative:0 "İşbirlikçi"

 trait_dragon_cooperative_desc:0 "Bu ejderha baştan aşağı bir sürü hayvanıdır. Yanında emsalleri varken en iyi performansını sergiler."

 trait_dragon_cooperative_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] baştan aşağı bir sürü hayvanıdır. [ROOT.Char.Custom('GetDragonSheHe')|U], yanında emsalleri varken en iyi performansını sergiler."

 trait_dragon_solitary:0 "Yalnız"

 trait_dragon_solitary_desc:0 "Bu ejderha, dikkat dağıtıcı unsurlardan ve diğer ejderhalardan uzak olduğunda en etkilidir."

 trait_dragon_solitary_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], dikkat dağıtıcı unsurlardan ve diğer ejderhalardan uzak olduğunda en etkilidir."

 trait_dragon_imperious:0 "Hükümran"

 trait_dragon_imperious_desc:0 "Bu ejderhanın diğer ejderhalarla etkileşiminde neredeyse krala yakışır bir hava vardır. Ejderha da insan da herkesin kendisine boyun eğmesini bekler."

 trait_dragon_imperious_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip]'in diğer ejderhalarla etkileşiminde neredeyse krala yakışır bir hava vardır. [ROOT.Char.Custom('GetDragonSheHe')|U], ejderha da insan da herkesin [ROOT.Char.Custom('GetDragonHerHim')] boyun eğmesini bekler."

 trait_dragon_supporting:0 "Destekleyici"

 trait_dragon_supporting_desc:0 "Bu ejderha, çalışan birçok yardakçıdan biri olarak en mutlu görünür. Kontrol sahibi olmaktan çok sadık olmaya değer verir."

 trait_dragon_supporting_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], çalışan birçok yardakçıdan biri olarak en mutlu görünür. [ROOT.Char.Custom('GetDragonSheHe')|U], kontrol sahibi olmaktan çok sadık olmaya değer verir."

 trait_dragon_impulsive:0 "Dürtüsel"

 trait_dragon_impulsive_desc:0 "Pervasızca saldıran bu ejderha, çoğu zaman düşmanlarla hemen çatışmaya girer."

 trait_dragon_impulsive_character_desc:0 "Pervasızca saldıran [ROOT.Char.GetFirstNameNoTooltip], çoğu zaman düşmanlarla hemen çatışmaya girer."

 trait_dragon_calculating:0 "Hesapçı"

 trait_dragon_calculating_desc:0 "Sabırlı bir yaratık olan bu ejderha, hareketleri iyi planlanmış ve odaklanmış biçimde savaşmayı tercih eder."

 trait_dragon_calculating_character_desc:0 "Sabırlı bir yaratık olan [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDragonHerHis')] hareketleri iyi planlanmış ve odaklanmış biçimde savaşmayı tercih eder."

 trait_dragon_voracious:0 "Obur"

 trait_dragon_voracious_desc:0 "Doymak bilmez iştahıyla bu ejderha, aşırı beslenmesiyle bilinir."

 trait_dragon_voracious_character_desc:0 "Doymak bilmez iştahıyla [ROOT.Char.GetFirstNameNoTooltip], aşırı beslenmesiyle bilinir."

 trait_dragon_restrained:0 "Ölçülü"

 trait_dragon_restrained_desc:0 "Bu ejderha, boyutundaki bir ejderhadan beklenenden daha az yer ve değerli kaynakları korur."

 trait_dragon_restrained_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDragonHerHis')] boyutundaki bir ejderhadan beklenenden daha az yer ve değerli kaynakları korur."

 trait_dragon_defiant:0 "Başkaldıran"

 trait_dragon_defiant_desc:0 "Herhangi bir insana boyun eğmeyi hor gören bu ejderha, binicileri, emirleri veya zincirleri reddetmeye eğilimlidir."

 trait_dragon_defiant_character_desc:0 "Herhangi bir insana boyun eğmeyi hor gören [ROOT.Char.GetFirstNameNoTooltip], binicileri, emirleri veya zincirleri reddetmeye eğilimlidir."

 trait_dragon_accepting:0 "Kabul Edici"

 trait_dragon_accepting_desc:0 "İnsanların yanında tuhaf biçimde rahat olan bu ejderha, binicilere ve talimatlara uymaya eğilim göstermiştir."

 trait_dragon_accepting_character_desc:0 "İnsanların yanında tuhaf biçimde rahat olan [ROOT.Char.GetFirstNameNoTooltip], binicilere ve talimatlara uymaya eğilim göstermiştir."

 trait_dragon_bloodthirsty:0 "Kan Düşkünü"

 trait_dragon_bloodthirsty_desc:0 "Bu ejderha kanlı çatışmaya susamıştır ve ölümün ya da yıkımın sebebi olarak bariz biçimde kendi unsuru içindedir."

 trait_dragon_bloodthirsty_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] kanlı çatışmaya susamıştır ve ölümün ya da yıkımın sebebi olarak bariz biçimde [ROOT.Char.Custom('GetDragonHerHis')] unsuru içindedir."

 trait_dragon_skittish:0 "Ürkek"

 trait_dragon_skittish_desc:0 "Çatışmadan kaçma eğiliminde olan bu ejderha, içindeki gücün son derece farkında değil gibidir."

 trait_dragon_skittish_character_desc:0 "Çatışmadan kaçma eğiliminde olan [ROOT.Char.GetFirstNameNoTooltip], içindeki gücün son derece farkında değil gibidir..."

 trait_dragon_cannibal:0 "Yamyam"

 trait_dragon_cannibal_desc:0 "Sadece toprak için ya da savaşta çarpışmaktan çok öte, bu ejderha sırf iştahını gidermek için diğer ejderhaları yemesiyle bilinir."

 trait_dragon_cannibal_character_desc:0 "Sadece toprak için ya da savaşta çarpışmaktan çok öte, [ROOT.Char.GetFirstNameNoTooltip], sırf [ROOT.Char.Custom('GetDragonHerHis')] iştahını gidermek için diğer ejderhaları yemesiyle bilinir."

 trait_dragon_physique_good_3:0 "Zalim Leviathan"

 trait_dragon_physique_good_3_desc:0 "Bazı ejderhalar öyle bir tür örneğidir ki Asshai'den Duvar'a kadar herkes saf fiziksel ihtişamlarını bilir. Onların huzurunda bulunmak, ölümün cisimleşmiş haliyle bulunmaktır."

 trait_dragon_physique_good_3_character_desc:0 "Asshai'den Duvar'a kadar herkes [ROOT.Char.GetFirstNameNoTooltip]'in saf fiziksel ihtişamını bilir. [ROOT.Char.Custom('GetDragonHerHis')] huzurunda bulunmak, ölümün cisimleşmiş haliyle bulunmaktır."

 trait_dragon_physique_good_2:0 "Büyük Ejder"

 trait_dragon_physique_good_2_desc:0 "Tüm ejderhalar eşit yaratılmamıştır; bazıları etten beden bulmuş ateşin gücüyle dalgalanıyor gibi görünür ve onları gören herkesi hayrete düşürür."

 trait_dragon_physique_good_2_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], ejderha türünün hayranlık uyandıran bir örneğidir. [ROOT.Char.Custom('GetDragonHerHis')] kusursuz pulları, etten beden bulmuş ateşin gücüyle dalgalanır."

 trait_dragon_physique_good_1:0 "Dehşet Veren Yılan"

 trait_dragon_physique_good_1_desc:0 "Güçlü kanatları, ağır gövdesi ve devasa ısırığıyla bazı ejderhalar, salt varlıklarıyla eski Valyria'nın gücünü sergileyebilir."

 trait_dragon_physique_good_1_character_desc:0 "Güçlü kanatları, ağır gövdesi ve devasa ısırığıyla [ROOT.Char.GetFirstNameNoTooltip]'e bakan biri, eski Valyria'nın gücünü görebilir."

 trait_dragon_physique_good:0 "İyi Ejderha Fiziği"

 trait_dragon_physique_bad:0 "Kötü Ejderha Fiziği"

 trait_dragon_physique_bad_1:0 "Sağlıksız Yılan"

 trait_dragon_physique_bad_1_desc:0 "Hafifçe biçimsiz kanatları ve şekilsiz pul lekeleriyle, kan anormallikleri ya da mistik müdahaleler bazı ejderhaların diğerlerinden belirgin biçimde daha zayıf olmasına yol açabilir."

 trait_dragon_physique_bad_1_character_desc:0 "Hafifçe biçimsiz kanatları ve şekilsiz pul lekeleriyle, [ROOT.Char.GetFirstNameNoTooltip]'in bir ejderha olarak genellikle uyandıracağı etki bir ölçüde azalmıştır."

 trait_dragon_physique_bad_2:0 "Biçimsiz Ejder"

 trait_dragon_physique_bad_2_desc:0 "Tüm ejderhalar eşit yaratılmamıştır; bazıları, garip açılarla duran çıkık uzuvları ve beceriksiz ile aksak hareketleriyle aşağı bir yaratığın izini taşır."

 trait_dragon_physique_bad_2_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] açıkça [ROOT.Char.Custom('GetDragonHerHis')] emsallerinden daha aşağıdır; garip açılarla duran çıkık uzuvlar ve [ROOT.Char.Custom('GetDragonHerHis')] hareketler beceriksiz ile aksaktır."

 trait_dragon_physique_bad_3:0 "Acınası Ejderha Yavrusu"

 trait_dragon_physique_bad_3_desc:0 "Büyünün en az olduğu çağlarda doğan ejderhaların kaderi böyledir: Burunlarından kuyruklarına dek hiçbir yerleri düzgün görünmez. Asimetrik bir kafatasına garip biçimde yerleşmiş şekilsiz gözler. Kanatlar fazla küçük, sırt fazla büyüktür. Bu yaratıklar dehşetten çok acıma uyandırır."

 trait_dragon_physique_bad_3_character_desc:0 "Burunlarından kuyruğuna dek [ROOT.Char.GetFirstNameNoTooltip]'in hiçbir yeri düzgün görünmez. Asimetrik bir kafatasına garip biçimde yerleşmiş şekilsiz gözler. Kanatlar fazla küçük, sırt fazla büyüktür. Bu yaratık dehşetten çok acıma uyandırır."

 trait_dragon_swift:0 "Süratli"

 trait_dragon_swift_desc:0 "Bazı ejderhalar, aynı boy ve yaştaki emsallerini manevra kabiliyetiyle alt edebilen hızları ve çeviklikleriyle bilinir."

 trait_dragon_swift_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], aynı boy ve yaştaki emsallerini manevra kabiliyetiyle alt edebilen [ROOT.Char.Custom('GetDragonHerHis')] hızı ve çevikliğiyle bilinir."

 trait_dragon_slow:0 "Yavaş"

 trait_dragon_slow_desc:0 "Bazı ejderhalar yavaş ve hantaldır; aynı boy ve yaştaki emsallerine yetişemezler."

 trait_dragon_slow_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] yavaş ve hantaldır; aynı boy ve yaştaki emsallerine yetişemez."

 trait_dragon_spindly:0 "İncecik"

 trait_dragon_spindly_desc:0 "Uzamış uzuvları ve ince gövdesiyle bazı ejderhalar, onları emsallerinden hem daha küçük hem de daha çevik yapan ürkütücü bir cılız görünümle bilinir."

 trait_dragon_spindly_character_desc:0 "Uzamış uzuvları ve ince gövdesiyle [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDragonHerHim')] hem [ROOT.Char.Custom('GetDragonHerHis')] emsallerinden daha küçük hem de daha çevik yapan ürkütücü bir cılız görünümle bilinir."

 trait_dragon_majestic:0 "Görkemli"

 trait_dragon_majestic_desc:0 "Varlıklarıyla hayranlık uyandıran bazı ejderhalar, güneşte cilalı metal gibi parlayan pullarıyla saf ihtişam ve azametleriyle bilinir."

 trait_dragon_majestic_character_desc:0 "[ROOT.Char.Custom('GetDragonHerHis')] varlığıyla hayranlık uyandıran [ROOT.Char.GetFirstNameNoTooltip], güneşte cilalı metal gibi parlayan pullarıyla [ROOT.Char.Custom('GetDragonHerHis')] saf ihtişam ve azametiyle bilinir."

 trait_dragon_ugly:0 "Çirkin"

 trait_dragon_ugly_desc:0 "Ejderhaların çoğu ya güzeldir ya da dehşet vericidir; ancak donuk pulları ve sadece bir annenin sevebileceği yüzüyle bazı ejderhalar çirkin de olabilir."

 trait_dragon_ugly_character_desc:0 "Donuk pulları ve sadece bir annenin sevebileceği yüzüyle [ROOT.Char.GetFirstNameNoTooltip], çirkin bir ejderha olmaya lanetlenmiştir."

 trait_dragon_fertile:0 "Doğurgan"

 trait_dragon_fertile_desc:0 "Ejderhaların doğurganlığı değişken bir şeydir, ancak bu ejderhanın verimli ve doğurgan olduğu bilinir."

 trait_dragon_fertile_character_desc:0 "Ejderhaların doğurganlığı değişken bir şeydir, ancak [ROOT.GetCharacter.GetFirstNameNoTooltip]'in verimli ve doğurgan olduğu bilinir."

 trait_dragon_destined:0 "Kaderi Yazılmış"

 trait_dragon_destined_desc:0 "Kaderin çarkları daima döner ve bu ejderhanın kaderin aracı olarak işaretlenmesine tanık olmuştur."

 trait_dragon_destined_character_desc:0 "Kaderin çarkları daima döner ve [ROOT.GetCharacter.GetFirstNameNoTooltip]'in kaderin aracı olarak işaretlenmesine tanık olmuştur."

 trait_education_dragon_1:0 "Vahşi Ejderha"

 trait_education_dragon_1_desc:0 "Sert koşullar arasında yalnız büyüyen bir ejderha, doğanın herhangi bir yaratığı kadar vahşileşir."

 trait_education_dragon_1_character_desc:0 "Sert koşullar arasında yalnız büyüyen [ROOT.Char.GetFirstNameNoTooltip], doğanın herhangi bir yaratığı kadar vahşileşmiştir."

 trait_education_dragon_2:0 "Doğal Ejderha"

 trait_education_dragon_2_desc:0 "Rehberlik ve eğitim olmadan vahşi doğada yetişen bir ejderha, inatçıdır ve hayvani davranışlara eğilimlidir."

 trait_education_dragon_2_character_desc:0 "Rehberlik ve eğitim olmadan vahşi doğada yetişen [ROOT.Char.GetFirstNameNoTooltip], inatçıdır ve hayvani davranışlara eğilimlidir."

 trait_education_dragon_3:0 "Eğitimli Ejderha"

 trait_education_dragon_3_desc:0 "İnsanların arasında yetişen bazı ejderhalar, türlerine özgü vahşi ve bağımsız çizgiyi korur."

 trait_education_dragon_3_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] insanların arasında yetişmiştir, ancak ejderhalara özgü vahşi ve bağımsız çizgiyi korur."

 trait_education_dragon_4:0 "Sosyalleşmiş Ejderha"

 trait_education_dragon_4_desc:0 "Büyüme sürecinde uygun biçimde zorlanan ve ikna edilen bir ejderha, hem insanların hem de diğer ejderhaların yanında rahat hissedecek şekilde yetiştirilebilir."

 trait_education_dragon_4_character_desc:0 "Büyüme sürecinde uygun biçimde zorlanan ve ikna edilen [ROOT.Char.GetFirstNameNoTooltip], hem insanların hem de diğer ejderhaların yanında rahattır."

 trait_education_dragon_5:0 "Asil Ejderha"

 trait_education_dragon_5_desc:0 "Mizaç ve karakter örneği olan, ideal biçimde yetiştirilmiş bir ejderha, her ejderha binicisinin sorumluluğunda isteyebileceği her şeydir."

 trait_education_dragon_5_character_desc:0 "Mizaç ve karakter örneği olan [ROOT.Char.GetFirstNameNoTooltip], her ejderha binicisinin sorumluluğunda isteyebileceği her şeydir."

 trait_dragon_wounded:0 "Yaralı"

 trait_dragon_wounded_1:0 "Hafif Yaralı"

 trait_dragon_wounded_1_desc:0 "Küçük bir kaza ya da çok tek taraflı bir çatışma sonucu, bir ejderha hafifçe yaralanabilir."

 trait_dragon_wounded_1_character_desc:0 "Küçük bir kaza ya da çok tek taraflı bir çatışma sonucu [ROOT.Char.GetFirstNameNoTooltip] hafifçe yaralanmıştır."

 trait_dragon_wounded_2:0 "Yaralı"

 trait_dragon_wounded_2_desc:0 "Boyutlarındaki yaratıklar için şaşırtıcı olsa da ejderhalar savaşta ya da kazalar sonucu yaralanabilir."

 trait_dragon_wounded_2_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] bir yara almıştır — [ROOT.Char.Custom('GetDragonHerHis')] boyutundaki bir yaratık için şaşırtıcı."

 trait_dragon_wounded_3:0 "Ağır Yaralı"

 trait_dragon_wounded_3_desc:0 "Bir ejderha, tam iyileşmek için çok dinlenme gerektiren büyük bir yara alabilir."

 trait_dragon_wounded_3_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] büyük bir yara almıştır ve tam iyileşmek için çok dinlenmesi gerekecektir."

 trait_dragon_wounded_4:0 "Ağır Biçimde Yaralı"

 trait_dragon_wounded_4_desc:0 "Bu büyüklükte bir yara ancak büyük ve korkunç bir şey tarafından açılmış olabilir."

 trait_dragon_wounded_4_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] gerçekten ağır bir yara almıştır — bu büyüklükte bir yara ancak büyük ve korkunç bir şey tarafından açılmış olabilir."

 trait_dragon_wounded_5:0 "Ölümcül Yaralı"

 trait_dragon_wounded_5_desc:0 "Böylesine muhteşem bir yaratık için tüm olasılıklara rağmen ejderhalar neredeyse ölümcül olacak kadar ağır yaralar alabilir."

 trait_dragon_wounded_5_character_desc:0 "[ROOT.Char.Custom('GetDragonHerHis')] boyutundaki bir yaratık için tüm olasılıklara rağmen [ROOT.Char.GetFirstNameNoTooltip], ölüme yaklaşacak kadar ağır yaralanmıştır."

 trait_dragon_burned:0 "Yanmış"

 trait_dragon_burned_desc:0 "Doğuştan ateşe dirençli olsalar da ejderhalar gerçekten büyük bir ısıyla yanabilir."

 trait_dragon_burned_character_desc:0 "Gerçekten büyük bir ısıya maruz kalan [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDragonHerHis')] vücudunun geniş bölümlerinde yanmıştır."

 trait_dragon_ill:0 "Hasta"

 trait_dragon_ill_desc:0 "Ejderhalar nadiren hastalansa da, kötü bir yemek ya da görünmez bir hastalık yüzünden zaman zaman hastalandıkları bilinir."

 trait_dragon_ill_character_desc:0 "Ejderhalar nadiren hastalansa da [ROOT.Char.GetFirstNameNoTooltip], görünmez bir hastalık ya da kötü bir yemek yüzünden hastalanmıştır."

 trait_dragon_blind:0 "Kör"

 trait_dragon_blind_desc:0 "Yaralanma ya da doğumdaki bir talihsizlik nedeniyle bu ejderha göremez."

 trait_dragon_blind_character_desc:0 "Yaralanma ya da doğumdaki bir talihsizlik nedeniyle [ROOT.Char.GetFirstNameNoTooltip] göremez."

 trait_dragon_blind_character_desc_laenas_wyrm:0 "Yaralanma ya da doğumdaki bir talihsizlik nedeniyle [ROOT.Char.GetNicknameNoTooltip] göremez."

 trait_dragon_depressed:0 "$trait_depressed_1$"

 trait_dragon_depressed_desc:0 "Bu ejderha, önceki binicisinin ölümünden sonra büyük bir duygusal kayıp yaşamıştır. Sonuç olarak insanlarla etkileşimden kaçınmaya ve yalnız kalmaya başlamış, teselliyi yalnızlıkta aramıştır."

 trait_dragon_depressed_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDragonHerHis')] önceki binicisinin ölümünden sonra büyük bir duygusal kayıp yaşamıştır. Sonuç olarak [ROOT.Char.Custom('GetDragonSheHe')], insanlarla etkileşimden kaçınmaya ve yalnız kalmaya başlamış, teselliyi yalnızlıkta aramıştır."
