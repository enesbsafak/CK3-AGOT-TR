 agot_spy_network.0200.interface.employer.t:0 "Casus Sır Açığa Çıkarır"

 agot_spy_network.0200.interface.employer.desc:0 "[courtowner.GetTitledFirstNamePossessive] sarayındaki casuslarından biri işe yarayabilecek bir sır açığa çıkardı."

 agot_spy_network.0201.interface.employer.t:0 "Casus Bilgi İfşa Ediyor"

 agot_spy_network.0201.interface.employer.desc:0 "Casuslarından biri, sarayının sahibi hakkında kişisel ve askerî bilgiler ifşa etti."

 agot_spy_network.0200.interface.spymaster.t:0 "Casus Sır Açığa Çıkarır"

 agot_spy_network.0200.interface.spymaster.desc:0 "[courtowner.GetTitledFirstNamePossessive] sarayındaki casuslarından biri işe yarayabilecek bir sır açığa çıkardı."

 agot_spy_network.0210.t:0 "[ROOT.Char.GetLadyLord]'um,"

 agot_spy_network.0210.desc:0 "[courtowner.GetShortUINamePossessive] sarayında [secret_holder.GetTitledFirstName]'in korumaya çalıştığı bir sırrı ele geçirmeyi başardım. Bulduğum kanıtları teslim ederim, ama yalnızca hizmetim adil bir şekilde ödüllendirilirse."

 agot_spy_network.0210.a:0 "Her şeyi bilmem gerek!"

 agot_spy_network.0210.b:0 "İlgilenmiyorum."

 agot_spy_network.0210.c:0 "Param yok..."

 agot_spy_network.0400.t:0 "Bir Casus Devşirildi"

 agot_spy_network.0400.desc:0 "[councillor.GetTitledFirstName], [target_character.GetShortUINamePossessive] sarayında senin için casusluk yapmaya istekli birini buldu."

 agot_spy_network.0400.a:0 "[new_spy.GetTitledFirstName] bana iyi hizmet edecek."

 agot_spy_network.0500.t:0 "Bir Casus Yakalandı"

 agot_spy_network.0500.desc:0 "[councillor.GetTitledFirstName] bir casus keşfetti! [discovered_spy.GetTitledFirstName], sarayının en karanlık köşelerinde sır ararken yakalandı."

 agot_spy_network.0500.a:0 "Seni kim gönderdi?"

 agot_spy_network.0510.t:0 "Deşifre Oldun!"

 agot_spy_network.0510.desc:0 "Bir şekilde öğrendiler! [discovered_spy_employer.GetTitledFirstName] için casusluk yaptığım ortaya çıktı. Artık hayatım tehlikede. Belki beni kimin tuttuğunu söylersem bu işten sağ çıkabilirim?"

 agot_spy_network.0510.a:0 "Merhamet! Sana her şeyi anlatacağım!"

 agot_spy_network.0510.b:0 "Dudaklarım mühürlü kalacak!"

 agot_spy_network.0520.t:0 "Bir Casus Yakalandı"

 agot_spy_network.0520.flipped.desc:0 "[discovered_spy.GetTitledFirstName], merhamet dileyerek sana kimin casusluk yaptığını isteyerek açıkladı: [discovered_spy_employer.GetTitledFirstName]!"

 agot_spy_network.0520.loyal.desc:0 "[discovered_spy.GetTitledFirstName], sana kimin casusluk yaptığını açıklamayı reddediyor."

 agot_spy_network.0520.desc:0 "Hain için nasıl ilerlemek istersin?"

 agot_spy_network.0520.a:0 "[discovered_spy.GetTitledFirstNameNoTooltip] diyardan sürülecek."

 agot_spy_network.0520.b:0 "[discovered_spy.GetTitledFirstNameNoTooltip] bir hücrede çürümeli."

 agot_spy_network.0520.c:0 "Bu suçun tek cezası var: ölüm!"

 agot_spy_network.0520.d:0 "Merhametli olacağım. Ama bu entrikalar sona ermeli!"

 agot_spy_network.0600.t:0 "Casusun Deşifre Oldu!"

 agot_spy_network.0600.desc:0 "[discovered_spy.GetTitledFirstName]'den aldığımız gizli raporlar aniden kesildi. Görünüşe göre [discovered_spy.GetHerHis] becerileri, deşifre olmaktan kaçınmaya yetmedi."

 agot_spy_network.0600.flipped.desc:0 "Daha da kötüsü, [discovered_spy.GetTitledFirstName] senin parmağını da ifşa etti!"

 agot_spy_network.0600.a:0 "[discovered_spy.GetSheHe|U] yeterince dikkatli değildi!"

 agot_spy_network.0700.t:0 "Bir Casus Tutuldu"

 agot_spy_network.0700.desc:0 "[recipient.GetTitledFirstName], genişleyen casus ağının saflarına katıldı."

 agot_spy_network.0700.a:0 "Nüfuz ot gibi büyüyor..."

 agot_spy_network.0800.t:0 "Casus Tutulabilir"

 agot_spy_network.0800.desc:0 "Casusun, [recipient.GetTitledFirstNamePossessive] sarayında olası yeni bir casus buldu. [potential_new_spy.GetTitledFirstName], casus ağına katılmaya ikna edilebilir."

 agot_spy_network.0800.a:0 "Yakında [potential_new_spy.GetTitledFirstName] ile iletişime geçmeliyim..."

