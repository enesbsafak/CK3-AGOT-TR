l_english:

 agot_dragonstone.0002.t:0 "Dragonstone'un [heir.Custom('GetPrincessPrince')]"

 agot_dragonstone.0002.desc:0 "I. Aenys'ten bu yana Dragonstone, Demir Taht varisinin makamıdır. [heir.GetFirstName] artık Dragonstone'u [heir.GetHerHis] başına yönetebilecek yaşa geldiğine göre, ya [heir.GetHerHis] diyardaki konumunun takdiri olarak [heir.GetHerHim]'e Dragonstone [heir.Custom('GetPrincessPrince')]'liği unvanını vermenin, ya da unvanı ileride kullanmak üzere kendime saklamanın zamanı geldi."

 agot_dragonstone.0002.a:0 "Gelenek korunmalı; [heir.GetFirstNameNoTooltip]'e Dragonstone'u vereceğim."

 agot_dragonstone.0002.b:0 "Bu gelenek zamanını doldurdu; Dragonstone'u kendime saklayacağım."

 agot_dragonstone.0003.t:0 "Dragonstone'un [heir.Custom('GetPrincessPrince')]"

 agot_dragonstone.0003.desc:0 "Artık Demir Taht'ta oturduğuma göre, varisim [heir.GetFirstNameNoTooltip]'in Dragonstone'un [heir.Custom('GetPrincessPrince')]'i olarak [heir.GetHerHis] yerini almasının zamanı geldi; ya da Fatih'in geleneksel makamını kendime kraliyet sığınağı olarak saklayabilirim."

 agot_dragonstone.0003.a:0 "Gelenek korunmalı; [heir.GetFirstNameNoTooltip]'e Dragonstone'u vereceğim."

 agot_dragonstone.0003.b:0 "Bu gelenek zamanını doldurdu; Dragonstone'u kendime saklayacağım."

 agot_dragonstone.0007.t:0 "Dragonstone'un [heir.Custom('GetPrincessPrince')]"

 agot_dragonstone.0007.desc:0 "[deceased_heir.GetFirstNameNoTooltip]'in ölümüyle, [heir.GetFirstNameNoTooltip] artık haklı olarak Dragonstone'un [heir.Custom('GetPrincessPrince')]'idir. [ROOT.Char.Custom2('RelationToMeShort', deceased_heir)]'imin ölümünden bu kadar kısa süre sonra yeni bir varis ilan etmeye hazır olup olmadığımdan emin değilim. Belki de şimdilik [heir.GetFirstNameNoTooltip]'i yakınımda tutmalıyım..."

 agot_dragonstone.0007.a:0 "Gelenek korunmalı; [heir.GetFirstNameNoTooltip]'e Dragonstone'u vereceğim."

 agot_dragonstone.0007.b:0 "[heir.GetFirstNameNoTooltip]'e henüz Dragonstone'u verecek durumda değilim."

 agot_dragonstone.0008.t:0 "[heir.Custom('GetPrincessPrince')] ve Varis"

 agot_dragonstone.0008.desc:0 "Gelenek ve hak gereği, Demir Taht'ın varisi önce [heir.GetHerHis] iradesini Dragonstone'da bilemek zorundadır. Bugün bu görev, kendisinden öncekilerin yaptığı gibi artık [heir.Custom('GetPrincessPrince')] olarak hüküm süren [heir.GetFirstName]'e geçiyor. Bir komuta tadı, neyin beklediğine dair bir bakış — günün birinde, zamanım dolduğunda, [heir.GetSheHe] bu kadim makamdan fazlasını miras alacak; [heir.GetSheHe] diyarın kendisini miras alacak.\n\nSarayın gözleri artık [heir.GetHerHim]'e dönüyor, izliyor, tartıyor. [heir.GetSheHe], günün birinde taşıyacağı yükün hakkını verebilecek mi?"

 agot_dragonstone.0008.a:0 "[heir.GetHerHis|U] yolu bellidir — gerisini zaman gösterecek."

 agot_dragonstone.0008.b:0 "[heir.GetSheHe]'in nasıl bir hükümdar olacağını merak ediyorum."

 agot_dragonstone.0009.t:0 "Mirastan Çıkarıldı"

 agot_dragonstone.0009.desc:0 "[monarch.GetName], beni mirastan çıkaran bir kraliyet fermanı yayınladı!\n\nİşleri daha da kötüleştirmek için [monarch.GetSheHe], Dragonstone'u taca geri vermemi emretti; zira burası Demir Taht'ın varisine aittir."

 agot_dragonstone.0009.a:0 "[monarch.GetSheHe|U] Dragonstone'u tutabilir, ama kaderimi ben tayin edeceğim."

 agot_dragonstone.0009.b:0 "Ne kadar aşağılayıcı. Boyun eğip saraya dönmeliyim."

 agot_dragonstone.0009.c:0 "Artık mirastan çıkarılmanın sonuçlarıyla yüzleşmeliyim."

 agot_dragonstone.0009.c_tt:0 "@warning_icon! #warning Bu, oyunun sona ermesiyle sonuçlanacak!#!"
