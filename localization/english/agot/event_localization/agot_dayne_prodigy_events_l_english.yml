l_english:

 agot_dayne_prodigy.0002.t:0 "Gözüpek Yıldız"

 agot_dayne_prodigy.0002.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', prodigy)] [prodigy.GetFirstName], iki yıldır savaş sanatını incelemek ve [prodigy.GetHerHis] kılıcıyla talim yapmaktan başka pek bir şey yapmadı; şimdi [prodigy.GetHerHim]'i gerçekten eğitmenin zamanı.\n\nSabah Yıldızı Kılıcı olmak için insan, en dehşet verici düşmanlarla bile yüzleşmeye hazır olmalıdır — ve bu amaçla, önümde iki eğitim seçeneği var: ya tehlikeli bir mızrak dövüşü talimiyle bu cesareti [prodigy.GetFirstNameNoTooltip]'e aşılamak, ya da [prodigy.GetHerHim]'in daha doğrudan silah eğitimi almasını sağlamak."

 agot_dayne_prodigy.0002.a:0 "Atların başına!"

 agot_dayne_prodigy.0002.a.tt:0 "[prodigy.GetFirstNameNoTooltip]'i daha cesur yapmaya çalışacaksın"

 agot_dayne_prodigy.0002.b:0 "Kılıcı kap!"

 agot_dayne_prodigy.0002.b.tt:0 "[prodigy.GetFirstNameNoTooltip] silah eğitimine devam edecek"

 agot_dayne_prodigy.0002.gainedprowess1:0 "[prodigy.GetFirstNamePossessiveNoTooltip] [prowess|E] [prowess_i] 1 artar"

 agot_dayne_prodigy.0002.gainedprowess2:0 "[prodigy.GetFirstNamePossessiveNoTooltip] [prowess|E] [prowess_i] 2 artar"

 agot_dayne_prodigy.0002.gainedprowess3:0 "[prodigy.GetFirstNamePossessiveNoTooltip] [prowess|E] [prowess_i] 3 artar"

 agot_dayne_prodigy.0002.gainednoprowess:0 "[prodigy.GetFirstNameNoTooltip] hiç [prowess|E] kazanmadı"

 agot_dayne_prodigy.0002.gainedtraitbrave:0 "[prodigy.GetFirstNameNoTooltip], [GetTrait('brave').GetName( prodigy )] [trait|E]'ni kazandı"

 agot_dayne_prodigy.0002.gainedtraitcraven:0 "[prodigy.GetFirstNameNoTooltip], [GetTrait('craven').GetName( prodigy )] [trait|E]'ni kazandı"

 agot_dayne_prodigy.0003.t:0 "Adalet ve Çelik"

 agot_dayne_prodigy.0003.desc:0 "[prodigy.GetFirstNamePossessive] eğitimi iyi ilerliyor; gerçi şövalyelik, kılıç sallamak ve düşmana hücum etmekten ibaret değildir. Efendinin adaletini hak edenlere ulaştırmak da gerekir. Ama adalet ağır bir yüktür ve onun da payına düşen zorluklar yok değildir.\n\nBu yüzden bir yol ayrımına geldim; benim [ROOT.Char.Custom2('RelationToMe', prodigy)]'in hâlâ öğrenmesi gereken iki ders arasında kaldım... Yakında bir duruşma olacak ve onunla birlikte adaletin yerini buluşuna bizzat tanık olma şansı doğacak. Ancak bu duruşmaya tanıklık etmek, elimizde kılıçla geçirebileceğimiz zamanı alacak; bu yüzden seçmeliyim:\n\nSabah Yıldızı Kılıcı için hangisi daha ağır — adalet mi, yoksa #bold [prodigy.GetHerHis] kılıcı mı?"

 agot_dayne_prodigy.0003.a:0 "[prodigy.GetSheHe|U] adaletin ağırlığını taşıyacak."

 agot_dayne_prodigy.0003.a.tt:0 "[prodigy.GetFirstNameNoTooltip]'i daha adil yapmaya çalışacaksın"

 agot_dayne_prodigy.0003.b:0 "[prodigy.GetSheHe|U] kılıcın ağırlığına sadık kalacak."

 agot_dayne_prodigy.0003.b.tt:0 "[prodigy.GetFirstNameNoTooltip] silah eğitimine devam edecek"

 agot_dayne_prodigy.0003.gainedtraitjust:0 "[prodigy.GetFirstNameNoTooltip], [GetTrait('just').GetName( prodigy )] [trait|E]'ni kazandı"

 agot_dayne_prodigy.0003.gainedtraitcallous:0 "[prodigy.GetFirstNameNoTooltip], [GetTrait('callous').GetName( prodigy )] [trait|E]'ni kazandı"

 agot_dayne_prodigy.0004.t:0 "Merhametli Bir El"

 agot_dayne_prodigy.0004.desc:0 "Sabah Yıldızı Kılıcı'nı, küçük hanelerin sıradan şövalyelerinden ayıran şey yalnızca kılıçtaki eşsiz hünerleri değil, her birinin tüm görevlerinde taşıdığı ruh asaletidir. Gerçekten büyük bir şövalye olmak, daha zor seçim olsa bile merhamet göstermektir.\n\nKimi merhametle doğar, kimisi bunu yetiştirilirken öğrenmek zorundadır. [prodigy.GetFirstName]'in yalnızca kılıçla gelişmemesi, bu merhamet ve şefkat derslerini de öğrenmesi gerektiğini biliyorum. Bunu yapmak, [prodigy.GetHerHim]'e başkalarının hayatlarını ve değerlerinin gerçeğini göstermek anlamına gelecek. Bu, kılıç taliminden zaman ayıracak; ama [prodigy.GetHerHis] gelecek tüm günleri için çok daha değerli olabilir. Yine de, vermem gereken bir seçim bu:\n\nKılıç mı, yoksa yürek mi?"

 agot_dayne_prodigy.0004.desc_nocomp:0 "Sabah Yıldızı Kılıcı'nı, küçük hanelerin sıradan şövalyelerinden ayıran şey yalnızca kılıçtaki eşsiz hünerleri değil, her birinin tüm görevlerinde taşıdığı ruh asaletidir. Gerçekten büyük bir şövalye olmak, daha zor seçim olsa bile merhamet göstermektir.\n\nKimi merhametle doğar, kimisi bunu yetiştirilirken öğrenmek zorundadır. Korkarım artık onlara bu tür dersleri kazandıracak pek az zaman var; bu yüzden şimdi yapabileceğim tek şey, çeliğinle sahip olunan hünerin değerini öğretmek."

 agot_dayne_prodigy.0004.a:0 "Önce yüreği, sonra silahları eğiteceğiz."

 agot_dayne_prodigy.0004.a.tt:0 "[prodigy.GetFirstNameNoTooltip]'i daha şefkatli yapmaya çalışacaksın"

 agot_dayne_prodigy.0004.b:0 "Kılıç, merhametli bir yürekten daha çok işe yarar."

 agot_dayne_prodigy.0004.b.tt:0 "[prodigy.GetFirstNameNoTooltip] silah eğitimine devam edecek"

 agot_dayne_prodigy.0004.gainedtraitcompassionate:0 "[prodigy.GetFirstNameNoTooltip], [GetTrait('compassionate').GetName( prodigy )] [trait|E]'ni kazandı"

 agot_dayne_prodigy.0004.gainedtraitsadistic:0 "[prodigy.GetFirstNameNoTooltip], [GetTrait('sadistic').GetName( prodigy )] [trait|E]'ni kazandı"

 agot_dayne_prodigy.0005.t:0 "Şafakta Bir Sınav"

 agot_dayne_prodigy.0005.desc:0 "[prodigy.GetFirstName], hayatı boyunca bu gün için, ya silah hünerini kanıtlayacağı ya da [dawn.GetName]'e sonsuza dek ulaşamayacağını göreceği gün için eğitim aldı. Sabah Yıldızı Kılıcı olmak için her şeyden önce kılıcın gerçek bir ustası, belki de Westeros'taki ya da ötesindeki en büyüğü olmalısın.\n\n[dawn.GetNameNoTooltip] için yalnızca eşsiz bir şövalye yeterlidir ve bu yüzden imtihan vakti geldi. [prodigy.GetFirstNameNoTooltip], yetişkin bir şövalyeyle dövüşmek zorunda — hem de yalnızca kazanmakla kalmayıp süreçte olağanüstü bir hüner sergilemeli. [prodigy.GetSheHe] başarılı olursa, en azından hünerini herhangi bir şövalyenin şüpheye düşemeyeceği biçimde kanıtlamış olacak. Bu tehlikeli bir sınav olacak, hatta [prodigy.GetFirstNamePossessiveNoTooltip] ölümüyle bile sonuçlanabilir.\n\nBu, göze almaya razı olduğum bir risk mi?"

 agot_dayne_prodigy.0005.a:0 "Gerçek bir şövalye ölümü göze alır; imtihanı başlat."

 agot_dayne_prodigy.0005.a.tt:0 "[prodigy.GetFirstNameNoTooltip] ölümcül bir hüner sınavına girişecek"

 agot_dayne_prodigy.0005.b:0 "[prodigy.GetHerHim]'i riske atamam, iptal et!"

 agot_dayne_prodigy.0005.b.tt:0 "[prodigy.GetFirstNameNoTooltip] Sabah Yıldızı Kılıcı olma umudunu tümüyle bırakacak"

 agot_dayne_prodigy.0006.t:0 "Bekleyişle Dolu Bir Gece"

 agot_dayne_prodigy.0006.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', prodigy)] [prodigy.GetFirstName], ay gökyüzünde tepede ve sabaha daha çok varken bile avluda kılıçla talim yapmaya devam ediyor. Yarın [prodigy.GetSheHe] tartılacak ve ölçülecek; [prodigy.GetSheHe] de yetersiz bulunmaktan endişeleniyor.\n\nŞimdi yapabileceğimiz tek şey şafağı beklemek."

 agot_dayne_prodigy.0006.a:0 "Neredeyse hüküm vakti."

 agot_dayne_prodigy.0006.a.tt:0 "[prodigy.GetFirstNameNoTooltip], [prodigy.GetHerHis] layıklığına göre yargılanacak"

 agot_dayne_prodigy.0007.t:0 "Yükselen Güneş"

 agot_dayne_prodigy.0007.desc.non_parent:0 "Son zamanlarda hikâyeler duydum; hanemizin kılıçta hünerli, yüreği onurlu bir dâhisi olduğuna dair fısıltılar. Bana [prodigy.GetSheHe]'nin hanemizin geleceği olduğu, üstelik Sabah Yıldızı Kılıcı olmaya mukadder olduğu söylendi.\n\nBaşka ne doğruysa doğru, son hüküm herkes kadar bana da düşüyor: [prodigy.GetFullNameNicknamed], Sabah Yıldızı Kılıcı olmaya hazır mı?"

 agot_dayne_prodigy.0007.desc:0 "Hüküm günü geldi ve hanemizin tümü tanık olmak için burada. Alçak ve yüksek beylerin ve hanımefendilerin, küçük halkın ve şövalyelerin anlattıklarını dinledim. Hüner, yiğitlik ve soylu bir yürek masalları. Henüz destanları yazılmamış olsa da, [dawn.GetName]'i talep edenlerin hepsi, kadim kılıcı ilk kez havaya kaldırdıklarında diyar tarafından bilinmiyordu. Şanlarının gelmesi için daha bolca zaman var.\n\nSabahın ışığı odaya dağılıyor ve elimdeki [dawn.GetNameNoTooltip]'in süt beyazı kılıcına vuruyor; yüzeyini aydınlatıp omurgamdan aşağı ürpertiler gönderiyor. Şimdi vakti; duyulacak pek az şey, düşünülecek çok şey var.\n\nSon hüküm herkes kadar bana da düşüyor: Benim [ROOT.Char.Custom2('RelationToMe', prodigy)]'im, efsanevi Sabah Yıldızı Kılıcı olmaya layık mı? Bu kadar karanlıkla dolu bir dünyaya ışık getirmesi konusunda ona güvenilebilir mi?"

 agot_dayne_prodigy.0007.a:0 "[prodigy.GetSheHe|U] layık!"

 agot_dayne_prodigy.0007.a.tt:0 "[prodigy.GetFirstNameNoTooltip] Sabah Yıldızı Kılıcı olacak"

 agot_dayne_prodigy.0007.b:0 "[prodigy.GetFirstNameNoTooltip], kendisinin layık olmadığını kanıtladı."

 agot_dayne_prodigy.0007.b.tt:0 "[prodigy.GetFirstNameNoTooltip] Sabah Yıldızı Kılıcı olmayacak"

 agot_dayne_prodigy.0007.c:0 "[prodigy.GetFirstNameNoTooltip] layık olabilir, ama ben [prodigy.GetHerHim]'e [dawn.GetNameNoTooltip]'i vermeyeceğim."

 agot_dayne_prodigy.0007.c.tt:0 "[prodigy.GetFirstNameNoTooltip] Sabah Yıldızı Kılıcı olmayacak"

 agot_dayne_prodigy.0008.t:0 "Bekleyen Yıldız"

 agot_dayne_prodigy.0008.desc:0 "[prodigy.GetFirstName] çok çalıştı ve iyi eğitim aldı; kendisini [dawn.GetName]'i ve onunla gelen unvanı taşımaya fazlasıyla layık olduğunu kanıtladı. Hanemizin kılıcını şimdilik başkası kuşanıyor olsa da, onlar düşerse pelerini devralacak yeni bir yıldızın beklediğini biliyoruz. [prodigy.GetFirstNameNoTooltip] hayal kırıklığına uğradı ve uğramaya hakkı var; ama [prodigy.GetHerHis] zamanı gelecek."

 agot_dayne_prodigy.0008.a:0 "Sabır, zor bir derstir."

 agot_dayne_prodigy.0008.a.tt:0 "[prodigy.GetFirstNameNoTooltip] henüz Sabah Yıldızı Kılıcı olamaz"

 agot_dayne_prodigy.0009.t:0 "Gözüpek Yıldız"

 agot_dayne_prodigy.0009.desc:0 "İki yıldır savaş sanatını incelemek ve kılıcımla talim yapmaktan başka pek bir şey yapmadım; şimdi cesaretimi kanıtlama zamanı olabilir! Sabah Yıldızı Kılıcı olmak için insan, en dehşet verici düşmanlarla bile yüzleşmeye hazır olmalıdır. Beni hazırlaması için iki seçeneğim var: cesaretimi sınayacak bir mızrak dövüşü talimi ya da kılıç derslerime odaklanmak."

 agot_dayne_prodigy.0009.a:0 "Atımı getirin!"

 agot_dayne_prodigy.0009.a.tt:0 "Cesaretini kanıtlamaya çalışacaksın"

 agot_dayne_prodigy.0009.b:0 "[dawn.GetNameNoTooltip]'i kuşanacak eşsiz bir şövalye olmalı."

 agot_dayne_prodigy.0009.b.tt:0 "Kılıçla talim yapacaksın"

 agot_dayne_prodigy.0009.gainedprowess1:0 "[prowess|E]'in [prowess_i] 1 artar"

 agot_dayne_prodigy.0009.gainedprowess2:0 "[prowess|E]'in [prowess_i] 2 artar"

 agot_dayne_prodigy.0009.gainedprowess3:0 "[prowess|E]'in [prowess_i] 3 artar"

 agot_dayne_prodigy.0009.gainednoprowess:0 "Hiç [prowess|E] kazanmadın"

 agot_dayne_prodigy.0009.gainedtraitbrave:0 "[GetTrait('brave').GetName( ROOT.Char )] [trait|E]'ni kazandın"

 agot_dayne_prodigy.0009.gainedtraitcraven:0 "[GetTrait('craven').GetName( ROOT.Char )] [trait|E]'ni kazandın"

 agot_dayne_prodigy.0010.t:0 "Onur ve Çelik"

 agot_dayne_prodigy.0010.desc:0 "Yakında yerel bir suçlu için bir duruşma yapılacak; tüm hikâyeler, şövalyeleri efendilerinin adaletini dağıtan onurlu kişiler olarak anlatır ve [dawn.GetName]'e layık olduğumu kanıtlayacaksam ben de aynısı için çabalamalıyım. Bu duruşmada, adaletin yerini buluşunu ilk elden görme, ya da en azından bulmayışına tanık olma şansı görüyorum. Bu, elimde kılıçla geçirebileceğim zamanı alacak.\n\nHangisi daha değerli: onur mu, yoksa hüner mi?"

 agot_dayne_prodigy.0010.a:0 "Onuru seçeceğim."

 agot_dayne_prodigy.0010.a.tt:0 "Adaletin yollarını öğrenmeye çalışacaksın; ancak kendini umduğundan daha duygusuz bulabilirsin"

 agot_dayne_prodigy.0010.b:0 "Hüneri seçeceğim. "

 agot_dayne_prodigy.0010.b.tt:0 "Zamanı kılıcınla talim yaparak geçireceksin"

 agot_dayne_prodigy.0010.gainedtraitjust:0 "[GetTrait('just').GetName( ROOT.Char )] [trait|E]'ni kazandın"

 agot_dayne_prodigy.0010.gainedtraitcallous:0 "[GetTrait('callous').GetName( ROOT.Char )] [trait|E]'ni kazandın"

 agot_dayne_prodigy.0011.t:0 "Şefkatli Bir Yürek"

 agot_dayne_prodigy.0011.desc:0 "Hikâyeler, kulelerden güzel bakireleri kurtaran ve küçük halkı onları sömürmek isteyenlerden koruyan şövalye şövalyeleri anlatır. O hikâyelerdeki şövalyeler gibi olmak için, ruhumda aynı merhameti taşıdığımı kanıtlamalıyım.\n\nŞefkatimi öğrenip göstermek umuduyla küçük halkın arasında zaman mı geçirmeliyim? Yoksa silah hünerime mi öncelik vermeliyim?"

 agot_dayne_prodigy.0011.a:0 "Halkın arasında yürüyeceğim."

 agot_dayne_prodigy.0011.a.tt:0 "Şefkatini kanıtlamaya çalışacaksın; ancak tam tersi gerçekleşebilir"

 agot_dayne_prodigy.0011.b:0 "Kılıca odaklanacağım."

 agot_dayne_prodigy.0011.b.tt:0 "Kılıçla talime devam ediyorsun"

 agot_dayne_prodigy.0011.gainedtraitcompassionate:0 "[GetTrait('compassionate').GetName( ROOT.Char )] [trait|E]'ni kazandın"

 agot_dayne_prodigy.0011.gainedtraitsadistic:0 "[GetTrait('sadistic').GetName( ROOT.Char )] [trait|E]'ni kazandın"

 agot_dayne_prodigy.0012.t:0 "Şafakta Bir Sınav"

 agot_dayne_prodigy.0012.desc:0 "Eğitim avlusunda beni mor renkli şafak ışığının parlayan zırhlara vurduğu yalnız bir şövalye bekliyor. Hanemin üyeleri bu sınavı görmek ve değerimi ölçmek için toplandı. Bu yetişkin şövalyeyle tek dövüşte karşılaşacağım; köreltilmiş talim kılıçlarıyla değil, bileylenmiş çelikle. Düello ölümüne değil, ama bu sınavda birden çok yıldız düştü. Kılıcımın yüzeyini parlarken derin bir nefes alıyorum. Geri çekilmek, kendi güvenliğimi koruyup ailemin adına [dawn.GetName]'i kuşanma hayalimden vazgeçmek için hâlâ zaman var.\n\nPeki, bu sınava göğüs gerecek miyim? Yoksa tüm umutlarımdan kaçacak mıyım?"

 agot_dayne_prodigy.0012.a:0 "Bu mücadeleyle yüzleşeceğim."

 agot_dayne_prodigy.0012.a.tt:0 "Kılıç ustası olduğunu kanıtlamaya çalışacaksın; ancak bu riskli"

 agot_dayne_prodigy.0012.b:0 "Hayalimi unut, canımı koruyacağım."

 agot_dayne_prodigy.0012.b.tt:0 "Sabah Yıldızı Kılıcı olmaktan vazgeçiyorsun"

 agot_dayne_prodigy.0013.t:0 "Yükselen Yıldız"

 agot_dayne_prodigy.0013.desc.intro:0 "House Dayne'in merkezinin salonlarında duruyorum; Dawn'ın kendisi duvarda bekliyor. Bugün, Sabah Yıldızı Kılıcı olma hakkını kazanıp kazanmadığımı öğreneceğim.\n\n"

 agot_dayne_prodigy.0013.desc.worthynothousehead:0 "House Dayne'in başı [dayne_dynasty_head.GetFullName], yüzünde bir gülümsemeyle öne çıkıp [dawn.GetName]'i dinlendiği yerden almamı buyuruyor. Ailem arkamda adımı haykırırken, titreyen ellerimle hanemin tarihini yazan kılıca uzanıyorum. Tarih artık gözlerini bana dikecek; bakışlarına layık olduğumu kanıtlamalıyım."

 agot_dayne_prodigy.0013.desc.unworthynothousehead:0 "House Dayne'in başı [dayne_dynasty_head.GetFullName], hayal kırıklığıyla kaşlarını çatarak [dawn.GetName]'e dokunmamı bile yasaklıyor; hanemin adına kuşanmamı söylemiyorum bile. Kılıcı taşımaya layık değilim ve Sabah Yıldızı Kılıcı olma hayallerim tozun içinde yatıyor."

 agot_dayne_prodigy.0013.desc.worthyhousehead:0 "Hanemin başı olarak, bir şövalyenin [dawn.GetName]'i kuşanmaya layık olduğunu kanıtlayıp kanıtlamadığına karar vermek bana düşüyor. Kibir olmadan söyleyebilirim ki, kimse layıklığımdan şüphe duymaz; hünerimi ve asaletimi defalarca kanıtladım ve kadim kılıcımızı talep etmek benim hakkım. Bugün Sabah Yıldızı Kılıcı olarak duracağım ve adımı Westeros tarihine kazıyacağım!"

 agot_dayne_prodigy.0013.desc.unworthyhousehead:0 "House Dayne'in başı olarak, aramızdaki herhangi bir şövalyenin [dawn.GetName]'i talep edip Sabah Yıldızı Kılıcı olmaya layık olup olmadığına karar vermek bana düşüyor. Kutsal dinlenme yerindeki kılıca baktığımda, içimdeki her hücre onu talep etmek, kendime Sabah Yıldızı Kılıcı demek ve o unvanın şanını hissetmek istiyor.\n\nYine de gerçeği biliyorum: Ne o kılıcı ne de onu izleyen unvanı hak ettim. Şimdi onu almak, yalnızca kendimi ve hanemi onursuzluğa düşürür. [dawn.GetNameNoTooltip] yerinde kalmalı ve daha layık bir eli beklemeli."

 agot_dayne_prodigy.0013.a:0 "Ben Sabah Yıldızı Kılıcı'yım!"

 agot_dayne_prodigy.0013.a.tt:0 "Sabah Yıldızı Kılıcı oldun ve [dawn.GetNameNoTooltip]'i kuşanacaksın"

 agot_dayne_prodigy.0013.b:0 "Hanemi yüzüstü bıraktım."

 agot_dayne_prodigy.0013.b.tt:0 "Asla Sabah Yıldızı Kılıcı olamayacaksın"

 agot_dayne_prodigy.0014.t:0 "Bekleyen Yıldız"

 agot_dayne_prodigy.0014.desc:0 "Herkes Sabah Yıldızı Kılıcı unvanını taşımaya layık olduğumu açıkça kabul etse de, o unvanı şimdiden başkası taşıyor. Belki şansım zamanla gelecek, belki de kaderde hiç yoktu. Her iki durumda da, şimdilik enerjimi başka uğraşlara yönlendirmeliyim."

 agot_dayne_prodigy.0014.a:0 "Belki bir gün."

 agot_dayne_prodigy.0014.a.tt:0 "Zaten bir Sabah Yıldızı Kılıcı var"

 agot_dayne_prodigy.0015.t:0 "Karanlıkta Bir Hırsız"

 agot_dayne_prodigy.0015.desc:0 "[prodigy.GetFirstName], Sabah Yıldızı Kılıcı olma ödülü reddedilince [dawn.GetName]'i dinlendiği yerden çaldı. Hızla harekete geçilmezse [prodigy.GetSheHe] kaçabilir; artık [prodigy.GetHerHim]'i kafese konmak üzere geri getirmeye ve adaletin yerini bulmasına çalışmaktan başka seçeneğim yok.\n\n[prodigy.GetSheHe]'nin yeni Sabah Yıldızı Kılıcı'mız olmasını ummuştum, ama [prodigy.GetSheHe] geceyi seçti."

 agot_dayne_prodigy.0015.a:0 "Onları bana demir bir kafes içinde geri getirin!"

 agot_dayne_prodigy.0015.a.tt:0 "[prodigy.GetFirstNameNoTooltip]'i hapsetmeye çalışacaksın; ancak [prodigy.GetSheHe] kaçabilir"

 agot_dayne_prodigy.0016.t:0 "Yeni Bir Şafak"

 agot_dayne_prodigy.0016.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', prodigy)] [prodigy.GetFirstName]'in, uzun süredir beslediği Sabah Yıldızı Kılıcı olma hedefine nihayet ulaştığı ve tüm House Dayne'in gurur duyacağı bir şövalye olduğu haberi bana ulaştı."

 agot_dayne_prodigy.0016.a:0 "Yeni yükselen Yıldız'a!"

 agot_dayne_prodigy.0016.a.tt:0 "Bir Sabah Yıldızı Kılıcı yetiştirdin"

 agot_dayne_prodigy.0017.t:0 "Düşen Yıldız"

 agot_dayne_prodigy.0017.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', prodigy)]'im ve tüm büyük umutlarım, [prodigy.GetHerHim] ile birlikte tanrılara gitti. [prodigy.GetSheHe|U] öyle bir vaat gösteriyordu ki; şimdi ışıkları, en kısa ömürlü ve en parlak mum gibi söndü. Tanrılar bizi sevgiyle yaşayan yaratıklar olarak yarattı; bu da ardından gelen kaybı taşıması daha da güç kılıyor. Yine de, sabah güneş gibi bir başka yıldız yükselene dek, devam etmek zorundayız."

 agot_dayne_prodigy.0017.a:0 "Elveda, evladım."

 agot_dayne_prodigy.0017.a.tt:0 "Kaybının yasını tutacaksın"

 agot_dayne_prodigy.0018.t:0 "Harcanmış Yıldız"

 agot_dayne_prodigy.0018.desc:0 "Karakterinin ve yeteneğinin en son sınavındaki başarısızlığıyla, [prodigy.GetFirstName]'in asla Sabah Yıldızı Kılıcı olmayacağı hanemizdeki herkes için netleşti.\n\nBelki de bu benim hatamdı; potansiyelini harcadım ve [prodigy.GetHerHim]'e şövalye erdemlerini öğretemedim. Ya da belki en başından [prodigy.GetHerHim]'de gizli bir kusur vardı ve ben umutlarımı fazlasıyla yükseğe kurdum. Her halükârda, [prodigy.GetHerHis] hikâyesinin bu bölümünü temelli kapatmalı ve [prodigy.GetSheHe]'nin hanemize kendini kanıtlamasının başka bir yolunu bulmalıyız."

 agot_dayne_prodigy.0018.a:0 "Sana karşı başarısız oldum."

 agot_dayne_prodigy.0018.a.tt:0 "[prodigy.GetFirstNameNoTooltip] asla Sabah Yıldızı Kılıcı olamayacak"

 agot_dayne_Prodigy.0019.t:0 "Başarısız Yıldız"

 agot_dayne_prodigy.0019.desc:0 "Bir şövalye olarak hünerlerimin ve kişiliğimin son sınavındaki performansımla, tanrıların ve insanların gözünde layık olmadığımı kanıtladım. Artık benim için açık: Sabah Yıldızı Kılıcı olmaya asla layık sayılamam ve bu anlamsız hayalden vazgeçmeliyim.\n\nBelki asla en büyük şövalye olamayacağım, ama House Dayne'e kendimi kanıtlayabileceğim daha pek çok yol var."

 agot_dayne_prodigy.0019.a:0 "İşe yaramanın başka bir yolunu bulacağım."

 agot_dayne_prodigy.0019.a.tt:0 "Asla Sabah Yıldızı Kılıcı olamayacaksın"
