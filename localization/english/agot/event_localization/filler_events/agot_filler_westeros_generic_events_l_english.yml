l_english:

 agot_filler_westeros.0001.opening:0 "Bağımsız Bir Skagos."

 agot_filler_westeros.0001.desc:0 "Skagos, Kuzey'den ve Demir Taht'tan bağımsızlığını kazandı! Skagoslular artık baskı altında olmayacak ve filolarını yeniden inşa etmeye başladılar."

 agot_filler_westeros.0001.a:0 "Bu, yeni bir korsanlık çağı mı demek?"

 agot_filler_westeros.0002.opening:0 "Üç Kız Kardeş"

 agot_filler_westeros.0002.desc:0 "Üç Kız Kardeş, Vadi'nin ve Demir Taht'ın boyunduruğunu kırdı. Kız kardeşlilerin iradesi artık kendilerinden başka kimse tarafından yönetilmiyor! Dalgaların Leydisi bir kez daha şarkısını söyledi ve bizim için söylüyor!"

 agot_filler_westeros.0002.a:0 "Bu, Isırık için rahatsız edici bir haber..."

 agot_filler_westeros.0003.opening:0 "Demir Adaları Bağımsızlığı"

 agot_filler_westeros.0003.desc:0 "Demir Adaları bir kez daha özgür! Demirdoğanlar eskiden olduğu gibi denizlerde yelken açıp kıyıları yağmalayacak, Eski Yollar geri döndü! Bu, anakaralılara tek uyarıdır"

 agot_filler_westeros.0003.a:0 "Taşlı Kıyı kanayacak!"

 agot_filler_westeros.0004.opening:0 "Demir Adaları Bağımsızlığı"

 agot_filler_westeros.0004.desc:0 "Demir Adalar bir kez daha özgür! Demirdoğumlular geçmişte olduğu gibi bir kez daha denizlerde yelken açıp kıyıları biçecek, Eski Yolaklar geri döndü! Bu, yeşil karalılar için tek uyarıdır"

 agot_filler_westeros.0004.a:0 "Deniz Muhafızı dayanmalı!"

 agot_filler_westeros.0005.opening:0 "Demir Adaları Bağımsızlığı"

 agot_filler_westeros.0005.desc:0 "Demir Adaları bir kez daha özgür! Demirdoğanlar eskiden olduğu gibi denizlerde yelken açıp kıyıları yağmalayacak, Eski Yollar geri döndü! Bu, anakaralılara tek uyarıdır"

 agot_filler_westeros.0005.a:0 "Güzel Ada yakın tehlike altında."

 agot_filler_westeros.0006.opening:0 "Demir Adaları Bağımsızlığı"

 agot_filler_westeros.0006.desc:0 "Demir Adaları bir kez daha özgür! Demirdoğanlar eskiden olduğu gibi denizlerde yelken açıp kıyıları yağmalayacak, Eski Yollar geri döndü! Bu, anakaralılara tek uyarıdır"

 agot_filler_westeros.0006.a:0 "Kalkan Adaları güçlü durmalı!"

 agot_filler_westeros.0007.opening:0 "Dorne Bağımsızlığı"

 agot_filler_westeros.0007.desc:0 "Dorne, Demir Taht'tan koptu ve bundan böyle eskiden olduğu gibi kendini yönetecek! Dorne hiçbir zaman fethedilmedi; bu yüzden Dorne Prensleri kimseye boyun eğmeyecek!"

 agot_filler_westeros.0007.a:0 "Kızıl Dağlar boyunca gerginlik olacak"

 agot_filler_westeros.0008.opening:0 "Söylentiler Doğru"

 agot_filler_westeros.0008.desc:0 "Bu mektup, imanlıları Yedi Tanrı'nın en dindarının bile günahtan azade olmadığından haberdar etmek içindir. Bir zayıflık anında, bedenin günahına boyun eğdim."

 agot_filler_westeros.0008.a:0 "Skandal!"

 agot_filler_westeros.0008.b:0 "Nasıl.. o Yedi Tanrı'nın temsilcisi değil mi?"

 agot_filler_westeros.0008.c:0 "O yaşlı keçiyle yatan kimse için üzülüyorum"

 agot_filler_westeros.0009.opening:0 "Söylentiler Doğru"

 agot_filler_westeros.0009.desc:0 "Bu mektup, Yabancı'nın beni etkisi altına aldığını bildirmek içindir. Bu mektupta ayrıntıları tartışmak istemesem de, birinin canını aldım. Yedi Tanrı böyle bir günahı affetsin!"

 agot_filler_westeros.0009.a:0 "Yedi Tanrı aşkına!"

 agot_filler_westeros.0009.b:0 "Nasıl.. o Yedi Tanrı'nın temsilcisi değil mi? bir can almak..."

 agot_filler_westeros.0009.c:0 "İnançta yanlış olan o kadar çok şey var ki..."

 agot_filler_westeros.0010.opening:0 "Savaşın Bedeli"

 agot_filler_westeros.0010.desc:0 "Bu mektup size, hanemin savaş içinde olduğunu bildirmek içindir. Böyle zamanlarda insan kimin gerçek dostu olduğunu ya da kimin hanemin çöküşünü görmek istediğini anlar."

 agot_filler_westeros.0010.a:0 "Davalarına yardım için altın göndereceğim"

 agot_filler_westeros.0010.b:0 "Altın gönderirim ama karşılığında bir şey isterim"

 agot_filler_westeros.0010.c:0 "Bu beni ilgilendirmez"

 agot_filler_westeros.0017.opening:0 "Vadi: Dağ Klanlarının Yükselişi"

 agot_filler_westeros.0017.desc:0 "Bu mektup size, dağ klanlarının bir kralın arkasında birleştiğini bildirmek içindir. Vadi, kendi sınırları içindeki bir gücün tehdidi altında."

 agot_filler_westeros.0017.a:0 "Gergin bir durum..."

 agot_filler_westeros.0018.opening:0 "Avcı Bir Bey"

 agot_filler_westeros.0018.desc:0 "İyi [ROOT.Char.GetLadyLord|U], ortak bir tanıdık bana ikimizin benzer bir ilgiyi paylaştığını bildirdi. Doğruyu söyle, sen bir avcı mısın? Öyleyse avlamaktan en çok hangi avı keyif alırsın?"

 agot_filler_westeros.0018.a:0 "Yaban domuzu avının heyecanını severim."

 agot_filler_westeros.0018.b:0 "Geyik avı her zaman eğlencelidir."

 agot_filler_westeros.0018.c:0 "Korkarım şu an avlanacak vaktim yok."

 agot_filler_westeros.0019.opening:0 "Heyecan Verici Yaban Domuzu!"

 agot_filler_westeros.0019.desc:0 "Gerçekten heyecan verici! Av bekçim ormanlarımda epey iri bir yaban domuzu olduğunu bildirdi. Benimle bir ava çıkmak ister misin?"

 agot_filler_westeros.0019.a:0 "Eğlenceli görünüyor."

 agot_filler_westeros.0019.b:0 "Korkarım şu an avlanacak vaktim yok."

 agot_filler_westeros.0020.opening:0 "Asil Geyik!"

 agot_filler_westeros.0020.desc:0 "Dedikleri gibi geyik ormanın kralıdır! Av bekçim yakın zamanda epey iri bir tanesini gördü. Benimle bir ava çıkmak ister misin, birlikte belki canavarı devirebiliriz?"

 agot_filler_westeros.0020.a:0 "Eğlenceli görünüyor."

 agot_filler_westeros.0020.b:0 "Korkarım şu an avlanacak vaktim yok."

 agot_filler_westeros.0021.t:0 "Yaban Domuzu Avı"

 agot_filler_westeros.0021.desc:0 "Lord [fellow_hunter.GetFirstNameNoTooltip]'in av bekçisinin yaban domuzunu en son gördüğü yere varıyoruz. Biraz hoş sohbetten sonra köpekleri serbest bırakıp yaban domuzunun izini bulmaya çalışıyoruz."

 agot_filler_westeros.0021.a:0 "Bakalım izleri bulabilecek miyiz"

 agot_filler_westeros.0022.t:0 "Yaban Domuzu Avı"

 agot_filler_westeros.0022.desc:0 "Tazıların havlaması, yaban domuzunu bulduklarını haber verdi. Vardığımızda tazılar canavarı köşeye sıkıştırmıştı. Yaban domuzu yaklaştığımızı görünce saldırmak için başını eğdi."

 agot_filler_westeros.0022.a:0 "*Yaban Domuzu Mızrağını Hazırlar*"

 agot_filler_westeros.0022.b:0 "*kaçar*"

 agot_filler_westeros.0023.t:0 "Yaban Domuzu Avı"

 agot_filler_westeros.0023.desc:0 "Yaban domuzu dosdoğru mızrağa yüklendi; mızrağın kanatlarının canavarın gücüne dayanması için dua ediyorum. Mızrakla delinmesinin ardından saniyeler içinde yaban domuzu öldü."

 agot_filler_westeros.0023.a:0 "İyi bir av"

 agot_filler_westeros.0024.t:0 "Yaban Domuzu Avı"

 agot_filler_westeros.0024.desc:0 "Yaban domuzu saldırmaya başladığında kaçtım, mızrağımı düşürerek. Bir süre geçti ve Lord [fellow_hunter.GetFirstNameNoTooltip] beni bulmaya geldi; yaban domuzunu kendisi öldürmüştü. Düşürdüğüm mızrağı bana uzatırken tiksinerek baktı."

 agot_filler_westeros.0024.a:0 "Eminim bana korkak gözüyle bakıyor..."

 agot_filler_westeros.0025.t:0 "Geyik Avı"

 agot_filler_westeros.0025.desc:0 "Lord [fellow_hunter.GetFirstNameNoTooltip]'in av bekçisinin epey iri bir geyiği en son gördüğü yere varıyoruz. Biraz hoş sohbetten sonra geyiğin izini bulmaya çalışıyoruz."

 agot_filler_westeros.0025.a:0 "Hadi izleri arayalım!"

 agot_filler_westeros.0026.t:0 "Geyik Avı"

 agot_filler_westeros.0026.desc:0 "Günün ortalarında, bir açıklıkta iri bir geyik bulduk. Rüzgâr lehimizeydi ve canavar bizi fark etmemişti."

 agot_filler_westeros.0026.a:0 "*Hızla atışı yap*"

 agot_filler_westeros.0026.b:0 "*Atışı birlikte yap*"

 agot_filler_westeros.0026.c:0 "*Ev sahibinin atışı yapmasına izin ver*"

 agot_filler_westeros.0027.t:0 "Geyik Avı"

 agot_filler_westeros.0027.desc:0 "Ok isabet etti ve geyik dörtnala uzaklaştı. Kısa bir süre bekleyip kan izini takip etmeye başladık. Geyik, can çekişmeden önce ağaç sınırına kadar gitmeyi başarmıştı."

 agot_filler_westeros.0027.a:0 "Muhteşem bir canavar"

 agot_filler_westeros.0028.t:0 "Av: İz Yok"

 agot_filler_westeros.0028.desc:0 "Kırsalda saatlerce, hiçbir yerde av işareti olmadan arama yapıyoruz. İsteksizce Lord [fellow_hunter.GetFirstNameNoTooltip] ve ben avı sonlandırmaya karar veriyoruz; belki bir gün tekrar avlanma şansımız olur."

 agot_filler_westeros.0028.a:0 "Talihsiz bir av"

 agot_filler_westeros.0029.t:0 "Av: Yolları Ayırmak"

 agot_filler_westeros.0029.desc:0 "Av yüklenince, Lord [fellow_hunter.GetFirstNameNoTooltip] ve ben hoş sohbetler edip yollarımızı ayırdık."

 agot_filler_westeros.0029.a:0 "İyi bir av"

 agot_filler_westeros.0029.b:0 "Bu av bir hataydı.."

 agot_filler_westeros.0029.c:0 "Benim için iyi bir av.. belki ev sahibim için değil"

 agot_filler_westeros.0030.opening:0 "İyi Bir Av"

 agot_filler_westeros.0030.desc:0 "Av muhteşemdi! Doğrusu bu kadar iyi bir av yapmayalı uzun zaman olmuştu. Teşekkür ederim"

 agot_filler_westeros.0030.a:0 "Avdan keyif alıyorum"

 agot_filler_westeros.0031.opening:0 "Kötü Bir Av"

 agot_filler_westeros.0031.desc:0 "Av için zaman ayırdığın için teşekkür ederim. Artık ortak tanıdığımızın yanıldığını ve senin bir avcı olmadığını görüyorum. Bu yolculuğa katlandığın için teşekkürler."

 agot_filler_westeros.0031.a:0 "İyi bir izlenim bıraktığımı sanmıyorum..."

 agot_filler_westeros.0032.opening:0 "Kibirli Bir Avcı"

 agot_filler_westeros.0032.desc:0 "Yetenekli bir avcı olduğunu kabul ederken, seni oldukça açgözlü buldum. İkimiz için de görkemli olması gereken bir avı kendine sakladın."

 agot_filler_westeros.0032.a:0 "O sadece kıskanç"

 agot_filler_westeros.0033.opening:0 "Skagos Boyun Eğiyor"

 agot_filler_westeros.0033.desc:0 "Skagos artık bağımsız değil ve kralının emriyle artık "denizin belası" olmayacak."

 agot_filler_westeros.0033.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0034.opening:0 "Üç Kız Kardeş Boyun Eğdi"

 agot_filler_westeros.0034.desc:0 "Üç Kız Kardeş, Kraliyet'in yönetimine döndü ve artık Isırık ile Parmaklar boyunca baskın yapmayacak."

 agot_filler_westeros.0034.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0035.opening:0 "Demir Adaları Hâkimiyeti"

 agot_filler_westeros.0035.desc:0 "Demir Adalar, Kraliyet'in yönetimine geri döndü. Demirdoğumluların baskınları Taşlı Kıyı denizi boyunca sona erecek."

 agot_filler_westeros.0035.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0036.opening:0 "Demir Adaları Hâkimiyeti"

 agot_filler_westeros.0036.desc:0 "Demir Adalar, Kraliyet'in yönetimine geri döndü. Demirdoğumluların baskınları Kartal Burnu boyunca sona erecek."

 agot_filler_westeros.0036.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0037.opening:0 "Demir Adaları Hâkimiyeti"

 agot_filler_westeros.0037.desc:0 "Demir Adalar, Kraliyet'in yönetimine geri döndü. Demirdoğumluların baskınları Güzel Adalar boyunca sona erecek."

 agot_filler_westeros.0037.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0038.opening:0 "Demir Adaları Hâkimiyeti"

 agot_filler_westeros.0038.desc:0 "Demir Adalar, Kraliyet'in yönetimine geri döndü. Demirdoğumluların baskınları Arbor ve Eski Kent boyunca sona erecek."

 agot_filler_westeros.0038.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0039.opening:0 "Dorne Boyun Eğdi"

 agot_filler_westeros.0039.desc:0 "Dorne, Kraliyet yönetimi altına döndü ve artık bağımsız değil."

 agot_filler_westeros.0039.a:0 "Sonunda bu deliliğin sonu"

 agot_filler_westeros.0040.opening:0 "Bahçıvan Bir Bey"

 agot_filler_westeros.0040.desc:0 "Ortak bir tanıdık bana ikimizin benzer bir ilgiyi paylaştığını bildirdi. Doğruyu söyle, sen bir bahçıvan mısın? Öyleyse malikanemi ziyaret edip benimkini gezmek ister misin?"

 agot_filler_westeros.0040.a:0 "Eğlenceli görünüyor"

 agot_filler_westeros.0040.b:0 "Bunun için vaktim yok"

 agot_filler_westeros.0041.t:0 "Bahçeler"

 agot_filler_westeros.0041.desc:0 "Lord [fellow_gardener.GetFirstNameNoTooltip]'e varıyoruz ve kısa bir hoş geldin sohbetinden sonra bahçe turuna başlıyoruz. Ev sahibim, yaratılışına koydukları işi sergilemek için çok heyecanlı görünüyordu."

 agot_filler_westeros.0041.a:0 "Haydi ilerleyelim"

 agot_filler_westeros.0042.t:0 "Bahçeler: Haşereler"

 agot_filler_westeros.0042.desc:0 "Bahçeye yaklaşırken Lord [fellow_gardener.GetFirstNameNoTooltip] nefesini tuttu. Güllerin birçoğunda yaprakları yiyen kocaman tırtıllar vardı. Ev sahibim manzara karşısında sersemlemiş görünüyordu."

 agot_filler_westeros.0042.a:0 "Elbette onlara zarar vermeyeceğiz"

 agot_filler_westeros.0042.b:0 "*Onları öldürmeye başlar*"

 agot_filler_westeros.0042.c:0 "Hmm.. Çok hoş ağaçlar"

 agot_filler_westeros.0043.t:0 "Bahçeler: Durmadan Konuşan Ev Sahibi"

 agot_filler_westeros.0043.desc:0 "Lord [fellow_gardener.GetFirstNameNoTooltip] bahçede yetişen birçok bitkiyi sergilemek için çok heyecanlıydı. Kendimi söze girmekte zorlanırken buldum."

 agot_filler_westeros.0043.a:0 "*Lord [fellow_gardener.GetFirstNameNoTooltip]'in sözünü kes*"

 agot_filler_westeros.0043.b:0 "Ev sahibim konuşsun"

 agot_filler_westeros.0043.c:0 "*Söze girmek için elimden geleni yapacağım*"

 agot_filler_westeros.0044.t:0 "Bahçeler: Renkli Bitkiler"

 agot_filler_westeros.0044.desc:0 "Bahçe çok renkliydi. Doğrusu hayatımda böyle bir renkli çiçek ve bitki çeşitliliği görmemiştim."

 agot_filler_westeros.0044.a:0 "Bitkiler ne kadar güzelse, o kadar ölümcüldür."

 agot_filler_westeros.0044.b:0 "Bununla kimi etkilemeye çalışıyorsun?"

 agot_filler_westeros.0044.c:0 "Bu, benimkinden daha güzel"

 agot_filler_westeros.0044.d:0 "Evet, bazı bitkilerden bende de var"

 agot_filler_westeros.0045.t:0 "Bahçeler: Yolları Ayırmak"

 agot_filler_westeros.0045.desc:0 "Lord [fellow_gardener.GetFirstNameNoTooltip] bahçe turunu ferahlatıcı bir öğleden sonra yemeğiyle bitirdi. Lord [fellow_gardener.GetFirstNameNoTooltip]'e misafirperverliği için teşekkür edip kendi evime ve bahçeme döndüm"

 agot_filler_westeros.0045.a:0 "Harika bir ziyaret"

 agot_filler_westeros.0045.b:0 "Bu yolculuktan keyif almadım"

 agot_filler_westeros.0046.opening:0 "İyi Bir Bahçıvan"

 agot_filler_westeros.0046.desc:0 "Bahçemi ziyaret etmenden keyif aldım. Doğrusu bir otu gülden ayırt edeceğinden şüpheliydim ama bitkiler konusunda kendini çok bilgili bir insan olarak gösterdin! Umarım seni tekrar ağırlarım!"

 agot_filler_westeros.0046.a:0 "Ziyaretten keyif alıyorum"

 agot_filler_westeros.0047.opening:0 "Kötü Bir Bahçıvan"

 agot_filler_westeros.0047.desc:0 "Bahçıvan olduğunu duyduğumda şüphelerim vardı. Haklı çıktıklarını söylemekten üzgünüm. Sen yalnızca kötü bir misafir değil, korkarım küreğin hangi ucunu kullanacağını bile bilmezsin!"

 agot_filler_westeros.0047.a:0 "İyi bir izlenim bıraktığımı sanmıyorum..."

 agot_filler_westeros.0048.opening:0 "Kılıç Ustası Bir Bey"

 agot_filler_westeros.0048.desc:0 "Ortak bir tanıdık bana ikimizin benzer bir ilgiyi paylaştığını bildirdi. Doğruyu söyle, sen bir kılıç ustası mısın? Öyleyse seni ağırlamaktan ve savaş sanatındaki bilgimizi paylaşmaktan keyif alırım."

 agot_filler_westeros.0048.a:0 "Eğlenceli görünüyor"

 agot_filler_westeros.0048.b:0 "Bunun için vaktim yok"

 agot_filler_westeros.0049.t:0 "Silahhane"

 agot_filler_westeros.0049.desc:0 "Lord [fellow_swordsman.GetFirstNameNoTooltip]'e varıyoruz ve kısa bir hoş geldin sohbetinden sonra silahhane turuna başlıyoruz. Her türden ve menşeden silahlar duvarları süslemiş."

 agot_filler_westeros.0049.a:0 "Ne konuşalım?"

 agot_filler_westeros.0050.t:0 "Silahhane: Savaş Sanatı"

 agot_filler_westeros.0050.desc:0 "Lord [fellow_swordsman.GetFirstNameNoTooltip] heyecanla masaya serdikleri bir haritayı gösterdi. Haritada çeşitli askeri birlikleri temsil eden minyatürler yerleştirilmişti ve haritaya topraklar çizilmişti. Ev sahibim bana dönüp "Söyle bakalım, savaş sanatından ne anlarsın?" dedi."

 agot_filler_westeros.0050.a:0 "Hareket kabiliyeti ve lojistik savaş için hayatidir"

 agot_filler_westeros.0050.b:0 "*Arazi belirleyici faktördür"

 agot_filler_westeros.0050.c:0 "Hmm.. barış her zaman en iyi seçenektir"

 agot_filler_westeros.0050.d:0 "Bir şeyler biliyorum ama daha çok senin görüşlerini duymak isterim"

 agot_filler_westeros.0051.t:0 "Silahhane: Temizlik"

 agot_filler_westeros.0051.desc:0 "Lord [fellow_swordsman.GetFirstNameNoTooltip] koleksiyonlarındaki silahları sergilemek için çok heyecanlıydı. Ancak dolaylı olarak, bunları ikimizin birlikte temizleyip incelemesini istiyor. Ev sahibim, silahlarını yalnızca kendine ve az sayıda kişiye emanet eden birine benziyor."

 agot_filler_westeros.0051.a:0 "Silahhanenin bu yarısını ben alayım"

 agot_filler_westeros.0051.b:0 "Buraya çelik parlatmaya gelmedim!"

 agot_filler_westeros.0051.c:0 "Yardım ederim *ama bundan memnun değilim*"

 agot_filler_westeros.0052.t:0 "Silahhane: Düello"

 agot_filler_westeros.0052.desc:0 "Lord [fellow_swordsman.GetFirstNameNoTooltip] beni buraya davet etme niyetini açıkça belirtti. [fellow_swordsman.GetSheHe|U] dostça bir düelloda [fellow_swordsman.GetHerHis] çeliğini benimkiyle sınamak istiyor."

 agot_filler_westeros.0052.a:0 "Başlayalım mı dostum?"

 agot_filler_westeros.0052.b:0 "Bir düelloya ilgim yok"

 agot_filler_westeros.0052.win:0 "Düello Kazanıldı"

 agot_filler_westeros.0052.lose:0 "Düello Kaybedildi"

 agot_filler_westeros.0053.t:0 "Silahhane: Yolları Ayırmak"

 agot_filler_westeros.0053.desc:0 "Silahhanede işimiz bitip [fellow_swordsman.GetShortUINamePossessiveNoTooltip]'in elindeki birkaç silahı inceledikten sonra, yollarımızı ayırma zamanı gelmişti. "

 agot_filler_westeros.0053.a:0 "Harika bir ziyaret"

 agot_filler_westeros.0053.b:0 "Bu yolculuktan keyif almadım"

 agot_filler_westeros.0054.opening:0 "İyi Bir Kılıç Ustası"

 agot_filler_westeros.0054.desc:0 "Ziyaretinden keyif aldım. Doğrusu kılıcı nasıl tutacağını bileceğinden şüpheliydim ama kendini çok bilgili bir insan olarak gösterdin! Umarım seni tekrar ağırlarım!"

 agot_filler_westeros.0054.a:0 "Ziyaretten keyif alıyorum"

 agot_filler_westeros.0055.opening:0 "Kötü Bir Kılıç Ustası"

 agot_filler_westeros.0055.desc:0 "Kılıç ustası olduğunu duyduğumda şüphelerim vardı. Haklı çıktıklarını söylemekten üzgünüm. Sen yalnızca kötü bir misafir değil, korkarım savaş alanında herkesten çok kendine zarar verecek birisin!"

 agot_filler_westeros.0055.a:0 "İyi bir izlenim bıraktığımı sanmıyorum..."

 agot_filler_westeros.0057.t:0 "Gümüş Gelin"

 agot_filler_westeros.0057.t_female:0 "Gümüş Halka"

 agot_filler_westeros.0057.desc:0 "Yüksek Valyria soyumuz, bizi diyarın sıradan lordlarından ve küçük halkından ayıran önemli bir ayrıcalıktır. Yine de [unmarried_child.Custom('GetDaughterSon')] için kandan uygun bir gelin yokken, belki de gözlerimi Dar Deniz'in ötesine çevirmeliyim?"

 agot_filler_westeros.0057.a:0 "[diplomat.GetFullName]'i Essos'a gönder!"

 agot_filler_westeros.0057.a.big_success:0 "[diplomat.GetFullName] mükemmel bir eşleşme buldu"

 agot_filler_westeros.0057.a.success:0 "[diplomat.GetFullName] uygun bir eşleşme buldu"

 agot_filler_westeros.0057.a.failure:0 "[diplomat.GetFullName] kötü bir eşleşme buldu"

 agot_filler_westeros.0057.a.tt:0 "[diplomat.GetFirstName] uygun bir eşleşme için pazarlık etmeye çalışacak!"

 agot_filler_westeros.0057.b:0 "Lordlar bir yabancıya saygı duymazlar!"

 agot_filler_westeros.0058.t:0 "Platin Bir Gelin"

 agot_filler_westeros.0058.t_female:0 "Platin Bir Damızlık"

 agot_filler_westeros.0058.desc:0 "[diplomat.GetName], saraya dönüşünden haftalar önce [diplomat.GetHerHis] muhteşem buluşunun haberini yolladı ve [ROOT.Char.GetPrimaryTitle.GetName]'in dört bir yanından pek çok seçkin saraylı, Dar Deniz'in ötesinden gelen bu güzelliği bir an olsun görmek için salonun etrafını doldurdu; [essosi_bride.GetHerHim] hakkındaki anlatılar hayal güçlerini ele geçirmişti.\n\nKapılar açılıp [diplomat.GetFirstNameNoTooltip]'i, ardında onur muhafızlarıyla ortaya çıkardığında, [diplomat.GetSheHe]'ye eski kanın parıltılı bir örneği eşlik ediyordu; en iyi ipeklere ve damaskolara bürünmüş, [essosi_bride.GetHerHis] mor gözlerini ve gümüş-altın saçlarını öne çıkaran giysiler içindeydi.\n\n"[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip], izin verin size [essosi_bride.GetFullName]'i takdim edeyim; en kadim soydan gelen bir [essosi_bride.GetWomanMan]. Kendi babası, [ROOT.Char.GetHouse.GetName] Hanedanı'nın [ROOT.Char.Custom('FormalComplimentAdjective')] Westeros kolundan bir [unmarried_child.Custom('GetDaughterSon')] ile evlenme fırsatı için hatırı sayılır bir çeyiz teklif etti.""

 agot_filler_westeros.0058.a:0 "[essosi_bride.GetName] son derece mükemmel bir eşleşme!"

 agot_filler_westeros.0058.b:0 "Fikrimi değiştirdim, sarayımdan defol!"

 agot_filler_westeros.0059.t:0 "Gümüş Gelin" #good match

 agot_filler_westeros.0059.t_female:0 "Gümüş Halka"

 agot_filler_westeros.0059.desc:0 "[diplomat.GetName], saraya dönüşünden haftalar önce eşleşmenin haberini yolladı ve pek çok kişi [diplomat.GetHerHis] seferinin sonucunu bekliyordu.\n\nKapılar açılıp [diplomat.GetFirstNameNoTooltip]'i, ardında onur muhafızlarıyla ve yanında açıkça özgür şehirlerin özelliklerini taşıyan bir [essosi_bride.GetWomanMan] ile ortaya çıkardığında: "[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip], izin verin size [essosi_bride.GetFullName]'i takdim edeyim; iyi Valyria soyundan bir [essosi_bride.GetLadyLord]. Kendi babası, [ROOT.Char.GetHouse.GetName] Hanedanı'nın [ROOT.Char.Custom('FormalComplimentAdjective')] Westeros kolundan bir [unmarried_child.Custom('GetDaughterSon')] ile evlenme fırsatı için bir çeyiz teklif etti.""

 agot_filler_westeros.0059.a:0 "[essosi_bride.GetName] son derece mükemmel bir eşleşme!"

 agot_filler_westeros.0059.b:0 "Fikrimi değiştirdim, sarayımdan defol!"

 agot_filler_westeros.0060.t:0 "Teneke Bir Gelin"

 agot_filler_westeros.0060.t_female:0 "Tahta Bir Damızlık"

 agot_filler_westeros.0060.desc:0 "[diplomat.GetName]'den, maiyeti [county.GetNameNoTier]'e fazla tantanasız dönene dek hiçbir haber gelmedi.\n\n[diplomat.GetSheHe]'ye eski Valyria'nın dövülmüş gümüş saçlı genç bir [essosi_bride.GetWomanMan] eşlik ettiğinden her şey yolunda görünüyordu. "[ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip]," diye başlıyor [diplomat.GetSheHe], [diplomat.Custom('quirk_neg_pp')]. "Korkarım yolculuk komplikasyonlarla doluydu ve kibirli Eski Kanlar'la pazarlık etmek zor oldu. Bunun yerine size, Essos şehirlerini saran kendini beğenmişlikten uzak, saf Valyria soyundan bir [essosi_bride.GetWomanMan] getirdim."\n\nMüstakbel eşe şöyle bir göz atmak, [diplomat.GetSheHe]'nin sokaklardan bir köylü toplayıp saraya sunmadan önce üzerindeki kiri silmeye çalıştığını görmene yeter."

 agot_filler_westeros.0060.a:0 "[essosi_bride.GetNamePossessive] kanı saf, önemli olan tek şey bu."

 agot_filler_westeros.0060.b:0 "Beni hayal kırıklığına uğrattın [diplomat.GetTitledFirstName]!"

 agot_filler_westeros.0061.t:0 "Yedi Köşeli Yıldız Yaralı"

 agot_filler_westeros.0061.desc:0 "[ROOT.Char.Custom2('RelationToMe', zealot)] [zealot.GetName] benimkiyle aynı kafadadır. [zealot.GetSheHe] ile birlikte pek çok geceyi inancın doğası, eski Andal savaş lordları ve Yedi Tanrı'ya bağlılığımızı göstermenin doğru yolu üzerine derin teolojik sohbetlerle geçirmiştik. Bu yüzden, sabah duası için bir araya geldiğimizde [zealot.GetHerHis] yeni hali şok edici ama şaşırtıcı değil.\n\n"[zealot.Custom2('RelationToMe', ROOT.Char)]," diye eğiliyor [zealot.GetSheHe] ve [zealot.GetHerHis] alnına kazınmış, taze yaralar gibi kıpkırmızı ve azgın duran yedi köşeli yıldızı daha net görüyorum. "Sohbetlerimiz beni bir aydınlanmaya götürdü ve umarım sen de bu doğru yolda bana katılırsın." [zealot.GetSheHe|U] bir hançer çıkarıp sapını bana uzatıyor."

 agot_filler_westeros.0061.a:0 "Baba'yı etimde taşıyacağım."

 agot_filler_westeros.0061.b:0 "Yedi Tanrı bizim sakatlanmamızı istemez!"

 agot_filler_westeros.0062.t:0 "Açan Kış Gülleri"

 agot_filler_westeros.0062.desc:0 "[informer.GetTitledFirstName] bana kış güllerinin çiçek açtığını ve artık tamamen açmış olduklarını bildirdi. Güller, [ROOT.Char.GetHouse.GetName] Hanesi'nin bir hazinesidir ve kesinlikle görmem gereken bir şey.\n\nCam bahçelere doğru yol alırken, açmış tüm güllerin manzarasını eşsiz buluyorum; soluk mavileri, onları barındıran camın üzerindeki kırağıyı andırıyor. Kimse onlara aşkı ve güzelliği düşünmeden bakamaz."

 agot_filler_westeros.0062.a:0 "Ne güzel bir manzara!"

 agot_filler_westeros.0062.b:0 "Yanıma bir tane almak isterim."

 agot_filler_westeros.0062.c:0 "Bunlardan çarpıcı bir taç olur."

 agot_filler_westeros.0063.t:0 "Su Dansçısının Zarafeti"

 agot_filler_westeros.0063.desc:0 "Topraklarıma [location.GetNameNoTierNoTooltip]'e gezgin bir Braavoslu su dansçısı geldi. [waterdancer.GetTitledFirstName], Westeros'a yabancı bir dövüş stilinde ustadır; [ward_child.GetSheHe] zorlu eğitimi göğüslerse bu stil, turnuvalarda ya da gelecek karanlık günlerde [ward_child.GetName]'e fayda sağlayabilir.\n\nYine de gerçekte ne kadar değerli olabilir? Su dansı tamamen gösteriş gibi görünüyor; gerçek çarpışmada #italic dans etmenin#! ne faydası var?\n\n[waterdancer.GetFirstNameNoTooltip]'i [ROOT.Char.Custom2('RelationToMe', ward_child)]'e bu eşsiz stili öğretmesi için ikna etmeye değer mi?"

 agot_filler_westeros.0063.a:0 "[waterdancer.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0063.b:0 "Bir yabancıya bu kadar güvenemem."

 agot_filler_westeros.0064.t:0 "Sakallı Bir Rahibin Gizli Bilgeliği"

 agot_filler_westeros.0064.desc:0 "[location.GetNameNoTierNoTooltip]'e, [bearded_priest.GetHerHis] kılıcını paralı asker olarak sunan bir Norvoshlu sakallı rahip geldi. [bearded_priest.GetHerHis|U] dini Westeros'ta sapkınlık sayılsa da, gizli sakallı rahipler tarikatının Norvos'un en güçlü savaşçılarından bazılarını eğittiği ve silahlandırdığı bilinir — çünkü şehri bu kadar uzun süre başka nasıl yönetebilirlerdi?\n\nBüyük bir kumar olur ama [bearded_priest.GetHerHim]'i, bu yeteneğin [ward_child.GetHerHim]'e geçmesi umuduyla [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e hocalık etmesi için ikna edebilirim."

 agot_filler_westeros.0064.a:0 "[bearded_priest.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0064.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0065.t:0 "Zengin Bir Pentoslu Magister Sığınıyor"

 agot_filler_westeros.0065.desc:0 "Sürgün edilmiş bir Pentoslu magister, topraklarıma [location.GetNameNoTierNoTooltip]'e sığındı. [magistrate.GetSheHe] doğudaki son yıllarında ne kadar budalaca davransa da [magistrate.GetName], Dar Deniz'de diğer Özgür Şehirler ve Westeros'un birçok limanıyla ticaret yaparak kendi servetini kurdu. Deniz rotaları ve mallar hakkındaki bu bilgi, ailem için sadece para kazanmanın ötesinde paha biçilemez olabilir.\n\n[magistrate.GetHerHim]'e lüks bir konaklama teklif edebilirim; karşılığında [magistrate.GetHerHis] pazarlık, lojistik ve ticaret hikâyeleriyle [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e hocalık eder."

 agot_filler_westeros.0065.a:0 "[magistrate.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0065.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0066.t:0 "Çatımın Altında Bir Braavoslu Bankacı"

 agot_filler_westeros.0066.desc:0 "[location.GetNameNoTierNoTooltip]'e gezgin bir Braavoslu bankacı geldi. [banker.GetName] altını güvenle ve özenle idare etme konusunda uzun yıllara dayanan deneyime sahip; Westeros'ta [banker.GetHerHis] ününe ulaşmayı umabilecek çok az adam var.\n\nServetle pervasızca davranmak birçok büyük yöneticinin çöküşü olmuştur ve [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'in ölçülülüğü ve iyi yönetimi küçük yaştan öğrenmesi faydasına olur.\n\nYine de [banker.GetFirstNameNoTooltip]'in [ward_child.GetHerHim]'e öğretmek için isteyeceği bedele değer mi..."

 agot_filler_westeros.0066.a:0 "[banker.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0066.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0067.t:0 "Lysli Bir Diplomatın Tatlı Sözleri"

 agot_filler_westeros.0067.desc:0 "Gezgin bir Lysli diplomat, [location.GetNameNoTierNoTooltip]'de [diplomat.GetHerHis] yüzünü gösterdi; [diplomat.GetSheHe], Özgür Şehirler'den bıkıp görev aralarında Westeros'u geziyor.\n\nİhtilaflı Topraklar'daki gergin çatışmaları yatıştırma konusundaki uzun yıllara dayanan deneyimiyle [diplomat.GetName], hiç şüphesiz Westeros'taki anlaşmazlıkların kan gölüne dönüşmesini önleyebilecek becerilere sahip.\n\nBu tür beceriler büyük bir itibar getirir ve [diplomat.GetHerHim]'i bu yetenekleri [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e aktarması için tutabilirim."

 agot_filler_westeros.0067.a:0 "[diplomat.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0067.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0068.t:0 "Pentoslu Bir Soylunun Bilgeliği"

 agot_filler_westeros.0068.desc:0 "Topraklarıma [location.GetNameNoTierNoTooltip]'e gezgin, küçük bir Pentoslu soylu geldi. [noble.GetSheHe] hiçbir unvan taşımasa da [noble.GetName], yerlileri zenginleştiriyor ve Pentos'ta yöneticilere danışmanlık yapmak ve konseylerde oturmak gibi uzun bir geçmişe sahip. [noble.GetSheHe|U]'nin deneyimi, Westeros'taki kendi akrabalarımın hiçbirinde olmayan türden; kişinin dünya görüşünü genişletmek için nadir bir fırsat.\n\nBelki de [noble.GetHerHim]'i, [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e hocalık etmesi için ikna edebilirim, umarım bu bilgi işe yarar?"

 agot_filler_westeros.0068.a:0 "[noble.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0068.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0069.t:0 "Myrli Merak Ustası"

 agot_filler_westeros.0069.desc:0 "Myrli bir mucit Westeros'u geziyor ve bugün topraklarımda, [location.GetNameNoTierNoTooltip]'de mola veriyor. [inventor.GetSheHe]'nin sergilediği yaratılar dizisi akıl almaz.\n\n[ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName] günlerini acayip şeyler inşa ederek geçirmeyecek olsa da, bu tür yaratıcı düşünce ve maharet, [ward_child.GetSheHe] bir yönetici olarak kendi ayakları üzerinde durduğunda [ward_child.GetHerHim]'e fayda sağlayabilir.\n\nBelki [inventor.GetName]'i ders vermesi için ikna edebilirim?"

 agot_filler_westeros.0069.a:0 "[inventor.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0069.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0070.t:0 "Bir Gölge Bağlayıcının Varlığı"

 agot_filler_westeros.0070.desc:0 "[location.GetNameNoTierNoTooltip] köylüleri, yerel handa kalan Asshai'li gezgin bir gölge bağlayıcıdan korkup saklanıyor. Yarı düzine köylü bugün önüme gelip [shadowbinder.GetSheHe]'nin kara büyüleri yüzünden sürgün edilmesi, hatta öldürülmesi için yalvardı.\n\nAma aklıma farklı bir düşünce geliyor... Westeros'ta başka kim, egemenliği olmasa bile en azından gölgeleri anlamayı iddia edebilir?\n\n[shadowbinder.GetHerHim]'i [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e öğretmenlik etmesi için ikna edebilirsem, bu bilgi aileme nesiller boyunca fayda sağlayabilir."

 agot_filler_westeros.0070.a:0 "[shadowbinder.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0070.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0071.t:0 "Yaşlı Bir Asker"

 agot_filler_westeros.0071.desc:0 "[location.GetNameNoTierNoTooltip]'e emekli bir Volantisli general geldi — doğudaki bitmek bilmeyen savaşlardan bıkıp [general.GetName], son yıllarını İhtilaflı Topraklar'ın aralıksız kan döküşünden uzakta geçirmek için Westeros'a yöneldi.\n\nYerel handa tüccarlara ve gezginlere savaş hikâyeleri anlatırken yakalandığını duyunca, [general.GetHerHis] savaş sanatındaki görüşünün [ward_child.GetNamePossessive] gelişiminde rakipsiz olabileceğini düşünmeden edemiyorum.\n\nBelki [general.GetHerHim]'i [ROOT.Char.Custom2('RelationToMe', ward_child)]'e hocalık etmesi için ikna edebilirim..."

 agot_filler_westeros.0071.a:0 "[general.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0071.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0072.t:0 "Gezgin Bir Tyroshlu Paralı Asker"

 agot_filler_westeros.0072.desc:0 "[location.GetNameNoTierNoTooltip]'e gezgin bir Tyroshlu paralı asker geldi. İhtilaflı Topraklar'daki düzinelerce savaşın gazisi olan [sellsword.GetName], hem kılıç hem de askeri taktikler konusunda, ben gittikten sonra Westeros'a savaş dönerse [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e aktarabileceği değerli bilgilere sahip.\n\nYine de bir an tereddüt etmeden edemiyorum; bir paralı askere [ward_child.GetFirstNameNoTooltip]'i emanet etmek doğru mu?"

 agot_filler_westeros.0072.a:0 "[sellsword.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0072.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0073.t:0 "Qohor'dan Bir Mistik"

 agot_filler_westeros.0073.desc:0 "Uzak Qohor şehrinden gezgin bir büyücü, topraklarıma [location.GetNameNoTierNoTooltip]'e geldi. Bu tür uygulamalar Westeros'ta çoğu kişi tarafından reddedilir ama belki de biz sadece onları anlamıyoruz.\n\n[sorcerer.GetName]'i [ROOT.Char.Custom2('RelationToMe', ward_child)] [ward_child.GetName]'e öğretmenlik etmesi için ikna edebilirim; böylece [ward_child.GetSheHe], bu dünyanın gizemlerini [ward_child.GetHerHis] akranlarının hepsinden daha iyi kullanmayı öğrenir."

 agot_filler_westeros.0073.a:0 "[sorcerer.GetHerHis|U] görüşü [ward_child.GetFirstNameNoTooltip]'in gelişimine #italic yardımcı olurdu#!."

 agot_filler_westeros.0073.b:0 "$agot_filler_westeros.0063.b$"

 agot_filler_westeros.0080.t:0 "Batık Bir Hazine"

 agot_filler_westeros.0080.desc_court:0 "Üstat [councillor.GetName], kütüphanemizi karıştırırken yaptığı bir keşifle bana yaklaştı — bir hazine haritası!\n\n[councillor.GetSheHe] ne bulabileceğimizden emin olmasa da, okyanus tabanına batmış bir servet olabileceğine inanıyor.\n\nTek yapmamız gereken, derinliklere inmek ve geride ne kalmışsa aramak için dalgıç çanı olan bir gemi bulmak."

 agot_filler_westeros.0080.desc_council:0 "[councillor.GetCouncilTitle] [councillor.GetName], kütüphanemizi karıştırırken yaptığı bir keşifle bana yaklaştı — bir hazine haritası!\n\n[councillor.GetSheHe] ne bulabileceğimizden emin olmasa da, dalgaların altına batmış bir servet olabileceğine inanıyor.\n\nTek yapmamız gereken, derinliklere inmek ve geride ne kalmışsa aramak için dalgıç çanı olan bir gemi bulmak."

 agot_filler_westeros.0080.a:0 "Aşağıda ne zenginlikler yatıyor?"
