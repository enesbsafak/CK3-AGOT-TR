﻿﻿﻿l_english:

 agot_filler_riverlands.100.t:0 "Ticaretin Akışı"

 agot_filler_riverlands.100.desc:0 "Nehirler, akıntı yönünde yolculuk ediyorsanız otoyol gibi olabilir; ama aynı zamanda engellerdir — karşıya geçmesi gerekenler için mani; geçiş noktalarını elinde tutan hükümdarlar içinse fırsat. Benim gibi hükümdarlar.\n\nMuhafızlarım, kapımda vagonları ve yük hayvanlarıyla hızlı bir geçiş isteyen bir tüccar olduğu haberini getiriyor. Onun aradığını ona ancak ben verebilirim. Bunu nasıl lehime çevirebilirim?"

 agot_filler_riverlands.100.a:0 "Vagonları ticaret malıyla dolu olanın cebinde bolca para da vardır. Bakalım ne kadar sızdırabilirim."

 agot_filler_riverlands.100.a_tt:0 "Nominal bir geçiş ücreti alıyorsunuz; ancak duvarlarınızın içine girdikten sonra ondan daha fazlasını sızdıracaksınız."

 agot_filler_riverlands.100.b:0 "O bir tüccar değil; düşmanlarımın gönderdiği bir casus. Bununla nasıl başa çıkacağımı çok iyi biliyorum..."

 agot_filler_riverlands.100.b_tt:0 "Onu kaçırıp işkence görmesi için zindana gönderiyorsunuz... ya da daha kötüsü."

 agot_filler_riverlands.100.c:0 "Ticaret aksamamalı. Bana yalnızca mütevazı bir ücret düşüyor."

 agot_filler_riverlands.100.c_tt:0 "Nominal bir geçiş ücreti alıyorsunuz."

 agot_filler_riverlands.100.d:0 "Neden bu kadar acelesi var ki? Ziyafet çekip keyiflenelim!"

 agot_filler_riverlands.100.d_tt:0 "Tüccarı bir ziyafete davet ediyorsunuz."

 agot_filler_riverlands.101.t:0 "Ticaretin Akışı"

 agot_filler_riverlands.101.desc:0 "Bir nehrin üzerinde kaleye sahip olmanın güzel yanı, bir yolcu geçişe başladığında her iki taraftaki kapıları kapatmanın yeterli olmasıdır; böylece yolcunun devam etmesi ya da geri dönmesi oldukça güçleşir.\n\nElbette, tüccara geçiş ücretinin epeyce arttığını bildirdiğimde pek memnun olmadı; ama ne yapacak, hayır mı diyecek?"

 agot_filler_riverlands.101.a:0 "Anlaşmayı değiştiriyorum. Dua et, daha fazla değiştirmeyeyim."

 agot_filler_riverlands.101.a_tt:0 "Tüccarı sıkıştırıyorsunuz."

 agot_filler_riverlands.102.t:0 "Ticaretin Akışı"

 agot_filler_riverlands.102.desc:0 "Zindanımın soğuk, nemli derinliklerinde bu sözde tüccar hiç de o kadar kibirli değil. Merhamet için yalvarıyor, masum olduğunu söylüyor; ama onu bağışlamak, daha fazla sızma girişimini davet etmek olur.\n\nAyrıca, sıradakinin keyfini çıkaracağımı sanıyorum."

 agot_filler_riverlands.102.a:0 "Onun acısı benim zevkimdir ve bu acıyı çıkarmak için o kadar çok aletim var ki."

 agot_filler_riverlands.102.b:0 "Eti nefis görünüyor."

 agot_filler_riverlands.102.a_tt:0 "Ona işkence ediyorsunuz."

 agot_filler_riverlands.102.b_tt:0 "Onu öldürüp yiyorsunuz."

 agot_filler_riverlands.103.t:0 "Ticaretin Akışı"

 agot_filler_riverlands.103.desc:0 "Diğer lordlar daha yırtıcı bir tavır takınmış olabilirdi; ama cömertliğim gözden kaçmadı. Tüccar, özdeki nezaketimin sözünü yayıyor.\n\nŞan ya da para olmayabilir; ama böyle bir itibar da güzel bir şeydir."

 agot_filler_riverlands.103.a:0 "Nezaket kendi ödülüdür."

 agot_filler_riverlands.103.a_tt:0 "Seçiminizden memnunsunuz..."

 agot_filler_riverlands.104.t:0 "Ticaretin Akışı"

 agot_filler_riverlands.104.desc:0 "Salonlarımda lordları ve leydileri eğlendirdim çoğu zaman; ama sıradan bir tüccara bu ayrıcalığı tanımak her gün olan bir şey değil. Şaşırtıcı ve hoş biçimde, adam cömert olduğu kadar da keyifli; ziyafeti zenginleştirmek için mutfağıma kaliteli yiyecekler ve baharatlar sunuyor.\n\nAkşam, kahkahalar ve neşe dolu; ve neyse ki gösterişten uzak geçti."

 agot_filler_riverlands.104.a:0 "Belki halkla daha sık âlem yapmalıyım!"

 agot_filler_riverlands.104.b:0 "Gözünde bir parıltı var. Belki buna daha samimi bir biçimde devam edebiliriz."

 agot_filler_riverlands.104.a_tt:0 "Partiyle canlanıyorsunuz."

 agot_filler_riverlands.104.b_tt:0 "Onu özel odalarınıza davet ediyorsunuz"

 agot_filler_riverlands.105.t:0 "Ticaretin Akışı"

 agot_filler_riverlands.105.desc:0 "Odalarımın mahremiyetinde, gözündeki parıltı kavurucu bir aleve dönüşüyor. Dokunuşuyla nabzım hızlanıyor; ama gülümsemesi rahat."

 agot_filler_riverlands.105.a:0 "Bu doğru geliyor."

 agot_filler_riverlands.105.a_tt:0 "Tüccarla mutluluk dolu bir akşam geçiriyorsunuz."

 agot_filler_riverlands.200.t:0 "Eski Taş Yağmurları"

 agot_filler_riverlands.200.desc:0 "Küçük bir maiyetle Fairmarket ile Seagard arasında yolculuk ederken havada hafif, topraksı bir koku fark ediyorum. Tam zamanında başımı kaldırıp yüzümdeki sağanağın ilk damlalarını yakalıyorum. Soğuktan ve nemden tek sığınak, harap bir kalenin taşları arasındadır. Yağmur dinene dek yollar çamurlu ve berbat olacak; bu yüzden harabelerin arasında dinlenmeye karar veriyorum.\n\nKampı ancak kurduktan sonra buranın, Nehirler ve Tepelerin kadim Kralları Mudd Hanesi'nin harap olmuş makamı Oldstones olduğunu anlıyorum."

 agot_filler_riverlands.200.a:0 "Dinlenmek için huzursuz bir yer burası."

 agot_filler_riverlands.200.a_tt:0 "Ürkütücü harabeler sizi tedirgin ediyor."

 agot_filler_riverlands.200.b:0 "Bu yerde o kadar çok tarih var ki. Şarkı söylemek için ilham buluyorum."

 agot_filler_riverlands.200.b_tt:0 "Söylemek için birkaç şarkıdan birini seçin."

 agot_filler_riverlands.201.t:0 "Eski Taş Yağmurları"

 agot_filler_riverlands.201.desc:0 "Ayağımla bir ritim tutarak kadim bir ezginin girişini mırıldanıyorum; ardından dizeye geçiyorum."

 agot_filler_riverlands.201.a:0 "#italic Yıldız gözlü Ser Symeon, eşsiz bir savaşçı...#!"

 agot_filler_riverlands.201.a_tt:0 "Gözleri safir efsanevi bir savaşçının şarkısını söylüyorsunuz."

 agot_filler_riverlands.201.b:0 "#italic Ve dua ederim ki asla üstesinden gelemeyesin, Kurnaz Lann'ın...#!"

 agot_filler_riverlands.201.b_tt:0 "Lannister Hanesi'nin düzenbaz kurucusunun şarkısını söylüyorsunuz."

 agot_filler_riverlands.201.c:0 "#italic Derler ki Yeşilel Garth toprakları dolaşırken...#!"

 agot_filler_riverlands.201.c_tt:0 "Pek çok büyük hanenin efsanevi atası Yeşilel Garth'ın şarkısını söylüyorsunuz."

 agot_filler_riverlands.201.d:0 "#italic Korkusuzdu o, Zırhsız Şövalye...#!"

 agot_filler_riverlands.201.d_tt:0 "Gardener Kralları döneminden efsanevi bir savaşçının şarkısını söylüyorsunuz."

 agot_filler_riverlands.300.t:0 "Mızrak Üzerinde Balıkçılık Turnuvaları"

 agot_filler_riverlands.300.desc:0 "Özellikle parlak bir sabah en sevdiğim binek atımla gezintiye çıkmışken, bir patikada heyecanla ilerleyen uyumsuz bir adam grubuna rastlıyorum. Kimi genç, kimi yaşlı; kimileri paçavradan başka bir şey giymemiş, kimileriyse başarılı bir tüccara yakışan ince ipekler içinde. Ancak hepsinin elinde oltalar ve takımlar var.\n\nBu gezintilerinin ne olduğunu soruyorum.\n\n"We're off to the Trident," one man replies, as if that explained all.\n\n"Fishing," said another."The tournaments'll be startin' up soon. Begging your pardon, but you must've heard, mi[ROOT.Char.GetLadyLord|l].""

 agot_filler_riverlands.300.a:0 "Bu turnuvalardan biri para kazanacak. [ROOT.Char.GetLadyLord] olarak belli bir paya hakkım var."

 agot_filler_riverlands.300.a_tt:0 "Turnuvalara bir vergi koyuyorsunuz."

 agot_filler_riverlands.300.b:0 "Oltacılıkta epey iyiyimdir. Neden kendim katılmayayım?"

 agot_filler_riverlands.300.b_tt:0 "Turnuvalara katılıyorsunuz."

 agot_filler_riverlands.301.t:0 "Mızrak Üzerinde Balıkçılık Turnuvaları"

 agot_filler_riverlands.301.desc:0 "Trident'e oltayı atmak, büyük balığın yemeğinin gelmesini beklediği durgun suyu bulmak, oltayı onun dikkatli gözlerinden gizlemek ve liflerden ördüğüm düğümün gerçek bir sinek olduğuna onu ikna etmek bir zevktir. Bir zevk ama bundan ötesi, bir sanattır; ve sanat kolay gelmez.\n\nEve pek çok büyük balık yakalamış ve pek çok iyi oltacıyla tanışmış olarak dönüyorum. Tüm balıkçıların bildiği ve sevdiği sabah alacakaranlığında, mevki engellerinin ne kadar kolay yıkıldığı dikkat çekici. Tanıştığım bir balıkçı — bir septonun oğlu — ailesinde din ile balıkçılık arasında net bir çizgi olmadığını söyledi. Ne düşünce ama!"

 agot_filler_riverlands.301.a:0 "Nehirler balık tutmak içindir."

 agot_filler_riverlands.301.a_tt:0 "Eve yeniden canlanmış olarak dönüyorsunuz."

 agot_filler_riverlands.400.t:0 "Üzümden Şaraba"

 agot_filler_riverlands.400.desc:0 "Bir gün Trident kıyısında at sürerken, yemyeşil asmalardan oluşan düzgün sıralarla kaplı tepeler fark ediyorum.\n\n"Surely not grapes," I remark aloud, for everyone knows Dorne and the Arbor control the wine trade in Westeros.\n\n"Not so," one of my companions explains. "Apparently, there has been a recent blossoming of vineyards in the Riverlands."\n\nUpon reflection, it makes sense. Our soils are among the richest in Westeros, our lands the most fertile. Why should the water of the mighty Trident be any less succour to the grape than the sickly trickle of Dorne's Greenblood?"

 agot_filler_riverlands.400.a:0 "Bunda potansiyel var. Kendi bağımı kuracağım."

 agot_filler_riverlands.400.a_tt:0 "Yatırımınızın karşılığını verip vermeyeceğini görmek için beklemeniz gerekecek."

 agot_filler_riverlands.400.b:0 "[ROOT.Char.GetLadyLord] olarak kendi bağıma hakkım var."

 agot_filler_riverlands.400.b_tt:0 "Bir bağa zorla el koyacaksınız."

 agot_filler_riverlands.400.c:0 "Bunu karşılayamayız."

 agot_filler_riverlands.401.t:0 "Üzümden Şaraba"

 agot_filler_riverlands.401.desc:0 "Asmalarım sıcak güneşin tadını çıkarıyor ve Nehir Toprakları'nın humuslu topraklarıyla besleniyor. Üzümler asmada yağlanıyor ve şarapçılarım hasadın bol olacağına dair bana güvence veriyor. Bu harika bir fikirdi. Çok geçmeden kendi yapımım şaraptan yudumlayabileceğim!"

 agot_filler_riverlands.401.a:0 "Her şey yolunda gidiyor."

 agot_filler_riverlands.401.a_tt:0 "Bağ normal şekilde işlemeye devam edecek."

 agot_filler_riverlands.401.b:0 "Bu, düşündüğümden daha iyi bir fırsat. Daha fazla yatırım yapmalıyım!"

 agot_filler_riverlands.401.b_tt:0 "Daha büyük bir başlangıç harcamasıyla, uzun vadede daha büyük kâr elde edebilirsiniz."

 agot_filler_riverlands.402.t:0 "Üzümden Şaraba"

 agot_filler_riverlands.402.desc:0 "Villamın balkonunda yastıklı bir koltuğa yaslanmış, bağımın dalgalı tepelerine bakarken kendi Nehir Toprakları Beyazı'ndan bir kadeh yudumluyorum. En umut verici fıçılar yıllandırma için ayrıldı; ama daha sıradan variller bile kaliteli bir ürün ortaya çıkardı.\n\nBu değerlendirmede yalnız değilim; ilk partilerimizi ne kadar kolay sattığımız da bunun kanıtı. Dilimdeki sek beyazın tadı, kasalarıma giren yeni gelirler kadar zengin."

 agot_filler_riverlands.402.a:0 "Artık bir şarap üreticisiyim!"

 agot_filler_riverlands.402.a_tt:0 "Yatırımınızın kârını topluyorsunuz."

 agot_filler_riverlands.500.t:0 "Demir Akıncıları"

 agot_filler_riverlands.500.desc:0 "Güneş gri bir gökyüzünün üzerinden ve neredeyse tanıdık olup teselli verebilecek soğuk deniz rüzgârlarıyla doğuyor; ama Seagard'ın Gürleyen Kulesi'nin tunç çanı topraklarımda yankılandığında üzerime dehşet çöküyor. Görünüşe göre rüzgârlar yalnızca bulutları değil, Demirdoğumlu akıncıları da getirmiş. Zihnimde katliam ve yağma hikâyeleri canlanıyor — toprakları Demir Adamlar Körfezi boyunca uzanan her lordun ya da leydinin kabusu."

 agot_filler_riverlands.500.a:0 "Bugün cesaretimi sınayacak."

 agot_filler_riverlands.500.a_tt:0 "Nasıl tepki vereceğinize karar vermelisiniz."

 agot_filler_riverlands.501.t:0 "Demir Akıncıları"

 agot_filler_riverlands.501.desc:0 "Panik lüksüne sahip değilim. Halk duvarlarımın arkasına koşuştururken, ev muhafızlarımı toplayıp uzun gemilerinden sökün eden akıncılara meydan okumak için bir çıkış harekâtı düzenliyorum. Bunu hızla bitirmezsem halkımdan sayısız kişi ölecek.\n\nAkıncıların liderini görüyorum; Demir Adalılar'ın şöhretine layık, kana susamış bir yağmacı. Bakışlarımla buluşuyor ve dudakları kan çılgını bir sırıtışla kıvrılıyor."

 agot_filler_riverlands.501.a:0 "Bu pislikler, onları denize geri atanın [ROOT.Char.GetTitledFirstName] olduğunu hatırlayacak."

 agot_filler_riverlands.501.a_tt:0 "Lidere düello için meydan okuyorsunuz."

 agot_filler_riverlands.501.b:0 "Onunla yüzleşemem. Kaçmaktan başka çare yok!"

 agot_filler_riverlands.501.b_tt:0 "Hayatta kalacaksınız; ama topraklarınız yağmalanacak."

 agot_filler_riverlands.502.t:0 "Demir Akıncıları"

 agot_filler_riverlands.502.desc:0 "Öldürdüğüm düşmanın kanı, ayaklarımın dibinde deniz suyuna karışıyor. Bir an için Demirdoğumlu akıncılar, düellonun şartlarına rağmen akınlarına devam etmeyi düşünür gibi görünüyor; ama değerli eşyaların çoğunun saklanması ve halkın çoğunun sağlam duvarların ardına geçmesi için yeterli zamanı satın aldım.\n\nAdamlarımdan her dakika daha fazlası savunmaya toplanırken, Demirdoğumlular saldırılarının boşa çıktığını anlayıp uzun gemilerine ve denize dönüyor."

 agot_filler_riverlands.502.a:0 "Yakın zamanda geri dönmeyecekler."

 agot_filler_riverlands.502.a_tt:0 "Akıncılar kaçıyor."

 agot_filler_riverlands.502.b:0 "Her an geri dönebilirler."

 agot_filler_riverlands.502.b_tt:0 "Kıyı boyunca güvenliği sıkılaştıracaksınız."

 agot_filler_riverlands.502.c:0 "Bu zafer kutlama gerektirir!"

 agot_filler_riverlands.502.c_tt:0 "Savunmaya katılan herkesi onurlandıran bir ziyafet düzenliyorsunuz."

 developing_vineyard:0 "Gelişen Bağ"

 flourishing_vineyard:0 "Serpilen Bağ"

 booming_vineyard:0 "Palandöken Bağ"

 agot_filler_riverlands.0001.t:0 "Unutulmuş Geçmiş"

 agot_filler_riverlands.0001.desc:0 "Nehir Toprakları'nın yemyeşil kırsalı, bence yalnız gezgine sunduğu inziva açısından tüm Westeros'ta eşsizdir. Ancak bazen bu inziva, geçmişin hayaletleriyle dolup taşabilir; çünkü Nehir Toprakları hem İlk İnsanlar'ın hem Andallar'ın tarihiyle yoğundur.\n\nUzun zaman önce unutulmuş bir patikada dolaşırken, yoğun bir porsuk ağacı ve eğrelti otu çalılığından geçip bir açıklığa çıkıyorum. Hava ağır ve soğuk; ormanın sesleri kaybolmuş, sanki kadim bir fermanla kovulmuş gibi. Önümde harap bir türbe duruyor; taş yapısı çoktan asmalar ve kökler tarafından çatlatılmış ve aşındırılmış. Yine de kadim zanaatkarların betimlemeye çalıştığı belirsiz insan formunu seçebiliyorum; gövdesini solmuş rünler çevreliyor. Besbelli bir tanrı — gözleri, onca yüzyıllık ihmalden sonra bile ilahiliğin yoğunluğunu hâlâ taşıyor."

 agot_filler_riverlands.0001.a:0 "Sahte tanrıların hizmetinde o kadar çok emek harcanmış — biz artık daha aydınlanmışız."

 agot_filler_riverlands.0001.b:0 "Bu yerin güzelliği inkâr edilemez. Onu olduğu gibi takdir ediyorum."

 agot_filler_riverlands.0002.t:0 "Harap Karakol"

 agot_filler_riverlands.0002.desc:0 "Nehir Toprakları'nın güzelliği, keşfedilecek ne kadar çok yerin olması; ve her zamanki gibi yoldaş olarak yanımda [explorer_vassal.GetFirstNameNoTooltip] olduğu için minnettarım. Sonuçta, paylaşacak kimsen yoksa keşfetmenin ne anlamı var? Ve daha da önemlisi, bir çeşit hazineye ya da macera ganimetine rastlarsak, hepsini tek başıma nasıl geri taşıyacağım?\n\nÇok geçmeden bir tür eski karakol gibi görünen harabelere rastlıyoruz. Hepsi gözümün önünde bir an duraksıyorum ve [explorer_vassal.GetFirstNameNoTooltip] sırıtıyor. "Where should we explore first? Unless you're frightened, that is.\""

 agot_filler_riverlands.0002.a:0 "O kule cezbedici görünüyor!"

 agot_filler_riverlands.0002.b:0 "Kulenin arkasındaki orman bana ilham veriyor..."

 agot_filler_riverlands.0002.c:0 "Önce kışla."

 agot_filler_riverlands.0002.d:0 "Ah, ne budala, az önce hatırladım... bir #italic işim#! var!"

 agot_filler_riverlands.0002_tt.a:0 "Kuleye doğru ilerliyorsunuz."

 agot_filler_riverlands.0002_tt.b:0 "Ormanı keşfetmeye karar veriyorsunuz."

 agot_filler_riverlands.0002_tt.c:0 "Kışlaya yaklaşıyorsunuz."

 agot_filler_riverlands.0002_tt.d:0 "Konaklamanızın güvenliğine dönüyorsunuz."

 agot_filler_riverlands.0003.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0003.desc:0 "Korkmuş mu? #italic Rezalet#! O kuleye, görmüş olduğun en tırmanıcı [ROOT.Char.GetLadyLord|l] gibi tırmanacağım!\n\nCesurca içeri dalıyorum — ya [explorer_vassal.GetFirstNameNoTooltip]nün #italic bekleyeceği#! gibi birinci kattan başlarım, ya da beklentileri altüst edip merdivenlerden zirveye tırmanıp yukarıdan aşağıya doğru ilerlerim. Riskli olabilir; ama zaten iyi şeyler muhtemelen oradadır."

 agot_filler_riverlands.0003.a:0 "[explorer_vassal.GetFirstNameNoTooltip]nün yanıldığını çoktan kanıtladım; zemin kat yeterli olacak."

 agot_filler_riverlands.0003.b:0 "Bu kin dalgasını kulenin en tepesine dek süreceğim!"

 agot_filler_riverlands.0003_tt.a:0 "Zemin katı sakin bir şekilde ilginç bir şey için arıyorsunuz."

 agot_filler_riverlands.0003_tt.b:0 "İlginç bir şey bulmak için en üst kata koşuyorsunuz."

 agot_filler_riverlands.0004.t:0 "Harabe Karakol: Ormana Doğru"

 agot_filler_riverlands.0004.desc:0 "Meydan okumaya karşılık vererek cesurca ormana giriyorum ve derinlere indikçe orman sıklaşıyor.\n\n[explorer_vassal.GetFirstNameNoTooltip]yi gözden kaybettiğimi ve ağaç tepelerinin güneşi tamamen kesecek kadar sıklaştığını fark edene dek her şey yolunda..."

 agot_filler_riverlands.0004.a:0 "Daha ileri gitmemin #bold imkânı yok#!."

 agot_filler_riverlands.0004.b:0 "İçgüdülerimi görmezden gelmeyecek kadar akıllıyım. Geri dönme vakti."

 agot_filler_riverlands.0004.c:0 "Merhaba iblisler! Benim, sizin [ROOT.Char.GetLadyLord]niz!"

 agot_filler_riverlands.0004_tt.a:0 "Ormandan olabildiğince çabuk çıkıyorsunuz."

 agot_filler_riverlands.0004_tt.b:0 "Geri dönüyorsun."

 agot_filler_riverlands.0004_tt.c:0 "Ormanda daha derinlere iniyorsunuz."

 agot_filler_riverlands.0005.t:0 "Harabe Karakol: Kayıp Kışlalar"

 agot_filler_riverlands.0005.desc:0 "Tozun ve örümcek ağlarının hangi sırları barındırdığını görmeye hevesli, kışlaya koşuyorum. Ah, keşke duvarlar konuşup sırlarını anlatabilse — ama konuşamazlar; o yüzden bunun yerine parlak şeyler aramayı deneyebilirim."

 agot_filler_riverlands.0005.a:0 "Elbette birisi arkada #italic bir şey#! bırakmıştır!"

 agot_filler_riverlands.0005_tt.a:0 "Harap kışlayı arıyorsunuz."

 agot_filler_riverlands.0006.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0006.desc:0 "Boş çıktı — zemin katta kayda değer hiçbir şey yok ve ihtimale karşı bu kadim mobilyaların hepsini neredeyse ters çevirdim!\n\nAma üst katta hâlâ özel bir şey olabilir...\n\nMerdivenlere yaklaşıp taşı inceliyorum. Yapısal olarak sağlam olmadığı besbelli ve neredeyse kendi üzerine yarı yarıya çökmüş durumda. "There's no way it's safe..." I think to myself, "But if I take my time, I could still manage it. #italic Probably.#!""

 agot_filler_riverlands.0006.a:0 "Risksiz kazanılan hazine gerçekten kazanılmış sayılır mı?"

 agot_filler_riverlands.0006.b:0 "Bacaklarımın tam kullanımını seviyorum — geri dönüyorum."

 agot_filler_riverlands.0006_tt.a:0 "Merdivenlerden zirveye çıkıyorsunuz."

 agot_filler_riverlands.0006_tt.b:0 "Geri dönüyorsun."

 agot_filler_riverlands.0007.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0007.desc:0 "Kapağın üzerindeki kalın toz tabakasını temizlerken, değerlendirircesine kaşlarımı kaldırıyorum.\n\nGörünüşe göre, doğru üstada ya da koleksiyoncuya kesinlikle oldukça değerli gelebilecek eski bir kitap buldum. Çizimler tek kelimeyle büyüleyici; nedense çok sayıda kötü çizilmiş ejderha ve insan yüzlü salyangoz içeriyor."

 agot_filler_riverlands.0007.a:0 "Benimle eve geliyorsun, Bay Kitap!"

 agot_filler_riverlands.0008.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0008.desc:0 "Toz ve pislik bulutları kaldırarak telaşla ortalıkta dolaşırken, gözümün ucuyla küçük bir parıltı fark ediyorum.\n\nBazı molozların altında küçük bir sandık buluyorum. Biraz paslanmış ve açması zor; ama içinden saygın bir mücevher koleksiyonu çıkarınca duyduğum mutluluğu hayal edin."

 agot_filler_riverlands.0008.a:0 "Ne şans!"

 agot_filler_riverlands.0009.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0009.desc:0 "Biraz ufalanan taştan korkmadan, dikkatle merdivenlerden yukarı çıkıyorum. Ayrıca — risk ne kadar büyükse ödül de o kadar büyük, değil mi?\n\nNeyse ki kedi gibi reflekslerim beni güvenle en üst kata ulaştırıyor. Her yüzeydeki toza bakılırsa, burası çok uzun zamandır el değmemiş görünüyor. Bu konuda iyi bir hissim var!\n\nAma yeri yüzüstü aradıktan sonra... hiçbir şey bulamıyorum.\n\nNe hayal kırıklığı."

 agot_filler_riverlands.0009.a:0 "Yeterince zaman harcadım. Ağlamadan önce geri dönüyorum."

 agot_filler_riverlands.0009.b:0 "Burada hiçbir şey yoksa, o zaman kesinlikle zemin kattadır!"

 agot_filler_riverlands.0009_tt.a:0 "Geri dönüyorsun."

 agot_filler_riverlands.0009_tt.b:0 "Zemin katı arıyorsunuz."

 agot_filler_riverlands.0010.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0010.desc:0 "Merdivenlerden dikkatle yukarı çıkıyorum; tırmanma becerilerim konusunda kendimden eminim, ta ki aşağıda düşen bir çakıl sesi duyana dek. Bir çakıl ikiye, sonra üçe dönüşüyor ve sesler gittikçe yükseliyor, ve—\n\nOh hayır.\n\nDüşmekten kıl payı kurtuluyorum; ama aşağıdaki merdivenler çökmüş, yani geri tırmanmamın imkânı yok. Yine de buradaki duvarda dışarı açılan bir delik var. Yeterince uzağa atlarsam, muhtemelen yakındaki bir ağacın dallarından birini yakalayabilirim..."

 agot_filler_riverlands.0010.a:0 "O atlayışı muhtemelen yapabilirim. Bir dala tutunup ağaca tırmanacağım."

 agot_filler_riverlands.0010.b:0 "Kayarak inmek için merdivenlerden yeterince kalmış olduğunu sanıyorum."

 agot_filler_riverlands.0010.c:0 "Kanlı bir mızrakla mahvoldum, bu hiç iyi değil! Bana yardım et, [explorer_vassal.GetFirstNameNoTooltip]!"

 agot_filler_riverlands.0010_tt.a:0 "Yaralanma ya da ölüm riskine giriyorsunuz..."

 agot_filler_riverlands.0010_tt.b:0 "Merdivenler taştan yapılmış... ölüm riskine giriyorsunuz..."

 agot_filler_riverlands.0010_tt.c:0 "Yardım çağırıp duyulmayı umuyorsunuz."

 agot_filler_riverlands.0011.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0011.desc.nothing:0 "İnce bir danstır ama kuleden yara almadan çıkmayı başarıyorum; ancak ortada gösterecek bir şey de yok."

 agot_filler_riverlands.0011.desc.book:0 "İnce bir danstır ama kuleden yara almadan çıkmayı başarıyorum. Ancak ayrılırken oldukça değerli görünen kadim bir kitaba rastlıyorum!"

 agot_filler_riverlands.0011.desc.gold:0 "İnce bir danstır ama kuleden yara almadan çıkmayı başarıyorum. Ancak ayrılırken göz alıcı bazı mücevherlere rastlıyorum — tahminimce 40 madeni para değerinde."

 agot_filler_riverlands.0011.desc.stairs:0 "İnce bir danstır ama kuleden yara almadan çıkmayı başarıyorum; her ne kadar niyet ettiğimden daha az dikkatli olsa da. Bir moloz parçasından diğerine sıçrıyorum; bir aşamada bir anlığına duvara tutunup kendimi iterek, iki uzak taş parçası arasında sıçramak için bu hareketi kullanıyorum.\n\nBelki hiç hazine bulamadım; ama gençlerin dediği gibi 'son derece mükemmel' bir işti; görecek kimse olmasa bile."

 agot_filler_riverlands.0011.a:0 "Zamanımın ne israfı."

 agot_filler_riverlands.0011.b:0 "Geri dönelim."

 agot_filler_riverlands.0011.c:0 "Hiç değilse oldukça heyecanlıydı!"

 agot_filler_riverlands.0011_tt:0 "Arayışın sona erdi."

 agot_filler_riverlands.0012.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0012.desc:0 "Derin bir nefes alıp kendimi topluyorum; ardından duvardaki delikten koşarak atlıyorum, kollarım açık, bakışlarım ulaşmaya çalıştığım dala kilitli.\n\nDala tutunuşum şaşırtıcı derecede zahmetsiz; kavrayışım sağlam. Ama elbette öyle! Bunu yapabileceğimi her zaman biliyordum. Aşağıdaki zemine baktığımda [explorer_vassal.GetFirstName]yi görüyorum; [explorer_vassal.GetHerHis] gözleri iri iri, bana hayranlıkla bakıyor.\n\n"Kiss my sister and call me a Targaryen!" [explorer_vassal.GetFirstName] exclaims. "That was most impressive, my [ROOT.Char.GetLadyLord]!"\n\nEmboldened by [explorer_vassal.GetHerHis] appreciation of my courage, I return to camp, satisfied with the day's adventure."

 agot_filler_riverlands.0012.a:0 "Kendimden hiç şüphe etmedim."

 agot_filler_riverlands.0012_tt.a:0 "Arayışın sona erdi."

 agot_filler_riverlands.0013.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0013.desc.a:0 "Derin bir nefes alıp kendimi topluyorum; ardından duvardaki delikten koşarak atlıyorum, kollarım açık, bakışlarım ulaşmaya çalıştığım dala kilitli.\n\nDal ile zemin arasında ne olduğundan emin değilim; ama bildiğim şey, ayıldığımda bacağımın benimle birlikte yerde olmadığı, özellikle kalın iki dal arasındaki bir çatala dolanmış olduğu. Her yer kan içinde ve çığlık atmaya başlıyorum — insan bacağını kaybettiğinde böyle yapar.\n\n'[ROOT.Char.GetLadyLord]im!' [explorer_vassal.GetFirstName] haykırıyor, yanıma koşarak. "Come! We must get you some help, immediately!"\n\nWith the help of [explorer_vassal.GetFirstNameNoTooltip], I hobble back to the camp, ashamed, embarrassed, and without a leg."

 agot_filler_riverlands.0013.desc.b:0 "Derin bir nefes alıp kendimi topluyorum; ardından duvardaki delikten koşarak atlıyorum, kollarım açık, bakışlarım ulaşmaya çalıştığım dala kilitli.\n\n"My [ROOT.Char.GetLadyLord]! Wake up, please!" When I come to, [explorer_vassal.GetFirstName] is cradling me on [explorer_vassal.GetHerHis] lap. It would seem I missed the mark, falling straight down. "Are you in much pain?"\n\nI groan affirmatively. "Myyyuueeesshhh," I can hardly form words. Thankfully, I'm not bleeding, but I have definitely broken at least a few bones. The trip back to camp is a most unpleasant one."

 agot_filler_riverlands.0013.a:0 "Buraya hiç gelmemeliydik! Bu senin suçun, [explorer_vassal.GetFirstNameNoTooltip]!"

 agot_filler_riverlands.0013.b:0 "Yardım ettiğin için sağ ol, [explorer_vassal.GetFirstNameNoTooltip]."

 agot_filler_riverlands.0013_tt.a:0 "Arayışınız korkunç şekilde sona eriyor."

 agot_filler_riverlands.0013_tt.b:0 "Arayışınız feci şekilde sona eriyor."

 agot_filler_riverlands.0014.t:0 "Harabe Karakol: Kuleye Çıkış"

 agot_filler_riverlands.0014.desc:0 "Kendimi bu duruma sokacak kadar aptal olabilirim; ama buradan çıkmaya çalışacak kadar aptal değilim. "[explorer_vassal.GetFirstNameNoTooltip]?" I call out. "[explorer_vassal.GetFirstNameNoTooltip], can you help me?"\n\nWhen [explorer_vassal.GetFirstName] arrives, [explorer_vassal.GetSheHe] seems more amused than anything. "Of course, my [ROOT.Char.GetLadyLord]," [explorer_vassal.GetSheHe] calls, "prithee bid me leave, so that I might make haste and returneth with only the finest ladder suited for such a wizened [ROOT.Char.GetLadyLord], forsooth."\n\nI roll my eyes as [explorer_vassal.GetSheHe] trudge off to fetch a ladder for me. "Oh come off it, [explorer_vassal.GetFirstNameNoTooltip]." I wait patiently, and not only does [explorer_vassal.GetFirstNameNoTooltip] return with a ladder, but also half my retinue to help.\n\n"Did you really climb all the way up there by yourself, my [ROOT.Char.GetLadyLord]?" asks one of the men as they help me down. "You couldn't have paid me in gold to explore that creepy old tower. I'll remember not to mess with you — you're incredibly brave!""

 agot_filler_riverlands.0014.a:0 "Ah, haha, neyse, herkesin başına gelebilirdi, sanırım!"

 agot_filler_riverlands.0014_tt.a:0 "Arayışın sona erdi."

 agot_filler_riverlands.0015.t:0 "Harabe Karakol: Ormana Doğru"

 agot_filler_riverlands.0015.desc:0 "Yapamam. İçimde bir his var; kahvaltımın benimle anlaşmazlık yaşaması da olabilir... yine de riski almaya razı değilim.\n\nGeri çekiliyorum; ancak koşuya çıkabildiğimde sırtımı dönüyorum ve [explorer_vassal.GetFirstName]ye rastlayana dek koşmayı bırakmıyorum.\n\n"Oh, my [ROOT.Char.GetLadyLord]! Look what I found!" [explorer_vassal.GetSheHe] holds out an ornate wooden box, removing the lid and revealing a hefty sum of gold. "If you're done exploring, would you like to head back?""

 agot_filler_riverlands.0015.a:0 "Her zaman o kadar şanslısın ki, [explorer_vassal.GetFirstNameNoTooltip]. Hadi gidelim."

 agot_filler_riverlands.0015_tt.a:0 "Arayışın sona erdi."

 agot_filler_riverlands.0016.t:0 "Harabe Karakol: Ormana Doğru"

 agot_filler_riverlands.0016.desc:0 "Tuhaf; ormana ne kadar derinlemesine girersem, o kadar az tedirgin oluyorum. Görünüşe göre önceki korkularım yersizmiş; çünkü burası sıradan, kayda değer olmayan bir orman. Hayalet yok, iblis yok, canavar yok — ve en kötüsü — hazine yok."

 agot_filler_riverlands.0016.a:0 "'Doğanın ihtişamı' da burada kalsın."

 agot_filler_riverlands.0016_tt.a:0 "Geri dönüyorsun."

 agot_filler_riverlands.0018.t:0 "Harabe Karakol: Ormana Doğru"

 agot_filler_riverlands.0018.desc:0 "Önceki çekincelerime rağmen azimle ilerliyor, ormana gittikçe daha derinlemesine giriyorum ve sonunda bir nehre rastlıyorum.\n\nKaybolmamak için onu bir işaret noktası olarak kullanarak nehri takip ediyorum. Sonunda... bir şelaleye mi çarpıyorum?\n\nHah. #italic Bu yeni.#! Eyaletin bu kısmında şelale olmadığına #italic eminim#!..."

 agot_filler_riverlands.0018.a:0 "Hayır, burada bir iş var. Ne kadar merak uyandırıcı..."

 agot_filler_riverlands.0018_tt.a:0 "Şelaleyi keşfediyorsunuz."

 agot_filler_riverlands.0020.t:0 "Harabe Karakol: Ormana Doğru"

 agot_filler_riverlands.0020.desc:0 "[explorer_vassal.GetFirstNameNoTooltip]yi bulmak ve [explorer_vassal.GetHerHim]e bu tuhaf gizemli nehri anlatmak için koşuyorum. [explorer_vassal.GetHerHim]i bulmam uzun sürmüyor. "[explorer_vassal.GetFirstNameNoTooltip]!" I shout. "I found the strangest thing in the forest!"\n\nI tell [explorer_vassal.GetHerHim] all about the river and the waterfall, and after taking in my description, [explorer_vassal.GetSheHe] nods in agreement. "You're quite right — there's no such thing mapped in this area. Seems you've made a new discovery, my [ROOT.Char.GetLadyLord]!""

 agot_filler_riverlands.0020.a:0 "[ROOT.Char.GetCapitalLocation.GetName]e dönüşümde bazı haritacılar çağırtacağım!"

 agot_filler_riverlands.0020_tt.a:0 "Arayışın sona erdi."

 agot_filler_riverlands.0021.t:0 "Harabe Karakol: Kayıp Kışlalar"

 agot_filler_riverlands.0021.gold:0 "Hilal biçimli bir bıçak olan khopesh'i kaldırdığımda gözlerim büyüyor; Dar Deniz'in ötesinde popüler olduğunu okumuştum. Bunlardan birini kitapların dışında hiç görmemiştim! Burada ne işi var ki? Elbette bir koleksiyon parçası, üstelik mükemmel durumda.\n\nNeyse ki khopesh oldukça hafif ve tek elle taşıması kolay. Belki daha fazlasını bulabilirim..."

 agot_filler_riverlands.0021.desc.no:0 "Hâlâ metali için bile satılamayacak kadar paslanmış eski silahlardan başka bir şey yok. Ama şimdi #italic durmayacak#! kadar kendimi kaptırdım!"

 agot_filler_riverlands.0021.a:0 "Bundan öyle eğleniyorum ki! Devam edeceğim."

 agot_filler_riverlands.0021.b:0 "Tadına baktım ve daha fazlasını istiyorum!"

 agot_filler_riverlands.0021_tt.a:0 "Arayışınıza devam ediyorsunuz."

 agot_filler_riverlands.0022.t:0 "Harabe Karakol: Kayıp Kışlalar"

 agot_filler_riverlands.0022.desc:0 "Ne kadar köşe bucak ararsam arayayım, bir kez daha elim boş dönüyorum. Bir süre sonra [explorer_vassal.GetFirstNameNoTooltip] yanıma yaklaşıyor. "Found anything good?" [explorer_vassal.GetSheHe] asks. "We've uhm... been here for quite a while now..."\n\n[explorer_vassal.GetSheHe|U] exhales when I shake my head. "Me neither. I think this might have been for naught.""

 agot_filler_riverlands.0022.a:0 "Keşke bugün şans bizimle olsaydı..."

 agot_filler_riverlands.0022_tt.a:0 "Hazinesiz, kampa dönüyorsunuz."

 agot_filler_riverlands.0023.t:0 "Harabe Karakol: Kayıp Kışlalar"

 agot_filler_riverlands.0023.desc:0 "Altın ya da süslü bir kılıç olmayabilir; ama moloz ve çürümüş kereste karışımının ardında gizlenmiş eski bir geçit keşfettiğimde yüreğim yine de hopluyor.\n\nKendi güvenliğimi tamamen hiçe sayarak geçide giriyorum ve sonunda karakolun kullanıldığı dönemden kalma, bir tür derme çatma zindan gibi görünen yere varıyorum. Eski ahşap hücreler el değmemiş görünüyor ve aşağısı o kadar buz gibi ki kendi nefesimi görebiliyorum."

 agot_filler_riverlands.0023.a:0 "Hücreleri aramazsam yazık olur."

 agot_filler_riverlands.0023.b:0 "Cadının memesinden soğuk! Ben gidiyorum!"

 agot_filler_riverlands.0023_tt.a:0 "Hücrelerin içini değerli bir şey için arıyorsunuz."

 agot_filler_riverlands.0023_tt.b:0 "Olabildiğince hızlı geri dönüyorsunuz."

 agot_filler_riverlands.0024.t:0 "Harabe Karakol: Kayıp Kışlalar"

 agot_filler_riverlands.0024.desc:0 "Ellerim o kadar soğuk ki kemiklerim sızlamaya başlıyor; ama neyse ki uyuşmuyorlar; çünkü birkaç dakikalık aramanın ardından bazı mücevherlere dokunuyorlar! Üstelik #italic bir sürü#! mücevher!\n\n...Aslında şaşırtıcı derecede #italic yeni#! mücevherler. Huh. Görünüşe göre birileri servetini saklamak için bu hücreleri yeniden kullanmaya karar vermiş. Bu kadar çaba harcayıp sakladıkları şeyin kaybolduğunu görünce çok yıkılacaklarını hayal ediyorum...\n\nNeyse! Bu, iki kez yapmayacakları bir hata! Mücevherlerin en değerlilerini kendime alıyorum. Bu istif kime aitse, bir dahaki sefere kasa kiralasın.\n\nKışlaya dönerken [explorer_vassal.GetFirstNameNoTooltip]ye rastlıyorum. Görünüşe göre [explorer_vassal.GetSheHe] de hiçbir şey bulamamış."

 agot_filler_riverlands.0024.b:0 "Ne şanslı bir hazine avı, değil mi [explorer_vassal.GetFirstNameNoTooltip]?"

 agot_filler_riverlands.0024_tt.a:0 "Cebi daha dolu eve dönüyorsunuz."

 agot_filler_riverlands.0025.t:0 "Harabe Karakol: Kayıp Kışlalar"

 agot_filler_riverlands.0025.desc:0 "Çabalarıma rağmen arayışım hiçbir sonuç vermiyor. Öfkeli bir şekilde kışladan ayrılıp [explorer_vassal.GetFirstNameNoTooltip]yi arıyorum.\n\nSonunda [explorer_vassal.GetHerHim]i kulede, yerde, acıyla inlerken buluyorum. "My [ROOT.Char.GetLadyLord]! I tried to climb the tower, but the stairs gave way, and when I fell I heard my knee cap crack like #italic thunder#! and now I cannot stand!"\n\nThey've [explorer_vassal.GetSheHe] a terrible fall, indeed. Not only have [explorer_vassal.GetSheHe] injured [explorer_vassal.GetHerHis] knee, but [explorer_vassal.GetSheHe]'s bleeding, blood pooling around the gold [explorer_vassal.GetSheHe] seems to have spilled from [explorer_vassal.GetHerHis] hold when [explorer_vassal.GetSheHe] fell."

 agot_filler_riverlands.0025.a:0 "İşte! Koluma tutun, seni şimdi kampa geri götürüyorum!"

 agot_filler_riverlands.0025.b:0 "Altını toplayayım, hemen yanına geliyorum!"

 agot_filler_riverlands.0025_tt.a:0 "Siz ve [explorer_vassal.GetFirstNameNoTooltip] güvenle kampa dönüyorsunuz."

 agot_filler_riverlands.0025_tt.b:0 "[explorer_vassal.GetFirstNameNoTooltip]nün hazinesini çalıyorsunuz ve [explorer_vassal.GetHerHim]e ancak onu gizledikten sonra yardım ediyorsunuz..."

 agot_filler_riverlands.0030.t:0 "Duraksayan Şenlikler"

 agot_filler_riverlands.0030.desc:0 "[chancellor.GetCouncilTitle]im [chancellor.GetTitledFirstName], çatık bir kaşla geliyor; nehir kıyılarındaki çalışkan balıkçıların hayatını aksatmaya devam eden ısrarcı Krannogmen şenlikleri hakkında rahatsız edici haberler getiriyor. Geleneklerle yoğrulmuş bu kadim kutlamalar yılda iki kez yapılıyor ve iki ila üç gün, hatta daha fazla sürüyor. Krannogmenlerin kendilerine özgü yaşam tarzlarına saygılarını sundukları bir zaman dilimi.\n\nAncak bu şenliklerin istenmeyen sonuçları ağır olmaya başladı. Bu toplantıların, bölgedeki balıkları tüketmek gibi sıkıntılı bir alışkanlığı var ve etkileri bir haftaya dek sürüyor.\n\nBalıkçılardan biri, tuz lekeli giysileri ve yıpranmış yüzüyle mütevazı bir adam, önünüzde diz çökerek içtenlikle yalvarıyor. "My [ROOT.Char.GetLadyLord|l], you have to do something, #italic I beg you!#!". His voice trembles with desperation. "It disrupts our fishing schedules, and our families depend on the river's bounty. We are struggling to make ends meet with the fish stocks dwindling.""

 agot_filler_riverlands.0030a:0 "Bu şenlikler durdurulmalı."

 agot_filler_riverlands.0030b:0 "Ne yapmalı... Kararını [liege.GetTitledFirstName] versin."

 agot_filler_riverlands.0030c:0 "Yedi Krallık pek çok halkın diyarıdır. Hoşgörülü olmalıyız."

 agot_filler_riverlands.0030d:0 "Daha fazla ziyafeti teşvik edin! Nehir Topraklıları ve Krannogmenler kaynaşsın!"

 agot_filler_riverlands.0031.t:0 "Demir Krannogman"

 agot_filler_riverlands.0031.desc:0 "İki muhafızımla birlikte yerel bir meyhaneye giriyorum; tam bir yumruk kavgasına tanık olmak üzereyim. Görünüşe göre iki Nehir Topraklısı tarafından hakarete uğrayan bir Krannogman, gücenmiş ve dikkat çekici bir ustalıkla karşılık vermiş. Büyük bir hüner gösterisiyle [crannog_fighter.GetSheHe|L], [crannog_fighter.GetHerHis|L] iki rakibini de hızla alt ediyor; [crannog_fighter.GetHerHis|L] dövüş becerilerinden şüphe etmeye yer bırakmıyor.\n\nKrannogman, kalabalığın tezahürat ve yuhalarının ortasında zaferle ayakta dururken [crannog_fighter.GetSheHe|L], kendisine bakan beni ve iki muhafızı fark ediyor. [crannog_fighter.GetSheHe|L], yaramaz bir sırıtışla bize dönüp şöyle diyor: "What are you looking at, huh?" [crannog_fighter.GetSheHe|L] taunts, waving [crannog_fighter.GetHerHis|L] clenched fists in the air. "Want some of #italic this#! too?""

 agot_filler_riverlands.0031a:0 "Becerilerinizi fark etmeden duramadım... iş arıyor musunuz?"

 agot_filler_riverlands.0031b:0 "Dayak mı arıyorsun, ha? Pekâlâ..."

 agot_filler_riverlands.0031c:0 "Kiminle konuştuğunu biliyor musun?"

 agot_filler_riverlands.0031d:0 "Ne cüretin... Muhafızlar! [crannog_fighter.GetHerHim]i #italic öldüresiye#! dövün!"

 agot_filler_riverlands.0031.b.a:0 "Yumruk kavgasını kazanıyorsunuz"

 agot_filler_riverlands.0031.b.b:0 "Yumruk kavgasını kaybediyorsunuz"

 agot_filler_riverlands.0032.t:0 "İçten Minnettarlık"

 agot_filler_riverlands.0032.desc:0 "Birkaç aylık hizmetinin ardından [crannog_fighter.GetFirstName], tüm sarayın önünde bana resmen teşekkür edip bir konuşma yapmaya karar veriyor. Sırası geldiğinde [crannog_fighter.GetSheHe|L] ileri atılıyor, gözü bende. Görülmeye değer bir manzara; [crannog_fighter.GetSheHe|L]nün eskisinden tamamen farklı bir adam.\n\n"Thank you, my [ROOT.Char.GetLadyLord|U]..." [crannog_fighter.GetSheHe|L] started with a shaky voice, "I stand here today, humbled and filled with gratitude. I was merely a brawler three month ago, finding my place in taverns, far from the world of highborn lords and ladies and honor that you held so dearly to your heart."\n\n"But since that time, you, my [ROOT.Char.GetLadyLord|U], have changed my life in ways I could never have imagined. You saw potential in me, and you brought me into your court, gave me a chance...like no one before." [crannog_fighter.GetSheHe|L] speaks, as [crannog_fighter.GetHerHis|L] eyes fill with water. "My [ROOT.Char.GetLadyLord|U], you've not only given me a purpose, but you've also shown me the meaning of honor and loyalty,"\n\n"I..." The crannogman knelt awkwardly, unleashing [crannog_fighter.GetHerHis|L] sword, and laid it at [crannog_fighter.GetHerHis|L] feet, "I, [crannog_fighter.GetFirstNameNoTooltip], will shield your back and keep your counsel and give my life for yours, if need be. I swear it by the old gods and the new.""

 agot_filler_riverlands.0032a:0 "Ocağımın başında her zaman bir yerin ve soframda et ve bal şarabının olacağına yemin ederim..."

 agot_filler_riverlands.0032b:0 "Doğru olanı yaptım; ama... yeminini kabul edemem..."

 agot_filler_riverlands.0032c:0 "Keşke #italic kaba kuvvetten#! başka sunacağın bir şey olsaydı, [crannog_fighter.GetFirstNameNoTooltip]."

 agot_filler_riverlands.0033.t:0 "Kavga Kazanıldı"

 agot_filler_riverlands.0033.desc:0 "Yumruk, darbe, vuruş, eğilme ve yeniden kaçamak. Kendime özgü görünmeyen bir zarafetle masanın üzerinden atlıyor, aramızdaki mesafeyi hızla kapatıyorum. Sergilediğim zarafet ve güç yalnızca seyircileri değil, herkesi hayrete düşürdü.\n\nAma sonra, Krannogman'ın güçlü bir sağ kroşesi beni tamamen şaşırtıyor. Darbenin gücü sarsıyor beni; ama hızla soğukkanlılığımı topluyorum; kalabalıktaki köylülerden birinin bağırdığı gibi, hiç de ağır davranan biri olmadığımı kanıtlıyorum.\n\nKrannogman'ı siperin arkasına eğilmek zorunda bırakan bir sol kroşeyle karşılık veriyorum. [crannog_fighter.GetSheHe|U] eğildi; ama bu kez işler acılı bir hal alıyor — yumruğum [crannog_fighter.GetHerHim|L] yerine, yere yığılan kendi muhafızımın miğferine isabet ediyor. Kalabalık bir an sessizleşiyor; acıyla inlerken; ancak bu duraksama kısa sürüyor ve sessizliği, eskisinden de yüksek gürleyen bir tezahürat yarıyor.\n\nKavga, yumruk üstüne yumruk, darbe üstüne darbeyle birkaç dakika daha alevleniyor. Krannogman kuşkusuz güçlü; ama [crannog_fighter.GetSheHe|L] yalnızca kaba kuvvete güveniyor. Bense bundan daha fazlasına sahibim.\n\nBelirleyici son darbe benden geliyor ve Krannogman [crannog_fighter.GetHerHis] sulu gözleriyle merhamet dileyerek yere sertçe düşüyor. [crannog_fighter.GetHerHim]de kalan azıcık güçle [crannog_fighter.GetSheHe] sürünerek uzaklaşmaya çalışıyor."

 agot_filler_riverlands.0033a:0 "Sana bir ders verdim. Şimdi defol!"

 agot_filler_riverlands.0033b:0 "Nereye gidiyorsun?! Henüz bitirmedim!"

 agot_filler_riverlands.0033c:0 "Bu yumruklarla hiç fena değilsin... Benimle geliyorsun."

 agot_filler_riverlands.0034.t:0 "Kavga Kaybedildi"

 agot_filler_riverlands.0034.desc:0 "Yumruk, darbe, vuruş, eğilme ve yeniden kaçamak. Kendime özgü görünmeyen bir zarafetle masanın üzerinden atlamayı deniyorum; ama hareketlerim sakar ve aramızdaki mesafeyi kapatmakta zorlanıyorum. Sergilediğim dengesizlik ve zayıflık #italic yalnızca#! seyircileri değil, herkesi şoke ediyor.\n\nAma sonra, Krannogman'ın güçlü bir sağ kroşesi beni tamamen afallatıyor. Darbenin gücü sarsıyor beni ve soğukkanlılığımı toplayamıyorum; kalabalıktaki köylülerden birinin bağırdığı gibi, ağır davrandığımı kanıtlıyorum.\n\nBir sol kroşeyle karşılık vermeye çalışıyorum; ama Krannogman kolayca siperin arkasına eğiliyor. [crannog_fighter.GetSheHe|U] yumruğumdan zahmetsizce kaçınıyor ve bu kez işler acılı bir hal alıyor — yumruğum [crannog_fighter.GetHerHim|L] yerine, yere yığılan kendi muhafızımın miğferine isabet ediyor. Kalabalık bir an sessizleşiyor; acıyla inlerken; ancak bu duraksama kısa sürüyor ve sessizliği, eskisinden de yüksek gürleyen bir tezahürat yarıyor.\n\nKavga, yumruk üstüne yumruk, darbe üstüne darbeyle birkaç dakika daha alevleniyor. Krannogman kuşkusuz güçlü. [crannog_fighter.GetSheHe|U] yalnızca kaba kuvvete güveniyor; şahsen karşı koyamayacağım bir güce.\n\nBelirleyici son darbe Krannogman'dan geliyor ve ben yere sertçe düşüyorum. Muhafızların [crannog_fighter.GetHerHim|L] üzerine gelmek üzere olduğunu gören Krannogman, meyhaneden kaçmaya hazırlanıyor."

 agot_filler_riverlands.0034.a:0 "O adam Demirci kadar güçlü!"

 agot_filler_riverlands.0034.b:0 "Piç... [crannog_fighter.GetSheHe] kaçıyor! Muhafızlar! [crannog_fighter.GetHerHim]i yakalayın!"

 agot_filler_riverlands.0035.t:0 "Krannogmen Sorunu"

 agot_filler_riverlands.0035.desc:0 "Krannogmenler nesillerdir Nehir Toprakları ile Boyun arasındaki sınırda küçük köyler kurmuştur. Bu köyler derin bir duygusal değer taşır; çünkü mülkiyetleri eski zamanlara dayanır, en azından Krannogmenler buna inanır.\n\nSon aylarda [agot_river_0035_county.GetName] köylüleri ile Krannogmenler arasındaki çatışma kaynama noktasına ulaştı. [agot_river_0035_county.GetName] köylüleri, bu yerleşimlerin bitişiğindeki gür ormanlarda avlanmayı can atıyor. Bu ormanların, bol avıyla hayatlarını büyük ölçüde iyileştirebileceğini savunuyorlar. Ancak Krannogmenler, bu kutsal ormanlar üzerindeki hak iddialarını inatla sürdürüyor. Öyle ki bir köylü bir Krannogmen'e 'kurbağa yiyen' dediğinde kan bile döküldü.\n\nOrtada net bir çözüm görünmezken, çaresiz köylüler yardım için [marshal.GetCouncilTitle|l]me başvurdu. Ne yapacağını bilemeyen [marshal.GetSheHe], elinde harita ve endişeli bir bakışla bana geliyor..."

 agot_filler_riverlands.0035.a:0 "Topraklarını savunmaya hazır oldukları sürece ellerinde tutabilirler."

 agot_filler_riverlands.0035.b:0 "Bunlar her zaman Krannogman köyleri olmuştur... Öyle de kalacaklar."

 agot_filler_riverlands.0035.c:0 "Bu Krannogman 'bölgeleri' sıkı bir şekilde düzenlenmeli"

 agot_filler_riverlands.0035.d:0 "Onları [agot_river_0035_county.GetName]den kovma zamanı!"

 agot_filler_riverlands.0036.t:0 "Boyun'un İntikamcısı"

 agot_filler_riverlands.0036.desc:0 "Hareketli köy pazarında sergilenen malları ve eşyaları keyifle gözden geçirirken, muhafızlarımın dikkat çekici derecede yetenekli bir tiyatro kumpanyası tarafından eğlendirildiğini ve dikkatlerinin, beni koruma görevlerinden anlık olarak kendilerini eğlendirmeye kaydığını fark ediyorum.\n\nMeraklanıp muhafızlarımın yanına, gösteriyi izlemek için yaklaşıyorum. Hikâye, güç ve zulümle halkını hak ettikleri topraklarından süren zalim bir [ROOT.Char.GetLadyLord|l] hakkında acı bir masal. Oyuncuların kostümleri, ifadeleri ve anlatının yankısı, Krannogmenlere çarpıcı bir benzerlik taşıyor...\n\nAniden, benden birkaç adım ötede duran iki muhafızım yere düşüyor; cansız bedenleri, boyunlarına saplanmış küçük oklarla bozulmuş. Gözlerim inanamayarak tiyatro kumpanyasına kayıyor ve büzülmüş dudakları arasında üflemeli boru tutan iki arka oyuncuyu gördüğümde şokum büyüyor.\n\nOyuncu, [crannog_avenger.GetHerHis] gözlerinde yanan köklü bir kinle bana bakıyor. [crannog_avenger.GetSheHe|L] suçlayıcı parmağını bana doğrultup bağırırken [crannog_avenger.GetHerHis|U] gür sesi pazar yerinin gürültüsünü aşıyor: "You, bloody bastard! You took away my home! You'll pay for this with your own #italic LIFE!#!""

 agot_filler_riverlands.0036.a:0 "Muhafızlar!"

 agot_filler_riverlands.0036.b:0 "Seninle kendim ilgileneceğim!"

 agot_filler_riverlands.0036.b.a:0 "Suikastçıyı yendiniz"

 agot_filler_riverlands.0036.b.b:0 "Suikastçı sizi öldürüyor"

 agot_filler_riverlands.0036_tt.b:0 "[crannog_avenger.GetFirstName]yi etkisiz hâle getiriyorsunuz"

 agot_filler_riverlands.0037.t:0 "Boyun'un İntikamcısı"

 agot_filler_riverlands.0037.desc:0 ""GUARDS!" I shout, but seconds later, the assassin charges at me, a spear gripped tightly in [crannog_avenger.GetHerHis] hands, ready to kill. I immediately bolt in the opposite direction, my heart pounding in my chest.\n\nAfter a brief but intense sprint, I look back to see some of my guards swiftly run up to the assassin and drive [crannog_avenger.GetHerHim] into a corner with a series of quick but powerful slashes. [crannog_avenger.GetSheHe|U] attempts to mount a counterattack, but [crannog_avenger.GetHerHis] back is firmly pressed against the cold stone wall of [ROOT.Char.GetFaith.HouseOfWorship], [crannog_avenger.GetHerHis] manoeuvering space severely restricted. The tables had turned, and now the hunter had become the hunted.\n\nOne of the guards immediately takes advantage of this opportunity and delivers a deep cut to [crannog_avenger.GetHerHis] face, leaving behind a gruesome wound across [crannog_avenger.GetHerHis] cheek to [crannog_avenger.GetHerHis] forehead. A primal cry escapes [crannog_avenger.GetHerHis] mouth as [crannog_avenger.GetSheHe] releases [crannog_avenger.GetHerHis] spear, crumbling to [crannog_avenger.GetHerHis] knees in agony.\n\nThe Crannogman's spirit is broken, and the threat is subdued."

 agot_filler_riverlands.0037.a:0 "[crannog_avenger.GetHerHim]i öldürmeyeceğim. [crannog_avenger.GetHerHim]e memleketine bir yolculuk hediye edeceğim!"

 agot_filler_riverlands.0037.a_tt:0 "[crannog_avenger.GetFirstName], Boyun'da ortadan kayboluyor."

 agot_filler_riverlands.0037.b:0 "[crannog_avenger.GetHerHim]i gözümün önünden çek."

 agot_filler_riverlands.0037.c:0 "[crannog_avenger.GetSheHe], [ROOT.Char.GetCapitalLocation.GetName]'in zindanlarını ziyaret edecek!"

 agot_filler_riverlands.0037.d:0 "Aklımda bir şey var..."

 agot_filler_riverlands.0037.d_tt:0 "Yüzme bıçaklarınızı biliyorsunuz..."

 agot_filler_riverlands.0038.t:0 "Boyun'un İntikamcısı"

 agot_filler_riverlands.0038.desc:0 "Suikastçı bana doğru koşuyor; [crannog_avenger.GetHerHis] elinde sıkıca kavranmış bir mızrak, vurmaya hazır. Hemen kılıcımı çekiyorum ve düello başlıyor.\n\nÇarpışan bıçakların ve kurnaz hamlelerin kısa ama yoğun bir dansının ardından, güçlü saldırı dizisiyle rakibimi köşeye sıkıştırıyorum. [crannog_avenger.GetSheHe] bir karşı saldırı başlatmaya çalışıyor; ama [crannog_avenger.GetHerHis] sırtı [ROOT.Char.GetFaith.HouseOfWorship]'in soğuk taş duvarına dayalı, [crannog_avenger.GetHerHis] manevra alanı ciddi biçimde kısıtlı. Avcı, ava dönüşüyor.\n\nBu fırsattan hemen yararlanıyor ve [crannog_avenger.GetHerHis] yüzüne derin bir kesik atıyorum; [crannog_avenger.GetHerHis] gözü boyunca korkunç bir yara bırakıyorum. [crannog_avenger.GetSheHe], [crannog_avenger.GetHerHis] silahını bırakıp yenilgiyle [crannog_avenger.GetHerHis] dizlerinin üzerine çökerken dudaklarından boğuk bir çığlık sızıyor.\n\n[crannog_avenger.GetHerHis] ruhu kırıldı ve zafer benim."

 agot_filler_riverlands.0038.a:0 "Adaleti burada ve şimdi icra edeceğim."

 agot_filler_riverlands.0038.b:0 "Kafanı uçuruyorum!"

 agot_filler_riverlands.0038.c:0 "Zindanlara!"

 agot_filler_riverlands.0040.t:0 "[crannog_storyteller.GetFirstNameNoTooltip]'nin Hikâyesi"

 agot_filler_riverlands.0040.desc.a:0 ""Listen here," [crannog_storyteller.GetFirstName] says, drawing me in closely with [crannog_storyteller.GetHerHis] voice. "Very few know the story of how I got to this court. Though I've seen plenty of sideways looks, due to my small stature. I think it's time to set the record straight..."\n\n"I'd lived in the Neck my whole life, raised among the black bogs and half-drowned trees. The Neck wasn't always like that... The children of the forest used their dark magics to smash the lands into watery submission. But that's a tale for another day..."\n\n"Aye, my family lived in the Neck, surviving off the bounties of that strange brackish water, fending off lizard-lions for our sustenance. But one day, the waters themselves swelled up, carrying off my mother and father with them. I left the Neck that day, traveling here to join your court." I can see [crannog_storyteller.GetHerHim] holding back tears. But I'm not sure what to say..."

 agot_filler_riverlands.0040.desc.b:0 ""Listen here," [crannog_storyteller.GetFirstName] says, drawing me in closely with [crannog_storyteller.GetHerHis] voice. "Very few know the story of how I got to this court. Though I've seen plenty of sideways looks, due to my small stature. I think it's time to set the record straight..."\n\n"I'd lived in the Neck my whole life, raised among the black bogs and half-drowned trees. The Neck wasn't always like that... The children of the forest used their dark magics to smash the lands into watery submission. But that's a tale for another day..."\n\n"Aye, my family lived in the Neck, surviving off the bounties of that strange brackish water, fending off lizard-lions for our sustenance. But once the wars started to break out across the lands, I had to seek out a new way of life just to make ends meet. That's what brought me to your court." I can see [crannog_storyteller.GetSheHe] has a glimmer of hope in [crannog_storyteller.GetHerHis] eyes."

 agot_filler_riverlands.0040.a:0 "Ne ilginç bir hikâye!"

 agot_filler_riverlands.0040.b:0 "Hmm, çok ilginç... bitirdin mi şimdi?"

 agot_filler_riverlands.0041.t:0 "Kraken Burnu'nun Masalları"

 agot_filler_riverlands.0041.desc:0 "Benim gibi bir [ROOT.Char.GetLadyLord|l], saray mensuplarını ekmek bölüşmek için ağırlamak konusunda bol fırsata sahiptir. Bu gece, beni yörenin pek çok masalını dinlemekle meşgul eden [crannog_kraken.GetFirstName]nün yanında oturuyorum.\n\n"And I hail from Cape Kraken, north of these parts — the ancient lands, where the children of the forest once lived." A hush falls across the table, as guests who were talking amongst themselves turn their attention to [crannog_kraken.GetFirstNameNoTooltip].\n\n"Aye, the forests and marshes of Cape Kraken are older than man setting foot in these lands. Some of the stones have stood there since the dawn of time. And there's a power in it, too, that only the children of the forest understood..."\n\n[crannog_kraken.GetSheHe] trails off, and I can't help but yearn to know more."

 agot_filler_riverlands.0041.a:0 "Ne masallar! Bize bu kadar yakın böylesine gizemli bir bölgenin olduğunu düşünmek..."

 agot_filler_riverlands.0042.t:0 "Kadim Bir Akteber"

 agot_filler_riverlands.0042.desc:0 "Vassallarımdan birinin toprağına giden yolda, orman döküntülerinin arasında bir renk parıltısı gözüme çarpıyor. Attan inip soluk kahverengi çöpleri kenara itiyorum; altından, herhangi bir yakuttan daha derin kızıllıkta beş yapraklı bir yaprak çıkıyor. Adamlarım ve ben heyecanla bakışıyoruz. Yaprakları komşuları yeşil ve kahverengiyken kan kırmızısı kalan tek bir ağaç türü biliyoruz.\n\nSık ormanı arayarak imkânsızı keşfediyoruz: bir akteber. Vahşi Kuzey'in ve bakımlı tanrıkorularının dışında çoktan tükendiği düşünülen bu ağaçlar, Eski Tanrılar'a bağlı olmayanlar için bile değerlidir.\n\nAma bu, ağaçların arasında bir ağaç — devasa, kadim, vakur. Hiçbirimiz onun benzerini görmemişizdir. Binlerce yıl önce Andallar'ın saldırısından nasıl sağ çıktığını hayal edemiyorum; ama onun huzurunda, insanların neden akteberlerin köklerinde tapınmaya geldiğini çok iyi anlıyorum."

 agot_filler_riverlands.0042.a:0 "Ne heybet. Ne güç."

 agot_filler_riverlands.0043.t:0 "Eski Tanrıların Tesellisi"

 agot_filler_riverlands.0043.desc:0 "Son zamanlarda kara bulutlar sürekli Karaorman Vadisi'nin üzerinde duruyor gibi; ya da belki bu yalnızca kendi tedirginliğimin gölgesidir. Uyku kolay gelmiyor ve danışmanlarımla saatlerce uğraştıktan sonra bile devlet işleri düzene yaklaşmış görünmüyor. Böyle zamanlarda insan dostlarına yaslanmayı umar; ama dostlarımın pek çoğu artık bana soğuk davranıyor, ya da daha kötüsü.\n\nTek sığınağım tanrıkorusunda, hanemin kadim akteberinin ölü dallarının altında. Burada en azından çözüm bulamasam da huzur bulabiliyorum.\n\nAma neden çözüm de olmasın? Karaormanlar, komşularımız yabancı Yediler için onları terk ettikten çok sonra, binlerce yıldır Eski Tanrılar'a bağlı kaldı. Bu inanç yardımı hak etmiyor mu? Sadece sorduğumda akteberlerin Tanrıları öğüt vermeyecek mi?"

 agot_filler_riverlands.0043.a:0 "Lütfen yalvarışımı duyun, kadim olanlar. Ne yapmam gerektiğini söyleyin."

 agot_filler_riverlands.0044.t:0 "Eski Tanrıların Tesellisi"

 agot_filler_riverlands.0044.desc:0 "Sessiz yalvarışımı dile getirmiş olarak akteberin altında hareketsiz oturuyorum. Dinliyorum; ama yalnızca kuzgunların gaklayışını duyuyorum. Daha derinden dinliyorum ve rüzgârdaki ölü dalların zayıf gıcırtısını duyuyorum; başka bir şey değil. Daha da derinden, daha dikkatle dinliyorum ve kadim ağacın, ölümde bile bana bir yanıt getirmek için gerilen köklerini duyduğumu tasavvur ediyorum; ve sonra — hiçbir şey. Yanıt yok. Teselli yok."

 agot_filler_riverlands.0044.a:0 "Tanrılardan talepte bulunmak ölümlülerin haddi değildir."

 agot_filler_riverlands.0045.t:0 "Eski Tanrıların Tesellisi"

 agot_filler_riverlands.0045.desc:0 "Sessiz yalvarışımı dile getirmiş olarak akteberin altında hareketsiz oturuyorum. Dinliyorum; ama yalnızca kuzgunların gaklayışını duyuyorum. Daha derinden dinliyorum ve rüzgârdaki ölü dalların zayıf gıcırtısını duyuyorum; başka bir şey değil. Daha da derinden, daha dikkatle dinliyorum ve kadim ağacın, ölümde bile bana bir yanıt getirmek için gerilen köklerini duyduğumu tasavvur ediyorum; ve sonra —\n\nTanrılar konuşuyor\n\nSözcüklerle değil; çünkü bu fazla kaba olurdu. Akteber içime bakıyor ve o bakışla konuşuyor. Atalarımın bilgeliği o bakışla akıyor; hanem var olmadan önceki çağların bilgeliği de. Yüreğim hafifliyor, kafam berraklaşıyor ve bin yılların iyiliğiyle yükseliyorum."

 agot_filler_riverlands.0045.a:0 "Her şey sonunda iyiye varacak."

 agot_filler_riverlands.0046.t:0 "Akteber ve Ben"

 agot_filler_riverlands.0046.desc:0 "Bu sefer işi fazla abartmış olabilirim... Kafamdaki sesler o kadar yüksek sesle ilahi söylüyordu ki, biraz haşhaş sütü onları kaçırır diye düşünmüştüm; ama #italic şimdi...#!\n\nKendimi kadim tanrıkorusunda, kaleyi bile cüceleştiren o zehirli akteberle yüz yüze buluyorum. Özsu çizgili gözlerine baktığımda, beni izlediği hissine kapılmaktan kendimi alamıyorum.\n\nHızla sağıma üç adım atıyorum. Gözleri benimle birlikte hareket ediyor, beni takip ediyor, #italic bana sesleniyor.#! Omurgamdan bir ürperti iniyor. Bu bir #N onaylamama#! bakışı!\n\nAma ben... Ben bir [ROOT.Char.GetLadyLord|l]im! Hiçbir ağaç benim şanıma leke süremez!! #bold Defol, iğrenç şey!#!\n\n#italic Ama ondan tam olarak nasıl kurtulurum?#!"

 agot_filler_riverlands.0046.a:0 "Dudaklarından bir öpücük yeter!"

 agot_filler_riverlands.0046.b:0 "Bir tokat! #bold Çok sert#! bir tokat!"

 agot_filler_riverlands.0047.t:0 "Aydan Arınmış"

 agot_filler_riverlands.0047.desc:0 "Boynumun ensesinde hafif bir rüzgâr esiyor... Beni yavaşça devasa akteberin gövdesinin etrafında yönlendiriyor; en arka köklerinin arasında akan küçük bir sel görüyorum. Su parıldıyor, üzerimde kuzgunlar gaklıyor. #italic Dünya hafifçe dönüyor ve fark ettiğimde...#!\n\nYüzüstü akıntıya düşmüşüm. Tuhaf biçimde ağır hissediyorum; burada boğulabilirmişim gibi. Ama kendimi suyun yüzeyine ittiğimde, dünyanın ağırlığının üzerimden yuvarlandığını hissediyorum. Daha hafifim, daha mutluyum, #bold daha özgürüm#!.\n\nKalp ağacının suskun yüzüyle yüzleşmek için geri yürüyorum. Bakışı kıpırtısız duruyor."

 agot_filler_riverlands.0047.a:0 "Ne... Az önce ne oldu?"

 agot_filler_riverlands.0050.t:0 "Egzotik Çiçekler"

 agot_filler_riverlands.0050.desc:0 "Parlak ve güneşli bir gün; ama sarayım çamur kadar sıkıcı. Gri ve kahve ve yeniden gri — dışarıda ışıltı ve güzellik varken, benim gibi bir [ROOT.Char.GetLadyLord]nün sarayı neden bu kadar sönük olsun ki? Hem neden uzak diyarların çiçekleriyle bezenip çevresinden daha güzel olmasın?"

 agot_filler_riverlands.0050.a:0 "Reach'ten gelecek çiçekler bu salonları canlandırır."

 agot_filler_riverlands.0050.b:0 "Bana ancak Dar Deniz'in ötesinden, Braavos'tan gelen çiçekler yeter."

 agot_filler_riverlands.0050.c:0 "Aslında güzellik pahalıdır ve paramı harcayacak daha iyi işlerim var."

 agot_filler_riverlands.0051.t:0 "Egzotik Çiçekler"

 agot_filler_riverlands.0051.desc:0 "Nihayet Reach çiçeklerim geldi ve sıkıcı yaşam günlerim sona erdi. Güller, şakayıklar, kadifeler ve daha niceleri var — duvarlarımı ustaca süsleyen rengârenk bir vurgu cümbüşü. Belki artık misafirlerim ve saray mensuplarım kaçmak için bu kadar acele etmez."

 agot_filler_riverlands.0051.a:0 "Reach'in bahçıvanlarına saygılarımı sunuyorum!"

 agot_filler_riverlands.0052.t:0 "Egzotik Çiçekler"

 agot_filler_riverlands.0052.desc:0 "Braavos'tan ısmarladığım çiçeklerin göz alıcı olacağını biliyordum; ama ne kadar dönüştürücü olacaklarını tahmin bile edememiştim! Satıcı bana yalnızca şaşırtıcı çeşitlilikte ve güzellikte bir çiçek dizisi değil, aynı zamanda her birinin özelliklerini açıklayıp süslemeye yardımcı olacak bir danışman da gönderdi. Bu danışman tuhaf kıyafetler giyiyor ve Ortak Dil'i kulağı tırmalayan bir aksanla konuşuyor olabilir; ama güzellik gözü tek kelimeyle rakipsiz!\n\nSarayımı, saray mensuplarımın hiç görmediği türden egzotik zarafetten oluşan bir dokumaya dönüştürdü. Eski taş duvarların bile bir rolü var; yalnızca çiçekleri vurgulamak için olsa dahi. Salonlarımda insan gülümsemeden edemiyor ve günün işleri bittikten çok sonra, Braavos çiçeklerinin arasında biraz daha gevşeyip oyalanan epey saray mensubu buldum."

 agot_filler_riverlands.0052.a:0 "Sarayım tüm Westeros'un kıskançlığı olacak!"

 agot_filler_riverlands.0053.t:0 "Tarımsal Zorluklar"

 agot_filler_riverlands.0053.desc:0 "İnanması güç; ama danışmanlarımdan biri, topraklarımdaki bir kontluğun çiftçilerinin, tarlalarının eskisi kadar ürün vermediğinden şikâyet ettiğini bildiriyor. İlk düşüncem, vergi yüklerini azaltmak için bir tür oyun olması; ama danışmanlarımla kayıtları incelediğimde sonuç kaçınılmaz: bu kontluk eskisi kadar verimli değil.\n\nTrident'in üç kolu ve sayısız küçük dere ve akıntıyla sulanan Nehir Toprakları'nın toprakları her zaman bereketli olmuştur; ancak üstatların dediğine göre, bazı arazilerin çeşitli olası nedenlerle daha az üretken hâle gelmesi bilinmez bir şey değildir."

 agot_filler_riverlands.0053.a:0 "Üretilen tahıldan en iyi şekilde yararlanmak için yel değirmenleri inşa edeceğiz."

 agot_filler_riverlands.0053_tt.a:0 "Yel değirmenleri pahalı olacak; ama etkileyici."

 agot_filler_riverlands.0053.b:0 "Bir kanal ağı, yeni parsellerin ekimini kolaylaştıracak."

 agot_filler_riverlands.0053_tt.b:0 "Kanallar daha ekonomik bir çözüm sunabilir."

 agot_filler_riverlands.0053.c:0 "Toprağın verimliliği çiftçilerin sorumluluğudur, benim değil."

 agot_filler_riverlands.0053_tt.c:0 "Çiftçiler tatmin olmayacak ve size taleplerde bulunabilir."

 agot_filler_riverlands.0053.d:0 "Şu an bununla ilgilenecek kaynaklara sahip değilim."

 agot_filler_riverlands.0054.t:0 "Tarımsal Zorluklar"

 agot_filler_riverlands.0054.desc:0 "Bir zamanlar kısır toprak şikâyetleri varken, şimdi heybetli yel değirmenlerim hakkında yalnızca parlak raporlar duyuyorum. Çiftçiler, ticaretlerinin verimliliğini büyük ölçüde artırdığı için onlara gurur ve minnetle bakıyor. Ziyarete gelen soylular, ileri görüşlü cömertliğim için beni takdir ediyor. Gerçekten de bir krizi nimete dönüştürdüm."

 agot_filler_riverlands.0054.a:0 "Ne harika yel değirmenleri."

 agot_filler_riverlands.0055.t:0 "Tarımsal Zorluklar"

 agot_filler_riverlands.0055.desc:0 "Tam beklediğim gibi, sorunlu kontluktaki yeni kanal ağı, yeni toprak parsellerinin ekime açılmasını sağlayarak verimi artırdı ve halkı mutlu etti. Üstelik uzak diyarlardan insanlar, başardıklarımızı incelemeye geldikçe, bir toprak sahibi olarak itibarımı da güçlendiriyor."

 agot_filler_riverlands.0055.a:0 "Kanallarım muhteşem."

 agot_filler_riverlands.0056.t:0 "Tarımsal Zorluklar"

 agot_filler_riverlands.0056.desc:0 "Azalan çiftçilik verimi meselesinin çözüldüğünü sanmıştım; ama bir hizmetkâr, benimle görüşmek için bekleyen bir çiftçi heyeti olduğunu bildirdiğinde, başımın daha da belada olduğunu anlıyorum.\n\nGörünüşe göre çiftçiler, sorumluluklarını onlar adına üstlenmeme kararımdan memnun kalmamış ve bu sorunu neden kendi başlarına çözemeyeceklerini anlatmaya gelmişler. Kanıt olarak önüme paslanmış ve perişan bir alet dizisi koyuyorlar — kırık bıçaklı tırpanlar, bozuk sabanlar ve kötü kullanılmış daha pek çok şey.\n\n"Don't matter how hard we work with tools such as these," one man says. "Begging milord's pardon, but without replacements, our county'll never prosper.""

 agot_filler_riverlands.0056.a:0 "Halkımın ihmal edildiği söylenmeyecek. Aletlerinizi alacaksınız."

 agot_filler_riverlands.0056.b:0 "Aletlerinizi yenileyemem."

 agot_filler_riverlands.0056.c:0 "Bu talebin küstahlığı beni hayrete düşürüyor. Zindanlara!"

 agot_filler_riverlands.0060.t:0 "Tarım Arazisi Genişlemesi"

 agot_filler_riverlands.0060.desc:0 "Konseyim masaya oturmaya vakit bulamadan, her zaman fikir adamı olan [steward.GetCouncilTitle]im, topraklarımdaki çiftlik arazisini genişletmek için yeni bir plan üzerine doğaçlama konuşmaya başlıyor. [steward.GetSheHe], üretken ekime açılabilecek araziler üzerinde faydasızca yayılan ormanlar olduğunu açıklıyor. Halkımın yiyecek toplama ve kereste için bu tür ormanlara bel bağladığına dair bir şey hatırlıyorum; ama [steward.GetCouncilTitle]im, göz alıcı artırılmış verim tahminleriyle bu endişelerin üzerinden geçip gidiyor.\n\nKonseyin geri kalanı, plana dair hafif eleştiriler ve ılık desteklerden oluşan bir karışım sunuyor; ama sonuçta karar yalnızca bana düşüyor."

 agot_filler_riverlands.0060.a:0 "Projeye başlayın. Daha büyük verimlilik her maliyeti haklı çıkaracak."

 agot_filler_riverlands.0060.b:0 "Buna değecek gibi görünmüyor."

 agot_filler_riverlands.0061.t:0 "Tarım Arazisi Genişlemesi"

 agot_filler_riverlands.0061.desc:0 "Görünüşe göre [steward.GetCouncilTitle]imin kesmeye ikna ettiği, faydasızca yayılan ormanlar, sandığımız kadar sıradan değilmiş. İnsan gözünün binlerce yıldır görmediği küçük bir akteber korusu keşfedilmiş; ya da üstatlar öyle söylüyor. Böyle bir korunun Andallar'ın saldırısından nasıl sağ çıktığı ve bu kadar uzun süre nasıl bulunamadığı bir gizem. Gizemler her zaman bu ağaçları çevreler.\n\nAçıklama ne olursa olsun, akteber korusu çiftlik arazisinin genişletilmesi için bir sorun teşkil ediyor. "

 agot_filler_riverlands.0061.a:0 "Sonuçta onlar yalnızca ağaç. Onları temizleyin ve devam edin."

 agot_filler_riverlands.0061.b:0 "Akteberler kutsaldır ve bu koruyu kesmek yanlış olur. Projeyi durdurun."

 agot_filler_riverlands.0061.c:0 "Tanrıların kendileri bu ormanlarda yaşıyor olabilir; ama proje devam etmek zorunda."

 agot_filler_riverlands.0062.t:0 "Tarım Arazisi Genişlemesi"

 agot_filler_riverlands.0062.desc:0 "İyi [steward.GetCouncilTitle]imin ormanları temizlemenin kolaylığına dair en gürültülü güvencelerine rağmen, işler umduğumuz kadar pürüzsüz gitmiyor. Şimdiye dek iki kat fazla dönüm temizlenmiş olması gerekiyordu ve yeni parsellerde çoktan fidanlar filizlenmeye başladı. En kötüsü, gecikmelere rağmen kereste ekipleri daha fazla ücret talep ediyor!"

 agot_filler_riverlands.0062.a:0 "İşleri hızlandıracaksa, kerestecilerin taleplerini kabul edebiliriz."

 agot_filler_riverlands.0062.b:0 "Başlangıçta kabul ettikleri ücret için çalışabilirler ya da bedava çalışabilirler. Onların seçimi."

 agot_filler_riverlands.0062.c:0 "Vardiya amirini zindana kilitlediğimde motivasyonlarını yeniden keşfedecekler."

 agot_filler_riverlands.0063.t:0 "Çiftlik Arazisi Genişletme"

 agot_filler_riverlands.0063.desc:0 "Zaman almış ve proje aksiliklerden yoksun kalmamış olabilir; ama nihayet ormanlar temizlendi ve yerine verimli çiftlik arazisi ekildi. [steward.GetCouncilTitle]im, ilerlemenin yürüyüşünün antik çağın köylü adetlerini geri püskürttüğüne dair nefes nefese bir konuşmaya başlıyor; ama benim aklımda yalnızca hanemin bundan böyle keyfini süreceği genişletilmiş vergi tabanı var."

 agot_filler_riverlands.0063.a:0 "Tatlı, tatlı vergiler."

 agot_filler_riverlands.0064.t:0 "Mızrak Altyapısı"

 agot_filler_riverlands.0064.desc:0 "Konsey toplantısının ortasında [steward.GetCouncilTitle]im [steward.GetTitledFirstName], Trident'in suları boyunca uzanan altyapının biraz eksik olduğuna dikkat çekiyor. [steward.GetSheHe], nehir boyunca çeşitli rıhtım ve iskelelerin iyileştirilmesine yatırım yaparsak, daha büyük teknelerin yük yüklemesi ve boşaltmasının kolaylaşacağını söylüyor. Bu, halk için bir nimet olur; ama daha da önemlisi, vergi gelirimizi de artırır. Ayrıca hatırı sayılır bir para harcaması gerektirecek.\n\nDaha mütevazı bir yatırım için [steward.GetSheHe], balıkçılara daha iyi takım almaları, teknelerini onarmaları hatta yenilerini almaları için fon sağlayabileceğimizi öneriyor. Bu, vergi gelirine yalnızca çok mütevazı bir katkı sağlar; ama gıda arzını güçlendirir ve böylece topraklarımı daha dayanıklı kılar."

 agot_filler_riverlands.0064.a:0 "Rıhtım iyileştirmelerini finanse edin; kasalarımız zamanla taşacak."

 agot_filler_riverlands.0064_tt.a:0 "Birkaç ay sonra yatırımınız meyvesini verebilir."

 agot_filler_riverlands.0064.b:0 "Altın güzel bir şeydir; ama gıda daha hayatidir. Balıkçıları finanse edin."

 agot_filler_riverlands.0064.c:0 "Bu fikirlerin hiçbirinin paraya değdiğine ikna olmadım."

 agot_filler_riverlands.0065.t:0 "Mızrak Altyapısı"

 agot_filler_riverlands.0065.desc:0 "Tam [steward.GetTitledFirstName]nün söylediği gibi oldu. Yeni rıhtımlar daha geniş ve daha sağlam; aynı anda daha fazla yükün yüklenip boşaltılmasına izin veriyor. Trident boyunca her zamankinden daha fazla ticaret akıyor ve herkes daha iyi durumda.\n\n[steward.GetFirstNameNoTooltip]yi [steward.GetCouncilTitle]im olarak atarken bir bildiğim olduğunu biliyordum."

 agot_filler_riverlands.0065.a:0 "Ticaret su gibi aksın."

 agot_filler_riverlands.0066.t:0 "Bereketli Hasat"

 agot_filler_riverlands.0066.desc:0 "[agot_river_0066_county.GetNameNoTier] çiftçileri için özellikle iyi bir yıl oldu ve bu hasat yılların en zengini. Halk arasında bir tür coşku yayıldı; yılın geri kalanı için daha tok karınlar ve daha güzel şeyler bekliyorlar; ama kurnaz danışmanlarımdan bazıları — elbette ihtiyatla — fazlaya el koyup daha iyi bir kullanıma sunmamı önerdi.\n\nBu kaynakların kullanılabileceği bir iki güzel kullanım alanı kesinlikle düşünebiliyorum; ama yapmalı mıyım?"

 agot_filler_riverlands.0066.a:0 "Savaşçılar diyarın gücüdür. Fazlayı askeri erzak olarak ayırın."

 agot_filler_riverlands.0066.b:0 "Bu toprakların [ROOT.Char.GetLadyLord]i olarak, her türlü fazla ürüne hakkım var."

 agot_filler_riverlands.0066.c:0 "Halk, sıkı çalışmalarının faydalarını görmeli."

 agot_filler_riverlands.0067.t:0 "Beklenmedik Bolluk"

 agot_filler_riverlands.0067.desc:0 "[ROOT.Char.GetLadyLord] olarak dikkatim çoğunlukla yönetim meselelerinde olsa da, zaman zaman ilgi çekici bir oyalanma sağlayan ticari fırsatlar belirir. Böyle bir fırsat yakın zamanda meyvesini verdi — tabiri caizse, beklenenden çok daha fazla meyve.\n\nMalları alıkoyup kendim kârla satmamam için hiçbir neden yok. Yine de, bilge bir efendi bazen sadık vassallarıyla paylaşmalıdır."

 agot_filler_riverlands.0067.a:0 "[vassal_1.GetTitledFirstName] bir ödülü en çok hak eden kişi"

 agot_filler_riverlands.0067.b:0 "[vassal_2.GetTitledFirstName]nün sadakati bu bedele fazlasıyla değer."

 agot_filler_riverlands.0067.c:0 "Bu sürpriz kazancı ben hak ettim ve onu saklayacağım."

 agot_filler_riverlands.0068.t:0 "Bir Vassalın Dilekçesi"

 agot_filler_riverlands.0068.desc:0 "Vassalım [project_vassal.GetTitledFirstName], [project_vassal.GetHerHis] topraklarından ziyarete gelirken kısa bir görüşme talep ediyor. İçeri alındığında [project_vassal.GetHerHis] gözündeki bir parıltıyı fark ediyorum; bu parıltı hem merak uyandırıcı hem endişe verici. [project_vassal.GetSheHe], giderek artan bir heyecanla, [project_vassal.GetHerHis] topraklarındaki kanalları iyileştirme fikrini açıklıyor; böylece çiftçiler ürünlerini daha uzaklardan pazara getirebilecek. Daha fazla ürün satılması, daha fazla vergi geliri demek. Mantıklı proje için iltifatlarımı sunuyorum; ama bununla ne işim olduğuna dair hiçbir fikrim olmadığını itiraf ediyorum.\n\n"My [ROOT.Char.GetLadyLord]," [project_vassal.GetSheHe] says, "I would need a modest investment to see this to completion. You would of course receive a portion of my gains."\n\nAh. I am to be [project_vassal.GetHerHis] moneylender, then."

 agot_filler_riverlands.0068.a:0 "Pekâlâ. Bu yeterince mantıklı görünüyor."

 agot_filler_riverlands.0068.b:0 "İyi bir fikir; ama finansmanı başka yerde bulmalısın."

 agot_filler_riverlands.0068.c:0 "Salak! Burası Demir Bank'ın bir şubesi gibi mi görünüyor?!"

 agot_filler_riverlands.0069.t:0 "Bir Vassalın Dilekçesi"

 agot_filler_riverlands.0069.desc:0 "[project_vassal.GetTitledFirstName]nün gözündeki parıltıyı ilk gördüğümden bu yana epey zaman geçti; ama hizmetkarlarım bugün [project_vassal.GetHerHim]i yeniden kabul salonuma aldığında, parıltı her zamanki kadar parlaktı. Nihayet proje, [project_vassal.GetHerHis] tam memnuniyetiyle tamamlandı. Üstelik [project_vassal.GetSheHe], [project_vassal.GetHerHim]in artan vergi gelirinin kayda değer bir yüzdesi olduğuna dair bana güvence verdiği bir miktar parayı gururla sunuyor.\n\nBu miktarın, [project_vassal.GetTitledFirstName]nün benden aldığı tutardan az olduğunu fark etmemek elde değil."

 agot_filler_riverlands.0069.a:0 "Aferin. Topraklarımızda iyileştirmeler yapmak her zaman iyidir."

 agot_filler_riverlands.0069.b:0 "Bana bundan fazlası borçlu."

 agot_filler_riverlands.0070.t:0 "Ticaret Anlaşmazlığı"

 agot_filler_riverlands.0070.desc:0 "Kabul salonuma ulaşmalarına çok önceden kavgalarını duyabiliyorum ve vassallarım, huzuruma girdiklerinde de didişmeye hiç ara vermiyor. [saltpans_vassal.GetTitledFirstName] ile [maidenpool_vassal.GetTitledFirstName] arasındaki anlaşmazlık, Nehir Toprakları ile Vadi arasındaki ticaret yolları üzerine.\n\n[saltpans_vassal.GetTitledFirstName], Nehirler ve Tepelerin bir Kralı tarafından verilen kadim bir tüzük gereği Saltpans'in münhasır ticaret hakkını elinde tutması gerektiğinde ısrar ediyor. [maidenpool_vassal.GetTitledFirstName] ise, soyu tükenmiş bir hanenin tozlu sözünün mevcut hukuk için bir temel olamayacağını ve Maidenpool'un Vadi ile ticareti yönetmek için kıyas kabul etmez biçimde daha uygun olduğunu savunuyor.\n\nTicaretin neden iki kasabadan da akmaması gerektiğini hayatım boyunca anlayamayacağım; ama görünüşe göre bu dikenli lordlar benden bir yanıt isteyecek."

 agot_filler_riverlands.0070.a:0 "Kadim bir tüzüğü bozmak benim haddime mi? Saltpans kontrolü elinde tutacak."

 agot_filler_riverlands.0070.b:0 "Maidenpool daha uygun."

 agot_filler_riverlands.0070.c:0 "Bu saçmalığı kendi aralarında çözebilirler."

 agot_filler_riverlands.0071.t:0 "Ticaret Anlaşmazlığı"

 agot_filler_riverlands.0071.desc:0 "[maidenpool_vassal.GetTitledFirstName] beni bir koridorda yakalayıp benimle gizli bir görüşme istiyor. Vadi ile ticaret yolları konusunda Saltpans ile olan anlaşmazlığına dair önceki kararım ona hiç iyi oturmamış görünüyor. Tam ona, efendisine itaat etme görevini hatırlatmak üzereyken, dolu bir para kesesi çıkarıp yeniden düşünüp düşünemeyeceğimi soruyor. Paraların rengi altın."

 agot_filler_riverlands.0071.a:0 "Evet, belki de Maidenpool sonuçta daha uygun."

 agot_filler_riverlands.0071.b:0 "Rüşvet mi?! Beni onursuz mu sanıyorsun? Defol!"

 agot_filler_riverlands.0072.t:0 "Boyun Ağrısı"

 agot_filler_riverlands.0072.desc:0 "Danışmanlarım ve ben en acil meseleleri tartışmayı bitirdikten sonra, vassallarımdan biri olan [canal_vassal.GetTitledFirstName], Boyun'dan [canal_vassal.GetHerHis] topraklarına uzanan belirli bir kanaldan söz ediyor. Görünüşe göre bu kanal şu anda, düzenli iş yaptığım belirli bir tüccarın mülkiyetinde; [canal_vassal.GetTitledFirstName] bu durumu inanılmaz buluyor.\n\n"How can it be," [canal_vassal.GetSheHe] says,"that a mere merchant — a commoner, you see — can own such infrastructure in mine own lands?"\n\nBy rights, [canal_vassal.GetTitledFirstName] insists, the structure ought to belong to [canal_vassal.GetHerHim], and as [ROOT.Char.GetLadyLord] of these lands it falls on me to rectify the situation."

 agot_filler_riverlands.0072.a:0 "Kanalı sana bağışlayacağım; ama bu iyiliğin bir bedeli var."

 agot_filler_riverlands.0072.b:0 "O 'sıradan adam' benim iş ortağımdır. Kanal onun kalacak!"

 agot_filler_riverlands.0073.t:0 "Korkunç Kabalık"

 agot_filler_riverlands.0073.desc:0 "Soylu akranlarımı İkizler'de misafir etmek uzun zamandır geleneğimdir. Yüzyıllardır ayakta duran iki kale, birlikte tüm Yedi Krallık'taki en müthiş tahkimatlardan birini oluşturur; pek çok lord da ziyaretlerinde bu gerçeği kibarca kabul etmiştir.\n\nBu yüzden [realm_vassal.GetTitledFirstName]nün ağır sözlerine maruz kalmak beni büyük bir şok ve dehşete düşürdü. Hanemin asil makamına 'çirkin' dedi. 'İki köpek pisliği yığını gibi, bodur minik davul kuleleri.'\n\nBöyle iğrenç bir dili nadiren duymuşumdur; bir lordun kalesi için asla!"

 agot_filler_riverlands.0073.a:0 "Kimse İkizler hakkında böyle konuşamaz. Defol buradan!"

 agot_filler_riverlands.0073.b:0 "Ne istersen söyle, [realm_vassal.GetTitledFirstName]. Sen diyarın kıçındaki bir sivilceden başka bir şey değilsin."

 agot_filler_riverlands.0073.c:0 "Kimse İkizler hakkında böyle konuşamaz. Onu Yeşil Kol'a atın!"

 agot_filler_riverlands.0073.d:0 "Küçük bir akıldan küçük bir yorum.. Hadi işimize dönelim."

 agot_filler_riverlands.0073_tt.b:0 "[realm_vassal.GetTitledFirstName] bu hakareti hatırlayacak."

 agot_filler_riverlands.0073_tt.c:0 "[realm_vassal.GetTitledFirstName]nün varisi bu saldırıyı kolay kolay unutmayacak."

 agot_filler_riverlands_open_desc.0074:0 "[realm_vassal_heir.GetTitledFirstName] size savaş ilan ediyor!"

 agot_filler_riverlands.0074.desc:0 "[ROOT.Char.GetTitledFirstName], babam Lorda ne olduğunu biliyorum; harap duvarlarının arkasına sığınmıyorsan saklanacak yerin yok... çünkü intikam için geliyorum. Ve silahlı geliyorum!"

 agot_filler_riverlands.0074.a:0 "Baban o geveze ağzını kapalı tutmalıydı."

 agot_filler_riverlands.0074.a_tt:0 "Siz ile [realm_vassal_heir.GetTitledFirstName] arasında bir boyun eğdirme savaşı patlak verdi."

 agot_filler_riverlands.0075.t:0 "Karıştırılan Kollar"

 agot_filler_riverlands.0075.desc:0 "Birkaç vassalımla birlikte kırsalda keyifli bir at gezintisinin tadını çıkarırken, [fork_vassal.GetTitledFirstName], Trident'in Kızıl Kolu'nun sularının sade zarafeti hakkında oldukça şiirsel bir yorum yapıyor. Bu, çok takdir edilecek bir yorum olurdu; ne var ki at sürdüğümüz nehir aslında Kızıl değil, Trident'in Yeşil Kolu'ydu.\n\nBu iki ünlü nehri, özellikle görsel farklılıkları ortadayken — Kızıl Kol batı tepelerinin alüvyonuyla, Yeşil Kol ise Boyun'un bataklıklarıyla renklenir — herkesten önce bir Nehir Lordu'nun karıştırması bir şok. Sancaktarlarımdan birkaçı bu hataya sırıtıyor."

 agot_filler_riverlands.0075.a:0 "Asla yanılmadığını iddia eden yalancıdır. Basit bir hata hakkında şaka yapmak yakışıksızdır."

 agot_filler_riverlands.0075.b:0 "[fork_vassal.GetTitledFirstName], beyninin olması gereken yerde Kızıl Kol çamuru var."

 agot_filler_riverlands.0076.t:0 "Azgın Sular"

 agot_filler_riverlands.0076.desc:0 "Trident kıyısındaki topraklar yemyeşil, verimli ve üretkendir; ama zaman zaman bu nimetlerin bir bedeli olduğu bize hatırlatılır. Bugün Trident kıyısındaki bir köyden gelen halkımdan biri, çamura batmış ve titreyerek kapıma çıktı. Görünüşe göre koca nehir, kıyılarını aşmış ve dönümlerce çiftlik arazisini suya boğmuş. Daha kötüsü, sular yükselmeye devam ediyor ve yakında köyü yok etmekle tehdit edecek.\n\nBöyle bir felaket, halkın başa çıkabileceğinin çok ötesinde; bu yüzden benim, [ROOT.Char.GetLadyLord]lerinin yardımını istemek için bu haberciyi gönderdiler. Trident'in taşması ilk kez olmuyor ve suları yönlendirmek imkânsız değil; ama bu tür projeler her zaman ağır bir maliyetle gelir."

 agot_filler_riverlands.0076.a:0 "Bir [ROOT.Char.GetLadyLord], [ROOT.Char.GetHerHis] topraklarını kollamalıdır. Elimden gelen her şekilde yardım edeceğim."

 agot_filler_riverlands.0076.b:0 "Bununla ilgilenecek zamanım ya da kaynaklarım yok."

 agot_filler_riverlands.0076.c:0 "Gerçekten umursayacağımı mı sandın? Defol git ve çamurunu nereye sıçrattığına dikkat et."

 agot_filler_riverlands.0077.t:0 "Mızrak'ta Bir Dalış"

 agot_filler_riverlands.0077.desc:0 "Gökyüzü berrak ve mavi, güneş parlak ve kırsal renk ve hareketle dolup taşıyor — tanrıların lanetlediği sıcak olmasa, nehirlerde mükemmel bir gün! Alnımda ter damlaları belirip kıyafetlerime işliyor; benim gibi bir [ROOT.Char.GetLadyLord]e yakışmayan, kaçınılmaz bir sıkıntı. Gençliğimde bu tür günlerden nasıl keyif aldığımı tembellikle merak ediyorum; ama sonra, bir kilit açılır gibi, anılar netleşerek yerine oturuyor. Nehirde yüzerdim!\n\nElbette Trident kadar azgın bir nehirde yüzmenin riskleri vardır; ama sular üzerindeki hâkimiyetime güvenmiyorsam, nasıl bir Nehir Topraklısı olurum? Ve ne güzel sulardır onlar, kavurucu sıcaktan bir sığınak!"

 agot_filler_riverlands.0077.a:0 "Trident'te bir yüzme tam da gereken şey!"

 agot_filler_riverlands.0077.b:0 "Ben bir [ROOT.Char.GetLadyLord]im, çocuk değil. Havai işlere vaktim yok."

 agot_filler_riverlands.0078.t:0 "Mızrak'ta Bir Dalış"

 agot_filler_riverlands.0078.desc:0 "Trident'in suları beni serin kucaklarına davet ediyor ve sıcaktan kurtulmanın rahatlığıyla hoşnut bir iç çekiş bırakıyorum. Bu basit zevk, Trident'in gücü bana hatırlatılana dek yalnızca birkaç an sürüyor: hızlı akıntılar beni kavrayıp akış yönünde sürüklüyor. Gülümseyerek gençliğimde öğretilen kulaçları hatırlıyorum ve kaslarım eforla sızlasa da itaat ediyor. Kısa sürede daha sakin bir kola çıkıyorum ve oradan yeniden kıyıya varıyorum.\n\nNefesimi toplamak için iki büklüm oluyorum; ama gülümseme dudaklarımdan hiç ayrılmıyor. Kaygı için zorlu egzersizden iyi bir deva mı olur? Yenilenen güvenle atımın üzerine atlıyor ve günün işlerine dönüyorum."

 agot_filler_riverlands.0078.a:0 "Trident'in gücü bir lütuftur."

 agot_filler_riverlands.0079.t:0 "Mızrak'ta Bir Dalış"

 agot_filler_riverlands.0079.desc:0 "Trident'in suları beni serin kucaklarına davet ediyor ve sıcaktan kurtulmanın rahatlığıyla hoşnut bir iç çekiş bırakıyorum. Bu basit zevk, Trident'in gücü bana hatırlatılana dek yalnızca birkaç an sürüyor: hızlı akıntılar beni kavrayıp akış yönünde sürüklüyor. Gençliğimde öğretilen kulaçları hatırlamaya çalışıyorum; ama kaslarım itirazla haykırıyor ve kendimi nehre karşı boşuna çırpınırken buluyorum. Başımı suyun üzerinde tutabilmem mucize; ve Trident sonunda beni, istenmeyen bir döküntü gibi kayalık bir kıyıya bıraktığında, hiç enerjim kalmıyor.\n\nSaatler sürmüş gibi gelen bir sürenin ardından nihayet ayağa kalkmayı başarıyorum ve çıplak ve keyifsiz, akış yukarı topallayarak dönüyorum."

 agot_filler_riverlands.0079.a:0 "Trident'in gücü küçümsenmemeli."

 agot_filler_riverlands.0080.t:0 "Mızrak'ta Bir Dalış"

 agot_filler_riverlands.0080.desc:0 "Trident'in suları beni serin kucaklarına davet ediyor ve sıcaktan kurtulmanın rahatlığıyla hoşnut bir iç çekiş bırakıyorum. Bu basit zevk, Trident'in gücü bana hatırlatılana dek yalnızca birkaç an sürüyor: hızlı akıntılar beni kavrayıp akış yönünde sürüklüyor. Gülümseyerek akıntının çekişini karşılıyorum ve bir su samuru gibi başımı suyun altına daldırıyorum.\n\nTam kıyıya dönmeye hazırlanırken, dipten gelen bir parıltı gözüme çarpıyor. Bir balığın pulları mı? Hayır, bu çok parlak. Bir nefes hava alıp dalıyorum; ellerimi çamurda ve kayaların altında gezdiriyorum, ta ki parmak uçlarım soğuk ve pürüzsüz bir şeye değene dek. Bir gümüş para; üstelik yalnız değil! Birkaç dalışın ardından, çoktan unutulmuş bu türden kayda değer bir miktar sayıyorum."

 agot_filler_riverlands.0080.a:0 "Trident'in lütufları çoktur."

 agot_filler_riverlands.0081.t:0 "Mızrak'ta Bir Dalış"

 agot_filler_riverlands.0081.desc:0 "Trident'in suları beni serin kucaklarına davet ediyor ve sıcaktan kurtulmanın rahatlığıyla hoşnut bir iç çekiş bırakıyorum. Bu basit zevk, Trident'in gücü bana hatırlatılana dek yalnızca birkaç an sürüyor: hızlı akıntılar beni kavrayıp akış yönünde sürüklüyor. Gülümseyerek akıntının çekişini karşılıyorum ve bir su samuru gibi başımı suyun altına daldırıyorum.\n\nTam kıyıya dönmeye hazırlanırken, dipten gelen bir parıltı gözüme çarpıyor. Yakından bakıp nefesimi tutuyorum; nehir suyunu yutup neredeyse boğuluyorum. Kadim bir plaka zırha sarılı bir iskelet, çamur ve kayaların arasında ürkütücü bir durgunlukla yatıyor.\n\nAskerlerin teknelerde savaşırken bu kadar ağır zırh giymemesinin bir nedeni vardır; ama bazı adamlar her zaman temkinli olmaktansa gözü kara olmayı seçer."

 agot_filler_riverlands.0081.a:0 "Kasvetli bir hatırlatma ya da tanrılardan bir uyarı. Her halükârda rahatsız edici."

 agot_filler_riverlands.0081.b:0 "Kendini boğdurmuş ihtiyar bir aptalda kayda değer bir şey yok."

 agot_filler_riverlands.0082.t:0 "Mızrak'ta Bir Dalış"

 agot_filler_riverlands.0082.desc:0 "Trident'in suları beni serin kucaklarına davet ediyor ve sıcaktan kurtulmanın rahatlığıyla hoşnut bir iç çekiş bırakıyorum. Bu basit zevk, Trident'in gücü bana hatırlatılana dek yalnızca birkaç an sürüyor: hızlı akıntılar beni kavrayıp akış yönünde sürüklüyor. Gülümseyerek gençliğimde öğretilen kulaçları hatırlıyorum ve kaslarım eforla sızlasa da itaat ediyor. Kısa sürede daha sakin bir kola çıkıyorum ve oradan yeniden kıyıya varıyorum.\n\nNefesimi toplamak için iki büklüm oluyorum; ama gülümseme dudaklarımdan hiç ayrılmıyor. Bunu yapmayı neden bıraktım ki? Beden ve zihin için bundan iyisi yok!"

 agot_filler_riverlands.0082.a:0 "Bundan böyle elimden geldiğince sık yüzeceğim."

 agot_filler_riverlands.0083.t:0 "Trident'in [ROOT.Char.GetLadyLord|U]"

 agot_filler_riverlands.0083.desc:0 "Nehir Toprakları'ndaki kalelerin yarısının kulelerinden görebilirsiniz onu: Trident. Westeros'un en kudretli nehri. Bereketli, hızlı, güzel. Gerçekten bir harika ve bir lütuftur."

 agot_filler_riverlands.0083.a:0 "Ve ben onu uçtan uca yönetiyorum."

 agot_filler_riverlands.0084.t:0 "Balıksı Bir Saygı"

 agot_filler_riverlands.0084.desc:0 "İster Trident'te yapma sinek atsınlar, ister Yengeç Körfezi'nde ağ atsınlar, Nehir Toprakları'nın balıkçılarında tuhaf bir gurur vardır. Balıkçılık bir geçim kaynağıdır, evet; ama aynı zamanda erkekler arasında bir yarıştır ve daha da ötesi, sularla bir tür komünyondur. O hâlde, yakalanan balığın kalitesine bu kadar önem verilmesine şaşmamak gerek.\n\nSalonlarıma giren balıkların çoğu mutfak yoluyla gelir; ama bir balıkçının bugün bana sunduğu, mücevher gibi parlayan örnek, doğrudan sudan ayaklarımın dibine getirilmiş gibi görünüyor. Her oltacının göz dikeceği bir kupa bu; üstelik hanemin armasındaki balığa çarpıcı bir benzerlik taşıyor.\n\n"It is the finest I ever caught, mi[ROOT.Char.GetLadyLord|l]," the fisherman says, "I was hoping mi[ROOT.Char.GetLadyLord|l] would do me the honor of accepting it as a gift."\n\nThe symbolism of the gift is unmistakable, but it would look ill of me to accept it without offering something in gratitude."

 agot_filler_riverlands.0084.a:0 "Haneme yakışır bir kupa. Lütfen minnettarlığımın bir göstergesi olarak bunu kabul et."

 agot_filler_riverlands.0084.b:0 "Güzel bir balık. Gerçekten harika. Evet, artık gidebilirsin."

 agot_filler_riverlands.0084.c:0 "Bir balık isteseydim, talep ederdim. Şimdi, defol!"

 agot_filler_riverlands.0084.d:0 "Ve sanırım onu, zehriyle birlikte yemeliyim, öyle mi? Yakalayın onu!"

 agot_filler_riverlands.0085.t:0 "Suların Bereketi"

 agot_filler_riverlands.0085.desc:0 "Uzun bir konsey oturumunun ardından dinlendirici bir at gezintisi için ahıra giderken, [steward.GetCouncilTitle]im koridorda zıplayarak geliyor; bir parşömen sallıyor ve 'balıklar' hakkında bir şeyler haykırıyor. Kalemde deliliğin kök salmış olma olasılığını düşünüyorum; ardından bir iç çekip sunulan parşömeni alıyorum.\n\nGörünüşe göre nehirler bu sezon özellikle bereketliymiş; vergi defterleri de öyle. Anladığım kadarıyla, şu anda kasalarıma doğru hatırı sayılır bir para girişi yolda."

 agot_filler_riverlands.0085.a:0 "Ah, 'balıklar' gerçekten de!"

 agot_filler_riverlands.0086.t:0 "Gizemler Taciri"

 agot_filler_riverlands.0086.desc:0 "Nehir Toprakları, içinden bol ticaretin aktığı bir kavşaktır ve tüccarlar sık sık, bazen Dar Deniz'in ötesinden gelen tuhaf ve değerli nesneler sunar. Ancak tüccarların kendilerinin, bugün kendini bana takdim eden adam kadar tuhaf görünmesi nadirdir — derisi, bir zamanlar gördüğüm tüysüz bir kediyi anımsatan gerçekten kadim bir adam. Yanında iki küçük keçe çanta taşıyor; biri soluk kahverengi, biri zengin mavi.\n\n"My good [ROOT.Char.GetLadyLord]," [myst_trader.GetSheHe] grumbles, "might I interest you in one of my two very fine bags? Either one could be yours for but a modest price. The contents of these bags, I assure you, are as subtle as the Stranger, as profound as the Old Night."\n\nThe bags, it must be said, do not look especially fine to me, but the mysterious contents do pique my interest."

 agot_filler_riverlands.0086.a:0 "Kahverengi çanta harikalar barındırıyor, eminim."

 agot_filler_riverlands.0086.b:0 "Mavi çantaya sahip olmalıyım. Sırları bana sesleniyor."

 agot_filler_riverlands.0086.c:0 "Bu çantalarla beni kandıramazsın. Gerçek hazinelerinden bahset."

 agot_filler_riverlands.0086.d:0 "Çantaların derin kadar yıpranmış ve bana yararın yok."

 agot_filler_riverlands.0087.t:0 "Gizemler Taciri"

 agot_filler_riverlands.0087.desc:0 "Ödeme, kuru ellerine ulaşır ulaşmaz tüccar çantayı ayaklarıma bırakıp salonumdan fırlıyor; yaşlı kemikleri onu endişe verici bir çeviklikle uzaklaştırıyor. Yine de çanta dikkatimi istiyor ve onu ellerime alıyorum. Düşündüğümden hafif; ama ona ne kadar çok bakarsam, gerçekten çok kaliteli bir çanta olduğunu o kadar çok anlıyorum ve içeriğinin değerine olan güvenim kabarıyor...\n\nTa ki içine uzanıp, tüccarın ödeme olarak aldığı paralar kadar sıradan tek bir para çıkarana dek."

 agot_filler_riverlands.0087.a:0 "Dünya kadar yaşlı bir adam tarafından dolandırıldım... En azından bir parça eğlence sağladı."

 agot_filler_riverlands.0087.b:0 "O piçin kafasını kazığa geçirteceğim!"

 agot_filler_riverlands.0088.t:0 "Gizemler Taciri"

 agot_filler_riverlands.0088.desc:0 "Ödeme, kuru ellerine ulaşır ulaşmaz tüccar çantayı ayaklarıma bırakıp salonumdan fırlıyor; yaşlı kemikleri onu endişe verici bir çeviklikle uzaklaştırıyor. Yine de çanta dikkatimi istiyor ve onu ellerime alıyorum. Düşündüğümden ağır. Bu kadar ağırlığı taşıyan çanta gerçekten çok kaliteli olmalı! Heyecanım kabarıyor... Ta ki içine uzanıp, Nehir Toprakları'ndaki her nehir kıyısını döşeyen binlercesinden farksız bir kaya çıkarana dek."

 agot_filler_riverlands.0088.a:0 "Ve nehre geri dönecek. Lanet dolandırıcı!"

 agot_filler_riverlands.0088.b:0 "Bir kaya mı?! Muhteşem! Ona Kayacık diyeceğim ve sonsuza dek benim olacak!"

 agot_filler_riverlands.0088_tt.a:0 "Kaya, sadık evcil hayvanınız olur; bir kaya kadar... sağlam."

 agot_filler_riverlands.0089.t:0 "Gizemler Taciri"

 agot_filler_riverlands.0089.desc:0 ""I see you are too wise for my bag-tricks," the merchant says. "I have no choice but to reveal to you my greatest treasures. Behold!"\n\nWith a flourish that would not have been out of place in a Tyroshi theater, he produces a hinged box, flips open its lid, and displays three curious brooches. The first of these is in the shape of a crown, though it more closely evokes the Free Cities than any crown of Westeros. The second brooch is a tightly-clenched fist, which calls to mind violence and will. The final brooch takes the delicate form of a heart.\n\nThe merchant bows lower than I would have thought his ancient frame would allow, averting his eyes in dramatic anticipation of my decision."

 agot_filler_riverlands.0089.a:0 "Kişiliğimin onuruna bir taçtan daha uygun bir şey olamaz."

 agot_filler_riverlands.0089.b:0 "Yumruk güçlüdür. Gücü severim. Yumruğu seçiyorum."

 agot_filler_riverlands.0089.c:0 "Kendi zarafetimle yalnızca işlemeli kalp broşu boy ölçüşebilir."

 agot_filler_riverlands.0089.d:0 "Bu sözde hazineler beni hayal kırıklığına uğratıyor. Kabuk tutmuş şahsını huzurumdan çek."

 agot_filler_riverlands.0090.t:0 "Gizemler Taciri"

 agot_filler_riverlands.0090.desc:0 "Tüccarın yıpranmış yüzü öyle bir tiksinti ifadesiyle çarpılıyor ki, bir an nezaket sınırlarını aşıp aşmadığımı merak ediyorum. Bu olasılığı düşünmeye fırsat bulamadan, tüccar homurdanarak ve tepinerek odadan çekip gidiyor.\n\nŞimdi anlıyorum ki bu, çantalarına yapılan hakaretleri hafife alacak bir adam değil."

 agot_filler_riverlands.0090.a:0 "Çantalar ciddi bir iştir ve onunkiler perişandı."

 agot_filler_riverlands.0091.t:0 "Gizemler Taciri"

 agot_filler_riverlands.0091.desc:0 "Seçtiğim broşu aldıktan sonra tüccar kapağı hızla kapatıp kutuyu, yerini düşünmeye cesaret edemediğim bir bölmeye gizlice yerleştiriyor.\n\n"May your brooch serve you and your house well, and may you never fall victim to bag-tricks."\n\nI wave my hand in acknowledgement, but I am too absorbed in my brooch to really pay attention. Turning the brooch over in my hand, a question occurs to me, but when I look up, the merchant and his bags are gone."

 agot_filler_riverlands.0091.a:0 "Bu, hayatımın en tuhaf karşılaşmalarından biriydi."

 agot_filler_riverlands.0092.t:0 "Tüccarın Tacı"

 agot_filler_riverlands.0092.desc:0 "Keyifli taç broşumu her gün takmaya başladım ve bu gözden kaçmadı. Hizmetkarlar gözlerini biraz daha hızlı kaçırıyor, vassallar biraz daha derin eğiliyor. Sanki huzurumda güneşin kendisi biraz daha parlak parlıyor. O saçma çantalardan birini almadığıma tanrılara şükür!"

 agot_filler_riverlands.0092.a:0 "Broşumla, tüm kara ve denizlerin [ROOT.Char.GetLadyLord]i olabilirim!"

 agot_filler_riverlands.0093.t:0 "Tüccarın Yumruğu"

 agot_filler_riverlands.0093.desc:0 "Kudretli yumruk broşumu her gün takmaya başladım ve her gün bu gücün keyfini sürüyorum. Soylu lordlar ve leydiler yolumdan çekilmek için telaşlanıyor ve kır saçlı gaziler huzurumda titriyor. "

 agot_filler_riverlands.0093.a:0 "Herkes korkunç edamdan korkacak!"

 agot_filler_riverlands.0094.t:0 "Tüccarın Kalbi"

 agot_filler_riverlands.0094.desc:0 "Güzel kalp broşumu her gün takmaya başladım ve çektiği ilgi göz açıcı oldu. Erkekler de kadınlar da bir çiçeğe arılar gibi bana çekiliyor. Daveti uzatmam yeterli; eminim ki vâris yetiştirmekte hiç zorlanmayacağım."

 agot_filler_riverlands.0094.a:0 "Bu broşla, aşkım bereketli olacak!"

 agot_filler_riverlands.0095.desc:0 "Hatırlayan herkesin bildiği kadarıyla, ailemde gizemli bir nehir tüccarına dair hikâyeler vardır; kadim ve bilge, biraz da eksantrik. Bu tüccarın, bir zamanlar şanlı atalarımdan birinin huzuruna çıkıp birkaç çantadan birini satın alma seçeneği sunduğu söylenir. Yoksa broşlar mıydı? Hikâyeler muğlak.\n\nBu hikâyeleri hep, ailemizdeki çocuklar için aktarılan bir tür oyundan ibaret uydurma sanırdım; ama bu sabah kabul salonumun büyük kapıları açıldığında bu inancımı yeniden gözden geçirmek zorunda kaldım.\n\nAdam, hesabı yapılamayacak kadar kadimdi — bir insanın olmaya hakkı olandan çok daha yaşlı. Önüme koyduğu kahverengi ve mavi çantalar, olsa olsa daha da eski görünüyordu.\n\n"My good lord," he grumbles, "might I interest you in one of my two very fine bags? Either one could be yours for but a modest price. The contents of these bags, I assure you, are as subtle as the Stranger, as profound as the Old Night."\n\nThe bags, it must be said, do not look especially fine to me, but the mysterious contents do pique my interest."

 agot_filler_riverlands.0096.t:0 "Azgın Suların [ROOT.Char.GetLadyLord|U]"

 agot_filler_riverlands.0096.desc:0 "Lorluk pelerini yorgun omuzlarımda ağır duruyor. Bu yükleri taşımamış çok az kişi tahmin eder; ama bir yüksek lordun otoritesi, neredeyse hesaplanamaz bir bedel getirir. Tarlalarda ekinler solduğunda, suç bende değil mi; topraklar benim değil mi? Savaş meydanında asker kanlar içinde yattığında, onu oraya getiren benim emrim değil miydi? Halkımın her sıkıntısının soyu benim sözüme dayanır; yine de yüreğimde, onların her başarısının bana değil, onlara ait olduğunu bilirim.\n\nBu bilgiye nasıl katlanılır?"

 agot_filler_riverlands.0096.a:0 "Buna #EMP katlanılmalı #! ve katlanacak olan benim."

 agot_filler_riverlands.0096.b:0 "Buna katlanılamaz. Hepsine son vereceğim."

 agot_filler_riverlands.112.t:0 "Trident'in Armağanları"

 agot_filler_riverlands.112.desc:0 "Bugün [fish_courtier.GetFirstNameNoTooltip] ile balık dolu bir öğleden sonra geçirmeye gidiyorum. Hava daha iyi olamazdı — rüzgâr yok, güneşli ve gökyüzünde tek bir bulut bile yok.\n\nGezinti için her şeyi hazırladıktan sonra suya doğru yola koyulduk ve balık takımlarımızla tuzaklarımızı kurmak için nehir kıyısında huzurlu bir yer bulduk. Su, ılık güneş ışığının altında parıldıyor ve ikimizin de bol bir av için umutları yüksek. Bu gece eve taze balık götürebilirsek nefis bir akşam yemeği olur!"

 agot_filler_riverlands.112.a:0 "Bakalım nehir bugün bize ne bağışlayacak!"

 agot_filler_riverlands.113.t:0 "Sabırsızlık Anahtar Değildir"

 agot_filler_riverlands.113.desc:0 "Yaklaşık bir saatlik avda hiç balık tutamayınca, [fish_courtier.GetFirstNameNoTooltip], kalması için [fish_courtier.GetHerHim]i ikna etmeye çalışsam da kaleye geri dönmeye karar verip gidiyor. [fish_courtier.GetSheHe|U] dinlemedi.\n\n"I'm done wasting my time!" [fish_courtier.GetSheHe|U] shouts before leaving.\n\n"I guess patience isn't one of [fish_courtier.GetHerHis|L] strong points," I mumble to myself after [fish_courtier.GetSheHe|L]'s gone."

 agot_filler_riverlands.113.a:0 "Sabır [fish_courtier.GetHerHis] güçlü yanı değil, sanırım."

 agot_filler_riverlands.113.b:0 "Büyü artık [fish_courtier.GetFirstNameNoTooltip]!"

 agot_filler_riverlands.114.t:0 "Ağda Balık Yok"

 agot_filler_riverlands.114.desc:0 "[fish_courtier.GetFirstNameNoTooltip] ve ben suyun başında biraz vakit geçiriyoruz; ama o zor günlerden biri. #italic Balıklar ısırmıyor#!. Nehir boyunca farklı noktalar deniyor, yemimizi değiştiriyor ve sabırla bekliyoruz; ama av için bizim günümüz değil. Ağlarımıza tek bir balık bile girmiyor.\n\nBir süre sonra [fish_courtier.GetFirstNameNoTooltip] hayal kırıklığıyla bana bakıp [fish_courtier.GetHerHis] başını sallıyor. Takımlarımızı toplamaya karar veriyoruz. Biraz sinir bozucu; ama bazen işler böyle yürür — balıkçılık ya tutar ya tutmaz.\n\nGeri dönerken güneş batmaya başlıyor ve bir zamanlar berrak olan gökyüzü hafif turuncu bir tona bürünüyor. Sanki batan güneş bile şanssızlığımıza acıyor."

 agot_filler_riverlands.114.a:0 "Bir dahaki sefere daha şanslı oluruz."

 agot_filler_riverlands.115.t:0 "Küçük Bir Ödül"

 agot_filler_riverlands.115.desc:0 "[fish_courtier.GetFirstNameNoTooltip] ve ben suyun başında biraz vakit geçiriyoruz; ama o zor günlerden biri. Balıklar ısırmıyor. Nehir boyunca farklı noktalar deniyor, yemimizi değiştiriyor ve sabırla bekliyoruz; ama av için bizim günümüz değil. Ancak kıyıya kurduğumuz tuzaklara bazı balıkların girdiğini fark ediyoruz.\n\nOltalarımızı attıktan bir süre sonra tuzaklara bakıyor ve bazı küçük balıklar görüyoruz; [fish_courtier.GetFirstNameNoTooltip] hayal kırıklığıyla bana bakıp [fish_courtier.GetHerHis] başını sallıyor. Biraz geç olmuştu; bu yüzden takımlarımızı toplamaya karar veriyoruz. Biraz sinir bozucu; ama bazen işler böyle yürür — balıkçılık ya tutar ya tutmaz."

 agot_filler_riverlands.115.a:0 "Onları suya geri bırakalım. İşe yaramazlar."

 agot_filler_riverlands.116.t:0 "Büyük Bir Ödül"

 agot_filler_riverlands.116.desc:0 "Oltamı suya atar atmaz, öteki uçta güçlü bir şey asılıyor. Tüm gücümle çekiyorum ve işte karşımda — devasa, görkemli bir sazan! Saf büyüklüğü beni hayrete düşürüyor ve şansıma neredeyse inanamıyorum!\n\n[fish_courtier.GetFirstNameNoTooltip]yi çağırıyorum ve [fish_courtier.GetSheHe] de aynı şekilde hayrete düşüyor. "That's one enormous carp! I can already imagine the delicious meal it'll make!" [fish_courtier.GetSheHe] exclaims, [fish_courtier.GetHerHis] eyes widening, [fish_courtier.GetHerHis] excitement matching mine. We both just stand there in amazement, looking at this majestic carp."

 agot_filler_riverlands.116.a:0 "Şu boyuna bak... Satıyorum onu."

 agot_filler_riverlands.116.b:0 "Bunu eve götürüyorum! Şuna bak!"

 agot_filler_riverlands.116.c:0 "Özgür dünyada dolaşmaya devam et, görkemli sazan!"

 agot_filler_riverlands.116.d:0 "Bu bir canavar! Onu nehre geri atın!"

 agot_filler_riverlands.116_tt.c:0 "Balığı salıyorsunuz."

 agot_filler_riverlands.116_tt.d:0 "[fish_courtier.GetFirstNameNoTooltip] balığı suya geri atıyor."

 agot_filler_riverlands.117.t:0 "Kırmızı Bir Armağan"

 agot_filler_riverlands.117.desc:0 "Oltamı suya atar atmaz, öteki uçta devasa bir şey asılıyor; çektiğim hiçbir balıktan çok daha ağır hissettiriyor. [fish_courtier.GetFirstNameNoTooltip] ve ben şaşkın bakışlar paylaşıyoruz; ikimiz de bu kadar güçlü çeken şeyin ne olduğunu merak ediyoruz.\n\nHer damla gücümü toplayıp onu yüzeye çıkarmak için elimden geleni yapıyorum ve işte o... Şok güçlü bir dalga gibi üzerime çökerken elim içgüdüsel olarak ağzıma kapanıyor. [fish_courtier.GetFirstNameNoTooltip]ye gizlice bir bakış atıyorum ve soğukkanlılığımı korumaya çalışarak yeniden suya dönüyorum.\n\n"It's not a fish," [fish_courtier.GetFirstNameNoTooltip] says, [fish_courtier.GetHerHis] voice trembling, [fish_courtier.GetHerHis] eyes locked onto the macabre sight.\n\n"Not a fish," I echo after [fish_courtier.GetHerHim], my own shock mirroring [fish_courtier.GetHersHis]. It's a lifeless body, tangled in my fishing line, and [fish_courtier.GetFirstNameNoTooltip] and I stand there, our eyes fixated on the body..."

 agot_filler_riverlands.117.a:0 "Ne... Bu ne anlama geliyor?"

 agot_filler_riverlands.117.b:0 "Başka tarafa bak, [fish_courtier.GetFirstName]..."

 agot_filler_riverlands.118.t:0 "Belalı Orman"

 agot_filler_riverlands.118.desc:0 "Üzülerek söylüyorum ki, büyük haydut çeteleri Nehir Toprakları'nda yaygındı; ancak son zamanlarda sayılarının arttığı görülüyor.\n\n[marshal.GetName], bu ittifaklı haydut çetelerinden büyük bir kısmının [river_118_county.GetName]nin derin ormanlarına yerleştiğini bildiriyor. Artık savunmasız Nehir Topraklı köylerine pek az direnişle karşılaşarak dehşet saçıyorlar.\n\n[marshal.GetSheHe|U] bana ciddiyetle bakıyor: "What are we to do regarding these heinous bandits, my [ROOT.Char.GetLadyLord]?""

 agot_filler_riverlands.118.a:0 "Daha acil meseleler şu an itibarıyla dikkatimi gerektiriyor..."

 agot_filler_riverlands.118.b:0 "Haydutlarla savaşmak için yerel bir milis kurun."

 agot_filler_riverlands.118.c:0 "Ormanları terk etmeleri için haydutlara para ödeyin."

 agot_filler_riverlands.118.d:0 "Ormanı yakın! Fareler dışarı çıkacak!"

 agot_filler_riverlands.119.t:0 "Milis Başarılı"

 agot_filler_riverlands.119.desc:0 "[marshal.GetCouncilTitle|l]im yanıma geliyor; [marshal.GetHerHis] tavrı görünüşe göre düzelmiş. [marshal.GetSheHe] şimdi bana iyi haberlerle geliyor. "The militia that was sent out to deal with the bandit outlaws and their rabble have been successful." [marshal.GetSheHe] tells me with great delight.\n\n"They have left the forest, fleeing southward." [marshal.GetSheHe] finishes, and what good news that is."

 agot_filler_riverlands.119.a:0 "İçimi rahatlatan bir haber..."

 agot_filler_riverlands.120.t:0 "Çatışmalar Sürüyor"

 agot_filler_riverlands.120.desc:0 "[marshal.GetCouncilTitle|l]im, yenmeyi umduğum haydutlara dair haberlerle geri dönüyor; ne yazık ki duymak isteyeceğim türden değil.\n\nAyak takımıyla başa çıkması için gönderdiğim ordular, düşmanlarını alt etmeyi oldukça zor buluyor. Haydutlar, derin ormanda savunması güç küçük çatışmalarla saldırarak düzensiz savaş taktikleri kullanmaya devam ediyor.\n\nÇatışmaların uzun bir çıkmaza dönüşeceği anlaşıldığından, [marshal.GetCouncilTitle|l]im şimdi bana planladığımız operasyonlara devam edip etmeyeceğimizi soruyor."

 agot_filler_riverlands.120.a:0 "Operasyonlar devam etmeli."

 agot_filler_riverlands.120.b:0 "Bu meseleye daha fazla adam harcayamayız..."

 agot_filler_riverlands.120_tt.b:0 "Milisi dağıtıyorsunuz ve haydutların güçlenmesine izin veriyorsunuz."

 agot_filler_riverlands.121.t:0 "Milis Yenildi"

 agot_filler_riverlands.121.desc:0 "[marshal.GetCouncilTitle|l]im yanıma geliyor; [marshal.GetHerHis|l] yüzünde utanç ifadesi var. [marshal.GetSheHe], haydutları dağıtmak için tuttuğum milisin neredeyse tamamen yok edildiğine dair raporlar getiriyor. Birden fazla küçük çatışmada ve sürpriz saldırıda yakalandıktan sonra, kuvvetleri devede kulak bir sayıya inmiş.\n\nBu haber beni epey şoka uğratıyor; bu tür hırsızlar, becerileri ve ustalıkları konusunda yalan söylemedikçe bu kadar yetenekli bir kuvveti aşmamalı.\n\n"How could you allow this to happen?" I demand of [marshal.GetHerHim] angrily, the only response I receive being a sheepish turn of [marshal.GetHerHis] face."

 agot_filler_riverlands.121.a:0 "Milisi komutanlarınıza emanet etmek bir hataydı..."

 agot_filler_riverlands.121.b:0 "Bu beceriksizliğinin bedelini ödeyeceksin [marshal.GetFirstName]!"

 agot_filler_riverlands.122.t:0 "Büyük Odun Yığını"

 agot_filler_riverlands.122.desc:0 "Bugün, dört gözle beklediğim haberi aldım: toprakları belalayan haydutlara ve suçlulara karşı operasyon başarıyla sonuçlandı.\n\nOrman, gerekli bir fedakârlık olarak saatlerce yandı. Bu eylem, ormanda yaşayan haydutların neredeyse tamamını kaçmaya zorladı. Gittikçe büyüyen alevlerden kaçanlar, kendilerini törensizce ve çok az çabayla haydutları biçen adamlarımla yüz yüze buldu.\n\nGerçekten büyük bir zafer."

 agot_filler_riverlands.122.a:0 "Bir sorun, bir çözüm."

 agot_filler_riverlands.123.t:0 "Uzun Zamandır Beklenen Başarı"

 agot_filler_riverlands.123.desc:0 "Yıllarca süren çatışma ve pusulardan sonra nihayet Nehir Toprakları'nı belalayan suç sorununun hafiflediğini söyleyebilirim. Bir zamanlar ormanı işgal eden haydutlar ve eşkıyalar, halkımın ve elbette benim memnuniyetime kovuldu.\n\nİyi haber büyük bir sürpriz oldu. Gerçekten çok hoş karşılanan bir haber; günümü ısıtıp aydınlattı. "

 agot_filler_riverlands.123.a:0 "Sonunda iyi bir haber!"
