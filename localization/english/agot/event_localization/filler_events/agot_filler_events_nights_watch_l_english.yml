### TODO NOT-IN-ST: agot_filler_nights_watch.0015.bear.offense [AGOT: I draw my sword and yell, charging towards the bushes. Taken aback, the other black brothers reluctantly give chase. I crash through the brush in a screaming, thrashing tangle, expecting the wolves to set upon me immediately, but instead I find myself alone in a clearing. Where are the wolves?\n\nThen I see the monster that has been haunting the Gift — not the direwolf that every one of my brothers secretly feared, not a wolf at all.\n\nThe bear is massive, its haunches larger and stronger than a charger's, its forepaws the size of bucklers. With a roar like a ship crashing against rocks, the beast charges me. Time freezes and I at last see the wolves circling the perimeter, waiting for the larger beast to end me.\n\nThe bear's jaws stretch wide as it lunges for me,]
