### TODO NOT-IN-ST: agot_filler_nights_watch.0017.desc [AGOT: The remnants of the hunting party that was sent to dispatch the wolf pack terrorizing the Gift limps home beaten and bloody. Some of my brothers have not returned from the Gift at all, and I feel their loss as a stab in my gut. These wolves, it seems, are no ordinary pack. When at last one of my brothers is calm enough to give a coherent account of what happened, he speaks of a hulking beast with yellow eyes and black fur. They were ambushed, he says, and barely escaped the encounter with their lives.\n\nWhat has the Night's Watch come to? We are charged to protect the realms of men, but we cannot even protect our neighbors from wild animals.]
 agot_filler_nights_watch.0017.desc:0 "The remnants of the hunting party that was sent to dispatch the wolf pack terrorizing the Gift limps home beaten and bloody. Some of my brothers have not returned from the Gift at all, and I feel their loss as a stab in my gut. These wolves, it seems, are no ordinary pack. When at last one of my brothers is calm enough to give a coherent account of what happened, he speaks of a hulking beast with yellow eyes and black fur. They were ambushed, he says, and barely escaped the encounter with their lives.\n\nWhat has the Night's Watch come to? We are charged to protect the realms of men, but we cannot even protect our neighbors from wild animals."
