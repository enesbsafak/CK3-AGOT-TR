l_english:

 nightswatch_arrived.title:0 "Yeni Bir Gece Nöbetçisi"

 nightswatch_arrived.desc:0 "[nightswatch_candidate.GetShortUIName|U], yeminli bir kardeş olarak Gece Nöbetçileri'ne katıldı."

 agot_filler_nights_watch.0001.message.t:0 "$c_eastwatchte Katır Kıtlığı"

 agot_filler_nights_watch.0001.message.tt:0 "Sur'da devriye için $c_eastwatchte eğitilen katırlar son zamanlarda kıt bulunuyor."

 agot_filler_nights_watch.0002.t:0 "Katır Kıtlığı"

 agot_filler_nights_watch.0002.opening:0 "[teller.Custom2('MyCharacterIntroduction', ROOT.Char)|U] önümde duruyor"

 agot_filler_nights_watch.0002.bold:0 "göğsüne vurarak."

 agot_filler_nights_watch.0002.anger:0 "söylenip köpürerek."

 agot_filler_nights_watch.0002.paranoia:0 "gözlerinde acımasız, sevgisiz bir bakışla."

 agot_filler_nights_watch.0002.fallback:0 "tam bir inanmazlıkla."

 agot_filler_nights_watch.0002.middle:0 "\n\n"[fallguy.Custom2('YourCharacterIntroduction', ROOT.Char)|U] is selling our mules," [teller.GetSheHe] says with disgust. "The herd we use for patrolling the wall has thinned this last year, so I took it upon myself to uncover the cause, and I am certain [fallguy.GetSheHe] is selling them. [fallguy.GetSheHe|U] could have made as much as two hundred gold dragons!""

 agot_filler_nights_watch.0002.special.less_than.learning:0 "\n\n[teller.GetFirstNameNoTooltip]'e baktığımda, [teller.GetSheHe]'nin çok bilgili olduğunu yüreğimden biliyorum ama"

 agot_filler_nights_watch.0002.special.less_than.stewardship:0 "\n\n[teller.GetSheHe|U] defterleri yeterince iyi yönetebilir, [teller.GetHerHim]'i süzerken düşünüyorum, ama [teller.GetSheHe] burada en iyisinin ne olduğunu gerçekten biliyor mu?"

 agot_filler_nights_watch.0002.special.less_than.learning.humble:0 "\n\n[teller.GetSheHe] bu kadar bilgiliyken [teller.GetTitledFirstName|U]'i tamamen görmezden gelemem ama"

 agot_filler_nights_watch.0002.special.less_than.stewardship.humble:0 "\n\nDefterleri yönetmede [teller.GetTitledFirstName] kadar iyi olmayabilirim ama"

 agot_filler_nights_watch.0002.special.greater_than.learning:0 "\n\nAma elbette, ben [teller.GetTitledFirstNameNoTooltip]'den daha bilgiliyim ve şunu biliyorum ki"

 agot_filler_nights_watch.0002.special.greater_than.stewardship:0 "\n\nYine de, [teller.GetHerHim]'e baktığımda, mali durumlar hakkında [teller.GetTitledFirstNameNoTooltip]'in asla bilemeyeceğinden daha fazlasını bildiğimin derinden farkındayım ve şunu biliyorum ki"

 agot_filler_nights_watch.0002.special.greater_than.learning.arrogant:0 "\n\n[teller.GetHerHim]'e bakıyorum; bu işlerden [teller.GetSheHe]'nin asla bilemeyeceğinden çok daha fazlasını bildiğimden emin bir halde, ve şunu biliyorum ki"

 agot_filler_nights_watch.0002.special.greater_than.stewardship.arrogant:0 "\n\nOna bakıyorum; mali durumlarımız hakkında bu [teller.Custom('InsultNoun')] [teller.GetWomanMan]'den daha fazlasını bildiğimden emin bir halde, ve biliyorum ki"

 agot_filler_nights_watch.0002.special.stupid:0 "[fallguy.GetTitledFirstNameNoTooltip] böyle bir düzeni yönetemeyecek kadar aptal."

 agot_filler_nights_watch.0002.special.cowardly:0 "[fallguy.GetTitledFirstNameNoTooltip] böyle bir düzen için fazla korkak."

 agot_filler_nights_watch.0002.special.fallback:0 "[fallguy.GetTitledFirstNameNoTooltip]'in böyle bir düzeni yönetmesi çok olası değil."

 agot_filler_nights_watch.0002.special.closing:0 "Katırlarımızı satmaktan kâr edenin [undercutter.GetTitledFirstName] olması çok daha olası."

 agot_filler_nights_watch.0002.a.greedy:0 "[undercutter.GetTitledFirstNameNoTooltip]'e düzenden sana da pay vermesini söyle"

 agot_filler_nights_watch.0002.a.fallback:0 "[undercutter.GetTitledFirstNameNoTooltip]'e çaldıklarını geri ödet"

 agot_filler_nights_watch.0002.a.random_1.desc:0 "[undercutter.GetTitledFirstNameNoTooltip] çaldıklarını geri ödüyor"

 agot_filler_nights_watch.0002.a.random_2.desc:0 "[undercutter.GetTitledFirstNameNoTooltip] Sur'dan kaçıyor"

 agot_filler_nights_watch.0002.a.message.t:0 "[undercutter.GetTitledFirstNameNoTooltip]'i İdam Ediyorsun"

 agot_filler_nights_watch.0002.b.banish:0 "[undercutter.GetTitledFirstNameNoTooltip]'i Nöbet'e karşı suçları için sürgün et"

 agot_filler_nights_watch.0002.b.execute:0 "[undercutter.GetTitledFirstNameNoTooltip]'i Nöbet'e karşı suçları için idam et"

 agot_filler_nights_watch.0002.c:0 "[fallguy.GetTitledFirstNameNoTooltip]'e çaldıklarını geri ödet"

 agot_filler_nights_watch.0002.c.random_1.desc:0 "[fallguy.GetTitledFirstNameNoTooltip] Sur'dan kaçıyor"

 agot_filler_nights_watch.0002.c.random_2.desc:0 "[fallguy.GetTitledFirstNameNoTooltip] çalmakla suçlandığını geri ödüyor"

 agot_filler_nights_watch.0002.c.toast.t:0 "[fallguy.GetTitledFirstName] Sur'dan Kaçıyor"

 agot_filler_nights_watch.0002.c.toast.tt:0 "[fallguy.GetTitledFirstNameNoTooltip], Nöbet'ten çalmakla suçlandıktan sonra [fallguy.GetHerHis] görevinden kaçtı"

 agot_filler_nights_watch.0002.c.random_2.tt:0 "[fallguy.GetSheHe] çalınanı geri ödemezse, [fallguy.GetHerHim]'i cezalandırmak için gerekçen olacak"

 agot_filler_nights_watch.0002.d.banish:0 "[fallguy.GetTitledFirstNameNoTooltip]'i Nöbet'e karşı suçları için sürgün et"

 agot_filler_nights_watch.0002.d.execute:0 "[fallguy.GetTitledFirstNameNoTooltip]'i Nöbet'e karşı suçları için idam et"

 agot_filler_nights_watch.0002.d.message.t:0 "[fallguy.GetTitledFirstName]'i İdam Ediyorsun"

 agot_filler_nights_watch.0002.e.arrogant:0 "$c_eastwatchte olup bitenleri senden daha iyi bilirim."

 agot_filler_nights_watch.0002.e.arbitrary:0 "Katırları pek umursamıyorum, [teller.GetFirstNameNoTooltip]"

 agot_filler_nights_watch.0002.e.just:0 "Bana şüpheden fazlasını getir, o zaman konuşuruz."

 agot_filler_nights_watch.0002.e.fallback:0 "Bu saçmalıkla mı rahatsız ediyorsun beni? Defol, [teller.GetFirstNameNoTooltip]."

 every_member_of_nights_watch:0 "Gece Nöbetçileri'nin her üyesi"

 every_close_relation:0 "İdam edilenin her yakın akrabası"

 agot_filler_nights_watch.0003.t:0 "Yeniden Yatırım"

 agot_filler_nights_watch.0003.desc:0 "[teller.Custom2('MyCharacterIntroduction', ROOT.Char)|U] beni meclis salonunda buluyor ve [teller.GetHerHis] öfkesini gizlemeye hiç çaba göstermiyor.\n\n"[undercutter.GetTitledFirstNamePossessive] düzeninden el koyduğun altın, Nöbet'e yeniden yatırılmalı." [teller.GetSheHe|U] elini kolunu sallayarak odada volta atıyor. "O altını alıkoyman hırsızlıkla eşdeğerdir, [ROOT.Char.GetLadyLord]. Onu Nöbet'e #EMP geri vermelisin#!.""

 agot_filler_nights_watch.0003.a.wrathful:0 "Zorundayım mı? #EMP Zorunda mıyım?#! Bu senden bir emir mi?"

 agot_filler_nights_watch.0003.a.calm:0 "Rahatıma geldiğinde, [teller.GetFirstNameNoTooltip], daha önce değil."

 agot_filler_nights_watch.0003.a.cynical:0 "Ve sana mı bırakayım? Hiç sanmam."

 agot_filler_nights_watch.0003.a.vengeful:0 "Yeter. Bir daha sözünü etme."

 agot_filler_nights_watch.0003.a.zealous:0 "Eski ve yeni tanrılar hakkı için, bırak onu."

 agot_filler_nights_watch.0003.a.fallback:0 "Altını kendine sakla"

 agot_filler_nights_watch.0003.a.cynical.tt:0 "Sözlerinin [teller.GetFirstNameNoTooltip]'i sahtekâr olarak gösterdiğine inanan her Gece Nöbetçisi, [teller.GetHerHim] ile #N 10#! [opinion|E] kaybeder"

 agot_filler_nights_watch.0003.a.tt:0 "Altını saklıyorsun"

 agot_filler_nights_watch.0003.b.impatient:0 "Evet, evet — öyleyse al onu."

 agot_filler_nights_watch.0003.b.content:0 "Evet, şey, vazgeçilecek çok fazla altın değil, değil mi?"

 agot_filler_nights_watch.0003.b.forgiving:0 "Ona, bana davrandığından daha nazik davranacağına güveniyorum."

 agot_filler_nights_watch.0003.b.fallback:0 "Altını Nöbet'e hediye et"

 agot_filler_nights_watch_0003_b_content:0 "Biraz fakir olan her vasal"

 agot_filler_nights_watch.0003.b.forgiving.tt:0 "[teller.GetTitledFirstName], sana karşı bu kadar kısa davrandığı için üzülüyor"

 agot_filler_nights_watch.0003.b.tt:0 "Altını Nöbet'e teslim ediyorsun"

 agot_filler_nights_watch.0004.t:0 "Bir Merhamet Yalvarışı"

 agot_filler_nights_watch.0004.opening:0 "[fallguy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] son zamanlarda benden kaçınmak için büyük çaba sarf ediyor. [fallguy.GetHerHis] başının üzerinde asılı duran borç devasa ama Nöbet'i dolandırma düzenindeki [fallguy.GetHerHis] payı için hak ettiğinden az değil. Günlerce [fallguy.GetSheHe] çevremde süzülüyor; nihayet bu sabah kahvaltı ederken beni görmeye cesaret ediyor.\n\n"[ROOT.Char.GetLadyLord]," diyor [fallguy.GetSheHe]"

 agot_filler_nights_watch.0004.humble:0 "yenilginin alçakgönüllülüğüyle, "borçlu olduğum şeyi ödeyemem. Sana yalvarıyorum — lütfen bu düzende hiçbir payım olmadığına inan! Merhamet göster, [ROOT.Char.GetLadyLord]."

 agot_filler_nights_watch.0004.vengeful:0 "kindarca, "seni bu düzende hiçbir payım olmadığına ikna edebilecek hiçbir şey söyleyemeyeceğimi biliyorum ama şunu da bil: borçlu olduğumu asla ödemeyeceğim."

 agot_filler_nights_watch.0004.diligent:0 "yeni bulunmuş bir kararlılıkla, "Bana ait olmayan bir borcu ödemem yönündeki taleplerin zalimce ve bu borcu ödemem yönündeki hükmünü geri almanı istiyorum."

 agot_filler_nights_watch.0004.lazy:0 "kayıtsızlıkla, "Lütfen, bu borcu ödetme bana. Adil değil."

 agot_filler_nights_watch.0004.impatient:0 "sinirli bir homurtuyla, "Bu borcu ödemem yönündeki talebin adaletsiz. Ben yanlış bir şey yapmadım ve bu saçma koşulları bana dayatmana izin vermeyeceğim."

 agot_filler_nights_watch.0004.shy:0 "sessizce, "Borcu ödeyemem. Lütfen beni bu borçtan kurtarmayı düşünür müsün? Adil olduğunu düşünmüyorum."

 agot_filler_nights_watch.0004.deceitful:0 "sinsi bir gülümsemeyle, "Beni bağışlama kararına saygı duyuyorum; böylece borcumu ödeyebilirim. Bu gerçekten senin bilgeliğini gösteriyor. Güneye yolculuk etmeme izin verirsen, borcun tamamını yalnızca bir iki haftada ödeyebilirim."

 agot_filler_nights_watch.0004.fallback:0 "Borçlu olduğum şeyi ödeyemem. Sana yalvarıyorum, lütfen bu düzende hiçbir payım olmadığına inan; söylediğin borcu ödeyecek altına asla sahip olamayacağım."

 agot_filler_nights_watch.0004.a.gold:0 "Buna gerek yok. Borcu tamamen unut."

 agot_filler_nights_watch.0004.a.fallback:0 "[fallguy.GetHerHim]'i borçtan kurtar"

 agot_filler_nights_watch.0004.a.tt:0 "[fallguy.GetTitledFirstNamePossessiveNoTooltip]'in, kâr için katır satarak çaldığı altını geri ödeme yükümlülüğünü affediyorsun"

 agot_filler_nights_watch.0004.b.vengeful:0 "Bana #EMP şimdi#! ödeyeceksin, [fallguy.GetTitledFirstNameNoTooltip]!"

 agot_filler_nights_watch.0004.b.deceitful:0 "Öyleyse git — ve acele et."

 agot_filler_nights_watch.0004.b.fallback:0 "[fallguy.GetSheHe]'nin bir şeyi #EMP derhal#! geri ödemesinde ısrar et!"

 agot_filler_nights_watch.0004.b.deceitful.tt:0 "[fallguy.GetTitledFirstNameNoTooltip], borcun ödemesini toplamak için Sur'dan geçici olarak ayrılacak"

 agot_filler_nights_watch.0006.message.t:0 "[teller.GetTitledFirstName] Hapsedildi"

 agot_filler_nights_watch.0006.message.tt:0 "[teller.GetTitledFirstName], bir anlaşmazlıkta [victim.GetTitledFirstName]'i öldürdü ve hapsedildi"

 agot_filler_nights_watch.0007.t:0 "[benefactor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"

 agot_filler_nights_watch.0007.desc:0 "Umarım bu mektup sizi iyi bulur. [fallguy.Custom2('RelationToMe', SCOPE.sC('benefactor'))]'imin size ve kardeşliğinize borçlu olduğunu anlıyorum. [fallguy.GetSheHe] masumiyetinde ısrar etse de, bu borcu [fallguy.GetHerHis] adına ödeyeceğim; karşılığında [fallguy.Custom2('RelationToMe', SCOPE.sC('benefactor'))]'imi artık rahatsız etmeyeceğinizi umuyorum.\n\nBu borcu ödemekte fazlasıyla adil davrandığım için — ki aksi halde bu borcu asla tahsil edemezdiniz — bir gün bana da bu iyiliği geri ödemenizi bekleyeceğim."

 agot_filler_nights_watch.0007.a:0 "Pekâlâ."

 agot_filler_nights_watch.0008.t.good:0 "[ROOT.Char.Custom2('AppropriateGreetingPositive', SCOPE.sC('fallguy'))]"

 agot_filler_nights_watch.0008.t.bad:0 "Hâlâ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'deki aptala"

 agot_filler_nights_watch.0008.desc.good:0 "Belki çoktan fark etmişsindir ama ben Sur'a geri dönmeyeceğim.\n\nAldatmaca için üzgünüm ama bana yüklediğin borca katlanamıyorum. Sana yemin ederim, eski ve yeni tanrılar hakkı için, Nöbet'ten çalmadım.\n\nBana inanmadığını biliyorum, bu yüzden adımı şerefsizlikten temizlemek için çalışacağım; bunu yapmak için ömrümün geri kalanını şerefsizce yaşamam gerekse bile."

 agot_filler_nights_watch.0008.desc.bad:0 "Bu haftalardır yokluğumu fark etmedin bile, değil mi? Beni asıl hayrete düşüren de bu şaşırtıcı beceriksizlik.\n\nHırsızlık suçlamalarını da, bana ait olmayan bir borcu ödemem için yaptığın talepleri de takdir etmedim; bu yüzden sana bildirmekten memnuniyet duyarım ki Sur'a dönmeyeceğim — ne şimdi, ne de asla.\n\nBir yıl sonra bir hendekte ölü yatıyor olabilirim, dünya şerefsiz adıma lanet okuyor olabilir; yine de böylesine akılsız bir lordun dizinin dibinde oturmaktan daha iyi bir kader olur."

 agot_filler_nights_watch.0008.a.good:0 "Öyle olsun."

 agot_filler_nights_watch.0008.a.bad:0 "Piç."

 agot_filler_nights_watch.0009.t:0 "Uyum Sorunu"

 agot_filler_nights_watch.0009.desc:0 "Bazen küçük lordlar olarak gelirler Nöbet'e ama çoğu zaman kırık çocuklar olarak. [troublemaker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] böyle bir çocuğun kaba, savruk halidir; eğitim ustalarına saygı göstermez ve sebepsiz yere kavga eder. Sonunda silah ustasını son sınıra kadar zorlayınca, önüme düşüyor.\n\n"Neden yeni kardeşlerinle bu kadar çabuk kavga ediyorsun?" diye hırlıyorum. "Kafeste olmayı mı tercih edersin, yoksa Sur'da mı?"\n\n"Evet," diyor yumuşakça. "İkinci bir şansı hak etmiyorum, yaptıklarımdan sonra. Ben bir kafesi ya da beni gömeceğin bir çukuru hak ediyorum.""

 agot_filler_nights_watch.0009.a:0 "Öyle olsun."

 agot_filler_nights_watch.0009.a.tt:0 "[troublemaker.GetTitledFirstName]'i idam ediyorsun"

 agot_filler_nights_watch.0009.b:0 "Bu senin hayatın, oğlum. Bununla barış ya da kendi lanet küreğini bul."

 agot_filler_nights_watch.0009.c:0 "Sur'dan önce yaşayan çocuk ile Sur'da yaşayan adam aynı değildir."

 agot_filler_nights_watch.0009.d:0 "Ona vuruyorum. "Pişmanlık seni Sur'da sıcak tutmaz."

 agot_filler_nights_watch.0009.e:0 "Yerini bulmasına yardımcı olmak için ona daha fazla sorumluluk sözü ver"

 agot_filler_nights_watch.0009.court_position.tt:0 "#i [troublemaker.GetTitledFirstNameNoTooltip] yakın gelecekte bir saray mevkii bekleyecek#!"

 agot_filler_nights_watch.0010.toast.t:0 "Daha Fazla Sorumluluk Verme Sözünü Bozdun"

 agot_filler_nights_watch.0011.t:0 "Sur'da Çömelmiş Adam"

 agot_filler_nights_watch.0011.opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|U] [councillor.GetFirstName], ayaklarıma zavallı görünümlü bir yaratık atıyor. "Bu, [derelict.GetNameNoTier] harabelerinde çömeliyordu," diyor [councillor.GetSheHe], ama konuşurken [councillor.GetHerHis] sözlerinde korku var. "[squatter_1.GetSheHe|U]... şeyler biliyor. Kimsenin bilmeye hakkı olmayan şeyler."\n\n"Bana barınak ver," diye hırıldıyor çömelmiş adam, "yoksa en karanlık düşüncelerini soyarım... gizli utançlarını ortaya dökerim."\n\n[councillor.GetTitledFirstNameNoTooltip] [squatter_1.GetHerHim]'i tekmeliyor ve [squatter_1.GetSheHe] sessizleşiyor. "[squatter_1.GetSheHe|U] normal değil, [ROOT.Char.GetLadyLord]. Onu asmalıyız."\n\nÇömelmiş adam, başparmağını [councillor.GetFirstNameNoTooltip]'e doğru sallıyor."

 agot_filler_nights_watch.0011.secret_murder:0 "Bu, [target.GetTitledFirstName]'i soğukkanlılıkla öldürdü,"

 agot_filler_nights_watch.0011.secret_murder_attempt:0 "Bu, [target.GetTitledFirstName]'i soğukkanlılıkla öldürecek,"

 agot_filler_nights_watch.0011.secret_cannibal:0 "Bu, insan eti yiyor,"

 agot_filler_nights_watch.0011.secret_lover:0 "Bu, [target.GetTitledFirstName]'i sevgili olarak alıyor,"

 agot_filler_nights_watch.0011.secret_incest:0 "Bu, yatağını [target.GetTitledFirstName] ile sık sık paylaşıyor,"

 agot_filler_nights_watch.0011.secret_sodomite:0 "Bu, kendi cinsinden birini yatağına alıyor,"

 agot_filler_nights_watch.0011.secret_deviant:0 "Bu, sıra dışı zevklere meraklı,"

 agot_filler_nights_watch.0011.secret_heritage:0 "Bu, soyu pek de net değil,"

 agot_filler_nights_watch.0011.closing:0 "diyor [squatter_1.GetSheHe] ve [councillor.GetFirstNamePossessiveNoTooltip] yüzünden kan çekiliyor. "Ve sen... sen, [ROOT.Char.GetNameNoTooltip]... senin de henüz duyulmamış sırların var.""

 agot_filler_nights_watch.0011.a:0 "[squatter_1.GetHerHim]'e dinlenecek bir yer ver"

 agot_filler_nights_watch.0011.a.message.t:0 "Bir Düzen Ortaya Çıktı"

 agot_filler_nights_watch.0011.a.message.tt:0 "Minnettarlıkla, çömelmiş adam sana karşı bir [scheme.GetSchemeType.GetTypeNameNoTooltip] kurulduğunu açığa vuruyor"

 agot_filler_nights_watch.0011.b:0 "[squatter_1.GetHerHim]'i zindana at"

 agot_filler_nights_watch.0011.b.message.t:0 "Çömelmiş Adam Sırrını Açığa Vuruyor"

 agot_filler_nights_watch.0011.b.message.tt:0 "Çömelmiş adam götürülürken, #V [squatter_1.GetSheHe]#! [my_secret.GetName] sırrını herkese açıklıyor"

 agot_filler_nights_watch.0011.b.sadistic:0 "[squatter_1.GetHerHim]'i as"

 agot_filler_nights_watch.0011.c:0 "[squatter_1.GetSheHe] daha fazla sır açıklamadan [squatter_1.GetHerHis] dilini kes"

 agot_filler_nights_watch.0012.t:0 "Kurdun Gölgesi"

 agot_filler_nights_watch.0012.opening:0 "Bir boz kurt sürüsü Hediye'de küçük halkı avlıyor ama gönderilen iki av partisi, tek bir kurt postuyla bile değil, [eaten.GetTitledFirstName] adındaki kötü yaralanmış bir kardeşle geri döndü. O günden beri adamlar huzursuz; şimdi nöbetçiler arasında sürüyü bir ulukurdun yönettiği söylentileri uçuşuyor.\n\n"Sur'un güneyinde mi?" diye homurdanıyor [goon.GetTitledFirstName] akşam yemeğinde adamlardan birine. "Sur'un güneyinde ulukurt falan yok. Bu daha sütten kesilmiş bir dişi. Tek kılıç darbesiyle yıkılacak, [joke.GetFirstNamePossessive] annesinin"

 agot_filler_nights_watch.0012.joke.lowborn:0 "Köstebek Kasabası'ndaki annesi.""

 agot_filler_nights_watch.0012.joke.fallback:0 "Köstebek Kasabası'ndaki kızlar.""

 agot_filler_nights_watch.0012.joke.response.new_speaker:0 "\n\n[joke.GetFirstNameNoTooltip], [goon.GetTitledFirstNameNoTooltip]'e dürtüyor: "Öyleyse sen neden öldürmüyorsun?""

 agot_filler_nights_watch.0012.joke.response.fallback:0 "\n\n[joke.GetFirstName], [goon.GetTitledFirstNameNoTooltip]'e dürtüyor: "Öyleyse sen neden öldürmüyorsun?""

 agot_filler_nights_watch.0012.closing:0 "\n\n"Well, I wouldn't want to steal the glory from [ROOT.Char.GetTitledFirstNameNoTooltip]," [goon.GetTitledFirstNameNoTooltip] says sheepishly. "[ROOT.Char.GetSheHe|U] should be the one to kill the wolf."

 agot_filler_nights_watch.0012.a.trusting:0 "Bunu halletmen için sana güveniyorum, [goon.GetFirstName]."

 agot_filler_nights_watch.0012.a.arrogant:0 "Asla şanımı çalamazsın, [goon.GetFirstName], ama denemeni şart koşuyorum."

 agot_filler_nights_watch.0012.a.arbitrary:0 "Madem [goon.GetFirstName] avın bu kadar basit olacağını düşünüyor, ona öncülük edecek."

 agot_filler_nights_watch.0012.a.cynical:0 "Hayır, lütfen, ne kadar kolay olduğunu bize göster, [goon.GetFirstName]"

 agot_filler_nights_watch.0012.a.fallback:0 "Bir sonraki ava öncülük etmesi için [goon.GetFirstName]'i gönder"

 agot_filler_nights_watch.0012.a.tt:0 "Kurt avına öncülük etmesi için [goon.GetTitledFirstName]'i gönderiyorsun"

 agot_filler_nights_watch.0012.b.arrogant:0 "Belki de onu avlayacak kadar yetenekli tek kişi benim."

 agot_filler_nights_watch.0012.b.impatient:0 "Kendim yapacağım, hemen şimdi."

 agot_filler_nights_watch.0012.b.brave:0 "Onu avlayacağım — gerekirse tek başıma."

 agot_filler_nights_watch.0012.b.paranoid:0 "Bunların kurt olduğundan bile emin değilim ama bunu kendim keşfedeceğim."

 agot_filler_nights_watch.0012.b.callous:0 "Halledileceğinden emin olmak için bile olsa, ben ilgileneceğim."

 agot_filler_nights_watch.0012.b.fallback:0 "Onlara bir sonraki avı senin yöneteceğini söyle"

 agot_filler_nights_watch.0012.b.tt:0 "Kurt avını kendin yöneteceksin"

 agot_filler_nights_watch.0013.message.great_success.t:0 "[goon.GetTitledFirstName] Kurdu Öldürdü"

 agot_filler_nights_watch.0013.message.great_success.tt:0 "Hediye'yi bela eden kurt sürüsünü yok etmeye gönderilen [goon.GetTitledFirstName], başarılı bir ava öncülük etti ve sürünün lideri öldürüldü; sürü yeniden vahşi doğaya dağıldı"

 agot_filler_nights_watch.0013.message.success.t:0 "[goon.GetTitledFirstName] Kurtları Geri Püskürttü"

 agot_filler_nights_watch.0013.message.success.tt:0 "Kurtlarla başa çıkması için gönderdiğin av partisi sürünün liderini öldüremedi ama sürü, Hediye'nin köylerinden ve hisarlarından uzaklaştırıldı"

 agot_filler_nights_watch.0014.t:0 "Kurdun Gölgesi"

 agot_filler_nights_watch.0014.opening.forgiving:0 "Av partileri ellerinden geleni yaptı ama yüzlerindeki korkuya bakılırsa, bu görevin bana düştüğünü biliyorum."

 agot_filler_nights_watch.0014.opening.arrogant:0 "Bu sorunu benden başka kim çözebilir?"

 agot_filler_nights_watch.0014.opening.brave:0 "Herhangi bir kurtla yüz yüze gelme düşüncesi bile ürkütücü ama Hediye halkını korumak için ne gerekiyorsa yapacağım."

 agot_filler_nights_watch.0014.opening.sadistic:0 "Ava çıkmaya hazırlanırken, aklımda tek şey canavarın leşini serip kafasını duvarıma asmak var."

 agot_filler_nights_watch.0014.opening.lustful:0 "Yedi Krallık'ta kimse, bu avdaki başarılarımı duyduğunda bana karşı koyamayacak."

 agot_filler_nights_watch.0014.opening.gluttonous:0 "Kurt en iyi etlerden değildir ama az önce öldürülen şeyin kalbini yemenin tatmin edici bir yanı var ve bunu canı gönülden istiyorum."

 agot_filler_nights_watch.0014.opening.impatient:0 "#EMP Başlasana,#! diye bağırmak istiyorum avluda toplanırken; adamlar kıymetli zamanlarını alıyorlar."

 agot_filler_nights_watch.0014.opening.hunter:0 "Bir kez daha avda olma düşüncesiyle kanım hızla atıyor ve yakında koleksiyonum için yeni bir ganimetim olacağını biliyorum."

 agot_filler_nights_watch.0014.opening.ambitious:0 "Ah, bu av hakkında anlatacakları hikâyeler. Beş yıl sonra adamların ateşin etrafında toplanıp bu sürüyü tek başıma nasıl avladığımı anlatmalarını duymak için sabırsızlanıyorum."

 agot_filler_nights_watch.0014.opening.fickle:0 "Belki de avı kendi ellerime almak bir hatadır ama bu görev için başka kim var?"

 agot_filler_nights_watch.0014.closing:0 "Şafaktan önce yola çıkıyoruz; partimiz bir düzineden fazla kara kardeşten oluşuyor. Sürünün izini kolayca buluyoruz ve birkaç gün sonra, belki de İlk İnsanların günlerinden beri el değmemiş bir orman parçasında kurtları köşeye sıkıştırıyoruz.\n\nYine de ormanın derinliklerine indikçe, [goon.Custom2('MyCharacterIntroduction', ROOT.Char)] sinirlerini kaybediyor gibi; çok geçmeden sızlanmaları ürkek ve korkak bir hal alıyor.\n\nAlacakaranlık çöküyor ve meşale ışığı yükseliyor; [goon.GetFirstNameNoTooltip] kolumu kavrıyor. "Gözlerini hissediyorum," diye fısıldıyor [goon.GetSheHe]. "Bizi avlıyorlar." Kuşlar ötüşüyor ve çevremizdeki derin ormanda, hissiz kırmızı gözlerin yanan lambaları bize bakıyor; ormanın kendisi bizim avcı mı yoksa av mı olduğumuzu tartıyormuşçasına bizi süzüyor."

 agot_filler_nights_watch.0014.a:0 "Adamlara savunulabilir bir düzen almalarını söyle"

 agot_filler_nights_watch.0014.a.tt:0 "#I Akıllı karakterleri kayırır#!"

 agot_filler_nights_watch.0014.b:0 "Yaratıkları korkutup kaçırmak için ormana dal"

 agot_filler_nights_watch.0014.b.tt:0 "#I Cesur karakterleri kayırır#!"

 agot_filler_nights_watch.0015.t:0 "Kurdun Gölgesi"

 agot_filler_nights_watch.0015.dire_wolf.defense:0 "Atları dinlendirip savunma mevzilerimizi alıyoruz. Karanlıkta kılıçlar çekiliyor, çelik meşale ışığında parlıyor. Dallar hışırdıyor. Çalılar sallanıyor. Kuşlar öyle yumuşak sessizleşiyor ki aramıza soğuk bir sessizlik sızıyor; derken acı dolu bir uluma yükseliyor ve karanlıkta eşi ona karşılık veriyor.\n\nKurtlar ormandan akıyor; dişler, pençeler ve boz kürkler, kaynayan boz bir deniz gibi çevremizde çalkalanıyor. Canavarların havlamalarının üzerinden [goon.GetTitledFirstName] acıyla haykırıyor. [goon.GetSheHe|U] karnının üzerinde yatıyor ve başında, kanla lekelenmiş burnu, kış kadar vahşi sarı gözleri olan canavarca, hırlayan bir ulukurt duruyor. Bakışları bana kilitleniyor ve nefretle çene şaklatarak üstüme atılıyor.\n\n"

 agot_filler_nights_watch.0015.dire_wolf.offense:0 "Kılıcımı çekip bağırarak çalılıklara doğru yükleniyorum. Şaşıran diğer kara kardeşler isteksizce peşime düşüyor. Ormandaki dolambaçlı bir boşluktan geçerken dallar çatırdıyor, kurtlar korkuyla sızlanıp kaçışıyor.\n\nSonra donup kalıyorum. Çalıları yararak geçtiğimde yolumda canavarca boyutlarda bir ulukurt duruyor; sıcak, pis nefesi yüzümde; önümde hırlayıp salyalar akıtıyor. Yerimde durunca zayıf bir adım geri çekiliyor ve korkusunu sezip üstüne atılıyorum. Hançer gibi keskin pençeleri bana doğru savruluyor ama"

 agot_filler_nights_watch.0015.grey_wolf.defense:0 "Atları dinlendirip savunma mevzilerimizi alıyoruz. Karanlıkta kılıçlar çekiliyor, çelik meşale ışığında parlıyor. Dallar hışırdıyor. Çalılar sallanıyor. Kuşlar öyle yumuşak sessizleşiyor ki aramıza soğuk bir sessizlik sızıyor; derken acı dolu bir uluma yükseliyor ve karanlıkta eşi ona karşılık veriyor.\n\nKurtlar ormandan akıyor; dişler, pençeler ve boz kürkler, kaynayan boz bir deniz gibi çevremizde çalkalanıyor. Canavarların havlamalarının üzerinden [goon.GetTitledFirstName] acıyla haykırıyor. [goon.GetSheHe|U] karnının üzerinde yatıyor ve başında, kanla lekelenmiş burnu, kış kadar vahşi sarı gözleri olan hırlayan bir boz kurt duruyor. Bakışları bana kilitleniyor ve nefretle çene şaklatarak üstüme atılıyor,"

 agot_filler_nights_watch.0015.grey_wolf.offense:0 "Kılıcımı çekip bağırarak çalılıklara doğru yükleniyorum. Şaşıran diğer kara kardeşler isteksizce peşime düşüyor. Ormandaki dolambaçlı bir boşluktan geçerken dallar çatırdıyor, kurtlar korkuyla sızlanıp kaçışıyor.\n\nDonup kalıyorum. Yolumda, meydan okurcasına hırlayıp salyalar akıtan devasa bir boz kurt duruyor. Yerimde durunca zayıf bir adım geri çekiliyor ve korkusunu sezip yeniden üstüne atılıyorum. Hançer gibi keskin pençeleri bana doğru savruluyor,"

 agot_filler_nights_watch.0015.success:0 "ama ben darbesini yan çizerek atlatıp kılıcımı canavarın boğazına saplıyorum. Havlayarak çırpınıyor ve önüme yığılıyor; diğer kurtlar kaçıp dağılıyor."

 agot_filler_nights_watch.0015.failure:0 "ve ben darbeyi engelleyemiyorum. Pençeler koluma takılıp beni yere savuruyor. Kan pelerinimi ıslatıyor; dünya çevremde dönüp dururken yüzümün yarısını koyu, siyah toprak kümeleri kaplıyor.\n\nCanavar hırlıyor"

 agot_filler_nights_watch.0015.failure.craven:0 "ve korkudan altıma kaçırıyorum."

 agot_filler_nights_watch.0015.failure.brave:0 "ve kalbim gök gürültüsü gibi atıyor. Bu benim sonum olmayacak."

 agot_filler_nights_watch.0015.failure.patient:0 "ve aklımdan ona yaklaşması için meydan okuyorum."

 agot_filler_nights_watch.0015.failure.callous:0 "ve bu olayların gelişimine gülümseyerek, kendi kendime sırıtıyorum."

 agot_filler_nights_watch.0015.failure.trusting:0 "ve kurtuluş için dua ediyorum."

 agot_filler_nights_watch.0015.failure.calm:0 "ve dönüp, kırpmayan gece gökyüzüne bakıyorum. Sonumuz bu mu?"

 agot_filler_nights_watch.0015.failure.fallback:0 "ve derin bir nefes alıp, gelecek olan için kendimi hazırlıyorum."

 agot_filler_nights_watch.0015.compassionate:0 "Zavallı canavar..."

 agot_filler_nights_watch.0015.calm:0 "Yaşadığım için şanslıyım."

 agot_filler_nights_watch.0015.deceitful:0 "Peki korktum mu? Bir an bile."

 agot_filler_nights_watch.0015.brave.dire_wolf:0 "Değerli bir düşman."

 agot_filler_nights_watch.0015.brave.grey_wolf:0 "Korktuğum canavarın yarısı bile değildi."

 agot_filler_nights_watch.0015.craven:0 "Bir daha asla böyle aptalca bir şey yapmayacağım"

 agot_filler_nights_watch.0015.wrathful:0 "Dokunulmazım!"

 agot_filler_nights_watch.0015.greedy:0 "Duvarda harika görünecek, değil mi?"

 agot_filler_nights_watch.0015.cynical:0 "Kaderlerimiz yer değiştirseydi [goon.GetFirstNameNoTooltip] beni kurtarır mıydı?"

 agot_filler_nights_watch.0015.impatient:0 "Şimdi şu lanet ormanlardan çıkalım."

 agot_filler_nights_watch.0015.ambitious:0 "[ROOT.Char.GetDynastyName] Hanesi!"

 agot_filler_nights_watch.0015.just:0 "Başka yok mu?"

 agot_filler_nights_watch.0015.vengeful:0 "Şanslı mıyım, iyi mi?"

 agot_filler_nights_watch.0015.zealous:0 "Ak Gezenler hepsini alsın!"

 agot_filler_nights_watch.0015.gregarious:0 "Hâlâ benimle misin, [goon.GetFirstNameNoTooltip]?"

 agot_filler_nights_watch.0015.lustful:0 "Ah, bu hikâyeyle dolduracağım yataklar."

 agot_filler_nights_watch.0015.gluttonous:0 "Kendin avladığın avdan daha iyi bir şey var mıdır?"

 agot_filler_nights_watch.0015.failure_1:0 "Bir hançer çek ve canın için savaş"

 agot_filler_nights_watch.0015.failure_2:0 "Ölü taklidi yap"

 agot_filler_nights_watch.0015.failure_3:0 "Kaderini kabul et"

 every_dedicated_black_brother_0015:0 "Kendi hanene sadakat göstermenden hoşlanmayan her Gece Nöbetçisi"

 agot_filler_nights_watch.0015.bear.offense:0 "Kılıcımı çekip bağırarak çalılıklara doğru yükleniyorum. Şaşıran diğer kara kardeşler isteksizce peşime düşüyor. Çığlıklar ve çırpınışlar içinde çalılığı yararak ilerliyorum; kurtların hemen üstüme çullanmasını bekliyorum ama kendimi bir açıklıkta yapayalnız buluyorum. Kurtlar nerede?\n\nSonra Hediye'yi kâbusuyla sarmalayan canavarı görüyorum — kardeşlerimin her birinin gizlice korktuğu ulukurt değil, hiç de kurt değil.\n\nAyı devasa; kalçaları bir savaş atınınkinden daha iri ve güçlü, ön patileri küçük kalkanlar kadar. Bir geminin kayalara çarpması gibi bir kükremeyle canavar üstüme atılıyor. Zaman donuyor ve sonunda çevrede daire çizen, büyük canavarın bana son vermesini bekleyen kurtları görüyorum.\n\nAyının çeneleri üstüme atılırken sonuna kadar açılıyor,"

 agot_filler_nights_watch.0015.bear.defense:0 "Atları dinlendirip savunma mevzilerimizi alıyoruz. Karanlıkta kılıçlar çekiliyor, çelik meşale ışığında parlıyor. Dallar hışırdıyor. Çalılar sallanıyor. Kuşlar öyle yumuşak sessizleşiyor ki aramıza soğuk bir sessizlik sızıyor; derken acı dolu bir uluma yükseliyor ve karanlıkta eşi ona karşılık veriyor.\n\nKurtlar ormandan akıyor; dişler, pençeler ve boz kürkler, kaynayan boz bir deniz gibi çevremizde çalkalanıyor. Canavarların havlamalarının üzerinden [goon.GetTitledFirstName] acıyla haykırıyor. [goon.GetSheHe|U] karnının üzerinde yatıyor ve başında, korktuğumuz ulukurt ya da herhangi bir kurt değil, canavarca boyutlarda bir ayı duruyor. Kana bulanmış geniş yüzünü bana çeviriyor, gözleri iri ve aç. Bu büyüklükte bir hayvanın hareket etmesi gereken hızın ötesinde, kendini üstüme atıyor,"

 agot_filler_nights_watch.0016.t:0 "YER TUTUCU"

 agot_filler_nights_watch.0016.desc:0 "YER TUTUCU"

 agot_filler_nights_watch.0016.a:0 "YER TUTUCU"

 agot_filler_nights_watch.0017.t:0 "Kurdun Gölgesi"

 agot_filler_nights_watch.0017.desc:0 "Hediye'yi terörize eden kurt sürüsünü yok etmek için gönderilen av partisinin kalan üyeleri, dövülmüş ve kanlar içinde sendeleyerek eve dönüyor. Kardeşlerimden bazıları Hediye'den hiç dönmedi ve kayıplarını mideme saplanan bir bıçak gibi hissediyorum. Görünüşe göre bu kurtlar sıradan bir sürü değil. Sonunda kardeşlerimden biri sakinleşip olanları tutarlı bir şekilde anlatabildiğinde, sarı gözlü ve siyah kürklü devasa bir yaratıktan bahsediyor. Pusuya düşürüldüklerini ve karşılaşmadan canlarını zor kurtardıklarını söylüyor.\n\nGece Nöbetçileri ne hale geldi? İnsan diyarlarını korumakla görevliyiz ama komşularımızı vahşi hayvanlardan bile koruyamıyoruz."

 agot_filler_nights_watch.0017.a:0 "Bu başarısızlık, Gece Nöbetçileri'nin iyi adına bir lekedir."
