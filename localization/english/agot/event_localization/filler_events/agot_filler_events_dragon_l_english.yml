### TODO NOT-IN-ST: agot_filler_dragon.0010.desc [AGOT: It does not take long before the next service is ready to attend. Myself and, naturally, my retainers gather ourselves and march our small party under moonlight before the dragon's lair.\n\nWe arrive to the peasants lining up to present their offerings; meat and cheese stacked on simple platters, all being placed on one large table. I even spy a live goat being staked to a post next to it!\n\n]
 agot_filler_dragon.0010.desc:0 "It does not take long before the next service is ready to attend. Myself and, naturally, my retainers gather ourselves and march our small party under moonlight before the dragon's lair.\n\nWe arrive to the peasants lining up to present their offerings; meat and cheese stacked on simple platters, all being placed on one large table. I even spy a live goat being staked to a post next to it!\n\n"Not long now!" I hear one of the men cry from the crowd.\n\n"The great [worshiped_dragon.GetFirstName] cometh!""
