### TODO NOT-IN-ST: agot_filler_dragon.0055.desc [AGOT: I look down at the planned route for tomorrow's hunt. It is a good route, and I am sure that I will be able to find some game. Still, it is never certain...\n\nSuddenly, a thought occurs. I have a dragon at my disposal, and yet I am still planning to hunt on foot. What is the point of that?\n\nI look at the map again and trace a second route. I should be planning a hunt from dragonback! I could cover so much more ground, use [dragon.GetFirstName] to flush out game, and I could even [dragon.GetFirstNameNoTooltip] catch up to game that I could never hope to chase on foot. We'd surely meet with success!\n\nYet...I do so enjoy the thrill of the chase.]
