### TODO NOT-IN-ST: agot_filler_dragon.0004.desc.burned [AGOT: A tragedy has been the talk of the court today.\n\nApparently, [dragon_investigating_child.GetFirstName] snuck out to the Dragonpit last night, somehow got past our guards, and came across the sleeping [visited_dragon.GetFirstName].\n\n[visited_dragon.GetFirstNameNoTooltip] did not take too kindly to this intrusion, and burned [dragon_investigating_child.GetFirstNameNoTooltip] for [dragon_investigating_child.GetHerHis] curiosity!\n\nThe reasons behind the late-night adventure have not been determined yet as [dragon_investigating_child.GetFirstNameNoTooltip] is still recovering from [dragon_investigating_child.GetHerHis] wounds, but the other children are being questioned.\n\nThe obvious failure of my security and the investigation to determine what happened aside, the largest question I'm being asked is what is to be done with [visited_dragon.GetFirstNameNoTooltip].]
 agot_filler_dragon.0004.desc.burned:0 "A tragedy has been the talk of the court today.\n\nApparently, [dragon_investigating_child.GetFirstName] snuck out to the Dragonpit last night, somehow got past our guards, and came across the sleeping [visited_dragon.GetFirstName].\n\n[visited_dragon.GetFirstNameNoTooltip] did not take too kindly to this intrusion, and burned [dragon_investigating_child.GetFirstNameNoTooltip] for [dragon_investigating_child.GetHerHis] curiosity!\n\nThe reasons behind the late-night adventure have not been determined yet as [dragon_investigating_child.GetFirstNameNoTooltip] is still recovering from [dragon_investigating_child.GetHerHis] wounds, but the other children are being questioned.\n\nThe obvious failure of my security and the investigation to determine what happened aside, the largest question I'm being asked is what is to be done with [visited_dragon.GetFirstNameNoTooltip]."
### TODO NOT-IN-ST: agot_filler_dragon.0004.desc.died [AGOT: A tragedy has been the talk of the court today.\n\nApparently, [dragon_investigating_child.GetFirstName] snuck out to the Dragonpit last night, somehow got past our guards, and came across the sleeping [visited_dragon.GetFirstName].\n\n[visited_dragon.GetFirstNameNoTooltip] did not take too kindly to this intrusion, and has killed [dragon_investigating_child.GetFirstNameNoTooltip] for [dragon_investigating_child.GetHerHis] curiosity!\n\nThe reasons behind the fatal adventure have not been determined yet as [dragon_investigating_child.GetFirstNameNoTooltip] cannot tell us and no others have come forward as part of it, but the other children are being questioned.\n\nThe obvious failure of my security and the investigation to determine what happened aside, the largest question I'm being asked is what is to be done with [visited_dragon.GetFirstName].]
 agot_filler_dragon.0004.desc.died:0 "A tragedy has been the talk of the court today.\n\nApparently, [dragon_investigating_child.GetFirstName] snuck out to the Dragonpit last night, somehow got past our guards, and came across the sleeping [visited_dragon.GetFirstName].\n\n[visited_dragon.GetFirstNameNoTooltip] did not take too kindly to this intrusion, and has killed [dragon_investigating_child.GetFirstNameNoTooltip] for [dragon_investigating_child.GetHerHis] curiosity!\n\nThe reasons behind the fatal adventure have not been determined yet as [dragon_investigating_child.GetFirstNameNoTooltip] cannot tell us and no others have come forward as part of it, but the other children are being questioned.\n\nThe obvious failure of my security and the investigation to determine what happened aside, the largest question I'm being asked is what is to be done with [visited_dragon.GetFirstName]."
