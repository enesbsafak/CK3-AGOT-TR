### TODO NOT-IN-ST: agot_filler_dragon.0085.desc [AGOT: I shall never forget those next moments as long as I live. [brave_knight.GetFirstName] charged at [dragon.GetFirstName], voice echoing across the hall, #italic sliding#! under the gout of flame that was to be [brave_knight.GetHerHis] doom. With a mighty swing, [brave_knight.GetFirstNameNoTooltip] struck [dragon.GetFirstNameNoTooltip] in the neck, again diving to avoid [dragon.Custom('GetDragonHerHis')] great body slamming into [brave_knight.GetFirstNamePossessiveNoTooltip] own.\n\nWhat happened next was a blur of motion, the two locked in the dance of death. What's clear though, is that final image of [brave_knight.GetFirstNameNoTooltip] standing atop the belly of [dragon.GetFirstNameNoTooltip], sword embedded in [dragon.Custom('GetDragonHerHis')] chest, a stunned crowd erupting into cheers and applause.\n\n[brave_knight.GetFirstNameNoTooltip] has, against all odds, #italic won#!.]
 agot_filler_dragon.0085.desc:0 "I shall never forget those next moments as long as I live. [brave_knight.GetFirstName] charged at [dragon.GetFirstName], voice echoing across the hall, #italic sliding#! under the gout of flame that was to be [brave_knight.GetHerHis] doom. With a mighty swing, [brave_knight.GetFirstNameNoTooltip] struck [dragon.GetFirstNameNoTooltip] in the neck, again diving to avoid [dragon.Custom('GetDragonHerHis')] great body slamming into [brave_knight.GetFirstNamePossessiveNoTooltip] own.\n\nWhat happened next was a blur of motion, the two locked in the dance of death. What's clear though, is that final image of [brave_knight.GetFirstNameNoTooltip] standing atop the belly of [dragon.GetFirstNameNoTooltip], sword embedded in [dragon.Custom('GetDragonHerHis')] chest, a stunned crowd erupting into cheers and applause.\n\n[brave_knight.GetFirstNameNoTooltip] has, against all odds, #italic won#!."
