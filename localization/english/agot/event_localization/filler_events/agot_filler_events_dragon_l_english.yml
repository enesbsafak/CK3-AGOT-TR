### TODO NOT-IN-ST: agot_filler_dragon.0009.desc [AGOT: Horrific news! We have drastically underestimated their zeal! Within hours of my men setting up their perimeter around [worshiped_dragon.GetFirstNamePossessive] lair, they were beset by hundreds of angry smallfolk!\n\nThe rabble tore my men to pieces, and I've now heard that one of them, some [peasant_leader.GetFirstName], actually managed to approach and tame the beast! If I peer out my window, I can already see [peasant_leader.GetSheHe] leading the mob right this way on dragonback!]
 agot_filler_dragon.0009.desc:0 "Horrific news! We have drastically underestimated their zeal! Within hours of my men setting up their perimeter around [worshiped_dragon.GetFirstNamePossessive] lair, they were beset by hundreds of angry smallfolk!\n\nThe rabble tore my men to pieces, and I've now heard that one of them, some [peasant_leader.GetFirstName], actually managed to approach and tame the beast! If I peer out my window, I can already see [peasant_leader.GetSheHe] leading the mob right this way on dragonback!"
