 agot_filler_dragon.0002.t:0 "The Storming of the Dragonpit"
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.intro [AGOT: Horrific news! The population of [dragonpit_location.GetNameNoTier], seemingly tired of [ROOT.Char.GetHouse.GetBaseName] rule, have attempted the insane! I am told that a massive mob, numbering in the thousands at least, has stormed the dragonpit!\n\nHundreds now lay dead, most from the dragons held within, and many more when the dome was brought down on top of them! The rubbled remains are now naught but a scene of blood and charred bones.]
 agot_filler_dragon.0002.desc.intro:0 "Horrific news! The population of [dragonpit_location.GetNameNoTier], seemingly tired of [ROOT.Char.GetHouse.GetBaseName] rule, have attempted the insane! I am told that a massive mob, numbering in the thousands at least, has stormed the dragonpit!\n\nHundreds now lay dead, most from the dragons held within, and many more when the dome was brought down on top of them! The rubbled remains are now naught but a scene of blood and charred bones. "
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.escaped_only [AGOT: Fortunately all the beasts housed therein have escaped without injury. I am told they are now roaming the countryside, and will take time and effort to gather once again.]
 agot_filler_dragon.0002.desc.escaped_only:0 "Fortunately all the beasts housed therein have escaped without injury. I am told they are now roaming the countryside, and will take time and effort to gather once again."
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.wounded_only [AGOT: Though some were wounded in the fighting, I am told that all housed therein have escaped. Apparently, they are now roaming the countryside, and will take time and effort to gather once again.]
 agot_filler_dragon.0002.desc.wounded_only:0 "Though some were wounded in the fighting, I am told that all housed therein have escaped. Apparently, they are now roaming the countryside, and will take time and effort to gather once again."
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.died_only [AGOT: Not a movement was seen from the rubble once the dome collapsed. My guards and servants alike tell me to hold out hope, but I fear that all the dragons housed within have perished, either due to some lucky fool in the mob, or the collapse itself.]
 agot_filler_dragon.0002.desc.died_only:0 "Not a movement was seen from the rubble once the dome collapsed. My guards and servants alike tell me to hold out hope, but I fear that all the dragons housed within have perished, either due to some lucky fool in the mob, or the collapse itself."
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.escaped_and_wounded [AGOT: Fortunately it seems that all of our dragons lived, though some seemed wounded as they flew away from the collapsed structure. However, it will take time and effort to rebuild the dragonpit, much less gather the dragons once again.]
 agot_filler_dragon.0002.desc.escaped_and_wounded:0 "Fortunately it seems that all of our dragons lived, though some seemed wounded as they flew away from the collapsed structure. However, it will take time and effort to rebuild the dragonpit, much less gather the dragons once again."
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.escaped_and_died [AGOT: Though fortunately, at least one seems to have escaped unharmed, flying away quickly as the pit was stormed, others seem to have not relented until the building itself fell around them. Those were either slain by the mad mob or crushed once the building collapsed.]
 agot_filler_dragon.0002.desc.escaped_and_died:0 "Though fortunately, at least one seems to have escaped unharmed, flying away quickly as the pit was stormed, others seem to have not relented until the building itself fell around them. Those were either slain by the mad mob or crushed once the building collapsed."
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.wounded_and_died [AGOT: Though some of our dragons seem to have escaped, all are either injured or dead. I'm told that corpses of man and dragon both still lay under tons of rock and rubble, and those that did escape the carnage will take time to heal from their injuries.]
 agot_filler_dragon.0002.desc.wounded_and_died:0 "Though some of our dragons seem to have escaped, all are either injured or dead. I'm told that corpses of man and dragon both still lay under tons of rock and rubble, and those that did escape the carnage will take time to heal from their injuries."
### TODO NOT-IN-ST: agot_filler_dragon.0002.desc.escaped_and_wounded_and_died [AGOT: It must have been a truly chaotic sight. I'm told that though some shapes were seen flying away, we have tragically lost some of our most prized assets. Those that did escape the carnage will take time to heal from their injuries and may be difficult to gather once again.]
 agot_filler_dragon.0002.desc.escaped_and_wounded_and_died:0 "It must have been a truly chaotic sight. I'm told that though some shapes were seen flying away, we have tragically lost some of our most prized assets. Those that did escape the carnage will take time to heal from their injuries and may be difficult to gather once again."
