### TODO NOT-IN-ST: agot_filler_dragon.0074.desc [AGOT: As I walk towards the council chamber I feel the sweat drip from my brow. My heart is racing, and I can feel the blood pounding in my ears. Is the effect of the [artifact.GetName] that I drank this morning?\n\nI have to stop to lean against the wall, hoping to catch my breath, but the heat I feel within my body will not abate. Pain spreads through my chest, and I think I hear a hissing sound. I am forced to my knees as concerned staff rush to my side.\n\nPain like I have never felt shoots through me, wiping all thought and ripping a scream from my chest! I look down and see my veins bulging, turning black and orange. Like fire! I can feel the heat, rising, tearing through me ripping my skin and flesh apart!]
