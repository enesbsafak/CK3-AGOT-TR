### TODO NOT-IN-ST: agot_filler_dragon.0006.desc [AGOT: I stare down at the ledgers in front of me and they do not paint a pretty picture. The debts I now face are considerable, and my financiers tell me that it will take a long time before we can be considered solvent again.\n\nAlongside the sheets of financial updates before me is a pamphlet; a mummer's show is taking place in [ROOT.Char.GetCapitalLocation.GetTitle.GetDefinitiveName] this week, but I am told that it is already fully booked. Such interest by the smallfolk! I can't imagine the troupe faces the difficulties I do now...\n\nAn idea forms in my head. I am the rider of [ROOT.Var('current_dragon').Char.GetFirstName], and I have been told to see us fly is a wondrous sight! Perhaps if I were to run a show, I'd be able to raise the same level of interest? While some might think such mummery is beneath a ruler and rider, my debt situation would certainly be alleviated.]
 agot_filler_dragon.0006.desc:0 "I stare down at the ledgers in front of me and they do not paint a pretty picture. The debts I now face are considerable, and my financiers tell me that it will take a long time before we can be considered solvent again.\n\nAlongside the sheets of financial updates before me is a pamphlet; a mummer's show is taking place in [ROOT.Char.GetCapitalLocation.GetTitle.GetDefinitiveName] this week, but I am told that it is already fully booked. Such interest by the smallfolk! I can't imagine the troupe faces the difficulties I do now...\n\nAn idea forms in my head. I am the rider of [ROOT.Var('current_dragon').Char.GetFirstName], and I have been told to see us fly is a wondrous sight! Perhaps if I were to run a show, I'd be able to raise the same level of interest? While some might think such mummery is beneath a ruler and rider, my debt situation would certainly be alleviated."
