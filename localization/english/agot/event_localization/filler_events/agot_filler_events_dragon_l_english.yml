### TODO NOT-IN-ST: agot_filler_dragon.0053.desc [AGOT: I feel the vibration through my hands as my blade meets the training dummy. Like a dance, I move through the forms, each strike and mock parry a step in the deadly ballet. I feel the sweat on my brow, and the ache in my muscles, I feel #emp alive#!.\n\nAs I finish my routine, proud of my work today, and look around the training yard at the men performing their own routines. They are slow. Clumsy. To my surprise I feel my pride evaporate.\n\nI look down at the hilt in my hand. What is the point of all this training if I am the only one who truly understands it? What's more, I have a dragon at my disposal. I may be a demon on the battlefield but on the back of [dragon.GetName] I am a god! I can't help but wonder why I even bother with this.]
