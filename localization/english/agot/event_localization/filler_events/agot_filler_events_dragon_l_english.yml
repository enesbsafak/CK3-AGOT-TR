﻿﻿l_english:

 agot_filler_dragon.0002.t:0 "Ejderha Çukurunun Baskını"

 agot_filler_dragon.0002.desc.intro:0 "Dehşet verici haber! [dragonpit_location.GetNameNoTier] halkı, görünüşe göre [ROOT.Char.GetHouse.GetBaseName] yönetiminden bıkmış, deliliği denedi! Bana söylenen, en az binlerce kişiden oluşan devasa bir kalabalığın ejderha çukuruna saldırdığı!\n\nYüzlerce kişi öldü; çoğu içeride tutulan ejderhalar yüzünden, kubbeyi tepelerine yıkıldığında ise çok daha fazlası! Geriye kalan enkaz yığını, artık bir kan ve kömürleşmiş kemik sahnesinden başka bir şey değil. "

 agot_filler_dragon.0002.desc.escaped_only:0 "Neyse ki içeride barınan tüm canavarlar yara almadan kaçmayı başardı. Bana söylenen, şu anda kırlarda dolaştıkları ve bir kez daha toplanmalarının zaman ve çaba gerektireceği."

 agot_filler_dragon.0002.desc.wounded_only:0 "Çatışmada kimileri yaralanmış olsa da, içeride barınan herkesin kaçmayı başardığı söyleniyor. Görünüşe göre şu anda kırlarda dolaşıyorlar ve bir kez daha toplanmaları zaman ve çaba gerektirecek."

 agot_filler_dragon.0002.desc.died_only:0 "Kubbe çöktükten sonra enkazdan hiçbir hareket görülmedi. Muhafızlarım ve hizmetkarlarım umudu elden bırakmamı söylüyor; ama korkarım içeride barınan tüm ejderhalar, ya kalabalıktaki şanslı bir ahmağın işi yüzünden ya da çöküşün kendisi yüzünden öldü."

 agot_filler_dragon.0002.desc.escaped_and_wounded:0 "Neyse ki ejderhalarımızın hepsi yaşıyor gibi görünüyor; ancak çökmüş yapıdan uçup giderken kimileri yaralı gibiydi. Yine de ejderha çukurunu yeniden inşa etmek zaman ve çaba gerektirecek; ejderhaları bir kez daha toplamak şöyle dursun."

 agot_filler_dragon.0002.desc.escaped_and_died:0 "Neyse ki en az biri, çukur basıldığında hızla uçup giderek yara almadan kaçmış görünüyor; diğerleri ise bina çevrelerine yıkılana dek direnmişe benziyor. Onlar ya çılgın kalabalık tarafından öldürüldü ya da bina çöktüğünde ezildi."

 agot_filler_dragon.0002.desc.wounded_and_died:0 "Ejderhalarımızdan bazıları kaçmış görünse de, hepsi ya yaralı ya da ölü. Bana söylenen, insan ve ejderha cesetlerinin hâlâ tonlarca kaya ve enkazın altında yattığı ve katliamdan kurtulanların yaralarının iyileşmesinin zaman alacağı."

 agot_filler_dragon.0002.desc.escaped_and_wounded_and_died:0 "Gerçekten kaotik bir manzara olmuş olmalı. Bana söylenen, bazı silüetlerin uçup giderken görüldüğü ama en değerli varlıklarımızdan bazılarını trajik biçimde kaybettiğimiz. Katliamdan kurtulanların yaralarının iyileşmesi zaman alacak ve bir kez daha toplanmaları zor olabilir."

 agot_filler_dragon.0002.desc.dragon_died:0 "\n\nHepsinden trajik olanı, kendi ejderham [right_dragon_head.GetName] öldürülenlerin arasında."

 agot_filler_dragon.0002.desc.dragon_wounded:0 "\n\nNeyse ki kendi ejderham [right_dragon_head.GetName] bu vahşetten sağ çıkmış görünüyor; ancak [right_dragon_head.Custom('GetDragonSheHe')] çatışmada yaralandı."

 agot_filler_dragon.0002.desc.dragon_alive:0 "\n\nNeyse ki kendi ejderham [right_dragon_head.GetName] bu vahşetten sağ çıkmış görünüyor; ancak [right_dragon_head.Custom('GetDragonSheHe')] bu deneyimden açıkça rahatsız olmuş durumda."

 agot_filler_dragon.0002.desc.end_fine:0 "\n\nBöyle bir saldırının yaratabileceği en kötü şeyi önlemeyi başarmış olsak da, güç tabanımıza yönelik bu kadar küstahça ve şiddetli bir saldırıya karşılık verilmelidir!"

 agot_filler_dragon.0002.desc.end_died:0 "\n\nEjderhalar [ROOT.Char.GetHouse.GetNameNoTooltip] gücünün temelini oluşturur ve en değerli varlıklarımıza verilen bu zararın hesabı sorulmalıdır!"

 agot_filler_dragon.0002.wounded_dragon_tt:0 "[wounded_dragon.GetName] yaralandı"

 agot_filler_dragon.0002.a:0 "[dragonpit_location.GetNameNoTier] halkı kan ve ateşle yüzleşecek!"

 agot_filler_dragon.0002.a.f:0 "Bu saldırıya karşı güç ve intikam gösterisi olarak misilleme cinayetleri işliyorsunuz."

 agot_filler_dragon.0002.b:0 "[dragonpit_location.GetNameNoTier] bugün yeterince ölüm gördü."

 agot_filler_dragon.0002.b.f:0 "Bu saldırıya yanıt vermeyeceksiniz."

 agot_filler_dragon.0004.t:0 "Merak İnsanı Öldürür..."

 agot_filler_dragon.0004.desc.burned:0 "Bugün sarayda herkesin ağzında bir trajedi var.\n\nGörünüşe göre [dragon_investigating_child.GetFirstName] dün gece Ejderha Çukuru'na gizlice girmiş, bir şekilde muhafızlarımızı atlatmış ve uyuyan [visited_dragon.GetFirstName] ile karşılaşmış.\n\n[visited_dragon.GetFirstNameNoTooltip] bu izinsiz girişi hiç de hoş karşılamamış ve [dragon_investigating_child.GetFirstNameNoTooltip]yi merakının bedelini ödeyerek yakmış!\n\nGece yarısı macerasının ardındaki nedenler henüz belirlenemedi; çünkü [dragon_investigating_child.GetFirstNameNoTooltip] hâlâ yaralarından iyileşiyor, ancak diğer çocuklar sorgulanıyor.\n\nGüvenliğimin bariz başarısızlığı ve ne olduğunu belirleme soruşturması bir kenara, bana sorulan en büyük soru [visited_dragon.GetFirstNameNoTooltip] ile ne yapılacağı."

 agot_filler_dragon.0004.desc.died:0 "Bugün sarayda herkesin ağzında bir trajedi var.\n\nGörünüşe göre [dragon_investigating_child.GetFirstName] dün gece Ejderha Çukuru'na gizlice girmiş, bir şekilde muhafızlarımızı atlatmış ve uyuyan [visited_dragon.GetFirstName] ile karşılaşmış.\n\n[visited_dragon.GetFirstNameNoTooltip] bu izinsiz girişi hiç de hoş karşılamamış ve [dragon_investigating_child.GetFirstNameNoTooltip]yi merakının bedelini ödeyerek öldürmüş!\n\nÖlümcül maceranın ardındaki nedenler henüz belirlenemedi; çünkü [dragon_investigating_child.GetFirstNameNoTooltip] bize anlatamaz ve başka hiç kimse de bunun bir parçası olduğunu açıklamadı, ancak diğer çocuklar sorgulanıyor.\n\nGüvenliğimin bariz başarısızlığı ve ne olduğunu belirleme soruşturması bir kenara, bana sorulan en büyük soru [visited_dragon.GetFirstName] ile ne yapılacağı."

 agot_filler_dragon.0004.a:0 "[visited_dragon.GetFirstNameNoTooltip] zincire vurulmalı."

 agot_filler_dragon.0004.b:0 "Bir çocukluk gezintisinden üzücü bir sonuç, ama ejderha ejderhadır."

 agot_filler_dragon.0004.b.f:0 "[visited_dragon.GetFirstNameNoTooltip]yi cezalandırmak için hiçbir şey yapmayacaksınız."

 agot_filler_dragon.0006.t:0 "Bir Soytarı Binicisi mi?"

 agot_filler_dragon.0006.desc:0 "Önümdeki defterlere bakıyorum ve hiç de iç açıcı bir tablo çizmiyorlar. Karşı karşıya olduğum borçlar epey kabarık ve mali işler sorumlularım bana, yeniden ödeme gücümüzün olduğu söylenebilmesi için uzun zaman gerekeceğini söylüyor.\n\nÖnümdeki mali raporların yanında bir broşür var; bu hafta [ROOT.Char.GetCapitalLocation.GetTitle.GetDefinitiveName]de bir soytarı gösterisi düzenlenecekmiş, ama bana söylenen, çoktan tamamen dolduğu. Halkın bu kadar ilgisi var! Kumpanyanın şu an benim yaşadığım zorluklarla karşı karşıya olduğunu hayal bile edemiyorum...\n\nAklımda bir fikir şekilleniyor. [ROOT.Var('current_dragon').Char.GetFirstName]nin binicisiyim ve bana söylenen, uçuşumuzu görmenin harikulade bir manzara olduğu! Belki bir gösteri düzenlersem aynı düzeyde ilgi uyandırabilirim? Kimileri böyle bir soytarılığı bir hükümdar ve biniciye yakıştırmasa da, borç durumum kesinlikle hafiflerdi."

 agot_filler_dragon.0006.a:0 "Altına canlı ejderha! Gelin, hepiniz gelin!"

 agot_filler_dragon.0006.a.f:0 "Bir bağış gösterisi düzenlemek için [ROOT.Var('current_dragon').Char.GetFirstNameNoTooltip]yi kullanacaksınız!"

 agot_filler_dragon.0006.b:0 "Bu davranış bana yakışmaz."

 agot_filler_dragon.0006.b.f:0 "Borcunuzu daha geleneksel bir biçimde ödeyeceksiniz."

 agot_filler_dragon.worshiping_rebels_title:0 "Ejderha Kültü"

 agot_filler_dragon.worshiping_rebels_army_name:0 "Ejderha Tapanları"

 agot_filler_dragon.0008.t:0 "Kanatlı Bir Kült"

 agot_filler_dragon.0008.desc:0 "[worshiped_dragon.GetFirstName] adlı ejderhanın [worshiping_county.GetName]de in kurduğu iyi bilinir. Zaman zaman tehlikeli olduğu ve tuhaf şikâyetlere yol açtığı olmuş olsa da, [worshiped_dragon.Custom('GetDragonSheHe')] halk için hayatın bir gerçeği hâline geldi. Ancak bugün yerel yöneticilerimden garip bir haber aldım.\n\nGörünüşe göre, [worshiped_dragon.GetFirstNameNoTooltip] gibi bir canavarla uğraşırken beklenen temkinliliğin aksine, yerel köylüler bu yaratığa #italic tapmaya#! başlamış! Bana söylenen, her hafta [worshiped_dragon.Custom('GetDragonHerHim')]e et biçiminde haraç getirdikleri; daha telaşlı raporlara göre ise canlı hayvan kurbanları bile ettikleri!\n\nHenüz ölüm bildirilmemiş olsa da, bu tür etkinliklerin tehlikeleri ortada."

 agot_filler_dragon.0008.a:0 "Köylülerin tuhaf gelenekleri vardır. Bu da onlardan biri."

 agot_filler_dragon.0008.a.f:0 "Halkı ezoterik inançlarıyla baş başa bırakacaksınız."

 agot_filler_dragon.0008.b:0 "Sapkınlık! Buna derhal son vermeliyiz!"

 agot_filler_dragon.0008.b.f:0 "Muhafızlarınız, bu kült üyelerinden hiçbirinin [worshiped_dragon.GetFirstNamePossessiveNoTooltip] inine yaklaşmamasını sağlamaya çalışacak."

 agot_filler_dragon.0008.c:0 "İlginç! Belki bir ayine katılmalıyım?"

 agot_filler_dragon.0008.c.f:0 "Bu... kültün bir sonraki ayinine katılmaya ilgi göstereceksiniz."

 agot_filler_dragon.0009.t:0 "Kült Üyesi Geliyor!"

 agot_filler_dragon.0009.desc:0 "Dehşet verici haber! Onların gayretini feci şekilde küçümsedik! Adamlarım [worshiped_dragon.GetFirstNamePossessive] ininin çevresinde çember kurar kurmaz, yüzlerce öfkeli halk tarafından kuşatıldı!\n\nAyak takımı adamlarımı paramparça etti ve şimdi duyduğuma göre içlerinden biri, bir [peasant_leader.GetFirstName], canavara yaklaşmayı ve onu evcilleştirmeyi başarmış! Penceremden baktığımda [peasant_leader.GetSheHe]nin ejderha sırtında kalabalığı tam buraya doğru yönlendirdiğini şimdiden görebiliyorum!"

 agot_filler_dragon.0009.a:0 "Çabuk adamlar! Silahlara!"

 agot_filler_dragon.0009.a.f:0 "Korkunç bir düşmanın sırtında olsalar da, orduları yalnızca köylü askerlerden ibaret. Ordunuzu başka yerde toplarsanız, belki onları yenebilirsiniz..."

 agot_filler_dragon.0010.t:0 "Ateşle Ayin"

 agot_filler_dragon.0010.desc:0 "Bir sonraki ayine katılmaya hazır hâle gelmemiz uzun sürmüyor. Kendim ve doğal olarak maiyetim hazırlanıyor ve küçük kafilemizle mehtap altında ejderhanın ininin önüne yürüyoruz.\n\nVardığımızda köylülerin adaklarını sunmak için sıraya girdiğini görüyoruz; basit tabaklara yığılmış et ve peynir, hepsi tek bir büyük masaya konuyor. Hatta yanındaki kazığa bağlanmış canlı bir keçi bile seçiyorum!\n\n"Not long now!" I hear one of the men cry from the crowd.\n\n"The great [worshiped_dragon.GetFirstName] cometh!""

 agot_filler_dragon.0010.a.wrathful:0 ""I've had enough of such nonsense! Guards! Kill them all!""

 agot_filler_dragon.0010.a.zealous:0 ""I've had enough of heresy! Guards! Kill them all!""

 agot_filler_dragon.0010.a.craven:0 ""This is far too dangerous! Guards! Kill them quickly!""

 agot_filler_dragon.0010.a.sadistic:0 "Harika bir gösteri yapmanın yolunu biliyor musun? #emp Katliam...#!"

 agot_filler_dragon.0010.a.f:0 "Adamlarınız halkı katledecek; umarız ejderha cesetleriyle doyar."

 agot_filler_dragon.0010.b:0 "Bu... ritüele katılmayacağım."

 agot_filler_dragon.0010.b.f:0 "Geri duracak ve ne olacağını yalnızca izleyeceksiniz."

 agot_filler_dragon.0010.c:0 "Katılmalı, kendi adağımı da eklemeliyim."

 agot_filler_dragon.0010.c.f:0 "Kendi adaklarınızı tabağa koymak için sıraya gireceksiniz."

 agot_filler_dragon.0011.t:0 "Ejderha Sonuçları..."

 agot_filler_dragon.0011.desc.massacre:0 "Bir katliamdı.\n\nDini coşkuyla, birayla ve tuhaf uygulamalarının kutsal saydığı her neyse onunla sarhoş olan köylüler, arkadan gelen saldırıyı fark bile etmedi. Zırhsız ve silahsız adamlar, savunma hattı oluşturamadan katledildi. Gösterdikleri cılız direniş ezildi. Adamlar öldü; kadınlar ve çocuklar ya aynı akıbete uğradı ya da evlerine kaçtı.\n\n[worshiped_dragon.GetFirstName] ziyafetin başına geldiğinde, [worshiped_dragon.Custom('GetDragonHerHim')]i basit etlerden çok daha fazlası bekliyordu. [worshiped_dragon.Custom('GetDragonSheHe')] cesetleri ejderha ateşiyle pişirdikten sonra bile, ziyafete [worshiped_dragon.Custom('GetDragonSheHe')]nin keyif alabileceğinden daha fazlası varmış gibi görünüyordu. Yarım düzine kadarını mideye indirdikten sonra [worshiped_dragon.Custom('GetDragonSheHe')] döndü ve [worshiped_dragon.Custom('GetDragonHerHis')] inine geri çekildi."

 agot_filler_dragon.0011.desc.watch_ate:0 "Maiyetim ve ben, [worshiped_dragon.GetFirstName]nün [worshiped_dragon.Custom('GetDragonHerHis')] ininden çıkmasını bekleyerek arkamıza yaslandık. Birkaç dakika hiçbir şey olmayacakmış gibi göründü; ama sonunda [worshiped_dragon.Custom('GetDragonSheHe')] yavaşça görüş alanına girdi.\n\nBu mesafeden bile, [worshiped_dragon.Custom('GetDragonHerHim')]e hiç bu kadar yakın olmamıştım. Pulların altında dalgalanan kaslar ve yaratığın saf büyüklüğü... ikisi de büyüleyiciydi.\n\nAncak görünüşe göre korkularım gerçekleşmedi. [worshiped_dragon.Custom('GetDragonSheHe')] daha önce defalarca yaptığı gibi, [worshiped_dragon.GetFirstNameNoTooltip] sakin sakin adaklara doğru yürüdü ve onları pişirmek için bir alev fışkırttıktan sonra ziyafete başladı."

 agot_filler_dragon.0011.desc.watch_attacked:0 "Bir ejderha tanrı olmayabilir; ama bu gece [worshiped_dragon.GetFirstName] tanrı olsa yeridir.\n\nÖnce sessizlik oldu, ardından kulakları yırtan bir kükreme. Kulaklarımızı kapatamadan, boğaz kükremesinin yerini alev kükremesi aldı. Dehşet içinde, gözlerimin önünde saniyeler içinde yirmi kadar köylünün yandığını izliyorum; erkekler, kadınlar ve çocuklar... hepsi alevler içinde. Kalabalık anında dağılıyor; dehşet çığlıkları kısa süreliğine ses manzarasına hükmediyor, ta ki yerini kanat çırpışları ve bir ejderha ateşi tufanı alana dek.\n\nEmri beklemeden adamlarımın beni kaçırmak için kaptığını hissediyorum; atlarımız eve doğru yollarını döverken, yanan insanlığın çığlıkları nal seslerimizi takip ediyor."

 agot_filler_dragon.0011.desc.participate_ate:0 "Öne çıkıp sıranın arkasına geçiyorum; bu tuhaf adağa saygılı kalmak istiyorum. Çevremdeki halk şaşırmış ama katılımımdan memnun görünüyor ve sırada saygılı bir mesafe bırakıyor. Sonunda sıra adağımı masaya koymaya geliyor. Öyle yapıyorum ve [worshiped_dragon.GetFirstName]den hâlâ bir iz yokken kalabalığın arasına geçiyorum.\n\nBir dakika geçiyor, sonra iki; son adak da masaya konuyor. Nihayet alçak bir gümbürtü duyuluyor ve [worshiped_dragon.GetFirstNameNoTooltip]nün devasa gövdesi adaklarımıza doğru yürüyor. Bu kadar yakınken, [worshiped_dragon.Custom('GetDragonHerHim')]e uzanıp dokunabilecekmişim gibi hissediyorum.\n\nSaygıyla eğiliyor, bu görkemli gösteriyi izlerken yavaşça geri çekiliyorum."

 agot_filler_dragon.0011.desc.participate_attacked:0 "Karar geciktiği için sıraya giren son katılımcı benim. Sıra yavaşça ilerlerken [worshiped_dragon.GetFirstName]yi her zamankinden daha yakından görme beklentisinin yükseldiğini hissediyorum.\n\nSonunda, adağımı diğerlerinin yanına koymak üzereyken alçak bir gümbürtü duyuluyor. Adımlar. Karanlıktan kocaman bir gölge beliriyor; kara karşıt duran şiddetli bir iç ateşin varlığını ele veren parlayan gözler. [worshiped_dragon.GetFirstNameNoTooltip]nün devasa gövdesi önümde yükselirken, diz çöküp payımı yalvarırcasına sunmaktan kendimi alamıyorum.\n\n[worshiped_dragon.GetFirstNameNoTooltip]nün gövdesinin [worshiped_dragon.Custom('GetDragonHerHis')] başını benim üzerimde yükselttiğini hissediyorum; ardından ejderha ateşinin kavurucu sıcağının arkamdaki seyircileri sardığını! Duyduğum son şey, çevremdeki halkın dehşet çığlıkları; başımı kaldırdığımda kocaman dişli bir çenenin üzerime indiğini görüyorum..."

 agot_filler_dragon.0011.a:0 "Ne kadar acımasız olsa da, bunun daha da yayılmadığı için şükretmeliyiz."

 agot_filler_dragon.0011.a.sadistic:0 "Ne #bold katliam#!! Bunu uzun süre hatırlayacağım."

 agot_filler_dragon.0011.a.f:0 "[worshiping_county.GetBaseName], bu işçilerin kaybından toparlanırken biraz daha az üretken olacak, ama daha uysal."

 agot_filler_dragon.0011.b:0 "Ne rahatlama!"

 agot_filler_dragon.0011.b.f:0 "Ritüeli bizzat gördükten sonra, bunun önemli bir zarara yol açmasının pek olası olmadığı konusunda daha emin hissediyorsunuz."

 agot_filler_dragon.0011.c:0 "Bir de katılsaydım!"

 agot_filler_dragon.0011.c.f:0 "Ejderha saldırısı, benzer bir kültün yakın zamanda oluşmasını engelleyecek."

 agot_filler_dragon.0011.d:0 "Ne görkemli bir deneyim! Belki yine gelirim."

 agot_filler_dragon.0011.d.f:0 "Katılımınız köylüler tarafından fark edildi ve takdir edildi."

 agot_filler_dragon.0011.e:0 "Ah hayır..."

 agot_filler_dragon.0011.e.f:0 "Bu gece ölen son kişi siz değilsiniz. Kült üyeleri ve maiyetiniz katlediliyor."

 agot_filler_dragon.0013.t:0 "Bir Ejderha Ziyafeti mi?"

 agot_filler_dragon.0013.desc:0 "Ismarladığım kişisel ziyafet muhteşem çıktı; önüme bulunabilecek en iyi yemekler ve şaraplar konuldu. Tam yemeğe başlayacakken [dragon.GetFirstName]yi düşünüyorum; yıllardır standart yemeklerle geçiniyor. Belki [dragon.Custom('GetDragonSheHe')] de böyle bir ziyafette teselli bulur?\n\n#italic Öğğ#!, ama böyle bir ziyafetin yeniden hazırlanması en az bir hafta alır!"

 agot_filler_dragon.0013.a:0 "Bu benim için yapıldı ve ben yiyeceğim!"

 agot_filler_dragon.0013.a.f:0 "Yemeğe başlıyor ve lezzetlerin tadını kendiniz çıkarıyorsunuz."

 agot_filler_dragon.0013.b:0 "[dragon.GetFirstNameNoTooltip] bir ödülü hak ediyor."

 agot_filler_dragon.0013.b.f:0 "Ziyafetin bunun yerine [dragon.GetFirstNameNoTooltip]ye götürülmesini emrediyorsunuz."

 agot_filler_dragon.0013.b.tt_gluttonous:0 "Ejderhanızın doymak bilmez doğası [dragon.Custom('GetDragonHerHis')] takdirini artırıyor."

 agot_filler_dragon.0013.b.tt_temperate:0 "Ejderhanızın ölçülü doğası [dragon.Custom('GetDragonHerHis')] takdirini azaltıyor."

 agot_filler_dragon.0013.b.tt:0 "Ejderhanız fazladan yemeği takdir ediyor."

 agot_filler_dragon.0015.t:0 "Hava Keşfi"

 agot_filler_dragon.0015.desc:0 "Dün gece [dragon.GetFirstName] ile yere doğru dönerken, gece gökyüzünde yankılanan oldukça #italic heyecanlı#! bir sesi duymazdan gelmeyi başaramadım. [court_lover.GetSheHe] tutkunun kucağında öylesine kaybolmuştu ki ne [court_lover.GetFirstName] ne de [court_lover_partner.GetFirstName] devasa kanat çırpışlarını duyabildi!\n\n[court_lover.GetSheHe]nün duyduğumu öğrenirse mahçup olacağından eminim; ama saraya gördüklerimi anlatmak zorunda hissediyorum!"

 agot_filler_dragon.0015.a:0 "Saraya [court_lover.GetFirstNamePossessiveNoTooltip] düşüncesizliğini anlatacağım!"

 agot_filler_dragon.0015.b:0 "Eminim [court_lover.GetFirstNameNoTooltip], benim çıkarlarım doğrultusunda davranmaya ikna edilebilir..."

 agot_filler_dragon.0015.c:0 "Bunu kendime saklayacağım."

 agot_filler_dragon.0017.t:0 "Bir Âlemin Sonuçları"

 agot_filler_dragon.0017.desc:0 "Zonklayan bir baş ağrısı ve tadı hela dibi gibi olan bir ağızla uyanıyorum. Dün geceden çok şey hatırlamıyorum; ama [courtier.GetFirstName] ile bolca şarap içtiğimizi hatırlıyorum. [courtier.GetHerHim]i benzer bir durumda bulmayı yarı yarıya bekliyorum; ama kapımdaki vuruş aksini kanıtlıyor.\n\n"Oh [ROOT.Char.GetTitledFirstNameNoTooltip], I am ever so excited!" [courtier.GetSheHe] exclaims. Apparently, last night I agreed to take [courtier.GetFirstNameNoTooltip] for a ride on [dragon.GetFirstName] today, and [courtier.GetSheHe] has been waiting for me to wake up ever since!\n\nI'm not sure I'm up for this..."

 agot_filler_dragon.0017.a:0 "Eminim [courtier.GetFirstNameNoTooltip] anlayacaktır."

 agot_filler_dragon.0017.a.f:0 "[courtier.GetFirstNameNoTooltip]ye iyi hissetmediğinizi ve yeniden planlamanız gerekeceğini söylüyorsunuz."

 agot_filler_dragon.0017.b:0 "Sıkıp katlanmak zorundayım."

 agot_filler_dragon.0017.b.f:0 "İçinde bulunduğunuz duruma rağmen [courtier.GetFirstNameNoTooltip]yi bir uçuşa çıkarıyorsunuz."

 agot_filler_dragon.0017.b.live:0 "İkinizin de keyifli bir uçuşu oluyor"

 agot_filler_dragon.0017.b.death:0 "İkiniz de akşamdan kalma halinizle düşüyorsunuz"

 agot_filler_dragon.0019.t:0 "Bir Ejderhanın Kamçısı"

 agot_filler_dragon.0019.desc:0 "Saatlerdir kendimi kırbaçlıyorum; ama acı beni tatmin etmiyor. Daha fazlasına, daha #italic yoğun#! bir şeye ihtiyacım var.\n\nElimde ne olduğunu düşünüyorum ve aklıma [dragon.GetFirstName] geliyor. Ejderha bir savaş canavarıdır; yine de... eminim [dragon.Custom('GetDragonHerHis')] yardımıyla umutsuzca arzuladığım acıyı hissedebilirim!"

 agot_filler_dragon.0019.a:0 "Ejderha ateşi nihai acı olurdu!"

 agot_filler_dragon.0019.a.f:0 "[dragon.GetFirstNameNoTooltip]ye sizi yakmasını emrediyorsunuz."

 agot_filler_dragon.0019.b:0 "O pençeler her zaman keskin görünmüştü..."

 agot_filler_dragon.0019.b.f:0 "[dragon.GetFirstNameNoTooltip]ye sırtınızı tırmalamasını emrediyorsunuz."

 agot_filler_dragon.0019.c:0 "Bu, benim için bile fazla ileri."

 agot_filler_dragon.0019.c.f:0 "[dragon.GetFirstNameNoTooltip]yi çarpık rahatlamanız için kullanmayacaksınız."

 agot_filler_dragon.0021.t:0 "Ejderha Taşımacılığıyla Para mı?"

 agot_filler_dragon.0021.desc:0 "Hesap durumum anlatılırken, bu kayıtlardan bazılarının büyüklüğü karşısında, sıradan bir köylünün geliriyle kıyaslayınca aklım duruyor. İmkânım oldukça, hatta olmadığı yerde bile bağış yapmayı alışkanlık edinmiş olsam da, daha fazlasını yapabileceğimi hissetmekten kendimi alamıyorum.\n\nNe yapabileceğimi düşünüyorum ve aklıma [dragon.GetFirstName] geliyor. [dragon.Custom('GetDragonSheHe')|U] kesinlikle bunları başkentte dağıtmak için kullanılabilir! Belki fakirlere doğrudan havadan altın bırakmalıyım?"

 agot_filler_dragon.0021.a:0 "O altını yükleyin!"

 agot_filler_dragon.0021.a.f:0 "[dragon.GetFirstNameNoTooltip]nün sırtından fakirlere para atacaksınız."

 agot_filler_dragon.0021.a.bad:0 "Paralar düşerken fakirleri yaralıyor"

 agot_filler_dragon.0021.a.good:0 "Böyle görkemli bir gösteri diyarın dilinde!"

 agot_filler_dragon.0021.b:0 "Bir kez daha düşününce, bu riskli görünüyor..."

 agot_filler_dragon.0021.b.f:0 "Servetinizi dağıtmak için [dragon.GetFirstNameNoTooltip]yi kullanmayacaksınız."

 agot_filler_dragon.0023.t:0 "Kıtlık Uçuşu"

 agot_filler_dragon.0023.desc:0 "Bugün her zamankinden bile düşük enerjiliyim. Zayıflamış gözlerimin ardında zonklayan bir baş ağrısı var. Kendimi daha iyi hissetmek için bir uçuş yapmak üzere [dragon.GetFirstName]ye bineceğim sırada, görüşümün karardığını ve bacaklarımın beni taşıyamadığını hissediyorum...\n\nYerde kendime geldiğimde gözlerimi açıyorum ve [dragon.GetFirstNameNoTooltip]nün şaşkınlıkla bana baktığını, maiyetimin yardımıma koştuğunu görüyorum.\n\nGörünüşe göre yemekten uzak durmam sonunda canımdan çıkıyor. Bu, düzgün yemeye yeniden başlamam için ihtiyacım olan uyandırma çağrısı mı?"

 agot_filler_dragon.0023.a:0 "Daha fazla yemeye çalışmalıyım."

 agot_filler_dragon.0023.a.f:0 "Bu yeme bozukluğunu yenmeye çalışıyorsunuz."

 agot_filler_dragon.0023.b:0 "Sadece... dinlenmeye ihtiyacım var..."

 agot_filler_dragon.0023.b.f:0 "Bunun yerine günü dinlenerek geçireceksiniz."

 agot_filler_dragon.0025.t:0 "Koca Bir Öfke"

 agot_filler_dragon.0025.desc:0 "Bugün berbat bir ruh hâlindeyim. Dünyanın bana karşı olduğunu hissetmekten kendimi alamıyorum. Herkesin peşimde olduğunu. Buna neyin yol açtığından emin değilim; ama [dragon.GetFirstName]nün güvenebileceğim tek kişi olduğunu hissetmekten kendimi alamıyorum.\n\n[dragon.GetFirstNameNoTooltip]ye binip gökyüzüne çıkıyorum; ama bu bile göğsümdeki uğultulu hoşnutsuzluğu dindirmiyor. Öfkemi bir şeyden, herhangi bir şeyden çıkarmam gerektiğini hissediyorum! Ufkun hemen ötesinde [target_county.GetName]i görüyorum.\n\n#italic Bu olur...#!"

 agot_filler_dragon.0025.a:0 "Hepsini yak [dragon.GetFirstNameNoTooltip]!"

 agot_filler_dragon.0025.a.f:0 "[dragon.GetFirstNameNoTooltip]ye kontluğu yakmasını emrediyorsunuz."

 agot_filler_dragon.0025.b:0 "Hayır, bu yanlış!"

 agot_filler_dragon.0025.b.f:0 "Karanlık dürtülerinize direneceksiniz."

 agot_filler_dragon.0027.t:0 "Görkemli Bir Biniş!"

 agot_filler_dragon.0027.desc:0 "[dragon.GetFirstName]ye binmek üzereyken aşağı bakıp tozlu zemini ve maiyetimin saygılı ama gösterişsiz selamlarını görüyorum. Bundan daha iyisini yapabiliriz!\n\nBinerken üzerinde yürüyeceğim görkemli bir halı, gelişimi duyuracak bir fanfar ve gökyüzüne yükselirken beni izleyecek büyük bir alay! Eminim tüm saray böyle bir gösteriyi takdir eder!"

 agot_filler_dragon.0027.a:0 "Büyük bir alay düzenleteceğim!"

 agot_filler_dragon.0027.a.tt:0 "#V Ejderhana Bin#! kararını her aldığınızda 100 [prestige_i] [prestige|E] kazanacaksınız"

 agot_filler_dragon.0027.b:0 "Pöh! Çok pahalı!"

 agot_filler_dragon.0029.t:0 "Yastık Uçuşu"

 agot_filler_dragon.0029.desc:0 "Bugün oldukça #italic aşk dolu#! bir ruh hâliyle uyandım ve böyle bir ruh hâlinde yapmaya alışkın olduğum üzere, şehrin daha az vicdanlı kısımlarında satılık güzel bedenlerden biriyle buluşuyorum.\n\nNeşelenirken bu güzellerden biri, bir [prostitute_character.GetFirstName], bir ejderha binicisi olarak maceralarımı duymuş olduğundan [dragon.GetFirstName]yi gündeme getiriyor.\n\n[prostitute_character.GetSheHe|U] yanaşıp o kayışları nasıl kullanacağına dair bazı... #italic ilginç#! fikirler fısıldıyor ve hemen şimdi gökyüzüne çıkmak istiyor!"

 agot_filler_dragon.0029.a:0 "Ah #emp kesinlikle evet#!!"

 agot_filler_dragon.0029.a.f:0 "[prostitute_character.GetFirstNameNoTooltip]yi bir #italic uçuşa#! çıkaracaksınız."

 agot_filler_dragon.0029.a.good:0 "Gerçekten unutulmaz bir deneyim yaşıyorsunuz!"

 agot_filler_dragon.0029.a.bad:0 "Emniyet kayışlarını öyle mi kullanıyorsun?! Ne düşünüyordun?!"

 agot_filler_dragon.0029.b:0 "Şimdi ne yapmak istiyorsun?!"

 agot_filler_dragon.0029.b.f:0 "Bu züppe sürtüğe, [prostitute_character.GetHerHis] fikri hakkında ne düşündüğünüzü aynen söylüyorsunuz."

 agot_filler_dragon.0031.t:0 "İnden Çıkmak mı?"

 agot_filler_dragon.0031.desc:0 "[dragon.GetFirstName] ile olması gerektiği kadar vakit geçirmediğimi biliyorum; ama [dragon.Custom('GetDragonSheHe')]nin, benim gibi, [dragon.Custom('GetDragonHerHis')] kendi alanında daha iyi olduğunu hissetmekten kendimi alamıyorum. Bugün [dragon.Custom('GetDragonHerHim')]i görmeyi başaracağımı sanmıştım; ama odamdan çıkma fikrine hiç dayanamıyorum.\n\nBelki de bu eğlence amaçlı binicilik işinden vazgeçmeliyim. Odam ile [dragon.GetFirstNameNoTooltip] arasında her zaman o kadar çok insan var ki... Buna değmeyebilir."

 agot_filler_dragon.0031.a:0 "Artık [dragon.GetFirstNameNoTooltip]ye binmeyeceğim."

 agot_filler_dragon.0031.a.tt:0 "Eğlence amaçlı binicilikten tamamen vazgeçiyorsunuz ve #V Ejderhana Bin#! kararını alamayacaksınız."

 agot_filler_dragon.0031.b:0 "Hayır, çok uzun zaman oldu. [dragon.GetFirstNameNoTooltip]yi görmeliyim!"

 agot_filler_dragon.0031.b.tt:0 "#V Ejderhana Bin#! kararını normal şekilde alabileceksiniz."

 agot_filler_dragon.0033.t:0 "Ejderhayla Yarışmak"

 agot_filler_dragon.0033.desc:0 "Avluda sabah koşularımdan birini yeni bitiriyorum ki yanımdan bir kuş uçup geçiyor; yakındaki bir duvarın tepesine süzülürken hızımı hiç zorlanmadan geride bırakıyor. Yaratığın zahmetsiz zarafeti karşısında biraz kıskançlık hissetmekten kendimi alamıyorum ve aklım [dragon.GetFirstName]ye dönüyor.\n\nEjderha uçuşunun hızı elbette rakipsiz; ama [dragon.GetFirstNameNoTooltip]nün karada nasıl bir performans sergileyeceğini merak ediyorum? Birlikte koşmak ikimize de iyi gelebilir! Belki düzenli olarak birlikte koşabiliriz bile?"

 agot_filler_dragon.0033.a:0 "Yarışı ayarlayacağım!"

 agot_filler_dragon.0033.a.good:0 "[dragon.GetFirstNameNoTooltip] bu etkinlikten keyif alıyor gibi görünüyor"

 agot_filler_dragon.0033.a.bad:0 "Ne kadar uğraşsanız da [dragon.GetFirstNameNoTooltip]yi koşturamıyorsunuz"

 agot_filler_dragon.0033.b:0 "Koşan ejderha mı? Ne saçma bir fikir!"

 agot_filler_dragon.0035.t:0 "Bir Ejderhanın Kulağı"

 agot_filler_dragon.0035.desc:0 "Son zamanlarda oldukça moralsiz hissediyorum ve nedenini bilmiyorum. Biriyle konuşmam gerektiğini hissediyorum; ama kime güvenebileceğimden emin değilim. Şaşırtıcı şekilde [dragon.GetFirstName]ye yaklaştığımda, [dragon.Custom('GetDragonHerHim')] ile konuşmaya mecbur hissediyorum.\n\n[dragon.Custom('GetDragonSheHe')] anlamayacak olsa da, belki yine de yardımcı olur ve [dragon.Custom('GetDragonHerHim')]nin beni yargılamasından endişelenmeme gerek kalmaz."

 agot_filler_dragon.0035.a:0 "[dragon.GetFirstNameNoTooltip]den daha güvenilir bir sırdaş kim olabilir?"

 agot_filler_dragon.0035.a.good:0 "[dragon.GetFirstNameNoTooltip] ile konuştuktan sonra kendinizi daha iyi hissediyorsunuz"

 agot_filler_dragon.0035.a.bad:0 "[dragon.GetFirstNameNoTooltip] ile konuşurken görülüyorsunuz ve bu yüzden biraz yargılanıyorsunuz"

 agot_filler_dragon.0035.b:0 "Bir hayvanla mı konuşmak? Hayır, kesinlikle olmaz."

 agot_filler_dragon.0037.t:0 "Gökyüzünden İlham"

 agot_filler_dragon.0037.desc:0 "Günlük tutmaya bayılıyorum ve bir süredir tutuyorum. Düşüncelerimi düzenli tutmama ve hayatımın izini sürmeme yardımcı olduğunu görüyorum.\n\nYine de [dragon.GetFirstName] ile son uçuşumdan sonra, kendimi her zamankinden daha ilhamlı buluyorum. Sözcükler sayfada akıyor; havadan bir şehrin ilham dolu bir betimlemesi.\n\nFarkına varmadan el yazmamı önceki uçuşumuzun hikâyesiyle dolduruyorum ve her zamankinden daha iyi hissediyorum."

 agot_filler_dragon.0037.a:0 "Ne ilham! Yakında tekrar binmeliyim!"

 agot_filler_dragon.0037.a.f:0 "Kayıtlarınız, [dragon.GetFirstNameNoTooltip] ile uçma deneyimlerinizden sonra yeni bir hayat buluyor."

 agot_filler_dragon.0039.t:0 "Burunlar ve Kokular"

 agot_filler_dragon.0039.desc:0 "[dragon.Custom('GetDragonHerHim')]e binmek üzereyken [dragon.GetFirstName]nün burnunun etrafında yürüyorum ve [dragon.Custom('GetDragonHerHis')] burun deliklerinin açıldığını görüyorum. Saniyeler içinde [dragon.Custom('GetDragonSheHe')] geri çekiliyor ve benim bu kadar yakın olmamdan açıkça rahatsız.\n\nHijyenim en iyisi olmayabilir; ama bir ejderhayı rahatsız edecek kadar kötü olamaz, değil mi?"

 agot_filler_dragon.0039.a:0 "Belki de #italic yıkanmalıyım#!..."

 agot_filler_dragon.0039.a.f:0 "Hijyeninizi iyileştirmeye çalışacaksınız."

 agot_filler_dragon.0039.b:0 "Eminim [dragon.GetFirstNameNoTooltip] bunu atlatır."

 agot_filler_dragon.0039.b.f:0 "Alışkanlıklarınızı değiştirmeyeceksiniz."

 agot_filler_dragon.0041.t:0 "Sözlerin Kanatları"

 agot_filler_dragon.0041.desc:0 "Sağlığım yerinde, diyar barış içinde; yine de bazı vassallarım hâlâ mutsuz. Mutsuz vassallara sahip istikrarlı bir diyar, uzun süre istikrarlı kalmaz. Bu konuda ne yapacağımı düşünürken aklıma [dragon.GetFirstName] geliyor. Evet...\n\n"

 agot_filler_dragon.0041.desc.both:0 "Bir savaş canavarı olsa da, ejderha aynı zamanda büyük bir heybet sahibi bir yaratıktır. Eminim [flight_offer_vassal.GetName]yi [dragon.GetFirstNameNoTooltip]nün sırtında bir uçuşa çıkarırsam, [flight_offer_vassal.GetSheHe] sözlerimi dinlemeye daha istekli olur.\n\nElbette, daha az kabullenici veya daha alaycı bazı vassallar böyle bir davete yanıt vermez ya da kabul etmez. [threaten_offer_vassal.GetName], doğru şekilde uygulanırsa, bir güç gösterisine yanıt vermeye daha yatkındır."

 agot_filler_dragon.0041.desc.flight:0 "Bir savaş canavarı olsa da, ejderha aynı zamanda büyük bir heybet sahibi bir yaratıktır. Eminim [flight_offer_vassal.GetName]yi [dragon.GetFirstNameNoTooltip]nün sırtında bir uçuşa çıkarırsam, [flight_offer_vassal.GetSheHe] sözlerimi dinlemeye daha istekli olur."

 agot_filler_dragon.0041.desc.threaten:0 "Daha az kabullenici veya daha alaycı bazı vassallarım, diplomasinin yalnızca en kaba yöntemlerini anlar. [threaten_offer_vassal.GetName], doğru şekilde uygulanırsa, bir güç gösterisine yanıt verebilir."

 agot_filler_dragon.0041.a:0 "[flight_offer_vassal.GetName]yi bir uçuşa çıkaracağım!"

 agot_filler_dragon.0041.a.f:0 "[flight_offer_vassal.GetFirstNameNoTooltip], [dragon.GetFirstNameNoTooltip]nün sırtında keyifli vakit geçiriyor."

 agot_filler_dragon.0041.b:0 "[threaten_offer_vassal.GetName]yi öğle yemeğine davet edeceğim... [dragon.GetFirstNameNoTooltip] ile birlikte."

 agot_filler_dragon.0041.b.f:0 "[threaten_offer_vassal.GetFirstNameNoTooltip], [dragon.GetFirstNameNoTooltip] masanızın yanında hayvan leşleriyle ziyafet çekerken sizinle yemek yiyecek."

 agot_filler_dragon.0041.c:0 "Vassallarımla eski usul yöntemlerle ilgileneceğim."

 agot_filler_dragon.0043.t:0 "Savaşın Kanatları"

 agot_filler_dragon.0043.desc:0 "Diyar şu an barış içinde olabilir; ama bunun sonsuza dek sürmeyeceğini biliyorum. Böyle bir dünyada savaşın kapıma dayanması yalnızca bir zaman meselesi. Böyle bir ihtimal için hazırlıklı olmalıyım ve bence [dragon.GetFirstName] yardımcı olabilir.\n\nSavaşta bilgi her şeydir ve savaş geldiğinde onu toplamak için zamanımız olmayabilir. Bu sorunun önüne geçebilir, [dragon.GetFirstNameNoTooltip]yi çıkarıp diyarımın haritasını çıkarabilir ve gelecekteki çatışmalarımızda bize yardımcı olabilirim. Elbette, gerektiğinde savaştaki yeterliliğimizi garanti altına almak için [dragon.GetFirstNameNoTooltip] ile talime de odaklanabilirim."

 agot_filler_dragon.0043.a:0 "İkmal yolları, pusu noktaları, zayıf savunmalar... Hepsini bulacağız!"

 agot_filler_dragon.0043.a.f:0 "[dragon.GetFirstNameNoTooltip]yi çıkarıp diyarınızın haritasını çıkaracaksınız."

 agot_filler_dragon.0043.b:0 "[dragon.GetFirstNameNoTooltip]! Talim yapıyoruz!"

 agot_filler_dragon.0043.b.f:0 "[dragon.GetFirstNameNoTooltip] ile talim yapacaksınız."

 agot_filler_dragon.0045.t:0 "Zenginliğin Kanatları"

 agot_filler_dragon.0045.desc:0 "Barış ticaret çarkının yeterince dönmesini sağlasa da, onu yağlamak için her zaman daha fazlası yapılabilir. [dragon.GetFirstName]yi ve yakacak düşman olmayan bu zamanlarda [dragon.Custom('GetDragonSheHe')]nin nasıl daha üretken amaçlara yönlendirilebileceğini düşünüyorum.\n\nBelki de gelişim için arazi açmak amacıyla [dragon.Custom('GetDragonHerHis')] alevlerini kullanabilirim? Ya da kırsalı denetlemeyi alışkanlık edinip kaçakçılığı önleyerek tüccarlarımızın güvenliğini ve emniyetini sağlayabiliriz?"

 agot_filler_dragon.0045.a:0 "Daha fazla gelişim her zaman iyidir!"

 agot_filler_dragon.0045.a.f:0 "Gelişim için arazi açmak amacıyla [dragon.GetFirstNameNoTooltip]yi kullanacaksınız."

 agot_filler_dragon.0045.b:0 "Hiçbir haydut ya da kaçakçı bakışlarımızdan kaçamayacak!"

 agot_filler_dragon.0045.b.f:0 "Kırsalı denetlemek için [dragon.GetFirstNameNoTooltip]yi kullanacaksınız."

 agot_filler_dragon.0045.b.tt:0 "Başkentinizin iki kontluk çevresindeki her kontluk, 10 yıl boyunca [GetModifier('agot_patrolled_on_dragonback').GetNameWithTooltip] değiştiricisini alacak."

 agot_filler_dragon.0045.c:0 "Leşler gerçekten harika gübre olur..."

 agot_filler_dragon.0045.c.f:0 "Yakındaki hayvanların leşleriyle topraklarınızı gübrelemek için [dragon.GetFirstNameNoTooltip]yi kullanacaksınız."

 agot_filler_dragon.0045.d:0 "Ejderhalar gerçekten çok atık üretir!"

 agot_filler_dragon.0045.d.f:0 "Topraklarınızı gübrelemek için [dragon.GetFirstNamePossessiveNoTooltip] atıklarını kullanacaksınız."

 agot_filler_dragon.0047.t:0 "Fısıltıların Kanatları"

 agot_filler_dragon.0047.desc:0 "Her kavrayışlı saray mensubunun söyleyeceği gibi, barışçıl bir diyar barışçıl bir saray yaratmaz. Bir ejderha binicisi olarak pek çok dış tehditten korunuyorum; ama boynuna saplanan bir bıçak, ister savaş meydanında ister uykunda, ölümcüldür.\n\nBu yüzden böyle zamanlarda sır ağımı örmek son derece önemlidir. Etkisi doğrudan olmasa da, çevremdekilerden bazı sırları sızdırmak için [dragon.GetFirstName]yi kesinlikle kullanabilirim.\n\nSorun şu: kimden?"

 agot_filler_dragon.0047.a:0 "[prisoner.GetName] merhametime muhtaç; [prisoner.GetSheHe] bilmek istediğimi söyleyecek!"

 agot_filler_dragon.0047.a.f:0 "[prisoner.GetFirstNameNoTooltip]yi [dragon.GetFirstNameNoTooltip] ile tehdit ederseniz, sırlarını mutlaka dökecek."

 agot_filler_dragon.0047.a.tt:0 "#V [prisoner.GetTitledFirstNamePossessive]#! sırlarından birini öğreneceksiniz."

 agot_filler_dragon.0047.b:0 "Ailem [dragon.GetFirstNameNoTooltip]nün ne kadar ölümcül olabileceğini bilir..."

 agot_filler_dragon.0047.b.f:0 "[family_member.GetTitledFirstNameNoTooltip]yi [dragon.GetFirstNameNoTooltip] ile incelikle tehdit edeceksiniz."

 agot_filler_dragon.0047.b.tt:0 "#V [family_member.GetTitledFirstNamePossessive]#! sırlarından birini öğreneceksiniz."

 agot_filler_dragon.0047.c:0 "[vassal.GetTitledFirstName] son zamanlarda şüpheli görünüyor."

 agot_filler_dragon.0047.c.f:0 "[vassal.GetFirstNameNoTooltip], [dragon.GetNameNoTooltip] ile birkaç dakika geçirdikten sonra o kadar da güçlü iradeli değildir."

 agot_filler_dragon.0047.c.tt:0 "#V [vassal.GetTitledFirstNamePossessive]#! sırlarından birini öğreneceksiniz."

 agot_filler_dragon.0047.d:0 "[courtier.GetFirstName]yi daha önce ortalıkta sinsice dolaşırken görmüştüm."

 agot_filler_dragon.0047.d.f:0 "[courtier.GetFirstNameNoTooltip], [dragon.GetFirstNameNoTooltip] ile yüzleştirildiğinde mutlaka doğruyu söyleyecek."

 agot_filler_dragon.0047.d.tt:0 "#V [courtier.GetTitledFirstNamePossessive]#! sırlarından birini öğreneceksiniz."

 agot_filler_dragon.0047.e:0 "Bu tür bayağı tehditler hem [dragon.GetFirstNameNoTooltip]ye hem de bana yakışmaz."

 agot_filler_dragon.0047.e.f:0 "Sır sızdırmak için [dragon.GetFirstNameNoTooltip]yi kullanmayacaksınız."

 agot_filler_dragon.0047.toast.title:0 "Sır ortaya çıktı"

 agot_filler_dragon.0047.toast.desc:0 "[target.GetTitledFirstNamePossessive] [target_secret.GetName] sırrını keşfettiniz!"

 agot_filler_dragon.0049.t:0 "Bilgeliğin Kanatları"

 agot_filler_dragon.0049.desc:0 "Eğitimim tamamlanmış olsa da, her zaman daha fazlasını öğrenebileceğimi biliyorum. Bir ejderha binicisi olarak çağın en büyük gizemlerinden birine erişimim var. Belki bu barış zamanlarında [dragon.GetFirstName]yi daha bilimsel amaçlar için kullanabilirim?\n\n[investigate_culture.GetName] hakkında hikâyeler duydum; ancak onlar hakkında çok az şey biliyorum. Belki [dragon.GetFirstNameNoTooltip] ile kısa bir süreliğine oraya uçabilirim? Elbette ejderhaların kendileri de başlı başına bir çalışma alanıdır ve yakınlığım sayesinde bu alana kendi katkımı yapabilirim."

 agot_visiting_dragonrider_culture_acceptance:0 "Ejderha binicisi dostane niyetle ziyaret etti"

 agot_filler_dragon.0049.a:0 "Bu... [investigate_culture.GetCollectiveNounNoTooltip] ile buluşmak için uçacağım."

 agot_filler_dragon.0049.a.f:0 "Yollarını daha iyi öğrenmek için en yakın [investigate_culture.GetNameNoTooltip] kontluğuna uçacaksınız."

 agot_filler_dragon.0049.b:0 "[dragon.GetFirstNameNoTooltip]yi inceleyeceğim!"

 agot_filler_dragon.0049.b.f:0 "Diyarın ejderhaları daha iyi anlamasına yardımcı olmak için [dragon.GetFirstNameNoTooltip]yi inceleyeceksiniz."

 agot_filler_dragon.0051.t:0 "Parti Hayvanı"

 agot_filler_dragon.0051.desc:0 "Sıkıldım. Sıkıldım. Sıkıldım. Sıkıldım. #Emp SIKILDIM!#!\n\nNe yaparsam yapayım bu bıkkınlık duygusundan kurtulamıyorum. Süren ziyafetlerde ve balolarda teselli bulmayı denedim; ama yalnızca formaliteyi yerine getiriyormuşum gibi hissetmekten kendimi alamıyorum. Hepsi o kadar...#italic birbirinin aynısı#! ki.\n\nDaha fazlasına, daha #italic yeni#! bir şeye ihtiyacım var. Ne yapacağımı düşünürken aklıma [dragon.GetFirstName] geliyor. Elbette daha önce hiç kimse bir #emp ejderhayla#! parti yapmamıştır? Belki bu gece ziyafet salonunu canlandırmak için [dragon.GetFirstNameNoTooltip]yi kullanabilirim?"

 agot_filler_dragon.0051.a:0 "Bir ejderha partisi gibi bir parti hiç olmadı!"

 agot_filler_dragon.0051.a.f:0 "Sarayınızı, onur konuğu [dragon.GetFirstNameNoTooltip] ile bir ziyafete davet edeceksiniz!"

 agot_filler_dragon.0051.a.good:0 "Diyar böyle bir parti hiç görmedi!"

 agot_filler_dragon.0051.a.good.title:0 "Misafirler [dragon.GetFirstNameNoTooltip]den çok memnun!"

 agot_filler_dragon.0051.a.bad:0 "[dragon.GetFirstNameNoTooltip] gürültüden ve kaostan hoşlanmıyor ve kaçmak için çatıyı yarıyor"

 agot_filler_dragon.0051.a.bad.title:0 "[dragon.GetFirstNameNoTooltip] hiç eğlenmedi"

 agot_filler_dragon.0051.b:0 "Bu pek akıllıca görünmüyor..."

 agot_filler_dragon.0051.b.f:0 "[dragon.GetFirstNameNoTooltip]yi bir parti numarası olarak kullanmayacaksınız."

 agot_filler_dragon.0053.t:0 "Sallanmak mı, Süzülmek mi?"

 agot_filler_dragon.0053.desc:0 "Bıçağım talim mankenine değdiğinde ellerimdeki titreşimi hissediyorum. Bir dans gibi formların arasında hareket ediyorum; her vuruş ve sahte savuşma, ölümcül balede bir adım. Alnımdaki teri ve kaslarımdaki ağrıyı hissediyorum; kendimi #emp canlı#! hissediyorum.\n\nRutinimi bitirip bugünkü işimle gurur duyarak talim sahasında kendi rutinlerini yapan adamlara bakıyorum. Yavaşlar. Sakarlar. Şaşırtıcı şekilde gururumun buharlaştığını hissediyorum.\n\nElimdeki kabzaya bakıyorum. Gerçekten anlayan tek kişi bensem, tüm bu talimin anlamı ne? Üstelik emrimde bir ejderham var. Savaş meydanında bir iblis olabilirim; ama [dragon.GetName]nün sırtında bir tanrıyım! Bununla neden uğraştığımı merak etmekten kendimi alamıyorum."

 agot_filler_dragon.0053.a:0 "Bunun yerine tüm talimimi [dragon.GetFirstNameNoTooltip] ile yapacağım!"

 agot_filler_dragon.0053.b:0 "Hayır, kan dökme alıştırması dışında da talimin faydaları var."

 agot_filler_dragon.0053.b.f:0 "Eskiden olduğu gibi talime devam edeceksiniz."

 agot_filler_dragon.0053.c:0 "Neden ejderha sırtından kılıçla talim yapmıyorsun?"

 agot_filler_dragon.0053.c.f:0 "Yeni bir atlı savaş tarzı yaratmayı deneyerek, [dragon.GetFirstNameNoTooltip] ile binek olarak talim yapacaksınız."

 agot_filler_dragon.0053.c.good:0 "Taliminiz, sık sık işe yaramasa da verimli"

 agot_filler_dragon.0053.c.bad:0 "Taliminiz verimsiz ve oldukça aptal görünüyorsunuz"

 agot_filler_dragon.0055.t:0 "Pullar ve Deriler"

 agot_filler_dragon.0055.desc:0 "Yarınki av için planlanmış rotaya bakıyorum. İyi bir rota ve biraz av bulabileceğimden eminim. Yine de hiçbir zaman kesin değildir...\n\nAniden bir düşünce geliyor aklıma. Emrimde bir ejderham var; yine de hâlâ yaya avlanmayı planlıyorum. Bunun anlamı ne?\n\nHaritaya tekrar bakıp ikinci bir rota çiziyorum. Ejderha sırtından bir av planlamalıyım! Çok daha fazla alan kaplayabilir, avı ürkütmek için [dragon.GetFirstName]yi kullanabilir ve hatta yaya kovalama şansımın asla olmayacağı avlara [dragon.GetFirstNameNoTooltip] ile yetişebilirim. Kesinlikle başarılı oluruz!\n\nYine de... kovalamacanın heyecanını öyle çok seviyorum ki."

 agot_filler_dragon.0055.a:0 "Ejderha sırtından avlanacağız!"

 agot_filler_dragon.0055.a.f:0 "[dragon.GetFirstNameNoTooltip]nün sırtında başarılı olacağınız kesin ve baskı altında uçmaya daha çok alışacaksınız."

 agot_filler_dragon.0055.b:0 "Planlandığı gibi yaya avlanacağım."

 agot_filler_dragon.0055.b.f:0 "Sonuçta biraz #italic sportmenliğe aykırı#! görünüyor."

 agot_filler_dragon.0057.t:0 "Uyanık Bir Ejderha Rüyası"

 agot_filler_dragon.0057.desc:0 "Haftalardır bu ritüeli hazırlıyorum ve nihayet zamanı geldi. Gerekli bileşenleri topladım, alanı hazırladım ve hatta [dragon.GetFirstName]yi kıpırdamadan durdurmayı bile başardım!\n\nPanjurların kapatılmasını emrediyorum ve [dragon.GetFirstNameNoTooltip]nün önünde bağdaş kurup oturuyor; aramızdaki mumu yakıyorum. [dragon.Custom('GetDragonSheHe')|U] [dragon.Custom('GetDragonHerHis')] başını benimkiyle aynı hizaya indiriyor ve ben [dragon.Custom('GetDragonHerHis')] gözlerinin derinliklerine bakıyorum.\n\nMum bakışlarımızın arasında yanıyor. Bilgeliğimizin ötesinde bir bilgelik barındıran o gözlere bakıyorum. Aramızdaki silik bağ, hiç dile getirilmemiş ama her zaman var olan o bağı şimdi hissediyorum. Gerçek. Somut. Aramıza örülmüş. Dünyanın uzaklaştığını hissediyorum...\n\nBir rüyalar diyarındayım ve yalnız değilim. [dragon.GetFirstNameNoTooltip] ile birlikteyim. Birlikteyiz ve biz..."

 agot_filler_dragon.0057.a:0 "Bulutların arasında süzülüyoruz!"

 agot_filler_dragon.0057.a.f:0 "Bağ hızla solsa da, [dragon.GetFirstNameNoTooltip] ile her zamankinden daha uyumlu hissediyorsunuz."

 agot_filler_dragon.0057.b:0 "Düşmanlarımızı katlediyoruz!"

 agot_filler_dragon.0057.b.f:0 "Zihniniz savaş ve kan görüntüleriyle doluyor ve geleceğe daha hazır hissediyorsunuz. Bir şekilde [dragon.GetFirstNameNoTooltip]nün de bunu hissettiğini biliyorsunuz."

 agot_filler_dragon.0057.c:0 "Açık bir alanda uyuyoruz."

 agot_filler_dragon.0057.c.f:0 "Uzun zamandır olmadığınız kadar huzurlu hissediyorsunuz ve [dragon.GetFirstNameNoTooltip]nün önümüzdeki yıllarda da sizinle olacağını biliyorsunuz."

 agot_filler_dragon.0059.t:0 "Ejderha Soyu Üzerine İncelemeler"

 agot_filler_dragon.0059.desc:0 "Çalışma odama anatomi tasarımlarından oluşan yeni sayfalar teslim edildi. Kemik yapısı ile kişilik arasındaki ilişki, sıvıların dengesi ve genel sağlık. #EMP Pöh!#! Bunların hiçbiri benim için yeni değil. Ne zaman gerçekten özgün bir çalışma elime geçecek?\n\nBunu düşünürken aklıma [dragon.GetFirstName] geliyor. Yıllardır insan anatomisi üzerine çalışıyorum; ama Ejderha Soyu'nun doğasını anlama yolunda adım atmayı hiç düşünmedim bile. Belki incelemelerimi [dragon.GetFirstNameNoTooltip]ye odaklamak gerçekten özgün bir çalışma ortaya çıkarır?"

 agot_filler_dragon.0059.a:0 "Sadece incelemekle kalmayacağım, ilham dolu bir fikrim var!"

 agot_filler_dragon.0059.a.f:0 "Güçlü bir iksir yaratmak için taze organları ve kanı kullanmayı deneyerek, adamlarınıza [dragon.GetFirstNameNoTooltip]yi öldürmelerini emredeceksiniz."

 agot_filler_dragon.0059.b:0 "Gözlemlerimi, dünyayla paylaşılmak üzere Kale'ye göndereceğim."

 agot_filler_dragon.0059.c:0 "[dragon.GetFirstNameNoTooltip]yi daha yakından incelemeliyim!"

 agot_filler_dragon.0059.c.f:0 "[dragon.Custom('GetDragonHerHis')] doğasını daha iyi anlamaya çalışmak için [dragon.GetFirstNameNoTooltip]yi inceleyeceksiniz."

 agot_filler_dragon.0059.d:0 "Amacım insan bedenini anlamada mükemmellik. Özgünlük değil."

 agot_filler_dragon.0059.d.f:0 "Özgün olsun ya da olmasın, insan bedenini anlayışınızı mükemmelleştirmek amacıyla yeni anatomi tasarımı sayfalarını okuyacaksınız."

 agot_filler_dragon.0059.toast.t:0 "Yeni bir iksir"

 agot_filler_dragon.0061.t:0 "Performans Artırıcı Otlar"

 agot_filler_dragon.0061.desc:0 "Elimdeki otları eziyorum; karışan tentürlerin ve iksirlerin güçlü kokusu havayı dolduruyor. Bu partinin güçlü olacağını hissedebiliyorum ve sonuçları görmek için sabırsızlanıyorum. Elbette henüz bitmedi; çünkü çok az bitki uzmanının sahip olduğunu iddia edebileceği gizli bir malzemem var.\n\n#bold Ejderha.#!\n\nSoru, [dragon.GetFirstName]yi işimde kullanıp kullanmamam değil; [dragon.Custom('GetDragonHerHis')] özünü bir sonraki lapama nasıl katmayı düşünmem gerektiği."

 agot_filler_dragon.0061.a:0 "Ezilmiş bir pul, güç için!"

 agot_filler_dragon.0061.b:0 "Bir damla kan, erkeklik gücü için!"

 agot_filler_dragon.0061.c:0 "Bir pençe parçası, keskin bir zihin için!"

 agot_filler_dragon.0061.d:0 "Bir diş parçası, sivri dil için!"

 agot_filler_dragon.0061.e:0 "Bir damla dışkı, güçlü bir mide için!"

 agot_filler_dragon.0063.t:0 "Bir Ejderha İçin Bahçe"

 agot_filler_dragon.0063.desc:0 "Parmaklarımın altındaki toprağı ve sırtımdaki güneşi hissediyorum. Bir süredir bahçemle uğraşıyorum ve yaptığım işle gurur duyuyorum. Bugün burada yapılan işten pek çok bitki ve çiçek büyüyecek ve onların tam çiçek açmış hâllerini görmek için sabırsızlanıyorum.\n\nBahçeye bakarken biraz suçluluk hissetmekten kendimi alamıyorum. Ben burada bahçemle uğraşırken [dragon.GetFirstName] "

 agot_filler_dragon.0063.desc.dragonpit:0 "soğuk ve karanlık ejderha çukuruna hapsolmuş durumda.\n\n"

 agot_filler_dragon.0063.desc.else:0 "taşın üzerinde duruyor, görünürde hiç yeşillik yok.\n\n"

 agot_filler_dragon.0063.desc.end:0 "Acaba [dragon.GetFirstNameNoTooltip] için bir bahçe yaratabilir miyim diye düşünüyorum; böylece [dragon.Custom('GetDragonSheHe')] de benim gibi güneşin ve çiçeklerin tadını çıkarabileceği bir yere sahip olur?"

 agot_filler_dragon.0063.a:0 "[dragon.GetFirstNameNoTooltip] için bir bahçe yaratacağım!"

 agot_filler_dragon.0063.a.f:0 "[dragon.GetFirstNameNoTooltip] için bir bahçe yaratacaksınız; ama [dragon.Custom('GetDragonSheHe')]nin nasıl tepki vereceğini kim bilir?"

 agot_filler_dragon.0063.a.good:0 "Bahçe büyük bir başarı ve [dragon.GetFirstNameNoTooltip] bundan keyif alıyor gibi görünüyor"

 agot_filler_dragon.0063.a.good.tt:0 "[dragon.GetName] $add_temperament_5$ kazanacak"

 agot_filler_dragon.0063.a.good.toast.t:0 "Çiçekler alevi etkiler"

 agot_filler_dragon.0063.a.bad:0 "Bahçe bir başarısızlık ve [dragon.GetFirstNameNoTooltip] etkilenmemiş görünüyor"

 agot_filler_dragon.0063.a.bad.toast.t:0 "Ateşler çiçek değildir"

 agot_filler_dragon.0063.a.bad.toast.desc:0 "[dragon.GetFirstNameNoTooltip] bahçeden etkilenmedi."

 agot_filler_dragon.0063.b:0 "Benim dertleneceğim kendi bahçem var."

 agot_filler_dragon.0063.b.f:0 "[dragon.GetFirstNameNoTooltip] için bir bahçe yaratmayacaksınız."

 agot_filler_dragon.0065.t:0 "Saçma İksir Teklifi"

 agot_filler_dragon.0065.desc:0 ""Ah, [ROOT.Char.GetTitledFirstName]!" [proposing_courtier.GetFirstName] exclaims as I enter the courtroom. "I wish to tell you of my latest design. You see, have been working on a concoction, a truly powerful one." [proposing_courtier.GetSheHe] excitedly explains.\n\n"I would give it to your eminent self, of course. I live to serve. There is a slight...problem, however. I need your dragon....'s corpse." [proposing_courtier.GetSheHe] says, looking slightly nervous at my aghast expression.\n\n"I assure you my liege, i-i-it would be well worth the price!" [proposing_courtier.GetSheHe] stammers, clearly more nervous now that [proposing_courtier.GetHerHis] idea is out in the open."

 agot_filler_dragon.0065.a:0 "Tamamen delirdin mi sen?!"

 agot_filler_dragon.0065.a.f:0 "[proposing_courtier.GetFirstNameNoTooltip]nün isteğini acımasızca reddedeceksiniz."

 agot_filler_dragon.0065.b:0 "Muhafızlar, bu deliyi tutuklayın!"

 agot_filler_dragon.0065.b.f:0 "[proposing_courtier.GetFirstNameNoTooltip]yi saçma isteği için tutuklatacaksınız."

 agot_filler_dragon.0065.c:0 "Biliyor musun... pekâlâ!"

 agot_filler_dragon.0065.c.f:0 "[proposing_courtier.GetFirstNameNoTooltip]nün [dragon.GetFirstNameNoTooltip]yi öldürmesine ve [dragon.Custom('GetDragonHerHis')] cesedini iksirleri için kullanmasına izin vereceksiniz."

 agot_filler_dragon.0065.d:0 "Şimdi uzaklaşıyorum."

 agot_filler_dragon.0065.d.f:0 "Yolunuza devam edecek ve [proposing_courtier.GetFirstNameNoTooltip]nün bunu bir daha #italic asla#! gündeme getirmemesini umacaksınız."

 agot_filler_dragon.0066.t:0 "Diplomasi İksiri"

 agot_filler_dragon.0066.desc:0 "Sadık maiyetimin getirdiği diyar mektuplarının önünde oturuyorum. Çok önemli bir şey yok; ancak diplomasinin incelikleri yine de kendi elimle icra edilmeyi gerektiriyor.\n\nGarip biçimde, bugün sözcüklerin kalemimden daha önce hiç hissetmediğim bir zarafet ve rahatlıkla aktığını hissediyorum. En inatçı vassalların bile yüreğini etkileyebilecek bir mektup yazabilecekmişim gibi hissediyorum.\n\nOlan, daha önce içtiğim [artifact.GetName] olmalı. Her şeyi yapabilecekmişim gibi hissediyorum!"

 agot_filler_dragon.0066.a:0 "Hadi yazmaya başlayalım!"

 agot_filler_dragon.0067.t:0 "Tehlike İksiri"

 agot_filler_dragon.0067.desc:0 "En son birlik raporlarına, muhafız karakollarına ve devriye düzenlerine bakarak oturuyorum. Aniden, daha önce hiç görmediğim bir verimsizlik fark ediyorum. Küçük olabilir; ama yaşamla ölüm arasındaki fark olabilir.\n\nDüzeltme talimatlarımı parşömene yazarken, bunu daha önce nasıl gözden kaçırdığımı merak ediyorum. Daha önce içtiğim [artifact.GetName] olmalı!"

 agot_filler_dragon.0067.a:0 "Dikkat et dünya, işte geliyorum!"

 agot_filler_dragon.0068.t:0 "Görev İksiri"

 agot_filler_dragon.0068.desc:0 "Diyarın hesapları önüme serilmiş. Rakamlar, bakiyeler ve ticaret hareketi raporları. Bu pek de heyecanlı bir görev değil; yine de daha önce hiç hissetmediğim ani bir berraklık hissediyorum. Diyarın örüntülerini, ekonominin gelgitlerini ve en önemlisi nerede fark yaratabileceğimi görebiliyorum.\n\nDiyarı daha iyi bir yer yapabilecekmişim gibi hissediyorum ve yapacağımı biliyorum. Anlayışımdaki bu büyüme, daha önce içtiğim [artifact.GetName] sayesinde olmalı!"

 agot_filler_dragon.0068.a:0 "Diyarı daha iyi bir yer yapacağım!"

 agot_filler_dragon.0069.t:0 "Aldatma İksiri"

 agot_filler_dragon.0069.desc:0 "Sarayın söylentileri her zaman kararsız bir iştir. Kimin kime komplo kurduğuna, hangi paranın kimin cebine aktığına ve bir sonraki skandalın nereden çıkacağına dair en son dedikodular. Bugün ağım kafamda biraz daha kolay örülüyor gibi; yalanlar ve yarım gerçekler bana daha önce hiç hissetmediğim bir berraklıkla geliyor.\n\nZihnim, daha önce içtiğim [artifact.GetName] tarafından keskinleştiriliyor olmalı!"

 agot_filler_dragon.0069.a:0 "Artık taht oyununu gerçekten oynayabilirim!"

 agot_filler_dragon.0070.t:0 "Keşif İksiri"

 agot_filler_dragon.0070.desc:0 "Çalışma odamda, en son ciltler ve parşömenlerle çevrili oturuyorum. Diyarın bilgelerinin en son kuramlarını ve keşiflerini inceliyorum. Egzotik ve kadim incelemeler ile fiziksel ve mistik bilimlerdeki en son gelişmeler. Bugün hepsini anlayabilecekmişim gibi hissediyorum; aralarında daha önce hiç görmediğim bağlantıları görebiliyorum.\n\nDaha önce içtiğim [artifact.GetName] tarafından aydınlatılıyor olmalıyım!"

 agot_filler_dragon.0070.a:0 "Dünya artık bana daha net!"

 agot_filler_dragon.0071.t:0 "Hasar İksiri"

 agot_filler_dragon.0071.desc:0 "Gecenin ortasında, bedenim acıyla kıvranarak uyanıyorum. Yanıma dönüyorum ve çarşafları lekeleyen kanı görüyorum. Bu nasıl oldu?! Sanki cildim... açıldı.\n\nİçmekte olduğum [artifact.GetName]in etkileri olabilir mi?"

 agot_filler_dragon.0071.a:0 "Bir hekime ihtiyacım var!"

 agot_filler_dragon.0072.t:0 "Teşhis İksiri"

 agot_filler_dragon.0072.desc.bad:0 "Gecenin ortasında, bedenim acıyla kıvranarak uyanıyorum. Yanıyormuşum gibi hissediyorum; içimden yükselen sıcaklık, bedenimden ter boşalmasına yol açıyor. Kalbimin hızla attığını ve nefesimin kesik kesik geldiğini hissedebiliyorum.\n\nBir an zehirden korkuyorum; ama yemeklerimin dün tümüyle test edildiğini biliyorum. Bu, daha önce içtiğim [artifact.GetName]in etkisi olabilir mi?"

 agot_filler_dragon.0072.desc.good:0 "Her zamanki saatimden daha erken uyanıyorum; dinç ve güne hazırım. Bir mil koşabilecekmişim gibi hissediyorum — hayatımın en iyi formundaymışım gibi!\n\nBu ani enerji patlamasının nedeni bilinmese de, içmekte olduğum [artifact.GetName]in etkisi olup olmadığını merak etmekten kendimi alamıyorum?"

 agot_filler_dragon.0072.a:0 "Ah bu acı!"

 agot_filler_dragon.0072.b:0 "Ne muhteşem bir etki!"

 agot_filler_dragon.0073.t:0 "Rüyalar İksiri"

 agot_filler_dragon.0073.desc.bad:0 "Yatakta uzanıyorum; zihnim düşünceler ve görüntülerle koşuyor. Uykuda ama uyanık, gözlerimin önünde dans eden görüntüler tarafından kıpırdamadan kilitlenmiş. Bedenime kilitlenmiş halde, hâlâ hisseden uzuvlarımdan kemiklerimin çekildiğini görüyorum. Kanım, hissiz bir iblis tarafından bir kâseye boşaltılıyor. Acıyı hissedebiliyorum; ama kıpırdayamıyorum, çığlık atamıyorum, izlemekten başka hiçbir şey yapamıyorum!\n\nSonunda yatakta doğruluyorum; soğuk ter, çarpan kalbimi kaplıyor. Bunlar normal rüyalar değildi. Neredeyse sanki ben... bu, [artifact.GetName]in etkisi mi?"

 agot_filler_dragon.0073.desc.good:0 "Yatakta uzanıyorum; zihnim düşünceler ve görüntülerle koşuyor. Uykuda ama uyanık, gözlerimin önünde dans eden görüntüler tarafından kıpırdamadan kilitlenmiş. Sakin mavi, siyah ve mor gökler. Altımdaki dünya, yeşil ve kahverengi bir dokuma. Yüzümde rüzgârı, sırtımda güneşi hissediyorum. Kanatlarımı açıp süzülüyorum; bir kuş kadar özgür, bir ejderha kadar özgür!\n\nSonunda yatakta doğruluyorum, yüzümde bir gülümseme. Bunlar normal rüyalar değildi. Neredeyse sanki ben... bu, [artifact.GetName]in etkisi mi?"

 agot_filler_dragon.0073.a:0 "Ne kabus!"

 agot_filler_dragon.0073.b:0 "Ne muhteşem bir rüya!"

 agot_filler_dragon.0074.t:0 "Ölüm İksiri"

 agot_filler_dragon.0074.desc:0 "Konsey odasına doğru yürürken alnımdan ter damladığını hissediyorum. Kalbim hızla çarpıyor ve kulaklarımda kanın vuruşunu hissedebiliyorum. Bu sabah içtiğim [artifact.GetName]in etkisi mi?\n\nNefesimi toplamayı umarak durup duvara yaslanmak zorunda kalıyorum; ama içimde hissettiğim sıcaklık dinmeyecek. Göğsüme acı yayılıyor ve bir tıslama sesi duyduğumu sanıyorum. Endişeli görevliler yanıma koşarken dizlerimin üzerine çökmek zorunda kalıyorum.\n\nHiç hissetmediğim bir acı içimden geçiyor, tüm düşünceleri silip göğsümden bir çığlık koparıyor! Aşağı baktığımda damarlarımın şiştiğini, siyah ve turuncuya döndüğünü görüyorum. Ateş gibi! Yükselen, içimden geçip derimi ve etimi parçalayan sıcağı hissedebiliyorum!"

 agot_filler_dragon.0074.a:0 "#bold AĞHHHHH!#!"

 agot_filler_dragon.0074.a.f:0 "Acı çığlıklarınız, yanmış parçalarınız odaya saçılmadan önce duyduğunuz son şeydir."

 agot_filler_dragon.0076.t:0 "Ejderhanızı Nasıl Gezdirirsiniz"
 agot_filler_dragon.0076.desc:0 "Bugün şaşırtıcı derecede güzel bir gün ve ilham dolu bir fikir, onun tadını çıkarmak için bir yol sundu. [pet_dragon.GetName]yi yürüyüşe çıkarmaya karar verdim! Dizgini elime aldığımda terbiyeciler bana garip baktı; ama en azından şaşkınlıkla bakmayacak kadar incelikliydi. Görünüşe göre bu tür bir nezaket, halkın kapasitesinin ötesinde.\\n\\nPazar meydanına vardığımızda herkes alışverişini tamamen bırakıyor! Zerrece terbiye yok! Bize bakıp da ne yapıyorlar ki? Sanki... bir şey mi bekliyorlar? Ah! Bir numara bekliyorlar! Aklımda tam da bir tane var: \"[pet_dragon.GetNameNoTooltip]...\""

 agot_filler_dragon.0076.injury_warning:0 "Yaralanabilirsiniz"

 agot_filler_dragon.0076.a:0 "\"Sit.\""

 agot_filler_dragon.0076.b:0 "\"Shake.\""

 agot_filler_dragon.0076.c:0 "\"Do a flip!\""
 agot_filler_dragon.0076.d:0 "#N \"YAKIN!\"#!"

 agot_filler_dragon.0076.d.tt:0 "#X Halk katliamınızdan memnun kalmayacak#!"

 agot_filler_dragon.0076.d.tt.vassals_warning:0 "#X Vassallarınız, özelliklerine bağlı olarak bundan hoşlanabilir ya da hoşlanmayabilir#!"

 agot_filler_dragon.0076.d.tt.courtiers_warning:0 "#X Saray mensuplarınız ve misafirleriniz, özelliklerine bağlı olarak bundan hoşlanabilir ya da hoşlanmayabilir#!"

 agot_filler_dragon.0076.e:0 "\"We're leaving!\""

 agot_filler_dragon.0076.success:0 "Başarı!"

 agot_filler_dragon.0076.success.sit:0 "[pet_dragon.GetNameNoTooltip] emrinizde oturuyor"

 agot_filler_dragon.0076.success.sat:0 "[pet_dragon.GetName], iyi bir [pet_dragon.Custom('DragonGirlBoy')] olduğu için oturdu"

 agot_filler_dragon.0076.success.shake:0 "[pet_dragon.GetNameNoTooltip] emrinizde el sallıyor"

 agot_filler_dragon.0076.success.shook:0 "[pet_dragon.GetName], iyi bir [pet_dragon.Custom('DragonGirlBoy')] olduğu için el salladı"

 agot_filler_dragon.0076.success.flip_past:0 "Siz ve [pet_dragon.GetNameNoTooltip] taklanızda başarılı oluyorsunuz"

 agot_filler_dragon.0076.success.flip:0 "Siz ve [pet_dragon.GetName] bir takla attınız! Çok etkileyiciydi!"

 agot_filler_dragon.0076.failure:0 "Başarısızlık!"

 agot_filler_dragon.0076.failure.sit:0 "[pet_dragon.GetNameNoTooltip] emrinizde oturmuyor"

 agot_filler_dragon.0076.failure.sat:0 "[pet_dragon.GetName] emrinizde oturmadı. Kötü ejderha!"

 agot_filler_dragon.0076.failure.shake:0 "[pet_dragon.GetNameNoTooltip] emrinizde el sallamıyor"

 agot_filler_dragon.0076.failure.shook:0 "[pet_dragon.GetName] emrinizde el sallamadı. Kötü ejderha!"

 agot_filler_dragon.0076.failure.flip_past:0 "Siz ve [pet_dragon.GetNameNoTooltip] taklanızda başarısız oluyorsunuz"

 agot_filler_dragon.0076.failure.flip:0 "Siz ve [pet_dragon.GetName] taklanızda başarısız oldunuz; etkileyici olmaktansa aptal göründünüz."

 agot_filler_dragon.0082.t:0 "Cesaret, Çoğu Zaman..."

 agot_filler_dragon.0082.desc:0 "Bugün mahkeme salonuma son derece tuhaf bir [brave_knight.GetWomanMan] girdi; görünüşünden çok sözleriyle dikkat çekiyor. Şövalye olduğunu iddia ediyor; ancak saray mensuplarımdan hiçbiri onu daha önce duymamış. Buna rağmen isteğinin saçmalığı, doğrudan bana dilekçe olarak sunulmasına yol açtı.\n\n"Please great [ROOT.Char.GetTitledFirstName], I beg of you, allow me to fight your dragon! I am a knight, and I must prove my bravery to all the realm!" [brave_knight.GetHerHis] words ring earnestly across the room, and I can see the fire in [brave_knight.GetHerHis] eyes.\n\nI must admit, I am curious to see how this will play out, but surely this... [brave_knight.GetName] is mad?"

 agot_filler_dragon.0082.a:0 "Arzun bu ise, öyle olsun."

 agot_filler_dragon.0082.a.f:0 "[brave_knight.GetFirstNameNoTooltip]nün [dragon.GetFirstNameNoTooltip] ile dövüşmesine izin vereceksiniz."

 agot_filler_dragon.0082.a.tt_1:0 "[brave_knight.GetNameNoTooltip] neredeyse kesin olarak ölecek."

 agot_filler_dragon.0082.a.tt_2:0 "Yine de [dragon.GetNameNoTooltip] zarar görmeye karşı tamamen güvende değil..."

 agot_filler_dragon.0082.b:0 "Bu deliliğe izin vermeyeceğim."

 agot_filler_dragon.0082.b.f:0 "[brave_knight.GetFirstNamePossessiveNoTooltip] isteğini reddedeceksiniz."

 agot_filler_dragon.0084.t:0 "Çoğu Zaman Aptallığa Götürür"

 agot_filler_dragon.0084.desc:0 "Düello ne kadar aptalcaysa o kadar kısaydı. [brave_knight.GetFirstName], sesi salonda yankılanarak [dragon.GetFirstName]ye saldırdı ve derhal "

 agot_filler_dragon.0084.desc.burned:0 "[dragon.GetFirstNamePossessiveNoTooltip] alevleri tarafından küle çevrildi."

 agot_filler_dragon.0084.desc.eaten:0 "[dragon.GetFirstNamePossessiveNoTooltip] çenelerini [brave_knight.GetHerHim]in etrafında kapattığında yutuldu."

 agot_filler_dragon.0084.desc.crushed:0 "[dragon.GetFirstNamePossessiveNoTooltip] pençeleri tarafından ezildi."

 agot_filler_dragon.0084.desc_end:0 "\n\nOda bir an sessiz kaldı; ardından saray, dehşet nefesleriyle karışık gergin kahkahalara boğuldu. [brave_knight.GetFirstNameNoTooltip] için biraz üzülmekten kendimi alamıyorum; ama bu en başından beri aptalca bir girişimdi."

 agot_filler_dragon.0084.a:0 "Eh, bu beklenen bir şeydi."

 agot_filler_dragon.0084.a.f:0 "[brave_knight.GetFirstNamePossessiveNoTooltip] ölümünün hikâyesi diyara hızla yayılıyor."

 agot_filler_dragon.0085.t:0 "Çoğu Zaman Zafere Götürür"

 agot_filler_dragon.0085.desc:0 "O anları ömrüm oldukça asla unutmayacağım. [brave_knight.GetFirstName], sesi salonda yankılanarak [dragon.GetFirstName]ye saldırdı ve [brave_knight.GetHerHis] kıyameti olacak alev fışkırmasının altından #italic kayarak#! geçti. Güçlü bir hamleyle [brave_knight.GetFirstNameNoTooltip], [dragon.GetFirstNameNoTooltip]yi boynundan vurdu; [dragon.Custom('GetDragonHerHis')] koca gövdesinin [brave_knight.GetFirstNamePossessiveNoTooltip] kendi gövdesine çarpmasından kaçınmak için yeniden dalışa geçti.\n\nSonrasında olanlar bir hareket bulanıklığıydı; ikisi ölüm dansında kilitlenmişti. Ancak net olan şey şu son görüntüydü: [brave_knight.GetFirstNameNoTooltip], [dragon.GetFirstNameNoTooltip]nün karnının üzerinde duruyor, kılıcı [dragon.Custom('GetDragonHerHis')] göğsüne saplanmış; şaşkın kalabalık tezahürat ve alkışlara boğuluyor.\n\n[brave_knight.GetFirstNameNoTooltip], tüm olasılıklara rağmen #italic kazandı#!."

 agot_filler_dragon.0085.a:0 "Senin gibi bir şövalye benimle kalmalı!"

 agot_filler_dragon.0085.a.f:0 "[brave_knight.GetFirstNameNoTooltip]ye sarayınızda bir yer teklif edeceksiniz."

 agot_filler_dragon.0085.b:0 "#EMP Ne cüretin var! Gözümün önünden git!#!"

 agot_filler_dragon.0085.b.f:0 "[brave_knight.GetFirstNameNoTooltip]yi gönderiyor, [brave_knight.GetHerHis] zaferini kabul etmeyi reddediyor ve öfkeyle pişmanlık içinde köpürüyorsunuz."

 agot_filler_dragon.0085.c:0 "#X ZİNDANA, SENİ!#!"

 agot_filler_dragon.0085.c.f:0 "Ejderhanız [dragon.GetFirstNameNoTooltip]yi öldürmeye cüret ettiği için [brave_knight.GetFirstNameNoTooltip]yi zindana attırıyorsunuz."

 agot_filler_dragon.0087.t:0 "Birinci Sınıf Uçuş"

 agot_filler_dragon.0087.desc:0 "Görünüşe göre bugün daha ilginç günlerimden biri olacaktı. Yerel zengin bir tüccar, bir [merchant_petitioner.GetFirstName], bana son derece sıra dışı bir istekle geldi. [merchant_petitioner.GetSheHe|U], [dragon.GetFirstName]ye binme hakkı satın almak istiyor ve [merchant_petitioner.GetSheHe] bu ayrıcalık için epey yüklü bir meblağ ödemeye hazır!\n\nTeklif cazibesiz olmasa da, [dragon.GetFirstNameNoTooltip]ye binme hakkı satma fikri...#italic tiksindirici#! görünüyor. [merchant_petitioner.GetSheHe] teklifi dile getirdiğinde sarayın tepkisine bakılırsa, bu hakarete varan bir şey."

 agot_filler_dragon.0087.a:0 "Ah, neden olmasın?"

 agot_filler_dragon.0087.a.f:0 "[merchant_petitioner.GetFirstNameNoTooltip]nün [dragon.GetFirstNameNoTooltip]ye binme hakkı satın almasına izin vereceksiniz."

 agot_filler_dragon.0087.b:0 "Ejderhamın hizmetlerini satmayacağım."

 agot_filler_dragon.0087.b.f:0 "[merchant_petitioner.GetFirstNamePossessiveNoTooltip] teklifini reddedeceksiniz."

 agot_filler_dragon.0087.c:0 "Elbette yapabilirsin! #italic Seni bizzat ben götüreceğim...#!"

 agot_filler_dragon.0087.c.f:0 "[merchant_petitioner.GetFirstNamePossessiveNoTooltip] uçuşunun, [merchant_petitioner.GetSheHe]nün asla unutamayacağı bir anı olmasını sağlayacaksınız..."

 agot_filler_dragon.0089.t:0 "Azılı Canavarlar ve Hayvani Korkular"

 agot_filler_dragon.0089.desc:0 "En son ne zaman midemde bir yumruyla uyanmadım ya da bir koridorun köşesinde sıçramadım? Bunu bilmek benim için zor. Korku sevgilim oldu ve onun kollarında geçirdiğim süre,"

 agot_filler_dragon.0089.desc_spouse:0 "kendi eşimin kollarından fazla."

 agot_filler_dragon.0089.desc_no_spouse:0 "herhangi bir başkasınınkinden fazla."

 agot_filler_dragon.0089.desc_cont:0 "Ama bu böyle süremez. Bir ejderham var; dünyanın en tehlikeli ve en güçlü yaratığı. Hayatım boyunca korkak olmaya devam edemem.\n\nBu yüzden buradayım, [dragon.GetName]nün karşısında. [dragon.Custom('GetDragonHerHis')] binicisi olan beni, [dragon.Custom('GetDragonSheHe')|U] dehşete düşürüyor. [dragon.GetFirstNameNoTooltip]yi evcilleştirdiğim gibi korkumu da evcilleştirmeyi öğrenmeliyim.\n\nGözlerimiz ender bir yoğunlukla buluşuyor. [dragon.Custom('GetDragonHerHis')] nefesini hissediyorum. [dragon.Custom('GetDragonHerHis')] kalp atışını, çarpıntısını hissedebiliyorum. Ya da bu benimki mi? Ben..."

 agot_filler_dragon.0089.stress.t:0 "Korku Sizi Ezdi"

 agot_filler_dragon.0089.a:0 "...Sakin sakin nefes al."

 agot_filler_dragon.0089.a.f:0 "Korkuyla savaşmak, her şeyden önce savaşmaktır. Nefes almak, nefes vermek, bir düelloda saldırı ve savunmayı değiştirmek gibidir."

 agot_filler_dragon.0089.b:0 "...Bedensel kontrolümü sürdür."

 agot_filler_dragon.0089.b.f:0 "Korku zihnindir, ancak etkileri bedendedir. Bedeni kontrol etmek, korkuyu kontrol etmektir."

 agot_filler_dragon.0089.c:0 "...Bana doğru akıp geçsin."

 agot_filler_dragon.0089.c.f:0 "Korku, zihni öldürendir. Korku, tüm yok oluşu getiren küçük ölümdür. Korkumla yüzleşeceğim. Onun üzerimden ve içimden akıp geçmesine izin vereceğim. Ve o geçip gittiğinde, iç gözümü çevirip yolunu göreceğim. Korkunun gittiği yerde hiçbir şey olmayacak. Geriye yalnızca ben kalacağım."

 agot_filler_dragon.0089.d:0 "...Kendimi toparla, canı cehenneme!"

 agot_filler_dragon.0089.d.f:0 "Ben bir ejderha binicisiyim! Bundan kötüsünü de yaşadım. Korkunun beni kontrol etmesine izin vermeyeceğim!"

 agot_filler_dragon.0089.e:0 "...Ateşe odaklan."

 agot_filler_dragon.0089.e.f:0 "Öyle azılı, öyle güçlü ki. Işığın, yaşamın kaynağı. Güç ve cesaretin kaynağı."

 agot_filler_dragon.0089.f:0 "...Elde edebileceklerimi düşün."

 agot_filler_dragon.0089.f.f:0 "Korkumu bırakarak böyle bir yaratıkla o kadar yükseklere çıkabilirim ki."

 agot_filler_dragon.0089.g:0 "...Sadece bekle, geçecek."

 agot_filler_dragon.0089.g.f:0 "Ne kadar sürerse sürsün, bu yaratığın huzurunda korku, ateşteki bir çalı gibi eninde sonunda yanıp kül olacak."

 agot_filler_dragon.0089.h:0 "...Git. Bu bir hataydı."

 agot_filler_dragon.0091.t:0 "Ateş ve... Ateş"

 agot_filler_dragon.0091.desc:0 "Son birkaç gündür her zamankinden az uyuyorum. Göz kapaklarım kapalıyken bile [dragon.Custom('GetDragonHerHim')]i net biçimde görebiliyorum. Karanlıktaki bir ateş, gecedeki bir deniz feneri kadar belirgin. [dragon.Custom('GetDragonHerHim')]i, [dragon.GetName]yi görüyorum.\n\nUyanık gözlerimle ateş çarkını görüyorum. Bana bakan gözbebeği.\n\nYemeğin tadını hatırlayamıyorum. Rüyalarım alevden, anılarım kordur.\n\nAlevler her yanımda dönüyor..."

 agot_filler_dragon.0091.a:0 "Çok güzeller..."

 agot_filler_dragon.0091.b:0 "Çok dehşet vericiler..."

 agot_filler_dragon.0093.t:0 "Dizginleri Almak"

 agot_filler_dragon.0093.desc_father:0 ""But Faaaaaather!" [child.GetFirstName] "

 agot_filler_dragon.0093.desc_mother:0 ""But Motheeeeeer!" [child.GetFirstName] "

 agot_filler_dragon.0093.desc_bossy:0 "talep ediyor: "I simply #emp must #! ride [dragon.GetFirstName]! I am your own blood, surely [dragon.Custom('GetDragonSheHe')] will not harm me!"\n\nI can see the fire in [child.GetFirstNamePossessiveNoTooltip] eyes, the determination in [child.GetHerHis] stance. [child.GetFirstNameNoTooltip] is not going to take no for an answer.\n\n"

 agot_filler_dragon.0093.desc_charming:0 "yalvarıyor: "I have been oh so very good! I'll even not complain in my classes for a whole week if you let me ride [dragon.GetFirstName]! Please oh pleasepleaseplease!" that ever-sweet voice makes even me want to bend to [child.GetHerHis] will. "I might have to ride one myself one day anywayyyy" [child.GetFirstNameNoTooltip] adds.\n\n"

 agot_filler_dragon.0093.desc_curious:0 "soruyor: "I simply have to know what is it like to ride [dragon.GetFirstName]? I've heard so many stories, and I want to see for myself!" [child.GetFirstNameNoTooltip] is looking at me with those big eyes, so full of curiosity and wonder. I know that [child.GetFirstNameNoTooltip] isn't one to give up when [child.GetSheHe] has a question.\n\n"

 agot_filler_dragon.0093.desc_pensive:0 "mırıldanıyor: "I have been thinking about it, and I believe that riding [dragon.GetFirstName] would be a good experience for me. I could learn so much from it." [child.GetFirstNameNoTooltip] is looking at me with those thoughtful eyes, so full of wisdom and maturity. [child.GetFirstNameNoTooltip] has a plan, and wants to see it through.\n\n"

 agot_filler_dragon.0093.desc_rowdy:0 "haykırıyor: "I want to ride [dragon.GetFirstName]! I want to ride [dragon.GetFirstNameNoTooltip]! I want to ride [dragon.GetFirstNameNoTooltip]!"\n\n[child.GetFirstNameNoTooltip] is jumping up and down, so full of energy and excitement. At this rate [child.GetFirstNameNoTooltip] might injure [child.GetHerselfHimself] before [dragon.GetFirstNameNoTooltip] even gets the chance!\n\n"

 agot_filler_dragon.0093.desc_end:0 "Yine de bu tehlikeli bir öneri. [dragon.GetFirstNameNoTooltip] güçlü ve tehlikeli bir yaratık; ben [dragon.Custom('GetDragonHerHim')]in üzerindeyken bile, bir ejderhanın yeni binicilere nasıl tepki vereceğini asla bilemezsiniz. Karar vermeliyim..."

 agot_filler_dragon.0093.a:0 "Üzgünüm [child.GetFirstNameNoTooltip], ama hayır."

 agot_filler_dragon.0093.a.f:0 "[child.GetFirstNameNoTooltip]nün [dragon.GetFirstNameNoTooltip]ye binme isteğini reddedeceksiniz."

 agot_filler_dragon.0093.a.cowardly:0 "[child.GetFirstNameNoTooltip] korkaklıkta bilgelik öğreniyor"

 agot_filler_dragon.0093.a.not:0 "[child.GetFirstNameNoTooltip] bunu atlatacak"

 agot_filler_dragon.0093.b:0 "Pekâlâ, yapalım!"

 agot_filler_dragon.0093.b.f:0 "Siz ve [child.GetFirstNameNoTooltip] birlikte [dragon.GetFirstNameNoTooltip]ye bineceksiniz."

 agot_filler_dragon.0093.b.good:0 "[child.GetFirstNameNoTooltip] cevabınızdan memnun"

 agot_filler_dragon.0093.b.love:0 "[child.GetSheHe|U] bu heyecana bayıldı"

 agot_filler_dragon.0093.b.indifferent:0 "[child.GetSheHe|U] güzel vakit geçirdi"

 agot_filler_dragon.0093.b.hate:0 "[child.GetSheHe|U] bu deneyimden keyif almadı"

 agot_filler_dragon.0093.b.bad:0 "Serseri bir rüzgâr, [child.GetFirstNameNoTooltip]yi [dragon.GetFirstNameNoTooltip]nün üzerinden fırlatıyor"

 agot_filler_dragon.0093.b_trait:0 "Ne diyorum ben, [dragon.GetFirstNameNoTooltip] asla [child.GetFirstNameNoTooltip]ye zarar vermez!"

 agot_filler_dragon.0093.c:0 "Elbette! Muhafız! 'Pembe Dehşet'i getirin!"

 agot_filler_dragon.0093.c.f:0 "[child.GetFirstNameNoTooltip]ye binmesi için bunun yerine büyük bir domuz sunuyorsunuz!"

 agot_filler_dragon.0094.t:0 "Kanatlarıyla Uçuşa Çıkarmak"

 agot_filler_dragon.0094.desc_alive:0 "Gördüklerime inanamıyorum! İnanamayarak odamdan çıkarıldım ve gerçekten de gece göğüne karşı [dragon.GetFirstName]nün üzerinde [child.GetFirstName]nün silüetini görebiliyorum! Sadece üstünde değil, ata biner gibi oturuyor!\n\nBirkaç döngü ve dalıştan sonra [child.GetFirstNameNoTooltip] ve [dragon.GetFirstNameNoTooltip] bizi görüp avluya iniyor. [child.GetFirstNameNoTooltip], [dragon.GetFirstNameNoTooltip]nün üzerinden kayarak inerken yüzünde ışıltı var. "Did you see that?!" [child.GetFirstNameNoTooltip] exclaims. I'm not sure if I should be angry or proud at this brave [child.Custom('GirlBoy')]."

 agot_filler_dragon.0094.desc_dead:0 "Gördüklerime inanamıyorum. İnanamayarak odamdan çıkarıldım ve gerçekten de gece göğüne karşı [dragon.GetFirstName]nün üzerinde [child.GetFirstName]nün silüetini görebiliyorum! Buna hazırlanmamışlardı; eyer yoktu!...\n\nDaha düşünür düşünmez gözlerimin önünde görüyorum. Uyanık bir kabus gibi [child.GetFirstNameNoTooltip]nün tutuşunu kaybedip düşüşünü izliyorum. Aşağı, aşağı, aşağı. O kadar uzak ki çığlığı bile duyamıyorum.\n\nNeyse ki çarpma sesini de duymuyorum."

 agot_filler_dragon.0094.a:0 "Bunu yaptığına inanamıyorum!"

 agot_filler_dragon.0094.a.f:0 "[child.GetFirstNameNoTooltip]yi, [dragon.GetFirstNameNoTooltip]ye binmek için gizlice kaçtığı için azarlayacaksınız. Ancak içinizden biraz gurur duymaktan da kendinizi alamıyorsunuz."

 agot_filler_dragon.0094.b:0 "Dünyam! Bunu kendine nasıl yaparsın?!"

 agot_filler_dragon.0094.b.f:0 "[child.GetFirstNameNoTooltip]nün bedenine koşuyorsunuz ve [child.GetHerHis] cansız bedenine ne kadar süre sarıldığınızı hatırlayamıyorsunuz."

 agot_filler_dragon.0094.c:0 "[dragon.GetFirstNameNoTooltip] için ne israf!"

 agot_filler_dragon.0094.c.f:0 "Varlığınız [dragon.GetFirstNameNoTooltip]nün bu geceki olaylardan etkilenmediğinden emin olmak için kontrol ediyor ve ardından dikkatinizi [child.GetFirstNamePossessiveNoTooltip] cesedini ortadan kaldırmaya çeviriyorsunuz."

 agot_filler_dragon.0096.t:0 "[wild_dragon.GetFirstNameNoTooltip]: Halka Saldırılar"

 agot_filler_dragon.0096.desc:0 "[wild_dragon_location.GetName]den gelen raporlar iç karartıcı. [wild_dragon.GetName]nün bölgeden geçen bir grup köylüye saldırdığını söylüyorlar. Sağ kalanlar, gökten süzülüp inen, ateş soluyan ve çeneleriyle insanları parçalayan koca bir canavarı anlatıyor.\n\nİnsanlar dehşet içinde; bu koruma eksikliğine öfkeli olmaları bir yana."

 agot_filler_dragon.0096.a:0 "En azından cenazelerin masraflarını karşılayabilirim."

 agot_filler_dragon.0096.a.f:0 "[wild_dragon.GetName] tarafından öldürülen köylülerin cenazelerinin masraflarını karşılayacaksınız."

 agot_filler_dragon.0096.b:0 "Bu korkunç bir şey!"

 agot_filler_dragon.0096.b.asshole:0 "Bu, benim için değil köylüler için bir sorun gibi görünüyor."

 agot_filler_dragon.0097.t:0 "[wild_dragon.GetFirstNameNoTooltip]: Çiftlik Hayvanlarına Saldırılar"

 agot_filler_dragon.0097.desc:0 "[wild_dragon_location.GetName] çevresindeki kasabalar kargaşa içinde.\n\n[wild_dragon.GetName]nün bölgenin çiftlik hayvanlarına saldırdığını, gökten süzülüp inerek inekleri, koyunları ve bir atı kaçırdığını söylüyorlar.\n\nÇiftçiler panik içinde ve yerel ekonomi zarar görüyor."

 agot_filler_dragon.0097.a:0 "Dikkatli yönetimle toparlanabiliriz."

 agot_filler_dragon.0097.a.f:0 "Müdahaleniz, yerel ekonominin [wild_dragon.GetNameNoTooltip] saldırılarından toparlanmasına yardımcı olacak."

 agot_filler_dragon.0097.b:0 "Çiftlik hayvanları olmasın!"

 agot_filler_dragon.0098.t:0 "[wild_dragon.GetFirstNameNoTooltip]: Ekinlere Saldırılar"

 agot_filler_dragon.0098.desc:0 "[wild_dragon_location.GetName] çevresindeki tarlalar harap durumda! Bana söylenen, [wild_dragon.GetName]nün bilinmeyen nedenlerle ekin tarlalarını yakıp yerel çiftçilerin geçim kaynaklarını yok ettiği.\n\nBu insanlar zaten geçim derdinde; şimdi bir de bununla uğraşmak zorundalar! Müdahale edilmezse, bölge halkı kesinlikle açlıktan ölecek."

 agot_filler_dragon.0098.a:0 "Toparlanmaları için ihtiyaç duyduklarını vereceğim."

 agot_filler_dragon.0098.a.f:0 "[wild_dragon.GetNameNoTooltip] saldırılarından toparlanıp tarlalarını yeniden ekmeleri için çiftçilerin masraflarını karşılayacaksınız."

 agot_filler_dragon.0098.b:0 "Ayıracak hiç yiyecek yok."

 agot_filler_dragon.0099.t:0 "[wild_dragon.GetFirstNameNoTooltip]: Binalarımıza Saldırılar"

 agot_filler_dragon.0099.desc:0 "Başladığı anda biten dehşet verici bir gösteriyle, [wild_dragon.GetName], [target_barony.GetName] topraklarına saldırdı. Bana söylenen, canavarın gökten süzülüp indiği, ateş soluduğu ve bölgedeki binalardan birini parçaladığı.\n\nYeniden inşa etmek zaman ve kaynak gerektirecek ve insanlar [wild_dragon.GetNameNoTooltip]nün geri dönmesinden dehşete kapılmış durumda."

 agot_filler_dragon.0099.a:0 "Bu iğrenç canavardan beni kim kurtaracak?"

 agot_filler_dragon.0100.t:0 "[wild_dragon.GetFirstNameNoTooltip]: Saraya Saldırılar"

 agot_filler_dragon.0100.desc:0 "Bugün korkunç bir haber sarayı sarsıyor; bana söylenen, [dead_courtier.GetFirstName]nün görevleri sırasında [wild_dragon_location.GetName]den geçerken [wild_dragon.GetName] tarafından öldürüldüğü.\n\nSaray kargaşa içinde ve [dead_courtier.GetHerHis] ailesi perişan."

 agot_filler_dragon.0100.a:0 "Bu sona ermeli!"

 agot_filler_dragon.0102.t:0 "Süzülen Bir Aşk"

 agot_filler_dragon.0102.desc:0 "Arazide dolaşırken üzerimden büyük bir gölge geçiyor. Başımı kaldırıp [dragon_of_courtier.GetFirstName]nün üzerinde ata biner gibi oturan [dragonrider_in_court.GetFirstName]yi görüyorum; ikisi gökyüzünde süzülüyor. Rüzgâr [dragonrider_in_court.GetHerHis] saçlarında, güneş [dragonrider_in_court.GetHerHis] yüzünde, canavarın gücü [dragonrider_in_court.GetHerHim]in altında.\n\nGüç, zarafet, güzellik... ve hepsi [dragonrider_in_court.GetHerHis] komutasında. [dragonrider_in_court.GetHerHim]in uçuşunu izlerken kasıklarımda keskin bir sızı hissetmekten kendimi alamıyorum!"

 agot_filler_dragon.0102.a:0 "Belki başka şeyler de [dragonrider_in_court.GetHerHim]in emrinde olabilir..."

 agot_filler_dragon.0102.b:0 "Ne kadar şanslı bir [ROOT.Char.GetWomanMan]ım ben!"

 agot_filler_dragon.0102.c:0 "Bu gelip geçici bir heves, başka bir şey değil."

 agot_filler_dragon.0104.t:0 "Zincirlerden Güçlü Bir Bağ"

 agot_filler_dragon.0104.desc:0 "Ne kadar zamandır buradayım? Günler mi? Aylar mı? Zaman duygumu yavaş yavaş kaybediyorum; ama her şeye rağmen bir şey değişmeden kalıyor: [dragon.GetName] ile olan bağım.\n\nBurada bile, bu duvarlar arasına kilitlenmişken, yüzümdeki rüzgâr hissinden yoksunken bir şey hissediyorum. İçimde derinlerde bir şey. Ayrı olsak da [dragon.GetFirstNameNoTooltip]yi çok yakın hissediyorum.\n\nBu anda başka hiçbir düşünce bana böyle bir güvenlik ve rahatlık duygusu vermiyor. Sanki [dragon.Custom('GetDragonHerHim')] buradaymış gibi — sanki uzanıp parmaklarımın altında [dragon.Custom('GetDragonHerHis')] pullarını hissedecekmişim gibi..."

 agot_filler_dragon.0104.a:0 "Seni görüyorum, [dragon.GetFirstNameNoTooltip]..."

 agot_filler_dragon.0104.a.f:0 "Ejderhanızla olan bağınız, bu karanlık zamanda size ferahlık veriyor."

 agot_filler_dragon.0104.b:0 "Burada olsaydın, özgür olurdum!"

 agot_filler_dragon.0104.b.f:0 "Kaçma arzunuz, içinizi alev ve özgürlük hayalleriyle dolduruyor."

 agot_filler_dragon.0104.c:0 "Fazla vaktim kalmadı... Ah, [dragon.GetFirstNameNoTooltip], seni yeniden görmeliyim!"

 agot_filler_dragon.0104.c.f:0 "Yenilenmiş bir güç duygusu hissediyorsunuz; içinde [dragon.GetFirstNameNoTooltip]yi yeniden görme gücünü buluyorsunuz."
