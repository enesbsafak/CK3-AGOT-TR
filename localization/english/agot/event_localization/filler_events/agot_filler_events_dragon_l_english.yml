### TODO NOT-IN-ST: agot_filler_dragon.0008.desc [AGOT: It is well known that the dragon [worshiped_dragon.GetFirstName] lairs in the [worshiping_county.GetName]. Though it has occasionally proven dangerous and caused the odd complaint, [worshiped_dragon.Custom('GetDragonSheHe')] has become a fact of life for the people. Today however, I have received a strange piece of news from my local administrators.\n\nIt seems that, contrary to the wariness to be expected when dealing with a beast such as [worshiped_dragon.GetFirstNameNoTooltip], the local peasants have begun #italic worshiping#! the creature! I'm told that every week they bring [worshiped_dragon.Custom('GetDragonHerHim')] tribute in the form of meats, and by some of the more frantic reports, even live animal sacrifices!\n\nThough no deaths have yet been reported, the hazards of such activities are obvious.]
 agot_filler_dragon.0008.desc:0 "It is well known that the dragon [worshiped_dragon.GetFirstName] lairs in the [worshiping_county.GetName]. Though it has occasionally proven dangerous and caused the odd complaint, [worshiped_dragon.Custom('GetDragonSheHe')] has become a fact of life for the people. Today however, I have received a strange piece of news from my local administrators.\n\nIt seems that, contrary to the wariness to be expected when dealing with a beast such as [worshiped_dragon.GetFirstNameNoTooltip], the local peasants have begun #italic worshiping#! the creature! I'm told that every week they bring [worshiped_dragon.Custom('GetDragonHerHim')] tribute in the form of meats, and by some of the more frantic reports, even live animal sacrifices!\n\nThough no deaths have yet been reported, the hazards of such activities are obvious."
