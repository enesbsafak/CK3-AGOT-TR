### TODO NOT-IN-ST: agot_filler_dragon.0057.desc [AGOT: I have been preparing this ritual for weeks, and now it is finally time. I have gathered the necessary components, prepared the area, and even managed to get [dragon.GetFirstName] to sit still!\n\nI order the shutters closed and sit cross-legged before [dragon.GetFirstNameNoTooltip], lighting the candle between [dragon.Custom('GetDragonSheHe')] and I. [dragon.Custom('GetDragonSheHe')|U] lowers [dragon.Custom('GetDragonHerHis')] head to be level with mine, and I look deep into [dragon.Custom('GetDragonHerHis')] eyes.\n\nThe candle burns between our gaze. I stare into those eyes baring wisdom beyond my ken. The faint connection between us, never uttered yet always present, I feel it now. Real. Tangible. Threaded between us. I feel the world fall away...\n\nI am in a place of dreams, and I am not alone. I am with [dragon.GetFirstNameNoTooltip]. We are together, and we are...]
 agot_filler_dragon.0057.desc:0 "I have been preparing this ritual for weeks, and now it is finally time. I have gathered the necessary components, prepared the area, and even managed to get [dragon.GetFirstName] to sit still!\n\nI order the shutters closed and sit cross-legged before [dragon.GetFirstNameNoTooltip], lighting the candle between [dragon.Custom('GetDragonSheHe')] and I. [dragon.Custom('GetDragonSheHe')|U] lowers [dragon.Custom('GetDragonHerHis')] head to be level with mine, and I look deep into [dragon.Custom('GetDragonHerHis')] eyes.\n\nThe candle burns between our gaze. I stare into those eyes baring wisdom beyond my ken. The faint connection between us, never uttered yet always present, I feel it now. Real. Tangible. Threaded between us. I feel the world fall away...\n\nI am in a place of dreams, and I am not alone. I am with [dragon.GetFirstNameNoTooltip]. We are together, and we are..."
