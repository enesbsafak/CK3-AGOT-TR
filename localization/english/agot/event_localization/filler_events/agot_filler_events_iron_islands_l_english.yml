### TODO NOT-IN-ST: agot_filler_ironislands.007.desc [AGOT: The son of a thrall from [birthplace.GetNameNoTier] has being showing incredible prospect as an Ironborn. I hardly believed it until one of our best reavers took me down to the docks myself and I witnessed it with my own eyes.\n\nThe young [thrall.Custom('GirlBoy')] was born of a miner, but apprenticed to a fishing boat where [thrall.GetSheHe] showed the seamanship of a sailor twice [thrall.GetHerHis] years. I watched as [thrall.GetSheHe] clambered up the masts, hauled and reefed sails, spliced rope and even showed some minor skill in a mock finger dance. With the right heading, [thrall.GetName] could be a name which greenlanders all along the coast speak in hushed whispers.]
 agot_filler_ironislands.007.desc:0 "The son of a thrall from [birthplace.GetNameNoTier] has being showing incredible prospect as an Ironborn. I hardly believed it until one of our best reavers took me down to the docks myself and I witnessed it with my own eyes.\n\nThe young [thrall.Custom('GirlBoy')] was born of a miner, but apprenticed to a fishing boat where [thrall.GetSheHe] showed the seamanship of a sailor twice [thrall.GetHerHis] years. I watched as [thrall.GetSheHe] clambered up the masts, hauled and reefed sails, spliced rope and even showed some minor skill in a mock finger dance. With the right heading, [thrall.GetName] could be a name which greenlanders all along the coast speak in hushed whispers."
