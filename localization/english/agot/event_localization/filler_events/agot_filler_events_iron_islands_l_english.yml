 agot_filler_ironislands.001.t:0 "Garip Bir Ada"
### TODO NOT-IN-ST: agot_filler_ironislands.001.desc [AGOT: The life of an Ironborn is spent on the waters, taking what we can from wherever we find it. We need not pay in gold for that which we can claim through force.\n\nToday, in the distance, I spot an odd island that I cannot recall having seen before. As my ship draws nearer, I can make out the shape of a temple on the stony shores.]
 agot_filler_ironislands.001.desc:0 "The life of an Ironborn is spent on the waters, taking what we can from wherever we find it. We need not pay in gold for that which we can claim through force.\n\nToday, in the distance, I spot an odd island that I cannot recall having seen before. As my ship draws nearer, I can make out the shape of a temple on the stony shores."
