 agot_filler_ironislands.0011.t:0 "Garip Bir Ada"
### TODO NOT-IN-ST: agot_filler_ironislands.0011.desc [AGOT: As we approach the abandoned temple, something feels amiss — like the air itself is heavy, though there is no sign of fog. I can't shake this foreboding feeling.\n\nThe closer we get, the heavier the air feels... Like ghastly hands pulling at my arms and back. #italic That's it, I can't go any further,#! I think to myself, before turning on my heel and scrambling back to my ship.\n\nMy men are left staring at me from the shore as I clamber on board, but at least I know I am #bold safe#!.]
 agot_filler_ironislands.0011.desc:0 "As we approach the abandoned temple, something feels amiss — like the air itself is heavy, though there is no sign of fog. I can't shake this foreboding feeling.\n\nThe closer we get, the heavier the air feels... Like ghastly hands pulling at my arms and back. #italic That's it, I can't go any further,#! I think to myself, before turning on my heel and scrambling back to my ship.\n\nMy men are left staring at me from the shore as I clamber on board, but at least I know I am #bold safe#!."
