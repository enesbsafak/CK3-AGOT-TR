l_english:

 agot_filler_ironislands.001.t:0 "Garip Bir Ada"

 agot_filler_ironislands.001.desc:0 "Bir Demirdoğan'ın hayatı sularda geçer; bulduğumuz yerden ne alabilirsek alırız. Güçle talep edebildiğimiz şey için altınla ödememize gerek yok.\n\nBugün, uzakta daha önce gördüğümü hatırlayamadığım tuhaf bir ada seçiyorum. Gemim yaklaştıkça, taşlı kıyılarda bir tapınağın şeklini seçebiliyorum."

 agot_filler_ironislands.001.a:0 "Terk edilmiş bir tapınak kolayca yağmalanabilir..."

 agot_filler_ironislands.001.a.tt:0 "Kıyıya ulaşıp almaya değer ne varsa görüyorsunuz."

 agot_filler_ironislands.0011.t:0 "Garip Bir Ada"

 agot_filler_ironislands.0011.desc:0 "Terk edilmiş tapınağa yaklaşırken bir şeyler ters geliyor — sis izi olmamasına rağmen hava ağırlaşmış gibi. Bu uğursuzluk hissini üzerimden atamıyorum.\n\nYaklaştıkça hava daha da ağırlaşıyor... Kollarımdan ve sırtımdan çeken hayaletimsi eller gibi. #italic Bu kadar, daha fazla ilerleyemem,#! diye düşünüyorum kendi kendime, sonra topuklarımın üzerinde dönüp gemime doğru koşar adım geri dönüyorum.\n\nGemiye tırmanırken adamlarım kıyıdan bana bakakalmış halde kalıyor, ama en azından #bold güvende#! olduğumu biliyorum."

 agot_filler_ironislands.0011.a:0 "Kahrolsun bu harabeler!"

 agot_filler_ironislands.0011.a.tt:0 "O tuhaf adayı derhal terk ediyorsun, orada ne büyünün güç sahibi olduğunu asla öğrenemeyeceksin."

 agot_filler_ironislands.0012.t:0 "Garip Bir Ada"

 agot_filler_ironislands.0012.desc:0 "Terk edilmiş tapınağa yaklaşırken bir şeyler ters geliyor — sis izi olmamasına rağmen hava ağırlaşmış gibi. Ama adamlarım ve ben ilerlemeye devam ediyoruz.\n\nTapınağa giriyoruz; önümüzde devasa bir salon açılıyor. Her nasılsa içi daha büyük görünüyor... Her yanda gizemli bir dilde ürkütücü işaretler var.\n\nAma orada, salonun ortasında #bold devasa, parlayan bir mücevher#! duruyor."

 agot_filler_ironislands.0012.a:0 "Oo, parlak!"

 agot_filler_ironislands.0012.a.tt:0 "Bu kadar yolu geldin, bulduğunu almanın vakti geldi."

 agot_filler_ironislands.0012.b:0 "Bu yer lanetli..."

 agot_filler_ironislands.0012.b.tt:0 "Mücevhere dokunmuyorsun ve adayı derhal terk ediyorsun."

 agot_filler_ironislands.0013.t:0 "Garip Bir Ada"

 agot_filler_ironislands.0013.desc:0 "Kendi zihnimin yoğun sisinde savaşıyormuş gibi hissederek yavaşça uyanıyorum.\n\n#italic Neredeyim ben?#! Etrafıma bakınırken merak ediyorum. Uzakta, büyük bir dişi domuzun yanında yalnız bir adam duruyor... Onlara doğru yürümeye başlıyorum, ayaklarım beni kendi başlarına taşıyor gibi.\n\n"Oğlum," diye mırıldanıyor gizemli adam yaklaştığımda. "Seni bekliyordum. Akşam yemeği neredeyse hazır. Yarın hasat başlıyor ve sana ihtiyacım olacak.""

 agot_filler_ironislands.0013.a:0 "Bu da neyin ...?"

 agot_filler_ironislands.0013.a.tt:0 "Yolculuğun devam ediyor..."

 agot_filler_ironislands.0013.b:0 "O domuz garip bir şekilde #italic çekici?#! görünüyor"

 agot_filler_ironislands.0013.b.tt:0 "Yolculuğun devam ediyor..."

 agot_filler_ironislands.0014.t:0 "Garip Bir Ada"

 agot_filler_ironislands.0014.desc:0 "Gözlerim yeniden kapanıyor. Bedenim ağırlaşıyor, zihnim tedirgin. Kollarımdan, bacaklarıma akan ve aşağıdaki zemine damlayan bir tür #bold sıvı#! var. Damlalar kaygılarımı alıp götürüyor gibi.\n\nZihnimin derinliklerine battıkça huzur ve vecitten başka bir şey hissetmiyorum...\n\nAniden gözlerim açılıyor ve karşımda #bold efendim#! duruyor!"

 agot_filler_ironislands.0014.a:0 "Açıklayabilirim! #bold Bu gerçekten ben değilim!#!"

 agot_filler_ironislands.0014.a.tt:0 "Yolculuğun devam ediyor..."

 agot_filler_ironislands.0014.b:0 "Lütfen beni #italic öldür#!."

 agot_filler_ironislands.0014.b.tt:0 "Yolculuğun devam ediyor..."

 agot_filler_ironislands.0015.t:0 "Garip Bir Ada"

 agot_filler_ironislands.0015.desc:0 "Bir kez daha uyanıyorum; bu kez karanlık, serin bir ara sokaktayım. Bu liman tanıdık ama yabancı görünüyor. İleriye tek bir yol var: ana meydana. Ayaklarım beni bir kez daha taşıyor...\n\nAra sokaktan fırlarken kendimi insanlarla çevrili buluyorum — sıradan insanlar değil, hepsi... #N bana mı benziyor?#!\n\nİlahi söylüyorlar, bana bağırıyorlar. #bold "Kayıtsızlık ölümdür!"#!"

 agot_filler_ironislands.0015.a:0 "KAYITSIZLIK ÖLÜMDÜR!"

 agot_filler_ironislands.0015.a.tt:0 "Onların korosuna katılıyorsun."

 agot_filler_ironislands.0015.b:0 "Şunlar balkabağı mı?"

 agot_filler_ironislands.0015.b.tt:0 "Biraz dalgınsın."

 agot_filler_ironislands.0016.t:0 "Garip Bir Ada"

 agot_filler_ironislands.0016.desc:0 "Çiçek kokusu bir battaniye gibi üzerimi örterken gözlerim sıkıca kapalı. Ama bir koku daha var — tanıdık ama bunaltıcı.\n\nGözlerimi açıyorum ve işte karşımda. O pis varlığını bir kilometre öteden tanırdım. O çirkin, sızlanan, baş belası, katlanılmaz iblis..."

 agot_filler_ironislands.0016.a:0 "Uzak dur, kahpe!"

 agot_filler_ironislands.0016.a.tt:0 "Stresin eriyip gidiyor gibi."

 agot_filler_ironislands.0017.t:0 "Tuhaf Bir Yolculuk"

 agot_filler_ironislands.0017.desc:0 "Sıçrayarak uyanıyorum. Gemimin güvertesinde, mürettebatımın ortasında yatıyorum.\n\nAdamlarımdan biri günlerdir kendimde olmadığımı söylüyor. Saçma emirler haykırıyormuşum, pantolonumu indiriyormuşum, kendi kendime mırıldanıyormuşum...\n\nHatta kafama kovayla vurmuşum, ama aniden kendime geldim! #italic Ne zaman yeniden olacağını kim bilir?#!"

 agot_filler_ironislands.0017.a:0 "Umalım da sonuncusu bu olsun."

 agot_filler_ironislands.0017.a.tt:0 "Ve tüm bu olanların ortasında, o güzel mücevheri kaybettiğin anlaşılıyor!"

 agot_filler_ironislands.002.t:0 "Denizde Meydan Okuma"

 agot_filler_ironislands.002.desc:0 "Yolculuğumuzun üzerinden çok geçmeden, kara uzakta silinmeye başlamışken, [mutineer.GetFirstNameNicknamedNoTooltip] küreğini bırakıp bana doğru yürümeye başlıyor. Gözündeki ifadeden bir sorun çıkacağını anlıyorum. Diğer mürettebat üyeleri, bazıları aynı derecede hoşnutsuz görünerek etrafa toplanmaya başlıyor"

 agot_filler_ironislands.002.a:0 "[mutineer.GetFirstNameNoTooltip]'e yerini hatırlat"

 agot_filler_ironislands.002.b:0 "Dur bir dakika, servetten biraz paylaşsak nasıl olur?"

 agot_filler_bribe_challenger.tt:0 "Yumuşak yolu seçersen mürettebatın sana olan saygısının bir kısmını kaybedebilir"

 agot_filler_ironislands.002.c:0 "Rakip aday cevap veremeden onu hızla yere ser"

 challenger_intimidation_success.tt:0 "[mutineer.GetFirstNameNoTooltip] yıldırılmış"

 challenger_intimidation_failure.tt:0 "[mutineer.GetFirstNameNoTooltip]'i yıldıramıyorsun"

 challenger_duel.tt:0 "@warning_icon!#X Mürettebatı yıldıramamak kesinlikle şiddete yol açacaktır"

 agot_filler_ironislands.0021.t:0 "Yatıştırılmış Savaşçılar"

 agot_filler_ironislands.0021.desc:0 "[mutineer.GetFirstNameNoTooltip] halledildiği için durum yatışıyor gibi. Kalabalık dağılıyor ve takipçilerin sana yenilenmiş bir saygıyla bakıyor."

 agot_filler_ironislands.0021.a:0 "Bir tehdit daha halledildi."

 agot_filler_ironislands.0022.t:0 "Başarısız Yıldırma"

 agot_filler_ironislands.0022.desc:0 "[mutineer.GetFirstNameNoTooltip] tehditlerimden en ufak bir endişe duymuyor, hatta silahını çekip bana doğru gelmeye başlıyor!"

 agot_filler_ironislands.0022.a:0 "Barış hiçbir zaman bir seçenek değildi"

 agot_filler_ironislands.003:0 "Demir Fırtınası"

 agot_filler_ironislands.003.desc:0 "İki geminin dövüşünü izlemek her zaman güzel bir şeydir. Biz Boğulmuş Tanrı'nın oğulları ekmeyiz; anakaralılar gibi boş oturup süs eşyası yapmayız. Yağmalarız, güç hakkıyla bizim olanı alırız. Sonuçta, bir adam elindekini savunamıyorsa, o şey neden onun olsun?\n\nVe sanki takdir-i ilahi ile, gözümüze hafif korunan bir tüccar filosu takıldı..."

 agot_filler_ironislands.003.a:0 "Bizi yaklaştır, amiral gemisine koç gibi çarp, ta boğazına!"

 agot_filler_ironislands.003.a_tt:0 "Savaşa!"

 agot_filler_ironislands.003.b:0 "Boğulmuş Tanrı! Gemilerimize, baltalarımıza, mızraklarımıza ve kılıçlarımıza yol göster!"

 agot_filler_ironislands.003.b_tt:0 "Bizi amansız savaşta yönlendir!"

 agot_filler_ironislands.0031:0 "Demir Fırtınası"

 agot_filler_ironislands.0031.desc:0 "Gemimiz azgın bir şekilde ilerliyor! Dalgaların gücü ve ok yağmurlarımızın kudretiyle tüccar kadırgasının yanına dalıyoruz. Yağmacılar kükriyor, silahları şakıyor; anakaralılar sığır oldukları gibi ölürken çelik çeliğe çarparken çıkan çarpışma yavaş yavaş sönüyor. İyi savaştılar, ama her zamanki gibi Demirdoğan savaşçılarının gücü karşısında yere serildiler.\n\nÇatışma sona erip son adamlar da teslim olurken güvertede yürüyüp ölümün eşiğine kadar dövülmüş kaptana doğru ilerliyorum."

 agot_filler_ironislands.0031.a:0 "Kafasını kes; yeni bir süslemeye ihtiyacım var"

 agot_filler_ironislands.0031.a_tt:0 "Yakala onu."

 agot_filler_ironislands.0032:0 "Demir Fırtınası"

 agot_filler_ironislands.0032.desc:0 "[ship_captain_culture.GetName] kaptanını kırdım. Artık tüm bunları alabilirim."

 agot_filler_ironislands.0032.a:0 "Seni Boğulmuş Tanrı'ya adak olarak boğacağız. Tüm servetin artık benim."

 agot_filler_ironislands.0032.a_tt:0 "Demir Bedel'i ödedim."

 agot_filler_ironislands.0032.b:0 "Yağmacı olmak güzel."

 agot_filler_ironislands.0032.b_tt:0 "Belki bunu daha sık yapmalıyım..."

 agot_filler_ironislands.004:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.004.desc:0 "Yerel rahibin sana kötü haber getirdi: yağmacılarından biri kendini zenginliklere gömmüş - kendi kılıcıyla devirmediği adamların zenginliklerine. Demir Bedel'i terk etmiş ve geleneklerimizi lekelemiş. Rahip onun dışlanmasını istiyor."

 agot_filler_ironislands.004.a:0 "Onunla akılcı şekilde konuşmayı deneyeceğim."

 agot_filler_ironislands.004.a_tt:0 "Ah, gençliğin akılsızlığı."

 agot_filler_ironislands.004.b:0 "Bu gemide olmayacak. Defolup gitsin."

 agot_filler_ironislands.004.b_tt:0 "Bu disiplin gerektirir."

 agot_filler_ironislands.0041:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.0041.desc:0 "Marq kamarana gelince, ondan oturmasını istiyorsun. Ardından, aldığın her şeyi hak etmenin önemini ona dikkatle açıklıyorsun; kazandığın her mücevherin, her tuz karısının ve her ganimet parçasının bedelini ödemenin seni gerçek bir Demirdoğan yaptığını anlatıyorsun."

 agot_filler_ironislands.0041.a:0 "Dinlediğin için teşekkürler. Umarım sözlerim bugün deniz kadar açıktı. Aksi takdirde sonuçları olur."

 agot_filler_ironislands.0041.a_tt:0 "Umarım hatırlar."

 agot_filler_ironislands.0041.b:0 "Eylemlerini mürettebata bildirmeni istiyorum. Örnek olsun."

 agot_filler_ironislands.0041.b_tt:0 "Marq bundan hoşlanmayabilir."

 agot_filler_ironislands.0042:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.0042.desc:0 "Marq, bir ara sokakta birkaç kadın ve arkadaşıyla birlikte, halkın içinde kendini rezil ediyor. Seni fark edince onurunla alay ederek sana "kendini beğenmiş domuz" diye sesleniyor."

 agot_filler_ironislands.0042.a:0 "Az önce bana ne dedin?!"

 agot_filler_ironislands.0042.a_tt:0 "Saygıyı öğreneceksin oğlum!"

 agot_filler_ironislands.0044:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.0044.desc:0 "Rahibinin sana biraz şarap getirmesi gerekiyordu; odasına gittiğinde onu bir kan gölünde ölü buluyorsun."

 agot_filler_ironislands.0044.a:0 "Bunun arkasında kim olabilir?"

 agot_filler_ironislands.0044.a_tt:0 "Hmm..."

 agot_filler_ironislands.0044.b:0 "Marq'ı yakalayın. Onu Boğulmuş Tanrı onuruna boğacağız."

 agot_filler_ironislands.0044.b_tt:0 "Boğulmuş Tanrı onu yargılayacak."

 agot_filler_ironislands.0045:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.0045.desc:0 "Marq yola dizildi. Adamların, güç kullanımına ve dinî gelenekleri uygulayışına saygı duyuyor görünüyor."

 agot_filler_ironislands.0045.a:0 "Bu onları yola dizecek."

 agot_filler_ironislands.0045.a_tt:0 "Umalım."

 agot_filler_ironislands.0046:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.0046.desc:0 "Meyhanede birasını yudumluyorsun; bu sırada Marq ve birkaç kabadayısı ellerinde kanlı bıçaklarla içeri dalıyor. "Sessiz kalıp altına hükmetmeme izin vermeliydin, [GetPlayer.GetName].""

 agot_filler_ironislands.0046.a:0 "Çıkış yok. Canım için savaşmak zorundayım."

 agot_filler_ironislands.0046.a_tt:0 "İç karartıcı görünüyor..."

 agot_filler_ironislands.0047:0 "Demir Bedelin Önemi"

 agot_filler_ironislands.0047.desc:0 "Rakiplerim ölü ve kanlar içinde yatıyor. Meyhaneyi batırdım. Neyse ki barmen, beni lord olarak tanıyıp işe karıştı ve Marq'ın adamlarından birinin kafasına şişeyle vurdu."

 agot_filler_ironislands.0047.a:0 "Zahmetin için, iyi adam."

 agot_filler_ironislands.0047.a_tt:0 "Cömert olmak güzel."

 agot_filler_ironislands.005.t:0 "Artık Bir Köle Hanesi Değil!"

 agot_filler_ironislands.005.desc:0 "Diğerleri kadehlerini kaldırıp, birçoğu benimkinden daha zayıf olan daha saygın Demirdoğan hanedanlarının adlarını haykırırken dinliyorum. Kendi kadehimizi kapıp yukarı kaldırıyor ve kendi hanedanımın adını haykırıyorum.\n\nBeklendiği gibi, bazıları karşılık veriyor — kadehine gömülenler ya da bana sadık olanlar; diğerleri hiçbir şey dememişim gibi davranıyor. Ama caymıyorum. "Benim hanedanım Demir Adalar'ın güçlüleri arasında sayılmıyor mu?" Kimse buna itiraz edemezdi.\n\n"Ben, babam ve ondan önceki babası, seninle ve senin ailenle birlikte yağmalamadık ve savaşmadık mı?" Kimse bunu inkar edemezdi.\n\n"Hanedanım Gri Kral'dan soy iddia etmiyor; atalarımın köle ve tuz karısı olduğu herkesçe bilinir. Yine de sancaklarımız anakaralılara korku salıyor, kanımız savunmasında Demir Adalar'ı boyuyor! Siz soruyorum: Hanedanım, kölelerden daha fazlası sayılmak için demir bedeli ödemedi mi? Döktüğümüz kan, hanedanımızdaki o lekeyi yıkayıp atmadı mı?"\n\nSözlerimin yerini bulduğunu biliyordum — büyük küçük tüm Demirdoğan hanedanlarından adamlar kadehlerini kaldırıp hanedanımın adını haykırdılar."

 agot_filler_ironislands.005.a:0 "Kölelik lekesi gitti."

 agot_filler_ironislands.005.a_tt:0 "Bugünden sonra Demir Adalar'da hiç kimse hanedanına kökeninden dolayı tepeden bakamayacak."

 agot_filler_ironislands.006.t:0 "Fahişe Gibi Donanmış"

 agot_filler_ironislands.006.desc:0 "Danışmanlarımla toplantıdan büyük salonuma döndüğümde gürültülü bir kalabalıkla karşılaştım; ortasında [gold_price.Custom('DaughterSon')] [gold_price.GetName] vardı. [gold_price.GetSheHe|U], kıkırdayan dalkavuklardan oluşan bir girdabın merkezinde, bir sürü ipek ve mücevher kuşanmış halde. Çocuğum bir espri yapıyor, onlar da Arbor altını ve Dorneli kırmızısıyla taşan kadehlerinin üzerinde yeniden kıkırdıyor. Sonra içlerinden biri köşede sinsice durduğumu fark ediyor ve salonun kahkahası sönüyor.\n\n"Merhaba [ROOT.Char.GetMotherFather]," diye hıçkırıyor [gold_price.GetName] ve [gold_price.Custom('quirk_pos_present')]. "Bir içki ister misin?""

 agot_filler_ironislands.006.a:0 "Bu süsleri demir bedelini ödeyerek mi aldın?"

 agot_filler_ironislands.006.b:0 "Eski Yollar, gerçek kurallardan çok yol göstericidir."

 agot_filler_ironislands.006.c:0 "Böyle bir müsrifin tek ilacı [gold_price.GetHerHis] ciğerlerindeki deniz tuzudur"

 agot_filler_ironislands.006.d:0 "Şu muhteşem ipeklere bir bakın!"

 agot_filler_ironislands.007.t:0 "Köle Doğumlu Demirdoğan"

 agot_filler_ironislands.007.desc:0 "[birthplace.GetNameNoTier]'deki bir kölenin oğlu, bir Demirdoğan olarak inanılmaz bir vaat sergiliyor. En iyi yağmacılarımızdan biri beni bizzat rıhtıma götürüp kendi gözlerimle görene dek buna inanmamıştım.\n\nGenç [thrall.Custom('GirlBoy')], bir madencinin çocuğu olarak doğmuş, ama bir balıkçı teknesine çırak verilmiş; [thrall.GetSheHe] orada yaşının iki katı bir denizcinin gemiciliğini sergilemiş. [thrall.GetSheHe]'nin direklere tırmanışını, yelkenleri çekişini ve daraltışını, halat ekleyişini ve hatta sahte bir parmak dansında ufak bir beceri gösterişini izledim. Doğru yönle, [thrall.GetName] kıyı boyunca tüm anakaralıların fısıltıyla andığı bir isim olabilir."

 agot_filler_ironislands.007.a:0 "[thrall.GetSheHe|U] iyi bir hizmetkâr olacak."

 agot_filler_ironislands.007.b:0 "[thrall.GetSheHe|U] bir gece bir kadından doğan başıboş bir tohum olmalı!"

 agot_filler_ironislands.007.b.tt_child:0 "Her çocuk"

 agot_filler_ironislands.007.c:0 "Boğulmuş Tanrı'nın layık müritlere ihtiyacı var!"

 agot_filler_ironislands.007.c.tt:0 "Rahipler çocuğu inisiyasyona sokacak."

 agot_filler_ironislands.007.d:0 "İyi bir gösteri, ama sarayımda bir köle dölü yetiştirmem."
