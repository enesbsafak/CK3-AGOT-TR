### TODO NOT-IN-ST: agot_filler_ironislands.0015.desc [AGOT: I awaken once more, this time in a dark, cool alley. This port looks familiar, yet unknown. There is only one path forward, into the main town square. My feet carry me once more...\n\nAs I burst from the alleyway, I find myself surrounded by people — not just any people, they all seem to be ... #N me?!#!\n\nThey are chanting, shouting at me. #bold]
 agot_filler_ironislands.0015.desc:0 "I awaken once more, this time in a dark, cool alley. This port looks familiar, yet unknown. There is only one path forward, into the main town square. My feet carry me once more...\n\nAs I burst from the alleyway, I find myself surrounded by people — not just any people, they all seem to be ... #N me?!#!\n\nThey are chanting, shouting at me. #bold "Apathy is death!"#!"
