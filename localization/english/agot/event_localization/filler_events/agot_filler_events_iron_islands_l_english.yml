### TODO NOT-IN-ST: agot_filler_ironislands.0031.desc [AGOT: Our ship rages on! By the power of the waves and by the might of our arrow volleys, we come tearing into the side of the merchant galley. The Reavers roar, their weapons sing, the clash of steel against steel slowly dying out as the greenlanders die like the cattle they are. They fought well, but as always, they fall before the might of Ironborn warriors.\n\nAs the fighting comes to a halt and the last of the men surrender, I walk across the deck towards the captain, beaten within an inch of his life.]
 agot_filler_ironislands.0031.desc:0 "Our ship rages on! By the power of the waves and by the might of our arrow volleys, we come tearing into the side of the merchant galley. The Reavers roar, their weapons sing, the clash of steel against steel slowly dying out as the greenlanders die like the cattle they are. They fought well, but as always, they fall before the might of Ironborn warriors.\n\nAs the fighting comes to a halt and the last of the men surrender, I walk across the deck towards the captain, beaten within an inch of his life."
