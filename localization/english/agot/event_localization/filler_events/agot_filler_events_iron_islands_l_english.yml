### TODO NOT-IN-ST: agot_filler_ironislands.0012.desc [AGOT: As we approach the abandoned temple, something feels amiss — like the air itself is heavy, though there is no sign of fog. But my men and I press on.\n\nWe enter the temple; a massive chamber opens before us. Somehow it seems bigger inside... All around are eerie signs in a glyphic language.\n\nBut there, in the center of the room, rests a #bold massive, glowing jewel#!.]
 agot_filler_ironislands.0012.desc:0 "As we approach the abandoned temple, something feels amiss — like the air itself is heavy, though there is no sign of fog. But my men and I press on.\n\nWe enter the temple; a massive chamber opens before us. Somehow it seems bigger inside... All around are eerie signs in a glyphic language.\n\nBut there, in the center of the room, rests a #bold massive, glowing jewel#!."
