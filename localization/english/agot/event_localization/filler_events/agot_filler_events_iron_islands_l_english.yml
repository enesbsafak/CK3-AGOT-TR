### TODO NOT-IN-ST: agot_filler_ironislands.006.desc [AGOT: I returned to my my great hall from a meeting with my councilors to a raucous, at the center of which was my [gold_price.Custom('DaughterSon')] [gold_price.GetName]. [gold_price.GetSheHe|U] is at the center of a gyre of chortling lickspittles, wearing an assortment of silks and jewels. My child tells a joke, and they titter again over their goblets overflowing with Arbor gold and Dornish red. Then one of them notices me lurking in the corner, and the laughter dies out of the room.\n\n]
 agot_filler_ironislands.006.desc:0 "I returned to my my great hall from a meeting with my councilors to a raucous, at the center of which was my [gold_price.Custom('DaughterSon')] [gold_price.GetName]. [gold_price.GetSheHe|U] is at the center of a gyre of chortling lickspittles, wearing an assortment of silks and jewels. My child tells a joke, and they titter again over their goblets overflowing with Arbor gold and Dornish red. Then one of them notices me lurking in the corner, and the laughter dies out of the room.\n\n"Hello [ROOT.Char.GetMotherFather]," [gold_price.GetName] hiccups and [gold_price.Custom('quirk_pos_present')]. "Care for a drink?""
