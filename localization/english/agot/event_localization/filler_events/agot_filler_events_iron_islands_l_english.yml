### TODO NOT-IN-ST: agot_filler_ironislands.0014.desc [AGOT: My eyes are closed once again. My body feels heavy, my mind agitated. There's some sort of #bold fluid#! flowing down my arms, onto my legs, and dripping onto the ground below. The droplets seem to carry away my anxieties.\n\nAs I fall deeper into my own mind, I feel nothing but peace and ecstasy...\n\nSuddenly, my eyes snap open, and before me stands #bold my liege!#!]
 agot_filler_ironislands.0014.desc:0 "My eyes are closed once again. My body feels heavy, my mind agitated. There's some sort of #bold fluid#! flowing down my arms, onto my legs, and dripping onto the ground below. The droplets seem to carry away my anxieties.\n\nAs I fall deeper into my own mind, I feel nothing but peace and ecstasy...\n\nSuddenly, my eyes snap open, and before me stands #bold my liege!#!"
