l_english:

 agot_filler_westerlands.0001.t:0 "Bir Aslanın Kükremesi"

 agot_filler_westerlands.0001.desc:0 "Batıtoprakları'nın kayalık sırtları ve sarp tepeleri her türden vahşi yaratığa ev sahipliği yapar, ama hiçbiri köşeye sıkışmış aslan kadar zalim değildir.\n\nBölgemin daha kayalık bir bölümünü incelerken, bir dağın kalbine doğru ilerleyen bir dizi mağara keşfediyorum. Mağaraları ne kadar çok keşfedersem, dokunulmamış o kadar çok yer buluyorum.\n\nÖnümdeki bir sonraki karanlık girişi düşünürken, sabahın sessizliği korkunç bir kükremeyle yırtılıyor. Öndeki mağarada bir #N aslan#!'ın yaşadığını anında anlıyorum!"

 agot_filler_westerlands.0001.a:0 "Bir aslan mı? Elbette, onunla yüzleşmeliyim."

 agot_filler_westerlands.0001.a_tt:0 "Kılıcını çekip öldürmek için hazırlanıyorsun."

 agot_filler_westerlands.0001.b:0 "Bir düşününce, kaleye geri dönmeliyim."

 agot_filler_westerlands.0002.t:0 "Bir Aslanın Kükremesi"

 agot_filler_westerlands.0002.desc:0 "Kılıcım çekili, kavrayışım sıkı. Canavarın keskin pençeleri bana ulaşmadan önce yalnızca bir ya da iki temiz vuruş yapabileceğimi biliyorum.\n\n"Bu benim zafer anım," diyorum kendi kendime. Derin bir nefes alıp mağaraya dalıyorum."

 agot_filler_westerlands.0002.a:0 "Hakkımda şarkılar yazılacak!"

 agot_filler_westerlands.0002.a_tt:0 "Ama ne diyecekler?"

 agot_filler_westerlands.0003.t:0 "Bir Aslanın Kükremesi"

 agot_filler_westerlands.0003.desc:0 "Aslanın pençeleri gerçekten de keskindi — ama bana ulaşacak kadar uzun değildi. Mağaraya dalışım zavallı canavarı ürküttü ve beni parçalamadan önce aslana serbestçe vurup biçmeyi başardım.\n\nNe yazık ki postu kana bulanmış; harika bir ganimet olurdu."

 agot_filler_westerlands.0003.a:0 "En azından o şarkıyı yazabilirler!"

 agot_filler_westerlands.0004.t:0 "Yaşlı Adamın Değerli Taşı"

 agot_filler_westerlands.0004.desc:0 "Boş zamanımı çoğu kez dinlenmek için ormanda gezinerek geçiririm. Bugünkü yürüyüşümde yaşlı bir adama rastlıyorum. Genelde halkı görmezden gelirdim, ama bu adam ilgimi çekmeye can atıyor...\n\nYaşlı adam kendini [old_man_filler1.GetFirstNameNoTooltip] olarak tanıtıyor ve atalarının her zaman sıradan insanlar olmadığını iddia ediyor. "Bir zamanlar senin gibi lordlardık," diyor dişlek bir sırıtışla hırıltılı sesiyle. "Ama koltuğumuzu nasıl kaybettiğimiz başka bir günün şarkısı..."\n\nCebinden tuhaf bir mücevher çıkarıyor. Kırmızı ve altın tonlarında parıldıyor. "Atalarım zengindi. Bu mücevher, bir zamanlar kudretli yönetimimizin son kalıntılarından biri. İlgini çektiğini görüyorum," sırıtışı sert bir kaş çatmayla katılaşıyor. "Bu mücevherden ayrılabilirim, ama bedeli ağır olur...""

 agot_filler_westerlands.0004.a:0 "Eh, bu oldukça nadir bir buluntuya benziyor!"

 agot_filler_westerlands.0004.a_tt:0 "Ama ya sahteyse..."

 agot_filler_westerlands.0004.b:0 "Ben bir soyluyum. İstediğimi alırım!"

 agot_filler_westerlands.0004.b_tt:0 "Mücevheri zorla alıyorsun."

 agot_filler_westerlands.0004.c:0 "Hayır, teşekkürler. Bu davetsiz ziyaret endişelerimi daha da artırdı."

 agot_filler_westerlands.0005.t:0 "Yaşlı Adamın Değerli Taşı"

 agot_filler_westerlands.0005.desc:0 "Kırmızı-altın mücevherle oynayıp duruyorum. Onun için ödediğim bedele değdi mi? Gerçekten de sönmüş bir hanedanın son kalıntısı olabilir mi?\n\nKâhyam [steward.GetTitledFirstName], endişeli halimi fark edip bana akıl veriyor. "Mücevheri bana emanet et, kökeninin gerçekliğini ben değerlendireyim," diyor [steward.GetSheHe]. Mücevher [steward.GetHerHis] ellerinde bulmadan cevap verecek fırsatım bile olmuyor..."

 agot_filler_westerlands.0005.a:0 "Umarım bu, gönlümü ferahlatır."

 agot_filler_westerlands.0005.a_tt:0 "Ama kâhyana gerçekten güveniyor musun?"

 agot_filler_westerlands.0006.t:0 "Yaşlı Adamın Değerli Taşı"

 agot_filler_westerlands.0006.desc:0 "Kalede kâhyamı [steward.GetCouncilTitle] bir haftadır kimse görmedi; kimse ona emanet ettiğim görevi bilmiyor. Taht odamda bir ileri bir geri yürüyüp duruyorum, giderek tedirginleşiyorum.\n\nMücevheri elde etmek için yaşadıklarımın ardından artık eminim: #N Kâhyam [steward.GetCouncilTitle], kırmızı-altın mücevheri kendisi için çaldı!#!"

 agot_filler_westerlands.0006.a:0 "O domuz!"

 agot_filler_westerlands.0006.a_tt:0 "Belki de yeni bir kâhya bulmalısın..."

 agot_filler_westerlands.0007.t:0 "Yaşlı Adamın Değerli Taşı"

 agot_filler_westerlands.0007.desc:0 "[steward.GetTitledFirstName], titreyerek taht salonuna giriyor — korkudan mı öfkeden mi, bilemiyorum. "[ROOT.Char.GetLadyLord]'um, görünüşüm için özür dilerim, ama... üzücü haberlerim var," diye kekeliyor [steward.GetSheHe].\n\n"Açık konuş," diye ısrar ediyorum. Ardından, bir iç çekişle [steward.GetSheHe], cebinden kırmızı-altın mücevheri çıkarıyor. [steward.GetHerHis] bakışından, gerçekliğini doğrulama araştırmasının sona erdiğini anlayabiliyorum.\n\n"Sahte, [ROOT.Char.GetLadyLord]'um," diyor [steward.GetSheHe], #italic 'mücevheri'#! bana geri verirken."

 agot_filler_westerlands.0007.a:0 "Kahrol!"

 agot_filler_westerlands.0007.a_tt:0 "Kâhyana hamle yaparken bedenini bir aslan öfkesinin kapladığını hissediyorsun."

 agot_filler_westerlands.0007.b:0 "Kahrolası hırsız!"

 agot_filler_westerlands.0007.b_tt:0 "Böyle bir oyuna nasıl kandın?"

 agot_filler_westerlands.0008.t:0 "Yaşlı Adamın Değerli Taşı"

 agot_filler_westerlands.0008.desc:0 "Kâhyama doğru atılıyorum, o sadece bir haberci olsa da öfkem dışarı taşıyor.\n\nNe yazık ki kâhyam savunma için kılıcına uzanıyor ve ben tepki vermekte biraz yavaş kalıyorum..."

 agot_filler_westerlands.0008.a:0 "Tanrılar aşkına, ne yaptım ben?"

 agot_filler_westerlands.0008.a_tt:0 "Bu kadar kan..."

 agot_filler_westerlands.0009.t:0 "Yaşlı Adamın Değerli Taşı"

 agot_filler_westerlands.0009.desc:0 "[steward.GetTitledFirstName], titreyerek taht salonuna giriyor — korkudan mı heyecandan mı, bilemiyorum. "Efendim, görünüşüm için özür dilerim, ama... #bold harika#! haberlerim var," diyor soluk soluğa. Açıkça aceleyle gelmiş.\n\n"Açık konuş," diye ısrar ediyorum. Nefes nefese cebinden kırmızı-altın mücevheri çıkarıyor. Bakışından, gerçekliğini doğrulama araştırmasının sona erdiğini anlayabiliyorum.\n\n"Bu mücevher kusursuz, efendim," diyor, onu bana uzatırken. "Gerçekten de sönmüş Reyne Hanedanı'nın bir hazinesi olduğunu doğrulayabildim!""

 agot_filler_westerlands.0009.a:0 "Gerçekten de nadir bir buluntu!"

 agot_filler_westerlands.0009.a_tt:0 "Ama bu şu anlama mı geliyor... Tanıştığım o yaşlı adam..."

 agot_filler_westerlands.0010.t:0 "Bir Kaya Kayması"

 agot_filler_westerlands.0010.desc:0 "Batıtoprakları'nda tehlikeler eksik olmaz, özellikle de sarp tepeler ve kayalık dağlar arasında.\n\n[steward.GetTitledFirstName] ile bölgemdeki kayalık bir araziyi incelerken bir ulak telaşla yanımıza yaklaşıyor. "Nedir?" diye araya giriyor [steward.GetCouncilTitle].\n\n"Özür dilerim, amacım sizi bölmek değil, ama yerel bir köyden haber aldık; devasa bir kaya kayması kasabaya giren çıkan hayati ticaret yolunun bir bölümünü silip süpürmüş," diye açıklıyor ulak. "Kasaba halkı bu zor zamanda yardım için efendilerine sesleniyor.""

 agot_filler_westerlands.0010.a:0 "Böyle şeyler olur..."

 agot_filler_westerlands.0010.a_tt:0 "Bu kasaba halkının sorunu kendi başlarına çözebileceğinden eminsin."

 agot_filler_westerlands.0010.b:0 "Adamlarım bunu halledebilir."

 agot_filler_westerlands.0010.c:0 "Kasaba halkı beni çağırıyor mu dedin?"

 agot_filler_westerlands.0010.c_tt:0 "Kendin gideceksin — ve ne kadar özenle yönettiğini herkese göstereceksin."

 agot_filler_westerlands.0011.t:0 "Öfkeli Yerel Kasaba Halkı"

 agot_filler_westerlands.0011.desc:0 "Uzun bir günün sonu yaklaşıyor. Danışmanlarımla konuşmamızı bitirirken, genellikle sakin olan taht salonuma taşkın bir gürültü doluyor.\n\nÖfkeyle öne bir dilekçe sahibi çıkıyor. "Efendim, ihtiyacımız olduğu anda bizi ihmal ettiniz! Ana ticaret yolumuzu tahrip eden kaya kayması yüzünden analar ve bebekler açlıktan öldü. Kanları sizin ellerinizde," diyor ve muhafızlar onu arkadaşlarıyla birlikte saraydan sürükleyip çıkarmadan önce."

 agot_filler_westerlands.0011.a:0 "Ne yapmam gerekiyordu?"

 agot_filler_westerlands.0011.a_tt:0 "Görünüşe göre bunu temizlemen için adamlarını göndermen gerekecek..."

 agot_filler_westerlands.0012.t:0 "Düşen Kayalar Temizlendi"

 agot_filler_westerlands.0012.desc:0 "Mareşalim [marshal.GetCouncilTitle] [marshal.GetTitledFirstName], yüzünde gururlu bir ifadeyle taht salonuna giriyor. "Efendim, kaya kaymasının hasarını temizlemeye gönderdiğiniz adamlardan haber geldi," diye neşeyle anlatıyor [marshal.GetSheHe]. "Yol temizlendi ve kasaba halkı övgülerini iletiyor. Adamlar şu an kaleye dönüş yolunda.""

 agot_filler_westerlands.0012.a:0 "Tanrılara şükür!"

 agot_filler_westerlands.0012.a_tt:0 "Artık kasaba halkı seni övecek."

 agot_filler_westerlands.0012.b:0 "Adamlarım bir kahraman karşılamasını hak ediyor!"

 agot_filler_westerlands.0012.b_tt:0 "Ve Lannisport'tan getirttiğin bolca baharatlı bal şarabın herkese yeter."

 agot_filler_westerlands.0013.t:0 "Kaya Kaldırma Zamanı"

 agot_filler_westerlands.0013.desc:0 "Kaya kaymasının olduğu yere vardım ve durum, ulakın anlattığı kadar kötü. Kocaman kayaçlar bir çocuğun oyuncakları gibi oraya buraya saçılmış. Yolun kendisi neredeyse geçilmez.\n\nBu işi kendi ellerime almamın vakti geldi."

 agot_filler_westerlands.0013.a:0 "Bölgeyi taramak için adamlarımdan bir grup yöneteceğim."

 agot_filler_westerlands.0013.b:0 "Arabalarımı ve atlarımı getireceğim."

 agot_filler_westerlands.0013.b_tt:0 "Ama kasaba halkına bir ulak gönder, yardım edebilecek güçlü kuvvetli adamları getirsin..."

 agot_filler_westerlands.0013.c:0 "Bana bir an ver, bir çözüm düşüneyim."

 agot_filler_westerlands.0013.c_tt:0 "Belki kuşatma silahlarımızın mekanizmasını kullanarak kayaçları daha çabuk kaldırabilirsin..."

 agot_filler_westerlands.0013.d:0 "Bunu nasıl düzelteceğimi tam da biliyorum!"

 agot_filler_westerlands.0013.d_tt:0 "Birkaç hızlı eskiz ve ayrıntılı bir planlama ile bu kayaçları kısa sürede kaldırırsın."

 agot_filler_westerlands.0013.e:0 "Uhhh, ben neredeyim? *Salyaları akıyor*"

 agot_filler_westerlands.0013.f:0 "Neden şimdiden bitkin düştüm?"

 agot_filler_westerlands.0014.t:0 "Düşen Kayalar Temizlendi"

 agot_filler_westerlands.0014.desc:0 "Sonunda, kaya kaymasının yol açtığı hasar onarıldı. Kayaçları temizlemeye yardım eden herkes rahat bir nefes alabilir ve ticaret resmen yeniden başladı."

 agot_filler_westerlands.0014.a:0 "Ve nihayet dinlenebilirim."

 agot_filler_westerlands.0015.t:0 "Düşen Kayalar Temizlendi"

 agot_filler_westerlands.0015.desc:0 "Çok geçmeden, kaya kaymasının yol açtığı hasar onarıldı. Ticaret resmen yeniden başladı ve halk beni övüyor."

 agot_filler_westerlands.0015.a:0 "Becerikli olmak güzel hissettiriyor!"

 agot_filler_westerlands.0015.a_tt:0 "Zihnin çözecek bulmacalara ihtiyacı var, tıpkı kılıcın bilezi taşa ihtiyacı olduğu gibi."

 agot_filler_westerlands.0016.t:0 "Düşen Kayalar Temizlendi"

 agot_filler_westerlands.0016.desc:0 "Çok geçmeden, kaya kaymasının yol açtığı hasar onarıldı. Hatta, ayrıntılı planlamam sayesinde ticaret yolları da epey iyileştirildi.\n\nKasaba halkı, fikrimin bu kadar kusursuz işlediğine hayret ediyor ve patikada yolculuk hiç bu kadar güvenli olmamıştı."

 agot_filler_westerlands.0016.a:0 "Bazen kendime hayret ediyorum!"

 agot_filler_westerlands.0016.a_tt:0 "Zihnin çözecek bulmacalara ihtiyacı var, tıpkı kılıcın bilezi taşa ihtiyacı olduğu gibi."

 agot_filler_westerlands.0017.t:0 "Yol Hasarı Daha da Kötüleşti"

 agot_filler_westerlands.0017.desc:0 "Görünüşe göre kayaçları temizlemeye ne kadar çok çalıştıysam, kayaların altındaki yol o kadar çok hasar gördü. Yolun asla temizlenmeyeceğini düşünmeye başlıyorum. Sessizce sıvışıp bunu bir daha hiç konuşmamak mümkün mü?"

 agot_filler_westerlands.0017.a:0 "Canı cehenneme!"

 agot_filler_westerlands.0017.a_tt:0 "Yeteneklerini fazla abartmış olabilirsin..."

 agot_filler_westerlands.0018.t:0 "Kayaçları Kaldırmaya Çalışmak"

 agot_filler_westerlands.0018.desc:0 "Uçurum kenarındaki yolu tamamen kapatan koca bir kaya parçasını kımıldatmaya kararlıyım, ama her çekişimde nefesim daha da kesiliyor..."

 agot_filler_westerlands.0018.a:0 "Kendimi bitkin hissediyorum..."

 agot_filler_westerlands.0018.a_tt:0 "Ama uçurumun kenarına ne kadar yakın duruyorsun?"

 agot_filler_westerlands.0019.t:0 "Sıçanlar! Tek Bir Çözüm Var..."

 agot_filler_westerlands.0019.desc:0 "Odamda uyanırken farelerin koşuşturmasını duyuyorum. Etrafıma bakınıyorum ve iğrenç kemirgenlerle çevrili olduğumu görüyorum. Ağırlıklarıyla beni kendi yatağımda hapsediyorlar! Küçük dişler tenimi kemiriyor!\n\nYerimden fırlıyorum! Uyan! Hepsi bir rüyaydı! Fareler... hayır. Fareler gerçek. Ya da gerçek olabilirler. Bir gün gerçek olabilirler! Hazırlıklı olmalıyım! Fareler için hazırlıklı olmalıyım! Bir aslan! Çözüm bir aslan! Bir aslan fareleri yer! Bir aslan bulmalıyım!"

 agot_filler_westerlands.0019.a:0 "Sıçanları avlaması için bir aslan yavrusu getirteceğim!"

 agot_filler_westerlands.0019.a.f:0 "Sana bir aslan yavrusu getirilmesi için çağrı yapacaksın."

 agot_filler_westerlands.0019.b:0 "Sıçanları avlaması için yetişkin bir aslan getirteceğim!"

 agot_filler_westerlands.0019.b.f:0 "Yetişkin bir aslanın size getirilmesi için çağrı yapacaksın."

 agot_filler_westerlands.0019.c:0 "Ne? Hayır, bu sadece bir rüyaydı."

 agot_filler_westerlands.0019.c.f:0 "Kendini toparlayacaksın!"
