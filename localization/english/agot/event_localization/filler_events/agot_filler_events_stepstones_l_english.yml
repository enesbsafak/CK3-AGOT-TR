l_english:

 agot_filler_stepstones.0001.t:0 "Büyük Fırtına"

 agot_filler_stepstones.0001.desc:0 "#S ÇARPMA#!! Kalemin dışında gök gürlüyor, şimşekler çakıyor. Bin ayak sesini andıran yağmur, içeride kıstırılan hepimizi sağır ederek duvarlarda ve çatıda dans ediyor. Rüzgâr içeri girebilmek için çaresizce duvarlara amansızca çarpıyor...\n\nYaz Denizi'nin sıcak sularından büyük bir fırtına koptu ve şimdi ada evimin üzerinden geçiyor; bizi kadim Fırtına Tanrısı'nınkiyle kıyaslanabilir bir öfkeyle cezalandırıyor. Neyse ki ahşap kalem beni ve değer verdiğim insanları güvende tutuyor. Bu fırtınadan önce kalenin sadece değer verdiklerim için olduğunu açıkça belirtmiştim; hizmetkârlarımdan aileme, hatta saray mensuplarıma kadar. Yine de adanın halkının — kölelerin, korsanların ve denizcilerin — iniltileri ve yalvarışları beni öfkelendiriyor. Hepsi #italic benim#! kaleme sığınmak istiyor!"

 agot_filler_stepstones.0001.a:0 "Fırtına düşündüğümden daha kötü; içeri alın."

 agot_filler_stepstones.0001.a.tt.a:0 "#X İnsanların kalende sığınmasına izin veriyorsun, her ne kadar yabancıları içeri almanın her zaman bir tehlike olasılığı taşıdığını bilsen de.#!"

 agot_filler_stepstones.0001.a.tt.b:0 "#italic Kötü bir şey olur#!"

 agot_filler_stepstones.0001.b:0 "Dediğim gibi, benim kalem, benim kurallarım."

 agot_filler_stepstones.0001.a.toast:0 "Fırtına [stepstonesfiller_location0001.GetName]'i Kasıp Kavuruyor!"

 agot_filler_stepstones.0002.t:0 "Eski Savaş Alanı"

 agot_filler_stepstones.0002.desc:0 "Diyarımda seyahat ederken, ilk başta tamamen sıradan ve sıkıcı görünen bir tarlada kamp kurduk. Çimenli, boş ve hatta biraz taşlık.\n\nEtrafta dolaşırken ayağım üst toprakta bir şeye çarpıyor... bir kılıç kabzası! Onu topraktan çekip çıkarıyorum ve kadim olduğunu görüyorum. Daha fazla dolaştıkça, tarlanın dört bir yanında daha fazla kırık eserle karşılaşıyorum: kırık bir Demirdoğan baltası, bir Tyrosh hançeri kabzası, hatta bir Yaz Adalı'nın yayı gibi görünen bir şey!\n\nBu eserlerin hepsi kırık, ama bana Stepstones'un zaman içinde birçok büyük savaşa sahne olduğunu hatırlatıyor."

 agot_filler_stepstones.0002.a:0 "Bazen bu adaların kanla sulandığını unutuyorum."

 agot_filler_stepstones.0003.t:0 "Fırtına Eserleri Sürüklüyor "

 agot_filler_stepstones.0003.desc:0 "Son zamanlarda [stepstones_holding.GetName] üzerinden küçük bir fırtına sistemi geçti. Küçük olsa da fırtına, liman açıklarında birkaç ticaret yelkenlisini batırdı. Sonuç olarak bu yelkenlilerden birçok eşya kıyıya vurdu: cesetler; silahlar; ticari mallar; ve en heyecan vericisi, altın dolu sandıklar!\n\n[stepstones_holding.GetName]'deki sahillerden birinde yürürken kıyıya vuran bu sandıklardan birine denk geliyorum. Görünüşe göre bölgedeki küçük halk bu yağma hazinesini henüz fark etmemiş... Belki de kargoyu — ihtiyatla — inceleyebilirim..."

 agot_filler_stepstones.0003.a:0 "Büyük İkramiye!"

 agot_filler_stepstones.0003.b:0 "Bu kadar alçalmam."

 agot_filler_stepstones.0004.t:0 "Fırtınalarla Harap Olan Stepstones"

 agot_filler_stepstones.0004.desc:0 "Stepstones'taki topraklarımla ilgili bir dizi rapor aldım.\n\nGörünüşe göre [ravaged_stepstones_holding.GetName], devasa bir fırtına sistemi tarafından tamamen harap edilmiş. Adadaki ahşap yapıların ve derme çatma barakaların çoğunun, tamamen yıkılmasa bile, ağır hasar gördüğü söyleniyor.\n\n[ravaged_stepstones_holding.GetName] halkı da bu fırtına sistemi yüzünden acı çekiyor. Çoğu öldü ve fırtınanın ardından gelen kaosta birçok kişi ölüyor. Hastalık dizginlerinden boşanmış, insanlar açlıktan ölüyor ve en kötüsü, otoritem uygulanmıyor."

 agot_filler_stepstones.0004.a:0 "Eminim o barakaların yerini doldurmak #italic çok#! zor olacak..."

 agot_filler_stepstones.0004.b.standard:0 "Ben, şey, onlar için dua edeceğim."

 agot_filler_stepstones.0004.b.religious:0 "Onlar için dua edeceğim."

 agot_filler_stepstones.0004.c:0 "Adanın sakinlerine yardım göndereceğim."

 agot_filler_stepstones.0005.t:0 "Han'daki Yaşlı Yağmacı"

 agot_filler_stepstones.0005.desc:0 ""Ve sonra, palamı #EMP sallayıp #!Braavoslu velet'in boğazından geçirdim," diye anlatıyor yaşlı Demirdoğan yağmacı bana; bira, yaralı ve sarkık çenesinden akıyor. [stepstonesfiller_location0005.GetName]'de bir handa içki içerken, bu yaşlı Demirdoğan yağmacı bana maceralarını anlatıp duruyor. Görünüşe göre gençliğinde epey atılgan bir yağmacıymış.\n\nİçtikçe sarhoş neşesi yerini kasvet ve karamsarlığa bırakıyor. Gözlerimin içine bakıp sarhoş sarhoş patlıyor: "Ama o günler çok geride kaldı. Bana sarhoş bir kalamar diyorlar... Amacı olmayan bir adam! Hah!" ve bir an bile duraksamadan çılgın hikâyelerine geri dönüyor."

 agot_filler_stepstones.0005.a:0 "Şimdilik işine yarayan tek şey bu, yaşlı kalamar, hikâyeler!"

 agot_filler_stepstones.0005.b:0 "Yeni bir korumaya ihtiyacım olabilir..."

 agot_filler_stepstones.0005.c:0 "Haha, senin için bir #italic iş#! biliyorum..."

 agot_filler_stepstones.0006.t:0 "Kalamar ve Kuğu"

 agot_filler_stepstones.0006.desc:0 ""#EMP HARRRRRRRRRK!#!" Ahşap kaleminin dışında bazı adamların bağırdığını duyuyorum. Güneş daha yeni doğuyor, yani bu adamlar adanını kıyısındaki su yollarını gözleyen muhafazlar olmalı, [stepstonesfiller_location0006.GetName].\n\nAcele giyinin dışarı fırlıyorum; bir muhafaz tarlada beni karşılıyor. Demirdoğan yağmacılarının yanından geçen bir Yaz Adalı kuğu gemisine saldırdığına dair bir şeyler bağırıyor!\n\nDerme çatma bir kuleye koşup meşe boyalı merdivenleri ikişer ikişer çıkıyorum ve aralarında neredeyse bir parmak mesafe kalmış gemileri görüyorum. Yaz Adalı oklarının Demirdoğanlara saplanışını seçebiliyorum ve yağmacıların sadistçe savaş naralarını ta buradan duyabiliyorum..."

 agot_filler_stepstones.0006.a:0 "Neyi bekliyoruz? İkisine de saldırın!"

 agot_filler_stepstones.0006.a.tt_success:0 "İki gemide de ortalığı kasıp kavuruyorsun, kaos sırasında ikisinden de başarıyla yağmalıyorsun"

 agot_filler_stepstones.0006.a.tt_success_title:0 "Başarılı Saldırı!"

 agot_filler_stepstones.0006.a.tt_failure:0 "Her iki geminin mürettebatıyla savaşmakta zorlanıyorsun. Daha kötüsü, bu süreçte kendi gemilerin de hasar aldı"

 agot_filler_stepstones.0006.a.tt_failure_title:0 "Kuğu, Kalamar ve Üçüncü Teker"

 agot_filler_stepstones.0006.a.tt_failure_desc:0 "Her iki geminin mürettebatıyla savaşmakta zorlanıyorsun. Daha kötüsü, bu süreçte kendi gemilerin de hasar aldı"

 agot_filler_stepstones.0006.b:0 "Kavgadan sonra elimizden geleni toplarız..."

 agot_filler_stepstones.0006.b.0_gold:0 "Altın bulamadın"

 agot_filler_stepstones.0006.b.10_gold:0 "10 altın buldun"

 agot_filler_stepstones.0006.b.25_gold:0 "25 altın buldun"

 agot_filler_stepstones.0006.b.50_gold:0 "50 altın buldun"

 agot_filler_stepstones.0006.b.75_gold:0 "75 altın buldun"

 agot_filler_stepstones.0006.c:0 "Of. Güneş daha yeni doğdu, kimin umurunda?"

 agot_filler_stepstones.0006.d:0 "Savaşsınlar, gücümüzü korumamız gerekecek."

 agot_filler_stepstones.0007.t:0 "Yaz Adalı Ticareti"

 agot_filler_stepstones.0007.desc:0 "Yaz Adaları'nın renklerini taşıyan Büyük Bir Gemi [location.GetName]'e yanaştı ve kaptan bir teklifle yanıma geldi. Seyahatlerinin büyük hikâyeleri arasında, büyük bir yeni ticaret yolu kurma görevinde olduğunu ve gemisinin güvertesinde anavatanından bir dizi egzotik mal getirerek ürünlerinin bir kısmını benimle takas etmek istediğini söylüyor. Bir papağanı, bir maymunu ve bir dizi başka egzotik hayvanı ile bir dizi nadir baharat ve boyası var.\n\nBu malları altın dahil birçok şeyle takas etmeye hazır. Papağan bana doğru gaklıyor: "Daha çok altın, daha az gak!" Kaptan cevabımı bekliyor."

 agot_filler_stepstones.0007.a:0 "Papağanı alacağım, başka bir şey değil."

 agot_filler_stepstones.0007.b:0 "Baharatlardan tatabilir miyim?"

 agot_filler_stepstones.0007.c:0 "Mallarına ihtiyacım yok."

 agot_owns_pet_parrot:0 "Evcil Papağan"

 agot_owns_pet_parrot_desc:0 "Bu karakterin omzunda, bir Yaz Adalı tüccarın hediyesi olan gaklayan bir Kızıl Amerika Papağanı oturuyor."

 agot_owns_unique_spices:0 "Egzotik Baharatlar"

 agot_owns_unique_spices_desc:0 "Bu karakter, Yaz Adaları'ndan bir dizi nadir baharat elde etti; bunlar Stepstones pazarlarında yüksek fiyat bulacağından ya da yerel mutfağa güzelce eşlik edeceğinden emin."
