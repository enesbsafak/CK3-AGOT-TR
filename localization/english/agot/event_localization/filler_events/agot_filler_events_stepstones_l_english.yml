### TODO NOT-IN-ST: agot_filler_stepstones.0002.desc [AGOT: While traveling across my domain, we pitched camp at what first seemed like a completely ordinary and boring field. Grassy, empty, and even a little stony.\n\nWhile I'm walking around my foot strikes something in the topsoil...a sword hilt! I pull it out of the dirt and see that it's ancient. As I walk around more, I encounter more and more broken artifacts all over the field: a broken Ironborn axe, a Tyroshi dagger hilt, even what appears to be a Summer Islander's bow!\n\nAll of these artifacts are broken, but it does remind me that the Stepstones have been host to many a great battles over time.]
 agot_filler_stepstones.0002.desc:0 "While traveling across my domain, we pitched camp at what first seemed like a completely ordinary and boring field. Grassy, empty, and even a little stony.\n\nWhile I'm walking around my foot strikes something in the topsoil...a sword hilt! I pull it out of the dirt and see that it's ancient. As I walk around more, I encounter more and more broken artifacts all over the field: a broken Ironborn axe, a Tyroshi dagger hilt, even what appears to be a Summer Islander's bow!\n\nAll of these artifacts are broken, but it does remind me that the Stepstones have been host to many a great battles over time."
