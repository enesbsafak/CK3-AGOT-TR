### TODO NOT-IN-ST: agot_filler_stepstones.0001.desc [AGOT: #S CRASH#! The thunder booms and the lightning cracks outside my fortress. A thousand footsteps of rain dances across the walls and roof, deafening all of us trapped inside. The wind relentlessly slams into the walls, desperately finding a way to get inside...\n\nA major storm has blown in from the warm waters in the Summer Sea and is now passing over my island abode, punishing us with a wrath comparable to the Storm God of old. Fortunately, my wooden fortress is keeping me and those I find valuable safe. I've made it very clear before this storm that this fortress is only for those I value, from my servants to my family and even my courtiers. Yet, I am being enraged by the moans and pleas of some of the island's folk — slaves, pirates, and sailors. They all want shelter, in #italic my#! fort!]
 agot_filler_stepstones.0001.desc:0 "#S CRASH#! The thunder booms and the lightning cracks outside my fortress. A thousand footsteps of rain dances across the walls and roof, deafening all of us trapped inside. The wind relentlessly slams into the walls, desperately finding a way to get inside...\n\nA major storm has blown in from the warm waters in the Summer Sea and is now passing over my island abode, punishing us with a wrath comparable to the Storm God of old. Fortunately, my wooden fortress is keeping me and those I find valuable safe. I've made it very clear before this storm that this fortress is only for those I value, from my servants to my family and even my courtiers. Yet, I am being enraged by the moans and pleas of some of the island's folk — slaves, pirates, and sailors. They all want shelter, in #italic my#! fort!"
