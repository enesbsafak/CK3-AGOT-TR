### TODO NOT-IN-ST: agot_filler_stepstones.0004.desc [AGOT: A number of reports have come to me concerning my demesne in the Stepstones.\n\nApparently, [ravaged_stepstones_holding.GetName] has been utterly ravaged by a massive storm system. I am told that most of the wooden structures and ramshackle shacks on the island have been severely damaged, if not outright destroyed.\n\nThe people of [ravaged_stepstones_holding.GetName] are also suffering as a result of this storm system. Many are dead, and in the ensuing chaos following the storm, many are dying. Disease is running rampant, people are starving, and worst of all, my authority is not being enforced.]
 agot_filler_stepstones.0004.desc:0 "A number of reports have come to me concerning my demesne in the Stepstones.\n\nApparently, [ravaged_stepstones_holding.GetName] has been utterly ravaged by a massive storm system. I am told that most of the wooden structures and ramshackle shacks on the island have been severely damaged, if not outright destroyed.\n\nThe people of [ravaged_stepstones_holding.GetName] are also suffering as a result of this storm system. Many are dead, and in the ensuing chaos following the storm, many are dying. Disease is running rampant, people are starving, and worst of all, my authority is not being enforced."
