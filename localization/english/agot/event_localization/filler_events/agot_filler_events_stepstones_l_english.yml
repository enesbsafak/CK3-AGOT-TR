### TODO NOT-IN-ST: agot_filler_stepstones.0003.desc [AGOT: A minor storm system has recently passed over [stepstones_holding.GetName]. While minor, the storm still sunk a few trading cogs off port. As a result, a number of items from these cogs are washing ashore: dead bodies; weapons; trade goods; and most exciting, chests full of gold!\n\nWhile walking along one of the beaches on [stepstones_holding.GetName], I happen to come across some one of these chests that were washed ashore. It seems the smallfolk in the area have not yet spotted this trove of loot...Perhaps I can — discreetly — inspect the cargo...]
 agot_filler_stepstones.0003.desc:0 "A minor storm system has recently passed over [stepstones_holding.GetName]. While minor, the storm still sunk a few trading cogs off port. As a result, a number of items from these cogs are washing ashore: dead bodies; weapons; trade goods; and most exciting, chests full of gold!\n\nWhile walking along one of the beaches on [stepstones_holding.GetName], I happen to come across some one of these chests that were washed ashore. It seems the smallfolk in the area have not yet spotted this trove of loot...Perhaps I can — discreetly — inspect the cargo..."
