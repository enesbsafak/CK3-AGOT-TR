l_english:

 agot_filler_crownlands.0001.t:0 "Ejderhakayası'nda Bir Gün"

 agot_filler_crownlands.0001.desc:0 "Ejderhakayası kalesinin kapısının kendi adını taşıyan taşından geçip adanın kum karışık toprağına çıkıyorum. Güneş suyun üzerinde parlıyor, ışıltılı ışınlarını Ejderhadağı'nın heybetli siluetinin üzerine döküyor. Ada ne kadar ürkütücü olsa da, kendine özgü bir biçimde oldukça güzel olabiliyor.\n\nUzun zamandır ilk kez, ilgilenilecek acil bir mesele yok. Açgözlü dilekçe sahipleri yok, entrika çeviren saray mensupları yok, öfkeli lordlar yok. Sadece ben ve ada. Bugün ne yapsam?"

 agot_filler_crownlands.0001.a_normal:0 "Bahçelerde vakit geçireceğim."

 agot_filler_crownlands.0001.a_aegon:0 "Aegon'un Bahçesi'ne bir bakalım."

 agot_filler_crownlands.0001.b:0 "Ejderhadağı'nın mağaralarını keşfedelim!"

 agot_filler_crownlands.0001.b_tt:0 "Biraz [stress|E] kaybedebilirsin"

 agot_filler_crownlands.0001.b_tt_2:0 "Özel bir şey bulma şansın var"

 agot_filler_crownlands.0001.c:0 "Gün boyu dinleneceğim."

 agot_filler_crownlands.0002.t:0 "Ejderhakayası'nda Bir Gün: Keskin Kayalar"

 agot_filler_crownlands.0002.desc:0 "Ejderhakayası kıyısının keskin kayaları haindir; dalgalar, zaten kaygan olan siyah taşı kaplayan bir serpintiyle onlara çarpar. Yine de mağaralara süzülen ışık güzeldir, gölgeler obsidyenin yüzeyinde dans eder. Tuzlu havayı içime çekiyorum, çevremde kamçılanan rüzgârı hissediyorum. Muhteşem.\n\nAncak kaleye geri yürürken ayağımın kaydığını hissediyorum! Düşüyorum, elim keskin kayalara sürtünüyor. Derin bir kesik değil, ama rahatlamamı mahvetti. Daha dikkatli olmalıydım."

 agot_filler_crownlands.0002.a:0 "Ah!"

 agot_filler_crownlands.0003.t:0 "Ejderhakayası'nda Bir Gün: Güzel Mağaralar"

 agot_filler_crownlands.0003.desc:0 "Ejderhakayası'nın mağaraları güzeldir; dış dünyadan içeri süzülen ışık, obsidyen duvarlarda güzel bir gölge dansı yaratır. Mağaraların derinliklerine indikçe küçük bir oyuk buluyorum; ışık tavandaki bir delikten süzülüp odanın üzerine ve daha öteki bir salona akıyor.\n\nİçeri adım attığımda beni bir hayranlık hissi kaplıyor — oda, muhteşem bir yeraltı mağarasının küçük bir seyir balkonundan ibaret! Işık tavandaki delikten süzülüyor, mağaranın mistik güzellikteki tüm oluşumları üzerinde dans eden güzel bir ışık saçıyor. Daha kayda değer bir iş için fazla derinde olsa da, gerçekten görülmeye değer bir manzara!"

 agot_filler_crownlands.0003.a:0 "Ne muhteşem!"

 agot_filler_crownlands.0004.t:0 "Ejderhakayası'nda Bir Gün: Geçmişten Gelen Armağanlar"

 agot_filler_crownlands.0004.desc:0 "Ejderhakayası'nın uçurumlarında yükseklerde yürüyorum; aşağıdaki kayalara çarpan dalgaların sesi, kulaklarımda yanardağın yavaş gümbürtüsüyle karışıyor. Yürürken küçük bir açıklık buluyorum — mağara keşfime başlamak için mükemmel bir yer.\n\nKayaların üzerine süzülen ışığın rehberliğinde bir kaya sırtının üzerinden tırmanıyorum. Ana salondan birçok geçit ayrılıyor, ama ışık sanki bana yol gösterir gibi tek bir obsidyen damarından süzülüyor. Onu takip ediyorum ve beni getirdiği yere inanamıyorum.\n\nSalonun ortasında bir yumurta duruyor, ışık tam üstünde sona eriyor! Ama ona dokunur dokunmaz zamanın akışı kendini belli ediyor ve ışık sönmeye başlıyor. Işık tamamen sönüp beni karanlığa hapsetmeden yumurtayı kapıp mağaradan çıkmaya zar zor vakit buluyorum.\n\nNefes nefese, yorgunluktan sendeleyerek mağaradan çıkıyorum, yumurta ellerimde!"

 agot_filler_crownlands.0004.a:0 "Yakınmış, ama buna değdi!"

 agot_filler_crownlands.0004.tt:0 "Bir Ejderha Yumurtası [artifact|E] kazandın"
