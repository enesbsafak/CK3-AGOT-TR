l_english:

 agot_filler_rhllor.0001.t:0 "Işık Tanrısı"

 agot_filler_rhllor.0001.desc:0 "Uğursuz bir gecede, kendimi çalışma odamda yalnız buluyorum; raporları ve genellikle alt tabaka insanlara bırakılan ayrıntıları gözden geçiriyorum. Aniden kapı gıcırdayarak açılıyor ve hiçbir seremoni olmadan içeri bir kadın giriyor. Baştan aşağı kırmızıya bürünmüş, saçları ateş gibi ve garip biçimde melodik, derin bir sesle konuşuyor. Tedirgin edici biçimde güzel ve bir an için uyuyakalmış olabileceğimi düşünüyorum. Ama gözümü kırptığımda hâlâ orada.\n\nKızıl Kadın bana bir kehanetten, Işık Tanrısı'ndan ve uzun zaman önceki derslerden hatırladığım bir isimden bahsediyor: Azor Ahai, tuz ve duman arasında doğan Işıkgetiren'in sahibi — bilinen dünyanın kurtarıcısı.\n\nYaklaşıp kulağıma fısıldıyor, kaderini sahiplenme, Asshai kadar uzaktaki tapınaklarda görülen kehanetleri gerçekleştirme vaktinin geldiğini söylüyor. Tek yapmam gereken onu kapmak..."

 agot_filler_rhllor.0001.a:0 "Dinleyeceğim, ama başka bir şey yok."

 agot_filler_rhllor.0001.b:0 "Bu işaretlere kulak vermeliyim..."

 agot_filler_rhllor.0001.b.tt:0 "...çünkü gece karanlık ve dehşetlerle doludur."

 agot_filler_rhllor.0001.c:0 "Bu işaretlere kulak vermeliyim... ve #italic dahasına#! da..."

 agot_filler_rhllor.0001.d:0 "Defol, iğrenç cadı! Benim üzerimde hiçbir nüfuzun yok!"

 agot_filler_rhllor.0001.e:0 "Muhafızlar! Suikastçı!"

 agot_filler_rhllor.0002.t:0 "Işığı Kucaklamak"

 agot_filler_rhllor.0002.desc:0 "Işık Tanrısı'nı kucakladığımdan beri inancım içimde yeniden alevlendi, adıma ışıltılı bir parıltı saçıyor.\n\nKızıl Tanrı'ya olan bu derin bağlılığı onurlandırmak için belki de yeni bir arma benimsemeyi düşünmeliyim — hanedanıma hâlâ saygı gösteren, ama Işık Tanrısı'nın ateşli özünü ve kutsal alevlerini yansıtan bir arma. İnancımın sancağımda parlamasına izin verecek bu şansı yakalayayım mı, yoksa hanedanımın geleneksel silahlarını mı koruyayım?"

 agot_filler_rhllor.0002.a:0 "R'hllor'un alevleri sancağımıza yol göstersin."

 agot_filler_rhllor.0002.b:0 "Geleneksel silahlarımızı koruyacağım."

 agot_filler_rhllor.0002.tt:0 "R'hllor tarzında kişisel bir arma kazanıyorsun"

 agot_filler_rhllor.0020.t:0 "[current_location.GetNameNoTooltip]'in Kızıl Rahibi"

 agot_filler_rhllor.0020.desc:0 "[current_location.GetNameNoTooltip]'in hareketli sokaklarında ilerlerken, [companion.GetTitledFirstName] ve ben önümüzde büyüyen gürültüyü fark etmeden edemiyoruz. Önümüzde toplanan kalabalığın uğultusu giderek yükseliyor — fazla odunla beslenen bir kamp ateşi gibi.\n\nKalabalığın önünde, ateşli bir konuşma yapan bir R'hllor kızıl rahibi duruyor ve dinleyicileri kendinden geçmiş bir teslimiyete sürüklüyor. [red_priest.GetHerHis|U] her sözcüğü dinleyicileri daha da çılgına çeviriyor gibi...\n\n#italic "Çevremizde gece kararıyor, içimizdeki ışığı boğuyor... Efendi'nin ışığı, varlığımızın ta kendisi olan alev, fedakârlık ister!"#! [red_priest.GetFirstNamePossessive] gürleyen sesi havayı deliyor; [red_priest.GetHerHis] gözleri benimkilerle kilitleniyor. "Oho! #italic Burada#! #italic ne#! varmış? Halkın arasına karışmaya gelmiş kudretli bir [ROOT.Char.GetLadyLord|l]."\n\nAni sessizlik, iki parmak arasında söndürülen bir mum alevi gibi çevremizi sarıyor, ama bakışım [red_priest.GetFirstNameNoTooltip]'e kilitlenmiş kalıyor. "Işık Tanrısı'nın #italic gerçek#! yüzünü görmek için ne verirdin?" #italic [red_priest.GetHerHis] gözleri [red_priest.GetHerHim]'in yanındaki yanmakta olan bir kazığa kayıyor.#!"

 agot_filler_rhllor.0020.a:0 "Sadece bir [ROOT.Char.GetLadyLord]'un kanı olur."

 agot_filler_rhllor.0020.b:0 "Işık Tanrısı [companion.GetFirstNameNoTooltip]'i kesinlikle kabul ederdi."

 agot_filler_rhllor.0020.c:0 "Sanırım [current_location.GetNameNoTooltip]'den gitme vakti geldi"
