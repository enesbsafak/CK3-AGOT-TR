### TODO NOT-IN-ST: agot_filler_war.400.desc [AGOT: The fighting has been thick in the Riverlands, as it always is when war rages. While riding through a pillaged hamlet our column broaches the crest of a hill, and gruesome sight twists into view. A gnarled tree with naked branches jutting from its crown. Dangling from these cruel fingers are corpses of this village's populace, swaying in the breeze like abandoned marionettes.\n\nThe grim atmosphere is pierced by a shrill cry. I spur my horse, and gallop to the foot of the tree, where I discover the source of the wailing. The babe looks up at me, swaddled in muck and gore. His mother, grasped by the noose mere feet above him, bloats. How could it have possibly survived?\n'Leave it, my [ROOT.Char.GetLadyLord]' speaks [soldier.GetFullName]. 'It is a bad omen. Better a feast for the crows.']
 agot_filler_war.400.desc:0 "The fighting has been thick in the Riverlands, as it always is when war rages. While riding through a pillaged hamlet our column broaches the crest of a hill, and gruesome sight twists into view. A gnarled tree with naked branches jutting from its crown. Dangling from these cruel fingers are corpses of this village's populace, swaying in the breeze like abandoned marionettes.\n\nThe grim atmosphere is pierced by a shrill cry. I spur my horse, and gallop to the foot of the tree, where I discover the source of the wailing. The babe looks up at me, swaddled in muck and gore. His mother, grasped by the noose mere feet above him, bloats. How could it have possibly survived?\n'Leave it, my [ROOT.Char.GetLadyLord]' speaks [soldier.GetFullName]. 'It is a bad omen. Better a feast for the crows.'"
