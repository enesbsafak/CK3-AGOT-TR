l_english:

 agot_filler_war.200.t:0 "Ölüm Yamaçlarından Aşağı"

 agot_filler_war.200.desc:0 "Savaş! Cephede yorgunluk baş gösteriyor... Kayıplar artarken, çöken gökyüzüne karanlık hükmediyor ve kıyım başladı."

 agot_filler_war.200.list_1:0 "Soyumun sonuncusuyum.. Eğer düşersem, sadık atım ve elimde sımsıkı kavradığım mızrağımla hatırlanmaya değer bir düşüş olsun."

 agot_filler_war.200.list_2:0 "Artık kendimi toparlayamıyorum, içimde bir savaşçı ruhu yok."

 agot_filler_war.200.a:0 "Yaptıklarım hakkında şarkılar söyleyecekler..."

 agot_filler_war.200.a_tt:0 "Kaderimle yüzleşmek için ileri atılıyorum..."

 agot_filler_war.200.b:0 "Çevremde kaos hüküm sürüyor... Ben yaşamalıyım."

 agot_filler_war.200.b_tt:0 "Hızla sıvışıyorsun..."

 agot_filler_war.201.t:0 "Ölüm Yamaçlarından Aşağı"

 agot_filler_war.201.desc:0 "Gözlerimin önünde ateş tarlaları beliriyor, şövalyelerimin boruları hücum işaretini veriyor.. Acı içinde ölen adamların korkusunu ve acısını kokluyorum, dost ve düşman. Bu bir insanı deli edebilir. Ama tarlada kaderim beni bekliyor ve kadim zamanlardan beri kehaneti söylenmiş olsun... berrak bir tepede duruyor, keskin demir dişleri ve nefret dolu yanan gözleriyle bir canavar."

 agot_filler_war.201.a:0 "Ne geleceğini artık biliyorum. Kaçmaya çalışmak faydasız... Olacak olur.. "

 agot_filler_war.201.a_tt:0 "olsun bitsin. Son nefesimi vereyim, akrabalarımın sonuncusu..."

 agot_filler_war.202.t:0 "Ölüm Yamaçlarından Aşağı"

 agot_filler_war.202.desc:0 "Ne olacaksa olsun, olsun bitsin! Rakibim ayaklarımın dibinde ölü yatıyor. Bakışım savaş alanında gezindiğinde, düşmanın kanadından bozguna uğramaya başladığını görüyorum. Eylemlerim günü kazandırdı ve son [GetPlayer.GetDynasty.GetBaseName]'in adamlarını korkusuz bir hücumla zafere nasıl götürdüğüne dair şarkılar söylenecek."

 agot_filler_war.202.a:0 "Bana bir ozan topluluğu bulun. Bugünkü kahramanlıklarımın haberini yaysınlar."

 agot_filler_war.202.a_tt:0 "Öyle olsun."

 agot_filler_war.202.b:0 "Adamlarımın bana böyle hayranlıkla bakması... gerçekten bir şey."

 agot_filler_war.202.b_tt:0 "Bana ihtiyaçları var."

 agot_filler_war.203.t:0 "Ölüm Yamaçlarından Aşağı"

 agot_filler_war.203.desc:0 "Tuttuğum ozan topluluğunun lideri geri döndü; yaptıklarımın hikâyeleri Ayı Adası'ndan Stepstones'a ve ötesine kadar söyleniyor."

 agot_filler_war.203.a:0 "Ve daha birçoğu yazılsın."

 agot_filler_war.203.b:0 "Sanırım biri yeter."

 agot_filler_war.203.b_tt:0 "Fazla ileri gitmeyelim..."

 agot_filler_war.300.t:0 "Kırık Adamların Ahmaklığı"

 agot_filler_war.300.desc:0 "Savaşın bitiminden sonra adamlarımdan bazıları yakındaki bir köyü kirletti. Zavallı sakinler için yapılacak bir şey yok - adamlarım savaştan sarsılmış ve tedirgin olmuştu, köylülerin canını umursamadılar. En azından sonunda kılıçtan geçirildiler. Adamlarının üzerlerinde işlediği geçmiş dehşetleri düşünerek bir ömür geçirmekten kurtuldular."

 agot_filler_war.300.a:0 "Tecavüz edip yağmalayanları asın — bizler savaşın cehenneminin tutsağıyız; bu, bize sıradan haydutlar gibi davranma lisansı vermez."

 agot_filler_war.300.a_tt:0 "Köylülere adalet ver."

 agot_filler_war.300.b:0 "Ne yapmış olurlarsa olsunlar askerlerimizin canını böyle çöpe atamayız. Savaştayız. Onları yola diz, disipline et."

 agot_filler_war.300.b_tt:0 "Adamlarımı cezalandırmak savaşı kazanmama yardım etmez."

 agot_filler_war.400.t:0 "Asılan Adam"

 agot_filler_war.400.desc:0 "Nehir Toprakları'nda çatışmalar kızışıyor; savaşlar devam ederken her zamanki gibi. Yağmalanmış bir mezradan geçen kolumuz bir tepenin sırtına ulaşıyor ve göz kamaştırıcı bir manzara önümüze seriliyor. Çıplak dalları tepesinden fırlayan buruşuk bir ağaç. Bu zalim parmaklardan sarkan, rüzgârda terk edilmiş kuklalar gibi sallanan cesetler var: köyün ahalisi.\n\nKasvetli atmosferi tiz bir çığlık deliyor. Atımı mahmuzluyorum ve ağacın dibine dörtnala gidiyorum; orada feryadın kaynağını buluyorum. Bebek bana bakıyor, çamur ve kana sarılı. Annesi, birkaç adım üstündeki ilmikte asılı, şişmiş. Nasıl hayatta kalmış olabilir?\n'Bırak onu, [ROOT.Char.GetLadyLord]'um' diyor [soldier.GetFullName]. 'Kötü bir alamet. Kargalara yem olması daha hayırlı.'"

 agot_filler_war.400.a:0 "Çocuğu burada bırakamayız."

 agot_filler_war.400.b:0 "Savaşa giden adamların piçlerle dönmesi yaygındır..."

 agot_filler_war.400.c:0 "Burada bırak, bu kötü bir alamet."
