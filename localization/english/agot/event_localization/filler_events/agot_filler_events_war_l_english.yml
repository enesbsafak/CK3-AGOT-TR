### TODO NOT-IN-ST: agot_filler_war.300.desc [AGOT: At the wake of the battle's end, some of my men desecrated a nearby village. There's nothing to do for the poor inhabitants - my men were shaken and disturbed by war and cared not for the lives of the peasants. At least they were put to the sword in the end. Saved them from a lifetime of dwelling on past horrors committed upon them by your men.]
 agot_filler_war.300.desc:0 "At the wake of the battle's end, some of my men desecrated a nearby village. There's nothing to do for the poor inhabitants - my men were shaken and disturbed by war and cared not for the lives of the peasants. At least they were put to the sword in the end. Saved them from a lifetime of dwelling on past horrors committed upon them by your men."
