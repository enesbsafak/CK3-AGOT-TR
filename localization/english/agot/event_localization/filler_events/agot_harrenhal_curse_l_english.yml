l_english:

 agot_harrenhal_curse.title:0 "Harrenhal Laneti:"

 agot_harrenhal_curse.0002.t:0 "$agot_harrenhal_curse.title$ Kaygan Basamaklar"

 agot_harrenhal_curse.0002.desc:0 "Dehşet Kulesi'nin sarmal merdivenlerinden birinde inerken, yanlış bir adım kalbimin hızla çarpmasına yol açıyor. Düşüşte boynumun kırılmasını mucizevi biçimde atlatarak [ROOT.Char.GetFaith.HighGodName]'e hızlı bir dua ediyorum.\n\nİçimi bir rahatlama kaplıyor; ardından suçluyu fark ettiğimde hemen ardından #italic dehşet#! geliyor... küçük bir #N kan#! gölü! Dudaklarımdan bir nefes kaçıyor — çünkü o kızıl gölün içinde #S Harrenhal Laneti#!'nin hayaleti kıpırdanıyor gibi görünüyor; kulenin tarihine yapışmış rahatsız edici fısıltıların ve hikâyelerin anılarını tetikliyor.\n\nBelki bu kanın kaynağı, yeni kesilmiş koyun ya da geyik etinin dökülmüş halidir; ama içimdeki o sinsi hissi bir türlü atamıyorum: #italic bu duvarların içinde daha karanlık güçler iş başında#!."

 agot_harrenhal_curse.0002.a:0 "Kahyama haber vereceğim!"

 agot_harrenhal_curse.0002.a.tt:0 "Besbelli mutfak görevlilerinin cezalandırılması gerekecek..."

 agot_harrenhal_curse.0002.b:0 "İmdat! İmdat! Bu Kara Harren'in hayaleti!"

 agot_harrenhal_curse.0002.b.tt:0 "Burası gerçekten lanetli..."

 agot_harrenhal_curse.0003.t:0 "$agot_harrenhal_curse.title$ Fareler!"

 agot_harrenhal_curse.0003.desc:0 "Orta avlunun büyük bölümünü gezmiştim ki birden bir gerçeği fark ediyorum: para kesem alışılmadık biçimde hafif... Yakından incelediğimde, bir köşesine kemirilmiş bir delik açıldığını keşfediyorum.\n\n#S Harrenhal Laneti#!'nde herhangi bir gerçek payı varsa, o da kalenin korkunç fareler için bir üreme alanı olduğuna dair fısıldanan inanıştır."

 agot_harrenhal_curse.0003.a:0 "Benim talihsizliğim, bir başkasının talihi olabilir..."

 agot_harrenhal_curse.0003.a.tt:0 "Umarım birileri faydalanır..."

 agot_harrenhal_curse.0003.b:0 "Burada, ölü krallardan daha çok hayalet var."

 agot_harrenhal_curse.0003.b.tt:0 "Böyle bir tarih varken..."

 agot_harrenhal_curse.0003.c:0 "Gelecekte daha az altınla seyahat edeceğim."

 agot_harrenhal_curse.0003.c.tt:0 "Öğrenilecek bir ders!"

 agot_harrenhal_curse.0004.t:0 "$agot_harrenhal_curse.title$ Demirdoğan Yağmacı"

 agot_harrenhal_curse.0004.desc:0 "Yanmış et kokusunun hafif kaynağını bulmaya çalışırken, hava ansızın ilik donduran bir savaş narasıyla çatırdadı. Gölgelerden, elinde baltayla bir Demirdoğan yağmacı gök gürültüsü gibi üzerime doğru koşuyor.\n\n#italic Dehşet verici çığlığın ve yanmış et kokusunun kaynağı bu muydu?#!\n\nDüşüncelerim ansızın, Harrenhal'ın inşacısı; "#Z taş yanmaz#!" diye inanacak kadar kibre kapılan [hoare.GetFirstNameNicknamed] [hoare.GetHouse.GetName]'e kayıyor. Yine de, tam da bu duvarların içinde Kara Korku onun yanıldığını kanıtladı — onu küle çevirdi; trajik kaderini, olmasa bile tüm Westeros'un değil, kalenin tarihine sonsuza dek kazıdı..."

 agot_harrenhal_curse.0004.a:0 "Buradan çıkmalıyım!"

 agot_harrenhal_curse.0004.a.tt:0 "Umarım bu yalnızca bir kâbus..."

 agot_harrenhal_curse.0004.b:0 "Ha! Ölü Demirdoğanların hayaletleri beni korkutmaz."

 agot_harrenhal_curse.0004.b.tt:0 "Hayalet ya da rüya, geri adım atmayacağım."

 agot_harrenhal_curse.0004.c:0 "Yediklerimden olmalı..."

 agot_harrenhal_curse.0004.c.tt:0 "Kalenin bira stokları bozulmuş olmalı; bu yalnızca bir rüya..."

 agot_harrenhal_curse.0004.success_title:0 "Hayaleti alt ettin!"

 agot_harrenhal_curse.0004.failure_title:0 "Kaçamadın..."

 agot_harrenhal_curse.0005.t:0 "$agot_harrenhal_curse.title$ Alevli Bir Hayalet"

 agot_harrenhal_curse.0005.desc:0 "Gece için odalarıma doğru ilerlerken, odanın ortasına bir banyo küveti konmuş olduğunu görüp sarsılıyorum. Şokum, kısa sürede dehşete dönüşüyor... küvet #N kanla#! dolu!!\n\nAniden, kızıl saçlı bir kadın kızıl çorbadan beliriyor; hâli son derece sakince, çelik gibi bir bakışla bana odaklanıp diyor ki,\n\n"İyi Efen[ROOT.Char.GetLadyLord|l]'im, banyo yaptığımı görmüyor musun? Defol, yoksa kelleni alırım... ya da daha fazlasını!""

 agot_harrenhal_curse.0005.a:0 "Ben... ben... Hanımefendi, size kötülük etmeye niyetim yok!"

 agot_harrenhal_curse.0005.a.tt:0 "[danelle.GetFirstNameNicknamed] [danelle.GetHouse.GetName]! Yaşadığım için şanslıyım."

 agot_harrenhal_curse.0005.b:0 "Üzgünüm... ben... Yanlış oda..."

 agot_harrenhal_curse.0005.b.tt:0 "Yemin edebilirim ki burası benim odamdı..."

 agot_harrenhal_curse.0005.c:0 "Bir kişilik daha yer var mı?"

 agot_harrenhal_curse.0005.c.tt:0 "Bu muhtemelen korkunç bir fikir..."

 agot_harrenhal_curse.0006.t:0 "$agot_harrenhal_curse.title$ Taşta Bir Baston"

 agot_harrenhal_curse.0006.desc:0 "#italic Tap... tap...#! #S tap...#! Ses, çevremdekilerin fark etmeyeceği kadar hafif. Kaynağını merak ederek, bu nazik tıkırtıyı takip etmeyi deniyorum. Sonunda beni, tek başına kırık bir adamın durduğu darağacına götürüyor; bacağından biri bastonla destekleniyor, bakışları kelle kesmekte kullanılan bir kütüğe kilitlenmiş.\n\nOnun kim olduğunu ve neden burada olduğunu sorduğumda, ciddi bir ifadeyle yanıtlıyor: "Ben [larys.GetFirstNameNicknamed] [larys.GetHouse.GetName], ve yalnızca #S ölmenin en kötü yolunu#! düşünüyorum."\n\nDaha tepki veremeden, adam sanki darağacının gölgeleri tarafından yutulmuşçasına gözlerimin önünde kayboluyor.\n\nBu..."

 agot_harrenhal_curse.0006.a:0 "Gözlerim... oyun oynuyor olmalı..."

 agot_harrenhal_curse.0006.a.tt:0 "Besbelli o kişi burada olamaz..."

 agot_harrenhal_curse.0006.b:0 "Topal Ayak! Tanrılar, bu kale bana neden böyle eziyet ediyor?"

 agot_harrenhal_curse.0006.b.tt:0 "Eksik bacak... başka kimse olamaz..."

 agot_harrenhal_curse.0006.c:0 "Larys Strong mu? Yedi cehennemde topallayıp dursun."

 agot_harrenhal_curse.0006.c.tt:0 "İnancım bu hayaletlerden daha güçlü..."

 agot_harrenhal_curse.0007.t:0 "$agot_harrenhal_curse.title$ Dehşet Verici Bir Gelin"

 agot_harrenhal_curse.0007.desc:0 "Odalarıma girdiğimde, yatağımda oturan, yanaklarından yaşlar süzülen bir adam görünce şaşırıyorum.\n\n"Ne neşeli bir gün, değil mi? Kızım artık bir prenses!" diye haykırıyor, gölgelerde bekleyen genç bir kadını işaret ederek.\n\n"Kuşkusuz Prens Maegor'a ve yeni evli karısı olan kızıma bir hediye sunmak için buradasınız..." diye sürdürüyor ağlayan adam; konuşurken eli rahatça hançerinin kabzasında duruyor."

 agot_harrenhal_curse.0007.a:0 "Evet... bir hediye... #S işte#!!"

 agot_harrenhal_curse.0007.a.tt:0 "Ödemek en iyisi... altın, hayatından çok daha ucuz..."

 agot_harrenhal_curse.0007.b:0 "Bu soytarı oyunu yeter!"

 agot_harrenhal_curse.0007.b.tt:0 "Besbelli bu, saray erkanından ya da konuklardan birinin oyunu..."

 agot_harrenhal_curse.0007.c:0 "Ben bir prenses görmüyorum! Yalnızca Harroway fahişesini!"

 agot_harrenhal_curse.0007.c.tt:0 "İnancın bu hayaletlerden daha güçlü."

 agot_harrenhal_curse.0007.d:0 "Buradan çıkmalıyım!"

 agot_harrenhal_curse.0007.d.tt:0 "Kaçmayı deniyorsun."

 agot_harrenhal_curse.0008.t:0 "$agot_harrenhal_curse.title$ Kana Gark Olmuş"

 agot_harrenhal_curse.0008.desc:0 "Tatlı [danelle.GetFirstNamePossessive] yumuşak sesi, yanıma eğilirken kulağımı okşuyor; gençlik ışıltısının sırlarını benimle paylaşıyor. Dudaklarında zarif bir gülümseme belirerek, yanında ölümsüzlerin saflarına katılmam için beni çağırıyor.\n\n"Aşkım," diye fısıldıyor, sözleri narin bir melodi gibi, "Son derece basit bir iksir; sonsuz güzelliğin ve canlılığın anahtarı. Malzemeler, bir kılıç sallayışıyla kolayca elde edilir." Gözleri, başka bir diyardan gelmiş bir cazibeyle parıldıyor; zamanın hüküm sürmediği ve ölümlülüğün önemsizliğe büründüğü bir diyara davet ediyor beni.\n\nAma [ROOT.Char.GetFaith.HighGodName] benim hakkımda ne düşünürdü?"

 agot_harrenhal_curse.0008.a:0 "Güzel olacağım..."

 agot_harrenhal_curse.0008.a.tt:0 "Sana sırlarını öğretecek."

 agot_harrenhal_curse.0008.b:0 "Hayır... [agot_curse_bath_victim.GetHerHim]'e zarar vermeyeceğim.."

 agot_harrenhal_curse.0008.b.tt:0 "[agot_curse_bath_victim.GetFirstNamePossessive] hayatı, onun sunduğu şeye değmez..."

 agot_harrenhal_curse.0009.t:0 "$agot_harrenhal_curse.title$ Geçmişten Dersler "

 agot_harrenhal_curse.0009.desc:0 "Gün boyunca [hoare.GetFirstNameNicknamed] kulağıma fısıldadı durdu. "Bu yöne çevrilmiş bir bıçak atardamarı keser, buradan saplanan bir darbe adamı öldürür, ama #italic çok hızlı olmamak şartıyla#!." Sesinde kötü bir bilgelik damlayan [hoare.GetFirstNameNicknamed], karanlık hikmetini bana aktarırken her adımıma yön veriyor. Her fısıltılı dersle, deliliğin uçurumuna daha da battığımı hissediyorum.\n\nGece çöküp salonlar sessizleşince, koridorlarda dolaşan [agot_curse_sword_victim.GetFirstName]'e rastlıyoruz. Harren kulağıma eğilip fısıldıyor: "Sana öğrettiklerimin iyi bir işe yarayacağını bana göstermenin zamanı geldi..."\n\n"Yap!" diye haykırıyor, #S "Şimdi yap!"#!"

 agot_harrenhal_curse.0009.a:0 "#italic *kılıcı çeker*#!"

 agot_harrenhal_curse.0009.a.tt:0 "Tekniğimi çalışmalıyım..."

 agot_harrenhal_curse.0009.b:0 "Hayır... [agot_curse_sword_victim.GetHerHim]'e zarar vermeyeceğim!"

 agot_harrenhal_curse.0009.b.tt:0 "[agot_curse_sword_victim.GetHerHis|U] hayatı, onun sunduğu şeye değmez..."

 agot_harrenhal_curse.0009.success_title:0 "Sen bir katilsin..."

 agot_harrenhal_curse.0009.failure_title:0 "[agot_curse_sword_victim.GetSheHe|U] kaçtı..."

 agot_harrenhal_curse.0010.t:0 "$agot_harrenhal_curse.title$ Harika Bir Ziyafet"

 agot_harrenhal_curse.0010.desc:0 "Koku o kadar nefis ki, #S kızarmış etlerle#! dolu masaları görünce ürperiyorum. Konuklar çok olsa da, bu baş masanın etrafında oturanların pek azını tanıyorum — [hoare.GetFirstNameNicknamed], [larys.GetFirstNameNicknamed] ve hatta Harroway Prensesi [alys.GetFirstName] bile varlığıyla bizi onurlandırıyor.\n\nBazıları bana yabancı yüzlerdi; ama diğerleri gibi onlar da, aç kurtlar gibi bir hırsla sunulanları yiyip bitirdiler. Tatlı [danelle.GetFirstName] gibi, bir zamanlar gururlu Harrenhal sakinleri olup ortak tarih ve #italic açlık#! tarafından bir araya çekilmiş olabilirler mi?\n\nAniden Danelle yaklaşıyor ve içinde kırmızı bir şey olan bir kadeh uzatıyor; yüzünde zarif bir gülümseme: "Katıl bize aşkım, etler soğumadan," diye ısrar ediyor; sesi, bu harika ziyafete katılmaya bir müzikal davet."

 agot_harrenhal_curse.0010.a:0 "Her şey çok lezzetli, Danelle!"

 agot_harrenhal_curse.0010.a.tt:0 "Ana yemeğin #italic kim#! olduğunu merak ediyorsun?"
