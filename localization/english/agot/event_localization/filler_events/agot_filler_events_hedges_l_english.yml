l_english:

 agot_filler_hedges.0001.t:0 "Kuklacı"

 agot_filler_hedges.0001.desc:0 "Sarayıma bir Braavoslu kuklacı geldi; [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName], yerel küçük halk arasında yeteneği hakkında konuşulduğunu duyunca onu hanedanım için bir gösteri yapmaya davet etmeye karar vermiş. "

 agot_filler_hedges.0001.a:0 "Gösteriyi görmeyi dört gözle bekliyorum!"

 agot_filler_hedges.0001.b:0 "Gösteriyi görmeyi dört gözle bekliyorum!"

 agot_filler_hedges.0002.t:0 "Kuklacı"

 agot_filler_hedges.0002.desc:0 "Kukla gösterisi eğlenceliydi! Kuklacı hanedanım için birkaç gösteri yaptı; bazıları neşeli ve komikti, bazılarının tonu ise daha karanlıktı. Sonuçta, fazlasıyla eğlendim!"

 agot_filler_hedges.0002.a:0 "Rahiplere [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]'in daha sık gösterici davet etmesine izin vermeliyim!"

 agot_filler_hedges.0002.b:0 "Karakterlerinden birine gerçekten içten bir bağ hissettim!"

 agot_filler_hedges.0003.t:0 "Kuklacı"

 agot_filler_hedges.0003.desc:0 "Kukla gösterisi rahatsız ediciydi... Kuklacı seyirci için birkaç gösteri yaptı; ancak komik olanlardan biri, benimle ve [GetPlayer.GetHouse.GetBaseName] Hanedanı ile alay ediyormuş gibi geldi!"

 agot_filler_hedges.0003.a:0 "Umarım halkın önünde benimle bu şekilde alay etmemiştir..."

 agot_filler_hedges.0004.t:0 "Kuklacı"

 agot_filler_hedges.0004.desc:0 "Kukla gösterisi dehşet vericiydi! Sadece kukla olsalar da, hikâye ve adamın sesini değiştirme biçimi beni iliklerime kadar ürpertti..."

 agot_filler_hedges.0004.a:0 "Bu gece mum ışığında uyuyacağım..."

 agot_filler_hedges.0005.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0005.desc:0 "[wandering_hedgeknight.GetTitledFirstName], bir çit şövalyesi, sarayıma geldi. Yolculuğuna devam etmeden önce kalemde kısa bir süre dinlenmek için izin istedi. Karşılığında, kalışı süresince hizmetini teklif etti."

 agot_filler_hedges.0005.a:0 "Fazladan bir çift el kesinlikle işe yarar."

 agot_filler_hedges.0005.a.tt:0 "#bold Bu Çit Şövalyesi özelliksiz başlayacak, olay ilerledikçe özellikler kazanacak# "

 agot_filler_hedges.0005.b:0 "Çitlere geri dön ve orada dinlen, serseri!"

 agot_filler_hedges.0006.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0006.desc:0 "Avlumda yürürken, [wandering_hedgeknight.GetTitledFirstName]'i bir gölgeliğin altında dinlenirken görüyorum; kalışı sırasında bana sunduğu hizmeti yapamayacak kadar uykuyla meşgul..."

 agot_filler_hedges.0006.a:0 "Demek böyle bir şövalyesin..."

 agot_filler_hedges.0006.b:0 "Onun gibi olmak istiyorum!"

 agot_filler_hedges.0007.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0007.desc:0 "Misafirperverliğimin karşılığında [wandering_hedgeknight.GetTitledFirstName]'e silahhanemi denetlemesini, kalitesini garanti altına almasını söyledim. Ne sevindim ki, bu işi ciddiye almış görünüyor; kılıçlar, baltalar ve topuzlar ayna gibi parlatılmış."

 agot_filler_hedges.0007.a:0 "Demek böyle bir şövalyesin!"

 agot_filler_hedges.0007.b:0 "Onun gibi olmak istiyorum!"

 agot_filler_hedges.0008.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0008.desc:0 "[wandering_hedgeknight.GetTitledFirstName] avluda çalışıyordu ama ilerlemesi yavaştı. Hanedanımdaki tüm çocuklar sinek gibi etrafında vızıldayıp yol hayatı hakkında sorularla onu bunaltıyordu. O da işi ile çocukları eğlendirmek arasında bir denge kurmak için elinden geleni yapıyordu."

 agot_filler_hedges.0008.a:0 "Demek böyle bir şövalyesin!"

 agot_filler_hedges.0008.b:0 "Onun gibi olmak istiyorum!"

 agot_filler_hedges.0009.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0009.desc:0 "[wandering_hedgeknight.GetTitledFirstName] ile birkaç silahlı adamımın yanında karşılaştım. Boş zamanlarında, topluluk zar atıyordu; [wandering_hedgeknight.GetTitledFirstNameNoTooltip] bunda olağanüstü yetenekli görünüyordu. Ancak silahlı adamlardan birkaçı daha sonra, onun atışlarının biraz fazla iyi olduğunu söyledi..."

 agot_filler_hedges.0009.a:0 "Demek böyle bir şövalyesin sen.."

 agot_filler_hedges.0009.b:0 "Onun gibi olmak istiyorum!"

 agot_filler_hedges.0010.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0010.desc:0 "[wandering_hedgeknight.GetTitledFirstName]'e oldukça basit bir iş verdim; benim yüklediğim bazı el emeği işlerini bitirirken küçük halkımdan bazılarını denetlemek. [wandering_hedgeknight.GetTitledFirstNameNoTooltip] onları gerçekten de denetledi, ama gerekenden ağır bir elle..."

 agot_filler_hedges.0010.a:0 "Demek böyle bir şövalyesin..."

 agot_filler_hedges.0010.b:0 "Onun gibi olmak istiyorum!"

 agot_filler_hedges.0011.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0011.desc:0 "[wandering_hedgeknight.GetTitledFirstNameNoTooltip] gün boyu avluda antrenman yaptı, hanedan muhafızlarımdan birkaçıyla kılıç talimi yaptı. "

 agot_filler_hedges.0011.a:0 "Görünüşe göre kılıç kullanmayı biliyor."

 agot_filler_hedges.0012.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0012.desc:0 "[wandering_hedgeknight.GetTitledFirstName] ve [active_councillor.GetTitledFirstName] gün boyu derin bir sohbet içindeydiler; stratejinin inceliklerini tartışıp tarihi savaşları analiz ettiler."

 agot_filler_hedges.0012.a:0 "Görünüşe göre [wandering_hedgeknight.GetTitledFirstNameNoTooltip] epey taktikçi biri."

 agot_filler_hedges.0013.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.0013.desc:0 "Sonunda [wandering_hedgeknight.GetTitledFirstName]'in geldiği çitlere dönme vakti geldi. Ayrılmadan önce huzuruna çıkıyor ve misafirperverliğin için içten teşekkürlerini sunuyor, ayrılmadan önce başka bir hizmeti olup olamayacağını soruyor."

 agot_filler_hedges.0013.a:0 "Yollarda çürüme, sarayıma katıl"

 agot_filler_hedges.0013.b:0 "Ona sadece iyi yolculuklar diledim."

 agot_filler_hedges.9000.t:0 "Gezgin Çit Şövalyesi"

 agot_filler_hedges.9000.desc:0 "[wandering_hedgeknight.GetTitledFirstNamePossessive] sarayımdaki süresi, [wandering_hedgeknight.GetHerHis] vaktisiz ölümü yüzünden kısa kesildi. Sanırım [wandering_hedgeknight.GetSheHe]'nin sahip olabileceği potansiyeli asla bilemeyeceğiz..."

 agot_filler_hedges.9000.a:0 "Talihsizlik."

 agot_filler_hedges.0014.t:0 "Gezgin Paralı Asker"

 agot_filler_hedges.0014.desc:0 "[wandering_sellsword.GetTitledFirstName] adında bir paralı asker bugün sarayıma geldi ve önce [ROOT.Char.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName] ile konuştuktan sonra iş aramak için huzuruma çıktı. "

 agot_filler_hedges.0014.a:0 "Senin becerilerine sahip adamlara ihtiyacım var"

 agot_filler_hedges.0014.b:0 "Küçük halka korumam olmadan hayatın nasıl olduğunu hatırlat"

 agot_filler_hedges.0014.c:0 "Senin tayfandan bana fayda yok."

 agot_filler_hedges.0015.t:0 "Gezgin Üstat"

 agot_filler_hedges.0015.desc:0 "[traveling_maester.GetTitledFirstName], hizmet edeceği Lord'un sarayına yolculuğuna devam etmeden önce kısa bir süre kalacak yer aramak için kaleme geldi."

 agot_filler_hedges.0015.a:0 "Kale'nin her üstadı salonlarımda hoş karşılanır"

 agot_filler_hedges.0015.b:0 "Kesinlikle yerimiz yok."

 agot_filler_hedges.0016.t:0 "Gezgin Üstat: Kuzgunculuk"

 agot_filler_hedges.0016.desc:0 "Bugün kalemin koridorlarında yürürken misafirim [traveling_maester.GetTitledFirstName] ile karşılaşıp sohbet etmeye başladım; konuşma sırasında zincirinde siyah demirden bir halka olduğunu fark ettim. Bunu ona açtım ve uzun uzun kuzgunculuk hakkında konuşmaya başladık."

 agot_filler_hedges.0016.a:0 "Gerçekten aydınlatıcı bir sohbet."

 agot_filler_hedges.0017.t:0 "Gezgin Üstat: Savaş Sanatı"

 agot_filler_hedges.0017.desc:0 "Bugün kalemin koridorlarında yürürken misafirim [traveling_maester.GetTitledFirstName] ile karşılaşıp sohbet etmeye başladım; konuşma sırasında zincirinde demirden bir halka olduğunu fark ettim. Bunu ona açtım ve uzun uzun savaş sanatı hakkında konuşmaya başladık."

 agot_filler_hedges.0017.a:0 "Gerçekten aydınlatıcı bir sohbet."

 agot_filler_hedges.0018.t:0 "Gezgin Üstat: Muhasebe"

 agot_filler_hedges.0018.desc:0 "Bugün kalemin koridorlarında yürürken misafirim [traveling_maester.GetTitledFirstName] ile karşılaşıp sohbet etmeye başladım; konuşma sırasında zincirinde altından bir halka olduğunu fark ettim. Bunu ona açtım ve muhasebe ile kâhyalık üzerine uzun uzun konuşmaya başladık."

 agot_filler_hedges.0018.a:0 "Gerçekten aydınlatıcı bir sohbet."

 agot_filler_hedges.0019.t:0 "Gezgin Üstat: Zehircilik"

 agot_filler_hedges.0019.desc:0 "Bugün kalemin koridorlarında yürürken misafirim [traveling_maester.GetTitledFirstName] ile karşılaşıp sohbet etmeye başladım; konuşma sırasında zincirinde kurşundan bir halka olduğunu fark ettim. Bunu ona açtım ve uzun uzun zehirler ve panzehirler hakkında konuşmaya başladık."

 agot_filler_hedges.0019.a:0 "Gerçekten aydınlatıcı bir sohbet."

 agot_filler_hedges.0020.t:0 "Gezgin Üstat: Tarih"

 agot_filler_hedges.0020.desc:0 "Bugün kalemin koridorlarında yürürken misafirim [traveling_maester.GetTitledFirstName] ile karşılaşıp sohbet etmeye başladım; konuşma sırasında zincirinde bakırdan bir halka olduğunu fark ettim. Bunu ona açtım ve uzun uzun tarihler hakkında konuşmaya başladık."

 agot_filler_hedges.0020.a:0 "Gerçekten aydınlatıcı bir sohbet."

 agot_filler_hedges.0021.t:0 "Gezgin Üstat"

 agot_filler_hedges.0021.desc:0 "[traveling_maester.GetTitledFirstName], yolculuğuna dönmeden önce huzuruma çıktı ve cömertliğin ile misafirperverliğin için bana bol bol teşekkür etti. Ayrıca yeni efendisine ve kaledeki meslektaşlarına bilimsel kavrayışımın genişliğini ve derinliğini mutlaka anlatacağını söyledi. "

 agot_filler_hedges.0021.a:0 "Açıkça iyi bir izlenim bırakmışım."

 agot_filler_hedges.0022.t:0 "Gezgin Üstat"

 agot_filler_hedges.0022.desc:0 "[traveling_maester.GetTitledFirstName] huzuruma çıktı ve misafirperverliğim için biraz da olsa öylesine teşekkür etti. Bilimsel meselelerdeki içgörülerimi övdü, ama üslubu zekâm hakkında pek iyi düşünmediğini ele veriyordu..."

 agot_filler_hedges.0022.a:0 "Görünüşe göre beni ahmak yerine koyuyor."

 agot_filler_hedges.0023.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0023.desc:0 "Bugün sarayıma tuhaf bir adam geldi; saray mensubundan çok bir serseriye benziyor. Adam, bir çit büyücüsü olduğunu açıklıyor ve bana faydalı olabileceğini ilan ediyor. Muhafazlarım çit büyücüsünü sarayımdan atmak için harekete geçmeye başlıyor."

 agot_filler_hedges.0023.a:0 "Bir dur... Ne diyeceğini dinleyelim."

 agot_filler_hedges.0023.b:0 "Belli ki akli dengesi yerinde değil."

 agot_filler_hedges.0024.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0024.desc:0 "Çit büyücüsü, içi türlü hayvan kemikleriyle dolu bir keseyi yere boşaltıp kendi kendine konuşmaya başladı. Bir süre sonra ayağa kalktı ve White Harbor'ın yakında kürke umutsuzca ihtiyaç duyacağını ilan etti!"

 agot_filler_hedges.0024.a:0 "Kuzey... kürke mi ihtiyaç duyuyor? Sanırım biraz gönderebilirim."

 agot_filler_hedges.0024.b:0 "Ne büyük vakit kaybı."

 agot_filler_hedges.0025.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0025.desc:0 "Çit büyücüsü, içi türlü hayvan kemikleriyle dolu bir keseyi yere boşaltıp kendi kendine konuşmaya başladı. Bir süre sonra ayağa kalktı ve kumun Sunspear'da çok pahalıya satılacağını ilan etti!"

 agot_filler_hedges.0025.a:0 "Dorne'da bolca kum yok mu? Sanırım göreceğiz"

 agot_filler_hedges.0025.b:0 "Ne büyük vakit kaybı."

 agot_filler_hedges.0026.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0026.desc:0 "Çit büyücüsü, içi türlü hayvan kemikleriyle dolu bir keseyi yere boşaltıp kendi kendine konuşmaya başladı. Bir süre sonra ayağa kalktı ve Gulltown'a balkabağı göndererek altın kazanılacağını ilan etti!"

 agot_filler_hedges.0026.a:0 "Vadi balkabaklarıyla meşhur değil mi? Sanırım göreceğiz"

 agot_filler_hedges.0026.b:0 "Ne büyük vakit kaybı."

 agot_filler_hedges.0027.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0027.desc:0 "White Harbor'a gönderdiğim kürk sevkiyatının fahiş bir fiyata satıldığı haberini aldım! Görünüşe göre binlerce post içeren bir depo, benimki limana varmadan hemen önce alevlere teslim olmuş! "

 agot_filler_hedges.0027.a:0 "Haklı olduğuna inanamıyorum."

 agot_filler_hedges.0028.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0028.desc:0 "Sunspear'a gönderdiğim kum yüklü geminin kaptanı gerçekten de çok kurnaz bir adammış. Limana varınca Essos'tan yelken açtığını ve getirdiği kumun Rhoyne deltasından olduğunu ilan etti. Büyük bir Yeşilkan Yetimi grubu kuma fahiş bir fiyat ödedi!"

 agot_filler_hedges.0028.a:0 "Haklı olduğuna inanamıyorum."

 agot_filler_hedges.0029.t:0 "Çit Büyücüsü: Kâr"

 agot_filler_hedges.0029.desc:0 "Balkabağı sevkiyatım Gulltown'a varmadan hemen önce, çevredeki bölgede devasa bir kara çürüklük salgını balkabağı mahsulünü kırıp geçirmiş ve fiyatların tam da sevkiyatımın varacağı sırada fırlamasına neden olmuştu! Görünüşe göre gemi kaptanı, satın almak için gelen tüccarları neredeyse zorla uzak tutmak zorunda kalmış."

 agot_filler_hedges.0029.a:0 "Haklı olduğuna inanamıyorum."

 agot_filler_hedges.0030.t:0 "Çit Büyücüsü: Alay Konusu"

 agot_filler_hedges.0030.desc:0 "Nasıl bu kadar ahmak olabildim, o deli serseriye güvendim... Sevkiyatım varınca limanda onu gemi kaptanından alacak tek bir tüccar bile yoktu. Daha kötüsü, içine yatırım yaptığım o saçma planın haberi diyarın dört bir yanındaki soyluların kulağına ulaştı! Tüm emeğim ve tüm param boşa gitti!"

 agot_filler_hedges.0030.a:0 "Kahrolası Çit Büyücüsü!"

 agot_filler_hedges.0030.b:0 "Muhafızlar! Gidin ve onu bulun!"

 agot_filler_hedges.0031.t:0 "Gezgin Ozan"

 agot_filler_hedges.0031.desc:0 "[traveling_bard.GetTitledFirstName], halk arasında sevilen bir gezgin ozan, sarayıma geldi. Yerel bir toprak sahibi onu, benim ve hanedanım için çalabilmesi amacıyla bana yönlendirmeye teşvik etmiş.\n\nGösteriden önce yanıma gelip kulaklarıma en hoş gelecek müziğin türünü sordu."

 agot_filler_hedges.0031.a:0 "Sade, dindar bir balad"

 agot_filler_hedges.0031.b:0 "Belki benim hakkımda bir türkü?"

 agot_filler_hedges.0031.c:0 "[GetPlayer.GetHouse.GetBaseName] Hanedanı'nın yiğitliğini dillendirin!"

 agot_filler_hedges.0031.d:0 "Müziğini başka yere götür, serseri!"

 agot_filler_hedges.0032.t:0 "Gezgin Ozan"

 agot_filler_hedges.0032.desc:0 "[traveling_bard.GetTitledFirstName]'in performansı kusursuz geçti, hanedanımdan tek bir kişi bile etkilenmeden kalmadı! İstediğim baladdan başka, [traveling_bard.GetTitledFirstNameNoTooltip] herkesin keyfi yerinde olarak çok daha fazla muhteşem melodi çaldı."

 agot_filler_hedges.0032.a:0 "Yeteneklerin yollarda çürüyor!"

 agot_filler_hedges.0032.b:0 "Gerçekten de muhteşem bir akşam."

 agot_filler_hedges.0033.t:0 "Sanatçının İlhamı"

 agot_filler_hedges.0033.desc:0 "Bugün sarayıma sanatçı olduğunu iddia eden bir adam geldi. Topraklarımın güzelliğinden etkilendiğini ve ilham için kalmak istediğini söylüyor. Misafirperverliğimin karşılığında bana bir tablo ithaf edeceğine söz veriyor."

 agot_filler_hedges.0033.a:0 "Elbette!"

 agot_filler_hedges.0033.b:0 "Defol, dilenci."

 agot_filler_hedges.0034.t:0 "Sanatçının İlhamı"

 agot_filler_hedges.0034.desc:0 "Sanatçı bu sabah gitmişti; kimseye ayrılacağını bildirmemişti. İlk kez atölye olarak kullandığı odaya girdim ve kaleminin güzel bir tablosuyla sarsıldım. Böyle bir tablo hanedanımın mirası hakkında çok şey anlatıyor!"

 agot_filler_hedges.0034.a:0 "Bu tabloyu sergileyeceğim!"

 agot_filler_hedges.0034.b:0 "Belki iyi bir fiyata satılır!"

 agot_filler_hedges.0035.t:0 "Sanatçının İlhamı"

 agot_filler_hedges.0035.desc:0 "Sanatçı bu sabah gitmişti; kimseye ayrılacağını bildirmemişti. İlk kez atölye olarak kullandığı odaya girdim ve tanrılara adanmış bir tablo karşısında afalladım. Birkaç saniye şaşkın kaldım, ta ki bunun kalemdeki tanrı tapınağının bir resmi olduğunu anlayana dek!"

 agot_filler_hedges.0035.a:0 "Bu tabloyu sergileyeceğim!"

 agot_filler_hedges.0035.b:0 "Belki iyi bir fiyata satılır!"

 agot_filler_hedges.0036.t:0 "Sanatçının İlhamı"

 agot_filler_hedges.0036.desc:0 "Sanatçı bu sabah gitmişti; kimseye ayrılacağını bildirmemişti. İlk kez atölye olarak kullandığı odaya girdim ve at üstünde azgın bir savaşçının tablosuyla karşılandım! Kudretli savaşçının aslında kendimin bir portresi olduğunu görünce gururum kabardı!"

 agot_filler_hedges.0036.a:0 "Bu tabloyu sergileyeceğim!"

 agot_filler_hedges.0036.b:0 "Belki iyi bir fiyata satılır!"

 agot_filler_hedges.0037.t:0 "Sanatçının İlhamı"

 agot_filler_hedges.0037.desc:0 "Sanatçı bu sabah gitmişti; kimseye ayrılacağını bildirmemişti. İlk kez atölye olarak kullandığı odaya girdiğimde dağınıklık beni çarptı. Oda, dokunulmamış çürük yemek kokuyordu ve duvarlar anlamsız karalamalarla kazınmıştı. Odanın ortasında bezle örtülü bir ressam tuvali vardı; bezi kaldırdığımda nefesim kesildi. Tablo dehşet vericiydi! Resimdeki 'şeyin' ne olduğunu bilmiyorum, ama korku ve huzursuzluk uyandırıyordu!"

 agot_filler_hedges.0037.a:0 "Bu tabloyu sergileyeceğim..."

 agot_filler_hedges.0037.b:0 "Bu yakılmalı..."

 agot_filler_hedges.0038.t:0 "Sanatçının İlhamı"

 agot_filler_hedges.0038.desc:0 "Tablo artık yok; onu bir saray mensubunun mu kaldırdığını yoksa başka bir şeyin mi kaldırdığını bilmiyorum. Artık ona ihtiyacım yok; gösterdiği 'şey' hâlâ benimle. Taht kurduğumda onu görüyorum, karanlık köşelerden beni izliyor. Vasallarım benimle konuşurken kulağıma fısıldıyor. Aynı anda her yerde ve hiçbir yerde... "

 agot_filler_hedges.0038.a:0 "Ondan hiç kurtulabilecek miyim?"
