l_english:

 agot_filler_free_cities.0001.t:0 "Uzaktan Gelen Bilgelik"

 agot_filler_free_cities.0001.intro:0 "Muhafızlarımdan biri, [maester.GetFirstName] adında gri cübbeli bir ziyaretçinin benimle görüşme talep ettiğini bildiriyor.\n\n[maester.GetSheHe] önüme çıkarıldığında, gözlerim [maester.GetHerHis] boynundaki belirgin tasmaya takılıyor — mütevazı ama renkli bir zincir "

 agot_filler_free_cities.0001.tyrosh:0 "çoğunlukla altın halkalardan oluşan.\n\n"Yüce [ROOT.Char.GetTitleAsNameNoTooltip]!" [maester.GetFirstNameNoTooltip] saygıyla eğilip [maester.GetHerHis] amacını açıklıyor; yabancı alim, Tyroshlu zanaatkârlığına ve boya çıkarmanın karmaşık sürecine karşı özel bir hayranlık beslediğini ortaya koyuyor — [maester.GetSheHe]'nin, eğer sarayımda çalışmasına izin verirsem daha fazla incelemek istediği bir konu!\n\n"

 agot_filler_free_cities.0001.lys:0 "çoğunlukla gümüş halkalardan oluşan.\n\n"Yüce [ROOT.Char.GetTitleAsNameNoTooltip]!" [maester.GetFirstNameNoTooltip] saygıyla eğilip [maester.GetHerHis] amacını açıklıyor; yabancı alim, bedenin işlevlerine ve zehirli maddelere ve bunların etkilerine karşı özel bir hayranlık beslediğini ortaya koyuyor — [maester.GetSheHe]'nin, eğer sarayımda çalışmasına izin verirsem daha fazla incelemek istediği konular!\n\n"

 agot_filler_free_cities.0001.myr:0 "çoğunlukla bronz halkalardan oluşan.\n\n"Yüce [ROOT.Char.GetTitleAsNameNoTooltip]!" [maester.GetFirstNameNoTooltip] saygıyla eğilip [maester.GetHerHis] amacını açıklıyor; yabancı alim, yıldızların hareketlerine ve zaman ölçümüne karşı özel bir hayranlık beslediğini ortaya koyuyor — [maester.GetSheHe]'nin, eğer sarayımda çalışmasına izin verirsem daha fazla incelemek istediği konular!\n\n"

 agot_filler_free_cities.0001.outro:0 ""Doğal olarak, Sitadel'in bir üstadı olarak, bazıları [ROOT.Char.GetTitleAsNameNoTooltip]'in ilgisini çekebilecek birçok disiplinde eğitim aldım...""

 agot_filler_free_cities.0001.a:0 "İyi eğitimli bir alim işe yarayabilir..."

 agot_filler_free_cities.0001.a.tt:0 "Sarayında bulunduğu süre boyunca, [maester.GetFirstNameNoTooltip] [maester.GetHerHis] araştırmalarına devam edecek."

 agot_filler_free_cities.0001.b:0 "Çit büyücülerine ihtiyacım yok."

 agot_filler_free_cities.0001.b.tt:0 "[maester.GetFirstNameNoTooltip] sarayını terk edecek."

 agot_filler_free_cities.0002.t:0 "$agot_filler_free_cities.0001.t$: Yarım Kalan Araştırma"

 agot_filler_free_cities.0002.dead:0 "[maester.GetHerHis] yakın zamandaki vefatı nedeniyle, [maester.GetFirstNamePossessive] planları yarım kalıyor."

 agot_filler_free_cities.0002.imprisoned:0 "Hapisteyken [maester.GetHerHis] araştırmasına devam edemeyen [maester.GetFirstNamePossessive] planları yarım kalıyor."

 agot_filler_free_cities.0002.fallback:0 "Kaderi ne olursa olsun, Üstat [maester.GetFirstName] sarayımdaki araştırmasını tamamlayamadı."

 agot_filler_free_cities.0002.desc:0 "Elbette, [maester.GetSheHe] #italic bir miktar#! bilgi bırakmış olmalı?\n\n[maester.GetHerHis] boş odalarına giriyorum ve ahşap bir masanın yanında birkaç not, yarım kalmış gelecek planları, aceleyle çizilmiş eskizler buluyorum... kayda değer hiçbir şey yok."

 agot_filler_free_cities.0002.save_desc:0 "\n\nBelki... hâlâ faydalı bir şeyler öğrenebilirim?"

 agot_filler_free_cities.0002.a:0 "Zamanımı boşa harcama."

 agot_filler_free_cities.0002.save:0 "Daha fazla araştırmalıyım..."

 agot_filler_free_cities.0002.save_success:0 "İşine yarayacak bir şey öğreniyorsun!"

 agot_filler_free_cities.0002.save_fail:0 "Kayda değer hiçbir şey öğrenemiyorsun."

 agot_filler_free_cities.0003.t:0 "$agot_filler_free_cities.0001.t$: Olanaksızlıklar"

 agot_filler_free_cities.0003.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip], korkarım destek olmadan, buradaki çabalarım yalnızca boşa gider," diye bildiriyor [maester.GetFirstName], [maester.GetHerHis] sesindeki bariz hayal kırıklığıyla.\n\nYabancı alim, bilgiyi başka yerde aramak üzere sarayımdan ayrılmaya karar verdi."

 agot_filler_free_cities.0003.a:0 "Kim bilir [maester.GetSheHe] ne bulmuş olabilir?"

 agot_filler_free_cities.0004.t:0 "$agot_filler_free_cities.0001.t$: Gri Cübbeli Bir Hırsız"

 agot_filler_free_cities.0004.desc:0 "Her zamankinden daha geç bir saatte koridorlarda gezinirken, metal şıkırtısı sesi dikkatimi çekiyor. İlk başta gözlerime inanamıyorum ama gerçek apaçık. Gözümün önünde beni soyan kişi [maester.GetFirstName]!\n\nBeklenmedik görünmem karşısında sarsılan [maester.GetHerHis] ağzından yalnızca birkaç sözcük çıkıyor: "B-b-b-[ROOT.Char.GetTitleAsNameNoTooltip], sadece... araştırma için birkaç eşyaya ihtiyacım vardı! Bu korkunç bir yanlış anlaşılma!""

 agot_filler_free_cities.0004.sadistic:0 "Bunun için elini isterim!"

 agot_filler_free_cities.0004.a:0 "Vatana ihanetin canınla ödeyeceksin!"

 agot_filler_free_cities.0004.a.tt:0 "[courtiers|E] ve [guests|E] hareketlerini fark edecek!"

 agot_filler_free_cities.0004.b:0 "Muhafızlar! Haini zindana atın!"

 agot_filler_free_cities.0004.c:0 "Nereden geldiysen oraya koş ve bir daha asla geri dönme!"

 agot_filler_free_cities.0004.c.tt:0 "$agot_filler_free_cities.0001.b.tt$"

 agot_filler_free_cities.0004.d:0 "#italic Bir yanlış anlaşılma...#! En iyisi ikinci kez tekrarlanmaması."

 agot_filler_free_cities.0005.t:0 "$agot_filler_free_cities.0001.t$: Yeni Bir Yuva?"

 agot_filler_free_cities.0005.desc:0 "[maester.GetFirstName|U] kaldığı süre boyunca son derece faydalı olduğunu kanıtladı ve [maester.GetSheHe] ayrılmadan önce, acaba [maester.GetSheHe] burada kalıcı olarak kalmayı kabul eder mi diye merak ediyorum?\n\nSitadel'den bir üstadı yeminlerini terk etmeye ikna etmek biraz ikna becerisi gerektirebilir ama [maester.GetSheHe] kabul ederse, sarayım [maester.GetHerHis] yeteneklerindeki bir alimden büyük fayda görebilir."

 agot_filler_free_cities.0005.a:0 "[maester.GetFirstNameNoTooltip], yeteneğin Sitadel'de boşa harcanıyor!"

 agot_filler_free_cities.0005.a.tt:0 "[maester.GetFirstNameNoTooltip] kalmayı kabul ediyor."

 agot_filler_free_cities.0005.b:0 "[maester.GetHerHis] hırslarına karışmamayı tercih ederim."

 agot_filler_free_cities.0005.b.tt:0 "[maester.GetFirstNameNoTooltip] ayrılacak."

 agot_filler_free_cities.0010.tt.crit_success:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #P önemli ölçüde ilerliyor#!!"

 agot_filler_free_cities.0010.tt.high_success_roll:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #P büyük ölçüde artıyor#!."

 agot_filler_free_cities.0010.tt.success_chance_roll:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #P ilerleme kaydediyor#!."

 agot_filler_free_cities.0010.tt.low_success_roll:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #P hafif ilerleme kaydediyor#!."

 agot_filler_free_cities.0010.tt.crit_fail:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #N ilerleme kaybediyor#!."

 agot_filler_free_cities.0010.t:0 "$agot_filler_free_cities.0001.t$: Arhonların Hazineleri"

 agot_filler_free_cities.0010.desc:0 ""Ah! [ROOT.Char.GetTitledFirstNameNoTooltip]!" [maester.GetFirstNameNoTooltip|U] uzaktan seslenip aciliyetle bana yaklaşıyor. Üstadın bilgi arayışı durma noktasına geldi.\n\n[maester.GetSheHe|U], boya üretimi sürecinde ustalaşmanın anahtarının nadir bir Tyroshlu deniz salyangozu türü olduğunda ısrar ediyor — [maester.GetSheHe]'nin açıkladığı üzere, çeşitli renkler salyangozların beslenme düzenini değiştirmekten kaynaklanıyor!\n\n"Bu keşfi daha da araştırmayı umuyordum ama ne yazık ki, gerekli malzemeler olmadan... zor olabilir.""

 agot_filler_free_cities.0010.admiral:0 "[admiral.GetFirstNamePossessive] ticari bağlantıları büyük ölçüde yardımcı olacak."

 agot_filler_free_cities.0010.a:0 "Himayem yatırıma değse iyi olur."

 agot_filler_free_cities.0010.b:0 "Muhafızlarım yerel tüccarlardan mallara el koyacak."

 agot_filler_free_cities.0010.c:0 "Belki kendi bilgim biraz içgörü sağlar?"

 agot_filler_free_cities.0010.c.crit_success:0 "Yardımın bir atılıma yol açıyor!"

 agot_filler_free_cities.0010.c.tt.crit_success:0 "$agot_filler_free_cities.0010.tt.crit_success$"

 agot_filler_free_cities.0010.c.high_success:0 "Bilgin büyük bir yardım!"

 agot_filler_free_cities.0010.c.tt.high_success:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #P hafifçe iyileşiyor#!."

 agot_filler_free_cities.0010.c.low_success:0 "Değerli bir içgörü sunuyorsun"

 agot_filler_free_cities.0010.c.tt.low_success:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #P çok az iyileşiyor#!."

 agot_filler_free_cities.0010.c.crit_fail:0 "Korkunç tavsiyen üstadı yanlış yönlendiriyor"

 agot_filler_free_cities.0010.c.tt.crit_fail:0 "[maester.GetFirstNamePossessiveNoTooltip] araştırması #N biraz ilerleme kaybediyor#!."

 agot_filler_free_cities.0010.d:0 "Maliyetli bir heves."

 agot_filler_free_cities.0011.t:0 "$agot_filler_free_cities.0001.t$: Malzeme Talebi"

 agot_filler_free_cities.0011.desc:0 "[maester.GetFirstName]'i [maester.GetHerHis] çalışma odasında, ezilmiş kabuklar, canlı renklerde boya şişeleri ve birçok renge boyanmış kumaşlarla çevrili buluyorum.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip|U]! Görünüşe göre deniz salyangozlarından çıkarılan boyalar, birçok başka tona ve renge dönüştürülebiliyor!"\n\n[maester.GetHerHis] deneylerinin olasılığı karşısında coşan [maester.GetFirstNameNoTooltip] bir talep daha yapıyor. "[ROOT.Char.GetTitleAsNameNoTooltip], yerel simyacılardan alınacak malzemelerle bunu bizzat test edebilirim — girişimlerim tam potansiyeline ulaşır!"

 agot_filler_free_cities.0011.scholar:0 "Sanırım ne alman gerektiğini #italic tam olarak#! biliyorum..."

 agot_filler_free_cities.0011.a:0 "Pekâlâ, bu parama değse iyi olur..."

 agot_filler_free_cities.0011.b:0 "Elbette simyacılar daha düşük bir fiyata razı olur?"

 agot_filler_free_cities.0011.b.huge_success:0 "Simyacılar kabul ediyor"

 agot_filler_free_cities.0011.b.success:0 "İsteksizce, simyacılar daha düşük bir fiyata razı oluyor"

 agot_filler_free_cities.0011.b.failure:0 "Öfkeyle, simyacılar her türlü anlaşmayı reddediyor"

 agot_filler_free_cities.0011.c:0 "Söz konusu bile olamaz, onsuz idare etmek zorunda kalacaksın."

 agot_filler_free_cities.0012.t:0 "$agot_filler_free_cities.0001.t$: Ayrılış"

 agot_filler_free_cities.0012.desc:0 "[maester.GetFirstNamePossessive] metal zincirinin yüksek şıkırtısı koridorlarda yankılanarak [maester.GetHerHis] gelişini haber veriyor; gri cübbeli üstat, yüzünde kocaman bir gülümsemeyle koşarak yanıma geliyor.\n\n"

 agot_filler_free_cities.0012.desc_failure:0 "[maester.GetFirstNameNoTooltip]'i [maester.GetHerHis] odalarında buluyorum; [maester.GetHerHis] yüzüne görünür bir hayal kırıklığı işlenmiş.\n\n"

 agot_filler_free_cities.0012.very_high_score:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip|U]! Sonunda tamamlandı! Şimdiye kadarki en büyük başarım!" [maester.GetFirstName|U] bana, [maester.GetHerHis] araştırmasının ayrıntılı bir anlatısı olan devasa bir kitap sunuyor. "Lütfen minnettarlığımın bir nişanesi olarak kabul edin, bu sayfalarda geldiğimden beri öğrendiğim her şeyi kaleme aldım."\n\n[maester.GetFirstNamePossessiveNoTooltip] ilerlemeleri son derece faydalı oldu; [maester.GetHerHis] araştırması yerel boyacıların daha düşük maliyetle daha yüksek verim elde etmesini sağlıyor!"

 agot_filler_free_cities.0012.high_score:0 ""Çalışmam sonunda tamamlandı, [ROOT.Char.GetTitleAsNameNoTooltip]!" [maester.GetFirstNameNoTooltip|U] bana mütevazı bir kitap sunuyor. "Lütfen, minnettarlığımın bir nişanesi olarak kabul edin."\n\nİçerik oldukça sıkıcı ve eksik bir anlatı olsa da, [maester.GetFirstNamePossessiveNoTooltip] ilerlemeleri yerel boya işçilerinin daha yüksek verim elde etmesine yardımcı oldu!"

 agot_filler_free_cities.0012.medium_score:0 "[maester.GetFirstName|U] bana, [maester.GetHerHis] bulgularını anlatan aceleyle birleştirilmiş birkaç parşömen sunuyor. "Lütfen bunu minnettarlığımın bir nişanesi olarak kabul edin."\n\n[maester.GetHerHis] araştırması Sitadel gibi saygın bir kuruma layık olmasa da, [maester.GetFirstNamePossessiveNoTooltip] talimatları yerel boya işçilerinin daha yüksek verim elde etmesine yardımcı oldu!"

 agot_filler_free_cities.0012.low_score:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip], korkarım araştırmalarımda kayda değer hiçbir şey öğrenemedim... belki de bu girişim kaderde yoktu.""

 agot_filler_free_cities.0012.a:0 "Ne zaman kaybı..."

 agot_filler_free_cities.0012.b:0 "Muhteşem!"

 agot_filler_free_cities.0020.t:0 "$agot_filler_free_cities.0001.t$: İğrenç Bir Karışım"

 agot_filler_free_cities.0020.desc:0 "[maester.GetFirstName]'i [maester.GetHerHis] çalışma odasında, farklı şekil ve boyutlardaki şişelerin başında düşünürken buluyorum.\n\n"Büyüleyici! Bu kadar... #italic çeşitliliği#! başka hiçbir yerde görmedim!" diye haykırıyor üstat. "Dikkatli olun, [ROOT.Char.GetTitleAsNameNoTooltip]! Bunların birçoğu anında öldürebilir!"\n\n"Belki... benzer güçte bir karışımı kopyalayarak etkilerinde ustalaşabilirim..." [maester.GetFirstName] beklentiyle bana dönüyor. "Keşke [ROOT.Char.GetTitleAsNameNoTooltip] gerekli malzemeleri sağlamaya meyilli olsa...""

 agot_filler_free_cities.0020.hunter:0 "Yerel ormanlarda bolca zehirli yaratık var!"

 agot_filler_free_cities.0020.gardener:0 "Yardımcı olabilecek birkaç bitki biliyorum!"

 agot_filler_free_cities.0020.a:0 "Ölümcül bir mantikor harika olur!"

 agot_filler_free_cities.0020.b:0 "Al, ihtiyacın olan her şeyi satın al."

 agot_filler_free_cities.0020.c:0 "Altınım başka yerde daha iyi harcanır."

 agot_filler_free_cities.0021.t:0 "$agot_filler_free_cities.0001.t$: Ürkütücü Deneyler"

 agot_filler_free_cities.0021.desc:0 "Bahçelerde gezinirken, derin düşüncelere dalmış, [maester.GetHerHis] araştırmalarındaki son ilerleme eksikliğinden açıkça rahatsız olan Üstat [maester.GetFirstName] ile karşılaşıyorum.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip], teorileri pratiğe dökmenin, kadim kitaplara ve parşömenlere güvenmekten #italic çok#! daha etkili olacağı aklıma geldi."\n\n"Keşke [ROOT.Char.GetTitleAsNameNoTooltip] iksirlerimin daha... #italic pratik#! bir uygulamasıyla devam etmeme izin verirse, sonunda tam etkilerini inceleyebilirim! Elbette, bir...#italic *öhö*#!... #italic uygun#! bir #italic aday#! bulma meselesi de var...""

 agot_filler_free_cities.0021.a:0 "Zindanımda bir zavallı bul."

 agot_filler_free_cities.0021.b:0 "O #italic adayları#! bulmaları için muhafızlar tut."

 agot_filler_free_cities.0021.c:0 "Neden incelemek için ölü bedenler bulmuyorsun?"

 agot_filler_free_cities.0021.d:0 "#italic Deli#! misin sen? Söz konusu bile olamaz!"

 agot_filler_free_cities.0022.t:0 "$agot_filler_free_cities.0001.t$: Alimin Sonuçları"

 agot_filler_free_cities.0022.desc:0 "Salon boyunca yankılanan [maester.GetFirstNamePossessive] metal zincirinin yüksek şıkırtısı [maester.GetHerHis] gelişini haber veriyor; gri cübbeli üstat, yüzünde kocaman bir gülümsemeyle koşarak yanıma geliyor.\n\n"

 agot_filler_free_cities.0022.very_high_score:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip]! Sonunda tamamlandı! Şimdiye kadarki en büyük başarım!" [maester.GetFirstName] bana, bilinen dünyada kullanılan en nadir zehirlerden bazılarını, etkilerini ve bunları ayırt etme yollarını anlatan devasa bir kitap sunuyor.\n\nDikkatli gözlem sayesinde, [maester.GetFirstNameNoTooltip]'den çok şey öğrendim ve belki [maester.GetHerHis] kayıtlarından da bir iki şey öğrenirim!"

 agot_filler_free_cities.0022.high_score:0 ""Çalışmam sonunda tamamlandı, [ROOT.Char.GetTitleAsNameNoTooltip]!" [maester.GetFirstName|U] bana, çeşitli zehirleri ve çoklu etkilerini anlatan mütevazı bir kitap sunuyor. "Lütfen, minnettarlığımın bir nişanesi olarak kabul edin."\n\n[maester.GetFirstNamePossessiveNoTooltip] adımlarını takip ederek, ben de yerel zehirler hakkında daha derin bir anlayış kazandım ve belki [maester.GetHerHis] kayıtlarından da bir iki şey öğrenirim!"

 agot_filler_free_cities.0022.medium_score:0 ""Çalışmam sonunda tamamlandı!" [maester.GetFirstName|U] bana, yaygın iksirleri ve ilaçları anlatan birkaç gevşek parşömen sunuyor. "Her ne kadar olağanüstü bir şey keşfetmemiş olsam da, bulgularımın [ROOT.Char.GetTitleAsNameNoTooltip]'e iyi hizmet edeceğini umuyorum.""

 agot_filler_free_cities.0022.low_score:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip], korkarım kayda değer hiçbir şey öğrenemedim... belki de bu girişim kaderde yoktu.""

 agot_filler_free_cities.0022.book:0 "[maester.GetFirstNamePossessiveNoTooltip] el yazmaları değerli bilgiler saklıyor olmalı..."

 agot_filler_free_cities.0022.book.tt.success:0 "İşine yarayacak bir şey öğreniyorsun!"

 agot_filler_free_cities.0022.ring:0 "[antiquarian.GetFirstNameNoTooltip] ölümcül bir maddeyi iyi değerlendirebilir..."

 agot_filler_free_cities.0022.ring.tt:0 "Antikacın sana, ölümcül zehir saklayan süslü bir yüzük sağlayacak!"

 agot_filler_free_cities.0022.a:0 "İlginç."

 agot_filler_free_cities.0022.b:0 "Hayal kırıklığı..."

 agot_filler_free_cities.0030.t:0 "$agot_filler_free_cities.0001.t$: Gökyüzünün Gözcüsü"

 agot_filler_free_cities.0030.desc:0 "[maester.GetFirstName]'i [maester.GetHerHis] çalışma odasında, kurumuş mum damlaları, kitaplar ve parşömenlerle kaplı bir masanın başında dururken buluyorum.\n\n"Ah, [ROOT.Char.GetTitleAsNameNoTooltip]! Geldiğimden beri bazı küçük keşifler yaptım ama doğru ekipmana sahip olsaydım araştırmam büyük ölçüde fayda görürdü: sadece bir avuç Myrli mercek tüpü, yıldız haritaları..."\n\nListe, isteyeceğimden daha uzun sürüyor..."

 agot_filler_free_cities.0030.a:0 "Gerekli tüm ekipmanı sağla."

 agot_filler_free_cities.0030.b:0 "Elbette bunun #italic hepsine#! ihtiyacın yoktur..."

 agot_filler_free_cities.0030.c:0 "Altınım başka yerde daha iyi harcanır."

 agot_filler_free_cities.0031.t:0 "$agot_filler_free_cities.0001.t$: Gözlemevi"

 agot_filler_free_cities.0031.desc:0 ""[ROOT.Char.GetTitleAsNameNoTooltip]!" [maester.GetFirstName] soluk soluğa, aceleyle bana yaklaşıyor.\n\n"Başka türlüsü olamaz! Yıldızların hareketini yöneten yasalar, mevsimlerin tutarsız doğasını anlamanın anahtarı olmalı! Hesaplarım doğru çıkarsa, saygın Üstat Nicol'ün çalışmalarını bile gölgede bırakacak çığır açıcı bir keşfin eşiğinde duruyorum!"\n\n"Ancak, gözlemlerime devam edebilmem için uygun bir çalışma yerine ihtiyacım olduğunu görüyorum — belki bir tür kule?""

 agot_filler_free_cities.0031.architect:0 "Büyüleyici! İnşaatı bizzat denetleyeceğim!"

 agot_filler_free_cities.0031.scholar:0 "Diğer alimlerin görüşleri işe yarayabilir!"

 agot_filler_free_cities.0031.a:0 "İlgi çekici... mimarlara danışın, masrafları benden."

 agot_filler_free_cities.0031.b:0 "Mütevazı bir şey yeterli olur."

 agot_filler_free_cities.0031.c:0 ""HAH! Paramı senin heveslerine harcamayacağım.""

 agot_filler_free_cities.0032.t:0 "$agot_filler_free_cities.0001.t$: Alimin Sonuçları"

 agot_filler_free_cities.0032.desc:0 "Salon boyunca yankılanan metal zincirin yüksek şıkırtısı [maester.GetFirstNamePossessive] gelişini haber veriyor; "

 agot_filler_free_cities.0032.very_high_score:0 "gri cübbeli üstat koşarak yanıma geliyor, [maester.GetHerHis] yüzünde kocaman bir gülümseme.\n\n"Her ne kadar mevsimlerin düzensizliğinin ardındaki gizemli doğayı çözememiş olsam da, en büyük eserimi tamamladım!" [maester.GetFirstNameNoTooltip] bana, yıldızların ve takımyıldızların hareketlerini ayrıntılarıyla anlatan etkileyici bir incelemeyi, devasa bir kitabı takdim ediyor.\n\nBelki bu konuyu araştırmalıyım, yıldızların içinde başka hangi gizemler saklı, merak ediyorum?"

 agot_filler_free_cities.0032.high_score:0 "gri cübbeli üstat yanıma yürüyor, [maester.GetHerHis] yüzünde kocaman bir gülümseme.\n\n"Her ne kadar mevsimlerin düzensizliğinin ardındaki gizemli doğayı çözememiş olsam da, sonunda çalışmamı tamamladım!"\n\nBelki bu konuyu araştırmalıyım, yıldızların içinde başka hangi gizemler saklı, merak ediyorum?"

 agot_filler_free_cities.0032.medium_score:0 "gri cübbeli üstat, yüzünde bir sırıtışla bana yaklaşıyor.\n\n"Her ne kadar mevsimlerin düzensizliğinin ardındaki gizemli doğayı çözememiş olsam da, birçok kullanımı olan bazı faydalı gözlemler yapmış olabilirim."\n\n[maester.GetFirstNameNoTooltip] bana, birden fazla yıldızın ve takımyıldızın konumunu anlatan birkaç gevşek sayfa sunuyor."

 agot_filler_free_cities.0032.low_score:0 ""[ROOT.Char.GetTitleAsNameNoTooltip], korkarım hesaplarımın çoğu hatalıydı ve keşiflerim yanlıştı."\n\nSonunda, [maester.GetFirstName] çok az şey öğrendi ve ben de ondan da az..."

 agot_filler_free_cities.0032.mystic:0 "Yıldızlar, daha yüksek gizemlere giden yol olabilir."

 agot_filler_free_cities.0032.shrewd:0 "Daha pratik uygulamalara odaklanmayı tercih ederim."

 agot_filler_free_cities.0032.a:0 "Son derece hayal kırıklığı yaratan..."

 agot_filler_free_cities.0032.a.tt.success:0 "Çok şey öğreniyorum"

 agot_filler_free_cities.0032.a.tt.failure:0 "Biraz bilgi ediniyorum"

 agot_filler_free_cities.0032.b:0 "Ne kadar büyük bir potansiyel!"

 tyroshi_research_book_name:0 "Tyrosh'un Zenginlikleri"

 tyroshi_research_book_famed_desc:0 "Üstat [maester.GetName] tarafından [ROOT.Char.GetFullName] sarayında kaldığı süre boyunca özenle yazılmış bir kitap; boya çıkarma sürecinin ayrıntılı işleyişini ve şaşırtıcı derecede yüksek maliyet verimliliğiyle yapmanın sırlarını anlatan kapsamlı notlar ve özenle çizilmiş şemalar — servet arayan herkes için gerçek bir bilgi madeni."

 tyroshi_research_book_masterwork_desc:0 "Bazı bölümler oldukça muğlak ve hızlı çizilmiş diyagramlar biraz eksik olsa da, bu kitap boya üretimi sanatında ustalaşmak isteyen herkes için değerli bilgiler barındırıyor — Üstat [maester.GetName] tarafından [ROOT.Char.GetFullName] sarayında kaldığı süre boyunca yazıldı."

 lyseni_poison_ring:0 "Lysli Zehir Yüzüğü"

 lyseni_poison_ring_desc:0 "Ölümcül zehir taşımak için kullanılan, her zaman elin yetişebileceği yerde duran süslü, içi boş bir Lysli yüzük — doğru kullanılırsa ölümcül bir silah..."

 lys_research_book:0 "Zehirli Bir Derleme"

 lys_research_book_desc:0 "Bilinen dünyanın her yerinde kullanılan çeşitli zehirlerin özelliklerine dair kapsamlı bir inceleme; [maester.GetFirstName] tarafından [ROOT.Char.GetFullName] sarayında kaldığı süre boyunca yazıldı — entrika çevirenlerin kütüphanelerine değerli bir katkı."

 myr_research_book_name:0 "Üstat [maester.GetFirstNamePossessive] Yıldızlar Arası Rehberi"

 myr_research_book_desc:0 "Takımyıldızları ve diğer gök cisimlerini ayrıntılarıyla anlatan büyüleyici bir inceleme; Üstat [maester.GetFirstName] tarafından [ROOT.Char.GetFullName]'in himayesinde yazıldı — yıldızların hareketleri hakkında bilgi arayanlar için paha biçilmez."

 msg_agot_ffc.0006.t:0 "[traveling_maester.GetShortUIName] Sitadel'e dönüyor"

 msg_agot_ffc.0006.desc:0 "Hâmisi [traveling_maester.GetHerHis] vefat edince, [traveling_maester.GetShortUIName] Sitadel'e dönmeye karar verdi"

 agot_filler_free_cities.1000.t:0 "Denizde Yağma"

 agot_filler_free_cities.1000.desc:0 "Son meclis toplantısında, hem [admiral.GetFirstName] hem de [marshal.GetFirstName] ticaret gemilerime yönelik giderek artan saldırılarla ilgili endişelerini dile getirdi.\n\nİkisi de korsanlarla başa çıkılması gerektiği konusunda hemfikir olsa da, bunun #italic nasıl#! yapılacağı konusunda uzlaşamıyorlar.\n\n[admiral.GetFirstNameNoTooltip] devriyelerin artırılmasını öneriyor; kesin ve kararlı bir yaklaşım.\n\n[marshal.GetFirstNameNoTooltip] ise, korsan ekibinin benim sancağım altında akın yapması halinde korsan baskınlarının kesinlikle duracağını öne sürüyor..."

 agot_filler_free_cities.1000.strategist:0 "İyi düzenlenmiş bir pusu bu meseleyi çözer!"

 agot_filler_free_cities.1000.strategist.tt.success:0 "Pusun başarılı oldu"

 agot_filler_free_cities.1000.strategist.tt.failure:0 "Pusun başarısız oldu"

 agot_filler_free_cities.1000.a:0 "Amiral devriyeleri artıracak."

 agot_filler_free_cities.1000.a.tt.success:0 "Devriyeler korsanları başarıyla uzak tutuyor!"

 agot_filler_free_cities.1000.a.tt.failure:0 "Korsanlar devriyelerinden kaçmaya devam ediyor"

 agot_filler_free_cities.1000.b:0 "Mareşalin mürettebatla pazarlık yapmasına izin ver."

 agot_filler_free_cities.1000.b.tt.success:0 "Korsan mürettebatı teklifini kabul ediyor"

 agot_filler_free_cities.1000.b.tt.failure:0 "Korsanlar reddediyor ve gemilerini yağmalamaya devam ediyor"

 agot_filler_free_cities.1000.c:0 "İkisini de görmezden gel."

 agot_filler_free_cities.1000.c.tt:0 "Sorunu görmezden geliyorsun, kendiliğinden çözüleceğini umarak..."

 agot_filler_free_cities.1001.t:0 "Denizde Yağma: "

 agot_filler_free_cities.1001.t.disband:0 "Hırsızların Sonu"

 agot_filler_free_cities.1001.t.loot:0 "Geriye Bırakılan Hazine"

 agot_filler_free_cities.1001.t.militia:0 "Cesaretlenen Denizciler"

 agot_filler_free_cities.1001.t.smugglers:0 "Kaçakçılar İttifakı"

 agot_filler_free_cities.1001.t.attacks:0 "Dalgaların Efendileri"

 agot_filler_free_cities.1001.desc.disband:0 "Gemilerime yönelik saldırıların sıklığı önemli ölçüde azaldı.\n\nKulaktan dolma bilgilere göre, korsan payları üzerine korsanlar arasında bir çatışma patlak vermiş ve bir zamanlar korkulan mürettebat birden fazla gruba bölünmüş!"

 agot_filler_free_cities.1001.a:0 "Korsanların yolu budur..."

 agot_filler_free_cities.1001.desc.loot:0 "Hizmetimdeki bir grup denizci son seferlerinden döndü. "[ROOT.Char.GetTitleAsNameNoTooltip]! Korsanlar yenildi! Ah, ne savaştı ama!"\n\nKorsan tehdidi etkisiz hale getirildi ve denizciler hatta biraz ganimet bile kurtarmayı başardı!"

 agot_filler_free_cities.1001.b:0 "Şanslı bir keşif!"

 agot_filler_free_cities.1001.militia:0 "Görünüşe göre hareketsizliğim korsanları cesaretlendirdi ve baskınları yoğunlaştı...\n\nKomutanlarımın bana söylediğine göre, halkım meseleyi kendi ellerine almaya karar vermiş ve korsanlarla savaşmak için saflara katılmaktan çekinmiyor!"

 agot_filler_free_cities.1001.c:0 "En azından biraz iyi haber, sanırım..."

 agot_filler_free_cities.1001.smugglers:0 "Korsan saldırıları daha az sıklıkta görünse de, yeni bir sorun baş gösterdi. [raided_county.GetName] kaçakçılarla doldu!\n\nO hırsızlar yerel muhafızları yozlaştırdı; karanlık işleri bana servete mal olurken!"

 agot_filler_free_cities.1001.d:0 "Lanet olsun..."

 agot_filler_free_cities.1001.attacks:0 "Gemilerimin giderek artan bir sayısı denizde kayboluyor, denizciler yakalanıyor ve eve asla dönemiyor. Ayrıca, kaybolan malların değeri şimdiden bana küçük bir servete mal oldu...\n\nGörünüşe göre aylaklığım yüzünden baş belası korsan mürettebatı yalnızca güç kazandı!"

 agot_filler_free_cities.1001.e:0 "Lanet olsun!"

 agot_filler_free_cities.2000.t:0 "Lezzetli Bir İçki"

 agot_filler_free_cities.2000.intro:0 "[capital_city_free_city.GetNameNoTooltip]'in canlı pazarında [steward.GetCouncilTitle] ile gezinirken, egzotik baharatların baştan çıkarıcı kokuları ve yerel tüccarların canlı uğultusu arasında, bir beklenti dalgası beni sarıyor.\n\n"

 agot_filler_free_cities.2000.lys:0 "Bir şarap satıcısı, Lysli şarap üreticilerinin işlediği kendine özgü tatları tatmaya davet eden zengin tonlarıyla dolu bir kadeh Lysli tatlı kırmızı şarap sunuyor. Ölçülü bir yudum aldığımda, içimde derin bir takdir uyanıyor. Lysli şarap üreticilerinin sanatını takdir ederek, tanınmayı hak eden bir şarap ürettiğimizin farkına varıyorum.\n\nPazarın canlı fonu, Lys'in çeşitli kültürü için bir tuval gibi açılıyor ve elimdeki kadeh yalnızca tatlı kırmızı şarap değil — kalıcı kimliğimizin bir simgesi. "

 agot_filler_free_cities.2000.myr:0 "Bir şarap tüccarı, Myr'in şarap yapımının eşsiz tatlarına dalmaya davet eden narin tonlarıyla dolu bir kadeh Myrli soluk yeşil şarap uzatıyor. Kutlamayı hak eden bir şarap ürettiğimiz bilgisiyle keyifleniyorum.\n\nPazarın canlı dokusu, Myr'in zengin kültürü için bir tuval haline geliyor ve elimdeki kadeh yalnızca soluk yeşil şarap değil — kalıcı gururumuzun bir simgesi."

 agot_filler_free_cities.2000.tyrosh:0 "Bir tüccar bana bir kadeh Tyroshlu armut brendisi ikram ediyor. Tatlı armut ve sıcak brendinin tadını çıkarırken, Tyroshlu damıtıcılığına olan takdirim derinleşiyor. Böyle kendine özgü ve lezzetli bir içecek ürettiğimiz bilgisiyle keyifleniyorum.\n\nPazarın canlı fonu, Tyrosh'un zengin kültürü için bir tuval haline geliyor ve elimdeki kadeh yalnızca armut brendisi değil — kalıcı gururumuzun bir simgesi."

 agot_filler_free_cities.2000.pentos:0 "Bir şarap satıcısı, Pentoslu şarap üreticilerinin işlediği kendine özgü tatları tatmaya davet eden narin tonlarıyla dolu bir kadeh Pentoslu soluk kehribar şarap sunuyor. Tanınmayı hak eden bir şarap ürettiğimizin farkına vararak keyifleniyorum.\n\nPazarın canlı fonu, Pentos'un çeşitli kültürü için bir tuval gibi açılıyor ve elimdeki kadeh yalnızca soluk kehribar şarap değil — kalıcı kimliğimizin bir simgesi."

 agot_filler_free_cities.2000.outro:0 ""Bir kadeh daha nasıl olur?" diye rica ediyor [steward.GetTitledFirstName]."

 agot_filler_free_cities.2000.s:0 "Sizi bir iş girişimiyle ilgilendirebilir miyim?"

 agot_filler_free_cities.2000.s_tt:0 "Yerel sektöre yatırım yapmayı teklif ediyorsun."

 agot_filler_free_cities.2000.a:0 "Elbette bir tane daha alacağım!"

 agot_filler_free_cities.2000.a_tt:0 "Bu lezzetli içecekten bir kadeh daha istiyorsun."

 agot_filler_free_cities.2000.d:0 "Bana tam bir fıçı getirin!"

 agot_filler_free_cities.2000.d_tt:0 "Kendin için tam bir fıçı istiyorsun."

 agot_filler_free_cities.2000.b:0 "Ayrılma zamanı."

 agot_filler_free_cities.2000.b_tt:0 "Yalnızca bir kadehten sonra pazardan ayrılıyorsun."

 agot_filler_free_cities.2001.t:0 "$agot_filler_free_cities.2000.t$: Yatırım Fırsatı"

 agot_filler_free_cities.2001.lys:0 "İkinci kadehim olan zengin Lysli tatlı kırmızı şarabın son damlasını tadarken, [essosi_filler_merchant.GetFirstNameNicknamed] memnuniyetimi fark ediyor. [essosi_filler_merchant.GetSheHe|U] bir öneriyle yaklaşıyor.\n\n"

 agot_filler_free_cities.2001.myr:0 "İkinci kadehim olan Myrli soluk yeşil şarabın son yudumunun tadını çıkarırken, [essosi_filler_merchant.GetFirstNameNicknamed] memnuniyetimi fark edip öne eğiliyor.\n\n"

 agot_filler_free_cities.2001.tyrosh:0 "İkinci kadehim olan Tyroshlu armut brendisinin son damlasının tadını çıkarırken, [essosi_filler_merchant.GetFirstNameNicknamed] memnuniyetimi fark ediyor. [essosi_filler_merchant.GetSheHe|U] bir iş teklifiyle yaklaşıyor.\n\n"

 agot_filler_free_cities.2001.pentos:0 "İkinci kadehim olan Pentoslu soluk kehribar şarabın son damlasını yudumlarken, [essosi_filler_merchant.GetFirstNameNicknamed] keyfimi fark edip bir öneriyle yaklaşıyor.\n\n"

 agot_filler_free_cities.2001.outro:0 ""İnce ürünlerimizde keyif buluyorsanız," diye öneriyor [essosi_filler_merchant.GetSheHe], "belki sektöre yatırım yapmayı düşünürsünüz. Bu sadece kârlı bir girişim değil; bölgemize hatırı sayılır bir refah getirebilir."\n\nİlgimi çekerek [steward.GetCouncilTitle]'e dönüp [steward.GetHerHis] görüşünü istiyorum. [steward.GetTitledFirstName] onaylayarak başını sallıyor; böyle bir yatırımın akıllıca bir hamle olabileceğini, potansiyel olarak ekonomik büyümeyi ve halkımız için geniş kapsamlı faydaları teşvik edebileceğini doğruluyor."

 agot_filler_free_cities.2001.d:0 "Ağır yatırım yapacağım!"

 agot_filler_free_cities.2001.d_tt:0 "[steward.GetCouncilTitle]'in tavsiyesine uyup #P sektöre ağır yatırım yapmayı#! kabul ediyorsun."

 agot_filler_free_cities.2001.a:0 "Elbette yatırım yapacağım!"

 agot_filler_free_cities.2001.a_tt:0 "[steward.GetCouncilTitle]'in tavsiyesine uyup #P sektöre yatırım yapmayı#! kabul ediyorsun."

 agot_filler_free_cities.2001.b:0 "Hayır, sanmam."

 agot_filler_free_cities.2001.b_tt:0 "[steward.GetCouncilTitle]'in tavsiyesine rağmen #N yerel sektöre yatırım yapmamaya#! karar veriyorsun."

 agot_filler_free_cities_wine_bonus:0 "Yerel Sektöre Yatırım Yapıldı"

 agot_filler_free_cities_wine_bonus_desc:0 "Bu ilçe, yerel sektörüne yatırım aldı ve işler patlıyor."

 agot_filler_free_cities_wine_drunkard_bonus:0 "Yerel Sektöre Ağır Yatırım Yapıldı"

 agot_filler_free_cities_wine_drunkard_bonus_desc:0 "Bu ilçe, yerel sektörüne ağır yatırım aldı ve işler patlıyor."

 agot_filler_free_cities_wine_steward_bonus:0 "Yerel Sektöre Akıllıca Yatırımlar"

 agot_filler_free_cities_wine_steward_bonus_desc:0 "Bu ilçe, yerel sektörüne akıllıca yatırımlar aldı ve işler patlıyor."
