l_english:

 agot_filler_btw.100.t:0 "Yeni Komşular"

 agot_filler_btw.100.desc:0 "Birkaç hafta önce salonumun yakınında yaşayan bir avcı yanıma geldi ve topraklarıma bazı yeni, istenmeyen komşuların yerleştiğini söyledi. Küçük bir klanlar, bir düzine kadar — çoğunlukla çocuklar ya da mızrak kadınları.\n\nBana gerçek bir zararları olmasa da, adamlarımın çoğu aşırı avlandıklarından ve geyiklerin ormanlarımızdan uzaklaşmaya başladığından şikâyetçi. En yüksek sesli olanları bana, toprağıma göz diken düşman bir klan hakkında bir şeyler yapmam gerektiğini söyledi."

 agot_filler_btw.100.a:0 "Onları korkutmak için savaşçılarımı göndereceğim."

 agot_filler_btw.100.a.tt:0 "Bir daha dönmeyecek kadar akıllı olacaklar."

 agot_filler_btw.100.b:0 "Şeflerini salonuma davet et; bunu kan dökmeden çözebilirim."

 agot_filler_btw.100.b.tt:0 "Umarım onları akla yatkın konuştuğuma ikna edebilirim..."

 agot_filler_btw.100.b.success:0 "Klanla bir anlaşmaya varıyorsun."

 agot_filler_btw.100.b.failure:0 "Reis seni dövüp eziyor ve değerli eşyalarını alıyor."

 agot_filler_btw.100.c:0 "Onlara izin verelim..."

 agot_filler_btw.200.t:0 "Yaralı Bir Ulukurt"

 agot_filler_btw.200.desc:0 "Bugün avdayken [marshal.GetTitledFirstName] ile karda kanlar içinde yatan bir ulukurda rastladık. Canavarın çenesi kırılmış, karnı yarılmış ve bedeni yaralarla kaplıydı. Yine de ulukurt inadına hayata tutunuyordu.\n\nBöylesine güçlü bir canavarı bu zavallı halde görmek her insanın yüreğine korku salardı. Böyle bir şeyi hangi canavar yapmış olabilir?"

 agot_filler_btw.200.a:0 "Böyle bir görüntü kötü bir alamet! Kimsenin gece evinden çıkmasına izin verilmemeli."

 agot_filler_btw.200.a.tt:0 "Canavarı acısından kurtarıp yoluna devam ediyorsun."

 agot_filler_btw.200.b:0 "Olsun; zavallı canavarın sağlığına kavuşması için bakım gerekiyor."

 agot_filler_btw.200.b.tt:0 "Sen ve maiyetin ulukurdu salonuna geri taşıyorsunuz."

 agot_filler_btw.200.c:0 "Bırak doğa kendi akışını bulsun."

 agot_filler_btw.201.t:0 "Yaralı Bir Ulukurt: İyileşme"

 agot_filler_btw.201.desc:0 "Adamlarım ve ben onu eve getirdiğimizden beri ulukurtdun sağlığı belirgin şekilde iyileşti. Çenesini doğrulttuk ve yaralarını tedavi ettik — ilk başta ne yemek ne de içmek istese de, bir gün sonra sofra artıklarımı kabul etmeye başladı.\n\nCanavar, ona baktığım süreçte bana bağlanmış görünüyor; şimdi yeniden savaş kondisyonunda olsa da, yanımda kalmak istiyor gibi."

 agot_filler_btw.201.a:0 "Korkunç bir yol arkadaşı olacak."

 agot_filler_btw.201.a.tt:0 "Ve avlanmayı kesinlikle çok daha kolaylaştıracak!"

 agot_filler_btw.400.t:0 "Geçmişin Hayaletleri"

 agot_filler_btw.400.desc:0 "Uzun bir av seferinde, maiyetimle birlikte Storrold Burnu'nun ucuna kadar gezindik ve Duvar'ın ötesindeki en lanetli yerlerden birine rastladık: #bold Hardhome#!. Vahşi doğa, yerleşimin kömürleşmiş kalıntılarını gerçekten de ele geçirmiş olsa da, dondurucu hava yerleşim kalıntılarını korumak için elinden geleni yapmış.\n\nMaiyetimdeki diğerleri, bir zamanlar canlı olan yerleşimin harabelerini keşfetmek için uçurumlardan inmeye çekinse de, endişelerini bir kenara bırakıp kalanları görmek için aşağı iniyorum... Ama donmuş çorak arazide gezinirken, sabah karları kadar parlak bir şekilde karşıma çıkıyor — ne kadar kısa sürerse sürsün, yüzyıllar önce o gece yaşanan dehşetin bir görüntüsü!\n\nBir anne, evinin kapısından koşarak çıkıyor; kollarında bebeğini tutarken bedeni alevler içinde; zavallı yavrucak, kömür gibi yanmış. Ateş her yanı sarıyor ve öylesine kızgın parlıyor ki insan güneşin ta derinliklerinde durduğunu sanabilir. Çığlıklar ancak dumanı ciğerlerinden öksüren insanların korosuyla boğuluyor.\n\nVe sonra her şey bitmişti."

 agot_filler_btw.400.a:0 "İçim titreyerek maiyetimin yanına dönüyorum."

 agot_filler_btw.400.a.tt:0 "Unutma. Bu ziyaret, körelmek üzere olan amacını bilemeye yarar..."

 agot_filler_btw.500.t:0 "Garip Kitaplı Güneyli"

 agot_filler_btw.500.desc:0 "Böyle bir sabah her özgür halkın rüyasıdır — özgürlük gibi tadan, buz gibi çıtır bir dağ havası.\n\nYalnızlığımın tadını çıkarırken cübbeli bir adam yanıma yaklaşıyor, beni görmekten çok memnun. Bu vahşi doğada ne kadar uzun süre yalnız başına gezmiştir!\n\nKendini [maester.GetTitledFirstName] olarak tanıtıyor, halkımızı öğrenmek için kuzeye kadar yolculuk etmiş bir #italic Kale#! #italic üstadı#!. Görevini daha ayrıntılı görüşmek için masama oturmak istediğini cesurca söylüyor."

 agot_filler_btw.500.a:0 "İçeri davet et."

 agot_filler_btw.500.a.tt:0 "Bu kadar uzağa yol almış; en azından onu dinlemeliyim."

 agot_filler_btw.500.b:0 "Yolcu et onu."

 agot_filler_btw.500.b.tt:0 "Ne arıyorsa, benim çatımın altında bulamayacak."

 agot_filler_btw.500.c:0 "Olduğu yerde öldür onu."

 agot_filler_btw.500.c.tt:0 "Ne olduğunu iddia ederse etsin, tüm güneyliler kara kargadır."

 agot_filler_btw.501.t:0 "Garip Kitaplı Güneyli"

 agot_filler_btw.501.desc:0 "[maester.GetTitledFirstName]'i, klanımın üyeleriyle ekmek bölüşmesi için hizmetime davet ediyorum. Duvar'ın güneyinden gelebilir, ama uzak kuzey hakkındaki bilgisi etkileyici. Bana Donparmakları ve Donmuş Kıyı, Geyikboynuzu Nehri ve Titreyen Deniz hakkında bilgiler anlatıyor. Adamlarım bile hayran kalıyor.\n\nAkşam yemeği sona ererken üstadın yüzünün ciddileştiğini görüyorum. "Günler ve aylar boyunca yolculuk ettim, dostum, ama amacım çok daha fazla zaman gerektiriyor," diyor acılı bir sırıtışla, gözlerinin kenarlarında kaz ayakları toplanıyor. "Kabul edersen, salonunda misafir olarak kalmaktan onur duyarım; 'özgür halkının' yaşamını destanlar için kayda geçiririm.""

 agot_filler_btw.501.a:0 "Kimin destanları için, ha?"

 agot_filler_btw.501.a.tt:0 "Ricalini reddedip onu yolcu ediyorsun, bir daha dönmemek üzere."

 agot_filler_btw.501.b:0 "İzin vereceğim."

 agot_filler_btw.501.b.tt:0 "Bu üstat, bizim geleneklerimizi öğrenirken kesinlikle halkımla paylaşacak bilgiye sahiptir."

 agot_filler_btw.501.c:0 "Ah, sen burada #italic kalacaksın#!..."

 agot_filler_btw.501.c.tt:0 "Bir güneyli, o kadar ballı şaraptan oldukça tatlı gelmelidir."

 agot_filler_btw.502.t:0 "Garip Kitaplı Güneyli"

 agot_filler_btw.502.desc:0 "En nihayet, [maester.GetTitledFirstName] yazılarını tamamladı; halkımın her öyküsünü kaydetti ve toprakları çeşitli ağaç ve çiçekler için inceledi. Soğuk kıranları ve don ateşlerini, demirdikeni ve asker çamlarını ararken dağlarda nice yolculuklara çıktık.\n\nŞimdi ayrılmaya hazırlanırken, söyleyecek söz bulamıyorum."

 agot_filler_btw.502.a:0 "Halkımın kadim tokalaşmasıyla içten bir vedalaşma paylaşıyoruz."

 agot_filler_btw.502.a.tt:0 "Halkım bu alim insandan çok şey öğrendi. Onun bilgeliğiyle, gelecek günlerde hastalıkları daha iyi savabiliriz."

 agot_filler_btw.600.t:0 "Kırağının Güzelliği"

 agot_filler_btw.600.desc:0 "Böyle buzlu bir diyarda yaşamayı kıskanan çok azdır, ama havanın izin verdiği o ender günlerde buzun güzelliğini bilen daha da azdır.\n\nBugün böyle bir gün.\n\nBaşkentin yakınında ziyaret edebileceğim donmuş bir göl var ve uzaktan muhteşem göründüğünü görebiliyorum."

 agot_filler_btw.600.a:0 "[skating_spouse.GetFullName] ile kaymayı denemeliyim!"

 agot_filler_btw.600.b:0 "[fishing_child.GetFullName] ile balığa gitmeliyim!"

 agot_filler_btw.600.c:0 "Bir düşününce, donmuş buzun yakınında yürümek tehlikeli görünüyor."

 agot_filler_btw.601.t:0 "Buz Üzerinde Romantizm"

 agot_filler_btw.601.desc:0 "[skating_spouse.GetFirstName] ve ben hemen göle yola çıktık. Göle doğru tepeden yürürken, [skating_spouse.GetSheHe] böyle romantik bir fikir önerdiğim için memnun görünüyor. Tepeyi aşınca ışığın buzun üzerinde ne hoş süzüldüğünü görebiliyoruz.\n\nDemir patenlerimizi bağlayıp birlikte yola çıkıyoruz."

 agot_filler_btw.601.desc.craven_spouse:0 "[skating_spouse.GetFirstName] ve ben hemen göle yola çıktık. Yürürken, [skating_spouse.GetSheHe] böyle romantik bir fikirden memnun görünüyor, ama yaklaştıkça buza endişeyle bakıyor.\n\nNe olursa olsun, demir patenlerimizi bağlayıp buza çıkıyoruz."

 agot_filler_btw.601.a:0 "Aslında, üzerinde çalışabileceğim #bold bazı#! hamleler var."

 agot_filler_btw.601.a.flavor:0 "[skating_spouse.GetFirstName] sensiz eve gidiyor."

 agot_filler_btw.601.a.a:0 "Artık soğuğun içinde zahmetsizce hareket edebiliyorum"

 agot_filler_btw.601.a.b:0 "Sadece üşüyorum"

 agot_filler_btw.601.b:0 "Buzda nasıl dans ettiğimi izleyin!"

 agot_filler_btw.601.b.a:0 "Buz ayaklarının altında çatlıyor ve sonsuza dek yutuluyorsun."

 agot_filler_btw.601.b.b:0 "Yüzüstü yere düşüyorsun"

 agot_filler_btw.601.b.c:0 "Oldukça etkileyici dönüşler ve fırıldaklar yapmayı başarıyorsun"

 agot_filler_btw.601.c:0 "Sadece güzel vakit geçirelim."

 agot_filler_btw.602.t:0 "Eve Dönüş Yürüyüşü"

 agot_filler_btw.602.desc.fell_over:0 "İşler daha iyi de gidebilirdi. [skating_spouse.GetFirstName]'in önünde gerçekten rezil oldum.\n\nYine de, güzel bir fikirdi, belki bir gün tekrar deneyebiliriz. Eve dönerken sohbetimiz, gezimizi başkalarına nasıl anlatacağımıza geliyor."

 agot_filler_btw.602.desc:0 "Birlikte kayağın tadını çıkardık; buzda süzülürken hareketlerimiz birbirine uyumluydu.\n\nEve dönerken sohbetimiz, gezimiz hakkında saraya ne anlatacağımıza geliyor."

 agot_filler_btw.602.a:0 "Herkesin kayakta ne kadar harika olduğumu anlatacağım!"

 agot_filler_btw.602.b:0 "Bütün saraya buraya gelmesini söylemeliyiz!"

 agot_filler_btw.602.c:0 "Yeterince gördüler. Burasını kendimize saklayalım."

 agot_filler_btw.603.t:0 "[fishing_child.GetFirstName] ile Balık Tutmak"

 agot_filler_btw.603.desc:0 "[fishing_child.GetFirstName] ve ben oltalarımızı toplayıp donmuş göle doğru yola çıktık. Tepeden aşıp geçince donmuş göle yakından bakabiliyorum. Umduğum kadar berrak.\n\n[fishing_child.GetFirstName] umutla bana bakıyor. "Balıklara nasıl ulaşacağız?""

 ice_walk.missed_fish:0 "Tek bir balık bile tutamıyoruz..."

 ice_walk.caught_fish:0 "Birkaç balık tutmayı başarıyoruz."

 agot_filler_btw.603.a:0 "\"Ummm... let's be careful and sit on the edge.\""

 agot_filler_btw.603.b:0 "\"We'll walk right in the middle and break the ice there!\""

 agot_filler_btw.603.c:0 "\"Let's see if we can see any fish through the ice...\""

 agot_filler_btw.603.d:0 "\"We're going to jump straight in and fish with our hands!\""

 agot_filler_btw.603.d.a:0 "İkiniz de buzun altında boğuluyorsunuz"

 agot_filler_btw.603.d.b:0 "Buzun altında boğuluyorsun, [fishing_child.GetFirstName] zor bela kurtuluyor"

 agot_filler_btw.603.d.c:0 "[fishing_child.GetFirstName] buzun altında boğuluyor"

 agot_filler_btw.603.d.d:0 "Şaşırtıcı şekilde, işe yarıyor!"

 agot_filler_btw.604.t:0 "Balık Tutmak, Sıradan Bir Uğraş mı?"

 agot_filler_btw.604.desc.caught_fish:0 "[fishing_child.GetFirstName] ile birlikte makul bir balık yükü tutmayı başarıyoruz. [fishing_child.GetSheHe|U] eve gururla yürürken bana hayranlıkla bakıyor. Bir anne-baba ve çocuk gezisi için harika bir sonuç!\n\nŞimdi asıl soru, bir dahaki sefere tekrar gitmeli miyiz?"

 agot_filler_btw.604.desc:0 "[fishing_child.GetFirstName] ve ben tek bir balık bile tutamadık. Hayal kırıklığı yaratan bir sonuç. İkimiz de az konuşarak eve yürüyoruz, doğa karşısında yenilmiş. Hem çocuğumdan hem de kendimden hayal kırıklığına uğradım.\n\nBaşarısızlık karşısında aklıma bir soru geliyor; bir ara tekrar gitmeli miyiz?"

 agot_filler_btw.604.a:0 "\"We must always try again if we fail!\""

 agot_filler_btw.604.a.a:0 "[fishing_child.GetFirstName] tekrar denemenin önemini öğreniyor"

 agot_filler_btw.604.a.b:0 "[fishing_child.GetFirstName], sırf yeniden başarısız olmak için götürülmeye kızıyor"

 agot_filler_btw.604.b:0 "\"Lets go again sometime\""

 agot_filler_btw.604.c:0 "\"This was a one-time thing\""

 agot_filler_btw.605.t:0 "Önlenebilir Bir Trajedi!"

 agot_filler_btw.605.desc:0 "Daldığımız anda bir hata yaptığımı anladım. Balık yakalamak için daldığımda buz gibi suyun gözlerimi ve tenimi yaktığını hissediyorum, ama önümü üç metreden göremiyorum. Buzda açtığımız delikten yüzerek geri çıkabilmek için elimden geleni yapıyorum. Kendimi buzdan çıkarırken dönüp [fishing_child.GetFirstName]'e bakıyorum.\n\nHiçbir şey.\n\nÇocuğumu buzun altında arıyorum, suyun altında her türlü şeklin hareket ettiğini görüyorum ama hiçbiri [fishing_child.GetHerHim]'e benzemiyor. Bakacak yer kalmadı ve buzun altında hareket yok; gerçekle yüzleşmek zorundayım. Çocuğum öldü ve bu benim suçum."

 agot_filler_btw.605.a:0 "Başkalarına haber vermeliyim! Gerçek beni özgür kılacak!"

 agot_filler_btw.605.b:0 "Deliliğimin bu noktaya geldiğine inanamıyorum..."

 agot_filler_btw.605.c:0 "Hiç dile getirmezsem, asla düşünmem de gerekmez"

 agot_filler_btw.605.d:0 "Düşününce oldukça komik"

 agot_filler_btw.606.t:0 "Buzun İçinden Gözler"

 agot_filler_btw.606.desc:0 "[fishing_child.GetFirstNamePossessive] gözleri buzun altından bana bakıyor. "Kurtar beni!" diye haykırıyor [fishing_child.GetSheHe]. "Neden beni kurtarmıyorsun!". Uzanıp buza tırmalıyorum, deliliğimin bana kaybettirdiği hataları telafi etmek için çaresizce. Parmaklarım buzda kırılıyor, donmuş su perdesi kanla kaplanırken [fishing_child.GetFirstName] gözümün önünden karanlığa süzülüyor.\n\nSoğuk bir ter içinde yerimden fırlıyorum, yüzümün önünde kesik kesik nefesimin buharı görünüyor. Deliliğim geçmiş olsa da, [fishing_child.GetFirstName]'e olanları sır olarak saklamak açıkça bana ağır geldi."

 agot_filler_btw.606.desc.lunatic:0 "[fishing_child.GetFirstNamePossessive] gözleri buzun altından bana bakıyor. "Kurtar beni!" diye haykırıyor [fishing_child.GetSheHe]. "Neden beni kurtarmıyorsun!". Uzanıp buza tırmalıyorum, deliliğimin bana kaybettirdiği hataları telafi etmek için çaresizce. Parmaklarım buzda kırılıyor, donmuş su perdesi kanla kaplanırken [fishing_child.GetFirstName] gözümün önünden karanlığa süzülüyor.\n\nSoğuk bir ter içinde yerimden fırlıyorum, yüzümün önünde kesik kesik nefesimin buharı görünüyor. Rüyalarım asla sakin değildir, ama bu özellikle berbattı. Olanları sır olarak saklamak açıkça bana ağır geldi."

 agot_filler_btw.606.a:0 "Acımı taşımalıyım."

 agot_filler_btw.606.b:0 "Belki sadece bir kişi bilmelidir..."

 agot_filler_btw.606.c:0 "Bağışlanma için dua edeceğim."

 agot_filler_btw.700.t:0 "Kiler Donmuş Kapalı"

 agot_filler_btw.700.desc:0 "Mutfağtan bir hizmetkâr büyük salonuma koşarak geliyor, dondurucu havada nefesimiz görünüyor. Bana, kış depolaması için kullandığım kilerin, donuk buz duvarıyla engellendiği için erişilemez olduğu söyleniyor. Yakında o erzaklara ihtiyacımız olacak ve daha fazla don gelince duvar daha da kalınlaşacak. Bununla şimdi ilgilenmeliyim."

 agot_filler_btw.700.a:0 "Doğru yere sağlam bir darbe iş görür."

 agot_filler_btw.700.a.tt:0 "Buzu kendin kırmayı deneyeceksin."

 agot_filler_btw.700.a.toast.success.t:0 "Buz paramparça oluyor."

 agot_filler_btw.700.a.toast.failure.t:0 "Buz duvarı galip geliyor."

 agot_filler_btw.700.b:0 "Gerçek bir buz kırıcıya ihtiyacımız var, [icebreaker.GetName]'i çağırın."

 agot_filler_btw.700.b.tt:0 "[icebreaker.GetNameNoTooltip] buzu kırmayı deneyecek."

 agot_filler_btw.700.b.toast.success.t:0 "[icebreaker.GetFirstNameNoTooltip] buzu paramparça ediyor."

 agot_filler_btw.700.b.toast.failure.t:0 "Buz duvarı, [icebreaker.GetNamePossessiveNoTooltip] aletlerinin kırabileceğinden daha güçlü."

 agot_filler_btw.700.c:0 "Millet, buraya gelin ve içeri doğru kazın."

 agot_filler_btw.700.c.tt:0 "Kalendeki herkese buza vurmasını emredeceksin."

 agot_filler_btw.700.d:0 "Bırakalım. Eninde sonunda çözülür."

 agot_filler_btw.700.d.tt:0 "Kileri erişilemez halde bırakıyorsun."
