l_english:

 agot_filler_tyrosh.0001.t:0 "Tyrosh'un Tazıları"

 agot_filler_tyrosh.0001.desc:0 "Şehirdeki bir iş, beni hareketli bir boya pazarından geçmeye zorluyor. Boya tüccarlarının havlamaları ve hizmetkârlarının bağırışları arasında dar meydana girerken kendimi hazırlıyorum. Her zamanki dansla etrafımda dönüyorlar — her biri efendinin sofrasından bir kırıntı ilgi için yarışıyor. İlgilenmediğimi söylersem, kimin için boya satın alabileceğimi düşünerek her türlü akraba ve tanıdığı saymaya başlıyorlar!\n\nBu tazılar, benim bir süre görecekleri en şişkin keseye sahip olabileceğimi anlıyor ve gürültülü kulübelerinden kaçana dek kovalamacadan vazgeçmiyorlar... ama belki de acele ediyorum? Sonuçta Tyrosh'ta modanın #italic zirvesi#! bu! Diğer Özgür Şehirlerin ve elbette başka diyarların halkları bu geleneği anlamayabilir, ama Tyroşilerin Valyria Özgür Toprakları'nın en çok aranan boyalarını sağlama konusunda gururlu bir geçmişi var."

 agot_filler_tyrosh.0001.a:0 "Yeşil boyayı alıyorum!"

 agot_filler_tyrosh.0001.b:0 "Mor boyayı alıyorum!"

 agot_filler_tyrosh.0001.c:0 "Kırmızı mor boyayı alıyorum!"

 agot_filler_tyrosh.0001.d:0 "Hiçbirini istemiyorum!"

 agot_filler_tyrosh.0002.t:0 "Gelecek İçin Bir Vizyon"

 agot_filler_tyrosh.0002.desc:0 "İki dilekçe sahibi önümde bekliyor. Mavi yeleli [torturer_inventor.GetName] teklifini yapmak için hevesli görünüyor. [construction_inventor.GetName] ise endişelerle meşgul görünüyor; [construction_inventor.GetHerHis] gözlerinin altında uykusuz gecelerin izini taşıyan derin halkalar var; bu yüzden [torturer_inventor.GetNameNoTooltip]'e başlaması için işaret ediyorum.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip], diyarın her türlü başına buyruk alçakla kaynıyor. Barışı korumak, düzeni sağlamak ve hainlerden itiraf almak için bu doğan kadınlara korku salma kadim sanatını mükemmelleştirmeye çalışıyorum. [ROOT.Char.GetTitleAsNameNoTooltip]'in projeme yatırım yapmakla iyi edeceğine inanıyorum," diyor [torturer_inventor.GetSheHe].\n\nDurumdan habersiz, meşgul dilekçe sahibi bir transdan uyanmış gibi konuşmaya başlıyor. "Evet, hepsi kulağa iyi ve hoş geliyor, [ROOT.Char.GetTitleAsNameNoTooltip], ama insanlar diğer insanları unutur. Her gün önünden geçtikleri görkemli eserleri unutamazlar: Sarhoş Tanrı'nın Çeşmesi, Trios Tapınağı, Kanayan Kule, Özgür Topraklar'ın inşa ettiği her şey! İnsanların gördüğü ve hatırladığı budur. Babalarının elleriyle yapılan eserlerin gölgesinde yaşamlarını sürdürürken gizlice taptıkları budur. Ve bu tür bir ibadeti mümkün kılan, vizyon sahibi yöneticilerdir," diye bitiriyor [construction_inventor.GetNameNoTooltip].\n\nBu işkenceciye yatırım yapmak, casusluk alanındaki her girişime önemli bir genişleme anlamına gelebilir, ama mimarın söylediği gerçeği inkar edemem. Her ikisi de himayem için umutsuzca yarışıyor; ama hangisi daha layık? Daha da önemlisi, hazinem #italic ne#! durumda?"

 agot_filler_tyrosh.0002.a:0 "Yönetimim #italic güvende#! olacak. Bedeli ne olursa olsun."

 agot_filler_tyrosh.0002.b:0 "Tüm Tyroşilerin eserlerime bakıp ibadet etmesini istiyorum."

 agot_filler_tyrosh.0002.c:0 "Güzel dilekçe sahipleri var mı? Onları öne alın."

 agot_filler_tyrosh.0003.t:0 "Madam'a Kargo mu?"

 agot_filler_tyrosh.0003.desc:0 "Sabahın erken saatlerinde limanda volta atarken, Sarhoş Tanrı'ya adanmış eski bir denizci şarkısı duyuyorum. Merakla bakınca, yosun tutmuş bir karak'ın yelkenlerini iki kez sarhoş bir madam zarafetiyle kaldırışını ve mürettebatın şarkı söyleme ve yola çıkma telaşında tüm halatları çözmeyi unutmasıyla bağlandığı yerden sendeleyerek kurtuluşunu izliyorum.\n\nO görkemli yaşlı hanımı ileri taşıyan aynı rüzgâr esintileriyle ara sıra serinlenen gemi, neşeyle paytak paytak denize açılırken, kendime şöyle bir tuzlu deniz kadınının taşımasına hangi kargonun yakışacağını soruyorum?"

 agot_filler_tyrosh.0003.a:0 "Kargo köleler olmalı."

 agot_filler_tyrosh.0003.b:0 "Kargo boyalar olmalı."

 agot_filler_tyrosh.0003.c:0 "Sanırım gerçeği asla bilemeyeceğim."

 agot_filler_tyrosh.0004.t:0 "Balparmaklarının Tümü"

 agot_filler_tyrosh.0004.desc:0 "Günün belirli bir saatinde sarayımın gölgesi doğrudan dar bir fırıncı sokağına düşüyor. Orada, özellikle bir fırıncı yaşıyor; çırpılmış ve köpüklü bir bal kremasıyla doldurulmuş, aromatik narenciye çekirdeği yağında kızartılmış, narin, içi boş ve tatlı bir hamur işi yapıyor.\n\nYaklaştığımda fırıncı sevinçle gülümsüyor ve nedenini anlıyorum. Sokak dar olsa da kadın erkek çocuk dolu — hepsi bu balparmaklarını kendinden geçmiş bir sessizlikle yiyor. Uzak diyarların lordlarının ve tüccar prenslerinin hizmetkârları, mükemmelliğinin yalnızca #italic söylentisini#! duymuş efendiler için balparmağı almaya çalışıyor!\n\nFırıncı yaklaşıp bana bir lokma ikram ediyor, bunun onun hediyesi olduğuna dair güvence veriyor. Elimde sıcak ve nektarin ile limon kokuyor. Bir ısırık alıyorum; dilimde bal kremasının tatlı akışını ve hamurun zarif çıtırtısını hissediyorum. Öylesine tatlı ve zengin, ama #italic öylesine#! hafif! Bin tanesini mideye indirmek ve bu tek lokmanın sonsuza dek sürmesini istemek istiyorum aynı anda! Kıyafetime bazı kırıntılar ve krema damlaları düşüyor, ama bu mutluluğun ortasında umurumda bile değil!\n\nBaşkalarının tepkilerini görmek için etrafa bakıyorum. Böylesine basit bir şeyin bir fırıncı sokağına huzur getirebilmesi şaşırtıcı."

 agot_filler_tyrosh.0004.a:0 "Bir kutu alacağım."

 agot_filler_tyrosh.0004.b:0 "Neden bütün günün balparmağı stoğu olmasın?"

 agot_filler_tyrosh.0004.c:0 "Bu fırıncı benim hizmetimde olmalı!"

 agot_filler_tyrosh.0004.d:0 "Ayartmaya #italic karşı koymalıyım#!."

 agot_filler_tyrosh.0005.t:0 "Seçilmeyen Ara Sokak..."

 agot_filler_tyrosh.0005.desc:0 "Günlük işlerim beni bir ara sokağa bitişik bir caddeye getiriyor; orada son derece tuhaf bir konuşma duyuyorum. İki sokak faresi, günlük hırsızlık işine olan haklarını haykırışırken neredeyse kavgaya tutuşmuşlar! İğrenç ikili, süslü Tyrosh tarzında kaplan başı şeklinde biçimlendirilmiş ve platinle kakılmış oldukça zarif bir miğfer için tartışıyor.\n\nKızışan tartışmaları, istersem onları habersiz yakalayıp kulaklarını patlatmak için bana mükemmel bir fırsat veriyor. Belki de sadece kendilerinden üstün birinden gelecek bir akıl sözüne ihtiyaçları vardır? Her ne kadar bu #italic benim#! mevkiimin altında olsa da..."

 agot_filler_tyrosh.0005.a:0 "Bu oğlanlar miğferi geri vermeli."

 agot_filler_tyrosh.0005.b:0 "Belki kârlarını paylaşabilirler..."

 agot_filler_tyrosh.0005.c:0 "MUHAFIZLAR!"

 agot_filler_tyrosh.0005.d:0 "Bazı şeyler en iyisi fark edilmeden bırakılır."

 agot_filler_tyrosh.0006.t:0 "Dökülen Armut Rakısına Ağlama"

 agot_filler_tyrosh.0006.slavery_desc:0 "Tyrosh'taki günlük yürüyüşümde bir meyhanenin önünden geçerken, özellikle kavgacı bir gözetmenin zavallı bir köleyi sözleriyle ve fiilleriyle, cellat ritminde kamçıladığını duyuyorum.\n\n"Nasıl cüret edersin #bold pislik#!! Bu armut rakısı senden de, annenden de, orospu büyükannenin de yaşlısı! Eski Arhon'un #bold kendi elleriyle#!! efendimize hediyesiydi! #S Ve#! sen yalnızca değersiz, lanetli dudaklarınla ondan #italic içmekle#! kalmayıp yakalanınca paha biçilmez amforayı #S PARÇALAMAYA#! cüret ettin!"\n\nGözetmen, [overseer.GetSheHe] sokağın işitebileceği her Tyroşinin ya da pencereden sarkıp izleyebilecek herkesin önünde bu toplu gösteriyi sürdürürken, salyalar saçan, zar zor anlaşılır bir halde. Köle tek kelime etmiyor, [slave.GetHerHis] sırtı işkencecinin ustalığıyla sırılsıklam ve yıpranmış, al kırmızısı bir yamalığa dönüşürken zar zor bir inilti bile çıkarıyor."

 agot_filler_tyrosh.0006.no_slavery_desc:0 "Tyrosh'taki günlük yürüyüşümde bir meyhanenin önünden geçerken, özellikle kavgacı bir gözetmenin zavallı bir hizmetkârı sözleriyle ve fiilleriyle, cellat ritminde kamçıladığını duyuyorum.\n\n"Nasıl cüret edersin #bold pislik#!! Bu armut rakısı senden de, annenden de, orospu büyükannenin de yaşlısı! Eski Arhon'un #bold kendi elleriyle#!! efendimize hediyesiydi! #S Ve#! sen yalnızca değersiz, lanetli dudaklarınla ondan #italic içmekle#! kalmayıp yakalanınca paha biçilmez amforayı #S PARÇALAMAYA#! cüret ettin!"\n\nGözetmen, [overseer.GetSheHe] sokağın işitebileceği her Tyroşinin ya da pencereden sarkıp izleyebilecek herkesin önünde bu toplu gösteriyi sürdürürken, salyalar saçan, zar zor anlaşılır bir halde. Hizmetkâr tek kelime etmiyor, [slave.GetHerHis] sırtı işkencecinin ustalığıyla sırılsıklam ve yıpranmış, al kırmızısı bir yamalığa dönüşürken zar zor bir inilti bile çıkarıyor."

 agot_filler_tyrosh.0006.a:0 "Bu benim sorunum değil."

 agot_filler_tyrosh.0006.b:0 "Kesinlikle [slave.GetHerHis] suçu değildi."

 agot_filler_tyrosh.0006.c:0 "[slave.GetHerHis] suçlu olduğundan eminim."

 agot_filler_tyrosh.0007.t:0 "Kuşatma Altındaki Salyangoz Yetiştiricileri!"

 agot_filler_tyrosh.0007.desc:0 "Salyangoz yetiştiricileri salonuma doluşurken, kaçınılmaz olarak ölü balık kokusu da peşlerinden geliyor ve oda, binlerce çürük salyangoz leşinden oluşan görünmez bir bulutla dolmaya başlıyor. Tatlı kokulu bir mendil için işaret ediyorum ve temsilcilerinin bir an önce başlamasını söylüyorum.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip], diyarındaki küçük halkın bazı kesimleri sanayimizin zenginliğin ve ihtişamın için ne kadar hayati olduğunu anlamıyor. Her gün, işimizin kaçınılmaz bir yönü olan koku yüzünden şikâyet eden çöp gibi sürüler tarafından kuşatılıyoruz!" Yetiştirici, burnumu sıkıca kapatırken yalvarmaya devam ediyor. "O kadar ileri gittiler ki, boya yapmak için gereken salyangozları yetiştirdiğimiz havuzların suyunu bile kirlettiler! Çoğu hastalıkla değersiz hale geldi. Tyrosh'un kaderinin tamamen senin elinde olduğunu söylemek abartı olmaz ve cömertliğin için yalvararak mütevazıca ayaklarına kapanıyoruz."\n\nBir esneme bastırırken neden vergi toplamakla uğraştığımı merak ediyorum. Bu salyangoz yetiştiricileri küçük halkın bayağılığından ne kadar sızlanırsa sızlasın, kendileri de pek de önemsiz değil. Ama zambakları belki de fazla altın yaldızlasalar da, boya ticaretindeki aksaklıkların şehrin dört bir yanında yankı bulacağını söylemekte haklılar. Belki de #italic müdahale etmeliyim#!... ama bazıları kaosun bir merdiven olduğunu söylüyor..."

 agot_filler_tyrosh.0007.a:0 "Salyangoz yetiştiricilerine rahatlama sağlayacağım."

 agot_filler_tyrosh.0007.b:0 "Gerçekten de daha dikkatli olmalılardı..."

 agot_filler_tyrosh.0008.t:0 "Para Her Şeyi Anlatır"

 agot_filler_tyrosh.0008.desc:0 "Diyarın önde gelen tüccarları ve soylularıyla en sevdiğim zevk evinde toplanıp doyasıya yiyip içiyor ve hangi sanayinin zenginliğimizin ve gücümüzün temel taşı olduğunu tartışıyoruz.\n\nBiri diyor ki: "Dostlarım çok yanılıyor. Herkesin görebileceği gibi köleler olmadan başka hiçbir sanayinin işleyemeyeceğine inanıyorum!"\n\nBir başkası atılıyor: "Müsaadenizle, [ROOT.Char.GetTitleAsNameNoTooltip], soylu dostumuzun bakış açısı kabul edilemez biçimde dar görüşlü. Boya atölyeleri ve boya yapım sürecinin parçası olan diğer birçok zanaat olmadan kölelerin yapacak anlamlı işi neredeyse hiç kalmaz!"\n\nBu, ilk adamdan acılı bir kahkaha koparırken bir başkası odayı işaret ederek konuşuyor: "Saygıdeğer dostlarıma en derin saygımla, hepimize şunu hatırlatmayı gerekli buluyorum: Zevk evleri olmadan hayatın kendisi yaşamaya değmez."\n\nKahkahalar sönünce, ortaya koydukları tüm ince noktaları düşünüyorum. Ama şimdi bana bakıyorlar, konu hakkında ne diyeceğimi duymayı bekliyorlar."

 agot_filler_tyrosh.0008.a:0 "Köle ticaretini oldukça kârlı buluyorum."

 agot_filler_tyrosh.0008.b:0 "Boya sanayisiyle boy ölçüşülemez."

 agot_filler_tyrosh.0008.c:0 "Zevk evleri güvenilirdir ve herkes onları sever!"

 agot_filler_tyrosh.0008.d:0 "Önemli olan sadece tüccarın becerileridir, ticaret dalı değil."

 agot_filler_tyrosh.0009.t:0 "Gururuyla Bir Tavus Kuşu"

 agot_filler_tyrosh.0009.desc:0 "Her gün Tyroşilerin geleneksel saç stilleri ve renkleri giydiğini görürüm, ama ara sıra gerçekten eşsiz bir şey görürüm. Bazen özellikle hoş bir saç-sakal düzenlemesi ya da daha nadiren yeni, parlak bir tonun sahneye çıkışı. Bugün ikisine de şahit oluyorum; gösterişli bir Tyroşi salonuma kasılarak giriyor.\n\nHem saçı hem sakalı, meşale ışığını yıldırım fırtınası gibi yakalayan şiddetli bir ametist tonu! [admirable_tyroshi.GetHerHis|U] mor yelesi, kaslı omuzların üzerinden [admirable_tyroshi.GetHerHis] sırtına doğru büyük, dalgalı bukleler halinde dökülüyor. [admirable_tyroshi.GetHerHis] kafasındaki saç, bir dizi özenle yerleştirilmiş kristal saç tokası ve mücevher kakmalı platin tarakla tutturulmuş topuz dizisine toplanmış; hepsi de gururuyla duran bir tavus kuşunu andırıyor.\n\n[admirable_tyroshi.GetHerHis|U] sakalı şık ve açıkta kalan göğsünün hemen üzerinde bitecek şekilde kesilmiş, ama örgülerin arasına dokunmuş mücevherlerle sayısız kez örülmüş. Kıyasla [admirable_tyroshi.GetHerHis] bıyığı uysal görünüyor, yine de [admirable_tyroshi.GetSheHe] onu kusursuz biçimde briyantinleyip bükmeyi başarmış! Böyle bir örneğin gözden kaçmasına izin verir miyim?"

 agot_filler_tyrosh.0009.a:0 "Bir sohbet başlatacağım!"

 agot_filler_tyrosh.0009.b:0 "Belki yerinde bir iltifat iş görür..."

 agot_filler_tyrosh.0009.c:0 "En iyisi [admirable_tyroshi.GetHerHis] görünümüne dalmak."

 agot_filler_tyrosh.0010.t:0 "Tyrosh'un Boyalı Fahişesi"

 agot_filler_tyrosh.0010.desc:0 "Bunun dışında sakin bir akşam gezintisinde, bir paralı askerin şarkı söyler gibi bir aksanla hizmetlerini satarken çıkardığı sesi duyuyorum; [tyroshi_sellsword.GetSheHe] sokağın ortasında kalabalığın arasında sendeleyerek ilerliyor! [tyroshi_sellsword.GetSheHe] yaklaştıkça kokusunun nedenini anlıyorum. [tyroshi_sellsword.GetSheHe|U], kokusuna sert içkilerin yakıcı keskinliği ve yıkanmamış bir sırtın hakim olduğu o eşsiz paralı asker kokusunu üzerinden yayıyor.\n\nYine de [tyroshi_sellsword.GetSheHe], dinlemeye niyetli herkese geçmiş maceralarını anlatmaya devam ederken, onun yaşı geçmiş bir zevk kızından farkı olmadığını görüyorum. [tyroshi_sellsword.GetHerHis|U] yüz boyası, katmanlaşmış kir, ter ve kandan ibaret. [tyroshi_sellsword.GetHerHis|U] parfümü pis ve yanıcı. Bir zamanlar parlak bir tonda olması gereken saçındaki boya bile solmuş ve leke leke.\n\nYine de [tyroshi_sellsword.GetSheHe], sayısız reddedilişten yılmadan devam ediyor. Haline rağmen mesleğini her erkek kadar iyi bildiği konusunda ayak diriyor. Ah şu Tyroşiler! Sokaklarda dilenen paralı askerler bile böbürleniyor!"

 agot_filler_tyrosh.0010.a:0 "Birkaç bozuk para [tyroshi_sellsword.GetHerHis] yoluna fırlatacağım."

 agot_filler_tyrosh.0010.b:0 "Böyle ayak takımı en iyisi görmezden gelinir."

 agot_filler_tyrosh.0010.c:0 "Belki [tyroshi_sellsword.GetSheHe] kiralanabilir?"

 agot_green_dye:0 "Yeşil Boya"

 agot_green_dye_description:0 "Bir Tyroshlu boyacıdan satın alınan yeşil boya."

 agot_purple_dye:0 "Mor Boya"

 agot_purple_dye_description:0 "Bir Tyroshlu boyacıdan satın alınan mor boya."

 agot_vermilion_dye:0 "Kırmızı Mor Boya"

 agot_vermilion_dye_description:0 "Bir Tyroshlu boyacıdan satın alınan kırmızı mor boya."
