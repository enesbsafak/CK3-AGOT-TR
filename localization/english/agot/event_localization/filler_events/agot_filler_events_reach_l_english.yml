l_english:

 agot_filler_reach.100.t:0 "Yanan Çalılar"

 agot_filler_reach.100.desc:0 "Topraklarımı denetlemek ciddi bir iştir, özellikle de hasat yaklaşırken. Bugün, yakındaki bir çiftliği ziyaret ederken [marshal.GetCouncilTitle] [marshal.GetFirstNameNoTooltip] bana rahatsız edici haberler getiriyor. \n\nKrallığımın her yerinde giderek artan kundakçılık raporları var — ama hedef çiftlikler ya da tarlalar değil... daha çok... #N çiçek tarhları#! \n\nNormalde bu pek sorun olmazdı ama Çit Bölgesi'nde çiçek tarhları epey yer kaplar."

 agot_filler_reach.100.a:0 "Ateşler söndükten sonra ne yapabileceğimize bakalım."

 agot_filler_reach.100.a_tt:0 "Meseleyi zamanı gelince araştıracaksın."

 agot_filler_reach.101.t:0 "Yanan Çalılar"

 agot_filler_reach.101.desc:0 "Ateşler, adamlarım ve benim duruma bakmamız için yeterince söndü. \n\nGörünüşe göre yangın hayal ettiğimden daha hızlı yayılmış — koca tarlalar kapkara kesilmiş. #italic Bu topraklar için ne yapacağız? Bu haldeyken, onlara yeni ekin ekmek imkânsız!#!"

 agot_filler_reach.101.a:0 "Onların yeniden işlenebilir hale gelmesi için hatırı sayılır bir yatırım yapacağım."

 agot_filler_reach.101.a_tt:0 "Bu elbette yeterli."

 agot_filler_reach.101.b:0 "Ne yapacağımı #bold tam#! olarak biliyorum!"

 agot_filler_reach.101.b_tt:0 "Bahçıvanlıkla geçen tüm o zaman nihayet karşılığını verdi! Yanmış toprağı karıştırmak için yeni toprak getirirsem, belki toprağı yeniden canlandırır."

 agot_filler_reach.101.c:0 "Konumumu kullanmak için iyi bir zaman olabilir."

 agot_filler_reach.101.c_tt:0 "Birkaç hatır işleterek, profesyonel toprak işçilerini bu pisliği senin hatırın için düzeltmeye ikna edebilirsin; böylece biraz altından da tasarruf edersin."

 agot_filler_reach.101.d:0 "Bunu yapanı yakalamalıyız!"

 agot_filler_reach.101.d_tt:0 "#bold Bunun durması gerekiyor.#!"

 agot_filler_reach.102.t:0 "Yanan Çalılar: Toprak Yenilendi"

 agot_filler_reach.102.desc:0 "[steward.GetTitledFirstName] bu güzel günde bana heyecan verici haberler getiriyor! "Yardımınız sayesinde, [ROOT.Char.GetLadyLord|l], kavrulmuş topraklar artık yeniden işlenebilir durumda," diyor [steward.GetSheHe].\n\n"Sonunda çiftçiler tarlalarına dönebilir ve küçük halk sizi övgüyle anıyor!""

 agot_filler_reach.102.a:0 "Şimdi ekime başlayabiliriz."

 agot_filler_reach.102.a_tt:0 "Tarlalarda çalışması için adamları yeniden çağır."

 agot_filler_reach.103.t:0 "Yanan Çalılar: Kundakçı Kaçtı"

 agot_filler_reach.103.desc:0 "[spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip] yatak odama sinsi sinsi giriyor, [spymaster.GetHerHis|l] yüzünde endişeli bir ifadeyle. \n\n"[ROOT.Char.GetLadyLord|l], ziyaretimin geçliği için özür dilerim. Küçük kuşlarımdan haber aldım ama kundakçının nerede olduğuna dair hâlâ hiçbir söz yok," diyor [spymaster.GetSheHe|l] çekingen bir sesle. "Büyük olasılıkla saklanıyor ama #italic her yerde#! olabilir...""

 agot_filler_reach.103.a:0 "Seni işe yaramaz herif!"

 agot_filler_reach.103.a_tt:0 "Casusluk şefini kovuyorsun."

 agot_filler_reach.103.b:0 "İçinde olmadığını nasıl bilebilirim?"

 agot_filler_reach.103.b_tt:0 "Belki hafif bir işkence gerçeği ortaya çıkarır..."

 agot_filler_reach.200.t:0 "Bu Sokuyor!"

 agot_filler_reach.200.desc:0 "Çit Bölgesi gerçekten de en büyük bahçelere ev sahipliği yapıyor ve ben de kendi bahçemde gezinecek kadar şanslıyım. \n\nÇiçeklerin ve çalıların yanından geçerken arkamdan yüksek bir vızıltı duyuyorum. Kocaman bir arı yüzümün önünden geçiyor ve ben içgüdüsel olarak ona vurmaya çalışıyorum. \n\n#N Oh hayır.#! Üstatlar sana hep arılara vurmamanı söylerler."

 agot_filler_reach.200.a:0 "ARILAR OLMAZ!"

 agot_filler_reach.200.b:0 "Acıyı dindirecek bazı otlar biliyorum"

 agot_filler_reach.200.c:0 "BAHÇEYİ SÖKÜN VE HEPSİNİ YAKIN!!!"

 agot_filler_reach.301.t:0 "Yeşil El Tarikatı"

 agot_filler_reach.301.desc:0 "Çit Bölgesi'nin kralları olan Gardener Hanesi tarafından, Beyaz Kalkan üzerinde Yeşil El taşıyan kadim bir şövalye tarikatı kurulduğu söylenir. Üyelerinin sonuncusu Aegon'un Fethi sırasında yok edilmiş olsa da, birçoğu Ateş Tarlası'ndaki ölümlerinden önce yaptıkları sayısız şövalyelik eyleminden hâlâ söz eder. \n\nKendimi düşüncelere dalmış buluyorum; böyle bir kahramanlığa dönüşün hayalini kuruyorum. Nihayetinde, ben [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip], Garth Yeşilel'in soyundan gelenlerin gücünü neden geri getirmeyeyim ki?"

 agot_filler_reach.301.a:0 "Yeşil El Tarikatı'na katılacağım!"

 agot_filler_reach.301.a_tt:0 "Çit Bölgesi'nin her yerinde şövalyelik ilkelerini yüceltmek için yemin ediyorsun."

 agot_filler_reach.301.b:0 "Bir düşününce..."

 agot_filler_reach.301.b_tt:0 "Zamanın — ve altının — daha iyi kullanım yerleri var."

 agot_filler_reach.311.t:0 "Hasadın Bereketi"

 agot_filler_reach.311.desc:0 "Topraklarım, güzel bir hasat için bütün yaz çalışan işçileriyle birlikte birçok çiftliğe ve tarlaya ev sahipliği yapıyor. \n\nKahyam [steward.GetCouncilTitle] [steward.GetFirstNameNoTooltip] bana mevsimin döndüğünün haberini getiriyor. "Büyük bir hasat zamanı, [ROOT.Char.GetLadyLord|l]," diye ilan ediyor [steward.GetSheHe|l]. "Ekinler bereketliyse, diyar gelişecek! Ama ya zayıfsa...""

 agot_filler_reach.311.a:0 "Ektiğimizi biçme zamanı!"

 agot_filler_reach.311.a_tt:0 "Yalnızca bunun yeterli olacağını umuyorsun."

 agot_filler_reach.312.t:0 "Çarşıdaki Tüccarlar"

 agot_filler_reach.312.desc:0 "Çit Bölgesi'nde pek çok güzel pazar vardır ve hiçbiri benimki kadar görkemli değildir. Bugün yerel tezgâhları ziyaret ederken, yabancı tüccarlardan oluşan bir kervanın tezgâh kurduğunu fark ediyorum. \n\nKüçük halkın, tüccarların sunduğu — bazıları topraklarımı geliştirebilecek — birçok mal hakkındaki dedikodularına kulak misafiri oluyorum. Düşünsene, önce beni bulmadan gelip tezgâh kurmuşlar..."

 agot_filler_reach.312.a:0 "Belki bir ticaret yolu kurabiliriz."

 agot_filler_reach.312.a_tt:0 "Cazibeyi kullanma zamanı. Umarım ikna edici olabilirsin..."

 agot_filler_reach.312.b:0 "Belki bir ticaret yolu kurabiliriz!"

 agot_filler_reach.312.b_tt:0 "Cazibeyi kullanma zamanı. Umarım ikna edici olabilirsin!"

 agot_filler_reach.312.c:0 "Burada iş yapmak için vergi ödemeliler."

 agot_filler_reach.312.c_tt:0 "Tüccarların kazandığı altından bir pay alıyorsun."

 agot_filler_reach.312.d:0 "Pazar bugün kalabalık."

 agot_filler_reach.312.d_tt:0 "Tüccarları pek fark etmiyor ve yoluna devam ediyorsun."

 agot_filler_reach.313.t:0 "Çarşıdaki Tüccarlar"

 agot_filler_reach.313.desc:0 "Tüccarlarla bir ticaret yolu kurma umutlarım sonuçsuz bir çaba oldu. Doğrusu, teklifimi gülerek reddetmelerine şaşırıyorum."

 agot_filler_reach.313.a:0 "Bu utanç verici..."

 agot_filler_reach.313.a_tt:0 "Teklifin tüccarların kahkahalarıyla karşılandı."

 agot_filler_reach.313.b:0 "Sanırım kiminle konuştuğunu fark etmiyorsun..."

 agot_filler_reach.313.b_tt:0 "Tüccarlara hayattaki yerlerinin hatırlatılması gerekiyor."

 agot_filler_reach.314.t:0 "Eski Çit Bölgesi'nin Sikkeleri"

 agot_filler_reach.314.desc:0 "Diyarımın maliyesini kontrol altında tutmak benim için son derece önemlidir. Paralarmı sayarken tuhaf bir paraya rastladığımda ne kadar şaşırdığımı düşünün! \n\nAegon'un Fethi'nden önce Çit Bölgesi, üzerlerindeki Garth Yeşilel sembolü nedeniyle el diye bilinen kendi altın sikkelerini kullanırdı. Bu paranın nasıl olup da elime geçtiğine dair hiçbir fikrim yok. Peki onunla ne yapmalıyım?"

 agot_filler_reach.314.a:0 "Böyle tuhaf bir para işe yarayabilir."

 agot_filler_reach.314.a_tt:0 "Elbette ağırlığınca altından daha değerlidir."

 agot_filler_reach.314.b:0 "Onu gerçek para karşılığı satmalıyım!"

 agot_filler_reach.314.b_tt:0 "Altın bir ejderha olmayabilir ama eline geçeni alırsın."

 agot_filler_reach.315.t:0 "Üstat ve Böcek"

 agot_filler_reach.315.desc:0 "Çit Bölgesi, çeşit çeşit ekin kadar farklı türde böceğe de ev sahipliği yapar — ve bunların üstatlarımızın ilgisini çekmesi de alışılmadık bir durum değildir. Sarayıma, yalnızca bu bölgelere özgü bir böcek türüne kafayı takmış bir üstat geldi. \n\nGeldiğinden beri durmadan ondan bahsediyor. Aklımın ucuna geldim. Sonunda, akşam yemeğimi yerken böceğin kurtçuktan metamorfozunu anlatmaya başlayınca ayağımı yere basmaya karar verdim!"

 agot_filler_reach.315.a:0 "Belki de mareşalimin canını sıkabilir."

 agot_filler_reach.315.b:0 "Belki de kahyamın canını sıkabilir."

 agot_filler_reach.315.c:0 "Bu şimdi bitiyor..."

 agot_filler_reach.316.t:0 "Üstat ve Böcek"

 agot_filler_reach.316.desc:0 "Kışla bu gece alışılmadık derecede hareketli. [marshal.GetCouncilTitle|l]'e sorduğumda, [marshal.GetSheHe|l] ziyaret eden üstadın bilgisinden bazılarını askerlerle paylaştığını söylüyor. \n\n"Adamlar ilginç buldu, ama üstadın umduğu şekilde değil," diyor [marshal.GetFirstNameNoTooltip] sırıtarak. Görünüşe göre bu böcek türü, eşini kazanmak için dövüşüyor; adamlar da bunu bir kan sporu haline getirmiş!"

 agot_filler_reach.316.a:0 "Sanırım birkaç para yatıracağım."

 agot_filler_reach.316.b:0 "Pekâlâ, devam edin."

 agot_filler_reach.316.c:0 "*Ezilir*"

 agot_filler_reach.317.t:0 "Üstat ve Böcek"

 agot_filler_reach.317.desc:0 "İki böcek çarpışıyor; her biri diğerini arena görevi gören kütükten atmaya çalışıyor. Adamlar böceklere efsanevi mızrakçıların adlarını bile vermiş; ama bunun iltifat sayılıp sayılmayacağından şüpheliyim. Bu dövüşteki ikisi Güler Fırtına ve Ejderha Şövalyesi olarak adlandırılmış. \n\nSonunda, böceklerden biri rakibini dengesinden edip onu kütükten itiyor; adamların tezahüratları ve iniltileri arasında."

 agot_filler_reach.317.a:0 "Ah! Ne güzel eğlence!"

 agot_filler_reach.317.a_tt:0 "Peki hangi böceğe bahis yaptın?"

 agot_filler_reach.318.t:0 "Üstat ve Böcek"

 agot_filler_reach.318.desc:0 "Kahyam ve ziyaret eden üstat derin sohbetlerle birlikte vakit geçiriyor. Bugün nedenini öğrendim; [steward.GetFirstNameNoTooltip] bana renkli bir kumaş parçası uzatıyor. Görünüşe göre bu böcek türü oldukça renkli bir boya yapmak için kullanılabiliyor! \n\nKahyam boyalı kumaşın güzel bir kârla satılabileceğine inanıyor..."

 agot_filler_reach.318.a:0 "Üstat! Bu böcek hakkında daha çok şey anlat!"

 agot_filler_reach.319.t:0 "Üstat ve Böcek"

 agot_filler_reach.319.desc:0 "Ziyaret eden üstat, huzurumda bir böcekten bir daha bahsettiğinde onu bir kâse dolusu böcek yemeye zorlayacağımdan söz ettiğim an, lanet olası böceğe olan tüm ilgisini kaybetti."

 agot_filler_reach.319.a:0 "Sonunda, biraz huzur!"

 agot_filler_reach.320.t:0 "Bahçe Partisi"

 agot_filler_reach.320.desc:0 "Bir bahçe partisi düzenleneceğinden haberdar edildim! Güzel bir bahçede başkalarıyla vakit geçirme düşüncesi çok cazip..."

 agot_filler_reach.320.a:0 "Sanırım katılacağım!"

 agot_filler_reach.320.a_tt:0 "Partiye gidiyorsun."

 agot_filler_reach.320.b:0 "Yapacak daha iyi işlerim var!"

 agot_filler_reach.320.b_tt:0 "Partiye gitmiyorsun."

 agot_filler_reach.321.t:0 "Bahçe Partisi"

 agot_filler_reach.321.desc:0 "Tam da hayal ettiğim gibi! Misafirler farklı gruplar halinde gezinip çeşitli şeyler tartışıyor. İki grup gözüme çarpıyor — biri bahçedeki bitki çeşitliliğini tartışıyor, diğeri içki oyunları oynayan bir grup."

 agot_filler_reach.321.a:0 "Bahçeye gideceğim."

 agot_filler_reach.321.a_tt:0 "Bitkiler hakkında ilginç sohbetler güzel olurdu!"

 agot_filler_reach.321.b:0 "Bahçeye gideceğim."

 agot_filler_reach.321.b_tt:0 "Bitkiler hakkında ilginç sohbetler güzel olurdu!"

 agot_filler_reach.321.c:0 "Bana bir içki koy!"

 agot_filler_reach.321.c_tt:0 "Onlara içki oyunlarında katılıyorsun!"

 agot_filler_reach.322.t:0 "İçki Oyunları: Zafer"

 agot_filler_reach.322.desc:0 "İçki masasındaki son rakibi, sonrasında benimle sohbete başlayan bir çit şövalyesini alt ediyorum. Şövalye beni övgüyle anıyor ama sarayımda iş bulmayı umduğundan şüpheleniyorum!"

 agot_filler_reach.322.a:0 "Senin gibi bir şövalye işime yarar!"

 agot_filler_reach.322.a_tt:0 "Çit şövalyesi sarayına katılıyor."

 agot_filler_reach.322.b:0 "Teşekkürler, iyi Ser!"

 agot_filler_reach.322.b_tt:0 "Övgüyü kabul ediyorsun ama şövalyeye sarayında yer vermeyeceksin."

 agot_filler_reach.323.t:0 "İçki Oyunları: Yenilgi"

 agot_filler_reach.323.desc:0 "Daha sonra uyanıyorum; kıyafetlerim hem içkiyle hem de kendi idrarımla kirlenmiş. Görünüşe göre kaldırabileceğimden fazlasını içmiş ve bayılmışım..."

 agot_filler_reach.323.a:0 "Aman Tanrım..."

 agot_filler_reach.323.a_tt:0 "Her lord ve leydi bunu duyacak."

 agot_filler_reach.324.t:0 "Şarap Tüccarı"

 agot_filler_reach.324.desc:0 "[capital_city_wine.GetNameNoTooltip] pazarından geçerken bir şarap tüccarı dikkatimi çekiyor. Görünüşe göre satışta geniş bir eski şarap koleksiyonu var.\n\nEn iyi Arbor altınından bir fıçıyı 'adil' bir fiyata satın almak isteyip istemediğimi soruyor."

 agot_filler_reach.324.a:0 "Muhteşem bir anlaşma!"

 agot_filler_reach.324.a_tt:0 "Şarap tüccarı bana harika bir teklif sunuyor, bunu bir sonraki ziyafetim için saklayacağım!"

 agot_filler_reach.324.drunk:0 "Bana bir fıçı getir!"

 agot_filler_reach.324.drunk_tt:0 "Bu Arbor altınından bir fıçı almam gerek!"

 agot_filler_reach.324.b:0 "Ha! Zavallı bir taklit."

 agot_filler_reach.324.b_tt:0 "Bunun sahte satma konusunda zavallı bir girişim olduğunu açıkça görebiliyorsun."

 agot_filler_reach.324.c:0 "Sanırım bugün olmaz."

 agot_filler_reach.325.t:0 "Şarap Tüccarı: Sahte!"

 agot_filler_reach.325.desc:0 "Bazı misafirleri ağırlarken, pazardan satın aldığım eski şarabı ortaya çıkararak etki yaratmayı düşündüm. Ekşi, pis şarap dudaklarıma değer değmez, iyi bir izlenim bırakma umutlarım suya düştü."

 agot_filler_reach.325.a:0 "Kandırıldım..."

 agot_filler_reach.325.a_tt:0 "Eski şarap açıkça sahteydi."

 agot_filler_reach.325.b:0 "Keşke bir daha asla içmesem..."

 agot_filler_reach.325.b_tt:0 "Eski şarap açıkça sahteydi, nasıl bu kadar budala olabildim?"

 agot_filler_reach.326.t:0 "Tahta Arp Çalan"

 agot_filler_reach.326.desc:0 "Bir handa dinlenirken kulaklarımı güzel bir ses dolduruyor! Bir ozan, hanın müşterileri için ahşap arp çalıyor."

 agot_filler_reach.326.a:0 "Ne güzel bir ses!"

 agot_filler_reach.326.a_tt:0 "Gevşeyip akşamın keyfini çıkarıyorsun."

 agot_filler_reach.326.b:0 "Belki de müziğe tutkum var?"

 agot_filler_reach.326.b_tt:0 "Müzik sanatlarına ilgi duymaya başlıyorsun."

 agot_filler_reach.326.c:0 "Ben de eşlik edeceğim!"

 agot_filler_reach.326.c_tt:0 "Ahşap arpçının melodisine eşlik ederek şarkı söylüyorsun."

 agot_filler_reach.326.d:0 "Çalgıcıyla konuşmak istiyorum."

 agot_filler_reach.326.d_tt:0 "Çalgıcıyla konuşuyorsun."

 agot_filler_reach.327.t:0 "Tahta Arp Çalan"

 agot_filler_reach.327.desc:0 "Çalmayı bitirdikten sonra adamlarım, ahşap arpçıya onunla görüşmek istediğimi söylüyor.\n\nÇalgıcı, bu kadar yetenekli birinden bekleyeceğimden daha utangaç bir halde yaklaşıyor."

 agot_filler_reach.327.a:0 "Seni sarayıma davet etmek istiyorum!"

 agot_filler_reach.327.a_tt:0 "Ahşap arpçı artık sarayını eğlendirecek."

 agot_filler_reach.327.b:0 "Müzik için #italic sana#! teşekkürler!"

 agot_filler_reach.327.b_tt:0 "Çalgıcıya küçük bir bağış yapıyorsun."

 agot_filler_reach.328.t:0 "Komşunun Kazı Daha Beyaz"

 agot_filler_reach.328.desc:0 "Diyarım beni şaşırtmaktan hiç vazgeçmiyor. Topraklarımı keşfederken muhteşem bir verimli toprak parçasına rastlıyorum. Elbette bu, en büyük çiftliklerden birine dönüşebilir!"

 agot_filler_reach.328.a:0 "Belki buraya bir çiftlik kurabilirim?"

 agot_filler_reach.328.a_tt:0 "Toprağı çiftçilik için bakıma aldırıp geliştiriyorsun."

 agot_filler_reach.328.b:0 "Toprağı satıp çabuk para kazanabilecekken neden kendim ekeyim?"

 agot_filler_reach.328.b_tt:0 "Toprağı kiralamak için uygun bir alıcı buluyorsun."

 agot_filler_reach.328.c:0 "Bu kadar el değmemiş toprak dokunulmadan kalmayı hak ediyor."

 agot_filler_reach.328.c_tt:0 "Bu toprağın doğal görünümünü koruyacağım."

 agot_filler_reach.329.t:0 "Ürün Hırsızı"

 agot_filler_reach.329.desc:0 "Yerel bir çiftçi, tarlasından ürün çalmakla suçladığı bir adamı öne çıkarıyor. Hırsız, bunu yalnızca kendini doyurmak için yaptığını, yiyebilecek hiçbir şeyi olmadığı için açlıktan öldüğünü iddia ediyor.\n\nElbette benim gibi bir [ROOT.Char.GetLadyLord|l] adil bir çözüm bulabilir!"

 agot_filler_reach.329.a:0 "Adamı bırak."

 agot_filler_reach.329.a_tt:0 "Adam sadece hayatta kalmaya çalışıyor."

 agot_filler_reach.329.b:0 "Adamı bırak."

 agot_filler_reach.329.b_tt:0 "Adam sadece hayatta kalmaya çalışıyor."

 agot_filler_reach.329.c:0 "Kanun açıktır."

 agot_filler_reach.329.c_tt:0 "Hırsız hapsedilecek ama en azından orada karnı doyurulur."

 agot_filler_reach.329.d:0 "Zaman kaybı! İkisini de kapatın!"

 agot_filler_reach.329.d_tt:0 "İki adam da böyle önemsiz bir meseleyle zamanını aldıkları için hapse atılacak."

 agot_filler_reach.329.e:0 "Bununla başka biri ilgilenmeli..."

 agot_filler_reach.329.e_tt:0 "Bu konuda hüküm vermeye kendimi ikna edemiyorum..."

 agot_filler_reach.330.t:0 "Bir Arı Sürüsü"

 agot_filler_reach.330.desc:0 "Bahçede gezinirken devasa bir #bold arı sürüsüyle#! karşılaşıyorum! İlk başta manzara karşısında şoka girsem de, yerel bir arıcı bana arıların yeni bir kovan ararken genellikle böyle davrandığını söylüyor. Böyle bir durumda işçi arılar çok uysaldır ve kraliçelerini korumak için bir kütle oluştururlar."

 agot_filler_reach.330.a:0 "Belki de onları beslemeyi denemeliyim..."

 agot_filler_reach.330.b:0 "En iyisi onları rahat bırakmak!"

 agot_filler_reach.331.t:0 "Benim Kovanım"

 agot_filler_reach.331.desc:0 "Yerel arıcının yardımıyla sürü için yeni bir kovan kurabiliyorum. Kovanın şimdilik uysal olduğunu, ancak kraliçe yerleştikten sonra koloninin gerçek karakterini göstereceğini açıklıyor. Bu düşünce beni eğlendiriyor... #italic kişilikli arılar!#!"

 agot_filler_reach.331.a:0 "Umarım bu kârlı bir girişim olur."

 agot_filler_reach.332.t:0 "Benim Kovanım"

 agot_filler_reach.332.desc:0 "Arıcının haklı çıkması lanet olsun! Kovan ilk birkaç gün uysaldı ama sonrasında arılar giderek daha saldırgan hale geldi. Artık bahçeye neredeyse giremiyorum; birkaçı beni kovalayıp #bold sokuyor#! beni!"

 agot_filler_reach.332.a:0 "Devam etmeliyim..."

 agot_filler_reach.332.b:0 "Onların gitmesini istiyorum!"

 agot_filler_reach.333.t:0 "Benim Kovanım"

 agot_filler_reach.333.desc:0 "Kovanın saldırganlığı azalmadı ama ben onlardan kaçmakta daha hızlı hale geldim! Yine de, kovan hasat edilecek kadar bal ürettiğinde gerçekten de kârlı bir girişim olacak!"

 agot_filler_reach.333.a:0 "Belki de sonuçta bu iyi bir uğraştır."

 agot_filler_reach.334.t:0 "Benim Kovanım"

 agot_filler_reach.334.desc:0 "Bir sabah bahçeye çıkıyorum. Ortalıkta uçan arı görmediğimi fark edince kovanı incelemek için koşuyorum. Yerde yüzlerce arım yatıyor... #bold ölü!#! \n\nKraliçeyi kurtarma umuduyla kovanı açmama yardım etmesi için yerel arıcıyı çağırıyorum. Ama ne yazık ki, açtığımızda şokun acısını hissediyorum. Bal peteği mahvolmuş, arıcının #N bal mumu güveleri#! dediği şeyin larvalarıyla kaplı."

 agot_filler_reach.334.a:0 "Bal mahvoldu!"

 agot_filler_reach.335.t:0 "Benim Kovanım"

 agot_filler_reach.335.desc:0 "Kovan biraz değişti ama hâlâ çok uysal. Bahçede vakit geçirip arıların çalışmasını izlemekten keyif alıyorum. \n\nBana neredeyse hiç aldırmıyorlar ve arılarımı beslediğimden beri yalnızca birkaç sokma aldım."

 agot_filler_reach.335.a:0 "Bu oldukça keyifli!"

 agot_filler_reach.336.t:0 "Benim Kovanım"

 agot_filler_reach.336.desc:0 "Çiçekler tamamen açmış ve kovan enerjiyle dolup taşıyor. Arılar bitkiden bitkiye ok gibi giderken bana hiç aldırmıyor. \n\nKendimi bahçede daha çok çalışırken buluyorum; yalnızca çiçekleri arılarım için mutlu tutmak adına. Balı hasat etme zamanı geldiğinde, gördüğüm tek şey sıvı altın!"

 agot_filler_reach.336.a:0 "Bunu tekrar yapmalıyım!"

 agot_filler_reach.337.t:0 "Benim Kovanım"

 agot_filler_reach.337.desc:0 "Sabah erkenden, yüksek bir çarpma sesi beni aceleyle bahçeye gönderiyor, adamlarım arkamdan telaşla. Şansıma adamlarım silahlı, çünkü bizi #bold kocaman bir ayı#! karşıladı! \n\nBal kokusu canavarı arı kovanıma çekmişti ve peşine düşerek bahçeye girmişti!"

 agot_filler_reach.337.a:0 "Onu kovmalıyız ya da öldürmeliyiz!"

 agot_filler_reach.337.b:0 "Kışkırtılırsa bize saldırabilir!"

 agot_filler_reach.338.t:0 "Benim Kovanım"

 agot_filler_reach.338.desc:0 "Gözlerim bahçenin girişinde gezinip duruyor. Talih bana yeniden gülümsüyor; av yayım eğitim oklarıyla birlikte duvara dayalı duruyor. Yayı hızla kapıp oku yerleştiriyorum. \n\nOkum ayıya uçuyor ve hedefini canavarın gözünde buluyor! Acıyla kükreyip bahçeden kaçmak için dönüyor — ama daha dışarı çıkar çıkmaz cansız yere yığılıyor. \n\nNeyse ki arı kovanı zarar görmemiş ve kovanın ürettiği baldan güzel bir kâr elde edebiliyorum!"

 agot_filler_reach.338.a:0 "Beklediğimden daha fazla heyecan!"

 agot_filler_reach.339.t:0 "Benim Kovanım"

 agot_filler_reach.339.desc:0 "Adamlarımdan biri ayıya bir ok atıyor ve hedefini canavarın gözünde buluyor! Acıyla kükreyip bahçeden kaçmak için dönüyor — ama daha dışarı çıkar çıkmaz cansız yere yığılıyor. \n\nTalih bana ikinci kez gülümsemiyor; hasar çoktan verilmiş — kovan ve bal kurtarılamayacak durumda!"

 agot_filler_reach.339.a:0 "Son derece talihsiz bir olay..."

 agot_filler_reach.340.t:0 "Garip Tohumlar"

 agot_filler_reach.340.desc:0 "Pazarda, uzak bir diyardan tohum sattığını iddia eden bir satıcıya rastlıyorum."

 agot_filler_reach.340.a:0 "Satın alacağım."

 agot_filler_reach.340.b:0 "Açıkça bir dolandırıcılık!"

 agot_filler_reach.341.t:0 "Garip Tohumlar: Hiçbir Şey"

 agot_filler_reach.341.desc:0 "Tohumları ektikten bir süre geçiyor ve o noktada hiçbir şey büyümüyor. Ya tohumlar bozuktu ya da kazıklanmışım..."

 agot_filler_reach.341.a:0 "Altın israfı."

 agot_filler_reach.342.t:0 "Garip Tohumlar: Büyüme"

 agot_filler_reach.342.desc:0 "Bir sabah bahçeye çıktığımda, tohumların gerçekten de filizlendiğini görüyorum. Umarım Çit Bölgesi'nin zengin toprağında iyi büyürler!"

 agot_filler_reach.342.a:0 "Acaba ne olacak?"

 agot_filler_reach.343.t:0 "Garip Tohumlar: Tomurcuklar"

 agot_filler_reach.343.desc:0 "Bitki büyüdükçe, bitkide küçük tomurcuklar belirmeye başladığını fark ediyorum. Üstadım bunun, gizemli bitkinin yakında çiçek açabileceğini gösterdiğini söylüyor!"

 agot_filler_reach.343.a:0 "Bahçe renklerle canlanacak!"

 agot_filler_reach.344.t:0 "Garip Tohumlar: Çiçekler"

 agot_filler_reach.344.desc:0 "Tomurcuklar nihayet açtı! Bahçe nasıl da bir manzara oldu — çiçekler ona öyle canlı renkler katıyor ki! Öyle güzellik getirdiler ki, misafirler ziyarete geldiklerinde onlara bahçe turları yapıyorum!"

 agot_filler_reach.344.a:0 "Bahçem sarayın konuşulan konusu olacak!"

 agot_filler_reach.345.t:0 "Garip Tohumlar: Koku"

 agot_filler_reach.345.desc:0 "Tomurcuklar nihayet açtı! Çiçekler güzel olsa da, bahçeyi yaşanmaz hale getiren bir koku üretiyorlar. Çok az kişi çiçeklerin yakınında hasta olmadan uzun süre durabiliyor. Saraylılarım kokuyu çürüyen ete benzer bir koku olarak tanımladı."

 agot_filler_reach.345.a:0 "Bu koku itibarıma iyilik yapmıyor..."

 agot_filler_reach.346.t:0 "Garip Tohumlar: Hızlı Büyüme"

 agot_filler_reach.346.desc:0 "Bitkinin asmaları her yere yayılıyor gibi görünüyor — ve #italic çok#! hızlı. Bitki sağlıklı ve çiçekli olsa da, bahçıvanlarım yakındaki bitkileri boğabileceğinden endişeli."

 agot_filler_reach.346.a:0 "Burada gelişiyor gibi görünüyor!"

 agot_filler_reach.347.t:0 "Garip Tohumlar: Kavunlar"

 agot_filler_reach.347.desc:0 "Bahçıvanlarım sürekli büyüyen asmaları kontrol altında tutmakta iyi iş çıkardı ve asmalarda garip kavunlar büyüdüğünü fark ettiler. Hasat edildiklerinde, cesur bir hizmetkâr bir tanesinin tadına bakmayı teklif etti. \n\nNeyse ki, kavunlar çok tatlı ve #bold zehirli#! değil. Bahçıvanlarım tohumların nereden gelmiş olabileceği konusunda tartışıp duruyor. Bazıları belki Vadi, bazıları Essos, hatta belki Yaz Adaları olduğundan şüpheleniyor."

 agot_filler_reach.347.a:0 "İyi satılacaklarına bahse girerim!"

 agot_filler_reach.347.b:0 "Onları yerel Lordlara göndereceğim."

 agot_filler_reach.347.c:0 "Onları İnanç'a bağışlayacağım."

 agot_filler_reach.348.t:0 "Garip Tohumlar: Her Yerde Asmalar"

 agot_filler_reach.348.desc:0 "Bahçıvanlar asmaları kontrol altında tutmak için ellerinden geleni yaptı ama bitkinin sarmaşıkları her gün daha hızlı büyüyor gibi görünüyor. Kısa süre sonra bitkinin filizleri bahçenin başka yerlerinde de bulundu. Bahçıvanlarım, tek çözümün bahçeyi kurtarmak için onu yakmak olabileceğinden korkuyor."

 agot_filler_reach.348.a:0 "Çirkin bir manzara ama yapılması şart."

 agot_filler_reach.349.t:0 "Ağaç Aşılama"

 agot_filler_reach.349.desc:0 "Ormanın yakınında at sürerken, bazı yabani meyve ağaçları üzerinde tuhaf bir deney yapan bir üstada rastlıyorum. Ne yaptığını sorduğumda, farklı ağaçları birbirine "aşıladığını" açıklıyor. \n\nGörünüşe göre, bir ağacın dalını başka bir benzer ağacın dalına ekleyerek, tek bir ağacın iki çeşit meyve birden üretmesi sağlanabiliyor."

 agot_filler_reach.349.a:0 "Tek ağaçta farklı meyvelerden bir bahçe!"

 agot_filler_reach.349.b:0 "Çiçekli ağaçlarla da yapılabilir mi?"

 agot_filler_reach.349.c:0 "Bu benim toprağım, şimdi gideceksin!"

 agot_filler_reach.350.t:0 "Ağaç Aşılama: Çiçekli Ağaçlar"

 agot_filler_reach.350.desc:0 "Üstadın o gün bana ağaç aşılama hakkında söylediklerini uyguladım; çeşitli çiçekli ağaçları sağlam bir gövdeye aşılamak için zaman ayırdım. \n\nArtık o ağaçlar çiçek açtığına göre, ana ağaç sayısız renkle canlı! Ağaca aşıladığım her dal farklı bir çiçek üretti!"

 agot_filler_reach.350.a:0 "Görülmeye değer güzel bir manzara!"

 agot_filler_reach.351.t:0 "Ağaç Aşılama: Meyve Ağaçları"

 agot_filler_reach.351.desc:0 "Üstadın o gün bana ağaç aşılama hakkında söylediklerini uyguladım; çeşitli meyve ağaçlarını sağlam bir gövdeye aşılamak için zaman ayırdım. \n\nArtık o ağaçlar meyve verdiğine göre, ana ağaç kayısı, hurma, şeftali ve erikle canlı! Ağaca aşıladığım her dal, kendi orijinal meyvesini üretti!"

 agot_filler_reach.351.a:0 "Çok kârlı bir keşif!"

 agot_filler_reach.352.t:0 "Ağaç Aşılama: Mildiyö!"

 agot_filler_reach.352.desc:0 "Meyve bahçesi mahvoldu! Görünüşe göre aşılama deneyinde kullandığım dallardan biri mildiyö hastalığına yakalanmıştı ve şimdi aşılı dallara sahip tüm ağaçlar ölmeye başladı!"

 agot_filler_reach.352.a:0 "Meyve bahçesi mahvoldu!"
