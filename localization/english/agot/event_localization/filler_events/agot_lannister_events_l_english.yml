l_english:

 agot_lannister_events.100.t:0 "Hırslı Bir Gezgin Şövalye"

 agot_lannister_events.100.desc:0 "Batı Toprakları'nın zenginlik ünü, sürekli olarak iş arayan paralı askerleri ve gezgin şövalyeleri kendine çekiyor. Özellikle hevesli bir şövalye bir şekilde muhafızlarımı geçip önüme dikildi ve hizmetlerini teklif ediyor."

 agot_lannister_events.100.a:0 "Ona güvenmiyorum, onu araştırtacağım."

 agot_lannister_events.100.a.tt:0 "Gezgin şövalyenin geçmişini araştırıyorsun."

 agot_lannister_events.100.b:0 "Pekâlâ, şövalyelerimden biriyle kendini sına."

 agot_lannister_events.100.b.duel_candidate.victor.tt:0 "[duel_candidate.GetFullName] galip geldi."

 agot_lannister_events.100.b.ambitious_knight.victor.tt:0 "[ambitious_knight.GetFirstNameNoTooltip] galip geldi."

 agot_lannister_events.100.c:0 "Şövalyenin hizmet teklifini reddet."

 agot_lannister_events.100.c.tt:0 "Şövalyeyi gönderiyorsun."

 agot_lannister_events.100.d:0 "[duel_candidate.GetFirstNameNoTooltip], şu sefil herifi öldür."

 agot_lannister_events.101.t:0 "Rahatsız Edici Bir Keşif"

 agot_lannister_events.101.desc:0 "Casuslarımı [ambitious_knight.GetFirstNameNoTooltip]'in geçmişini araştırmaya göndereli epey oldu ve kaygı verici bazı bilgilerle geri döndüler."

 agot_lannister_events.101.a:0 "Bu bir fırsat gibi görünüyor."

 agot_lannister_events.101.b:0 "Bu pisliği zindana at."

 agot_lannister_events.101.a.success.tt:0 "[ambitious_knight.GetFirstNameNoTooltip] yeterince sindirildi."

 agot_lannister_events.101.a.failure.tt:0 "[ambitious_knight.GetFirstNameNoTooltip] şantaj yapılmayı reddediyor."

 agot_lannister_events.102.t:0 "Bildirilecek Bir Şey Yok"

 agot_lannister_events.102.desc:0 "Casuslarımı [ambitious_knight.GetFirstNameNoTooltip] aleyhine suçlayıcı bir kanıt aramaya gönderdim ama onun hakkında sansasyon yaratacak hiçbir şey bulamadılar. Dürüst biri gibi görünüyor."

 agot_lannister_events.102.a:0 "Belki bir sınav yerinde olur?"

 agot_lannister_events.102.a.tt:0 "[ambitious_knight.GetFirstNameNoTooltip]'i halka yardım etmesi için illerinden birine göndereceksin."

 agot_lannister_events.102.a.success.tt:0 "[ambitious_knight.GetFirstNameNoTooltip], [ambitious_knight.GetHerselfHimself]'in gerçek bir şövalye olduğunu kanıtlıyor."

 agot_lannister_events.102.a.failure.tt:0 "[ambitious_knight.GetFirstNameNoTooltip], [ambitious_knight.GetHerHis] şövalyelik yeminlerine sadık kalmıyor."

 agot_lannister_events.102.b:0 "Onu gönder, zaten yeterince şövalye var."

 agot_lannister_events.103.t:0 "Gönülsüz Sadakat"

 agot_lannister_events.103.desc:0 "[ambitious_knight.GetFirstNameNoTooltip], [ambitious_knight.GetHerHis] geçmişi hakkında öğrenebildiğim bilgiler karşısında şok oldu. Hizmetleri karşılığında para alacağı yönündeki tüm düşünceleri hızla yok ettim. Aslına bakılırsa [ambitious_knight.GetSheHe] bedava da olsa kendini kanıtlamaya oldukça hevesli görünüyordu."

 agot_lannister_events.103.a:0 "Bana iyi hizmet et, [ambitious_knight.GetFirstNameNoTooltip]."

 agot_lannister_events.104.t:0 "Şantaj Reddedildi"

 agot_lannister_events.104.desc:0 "[ambitious_knight.GetFirstNameNoTooltip] yalnızca şantajı reddetmekle kalmadı, entrikalarım onu öfkelendirmişe benziyor. Gözünde öfkeli bir bakışla bana doğru yürümeye başlıyor ve muhafızlarım hiçbir yerde görünmüyor."

 agot_lannister_events.104.a:0 "Şarabını [ambitious_knight.GetFirstNameNoTooltip]'in yüzüne fırlat ve kapıya koş."

 agot_lannister_events.104.a.success.tt:0 "[ambitious_knight.GetFirstNameNoTooltip] gözlerini kaybetmişken kapıya ulaşıyorsun."

 agot_lannister_events.104.a.failure.tt:0 "[ambitious_knight.GetFirstNameNoTooltip] yolunuza dikiliyor."

 agot_lannister_events.104.b:0 "Kendini savun!"

 agot_lannister_events.104.b.duel.tt:0 "@warning_icon!#X Bu şiddete yol açacak."

 agot_lannister_events.104.c:0 "Bir dakika, belki bu altın fikrini değiştirir?"

 agot_lannister_events.104.c.tt:0 "Şövalyeye gitmesi için para ödüyorsun."

 agot_lannister_events.105.t:0 "Gerçek Bir Şövalye"

 agot_lannister_events.105.desc:0 "[ambitious_knight.GetFirstNameNoTooltip]'i halka yardım etmesi için [knight_test_province.GetName]'e göndereli epey zaman geçti. Bana zaferle döndü. Köylüler refah içinde, yollar daha güvenli ve bazı kimseler asker olarak eğitim almaya bile heveslendi."

 agot_lannister_events.105.a:0 "Sarayımdaki yerini hak ettin, [ambitious_knight.GetFirstNameNoTooltip]."

 agot_lannister_events.106.t:0 "Sahte Şövalye"

 agot_lannister_events.106.desc:0 "[ambitious_knight.GetFirstNameNoTooltip]'i kendini kanıtlaması ve halka yardım etmesi için [knight_test_province.GetName]'e gönderdim ama henüz ondan haber alamadım. Aslına bakılırsa, bölgede tarifine uyan bir adamın önderliğinde artan haydutluk haberleri almaya başlıyorum."

 agot_lannister_events.106.a:0 "Kahretsin seni, [ambitious_knight.GetFirstNameNoTooltip]."

 agot_lannister_events.107.t:0 "Adalet Yerini Buldu"

 agot_lannister_events.107.desc:0 "Koridora açılan kapıdan fırlayıp yardım çağırıyorum, [ambitious_knight.GetFirstNameNoTooltip] elinde silahıyla arkamdan geliyor, tam muhafızlarım köşeyi dönerken."

 agot_lannister_events.107.a:0 "Muhafızlar! Şu adamı öldürün."

 agot_lannister_events.107.b:0 "Muhafızlar! Şu adamı tutuklayın."

 agot_lannister_events.108.t:0 "Çok Yavaş"

 agot_lannister_events.108.desc:0 "Köpüren ama yılmayan [ambitious_knight.GetFirstNameNoTooltip], üzerinize saldırıyor ve gelirken çılgın bir hamle yapıyor. Tek yapabildiğin, gelecek saldırıdan kendini kalkan gibi korumaya çalışmak."

 agot_lannister_events.108.a:0 "Ahh!"

 agot_lannister_events.109.t:0 "Şerefsiz Bir Son"

 agot_lannister_events.109.desc:0 "Kapıya zamanında ulaşamıyorum ve [ambitious_knight.GetFirstNameNoTooltip] bana vurmaya başlıyor. Bir, iki ve üçüncü kez; kanımın halıya işlediğini görürken bilincimi kaybetmeye başlıyorum."

 agot_lannister_events.109.a:0 "Böyle değil!"

 agot_lannister_events.200.t:0 "Gizli Bir Mağara"

 agot_lannister_events.200.desc:0 "Adamlarıma [new_mine_barony.GetNameNoTooltip] üzerinden liderlik ederken bir tepenin yamacında bir kapı gibi görünen şeye rastladım. \n\nÇocukluğumdan, Batı Toprakları tepelerinin altında altınla dolu uçsuz bucaksız mağaralar olduğuna dair hikâyeler hatırlıyorum."

 agot_lannister_events.200.a:0 "Kapıyı aç."

 agot_lannister_events.200.b:0 "Araştırması için [knight_explorer.GetFirstNameNoTooltip]'i gönder."

 agot_lannister_events.200.c:0 "Bunun için zamanımız yok."

 agot_lannister_events.201.t:0 "Karanlık İniş"

 agot_lannister_events.201.desc:0 "Mağaranın kapısını ihtiyatla açıyorum, [knight_explorer.GetFirstNameNoTooltip] hemen arkamdan geliyor; takip ettiğimiz yol birden aşağıdaki uçuruma inince kısa sürede duraksıyoruz."

 agot_lannister_events.201.a:0 "İyi şanslar, [knight_explorer.GetFirstNameNoTooltip]."

 agot_lannister_events.201.a.success.tt:0 "Mağaraya başarıyla iniyorsun."

 agot_lannister_events.201.a.failure.tt:0 "Mağaraya inmeyi başaramıyorsun."

 agot_lannister_events.201.b:0 "Duvarın aşağısına inmek için gücüne güven."

 agot_lannister_events.201.c:0 "İlkel tırmanma ekipmanı yapmayı dene."

 agot_lannister_events.201.d:0 "Bu hiç de zor değil."

 agot_lannister_events.202.t:0 "Gönülsüz Bir Fedakârlık"

 agot_lannister_events.202.desc:0 "[knight_explorer.GetFirstNameNoTooltip]'e bir meşale verip onu kenardan itiyorum. [knight_explorer.GetSheHe] yere sertçe çarparken mağaranın dibinden acınası bir inilti yükseliyor. En azından [knight_explorer.GetSheHe] hâlâ yaşıyor."

 agot_lannister_events.202.notification:0 "[knight_explorer.GetFirstNameNoTooltip] yaralı ama yaşıyor."

 agot_lannister_events.202.a:0 "Görebilmem için meşaleyi yukarı tut."

 agot_lannister_events.202.b:0 "Oradayken etrafa bir baksan iyi olur!"

 agot_lannister_events.203.t:0 "Zorlu Bir İniş"

 agot_lannister_events.203.desc:0 "[knight_explorer.GetFirstNameNoTooltip]'e bir meşale verip onu kenardan itiyorum. [knight_explorer.GetSheHe] yalnızca birkaç an havada kalsa da, yere çarptığında mide bulandırıcı bir çıtırtı duyuluyor ve [knight_explorer.GetSheHe] ne kımıldıyor ne de onu çağırma çabalarıma karşılık veriyor."

 agot_lannister_events.203.a:0 "En azından meşale aşağıya inen bir yol aydınlatıyor."

 agot_lannister_events.203.b:0 "İlerlemeden önce [knight_explorer.GetHerHim]'i kurtarmak için ne kadar çabaladığımı anlatıyorum"

 agot_lannister_events.203.b.success.toast:0 "Adamlarını, [knight_explorer.GetFirstNameNoTooltip]'i kurtarmaya çalıştığına ikna ettin."

 agot_lannister_events.203.b.success.tt:0 "Adamlarını, [knight_explorer.GetFirstNameNoTooltip]'i kurtarmaya çalıştığına ikna ediyorsun."

 agot_lannister_events.203.b.failure.toast:0 "Adamlarını, [knight_explorer.GetFirstNameNoTooltip]'i kurtarmaya çalıştığına ikna edemedin."

 agot_lannister_events.203.b.failure.tt:0 "İkna edici değilsin."

 agot_lannister_events.204.t:0 "Altın Bir Fırsat"

 agot_lannister_events.204.desc:0 "Aşağıdaki mağara zeminine güvenle iniyorum; mağaranın derinliklerine ilerledikçe meşalemden gelen ışık duvarların yüzeyine çarpıp yansıyor; yakından incelediğimde burada zengin, işlenmemiş altın damarları olduğunu görebiliyorum."

 agot_lannister_events.204.a:0 "Belki [new_mine_holder.GetNameNoTooltip] ile bir anlaşmaya varabiliriz."

 agot_lannister_events.204.b:0 "Bu altını işleteceğim."

 agot_lannister_events.204.c:0 "Bu benim diyarım."

 agot_lannister_events_selfish_mine.tt:0 "Bir maden kuruyor ve [new_mine_holder.GetFirstNameNoTooltip]'i kârdan mahrum bırakıyorsun."

 agot_lannister_events.205.t:0 "Ani Düşüş"

 agot_lannister_events.205.desc:0 "Tırmanış gayet iyi başlıyor, hamlelerimi dikkatle seçiyor ve güzel ilerleme kaydediyorum. Ancak tek bir yanlış hareket yetiyor; bir an ağırlığımı bir sonraki tutamağa aktarıyorum, bir sonraki an serbest düşüşteyim. Birkaç saniyeden fazla sürmüş olamaz ama sonsuzluk gibi geldi ve yere #bold sertçe#! çarptım. \n\nKanımın başımdan boynuma doğru akmaya başladığını hissediyorum ama yaraların hiçbiri hayati değil. Yerden yanımdaki meşalemi alıyorum ve ışığın mağaranın yüzeyine çarpıp duvarlarda akan altın damarlarını yansıtması karşısında hayrete düşüyorum."

 agot_lannister_events.205.a:0 "Burası [new_mine_holder.GetFirstNameNoTooltip]'in toprağı, ama belki bir anlaşmaya varabiliriz."

 agot_lannister_events.205.b:0 "Bu altını işleteceğim."

 agot_lannister_events.205.c:0 "Bu benim diyarım."

 agot_lannister_events.206.t:0 "Müzakereler"

 agot_lannister_events.206.desc:0 "Topraklarından geçen zenginlikleri konuşmak için [new_mine_holder.GetFirstNameNoTooltip]'i çağırdım, belki ikimize de kârlı bir anlaşmaya varabiliriz."

 agot_lannister_events.206.a:0 "Eminim bir yolunu bulabiliriz."

 agot_lannister_events.206.a.minor_success.tt:0 "Kötü bir anlaşma yapıyorsun."

 agot_lannister_events.206.a.medium_success.tt:0 "Ortalama bir anlaşma yapıyorsun."

 agot_lannister_events.206.a.major_success.tt:0 "Harika bir anlaşma yapıyorsun."

 agot_lannister_events.206.a.failure.tt:0 "[new_mine_holder.GetName] paylaşmayı reddediyor."

 agot_lannister_events.206.b:0 "Bağlılık borçlu olduğun kişiyi unutma."

 agot_lannister_events.206.b.tt:0 "[new_mine_holder.GetName] madeni kuracak ve size bir pay verecek."

 agot_lannister_events.206.a.minor_failure.toast:0 "Yetersiz bir anlaşma yapıyorsun."

 agot_lannister_events.206.a.minor_success.toast:0 "İyi bir anlaşma yapıyorsun."

 agot_lannister_events.206.a.major_success.toast:0 "Harika bir anlaşma yapıyorsun."

 agot_lannister_events.206.a.major_failure.toast:0 "[new_mine_holder.GetName] paylaşmayı reddediyor."

 agot_lannister_events.206.c:0 "Bir bulucu ücretine razı olurum."

 agot_lannister_events.207.t:0 "Cesur Şövalye"

 agot_lannister_events.207.desc:0 ""Efendim, bunu kendiniz görmelisiniz!"\n\n[knight_explorer.GetFirstName] nefes almaya çalışarak sendelediği kapıdan geri dönüyor.\n\n"Kısa bir mesafe tırmanmamız gerekecek ama emin olun buna değecek!""

 agot_lannister_events.207.a:0 "Pekâlâ, [knight_explorer.GetFirstNameNoTooltip], önden sen geç."

 agot_lannister_events.207.b:0 "Sanmıyorum, [knight_explorer.GetFirstNameNoTooltip], sıraya geri dön."

 agot_lannister_events.208.t:0 "Boş Mağara"

 agot_lannister_events.208.desc:0 "[knight_explorer.GetFirstNameNoTooltip] kapıdan geri dönüyor ve başını sallıyor.\n\n'Hiçbir şey yok Efendim.'\n\nTam olarak parmağımı basamasam da, içimde bunun görünenden daha fazlası olduğuna dair bir his var."

 agot_lannister_events.208.a:0 "Beni aptal mı sanıyorsun?"

 agot_lannister_events.208.a.success:0 "[knight_explorer.GetFirstNameNoTooltip]'den gerçeği zorla çıkarıyorsun."

 agot_lannister_events.208.a.failure:0 "[knight_explorer.GetFirstNameNoTooltip] inandırıcı duruyor."

 agot_lannister_events.209.t:0 "Namussuz Şövalye"

 agot_lannister_events.209.desc:0 "Ben [knight_explorer.GetFirstName]'i sorgularken birden yere büyük bir ilgi duymaya başlıyor.\n\n"İçeride altın damarları buldum, Efen[ROOT.Char.GetLadyLord|l]," diye tükürürcesine çıkarıyor sonunda, bakışlarıma daha fazla dayanamayarak.\n\nBunu araştırmam gerekecek, ama önce [knight_explorer.GetNameNoTooltip] ile işimi bitirmeliyim."

 agot_lannister_events.209.a:0 "Sen zindana."

 agot_lannister_events.209.b:0 "Hainliğin bedeli ölümdür."

 agot_lannister_events.209.c:0 "Merhametimi hatırlayacaksın."

 agot_lannister_events.210.t:0 "İleri"

 agot_lannister_events.210.desc:0 "[knight_explorer.GetFirstNameNoTooltip], mağarada zamanınıza değecek hiçbir şey olmadığına dair sizi temin ediyor ve sıraya geri katılıyor."

 agot_lannister_events.210.a:0 "İleri, adamlarım!"

 agot_lannister_events.300.t:0 "Uzun Gemiler Görüldü"

 agot_lannister_events.300.desc:0 "Fetih sırasında Aegon ve Balerion Harrenhal'ı yakıp Hoare hanedanını sona erdirdiğinde Demirdoğanların Eski Yolu Westeros'ta yasaklanmış olsa da, adalarda bu geleneğe inatla sarılanlar hâlâ var; şan, servet ve macera için canlarını dişlerine takmaya hazırlar.\n\nÇoğunlukla Westeros'u yağmalamaktan kaçınırlar, ama özellikle hırslı, belki de budala bazı yağmacılar kıyılarımıza saldıracaktır. [ironborn_raid_target.GetName] kıyılarının açıklarında uzun gemiler görüldü."

 agot_lannister_events.300.a:0 "[ironborn_raid_target.GetName]'e bir kuvvete bizzat ben liderlik edeceğim."

 agot_lannister_events.300.b:0 "Adam ayıramayız, bu konuda yalnızlar."

 agot_lannister_events.300.c:0 "Mareşalim [marshal.GetNameNoTooltip], bir yardım kuvvetine liderlik edecek."

 agot_lannister_events.300.d:0 "[ironborn_raid_target_holder.GetNameNoTooltip], [ironborn_raid_target_holder.GetHerHis] kendi topraklarıyla ilgilensin."

 agot_lannister_events.301.t:0 "Ufukta Duman"

 agot_lannister_events.301.desc:0 "[ironborn_raid_target.GetNameNoTooltip]'e yapılan akının izleri kasabadan çok önce görülüyor; gökyüzü dumanla dolu ve yaklaşmaya başladığımızda çığlıklar duyulabiliyor. Adamlarımı daha hızlı yürümeleri için zorluyorum."

 agot_lannister_events.301.a:0 "Saldırın, adamlarım!"

 agot_lannister_events.301.b:0 "Ana kuvvet onları burada tutarsa, daha küçük bir kuvvetle kanatlarından saldırabilirim."

 agot_lannister_events.301.success.tt:0 "Yağmacıları yeniyorsun."

 agot_lannister_events.301.failure.tt:0 "Yenildin."

 agot_lannister_events.302.t:0 "Denize Dönüş"

 agot_lannister_events.302.desc:0 "Adamlarımla birlikte [ironborn_raid_target.GetNameNoTooltip] garnizonunun yardımına koştuk. Çarpışma şiddetliydi ve iki tarafta da kayıplar vardı; ancak üstün disiplinimiz ve uğrunda savaştığımız değerli dava günü kazandırdı. Yerlerinde biçilmeyen yağmacılar gemilerine kaçtı. \n\nBir adam, belki de akının lideri, geri çekilmeyi reddetti. Adamlarım onu etkisiz hale getirmek için üzerine gelirken baltasını çılgınca savuruyor. \n\nEtkisiz hale getirildikten sonra zincirlere vurulmuş halde önüme getiriliyor ki kaderine ben karar vereyim."

 agot_lannister_events.302.a:0 "Onu zindanlara gönder."

 agot_lannister_events.302.b:0 "Bu pisliği öldür ve işi bitir"

 agot_lannister_events.302.c:0 "Demirdoğanı yerel bir hükümdara teslim et."

 agot_lannister_events.303.t:0 "Zorunlu Geri Çekilme"

 agot_lannister_events.303.desc:0 "Demirdoğan yağmacılarının vahşeti hattınızı defalarca geri itiyor. Bu tempoyu sonsuza dek sürdürmeleri mümkün olmasa da, bu bir istila değil, bir akın.\n\nBen ve adamlarım yağmacıların ana hattını tutarken, diğerleri [ironborn_raid_target.GetNameNoTooltip]'in çarşılarını ve evlerini yağmalamaya devam ediyor."

 agot_lannister_events.303.a:0 "Kahretsin Demirdoğanlar."

 agot_lannister_events.303.b:0 "[ironborn_raid_target.GetNameNoTooltip]'in toparlanmasını finanse edeceğim."

 agot_lannister_events.303_wounded.toast.t:0 "[ironborn_raider.GetNameNoTooltip]'in adamlarıyla savaşırken yaralandın."

 agot_lannister_events.304.t:0 "Zafer Kazanmış Vasal"

 agot_lannister_events.304.opening:0 "[ROOT.Char.GetNameNoTooltip]"

 agot_lannister_events.304.desc:0 "Dışarıdan hiçbir yardım almasak da, Demirdoğanları püskürttüğümüzü ve [ironborn_raid_target.GetNameNoTooltip]'i daha sonraki saldırılara karşı güvence altına aldığımızı duymanın sizi memnun edeceğine inanıyorum. Yalnız savunmamın hikâyelerinin şimdiden diyarın dört bir yanına yayıldığına inanıyorum."

 agot_lannister_events.304.a:0 "Pekâlâ."

 agot_lannister_events.305.t:0 "Yenilmiş Vasal"

 agot_lannister_events.305.opening:0 "[ROOT.Char.GetNameNoTooltip]"

 agot_lannister_events.305.desc:0 "[ironborn_raid_target.GetNameNoTooltip]'e yapılan Demirdoğan akını sırasında müdahale edilmemesi, onların kasabada dört nala koşmasına izin verdi. Pek çok iyi insanı, kadını ve çocuğu, ayrıca hatırı sayılır bir serveti kaybettik."

 agot_lannister_events.305.a:0 "Yazık."

 agot_lannister_events.306.t:0 "Zafer Kazanmış Mareşal"

 agot_lannister_events.306.desc:0 "Belli ki bedelsiz olmasa da, [marshal.GetName] Demirdoğan yağmacılarını [ironborn_raid_target.GetNameNoTooltip]'ten püskürterek zaferle döndü. Halk [marshal.GetHersHis] dönüşünü sevinçle karşılıyor, [marshal.GetHerHim]'i evine karşılamak için sokaklarda sıralanıyor. \n\nBelki bir ödül yerinde olur?"

 agot_lannister_events.306.a:0 "Evet, bence bir ödül hak edildi."

 agot_lannister_events.306.b:0 "Şükranım elbette yeterlidir?"

 agot_lannister_events.306.c:0 "[marshal.GetNameNoTooltip] itibarlı bir mevkiyi hak ediyor!"

 agot_lannister_events.307.t:0 "Yenilmiş Mareşal"

 agot_lannister_events.307.marshal_died_desc:0 "[marshal.GetName]'in kuvvetleri yenilgiye uğramış olarak başkente dönüyor. Adamlar ağır yaralar almış görünüyor; birçoğu arabaların üzerinde dönüyor. Kısa bir sayım, pek çoğunun hiç geri dönmediğini, aralarında [marshal.GetNameNoTooltip]'in de olduğunu gösteriyor."

 agot_lannister_events.307.desc:0 "[marshal.GetName] yenilgiye uğramış olarak başkente dönüyor. Hem [marshal.GetSheHe] hem de [marshal.GetHerHis] adamları ağır yaralar almış görünüyor; birçoğu arabaların üzerinde dönüyor. Kısa bir sayım, pek çoğunun hiç geri dönmediğini gösteriyor."

 agot_lannister_events.307.a:0 "Yazık."

 agot_lannister_events.307.b:0 "Başarısızlığa tahammül edilmeyecek."

 agot_lannister_events.309.t:0 "Sinsi Bir Şüphe"

 agot_lannister_events.309.desc:0 "Teoride sağlam bir plandı: adamlarının çoğunu Demirdoğanlarla yüzleşmek üzere bırakıp sen de arkadan vurmak için gizlice dolaşacaktın. Ne yazık ki yağmacılar ana kuvveti çabucak saf dışı bıraktı; yani tek yapmaları gereken saldırının ilk şokunun geçmesinin ardından sana dönmekti. \n\nSayıca ezici şekilde geride kalınca savaş alanından hızla çekilmek zorunda kaldın ve [ironborn_raid_target.GetNameNoTooltip]'i yağmacıların insafına bıraktın "

 agot_lannister_events.309.a:0 "Lanet olası yağmacılar."

 agot_lannister_events.309.b:0 "[ironborn_raid_target.GetNameNoTooltip]'in toparlanmasını finanse edeceğim."

 agot_lannister_events.308.t:0 "Çekiç ve Örs"

 agot_lannister_events.308.desc:0 "Ana grup çarpışmanın içine daldığında kanat kuvvetimle birlikte hızla onlardan ayrıldım. Düşmanın arkasına konumlanana dek ara sokaklardan ve çarşılardan ilerledik. Hedefimize yaklaşırken ana kuvvet yiğitçe direndi. Hücum emrini vermeden önce düşmanı koklayabilecek kadar yaklaşmayı bekledim. \n\nYağmacıların arkasına çarptık, aralarına korku ve kargaşa saldık; liderlerinin çevresinde halka oluşturup sonuna dek onu korudular. Savaş sesleri dindiğinde ve [ironborn_raid_target.GetNameNoTooltip]'in sokaklarında kan akarken akının kaptanı insafıma kalmıştı."

 agot_lannister_events.308.a:0 "Onu zindanlara gönder."

 agot_lannister_events.308.b:0 "Bu pisliği öldür ve işi bitir."

 agot_lannister_events.308.c:0 "Onu [ironborn_raid_target_holder.GetName]'in zindanına teslim et."
