### TODO NOT-IN-ST: agot_lannister_events.302.desc [AGOT: My men and I rushed to the aid of [ironborn_raid_target.GetNameNoTooltip]'s garrison. Though the fighting was fierce and there were casualties on both sides, our superior discipline and the worthy cause we fought for won the day. The raiders that weren't cut down where they stood fled back to their ships. \n\nOne man, the leader of the raid perhaps, refused to retreat. He is swinging his axe around wildly as my men close in on him to subdue him. \n\nOnce he is secured, he is brought before me in chains, that I may decide his fate.]
 agot_lannister_events.302.desc:0 "My men and I rushed to the aid of [ironborn_raid_target.GetNameNoTooltip]'s garrison. Though the fighting was fierce and there were casualties on both sides, our superior discipline and the worthy cause we fought for won the day. The raiders that weren't cut down where they stood fled back to their ships. \n\nOne man, the leader of the raid perhaps, refused to retreat. He is swinging his axe around wildly as my men close in on him to subdue him. \n\nOnce he is secured, he is brought before me in chains, that I may decide his fate."

