### TODO NOT-IN-ST: agot_lannister_events.308.desc [AGOT: My flanking force and I quickly split off from the main group as they charged into the fray. We wove our way through alleys and markets until we were positioned behind the enemy. The main force held valiantly as we stalked closer to our target. I waited until I was close enough to smell the enemy before giving the order to charge. \n\nWe smashed into the raiders rear, spreading fear and confusion amongst them, they formed a circle around their leading, protecting him to the last. As the sound of battle died down and blood ran through the streets of [ironborn_raid_target.GetNameNoTooltip] I had the captain of the raid at my mercy.]
