l_english:

 agot_filler_stormlands.0100.t:0 "Morne'un Kadim Bilgisi"

 agot_filler_stormlands.0100.desc:0 "Kahyam [steward.GetCouncilTitle] [steward.GetTitledFirstName], etkileyici bir öneriyle bana geliyor: Tarihler, kadim bir küçük krallığın bir zamanlar Tarth'un doğu kıyılarında hüküm sürdüğünü gösteriyor.\n\nBu küçük kralların Andal mı yoksa İlk İnsan mı olduğu tartışmalı olsa da, bilinen şu: Mükemmel Şövalye Ser Galladon, Morne'u evi olarak adlandırmış.\n\n"Şu harabelerin arasında hangi kadim bilgiler bulunabilir," diyor [steward.GetFirstNameNicknamedNoTooltip] sırıtarak, "keşke o kıyıları incelemek üzere bir sefer gönderseydik...""

 agot_filler_stormlands.0100.a:0 "Bilginin peşinde koşmak bedeline değer."

 agot_filler_stormlands.0100.a_tt:0 "Bir seferi finanse etme fırsatını kabul ediyorsun ama bu ne kadar fon gerektirecek?"

 agot_filler_stormlands.0100.b:0 "Bilginin peşinde koşmak buna değse iyi olur..."

 agot_filler_stormlands.0100.b_tt:0 "İsteksizce bir seferi finanse etme fırsatını kabul ediyorsun ama bu ne kadar fon gerektirecek?"

 agot_filler_stormlands.0100.c:0 "Altınımı neden küçük halkın hevesleri için harcayayım?"

 agot_filler_stormlands.0100.c_tt:0 "Sefer için fon vermeyi reddediyorsun. Elbette bedeline değmeyecek."

 agot_filler_stormlands.0101.t:0 "Morne'un Kadim Bilgisi"

 agot_filler_stormlands.0101.desc:0 "Sefer, Morne'un kadim harabelerine doğru yola çıktı.\n\nSer Galladon'un başarılarının o kadar büyük olduğu, Bakire'nin bile ona âşık olduğu söylenir. Sefer, Mükemmel Şövalye'nin efsanevi kılıcı #italic Just Maid#!'in herhangi bir izini bulmak için harabeleri didik didik arayacak ve o kadim kıyılarda gizlenen her türlü nadir bilgiyi geri getirecek.\n\n"Şimdi, sadece bu seferin ne kadar sürmesi gerektiğine karar vermemiz gerekiyor," diye hatırlatıyor [steward.GetTitledFirstName]."

 agot_filler_stormlands.0101.a:0 "Elbette bu yeterli olur..."

 agot_filler_stormlands.0101.a_tt:0 "Seferi altı ay finanse etmeyi kabul ediyorsun."

 agot_filler_stormlands.0101.b:0 "Bilgi her bedele değer!"

 agot_filler_stormlands.0101.b_tt:0 "Seferi bir yıl finanse etmeyi kabul ediyorsun."

 agot_filler_stormlands.0101.c:0 "Bir düşününce..."

 agot_filler_stormlands.0101.c_tt:0 "Sefer için fon vermeyi reddediyorsun. Bu zaman kaybıydı!"

 agot_filler_stormlands.0200.t:0 "Yağmur Ormanı'ndaki Cadı"

 agot_filler_stormlands.0200.desc:0 "Saraylılarımın ve danışmanlarımın aralıksız akınlarından nihayet kurtulduğum, odamda sakin düşüncelere daldığım, diğerlerinden farksız bir geceydi. Huzurum, elbette, [steward.GetTitledFirstName]'nin kapımı aralıksız çalmasıyla bozuldu. Sonunda ayağa kalkıp [steward.GetHerHim]'i içeri aldım ve asık suratımla [steward.GetHerHis] araya girmesinden hoşlanmadığımı belli ettim.\n\n"[ROOT.Char.GetLadyLord|U], Yağmur Ormanı'nın derinliklerinde iğrenç ritüeller gerçekleştiren bir kadın hakkında... rahatsız edici raporlar aldık. Bazıları bunun küçük halkın ördüğü olağan masallar olduğunu söyler ama raporlar biriktikçe, bunu görmezden gelmek aptallık olur. Bir muhafız müfrezesi gönderip araştırmamı ister miydiniz?""

 agot_filler_stormlands.0200.a:0 ""İstediğim şey, [steward.GetTitledFirstName], bana biraz huzur ve sessizlik tanımandır.""

 agot_filler_stormlands.0200.a_tt:0 "Köylülüğün şikâyetleri muhtemelen devam edecek..."

 agot_filler_stormlands.0201.t:0 "Yağmur Ormanı'ndaki Cadı"

 agot_filler_stormlands.0201.desc:0 "Yağmur Ormanı'ndaki bu #N cadı#! hakkındaki masalların kulaktan dolma olduğunu sanıyordum ama şimdi önümde, hepsi aynı rahatsız edici yalvarışı paylaşmak için bağıran bir köylü kalabalığı duruyor...\n\nKüçük halk abartıyor olabilir ama belki de yardım çağrılarına kulak vermeliyim."

 agot_filler_stormlands.0201.a:0 "Bunu çözmesi için [marshal.GetTitledFirstName]'i göndereceğim."

 agot_filler_stormlands.0201.a_tt:0 "[marshal.GetHerHis] sağlam eliyle durum kesinlikle yatışacaktır."

 agot_filler_stormlands.0201.b:0 "Bu korkunç hikâyelerden yeterince duydum!"

 agot_filler_stormlands.0201.b_tt:0 "Böyle konuşmalar rüyalarını musallat edecek gibi..."

 agot_filler_stormlands.0202.t:0 "Yağmur Ormanı'ndaki Cadı"

 agot_filler_stormlands.0202.desc:0 "[marshal.GetTitledFirstName] geri döndü ve ben bu #N cadı#! işini arkamda bırakmaya hevesliyim. Ama [marshal.GetSheHe] içeri girer girmez haberlerin kötü olacağını anlıyorum.\n\n"[ROOT.Char.GetLadyLord|U]," diyor [marshal.GetSheHe] zayıf bir sesle, neredeyse bir fısıltı. "Cadı bir görüşme talep ediyor...""

 agot_filler_stormlands.0202.a:0 "Bu bir #bold kâbus#!."

 agot_filler_stormlands.0202.a_tt:0 "Böyle bir ziyarete izin vermeden önce hazırlıklar yapmalısın. Ama bu isteği görmezden gelmeye cesaret edemezsin..."

 agot_filler_stormlands.0203.t:0 "Yağmur Ormanı'ndaki Cadı"

 agot_filler_stormlands.0203.desc:0 "Hazırlıklarım tamamlandı ve [marshal.GetTitledFirstName] bir kez daha #N cadı#! ile görüşmeye gönderildi. [marshal.GetSheHe|U] onu bir görüşme için saraya getirecek.\n\n[marshal.GetFirstNameNicknamedNoTooltip] döndüğünde dışarıdaki fırtına özellikle şiddetli görünüyor. Odayı bir şimşek çakması dolduruyor, ardından gök gürültüsünün yüksek çatırtısı... Ve işte orada — göz kamaştırıcı, neredeyse uhrevi bir zarafetle.\n\nSaraylılarım dehşetle bakarken cadının sözleri doğrudan kafamın içine girer gibi oluyor. Beni ona hizmet etmeye çağırıyor..."

 agot_filler_stormlands.0203.a:0 "Evet, leydim..."

 agot_filler_stormlands.0203.a_tt:0 "Günler geçse de, cadının sesini kafanın içinden atamıyorsun."

 agot_filler_stormlands.0203.b:0 "#bold Defol, cadaloz!#!"

 agot_filler_stormlands.0203.b_tt:0 "Cadıyı kovuyorsun ama böyle bir muamele tehlikesiz değil."

 agot_filler_stormlands.0300.t:0 "Bir Dorne Ticaret Kervanı"

 agot_filler_stormlands.0300.desc:0 "Kahyam [steward.GetCouncilTitle] [steward.GetTitledFirstName], ticaret hakkında epey bilgili — ve yerel pazarlarımızda hangi malların güzel kâr getireceği hakkında daha da bilgili.\n\nBugün [steward.GetSheHe|l] bana şaşırtıcı bir öneriyle geldi: Dorne'dan bir ticaret kervanı, mallarını topraklarımda satmak için izin istemiş. [steward.GetSheHe|U] buna değeceğine söz veriyor."

 agot_filler_stormlands.0300.a:0 "Bana anlaşma gibi geliyor!"

 agot_filler_stormlands.0300.a_tt:0 "Dornelularla yeni bir ticaret ilişkisi kuruyorsun."

 agot_filler_stormlands.0300.b:0 "Bunun kulağa hoş gelmedi."

 agot_filler_stormlands.0300.b_tt:0 "Ticaret mallar getirebilir ama yabancıları da getirir..."

 agot_filler_stormlands.0300.c:0 "Önerilerini, bir bedel karşılığında değerlendireceğim."

 agot_filler_stormlands.0300.c_tt:0 "Kasalarını önce açarlarsa Dornelu tüccarlarla görüşmeyi teklif ediyorsun."

 agot_filler_stormlands.0300.d:0 "Kabul edeceğim ama yeni ticaret ortaklarım konusunda emin olmam gerek."

 agot_filler_stormlands.0300.d_tt:0 "Dorneluların sana zarar verme niyetinde olmadığından emin olmak için güvendiğin bazı ortaklar tutuyorsun."

 agot_filler_stormlands.0300.e:0 "Ah, evet, şey... Daha fazla insanla uğraşmayı tercih etmem."

 agot_filler_stormlands.0300.e_tt:0 "Sadece #italic bu#! sohbet bile şimdiden yeterince fazlaydı!"

 agot_filler_stormlands.0301.t:0 "Dorneli Ticaret Kervanı: Soygun"

 agot_filler_stormlands.0301.desc:0 "Dornelu tüccarlar benimle görüşme fırsatı için ödeme yapabildiler... Peki bana başka ne verebilirler?\n\nOnları bir toplantıya getirdim ama ödeme yapmak zorundalar."

 agot_filler_stormlands.0301.a:0 "Belki bunu başka bir zaman yeniden ele almalıyız."

 agot_filler_stormlands.0301.a_tt:0 "Soygun fikrinden vazgeçip toplantıyı yeniden planlamayı teklif ediyorsun."

 agot_filler_stormlands.0301.b:0 "Hesap ödeme zamanı!"

 agot_filler_stormlands.0301.b_tt:0 "Dornelu tüccarların değerli eşyalarını ve tüm altınlarını alıyorsun."

 agot_filler_stormlands.0301.c:0 "Ah, bu eğlenceli olacak..."

 agot_filler_stormlands.0301.c_tt:0 "Tüccarları biraz daha bekletmeye karar veriyorsun... #bold zindanında!#!"

 agot_filler_stormlands.0302.t:0 "Dorneli Ticaret Kervanı: Soygun"

 agot_filler_stormlands.0302.desc:0 "Bu Dorneluları neden hapsettiğimi zar zor hatırlıyorum ama saraylılarım durum hakkında tedirgin olmaya başladı.\n\nBu tüccarlarla bir kez ve sonsuza dek ilgilenme zamanı geldi."

 agot_filler_stormlands.0302.a:0 "Ticaret teklifi de böylece çöpe gitti!"

 agot_filler_stormlands.0302.a_tt:0 "Dornelu tüccarlara ölene kadar işkence ediyorsun."

 agot_filler_stormlands.0400.t:0 "Dayanılmaz Fırtına"

 agot_filler_stormlands.0400.desc:0 "Durran Tanrıkeder, fırtınalara inat bir kale inşa ederken ne yaptığını biliyordu. Şimdi, ben onun tercihini sorguluyorum.\n\nDayanılmaz bir fırtına aylardır kalemde çarpıyor gibi hissettiriyor. Sonu görünmediğinden, tüm bu süre boyunca kapalı kaldım.\n\nSanırım fırtına beni delirtiyor. Bir şeyler yapmalıyım. Davul kulenin en üst katına tırmanıp bir pencere açıyorum..."

 agot_filler_stormlands.0400.a:0 "#bold ÖFKEMİZ BİZİMDİR!#!"

 agot_filler_stormlands.0400.a_tt:0 "Fırtınalı boşluğa yüksek sesle bağırıyorsun."

 agot_filler_stormlands.0401.t:0 "Dayanılmaz Fırtına"

 agot_filler_stormlands.0401.desc:0 "#bold İşe yaradı!#! Çığlığın bir işe yaramasını beklemiyordum ama pencereyi kapatır kapatmaz, çakan yağmurun sesi dağıldı."

 agot_filler_stormlands.0401.a:0 "Daha sık bağırmalıyım..."

 agot_filler_stormlands.0401.a_tt:0 "Bu beklenmedikti!"

 agot_filler_stormlands.0402.t:0 "Dayanılmaz Fırtına"

 agot_filler_stormlands.0402.desc:0 "Çığlığım çakan yağmurların gürültüsünü yırttı ama fırtına inatla devam etti. Ancak pencereyi kapatırken, bedenimi saran kötülüklerin fırtınanın ardından süpürüldüğünü hissetmekten kendimi alamıyorum."

 agot_filler_stormlands.0402.a:0 "Yeniden doğuyorum."

 agot_filler_stormlands.0402.a_tt:0 "Deniz tanrısının kızı Elenei'ye bir dua ediyorsun."

 agot_filler_stormlands.0403.t:0 "Ani Fırtına"

 agot_filler_stormlands.0403.desc:0 "Topraklarımda at sürerken, ilk başta hiçbir şey ters gitmiyordu; güneş gökyüzünde yükselmiş, kucaklayışıyla sırtımı ısıtıyordu. Ancak Fırtına Toprakları, adlarına sadık kalarak, sakin gökyüzünün ya da denizlerin uzun süre rahat durmasına asla izin vermez. \n\nÖnce sadece bir çiseleme olarak başlıyor ama çok geçmeden gökyüzü tamamen açılıyor, rüzgârlar Durran Tanrıkeder'in masallarındaki kadar güçlü bir şekilde vadide uluyor. Benim için talihsiz olan şu ki, günün Fırtına Ucu, birkaç yüz metre ötede bir sırtta fark ettiğim harap bir çiftlik evi olacak."

 agot_filler_stormlands.0403.a:0 "Oraya ivedilikle at süreceğim!"

 agot_filler_stormlands.0404.t:0 "Ansızın Fırtına: Sığınak Arayan Haydutlar"

 agot_filler_stormlands.0404.desc:0 "Çiftlik evine nispeten hızlı ulaştım ve kendimi yerleştirmeyi başardım. Ocağın yanında biraz eski odun vardı ve neyse ki onu tutuşturmayı başardım; öğleden sonra akşama dönerken bana biraz küçük bir teselli sağladı. Ancak alacakaranlık çökerken, sızdıran çatıya çarpan yağmur sesini kesen yerdeki toynak seslerini duydum. \n\nDışarıda atlarıyla gelen serseri grubuna pencereden bakmak için ayağa kalkıyorum; hepsi küçük atımı kötü niyetle süzüyor. Bir mil uzaktan haydut olduklarını anlayabileceğim türdeler; aylardır sıcak bir yatağın konforunu görmemiş oldukları belli.\n\nYaklaştıkça, ilk hamleyi yapmanın en iyisi olduğuna karar veriyorum; kapıya yürüyüp açıyorum, grubun lideri benden yalnızca birkaç adım uzakta duruyor. "

 agot_filler_stormlands.0404.a:0 "Kılıcımı çekip lidere yöneliyorum."

 agot_filler_stormlands.0404.b:0 ""Beyler! Biraz yoldaşım olacağını görmek ne güzel.""

 agot_filler_stormlands.0404.c:0 "Can güvenliğim için onlara para vereceğim."

 agot_filler_stormlands.0404.d:0 "Liderleriyle pazarlık etmeyi deneyeceğim."

 agot_filler_stormlands.0404.success_title:0 "Barışı kabul et"

 agot_filler_stormlands.0404.failure_title:0 "Savaş!"

 agot_filler_stormlands.0405.t:0 "Ansızın Fırtına: Ölümüne Bir Dövüş"

 agot_filler_stormlands.0405.desc:0 "Haydutların lideri senden kısa süre sonra kılıcını çekiyor. Bu durumdan barışçıl ayrılmak hiçbir zaman bir seçenek değilmiş, anlaşılan. Arka adamlara el işareti yapıp onlara sessizce bunu ona bırakmalarını söylüyor. Kötü giyimli; gambeson'u hem önceki çatışmalardan hem de aşınmadan birkaç yerden yırtık.\n\n"Bunu gerçekten yapmak istediğine emin misin?" diyor, sen yaklaşırken savunmasını yükseltip bir adım bile geri adım atmaya niyetli olmadan."

 agot_filler_stormlands.0405.a:0 ""Senden daha iyi adamlarla dövüştüm.""

 agot_filler_stormlands.0405.success_title:0 "Dövüşü kazandı!"

 agot_filler_stormlands.0405.failure_title:0 "Kavgayı kaybetti..."

 agot_filler_stormlands.0406.t:0 "Ansızın Fırtına: İstenmeyen Ev Misafirleri"

 agot_filler_stormlands.0406.desc:0 "Bir haydut sürüsüyle gece geçirmek, kulağa geldiği kadar huzurluydu. Hiçbiri bana dokunmadı, Tanrılara şükür; ama hepsinin birbiriyle en bayağı, en boğuk dille konuşup bozuk şarapla dolu tulumları kurutmasını izlemek pek hoş bir akşam geçirtti sayılmaz. Söylemeye gerek yok, zamanı hızlandırmak için bir katil çetesi arasında uyumak pek de bir seçenek değildi.\n\nAncak gün ışığı doğunca, fırtına da öylece kesti; görünüşe göre şimdilik gökyüzünün topraklarına boşaltacak bir şeyi kalmamıştı. Fırtınanın bitmesinden çok kısa süre sonra haydutlar da dağıldı."

 agot_filler_stormlands.0406.a:0 "Yollarımızın bir daha kesişmemesi için dua ediyorum."

 agot_filler_stormlands.0407.t:0 "Ansızın Fırtına: Yalnız Bir Gece"

 agot_filler_stormlands.0407.desc:0 "Küçük atımı bağladıktan sonra, harap eve doğru yola koyuldum. Görünüşüne bakılırsa on yıldan fazladır terk edilmişti. İçi nem ve çürüme kokuyordu; hangi köylü yaşadıysa onun seyrek mobilyalarında tahta bitleri kaynaşıyordu. Yine de tuhaf bir huzur vardı. Hangi dilekçelerle geldiklerini sorarak beni rahatsız eden danışmanlar yok, gözüme girmeye çalışan dalkavuklar ve yaltakçılar yok. En iyi koşullarda olmasa da, kendime biraz zaman.\n\nFırtınanın dinmesi bütün gece sürdü ama neyse ki birkaç saat uyku almayı başardım. "

 agot_filler_stormlands.0407.a:0 "Eve dönme zamanı."

 agot_filler_stormlands.0408.t:0 "Ansızın Fırtına: Savaş Ganimetleri"

 agot_filler_stormlands.0408.desc:0 "Küçük atımı bağladıktan sonra, harap eve doğru yola koyuldum. Görünüşüne bakılırsa on yıldan fazladır terk edilmişti. İçi nem ve çürüme kokuyordu; hangi köylü yaşadıysa onun seyrek mobilyalarında tahta bitleri kaynaşıyordu. Görünüşe göre terk ediliş aceleyle yapılmıştı; sakinleri büyük olasılıkla savaş yüzünden kaçırılmıştı.\n\nAncak ayrılmak için acele ederken, değerli eşyalarının hepsini almamışlardı. Ya da daha büyük ihtimalle, onları bilerek saklamışlardı; geri gelip almayı umarak. Ocağa doğru yürürken, döşeme tahtalarından biri çürüyüp içinde küçük bir kasa, birkaç altın ejderha ve seksen gümüş geyik bulunan bir boşluğu ortaya çıkarmıştı."

 agot_filler_stormlands.0408.a:0 "Görünüşe göre talih bana gülümsüyor, sonunda."

 agot_filler_stormlands.0409.t:0 "Ani Fırtına"

 agot_filler_stormlands.0409.desc:0 "Çiftliğe dörtnala yaklaşırken, yakınlarda sığınak arama fikrini yalnızca benim düşünmediğimi gördüm. Dışarıdaki birkaç kalan çit direğinden birine bağlı bir katır boş boş duruyordu; neyse ki, küçük atımı bağlamam için bir direk daha kalmıştı. Katırın eyeri, sol tarafına dikilmiş yedi köşeli bir yıldız dışında oldukça sadeydi.\n\nKapı gıcırdayarak açıldı ve yerinde çubuğa benzeyen yaşlı bir adam belirdi — gezgin bir Septon; dalgalanan beyaz cübbeler ve boynunda bir kristal. Beni kibarca içeri davet etti ve gecenin geç saatlerine kadar inanç hakkında konuştu; yalnızca gün ışığı doğup fırtına dinince durdu."

 agot_filler_stormlands.0409.a:0 "İnanç hakkında onunla konuşmaktansa katırıyla konuşmayı tercih ederdim."

 agot_filler_stormlands.0409.b:0 "Gerçekten de çok ilginç noktalara değindi..."

 agot_filler_stormlands.0409.c:0 "Söyledikleri hakkında ne düşüneceğimden bile emin değilim..."

 agot_filler_stormlands.0410.t:0 "Ansızın Fırtına: Çit Şövalyesi"

 agot_filler_stormlands.0410.desc:0 "Çiftliğe dörtnala yaklaşırken, yakınlarda sığınak arama fikrini yalnızca benim düşünmediğimi gördüm. Dışarıda bir direğe bağlı iki at duruyordu; büyük bir yük atı ve küçük bir Marcher midillisi. İkisi de sırtlarında çok sayıda erzak taşıyordu; yük atının üzerinde ayrıca, üzerinde tanımadığım bir arması olan bir kalkan da vardı.\n\nAdam içeride yaklaşımımı duymuş, kapıyı açıyor; biraz bol bir savaş yeleği içinde, eli kılıcının kabzasında duruyor. Ancak benim bir haydut olmadığımı anlayınca hızla rahatlıyor. Beni içeri davet etti ve kendini bir çit şövalyesi olarak tanıttı. Gecenin geç saatlerine kadar oturup ikimizin de katıldığı turnuvaları ve savaştığımız muharebeleri konuştuk."

 agot_filler_stormlands.0410.a:0 "Ayrılmaya hazırlanırken, onu kalemde hizmet etmeye davet ediyorum."

 agot_filler_stormlands.0410.b:0 "Oldukça keyifli bir akşam oldu."

 agot_filler_stormlands.0411.t:0 "Kum Fırtınası Gibi Bir Kadın"

 agot_filler_stormlands.0411.desc:0 "Muhafız şefim, yakın zamanda yapmak zorunda kaldığı bir tutuklama haberini vermek için önüme çıktı; küçük Dorne soylularının piç kızı, bir tavernada bir grup adamla kavgaya girdikten sonra adamları tarafından hapsedilmiş — Dornelular hakkında yaptıkları umursamaz yorumlara kulak misafiri olduktan sonra. Ayrıca, muhafızlar onu gözaltına almaya geldiğinde, nihayet zapt edilmeden önce üçünü birden etkisiz hale getirmeyi başarmış.\n\nPiç de olsa soylu kanı taşıdığından, ona ne yapılacağı konusunda benden bir karar alması gerektiğini hissetmiş."

 agot_filler_stormlands.0411.a:0 "Ne kadar da güçlü bir kadına benziyor! Güçlü bir karı işime yarar..."

 agot_filler_stormlands.0411.b:0 "Kendini bir savaşçı sanıyorsa, onu memnuniyetle düzeltirim."

 agot_filler_stormlands.0411.c:0 "Soyluluk kanı olsun ya da olmasın, Kral'ın adaletini görecek."

 agot_filler_stormlands.0411.d:0 "Onu kendi gözlerimle görmeliyim! Onu getirin, bir de şarap!"

 agot_filler_stormlands.0411.e:0 "Onu Kızıl Dağlar'ın ötesine geri götürtüreceğim."

 agot_filler_stormlands.0412.t:0 "Kum Fırtınası Gibi Bir Kadın: Düello"

 agot_filler_stormlands.0412.desc:0 "Hizmetkârlarımdan biri cübbemi bağlarken, kadın kendini karakteristik Dorne tarzı plaka zırhıyla donatıyor; benim teçhizatım daha yarıya bile gelmeden o çoktan tamamen zırhlanmış. Ardından oturup, teçhizatım tamamlanana kadar bana bakarak mızrağının ucunu cilalıyor. "Seni fazla hırpalamamaya çalışacağım," diyorum; başka bir hizmetkârım bana kılıcımı uzatırken.\n\n"Sana aynı nezaketi göstermeyeceğim, [ROOT.Char.GetLadyLord|U]," diye yanıtladı; ikimiz avlunun ortasına yaklaşırken mızrağını zarifçe savurarak."

 agot_filler_stormlands.0412.a:0 ""Hadi dans edelim.""

 agot_filler_stormlands.0412.success_title:0 "Dövüşü kazandı!"

 agot_filler_stormlands.0412.failure_title:0 "Kavgayı kaybetti..."

 agot_filler_stormlands.0413.t:0 "Kum Fırtınası Gibi Bir Kadın: Zafer"

 agot_filler_stormlands.0413.desc:0 "Dövüş, hayal ettiğim kolay zaferden çok uzak; kadının zarafeti ve hüneri, zamanında dövüştüğüm birçok şövalyeden daha üstün, kesin. O mızrakla birkaç güzel vuruş yapıyor ve aramızdaki mesafeyi kapatmama izin vermemek için büyük özen gösteriyor.\n\nSonunda, yakın mesafeye giriyorum; ve yakın mesafede, onun o mızrağı bir engelden çok bir yük oluyor. Hızlı ardışık beş iyi vuruş yapıyorum ve kadın sırt üstü yere seriliyor.\n\nDüşüşü sırasında mızrağının kavramasını kaybediyor ve mızrak yana fırlıyor. Savunmasız kalan kadın isteksizce teslim oluyor. Ona elimi uzatıyorum ama o sessizce ve öfkeyle elimi itip ayağa kalkıyor ve mızrağını almak için bile durmadan avludan çıkıp gidiyor."

 agot_filler_stormlands.0413.a:0 ""Aynen öyle, defolup git Dorne'a geri!""

 agot_filler_stormlands.0414.t:0 "Kum Fırtınası Gibi Bir Kadın: Yenilgi"

 agot_filler_stormlands.0414.desc:0 "Dövüş, karşılaştığım en zor dövüşlerden biri; onun çevikliği ve mahareti daha önce gördüğüm hiçbir şeye benzemiyor. Ne zaman mesafeyi kapatmaya çalışsam, ya beni durdurmak için mızrağıyla dürtüyor ya da kenara kaçıp böğrüme vuruyor. Zırhımın ağırlığıyla, kaybettiğim bir yıpratma savaşı veriyorum.\n\nİlk başta ayak uydurabiliyorum ama birkaç dakika sonra bitkin düşüyorum — ve tam o anda dizimin arkasına bir darbe indirmeyi başarıyor. Yere düşüyorum.\n\nİsteksizce teslim oluyorum. Kadın kendinden memnun bir halde başını sallayıp avlumdan vals ederek çıkıyor ve beni yenilgimin utancıyla baş başa bırakıyor. Hizmetkârlarımdan biri el uzatmak için geliyor ve ben huysuzca elini itip kendim kalkıyorum."

 agot_filler_stormlands.0414.a:0 "Neyse ki, yalnızca gururum yaralandı..."

 agot_filler_stormlands.0415.t:0 "Babaların Kederi"

 agot_filler_stormlands.0415.desc:0 "İki baba önüme çıkıp, her ikisinin oğullarının ölümü için birbirini suçluyor.\n\nOğullar gemiciliğe başlamış, yalnızca ilk yolculuklarında Gemi Kıran Körfezi'nde ölmüşler. İki baba da çocuklarını bu mesleğe kendilerinin teşvik ettiğini söylüyor."

 agot_filler_stormlands.0415.a:0 "Onlarla akılla konuşmayı deneyeceğim."

 agot_filler_stormlands.0415.b:0 "Acıyı fazlasıyla iyi bilirim. Gel, konuşalım."

 agot_filler_stormlands.0415.c:0 "Kimin haklı olduğuna Savaşçı karar versin!"

 agot_filler_stormlands.0415.c_tt:0 "İki baba ölümüne dövüşecek ve kazanan Sur'a gönderilecek."

 agot_filler_stormlands.0415.d:0 "Siz ikinizin yeri zindanım..."

 agot_filler_stormlands.0416.t:0 "Babaların Kederi"

 agot_filler_stormlands.0416.desc:0 "İki babayı masama davet ediyorum ve durumu konuşmaya başlıyoruz.\n\nBu durumda suç atfetmek kolay olsa da, gerçek şu ki dünya zalim bir yer ve oğullarının ölümü Yabancı'dan başka kimsenin suçu değil.\n\nBirkaç dakikalık sessizliğin ardından babalar, gereksiz yere birbirlerinden nefret etmek yerine kaybettikleri oğullarının yasını birlikte tutmaya karar veriyor."

 agot_filler_stormlands.0416.a:0 "Bunu çözdüğümüze sevindim."

 agot_filler_stormlands.0417.t:0 "Babaların Kederi"

 agot_filler_stormlands.0417.desc:0 "[grieving_father_1.GetFirstNameNicknamedNoTooltip] sarayıma geri dönüyor ama bu sefer yalnız. Sendeleyen yürüyüşünden içmiş olduğunu anlıyorum.\n\n"[ROOT.Char.GetLadyLord|U]," diye peltekleyerek konuşuyor. "Size bir itirafla geliyorum. [grieving_father_2.GetFirstNameNicknamedNoTooltip]'i öldürdüm!" Cinayetin suçluluğunun onu içten içe kemirdiğini anlıyorum ve yine de — böyle bir suçun cezasız kalmasına izin veremem."

 agot_filler_stormlands.0417.a:0 "Zindanımda çürüyeceksin."

 agot_filler_stormlands.0417.b:0 "Canınla ödeyeceksin!"

 agot_filler_stormlands.0418.t:0 "Babaların Kederi"

 agot_filler_stormlands.0418.desc:0 "Babalar, taht salonumun karşı taraflarında yerlerini alıp kılıçlarını kuşanıyor. Dövüş ölümüne olacak ve kazanan siyah giyinip Gece Nöbetçileri'ne katılacak.\n\nKaderlerini Yabancı belirlesin."

 agot_filler_stormlands.0418.a:0 "Bunu erkekler gibi çözecekler."

 agot_filler_stormlands.0419.t:0 "Babaların Kederi"

 agot_filler_stormlands.0419.desc:0 "[grieving_father_1.GetFirstNameNicknamedNoTooltip] hemen üstünlüğü ele geçiriyor. Birkaç hızlı darbe indirip [grieving_father_2.GetFirstNameNicknamedNoTooltip]'i yaralıyor ve ilerleyişini yavaşlatıyor.\n\nYalnızca birkaç dakika sonra ölümcül darbeyi vuruyor ve [grieving_father_2.GetFirstNameNicknamedNoTooltip]'i taş zeminde ölü bırakıyor."

 agot_filler_stormlands.0419.a:0 "İntikamını aldın, şimdi siyahı giy."

 agot_filler_stormlands.0420.t:0 "Babaların Kederi"

 agot_filler_stormlands.0420.desc:0 "[grieving_father_2.GetFirstNameNicknamedNoTooltip] yavaşça üstünlüğü ele geçiriyor. Birkaç hızlı darbeyi savuşturduktan sonra [grieving_father_1.GetFirstNameNicknamedNoTooltip]'in kılıç koluna sert bir kesik indiriyor.\n\nYalnızca birkaç dakika sonra ölümcül darbeyi vuruyor ve [grieving_father_1.GetFirstNameNicknamedNoTooltip]'i taş zeminde ölü bırakıyor."

 agot_filler_stormlands.0420.a:0 "İntikamını aldın, şimdi siyahı giy."

 agot_filler_stormlands.0421.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0421.desc:0 "Bir fırtınalı gece daha diyarımı dövüyor — uluma rüzgâr kalemde esip geçiyor. Bu sabah, rüzgârın yuvasından düşürmüş olması gereken yaralı bir #bold çakır atmaca#! buluyorum."

 agot_filler_stormlands.0421.a:0 "Onu sağlığına kavuşturmayı denemeliyim!"

 agot_filler_stormlands.0421.a_tt:0 "Genç kuşu iyileştirmeyi deneyeceksin ama riskler var."

 agot_filler_stormlands.0421.b:0 "Böyle bir kuş için birileri iyi para öder..."

 agot_filler_stormlands.0421.c:0 "Doğa böyledir, zavallıcık."

 agot_filler_stormlands.0422.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0422.desc:0 "Tüm çabalarıma rağmen genç atmaca hastalandı. Zavallıcığı kurtarmak için bir şeyler yapılmalı!"

 agot_filler_stormlands.0422.a:0 "İyileşmesi için yalnızca umut edebilirim..."

 agot_filler_stormlands.0422.b:0 "Tıbbi bilgimi kullanıp yardım edebilirim!"

 agot_filler_stormlands.0422.c:0 "Kuşun yanından ayrılmayacağım."

 agot_filler_stormlands.0423.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0423.desc:0 "Çabalarım karşılığını verdi! Çakır atmaca biraz güç topladı — belki de hâlâ iyileşebilir."

 agot_filler_stormlands.0423.a:0 "Kader bize gülümsüyor!"

 agot_filler_stormlands.0424.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0424.desc:0 "Çabalarımın Yabancı'nın ziyaretini savuşturabileceğini ummuştum ama ne yazık ki...\n\nGenç çakır atmaca, can vermeden önce son bir hırıltılı çığlık atıyor."

 agot_filler_stormlands.0424.a:0 "Zavallıcık..."

 agot_filler_stormlands.0425.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0425.desc:0 "Genç atmacayı sağlığına kavuşturmak kendi zorluklarını beraberinde getirdi. Bugün, ona küçük bir et parçası yedirmeye çalışırken çakır atmaca beni ısırıyor!"

 agot_filler_stormlands.0425.a:0 "Bu azme hayranım!"

 agot_filler_stormlands.0425.b:0 "Kuşu başkasına vermek en iyisi olabilir."

 agot_filler_stormlands.0425.b_tt:0 "Kuşu iyileştirmekten vazgeçip onu, hayvanlarla arası iyi olan bir ahır görevlisine hediye ediyorsun."

 agot_filler_stormlands.0426.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0426.desc:0 "Genç atmacayı iyileştirme çabalarım iyi gidiyordu. Ama bugün, her zamanki beslenme saatine döndüğümde atmaca kaçmış! #bold KAHROLASI!#!"

 agot_filler_stormlands.0426.a:0 "Onu bulmayı denemeliyim."

 agot_filler_stormlands.0427.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0427.desc:0 "Neden kalemde bu kadar çok delik ve bucak var? Kaleyi arayarak yarım gün geçirmiş olmalıyım; derken tanıdık bir ses duyuyorum. İşte, eski bir sandığın arkasında, genç atmaca."

 agot_filler_stormlands.0427.a:0 "Bu kadar uzağa gelebilmiş olmana şaşırdım!"

 agot_filler_stormlands.0428.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0428.desc:0 "Neden kalemde bu kadar çok delik ve bucak var? Vazgeçmeden önce kaleyi arayarak yarım gün geçirmiş olmalıyım. Genç atmaca hiçbir yerde bulunamıyor..."

 agot_filler_stormlands.0428.a:0 "Birileri onu çalmış olabilir mi?"

 agot_filler_stormlands.0428.a_tt:0 "Bir daha asla kimseye güvenemeyebilirsin."

 agot_filler_stormlands.0429.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0429.desc:0 "Şimdiden, çabalarım genç atmacanın bünyesinde gözle görülür iyileşmeler sağladı. Gücünü toplamaya devam ederken, çakır atmaca bana alışmış gibi görünüyor.\n\nBu akşam akşam yemeğimi yerken, iri gözlerle bana baktığını fark ediyorum..."

 agot_filler_stormlands.0429.a:0 "Bu kadar ete ihtiyacım yok."

 agot_filler_stormlands.0430.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0430.desc:0 "Genç atmaca sağlığına kavuştuğu gibi ruhunu da geri kazandı. Kuş, gökyüzüne dönmeye hazır görünüyor — ama ben onu bırakmaya hazır mıyım?\n\nBaşka bir seçenek daha var, diye düşünüyorum kendi kendime. Belki de doğancılığa başlamalıyım?"

 agot_filler_stormlands.0430.a:0 "Kuşu eğitmeye başlayacağım."

 agot_filler_stormlands.0430.b:0 "Vahşi doğaya aittir; onu salacağım."

 agot_filler_stormlands.0431.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0431.desc:0 "Bir av ortağını eğitmenin zorlukları iyi bilinir ama çakır atmaca yoldaşım doğuştan bir katil. Her çıkışta, aramızdaki bağın güçlendiğini hissediyorum.\n\nBir doğancı olacağım kimin aklına gelirdi?"

 agot_filler_stormlands.0431.a:0 "Tavşan pişirmenin daha çok yolunu bulmalıyım."

 agot_filler_stormlands.0432.t:0 "Öksüz Atmaca"

 agot_filler_stormlands.0432.desc:0 "Bir av ortağını eğitmenin zorlukları iyi bilinir ve benim mücadelem gerçekten de zorlu oldu. Güvendiğim mareşalimin gözetiminde bile, çakır atmacayla birlikte avlanmayı öğrenme konusunda şansım olmadı.\n\n"Belki de bundan vazgeçmelisin, [ROOT.Char.GetLadyLord|l]?""

 agot_filler_stormlands.0432.a:0 "Haklısın, onu salacağım."

 agot_filler_stormlands.0432.b:0 "Sana göstereceğim!"

 agot_filler_stormlands.0432.b_tt:0 "Çabalarını ikiye katlıyorsun."

 agot_filler_stormlands.0433.t:0 "İki Şövalyenin Hikâyesi"

 agot_filler_stormlands.0433.desc:0 "Bugün sarayıma bir Çit Bölgesi çit şövalyesi, oldukça tuhaf bir taleple geldi. Turnuvada galibin kesesini çaldığını iddia ettiği bir Dornelu şövalyeyi takip ediyor; ayrıca kaçarken yaverini öldürdüğünü söylüyor.\n\nŞövalye, Dornelunun Kızıl Dağlar'ı aşıp anavatanına dönmek için topraklarımdan geçtiğine inanıyor. Bu serserinin izini sürmek için benden izin istiyor."

 agot_filler_stormlands.0433.a:0 "İznim sende."

 agot_filler_stormlands.0433.b:0 "Bu topraklarda darağacı hakkı yalnızca bende."

 agot_filler_stormlands.0433.c:0 "Avda sana katılacağım!"

 agot_filler_stormlands.0434.t:0 "İki Şövalyenin Hikâyesi: İntikam"

 agot_filler_stormlands.0434.desc:0 "Çit şövalyesi sarayına geri döndü. Sana, Dornelu şövalyeyi bir genelevde küplere binmiş halde bulduğunu anlatıyor; başlangıçta onu yakalamaya çalışırken, sarhoş serseri ona kılıç çekmiş ve ona #bold savaşmaktan#! başka seçenek bırakmamış.\n\nNeyse ki, bir gecelik fahişe ve şarap alemleri onu Çit Adamı'na zarar verebilecek durumda bırakmamış."

 agot_filler_stormlands.0434.a:0 "Görünüşe göre diyarların bu gece bir haydudu eksildi."

 agot_filler_stormlands.0435.t:0 "İki Şövalyenin Hikâyesi: Genelevde Ölüm"

 agot_filler_stormlands.0435.desc:0 "Bir grup muhafızın önüne bir Dornelu getiriyor ve çit şövalyesinin aradığı adamın bu olduğunu bildiriyor. İkisi bir genelevde kılıç kılıca gelmiş; muhafazarların müdahalesinden önce Dornelu, Çit Adamı'nı öldürmüş.\n\nKendisinin masum olduğunu, yaverle hiç tanışmadığını ve çit şövalyesinin yalnızca kendisini atından düşürdüğü için intikam peşinde olduğunu iddia ediyor. Galibin kesesini çalma konusuna gelince, turnuvanın ortasında kendisinin de atından düştüğünü ve ayrıldığını söylüyor."

 agot_filler_stormlands.0435.a:0 "Yeterince kan döküldü, bırak onu."

 agot_filler_stormlands.0435.b:0 "Bu bayağı herif Kral'ın adaletiyle yüzleşecek."

 agot_filler_stormlands.0436.t:0 "İki Şövalyenin Hikâyesi: Genelevde Ölüm"

 agot_filler_stormlands.0436.desc:0 "Bir grup muhafızın önüne bir Dornelu getiriyor ve çit şövalyesinin aradığı adamın bu olduğunu bildiriyor. İkisi bir genelevde kılıç kılıca gelmiş; muhafazarların müdahalesinden önce Dornelu, Çit Adamı'nı öldürmüş.\n\nKendisinin masum olduğunu, yaverle hiç tanışmadığını ve çit şövalyesinin yalnızca kendisini atından düşürdüğü için intikam peşinde olduğunu iddia ediyor. Galibin kesesini çalma konusuna gelince, turnuvanın ortasında kendisinin de atından düştüğünü ve ayrıldığını söylüyor."

 agot_filler_stormlands.0436.a:0 "Yeterince kan döküldü, bırak onu."

 agot_filler_stormlands.0436.b:0 "Bu bayağı herif Kral'ın adaletiyle yüzleşecek."

 agot_filler_stormlands.0437.t:0 "İki Şövalyenin Hikâyesi: Sokak Adaleti"

 agot_filler_stormlands.0437.desc:0 "Bir grup muhafızın çit şövalyesini önüne getiriyor; görünüşe göre isteklerinin aksine Dornelu şövalyeyi kendisi aramış. İkisi yerel bir genelevde ölümüne dövüşmüş.\n\nMuhafazarların, Dorneluyu öldürdükten sonra vardı. Emrine karşı geldiği için üzgün olduğunu ama yaverinin ölümünün intikamını alması gerektiğini söylüyor."

 agot_filler_stormlands.0437.a:0 "Böyle şeyler olur, adamı serbest bırakın."

 agot_filler_stormlands.0437.b:0 "Diğer tüm katillerle aynı adaletle yüzleşecek."

 agot_filler_stormlands.0438.t:0 "İki Şövalyenin Hikâyesi: Kerhanede Kör"

 agot_filler_stormlands.0438.desc:0 "Çit şövalyesine yardım etmeye karar verdikten sonra, sen ve adamların aramaya başlıyorsunuz. Dornelu şövalyeyi bir genelevde, şarap ve kadınlara kendini kaptırmış halde buluyorsunuz; kaçan bir adama hiç benzemiyor.\n\nSuçlamaları ona bildirdiğinde şok oluyor, masumiyetini dile getiriyor. Turnuvadan atından düşürüldükten sonra ayrıldığını ve çit şövalyesinin yaveriyle hiç tanışmadığını söylüyor. Ancak ilginç bir şekilde, Çit Adamı'nın tarifine uyan bir adamı atından düşürdüğünü hatırlıyor."

 agot_filler_stormlands.0438.a:0 "Yani masumiyetini mi savunuyorsun?"

 agot_filler_stormlands.0438.b:0 "Muhafızlar! Bu haydudu zincire vurun."

 agot_filler_stormlands.0439.t:0 "İki Şövalyenin Hikâyesi: Kerhanede Kör"

 agot_filler_stormlands.0439.desc:0 "Dornelunun masumiyet iddiası hakkında daha fazla bilgi edinmeye çalışırken, çit şövalyesi öne atılıyor, kılıcı çekili halde, ona saldırıyor. Dorneluyu yaverinin ölümü ve turnuvayı kaybettirmesi için lanetliyor; suçlanan adam kendi silahını çekip her iddiaya sürekli masumiyet yalvarışlarıyla karşılık veriyor."

 agot_filler_stormlands.0439.a:0 "Görünüşe göre bu bir dövüşle yargılama."

 agot_filler_stormlands.0439.b:0 "Muhafızlar! İkisini de tutuklayın."

 agot_filler_stormlands.0439.c:0 "Yeter! Gerçeği kendim öğreneceğim..."

 agot_filler_stormlands.0440.t:0 "İki Şövalyenin Hikâyesi: Sonunda Gerçek"

 agot_filler_stormlands.0440.desc:0 "Saatlerce zindanlarda iki şövalyeyle uğraştın. İkisi de dayanıklılıklarıyla seni etkilemişti ama sonunda, tüm insanlar gibi onlar da çatladı ve sana itiraf ettiler. Dornelu şövalye, atından düşürüldükten sonra turnuvanın ödülünü gerçekten çalmış ve kaçmıştı; ancak yaverin ölümünden sorumlu olan o değildi. Bu suç, atından düşürülmenin öfkesiyle zavallı yaveri ölümüne dövmüş olan çit şövalyesinin üzerindeydi.\n\nİkisi de itiraflarından uzun süre sağ kalamadı. Galibin kesesinden kalanları, sıkı çalışmanın karşılığı olarak kendine saklamaya karar verdin."

 agot_filler_stormlands.0440.a:0 "Karanlık işler için en iyisi karanlık tiyatrolardır."

 agot_filler_stormlands.0441.t:0 "İki Şövalyenin Hikâyesi: Dornelu"

 agot_filler_stormlands.0441.desc:0 "İki şövalye birbirine şiddetle çarpıştı. Çit Adamı, Dorneluya ağır bir darbe indirmeye çalıştı ama karşı saldırıya kendini açtı. Dornelu şövalye hevesle fırsatı değerlendirdi ve kılıcını rakibinin savunmasındaki çatlağa sapladı.\n\nArdından, muhafızlarımın etrafını sardığını görünce silahını hızla bıraktı ve bir kez daha masumiyetini dile getirdi."

 agot_filler_stormlands.0441.a:0 "Topraklarımı terk et ve asla geri dönme."

 agot_filler_stormlands.0441.b:0 "Muhafızlar, bu katili tutuklayın!"

 agot_filler_stormlands.0442.t:0 "İki Şövalyenin Hikâyesi: Çit Adamı"

 agot_filler_stormlands.0442.desc:0 "İki şövalye birbirine şiddetle çarpıştı. Dornelu, Çit Adamına ağır bir darbe indirmeye çalıştı ama karşı saldırıya kendini açtı. Çit şövalyesi hevesle fırsatı değerlendirdi ve kılıcını rakibinin savunmasındaki çatlağa sapladı.\n\nArdından, muhafızlarımın etrafını sardığını görünce silahını hızla bıraktı ve yaverinin intikamı için adamı öldürmekten başka seçeneği kalmadığı konusunda bana yalvardı."

 agot_filler_stormlands.0442.a:0 "Topraklarımı terk et ve asla geri dönme."

 agot_filler_stormlands.0442.b:0 "Muhafızlar, bu yasa uygulayıcıyı tutuklayın!"

 agot_filler_stormlands.0443.t:0 "Değirmende Cehennem"

 agot_filler_stormlands.0443.desc:0 "[marshal.GetCouncilTitle] [marshal.GetTitledFirstName], odama geldi; sakin düşüncelere dalmışken izinsizce, kabaca içeri dalarak. "Kaleye bir mil mesafedeki bir yerleşimin köy değirmenine yıldırım düştü, [ROOT.Char.GetLadyLord|U]. Emriniz nedir?" diyor [marshal.GetSheHe|l], panik halinde, cevabımı bekleyerek dikilirken."

 agot_filler_stormlands.0443.a:0 "Öylece durma! Adamlarını ve biraz kova topla, budala!"

 agot_filler_stormlands.0443.b:0 "Bunu ben denetleyeceğim! Ahır görevlisine atımı eyerlet!"

 agot_filler_stormlands.0444.t:0 "Değirmende Cehennem"

 agot_filler_stormlands.0444.desc:0 "Varıp atlarımızdan indiğimizde değirmen çoktan alevler içindeydi; birkaç köylü etrafa toplanmış, üzerine su kovaları boşaltıyordu ama alevlere pek etki edemiyorlardı."

 agot_filler_stormlands.0444.a:0 "Hem adamlarımın hem de köylülerin yangınla mücadele çabalarını düzenliyorum."

 agot_filler_stormlands.0444.b:0 "Adamlarıma kovaları kapıp işe koyulmalarını emrediyorum."

 agot_filler_stormlands.0444.c:0 "Dizlerimin üzerine çöküp dua ediyorum."

 agot_filler_stormlands.0445.t:0 "Değirmende Cehennem"

 agot_filler_stormlands.0445.desc:0 "Adamlarımın yardımıyla bile, başlatılan şeyi durdurmak için hiçbir şey yapılamadı. Dakikalar içinde değirmen, o kadar parlak yanan ki Sur'un tepesinden görülebileceğine şaşırmayacağım devasa bir meşaleden başka bir şey değildi. Değirmenci ve birkaç köylü, kaybetme noktasını geçtikten sonra da yangınla savaşmaya devam etti ama ben adamlarıma kovalarını bırakmalarını emrettim."

 agot_filler_stormlands.0445.a:0 "Görünüşe göre kasaları açmam gerekecek."

 agot_filler_stormlands.0445.b:0 "Kalemden buraya biraz inşaatçı göndertirim."

 agot_filler_stormlands.0446.t:0 "Değirmende Cehennem"

 agot_filler_stormlands.0446.desc:0 "Neyse ki, tam zamanında varmışız; adamlarımın yardımı ve benim denetimimle yangını hızla söndürmeyi başardık. Değirmenin bazı onarımlara ihtiyacı olacak; Tanrılara şükür, binanın kendisi kurtarıldı."

 agot_filler_stormlands.0446.a:0 "İyi iş, yiğitler!"

 agot_filler_stormlands.0447.t:0 "Değirmende Cehennem"

 agot_filler_stormlands.0447.desc:0 "İçten dualarıma ve adamlarımın elinden gelenin en iyisine rağmen, Tanrılar değirmenin kül olmasına izin vermeyi uygun gördü; yangın dakikalar içinde tüm binayı sardı. Dizlerimin üzerinden, yenilmiş halde kalktım; çatı içeri çökerken adamlarım ve köylüler kovalarını bıraktı. Tanrılar neden bunun olmasına izin verdi?"

 agot_filler_stormlands.0447.a:0 "Tanrılar kararsızdır ve gizemli yollarla işler..."

 agot_filler_stormlands.0447.b:0 "Tanrıların umurunda bile olmadığını düşünmeye başlıyorum..."

 agot_filler_stormlands.0448.t:0 "Değirmende Cehennem"

 agot_filler_stormlands.0448.desc:0 "Tanrılar iyiydi! Üstteki fırtına daha da şiddetlendi, yağmur eskisinden daha sert ve daha yoğun yağdı. Ayağa kalkarken, belki de ilk kez, dualarımın gerçekten yanıtlandığını hissetmekten ağlamamak zordu. Sağanak yağış ve adamlarım ile köylülerin dindar çabaları sayesinde yangın kısa sürede durduruldu. Umarım tahıl değirmenden daha nice yıllar geçer!"

 agot_filler_stormlands.0448.a:0 "Tanrılara şükür!"

 agot_filler_stormlands.0449.t:0 "Fırtına Toprakları: Kütüphane"

 agot_filler_stormlands.0449.desc:0 "Huzursuz bir gece, kendimi kütüphanede, rafları ararken buldum. Son zamanlarda yönetmenin stresi üzerimde ağır bir yük olmuştu. Bir kitabın zihnime hoş bir oyalanma sağlayacağını ummuştum."

 agot_filler_stormlands.0449.a:0 "Belki bu kitap."

 agot_filler_stormlands.0450.t:0 "Kütüphane: Genç Kızlara Bir Uyarı"

 agot_filler_stormlands.0450.desc:0 "Bir kitap, sanki biri onu saklamak istemiş gibi birkaç kitabın arkasına sıkıştırılmıştı. Kitap, Leydi Coryanne Wylde'ın bir metres, ordu kampı süprüntüsü ve Lys'teki bir zevk evinin hanımı olarak yaşamının anlatısıydı. Metin ahlaksızdı ama ona eşlik eden resimler daha da ahlaksızdı!"

 agot_filler_stormlands.0450.a:0 "*Etrafa göz atıp okumaya devam et*"

 agot_filler_stormlands.0450.b:0 "Bu kitap yakılmalı!"

 agot_filler_stormlands.0451.t:0 "Kütüphane: Geyiğin Akrabası"

 agot_filler_stormlands.0451.desc:0 "Gözlerim #bold Geyiğin Akrabası#! kitabına takıldı; yazarı Üstat Hubert. Kitap ilginçti; Üstat Hubert, efsanevi figür Morne'lu Galladon'un Kahramanlar Çağı'nda değil, daha yakın zamanlarda yaşadığını öne sürüyor. Morne'daki, Andal yapılarına benzediğini ve İlk İnsanların yapılarına benzemediğini söylediği harabelere işaret ediyor."

 agot_filler_stormlands.0451.a:0 "İlginç bir sav, Üstat Hubert."

 agot_filler_stormlands.0452.t:0 "Kütüphane: Zaferler ve Yenilgiler"

 agot_filler_stormlands.0452.desc:0 "Başüstat Vyron'un #bold Zaferler ve Yenilgiler#! adlı eseri gözüme çarptı. Başüstat, eserinde Durran Tanrıkeder'in inşa ettiği yedinci kale olan Fırtına Ucu'nun bir Andal bağlantısı gösterdiğini belirtiyor. Hatta Fırtına Ucu'nun Andalların gelişinden sonra inşa edildiğini öne sürüyor!"

 agot_filler_stormlands.0452.a:0 "O zaman İnşacı Brandon uzun yaşamış olmalı!"

 agot_filler_stormlands.0453.t:0 "Kütüphane: Okuma Mücadeleleri"

 agot_filler_stormlands.0453.desc:0 "Birkaç kitabı deniyorum ama çoğuna çabucak ilgimi kaybediyorum — hatta bazılarını kafa karıştırıcı bir dağınıklık buluyorum! Bu üstatlar kimsenin böyle saçmalıkların üstesinden gelmesini nasıl bekliyor!"

 agot_filler_stormlands.0453.a:0 "Bu gece boşa geçti!"
