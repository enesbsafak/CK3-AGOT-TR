l_english:

 agot_filler_north.0001.t:0 "Bir Yabanıl Karşılaşması"

 agot_filler_north.0001.desc:0 "Sarayda bakır para sayıp halkımın sığır gibi homurtularını çekerek geçen bir sıkıcı gün daha. [ROOT.Char.GetCurrentLocation.GetName]'deki boğucu salonlardan bıktım. Üstadım, biraz temiz havanın körelmiş zekâmı canlandırmaya yardımcı olabileceğini önerdi. Ve böylece, bu sabah atımı doğada kısa bir gezinti için hazırlıyorum. Bir saat bile geçmeden kendimi daha iyi hissediyorum. Ormanın temiz havası ruhuma iyi geliyor. Sessizliğin üzerime çökmesine izin vererek daha derinlere dalıyorum.\n\nSonra, onu duyuyorum — ileride, çizmelerin altında ezilen yaprakların yüksek çıtırtısı. Donup kalıyorum; yakındaki ağaçların arasında dağınık bir [agot_filler_wildling.GetWomanMan] görüyorum. İlerlemeye devam ediyorum, görünmeyen bir eşlikçinin işaretlerine karşı duyularım keskinleşmiş halde. [agot_filler_wildling.GetWomanMan] yamalı, kirli, eski giysiler içinde ve paslanmış demirle silahlı. Tanrılar aşkına, bu [agot_filler_wildling.GetWomanMan] bir yabanıl! Belimdeki çeliğe ihtiyatlı bir elimi koyuyorum. [agot_filler_wildling.GetSheHe|U] yalnız görünüyor. Ne yapmalıyım?"

 agot_filler_north.0001.a:0 "Öl, seni vahşi!"

 agot_filler_north.0001.a.tt:0 "Yabanıllarla ya sen öldürürsün ya da öldürülürsün."

 agot_filler_north.0001.b:0 "Bir hizmetkâr daha işime yarar..."

 agot_filler_north.0001.b.tt:0 "Adama ahırlarında çalışma fırsatı sunuyorsun."

 agot_filler_north.0001.c:0 "Kendimi çalılıkların arasına gizleyeceğim, beni asla göremezler!"

 agot_filler_north.0001.c.tt:0 "Bazıları sana korkak diyebilir, ama en azından hâlâ nefes alan bir korkaksın!"

 agot_filler_north.0002.t:0 "$agot_filler_north.0001.t$"

 agot_filler_north.0002.desc:0 "Yaklaştığımda yabanıl dikleşiyor, [agot_filler_wildling.GetHerHis] paslı demirini kınından çekerek. "Dur orada! Sen kimsin? Burada ne işin var?" [agot_filler_wildling.GetSheHe|U] bana doğru bağırıyor.\n\nTehdit olmadığımı göstermek için ellerimi kaldırıyorum. Daha yakından bakınca [agot_filler_wildling.GetWomanMan] sarsılmış ve açlıktan bitkin görünüyor. "Sana zarar vermek istemiyorum, iyi [agot_filler_wildling.GetWomanMan]. Ben [ROOT.Char.GetFullName]. Açlıktan bitkin ve yapayalnız olduğunu görüyorum. Belki de kaleme kadar bana katılmak istersin? Kış geliyor ve sarayımda daha fazla sadık hizmetkâra ihtiyacım var. Ama önce, adını öğreneyim."\n\n[agot_filler_wildling.GetWomanMan] beni şüpheyle süzüyor. Uzun bir an geçiyor ve kendimi ifşa etmekle doğru bir seçim yapıp yapmadığımı merak ediyorum. Sonunda [agot_filler_wildling.GetWomanMan], bitkinlikten güçsüz düşmüş halde [agot_filler_wildling.GetHerHis] dizlerinin üzerine çöküyor. "B-b-benim adım [agot_filler_wildling.GetFullName], m'[ROOT.Char.GetLadyLord]. Gecelerdir uyumuyor, daha fazla gecedir yemek yemiyorum."\n\n"Öyleyse diz çök ve ayağa kalk [agot_filler_wildling.GetFullNameNoTooltip], bir Kuzeyli [agot_filler_wildling.GetWomanMan] olarak.""

 agot_filler_north.0002.a:0 "Bu günden günlerinin sonuna dek."

 agot_filler_north.0003.t:0 "Bir Siyah Kardeş Firar Ediyor"

 agot_filler_north.0003.desc:0 "Gece Nöbetçileri kutsal bir yemin eder: görevlerinde yaşayıp görevlerinde ölmek. Uzun Gece'nin sona ermesinden beri binlerce yıldır böyledir. Yine de firar, Nöbet adamları arasında giderek yaygınlaşan bir suç gibi görünüyor.\n\nDoğrudur ki kara kardeşlerin safları artık çoğu zaman pek de hayırlı karakterlerden oluşmuyor. Sakat bırakılma, hadım edilme ya da darağacı yerine soğuk bir kölelik hayatını seçen hırsızlar, ırkçılar, katiller ve hainler. Yine de birçoğu Sur'daki zorlu hayattan çabucak yoruluyor. İliklere işleyen soğuk, yalnızlık ve sade yemek zor yoldaşlardır. Gecenin içinde, ettikleri her yemini hiçe sayarak tüyüyor ve en ufak bir özgürlük ihtimali için kaçıyorlar.\n\nİşte adamlarımdan birinin yakaladığı söylenen serseri de tam böyle biri. Bir firari, onu yakalayan [ROOT.Char.GetLadyLord]'in elinde adaletini bulmalı. Ve böylece, şimdi [ROOT.Char.GetTopLiege.GetTitleAsNamePossessiveNoTooltip|U] adaletini dağıtmak bana düşüyor..."

 agot_filler_north.0003.a:0 "Alçak herifi içeri getirin."

 agot_filler_north.0004.t:0 "$agot_filler_north.0003.t$"

 agot_filler_north.0004.desc:0 "Firari, [agot_filler_black_brother_deserter.GetFirstName] adında bir adam, önüme çıkarılıyor. Sızlanıp beni dinlemem için yalvarıyor. Onu savunmasını söyleyince Sur'un kuzeyinde gördüğü dehşetleri anlatıyor. Donmuş bozkırda anlatılmaz kötülükler. Mezarlarından doğan ölü adamlar. Derisi kar kadar soluk, çürümüş mavi gözlü canavarlara binen ve sıcak yerine soğukla tıslayan çelikler kuşanan iblisler.\n\n"Grumkinler ve snarklar..." diye mırıldanıyor adamlarımdan biri alçak sesle.\n\nGözcü açıkça aklını kaçırmış. Yine de anlattıkları samimi ve ayrıntılarla dolu görünüyor. Bu firari doğruyu mu söylüyor olabilir?"

 agot_filler_north.0004.a:0 "[ROOT.Char.GetTopLiege.GetTitleAsNamePossessiveNoTooltip|U] adaletini alacak."

 agot_filler_north.0004.b:0 "Açıkça çok şey görmüş."

 agot_filler_north.0004.b.tt:0 "Belki de görevine geri dönmeli..."

 agot_filler_north.0005.t:0 "Bir Siyah Kardeş Adaletini Alıyor"

 agot_filler_north.0005.desc:0 "Kuzey'de denir ki: Hükmü veren [ROOT.Char.GetWomanMan] kılıcı da savurmalıdır. Bin yıldır böyledir. Bin yıl daha böyle olacak.\n\nSon anını bekleyen [agot_filler_black_brother_deserter.GetFirstNamePossessive] gözlerinin içine bakıyorum. Utançla — ya da belki korkuyla — başını eğiyor. "Tanrılarınla barış," diyorum, kılıcımı hazırlarken."

 agot_filler_north.0005.a:0 "Bu korkağın kanıyla kendi kılıcımı neden kirleteyim?"

 agot_filler_north.0005.b:0 "Kılıcı ben savuracağım."

 agot_filler_north.0005.b.tt:0 "Onu idam ediyorsun"

 agot_filler_north.0006.t:0 "Bir Firari Sur'a Dönüyor"

 agot_filler_north.0006.desc:0 "[agot_filler_black_brother_deserter.GetFirstName], donmuş bozkırda anlatılmaz dehşetler gördüğünü iddia ederek Kara Kale'den kaçtığında, ondan kurtulduğumu sanmıştım.\n\nŞimdi, karşımda duran sadece adaleti — hızlı bir ölümü — hak eden bir firari görüyorum."

 agot_filler_north.0006.a:0 "Kardeşim, görevinde yaşar ve görevinde ölürsün."

 agot_filler_north.0020.t:0 "Satılık Ulukurt Pelerinleri!"

 agot_filler_north.0020.desc:0 "Kuzey'de parlak ve ılık bir gün ender bir olaydır. Böyle günlerde halkımın arasında yürümek için sık sık zaman ayırırım. Bugün yerel pazarda uygun fiyatlı şeyler aramayı seçtim. Çoğu zaman Qarth'tan ya da Yaz Adaları'ndan bile gelen nadide şaraplar ve egzotik giysiler bulunabilir. Uzun yönetim saatlerimi tatlandıran nadir bir zevk. Pazarın arasında yürüyüp teşhirdeki çeşitli malları inceliyorum.\n\n"Ulukurt pelerinleri! Satılık ulukurt pelerinleri," diye bağırıyor bir tüccar. Dönüp bakıyorum; tüccarın arkasına üç büyük, tüylü pelerin asılmış. Bakışlarımı yakalayıp pelerinleri incelemeye davet ediyor..."

 agot_filler_north.0020.a:0 "Pelerinleri incele."

 agot_filler_north.0020.b:0 "Ulukurt mu? Onların nesli tükendi! Kendini izah et, tüccar."

 agot_filler_north.0020.c:0 "Pelerine ihtiyacım yok."

 agot_filler_north.0020.a_tt:0 "Pelerinlere daha yakından bakıyorsun."

 agot_filler_north.0021.t:0 "Yakından Bakınca"

 agot_filler_north.0021.desc:0 "Büyük beyaz bir pelerini indiriyorum. Palto elimde, işçiliğin dikkat çekici olduğunu anlıyorum; dikişler bile usta işi! Gözlerimi kapatıp yüzüme bastırarak pelerini kokluyorum; kar ve çam kokuyor. Gözlerimi açıp kendi paltomu çıkarıyor ve denerken onu tüccarın kollarına itiyorum. Palto ferahlatıcı derecede sıcak. Kurt kürkü paltomdan belirgin bir farkı olduğunu anlayabiliyorum.\n\nTüccar boğazını temizleyip ödeme yapmak ya da pelerini geri vermek hakkında küstahça bir şeyler mırıldanıyor..."

 agot_filler_north.0021.a:0 "Bunu satın almalıyım!"

 agot_filler_north.0021.b:0 "Gerçek gibi görünüyor ama ihtiyacım yok..."

 agot_filler_north.0021.c:0 "Ben bir soyluyum, bunun için ödeme yapmam gerekmez!"

 agot_filler_north.0022.t:0 "Yakından Bakınca"

 agot_filler_north.0022.desc:0 "Büyük beyaz bir pelerini indiriyorum. Palto elimde, işçiliğin olağanüstü olmadığını fark etmek beni şaşırtmıyor. Gözlerimi kapatıp yüzüme bastırarak pelerini kokluyorum; bayat et ve ıslak köpek kokuyor. Öğğ. Tüccar denemem için yalvarıyor. Geçiriyorum ve soğuk rüzgârın içinden geçtiğini hissediyorum.\n\nTüccar boğazını temizleyip ödeme yapmak ya da pelerini geri vermek hakkında küstahça bir şeyler mırıldanıyor..."

 agot_filler_north.0022.a:0 "Bu yüzden seni tutuklatmalıyım..."

 agot_filler_north.0023.t:0 "'Ulukurt' Pelerinleri, Ha?"

 agot_filler_north.0023.desc:0 ""Ulukurt mu? Nesli mi tükendi? Hayır, hayır, hayır," diye itiraz ediyor tüccar. "Sur'un güneyinde, evet. Ama bu pelerinler Sur'un ötesinde yabanılların avladığı ulukurtlardan yapıldı! Bu taze malları Sur'un güneyine, sizin gibi alıcılar için getirmek için büyük zahmetlere katlandım m'[ROOT.Char.GetLadyLord]. Hadi, inceleyin! Kendiniz görün.""

 agot_filler_north.0023.a:0 "Pelerinleri incele."

 agot_filler_north.0023.b:0 "Gerçekten umurumda değil."

 agot_filler_north.0030.t:0 "Yaz Karları!"

 agot_filler_north.0030.desc:0 "BRRRR! Dışarıda oynuyordum ki birdenbire, hiç yoktan bir kar yağışı başladı! Üstatlar bu yaz karlarının çok fazla oyalanırsam tehlikeli olabileceğini söylüyor ama ben zaten çok eğleniyorum... "

 agot_filler_north.0030.a:0 "Üstatları dinlemeliyim. Kaleye en son dönen yabanıldır!"

 agot_filler_north.0030.b:0 "Ben bir KUZEYLİYİM! Bu yaz karı. Hiçbir şey ifade etmez."

 agot_filler_north.0030.c:0 "Ama ev #italic o kadar#! uzak..."

 agot_filler_north.0031.t:0 "Kış Erken Geldi"

 agot_filler_north.0031.desc:0 ""Efendim, efendim," diyor karşımda duran suratsız çiftçi, "Bu yaz kar fırtınaları ekinlerimi mahvetti! Hele hasat da yaklaşırken, bir daha asla toparlanamam. Bu sezon aileme bakamazsam ne yapacağımı bilmiyorum, özellikle de kış yaklaşırken... Yapabileceğiniz bir şey olmalı!"\n\nÇiftçi, çiftliği için benden yardım istemeye cesaret ediyor... ama bu yaz kar fırtınaları #italic gerçekten de#! ülkedeki çiftliklere zarar veriyor... "

 agot_filler_north.0031.a:0 "Yalnızca yok olan ekinlerin karşılığını ödeyeceğim."

 agot_filler_north.0031.b:0 "Bu, Eski Tanrılar'ın günahların için verdiği cezaydı."

 agot_filler_north.0031.c:0 "Sen bir KUZEYLİSİN! Yaz kar fırtınalarının tehlikesini bilmelisin."

 agot_filler_north.0032.t:0 "İlk İnsanların Rünleri"

 agot_filler_north.0032.desc:0 "Bölgedeki bir inşaat projesi büyüleyici bir keşfe imza attı. Görünüşe göre yerel bir yapı ustası, İlk İnsanların rünleriyle oyulmuş bir taş yığınını gün yüzüne çıkarmış. Usta, taşları çok adil bir fiyat diye tanımladığı bir bedel karşılığında bana satmayı teklif ediyor.\n\nÜstatlar bize, İlk İnsanların Westeros'a ilk geldiklerinde rünlerini taşlara ve başka nesnelere oyduklarını öğretti. Bazıları bu oymaların büyülü özellikler taşıdığını bile söylüyor. Bu taşlar çok değerli olabilir ve Kuzey'deki itibarımı kesinlikle artırır..."

 agot_filler_north.0032.a:0 "Taşları satın alması için bir ulak gönder."

 agot_filler_north.0032.b:0 "Böyle şeylere ihtiyacım yok."

 agot_filler_north.0032.c:0 "İlk İnsanların mirası #italic benim#! mirasım. Taşları al."

 agot_filler_north.0032.d:0 "İlk İnsanların mirası #italic benim#! mirasım. Taşları al."

 agot_filler_north.0033.t:0 "Ormanda Bir Gezinti"

 agot_filler_north.0033.desc:0 "Topraklarımın daha ıssız bölgelerinde yolculuk etmek çok ödüllendirici olabiliyor. Ormanlarda, tepelerde ya da sadece bir tarlada uzun yürüyüşler yapmanın, bir soylu olmanın stresini derinden hafiflettiğini görüyorum.\n\nBugün küçük, unutulmuş bir ormanda dolaşıyorum. Ağaçlar çok yaşlı; kalın gövdeleri daha önce hiç görmediğim şekillerde kesişiyor ve iç içe geçiyor. Ormanın derinliklerine doğru ilerlerken güzel, beyaz ve kırmızı bir ağaç seçiyorum — bir weirwood! Bu kadim ağaçlar Kuzey'de hâlâ hayatta ama böyle derin bir yabanıllıkta bir tanesini görmek... insanı mütevazılaştırıyor. Gövdeye yürüyüp Ormanın Çocuklarının binlerce yıl önce oyduğu ağlayan yüze bakıyorum. Tuhaf güzelliğini içime çekiyor ve dönüp giderken kendimi rahatlamış hissetmekten alamıyorum."

 agot_filler_north.0033.a:0 "Ne güzel bir ağaç."

 agot_filler_north.0033.b:0 "Böyle kutsal bir ağacın burada güvende kalmasına sevindim."

 agot_filler_north.0033.c:0 "Geri dönüp Eski Tanrılar'a bir dua etmeliyim..."

 agot_filler_north.0034.t:0 "Kurt Saldırıları Yün Hayvanlarını Tehdit Ediyor"

 agot_filler_north.0034.desc:0 "Çalışma odamda bir kez daha uzun bir gece. Güneş battı, ay gökyüzünde yükseldi. Ay bu kadar parlak parlarken mumuma neredeyse hiç ihtiyacım yok. Saatlerce raporları gözden geçirir, hesapları okur ve belgeleri damgalarken, hem kahyamın hem de mareşalimin imzaladığı yeni bir rapora rastlıyorum.\n\nRapor, topraklarımdaki kırkıcıların giderek artan sayıda ölen ya da yaralanan yün hayvanı bulduğunu belirtiyor — kahyamın raporda belirttiği gibi, yün üreten hayvanlar. Keçilere, koyunlara ve hatta yün köpeklerine geceleri, çoğu kişinin kocaman, kudurmuş kurt sürüleri olduğunu söylediği şeyler vahşice saldırıyor. Bu saldırılar aynı sıklıkta sürerse yün ticareti ciddi zarar görebilir.\n\nBu soruna bir çözüm bulmak birden akıllıca görünüyor; yarın sabah konseyime bir çözüm önerisi sunmak güzel olur."

 agot_filler_north.0034.a:0 "Kurtlar için ödül koy ve öldürülen her kurt başına her avcıya altın öde."

 agot_filler_north.0034.b:0 "Yün hayvanlarına iyi bakmadıkları için kırkıcılara ceza kes."

 agot_filler_north.0034.c:0 "En çok etkilenen kırkıcılara tazminat öde."

 agot_filler_north.0035.t:0 "Yürek Ağacına Bakmak"

 agot_filler_north.0035.desc:0 "Bahçe ekibim yakın zamanda kalemdeki Tanrı Ormanı üzerinde çalışıyor. Çiçek tarhlarını malçladılar, yeni çiçekler diktiler, çitleri budadılar ve genel olarak Tanrı Ormanı'nı küçük bir koruyu andırır hale getirdiler.\n\nAma bahçe ekibi bana, tüm Tanrı Ormanı'na gururla tepeden bakan weirwood yürek ağacını güzelleştirme talebiyle geldi. Bahçıvanlar yalnızca güzelleştireceklerini, dalları ve kökleri budayacaklarını söylüyor ama ben ona gelebilecek her türlü zarara karşı temkinliyim. Nihayetinde hangi Kuzeyli yürek ağacının harap olmasına izin verir?"

 agot_filler_north.0035.a:0 "Onu yalnızca en deneyimli bahçıvanlar halletsin."

 agot_filler_north.0035.b:0 "Ne ters gidebilir ki?"

 agot_filler_north.0035.c:0 "Riske girmek istemiyorum... Yürek ağacı fazla kutsal."

 agot_filler_north.0035.d:0 "Hayır, kendim yapacağım!"

 agot_filler_north.0036.t:0 "Buz Patencileri!"

 agot_filler_north.0036.desc:0 "Bugün serin ama bunun dışında güzel bir gün. Kalem yakınındaki bazı küçük yerleşimlerde dolaşmak, doğayı içime çekmek ve güzel günün keyfini çıkarmak için kendime birkaç saat ayırdım.\n\nYürürken donmuş bir gölete rastlıyorum ve bazı küçük halkın buzun üzerinde hayranlık uyandıran şekilde kaydığını görüyorum! Hareketleri her yere saçılmış; çoğu buzun üzerine düşüyor ama bazıları zarifçe süzülüyor. Ah, ne güzel bir manzara!"

 agot_filler_north.0036.a:0 "Sanırım buraya oturup bir süre onları izleyeceğim."

 agot_filler_north.0036.b:0 "Sanırım onlara katılacağım!"

 agot_filler_north.0036.c:0 "Hayır, hayır. Güvenli değil, onları durdurmalıyım!"

 agot_filler_north.0037.t:0 "Kuzey'de Paten"

 agot_filler_north.0037.desc:0 "Kuzeylilerin, koyun ve at kemiklerinden yapılmış patenlerle uçsuz bucaksız buzlu çorakları aşıp kaymasını anlatan akademik kayıtlar ilgimi çekti. Görünüşe göre bu, Kuzey'in bazı bölgelerinin kışın ticaret yapmak ve diğer köylere ulaşmak için güvendiği kadim bir seyahat yöntemi. Hatta belirli bir kayıt, bunun İlk İnsanlar Kuzey'e yerleştiğinden beri yapıldığını iddia ediyor!"

 agot_filler_north.0037.a:0 "Kış gerçekten de bizi yenilik yapmaya zorluyor."

 agot_filler_north.0037.b:0 "Büyüleyici; ama ben eski güzel kızağıma sadık kalacağım."

 agot_filler_north.0037.c:0 "Kuzey seferlerinde ordularımıza yardımcı olması için bunu benimseyebilir miyiz?"

 agot_filler_north.0038.t:0 "Skagos'ta Tekboynuzlar"

 agot_filler_north.0038.desc:0 "Hem mitolojiye hem de üstatlara göre, Skagos adasında anakarada artık nesli tükenmiş benzersiz ve akıl karıştıran bir canavar yaşıyor. Dünyanın bu bölgesinde atın yerini almış, tüylü ve güçlü bir canavar. Başında, bilinen dünyadaki tüccarların çok değer verdiği tek uzun bir boynuz var. Skagoslular çatışma gerektirdiğinde bu canavarla savaşa gidiyor ve Skagoslu ile canavar birlikte, öldürdükleri düşmanlarının etiyle ziyafet çekiyor.\n\nBu canavar, #bold tekboynuzdan#! başkası değil. Ulukurtlar gibi canavarlara bile kafa tutabilecek azgın bir yaratık olan tekboynuz, kışkırtılacak bir canavar değildir. Skagosluların onları evcilleştirmesinin nedeni de budur."

 agot_filler_north.0038.a:0 "Skagos heyecan verici bir yer gibi görünüyor; bir gün ziyaret etmek isterim."

 agot_filler_north.0038.b:0 "Sanırım sıradan, anakaralı atlarıma sadık kalacağım."

 agot_filler_north.0038.c:0 "Ne büyüleyici bir hikâye."

 agot_filler_north.0038.d:0 "Açıkça abartılmış bir hikâye."

 agot_filler_north.0039.t:0 "Buz Balıkçılığı"

 agot_filler_north.0039.desc:0 "Topraklarımda yürürken bazı donmuş göletlere rastlıyorum. Hava daha ılıkken bunlar genelde balık tutmak için harika yerlerdir. Ama görünen o ki soğuk iklim bile bazı küçük halkı buz balıkçılığında şanslarını denemekten alıkoymamış. Kalın buzun altındaki suya ulaşmak için delikler açmışlar gibi görünüyor...\n\nYaklaşıp avlarına ve ekipmanlarına bakıyorum. Beni hemen fark edip göletlerin ne kadar balık dolu olduğu ve balıkçılığın ne kadar iyi olduğu hakkında hemen sohbet başlatıyorlar. Bir adam, daha önce hiç balık tutmamış küçük oğluyla buraya geldiğini bile söylüyor!"

 agot_filler_north.0039.a:0 "Şimdiye kadar ne yakaladınız?"

 agot_filler_north.0039.b:0 "Size katılabilir miyim?"

 agot_filler_north.0039.c:0 "Topraklarımda, benim göletlerimde balık tutma hakkın yok!"

 agot_filler_north.0040.t:0 "Kuzeyin Efsaneleri"

 agot_filler_north.0040.desc:0 "Kamp ateşi canlı bir şekilde çıtırdıyor, diğerlerinin yanına oturuyorum. Saraydan, yönetmekten — ve hayatın küçük sorunlarından — tamamen uzakta, ormanda bir hafta geçirmek benim konumumdakilerin çoğunun ancak hayal edebileceği bir şey. Ama Kuzey'de bu bizim geleneğimiz. Mirasımız.\n\nAy tepemizde yükselmiş; ev sahibimiz, Beron adında bir adam, ateşten dehşet verici bir somurtkanlıkla başını kaldırıyor.\n\n"Dostlarım," diyor, ateş siyah gözlerinde dans ederken, "bu ormanlar hakkında bir efsane olduğunu söylerler. Korkunç ve eski bir efsane. Hepiniz biliyor musunuz?" Adamlar toplu halde hayır diye homurdanıp anlatması için onu dürtüyorlar.\n\n"Uzun zaman önce, avcılar ve toplayıcılar bu ormanlardan ejderhalarla doluymuş gibi kaçınırdı. Bu ormanların lordu şaşkına dönmüştü; avlayacak iyi avlar, toplayacak güzel böğürtlenler vardı. Bu yüzden, halkına neden zehir gibi geldiğini öğrenmek için ormanlara daldı."\n\n"Bu ormanlarda günler ve geceler boyunca herhangi bir iz aradı. Ama her döndüğü köşede eli boş çıktı. Ta ki bir gece, tıpkı bu gece gibi, ay gökyüzünde yükselmişken buz gibi ve uğursuz bir rüzgâr hissedene dek. Birdenbire, arkasından, onu öldürmeye gelmiş bir #italic Ak Gezen#!den başkasını görmedi-"\n\nBirdenbire, sen ve arkadaşların çalılıklardan bir hışırtı duyuyorsunuz... Biri çalılıklardan fırlayıp hepinize çılgınca bağırınca Beron soluğunu içine çekiyor! Adamın çığlıklarının üzerinden Beron'un çılgınca güldüğünü duyabiliyorsunuz!"

 agot_filler_north.0040.a:0 "AHHHHHH!"

 agot_filler_north.0040.b:0 "KAÇIN! DOSDOĞRU EVE!"

 agot_filler_north.0040.c:0 "AHAH, çok iyi şaka, Beron!"

 agot_filler_north.0041.t:0 "Buz Balıkçılığı"

 agot_filler_north.0041.desc:0 "Buz balıkçılığına gitmek için günü tatil ilan ettim! Yakındaki bazı göletler dondu ve kendi başıma, doğaya çıkmanın güzel bir stres atma olacağına karar verdim.\n\nOltamı suya atarken gıcırtı ve çatırtı sesleri duyuyorum... anında aydınlanıyorum... #bold altımdaki buz çatlıyor!#!\n\nOturduğum yerden fırlayıp sağlam zemine koşmaya çalışıyorum ama ayaklarımda buz gibi suyu hissediyorum ve birdenbire — #bold ŞLAP#! Dibe batıyorum!"

 agot_filler_north.0041.a:0 "İmdat, imdadıma yetişen var mı!"

 agot_filler_north.0041.b:0 "Yüz, yüz! Olabildiğince hızlı!"

 agot_filler_north.0041.drowning.toast.title:0 "Çığlığını kimse duyamaz."

 agot_filler_north.0041.drowning.toast.alternate.title:0 "Gizemli bir yabancı seni kurtarıyor."

 agot_filler_north.0043.t:0 "Köylü ve Ölü"

 agot_filler_north.0043.desc:0 "Sarayına, ellerinden bağlanmış alışılmadık derecede soluk bir kadını getiren bir adam giriyor. Avcıların, ölü bir avcının kanına bulanmış halde ormanda bulduğunu iddia ettiği kadına ölü diyor. Kadın kendini savunmaya çalışıyor; bir kurt tarafından saldırıya uğrayan yaralı avcıyı bulduğunda ot topladığını ve onu kurtarmaya çalıştığını söylüyor.\n\nAdam, yalvarışlarını görmezden gelmen konusunda seni uyarıyor — o bir ölü; Gece Kralı efsanesini ve onun oluşturabileceği tehlikeyi hatırla."

 agot_filler_north.0043.a:0 "Gece Kralı kimdi yine?"

 agot_filler_north.0043.b:0 "Diyar sana teşekkür ediyor!"

 agot_filler_north.0043.c:0 "Efsanelerin ölülerinin mavi gözleri vardır, seni budala!"

 agot_filler_north.0043.d:0 "Bu zavallı kız yeterince acı çekti!"

 agot_filler_north.0044.t:0 "Efsane: Gece Kralı"

 agot_filler_north.0044.desc:0 "Efsaneler, Gece Kralı'nın Gece Nöbetçileri'nin on üçüncü Yüce Kumandanı olduğunu söyler. Bazıları onun solgun bir kadın tarafından baştan çıkarıldığını — bir Ak Gezen ya da ölü olduğunu — ve kadının onu kendini Kral ilan etmesine ve Sur'u zalimlikle ve kara büyüyle yönetmesine yönlendirdiğini iddia eder. Gece Kralı'nın saltanatı nihayet, Kış Kralı ile Sur'un Ötesindeki Kral ortak dava güdüp onu iktidardan indirmek için bir savaş başlattığında sona erdi."

 agot_filler_north.0044.a:0 "Ah! Evet, Gece Kralı."

 agot_filler_north.0045.t:0 "Onun Kucaklayışı: Gece"

 agot_filler_north.0045.desc:0 "Huzursuz gecelerde bazen kale koridorlarında dolaşırım. Normalde bu kadar geç saatte birkaç muhafız dışında pek kimse dışarıda olmaz; ama bu gece koridorlarda dolaşan [palebride.GetFirstNameNoTooltip] ile karşılaşıyorum. Bana yaklaşıyor ve kanımı arzuyla kaynatan şeyler fısıldıyor. Bana sinsi bir gülümseme veriyor ve ben onu takip ediyorum; çok geçmeden ikimiz bir misafir odasının çarşaflarında birbirimize dolanıyoruz."

 agot_filler_north.0045.a:0 "Gözleri neredeyse mavi görünüyor..."

 agot_filler_north.0046.t:0 "Onun Kucaklayışı: Sabah"

 agot_filler_north.0046.desc:0 "Şafak sökünce [palebride.GetFirstNameNoTooltip] hiçbir yerde bulunamıyor. Muhafızlar kaleyi boşuna arıyor. O gece beni bir şekilde değiştirdi, hissediyorum. Güzelliğini hatırlamaya çalıştığımda, en soğuk buz gibi derin mavi gözlerinden başka bir şey göremiyorum; ama gözleri kırmızı değil miydi?\n\nBelki [thug.GetFirstNameNoTooltip] uyarısında haklıydı..."

 agot_filler_north.0046.a:0 "Acılık mı, yoksa başka bir şey mi..."

 agot_filler_north.0047.t:0 "Onun Kâbusu"

 agot_filler_north.0047.desc:0 "[palebride.GetFirstNameNoTooltip] idam edildiğinden beri son birkaç gecedir kâbus aynı. Geceleri kale içinde dolaşıyorum, soğuktan titreyerek. Kepenkleri kapatmak için açık bir pencereye yaklaştığımda onu görüyorum. Kar yağarken avluda duruyor, bana yukarıdan bakıyor. Rüyada gözleri mavi, kırmızı değil; doğal olmayan bir mavi..."

 agot_filler_north.0047.a:0 "Gözleri... mavi!"

 agot_filler_north.0048.t:0 "Bir Minnettarlık Gösterisi"

 agot_filler_north.0048.desc:0 "[palebride.GetFirstNameNoTooltip] bugün bana yaklaştı. Onu [thug.GetFirstNameNoTooltip]'den kurtardığım günden beri bana minnettar olduğunu söyledi. [palebride.GetFirstNameNoTooltip], onun için yaptığım her şeyi bir şekilde telafi etmeyi dilediğini söyledi."

 agot_filler_north.0048.a:0 "Bana şifa sanatlarını öğretebilir misin?"

 agot_filler_north.0048.b:0 "Bana nasıl bahçıvanlık yapılacağını öğretebilir misin?"

 agot_filler_north.0048.c:0 "Gerekeni yaptım."

 agot_filler_north.0049.t:0 "Bir Minnettarlık Gösterisi: Şifa"

 agot_filler_north.0049.desc:0 "[palebride.GetFirstNameNoTooltip] bana insan bedeni ve çeşitli hastalık tedavileri hakkında öğretirken haftalar geçti. Yavaş yavaş şifa sanatlarına dair bir anlayış kazanmaya başladım."

 agot_filler_north.0049.a:0 "Çok şey öğrendim, teşekkürler!"

 agot_filler_north.0050.t:0 "Bir Minnettarlık Gösterisi: Bahçıvanlık"

 agot_filler_north.0050.desc:0 "[palebride.GetFirstNameNoTooltip] ve ben bahçede özenle çalışıyoruz. [palebride.GetFirstNameNoTooltip] bana yalnızca nasıl bahçıvanlık yapılacağını göstermekle kalmıyor, aynı zamanda bitkilerin bazılarının çeşitli kullanımları hakkında da beni eğitiyor."

 agot_filler_north.0050.a:0 "Çok şey öğrendim, teşekkürler!"

 agot_filler_north.0052.t:0 "Günah Çıkaran"

 agot_filler_north.0052.desc:0 "[confessor.GetFirstNameNoTooltip] muhafızlarıma, evinde kalan bir yolcuyu öldürüp soyduğunu itiraf etti. Yolcu [confessor.GetFirstNameNoTooltip] ile ekmek ve tuz bölüşmüş, misafir hakkıyla korunuyordu.\n\n[confessor.GetFirstNameNoTooltip], cinayete kadar dindar olmadığını, sonrasında evinde kocaman beyaz bir sıçan görmeye başladığını itiraf ediyor. Şimdi tanrılarla barışmak ve suçlarının karşılığı olan adaleti almak istiyor."

 agot_filler_north.0052.a:0 "Beyaz bir sıçan mı?"

 agot_filler_north.0052.a.tt:0 "Belki efsaneyi hatırlarsın..."

 agot_filler_north.0052.b:0 "Kefaretin tek bir yolu var!"

 agot_filler_north.0052.b.tt:0 "Kanın karşılığı kan olmalı, kılıcı sallayacaksın... "

 agot_filler_north.0052.c:0 "Altını ver, her şey affedilsin."

 agot_filler_north.0052.c.tt:0 "Her şeyin bir bedeli var..."

 agot_filler_north.0052.d:0 "Muhafızlar, tutuklayın onu!"

 agot_filler_north.0052.d.tt:0 "Kaderine daha sonra karar vereceksin ya da son günlerini hücrede geçirmesine izin vereceksin."

 agot_filler_north.0053.t:0 "Efsaneler: Sıçan Aşçı"

 agot_filler_north.0053.desc:0 "Gece Nöbetçileri'nden doğan bir efsane: Gece Kalesi'ndeki bir aşçı, bir Andal kralına kendi oğlundan yapılmış bir turta ikram etmiş. Bu intikam eylemi tanrıları kızdırmamış — ama Gece Nöbetçileri'nin konuğu olan prensin öldürülmesi kızdırmış. Ceza olarak tanrılar aşçıyı, terk edilmiş Gece Kalesi'nde hâlâ musallat olduğu söylenen kocaman beyaz bir sıçana dönüştürmüş."

 agot_filler_north.0053.a:0 "Ah, şimdi şarkıyı hatırlıyorum."

 agot_filler_north.0053.a.tt:0 "Şimdi hükme geri dön."

 agot_filler_north.0054.t:0 "Günah Çıkaran"

 agot_filler_north.0054.desc:0 "[confessor.GetFirstNameNoTooltip] muhafızlarıma, evinde kalan bir yolcuyu öldürüp soyduğunu itiraf etti. Yolcu [confessor.GetFirstNameNoTooltip] ile ekmek ve tuz bölüşmüş, misafir hakkıyla korunuyordu.\n\n[confessor.GetFirstNameNoTooltip], cinayete kadar dindar olmadığını, sonrasında evinde kocaman beyaz bir sıçan görmeye başladığını itiraf ediyor. Şimdi tanrılarla barışmak ve suçlarının karşılığı olan adaleti almak istiyor."

 agot_filler_north.0054.a:0 "Kefaretin tek bir yolu var!"

 agot_filler_north.0054.a.tt:0 "Kanın karşılığı kan olmalı, kılıcı sallayacaksın... "

 agot_filler_north.0054.b:0 "Altını ver, her şey affedilsin."

 agot_filler_north.0054.b.tt:0 "Her şeyin bir bedeli var..."

 agot_filler_north.0054.c:0 "Muhafızlar, tutuklayın onu!"

 agot_filler_north.0054.c.tt:0 "Kaderine daha sonra karar vereceksin ya da son günlerini hücrede geçirmesine izin vereceksin."

 agot_filler_north.0055.t:0 "Kütüphane: Kuzey"

 agot_filler_north.0055.desc:0 "Gecelerim huzursuz geçiyor, bunda son zamanlarda başa çıktığım streslerin payı var. Zihnim, en kısa dinlenme anı için bile yönetmenin stresini görmezden gelemiyor gibi.\n\nBu gece kalede dolaşırken kendimi kütüphanede buldum. Belki bir kitap zihnime bir oyalanma sağlar?"

 agot_filler_north.0055.a:0 "Bir bakalım, ya şu?"

 agot_filler_north.0055.a.tt:0 "İdare eder bir kitap aklını dertlerinden uzaklaştırabilir, olmayabilir de."

 agot_filler_north.0055.b:0 "Hmm, ya da belki şu?"

 agot_filler_north.0055.b.tt:0 "İdare eder bir kitap aklını dertlerinden uzaklaştırabilir, olmayabilir de."

 agot_filler_north.0056.t:0 "Kütüphane: Hardhome"

 agot_filler_north.0056.desc:0 "#bold Hardhome: Sur'un Ötesinde Vahşiler, Akıncılar ve Orman Cadıları Arasında Geçen Üç Yılın Öyküsü#! Üstat Wyllis'ten. Kitap, gizemli yıkımından önce Sur'un ötesinde var olan tek, talihsiz kasabadaki günlük hayatı anlatıyor. Eğer koruyucusu, yabanıl bir reis olan Grom the Wolf bir kavgada ölmeseydi, Üstat Wyllis yerleşim hakkında daha fazlasını sunabilirdi. Koruyucusu olmadan Üstat Wyllis, Hardhome'dan kaçmak zorunda kaldı."

 agot_filler_north.0056.a:0 "Okumaya değer!"

 agot_filler_north.0057.t:0 "Kütüphane: Denizle Evli"

 agot_filler_north.0057.desc:0 "#bold Denizle Evli, Beyaz Liman'ın En Eski Günlerinden Tarihinin Bir Anlatısı#! Üstat Yorrick'ten. Kitap, Beyaz Liman — ve onu yöneten Manderly Hanesi — hakkında pek çok ayrıntıya iniyor. Yine de, Üstat Yorrick'in eski tanrılara kan kurbanları yapıldığını yazdığı birkaç tuhaf paragraf var."

 agot_filler_north.0057.a:0 "Okumaya değer!"

 agot_filler_north.0058.t:0 "Kütüphane: Adalet ve Adaletsizlik"

 agot_filler_north.0058.desc:0 "#bold Kuzey'de Adalet ve Adaletsizlik: Üç Stark Lordunun Hükümleri#! Üstat Egbert'ten. Kitap, Kuzey'de misafir hakkının ihlalinin vatana ihanetle eşdeğer bir suç sayıldığını — ve yalnızca akraba katlinin onun kadar korkunç sayılabileceğini — inceliyor."

 agot_filler_north.0058.a:0 "Okumaya değer!"

 agot_filler_north.0059.t:0 "Kütüphane: Sur'da Nöbetçiler"

 agot_filler_north.0059.desc:0 "#bold Sur'da Nöbetçiler#! Başüstat Harmune'den. Bu kitap, Gece Kalesi hakkında birçok masal ve Gece Nöbetçileri üyelerinin anlattığı efsaneler barındırıyor. Başüstat Harmune, Brandon "Kırıcı" Stark'ın, Gece Kralı'nı ve ceset gelinini yenmek için Sur'un Ötesindeki Kral Joramun ile ittifak kurmasını ayrıntılarıyla anlatıyor."

 agot_filler_north.0059.a:0 "Okumaya değer!"

 agot_filler_north.0060.t:0 "Kütüphane: Kışın Kralları"

 agot_filler_north.0060.desc:0 "#bold Kışın Kralları ya da Winterfell Starklarının Efsaneleri ve Soyları#! Üstat Childer'den. Bu kitap, Brandon "İnşacı" ve Ormanın Çocukları hakkındaki kayıp bir türkünün bir parçasını içerdiği için iyi bilinir. Bu kayıp türkünün parçaları, Brandon'ın Ormanın Çocuklarının yardımıyla Sur'u nasıl inşa ettiğini anlatır."

 agot_filler_north.0060.a:0 "Okumaya değer!"

 agot_filler_north.0061.t:0 "Kütüphane: Zor Bir Kitap"

 agot_filler_north.0061.desc:0 "Mürekkep satırlarına bakarken başım zonkluyor. Bu üstat yazılarında ne anlatmaya çalışıyorsa benden kaçıyor! Aynı satırı beş kez yeniden okuduktan sonra çabayı bırakmaya karar veriyorum; kitap sırlarını saklasın!"

 agot_filler_north.0061.a:0 "Kahretsin bu kitabı!"

 agot_filler_north.0062.t:0 "Gölgekedi"

 agot_filler_north.0062.desc:0 "Bir gezintiye çıktığımda, doğal ihtiyacımı görmek için maiyetimden ayrılıyorum. Muhafızlarım bana biraz mahremiyet sağlamak için geride kalıyor. İşimi bitirip gruba dönmeye hazırlanırken, birkaç adım ötemde bana bakan bir gölgekedisi fark ediyorum."

 agot_filler_north.0062.a:0 "İMDAT! İMDAT EDEN VAR MI!"

 agot_filler_north.0062.a.tt:0 "Umarım adamlarım yalvarışlarımı duyup yardımıma gelir!"

 agot_filler_north.0062.b:0 "*Kılıcını çeker*"

 agot_filler_north.0062.b.tt:0 "Gölgekedileri hızlıdır, umarım sen daha hızlısındır!"

 agot_filler_north.0062.c:0 "Sakin ol, kedicik."

 agot_filler_north.0062.c.tt:0 "Bir avcı olarak bu durumla nasıl başa çıkılacağını en iyi sen bilirsin... #italic Umarım.#!"

 agot_filler_north.0062.d:0 "Ne güzelsin sen öyle?"

 agot_filler_north.0062.d.tt:0 "Zavallıcık sadece bir öğün yemek arıyor."

 agot_filler_north.0062.e:0 "*Geri bakar*"

 agot_filler_north.0062.e.tt:0 "Sen kolayca korkutulacak biri değilsin; üstelik korkulan biri olarak ün yapmışsın."

 agot_filler_north.0062.f:0 "*hıçkırık* Ne kadar da büyük bir kediciksin?"

 agot_filler_north.0062.f.tt:0 "Kediciğin karnının sevilmesi hoşuna gider mi?"

 agot_filler_north.0063.t:0 "Gölgekedi"

 agot_filler_north.0063.desc:0 "Kının çeliğin çıkarken çıkardığı ses gölgekedisini üstüme doğru fırlatıyor — şükür ki kılıcı tam zamanında çekiyorum. Kaliteli çeliğin tek darbesiyle gölgekedisi benden uzaklaşmak için kanatlanıyor."

 agot_filler_north.0063.a:0 "Umarım hatırlayacağı bir ders olur!"

 agot_filler_north.0063.a.tt:0 "Bu etkileyici bir hikâye olur!"

 agot_filler_north.0064.t:0 "Gölgekedi"

 agot_filler_north.0064.desc:0 "Pelerinimin uçlarını tutup olabildiğince yukarı kaldırıyorum. Boyum iki katına çıkmış gibi görününce gölgekedisinin yüzünde bir şaşkınlık ifadesi beliriyor. Canavar artık benim kolay bir av olacağımdan o kadar emin değil. Kısa bir anın ardından gölgekedisi şansını denemektense kaçmayı seçiyor."

 agot_filler_north.0064.a:0 "Bu epey güzel bir hikâye olur!"

 agot_filler_north.0064.a.tt:0 "İyi ki bugün pelerinini getirmişsin!"

 agot_filler_north.0065.t:0 "Gölgekedi"

 agot_filler_north.0065.desc:0 "Görünüşüne bakılırsa zavallıcık, bir yavru kedi sürüsüne sahip, yarı aç bir anne. Gezi için yanıma aldığım kuru etlerden birazını çıkarıp ona atıyorum. Daha kolay bir öğün varsa beni rahatsız etmez..."

 agot_filler_north.0065.a:0 "Umarım yakında bir geyik bulur."

 agot_filler_north.0065.a.tt:0 "Ne güzel bir yaratık. Bu yoldan bir daha geçtiğinde yanına daha fazla et almayı unutma."

 agot_filler_north.0066.t:0 "Gölgekedi"

 agot_filler_north.0066.desc:0 "Gölgekedisiyle göz göze geliyorum — yıllar içinde kaç tanesini avlamıştım? Çoğu bundan daha iri ve güçlüydü. O, en fazla iki yaşında, yarı aç bir anne. Yine de bir an onu hayranlıkla izliyorum. Yavaş yavaş durumun farkına varıyor: Burada baskın yırtıcı o değil. Gözleri korkuyla doluyor ve huzursuzca benden kaçıyor."

 agot_filler_north.0066.a:0 "Tekrar görüşünceye dek!"

 agot_filler_north.0066.a.tt:0 "Canavarların bile senden korktuğu nasıl bir hayat yaşıyorsun? Bunun haberi ününü daha da artırır."

 agot_filler_north.0067.t:0 "Gölgekedi"

 agot_filler_north.0067.desc:0 "Bu...*hıçkırık* şimdiye dek gördüğüm en büyük kedicik olmalı. Gel buraya, #italic kedicik, kedicik, kedicik#!. Kulağının arkasının kaşınması hoşuna gider mi? Dur... ah... kedicik bu acıtıyor... AH! Kedicik, ısırmak yok!"

 agot_filler_north.0067.a:0 "Kötü kedicik!"

 agot_filler_north.0067.a.tt:0 "Karnı sevilirse hoşlanacağını sanmıştın..."

 agot_filler_north.0068.t:0 "Tanrı Ormanında Bir Mantar"

 agot_filler_north.0068.desc:0 "Yaz karları nihayet Tanrı Ormanı'ndan eridi — gerçek bir Kuzeyli gibi, karla kaplı orman zemini de tanrılarıma dua etmeme engel olmamıştı. Yine de karlar eriyince Tanrı Ormanı, bir zamanlar karın örttüğü birçok bitkinin serpilmesiyle canlandı. Tanrı Ormanı'ndaki yeni yeşillikleri hayranlıkla izlerken, weirwood'un köklerinin dibinde büyüyen epey renkli bir mantar fark ettim..."

 agot_filler_north.0068.a:0 "Yürek ağacına zarar vermediği sürece!"

 agot_filler_north.0068.a.tt:0 "Açıkça eski tanrılar onun burada büyümesine izin veriyor, belki de olduğu gibi bırakmak en iyisi?"

 agot_filler_north.0068.b:0 "Belki aşçım bunu hazırlayabilir?"

 agot_filler_north.0068.b.tt:0 "Aşçının bu malzemeyle ne tür yemekler hazırlayabileceğini merak ediyorsun."

 agot_filler_north.0068.c:0 "İlginç bir buluntu doğrusu."

 agot_filler_north.0068.c.tt:0 "Casusluk ve zehir bilgin bu mantarı çok iyi tanımanı sağlıyor."

 agot_filler_north.0068.d:0 "Eski tanrılardan bir işaret mi?"

 agot_filler_north.0068.d.tt:0 "Açıkça eski tanrılar onun burada büyümesine izin veriyor, belki de o senin için?"

 agot_filler_north.0068.e:0 "Ne nadir bir buluntu!"

 agot_filler_north.0068.e.tt:0 "Şifa sanatları bilgin bu mantarı çok iyi tanımanı sağlıyor."

 agot_filler_north.0069.t:0 "Tanrı Ormanında Bir Mantar"

 agot_filler_north.0069.desc:0 "Aşçımın hazırladığı yemek nefisti! Taht salonuna dönmeden önce tabağımda en küçük bir lokma bile bırakmadım. Bir saraylının şikâyetlerini dinlerken kendimi garip hissetmeye başlıyorum... sonra onu görüyorum! Saraylılarımın ve misafirlerimin hepsi efsanelerdeki Ak Gezenlere dönüşmüş ve kalemin içinde kar yağıyor.\n\nSaatler sonra uyandığımda, muhafızlarımın çılgınlığım sırasında beni zapt etmek zorunda kaldıkları bilgisi veriliyor. Üstadım mantarın bana hayaller gösterdiğine inanıyor, ama ben bunun Eski Tanrılar'dan bir uyarı olduğunu biliyorum..."

 agot_filler_north.0069.a:0 "Tanrılara hizmet etmek için yaşayacağım!"

 agot_filler_north.0069.a.tt:0 "Kim ne derse desin, gördüklerini gözlerinin önünden silemezsin..."

 agot_filler_north.0070.t:0 "Tanrı Ormanında Bir Mantar"

 agot_filler_north.0070.desc:0 "Mantar çok nadir bir tür; benim gibi ilgi alanları olanlar onu gayet iyi bilir. Mantar yendiğinde kişinin her türlü halüsinasyonu görmesine yol açar. Biri öyle bir durumdayken, şey... diyelim ki kendini savunması çok zordur."

 agot_filler_north.0070.a:0 "Ah, seninle yapabileceğim şeyler."

 agot_filler_north.0070.a.tt:0 "Böyle bir zehir işe yarayabilir!"

 agot_filler_north.0071.t:0 "Tanrı Ormanında Bir Mantar"

 agot_filler_north.0071.desc:0 "Mantardan bir ısırık almadan önce yalnızca kısa bir an tereddüt ettim. Weirwood'un köklerinden büyümüştü — tanrılar kesinlikle ondan yememi istemişti.\n\nKısa bir süre sonra Tanrı Ormanı, Ormanın Çocuklarının şarkılarıyla canlandı. Havayı sıcak bir ışıltı kapladı ve onunla birlikte yazın sıcaklığı geldi. Saatler sonra, kendimi yürek ağacının yanında buldum."

 agot_filler_north.0071.a:0 "Gerçekten de tanrılar bunu görmemi istemiş!"

 agot_filler_north.0071.a.tt:0 "Kim ne derse desin, gördüklerini gözlerinin önünden silemezsin!"

 agot_filler_north.0072.t:0 "Tanrı Ormanında Bir Mantar"

 agot_filler_north.0072.desc:0 "Mantar, kısa bir yaz karından sonra büyüdüğü bilinen nadir bir tür. Kötü işler için kullanılabilse de, küçük miktarlarda faydalı bir ilaç olabilir. Üstatların ve şifacıların, özellikle çok daha nadir oldukları Güney'de, bu mantarlar için iyi bir fiyat ödedikleri bilinir."

 agot_filler_north.0072.a:0 "Kârlı bir buluntu!"

 agot_filler_north.0072.a.tt:0 "Eline daha çok altın ve belki, umarız, mantar da birilerine yardım etmek için kullanılır!"

 agot_filler_north.0073.t:0 "Meyhanenin Yeni Sahibi"

 agot_filler_north.0073.desc:0 "Kral Yolu'nda ilerlerken adamlarım ve ben, bu tür yolculuklarda ara sıra uğradığımız küçük bir handa duruyoruz. İçeri girdiğimizde bizi, önceki sahibin görünürdeki kardeşi olan hanın yeni sahibi karşılıyor. Nehir Toprakları'nda bir hanı olduğunu ve yaşlanan kardeşinin Kuzey'in soğuğuna artık dayanamadığını söylüyor — bu yüzden ikisi hanlarını değişmiş.\n\nYeni sahip hanı temizlemek için çok iş yapmış; hiçbir yerde toz göze çarpmıyor. Yine de bir masada kuru kan lekeleri fark ettim; bunun, az önce bir koyunu yüzerken olduğunu ama ne yazık ki masayı lekelediğini söyledi."

 agot_filler_north.0073.a:0 "Bu, taze et turtalarınız var demek mi?"

 agot_filler_north.0073.a.tt:0 "Yol uzundu, bir yemek adamlarına iyi gelir."

 agot_filler_north.0073.b:0 "Burada bir tuhaflık var..."

 agot_filler_north.0073.b.tt:0 "Yeni sahip bir nedenden ötürü ensendeki tüyleri diken diken ediyor; belki de adamların hanı kontrol etmeli."

 agot_filler_north.0073.c:0 "Önceki sahibini tanırdım... burada bir tuhaflık var..."

 agot_filler_north.0073.c.tt:0 "Geçmişteki konaklamaların sırasında önceki sahibiyle birkaç kez sohbet etmiştin. Kardeşi olmadığını biliyorsun."

 agot_filler_north.0074.t:0 "Meyhanenin Yeni Sahibi"

 agot_filler_north.0074.desc:0 "Adamlarım mahzen odasını araştırdıklarında şüphelerimi doğruladılar. Önceki sahip, yaşlanmış bir dana yarımı gibi asılmıştı — ve bir dana yarımı gibi, etinden parçalar kesilmişti. Bu "yeni sahibin" misafirlere öncekinden yapılmış yemekler ikram ettiğini anlayan adamlarımdan biri midenin boşalttı."

 agot_filler_north.0074.a:0 "Katili tutuklayın!"

 agot_filler_north.0074.a.tt:0 "Böyle bir canavar özgür dolaşmamalı..."

 agot_filler_north.0075.t:0 "Meyhanenin Yeni Sahibi"

 agot_filler_north.0075.desc:0 "Et turtaları nefisti! Kendimi bir tane daha almaktan alıkoyamadım. Koyun eti normaldekinden çok farklı tatsa da yemek harikaydı. Yeni sahibi, kardeşinin yemeklerini geliştirdiği için övdüm!"

 agot_filler_north.0075.a:0 "O zaman en iyisi yola koyulmak, teşekkürler!"

 agot_filler_north.0075.a.tt:0 "Mideleri dolu, sen ve adamların yolculuğa devam etmeye koyuluyorsunuz."

 agot_filler_north.0075.b:0 "Belki geceyi burada geçirmeliyiz."

 agot_filler_north.0075.b.tt:0 "Düzgün bir yatağın varken neden yerde uyuyasın!"

 agot_filler_north.0076.t:0 "Meyhanenin Yeni Sahibi"

 agot_filler_north.0076.desc:0 "O gece geç saatlerde, hanın yeni sahibi kocaman bir satırla odama giriyor. Muhafızlarımı çağırarak bağırıyorum ama yeni sahip bana sadece gülüyor. Adamlarımın çoktan mahzen odasında olduğunu, benim de yakında orada olacağımı söylüyor.\n\nMuhafızlarımın tamamen kas olduğu ve kötü et turtası yapacağı, ama iyi yağlanmış bir soylunun öyle harika turtalar yapacağı hakkında sayıklamaya başlıyor. Satırla üstüme atılırken gülüyor..."

 agot_filler_north.0076.a:0 "Beni turta yapmayacaklar!"

 agot_filler_north.0076.a.tt:0 "Hanın biriniz canlı çıkacak..."

 agot_filler_north.0076.a.win.title:0 "Hayatta Kaldın"

 agot_filler_north.0076.a.lose.title:0 "Ölüyorsun..."

 agot_filler_north.0077.t:0 "Meyhanenin Yeni Sahibi"

 agot_filler_north.0077.desc:0 "Satır, kale dövmesi çeliğin karşısında zavallı bir silahtır. Katil, silahım köprücük kemiğini ısırınca bunu acı şekilde öğreniyor. Geniş bir yara savaşma isteğini bitiriyor, o da kaçmaya yelteniyor — ama ben böyle bir canavarın kaçmasına izin vermem. "Yeni sahip" öldükten sonra hanı aramaya başlıyorum.\n\nAdamlarımı önceki sahipla birlikte mahzen odasında, kesilecek hayvanlar gibi asılmış halde buluyorum. Yediğim turtaların içinde tam olarak ne olduğu aklıma gelince midem alt üst oluyor."

 agot_filler_north.0077.a:0 "Ne kadar da delilik..."

 agot_filler_north.0077.a.tt:0 "Bu manzara seni tiksindiriyor. Bu lanetli handa ne yediğini kimsenin öğrenmemesini diliyorsun."

 agot_filler_north.0078.t:0 "Meyhanenin Yeni Sahibi"

 agot_filler_north.0078.desc:0 "O handan ayrılalı epey zaman geçmişti ki sarayıma bir haber ulaştı. Görünüşe göre gezginler, biz ayrıldıktan günler sonra hanı terk edilmiş bulmuş. Mahzen odasında bir dehşet evi anlatmışlar. Cesetler hayvan gibi asılmış ve onlara öyle davranıldığına dair kanıtlar varmış — yemek için kesilmişler. Dinlerken midem bulandı..."

 agot_filler_north.0078.a:0 "Turtalar... #bold insan etinden#! yapılmıştı."

 agot_filler_north.0078.a.tt:0 "Bu turtalardan senin de yediğini kimsenin öğrenmemesini diliyorsun."

 agot_filler_north.0079.t:0 "Kuzeyde Bir Ejderha"

 agot_filler_north.0079.desc:0 "[dragon_finder.GetFirstNameNoTooltip] panik halinde sarayıma varıyor. Delikanlı, topraklarımda uyuyan bir ejderhadan bahsedip sayıklamaya başlıyor; bu suçlama taht salonunu kahkahalara boğuyor. Delikanlı ise hiç eğlenmiş değil — canavar uyanırsa hepimizin mahvolacağını iddia edip harekete geçmen için yalvarıyor!"

 agot_filler_north.0079.a:0 "Şu budalayı buradan çıkarın!"

 agot_filler_north.0079.a.tt:0 "Hiç olmazsa delikanlı sarayına güzel bir kahkaha attırdı!"

 agot_filler_north.0079.b:0 "Bana bu... #italic ejderhadan#! daha çok bahset."

 agot_filler_north.0079.b.tt:0 "Delikanlının korkusu gerçek, belki hikâyesinde daha fazlası var?"

 agot_filler_north.0079.c:0 "Her ihtimale karşı hazır olmak en iyisi."

 agot_filler_north.0079.c.tt:0 "Üstatlar tüm ejderhaların öldüğünü söylüyor ama bundan nasıl bu kadar emin olabilirler?"

 agot_filler_north.0079.d:0 "Sana ejderhaları anlatayım, delikanlı."

 agot_filler_north.0079.d.tt:0 "Delikanlıyı eğitmek ve tarih bilgini sergilemek için bir fırsat!"

 agot_filler_north.0080.t:0 "Kuzeyde Bir Ejderha: Kaplıcada"

 agot_filler_north.0080.desc:0 "[dragon_finder.GetFirstNameNoTooltip] hikâyesine devam etti. Görünüşe göre delikanlı odun toplarken sıcak su kaynatan bir dereye rastlamış. Delikanlı, suyun bu kadar sıcak çıkmasına ancak yeraltında uyuyan bir ejderhanın yol açabileceğini düşünmüş.\n\nDelikanlıyı sakinleştirdim: Her şey yolunda, ejderha falan yok; ama tedbir olarak dereyi ziyaret edeceğim. Ertesi gün kaplıcaya gidip ılık suda rahatlatıcı bir yüzme keyfi yapıyorum."

 agot_filler_north.0080.a:0 "Evet, burada ejderha yok."

 agot_filler_north.0080.a.tt:0 "Kontrol etmek için geri dönebilirsin; hem kaplıcaların sıcağının tadını çıkarırsın."

 agot_filler_north.0081.t:0 "Kuzeyde Bir Ejderha"

 agot_filler_north.0081.desc:0 "[dragon_finder.GetFirstNameNoTooltip] Ejderhaların Dansı'nın tarihini anlatırken beni dinliyor; o büyük savaştan yıllar sonra son ejderhaların ölümlerini ayrıntılarıyla anlatıyorum. Böyle bir yaratık, beslenmek zorundayken nasıl fark edilmeden kalabilirdi ki? Delikanlı emin görünmüyor ama sonunda Kuzey'de ejderha olmadığı konusunda hemfikir oluyor."

 agot_filler_north.0081.a:0 "Umarım artık daha az budala olur."

 agot_filler_north.0081.a.tt:0 "Umarım benzer korkuları olan diğer küçük halka da haber verir."

 agot_filler_north.0082.t:0 "Kahraman Kaçak Avcı"

 agot_filler_north.0082.desc:0 "[heroic_poacher.GetFirstNameNoTooltip], muhafızlarımın yakından tanıdığı bir kaçak avcı; çünkü yıllardır onlardan kaçıyor. Normalde muhafızlarımın başına bu kadar uzun süre dert olan birine adalet dağıtmakta sorun görmezdim ama [heroic_poacher.GetFirstNameNoTooltip]'in muhafızlarımın eline geçiş şekli en sert muhafızlarımın bile merhamet dilemesine yol açtı. Seyir halindeki bir tüccar, eşkıyalar tarafından durdurulmuş; o ve ailesi yalnızca [heroic_poacher.GetFirstNameNoTooltip]'in haydutlarla savaşıp aileyi güvenliğe götürmesi sayesinde kurtulmuş. Tam orada muhafızlarım tarafından yakalanmış. Tüccar bile adamın can güvenliği için büyük bir meblağ teklif ediyor."

 agot_filler_north.0082.a:0 "[heroic_poacher.GetFirstNameNoTooltip] adalete göz yumdu."

 agot_filler_north.0082.a.tt:0 "İyi bir iş yapmış olsalar da kanundan kaçtılar ve buna izin veremezsin. Yine de bir bedel ödenebilir ve böyle birine bir ödül verilebilir."

 agot_filler_north.0082.b:0 "Tüccarın altınını alacağım..."

 agot_filler_north.0082.b.tt:0 "Suçları bağışlayabilirsin, altın da yıllar boyunca ormanlarımdan eksilen av hayvanlarının kaybını karşılasın."

 agot_filler_north.0082.c:0 "Kaçak avcılık cehenneme, katıl bana!"

 agot_filler_north.0082.c.tt:0 "Suçu unut! Kaçak avcı krallığına bir hizmette bulundu, onun gibi adamlara ihtiyacın olabilir!"

 agot_filler_north.0082.d:0 "Sur'un senin gibi adamlara ihtiyacı var."

 agot_filler_north.0082.d.tt:0 "Onurlu bir suçlu, Nöbet'in ihtiyacı olan şeydir. İyi hizmet ederse belki rütbeleri tırmanır."

 agot_filler_north.0083.t:0 "Kahraman Kaçak Avcı"

 agot_filler_north.0083.desc:0 "Böyle bir adama bunu yapmak canımı yaksa da iyilik kötülüğü silip götürmez. [heroic_poacher.GetFirstNameNoTooltip] yıllardır adalete göz yumduğu için onun bir gözünü aldım.\n\nİş tamamlandıktan sonra [heroic_poacher.GetFirstNameNoTooltip]'e sarayımda yer teklif ediyorum; onurlu bir şekilde hizmet ederse geçimini sağlamak için bir daha kaçak avcılığa dönmek zorunda kalmayacağına söz veriyorum."

 agot_filler_north.0083.a:0 "Göze göz."

 agot_filler_north.0083.a.tt:0 "İş tamamlandı. Artık sarayına katıldığına göre suça bulaşmak zorunda kalmayacak. Kaçak avcı, gözünü aldıktan sonra sana karşı herhangi bir kötü niyet beslemiyor gibi görünüyor."

 agot_filler_north.0084.t:0 "Yarık"

 agot_filler_north.0084.desc:0 "Yoğun bir kar yağışının ardından seyahat ederken atlarımın altındaki zemin birden çöküyor. Birkaç dakika sonra kendimi karın gizlediği derin bir yarığın içinde buluyorum. Gecenin soğuğu yaklaşırken, yardım gelene kadar hayatta kalamayacağımı biliyorum..."

 agot_filler_north.0084.a:0 "Belki dışarı tırmanabilirim."

 agot_filler_north.0084.a.tt:0 "Düşme riski var ama yapılabilir görünüyor."

 agot_filler_north.0084.b:0 "Başka bir yol olmalı..."

 agot_filler_north.0084.b.tt:0 "Belki başka bir açıklık vardır..."

 agot_filler_north.0085.t:0 "Yarık"

 agot_filler_north.0085.desc:0 "Tırmanış kolay değil ama başarıyorum. Birkaç kez kayıp ölüme yuvarlanacağımı sandım ama tutuşum sağlamdı. Yarığın ağzından iyice uzaklaşana kadar bir daha ayağa kalkmıyorum — emekleyerek güvenliğe ulaşıyorum."

 agot_filler_north.0085.a:0 "Yaşadığıma şükür!"

 agot_filler_north.0085.a.tt:0 "Bugün ölümle burun buruna geldin ve hayatta kaldın!"

 agot_filler_north.0086.t:0 "Yarık"

 agot_filler_north.0086.desc:0 "Küçük mağaranın ağzından süzülen güneş ışığını görünce kalbim hızla çarpıyor. Ona doğru koşmaya başlıyorum ama bir hareket görüyorum... Özgürlüğümle benim aramda kocaman bir #bold ayı#! duruyor."

 agot_filler_north.0086.a:0 "Beni durdurmak bir ayıya kalmaz!"

 agot_filler_north.0086.a.tt:0 "Ne yazık ki canavar için, sen kılıç kullanmakta mahirsin!"

 agot_filler_north.0086.b:0 "Ayının yanından geçmeyi denemeliyim..."

 agot_filler_north.0086.b.tt:0 "Bu riskli bir dövüş olacak ama hayatın tehlikede!"

 agot_filler_north.0086.c:0 "*Kaç*"

 agot_filler_north.0086.c.tt:0 "Başka bir yol olmalı!"

 agot_filler_north.0087.t:0 "Yarık"

 agot_filler_north.0087.desc:0 "Mağaradan çıkış yolu bulma girişimim başarısız oldu, başladığım yere geri döndüm. Belki başka bir yol deneyebilirim..."

 agot_filler_north.0087.a:0 "Dışarı tırmanmayı dene."

 agot_filler_north.0087.a.tt:0 "Düşme riski var ama yapılabilir görünüyor."

 agot_filler_north.0087.b:0 "Belki bu yönden..."

 agot_filler_north.0087.b.tt:0 "Belki başka bir açıklık vardır..."

 agot_filler_north.0088.t:0 "Yarık"

 agot_filler_north.0088.desc:0 "Bu gece ölecek olanın ya ben ya da ayı olduğunu bilerek kılıcımı çekiyorum. Kılıcı savuruyorum — ayı beni parçalamadan önce en iyi ihtimalle bir iki iyi darbe indirebilirim. Şükür ki tanrılar yanımda ve ilk darbem canavar için ölümcül oluyor. Mağaradan çıkıp ağaçların ve güneş ışığının arasına dönerken derin bir nefes alıp tanrılara dua ediyorum."

 agot_filler_north.0088.a:0 "Tanrılar iyidir, yaşadığıma şükür."

 agot_filler_north.0088.a.tt:0 "Bu senin mezarın olabilirdi..."

 agot_filler_north.0089.t:0 "Yarık"

 agot_filler_north.0089.desc:0 "Bir açıklıktan süzülen gün ışığını görünce rahatlama çığlığı atıyorum. Kısa süre sonra yarıktan çıkıp eve dönüş yoluma koyuluyorum."

 agot_filler_north.0089.a:0 "Yaşadığıma şükür!"

 agot_filler_north.0089.a.tt:0 "Bu senin mezarın olabilirdi..."

 agot_filler_north.0090.t:0 "Yarık"

 agot_filler_north.0090.desc:0 "Bu labirent gibi mağaralarda saatlerdir dolaşıyorum. Güneşin çoktan battığını biliyorum ve soğuk kemiklerime işliyor."

 agot_filler_north.0090.a:0 "Ne... kadar... soğuk..."

 agot_filler_north.0090.a.tt:0 "Zihnin kararmaya başlarken, birinin seni bulup bulamayacağını merak ediyorsun..."

 agot_filler_north.0091.t:0 "Yarık"

 agot_filler_north.0091.desc:0 "Görünüşe göre bu yarığın kurbanı tek ben değilim. Bir başkasının kalıntılarını buldum; zamandan geriye yalnızca kemikler ve sırtındaki giysiler kalmış. Kişi hâlâ deri bir çantayı kavrıyormuş gibi duruyor."

 agot_filler_north.0091.a:0 "Zavallı ruh için bir dua edeceğim."

 agot_filler_north.0091.a.tt:0 "Kaderini paylaşabileceğin biri için yapabileceğin en az şey."

 agot_filler_north.0091.b:0 "O çuvalda değerli bir şeyler olmalı!"

 agot_filler_north.0091.b.tt:0 "Bu zavallı budalanın artık ona ihtiyacı yok!"

 agot_filler_north.0091.c:0 "O... ben olacak mıyım..."

 agot_filler_north.0091.c.tt:0 "Seni bekleyen geleceğe bakıyor olmaktan korkuyorsun..."

 agot_filler_north.0091.d:0 "İstediğim işaret değil."

 agot_filler_north.0091.d.tt:0 "Mezarın burası mı olacak?"

 agot_filler_north.0092.t:0 "Kar Fırtınası"

 agot_filler_north.0092.desc:0 "Kurt saati vaktinden beri kar durmadan yağıyor! Kahyamın taht salonuma girdiğini görünce, konuşmanın kar fırtınasının kalem üzerindeki etkilerine ayrılacağını biliyorum. Bu havaya yakalananlara barınak ve yemek sunabiliriz, ama bunu yapmak kalemizde süren işleri aksatacak."

 agot_filler_north.0092.a:0 "Ne yazık ki, kale her şeyden önce gelir."

 agot_filler_north.0092.b:0 "Halkımın acı çekmesine izin vermeyeceğim."

 agot_filler_north.0092.c:0 "Hava durumu üzerinde hiçbir kontrolüm yok."

 agot_filler_north.0093.t:0 "En Tehlikeli Av: Geyik"

 agot_filler_north.0093.desc:0 "Bugün sarayıma, yerel bir köyden yardım isteyen bir haberci geldi. Haberci, oldukça iri bir boğa geyiğinin köyü terörize ettiğini ve köyün birkaç adamının canavar tarafından yaralandığını söylüyor.\n\nBir boğa geyiği ciddi bir sorun olabilir, özellikle de canavar çiftleşme dönemindeyse. Nihayetinde bu yaratığın Hornwood Hanesi'nin simgesi olmasının bir nedeni var."

 agot_filler_north.0093.a:0 "Avlanıyoruz!"

 agot_filler_north.0093.b:0 "Korkarım yapabileceğim bir şey yok."

 agot_filler_north.0094.t:0 "En Tehlikeli Av: Geyik"

 agot_filler_north.0094.desc:0 "Av partimdeki bazı kişiler, boğa geyiğinin bela olduğu yere, küçük bir göle vardığımızda şaşırıyor. Geyiklerin çok iyi yüzücü olduğunu ve göl ile nehir diplerindeki bitkilerle beslenmelerinin alışılmadık bir durum olmadığını söylediğimde daha da şaşırıyorlar. Bu canavarın besin tercihi sorun değilken, birkaç küçük balıkçı teknesini alabora etmiş olması sorundu. Partim ve ben geyiği avlama işine koyuluyoruz."

 agot_filler_north.0094.a:0 "Gölün çevresinden dolanacağız."

 agot_filler_north.0094.b:0 "Bir kayık alıp geyiği size doğru süreceğim."

 agot_filler_north.0094.c:0 "Bu çok tehlikeli..."

 agot_filler_north.0095.t:0 "En Tehlikeli Av: Geyik"

 agot_filler_north.0095.desc:0 "Ne manzara ama! Boğa geyiği, kıyıya çıkmaya çalışan derinliklerden çıkan bir leviathan gibi görünüyor. Adamlarım mevzilerini koruyor ve geyik bir açık bulamıyor.\n\nYayımla dikkatlice nişan alıp oku salıyorum. Ok, geyiğin sağ ön bacağının arkasına saplanıyor ve darbenin canavarın ciğerlerini deldiğini hemen anlıyorum. Adamlarıma bırakması için işaret veriyorum. Kısa bir dinlenmenin ardından kan izini takip edip avımıza ulaşıyoruz."

 agot_filler_north.0095.a:0 "İyi bir av!"

 agot_filler_north.0096.t:0 "Tehlikeli Av: Geyik"

 agot_filler_north.0096.desc:0 "Ne manzara ama! Boğa geyiği, kıyıya çıkmaya çalışan derinliklerden çıkan bir leviathan gibi görünüyor. Adamlarım mevzilerini koruyup canavarı kıstırmaya çalışsa da geyik onlara saldırıyor — devasa boynuzlarıyla önüne çıkanı zahmetsizce savuruyor.\n\nBen de yaratığa karşı direnmeyi deniyorum, ama bir çocuğun istemediği oyuncak bebek gibi kenara fırlatılıyorum."

 agot_filler_north.0096.a:0 "Zavallı bir av..."

 agot_filler_north.0097.t:0 "En Tehlikeli Av: Geyik"

 agot_filler_north.0097.desc:0 "Köye varıyoruz; hasat kutlaması yapıyorlarmış — ta ki boğa geyiği her şeyi bozana dek. Biraz temizlik yapılmış olsa da canavarın yol açtığı büyük bir yıkım vardı. Köylüler, canavarın çoğu zaman gece gelip köy çevresinde yiyecek aradığını, bahçeleri ve erzak depolarını mahvettiğini söylüyor."

 agot_filler_north.0097.a:0 "Bir rakibin böğürtüsünü taklit etmek onu dışarı çekebilir."

 agot_filler_north.0097.b:0 "Belki hasat edilene karşı bir zaafı var."

 agot_filler_north.0097.c:0 "Bu çok tehlikeli..."

 agot_filler_north.0098.t:0 "En Tehlikeli Av: Geyik"

 agot_filler_north.0098.desc:0 "Güneş batarken, köye yaklaşan boğa geyiğinin böğürmesini duyuyoruz. Adamlarım ve ben, geyiğin yaklaştığı yerin rüzgâr altı tarafında mevzi alıyoruz. Meşale ışığında oklar işe yaramaz, o yüzden yaban domuzu mızrakları kuşanıyoruz.\n\nMeşale ışığı boğa geyiğini yakalayınca omurgamdan bir ürperti geçiyor. Canavar devasa ama ışık oyunlar yapıp etrafa gölgeler savurarak Uzun Gece efsanelerine rakip bir görüntü oluşturuyor. Mızraklarımızla yüklenip geyiği bıçaklıyoruz. Canavar kaçmak için dönerken mızrağın elimden söküldüğünü hissediyorum.\n\nGeyiği izlemek için şafağın ilk ışığını bekliyoruz. Kan izini takip edince canavarı köyün hemen dışında ölü buluyoruz. Mızrağım hâlâ böğründe."

 agot_filler_north.0098.a:0 "İyi bir av!"

 agot_filler_north.0099.t:0 "En Tehlikeli Av: Geyik"

 agot_filler_north.0099.desc:0 "Güneş batarken, köye yaklaşan boğa geyiğinin böğürmesini duyuyoruz. Adamlarım ve ben, geyiğin yaklaştığı yerin rüzgâr altı tarafında mevzi alıyoruz. Meşale ışığında oklar işe yaramaz, o yüzden yaban domuzu mızrakları kuşanıyoruz.\n\nMeşale ışığı boğa geyiğini yakalayınca omurgamdan bir ürperti geçiyor. Canavar devasa ama ışık oyunlar yapıp etrafa gölgeler savurarak Uzun Gece efsanelerine rakip bir görüntü oluşturuyor. Mızraklarımızla yüklenip geyiği bıçaklıyoruz. Canavar kaçmak için dönerken mızrağın elimden söküldüğünü hissediyorum.\n\nGeyiği izlemek için şafağın ilk ışığını bekliyoruz. Ama hiçbir kan izi bulamıyoruz; canavar bize kurtulmuş."

 agot_filler_north.0099.a:0 "Zavallı bir av..."

 agot_filler_north.0100.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0100.desc:0 "Bugün sarayıma, oldukça baş belası bir yaban öküzü sürüsüyle başa çıkmak için yardım isteyen bir haberci geldi. Bu devasa yaratıklar, eti için beslediğimiz evcil sığırlardan çok farklı. Yaban öküzleri tamamen kas ve saldırganlıktan ibaret."

 agot_filler_north.0100.a:0 "Avlanıyoruz!"

 agot_filler_north.0100.b:0 "Korkarım yapabileceğim bir şey yok."

 agot_filler_north.0101.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0101.desc:0 "Yaban öküzleri, yerli çobanların koyunlarını otlattığı gözde bir vadi bulmuş. Sorun şu ki sürü oradan kımıldamıyor ve toprağı aşırı otlatıyor. Yerliler sürüyü dağıtmayı denedi ama atsız olarak sadece birkaç adamı yaralamayı başardılar. "

 agot_filler_north.0101.a:0 "Atlara binin, adamlar!"

 agot_filler_north.0101.b:0 "Beni izleyin!"

 agot_filler_north.0101.c:0 "Başaracağız."

 agot_filler_north.0101.d:0 "Korkarım yapabileceğim bir şey yok."

 agot_filler_north.0102.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0102.desc:0 "Yaban öküzleri, yerlilerin ve tüccarların kullandığı bir yolun yakınında otluyor. Normalde sürüden yeterince uzak durulduğu sürece bu bir sorun olmazdı; ancak son zamanlarda işler değişti.\n\nYerliler ekibime, bir grup kaçak avcının sürüye saldırmayı deneyip başarısız olduğunu anlatıyor. Bu, sürünün kocaman boğasında iz bırakmış. Artık boğa ne zaman bir insan görse ona saldırıyor."

 agot_filler_north.0102.a:0 "Boğa gitmeli."

 agot_filler_north.0102.b:0 "Belki zehirli oklar işe yarar..."

 agot_filler_north.0102.c:0 "Onu ormana doğru çekin."

 agot_filler_north.0102.d:0 "Korkarım yapabileceğim bir şey yok."

 agot_filler_north.0103.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0103.desc:0 "Atlarımız sürünün arkasında dörtnala koşuyor, adamlarım el işaretlerimi izleyip sürüyü bir arada tutuyor. Sürüyü vadiden çıkarıp daha öteye sürmeyi başarıyoruz. İyi ihtimalle vadiyi bir daha bulamazlar ve çobanlar koyunlarını huzur içinde otlatabilir."

 agot_filler_north.0103.a:0 "İyi iş, adamlarım!"

 agot_filler_north.0104.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0104.desc:0 "Atlarımız sürünün arkasında dörtnala koşuyor, adamlarım el işaretlerimi izleyip sürüyü bir arada tutuyor. Ne yazık ki el işaretlerimden biri yanlış anlaşıldı ve saflarımızda bir boşluk açıldı. Sürü bundan yararlanıp araya daldı; izdihamda adamlarımdan birkaçını ezdi ve atlarımızdan bazılarını ürküttü.\n\nYenilgiyi kabul ediyor ve çobanlara yeni otlaklar bulmaları gerekeceğini bildiriyoruz."

 agot_filler_north.0104.a:0 "Zavallı bir deneme..."

 agot_filler_north.0105.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0105.desc:0 "Gözüne girdiğimiz an boğa saldırganlığını gösterip adamlarıma yükleniyor. Güçlükle de olsa onu sürüden ayırmayı başarıyoruz. Canavar savaşmaya çabalarken oklarımız üzerine yağıyor.\n\nCanavara hayran olmadan edemiyorum; o sadece sürüyü tehdit olarak gördüğü şeye karşı korumaya çalışıyordu. Yine de canavar öldürülmek zorundaydı — ama boğa yere yığıldığında adamlarımdan hiçbiri sevinç çığlığı atmıyor. Bunun yerine kaçak avcılara sövüyorlar. Boğa yaban öküzü saygımızı kazanmıştı."

 agot_filler_north.0105.a:0 "Öyle bir canavar!"

 agot_filler_north.0106.t:0 "En Tehlikeli Av: Yaban Öküzü"

 agot_filler_north.0106.desc:0 "Gözüne girdiğimiz an boğa saldırganlığını gösterip adamlarıma yükleniyor. Güçlükle de olsa onu sürüden ayırmayı başarıyoruz. Canavar savaşmaya çabalarken oklarımız üzerine yağıyor.\n\nCanavara hayran olmadan edemiyorum; o sadece sürüyü tehdit olarak gördüğü şeye karşı korumaya çalışıyordu. Yine de canavar öldürülmek zorundaydı — ama ne yazık ki boğa yaban öküzü bize üstün geldi. Canavar, atlı adamlarımdan birkaçını devirmeyi başardıktan sonra sürüyü de alıp kaçtı."

 agot_filler_north.0106.a:0 "Zavallı bir deneme..."

 agot_filler_north.0107.t:0 "En Tehlikeli Av: Deri Değiştirici"

 agot_filler_north.0107.desc:0 "Zavallı adam hikâyesini anlatırken sarayım kahkahalarını zar zor tutuyor. Gülüşmelerini gizleyemeyenler karşısında adam kıpkırmızı oluyor ama anlatmaya devam ediyor. Görünüşe göre köyünün sürülerine, arka ayakları üzerinde yürüyen kocaman kıllı bir yaratık dadanmış. Yerliler, yaratığın aslında bir warg olduğuna inanıyor!"

 agot_filler_north.0107.a:0 "Sürüyü bir şey götürüyor..."

 agot_filler_north.0107.b:0 "Ha! Ne güzel bir şaka!"

 agot_filler_north.0108.t:0 "En Tehlikeli Av: Deri Değiştirici"

 agot_filler_north.0108.desc:0 "Çobanların hayvanlarını otlattığı yere varıyoruz. Adamlarım ve ben önce bölgeyi arıyor, kurt ya da başka büyük yırtıcıların izlerini bulmaya çalışıyoruz. Aramamız kayda değer bir şey ortaya çıkarmıyor.\n\nGüneş batmaya başlarken hareket planımıza karar veriyoruz."

 agot_filler_north.0108.a:0 "Bu gece sürüyü biz gözetleyeceğiz."

 agot_filler_north.0108.b:0 "Köyden gelen yolu izlemeliyiz."

 agot_filler_north.0108.c:0 "Bu zaman kaybı..."

 agot_filler_north.0109.t:0 "En Tehlikeli Av: Deri Değiştirici"

 agot_filler_north.0109.desc:0 "Güneş neredeyse batmışken onu gördük. "By the gods," one of my men muttered as a man the size of a palfrey emerged from the woods and walked to a nearby sheep. As the beast picked up the sheep, we rushed in on our warhorses. The freakish man, disguised in furs, screamed and tried to run back into the woods, pleading for his life as he fled.\n\nWe caught up to him quickly. The man was a normal, albeit gangling, poacher who had used is ill gotten furs to create a disguise and steal the livestock. The villagers even recognized him as one who was spreading the tales of a warg in the first place."

 agot_filler_north.0109.a:0 "Çok tuhaf bir av!"

 agot_filler_north.0110.t:0 "En Tehlikeli Av: Deri Değiştirici"

 agot_filler_north.0110.desc:0 "Güneş neredeyse batmışken onu gördük. "By the gods," one of my men muttered as a man the size of a palfrey emerged from the woods and walked to a nearby sheep. As the beast picked up the sheep, we rushed in on our warhorses. The freakish man, disguised in furs, screamed and tried to run back into the woods, pleading for his life as he fled.\n\nI found him the next morning in those woods, his throat torn out. As I left his body, I saw a wolf staring back at me, its eyes were almost human I thought, before it ran back into the woods."

 agot_filler_north.0110.a:0 "Bu avda tuhaf bir şey var..."

 agot_filler_north.0111.t:0 "En Tehlikeli Av: Deri Değiştirici"

 agot_filler_north.0111.desc:0 "Çobanların hayvanlarını otlattığı yere varıyoruz. Adamlarım ve ben önce bölgeyi arıyor, kurt ya da başka büyük yırtıcıların izlerini bulmaya çalışıyoruz. Aramamız, bulmayı beklediğimizden çok daha fazla ayak izi ortaya çıkarıyor — hepsi insanlara ait."

 agot_filler_north.0111.a:0 "Bu gece sürüyü biz gözetleyeceğiz."

 agot_filler_north.0111.b:0 "Yabanıllar..."

 agot_filler_north.0111.c:0 "Buna ayıracak zamanım yok..."

 agot_filler_north.0112.t:0 "En Tehlikeli Av: Yabanıllar"

 agot_filler_north.0112.desc:0 "Bizi izliyorlarmış, anlaşılan. Güneş batmaya başlarken ormandan çıkıyorlar — bir yabanıl baskın grubu. Adamlarım ve ben kılıçlarımızı çekip savaşta buluşuyoruz; sonucu eğitimimiz ve hünerimiz belirleyecek.\n\nÇobanların otlağı kanla kızıla boyandı."

 agot_filler_north.0112.a:0 "Kuzey için!"

 agot_filler_north.0112.a.win.title:0 "Kazandın!"

 agot_filler_north.0112.a.lose.title:0 "Kaybettin..."

 agot_filler_north.0113.t:0 "En Tehlikeli Av: Yabanıllar"

 agot_filler_north.0113.desc:0 "Adamlarıma mevzi aldırdım; sonucu askeri taktiklerimiz belirleyecekti. Güneş batmaya başlarken ormandan çıkıyorlar — bir yabanıl baskın grubu. Adamlarım ve ben kılıçlarımızı çekip onlarla savaşta buluşuyoruz.\n\nÇobanların otlağı kanla kızıla boyandı."

 agot_filler_north.0113.a:0 "Kuzey için!"

 agot_filler_north.0113.a.win.title:0 "Kazandın!"

 agot_filler_north.0113.a.lose.title:0 "Kaybettin..."

 agot_filler_north.0114.t:0 "Kuledeki Yabanıllar"

 agot_filler_north.0114.desc:0 "Adamlarım ve benim izini sürdüğümüz bir yabanıl baskın grubu, terk edilmiş bir gözcü kulesine sığınmış. Kulenin kendisi zar zor ayakta; duvarlar orijinal harcından çok, yüzyılların taşlara tırmanan sarmaşıklarıyla bir arada duruyor.\n\nYine de yabanıllar girişleri tahkim etmeyi ve üst katlara birkaç okçu yerleştirmeyi başarmış. Kuleyi alabileceğimize emindim ama kendi kanımızdan dökmeden değil."

 agot_filler_north.0114.a:0 "Kuzey için!"

 agot_filler_north.0114.a.tt:0 "Kuledeki yabanıllara saldırıyorsun!"

 agot_filler_north.0114.b:0 "Belki akılla ikna edebiliriz."

 agot_filler_north.0114.b.tt:0 "El uzatıp yabanıllara hizmetinde yer öneriyorsun. Belki dinlerler."

 agot_filler_north.0114.c:0 "Bir arabaya ve kuru çıraya ihtiyacım var..."

 agot_filler_north.0114.c.tt:0 "Kuleye sarılan ölü sarmaşıklar yakında bir odun yığını olacak..."

 agot_filler_north.0114.d:0 "Saldırmak fazla riskli olur..."

 agot_filler_north.0114.d.tt:0 "Bazı yabanıllar senin canına değmez."

 agot_filler_north.0115.t:0 "Kuledeki Yabanıllar"

 agot_filler_north.0115.desc:0 "Güneş okçuları için dezavantaj oluşturana kadar bekliyoruz, sonra kuleye saldırıyoruz. Adamlarım kalkanlarıyla okları bloke ederken, derme çatma barikat sökülüyor. Yabanıllar bizi öteki tarafta, kavgaya hazır halde karşılıyor.\n\nDar koridorlar acımasız bir çarpışmaya yol açıyor ve kulenin ayakta kalan taş zeminleri kısa sürede kanla kayganlaşıyor."

 agot_filler_north.0115.a:0 "Kuzey için!"

 agot_filler_north.0115.a.tt:0 "Kılıç çekip savaşıyorsun!"

 agot_filler_north.0115.a.win.title:0 "Savaş kazanıldı!"

 agot_filler_north.0115.a.lose.title:0 "Savaş kaybedildi!"

 agot_filler_north.0115.b:0 "Geri çekilin! Geri çekilin!"

 agot_filler_north.0115.b.tt:0 "Rakibin senden üstün, o yüzden geri çekiliyorsun."

 agot_filler_north.0116.t:0 "Kuledeki Yabanıllar"

 agot_filler_north.0116.desc:0 "Güneş batmaya başlarken adamlarım eski bir araba bulup içini çırayla dolduruyor. Adamlarım arabayı kuleye doğru yuvarlarken yabanıllar bizi fark edip okçularıyla atış deniyor. Ama araba gözcü kulesinin dibine kadar yuvarlanıyor — ve benim işaretimle adamlarım alevli oklarını arabadaki çıraya salıyor.\n\nAteş yayılmaya başlayınca yabanıllar kendi savunmalarını sökmeye çalışıyor. Ateş daha hızlı; kuleyi sarmaya başlayınca bazı yabanıllar alevlere teslim olmaktansa üst katlardan ölüme atlıyor. Kurt saati üzerimizde ve kule cayır cayır yanan bir cehenneme dönüştü."

 agot_filler_north.0116.a:0 "Zihnime sonsuza dek kazınmış bir görüntü."

 agot_filler_north.0116.a.tt:0 ""Odun yığınının" haberi elbette başkaları tarafından yayılacak, belki bir uyarı işlevi görür..."

 agot_filler_north.0117.t:0 "Kuledeki Yabanıllar"

 agot_filler_north.0117.desc:0 "Adamlarımın isteğinin aksine gözcü kulesine silahsız yaklaşıyorum. Beni duyabilecekleri mesafeye gelince bağırıp onlara bir seçenek sunuyorum:\n\nSarayımda yerim var; onlara barınak ve yiyecek sağlayabilirim. Karşılığında bana hizmet edecekler ve bu topraklara bir daha baskın yapmayacaklar.\n\nCevaplarını beklerken kule bağrışma ve çığlıklarla inliyor. Korkunç sesler nihayet kesiliyor ve iki yabanıl, ihtiyatla bana yaklaşmak için barikatı söküyor. İkisi de kana bulanmış; bu bana, teklifimi kabul etmeyen diğerlerini öldürdüklerini anlatıyor.\n\nİki yabanıl da önümde diz çöktü."

 agot_filler_north.0117.a:0 "Kan dökülmesinden kaçınmayı umuyordum."

 agot_filler_north.0117.a.tt:0 "Adamlar ölmüş olsa da en azından senin ellerinle olmadı..."

 agot_filler_north.0118.t:0 "Karlı Gün"

 agot_filler_north.0118.desc:0 "Gün boyu aralıksız kar yağdı ve bu yüzden sarayım epey sessiz. Can sıkıntısı baş gösterince, bu karlı günü törpülememe yardımcı olacak bir işe ihtiyacım olduğuna karar veriyorum!"

 agot_filler_north.0118.a:0 "Belki bir kitap okurum."

 agot_filler_north.0118.b:0 "Hazinedarlığa uğrayacağım."

 agot_filler_north.0118.c:0 "Belki bir şaka yapmak beni eğlendirir."

 agot_filler_north.0118.d:0 "Savaş stratejileri planlayacağım."

 agot_filler_north.0119.t:0 "Karlı Gün: Kütüphane"

 agot_filler_north.0119.desc:0 "Kütüphaneye girdiğimde raflardaki kitapların sırtlarına parmağımı gezdiriyorum. Bu karlı günü değerlendirmek için burada mutlaka bir kitap bulabilirim."

 agot_filler_north.0119.a:0 "Peki ya şu?"

 agot_filler_north.0119.b:0 "Bu aşırı zor görünüyor..."

 agot_filler_north.0120.t:0 "Karlı Gün: Hazine"

 agot_filler_north.0120.desc:0 "Karlı gün nihayet hazine defterlerini incelemek için ihtiyacım olan bahane oldu. Belki lehimize bir hata vardır ve aslında düşünülenden daha fazla servetim vardır. Kahyam ve ben kayıtları inceleme işine koyuluyoruz."

 agot_filler_north.0120.a:0 "Hadi para sayalım!"

 agot_filler_north.0121.t:0 "Karlı Gün: Oyun"

 agot_filler_north.0121.desc:0 "Düşünce aklımdan geçmemiş olsaydı bugün sıkıcı bir gün olurdu. Kahkahalarla boğuşarak mutfaktan bir hamur işi ve bir ejder biberi alıyorum. İkisini birleştirdikten sonra mutfağa geri koyuyorum. Casusluk şefime şakamı anlattığımda ikimiz de iyice gülüyoruz!"

 agot_filler_north.0121.a:0 "Umarım ondan ısıranı görürüm."

 agot_filler_north.0121.b:0 "Dur, hangi hamur işini kullanmıştım ben?"

 agot_filler_north.0122.t:0 "Karlı Gün: Oyun"

 agot_filler_north.0122.desc:0 "Öğle yemeği geldiğinde yemeğimden bir ısırık alıyorum — ve ağzım ateşe dönüyor. Şarap kadehimi bir dikişte bitirdikten sonra yediğim hamur işini inceliyorum. Ejder biberini fark ediyorum...\n\nBu, şakamın aleyhime dönmesi gibi bir tesadüf müydü? Yoksa bilinçli mi yapıldı? Bu zararsız bir şaka olsa da güvenliğimle ilgili ciddi sorular doğuruyor!"

 agot_filler_north.0122.a:0 "Ya zehir olsaydı?"

 agot_filler_north.0123.t:0 "Karlı Gün: Savaş Oyunları"

 agot_filler_north.0123.desc:0 "Mareşalim ve ben masaya haritalar seriyor, birlikleri temsil etmesi için piyonlar yerleştiriyoruz. Saatlerce stratejiler ve farklı savaş planları üzerinde çalışıyoruz. Sonunda iş, rakibi mareşalim olan bir tür savaş oyununa dönüşüyor."

 agot_filler_north.0123.a:0 "Savaş başlatalım!"

 agot_filler_north.0124.t:0 "Karlı Gün: Kütüphane"

 agot_filler_north.0124.desc:0 "Kitap seçimim talihsizdi. Satırları tekrar tekrar okuyorum ama anlamları bana kapalı. Bu üstat ne anlatıyorsa, böylesine sıkıcı bir kitapla kesin sır kalmasını dilemiştir!"

 agot_filler_north.0124.a:0 "Tanrılar kahretsin bu defteri!"

 agot_filler_north.0125.t:0 "Karlı Gün: Hazine"

 agot_filler_north.0125.desc:0 "Olacak şey değil! Defterleri tekrar tekrar gözden geçirip tutarı sayıyorum ama her seferinde aynı çıkıyor. Düşündüğümden daha fazla altınımız eksik!"

 agot_filler_north.0125.a:0 "Neyse ki yakaladım..."

 agot_filler_north.0126.t:0 "Karlı Gün: Savaş Oyunları"

 agot_filler_north.0126.desc:0 "Haritaya bakarken savaş zihnimde şekilleniyor. Yeni stratejiler ortaya çıkıyor; mareşalim taşlarını oynatırken ben de oynuyorum. Sonunda mareşalimi kuşatıyorum ve o da isteksizce yenilgiyi kabul ediyor!"

 agot_filler_north.0126.a:0 "İyi oynadın!"

 agot_filler_north.0127.t:0 "Karlı Gün: Savaş Oyunları"

 agot_filler_north.0127.desc:0 "Haritaya bakarken savaş zihnimde şekilleniyor. Yeni stratejiler ortaya çıkıyor; mareşalim taşlarını oynatırken ben de oynuyorum. Sonunda mareşalim beni kuşatıyor ve isteksizce yenilgiyi kabul ediyorum..."

 agot_filler_north.0127.a:0 "İyi oynadın..."

 agot_filler_north.0128.t:0 "Winterfell Mahzenleri"

 agot_filler_north.0128.desc:0 "Winterfell'de amaçsızca dolaşıyorum; tam o sırada karşımda eski bir demirağacı kapı beliriyor: labirent gibi mahzenlerin girişi. İçimden bir şey kapıyı açıp girmemi zorluyor. Yaşayanların dünyasından ölülerin yeraltı mezarlarına inerken her adım yeni bir ürpertiyle işaretleniyor.\n\nMahzenlerde yürürken karanlık koridorları labirent buluyorum. Soluk meşale ışığı pek az yol gösteriyor. Bir kavşağa vardığımda #bold sağ#! ya da #bold sol#! seçmeliyim."

 agot_filler_north.0128.a:0 "Sağa gideceğim, o yönde bir şey görüyorum galiba."

 agot_filler_north.0128.b:0 "Solda bir meşale var; gidilecek yol orası olmalı!"

 agot_filler_north.0128.c:0 "Belki de sadece geri dönmeliyim..."

 agot_filler_north.0129.t:0 "Ölülerden Dersler"

 agot_filler_north.0129.intro:0 "Koridorda ilerlemeye devam ederken kendimi taçlı bir kralın heykeliyle karşı karşıya buluyorum. Tahtının iki yanında taş ulukurtlar duruyor ve kucağında uzun zaman önce paslanmış bir kılıç var. Kenara kazınmış birkaç söz hafifçe aşınmış ama hâlâ okunabilir:\n\n"

 agot_filler_north.0129.jon:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele daha büyük bir saygıyla bakmadan edemiyorum. İşte doğudan akıncıları ve köle tacirlerini kovan ve Beyaz Liman'ın kadim öncülü Kurt İni'ni inşa eden kral. Bu adam korkunç bir savaşçı ve güçlü bir kraldı."

 agot_filler_north.0129.brandon:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele daha büyük bir saygıyla bakmadan edemiyorum. Bu, Sur'un Ötesindeki Kral Joramun ile birleşip Gece Kralı'na ve Ceset Gelinine son veren meşhur kraldı. İkisi birlikte, Gece Kralı'nın kesinlikle yol açacağı dehşetlere karşı insan diyarlarını savunurlardı."

 agot_filler_north.0129.theon:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele daha büyük bir saygıyla bakmadan edemiyorum. Aç Kurt, Kuzey'in dışında bile ünlüdür; Andalların gelişinden önce Kuzey'i birleştirmesi, ardından o istilacıları yenmesi ve hatta Essos'ta Andalos'a bile saldırmasıyla tanınır. Andal'dan Demirdoğumlulara, ondan da ötesine herkesle savaştı; o gerçek bir savaş lorduydu."

 agot_filler_north.0129.rodrik:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele daha büyük bir saygıyla bakmadan edemiyorum. Rodrik Stark bugün bile, özellikle Demirdoğumlularla herhangi bir sorun çıktığında şarkılarla anılır. Ayı Adası'nı kalamarlardan bir bilek güreşiyle kazandığı ve onu Mormont Hanesi'ne bağışladığı söylenir. "

 agot_filler_north.0129.a:0 "Buradaki tarih elle tutulur."

 agot_filler_north.0130.t:0 "Winterfell'de Bir Ejderha"

 agot_filler_north.0130.desc:0 "Açıkça yanlış yolu seçmişim, çünkü şimdi kendimi bu koridorlarda daha da kaybolmuş buluyorum. Meşaleler gelişigüzel yerleştirilmiş, beni giderek daha da derinlere çekiyor. #italic Her derin adım daha fazla ürperti getiriyor.#!\n\nDuvarlardan ve tavandan yayılan tuhaf bir sıcaklık hissediyorum, beni derinliklere doğru çekiyor. Bir köşeyi dönünce Winterfell'ün altındaki mahzenlerde bulmayı bekleyeceğim son şeyi görüyorum...\n\nKarşımda bir #bold ejderha yumurtası#!! Bir tür yuvaya yerleştirilmiş; açıkça bir amaç için burada bırakılmış ama bu amacın ne olabileceğini aklımın ucundan bile geçiremiyorum. "

 agot_filler_north.0130.a:0 "Elbette amacı burada kalmak."

 agot_filler_north.0130.b:0 "Sonuçta neden olmasın? Neden almayayım?"

 agot_filler_north.0131.t:0 "Yabanıl Baskınları"

 agot_filler_north.0131.desc:0 "Günlerdir küçük halk, kalemin içine sığınmak için kaleminin çevresindeki topraklardan kaçıyor — ve kötü haberler getiriyorlar: Topraklarımda görülen #N yabanıl#! sürüsü. Korkunç [wildling_raider.GetFullNameNicknamed] komutasında, halkımı ayrım gözetmeksizin katlediyor ve topraklarımı yerle bir ediyorlar!\n\nHalkımı kurtarmak, topraklarıma huzuru geri getirmek ve bu yabanıl süprüntülerini adalete teslim etmek için bu yabanılları bir an önce durduracak bir eylem planı yapmalıyım."

 agot_filler_north.0131.a:0 "Bu yabanıl süprüntülerini kendim avlayacağım!"

 agot_filler_north.0131.a_tt:0 "Yabanılları bizzat avlıyorsun, birkaç askerinle birlikte."

 agot_filler_north.0131.b:0 "[marshal.GetFirstName|U], senin bu işi halletmeni istiyorum."

 agot_filler_north.0131.b_tt:0 "Yabanılları yenmeleri için [marshal.GetCouncilTitle]'nize bazı askerler almasını emrediyorsun. "

 agot_filler_north.0131.c:0 "Yapılacak bir şey yok."

 agot_filler_north.0131.c_tt:0 "Duvarlarının ardına sinip yabanılların topraklarını serbestçe yağmalamasına izin veriyorsun."

 agot_filler_north.0131_success.mt:0 "Yabanılları başarıyla yeniyorsun"

 agot_filler_north.0131_success_m.mt:0 "[marshal.GetFirstNameNoTooltip] yabanılları başarıyla yendi"

 agot_filler_north.0131_failure.mt:0 "Yabanıllar tarafından yenildin"

 agot_filler_north.0131_failure_m.mt:0 "[marshal.GetFirstNameNoTooltip] yabanıllar tarafından yenildi"

 agot_filler_north.0132.t:0 "$agot_filler_north.0131.t$: Zafer"

 agot_filler_north.0132.desc:0 "Şiddetli bir savaşın ardından adamlarım zaferle çıktı. Yabanıl lideri [wildling_raider.GetFirstName] yenilgiyle önümde diz çöküyor; [wildling_raider.GetSheHe] bu dünyada fazla kalmayacağını biliyor.\n\n[wildling_raider.GetSheHe]'nin topraklarıma saldığı dehşet cezasız kalmamalı; toparlanmamız yıllarımızı alacak. Katledilen halkımın intikamı ve topraklarıma verdikleri zarar için adil bir ceza vermeliyim!\n\nBelki de gelecekteki yabanıl gruplarının topraklarıma göz dikmemesi için bu yabanıl süprüntüsünden ibretlik bir örnek çıkarmalıyım..."

 agot_filler_north.0132.a:0 "[wildling_raider.GetHerHis] kafası uçsun!"

 agot_filler_north.0132.a_tt:0 "Yabanıl akıncısını idam ediyorsun."

 agot_filler_north.0132.b:0 "Lideri zindanlarıma atın."

 agot_filler_north.0132.b_tt:0 "[wildling_raider.GetFirstNameNoTooltip]'i, [wildling_raider.GetHerHim] hakkında ne yapacağına karar verene kadar zindanına atıyorsun."

 agot_filler_north.0132.c:0 "Gitmene izin vereceğim, bir daha geri dönmemeye söz verirsen."

 agot_filler_north.0132.c_tt:0 "Yabanılı, diğer yabanıllara bir uyarıyla Sur'un ötesine dönmeyi vaat ederse serbest bırakıyorsun.\n\n#help Yabanıllar en az 20 yıl boyunca topraklarına baskın yapmayacak.#!"

 agot_filler_north.0133.t:0 "$agot_filler_north.0131.t$: Yenilgi"

 agot_filler_north.0133.desc:0 "Şiddetli bir savaşın ardından adamlarım ve ben yenildik. [wildling_raider.GetFirstName]'in önünde diz çöküyorum, bu dünyada fazla kalmayacağımı biliyorum.\n\nOnları durduramadım ve topraklarıma saldıkları dehşet sürecek. [wildling_raider.GetFirstNameNoTooltip|U] son sözlerim var mı diye soruyor. Son sözlerim: "Lanet olsun sana, yabanıl süprüntüsü!"\n\n[wildling_raider.GetFirstNameNoTooltip] baltasını kaldırıyor ve ben, hayal kırıklığına uğrattığım herkesi düşünerek gözlerimi kapatıyorum."

 agot_filler_north.0133.a:0 "Üzgünüm..."

 agot_filler_north.0133.a_tt:0 "[wildling_raider.GetFirstNameNoTooltip] seni idam ediyor."

 agot_filler_north.0134.t:0 "$agot_filler_north.0131.t$: Yenilgi"

 agot_filler_north.0134.desc:0 "Bir haberci bana, yabanıllarla yapılan bir savaşın ardından [marshal.GetCouncilTitle] [marshal.GetTitledFirstName]'nin yenilip idam edildiğini bildiriyor. Yabanıllar zaferle çıktı ve topraklarımı yağmalamaya devam etmekte özgürler; şimdilik onları durdurmak için elimden bir şey gelmiyor.\n\n#italic Böyle bir sonucu hak etmek için ne yaptım ben?!#!"

 agot_filler_north.0134.a:0 "Felaket bir sonuç!"

 agot_filler_north.0135.t:0 "$agot_filler_north.0131.t$: Yenilgi"

 agot_filler_north.0135.desc:0 "Yabanıllara karşı yapılan şiddetli bir savaşın ardından ordum yenildi. Savaş tamamen kaybedilmeden önce, çarpışmada yaralandıktan sonra araya giren kişisel muhafızımın çabaları sayesinde kaçmayı başardım.\n\nAskerlerimi boş yere katliama gönderdim; yabanıllar hiç şüphesiz topraklarımı yağmalamaya devam edecek ve artık onları durdurmak için elimden hiçbir şey gelmiyor.\n\n#italic Lanet olsun sana, [wildling_raider.GetFirstNameNoTooltip]!#"

 agot_filler_north.0135.a:0 "Hayatta kaldığım için şanslıyım."

 agot_filler_north.0135.a_tt:0 "Yenildin ama kaçmayı başardın."

 agot_filler_north.0136.t:0 "$agot_filler_north.0131.t$: Yenilgi"

 agot_filler_north.0136.desc:0 "Bir haberci bana, yabanıllarla yapılan bir savaşın ardından [marshal.GetCouncilTitle] [marshal.GetTitledFirstName]'nin yabanıllar tarafından yenildiğini bildiriyor! [marshal.GetSheHe]'nin kaçmayı başardığını ve yaralı halde kaleye döndüğünü söylüyorlar. Yabanıllar zaferle çıktı ve topraklarımı yağmalamaya devam etmekte özgürler; şimdilik onları durdurmak için elimden bir şey gelmiyor.\n\n#italic Böyle bir sonucu hak etmek için ne yaptım ben?!#"

 agot_filler_north.0136.a:0 "[marshal.GetFirstNameNoTooltip|U] hayatta kaldığı için şanslı."

 agot_filler_north.0136.a_tt:0 "[marshal.GetFirstNameNoTooltip|U] yenildi ama kaçmayı başardı."

 agot_filler_north.0150.t:0 "Winterfell'de Bir Ejderha"

 agot_filler_north.0150.desc:0 "[jon_snow.GetFirstName] yaklaşıyor, [jon_snow.GetHerHis] pelerini toz toprak içinde, kollarında sıkıca sarılı bir şey var. "Mahzenlerde oynuyorduk, Baba," diyor [jon_snow.GetSheHe], [jon_snow.GetHerHis] sesi tedirgin bir özürle dolu. "Özür dilerim, yapmamamız gerektiğini biliyorum. Yanlış bir dönemece girdim ve kayboldum. Sonra buldum..."\n\n[jon_snow.GetSheHe|U] bezi açıyor. İlk başta cilalı taş sandım ama sonra pullar ateş ışığına yakalanıp mavi ve kırmızı girdaplarla parlıyor. Bir ejderha yumurtası. #italic (Ejderha için [jon_snow.Custom('GetPrincessPrince')|l], Lyanna kafamın içinde fısıldıyor.)#!\n\n[jon_snow.GetFirstNameNoTooltip] hayranlıkla ona bakıyor, [jon_snow.GetHerHis] parmakları nazikçe üzerinde geziyor. "Tuhaf," diyor [jon_snow.GetSheHe] yumuşakça, "bir an... sıcak hissettim.""

 agot_filler_north.0150.a:0 "Ejderha yumurtası oyuncak değildir."

 agot_filler_north.0150.b:0 "Onu buldun; sende kalabilir."
