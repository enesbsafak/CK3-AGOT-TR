l_english:

 agot_filler_crannog.0001.t:0 "Boyun'da Mahsur Kalmış Yabancı"

 agot_filler_crannog.0001.desc:0 ""İmdat, yardım edin," diye haykıran bir ses.\n\nKalın asmaların ve ağaçların arasından baktığımda, bir diken, çalı ve dal yığınına yakalanmış bir güneyliyi seçebiliyorum. Kesesinin ağzı ayaklarının dibinde yırtılmış, teni bir dizi sıyrık ve morlukla kaplı. Onu bir süre izliyorum ve ana yoldan sapmış olması gerektiğini anlıyorum. Belki Boyun'un vahşi doğasından kestirme geçebileceğini sanmıştır.\n\nBağırmaya devam ediyor, her yalvarışı bir öncekinden daha çaresiz ve daha çılgınca. Yoluma devam etmeliyim, ama onu burada bağırarak bırakmak zalimlik olur... Sadece ona değil, diğer crannoglulara ve hatta bataklığın kendisine..."

 agot_filler_crannog.0001.a:0 "Bu bölge için bir baş belası; onu buradan çıkarmalıyım."

 agot_filler_crannog.0001.b:0 "Bırak onu. Boyun kendi sorunlarıyla kendi başına ilgilensin."

 agot_filler_crannog.0001.c:0 "Ona yardım et ve yolu kendin göster."

 agot_filler_crannog.0001.d:0 "Bu bölgedeki kertenkele-aslanların beslenmesi gerekiyor..."

 agot_filler_crannog.0002.t:0 "Boyun'da Mahsur Kalmış Yabancı"

 agot_filler_crannog.0002.desc:0 "Ağaçların arasından çıkarken varlığımı bildiriyorum. Güneyli tamamen afallamış, hatta korkmuş durumda. Muhtemelen hayatında ilk kez bir crannoglu görüyor.\n"Sen onların İkizler'de bahsettiği bataklık adamlarından birisin, değil mi?" diye mızıldanıyor, sırtımdaki kurbağa zıpkınına bakarak. Kemerimden bir bıçak çıkarıp takıldığı dalları kesiyorum. Kesesini alıp ona veriyorum. Kral Yolu'na dönmek için beni yakından takip etmesi gerektiğini söylüyorum.\n\nBir süre sessizce yürüyoruz, ta ki az kullanılan bir patikaya varana dek. Onu işaret edip doğruca Kral Yolu'na gideceğini söylüyorum. Tek yapması gereken dosdoğru takip etmek. Yoldan saparsa başına bela açılacağı konusunda onu uyarıyorum ve cevap vermesine fırsat vermeden oradan ayrılıyorum."

 agot_filler_crannog.0002.a:0 "Defolup gitti işte."

 agot_filler_crannog.0003.t:0 "Boyun'da Mahsur Kalmış Yabancı"

 agot_filler_crannog.0003.desc:0 "Ağaçların arasından çıkarken varlığımı bildirmek için bağırıyorum. Yaklaşırken dostça bir el sallayıp gülümsüyorum ve ona olabildiğince açık bir şekilde onu güvenliğe götüreceğimi söylüyorum. Hâlâ gergin; açıkça daha önce hiç crannoglu görmemiş, ama bu çıkmazdan kurtulmasına yardım edeceğim konusunda bana güveniyor gibi.\n\nEtrafındaki dalları kestikten sonra ona biraz tuzlu et ve temiz suyumdan veriyorum. Çok geçmeden yalnızca beni takip etmekle kalmıyor, neşeyle sohbet bile ediyor. Onun, ailesinin ve tüccar olarak rolünün hakkında çok şey öğreniyorum. Görünüşe göre hayatı boyunca Westeros'u boydan boya dolaşmış, ama daha önce hiç Kuzey'e gelmemiş.\n\nBirkaç saat daha yol aldıktan sonra çürümüş bir patikaya varıyoruz. Ona yollarımızın burada ayrıldığını söylüyorum; bu patika Kral Yolu'na geri dönüyor. Elimle tokalaşıyor ve Yedili'nin iyiliğimin karşılığını vereceğini söylüyor. Ona veda ediyorum..."

 agot_filler_crannog.0003.a:0 "İhtiyacı olanlara yardım etmek ödüllendirici."

 agot_filler_crannog.0004.t:0 "Boyun'da Mahsur Kalmış Yabancı"

 agot_filler_crannog.0004.desc:0 "Güneyli bağırmaya devam ederken, sesindeki korku ve paniği takdir ederek kıkırdıyorum. Yakındaki bir su birikintisine yürüyüp tam da aradığımı buluyorum... #bold birkaç iri kertenkele-aslan#!.\n\nAğaçların arasından çıkıp güneyliye yardım edeceğimi söylüyorum. Dalları ve dikenleri kesiyor, kolunu sıkıca tutup onu yola geri götüreceğime dair güvence veriyorum. Benim bir bataklık şeytanı olduğum falan gibi şeyler mırıldanıyor; ben sadece başımı sallayıp gülümsüyorum.\n\nOnu su birikintisine sürüklüyorum; neler olduğunu anladığında #italic sertçe#! onu içine itiyorum. Geri çekilip aç kertenkele-aslanların suya dalmasını ve onu parçalamaya başlamasını izliyorum. Bu eğlenceli bir saat olacak."

 agot_filler_crannog.0004.a:0 "Yerel yaban hayatına yardım etmek ödüllendirici."

 agot_filler_crannog.0006.t:0 "Bataklık Cesedi Bulundu"

 agot_filler_crannog.0006.desc:0 "Diyarın savaşları beni ve ordumu Boyun'a getirdi. Yeşil bir cehennem, evet, ama yine de kendimizi burada buluyoruz.\n\nBugün bir turba bataklığında kamp kurduk. Kampta yürürken, birkaç askerin yerdeki bir deliğin etrafında toplandığını görüyorum. Kalabalığı yarıp ilerliyorum ve ciddi şekilde tabaklanmış bir cesedin başında durduklarını görüyorum. Kadim, görkemli kıyafetler giymiş. Kızıl saçları bakımsız ama alnındaki yedi köşeli yıldız dövmesi görünecek şekilde ayrılmış. Asıldığı ip hâlâ boynunda.\n\nYerel rehberimiz yanımıza geliyor ve cesedi görünce şaşırmıyor. Bazen Boyun'un bataklıklarının eski çağlardan kalma cesetleri koruyabildiğini söylüyor. Delikteki cesedi işaret ederek, binlerce yıl önce Boyun'u fethetmeye çalışırken öldürülen bir Andal savaş lordu olduğunu anlatıyor. Etrafımızdaki adamlardan bazıları kahkahalarla gülüyor, rehberimizin şaka yaptığını sanıyor, ama o son derece ciddi..."

 agot_filler_crannog.0006.a:0 "İlginç olsa da, ceset cesettir. Göm ve bırak."

 agot_filler_crannog.0006.b:0 "Umarım bu bataklıkta sonsuza dek gömülü kalmam."

 agot_filler_crannog.0006.c:0 "O, Boyun'u işgal edenlerin başına neler geldiğinin bir örneği!"

 agot_filler_crannog.0006.d:0 "Büyük Septon'a gönder, ona layık bir cenaze borçluyuz."

 agot_filler_crannog.0007.opening:0 "Yedili'nin Kahramanları"

 agot_filler_crannog.0007.desc:0 "Bilge [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltipRegnal], Boyun'da seferdeyken bulduğun cesedi teslim aldım. Bu dindar savaşçıyı bulman beni son derece memnun etti. Sonunda, binlerce yıl sonra, Yedili'nin bu efsanevi kahramanı bataklık şeytanlarının diyarından uzakta, evine döndü. Yaptıkların unutulmayacak."

 agot_filler_crannog.0007.a:0 "Bu takdir için minnettarım."

 agot_filler_crannog.0008.t:0 "Yolu Kapatan Kertenkele-Aslan"

 agot_filler_crannog.0008.desc:0 "Adamlarım ve ben Boyun'daki binlerce bataklıktan birinde yorgun adımlarla ilerlerken, bitkin bir halde sık bir çalılığa giriyoruz. Etrafımızda devrilmiş kütükler, kocaman ağaçlar, dolanık asmalar ve insanları cüceleştiren eğrelti otları var. Karşı tarafı göremiyoruz.\n\nPatikada yavaşça ilerlerken öndeki adamlardan biri bağırıyor: #bold #N "KERTENKELE-ASLAN!"#!#! Suyun içinde ilerleyip kendimi öne atıyorum ve maiyetimden bazılarını gözüne kestiren #italic devasa#! pullu bir canavar görüyorum. Canavar en az altı adam bir araya gelmiş kadar büyük. Beni rahatça bütün halinde yutabilir ve arkamdaki iki adama da yer kalır...\n\nMaiyetimin yolunu kesiyor... adamlarım ne yapmamız gerektiğini soruyor."

 agot_filler_crannog.0008.a:0 "Onu öldürmek zorundayız. Hatta etini satabiliriz bile."

 agot_filler_crannog_.0008.a.flavor:0 "Sen ve adamların canavara saldıracaksınız."

 agot_filler_crannog.0008.b:0 "Yolun dışına çıkma riskini almak zorundayız."

 agot_filler_crannog_.0008.b.flavor:0 "Sen ve adamların bataklık çalılıklarına dağılacaksınız."

 agot_filler_crannog.0009.t:0 "Saldır!"

 agot_filler_crannog.0009.desc:0 "Devasa bir yaratığa saldırmaya çalışmak çok zor olacak, özellikle de kendi evinde olduğumuzda. Yine de kılıcımı çekip yoldaşlarıma hazırlanmalarını söylüyorum.\n\nAdamlarımdan birine dikkatini çekmesi için yaratığa taş atması için işaret ediyorum; işaretimi bekleyerek kenarda duruyor. Diğer adamlarım sessizce bana başlarını sallıyor, kılıçları ellerinde sıkıca..."

 agot_filler_crannog.0009.a:0 "Öldür onu!"

 agot_filler_crannog.0009.a.tt_success:0 "Kertenkele-aslanı katledip cesedini geri alıyorsun."

 agot_filler_crannog.0009.a.tt_failure_mauled:0 "Kertenkele-aslan saldırıyor, vahşi doğaya kaçmadan önce seni ciddi şekilde parçalıyor."

 agot_filler_crannog.0009.a.tt_failure_death:0 "Kertenkele-aslan seni öldürüyor."

 agot_filler_crannog.0009.b:0 "Bir düşününce, yol dışına çıkma riskini almalıyız."

 agot_filler_crannog.0010.t:0 "Bataklığın İçine!"

 agot_filler_crannog.0010.desc:0 "Adamlarıma çalılığa dağılmalarını söylüyorum. Koca bir canavarla kendi ortamında savaşma riskini göze almak istemiyorum. Çalılığın içinden geçip önde buluşacağız.\n\nAdamlarımın uğursuz bataklıkta gözden kayboluşunu, ağaçların ve asmaların ardında silinişini izliyorum, sonra peşlerinden ben de dalıyorum... Bu karmaşanın içinden geçmenin vakti geldi."

 agot_filler_crannog.0010.a:0 "Yola çıkıyorum!"

 agot_filler_crannog.0010.a.tt_success_title:0 "Yol değişikliğinden bir aksilik olmadan sağ çıkıyorsun."

 agot_filler_crannog.0010.a.tt_success:0 "Kertenkele-aslanın #P güvenle#! çevresinden dolaşmayı başarıyorsun ve iki saat sonra yolda buluşuyorsun."

 agot_filler_crannog.0010.a.tt_failure_scratched_up_but_safe_title:0 "Tırmıklanıyorsun ama yol değişikliğinden sağ çıkıyorsun."

 agot_filler_crannog.0010.a.tt_failure_scratched_up_but_safe:0 "#P Kertenkele-aslandan yan çizerek kurtulmayı#! başarıyorsun ve yolda buluşuyorsun - ama bu sırada #N fena halde tırmıklandın#!"

 agot_filler_crannog.0010.a.tt_failure_death_title:0 "Ölüyorsun!"

 agot_filler_crannog.0010.a.tt_failure_death:0 "Çalılıkta saklanan #italic başka bir#! ölümcül yaratığa #N kurban gidiyorsun#!"

 agot_filler_crannog.0011.t:0 "Kertenkele-Aslan Tarafından Öldürülen Küçük Kız"

 agot_filler_crannog.0011.desc:0 "[crannogfiller_location0011.GetName]'in dış mahallelerinde güçlü bir crannoglu tüccarının kızı bir kertenkele-aslan tarafından öldürüldü. Kızın ölümü, [crannogfiller_location0011.GetName]'deki dış ve kırsal köylere gösterdiğim görünürdeki ilgisizliğime bağlanıyor. Çoğu kişi, başkentimin hemen dışında canavarların başıboş dolaşmasına izin verdiğimi iddia ediyor...\n\nHikâye yangın gibi diyarıma yayıldı ve danışmanlarım bir şeyler yapmam için beni sıkıştırıyor."

 agot_filler_crannog.0011.a:0 "Boyun'un gerçek hükümdarları kertenkele-aslanlardır, insan değil. Daha dikkatli ol."

 agot_filler_crannog.0011.b:0 "Bu tüccar, trajediyi bana iftira atmak için kullanıyor. Tutuklayın onu!"

 agot_filler_crannog.0011.c:0 "Tüccarın kaybını telafi edeceğim."

 agot_filler_crannog.0011.d:0 "Canavarların her yerde başıboş dolaşmasına İZİN VERMEM!"

 agot_filler_crannog.0012.t:0 "Albino Kurbağa!"

 agot_filler_crannog.0012.desc:0 "Bugün #italic ne#! güzel bir gün! Birkaç saati kendime ayırıp rahat bir bataklıkta dolaşmaya, doğanın tadını çıkarmaya ve kalelerden ve insanlardan uzakta ham vahşi doğanın keyfini sürmeye karar verdim.\n\nAylak aylak yürürken gözümün kenarında zıplayan beyaz bir yaratık seçiyorum. Yavaşça dönüyorum ve dev bir albino boğa kurbağasının bana bakarak durduğunu görüyorum. Çömelip yaklaşıyorum ve ihtişamını süzüyorum... sonuçta böyle bir albino yaratık burada uzun yaşamaz."

 agot_filler_crannog.0012.a:0 "Sev onu."

 agot_filler_crannog.0012.b:0 "Tekmele. #S Sertçe.#!"

 agot_filler_crannog.0013.t:0 "Özel Tarif!"

 agot_filler_crannog.0013.desc:0 "Bir tüccar yanıma yaklaştı ve kadim bir crannoglu zehri yapmak için eşsiz bir tarif teklif etti. Görünüşe göre tarif yalnızca Boyun'da bulunan bir dizi bitki ve ottan hazırlanabiliyor."

 agot_filler_crannog.0013.a:0 "Alıyorum."

 agot_filler_crannog.0013.b:0 "Böyle şeylere ihtiyacım yok!"

 agot_filler_crannog_artifact.0013.name:0 "Crannoglu Zehir Tarifi"

 agot_filler_crannog_artifact.0013.desc:0 "Bu tarif, Crannog'daki bazı bitkilerden ölümcül ve katil bir zehir elde eder. Entrika ajanları için son derece kullanışlıdır."

 agot_filler_crannog_artifact.0014.name:0 "Crannoglu Mızrağı"

 agot_filler_crannog_artifact.0014.desc:0 "Bir zamanlar bir crannoglu savaşçısının kullandığı eski bir mızrak."

 agot_filler_crannog.0014.t:0 "Eski Bir Mızrak"

 agot_filler_crannog.0014.desc:0 "#bold AH! #! Çamurlu ve yosunlu bir zemin parçasında yürürken ayağım katı ve #italic sert#! bir şeye çarpıyor. Görünüşe göre çamurun altına bir şey gömülü...\n\nBir sopa kapıp toprağı kazmaya başlıyorum, gizli nesnenin ne olduğunu görmek için sabırsızlanıyorum. Biraz uğraştan sonra çürümüş bir mızrak sapı çıkarıyorum! Mızrak ucu hâlâ takılı ve sağlam, ama mızrağın kadim, kör ve kullanışsız olduğu aşikâr. Mızrağa yakından bakınca, yıllar önce bir crannoglu savaşçısına ait olduğu anlaşılıyor. Saklamanın pratik bir faydası yok; sonuçta kullanılamayacak kadar eski. Ama kadim bir eseri saklamak birçok kişinin beni kıskanmasını sağlar..."

 agot_filler_crannog.0014.a:0 "Sakla onu."

 agot_filler_crannog.0014.b:0 "Çamura geri fırlat."

 agot_filler_crannog.0030.t:0 "Kurbağa Zıpkıncılığı!"

 agot_filler_crannog.0030.desc:0 "Vasim [guardian_parent_frog_gigging_event.GetNameNoTooltip], beni kurbağa zıpkıncılığına götürmeyi teklif etti! Geceyi Boyun'un derin bataklıklarında kurbağa avlayarak geçireceğiz — halkımızın kadim bir geleneği."

 agot_filler_crannog.0030.a:0 "Evet, gitmeyi çok isterim!"

 agot_filler_crannog.0030.b:0 "Hayır, gitmek istemiyorum."

 agot_filler_crannog.0031.t:0 "Av!"

 agot_filler_crannog.0031.desc:0 "Gece çöküyor, bu yüzden [guardian_parent_frog_gigging_event.GetNameNoTooltip] ve ben kaleden ayrılıyoruz. Doğruca bataklığa yöneliyoruz!\n\n[guardian_parent_frog_gigging_event.GetHerHim]'e sıkıca tutunarak yapışkan sularda yürüyoruz, adım adım takip ediyoruz. Sonunda, etrafında bataklık yaratıklarının hareketleriyle vızıldayan uzun çimenlerle çevrili çamurlu bir tarlaya varıyoruz.\n\n[guardian_parent_frog_gigging_event.GetNameNoTooltip] bana bir kurbağa zıpkını veriyor ve ilk birkaç denemede onları izlememi söylüyor. [guardian_parent_frog_gigging_event.GetSheHe] zahmetsizce birbiri ardına kurbağa zıpkınlarken hayranlıkla izliyorum. Her öldürüşte, [guardian_parent_frog_gigging_event.GetSheHe] avını bırakabilsin diye hevesle bir çuval açıyorum.\n\n[guardian_parent_frog_gigging_event.GetNameNoTooltip] bana dönüp uzun çimenlerdeki şişman bir kurbağayı işaret ediyor. [guardian_parent_frog_gigging_event.GetSheHe] bana fırsatı kollamamı söylüyor!"

 agot_filler_crannog.0031.a:0 "Nişan al....!"

 agot_filler_crannog.0031.a.tt_success:0 "#V Kurbağayı#! #P başarıyla#! zıpkınlıyorsun"

 agot_filler_crannog.0031.a.tt_failure_missed:0 "#V Kurbağayı#! #N tamamen ıskalıyorsun#!"

 agot_filler_crannog.0031.a.tt_failure_frog_escape:0 "#V Kurbağa#! #N saldırından kıl payı kurtulup#! #V kaçıyor#!"

 agot_ambush_events.1001.title:0 "O ses de neydi?"

 agot_ambush_events.1001.desc:0 "Adamlarım ve ben Boyun'daki binlerce bataklıktan birinde yorgun adımlarla ilerlerken, bitkin bir halde sık bir çalılığa giriyoruz. Etrafımızda devrilmiş kütükler, kocaman ağaçlar, dolanık asmalar ve insanları cüceleştiren eğrelti otları var. Karşı tarafı göremiyoruz.\n\nPatikada yavaşça ilerlerken öndeki adamlardan biri geriye doğru bağırıyor: "Sanırım biri burada!" Suyun içinde ilerlemeye devam ediyorum, ama önümdeki adamların yere düştüğünü görüyorum — gövdelerine oklar saplanmış!\n\nKalan adamlarımı çevremde savunma mevzilerine çağırıyorum; ormanın içinden bir Crannoglu ordusu gibi görünen şey yaklaşıyor..."

 agot_ambush_events.1001.attack:0 "Kahretsin!"

 agot_ambush_events.1002.title:0 "Sur"

 agot_ambush_events.1002.desc:0 "Duvar, göz alabildiğine uzanarak yüksek ve heybetli bir şekilde yükseliyor. Azameti ve ölçeği ezici; savunmasını aşabilecek hiçbir güç hayal etmek zor. Rüzgârlar çevrende esiyor, ormanın seslerini ve donmuş denizin uzak kükremesini taşıyor. Sen ve kabilen Duvar'a bakarken, Duvar'ın tepesinde ötesindeki toprakları gözleyen Gece Nöbeti'nin silik figürlerini görebiliyorsun. Varlığını burada hoş karşılamayacaklarını ve çatışmanın kaçınılmaz olabileceğini biliyorsun."

 agot_ambush_events.1002.attack:0 "Duvar'ı alacağız!"

 agot_ambush_events.1002.leave:0 "Gideceğiz."
