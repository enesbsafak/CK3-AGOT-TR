l_english:

 agot_historical_inspiration.0001.t:0 "Fatihin Mirası"

 agot_historical_inspiration.0001.opening:0 "Diyarın dört bir yanından gelen son mektupları okurken, zihnim diyarın kökenlerine uzanıyor. Yedi Krallık'ın fethi, tek bir insan ömründe gerçekleştirilmiş en büyük başarılardan biri olmayı sürdürüyor. [GetScriptedCharacterByHistoryID('Targaryen_27').GetFirstNamePossessive] Fetih'inin diyarımız üzerindeki etkisini düşünmeden edemiyorum. [GetScriptedCharacterByHistoryID('Targaryen_27').GetHouse.GetName] hanedanının mirası inkâr edilemez ve temelleri, o tek adamın işlerinden çizildi.\n\n"

 agot_historical_inspiration.0001.nontarg:0 "İçimdeki bir yan, Targaryen yönetiminin getirdiği faydaları kabul ediyor. İstikrar, merkezî güç ve ejderhaların koruması hafife alınacak şeyler değil. Yine de, Aegon Ejder Kayası'ndan geçmemiş olsaydı ne olurdu diye de merak ediyorum. Westeros bugün hâlâ bölünmüş olur muydu? Bu kilitlenmeyi bir Westeroslu bozar mıydı? Barış, kan ve ateş olmadan sağlanabilir miydi?\n\nFetih'in mirası yüzyıllar boyunca tartışılacak; ama ondan neyi çıkarıp alacağıma karar verecek olan benim."

 agot_historical_inspiration.0001.targ:0 "Herkes, getirdiğimiz faydaları kabul etmeli. İstikrar, merkezî güç ve ejderhaların koruması hafife alınacak şeyler değil. Yine de içimdeki bir yan, Aegon Ejder Kayası'ndan geçmemiş olsaydı ne olurdu diye de merak ediyor. Westeros bugün hâlâ bölünmüş olur muydu? Bu kilitlenmeyi bir Westeroslu bozar mıydı? Barış, bu kadar zorluk olmadan sağlanabilir miydi?\n\nFetih'in mirası yüzyıllar boyunca tartışılacak; ama ondan neyi çıkarıp alacağıma karar verecek olan benim."

 agot_historical_inspiration.0001.a:0 "Yüksek Valyria dili hakkında daha çok şey öğrenmeliyim."

 agot_historical_inspiration.0001.b:0 "Aegon'un yaptığı gibi dünyayı değiştirmek için çok çalışmalıyım."

 agot_historical_inspiration.0001.b.a:0 "Çalışkan oluyorsun!"

 agot_historical_inspiration.0001.b.b:0 "Kendini değiştirmek gerçekten zor!"

 agot_historical_inspiration.0001.c:0 "Kaybolanlar için küçük bir türbe yaptıracağım."

 agot_historical_inspiration.0001.d:0 "Bu kadar çok şey başaranlara hayranlık duymak güzeldir."

 agot_historical_inspiration.0001.e:0 "Böyle bir temel, diyardaki herkesi onurlandırıyor."

 agot_historical_inspiration.0001.e.targ:0 "Aegon'un işleri tüm Targaryen'leri yüceltiyor!"

 agot_historical_inspiration.0002.t:0 "Kurnazlığın Yansımaları"

 agot_historical_inspiration.0002.desc.lannister:0 "Avluya adım atıyorum ve parlak güneşe karşı yüzümü korumak için elimi kaldırıyorum. Rüzgârda dalgalanan bir Lannister sancağının gölgesi gözlerimi kısaca kapatıyor ve aklıma bir düşünce geliyor. [GetScriptedCharacterByHistoryID('Lannister_29').GetFirstNameNicknamed]. [house|E]'imin efsanevi soyu. Casterly Kayası'ndaki Casterly'leri gerçekten de bir aslan sürüsüne yedirip bize alametimizi mi kazandırdı? Hikâyenin pek çok anlatımı var. Casterly'leri birbirini öldürmeye mi ikna etti? Gece yarısı kadınlarının hepsiyle mi yattı? Onları farelerle mi sürüp çıkardı?\n\nÜstatlar bunların hepsini tartışıp onun bir efsane ve söylence figüründen başka bir şey olmadığını söylese de, bebekliğimden beri onun soyundan geldiğim söylenen bir efsane o."

 agot_historical_inspiration.0002.desc.poet:0 "Tüy kalemimin altındaki boş parşömene bakıyorum. Şiir bana genellikle kolay gelir; ama bugün sözcükleri bir araya getiremiyorum. Geriye yaslanıp tavana bakıyorum ve geçmişin ozanlarının zekâlarını nasıl ustalığa dönüştürdüğünü merak ediyorum.\n\nZihnim, [GetScriptedCharacterByHistoryID('Lannister_29').GetFirstNameNicknamed]'in resmini canlandırıyor. Üstatlar onun varlığını tartışıp onun bir efsane ve söylence figüründen başka bir şey olmadığını söylese de, zekâsına hükmetmiş bir adam olmalıydı. Şair olarak bilinmese de, Casterly'leri diyarın en büyük makamlarından birinden kandırmak, Westeros'ta işlenmiş en kurnazca işlerden biri olmalı. Böyle bir hikâyeden ne öğrenebilirim?"

 agot_historical_inspiration.0002.desc.bastard:0 "Ayrılan küçük soylulara elveda diyorum ve gözlerindeki kısık bakışı fark ediyorum. Piç. Biliyorum, düşündükleri bu. Küçük lordların en küçükleri olsalar da, kanımdaki leke onları bana kendilerinden aşağı biri gibi baktırıyor. En karanlık anlarımda onlara bile inanabilirim...\n\nBu rahatsız edici düşünce, yatağıma uzanıp gözlerimi karanlık tavana diktiğimde bile beni bırakmıyor. Ama karanlığın içinde rahatlatıcı bir düşünce beliriyor. Piçler daha önce de büyüklüğe ulaştı. Lannister Hanedanı'nın efsanevi kurucusu [GetScriptedCharacterByHistoryID('Lannister_29').GetFirstNameNicknamed]'in, hikâyenin bazı anlatımlarında bir piç olduğu söylenir. Meşru kanlı ya da değil, hangi küçük lord böyle bir işe imza atabilir? Bu düşünce yarışan zihnimi sakinleştiriyor ve uyku beni almadan önce, bunu yarın hatırlamaya karar veriyorum."

 agot_historical_inspiration.0002.desc.bastard_legitimized:0 "Ayrılan küçük soylulara elveda diyorum ve gözlerindeki kısık bakışı fark ediyorum. Piç. Biliyorum, düşündükleri bu. Görünüşte temize çıkarılmış olsa da, doğumumun koşulları beni hâlâ lekeliyor; ne kadar küçük lordlar olsalar da, bu leke onları bana kendilerinden aşağı biri gibi baktırıyor. En karanlık anlarımda en kötüsüne bile inanabilirim...\n\nBu rahatsız edici düşünce, yatağıma uzanıp gözlerimi karanlık tavana diktiğimde bile beni bırakmıyor. Ama karanlığın içinde rahatlatıcı bir düşünce beliriyor. Piçler daha önce de büyüklüğe ulaştı. Lannister Hanedanı'nın efsanevi kurucusu [GetScriptedCharacterByHistoryID('Lannister_29').GetFirstNameNicknamed]'in, hikâyenin bazı anlatımlarında bir piç olduğu söylenir. Meşru kanlı ya da değil, hangi küçük lord böyle bir işe imza atabilir? Bu düşünce yarışan zihnimi sakinleştiriyor ve uyku beni almadan önce, bunu yarın hatırlamaya karar veriyorum."

 agot_historical_inspiration.0002.a:0 "Onun yaptığı gibi dilimi ustaca kullanmayı öğrenmeliyim."

 agot_historical_inspiration.0002.a.a:0 "Yolumu sözlerle buluyorum!"

 agot_historical_inspiration.0002.a.b:0 "Ah! Bu çok zor"

 agot_historical_inspiration.0002.b:0 "Böyle bir kurnazlık ilham verici!"

 agot_historical_inspiration.0002.b.a:0 "Yolumu gölgelerde buluyorum!"

 agot_historical_inspiration.0002.b.b:0 "Ah! Bu çok zor"

 agot_historical_inspiration.0002.c:0 "Bu düşünce şiirime ilham olacak!"

 agot_historical_inspiration.0002.d:0 "Bu lekeyi tıpkı onun yaptığı gibi çalışarak silerim!"

 agot_historical_inspiration.0002.e:0 "Kuruluşumuz için ne hikâye!"

 agot_historical_inspiration.0002.e.cynical:0 "Belki bir yalan, ama işe yarar bir yalan."

 agot_historical_inspiration.0003.t:0 "Bir Hanedanın Sonuncusu"

 agot_historical_inspiration.0003.desc:0 "Adımlarımın kalemin salonlarında yankılanışını duyuyorum; çeşitli pencereleri süsleyen bitkiler bu sesi ancak hafifçe yumuşatıyor. Oynayan çocuk sesi yok. Kardeşlerin coşkulu kahkahası yok, kız kardeşlerin neşeli kıkırdamaları yok. Avluyu geçerken hizmetkârlar bana yol veriyor, saygıyla eğiliyorlar; ama varlıkları beni teselli etmiyor. Yalnızım. [ROOT.Char.GetDynasty.GetName] hanedanının son üyesi.\n\nBenimki, Uzak Diyar'da devrilen ilk hanedan olmayacak. [GetScriptedCharacterByHistoryID('Targaryen_27').GetFirstNamePossessive] fethi sırasında [GetScriptedCharacterByHistoryID('Gardener_95').GetFullNameRegnal] ve oğulları Ateş Tarlası'nda ejderhalara karşı durduğunda, o büyük soy söndürülmüştü. Benimki de tarih sayfalarına mahkûm mu? Şimdi, ölmüş bir soydan ölmekte olan bir soya, o hikâyeden neyi almam gerektiğini merak ediyorum?"

 agot_historical_inspiration.0003.a:0 "Evlenmeliyim! Birileriyle! Herhangi biriyle!"

 agot_historical_inspiration.0003.a.flavor:0 "Evlenmek için en uygun köylüyü buluyorsun."

 agot_historical_inspiration.0003.b:0 "Eminim [willing_courtier.GetFirstName] gönüllü olur..."

 agot_historical_inspiration.0003.c.wife:0 "Gel buraya karıcığım!"

 agot_historical_inspiration.0003.c.husband:0 "Gel buraya kocacığım!"

 agot_historical_inspiration.0003.c.flavor:0 "Bu gece #italic özel #!bir çaba gösteriyorsun."

 agot_historical_inspiration.0003.d:0 "Belki yalnız başıma büyüklüğe ulaşabilirim?"

 agot_historical_inspiration.0003.d.flavor:0 "[ROOT.Char.GetDynasty.GetName] hanedanının sonuncusu olarak rolünü vurgulayacağından emin olacaksın."

 agot_historical_inspiration.0004.t:0 "Kaybolan Işık, Hatırlanan Yıldızlar"

 agot_historical_inspiration.0004.desc:0 ""Ne güzel bir gece," diyor [random_courtier.GetFirstName] düşüncesizce, oysa ben bunu göremiyorum. Açık pencerenin rüzgârını duyabiliyor, içeri süzülen serin meltemi hissedebiliyorum; ama [random_courtier.GetSheHe]'in söz ettiği hiçbir şeyi göremiyorum. [random_courtier.GetSheHe] bana dönüp bir özür kekelerken [random_courtier.GetHerHis] ayaklarının hafifçe yer değiştirdiğini duyuyorum. "Ah. Üzgünüm Efen[ROOT.Char.GetLadyLord]'im. Ben....unuttum." diyor [random_courtier.GetSheHe], ardından çabucak gitmek için bir bahane buluyor.\n\nNe unuttu diyor, görme yetimi kaybedeli ne kadar oldu? Güzel bir gecede yıldızlara bile bakamıyorum...\n\nYıldızlar. Ser [GetScriptedCharacterByHistoryID('Heroes_24').GetFirstNameNicknamed] de kördü; ama yine de gözlerini safirlerle doldurdu ve yetenekli bir savaşçıydı."

 agot_historical_inspiration.0004.modifier_desc:0 "Bu karakter, yakın zamanda [GetScriptedCharacterByHistoryID('Heroes_24').GetFirstNameNicknamed]'den ilham aldı."

 agot_historical_inspiration.0004.a:0 "Bu beni yenemez; tıpkı onun yaptığı gibi talim yapmalıyım!"

 agot_historical_inspiration.0004.b:0 "Belki ben de bir çift mücevherli göz yaptırmalıyım?"

 agot_historical_inspiration.0004.b.flavor:0 "Usta zanaatkârlar arayan mektuplar göndereceksin."

 agot_historical_inspiration.0004.c:0 "[random_courtier.GetSheHe]'in unutması, iyi iş çıkardığım anlamına gelmeli."

 agot_historical_inspiration.0004.c.flavor:0 "Körken dünyada yolunu bulma becerin dikkate alındı."

 agot_historical_inspiration.0004.d:0 "Değiştiremeyeceğim şeyi kabullenmeliyim."

 agot_historical_inspiration.0005.t:0 "Değerli Taşlı Gözler Dövmek"

 agot_historical_inspiration.0005.desc:0 "Mektupları göndermemin üzerinden çok geçmeden, birkaç usta zanaatkâr, bir çift değerli taşlı göz için fiyat teklifleriyle yanıt verdi. Tasarımları bana okunurken dudaklarıma bir gülümseme yayılmadan edemiyorum.\n\nBir zanaatkâr, istendiği gibi konuştuğum herkesi büyüleyeceğinden emin olunan bir çift safir gözle karşılık verdi. Bir başkası, kesinlikle korkunç görünecek bir çift yakut göz önerdi. Alışılmışın dışında bir öneri, bana zarar vermek isteyenlerin gözünü korkutması için ametist gözlerdi. Son olarak biri, servetimle herkesi kamaştıracak bir çift elmas önerecek kadar cüretkârdı."

 agot_historical_inspiration.0005.a:0 "[GetScriptedCharacterByHistoryID('Heroes_24').GetFirstName]'in sahip olduğu gibi safir çift!"

 agot_sapphire_eyes_name:0 "Safir Gözler"

 agot_sapphire_eyes_desc:0 "Kör [ROOT.Char.GetFullName] için yaratılan bu safir protez gözler, büyüleyici bir mavi tonunda."

 agot_historical_inspiration.0005.b:0 "Düşmanlarıma korku salmak için yakut çift!"

 agot_ruby_eyes_name:0 "Yakut Gözler"

 agot_ruby_eyes_desc:0 "Kör [ROOT.Char.GetFullName] için yaratılan bu yakut protez gözler, göz korkutucu bir kırmızı tonunda."

 agot_historical_inspiration.0005.c:0 "Sarayımı ve vasallarımı ürkütmek için ametist çift!"

 agot_amethyst_eyes_name:0 "Ametist Gözler"

 agot_amethyst_eyes_desc:0 "Kör [ROOT.Char.GetFullName] için yaratılan bu ametist protez gözler oniksle kakıldı; ürkütücü bir mor parıltı oluşturuyor."

 agot_historical_inspiration.0005.d:0 "Haşmetimi göstermek için elmas çift!"

 agot_diamond_eyes_name:0 "Elmas Gözler"

 agot_diamond_eyes_desc:0 "Kör [ROOT.Char.GetFullName] için yaratılan bu elmaslar, dikkat çekmekten kendini alamayan abartılı bir çift protez göze oyuldu."

 agot_historical_inspiration.0005.e:0 "Biraz düşününce, bu biraz pahalı."

 agot_historical_inspiration.0006.t:0 "[GetScriptedCharacterByHistoryID('Hightower_97').GetFullNameNoTooltip]'i Hatırlamak"

 agot_historical_inspiration.0006.desc:0 "Reach'te kadınlar geleneksel olarak doğrudan toprak sahibi olmamıştır. Hüküm sürmek tipik olarak erkeklerin alanıdır ve neyse ki yerime kimse hükmetmese de bu bazen ilginç karşılaştırmalara yol açar. Bugün böyle bir karşılaştırma yapıldı; bana şöyle dendi: "As inspiring as [GetScriptedCharacterByHistoryID('Hightower_97').GetFullName] herself".\n\nThough not ruler of land directly, Queen Alicent Hightower is likely one of the most powerful women to have ever lived in Westeros. Her legacy, however, is a complex tapestry woven with both admiration and controversy. As Queen she ably wielded more power than any woman of her age, yet it was her support of her son Aegon II that led to the destructive Dance of the Dragons which saw all her children buried and much of the realm burned.\n\nHow, then, should I regard this comparison, both as a woman and as a noble of the Reach?"

 agot_historical_inspiration.0006.desc.hightower_woman:0 "Reach'te kadınlar geleneksel olarak doğrudan toprak sahibi olmamıştır. Hüküm sürmek tipik olarak erkeklerin alanıdır ve neyse ki yerime kimse hükmetmese de bu bazen ilginç karşılaştırmalara yol açar. Bugün böyle bir karşılaştırma yapıldı; bana şöyle dendi: "As inspiring as Queen Alicent herself".\n\nThough not ruler of land directly, Queen [GetScriptedCharacterByHistoryID('Hightower_97').GetFullName] is likely one of the most powerful women to have ever lived in Westeros. Her legacy, however, is a complex tapestry woven with both admiration and controversy. As Queen she ably wielded more power than any woman of her age, yet it was her support of her son Aegon II that led to the destructive Dance of the Dragons which saw all her children buried and much of the realm burned.\n\nHow, then, should I regard this comparison, both as a woman and as a Hightower?"

 agot_historical_inspiration.0006.desc.hightower_man:0 "Biz Hightower'lar soyumuzu Uzak Diyar'ın en erken günlerine dek izleyebiliriz ve o tarihte pek çok asil ve onurlu adam bulunabilir. Ancak bugün bana, en kayda değer akrabalarımdan birinin bir erkek değil, bir kadın olduğu hatırlatıldı.\n\nKraliçe [GetScriptedCharacterByHistoryID('Hightower_97').GetFullName], muhtemelen Westeros'ta yaşamış en güçlü kadınlardan biridir. Yine de mirası; hayranlıkla tartışmanın birbirine dokunduğu karmaşık bir halı gibidir. Kraliçe olarak çağının hiçbir kadınının yapamadığı kadar ustalıkla güç kullandı; yine de onu, tüm çocuklarının gömüldüğü ve diyarın büyük bir bölümünün yakıldığı yıkıcı Ejderhaların Dansı'na götüren, oğlu II. Aegon'a verdiği destekti.\n\nÖyleyse, bu ölü akrabayı nasıl görmeliyim?"

 agot_historical_inspiration.0006.a.woman:0 "Alicent, her annenin yapması gerektiği gibi çocukları için savaştı."

 agot_historical_inspiration.0006.a.man:0 "Alicent, sonucu ne olursa olsun hanedanımız için savaştı. Hayranlığı hak ediyor!"

 agot_historical_inspiration.0006.a.flavor:0 "Alicent'in işlerine desteğini alenen beyan ediyorsun."

 agot_historical_inspiration.0006.a.tt.a:0 "[dynasty|El]'indeki her kadın, sözlerinizden #P memnun kalacak.#!"

 agot_historical_inspiration.0006.a.tt.b:0 "[court|El]'indeki her kadın ve her kadın [vassal|El], sözlerinizden #P memnun kalacak.#!"

 agot_historical_inspiration.0006.b.woman:0 "Bir kadının iddiasının önüne geçerek cinsiyetine ve soyuna ihanet etti."

 agot_historical_inspiration.0006.b.man:0 "Alicent'in kadınsı kurnazlığı hanedanımıza şerefsizlik getirdi. Ayıp."

 agot_historical_inspiration.0006.b.flavor:0 "Alicent'in işlerini alenen kınıyorsun."

 agot_historical_inspiration.0007.t:0 "Yeniden Doğan Haylaz Prens"

 agot_historical_inspiration.0007.desc:0 "Öfkemden nasibini alacak kadar talihsiz olan son alçak doğumlu köpeği yere seriyorum; kanlarının kılıcımdan damlayışını izlerken yüzümde buruk bir gülümseme. "İyi vuruş Efen[ROOT.Char.GetLadyLord]'im! Vallahi, sanki yeniden doğmuş bir [GetScriptedCharacterByHistoryID('Targaryen_61').GetFirstName] [GetScriptedCharacterByHistoryID('Targaryen_61').GetHouse.GetBaseName] gibisiniz!" diye haykırıyor adamlarımdan biri.\n\nKayda değer bir benzetme doğrusu. Daemon, tarihin dönüm noktası olduğu bir adamdı. Karanlık Kız Kılıcı'nın taşıyıcısı ve [GetScriptedCharacterByHistoryID('dragon_caraxes').GetNameNicknamed] ejderhasının binicisi olarak, Ejderhaların Dansı'nda Siyahlar'ın baş generali olmadan önce Adımtaşları'ndaki korsan beyleriyle savaşta kendi krallığını kurdu. Onu yere serecek tek şey, çağın en büyük ejderhasıydı.\n\nKuşkusuz yetenekliydi ve aramızda benzerlikler de vardır; ama gerçekten, çocuk katili ve bir çağın en büyük kasaplarından biriyle kıyaslanmak istiyor muyum?"

 agot_historical_inspiration.0007.modifier_desc:0 "Bu karakter, yakın zamanda [GetScriptedCharacterByHistoryID('Targaryen_61').GetFirstNameNicknamed]'den ilham aldı."

 agot_historical_inspiration.0007.a:0 "Bundan neden şüphe ediyorum? Elbette istiyorum!"

 agot_historical_inspiration.0007.b:0 "Ne benzetme! Buna layık olmam gerekecek."

 agot_historical_inspiration.0007.c:0 "Daemon bir budalaydı. Onun asla olamadığı kadar iyi olacağım."

 agot_historical_inspiration.0007.c.flavor:0 "Şövalyelerin, bu tutumundan dolayı senden hoşlanabilir ya da hoşlanmayabilir."

 agot_historical_inspiration.0007.d:0 "Belki...belki kendimi yumuşatmalıyım."

 agot_historical_inspiration.0008.t:0 "İnşacının Mirası"

 agot_historical_inspiration.0008.desc:0 "Kalemin daha eski bölümlerinden birinde yürürken yerde tek bir tuğla fark ediyorum; tam ayak parmağımı ona çarpmadan duruyorum.\n\n#italic "Tuhaf..." #! diyorum kendi kendime; tuğlanın nereden düştüğünü bulmaya çalışırken...\n\nİşte! Pencerenin hemen altında eksik bir tuğla. Geri kalanını denetlemeleri için inşaatçılarla konuşmam gerekecek. Tuğlayı yerine koyarken, yaşamış en büyük inşacı olan [GetScriptedCharacterByHistoryID('Stark_12').GetFirstNameNicknamed]'i düşünmeden edemiyorum. Efsanevi mimar [ROOT.Var('TheWall').Title.GetName]'i inşa etti, "

 agot_historical_inspiration.0008.desc.Stark:0 "hanedanımızın merkezi "

 agot_historical_inspiration.0008.desc.2:0 "Efsanelere inanılacaksa [ROOT.Var('Winterfell').Title.GetBaseName] ve çok daha fazlası.\n\nİnşa ettiği şeyin, bunca binlerce yıl sonra hâlâ ayakta durması...#S ilham verici#!"

 agot_historical_inspiration.0008.modifier_desc:0 "Bu karakter, yakın zamanda [GetScriptedCharacterByHistoryID('Stark_12').GetFirstNameNicknamed]'den ilham aldı."

 agot_historical_inspiration.0008.a:0 "Bu, mimarlık öğrenmek istememe yol açıyor!"

 agot_historical_inspiration.0008.b:0 "Daha iyi bir kahya olmak için çabalayacağım!"

 agot_historical_inspiration.0008.c:0 "Ondan, beni daha iyi bir insan yapacak bir iki şey öğrenebilirim."

 agot_historical_inspiration.0008.d:0 "Ondan, ilçemi daha iyi bir yer yapacak bir iki şey öğrenebilirim."
