l_english:

 agot_filler_vale.200.t:0 "Kayıp Gezgin"

 agot_filler_vale.200.desc:0 "Ay Dağları, daha da sevimsiz insanlarla dolu sevimsiz bir yerdir. Zaman zaman bu dağ klanları, Vadi'nin verimli topraklarına akın yapmaya kalkarlarsa dağlara geri püskürtülmelidir.\n\nTanıdık bir dağ geçidinde küçük bir maiyetle bir klan üyesi akın grubunu kovalarken, hava kötüye gitmeye başlıyor. Farkına varmadan kendimi yapayalnız buluyorum — ezici bir tipiye bütünüyle gömülmüş, hiçbir yön duygusu yok."

 agot_filler_vale.200.a:0 "İlerlemeliyim."

 agot_filler_vale.200.a_tt:0 "Bu dağlar gölgekedilerine ve daha kötülerine ev sahipliği yapıyor..."

 agot_filler_vale.200.b:0 "Vazgeç, bu çok tehlikeli!"

 agot_filler_vale.200.b_tt:0 "Kaybolmadan önce sen ve adamların güvenliğe dönüyorsunuz."

 agot_filler_vale.201.t:0 "Kayıp Gezgin"

 agot_filler_vale.201.desc:0 "İlerlemeye devam etmeliyim; ayaz uzuvlarımı ele geçirmeye başladı.\n\nİşte, önümdeki ne? Gözlerim beni yanıltıyor mu, yoksa kar fırtınasının içinden yaklaşan bir adam figürü mü?"

 agot_filler_vale.201.a:0 "Bir dağ klan üyesi olmalı."

 agot_filler_vale.201.a_tt:0 "Ortak dava kurup hayatta kalmaktan başka seçeneğim yok. Çaresiz zamanlar, çaresiz ittifaklar yaratır..."

 agot_filler_vale.201.b:0 "İşe yaramaz."

 agot_filler_vale.201.b_tt:0 "Mücadele iradesini kaybediyorum..."

 agot_filler_vale.202.t:0 "Artık Kaybolmayan Gezgin"

 agot_filler_vale.202.desc:0 "Beklenmedik yoldaşım ve ben fırtınada hızla ilerliyoruz. Bu dağları açıkça iyi biliyorlar; çok geçmeden klan salonlarına varıyoruz.\n\nÇıtırdayan bir ateşin yanına oturuyoruz; sıcaklık hiç bu kadar iyi hissettirmemişti. Önümüze sıcak bir yemek konuyor ve bu klan üyesiyle mutlulukla ekmek bölüşüyorum — yalnızca misafirlik hakkını güvenceye almak için olsa bile.\n\nAma teşekkürleşip yaşam tarzlarımızı tartışırken, birbirimize benzeyen taraflarımızın farklı olanlardan daha fazla olduğunu hissetmeden edemiyorum. Belki de bu klan reisiyle dost olabilir, kendime layık bir müttefik kazanabilirim."

 agot_filler_vale.202.a:0 "Şölenlerde bira dökmeliyiz, savaşta kan değil."

 agot_filler_vale.202.a_tt:0 "Ev sahibimle ortak zemin buldum ve artık ona dost diyebilirim."

 agot_filler_vale.202.b:0 "Ben mi bir vahşiyle akşam yemeği paylaşacağım?"

 agot_filler_vale.202.b_tt:0 "Bu yemek birlikte son yemeğimiz olacak. Eve dönmek için sabırsızlanıyorum..."

 agot_filler_vale.203.t:0 "Kayıp Bir Gezgin, Bulunan Bir Dost"

 agot_filler_vale.203.desc:0 "Fırtına nihayet dindi ve klan reisi beni dağ kabilelerinin yerel bir oyununu oynamaya davet etti. Hatta kazanırsam ufak bir iyilik vaat ediyor, göz kırparak."

 agot_filler_vale.203.a:0 "Kulağa ilginç geliyor!"

 agot_filler_vale.203.a_tt:0 "Klan üyesiyle dostluğun serpiliyor."

 agot_filler_vale.204.t:0 "Kayıp Bir Gezgin, Bulunan Bir Dost"

 agot_filler_vale.204.desc:0 "Oyun başlıyor!\n\nAramıza açık ve koyu gri taşlarla kaplı damalı bir tahta konuyor. Sırayla bu taşları tahtanın üzerinde hareket ettiriyoruz, bir irade savaşı gibi birbirimizin taşlarını alıyoruz."

 agot_filler_vale.204.a:0 "Kaybedeceksin, dostum!"

 agot_filler_vale.204.a_tt:0 "Biraz dostça rekabetin zararı olmaz..."

 agot_filler_vale.205.t:0 "Kayıp Bir Gezgin, Bulunan Bir Dost"

 agot_filler_vale.205.desc:0 "Bir göz kırpması gibi gelen — ama neredeyse bir saat süren — bir sürenin ardından oyun bitti."

 agot_filler_vale.205.a:0 "Elbette, zafer benim."

 agot_filler_vale.205.a_tt:0 "Bu çok eğlenceliydi!"

 agot_filler_vale.205.b:0 "Görünüşe göre kaybım bir borçla geldi."

 agot_filler_vale.205.b_tt:0 "Onlara borcumu sonra ödemek zorunda kalacağım..."

 agot_filler_vale.206.t:0 "Artık Kaybolmayan Gezgin"

 agot_filler_vale.206.desc:0 "Yaşadıklarımızın ardından dostumu geride bırakmak tatlı bir hüzün veriyor.\n\nBir yol ayrımında ayrılmadan önce ittifak ve dostluk yemini ediyoruz ve eve dönüyorum."

 agot_filler_vale.206.a:0 "Bu, bir gün torunlarıma anlatacağım bir hikâye."

 agot_filler_vale.206.a_tt:0 "Eve tazelenmiş olarak dönüyorum."

 agot_filler_vale.300.t:0 "Yolda Hazineler"

 agot_filler_vale.300.desc:0 "Kâhyam [steward.GetCouncilTitle] [steward.GetTitledFirstName], müjdeli bir haber getiriyor — Nehir Toprakları'ndan gelen, ağır yüklü değerli mallar taşıyan bir kervan ana yoldan geçiyor. Mutlaka Vadi'de bazı hazineleri uygun fiyata satmak istiyorlardır."

 agot_filler_vale.300.a:0 "Mallarını görmek için sabırsızlanıyorum!"

 agot_filler_vale.300.a_tt:0 "Ana yol yılın bu zamanında tehlikelidir..."

 agot_filler_vale.300.b:0 "Umarım güzel kitapları vardır!"

 agot_filler_vale.300.b_tt:0 "Elbette yeni bir kitap günlerini doldurmaya yardımcı olacaktır."

 agot_filler_vale.300.c:0 "Umarım birkaç yıl önce tanıştığım şarap tüccarı söz verdiği gibi geri döner..."

 agot_filler_vale.300.c_tt:0 "Vadi'de düzgün bir Arbor kırmızısı bulamazsın."

 agot_filler_vale.301.t:0 "Rüzgârın Savurduğu"

 agot_filler_vale.301.desc:0 "Kâhyam [steward.GetCouncilTitle] [steward.GetTitledFirstName], ağır bir haber getiriyor — Nehir Topraklı kervan, ana yoldan geçerken güçlü bir rüzgâr fırtınasına yakalanmış. Tüccarların tümü aşağıdaki uçuruma yuvarlanıp can vermiş... Kurtulan olmamış."

 agot_filler_vale.301.a:0 "Yedi cehennem!"

 agot_filler_vale.301.a_tt:0 "Görünüşe göre Yabancı hazineleri kendisi için almış."

 agot_filler_vale.301.b:0 "Cesetlerde birkaç güzel değerli eşya olabilir..."

 agot_filler_vale.301.b_tt:0 "Değerli eşyaları için cesetleri yağmalıyorsun."

 agot_filler_vale.400.t:0 "Rahibenin Oyunu"

 agot_filler_vale.400.desc:0 "Kâhyam [steward.GetCouncilTitle] [steward.GetTitledFirstName], donanma gücümüzü gözden geçirmek için limana kadar bana eşlik etti; bu sırada yanımıza rahatsız edici bir raporla geliniyor: #italic Deniz Kızkardeşi#! adlı gemilerimden biri isyan etmiş! Geminin içindekiler korsanlara satılmış, muhtemelen şu an Dar Deniz'in yarı yolunda ve bir daha asla görülmeyecek."

 agot_filler_vale.400.a:0 "Gerçekten de rahatsız edici!"

 agot_filler_vale.400.a_tt:0 "Belki biraz soruşturma bu gizeme ışık tutar."

 agot_filler_vale.401.t:0 "Rahibenin Oyunu"

 agot_filler_vale.401.desc:0 "[steward.GetTitledFirstName], #italic Deniz Kızkardeşi#'ni bulmak için yorulmak bilmeden çalıştı; limana girip çıkan her tüccar gemisine görülüp görülmediğini sordu.\n\nSonunda, bu sıkı çalışma karşılığını buldu: Bir denizci, isyan eden gemiyi Kızkardeşler yakınlarında seyrederken gördüğünü iddia ediyor!"

 agot_filler_vale.401.a:0 "Cevap isteyeceğim!"

 agot_filler_vale.401.a_tt:0 "Kızkardeşler'e yelken açmak için bir gemi hazırla."

 agot_filler_vale.401.b:0 "Odağımız olması gereken daha önemli işler var."

 agot_filler_vale.402.t:0 "Rahibenin Oyunu"

 agot_filler_vale.402.desc:0 "[sister_lord.GetTitledFirstName], Kızkardeşler'in kasasının geminin isyanından bu yana epey dolduğu bildirilmesine rağmen meseleyle ilgisi olduğunu reddediyor."

 agot_filler_vale.402.a:0 "Zincire vurulmuş halde benimle geleceksin."

 agot_filler_vale.402.a_tt:0 "Aşağılanmama izin vermeyeceğim!"

 agot_filler_vale.402.b:0 "Bu suçlamayı kanıtlayamam..."

 agot_filler_vale.402.b_tt:0 "Zorba olmayı reddediyorum. Bunu görmezden gelmek zorundayım..."

 agot_filler_vale.500.t:0 "Dev Balkabakları!"

 agot_filler_vale.500.desc:0 "Topraklarımdaki küçük halkın balkabağı hasadı bu sezon olağanüstü büyük kabaklar verdi. Böyle bir balkabağının atlı bir araba kadar büyük olduğu bildiriliyor!"

 agot_filler_vale.500.a:0 "Bu beni zengin edecek!"

 agot_filler_vale.500.a_tt:0 "Doğru yatırımla, bu dev balkabakları son derece kârlı olabilir."

 agot_filler_vale.500.b:0 "Bunu lehime çevireceğim..."

 agot_filler_vale.500.b_tt:0 "Bu küçük halka vaat edilen övgü ve şan, altından daha değerli. Gerçek bir dehayım!"

 agot_filler_vale.600.t:0 "Yedi Uçlu Yıldız"

 agot_filler_vale.600.desc:0 "Bir kâşifin, eski bir Andal harabesini keşfederken bir kalıntı bulduğu söyleniyor — Andalların gelişi zamanından kalma, kayaya oyulmuş yedi köşeli yıldız."

 agot_filler_vale.600.a:0 "Aile yadigârı olarak saklayacağım."

 agot_filler_vale.600.a_tt:0 "Tanrılar bana lütfedecek!"

 agot_filler_vale.600.b:0 "Şüphesiz biraz altın eder..."

 agot_filler_vale.600.b_tt:0 "Bazı septolar bunun için iyi para öder."
