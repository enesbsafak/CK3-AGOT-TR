l_english:

 agot_filler_dorne.0001.t:0 "Çatışan Genç Kalpler"

 agot_filler_dorne.0001.desc:0 "İki soylu genç, aralarındaki bir anlaşmazlığı çözmem için bana geldi. Görünüşe göre ikisi de aynı kadını gözde edinmiş. İşin kötüsü, bu anlaşmazlığın bir düelloyla çözülebileceğini düşünüyorlar; onlar sadece düello edip etmemeleri konusunda #italic benim#! fikrimi almak istiyorlar.\n\nKadına bakınca, ikisinin neden kavga etmeye hazır olduğunu anlıyorum — o tek kelimeyle güzel..."

 agot_filler_dorne.0001.a:0 "Ah, yaşamak ve sevmek. Kavga etsinler."

 agot_filler_dorne.0001.a_tt:0 "Soyluları onun uğruna düello etmeye teşvik ediyorsun."

 agot_filler_dorne.0001.b:0 "Hayır, bu kadın soylu kanına değmez."

 agot_filler_dorne.0001.b_tt:0 "Soyluları düello etmemeleri konusunda uyarıyorsun."

 agot_filler_dorne.0001.c:0 "Belki de benimle daha çok ilgilenir..."

 agot_filler_dorne.0001.c_tt:0 "Gözdeyi yatak odana geri davet ediyorsun."

 agot_filler_dorne.0002.t:0 "Tutkudan Doğan Bir Çocuk"

 agot_filler_dorne.0002.desc:0 "Bu yılın başlarında o iki soylunun şiddetle tartıştığı gözde, bana onu hatırlatacak bir şey göndermiş... #bold bir piç oğul#!. Oğlan sabahın erken saatlerinde geldi, anne ise hiçbir yerde yok. Ama çocuğa baktığımda, onun benim olduğunu hiç şüphesiz hissedebiliyorum."

 agot_filler_dorne.0002.a:0 "Ah... sanırım yaşamak ve sevmek."

 agot_filler_dorne.0003.t:0 "Satılık Pişmiş Akrep!"

 agot_filler_dorne.0003.desc:0 "Bir çarşıda alışveriş yaparken, daha önce burada görmediğim yeni bir tüccara rastlıyorum. Kumlu bir Dorneli ve ortak dilinde Kızıl Dağlar'ın ağır bir şivesi var. Beni fark edip el sallıyor.\n\nKısa sürede onun da bir yiyecek tüccarı olduğunu görüyorum, ama malları... tuhaf. Pişmiş akrep satıyor. Sepet sepet o yaratıkları var ve tezgâhının yanındaki ateşte kızartıyor. Hatta kullanıma hazır birkaç baharatı bile var.\n\nTatmam için bana küçük bir numune ikram ediyor."

 agot_filler_dorne.0003.a:0 "Tadı... tavuk gibi..."

 agot_filler_dorne.0003.b:0 "Ne kadar naziksiniz, ama bunu denemeyeceğim."

 agot_filler_dorne.0003.b_tt:0 "Tüccar, isteksizliğinden hoşnutsuz."

 agot_filler_dorne.0004.t:0 "Dorneli Sıcak Dalgası"

 agot_filler_dorne.0004.desc:0 "Güneş, korkunç bir şevkle tüm Dorne'un üzerine iniyor. Üstatlar buna sıcak dalgası diyor, ama bence Yedi Cehennem böyle hissettiriyor. Sıcak. Kuru. Çorak.\n\nSıcak Dorne'u cezalandırmaya devam ederken birçok küçük halk su için çabalıyor. Ortak su kuyuları bir anda bu kadar susamış insanı beslemekte zorlanıyor ve şimdi topraklarımdaki küçük halk, kendi özel su kuyularımdan su istiyor..."

 agot_filler_dorne.0004.a:0 "Su kuyularımın etrafındaki muhafaz sayısını ikiye katla."

 agot_filler_dorne.0004.b:0 "Onlara yardım teklif et, ama savurgan olma."

 agot_filler_dorne.0004.c:0 "Sıcak dalgaları ve kuraklık Dorne için yeni değil. Benden hiçbir şey alamazlar."

 agot_filler_dorne.0005.t:0 "Kan Portakalı"

 agot_filler_dorne.0005.desc:0 "Kâseye uzanıp sulu ve dolgun bir kan portakalı çekiyorum. Dorne'un yerli meyvesi; Dorne'da hüküm sürmenin birçok ayrıcalığından biri de böyle lezzetli ve ferahlatıcı bir meyveye ucuz erişimdir.\n\nPortakalı soyup kabuğunu kâseye atıyorum ve meyveye dişlerimi geçiriyorum. Suları çenemden aşağı akıyor, kucağıma damlıyor, ama o tat, ah, o tat! Öylesine... ferahlatıcı."

 agot_filler_dorne.0005.a:0 "Ahhh, nefis."

 agot_filler_dorne.0006.t:0 "Ucuz ve Hızlı Dorneli Kum Binekleri"

 agot_filler_dorne.0006.desc:0 "Yeni bir at yetiştiricisi son zamanlarda olağanüstü üstün Dorneli Kum Binekleri üretiyor. Diğer yetiştiricilerin aksine, bu adamın hayvanları diğer yetiştiricilerin atlarından belirgin biçimde daha hızlı, daha dayanıklı ve daha güzel. Dorneli Kum Bineği Westeros'un diğer atlarından zaten üstün olsa da, bu adamın hayvanları yeni nesil güçlü atlar gibi görünüyor.\n\nVe işi daha da ilginç kılan şey, görünüşe göre adam atlarının değerini bilmiyor... binekleri yok pahasına satıyor!"

 agot_filler_dorne.0006.a:0 "Adamın tüm stokunu satın al."

 agot_filler_dorne.0006.b:0 "Bir iş anlaşması yap ve ekonomik faydalarını topla."

 agot_filler_dorne.0006.c:0 "Atları zapt et ve adamı fiyat kırdığı için tutukla."

 agot_filler_dorne.0006.d:0 "Daha fazla ata ihtiyacımız yok."

 agot_filler_dorne.0007.t:0 "Boş Baharat Dolapları"

 agot_filler_dorne.0007.desc:0 "Bir Dorneli [ROOT.Char.GetLadyLord] için, baharat dolaplarının her zaman en zengin ve en acı baharatlarla dolu olması bir gerekliliktir. Yemeğimiz baharatlı değilse, vahşilerden farksızız demektir.\n\nVe görünen o ki bugün vahşi olan benim... ürkek bir hizmetkâr bana baharat dolaplarının #italic tamamen boş#! olduğunu söylüyor. Ah... ne dehşet.\n\nİtibarım bu durumdan nasıl kurtulacak?"

 agot_filler_dorne.0007.a:0 "Artık yemeğim bir Menzillininki kadar tatsız olacak..."

 agot_filler_dorne.0008.t:0 "Zayıf Limon Hasatları"

 agot_filler_dorne.0008.desc:0 "Limon bahçelerim bu hasatta düşük verim verdi. Genellikle bereketli üreticiler olsalar da, bu sezon çok az kâr elde edileceği görünüyor."

 agot_filler_dorne.0008.a:0 "Lanet olsun!"

 agot_filler_dorne.0009.t:0 "Olağanüstü Limon Hasatları"

 agot_filler_dorne.0009.desc:0 "Limon bahçelerim bu hasatta olağanüstü bir verim sağladı! Kâhyam, bunun tartışmasız bana fazladan kâr getireceğini bildiriyor."

 agot_filler_dorne.0009.a:0 "Mükemmel!"

 agot_filler_dorne.0010.t:0 "Kum Fırtınası Bahçelere Zarar Veriyor"

 agot_filler_dorne.0010.desc:0 "Kâhyam, bölgemdeki bazı bahçelere ve korulara şiddetli bir kum fırtınasının zarar verdiğini ayrıntılarıyla anlatan bir rapor gönderdi. Rapora göre, hasarlı bitkileri ayıklamak ve kanallardaki hasarı onarmak birkaç ay, hatta yılın geri kalanını alabilir."

 agot_filler_dorne.0010.a:0 "Kahretsin! Onarımlara devam edin."

 agot_filler_dorne.0010.b:0 "Onarımlarda masraftan kaçınma."

 agot_filler_dorne.0010.c:0 "Aman, zavallı bitkiler. Elinizden gelen her şeyi yapın!"

 agot_filler_dorne.0011.t:0 "Güzel Dorneli Müzik"

 agot_filler_dorne.0011.desc:0 "Sarayım için çalan gezgin bir Dorneli müzisyen, unutamayacağım kadar büyüleyici güzellikte bir ezgi çaldı.\n\nSamit kaftanı ve keten baş örtüsüyle müzisyen, udunu sanki kendisi ve enstrüman uzun ve şanlı birer âşık gibi çaldı. Enstrümanın tellerini çekişi tek kelimeyle mutluluk vericiydi... Eminim bu adam bir gün Yedili için çalacak."

 agot_filler_dorne.0011.a:0 "Ah, umarım müziğini çok yakında unutmam."

 agot_filler_dorne.0012.t:0 "Kum Köpeklerinin Saldırısı"

 agot_filler_dorne.0012.desc:0 "Saray mensuplarımdan bazılarının, uzak bir çöl köyünden bir annenin bebeğinin gece çalındığını tartıştıklarını duydum. Saray mensuplarım, kum köpekleri denen çöl leşçilerinin köye süzülüp bebeği gece yarısı atıştırmalığı için çaldığını düşünüyor.\n\nKum köpekleri azılı çöl leşçileri olsa da, gece yarısı bir bebeği evinden çalacaklarını sanmıyorum. Öte yandan, küçük ve etine dolgun bir bebek kolay bir hedeftir..."

 agot_filler_dorne.0012.a:0 "Geceleri kalemde güvende olduğum için mutluyum..."

 agot_filler_dorne.0012.b:0 "Hah! Bu sadece bir tüccar masalı."

 agot_filler_dorne.0013.t:0 "Ziyan Olan Dorneli Kırmızı Şarabı"

 agot_filler_dorne.0013.desc:0 "#S ÇARPMA#!! Mutfağa girerken, ince kollu bir hizmetkârın paniklediğini görüyorum; değerli Dorneli kırmızı şarabımdan koskoca bir fıçı ayaklarının dibinde birikmiş... Koca bir fıçı ziyan olmuş! Hepsi bu hizmetkâr onu tek başına taşımaya çalıştığı için.\n\nBaşını kaldırıp kapıda durduğumu görüyor, yüzü birden yalnızca üzüntüyle değil korkuyla da aydınlanıyor. Diğer hizmetkârlar da varlığımda sessizleşti - nasıl tepki vereceğimi bekliyorlar."

 agot_filler_dorne.0013.a:0 "Kahretsin! Temizleyin, #S şimdi!#!"

 agot_filler_dorne.0013.b:0 "Bunun için cezalandırılacaksın."

 agot_filler_dorne.0013.b.sadist:0 "Hizmetkârı gecenin köründe işkence ettiriyorsun."

 agot_filler_dorne.0013.b.other:0 "Hizmetkâr için uygun bir ceza buluyorsun."

 agot_filler_dorne.0014.t:0 "Han Kavgası"

 agot_filler_dorne.0014.desc:0 "#S ÇARPMA#!! Hanın kapısı çarparak açılıyor ve birkaç Menzilli şövalyenin salona kasılarak girdiğini görüyorum. Oturan birkaç adamın yanından geçerken alay edip şaka yapıyorlar, 'Dorneli kokuyor' diye bir şeyler yüksek sesle fısıldıyorlar. Han sahibine yaklaşırken bardağımı sıkıca kavrıyorum; içlerinden biri yüzüne tükürüp şarap testisini elinden kaptığında irkiliyorum. Başka bir şövalye garson kadını kavrayıp sıkıca tutarken bütün bir kızarmış tavuğu kapınca adamlar kahkahalara boğuluyor. Han sahibi onlara bağırıyor, ama yüzüne inen hızlı bir yumruk onu susturuyor.\n\nYüzünü ovuştururken gözleri benimkilerle buluşuyor... Benim bir [ROOT.Char.GetLadyLord|l] olduğumu biliyor, sonuçta daha önce de burada yemek yedim... Yüzündeki ifade bir yardım yalvarışı..."

 agot_filler_dorne.0014.a:0 "Hey, seni çirkin Menzilli, buraya gel!"

 agot_filler_dorne.0014.b:0 "Muhafızlar! Onlarla ilgilenin."

 agot_filler_dorne.0014.c:0 "Bir [ROOT.Char.GetLadyLord|l] huzur içinde yemek yiyemez mi?"

 agot_filler_dorne.0015.t:0 "Unutulmuş Teçhizat"

 agot_filler_dorne.0015.desc:0 "Bugün Dorneli yerel bir tüccarla görüşmek için Dorne çoraklarına çıkıyorum. Maiyetim ve ben kum bineklerimize binip çöle doğru yola koyuluyoruz.\n\nBirkaç dakikalık yolculuktan sonra rüzgâr hızlanmaya başlıyor ve kumun vahşice yüzüme çarptığını fark ediyorum! Ahh!\n\nPeçemi çıkarmak için çantama uzanıyorum ama hiçbir yerde olmadığını fark ediyorum! Görünüşe göre ayrılma telaşında onu paketlemeyi unutmuşum..."

 agot_filler_dorne.0015.a:0 "Bu uzun bir yolculuk olacak..."

 agot_filler_dorne.0015.b:0 "Umarım biri yedek paketlemiştir..."

 agot_filler_dorne.0016.t:0 "Dinî Çatışma"

 agot_filler_dorne.0016.desc:0 "[agot_filler_dorne_0016_village.GetNameNoTier]'deki yerel bir köy, Yedili'nin ve Volantis'in Kızıl Tanrısı'na tapanların kavga etmeye başlaması ve bir arada yaşayamaz hale gelmesiyle kargaşaya düştü. Görünüşe göre iki grup arasındaki her küçük şikâyet büyütülüyor, her grup şiddete dönüşecek en önemsiz meseleyi arıyor.\n\nKöy liderleri, köylülerin bir lordun emrine saygı duyacağını umarak bir karar vermemi istiyorlar..."

 agot_filler_dorne.0016.a:0 "Ya bir arada yaşayacaksın ya da #italic hiç#! var olmayacaksın"

 agot_filler_dorne.0016.b:0 "Yerel siyaset beni ilgilendirmiyor..."

 agot_filler_dorne.0016.c:0 "İki grubu da teolojik bir tartışmaya sokacağım!"

 agot_filler_dorne.0017.t:0 "Kumdan Nefret Ediyorum!"

 agot_filler_dorne.0017.desc:0 "Kalemin dışında daha birkaç dakika önce duruyordum ve güçlü bir rüzgâr kumun tamamını ağzıma üfledi!"

 agot_filler_dorne.0017.a:0 "Of, ne kadar utanç verici."

 agot_filler_dorne.0020.t:0 "Çarşı"

 agot_filler_dorne.0020.desc:0 "[agot_filler_dorne_0020_baazar_location.GetName]'de yakın zamanda bir çarşı açıldı. Birçok yabancı ve Westeroslu tüccar da göz kamaştırıcı bir mal ve hizmet dizisi sergileyerek burada dükkân açtı.\n\nÇarşıda yürürken bir tüccar gözüme çarpıyor: sade yüzlü, tuhaf kıyafetli, uzun boylu bir adam. Arkasında, her biri bir arakh sallayan iki iri yarı muhafız duruyor.\n\nAdam el yapımı mücevherler satıyor. Yaklaştığımda genç bir adam bana sertçe çarpıyor, #N satıcının tüm koleksiyonunu devirip — hem de kırıp — düşürmeme neden oluyor!#! Tüccar öfkeyle haykırıyor ve muhafızlar ben daha ayağa kalkamadan beni yakalıyor... Tüccar derhal tazminat talep ediyor, #italic yoksa!#!"

 agot_filler_dorne.0020.a:0 "T-tamam, al şu altını, lütfen!"

 agot_filler_dorne.0020.a_tt:0 "Özgürlüğün için tüccara makul bir miktar altın teklif ediyorsun."

 agot_filler_dorne.0020.b:0 "Üzerimden çekil! Bu bir kazaydı!"

 agot_filler_dorne.0020.b_tt:0 "Tüccarı bunun bir kaza olduğuna ikna etmeye çalışıyorsun."

 agot_filler_dorne.0020.c:0 "Muhafızlarım nerede? İmdat, biri yardım etsin!"

 agot_filler_dorne.0020.c_tt:0 "Panikleyip yardım çağırıyorsun."

 agot_filler_dorne.0020.d:0 "Seninle dövüşürüm!"

 agot_filler_dorne.0020.d_tt:0 "Kavga başlatıyorsun."

 agot_filler_dorne.0021.t:0 "Çarşı: Altın Teklifi"

 agot_filler_dorne.0021.desc:0 "Tüccarın muhafazları, teklifimi inleyerek sunarken kavrayışlarını sıkılaştırıyor. Tüccar bunu dramatik bir şekilde düşünüyor - çenesini ovuşturuyor, yıkılmış tezgâhın etrafında volta atıyor ve hatta muhafazlardan birinin fikrini bile soruyor.\n\nSonunda tüccar bana bakıp kısaca diyor ki: "Bundan #bold daha fazlasına#! ihtiyacım var. Mallarımın değeri çok daha yüksek!" Öfkelenip cevap vermeye başlıyorum, ama yüzüme #bold bir el iniyor#!! Tüccar itirazlarımı duymak istemediğini söylüyor. Sadece ne kadar tazminat alacağı onun umurunda. Yaklaşıp muhafazlarının kendisinden çok daha sert vurduğunu söylüyor..."

 agot_filler_dorne.0021.a:0 "Pekâlâ! Daha fazla altın alabilirsin!"

 agot_filler_dorne.0021.a_tt:0 "Tüccara #bold büyük#! bir miktar altın ödemeyi teklif ediyorsun."

 agot_filler_dorne.0021.b:0 "Yapacağını yap... Benden başka hiçbir şey alamazsın!"

 agot_filler_dorne.0021.b_tt:0 "Daha fazla altın ödemeyi reddediyorsun."

 agot_filler_dorne.0021.c:0 "Diyarımda boş topraklarım var; alabilirsin! Evet, lord olabilirsin!"

 agot_filler_dorne.0021.c_tt:0 "Hayatın karşılığında diyarından topraklar teklif ediyorsun."

 agot_filler_dorne.0022.t:0 "Çarşı: Rüşvet Verildi"

 agot_filler_dorne.0022.desc:0 "Tüccar, ona fahiş bir miktar altın vadettiğinde sırıtıyor. Altını ona uzatınca muhafazlara beni bırakmaları için işaret ediyor. Uzaklaşırlarken, bana çarpıp bu rezaleti başlatan adamın onlara katılıp güldüğünü görüyorum!"

 agot_filler_dorne.0022.a:0 "Lanet olsun!"

 agot_filler_dorne.0023.t:0 "Çarşı: Olmaz!"

 agot_filler_dorne.0023.desc:0 "Tüccara daha fazla ödemeyi reddettiğimi söylediğimde yüzü öfkeden kıpkırmızı kesiliyor. Muhafazlara beni karanlık bir ara sokağa sürüklemeleri için işaret ediyor.\n\nBeni bir duvara yapıştırıp saldırmaya başlıyorlar. Her darbe gözlerimin önünde yıldızlar uçuşmasına ve görüşümün kararmasına neden oluyor. Bir darbe çeneme isabet ettiğinde bir dişimin fırladığını hissediyorum. Yüzümden birçok yerden kan sızıyor. Aniden bir karanlık çöküyor..."

 agot_filler_dorne.0023.a:0 "Ah..."

 agot_filler_dorne.0023.a_tt:0 "Vahşice dövülüp soyuluyorsun."

 agot_filler_dorne.0024.t:0 "Çarşı: Bir Takas"

 agot_filler_dorne.0024.desc:0 ""Bana ait topraklar," diye tekrarlıyor tüccar, yüzüne bir sırıtış yayılırken, "Evet, evet bu olur. Bu olur. Bu toprakların hükümdarı olduğumu söyleyen belgeleri imzalayacaksın, yoksa numara yok!"\n\nTüccar, bir parşömene bir şeyler yazarken muhafazlara kavrayışlarını gevşetmeleri için işaret ediyor. Bir süre sonra, ona unvanlar ve topraklar vereceğimi belirten resmî görünümlü bir belge çıkarıyor... Bu kadar iyi yazmayı nereden biliyor?"

 agot_filler_dorne.0024.a:0 "Boş topraklarım hayatım karşılığında, anlaştık..."

 agot_filler_dorne.0025.t:0 "Çarşı: Pazarlık"

 agot_filler_dorne.0025.desc:0 ""Üzerimden çekil, üzerimden çekil!" diye bağırıyorum, "kazaydı, yemin ederim! Bunu konuşabiliriz - pazarlık edebiliriz!" Tüccar yalvarışımı duyuyor ve gülümsüyor. Bana bakıp diyor ki: "Haklısın; bir kazaydı. Ama kazaya sen neden oldun. Öyleyse hadi #italic pazarlık#! edelim, bir geri ödeme bedeli...""

 agot_filler_dorne.0025.a:0 "Pekâlâ... konuşalım."

 agot_filler_dorne.0025.a.success:0 "Geri ödeme fiyatında pazarlık yapıyorsun."

 agot_filler_dorne.0025.a.failure:0 "Tüccarı ikna edemiyorsun."

 agot_filler_dorne.0026.t:0 "Çarşı: Yardım!"

 agot_filler_dorne.0026.desc:0 "Muhafızlar beni sıkıca kavrarken çılgınca etrafıma bakınıyorum. Muhafızlarıma, herkese, elimden geldiğince yüksek sesle yardım diye bağırıyorum.\n\nAniden tüccar bir çığlık atıyor ve yanından geçen bir devriye bizi fark ediyor. Koşarak geliyor, iki muhafız anında kaçıyor. Tüccar kaçmaya çalışıyor ama mallarının enkazına takılıp düşüyor!\n\nDevriyeye teşekkür ediyorum; o da bana tüccarın Dorne'un dört bir yanında insanları sömüren bilinen bir dolandırıcı olduğunu söylüyor!"

 agot_filler_dorne.0026.a:0 "Sesimi duyduğun için şükürler olsun."

 agot_filler_dorne.0027.t:0 "Çarşı: Yardım!"

 agot_filler_dorne.0027.desc:0 "Muhafazlar kavrayışlarını sıkılaştırırken çılgınca etrafıma bakınıyorum. Olabildiğince yüksek sesle muhafazlarıma, herkese yardım diye bağırıyorum. Ne yazık ki, kısa sürede kimsenin yardıma gelmeyeceği anlaşılıyor...\n\nTüccar, çok büyük bir risk olduğumu söylüyor ve başıyla karanlık bir ara sokağı işaret ediyor... Ara sokağa sürüklenirken çaresizce yardım diye bağırıyorum ve amansızca dövülüyorum!"

 agot_filler_dorne.0027.a:0 "Ah..."

 agot_filler_dorne.0028.t:0 "Çarşı: KAVGA!"

 agot_filler_dorne.0028.desc:0 "Tüccar önümde geveleyip dururken, bu muhafazların muhtemelen dövüş eğitimi almış birinin oyunlarına kanmasını beklemediğini anlıyorum...\n\nHızlı bir hareketle muhafazlara kafa atıyorum, geçici olarak şaşkına dönüyorlar ve kavramalarından kurtulup çıkıyorum. Bir hançer çıkarıp muhafazlardan birinin darbelerini savuşturuyorum. Yanından yuvarlanıp geçerken korunmasız karnına saplıyorum. Onun arakh'ını kapıp diğer muhafaza doğrultuyorum, o da hemen kaçıyor.\n\nDonmuş tüccara doğru adım atıp iki bıçağı ona doğrultuyorum, bana saldırması için meydan okuyorum..."

 agot_filler_dorne.0028.a:0 "Tüccar kendi hançerini çekiyor. #bold KAVGA!#! istiyor!"

 agot_filler_dorne.0028.a.success:0 "#P Düşmanımı öldürüyorum.#!"

 agot_filler_dorne.0028.a.failure:0 "#N Düşmanım beni yaralayıp kaçıyor.#!"

 agot_filler_dorne.0035.t:0 "Yeşilkan'da Balık Tutmak"

 agot_filler_dorne.0035.desc:0 "Yeşilkan boyunca seyahat ederken, kıyıdan balık tutan bir adam ve oğluna rastladım. Adam uzun boylu, siyah saçlı ve neredeyse kraliyet havasında. Oğlu daha bir çocuk, ama babasına çok benziyor. Adamla konuştuktan sonra, mesleğinin balıkçılık olduğunu ama boş zamanlarında balık tutmaya karşı koyamadığını söylüyor. Ne hoş.\n\nAyrılmadan önce adam, beni direkli teknesiyle balığa götürmeyi teklif ediyor... bunun balıkçılık algımı değiştirecek bir fırsat olduğunu söylüyor."

 agot_filler_dorne.0035.a:0 "Kulağa eğlenceli geliyor."

 agot_filler_dorne.0035.a_tt:0 "Tekneye bineceksin."

 agot_filler_dorne.0035.b:0 "Balık tutmayı deneyeceğim, ama kıyıdan."

 agot_filler_dorne.0035.b_tt:0 "Kıyıdan balık tutmayı deneyeceksin."

 agot_filler_dorne.0035.c:0 "Hayır, sanmıyorum..."

 agot_filler_dorne.0035.c_tt:0 "Balıkçının teklifini reddediyorsun."

 agot_filler_dorne.0036.t:0 "Güvertede"

 agot_filler_dorne.0036.desc:0 "Balıkçı gemiye binmeme yardım ediyor ve nehirde yola çıkıyoruz. Bana yedek bir olta verip suya nasıl atılacağını gösteriyor. Oltam suyun altına sarkarken bir kovanın üstüne oturuyorum... hevesle bekliyorum..."

 agot_filler_dorne.0036.a:0 "Bakalım ne yakalayacağım!"

 agot_filler_dorne.0036.a.success:0 "#P Bir balık yakalıyorsun!#!"

 agot_filler_dorne.0036.a.failure:0 "#N Balık tutamıyorsun.#!"

 agot_filler_dorne.0037.t:0 "Büyük Olan"

 agot_filler_dorne.0037.desc:0 "Balığın yemi yuttuğunu hissedip olabildiğince sert çekiyorum. Sarıp sarmalıyorum, sarıyorum, sarıyorum... ve sonra birden, oltamın ucunda kocaman bir bıyıklı balık var. Rehberim ve benim birlikte verdiğimiz güçle onu teknenin kenarından çekiyoruz. Rehberim sırtıma vurup iyi iş çıkardığımı haykırıyor!"

 agot_filler_dorne.0037.a:0 "Bu heyecan vericiydi!"

 agot_filler_dorne.0038.t:0 "Yeşilkan'da Balık Tutmak"

 agot_filler_dorne.0038.desc:0 "Saatlerce oltamı suda tutuyorum. Görünüşe göre kimse ısırmıyor.\n\nEn azından nehirdeki tekne gezisi dinlendirici..."

 agot_filler_dorne.0038.a:0 "En azından tamamen boşa geçen bir zaman değildi."

 agot_filler_dorne.0039.t:0 "Kıyıdan Balık Tutmak"

 agot_filler_dorne.0039.desc:0 "Balıkçı bana bir olta veriyor ve nasıl atılacağını gösteriyor. Üçüncü denememde nehirde epey derine atıyorum! Artık tek yapmam gereken beklemek..."

 agot_filler_dorne.0039.a:0 "Bakalım ne yakalayacağım!"

 agot_filler_dorne.0040.t:0 "Küçük Olan"

 agot_filler_dorne.0040.desc:0 "Birdenbire oltamda bir #bold ısırık#! hissediyorum! Olabildiğince sert çekiyorum, kıyıya adım adım yaklaşıyorum...\n\nNihayet, oltamın ucunda pek mütevazı sayılmayacak bir balık var. Balıkçı ona beyaz levrek diyor. Balık minicik, bu yüzden onu suya geri atıyoruz. Yüzerek uzaklaşışını izliyorum..."

 agot_filler_dorne.0040.a:0 "En azından bir şey yakaladım!"

 agot_filler_dorne.0041.t:0 "Yeşilkan Kıyısında Balık Tutmak"

 agot_filler_dorne.0041.desc:0 "Oltam suda saatlerce kalıyor. Çekiyorum, yeni yem takıyorum, atıyorum ama yine... kimse ısırmıyor. Bir süre sonra gitme vakti geldiğine karar veriyorum. Dönecek işlerim var..."

 agot_filler_dorne.0041.a:0 "Ne vakit kaybı!"

 agot_filler_dorne.0042.t:0 "Bir Deve Vakası"

 agot_filler_dorne.0042.desc:0 "[province.GetNameNoTier] rıhtımına, görmek için kendimin görmem gereken tuhaf bir kargo taşıyan bir tüccar geldi. Varışımda iltifatlara boğuluyorum; tüccar sonunda [merchant.GetSheHe] bir denizciye işaret ediyor, o da bu tuhaf canavarları deve deve gemiden indiriyor.\n\n[merchant.GetSheHe|U] bu develerin en seçkin Kartli soyundan geldiğine dair güvence veriyor ve Dorne'un derinlerindeki Kızıl Kumullar'da herhangi bir Westeroslu savaş atını geçeceklerini söylüyor. Eşsiz yapıları sayesinde günlerce susuz kalabilirler ve bu canavarların kokusu bile en azılı savaş atını paniğe sürükler! "Elbette, sizin boyunuzdaki bir [ROOT.Char.GetLadyLord], böyle eşsiz ve egzotik bir hayvanla ilgilenir?""

 agot_filler_dorne.0042.a:0 "Bu develerden bir sürü alacağım!"

 agot_filler_dorne.0042.a_tt:0 "Ordun için bir deve birliği satın alacaksın!"

 camel_army_name:0 "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] Kartli Develeri"

 agot_filler_dorne.0042.b:0 "Garip, topak topak atlara ihtiyacım yok"

 agot_filler_dorne.0200.t:0 "Kuyu Kuruyor"

 agot_filler_dorne.0200.desc:0 "Kâhyam [steward.GetCouncilTitle] [steward.GetTitledFirstName], rahatsız edici bir haberle yanıma geliyor: Çölün kenarındaki bir köyün kuyusu gizemli bir şekilde kurumuş.\n\nKüçük halkın suyu tükeniyor ve [ROOT.Char.GetLadyLord]'larının yardımı için yalvarıyorlar."

 agot_filler_dorne.0200.a:0 "Konuyu araştıralım."

 agot_filler_dorne.0200.a_tt:0 "Sen ve kâhyan [steward.GetCouncilTitle] köye gidip bu sorunu çözeceksiniz."

 agot_filler_dorne.0200.b:0 "Meh, kimin umurunda?"

 agot_filler_dorne.0200.b_tt:0 "Halk üzülecek."

 agot_filler_dorne.0201.t:0 "Kuyu Kuruyor"

 agot_filler_dorne.0201.desc:0 "Sen ve [steward.GetTitledFirstName] çöl köyüne vardınız ve söylentiler doğru çıktı: Bir zamanlar taşan kuyudan artık bir damla su bile çekilemiyor.\n\nHalka göre, bir tüccar grubu yeraltı pınarını delip suyu kendi arazilerini tarım için ıslah etmek amacıyla yönlendirmiş — bu da açıkça yasayı çiğnemek!"

 agot_filler_dorne.0201.a:0 "Tüccarlarla bir anlaşma yapalım...."

 agot_filler_dorne.0201.a_tt:0 "Susamış köylüleri görmezden gelip bir kese altını tercih ediyorsun."

 agot_filler_dorne.0201.b:0 "Bu olamaz! Küçük halkın arkasında duracağım."

 agot_filler_dorne.0201.b_tt:0 "Halka yardım ediyorsun, kuyunun önceki haline dönmesini sağlıyorsun."
