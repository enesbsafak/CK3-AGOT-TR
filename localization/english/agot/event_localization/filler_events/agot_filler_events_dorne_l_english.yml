### TODO NOT-IN-ST: agot_filler_dorne.0014.desc [AGOT: #S CRASH#! The inn door bangs open, and I see several Reachman knights strut into the hall. They jeer and jape as they pass several men sitting down, loudly whispering something about 'smelling Dornish'. I grip my tankard tightly as they approach the innkeep; I cringe as one of them spits in his face and snatches the flagon of wine from his hands. The men erupt into laughter as another knight grabs a whole roast chicken from the serving wench, grabbing her and holding her tightly. The innkeep shouts at them, but a quick blow to the face silences him.\n\nAs he rubs his face, his eyes meet mine... He knows I am a [ROOT.Char.GetLadyLord|l], I've eaten here before, after all... The look on his face is a plea for help...]
 agot_filler_dorne.0014.desc:0 "#S CRASH#! The inn door bangs open, and I see several Reachman knights strut into the hall. They jeer and jape as they pass several men sitting down, loudly whispering something about 'smelling Dornish'. I grip my tankard tightly as they approach the innkeep; I cringe as one of them spits in his face and snatches the flagon of wine from his hands. The men erupt into laughter as another knight grabs a whole roast chicken from the serving wench, grabbing her and holding her tightly. The innkeep shouts at them, but a quick blow to the face silences him.\n\nAs he rubs his face, his eyes meet mine... He knows I am a [ROOT.Char.GetLadyLord|l], I've eaten here before, after all... The look on his face is a plea for help..."
