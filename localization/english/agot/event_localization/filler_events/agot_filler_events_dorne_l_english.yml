### TODO NOT-IN-ST: agot_filler_dorne.0020.desc [AGOT: A bazaar has recently opened up in [agot_filler_dorne_0020_baazar_location.GetName]. Several foreign and Westerosi merchants have likewise set up shop, displaying a dazzling array of goods and services.\n\nWhile walking through the bazaar, one merchant catches my eye: he is a tall man with a plain face and a strange outfit. Behind him are two burly guards, each brandishing an arakh.\n\nThe man is selling hand-crafted jewelry. As I step closer, a young man roughly bumps into me, #N causing me to knock over — and break — the vendor's entire collection!#! The merchant howls with rage, and suddenly the guards seize me before I can even get up... The merchant demands immediate restitution, #italic or else!#!]
