### TODO NOT-IN-ST: agot_filler_dorne.0005.desc [AGOT: I reach into the bowl and pluck out a juicy and plump blood orange. A native fruit of Dorne, one of the many perks of ruling in Dorne is the cheap access to such a delicious and quenching fruit.\n\nI peel the orange, tossing the skin into the bowl, and I sink my teeth into the fruit. The juices flow all down my chin and dribble into my lap, but the taste, oh, the taste! It's so... quenchy.]
