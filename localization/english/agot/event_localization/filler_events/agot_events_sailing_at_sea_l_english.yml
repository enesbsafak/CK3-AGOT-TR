### TODO NOT-IN-ST: agot_sailing_at_sea.0003.desc [AGOT: Months spent at sea take their toll on any man. In the first few weeks, my diet hadn't been much different than it had been at home; as supplies dwindled, though, I was soon eating the same as my men. For a while yet, we still had our stores of salt beef and cured pork. Those days are long gone. My men and I have now been condemned to a diet of hardtack and rusk. \n\nThe tiredness and the aches started first, though it was easy enough to ignore. But, the aches got worse, and now whenever I stand, it feels as though the hells themselves are burning in my knees. The worst came this morning as I sat down to eat my hardtack; as I bit into it, one of my teeth came dislodged from my swollen, bloody gums...]
 agot_sailing_at_sea.0003.desc:0 "Months spent at sea take their toll on any man. In the first few weeks, my diet hadn't been much different than it had been at home; as supplies dwindled, though, I was soon eating the same as my men. For a while yet, we still had our stores of salt beef and cured pork. Those days are long gone. My men and I have now been condemned to a diet of hardtack and rusk. \n\nThe tiredness and the aches started first, though it was easy enough to ignore. But, the aches got worse, and now whenever I stand, it feels as though the hells themselves are burning in my knees. The worst came this morning as I sat down to eat my hardtack; as I bit into it, one of my teeth came dislodged from my swollen, bloody gums..."
