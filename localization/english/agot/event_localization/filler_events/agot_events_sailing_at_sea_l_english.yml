l_english:

 agot_sailing_at_sea.0001.t:0 "Denizde Kayıp"

 agot_sailing_at_sea.0001.desc:0 "Felaket! Kaptan, [current_location.GetName]'in sakin sularında pürüzsüz bir seyir yapacağımıza dair bizi temin etmişti; ama sanki onu kibrini ve küstahlığını cezalandırmak istercesine, ufukta kısa sürede karanlık bir kütle ağırlığını hissettirdi; gemimiz, azgın ve öfkeli dalgaların arasında savrularak sarsılmaya ve yalpalamaya başladı. \n\nKıyamet gibi esen fırtınanın kaosu içinde, şövalyelerimden biri olan [KnightDisaster.GetTitledFirstName]'in kan donduran bir çığlıkla denize sürüklendiğini gördüm! Fırtınanın gürültüsü arasında bile, dehşet verici uçurum onu sulu bir mezara sürüklemekle tehdit ederken, onun çaresiz korku çığlıklarını seçebiliyorum."

 agot_sailing_at_sea.0001.a:0 "Birisi, bir şey yapsın!"

 agot_sailing_at_sea.0001.a.toast1.t:0 "[KnightDisaster.GetTitledFirstName] Boğuldu!"

 agot_sailing_at_sea.0001.a.toast1.d:0 "Onu kurtarma çabasına rağmen, [KnightDisaster.GetTitledFirstName] ne yazık ki boğuldu!"

 agot_sailing_at_sea.0001.b:0 "Zavallı ruh; Tanrıların iradesi gizemli ve akıl ermezdir."

 agot_sailing_at_sea.0003.t:0 "Denizde Yaşam"

 agot_sailing_at_sea.0003.desc:0 "Denizde geçen aylar, her insandan bedelini alır. İlk birkaç hafta, beslenmem evdekinden pek farklı değildi; ancak erzaklar azaldıkça, kısa sürede adamlarımla aynı yemekleri yer oldum. Bir süre daha, tuzlu sığır eti ve kürlenmiş domuz eti stoğumuz vardı. O günler çoktan geride kaldı. Adamlarım ve ben artık peksimet ve bisküvi diyetine mahkûmuz. \n\nÖnce yorgunluk ve sızılar başladı, ama görmezden gelmek kolaydı. Ancak sızılar kötüleşti ve artık her ayağa kalktığımda, cehennemlerin ta kendisi dizlerimde yanıyormuş gibi hissediyorum. En kötüsü bu sabah peksimetimi yemek için oturduğumda geldi; ısırdığımda dişlerimden biri şişmiş, kanayan diş etlerimden sökülüverdi..."

 agot_sailing_at_sea.0003.a:0 "...Belki de evimize dönme zamanı gelmiştir."

 agot_health.safe_treatment.2.desc:0 "Hekimim [physician.GetTitledFirstName] tarafından muayene edildikten sonra, önümüzdeki haftalarda bol bol yatak istirahati yapmam gerektiği söylendi. Ayrıca elimden geldiğince çok meyve yemem de öğütlendi; özellikle limon, misket limonu ve portakal. Bunu yaparsam semptomlarımın kaybolacağına dair güvence verildi.\n"

 agot_sailing_at_sea.000444.end.desc:0 "\nNeyse ki [physician.GetTitledFirstName] haklı çıkmışa benziyor. Ağrılarım geçti, çürüklerim de; ve diş etlerim sonunda sürekli kanamayı kesti. Söylemeye gerek yok, denize bir daha dönersem birkaç fıçı kuru limon teknenin dibinde saklanacak."

 agot_sailing_at_sea.00044.d:0 "Liman'a hızla yanaşır yanaşmaz, hastalığımın çaresini belki onlar bilir diye Saray Hekimim [physician.GetFirstName]'i bulmak için aceleyle gemiden atlamıştım; semptomlarımı anlatmak için kalemin tıbbi bölümüne girdiğimde, Hekimim daha tek kelime edemeden beni durduruyor....."

 agot_sailing_at_sea.00044.d.court_physician.desc:0 "\n\n"My [ROOT.Char.GetLadyLord], I believe you may have Scurvy...I have a few ideas on how to help"."

 agot_sailing_at_sea.000444.t:0 "İskorbüt: Biraz Daha Parlak"

 agot_sailing_at_sea.000444.a:0 "Dünya biraz daha parlak görünüyor"

 agot_sailing_at_sea.000444.a.t:0 "Şey... kapı menteşesi mi?"

 agot_sailing_at_sea.0007.t:0 "Sancak tarafında yük!"

 agot_sailing_at_sea.0007.desc:0 "[current_location.GetName]'in sisli sularında seyrederken, karanlık gece uğursuz bir hava bürünüyor. Birden, gözcünün sesi gemide yankılanıyor. "Sancak tarafında biraz yük var, Kaptan!".\n\nSen ve mürettebatından birkaçı geminin kenarına koşuyorsunuz ve şok içinde bir yıkım manzarası görüyorsunuz. Yanmış ve kırılmış tahta kalaslar, dağılmış sandıklar, fıçılar ve kutular; hepsi okyanusun yüzeyinde süzülüyor; bir de altın bir sandık görüntüsü... \n\nBurada korkunç bir şey olduğu açık. [fellow_sailor.GetFirstName], araştırmak için bir kayık indirmeyi öneriyor; en azından sandığı almak için; ama bu yıkıma ne sebep olduysa hâlâ yakınlarda pusuda bekliyor olabileceğini biliyorsun."

 agot_sailing_at_sea.0007.a:0 "Hadi araştıralım!"

 agot_sailing_at_sea.0007.b:0 "Vaktimiz yok artık.."

 agot_sailing_at_sea.0008.t:0 "Sükûnet"

 agot_sailing_at_sea.0008.desc:0 "Gemiye küçük bir mesafe kala, mürettebat ve sen ileri kürek çekiyorsunuz; ileride bir sandık görünüyor. Bir şeylerin yolunda olmadığını ya da en azından beklenen gibi olmadığını fark etmeye başlıyorsun. \n\nSandık sandığın hareket ettiği görünüyor ve yaklaştıkça sana seslenen yatıştırıcı bir ses duyuyorsun. \n\nBu, huzur ve sükûnet dolu bir şarkı; yıllardır hissetmediğin şekilde seni sakinlik hissiyle dolduran, tüm stresi alan rahatlatıcı bir ezgi. Sesi takip etme arzusuna karşı koyamıyorsun ve yaklaştıkça ay ışığı çevrendeki sakin denizin üzerine vuruyor. Geminin artık görüş alanında olmadığını fark ediyorsun. Tamamen suyla kuşatılmışsın ve teknenin kenarından baktığında yüzeye bir figür çıkıyor..."

 agot_sailing_at_sea.0008.a:0 "Artık, rahatlayabilirim"

 agot_sailing_at_sea.0008.b:0 "Ben, ben gitmeliyim!"

 agot_sailing_at_sea.0009.t:0 "Kadın"

 agot_sailing_at_sea.0009.desc:0 "Figür suyun yüzeyine çıktığında, solgun ve pürüzsüz tenli, göğsü çıplak, zarif ipeksi saçları vücudunu örten bir kadın olduğunu görüyorsun. Yüzü büyüleyici; ruhunun ta derinliklerine bakıyormuş gibi görünen büyüleyici gözleri var. Şarkısını söylemeye devam ediyor ve kendini ona giderek daha da yaklaşmış buluyorsun; tek arzun onun kucağını hissetmek.\n\nYaklaşman için işaret ediyor ve yaklaştığında konuşuyor. \n\n"Sevgili denizcim, hayatının stresini, acısını ve dertlerini yüzüne kazınmış görebiliyorum. Şarkımı senin için söyledim. Yanıma gel, sana hayatta ihtiyacın olanı getireyim. Birlikte en büyük arzularını gerçekleştirebilirim!"

 agot_sailing_at_sea.0009.a:0 "Seni koruyabilirim! Bir talipyi ortadan yok edebilirim!"

 agot_sailing_at_sea.0009_a_tt:0 "#italic Kadın, [titles|E]'ine yönelik her türlü [claimant|E] ile başa çıkmana yardım etmeye söz veriyor.#!"

 agot_sailing_at_sea.0009.b:0 "Stresli görünüyorsun; o hizibinle başa çıkmana yardım edeyim..."

 agot_sailing_at_sea.0009_b_tt:0 "#italic Kadın, [claimant_factions|E] ile başa çıkmana yardım etmeye söz veriyor.#!"

 agot_sailing_at_sea.0009.c:0 "Ah sevgilim, gel bana senin o efendinden bahset."

 agot_sailing_at_sea.0009_c_tt:0 "#italic Kadın, zalim [liege|E]'in ile olan durumunu bildiğinden, [ROOT.Char.GetLiege.GetHerHim]'le başa çıkmana yardım etmeye söz veriyor.#!"

 agot_sailing_at_sea.0009.d:0 "[ROOT.Char.GetPrimarySpouse.GetSheHe]'in sana yaşattığı acıyı biliyorum, ama benimle gelebilirsin!"

 agot_sailing_at_sea.0009_d_tt:0 "#italic Kadın, sadakatsiz [spouse|E]'in yüzünden yaşadığın kırgınlığı görebiliyor; [ROOT.Char.GetPrimarySpouse.GetHerHim]'den kurtulmana yardım etmesine izin vermen için seni teşvik ediyor; karşılığında birlikte olmak istiyor.#!"

 agot_sailing_at_sea.0009.e:0 "Güç mü istiyorsun? Veraset basamaklarında yükselmek #italic kolay #! olabilir."

 agot_sailing_at_sea.0009_e_tt:0 "#italic Hırsını gören kadın, daha geniş hanedan veraset sıralamanı senin lehine değiştirmene yardım etmeye söz veriyor.#!"

 agot_sailing_at_sea.0009.f:0 "İkimiz de biliyoruz ki seni pek önemsemiyorlar; yardım etmeme izin ver..."

 agot_sailing_at_sea.0009_f_tt:0 "#italic Sana nasıl davrandıklarını gören kadın, doğrudan ailen içindeki veraset sıralamanı değiştirmene yardım etmeye söz veriyor.#"

 agot_sailing_at_sea.0009.g:0 "Seni kemiriyor değil mi? Her köşede rakipler..."

 agot_sailing_at_sea.0009_g_tt:0 "#italic Kadın, en büyük [rival|E]'inden dünyayı arındırmaya dair bir söz ortaya koyuyor!#"

 agot_sailing_at_sea.0009.h:0 "Buradan çıkmam gerek!"

 agot_sailing_at_sea.0009_h_tt:0 "#italic Kadını ve sözlerini geride bırakıyorsun.\n#"

 agot_sailing_at_sea.0010.t:0 "Şu... Siren mi?"

 agot_sailing_at_sea.0010.desc:0 "Uzanıp kadının elini tuttuğunda, aniden seni suya çekiyor ve denizin altına sürüklemeye başlıyor. Kavrayışına karşı çabalıyorsun ama nafile. Etrafına bakındığında, mürettebatının geri kalanının da aynı oyuna geldiğini fark ediyorsun; sirenler teknenin etrafını sarmış, onları suyun altına çekiyor.\n\nTüm gücünle savaşıp sirenin kavrayışından kurtulmaya çalışıyorsun ama nafile. Denizin derinliklerine giderek daha da aşağı çekiliyorsun ve hızlı davranmazsan günlerinin geri kalanını bir sirenin tutsağı olarak geçirmeye mahkûm olacağını biliyorsun."

 agot_sailing_at_sea.0010.a:0 "'Özgür kalmak için son bir çaba daha sarf ediyorsun!'"

 agot_sailing_at_sea.0010.a.success:0 "Kurtulup kayığa yeniden binmeyi başarıyorsun!"

 agot_sailing_at_sea.0010.a.failure:0 "Siren seni dibin derinliklerine sürüklüyor!"

 agot_sailing_at_sea.0011.t:0 "Denizdeki Nice Yaratıklar."

 agot_sailing_at_sea.0011.desc.dolphins:0 "Gökyüzü parlak, berrak bir mavi; geminin dümeninin arkasında dururken hava serin ve ferahlatıcı. Rüzgârlar yüzüne çarpıyor, güneş geminin üzerine vurup her yana sıcak bir ışıltı saçıyor. Taze deniz havasını solumak ve düşüncelerine dalmak için bir an duruyorsun.\n\n#bold;italic *ŞAP!*#!\n\nGeminin yan tarafından bir dizi su sıçraması duyuyorsun, küpeşteye gidip bakıyorsun ve şaşkınlıkla, suyun içinde yarışan bir yunus grubu görüyorsun. Sevimli sesler çıkarıyor ve hayatlarının keyfini çıkarıyor gibi görünüyorlar; denizde oynaşan bu muhteşem yaratıkların görüntüsüne gülümsemekten kendini alamıyorsun. \n\nDenizde yüzleştiğin tehlikelerden memnuniyetle karşılanan bir kaçış bu ve sürdüğü sürece bu huzur ve güzellik anının tadını çıkarmaya karar veriyorsun."

 agot_sailing_at_sea.0011.desc.whale:0 "Gökyüzü parlak, berrak bir mavi; geminin dümeninin arkasında dururken hava serin ve ferahlatıcı. Rüzgârlar yüzüne çarpıyor, güneş geminin üzerine vurup her yere sıcak bir ışıltı saçıyor. Taze deniz havasını solumak ve düşüncelerine dalmak için bir an duruyorsun.\n\nBirden, geminin yan tarafında kocaman bir su sıçraması ve fışkırtısı oluyor; ardından bir balina borusunun sesi geliyor. Küpeşteye koşup bakıyorsun ve şaşkınlıkla, zıplayışının ortasında sudan fırlayan bir kambur balina görüyorsun. \n\nEtkileyici bir manzara ve bu devasa yaratığa karşı hayranlık duymaktan kendini alamıyorsun."

 agot_sailing_at_sea.0011.a:0 "Ne manzara!"

 agot_sailing_at_sea.0011.b:0 "Mürettebat, bir şarkı söyleyelim!"

 agot_sailing_at_sea.0011.c:0 "Lanet balina, bu gemiyi tabutun yapacağım!"

 agot_sailing_at_sea.0011.c.success:0 "Balinayı başarıyla yakaladın!"

 agot_sailing_at_sea.0011.c.failure:0 "Balina kaçtı!"

 agot_sailing_at_sea.0011.c.injuredsuccess:0 "Balinayı yakaladın; bu sırada yaralandın"

 agot_sailing_at_sea.0011.c.injuredfailure:0 "Seni tekneden fırlatan balina kaçtı; seni yaraladı"

 agot_sailing_at_sea.0011.c.successtt:0 "Balinayı başarıyla yakalıyorsun"

 agot_sailing_at_sea.0011.c.failurett:0 "Balina kaçıyor"

 agot_sailing_at_sea.0011.c.injuredsuccesstt:0 "Balinayı yakalıyorsun ama yaralanıyorsun"

 agot_sailing_at_sea.0011.c.injuredfailurett:0 "Balina kaçıyor ve bu sırada seni yaralıyor"

 agot_sailing_at_sea.0011.c.death:0 "Balinayı yakalamaya çalışırken ölüyorsun"

 agot_sailing_at_sea.0011.c.deathtt:0 "Balina seni kayalara fırlatıyor"

 agot_sailing_at_sea.0012.t:0 "Korsanlar Gemiye Çıkmaya Hazırlanıyor!"

 agot_sailing_at_sea.0012.desc:0 "Adamlarıma savunma mevzilerini almalarını emrettim; güverteye atlayacak herkesle savaşmaya hazırdık; şövalyelerim ve ben, hele de bir Korsan'a karşı, savaşmadan yere serilmeyecektik!\n\nSayımız az olabilirdi, ama cesaretimiz vardı ve olabildiğince enerjimiz. \n\nKorsanlar yaklaşıp gemimizin yan tarafına kancalar fırlatırken kılıcımı çektim ve küpeştede durdum; kaptanı gözlerken, adamlarım da kendi rakiplerine göz dikiyordu; kaderimizle yüzleşmeye hazırdık. Uzun ve zorlu bir savaş olacaktı ama buna hazırdım. Ben bir hayatta kalandım."

 agot_sailing_at_sea.0012.desc.triedtorun:0 "Adamları elimden geldiğince yönettim; yelkenleri rüzgârla aynı anda hareket ettirdik, sert dönüşler denedik ve korsanlardan kaçabilmek umuduyla bir fırtınaya doğru yöneldik, ama nafile. Arayı kapatıyorlardı ve yaklaştıkça bağırışlarını ve naralarını duyabiliyordum.\n\nArtık kaçma düşüncesi çoktan kaybolmuştu. Ama şövalyelerim ve ben, savaşmadan yere serilmeyecektik. Mürettebatıma ve şövalyelerime daha fazla emir haykırdım; onları yaklaşan savaşa hazırlıyordum. Sayımız az olabilirdi, ama cesaretimiz vardı. \n\nKorsanlar yaklaşırken kılıcımı çektim ve küpeştede durdum; kaptanı gözlerken, adamlarım da kendi rakiplerine göz dikiyordu; kaderimizle yüzleşmeye hazırdık. Uzun ve zorlu bir savaş olacaktı ama buna hazırdım. Ben bir hayatta kalandım."

 agot_sailing_at_sea.0012.a:0 "Altının olmadığı bir dünyada, Kahraman olabilirdik!"

 agot_sailing_at_sea.0012.tooltip:0 "Karşı geminin kaptanına karşı düelloya girerken, şövalyelerinden bir grup da her biri bir saldırgana karşı teke tek düelloya girecek."

 agot_sailing_at_sea.0013.toast.title:0 "Gemiye Çıkma!"

 agot_sailing_at_sea.0013.friendlydefendervictory.t:0 "Gemiye çıkma girişimine karşı savunurken, [sc_loser.GetFirstNameNoTooltip]'i çarpışmada öldürüyorsun!"

 agot_sailing_at_sea.0013.pirateattackervictory.t:0 "Gemiye çıkmaya çalışırken, [sc_loser.GetFirstNameNoTooltip]'i çarpışmada öldürüyorsun!"

 agot_sailing_at_sea.0013.friendlydefenderloser.t:0 "Gemiye çıkma girişimine karşı savunurken, korsan [sc_victor.GetFirstNameNoTooltip] tarafından karnından bıçaklanıyorsun!"

 agot_sailing_at_sea.0013.pirateattackerloser.t:0 "Gemiye çıkmaya çalışırken, [sc_victor.GetFirstNameNoTooltip] tarafından yere seriliyorsun!"

 agot_sailing_at_sea.0013.friendlyoutcome_toast.t:0 "Savaşırken, [knight|E]'in [sc_victor.GetFirstNameNicknamed]'in korsan [sc_loser.GetFirstNameNoTooltip]'i yere serdiğini görmek için göz atıyorsun!"

 agot_sailing_at_sea.0013.piratewinoutcome_toast.t:0 "Savaşırken, korsan [sc_victor.GetFirstNameNicknamed]'in [knight|E]'in [sc_loser.GetFirstNameNoTooltip]'i yere serdiğini görmek için göz atıyorsun!"

