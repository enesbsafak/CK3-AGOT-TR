### TODO NOT-IN-ST: agot_sailing_at_sea.0008.desc [AGOT: Already a small distance from the ship, the crew and you oar forward, the sight of a chest ahead. You begin to realize that something isn't right, or well; not as expected. \n\nThe supposed chest seems to be moving, and as you get closer, you hear a soothing voice calling to you. \n\nIt's a song of peace and tranquillity, a tune of relaxation, one that fills you with a sense of calm, relieving of all stress, in a way that you haven't felt in years. You can't resist the desire to follow the voice, and as you draw closer, the moonlight shines down upon the calm sea around you. You realize that your ship is no longer in view. You're completely surrounded by water, and as you look over the side of the boat, a figure breaches the surface...]
 agot_sailing_at_sea.0008.desc:0 "Already a small distance from the ship, the crew and you oar forward, the sight of a chest ahead. You begin to realize that something isn't right, or well; not as expected. \n\nThe supposed chest seems to be moving, and as you get closer, you hear a soothing voice calling to you. \n\nIt's a song of peace and tranquillity, a tune of relaxation, one that fills you with a sense of calm, relieving of all stress, in a way that you haven't felt in years. You can't resist the desire to follow the voice, and as you draw closer, the moonlight shines down upon the calm sea around you. You realize that your ship is no longer in view. You're completely surrounded by water, and as you look over the side of the boat, a figure breaches the surface..."
