### TODO NOT-IN-ST: agot_sailing_at_sea.0010.desc [AGOT: As you reach out and take the woman's hand, she suddenly yanks you into the water and begins to drag you under the sea. You struggle against her grip, but it's no use. As you look around, you realize that the rest of your crew has fallen for the same trick — sirens are surrounding the boat, pulling them under the water.\n\nYou fight with all your might, trying to break free from the siren's grasp, but it's no use. You're being pulled further and further down into the depths of the sea, and you know that if you don't do something fast, you'll be doomed to spend the rest of your days as a prisoner of the siren.]
 agot_sailing_at_sea.0010.desc:0 "As you reach out and take the woman's hand, she suddenly yanks you into the water and begins to drag you under the sea. You struggle against her grip, but it's no use. As you look around, you realize that the rest of your crew has fallen for the same trick — sirens are surrounding the boat, pulling them under the water.\n\nYou fight with all your might, trying to break free from the siren's grasp, but it's no use. You're being pulled further and further down into the depths of the sea, and you know that if you don't do something fast, you'll be doomed to spend the rest of your days as a prisoner of the siren."
