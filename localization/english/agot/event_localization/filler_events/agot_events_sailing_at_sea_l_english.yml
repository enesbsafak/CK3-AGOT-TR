### TODO NOT-IN-ST: agot_sailing_at_sea.0011.desc.dolphins [AGOT: The sky is a bright, clear blue, and the air is cool and refreshing as you stand behind the helm of your ship. The winds blow across your face, and the sun shines down upon your ship, casting a warm glow all over. You take a moment to breathe in the fresh sea air and reflect on your thoughts.\n\n#bold;italic *SPLASH*#!\n\nYou hear a series of splashes off the side of the ship, You move to the railing and look over, and to your surprise, you see a group of dolphins racing through the water. Making adorable sounds and seeming to be having the time of their lives, You can't help but smile at the sight of these gorgeous creatures frolicking in the sea. \n\nIt's a welcome distraction from the dangers that you've faced at sea, and you decide to enjoy this moment of peace and beauty while it lasts.]
 agot_sailing_at_sea.0011.desc.dolphins:0 "The sky is a bright, clear blue, and the air is cool and refreshing as you stand behind the helm of your ship. The winds blow across your face, and the sun shines down upon your ship, casting a warm glow all over. You take a moment to breathe in the fresh sea air and reflect on your thoughts.\n\n#bold;italic *SPLASH*#!\n\nYou hear a series of splashes off the side of the ship, You move to the railing and look over, and to your surprise, you see a group of dolphins racing through the water. Making adorable sounds and seeming to be having the time of their lives, You can't help but smile at the sight of these gorgeous creatures frolicking in the sea. \n\nIt's a welcome distraction from the dangers that you've faced at sea, and you decide to enjoy this moment of peace and beauty while it lasts."
### TODO NOT-IN-ST: agot_sailing_at_sea.0011.desc.whale [AGOT: The sky is a bright, clear blue, and the air is cool and refreshing as you stand behind the helm of your ship. The winds blow across your face, and the sun shines down upon your ship, casting a warm glow over everything. You take a moment to breathe in the fresh sea air and reflect on your thoughts.\n\nSuddenly, there's a massive splash and spout of water off the side of the ship, followed by the sound of a whale's horn. You rush to the railing and look over, and to your surprise, you see a humpback whale breaching the water in the middle of a jump. \n\nIt's an impressive sight, and you can't help but be in awe of the massive creature.]
 agot_sailing_at_sea.0011.desc.whale:0 "The sky is a bright, clear blue, and the air is cool and refreshing as you stand behind the helm of your ship. The winds blow across your face, and the sun shines down upon your ship, casting a warm glow over everything. You take a moment to breathe in the fresh sea air and reflect on your thoughts.\n\nSuddenly, there's a massive splash and spout of water off the side of the ship, followed by the sound of a whale's horn. You rush to the railing and look over, and to your surprise, you see a humpback whale breaching the water in the middle of a jump. \n\nIt's an impressive sight, and you can't help but be in awe of the massive creature."
