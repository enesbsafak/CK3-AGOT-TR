### TODO NOT-IN-ST: agot_sailing_at_sea.0012.desc [AGOT: I commanded my men into defensive positions, ready to fight any who'd swing onto deck, my knights and I weren't about to go down without a fight, especially not against no Pirate!\n\nWe might not have had the numbers, but we had the courage, and we had all the energy we could. \n\nAs the pirates closed in, tossing hooks into the side of our ship, I drew my sword and stood at the rail; eyeing the captain, with my men eying opponents of their own, ready to face our fates. It was going to be a long, hard fight, but I was ready for it. I was a survivor.]
 agot_sailing_at_sea.0012.desc:0 "I commanded my men into defensive positions, ready to fight any who'd swing onto deck, my knights and I weren't about to go down without a fight, especially not against no Pirate!\n\nWe might not have had the numbers, but we had the courage, and we had all the energy we could. \n\nAs the pirates closed in, tossing hooks into the side of our ship, I drew my sword and stood at the rail; eyeing the captain, with my men eying opponents of their own, ready to face our fates. It was going to be a long, hard fight, but I was ready for it. I was a survivor."
### TODO NOT-IN-ST: agot_sailing_at_sea.0012.desc.triedtorun [AGOT: I commanded the men the best I could, we moved the sails in unison with the winds, tried hard turns, and heading towards a storm, hoping to outrun the pirates, but it was no use. They were gaining on us, and I could hear their whoops and hollers as they closed in.\n\nThe thought of escaping now was doomed. But my knights and I weren't about to go down without a fight. I barked more orders to my crew and knights, preparing them for the battle to come. We might not have had the numbers, but we had the courage. \n\nAs the pirates closed in, I drew my sword and stood at the rail; eyeing the captain, with my men eying opponents of their own, ready to face our fates. It was going to be a long, hard fight, but I was ready for it. I was a survivor.]
 agot_sailing_at_sea.0012.desc.triedtorun:0 "I commanded the men the best I could, we moved the sails in unison with the winds, tried hard turns, and heading towards a storm, hoping to outrun the pirates, but it was no use. They were gaining on us, and I could hear their whoops and hollers as they closed in.\n\nThe thought of escaping now was doomed. But my knights and I weren't about to go down without a fight. I barked more orders to my crew and knights, preparing them for the battle to come. We might not have had the numbers, but we had the courage. \n\nAs the pirates closed in, I drew my sword and stood at the rail; eyeing the captain, with my men eying opponents of their own, ready to face our fates. It was going to be a long, hard fight, but I was ready for it. I was a survivor."
