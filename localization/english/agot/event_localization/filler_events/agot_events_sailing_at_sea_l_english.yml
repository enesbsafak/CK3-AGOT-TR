 agot_sailing_at_sea.0015.t:0 "[current_location.GetName]'in Suları"

 agot_sailing_at_sea.0015.desc:0 "Geminin güvertesinde dururken bir huzursuzluk hissettim, [current_location.GetName]'in uçsuz bucaksız genişliğine bakıyordum. Bu hain suların kaçakçılara ve korsanlara yuva olduğu biliniyordu ve bu tehlikeli gruplardan biriyle karşılaşmamızın an meselesi olduğunu biliyordum. Ama gün ilerledikçe tehlikeden uzak görünüyorduk. Sular sakindi ve ufukta başka gemi izi yoktu. [current_location.GetName]'in tehlikelerinden bir şekilde kaçınmayı başardığımızı düşünerek gevşemeye başladım.\n\nAncak güneş batmaya başladığında korkularım gerçek oldu. Ufukta yüksek hızla yaklaşan bir gemi görebiliyordum. Yırtık yelkenleri, savaş için inşa edilmiş gövdesi ve uğursuz bir havası vardı. Mürettebatıma bağırarak emirler verirken kalbim hızla çarpıyordu; yaklaşan saldırıya karşı kendimizi savunmaya hazırlanıyorduk."

 agot_sailing_at_sea.0015.a:0 "Buradan kaçmayı deneyelim!"

 agot_sailing_at_sea.0015.toast:0 "Kaçtı!"

 agot_sailing_at_sea.0015.toast_tooltip:0 "Korsanlardan kaçıyorsun!"

 agot_sailing_at_sea.0015.toast1:0 "Yakalandı!"

 agot_sailing_at_sea.0015.toast_tooltip1:0 "Korsanlar sana yetişti ve gemiye çıkmaya hazırlanıyorlar!"

 agot_sailing_at_sea.0015.b.option_tooltip:0 "Korsanlarla savaşmak için ayakta duruyorsun!\n\nKarşı geminin kaptanına karşı düelloya girerken, şövalyelerinden bir grup da her biri bir saldırgana karşı teke tek düelloya girecek."

 agot_sailing_at_sea.0015.option_tooltip:0 "Korsanlar sana yetişiyor ve gemiye çıkmaya hazırlanıyor."

 agot_sailing_at_sea.0015.b:0 "Durup savaşalım! Adamlar, savaşa hazırlanın!"

 agot_sailing_at_sea.0016.t:0 "Rotadan Sürüklendik!"

 agot_sailing_at_sea.0016.desc:0 "Rüzgârın seni rotandan saptırmasıyla ilgili bir şey"

 agot_sailing_at_sea.0016.a:0 "Ahhh"

 agot_sailing_at_sea.0016.a.tooltip:0 "Sen ve mürettebatın rotadan saparak yakındaki bir eyalete sürükleneceksiniz!"

 agot_sailing_at_sea.0018.t:0 "Hayalet Gemi"

 agot_sailing_at_sea.0018.desc:0 "Rüzgâr uluyor, bulutlar karanlık ve deniz gemiye vurup çalkalanıyor; "Denizde geçen yıllarımda daha kötü fırtınalarla yüzleştim," dedi kıdemli gemicim. Fırtınalar, deniz canavarları ve hain kayalık kıyılar hep pusuda bekliyordu; mürettebatın ve geminin canını almaya hazırdı. Ama bu sefere çıktığımızda, daha ürkütücü ve açıklanamaz bir şeyle karşılaştık.\n\n[current_location.GetName]'in karanlık, sisli sularında seyrediyorduk ki mürettebatımdan biri ufukta bir gemi fark etti. \n\nİlk başta dost bir gemi olduğunu sandık, ama yaklaştıkça bir şeylerin yolunda olmadığını fark ettik. Gemi eski ve yıpranmıştı; yırtık pırtık yelkenleri ve hayaletimsi bir baş yalpa figürü vardı. Ve en garibi, güvertede tek bir canlı görünmüyordu."

 agot_sailing_at_sea.0018.a:0 "Hayaletleri hayalet çayırlarına bırakalım."

 agot_sailing_at_sea.0018.a.tooltip:0 "Hayalet gemiden kaçınacaksın."

 agot_sailing_at_sea.0018.b:0 "Araştırmalıyız."

 agot_sailing_at_sea.0018.b.tooltip:0 "Hayalet gemiye yaklaşıp araştıracaksın."

 agot_sailing_at_sea.0018.c.tooltip:0 ""

 agot_sailing_at_sea.0018.d.tooltip:0 ""

 agot_sailing_at_sea.0019.t:0 "Uzakta, hâlâ orada"

