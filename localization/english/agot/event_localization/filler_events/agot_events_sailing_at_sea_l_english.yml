### TODO NOT-IN-ST: agot_sailing_at_sea.0001.desc [AGOT: Disaster! The captain had assured us that it would be smooth sailing through the placid waters of the [current_location.GetName], but as if to castigate him for his arrogance and presumption, a gathering darkness soon loomed heavy on the horizon; and our vessel began to buck and heave, cast about by wild and furious waves. \n\nIn the chaos of the raging storm, I saw one of my knights, [KnightDisaster.GetTitledFirstName], swept overboard with a blood-curdling scream! Even amidst the tempest's din, I can make out his desperate cries of terror as the ghastly abyss threatens to drag him down to a watery grave.]
 agot_sailing_at_sea.0001.desc:0 "Disaster! The captain had assured us that it would be smooth sailing through the placid waters of the [current_location.GetName], but as if to castigate him for his arrogance and presumption, a gathering darkness soon loomed heavy on the horizon; and our vessel began to buck and heave, cast about by wild and furious waves. \n\nIn the chaos of the raging storm, I saw one of my knights, [KnightDisaster.GetTitledFirstName], swept overboard with a blood-curdling scream! Even amidst the tempest's din, I can make out his desperate cries of terror as the ghastly abyss threatens to drag him down to a watery grave."
