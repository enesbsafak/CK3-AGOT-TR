### TODO NOT-IN-ST: agot_sailing_at_sea.0015.desc [AGOT: As I stood on the deck of the ship, I felt an unease, gazing out at the vast expanse of the [current_location.GetName]. These treacherous waters were known to be home to smugglers and pirates, and I knew that it was only a matter of time before we encountered one of these dangerous groups. But as the day wore on, it seemed we were in the clear. The waters were calm and there was no sign of any other ships on the horizon. I started to relax, thinking that we had somehow managed to avoid the perils of the [current_location.GetName].\n\nHowever, as the sun began to set, my fears were realized. On the horizon, I could see a ship approaching at high speed. It had torn sails, a hull built for battle, and an ominous aura. My heart raced as I shouted orders to my crew, preparing to defend ourselves against the impending attack.]
 agot_sailing_at_sea.0015.desc:0 "As I stood on the deck of the ship, I felt an unease, gazing out at the vast expanse of the [current_location.GetName]. These treacherous waters were known to be home to smugglers and pirates, and I knew that it was only a matter of time before we encountered one of these dangerous groups. But as the day wore on, it seemed we were in the clear. The waters were calm and there was no sign of any other ships on the horizon. I started to relax, thinking that we had somehow managed to avoid the perils of the [current_location.GetName].\n\nHowever, as the sun began to set, my fears were realized. On the horizon, I could see a ship approaching at high speed. It had torn sails, a hull built for battle, and an ominous aura. My heart raced as I shouted orders to my crew, preparing to defend ourselves against the impending attack."
