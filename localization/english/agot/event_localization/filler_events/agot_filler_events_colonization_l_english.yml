 harmonious_colony_county_modifier_desc:0 "Bu bölgedeki çeşitli rakip gruplar bir uzlaşmaya vardı ve gücünü artırmak için etkili bir şekilde birlikte çalışıyor."

 agot_filler_colonization.1007.t:0 "[colony_province.GetNameNoTooltip]: Boykot"

 agot_filler_colonization.1007.desc.1.steward:0 "Kahyam,"

 agot_filler_colonization.1007.desc.1.advisor:0 "Danışmanım,"

 agot_filler_colonization.1007.desc.2:0 "[steward.GetFirstName] kapıma tıklıyor, yüzü her zamankinden daha asık. [steward.GetSheHe|U] loncalarla pazarlık ederek yıpratıcı bir gün geçirmiş ve görünüşe göre bu görüşmeler sonuçsuz kalmış.\n\n"Neden her lonca üyesi bir araya geldiğinde bu, halka karşı bir komplo gibi hissettiriyor? [colony_province.GetName]'deki kolonimize giden ticaret yolundaki vergilerin çok yüksek olduğundan şikâyet ediyorlar ve orada üretilen her türlü malı boykot etmekle tehdit ediyorlar. Ekonomisini şimdi sakatlarlarsa, doğum anında boğmuş olurlar. Onları ikna etmeye çalıştım, ama hiçbir şey işe yaramadı. Korkarım araya girmen gerekebilir..."\n\nHaber karşısında [steward.GetHerHis] öfkesini paylaşıyorum. Neden bu kadar çok şey bu açgözlü lonca üyelerine bağlı olmak zorunda? Bir şeyler yapılması gerekecek."

 agot_filler_colonization.1007.a:0 "Belki vergilerde geçici bir indirim onları susturur?"

 reduced_taxes_on_guilds_modifier:0 "Azaltılmış Vergiler"

