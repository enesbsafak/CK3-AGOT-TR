 agot_filler_colonization.1009.t:0 "[colony_province.GetNameNoTooltip]: Maden Arama"

 agot_filler_colonization.1009.desc.1.steward:0 "Kahyam,"

 agot_filler_colonization.1009.desc.1.advisor:0 "Danışmanım,"

 agot_filler_colonization.1009.desc.2:0 "[steward.GetFirstName] yüzünde kocaman bir gülümsemeyle salonlarımda yanıma yaklaşıyor. Belki de bu seferlik iyi bir haber verecektir...\n\n"[ROOT.Char.GetTitleAsNameNoTooltip], [colony_province.GetName]'deki kolonistlerimizden iyi haber aldım! [mineral_province.GetName]'in yaylalarında haydut ararken keşfe çıkan ekipten biri, kayalık bir çıkıntıda güçlü bir değerli maden damarı buldu. Yerleşimciler şimdi gelecekteki zenginlik hayalleriyle heyecanla uğulduyor ve arazinin bir keşfini organize etmen için sana yalvarıyor."\n\nBu bir başlangıç yatırımı gerektirse de, gerçekten önemli bir maden yatağı bulduysalar, yıllarca servet sağlayabilir..."

 agot_filler_colonization.1009.a:0 "[mineral_province.GetNameNoTooltip] için derhal bir keşif çalışması emret!"

 rich_mineral_deposit_province_modifier:0 "Zengin Maden Yatağı"

