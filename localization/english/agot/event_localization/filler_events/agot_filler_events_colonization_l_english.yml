 corrupt_governor_county_modifier_desc:0 "Bu bölge, yozlaşmış bir yönetici memurun gözetimi altında acı çekiyor."

 agot_filler_colonization.1005.c:0 "[governor.GetSheHe] bana bir pay verse, göz yumabilirdim."

 unofficial_income_modifier:0 "Gayriresmî Gelir"

 unofficial_income_modifier_desc:0 "Bu karakter, el altından yöntemlerle ek gelir elde ediyor."

 agot_filler_colonization.1006.t:0 "[colony_province.GetNameNoTooltip]: Sömürge Kan Davası"

 agot_filler_colonization.1006.desc:0 "Danışmanlarım, [colony_province.GetName]'deki yeni kurulan kolonimin yerel liderleri arasında, yerleşimlerinin gelecekteki yönü konusunda süregelen bir anlaşmazlığa müdahale etmemi istedi.\n\n[merchant.GetFirstName], bölgenin önde gelen bir tüccarı ve yerel halkın refahını artırmak için altınlarını yerel işletmeleri geliştirmeye ve diğer pazarlara erişimi iyileştirmeye yatırmaları gerektiğini savunuyor.\n\nBu arada, yerel milisin lideri [militia.GetFirstName], yatırımın koloninin çıkarlarını savunmak için askerî gücü güçlendirmeye yönlendirilmesi gerektiğini savunuyor.\n\nDurum bir çıkmazda ve bu kan davasını çözmem için bana bakıyorlar. Vereceğim karar muhtemelen eyaletin yönünü yıllarca etkileyecek..."

 agot_filler_colonization.1006.a:0 "Güçlü bir ordu olmadan savunmasız birer hedefiz."

 agot_filler_colonization.1006.b:0 "Güçlü bir ekonomi herkese fayda sağlar."

