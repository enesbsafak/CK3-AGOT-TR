 agot_filler_colonization.1009.b:0 "Bana göre altın israfı gibi..."

 agot_filler_colonization.1010.t:0 "[colony_province.GetNameNoTooltip]: Kurt Tehdidi"

 agot_filler_colonization.1010.desc:0 "[colony_province.GetName]'e akan yerleşimcilerle birlikte çeşitli otlayan sürüleri de geliyor — ağırlıklı olarak koyunlar, ama başkaları da var. Ancak bu serbest dolaşan sürülerin göçü başka yeni gelenleri de çekmiş görünüyor...\n\nYeni ve nispeten korumasız av bolluğuyla kurtlar eyalette daha fazla sayıda görünmeye başladı.\n\nHenüz yerleşimcilere zarar vermediler, ama hayvanlarının kaybı, dolayısıyla geçim kaynakları ve değerli besin kaynaklarının kaybı hakkında şikâyet almaya devam ediyoruz.\n\nBu sorunu yakında çözmem gerekecek, yoksa yeni kolonimin sarsılması riskini alırım."

 agot_filler_colonization.1010.a:0 "Lanet olası kurtlar!"

 agot_filler_colonization.1011.t:0 "[colony_province.GetNameNoTooltip]: Haydut Bölgesi"

 agot_filler_colonization.1011.desc:0 "[colony_province.GetName]'in sarp uç bölgelerinde, iktidarımın otoritesi en iyi ihtimalle zayıf. Altyapımız asgari düzeyde ve öncelikle koloniyi ayakta tutmaya adanmış durumda. Bu yüzden kötü şöhretli kimseler çoğu zaman sahte isimlerle oraya sızar, adaletten ve önceki kötülüklerinin sonuçlarından kaçarlar.\n\nKendi kendilerini 'özgür insanlar' ilan eden, kimseye hesap vermeden vahşi ve özgür yaşayan bu kişiler romantik ve hatta çekici görünebilir, ama bu büyük ölçüde bir yanılsamadır; alçakça işleri ve zalim eylemleri örten bir perdedir.\n\nSınır boyları çoğu zaman haydut ve eşkıyaların sığınağına dönüşür ve burada da öyle olmuş."

 agot_filler_colonization.1011.a:0 "O haylaz haydutlar!"

 agot_filler_colonization.1012.t:0 "[colony_province.GetNameNoTooltip]: Özerklik Talebi"

 agot_filler_colonization.1012.desc:0 "[colony_province.GetName]'deki yerleşimin ilk kuruluşundan bu yana epey zaman geçti. Koloniden gelen ilk raporlar olumlu oldu ve işler sorunsuz ilerledi.\n\nYerleşimden gelen bir sonraki raporu, kolonistlerin temsilcisi seçilen [colonist.GetFirstName] getiriyor. "[ROOT.Char.GetTitleAsNameNoTooltip], ben ve yerleşimci arkadaşlarım özerklik talebiyle huzuruna çıkıyoruz," diyor [colonist.GetSheHe] — benim için büyük sürpriz. "Çok çalıştık ve hedeflerimize planlanandan çok daha erken ulaştık. Böyle bir özveri bir ödülü hak eder, katılmaz mısınız?"\n\nFinanse ettiğim koloni için yarı bağımsızlık istemek gerçekten de cüretkâr bir talep. Öte yandan, taleplerini kabul etmek karşılıklı faydalar doğurabilir..."

 agot_filler_colonization.1012.tt:0 "[colony_province.GetNameNoTooltip]'deki koloni tamamlandı"

 agot_filler_colonization.1012.a:0 "Olur. Bana haraç ödeyin, kendinizi yönetebilirsiniz."

 agot_filler_colonization.1012.b:0 "Vasallarım olarak, size adil muamele ve koruma sağlardım."

 agot_filler_colonization.1012.b.tt:0 "[colonist.GetFirstNameNoTooltip]'i vassalın olarak kalmaya ikna etmeye çalışıyorsun"

 agot_filler_colonization.1012.b.success:0 "Başarı - [colonist.GetFirstNameNoTooltip] bağlılık yemini etti"

 agot_filler_colonization.1012.b.failure:0 "Başarısızlık - Yerleşimciler otoriteni reddediyor"

 agot_filler_colonization.1012.c:0 "[colony_province.GetNameNoTooltip] üzerindeki hüküm benim, kimsenin değil!"

 agot_filler_colonization.1012.c.success:0 "[colonist.GetFirstNameNoTooltip]'i tutukluyor ve [colony_province.GetNameNoTooltip]'i yatıştırıyorsun"

 agot_filler_colonization.1012.c.failure:0 "[colonist.GetFirstNameNoTooltip] elinden kurtuluyor"

 agot_filler_colonization.1013.t:0 "[colony_province.GetNameNoTooltip]: Şaşırtıcı İlerleme"

 agot_filler_colonization.1013.desc:0 "Kolonideki [colony_province.GetName] yerleşiminden en son ilerleme raporları geldi. Onları incelemeye başladığımda, işçilerin şaşırtıcı bir hızla ilerleme kaydettiği ve aslında koloniyi planlanandan çok daha önce inşa etmeyi bitirdikleri ortaya çıkıyor!\n\nBu da [colony_province.GetName]'deki toprağın, şans ve çevredeki vahşi doğadan kaynaklanan aksaklıkların olmaması sayesinde tamamlandığı anlamına geliyor.\n\n[ROOT.Char.GetPrimaryTitle.GetName] için gerçekten de büyük bir gün!"

 agot_filler_colonization.1013.a:0 "Bu mükemmel bir haber!"

 agot_filler_colonization.1013.a.tt:0 "[colony_province.GetName]'deki koloni tamamlandı"

 agot_filler_colonization.1014.t:0 "[colony_province.GetNameNoTooltip]: Sapkınların Yükselişi"

 agot_filler_colonization.1014.desc:0 "[colony_province.GetName]'deki yerleşimden bana mühürlü bir mektup ulaşıyor. Yerel liderlerden biri olan [heretic_colonist.GetFirstName] tarafından gönderilmiş. Görünüşe göre yerleşim beklenenden hızlı tamamlanmış, ama işçiler [heretical_faith.GetName] inancını takip etmeye başlamış!\n\nYerleşimdeki beklenmedik ilerlemeye sevinmem gerekirken, bu inanç sapması göz ardı edemeyeceğim bir konu. Bu sapkınlığın devamına izin mi vermeliyim, yoksa bir an önce kökünü mü kurutmalıyım?"

 agot_filler_colonization.1014.tt:0 "[colony_province.GetName]'deki koloni tamamlandı"

 agot_filler_colonization.1014.a:0 "İyi iş çıkardılar. Sapkınlıklarına izin vereceğim."

 agot_filler_colonization.1014.b:0 "Doğru yoldan sapmaya nasıl cüret ederler?"

 agot_filler_colonization.1014.b.tt:0 "Sapkınları tutuklamaya çalışıyorsun"

 agot_filler_colonization.1014.b.success:0 "Sapkın lideri yakalıyorsun"

 agot_filler_colonization.1014.b.failure:0 "[heretic_colonist.GetFirstName] elinden kurtuluyor"

 agot_filler_colonization.1014.b.failure.tt:0 "Öfkelenen kolonistler bağımsızlıklarını ilan ediyor"

 agot_filler_colonization.1014.c:0 "Belki bir uzlaşma bulabiliriz?"

 agot_filler_colonization.1014.c.tt:0 "Yerleşimcileri sapkınlığı reddetmeye ikna etmeye çalışıyorsun"

 agot_filler_colonization.1014.c.success:0 "Yerleşimcileri ikna edebiliyorsun"

 agot_filler_colonization.1014.c.failure:0 "Sözlerin etkisiz kalıyor"
