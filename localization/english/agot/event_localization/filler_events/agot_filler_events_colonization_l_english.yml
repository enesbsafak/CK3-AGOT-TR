 agot_filler_colonization.0001.t:0 "[colony_province.GetNameNoTooltip]: Sincap"

 agot_filler_colonization.0001.desc:0 "[colony_province.GetName] kolonimi ziyarete giderken, maiyetim ve ben ağaçların arasında hafif bir yemek için mola veriyoruz. Kendimi düşüncelere dalmış buluyorum, diyarımın karşılaştığı en güncel zorlukları kafamda evirip çeviriyorum. Aniden, hayalimden üstümüzdeki dallarda bir hışırtı koparıyor. Karanlıkta, sesin kaynağını seçebilmem bir anımı alıyor — parlak siyah bir sincap.\n\nBana bakıyor. Ben de ona bakıyorum. O boncuk gözlerinde bir şey bana kötü niyetli gibi geliyor."

 agot_filler_colonization.0001.a:0 "Defol, haşere!"

 agot_filler_colonization.0001.a.success:0 "Havada süzülen kemirgeni elinle savuşturuyorsun"

 agot_filler_colonization.0001.a.failure:0 "Sincap pençelerini gözüne geçiriyor"

 agot_filler_colonization.0001.b:0 "Muhafızlar, imdat!"

 agot_filler_colonization.0001.c:0 "Muhtemelen bir şey değildir."

 agot_filler_colonization.0002.t:0 "[colony_province.GetNameNoTooltip]: Beyaz Geyik"

 agot_filler_colonization.0002.desc:0 "[colony_province.GetName] kolonimin yakınındaki dolambaçlı orman patikalarını keşfe çıkıyorum; kadim ormanın olağanüstü sıklığına hayret ediyorum. Bazı yerlerde ağaçlar neredeyse gövde gövdeye büyüyor. Devrilmiş kuru odunlarda ışıldayan mantarlar filizleniyor. Yaşayan ağaçlar asma ve sarmaşıklarla örtülü, süngerimsi yosunlarla ve sürünen likenlerle kaplı. Hava, canlı hayatın bin kokusu ve çürümenin pis kokusuyla keskin.\n\nAniden onu görüyorum. Kanopi kırıp ilahi bir mızrak gibi inen bir ışık huzmesine yakalanmış: buz beyazı, bir an bana dikilen kehribar gözlü kocaman bir geyik.\n\nSonra, homurdanarak nefes verip beyaz geyik patikada sıçrayarak uzaklaşıyor. Arkamda maiyetimin yaylarını germe sesini duyabiliyorum."

 agot_filler_colonization.0002.a:0 "Geyiği bizzat ben yere sereceğim!"

 agot_filler_colonization.0002.a.success:0 "Yaratığı öldürüyorsun"

 agot_filler_colonization.0002.a.failure:0 "Azgın canavar, kaçmadan önce seni alt ediyor"

 agot_filler_colonization.0002.a.critical_failure:0 "Ölümcül şekilde yaralanıyorsun"

 agot_filler_colonization.0002.b:0 "Çabuk, [martial_companion.GetFirstNameNoTooltip], onu yere indir!"

 agot_filler_colonization.0002.b.success:0 "[martial_companion.GetSheHe|U] yaratığı öldürüyor"

 agot_filler_colonization.0002.b.failure:0 "Azgın canavar, kaçmadan önce [martial_companion.GetHerHim]'i alt ediyor"

 agot_filler_colonization.0002.b.critical_failure:0 "[martial_companion.GetSheHe|U] ölümcül şekilde boynuzlanıyor"

 agot_filler_colonization.0002.c:0 "Beyaz geyik kutsaldır; bırakalım rahat etsin."

 agot_filler_colonization.0003.t:0 "[colony_province.GetNameNoTooltip]: Çorak Arazi"

 agot_filler_colonization.0003.desc:0 "Sonunda [colony_province.GetName]'deki kolonimi denetlemek için zaman buldum. Yolculuk uzun ve yorucuydu, ama yerleşime varınca keyfim anında yerine geliyor. Sınır ruhunu neredeyse koklayabiliyorum.\n\nKoloninin içi bir faaliyet kovanı; baltaların oduna vuruşu ve çekiçlerin örslere çınlayışı tepelerde yankılanıyor, çalışırken sık sık kendiliğinden şarkıya boğulan yerleşimcilerin sesleri gibi. Sağlıklı ve dayanıklı bir halk ve onların efendisi olmaktan onur duyuyorum.\n\nKayalık yaylalar ekime elverişsiz ve kolonistlerim, hem besin hem de giysilik post sağlayacak dayanıklı koyun ve keçi türlerine acil ihtiyaç olduğunu bildiriyor. Koloni ticaret için metal ve taş bakımından zengin, ama bu kaynakların hayvancılık karşılığında taşınması için bir anlaşma yapılması gerekiyor."

 agot_filler_colonization.0003.a:0 "Anlaşmayı bizzat ben denetleyeceğim."

 agot_filler_colonization.0003.a.success:0 "Koloni için başarılı bir anlaşma yapıyorsun"

 agot_filler_colonization.0003.a.failure:0 "Koloniiçin bir anlaşma yapamıyorsun"

 agot_filler_colonization.0003.b:0 "Kâhyam [steward.GetFirstNameNoTooltip] bununla ilgilenebilir."

 agot_filler_colonization.0003.b.success:0 "[steward.GetFirstNameNoTooltip] koloni için başarılı bir anlaşma yapıyor"

 agot_filler_colonization.0003.b.failure:0 "[steward.GetFirstNameNoTooltip] koloni için bir anlaşma yapamıyor"

 agot_filler_colonization.0003.c:0 "Ben bir [ROOT.Char.GetTitleAsNameNoTooltip]'im, araba ustası değil! Bunu kendi kendinize çözün..."

 agot_filler_colonization.0003.a.success.toast:0 "Serpilen Koloni"

 agot_filler_colonization.0003.a.failure.toast:0 "Mücadele Eden Koloni"

 agot_filler_colonization.0003.a.critical_failure.toast:0 "Koloni Başarısızlığı"

 well_supplied_colony_county_modifier:0 "Erzakları Bol Koloni"

 well_supplied_colony_county_modifier_desc:0 "Bu koloni diyarın geri kalanından bol miktarda erzak alıyor."

 poorly_supplied_colony_county_modifier:0 "Erzakları Kıt Koloni"

 poorly_supplied_colony_county_modifier_desc:0 "Bu koloni, diyarın geri kalanından temel erzakları bile almakta zorlanıyor."

 agot_filler_colonization.1001.t:0 "[colony_province.GetNameNoTooltip]: Askere Alma Kampanyası"

 agot_filler_colonization.1001.desc:0 "Birçok yönden, [colony_province.GetName]'deki koloninin ilerlemesinden memnunum. Bir öncü ekip yerleşim için yeni bir alan belirledi ve basit bir salon ile birkaç barınak ve depo binası çoktan inşa edildi. Yerleşimi ilk yıllarında ayakta tutmak için aletler ve yiyecek stoklandı ve otlatma ile ekim için arazi temizleniyor.\n\nAncak, bıkkın bir [stewardship_companion.GetName], yerleşime göç etmeye istekli görünen insan sayısının çok az olduğundan şikâyet ediyor. Koloninin hayatta kalması ve gelişmesi için daha fazla yerleşimcinin bu adımı atmaya teşvik edilmesi gerekecek."

 agot_filler_colonization.1001.a:0 "Bazı yerel halkı taşımak için silahlı adamlarımı gönder..."

 maa_gathering_new_colonists_modifier:0 "Askere Alma Kampanyası"

 maa_gathering_new_colonists_modifier_desc:0 "Bu karakterin silahlı adamları, halkı kolonilere refakat etmekle meşgul."

 agot_filler_colonization.1001.b:0 "Nitelikli işçilerin göçünü sübvanse etmek için para ödeyelim."

 agot_filler_colonization.1001.c:0 "Rahiplerim [ROOT.Char.Custom('DefaultPriestTitlePlural')|U], yeni yerleşimcilere [ROOT.Char.GetFaith.HighGodName]'nin bereketini sunmalı."

 agot_filler_colonization.1002.t:0 "[colony_province.GetNameNoTooltip]: Yeni Bir Hayat"

 agot_filler_colonization.1002.desc:0 "Büyüyen yerleşimim [colony_province.GetName]'deki yeni fırsatların ve yatırımların haberi, sınırlarını aşıp komşu eyalet [origin_county.GetNameNoTier]'deki insanlara ulaştı.\n\nSon birkaç hafta içinde bu [migrant_culture.GetName] göçmenlerinden giderek daha fazlası, korumam altında yeni bir hayat kurmak umuduyla yeni kurulan yerleşimime gelmeye başladı.\n\nKarakoluma çok ihtiyaç duyduğu insan gücü ve işgücü sağlayacaklarına şüphe yok, ama kontrolsüzce gelmelerine izin verilirse hafta sona ermeden yerleşimcilerimden fazla olacaklar!"

 agot_filler_colonization.1002.a:0 "Hevesli eller topraklarımda her zaman hoş karşılanır..."

 agot_filler_colonization.1002.b:0 "Yerel milise bu göçmenleri kovmalarını söyle."

 allowed_migrants_in_colony:0 "Kolonide yeni bir hayat arayan göçmenler hoş karşılandı"

 forbade_migrants_in_colony:0 "Kolonide yeni bir hayat arayan göçmenler geri çevrildi"

 agot_filler_colonization.1003.t:0 "[colony_province.GetNameNoTooltip]: Alev"

 agot_filler_colonization.1003.desc:0 "[colony_province.GetName]'deki kolonimin büyük bölümlerinin, bildirildiğine göre aşırı hevesli bir fırıncının neden olduğu büyük bir yangınla yok edildiği haberi bana ulaştı. Her barınak, depo ve ambar kül olmuş.\n\nDış yardım olmadan, travma geçirmiş yerleşimciler tüten harabeleri terk etmek zorunda kalacak ve koloniyi ancak kararlı ve acil bir yardım çabası kurtarabilir.\n\nYas tutan sınır halkının bir temsilcisi, yangının yol açtığı toplam hasarı özetledi ve yeniden inşa için gereken altını mütevazıca talep ediyor."

 agot_filler_colonization.1003.a:0 "Bu cesur ruhlara ihtiyaç duydukları altını ver."

 agot_filler_colonization.1003.b:0 "Koloninin yeniden inşasını bizzat denetleyeceğim."

 agot_filler_colonization.1003.b.success:0 "Onarım çalışması verimli ve iyi yönetiliyor"

 agot_filler_colonization.1003.b.success.toast:0 "Verimli Onarımlar"

 agot_filler_colonization.1003.b.failure:0 "Onarım çalışması masraflı ve zaman alıcı"

 agot_filler_colonization.1003.b.failure.toast:0 "Masraflı Onarımlar"

 agot_filler_colonization.1003.c:0 "Böyle şeyler olur. Bir dahaki sefere çöreklere daha dikkatli davran..."

 agot_filler_colonization.1003.c.failure.toast:0 "Koloni Başarısızlığı"

 agot_filler_colonization.1003.c.success.toast:0 "Koloni Hayatta Kalıyor"

 agot_filler_colonization.1004.t:0 "[colony_province.GetNameNoTooltip]: Günah Yuvası"

 agot_filler_colonization.1004.desc.1:0 "Başrahiplerimden [ROOT.Char.Custom('DefaultPriestTitlePlural')|U] rahatsız edici haberler aldım: [colony_province.GetName]'deki büyüyen koloni nüfusu [ROOT.Char.GetFaith.HighGodName]'den yüz çevirip günahkâr hayatlar yaşıyor.\n\n"

 agot_filler_colonization.1004.desc.2.deceit:0 "Eyalet halkının bir aldatma ve hile kültürü geliştirdiği, dürüstlüğün saflık olarak görüldüğü söyleniyor. Koloniyi ziyaret edenlerin, girişimci yerel halk tarafından soyulma ya da şakaların kurbanı olma ihtimali hiç de az değil. Bu durum eyalet üzerindeki yönetimimi bile etkiliyor, çünkü yerel seçkinlerden gelen raporların ne kadar doğru olduğundan emin olamıyoruz!\n\n"

 agot_filler_colonization.1004.desc.2.chastity:0 "Eyalette bir iffet kültürünün yerleştiği söyleniyor; halk bedensel zevklerden uzak durarak işlerine ve kişisel gelişimlerine odaklanıyor. Bu, eyaletin uzun vadeli istikrarı için ciddi bir tehdit; çünkü istikrarlı bir nüfusa başka nasıl ulaşacağız?\n\n"

 agot_filler_colonization.1004.desc.2.compassion:0 "Koloninin halkının, sınır yaşamlarında şefkatli bir merhameti benimsediği söyleniyor. Başkalarının çektiği sıkıntılara ağlamakla vakit harcayıp gerekli zor kararları veremeyen, yufka yürekli ahmaklar haline gelmişler!\n\n"

 agot_filler_colonization.1004.desc.3:0 "Böyle rezil bir davranış, diyarımdaki insanları kesinlikle hasta edip tiksinmesine yol açacaktır; bu yüzden uygun bir karşılığı dikkatle değerlendirmeliyim."

 agot_filler_colonization.1004.a:0 "Bu iğrenç günahkârların üzerine sertçe ineceğim!"

 persecuted_colonists_county_modifier:0 "Zulüm Gören Halk"

 persecuted_colonists_county_modifier_desc:0 "Bu bölgenin halkı, diyarlarının inancının ahlakına uymaya zorlanıyor."

 agot_filler_colonization.1004.b:0 "İnsanların kusurları vardır. Sınırdaki küçük bir sapkınlığın ne zararı olabilir?"

 unpersecuted_colonists_county_modifier:0 "Dinî Özgürlükler"

 unpersecuted_colonists_county_modifier_desc:0 "Bu bölgenin halkına dinî hoşgörü tanındı ve zulümden muaf tutuldular."

 sided_with_sinners_modifier:0 "Günahkârlara Hoşgörü"

 sided_with_sinners_modifier_desc:0 "Bu karakter, diyarındaki günahkâr faaliyetlere göz yummuş."

 agot_filler_colonization.1004.c:0 "Bilmiyorum, belki bir bildikleri vardır..."

 agot_filler_colonization.1005.t:0 "[colony_province.GetNameNoTooltip]: Hırsız Gibi Kanka"

 agot_filler_colonization.1005.desc:0 "[colony_province.GetName]'deki yerleşimimden rahatsız edici raporlar aldım. Eyaletin gelirleri yavaş ama istikrarlı bir düşüş gösterdi ve buna karşılık haydutluk arttı; yerleşim için ayrılan erzaklar çoğu zaman baskınlara uğrayıp yasa dışı kanallardan satılıyor.\n\nAtadığım yerel gözetmen [governor.GetFirstName]'in hırsızlarla iş birliği içinde olduğu, çalınan mallardan pay aldığı ve pis işlerini örtbas ettiğine dair söylentiler var.\n\nAma [governor.GetFirstNameNoTooltip] kurnaz ve izini [overseer.GetHerHis] iyi gizlemiş. Dikkatli ve hassas ilerlemem gerekecek..."

 agot_filler_colonization.1005.a:0 "Ne rezalet! [governor.GetSheHe] daha fazla zarar veremeden [governor.GetHerHim]'i görevden alın."

 agot_filler_colonization.1005.a.tt:0 "[governor.GetFirstNameNoTooltip], [governor.GetHerHis] Vali görevinden alındı"

 agot_filler_colonization.1005.b:0 "Belki bu sorunu ortadan kaldırabilirim..."

