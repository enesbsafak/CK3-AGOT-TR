 agot_filler_colonization.1008.t:0 "[colony_province.GetNameNoTooltip]: Veba"

 agot_filler_colonization.1008.desc:0 "[colony_province.GetName]'deki kolonimden gelen son haberler gerçekten dehşet verici. Yerleşimciler, neredeyse her haneyi silip süpüren yıkıcı bir salgına yakalanmış. Raporları zar zor okuyabiliyorum, ayrıntıları o kadar tüyler ürpertici.\n\nHastalık ateş ve dindirilemeyen bir susuzlukla başlıyor — bazı köylüler çaresiz arzularını gidermeye çalışırken kelimenin tam anlamıyla patlamış. Ardından hıyarcıklar geliyor — her eklemde pis kokulu sarı irin saçan ve kurbanı tamamen hareket edemez hale getiren kocaman siyah şişlikler. Son aşamada bunlar geriler, ama hastaların yüzlerinde öylesine ıstırap veren cehennemî bir döküntü beliriyor ki bazıları boşuna bir rahatlama çabasıyla kendi gözlerini oymuş ya da kulaklarını ve burnunu koparmış. Çoğu için ölüm ardından geliyor, genellikle omurgayı çatlatan spazmların son azabıyla.\n\nKoloniyi kurtarmak gerekirse, gecikmeden bir şeyler yapılmalı!"

 agot_filler_colonization.1008.a:0 "Koloniyi karantinaya alın — kimse çıkamayacak! Bunun yayılmasını riske atmam."

 agot_filler_colonization.1008.a.success.toast:0 "Koloni Kurtarıldı"

 agot_filler_colonization.1008.a.failure.toast:0 "Koloni Başarısızlığı"

 agot_filler_colonization.1008.b:0 "Bu tür hastalıkların tedavisinde uzman adamlar gönderip onlara yardım edeceğim."

 agot_filler_colonization.1008.c:0 "Zavallı ruhlar... Hastalananları en iyi bakımımızı almaları için [capital.GetNameNoTier]'e getirin!"

