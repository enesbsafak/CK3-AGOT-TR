l_english:

 agot_filler_braavos.0001.t:0 "Festivalde Yanlış Kimlik"

 agot_filler_braavos.0001.desc:0 "[GetTitleByKey('k_braavos').GetNameNoTier]'de Uthero'nun Maskesinin Düşüşü sırasında şehir, dünyaya tarihi açılışını kutluyor. On gün boyunca vatandaşlar Braavos'un kökenlerinin gizliliğini simgelemek için maske takıyor. Son gece, Braavos'un varlığını duyurmak için gemiler ve elçiler gönderen [GetScriptedCharacterByHistoryID('Zalyne_1_A').GetFirstName] [GetScriptedCharacterByHistoryID('Zalyne_1_A').GetDynasty.GetName]'i onurlandırmak için bunları büyük bir doğruluk ve şeffaflık gösterisiyle çıkarıyorlar. Festival, müzik, gösteriler ve sokak şenlikleriyle dolu, neşeli ve enerjik bir kutlamadır.\n\nKalabalığa katıldığımda, hevesli bir eğlence düşkünü grubu beni, [meeting_noblemale.GetHersHis] cüretkâr maceralarıyla tanınan ünlü bir Braavoslu figürüyle karıştırıyor."

 agot_filler_braavos.0001.a:0 "Ah, evet, benim! Size hikâyeler anlatayım!"

 agot_filler_braavos.0001.a.success:0 "Usta Bir Performans"

 agot_filler_braavos.0001.a.failure:0 "Kusurlu Bir Cephe"

 agot_filler_braavos.0001.a.success.desc:0 "Karizman kalabalığı büyülüyor; her sözüne asılıp efsanevi statüne ikna oluyorlar."

 agot_filler_braavos.0001.a.failure.desc:0 "Çabalarına rağmen kalabalık gerçekliğinden şüphe duymaya başlıyor ve hevesleri sönüyor."

 agot_filler_braavos.0001.b:0 "Korkarım beni başka biriyle karıştırdınız."

 agot_filler_braavos.0001.b.success:0 "Gerçek Ortaya Çıktı"

 agot_filler_braavos.0001.b.failure:0 "Garip Bir İtiraf"

 agot_filler_braavos.0001.b.success.desc:0 "İçten itirafın kahkahalarla ve iyi niyetle karşılanıyor; kalabalık dürüstlüğünü takdir ediyor."

 agot_filler_braavos.0001.b.failure.desc:0 "Gerçeği açığa çıkarma girişimin kuşkuyla karşılanıyor ve kalabalık hayal kırıklığına uğramış görünüyor."

 agot_filler_braavos.0001.c:0 "Ben Deniz Lordu'yum! Buradaki en önemli insanım!"

 agot_filler_braavos.0001.c.success:0 "[ROOT.Char.GetTitledFirstName]'in Büyük Destanları"

 agot_filler_braavos.0001.c.success.desc:0 "Doğru tanınarak hakkınla Deniz Lordu olarak selamlanıyorsun; kalabalık adını haykırıyor ve şenlikler devam ediyor!"

 agot_filler_braavos.0002.t:0 "Braavoslu Yergi"

 agot_filler_braavos.0002.desc:0 "Gürültülü bir kalabalık dikkatimi, gösterişli bir topluluğun keskin bir yergi sergilediği küçük bir sahneye çekiyor. Abartılı kostümler giymiş oyuncular, abartılı jestlerle ve keskin dilli mizahla tanınmış bir soyluyu alaya alıyor.\n\nSeyircide kahkaha dalgalanıyor, ama herkes bu eğlenceden pay almıyor — bazıları kimin izliyor olabileceğinden çekinerek huzursuz bakışlar değiş tokuş ediyor. [GetTitleByKey('k_braavos').GetNameNoTier]'de soytarılar ve casuslar çoğu zaman aynı sahnede yürür ve komedi olarak başlayan şey hızla skandala... ya da daha kötüsüne dönüşebilir."

 agot_filler_braavos.0002.a:0 "Bu, kaçırılmayacak kadar eğlenceli! Kahkahalara ben de katılacağım."

 agot_filler_braavos.0002.a.success:0 "Keyfi Yerinde"

 agot_filler_braavos.0002.a.failure:0 "Yanlış Bir Adım"

 agot_filler_braavos.0002.a.success.desc:0 "Kahkahan kalabalığa kusursuzca karışıyor ve kimsenin öfkesini çekmeden gösterinin tadını çıkarıyorsun."

 agot_filler_braavos.0002.a.failure.desc:0 "Kahkahan istenmeyen dikkat çekiyor ve kendini soylunun hoşnutsuzluğunun hedefi olarak buluyorsun."

 agot_filler_braavos.0002.b:0 "Tiyatral olaylar ve dram mı? Beni ilgilendirmez. Devam edelim."

 agot_filler_braavos.0003.t:0 "Ay Havuzu'nun Bir Bravo'su"

 agot_filler_braavos.0003.desc:0 "Neşeli bir müzik ve çınlayan çelik melodisi beni [GetTitleByKey('k_braavos').GetNameNoTier]'in ünlü Ay Havuzu'na çekiyor. Fenerlerle aydınlanan kemerlerin altında, toplanmış bir kalabalık, iki bravo'nun suyun yüzeyinde süzülüşünü hayranlık içinde sessizce izliyor; bıçakları alacakaranlıkta gümüş gibi parıldıyor. Bu su dansı — Braavos kılıç sanatının en akıcı ve en hassas hali.\n\nİlgimi fark eden deneyimli bir eğitmen, [meeting_warrior.GetFirstName], bilen bir gülümsemeyle bana dönüyor. "Meraklı mısın?" diye soruyor [meeting_warrior.GetSheHe], açık alanı işaret ederek. "Gel. Bakalım ayakların gözlerin kadar çevik mi.""

 agot_filler_braavos.0003.a:0 "Bu zarif dansta şansımı deneyeceğim!"

 agot_filler_braavos.0003.a.success:0 "Doğuştan Yetenek"

 agot_filler_braavos.0003.a.failure:0 "Beceriksiz Bir Deneme"

 agot_filler_braavos.0003.a.success.desc:0 "Hareketleri zarifçe taklit ediyorsun, dansın birkaç adımını öğreniyorsun. Kalabalık denemeni alkışlıyor."

 agot_filler_braavos.0003.a.failure.desc:0 "Tüm çabana rağmen adımlarda tökezliyorsun, izleyenlerin kıkırdamasına yol açıyorsun."

 agot_filler_braavos.0003.b:0 "Özel bir ders benim için daha uygun olur."

 agot_filler_braavos.0003.c:0 "Kılıç dansı mı? Kılıç kullanmayı bilirim!"

 agot_filler_braavos.0004.t:0 "İstiridye Açma Yarışması"

 agot_filler_braavos.0004.desc:0 "Yakındaki bir kalabalığın tezahüratını duyunca sıra dışı bir manzaraya rastlıyorum — yoğun bir odaklanmayla istiridye yığınlarının etrafına toplanmış bir grup yerli. Kabukların çatırdayarak açılma sesi havayı dolduruyor, tezahüratlar ve ara sıra mırıldanılan küfürlerle kesiliyor.\n\nİri yarı bir balıkçı, [meeting_peasantmale.GetFirstName], sırıtarak beni çağırıyor. "Denizin küçük kasalarını açma yarışına hiç girdin mi?" diye soruyor [meeting_peasantmale.GetSheHe|U]. Görünüşe göre yarışma basit: Süre dolmadan olabildiğince çok istiridye aç. Ödül? Onca inatçı yumuşakçayı açmak için verilen mücadeleyi anmak için yapılmış, özenle oyulmuş bir istiridye kabuğu kolye ucu."

 agot_filler_braavos.0004.a:0 "Bir deneyeyim. Ne kadar zor olabilir ki?"

 agot_filler_braavos.0004.a.success:0 "Kabuk Açma Başarısı"

 agot_filler_braavos.0004.a.failure:0 "Şoka Uğramış"

 agot_filler_braavos.0004.a.success.desc:0 "İstiridyeleri ustaca açıyorsun, kalabalığı etkileyip yarışmayı kazanıyorsun."

 agot_filler_braavos.0004.a.failure.desc:0 "Tüm çabana rağmen kazanmak için yeterince istiridye açamıyorsun."

 agot_filler_braavos.0004.b:0 "En hızlı istiridye açana bahse gireceğim!"

 agot_filler_braavos.0004.b.outcome.a:0 "Şanslı Bir Bahis"

 agot_filler_braavos.0004.b.outcome.a.desc:0 "Seçtiğin yarışmacı kazanıyor ve güzel bir kâr elde ediyorsun."

 agot_filler_braavos.0004.b.outcome.b:0 "Kaybedilen Bahis"

 agot_filler_braavos.0004.b.outcome.b.desc:0 "Yarışmacın sendelemeye başlıyor ve bahsini kaybediyorsun."

 agot_filler_braavos.0004.c:0 "İstiridye mi? Bana göre değil. Yolumuza devam edelim."

 agot_filler_braavos.0004.item:0 "Oyma İstiridye Kabuğu Kolye Ucu"

 agot_filler_braavos.0004.item.desc:0 "İstiridye kabuğundan güzelce oyulmuş bir kolye ucu."

 agot_filler_braavos.0005.t:0 "Bir Kılıç Ustasının Meydan Okuması"

 agot_filler_braavos.0005.desc:0 "Pazar sokaklarında yürürken, bir demircin çekicinin sıcak çeliğe kusursuz bir hassasiyetle vuruşunun ritmik tıkırtısını duyuyorum.\n\nİzlediğimi fark eden [meeting_noblemale.GetFirstName] sesleniyor. [meeting_noblemale.GetSheHe|U] kendini ünlü bir Braavoslu kılıç ustası olarak tanıtıyor, eşsiz kalitede kılıçlar dövdüğünü iddia ediyor.\n\nGözlerinde bir parıltıyla [meeting_noblemale.GetSheHe] bana yaklaşıyor ve şöyle diyor: "[ROOT.Char.GetTitledFirstNameNoTooltip], sana adına layık bir kılıç döveceğim, ama ancak bir düelloda beceri ve onur sınavında değerini kanıtlarsan." [meeting_noblemale.GetSheHe] cevabımı beklerken etrafa seyirci toplanıyor. Belki [meeting_noblemale.GetSheHe] gerçekten de iddia ettiği kişidir?"

 agot_filler_braavos.0005.a:0 "Meydan okumanı kabul ediyorum!"

 agot_filler_braavos.0005.a.success:0 "Layık Bir Rakip"

 agot_filler_braavos.0005.a.failure:0 "Kanıtlanmamış"

 agot_filler_braavos.0005.a.success.desc:0 "Dövüşteki hünerin [meeting_noblemale.GetFirstName]'i etkiliyor ve [meeting_noblemale.GetSheHe] kılıcı dövmeyi kabul ediyor."

 agot_filler_braavos.0005.a.failure.desc:0 "Tüm çabana rağmen, [meeting_noblemale.GetFirstName] becerinden ikna olmuş değil."

 agot_filler_braavos.0005.b:0 "Ah, ben kesinlikle—şey—kesinlikle kılıca layık bir savaşçıyım!"

 agot_filler_braavos.0005.b.success:0 "Yiğitlik Destanları"

 agot_filler_braavos.0005.b.failure:0 "İnanılmaz Hikâyeler"

 agot_filler_braavos.0005.b.success.desc:0 "Geçmiş zaferlerinle ilgili hikâyelerin, [meeting_noblemale.GetFirstName]'i senin layıklığına ikna ediyor."

 agot_filler_braavos.0005.b.failure.desc:0 "[meeting_noblemale.GetFirstName] abartılarını fark ediyor ve iddialarını geçersiz sayıyor."

 agot_filler_braavos.0005.c:0 "Meydan okumanı reddediyorum."

 agot_filler_braavos.0005.item:0 "Usta İşi Braavos Kılıcı"

 agot_filler_braavos.0005.item.desc:0 "Bu kılıç, Braavos işçiliğinin bir başyapıtı — zarif, akıcı ve elde inanılmaz hafif. Dalgalı çeliği, demircinin gizli tekniğinin nişanesi olan ince bir mavi parıltıyla ışıldıyor. Bir ödül olarak dövüldü; düellomuzdan sonra usta tarafından verildi — takdir edilen bir becerinin nişanesi, çelikle ödenen bir onur borcu."

 agot_filler_braavos.0006.t:0 "Ay Havuzu'nda Cinayet"

 agot_filler_braavos.0006.desc:0 "Ay, ünlü Ay Havuzu'na [GetTitleByKey('k_braavos').GetNameNoTier] üzerinde ışıltılı parıltısını dökerken, ani bir kargaşa sakin atmosferi bozuyor. Bir [dead_peasant.GetWomanMan], göğsüne saplanmış bir hançerle arnavut kaldırımında cansız yatıyor.\n\nToplanan izleyiciler arasında şaşkınlık nidaları dalgalanıyor, gözler gölgeli ara sokaklara doğru telaşla çekilen pelerinli bir figüre çevriliyor. Labirent gibi kanalları ve sokaklarıyla Braavos hem bir sığınak hem de bir tuzak olabilir..."

 agot_filler_braavos.0006.a:0 "Pelerinli figürü kovala!"

 agot_filler_braavos.0006.a.success:0 "Hızla Tecelli Eden Adalet"

 agot_filler_braavos.0006.a.ambushed:0 "Pusuda Yakalandı ve Kurtuldu"

 agot_filler_braavos.0006.a.failure:0 "Sonuçsuz Bir Kovalamaca"

 agot_filler_braavos.0006.a.success.desc:0 "Braavos'un dolambaçlı sokaklarındaki hızlı takibin meyvesini veriyor ve pelerinli figürü yakalıyorsun. Şehir muhafazı cesaretin için minnettar."

 agot_filler_braavos.0006.a.failure.desc:0 "Pelerinli figür senden kurtuluyor, şehrin labirent gibi sokaklarında gözden kayboluyor. Şehir muhafızları çok geç geliyor ve eylemlerin şüphe altında kalıyor."

 agot_filler_braavos.0006.a.ambushed.desc:0 "Pelerinli figürü ara sokaklarda kovalarken, saldırgan gölgelerin arasından fırlayıp sana pusu kuruyor."

 agot_filler_braavos.0006.b:0 "Sessizce geri çekilelim."

 agot_filler_braavos.0007.t:0 "Braavos'un Büyüleyici Kuklaları"

 agot_filler_braavos.0007.desc:0 "Canlı bir kalabalık, Mor Liman yakınındaki küçük bir sahneyi çevreliyor; orada bir Braavoslu kuklacı, özenle hazırlanmış bir kukla gösterisine rehberlik ediyor. Sıradan gösterilerden farklı olarak bu kuklalar ürkütücü bir hassasiyetle hareket ediyor, uzuvları görünmez eller dokunuyormuş gibi akıyor. Hikâye açılıyor — kayıp aşıkların ve fısıltıyla söylenen kehanetlerin klasik bir Braavos efsanesi — ama bu gösteride daha fazlası var.\n\nZengin ipeklere bürünmüş kuklacı, bilen bir sırıtışla bakışımı yakalıyor. "[GetTitleByKey('k_braavos').GetNameNoTier] birçok harikanın şehridir," diye mırıldanıyor [meeting_noblemale.GetSheHe]. "Bazı hünerler yalnızca ustalıktır... bazılarıysa başka bir şey."\n\nİzlerken gösteriye doğru tuhaf bir çekim hissediyorum, sanki kuklalar sadece tahta ve ip değilmiş gibi."

 agot_filler_braavos.0007.a:0 "Usta işi bir gösteri! Daha fazlasını görmeliyim."

 agot_filler_braavos.0007.a.success:0 "Büyülenmiş"

 agot_filler_braavos.0007.a.failure:0 "Rahatsız Edici Gerçekçilik"

 agot_filler_braavos.0007.a.success.desc:0 "Kendini gösteriye kaptırıyorsun, güzelliğinden ve gizeminden büyüleniyorsun."

 agot_filler_braavos.0007.a.failure.desc:0 "Kuklalarda seni tedirgin eden bir şey var — cam gözlerinin ardındaki tuhaf bir farkındalık."

 agot_filler_braavos.0007.b:0 "Zekice bir yanılsama, hepsi bu."
