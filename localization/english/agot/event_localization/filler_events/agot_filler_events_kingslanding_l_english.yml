l_english:

 agot_filler_kingslanding.0001.t:0 "Ceplerim!"

 agot_filler_kingslanding.0001.desc:0 "Kralın Şehri, Westeros tacının mücevheri olabilir ama en parlak mücevherler bile bazı kusurlar taşıyabilir. Şehrin daha az saygın bölgelerinden geçmeyi alışkanlık haline getirmesem de, bugün böyle bir yolculuk kaçınılmazdı ve kendimi küçük bir sokak çocuğuyla çarpışırken buluyorum. Muhafızlarım çocuğu hızla kovalayıp bir ara sokağa sürüyor ama gömleğimdeki kiri silerken, ceplerimin biraz hafiflediğini fark ediyorum."

 agot_filler_kingslanding.0001.a:0 "Belki para kesemi şifonyerimin üzerinde unuttum..."

 agot_filler_kingslanding.0001.b:0 "Muhafızlar! Peşinden!"

 agot_filler_kingslanding.0002.t:0 "$agot_filler_kingslanding.0001.t$"

 agot_filler_kingslanding.0002.desc:0 "Muhafızlarım küçük hırsızı önüme sürüklüyor. Henüz bir çocuk; paçavraları ve çelimsiz yapısından, hiç şüphesiz Pire Çukuru'nun sayısız yetiminden biri. Ceplerini ararken muhafızlar yalnızca benim para kesemi değil, başkalarının da birkaç para kesesini buluyor."

 agot_filler_kingslanding.0002.a:0 "Bu sıçanı bir hücreye atın."

 agot_filler_kingslanding.0002.b:0 "Hepsini, yaşanan aksaklığın karşılığı olarak alacağım."

 agot_filler_kingslanding.0002.c:0 "Zavallı, çaresiz şeysin sen. Seni doyurup giydirelim."

 agot_filler_kingslanding.0003.t:0 "Balıkçının Karısı"

 agot_filler_kingslanding.0003.desc:0 "Balıkçı Meydanı, Nehir Kapısı'nın — ya da yerel küçük halkın dediği gibi Çamur Kapısı'nın — hemen içindeki pazardır. Karasu Çayı'na yakınlığı nedeniyle isabetli bir ad taşıyan bu meydan, belki de Kralın Şehri'nde günün taze balığını satın almak için en iyi yerdir.\n\nNormalde, balık alması için saraylılarımdan birini gönderirdim ama bugün kendimi maceraperest hissediyorum ve bu görevi üstleniyorum. Balıkçının karısına büyük bir siyah morina soruyorum ve [agot_filler_fishmonger_wife.GetSheHe] bana on altın fiyat veriyor."

 agot_filler_kingslanding.0003.a:0 "Sanırım daha iyi bir fiyat için pazarlık edebiliriz."

 agot_filler_kingslanding.0003.b:0 "[agot_filler_fishmonger_wife.GetSheHe] rüya görüyor! Bugünlük balığı es geçiyorum."

 agot_filler_kingslanding.0003.c:0 "Biraz düşününce, küçük bir balık gayet iyi olur."

 agot_filler_kingslanding.0003.d:0 "Böyle fahiş fiyatlar ödemektense aç kalmayı tercih ederim!"

 agot_filler_kingslanding.0004.t:0 "$agot_filler_kingslanding.0003.t$"

 agot_filler_kingslanding.0004.desc:0 "İkimiz siyah morina için pazarlık ediyoruz; balıkçının karısı bu sanatta usta olsa da, ben kararlıyım.\n\nBeş dakika kadar ileri geri konuştuktan sonra, nihayet makul bir fiyatta anlaşıyoruz."

 agot_filler_kingslanding.0004.a:0 "Anlaştık."

 agot_filler_kingslanding.0004.success_title:0 "Balıkçının Karısını Alt Etti!"

 agot_filler_kingslanding.0004.failure_title:0 "Balıkçının Karısına Kaybetti..."

 agot_filler_kingslanding.0005.t:0 "Bir Şövalyenin Hikâyesi"

 agot_filler_kingslanding.0005.desc:0 "Çelik Sokağı, Balıkçı Meydanı'ndan başlar ve Visenya Tepesi'ndeki Büyük Baelor Septi'ne ulaşana dek yükselir; tepeye ne kadar çıkılırsa, dükkânların kalitesi o kadar artar.\n\nVisenya Tepesi'nin en alt noktasında, dükkân sahiplerinden biri ile bir şövalye arasında bir sahne yaşanıyor. Şövalye, bir turnuva kazandıklarında dükkân sahibine ödeme yapma sözü karşılığında bir zırh takımı ödünç almak istiyor. Dükkân sahibi doğal olarak böyle bir teklifi reddedip şövalyeye, çırakların işlerini yaptığı Pislik Sokağı'nda şansını denemesini söylüyor."

 agot_filler_kingslanding.0005.a:0 "Eminim anlaşabilirler."

 agot_filler_kingslanding.0005.b:0 "Şövalyenin zırhının parasını ben ödeyeceğim."

 agot_filler_kingslanding.0005.c:0 "Seni desteklerim ama sana çok daha güzel bir şey bulabiliriz."

 agot_filler_kingslanding.0006.t:0 "$agot_filler_kingslanding.0005.t$"

 agot_filler_kingslanding.0006.desc:0 ""Teşekkürler, mi[ROOT.Char.GetLadyLord|l]! Kazancımı ödeme olarak alabilirsiniz! Size gerçekten minnettarım."\n\nZırhı alırken, önceki takımını yüksek bahisli bir turnuvada kaybettiğini söylüyor — ama gelecek turnuvada dereceye gireceğine emin."

 agot_filler_kingslanding.0006.a:0 "Bu sefer sana bol şans diliyorum!"

 agot_filler_kingslanding.0006.b:0 "Belki sana birkaç tüyo verebilirim..."

 agot_filler_kingslanding.0007.t:0 "$agot_filler_kingslanding.0005.t$"

 agot_filler_kingslanding.0007.desc:0 ""Verebileceğiniz her tavsiyeye açığım, mi[ROOT.Char.GetLadyLord|l]. Her türlü yardım memnuniyetle karşılanır.""

 agot_filler_kingslanding.0007.a:0 "Sivri ucuyla dür onları, ha!"

 agot_filler_kingslanding.0007.b:0 "Her şeyin üstünde, cesur ol."

 agot_filler_kingslanding.0007.c:0 "Bir adım önde ol — aldatmak gerçek bir avantajdır."

 agot_filler_kingslanding.0007.d:0 "Eğilme ve boyun eğme."

 agot_filler_kingslanding.0007.e:0 "Seni öfkelendiren şeyi bul ve onu kılıcına yönlendir."

 agot_filler_kingslanding.0007.f:0 "Uzun oyunu oyna. Sabır seni zafere götürür."

 agot_filler_kingslanding.0008.t:0 "$agot_filler_kingslanding.0005.t$"

 agot_filler_kingslanding.0008.desc:0 "Muhafızlarım tanıdık görünümlü bir şövalyeyi sarayıma getiriyor. Genç şövalye önüme gelip eğiliyor ve önüme, turnuvadan kazandığı altını içeren deri bir çanta bırakıyor. Ona duyduğum güven için teşekkür ediyor ve sarayıma katılmayı teklif ediyor."

 agot_filler_kingslanding.0008.a:0 "Seni sarayıma memnuniyetle kabul ederim!"

 agot_filler_kingslanding.0008.b:0 "Sanırım en çok turnuva düzenine uygun birisin..."

 agot_filler_kingslanding.0009.t:0 "Pire Çukuru Kavgacıları"

 agot_filler_kingslanding.0009.desc:0 "Pire Çukuru, Kralın Şehri'nin en kötü şöhretli gecekondu mahallesi olsa da, yüksek soylular onun içki batakhanelerinde ve dolambaçlı ara sokaklarında bulunabilir. Pek çoğu, kaba ve yasadışı eğlence arayışında çamur ve domuz pisliğiyle kaplı yollarda yürümek için şehrin daha yüksek bölgelerinden gelir.\n\nSıçan çukurları bu tür cazibe merkezlerinden biridir — normalde, adamlar kaç tanesinin öleceğine bahis oynarken sıçanlar köpeklerin ya da diğer hayvanların üzerine salınır. Ancak bu gece sıçanlar bağışlanıyor ve onların yerine iki adam ringe girip dövüşüyor."

 agot_filler_kingslanding.0009.a:0 "[agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip]'e bahis yapacağım"

 agot_filler_kingslanding.0009.b:0 "[agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip]'e bahis yapacağım"

 agot_filler_kingslanding.0009.c:0 "Burada şarap diye ne idrar satılıyor?"

 agot_filler_kingslanding.0009.d:0 "Bu iğrenç yeri kapatın!"

 agot_filler_kingslanding.0010.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0010.desc:0 "[agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip] ve [agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip] yumrukları sıkılı, birbirlerinin çevresinde dönmeye başlıyor. [agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip], [agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip]'in çenesine yumruk atıyor. [agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip], kendi yumruğuyla [agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip]'in kaburgalarına karşılık veriyor."

 agot_filler_kingslanding.0010.a:0 "Dövüş! Dövüş! Dövüş!"

 agot_filler_kingslanding.0011.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0011.desc:0 "[agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip] teslim olurken [agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip] zaferle ayağa kalkıyor."

 agot_filler_kingslanding.0011.a:0 "İyi bir dövüş!"

 agot_filler_kingslanding.0011.b:0 "Ah canım, altınım..."

 agot_filler_kingslanding.0012.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0012.desc:0 "[agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip] teslim olurken [agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip] zaferle ayağa kalkıyor."

 agot_filler_kingslanding.0012.a:0 "İyi bir dövüş!"

 agot_filler_kingslanding.0012.b:0 "Ah canım, altınım..."

 agot_filler_kingslanding.0013.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0013.desc:0 "Şarap düşündüğümden daha sert — Arbor şarabına hiç benzemiyor ama kesinlikle bir sertliği var! Birkaç kadehten sonra, doğrusu bu dövüşçülerden herhangi biriyle, hatta dünyadaki herkesle başa çıkabileceğimi hissediyorum! Şarabın verdiği cesaretle ringe adım atıp [agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip]'e yaklaşıyorum. [agot_filler_ratpit_fighter_1.GetSheHe] ayağa kalkar kalkmaz ikimiz yumruklaşmaya başlıyoruz; seyirciler tezahürat ediyor ve bahisler büyümeye başlıyor."

 agot_filler_kingslanding.0013.a:0 "Hadi dans edelim!"

 agot_filler_kingslanding.0013.success_title:0 "Dövüşü Kazandı!"

 agot_filler_kingslanding.0013.failure_title:0 "Dövüşü Kaybetti..."

 agot_filler_kingslanding.0014.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0014.desc:0 "Epey bir dövüş oluyor ama [agot_filler_ratpit_fighter_1.GetFirstNameNoTooltip] sonunda bana teslim oluyor."

 agot_filler_kingslanding.0014.a:0 "İyi dövüş! Aferin!"

 agot_filler_kingslanding.0015.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0015.desc:0 "[agot_filler_ratpit_fighter_2.GetFirstNameNoTooltip] sıradaki rakibim olarak öne çıkıyor."

 agot_filler_kingslanding.0015.a:0 "Umarım iyi bir rakiptirsin, çünkü bu yumruklar havada uçacak!"

 agot_filler_kingslanding.0015.success_title:0 "Dövüşü Kazandı!"

 agot_filler_kingslanding.0015.failure_title:0 "Dövüşü Kaybetti..."

 agot_filler_kingslanding.0016.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0016.desc:0 "Kanlı ve dövülmüş halde, iki rakibim de teslim oldu; kalabalık hakimiyet gösterim karşısında tezahürat yapıyor. Bu gece mi? Ben Pire Çukuru'nun Kralıyım!"

 agot_filler_kingslanding.0016.a:0 "Ne gece!"

 agot_filler_kingslanding.0017.t:0 "$agot_filler_kingslanding.0009.t$"

 agot_filler_kingslanding.0017.desc:0 "Beni deviren darbenin hangisi olduğundan tam emin değilim ama kendime geldiğimde kendimi bir ara sokakta yerde buluyorum. Bazı paralarım eksik; belki de içtiğim tüm şarabın tazminatı olarak alınmışlardır."

 agot_filler_kingslanding.0017.a:0 "Ne gece..."

 agot_filler_kingslanding.0018.t:0 "Gizemli Kahverengi Kase"

 agot_filler_kingslanding.0018.desc:0 "En baştan çıkarıcı kokulardan biri beni çağırıyor — sıcak et, çıtırtı, yağ! Açlık hissim aklımı yenince, kokunun yayıldığı yemek dükkânına doğru yürüyorum.\n\n"Mi[ROOT.Char.GetLadyLord|l], muhtemelen burada yemek yemek istemezsiniz," diye uyarıyor bir paralı asker, şu an içtiği kahverengi kaseyi işaret ederek. "Burası güneş battığında bir Sıçan Çukuru'na dönüşür. Burada bir söz vardır: çukurda kaybedenler, kasede yerlerini kazanır.""

 agot_filler_kingslanding.0018.a:0 "Kendim karar verebilirim, teşekkürler."

 agot_filler_kingslanding.0018.b:0 "Sen benim babam değilsin, bana ne yapacağımı söyleyecek de kimsin? Defol."

 agot_filler_kingslanding.0018.c:0 "Madem bu kadar kötü, o zaman neden yiyorsun?"

 agot_filler_kingslanding.0019.t:0 "$agot_filler_kingslanding.0018.t$"

 agot_filler_kingslanding.0019.desc:0 ""Affedin, mi[ROOT.Char.GetLadyLord|l]. Bilmenizde fayda var dedim," diyor paralı asker.\n\nOturup kase kahverengimi yemeye başlıyorum. Yemeğimin ortasında buluyorum onu: hâlâ eti yapışık bir sıçan kafatası. Midem — zavallı, nazik midem — takla atmaya başlıyor."

 agot_filler_kingslanding.0019.a:0 "*BLUERGH*"

 agot_filler_kingslanding.0020.t:0 "$agot_filler_kingslanding.0018.t$"

 agot_filler_kingslanding.0020.desc:0 "Paralı asker omuz silkiyor. "Daha kötülerini de gördüm. İşsiz bir paralı askerin hayatı böyledir, mi[ROOT.Char.GetLadyLord|l]." Kahverengi sıvıdan bir kemik çıkarıp kenara atıyor ve bir kaşık daha içiyor."

 agot_filler_kingslanding.0020.a:0 "...yani iş mi arıyorsun?"

 agot_filler_kingslanding.0020.b:0 "Uyarı için teşekkürler."

 agot_filler_kingslanding.0021.t:0 "$agot_filler_kingslanding.0018.t$"

 agot_filler_kingslanding.0021.desc:0 ""Mi[ROOT.Char.GetLadyLord|l], size sadece dostça bir uyarı yapıyordum. Ama madem kavga istiyorsunuz, kavga alacaksınız!" Paralı asker oturduğu yerden kalkıp parmaklarını çıtlatıyor. Bazı müşteriler kaçıyor ama çoğunluk, kavgamıza bahis oynamak için kalıyor."

 agot_filler_kingslanding.0021.a:0 "Gel üstüme, hevesi sokaklarda kalmış şövalye!"

 agot_filler_kingslanding.0021.success_title:0 "Dövüşü Kazandı!"

 agot_filler_kingslanding.0021.failure_title:0 "Dövüşü Kaybetti..."

 agot_filler_kingslanding.0022.t:0 "Ayakkabıcı Meydanı: Septon"

 agot_filler_kingslanding.0022.desc:0 "Ayakkabıcı Meydanı genellikle meşgul zanaatkârların diyarı olsa da, bazen kendini Yedi Tanrı'ya hararetle tapanların tekelinde bulur. Bu, kısmen meydanın Tanrı Kapısı'nın doğusunda yer almasından ve aynı zamanda inanç vaizleri arasındaki köklü geleneklerin bir sonucudur. Dinleyecek olanlara vaaz vermek için bir septonun sırasını alması hiç de alışılmadık değildir ve bugün de farklı değil."

 agot_filler_kingslanding.0022.a:0 "Hayır, hayır, hayır! Bunların hepsi yanlış! Aynı inanca mı tapıyoruz yoksa?"

 agot_filler_kingslanding.0022.b:0 "[agot_filler_square_septon.GetSheHe] Kocakarı'nın rolü konusunda biraz kafası karışık görünüyor..."

 agot_filler_kingslanding.0022.c:0 "Bunun için vaktim yok."

 agot_filler_kingslanding.0022.d:0 "Şuna bakın — burada uygun bir şekilde domates satan bir delikanlı var..."

 agot_filler_kingslanding.0023.t:0 "$agot_filler_kingslanding.0022.t$"

 agot_filler_kingslanding.0023.desc:0 "Septonun yanında yerimi alıyorum ve [agot_filler_square_septon.GetHerHis] hatalarını haykırmaya başlıyorum. Yüksek sesle. [agot_filler_square_septon.GetSheHe|U] karşılık vermeye çalışıyor ama ben [agot_filler_square_septon.GetSheHe]'den daha zeki ve çok daha inatçıyım. Günün büyük bölümünü büyük bir şevkle inancı tartışarak geçiriyoruz — ancak konu giderek Yedi Tanrı'dan çok kimin haklı olduğu hakkında olmaya başlıyor."

 agot_filler_kingslanding.0023.a:0 "...dur, ben Ayakkabıcı Meydanı'na neden gelmiştim, yine?"

 agot_filler_kingslanding.0023.success_title:0 "Tartışmayı Kazandı!"

 agot_filler_kingslanding.0023.failure_title:0 "Tartışmayı Kaybetti..."

 agot_filler_kingslanding.0024.t:0 "$agot_filler_kingslanding.0022.t$"

 agot_filler_kingslanding.0024.desc:0 "İlk başta, septon nazik düzeltmelerime düpedüz düşmanca davranıyor. Ancak biraz daha dikkatli konuşma ve sabrımın ardından, [agot_filler_square_septon.GetSheHe] sonunda benim noktalarıma yaklaşmaya başlıyor. Sonunda, [agot_filler_square_septon.GetSheHe]'nin durduğu yeri aldığımı ve septonun, kazara oldukça güzel bir vaaz verirken giderek büyüyen kalabalığa katıldığını fark ediyorum!"

 agot_filler_kingslanding.0024.a:0 "Belki de ben septon olmalıydım..."

 agot_filler_kingslanding.0025.t:0 "$agot_filler_kingslanding.0022.t$"

 agot_filler_kingslanding.0025.desc:0 "Domatesin septonun yüzünde açılışını izlerken, paramın son derece isabetli bir yatırım olduğunu anlıyorum! Kalabalıkta onaylamayarak bakan bazı mızmızlar olsa da, pek çoğu benim önderliğimi izleyip seponta fırlatmak için kendi domateslerini satın alıyor. Günün sonunda, Ayakkabıcı Meydanı vaazların sıkıcı pençesinden kurtuluyor, ben iyi bir kahkaha atıyorum ve domates satan delikanlı eve dolu bir para kesesiyle gidiyor."

 agot_filler_kingslanding.0025.a:0 "Herkes iyi vakit geçirdi... septon hariç."

 agot_filler_kingslanding.0026.t:0 "Fırıncının Arabası"

 agot_filler_kingslanding.0026.desc:0 "Ben bir insanım ve bazen bir insan sadece sıcak ekmek yemek ister. Neyse ki, hanları ve tavernalarıyla ünlü Yılan Balığı Sokağı, kimseyi taze, sıcak ekmekten mahrum bırakmaz. Bir fırıncı ve çırağının yönettiği bir arabaya yürüyorum ve o kadar taze ki buharı üstünde olan bir ekmek satın alıyorum.\n\nAğzımı sulandıran bir ısırık aldığımda, pek de lezzetli olmayan bir şey hissediyorum: bir tahta kıymığı. Ekmeği ikiye ayırıyorum ve daha fazlasını buluyorum — bu ekmek, talaşla dolu unla yapılmış!"

 agot_filler_kingslanding.0026.a:0 "Muhafızlar!"

 agot_filler_kingslanding.0026.b:0 "Sizi rezil, rezil piçler!"

 agot_filler_kingslanding.0026.c:0 "Kanun, ekmeğin kutsallığı konusunda açıktır!"

 agot_filler_kingslanding.0026.d:0 "Beni öldürmeye mi çalışıyorsun!?"

 agot_filler_kingslanding.0027.t:0 "$agot_filler_kingslanding.0026.t$"

 agot_filler_kingslanding.0027.desc:0 "Arabanın kenarından tutup yere fırlatıyorum, paramparça oluyor; ardından kalan parçaları kılıcımla doğruyorum. Fırıncı da çırağı da, öfkeye kapılmış halimi korkuyla izlemekten başka bir şey yapamıyor. Araba tamamen yok edildikten sonra fırıncıya yaklaşıp kemerinden sarkan para kesesini kapıyorum — ekmeğe karşı işlenen suçun cezası."

 agot_filler_kingslanding.0027.a:0 "İkinizden birini de bir daha görmeyeyim!"

 agot_filler_kingslanding.0028.t:0 "$agot_filler_kingslanding.0026.t$"

 agot_filler_kingslanding.0028.desc:0 "Kanunlarımız bu konuda gayet açık: fırıncı, una talaş karıştırdığı ve bunu ekmek diye yutturmaya çalıştığı için para cezası ödemek zorunda. Cezayı ödeyemezse, kırbaçlanacak!"

 agot_filler_kingslanding.0028.a:0 "Ödeyin!"

 agot_filler_kingslanding.0029.t:0 "İpek Sokağı"

 agot_filler_kingslanding.0029.desc:0 "İpek Sokağı'ndaki genelevlerden birinden çıkarken bir ses beni selamlıyor. Adam gülümseyip gecemi genelevde nasıl geçirdiğimi soruyor... ah hayır. Yakalandım. Açıkça bundan para kazanmaya çalışıyor."

 agot_filler_kingslanding.0029.a:0 "Fiyatını söyle ve bunu aramızda tutalım."

 agot_filler_kingslanding.0029.b:0 "Benden hiçbir şey alamayacaksın!"

 agot_filler_kingslanding.0029.c:0 "Sanmıyorum ki kimseye bir şey anlatabileceksin..."

 agot_filler_kingslanding.0029.d:0 "Ah! Demek genelev sonuçta bir kılıf mı? Akıllıca."

 agot_filler_kingslanding.0030.t:0 "$agot_filler_kingslanding.0029.t$"

 agot_filler_kingslanding.0030.desc:0 "Elbette genelev bir kılıf — arasından geçen bu kadar çok üst sınıf ve soylu müşteriyle gayet mantıklı. "Bir anlaşma yapalım..."\n\nSabah boyunca genelev sahibiyle konuşuyorsun; planlar yapıyor ve çalışanlarının kandırıp sır toplayabileceği değerli hedefler öneriyorsun. Ve sonra, dost olduğunuz göründüğü anda, genelev sahibine bu küçük ek işinin getirebileceği sonuçları hatırlatıyorsun. Şehir Muhafızları onu bir hücreye mi atardı? Yoksa kurbanları onun, kase kahverengi yemeğin içindeki et olduğunu mu görürdü? Adamın gülümsemesi sönüyor ve yerini korku alıyor."

 agot_filler_kingslanding.0030.a:0 "Yine de bu aramızda kalabilir, yeter ki benim için çalıştığını hatırla."

 agot_filler_kingslanding.0031.t:0 "Kızıl Kale'nin Sıçanları"

 agot_filler_kingslanding.0031.desc:0 "Kendimi Kızıl Kale'nin en çirkin sahnesiyle karşı karşıya buluyorum: bir sıçan sürüsü kendine ev edinmiş. Tiksinerek haşereleri kovalıyorum; duvardaki küçük bir delikten kaybolana dek peşlerinden gidiyorum. Delik... tuhaf. Öyle düzgün oyulmuş ki neredeyse bilinçli bir tasarım tercihi gibi görünüyor. Yıkılıp yıkılmayacağını görmek için küçük oyuğun kenarından çekiyorum ve — Yedi Tanrı aşkına! Gizli bir kapı açan gizli bir kol işlevi görüyor. Kral Maegor'un gizli tünellerinden birini buldum!"

 agot_filler_kingslanding.0031.a:0 "Bu nereye çıkıyor acaba..."

 agot_filler_kingslanding.0031.b:0 "Bir taş ustası bulup bunu kapattıracağım."

 agot_filler_kingslanding.0032.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0032.desc:0 "Tünelde kısa bir mesafe ilerleyince devasa bir çukura rastlıyorum. Karşıya geçmenin tek yolu, ancak ayaklarımı birbiri ardına koyarak yürürsem geçebileceğim kadar dar olan bir köprü. Aşağıdaki çukur o kadar derin ki gözlerim dibini göremiyor — düşersem kesin ölüm."

 agot_filler_kingslanding.0032.a:0 "Göze almaya hazır olduğum bir risk."

 agot_filler_kingslanding.0032.b:0 "Hayatımı riske atmayacağım!"

 agot_filler_kingslanding.0032.c:0 "Güvenliğimi sağlamak için pelerinimden bir koşum yapacağım."

 agot_filler_kingslanding.0033.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0033.desc:0 "Tünelde ilerlerken, bir adım attığımda taş bir levhanın ayağımın altında çöktüğünü hissediyorum; ileriye baktığımda, tünelin yolunda büyük bir sarkacın sallandığını görüyorum."

 agot_filler_kingslanding.0033.a:0 "Yanından koşarak geçecek kadar hızlıyım."

 agot_filler_kingslanding.0033.b:0 "Bunun yerine yaşamayı seçiyorum."

 agot_filler_kingslanding.0033.c:0 "Hareketlerimi kolayca zamanlayabilirim..."

 agot_filler_kingslanding.0033.d:0 "Er ya da geç momentumu tükenecek. Bekleyeceğim."

 agot_filler_kingslanding.0034.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0034.desc:0 "Görmeden önce kokusunu alıyorum ve sıçan sayısı yalnızca bunu doğruluyor: tünelin çökmüş bir bölümünün enkazının altında bir ceset var. Cesedi inceliyorum ve iyi silahlanmış olduğunu görüyorum. Bu bir suikastçıydı!"

 agot_filler_kingslanding.0034.a:0 "Ya tünellerden geçmeyi başarsaydı?"

 agot_filler_kingslanding.0035.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0035.desc:0 "Tünelin çökmüş bir bölümüne rastlıyorum ve dönüp gitmeye hazırlanırken, metal bir kutu seçiyorum. Açıyorum ve hatırı sayılır bir altın buluyorum! Belki de Nazik Kral Maegor kaleyi terk etmek zorunda kalırsa diye hazırlanmış bir acil durum fonuydu..."

 agot_filler_kingslanding.0035.a:0 "Bu parayı cebimde güzel bir yuvaya kavuşturacağım."

 agot_filler_kingslanding.0036.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0036.desc:0 "Tüneli baştan sona keşfediyorum ve diğer uçtan çıktığımda, kendimi lüks bir genelevin arka odasında buluyorum!"

 agot_filler_kingslanding.0036.a:0 "...şey, madem zaten buradayım."

 agot_filler_kingslanding.0036.b:0 "Buraya yalnızca buradan nasıl uzaklaşacağımın tarifini almak için geldim!"

 agot_filler_kingslanding.0037.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0037.desc:0 "Tünelleri daha da derin keşfediyorum; yol boyunca değişmeye başlıyor. Döşeme daha yeni görünüyor. Daha temiz. Hayal edin sevincimi: ortaya çıktığımda kendimi Baelor Septi'nde buluyorum! Komik — Sept, Kral Maegor'un saltanatı sırasında yoktu. Sanırım bu tüneli sonradan eklemiş olmalılar. Ne kadar tuhaf. Birinin bir Sept'e gizli tünel ihtiyacı duymasının nedenini merak ediyorum..."

 agot_filler_kingslanding.0037.a:0 "Elbette, Kral'ın inançla bağı tüneller kadar derin!"

 agot_filler_kingslanding.0037.b:0 "İnanç, Kral'ı gözetlemek için bunu inşa etmiş olmalı."

 agot_filler_kingslanding.0038.t:0 "$agot_filler_kingslanding.0031.t$"

 agot_filler_kingslanding.0038.desc:0 "Tünel sonunda seni tahta bir kapıya götürüyor; açıp geçtiğinde kendini bir Taverna'nın depo odası gibi görünen bir yerde buluyorsun.\n\nMadem buradayım, belki de biraz yiyecek ve şaraba yardım etmeliyim."

 agot_filler_kingslanding.0038.a:0 "Kimse bir iki şişe şarabın yokluğunu fark etmez..."

 agot_filler_kingslanding.0038.b:0 "Şu Dorne salamı mı?"

 agot_filler_kingslanding.0038.c:0 "Bahse girerim sıçanlar da bunu lezzetli bulmuştu. Hayır teşekkürler."

 agot_filler_kingslanding.0039.t:0 "Ejderha Çukuru"

 agot_filler_kingslanding.0039.desc:0 "Harabe halinde olsa da, Rhaenys Tepesi'nin üzerinde yükselen Ejderha Çukuru hafife alınacak gibi değil. Kral Maegor'un emriyle inşa edilen devasa yapı, Maegor'un onu yerle bir ettirmesinin ardından Hatıra Septi'nin harabelerinin üzerine kuruldu. İçinden aynı anda iki düzine şövalyenin atlarıyla geçebileceği kadar büyük kapıları olan, ejderhalar için bir ahır olarak hizmet edecekti. Ancak Ejderhaların Dansı sırasında basıldıktan sonra, çukurun kubbesi yıkıldı ve ne yazık ki terk edildi."

 agot_filler_kingslanding.0039.a:0 "Bu, yakından görmek istediğim bir şey."

 agot_filler_kingslanding.0039.b:0 "Bulunduğum yerden güzel bir manzaram var."

 agot_filler_kingslanding.0040.t:0 "$agot_filler_kingslanding.0039.t$"

 agot_filler_kingslanding.0040.desc:0 "Harabeler görkemleriyle büyüleyici ve o kadar dikkat dağılmışım ki, tahta zeminlerin altımda çöküşünü, içinden düşene kadar fark etmiyorum. Düşüş bana zarar vermese de, kendimi kül ve kömürleşmiş kemiklerin arasında buluyorum. Öğğ. Kendimi pislikten kurtarıp Ejderha Çukuru'ndan tamamen kaçıyorum.\n\nGünün ilerleyen saatlerinde, Büyük Bahar Hastalığı sırasında cesetlerin o kadar çok olduğunu ve Ateşbüyücüler Loncası'nın ölüleri yakmak için Ejderha Çukuru'nu kullanmak zorunda kaldığını hatırlıyorum."

 agot_filler_kingslanding.0040.a:0 "Sanırım o kemikleri gözümün önünden asla silemeyeceğim..."

 agot_filler_kingslanding.0041.t:0 "$agot_filler_kingslanding.0039.t$"

 agot_filler_kingslanding.0041.desc:0 "Ejderha Çukuru'nu keşfederken genç bir kadın bana yaklaşıyor. İlk başta, böyle güzel bir genç bakireyle tanışmak için tuhaf bir yer olduğunu düşünüyorum ama sonra Ejderha Çukuru'nun bazıları tarafından... samimi karşılaşmalar için kullanıldığı söylentilerini hatırlıyorum ve bu genç kadın, Ejderha Çukuru'ndan çok daha fazlasını keşfetmekle oldukça ilgili görünüyor."

 agot_filler_kingslanding.0041.a:0 "Tam bunun için küçük bir köşe biliyorum."

 agot_filler_kingslanding.0041.b:0 "Ben sadece Ejderha Çukuru'nu görmeye geldim, hayır teşekkürler!"

 agot_filler_kingslanding.0042.t:0 "$agot_filler_kingslanding.0039.t$"

 agot_filler_kingslanding.0042.desc:0 "Gözlerime inanamıyorum! Harabe halinde bile, böyle bir yeri inşa eden işçilik. Kral Maegor'un paranoyası yüzünden kaybedilmesi çok yazık — ama yine de hayran kalmaktan kendimi alamıyorum."

 agot_filler_kingslanding.0042.a:0 "Gerçekten ilham aldım!"

 agot_filler_kingslanding.0042.b:0 "Kendimi verirsem, belki bir gün böyle bir şey inşa edebilirim."

 agot_filler_kingslanding.0042.c:0 "Bu manzara nefesimi kesiyor!"

 agot_filler_kingslanding.0043.t:0 "$agot_filler_kingslanding.0039.t$"

 agot_filler_kingslanding.0043.desc:0 "Sonunda, harabelerde sığınan evsiz bir adama rastlıyorum. Yanında, içinde yalnızca birkaç para olan bir dilenci kasesi var."

 agot_filler_kingslanding.0043.a:0 "Al, kendine sıcak bir yemek al."

 agot_filler_kingslanding.0043.b:0 "Onları alıyorum — bu parayı zaten boşa harcardın."

 agot_filler_kingslanding.0043.c:0 "*Adamı görmezden gel.*"

 agot_filler_kingslanding.0043.d:0 "Kimse onun yokluğunu fark etmez.... belki ben..."

 agot_filler_kingslanding.0044.cat_name:0 "Balerion"

 agot_filler_kingslanding.0044.t:0 "Balerion! Ne Bela Şey!"

 agot_filler_kingslanding.0044.desc:0 "Avludan gelen bir gürültü duyuyorum ve araştırmaya gittiğimde, Kralın Şehri'nin o meşhur kedisi Balerion'u ortalığı karıştırırken buluyorum. Avluda bir fareyi kovalıyor ve fare can havliyle kaçıyor. Koşarken, bir yiyecek tepsisi taşıyan bir hizmetkâra çarpıyor ve tepsi havaya uçuyor. Yiyecekler yere saçılıyor ve hizmetkâr pisliği temizlemeye terk ediliyor. "Lanet kedi!" diye bağırdığını duyuyorum hizmetkârın, o şeytanın ardından.\n\nO kedi bir kereden fazla baş belası oldu! Bu konuda bir şeyler yapmalıyım."

 agot_filler_kingslanding.0044.a:0 "O kedinin ihtiyacı olan tek şey iyi bir yuva!"

 agot_filler_kingslanding.0044.a.f:0 "Balerion'u sahipleneceksin ve o senin sadık dostun olacak."

 agot_filler_kingslanding.0044.b:0 "Belki de canlı kesme becerilerimi pratik etme zamanıdır..."

 agot_filler_kingslanding.0044.b.f:0 "Balerion'u inceleyecek ve onun dokuz canının sırlarını öğreneceksin."

 agot_filler_kingslanding.0044.c:0 "Gel buraya kedi! Hızlı bir tekme yiyecen!"

 agot_filler_kingslanding.0044.c.f:0 "Balerion'u, ona biraz görgü öğretmeyi umarak tekmeliyorsun!"

 agot_filler_kingslanding.0044.d:0 "Awwww, şu tatlı minik kediye bakın!"

 agot_filler_kingslanding.0044.d.f:0 "Balerion'u sevecek ve ona küçük bir ödül vereceksin!"

 agot_filler_kingslanding.0044.e:0 "Belki [giving_cat_child.GetFirstName] yeni bir evcil hayvan ister?"

 agot_filler_kingslanding.0044.e.f:0 "Balerion'u [giving_cat_child.GetFirstName]'e hediye olarak vereceksin!"
