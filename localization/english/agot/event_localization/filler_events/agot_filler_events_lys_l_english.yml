l_english:

 agot_filler_lys.0001.t:0 "Güzel Lys"

 agot_filler_lys.0001.desc:0 "Lys'in şehir sokaklarında yürürken, Özgür Topraklar'ın Valyrialılarının bu adayı neden cennet saydığını hatırlıyorum. Yaz Denizi güneşinin öpücüğüyle ısınan, narenciye kokuları taşıyan tuzlu bir okyanus meltemi, parfümlü bahçelerin, sayısız zevk evinin ve göz alabildiğine uzanan özel sarayların yanından geçerken beni kucaklıyor.\n\nBunların hepsi, özgür şehri Yedi Krallık lordlarının miraslarını yönettiği gibi yöneten tüccar prenslerin ve rakiplerinin malı. Yolculuğum sona ererken şehrin kalbindeki dağ gibi Ticaret Tapınağı'nın önünde duruyorum. Bu, Lys'te tek önemli tanrıya adanmış, tartışmasız görkemli bir anıt: #bold altın tanrısına#!."

 agot_filler_lys.0001.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'den ilham aldı."

 agot_filler_lys.0001.a:0 "Mimarlık hakkında daha fazla şey öğrenmeliyim!"

 agot_filler_lys.0001.a.a:0 "#P Faydalı bir şey öğreniyorum#!"

 agot_filler_lys.0001.a.b:0 "#N Faydalı bir şey öğrenemiyorum#!"

 agot_filler_lys.0001.b:0 "Belki dünya hakkında daha çok şey öğrenmeliyim..."

 agot_filler_lys.0001.c:0 "Bu güzel manzara beni... #S heyecanlandırıyor!#!"

 agot_filler_lys.0001.d:0 "Bütün gün burada oturabilirim..."

 agot_filler_lys.0011.t:0 "Korsanlığın Cezası"

 agot_filler_lys.0011.desc:0 ""Cennette bir sabah, [ROOT.Char.GetTitleAsNameNoTooltip]?" Yakışıklı hizmetkârın sorusu, güneşli balkondaki sessiz hayallerimi bölüyor. Ama daha cevap verebilmeden muhafızlarım arkamdaki kapılardan fışkırıyor.\n\nAyağa kalkıp, derinliklerden çıkarılmış en tuzlu deniz kurduna benzeyen birini önüme, fayans zemine ıslak bir martı gibi bıraktıklarını görüyorum. "Bu hödük, [pirate.GetHerHis] haşarat sürüsü senin malından seni mahrum etmeyi başaramayınca adaletinden kaçabileceğini sandı. [pirate.GetHerHis|U] dostları aptalca direnmeye kalktı. Sadece bu yaratık teslim oldu."\n\n[pirate.GetSheHe|U], dostları benim hazineme ölmeye razıyken kendi postunu kurtaracak kadar akıllıymış. Belki [pirate.GetHerHim]'de görebildiğimden fazlası vardır. Onu deşip işi bitirmek daha güvenli — ama yine de [pirate.GetHerHis] adını sormadan edemiyorum. Pisliğin gülümsemesi kırık dişlerinin arasından parlıyor; "[pirate.GetName]. Kaçakçı ve hırsız!" diye cevap veriyor. Bir suçlu için tuhaf bir gurur. Böyle küstah bir [pirate.GetWomanMan]'ın bir işe yarar hali olabilir mi?"

 agot_filler_lys.0011.returned_gold.tt:0 "#P Altının sana iade edilecek.#!"

 agot_filler_lys.0011.no_returned_gold.tt:0 "#N Altının, [pirate.GetHerHis] hizmetinin karşılığı olarak korsanda kalacak.#!"

 agot_filler_lys.0011.a:0 "Manzaranın tadını #italic benim#! prangamdan çıkar!"

 agot_filler_lys.0011.b:0 "Cennetteki sabahımı bölmeye nasıl cüret edersin!"

 agot_filler_lys.0011.c:0 "Altını al, ama bana hayatını borçlusun..."

 agot_filler_lys.0011.d:0 "Hayatın senin, deli it."

 agot_filler_lys.0031.t:0 "Çarşıda Bir Gün"

 agot_filler_lys.0031.desc:0 "Bugün balkonumdan baktığımda Lys'in hareketli pazar meydanları ve gürültülü forumları şarkı söylüyor. Bu noktadan, onun efsanevi Valyria mimarisi ve sayısız sakinleri çocuk oyuncakları gibi görünüyor.\n\nTatlı Lys kırmızısından uzun bir yudum, saraylarından inmeye ve aramaya istekli olanlar için Lys'in derinliklerinde oyuncaklardan fazlası olduğunu hatırlatıyor."

 agot_filler_lys.0031.a:0 "Neden olmasın? Kim bilir ne keşfedebilirim!"

 agot_filler_lys.0031.b:0 "İnsanlığın süprüntüleriyle kuşatılmak mı? Hiç sanmam."

 agot_filler_lys.0032.t:0 "Çarşıyı Keşfetmek"

 agot_filler_lys.0032.desc:0 "Halkın arasına karışma isteğim kısa sürede ödüllendiriliyor. Sokakları dolduran ve tezgâhlarıyla ilgilenen tüccar ve seyyar satıcılar kim olduğumu anlamaya başlayınca kalabalıkta bir mırıltının dalgalanıp büyüdüğünü görüyorum; ustalar hizmetkârlara anlamsız çer çöpü üzerime yağdırmalarını emrederken bir yandan da bunların değerini ballandıra ballandıra anlatıyorlar.\n\nPazarı nasıl da seviyorum! Ne alsam? Zarif bir mücevher? Belki bir kitap için... ah, ama şu parçadaki işçiliğe bakın..."

 agot_filler_lys.0032.travel_desc:0 "Şehre hayranlıkla bakınıyorum. Sokakları dolduran ve tezgâhlarıyla ilgilenen tüccar ve seyyar satıcılar kim olduğumu anlamaya başlayınca kalabalıkta bir mırıltının dalgalanıp büyüdüğünü görüyorum; ustalar hizmetkârlara anlamsız çer çöpü üzerime yağdırmalarını emrederken bir yandan da bunların değerini ballandıra ballandıra anlatıyorlar.\n\nPazarı nasıl da seviyorum! Ne alsam? Zarif bir mücevher? Belki bir kitap için... ah, ama şu parçadaki işçiliğe bakın..."

 agot_filler_lys.0032.desc.jewelry_a:0 "Kuyumcu, isim günündeki bir çocuk gibi sırıtıyor; [market_merchant.GetSheHe] karartılmış perdelerin arkasına telaşla koşuyor. Acele ayak sesleri duyana kadar volta atıyorum ve eli kolu her boydan abanoz kutuyla dolu, buruşuk küçük [market_merchant.GetWomanMan]'ın geri geldiğini görüyorum.\n\n[market_merchant.GetSheHe] bunları bir tezgâha dizdikten sonra her kapağı kaldırıyor; ortaya, en kudretli hükümdarları bile hayranlıkla eritecek bir koleksiyon çıkıyor ve gerçekten arzuladığım parçayı seçmem bir anımı alıyor..."

 agot_filler_lys.0032.desc.jewelry_b:0 "Kuyumcu başını sallayıp gülümsüyor; [market_merchant.GetSheHe] beni dükkânında gezdiriyor. [market_merchant.GetSheHe] mesleğinin ustası; sunduğu her parçaya tepkimi fark ediyor ve sonunda seçimi, seçmeyi asla düşünmeyeceğim ama bayılacağım bir şeye indiriyor!"

 agot_filler_lys.0032.desc.jewelry_c:0 "Kuyumcu, düşünürken çenesini kaşımadan önce biraz hırıldıyor. Dalgın dalgın dönüp bir tezgâhın arkasında gözden kayboluyor; ardından masanın üzerine birkaç tozlu mücevher sandığı fırlatıyor, sert bir şeyden bir yudum alıyor ve beni işimle baş başa bırakıyor."

 agot_filler_lys.0032.desc.jewelry_d:0 "Bu zavallı gösteri inanılır gibi değil. Lys'te memnuniyetsiz müşteri kim duymuş? Ne rezalet! Ama sanırım bunlar sadece basit küçük halk..."

 agot_filler_lys.0032.desc.book_a:0 "Uzmanın gözleri tanıyınca iri iri açılıyor; [market_merchant.GetSheHe] paytak paytak uzaklaşıyor, ayakkabıları merdivenlerde tıkırdıyor ve kocaman metal bir kasa gibi ses çıkaran bir şeyi açıyor. [market_merchant.GetSheHe|U] bana sesleniyor; yukarı çıkıp [market_merchant.GetHerHim]'i, aralık tutulmuş büyük bir metal kapının önünde dururken görüyorum; kapı gerçekten nadir kopyalardan oluşan bir koleksiyonu ve hatta birkaç ilk baskıyı gözler önüne seriyor!"

 agot_filler_lys.0032.desc.book_b:0 "Kitap meraklısı beni bölümler boyunca nazikçe gezdirtiyor, her birini sanki iyi kalpli bir yaşlı [market_merchant.GetWomanMan] gibi açıklıyor. [market_merchant.GetHerHis|U] koleksiyonu etkileyici, ama ne istediğimi bildiğimi sanıyorum."

 agot_filler_lys.0032.desc.book_c:0 "Yaşlı ve iyi kalpli [market_merchant.GetWomanMan] bana bir gülümseme sunuyor ve beni tezhipli el yazmaları ve diğer az sözcüklü metinler içeren bir bölüme yönlendiriyor. Tüm o güzel resimleri severim, ama sözcük ne kadar azsa o kadar iyi."

 agot_filler_lys.0032.desc.book_d:0 "Bu zavallı gösteri inanılır gibi değil. Lys'te memnuniyetsiz müşteri kim duymuş? Ne rezalet! Ama sanırım bunlar sadece basit küçük halk..."

 agot_filler_lys.0032.desc.furniture_a:0 "Sahip, ne demek istediğimi anında anlıyor; [market_merchant.GetSheHe] beni deponun yalnızca en arzu edilen parçaların sergilendiği bölümüne götürüyor. [market_merchant.GetHerHis|U] seçkisi nefes kesici ve bazı parçalar gerçekten eşsiz!"

 agot_filler_lys.0032.desc.furniture_b:0 "Depoda gezinirken her seçeneği tartıp dekorumu nasıl vurgulayacağını — ya da mahvedeceğini — düşünerek acele etmiyoruz. Sonunda, sarayda kesinlikle sohbet başlatacak kaliteli bir parça buluyorum!"

 agot_filler_lys.0032.desc.furniture_c:0 "[market_merchant.GetHerHis|U] kaşları çatılıyor; [market_merchant.GetSheHe] endişeli görünen bir çırağa bir şeyler bağırıyor. Çocuk parmaklarımdan birini tutup beni daha sade tarzda bir dizi parçaya yönlendiriyor."

 agot_filler_lys.0032.desc.furniture_d:0 "Bu zavallı gösteri inanılır gibi değil. Lys'te memnuniyetsiz müşteri kim duymuş? Ne rezalet! Ama sanırım bunlar sadece basit küçük halk..."

 agot_filler_lys_0032.outro:0 "\n\nGüneş alçalmadan daha vakit var. #italic Bir tezgâhı mı ziyaret etsem, yoksa malikâneme mi dönsem?#!"

 agot_filler_lys_0032.outro_travel:0 "\n\nGüneş alçalmadan daha vakit var. #italic Bir tezgâhı mı ziyaret etsem, yoksa yoluma devam mı etsem?#!"

 agot_filler_lys.0032.a:0 "Belki özenle işlenmiş, parıldayan bir şey?"

 agot_filler_lys.0032.b:0 "Lys'te bir yerlerde muhteşem bir bilgi saklanmış olmalı..."

 agot_filler_lys.0032.c:0 "Sarayıma sergileyecek bir şey istiyorum."

 agot_filler_lys.0032.d:0 "Eve dönme zamanı."

 agot_filler_lys.0032.d.travel:0 "Bunun için vaktim yok."

 agot_filler_lys.0033.t:0 "Mücevherlere Bakmak"

 agot_filler_lys.0033.desc:0 "Vitrinden vitrine gezdikçe her mücevher parçası bir öncekinden daha zarif görünüyor. Seçimi birkaç seçeneğe indirdiğimde, köşe dükkânının sahibi olan kırışık suratlı Lysli kuyumcu çarpık bir gülümsemeyle yanıma paytak paytak geliyor.\n\n"Gel, bir bak," diye çağırıyor [market_merchant.GetFirstName]. "Neyle ilgilenirsin?""

 agot_filler_lys.0033.desc.special:0 "\n\nHiçbir şey ilgimi çekmiyor ve bunu [market_merchant.GetFirstNameNoTooltip]'e belli ediyorum. "Evet, evet! Ne zarif bir zevkiniz var, [ROOT.Char.GetTitleAsNameNoTooltip]," diye karşılık veriyor [market_merchant.GetSheHe|l]. "Keskin bir gözünüz olduğunu anlayabiliyorum. Belki de şununla ilgilenirsiniz?""

 agot_filler_lys.0033.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'deki pazarları ziyaret etti."

 agot_filler_lys.0033.a:0 "En seçkin müşterilerine gösterdiğin parçalardan elbette vardır, değil mi?"

 agot_filler_lys.0033.b:0 "Hepsi benim için bir mücevher denizi!"

 agot_filler_lys.0033.c:0 "Pahalı görünen bir şeyin var mı?"

 agot_filler_lys.0033.d:0 "Ne korkunç. Görünüşe göre hiçbir şey gözüme girmiyor..."

 agot_filler_lys.0034.t:0 "El Yazmalarına ve Parşomenlere Bakmak"

 agot_filler_lys.0034.desc:0 "Kapıda balta taşıyan muhafazlar, özel bir kitap koleksiyoncusunun konağının önündeki ara sokakta beklerken beni süzüyor. Uzman beni selamlamak için kapıyı açınca, kabadayılar başlarını sallayıp ikinci kata bakan nefes kesici bir girişe [market_merchant.GetHerHim]'i takip etmem için beni geçiriyor.\n\nBelirli bir yaştaki kitapların kendine özgü bir kokusu vardır ve burnuma güvenebilirsem burası kadim bilgilerle dolu olmalı. Taban tavana duvarlar, kuşaklar boyunca toplanmış olması gereken her türden parşömen ve ciltle kaplı!"

 agot_filler_lys.0034.desc.special:0 "\n\nAma ben sıradan bir ziyaretçi değilim. Benimki gibi bir zihin, bir kılıcın bileği taşına ihtiyaç duyduğu gibi kitaplara ihtiyaç duyar. "Her #italic müşteriye#! göstermediğin bir şeylerin olmalı," diye yalvarıyorum. "Ah, evet, [ROOT.Char.GetTitleAsNameNoTooltip], tam olarak ne arzuladığını biliyorum," diye sunuyor [market_merchant.GetFirstName]."

 agot_filler_lys.0034.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'deki çarşıları ziyaret etti."

 agot_filler_lys.0034.a:0 "Aradığım #italic birtakım#! gizli bilgiler var..."

 agot_filler_lys.0034.b:0 "Koleksiyoncu önerisi ne olacak acaba?"

 agot_filler_lys.0034.c:0 "Bilgi lapadır ve benim ihtiyacım olan tek şey bir kase."

 agot_filler_lys.0034.d:0 "Kitap mı satıyorsun, yoksa kurtlara ve farelere yer mi kiralıyorsun?"

 agot_filler_lys.0034.toast.got_book:0 "Bir kitap eseri satın aldın!"

 agot_filler_lys.0035.t:0 "Mobilyalara Bakmak"

 agot_filler_lys.0035.desc:0 "Göbekli sahip, limanın yakınındaki geniş deposuna beni içeri buyur ederken, kereste ve vernik kokusunun sarhoş edici aroması, yalnızca en seçici müşteriler için derlenip sergilenen zanaatkâr işi parçaların dizildiği sıralar boyunca beni ileri götürüyor.\n\nKoleksiyonun neredeyse tamamı cesur, duyusal Lys tarzında ve bir fıçı Arbor Altını'yla takas edilebilecek kadar sansasyonel bazı parçalar seçiyorum!"

 agot_filler_lys.0035.desc.special:0 "\n\nYine de, kendimi şaşaalı bir havada buluyorum. "Elinde yedekte tuttuğun bir şey var mı? Benim gibi bir [ROOT.Char.GetTitleAsNameNoTooltip]'e yakışacak bir şey?" Sorumu yüksek sesle duyuruyorum ve [market_merchant.GetFirstNamePossessive] gözlerinin irileştiğini görüyorum."

 agot_filler_lys.0035.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'deki çarşıları ziyaret etti."

 agot_filler_lys.0035.a:0 "Sadece en zarif işçilik olur."

 agot_filler_lys.0035.b:0 "İsteyeceğim birçok güzel parça görüyorum."

 agot_filler_lys.0035.c:0 "Bu eski şey ne kadar?"

 agot_filler_lys.0035.d:0 "Bu mu yani? Bu mobilyaya bir köpeğin işemesine bile izin vermezdim!"

 agot_filler_lys.0040.t:0 "Çarşıyı Keşfetmek"

 agot_filler_lys.0040.desc:0 "Halkın arasına karışma isteğim kısa sürede ödüllendiriliyor. Sokakları dolduran ve tezgâhlarıyla ilgilenen tüccar ve seyyar satıcılar kim olduğumu anlamaya başlayınca kalabalıkta bir mırıltının dalgalanıp büyüdüğünü görüyorum; ustalar hizmetkârlara anlamsız çer çöpü üzerime yağdırmalarını emrederken bir yandan da bunların değerini ballandıra ballandıra anlatıyorlar.\n\nPazarı nasıl da seviyorum! Ne alsam? Tatlı bir parfüm? Belki de bir iksir... ama şu parçadaki işçiliğe bakın..."

 agot_filler_lys.0040.travel_desc:0 "Şehre hayranlıkla bakınıyorum. Sokakları dolduran ve tezgâhlarıyla ilgilenen tüccar ve seyyar satıcılar kim olduğumu anlamaya başlayınca kalabalıkta bir mırıltının dalgalanıp büyüdüğünü görüyorum; ustalar hizmetkârlara anlamsız çer çöpü üzerime yağdırmalarını emrederken bir yandan da bunların değerini ballandıra ballandıra anlatıyorlar.\n\nPazarı nasıl da seviyorum! Ne yapsam? Simyacıyı ziyaret mi etsem? Ah şu zırh parçasındaki işçiliğe bak... Bu güzel koku da ne?"

 agot_filler_lys.0040.desc.alchemy_a:0 "Simyacının gözlükleri lamba ışığında parlıyor; titreyen bir el, [market_merchant.GetHerHis] yırtık deri önlüğüne dikilmiş gizli bir cepten bir anahtar çıkarıyor. [market_merchant.GetSheHe|U] onu göğsüne yakın tutuyor; [market_merchant.GetSheHe], döşeme tahtalarının altına gizlediği gizli bir bölmeye seke seke gidiyor, oradaki kasayı açıp özel şişe, lapa, iksir ve tonik koleksiyonunu açgözlü bir sırıtışla ortaya çıkarıyor."

 agot_filler_lys.0040.desc.alchemy_b:0 "Yaşlı [market_merchant.GetWomanMan] birkaç an düşünüp kafasını kaşıdıktan sonra atölyesinde dolaşıyor, raflardan ve dolaplardan türlü türlü şişeler çekip güçlü içkilerden oluşan bir karışımı tezgâhın üzerine döküyor ve bir ziyafete liderlik eden bir magister gibi kollarını iki yana açıyor."

 agot_filler_lys.0040.desc.alchemy_c:0 "Deli [market_merchant.GetWomanMan] kıkırdayıp başını geriye atarak kahkaha atıyor. [market_merchant.GetSheHe|U], nefes kesici renklerde şişelerin olduğu bir rafa beni çağırırken avucunun içine şiddetle öksürmeye başlıyor! Onaylayarak başımı sallıyorum. Belki de [market_merchant.GetSheHe] sonuçta yalnızca yanlış anlaşılmış bir dâhidir?"

 agot_filler_lys.0040.desc.alchemy_d:0 "Bu zavallı gösteri inanılır gibi değil. Lys'te memnuniyetsiz müşteri kim duymuş? Ne rezalet! Ama sanırım bunlar sadece basit küçük halk..."

 agot_filler_lys.0040.desc.armory_a:0 "Kudretli demirciye yerinde bir iltifat ettiğimde [market_merchant.GetSheHe] beni mütevazı bir gülümsemeyle ödüllendiriyor, [market_merchant.GetHerHis] çıraklarına işlerine devam etmeleri için işaret ediyor ve tunç yarı tanrının en iyi mallarından oluşan bir hazineyi ortaya çıkaran ağır bir perdeyi geri çekiyor!"

 agot_filler_lys.0040.desc.armory_c:0 "Deneyimli zanaatkâr, uzattığı çekiciyle dükkânının her yanına dizilmiş, her türden zarif eser taşıyan rafları işaret ediyor. Ben koleksiyonu incelemeye başlarken [market_merchant.GetSheHe|U] kalfaların yanında işine devam ediyor."

 agot_filler_lys.0040.desc.armory_e:0 "Bu zavallı gösteri inanılır gibi değil. Lys'te memnuniyetsiz müşteri kim duymuş? Ne rezalet! Ama sanırım bunlar sadece basit küçük halk..."

 agot_filler_lys.0040.desc.perfume_a:0 "Parfümcünün gözleri sevinçle irileşiyor; [market_merchant.GetSheHe] hevesle beni salonunda dinlenmeye ve ikramlara davet ederken hizmetkârlar yanımdan geçip burnumun zevkle soluduğu en nefis kokulardan bazılarını püskürtüyor."

 agot_filler_lys.0040.desc.perfume_b:0 "Parfümcünün hızlı bir alkışı, her biri küçük bir şişe taşıyan bir güzel kızlar sürüsünü çağırıyor. Sokakta ilerlerken her biri benim emrimle kokulu bulutlar salıyor ve ben her bir muhteşem seçeneği tartıyorum."

 agot_filler_lys.0040.desc.perfume_c:0 "Yapışkan tart, isteğim karşısında soğukkanlılığını kaybediyor. [market_merchant.GetHerHis|U] perişan yüzü yalnızca bir an buruşuyor; sonra [market_merchant.GetSheHe] kendini toparlayıp beni, daha basit tasarımlı küçük, rengârenk parfüm şişeleri sergilenen bir vitrine götürüyor."

 agot_filler_lys.0040.desc.perfume_d:0 "Bu zavallı gösteri inanılır gibi değil. Lys'te memnuniyetsiz müşteri kim duymuş? Ne rezalet! Ama sanırım bunlar sadece basit küçük halk..."

 agot_filler_lys_0040.outro:0 "\n\nGüneş alçalmadan daha vakit var. #italic Bir tezgâhı mı ziyaret etsem, yoksa malikâneme mi dönsem?#!"

 agot_filler_lys_0040.outro_travel:0 "\n\nGüneş alçalmadan daha vakit var. #italic Bir tezgâhı mı ziyaret etsem, yoksa yoluma devam mı etsem?#!"

 agot_filler_lys.0040.a:0 "Lys'te bir yerlerde deli, yaşlı bir simyacı olduğunu duymuştum..."

 agot_filler_lys.0040.b:0 "İhtiyacım olan şey silah ve zırh."

 agot_filler_lys.0040.c:0 "Yeni sezon için yeni bir koku. Parfümcüye!"

 agot_filler_lys.0040.d:0 "Eve dönme zamanı."

 agot_filler_lys.0040.d.travel:0 "Bunun için vaktim yok."

 agot_filler_lys.0041.t:0 "Simyacıyı Ziyaret"

 agot_filler_lys.0041.desc:0 "Sonunda, bir Lysli simyacının atölyesi olduğu söylenen pis, bakımsız evi buluyorum. Yapının kendisi harap olabilir, ama kalın ahşap kapı türlü mekanizmalarla kilitli ve sürgülü olmalı; varlığımı bildirince öteki taraftan bir dizi mekanizmanın kayıp açıldığını duyabiliyorum.\n\nİşlem tamamlanınca kapı ardına kadar açılıyor ve karşımda dağınık, bakımsız saçlı, is lekeli deri bir önlük giymiş yaşlı bir [market_merchant.GetWomanMan] beliriyor. [market_merchant.GetSheHe|U] laboratuvar demeye tenezzül ettiği yeri incelerken heyecanlı bir kıkırtıyla ellerini ovuşturarak beni içeri çağırıyor."

 agot_filler_lys.0041.desc.special:0 "\n\nÇoğu kişi için sergilenen iksirler yeterli olurdu, ama ben keskin zekâlıyımdır. "Söyle bakalım, benim gibi sıra dışı bir müşteriye sattığın bir şey var mı?" Bahsim kazandı, [market_merchant.GetFirstNamePossessive] sırıtışı iyice genişliyor."

 agot_filler_lys.0041.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'deki çarşıları ziyaret etti."

 agot_filler_lys.0041.a:0 "Edinmiş olabileceğin her türlü... yasak bilgi için ödeme yapmaya hazırım."

 agot_filler_lys.0041.b:0 "Daha özel bir araştırmaya ihtiyacım var."

 agot_filler_lys.0041.c:0 "Yeni başlayanlar için metinleriniz var mı?"

 agot_filler_lys.0041.d:0 "Merlin pulu ve kuğu kızı tüyü satan deli bir [market_merchant.GetWomanMan]'sın!"

 agot_filler_lys.0042.t:0 "Zırhçıyı Ziyaret"

 agot_filler_lys.0042.desc:0 "Sonunda, diğer tüm demircilerin hürmetle bahsettiği bir demircinin atölyesine varıyorum. Dışarıda dururken nedenini anlıyorum; [market_merchant.GetHerHim]'i çalışırken izliyorum. [market_merchant.GetHerHis|U] teni sıcaklık yayıyor — ocağın sıcağından ter içinde kalmış [market_merchant.GetSheHe], canlı tunçtan yapılmış gibi parlıyor.\n\n[market_merchant.GetHerHis|U] işi tüm dikkatini alıyor, ama körüğü çeken çıraklardan biri [market_merchant.GetHerHim]'e varlığımı bildiriyor; [market_merchant.GetSheHe] elindeki metali dövmeye devam ederken başını kaldırıp bana bakıyor."

 agot_filler_lys.0042.desc.special:0 "\n\n[market_merchant.GetFirstName]'in bakışı, [market_merchant.GetHerHis] işinin kalitesi konusunda beni ikna etmeye yetiyor, ama kendimi cesur hissediyorum. "Yalnızca #italic en zarif#! işini görmek istiyorum," diye [market_merchant.GetHerHim]'e etki bırakıyorum."

 agot_filler_lys.0042.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'deki çarşıları ziyaret etti."

 agot_filler_lys.0042.a:0 "Braavos Titanı'nı utandırdın, dostum! O zırh parçasını alıyorum."

 agot_filler_lys.0042.b:0 "Kudretli bir kahl'a layık bir silaha ihtiyacım var!"

 agot_filler_lys.0042.c:0 "Mevkiime yakışır bir zırha ihtiyacım var, elinde var mı?"

 agot_filler_lys.0042.d:0 "Daha iyi bir silaha ihtiyacım var ve bunu yapabilecek [market_merchant.GetWomanMan]'ın sen olduğunu duydum."

 agot_filler_lys.0042.e:0 "Bu da ne? Karıncalar için silahhane mi?"

 agot_filler_lys.0043.t:0 "Parfümlere Bakmak"

 agot_filler_lys.0043.desc:0 "Büyüleyici küçük parfümcü dükkânına giriyorum; havada birbirine karışan karmaşık kokulardan oluşan bir bulut beni karşılıyor ve sahibinin neler hazırladığının vaadini taşıyor. Bir hizmetkâr, çınlayan bir zili çalmadan önce peynir ve şarap ikram ediyor.\n\nTıngırtı sessizliğe gömülürken, ipeklere bürünmüş, yüzüne cömertçe pudra dökünmüş zarif bir [market_merchant.GetWomanMan], beni resmen selamlamak için mermer merdivenlerden iniyor ve hangi kokunun arzuma uyacağını seçme sürecine başlıyor."

 agot_filler_lys.0043.desc.special:0 "\n\n[market_merchant.GetFirstName] ile göz göze geliyorum, ona gerçekten eşsiz bir şey sunması için yalvarıyorum... Sarayımdaki herkesin yavru köpekler gibi yanıma sokulmasına yol açacak kadar gösterişli bir koku."

 agot_filler_lys.0043.modifier_desc:0 "Bu karakter yakın zamanda [ROOT.Var('Lys').Province.GetName]'deki çarşıları ziyaret etti."

 agot_filler_lys.0043.a:0 "En nefis parfüme #italic sahip olmalıyım#!. Olmazsa ölürüm."

 agot_filler_lys.0043.b:0 "Bu günlerde moda olan ne?"

 agot_filler_lys.0043.c:0 "Büyükannem ne giyerdi?"

 agot_filler_lys.0043.d:0 "Bu sıradanlık anıtından benim bokum bile daha güzel kokar!"

