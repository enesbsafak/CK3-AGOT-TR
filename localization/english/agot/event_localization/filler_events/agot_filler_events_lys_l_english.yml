### TODO NOT-IN-ST: agot_filler_lys.0001.desc [AGOT: Walking the city streets of Lys, I remember why the Valyrians of the Freehold considered this island a paradise. A salty ocean breeze, warmed by the kiss of the Summer Sea sun and carrying citrusy scents, cradles me as I pass by perfumed gardens, pleasure houses beyond count, and sprawling private palaces.\n\nAll of this is the property of merchant princes and their competitors who rule the free city just as the lords of the Seven Kingdoms rule their inheritance. As my journey reaches its end I stand before the mountainous Temple of Trade at the heart of the city. It is a monument of undeniable majesty dedicated to the only god that matters in Lys: #bold the god of gold#!.]
 agot_filler_lys.0001.desc:0 "Walking the city streets of Lys, I remember why the Valyrians of the Freehold considered this island a paradise. A salty ocean breeze, warmed by the kiss of the Summer Sea sun and carrying citrusy scents, cradles me as I pass by perfumed gardens, pleasure houses beyond count, and sprawling private palaces.\n\nAll of this is the property of merchant princes and their competitors who rule the free city just as the lords of the Seven Kingdoms rule their inheritance. As my journey reaches its end I stand before the mountainous Temple of Trade at the heart of the city. It is a monument of undeniable majesty dedicated to the only god that matters in Lys: #bold the god of gold#!."
