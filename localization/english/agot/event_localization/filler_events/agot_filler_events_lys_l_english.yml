 agot_market_book_description:0 "Dünya geniş bir yer ve bu cilt onun genişliğini kapsıyor."

 agot_market_book_name_alchemy:0 "Simyacı"

 agot_market_book_description_alchemy:0 "Bazıları bu cildin sadece iksirler ve toniklerle ilgili olduğunu söyler, ama aslında kişinin kaderini bulmakla ilgilidir."

 agot_market_perfume_name:0 "Buz ve Ateşin Kokusu"

 agot_market_perfume_description:0 "O keskin karışım burun deliklerini hem serinletiyor hem yakıyor... Ne yazık ki her şişenin tamamlanması neredeyse on yıl sürüyor."
