### TODO NOT-IN-ST: agot_filler_lys.0041.desc [AGOT: Finally I track down the fetid tenement purported to be the workshop of a Lyseni alchemist. The structure itself might be dilapidated, but the thick wooden door must be well locked and bolted with all manner of mechanisms as I can hear a sequence of them sliding and unlocking on the other side after my presence is announced.\n\nOnce the process is complete the door swings wide to reveal an old [market_merchant.GetWomanMan] with wild, unkempt hair wearing a soot stained leather apron. [market_merchant.GetSheHe|U] beckons me further in while rubbing [market_merchant.GetHerHis] hands together with an excited giggle as I begin to look around what [market_merchant.GetSheHe] deigns to call a laboratory.]
 agot_filler_lys.0041.desc:0 "Finally I track down the fetid tenement purported to be the workshop of a Lyseni alchemist. The structure itself might be dilapidated, but the thick wooden door must be well locked and bolted with all manner of mechanisms as I can hear a sequence of them sliding and unlocking on the other side after my presence is announced.\n\nOnce the process is complete the door swings wide to reveal an old [market_merchant.GetWomanMan] with wild, unkempt hair wearing a soot stained leather apron. [market_merchant.GetSheHe|U] beckons me further in while rubbing [market_merchant.GetHerHis] hands together with an excited giggle as I begin to look around what [market_merchant.GetSheHe] deigns to call a laboratory."
