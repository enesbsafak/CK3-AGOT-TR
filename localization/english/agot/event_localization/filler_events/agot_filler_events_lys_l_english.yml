### TODO NOT-IN-ST: agot_filler_lys.0031.desc [AGOT: The bustling market squares and noisy forums of Lys sing today as I look out from my balcony. From this vantage, her fabled Valyrian architecture and myriad inhabitants look like children's toys.\n\nA long sip of sweet Lysene red reminds me there are more than toys available in the depths of Lys for those willing to descend from their palaces and seek them out.]
 agot_filler_lys.0031.desc:0 "The bustling market squares and noisy forums of Lys sing today as I look out from my balcony. From this vantage, her fabled Valyrian architecture and myriad inhabitants look like children's toys.\n\nA long sip of sweet Lysene red reminds me there are more than toys available in the depths of Lys for those willing to descend from their palaces and seek them out."
