 agot_scenario_ats.9034.t:0 "Galip Aslan"

 agot_scenario_ats.9034.desc:0 "Dulun ordusu paramparça; deneyimli Ser [eustace.GetFirstName]'in kuvvetleri alandan galip ayrılıyor. Üstün kuvvetlere karşı kazanılan bu dikkat çekici zafer, chequy aslanını her zamankinden güçlü ve bir çitin sıradan şövalyesine daha az muhtaç bırakıyor. Sabah gökyüzü kanlı bir kızıla dönerken, Ser [eustace.GetFirstNameNoTooltip]'in bana verdiği adamların komutasını iade ediyor, eşyalarımı toplayıp ayrılmaya hazırlanıyorum.\n\nEgg ve ben, her zaman olduğu gibi, çitlere döneceğiz."

