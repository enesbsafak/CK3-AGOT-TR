 agot_scenario_ats.9033.t:0 "Kırık Aslan"

 agot_scenario_ats.9033.desc:0 "Ser [eustace.GetFirstNamePossessive] komutasındaki ordunun ne kadar küçük olduğu göz önüne alındığında, [eustace.GetHerHis] adamlarının çevremde ölü ve kırık yatması belki de sürpriz olmamalı. Alan, [rohanne.GetTitledFirstName] kan kızılı sabah göğünün altında zaferini iddia ederken kanayan cesetlerle dolu. Ser [eustace.GetFirstNameNoTooltip] tarafından bana verilen kendi adamlarım evlerine dönüyor.\n\nEgg ve ben, her zaman olduğu gibi, çitlere dönecek ve gördüğümüz her şeyi unutmaya çalışacağız."

