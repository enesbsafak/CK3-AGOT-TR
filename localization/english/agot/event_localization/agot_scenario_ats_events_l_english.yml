 agot_scenario_ats.1000.t:0 "Yurtdışındaki Kara Ejderha"

 agot_scenario_ats.1000.desc:0 "Gece uykuya süzülürken, rüyalar sessiz saatlerimi takip ediyor. Kardeşlerimin, kızıl çimen denizinin ortasında kendi canlarıyla boğuşmasının rüyaları. Bir çekicin, babamın ordusunu soğuk demir bir örs üzerinde nasıl parçaladığını. Ağlayan bir sırtın altında, bir kardeşin okunun kara bir ejderhanın yüreğini bulmasını.\n\nO görüler korkunç biçimde doğru çıktı; yeni rüyalarımın da çıkacağını bildiğim gibi. Son zamanlarda, bir düğün şöleninin ortasında güçlü bir ejderhanın soğuk kabuğundan koparak kurtuluşunu gördüm. Göz kamaştırıcı beyaz zırh kuşanmış, arkasında eşleşen bir pelerin dalgalanan bir devin, gümüş saçlı bir kralın yanında durduğunu gördüm. Bu görülerin her ayrıntısı, her yorumu üzerinde kıvrandım. Artık biliyorum ki ilki, doğum hakkımı iddia edecek bir ejderha olacak; dev ise onu korumama yardım edecek muhafız.\n\nBu rüyalar krallığımın habercisi — babamın oğlu olduğumun son kanıtı. Ama dünyaya kanıtlamadan önce, amcam [bittercringe.GetNameNicknamed]'e kanıtlamalıyım."

 agot_scenario_ats.1000.a:0 "[bittercringe.GetHerHim]'e #italic Kara Ejderha'nın ben olduğumu#! göstereceğim!"

 agot_scenario_ats.1000.a.tt:0 "Bittersteel ile nasıl başa çıkacağını seçeceksin"

 agot_scenario_ats.1001.t:0 "Taş, Çelik ve Su"

 agot_scenario_ats.1001.desc:0 "'Kızıl Dul' diyorlar bana; Coldmoat'in kocakarısı hakkında sırıtarak dedikodu yapıyorlar. Onların Kızıl Dulu, [Glossary( 'Redgrass Field', 'REDGRASS_FIELD_GLOSS' )]'da öldürülen ilk kocasını kaybettiğinde on yaşında bir kızdı. Kayıpların o zaman biteceğini sanmıştım, ama daha fazlası geldi. Oğlum, kızım, babam ve üç koca daha gitti.\n\nBabam bana Coldmoat'i bıraktı, ama ona uzanmak istediğimde beni bir ağa doladı. Ay dönmeden evlenmeliyim, yoksa babamın vasiyeti topraklarımı bir kuzenime geçirir. Ser [longinch.GetFullNameNicknamed]'in bana nasıl aç gözlerle baktığını görüyorum; [longinch.GetSheHe] topraklarımı kendine [longinch.GetHerselfHimself] ister, benim isteklerim umurunda değil.\n\nSanki babamın vasiyeti yetmezmiş gibi, yakınlardaki lordlar yanımda bir adam olmadan zayıf olduğumu düşünüyor. Bilmedikleri şey, artık erkeklere güvenmediğim. Taşa, çeliğe ve suya güveniyorum. Hendeğe güveniyorum ve kuraklık olsun olmasın benimki asla kurumayacak. Bana zarar vermek isteyenler, bu dulun gerçekten güçlü olduğunu ve bolca zehri olduğunu görecek."

 agot_scenario_ats.1001.a:0 "Hendeği dolu tut!"

 agot_scenario_ats.1001.a.tt:0 "Chequy Suyu'na bent yapacaksın"

 agot_scenario_ats.1002.t:0 "Chequy Aslanı"

 agot_scenario_ats.1002.desc:0 "Standfast kulesindeki yüksek balkondan dışarı bakarken, ne kadar küçük ve güçsüz kaldığım beni sarsıyor. Hâlâ dik duruyor olabilirim, ama hanem kırık ve harap bir şey; kızıl bir ejderha tarafından olduğumuz her şeyden soyulmuş; merhameti için minnettar olmam gerektiğini söylüyorlar.\n\n[Glossary( 'Redgrass Field', 'REDGRASS_FIELD_GLOSS' )]'da oğullarımı alan, aynı darbelerle karımı alan, gerçek kralın yanında durduğu için kızımı tazminat olarak alan o merhamet... Onu bir Sessiz Rahibe yaptı; son görüşümde babasının adını bile söylemedi.\n\nHizmet olarak elimde yalnızca iki çit şövalyesi var: Ser [bennis.GetFirstNameNicknamed] ve [dunk.GetTitledFirstNameNicknamed]; ikincisi iyi bir genç adam, ama benim kanımdan değil. Hayır, kanımın sonuncusu Kralın Şehri'ndeki bahar hastalığıyla gitti; Daeron'un merhameti benden son bir şey daha alırken, bir hayalet gibi sessiz kaldı.\n\nÖyleyse, ne için minnettar olmalıyım?"

 agot_scenario_ats.1002.a:0 "Bir kralın merhameti zehirli bir armağandır."

 agot_scenario_ats.1002.a.tt:0 "Yalnız başına dimdik duracaksın"

 agot_scenario_ats.1003.t:0 "Kale Duvarları Gibi Sağlam"

 agot_scenario_ats.1003.desc:0 "Ser Arlan'ın ölümünün üzerinden iki yıl geçti, Ashford'un ve diyarın sevgili prensini kaybedişinin üzerinden iki yıl. O gün bacağımı kurtarmak için üç iyi adam öldü. #italic Ben#! onların kaybını nasıl haklı çıkarabilirim?\n\n[maekar.GetTitledFirstName] en küçük oğlunu bana emanet ettiğinde, borçlu olduğum şeyi ödeme fırsatı gördüm. Ashford'dan sonra, Büyük Bahar Hastalığı geldiğinde Egg'in akrabalarını ziyaret etmek için Dorne'a yola çıktık. Egg'in büyükbabasının ölümüyle, Egg'in amcası [aerys.GetFirstName] Demir Taht'ı miras aldı ve [bloodraven.GetFirstNameNicknamed] onun Eli olarak duruyor. Bin gözü var, bir de fazlası — ve diyar, sert bir yaz güneşinin altında korkuyla yaşıyor.\n\nBir kuraklık diyarı vururken, Reach'te hizmet aramadan önce Egg'in kardeşi [aemon.GetFirstName]'i Sitadel'de ziyaret ettik. O hizmeti, elinde adından ve bazı eski ıvır zıvırdan başka pek az şey kalmış yaşlı bir şövalye olan [eustace.GetFullName] ile bulduk. Bahar bitti ve sert bir yaz geldi, ama borçlu olduğum üç iyi adam için efendime iyi hizmet edeceğim."

 agot_scenario_ats.1003.a:0 "Hadi gidelim, Egg."

 agot_scenario_ats.1003.a.tt:0 "Standfast'e geri döneceksin"

 agot_scenario_ats.2000.t:0 "Kılıçsız Kral"

 agot_scenario_ats.2000.desc:0 "Babam ve ağabeylerim [Glossary( 'Redgrass Field', 'REDGRASS_FIELD_GLOSS' )]'da öldüğünde, Blackfyre'ı alıp ailemizi annemin memleketi Tyrosh'a götüren amcam [bittercringe.GetName] oldu. [bittercringe.GetSheHe|U] sürgünde yaşarken paralı asker olarak iş buldu ve henüz Demir Taht iddiamı üstlenmeye, ya da hanemin adını taşıyan kılıcı bana vermeye karar vermedi. O olmadan ve [bittercringe.GetHerHis] desteği olmadan, iddiamı desteklemeleri için kimseyi ikna etmekte zorlanacağım.\n\n[bittercringe.GetHerHim]'e nasıl yaklaşacağımı dikkatle seçmeliyim. [bittercringe.GetNameNicknamedNoTooltip] çeliği ve gücü anlar, o yüzden bir düello en iyi yol olabilir; ne var ki kimse [bittercringe.GetHerHis] bıçak hünerinden şüphe etmeye cesaret edemez. [bittercringe.GetHerHim] ile, yeteneklerim arasında olan akıl yürütmeyi deneyebilirim; ama [bittercringe.GetSheHe]'nin dinlemesi olası değil. Belki de sadece batıya yelken açıp [bittercringe.GetHerHim]'i [bittercringe.GetHerHis] somurtkanlığıyla baş başa bırakmalıyım."

 agot_scenario_ats.2000.a:0 "[bittercringe.GetHerHim]'e çelikle meydan okuyacağım!"

 agot_scenario_ats.2000.a.tt:0 "Bittersteel ile dövüşeceksin"

 agot_scenario_ats.2000.b:0 "[bittercringe.GetHerHim]'e ballı sözler söyleyeceğim."

 agot_scenario_ats.2000.b.tt:0 "Bittersteel'i, Blackfyre'ı sana vermesi gerektiğine ikna etmeyi deneyeceksin."

 agot_scenario_ats.2000.c:0 "[bittercringe.GetNameNicknamedNoTooltip]'i geride bırakıp kendi yolumu bulacağım."

 agot_scenario_ats.2000.c.tt:0 "Blackfyre'dan ve Bittersteel'in desteğinden vazgeçeceksin"

 agot_scenario_ats.2001.t:0 "Kılıcı Taşıyan Kral"

 agot_scenario_ats.2001.desc.daemonwins:0 "[bittercringe.GetNameNicknamed]'in hırpalanmış formunun başında duruyorum, kılıcım başımın üzerinde yüksek. "Teslim ol!" diye talep ediyorum; [bittercringe.GetSheHe] benimle yüzleşmek için kalkamazken. [bittercringe.GetSheHe|U] gevşek bir yığın halinde yere dönüyor ve [bittercringe.GetHerHis] teslimiyetini işaret ediyor. [bittercringe.GetHerHim]'i ayağa kaldırmasına yardım ediyorum ve bir anlık öz muhasebenin ardından [bittercringe.GetSheHe], [blackfyre.GetName]'in durduğu yere doğru yürüyor.\n\nKılıcı kınından çekip tek dizinin üzerine çöküyor. "Babanın oğlu olduğuna inanmamıştım; şimdi görüyorum ki Daemon yeniden doğmuş. Blackfyre'ı ve verebileceğim tüm desteği al." Titreyen ellerle uzanıp Fatih'in Kılıcı'nı havaya kaldırıyorum.\n\n#italic Kral olacağım#!."

 agot_scenario_ats.2001.desc.daemonloses:0 "[bittercringe.GetNameNicknamed] üzerimde, saf bir tiksinme ifadesiyle dururken yere yığılıyorum; hırpalanmış ve yenilmiş. "Fatih'in Kılıcı'nı taşımayacaksın, oğlum — desteğimi de alamayacaksın. Rüyaların bir aptalın kuruntuları."\n\nArtık başka seçeneğim yok; [bittercringe.GetHerHis] yardımı olmadan devam etmeliyim."

 agot_scenario_ats.2001.a:0 "Şimdi fetih planımı yapmalıyım!"

 agot_scenario_ats.2001.a.tt:0 "Demir Taht'ı almak için nasıl ilerleyeceğini seçebilirsin"

 agot_scenario_ats.2001.b:0 "Kılıcı hak edemedim; şimdi tek başıma durmalıyım."

 agot_scenario_ats.2001.b.tt:0 "Tek başına devam etmelisin"

 agot_scenario_ats.2002.t:0 "Kılıcı Taşıyan Kral"

 agot_scenario_ats.2002.desc.intro:0 ""Amca," diye başlıyorum. "Yarı amca," diye sözümü kesiyor [bittercringe.GetNameNicknamed], tersçe; [bittercringe.GetHerHis] gözlerinde bir parıltı.\n\n"Evet, elbette," diye devam ediyorum; huzursuz hissime rağmen kolay bir gülümseme takınarak. "Rüyalarım her zaman kehanet olmuştur, ama hepsinin üstünde bir rüya var: Doğum hakkıma dönmek, Demir Taht'ı iddia etmek. Bunu yapmak için iki şeye ihtiyacım var. Bir kılıca ve bir Ele..."\n\n"

 agot_scenario_ats.2002.desc.daemonhassword:0 "Tutkulu yakarışım [bittercringe.GetNicknameNoTooltip]'i, rüyalarımın gerçekliğine ve doğum hakkımı iddia etme yeteneğime ikna etti. [bittercringe.GetSheHe|U] bana [blackfyre.GetName] kılıcını bahşetti ve verebileceği tüm desteği sundu.\n\nFatih'in kılıcıyla ailemiz için yeni bir gelecek #italic oyacağım#! ve Demir Taht üzerindeki haklı yerimizi alacağım!"

 agot_scenario_ats.2002.desc.nosword:0 "[bittercringe.GetNicknameNoTooltip] beni süzüyor; çelik gibi menekşe gözleri beni tarıyor. Sonra, bir sırıtışla isteğimi reddediyor; [bittercringe.GetSheHe] yaşadığı sürece [blackfyre.GetName]'ı asla taşıyamayacağıma, desteğini de alamayacağıma yemin ederek. Bu başarısızlığa rağmen, rüyalarımın gerçek olduğunu ve yükselişimin vaktinin yaklaştığını biliyorum.\n\nDemir Taht'a #italic oturacak#! ve benden şüphe eden herkesin ayaklarıma kapandığını izleyeceğim!"

 agot_scenario_ats.2002.a:0 "Şimdi fetih planımı yapmalıyım!"

 agot_scenario_ats.2002.a.tt:0 "Demir Taht'ı almak için nasıl ilerleyeceğini seçebilirsin"

 agot_scenario_ats.2002.b:0 "Kılıcı hak edemedim; şimdi tek başıma durmalıyım."

 agot_scenario_ats.2002.b.tt:0 "Tek başına devam etmelisin"

 agot_scenario_ats.2010.t:0 "Barajdaki Sorun"

 agot_scenario_ats.2010.desc:0 "Bir hizmetkâr, soluğu kesik ve hırıltılı, Coldmoat avlusuna koşuyor. "[rohanne.GetLadyLord], bentte sorun çıktı!" diye aceleyle çıkıyor. Gergin bir yüzle, bentte çalışmaya gönderilen köylülerden birinin, Ser [eustace.GetFirstName]'in hizmetindeki çit şövalyesi Ser [bennis.GetFirstNameNicknamed] tarafından yüzünden kesildiğini anlatıyor. Daha genç ve çok daha uzun olan başka bir çit şövalyesi de oradaymış.\n\nKöylü Dake'ye yaptığım şeyin onları caydırmaya yeteceğini sanmıştım, ama yanılmışım gibi görünüyor.\n\nŞimdi tazminat aramaktan başka seçeneğim yok; ne var ki bunu avantajıma çevirebilirim... pusuda beklerdim."

 agot_scenario_ats.2010.a:0 "Ser [eustace.GetFirstNameNoTooltip]'ten bir elçi bekleyeceğim."

 agot_scenario_ats.2010.a.tt:0 "Standfast'ten kimin geleceğini bekleyeceksin"

 agot_scenario_ats.2020.t:0 "Barajdaki Sorun"

 agot_scenario_ats.2020.desc:0 "[dunk.GetFullName], Standfast'teki kuleme dolanan basamakların tepesinde beliriyor; doğmadığım kadim günlere dair hayallerimi bölerek. [dunk.GetHerHis] yüzünde endişeli bir ifade var.\n\nSorunca öğreniyorum ki [dunk.GetSheHe] ve [bennis.GetFullName], Chequy Suyu'nu, #italic benim#! chequy suyumu, topraklarıma ulaştığında kurumuş ve zayıf bulmuş. [rohanne.GetFullNameNicknamed] ona bent yapmış ve karşılık olarak [bennis.GetTitledFirstNameNoTooltip], [rohanne.GetHerHis] köylülerinden birine vurmuş. Açık çatışmayı savuşturacaksam, Kızıl Dul'u karşılamak için bir elçi göndermeli ve bentin kaldırılması ile topraklarımın korunması için yeterince şey sunabileceğimi ummalıyım.\n\n[dunk.GetFullNameNoTooltip] benim yerime gitmeyi teklif etti; Coldmoat'in makamına, lordu olmadıkça asla girmemeye yemin ettiğim için. Mesajın benden gelmesinin daha iyi karşılanacağını bilsem de, [dunk.GetHerHim]'in teklifini kabul etmeli miyim?"

 agot_scenario_ats.2020.desc.nodunk:0 "Standfast'teki kuleme dolanan basamakların tepesinde bir hizmetkâr beliriyor; doğmadığım kadim günlere dair hayallerimi bölerek. Yüzünde endişeli bir ifade var.\n\nSorunca öğreniyorum ki şövalyem [bennis.GetFullName], Chequy Suyu'nu, #italic benim#! chequy suyumu, topraklarıma ulaştığında kurumuş ve zayıf bulmuş. [rohanne.GetFullNameNicknamed] ona bent yapmış ve karşılık olarak [bennis.GetTitledFirstNameNoTooltip], [rohanne.GetHerHis] köylülerinden birine vurmuş. Açık çatışmayı savuşturacaksam, Kızıl Dul ile hızla müzakerelere başlamalıyım.\n\nAma aklımda eski bir yemin oyalanıyor. Coldmoat'e, onarılmış lordu olmadıkça asla girmemeye yemin ettim. Yine de, artık onu bozmaktan başka çare yok."

 agot_scenario_ats.2020.a:0 "[dunk.GetTitledFirstNameNoTooltip] gitsin."

 agot_scenario_ats.2020.a.tt:0 "[dunk.GetTitledFirstNameNoTooltip] müzakere için Coldmoat'e gönderilecek"

 agot_scenario_ats.2020.b:0 "Ben gideceğim, ama bu beni acıtacak."

 agot_scenario_ats.2020.b.tt:0 "Yeminine rağmen Coldmoat'e gideceksin"

 agot_scenario_ats.2021.t:0 "Uyuyan Aslan"

 agot_scenario_ats.2021.desc:0 "Coldmoat'in kapılarına yaklaşırken gücü beni sarsıyor. Standfast, etrafında orta boy duvarlar olan küçük bir kuleden ibaret; Coldmoat ise gerçek bir kale.\n\nEvi Webber'in büyük örümceklerinin altından ve kapının üzerindeki taşlarda uyuyan bir chequy aslanının solmuş taş kabartmasının altından geçerken yüreğim yanıyor."

 agot_scenario_ats.2021.a:0 "Demek yeminim bozuldu..."

 agot_scenario_ats.2021.a.tt:0 "Coldmoat'e gireceksin"

 agot_scenario_ats.2030.t:0 "Barajdaki Sorun"

 agot_scenario_ats.2030.desc:0 "Egg ve ben Standfast'teki kuleye geri dönerken, yerel ormanı ve ekinleri besleyen suyun neredeyse kemik gibi kuruduğunu fark ediyoruz. [eustace.GetTitledFirstName]'e bağlı bir başka çit şövalyesi olan [bennis.GetTitledFirstNameNicknamed], cevap aramak için akıntıya karşı giderken bize katılıyor; zira son kuraklık zor olsa da, suyu bu kadar hızlı kurutmazdı.\n\nKısa bir sürüşten sonra suyu kurutan bendi ve yakındaki Coldmoat makamına hizmet eden bir grup köylüyü görüyoruz. Ben tepki veremeden [bennis.GetTitledFirstNameNoTooltip] üzerlerine atılıyor ve bir tartışma hızla fizikselleşiyor; bir köylü, bu dertlerine karşılık yüzünde bir yara iziyle kalıyor.\n\nStandfast'e dönüp [eustace.GetTitledFirstNameNoTooltip]'i çatışmadan haberdar ediyor ve [eustace.GetSheHe]'nin Coldmoat'in Kızıl Dulu ile buluşmak için kimi göndereceğini görüyoruz."

 agot_scenario_ats.2030.a:0 "Artık bu benim efendime kalmış."

 agot_scenario_ats.2030.a.tt:0 "Eustace'in kimi göndereceği haberini bekleyeceksin"

 agot_scenario_ats.3010.t:0 "Sikke Teklifi"

 agot_scenario_ats.3010.desc:0 "Ok talimi yaparken, [eustace.GetTitledFirstNamePossessive] yerine gönderilen bir elçinin geldiği söyleniyor. [dunk.GetSheHe|U] kendini [dunk.GetTitledFirstNameNicknamed], bir çit şövalyesi olarak tanıtıyor. [dunk.GetSheHe|U] gerçekten de [longinch.GetNicknameNoTooltip]'ten bile daha uzun; geniş, sağlam yapılı ve sade bir şekilde yakışıklı. Aramızda, beklediğimden daha kolay gelişen bir flörtleşme var; ne var ki [dunk.GetSheHe]'nin açıkça pek deneyimi yok.\n\nNezaket sözlerini ve doğal flörtleşmeyi bir kenara bırakan [dunk.GetTitledFirstNameNoTooltip], yaralanan köylümün karşılığı olarak bana bir çuval altın sunuyor ve Chequy Suyu'ndaki bendi kaldırmamı istiyor — Redgrass Tarlası'ndan sonra derenin kaybına rağmen, onun Evi Osgrey'e ait olduğunu iddia edecek kadar ileri giderek."

 agot_scenario_ats.3010.a:0 "Altını alırım ve barajı yıkarım."

 agot_scenario_ats.3010.a.tt:0 "Barajı yıkacaksın; herkes için daha az su olacak"

 agot_scenario_ats.3010.b:0 "Altını alırım ama hendeğim kuruyamaz."

 agot_scenario_ats.3010.b.tt:0 "Köylünün yaralanması için altını alacaksın ama barajı yerinde bırakacaksın"

 agot_scenario_ats.3010.c:0 "Ben senin altınından istemem, sen de benim suyumdan alamazsın."

 agot_scenario_ats.3010.c.tt:0 "Altın almayacaksın ve barajı yerinde bırakacaksın"

 agot_scenario_ats.3011.t:0 "Kan Teklifi"

 agot_scenario_ats.3011.desc:0 "Ok talimi yaparken, [eustace.GetTitledFirstNamePossessive] yerine gönderilen bir elçinin geldiği söyleniyor. [dunk.GetSheHe|U] kendini [dunk.GetTitledFirstNameNicknamed], bir çit şövalyesi olarak tanıtıyor. [dunk.GetSheHe|U] gerçekten de [longinch.GetNicknameNoTooltip]'ten bile daha uzun; geniş, sağlam yapılı ve sade bir şekilde yakışıklı. Aramızda, beklediğimden daha kolay gelişen bir flörtleşme var; ne var ki [dunk.GetSheHe]'nin açıkça pek deneyimi yok.\n\nNezaket sözlerini bir kenara bırakan [dunk.GetTitledFirstNameNoTooltip], yaralanan köylümün karşılığı olarak bana Ser [bennis.GetFirstNameNicknamed]'in canını sunuyor ve Chequy Suyu'ndaki bendi kaldırmamı istiyor. Redgrass Tarlası'ndan sonra derenin kaybına rağmen, onun Evi Osgrey'e ait olduğunu iddia edecek kadar ileri giderek."

 agot_scenario_ats.3011.a:0 "Adamı alırım ve barajı yıkarım."

 agot_scenario_ats.3011.a.tt:0 "Barajı yıkacaksın; herkes için daha az su olacak"

 agot_scenario_ats.3011.b:0 "Adamını alırım ama hendeğim kuruyamaz."

 agot_scenario_ats.3011.b.tt:0 "Köylünün yaralanması için tutsağı alacaksın ama barajı yerinde bırakacaksın"

 agot_scenario_ats.3011.c:0 "Çit şövalyenle uğraşmayacağım."

 agot_scenario_ats.3011.c.tt:0 "Tutsağı reddedip barajı yerinde bırakacaksın"

 agot_scenario_ats.3012.t:0 "Sikke Teklifi"

 agot_scenario_ats.3012.desc:0 "Ok talimi yaparken, Coldmoat kapılarının gıcırdayarak açıldığını duyuyorum. Avluda toplanan herkes, tek bir binici içeri girerken yerinde donuyor. [eustace.GetSheHe|U] atının ahıra çekilmesini istiyor, sonra ağır adımlarla bana doğru geliyor. Ser [eustace.GetFirstName]; yüzü öfkeden kızarmış.\n\n[eustace.GetSheHe|U] tam bana yaklaşmadan duruyor; aramıza girmeye çalışan [longinch.GetNickname]'i görmezden gelerek. Ser [eustace.GetFirstNameNoTooltip] müzakere için burada — hatırladığım kadar uzun, geniş ve sağlam yapılı; ne var ki [eustace.GetHerHis] gözlerinde, Redgrass Tarlası'ndan önce olmayan bir boşluk var.\n\nTahtımın beklediği salona kısa bir yolculuğun ardından Ser [eustace.GetFirstNameNoTooltip], yaralanan köylümün tazminatı olarak altın teklif ediyor ve bendi kaldırmamı istiyor; ikimize de daha az su bırakarak."

 agot_scenario_ats.3012.a:0 "Altını alırım ve barajı yıkarım."

 agot_scenario_ats.3012.a.tt:0 "Barajı yıkacaksın; herkes için daha az su olacak"

 agot_scenario_ats.3012.b:0 "Altını alırım ama hendeğim kuruyamaz."

 agot_scenario_ats.3012.b.tt:0 "Köylünün yaralanması için altını alacaksın ama barajı yerinde bırakacaksın"

 agot_scenario_ats.3012.c:0 "Ben senin altınından istemem, sen de benim suyumdan alamazsın."

 agot_scenario_ats.3012.c.tt:0 "Altın almayacaksın ve barajı yerinde bırakacaksın"

 agot_scenario_ats.3013.t:0 "Kan Teklifi"

 agot_scenario_ats.3013.desc:0 "Ok talimi yaparken, Coldmoat kapılarının gıcırdayarak açıldığını duyuyorum. Avluda toplanan herkes, tek bir binici içeri girerken yerinde donuyor. [eustace.GetSheHe|U] atının ahıra çekilmesini istiyor, sonra ağır adımlarla bana doğru geliyor. Ser [eustace.GetFirstName]; yüzü öfkeden kızarmış.\n\n[eustace.GetSheHe|U] tam bana yaklaşmadan duruyor; aramıza girmeye çalışan [longinch.GetNickname]'i görmezden gelerek. Ser [eustace.GetFirstNameNoTooltip] müzakere için burada — hatırladığım kadar uzun, geniş ve sağlam yapılı; ne var ki [eustace.GetHerHis] gözlerinde, Redgrass Tarlası'ndan önce olmayan bir boşluk var.\n\nTahtımın beklediği salona kısa bir yolculuğun ardından Ser [eustace.GetFirstNameNoTooltip], yaralanan köylümün tazminatı olarak zincire vurulmuş Ser [bennis.GetFirstNameNicknamed]'i sunuyor ve bendi kaldırmamı istiyor. Bu kuraklıkta bendi kaldırmak, ikimizin de başına daha fazla sıkıntı açmaktan başka bir işe yaramayabilir."

 agot_scenario_ats.3013.a:0 "Adamı alırım ve barajı yıkarım."

 agot_scenario_ats.3013.a.tt:0 "Barajı yıkacaksın; herkes için daha az su olacak"

 agot_scenario_ats.3013.b:0 "Adamını alırım ama hendeğim kuruyamaz."

 agot_scenario_ats.3013.b.tt:0 "Köylünün yaralanması için tutsağı alacaksın ama barajı yerinde bırakacaksın"

 agot_scenario_ats.3013.c:0 "Çit şövalyenle uğraşmayacağım, suyumdan da pay alamayacaksın."

 agot_scenario_ats.3013.c.tt:0 "Tutsağı reddedip barajı yerinde bırakacaksın"

 agot_scenario_ats.3020.t:0 "Bir Örümcekle Anlaşma"

 agot_scenario_ats.3020.desc:0 "[rohanne.GetFullNamePossessive] taht odasına davet edilmeden önce kısa bir süre bekliyorum. [rohanne.GetSheHe|U] bazı nezaket sözleriyle başlıyor; [rohanne.GetSheHe] bizim makamımız olan kalede, haneme ait bir tahta otururken bile. Öfkemi ve dehşetimi bastırarak, yeminimi bozmak için geldiğim şeyi yapmalıyım.\n\nColdmoat'in [rohanne.GetLadyLord]'üne ne sunayım: altın mı, kan mı? Hangisi [rohanne.GetHerHim]'i bu lanet olası bendi kaldırmaya teşvik eder?"

 agot_scenario_ats.3020.a:0 "Yaralanan köylün için altın yeterli olmalı. Şimdi bu bendi kaldıracak mısın?"

 agot_scenario_ats.3020.a.tt:0 "[rohanne.GetNameNoTooltip]'e ödeme olarak altın sunacaksın"

 agot_scenario_ats.3020.b:0 "Ser [bennis.GetFirstNameNicknamed]'i al ve bendini indir."

 agot_scenario_ats.3020.b.tt:0 "Ser [bennis.GetFirstNameNoTooltip]'i tutsak olarak sunacak ve bendin kaldırılmasını isteyeceksin"

 agot_scenario_ats.3021.t:0 "Benim Chequy Suyum"

 agot_scenario_ats.3021.desc:0 "[rohanne.GetTitledFirstNameNicknamed] boyun eğdi ve Chequy Suyu'nu tıkayan bendi kaldırdı. Kuraklık artık ikimizi de vuracak olsa da, en azından Standfast toprakları hayatta kalacak.\n\nArtık tek umudumuz yağmur yağması... ve yakında."

 agot_scenario_ats.3021.a:0 "Belki de bu Kızıl Dul sandığım kadar zalim değildir..."

 agot_scenario_ats.3021.a.tt:0 "Bent, Chequy Suyu'nu uzatarak Standfast'ten kaldırıldı"

 agot_scenario_ats.3030.t:0 "Aslan mı, Meşe mi?"

 agot_scenario_ats.3030.desc:0 "Ser [eustace.GetFirstName], Kızıl Dul ile müzakere için Coldmoat'e onun yerine gitme teklifimi kabul etti. Aklım, Coldmoat Leydisi hakkındaki söylentiler arasında yarışıyor: yaşlı ve kemikli parmakları, ölü kocalarının cinayetleri, soluk ay ışığı altında kalesinde yapılan kötü büyüler. Coldmoat'e ölümüme doğru sürüyor olabilirim, ama en azından efendimin hizmetinde sürüyorum.\n\nEgg ve ben Standfast'i geride bırakırken, görgü kurallarını ve soylu bir leydiye en iyi nasıl yaklaşılacağını tartışıyoruz. Evi Webber'in tehlikeli cadısıyla selamlaşmadan sağ çıkacaksak, ona mevkiine yaraşır şekilde konuşmam gerekecek. En azından Egg'in söylediği bu."

 agot_scenario_ats.3030.desc.eustacegoing:0 "Ser [eustace.GetFirstName], Kızıl Dul ile müzakere için Coldmoat'e onun yerine gitme teklifimi reddetti. [eustace.GetSheHe|U], ailesinin kadim evinden uzak durmak için ettiği yeminlere rağmen, daha iyi bir mesaj vereceği umuduyla kendisi [eustace.GetHerselfHimself] gidecek. Ser Eustace gittikten sonraki zamanı, Standfast'in en üst katında bir o yana bir bu yana yürüyerek, chequy aslanının bir örümceğin ölümcül ağına binmek için gururundan çok mu feda ettiğini düşünerek geçiriyorum."

 agot_scenario_ats.3030.a:0 "Umarım Kızıl Dul ile akıl yürütülebilir."

 agot_scenario_ats.3030.a.tt:0 "Müzakereler ilerleyecek"

 agot_scenario_ats.3033.t:0 "Dulun İninde"

 agot_scenario_ats.3033.desc:0 "Egg ve ben Coldmoat'in kapılarından geçiyor, uzun tarihine ihanet eden solmuş bir chequy aslanı kabartmasının altından ilerliyoruz. Ser [longinch.GetNameNicknamed]'in yön saptırmalarına ve şakalarına rağmen, sonunda [rohanne.GetFullNameNicknamed] ile tanıştırılıyorum. Duyduğum tüm hikâyelerde Kızıl Dul, tüm [rohanne.GetHerHis] kocalarını alçak büyülerle öldürmüş yaşlı bir kocakarydı.\n\nÖnümde duran, belki yirmi beş yaşlarında, kısa boylu ve güzel bir kadın. Bir ok talimi alanından uzaklaşan [rohanne.GetSheHe], beni süzer gibi; Evi Osgrey'in chequy aslanı armalı ödünç tuniğimin üzerinde ellerini gezdirdikten sonra, kanımı doğrudan yüzüme gönderen bir tonda konuşuyor.\n\nSer [eustace.GetFirstName] müzakereyi bana emanet etti; ama bu Kızıl Dul'u en çok memnun edecek teklif ne? Ve [rohanne.GetHerHim]'i bendi indirmeye nasıl ikna ederim?"

 agot_scenario_ats.3033.a:0 "Bu altını al, [rohanne.GetLadyLord]; ve Chequy Suyu aksın."

 agot_scenario_ats.3033.a.tt:0 "Yaralanan köylü için altın sunuyor ve bendin kaldırılmasını istiyorsun"

 agot_scenario_ats.3033.b:0 "Ser [bennis.GetFirstNameNicknamedNoTooltip]'i al ve bendi indir."

 agot_scenario_ats.3033.b.tt:0 "[bennis.GetFirstNameNoTooltip]'i tutsak olarak sunuyor ve bendin kaldırılmasını istiyorsun"

 agot_scenario_ats.3031.t:0 "Bir Dulun Isırığı"

 agot_scenario_ats.3031.desc:0 "Leydi [rohanne.GetFirstName] teklifime pek hoş bakmadı ve bent kaldırılmayacak. O su olmadan, Ser [eustace.GetFirstName]'in elindeki topraklar kuruyacak ve [eustace.GetHerHis] halkı ölecek.\n\nSer [eustace.GetFirstNameNoTooltip]'in bana anlattığı bir hikâyeyi hatırlayarak — oğlu [addam.GetFirstName] ve Leydi [rohanne.GetFirstNameNoTooltip] ile uzun dostluğu — [rohanne.GetHerHim]'e onun anısını ve paylaştıkları bağı anarak yalvarmayı deniyorum.\n\n[rohanne.GetHerHis|U] yüzü öfkeyle çarpılıyor ve ben tepki veremeden [rohanne.GetHerHis] eli bir ok gibi fırlıyor, yanağıma çarpıp yüzüme acı sancıları gönderiyor. [rohanne.GetSheHe|U] bana, Ser [eustace.GetFirstNameNoTooltip]'in kendi oğullarını savaşa nasıl götürdüğünü, Kara Ejderha'nın Evi Osgrey'den alınanları geri getireceğini sanarak, ve bunun onları nasıl öldürdüğünü anlatıyor. Efendimin bir hain olduğunu öğrenirken, şaşkın sessizlik içinde durmaktan başka yapabildiğim yok. [rohanne.GetSheHe|U] beni sersemliğimden kurtarıyor: "Buradan git, Ser; ve bil ki topraklarımı ve hendekmi #italic ateş ve kılıçla#! savunacağım!""

 agot_scenario_ats.3031.desc.tookbennis:0 "Leydi [rohanne.GetFirstName] teklifime pek hoş bakmadı; Bennis'i aldı ve bendini korudu. O su olmadan, Ser [eustace.GetFirstName]'in elindeki topraklar kuruyacak ve [eustace.GetHerHis] halkı ölecek.\n\nSer [eustace.GetFirstNameNoTooltip]'in bana anlattığı bir hikâyeyi hatırlayarak — oğlu [addam.GetFirstName] ve Leydi [rohanne.GetFirstNameNoTooltip] ile uzun dostluğu — [rohanne.GetHerHim]'e onun anısını ve paylaştıkları bağı anarak yalvarmayı deniyorum.\n\n[rohanne.GetHerHis|U] yüzü öfkeyle çarpılıyor ve ben tepki veremeden [rohanne.GetHerHis] eli bir ok gibi fırlıyor, yanağıma çarpıp yüzüme acı sancıları gönderiyor. [rohanne.GetSheHe|U] bana, Ser [eustace.GetFirstNameNoTooltip]'in kendi oğullarını savaşa nasıl götürdüğünü, Kara Ejderha'nın Evi Osgrey'den alınanları geri getireceğini sanarak, ve bunun onları nasıl öldürdüğünü anlatıyor. Efendimin bir hain olduğunu öğrenirken, şaşkın sessizlik içinde durmaktan başka yapabildiğim yok. [rohanne.GetSheHe|U] beni sersemliğimden kurtarıyor: "Buradan git, Ser; ve bil ki topraklarımı ve hendekmi #italic ateş ve kılıçla#! savunacağım!""

 agot_scenario_ats.3031.a:0 "Dulun öfkesinden ne çıkacağından korkuyorum."

 agot_scenario_ats.3031.a.tt:0 "Sırada ne olacağını görmek için bekleyeceksin"

 agot_scenario_ats.4010.t:0 "Yanan Gökyüzü"

 agot_scenario_ats.4010.desc:0 "Yükselen sesler ve parlak ışık beni uykudan uyandırıyor. Dışarı çıkıp bir grup kale muhafızının yanından geçerek doğuda yükselen güneş gibi görünen şeye bakıyorum. Kabaran duman ve kükreyen alevler bunu bir anda çürütüyor.\n\nWat'ın Ormanı yanıyor ve rüzgâr yön değiştirirse tarlalarımız çok geride kalmaz."

 agot_scenario_ats.4010.a:0 "Bunun suçu bana yüklenecek."

 agot_scenario_ats.4010.a.tt:0 "Standfast seni suçlayacağından, nehirde buluşman bekleniyor"

 agot_scenario_ats.4020.t:0 "Suçlu Aslan"

 agot_scenario_ats.4020.desc:0 "[dunk.GetTitledFirstNamePossessive] atının Standfast'e yaklaştığını duyuyorum; ateşin yanında beklerken. [dunk.GetHerHis] nefeslerindeki ve [dunk.GetHerHis] ayaklarının yere vuruşlarındaki hayal kırıklığından, işlerin iyi gitmediğini anlıyorum. [dunk.GetSheHe|U] merdivenlerin tepesine ulaşıyor ve anında beni vatan hainliğiyle suçluyor.\n\n"Kral için savaştığını söylemiştin!" diye haykırıyor [dunk.GetSheHe]. "Öyle yaptım; Kılıcı Taşıyan Kral için savaştım." Cevabım bana yürek kırıklığının sızısını bırakıyor. #italic Keşke Fireball yaşasaydı, keşke Daemon Gwayne Corbray'ı kovalasaydı, keşke Ağlayan Sırt'ı almış olsaydı, keşke oğullarım...#!\n\nArtık çok geç ve [dunk.GetTitledFirstNameNoTooltip]'in odadan fırtına gibi çıkıp merdivenlerden inmesini engellemek için yapabileceğim pek az şey var; beni bir kez daha kalıntılarımla baş başa bırakarak."

 agot_scenario_ats.4020.a:0 "Keşke..."

 agot_scenario_ats.4020.a.tt:0 "Gece dinleneceksin"

 agot_scenario_ats.4021.t:0 "Yanan Gökyüzü"

 agot_scenario_ats.4021.desc:0 "Kızıl Dul'un daha önceki teklifimi reddetmesinin ardından, melankolik bir sessizlikle eve sürdüm; önceki günün aşağılanmalarını unutma umuduyla doğrudan odama çıktım. Gecenin geç saatlerinde, şafağın sert turuncu-kızıl ışığı beni uykumdan kaldırıyor. Gözlerimdeki yorgunluğu silip, dün gece içtiğim kadim kadehi bir kenara itiyorum. Doğu penceresinden bakıyorum; gecenin koyu mavisiyle karşılaşıyorum. Şaşkınlıkla yükselen güneşe dönüyorum ve hiç de güneş olmadığını anlıyorum.\n\nWat'ın Ormanı'nı kıvrılan duman ve azgın alevler sarmış; Standfast'in dibindeki hizmetkârlar, yangın yayılırsa diye kuyulardan su taşımak için koşuşuyor. Bir anda anlıyorum; bunu Kızıl Dul yaptı.\n\nArtık savaşmaktan ya da şartlar için meydanda buluşmaktan başka seçeneğim yok. Ortası yok."

 agot_scenario_ats.4021.a:0 "Yakında süreceğiz... öyle ya da böyle."

 agot_scenario_ats.4021.a.tt:0 "Nasıl ilerleyeceğine yakında karar vereceksin"

 agot_scenario_ats.4030.t:0 "Aslanın Yalanları"

 agot_scenario_ats.4030.desc:0 "Coldmoat'ten dönüş yolculuğu sessiz geçiyor. Hizmet ettiğim efendinin Kara Ejderha için savaştığını öğrenmenin öfkesiyle geçiriyorum. Ser [eustace.GetFirstName] hep Kral'a hizmet ettiğini söylerdi. Hangisine hizmet ettiğini hiç söylemedi. Egg de aynı şekilde hissediyor; [egg.GetHerHis] kendi babası, Redgrass Tarlası'nda Kara Ejderha'nın ordusunu kırmaya yardım etmişti, ama sonra onun şövalyelerinden birine hizmet etti. #italic Aptal Dunk, kale duvarı gibi sağlam...#!\n\nVarışımızda Egg'e atlarla ilgilenmesini emrediyor ve öfkeyle kulemin tepesine çıkıp Ser [eustace.GetFirstNameNoTooltip] ile hışımla yüzleşiyorum. "Sen bir hainsin," diyorum güvenle, ama işlerin nadiren bu kadar basit olduğu bana hatırlatılıyor.\n\n"Kara Ejderha kazansaydı, bize sadık, Daeron'un destekçilerine de hain denirdi," diye belirtiyor [eustace.GetFirstNameNoTooltip]. Şimdi seçim yapmalıyım: bir hainin yanında kalıp bu işi sonuna kadar görmek, ya da çitlere dönmek."

 agot_scenario_ats.4030.a:0 "Ayrılmalıyız; bir haine hizmet edemem."

 agot_scenario_ats.4030.a.tt:0 "Elinin erdiği ilk fırsatta ayrılmayı planlayacaksın"

 agot_scenario_ats.4030.b:0 "Kara Ejderha ya da Kızıl, hizmet edeceğime yemin ettim."

 agot_scenario_ats.4030.b.tt:0 "Standfast'te kalmaya karar vereceksin"

 agot_scenario_ats.4031.t:0 "Yanan Gökyüzü"

 agot_scenario_ats.4031.desc:0 "Coldmoat'in altındaki mahzende dinlenirken, aklımda hoş bir rüya, ani bir gürültü beni uykuya dalıp gitmekten sarsıyor. Egg zaten bekliyor ve ikimiz de, kısa bir hizmetkâr ve yerel köylü levyeleri kuyruğunu izleyerek merdivenlerden avluya fırtına gibi çıkıyoruz.\n\nWat'ın Ormanı yanarken gökyüzünü azgın bir ateş kaplıyor; kuraklık ağaçları ve yaban otları kurutup yangını normal bir yangının ötesine yaymış. Herkes kuyuya koşuyor, kovalar toplayıp alevlerle savaşmaya hazırlanıyor.\n\nSabaha orman kavrulmuş ve harap, birçok ekin de kayıp."

 agot_scenario_ats.4031.a:0 "Ateş ve kılıç... kalmak zorundayım."

 agot_scenario_ats.4031.a.tt:0 "Bunu sonuna kadar göreceksin"

 agot_scenario_ats.4031.b:0 "Bu hiçbir şeyi değiştirmiyor, kalmak zorundayım."

 agot_scenario_ats.4031.b.tt:0 "Bunu sonuna kadar göreceksin"

 agot_scenario_ats.4031.c:0 "Bu haine hizmet etmeyeceğim."

 agot_scenario_ats.4031.c.tt:0 "Çatışmayı geride bırakacaksın"

 agot_scenario_ats.4031.d:0 "Bu, ister orduların ister şövalyelerin karşılaşması, bir yüzleşme anlamına gelecek."

 agot_scenario_ats.4031.d.tt:0 "Savaşmaya hazır olmalısın"

 agot_scenario_ats.5010.t:0 "Küller Arasında"

 agot_scenario_ats.5010.desc.dunkstayed:0 "İzcilerim, Ser [eustace.GetFirstName]'in Wat'ın Ormanı'ndaki yangının ardından birliklerini ve çit şövalyelerini topladığını bildiriyor. Önümde iki yol var: Standfast'e yürüyüp savaş açmak; ya da aramızdaki derede buluşup bir görüşme kabul etmek.\n\nŞimdi savaş açmanın onuru az, ama [eustace.GetSheHe] tepki vermeye fırsat bulamadan Standfast'i ele geçirebilirim.\n\nBir görüşme bana muharebe yargılaması şansı ve potansiyel olarak Longinch'in bertaraf edilmesini sunar; özellikle [dunk.GetTitledFirstNameNicknamed] düelloya razıysa. Her iki halde de, şövalyelerim kararımı bekliyor."

 agot_scenario_ats.5010.desc.dunkleft:0 "İzcilerim, Ser [eustace.GetFirstName]'in [wats_wood]'daki yangının ardından birliklerini ve çit şövalyelerini topladığını bildiriyor. Önümde iki yol var: Standfast'e yürüyüp savaş açmak, ya da aramızdaki derede buluşup bir görüşme kabul etmek.\n\nŞimdi savaş açmanın onuru az, ama [eustace.GetSheHe] tepki vermeye fırsat bulamadan Standfast'i ele geçirebilirim.\n\nBir görüşme bana muharebe yargılaması şansı ve potansiyel olarak Longinch'in bertaraf edilmesini sunar. Her iki halde de, şövalyelerim kararımı bekliyor."

 agot_scenario_ats.5010.a:0 "Dereye gidiyoruz!"

 agot_scenario_ats.5010.a.tt:0 "Ser [eustace.GetFirstNameNoTooltip] ve [dunk.GetTitledFirstNameNoTooltip] ile buluşacaksın"

 agot_scenario_ats.5010.b:0 "Savaşa sürüyoruz! Ateş ve kılıçla!"

 agot_scenario_ats.5010.c:0 "Dereye gidiyoruz!"

 agot_scenario_ats.5010.c.tt:0 "Ser [eustace.GetFirstNameNoTooltip] ile buluşacaksın"

 agot_scenario_ats.5011.t:0 "Müzakereler"

 agot_scenario_ats.5011.desc:0 "[longinch.GetFirstNameNicknamed], şövalyelerim ve ben, derenin karşısında [dunk.GetTitledFirstNameNicknamed] ile Ser [eustace.GetFirstName]'in beklediğini görmeye varıyoruz. Ser [eustace.GetFirstNameNoTooltip] vakit kaybetmeden Wat'ın Ormanı yangınını ayaklarıma seriyor. "Tarlalarıma bak, ne kadar kuru; o yangını ben yakmış olsam aptal olurdum," diye cevap veriyorum; ama [eustace.GetSheHe] hiçbirini dinlemiyor. [eustace.GetHerHim]'e göre ben, Coldmoat'in kötü büyüler döken şeytani Kızıl Dulu'yum.\n\n[dunk.GetTitledFirstNameNoTooltip] beni yakına çağırıyor ve derenin ortasında, aramızdaki sözleri yalnızca ikimizin duyacağı yerde buluşuyoruz. [dunk.GetSheHe|U] üzerinde mühür taşıyan küçük bir yüzük çıkarıyor: her biri üç başlı, ateş püskürten dört çeyrekli ejderha. Summerhall'dan [maekar.GetTitledFirstName]'in mührü. [dunk.GetFirstNamePossessiveNoTooltip] yaveri prensin oğlu ve şimdi onları ezmek onun gazabını çekebilir — ve ben bir ejderhanın dostu olmayı tercih ederim. Yine de bu kadar kolay pes edemem, yoksa düşmanlarım beni zayıf sanar; üstelik iğrenç bir suçla suçlandım.\n\nDerenin sesi işitme duyumu kaplarken [longinch.GetFirstName]'e dönüp bunun şansım olabileceğini fark ediyorum. Yangından masum olduğumu kanıtlayacak bir muharebe yargılaması."

 agot_scenario_ats.5011.a:0 "Muharebe yargılaması talep ediyorum! [longinch.GetFirstNameNoTooltip] şampiyonum olacak!"

 agot_scenario_ats.5011.a.tt:0 "Eustace'ten muharebe yargılaması talep edeceksin"

 agot_scenario_ats.5011.b:0 "Yargılama olmayacak, savaşa!"

 agot_scenario_ats.5011.c:0 "Suçumu kabul ediyorum ve barajı yıkacağım."

 agot_scenario_ats.5011.c.tt:0 "Boyun eğeceksin ve zayıf görünebilirsin"

 agot_scenario_ats.5012.t:0 "Müzakereler"

 agot_scenario_ats.5012.desc:0 "Şövalyelerim ve ben dereye vardığımızda, Ser [eustace.GetFirstName]'in derenin karşısında, yanında birkaç zar zor silahlanmış köylüyle beklediğini görüyoruz. "Yangını senin yaktığını biliyorum, cadı! Karanlık bir büyüyle!" diye haykırıyor [eustace.GetSheHe], suyun sesinin üzerinden.\n\n"Tarlalarıma bak, ne kadar kuru; o yangını ben yakmış olsam aptal olurdum," diye cevap veriyorum; ama [eustace.GetFirstNameNoTooltip] hiçbirini dinlemiyor. [eustace.GetHerHim]'e göre ben, Coldmoat'in kötü büyüler döken şeytani Kızıl Dulu'yum.\n\nSer [eustace.GetFirstNameNoTooltip] kılıcını çekiyor, karşıya geçmemizi bekliyor. Ordumla yürüyebilirim ve Standfast'in tutunma şansı çok az olur; ama çocukluk arkadaşımı... tatlı [addam.GetFirstName]'i şerefsizleştirmiş olurum.\n\n[longinch.GetFirstNameNicknamed]'e göz atıyorum ve bir plan oluşmaya başlıyor. Ayaklarıma serilen suçlar için muharebe yargılaması talep ederek bir savaştan kaçınabilirim. Kafamda bir düşünce fırtınası dönüyor...\n\nBir savaş daha hızlı, ama daha kanlı olur. Şampiyonum düelloyu kazanabilir ve ben eski bir kuleden başka bir şey kazanamam. Öte yandan, belki de pes edip bu kuraklık zamanında suyu yeniden paylaşmalıyım. #italic Seçim ne olursa olsun, bu #bold şimdi#! karara bağlanmalı.#!"

 agot_scenario_ats.5012.a:0 "Muharebe yargılaması talep ediyorum! Ser [longinch.GetFirstNameNoTooltip] şampiyonum olacak!"

 agot_scenario_ats.5012.a.tt:0 "Eustace'ten muharebe yargılaması talep edeceksin"

 agot_scenario_ats.5012.b:0 "Yargılama olmayacak, savaşa!"

 agot_scenario_ats.5012.c:0 "Suçumu kabul ediyorum ve barajı yıkacağım."

 agot_scenario_ats.5012.c.tt:0 "Boyun eğeceksin ve zayıf görünebilirsin"

 agot_scenario_ats.5013.t:0 "Aslanın Gazabı"

 agot_scenario_ats.5013.desc:0 "Sabır ve akıl gösterme çabalarıma rağmen, Ser [eustace.GetFirstName] bana karşı silaha sarılmakta ısrar etti. [eustace.GetHerHim] için talihsiz olan şu ki, artık yalnızca su için gelmeyeceğim — Evi Osgrey'den geriye kalan az şeyi de yere sereceğim!\n\nEvi Webber, Chequy lekesini son kez Reach'ten silip atacak."

 agot_scenario_ats.5013.desc.eustacerefused:0 "Ser [eustace.GetFirstName], muharebe yargılaması talebini reddetti ve bana karşı silaha sarılmakta ısrar etti. [eustace.GetHerHim] için talihsiz olan şu ki, artık yalnızca su için gelmeyeceğim — Evi Osgrey'den geriye kalan az şeyi de yere sereceğim.\n\nEvi Webber, Chequy lekesini son kez Reach'ten silip atacak."

 agot_scenario_ats.5013.a:0 "Ateş ve kılıçla! Savaşa!"

 agot_scenario_ats.5013.a.tt:0 "Eustace ile bir savaş yapacaksın"

 agot_scenario_ats.5014.t:0 "Bir Kan Yargılaması"

 agot_scenario_ats.5014.desc:0 "Ser [eustace.GetFirstName] bir talep gönderdi: muharebe yargılaması. Şampiyonum kaybederse, Chequy Suyu'ndaki bendi kaldıracağım ve Wat'ın Ormanı'ndaki yangının suçlusu olarak anılacağım.\n\nArtık kabul etmekten başka çare yok."

 agot_scenario_ats.5014.a:0 "[longinch.GetFirstNameNicknamed] şampiyonum olacak."

 agot_scenario_ats.5014.a.tt:0 "Longinch bir muharebe yargılamasına katılacak"

 agot_scenario_ats.5020.t:0 "Küller Arasında"

 agot_scenario_ats.5020.desc.dunkstayed:0 "Wat'ın Ormanı'nın büyük bir kısmı küle döndü ve yağmur olmadan yeniden canlanması uzun sürecek. Bunu, uzun kuraklıktan yararlanmak için cehennemî bir büyü kullanan Coldmoat'in Kızıl Dulu'nun yaptığından neredeyse eminim. [rohanne.GetSheHe|U] artık topraklarıma yürüyecek; bana yalnızca iki seçenek bırakarak:\n\nSavaşa yürüyebilirim — müttefikim ve emrimdeki az sayıda birlik olmadan — ve chequy aslanının hâlâ biraz ısırığı olduğunu umabilirim. Ya da buluşup görüşme deneyebilirim. [dunk.GetTitledFirstNameNicknamed] ikincisini seçmem gerektiğine, hangi anlaşmanın yapılabileceğine bakmam gerektiğine inanıyor. [dunk.GetSheHe|U] genç ve dünyanın gerçek zalimliği hakkında pek bilgisi yok; ama yine de [dunk.GetSheHe]'nin bir noktası olabilir.\n\nYine de şimdi seçmeliyim, zira daha sonraki bir savaşın zafer bulma olasılığı daha da düşük olur."

 agot_scenario_ats.5020.desc.dunkleft:0 "Wat'ın Ormanı'nın büyük bir kısmı küle döndü ve yağmur olmadan yeniden canlanması uzun sürecek. Bunu, uzun kuraklıktan yararlanmak için cehennemî bir büyü kullanan Coldmoat'in Kızıl Dulu'nun yaptığından neredeyse eminim. [rohanne.GetSheHe|U] artık topraklarıma yürüyecek; bana yalnızca iki seçenek bırakarak:\n\nSavaşa yürüyebilirim — müttefikim ve emrimdeki az sayıda birlik olmadan — ve chequy aslanının hâlâ biraz ısırığı olduğunu umabilirim. Ya da buluşup görüşme deneyebilirim. [addam.GetFirstName] bana görüşmeyi tavsiye ederdi; yalnızca [rohanne.GetHerHim] ile paylaştığı dostluk için. Onun anısını onurlandırmak aynı zamanda akıllıca bir seçim olabilir; zira topraklarımı ve hanemden geriye kalanı kurtaracak bir anlaşma yapılabilir.\n\nYine de şimdi seçmeliyim, zira daha sonraki bir savaşın zafer bulma olasılığı daha da düşük olur."

 agot_scenario_ats.5020.a:0 "Bu cadıyla derede buluşup bir anlaşma deneyeceğiz."

 agot_scenario_ats.5020.a.tt:0 "[rohanne.GetNameNoTooltip] ile Chequy Suyu'nda buluşacaksın"

 agot_scenario_ats.5020.b:0 "Hepsine, chequy aslanının hâlâ pençeleri olduğunu göstereceğim!"

 agot_scenario_ats.5021.t:0 "Müzakereler"

 agot_scenario_ats.5021.desc:0 "[dunk.GetTitledFirstName] ve ben Chequy Suyu kıyısına vardık. Kısa süre sonra [rohanne.GetTitledFirstName] öteki kıyıda beliriyor; örümcek gibi ipekler ve pullu zırh içinde, koca bir kara aygırın üzerinde. [rohanne.GetHerHis|U] şövalyeleri [rohanne.GetHerHim]'i çevrelemiş, savaşa hazır gibi görünüyor. Kızıl Dul'u görmek bile yaşlı kanımı kaynatıyor ve düşünemeden suçlamalarımı haykırmaya başlıyorum.\n\n"Kendi topraklarımın bu kadar yakınında neden ateş yakarım, Ser?" Onun cevabını kendiminkiyle savuşturmadan önce [dunk.GetTitledFirstNameNicknamed] ileri yürüyor ve Kızıl Dul ile derenin ortasında buluşmayı istiyor.\n\nİzin veriyorum; kafasının benimkinden daha soğuk olmasını umarak. İkisi derenin ortasında buluşurken, [dunk.GetTitledFirstNameNoTooltip] bıçağını çekerken nefesim kesiliyor... sonra kendi yüzünü bıçakla kesiyor. İkisi konuşmalarını bitiriyor ve çit şövalyem bana dönüyor.\n\n[rohanne.GetTitledFirstNameNoTooltip], suçlamalarım için muharebe yargılaması talep etti, diyor [dunk.GetSheHe]; şampiyonumu seçmemi buyurarak. Bu, tüm çatışmayı savaş olmadan çözme şansı ve bu kendi elimle olabilir; ama belki [dunk.GetTitledFirstNameNoTooltip] daha iyi bir seçim olur."

 agot_scenario_ats.5021.a:0 "[dunk.GetTitledFirstNameNoTooltip] şampiyonum olacak."

 agot_scenario_ats.5021.a.tt:0 "[dunk.GetFirstNameNoTooltip]'in muharebe yargılamasında dövüşmesini sağlayacaksın"

 agot_scenario_ats.5021.b:0 "Kendim için dövüşeceğim!"

 agot_scenario_ats.5021.b.tt:0 "Muharebe yargılamasında dövüşeceksin"

 agot_scenario_ats.5021.c:0 "Yargılamayı boş ver, saldır!"

 agot_scenario_ats.5021.c.tt:0 "[rohanne.GetFullNameNoTooltip] ile savaşa gideceksin"

 agot_scenario_ats.5022.t:0 "Müzakereler"

 agot_scenario_ats.5022.desc:0 "Chequy Suyu kıyısına vardım; yanımda birkaç köylü levyemden başkası yok. Kısa süre sonra [rohanne.GetTitledFirstName] öteki kıyıda beliriyor; örümcek gibi ipekler ve pullu zırh içinde, koca bir kara aygırın üzerinde. [rohanne.GetHerHis|U] şövalyeleri [rohanne.GetHerHim]'i çevrelemiş, savaşa hazır gibi görünüyor. Kızıl Dul'u görmek bile yaşlı kanımı kaynatıyor ve düşünemeden suçlamalarımı haykırmaya başlıyorum.\n\n[rohanne.GetTitledFirstNameNoTooltip] onları reddediyor; ateşi kendi tarlalarının bu kadar yakınında başlatmanın pek mantıklı olmayacağını iddia ederek; ama buna inanmakta zorlanıyorum.\n\nBu buluşmanın gerçek noktasına varana dek kısa bir süre tartışıyoruz: [rohanne.GetTitledFirstNameNoTooltip], suçlamalarım ve aramızdaki kan davası için muharebe yargılaması talep ediyor; şampiyonumu seçmemi buyurarak. Bu, bu davada kendi elimle zafer bulma şansı. Ya da şimdi, beklemedikleri anda az sayıdaki birliğimle vurabilirim."

 agot_scenario_ats.5022.a:0 "Şampiyonunla yüzleşeceğim!"

 agot_scenario_ats.5022.a.tt:0 "Bir muharebe yargılamasında dövüşeceksin"

 agot_scenario_ats.5022.b:0 "Yargılamayı boş ver, saldır!"

 agot_scenario_ats.5022.b.tt:0 "[rohanne.GetFullNameNoTooltip] ile savaşa gideceksin"

 agot_scenario_ats.5024.t:0 "Ateş ve Kılıç"

 agot_scenario_ats.5024.desc:0 "Kızıl Dul bana savaş ilan etti! Efendimizin yardımıma geleceğinden şüpheliyim, o yüzden kendimizi savunmak bize ve bana kalıyor.\n\nHepsine, chequy aslanının hâlâ pençeleri olduğunu göstereceğim!"

 agot_scenario_ats.5024.a:0 "Savaşa!"

 agot_scenario_ats.5024.a.tt:0 "Bir savaş başlayacak"

 agot_scenario_ats.5025.t:0 "Suda Düello"

 agot_scenario_ats.5025.desc:0 "[rohanne.GetTitledFirstName], hem Wat'ın Ormanı yangını suçlamalarını hem de aramızdaki kan davasını çözmek için muharebe yargılaması talep etti. [rohanne.GetHerHim]'e güvenmek zor olsa da, çok az kişi bir muharebe yargılamasında tanrıların iradesine karşı gelmeye gönüllü olur.\n\nYani karar bana kalmış: Ya bir şampiyon seçerim, ya da savaş için kılıçlarımızı çekeriz."

 agot_scenario_ats.5025.desc.dunkrefused:0 "[dunk.GetHerHis] bana hizmet yeminine ve sözde onuruna rağmen, [dunk.GetSheHe] benim adıma dövüşmeyi reddetti. Artık çok az seçeneğim var; ya [rohanne.GetTitledFirstNamePossessive] şampiyonuyla kendim yüzleşmeliyim, ya da tatminimi kazanmak için savaşa yürümeliyim.\n\nÖyleyse, Kızıl Dul'a savaş mı açayım? Yoksa yaşlı kılıcımı son kez mi çekeyim?"

 agot_scenario_ats.5025.a:0 "Şampiyonunla yüzleşeceğim!"

 agot_scenario_ats.5025.a.tt:0 "Muharebe yargılamasında dövüşeceksin"

 agot_scenario_ats.5025.b:0 "[dunk.GetTitledFirstNameNoTooltip]'in benim adıma dövüşmesini sağlayacağım."

 agot_scenario_ats.5025.b.tt:0 "Dunk muharebe yargılamasında dövüşecek"

 agot_scenario_ats.5025.c:0 "Yargılamayı boş ver, saldır!"

 agot_scenario_ats.5025.c.tt:0 "[rohanne.GetFullNameNoTooltip] ile savaşa gideceksin"

 agot_scenario_ats.5026.t:0 "Çözülen Bir Kan Davası"

 agot_scenario_ats.5026.desc:0 "Coldmoat'ten bir haberci geliyor: [rohanne.GetTitledFirstName] kan davamızın sona ermesi çağrısında bulundu ve Chequy Suyu'ndaki bendi kaldırma adımını attı. Bu, toprağımı kuraklıktan kurtaracak; [rohanne.GetHerHis] kendininkini riske atarak.\n\nBelki de Kızıl Dul hakkında yanılıyordum, belki de geçmişi geride bırakmanın zamanı. Su yine de kıt olacak, [rohanne.GetTitledFirstNameNoTooltip] için bendi biriktirmek olmadan daha da kıt; ama bu şanslarımızı büyük ölçüde artırdı."

 agot_scenario_ats.5026.a:0 "Chequy Suyum geri geldi."

 agot_scenario_ats.5026.a.tt:0 "Bent kaldırıldı, ama su hâlâ kıt"

 agot_scenario_ats.5030.t:0 "Müzakereler"

 agot_scenario_ats.5030.desc:0 "Zayıf maiyetimiz dereye varıyor; ama orada bekleyen kimseyi bulamıyoruz. Egg'e bakıyorum, ama oğlan sabah boyunca başını öne eğik tuttu. #italic Onun yerinde olsam ben de öyle yapardım.#!\n\nKısa süre sonra [rohanne.GetTitledFirstName], şövalyeleriyle birlikte geliyor. Ser [eustace.GetFirstNameNoTooltip] suçlamalarını haykırmak için fazla zaman harcamıyor; ama Kızıl Dul, yıkıcı yangına karıştığını reddediyor. İşler daha da tırmanmadan atımı mahmuzluyor ve [rohanne.GetFirstNameNoTooltip]'i derede tek başına buluşmaya çağırıyorum. Şövalyeler ve levyeler, Chequy Suyu'na doğru su sıçratarak ilerlerken şaşkın bakışlar değiştiriyor.\n\n[rohanne.GetSheHe] derenin ortasında bana ulaştığında, ona Egg'in babasının mührü taşıyan yüzüğü gösteriyorum. Sonuçta çok az kişi bir Targaryen prensinin oğluyla uğraşır. [rohanne.GetSheHe] yüzüğün ağırlığını anlasa da, zayıf görünmeyi de göze alamaz.\n\nHançerimi kınından çıkarmak için hızla hareket ediyorum ve yanağımın yüzeyine temiz biçimde sürüyorum. Kan aşağıdaki dereye damlıyor; ama [rohanne.GetTitledFirstNamePossessiveNoTooltip] yüzü bana, [rohanne.GetHerHim]'i etkilediğimi ve köylünün yarasını telafi ettiğimi söylüyor.\n\nŞimdi suçlamalarla ilgilenmeliyiz: [rohanne.GetSheHe|U], Ser [longinch.GetFirstNameNicknamed]'e kendini beğenmiş bir bakış atarak muharebe yargılaması teklif ediyor."

 agot_scenario_ats.5030.a:0 "Kabul ediyoruz ve Ser [eustace.GetFirstNamePossessiveNoTooltip] şampiyonu olarak dövüşeceğim!"

 agot_scenario_ats.5030.a.tt:0 "Muharebe yargılamasında dövüşeceksin"

 agot_scenario_ats.5030.b:0 "Kararı Ser [eustace.GetFirstNameNoTooltip]'e bırakmalıyım."

 agot_scenario_ats.5030.b.tt:0 "[eustace.GetFirstNameNoTooltip]'in karar vermesine izin vereceksin"

 agot_scenario_ats.5031.t:0 "Suda Düello"

 agot_scenario_ats.5031.desc:0 "Derede bir muharebe yargılaması olacak; bu kan davasının sonunu belirleyecek şövalyeler arası bir düello. Ser [eustace.GetFirstName] adına dövüşmeyi kabul edecek miyim, yoksa [rohanne.GetTitledFirstName]'in seçeceği şampiyona karşı [eustace.GetHerselfHimself] dövüşmesini mi bırakacağım?"

 agot_scenario_ats.5031.a:0 "Şampiyonun olarak duracağım."

 agot_scenario_ats.5031.a.tt:0 "Muharebe yargılamasında dövüşeceksin"

 agot_scenario_ats.5031.b:0 "Chequy aslanı kendi savaşlarını kendisi vermeli."

 agot_scenario_ats.5031.b.tt:0 "Muharebe yargılamasında dövüşmeyi reddedeceksin"

 agot_scenario_ats.5032.t:0 "Suda Düello"

 agot_scenario_ats.5032.desc:0 "Yaşına ve hizmet yeminime rağmen, Ser [eustace.GetFirstName] yaklaşan muharebe yargılamasında kendi [eustace.GetHerHis] şampiyonu olarak dövüşmeyi seçti.\n\nYapabildiğim tek şey izlemek ve [eustace.GetLadyLord]'ümün dereden galip çıkmasını ummak."

 agot_scenario_ats.5032.a:0 "Düelloyu izleyeceğim."

 agot_scenario_ats.5032.a.tt:0 "Düellonun sonucundan haberdar edileceksin."

 agot_scenario_ats.6010.t:0 "Suda Kan"

 agot_scenario_ats.6010.desc:0 "[dunk.GetTitledFirstNameNicknamed] ve Ser [longinch.GetFirstNameNicknamed] suda cansız yatıyor; Longinch'in kolunun hemen altındaki bir yaradan kan akıyor. [dunk.GetTitledFirstNameNoTooltip] kazandı, ama [dunk.GetSheHe] bu uğraşın sonunda ciğerlerini suyla doldurmuş.\n\nWat'ın Ormanı'nı yakmaktan suçlu bulunmak bir sorun olsa da, Longinch'i bertaraf etmek ve özgürleşmek yanında sönük kalıyor.\n\nHepimiz [dunk.GetTitledFirstNameNoTooltip]'in sudan doğrulmasını bekliyoruz, ama pek hareket yok. Üstatım ileri koşuyor; boğulanları kurtarma deneyimi olan bir Demir Adam."

 agot_scenario_ats.6010.a:0 "[dunk.GetSheHe|U] Coldmoat'te iyileşecek!"

 agot_scenario_ats.6010.a.tt:0 "Artık kendine bir koca seçebilirsin"

 agot_scenario_ats.6011.t:0 "Suda Kan"

 agot_scenario_ats.6011.desc:0 "Ser [longinch.GetFirstNameNicknamed] dereden tırmanıp çıkıyor; nefes nefese, Ser [longinch_opponent.GetFirstNameNicknamed]'in cansız bedeni suyun üzerinde kanlı ve kırık süzülürken. Longinch'e karşı hiçbir sevgim yok — hatta [longinch.GetSheHe]'nin bu düelloda ölmesini ummuştum — ama en azından artık Standfast'i almak için önüm açıldı.\n\nBeni durduracak pek az şey kaldı ve efendimin desteğine sahip olurdum. Geriye yalnızca gidip onu almak kaldı."

 agot_scenario_ats.6011.a:0 "Talebi Ser [eustace.GetFirstNameNoTooltip]'e gönder, Standfast benim."

 agot_scenario_ats.6011.a.tt:0 "Standfast'i talep edeceksin; ama [eustace.GetFirstName] reddedebilir"

 agot_scenario_ats.6011.b:0 "Standfast benim."

 agot_scenario_ats.6011.b.tt:0 "Standfast'in yeni efendisi olacaksın"

 eustace_gave_up_standfast:0 "Ser [eustace.GetFirstName] Standfast'i bana verdi!"

 agot_scenario_ats.6012.t:0 "Suda Kan"

 agot_scenario_ats.6012.desc:0 "Ser [eustace.GetFirstName] dereden tırmanıp çıkıyor; nefes nefese, [longinch.GetName]'in cansız bedeni dereyi kanla doldururken. Wat'ın Ormanı yangınını çıkarmakla, doğru olsun ya da olmasın, tanrıların ve insanların gözünde suçluyum.\n\nSer [eustace.GetFirstNameNoTooltip] neredeyse kesin olarak bendi kaldırmamı isteyecek ve fazla seçeneğim kalmayacak; ama en azından Ser [longinch.GetFirstName] ölüyken babamın vasiyeti çok daha az endişe verici."

 agot_scenario_ats.6012.a:0 "[eustace.GetFirstNameNoTooltip]'in gerçekten ne isteyeceğini göreceğiz."

 agot_scenario_ats.6012.a.tt:0 "Eustace'in taleplerini dinleyeceksin"

 agot_scenario_ats.6013.t:0 "Suda Kan"

 agot_scenario_ats.6013.desc:0 "[dunk.GetTitledFirstNameNicknamed] ve Ser [longinch.GetFirstNameNicknamed]'in cansız bedenleri derenin sığ sularında asılı; sayısız yaradan kan sızıyor ve bulanık sulara karışıyor. Suçluluğum kanıtlanmadı, masumiyetim de; ama mesele şimdi çözülebildiği kadar çözüldü.\n\nLonginch gittiğine göre kendi kocamı seçmekte özgürüm ve tanrılar ile insanlar önünde kanıt olmadan Ser [eustace.GetFirstName]'in Wat'ın Ormanı yangını için beni suçlaması zor olacak.\n\nŞimdi geriye babamın vasiyetini çözmek ve yoluma devam etmek kalıyor."

 agot_scenario_ats.6013.a:0 "Trajik ama gerekli bir son."

 agot_scenario_ats.6013.a.tt:0 "Koca seçmeye geçeceksin"

 agot_scenario_ats.6014.t:0 "Talep"

 agot_scenario_ats.6014.desc:0 "Şampiyonumun deredeki muharebe yargılamasındaki kaybının ardından, Ser [eustace.GetFirstName] bendi kaldırmam için bir talep gönderdi. Bunu yapmak, şimdi bile, beni zayıf gösterebilir. Üstelik kuraklık zamanında su kaynağımızı yaymış oluruz.\n\nBu talebi reddetmek esasen savaş ilan etmek demek; o yüzden bir sonraki rotamı dikkatle düşünmeliyim."

 agot_scenario_ats.6014.a:0 "Peki, bendi kaldıracağım."

 agot_scenario_ats.6014.a.tt:0 "Bendi kaldıracak ve zayıf görüneceksin"

 agot_scenario_ats.6014.b:0 "Zayıf görünmektense hain görünmeyi tercih ederim!"

 agot_scenario_ats.6020.t:0 "Suda Kan"

 agot_scenario_ats.6020.desc:0 "[dunk.GetTitledFirstNameNicknamed] ve Ser [longinch.GetFirstNameNicknamed] suda cansız yatıyor; Longinch'in kolunun hemen altındaki bir yaradan kan akıyor. [dunk.GetTitledFirstNameNoTooltip] kazandı, ama [dunk.GetSheHe] bu uğraşın sonunda ciğerlerini suyla doldurmuş.\n\n[rohanne.GetTitledFirstName] artık Wat'ın Ormanı yangınından suçlu bulunduğuna göre, bendin inmesini ve Chequy Suyumun yeniden akmasını talep etmek için ihtiyacım olan koz elimde!"

 agot_scenario_ats.6020.a:0 "Talebi gönderme zamanı, bent inmeli!"

 agot_scenario_ats.6020.a.tt:0 "[rohanne.GetFullNameNoTooltip]'in bendi indirmesini talep edeceksin"

 agot_scenario_ats.6021.t:0 "Suda Kan"

 agot_scenario_ats.6021.desc:0 "Ser [longinch.GetFirstNameNicknamed] dereden tırmanıp kurtuluyor; [dunk.GetTitledFirstNameNicknamed]'in cansız bedenini arkada, derede kanar halde bırakarak. Yanaklarımdan istemsiz gözyaşlarının süzüldüğünü hissediyorum; delikanlıya, kızım hâlâ hayatta olsaydı [dunk.GetHerHim] ile evlenmesini isterdim demiştim; şimdi [dunk.GetSheHe] onunla ve hanemin geri kalanıyla öbür dünyada. Genç yaver Egg yanımda ağlıyor; [rohanne.GetTitledFirstName] ise yakışıklı şövalyenin bedenine uzun bir bakış asıyor.\n\n[rohanne.GetSheHe|U] artık suçlamalarımdan azade ve isterse toprağımı almaya gücü yetecek bir konumda. Talebin gelmemesini ummak, ya da onunla başa çıkmak için silah gücüme güvenmek zorunda kalacağım."

 agot_scenario_ats.6021.a:0 "Elveda, [dunk.GetTitledFirstNameNoTooltip]..."

 agot_scenario_ats.6021.a.tt:0 "Sıradakini bekleyeceksin"

 agot_scenario_ats.6022.t:0 "Suda Kan"

 agot_scenario_ats.6022.desc:0 "Derenin kıyısını kavrayıp kendimi sudan çekiyor ve miğferimi kafamdan koparıyorum. Ser [longinch.GetFirstNameNicknamed]'in kanlı cesedini sığ suda süzülürken görüyorum; düellomuzu sonlandıran koltuk altı yarasından kan akıyor.\n\n[rohanne.GetTitledFirstName] beden dereden çekilirken izliyor ve yollarımız ayrılıyor. Suçlamalarım tanrılar ve insanlar önünde kanıtlandığına göre, artık gecikmeden bendin kaldırılmasını ve suyun topraklarıma dönmesini talep edebilirim!"

 agot_scenario_ats.6022.a:0 "Şu bendi kaldır!"

 agot_scenario_ats.6022.a.tt:0 "Bentin Chequy Suyu'ndan kaldırılmasını talep edeceksin"

 agot_scenario_ats.6023.t:0 "Suda Kan"

 agot_scenario_ats.6023.desc:0 "Hem [dunk.GetTitledFirstNameNicknamed] hem de Ser [longinch.GetFirstNameNicknamed] derede süzülüyor; kanlı ve kırık. [rohanne.GetTitledFirstName], Ser [longinch.GetFirstNameNoTooltip]'in bedenini [rohanne.GetHerHis] adamlarına toplattırıyor; yaver Egg [dunk.GetTitledFirstNameNoTooltip]'i toplamama yardım ederken bana başıyla onay vererek.\n\nHer birimiz bu muharebe yargılamasında iddialarımızı kanıtlamaya çalıştık — ve şimdi iki şövalye öldü; tanrıların ve insanların gözünde hiçbir şey daha doğru olmadı. Kanıt olmadan [rohanne.GetTitledFirstNameNoTooltip]'i hiçbir şeyle suçlayamam ve şüphe, [rohanne.GetHerHim]'in şimdi bana karşı harekete geçmesini kesinlikle engelleyecek."

 agot_scenario_ats.6023.a:0 "Ne iyi bir şövalyenin israfı..."

 agot_scenario_ats.6023.a.tt:0 "Standfast'e döneceksin"

 agot_scenario_ats.6024.t:0 "Zehir ve Pençeler"

 agot_scenario_ats.6024.desc:0 "Muharebe yargılamasındaki yenilgisine rağmen, [rohanne.GetTitledFirstName] yalnızca Chequy Suyu'ndaki bendin kaldırılması talebimi reddetmekle kalmadı; kalan topraklarım üzerinde iddia öne sürüp onları almak için bir orduyla yürüdü.\n\nGeriye yalnızca savaş alanında hâlâ pençelerim olduğunu kanıtlamak ve bu Kızıl Dul'a, birimiz yenilginin acısını tadana dek savaş açmak kaldı!"

 agot_scenario_ats.6024.a:0 "Bu Aslan pençelerini gösterecek!"

 agot_scenario_ats.6024.a.tt:0 "[rohanne.GetFullNameNoTooltip] ile, [rohanne.GetHerHis] toprakların iddiası için bir savaşta dövüşeceksin"

 agot_scenario_ats.6025.t:0 "Kuşatılmış Bir Kule"

 agot_scenario_ats.6025.desc:0 "Muharebe yargılamasındaki yenilgim ve onurumdan geriye kalanların kaybıyla, [rohanne.GetTitledFirstNamePossessive] Standfast talebini düşünmek zorunda kalıyorum. Hanemin bu toprak üzerindeki kadim hakkının son kalıntısı için savaşabilirim ve muhtemelen onu koruma girişiminde ölebilirim; yüzlerce kendi insanımı da yanıma alarak.\n\nBelki de Redgrass Tarlası'nda kaybettiğimizde yapmam gerekeni yapmak, [bittercringe.GetNickname]'in yaptığı gibi paralı asker hayatına gitmek daha iyi olur. Belki de [bittercringe.GetHerHis] çetesine — kurulmuşsa — katılabilir ve bir zamanlar Daemon'la yaptığım gibi kalan Kara Ejderhalarla silaha sarılabilirim.\n\nKarar şimdi verilmeli: Geçmiş için savaşmak, ya da yeni bir gelecek için ayrılmak?"

 agot_scenario_ats.6025.a:0 "Atalarımın kemiklerini daha bu kadar kolay bırakmayacağım!"

 agot_scenario_ats.6025.a.tt:0 "Standfast için bir savaş yapacaksın"

 agot_scenario_ats.6025.b:0 "Bu eski kuleyi elinde tut, ben yeni bir yol bulacağım."

 agot_scenario_ats.6025.b.tt:0 "Topraksız bir maceracı olacaksın"

 agot_scenario_ats.6030.t:0 "Acılı Bir Zafer"

 agot_scenario_ats.6030.desc:0 "Yanlış kalede uyanıyorum; yüzümde bir kesik yara izi, bedenimde morluklar ve kırık kemikler. Muharebe yargılamasını kazandım ve barışın müzakere edilmesi bekleniyor. Yaralarım iyileşirken bir üstat bana bakar ve Ser [eustace.GetFirstName] ile [rohanne.GetTitledFirstName]'in tam da o müzakerelerin ortasında olduğunu bildirir; bir kez iyileşince dilediğim yere gitmekte özgür olacağımı söyler. Günler geçtikçe [rohanne.GetTitledFirstNameNoTooltip] beni ziyaret etmekten kaçınıyor gibi; kalışım boyunca [rohanne.GetHerHim]'i hiç görmüyorum.\n\nEgg yanımda sadık kalırken, iyileşmeme elinden geldiğince yardım ederken, acılığım büyüyor. Tek bir görüşmeyle kolayca varılabilecek bir uzlaşmaya ulaşmak için tüm o acı, tüm o savaşma ve ileri geri gidiş.\n\nBu müzakerelerden ne çıkarsa çıksın, Egg'e küçük halkın değerini öğretmem gerektiğini biliyorum; onların soyluların oyunlarında kullanılacak piyonlar olmadığını ve gururun bu kadar sıkıntı için iyi bir bahane olmadığını."

 agot_scenario_ats.6030.a:0 "Müzakereleri bekleyip sonra yolumuza devam edeceğiz."

 agot_scenario_ats.6030.a.tt:0 "Savaş çıkıp çıkmayacağını ya da barışın müzakere edilip edilmeyeceğini bekleyeceksin"

 agot_scenario_ats.6031.t:0 "Suda Kan"

 agot_scenario_ats.6031.desc:0 "Ser [eustace.GetFirstNameNicknamed] derenin kıyısına tırmanıyor; rakibinin bedeni [eustace.GetHerHis] arkasında suya kanar halde, zaferinin tadını çıkarıyor. [eustace.GetSheHe|U] bana gülümsüyor, sonra Chequy Suyu'nun yakında yeniden serbestçe akacağını bilmenin rahatlığıyla bir iç çekiş bırakıyor.\n\n[rohanne.GetTitledFirstName]'e son bir özlem dolu bakışla dereyi geride bırakıp Standfast'e dönüyorum."

 agot_scenario_ats.6031.a:0 "Bent şimdi kesin iner."

 agot_scenario_ats.6031.a.tt:0 "[rohanne.GetTitledFirstNameNoTooltip]'in düellonun sonucunu kabul edip etmeyeceğini görmek için bekleyeceksin"

 agot_scenario_ats.6032.t:0 "Suda Kan"

 agot_scenario_ats.6032.desc:0 "Ser [longinch.GetFirstNameNicknamed] dereden tırmanıp kurtuluyor; Ser [eustace.GetFirstNameNicknamed]'in cansız bedenini arkada, suda kanar halde bırakarak. Beden derenin kıyısına yaslanırken yüreğimi suçluluk parçalıyor. Suyun karşısına [rohanne.GetTitledFirstName]'e bakıyorum; güzel hatlarında memnun bir gülümseme görmeyi bekliyorum. Onun yerine melankoli, belki de keder görüyorum.\n\n[rohanne.GetSheHe|U] artık tüm suçlamalardan azade ve chequy aslanının son topraklarını almaya muktedir. Egg ve ben suyu geride bırakıp Standfast'e dönerken, yaşlı şövalyenin ölümünde yüzümden gözyaşlarının süzüldüğünü buluyorum."

 agot_scenario_ats.6032.a:0 "Elveda, Ser [eustace.GetFirstNameNoTooltip]..."

 agot_scenario_ats.6032.a.tt:0 "Sıradakini bekleyeceksin"

 agot_scenario_ats.7010.t:0 "Yaz Gülleri"

 agot_scenario_ats.7010.desc.start:0 "Son düşmanlıkları geride bırakmış, babamın vasiyeti önümde uzanırken, başka bir koca bulmanın zamanı geldi.\n\n"

 agot_scenario_ats.7010.desc.e:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Aşk evliliği olmazdı, ama iyi bir yerel politika olurdu."

 agot_scenario_ats.7010.desc.d:0 "[dunk.GetTitledFirstName] uzun boylu, yakışıklı ve sevecen; sevimli bir onur anlayışı ve onun adına kendini tehlikeye atma isteği var. Siyasi açıdan avantajlı bir evlilik olmazdı, ama mutlu bir evlilik olabilir."

 agot_scenario_ats.7010.desc.g:0 "Ser [gerold.GetNameNicknamed] güçlü bir aday. [gerold.GetSheHe|U] bana sık sık mektup gönderiyor; hoşlanmaya başladım; üstelik [gerold.GetSheHe], diyarın en zengin lordunun son derece yetenekli ve nüfuzlu kardeşi. [gerold.GetSheHe]'nin Aslan'ın sarayından uzak, Coldmoat'te bir hayattan tatmin olup olmayacağı konusunda şüphelerim var; o yüzden evlilik risksiz olmazdı."

 agot_scenario_ats.7010.desc.l:0 "Ser [longinch.GetFirstNameNicknamed] az neşeli, zalim esprili, aşağılık bir adam. [longinch.GetHerHis] ölümünü ayarlayabilseydim belki yapardım; yine de [longinch.GetSheHe], babamın benimle evlenmemi istediği kişiydi, o yüzden yine de [longinch.GetHerHim]'i düşünmeliyim."

 agot_scenario_ats.7010.desc.ed:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Ama kişisel mutluluğumu da düşünmeliyim; bu amaçla, birbirimizi tanıdığımız kısa sürede ona karşı sevgi duyduğum, yakışıklı ve mert bir şövalye olan [dunk.GetTitledFirstName]'e bakıyorum; o da topraklarımı dilediğim gibi yönetmeme izin verirdi."

 agot_scenario_ats.7010.desc.eg:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Ancak, daha da siyasi açıdan avantajlı bir evliliği düşünmeliyim. Ser [gerold.GetNameNicknamed] bana sık sık mektup gönderiyor; hoşlanmaya başladım ve Westeros'un en zengin hanesinin bir ferdi. [gerold.GetSheHe] Coldmoat'te pek mutluluk bulmayabilir ve bu yüzden evlenmesi bir risk; ama göz ardı edilemez."

 agot_scenario_ats.7010.desc.el:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Sonra Ser [longinch.GetFirstNameNicknamed] var; az neşeli, zalim esprili, aşağılık bir adam. [longinch.GetHerHis] ölümünü ayarlayabilseydim belki yapardım; yine de [longinch.GetSheHe], babamın benimle evlenmemi istediği kişiydi, o yüzden yine de [longinch.GetHerHim]'i düşünmeliyim."

 agot_scenario_ats.7010.desc.edg:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Ama kendi mutluluğumu düşündüğümde, iki aday daha öne çıkıyor. [dunk.GetTitledFirstName] uzun boylu, yakışıklı ve birbirimizi tanıdığımız kısa sürede ona karşı sevgi duydum. Öte yandan, bana her gün tatlı mektuplar gönderen ve Westeros'un en zengin hanesinden gelen Ser [gerold.GetNameNicknamed] var. Bunlardan herhangi biri uygun bir koca olabilir; yalnızca sormam gerekiyor."

 agot_scenario_ats.7010.desc.edl:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Yine de, kişisel mutluluğumu da düşünmeliyim; bu amaçla, birbirimizi tanıdığımız kısa sürede ona karşı sevgi duyduğum, yakışıklı ve mert bir şövalye olan [dunk.GetTitledFirstName]'e bakıyorum; o da topraklarımı dilediğim gibi yönetmeme izin verirdi. Son olarak, adamdan ne kadar hoşlanmasam da babam evleneceğimizi beklediği için Ser [longinch.GetNameNicknamed]'i düşünmeliyim."

 agot_scenario_ats.7010.desc.egl:0 "Ser [eustace.GetFirstName], Coldmoat üzerindeki iddialarımızı birleştirmek, [eustace.GetHerHis] gururunu kurtarmak ve bana topraklarımı yönetmekle pek ilgilenmeyen, benden çok önce ölecek bir koca sağlamak için bir fırsat sunuyor. Ama aklıma başka bir aslan geliyor; zira Ser [gerold.GetNameNicknamed] güçlü bir aday. [gerold.GetSheHe|U] bana sık sık mektup gönderiyor; hoşlanmaya başladım; üstelik [gerold.GetSheHe], diyarın en zengin lordunun kardeşi. Son olarak, adamdan ne kadar hoşlanmasam da babam evleneceğimizi beklediği için Ser [longinch.GetNameNicknamed]'i düşünmeliyim."

 agot_scenario_ats.7010.desc.edgl:0 "Seçeneklerimi düşünürken aklıma dört seçenek geliyor. Ser [eustace.GetFirstName] istikrar sunuyor; Coldmoat üzerindeki iddialarımızı birleştirerek ve yerel siyasette avantaj sağlayarak. [dunk.GetTitledFirstName] mert ve yakışıklı; ona duyduğum sevgi beni bile şaşırtıyor; böyle bir eşleşmede kazanılacak pek az şey olsa da... mutlu bir evlilik olabilir. Ser [gerold.GetNameNicknamed] güçlü bir seçim; [gerold.GetHerHis] mektupları son zamanlarda bana teselli kaynağı oldu ve Evi Lannister'ın gücü ile zenginliği eşsiz. Son olarak, yalnızca babam evlenmemiz gerektiğini düşündüğü için düşündüğüm aşağılık bir adam olan Ser [longinch.GetNameNicknamed]'i düşünmeliyim."

 agot_scenario_ats.7010.desc.dg:0 "Aklıma iki potansiyel talip geliyor. [dunk.GetTitledFirstName] dürüst ve mert bir şövalye; birbirimizi tanıdığımız kısa sürede ona duyduğum sevgi hızla büyüdü. Böyle bir eşleşmede pek az siyasi avantaj olur, ama mutlu bir evlilik olabilir. Diğeri, mektuplarını dört gözle beklediğim Ser [gerold.GetNameNicknamed]. [gerold.GetSheHe|U] aynı zamanda diyarın en zengin hanesinin bir üyesi ve iyi bir siyasi eşleşme olur; ne var ki [gerold.GetSheHe]'nin Aslan'ın sarayından bu kadar uzakta, Coldmoat'te bir hayattan tatmin olacağından şüpheliyim."

 agot_scenario_ats.7010.desc.dgl:0 "Aklıma üç potansiyel talip geliyor. [dunk.GetTitledFirstName] dürüst ve mert bir şövalye; birbirimizi tanıdığımız kısa sürede ona duyduğum sevgi hızla büyüdü. Böyle bir eşleşmede pek az siyasi avantaj olur, ama mutlu bir evlilik olabilir. Diğeri, mektuplarını dört gözle beklediğim Ser [gerold.GetNameNicknamed]. [gerold.GetSheHe|U] aynı zamanda diyarın en zengin hanesinin üyesi ve iyi bir siyasi eşleşme olur; ne var ki [gerold.GetSheHe]'nin Aslan'ın sarayından bu kadar uzakta, Coldmoat'te bir hayattan tatmin olacağından şüpheliyim. Son olarak, yalnızca babam evlenmemiz gerektiğini düşündüğü için düşündüğüm aşağılık bir adam olan Ser [longinch.GetNameNicknamed]'i düşünmeliyim."

 agot_scenario_ats.7010.desc.dl:0 "Aklıma iki potansiyel talip geliyor. [dunk.GetTitledFirstName] dürüst ve mert bir şövalye; birbirimizi tanıdığımız kısa sürede ona duyduğum sevgi hızla büyüdü. Böyle bir eşleşmede pek az siyasi avantaj olur, ama mutlu bir evlilik olabilir. Diğeri, yalnızca babam evlenmemiz gerektiğini düşündüğü için düşündüğüm aşağılık bir adam olan Ser [longinch.GetNameNicknamed]."

 agot_scenario_ats.7010.desc.gl:0 "Aklıma iki potansiyel talip geliyor. Mektuplarını dört gözle beklediğim ve diyarın en zengin lordunun kardeşi olan Ser [gerold.GetNameNicknamed]. [gerold.GetSheHe] iyi bir seçim olsa da, [gerold.GetSheHe]'nin Aslan'ın sarayından bu kadar uzakta, Coldmoat'te bir hayattan tatmin olacağından şüpheliyim. Diğeri, yalnızca babam evlenmemiz gerektiğini düşündüğü için düşündüğüm aşağılık bir adam olan Ser [longinch.GetNameNicknamed]."

 agot_scenario_ats.7010.desc.finish:0 "\n\nNasıl karar vereceğim?"

 agot_scenario_ats.7010.a:0 "Örümcek, chequy aslanıyla evlenecek."

 agot_scenario_ats.7010.b:0 "[dunk.GetTitledFirstNameNoTooltip] ile evlenip mutluluk bulmayı umacağım."

 agot_scenario_ats.7010.c:0 "Altın aslanın tatmin olabileceğini umacağım."

 agot_scenario_ats.7010.d:0 "Babamın eşleşmesini sindireceğim."

 agot_scenario_ats.7010.e:0 "Başka bir yerde koca bulacağım, ama hızlı hareket etmeliyim."

 agot_scenario_ats.7010.e.tt:0 "Başka bir eş arayacaksın; ama bunun için yalnızca altı ayın olacak"

 agot_scenario_ats.7011.t:0 "Tarih Adları Hatırlar"

 agot_scenario_ats.7011.desc:0 "Ser [eustace.GetFirstName]'den evlilik teklifim hakkında bir cevap aldım. [eustace.GetSheHe], oğlunun kaybında ortak bir keder bulduktan sonra ilgi göstermiş olsa da, çocuklarımızın Webber adını taşımasına izin vermeyecek.\n\nSer [eustace.GetFirstNameNoTooltip] ile evleneceksem, geleneksel şekilde; potansiyel çocuklarımızın Osgrey adını ve armaları olarak chequy aslanını taşımasıyla olacak.\n\nBu isteği reddedersem başka bir yerde koca bulmam gerekecek; öyleyse Webber adının değeri ne?"

 agot_scenario_ats.7011.a:0 "Bu şartları kabul ediyorum."

 agot_scenario_ats.7011.a.tt:0 "[eustace.GetNameNoTooltip] ile ana soydan olmayan şekilde evleneceksin"

 agot_scenario_ats.7011.b:0 "Başka yerde daha iyi bir seçim bulurum."

 agot_scenario_ats.7011.b.tt:0 "Özgürce bir koca arayacaksın"

 rohanne_patrimarried_eustace:0 "Leydi Rohanne geleneksel bir evlilik teklifimi kabul etti!"

 agot_scenario_ats.7012.t:0 "Sert Reddediş"

 agot_scenario_ats.7012.desc:0 "Ser [eustace.GetFirstName]'den haber geldi: [eustace.GetSheHe|U] evlilik teklifimi reddetti ve başka bir yerde bulmamı buyurdu. \n\nBabamın vasiyetini yerine getirmek için arayışa dönmeliyim."

 agot_scenario_ats.7012.a:0 "Başka yerde daha iyi bir seçim bulurum."

 agot_scenario_ats.7012.a.tt:0 "Özgürce bir koca arayacaksın"

 agot_scenario_ats.7013.t:0 "Sert Reddediş"

 agot_scenario_ats.7013.desc:0 "[dunk.GetTitledFirstName]'den evlilik teklifim hakkında haber aldım. [dunk.GetHerHis] avam doğumuna ve benimkinin yüksekliğine, hatta [dunk.GetHerHis] yaverinin bir kalenin güvenliğinde Coldmoat'te hizmet etme şansına rağmen, alçak çit şövalyesi tarafından reddedildim.\n\nNe kadar şaşırtıcı olsa da, arayışa dönmem gerekiyor gibi görünüyor."

 agot_scenario_ats.7013.a:0 "Başka yerde daha iyi bir seçim bulurum."

 agot_scenario_ats.7013.a.tt:0 "Özgürce bir koca arayacaksın"

 agot_scenario_ats.7020.t:0 "Şaşırtıcı Bir Teklif"

 agot_scenario_ats.7020.desc:0 "[rohanne.GetTitledFirstName]'den, oğlum [addam.GetFirstName]'in mezarını ziyaret etmek için topraklarıma erişim talep eden bir bildiri geldi. Neredeyse düşünmeden izin veriyorum ve çok geçmeden [rohanne.GetHerHim]'i mezarının başında ağlarken buluyorum. Uzun süredir ölü sandığım bir parçam [rohanne.GetHerHim]'i teselli etmeye itiyor ve kısa süre sonra kendimizi ateşimin başında, anısına böğürtlen yiyerek tatlı anıları yâd ederken buluyoruz. Gidişinden kısa süre sonra bir koşucu evlilik teklifi getiriyor.\n\nDüşünmemek aptallık olur; zira bir evlilik anlaşması beni ismen Coldmoat'in lordu yapar ve hanemi yok olmaktan kurtarır; ne var ki çocuklarımızın Webber olmasını istiyor ve bunu akılda tutarak cevap vermeliyim."

 agot_scenario_ats.7020.a:0 "Kabul edeceğim, ama yalnızca çocuklarımız chequy aslanını taşırsa."

 agot_scenario_ats.7020.a.tt:0 "Ana soydan olmayan bir evlilik isteyeceksin"

 agot_scenario_ats.7020.b:0 "[rohanne.GetHerHis] şartlarını kabul ediyorum, çocuklarımız örümcek olacak."

 agot_scenario_ats.7020.c:0 "Lanet olsun hepsine, reddediyorum."

 agot_scenario_ats.7020.c.tt:0 "Evlilik teklifini reddediyorsun"

 agot_scenario_ats.7021.t:0 "Sert Bir Red"

 agot_scenario_ats.7021.desc:0 "[rohanne.GetTitledFirstNamePossessive] aramızdaki evlilik anlaşmasına ilk ilgisini göstermesine rağmen, [rohanne.GetHerHis] çocuklarının gururlu chequy aslanını taşıması fikrinin fazla ileri gitmek olduğu anlaşılıyor! [rohanne.GetSheHe|U] bu yüzden geleneksel bir evlilik talebime sert bir red gönderdi ve evlilik görüşmelerimizi doğrudan bitirdi.\n\nÖrümcek ile chequy aslanı birbirine uygun değilmiş gibi görünüyor."

 agot_scenario_ats.7021.a:0 "En iyisi yoluma bakıp kendi karımı bulmak."

 agot_scenario_ats.7021.a.tt:0 "Hikâyeyi geride bırakacaksın."

 agot_scenario_ats.7031.t:0 "Kızıl Dul'un Teklifi"

 agot_scenario_ats.7031.desc:0 "[rohanne.GetTitledFirstName]'den bir haberci geldi. Örümcek mührünü kırdığımda içinde fazlasıyla tatlı bir mektup ve bir evlilik teklifi buluyorum. Okumaya devam ederken şokumu zar zor kontrol ediyorum. Güzel, soylu bir [rohanne.GetLadyLord], kocası olarak beni seçti mi? Hatta Egg'e kalenin yaverleri arasında bir konum ve bana da hane şövalyelerinin komutanlığını sunacak kadar ileri gidiyor.\n\nBu her şeyi değiştirirdi; artık bir çit şövalyesi olmazdım — Coldmoat Leydisi'nin lord-eşi olurdum. Egg uygun bir kalede, hâlâ dünyayı öğrenerek ama duvarların güvenliğinden ve kendi yaşıtı yaverlerle çevrili olarak büyütülebilirdi.\n\nÜstelik [rohanne.GetTitledFirstNameNoTooltip] her erkeğe uygun bir eş. Çitlerdeki hayatı bırakmak zor olurdu; ama bir yuva — ve belki de aşk — için değer miydi?"

 agot_scenario_ats.7031.b:0 "Dul'la evleneceğim ve çitleri geride bırakacağım."

 agot_scenario_ats.7031.b.tt:0 "[rohanne.GetNameNoTooltip] ile ana soylu şekilde evlenecek ve [rohanne.GetHerHim]'e geçeceksin"

 agot_scenario_ats.7031.c:0 "Çitleri bırakamam, tek bildiğim onlar."

 agot_scenario_ats.7031.c.tt:0 "Evlilik teklifini reddedeceksin"

 agot_scenario_ats.8030.t:0 "Yaz Yağmurları ve Yumuşak Vedalar"

 agot_scenario_ats.8030.desc:0 "Reach'e nihayet yağmur yağarken, Coldmoat'i ve onunla Standfast arasındaki tüm meseleyi geride bırakmaya hazırlanıyorum. Ahırda, [rohanne.GetName]'in kısa boylu silueti tarafından durduruluyorum. Yaklaşan evliliğini ve çatışmanın en başından beri boşunalığını duyduktan sonra keyfim kaçmış olsa da, [rohanne.GetTitledFirstNamePossessive] yüzünü görmek hoş. [rohanne.GetSheHe|U] özür diliyor ve atlar ahırlarında kıpırdanıp yerleşirken bir şey söylemekle söylememek arasında gidip geliyor gibi.\n\nSonunda [rohanne.GetSheHe] bana bir hane şövalyesi, Egg'e de kalenin yaveri konumu teklif ediyor ve bizi yola kaptırmamayı umduğunu söylüyor.\n\nCezbedici bir teklif, ama çitler tek bildiğim ve bu yer hakkında kendimi kırgın buluyorum. Kabul etmezsem, [rohanne.GetSheHe] en azından bana bir tür hediye vermeyi teklif ediyor."

 agot_scenario_ats.8030.a:0 "Şövalyen olacağım."

 agot_scenario_ats.8030.a.tt:0 "[rohanne.GetNameNoTooltip]'in saray mensubu olacak ve [rohanne.GetHerHim]'e geçeceksin"

 agot_scenario_ats.8030.b:0 "Kabul edemem, ama bir öpücük ve küçük bir hediye isterim."

 agot_scenario_ats.8030.b.tt:0 "Birkaç tutam saçtan başka bir şeyle ayrılmayacaksın"

 agot_scenario_ats.9000.t:0 "Kara Ejderha'nın Doğum Hakkı"

 agot_scenario_ats.9000.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', bittercringe)] [bittercringe.GetFirstName] haber gönderdi; [bittercringe.GetSheHe], kızıl ejderhalar tarafından haksızlığa uğratılan, sürgün edilen ve soyulan herkesi çağırdı. Altın bir sancağın altında [bittercringe.GetHerHim]'e toplandılar; Özgür Şehirler'in şimdiye dek gördüğü en büyük yeni bir birlik oluşturdular.\n\nBlackfyre'ı kazanıp [bittercringe.GetHerHis] desteğini aldığımdan beri, [bittercringe.GetSheHe] benim adıma savaş açmaya ve Gaspçı [ITRuler.GetFirstName]'den Demir Taht'ı almama yardım etmeye hazır. Binlerce kişi ölecek ve yönetmeyi umduğum diyar, bu savaşı başlatmayı seçersem kanayacak; ama o olmadan kızıl ejderhalara belki de asla meydan okunmayacak. Kararım ne olursa olsun, şimdi vermeliyim.\n\nDoğum hakkım için mi yürüyeceğim, yoksa halkımın sahte doğumlu ejderhalar tarafından yönetilmesine izin mi vereceğim?"

 agot_scenario_ats.9000.a:0 "Savaşa yürüyoruz!"

 agot_scenario_ats.9000.b:0 "Kendi iktidar yolumu bulmalıyım, şimdi zamanı değil."

 agot_scenario_ats.9010.t:0 "Son Damalı Aslan"

 agot_scenario_ats.9010.desc:0 "Ser [eustace.GetFirstName]'in ölümüyle, bent çatışması bitti ve hendeğim dolu ve hazır kalacak. Bu kadar asil bir soyun sonuncusunu ve sevdiğim bir oğlanın babasını gömerlerken içimde biraz keder var; ama daha önce de yaşlı adamlar gömdüm.\n\nŞimdi, yüreğim ağır olsa da, başka uğraşlara geçiyorum."

 agot_scenario_ats.9010.a:0 "Acı bir hayatın acı bir sonu."

 agot_scenario_ats.9010.a.tt:0 "Daha hayati görevlerle yoluna devam edeceksin"

 agot_scenario_ats.9011.t:0 "Son Bir Şans"

 agot_scenario_ats.9011.desc:0 "Babamın vasiyeti ağır bir yük gibi üzerime biniyor. Hafta içinde evlenmeliyim, yoksa unvanlarım elimden alınacak ve yasal varisim kalelerime sahip olacak. Daha önce incelediğim adamlardan hangilerinin hâlâ müsait olduğunu görmek için kuzgunlar ve biniciler gönderdim ve seçenekler önüme dizildi.\n\nSonunda bir eş seçecek miyim? Yoksa arayışı kendim üstlenerek kaderi bir kez daha deneyecek miyim?"

 agot_scenario_ats.9011.a:0 "Chequy aslanı belki de hâlâ örümcekle evlenir."

 agot_scenario_ats.9011.a.tt:0 "Ser [eustace.GetFirstNameNoTooltip]'e bir evlilik anlaşması için ulaşacaksın."

 agot_scenario_ats.9011.b:0 "[dunk.GetTitledFirstNameNoTooltip] hâlâ kurtarıcım olabilir."

 agot_scenario_ats.9011.b.tt:0 "[dunk.GetTitledFirstNameNoTooltip]'e bir evlilik anlaşması için ulaşacaksın."

 agot_scenario_ats.9011.c:0 "[gerold.GetFirstNameNoTooltip]'in burada tatmin olup olmayacağına bakabilirim."

 agot_scenario_ats.9011.c.tt:0 "Ser [gerold.GetFirstNameNoTooltip] ile evleneceksin."

 agot_scenario_ats.9011.d:0 "Ser [longinch.GetFirstNameNoTooltip] ile bir eşleşmeyi sindirebilirim."

 agot_scenario_ats.9011.d.tt:0 "Ser [longinch.GetFirstNameNoTooltip] ile evleneceksin"

 agot_scenario_ats.9011.e:0 "Bir kez daha, son bir kez denemeliyim."

 agot_scenario_ats.9011.e.tt:0 "Kendi başına yeniden bir eş aramayı deneyebilirsin; ama yalnızca bir haftan daha olacak."

 agot_scenario_ats.9012.t:0 "Bir Babanın Ağı"

 agot_scenario_ats.9012.desc:0 "Babamın tuzağı sonunda yakaladı beni. Çabalarıma rağmen artık pek seçeneğim yok. Topraklarımdan vazgeçmeli ve kalelerimi varisime bırakmalıyım. Arzuladığım kader bu değildi, ama artık yapılabilecek pek az şey var.\n\nColdmoat'in Kızıl Dulu artık yok; ben yalnızca Leydi Rohanne'im."

 agot_scenario_ats.9012.a:0 "Elveda, Coldmoat."

 agot_scenario_ats.9012.b:0 "Ser Duncan'ı bulup kampına katılacağım."

 agot_scenario_ats.9012.b.tt:0 "Ser Duncan the Tall'a geçeceksin ve Rohanne bir takipçi olacak."

 agot_scenario_ats.9012.c:0 "Bu toprakları geride bırakıp yeni bir yol öreceğim."

 agot_scenario_ats.9012.c.tt:0 "Unvanlarından vazgeçecek ve bir macera kampı kuracaksın."

 agot_scenario_ats.9013.t:0 "Meşaleye Dönüşen Kule"

 agot_scenario_ats.9013.desc:0 "Standfast'in çevresinde yangınlar yanarken ve Ser [eustace.GetFirstName]'in bize karşı dizdiği zavallı kuvvetler hiçliğe dönüşürken, galip duruyorum. Şimdi toz duman yatışırken yeniden inşa edebilir ve nihayet babamın vasiyeti meselesine bakabilirim."

 agot_scenario_ats.9013.a:0 "Kule benim ve bent inebilir!"

 agot_scenario_ats.9013.a.tt:0 "Standfast ve Coldmoat suyu paylaşacak"

 agot_scenario_ats.9014.t:0 "Dişsiz Aslan"

 agot_scenario_ats.9014.desc:0 "Kaynaklarımız arasındaki uçuruma rağmen, Ser [eustace.GetFirstName] yine de Coldmoat Dulu'na karşı savaş açmayı uygun gördü. Şimdi, zayıf gücü ezildi ve bir harabe olarak kaldı. Bu mesele çözülüp beni galip bıraktığına göre, nihayet babamın vasiyetiyle ve konumumu güçlendirmekle ilgilenebilirim."

 agot_scenario_ats.9014.a:0 "Başka meselelere."

 agot_scenario_ats.9014.a.tt:0 "Bir evlilik seçenekleri listesi alacaksın"

 agot_scenario_ats.9015.t:0 "Yanan Ağlar"

 agot_scenario_ats.9015.desc:0 "Coldmoat'in dışındaki kana bulanmış tarlalar, kapıda bekleyen gururlu chequy aslanıyla birlikte Webber adamlarının cesetleriyle dolu. Ser [eustace.GetFirstName]'e karşı hamlemi yaptım ve başarısızlığın bedelini ödedim. Aşağılandım ve hendek yırtılıp atıldı; önümüzdeki günlerde Coldmoat'in ekinleri için daha az su bırakıldı.\n\nYapabildiğim tek şey, yağmur için dua etmek."

 agot_scenario_ats.9015.a:0 "Bu kuraklığı atlatıp bir sonraki hamlemi planlamak zorundayım"

 agot_scenario_ats.9015.a.tt:0 "Bent inecek ve eş seçmeye geçeceksin"

 agot_scenario_ats.9016.t:0 "Kaybedilen Bir Doğum Hakkı"

 agot_scenario_ats.9016.desc:0 "Chequy aslanı bir kez daha Coldmoat'in üzerinde gururla dalgalanıyor; kadim kalenin örümcek sancakları yırtılıp aşağıdaki alevlere atılmış. Babamın haklı olup olmadığını, doğum hakkımın en büyük parçası kavrayışımdan koparılmışken tek başıma yönetip yönetemeyeceğimi merak ediyorum.\n\nSırada ne var? İntikam mı? Yoksa kabulleniş mi?"

 agot_scenario_ats.9016.a:0 "Başka meselelere dönüp bir sonraki hamlemi düşüneceğim."

 agot_scenario_ats.9016.a.tt:0 "Potansiyel eşler listesinden seçim yapacaksın"

 agot_scenario_ats.9020.t:0 "Ölü Bir Dul"

 agot_scenario_ats.9020.desc:0 "[rohanne.GetTitledFirstName]'in ölümüyle, bent çatışması şimdilik bitti. Oğlumun çocukluk aşkı, ailemin kalesinin gölgesinde gömülürken keder duymadan edemiyorum. Hayatımda o kadar çok ölüm ve yıkım var ve yine de hiçbirinin bir anlamı olmadı. Daha fazla hamle yapmak zor olacak; efendim artık çok yakından izleyecek, o yüzden bizi kurtaracak yağmurlar gelene dek kuraklığa katlanmalıyım.\n\nUmarım yakında gelirler."

 agot_scenario_ats.9020.a:0 "Ölülerin yasını tutup yaşayanlar için dua edeceğiz."

 agot_scenario_ats.9020.a.tt:0 "Kuraklığın sona ermesini bekleyeceksin"

 agot_scenario_ats.9021.t:0 "Muzaffer Aslan"

 agot_scenario_ats.9021.desc:0 "Nesiller boyunca çarpıcı bir zafer olarak anılacak şeyde, [rohanne.GetTitledFirstName]'in ordularını ezdim; [rohanne.GetHerHis] adamlarını Coldmoat'in dışında kana bulanmış bir yığın halinde bırakarak. Kalenin heybetli kapı kulesine yürürken, hanemin bir zamanlar inşa ettiği kadim duvarların her birini incelemek için zaman ayırarak, yüzüme geniş bir gülümseme yayılıyor. Webber sancağını yırtıp indirirken, beyaz örümcek esintide sallanarak yere süzülüyor; onarılmış chequy aslanını, gururlu yerine dönmüş halde görünce gülümsemem genişliyor.\n\nSonunda, hanemi onardım."

 agot_scenario_ats.9021.a:0 "Bent yırtılıp atılacak ve ben hükmedeceğim."

 agot_scenario_ats.9021.a.tt:0 "Coldmoat ve Standfast suyu paylaşacak"

 agot_scenario_ats.9022.t:0 "Muzaffer Aslan"

 agot_scenario_ats.9022.desc:0 "[rohanne.GetTitledFirstNamePossessive] tüm tehditlerine rağmen, bu dulun zehrinin gerçekten zayıf olduğunu kanıtladım. [rohanne.GetHerHis|U] adamları kırık ve kanlar içinde, Standfast'in dışındaki tarlalarda yatarken, kulem alınmamış duruyor. Tüm ihtimallere karşı kazandım ve kadim haneme yeni gurur ve görkem getirdim. Rohanne, aşağılayıcı bir barış anlaşması yapmak zorunda; Kızıl Dul'u zayıflatılmış, chequy aslanını her zamankinden güçlü bırakarak."

 agot_scenario_ats.9022.a:0 "Şu bendi yırt!"

 agot_scenario_ats.9022.a.tt:0 "Bendi yıkacaksın"

 agot_scenario_ats.9023.t:0 "Chequy Aslanının Sonu"

 agot_scenario_ats.9023.desc:0 "Standfast'in alınmasıyla, [rohanne.GetTitledFirstName] kuvvetlerimi kırdı ve hanemin adına sahip olduğu son kaleyi ele geçirdi. Artık topraksız, evsiz, umutsuz bir şövalyeyim.\n\nKeşke bu noktaya hiç gelmeseydim; fırsat varken geri adım atsaydım; şimdi harabe içinde kaldım."

 agot_scenario_ats.9023.a:0 "Hanem düştü."

 agot_scenario_ats.9023.a.tt:0 "Standfast'i kaybettin"

 agot_scenario_ats.9024.t:0 "Pençesiz Aslan"

 agot_scenario_ats.9024.desc:0 "Ordularımın yenilgisi ve topraklarımın yakılmasıyla, Evi Osgrey bir kez daha zayıf olduğunu kanıtladı. Hanemi hayal bile edemeyeceğimden fazla şerefsizleştirdim. Ailem harabe, topraklarım yok edilmiş ve siyasi konumum her zamankinden zayıf.\n\nArtık pençesiz bir aslanım ve bu dulun insafına kaldım."

 agot_scenario_ats.9024.a:0 "Bent kalacak ve başarısızlıklarımla yaşamak zorundayım."

 agot_scenario_ats.9024.a.tt:0 "Sıradakini bekleyeceksin"

 agot_scenario_ats.9030.t:0 "Ölü Bir Dul"

 agot_scenario_ats.9030.desc:0 "[rohanne.GetFullName]'in ölümüyle, bent çatışması şimdilik bitti. Coldmoat Leydisi'nin kısa boylu siluetinin gölgesinde gömülüşünü görmeye üzülüyorum.\n\nBu çatışmayla birlikte, Egg ve ben burada kalıp çalışmayı ya da daha yeşil otlaklara gitmeyi seçmekte özgürüz. Her halükarda, çitler bekliyor."

 agot_scenario_ats.9030.a:0 "Dul'a bir veda."

 agot_scenario_ats.9030.a.tt:0 "Sözleşmelere geri döneceksin"

 agot_scenario_ats.9031.t:0 "Son Damalı Aslan"

 agot_scenario_ats.9031.desc:0 "Ser [eustace.GetFirstName]'in ölümüyle, Egg ve ben kendimizi bir kez daha bir efendinin hizmeti olmadan buluyoruz. Görünüşe göre yeniden yolculuk etmenin ve Egg'i dünyanın daha fazlasını görmeye götürmenin zamanı.\n\nSon chequy aslanı gitmiş olabilir, ama çitler bizi her zaman bekler."

 agot_scenario_ats.9031.a:0 "Elveda, damalı aslan."

 agot_scenario_ats.9031.a.tt:0 "Sözleşmelere geri döneceksin"

 agot_scenario_ats.9032.t:0 "Ateş ve Kılıç"

 agot_scenario_ats.9032.desc:0 "[rohanne.GetFullName] ve Ser [eustace.GetFirstName] artık savaşta! Hizmet yeminlerimiz, Egg ve benim Ser [eustace.GetFirstNameNoTooltip]'e katılmamızı ve [eustace.GetHerHis] yanında savaşmamızı gerektiriyor; [eustace.GetSheHe] de bana komuta etmem için birlikler teklif etti; ama Egg'i riske atmak zor bir seçim.\n\nSavaş kolay bir şey değil ve çok yetenekli bir yaveri bile savaşa götürmek tehlikeli olabilir; yardım sağlayıp sağlamayacağımı dikkatle seçmeliyim."

 agot_scenario_ats.9032.a:0 "Chequy aslanı için!"

 agot_scenario_ats.9032.a.tt:0 "[eustace.GetNameNoTooltip] tarafında birliklere liderlik edeceksin"

 agot_scenario_ats.9032.b:0 "Buna karışamam, şimdi değil."

 agot_scenario_ats.9032.b.tt:0 "Ser [eustace.GetFirstNameNoTooltip] tarafına katılmayı reddedeceksin"

