l_english:

 agot_birth_events.0003.t:0 "Ölümün Terazisi"

 agot_birth_events.0003.desc:0 ""Bir itiş daha, [ROOT.Char.GetLadyLord], bir itiş daha! Bebek neredeyse çıktı!" Son bir kez daha bastırırken dudaklarımdan bir çığlık kopuyor. Acı her yerde, çok fazla, dayanılmaz — ve sonra her şey bitmiş gibi görünüyor.... Başardım.\n\n"Çocuğum iyi mi?!" Kendi sesimi zar zor tanıyorum. "Bu... Bir [child.Custom('GirlBoy')] mi?"\n\nEbe bana cevap vermiyor, bana bakmıyor bile. Hayır, gözleri yalnızca kollarındaki hareketsiz bohçada."

 agot_birth_events.0003.a:0 "Neden... Neden nefes almıyor?! #EMP Bir şey yapın!#!."

 agot_birth_events.0004.t:0 "Ölümün Terazisi"

 agot_birth_events.0004.desc:0 "Ebe sonunda doğum odasından çıkıyor, yüzü solgun ve bana yüzüne bakmayı reddediyor.\n\n"Çok üzgünüm, [ROOT.Char.GetLadyLord|U]. Çocuk... şekilsiz doğdu." Tonu her şeyi anlatıyor. Ölüm kokusunun asılı olduğu odaya giriyorum ve [mother.GetFirstNameNoTooltip] göğsünde küçük, hareketsiz bir yaratık tutuyor. Pullu derisi ve körelmiş kanatları, [mother.GetFirstNameNoTooltip]'in [mother.GetHerHim] parmaklarıyla okşadığı saçlar olmasa, onu insan olarak tanınmaz kılardı.\n\n[child.Custom('GetDaughterSon')] bir canavar olarak doğdu."

 agot_birth_events.0004.a:0 "Ne büyük trajedi."

 agot_birth_events.0005.t:0 "Bir Canavar"

 agot_birth_events.0005.desc:0 "Acı #bold dayanılmaz#!.\n\nGözlerimi yaşartan nefesler ve bedenimi yırtan şimşek gibi sıcak parıltılar arasında, bir ejderha kükremesi duyduğuma yemin edebilirim. Sonra... #italic hiçbir şey#!.\n\nSessizlik odayı kucaklıyor, oradakileri nefesin bile bozmadığı bir durgunlukla kundaklıyor. En sonunda [second_adult.GetFirstNameNoTooltip] sessizliği deliyor: "[ROOT.Char.GetLadyLord|l], bebeğiniz... burada."\n\n[second_adult.GetHerHim]'in çocuğu — şayet [child.GetSheHe] gerçekten çocuksa — bana uzattığını fark etmemiştim bile.\n\nKollarımda huzursuzca kıpırdanan şey, #bold bir#! #NEG canavar#!."

 agot_birth_events.0005.a:0 "[child.Custom('GetDaughterSon')] bir ucubelik."

 agot_birth_events.0006.t:0 "Bir Canavar"

 agot_birth_events.0006.desc:0 "Yatak odasından gelen çığlıklar giderek daha çılgınlaşıyor, tıpkı hapsedildiği yerden tırnaklarıyla yol açan bir ejderha gibi havayı yırtıyor. #italic Zavallı, tatlı [mother.GetFirstNameNoTooltip]... Bu bebek onu öldürebilir...#!\n\nAni sessizlik duyularımı sarsıyor. #italic Bitti#!, diye düşünüyorum, ama içeri girmeden önce bir an duraklıyorum — kendimi toplamak, beni bekleyebileceklere karşı yüreğimi bilemek için.\n\nDoğumun vahşeti beni dehşete düşürüyor. Sevgili [mother.GetFirstNameNoTooltip], kanla ıslanmış önlüğüyle, bebeği göğsüne sıkıca bastırıyor. Ama yavrumu görmek için yaklaştığımda acı dolu bakışı beni korkutuyor.\n\nİşte, gözlerimin önünde, sıradan bir çocuk değil. İşte #bold bir canavar#!."

 agot_birth_events.0101.t:0 "Acı Tatlı Bir Varış"

 agot_birth_events.0101.desc:0 "Doğum uzun ve yıpratıcıydı, ama sonunda havayı delip geçen bir çocuk ağlayışı duyuyorum. İçimi rahatlık kaplıyor; ancak ebenin tuttuğu diğer bohçanın hareketsiz ve sessiz olduğunu fark edince yüreğim sarsılıyor. Çocuklarımdan biri yanımda, diğeri gün yüzünü görmeden ayrıldı."

 agot_birth_events.0101.a:0 "En azından [child.Custom('GetDaughterSon')] yaşıyor..."

 agot_birth_events.0102.t:0 "Acı Tatlı Bir Varış"

 agot_birth_events.0102.desc:0 "Doğum odasına adım atıyorum ve [mother.GetFirstName]'i yatağa oturmuş, gözleri yalnızca kollarındaki çocuğa odaklanmış halde buluyorum. Geldiğimde başını kaldırmıyor. Oda, tek bir kırılgan ağlayış dışında sessiz. Sonra ocak başında duran ebenin, korkunç biçimde hareketsiz duran başka bir bohça tuttuğunu fark ediyorum. O an her şeyi anlıyorum."

 agot_birth_events.0102.a:0 "Çocuklardan biri yaşıyor. Diğeri yaşamıyor."

 agot_birth_events.1000.t:0 "Kendi Hanem"

 agot_birth_events.1000.desc:0 "[child.GetName]'in doğumuyla, kendi hanemi kurma sorunu önümde beliriyor. Kardeşim [daemon.GetFirstNameNicknamed] kendi hanesini kurdu ve artık tüm erkekler Blackfyre adından korkmayı biliyor. Erkeklerin Bittersteel adını duyup aynı şekilde hissetmeleri gerekip gerekmediğine karar vermenin zamanı geldi."

 agot_birth_events.1000.a:0 "Bittersteel Hanesi doğsun!"

 agot_birth_events.1000.a_tt:0 "Bir yan hane kuracaksınız ve evliliğiniz babasoyluluğa geçecek"

 agot_birth_events.1000.b:0 "Hayır, mevcut düzen yeterli."

 agot_birth_events.2000.t:0 "Kendi Hanem"

 agot_birth_events.2000.desc:0 "Büyük Valyria çeliği kılıcı [vs_blackfyre.GetName], artık benim mülküm. Targaryen gücünün, hünerinin ve meşruiyetinin en üstün sembolüdür.\n\nAma ben Targaryen değilim. Bir piç olarak, [vs_blackfyre.GetNameNoTooltip] ile özdeşleşen mirası asla sahiplenemem. Ama belki de kendi hanemi kurabilirim; kılıcın tarihini ve statüsünü şüpheye yer bırakmayacak şekilde yansıtan bir hane..."

 agot_birth_events.2000.a:0 "Blackfyre Hanesi doğsun!"

 agot_birth_events.2000.a_tt:0 "Blackfyre Hanesi'ni kuracaksınız."

 agot_birth_events.2000.b:0 "Hayır, mevcut düzenimden memnunum."
