 agot_dragon_siege.scorpion_1_warning:0 "@warning_icon!#warning [sieging_location.GetName]'de Akrep Yerleşkeleri var; bu, [sieging_dragon.GetFirstName]'in kuşatmada kullanılma riskini artırır.#!"

 agot_dragon_siege.scorpion_2_warning:0 "@warning_icon!#warning [sieging_location.GetName]'de Ağır Akrep Yerleşkeleri var; bu, [sieging_dragon.GetFirstName]'in kuşatmada kullanılma riskini büyük ölçüde artırır.#!"

 agot_dragon_siege.ineffective:0 "Ejderhanızın saldırısı etkisiz kaldı."

 agot_dragon_siege.0001.t:0 "$agot_dragon_siege.title$ Yıkım Getirmek"

 agot_dragon_siege.0001.desc.a:0 "[sieging_location.GetName] savunmacıları, üzerlerine salabileceğimiz ejderha ateşinden korku içinde bekliyor; elimde"

 agot_dragon_siege.0001.desc.b:0 "[other_dragon_rider.GetTitledFirstName], [sieging_dragon.GetName]'in sırtında oturuyor."

 agot_dragon_siege.0001.desc.c:0 "emrime amade bir ejderha dizisi var."

 agot_dragon_siege.0001.desc.d:0 "[myself_current_dragon.GetName]'in de düşmanlarımı yakmaya hazır olduğunu hissediyorum."

 agot_dragon_siege.0001.desc.e:0 "[myself_current_dragon.GetName] burada olsa da, [myself_current_dragon.Custom('GetDragonSheHe')] bu kuşatmada etkili olacak kadar büyük değil."

 agot_dragon_siege.0001.a:0 "...doğru seçimdir."

 agot_dragon_siege.0001.a.tt:0 "[THIS.Var('si_selected_character').Char.GetTitledFirstName], [THIS.Var('si_selected_character').Char.GetHerHis] ejderhasıyla saldıracak."

 agot_dragon_siege.0001.b:0 "[other_dragon_rider.GetTitledFirstName] bana iyi hizmet edecek."

 agot_dragon_siege.0001.b.tt:0 "[other_dragon_rider.GetTitledFirstName], [sieging_dragon.GetName] ile saldıracak"

 agot_dragon_siege.0001.c:0 "Kendim yapacağım!"

 agot_dragon_siege.0001.c.tt:0 "[myself_sieging_dragonrider.GetNameOrMe|U], [myself_current_dragon.GetName] ile saldıracak"

 agot_dragon_siege.0001.d:0 "Bir düşününce..."

 agot_dragon_siege.0001.d.tt:0 "Ordunuz, ejderha desteği olmadan kuşatmaya devam edecek."

 agot_dragon_siege.0002.t:0 "$agot_dragon_siege.title$ Ejderhanın Komutanlığı"

 agot_dragon_siege.0002.desc:0 "[sieging_rider.GetTitledFirstName]'in yanına yürüyorum,"

 agot_dragon_siege.0002.desc_mounted:0 "[sieging_dragon.GetName]'in sırtına binmiş — şüphesiz çarpıcı bir manzara. [sieging_rider.GetHerHis] gözlerindeki ateş, [sieging_rider.GetHerHis] ejderhasınınkini yansıtıyor ve ikisi de düşmanın üzerine salınmak için can atıyor gibi.\n\n"

 agot_dragon_siege.0002.desc_land:0 "[sieging_dragon.GetName]'in koca gövdesinden pek uzakta durmuyor. [sieging_rider.GetSheHe|U], önümüzde dizilmiş kuvvetleri değerlendirerek tetikte görünüyor.\n\n"

 agot_dragon_siege.0002.desc_end.1:0 "[sieging_rider.GetHerHis] komutanı olarak, [sieging_rider.GetHerHim]'e hangi emirleri vereceğime karar vermeliyim; ancak bir ejderha binicisine gerçekten emir verilemez."

 agot_dragon_siege.0002.desc_end.2:0 "[commander.GetHerHis] müttefiki olarak [sieging_rider.GetSheHe] tavsiyelerimi dinleyebilir; ancak bir ejderha binicisine gerçekten emir verilemez."

 agot_dragon_siege.0002.a:0 "[sieging_rider.GetTitledFirstName] önce kolay hedeflere saldıracak, savunmalarını zayıflatacak."

 agot_dragon_siege.0002.d.f_third:0 "[sieging_rider.GetFirstNameNoTooltip], yerleşimi yerle bir edecek; ardında külden ve yıkımdan başka bir şey bırakmayacak."

 agot_dragon_siege.0002.e:0 "[siegeing_rider.GetTitledFirstName]'e [defending_dragonrider.GetFirstName]'e saldırmasını emret!"

 agot_dragon_siege.0002.f.f:0 "Kuşatmaya devam ediyorsun."

 agot_dragon_siege.0002.will_choose:0 "[sieging_rider.GetTitledFirstName] emrinizi değerlendirecek."

 agot_dragon_siege.0002.chance_success.order:0 "[sieging_rider.GetSheHe|U] emrinize uyuyor"

 agot_dragon_siege.0002.chance_success.advice:0 "[sieging_rider.GetSheHe|U] tavsiyenizi alıyor"

 agot_dragon_siege.0002.chance_failure.order:0 "[sieging_rider.GetSheHe|U] emrinizi görmezden geliyor"

 agot_dragon_siege.0002.chance_failure.advice:0 "[sieging_rider.GetSheHe|U] tavsiyenizi görmezden geliyor"

 agot_dragon_siege.0002.tt.2:0 "[sieging_rider.GetHerHim] hakkındaki görüşünüzü kaybedersiniz ve [sieging_rider.GetSheHe] prestij kaybedecek..."

 agot_dragon_siege.0003.t:0 "$agot_dragon_siege.title$ Ejderhanın Hizmeti"

 agot_dragon_siege.0003.desc.a:0 "[sieging_location.GetName] kuşatmasının önünde duruyoruz ve beklediğim gibi [commander.GetTitledFirstName], [sieging_dragon.GetName]'i kullanmamı emretti;"

 agot_dragon_siege.0003.desc.b:0 "[sieging_location.GetName] kuşatmasının önünde duruyoruz ve beklediğim gibi [commander.GetTitledFirstName], [sieging_dragon.GetName]'i kullanmamı öneriyor;"

 agot_dragon_siege.0003.desc.opt_a:0 "yerleşimin en zayıf noktalarına saldırıp savunmalarını zayıflatmamı. Bu ölçülü bir yaklaşım, ama yine de bir risk."

 agot_dragon_siege.0003.desc.opt_b:0 "bu kuşatmayı hızla sona erdirmek için [sieging_dragon.Custom('GetDragonHerHis')] alevlerini savunmaların üzerine salmamı. Böyle bir saldırı risksiz değildir, ama kesinlikle etkili olacaktır."

 agot_dragon_siege.0003.desc.opt_c:0 "sınırsızca saldırıp [sieging_dragon.GetNameNoTooltip]'i hem savunmalara hem de iç kaleye salmamı. Bu kesinlikle pek çok kişiyi öldürecek, ancak bunun için kapatmam gereken mesafe tehlikeli olabilir."

 agot_dragon_siege.0003.desc.opt_d:0 "yerleşimi yerle bir edip külden ve yıkımdan başka bir şey bırakmamı. Bu, beklediğimin ötesinde, ama gücüm dahilinde ve [commander.GetHerHis] emretme hakkı içinde."

 agot_dragon_siege.0003.desc.opt_e:0 "savunmacıların konuşlanmış ejderhaları ve binicileriyle yüzleşmemi. Bu, herhangi bir binicinin karşılaşabileceği en tehlikeli çatışmadır, ancak [commander.GetHerHis] emretme hakkı içindedir."

 agot_dragon_siege.0003.desc.c:0 "\n\nYanımda [sieging_dragon.GetNameNoTooltip] varken kimse bana gerçekten 'emir veremese' de, [sieging_rider.Custom2('RelationToMeShort', SCOPE.sC('commander'))]'in emirlerine uymakla yükümlüyüm."

 agot_dragon_siege.0003.a.1:0 "Emredildiği gibi yapacağım."

 agot_dragon_siege.0003.a.2:0 "Yeterince basiretli görünüyor."

 agot_dragon_siege.0003.a.toast.t:0 "[sieging_location.GetTitle.GetNameNoTierNoTooltip] Kuşatması"

 agot_dragon_siege.0003.a.toast.tt.order:0 "[sieging_rider.GetTitledFirstNameNoTooltip] emrinize uydu ve kuşatmada [sieging_dragon.GetFirstNameNoTooltip]'i kullandı."

 agot_dragon_siege.0003.a.toast.tt.advice:0 "[sieging_rider.GetTitledFirstNameNoTooltip] tavsiyenize uydu ve kuşatmada [sieging_dragon.GetFirstNameNoTooltip]'i kullandı."

 agot_dragon_siege.0003.b.1:0 "[sieging_dragon.GetFirstNameNoTooltip], senin emrindeki değil!"

 agot_dragon_siege.0003.b.2:0 "Ben [commander.GetHerHim]'den daha iyisini bilirim."

 agot_dragon_siege.0003.b.f.order:0 "[commander.GetTitledFirstNameNoTooltip]'in emrine itaatsizlik ediyorsunuz."

 agot_dragon_siege.0003.b.f.advice:0 "[commander.GetTitledFirstNamePossessiveNoTooltip] tavsiyesini görmezden geliyorsunuz."

 agot_dragon_siege.0003.b.tt:0 "[commander.GetTitledFirstNamePossessive] emrine bağlı olmadığımdan, [sieging_dragon.GetFirstName]'i kullanıp kullanmamaya kendim karar vermekte özgürüm."

 agot_dragon_siege.0003.b.toast.t:0 "[sieging_location.GetTitle.GetNameNoTierNoTooltip] Kuşatması"

 agot_dragon_siege.0003.b.toast.tt.order:0 "[sieging_rider.GetTitledFirstNameNoTooltip] emrinize karşı geldi ve kuşatmada [sieging_dragon.GetFirstNameNoTooltip]'i kullanmadı."

 agot_dragon_siege.0003.b.toast.tt.advice:0 "[sieging_rider.GetTitledFirstNameNoTooltip] tavsiyenizi görmezden geldi ve kuşatmada [sieging_dragon.GetFirstNameNoTooltip]'i kullanmadı."

 agot_dragon_siege.0003.c:0 "Ne?! Burada olmamalıyım! Hemen buradan gidiyorum!"

 agot_dragon_siege.0003.c.f:0 "[sieging_location.GetTitle.GetNameNoTierNoTooltip] kuşatmasını ejderhanızın sırtında terk ediyorsunuz..."

 agot_dragon_siege.0003.d:0 "Bir daha beni bu konuda rahatsız etme..."

 agot_dragon_siege.0003.d.f:0 "Emir de olsa tavsiye de olsa her zaman geri çevireceksiniz...sonuçlarına katlanın..."

 agot_dragon_siege.0100.t:0 "$agot_dragon_siege.title$ Ejderhanın Yaklaşımı"

 agot_dragon_siege.0100.desc_opening:0 "[sieging_location.GetName] surlarının önünde duruyorum, ejderham [sieging_dragon.GetName] yanımda. Adamlarımız yerleşimi kuşatmış durumda; savunmacılar içeride hapsolmuş, surlarının ardında büzüşüyorlar.\n\n"

 agot_dragon_siege.0100.desc_opening_third:0 "[sieging_location.GetName] surlarının önünde duruyorum; [sieging_rider.GetFirstName] ve [sieging_rider.GetHerHis] ejderhası [sieging_dragon.GetName] yanımda. Adamlarımız yerleşimi kuşatmış durumda; savunmacılar içeride hapsolmuş, surlarının ardında büzüşüyorlar.\n\n"

 agot_dragon_siege.0100.desc_asked_to_use:0 "[player.GetTitledFirstName]'den bir haberci geliyor. [player.GetSheHe], [sieging_location.GetTitle.GetNameNoTier] kuşatmasında ejderhamı kullanmamı istiyor.\n"

 agot_dragon_siege.0100.desc_none:0 "Yeterince zaman verilirse şüphesiz onları teslim olmaya zorlardık, ama hiçbir sur onları ejderha ateşinden koruyamaz. Risksiz değil, ama [sieging_dragon.GetNameNoTooltip]'e binip alevlerini kalenin üzerine salabilir ve bu kuşatmayı çok daha hızlı sona erdirebilirim."

 agot_dragon_siege.0100.desc_none_third:0 "Yeterince zaman verilirse şüphesiz onları teslim olmaya zorlardık, ama hiçbir sur onları ejderha ateşinden koruyamaz. Risksiz değil, ama [sieging_rider.GetFirstName]'i [sieging_dragon.GetNameNoTooltip] ile gönderip alevlerini kalenin üzerine saldırabilir ve bu kuşatmayı çok daha hızlı sona erdirebilirim."

 agot_dragon_siege.0100.desc_defender:0 "Yeterince zaman verilirse şüphesiz onları teslim olmaya zorlardık, ama hiçbir sur onları ejderha ateşinden koruyamaz. Ne yazık ki [defending_dragonrider.GetTitledFirstName] ve [defending_dragonrider.GetHerHis] ejderhası [defending_dragon.GetName] burada; şüphesiz bizi durdurmaya çalışacaklar. Saldıracaksam, önce onlarla yüzleşmeliyim."

 agot_dragon_siege.0100.desc_defender_third:0 "Yeterince zaman verilirse şüphesiz onları teslim olmaya zorlardık, ama hiçbir sur onları ejderha ateşinden koruyamaz. Ne yazık ki [defending_dragonrider.GetTitledFirstName] ve [defending_dragonrider.GetHerHis] ejderhası [defending_dragon.GetName] burada; şüphesiz bizi durdurmaya çalışacaklar. [sieging_rider.GetFirstName] saldıracaksa, önce onlarla yüzleşmeli."

 agot_dragon_siege.0100.desc_defenders:0 "Yeterince zaman verilirse şüphesiz onları teslim olmaya zorlardık, ama hiçbir sur onları ejderha ateşinden koruyamaz. Ne yazık ki [defending_dragonrider.GetTitledFirstName] ve [defending_dragonrider.GetHerHis] ejderhası [defending_dragon.GetName] burada; üstelik tek onlar değiller. Saldıracaksam, önce gökyüzündeki diğer tüm ejderhaları yenmeliyim."

 agot_dragon_siege.0100.desc_defenders_third:0 "Yeterince zaman verilirse şüphesiz onları teslim olmaya zorlardık, ama hiçbir sur onları ejderha ateşinden koruyamaz. Ne yazık ki [defending_dragonrider.GetTitledFirstName] ve [defending_dragonrider.GetHerHis] ejderhası [defending_dragon.GetName] burada; üstelik tek onlar değiller. [sieging_rider.GetFirstName] saldıracaksa, önce gökyüzündeki diğer tüm ejderhaları yenmeli."

 agot_dragon_siege.0100.desc_owned:0 "O surların içinde başka ejderhalar olsa da, binicileri olmadığına göre bizimle savaşmaları pek olası değil. Risksiz değil, ama [sieging_dragon.GetNameNoTooltip]'e binip alevlerini kalenin üzerine salabilir ve bu kuşatmayı çok daha hızlı sona erdirebilirim."

 agot_dragon_siege.0100.desc_owned_third:0 "O surların içinde başka ejderhalar olsa da, binicileri olmadığına göre bizimle savaşmaları pek olası değil. Risksiz değil, ama [sieging_rider.GetFirstName], [sieging_dragon.GetNameNoTooltip]'e binip [sieging_dragon.Custom('GetDragonHerHis')] alevlerini kalenin üzerine salabilir ve bu kuşatmayı çok daha hızlı sona erdirebilir."

 agot_dragon_siege.0100.desc_owned_single:0 "[owned_dragon_present.GetName] içeride olsa da, [owned_dragon_present.Custom('GetDragonSheHe')] binicisiz olduğundan, [owned_dragon_present.Custom('GetDragonSheHe')]'in etkili bir direniş göstermesi pek olası değil. Risksiz değil, ama [sieging_dragon.GetNameNoTooltip]'e binip [sieging_dragon.Custom('GetDragonSheHe')] alevlerini kalenin üzerine salabilir ve bu kuşatmayı çok daha hızlı sona erdirebilirim."

 agot_dragon_siege.0100.desc_owned_single_third:0 "[owned_dragon_present.GetName] içeride olsa da, [owned_dragon_present.Custom('GetDragonSheHe')] binicisiz olduğundan, [owned_dragon_present.Custom('GetDragonSheHe')]'in etkili bir direniş göstermesi pek olası değil. Risksiz değil, ama [sieging_rider.GetFirstName], [sieging_dragon.GetNameNoTooltip]'e binip [sieging_dragon.Custom('GetDragonSheHe')] alevlerini kalenin üzerine salabilir ve bu kuşatmayı çok daha hızlı sona erdirebilir."

 agot_dragon_siege.0100.a:0 "Önce kolay hedeflere saldıracağız, savunmalarını zayıflatacağız."

 agot_dragon_siege.0100.a.f:0 "En az riskli yaklaşım: [sieging_rider.GetTitledFirstNameOrMeNoTooltip], yerleşimin en zayıf noktalarına saldırıp savunmalarını zayıflatmak için [sieging_dragon.GetNameNoTooltip]'e binecek."

 agot_dragon_siege.0100.b:0 "O surlar onları ejderha ateşinden korumayacak."

 agot_dragon_siege.0100.b.f:0 "[sieging_rider.GetTitledFirstNameOrMeNoTooltip|U], bu kuşatmayı bir zafer alevinde sona erdirmeye çalışarak [sieging_dragon.Custom('GetDragonHerHis')] alevlerini savunmaların üzerine salmak için [sieging_dragon.GetNameNoTooltip]'e binecek."

 agot_dragon_siege.0100.c:0 "Merhamet yok — kale #N yanacak#!."

 agot_dragon_siege.0100.c.f:0 "[sieging_rider.GetTitledFirstNameOrMeNoTooltip|U], [sieging_dragon.GetNameNoTooltip]'i hem savunmaların hem de iç kalenin üzerine salacak; yerleşime ve savunmacılarına büyük hasar verecek."

 agot_dragon_siege.0100.c.tt:0 "#N [sieging_location.GetNameNoTooltip] içindeki pek çok kişi yanacak ya da ölecek.#!"

 agot_dragon_siege.0100.c.tt.family:0 "[family_scope.GetFirstName] #X yaralanabilir#! ya da #X ölebilir#!!"

 agot_dragon_siege.0100.d:0 "#N;bold Külden ve yıkımdan başka hiçbir şey kalmayacak!#!"

 agot_dragon_siege.0100.d.f:0 "Yerleşimi yerle bir edeceksiniz; ardınızda külden ve yıkımdan başka bir şey bırakmayacaksınız."

 agot_dragon_siege.0100.d.f_third:0 "[sieging_rider.GetTitledFirstNameOrMeNoTooltip|U], yerleşimi yerle bir edecek; [sieging_rider.GetHerHis] ardında külden ve yıkımdan başka bir şey bırakmayacak."

 agot_dragon_siege.0100.d.tt:0 "#N [sieging_location.GetNameNoTooltip] içindeki herkes öldürülecek.#!"

 agot_dragon_siege.0100.d.tt.family:0 "[family_scope.GetFirstName] #X öldürülecek#!!"

 agot_dragon_siege.0100.e:0 "[defending_dragonrider.GetFirstName]! Dışarı çık ve öl!"

 agot_dragon_siege.0100.e.f:0 "[defending_dragonrider.GetTitledFirstNameNoTooltip] ve [defending_dragon.GetFirstNameNoTooltip]'i [sieging_rider.GetFirstNameOrMeNoTooltip] ile yüzleşmeye zorlayacaksınız."

 agot_dragon_siege.0100.f:0 "Hayır, kuşatmayı eski usulle yapacağız."

 agot_dragon_siege.0100.f.f:0 "Kuşatmaya devam ediyorsun."

 agot_dragon_siege.0101.t:0 "$agot_dragon_siege.title$ Ejderha Ateşi!"

 agot_dragon_siege.0101.intro:0 "[location.GetName]'in mazgallarında volta atarken durumumun kırılganlığını görmezden gelemem — düşman askerleri kalemi kuşatmış durumda ve uzun süren bir kuşatma kaçınılmaz görünüyor.\n\n"

 agot_dragon_siege.0101.bigboi:0 "Güneş gökyüzünde tepedeyken onu duyuyorum: Delici bir kükreme, ardından bir rüzgâr patlaması... [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')] üzerinde devasa bir fırtınanın çarpışı gibi bir öfke, kalemin çevresindeki [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]'i sarsıyor. Bir zamanlar parlak olan güneşin üzerinde dev bir gölge süzülüyor, onu karartıyor... O karanlık uçurum üzerime çökerken kendimi ona bakarken buluyorum: [sieging_dragon.GetFirstNameNicknamed], #XB ejderhanın koca canavarı#!!\n\n"

 agot_dragon_siege.0101.option1:0 "Tepede yoğun bir bulut örtüsü asılı. Kalemin çevresindeki [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')] üzerinde bakışlarımı gezdirdiğimde, [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] üzerinde bir biçim havalanırken tiz bir kükreme duyuyorum. Kanatlarını açıp canavarı göğe doğru iterken, yüreğimde bir sızıyla yaklaşan kıyametime bakıyorum. İşte geliyor [sieging_dragon.GetFirstNameNicknamed], düşmanımın #X korkutucu ejderhası#!.\n\n"

 agot_dragon_siege.0101.option2:0 "Güneş batmaya başlarken onu duyuyorum: Kalemi saran [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]'in ötesinden, uzaktan gelen gümbürdeyen bir kükreme. Ejderha yukarı fırlıyor, bir kılıç gibi havayı yarıyor; ağzından parlak ejderha alevi tüyleri saçılıyor. Kıyametimle yüzleşirken gökyüzü kızıla dönüyor: [sieging_dragon.GetFirstNameNicknamed|U] ve #X [sieging_dragon.Custom('GetDragonHerHis')] alevleri#! kuşatmaya çağrılmış.\n\n"

 agot_dragon_siege.0101.option3:0 "Titrek bir çığlık gergin sessizliği yarıyor ve [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')]'in ötesinde baş düşmanımı net biçimde görebiliyorum: [sieging_dragon.GetFirstNameNicknamed], #X iğrenç ejderha#!, adamlarıma ve bana ejderha ateşi yağdırmaya hazır halde gökyüzüne çıkmış.\n\n"

 agot_dragon_siege.0101.option4:0 "Sessizlik ölüm gibi havada asılı. Uzakta, [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')] içindeki bir ağaçkakanın derin titremesi, garnizonumun gergin soluğunun altında kesik kesik bir ritim sunuyor. [sieging_dragon.GetFirstNameNicknamed] bir alev ve umutsuzluk kasırgası olarak göğe fırladığında, #X sonumu getirmek#! için geldiğinde sessizlik cam gibi kırılıyor.\n\n"

 agot_dragon_siege.0101.outro:0 "Etrafımda bir ateş halısı gibi sıcaklık açılmadan önce yalnızca bir dua mırıldanacak vaktim var. Ejderha ateşinin üzerime yaklaştığını hissederken, adamlarım çevremde eriyor, anında küle ve kuruma dönüşüyorlar."

 agot_dragon_siege.0101.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_dragon_siege.0101.a.f:0 "[sieging_dragon.GetNameNoTooltip] tarafından yakılıyorsunuz."

 agot_dragon_siege.0102.t:0 "$agot_dragon_siege.title$ Ejderha Ateşiyle Mahkûm!"

 agot_dragon_siege.0102.outro:0 "Etrafımda bir ateş halısı gibi sıcaklık açılmadan önce yalnızca bir dua mırıldanacak vaktim var. Son nefesime tutunurken, adamlarım çevremde eriyor, anında küle ve kuruma dönüşüyorlar."

 agot_dragon_siege.0102.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_dragon_siege.0102.a.f:0 "[sieging_dragon.GetNameNoTooltip] tarafından yakılarak öldürülüyorsunuz."

 agot_dragon_siege.0103.t:0 "$agot_dragon_siege.title$ Şanslı Bir Atış"

 agot_dragon_siege.0103.desc.minor:0 "[sieging_dragon.GetName] ve ben [sieging_location.GetName]'e doğru uçuyoruz; ilk hedefimiz — savunmacıların aptalca surların dışında bıraktığı bir erzak arabası — altımızda akıp giden manzaranın ortasında giderek yaklaşıyor. Üzerine [sieging_dragon.Custom('GetDragonHerHis')] alevlerini salıyorum; araba hızla alevlere boğuluyor, savunmacıların erzakları duman olup gidiyor. Saldırılarımızın yalnızca ilki!\n\nBir kule, bir nöbetçi kulesi ve dışarıdaki bir ahır, [sieging_dragon.GetFirstNamePossessiveNoTooltip] alevlerine teslim oluyor; ancak alttaki yanan ahırdan yükselirken ani bir çarpışma ve böğrüme saplanan keskin bir acı hissediyorum.\n\nAcı içinde bağırıyorum; aşağı baktığımda karnıma saplanmış oku görüyorum, kızıl leke gövdemde yayılıyor. Bir kükremeyle [sieging_dragon.GetNameNoTooltip] dönüp hatlarımıza yöneliyor; beni vurmayı başaran şanslı okçu, uçup giderken kaleye geri çekilirken zar zor görüyorum."

 agot_dragon_siege.0103.desc:0 "[sieging_location.GetName]'in yanan külleri, [sieging_dragon.GetName]'in geniş kanatlarının çevresinde savruluyor; efsaneden çıkmış bir iblis gibi sürüyoruz, ardımızda ölüm getiriyoruz.\n\nAltımızda savunmacıların toplandığı bir avlu var; getirdiğimiz yıkımı durdurmak için saf bir girişim. Topuklarımı çevirerek [sieging_dragon.GetFirstNameNoTooltip]'i avlunun üzerinde süzülmeye yönlendiriyorum ve aşağıdaki çaresiz zavallıların üzerine ejderha alevi yağdırıyorum.\n\nAma kudretli varlığımızın altında adamları yakarken böğrümde ani bir sıcaklık hissediyorum; acıya dönüşürken bağırıyorum. Aşağı baktığımda karnıma saplanmış oku görüyorum; yukarı baktığımda beni surlardan vurmayı başaran şanslı okçuyu görüyorum. Bir kükremeyle onu da kül ediyoruz, ama artık burada kalamam; [sieging_dragon.GetFirstNameNoTooltip]'i döndürüp hatlarımıza yöneliyorum."

 agot_dragon_siege.0103.a:0 "En azından biraz hasar verdik!"

 agot_dragon_siege.0103.a.f:0 "Geri çekilmek zorunda kaldın ama yapmayı hedeflediğin hasarı vermeden önce değil."

 agot_dragon_siege.0104.t:0 "$agot_dragon_siege.title$ Kurbanlık Mızrak"

 agot_dragon_siege.0104.desc.minor:0 "[sieging_location.GetName] üzerindeki yoklama saldırılarımız başarılı oldu; savunmacılar ya yanıyor ya da dağınık halde. Son hedef bir kule; [sieging_dragon.GetName]'i alevlerini onun üzerine salması için yönlendiriyorum.\n\nAncak [sieging_dragon.GetName] tam bunu yaparken — ısı taşı bükerken — yalnız bir adamın kulenin tepesinden bir mızrak savurduğunu görüyorum; mızrak, kulenin altından çökmekte olduğu anda elinden çıkıyor.\n\nHiç şüphesiz kıyametine doğru düşüyor olsa da, mızrağı hedefini buldu. Ne kadar kaçınmaya çalışsak da mızrak [sieging_dragon.GetNameNoTooltip]'in böğrüne saplanıyor; [sieging_dragon.Custom('GetDragonSheHe')] öfke ve ıstırabın karışımı bir kükremeyle geri çekilirken [sieging_dragon.Custom('GetDragonHerHis')] acısının gücünü hissediyorum."

 agot_dragon_siege.0104.desc:0 "[sieging_location.GetName]'in sokağı bir ateş nehri; savunmacılar yere inen biçimimizin önünde dağılıyor. Bir bina daha alev alıyor; savunmacılar kaçarken, okçular toparlanamadan onları kovalaması için [sieging_dragon.GetName]'i yönlendiriyorum.\n\n[sieging_dragon.Custom('GetDragonHerHis')|U] koca gövdesi, kaçan okçuların peşinden şaşırtıcı bir hızla sokakta ilerliyor; ancak bir sokağı geçerken [sieging_dragon.Custom('GetDragonSheHe')] acı içinde kükriyor! Aşağı baktığımda [sieging_dragon.Custom('GetDragonHerHis')] böğrüne saplanmış bir mızrak görüyorum; o sokakta büzüşüyor olması gereken yalnız savunmacı, bize saldırmak için cesaretini toplamış!\n\nTalimat beklemeden [sieging_dragon.GetFirstNameNoTooltip] dönüp adamı küle çeviriyor, ama [sieging_dragon.Custom('GetDragonHerHis')] acısını hissediyorum ve [sieging_dragon.Custom('GetDragonHerHim')]'e yükselmesini buyuruyorum."

 agot_dragon_siege.0104.a:0 "Geri dön [sieging_dragon.GetFirstNameNoTooltip]! Yaralarınla ilgilenmeliyiz!"

 agot_dragon_siege.0104.a.f:0 "Geri çekilmek zorunda kaldın ama yapmayı hedeflediğin hasarı vermeden önce değil."

 agot_dragon_siege.0105.t:0 "$agot_dragon_siege.title$ Mahkûm Cesareti"

 agot_dragon_siege.0105.desc:0 "[sieging_location.GetName] savunmacıları bizi oklar ve mızraklarla taciz ediyor; adamlar alevlerimizden kaçınmak için ellerinden geldiğince daha güçlü tahkimatlara dalıyor. Sonunda bir açık görüyorum: aptalca bir araya toplanan bir okçu grubu. Yalnızca küçük bir kemerli geçidin ardında siper almışlar; [sieging_dragon.GetName]'i dalıp saldırması için yönlendiriyorum!\n\nBunu yaparken tuzağı çok geç fark ediyorum. Kemerli geçidin üzerinde, bitişik çatıda bir grup savunmacı bekliyor; biz aşağı süzülürken onlar [sieging_dragon.GetFirstNameNoTooltip]'e doğru #italic atlıyorlar#!!\n\nBirçoğu ıskalayıp aşağıdaki taşta parçalansa da, bazı cesur aptallar tutunuyor; aşağı yönlü hamleleri hedefini buluyor ve adamları mızrak ve kılıçlarıyla [sieging_dragon.GetFirstNameNoTooltip]'in üzerine çakıyor. [sieging_dragon.GetFirstNameNoTooltip] ıstırap içinde kükreyip yay çizerek yükseliyor, saldırganların çoğunu üzerinden atıyor ve gökyüzüne yükseliyor; kalanlar aşağıda kıyametlerine yuvarlanıyor."

 agot_dragon_siege.0105.a:0 "O cesur piçler!"

 agot_dragon_siege.0105.a.f:0 "[sieging_dragon.GetFirstNameNoTooltip] ağır yaralandı ve geri çekilmek zorunda kaldınız; yine de yapmayı hedeflediğiniz hasarı vermeden değil."

 agot_dragon_siege.0106.t:0 "$agot_dragon_siege.title$ Bin Kese"

 agot_dragon_siege.0106.desc:0 "[sieging_location.GetName]'e yönelik saldırı iyi gidiyor; yapısal yerleşkelerinin çoğu az bir zorluk ve direnişle çöküyor. Bu bölgenin iyi savunulduğunu sanmıştım, ama görünen o ki savunmacılar, bize inandırmak istedikleri kadar cesur değiller.\n\nAncak sıradaki kilit hedefimize — büyük bir kışlaya — saldırdığımızda, kayıp savunmacıların nerede olduğunu görüyorum. Her pencereden oklar fırlıyor, hepsi tam bana nişanlı!\n\n[sieging_dragon.GetFirstName], [sieging_dragon.Custom('GetDragonHerHis')] kanatlarını beni korumak için kaldırsa da, birçoğu hedefini buluyor ve okların etimin derinliklerine gömüldüğünü hissediyorum. Acı içinde bağırıyorum; gökyüzüne yükselirken, göğsümden kan boşalırken önümde bulutlar silikleşiyor ve bu, söylenmemiş son bir emir oluyor."

 agot_dragon_siege.0106.a:0 "Bir hekime ihtiyacım var!"

 agot_dragon_siege.0106.a.f:0 "Ağır yaralandınız ve geri çekilmek zorunda kaldınız; ancak yapmayı hedeflediğiniz hasarı vermeden değil."

 agot_dragon_siege.0106.b:0 "Ben...ben yapmadım...ben..."

 agot_dragon_siege.0106.b.f:0 "[sieging_dragon.GetNameNoTooltip]'in sırtında kan kaybından ölüyorsunuz ve bedeniniz hatlarınıza geri getiriliyor. Yapmayı hedeflediğiniz hasar verildi, ama büyük bir bedelle."

 agot_dragon_siege.0107.t:0 "$agot_dragon_siege.title$ Yabancının Mızrağı"

 agot_dragon_siege.0107.desc:0 "[sieging_location.GetName] savunmacıları makul bir direniş gösteriyor, ama elbette hiçbiri [sieging_dragon.GetName] ile bana karşı koyamaz. Savunmalarını kalenin bir ucundan diğerine yakıyoruz; önce silah ve adam barındırabilecek olanlara, ardından adamlarımızın girişini engelleyecek olanlara yöneliyoruz.\n\nBunların sonuncusuna dönerken, at üstünde yalnız bir adam — alevlerden kaçmayı bir şekilde başarmış — elinde bize mızrak savuracakmış gibi bir mızrakla bize doğru sürüyor! Cesaret mi budalalık mı, ayırt edemiyorum; ancak [sieging_dragon.GetNameNoTooltip]'i dönüp onunla yüzleşmesi için yönlendirdiğimde, adamın mızrağının elinden fırlayıp tam göğsüme saplandığını görünce şaşırıyorum! Akciğerlerimdeki hava boşalıyor, [sieging_dragon.GetFirstNameNoTooltip] ile birlikte ulumayı bile başaramıyorum.\n\n[sieging_dragon.GetNameNoTooltip] gökyüzüne yükselirken sarsıntının farkındayım; gevşek bedenim bağlanmış, başım arkaya savrulmuş, gökyüzüne bakıyor. Yükselen dumanın damlayan korları çok... çok..."

 agot_dragon_siege.0107.a:0 "Çok güzel..."

 agot_dragon_siege.0107.a.f:0 "[sieging_dragon.GetNameNoTooltip]'e bağlanmış bedeniniz hatlarınıza geri getiriliyor; hasar verildi, ama büyük bir bedelle."

 agot_dragon_siege.0108.t:0 "$agot_dragon_siege.title$ Akrebin Vuruşu"

 agot_dragon_siege.0108.desc:0 "Bir ejderhanın sırtında alçakgönüllülüğü tatmak nadir bir andır. Çok az kişi bu duyguyu bilmiştir. Kuşatmada [sieging_dragon.GetName]'i kullanmanın bir risk olduğunu aklen bilmeme rağmen, savunmacıların kıt savunmalarıyla bize vurmayı umabileceklerini düşünmemiştim. Yanılmışım.\n\nBir savunma yapısını daha küle çevirmek için aşağı süzülürken bir metal parıltısı görüyorum; surlardan bir cıvata fırlıyor ve [sieging_dragon.GetNameNoTooltip]'in böğrüne saplanıyor. [sieging_dragon.GetFirstNameNoTooltip] acı içinde kükriyor, geri sıçrıyor ve beni [sieging_dragon.Custom('GetDragonHerHis')] sırtından neredeyse fırlatıyor."

 agot_dragon_siege.0108.a:0 "Geri çekilmeliyiz!"

 agot_dragon_siege.0108.a.f:0 "Geri çekilmek zorunda kaldınız; saldırılarınız etkisiz kaldı ve [sieging_dragon.GetFirstNameNoTooltip] ağır yaralandı."

 agot_dragon_siege.0109.t:0 "$agot_dragon_siege.title$ Akrebin Sokması"

 agot_dragon_siege.0109.desc:0 "Eski Valyrialılar ejderhalarına tanrıların adını verirdi ve nedenini anlamak kolay. [sieging_dragon.GetName], ateş ve ölüm tanrısıdır; ben de onun seçilmişiyim. Ancak eski tanrılar yeni inancın elleriyle devrildiği gibi, en büyük silahlar da en küçüklerin elinden düşebilir.\n\nSurlardan gelen metal yağmuru bir fırtına gibi. [sieging_dragon.GetNameNoTooltip]'in [sieging_dragon.Custom('GetDragonHerHis')] kanat eklemi arasından bir akrep cıvatasıyla vurulduğunu görüyorum; boğazına bir başka cıvata çarparken gırtlaktan gelen acı çığlığı kesiliyor. [sieging_dragon.Custom('GetDragonHerHis')] yaralarından kan fışkırıyor — ve uçtuğumuz yerde artık düşüyoruz; yer bize doğru hızla yaklaşıyor."

 agot_dragon_siege.0109.a:0 "Hayır, [sieging_dragon.GetFirstNameNoTooltip]! Uç!"

 agot_dragon_siege.0109.a.f:0 "Siz ve [sieging_dragon.GetNameNoTooltip] ikiniz de öldürülüyorsunuz; parçalanmış bedeniniz, [sieging_dragon.GetFirstNamePossessiveNoTooltip] kendi enkazının arasında bulunuyor."

 agot_dragon_siege.0110.t:0 "$agot_dragon_siege.title$ Ejderhanın Savunması"

 agot_dragon_siege.0110.desc:0 "[sieging_location.GetName]'in sadık savunmacıları, saldırganlarımızı uzak tutmakta zorlanıyor ve görünen o ki hayal kırıklığı sonunda taştı. [sieging_dragonrider.GetTitledFirstName] ve [sieging_dragon.GetName]'in hatlardan yükselmeye başladığını görüyorum ve ne geleceğini biliyorum. Başka seçeneğim yok — şimdi zamanı!\n\nYa [defending_dragon.GetName]'e binip gökyüzünde onlarla yüzleşeceğim, ya da kaçıp savunmacıları kaderine bırakacağım."

 agot_dragon_siege.0110.a:0 "Onlarla yüzleşeceğim!"

 agot_dragon_siege.0110.a.f:0 "[defending_dragon.GetNameNoTooltip]'e biniyor ve gökyüzünde saldırganlarınızla yüzleşiyorsunuz."

 agot_dragon_siege.0110.b:0 "Uç [defending_dragon.GetFirstNameNoTooltip]! Kaçmalıyız!"

 agot_dragon_siege.0110.b.f:0 "Savaş alanından kaçıyor, savunmacıları kaderine bırakıyorsunuz."

 agot_dragon_siege.notify_sieger_of_fleeing.t:0 "[defending_dragonrider.GetTitledFirstNameNoTooltip] kaçıyor!"

 agot_dragon_siege.notify_sieger_of_fleeing.tt:0 "[defending_dragonrider.GetTitledFirstName], sizinle yüzleşmek yerine [defending_dragon.GetFirstName] ile kaçtı."

 agot_dragon_siege.0112.t:0 "$agot_dragon_siege.title$ Ejderhanın Uçuşu"

 agot_dragon_siege.0112.desc:0 "[sieging_rider.GetTitledFirstName] ve [sieging_dragon.GetFirstName] yıkımlarını gerçekleştirdi; ancak şimdi bana söylenen, bedelin önceden bilinenden daha da büyük olduğu.\n\nEjderham [fleeing_dragon.GetName] — kuşatmanın gürültüsünden mi, [sieging_dragon.GetNameNoTooltip]'in varlığından mı korktuysa — savaş alanından kaçtı!\n\nBana söylenen, [fleeing_dragon.Custom('GetDragonSheHe')]'in [new_location.GetBaseName]'de in kurarken görüldüğü."

 agot_dragon_siege.0112.a:0 "Bizim için büyük bir kayıp..."

 agot_dragon_siege.0112.a.f:0 "Ejderhanız vahşileşti. [fleeing_dragon.GetFirstNameNoTooltip]'i hâlâ geri kazanabilirsiniz, ancak [fleeing_dragon.Custom('GetDragonSheHe')] artık sizin olmadığına göre bu daha zor olabilir."

 agot_dragon_siege.0113.t:0 "$agot_dragon_siege.title$ Ejderhanın Varışı"

 agot_dragon_siege.0113.desc:0 "Yakınlarda, [sieging_location.GetName] kuşatması olaylarının büyük bir felakete sahne olduğunu duyuyorum. [sieging_rider.GetTitledFirstName] ve [sieging_dragon.GetName], savunmacıların üzerine yıkım saldı; ancak benim için daha yakıcı olan, [fleeing_dragon.GetFirstName]'in varışı!\n\nBir zamanlar aynı yerleşimde tutulan [fleeing_dragon.Custom('GetDragonSheHe')]'in, kendi isteğiyle kuşatmayı terk etmiş gibi göründüğü söyleniyor; izcilerim, canavarın [new_location.GetBaseName]'de in kurarken görüldüğünü bildiriyor."

 agot_dragon_siege.0113.a:0 "Bir fırsat mı, yoksa bir tehdit mi?"

 agot_dragon_siege.0113.a.f:0 "[new_location.GetBaseName]'e vahşi bir ejderha ulaştı; onu kendinize ait olarak sahiplenmeniz için bir fırsat olabilir. Elbette vahşi ejderhalar tehlikeli komşulardır..."

 agot_dragon_siege.dragon_rider_third.t:0 "[sieging_location.GetTitle.GetNameNoTierNoTooltip] kuşatması"

 agot_dragon_siege.dragon_rider_third_arrow.tt:0 "[sieging_rider.GetName] başıboş bir okla vuruldu!"

 agot_dragon_siege.dragon_rider_third_spear.tt:0 "[sieging_dragon.GetName] bir mızrakla vuruldu!"

 agot_dragon_siege.dragon_rider_third_soldiers.tt:0 "[sieging_rider.GetName] ve [sieging_dragon.GetName], koordineli bir asker grubu tarafından saldırıya uğradı!"

 agot_dragon_siege.dragon_rider_third_many_arrows.tt:0 "[sieging_rider.GetName] pek çok okla vuruldu!"

 agot_dragon_siege.dragon_rider_third_spear_death.tt:0 "[sieging_rider.GetName] fırlatılan bir mızrakla öldürüldü!"

 agot_dragon_siege.dragon_rider_third_scorpion.tt:0 "[sieging_dragon.GetName] bir akrep tarafından ağır yaralandı!"

 agot_dragon_siege.dragon_rider_third_scorpion_death.tt:0 "[sieging_dragon.GetName] bir akrep tarafından öldürüldü!"
