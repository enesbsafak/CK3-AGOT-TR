 agot_dragon_siege.gui_tt_check:0 "Ejderhanızı kuşatma için günde yalnızca bir kez kullanabilirsiniz."

 agot_dragon_siege.gui_tt_commander_check:0 "Bir ejderha, bir yerleşime karşı yalnızca üç ayda bir kullanılabilir. Son saldırgan [sieging_location.GetTitle.MakeScope.Var('used_dragon_sieged_today').Char.GetName] idi."

 agot_dragon_siege.gui_tt_no_valid_rider:0 "Kuşatmada geçerli bir ejderha binicisi bulunmuyor."

