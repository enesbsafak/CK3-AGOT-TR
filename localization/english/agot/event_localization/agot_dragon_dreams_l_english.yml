l_english:

 agot_dragon_dreams.0001.intro_own_dream:0 "Uykumdan irkilerek uyanıyorum; çılgınca rüyamın ayrıntılarını hatırlamaya çalışırken şakaklarımı kavrıyorum.\n"

 agot_dragon_dreams.0001.intro_visit:0 "[dragon_dreamer.GetFirstNameNoTooltip], gecenin ortasında solgun ve terli bir halde odamda beliriyor.\n\n#italic "[ROOT.Char.GetFirstNameNoTooltip], bir rüya gördüm..."#!"

 agot_dragon_dreams.0001.intro_letter:0 "Hizmetkârlardan biri, güne hazırlanırken sabahın erken saatlerinde beni buluyor. "Affedersiniz, [dragon_dreamer.GetTitledFirstName]'den bir kuzgun geldi. Size bir mektubu var ve üzerinde, en kısa sürede görmenizin acil olduğunu belirten bir not eklenmiş."\n\n#italic "[ROOT.Char.GetFirstNameNoTooltip], bir rüya gördüm... #!""

 agot_dragon_dreams.0001.murder:0 "\n#italic    Açık gökyüzünde bir ejderha süzülüyor...#!\n#italic       bir akrebin arkasına çömelmiş gölgeli bir figür, cıvatasının ucunda zehir parıldıyor...#!\n#italic          cıvata kanadını delerken ejderha kükreyip gökten düşüyor.#!\n\nBiri şunu öldürmeyi planlıyor:"

 agot_dragon_dreams.0001.abduction:0 "\n#italic    Bir ejderha yumurtası kümesi parıldıyor...#!\n#italic       gölgeli bir figür, belinde boş bir çuval ile onlara doğru sürünüyor...#!\n#italic          yumurtalar tek tek hırsızın bez çantasında kayboluyor.#!\n\nBiri şunu kaçırmayı tasarlıyor:"

 agot_dragon_dreams.0001.fallback:0 "\n#italic    Sıcak zemine uzanmış bir ejderha...#!\n#italic       huzurla dinleniyor, soluğu gürleyen bir uğultu...#!\n#italic          tiz bir kükremeyle sıçrayarak uyandığında!#!\n\nBiri şuna karşı komplo kuruyor:"

 agot_dragon_dreams.0001.elope:0 "\n#italic    Kristal bir denizin üzerinde iki ejderha süzülüyor...#!\n#italic       birlikte uçarken kanatları birbirine dolanır gibi...#!\n#italic          Dar Deniz'in ötesinde, iki olan bir oluyor.#!\n\nBiri şununla kaçmayı planlıyor:"

 agot_dragon_dreams.0001.steal_back_artifact:0 "\n#italic    Dişi bir ejderha, yumurta kümesinin başında gururla duruyor...#!\n#italic       akşam havasına yükseliyor, sisten yaklaşan gölgeli figürü görmüyor...#!\n#italic          geceleyin çalınan, paha biçilemez değerde kıymetli bir yumurta.#!\n\nBiri şundan bir şeyler çalmaya çalışıyor:"

 agot_dragon_dreams.0001.target_other:0 "benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]!"

 agot_dragon_dreams.0001.target_dreamer:0 "[target.GetHerHim]!"

 agot_dragon_dreams.0001.target_me:0 "ben!"

 agot_dragon_dreams.0001.child_new_dreamer:0 "\n\nGörünüşe göre [dragon_dreamer.GetFirstNameNoTooltip] bir ejderha rüyacısı. Yüreğim çocuğa acıyor; önümüzdeki yıllarda bu, taşıması ağır bir yük olacak..."

 agot_dragon_dreams.0001.self_new_dreamer:0 "\n\nGörünüşe göre ben bir ejderha rüyacısıyım. Kadim ejderha rüyacılarını hatırlarken, umarım bu rüyalar yük olmaktan çok yardımcı olur..."

 agot_dragon_dreams.0001.relative_new_dreamer:0 "\n\nGörünüşe göre [dragon_dreamer.GetFirstNameNoTooltip] bir ejderha rüyacısı. [dragon_dreamer.GetHerHis] iyiliği için, umarım bunun lanetten çok bir lütuf olduğu ortaya çıkar..."

 agot_dragon_dreams.0001.known_dreamer:0 "\n\nBilgi için ne kadar minnettar olsam da, umarım [dragon_dreamer.GetFirstNameNoTooltip]'i rahatsız eden rüyalar [dragon_dreamer.GetHerHim]'i çok ağır etkilemiyordur..."

 agot_dragon_dreams.0001.known_dreamer_self:0 "\n\nBu komployu durdurana dek, bu rüyalar elbette beni rahatsız edecek..."

 agot_dragon_dreams.0001.a:0 "Bunun arkasındaki alçağı durdurmalıyız!"

 agot_dragon_dreams.0100.t:0 "Öngörülen Sorun"

 agot_dragon_dreams.0100.desc.1:0 "Gecenin ortasında uyandım "

 agot_dragon_dreams.0100.desc.root_is_dreamer:0 "ter ve korku içinde. Yaklaşan felaketimi gördüğüm bir rüya gördüm! Ne olacağından pek emin olamam; ama şimdi olmasını engellemek için yeterince şey biliyorum."

 agot_dragon_dreams.0100.desc.other_dreamer:0 "telaşlı ayak seslerine. Bir hizmetkâr, [ROOT.Var('dreamer').Char.GetName]'den bir mektup geldiğini ve derhal açılması talimatı verildiğini söylüyor. Gerginlikle mektubu açıyorum; [ROOT.Var('dreamer').Char.GetSheHe] yaklaşan felaketimi öngörmüş! [ROOT.Var('dreamer').Char.GetSheHe|U], ne olacağından pek emin olamadığını söylüyor; ama olmasını engellememe yetecek kadar ayrıntı veriyor."

 agot_dragon_dreams.0100.desc.fallback:0 "Yaklaşan felaketim önceden görüldü."

 agot_dragon_dreams.0100.a:0 "Kıl payı!"
