l_english:

 agot_wildling_events.0001.t:0 "Bahşedilen Bir İsim"

 agot_wildling_events.0001.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip].\n\nHalkımın arasında, yaşamın ilk günlerinde kötü talihi uzaklaştırmak için verilmiş sıradan bir süt adı.\n\nArtık düzgünce adlandırılacak kadar güçlendiğime göre, hangi ismi alacağımı merak ediyorum."

 agot_wildling_events.0001.desc:0 "[child.GetFirstNameNoTooltip].\n\nHalkımızın arasında, [child.GetHerHis] ilk günlerinde kötü talihi uzaklaştırmak için verilmiş sıradan bir süt adı.\n\n[child.GetSheHe] artık yeterince güçlendiğine göre, halkımız arasında [child.GetHerHim]'e gerçek bir isim verilme vakti geldi."

 agot_wildling_events.0001.a:0 "[Select_CString(Character.IsLocalPlayer, 'benim', 'çocuğun' )] yeniden adlandırılmasına izin ver."

 agot_wildling_events.0100.t:0 "Şekillenen Bir İsim"

 agot_wildling_events.0100.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip].\n\nArtık bir süt adı değil; halkımın geleneğine göre dünyanın yaratıklarından alınmış gerçek bir isim.\n\nÇocukluğun ötesindeki ilk adım, ama henüz yetişkin bir [ROOT.Char.GetWomanMan] olarak taşıyacağım isim değil."

 agot_wildling_events.0100.desc:0 "[child.GetFirstNameNoTooltip].\n\nArtık bir süt adı değil; halkımızın geleneğine göre dünyanın yaratıklarından alınmış gerçek bir isim.\n\nÇocukluğun ötesindeki ilk adımı işaret ediyor, ama henüz [child.GetSheHe]'in yetişkinken taşıyacağı isim değil."

 agot_wildling_events.0100.a:0 "Büyürken kazanılmış bir isim."

 agot_wildling_events.0101.t:0 "Tamamlanan Bir İsim"

 agot_wildling_events.0101.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip].\n\nÇocukluk adım gitti; halkımın geleneğine göre adım artık kim olduğumu yansıtan bir lakap taşıyor.\n\nYetişkinliğe yakışır bir isim."

 agot_wildling_events.0101.desc:0 "[child.GetFirstNameNoTooltip].\n\n[child.GetHerHis|U] çocukluk adı gitti; halkımızın geleneğine göre [child.GetHerHis] adı artık [child.GetSheHe]'in kim olduğunu yansıtan bir lakap taşıyor.\n\nYetişkinliğe yakışır bir isim."

 agot_wildling_events.0101.a:0 "Bütünleşmiş bir isim."
