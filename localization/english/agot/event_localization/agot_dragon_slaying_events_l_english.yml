l_english:

 agot_dragon_duel.t:0 "Ejderha Düellosu:"

 agot_dragon_slaying_events.0001.t:0 "Ejderhanın İni"

 agot_dragon_slaying_events.0001.neck:0 "Günlerdir bataklığın her zamanki kokusu burnumu rahatsız ediyor; o kadar ki sonunda ona alıştım. Bu yüzden yeni bir koku — bana yabancı ama bir şekilde çürük yumurtayı anımsatan — beni hazırlıksız yakalıyor; yine de doğru yolda olduğumu biliyorum. Çamur, turba ve bataklık labirenti nihayet parçalanmış leşler ve kömürleşmiş kemiklerle işaretlenmiş... Sadece izi takip etmem gerekiyor.\n\nİz beni, bitkilerle kaplı kayalık bir tepeciğe götürüyor. Doğrudan bataklık bir gölete açılan girişten bakınca içi boş olduğu anlaşılıyor. [dragon.GetNameNicknamed] burada yaşıyorsa, [dragon.Custom('GetDragonSheHe')] muhtemelen suyun içinden geçmek zorunda kalıyor. İn için tuhaf bir seçim; ama en azından burası [dragon.Custom('GetDragonHerHim')]'e belli bir huzur garantiliyor. Dikkat şart; çünkü bir ejderhayla yüzleşmek zaten zorken, yapışkan çamur ve bulanık sular kadar hain bir arazide hiçbir şeyden emin olamam."

 agot_dragon_slaying_events.0001.north:0 "Sık bir yeşil asker çamı örtüsünün gölgelerinde yürürken ayaklarımın altında kar ve çimenler çıtırdıyor. Mağara, topraktan kurtulmaya çalışıyormuş gibi görünen karla kaplı yüksek bir tümseğin içine oyulmuş. Orman hattı aniden sona eriyor; tümseğin çevresindeki çamlar devrilmiş ya da parçalanmış — budaklı gövde ve kabuk parçalarına kırılmış, iğne yaprakları karların arasında dağınık yeşil tutamlar bırakmış.\n\nMağaranın ağzından kalın bir siyah duman bulutu yükseliyor, bulutlu gökyüzüne doğru uzanıp buz gibi rüzgârla dağılmadan önce. Bu kesinlikle [dragon.GetNameNicknamed]'in ini. [dragon.Custom('GetDragonHerHis')] avlarının kömürleşmiş kemikleri mağaranın girişinin hemen içinde bir yığın hâlinde bırakılmış. Bu canavara nasıl yaklaşmalıyım? Hatta denemeli miyim?"

 agot_dragon_slaying_events.0001.vale:0 "Ay Dağları manzaranın üzerine sarp gölgeler düşürürken [dragon.GetNameNicknamed]'i aramaya devam ediyorum. [dragon.Custom('GetDragonHerHis')|U] ini bu uçurumların arasında saklanıyor olmalı; ama yaya bile zor ilerlerken onu nasıl bulacağım?\n\nBu gün talih cesaretimin yanında: Dik bir kayalık çıkıntıyı aşıp dağın gri-yeşil yüzünün arasına gizlenmiş ince bir mağara yarığı görüyorum. Girişinin çevresindeki toprak kömürleşmiş leşlerle dolu ve aklıma düşen farkındalıkla kalbim güm güm atıyor: Ödülümü buldum, ama şimdi onu kazanmam gerek..."

 agot_dragon_slaying_events.0001.dorne:0 "Kumlu tepeler, [dragon.GetNameNicknamed]'i aramak için taradığım topraklarda bana pek az rahat vermişti. Çöl kumlarının arasında yeterince su bulamadığım için kimi an hezeyanlar geçirdim. Bugün, benden yalnızca bir taş atımı uzakta onu görüyorum: Bir serap gibi görünüp kaybolan, yer değiştiren bir mağara.\n\nSevincim, sirkeye dönüşen bir Dorne kırmızısı gibi hızla ekşiyor... [dragon.GetNameNoTooltip] ile hesaplaşmam gereken yer burası; ama kaderim, kumlar kadar hızlı parmaklarımın arasından kayıp gidebilir."

 agot_dragon_slaying_events.0001.danwell:0 "[dragon.GetNameNicknamed]'in izini [dragon.Custom('GetDragonHerHis')] inine kadar sürdüm; [dragon.GetCurrentLocation.GetName]'den pek uzakta olmayan sıcak ve nemli bir mağara. Havaya yapışmış pis bir koku var; yanık et kokusuyla dolu, itici bir çürüme kokusu. Mağara girişinin taşlarına hem insanların hem hayvanların kömürleşmiş kalıntıları saçılmış. Bu uğursuz mağaranın ağzının ötesinde hangi dehşetler saklanıyor? Hangi sınavlar beni bekliyor?"

 agot_dragon_slaying_events.0001.roselyse:0 "[dragon.GetNameNicknamed]'in izini [dragon.Custom('GetDragonHerHis')] inine kadar sürdüm; [dragon.GetCurrentLocation.GetName] yakınlarında, yosun kaplı taşlar ve yapışkan yemyeşil bitkilerin kucağında bir karanlık mağara. Sessizce ilerlerken kalın, dalga dalga yayılan bir sis her yanı kaplıyor. Sanki bir devin dilinin ucunda sallanıyorum; durgun nefesi çürüyen et kokusuyla ağır.\n\nDaha derinlerden hareketin ipuçları geliyor... Nazikçe yuvarlanan bir gök gürültüsü gibi yavaş bir gümbürtü. Duman kokusu üzerime çullanıyor ve nefesim boğazımda düğümleniyor. Aradığım şeyi kesinlikle burada bulacağım... Ama devam edersem bu hikâyeyi anlatacak kadar yaşar mıyım?"

 agot_dragon_slaying_events.0001.aemmly:0 "Zaten ürkütücü ve tehlikeli bir yolculuğun ardından canavar [dragon.GetNameNicknamed]'in izini [dragon.Custom('GetDragonHerHis')] inine kadar sürdüm; [dragon.GetCurrentLocation.GetName] yakınlarındaki vahşi kıyılara gömülü, en derin gölgelere boyanmış bir mağara. Derin bir nefes alıp inin ağzına doğru sessizce ilerliyorum; rüzgârlar bana, sanki "#italic geri dön!#!" der gibi uyarılar fısıldıyor. Girişi daha iyi görebildiğimde, yanmış yosunlar ve vahşi hayvanların yakılıp yenmiş leşleri zemini kaplıyor. Yakınlardaki karanlıkta bir şeyin pusuya yatıp yatmadığından emin olamadan ihtiyatla sürünerek ilerliyorum. #italic Hareket eden#! bir şey görüyorum — ama yarasa mı, haydut mu, yoksa [dragon.GetNameNoTooltip] [dragon.Custom('GetDragonHerselfHimself')] mi ayırt edemiyorum.\n\nOdaklandığımda içerideki ejderhanın yavaş soluk alıp verişini duyabiliyorum. [dragon.Custom('GetDragonSheHe')|U] burada. Geriye yalnızca ilerleyip tarihin sayfalarına adımı kazımak kaldı; ama son saniyede zihnimin köşesinde bir düşünce beliriyor... bunu gerçekten yapabilir miyim?"

 agot_dragon_slaying_events.0001.desc_vengeance:0 "Ne olursa olsun, [ROOT.Char.Custom2('RelationToMeShort', vengeance_candidate)] [vengeance_candidate.GetFirstNameNicknamed] için intikam alacağım."

 agot_dragon_slaying_events.0001.desc_plan:0 "\n\nBelki bir plan kurmalıyım."

 agot_dragon_slaying_events.0001.poison:0 "Zehirli bir kılıçla savaş."

 agot_dragon_slaying_events.0001.poison.tt:0 "Kılıcınızı zehirleyip [dragon.GetName]'i yavaşlatmayı umacaksınız"

 agot_dragon_slaying_events.0001.mirror:0 "Aynalı bir kalkanla savaş."

 agot_dragon_slaying_events.0001.mirror.tt:0 "Daha önce işe yaramamıştı; ama belki sizin için işe yarar"

 agot_dragon_slaying_events.0001.seal:0 "Tüneli kapat."

 agot_dragon_slaying_events.0001.seal.tt:0 "Tüneli kapatıp [dragon.GetName]'i açlığa mahkûm etmeye çalışacaksınız"

 agot_dragon_slaying_events.0001.feed:0 "Yemle kandır."

 agot_dragon_slaying_events.0001.feed.tt:0 "[dragon.GetName]'i cezbetmek için yöresel hayvanlar temin edeceksiniz"

 agot_dragon_slaying_events.0001.confront:0 "[dragon.GetNameNoTooltip] ile yüzleş."

 agot_dragon_slaying_events.0001.confront.tt:0 "Ejderhayla derhal çatışmaya başlayacaksınız"

 agot_dragon_slaying_events.0001.cancel:0 "Bir daha düşününce, bu kötü bir fikir."

 agot_dragon_slaying_events.0002.t:0 "Karanlık Gölgeler"

 agot_dragon_slaying_events.0002.desc:0 "[dragon.GetNamePossessive] ininin aranışı sürüncemede kaldı, henüz sonuçsuz. Günler uzadıkça göreve olan dikkatim de azaldı. Bu berrak, güneşli öğle vakti kendimi orman hattından çok uzakta buluyorum — açık bir tarlanın ortasında süzülürken. Geçerken yuvarlanan bulutların gölgeleri bana eşlik ediyor.\n\nAklım bulutlardayken tuhaf bir şey fark ediyorum: Gölgelerden biri hızla hareket ediyor ve #bold rüzgâra karşı#!... Kısa süre sonra gerçeği kavrıyorum: [dragon.GetNameNicknamedNoTooltip]'i bulmaktansa, [dragon.Custom('GetDragonSheHe')] beni buldu!\n\nBir bulutun siperinin ardından dalışa geçen [dragon.Custom('GetDragonColorFull')] canavarı görüyorum; bir sonraki hamleme karar vermek için yalnızca bir anım var."

 agot_dragon_slaying_events.0002.fight:0 "Mağara olsun olmasın, fark etmez."

 agot_dragon_slaying_events.0002.fight.tt:0 "[dragon.GetName] ile bir çatışma başlatacaksınız"

 agot_dragon_slaying_events.0002.run:0 "KAÇIN!"

 agot_dragon_slaying_events.0002.run.tt:0 "İşler planlandığı gibi gitmedi."

 agot_dragon_slaying_events.0003.t:0 "Kayıp Ejderha"

 agot_dragon_slaying_events.0003.desc:0 "Tüm çabalarıma rağmen ejderhayı bulamadım. Eve dönme vakti."

 agot_dragon_slaying_events.0003.a:0 "Belki bir dahaki sefere!"

 agot_dragon_slaying_events.0004.t:0 "$agot_dragon_duel.t$ Aynalı Kalkan"

 agot_dragon_slaying_events.0004.desc.intro:0 "Efsaneler, Gardener Hanesi'nin hizmetindeki ünlü şövalye Ser [serwyn.GetFirstName]'den bahseder... Yoksa Kral Muhafızı'nın bir üyesi miydi? Hafızam beni yanıltıyor. Küçük insanların gözdesi olan bu adamın canavar [urrax.GetName]'i öldürme taktiği o kadar basitti ki dehaydı: Cilalı bir kalkanın ardına saklanarak, [dragon.Custom('GetDragonHerHis')] kendi yansımasıyla kafası karışan ejderhaya yaklaşmıştı.\n\nÖnümde [dragon.GetNameNicknamed] yükseliyor ve kendi cilalı kalkanımı kavradıkça elim titriyor, zorlamaktan parmak eklemlerim bembeyaz. #italic Elbette Ser Serwyn yaklaşımında benden daha emindi...#!\n\nHer adımda kadim masalları ve onları dinleyen kendi ahmaklığımı sorguluyorum."

 agot_dragon_slaying_events.0004.desc.some_success:0 "Önümdeki ejderha bir süre şaşkına döndü; ama artık kandırılamıyor. Yaklaştım ama henüz darbe menzilinde değilim..."

 agot_dragon_slaying_events.0004.desc.major_success:0 "Şüphelerime rağmen ejderha kandırıldı ve artık darbe menzilindeyim!"

 agot_dragon_slaying_events.0004.desc_failure:0 "Alçak bir hırıltı duyuyorum... Ejderha kurnazlığıma hiç kanmadı; tehlike sıcağının tenime yapıştığını hissedebiliyorum."

 agot_dragon_slaying_events.0004.a:0 "Kalkanı bırakmanın vakti."

 agot_dragon_slaying_events.0005.t:0 "$agot_dragon_duel.t$ Mühürlü Mezar"

 agot_dragon_slaying_events.0005.desc.intro:0 "Mağara girişini kapatmamda bana yardım etmeleri için yerli köylüleri ikna etmek zor olmadı. Her yüz korkuyla işaretli olsa da, her biri bu cehennemî canavardan kurtulmak için daha da çaresizdi. Hem her kafa da zafer hayalleriyle doluydu! Son taş yerine yerleştirildiğinde ejderhanın ölümünün bir işaretini bekledik. [dragon.Custom('GetDragonSheHe')] elbette açlıktan ölecek ya da nefesi tükenecek...\n\n"

 agot_dragon_slaying_events.0005.desc.starved:0 "Günlerce bekledikten sonra mağaranın mührünü açma emrini veriyorum. Ödülümü, mağara girişinin hemen ötesinde görünce üzerimi gurur kaplıyor. "Canavar öldü, efendim" diye sesleniyor yerli halktan [peasant.GetFirstName]."

 agot_dragon_slaying_events.0005.desc.elsewhere:0 "Günlerce bekledikten sonra mağaranın mührünü açma emrini veriyorum. Ne var ki mağarayı titizce aradıktan sonra kolay bir öldürme umudu söndü. "Canavar burada değil, efendim" diye fısıldıyor yerli halktan [peasant.GetFirstName]. "Belki de hiç olmadı.""

 agot_dragon_slaying_events.0005.desc.fire.impatient:0 "Ne var ki boşuna geçen bir günün ardından sabrım tükendi. Canavar zayıflamış olmalı ve en azından öldürmesi daha kolay olmalı."

 agot_dragon_slaying_events.0005.desc.fire:0 "Mağaranın mührünü açma emrini veriyorum... ancak taşın ardında onu bekleyen ejderhayı buluyorum. Göz açıp kapayıncaya dek gökyüzü kızıl bir yangınla aydınlanıyor. [peasant.GetFirstName], ejderha ateşinin gürültüsünün üstünde bir çığlık atıyor: "Eğilin, efendim!""

 agot_dragon_slaying_events.0005.desc.away:0 "Bir şeylerin ters olduğunu anlamak uzun sürmüyor. Hava durgun, kuşlar sessizleşti ve atlar huzursuzlandı. "Şunu duyuyor musun," diye sesleniyor yerli halktan [peasant.GetFirstName], "bu bir davul mu?" Hayır... davul değil... #bold kanat çırpışı#! Cehennem yaratığı önümüzde belirip üzerimize kavurucu bir alev tufanı salmadan önce bu düşünceyi toparlamak için yalnızca birkaç anım var."

 agot_dragon_slaying_events.0005.desc.deadpeasant:0 "\n\n[peasant.GetFirstNameNoTooltip]'in hızlı davranışı olmasaydı, diğerleriyle birlikte yanacaktım. Ne var ki [peasant.GetSheHe|U] bu hareketinin bedelini ağır ödedi ve son nefesinde, [peasant.GetSheHe]'nin toparlayabildiği tüm güçle fısıldadı: "Canavarı öldür... köyü koru.""

 agot_dragon_slaying_events.0005.starved:0 "Beklediğimden daha küçük."

 agot_dragon_slaying_events.0005.starved.tt:0 "Artık bir ejderha avcısı olarak kabul ediliyorsunuz"

 agot_dragon_slaying_events.0005.elsewhere:0 "[dragon.Custom('GetDragonSheHe')] nereye gitmiş olabilir?"

 agot_dragon_slaying_events.0005.d:0 "Canavar bunun bedelini ödeyecek."

 agot_dragon_slaying_events.0005.d.tt:0 "Ejderha size pusu kurdu; çatışmaya dezavantajla başlayacaksınız"

 agot_dragon_slaying_events.0006.t:0 "$agot_dragon_duel.t$ Lezzetli Bir Oyun"

 agot_dragon_slaying_events.0006.desc:0 "Yerli bir çobanı, [dragon.GetNameNicknamed]'i alt etmem karşılığında sürüsünden birkaç hayvan vermeye ikna etmek kolaydı... Şimdi zor kısım geliyor.\n\nKendimi koyunların arasına sokup korkunç canavara doğru süzülüyorum. Koyun etiyle çevrili bir hâlde, zararlı niyetimi bir yemek görünümünün ardına gizlemeye çalışacağım.\n\nEjderhaya atılan her yanlış adımda kalbim göğsümde daha yüksek sesle çarpıyor."

 agot_dragon_slaying_events.0006.desc.success:0 "[dragon.GetNameNoTooltip] yeme kanmış görünüyor; [dragon.Custom('GetDragonSheHe')], koyunların yaklaşmasını izlerken memnun bir mırıltı çıkarıyor. Darbe menziline girdiğimde [ROOT.Char.Custom('signature_weapon')]'imi kaldırıyorum; ama mırıltının tınısı bir anda derin, karanlık bir hırıltıya dönüşüyor..."

 agot_dragon_slaying_events.0006.desc.fail:0 "[dragon.GetNameNoTooltip] koyunlarla en ufak bir ilgilenmiyor gibi. [dragon.Custom('GetDragonHerHis')|U] gözleri yem olan sürünün arasında anında beni takip ediyor... Görünüşe göre [dragon.Custom('GetDragonSheHe')] farklı bir et türünü tercih eder."

 agot_dragon_slaying_events.0006.a:0 "Ben menüde yokum."

 agot_dragon_slaying_events.0100.t:0 "$agot_dragon_duel.t$ [dragon.GetNameNoTooltip]"

 agot_dragon_slaying_events.0100.desc.intro1:0 "[dragon.GetNameNicknamed] parlayan gözlerle beni izliyor; [dragon.Custom('GetDragonHerHis')] [dragon.Custom('GetDragonColorFull')] pulları kararlı bakışımı yansıtıyor."

 agot_dragon_slaying_events.0100.desc.intro2:0 "[dragon.GetNameNicknamed], çelik ve etin tadına aç bir şekilde [dragon.Custom('GetDragonHerHis')] ağzını yalıyor."

 agot_dragon_slaying_events.0100.desc.intro3:0 "[dragon.GetNameNicknamed] [dragon.Custom('GetDragonHerHis')] kanatlarını açarak bana doğru bir rüzgâr dalgası gönderiyor."

 agot_dragon_slaying_events.0100.desc.intro4:0 "[dragon.GetNameNicknamed] [dragon.Custom('GetDragonHerHis')] kafasını eğiyor; [dragon.Custom('GetDragonSheHe')] sertleşmiş bakışımla karşılaşırken gözleri kısılıyor."

 agot_dragon_slaying_events.0100.desc.close_intro:0 "Çabalarım bana kısa bir avantaj kazandırdı; ama [dragon.GetNameNicknamed]'den yayılan sıcaklığı hissettiğimde sevincim bir anda uçup gidiyor. Düşmanım, neredeyse bana daha da yaklaşmam için meydan okur gibi burnundan soluyor."

 agot_dragon_slaying_events.0100.desc.mid1:0 "Bu canavar karşısında kendimi sağlamlaştırmaya çalışarak basışımı ihtiyatla ayarlıyorum.\n\n"

 agot_dragon_slaying_events.0100.desc.mid2:0 "[ROOT.Char.Custom('signature_weapon')]'imi hazırlayıp gelecek vahşete karşı kendimi bilemliyorum.\n\n"

 agot_dragon_slaying_events.0100.desc.mid3:0 "Alnımda ve gözlerimin çevresinde ter damlaları birikiyor; ama silmek için ani bir hareket riskini alamam. Tuzlu damlacıkları gözyaşı gibi kırparak uzaklaştırıyorum.\n\n"

 agot_dragon_slaying_events.0100.desc.intro.poison:0 "Kılıcımdan zehir damlıyor; onu kullanmak için yeterince yaklaşmam yeterli..."

 agot_dragon_slaying_events.0100.desc.ending1:0 "Kaderim, koparılmayı ya da bir efsaneye dokunmayı bekleyen kırılgan bir iplik gibi asılı duruyor."

 agot_dragon_slaying_events.0100.desc.ending2:0 "Kaderim bir bıçağın ağzında duruyor; tehlikeli biçimde felakete doğru sallanıyor."

 agot_dragon_slaying_events.0100.desc.ending3:0 "Kararlılığım herhangi bir ejderha ateşinden daha parlak yanıyor ve kendimi kanıtlayacağım. Ama"

 agot_dragon_slaying_events.0100.desc.get_closer:0 "Ejderhaya daha da yaklaşmalıyım.\n\n"

 agot_dragon_slaying_events.0100.desc.get_even_closer:0 "Canımı acıtsa da ejderhaya daha da yaklaşmalıyım.\n\n"

 agot_dragon_slaying_events.0100.desc.last_move_burn1:0 "Ateş. Her yerde ateş. Ejderhanın çıkardığı alev tufanı yoğun ve [dragon.Custom('GetDragonSheHe')]'nin ürettiği duman boğucu kalınlıkta."

 agot_dragon_slaying_events.0100.desc.last_move_burn2:0 "[dragon.GetNamePossessiveNoTooltip] ağzından alevler fışkırıyor; bölgeyi şimdiye dek hissettiğim hiçbir şeye benzemeyen yoğun bir sıcağa boğuyor."

 agot_dragon_slaying_events.0100.desc.last_move_burn3:0 "Yangın çıkarıcı bir cehennem beni kuşatıyor; dört bir yanım ejderha ateşi ve duman duvarlarıyla çevrili. Sıcaklık havada dalgalanmalar yaratıyor."

 agot_dragon_slaying_events.0100.desc.last_move_shake_cave:0 "Ejderhanın gazabı ve [dragon.Custom('GetDragonHerHis')] felç edici kükremesinin yankıları dindi ve mağara sessizleşti."

 agot_dragon_slaying_events.0100.desc.last_move_sneak_attack:0 "Aldatma! Korumalı bir an sanarak güvendiğim şey, aslında savunmamı açmak için hesaplanmış bir oyundu. Şimşek hızıyla [dragon.GetNameNoTooltip] koşan bedenime saldırdı ve korkunç bir yara açtı."

 agot_dragon_slaying_events.0100.desc.last_move_guarded_attack:0 "Ejderhanın savunması düştü; ama [dragon.Custom('GetDragonHerHis')] gözlerinde soğuk bir bakış var."

 agot_dragon_slaying_events.0100.desc.last_move_guard:0 "Ejderhanın savunması artık kalkık değil."

 agot_dragon_slaying_events.0100.desc.last_move_lunge:0 "[dragon.GetNameNoTooltip] korkunç bir güçle atılıyor ve [dragon.Custom('GetDragonHerHis')] ağzını çarparak kapatıyor. Parçalanmaktan kıl payı kurtuluyorum."

 agot_dragon_slaying_events.0100.desc.current_move_burn:0 "[dragon.GetNameNoTooltip] boynunu kıvırıyor. [dragon.Custom('GetDragonHerHis')] ağzından alçak bir hırıltı yükseliyor ve hava kömür kokusuyla doluyor. Hiç şüphe yok: [dragon.Custom('GetDragonSheHe')] bölgeyi alevlerle temizlemeye hazırlanıyor."

 agot_dragon_slaying_events.0100.desc.current_move_shake_cave:0 "Saldırgan bir azgınlık içinde [dragon.Custom('GetDragonSheHe')] son derece tehlikeli bir arazi yarattı. [dragon.Custom('GetDragonHerHis')] ağzından çıkan boğuk kükreme mağarada yankılanıyor; ürkütücü bir ses."

 agot_dragon_slaying_events.0100.desc.current_move_guard:0 "[dragon.GetNameNoTooltip] [dragon.Custom('GetDragonHerHis')] savunmasını kaldırdı; belki de aramızdaki mesafeyi kapatmanın tam zamanı."

 agot_dragon_slaying_events.0100.desc.current_move_lunge:0 "Zorlu bir hızla ejderha aramızdaki mesafeyi daraltıyor. [dragon.Custom('GetDragonHerHis')] güçlü çeneleri, etimin tadına can atarak açık duruyor."

 agot_dragon_slaying_events.0100.approach:0 "Ejderhaya hücum et."

 agot_dragon_slaying_events.0100.roll_burn:0 "Fıçı taklidi yap."

 agot_dragon_slaying_events.0100.roll_lunge:0 "İleri atıl."

 agot_dragon_slaying_events.0100.approach_cautiously:0 "İhtiyatla yaklaşmaya devam et."

 agot_dragon_slaying_events.0100.run:0 "Buradan çıkmam gerek."

 agot_dragon_slaying_events.0101.t:0 "$agot_dragon_duel.t$ [dragon.GetNameNoTooltip]"

 agot_dragon_slaying_events.0101.desc.mid.uncouth:0 "Bu ejderhanın canı cehenneme, koca krallığın da. Bu buhar çıkaran #bold ejderha işi#! keseğiyle savaşırken ölmeyi reddediyorum!\n\n"

 agot_dragon_slaying_events.0101.desc.mid.brave:0 "Saldırıdan irkilirken sinirlerim bir an sınanıyor; ama kararlılığım yeniden pekişiyor. [dragon.GetNameNoTooltip] #bold ölecek#!.\n\n"

 agot_dragon_slaying_events.0101.desc.mid.craven:0 "Tüm bedenim sarsılıyor, ölüm o kadar yakın ki kokusunu alabiliyorum. Korku ve panikle içimi boşalttım; pantolonum kaygan. İşte böyle sona eriyor...\n\n"

 agot_dragon_slaying_events.0101.desc.mid.fallback:0 "Bir an sendeleyip sonra yeniden odaklanıyorum. Elimdeki iş, varlığımın son zerresini gerektirecek. Üstelik o zaman bile...\n\n"

 agot_dragon_slaying_events.0101.desc.outro1:0 "Çevremdeki zemin çer çöp ve moloz yığını; ne siper sunuyor ne merhamet. Yalnızca ölüm."

 agot_dragon_slaying_events.0101.desc.outro2:0 "Ayağım bir kemik parçasına takılıyor... Bir keçi kafatası mı? Belki bir kurdunki? Bir ejderhanın insandan başka düşmanı yoktur."

 agot_dragon_slaying_events.0101.desc.outro3:0 "Yüzümden bir kan damlası süzülüyor, burun deliklerim demir kokusuyla doluyor. Yüzümü ekşiterek teri gözlerimden kırpıyorum."

 agot_dragon_slaying_events.0101.desc.outro4:0 "Hava ağır; ama an, hafif ve kaçamak geliyor — alevlerin arasında kısa bir parıltı, bir anda dağılan bir hayalet."

 agot_dragon_slaying_events.0101.desc.ending1:0 "Önümde, şaşırtıcı derecede yakında, [dragon.GetNamePossessiveNoTooltip] kanatları toz ve külü havaya savuruyor."

 agot_dragon_slaying_events.0101.desc.ending2:0 "[dragon.GetNameNoTooltip] artık elimizin altında; ama [dragon.Custom('GetDragonHerHis')] [dragon.Custom('GetDragonColor')] pulları bir kale gibi geçilmez görünüyor."

 agot_dragon_slaying_events.0101.desc.ending3:0 "Önümdeki kanlı iş olmasaydı, elimi uzatıp [dragon.GetNamePossessiveNoTooltip] [dragon.Custom('GetDragonColor')] pullarına neredeyse dokunabilecektim."

 agot_dragon_slaying_events.0101.desc.ending4:0 "Üzerimize bir sessizlik çöküyor. Tek tesellim sessizlik. [dragon.GetNamePossessiveNoTooltip] gözleri Valyrian çeliğinden hançerler gibi beni delip geçiyor."

 agot_dragon_slaying_events.0101.desc.current_move_bite:0 "\n\nBu canavarın çeneleri açılıyor. Hareket etmezsem akşam yemeği olacağım."

 agot_dragon_slaying_events.0101.desc.current_move_tail:0 "\n\nCanavarın kuyruğu yıkıcı bir güçle savruluyor. Hareket etmeli ya da çamurun bir parçası olmalıyım."

 agot_dragon_slaying_events.0101.climb:0 "Ejderhaya tırman."

 agot_dragon_slaying_events.0101.dive:0 "Ejderhanın altına dal."

 agot_dragon_slaying_events.0101.stand:0 "Sağlam dur. Ejderha burada ölecek."

 agot_dragon_slaying_events.0102.t:0 "$agot_dragon_duel.t$ [dragon.GetNameNoTooltip]"

 agot_dragon_slaying_events.0102.desc.maimed:0 "Kolum, omuz yuvasından koparılmış hâlde yerde kıvranıyor; son kan fışkırmaları yerde seğiren hareketlerin bir pantomimini oynuyor. Eee, işler beklediğim gibi gitmedi...\n\n"

 agot_dragon_slaying_events.0102.desc.crippled:0 "Paramparça bedenimi sürüklüyorum... Bir ejderhanın kuyruğunun böyle ezebileceğini kim bilebilirdi? Gövdemin altında, bir zamanlar gururla uzanan [ROOT.Char.GetLadyLord] bacaklarımın yerinde artık kırık kemik, iç organ ve yırtık pantolon parçalarından oluşan cansız bir yığın sallanıyor.\n\n"

 agot_dragon_slaying_events.0102.desc.ouchie:0 "Her şey bir anda oluyor... [dragon.Custom('GetDragonHerHis')] darbesinden kaçmak umuduyla [dragon.GetNameNoTooltip]'in altına dalıyorum; ama adımı zamanlamayı beceremiyorum. Miğferimin kafamdan uçtuğunu hissediyorum. Pençeli bir ayak öfkeyle bacağımı parçalıyor; hem eti hem kemiği didikliyor. [dragon.GetNamePossessiveNoTooltip] kuyruğunun ucu yüzümü, tam gözümün üstünden kestiğinde acı dolu çığlığım yarım kalıyor.\n\nKan fışkırıyor, bir çeşme gibi yanağımdan aşağı boşalıyor."

 agot_dragon_slaying_events.0102.desc.bite:0 "[dragon.GetNamePossessiveNoTooltip] çeneleri ürkütücü bir vahşetle çarpıyor."

 agot_dragon_slaying_events.0102.desc.tail_swipe:0 "[dragon.GetNameNoTooltip] kuyruğunu güçlü bir savruluşla geçiriyor."

 agot_dragon_slaying_events.0102.desc.climb:0 "Darbeden kaçınmak için ejderhanın sırtına tutundum ve [dragon.Custom('GetDragonSheHe')] bundan hiç memnun değil.\n\n"

 agot_dragon_slaying_events.0102.desc.dive:0 "Ejderhanın karnının altına dalarak [dragon.Custom('GetDragonHerHis')] gazabının en kötüsünden kendimi kurtardım — ama yüksekteki tehlikeyi göremediğim için üstümdeki gücün farkında değilim.\n\n"

 agot_dragon_slaying_events.0102.desc.valyrian:0 "#italic Valar morghulis#! zihnimde yankılanıyor. Ölüm: bir amaç, tatlı bir kurtuluş. Ama #italic bugün değil#!."

 agot_dragon_slaying_events.0102.desc.uncouth:0 "#bold Bu tanrının unuttuğu ejderhanın canı cehenneme.#!"

 agot_dragon_slaying_events.0102.desc.seven:0 "#italic Ana... Savaşçı... Baba...#! Bir kurtarıcı arıyorum; ama gördüğüm tek şey, beni almaya gelen Yabancı."

 agot_dragon_slaying_events.0102.desc.oldgods:0 "Bedenim bir anda buz kesiliyor, uyuşturan serin bir sakinlik üzerime çöküyor. #italic Eski tanrılar burada#! ve bu belayı sona erdirmeliyim."

 agot_dragon_slaying_events.0102.desc.drowned:0 "#italic Ölen bir daha asla ölmez#!, diye yalvarıyorum kendime, #italic ama daha sert... daha güçlü dirilir...#!"

 agot_dragon_slaying_events.0102.desc.rhllor:0 "Çevremde alevler dans etse de, sıcak bir sakinlik duygusunun kucağında hissediyorum. #italic Işık Tanrısı beni zafere götürecek.#!"

 agot_dragon_slaying_events.0102.desc.fallback:0 "Tek umudum artık kendi kararlılığımda... #italic Ateşin ve alevlerin arasından kendimi ileri itmeliyim.#!"

 agot_dragon_slaying_events.0102.desc.crush:0 "Ejderha [dragon.Custom('GetDragonHerHis')] ağırlığını kaydırıyor; [dragon.Custom('GetDragonSheHe')], [dragon.Custom('GetDragonHerHis')] bedeninin ağırlığıyla beni zeminle [dragon.Custom('GetDragonHerHim')] arasında ezmeyi planlıyor. Hızla hareket etmeliyim, yoksa [dragon.Custom('GetDragonSheHe')] beni öldürecek."

 agot_dragon_slaying_events.0102.desc.tail:0 "Ejderha beni [dragon.Custom('GetDragonHerHis')] sırtı ile [dragon.Custom('GetDragonHerHis')] kuyruğu arasında ezmeyi planlıyor. Tek bir darbeden bile kaçınırken bir karar vermeliyim. [dragon.Custom('GetDragonHerHis')|U] kuyruğu beni kolayca öldürür."

 agot_dragon_slaying_events.0102.desc.shake:0 "[dragon.GetNameNoTooltip] beni [dragon.Custom('GetDragonHerHis')] sırtından atmaya çalışıyor."

 agot_dragon_slaying_events.0102.desc.fly_climb:0 "Ejderha havalandı; ya elimden geldiğince bırakmalıyım ya da onunla götürülmeliyim. İkincisinin tehlikeleri aşikâr; ama bırakmak ödülümü kaybetmek demek."

 agot_dragon_slaying_events.0102.desc.fly_dive:0 "Ejderha havalanmaya çalışıyor. Canavarı yere indirmek istiyorsam hızla hareket etmeliyim; yoksa [dragon.Custom('GetDragonHerHim')]'i salabilirim."

 agot_dragon_slaying_events.0102.kill_first_crush:0 "#bold Eğer [dragon.Custom('GetDragonHerHim')]'i önce ben öldürürsem olmaz!#!"

 agot_dragon_slaying_events.0102.kill_first_crush.tt:0 "[dragon.Custom('GetDragonSheHe')] sizi zemine ezmeden önce ejderhayı öldürmeye çalışacaksınız."

 agot_dragon_slaying_events.0102.kill_first_fly:0 "#bold [dragon.Custom('GetDragonSheHe')] havalanmadan önce [dragon.Custom('GetDragonHerHim')]'i öldürmeliyim!#!"

 agot_dragon_slaying_events.0102.kill_first_fly.tt:0 "[dragon.Custom('GetDragonSheHe')] havalanabilmeden önce ejderhayı öldürmeye çalışacaksınız; muhtemelen misillemeyle karşılaşacaksınız."

 agot_dragon_slaying_events.0102.roll:0 "Yuvarlanarak uzaklaş."

 agot_dragon_slaying_events.0102.dive_fly_away:0 "Yazık..."

 agot_dragon_slaying_events.0102.climb_head:0 "Kafaya doğru tırman!"

 agot_dragon_slaying_events.0102.get_off:0 "İn!"

 agot_dragon_slaying_events.0102.hold_on:0 "Tutun!"

 agot_dragon_slaying_events.0110.t:0 "$agot_dragon_duel.t$ Zafer"

 agot_dragon_slaying_events.0110.desc.move_climb_tail:0 "[dragon.GetNamePossessiveNoTooltip] sırtına çılgınca tırmanırken canavar beni [dragon.Custom('GetDragonHerHis')] sırtı ile [dragon.Custom('GetDragonHerHis')] kuyruğu arasında ezmeye çalışıyor."

 agot_dragon_slaying_events.0110.desc.move_climb_shake:0 "[dragon.GetNamePossessiveNoTooltip] sırtına telaşla tırmanırken canavar beni silkelemeye çalışıyor. [dragon.Custom('GetDragonHerHis')] bedeni şiddetle dalgalanırken can havliyle [dragon.Custom('GetDragonHerHis')] pullarına yapışıyorum."

 agot_dragon_slaying_events.0110.desc.move_dive_crush:0 "[dragon.GetNameNoTooltip]'in altına sokulmuş, tüm gücümü [dragon.Custom('GetDragonHerHis')] açıkta kalan alt yanına indirdiğim darbelere yüküyorum. Ansızın [dragon.Custom('GetDragonHerHis')] ağırlığı tehlikeli biçimde aşağı kayıyor."

 agot_dragon_slaying_events.0110.desc.move_climb_fly:0 "[dragon.Custom('GetDragonSheHe')] uçuşta yukarı fırlarken hezeyanlar içinde [dragon.GetNamePossessiveNoTooltip] sırtındaki [dragon.Custom('GetDragonColor')] pullara tutunuyorum."

 agot_dragon_slaying_events.0110.desc.move_dive_fly:0 "[dragon.GetNamePossessiveNoTooltip] açıkta kalan karnına bir dizi darbe indiriyorum; [dragon.Custom('GetDragonHerHis')] çığlıkları kulaklarımı deliyor. Bir anda canavar kanatlanıyor."

 agot_dragon_slaying_events.0110.desc.win_burn_wound:0 "[dragon.GetNameNoTooltip] [dragon.Custom('GetDragonHerHis')] ölümcül ateşini kusarken kaçıp kıvırılarak [dragon.Custom('GetDragonHerHim')]'e doğru yol alıyorum."

 agot_dragon_slaying_events.0110.desc.win_lunge_wound:0 "[dragon.GetNameNoTooltip] üstüme atılırken yana aldatma yapıp aramızdaki mesafeyi kapatıyorum."

 agot_dragon_slaying_events.0110.desc.win_confront_bite:0 "[dragon.Custom('GetDragonHerHis')] yakalayıcı ısırığını savuşturup kendimi sıkıca [dragon.GetNameNoTooltip]'e doğru atıyorum."

 agot_dragon_slaying_events.0110.desc.win_confront_tail:0 "[dragon.GetNamePossessiveNoTooltip] kuyruğu zırhıma vahşice savruluyor; ama darbeyi soğukkanlılıkla karşılıyorum."

 agot_dragon_slaying_events.0110.desc.win_climb_head:0 "[dragon.Custom('GetDragonHerHis')] sırtından kafaya doğru tırmanmaya devam ediyorum. [dragon.Custom('GetDragonSheHe')|U] kontrolsüzce savruluyor."

 agot_dragon_slaying_events.0110.desc.win_climb_roll:0 "Ezilmekten kaçınmak için tam zamanında yuvarlanıyorum; ama [dragon.GetNamePossessiveNoTooltip] bir kol boyu mesafeden bana sinsi sinsi bakıyor."

 agot_dragon_slaying_events.0110.desc.win_shake_climb:0 "[dragon.GetNameNoTooltip] şiddetle sarsılıyor; [dragon.Custom('GetDragonHerHis')] kafasına yakınlığımı korumak tüm gücümü gerektiriyor."

 agot_dragon_slaying_events.0110.desc.win_shake_roll:0 "[dragon.GetNameNoTooltip] öfkeli bir silkeleme yapıyor; ama tam zamanında yuvarlanarak uzaklaşıyorum. [dragon.Custom('GetDragonSheHe')] bana doğru eğilirken [dragon.Custom('GetDragonSheHe')|U] öfkeyle soluyor."

 agot_dragon_slaying_events.0110.desc.win_climb_fly:0 "Sıkıca tutunarak [dragon.GetNamePossessiveNoTooltip] sırtındaki konumumu koruyor, [dragon.Custom('GetDragonHerHim')]'in inmesini bekliyorum. [dragon.Custom('GetDragonSheHe')] yere değer değmez kendimi [dragon.Custom('GetDragonHerHis')] kafasına doğru çekiyorum."

 agot_dragon_slaying_events.0110.desc.win_dive_crushcrushcrush:0 "[dragon.GetNameNoTooltip] beni acımasız bir güçle eziyor. İltihaplı bir yara gibi patlayacakmışım gibi hissediyorum; içim, reçelli irin gibi eziliyor. Yine de ejderhaya meydan okuyarak kendimi kurtarıyorum."

 agot_dragon_slaying_events.0110.desc.win_dive_crush_move:0 "[dragon.GetNameNoTooltip] [dragon.Custom('GetDragonHerselfHimself')]'ni üstüme fırlatırken ezilmekten kıl payı kurtuluyorum. Ödülüme göz dikerken kalbim göğsümde gümbür gümbür atıyor."

 agot_dragon_slaying_events.0110.desc.win_dive_stop_fly:0 "[dragon.Custom('GetDragonHerHis')] çabalarına rağmen [dragon.GetNameNoTooltip] havalanamıyor ve [dragon.Custom('GetDragonSheHe')] gazabımdan kaçamıyor."

 agot_dragon_slaying_events.0110.desc.mid1:0 "\n\nAn geldi çattı. Hayatta kalmak — ve başarmak — istiyorsam isabetli vurmalıyım."

 agot_dragon_slaying_events.0110.desc.mid2:0 "\n\nFırsat doğdu. Ateşli bir ölümden kaçınacaksam onu yakalamalıyım."

 agot_dragon_slaying_events.0110.desc.mid3:0 "\n\nBu kadar umutla beklediğim şans burada: Kısa da olsa bir saldırı açığı."

 agot_dragon_slaying_events.0110.desc.sword:0 "[ROOT.Char.Custom('signature_weapon')]'imi sıkıca kavrayıp [dragon.GetNamePossessiveNoTooltip] çene hattının altındaki yumuşak ejderha etini hedefliyorum. Tüm gücümle bıçağımı [dragon.Custom('GetDragonHerHis')] boynuna saplıyorum."

 agot_dragon_slaying_events.0110.desc.dagger:0 "Elimdeki [ROOT.Char.Custom('signature_weapon')] yerine çevrilirken parıldıyor — jilet gibi keskin bıçağı [dragon.GetNamePossessiveNoTooltip] pullarının arasından kaydırıp [dragon.Custom('GetDragonHerHis')] boynuna saplıyorum."

 agot_dragon_slaying_events.0110.desc.spear:0 "[ROOT.Char.Custom('signature_weapon')]'imi hazırlayıp [dragon.GetNamePossessiveNoTooltip] [dragon.Custom('GetDragonColorFull')] pullarının arasındaki yumuşak bir girintiyi hedefliyorum. Tüm beden ağırlığımla mızrak ucunu [dragon.Custom('GetDragonHerHis')] kafasına saplıyorum."

 agot_dragon_slaying_events.0110.desc.smash:0 "[ROOT.Char.Custom('signature_weapon')]'imi başımın üzerine kaldırıyorum; çabayla tüm kaslarım gerili. Varlığımdaki tüm güçle onu şiddetle [dragon.GetNamePossessiveNoTooltip] kafasına indiriyorum."

 agot_dragon_slaying_events.0110.desc.fallback:0 "Üst üste, çılgınca bir darbe yağmuru savuruyorum. Çileden çıkarıcı bir şekilde [dragon.GetNameNoTooltip] ölmeyi reddediyor. Sonunda [dragon.Custom('GetDragonHerHis')] gözüne kilitleniyorum... #italic Şimdi ölüyorsun#!, diye düşünüyorum [ROOT.Char.Custom('signature_weapon')]'imi [dragon.Custom('GetDragonHerHim')]'e saplarken."

 agot_dragon_slaying_events.0110.desc.ending1:0 "[dragon.Custom('GetDragonSheHe')|U] acınası bir cıvıltı çıkarıyor; [dragon.Custom('GetDragonHerHis')] yaşamının son damlası bir nefesle dışarı çıkıyor.\n\n"

 agot_dragon_slaying_events.0110.desc.ending2:0 "[dragon.Custom('GetDragonSheHe')|U] keskin bir çığlık koparıyor — acı ve korkudan eşit paylar alan ürkütücü bir ses. [dragon.Custom('GetDragonHerHis')|U] sonu yaklaştı.\n\n"

 agot_dragon_slaying_events.0110.desc.ending3:0 "[dragon.Custom('GetDragonSheHe')|U] hafif bir hırıltıyla haykırıyor; bir zamanlar alevin demlendiği [dragon.Custom('GetDragonHerHis')] boğazına kan doluyor.\n\n"

 agot_dragon_slaying_events.0110.desc.ending4:0 "[dragon.Custom('GetDragonSheHe')|U] neredeyse hüzünlü biçimde yumuşak bir cıvıltı çıkarıyor; sanki geçmişinden bir binicisini çağırıyor.\n\n"

 agot_dragon_slaying_events.0110.desc.ending5:0 "[dragon.GetNameNoTooltip], şu koca ejderha devi, [dragon.Custom('GetDragonSheHe')] ölürken yeri sarsan uzun bir osuruk salıyor.\n\n"

 agot_dragon_slaying_events.0110.desc_vengeance:0 "En sonunda, [ROOT.Char.Custom2('RelationToMeShort', vengeance_candidate)] [vengeance_candidate.GetFirstNameNicknamed] için intikamımı almayı başardım."

 agot_dragon_slaying_events.0110.a:0 "Peki, [dragon.Custom('GetDragonHerHis')] kafasını nasıl koparırım..."

 agot_dragon_slaying_events.0110.a.stronger:0 "... Daha güçlü olacağını sanmıştım."

 agot_dragon_slaying_events.0110.b:0 "Bu kadar küçük bir ödül riske değmez."

 agot_dragon_slaying_events.0110.blood_burn.tt:0 "Dikkatli ol, ejderha kanı kızgındır..."

 agot_dragon_slaying_events.0110.blood_burn.toast:0 "[ROOT.Char.GetName] Ejderha Kanı Tarafından Yakıldı"

 agot_dragon_slaying_events.0110.egg:0 "Dur... bu ne?"

 agot_dragon_slaying_events.0110.egg.flavor:0 "Bu olamaz..."

 agot_dragon_slaying_events.0110.egg.tt:0 "Ejderhanın ininin dibinde bir ejderha yumurtası buluyorsunuz."

 agot_dragon_slaying_events.0111.t:0 "$agot_dragon_duel.t$ Yenilgi"

 agot_dragon_slaying_events.0111.desc.move_climb_tail:0 "Şimşek hızıyla [dragon.GetNamePossessiveNoTooltip] kuyruğu, [dragon.Custom('GetDragonHerHis')] sırtına tırmanmaya çalışırken bana doğru savruluyor."

 agot_dragon_slaying_events.0111.desc.move_climb_shake:0 "Hiçbir uyarı olmadan [dragon.GetNameNoTooltip] beni [dragon.Custom('GetDragonHerHis')] sırtından şiddetle atmaya çalışıyor."

 agot_dragon_slaying_events.0111.desc.move_climb_fly:0 "Bir anda [dragon.GetNameNoTooltip], beni [dragon.Custom('GetDragonHerHis')] sırtında taşıyarak havalanıyor."

 agot_dragon_slaying_events.0111.desc.move_dive_crush:0 "Tüm [dragon.Custom('GetDragonHerHis')] ağırlığıyla [dragon.GetNameNoTooltip], [dragon.Custom('GetDragonHerHim')]'in altındayken beni ezmeye çalışıyor."

 agot_dragon_slaying_events.0111.desc.move_dive_fly:0 "Ben [dragon.Custom('GetDragonHerHim')]'in altına sokulmuşken [dragon.GetNameNoTooltip] havalanmaya başlıyor."

 agot_dragon_slaying_events.0111.desc.death_running_burn:0 "Ölümcül tehlikeyi görünce geri dönüyorum... Bu cehennemî yangından bir çıkış yolu olmalı.\n\nSırtım [dragon.Custom('GetDragonHerHim')]'e dönükken [dragon.GetNameNoTooltip] yeni bir ejderha ateşi dalgası salıyor. Sıcak hissediyorum, hem de çok sıcak. Hayır, böyle değil.\n\nKollarım ve bacaklarım eriyor; dayanılmaz sıcağın patlamasında kül taneleri oluyorum."

 agot_dragon_slaying_events.0111.desc.death.rip1:0 "[dragon.GetNamePossessiveNoTooltip] dişleri etimi didikleyip kıyma hâline getiriyor; kanım, kırılan bir kadehten taşan şarap gibi savruluyor. [dragon.Custom('GetDragonSheHe')] etimi yutarken, iç organlarımı koyun etinin sosu gibi yalarken dehşetle izliyorum."

 agot_dragon_slaying_events.0111.desc.death.rip2:0 "[dragon.GetNameNoTooltip] üzerime inerken gururla kükriyor; dişler ve pençeler yumuşak etime saplanıyor. Böyle bir cani tanrı karşısında zırhın hiçbir hükmü yok."

 agot_dragon_slaying_events.0111.desc.death.rip3:0 "[dragon.GetNamePossessiveNoTooltip] çeneleri çevremde sıkıca kapanıyor; sivri dişler etimi parçalayıp kemiklerimi kırıyor. [dragon.Custom('GetDragonSheHe')] elbette beni hemen bitirebilir; ama bunun yerine [dragon.Custom('GetDragonHerHis')] yemeğiyle oynamaktan memnun görünüyor. Acı beynimi gölgeliyor ve hissizleşiyorum."

 agot_dragon_slaying_events.0111.desc.death_running_pursuit:0 "Bu savaşta hayatta kalmam imkânsız. Hızla dönüp [dragon.GetNameNoTooltip]'den uzaklaşmak için koşuyorum; ama kaçışım yarıda kesiliyor.\n\n"

 agot_dragon_slaying_events.0111.desc.run_escape:0 "Bu canavara karşı kazanmamın imkânı yok... Kaçmaktan başka seçeneğim yok; üstelik o zaman bile ölebilirim.\n\nElimden geldiğince kaçıp kıvırılarak, kesin olarak yalnız olduğumdan emin olana dek aceleyle geri çekiliyorum. Nasıl olduysa ejderhadan kaçmayı başarıp bu cehennemi arkamda bırakıyorum."

 agot_dragon_slaying_events.0111.desc.climb_let_fly:0 "\n\nUçan bir ejderhaya tutunmak ancak bir ahmağa yakışır — ve bu çılgın maceraya atılmayı seçmiş olsam da, hâlâ aklımın bir kısmı yerinde. Yere düşüyorum ve [dragon.GetNameNoTooltip] uçup gidiyor...\n\n"

 agot_dragon_slaying_events.0111.desc.dive_let_fly:0 "\n\nBu konumdan [dragon.Custom('GetDragonHerHim')]'i durdurma umudum yok. Sırtüstü yuvarlanıp [dragon.GetNameNoTooltip]'in uçup gidişini izliyorum; [dragon.Custom('GetDragonSheHe')] bulanık görüşümden kaybolurken son bir kükreme ve alev patlaması salıyor.\n\n"

 agot_dragon_slaying_events.0111.desc.death_burn_risky:0 "\n\nAlevlerin sıcak olacağını biliyordum; ama #bold bu#! kadar sıcak olacağını hayal edemezdim. Sanki zırhımın içinde pişiyorum; kendi pişmiş iç organlarımı dışarı fışkırtmaya hazır, grotesk bir güveç gibi.\n\nTüm bunlara rağmen [dragon.GetNameNoTooltip]'e doğru son bir atılım deniyorum; tam [dragon.Custom('GetDragonHerHim')]'in [dragon.Custom('GetDragonHerHis')] boğazını açıp yeni bir alev tufanı saldığını görecek kadar zamanım oluyor. Yumuşak bir peynir gibi eridiğimi hissediyorum.\n\n"

 agot_dragon_slaying_events.0111.desc.death_lunge_risky:0 "Açığım kısa ve riskli bir hamle yapmalıyım. İleri atılarak [dragon.GetNameNoTooltip]'i [ROOT.Char.Custom('signature_weapon')]'imle şaşırtmayı umuyorum; ama [dragon.Custom('GetDragonSheHe')] fazla hızlı.\n\n"

 agot_dragon_slaying_events.0111.desc.death_rock_risky:0 "En kısa açıklığı görüyorum ve hamlemi yapıyorum. [ROOT.Char.Custom('signature_weapon')] elimde ileri atılarak canavarla aramdaki mesafeyi kapatmaya çalışıyorum.\n\nAma [dragon.Custom('GetDragonHerHim')]'e ulaşamadan, [dragon.GetNamePossessiveNoTooltip] gürültüsü koca bir kayayı yerinden oynatıyor... Kaya doğrudan kafama çarpıyor ve görüşüm bulanıklaşıyor, sonra #bold kararıyor#!. Öleceğim yer burası mı?\n\n"

 agot_dragon_slaying_events.0111.desc.death_shake_wound_risky:0 "Ağır yaralarıma rağmen ejderhaya hücum etmeyi deniyorum. Çevremde zemin sarsılıyor ve basışım tehlikeli biçimde dengesizleşiyor.\n\nAnsızın yüzüstü düşüyorum ve üstümde dehşet verici bir ses duyuyorum. [dragon.Custom('GetDragonHerHis')] düşmanını almaya gelen bir ejderhanın gazabı."

 agot_dragon_slaying_events.0111.desc.death_sneak_attack:0 "Ejderhanın ani saldırısı beni şoka soktu. Acıyla kıvranarak [dragon.Custom('GetDragonHerHim')]'den uzaklaşmaya çabalıyorum. Savunmam tamamen açıkta...\n\n"

 agot_dragon_slaying_events.0111.desc.death_burn_cautious:0 "Alev tufanından yuvarlanarak kaçmaya çalışıyorum; ama çok yavaşım. Acı dolu bir çığlık atarken bedenimin ta kendisi alev alıyor gibi.\n\n[dragon.GetNameNoTooltip] hoşnutsuzluğumdan zevk alıyor; sanki bir oyun oynarcasına ayaklarımın altına ejderha ateşi sıkıyor... Isıdan kaçmak için yaptığım çarpık dans, zalim bir pantomim.\n\nYakan acı beni alt ediyor."

 agot_dragon_slaying_events.0111.desc.death_lunge_cautious:0 "[dragon.GetNamePossessiveNoTooltip] saldırısından kaçınma ihtiyatımla savunmamı elden bıraktım. Sırtımı açıkta bırakarak yana sürünüyorum ve [dragon.Custom('GetDragonHerHim')]'den yavaşça uzaklaşıyorum."

 agot_dragon_slaying_events.0111.desc.death_rock_cautious:0 "İhtiyatlı yaklaşımıma rağmen, düşen bir kaya tarafından bir anda yandan çarpılıyorum; habersiz yakalanıyorum ve tamamen silahsız kalıyorum. [dragon.GetNameNoTooltip] üzerime çullanıyor.\n\n"

 agot_dragon_slaying_events.0111.desc.death_shake_wound_cautious:0 "Dengesiz bir şekilde [dragon.GetNameNoTooltip]'e ihtiyatla yaklaşıyorum — uzuvlarımdaki acı beni güçsüz ve midesi bulanmış bırakıyor. Kendimi cesaretlendirmek için bir haykırış deniyorum; ama yerine pis bir kusmuk fışkırıyor. Öğürüp sendeleyiyorum. Daha fazla devam edemem.\n\n"

 agot_dragon_slaying_events.0111.desc.death_bite_climb:0 "[dragon.GetNameNoTooltip] [dragon.Custom('GetDragonHerHis')] boynunu kıvırıyor ve bir anda [dragon.Custom('GetDragonHerHis')] kafası, [dragon.Custom('GetDragonHerHis')] sırtına serilmiş ve açıkta bir hâlde bana dönüyor.\n\nEjderhanın çeneleri çevremde kapanırken zayıf bir iç çekiş salıyorum; jilet gibi keskin dişler zırhı, eti ve kemiği birden kesiyor."

 agot_dragon_slaying_events.0111.desc.death_tail_climb:0 "Tırmanışım, kırbaç şaklaması gibi bir sesle yarıda kesiliyor.\n\nGöğsümde ve uzuvlarımda artık acı yok, hiçbir his yok. Ejderhanın kuyruğu, boynumun hemen altındaki omurgamı ezdi ve kendimi cansız bir bebek gibi [dragon.Custom('GetDragonHerHis')] sırtından kayarken hissediyorum.\n\nHareket edemezken, [dragon.Custom('GetDragonSheHe')] beni yutmaya hazırlanırken [dragon.GetNameNoTooltip]'in ruhunun içine bakıyorum..."

 agot_dragon_slaying_events.0111.desc.death_bite_dive:0 "[dragon.GetNameNoTooltip], [dragon.Custom('GetDragonHerHim')]'in altına dalmaya çalışırken beni yakından izliyor. Bir an bile duraksamadan [dragon.Custom('GetDragonHerHis')] çeneleri çevremde kapanıp beni havaya fırlatıyor.\n\nSırtım [dragon.Custom('GetDragonHerHim')]'e dönük, buruşuk bir yığın hâlinde yere düşüyorum."

 agot_dragon_slaying_events.0111.desc.death_tail_dive:0 "Bir şimşek gibi [dragon.GetNamePossessiveNoTooltip] kuyruğu havada şaklıyor; dalışımı denediğim sırada boynumun altındaki omurgamı yakalıyor.\n\nGöğsümde ve uzuvlarımda artık acı yok, hiçbir his yok. Yerde kontrolsüzce yuvarlanıp sırtüstü düşüyorum. Üstümde [dragon.GetNameNoTooltip] doyurucu bir atıştırmalığa hazırlanıyor."

 agot_dragon_slaying_events.0111.desc.confront_bite:0 "[dragon.GetNameNoTooltip] [dragon.Custom('GetDragonHerHis')] çenelerini bana doğru çarpıp zırhımı yakalıyor — ardından altındaki açıkta kalan etimi parçalıyor. Acı, ejderha ateşi gibi tüm bedenimde parıldıyor."

 agot_dragon_slaying_events.0111.desc.confront_tail:0 "[dragon.GetNamePossessiveNoTooltip] kuyruğu bacaklarımı süpürüp altımdan çekiyor. Karnımı korumak için büzülerek yüksek bir iniltiyle yere çarpıyorum. Ardından [dragon.Custom('GetDragonHerHis')] kuyruğu kafama iniyor ve acı dalgaları tüm bedenimi sarıyor."

 agot_dragon_slaying_events.0111.desc.death_crushcrushcrush:0 "Meydan okuyan duruşum, [dragon.GetNameNoTooltip] beni acımasızca zemine ezerken dehşete dönüşüyor...\n\nKemiklerimin, ayak altında ezilen taze dallar gibi çıtırdadığını duyuyorum. İç organlarım göğsümden yukarı, altımdan aşağı itiliyor. Acı dayanılmaz, ama kısa. Paramparçayım."

 agot_dragon_slaying_events.0111.desc.death_crush_move:0 "Ejderhadan yuvarlanarak uzaklaşma girişimim faydasız. Yoldan çekilemeyince zemine çivileniyorum; [dragon.Custom('GetDragonSheHe')] [dragon.Custom('GetDragonHerHis')] ağırlığını üzerime giderek daha fazla yüklüyor.\n\nEzilirken kemiklerimin çatlayıp kırıldığını hissediyorum; kanatları açılmış bir [ROOT.Char.GetWomanMan] gibi..."

 agot_dragon_slaying_events.0111.desc.death_tail_climb_head:0 "Ah, [dragon.GetNameNoTooltip] kuyruğu beni [dragon.Custom('GetDragonHerHis')] kuyruğu ile [dragon.Custom('GetDragonHerHis')] sırtı arasında sıkıştırdı. [dragon.Custom('GetDragonHerHis')] ezici gücüyle havanın ciğerlerimden dışarı itildiğini hissediyorum.\n\n#italic Nefes al, sadece nefes al,#! diyorum kendime; ama hava gelmiyor. Başım dönüyor... Son nefesim azap dolu bir çığlık olacak."

 agot_dragon_slaying_events.0111.desc.death_tail_climb_roll:0 "Ejderhanın sırtından yuvarlanmayı başarıyorum; ama savaş kaybedildi. Kendimi zayıf bir savunmaya yerleştiriyorum, yalnızca [dragon.GetNamePossessiveNoTooltip] kuyruğu tarafından çarpılıp savrulmak için.\n\n"

 agot_dragon_slaying_events.0111.desc.death_shake_climb:0 "Kendi isteğimle [dragon.GetNamePossessiveNoTooltip] sırtında daha yukarılara çekiliyorum; ama vahşi bir silkeleme ile [dragon.Custom('GetDragonSheHe')] beni yere savuruyor. Hiçbir savunma mevzisi bulamıyorum; işte bu son.\n\n"

 agot_dragon_slaying_events.0111.desc.death_shake_roll:0 "[dragon.Custom('GetDragonSheHe')] şiddetle sarsılırken ejderhanın sırtından yuvarlanmayı başarıyorum; ama aynı hızla [dragon.GetNameNoTooltip] bir kez daha üzerime çullanıyor.\n\n"

 agot_dragon_slaying_events.0111.desc.death_fly_hold:0 "Herhangi bir savaş atının bir adamı taşıyabileceğinden kat kat hızlı, alev gibi bir hızla yukarı fırlıyoruz.\n\nSıkı tutunmak için elimden geleni yapıyorum; ama [dragon.GetNameNoTooltip] yolcu taşımaya pek hevesli görünmüyor. Uçuşun ortasında acımasız bir silkeleme ile kendimi havada buluyorum. Altımdaki dünya, giderek artan bir hızla üzerime koşan kahverengi ve yeşil bir bulanıklık gibi.\n\nÇarpışmada kesinlikle öleceğim."

 agot_dragon_slaying_events.0111.desc.death_stop_fly:0 "Canavarın kaçmasına izin vermeliydim. [dragon.Custom('GetDragonHerHis')] pençeleri saç derimi kazıyıp kan yüzümden süzülmeye — sonra #bold boşanmaya#! — başlayınca bu apaçık ortada.\n\nAcı bedenimi parçalarken görüşüm kırmızıya dönüyor. [dragon.GetNamePossessiveNoTooltip] pençeleri bıçak kadar keskin; bir kurt sürüsünün arasındaki koyun gibi beni parçalıyor. İşte böyle sona eriyor..."

 agot_dragon_slaying_events.0111.desc.loss_wounded_one:0 "Sıyrıklar ve morluklarla, bu cehennemî karşılaşmadan yalnızca küçük yaralarla çıktığımı görüyorum."

 agot_dragon_slaying_events.0111.desc.loss_wounded_two:0 "Katliamdan sendeleyerek uzaklaşıyorum; bu cehennemî karşılaşma beni kötü durumda bıraktı."

 agot_dragon_slaying_events.0111.desc.loss_wounded_three:0 "Ölümün eşiğindeyim; bu cehennemî karşılaşmanın bedeli ağır oldu."

 agot_dragon_slaying_events.0111.desc.loss_minor_burns:0 "Şaşırtıcı şekilde savaştan yalnızca küçük yanıklarla çıktım."

 agot_dragon_slaying_events.0111.desc.loss_major_burns:0 "Ne yazık ki yanıklar nedeniyle ağır biçimde izler taşıyorum."

 agot_dragon_slaying_events.0111.desc.loss_unscathed:0 "Nasıl olduysa hiç yeni yara almadan bu işten kurtuldum."

 agot_dragon_slaying_events.0111.desc_vengeance:0 "[ROOT.Char.Custom2('RelationToMeShort', vengeance_candidate)] [vengeance_candidate.GetFirstNameNicknamed] için intikam alamadım."

