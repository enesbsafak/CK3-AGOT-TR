l_english:

 agot_religion_events.0800.t:0 "İlahiler İçin Yiyecek"

 agot_religion_events.0800.desc:0 "[recipient.GetName] önümde, tehditkâr ve uğursuz bir biçimde yükseliyor. [recipient.Custom('DragonSheHe')] henüz beni fark etmemiş olsa da, yaşayan ve nefes alan bir tanrıyla yüzleşmek hâlâ heyecan verici.\n\nYiyecek sandıklarını öne doğru sürükleyip açık bir alana taşıyorum ki [recipient.GetNameNoTooltip] onu tüm ihtişamıyla görebilsin.\n\nYiyeceklerin arkasına geçip ejderhanın dikkatini çekmeye hazırlanıyorum."

 agot_religion_events.0800.a:0 "[recipient.GetNameNoTooltip]! Buradayım!"

 agot_religion_events.0800.b:0 "Bir daha düşününce, buradan uzaklaşmalıyım."

 agot_religion_events.0900.t:0 "Ak Gezenler'e Saygı"

 agot_religion_events.0900.desc:0 "Bu dünyada saygı duymamız gereken dehşetler vardır. [ROOT.Char.GetFaith.GetName]'in bir müridi olarak, Ak Gezenler'in bu dehşetler arasında olduğunu ve öfkelerinin bir kurbanla dindirilebileceğini biliyorum.\n\n[recipient.GetName]'i alıp gecenin karanlığına iniyorum; adaklarımı itaatimin bir göstergesi olarak kabul etmeleri umuduyla [recipient.GetHerHim]'i Ak Gezenler'e kurban etmeye hazırım."

 agot_religion_events.0900.a:0 "Bu yapılmalı."

 agot_religion_events.3000.t:0 "Ritüel Savaşı"

 agot_religion_events.3000.desc:0 "[war.GetName]'in başlamasıyla hem [defender.GetName] hem de [attacker.GetName], [attacker.GetFaith.GetName] inancının geleneklerine uyarak ritüel savaş törenine katılmak üzere birer kaptan ekibi hazırlamak zorundadır.\n\nKazanan takım savaşı kazanır ve kaybedenlerin lideri sürgüne gönderilir ya da tahttan indirilir."

 agot_religion_events.3000.a:0 "İyi şanslar!"

 agot_religion_events.3000.a_attackers_tt:0 "[dummy.GetName], #P saldırganlar#! için bir savaşçı olarak seçildi."

 agot_religion_events.3000.a_defenders_tt:0 "[dummy.GetName], #N savunanlar#! için bir savaşçı olarak seçildi."

 agot_religion_events.3000.a_tt:0 "Ritüel savaş töreni 1 gün içinde başlayacak."

 agot_religion_events.3001.t:0 "Ritüel Savaşı"

 agot_religion_events.3001.desc:0 "Tören başlıyor; [defender.GetName]'in güçleri benimkileri hevesle karşılıyor. Seyirciler izlerken savaş alanındaki mevzilerimizi alıyor ve melee başladığında sevinçle hücuma kalkıyoruz."

 agot_religion_events.3001.a:0 "Savaşa!"

 agot_religion_events.3003.t:0 "Ritüel Savaş: Sonuç"

 agot_religion_events.3003.desc:0 "Toz duman yatışırken yalnızca tek bir şey ortadadır:\n\n"

 agot_religion_events.3003.desc_attacker_won:0 "[defender.GetName] ve [defender.GetHerHis] ekibi, benim çabalarımla yenilgiye uğratıldı!"

 agot_religion_events.3003.desc_attacker_lost:0 "[defender.GetName] ve [defender.GetHerHis] ekibi, tırnaklarıyla kazanmayı başardı!"

 agot_religion_events.3003.desc_attacker_tie:0 "[defender.GetName] ve ben ayakta kalan son iki savaşçıyız. Törenin ve dolayısıyla savaşın seyrini belirlemek için dövüşmeliyiz!"

 agot_religion_events.3003.a:0 "[attacker.GetName] kazandı!"

 agot_religion_events.3003.b:0 "[defender.GetName] kazandı!"

 agot_religion_events.3003.a_single_combat:0 "Bunu çözmenin zamanı geldi."

 agot_religion_events.3003.a_single_combat_tt:0 "Savaşın kaderi için sizinle [defender.GetName] ve [attacker.GetName] arasında teke tek dövüş başlatılacak."

 agot_religion_events.war_winner_defender:0 "[defender.GetName], [war.GetName]'i kazandı"

 agot_religion_events.war_winner_attacker:0 "[attacker.GetName], [war.GetName]'i kazandı"

 agot_religion_events_involved_in_ceremony_actor:0 "[actor.GetName] zaten törensel bir savaş ritüeline dahil"

 agot_religion_events_involved_in_ceremony_recipient:0 "[recipient.GetName] zaten törensel bir savaş ritüeline dahil"

 agot_religion_events.3005.t:0 "Ritüel Savaş: Zafer"

 agot_religion_events.3005.desc:0 "[war.GetName]'de yenildim."

 agot_religion_events.3005.a:0 "Harika."

 agot_religion_events.3006.t:0 "Ritüel Savaş: Yenilgi"

 agot_religion_events.3006.desc:0 "[war.GetName]'de yenildim."

 agot_religion_events.3006.a:0 "Korkunç."

