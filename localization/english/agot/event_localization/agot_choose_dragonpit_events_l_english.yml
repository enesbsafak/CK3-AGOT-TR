l_english:

 agot_choose_dragonpit_event.0001.t:0 "[dragon.GetNameNoTooltip] için bir Ejderha Çukuru"

 agot_choose_dragonpit_event.0001.desc:0 "Binicisiz bir ejderha, öngörülemez ve tehlikeli bir varlıktır. Onu alıkoyacak bir bağ olmadan, canavarın gitmesini veya düşmanca davranmasını engelleyecek pek bir şey yoktur. Kontrolü elimizde tutmak istiyorsak, ejderha barındırılmalıdır. Neyse ki her birinin kendi avantajları ve dezavantajları olan birkaç uygun yer mevcut."

 agot_choose_dragonpit_event.0001.desc_rider:0 "Bir ejderha güçlü bir varlıktır, ancak binicisi olmadan sadakati garanti edilemez. Eğer [Select_CString( rider.IsLocalPlayer, 'I', rider.GetName )] [Select_CString( rider.IsLocalPlayer, 'die', 'dies' )] olursa, [dragon.GetName] gidip vahşi doğaya dönebilir. Kontrolümüzü korumak için [dragon.Custom('GetDragonSheHe')]'nin barındırılması gerekir. Neyse ki her birinin kendi avantajları ve dezavantajları olan birkaç uygun yer mevcut."

 agot_choose_dragonpit_event.0001.a:0 "Bu olur."

 agot_choose_dragonpit_event.0001.a.tt:0 "[dragon.GetNameNoTooltip], seçilen ejderha çukurunda barınacak."

 agot_choose_dragonpit_event.0001.a.tt_2:0 "@warning_icon! #X [dragon.GetNameNoTooltip]'i, [dragon.Custom('GetDragonHerHis')] binicisinden uzak bir çukurda barındırmak, [dragon.Custom('GetDragonHerHim')]'in yolculukta veya savaşta kullanılmasını engeller ve aralarındaki bağın zayıflamasına neden olabilir#!"

 agot_choose_dragonpit_event.0001.b:0 "[dragon.GetNameNoTooltip] özgür olmalı."

 agot_choose_dragonpit_event.0001.c:0 "[dragon.GetNameNoTooltip] bulunduğu yerde mutlu."

 agot_choose_dragonpit_event.0001.d:0 "Hayır, [dragon.GetNameNoTooltip]'i hapsetmeyeceğim."

 dragon_bond_weakening_toast:0 "Zayıflayan Bağ"
