l_english:

 agot_knighthood_maintenance.0005.t:0 "Yaverimin Talihsizliği"

 agot_knighthood_maintenance.0005.desc:0 "Ne yazık ki [my_squire.GetName], [my_squire.GetHerHim]'in şövalye olmasını engelleyen bir rahatsızlık geliştirdi. Bu yüzden, [my_squire.GetHerHim]'i artık yaverim olarak tutamam..."

 agot_knighthood_maintenance.0005.a:0 "Bu yürek parçalıyor!"

 agot_knighthood_maintenance.0005.a.tt:0 "Yaverin, [my_squire.GetHerHim]'i şövalyelikten alıkoyan bir özelliğe sahip olduğu için, [my_squire.GetSheHe] artık senin yaverin olamaz."

 agot_knighthood_maintenance.0006.t:0 "Benim Talihsizliğim"

 agot_knighthood_maintenance.0006.desc:0 "Ne yazık ki, bir gün şövalye olmaktan beni alıkoyan bir rahatsızlık geliştirdim. Bu yüzden, [my_knight.GetName]'in yaveri olarak devam edemem..."

 agot_knighthood_maintenance.0006.a:0 "Bu yürek parçalıyor!"

 agot_knighthood_maintenance.0006.a.tt:0 "Seni şövalyelikten alıkoyan bir özelliğe sahip olduğun için, artık bir yaver olamazsın."

 agot_knighthood_maintenance.0008.t:0 "Şövalye Himayesinin Sonu"

 agot_knighthood_maintenance.0008.desc:0 "Süregelen toplumsal düşmanlıklar yüzünden, yaverim [my_squire.GetName] üzerindeki vesayetim sona ermek zorunda."

 agot_knighthood_maintenance.0008.a:0 "Hayal kırıklığı."

 agot_knighthood_maintenance.0008.desc_nemesis:0 "[my_squire.GetName] ile azılı düşman olduğumuz için, [my_squire.GetSheHe] artık benim yaverim olmayacak."

 agot_knighthood_maintenance.0008.desc_rivalry:0 "[my_squire.GetName] ile rakip olduğumuz için, [my_squire.GetSheHe] artık benim yaverim olmayacak."

 agot_knighthood_maintenance.0008.desc_war_against_knight:0 "[my_squire.GetName] ile aramızda savaş olduğu için, [my_squire.GetSheHe] artık benim yaverim olmayacak."

 agot_knighthood_maintenance.0008.desc_liege_war_against_knight:0 "[my_squire.GetNamePossessive] efendisi ile aramızda savaş olduğu için, [my_squire.GetSheHe] artık benim yaverim olmayacak."

 agot_knighthood_maintenance.0008.desc_liege_war_against_knight_liege:0 "[my_squire.GetNamePossessive] efendisi ile benim efendim arasında savaş olduğu için, [my_squire.GetSheHe] artık benim yaverim olmayacak."

 agot_knighthood_maintenance.0009.t:0 "Şövalye Himayesinin Sonu"

 agot_knighthood_maintenance.0009.desc:0 "Süregelen toplumsal düşmanlıklar yüzünden, artık [my_knight.GetName]'in yaveri olamam."

 agot_knighthood_maintenance.0009.a:0 "Lanet olsun!"

 agot_knighthood_maintenance.0009.desc_nemesis:0 "[my_knight.GetName] ile azılı düşman olduğumuz için, [my_knight.GetSheHe] artık benim şövalyem olmayacak."

 agot_knighthood_maintenance.0009.desc_rivalry:0 "[my_knight.GetName] ile rakip olduğumuz için, [my_knight.GetSheHe] artık benim şövalyem olmayacak."

 agot_knighthood_maintenance.0009.desc_war_against_knight:0 "[my_knight.GetName] ile aramızda savaş olduğu için, [my_knight.GetSheHe] artık benim şövalyem olmayacak."

 agot_knighthood_maintenance.0009.desc_liege_war_against_knight:0 "Efendim ile [my_knight.GetName] arasında savaş olduğu için, [my_knight.GetSheHe] artık benim şövalyem olmayacak."

 agot_knighthood_maintenance.0009.desc_liege_war_against_knight_liege:0 "Efendim ile [my_knight.GetNamePossessive] efendisi arasında savaş olduğu için, [my_knight.GetSheHe] artık benim şövalyem olmayacak."

 agot_knighthood_maintenance.0010.t:0 "Şövalyemin Ölümü"

 agot_knighthood_maintenance.0010.desc:0 "Akıl hocam ve şövalyem [dead_knight.GetName] öldü!\n\nBu, artık bir #V şövalyesiz yaver#! olduğum anlamına geliyor. Bir şövalye olmadan, şövalye olma yolculuğum durdu. Yeterince şanslıysam, başka bir şövalye beni yaveri olarak alabilir. Yine de, yakında yeni bir şövalye bulamazsam, bu şövalyelik yolculuğumun #N sonu#! anlamına gelebilir."

 agot_knighthood_maintenance.0010.a:0 "Bu hayal kırıklığı yaratıyor, ama yas tutmam gerekiyor."

 agot_knighthood_maintenance.0010.a.tt:0 "#V yaver özelliğini ve bugüne dek yapılan ilerlemeyi#! #P koruyacaksın#!. Başka bir şövalye sana ilgi gösterirse, yolculuğuna #V onun yaveri#! olarak devam edebilirsin."

 agot_knighthood_maintenance.0010.b:0 "Bu hayal kırıklığı yaratıyor, ama yeni bir şövalye bulmam gerekiyor."

 agot_knighthood_maintenance.0010.b.tt:0 "Yakındaki şövalyeler durumundan haberdar edilecek ve sana yaverlik teklif edebilirler."

 agot_knighthood_maintenance.0011.t:0 "Alışılmadık Bir İstek"

 agot_knighthood_maintenance.0011.desc:0 "[knightless_squire.GetName], alışılmadık bir istekle yanıma geldi. [knightless_squire.GetHerHis|U] şövalyesi öldü ve [knightless_squire.GetHerHim]'i, bir gün [knightless_squire.GetHerHim]'i şövalye ilan edecek kimsesiz bıraktı! [knightless_squire.GetSheHe|U], tüm hayatını yaver olarak geçiren biri olmaktan korkuyor ve bu yüzden [knightless_squire.GetHerHim]'i kendi yaverim olarak kabul etmem için bana yalvarıyor."

 agot_knighthood_maintenance.0011.a:0 "Tamam, yapacağım."

 agot_knighthood_maintenance.0011.b:0 "Hayır, yaver istemiyorum."

 agot_knighthood_maintenance.0011.b.tt:0 "[knightless_squire.GetNameNoTooltip]'i yaverin olarak #N almayacaksın#!."

 agot_knighthood_maintenance.0012.t:0 "Ölüm Döşeğinde Bir Söz"

 agot_knighthood_maintenance.0012.desc:0 "Şövalyem [dead_knight.GetName] beni çağırdı. [dead_knight.GetSheHe], [dead_knight.GetHerHis] ölüm döşeğinde ve çok az zaman kaldı. Yakınlarda, hepsi ciddi bir tavırla duran birkaç kişi daha var.\n\nZorlukla aldığı bir nefesle [dead_knight.GetNameNoTooltip] beni #V şövalye ilan ediyor!#! Hissettiğim sevincin yerini, bir hizmetkârın [dead_knight.GetSheHe]'in saati bile çıkmadan öleceğini söylemesiyle hızla pişmanlık ve keder duyguları alıyor."

 agot_knighthood_maintenance.0012.a:0 "Şövalye ilan edildim!"

 agot_knighthood_maintenance.0012.a.tt:0 "Şövalye ilan edildin!"

 agot_knighthood_maintenance.0300.t:0 "Yaverlik Statüm Üzerine Düşünceler"

 agot_knighthood_maintenance.0300.desc:0 "Şövalyemin ölmesinin üzerinden epey zaman geçti. Bu süre zarfında, eğitimimi sürdürecek yeni bir şövalye bulamadım. Bu ne kadar hayal kırıklığı yaratsa da, bu yolculuğa tek başıma devam edemeyeceğim acı gerçeğini kabullenme zamanı."

 agot_knighthood_maintenance.0300.a:0 "Yaverlik statümden feragat etme zamanı."

 agot_knighthood_maintenance.0300.a.tt:0 "Yaverlikten emekli oluyorsun; ama gelecekte yine yaver olabilirsin."

 agot_knighthood_maintenance.0300.b:0 "Belki de şövalye statümü satın almanın zamanı geldi..."

 agot_knighthood_maintenance.0300.b.tt:0 "Şövalyeliğini satın alacaksın."

 agot_knighthood_maintenance.0300.c:0 "Görünüşe göre asla şövalye olamayacağım; ama yaverlik yapmayı bırakamayacak kadar çok seviyorum."

 agot_knighthood_maintenance.0300.c.tt:0 "Süresiz olarak yaver kalacaksın."

 agot_knighthood_maintenance.0400.t:0 "Zayıf Performans"

 agot_knighthood_maintenance.0400.desc:0 "Son birkaç yıldaki zayıf yaverlik performansım gözden kaçmadı. Ne yazık ki, görünüşe göre sonunda yakamı bırakmadı! Bu yüzden artık yaver olarak hizmet edemeyeceğim bana bildirildi."

 agot_knighthood_maintenance.0400.a:0 "Bu talihsizlik."

 agot_knighthood_maintenance.0500.t:0 "Çok Önemli Bir Yaver"

 agot_knighthood_maintenance.0500.desc:0 "Unvanımı miras aldıktan sonra, artık yaver olarak kalamayacağım açık. Toplumsal baskının taleplerini karşılamak için, en kısa sürede şövalye olmayı düşünmeliyim."

 agot_knighthood_maintenance.0500.a:0 "Şövalyeme beni şövalye ilan etmesini emredeceğim!"

 agot_knighthood_maintenance.0500.b:0 "Bir vasala beni şövalye ilan etmesini emredeceğim."

 agot_knighthood_maintenance.0500.c:0 "Bir [ROOT.Char.Custom('KingsguardName')] üyesine beni şövalye ilan etmesini emredeceğim."

 agot_knighthood_maintenance.0500.d:0 "Sarayımdaki bir şövalyeye beni şövalye ilan etmesini emredeceğim."

 agot_knighthood_maintenance.0500.e:0 "Şövalyeliğimi satın alacağım!"

 agot_knighthood_maintenance.0500.f:0 "Aslına bakılırsa, artık şövalyelik peşinde koşmayacağım."

 agot_knighthood_maintenance.0501.opening:0 "[my_relation.Custom2('AppropriateGreeting', ROOT.Char)],"

 agot_knighthood_maintenance.0501.desc:0 "Unvanımı miras aldıktan sonra, artık yaver olarak kalamayacağım açık. Toplumsal baskının taleplerini karşılamak için, bana derhal şövalyelik bahşetmeni saygıyla rica ediyorum!"

 agot_knighthood_maintenance.0501.a:0 "Pekâlâ..."

 agot_knighthood_maintenance.0550.t:0 "Yaver Eve Dönüyor"

 agot_knighthood_maintenance.0550.desc:0 "Çocuğum [cancelled_squire_child.GetUIName]'i, [childs_knight.GetUINamePossessive] vesayetinden geri çağırdım.\n\nBu yüzden, [cancelled_squire_child.GetUINameNoTooltip]'in yaver olmayı bırakma zamanı geldi."

 agot_knighthood_maintenance.0550.a:0 "Şimdilik yaver olmayı bırakacaklar."

 agot_knighthood_maintenance.0551.opening:0 "Çocuğumun şövalyesine,"

 agot_knighthood_maintenance.0551.desc:0 "Hanedanımı yakından ilgilendiren meseleler için [cancelled_squire_child.GetName]'i sarayıma geri çağırmak zorundayım; böylece onlar üzerindeki şövalye vesayetin de sona erer."

 agot_knighthood_maintenance.0551.a:0 "Bu üzüntü verici."
