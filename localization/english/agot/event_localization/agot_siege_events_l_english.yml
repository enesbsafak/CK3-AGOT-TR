l_english:

 agot_siege_events.1.desc:0 "Westeros, dondurucu Kuzey'de ve Dorne'un kurak kumlarında bile, savaşta her zaman şövalyelik kurallarına sahip olmuştur. Bu kurallar, uzun ve yıpratıcı bir kuşatmanın ardından bir kalenin nihayet düştüğü bugünkü gibi günlerden daha nadiren bu kadar önem kazanır. Düşman yenildi ve gün kazanıldı. Geriye tek bir soru kalıyor: ele geçirilen kalede oturanlarla ne yapılmalı?"

 agot_siege_events.1.t:0 "Savaşın Kuralları"

 agot_siege_events.1.a:0 "Değerli ne varsa al."

 agot_siege_events.1.b:0 "Bu hisarı kül edin!"

 agot_siege_events.1.c:0 "Değerli tüm sakinleri ele geçir."

 agot_siege_events.1.d:0 "Surların içindekilerin hepsi esir alınacak."

 agot_siege_events.1.e:0 "Önemli olan herkesi öldür!"

 agot_siege_events.1.f:0 "#bold Herkesi#! öldür!"

 agot_siege_events.1.g:0 "Onları rahat bırak."

 agot_siege_events.2.desc:0 "Duvar'ın güneyindeki diyarlarda savaşta her zaman şövalyelik kuralları görülmüştür, ama bu nezaket savaşan Yabanıl kabileleri tarafından nadiren gösterilir. Gece Nöbetçileri'nin yeminli kardeşleri de Yabanıl reisleri de zor bir soruyla karşı karşıyadır: içeridekilerle ne yapılmalı?"

 agot_siege_events.2.t:0 "Savaşın Kuralları"

 agot_siege_events.2.a:0 "Değerli ne varsa al."

 agot_siege_events.2.b:0 "Bu kampı kül edin!"

 agot_siege_events.2.c:0 "Değerli tüm sakinleri ele geçir."

 agot_siege_events.2.d:0 "Hepsi esir alınacak."

 agot_siege_events.2.e:0 "Önemli olan herkesi öldür!"

 agot_siege_events.2.f:0 "#bold Herkesi#! öldür!"

 agot_siege_events.2.g:0 "Onları rahat bırak."
