 agot_house_customizer.0001.t:0 "Hane Özelleştirici"

 agot_house_customizer.0001.desc:0 "#P Hanedan Özelleştirici'ye Hoş Geldiniz#!! Bu özelliği doğru şekilde kullanmak için lütfen şu talimatları izleyin.\n\n#N soyu tükenmiş bir hanedanla#! oynamak isterseniz, o seçeneği seçip hanedanı köken bölgesi altında bulabilirsiniz.\n\nHayatta olan bir hanedanın üyesi olarak oynamak istiyorsanız, o hanedandan birini bulmanız, portresine sağ tıklamanız ve "Hanedana Katıl" seçeneğini seçmeniz gerekir.\n\n@warning_icon! #N Piç olarak başlamak, çocuk sahibi olduktan sonra hanedanınızın bir yan kol hanesinin kurulmasıyla sonuçlanır!"

 agot_house_customizer.0001.a:0 "#N soyu tükenmiş bir hanedanla#! oynamak istiyorum."

 agot_house_customizer.0001.b:0 "#P yaşayan bir hanedanla#! oynamak istiyorum."

