 agot_house_customizer.0026.t:0 "Hanedan Özelleştirici - Güçlü Tohum"

 agot_house_customizer.0026.desc:0 "#V House [ROOT.Char.GetHouse.GetName]#! üyeleri kendine özgü, kuşaklar arası aktarılan bir görünüme sahiptir. Nesiller boyunca diğer hanedanlara kıyasla benzersiz bir görünümü miras bırakmışlardır.\n\nLütfen #V House [ROOT.Char.GetHouse.GetName]#!'in güçlü tohum görünümünü karakterine uygulamak isteyip istemediğini seç."

 agot_house_customizer.0026.a:0 "Evet, karakterim House [ROOT.Char.GetHouse.GetName]'e benzesin!"

 agot_house_customizer.0026.a.tt:0 "@warning_icon! #warning Bu, özel karakterinin görünümünü değiştirecek!#!"

 agot_house_customizer.0026.b:0 "Hayır, karakterimin görünümünü olduğu gibi korumak istiyorum."

