l_english:

 agot_legitimate_house.0001.t:0 "[changed_legitimate_title.GetNameNoTooltip]'in Yeni Meşru Hanesi"

 agot_legitimate_house.0001.desc:0 "Kuşaklar boyunca [new_legitimate_house.GetName] Hanesi, [changed_legitimate_title.GetName]'i bir arada tuttu. Bu süre boyunca birçokları [new_legitimate_house.GetNameNoTooltip] hükümranlığının meşruiyetini sorguladı; hatta bazıları açıkça [old_legitimate_house.GetName] Hanesi'nin eski yönetimini tercih ettiklerini belirtti.\n\n"

 agot_legitimate_house.0001.desc_extinct:0 "Ne var ki, [old_legitimate_house.GetNameNoTooltip] Hanesi'nin yaşayan üyesi kalmadığından ve [new_legitimate_house.GetNameNoTooltip] Hanesi kuşaklar boyu hüküm sürdüğünden, lordlar ve küçük halk da [new_legitimate_house.GetNameNoTooltip] Hanesi'ni [changed_legitimate_title.GetNameNoTooltip]'in gerçek yöneticileri olarak kabul etti."

 agot_legitimate_house.0001.desc_supplanted:0 "[old_legitimate_house.GetNameNoTooltip] Hanesi bir zamanlar ortak hanedanlarının baskın hanesi olmuş olsa da, [new_legitimate_house.GetNameNoTooltip] Hanesi kuşaklar boyu adil ve dürüst yönetimle onların yerini alarak [changed_legitimate_title.GetNameNoTooltip]'in gerçek yöneticileri oldu."

 agot_legitimate_house.0001.desc_default:0 "Artık değil. [old_legitimate_house.GetNameNoTooltip] Hanesi'nin hayatta kalan üyeleri kaçınılmaza öfkelense de, [new_legitimate_house.GetNameNoTooltip] Hanesi'nin kuşaklar boyu süren hükümranlığının onları herkesin gözünde [changed_legitimate_title.GetNameNoTooltip]'in gerçek yöneticileri yaptığı açıktır."

 agot_legitimate_house.0001.desc_end:0 "\n\nGörkemli bir alayla [new_legitimate_holder.GetName], diyarın zaten bildiğini ilan etti — [new_legitimate_house.GetNameNoTooltip] Hanesi'nin evlatları, [changed_legitimate_title.GetNameNoTooltip]'in şimdi ve sonsuza dek gerçek yöneticileridir."

 agot_legitimate_house.0001.desc_end_me:0 "\n\nDiyarın zaten bildiğini ben de ilan ettim — [new_legitimate_house.GetNameNoTooltip] Hanesi'nin evlatları, [changed_legitimate_title.GetNameNoTooltip]'in şimdi ve sonsuza dek gerçek yöneticileridir."

 agot_legitimate_house.0001.a:0 "[new_legitimate_house.GetNameNoTooltip] Hanesi diyarı daha parlak bir geleceğe taşısın."

 agot_legitimate_house.0001.a.flavor:0 "Tanınmış bir yönetici haneyle, [changed_legitimate_title.GetNameNoTooltip] gelecek kuşaklar boyunca refah içinde olmalı."

 agot_legitimate_house.0001.b:0 "Ne fars bu! [changed_legitimate_title.GetNameNoTooltip]'in gerçek yöneticileri [old_legitimate_house.GetNameNoTooltip]'tir!"

 agot_legitimate_house.0001.b.flavor:0 "Kader hanenizin aleyhine döndü, ama kader bir kez daha dönebilir..."

 agot_legitimate_house.0002.t:0 "[legitimate_house_title_for_maintenance.GetNameNoTooltip]'in Gerçek Yöneticileri"

 agot_legitimate_house.0002.desc:0 "Kuşaklar boyunca atalarınız [legitimate_house_title_for_maintenance.GetName]'i yönetti. [legitimate_house.GetNameNoTooltip] hükümranlığı altındaki tüm tebaanın huzuru ve istikrarı için büyük işler yapıldı, büyük fedakârlıklar verildi.\n\nArtık değil.\n\n[new_house.GetNameNoTooltip] Hanesi, [legitimate_house.GetNameNoTooltip] Hanesi'nin yerini aldı ve artık ailenizin elinde olması gereken toprakları yönetiyor! Kişisel arzularınızın bir önemi yok; yaşadığınız sürece birçokları, [title_holder.GetName]'den daha gerçek bir hakka sahip olduğunuzu düşünecek. Güçlü bir [title_holder.GetWomanMan] için bir tehditsiniz ve [title_holder.GetSheHe] bunu biliyor."

 agot_legitimate_house.0002.a:0 "Gerçekleşecek bir tehdit! [legitimate_house.GetNameNoTooltip] Hanesi bir kez daha hükmedecek!"

 agot_legitimate_house.0002.a.flavor:0 "Hakkınız olanı geri almanın zamanı geldi — [legitimate_house_title_for_maintenance.GetNameNoTooltip]'in hükümranlığı."

 agot_legitimate_house.0002.b:0 "Atalarımın yaptıklarını umursamıyorum. Kaderimden memnunum."

 agot_legitimate_house.0002.b.flavor:0 "Geçmiş geçmiştir ve onu değiştirmek istemezsin."

 agot_legitimate_house.0003.t:0 "[legitimate_house.GetNameNoTooltip], [changed_legitimate_title.GetNameNoTooltip]'i Kaybetti"

 agot_legitimate_house.0003.desc:0 "[legitimate_house.GetName] Hanesi için Felaket! "

 agot_legitimate_house.0003.desc_extinct:0 "Kuşaklar boyu süren hükümranlığın ardından, [previous_holder.GetTitledFirstName] son nefesini verdi ve [previous_holder.GetHerHis] ölümüyle [legitimate_house.GetNameNoTooltip] Hanesi'nin soyu sona erdi. [changed_legitimate_title.GetName] toprakları artık [new_holder.GetHouse.GetName] Hanesi'nden [new_holder.GetTitledFirstName]'e geçiyor; [legitimate_house.GetNameNoTooltip] Hanesi'nin adı yalnızca tarihin sayfalarında anılacak."

 agot_legitimate_house.0003.desc_supplanted:0 "[new_holder.GetHouse.GetName] Hanesi'nden [new_holder.GetTitledFirstName], hakkımız olan toprakları aldı ve şimdi [changed_legitimate_title.GetName]'i yönetiyor. [legitimate_house.GetNameNoTooltip] Hanesi için karanlık bir gün, ama biz hâlâ yaşıyoruz ve bu hakareti unutmayacağız! Damarlarımızda bu kan aktığı sürece, [changed_legitimate_title.GetNameNoTooltip]'in gerçek yöneticileri biziz!"

 agot_legitimate_house.0003.desc_default:0 "[new_holder.GetHouse.GetName] Hanesi'nden [new_holder.GetTitledFirstName], [changed_legitimate_title.GetName]'in yeni hükümdarı olarak hüküm sürüyor ve [legitimate_house.GetNameNoTooltip] Hanesi tarihsel yerinden indirildi. [legitimate_house.GetNameNoTooltip] davasını destekleyen herkes için karanlık bir gün."
