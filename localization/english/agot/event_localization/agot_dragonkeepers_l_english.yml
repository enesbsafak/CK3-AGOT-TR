l_english:

 agot_dragonkeepers.0001.t:0 "Ejderha Bakıcıları Tarikatı Kuruldu"

 agot_dragonkeepers.0001.desc:0 "Bir [dragonpit|E]'in tamamlanmasıyla, bir gün içinde barınacak ejderhaları korumaya yeminli sadık muhafızlardan oluşan bir tarikat kurmanın vakti geldi. Bu muhafızlar, #bold ejderha bakıcıları#!, yalnızca ejderhalarımı korumakla kalmayacak, aynı zamanda ejderha bakıcılığının kadim geleneklerinin ve bilgisinin korunmasını da sağlayacak.\n\n[dragonkeepers|E]'ime komuta etmek kolay bir iş olmayacak. Neyse ki, bu tarikata önderlik etmesi için aklımda bir aday var: [head_dragonkeeper.GetName]."

 agot_dragonkeepers.0001.a:0 "Mükemmel!"

 agot_dragonkeepers.0002.t:0 "Yeni Baş Ejderha Bakıcısı Atandı"

 agot_dragonkeepers.0002.desc:0 "Ejderha Bakıcıları Tarikatı, şanlı tarikatlarının bana hizmet edecek yeni bir başını atadı.\n\nKadim Valyria geleneklerini gözeterek, [dragonkeepers|E]'e önderlik etmesi için [head_dragonkeeper.GetName] seçildi. Bana iyi hizmet etsin."

 agot_dragonkeepers.0002.a:0 "Mükemmel!"

 agot_dragonkeepers.0100.t:0 "Ejderha Bakıcıları"

 agot_dragonkeepers.0100.desc:0 "[dragonpit|E]'in restorasyonu tamamlandığına göre, onu donatmak için #bold Ejderha Bakıcıları Tarikatı'nı#! yeniden tesis etmemiz hayati önem taşıyor. Bu onurlu muhafızlar, bir gün içinde barınacak ejderhaları koruyup gözetecek; ayrıca ejderha bakıcılığının kadim geleneklerinin ve bilgisinin korunmasını sağlayacak.\n\nNeyse ki, [dragonkeepers|E]'e kimin önderlik edeceği konusunda bazı seçenekler belirdi."

 agot_dragonkeepers.0100.a:0 "[head_dragonkeeper.GetName] iyi bir seçim!"

 agot_dragonkeepers.0100.a.tt:0 "Başları [head_dragonkeeper.GetName] olan bir Ejderha Bakıcıları Tarikatı kurulacak. "

 agot_dragonkeepers.0100.b:0 "Kendim biri seçeceğim."

 agot_dragonkeepers.0100.b.tt:0 "Bir Ejderha Bakıcıları Tarikatı kurulacak ama liderlerini elle ataman gerekecek."

 agot_dragonkeepers.0101.t:0 "Ejderha Bakıcıları Geri Dönüyor"

 agot_dragonkeepers.0101.desc:0 "Uzun yıllardır ilk kez Ejderha Dağı yeniden bir ejderha bakıcıları tarikatı tarafından korunuyor. [head_dragonkeeper.GetName] liderleri olarak atandı."

 agot_dragonkeepers.0101.a:0 "Umalım ki [head_dragonkeeper.GetSheHe] bize iyi hizmet eder."

 agot_dragonkeepers.0300.t:0 "Ejderha Bakıcıları Daha Fazla Fon İstiyor"

 agot_dragonkeepers.0300.desc:0 "[head_dragonkeeper.GetName], mevcut aylık bütçelerinin, yeni acemileri eğitmek için yeterli donanım satın almalarını imkânsız kıldığını bildiriyor.\n\n"Lütfen, [ROOT.Char.GetLadyLord], tarikatın kasası taze acemilerin ihtiyaçlarını karşılayamıyor. Düzgün donanım ve eğitim olmadan ejderhalarınızın ihtiyaçlarıyla gerektiği gibi ilgilenemeyiz. Bu hafta tarikattan üç kişiyi yaralı halde üstatlara göndermek zorunda kaldım."\n\n"Belki fon artırımı, ya da [ROOT.Char.GetLadyLord] uygun görürse..." [head_dragonkeeper.GetSheHe] [head_dragonkeeper.GetHerHis] cübbesinden bir tomar çıkarıyor, "kendi imkânlarınızla tedarik etmeyi tercih ederseniz, elimde bir de donanım listesi var.""

 agot_dragonkeepers.0300.a:0 "Ejderha bakıcılarının fonunu artıracağım."

 agot_dragonkeepers.0300.b:0 "Donanımı doğrudan satın alacağım."

 agot_dragonkeepers.0300.c:0 "Eldekilerle idare etmek zorundalar."

 agot_dragonkeepers.0301.t:0 "Ejderha Bakıcıları Açlık Gürültüleri Duyuyor"

 agot_dragonkeepers.0301.desc:0 "[head_dragonkeeper.GetName], ejderha çukurunuzun yiyecek stoğunun azaldığını bildiriyor. Kıtlama kararına yaklaşıyorlar.\n\n"[ROOT.Char.GetLadyLord], ejderhalarınıza hizmet etmek için yaşıyoruz. En iyi yem hayvanları, #italic tabii ki#!, öncelikle onlara ayrılır. Görüyorsunuz ya, sağlıklı bir ejderhanın iştahı aylık bütçemizi ciddi biçimde zorlayabilir."\n\n[head_dragonkeeper.GetHerHis|U] bakışı utanç ifadesiyle yere kayıyor. "Tarikatın yemesi için daha fazla tedarik etmemize yardım etmeniz gerek, yoksa sıkı kıtlama uygulamak zorunda kalacağız.""

 agot_dragonkeepers.0301.b:0 "Derhal daha fazla yiyecek ithal et."

 agot_dragonkeepers.0302.t:0 "Ejderha Bakıcıları Bir Kayıp Verdi"

 agot_dragonkeepers.0302.desc:0 "[head_dragonkeeper.GetName], [dead_dragonkeeper.GetName]'in öldürüldüğünü bildiriyor! Ayrıca [head_dragonkeeper.GetSheHe] bunun, tarikata verilen yetersiz fonun bir sonucu olduğunu ve önlenebileceğini söylüyor.\n\n"Geçimimizi sağlayabiliyoruz ama tüm endişelere hızla çözüm bulamıyoruz, [ROOT.Char.GetLadyLord|U]. Mevcut fonumuz yeterli insan gücü sağlamıyor. [dragon.GetName]'in bağları düzenli bakım bekliyordu ama bakım programımız haftalarca geride. Daha fazla #italic talihsiz kaza#! yaşanmaması için şu an çift vardiya çalışıyoruz..." [head_dragonkeeper.GetSheHe] derin bir iç çekiyor.\n\n"Elimizden geleni yaptık, [ROOT.Char.GetLadyLord|U]. [dragon.GetNameNoTooltip] [dead_dragonkeeper.GetHerHim]'e sevgi bile beslemiş görünüyordu ama sonunda gömecek bir beden bile bırakmadı.""

 agot_dragonkeepers.0302.a:0 "Bu utanç verici!"

 agot_dragonkeepers.0303.t:0 "Tarikatta Yaralanma"

 agot_dragonkeepers.0303.desc:0 "[head_dragonkeeper.GetName], tarikata giden yetersiz fon yüzünden [injured_dragonkeeper.GetName]'in yaralandığını bildiriyor.\n\n"İnsanları #italic ateşten yapılmış et#! ile başa çıkacak şekilde eğitmek hiç de kolay bir iş değil!" [head_dragonkeeper.GetNameNoTooltip], [head_dragonkeeper.GetHerHis] ejderha bakıcılarının, diğer zırhlardan farklı olarak kapsamlı eğitim gerektiren siyah zırhlarla donatıldığını vurguluyor.\n\n"Ejderhalar, daha toy bir ejderha bakıcısına alışmakta çok yavaş olabilir. Bizim bağ türümüz yavaş kurulur ve bir ejderhanın güveni kolay kazanılmaz. Eğitim için daha fazla fon, tarikatınızın zarar görmesini önlemeye yardımcı olabilir.""

 agot_dragonkeepers.0303.a:0 "Bu utanç verici!"

 agot_dragonkeepers.0304.t:0 "Ejderha Çukurunda Yakalanan Sinsilik"

 agot_dragonkeepers.0304.desc:0 "[head_dragonkeeper.GetName], ejderha çukuruna gizlice girmeye çalışan bir davetsiz misafirin yakalandığını bildiriyor. Muhafızlar tarafından dövülmüş ama başka bir zarar görmeden gözaltına alınmış.\n\nDavetsiz misafir #italic hafifçe sorgulanmış#! ve birkaç kadeh fazla içtikten sonra iddia üzerine içeri girdiğini iddia ediyor. Kendisine [thief.GetName] diyor ve [thief.GetFaith.HighGodName] hakkı için bir daha asla yapmayacağına yemin ediyor.\n\n"Yine de, [dragon.GetName] iyi içgüdülere sahip; ona casus olduklarını düşünüp düşünmediğini sorabiliriz." [head_dragonkeeper.GetNameNoTooltip] kıkırdıyor."

 agot_dragonkeepers.0304.a:0 "Mükemmel iş."

 agot_dragonkeepers.0304.b:0 "Davetsiz misafiri bir ejderhaya yedir."

 agot_dragonkeepers.0305.t:0 "Ejderham için Bir Lakap"

 agot_dragonkeepers.0305.desc:0 "[head_dragonkeeper.GetName], Ejderha Bakıcılarının [dragon.GetName] ile öylesine yakınlaştığını ki ona bir lakap taktıklarını bildiriyor.\n\n"Ona #italic [dragon.GetNickname]#! demeye başladık, [ROOT.Char.GetLadyLord|U]. Böyle muhteşem bir yaratık için uygun bir isim.""

 agot_dragonkeepers.0305.a:0 "Öyle mi?"

 agot_dragonkeepers.0305.a.tt:0 "[dragon.GetName|V] '[dragon.GetNickname|V]' [nickname|E]'sini kazandı"

 agot_dragonkeepers.0305.b:0 "O #emp benim#! ejderham ve siz ona [dragon.Custom('GetDragonHerHis')] asıl adıyla hitap edeceksiniz."

 agot_dragonkeepers.0305.b.tt:0 "[dragon.GetName|V] '[dragon.GetNickname|V]' [nickname|E]'sini kazanamayacak"

 agot_dragonkeepers.0306.t:0 "Ejderha Çukurunda Bulunan Genç Ziyaretçi"

 agot_dragonkeepers.0306.desc:0 "[head_dragonkeeper.GetName], [child.GetName]'in ejderha çukuruna gizlice girdiğini bildiriyor!\n\n[child.GetSheHe|U] hiçbir olay olmadan, sapasağlam bulundu; ama ejderhalara karşı #italic sağlıklı olmaktan öte#! bir merak sergiledi. Ejderha bakıcılarının çoğu çocukla ilgilendi, [child.GetHerHis] sorularını yanıtladı.\n\nTarikat, daha fazla #italic hırslı genç ejderha binicisinin#! erişimini engellemek için güvenlikte gerekli değişiklikleri çoktan yaptı; ama genç [child.GetNameNoTooltip] bu deneyimden yalnızca daha da büyülenmiş görünüyor."

 agot_dragonkeepers.0306.a:0 "Umarım bu yalnızca bir heves değildir."

 agot_dragonkeepers.0307.t:0 "Ejderha Bakıcıları Beklenmedik Bir Misafir Getiriyor"

 agot_dragonkeepers.0307.desc:0 "[head_dragonkeeper.GetName], [child.GetName]'in ejderha çukuruna gizlice girdiğini bildiriyor!\n\n[child.GetSheHe|U] sapasağlam bulundu; yanakları gözyaşı lekeli bir depo dolabına büzülmüş halde. Ejderha bakıcıları [child.GetHerHim]'i sakinleştirmeyi başardı ama [child.GetName] ejderhalara karşı ciddi bir korku sergiledi.\n\nEjderha bakıcıları çocuğu kalemin güvenliğine kadar eşlik etmek zorunda kaldı."

 agot_dragonkeepers.0307.a:0 "Umarım bu yalnızca bir hevestir."

 agot_dragonkeepers.0308.t:0 "Ejderha Çukurumda Yeni Bir Yumurta Bulundu"

 agot_dragonkeepers.0308.desc:0 "#bold Ejderha Bakıcıları Tarikatı#!'mın lideri [head_dragonkeeper.GetName], [dragon_parent.GetName]'i barındıran odadan güvenle bir yumurta çıkarıldığını bildiriyor.\n\n[head_dragonkeeper.GetNameNoTooltip], geleneksel siyah zırhlarıyla yarım düzine ejderha bakıcısından oluşan küçük bir alayı yönetiyor. [head_dragonkeeper.GetSheHe|U] kenarda dururken, süslü bir mangal taşıyan iki adam öne çıkıp onu ayaklarımın dibine bırakıyor.\n\n"Onu sabahın erken saatlerinde bulduk, [ROOT.Char.GetLadyLord|U]. Güzel bir yumurta, [dragon_parent.GetNameNoTooltip]'in ihtişamının bir kanıtı!"

 agot_dragonkeepers.0308.a:0 "Öyle mi?"

 agot_dragonkeepers.0308.a_tt:0 "[dragon_parent.GetName] bir yumurta yumurtladı."

 agot_dragonkeepers.0309.t:0 "Yeni Ejderha Bakıcısı Acemileri Görevde Başarılı"

 agot_dragonkeepers.0309.desc:0 "[head_dragonkeeper.GetName], yeni işe alınan acemilerin, fonunuzun doğrudan bir sonucu olarak son derece iyi ilerleme kaydettiğini bildiriyor.\n\nAcemiler iyi maaş alıyor ve olağanüstü talim ediliyor. Valyria dilleri programın önünde ilerliyor ve zeminler hiç bu kadar temiz olmamıştı. Ejderha çukurumun yeni acemileri avluda talim yaparken moral yüksek görünüyor."

 agot_dragonkeepers.0309.a:0 "Harika!"

 agot_dragonkeepers.0310.t:0 "Ejderha Bakıcıları Daha Derin Gizemlere Daliyor"

 agot_dragonkeepers.0310.desc:0 "[head_dragonkeeper.GetName], bir dizi ejderha bakıcısının, ejderhalar hakkında içgörü sağlamak amacıyla ortak bir araştırma yürüttüğünü bildiriyor.\n\n"Kadim Valyria'nın #italic Felaket'i#! ile kaybolan ejderha bakıcılığı bilgimizdeki boşluklara ilişkin birkaç ilginç gözlem yaptık. Bu içgörüler, [dragon.GetName]'in [dragon.Custom('GetDragonHerHis')] yaşamı boyunca daha iyi bakılmasına ve yolunuza çıkanlara karşı daha korkunç bir manzara sergilenmesine yol açabilir.""

 agot_dragonkeepers.0310.a:0 "İlginç..."

 agot_dragonkeepers.0311.t:0 "Ejderha Çukurunda Zayıflamış Zincirler"

 agot_dragonkeepers.0311.desc:0 "[head_dragonkeeper.GetName], ejderha çukurunda ejderhaları bağlamak için kullanılan zincirlerin birçoğunun zayıf ve düşük kaliteli olduğunu bildiriyor. Normal bütçeleri değişimi karşılayamıyor.\n\nOrijinal zincirler, tarikatın kasasını genişletmek amacıyla en ucuz teklifi veren kişiye dövülmüştü."

 agot_dragonkeepers.0311.b:0 "Yeni zincirlerin bedelini doğrudan ben ödeyeceğim."

 agot_dragonkeepers.0312.t:0 "Ejderha Bakıcıları Yerel Tedarikçiler Tarafından Geri Çevrildi"

 agot_dragonkeepers.0312.desc:0 "[head_dragonkeeper.GetName], birkaç çiftlik arazisinin ejderha çukurunun taleplerini karşılamaya #italic isteksiz#! olduğunu bildiriyor. Üretmeleri gereken yiyecek miktarıyla tazminatın eşleşmediğini iddia ediyorlar ve ejderha bakıcılarının bütçesi fiyat artışlarını karşılayamıyor.\n\n"Bir anlaşma yapılmazsa yiyecek tedariki sıkıntıya girebilir, [ROOT.Char.GetLadyLord|U]." [head_dragonkeeper.GetSheHe], [head_dragonkeeper.GetHerHis] ellerini birleştirerek yalvaran bir jest yapıyor.\n\n"Belki bu girişimi destekleyebilir ya da bizim adımıza pazarlık etmesi için #italic otoritenizin#! bir temsilcisini gönderebilir misiniz?""

 agot_dragonkeepers.0312.b:0 "Toplu yiyecek stoğunu doğrudan ithal et."

 agot_dragonkeepers.0312.d:0 "Anlaşma yapması için kâhyanı gönder."

 agot_dragonkeepers.0314.t:0 "Hastalık Ejderha Çukuruna İniyor"

 agot_dragonkeepers.0314.desc:0 "[head_dragonkeeper.GetName], ejderha [dragon.GetName]'in hastalandığını bildiriyor.\n\nDüşük bütçe ve kötü koşulların birleşimi, [dragon.GetNamePossessiveNoTooltip] düzensiz ve kayıtsız davranışına yol açtı.\n\n"Koca alevler bile zaman zaman pırpır edebilir..." [head_dragonkeeper.GetSheHe] düşünceli biçimde söyleniyor."

 agot_dragonkeepers.0315.t:0 "[child_with_egg.GetFirstNamePossessiveNoTooltip] Ziyareti"

 agot_dragonkeepers.0315.desc:0 "Kapıda yumuşak bir tıklama duyuyorum ve dönüp [ROOT.Char.Custom2('RelationToMeShort', child_with_egg)] [child_with_egg.GetFirstName]'in ejderha yumurtasını taşıyarak odaya çekingen biçimde girdiğini görüyorum. [child_with_egg.GetSheHe] [child_with_egg.GetHerHis] parmaklarını metalik pullarda gezdirdikçe [child_with_egg.GetHerHis] gözleri yaşarıyor. "Hiç sıcaklık hissetmiyorum ve yumurtadan çıkmıyor..."\n\n[child_with_egg.GetSheHe|U] bana bakıyor, [child_with_egg.GetHerHis] yüzünden bir gözyaşı süzülüyor. "Bana yardım eder misiniz?""

 agot_dragonkeepers.0315.a:0 "Senin için başka bir yumurta seçeceğim."

 agot_dragonkeepers.0315.a_tt:0 "[child_with_egg.GetNameNoTooltip]'e hangi yumurtayı vereceğini seçeceksin"

 agot_dragonkeepers.0315.b:0 "Ona daha fazla zaman ver, evlat."

 agot_dragonkeepers.0315.c:0 "Bir ejderhaya binmek istiyorsan, birini sahiplenmen gerekecek."

 agot_dragonkeepers.0315.c_tt:0 "[child_with_egg.GetNameNoTooltip]'in bağ kurmayı deneyeceği, ejderha çukurundaki bir ejderhayı seçeceksin"

 agot_dragonkeepers.0315.d:0 "Senin sızlanmalarına ayıracak vaktim yok."

 agot_dragonkeepers.0315.d_tt:0 "[child_with_egg.GetNameNoTooltip] sorunlarına alternatif çözümler arayabilir..."

 agot_dragonkeepers.0316.t:0 "[child_with_egg.GetNameNoTooltip] için Yeni Bir Yumurta"

 agot_dragonkeepers.0316.desc:0 "[child_with_egg.GetNameNoTooltip]'e vermek için yeni bir yumurta seç ve [child_with_egg.GetHerHis] eski yumurtasını güvenliği için al."

 agot_dragonkeepers.0316.a:0 "Bu işi görür..."

 agot_dragonkeepers.0316.b:0 "Bir düşününce, boş ver."

 agot_dragonkeepers.0318.t:0 "[child_with_egg.GetFirstNamePossessiveNoTooltip] Atılımı"

 agot_dragonkeepers.0318.desc_child_tamed_dragon:0 "Ejderha çukurunun yanından geçerken uzak bir kükreme duyuyorum. Binaya koşup [child_with_egg.GetName]'i [childs_dragon.GetName]'in yanında dururken buluyorum; aralarında taze bir bağ kurulmuş. [child_with_egg.GetHerHis|U] cüretkârlığı meyvesini verdi."

 agot_dragonkeepers.0318.desc_child_failed_at_taming_dragon:0 "Ejderha çukurunda bir çığlık yankılanıyor; koşup ejderha bakıcılarının bir canavarı inine geri zorladığını ve [child_with_egg.GetName]'in bir duvara yaslanmış soluk soluğa durduğunu görüyorum. Görünüşe göre [child_with_egg.GetSheHe] bir ejderhayla bağ kurmaya öylesine can atmış ki, talimat almadan çukura gizlice girmiş. En azından [child_with_egg.GetSheHe] yaşıyor."

 agot_dragonkeepers.0318.desc_child_died_while_taming_dragon:0 "Odamın kapısını açtığımda, ağır bir battaniyeye sarılı bir şeyi tutan iki ejderha bakıcısı görüyorum. Battaniyeyi açtıklarında ortaya yanmış ve kömürleşmiş bir ceset olan [child_with_egg.GetName] çıkıyor. Bir ejderhayla bağ kurma telaşında, talimat almadan çukura girdiğini anlatıyorlar.\n\nBu, uğursuz bir alamet olarak kabul edilecek."

 agot_dragonkeepers.0318.a:0 "Olan oldu."

 agot_dragonkeepers.0319.t:0 "[child_with_egg.GetNameNoTooltip] için Bir Ejderha"

 agot_dragonkeepers.0319.desc:0 "[child_with_egg.GetNameNoTooltip]'in bağ kurmayı deneyeceği bir ejderha seç."

 agot_dragonkeepers.0319.a:0 "$agot_dragonkeepers.0316.a$"

 agot_dragonkeepers.0319.b:0 "$agot_dragonkeepers.0316.b$"
