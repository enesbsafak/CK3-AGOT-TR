l_english:

 agot_dynastic_stability.0002.t:0 "Sürpriz Bir Miras"

 agot_dynastic_stability.0002.desc:0 "Arada sırada birileri ölür. Çoğu zaman bunun bir önemi yoktur; ancak bazen, gerçekten de şanslı bir olay olabilir. Bu da o durumlardan biri. Ne kadar uzak olursa olsun akrabalarımdan biri öldü ve kaderin cilvesiyle onun varisi ben oldum. Elbette bunun küçük bir pürüzü var. Onların Hanesinden değilim ve bazıları bunu yeni topraklarımın meşruiyetiyle ilgili bir sorun olarak görebilir.\n\nBöylece önüme bir seçenek çıkıyor. Yeni topraklarımla birlikte, toprakların geleneksel olarak ait olduğu Hane'nin adını da alabilir; veraset çizgisinin meşru ve kesintisiz görülmesini sağlayabilirim."

 agot_dynastic_stability.0002.a:0 "Yeni bir isim almanın en akıllıcası olduğu görülüyor"

 agot_dynastic_stability.0002.b:0 "Asla! Ben her zaman bir [GetPlayer.GetHouse.GetBaseName] olacağım!"

 agot_dynastic_stability.2000.t:0 "Yeniden Doğan Piçler"

 agot_dynastic_stability.2000.desc:0 "[ROOT.Char.Custom('GetCourtType')]'ıma bir dilekçe ulaştı.\n\n[bastard.GetName], [empire_title.GetName]'in [ROOT.Char.Custom('GetQueenKing')]'i olan benden, soyundan geldiği [bastard.GetHouse.MakeScope.Var('bastard_house_of').House.GetName] Hanesi'nin armasını ve adını taşımak için özel bir izin verilmesini talep ediyor."

 agot_dynastic_stability.2000.a:0 "Bu dilekçeyi kabul edeceğim."

 agot_dynastic_stability.2000.b:0 "Hayır, [bastard.GetSheHe]'in buna hakkı yok."

 agot_dynastic_stability.2000.legitimization_granted:0 "Talebin Kabul Edildi"

 agot_dynastic_stability.2000.legitimization_rejected:0 "Talebin Reddedildi"

 agot_dynastic_stability.2000.legitimization_rejected_desc:0 "[top_liege.GetName], ata Hanenizin armasını üstlenme dilekçenizi reddetti."
