l_english:

 agot_nights_watch.0004.t:0 "Bir Gedik!"

 agot_nights_watch.0004.desc:0 "Bugün normal başlamadı. Duvar karakolları gıcırdadı, yakınımızdaki ağaçlar hışırdayıp sarsıldı — #N bir şeyler ters.#!\n\nTüm siyah kardeşler endişelenirken, bir yüzbaşı kalabalığın içinden koşarak bana geliyor. #bold "Duvarımız yarılıyor!"#! diye haykırıyor.\n\nDışarıya, Duvar'ın ötesine baktığımda ağaçların sinsi sinsi sallandığı görülüyor. Söylentiler çoğu zaman Yabanılların ve devlerin geleceğini söylerdi; şimdiye dek sarhoş şakaları ve korkak adamların lakırdısı sayılırdı...\n\nYabanıllar, ışığa maruz kalan çürük bir tahıl çuvalındaki hamamböcekleri gibi gediğin içinden akıyor; yalnızca bu manzara karşısında midem daha da bulanıyor. #bold Binlerce yıldır Duvar hiç yıkılmadı; bu kez bizim Nöbet'imizde yıkılmasına izin veremeyiz.#!"

 agot_nights_watch.0004.a:0 "Daha kötülerini gördük!"

 agot_nights_watch.0024.t:0 "Gece Nöbetçileri Yeniden Kuruldu"

 agot_nights_watch.0024.desc:0 "Yok edildiklerinden beri surlarımız ve halkımız, uzak kuzeyde pusuya yatmış vahşilerin ve diğer tanrıtanımaz yaratıkların tehdidi altındaydı.\n\nNöbet artık yeniden kurulduğuna göre, sınırlarımızın güvende olduğundan ve halkımızın kuzeydeki tüm tehlikelerden uzak olduğundan emin olabiliriz."

 agot_nights_watch.0024.a:0 "Düzen artık yeniden sağlandı."

 agot_nights_watch.0024.b:0 "Brandon'un Armağanı da geri verilecek."

 agot_nights_watch.0024.c:0 "Nöbet, tüm ihtişamıyla yeniden kurulmalı!"

 agot_nights_watch.0025.t:0 "Gece Nöbetçileri Feshedildi"

 agot_nights_watch.0025.desc:0 "Halkımız, Gece Nöbetçileri ve onların Duvar'ı tarafından çok uzun süredir tehdit ediliyor!\n\nDuvar'ın kontrolünü ele geçirdikten sonra, siyah kardeşliğe nihayet son vermenin ve binlerce yıldır elimizden çalınan özgürlüğü ve barışı halkımıza geri vermenin zamanı geldi."

 agot_nights_watch.0025.a:0 "Bu sonsuza dek yankılanacak..."

 agot_nights_watch.0026.t:0 "Yeni Bir El Meşaleyi Kavrıyor"

 agot_nights_watch.0026.desc:0 "Selefimin nöbetinin sona ermesinden bu yana yalnızca birkaç gün geçti; pek çok düşünceyi tartmak için birkaç gün.\n\nKomutanlık görevindeki kardeşlerim gerçekten nöbete tüm güçleriyle mi hizmet etti? Açık bir maharet ve sağduyulu düşünce mi gösterdiler? Yoksa kararlılıkları gevşeyip hünerleri atalete mi bırakıldı? Bu tür kardeşler önemli mevkilerinin keyfini sürerken, pek çok genç adam büyük vaat ve zekâ gösterdi.\n\nYüce Kumandan olarak, bu ellerin bir kısmının değişmesi gerekse bile, nöbetin yetkin ellerde kalmasını sağlamak benim görevim."

 agot_nights_watch.0026.a:0 "Komutanlarım büyük yetkinlik kanıtladı."

 agot_nights_watch.0026.b:0 "Komutanlarım arzulanan çok şey bırakıyor."

 agot_nights_watch.2001.t:0 "Gece Nöbetçileri'ne Katılma İsteği"

 agot_nights_watch.2001.desc:0 "Çocuğum [child.GetFirstName] her zaman tuhaf bir kuştu; ciddi bir kaza olmadıkça mirasa geçmeye niyeti yok ve Duvar'ın ötesindeki karagözlülerden ve cinlerden sürekli sızlanıp durur.\n\n[child.GetSheHe] yanıma [child.Custom('quirk_pos_pp')] geldiğinde hiç şaşırmıyorum. "[ROOT.Char.GetLadyLord], kararımı verdim," diyor [child.GetSheHe], bana karşı hiç konuşmadığı kadar cüretkâr bir tavırla. "Gece Nöbetçileri'ne katılacağım. #bold Siyah giymek istiyorum.#!""

 agot_nights_watch.2001.a:0 "Git ve onurla hizmet et."

 agot_nights_watch.2001.b:0 "Senin için başka planlarım var."

 agot_nights_watch.2002.t:0 "Gece Nöbetçileri'ne Katılma İsteği"

 agot_nights_watch.2002.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sibling') )] [sibling.GetFirstName], çalışma odama [sibling.Custom('quirk_pos_adverb')] etrafına yayılan bir enerjiyle giriyor. [sibling.GetSheHe|U] [sibling.Custom('quirk_pos_present')] ve [sibling.Custom('quirk_pos_adverb')] bana yaklaşıyor. \n\n"[sibling.Custom2('RelationToMe', ROOT.Char )], kararımı verdim," diyor [sibling.GetSheHe], sözler ağzından ejderha alevi gibi fışkırıyor. "Gece Nöbetçileri'ne katılacağım. #bold Siyah giymek istiyorum.#!""

 agot_nights_watch.2002.a:0 "Git ve onurla hizmet et."

 agot_nights_watch.2002.b:0 "Senin için başka planlarım var."

 agot_nights_watch.2003.t:0 "Gençlere Yol Ver"

 agot_nights_watch.2003.desc:0 "Saçlarım ağarıp eklemlerim ağrırken, bu toprağın yönetimine en güzel yıllarımı zaten verip vermediğimi ve toprağın daha genç bir [heir.GetWomanMan] tarafından daha iyi yönetilebileceğini düşünüyorum.\n\nBenim [heir.Custom('DaughterSon')] [heir.GetName] genç ve dinç bir [heir.GetLadyLord]; [ROOT.Char.GetPrimaryTitle.GetNameNoTier] için çok iyilik yapabilir. Ve edineceği tecrübe, House [ROOT.Char.GetHouse.GetName]'i bekleyen gelecek savaşlarda paha biçilemez olur. [nightswatch.GetName] adamlarının kurumu, [ROOT.Char.GetCulture.GetCollectiveNoun] tarafından yüksek itibar gören kadim ve saygın bir tarikattır; yaşlı bir lorduzun krallığın ve topraklarının iyiliği için topraklarını ve unvanlarını terk etmesi hiç de duyulmamış bir şey değil..."

 agot_nights_watch.2003.a:0 "[heir.GetName]'in dizginleri eline almasının zamanı geldi."

 agot_nights_watch.2003.a.tt:0 "[heir.GetName] lehine tahttan çekiliyorsun"

 agot_nights_watch.2003.b:0 "Bu yaşlı kemiklerde hâlâ hayat var!"

 agot_nights_watch.2004.t:0 "Hanedanımın İstikrarı"

 agot_nights_watch.2004.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', craven_heir)] [craven_heir.GetFirstName], [ROOT.Char.GetDynasty.GetNameNoTooltip] hanedanı için bir utanç kaynağı. [craven_heir.GetSheHe] [primary_title.GetNameNoTier]'i miras alırsa bu, hanedanımız için felaket olur. Bu hanedanın dizginleri [good_heir.GetFirstName]'in ellerinde çok daha iyi hizmet görür.\n\nGeleceğimizi kesin bir çöküşten korumak bana düşüyor. Veraset zincirinden zayıf bir halkayı çıkarmak zordur, ama seçenekler var. [craven_heir.GetHerHim]'i bir ava çıkarırsam ona bir seçim sunabilirim. [craven_heir.GetSheHe|U] kuzeye, Duvar'a gidip tüm unvanlarından vazgeçebilir ya da talihsiz, kaçınılmaz bir kaza geçirebilir."

 agot_nights_watch.2004.a:0 "[craven_heir.GetHerHim]'i bir gezintiye çıkaracağım ve ültimatomumu orada ileteceğim."

 agot_nights_watch.2004.a.tt:0 "[craven_heir.GetNameNoTooltip], Nöbet ile [craven_heir.GetHerHis] hayatı arasında seçim yapmaya zorlanacak."

 agot_nights_watch.2004.b:0 "[craven_heir.GetSheHe|U] bir [ROOT.Char.GetDynasty.GetName]; iyi ya da kötü."

 agot_nights_watch.2005.t:0 "Kuzeye Bir Yolculuk"

 agot_nights_watch.2005.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', craven_heir)] [craven_heir.GetFirstName] taleplerime boyun eğdi. Kendini bir savaş atının altında ezilmiş ya da bir hendeğe boğulmuş bulmaktansa, [craven_heir.GetSheHe] yorucu kuzey yolculuğuna başlayacak. Yarın [craven_heir.GetSheHe] hanedan üyelerine veda edecek ve onlara, krallığa hizmet etmek için doğuştan hakkını feda etme yönünde zor kararı aldığını bildirecek. Ne bir eş alacak, ne toprak tutacak, ne de çocuk sahibi olacak; büyük hanedanı [craven_heir.GetHerHis] zayıflığıyla lekelemeyecek.\n\n[good_heir.GetName], House [ROOT.Char.GetDynasty.GetName]'in dizginlerini eline alacak ve [craven_heir.GetFirstNameNoTooltip] Duvar'ın kayıtlarının karlı yıllıklarına karışırken kanımızın sağlam ve güçlü kalmasını sağlayacak. Belki [craven_heir.GetSheHe], [ROOT.Char.GetCapitalLocation.GetName]'te biriktirmeyi başaramadığı onur ve gücü kuşanabilir."

 agot_nights_watch.2005.a:0 "Daha büyük iyilik için."

 agot_nights_watch.2005.a.tt:0 "[craven_heir.GetNameNoTooltip] kuzeye yola çıkacak."

 agot_nights_watch.2006.t:0 "Gecenin İçine"

 agot_nights_watch.2006.desc:0 "[craven_heir.GetFirstName], [craven_heir.GetSheHe] [ROOT.Char.GetCapitalLocation.GetName]'te görünmez olmazsa ne olacağı konusunda bilgilendirildiğinde, beti benzi attı ve kekelediği bir onay mırıldandı.\n\nErtesi sabah [craven_heir.GetHerHim] için haber saldığımda, [craven_heir.GetSheHe] hiçbir yerde yoktu ve [craven_heir.GetHerHis] odası dağıtılmıştı. [craven_heir.GetName] aranırken [ROOT.Char.GetCapitalLocation.GetName] altüst edildi, ama bulgular içler acısıydı. Küçük halk, gecenin kör vaktinde, herhangi bir ulak için fazlasıyla soylu bir ata binmiş bir figürün şehirden çıktığından söz ediyor.\n\n[craven_heir.GetName]'in şimdi nereye gittiğini yalnızca [ROOT.Char.GetFaith.HighGodNameAlternate] bilir. Bu, şu anki sorunumu çözse de, ileride peşimi bırakmamak üzere geri dönebilir..."

 agot_nights_watch.2006.a:0 "[craven_heir.GetSheHe] nasıl kaçabildi?!"

 agot_nights_watch.2007.t:0 "Korkağın Korları"

 agot_nights_watch.2007.desc:0 "[craven_heir.GetName] dişlerini gıcırdatıyor; tehdidimin dalgası yüzünde yayılırken. "[ROOT.Char.GetCapitalLocation.GetName]'te hüküm sürme hakkı doğuştan benim. Onu benden alamazsın," diyor [craven_heir.GetSheHe]; talebimle tutuşturulan sesinde bir ateş var. Belki de bu çocukta benden bir parça vardır.\n\n[craven_heir.GetName]'in makamıma dair iddiasından vazgeçmeyeceği açık. Şimdi benim [ROOT.Char.Custom2('RelationToMe', craven_heir)]'imin gerçekten omurga sahibi olup olmadığına, yoksa bu böğürten alevin yalnızca korkunun korlarıyla beslenen bir gösteri ateşi mi olduğuna karar vermeliyim. [craven_heir.GetSheHe] hâlâ House [ROOT.Char.GetDynasty.GetName]'in sonu mu olacak?"

 agot_nights_watch.2007.a:0 "Ültimatomum boş bir tehdit değildi, [craven_heir.Custom('GirlBoy')]."

 agot_nights_watch.2007.a.success:0 "[craven_heir.GetFirstNameNoTooltip] ölür"

 agot_nights_watch.2007.a.failure:0 "[craven_heir.GetFirstNameNoTooltip] suikast girişiminden sağ kurtulur"

 agot_nights_watch.2007.b:0 "[craven_heir.Custom('GirlBoy')] omurga sahibi mi oldu?! Belki [craven_heir.GetSheHe], House [ROOT.Char.GetDynasty.GetNameNoTooltip]'in sonu olmaz."

 agot_nights_watch.9901.t:0 "Sur'da Yeni Lord Kumandan"

 agot_nights_watch.9901.desc:0 ""Bir kuzgun [new_holder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'den haber getirdi, lordum." Ulak hızlıca eğilip incelemem için mektubu bana uzatıyor.\n\n[previous_holder.GetTitledFirstName]'in vefatının ardından, Gece Nöbetçileri'nin Yeminli Kardeşleri yeni kumandanları olarak [new_holder.GetFirstNameNoTooltip] [new_holder.GetHouse.GetBaseName]'i seçti."

 agot_nights_watch.9901.stark:0 "Kış Geliyor."

 agot_nights_watch.9901.a:0 "Ve şimdi onun nöbeti sona erdi."

 agot_nights_watch.0027.t:0 "[nightswatch_candidate.GetFirstNameNoTooltip] [nightswatch_candidate.GetHouse.GetNameNoTooltip] Siyah Giyiyor"

 agot_nights_watch.0027.t.lowborn:0 "[nightswatch_candidate.GetFirstNameNoTooltip] Siyah Giyiyor"

 agot_nights_watch.0027.intro:0 "[nightswatch_candidate.GetFirstNameNicknamed]'e beslediğim hoşnutsuzluğun başladığı günden beri gün saymayı bıraktım. Aklımdan pek çok fikir geçti; ama kaçı gerçekten meyve verdi?"

 agot_nights_watch.0027.mid.trusting:0 "Aramızı bir #italic düşmanlık#! açmış olsa da, eminim [nightswatch_candidate.GetSheHe] bana daha fazla zarar verme niyeti taşımıyordu."

 agot_nights_watch.0027.mid.nocompassion:0 "[nightswatch_candidate.GetHerHis] ölümünü öğrenmek beni üzmezdi; ama [nightswatch_candidate.GetHerHim]'i başka bir kader buldu. Ve [nightswatch_candidate.GetSheHe] bana karşı ne planlıyorsa, artık bunun için endişelenmeme gerek yok."

 agot_nights_watch.0027.mid:0 "Eminim [nightswatch_candidate.GetSheHe]'nin planlarında bana yönelik entrikalar ve düzenler vardı; ama artık bunun kaba taslaklardan öteye geçmediğine inanıyorum."

 agot_nights_watch.0027.mid2.sender:0 "Benim irademle ve çok basit bir emirle, [nightswatch_candidate.GetSheHe] dünyanın kıyısında sürgüne mahkûm edildi. [nightswatch_candidate.GetSheHe]'nin giyeceği siyah, [nightswatch_candidate.GetHerHim]'i gözümün önünden uzağa, krallığa karşı işlediği suçların... ve #bold bana#! karşı işlediklerinin hesabını vermesi için gönderdiğim günün anısını diri tutacak."

 agot_nights_watch.0027.mid2:0 "[actor.GetName]'in emriyle, [nightswatch_candidate.GetFirstNameNoTooltip] artık Duvar'da sürünecek; siyah giymeye ve [nightswatch_candidate.GetHerHis] yeminlerine uymaya zorlanacak. [nightswatch_candidate.GetSheHe|U] artık ne aileye, ne dostlara ne de müttefiklere sahip olacak; yalnızca her türden suçluya arkadaşlık edecek."

 agot_nights_watch.0027.mid2.blamemw:0 "[nightswatch_candidate.GetHerHis] sayısız kötülüğü yüzünden, [nightswatch_candidate.GetFirstNameNoTooltip] artık Duvar'da sürünecek; siyah giymeye ve [nightswatch_candidate.GetHerHis] yeminlerine uymaya zorlanacak. [nightswatch_candidate.GetSheHe|U] artık ne aileye, ne dostlara ne de müttefiklere sahip olacak; yalnızca her türden suçluya arkadaşlık edecek."

 agot_nights_watch.0027.outro:0 "Bir bakıma, [nightswatch_candidate.GetSheHe]'nin bana yaptıklarının bir tür adaletle karşılığı... değil mi?"

 agot_nights_watch.0027.a:0 "[nightswatch_candidate.GetSheHe|U] hak ettiğini buldu."

 agot_nights_watch.0027.b:0 "Öyle, ama [nightswatch_candidate.GetHerHis] kaderinden zevk alacağım"

 agot_nights_watch.0027.c:0 "[nightswatch_candidate.GetSheHe|U] artık [nightswatch_candidate.GetHerHis] kusurlarının kefaretini ödeyebilir."

 agot_nights_watch.0027.d1:0 "Şimdi, işi bitirmenin zamanı."

 agot_nights_watch.0027.d2:0 "Adaleti boş ver; ben intikam istiyorum!"
