### TODO NOT-IN-ST: agot_nights_watch.2004.desc [AGOT: My [ROOT.Char.Custom2('RelationToMe', craven_heir)] [craven_heir.GetFirstName] is an embarrassment to the [ROOT.Char.GetDynasty.GetNameNoTooltip] dynasty. Should [craven_heir.GetSheHe] inherit [primary_title.GetNameNoTier] it would spell disaster for our house. The reigns of this dynasty would be far better served in the hands of [good_heir.GetFirstName].\n\nIt falls to me to protect our future from sure downfall. Removing a weak link from the chain of succession is difficult, but there are options. Should I take [craven_heir.GetHerHim] out on a hunt I can give [craven_heir.GetHerHim] the choice. [craven_heir.GetSheHe|U] can ride north to The Wall and forsake all titles, or [craven_heir.GetSheHe] will suffer an unfortunate, unavoidable accident.]
 agot_nights_watch.2004.desc:0 "My [ROOT.Char.Custom2('RelationToMe', craven_heir)] [craven_heir.GetFirstName] is an embarrassment to the [ROOT.Char.GetDynasty.GetNameNoTooltip] dynasty. Should [craven_heir.GetSheHe] inherit [primary_title.GetNameNoTier] it would spell disaster for our house. The reigns of this dynasty would be far better served in the hands of [good_heir.GetFirstName].\n\nIt falls to me to protect our future from sure downfall. Removing a weak link from the chain of succession is difficult, but there are options. Should I take [craven_heir.GetHerHim] out on a hunt I can give [craven_heir.GetHerHim] the choice. [craven_heir.GetSheHe|U] can ride north to The Wall and forsake all titles, or [craven_heir.GetSheHe] will suffer an unfortunate, unavoidable accident."
