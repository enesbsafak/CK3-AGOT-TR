### TODO NOT-IN-ST: agot_nights_watch.0026.desc [AGOT: It has been but a few days since my predecessor's watch ended, a few days to ponder over many a thought.\n\nHave my brothers in command truly serviced the watch to their utmost ability? Have they shown clear skill and rational thinking? Or has their resolve laxed, and skill left to idle? While such brothers have enjoyed their positions of importance, many younger men have shown great promise and intellect.\n\nAs Lord Commander it is my duty to make sure the watch remains in capable hands, even if that may entail some of those hands changing.]
 agot_nights_watch.0026.desc:0 "It has been but a few days since my predecessor's watch ended, a few days to ponder over many a thought.\n\nHave my brothers in command truly serviced the watch to their utmost ability? Have they shown clear skill and rational thinking? Or has their resolve laxed, and skill left to idle? While such brothers have enjoyed their positions of importance, many younger men have shown great promise and intellect.\n\nAs Lord Commander it is my duty to make sure the watch remains in capable hands, even if that may entail some of those hands changing."
