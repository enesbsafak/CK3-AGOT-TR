### TODO NOT-IN-ST: agot_nights_watch.2006.desc [AGOT: When [craven_heir.GetFirstName] was informed of what would come to pass if [craven_heir.GetSheHe] did not make [craven_heir.GetHerselfHimself] sparse at [ROOT.Char.GetCapitalLocation.GetName], [craven_heir.GetSheHe] blanched and stuttered an agreement.\n\nThe next morning when I sent for [craven_heir.GetHerHim], [craven_heir.GetSheHe] was nowhere to be found, and [craven_heir.GetHerHis] room had been ransacked. [ROOT.Char.GetCapitalLocation.GetName] was upturned in the search for [craven_heir.GetName], but the findings were regrettable. The smallfolk speak of a figure riding out in the dead of night atop a steed far too fine for any messenger.\n\nOnly [ROOT.Char.GetFaith.HighGodNameAlternate] knows where [craven_heir.GetName] has gotten to now. Though this solves my current problem, it may return to bite at my heels later...]
