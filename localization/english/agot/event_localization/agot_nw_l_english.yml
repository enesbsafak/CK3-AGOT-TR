### TODO NOT-IN-ST: agot_nights_watch.2003.desc [AGOT: As my hair greys and my joints ache I ponder whether I have already given my best years to the stewardship of this land, and that it might be better served by a younger [heir.GetWomanMan].\n\nMy [heir.Custom('DaughterSon')] [heir.GetName] is a young [heir.GetLadyLord] in their prime, and could do much good for [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. And the experience they garner would be invaluable in the future battles that await House [ROOT.Char.GetHouse.GetName]. The institution of the men of the [nightswatch.GetName] is an ancient and venerable order that is held in high regard by [ROOT.Char.GetCulture.GetCollectiveNoun], and it is not completely unheard of for an older lord to forsake their lands and titles for the betterment of the realm and their holdings...]
 agot_nights_watch.2003.desc:0 "As my hair greys and my joints ache I ponder whether I have already given my best years to the stewardship of this land, and that it might be better served by a younger [heir.GetWomanMan].\n\nMy [heir.Custom('DaughterSon')] [heir.GetName] is a young [heir.GetLadyLord] in their prime, and could do much good for [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. And the experience they garner would be invaluable in the future battles that await House [ROOT.Char.GetHouse.GetName]. The institution of the men of the [nightswatch.GetName] is an ancient and venerable order that is held in high regard by [ROOT.Char.GetCulture.GetCollectiveNoun], and it is not completely unheard of for an older lord to forsake their lands and titles for the betterment of the realm and their holdings..."
