 exile_is_adult_and_needs_more_soldiers:0 "Hikâyede ilerlemek için #N daha fazla askere ihtiyacınız var#!. Hikâyenin yeterli askeri güce ulaştığınızı fark etmesi #V 300-365 gün#! sürebilir."

