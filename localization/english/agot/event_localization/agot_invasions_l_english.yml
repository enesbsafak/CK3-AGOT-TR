 agot_targaryen_exile_invasion.0003.desc:0 "Kızışmış bir pazarlığa kilitlenmiş iki hükümdar; birinin şakaklarında taç var, benimkiler hâlâ çıplak. Ama hissettiğim şey yorgunluk mu, kafamdaki o ani ağırlık mı, yoksa [claimed_title.GetName] tacı bu kadar yakın mı?\n\nBir yüz buruşturması düşüncelerimi ele vermiş olmalı; [petitioned_ruler.GetName] bilen bir gülümsemeyle sırıtıyor. "Harika bir [claimed_title.GetHolder.GetTitleAsNameNoTooltip] olacaksınız, hem de yakında — en geç [TopScope.ScriptValue('agot_time_to_win_invasion_for_underage_exiles_value')] yıl içinde. Birliklerimiz ve altınımız bunu sağlayacak. Ve lütfen endişelenmeyin; anlaşmamızın sizin tarafınızı... unutursanız, size hatırlatırız."\n\n[petitioned_ruler.GetSheHe|U] anlaşmayı mühürlemek için kadehi kaldırıyor, son bir kadeh şerefe."

