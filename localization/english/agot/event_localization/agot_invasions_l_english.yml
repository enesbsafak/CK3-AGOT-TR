l_english:

 agot_targaryen_exile_invasion.0301.t:0 "Son Saat"

 agot_targaryen_exile_invasion.0301.desc:0 "Westeros'a yolculuk neredeyse sona erdi. Yıllarca süren planlamanın ardından nihayet tahtımı işgal eden gasıplara meydan okuyabilecek bir güç kurdum. Gelecek planlarımı kafamda evirirken, [egg_granter.GetName] adında varlıklı bir yerlinin [ROOT.Char.Custom('GetCourtType')]'ma girdiği bilgisi veriliyor.\n\n"Majesteleri," diye başlıyor [egg_granter.GetSheHe], "yıllardır yolculuğunuzu yakından takip ettim. Zaferlerinizin, yenilgilerinizin ve hırslarınızın hikâyeleri sayısız gece bana eğlence oldu."\n\n"Hatta beni büyülediler. Size yardım etmemi engelleyen şey yalnızca korkularımdı. Ama artık korkak olmayacağım. Lütfen bu üç ejderha yumurtasını, size ve nihai iktidara dönüşünüze bir dostluk jesti olarak kabul edin. Yıllardır bende duruyorlar; ama size ve hanenize daha iyi hizmet ederler.""

 agot_targaryen_exile_invasion.0301.a:0 "Harika bir hediye, teşekkürler!"

 agot_targaryen_exile_invasion.0301.generated_eggs:0 "Üç ejderha yumurtası kazandınız"

 agot_targaryen_exile_invasion.0301.teaser_eggs:0 "#italic Nazik bir hediye; ama sonuçta sadece taşlar, değil mi?#!"

 agot_targaryen_exile_invasion.0305.t:0 "Ejderhalar ve Düşmanlar"

 agot_targaryen_exile_invasion.0305.desc:0 "Bana ve [ROOT.Char.Custom('GetCourtType')]'ma tuhaf haberler ulaştı. Essos'un bir yerinde sinsice bekleyen sürgün Targaryen hanedanının kalıntıları #italic ejderhalar#! çıkarmış. Yaşayan, soluk alan ve uçan canavarlar. Ejderhaları çıkaranın özellikle [hatcher.GetName] olduğu söyleniyor. Her neyse, bu kuşkusuz savaşın geldiği anlamına geliyor. Hem de hızla."

 agot_targaryen_exile_invasion.0305.a:0 "[ROOT.Char.GetFaith.HighGodName], bizi kurtar!"

 agot_targaryen_exile_invasion.0306.t:0 "Ejderhalar ve Düşmanlar"

 agot_targaryen_exile_invasion.0306.desc:0 "Bana ve [ROOT.Char.Custom('GetCourtType')]'ma kötü haberler ulaştı. Her nasılsa, [targaryen_exile.GetName] ve [targaryen_exile.GetHerHis] davasına katılanlar ejderha edinmiş. Bunların sıradan söylentiler ya da ateşli fısıltılar olmadığı söyleniyor. Hayır, Targaryen hanedanının dünyanın yıllardır görmediği bir gücü kuşkusuz yeniden kazandığı açık.\n\nSeçeneklerim sınırlı; ama net olan şu ki #bold savaş geliyor#!."

 agot_targaryen_exile_invasion.0306.marry_me_to_you:0 "Kendimle [targaryen_exile.GetFirstName] arasında barışçıl bir evlilik teklif et."

 agot_targaryen_exile_invasion.0306.marry_heir_to_you:0 "Varisim ile [targaryen_exile.GetFirstName] arasında barışçıl bir evlilik teklif et."

 agot_targaryen_exile_invasion.0306.a:0 "Bu ejderhaların büyümesi yıllar alacak... değil mi?"

 agot_targaryen_exile_invasion.0307.t:0 "Düşmanlar ve Ejderhalar"

 agot_targaryen_exile_invasion.0307.desc:0 "Sabahın erken saatlerinde beni uyandıran ejderhaların yumuşak cıvıltıları değil, bir haberci. [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'den bir mektup taşıyan bir haberci.\n\n"Yüce Targaryen Hanesi'ne," diye başlıyor mektup. "Evinizden çok uzun süredir uzaksınız. Westeros'tan çok uzun süredir uzaksınız. Geçmiş arkamızda; şimdiki eylemlerimizi onun belirlemesine izin vermemeliyiz. Bu nedenle, davasınızı Demir Taht'a katmanızı ve böylece gelecek savaşı önlemenizi öneriyorum. Dönüşünüzde sizi bağrımıza basacağız. Artık Demir Taht'ın düşmanı olmayacaksınız, Demir Taht da sizin düşmanınız olmayacak. Ailelerimizi birleştireceğiz! [targaryen_exile.GetName] ile [marriage_offer.GetName] arasında bir evlilik bizi tek vücut yapacak. Birlikte önleyebileceğimiz şiddeti ve sarabileceğimiz yaraları düşünün.""

 agot_targaryen_exile_invasion.0307.a:0 "Gelen fırtınayı dindirmeye yönelik zavallı bir girişim."

 agot_targaryen_exile_invasion.0307.b:0 "Sözlerinde akıl var. Tekliflerini kabul ediyorum."

 agot_targaryen_exile_invasion.0400.t:0 "Uyanan Ejderha"

 agot_targaryen_exile_invasion.0400.desc:0 "Nihayet Westeros işgalimi başlatmanın zamanı geldi. Gasıplar atalarımın tahtını çok uzun süredir kirletiyor; bu yanlışı düzeltmenin zamanı geldi.\n\nKaptanlarımı toplamayı bitirirken, davama katılmak üzere birkaç bin yerel askerin geldiği ve Westeros'un gerçek [ROOT.Char.Custom('GetQueenKing')|U]'ni desteklemeye hevesli olduğu bilgisi veriliyor."

 agot_targaryen_exile_invasion.0400.a:0 "Westeros, Ejderha uyandı!"

 agot_targaryen_exile_invasion.0400.b:0 "Henüz pek hazır değilim."

 agot_targaryen_exile_invasion.0400.b_tt:0 "Demir Taht'a manuel olarak savaş ilan etmeniz gerekecek. Bunu sağlamak için yeni bir savaş gerekçesi kazandınız."

 agot_targaryen_exile_invasion.0400.b_tt_patrons:0 "#warning Meşruiyetçi destekçileriniz hâlâ Demir Taht'ı yakında fethetmenizi bekliyor.#!"

 agot_targaryen_exile_invasion.0400.c:0 "[iron_throne_holder.GetShortUIName]'e taht için bir talep göndereceğim."

 agot_targaryen_exile_invasion.0401.t:0 "Yükselen Ejderha"

 agot_targaryen_exile_invasion.0401.desc:0 "Yolculuk bitti ve ben zafere ulaştım! Gasıplar devrildi ve ejderha, onca yılın ardından [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'e geri döndü.\n\nTahtımı kazanmış olsam da mücadelem henüz bitmedi. Artık hamilerimin borçları, halkımın yalvarışları ve artık vasalım olanların entrikalarıyla uğraşmak zorundayım."

 agot_targaryen_exile_invasion.0401.a:0 "Ateş ve Kan."

 agot_targaryen_exile_invasion.0401.b:0 "Ben 'Onarıcı' olarak anılacağım!"

 agot_targaryen_exile_invasion.0401.tt:0 "Savaş bittiğinde, yardımına koşan müttefikler senden yüksek görüşe sahip değilse resmi müttefikliğin sona erecek."

 agot_targaryen_exile_invasion.0402.t:0 "Taht Gasıbının Cezası"

 agot_targaryen_exile_invasion.0402.desc:0 "Gasıp, [defender.GetFirstName] [defender.GetHouse.GetName], zincirler içinde önüme getiriliyor. [defender.GetSheHe|U] tahtımı haksız yere çok uzun süredir işgal etti. [defender.GetHerHis] eylemleri yüzünden ne kadar ölüm ve yıkım yaşandı? Onur, [defender.GetSheHe]'nin bu suçların bedelini ödemesini gerektiriyor.\n\n[defender.GetNameNoTooltip]'e ne yapılması gerektiğini tartarken askerlerim ve sarayım beni ihtiyatla izliyor. Sonuçta bu, [ROOT.Char.Custom('GetQueenKing')] olarak ilk eylemim olacak."

 agot_targaryen_exile_invasion.0402.a:0 "[defender.GetSheHe|U] idam edilmeli."

 agot_targaryen_exile_invasion.0402.b:0 "[defender.GetHerHim]'i sonra yargılayacağım."

 agot_targaryen_exile_invasion.0410.t:0 "Ejderhanın Talepleri"

 agot_targaryen_exile_invasion.0410.desc:0 "[iron_throne_holder.GetName] benden önce [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'e ulaştı.\n\nBu sinir bozucu olsa da, bana ait olanı geri almak için acı sona kadar savaşmaya hazırım. Yine de belki savaşmaya gerek olmadığını kabul ediyorum. Bir zamanlar [iron_throne_holder.GetNameNoTooltip] bana [iron_throne_holder.GetHerHis] yanında bir yer teklif etmişti. Belki ona bana katılması için bir teklif gönderebilirim."

 agot_targaryen_exile_invasion.0410.a:0 "Tahtı doğrudan talep edeceğim. Onları bağışlayacağım."

 agot_targaryen_exile_invasion.0410.b:0 "Tahtı doğrudan talep edeceğim; ama bir evliliği kabul edeceğim."

 agot_targaryen_exile_invasion.0411.t:0 "Ejderhanın Talepleri"

 agot_targaryen_exile_invasion.0411.desc:0 "[targaryen_invader.GetName] [ROOT.Char.Custom('GetCourtType')]'ma haber gönderdi.\n\n[targaryen_invader.GetSheHe|U] [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i işgal etmenin eşiğinde! [targaryen_invader.GetSheHe|U] binlerce asker topladı ve uzun ve acı bir savaş yürütmeye hazır. Ama bir talep gönderdiler:\n\n"

 agot_targaryen_exile_invasion.0411.desc_throne_demanded_outright:0 "Tahtı barışçıl bir şekilde teslim etmem karşılığında bağışlanacağım ve günlerimi özgür bir saray mensubu olarak geçirmeme izin verilecek."

 agot_targaryen_exile_invasion.0411.desc_throne_demanded_with_marriage_offer:0 "[targaryen_invader.GetNameNoTooltip] evlenmemizi ve hak iddialarımızı birleştirmemizi öneriyor. Ama [targaryen_invader.GetSheHe] [targaryen_invader.Custom('GetQueenKing')] olacak. Ben değil."

 agot_targaryen_exile_invasion.0411.a:0 "Tamamen teslim olacağım. Krallık için."

 agot_targaryen_exile_invasion.0411.b:0 "Teslim olup evlilik tekliflerini kabul edeceğim."

 agot_targaryen_exile_invasion.0411.c:0 "Onlara atalarının makamı Dragonstone'u teklif edeceğim; ama tahtı değil."

 agot_targaryen_exile_invasion.0411.d:0 "Asla, taht benim."

 agot_targaryen_exile_invasion.0412.t:0 "Karşı Teklif"

 agot_targaryen_exile_invasion.0412.desc:0 "[iron_throne_holder.GetName] bana bir karşı teklif gönderdi: Ben Dragonstone'a hapsedilirken [iron_throne_holder.GetSheHe] [iron_throne_holder.Custom('GetQueenKing')] olarak kalacak."

 agot_targaryen_exile_invasion.0412.a:0 "Peki, zaten savaşmak istemiyordum."

 agot_targaryen_exile_invasion.0412.b:0 "Bir hakaret. Birlikleri toplayın, savaş olacak."

 agot_targaryen_exile_invasion.0413.t:0 "Talepler Reddedildi"

 agot_targaryen_exile_invasion.0413.desc:0 "[iron_throne_holder.GetName] taleplerimi reddetti. Savaşı seçtiler."

 agot_targaryen_exile_invasion.0413.a:0 "Savaş olacak!"

 agot_targaryen_exile_invasion.0500.t:0 "Yeni Bir [royal_bastard_monarch.Custom('GetQueenKing')|U]"

 agot_targaryen_exile_invasion.0500.desc:0 "[ROOT.Char.Custom('GetCourtType')]'ma [royal_bastard_monarch.GetName]'in bir kraliyet piçi olduğunun ortaya çıktığı haberi ulaştı. [royal_bastard_monarch.GetHerHis] kimliğine inanılacaksa, bu onların benim yakın akrabam olduğu anlamına geliyor.\n\nGörünüşe göre onlar da gasıbın [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i işgalinden memnun değil; [royal_bastard_monarch.GetSheHe] Westeros'un [royal_bastard_monarch.Custom('GetQueenKing')|U] olmak için kendi seferini başlattı. [royal_bastard_monarch.GetSheHe|U] epey bir taraftar toplamışa benziyor; zira Westeros savaşa sürüklendi.\n\nBu haber üzerine kara kara düşünürken aklıma karanlık bir düşünce geliyor. Ya ben [ROOT.Char.Custom('GetQueenKing')] olmak için seçilmemişsem? Ya her zaman [royal_bastard_monarch.GetNameNoTooltip]'in kaderiyse? Güçlerimi [royal_bastard_monarch.GetHerHis]'e katıp onların yolculuğuna yardım etmeli miyim? Sonuçta bu, eve daha erken dönmek demek."

 agot_targaryen_exile_invasion.0500.a:0 "Eve dönmek istiyorum. Onlara katılmalıyım."

 agot_targaryen_exile_invasion.0500.b:0 "Davalarına müttefik olarak katılacağım."

 agot_targaryen_exile_invasion.0500.b_tt:0 "#warning Targaryen Sürgünleriyle ilgili özel senaryolu içerik sona erecek!#!"

 agot_targaryen_exile_invasion.0500.c:0 "Onlar benim için hiçbir şey."

 agot_targaryen_exile_invasion.0501.t:0 "Yeni Bir [royal_bastard_monarch.Custom('GetQueenKing')|U]"

 agot_targaryen_exile_invasion.0501.desc:0 "[royal_bastard_monarch.GetName]'i Westeros'un gerçek [royal_bastard_monarch.Custom('GetQueenKing')|U] olarak tanımaya karar verdim. Bana ne olacak?"

 agot_targaryen_exile_invasion.0501.a:0 "[royal_bastard_monarch.GetNameNoTooltip]'i tamamen desteklemeliyim."

 agot_targaryen_exile_invasion.0501.b:0 "Yolculuğum henüz bitmedi."

 agot_targaryen_exile_invasion.0502.t:0 "Tüm İhtimallere Rağmen"

 agot_targaryen_exile_invasion.0502.desc:0 "Tüm ihtimallere rağmen [royal_bastard_monarch.GetName], [GetTitleByKey('h_the_iron_throne').GetNameNoTier] için verdiği mücadeleyi kazandı. Bu haber kalbime kıskançlık, korku ve hayranlık karışımı duygular salıyor. Sonradan görme bir piçin tahta benden önce çıkmasına nasıl izin veririm?\n\nNe oldu oldu, herhalde. Ama durum değiştiğine göre planımı buna göre ayarlamam gerekebilir."

 agot_targaryen_exile_invasion.0502.a:0 "Peki. Eve dönme zamanı."

 agot_targaryen_exile_invasion.0502.mp_enabled:0 "[royal_bastard_monarch.GetNameNoTooltip]'i [royal_bastard_monarch.Custom('GetQueenKing')|U] olarak tanıyacağız."

 agot_targaryen_exile_invasion.0502.b:0 "Önceden bir sahtekârdılar. Şimdiyse birer gasıp. Hedefim aynı."

 agot_targaryen_exile_invasion.0600.t:0 "Sorgulanamaz Güç"

 agot_targaryen_exile_invasion.0600.desc:0 "Kısa süre önce [ROOT.Char.Custom('GetCourtType')]'ma hediye edilen üç ejderha yumurtası hakkında düşünmeyi bırakamıyorum.\n\nDüşüncelerim, ejderhalar öldükten sonra kendi yumurtalarını çıkarmaya çalışan, çoktan ölmüş Targaryenlerde takılı kalıyor. Hepsi, ejderhaların onlara düşmanları karşısında yenilmez bir güç vereceğini biliyordu ve son zamanlarda tam olarak nasıl hissetmiş olmaları gerektiğini anlamaya başlıyorum.\n\nBir değil, üç ejderhanın gücü beni Fatih Aegon ile aynı mertebeye taşır. Bana ait olanı geri almakta yadsınamaz bir avantaj sağlar.\n\nBelki de yumurtaları çıkarmayı denemenin zamanı geldi. Olası ödüller kesinlikle risklerden ağır basıyor..."

 agot_targaryen_exile_invasion.0600.a:0 "Denemeliyim."

 agot_targaryen_exile_invasion.0600.a_tt:0 "Yumurtaları çıkarmayı deneyeceksiniz."

 agot_targaryen_exile_invasion.0600.b:0 "Bu riske girmeyeceğim."

 agot_targaryen_exile_invasion.0600.b_tt:0 "Şu an yumurtaları çıkarmayı denemeyeceksiniz."

 agot_targaryen_exile_invasion.0601.t:0 "Hazırlıklar"

 agot_targaryen_exile_invasion.0601.desc:0 "Ejderha yumurtalarımı çıkarmanın olası yollarını araştırırken, büyü ve ritüeller hakkında derin bilgiye sahip olduğunu iddia eden bir yerliyle karşılaştım.\n\nPlanlarımı açıkladıktan sonra [guide.GetName], töreni küçük bir ücret karşılığında yönetmeyi kabul etti. [guide.GetNameNoTooltip]'in büyüye tam olarak nasıl aşina olduğundan ya da ejderha yumurtalarını nasıl öğrendiğinden emin olmasam da, atalarımın başarısız olduğu yerde başarıya ulaşmama [guide.GetSheHe]'nin yardım edeceğine tuhaf bir şekilde güveniyorum."

 agot_targaryen_exile_invasion.0601.desc_took_eggs_away:0 "$agot_targaryen_exile_invasion.0601.desc$\n\n[ROOT.Char.Custom('GetCourtType')]'ma döndükten sonra yumurtaları [egg_owner.GetName]'den zorla alıyorum; o da acı bir tepki verip [guide.GetNameNoTooltip]'e güvendiğim için aptal olduğumu söylüyor."

 agot_targaryen_exile_invasion.0601.a:0 "Umarım bu işe yarar."

 agot_targaryen_exile_invasion.0602.t:0 "Tören"

 agot_targaryen_exile_invasion.0602.desc:0 "[guide.GetName] yanıma gelip törenin başlamaya hazır olduğunu söylüyor. Birlikte sessizce yakındaki bir açıklığa yürüyoruz; orada üç yumurtanın bir odağın üzerine yerleştirildiğini hemen seçiyorum.\n\nYumurtalar yerleştirildikten sonra [guide.GetNameNoTooltip] tuhaf büyü sözleri okumaya başlıyor; toplanan konuklar ve bekleşen hizmetkârlar arasında ürkütücü bir sessilik yayılıyor. Tam bir merakla izliyorum, gözlerim büyüyen alevlere kilitlenmiş.\n\n[guide.GetNameNoTooltip] arkasını dönüp ödemenin gerekli olduğunu söylüyor; yumurtalardan ejderhaları uyandırmak için bir kurban vermeliyim."

 agot_targaryen_exile_invasion.0602.a:0 "Kendi bedenimden kan."

 agot_targaryen_exile_invasion.0602.b:0 "[heir.GetFullName]'den kan."

 agot_targaryen_exile_invasion.0602.c:0 "[heir.GetName] canını verecek!"

 agot_targaryen_exile_invasion.0602.d:0 "Bir konuğu kurban edeceğim..."

 agot_targaryen_exile_invasion.0603.t:0 "Bir Kurban"

 agot_targaryen_exile_invasion.0603.desc:0 "Yumurtadan çıkarma töreni için bir kurban seçin."

 agot_targaryen_exile_invasion.0603.a:0 "Bu kişi olur."

 agot_targaryen_exile_invasion.0604.t:0 "Son, Başlangıçtır"

 agot_targaryen_exile_invasion.0604.desc_main_text:0 "Kan alevlerle karışırken yükselen duman duyularımı köreltmeye başlıyor. Dumanın bir yerinde konukların öksürüp hırıldadığını duyuyorum; ama artık hiçbir şeyi ya da kimseyi göremiyorum. Dakikalar önce yanımda olan [guide.GetNameNoTooltip]'i bile.\n\nAnsızın alevlerin tıslamasını hissediyor ve sağır edici bir çatırtı duyuyorum. Sonra bir tane daha. Ve üçüncüsü. Sesleri takip ediyorum ve üç yumurtanın titreyip sarsıldığını güç bela seçiyorum. Derken kabuklar içeri çöküyor ve dünyayı ürkütücü derecede güzel bir cıvıltı dolduruyor.\n\n#italic Yumurtalar çatladı.#!"

 agot_targaryen_exile_invasion.0604.desc_self:0 "[guide.GetName] elimi kesip kanımı ateşe atıyor.\n\n$agot_targaryen_exile_invasion.0604.desc_main_text$"

 agot_targaryen_exile_invasion.0604.desc_sacrifice:0 "[guide.GetName] [sacrifice.GetName]'i odağa bağlıyor ve alevler başlarken dehşetle izliyorum.\n\n$agot_targaryen_exile_invasion.0604.desc_main_text$"

 agot_targaryen_exile_invasion.0604.desc_blood_donation:0 "[guide.GetName] [heir_blood_donor.GetName]'in elini kesip [heir_blood_donor.GetHerHis] kanını alevlere atıyor.\n\n$agot_targaryen_exile_invasion.0604.desc_main_text$"

 agot_targaryen_exile_invasion.0604.desc_main_text_failure:0 "Kan alevlerle karışırken yükselen duman duyularımı köreltmeye başlıyor. Dumanın bir yerinde konukların öksürüp hırıldadığını duyuyorum; ama artık hiçbir şeyi ya da kimseyi göremiyorum. Dakikalar önce yanımda olan [guide.GetNameNoTooltip]'i bile.\n\nAnsızın alevlerin tıslamasını hissediyor ve sağır edici bir çatırtı duyuyorum. Sıcaklık yoğunlaşıyor ve iç organlarım #italic kaynıyormuş#! gibi hissediyorum. Uzaklaşmaya çabalamaya çalışıyorum; ama bir çatırtı daha merakımı kabartıyor — bir ahmak gibi arkamı dönüp yumurtaların yok oluşunu dehşetle izliyorum. Tören başarısız oldu!"

 agot_targaryen_exile_invasion.0604.desc_self_fail:0 "[guide.GetName] elimi kesip kanımı ateşe atıyor.\n\n$agot_targaryen_exile_invasion.0604.desc_main_text_failure$"

 agot_targaryen_exile_invasion.0604.desc_sacrifice_fail:0 "[guide.GetName] [sacrifice.GetName]'i odağa bağlıyor ve alevler başlarken dehşetle izliyorum.\n\n$agot_targaryen_exile_invasion.0604.desc_main_text_failure$"

 agot_targaryen_exile_invasion.0604.desc_blood_donation_fail:0 "[guide.GetName] [heir_blood_donor.GetName]'in elini kesip [heir_blood_donor.GetHerHis] kanını alevlere atıyor.\n\n$agot_targaryen_exile_invasion.0604.desc_main_text_failure$"

 agot_targaryen_exile_invasion.0604.a:0 "Bu her şeyi değiştiriyor!"

 agot_targaryen_exile_invasion.0604.b:0 "[guide.GetNameNoTooltip], beni hayal kırıklığına uğrattın!"

 agot_targaryen_exile_invasion.0605.t:0 "Bir Ejderhaya Sahip Çıkmak"

 agot_targaryen_exile_invasion.0605.desc:0 "Ejderhalar yumurtalarından kurtulup kanatlarını gerdikçe tamamen büyüleniyorum. Yumuşak cıvıltıları bir anda yüzüme bir gülümseme getiriyor; kafam, bu minicik yaratıkların bir gün [GetScriptedCharacterByHistoryID('dragon_balerion').GetNameNicknamed] kadar efsaneleşeceği düşünceleriyle doluyor.\n\nŞimdi, gelecekteki bineğim olması için ejderhalardan birini seçmeliyim."

 agot_targaryen_exile_invasion.0605.desc_heir_start:0 "Ejderhalar yumurtalarından kurtulup kanatlarını gerdikçe tamamen büyüleniyorum. Ama ejderhaların [heir_blood_donor.GetName]'in çevresinde toplanıp [heir_blood_donor.GetHerHis] omuzlarına tüneyerek huzursuz bir dinlenişe geçişini izledikçe heyecanım sönüyor.\n\n"

 agot_targaryen_exile_invasion.0605.desc_heir_emote_bad:0 "Kıskançlık ve öfke"

 agot_targaryen_exile_invasion.0605.desc_heir_emote_good:0 "Kendi bağım hakkında endişe"

 agot_targaryen_exile_invasion.0605.desc_heir_end:0 "kalbime hücum ediyor; ama [heir_blood_donor.GetNameNoTooltip] bana gülümseyince hızla dağılıyor. "Bunu birlikte başardık," diye anlatmaya başlıyor [heir_blood_donor.GetSheHe], büyük bir rahatlamayla. "Biliyorum ki biri sana da bağlanacak, [ROOT.Char.GetFirstName] — tıpkı [heir_blood_donor_dragon.GetName]'in bana bağlandığı gibi."\n\nDiğer iki ejderhaya bakıyorum ve ... ile bir bağın kıvılcımını hissediyorum."

 agot_targaryen_exile_invasion.0605.a:0 "Sen!"

 agot_targaryen_exile_invasion.0605.a_tt:0 "Bağ kuracağınız bir ejderha seçeceksiniz."

 agot_targaryen_exile_invasion.0606.t:0 "Bir Ejderha Seç"

 agot_targaryen_exile_invasion.0606.desc:0 "Bağ kuracak bir ejderha seçin:"

 agot_targaryen_exile_invasion.0606.a:0 "Sanırım bu..."

 agot_targaryen_exile_invasion.0606.a_tt:0 "Ejderhalarınız bir yıl içinde katlanarak büyüyecek; ayrıca bir yıl sonra [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'e #bold otomatik olarak savaş ilan edeceksiniz.#!"

 agot_targaryen_exile_invasion.0607.t:0 "[heir_asking_for_dragon.GetFirstNameNoTooltip] İçin Bir Ejderha"

 agot_targaryen_exile_invasion.0607.desc:0 "[heir_asking_for_dragon.GetName] içeri dalıp düşüncelerimi bölüyor. [heir_asking_for_dragon.GetSheHe|U] ejderhalarımdan birini sahiplenmesine izin vermem için yalvarıyor. [heir_asking_for_dragon.GetSheHe|U] bana, gelecek savaş için iki ejderha binicisinin birden iyi olacağını söylüyor.\n\n[heir_asking_for_dragon.GetSheHe|U] haklı, diye düşünüyorum. [GetScriptedCharacterByHistoryID('Targaryen_27').GetNameNicknamedRegnal] bile kız kardeşlerinin savaşa kendi ejderhalarıyla çıkmasına güvenmişti... [heir_asking_for_dragon.GetHerHis] bakışıyla karşılaşıyorum ve [heir_asking_for_dragon.GetSheHe]'nin [dragon_for_heir.GetName]'e ateşli bir şekilde baktığını, [heir_asking_for_dragon.GetHerHis] gözlerinde aç bir parıltı olduğunu görüyorum."

 agot_targaryen_exile_invasion.0607.a:0 "Yap hadi."

 agot_targaryen_exile_invasion.0607.b:0 "Hayır, onlar benim ejderhalarım."

 agot_targaryen_exile_invasion.0810.t:0 "Targaryen Restorasyonu"

 agot_targaryen_exile_invasion.0810.desc:0 "Targaryenler geri döndü!\n\nBinlerce kişilik bir orduya önderlik eden [attacker.GetName], Demir Taht'ı [defender.GetName]'den geri almayı planlıyor. Yüzyıllardır ilk kez bir Targaryen işgalcisi, krallığın iyi insanlarını boyunduruk altına almaya hazır şekilde Westeros kıyılarına ayak basıyor. Ama Fatih Aegon'un aksine [attacker.GetNameNoTooltip] yalnızca hırsla değil, nefret ve intikamla da motive oluyor."

 agot_targaryen_exile_invasion.0810.a:0 "Acaba işleri nasıl gidecek?"

 agot_targaryen_exile_invasion.0810.b:0 "İyi şanslar!"

 agot_faegon_invasion.0002.a:0 "Mesajı gönder."

 agot_faegon_invasion.0002.b:0 "Hayır, bu yalnızca #italic benim#! doğuştan hakkım."

 agot_faegon_invasion.0002.c:0 "Targaryenler beni eve hoş geldin diye karşılamalı."

 agot_faegon_invasion.0002.b_no_exiles:0 "Westeros'a dönme zamanı!"

 agot_faegon_invasion.0003.t:0 "Diğer Ejderha"

 agot_faegon_invasion.0003.desc:0 "Uzun süredir öldüğü sanılan [faegon.GetName], her nasılsa mezarından döndü! [faegon.GetSheHe]'nin bana gönderdiği bir mektuba göre, [faegon.GetSheHe] gizlice büyütülmüş ve gasıbın köpeklerinden saklanmış.\n\n[faegon.GetSheHe] artık yetişkinliğe eriştiğine göre, [GetTitleByKey('h_the_iron_throne').GetNameNoTier] için #italic [faegon.GetHerHis]#! iddiası karşısında diz çökmemizi istiyor. [faegon.GetNameNoTooltip], [faegon.GetHerHis] iddiasının bizimkinden üstün olduğunu ve [faegon.GetSheHe]'nin [faegon.Custom('GetQueenKing')] olması gerektiğini öne sürüyor. Ama [faegon.GetSheHe] bize, Targaryen Hanesi'nin yoldan çıkmış kollarını bir kez olsun birleştirmek niyetiyle bir evlilik ittifakı teklif etti."

 agot_faegon_invasion.0003.desc_blackfyre:0 "Blackfyre'lar geri döndü! [faegon.GetName] adlı genç bir savaşçı, her zaman olduğu gibi aynı dava olan [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i fethetmeye önderlik ediyor.\n\nNe var ki seleflerinin aksine [faegon.GetNameNoTooltip] bana bir mektup gönderdi. [faegon.GetSheHe|U], kızıl ve kara ejderhaların bir kez daha birleşmesi gerektiğini öneriyor. [faegon.GetSheHe|U], Targaryenlerin aile olarak #italic [faegon.GetHerHis]#! yanında olmasını istiyor. [faegon.GetSheHe|U], taht için kendi iddiamı bırakıp [faegon.GetHerHis] iddiasını onurlandırmamı istiyor. Bu antlaşma, iki ailemiz arasındaki bir evlilik ittifakıyla bağlanacak."

 agot_faegon_invasion.0003.a_alleged_aegon_tt:0 "[faegon.GetFirstName]'in önünde eğilmeliyiz!"

 agot_faegon_invasion.0003.a_blackfyre_tt:0 "Ejderhalar birleşmeli!"

 agot_faegon_invasion.0003.b:0 "Bir sahtekâr daha. O kadar."

 agot_faegon_invasion.0004.t:0 "Birleşen Ejderhalar"

 agot_faegon_invasion.0004.desc:0 "Güçlerimi [faegon.GetName] ile birleştirmeyi ve [faegon.GetHerHis] Westeros iddiası için savaşmayı kabul ettim. Ama soru hâlâ ortada: bana ne olmalı?"

 agot_faegon_invasion.0004.a:0 "[faegon.GetName]'i tamamen desteklemeliyim."

 agot_faegon_invasion.0004.a_tt:0 "[faegon.GetName] olarak oynamaya başlayacaksınız."

 agot_faegon_invasion.0004.b:0 "Bir maceracı olarak kalacağım."

 agot_faegon_invasion.0005.t:0 "Ejderhalar Arasında Bir Konuşma"

 agot_faegon_invasion.0005_desc.targs_accepted_try_to_tame_dragon:0 "Targaryenler davalarını benimkine adadı. Ama son bir sınav daha var... [dragon_for_faegon.GetName]\n\nYeniden gelen fatih statümü pekiştirmek için ejderhayı evcilleştirmeliyim."

 agot_faegon_invasion.0005_desc.targs_accepted_but_no_dragon:0 "Targaryenler davalarını benimkine adadı! Dünya bizim olacak; ama [GetTitleByKey('h_the_iron_throne').GetNameNoTier] benim."

 agot_faegon_invasion.0005_desc.targs_rejected_me:0 "Kahretsin! Targaryenler beni ve teklifimi reddetti. Gasıpları yenip tahtımı tek başıma kazanmalıyım."

 agot_faegon_invasion.0005.targs_accepted_try_to_tame_dragon:0 "[dragon_for_faegon.GetNameNoTooltip] benim olacak."

 agot_faegon_invasion.0005.targs_accepted_but_no_dragon:0 "Ejderhalar geri dönüyor, Westeros!"

 agot_faegon_invasion.0005.targs_rejected_me:0 "Onların kaybı. Westeros'a!"

 agot_faegon_invasion.0006.t:0 "[dragon_for_faegon.GetNameNoTooltip] ile Yüzleşme"

 agot_faegon_invasion.0006.desc:0 "[dragon_for_faegon.Custom('GetDragonColor')] ejderha [dragon_for_faegon.GetName] önümde yükseliyor; [dragon_for_faegon.Custom('GetDragonHerHis')] gözlerinde aç bir parıltı var. Kader [dragon_for_faegon.Custom('GetDragonHerHis')] yumurtasını çatlattı ve kader bugün beni [dragon_for_faegon.Custom('GetDragonHerHim')]'in karşısına getirdi.\n\n[dragon_for_faegon.GetName] #italic benim#! olacak. Biliyorum."

 agot_faegon_invasion.0006.a:0 "[dragon_for_faegon.GetNameNoTooltip], bana boyun eğ!"

 agot_faegon_invasion.0007.t:0 "İstila"

 agot_faegon_invasion.0007.desc:0 "Tahtımı gasıptan geri almanın zamanı geldi! İlanımın haberi krallığa yayılırken, hevesli sadıkların ve hırslı askerlerin davama katılmanın yolunu bulduğu söyleniyor."

 agot_faegon_invasion.0007.a:0 "Savaşa!"

 agot_faegon_invasion.0007.a_war_started:0 "[GetTitleByKey('h_the_iron_throne').GetHolder.GetName]'e savaş ilan edeceksiniz!"

 agot_faegon_invasion.0008.t:0 "Zafer!"

 agot_faegon_invasion.0008.desc:0 "En sonunda savaş sona erdi ve bir zamanlar [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i işgal eden gasıplar boyun eğdirildi.\n\nHükümdarlığım daha yeni başlıyor; ama artık her şeyin mümkün olduğunu hissediyorum."

 agot_faegon_invasion.0008.desc_no_war:0 "Savaştan kaçınmayı ve [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i tek bir damla kan dökmeden geri almayı başardım!\n\nHükümdarlığım daha yeni başlıyor; ama artık her şeyin mümkün olduğunu hissediyorum."

 agot_faegon_invasion.0008.i_am_aegon_vi:0 "Anne, intikamını aldım."

 agot_faegon_invasion.0008.i_am_a_blackfyre:0 "Kara Ejderha nihayet kazandı!"

 agot_faegon_invasion.0009.t:0 "Yürek Suçları"

 agot_faegon_invasion.0009.desc_secret_blackfyre:0 "Kumar işe yaradı. Himayemdeki çocuk, projem, #italic oğlum#! [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i aldı. [faegon_victor.GetSheHe|U], atalarının zarafetiyle Demir Taht'ta oturuyor. Artık kimse [faegon_victor.GetHerHim]'i sorgulayamaz; sorgulayanlar [faegon_victor.GetHerHis] gazabıyla karşılaşır.\n\nAma soru hâlâ ortada: [faegon_victor.GetHerHim]'e [faegon_victor.GetHerHis] gerçek kimliğini söylemeli miyim?"

 agot_faegon_invasion.0009.desc_secret_orphan:0 "Kumar işe yaradı. Himayemdeki çocuk, projem, #italic mirasım#! [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i aldı. [faegon_victor.GetSheHe|U], kadim Targaryenlerden ayırt edilemeyen bir zarafetle Demir Taht'ta oturuyor. Artık kimse [faegon_victor.GetHerHim]'i sorgulayamaz; sorgulayanlar [faegon_victor.GetHerHis] gazabıyla karşılaşır.\n\nAma soru hâlâ ortada: [faegon_victor.GetHerHim]'e [faegon_victor.GetHerHis] gerçek kimliğini söylemeli miyim?"

 agot_faegon_invasion.0009.a:0 "[faegon_victor.GetSheHe] kimliğini bilmeli."

 agot_faegon_invasion.0009.b:0 "Belki gerçeği sindirmesi için ona bir hediye vermeliyim."

 agot_faegon_invasion.0009.c:0 "[faegon_victor.GetHerHim]'e söyleyemem, bu fazla riskli."

 agot_faegon_invasion.0010.t:0 "Yürek Suçları"

 agot_faegon_invasion.0010.desc_intro:0 "Malikânesinden bir mektup geldi:"

 agot_faegon_invasion.0010.desc_intro_illyrio_is_dead:0 "merhum ama sadık "

 agot_faegon_invasion.0010.desc_intro_illyrio_is_alive:0 "sadık "

 agot_faegon_invasion.0010.desc_intro_end:0 "hamim ve destekçim [illyrio.GetName]."

 agot_faegon_invasion.0010_desc_body:0 "\n\nGörünüşe göre ben Rhaegar Targaryen ile Elia Martell'in oğlu değilim."

 agot_faegon_invasion.0010.desc_secret_blackfyre:0 "Annem Saera ve kocası [illyrio.GetName] üzerinden Blackfyre davasının varisiyim."

 agot_faegon_invasion.0010.desc_secret_orphan:0 "Lys sokaklarından toplanmış bir yetimim..."

 agot_faegon_invasion.0010.keep_a_secret:0 "Tanrıların izniyle, bu bir sır olarak kalmalı."

 agot_faegon_invasion.0010.declare_it_to_the_world:0 "Krallık bilmeli... bu benim görevim."

 agot_faegon_invasion.0010.keep_a_secret_secret_blackfyre_tt:0 "Gerçek #italic anne babanız#! Illyrio Mopatis ve eşi Saera olacak. Anneniz ve soyunuz gizli kalacak"

 agot_faegon_invasion.0010.declare_it_to_the_world_secret_blackfyre_tt:0 "Blackfyre soyunuzu krallığa ilan edeceksiniz."

 agot_faegon_invasion.0010.keep_a_secret_secret_orphan_tt:0 "Gerçek #italic anne babanız#! önemsiz bir Lys çifti olarak belirlenecek"

 agot_faegon_invasion.0010.declare_it_to_the_world_orphan_tt:0 "Yeni bir hanedan kurup tahtı fetih hakkıyla talep edeceksiniz."

 agot_faegon_invasion.0100.t:0 "Yeniden Gelen Fatih Aegon"

 agot_faegon_invasion.0100.desc:0 "#italic "Fatih Aegon yeniden geldi!"#!\n\n[ROOT.Char.Custom('GetCourtType')]'ma ve görünüşe göre tüm Westeros'a, [faegon.GetName] adında müstakbel bir fatihin [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i zorla ele geçirme niyetini ilan ettiği haberi ulaştı.\n\n[faegon.GetNameNoTooltip] krallığa, kendisinin şu olduğunu bildirdi:"

 agot_faegon_invasion.0100.desc_blackfyre:0 "Blackfyre Hanesi'nin varisi ve [GetScriptedCharacterByHistoryID('Targaryen_94').GetName]'in meşru oğlu!"

 agot_faegon_invasion.0100.desc_alleged_aegon:0 "Aegon Targaryen, [GetScriptedCharacterByHistoryID('Targaryen_3').GetName] ile [GetScriptedCharacterByHistoryID('Martell_7').GetFullName]'in meşru oğlu ve Targaryen Hanesi'nin gerçek varisi!"

 agot_faegon_invasion.0100.desc_end:0 "[faegon.GetSheHe], kendini gerçek [faegon.Custom('GetQueenKing')|U] ilan ederek tüm sadık ve vefalı lordlardan bağlılık yemini talep ediyor."

 agot_faegon_invasion.0100.a:0 "[faegon.GetSheHe] neler başaracak acaba?"

 agot_faegon_invasion.0100.b:0 "İyi şanslar!"

 agot_faegon_invasion.0020.t:0 "Bir Yabancı ve [faegon.GetHerHis] Tuhaf Hikâyesi"

 agot_faegon_invasion.0020.desc_allegedly_aegon:0 "[GetScriptedCharacterByHistoryID('Targaryen_3').GetFullName] ile [GetScriptedCharacterByHistoryID('Martell_7').GetFullName]'in meşru oğlu olduğunu iddia eden [faegon.GetName] adlı bir [faegon.GetWomanMan]'den bir mesaj geldi. [faegon.GetSheHe|U], [faegon.GetHerHis] iddiasının benimkinden üstün olduğunu ve tahtı [faegon.GetHerHim]'e bırakmam gerektiğini öne sürüyor. Kabul edersem, [faegon.GetHerHis] eşi olacağım.\n\nReddedersek, [faegon.GetSheHe] [faegon.GetHerHim] iddiasını zorlayacak ve krallığı savaşa sürükleyecek."

 agot_faegon_invasion.0020.desc_open_blackfyre:0 "Blackfyre mirasının meşru varisi olduğunu iddia eden [faegon.GetName] adlı bir [faegon.GetWomanMan]'den bir mesaj geldi. [faegon.GetSheHe|U], [faegon.GetHerHis] iddiasının benimkinden üstün olduğunu ve tahtı [faegon.GetHerHim]'e bırakmam gerektiğini öne sürüyor. Kabul edersem, [faegon.GetHerHis] eşi olacağım.\n\nReddedersek, [faegon.GetSheHe] iddiasını zorlayacak ve krallığı savaşa sürükleyecek."

 agot_faegon_invasion.0020.a:0 "Tahttan vazgeçmeyeceğim; ama [faegon.GetHerHim] ile evleneceğim."

 agot_faegon_invasion.0020.a_tt:0 "[faegon.GetNameNoTooltip] bu karşı teklife yanıt verecek."

 agot_faegon_invasion.0020.b:0 "Savaşı önlemek için uyacağım."

 agot_faegon_invasion.0020.c:0 "Uyacağım; ama Dragonstone'u elimde tutacağım."

 agot_faegon_invasion.0020.d:0 "[faegon.GetHerHis] taleplerini reddet."

 agot_faegon_invasion.0040.t:0 "Tüm İhtimallere Rağmen"

 agot_faegon_invasion.0040.desc:0 "Tüm ihtimallere rağmen [faegon_victor.GetName], [GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i fethetti... Bu haber kalbime kıskançlık, korku ve hayranlık karışımı duygular salıyor. [faegon_victor.GetHerHim]'in kendi ailemin intikamını almada benden önce davranmasına nasıl izin veririm?\n\nNe oldu oldu, herhalde. Ama durum değiştiğine göre planımı buna göre ayarlamam gerekebilir."

 agot_faegon_invasion.0040.a:0 "$agot_targaryen_exile_invasion.0502.a$"

 agot_faegon_invasion.0040.mp_enabled:0 "[faegon_victor.GetNameNoTooltip]'i tanıyacağız."

 agot_faegon_invasion.0040.b:0 "Bir gasıp daha. Hedefim aynı."

 agot_faegon_invasion.0040.targs_wont_go_home:0 "Daha Fazla Hakaret"

 agot_faegon_invasion.0040.targs_wont_go_home_tt:0 "[targaryen_exile.GetName] tahta çıkışınızı reddetti!"

 agot_faegon_invasion.0040.targs_will_go_home:0 "Artık Kayıp Değil"

 agot_faegon_invasion.0040.targs_will_go_home_tt:0 "[targaryen_exile.GetName] sarayınıza katılmaya karar verdi!"

 agot_faegon_reclaim_identity:0 "Kimliğini Geri Kazan"

 agot_faegon_reclaim_identity_desc:0 "İlk girişimim başarısız olsa da, artık yadsınamaz bir ün kazandım. Bunu, Targaryen Hanesi'nin varisi olarak gerçek kimliğimi geri kazanmak için kullanabilirim."

 agot_faegon_reclaim_identity_effect_tt:0 "[GetScriptedCharacterByHistoryID('Targaryen_3').GetHouse.GetName] Hanesi'nin bir üyesi ve [GetScriptedCharacterByHistoryID('Targaryen_3').GetName] ile [GetScriptedCharacterByHistoryID('Martell_7').GetFullName]'in oğlu olacaksınız."

 agot_faegon_reclaim_identity_confirm:0 "Soyunu geri kazan!"

 agot_targaryen_exile_invasion.0800.t:0 "Targaryen Sürgünleri"

 agot_targaryen_exile_invasion.0800.desc:0 "[GetTitleByKey('d_laamp_targaryen_exiles').GetNameNoTier]'nin lideri olarak oynuyorsunuz.\n\n[GetTitleByKey('h_the_iron_throne').GetNameNoTier]'i işgalinizle doruğa ulaşacak senaryolu içerik deneyimleyeceksiniz. Bu içerik, [GetTitleByKey('d_laamp_targaryen_exiles').GetNameNoTierNoTooltip] için yeniden dengelenen #V Meşruiyetçi Destek Talep Et#! karakter etkileşimi etrafında döner.\n\nBu karakter etkileşimini kullanarak kayda değer bir ordu kurduğunuzda, ejderhaların yeniden canlanmasıyla ilgili içerik alacaksınız.\n\nBenzer şekilde, Westeros'a savaş ilanınız senaryolu içerik tarafından #bold otomatik olarak yönetilir#! ve kayda değer bir ordu kurduğunuzda gerçekleşir.\n\nToprak sahibi olursanız, senaryolu hikâye içeriği #bold #N sona erecek!#!#!"

 agot_targaryen_exile_invasion.0800.a:0 "Yolculuğum şimdi başlıyor."

 agot_targaryen_exile_invasion.0801.t:0 "[GetTitleByKey('h_the_iron_throne').GetNameNoTier] Yok Edildi"

 agot_targaryen_exile_invasion.0801.desc:0 "[GetTitleByKey('h_the_iron_throne').GetNameNoTier], doğuştan hakkım, kaderim ve hırsım #italic yok edildi#!. Kaos yalnızca Westeros'u değil, [ROOT.Char.Custom('GetCourtType')]'mı da sardı; artık hedefsiz kaldığımız gerçeği yerleşiyor.\n\nO aptalların ne başardığını sanıyorlar, aklım almıyor."

 agot_targaryen_exile_invasion.0801.a:0 "Ne yaptılar?"

 agot_end_targexile_story_decision:0 "Özel Targaryen Sürgünü İçeriğini Sonlandır"

