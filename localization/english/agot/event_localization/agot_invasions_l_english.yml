 exile_pre_war_window:0 "Westeros'u istila edebilmeniz için son hazırlıklar yapılıyor. Ejderhalarla ilgili senaryolu hikâye olayları yakında tetiklenebilir."

 exile_opted_to_wait_tt:0 "Kendi belirlediğiniz nedenlerle işgalinizi ertelemeyi seçtiniz. Uyarın: Hareketsizliğiniz karşısında #N destekçileriniz huzursuzlanacak#!.\n\n#V $agot_targaryen_exile_invasion_war_cb$ #![casus_belli|E] kullanarak #V Savaş İlan Et#! karakter etkileşimi yoluyla Westeros'a savaş ilan edebilirsiniz."

 story_agot_targaryen_exiles_custom_string_key:0 "$story_agot_targaryen_exile_invasion$ içeriği, asker ve altın kazanmak için yakınınızdaki hükümdarlara #V Meşruiyetçi Destek Talep Et#! karakter etkileşimini kullanmanız etrafında döner. Yeterli askeri güce ulaştığınızda özel hikâye olayları tetiklenecek.\n\n#highlight #underline Hikâye Durumu:#!#! [Story.Custom('AGOTGetTargExileStoryContentStatus')]"
