 dragon_taming_events.0101.t:0 "İradelerin Savaşı"

 dragon_taming_events.0101.desc.wilds:0 "[dragon.GetFirstName]'in ağır soluklarını, [dragon.Custom('GetDragonHerHis')] devasa gövdesini görmeden önce duyuyorum.\n\nKayaların arasında, [dragon.Custom('GetDragonHerHis')] ininde dinlenen büyük yaratık [dragon.Custom('GetDragonHerHis')] başını kaldırıp delici bir bakışla bana bakıyor. Zihnimde tuhaf bir his duyuyorum; paylaşılan bir ruh bağı gibi, ama bunun gerçek mi yoksa yüreğimdeki korkunun bir tezahürü mü olduğunu söyleyemiyorum. Bir sonsuzluk gibi gelen bir süre boyunca birbirimize bakıyoruz.\n\nSonunda bir adım atıyorum ve [dragon.GetFirstNameNoTooltip] alçak bir kükreme çıkarıyor. Ona korkmadığımı, [dragon.Custom('GetDragonHerHis')] saygısına layık olduğumu göstermeliyim.\n\nBir adım daha atıyorum, sonra bir adım daha, sonra bir adım daha; ta ki tam [dragon.Custom('GetDragonHerHim')]'in önünde durana dek. Gözlerinin içine bakıyor ve avucumu [dragon.Custom('GetDragonHerHis')] burnuna kaldırıyorum."

 dragon_taming_events.0101.desc.dragonpit:0 "[dragon.GetFirstName]'in ağır soluklarını, [dragon.Custom('GetDragonHerHis')] devasa gövdesini görmeden önce duyuyorum.\n\nEjderha Çukurunda dinlenen büyük yaratık [dragon.Custom('GetDragonHerHis')] başını kaldırıp delici bir bakışla bana bakıyor. Zihnimde tuhaf bir his duyuyorum; paylaşılan bir ruh bağı gibi, ama bunun gerçek mi yoksa yüreğimdeki korkunun bir tezahürü mü olduğunu söyleyemiyorum. Bir sonsuzluk gibi gelen bir süre boyunca birbirimize bakıyoruz.\n\nSonunda bir adım atıyorum ve [dragon.Custom('GetDragonSheHe')] alçak bir kükreme çıkarıyor. [dragon.GetFirstNameNoTooltip]'e korkmadığımı, [dragon.Custom('GetDragonHerHis')] saygısına layık olduğumu göstermeliyim.\n\nBir adım daha atıyorum, sonra bir adım daha, sonra bir adım daha; ta ki tam [dragon.Custom('GetDragonHerHim')]'in önünde durana dek. Gözlerinin içine bakıyor ve avucumu [dragon.Custom('GetDragonHerHis')] burnuna kaldırıyorum."

 dragon_taming_events.0101.a:0 "#emp [dragon.GetFirstNameNoTooltip]! Bana hizmet et!#!"

 dragon_taming_events.0101.a.valyrian:0 "#emp [Glossary( 'Dohaerās', 'DOHAERAS_GLOSS' )], [dragon.GetFirstNameNoTooltip]!#!"

 dragon_taming_events.0101.b:0 "Ben, şey, sana zarar vermek istemiyorum!"

 dragon_taming_events.0101.b.f:0 "Ejderhaya yaklaşma kararından pişman, yavaşça geri çekiliyorsun."

 dragon_taming_events.0101.dragon_horn:0 "Ejderha boynuzunu hazırla."

 dragon_taming_events.0101.dragon_horn.tt:0 "Boynuzu çalacak birini seçeceksin."

 dragon_taming_events.0201.t:0 "Bir Bağ Dövülür"

 dragon_taming_events.0201.sili:0 "Avucumun altında [dragon.GetNameNicknamedPossessive] pullarının pürüzlü ve pürüzsüz dokunuşunu, [dragon.Custom('GetDragonHerHis')] bedeninin ısısı elime işlerken hissediyorum. Onu okşarken bağımızın... sağlamlaştığını hissediyorum.\n\nHiçbir teşvik olmadan [dragon.Custom('GetDragonSheHe')] [dragon.Custom('GetDragonHerHis')] başını eğip beni ayağa kalkmam için dürtüyor. Uyuyorum; ama [dragon.Custom('GetDragonSheHe')] eğik kalmaya devam ediyor, beni üstüne binmeye davet ediyor."

 dragon_taming_events.0201.aemmly:0 "Büyük bir özenle yavaşça [dragon.GetNameNicknamed]'e yaklaşıyorum. [dragon.Custom('GetDragonSheHe')] büyük bir merak ve heyecanla zincire karşı direnip bana doğru hamle yapıyor. [dragon.Custom('GetDragonSheHe')] ileri atılıp kurtulmaya çalışırken aramıza bir parça közlenmiş koyun eti atıyorum. [dragon.Custom('GetDragonSheHe')|U] eti vahşice parçalıyor, memnuniyetle minik ciyaklamalar ve mırlamalar çıkarıyor.\n\nAvucumu [dragon.Custom('GetDragonHerHis')] yüzünün yanına koyuyorum ve [dragon.GetNamePossessiveNoTooltip] pullarından sızan sıcaklık kolumda yukarı doğru tırmanırken yüreğim güvenle dolmaya başlıyor. Bir an sonra [dragon.Custom('GetDragonSheHe')] dokunuşumu fark ediyor. [dragon.Custom('GetDragonHerHis')] başını yavaşça eğen [dragon.Custom('GetDragonSheHe')], beni kendisini okşamaya davet ediyor."

 dragon_taming_events.0201.vaeron:0 "Sinirlerim geriliyor; [dragon.GetNameNicknamed]'e yaklaştıkça — her adım bir öncekinden biraz daha fazla cesaret istiyor; yanımda telaşlı bir koyunu sürüklerken. Karanlıkta [dragon.GetNameNoTooltip]'i görmeden önce duyuyorum ve [dragon.Custom('GetDragonSheHe')] sırayla beni ve [dragon.Custom('GetDragonHerHis')] yemeğini koklar gibi görünüyor.\n\n[dragon.Custom('GetDragonSheHe')|U] gölgelerden yaklaşıyor; ta ki karşılıklı bakışıncaya dek; beni ve çevremdeki havayı kokladıktan sonra [dragon.Custom('GetDragonSheHe')] artık paniklemiş kuzuya yöneliyor. Hızla bıçağımı hayvanın boynuna çekiyor ve leşi ejderhaya sunmak için geri çekiliyorum. Anlıyor gibi görünen [dragon.GetNameNoTooltip], koyunun bedenini tutuşturan alevli bir ateş püskürtüyor; sonra [dragon.Custom('GetDragonSheHe')] kömürleşmiş kalıntıyla beslenmek için [dragon.Custom('GetDragonHerHis')] çenesini şaklatıyor. Isırıklar arasında [dragon.GetFirstName] yeniden beni kokluyor, sanki kendisini okşamama izin verircesine sakin sakin yaklaşıyor."

 dragon_taming_events.0201.llama:0 "Yüreğim göğsümde hızla çarpıyor; temkinli adımlarla ilerliyorum. Meşalemin ulaşamadığı karanlıkta bir şey kıpırdanıyor; düzenli soluk sesi giderek yükseliyor — ve hızlanıyor. [dragon.GetNameNicknamed]'e yaklaşırken meşale ışığında parlayan [dragon.Custom('GetDragonColorFull')|U] pulları görüş alanımı dolduruyor.\n\n[dragon.Custom('GetDragonSheHe')|U] koca boynunu bana doğru çeviriyor, değerimi sınar gibi duraklıyor ve sonra [dragon.Custom('GetDragonHerHis')] uykusuna geri dönüyor. Kendimi toparlamak için bir nefes alıp elimi [dragon.Custom('GetDragonHerHis')] yanına koymak için öne adım atıyorum. Canavar hüsranla bana geri dönüyor. [dragon.Custom('GetDragonHerHis')|U] pençeleri taş zemini tırmalarken boğazında ateş toplanıyor, odayı aydınlatıp üzerime bir sıcaklık dalgası gönderiyor. "#italic [Glossary( 'Dohaerās!', 'DOHAERAS_GLOSS' )]#!" diye haykırıyorum, elimi [dragon.Custom('GetDragonHerHis')] ağzının önünde tutarak. [dragon.GetNameNoTooltip] duraksıyor, ateş [dragon.Custom('GetDragonHerHis')] pullarının altına geri çekiliyor. Elimle ona dokunuyorum, yüzeyin hemen altında bekleyen ateşin sıcaklık akışını hissediyorum. İçimden yeni bir gücün aktığını hissediyorum, #italic kavramam için bana ait#!."

 dragon_taming_events.0201.a:0 "#emp Teklifini kabul ediyorum, [dragon.GetFirstNameNoTooltip].#!"

 dragon_taming_events.0201.b:0 "Şey, hayır, teşekkürler..."

 dragon_taming_events.0201.b.f:0 "Ejderhanın teklifini reddedip yerde kalıyorsun."

 agot_dragonbinding:0 "Ejderha Bağlama"

 dragon_taming_events.0300.t:0 "$agot_dragonbinding$: Boynuzcu"

 dragon_taming_events.0300.desc:0 "Ejderha boynuzunu çalacak birini seç. #X Bu, boynuzcuyu öldürecektir.#!"

 dragon_taming_events.0300.a:0 "Boynuzu bu çalacak."

 dragon_taming_events.0300.b:0 "Bu iş için yeterli kimse yok."

 dragon_taming_events.0301.t:0 "$agot_dragonbinding$: Çalınan Bir Boynuz"

 dragon_taming_events.0301.desc.intro:0 "Sadakatle [horn_blower.GetName], cehennem boynuzunu [horn_blower.GetHerHis] dudaklarına götürüyor. Boynuzun böğürtüsü, bin ruhun çığlığı gibi kabuslardan fırlamış bir haykırış. Ateşe tutulmuş gibi kemiklerim sızlıyor ve yanıyor; ses içimi sarsıyor. Bu dehşet verici feryadın ardından gelen sessizliği yalnızca [horn_blower.GetNameNoTooltip]'in boğulması bozuyor — [horn_blower.GetHerHis] akciğerleri kavrulup su toplamış gibi hafif bir duman tüfürtüsü.\n\nEjderha boynuzu korosuna bir ses daha ekleyene dek yalnızca bir an geçiyor. [dragon.GetNameNicknamed] ile aramdaki gerginlik dayanılmaz. Gözlerimiz kilitleniyor ve iradelerimiz kısasa kısada kalıyor. #italic İşe yaradı mı?#! diye düşünüyorum, belirsizlik beni tırmalarken...\n\n"

 dragon_taming_events.0301.desc.success_rebind:0 "[dragon.GetNameNoTooltip] yerine oturtuldu; ejderha artık #bold benim#!. Tüten [horn_blower.GetNameNoTooltip] bedeninin üzerinden adımlayarak [dragon.Custom('GetDragonColorFull')] canavara yaklaşıyor ve ödülümü geri alıyorum."

 dragon_taming_events.0301.desc.success:0 "Sonunda [dragon.GetNameNoTooltip] boyun eğiyor; ejderha artık #bold benim#!. Tüten [horn_blower.GetNameNoTooltip] bedeninin üzerinden adımlayarak [dragon.Custom('GetDragonColorFull')] canavara yaklaşıyor ve ödülümü sahipleniyorum."

 dragon_taming_events.0301.desc.another_rebind:0 "$dragon_taming_events.0301.desc.another$"

 dragon_taming_events.0301.desc.another:0 "Sonunda [dragon.GetNameNoTooltip] yumuşuyor. [dragon.Custom('GetDragonSheHe')|U] benim yönüme geliyor; ben de hâlâ tüten [horn_blower.GetNameNoTooltip] bedenini görmezden gelip ödülümü sahiplenmeye can atarak ona doğru adımlıyorum. Ne var ki [dragon.Custom('GetDragonColorFull')] canavar, varlığımı görmezden gelerek yanımdan geçip gidiyor."

 dragon_taming_events.0301.desc.failure_rebind:0 "$dragon_taming_events.0301.desc.failure$"

 dragon_taming_events.0301.desc.failure:0 "Saf dehşet beni yakalıyor; [dragon.Custom('GetDragonColorFull')] canavar boynunu kıvırıyor. [dragon.Custom('GetDragonSheHe')|U] boyun eğmiyor... Aksine, beni #bold alevlere#! vermeye hazırlanıyor."

 dragon_taming_events.0301.a:0 "Dünya benim."

 dragon_taming_events.0301.b:0 "Bekle, nereye gidiyorsun?"

 dragon_taming_events.0301.c:0 "Bekle. Bekle! BEKLE!"

 dragon_taming_events.0301.c.tt:0 "Bir şeyler ters gitti, gitme vakti. KOŞ!"

 agot_target_will_blow_horn:0 "[THIS.Var('si_selected_character').Char.GetName] boynuzu çalıyor."

 agot_target_will_not_blow_horn:0 "[THIS.Var('si_selected_character').Char.GetName] boynuzu çalmayı reddediyor."

 dragon_taming_events.0302.t:0 "$agot_dragonbinding$: Bağlanmış Bir Ejderha"

 dragon_taming_events.0302.desc:0 "Görünüşe göre [fool.GetName], [dragon.GetNameNicknamed]'in huzurunda ejderha boynuzunu çalmış. Boynuz bana bağlı olduğu için [dragon.Custom('GetDragonColorFull')] canavar beni aradı...\n\n"

 dragon_taming_events.0302.desc.dragon_rider:0 "Gözlerimiz kilitleniyor; cehennem boynuzunun kan büyüsüne rağmen süren bir irade savaşı. Boynumun arkasından bir ter damlası süzülürken [dragon.Custom('GetDragonSheHe')] göz temasını kesip tembel bir adım atıyor. [dragon.GetNameNoTooltip] boynunu sunarak beni [dragon.Custom('GetDragonHerHis')] binicisi ilan ediyor."

 dragon_taming_events.0302.a:0 "Gücüm arttı!"

 dragon_taming_events.0302.b:0 "$dragon_taming_events.0301.a$"

 dragon_taming_events.0302.b.tt:0 "Bu ejderhayı binicisi olarak sahipleniyorsun."

 dragon_taming_events.0302.decline:0 "Bu ejderha bana uygun değil."

 dragon_taming_events.0302.decline.tt_hashfix:0 "Ejderha senin mülkiyetinde kalıyor."

 dragon_taming_events.0303.t:0 "$agot_dragonbinding$: İhanet"

 dragon_taming_events.0303.desc:0 "Sadakatle [horn_blower.GetName], cehennem boynuzunu [horn_blower.GetHerHis] dudaklarına götürüyor. Gözlerimi kapatıp dünyayı sarsacak bir böğürtüye hazırlanıyorum... Ama beni sessizlik karşılıyor.\n\nBir gözümü açıp sırıtarak bana bakan [horn_blower.GetFirstNameNoTooltip]'e ihtiyatla bakıyorum. [horn_blower.GetSheHe|U] emrimi yerine getirmeyecek. [horn_blower.GetSheHe] #bold beni#! ele vermeye nasıl #bold cüret#! eder!\n\nKarşı karşıya olduğum tehlikeyi fark ettiğimde sert bir adım atıyorum... [dragon.Custom('GetDragonColorFull')] canavar [dragon.GetNameNicknamed], içinde parlak bir ateş görünen ağzını tıslayarak açıyor."

 dragon_taming_events.0303.desc.stolen_horn:0 "Ve en kötüsü, [horn_blower.GetFirstNameNoTooltip] boynuzu çalmış!"

 dragon_taming_events.0303.a:0 "Lanet olsun sana, [horn_blower.GetFirstNameNoTooltip]!"

 dragon_taming_events.0303.multiple.tt:0 "[horn_blower.GetFirstName] bunun bedelini öbür dünyada ödeyecek."

 dragon_taming_events.0303.a.tt:0 "Bundan sağ çıkarsan, [horn_blower.GetFirstName] ile uzun bir konuşman olacak"

 dragon_taming_events.0304.t:0 "Ejderhayı Yeniden Bağlamak"

 dragon_taming_events.0304.desc:0 "[dragon.GetNameNicknamed] son zamanlarda sorun çıkarıyor ve [dragon.Custom('GetDragonSheHe')]'nin boynuzla bağlanmış bağından kurtulma riskiyle karşı karşıya olduğundan korkuyorum. Cehennem boynuzu hazırken artık bunu düzeltmenin zamanı geldi."

 dragon_taming_events.0304.desc_multiple:0 "\n\nVe bu işi yaparken diğer ejderhaları da yeniden bağlayabilirim."

 dragon_taming_events.0304.a:0 "Hepsini yeniden bağlayacağım."

 dragon_taming_events.0304.a.tt:0 "Bu, sahiplenilmiş ve ehlileştirilmiş ejderhaları bir kez daha tarafına bağlamayı deneyecek; ancak başarısız olursan ölümcül olacak."

 dragon_taming_events.0304.b:0 "Şimdilik yalnızca [dragon.GetNameNoTooltip]."

 dragon_taming_events.0304.c:0 "Sakin ol, [dragon.GetNameNoTooltip]."

 dragon_taming_events.0304.c.tt:0 "[dragon.GetNameNoTooltip] ile bağını güçlendirmeyi deneyeceksin."

 dragon_taming_events.0304.d:0 "Boş ver."

 has_available_horn_blower:0 "Müsait saray mensubu ya da mahkûm"

 agot_rebind_success:0 "[dragon.GetNameNicknamedNoTooltip] yeniden bağlanacak."

 agot_rebind_failure:0 "[dragon.GetNameNicknamedNoTooltip], yeniden bağlama girişimine direnecek."

 dragon_taming_events.0305.t:0 "Sahte Tohum"

 dragon_taming_events.0305.desc.intro:0 "[dragon_keeper.GetFirstName] diyara yeni ejderha binicileri için bir çağrı yayınladı; bir tür aile buluşması. Ejderha kanım olmasa da, burada bir fırsat görüyorum.\n\nEjderha tohumlarının birçok farklı, hmm, çeşidi olduğu söylenir. Kendi saray mensuplarımdan birini gizlice sokmak mümkün olabilir; ölümün yüzüne baktığında yılmayacak güvenilir bir saray mensubu, çünkü ölüm kesinlikle kaçınılmaz.\n\n[dragonpit.GetNameNoTooltip]'in o gün ne kadar kaotik olacağı düşünülürse, boynuzu sevgili "ejderha tohumumuzla" birlikte içeri sokmak mümkün olabilir."

 dragon_taming_events.0305.a:0 "Peki, "ejderha tohumu" rolünü kim oynayacak?"

 dragon_taming_events.0305.a.tt:0 "Bu rolü oynaması için sarayından birini seçmeye başlayacaksın."

 dragon_taming_events.0305.b:0 "Hayır, bu kötü bir fikir."

 dragon_taming_events.0305.toast.too_slow:0 "Çok Yavaş"

 dragon_taming_events.0305.toast.too_slow_desc:0 "Karar vermekte çok yavaş kaldın, an geçti."

 dragon_taming_events.0306.t:0 "$dragon_taming_events.0305.t$: Seçim"

 dragon_taming_events.0306.desc:0 "Sahte ejderha tohumu adayını seç."

 dragon_taming_events.0306.a:0 "Ejderhaya benziyorsun..."

 dragon_taming_events.0306.b:0 "Hiçbiriniz olmaz."

 dragon_taming_events.0306.toast.confirm:0 "Tohum Ekilir"

 dragon_taming_events.0306.toast.confirm_desc:0 "[horn_blower.GetFirstName], [horn_blower.GetHerHis] görevine yola çıktı."

 dragon_taming_events.0306.toast.refuses:0 "Kısır Zemin"

 dragon_taming_events.0306.toast.refuses_desc:0 "[horn_blower.GetFirstName], [horn_blower.GetHerHis] görevini reddetti."

 agot_target_will_go:0 "[horn_blower.GetFirstName] görevi kabul ediyor."

 agot_target_will_not_go:0 "[horn_blower.GetFirstName] görevi kabul etmiyor."

 dragon_taming_events.0307.t:0 "Ejderha Seçimi"

 dragon_taming_events.0307.desc:0 "Sahipleneceğin ejderhayı seç."

 dragon_taming_events.0307.a:0 "Bu hoşuma gitti."

 dragon_taming_events.0307.b:0 "Bu ejderhaların hiçbiri beni tatmin etmiyor."

 other_dragons_wild_or_pitted.tt:0 "Bir ejderha çukurun yoksa diğer ejderhalar vahşileşecek."

 each_dragon_wild_or_pitted.tt:0 "Bir ejderha çukurun yoksa her ejderha vahşileşecek."
