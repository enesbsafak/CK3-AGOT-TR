 agot_dragon_maintenance.0800.b:0 "[owned_dragons|E]."

 agot_dragon_maintenance.0800.c:0 "[tamed_dragons|E]."

 agot_dragon_maintenance.0800.d:0 "Ölü [dragons_plural|E]."

 agot_dragon_maintenance.0800.eggs:0 "Bana tüm ejderha yumurtalarını göster."

 agot_dragon_maintenance.0800.show:0 "Bana dünyanın ejderhalarını göster."

 agot_dragon_maintenance.0801.t_untamed:0 "Ejderhaları Göster: Sahiplenilmiş"

 agot_dragon_maintenance.0801.t_wild:0 "Ejderhaları Göster: Vahşi"

 agot_dragon_maintenance.0801.t_tamed:0 "Ejderhaları Göster: Ehlileştirilmiş"

 agot_dragon_maintenance.0801.t_dead:0 "Ejderhaları Göster: Ölü"

 agot_dragon_maintenance.0801.desc:0 ""

 agot_dragon_maintenance.0801.a:0 "Başka ejderhalara bak..."

 agot_dragon_maintenance.0802.t:0 "Ejderha Yumurtalarını Göster"

 agot_dragon_maintenance.0802.desc:0 "Lordum, bilinen ejderha yumurtalarının tüm sahiplerinin listesi şudur:"

 agot_dragon_maintenance.0802.desc_no_eggs:0 "Hiç ejderha yumurtası yok."

 agot_dragon_maintenance.0803.t:0 "[dragon.GetNameNoTooltip]'in Eski Binicileri"

 agot_dragon_maintenance.0803.desc:0 "Ejderha [dragon.GetNameNoTooltip]'in eski binicileri şunlardır:"

 agot_dragon_maintenance.0803.no_riders_desc:0 "[dragon.GetNameNoTooltip]'in bilinen eski binicisi yok."

 agot_dragon_maintenance.0803.a:0 "Mükemmel"

 agot_dragon_maintenance_msg_dragon_death_placeholder:0 "Dünyanın dört bir yanında küçük halk ve yüce lordlar, ejderha [dead_dragon.GetName]'in öldüğü haberine rahatlayarak nefes veriyor.\n\n[dead_dragon.Custom('GetDragonHerHis')|U] kanatları artık bulutlar arasında görüldüğünde korku salmayacak; [dead_dragon.Custom('GetDragonHerHis')] çeneleri çiftlik hayvanlarını çalmayacak ya da [dead_dragon.Custom('GetDragonHerHis')] ejderha ateşi savaş alanında nesilleri küle çevirmeyecek.\n\nAğlayanlar olsa da, çoğu böyle bir canavarın ölmesinden rahatlamış görünüyor."

 agot_dragon_maintenance_msg_dragon_rider_death_placeholder:0 "[deceased_dragonrider.GetFullName] hayatını kaybetti. [deceased_dragonrider.GetHerHis|U] ejderhası, [newly_freed_dragon.Custom('GetDragonColorFull')] canavar [newly_freed_dragon.GetNameNicknamed], artık [newly_freed_dragon.Custom('GetDragonHerHis')] binicisinin yol göstericiliğinden yoksun."

 agot_dragon_maintenance_msg_dragon_egg_hatched_placeholder:0 "Kaotik bir heyecan ve korku, denizlerin ötesindeki limanları ve pazarları kaplıyor; her tüccarın ve yolcunun dilinde tek söz var: bir ejderha yumurtası çatladı!\n\nYumurtayı çatlatan [dragon_hatcher.Custom('WomanManGirlBoy')] [dragon_hatcher.GetName], [dragon.Custom('GetDragonColorFull')] ejderhaya [dragon.GetName] adını verdi."

 agot_dragon_maintenance_msg_dragon_tamed_placeholder:0 "Korku ve coşkunun karışımı limanlara ve tüccar salonlarına yangın gibi yayılıyor:\n\n[dragon_tamer.GetFirstNameNicknamed], [tamed_dragon.Custom('GetDragonColorFull')] canavar [tamed_dragon.GetNameNicknamed]'i sahiplenmeyi başardı.\n\nUmalım ki [dragon_tamer.GetSheHe] hırsına kapılmasın."
