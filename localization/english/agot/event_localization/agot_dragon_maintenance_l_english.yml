l_english:

 agot_dragon_maintenance.0200.desc:0 "[child.GetFirstNameNoTooltip].\n\nİlk başta ismi sevmiştim ama artık kulağıma tuhaf geliyor.\n\nBelki daha iyi bir şeyle değiştirmeliyim?"

 agot_dragon_maintenance.0901.t:0 "Bir Ejderha Binicisinin Ölümü"

 agot_dragon_maintenance.0901.opening1:0 "Şok dalgaları bilinen dünyanın dört bir yanında yayılıyor: "

 agot_dragon_maintenance.0901.opening2:0 "Hüzünlü fısıltılar ve mırıltılı dualar bugünün kötü haberini taşıyor: "

 agot_dragon_maintenance.0901.opening3:0 "Limanlar ve tüccar tezgâhları hüzün ve endişeyle inliyor: "

 agot_dragon_maintenance.0901.opening4:0 "Kara kanatlar kara sözler taşır ve bugünün haberi de farklı değil: "

 agot_dragon_maintenance.0901.opening5:0 "Tüccarın da yolcunun da dilinde ağır haberler dolaşıyor: "

 agot_dragon_maintenance.0901.desc:0 "[deceased_dragonrider.GetFullName] [deceased_dragonrider.GetDeathReason]. [deceased_dragonrider.GetHerHis|U] ejderhası, [newly_freed_dragon.Custom('GetDragonColorFull')] canavar [newly_freed_dragon.GetNameNicknamed], artık [newly_freed_dragon.Custom('GetDragonHerHis')] binicisinin yol göstericiliğinden yoksun."

 agot_dragon_maintenance.0901.family:0 "\n\nVe [deceased_dragonrider.GetFirstNameNoTooltip] sıradan bir ejderha binicisi değildi... [deceased_dragonrider.GetSheHe|U] benim [ROOT.Char.Custom2('RelationToMeShort', deceased_dragonrider)]'imdi."

 agot_dragon_maintenance.0901.friend:0 "Bu kayıp beni derinden yaralıyor — sönmüş parlak bir alev."

 agot_dragon_maintenance.0901.foe:0 "Yüreğimde [deceased_dragonrider.GetHerHim] için sevgi olmasa da bu kayıp rahatsız edici."

 agot_dragon_maintenance.0901.fallback:0 "[deceased_dragonrider.GetHerHim]'e pek yakınlık duymasam da bu kayıp yine de sarsıcı."

 agot_dragon_maintenance.0901.outro:0 "\n\n[newly_freed_dragon.GetNameNoTooltip], [deceased_dragonrider.GetFirstNamePossessiveNoTooltip] ailesiyle birlikte yaşamaya devam edip yas tutarken, [newly_freed_dragon.Custom('GetDragonHerHim')] için sırada ne olduğu belirsiz."

 agot_dragon_maintenance.0901.a:0 "[newly_freed_dragon.GetNameNoTooltip] şimdi ne yapacak?"

 agot_dragon_maintenance.0902.t:0 "[dragon_tamer.GetFirstNameNoTooltip] Göklere Yükseliyor!"

 agot_dragon_maintenance.0902.opening1:0 "Fısıltılar ve kuzgun kanatlarıyla taşınan bir notun duyurusuyla, oldukça rahatsız edici haber geliyor: "

 agot_dragon_maintenance.0902.opening2:0 "Sokaklarda heyecan endişeyle boy ölçüşüyor; günün son sözü kulaktan kulağa yayılıyor: "

 agot_dragon_maintenance.0902.opening3:0 "Korku ve coşkunun karışımı limanlara ve tüccar salonlarına yangın gibi yayılıyor: "

 agot_dragon_maintenance.0902.opening4:0 "Küçük halkın uğultusu ve soylu lordların konuşmaları, en son ejderha biniciliği gelişmesine odaklanmış durumda: "

 agot_dragon_maintenance.0902.desc:0 "[dragon_tamer.GetFirstNameNicknamed], [tamed_dragon.Custom('GetDragonColorFull')] canavar [tamed_dragon.GetNameNicknamed]'i sahiplenmeyi başardı.\n\n"

 agot_dragon_maintenance.0902.mid1:0 "Sıradan halk [tamed_dragon.GetNameNoTooltip] hakkında durmadan gevezelik ediyor... "

 agot_dragon_maintenance.0902.mid2:0 "Söylentiler [tamed_dragon.GetNameNoTooltip] hakkında hızla yayılıyor... "

 agot_dragon_maintenance.0902.mid3:0 "Kalabalıklar [tamed_dragon.GetNameNoTooltip] karşısında büyülenmiş... "

 agot_dragon_maintenance.0902.imperious:0 "Ejderhalar gerçekten tanrıysa, [tamed_dragon.Custom('GetDragonSheHe')] onların ilkidir."

 agot_dragon_maintenance.0902.supporting:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin bazen avlanırken ve [tamed_dragon.Custom('GetDragonHerHis')] ejderha dostlarıyla yemek paylaşırken görülebileceği söyleniyor."

 agot_dragon_maintenance.0902.restrained:0 "Haber odur ki [tamed_dragon.Custom('GetDragonSheHe')] nispeten az yemle yetiniyor ve diyarın çobanları bunun için [tamed_dragon.Custom('GetDragonHerHim')]'e şükrediyor."

 agot_dragon_maintenance.0902.skittish:0 "[tamed_dragon.Custom('GetDragonSheHe')|U]'nin en ele avuca sığmaz yaratık olduğu söyleniyor; kimi zaman duyuluyor ama neredeyse hiç görülmüyor."

 agot_dragon_maintenance.0902.voracious1:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin doymak bilmez olduğu söyleniyor; bir keresinde bir saat içinde koca bir sürüyü yemiş!"

 agot_dragon_maintenance.0902.voracious2:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin tüm ejderhaların en şişmanı olduğunu, kara ve denizi yalnızca bir sonraki yemeği aramak için aştığını iddia ediyorlar."

 agot_dragon_maintenance.0902.calculating:0 "Onu fark ettiğin zaman artık çok geç olduğunu söylüyorlar."

 agot_dragon_maintenance.0902.friendly:0 "[tamed_dragon.Custom('GetDragonHerHim')] ile yakın karşılaşmalar yaşayanların çoğu bunu anlatacak kadar yaşadı."

 agot_dragon_maintenance.0902.bloodthirsty:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin kurbanlarıyla onları en sonunda yutmadan önce saatlerce oynayabildiği söyleniyor."

 agot_dragon_maintenance.0902.impulsive:0 "[tamed_dragon.Custom('GetDragonHerHis')] ruh halinin, kuyruğu gibi şiddetle değiştiği ve ona kurban olan herkesi ezip geçtiği söyleniyor."

 agot_dragon_maintenance.0902.defiant:0 "[tamed_dragon.Custom('GetDragonHerHim')]'i ehlileştirmeye cesaret eden çok az kişi var; bunu anlatacak kadar yaşayanlar daha da az."

 agot_dragon_maintenance.0902.aggressive:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin [tamed_dragon.Custom('GetDragonHerHim')]'e yaklaşan herkesin etini koparacağı söyleniyor."

 agot_dragon_maintenance.0902.cooperative:0 "[tamed_dragon.Custom('GetDragonSheHe')|U] her zaman diğer ejderhalarla birlikte; nerede görülürse görülsün, diğerlerinin de orada bulunacağı kesin."

 agot_dragon_maintenance.0902.solitary:0 "Söylenceye göre [tamed_dragon.Custom('GetDragonSheHe')] tüm hayatını yalnız geçirmiş ve ölene dek de böyle sürdürecek."

 agot_dragon_maintenance.0902.weak:0 "Ejderhalar tanrı olabilir ama [tamed_dragon.Custom('GetDragonSheHe')] bu tanımı kesinlikle zorluyor."

 agot_dragon_maintenance.0902.spindly:0 "Çoğu [tamed_dragon.Custom('GetDragonHerHis')] boyuna gülüyor, [tamed_dragon.Custom('GetDragonSheHe')]'nin yetersiz beslenmiş, aç bırakılmış sıradan bir 'sıçan-ejderhası' olduğu şakasını yapıyor."

 agot_dragon_maintenance.0902.majestic:0 "[tamed_dragon.Custom('GetDragonHerHis')] güzelliğinin hikâyelerini anlatıyorlar; [tamed_dragon.Custom('GetDragonSheHe')] gökyüzünde iz bırakırken pulları değerli taşlar gibi parıldıyor."

 agot_dragon_maintenance.0902.ugly:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin bakması korkunç olduğunu söylüyorlar — [tamed_dragon.Custom('GetDragonHerHis')] vahşiliği yüzünden değil, [tamed_dragon.Custom('GetDragonHerHis')] katıksız iğrençliği yüzünden."

 agot_dragon_maintenance.0902.swift:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin tüm ejderhaların en hızlısı olduğunu, kara ve denizi göz açıp kapayıncaya kadar aştığını iddia ediyorlar."

 agot_dragon_maintenance.0902.slow:0 "[tamed_dragon.Custom('GetDragonSheHe')]'nin oldukça yavaş olduğunu, ejderha yarışında işe yaramayacak ağır bir yaratık olduğunu iddia ediyorlar."

 agot_dragon_maintenance.0902.cannibal:0 "Ejderhalara tanrı diyorlar; peki #bold tanrı#! yiyen bir şeye ne dersin?"

 agot_dragon_maintenance.0902.outro:0 "Ama bu tür kulaktan dolma sözler çoğu zaman yanıltıcıdır.\n\n"

 agot_dragon_maintenance.0902.many:0 "[dragon_tamer.GetFirstNameNoTooltip], geçmişte ve günümüzde bulutların arasında bir yuva kurmuş sayısız ejderha binicisinin saflarına katılıyor. [dragon_tamer.GetSheHe]'nin bu imrenilen konumla gelen gücü nasıl yöneteceğini henüz göreceğiz..."

 agot_dragon_maintenance.0902.few:0 "[dragon_tamer.GetFirstNameNoTooltip] artık bilinen dünyadaki az sayıdaki güçlü canavardan birine hükmederken, bazıları bulutların üzerinde yeni bir kanat çiftinin görüntüsünden korkuyor; ama [dragon_tamer.GetSheHe]'nin bu yeni kazanılmış güçle ne yapacağı henüz görülecek..."

 agot_dragon_maintenance.0902.last:0 "[dragon_tamer.GetFirstNameNoTooltip], şu an için eşsiz olan bir güce kavuştu. [dragon_tamer.GetSheHe|U] artık bilinen dünyadaki #bold son#! ejderhaya biniyor."

 agot_dragon_maintenance.0902.a:0 "Umalım ki [dragon_tamer.GetSheHe] hırsına kapılmasın."

 agot_dragon_maintenance.0903.t:0 "Dünyaya Bir Ejderha Geliyor"

 agot_dragon_maintenance.0903.opening1:0 "Kaotik bir heyecan ve korku, denizlerin ötesindeki limanları ve pazarları kaplıyor; her tüccarın ve yolcunun dilinde tek söz var: bir ejderha yumurtası çatladı!"

 agot_dragon_maintenance.0903.opening2:0 "Sokaklarda kıyamet gibi bir heyecan ve tedirginlik duyuluyor; küçük halk bir haberle uğulduyor: bir ejderha yumurtası çatladı!"

 agot_dragon_maintenance.0903.opening3:0 "Dört bir yandaki limanlar ve çarşılar hem coşkuyla hem dehşetle yankılanıyor — yeni bir ejderhanın doğduğu haberi yangın gibi yayılıyor!"

 agot_dragon_maintenance.0903.opening4:0 "Limanlar ve tüccar tezgâhları, hepsi de yeni çatlamış bir ejderha yumurtası söylentisinin çevresinde dönen beklenti ve endişeyle uğulduyor."

 agot_dragon_maintenance.0903.opening5:0 "Korku ve hayret haberlerle birlikte çarpışıyor: bir ejderha yumurtası çatladı, diyor küçük halk dünyanın dört bir yanında kısık sesle."

 agot_dragon_maintenance.0903.foulmagic:0 "Diller, [dragon_hatcher.GetName]'in [dragon_hatcher.GetHerHis] yumurtasını ancak uğursuz büyülerle çatlattığını fısıldıyor."

 agot_dragon_maintenance.0903.targ:0 "Mırıltılar, [dragon_hatcher.GetDynastyName] Hanedanı'nın soyundan gelenin bir kez daha dünyaya bir ejderha getirmesine pek şaşırmadıklarını dile getiriyor. [dragon_hatcher.GetName], ejderha çatlatan uzun bir soyun en son üyesi."

 agot_dragon_maintenance.0903.house:0 "Ayak şakırtıları ve yan bakışlar arasında, [dragon_hatcher.GetHouse.GetName] Hanedanı'ndan [dragon_hatcher.GetName] adı açıkça seçilebiliyor. [dragon_hatcher.GetHerHis] yumurtayı çatlatan [dragon_hatcher.GetHerHim] olmalı."

 agot_dragon_maintenance.0903.child:0 "Gelip geçerken, sıradan halk, daha bir çocuk olan [dragon_hatcher.GetName]'in bu kadar güçlenecek bir canavarı çatlattığı gerçeğiyle alay ediyor."

 agot_dragon_maintenance.0903.nick:0 "Canlı sokaklarda neredeyse kesintisiz gevezelik, [dragon_hatcher.GetHerHis] yumurtayı çatlatan ve [dragon_hatcher.GetNameNicknamed] diye anılan [dragon_hatcher.Custom('WomanManGirlBoy')] etrafında dönüyor."

 agot_dragon_maintenance.0903.mid1:0 "Kısık sesleri, ejderhalara ve onların dünyaya geliş yollarına dair açık bir kuşkuculuk taşıyor — #italic ateş, kan, #bold ikisi de!#!#! — [dragon_hatcher.GetName]'in [dragon_hatcher.GetHerHis] yumurtayı çatlattığı açık."

 agot_dragon_maintenance.0903.mid2:0 "Kısa konuşmalar, [dragon_hatcher.GetHerHis] yumurtayı çatlatan ve [dragon_hatcher.GetName] diye anılan bir [dragon_hatcher.Custom('WomanManGirlBoy')] üzerinde odaklanıyor."

 agot_dragon_maintenance.0903.outro:0 "\n\n[dragon_hatcher.GetSheHe] nasıl başardıysa, [dragon_hatcher.GetFirstNameNoTooltip] yeni [dragon.Custom('GetDragonColorFull')] yavrusuna [dragon.GetName] adını verdi."

 agot_dragon_maintenance.0903.a:0 "İnanılmaz!"

 agot_dragon_maintenance.0904.t:0 "[dead_dragon.GetNameNoTooltip] Son Nefesini Veriyor"

 agot_dragon_maintenance.0904.desc_few_dragons_extant:0 "Dünyanın dört bir yanında küçük halk ve yüce lordlar, ejderha [dead_dragon.GetName]'in öldüğü haberine rahatlayarak nefes veriyor.\n\n[dead_dragon.Custom('GetDragonHerHis')|U] kanatları artık bulutlar arasında görüldüğünde korku salmayacak; [dead_dragon.Custom('GetDragonHerHis')] çeneleri çiftlik hayvanlarını çalmayacak ya da [dead_dragon.Custom('GetDragonHerHis')] ejderha ateşi savaş alanında nesilleri küle çevirmeyecek.\n\nAğlayanlar olsa da, çoğu son ejderhalardan birinin ölmesinden rahatlamış görünüyor."

 agot_dragon_maintenance.0904.a:0 "Tarih onları asla unutmayacak."

 agot_dragon_maintenance.0904.t_last_dragon_died:0 "Ejderhaların Ölümü"

 agot_dragon_maintenance.0904.desc_last_dragon_died:0 "Valyria Serbest Diyarı'nın mirası, kadim imparatorluğun son kalıntıları yaşayan dünyadan silinirken daha da sarsılıyor. Bugün son ejderha, [dead_dragon.GetName], tarihin sayfalarına karıştı.\n\nİmparatorluklar kuran ve bin yıl boyunca hükmeden bu olağanüstü canavarlar artık yalnızca küçük halkın abartılı masallarında ve Üstada'nın kitaplarında yaşayacak. Dünya rahatlama, umutsuzluk ve belirsizlikle uyanıyor. Yeni gücün ne olacağını kim bilebilir?"

 agot_dragon_maintenance.0904.a_last_dragon_died:0 "Bu, yeni bir çağın şafağı."

 agot_dragon_maintenance.0904.t_many_dragons_extant:0 "[dead_dragon.GetNameNoTooltip] hayata gözlerini yumuyor"

 agot_dragon_maintenance.0904.desc_many_dragons_extant:0 "Bugün [dead_dragon.GetName], dünyada dolaşan sayısız ejderhadan biri olarak bu hayata gözlerini yumdu.\n\nGökyüzünde bu kadar çok ejderha dolaşıp küçük halka korku salarken, [dead_dragon.Custom('GetDragonSheHe')]'nin tarih tarafından hatırlanıp hatırlanmayacağı ya da bu çağda denizlere ve göklere hükmeden ejderhaların uzun listesinde küçük bir dipnot olarak mı kalacağı henüz bilinmiyor."

 agot_dragon_maintenance.0904.a_many_dragons_extant:0 "Bu kadar çoğu dururken bir tanesi nedir ki?"

 agot_dragon_maintenance.9999.t:0 "Ejderha Özelleştirici"

 agot_dragon_maintenance.9999.desc:0 "Aşağıda bu ejderhanın olası tüm görünüm niteliklerinin bir listesi bulunmaktadır. Her niteliğin en yüksek değeri %100, en düşük değeri ise %0'dır.\n\n@warning_icon! #warning Bu etkinlik penceresindeki renkler, karakter penceresindekilerden farklı olabilir!#!\n\nimport_dragon_dna = {\n\tprimary_color_value = [story.MakeScope.Var('gene_dragon_primary_color_value').GetValue]\n\tprimary_color_hue = [story.MakeScope.Var('gene_dragon_primary_color_hue').GetValue]\n\tsecondary_value = [story.MakeScope.Var('gene_dragon_secondary_value').GetValue]\n\tsecondary_hue = [story.MakeScope.Var('gene_dragon_secondary_hue').GetValue]\n\ttertiary_value = [story.MakeScope.Var('gene_dragon_tertiary_value').GetValue]\n\ttertiary_hue = [story.MakeScope.Var('gene_dragon_tertiary_hue').GetValue]\n\thorn_color_value = [story.MakeScope.Var('gene_dragon_tertiary_hue').GetValue]\n\thorn_color_hue = [story.MakeScope.Var('gene_dragon_horn_color_value').GetValue]\n\teye_color_value = [story.MakeScope.Var('gene_dragon_horn_color_hue').GetValue]\n\teye_color_hue = [story.MakeScope.Var('gene_dragon_eye_color_value').GetValue]\n\tmain_horn_shape_template = [story.MakeScope.Var('gene_dragon_main_horn_shape_template').GetValue]\n\tmain_horn_shape_value = [story.MakeScope.Var('gene_dragon_main_horn_shape_value').GetValue]\n\tbody_shading_template = [story.MakeScope.Var('gene_dragon_body_shading_template').GetValue]\n\tbody_shading_value = [story.MakeScope.Var('gene_dragon_body_shading_value').GetValue]\n\twings_shading_template = [story.MakeScope.Var('gene_dragon_wings_shading_template').GetValue]\n\twings_shading_value = [story.MakeScope.Var('gene_dragon_wings_shading_value').GetValue]\n\tneck_length = [story.MakeScope.Var('gene_dragon_neck_length').GetValue]\n\tmetallic_scales_strength = [story.MakeScope.Var('gene_dragon_metallic_scales_strength').GetValue]\n\twounded = [story.MakeScope.Var('gene_dragon_wounded').GetValue]\n\told_neck = [story.MakeScope.Var('gene_dragon_old_neck').GetValue]\n\ttail_length = [story.MakeScope.Var('gene_dragon_tail_length').GetValue]\n\tcenter_fin_size = [story.MakeScope.Var('gene_dragon_center_fin_size').GetValue]\n\tside_fin_size = [story.MakeScope.Var('gene_dragon_side_fin_size').GetValue]\n\tcrest_depth = [story.MakeScope.Var('gene_dragon_crest_depth').GetValue]\n\tback_spike_size = [story.MakeScope.Var('gene_dragon_back_spike_size').GetValue]\n\tneck_spike_size = [story.MakeScope.Var('gene_dragon_neck_spike_size').GetValue]\n\thorns_eyebrow_length = [story.MakeScope.Var('gene_dragon_horns_eyebrow_length').GetValue]\n\thorns_eyebrow = [story.MakeScope.Var('gene_dragon_horns_eyebrow').GetValue]\n\tsnout_length = [story.MakeScope.Var('gene_dragon_snout_length').GetValue]\n\tsnout_height = [story.MakeScope.Var('gene_dragon_snout_height').GetValue]\n\tsnout_width = [story.MakeScope.Var('gene_dragon_snout_width').GetValue]\n\tsnout_end_width = [story.MakeScope.Var('gene_dragon_snout_end_width').GetValue]\n\tsnout_profile = [story.MakeScope.Var('gene_dragon_snout_profile').GetValue]\n\tchin_profile = [story.MakeScope.Var('gene_dragon_chin_profile').GetValue]\n\tjaw_width = [story.MakeScope.Var('gene_dragon_jaw_width').GetValue]\n\tupper_jaw_width = [story.MakeScope.Var('gene_dragon_upper_jaw_width').GetValue]\n\tlower_jaw_width = [story.MakeScope.Var('gene_dragon_lower_jaw_width').GetValue]\n\tlower_jaw_height = [story.MakeScope.Var('gene_dragon_lower_jaw_height').GetValue]\n\tcheek_width = [story.MakeScope.Var('gene_dragon_cheek_width').GetValue]\n\thead_roundness = [story.MakeScope.Var('gene_dragon_head_roundness').GetValue]\n\tbrow_width = [story.MakeScope.Var('gene_dragon_brow_width').GetValue]\n\touter_brow_height = [story.MakeScope.Var('gene_dragon_outer_brow_height').GetValue]\n}"

 agot_dragon_maintenance.9999.a:0 "İşim bitti."

 agot_dragon_maintenance.0905.t:0 "Dünyaya Bir Ejderha Geliyor"

 agot_dragon_maintenance.0905.desc:0 "Gemi kaptanlarının, tüccarların ve tacirlerin ağzından dört bir yana yayılan haber: [dragonpit_county.GetNameNoTierNoTooltip] ejderha çukurunda yeni bir ejderha yumurtası çatladı. [owner.GetTitledFirstName], gücüne bir [dragon.Custom('GetDragonColorFull')] canavar ekledi, diyorlar.\n\nHer ne kadar daha bir bebek olsa da, her ejderha korkunç bir şeydir; özellikle de bağlanmamış ejderhalar, küçük halkta ve soylularda endişe dalgaları yaratır."

 agot_dragon_maintenance.0905.a:0 "İnanılmaz!"

