l_english:

 warhorse.0003.stranger:0 "Yabancı — Yediler'in tüm insanların korktuğu yüzü için!"

 warhorse.0003.azor:0 "Azor — R'hllor'un seçilmişi için!"

 warhorse.0003.whitebark:0 "Ak Kabuk — her şeyi gören weirwood ağaçları için!"

 warhorse.0003.nagga:0 "Nagga — Gri Kral tarafından öldürülen meşhur Deniz Yılanı!"

 warhorse.0003.garin:0 "Garin — büyük Rhoynar savaş önderi!"

 warhorse.0003.yndros:0 "Yndros — Alacakaranlık'ın Lysli tanrısı!"

 warhorse.0003.hoodedwayfarer:0 "Başlıklı Yolcu — yoksulların hamisi!"

 warhorse.0003.moonsinger:0 "Ay Şarkıcısı — Jogos Nhai rahibeleri gibi!"

 warhorse.0004.e:0 "Dansçı"

 warhorse.0004.f:0 "Glitterhoof"
