 martial_strategy.2000.qohor.desc:0 "Qohor'un Üç Bininin savunması, "

 martial_strategy.2001.thirteen.desc:0 "#F Parşömen, On Üçüncünün Muharebesi'ni anlatır. Altın İmparatorluk İmparatoru Lo Bu, Jogos Nhai'e karşı savaştı; kılıç veya mızrakta ne kadar hünerli olsa da, ordularını ve nihayetinde Yarısı Kadar Bile Cesur Çocuk olarak anılan Lo Bu'nun kendisini mağlup eden Jhattar Zhea'nın kurnaz stratejisine yenildi. Bu, lojistiğin ve erzağın önemini gösterir.#!"

 martial_strategy.2001.leng_ma.desc:0 "#F Leng Ma Muharebesi'nde İmparator Jar Har, yerli Lengilileri kesin olarak yenilgiye uğrattı ve Leng adasını sonraki altı bin yıl boyunca Altın İmparatorluk'a kattı. Muharebede düşmanlarını etkili bir şekilde manevrayla atlatarak onları ordusu ile kıyıdaki donanması arasında sıkıştırdı. Muharebe, Lengili kuvvetini son adamına kadar tamamen yok etti.#!"

 martial_strategy.2001.bloody_gate.desc:0 "#F Osric V, Yüksek Yol boyunca Kanlı Kapı'yı inşa ederek Vadi'yi tüm batılı düşmanlara karşı tahkim etti. Nehirler ve Adalar Kralı Halleck Hoare, ordularını kaleye üç ayrı seferde sürdü ve orduları her seferinde yok edildi. Kalenin savunucuları, istilacı orduların tüm şan umutlarını sona erdirerek krallıklarını herkese karşı savundu.#!"

 martial_strategy.2001.hungry_wolf.desc:0 "#F Andallı bir savaş beyi olan Argos Sevenstar, Westeros'a gelen ilklerden biriydi. Diğerleri ilk olarak Parmaklar'a ayak basarken, Argos talihsizliğine rağmen daha kuzeye ilerledi. Diğerleri birbiriyle çatışan küçük krallar bulurken, Argos Kuzey'i Aç Kurt Theon Stark'ın tamamen birleştirdiğini gördü. Daha kaliteli demir silahları ve zırhına rağmen Argos ve adamları, Aç Kurt tarafından katledildi; Aç Kurt, ölü savaş beyinin cesedini gemisinin baş süsüne bağladı ve doğrudan Andalos'a yağma akınları düzenledi. Bu, sınırı aşmanın ve uyuyan bir gücü uyandırmanın tehlikesini öğreten bir hikâyedir.#!"
