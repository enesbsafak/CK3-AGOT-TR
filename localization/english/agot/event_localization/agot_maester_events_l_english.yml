l_english:

 maester_title_localization:0 "$trait_maester$"

 maester_title_holder:0 "[CHARACTER.Custom('MaesterCheck')]"

 ArchaesterTitle:0 "$archmaester$"

 MaesterTitle:0 "$trait_maester$"

 AcolyteTitle:0 "$trait_acolyte$"

 NoviceTitle:0 "$trait_novice$"

 decision_employ_maester:0 "Bir Üstat İçin Haber Sal"

 decision_employ_maester_tooltip:0 "Bir [maester|E] çağıracaksın"

 decision_employ_maester_desc:0 "Bilinen dünyada Westeros bilgisinin merkezi olarak ün salmış olan [GetTitleByKey('c_oldtown').GetNameNoTier] Kalesi, Westeros'taki her kaleye eğitimli bir bilge adam sağlar. Belki bir tanesine haber salmalıyım."

 decision_employ_maester_effect:0 "Sana hizmet etmek üzere yetkin bir üstat seçilecek ve kısa süre içinde sarayına varacak."

 decision_employ_maester_confirm:0 "Oldtown'a kuzgun gönder"

 tooltip_employ_maester:0 "Sarayda hiçbir yetkin üstat bulunmamalı."

 tooltip_recently_employed_maester:0 "Son zamanlarda bir üstat tutmayı denememiş olmalı."

 essos_decision_employ_maester:0 "Üstat Ara"

 essos_decision_employ_maester_tooltip:0 "Bir [maester|E] arayışına başlayacaksın"

 essos_decision_employ_maester_desc:0 "Üstat tutabilenlerin yalnızca Westeros lordları olduğu nerede yazıyor? Bir üstat arayışına başlamalıyım; şansım yaver giderse, yetkin bir kimse bulurum."

 essos_decision_employ_maester_effect:0 "Bir üstat arayışı başlayacak."

 essos_decision_employ_maester_confirm:0 "Aramayı başlat"

 agot_maester.0001.t:0 "[capital.GetNameNoTooltip]'in Yeni Üstadı"

 agot_maester.0001.t_alt:0 "Yeni Bir Üstat"

 agot_maester.0001.desc:0 "Kaleden çağırttığım üstat, [new_maester.GetCulture.GetName] olan [new_maester.GetFirstName] adlı biri, [capital.GetNameNoTooltip]'e ulaştı. Umuyoruz ki [new_maester.GetSheHe] sadık ve bilge olur."

 agot_maester.0001.a:0 "Güzel."

 agot_maester.0001.a.tt:0 "Üstat hem danışman hem saray hekimi olarak hizmet edecek."

 agot_maester.0001.b:0 "Korkarım hesaplarımızda artık hizmetin için yer yok."

 agot_maester.0002.t:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]'in Büyük Üstadı"

 agot_maester.0002.desc:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTier]'in [ROOT.Char.GetTitleAsNameNoTooltip] olarak, artık Büyük Üstat tarafından destekleneceksin."

 agot_maester.0002.a:0 "Güzel."

 agot_maester.0002.a.tt:0 "Üstat hem danışman hem saray hekimi olarak hizmet edecek."

 agot_maester.0005.t:0 "[capital.GetNameNoTooltip]'in Yeni "Üstadı""

 agot_maester.0005.desc:0 "[new_maester.GetFirstName] en iyi ihtimalle şüpheli bir hekimdir. [new_maester.GetSheHe|U], Kurul [new_maester.GetHerHim]'i zincirinden etmeden önce eski bir üstat olduğunu iddia ediyor. [new_maester.GetHerHim]'i göndermek için hâlâ geç değil."

 agot_maester.0005.a:0 "Bunda bir sakınca görmüyorum."

 agot_maester.0005.b:0 "Bu kadar alçalmayacağım."

 agot_maester.0006.desc:0 "Görünüşe göre Üstat [new_maester.GetFirstName], yeni bir üstat çağrımı duyduğunda buralardaymış. Umuyoruz ki [new_maester.GetSheHe] sadık ve bilge olur."

 agot_maester.0007.t:0 "Üstatsız"

 agot_maester.0007.desc:0 "Yeni bir üstat arayışım meyve vermedi. Görünüşe göre [capital.GetNameNoTooltip] yakın gelecekte üstatsız kalacak."

 agot_maester.0007.a:0 "Ne kadar hayal kırıklığı."

 agot_maester.0008.t:0 "Gezgin Acemi"

 agot_maester.0008.desc:0 "[acolyte.GetFirstName], bir süre Kale'de eğitim gördüğünü iddia ediyor, ama üstat zinciri olmadan bundan emin olmak imkânsız. [acolyte.GetSheHe|U], görünüşe göre [acolyte.GetHerHis] eğitiminde pek ilerleyememiş. [acolyte.GetFirstNameNoTooltip] aklımdaki kişi olmasa da, [acolyte.GetSheHe] hiç yoktan iyidir."

 agot_maester.0008.a:0 "[acolyte.GetSheHe|U] idare edecek."

 agot_maester.0008.b:0 "Daha iyisini talep ediyorum."

 agot_maester.1000.t:0 "Zincirdeki Halkalar"

 agot_maester.1000.desc:0 "[child.GetFirstName] sessiz bir çocuktur. [child.GetSheHe|U], muhasebecilerin ve üstadın meclisini, yaverlerin ve şövalyelerin meclisine tercih eder. [child.GetSheHe|U] akşamlarını avluda [child.GetHerHis] kılıç talimi yaparak geçirmek yerine, kitaplar ve parşömenlerle çevrili odasında geçirmeyi yeğler.\n\n[child.GetSheHe]'nin bana yaklaşıp, [child.Custom('quirk_pos_present')], [child.GetHerHis] [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]'ten ayrılıp Kale'ye gitme arzusundan söz ettiği gün nihayet gelir. [child.GetSheHe] orada eğitimine başlayıp bir zincir dövmeye çabalayabilir ve bir gün krallığa bir üstat olarak hizmet edebilir."

 agot_maester.1000.a:0 "Yarın Kale'ye gitmek üzere yola çıkabilirsin."

 agot_maester.1000.b:0 "Sen bir [ROOT.Char.GetDynastyNameNoTooltip]'sin, Gri Sıçan değil!"

 agot_maester.1001.t:0 "Yeni Bir Başüstat"

 agot_maester.1001.desc:0 "Üstat [archmaester_candidate.GetFirstName] büyük bir heyecanla yanıma geldi. Başüstat [dead_archmaester.GetFirstName]'in vefatından beri Kale'de yerine birinin seçilmesi için oylama yapıldığını iddia ediyor. Kurul üyeleri, Üstat [archmaester_candidate.GetFirstNameNoTooltip]'in Başüstat makamına yükseltilmesine karar vermiş ve kendisi Kale'ye geri çağrılmış."

 agot_maester.1001.a:0 "Bu harika bir haber!"

 agot_maester.1001.a.tt:0 "Üstat [archmaester_candidate.GetFirstNameNoTooltip], Başüstat unvanına yükseltilecek ve Kale'ye gitmek üzere yola çıkacak."

 agot_maester.1002.t:0 "Yeni Bir Büyük Üstat"

 agot_maester.1002.desc_death:0 "Büyük Üstat [old_grandmaester.GetFirstName]'in vefatıyla, "

 agot_maester.1002.desc_disgraced:0 "Eski Büyük Üstat [disgraced_maester.GetFirstName]'in azledilmesiyle, "

 agot_maester.1002.desc:0 "Kale'deki Kurul, Kraliyet Sarayı'ndaki yeni sözcüleri olarak Büyük Üstat [grandmaester_candidate.GetFirstName]'i seçti. Görünüşe göre yola çıkmış."

 agot_maester.1002.a:0 "Sabırsızlanıyorum."

 agot_maester.1002.b:0 "Umarım yetkindir."

 agot_maester.1003.t:0 "Yeni Büyük Üstat Geliyor"

 agot_maester.1003.desc:0 "Büyük Üstat [grandmaester_candidate.GetFirstName] nihayet saraya ulaştı. Umuyoruz ki krallığa sadakatle hizmet eder."

 agot_maester.1003.a:0 "Dikkatli adım at."

 agot_maester.1004.t:0 "Büyük Bir Hayal Kırıklığı"

 agot_maester.1004.desc:0 "Büyük Üstat [old_grandmaester.GetFirstName]'in görevini kabul etmek üzere yola çıkarken öldüğü bildirildi. Kurul, yeni bir Büyük Üstat seçmek için görüşmelere başladı."

 agot_maester.1004.a:0 "Umarım bu seferki uzun süre dayanır."

 agot_maester.1005.t:0 "Sorgulayan Bir Zihin"

 agot_maester.1005.desc:0 "Üstat [maester.GetFirstName], çocuklarımdan biri hakkında yanıma geldi. [maester.GetSheHe|U], [child.GetFirstName]'in [child.GetHerHis] eğitiminde büyük vaat gösterdiğini ve Kale için iyi bir aday olabileceğini iddia ediyor. [maester.GetSheHe]'ye göre [child.GetFirstNameNoTooltip] orada [child.GetHerHis] kendi yolunu bulabilir ve bir zincir dövmeye çalışarak bir gün krallığa üstat olarak hizmet edebilir."

 agot_maester.1005.a:0 "[child.GetFirstName] yarın Kale'ye gitmek üzere yola çıkıyor."

 agot_maester.1005.b:0 "Çocuğum bir [ROOT.Char.GetDynastyNameNoTooltip], Gri Sıçan değil!"

 agot_maester.1006.t:0 "Üstadın, Rezil Edilmiş"

 agot_maester.1006.desc:0 "Kale'den haber geldi; [disgraced_maester.GetFirstNamePossessive] [secret.GetName] sırrının ortaya çıkması üzerine Kurul, [disgraced_maester.GetHerHis] üstat unvanını geri aldı. [disgraced_maester.GetHerHis] lordu ve [ROOT.Char.GetLadyLord] olarak, Kurul benden [disgraced_maester.GetHerHim]'i sürgüne göndermemi istedi. Karşılığında sarayıma yeni bir üstat göndermeyi teklif ettiler."

 agot_maester.1006.a:0 "Seninle işim olmaz, gri sıçan."

 agot_maester.1006.a.tt:0 "[disgraced_maester.GetName] Westeros'tan sürgün edilecek"

 agot_maester.1006.b:0 "Senin yerin soğuk bir zindan."

 agot_maester.1006.b.tt:0 "[disgraced_maester.GetName] senin tarafından hapsedilecek"

 agot_maester.1006.c:0 "Bu hiçbir şeyi değiştirmedi."

 agot_maester.1006.c.tt:0 "[disgraced_maester.GetName] üstadın olarak görevine devam edecek"
