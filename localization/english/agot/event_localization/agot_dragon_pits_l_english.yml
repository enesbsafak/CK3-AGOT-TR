 agot_dragon_pits.1100.t:0 "Vahşi Doğada Gezen Bir Ejderha"

 agot_dragon_pits.1100.desc:0 "[removed_dragon.GetName] yakın zamanda [dragon_pit_location.GetNameNoTier] Ejderha Çukuru'ndan salıverildi ve artık çevredeki vahşi doğada serbestçe dolaşıyor.\n\nKöy ve kasabaların görüş alanına ara sıra giren [removed_dragon.GetNameNoTooltip] şimdiye dek yalnızca bir balıkçının tuttuğu balıkları çaldı; ama küçük halk, ejderhanın bir sonraki hamlesinin ne olacağından endişeli."

 agot_dragon_pits.1100.a:0 "Elbette endişelenmelerine gerek yoktur?"

 agot_dragon_pits.1200.t:0 "Yaban Ejderhasını Yakalamak"

 agot_dragon_pits.1200.desc:0 "[wild_dragon.GetName] vahşi ve [wild_dragon.Custom('GetDragonHerHim')]'i hapsetmeye yönelik herhangi bir girişime şiddetle direnmesi muhtemel; [wild_dragon.Custom('GetDragonSheHe')] ejderha çukuruna gönüllü gitmeyecek.\n\n[wild_dragon.GetNameNoTooltip]'i açık gökyüzünün altında bırakmak, [wild_dragon.Custom('GetDragonHerHis')] yabanıl dehşetinin küçük halkın üzerine çökmesi riskini taşıyor.\n\nHalkımın ve topraklarımın refahı için, bu iş için doğru kişinin canavarı, zarar verebileceklerinden uzakta hapsetme çabasını hızla koordine etmesi şart."

 agot_dragon_pits.1200.a:0 "[head_dragonkeeper.GetShortUIName]'in önderliğindeki Ejderha Bakıcıları bu iş için en uygunları."

 agot_dragon_pits.1200.b:0 "Çabaya bizzat ben önderlik edeceğim!"

 agot_dragon_pits.1200.c:0 "Kaptanlarımdan biri bu işi yapar."

 agot_dragon_pits.1200.d:0 "Aslında, bu çok tehlikeli."

 agot_dragon_pits.1200.a.success:0 "[wild_dragon.GetName] ejderha çukuruna #P zorla sokuldu#!"

 agot_dragon_pits.1200.a.failure:0 "[wild_dragon.GetName], ejderha çukuruna zorla sokulmaya #N direniyor#!"

