 agot_dragon_pits.0001.t:0 "Yeniden İnşa Edilen Ejderha Çukuru" #(Dragon Egg)

 agot_dragon_pits.0001.desc:0 "Kralın Şehri'nin Ejderha Çukuru eski ihtişamına kavuşturuldu!\n\nEjderhaların Dansı'ndan ve küçük halkın baskınından bu yana büyük çukur, eski halinin bir gölgesiydi; amacına uygun olmayan bir harabe.\n\nAma o gecenin enkazı artık temizlendi. Yapının ihtişamı geri kazanılmış olsa da çukurun kendisi hâlâ amaçsız. Belki de kaderi, tahtta kalan birkaç yumurta için en görkemli sergi salonu olarak hizmet etmek.\n\nAncak, Westeros'un dört bir yanındaki lordlar ve leydiler, bu restorasyonun geçmişi onurlandırma arzusundan mı yoksa geleceğe dair çarpık bir hırstan mı kaynaklandığını merak etmeye başladı..."

 agot_dragon_pits.0001.a:0 "Ne planlıyorlar?"

 agot_dragon_pits.0002.desc:0 "Kralın Şehri'nin Ejderha Çukuru eski ihtişamına kavuşturuldu!\n\nEjderhaların Dansı'ndan ve küçük halkın baskınından bu yana büyük çukur, eski halinin bir gölgesiydi; amacına uygun olmayan bir harabe.\n\nAma o gecenin enkazı artık temizlendi. Ejderhaların dönüşü, çukurun şehrin köylülerinden uzakta, yeniden canavarlara ev sahipliği yapmasına yönelik yeni bir ihtiyacı müjdeledi.\n\nLordlar ve küçük halk ejderhaların dönüşüne ne kadar endişeyle yaklaşsa da, çok azı artık tahtın yeniden kazanılmış gücünün görkemli bir anıtı olarak duran Ejderha Çukuru'nun restorasyonuna karşı çıkıyor."

 agot_dragon_pits.0002.a:0 "En azından başıboş kalmayacaklar!"

 agot_dragon_pits.0005.t:0 "[generic_dragonpit.GetNameNoTooltip] Ejderha Çukuru"

 agot_dragon_pits.0005.desc:0 "Aylar süren titiz planlama ve inşaatın ardından [generic_dragonpit.GetName]'de yeni bir [dragonpit|E] yükseldi!\n\n"

 agot_dragon_pits.0005.westeros:0 "Westeros'ta türünün ilk örneği olmasa da, yakında sokakların altında ejderhalara ev sahipliği yapabilecek bu görkemli yapı karşısında küçük halk hâlâ hayretle ağzı açık bakıyor. Bu düşünce, bazı köylüleri yeni çukurdaki ejderhalara karşı hararetli muhalefet beyanlarına itti; ama çoğu, soyluların entrikalarını durduramayacaklarını biliyor."

 agot_dragon_pits.0005.elsewhere:0 "Soylu ve sıradan herkes, kubbeli çatısının altında yakında ejderhalara ev sahipliği yapabilecek bu görkemli yapı karşısında hayrete düşüyor. R'hllor'a tapanlar ve diğer, daha ezoterik dinlerin bazı müritleri ateşi ve kanı selamlayarak övgüler yağdırıyor. Çoğu ise bu yeni inşaatı, yeni kazanılmış gücün uğursuz bir işareti olarak görüyor."

 agot_dragon_pits.0005.a:0 "Ne büyük bir başarı!"

