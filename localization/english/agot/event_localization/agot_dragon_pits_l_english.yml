 agot_dragon_pits.2002.t:0 "Bol Yumurta"

 agot_dragon_pits.2002.desc_dead:0 "[head_dragonkeeper.GetFirstName]'in ölümüyle, yeni bir Baş Ejderha Bakıcısı atanana dek tarikat ejderha çukurundaki yumurtaları gözetleyemeyecek."

 agot_dragon_pits.2002.desc_alive:0 "[head_dragonkeeper.GetFirstName] artık Baş Ejderha Bakıcısı olarak hizmet edemeyeceğine göre, yeni bir baş atanana dek tarikat ejderha çukurundaki yumurtaları gözetleyemeyecek."

 agot_dragon_pits.2002.a:0 "Talihsizlik."

 agot_dragon_pits.2002.pitted_eggs_return:0 "Çukura konmuş tüm ejderha yumurtaları envanterine geri döndü"

 agot_dragon_pits.2003.t:0 "Bol Yumurta"

 agot_dragon_pits.2003.desc:0 "Artık [title.GetName]'in hükümdarı olduğuma göre, ejderha çukurunun da kontrolü bende. Bölgeyi inceledikten sonra, kuluçkahanenin boş olmadığı anlaşılıyor."

 agot_dragon_pits.2003.a:0 "Harika bir keşif!"

 agot_dragon_pits.2004.t:0 "Cansız Yumurta"

 agot_dragon_pits.2004.desc:0 "[head_dragonkeeper.GetFirstName] endişeyle yanıma yaklaşıyor. "[ROOT.Char.GetLadyLord], görünüşe göre [egg.GetName] soğumuş. Artık asla yumurtadan çıkmayacak ve bir gün taşa dönüşecek; kuluçkahanede tutmanın pek anlamı yok.""

 agot_dragon_pits.2004.a:0 "Talihsizlik."

 agot_dragon_pits.2006.t:0 "Bir Ejderhanın Doğumu"

 agot_dragon_pits.2006.desc:0 "[head_dragonkeeper.GetFirstName] heyecanla yanıma yaklaşıyor. "[ROOT.Char.GetLadyLord], aceleyle ejderha çukuruna gelmelisiniz; yumurtalardan biri çatladı! [dragon.Custom('GetDragonHerHim')]'e ne isim vereceğiz?""

 agot_dragon_pits.2006.a:0 "Harika!"

 agot_dragon_pits.3000.t:0 "Ejderha Çukuru Ziyareti: Bir İkilem"

 agot_dragon_pits.3000.desc:0 "[recipient.GetName], ejderhaların ailemiz için önemini kavrayabilecek bir yaşa ulaştı. [recipient.GetHerHim]'i ejderhaların harikalarıyla tanıştırmak istiyorum; ama kendimi bir kararın karşısında buluyorum. [dp_county_option.GetNameNoTierNoTooltip]'in geleneksel ejderha çukurunu ziyaret edebiliriz ya da ejderhaların serbestçe dolaşıp hem güçlendiği hem vahşileştiği [dragonstone.GetNameNoTierNoTooltip]'e gidebiliriz. Nereye gideceğiz?"

 agot_dragon_pits.3000.a:0 "[dragonstone.GetNameNoTierNoTooltip]."

 agot_dragon_pits.3000.b:0 "[dp_county_option.GetNameNoTierNoTooltip]."

 agot_dragon_pits.3002.t:0 "Ejderha Çukuru Ziyareti: Felaket!"

 agot_dragon_pits.3002.desc:0 "Çukurun ağır, kadim kapıları girerken gıcırdıyor. Yanımda yürüyen, cesur görünmeye çalışan [recipient.GetName]'e aşağıdan bir bakış atıyorum; ama [recipient.GetHerHis] adımlarındaki gergin titremeyi hissediyorum. Yaklaştığımızda [dragon.GetName] [dragon.Custom('GetDragonHerHis')] başını kaldırıyor, burun delikleri açılıyor ve bir anda her şey korkunç biçimde ters gidiyor. Canavar ürkütücü bir öfkeyle kükreyerek [recipient.GetNameNoTooltip]'i geriye savuruyor; [recipient.GetHerHis] yüzüne dehşet kazınmış. Umut ettiğim bağ, gözlerimin önünde parçalanıyor; yerine kör bir korku geçiyor. Ne yaptım ben? Onu mahvettim... bizi mahvettim."

 agot_dragon_pits.3002.a:0 "Elbette [recipient.GetSheHe] zamanla bunu atlatacaktır..."

 agot_dragon_pits.3003.t:0 "Ejderha Çukuru Ziyareti: Hayal Kırıklığı"

 agot_dragon_pits.3003.desc:0 "Havadaki gerginliği hissediyorum; [recipient.GetName] ile ejderha çukuruna inerken, ağır taş basamaklar ayaklarımızın altında yankılanıyor. [recipient.GetHerHim]'e bakıyor, bugünün [recipient.GetSheHe]'nin [recipient.GetHerHis] mirasını inşa edeceği gün olup olmayacağını merak ediyorum. Yaklaştığımızda [dragon.GetName] [dragon.Custom('GetDragonHerHis')] ininde kımıldanıyor, [dragon.Custom('GetDragonHerHis')] pulları loş ışıkta parlıyor. Ama bir şeyler ters. [recipient.GetNameNoTooltip] birden duruyor, gözleri çukurda gezinip duruyor; ama ortada merak ya da hayranlık kıvılcımı yok.\n\n[recipient.GetHerHim]'i ilerlemesi için cesaretlendiriyorum ama [recipient.GetHerHis] adımları tökezliyor ve [recipient.GetSheHe] kaşlarını çatarak bana dönüyor. "Üzgünüm ama benim için kaderinde bir ejderha varsa, onun burada olduğunu sanmıyorum.""

 agot_dragon_pits.3003.a:0 "Talihsizlik."

 agot_dragon_pits.3004.t:0 "Ejderha Çukuru Ziyareti: Başarı!"

 agot_dragon_pits.3004.desc:0 "Ejderha çukuruna adım attığımız anda, bunun farklı olacağını biliyorum. Hava enerjiyle çıtırdıyor ve [recipient.GetName] yanımda, beni gururla dolduran sakin bir kararlılıkla yürüyor. [recipient.GetSheHe|U] durup sessiz bir tefekkürle etrafına bakınıyor, [recipient.GetHerHis] seçeneklerini tartıyor.\n\nSonunda [recipient.GetHerHis] bakışı [dragon.GetName]'in yönüne sabitleniyor. Büyük canavar [dragon.Custom('GetDragonHerHis')] başını çevirip gözlerini [recipient.GetFirstNamePossessiveNoTooltip] ile kilitleyince nefesim kesiliyor. Yavaşça, temkinle [recipient.GetNameNoTooltip] titreyen bir el uzatıyor ve ejderha [dragon.Custom('GetDragonHerHis')] burnunu eğiyor. Zaman durmuş gibi. Ejderha yumuşakça homurdanıyor ve dokunuşu kabul ediyor. Yüreğim coşuyor. İşte bu. Bir bağın başlangıcı."

 agot_dragon_pits.3004.a:0 "Mükemmel bir eşleşme!"

 child_is_bonding_dragon_tt:0 "[recipient.GetNameNoTooltip], [dragon.GetNameNoTooltip] ile bağ kurmaya başladı"

 agot_dragon_pits.3005.t:0 "Ejderha Çukuru Ziyareti: Felaket!"

 agot_dragon_pits.3005.desc:0 "Çukur bugün daha karanlık, daha uğursuz görünüyor. Yutkunarak, [recipient.GetName]'in üzerime çöken huzursuzluğu fark etmemesini umuyorum. [recipient.GetSheHe|U] öne çıkıyor, [recipient.GetHerHis] gözlerinde kararlılık; ama [recipient.GetHerHis] omuzlarındaki gerginliği görüyorum. [recipient.GetSheHe|U] [dragon.GetName]'e doğru uzanıyor, ancak bir şey korkunç biçimde ters gidiyor. Ejderha tıslıyor, gözlerini kısıyor ve bir anda [dragon.Custom('GetDragonSheHe')] reddederek saldırıyor. [recipient.GetNameNoTooltip] geriye sendeliyor, [recipient.GetHerHis] yüzü bembeyaz. Bu bağ kader değilmiş ve [recipient.GetHerHis] ruhuna kazınmış başarısızlık acısını görüyorum."

 agot_dragon_pits.3005.a:0 "Ne yaptım ben..."

 child_failed_to_tame_tt:0 "[recipient.GetNameNoTooltip], [dragon.GetNameNoTooltip]'i ehlileştiremedi"

 agot_dragon_pits.3006.t:0 "Ejderha Çukuru Ziyareti: Başarı!"

 agot_dragon_pits.3006.desc:0 "Ejderha çukuruna yaklaşırken hava gerginlikle dolu; ama bu, büyüklüğü besleyen türden bir gerginlik. [recipient.GetName] yanımda yürüyor, [recipient.GetHerHis] adımları kendinden emin, gözleri heyecanla parlıyor. Karanlık geniş alana adım attığımızda bir umut dalgası hissediyorum ve [dragon.GetName] [dragon.Custom('GetDragonHerHis')] başını bizi izlemek için çeviriyor.\n\n[recipient.GetNameNoTooltip] derin bir nefes alıp kendisine yaklaşmasını hafif bir merakla izleyen [dragon.GetNameNoTooltip]'e yöneliyor. Yavaşça, dikkatlice [recipient.GetSheHe] bir el uzatıyor ve benim hayretler içinde izlememe rağmen ejderha [dragon.Custom('GetDragonHerHis')] başını eğiyor. Ne bir tereddüt, ne bir korku—yalnızca saygı. Göğsümde bir sevinç kabarıyor. [recipient.GetNameNoTooltip] başardı. [recipient.GetSheHe|U] canavarı ehlileştirdi."

 agot_dragon_pits.3006.a:0 "Harika!"

 child_succeeded_taming_tt:0 "[recipient.GetNameNoTooltip], [dragon.GetNameNoTooltip]'i ehlileştirmeyi başardı"

