 agot_dragon_pits.0999.desc:0 "[dp_county.GetName]'deki Ejderha Çukuru ile nasıl etkileşime geçmek istediğini seç."

 agot_dragon_pits.0999.a:0 "Bu ejderha çukurundaki ejderhaları görmek istiyorum."

 agot_dragon_pits.0999.d:0 "Bu ejderha çukurunun yumurtalarını görmek istiyorum."

 agot_dragon_pits.0999.b:0 "Bu ejderha çukurunun yetkili ehlileştiricilerini görmek istiyorum."

 agot_dragon_pits.0999.c:0 "Bu kadar yeter, teşekkürler."

