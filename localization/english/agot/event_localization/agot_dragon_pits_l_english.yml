 agot_dragon_pits.1201.t:0 "Yaban Ejderhasını Yakalamak"

 agot_dragon_pits.1201.desc:0 "Kaptanlarımdan hangisi [wild_dragon.GetName]'i yakalama çabasına önderlik edecek?"

 agot_dragon_pits.1201.a:0 "Seni seçiyorum..."

 agot_dragon_pits.1201.refusal.t:0 "Yakalama Talebi Reddedildi"

 agot_dragon_pits.1201.refusal.desc:0 "[knight.GetName], [wild_dragon.GetName]'i yakalamayı #N reddediyor#!"

