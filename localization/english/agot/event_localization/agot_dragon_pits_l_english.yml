 agot_capture_dragon_cd_gui_tt:0 "Bir ejderhayı ancak [GetVarTimeRemaining( owner.MakeScope, 'capture_cd')] gün sonra yakalayabilirsin"

 agot_dragon_pits.1301.t:0 "[baby_dragon.GetNameNoTooltip] Huzursuzlaşıyor"

 agot_dragon_pits.1301.desc:0 "Üç yıldır [baby_dragon.GetName]'in büyümesini izliyorum; [baby_dragon.Custom('GetDragonSheHe')] [baby_dragon.Custom('GetDragonHerHis')] yumurtasından sürünerek çıktığından beri. Ama artık [baby_dragon.Custom('GetDragonSheHe')] [baby_dragon.Custom('GetDragonHerHis')] kaotik ve ateşli doğasının gerçekten kök saldığı bir yaşta.\n\nÜstatlar, üç yaşındaki ejderhaların çiftlik hayvanlarını, malları ve hatta insanları çalma ve yakma eğilimlerinin önemli ölçüde arttığını yazıyor.\n\n[baby_dragon.GetNameNoTooltip]'in uslu duracağına güvenebilir miyim? Yoksa [baby_dragon.Custom('GetDragonSheHe')] birine zarar vermeden önce [baby_dragon.Custom('GetDragonHerHim')]'i ejderha çukuruma mı kapatmalıyım?"

 agot_dragon_pits.1301.a:0 "Yapalım, riske atamayız!"

 agot_dragon_pits.1301.b:0 "Hayır, [baby_dragon.Custom('GetDragonHerHim')]'i zincire vuracak değilim."

 agot_dragon_pit_moved_to_capital_pit.t:0 "Ejderha Yeni Ejderha Çukuruna Taşındı"

 agot_dragon_pit_moved_to_capital_pit.tt:0 "[i_am_a_dragon_in_pit.GetName], [capital.GetNameNoTier]'deki ejderha çukuruna ulaştı."

 agot_dragon_pits.2000.t:0 "Yeni Bir Yuva"

 agot_dragon_pits.2000.desc:0 ""Bu yumurtayı ejderha çukurlarınızdan hangisine göndermek istersiniz, [ROOT.Char.GetLadyLord]?" diye soruyor [recipient.GetFirstName]. "Aklınızda bulunsun, yumurta yumurtadan çıkarsa, yavruyu yerleşmesi için bir bağı olmadan başka bir ejderha çukuruna taşımak zor olacak.""

 agot_dragon_pits.2000.desc_mult:0 ""Bu yumurtaları ejderha çukurlarınızdan hangisine göndermek istersiniz, [ROOT.Char.GetLadyLord]?" diye soruyor [recipient.GetFirstName]. "Aklınızda bulunsun, yumurtalardan herhangi biri yumurtadan çıkarsa, yavruları yerleşmeleri için bir bağı olmadan başka bir ejderha çukuruna taşımak zor olacak.""

