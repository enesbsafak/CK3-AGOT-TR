l_english:

 agot_scenario_aa.0001.t:0 "Ashford'un Gölgelerinde"

 agot_scenario_aa.0001.desc:0 "Trajedi bir kez daha hem bana hem haneme isabet etti. İlk oğlum ve varisim [breakspear.GetFirstNameNicknamed], Ashford Çayırı Turnuvası'nda en küçük oğlum [maekar.GetTitledFirstName] tarafından trajik biçimde öldürüldü. Şimdi [valarr.GetFirstName]'e — Baelor'un oğlu, şimdi Dragonstone Prensi ve Kralın Eli — sonunda vefat ettiğimde, babasının olacağı gibi büyük bir kral olabilmesi için yol göstermek bana düşüyor.\n\nYediler beni ve saltanatımı sınamaya devam ediyor; ailemin bir kez daha istikrar ve neşe bulmasını umuyorum..."

 agot_scenario_aa.0001.desc_blackfyres:0 "\n\nYine de denizlerin ötesinden, kardeşim [bittersteel.GetFirstNameNicknamed] ve yeğenim [daemon.GetFirstNameNicknamed] hakkında gelen fısıltılar tedirgin edici. Blackfyreların sancaklarını bir kez daha yükseltmemesini, bu huzursuz barışın sürmesini ve yaşlı bir adamın #bold yas tutabilmesini#! dilerim..."

 agot_scenario_aa.0001.a:0 "İlerlemeliyim."

 agot_scenario_aa.0002.t:0 "$agot_scenario_aa.0001.t$"

 agot_scenario_aa.0002.desc:0 "Akrabakatili [maekar.GetFirstName], kardeşi Dragonstone Prensi [breakspear.GetFirstNameNicknamed]'i öldürdü. Uysal [daeron.GetFirstNameRegnal], Demir Taht'ın üzerinde yas tutuyor — ve yeşil topraklardaki dengesiz barış, gözlerinin önünde çözülüyor. Değişim rüzgârları bir kez daha Westeros'u sarıyor.\n\nAtalarım böyle zamanlarda yeşillicileri ve tarlalarıyla madenlerini sömürürdü. Ben de onların izinden gidip eski yolların yalnızca unutulmamakla kalmamasını, bir kez daha serpilmesini sağlamayı amaçlıyorum. Biz Demirdoğanlar, bize ait olanı alırız ve bize ait olan, yeşil olan her şeydir."

 agot_scenario_aa.0002.a:0 "Biz ekmeyiz."

 agot_scenario_aa.0003.t:0 "$agot_scenario_aa.0001.t$"

 agot_scenario_aa.0003.desc:0 "On üç yıldır kardeşlerim ve ben Tyrosh'ta kafese kapatılmış haldeyiz. Geldiğimizde amcamız [bittersteel.GetFirstNameNicknamedPossessive] bakımında bebeklerdik — ama artık büyümüş kadınlar ve erkekler olduk ve Bittersteel hâlâ Kara Ejderha'yı bir kez daha isyana kaldırmayı reddediyor. Zamanın henüz gelmediğini söylüyor. Önümüzdeki zorlukları görmediğimi... #bold hazır#! olmadığımı söylüyor.\n\nNe var ki Bittersteel, Tartışmalı Topraklar'da paralı askerlik oynamaya gitti ve #italic ben#! artık [ROOT.Char.GetHouse.GetName] Hanesi'nin geleceğine hükmedebilirim. Kuzenim [breakspear.GetFirstNameNicknamed]'in ölümü sonunda bize fırsat sunuyor. Hazırlıklar çoktan yapılıyor, zaferimin tohumları Dar Deniz'in ötesine çoktan ekildi... tek yapmam gereken, zaferin meyveleri toplanmaya hazır olduğunda uzanmak."

 agot_scenario_aa.0003.a:0 "Sonunda babamın doğuştan hakkını alacağım."

 agot_scenario_aa.0004.t:0 "$agot_scenario_aa.0001.t$"

 agot_scenario_aa.0004.desc:0 "Yüreğim kırık; babam [baelor.GetName], [duncan.GetName]'i savunurken amcam [maekar.GetFirstName]'in elinde can verdi. #italic Neden?#! Tanrılar neden çitlerin bir şövalyesini babama tercih etti?\n\nAshford'da genç bir prens olarak girdim ve mızrak dövüşünde yarım düzineden fazla tecrübeli şövalyeyi atından indirerek şampiyon oldum. Ve en sonunda, büyükbabam [king.GetName]'in Dragonstone Prensi ve Kralın Eli olarak atanmamı bekleyerek ayrıldım. Henüz talep etmemek için her şeyi vereceğim bir onur.\n\n[baelor.GetNameNoTooltip], Westeros'u şereflendiren en büyük krallardan biri olabilirdi; ama şimdi [king.GetFirstNameNoTooltip] vefat ettiğinde onun yerini almak zorunda kalacağım. Yirmi yıl kadar erken, babamın yerine... Ben buna hazır mıyım?"

 agot_scenario_aa.0004.a:0 "İyi bir kral olacağım, babacığım. Senin olacağın gibi."

 agot_scenario_aa.0005.t:0 "$agot_scenario_aa.0001.t$"

 agot_scenario_aa.0005.desc:0 "Ölmüş bir prens, sürgün bir prens ve yas tutan bir diyar. Ashford'daki düşlerimin sonu tam da bu oldu. Büyük bir şövalye olma hevesiyle bu turnuvaya bir gölge düşürdüm; korkarım bu gölge tüm diyara yayılacak. Bu turnuvadan önce çitlerin sıradan bir şövalyesiydim, ama şimdi adımı ejderhanın hanesi de bilir, alçak ve yüksek lordlar da. Keşke Ser Arlan'a ne yapacağımı sorabilsem...\n\nAma Ser Arlan çoktan gitti. Geriye kalan benim. Yediler'in Sınavı'ndan zaferle çıkan benim ve Prens Maekar'ın bir şövalyede değer gördüğü kişi benim. Summerhall'daki hizmet teklifini reddetsem de, oğlu [aegonfive.GetName]'e, Ser Arlan'ın bir zamanlar bana öğrettiği gibi ders vermeliyim.\n\nYolculuğumuz şimdi başlıyor, ama önce Ashford'un gölgelerinden çıkıp bu işi arkamızda bırakmalıyız."

 agot_scenario_aa.0005.a:0 "Dorne'a, [aegonfive.GetFirstNameNoTooltip]'in akrabalarını görmeye."

 agot_scenario_aa.0005.a_tt:0 "Sen ve [domicile|E]'in [GetTitleByKey('b_sunspear').GetNameNoTier]'e yolculuk edeceksiniz."

 agot_scenario_aa.0005.b:0 "Kendi yolumu kendim çizeceğim.."

 agot_scenario_aa.0006.t:0 "$agot_scenario_aa.0001.t$"

 agot_scenario_aa.0006.desc:0 "Ne yaptım ben? Sevgili kardeşim [baelor.GetName], kendi elimle öldü. Diyar bana akrabakatili diyecek ve suçlu yargılayacak olsa da, o topuz onu öldürmek için hiç tasarlanmadı. Artık bir hırsızım. Diyarı bir veliahttan ettim. Yeğenlerimi babalarından ettim. Annemi ilk oğlundan ettim.\n\nBu hırsızlıkların karşılığında, ben de bir oğul kaybettim; [aerion.GetName]'i Lys'e sürgün ettim. Umuyorum ki zalimliğini orada unutur ve bir gün düzgün bir adam olarak döner. Diğer oğlum [aegonfive.GetName]'i [duncan.GetName]'e emanet ettim; ne var ki adam bana hizmet teklifimi reddetti. Umarım Egg bana gerçek bir şövalye olarak döner. Kendime gelince, Summerhall'a döndüm. Burada sonsuza dek Baelor Kırkmızrak'ın yasını tutacağım.\n\nTanrıların zalim olduğunu uzun zamandır duyardım, ama bunun ne anlama geldiğini şimdiye dek hiç anlamamıştım. Yüreğimdeki acı hiç dinmeyecek, biliyorum. #italic İzin vermeyeceğim#!.\n\nÖrs çekicisiz kaldı ve geriye kalan, kırık bir şey."

 agot_scenario_aa.0006.a:0 "Baelor, üzgünüm."
