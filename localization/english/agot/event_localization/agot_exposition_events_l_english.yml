l_english:

 agot_exposition_events.house_name.t:0 "[ROOT.Char.GetHouse.GetNameNoTooltip] Hanesi"

 agot_exposition_events.opt.house_words:0 "[ROOT.Char.GetHouse.GetMotto]"

 agot_exposition_events.0001.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Kartal Yuvası'nın Efendisi, Vadi'nin Savunucusu ve Doğu'nun Muhafızı! Arryn Hanesi, Dağ ve Vadi Krallarından gelir ve Yedi Krallık'taki en eski ve en soylu Andal mirasına sahiptir. Topraklarınız batıda Ay Dağları tarafından korunur; haneniz, fethedilemez Kartal Yuvası kalesindeki makamınızdan yüzyıllardır Arryn Vadisi'nin tepelerine ve vadilerine hükmetmiştir."

 agot_exposition_events.0002.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Fırtına Burnu'nun Efendisi ve Fırtına Toprakları'nın Üst Derece Efendisi! Hanenizin evladı Orys Baratheon, 'Fatih' Aegon'un yoldaşıydı ve son Fırtına Kralı'nı teke tek çarpışmada öldürdü. Durrandon Hanesi'nin sözlerini, topraklarını ve armasını kendi hanesi için aldı. O günden beri Baratheonlar, Fırtına Toprakları'nın Üst Derece Efendileri olarak hüküm sürüyor. Westeros'un diğer krallıkları kadar zengin ve kalabalık olmasak da, topraklarımız yüzyıllarca Dornelilere karşı sürdürülen savaşlarla bilenmiş korkusuz savaşçılarıyla ünlüdür."

 agot_exposition_events.0003.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Deniz Rüzgârının Oğlu, Pyke'ın Biçen Efendisi ve Demir Adalar'ın Efendisi!"

 agot_exposition_events.0004.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Casterly Kayası'nın Efendisi, Lannisport'un Kalkanı ve Batı'nın Muhafızı!"

 agot_exposition_events.0005.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Güngülce'nin Efendisi ve Dorne Prensi!"

 agot_exposition_events.0006.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Kışyarı'nın Efendisi ve Kuzey'in Muhafızı!"

 agot_exposition_events.0007.desc:0 "Yaşasın Kral [ROOT.Char.GetFirstNameNoTooltip], Andalların, Rhoynarların ve İlk İnsanların Kralı, Yedi Krallık'ın Efendisi ve Diyarın Koruyucusu! Damarlarınızda ejderhanın kanı akıyor. Targaryenlar, Westeros'un gördüğü en büyük hanedandır; kadim Valyria'nın ejderha lordlarının ve Yedi Krallık'ı ateş ve kanla birleştiren 'Fatih' Aegon'un varisleridir."

 agot_exposition_events.0008.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Riverrun'un Efendisi ve Üçdiş'in Üst Derece Efendisi!"

 agot_exposition_events.0009.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Highgarden'ın Efendisi, Mander'in Üst Derece Efendisi, Sınır Bölgelerinin Savunucusu, Reach'in Yüksek Mareşali ve Güney'in Muhafızı!"

 agot_exposition_events.0010.desc:0 "Yaşasın Lord [ROOT.Char.GetFirstNameNoTooltip], Eskişehir'in Sesi, Limanın Efendisi, Yüksekkule'nin Efendisi, Sitadel'in Savunucusu ve Güney'in Feneri!"

 agot_exposition_events.0011.desc:0 "[ROOT.Char.GetDynasty.GetNameNoTooltip] Hanesi, Kurt Ormanı'nı Demirdoğan akınlarına karşı savunmakla görevli, [ROOT.Char.GetLiege.GetHouse.GetNameNoTooltip] Hanesi'ne bağlı Derin Orman Hisarı'nın Efendileridir. Topraklarımız geniştir ve birçok hane ile adam bize bağlıdır."

 agot_exposition_events.0012.desc:0 "[ROOT.Char.GetHouse.GetNameNoTooltip] Hanesi, Boyun'u güneyli lordlara karşı savunmakla görevli, [ROOT.Char.GetLiege.GetHouse.GetNameNoTooltip] Hanesi'ne bağlı Gri Su Gözcülüğü'nün Efendileridir. Gizli yerler ve ölümcül tuzaklarla dolu bataklıklarımız düşmanlarımızı bütünüyle yutacaktır."
