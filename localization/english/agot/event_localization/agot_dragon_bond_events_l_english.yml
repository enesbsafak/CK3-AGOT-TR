l_english:

 dragon_bond_events.1000.t:0 "Kurulan Bağ"

 dragon_bond_events.1000.desc:0 "[target.GetNameNicknamed]. [target.Custom('GetDragonSheHe')|U] şimdi #bold BENİM!#!\n\nBir ejderhanın kalbini kimsenin bilemeyeceğini söylerler ama [target.GetNameNoTooltip] benimkini gördü ve [target.Custom('GetDragonSheHe')] onu layık buldu. Artık bağlandık; kan, et ve ateşten bir birliktelik.\n\n[ROOT.Char.GetCapitalLocation.GetName]'den Asshai'nin ötesindeki Gölge Topraklar'a dek bilinsin ki ben, [ROOT.Char.GetFullNameNoTooltip], ejderha [target.GetNameNoTooltip]'i kendime ait olarak sahipleniyorum. [ROOT.Char.GetHouse.GetNameNoTooltip] Hanedanı'ndan [GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')] sevinsin; zira yeni bir [Concept('owned_dragon','dragon')|E] doğuyor.\n\n[ROOT.Char.GetHouse.GetMotto]!"

 dragon_bond_events.1000.a:0 "Nefes aldığım sürece bu günü asla unutmayacağım."

 dragon_bond_events.1001.t:0 "[target.GetNameNoTooltip] Bağı Reddediyor"

 dragon_bond_events.1001.desc:0 "Kötü bir önseziyle dolu olarak [target.GetNameNicknamedPossessive] inine ilerliyorum. İçimdeki her şey [ROOT.Char.Custom('ResidenceBuilding')]'ıma dönmemi haykırsa da kendimi bir adım, sonra bir adım daha atmaya zorluyorum; ta ki [target.GetNameNoTooltip]'e birkaç adım mesafeye gelene dek. Yaklaştığımda [Concept('owned_dragon','dragon')|E] kımıldanıyor, [target.Custom('GetDragonHerHis')] çenesinde tuttuğu kömürleşmiş [GetPlayer.Custom('RegionalEdibleAnimal')] ile ilgilenmeyi bırakıyor. [target.Custom('GetDragonHerHis')|U] gözleri, bir kuşa bakan kedi gibi, kötü niyetli bir merakla beni izliyor.\n\nCesaretimin kırıntılarını toplayarak elimi yaratığa doğru uzatıyorum. Parmaklarım bir el genişliği mesafedeyken [target.GetNameNoTooltip] birden üzerime atılıyor; [target.Custom('GetDragonHerHis')] [target.Custom('GetDragonColor')] çeneleri parmaklarımın kıl payı uzağında şaklıyor. [target.Custom('GetDragonHerHis')] tam boyuna yükselen [target.GetNameNoTooltip] uyarı niteliğinde kükreyor ve [target.Custom('GetDragonHerHis')] dişlerinin ardında turuncu alev kıvrımlarının biriktiğini görüyorum. Damarlarımda panik, inden kaçıyorum; ancak [GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')]'imin güvenliğine ulaştığımda duruyorum."

 dragon_bond_events.1001.a:0 "[ROOT.Char.GetFaith.DevilName] alsın o [ROOT.Char.Custom('InsultAdjective')] yılanı!"

 dragon_bond_events.1002.t:0 "[target.GetNamePossessiveNoTooltip] Yakıcı Azarı"

 dragon_bond_events.1002.desc:0 "Endişeyle doluyum; [dragon|E] [target.GetNameNicknamed]'e yaklaşıyorum. Ama bu korkum, hevesimle fazlasıyla dengeleniyor. Hangi [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.Char.Custom('GirlBoy')] gençliğinde bir ejderhaya arkadaş olmayı hayal etmedi ki? Bugün hangi [ROOT.Char.GetTitleAsNameNoTooltip] risklere rağmen böyle bir güce uzanmaz ki?\n\nYine de canavara yaklaştıkça [ROOT.Char.Custom('GirlBoy')]luk fantezilerim sarsılıyor. [target.GetNameNoTooltip] bariz biçimde tedirgin: [target.Custom('GetDragonSheHe')|U] yere çömelmiş, iri gözleri benimkilere kilitli ve [target.Custom('GetDragonHerHis')] [target.Custom('GetDragonColorFull')] pullu kuyruğu uğursuzca sallanıyor. Ama şüphe için çok geç; tek yol ileri. Elim [target.Custom('GetDragonHerHis')] hırlayan ağzına doğru uzanırken kadim Valyria'nın sakinleştirme sözlerini söylemeye başlıyorum: #italic Lykirī! Ryptē—#!\n\nDaha yeni başlamıştım ki görüş alanım alevle, dünyamsa acıyla doldu. Ve sonra #bold çığlık#! atmaya başlıyorum.\n\nBaşım haşhaş sütünün ağırlığıyla dolu, daha sonra [ROOT.Char.GetCapitalLocation.GetName]'daki yatağımda uyanıyorum. Beynimden karnıma dek irin dolu sargılara sarılmışım — ve kıvranıyorum. Ama ne yazık ki, yaşıyorum."

 dragon_bond_events.1002.a:0 "Bu kadar yaklaşmışken..."

 dragon_bond_events.1003.t:0 "[target.GetNameNoTooltip], [ROOT.Char.GetTitleAsNameNoTooltip|U]yakıcısı"

 dragon_bond_events.1003.desc:0 "Gün geldi: sonunda [dragon|El] [target.GetNameNoTooltip] ile bağ kuracağım. [ROOT.Char.GetHouse.GetMotto]!\n\n[GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')]'imi [target.GetNameNoTooltip]'in ininin dışında bırakıp tek başıma giriyorum. Kömürleşmiş kemiklerin üzerinden adımlayarak [target.Custom('GetDragonHerHis')] kayalık bir sütuna dolanmış uyuşuk gövdesine yaklaşıyorum. [target.GetNameNoTooltip] yaklaşımımda kıpırdamıyor; sadece tek bir gözünü aralayıp beni kısaca süzüyor ve [target.Custom('GetDragonHerHis')] uykusuna geri dönüyor. Uyuyor mu? Ne cüret! Ben [ROOT.Char.GetCapitalLocation.GetName]'in bir [ROOT.Char.Custom('WomanManGirlBoy')]'iyim ve reddedilmeyeceğim!\n\nTam boyuma yükselip bu an için ezbere bildiğim Valyria diliyle ejderhaya emir veriyorum: #italic Rȳbās! Dohaerās!#! Yine de [target.GetNameNoTooltip] kıpırdamıyor. Bağırıyorum, haykırıyorum, ayaklarımı yere vuruyorum; ama nafile. Sinirden yakındaki bir kemiği kapıp ejderhaya fırlatıyorum; kemik [target.Custom('GetDragonHerHis')] boynuna çarpıp tık diye ses çıkarıyor.\n\nSonunda [target.GetNameNoTooltip] beni gördü! Yavaşça, kayıtsızca [target.Custom('GetDragonSheHe')] [target.Custom('GetDragonHerHis')] başını bana çeviriyor, yerden kalkmaya bile tenezzül etmeden. Ve sonra alevler geliyor. Onlar gördüğüm son şey oluyor."

 dragon_bond_events.1003.a:0 "Yanıyor, yanıyor! Anne! Baba! #strong_glow;R YANIYOR!#!"

 dragon_bond_events.t:0 "[target.GetNameNoTooltip] ile Bağ Kurmak:"

 dragon_bond_events.2001.t:0 "$dragon_bond_events.t$ Hakkıyla Geçirilen Zaman"

 dragon_bond_events.2001.desc:0 "Eğitim, toplumsallaşma ve yakınlaşma üzerine [target.GetName] ile geçirdiğim haftalar nihayet meyvesini vermeye başladı. [ROOT.Char.GetCapitalLocation.GetName] üzerinde süzülürken ya da [target.Custom('GetDragonHerHis')] ininde dinlenirken, [target.GetNameNoTooltip] ve ben giderek birbirimize daha rahat oluyoruz.\n\nHer geçen gün, sadece bir binici ile binek takımı olmaktan çıkıp güven ve sevgi bağlarıyla bağlanmış gerçek yoldaşlar olmaya yaklaşıyoruz.\n\nBelki hiç kimse bir ejderhanın kalbini gerçekten bilemez ama ben bu ejderhanın ruhunu tanıdığımı hissediyorum."

 dragon_bond_events.2001.a:0 "Birlikte [ROOT.Char.GetFirstNameNicknamed] ile [target.GetName]'in efsanesini yazacağız."

 dragon_bond_events.2002.t:0 "$dragon_bond_events.t$ Karışık Sonuçlar"

 dragon_bond_events.2002.desc:0 "Her geçen gün daha net görüyorum ki [target.GetName] ile yakınlaşma çabalarım işe yaramıyor.\n\nPaylaşılan güvenle göklere yükseldiğimiz her güne karşılık, bir günümüz de zıt yönlere çekişerek geçiyor. Aramızdaki bağlar ne zayıfladı ne de güçlendi; önceki daha mesafeli bağımıza dönmekten başka çarem kalmadığını hissediyorum."

 dragon_bond_events.2002.a:0 "Hayal kırıklığı..."

 dragon_bond_events.3000.t:0 "$dragon_bond_events.t$ Pahalı Et"

 dragon_bond_events.3000.desc:0 "[dragon|El] [target.GetNameNicknamed] değişken bir yaratık. Bazı günler [target.Custom('GetDragonSheHe')] tek isteği [target.Custom('GetDragonHerHis')] kanatlarını açıp [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]'deki ininde şaklabanlık yapmak olurken, ertesi gün ejderhayı [target.Custom('GetDragonHerHis')] uykusundan uyandırmak neredeyse imkânsızlaşıyor.\n\n[target.GetNameNoTooltip]'in damak zevki de aynı derecede değişken; [target.Custom('GetDragonSheHe')] hâlâ hizmetkârlarımın [target.Custom('GetDragonHerHim')]'e taşıdığı bütün kesilmiş av etlerini yiyor ama mutfağa daha lezzetli yemekler ısmarlamayı düşünüyorum. Elbette güzel bir ödül [target.GetNameNoTooltip] ile beni birbirimize yaklaştıracaktır."

 dragon_bond_events.3000.a:0 "[target.GetNameNoTooltip] bir [ROOT.Char.GetTitleAsNameNoTooltip] gibi ziyafet çekecek. Ona közlenmiş koyun eti yedireceğim."

 dragon_bond_events.3000.b:0 "[target.Custom('GetDragonSheHe')|U] seçkin bir damak zevkine sahip. Ona mühürlenmiş domuz eti yedireceğim."

 dragon_bond_events.3000.c:0 "Ejderhalar savaş içindir, ziyafetler için değil. #italic Ödüller#! falan almayacak..."

 dragon_bond_events.3001.t:0 "$dragon_bond_events.t$ Et Kabul Gördü"

 dragon_bond_events.3001.desc:0 "[target.GetCurrentLocation.GetNameNoTooltip] mutfakları [target.GetName] için hazırlanan adak üzerinde gece boyu çalışıyor. Et yumuşak ve sulu; altın rengi tereyağlı derisi, içindeki harcın baskısıyla neredeyse çatlayacak gibi çıtırdıyor. [GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')]'imden birkaçı, et mutfaktan taşınırken ona hasretle bakıyor; ama bu lezzet ancak bir [ROOT.Char.GetTitleAsNameNoTooltip|l]'in — ya da bir [dragon|El]'in hakkı.\n\nArabayı [target.GetNameNoTooltip]'in inine sürüyorum ve seslenmek üzereyken ejderha koşarak geliyor, birkaç adım ötemde durup kayıyor. [target.Custom('GetDragonHerHis')|U] başı benimle araba arasında gidip geliyor; [target.Custom('GetDragonSheHe')] o baştan çıkarıcı ödüle atılacak gibi görünse de kendini tutuyor. [target.GetNameNoTooltip]'in beni böyle dinlemesinden memnun, duymak istediği sözleri söylüyorum: #italic Havor zaldrīzes!#!\n\nSözler dudaklarımdan daha yeni dökülmüştü ki [target.GetNameNoTooltip] ete çullanıyor. Onu aylardır bu kadar mutlu görmemiştim."

 dragon_bond_events.3001.a:0 "Afiyet olsun, ejderham!"

 dragon_bond_events.3002.t:0 "$dragon_bond_events.t$ Pahalı Et Reddedildi"

 dragon_bond_events.3002.desc:0 "Mutfaklar [target.GetName] için hazırlanan adak üzerinde gece boyu çalışıyor. Et yumuşak; altın rengi derisi, bol harcın taşan ağırlığı altında çıtırdıyor. [GetPlayer.Custom('KnightCulturePluralNoTooltipLowercase')]'imden birkaçı, et mutfaktan taşınırken ona hasretle bakıyor; ama bu nadide yiyecek ancak [ROOT.Char.GetTitleAsNameNoTooltip|l]lere ve ejderhalara layık.\n\nArabayı [target.GetNameNoTooltip]'in inine sürüyorum ve [target.Custom('GetDragonHerHim')]'e seslenmek üzereyken, dönen bir pul ve kas kütlesi beni yere deviriyor. [target.GetNameNoTooltip] doymak bilmez bir iştahla ete çullanıyor; [target.Custom('GetDragonHerHis')] güçlü çeneleri, içindeki ziyafete ulaşmak için arabanın kapaklarını kısa sürede işini bitiriyor."

 dragon_bond_events.3002.a:0 "Lanet olsun!"

 dragon_bond_events.3003.t:0 "$dragon_bond_events.t$ Canlı Bir Ödül"

 dragon_bond_events.3003.desc:0 "Bazen bunu unutmak hoş olsa da, en iyi av köpeği kadar itaatkâr olabileceklerine inanmak keyif verse de, [dragons_plural|El] sonuçta yine de yırtıcıdır. [target.GetName]'in esaretinin tekdüzeliği yüzünden giderek daha fazla huzursuzlaştığı ve bunun kırılgan bağımızı zorladığı endişesi büyüyor.\n\nGerçek bir avın sevincine kıyasla zavallı bir ikame olacağına emin olsam da, birkaç domuz ya da koyunu [target.Custom('GetDragonHerHis')] inine salıvermeyi düşünüyorum. [target.GetNameNoTooltip]'i daha şiddetli eğilimlerinden vazgeçirmeye çalışıyordum ama belki canlı bir oyun takdir edilir."

 dragon_bond_events.3003.a:0 "Küçük bir koyun sürüsünü sal."

 dragon_bond_events.3003.b:0 "Bir grup domuzu ine çek."

 dragon_bond_events.3003.c:0 "Öldürme için ileride yeterince zaman olacak. [target.Custom('GetDragonHerHis')] diyetine sadık kal."

 dragon_bond_events.3004.t:0 "$dragon_bond_events.t$ Canlı Ödül Takdir Edildi"

 dragon_bond_events.3004.desc:0 "Av, beklentilerimin ötesine geçti. [target.GetName] avını öldürmekle yetinmek yerine bundan muhteşem bir oyun çıkardı. Hayvanlar [target.Custom('GetDragonHerHim')] için gerçek bir tehdit oluşturmasa da [target.GetNameNoTooltip] sürüyü izlemeye zaman ayırıyor, en zayıf üyeyi seçip [target.Custom('GetDragonHerHis')] çeneleriyle yakalayarak çekiliyor.\n\nBu döngü, [target.GetNameNoTooltip] işini bitirene dek bir saatten fazla sürüyor; o zamana dek yer iç organlarla kaplanıyor ve [target.GetNameNoTooltip]'in kuyruğu zevkle sallanıyor. Heyecan ve kan susuzluğu giderilen [target.GetNameNoTooltip], her zamankinden çok daha fazla yaklaşmama izin veriyor; hatta [target.Custom('GetDragonHerHim')]'e bir kova su getirmeme bile müsaade ediyor ve [target.Custom('GetDragonSheHe')] onu açgözlülükle içiyor."

 dragon_bond_events.3004.a:0 "İkimiz de yüreğimizde yabaniliği taşıyoruz..."

 dragon_bond_events.3005.t:0 "$dragon_bond_events.t$ Fazla Heyecanlandıran Ödül"

 dragon_bond_events.3005.desc:0 "Günün büyük kısmını alsa da, hizmetkârlarımla birlikte hayvanların sonuncusunu da [target.GetNamePossessive] ininin hemen içindeki geçici bir ağıla sokmayı başarıyoruz. Ardından [target.Custom('GetDragonHerHis')] gelişini beklemek için güvenli bir mesafeye yerleşiyorum. [target.Custom('GetDragonSheHe')|U] beni uzun süre bekletmiyor.\n\nKan gölü gibi. Bir an hayvanlar oradaydı; canlı ve sağlıklı. Sonra [target.GetNameNoTooltip] aralarına dalıyor. Sürüyü bölmeye çalışan diğer yırtıcılardan farklı olarak benim [dragon|el]'im katliamdan zevk alıyor; [target.Custom('GetDragonHerHis')] çenelerini iri hayvanlardan birine geçirip [target.Custom('GetDragonHerHis')] pençeleriyle bir başkasını paramparça ediyor.\n\n[target.GetNameNoTooltip] sürünün son üyesinin de içini deşerken ona doğru yürümeye başlıyorum; ama [target.Custom('GetDragonSheHe')] aniden bana dönüp [target.Custom('GetDragonHerHis')] burun delikleri açılıp dişlerini meydan okurcasına gösterince donup kalıyorum. [target.Custom('GetDragonHerHis')] kan susuzluğundan korkarak yavaşça geri çekiliyorum."

 dragon_bond_events.3005.a:0 "Bir ejderha ile avı arasına ancak bir ahmak girer."

 dragon_bond_events.3006.t:0 "$dragon_bond_events.t$ Çiğ Yemleme"

 dragon_bond_events.3006.desc:0 "[dragon|El] [target.GetNameNicknamed] bana karşı anlaşılır biçimde temkinli. [target.Custom('GetDragonSheHe')] [Concept('owned_dragon','no longer truly wild')|E] ve [target.Custom('GetDragonHerHis')] konforunun bir kısmından hoşlansa da bana güvenmiyor ve [target.Custom('GetDragonHerHim')]'e yüz adımdan fazla yaklaşmama bile izin vermiyor. Ama her [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] bilir: insanın kalbine giden yol midesinden geçer. [target.GetNamePossessiveNoTooltip]'inki de çoğundan büyük.\n\n[ROOT.Char.GetCapitalLocation.GetNameNoTooltip] köpek bakıcılarıyla, köpeklerinin sevdiği et ve sakatat üzerine danıştıktan sonra bir araba dolusu taze koyun ve domuz eti ısmarladım. Et henüz tam kesilmedi ama bakıcılar bana ne kadar çiğ olursa o kadar iyi olduğuna dair güvence veriyor. Peki [target.GetNameNoTooltip] hangisini tercih ederdi?"

 dragon_bond_events.3006.a:0 "[target.GetNameNoTooltip] daha keskin tatları sever. Çiğ koyun etini getir."

 dragon_bond_events.3006.b:0 "[target.GetNameNoTooltip] daha tatlı etleri sever. Çiğ domuz etini getir."

 dragon_bond_events.3006.c:0 "Boş ver."

 dragon_bond_events.3007.t:0 "$dragon_bond_events.t$ Çiğ Başarı"

 dragon_bond_events.3007.desc:0 "Et yüklü el arabasını [target.Custom('GetDragonHerHis')] inine sürerken [target.GetNamePossessive] başı ilgiyle yerden kalkıyor. [target.Custom('GetDragonHerHis')] ön ayaklarına yükselen [target.GetNameNoTooltip] yavaşça bana yaklaşıyor; [target.Custom('GetDragonHerHis')] gözleri benimle kanlı hazinelerim arasında gidip geliyor.\n\nKalın parçalardan birini kaldırıp [target.Custom('GetDragonHerHim')]'e fırlatıyorum. Et yere çarpmadan [target.GetNameNoTooltip] ileri atılıp onu [target.Custom('GetDragonHerHis')] çeneleriyle yakalıyor. Sunumdan memnun kalan [target.Custom('GetDragonSheHe')] beklentiyle bana bakıyor. Memnuniyetle karşılık veriyorum. Ona parça üstüne parça atıyorum, her seferinde [target.Custom('GetDragonHerHim')]'e biraz daha yaklaşarak.\n\nŞansımı zorlamayı bilerek son ve en büyük parçayı [target.GetNameNoTooltip]'e atıyorum ve [target.Custom('GetDragonSheHe')] lezzete saldırırken oradan ayrılıyorum. Henüz [target.Custom('GetDragonHerHis')] [GetTrait('dragonrider').GetName(GetNullCharacter)]'i olarak kabul edilmekten uzağım ama bugün gerçek bir ilerleme kaydettik."

 dragon_bond_events.3007.a:0 "Birkaç ay dönümü içinde [target.Custom('GetDragonHerHim')]'i elimden yer hale getireceğim!"

 dragon_bond_events.3008.t:0 "$dragon_bond_events.t$ Çiğ Başarısızlık"

 dragon_bond_events.3008.desc:0 "Keskin kokulu et yüklü el arabasını [target.Custom('GetDragonHerHis')] inine sürerken [target.GetNamePossessive] başı telaşla yerden kalkıyor. [target.Custom('GetDragonHerHis')] ön ayaklarına yükselen [target.GetName] yavaşça bana yaklaşıyor; pis kokulu arabayı ve beni şüpheyle süzüyor.\n\nKalın parçalardan birini kaldırıp [target.Custom('GetDragonHerHim')]'e fırlatıyorum. Et yere ıslak bir şapırtıyla düşüyor; ancak o zaman [target.GetNameNoTooltip] yavaşça onu inceliyor, [target.Custom('GetDragonHerHis')] dili kanlı kütlenin üzerinde gezinerek. Sunumu beğenmediği anlaşılan [target.GetNameNoTooltip] küçümseyici bir homurtu çıkarıp en sevdiği sütunun etrafına kıvrılmaya dönüyor.\n\nBaşka ne yapacağımı bilemeden el arabasını bırakıp [ROOT.Char.Custom('ResidenceBuilding')]'ıma dönüyor ve başarısızlığımı düşünüyorum."

 dragon_bond_events.3008.a:0 "[GetTitleByKey('c_harrenhal').GetNameNoTier] bir günde inşa edilmedi..."

 dragon_bond_events.3009.t:0 "$dragon_bond_events.t$ Ejderha Bilgisine Danışmak"

 dragon_bond_events.3009.desc:0 "[target.GetNamePossessive] eğitimiyle boğuşmaya devam ediyorum ve [dragons_plural|El] hakkındaki bilgimin sınırına ulaştığımdan korkuyorum. Neyse ki, ejderha bilgisinin büyük kısmı Felaket'te kaybedilmiş olsa da, bir kısmı hâlâ Dar Deniz'in iki yakasında varlığını sürdürüyor.\n\nNe var ki bu metinlerin çoğunun gerçekliği ve doğruluğu belirsiz. Sonuçta hayatta kalan ejderha bilgisinin çoğu yalnızca kopyadır ve sahteleri de bol.\n\nAlternatif olarak, küçük halk yüzyıllar boyunca kendi zengin ejderha bilgisini geliştirmiş; kocakarı masalları ve batıl inançlardan oluşan bir koleksiyon. Belki bu halk bilgisi işe yarar?"

 dragon_bond_events.3009.a:0 "En mütevazı masallar bile bir parça gerçek içerir. Halktan insanları getirin."

 dragon_bond_events.3009.b:0 "[GetTitleByKey('b_the_citadel').GetNameNoTier|l]'e ve [GetTitleByKey('c_dragonstone').GetNameNoTier]'e haber sal. Kadim Valyria bilgisini kullanacağım."

 dragon_bond_events.3009.c:0 "Boş ver."

 dragon_bond_events.3010.t:0 "$dragon_bond_events.t$ İşe Yarar Ejderha Bilgisi"

 dragon_bond_events.3010.desc:0 "Yardımcılarım bana, [GetScriptedCharacterByHistoryID('Targaryen_13').GetFirstNameNicknamed]'in, çocukları [GetScriptedCharacterByHistoryID('Targaryen_15').GetFirstNameNicknamed] ve [GetScriptedCharacterByHistoryID('Targaryen_14').GetFirstNameNicknamed]'in ve onların [dragons_plural|El] ile birlikte kadim Valyria'dan kaçışına dair iki anlatı getirdi. Anlatılar farklılık gösterse de en ilgili olanı, Targaryen'lerin [GetTitleByKey('c_dragonstone').GetNameNoTier]'i kolonileştirmesinin ve özellikle adada ejderha yetiştirme çabalarının iddia edilen tasvirleri.\n\nMetinlere göre Aenar ve çocukları, yerleşmelerinden sonraki yıllarda dört ejderhalarını kaybettiler. Ama beşinin en büyüğü olan [GetScriptedCharacterByHistoryID('dragon_balerion').GetName] hayatta kalıp güçlendi; diğer ikisi, [GetScriptedCharacterByHistoryID('dragon_meraxes').GetName] ve [GetScriptedCharacterByHistoryID('dragon_vhagar').GetName] ise daha sonra Ejderha Dağı'nın gölgesinde yumurtadan çıkacaktı. Anlatılar, atalarının diyarının büyülerinden mahrum kalan Targaryen'lerin, yaratığın yumurtalarını kuluçkalamak için kapalı #italic dijemion#! mangalları kullanmak gibi yeni ejderha yetiştirme yöntemleri geliştirmek zorunda kaldıklarını öne sürüyor. Böyle bir bilgi, [target.GetName] ile çabalarımda şüphesiz işe yarayacaktır."

 dragon_bond_events.3010.a:0 "Mükemmel."

 dragon_bond_events.3011.t:0 "$dragon_bond_events.t$ İşe Yaramaz Ejderha Bilgisi"

 dragon_bond_events.3011.desc:0 "[GetScriptedCharacterByHistoryID('Targaryen_27').GetFirstNameNicknamed], [GetScriptedCharacterByHistoryID('Targaryen_28').GetFirstNameNicknamed] ve [GetScriptedCharacterByHistoryID('Targaryen_29').GetFirstNameNicknamed] tarafından büyük [dragons_plural|El]'in yetiştirilmesini anlatan bir elyazmasının kopyasını inceledim. [GetTitleByKey('c_dragonstone').GetNameNoTier] kahyasının birinci elden anlatısı olduğu iddia edilen kitap, kardeşlerin — özellikle Aegon ve Rhaenys'in — ejderhalarıyla birlikte Dragonstone'un volkanik kaplıcalarında yıkandıklarını öne sürüyor.\n\nBu ilhamla, [target.GetNamePossessive] inine varillerle su ve arabalarla çıra getirttim. En merkezdeki odalardan birinde derme çatma bir sauna kurdum ve bir zamanlar [GetPlayer.Custom('RegionalAlcoholicDrink')] fermente etmek için kullanılan düzinelerce tanktan şimdiden sıcak buhar yükseliyor.\n\nNe yazık ki, sauna benim için ne kadar keyifli olsa da [target.GetNameNoTooltip] ne bana ne de [target.Custom('GetDragonHerHim')] için hazırladığım buhar banyosuna ilgi gösteriyor. Hatta [target.GetNameNoTooltip] inini yeniden düzenlememden rahatsız olmuş görünüyor. Belki kuru sıcaklığı tercih ediyor?"

 dragon_bond_events.3011.a:0 "Lanet olsun!"

 dragon_bond_events.3012.t:0 "$dragon_bond_events.t$ Ejderha Bakıcılarına Danışmak"

 dragon_bond_events.3012.desc:0 "[head_dragonkeeper.GetNameNicknamed], Baş Ejderha Bakıcım ve [target.GetNamePossessive] başlıca bakıcısı, [target.GetNameNoTooltip] ile bağ kurma çabalarımın inişli çıkışlı seyrini aylardır yargılamadan izliyor, hep benim inisiyatifime saygı gösteriyor.\n\n[target.GetNameNoTooltip] ile bağ kurma sorumluluğu yalnızca bana ait olsa da, bu [head_dragonkeeper.GetWomanMan] ejderhanın huylarını ve gelgitlerini çok iyi biliyor ve herkesin tabiriyle görünüşünün ima ettiğinden daha bilge bir [head_dragonkeeper.GetWomanMan].\n\n[head_dragonkeeper.GetNamePossessiveNoTooltip] bilgeliği ve tecrübesi [target.GetNameNoTooltip] ile çabalarıma yardımcı olabilir ama risk var. [head_dragonkeeper.GetNamePossessiveNoTooltip] görevi her zaman [target.GetNamePossessiveNoTooltip] fiziksel ihtiyaçlarını — [target.Custom('GetDragonHerHis')] beslenmesini, sulanmasını, temizliğini ve eğlencesini — karşılamak oldu. Ama bu [head_dragonkeeper.GetWomanMan], ejderhamla o daha derin, daha manevi düzeyde hiç iletişim kurmadı."

 dragon_bond_events.3012.a:0 "Bilgelik üzerinde tekelim yok. [head_dragonkeeper.GetFirstNameNoTooltip]'ten yardım iste."

 dragon_bond_events.3012.b:0 "[head_dragonkeeper.GetFirstNameNoTooltip] sadece egzotik bir hizmetkâr. [head_dragonkeeper.GetSheHe] bir ejderhanın kalbinden ne anlar?"

 dragon_bond_events.3013.t:0 "$dragon_bond_events.t$ Bilgece Öğüt"

 dragon_bond_events.3013.desc:0 "Kaderimi Ejderha Bakıcısı'nın nasırlı ellerine bırakarak bugün [head_dragonkeeper.GetNameNicknamed]'e, [target.GetName] ile olan çalışmaları sırasında eşlik etmeye karar verdim. [head_dragonkeeper.GetHerHis] çırakları gibi kaba kumaştan bir tunik giyip elimi basit bir tahta değnekle silahlandırıyorum.\n\nGünü, [target.GetNamePossessiveNoTooltip] ininin orta odasını temizleyerek, [target.Custom('GetDragonHerHis')] su yalaklarını doldurarak ve ejderhamı içeride, istenmeyen ziyaretçileri dışarıda tutan sayısız kapı ve kilidi yeniden kontrol ederek geçiriyoruz. Tüm bunları ve daha fazlasını, günün işlerini bitirirken arkamdan ağır adımlarla yürüyen [target.GetNamePossessiveNoTooltip] gözetleyen bakışları altında yapıyoruz.\n\nGünün sonunda terden sırılsıklam ve ejderha pisliğine bulanmış bir haldeyim. Yine de ayrılmak üzereyken [target.GetNameNoTooltip] boynunu davetkâr bir biçimde bana doğru eğiyor. Önce çekinerek, sonra artan bir hevesle [target.Custom('GetDragonHerHis')] pullu boynunun kenarını güzelce kaşıyorum. Emeklerimin takdir edildiği anlaşılıyor."

 dragon_bond_events.3013.a:0 "[head_dragonkeeper.GetNameNoTooltip] haklıydı. Temiz eller hiçbir şey başaramaz."

 dragon_bond_events.3014.t:0 "$dragon_bond_events.t$ Kötü Öğüt"

 dragon_bond_events.3014.desc:0 "Daha iyi yargıma rağmen, bugün [head_dragonkeeper.GetNameNicknamed]'e, [target.GetName] ile olan çalışmaları sırasında eşlik etmeye karar verdim. [head_dragonkeeper.GetHerHis] çırakları gibi kaba kumaştan bir tunik giyiyorum. Giysi pis koksa da Ejderha Bakıcısı, [target.GetNameNoTooltip]'in tutarlı bir koku tercih ettiğinde ısrar ediyor.\n\n[head_dragonkeeper.GetNameNoTooltip] işe ejderhanın ininin orta odasını temizleyerek başlamamı söylüyor ve [target.GetNameNoTooltip]'in, [ROOT.Char.GetHerHis] ellerini kirletmeye razı olmayan bir [GetTrait('dragonrider').GetName(GetNullCharacter)]'e saygı duymayacağını iddia ediyor. Ben de razıyım. Öğlene dek tere batıp dizlerime kadar pis saman yatağın içindeyim. İşte o sırada ejderham bizi ziyarete tenezzül ediyor.\n\n[target.GetNamePossessiveNoTooltip] iri yılan gibi gözleri perişan halimi görünce şaşkınlıkla büyüyor; sonra [target.Custom('GetDragonHerHis')] ağzı tiksinerek kıvrılıyor. Benimle göz temasını bozmadan [target.Custom('GetDragonSheHe')] [target.Custom('GetDragonHerHis')] kuyruğunu kaldırıyor ve yüküme bir yüz kürek daha kokuşmuş pislik ekliyor. Ejderha küçümseyici bir homurtu çıkarıp gidiyor."

 dragon_bond_events.3014.a:0 "Ben senin binicin olacağım, oda hizmetçin değil!"

 dragon_bond_events.3015.t:0 "$dragon_bond_events.t$ Valyria Şarkısı"

 dragon_bond_events.3015.desc:0 "Korkarım [target.GetName], bağ kurma çabalarıma [target.Custom('GetDragonSheHe')] gerektiği kadar iyi karşılık vermiyor. [dragon|el] artık varlığıma diken üstünde yaklaşmasa da [target.Custom('GetDragonSheHe')] kolayca dikkati dağılıyor ve emirlerimi dinlemeye, hele itaat etmeye pek istekli değil.\n\nAma sonra dadımın bana bir zamanlar söylediği bir şeyi hatırlıyorum. Bebek bir [ROOT.Char.Custom('GirlBoy')] iken yarasa saatinden bülbül saatine kadar ağladığımı ve beni bu nöbetlerden kurtaran tek şeyin onun tatlı şarkıları olduğunu söylemişti.\n\nBu ilhamla, [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]'ten, [GetScriptedCharacterByHistoryID('Targaryen_13').GetNamePossessive] mahkûm kıtadan kaçışına tarihlenen, kopya edilmiş eski Valyria ilahileri elyazması istedim. İlahi kitabının gerçek kökenini bilmek imkânsız olsa da sözler Valyria dilinde ve beste, [ROOT.Char.GetCulture.GetNameNoTooltip]'in bazı eski şarkılarından pek de farklı değil."

 dragon_bond_events.3015.a:0 "Eski şarkıları söyleyeceğim..."

 dragon_bond_events.3015.b:0 "Boş ver."

 dragon_bond_events.3016.t:0 "$dragon_bond_events.t$ Güzel Bir Valyria Şarkısı"

 dragon_bond_events.3016.desc:0 "#italic Isse se prūmia hen wild, skoriot se tegon sīmonagon,#!\nYabanın kalbinde, dağların yükseldiği yerde,\n\n#italic Kesīr's nykeā zaldrīzes nēdenka, rūsīr perzys laesi,#!\nAteşli gözleriyle korkusuz bir [dragon|El] var,\n\n#italic Ñelly hen āeksion, tīkuni bona span se jēdar,#!\nAltın pullar, gökyüzünü kaplayan kanatlar,\n\n#italic Yn konīr's iā vāedar bona mazverdagon ziry limagon.#!\nAma onu ağlatan bir ezgi var.\n\nSesim [target.GetNamePossessive] ininin her yanında yankılanıyor. Beni alkış karşılamıyor; ama üçüncü kıtaya başladığımda ejderhanın odaya girdiğini görüyorum ve [target.Custom('GetDragonSheHe')] yavaşça yere çöküyor. Şarkının sonunda [target.Custom('GetDragonSheHe')] derin bir uykuya dalmış, huzurla horluyor."

 dragon_bond_events.3016.a:0 "İyi uykular, ejderham."

 dragon_bond_events.3017.t:0 "$dragon_bond_events.t$ Düz Bir Valyria Şarkısı"

 dragon_bond_events.3017.desc:0 "[target.GetNamePossessive] inine giriyorum ve [dragon|El]'i odalardan birinde uyurken buluyorum. Gerginim; hem [target.Custom('GetDragonHerHis')] varlığından hem de kadim şarkılar söyleme konusunda usta bir ozan olmadığımdan. Ama soytarıların hatırlattığı gibi, gösteri devam etmeli. Boğazımı temizleyip ilk kıtalara başlıyorum:\n\n#italic Kesīr's nykeā zaldrīzes nēdenka, rūsīr perz—#!\n\nDaha ikinci kıtaya geçemeden [target.GetNameNoTooltip] uyanıyor, kalkıyor ve odadan çıkıyor. Şaşkınlıkla peşinden gidiyorum; sadece [target.Custom('GetDragonHerHim')]'in yere yeniden uzanıp [target.Custom('GetDragonHerHis')] gözlerini kapattığını görüyorum. Başka ne yapacağımı bilemeden şarkıma yeniden başlıyorum ve [target.Custom('GetDragonSheHe')] yine çıkıp gidiyor, bu kez kuyruğunu rahatsızca sallayarak.\n\nKolay yılmayarak şarkı söylemeyi sürdürürken [target.GetNameNoTooltip]'in peşinden gidiyorum. İşte o zaman [target.Custom('GetDragonHerHis')] sabrı taşıyor. Ejderha bana dönüp öyle öfkeli bir kükreme salıyor ki sesimi kesiyor ve beni [ROOT.Char.Custom('ResidenceBuilding')]'ıma koşturuyor."

 dragon_bond_events.3017.a:0 "Lanet olası ejderha!"

 dragon_bond_events.3018.t:0 "$dragon_bond_events.t$ Valyria Okuması"

 dragon_bond_events.3018.desc:0 "[dragons_plural|E], Hanedanı [GetScriptedCharacterByHistoryID('Targaryen_27').GetHouse.GetName] olan evin çocukları kadar kadim Valyria'nın torunlarıdır ve o mahkûm diyarın kanı hâlâ [target.GetNamePossessive] damarlarında akıyor. Yüzyıllardır, belki bin yıllardır ejderhaların yalnızca tek bir dildeki emirlere uyması bir tesadüf değil: Yüksek Valyria dili.\n\n[target.GetNameNoTooltip] ile temel Valyria sözlerini çalıştım — #italic sōvēs#! uçmak, #italic rȳbās#! dinlemek, #italic māzīs#! yanına gelmek — ama [target.Custom('GetDragonSheHe')]'nin benden yalnızca emirler değil, daha fazla Valyria dili duymaktan hoşlanıp hoşlanmayacağını merak ediyorum.\n\nBirçok [ROOT.Char.GetCulture.GetNameNoTooltip] çocuğuna bebekliklerinde dikkatlerini dağıtmak ve eğitmek için masallar okunduğu gibi, belki [target.GetNameNoTooltip] de kendisine bir şeyler okunmasından keyif alır?"

 dragon_bond_events.3018.a:0 "Ejderhaya okuyacak bir şey bulacağım."

 dragon_bond_events.3018.b:0 "Boş ver."

 dragon_bond_events.3019.t:0 "$dragon_bond_events.t$ İyi Bir Okuma"

 dragon_bond_events.3019.desc:0 "[target.GetName]'e, geçen günün büyük kısmını özenle Valyria diline çevirmekle geçirdiğim eski bir masal kitabından okumaya başlıyorum. [target.Custom('GetDragonHerHim')]'e, savaşçı kraliçe [GetScriptedCharacterByHistoryID('Nymeros_1').GetFirstNamePossessive] Rhoyne'dan Dorne'a kader yolculuğunu anlatıyorum. [target.Custom('GetDragonHerHim')]'i [GetScriptedCharacterByHistoryID('Arryn_15').GetFirstNameNicknamed]'in kahramanlıkları ve [GetScriptedCharacterByHistoryID('Stark_12').GetFirstNameNicknamed]'in sayısız çabasıyla eğlendiriyorum.\n\nMasalları anlatmakta kendimi kaybediyorum; sözlerim, akıcı bir Yüksek Valyria dilinin şiirsel, akışkan güzelliğiyle damlıyor. Kitabın sonuna ulaştığımda güneş [target.GetCurrentLocation.GetNameNoTooltip] üzerinde batmış. [target.GetNameNoTooltip] yalnızca bir ejderha olsa ve [target.Custom('GetDragonSheHe')] sözlerimin çok azını hatta hiçbirini anlamadığını bilsem de, [target.Custom('GetDragonSheHe')] gösterilen ilgiyi takdir etmiş görünüyor ve şimdi bir kol boyu mesafede huzurla horluyor."

 dragon_bond_events.3019.a:0 "Bir gün bizim hakkımızda da hikâyeler yazılacak..."

 dragon_bond_events.3020.t:0 "$dragon_bond_events.t$ Kötü Bir Okuma"

 dragon_bond_events.3020.desc:0 "Sıradaki [target.Custom('GetDragonHerHis')] beslenmesinde, [target.GetName]'e, sabahın büyük kısmını aceleyle Valyria diline çevirmekle geçirdiğim eski bir Dorne masalları kitabından okumaya başlıyorum. Sözcüklerin çoğuna takılıyorum; beceriksizce çevrilmiş söz dizimine ve dolambaçlı tümcelere tökezleyerek. Okumanın sonunda [target.GetNameNoTooltip]'in kafa karışıklığının benimkine denk olduğunu görüyorum ve [dragon|el], bir delinin [ROOT.Char.Custom('WomanManGirlBoy')] saçmalıkları gibi görünen şey için çağrıldığına hafifçe sinirlenip benden uzaklaşıyor.\n\n[target.GetNameNoTooltip] zaten Yüksek Valyria emirlerimin bazılarını ya görmezden geliyor ya da anlamıyor; korkarım bu, zaten sınırlı olan uyumumuzu daha da karıştıracak."

 dragon_bond_events.3020.a:0 "Lanet olsun!"

 dragon_bond_events.3021.t:0 "$dragon_bond_events.t$ Göklere Bakış"

 dragon_bond_events.3021.desc:0 "Sabah yulaf lapamı balkonumda yerken, tek bir bulutun bile olmadığı parlak mavi bir gökyüzü görüyorum. İçimdeki bir şey, bugünün [ROOT.Char.Custom('ResidenceBuilding')]'ımın içinde ya da [ROOT.Char.GetCapitalLocation.GetName] sokaklarında boş geçirilecek bir gün olmadığını söylüyor. Sanki [ROOT.Char.GetFaith.FateGodName] [ROOT.Char.GetFaith.FateGodHerHim] bugünü tek bir amaç için yaratmış: uçuş.\n\nYine de temkinliyim. [target.GetNamePossessive] son birkaç uçuşu iyi geçmedi — geçtiğimiz ay dönümlerinde [target.Custom('GetDragonSheHe')] zaman zaman, genellikle ölüme düşmekten kaçınmamla ilgili olan ve işine gelmeyen emirleri seçerek görmezden geldi.\n\nYine de daha fazla uçuş zamanı hem aramızdaki uyumu hem de [target.GetNamePossessiveNoTooltip] emirlerime kulak verme isteğini artırabilir. Ve böyle muhteşem bir gün..."

 dragon_bond_events.3021.a:0 "Günü içeride boşa harcamak ikimizin de işine yaramaz. Göklere!"

 dragon_bond_events.3021.b:0 "Bir [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] görevi [ROOT.Char.GetHerHis] diyarınadır, [ROOT.Char.GetHerHis] heveslerine değil. Bugün uçmayacağız."

 dragon_bond_events.3021.custom_tt:0 "Bağın Artmıyor"

 dragon_bond_events.3022.t:0 "$dragon_bond_events.t$ Yeni Zirvelere Ulaşmak"

 dragon_bond_events.3022.desc:0 "[target.GetName], elinde bir eyerle [target.Custom('GetDragonHerHis')] inine girerken beni neredeyse hevesle karşılıyor — göklere hasret olan tek kişi ben değilim besbelli. Sıra dışı bir uysallıkla [target.Custom('GetDragonSheHe')] eyeri takmama ve sırtına binmeme izin veriyor; yardımcılarıma bir baş selamı verince açık havaya çıkıyoruz. Son kapıları da geçer geçmez [target.GetNameNoTooltip] özgürlüğün tadını çıkararak havaya sıçrıyor.\n\n[target.Custom('GetDragonHerHis')] kanatlarının her çırpışında daha da yükseliyoruz; ta ki [ROOT.Char.Custom('ResidenceBuilding')]'ım aşağıda uzak bir renk lekesine dönene dek. [target.Custom('GetDragonSheHe')|U] bugün nadir görülen bir formda ve dizginlerim altında [target.GetNameNoTooltip], efsanevi [GetScriptedCharacterByHistoryID('dragon_nessarion').GetName] kadar çevik, meşhur [GetScriptedCharacterByHistoryID('dragon_terrax').GetName] kadar güçlü hissettiriyor.\n\nGökyüzünün ortasında süzülürken rüzgâr arkamızdan esiyor; saçları ve ruhları yükseltirken dünya altımızda açılıyor. Bulutsuz gökyüzünün fonunda bağımız daha da güçleniyor."

 dragon_bond_events.3022.a:0 "Beni daha da yükseğe çıkarabilir misin?"

 dragon_bond_events.3023.t:0 "$dragon_bond_events.t$ Kalkış Başarısızlığı"

 dragon_bond_events.3023.desc:0 "[target.GetName]'e temkinle yaklaşıyorum; [target.Custom('GetDragonHerHis')] gözlerinde oyuncu bir parıltıyla karşılanıyorum. Önceki provalarımıza rağmen [target.GetNameNoTooltip], [target.Custom('GetDragonHerHis')] eyerini takma çabalarıma direniyor; görünüşe göre [target.Custom('GetDragonHerHis')] birçok modundan birine kapılmış. Yaramaz bir homurtuyla [target.Custom('GetDragonSheHe')], tam elimi uzatırken kaçıyor; [target.Custom('GetDragonHerHis')] kanatları zarif bir meydan okuyuşla açılıyor.\n\nEyerin kayışını ya da dizginleri bağlamaya yönelik her girişim, [target.Custom('GetDragonHerHis')] kuyruğunun meydan okuyan bir darbesi ya da ani bir alev püskürtmesiyle karşılanıyor; bir [dragon|El] [Concept('tamed_dragon','tamed')|E] olsa bile gerçekten kırılamayacağının bir hatırlatıcısı. Hayal kırıklığım artarken, zamanımı belki de ejderhamı yapmak istemediği bir şeye zorlamaktan başka türlü geçirmenin daha iyi olacağını anlıyorum."

 dragon_bond_events.3023.a:0 "Ne talihsizlik..."

 dragon_bond_events.3024.t:0 "$dragon_bond_events.t$ Ziyaret Saatleri"

 dragon_bond_events.3024.desc:0 "Son [target.GetName] ziyaretimden sonra, [target.Custom('GetDragonHerHis')] yiyeceğini getiren görevlilerle benim aramı ayırt edememesi beni hayrete düşürdü ve üzdü. Sanki ben, [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]'in bir [ROOT.Char.GetTitleAsNameNoTooltip]'i, sıradan bir hizmetkârdan farksızmışım gibi! [ROOT.Char.GetTitleAsNameNoTooltip] olarak görevlerim günlerimin çoğunu alsa da, [target.GetNameNoTooltip]'i ziyarete daha fazla zaman ayırmak buna değebilir.\n\nAncak böyle bir yaklaşımda risk var. Böyle kıyıcı bir yırtıcıyla daha fazla zaman geçirmenin bariz tehlikesinin yanı sıra, [target.GetNameNoTooltip]'in ilişkimizin bu hassas evresinde aşırı hevesli, ağır bir varlığımdan rahatsız olması da olası.\n\n"

 dragon_bond_events.3024.a:0 "Hakkıyla geçirilen zamanın yerini hiçbir şey tutamaz. Ejderhayı ziyaret edeceğim."

 dragon_bond_events.3024.b:0 "Boş ver."

 dragon_bond_events.3024.custom_tt:0 "[target.GetNamePossessiveNoTooltip] sana karşı tutumu kayıtsız kalacak"

 dragon_bond_events.3025.t:0 "$dragon_bond_events.t$ Ejderha Ziyareti Başarılı"

 dragon_bond_events.3025.desc:0 "Tıpkı [ROOT.Char.Custom('GirlBoy')]luğumdaki öğretmenlerimin beni bugünkü [ROOT.Char.Custom('WomanManGirlBoy')] haline getirip minnettarlığımı kazanması gibi, [target.GetNamePossessive] bakımının daha düzenli bir parçası olma çabalarım da ejderhanın bir nebze saygısını kazandı. Bir ay önce bile [target.Custom('GetDragonSheHe')] bana, [target.Custom('GetDragonHerHis')] etini içeri, kirli samanını dışarı taşıyan hamalların herhangi birinden farksız davranırdı; ama sanırım [target.Custom('GetDragonSheHe')] artık beni daha iyi bir gözle görüyor.\n\nSevgi dolu olmaktan hâlâ çok uzak olsa da, [target.GetNameNoTooltip] beni daha yakından izliyor, sesimi yoldaşlarımın seslerinden ayırt edebiliyor ve hatta beslenmeler sırasında [target.Custom('GetDragonHerHis')] boynuna dokunmama bile izin veriyor."

 dragon_bond_events.3025.a:0 "Gün be gün [target.Custom('GetDragonHerHis')] itaatini kazanacağım."

 dragon_bond_events.3026.t:0 "$dragon_bond_events.t$ Ejderha Ziyareti Başarısız"

 dragon_bond_events.3026.desc:0 "Ziyaretlerim ters tepki yarattı. [target.GetName]'in varlığımı, [target.Custom('GetDragonSheHe')] bu kadar açıkça keyif aldığı beslenmelerle ilişkilendireceğini ummuştum; bunun yerine korkarım [target.Custom('GetDragonSheHe')] beni daha çok nefret ettiği esaretle ilişkilendirdi.\n\nBir ay önce bile [target.GetNameNoTooltip] beslenmeleri sırasında varlığıma çoğunlukla kayıtsız kalırken, şimdi beni fark ettiğinde [target.Custom('GetDragonHerHis')] burun delikleri öfkeyle açılıyor ve [target.Custom('GetDragonSheHe')] fırsat buldukça bana sırtını dönmeye özen gösteriyor; reddedişin talihsiz bir işareti."

 dragon_bond_events.3026.a:0 "Ne talihsizlik..."

 dragon_bond_events.3027.t:0 "[target.GetNameNoTooltip] ile Bağ Kurmak: Valar Ēdrussis" # reused for whole event chain

 dragon_bond_events.3027.desc:0 "Tek başıma yürürken yakınlarda hafif bir horlama sesi duyuyorum.\n\nDurup dikkatle dinlediğimde, bu vahşi doğanın geri kalanının ürkütücü biçimde sessiz olduğunu fark ediyorum. Sanki tüm manzara gün ortasında uyukluyor ve böyle bir günde bu, günlük saray hayatının koşuşturmacasından hoş bir mola."

 dragon_bond_events.3027.a:0 "Horlamanın kaynağını araştırmalıyım."

 dragon_bond_events.3027.custom_tt.a:0 "@warning_icon! Bu, tehlikeli sonuçlara yol açabilir!"

 dragon_bond_events.3027.b:0 "Sonunda huzur."

 dragon_bond_events.3028.desc:0 "Horlamanın geldiği yöne doğru yürümeye başlıyorum. Bir süredir tek bir canlı görmediğimi, en küçük ağaç sakinlerinin bile cıvıltısını ya da çıtırtısını duyamadığımı fark edince garip bir huzursuzluk sarıyor beni.\n\nBüyük bir ağacın etrafını dönerken bu sessizliğin ve horlamanın sebebini seçiyorum: [target.GetNameNoTooltip], önümde birkaç adım ötedeki açıklıkta derin bir uykuda! [target.Custom('GetDragonSheHe')|U] böyle rahatça kıvrılmışken şaşırtıcı derecede huzurlu görünüyor."

 dragon_bond_events.3028.a:0 "Bir kestirme iyi olur gibi..."

 dragon_bond_events.3028.custom_tt.a:0 "Güzel, rahat bir yaprak yığını bul ve hak edilmiş bir kestirme yap"

 dragon_bond_events.3028.custom_tt.react:0 "[target.GetNameNoTooltip] tepki verecek..."

 dragon_bond_events.3028.b:0 "Geri çekil, yavaşça ve sessizce."

 dragon_bond_events.3028.custom_tt.b:0 "Ormana geri çekilmeye başla"

 dragon_bond_events.3028.custom_tt.b.a:0 "Kaçıp kurtuluyorsun"

 dragon_bond_events.3028.custom_tt.b.b:0 "[target.GetNameNoTooltip] uyanıyor"

 dragon_bond_events.3028.b.success.t:0 "Kaçıp Gitmek"

 dragon_bond_events.3028.b.success.custom_tt:0 "Alnından terler damlarken neredeyse yığılıyorsun; geriye bakıp [target.GetNameNoTooltip]'in hâlâ huzurla uyuduğunu fark ediyorsun."

 dragon_bond_events.3028.c:0 "OLMAZ!"

 dragon_bond_events.3028.custom_tt.c:0 "Ters yöne koş"

 dragon_bond_events.3028.c.success.t:0 "Çılgın Bir Kaçış"

 dragon_bond_events.3028.c.success.custom_tt:0 "Eve güvenle varana dek tüm hızınla koşuyor, ejderhanın hiçbir şey fark etmediğine dua ediyorsun."

 dragon_bond_events.3029.desc:0 "Bir süre geçiyor ve irkilerek uyanıyorum; sıcak bir nefes artık yüzüme vuruyor. Dehşet içinde kıpırdamadan duruyorum ve [target.GetNameNoTooltip]'in [target.Custom('GetDragonHerHis')] boynunu uzatıp yüzüme baktığını görüyorum!\n\nOmurgamdan bir ürperti iniyor... Belki de bu en akıllıca kararım değildi.\n\nŞaşırtıcı biçimde [target.GetNameNoTooltip] sadece uykuya geri dönüyor gibi görünüyor? Belki de [target.Custom('GetDragonSheHe')] şirketime biraz daha alışıyordur!"

 dragon_bond_events.3029.a:0 "Bu, yatağımdan daha sıcak!"

 dragon_bond_events.3030.desc:0 "[target.GetNameNoTooltip] [target.Custom('GetDragonHerHis')] uykusundan uyanırken neredeyse hissedebiliyorum; sonra [target.Custom('GetDragonSheHe')] aniden doğruluyor; [target.Custom('GetDragonHerHis')] alanına bu kadar yaklaşmam onu açıkça şaşırtmış.\n\nİçimdeki bir parça anında alevlerin içinde kalacağımı ya da bir pençe darbesi yiyeceğimi bekliyor; ama ejderha yalnızca ayakta duruyor, [target.Custom('GetDragonHerHis')] pulları öğle güneşinde hafifçe parlıyor, [target.Custom('GetDragonHerHis')] gözleri dikkatle bana kilitlenmiş."

 dragon_bond_events.3030.a:0 "Şşşt, uslu ejderha..."

 dragon_bond_events.3030.custom_tt.a:0 "Bir ninni hatırla ve ejderhaya söyle"

 dragon_bond_events.3030.c.success.t:0 "Ōtor Saymak"

 dragon_bond_events.3030.c.success.custom_tt:0 "[target.GetNameNoTooltip] ninnine karşılık veriyor gibi; en sonunda yeniden uykuya dalıp sinsi sinsi kaçmana izin veriyor"

 dragon_bond_events.3031.desc:0 "[target.GetNameNoTooltip] geri çekiliyor; [target.Custom('GetDragonHerHis')] uyku yerine tecavüz etmeme açıkça öfkelenmiş! Şimdi yapabileceğim tek şey sindiğim yerde başımı örtmek ve [ROOT.Char.GetFaith.FateGodName] [ROOT.Char.GetFaith.FateGodHerHim]'e, canavarın bana merhamet etmesi için dua etmek..."

 dragon_bond_events.3031.custom_tt.a:0 "[target.GetNameNoTooltip] öfkeleniyor ve saldırıyor!"

 dragon_bond_events.3031.custom_tt.b:0 "[target.GetNameNoTooltip] gidiyor ve geri dönmüyor"

 dragon_bond_events.3031.attack.t:0 "İçler acısı bir durum..."

 dragon_bond_events.3031.attack.custom_tt:0 "[target.GetNameNoTooltip] uçup gitmeden önce sana alevlerle saldırıyor ve geri dönmeye hevesli görünmüyor..."

 dragon_bond_events.3031.flee.t:0 "Talihli Bir Gelişme mi?"

 dragon_bond_events.3031.flee.custom_tt:0 "Gözlerini açtığında [target.GetNameNoTooltip]'in uçup gitmekte olduğunu görüyorsun. Talihli bir gelişme; ancak geri dönmeye hevesli görünmüyor..."

