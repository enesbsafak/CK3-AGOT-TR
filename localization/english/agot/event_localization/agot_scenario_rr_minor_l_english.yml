 agot_events_rr_minor.0124.t:0 "Aslan ve Ejderha"

 agot_events_rr_minor.0124.desc:0 "Odamda, haritalar ve mektuplarla çevrili halde, Yedi Krallık'ı saran kaosu düşünüyorum. Deli Kral [GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName]'e karşı isyan güçleniyor ve yakında karar vermeliyim. \n\nAerys ile bir zamanlar arkadaştık, ama ilişkimiz yıllar içinde çeşitli sebeplerle bozuldu; sonuncusu, oğlum ve varisim [GetScriptedCharacterByHistoryID('Lannister_7').GetFirstName]'i [GetTitleByKey('d_kingsguard').GetNameNoTier]'e ataması oldu. Aerys'in deliliği daha da kötüleşti ve hükümdarlığı gün geçtikçe daha tiranlaştı;\n\nBuna karşılık [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName], isyancıların lideri olarak yetenekli bir savaşçı olduğunu kanıtladı; hükmetme yeteneği büyük bir soru işareti olsa da. \n\nAerys'e ihanet fikri riskli ama cezbedici; yine de beklemek, en azından şimdilik, en iyi seçenek olabilir; zira taraflar bir yöne ya da diğerine dönebilir."

 agot_events_rr_minor.0124.a:0 "Yedi Krallık'ın kaderi terazide asılı."

 agot_events_rr_minor.0124.a.tt:0 "Bir oyuncu olarak, Demir Taht'ın [war_score|E]'i 50'nin altına düştüğünde Demir Taht'ın yanında ya da doğrudan isyancıların yanında yer almayı seçebilirsin"

 MarchOnKingsLanding:0 "Planına devam etmek için ordunu şahsen Kralın Şehri'ne götürüp komuta etmelisin; şehri bizzat "savunmak" için orada olmazsan Aerys şüphelenir!\n"

 agot_events_rr_minor.0103.tta:0 "[jaime_scope.GetFirstName], [defending_kingsguard.GetName]'i savuşturup [pyromancer_plotter.GetFirstName]'i öldürüyor."

 agot_events_rr_minor.0103.ttb:0 "[jaime_scope.GetFirstName], [defending_kingsguard.GetName] tarafından yere fırlatılıyor ve [pyromancer_plotter.GetFirstName]'i öldüremiyor."

 agot_events_rr_minor.0103.ttc:0 "Kendisine engel olacak Kral Muhafızı yoldaşları olmadan [jaime_scope.GetFirstName], [aerys_scope.GetFirstName] ve [pyromancer_plotter.GetFirstName]'i öldürüp komploya son veriyor."

 agot_events_rr_minor.0103.ttd:0 "[jaime_scope.GetFirstName], [aerys_scope.GetFirstName] ve [pyromancer_plotter.GetFirstName]'i öldürüp komploya son veriyor."

 agot_events_rr_minor.0126.t:0 "Demir Taht'ın Sonu"

 agot_events_rr_minor.0126.desc:0 "Taç Toprakları'ndan bir kuzgun, eski Valyria zamanından beri akla gelmeyecek bir haber getiriyor: Demir Taht, Kızıl Kale, [GetTitleByKey('c_kings_landing').GetNameNoTier] ve yüz binlerce sakini bir anda yok oldu. Zümrüt kadar yeşil bir ateş topu şehri bütünüyle yutuverdi; patlamanın gümbürtüsü [GetTitleByKey('c_the_eyrie').GetNameNoTier]'den [GetTitleByKey('c_highgarden').GetNameNoTier]'e kadar yankılandı. Söylentiler ortalıkta: Deli Kral [GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName] komployu kendisi düzenledi; tacı reddedenler savaşı kazanmak için umutsuz bir çabayla şehri yok etti; bazıları enkazda bir ejderha görüldüğünü bile iddia ediyor. Söylentiler bir kenara, tek bir gerçek var: Kralın Şehri kül ve molozdan başka bir şey değil."

 agot_events_rr_minor.0126.a:0 "Bu ürkütücü yeni dünyada yeni bir rota çizmeliyiz."

 agot_events_rr_minor.0126.b:0 "Deli Kral ölüyken bu savaş sona erebilir."

 agot_events_rr_minor.0128.t:0 "Fırtına Toprakları'nın Savunmasına"

 agot_events_rr_minor.0128.desc:0 "[GetScriptedCharacterByHistoryID('Arryn_3').GetFirstName] [GetScriptedCharacterByHistoryID('Arryn_3').GetHouse.GetName] ile birlikte önemli bir zafer kazandık, bu isyanın ilk zaferi. Başarılı kuşatmanın ardından, Fırtına Toprakları'na yelken açmamın yolunu tıkayan stratejik şehir [GetTitleByKey('c_gulltown').GetNameNoTier]'i ele geçirmeyi başardık.\n\nGulltown artık kontrolümüz altındayken, yelken açıp Fırtına Toprakları ordularını davam için toplama zamanı. Rüzgârlar elverişli ve gemiler yelken açmaya hazır."

 agot_events_rr_minor.0128.a:0 "[GetTitleByKey('c_storms_end').GetNameNoTier]'e!"

 agot_events_rr_minor.0131.t:0 "Vadi'den Winterfell'e"

 agot_events_rr_minor.0131.desc:0 "[GetScriptedCharacterByHistoryID('Arryn_3').GetFirstName] [GetScriptedCharacterByHistoryID('Arryn_3').GetHouse.GetName] ve [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetTitleByKey('c_gulltown').GetNameNoTier]'in sonrasıyla ilgilenirken, ben çantalarımı ve atımı hazırlayıp Vadi'den ayrılıp Parmaklar üzerinden [GetTitleByKey('c_winterfell').GetNameNoTier]'e dönmeye hazırlanıyorum. Umarım hızlı yolculukla Kuzey'in kuvvetlerini toplayabilir; ve bu savaşa yardım için aceleyle güneye sürebilirim."

 agot_events_rr_minor.0131.a:0 "Winterfell'e!"

 agot_events_rr_minor.0132.desc_opening:0 "[informer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"

 agot_events_rr_minor.0132.desc_body:0 "Yeşil topraklılardan savaşlarında büyük bir olay olduğu haberi bize ulaştı. Kral olacak savaşçı [baratheon.GetFullName], [location.GetName] Savaşı'nda ejderha [targaryen.GetName]'i öldürüp [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName] hanedanının son umudunu ezip geçti. Bu yeni Kral'ın gözüne girmenin ve yeşil toprakları talan etmek için bahane bulmanın tam zamanı!"

 agot_events_rr_minor.0132.a:0 "Uzun gemileri hazırlayın, Demir Adamlar'dan yeniden korkacaklar."

 agot_events_rr_minor.0132.b:0 "Yeşil topraklıların savaşları umurumda değil."

 agot_events_rr_minor.0400.t:0 "Fırtına Ucu Kuşatması"

 agot_events_rr_minor.0400.desc:0 "Hatırlayın, isterseniz, bu kalenin adını."

 agot_events_rr_minor.0400.a:0 "Korkutucu geliyor."

 agot_events_rr_minor.0401.t:0 "Soğan Şövalyesi"

 agot_events_rr_minor.0401.desc:0 "Bir aydır [GetTitleByKey('c_storms_end').GetNameNoTier] garnizonu amansız bir kuşatmaya dayanıyor; açlığı savuşturmak için at, köpek ve fare yemeye başvuruyor. Moral düşük, ama her şey kayıp değil. Gecenin geç saatlerinde, Gemi Kıran Koyu'nun hain sularında zikzak çizerek ilerleyen küçük bir kayık görülüyor ve garnizondaki her adamın hayretiyle limana yanaşıyor.\n\nTek başına bir figür gemiden atlıyor, bir eldivenini çıkarıp en yakındaki kaptana uzatıyor.\n\n"Umarım soğan seversiniz," diyor."

 agot_events_rr_minor.0401.a:0 "Böyle bir cesaret derhal ödüllendirilmeli!"

 agot_events_rr_minor.0401.b:0 "Bu adamı ödüllendir, bir bedel karşılığında."

 agot_events_rr_minor.0401.c:0 "Kaçakçılar yalnızca ölümü hak eder."

 agot_events_rr_minor.1000.t:0 "Targaryenlerin Kaçışı"

 agot_events_rr_minor.1000.desc:0 "Dar Deniz'in ötesine kaçışlarının ardından [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName]ler [exile_region.GetNameNoTier]'de sığınak buldu.\n\n[exile.GetTitledFirstName] artık Targaryenlerin lideri olarak hizmet ediyor."

 agot_events_rr_minor.1000.a:0 "İlginç."
