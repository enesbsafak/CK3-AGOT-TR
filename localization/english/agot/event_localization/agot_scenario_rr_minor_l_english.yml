l_english:

 agot_events_rr_minor.0001.t:0 "[duel_location.GetNameNoTooltip] Savaşı"

 agot_events_rr_minor.0001.desc.a:0 "Bu sabah erkenden çadırımdan kalkıp zırhımı kuşandım; hava, kemiğe işleyen soğuk bir nemle yoğundu. Sabah çiyi göğüs zırhımdaki yakutlara tutunmuş, onları her zamankinden daha parlak ışıldatıyordu; ufkun ötesinde ise taht gaspçısı adayının kampı vardı, çadırların arasından dumanlar yükseliyor, onun çadırı o ayak takımının tam ortasında duruyordu. O kadar yakın, o kadar da uzak.\n\nKemiklerimdeki soğuktan da fazlası var; onu hissediyorum, öfkesini hissediyorum ve bu savaşta karşı karşıya geleceğimizi, kılıç ile savaş çekicinin çarpışacağını biliyorum. Bu düşünce midemi bir an için kaldırdı. Hizmetkârlarımdan biri bir sorunum olup olmadığını sordu; ben de kendimi toparlamadan önce bir an güldüm. "Hayır, dostum, bir sorun yok," dedim.\n\n"Bugün öleceğim gün değil.""

 agot_events_rr_minor.0001.desc.b:0 "Bu sabah hava ferah ve canlandırıcı; ufukta, o kibirli ejderha piçinin rüzgârda dalgalanan çadırını görüyorum; yakında savaşın kopacağı iki kampımız arasındaki toprakların üzerinden dumanlar süzülüyor. Yüreğimle biliyorum ki o gururlu prensi, o gürültünün ortasında takip edip çekicimi kafatasına geçireceğim. Her şey bu ana vardı; her savaş, her çatışma, her ölen şövalye bizi bu noktaya getirdi. Rhaegar'ı kanatma zamanı."

 agot_events_rr_minor.0001.a:0 "Adalet yerini bulacak, nihayet"

 agot_events_rr_minor.0002.t:0 "[duel_location.GetNameNoTooltip] Savaşı"

 agot_events_rr_minor.0002.t.alt:0 "Bir Ejderhanın Ölümü"

 agot_events_rr_minor.0002.desc:0 "Oğluma ne olduğunun haberini alınca yüreğim daha da battı... Zavallı, en kıymetli oğlum, büyük oğlum! O kadar yavrum elimden alındığı gibi bir yenisi alındı! Bu hain köpeklerin ahlaksızlığı ve adaletsizliği sınır tanımıyor mu? Ailemin hiçbir ferdini bu bitmek bilmeyen saldırılardan koruyamayacak mıyım?\n\nYapmalıyım... harekete geçmeliyim; ailemi güvende tutmalıyım, zira emrimdekilerin hiçbiri bunu başaramıyor... Onları [GetTitleByKey('c_dragonstone').GetNameNoTier]'e göndereceğim! Evet, Dragonstone. Orada kimse onlara zarar veremez... Yine de soru hâlâ ortada: merhum oğlumun çocukları da karım ve oğlumla birlikte Dragonstone'a mı gönderilmeli?"

 agot_events_rr_minor.0002.a:0 "Yalnızca [GetScriptedCharacterByHistoryID('Targaryen_2').GetFirstName] ve [GetScriptedCharacterByHistoryID('Targaryen_8').GetFirstName] göndereceğim."

 AGOT_EVENTS_RR_MINOR_0002_TOOLTIP:0 "[GetScriptedCharacterByHistoryID('Targaryen_2').GetFirstName] savaş bitene dek Dragonstone'u elinde tutacak."

 agot_events_rr_minor.0002.b:0 "Ailemin tümü güvende tutulmalı!"

 agot_events_rr_minor.0004.t:0 "Seçeneksiz Kaldık"

 agot_events_rr_minor.0004.t_defeated_and_imprisoned:0 "İsyancılara Yenildik"

 agot_events_rr_minor.0004.desc:0 ""[ROOT.Char.GetLadyLord]," [iron_throne_ruler.GetFirstName]'in sarayından gelen elçi eğilip haberi ciddiyetle bildiriyor: "#N Kralın Şehri düştü#!. [GetTitleByKey('c_dragonstone').GetNameNoTier] tek başına kaldı."\n\nÖnümde seçenekler, rüzgârlı bir salondaki mum alevleri gibi titriyor: Dragonstone'da tutunup elimizde kalan güçleri toplayabiliriz, ya da belki koltuğumuzu güvenceye almak için Gaspçı'dan bir görüşme isteyebiliriz. Yine de yakarışlarımızın kulak bulması ihtimali, toparlayabileceğimiz savunmanın sonucu kadar belirsiz.\n\nAğır bir iç çekiş dudaklarımı terk ediyor; azalan seçeneklerimizi tartıyorum. Hanemden geriye kalanlar ve davamıza sadık olanlar için en akıllıca yol, Özgür Şehirler'de sığınak aramak gibi görünüyor. Orada, yabancı sokakların koşuşturmacası ve yabancı diller arasında, gücümüzü yeniden inşa edebilir ve Evi [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName]'in mirasını yeniden örebiliriz."

 agot_events_rr_minor.0004.desc.imprisoned:0 "İsyancılar [GetTitleByKey('c_dragonstone').GetNameNoTier]'in büyük salonuna akın ederek son savunma hattımızı yardı. Çarpışma şiddetliydi, kılıçların kaotik bir fırtınası ve umutsuz çığlıklar; ama ne yazık ki #italic yetmedi#!. Kale düşman eline geçerken nihai bedeli ödedik. Toz duman yatışınca kendimi onurumdan sıyrılmış, [iron_throne_ruler.GetFullName]'in önünde diz çökmüş halde buldum; alçaltıcı bir yenilgi gösterisi.\n\nŞimdi [iron_throne_ruler.GetFirstNamePossessiveNoTooltip] hükmünü [iron_throne_ruler.GetHerHis] zindanlarında bekliyorum. Geçen her an ıstırap verici. [ROOT.Char.GetFaith.HighGodName]'e, Gaspçı'nın gazabının başarısızlığımın son bedeli olan başımı almaya uzanmaması için sessiz dualar edebiliyorum yalnızca."

 agot_events_rr_minor.0004.a:0 "Dar Deniz'in ötesindeki krallar olarak Essos'a kaçmalıyız"

 agot_events_rr_minor.0004.a.tt:0 "Sen, ailen ve bazı saray mensupların [exile_destination.GetName]'e kaçacaksın"

 agot_events_rr_minor.0004.c:0 "Efendilerimizin insafına kaldık"

 agot_events_rr_minor.0005.t:0 "Fırtınadoğan"

 agot_events_rr_minor.0005.desc:0 "Sağır eden dolu fırtınası [GetTitleByKey('c_dragonstone').GetNameNoTier]'in çatısını şiddetle dövse de, [GetScriptedCharacterByHistoryID('Targaryen_2').GetFirstNamePossessive] çığlıkları tüm gürültünün üstüne çıkmayı başarıyor. Doğum sancıları, fırtına gibi, normalden çok daha uzun sürüyor — ve [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName] filosundan geriye kalanlar gibi Rhaella da kötü gidiyor. Nedimeleri kana bulanmış çarşaflar ve ellerle odanın içine girip çıkıyor; Üstat ise çocuk yatağında kıvranırken dua etmekten başka bir şey yapamıyor.\n\nKalenin tam tepesinden geldiği anlaşılan kulakları sağır eden bir gök gürültüsü patladığı sırada, Rhaella daha önceki çığlıklarına taş çıkartan, kan donduran bir çığlık atıyor. Tanrıların lütfuyla gök gürültüsü, rüzgâr ve dolu, herkesin duyabilmesine yetecek kadar diniyor — bir yenidoğanın ağlayışı.\n\nGünlerdir ilk kez Rhaella rahatlamış bir kahkaha atıyor, yeni doğanı titreyen kollarına alıyor; hastalıklı ve kanı çekilmiş yüzü çocuğuna gülümsüyor. Yaşadıklarından sonra bu, karşılaştığı ve henüz karşılaşacağı dehşetlerden tek ve kısa bir mola. "Fırtınadoğan," diye mırıldanıyor, sesi titrek; üstat çocuğu bakım için alırken. \n\nBir gök gürültüsü daha, Rhaella'dan acılı bir iniltiyle birlikte geliyor — bebek gelmişti, ama hâlâ endişe verici bir hızla kanıyor. Rıhtımdakiler sabaha filonun bitebileceği ihtimalini kabullenirken, başucundakiler de Rhaella için aynısını kabulleniyor. Ateşten ve kandan doğmuş, şimşek ve gök gürültüsü arasında doğmuş — tanrılar böyle başlangıçları olan bir çocuğa ne amaç biçmişler?"

 agot_events_rr_minor.0005.exiled.desc:0 "Sağır eden dolu fırtınası [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'in çatısını şiddetle dövse de, [GetScriptedCharacterByHistoryID('Targaryen_2').GetFirstNamePossessive] çığlıkları tüm gürültünün üstüne çıkmayı başarıyor. Doğum sancıları, fırtına gibi, normalden çok daha uzun sürüyor — ve [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName] davasından geriye kalanlar gibi Rhaella da kötü gidiyor. Nedimeleri kana bulanmış çarşaflar ve ellerle odanın içine girip çıkıyor; Üstat ise çocuk yatağında kıvranırken dua etmekten başka bir şey yapamıyor.\n\nKalenin tam tepesinden geldiği anlaşılan kulakları sağır eden bir gök gürültüsü patladığı sırada, Rhaella daha önceki çığlıklarına taş çıkartan, kan donduran bir çığlık atıyor. Tanrıların lütfuyla gök gürültüsü, rüzgâr ve dolu, herkesin duyabilmesine yetecek kadar diniyor — bir yenidoğanın ağlayışı.\n\nGünlerdir ilk kez Rhaella rahatlamış bir kahkaha atıyor, yeni doğanı titreyen kollarına alıyor; hastalıklı ve kanı çekilmiş yüzü çocuğuna gülümsüyor. Yaşadıklarından sonra bu, karşılaştığı ve henüz karşılaşacağı dehşetlerden tek ve kısa bir mola."

 agot_events_rr_minor.0005.a:0 "Yalnızca tanrılar kesin bilir..."

 agot_events_rr_minor.0006.t:0 "Biri Şu Çocukları Düşünmez mi?"

 agot_events_rr_minor.0006.desc.a:0 "Doğum sancıları uzun ve yıpratıcı olsa da, [GetScriptedCharacterByHistoryID('Targaryen_2').GetFirstNamePossessive] ölümü şükür ki çocuğu doğurduktan sonra biraz çabuk geldi; ölüm, dışarıdaki savaşan dünya acısına yenilerini ekleyemeden onu çocuk yatağında yakaladı. Bir zamanlar güçlü olan hanedanından geriye yalnızca iki çocuğu kaldı. \n\nKüçük olabilirler, ama yine de Targaryenler; Deli Kral'ın anısı yaşadığı sürece bu çocuklar avlanacak — ve onları Demir Taht'a teslim edene elbet büyük bir ödül bekliyor olacak. \n\nZaman onlara karşı işlerken, hayatta kalmaları için ikisini de [GetTitleByKey('c_dragonstone').GetNameNoTier]'den kaçırıp deniz ötesine, Özgür Şehirler'e götürmekten başka çare yok. Belki orada, zaman ve mesafe, hâlâ sadık olanların yeniden toparlanmasına izin verir; ya da en azından çocukların adları büyürken karanlıkta kaybolur gider. Belki huzuru tanırlar."

 agot_events_rr_minor.0006.desc.b:0 "Beni kurtaranın başkalarının duaları mı, damarımda yanan ejderhanın ateşi mi, yoksa sırf saf inat mı olduğundan emin değilim — ama büyük bir mucizeyle çocuk yatağım mezar yatağım olmadı. Oysa dinlenecek pek vakit yok. Westeros'ta hiçbir yer onlar için güvenli olmayacak, toprak iddiası olsun ya da olmasın. \n\nÇocuklarla deniz ötesine, Özgür Şehirler'e kaçabilir; bize toparlanmak ve yeniden gruplaşmak için zaman kazandırabilirim. Ama iki çocuğu saklamak, eski bir Kraliçe'yi saklamaktan kolaydır — [GetTitleByKey('c_dragonstone').GetNameNoTier]'de kalmak çocuklara daha fazla gizlilik sağlayabilir. Dayanabilirsem, Dragonstone çocuklar için reşit olduklarında siyasi açıdan faydalı olabilir. \n\nNe karar verirsem vereyim, çabuk vermeliyim. Westeros'un tamamının çocuklarımın peşinde olduğundan hiç şüphem yok; intikam, zafer ya da Demir Taht'ın bir tür iğrenç ödül olarak ortaya koyduğu parayı arıyorlar."

 agot_events_rr_minor.0006.desc.c:0 "agot_events_rr_minor.0006.desc.c"

 agot_events_rr_minor.0006.a:0 "Çocukları terk etmek mi? Hiç ihtimali yok! Onlarla gideceğim."

 agot_events_rr_minor.0006.b:0 "Kalacağım, ama hazırlanmalarına yardım edeceğim."

 agot_events_rr_minor.0006.c:0 "Peki sence değerleri TAM olarak kaç? Bir dost için soruyorum."

 agot_events_rr_minor.0007.t:0 "Son Korlar"

 agot_events_rr_minor.0007.desc:0 "Dar Deniz yolculuğu, tutulan nefesle geçiyor sanki. Her şeyin feci şekilde ters gitmesi için o kadar çok fırsat var ki; Westeros'a atılan her bakış, midenin kazınması ve yüreğin çarpması için bir sebep. \n\nÇocukların ayakları Özgür Şehirler'de toprağa basar basmaz, onlara eşlik edenler nihayet biraz rahat nefes alabiliyor. Dertlerinin sonu değil bu — hiç de değil — ama [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName] hükümranlığının son kalıntıları nihayet tehlikenin doğrudan pençesinden kurtuldu."

 agot_events_rr_minor.0007.a:0 "Ateş ve kan."

 agot_events_rr_minor.0100.t:0 "Sahte Sancak Altında"

 agot_events_rr_minor.0100.desc:0 "Önemli bir karar verme zamanı geldi. [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName]'in kışkırttığı savaş, onun ve hanesinin Westeros'taki konumunu zayıflattı; Kralın Şehri'ndeki Kızıl Kale son büyük kalesi. İyi uygulanmış bir aldatmaca ile şehri ve Kızıl Kale'yi ele geçirebilir, Yedi Cehennem'in bu iğrençliğine son verebilirim. Hükümdarlığının günleri sona ermeli."

 agot_events_rr_minor.0100.a:0 "Kükrememi duyacak..."

 agot_events_rr_minor.0100.b:0 "Bu çok büyük bir tehlike..."

 agot_events_rr_minor.0101.t:0 "Sadakat Nedir?"

 agot_events_rr_minor.0101.desc:0 "Muhafızlarım taht odasında hızla yanıma geliyor ve haberi getiriyor: [traitor_scope.GetTitledFirstName], [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName], [GetScriptedCharacterByHistoryID('Stark_3').GetHouse.GetName], [GetScriptedCharacterByHistoryID('Arryn_3').GetHouse.GetName] ve [GetScriptedCharacterByHistoryID('Tully_1').GetHouse.GetName] hanelerinin hain piçlerinden beni korumak için Batı Toprakları'nın ordularını Kralın Şehri'nin kapılarına getirdi! \n\nKonseyim iki yandan da bana öğüt veriyor. [advisor.GetName], [GetScriptedCharacterByHistoryID('Lannister_1').GetFirstName]'in gerçek niyetlerini gizleyebileceğinden korktuğu için şehre girmesine izin vermemem için beni sıkıştırırken, [traitor.GetName] Lordu [traitor_scope.GetHouse.GetBaseNameNoTooltip]'in lehine konuşuyor..."

 agot_events_rr_minor.0101.a:0 "O sadık bir hizmetkâr, içeri alın!"

 agot_events_rr_minor.0101.a.tt:0 "Kapılarını açacaksın..."

 agot_events_rr_minor.0101.b:0 "Bir hain daha!"

 agot_events_rr_minor.0102.t:0 "Sahte Sancak Altında"

 agot_events_rr_minor.0102.desc.a:0 "Şehrin kapıları açıldı, [GetTitleByKey('c_kings_landing').GetNameNoTier]'in geniş sokakları önümde ve adamlarımın önünde uzanıyor; amacıma bir adım daha yaklaştım. Ama askerler ganimet ister, adamlarım aç, şehir de hasada hazır. Sokaklardaki koyunların üzerine köpeklerimi salarken, Aegon'un Yüksek Tepesi'ne tırmanışımı sürdürüyorum; [GetTitleByKey('b_the_red_keep').GetNameNoTier] üzerimde yükseliyor. Kapılara vardığımızda onları sürgülü buluyoruz, kalenin garnizonu yerini koruyor. Oklar yağarken, [killer_1.GetFirstName] ve [killer_2.GetFirstName], seçkin askerlerle birlikte soluk kızıl duvarlara tırmanmaya başlıyor. \n\nKızıl Kale Basamakları'nın tepesinden bağrışmalar duyuluyor..."

 agot_events_rr_minor.0102.desc.b:0 ""Kapılar kapalı kalacak" — şehir kapısından elçinin haykırdığı tek şey buydu. [GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName] ve iğrenç dölünü yok etme planlarım durdu. Savaş onlar için hâlâ kayıp olsa da, isyancılara çağrılarına nihayet cevap verdiğimi göstermeliyim..."

 agot_events_rr_minor.0102.a:0 "Bana kafasını getirin."

 agot_events_rr_minor.0102.b:0 "Kuşatma başlasın."

 agot_events_rr_minor.0103.t:0 "Sahte Sancak Altında"

 agot_events_rr_minor.0103.desc:0 "Şehrin kapıları açılınca [GetScriptedCharacterByHistoryID('Lannister_1').GetHouse.GetName] askerleri içeri akıp şehri yağmalamaya başladı; garnizonun hiç şansı yoktu. Artık şehirde binlerce düşman varken her şey gerçekten kayıp. Öfkemi [jaime_scope.GetName]'e, [GetScriptedCharacterByHistoryID('Lannister_1').GetFirstNamePossessive] büyük oğluna çeviriyor ve babasının kafasını bana getirmesini emrediyorum. Jaime'yi öfkeyle başımdan savıp piromancımla [pyromancer_plotter.GetFirstName] görüşmeye çekiliyorum: "İhanetlerinin bedelini yanarak ödeyecekler! Şehrin dört bir yanındaki yabani ateş stoklarını tutuşturun; Gaspçı'ya kül ve kemikten başka bir şey kalmayacak!" Piromancı telaşla çıkıp gidiyor. Şehrin kıyametini taht odasında bekliyorum. \n\nAma kısa bir süre sonra [jaime_scope.GetName] içeri giriyor: "Piromancını öldürdüm." Şok olmuş, dehşete kapılmış ve Jaime'nin ne yapacağından korkarak kaçmaya çalışıyorum. Tahta tırmanırken boğazımı keskin bir soğuğun doldurduğunu hissediyorum. Çaresizce bedenim çöküyor ve Demir Taht'ın basamaklarından yuvarlanıyor; kanım yeri kaplıyor, Kızıl Kale'nin soluk kızıl taşını birkaç ton daha koyuya boyuyor..."

 agot_events_rr_minor.0103.a:0 "Hepsini yakın! #EMP Hepsini yakın...#!"

 agot_events_rr_minor.0104.t:0 "Sahte Sancak Altında"

 agot_events_rr_minor.0104.desc:0 "Hava kan ve ölümle yoğunlaşmıştı; [killer_1.GetFirstName] ve [killer_2.GetFirstName] bana yaklaşıyor. İkisi de kana bulanmış, gözleri iştiyakla dolu. Bakışları hiç şüphe bırakmıyor, iş tamamlandı. Sadıklar [GetTitleByKey('b_the_red_keep').GetNameNoTier]'de yerlerini korudular, ama batının aslanı karşısında hiç şansları yoktu. İzcilerim başkente ilerleyen isyancı güçleri olduğunu bana çoktan bildirdi. Yeni bir çağ doğuyor..."

 agot_events_rr_minor.0104.a:0 "Aslanın pençeleri hâlâ var..."

 agot_events_rr_minor.0105.t:0 "Kırılan Umutlar, Kırılan Taht İddiacıları"

 agot_events_rr_minor.0105.desc.b:0 "Üç başlı ejderhanın bir zamanlar yuvalandığı [GetTitleByKey('c_kings_landing').GetNameNoTier]'in kapılarının üzerinde kükreyen bir aslan uçuyor. Şehir [GetScriptedCharacterByHistoryID('Lannister_1').GetHouse.GetName]lerin eline geçti. \n\nŞehir yağmalandı; [GetTitleByKey('b_the_red_keep').GetNameNoTier]'e vardığımızda, [GetScriptedCharacterByHistoryID('Lannister_1').GetFirstNamePossessive] adamları sadıkların ve yollarına çıkan herkesin cesetlerini arabalara dolduruyor. Kalenin bir zamanlar kusursuz olan süsleri ve döşemeleri kana bulanmış; kalenin adına yeni bir anlam katıyor — unutmayacağım bir anlam. \n\nTaht odası daha iyi değil; taht basamaklarındaki bir zamanlar göz kamaştıran halı artık kana bulanmış. Beni asıl sarsan, Demir Taht'ta oturan kişi: [GetScriptedCharacterByHistoryID('Lannister_7').GetFirstName] [GetScriptedCharacterByHistoryID('Lannister_7').GetHouse.GetName], [GetTitleByKey('d_kingsguard').GetNameNoTier]'in andlı bir şövalyesi. \n\nDeli Kral'ın akıbeti anlatıldığında bunun doğru olmadığını düşünmüştüm kesin. Ama işte, çirkin gerçek tam karşımda, gözlerimin önünde. Adamlarımdan biri bana yaklaşıyor. "Efendim, Lord [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstNamePossessive] ordusu şehre yaklaşıyor.""

 agot_events_rr_minor.0105.desc.a:0 "Kutlama sebebi ortada olmasına rağmen, kalenin içindekilerin neşesi biraz sönüyor: [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName]'in önüne iki kızıl bohça serilmiş — olması gerekenden çok daha küçük bohçalar. [GetScriptedCharacterByHistoryID('Lannister_1').GetFirstName] ciddiyetle izliyor Robert bohçaları incelerken; içlerindeki bedenleri örten pelerinleri sessizce geri çekiyor. [GetScriptedCharacterByHistoryID('Targaryen_10').GetFirstName] ve... \n\nTywin uzanıyor, eli ikinci bohçayı açmaya giderken Robert'a durması için işaret ediyor. "[GetScriptedCharacterByHistoryID('Targaryen_11').GetFirstName] [GetScriptedCharacterByHistoryID('Targaryen_11').GetHouse.GetName]," diye duyuruyor Tywin. "Size bu rahatsızlığı yaşatmamanızı öneririm, Efendim. Görecek pek bir şey kalmadı." Robert bir an tereddüt ediyor, ama sonunda kendi gözüyle görmenin çıkarına olduğuna karar veriyor — pelerini kaldırıp yüzü olmayan bir kemik ve kan dehşetiyle karşılaştığında anında pişman oluyor. Bedeni hızla yeniden örtüyor ve önüne serilen cesetlerden uzaklaşmak için acele ediyor. Tywin bugün sadakatini kanıtladı; ne var ki Robert'tan sonra gelenlerin pek azı Aegon'un kalıntılarına bakmaya cesaret ediyor."

 agot_events_rr_minor.0105.desc.c:0 "[GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] önüne serdiğim iki bohçanın karşısında duruyor. [GetScriptedCharacterByHistoryID('Targaryen_10').GetFirstName] ve [GetScriptedCharacterByHistoryID('Targaryen_11').GetFirstName] — ikisi de tüm kanı gizleme umuduyla kızıl pelerinlere sarılı. Robert bedenleri tek tek inceliyor, yüzlerini görüp kimliklerini doğrulamak için pelerinleri kaldırıyor. İkisinin en küçüğüne geldiğinde, beklemeleri için ona işaret ediyorum. \n\n"Aegon Targaryen'ın cesedi," diye bildiriyorum, pelerinin altındaki manzarayı kendi gözlerimle görmüş biri olarak. "Size bu rahatsızlığı yaşatmamanızı öneririm, Efendim. Görecek pek bir şey kalmadı." Robert bir an tereddüt ediyor, ama sonunda kendi gözüyle görmenin çıkarına olduğuna karar veriyor — pelerini kaldırıp yüzü olmayan bir kemik ve kan dehşetiyle karşılaştığında anında pişman oluyor. Aegon'un kafatasının soluk çatısı duruyor, olması gereken yerde bir gram beyin yok. Robert bedeni hızla yeniden örtüyor ve oradan uzaklaşmak için acele ediyor. \n\n"Çok iyi," diyebildiği tek şey, bana onaylayan bir baş selamı verirken."

 agot_events_rr_minor.0105.a:0 "Korkunç bir iş, gerçekten."

 agot_events_rr_minor.0106.t:0 "Kana Kan"

 agot_events_rr_minor.0106.desc.a:0 ""Onlar #italic çocuktu,#! Robert!" Ned konuşurken bir o yana bir bu yana yürüyor, gözle görülür biçimde üzgün. Her zaman biraz fazla yufka yürekli olmuştur. \n\n"Çocuklar da büyüyüp taht iddiacısı olurlar," diye hatırlatıyorum ona.\n\n"[GetScriptedCharacterByHistoryID('Targaryen_11').GetFirstName] [GetScriptedCharacterByHistoryID('Targaryen_11').GetHouse.GetName] daha memeden yeni kesilmemişti," diye haykırıyor Ned. "Başka yollar da vardı—"\n\n"[GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName]'in [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName]'i kaçırmasına karşı başka yollar da vardı," diye patlıyorum. Her şeyin neyle ilgili olduğunu mu unuttu? "Kana kan, diyorum."\n\nNed başını sallıyor. "Peki bunu ona nasıl açıklayacaksın?" diye soruyor. "Kız kardeşimin gözünün içine bakıp o çocukların katlini nasıl anlatacaksın?" \n\nDuydaklarıma inanamıyorum. Birkaç ejderha dölü için mi? Ned öfkeyle odadan fırlıyor."

 agot_events_rr_minor.0106.desc.b:0 "Yüreğim çarpıyor ve az önce gördüğüm şeyi kavramaya çalışırken yerimde duramıyorum. "Onlar #italic çocuktu,#! Robert!"\n\n"Çocuklar da büyüyüp taht iddiacısı olurlar," diye savunuyor.\n\n"[GetScriptedCharacterByHistoryID('Targaryen_11').GetFirstName] [GetScriptedCharacterByHistoryID('Targaryen_11').GetHouse.GetName] daha memeden yeni kesilmemişti," diye haykırdığımı fark ediyorum. "Başka yollar da vardı—" \n\n"[GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName]'in [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName]'i kaçırmasına karşı başka yollar da vardı," diye sözümü kesiyor Robert. "Kana kan, diyorum." \n\nDehşete kapılıyorum. "Peki bunu ona nasıl açıklayacaksın?" diye soruyorum ona. "Kız kardeşimin gözünün içine bakıp o çocukların katlini nasıl anlatacaksın?" \n\nEn yakın dostum Robert'ın, çocuk kanı döküldüğünü görecek kadar kinle dolduğuna inanamıyorum. Ama yasım, Lyanna evine dönene dek beklemeli."

 agot_events_rr_minor.0106.a:0 "Lyanna arayışı sürüyor."

 agot_events_rr_minor.0107.t:0 "Ve Çanlar Böyle Çalar..."

 agot_events_rr_minor.0107.desc:0 "Herkese duyurulsun, Westeros'tan Essos'a ve ötesindeki topraklara: \n\n#bold Deli Kral Aerys II Targaryen can verdi.#! \n\nKralın Şehri, hüküm süren Targaryen hanedanını da beraberinde alarak düştü."

 agot_events_rr_minor.0107.a:0 "Valar morghulis."

 agot_events_rr_minor.0200.t:0 "Sahte Sancak Altında"

 agot_events_rr_minor.0200.desc:0 "Kuvvetlerimi Batı Toprakları'ndan Kapı'ya getirdim. Muhafızları selamlıyor ve onlara, krala onları kurtarmaya geldiğimizi ve şehri savunabilmemiz için kapıyı açmaları gerektiğini söylemelerini emrediyoruz."

 agot_events_rr_minor.0200.a:0 "Hiçbir şeyden şüphelenmiyorlar"

 agot_events_rr_minor.0117.t:0 "Hepsini Yak"

 agot_events_rr_minor.0117.desc:0 "Hepsini yak, diyorum [GetScriptedCharacterByHistoryID('Pyromancer_1').GetFirstName]'e; tahtıma yeniden kurulurken hain aslanın kıvranışını izliyorum, bir ejderhanın ateşini yenemeyeceğini biliyor. Ateş Tarlası'nda Aegon'un ejderhasından kaçmayı başardılar, ama atalarımın hatalarını düzeltip tahtı hainlere bırakmamalıyım"

 agot_events_rr_minor.0117.a:0 "Kül tahtında hüküm sürecekler"

 agot_events_rr_minor.0118.t:0 "Hepsini Yak"

 agot_events_rr_minor.0118.a:0 "Kül tahtında hüküm sürecekler."

 agot_events_rr_minor.0119.t:0 "Yeşil Alevler"

 agot_events_rr_minor.0119.desc:0 "[GetTitleByKey('c_kings_landing').GetNameNoTier] tam bir kaos içinde. Şehir düştü; askerler sokaklarda yürüyor, yağmalanmayan pek az ev kalıyor.\n\nGörünüşe göre yağma ve yıkım, insanların en büyük derdi değil: şehirde patlama sesleri yankılanıyor. Onları duyuyorum, hatta hissediyorum; kemiklerimin derinliğinde sonumun geldiğini biliyorum. Koşmaya çalışıyorum, evlerden birine sığınmak için; dışarıda bir insan seli birbirini çiğniyor. Nihayet eve vardım, ama ne yazık! Sokaklarda yeşil alevin aktığını görüyorum ve son nefesimi çekerken onun beni sarmaladığını hissediyorum. "

 agot_events_rr_minor.0119.a:0 "Görünüşe göre korkunç bir kaderle karşılaştım."

 agot_events_rr_minor.0108.t:0 "İsyanın Kıvılcımı"

 agot_events_rr_minor.0108.desc:0 "Habercinin sözlerinin anısı hâlâ kül tadında. Babam gitti. [GetScriptedCharacterByHistoryID('Stark_2').GetFirstName] gitti. Deli Kral'ın "adaleti" bir odun yığınından başka bir şey değildi. Kız kardeşim hâlâ [GetScriptedCharacterByHistoryID('Targaryen_3').GetShortUINamePossessive] ellerinde.\n\nŞimdi [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName], [GetScriptedCharacterByHistoryID('Arryn_3').GetFirstName]'in beni ve [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName]'i kendisine teslim etmesini istiyor — hiç şüphesiz akrabalarımla aynı kaderi yaşamak için. Jon bu talebe çelikle cevap verdi.\n\nKuzey'in ağırlığı omuzlarımda; kan ve yabani ateşle satın alınmış bir lordluk, üstüne zor tanıdığım bir kadınla evlilik anlaşması. Yine de ailem yok edilirken ve kız kardeşim esirken boş duramam.\n\nRobert, Jon ve ben birlikte başkaldırıyoruz. Beni büyüten baba için, yerimde olması gereken kardeş için ve Lyanna için — yürüyorum. Bugün sancaklarımız [GetTitleByKey('c_gulltown').GetNameNoTier]'in kapıları önünde yükseliyor ve ejderhanın hükümdarlığı çökmeye başlıyor."

 agot_events_rr_minor.0108.a:0 "Adalet için."

 agot_events_rr_minor.0109.t:0 "İsyanın Kıvılcımı"

 agot_events_rr_minor.0109.desc:0 "Her gece yüzünü görüyorum ve her sabah ejderha dölü [GetScriptedCharacterByHistoryID('Targaryen_3').GetShortUIName]'in hâlâ nefes aldığı, [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName]'imin ise onun pis pençelerinde kaldığı gerçeğiyle uyanıyorum. Tanrılar delirmiş ve [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName] onların habercisi — mezbahaya dönmüş bir sarayda Lord [GetScriptedCharacterByHistoryID('Stark_1').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_1').GetHouse.GetName]'i yakıyor, oğlu [GetScriptedCharacterByHistoryID('Stark_2').GetFirstName]'i boğuyor.\n\nŞimdi Deli Kral kafalarımızı mı istiyor? Nefes alma suçundan bizi hain mi ilan ediyor? Gelsin bakalım. [GetScriptedCharacterByHistoryID('Arryn_3').GetFirstName] cevabını çelikle verdi, benimki de yumruğumda sıkılı bekliyor.\n\nKurt, şahin ve alabalık, geyikle birlikte duruyor; Lyanna dönene dek durmayacağız. Rhaegar'ı ölü, Aerys'i devrilmiş göreceğim.\n\nKralın yerine kimin geçeceğini henüz bilmiyor olabiliriz, ama bir şey kesin: ejderhanın hükümdarlığı bitti! Bugün sancaklarımız [GetTitleByKey('c_gulltown').GetNameNoTier]'in kapıları önünde rüzgârda dalgalanıyor."

 agot_events_rr_minor.0109.a:0 "Lyanna için!"

 agot_events_rr_minor.0110.t:0 "İsyanın Kıvılcımı"

 agot_events_rr_minor.0110.desc:0 "Geçen hafta bir kuzgun geldi. Deli [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUINamePossessive] zalimliği, eski dostum Lord [GetScriptedCharacterByHistoryID('Stark_1').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_1').GetHouse.GetName]'in ve varisi [GetScriptedCharacterByHistoryID('Stark_2').GetFirstName]'in canını aldığında, bunun isyan için sahneyi hazırladığını düşünmüştüm. Ama şimdi vesayetlerimi teslim etmemi istiyor: [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] ve Rickard'ın ikinci oğlu [GetScriptedCharacterByHistoryID('Stark_3').GetFirstName]; onları sebepsiz yere hain ilan ediyor.\n\nReddettim.\n\nNed'le — şimdi [GetTitleByKey('c_winterfell').GetNameNoTier] Lordu ve [GetTitleByKey('c_riverrun').GetNameNoTier]'den Leydi [GetScriptedCharacterByHistoryID('Tully_4').GetFirstName] [GetScriptedCharacterByHistoryID('Tully_4').GetHouse.GetName] ile yeni evlenmiş biri — ve adamlarını Fırtına Toprakları'ndan yöneten Robert'la birlikte, Vadi şövalyelerim ve ben Demir Taht'a karşı açık isyana kalktık.\n\nBugün sancaklarımız gölgesini hain [GetTitleByKey('c_gulltown').GetNameNoTier]'in kapılarına düşürüyor."

 agot_events_rr_minor.0110.a:0 "Geri dönüş yok."

 agot_events_rr_minor.0111.t:0 "Büyük Bir Fırsat"

 agot_events_rr_minor.0111.desc:0 "[GetScriptedCharacterByHistoryID('Stark_5').GetHouse.GetName] kızı ölüyken, Yedi Krallık'ın yeni Lordu [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName] karısız kaldı. \n\nBelki kızımı ona sunmalıyım — sonuçta bir [GetScriptedCharacterByHistoryID('Lannister_6').GetHouse.GetName] kraliçesi, ailemize sarayda ve dışarıda muazzam fayda sağlar."

 agot_events_rr_minor.0111.a:0 "Bu zaten mantıklı!"

 agot_events_rr_minor.0111.a.tt:0 "Teklifi gönderiyorsun"

 agot_events_rr_minor.0111.b:0 "Kral olsa bile — kızımın hiçbiri bir ayyaşla evlenmeyecek!"

 agot_events_rr_minor.0111.b.tt:0 "Teklif göndermiyorsun"

 agot_events_rr_minor.0112.t:0 "Altın Gelin"

 agot_events_rr_minor.0112.desc:0 "Sevgili [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName]'im öldü ve yüreğim hiç bu kadar derin bir acı tanımadı. Şarap acının çoğunu uyuşturuyor, ama bir boşluk kalıyor; bir türlü silkeliyemiyorum. Ah, tatlı, tatlı Lyanna'm...\n\nBirkaç gün daha yas tuttuktan sonra Büyük Üstat bana Lord [GetScriptedCharacterByHistoryID('Lannister_1').GetFirstName]'den bir teklif geldiğini bildiriyor: kızının elini bana sunmuş. Güzel, hoş ve her bakımdan kusursuzmuş — ama yine de, kaybettiğim aşkımla gerçekten kıyaslanabilir mi?"

 agot_events_rr_minor.0112.a:0 "Her kralın bir kraliçeye ihtiyacı vardır. Hiçbir şey olmasa, tam da beklenen kişi, sanırım..."

 agot_events_rr_minor.0112.a.tt:0 "Teklifi kabul ediyorsun."

 agot_events_rr_minor.0112.b:0 "Yalnızca bir kez sevdim. Bir daha asla."

 agot_events_rr_minor.0112.b.tt:0 "Teklifi reddediyorsun."

 agot_events_rr_minor.0113.t:0 "Hep İç İçe"

 agot_events_rr_minor.0113.desc:0 "Jaime'im. Sevgili, tatlı, yakışıklı Jaime'im; kardeşim, ikizim, aşkım... \n\nHep birlikteydik, daha rahimdeyken bile. Elim [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName]'e ait, evet, ama o hâlâ #italic benim#! Jaime'im ve ona özlem duymaktan kendimi alamıyorum. \n\nPeki ya yakalanırsak? Ya çocuklarımın babası olur da #italic birileri#! gerçeği öğrenirse? Ah, sonuçları anlatılamaz olurdu. \n\nBeni kollarında tutuyor ve Robert'ın olmadığı her şey — ama aynı zamanda kardeşim ve utanmamız gerekirken #italic utanmıyoruz!#! Aşkımız söylendiği gibi doğaya aykırı ve ayıpsa, dokunuşu neden bu kadar iyi hissettiriyor? Neden kendimizi mahrum edelim?"

 agot_events_rr_minor.0113.a:0 "Sensiz eksik kalıyorum."

 agot_events_rr_minor.0113.a.tt:0 "Jaime ile yatıyorsun."

 agot_events_rr_minor.0113.b:0 "Bu, geri alınamayacak bir şey yapmadan önce, şimdi sona eriyor."

 agot_events_rr_minor.0113.b.tt:0 "Jaime'yi reddediyorsun."

 agot_events_rr_minor.0114.t:0 "Harrenhal Turnuvası"

 agot_events_rr_minor.0114.desc:0 "Bu belayı ülkeye getiren benim gururum. Turnuvamda büyük lordlar toplandı ve büyük lordlar komplo kurdu. [GetTitleByKey('c_dragonstone').GetNameNoTier] Prensi, Sevi ve Güzelliğin Kraliçesi olarak kızım [daughter.GetName]'i değil de bir başkasını seçtiğinde, bu kaosun tohumları toprağa ekildi.\n\nŞimdi kardeşim [brother.GetTitledFirstName] bana yazıyor; sözleri bu Prens'e güvenmem için yalvarıyor. [rhaegar.GetTitledFirstNamePossessive] planı, Evi [rhaegar.GetDynastyName]'in tüm görkemiyle dönüşünü görecekmiş.\n\nPeki ya Evi [ROOT.Char.GetDynastyName]'in geleceği? Üstün efendilerimiz Evi [tully.GetDynastyName] isyancılarla birlikte ayağa kalktı ve [tully.GetTitledFirstName] eniştemiz, çocukları bizim kanımızdan. [sister.GetFirstNamePossessive] çocuklarının Lord [GetScriptedCharacterByHistoryID('Stark_1').GetHouse.GetName] ile aynı sonu yaşamasını mı izleyeyim?"

 agot_events_rr_minor.0114.a:0 "İnancımı kardeşimin sadakatine bağlayacağım."

 agot_events_rr_minor.0114.a.tt:0 "Sadık kalacaksın."

 agot_events_rr_minor.0114.b:0 "Her kampa bir oğul, Evi [ROOT.Char.GetDynastyName]'in geleceğini güvenceye alacak"

 agot_events_rr_minor.0114.b.tt:0 "Tarafsız kalacaksın."

 agot_events_rr_minor.0114.c:0 "Gaspçı'ya haberi ulaştır: Yarasa havalandı."

 agot_events_rr_minor.0114.c.tt:0 "Robert'ın İsyanı'na katılacaksın."

 agot_events_rr_minor.0115.t:0 "Kışta Kraken"

 agot_events_rr_minor.0115.desc:0 "Bu oğlanlar benim sonum olacak! Yeşil topraklılar demir sandalyeleri için birbirlerini parçalarken, biz Demir Adamlar kargaşa içindeyiz. \n\nOğullarım, sürünen sağlığımın üzerine salya akıtarak Ejderha'ya karşı savaşa katılmam için beni sıkıştırıyor. Bir sonraki seferimin son seferim olabileceğini biliyorlar, ama yine de bana uyacak tek bir tanesi yok. [balon.GetNamePossessive] Eski Yol'un kaybına dair bitmek bilmeyen yakınmalarına, [victarian.GetNamePossessive] soğukkanlılık eksikliğine ve [euron.GetNamePossessive] sapkın hırslarına katlanmak zorundayım — ayrıntıya girmeye cesaret edemem, zira böyle bir ahlaksızlığın gerçekleşmesini dilemiş olurum.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('piper'))] [piper.GetTitledFirstName] tek tesellim. Kollarında genç [robin.GetName], iki dünyamız arasındaki köprü; eski ve güçsüz tohumdan doğmuş. Taş yonttum, ama fırtınada çürük bir köprüde yürüyoruz.\n\nŞimdi, kendi ölümlülüğümün gözlerinin içine bakarken, net görüyorum: #bold mirasım kendi yavrularım tarafından parçalanacak.#! Leş için çekişecek bir karga sürüsü."

 agot_events_rr_minor.0115.a:0 "Geyik Ejderha'yı boynuzlayabilir mi, görelim."

 agot_events_rr_minor.0115.a.tt:0 "Yaşlı Kraken savaşı kafasında evirecek."

 agot_events_rr_minor.0115.b:0 "Çetin zaman, çetin davranış ister."

 agot_events_rr_minor.0116.t:0 "[location.GetName] Savaşı"

 agot_events_rr_minor.0116.desc:0 "[location.GetName] savaşında [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName] sadıklarıyla çarpışmam sırasında [stormlander_lord.GetTitledFirstName] huzuruma gelip [stormlander_lord.GetHerHis] teslimiyetini sundu. Belli ki silah ustalığımı ve diğer eski sadıklara gösterdiğim cömertliği gördükten sonra, [stormlander_lord.GetSheHe] haklı davamızın yanında yer almanın çok daha akıllıca olduğunu anlamış."

 agot_events_rr_minor.0116.a:0 "Geyik gittikçe güçleniyor."

 agot_events_rr_minor.0116.a.tt:0 "[stormlander_lord.GetTitledFirstName] artık çatışmada senin tarafında olacak."

