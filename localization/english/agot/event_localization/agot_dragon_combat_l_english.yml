### TODO NOT-IN-ST: agot_dragon_combat.1004.desc.chomp [AGOT: There was really never any hope for [my_foe.GetFirstName]. [my_foe_dragon.GetName] is not half the size of mine own [my_dragon.GetName], and [my_foe.GetSheHe] knows that a full frontal assault would be suicide, preferring to stalk between the clouds.\n\nSeveral times I think I see the shadow of our prey, only for the apparition to clear as we get closer.\n\nAs we fly a primal part of my body recognizes this for what it is. The deep visceral scream of instincts honed when men were no more than beasts. We are the predator, and dragon is our prey.\n\nAs if to punctuate the thought, another shadow forms in front of me. I briefly expect this to be as imagined as the others, when the smaller form appears in right in front of us! I do not even need to instruct [my_dragon.GetNameNoTooltip]. [my_dragon.Custom('GetDragonHerHis')|U] maw opens and with a single bite, [my_foe_dragon.GetName] and [my_foe.GetName] are eaten whole.]
 agot_dragon_combat.1004.desc.chomp:0 "There was really never any hope for [my_foe.GetFirstName]. [my_foe_dragon.GetName] is not half the size of mine own [my_dragon.GetName], and [my_foe.GetSheHe] knows that a full frontal assault would be suicide, preferring to stalk between the clouds.\n\nSeveral times I think I see the shadow of our prey, only for the apparition to clear as we get closer.\n\nAs we fly a primal part of my body recognizes this for what it is. The deep visceral scream of instincts honed when men were no more than beasts. We are the predator, and dragon is our prey.\n\nAs if to punctuate the thought, another shadow forms in front of me. I briefly expect this to be as imagined as the others, when the smaller form appears in right in front of us! I do not even need to instruct [my_dragon.GetNameNoTooltip]. [my_dragon.Custom('GetDragonHerHis')|U] maw opens and with a single bite, [my_foe_dragon.GetName] and [my_foe.GetName] are eaten whole."
