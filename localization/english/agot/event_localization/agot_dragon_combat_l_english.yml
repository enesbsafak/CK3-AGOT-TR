l_english:

 agot_dragon_combat.will_engage:0 "Bir ejderha düellosunda [enemy_dragonrider.GetTitledFirstName] ve [enemy_dragon.GetName] ile çarpışacaksınız!"

 agot_dragon_combat.will_engage_enemy:0 "Bir ejderha düellosunda [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetName] ile çarpışacaksınız!"

 agot_dragon_combat.will_attempt_engage:0 "Bir ejderha düellosunda [enemy_dragonrider.GetTitledFirstName] ve [enemy_dragon.GetName] ile çarpışmayı deneyeceksiniz!"

 agot_dragon_combat.will_attempt_engage_enemy:0 "Bir ejderha düellosunda [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetName] ile çarpışmayı deneyeceksiniz!"

 agot_dragon_combat.will_not:0 "[enemy_dragonrider.GetTitledFirstName] ve [enemy_dragon.GetName]'den kaçmaya çalışacaksınız!"

 agot_dragon_combat.will_not_enemy:0 "[dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetName]'den kaçmaya çalışacaksınız!"

 agot_dragon_combat.0001.t:0 "Düşman Ejderha Binicisi Görüldü"

 agot_dragon_combat.0001.desc_opening:0 "[dragon_in_battle.GetName] ve ben [battle_location.GetName] üzerinde uçuyoruz,"

 agot_dragon_combat.0001.desc_opening_fly:0 " manzara arkamızda kalırken [enemy_commander_in_battle.GetTitledFirstName] kuvvetlerine doğru süzülüyoruz."

 agot_dragon_combat.0001.desc_opening_fight:0 " alevlerimizin altında [enemy_commander_in_battle.GetTitledFirstNamePossessive] adamlarından bir düzinesini çoktan kül etmiş durumdayız."

 agot_dragon_combat.0001.desc_opening_end:0 " Yine de gökyüzüne karşı daha tehlikeli bir düşman görüyorum.\n\n"

 agot_dragon_combat.0001.desc_younger:0 "Yaşlı ejderha [enemy_dragon.GetName], benim kendi ejderham [dragon_in_battle.GetNameNoTooltip]'ten daha büyük; üzerinde [enemy_dragonrider.GetTitledFirstName] oturuyor."

 agot_dragon_combat.0001.desc_older:0 "Genç ejderha [enemy_dragon.GetName], benim kendi ejderham [dragon_in_battle.GetNameNoTooltip]'ten daha küçük; üzerinde [enemy_dragonrider.GetTitledFirstName] oturuyor."

 agot_dragon_combat.0001.desc_same_age:0 "Ejderha [enemy_dragon.GetName], boyut olarak benim kendi ejderham [dragon_in_battle.GetNameNoTooltip] ile benzer; üzerinde [enemy_dragonrider.GetTitledFirstName] oturuyor."

 agot_dragon_combat.0001.desc_weaker_warrior:0 " [enemy_dragonrider.GetFirstName]'in benden daha az yetenekli bir savaşçı olduğunu bilsem de, burada bunun bana hiçbir faydası olmayacak.\n\n"

 agot_dragon_combat.0001.desc_stronger_warrior:0 " [enemy_dragonrider.GetFirstName]'in benden daha yetenekli bir savaşçı olduğunu bilsem de, burada bunun ona hiçbir faydası olmayacak.\n\n"

 agot_dragon_combat.0001.desc_warrior:0 " [enemy_dragonrider.GetFirstName] eğitimli bir savaşçı olsa da ben olmasam bile, burada bunun ona hiçbir faydası olmayacak.\n\n"

 agot_dragon_combat.0001.desc_weak:0 " [enemy_dragonrider.GetFirstName]'in benden çok daha kötü bir savaşçı olduğunu bilsem de, burada bunun bana hiçbir faydası olmayacak.\n\n"

 agot_dragon_combat.0001.desc_equally_weak:0 " İkimiz de alışılmış savaşçılar olmasak da, bu tür yaratıklarla her çatışma kendi silahlarımızın bir sınavı olmayacak.\n\n"

 agot_dragon_combat.0001.desc_end:0 "Hayır, bu çatışma ejderhalarımızın gücüne ve bunu en iyi nasıl avantajımıza kullanacağımıza bağlı olacak. Görünüşe göre [enemy_dragonrider.GetFirstNameNoTooltip] ve [enemy_dragon.GetNameNoTooltip]'i ilk ben fark ettim; şimdi düşünmem gereken şey şu: bu ejderha dansını ben mi başlatayım?"

 agot_dragon_combat.0001.a:0 "Hadi onları alalım [dragon_in_battle.GetNameNoTooltip]!"

 agot_dragon_combat.0001.a.brother:0 "Öyleyse kardeşim, hadi bunu bitirelim!"

 agot_dragon_combat.0001.a.sister:0 "Öyleyse kızkardeşim, hadi bunu bitirelim!"

 agot_dragon_combat.0001.a.father:0 "Öyleyse baba, hadi bunu bitirelim!"

 agot_dragon_combat.0001.a.mother:0 "Öyleyse anne, hadi bunu bitirelim!"

 agot_dragon_combat.0001.a.son:0 "Öyleyse oğlum, hadi bunu bitirelim!"

 agot_dragon_combat.0001.a.daughter:0 "Öyleyse kızım, hadi bunu bitirelim!"

 agot_dragon_combat.0001.b:0 "Bir savaş mı? Burada mı? Bence #EMP hayır#!!"

 agot_dragon_combat.0001.b.weaker:0 "Bu akıllıca görünmüyor."

 agot_dragon_combat.0001.b.coward:0 "Başka bir ejderhayla savaşmak mı? Hadi canım, olmaz!"

 agot_dragon_combat.0001.b.notice:0 "Kaçtığınızı fark edip kovalamaya karar verebilirler"

 agot_dragon_combat.0001.b.no_notice:0 "Savaş alanından kaçtığınızı fark etmiyorlar"

 agot_dragon_combat.0001.b.swift:0 "#P [dragon_in_battle.GetNamePossessiveNoTooltip] çevikliği kaçışınızı kolaylaştıracak#!"

 agot_dragon_combat.0001.b.slow:0 "#N [dragon_in_battle.GetNamePossessiveNoTooltip] yavaşlığı kaçışınızı zorlaştıracak#!"

 agot_dragon_combat.0002.t:0 "Gökyüzü Pusu!"

 agot_dragon_combat.0002.desc:0 "[battle_location.GetName] savaşı altımda sürerken [dragon_commander_in_battle.GetTitledFirstName] kuvvetlerini yakıp kül ediyorum; tam o sırada gökyüzünde ikinci bir alev şeridi patlak veriyor!\n\n[enemy_dragon.GetName]'in altımdan dalışa geçtiğini hissediyorum, yüzümün önünden sıcak rüzgâr geçip gidiyor; başımın üzerinden süzülen alev tufanından kıl payı kurtuluyorum. Başımı kaldırınca ejderha [dragon_in_battle.GetName]'in şaşırtıcı bir hızla üzerimden geçtiğini görüyorum; [dragon_in_battle.Custom('GetDragonHerHis')] binicisi [dragonrider_in_battle.GetTitledFirstName] eyerinin üstünden cinayet niyetiyle bana bakıyor.\n\n[dragonrider_in_battle.GetSheHe|U] savaş istiyor!"

 agot_dragon_combat.0002.a:0 "O hâlde [dragonrider_in_battle.GetSheHe] aradığı düelloyu bulacak!"

 agot_dragon_combat.0002.b:0 "Buradan çıkmalıyız!"

 agot_dragon_combat.0002.b.flee:0 "[dragon_in_battle.GetName]'den başarıyla kaçıp savaş alanını terk ediyorsunuz"

 agot_dragon_combat.0002.b.swift:0 "#P [enemy_dragon.GetNamePossessiveNoTooltip] çevikliği kaçışınızı kolaylaştıracak#!"

 agot_dragon_combat.0002.b.slow:0 "#N [enemy_dragon.GetNamePossessiveNoTooltip] yavaşlığı kaçışınızı zorlaştıracak#!"

 agot_dragon_combat.0002.b.enemy_swift:0 "#N [dragon_in_battle.GetNamePossessiveNoTooltip] çevikliği kaçışınızı zorlaştıracak#!"

 agot_dragon_combat.0002.b.enemy_slow:0 "#P [dragon_in_battle.GetNamePossessiveNoTooltip] yavaşlığı kaçışınızı kolaylaştıracak#!"

 agot_dragon_combat.0002.escape.t:0 "[enemy_dragonrider.GetShortUIName] önünüzden kaçıyor!"

 agot_dragon_combat.0002.escape.desc:0 "[enemy_dragonrider.GetShortUIName], yüzünüze bakmak yerine [enemy_dragon.GetName]'e binip uçup gitti!"

 agot_dragon_combat.0003.t:0 "Ejderha Ateşinin Uçuşu"

 agot_dragon_combat.0003.desc:0 "[battle_location.GetName] savaşı altımda sürerken [dragon_commander_in_battle.GetTitledFirstName] kuvvetlerini yakıp kül ediyorum; tam o sırada bir bulutun #S doğal olmayan#! bir şekilde hareket ettiğini görüyorum... Bu bir ejderha!\n\nEvet, yakından bakınca [dragon_in_battle.GetName]'in benden uzaklaşmak için tam hız gittiğini açıkça görüyorum! [dragonrider_in_battle.GetTitledFirstName] üzerinde olmalı; ama bu korkak, [enemy_dragon.GetName] ve benimle savaşmamaya karar vermiş!"

 agot_dragon_combat.0003.a:0 "[dragonrider_in_battle.GetSheHe|U] kaçamayacak!"

 agot_dragon_combat.0003.a.swift:0 "#P [enemy_dragon.GetNamePossessiveNoTooltip] çevikliği [dragonrider_in_battle.GetTitledFirstNameNoTooltip]'e yetişmenizi kolaylaştıracak#!"

 agot_dragon_combat.0003.a.slow:0 "#N [enemy_dragon.GetNamePossessiveNoTooltip] yavaşlığı [dragonrider_in_battle.GetTitledFirstNameNoTooltip]'e yetişmenizi zorlaştıracak#!"

 agot_dragon_combat.0003.a.enemy_swift:0 "#N [dragon_in_battle.GetNamePossessiveNoTooltip] çevikliği [dragonrider_in_battle.GetTitledFirstNameNoTooltip]'e yetişmenizi zorlaştıracak#!"

 agot_dragon_combat.0003.a.enemy_slow:0 "#P [dragon_in_battle.GetNamePossessiveNoTooltip] yavaşlığı [dragonrider_in_battle.GetTitledFirstNameNoTooltip]'e yetişmenizi kolaylaştıracak#!"

 agot_dragon_combat.0003.escape:0 "[dragon_in_battle.GetName] ve [dragonrider_in_battle.GetFirstName] savaş alanından kaçıyor."

 agot_dragon_combat.0003.b:0 "Bırak kaçsınlar."

 agot_dragon_combat.0003.escape.t:0 "[dragonrider_in_battle.GetShortUIName] çok hızlı uçuyor!"

 agot_dragon_combat.0003.escape.desc:0 "[dragonrider_in_battle.GetShortUIName] [dragon_in_battle.GetName]'e binerek takibinizden kaçmayı başarıyor!"

 CHANCE_OF_WINNING:0 "Kazanma Şansı"

 agot_dragon_combat.1001.t:0 "Ejderhaların Dansı"

 agot_dragon_combat.1001.defender_first_round_battle:0 "[dsc_defender_dragon.GetName] ve ben daha alçaklara dalıyoruz; [battle_location.GetName] savaşı tam birkaç metre altımızda sürerken gökyüzüne doğru dönüşe geçip bir grup düşman askerini daha alevler içinde bırakıyoruz.\n\nŞimdi dumanlar tüten alanın karşısında [dsc_attacker.GetFirstName]'i [dsc_attacker_dragon.GetName] üzerinde görüyorum; doğrudan üstümüze hücum ederken yüksek sesle kükreyor. Topuklarımın bir darbesi [dsc_defender_dragon.GetNameNoTooltip]'in kanatlarını harekete geçiriyor ve dans başlıyor.\n\n"

 agot_dragon_combat.1001.defender_first_round_siege:0 "[dsc_defender_dragon.GetName] ve ben yerden yukarıya fırlıyoruz; yukarıdan üstümüze dalışa geçmeye çalışan [dsc_attacker.GetFirstName]'i ve [dsc_attacker_dragon.GetName]'i atlatıyoruz. Hızlarının etkisiyle fazla ileri sürükleniyorlar ve aramızdaki mesafe bana dönüp bir sonraki geçişe hazırlanma fırsatı veriyor.\n\n[sc_attacker.GetTitledFirstNameNoTooltip] ve [dsc_attacker_dragon.GetFirstNameNoTooltip]'in de aynısını yaptığını görüyor ve dansın başladığını biliyorum.\n\n"

 agot_dragon_combat.1001.attacker_first_round_battle:0 "[dsc_defender_dragon.GetName]'in vuruşumun hemen altına dalışa geçtiğini görüyorum ve [dsc_attacker_dragon.GetName] ile birlikte sert bir dönüş yapmak zorunda kalıyoruz. [battle_location.GetName] savaşının uğultusu, düşmanımıza doğru dönüşe geçtiğimizde rüzgârın sesinde boğuluyor. Tam zamanında dönüp [dsc_defender_dragon.GetNameNoTooltip]'in bir grup askerimizi daha alevler içinde bıraktığını görüyorum ve topuklarımın bir darbesiyle [dsc_attacker_dragon.GetNameNoTooltip]'e arayı kapatmasını emrediyorum.\n\nDans başlıyor.\n\n"

 agot_dragon_combat.1001.attacker_first_round_siege:0 "[sieging_location.GetName] üzerine dalışa geçtiğimde [dsc_defender_dragon.GetName]'in havaya kıl payı kalktığını görüyorum; [dsc_attacker_dragon.GetFirstName]'den bir tırnak boyu farkla kurtuluyor. Hızlı bir zafer şansımız suya düşüyor; [dsc_defender_dragon.GetNameNoTooltip] ve [dsc_defender.GetNameNoTooltip] dönüşe geçip bir sonraki geçişe hazırlanıyor.\n\nDans başlıyor.\n\n"

 agot_dragon_combat.1001.wait_and_hope:0 "Şeyy, uhhh, hadi [my_foe.GetSheHe]'nin işi berbat etmesini umalım..."

 agot_dragon_combat.1001.tt.wait_and_hope:0 "Önce [my_foe.GetTitledFirstName]'in bir hata yapmasını umarak hiçbir şey yapmıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.wait_and_hope:0 "Bekleyişim, [my_foe.GetTitledFirstName] ve [my_foe_dragon.GetName]'e kendi planlarını kurmaları için bolca zaman vermekten başka işe yaramadı."

 agot_dragon_combat.1001.desc.opponent_response.wait_and_hope:0 "Tüm bunlar olurken, [my_foe.GetTitledFirstName] ve [my_foe_dragon.GetName] hiçbir şey yapmıyordu."

 agot_dragon_combat.1001.unsure_attack:0 "Uhhh, madem öyle #EMP yak#! hadi!"

 agot_dragon_combat.1001.tt.unsure_attack:0 "Ateş püskürten bir kertenkelenin üzerindesin... onu kullan"

 agot_dragon_combat.1001.desc.my_feedback.unsure_attack:0 "Ejderhamın nefesi [my_foe_dragon.GetNamePossessive] derisini sıyırıp geçiyor; öfkeli alevlerin korlaştırdığı koyu pul lekeleri bırakıyor."

 agot_dragon_combat.1001.desc.opponent_response.unsure_attack:0 "[my_foe_dragon.GetNamePossessive] nefesi çılgın bir savruluşla geldi ve [my_dragon.GetName]'in [my_dragon.Custom('GetDragonHerHis')] böğrünü kavurup geçti."

 agot_dragon_combat.1001.enthusiastic_onslaught:0 "[my_dragon.GetName], [my_foe_dragon.GetName]'in yapabileceğinden daha fazla hasar verebilir!"

 agot_dragon_combat.1001.tt.enthusiastic_onslaught:0 "Diş ve pençeyle [my_dragon.GetNameNoTooltip]'in [my_foe_dragon.GetNameNoTooltip]'i açgözlülükle parçalayabileceğine güveniyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.enthusiastic_onslaught:0 "[my_dragon.GetName] ve ben, elimizden gelen her türlü kesik, ısırık ve yakmayı deneyerek dosdoğru [my_foe_dragon.GetName] ve [my_foe.GetName]'e hücum ettik."

 agot_dragon_combat.1001.desc.opponent_response.enthusiastic_onslaught:0 "[my_foe_dragon.GetName] ve [my_foe.GetName] dosdoğru [my_dragon.GetName] ve bana hücum etti; ama ısırıkları ve alevleri odaktan yoksundu ve yüzeysel yaralardan fazlasını açamadı."

 agot_dragon_combat.1001.underbelly:0 "[my_foe_dragon.GetNamePossessive] karnı korumasız görünüyor..."

 agot_dragon_combat.1001.tt.underbelly:0 "Bir ejderhaya saldırmanın en bilindik yerini hedefliyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.underbelly:0 "[my_dragon.GetName] ve ben [my_foe_dragon.GetName]'in altına süzüldük, ardından dik bir dalışla yukarı fırladık; ejderhalarımız gökyüzünde büyük bir gümürtüyle çarpıştı. Ne yazık ki [my_foe_dragon.Custom('GetDragonHerHis')] derisinde tutunacak yer bulamadık."

 agot_dragon_combat.1001.desc.opponent_response.underbelly:0 "[my_foe_dragon.GetName] ansızın dalışa geçti ve bir anda [my_dragon.GetNamePossessive] karnına gideceğini anladım! Saldırıyı sezinleyerek [my_dragon.Custom('GetDragonHerHim')]'i yukarı çektim; darbe inerken onunla birlikte hareket ettim ve zarar görmeden geri süzülerek bir sonraki çarpışmaya hazırlandık."

 agot_dragon_combat.1001.tail_smash:0 "Şunlara kuyruğunla bir şaplak indir!"

 agot_dragon_combat.1001.tt.tail_smash:0 "Biraz... alışılmadık bir strateji izliyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.tail_smash:0 "[my_dragon.GetName] ve ben [my_foe_dragon.GetNamePossessive] kanadını ısıracakmış gibi hamle yapıp yön değiştirdik ve [my_foe_dragon.GetNamePossessiveNoTooltip] boynuna sağlam bir kuyruk darbesi indirdik!"

 agot_dragon_combat.1001.desc.opponent_response.tail_smash:0 "[my_foe_dragon.GetName] [my_dragon.GetNamePossessive] kanadını ısıracakmış gibi hızla ileri atıldı; ama ben darbeden kaçmak için hamle yaptığımda [my_foe_dragon.GetName] [my_dragon.GetNamePossessiveNoTooltip] boynuna sağlam bir kuyruk darbesi indirip bizi ayırdı ve ikimizi de sersemletti."

 agot_dragon_combat.1001.guard:0 "Saldırı anını bekleyip gözleyeceğiz."

 agot_dragon_combat.1001.tt.guard:0 "[my_dragon.GetName] ile birlikte karşı saldırı için mükemmel anı bekliyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.guard:0 "Darbeleri savuştururken pullarımız çarpışıp sürtündü; [my_foe_dragon.GetNamePossessive] dişleri en zırhlı derimize değdikçe kıvılcımlar saçıldı."

 agot_dragon_combat.1001.desc.opponent_response.guard:0 "[my_dragon.GetNamePossessive] dişleri [my_foe.GetTitledFirstNamePossessive] korumalı mevzisinden kayıp geçti; [my_dragon.Custom('GetDragonHerHis')] kükreyişi, hayal kırıklığıyla dolu öfkemi yankıladı."

 agot_dragon_combat.1001.probing_attack:0 "Hadi yüzeyi tırmalayalım, ne mal olduklarını görelim!"

 agot_dragon_combat.1001.tt.probing_attack:0 "Düşmanın tepkilerini ve zayıf noktalarını ölçmeyi hedefliyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.probing_attack:0 "Tırnaklarımız [my_foe_dragon.GetNamePossessive] pullarını sıyırıp geçtikten sonra havada hızla döndük; ejderhalar dans ederken hızlarını ölçmemize imkân verdiler. Derin kesikler yok, ama aydınlatıcı bir danstı."

 agot_dragon_combat.1001.desc.opponent_response.probing_attack:0 "Kanatlarımızı yokladılar; [my_dragon.GetNamePossessive] böğrünü tırmalayıp kendimizi açık etmemek için gökyüzünde dönmeye zorladılar. Şüphesiz bir yoklama hamlesiydi."

 agot_dragon_combat.1001.onslaught:0 "Tam yol ileri, ya zafer ya ölüm!"

 agot_dragon_combat.1001.tt.onslaught:0 "Savunmayı saldırıya feda eden tam kapsamlı bir hücum"

 agot_dragon_combat.1001.desc.my_feedback.onslaught:0 "Kör kütük ileri atıldık; [my_dragon.GetName] ateşin tıslamasına dönüşen bir kükreme saldı. Onlarla gümürtüyle çarpışmadan önce hava yanık pul kokuyordu. Kargaşa içinde kükremeler, pençe darbeleri ve hatta ben bile kendi silahımla bir vuruş yaptım."

 agot_dragon_combat.1001.desc.opponent_response.onslaught:0 "Kendi hücumları pervasız ama etkiliydi; iki ejderhanın ağırlığı kükreme ve çarpışan pençelerden oluşan bir kakofoniyle karşılaştı; ayrıldığımızda ikimiz de yara bere içindeydik."

 agot_dragon_combat.1001.surprise_attack:0 "Bunun geleceğini göremeyecekler!"

 agot_dragon_combat.1001.tt.surprise_attack:0 "Düşmanı hazırlıksız yakalamak için tasarlanmış beklenmedik bir hamle"

 agot_dragon_combat.1001.desc.my_feedback.surprise_attack:0 "Bulut örtüsüne süzülerek indik; gökyüzünden gelen ışığın bulutların arasından süzülüp biçimimizi gizlemesine izin verdik. Sonra bir tatar yayından çıkan ok gibi aşağıya saldırdık. [my_dragon.GetNamePossessive] dişleri kanadın hemen altındaki yumuşak ete saplandı ve acı dolu bir kükreme koptu."

 agot_dragon_combat.1001.desc.opponent_response.surprise_attack:0 "[my_foe_dragon.GetName] geri çekilip bulutların içine uçtu. Birkaç saniye onları göremedim ve tam o anda saldırdılar; [my_dragon.GetNamePossessive] böğrüne bir ısırık indirdiler."

 agot_dragon_combat.1001.taunt:0 "Hey [my_foe.GetFirstNameNoTooltip], sen buna uçmak mı diyorsun?"

 agot_dragon_combat.1001.tt.taunt:0 "Rakibinizi kızdırmak ve odaklarını bozmak için iğneleyici hakaretler savuruyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.taunt:0 "Alayım sanki pullarının altına işledi. Bir sonraki saldırıları kesinlikle gelişigüzel püskürtülen alevlerden ibaret beceriksiz bir karmaşa olacak."

 agot_dragon_combat.1001.desc.opponent_response.taunt:0 ""Hey!" Gökyüzünün öbür yanından bir ses duyuyorum. "Sen buna uçmak mı diyorsun?" diye haykırıyor [my_foe.GetFirstName], birbirimizin yanından geçerken. Bir ejderha düellosunda beni aşağılamakla vakit harcayacak kadar kibirli olması da pes doğrusu!"

 agot_dragon_combat.1001.go_for_the_gonads:0 "Alçaktan nişan al, isabetli nişan al!"

 agot_dragon_combat.1001.tt.go_for_the_gonads:0 "Son darbeyi indirmek için son derece hassas bir bölgeyi hedefliyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.go_for_the_gonads:0 "Dişlerimiz [my_foe_dragon.GetName]'in bacağının yumuşak etini buldu! [my_foe_dragon.Custom('GetDragonSheHe')|U] çığlık atıp bir an savruldu; kendini doğrultmadan önce [my_foe_dragon.Custom('GetDragonHerHis')] bacağını kurtardı, yere kan damlıyordu."

 agot_dragon_combat.1001.desc.opponent_response.go_for_the_gonads:0 "Düşmanlarımız arkamızdan korkakça bir saldırıya kalkışıp [my_dragon.GetNamePossessive] bacağından bir ısırık aldı! [my_dragon.Custom('GetDragonSheHe')|U] acı içinde uluyup savruldu; ama kurtulduğumuzda ve [my_dragon.Custom('GetDragonSheHe')] toparlandığında, [my_dragon.Custom('GetDragonHerHis')] öfkesinin biriktiğini hissedebiliyordum."

 agot_dragon_combat.1001.strict_guard:0 "Yanımıza yaklaşırlarsa onları parçalara ayıracağız!"

 agot_dragon_combat.1001.tt.strict_guard:0 "Hasarı en aza indirmek için son derece savunmacı bir duruş benimsiyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.strict_guard:0 "Kanatlarımızı içeri toplayarak her ısırığı ve pençeyi püskürttük; çıtırdayan diş sesleri havada yankılandı. [my_foe_dragon.GetName] hayal kırıklığıyla bir ateş püskürttü."

 agot_dragon_combat.1001.desc.opponent_response.strict_guard:0 "Saldırımız yalnızca zırhlı pullarının sert dış yüzeyine çarptı; her darbe boşa giden bir çabaydı. [my_dragon.GetName] hayal kırıklığıyla bir ateş püskürttü."

 agot_dragon_combat.1001.confident_attack:0 "Alevlerimiz onları canlı canlı pişirecek!"

 agot_dragon_combat.1001.tt.confident_attack:0 "Düşmanla ateşinizin tüm gücüyle cepheden çarpışıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.confident_attack:0 "Alevlerimiz ölümcül bir dansta iç içe geçti; ama bizimkiler daha güçlü çıktı, [my_foe_dragon.GetNamePossessive] içinden geçip kanatlarını kavurdu."

 agot_dragon_combat.1001.desc.opponent_response.confident_attack:0 "[my_foe.GetNamePossessive] ejderhası bir alev tufanı püskürttü; biz de kendi alevimizle karşılık vermek zorunda kaldık. Utanç verici bir şekilde bizimkiler yavaş yavaş yenildi ve [my_dragon.GetName] alevleri geri savururken [my_dragon.Custom('GetDragonHerHis')] kanatlarını kavurdu."

 agot_dragon_combat.1001.expert_onslaught:0 "Her hamle hesaplanmış, her darbe isabetli!"

 agot_dragon_combat.1001.tt.expert_onslaught:0 "Hataya yer bırakmayan titiz ve ustalıkla idman edilmiş bir hücum"

 agot_dragon_combat.1001.desc.my_feedback.expert_onslaught:0 "Sıkı bir döngüyle çevresini sardık; pençeler tırmalıyor, dişler bir cerrahın hassasiyetiyle saplanıyordu; püskürttüğümüz alev tufanı, eyerindeki [my_foe.GetName]'i kıl payı ıskaladı."

 agot_dragon_combat.1001.desc.opponent_response.expert_onslaught:0 "[my_foe.GetTitledFirstName] ve [my_foe_dragon.GetName] yaklaşıp [my_dragon.GetName]'e bir pençe darbesi ve hızlı bir ısırık indirdi, ardından beni ejderha ateşiyle yakmaya çalıştı!"

 agot_dragon_combat.1001.lightning_assault:0 "Gökten inen şimşek gibi vur!"

 agot_dragon_combat.1001.tt.lightning_assault:0 "Hem saldırmak hem kaçmak için hızlı bir yükselişin ardından gelen dalış"

 agot_dragon_combat.1001.desc.my_feedback.lightning_assault:0 "Bir şahin gibi dalışa geçtik, pençeler ve dişler gerili. [my_foe_dragon.GetName]'in sırtında hızlı bir tırmalama ve ardından gelen bir alev püskürmesi yanık yaralar bıraktı."

 agot_dragon_combat.1001.desc.opponent_response.lightning_assault:0 "Hızlıydılar, fazla hızlıydılar. [my_foe_dragon.GetName]'in pençeleri yanımızdan hızla geçerken derimizin üzerinde korlaşan çizgiler çizdi; arkalarında alevler savruluyordu."

 agot_dragon_combat.1001.tire_opponent:0 "Bırak kendilerini yorsunlar!"

 agot_dragon_combat.1001.tt.tire_opponent:0 "Rakibinizi yormayı hedefliyorsunuz; enerjilerini boşa harcamaları için kaçıp kıvırılıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.tire_opponent:0 "Her ateş püskürmesinden, her çılgın pençeden kaçındık. [my_foe_dragon.GetNamePossessive] kükremeleri giderek zayıfladı ve uçuşu gözle görülür şekilde ağırlaştı."

 agot_dragon_combat.1001.desc.opponent_response.tire_opponent:0 "[my_foe.GetName] ve [my_foe_dragon.GetName] gökyüzünde ustaca manevra yapıyor; bizi asla gevşememeye ve sürekli hareket hâlinde olmaya zorluyordu."

 agot_dragon_combat.1001.chomp:0 "#bold ÇAPURT#!"

 agot_dragon_combat.1001.tt.chomp:0 "Sen de #bold ÇAPURT#!"

 agot_dragon_combat.1001.motivate.generic:0 "Hadi [my_dragon.GetNameNoTooltip]!"

 agot_dragon_combat.1001.motivate.bond:0 "Cesaret, dostum! Bunu başarabiliriz!"

 agot_dragon_combat.1001.motivate.rude:0 "Savaşsana koca kertenkele, lanet olsun!"

 agot_dragon_combat.1001.motivate.authoritative:0 "Kazanmak #EMP zorundayız #! [my_dragon.GetNameNoTooltip]!"

 agot_dragon_combat.1001.motivate.sadistic:0 "Dillerimizde kanlarının tadını hisset!"

 agot_dragon_combat.1001.motivate.eccentric:0 "Şuradaki güzelliğe bir bakın!"

 agot_dragon_combat.1001.tt.motivate:0 "Yaralarına rağmen ejderhanızı yeniden canlandırmak için bir çağrı"

 agot_dragon_combat.1001.desc.my_feedback.motivate:0 "[my_dragon.GetNamePossessive] gözlerinde yeni bir ateş parladı; bir sonraki alev püskürmesi daha sıcaktı, [my_dragon.Custom('GetDragonHerHis')] darbeleri daha sertti."

 agot_dragon_combat.1001.desc.opponent_response.motivate:0 "[my_foe.GetFirstName]'in eğilip [my_foe_dragon.GetName] ile konuştuğunu görüyorum; ama söylenenleri duyamıyorum."

 agot_dragon_combat.1001.technique_from_legend:0 "Hadi dönmeyi deneyelim, bu iyi bir numara!"

 agot_dragon_combat.1001.tt.technique_from_legend:0 "Yalnızca masallarda duyduğunuz efsanevi bir teknik deniyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.technique_from_legend:0 "Tam bir efsaneden çıkma gösterişle, [my_dragon.GetName] [my_dragon.Custom('GetDragonHerHis')] ateşini püskürtürken döndük. Mükemmel uygulandı; hareketlerimize ayak uyduramayan [my_foe_dragon.GetName] şaşkın ve yaralı kaldı."

 agot_dragon_combat.1001.desc.opponent_response.technique_from_legend:0 "Freni boşalmış bir arabanın tekerleği gibi üstümüze uçtular; ateşleri hedefli ama öngörülemez yönlerden bizi kavuruyordu."

 agot_dragon_combat.1001.like_a_viper:0 "Çabuk vur, daha çabuk kaç!"

 agot_dragon_combat.1001.tt.like_a_viper:0 "Rakibi zayıflatmayı amaçlayan hızlı ve ölümcül darbeler"

 agot_dragon_combat.1001.desc.my_feedback.like_a_viper:0 "İçeri dışarı fırlayıp durduk; kuyruk, pençe ya da alevlerden her hızlı darbe şişlikler ve yaralar bıraktı. [my_foe_dragon.GetNamePossessive] hareketleri giderek ağırlaşmış görünüyor."

 agot_dragon_combat.1001.desc.opponent_response.like_a_viper:0 "İmkânsız görünen bir hızla [my_foe_dragon.GetName] menzilimizin içine girip çıktı; acı dolu bir mübadele oluşturacak şekilde üst üste küçük zaferler kazandı."

 agot_dragon_combat.1001.martial_voice:0 "Gel [my_dragon.GetNameNoTooltip]! Acıma gösterme!"

 agot_dragon_combat.1001.tt.martial_voice:0 "Bir askeri yönetir gibi [my_dragon.GetNameNoTooltip]'i yönlendirmek için yılların savaş deneyiminizi devreye sokuyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.martial_voice:0 "Komuta eden bir haykırışla her saldırıyı hassasiyetle koordine ettik. Düşmanımızın amansız saldırımıza karşı bir cevabı yoktu."

 agot_dragon_combat.1001.desc.opponent_response.martial_voice:0 "[my_foe.GetFirstName]'in [my_foe_dragon.GetName]'e emirler yağdırdığını görüyorum ve onların askeri deneyimini hatırlıyorum; burada, gökyüzünde bile yüzleşmesi ürkütücü bir düşman."

 agot_dragon_combat.1001.mocking_boast:0 "O koca kertenkele bir şeylerin eksikliğini mi kapatıyor!?"

 agot_dragon_combat.1001.tt.mocking_boast:0 "Rakibinizin dikkatini dağıtıp onu öfkelendirmeyi amaçlayan sözlü bir alay"

 agot_dragon_combat.1001.desc.my_feedback.mocking_boast:0 "Alayımız amacına ulaşmış görünüyor. [my_foe_dragon.GetName], efendisinin öfkesini sezmişçesine şiddetle savruluyor. Odaklarını yitirmeleri bize saldırı için bir açık yaratabilir!"

 agot_dragon_combat.1001.desc.opponent_response.mocking_boast:0 "[my_foe.GetFirstName] alay ve hakaretlerle kararlılığımızı sarsmaya çalıştı; kışkırtmaları burada boşa bir çaba olsa da, aralıksız gürültü [my_dragon.GetName]'i etkilemişe benziyor."

 agot_dragon_combat.1001.desert_warrior:0 "Şu kum... acaba..."

 agot_dragon_combat.1001.tt.desert_warrior:0 "Çöl savaşlarındaki uzmanlığınızı lehinize kullanıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.desert_warrior:0 "Hızla kayan kumların üzerine dalışa geçtik ve [my_foe.GetTitledFirstName]'i arkamızdan gelmeye kandırdık. Bir kumulun üzerinde zamanlamalı bir kanat çırpışıyla [my_foe.GetTitledFirstNameNoTooltip]'e doğru bir kum bulutu püskürttük! Şaşkına dönen [my_foe.GetHerHis] ejderhası, acı veren bulutun içinde yavaşladı; onları alevlerle yıkamak için geri döndüğümüzde, kum bulutunun cama dönüştüğünü ve onları daha da yaraladığını gördüm!"

 agot_dragon_combat.1001.desc.opponent_response.desert_warrior:0 "Alttaki kumların üzerine hızla dalışa geçtiler; [my_dragon.GetFirstNamePossessive] de takip etmek için [my_dragon.Custom('GetDragonHerHis')] kanatlarını topladı. Alev püskürmelerimiz alttaki kumları cama çevirdi, ama kesin bir darbe indiremedik. Derken [my_foe_dragon.GetNamePossessive] kanatlarından gelen bir rüzgâr üstümüze kum savurdu! Bulutun içinden kaçamadan kızgın sıcağa boğuluyoruz ve çevremizdeki kum taneleri cam kıymıklarına dönüşüyor! Kaçmayı başarmadan önce bedenlerimizi tırmalıyorlar."

 agot_dragon_combat.1001.jungle_stalker:0 "Ormanı kullanalım!"

 agot_dragon_combat.1001.tt.jungle_stalker:0 "Orman savaşı taktiklerinizi bu hava düellosuna uyarlıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.jungle_stalker:0 "Orman yırtıcılarının vur-kaç taktiklerini taklit edip onları avantajlı olduğumuz ağaçların içine çektik. Sürekli savunmada kalıyorlar, bir sonraki hamlemizi ya da darbemizi asla öngöremiyorlardı; ancak ormanın o bölümünü yakarak kurtulabildiler."

 agot_dragon_combat.1001.desc.opponent_response.jungle_stalker:0 "Biz ise tuzaklarına düştük; aşağıdaki ormanların içine çekilip birkaç darbe yedik, ardından ağaçlığı yakıp yeniden gökyüzüne kaçtık."

 agot_dragon_combat.1001.open_terrain_expert:0 "Açık gökyüzü parladığımız yerdir!"

 agot_dragon_combat.1001.tt.open_terrain_expert:0 "Geniş gökyüzünde üstünlük sağlamak için yerdeki açık arazi uzmanlığınızı kullanıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.open_terrain_expert:0 "Gökyüzünde de yerdeki gibi, alan kullanılacak bir araçtır. Bizi engelleyecek hiçbir engel olmadan yükselip dalışa geçtik, her saldırıyı işe yarar kıldık."

 agot_dragon_combat.1001.desc.opponent_response.open_terrain_expert:0 "[my_foe.GetFirstName] açık arazinin bilinen bir ustasıdır ve bunu büyük bir ustalıkla kullandı; karşı koyamadığımız sağlam darbeler indirdi."

 agot_dragon_combat.1001.rough_terrain_expert.rocky:0 "Şu kayalar tehlikeli görünüyor!"

 agot_dragon_combat.1001.tt.rough_terrain_expert.rocky:0 "[my_foe_dragon.GetFirstName]'i alttaki kayalara süreceksiniz"

 agot_dragon_combat.1001.desc.my_feedback.rough_terrain_expert.rocky:0 "Alçaldık ve keskin kayaları kıl payı sıyırıp geçtik; [my_foe_dragon.GetName] bizi takip eder etmez yukarı fırladık. Bu oyunu kullanarak döndük ve [my_dragon.GetNamePossessive] tüm ağırlığını [my_foe_dragon.GetName]'in üzerine indirdik, [my_foe_dragon.GetHerHis] bedenini keskin kayalara bastırdık. Bir kez. İki kez. Ejderhaların kükremesi ve taşların ezilme sesi dehşet verici. Ancak [my_foe.GetFirstName] eyerinden şanslı bir darbe indirip [my_dragon.GetName]'i geri çekilmeye zorlayınca kaçma şansını yakaladılar."

 agot_dragon_combat.1001.desc.opponent_response.rough_terrain_expert.rocky:0 "Ne var ki sonrasında biz alttaki kayalara sürüklendik; [my_foe_dragon.GetName]'in tüm ağırlığı bizi keskin kayaların üzerine bastırdı. Bir kez, iki kez, neredeyse üç kez yere ezildik; ama kendi silahımla [my_foe_dragon.GetNamePossessive] burnuna indirdiğim şanslı bir darbe, [my_dragon.GetName]'e kaçma fırsatı verdi."

 agot_dragon_combat.1001.rough_terrain_expert.boggy:0 "Bataklığın içine!"

 agot_dragon_combat.1001.tt.rough_terrain_expert.boggy:0 "Düşmanınızı kıstırmak için bataklığı kullanmayı deniyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.rough_terrain_expert.boggy:0 "Bir dizi son derece saldırgan hamleyle [my_foe.GetTitledFirstName] ve [my_foe_dragon.GetName]'i bataklığa doğru ittik; ağır yükleri çamura gömülüyordu. Ejderhalarımız arasında bir boğuşma başladı; [my_dragon.GetName], [my_foe_dragon.GetNamePossessiveNoTooltip] başını tekrar tekrar koyu çamurun altına daldırdı. Sonunda, biz de aşağı sürüklenmeyelim diye geri çekilmek zorunda kaldık."

 agot_dragon_combat.1001.desc.opponent_response.rough_terrain_expert.boggy:0 "[my_foe.GetTitledFirstName] ve [my_foe_dragon.GetName], bir dizi son derece saldırgan hamleyle bizi bataklığa doğru itti; [my_dragon.GetNamePossessive] ağır bedeni çamura gömülüyordu. Ejderhalar arasında bir boğuşma başladı; [my_dragon.GetNameNoTooltip] tekrar tekrar koyu çamurun altına daldırıldı. Ancak sonunda, [my_dragon.GetNameNoTooltip] sağlam bir tutuş yakalayıp onları neredeyse bizimle birlikte aşağı çekince geri çekildiler."

 agot_dragon_combat.1001.forest_fighter:0 "Bu ağaçlar müttefikimiz, onları kullanacağız!"

 agot_dragon_combat.1001.tt.forest_fighter:0 "Kendi alanınızın üstüne çıkmış durumdasınız; ormanı, düşmanınızın taklit edemeyeceği karmaşık hava manevraları için kullanıyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.forest_fighter:0 "Ağaçların arasında manevra yapıp beklenmedik anlarda ortaya çıkarak [my_foe_dragon.GetNamePossessive] kanadına ısırık darbeleri indirdik; o da ancak ormanın bir bölümünü yakıp kül ederek kaçabildi."

 agot_dragon_combat.1001.desc.opponent_response.forest_fighter:0 "[my_foe_dragon.GetName]'in peşine düşüp ormanın içine indik, ama [my_dragon.GetName] onların hızlı manevralarını taklit edemedi. [my_dragon.Custom('GetDragonSheHe')|U] kalın dallara çarptı; sonra öfkeyle ormanın bir bölümünü yakıp kül ederek kaçtı."

 agot_dragon_combat.1001.special_fallback:0 "Geri çekil, yeniden toparlan!"

 agot_dragon_combat.1001.tt.special_fallback:0 "Durumu yeniden değerlendirmek için taktiksel olarak geri çekiliyorsunuz"

 agot_dragon_combat.1001.desc.my_feedback.special_fallback:0 "Tam zamanında geri çekildik ve [my_dragon.GetNamePossessive] kanatlarını parçalayacak bir hamle ısırığından kıl payı kurtulduk."

 agot_dragon_combat.1001.desc.opponent_response.special_fallback:0 "Ardından kanatlarını neredeyse yakalayan bir hamle ısırığıyla saldırdık! Vahşetimizi gören [my_foe.GetName] ve [my_foe_dragon.GetName] geri çekildi — bu, zayıflığın apaçık bir işareti!"

 agot_dragon_combat.1001.desc.my_injury.none:0 "\n\n[my_dragon.GetNameNoTooltip] ve ben hiç yara almadan kurtulduk, "

 agot_dragon_combat.1001.desc.my_injury.light:0 "\n\n[my_dragon.GetNameNoTooltip] ve ben yalnızca hafif yaralar aldık, "

 agot_dragon_combat.1001.desc.my_injury.heavy:0 "\n\n[my_dragon.GetNameNoTooltip] ve ben yaralıyız, kanımız alttaki toprağa damlıyor, "

 agot_dragon_combat.1001.desc.my_injury.severe:0 "\n\n[my_dragon.GetNameNoTooltip] ve ben kötü durumdayız, buhar çıkaran kan seller hâlinde fışkırıyor, "

 agot_dragon_combat.1001.desc.my_injury.mortal:0 "\n\n[my_dragon.GetNameNoTooltip] ve ben ölümden kıl payı uzaktayız; çok sayıda yaramız neredeyse bizi gökten düşürüyor, "

 agot_dragon_combat.1001.desc.foe_injury.none:0 "[my_foe_dragon.GetNameNoTooltip] ve [my_foe.GetTitledFirstNameNoTooltip] ise yara bere içinde görünmüyor."

 agot_dragon_combat.1001.desc.foe_injury.light:0 "[my_foe_dragon.GetNameNoTooltip] ve [my_foe.GetTitledFirstNameNoTooltip] ise yalnızca yüzeysel yaralar taşıyor."

 agot_dragon_combat.1001.desc.foe_injury.heavy:0 "[my_foe_dragon.GetNameNoTooltip] ve [my_foe.GetTitledFirstNameNoTooltip] ise gözle görülür şekilde kanıyor."

 agot_dragon_combat.1001.desc.foe_injury.severe:0 "[my_foe_dragon.GetNameNoTooltip] ve [my_foe.GetTitledFirstNameNoTooltip] ise ağır yaralı."

 agot_dragon_combat.1001.desc.foe_injury.mortal:0 "[my_foe_dragon.GetNameNoTooltip] ve [my_foe.GetTitledFirstNameNoTooltip] ise apaçık ölüme mahkûm."

 agot_dragon_combat.1001.desc.chance_of_winning.near_zero:0 "\n\nİşler buraya kadar böyle gittiğine göre, kesinlikle sonumuzun geldiğini hissediyorum."

 agot_dragon_combat.1001.desc.chance_of_winning.minimal:0 "\n\nŞu an şansımız konusunda son derece karamsarım."

 agot_dragon_combat.1001.desc.chance_of_winning.low:0 "\n\n[my_foe.GetTitledFirstNameNoTooltip] kendinden emin görünüyor ve zaferden çok uzak olduğumuzdan korkuyorum."

 agot_dragon_combat.1001.desc.chance_of_winning.fair:0 "\n\nAlnımdaki teri hissedebiliyorum ve bu çatışmayı kaybettiğimizden korkuyorum."

 agot_dragon_combat.1001.desc.chance_of_winning.okay:0 "\n\nİşler kesinlikle daha iyi gidebilirdi, ama henüz bitmedi!"

 agot_dragon_combat.1001.desc.chance_of_winning.good:0 "\n\nİşler iyi gidiyor, ama gökyüzü hâlâ ikimizden birinin zaferine açık."

 agot_dragon_combat.1001.desc.chance_of_winning.high:0 "\n\n[my_foe.GetFirstNamePossessiveNoTooltip] güveninin sarsıldığını hissediyorum. [my_foe.GetSheHe|U] şimdi baskıyı mutlaka hissediyordur."

 agot_dragon_combat.1001.desc.chance_of_winning.very_high:0 "\n\n[my_dragon.GetNameNoTooltip]'in her hareketi, sonunda avına saldırmak üzere olan bir yırtıcının açlığıyla dolu görünüyor."

 agot_dragon_combat.1001.desc.chance_of_winning.excellent:0 "\n\n[my_dragon.GetNameNoTooltip] ve ben aynı ritimdeyiz; bu çatışma neredeyse kesin olarak bizim zaferimizle bitecek."

 agot_dragon_combat.1001.desc.chance_of_winning.near_certain:0 "\n\nBu çatışma kesinlikle bitmek üzere; [my_foe.GetTitledFirstName] neredeyse gökten düşüyor."

 agot_dragon_combat.wound_dragon.limit:0 "[wounded_dragon.GetName] daha fazla yaralanamaz."

 agot_dragon_combat.wound_dragon.1:0 "[wounded_dragon.GetName] artık $trait_dragon_wounded_1$."

