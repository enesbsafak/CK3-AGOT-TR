 agot_dragon_combat.1003.t:0 "Kıyametin Dansı!"

 agot_dragon_combat.1003.desc.sudden_strike:0 "Kaderlerimiz rüzgâr kadar ani değişti. Bir saniye [my_foe.GetTitledFirstName] savunmasız görünüyor, yenilgiden anlar uzakta. Sonraki saniye [my_foe_dragon.GetName]'in [my_foe_dragon.Custom('GetDragonHerHis')] boynunu savurduğunu ve gözlerimin önünde kocaman bir ağız açıldığını görüyorum.\n\nDaha yeni açılan çenelerin içine bakıp kapanmadan önce beni karşılamaya yükselen ölümün sıcak nefesini hissetmeye vakit buluyorum ve düşünüyorum..."

 agot_dragon_combat.1003.a.sudden_strike:0 "İşte böyle sona eriyor."

 agot_dragon_combat.1003.f.sudden_strike:0 "[my_foe_dragon.GetName] tarafından yutuluyorsunuz"

 agot_dragon_combat.1003.desc.dragonfire:0 "Ejderhalara binip savaşa gittim. İnsanların yanmasının ne demek olduğunu bilirim. Ama bu ateşin bu tarafında olacağımı hiç düşünmezdim.\n\nBir kükreme ve sıcaklık dalgasıyla [my_foe_dragon.GetName]'in [my_foe_dragon.Custom('GetDragonHerHis')] boğazını açtığını görüyorum; ejderha ateşinin ani yangını hem [my_dragon.GetName] hem de bana doğru fırlıyor. Kaçınamayacak kadar büyük. Engelleyemeyecek kadar yakın. İşe yaramayacağını bile bile içgüdüsel olarak kollarımı kaldırıyor ve çığlık atıyorum."

 agot_dragon_combat.1003.a.dragonfire:0 "#EMP AGGGGHHHHHHHHHH!!!!#!"

 agot_dragon_combat.1003.f.dragonfire:0 "Siz ve [my_dragon.GetName] neredeyse kesinlikle yanıp kül olacaksınız. Yaşarsanız, yere düştükten sonra ıstırap içinde olacaksınız."

 agot_dragon_combat.1003.desc.driven_to_ground:0 "[my_foe_dragon.GetNamePossessive] tüm ağırlığının [my_dragon.GetName]'in üzerine çarpması, üstüme bir ev yıkılmış gibi beni eyerimde sarsıyor. Yere — sertçe — itilirken [my_dragon.GetNameNoTooltip] boşuna bir çığlıkla itiraz ediyor.\n\nİki ejderhanın ortak ağırlığı altında [my_dragon.Custom('GetDragonHerHis')] kanadının kırıldığını duyuyorum. Başımı kaldırınca [my_foe_dragon.GetNameNoTooltip]'in devasa gövdesini görüyorum; [my_dragon.GetNameNoTooltip]'in kırılmış bedeninin üzerinde bir tanrı gibi yükseliyor ve #italic yutmaya #! başlıyor!"

 agot_dragon_combat.1003.a.driven_to_ground:0 "Bu eyerden kurtulmalıyım!"

 agot_dragon_combat.1003.f.driven_to_ground:0 "Elinizden gelenin en iyisini yaparak kaçmaya çalışıyorsunuz!"

 agot_dragon_combat.1003.desc.disemboweled:0 "Bulutların arasında [my_foe_dragon.GetName]'i sezdiğimi sanıyorum, besbelli hazırlanıyor... hayır, orada!\n\nÇok geç.\n\n[my_foe_dragon.GetNameNoTooltip] bir şimşek gibi ve tıpkı onun gibi durdurulamaz şekilde üstümüze fırlıyor. [my_foe_dragon.Custom('GetDragonSheHe')|U] [my_dragon.GetNamePossessive] korumasız karnını hedefliyor ve [my_dragon.Custom('GetDragonHerHis')] midesinden koca bir parça koparıyor, [my_dragon.Custom('GetDragonHerHim')]'i gökyüzünün ortasında deşiyor! Son bir kükremeyle ikimiz de düşüyoruz; rüzgâr yanımızdan hızla geçerken ejderha kanı ve organları gökyüzüne savruluyor."

 agot_dragon_combat.1003.a.disemboweled:0 "Kahretsin kahretsin kahretsin kahretsin kahretsin"

 agot_dragon_combat.1003.f.disemboweled:0 "Şu zemin ürkütücü bir hızla yaklaşıyor..."

 agot_dragon_combat.1003.desc.eviscerated:0 "Zarafet ve şıklıktan eser taşımadan, [my_foe.GetTitledFirstName] [my_foe_dragon.GetName]'i dosdoğru üstümüze sürüyor! [my_dragon.GetName] kaçmaya, ardından savunmak için [my_dragon.Custom('GetDragonHerHis')] kanatlarını kaldırmaya çalışsa da, her biri diş ve pençeyle parçalanıyor!\n\nBir kanat koparılırken [my_dragon.GetNameNoTooltip] ıstırap içinde kükriyor; ama [my_foe_dragon.GetName] bırakmıyor, parçalayıp didiklemeye devam ediyor. Boynunu savurarak [my_foe_dragon.Custom('GetDragonSheHe')] [my_dragon.GetNamePossessiveNoTooltip] boynuna vahşi bir ısırık geçiriyor ve son bir çığlığın ardından [my_foe_dragon.Custom('GetDragonSheHe')], [my_dragon.Custom('GetDragonHerHis')] kafasını gözlerimin önünde koparıyor!"

 agot_dragon_combat.1003.a.eviscerated:0 "Hayır! Yapamazsın! Lütfen!"

 agot_dragon_combat.1003.f.eviscerated:0 "Siz ve [my_dragon.GetName] ikiniz de [my_foe_dragon.GetName] tarafından yutuluyorsunuz"

 agot_dragon_combat.1003.desc.chomp:0 ""Sakin ol [my_dragon.GetName]! Daha hayatta kalabiliriz!" diye bağırıyorum; bulutların arasında manevra yaparken rüzgâr sesimi yutuyor. Birkaç kez [my_foe_dragon.GetName]'in gölgesini gördüğümü sanıyorum, ama yaklaştıkça hayalet dağılıyor. Yine de canavarın soluk alıp verişini duyabiliyorum. Kanat çırpışlarını. Gerçek bir ejderhanın boğuk, gırtlaktan gelen sesini.\n\nBedenimdeki ilkel bir yan bunun ne olduğunu anlıyor. İnsanların henüz hayvandan farksız olduğu çağlarda bilenmiş içgüdülerin derin, içten gelen çığlığı. Avlanıyoruz.\n\nDüşünceyi noktalar gibi, önümde bir gölge daha beliriyor. Bir an bunun da diğerleri gibi hayal olmasını umuyorum; derken karşımızda devasa bir biçim beliriyor, ağzı [my_dragon.GetName] ile beni bütün olarak yutacak kadar açık."

 agot_dragon_combat.1003.a.chomp:0 "Çığlık atacak vaktiniz bile olmuyor."

 agot_dragon_combat.1003.f.chomp:0 "Siz ve [my_dragon.GetName] ikiniz de [my_foe_dragon.GetName] tarafından çiğnenip yutuluyorsunuz"

 agot_dragon_combat.1004.t:0 "Zafer!"

 agot_dragon_combat.1004.desc.sudden_strike:0 "Planım işe yarıyor! [my_foe.GetName] bunun geleceğini hiç görmedi. Bir saniye [my_dragon.GetName] ve ben savunmasız görünüyoruz ve [my_foe_dragon.GetName] öldürücü darbeyi indirmek için üstümüze geliyor. Sonraki saniye [my_dragon.GetNameNoTooltip], [my_foe_dragon.GetNamePossessiveNoTooltip] omzunun üzerinden [my_foe_dragon.Custom('GetDragonHerHis')] boynunu dolaşıp arkadaki korumasız binicinin üzerine savruluyor.\n\n[my_dragon.GetNamePossessiveNoTooltip] kocaman ağzını açıp [my_foe.GetNameNoTooltip]'in üzerine kapanıyor ve [my_foe.GetHerHim]'i yutuyor!"

 agot_dragon_combat.1004.a.sudden_strike:0 "Ejderha artık kolay lokma olmalı!"

 agot_dragon_combat.1004.f.sudden_strike_survived:0 "[my_foe_dragon.GetName] kaçmayı başarıyor"

 agot_dragon_combat.1004.f.sudden_strike_died:0 "[my_foe_dragon.GetName], [my_dragon.GetName]'in ikinci darbesiyle hızla yere seriliyor"

 agot_dragon_combat.1004.desc.dragonfire:0 "Bir kükreme ve sıcaklık dalgasıyla [my_dragon.GetName]'in tüm muhalefeti süpürdüğünü hissediyorum; [my_dragon.Custom('GetDragonHerHis')] açık boğazı, [my_foe_dragon.GetName] ve [my_foe.GetTitledFirstName]'e tek bir dev alev yumağı püskürtüyor. Kaçınamayacak kadar yakın. Engelleyemeyecek kadar büyük. Yangınla yutulan rüzgârı yankılayan bir tatmin dalgasıyla, [my_foe_dragon.GetNameNoTooltip] ve [my_foe.GetTitledFirstNameNoTooltip]'in [my_dragon.GetNameNoTooltip] tarafından kül edildiğini görüyorum."

 agot_dragon_combat.1004.a.dragonfire:0 "Seni yakaladım!"

 agot_dragon_combat.1004.f.dragonfire_both:0 "[my_foe.GetName] ve [my_foe_dragon.GetName] ikisi de [my_dragon.GetName] tarafından yakılıp kül ediliyor"

 agot_dragon_combat.1004.f.dragonfire_dragon:0 "[my_foe_dragon.GetName], [my_dragon.GetName] tarafından ölümcül şekilde yaralanıyor; ama [my_foe.GetName] kaçarken kurtulmayı başarıyor"

 agot_dragon_combat.1004.f.dragonfire_rider:0 "[my_foe_dragon.GetName], [my_dragon.GetName] tarafından yakılıp kül ediliyor; ama [my_foe.GetName] süzülerek kurtulmayı başarıyor"

 agot_dragon_combat.1004.f.dragonfire_neither:0 "[my_foe.GetName] ve [my_foe_dragon.GetName] korkunç şekilde yanıyor; ama kıl payı kaçmayı başarıyorlar"

 agot_dragon_combat.1004.desc.driven_to_ground:0 "[my_dragon.GetNamePossessive] tüm ağırlığının [my_foe_dragon.GetName]'in üzerine çarpması beni eyerimde sarsıyor. Düşmanlarımızı yere — sertçe — ittiğimizde [my_foe_dragon.GetName] boşuna bir çığlıkla itiraz ediyor.\n\nİki ejderhanın ortak ağırlığı altında [my_foe_dragon.GetNamePossessiveNoTooltip] kanadının kırıldığını doyurucu bir çıtırtıyla duyuyorum. Düşmanlarımızın kırılmış bedeninin üzerinde bir tanrı gibi yükselirken [my_foe_dragon.GetNameNoTooltip]'in biçimine aşağıdan bakıyorum ve [my_dragon.GetNamePossessiveNoTooltip] açlığının [my_dragon.Custom('GetDragonHerHis')]'i öldürmeye ittiğini hissediyorum."

 agot_dragon_combat.1004.a.driven_to_ground:0 "İşte böyle, [my_dragon.GetName]! Bitir işini!"

 agot_dragon_combat.1004.f.driven_to_ground_died:0 "[my_foe.GetFirstName], [my_dragon.GetNameNoTooltip]'in şiddetli ısırıkları arasında yutuluyor"

 agot_dragon_combat.1004.f.driven_to_ground_escaped:0 "[my_foe.GetFirstName], [my_dragon.GetNameNoTooltip]'in yutucu ısırıklarından kaçmak için debeleniyor"

 agot_dragon_combat.1004.desc.disemboweled:0 "Bulutları siper alarak [my_foe_dragon.GetName]'i seziyorum, besbelli bizi beklemiyorlar. Göz kamaştırıcı bir hızla hücum ederken [my_foe.GetFirstName] yüzünü bize dönüyor.\n\nÇok geç.\n\n[my_dragon.GetName] bir şimşek gibi ve tıpkı onun gibi durdurulamaz şekilde fırlıyor. [my_foe_dragon.Custom('GetDragonSheHe')|U] [my_foe_dragon.Custom('GetDragonHerHis')] açıkta kalan karnını korumaya çalışıyor; ama zamanında tepki veremiyor ve [my_foe_dragon.Custom('GetDragonHerHis')] midesinden koca bir parça koparılıyor. [my_foe_dragon.Custom('GetDragonHerHim')]'i gökyüzünün ortasında deştik! İkisi de arkamızda yere düşerken yankılanan bir kükreme duyuyorum; [my_dragon.GetNamePossessive] ağzından yanımızdan ejderha kanı ve organlar savruluyor."

 agot_dragon_combat.1004.a.disemboweled:0 "Yer onların ikisini de alsın!"

 agot_dragon_combat.1004.f.disemboweled_died:0 "[my_foe_dragon.GetName] öldü ve [my_foe.GetName] de ardından gitmeye mahkûm."

 agot_dragon_combat.1004.f.disemboweled_escaped:0 "[my_foe_dragon.GetName] öldü; [my_foe.GetName] düşüşten kıl payı kurtuluyor"

 agot_dragon_combat.1004.desc.eviscerated:0 "Savunmadan eser taşımadan, [my_dragon.GetName] dosdoğru [my_foe_dragon.GetName]'in üzerine dalıyor! [my_foe_dragon.GetNameNoTooltip] kaçmaya, ardından savunmak için [my_foe_dragon.Custom('GetDragonHerHis')] kanatlarını kaldırmaya çalışsa da, her biri dişlerimiz ve pençelerimizle parçalanıyor!\n\nBir kanat koparılırken [my_foe_dragon.GetNameNoTooltip] ıstırap içinde kükriyor; ama [my_dragon.GetNameNoTooltip] bırakmıyor, parçalayıp didiklemeye devam ediyor. Boynunu savurarak [my_dragon.Custom('GetDragonSheHe')] [my_foe_dragon.GetNamePossessiveNoTooltip] boynuna vahşi bir ısırık geçiriyor ve yaratıktan son bir çığlık yükseldikten sonra [my_dragon.Custom('GetDragonSheHe')], [my_foe_dragon.Custom('GetDragonHerHis')] kafasını koparıveriyor!"

 agot_dragon_combat.1004.a.eviscerated:0 "Parçala! Sök! Yut!"

 agot_dragon_combat.1004.f.eviscerated:0 "[my_dragon.GetName], [my_foe.GetTitledFirstName] ve [my_foe_dragon.GetName]'i ikisini de yutuyor"

 agot_dragon_combat.1004.desc.chomp:0 "[my_foe.GetFirstName] için gerçekten hiç umut yoktu. [my_foe_dragon.GetName], benim kendi ejderham [my_dragon.GetName]'in yarısı kadar bile değil ve [my_foe.GetSheHe], cepheden yapılacak tam bir saldırının intihar olacağını bilerek bulutların arasında sinsice dolaşmayı tercih ediyor.\n\nBirkaç kez avımızın gölgesini gördüğümü sanıyorum, ama yaklaştıkça hayalet dağılıyor.\n\nUçarken bedenimdeki ilkel bir yan bunun ne olduğunu anlıyor. İnsanların henüz hayvandan farksız olduğu çağlarda bilenmiş içgüdülerin derin, içten gelen çığlığı. Biz yırtıcıyız ve ejderha bizim avımız.\n\nDüşünceyi noktalar gibi, önümde bir gölge daha beliriyor. Bir an bunun da diğerleri gibi hayal olmasını umuyorum; derken küçük biçim tam karşımızda beliriyor! [my_dragon.GetNameNoTooltip]'e emir vermeme bile gerek kalmıyor. [my_dragon.Custom('GetDragonHerHis')|U] ağzını açıyor ve tek bir ısırıkla [my_foe_dragon.GetName] ile [my_foe.GetName] bütün olarak yutuluyor."

 agot_dragon_combat.1004.a.chomp:0 "Çığlık atacak vakitleri bile olmadı."

 agot_dragon_combat.1004.f.chomp:0 "[my_foe.GetName] ve [my_foe_dragon.GetName] ikisi de [my_dragon.GetName] tarafından çiğnenip yutuluyor"

 agot_dragon_combat.1004.chomp.t:0 "[my_dragon.GetNameNoTooltip] Tadını Seviyor"

 agot_dragon_combat.1010.t:0 "İntikam Kanatları"

 agot_dragon_combat.1010.desc.commander:0 "İzciler soluk soluğa atlarını sürüyor; haberleri mızrak ucu kadar keskin. Gökyüzünün belası [enemy_dragonrider.GetTitledFirstName], [battle_location.GetName] üzerinde görülmüş. Böyle bir fırsat endi gelir: Şimdi vur, düşmanım bulutlardan aşağı yuvarlansın, [enemy_dragonrider.GetHerHis] canavarı kırılsın, [enemy_dragonrider.GetHerHis] adamları dağılsın.\n\nYine de her ejderha düellosu ölümle bir danstır. Gökyüzüne çıkarsam, gök ateş ve öfkeyle alevlenecek ve ikimizden yalnızca biri sağ inebilecek."

 agot_dragon_combat.1010.a.commander:0 "Gökyüzüne çıkacağım — bu iş şimdi bitiyor."

 agot_dragon_combat.1010.desc.knight:0 "İzcilerin haberi ağırdır: [enemy_dragonrider.GetTitledFirstName] [battle_location.GetName] üzerinde görülmüş; [enemy_dragonrider.GetHerHis] ejderhası, ufukta toplanan bir fırtına gibi tepelerde çömelmiş. Böyle bir düşman yalnızca kılıçlarla boy ölçüşemez. Tüm gözler ordumuzdaki ejderha binicisi [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetTitledFirstName]'e çevriliyor — yalnızca onların ateşi ateşe karşılık verebilir, yalnızca onların kanatları gökyüzünün dehşetini geri püskürtebilir.\n\nOnlar havalanırsa, göklerin ta kendisi yanacak."

 agot_dragon_combat.1010.a.knight:0 "[dragonrider_in_battle.GetTitledFirstNameNoTooltip] uçmak zorunda — bu tehditle yalnızca onlar yüzleşebilir."

 agot_dragon_combat.1010.desc.lord:0 "[home_location.GetNameNoTooltip] surlarından bir çığlık yükseliyor: [enemy_dragonrider.GetTitledFirstName] topraklarıma iniyor; [enemy_dragon_in_battle.GetTitledFirstNamePossessive] gölgesi ocak ve salona uzun ve kara bir şekilde düşüyor. Halkım, hiçbir mızrağın ve okun onları ejderha ateşinin gazabından koruyamayacağını bilerek dehşet içinde dağılıyor.\n\n[enemy_dragonrider.GetHerHim] ile yüzleşmek için yalnızca ben havalanabilirim. Kanatlanırsam, [home_location.GetNameNoTooltip] üzerindeki gökyüzü ateşle kükreyecek ve ikimizden yalnızca biri onu yeniden görecek."

 agot_dragon_combat.1010.a.lord:0 "Evimi savunacağım — gökyüzüne!"

 agot_dragon_combat.1010.b.lord:0 "Hayır... yanacaksa duvarlar yansın, ben değil."

 agot_dragon_combat.1010.desc.courtier:0 "Sarayda panik dalga dalga yayılıyor; [enemy_dragonrider.GetTitledFirstName]'in gölgesi üzerimize düşüyor. [enemy_dragonrider.GetHerHis|U] ejderhası [enemy_dragon_in_battle.GetTitledFirstName], [home_location.GetNameNoTooltip]'in çevresinde dönüyor; ateş çatıları yalıyor, avlularda çığlıklar yankılanıyor. Hiçbir şövalye, hiçbir ordu, hiçbir sur böyle bir düşmana karşı duramaz.\n\nYine de tüm umut kaybolmuş değil. Sarayımdakilerden biri, [dragonrider_in_battle.GetTitledFirstName], kendine ait bir ejderhaya biniyor. [dragonrider_in_battle.GetSheHe] havalanırsa, gökyüzü gök gürültüsü ve alevle yarılacak ve bu çatışmadan yalnızca biri sağ çıkacak."

 agot_dragon_combat.1010.a.courtier:0 "[dragonrider_in_battle.GetTitledFirstNameNoTooltip]'i çağırın — ateşe ateşle karşılık versinler."

 agot_dragon_combat.1010.b.courtier:0 "Dayanmalıyız — gökyüzü bugün [enemy_dragonrider.GetHerHis]."

 agot_dragon_combat.1010.a.tt:0 "[enemy_dragonrider.GetTitledFirstNameNoTooltip]'e karşı bir ejderha düellosuna çıkacaksınız."

 agot_dragon_combat.1010.a.tt.not_me:0 "[dragonrider_in_battle.GetTitledFirstNameNoTooltip], [enemy_dragonrider.GetTitledFirstNameNoTooltip]'e karşı bir ejderha düellosuna çıkacak."

 agot_dragon_combat.1010.b:0 "Belki başka bir zaman."

