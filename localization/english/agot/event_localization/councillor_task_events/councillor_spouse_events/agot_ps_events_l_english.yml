 councillor_personal_steward_martial.0002.message:0 "Ordu Teşkilatı Desteği"

 councillor_personal_steward_martial.0003.message:0 "İlham Veren [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U]"

 councillor_personal_steward_martial.0004.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] Şövalyeliği Teşvik Ediyor"

 councillor_personal_steward_martial.0005.message:0 "Paralı Asker Müzakerelerinde Destek"

 councillor_personal_steward_martial.0006.message:0 "Bana Göz Kulak Olmak"

 councillor_personal_steward_martial.0007.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] Yaraları Sarıyor"

 councillor_personal_steward_martial.0008.message:0 "Yıldırıcı Varlık"

 councillor_personal_steward_martial.0009.message:0 "Çatışma Talimi"

 councillor_personal_steward_martial.1001.t:0 "Özel Kâhya: Turnuva Günü"

 councillor_personal_steward_martial.1001.desc:0 "Güneş parlıyor ve köylüler benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] tarafından düzenlenen turnuvada ortalıkta dolaşıyor. [councillor.GetTitledFirstName] turnuvayı onların şerefine ilan ettiğinde tüm $knight_culture_player_plural_no_tooltip_lowercaselarım tezahürat yapıyor ve ilk kez sadece oturup izliyorum.\n\nYine de bütün bir turnuva gününü tahta yapışık geçirmeyeceğim!"

 councillor_personal_steward_martial.1001.a:0 "Ben de benim $knight_culture_player_plural_no_tooltip_lowercaselarıma kadeh kaldırıyorum!"

 councillor_personal_steward_martial.1001.commanders:0 "Her $knight_culture_player_no_tooltip_lowercase$"

 councillor_personal_steward_martial.1001.b:0 "Bu, [child.GetFirstNameNoTooltip]'e birkaç ipucu vermek için kusursuz bir fırsat!"

 councillor_personal_steward_martial.1001.b.education_tt:0 "[child.GetFirstNamePossessiveNoTooltip] askerî eğitimini ilerletiyorum"

 councillor_personal_steward_martial.1001.c:0 "Bu gün #EMP bizim#! şerefimiz için, canım!"

 councillor_personal_steward_martial.1002.t:0 "Özel Kâhya: Benim Adıma Hareket"

 councillor_personal_steward_martial.1002.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], [councillor.GetHerHis] şeref muhafızıyla birlikte alemi gezmek için kayda değer zaman harcıyor. [councillor.GetSheHe]'in benim adıma çözebileceği pek çok mesele var ve [councillor.GetTitledFirstName]'in [councillor.GetHerHim] ile getirdiği askerî varlık, benim hüküm hakkımın sağlam bir hatırlatıcısı."

 councillor_personal_steward_martial.1002.a:0 "Benim [councillor.GetTitleAsNameNoTooltip] ve ben alemin savunması için hazır bekliyoruz!"

 councillor_personal_steward_martial.1002.b:0 "İnsanların gerektiği gibi yaltaklandığından emin ol, canım."

 councillor_personal_steward_martial.1002.c:0 "Herkes benden hem korkmalı hem de ayaklarımın dibinde tapınmalı, [councillor.GetFirstNameNoTooltip]!"

 councillor_personal_steward_martial.1003.t:0 "Özel Kâhya: Bir Onur Meselesi"

 councillor_personal_steward_martial.1003.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('councillor'))]. [councillor.GetSheHe]'in tartışmak istediği şey [attacker_vassal.GetTitledFirstName] ile [defender_vassal.GetTitledFirstName] arasındaki çatışma.\n\n"Kavgaları onursuzca ve alemine utanç getiriyorlar. Bırak onları ben halledeyim. Onları barışa zorlayabileceğimi biliyorum.""

 councillor_personal_steward_martial.1003.a:0 "Ne pahasına olursa olsun çözülmesini sağla."

 councillor_personal_steward_martial.1003.b:0 "Hayır, kimin kazanacağını görmek istiyorum!"

 councillor_personal_steward_martial.1003.b.tt:0 "[attacker_vassal.GetFirstNameNoTooltip] ve [defender_vassal.GetFirstNameNoTooltip] savaşlarına devam ediyor"

 councillor_personal_steward_martial.1003.c:0 "Oh, yapabileceğine eminim, canım."

 councillor_personal_steward_martial.1003.c.unlock_tt:0 "Bu seçenek, [councillor.GetFirstNamePossessiveNoTooltip] stratejik dehası sayesinde mümkün"

 councillor_personal_steward_martial.1004.t:0 "Özel Kâhya: Muhafız"

 councillor_personal_steward_martial.1004.desc:0 "Benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))]'imin neden avluda bana "büyük bir armağan" sunmak istediğini biraz şaşkınlıkla karşılıyorum. Ne var ki [councillor.GetTitledFirstName] bir grup askerin dizilmesini emrettiğinde kısa sürede anlıyorum. "Kendi topraklarımdan toplanmış, sana hizmet etmeye hazır eksiksiz bir alay."\n\nBu #EMP gerçekten de#! büyük bir armağan!"

 councillor_personal_steward_martial.1004.a:0 "Orduyu güçlendirmek için daha fazla asker!"

 councillor_personal_steward_martial.1004.b:0 "Benim özel muhafızlarım olarak hizmet edecekler."

 councillor_personal_steward_martial.1005.t:0 "Özel Kâhya: İz Bırakmak"

 councillor_personal_steward_martial.1005.desc:0 "[vassal.GetTitledFirstName] bana haraç ödemek için [capital.GetNameNoTier]'e geliyor. Ne var ki [councillor.GetTitledFirstName], askerî bir gösterinin sürekli sadakati güvence altına alabileceğini öne sürüyor.\n\n"Ezici gücünüzü görmek, aklına ihanet geçen herkesi bir kez daha düşündürür," diye belirtir benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))]."

 councillor_personal_steward_martial.1005.a:0 "Evet, [vassal.GetFirstNameNoTooltip] nereye dönse asker görecek!"

 councillor_personal_steward_martial.1005.a.tt:0 "[vassal.GetFirstNameNoTooltip] [dread|E]'e karşı daha duyarlı hale geliyor"

 councillor_personal_steward_martial.1005.b:0 "Düzenli bir geçit töreni yeterli olur."

