 agot_add_patronage_personal_steward_education_points_effect.t:0 "Çocuk Özel Kâhyanın Öğretiminden Faydalanıyor"

 agot_add_patronage_personal_steward_education_points_effect.desc:0 "[councillor.GetTitledFirstNamePossessive] öğretimi sayesinde benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('patronage_student'))] [patronage_student.GetTitledFirstName]'in iyi bir [education|E] alması daha olası."

 add_patronage_personal_steward_education_points_child_effect.desc:0 "[councillor.GetTitledFirstNamePossessive] öğretimi sayesinde [patronage_student.Custom('GetDaughterSon')] [patronage_student.GetTitledFirstName]'in iyi bir [education|E] alması daha olası."

 councillor_personal_steward_learning.2601.t:0 "Özel Kâhya: İleri Eğitim"

 councillor_personal_steward_learning.2601.not_scholarly.desc:0 ""Ara sıra bir kitap okumak sana zarar vermez," der bana sık sık çalışkan [councillor.GetTitledFirstName]; benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))]. [councillor.GetSheHe|U], başlamak için yardıma ihtiyacım olursa bana öğretmenlik yapmayı teklif etti."

 councillor_personal_steward_learning.2601.scholarly.desc:0 "Benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] beni ne zaman bir cildin üzerine eğilmiş bulsa, [councillor.GetSheHe] gözle görülür biçimde heyecanlanır.\n\n"Çalışmaların için biraz yardım ister miydin? Fikir alışverişi yapacak biri ya da belki birkaç yeni cilt? Geçenlerde [ROOT.Char.Custom('education_conversation_subject')] hakkında mükemmel bir inceleme içeren bir cilt edindim!""

 councillor_personal_steward_learning.2601.a:0 "Evet, rehberliğini memnuniyetle kabul ederim."

 councillor_personal_steward_learning.2601.b:0 "[tutoring_student_1.GetTitledFirstNameNoTooltip] benimden daha çok senin yardımına ihtiyaç duyuyor."

 councillor_personal_steward_learning.2601.c:0 "Onun yerine [tutoring_student_2.GetTitledFirstNameNoTooltip]'e ders vermelisin."

 councillor_personal_steward_learning.2601.d:0 "Kendi çalışmalarına odaklanmalısın."

 agot_councillor_personal_steward_learning_2601_tutoring_effect.critical_success:0 "[THIS.Char.GetTitledFirstNamePossessiveOrMyNoTooltip|U]'in [THIS.Char.Custom('education_focus')] konusundaki kavrayışı büyük ölçüde artıyor"

