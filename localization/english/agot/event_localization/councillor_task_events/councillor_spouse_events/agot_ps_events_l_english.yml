 councillor_personal_steward_learning.2001.middle.desc:0 "[different_culture_or_faith_faction.GetName]'teki komplocular bana bir an bile huzur vermiyor!"

 councillor_personal_steward_learning.2001.independence_faction.desc:0 "Sadık tebaa olmalılar; oysa bana karşı dönmek için plan yaptıklarını biliyorum."

 councillor_personal_steward_learning.2001.liberty_faction.desc:0 "Her fırsatta otoritemi baltalamaya çalışıyorlar."

 councillor_personal_steward_learning.2001.claimant_faction.desc:0 "O onursuz hırsızlar, hakça benim olan toprakları almaya çalışıyor."

 councillor_personal_steward_learning.2001.end.desc:0 "\n\nNeyse ki, "onlardan biri" olarak benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName] onlar üzerinde belirli bir ölçüde nüfuz sahibi. [councillor.GetSheHe|U] arabuluculuk yapmayı teklif etti ve nasıl ilerlemesi gerektiğini öğrenmek istiyor."

 councillor_personal_steward_learning.2001.a.faith:0 "[councillor.GetFaith.GetAdjectiveNoTooltip] hizip üyelerini yatıştır."

 councillor_personal_steward_learning.2001.a.culture:0 "[councillor.GetCulture.GetNameNoTooltip] hizip üyelerini yatıştır."

 councillor_personal_steward_learning.2001.a.faction_members_faith:0 "[different_culture_or_faith_faction.GetName]'in her [councillor.GetFaith.GetAdjective] üyesi"

 councillor_personal_steward_learning.2001.a.faction_members_culture:0 "[different_culture_or_faith_faction.GetName]'in her [councillor.GetCulture.GetName] üyesi"

 councillor_personal_steward_learning.2001.b:0 "[faction_member_1.GetTitledFirstNameNoTooltip]'i hizipten ayrılmaya zorla."

 councillor_personal_steward_learning.2001.c:0 "[faction_member_2.GetTitledFirstNameNoTooltip]'i bana sadık kalmaya ikna et."

 councillor_personal_steward_learning.2301.t:0 "Özel Kâhya: Daha Yüce Bir Güç"

 councillor_personal_steward_learning.2301.desc:0 "Benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))] [councillor.GetTitledFirstName], din dünyasında tanınan bir figür haline geldi. [councillor.GetHerHis|U] [councillor.GetFaith.GetAdjectiveNoTooltip] bilginlere, [councillor.GetFaith.HouseOfWorshipPlural]'e ve tarikatlara verdiği himaye, [religious_head.GetTitledFirstNameNicknamed] [religious_head.GetHerselfHimself]'in dikkatini bile çekti.\n\n[religious_head.GetTitleAsNamePossessiveNoTooltip] minnettarlığı güçlü yararlarla gelir. Benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))] benim adıma [religious_head.GetHerHim]'e ulaşmayı teklif etti."

 councillor_personal_steward_learning.2301.a:0 "Tanıştırmaları sen ayarlar mısın?"

 councillor_personal_steward_learning.2301.a.success:0 "[religious_head.GetTitledFirstNameNicknamed] ile dost oldum."

 councillor_personal_steward_learning.2301.b:0 "[religious_head.GetSheHe] karşılığında bizim için ne yapabilir?"

 councillor_personal_steward_learning.2301.c:0 "Bu, kutsal topluluğa yeniden kabul edilme şansım!"

 councillor_personal_steward_learning.2301.d:0 "[religious_head.GetHerHim]'e bildir — yaptığımız her şeyi [councillor.GetFaith.HighGodName] için yapıyoruz."

 councillor_personal_steward_learning.2602.t:0 "Özel Kâhya: Ufukları Genişletmek"

 councillor_personal_steward_learning.2602.not_root.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('student'))] [student.GetTitledFirstName] [student.Custom('highest_skill_noun')] hakkında bir iki şey biliyor olsa da [councillor.GetTitledFirstName], [student.GetHerHim]'in [student.GetHerHis] ufkunu genişletme zamanının geldiğini düşünüyor.\n\n"Birkaç yeni cilt edinebilir, birkaç ödev hazırlayıp [student.GetHerHim]'e biraz ders verebilirim. Sence hangi konu [student.GetFirstNameNoTooltip]'e en çok yarar sağlar?""

 councillor_personal_steward_learning.2602.root.desc:0 ""[student.Custom('highest_skill_noun')] hakkında bir iki şey biliyor olsan da [student.GetPrimaryTitle.GetNameNoTierNoTooltip]'in [student.GetTitleTierName]'i geniş bir beceri yelpazesine sahip olmalı," der benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))], [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('councillor'))].\n\n"Birkaç yeni cilt edinebilir, birkaç ödev hazırlayıp sana biraz ders verebilirim. En çok hangi konu ilgini çekiyor?""

 councillor_personal_steward_learning.2602.a:0 "Diplomasi."

 councillor_personal_steward_learning.2602.b:0 "Askerî kuram."

 councillor_personal_steward_learning.2602.c:0 "Alem ekonomisi."

 councillor_personal_steward_learning.2602.d:0 "Casus ağı yönetimi."

 councillor_personal_steward_learning.2602.e:0 "İlahiyat."

 councillor_personal_steward_learning.1304.desc:0 "Özel Kâhya [religious_vassal.GetTitledFirstNameNoTooltip]'in Hamisi"

 councillor_personal_steward_learning.1305.desc:0 "Özel Kâhyanın Dindarlığı [religious_head.GetTitleAsNameNoTooltip]'i Etkiliyor"

 councillor_personal_steward_learning.2603.t:0 "Özel Kâhya: Görevin Üstesinden Gelir"

 councillor_personal_steward_learning.2603.desc:0 "Konsey üyelerimden bazıları görevin yalnızca kan ya da nüfuz hakkıyla onların olduğuna inanıyor — ne kadar yanılıyorlar! Sonuç bekliyorum ama çoğu kez hayal kırıklığına uğruyorum.\n\nUzun bir günün ardından [councillor.GetFirstName]'e yakınıyorum; [councillor.GetSheHe] sözümü kesiyor. "Bırak ben bir şeyler yapayım, [ROOT.Char.GetTitleAsNameNoTooltip]'im. Birkaç ders zekâlarını keskinleştirebilir.""

 councillor_personal_steward_learning.2603.a:0 "[chancellor.GetCouncilTitle|U] [chancellor.GetFirstNameNoTooltip] bir öğretmenden faydalanabilir."

 councillor_personal_steward_learning.2603.b:0 "[marshal.GetCouncilTitle|U] [marshal.GetFirstNameNoTooltip] senin yardımından faydalanır."

 councillor_personal_steward_learning.2603.c:0 "[steward.GetCouncilTitle] [steward.GetFirstNameNoTooltip]'e birkaç ders ver."

 councillor_personal_steward_learning.2603.d:0 "Belki [spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip] için bir öğüdün vardır."

 councillor_personal_steward_learning.2603.e:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] biraz rehberliğe ihtiyaç duyuyor."

 councillor_personal_steward_learning.2603.f:0 "Onun yerine burada, benimle kal..."

