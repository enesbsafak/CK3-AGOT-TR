 councillor_personal_steward_diplomacy.1006.desc:0 "[councillor.GetTitledFirstNamePossessive] çok çalışması sayesinde [councillor.GetSheHe], insanlarla konuşmakta daha iyi hale geldi."

 councillor_personal_steward_diplomacy.2002.t:0 "Özel Kâhya: Gönül Bağı"

 councillor_personal_steward_diplomacy.2002.desc:0 ""Gelecek nesil hükümdarlar arasındaki ilişkileri beslemek, ihmal etmememiz gereken bir görevdir," der [councillor.GetTitledFirstName].\n\n"Nüfuzlu vasallarından bazılarının çocukları var; eminim [child_heir.GetTitledFirstName]'in onları tanımaktan çıkarı olacaktır.""

 councillor_personal_steward_diplomacy.2002.a:0 "[vassal_heir_1.GetTitledFirstNameNoTooltip] iyi namlı bir [vassal_heir_1.Custom('WomanManGirlBoy')] gibi görünüyor."

 councillor_personal_steward_diplomacy.2002.b:0 "[vassal_heir_2.GetTitledFirstNameNoTooltip] muhtemelen iyi bir etki olur!"

 councillor_personal_steward_diplomacy.2002.c:0 "[vassal_heir_3.GetTitledFirstNameNoTooltip] hakkında iyi şeyler duydum."

 councillor_personal_steward_diplomacy.2002.d:0 "Benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_heir'))] [child_heir.GetHerHis] başına gayet iyi idare eder."

 councillor_personal_steward_diplomacy.2003.t:0 "Özel Kâhya: Barış Fırsatı"

 councillor_personal_steward_diplomacy.2003.desc:0 "[ROOT.Char.GetFaith.HouseOfWorship]'in öbür ucunda benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] [rival.GetTitledFirstName]'i görür görmez arkamı dönmeye başlıyorum; ama şaşırtıcı bir biçimde [councillor.GetTitledFirstName], [rival.Custom('InsultNoun')] [councillor.Custom('quirk_pos_adverb')] bize doğru el sallıyor.\n\n"[rival.GetSheHe|U] tarafsız bir zeminde seninle görüşmeyi kabul etti. Senin gibi iki [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] [ROOT.Char.Custom2('WomenMenPeople', SCOPE.sC('rival'))]'in kavga etmesi talihsizlik. Artık barışma vaktinin geldiğini düşünmüyor musun?""

 councillor_personal_steward_diplomacy.2003.a:0 "Haklı olabilirsin..."

 councillor_personal_steward_diplomacy.2003.b:0 "Ben [rival.GetHerHis] suratını düzelteceğim!"

 councillor_personal_steward_diplomacy.2003.c:0 "[rival.GetHerHim]'e [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] diyorsun öyle mi?! Bırak [rival.GetHerHis] gerçek karakterini ifşa edeyim..."

 councillor_personal_steward_intrigue.0001.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] ve [spymaster.GetCouncilTitle] İş Birliği Yapıyor"

 councillor_personal_steward_intrigue.0002.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] Entrikayı İfşa Ediyor"

 councillor_personal_steward_intrigue.0003.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] Sırrı Keşfediyor"

 councillor_personal_steward_intrigue.0004.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] Entrikaya Yardım Ediyor"

 councillor_personal_steward_intrigue.0005.message:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))|U] Tebaayı Yönlendiriyor"

 councillor_personal_steward_intrigue.0006.message:0 "Saflık Kayboldu"

 councillor_personal_steward_intrigue.0007.message:0 "Sinsi Talim"

 councillor_personal_steward_intrigue.1001.t:0 "Özel Kâhya: Kimseye Güvenme"

 councillor_personal_steward_intrigue.1001.desc:0 ""Çevrene aldığın insanlara karşı dikkatli olmalısın." Benim [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('councillor'))]'in gözlerindeki ifade ölümüne ciddi. "Öğrendim ki daha biz konuşurken [spymaster.GetTitledFirstName] sana karşı entrika çeviriyor!"\n\nGerçekten olabilir mi? Kendi [spymaster.GetCouncilTitle]'im?!"

 councillor_personal_steward_intrigue.1001.a:0 "Beni aptal yerine koydular!"

 councillor_personal_steward_intrigue.1002.t:0 "Özel Kâhya: Söylenti ve Dedikodu"

 councillor_personal_steward_intrigue.1002.desc:0 "Benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.Custom('quirk_pos_present')]; [councillor.GetSheHe] paylaşacak bir şeyi olduğunda sık sık yaptığı gibi. "[target.GetTitledFirstName] hakkındaki söylentileri biliyorsun; korkunç bir şey sakladığını?" [councillor.GetSheHe] sesini alçaltırken ben de yaklaşıyorum. "Hepsi doğru. Tek gereken kanıt.""

 councillor_personal_steward_intrigue.1002.a:0 "Biraz casusluk vakti, benim [councillor.Custom('LoverPetName')]!"

 councillor_personal_steward_intrigue.1002.b:0 "Ne olduğunu keşfetmeliyim!"

 councillor_personal_steward_intrigue.1002.c:0 "Sırlarımı [target.GetFirstNameNoTooltip]'den daha iyi koruyorum."

 councillor_personal_steward_intrigue.1003.t:0 "Özel Kâhya: İfşa Edildi"

 councillor_personal_steward_intrigue.1003.desc:0 "[councillor.GetSheHe]'in bana yaklaşma biçiminden [councillor.GetTitledFirstName]'in sarayda bir sırra daha rastladığını anlıyorum.\n\n"[agent.GetTitledFirstName] bir komploya katılıyor," der [councillor.GetSheHe]. "[agent.GetSheHe|U] bildiğimi henüz bilmiyor; ama [agent.GetHerHim]'e mutlak sadakat karşılığında af teklif etmeni öneririm...""

 councillor_personal_steward_intrigue.1003.a:0 "[agent.GetHerHim]'e ortada ne kadar çok şey olduğunu anlat."

 councillor_personal_steward_intrigue.1003.b:0 "[agent.GetHerHim]'i asıl azmettiriciyi bulmak için kullan!"

 councillor_personal_steward_intrigue.1003.c:0 "[agent.GetHerHis] her hareketini izle ve beni zarardan koru!"

 councillor_personal_steward_intrigue.1004.t:0 "Özel Kâhya: Muhalefet Araştırması"

 councillor_personal_steward_intrigue.1004.desc:0 "[secret_holder.GetTitledFirstName] baş belası oldu; [faction.GetName]'i yüksek sesle destekliyor. Neyse ki üstünlüğü ele geçirmek üzereyim.\n\nBenim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], [secret_holder.GetHerHis] sıkı sıkı saklanan bir sırrını keşfetti, der [councillor.GetSheHe] kurnaz bir gülümsemeyle.\n\n"İlgini çekebileceğini düşündüm, canım...""

 councillor_personal_steward_intrigue.1004.a:0 "Biraz şantaj, [secret_holder.GetHerHim]'i yola getirir."

 councillor_personal_steward_intrigue.1004.b:0 "Bu rezalet! Alem bilmeli!"

 councillor_personal_steward_intrigue.1004.c:0 "Bazen kazançlı bir elde beklemek en iyisidir."

 councillor_personal_steward_intrigue.1004.c.tt:0 "[secret_holder.GetFirstNamePossessiveNoTooltip] Sırrını henüz ifşa etmiyorsun"

 councillor_personal_steward_intrigue.1005.t:0 "Özel Kâhya: Böl ve Yönet"

 councillor_personal_steward_intrigue.1005.desc:0 "[faction_member.GetTitledFirstName], [leader.GetTitledFirstName]'i ve [leader.GetHerHis] [faction.GetName]'i etkin biçimde destekliyor. Ne var ki benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] bunu değiştirecek bir plana sahip.\n\n"Güven bana, [faction_member.GetTitledFirstName]'e anlatabileceklerim [faction_member.GetHerHim]'i anında [leader.GetFirstNameNoTooltip]'i inkâr ettirir.""

 councillor_personal_steward_intrigue.1005.a:0 "[faction_member.GetFirstNameNoTooltip]'in [leader.GetFirstNameNoTooltip]'i bir daha asla desteklemediğinden emin ol!"

 councillor_personal_steward_intrigue.1005.b:0 "Beni daha iyi bir seçenek gibi gösterebilir misin?"

 councillor_personal_steward_intrigue.1006.t:0 "Özel Kâhya: Uygun Bir Temsilci"

 councillor_personal_steward_intrigue.1006.desc:0 "[target.GetTitledFirstName] hakkındaki planlarımın tamamen farkında olan benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetFirstName], bana bir teklifle geldi.\n\n"[court_owner.GetTitledFirstNamePossessive] sarayında dostlarım var. Bir süreliğine bir konuk ağırlamalarını isteyebilirim. Küçük bir sadakat nişanesi ve sunabileceğim tüm destekle [plant.GetTitledFirstName] senin adına harikalar yaratabilir...""

 councillor_personal_steward_intrigue.1006.a:0 "Dâhiyane bir fikir, benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('councillor'))]!"

 councillor_personal_steward_intrigue.1006.b:0 "Sanırım burada [plant.GetFirstNameNoTooltip]'e ihtiyacımız olabilir."

