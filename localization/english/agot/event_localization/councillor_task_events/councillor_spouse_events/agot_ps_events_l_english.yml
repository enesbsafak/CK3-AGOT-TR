 councillor_personal_steward_stewardship.2001.t:0 "Özel Kâhya: Yatırım Araştırması"

 councillor_personal_steward_stewardship.2001.desc:0 "[councillor.GetTitledFirstNamePossessive] hanemin maliyesini özenle yönetmesi sayesinde bu sezonun sonunda beklenenden daha fazla altın var.\n\n"Bu altını en iyi nasıl değerlendirelim, [ROOT.Char.GetTitleAsNameNoTooltip]'im?""

 councillor_personal_steward_stewardship.2001.a:0 "Herkesin keyfi için görkemli bir yemek daveti düzenle!"

 councillor_personal_steward_stewardship_2001_every_powerful_vassal:0 "Her Güçlü Vasal"

 councillor_personal_steward_stewardship.2001.b:0 "Parayı yerel bölgeye yatır."

 councillor_personal_steward_stewardship.2001.c:0 "Paranın satın alabileceği bir şey varsa o da gözler ve kulaklardır!"

 councillor_personal_steward_stewardship.2001.d:0 "Şimdilik saklayalım."

 councillor_personal_steward_stewardship.2002.t:0 "Özel Kâhya: Göz Kamaştıran Fırsat"

 councillor_personal_steward_stewardship.2002.desc:0 ""[ROOT.Char.GetLadyLord]'im." [courtier_lender.GetTitledFirstName] sendeleyerek yanıma yaklaşır ve [courtier_lender.Custom('quirk_pos_adverb')] gülümser. "[councillor.GetTitledFirstName], [councillor.GetHerHis] bilgeliğiyle ikimiz arasında bir anlaşma önererek bana geldi. Madem siz mali yardıma, ben de sosyal desteğe ihtiyaç duyuyorum...""

 councillor_personal_steward_stewardship.2002.a:0 "Sana borcumu ödeyeceğim, söz."

 councillor_personal_steward_stewardship.2002.money_loan_tooltip:0 "[courtier_lender.GetFirstNameNoTooltip]'den [gold_i] #bold [THIS.Var('amount_to_loan').GetValue]#! altın ödünç alacağım."

 councillor_personal_steward_stewardship.2002.b:0 "Onun yerine [ROOT.Char.GetFaith.HouseOfWorship]'e bağışlamaya ne dersin?"

 councillor_personal_steward_stewardship.2002.c:0 "Onu yoksullara bağışlamalısın."

 councillor_personal_steward_stewardship.2002.d:0 "Bu haraçı seve seve kabul edeceğim!"

 councillor_personal_steward_stewardship.2003.t:0 "Özel Kâhya: Ticaret Fırsatı"

 councillor_personal_steward_stewardship.2003.desc:0 "[councillor.GetTitledFirstName], [councillor.GetHerHis] kollarında üç parşömen tomarıyla yanıma yaklaşır.\n\n"[ROOT.Char.GetLadyLord]'im, komşu hükümdarlar için ticaret önerileri hazırladım. Eminim iki tarafa da yarar sağlayacak bir anlaşma kurulabilir!""

 councillor_personal_steward_stewardship.2003.a:0 "[ruler_1.GetTitledFirstNameNoTooltip] makul görünüyor."

 councillor_personal_steward_stewardship.2003.b:0 "[ruler_2.GetTitledFirstNameNoTooltip] ile bir anlaşmaya gir."

 councillor_personal_steward_stewardship.2003.c:0 "[ruler_3.GetTitledFirstNameNoTooltip] ile bir anlaşma yap."

 councillor_personal_steward_stewardship.2003.d_greedy:0 "Hiçbiri altınımın yakınından bile geçemez!"

 councillor_personal_steward_stewardship.2003.d_arrogant:0 "Hiçbiri #EMP benimle#! anlaşma yapmaya layık değil!!"

 councillor_personal_steward_stewardship.2003.d:0 "Hiçbiri yeterince cazip bir fırsat sunmuyor..."

 councillor_personal_steward_stewardship.2004.t:0 "Özel Kâhya: Yardım Eli"

 councillor_personal_steward_stewardship.2004.desc:0 ""Senin [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('on_my_hook'))] [on_my_hook.GetTitledFirstName], geçenlerde kendini bir parça zor durumda buldu."\n\n[councillor.GetTitledFirstName] [councillor.Custom('quirk_pos_adverb')] gülümseyerek sözlerini sürdürür: "Durumun kendiliğinden çözülmesini ve hayırsever olarak sizden söz edilmesini sağladım.""

 councillor_personal_steward_stewardship.2004.a:0 "Üstün iş!"

 councillor_personal_steward_stewardship.2004.b:0 "İyi bir iş karşılık beklemez."

 councillor_personal_steward_stewardship.2005.t:0 "Özel Kâhya: [county_to_boost.GetNameNoTierNoTooltip] Yatırımları"

 councillor_personal_steward_stewardship.2005.desc:0 ""[ROOT.Char.GetLadyLord|U]'im. Dikkatimi çekti ki [county_to_boost.GetName]'e yatırım yapmak için ender bir fırsat var."\n\nBenim [councillor.Custom('GetCouncilOrCourtPosition')] [councillor.GetFirstName] iş yatırımının ayrıntılarını hazırlar ve anlaşma başarılı olursa gerçekten [county_to_boost.GetNameNoTierNoTooltip]'e büyük yarar sağlayacak gibi görünüyor."

 councillor_personal_steward_stewardship.2005.a:0 "Göze alınmaya değer bir risk!"

 councillor_personal_steward_stewardship.2005.a_1:0 "Anlaşma [county_to_boost.GetNameNoTierNoTooltip] için büyük bir kazanç sağlıyor"

 councillor_personal_steward_stewardship.2005.a_2:0 "Anlaşma suya düşüyor"

 councillor_personal_steward_stewardship.2005.b:0 "Fırsatı [county_to_boost.GetNameNoTierNoTooltip] halkına bırak."

 councillor_personal_steward_stewardship.2005.c:0 "Bu yerel mesele konuşmaları bana göre değil!"
