l_english:

 agot_dragon_personality.change_effect:0 "Bir ejderhanın kişiliğini böyle değiştirmek, onun [temperament|E] veya [taming_chance|E] kaybetmesine yol açabilir"

 agot_dragon_personality.0001.t:0 "Dost Canlısı Bir Canavar"

 agot_dragon_personality.0001.desc:0 "[growing_dragon.GetFirstName]'e bir parça et fırlatıyorum ve [growing_dragon.Custom('GetDragonSheHe')] onu havada yakalıyor. Ama geri çekildiğimde [growing_dragon.Custom('GetDragonSheHe')] eti yemeyi bırakıp yaklaşıyor; başı kanlı elime doğru uzanan. İlk başta [growing_dragon.Custom('GetDragonSheHe')]'nin daha fazla yiyecek istediğini sanıyorum; ama bunun yerine [growing_dragon.Custom('GetDragonSheHe')] elimi okşuyor! [growing_dragon.GetFirstNameNoTooltip] giderek daha sosyal bir hal alıyor ve çevresindeki her şeye alışkın görünüyor.\n\nBöyle bir doğa bu duvarların içinde işe yarasa da, bunun [growing_dragon.Custom('GetDragonHerHis')] savaş yeteneklerini nasıl etkileyeceğini merak ediyorum."

 agot_dragon_personality.0001.a:0 "Yaklaşılabilir; sahip olunası iyi bir özellik!"

 agot_dragon_personality.0001.b:0 "Ejderha savaşmak içindir! Okşanmak için değil!"

 agot_dragon_personality.0001.c:0 "Sevgi yeterli değil, itaat şart!"

 agot_dragon_personality.0002.t:0 "Saldırgan Bir Canavar"

 agot_dragon_personality.0002.desc:0 "[growing_dragon.GetFirstNamePossessive] giderek artan saldırganlığını fark etmemek zorlaştı. [growing_dragon.Custom('GetDragonSheHe')|U] [growing_dragon.Custom('GetDragonHerHim')]'i kontrol etmek giderek zorlaşıyor; en küçük aksaklıklara bile saldırıyla karşılık veriyor. Hizmetkârlarımdan bazıları artık [growing_dragon.Custom('GetDragonHerHis')] büyüyen gazabının talihsiz kurbanı olmamak için beslenme saatlerinde yardım etmeyi bile reddediyor.\n\nKorkunç bir canavarın avantajları olsa da, bunun [growing_dragon.GetFirstNameNoTooltip] için en iyi yol olup olmadığını merak ediyorum."

 agot_dragon_personality.0002.a:0 "İçindeki canavarı değiştiremezsin."

 agot_dragon_personality.0002.b:0 "Doğasıyla ya da kırbaçla, sakin olmalı."

 agot_dragon_personality.0002.c:0 "Bu teşvik edilmeli! Bir dahaki sefere canlı et verin!"

 agot_dragon_personality.0003.t:0 "Korkak Bir Dehşet"

 agot_dragon_personality.0003.desc:0 "Beslenme saati [growing_dragon.GetFirstName] ile hassas bir meseleye dönüştü; sabah sisinden daha ele avuca sığmaz bir mizaç ortaya çıktı. Bugün bakıcılar bir koyun getirdiğinde, koyunun melemesi genç ejderhayı tedirgin etmiş gibiydi. Akranlarının güveniyle yaklaşmak yerine [growing_dragon.GetFirstNameNoTooltip] geride duruyor, pençeleri endişeyle taşa tıkırdıyordu.\n\nKoyun her hareket ettiğinde [growing_dragon.Custom('GetDragonSheHe')] kımıldanıyordu; sanki yünün hışırtısı bile değerlendirilmesi gereken bir tehditmiş gibi. Ancak nazikçe ikna edilince [growing_dragon.Custom('GetDragonSheHe')] yaklaşmaya cesaret etti; açılan burun delikleri [growing_dragon.Custom('GetDragonHerHis')] süregelen huzursuzluğunun bir işaretiydi. Hızlı, neredeyse isteksiz bir hamleyle [growing_dragon.GetFirstNameNoTooltip] sonunda yemeğini aldı. Görünüşe göre bu efsanevi ve güçlü yaratık, bir serçenin yüreğine sahip olabilir."

 agot_dragon_personality.0003.a:0 "Ne tuhaf! Ürkek bir ejderha!"

 agot_dragon_personality.0003.b:0 "Bir ejderha cesur olmalı! Savaş köpeklerini getirin!"

 agot_dragon_personality.0003.c:0 "Ona biraz alan verirsek belki rahatlar?"

 agot_dragon_personality.0004.t:0 "Dehşet Verici Bir Felaket"

 agot_dragon_personality.0004.desc:0 "[growing_dragon.Custom('GetDragonHerHis')] doğal içgüdülerini korumak için bazen [growing_dragon.GetFirstName]'e canlı av avlatıyorum. Bugün [growing_dragon.Custom('GetDragonHerHim')] ile birlikte bir geyiği kilitledim ve [growing_dragon.GetFirstNameNoTooltip] daha önce görmediğim bir vahşetle ava girişti; güçlü çeneleriyle eti hırsla parçalıyor.\n\nAma dahası var: [growing_dragon.Custom('GetDragonSheHe')] yaratığı canlı bırakmış görünüyor! Önceden olduğu gibi eti yemeden önce yakmak yerine, [growing_dragon.GetFirstNameNoTooltip] ağzındaki kanı ve iç organları tadını çıkararak yiyor. Sanki [growing_dragon.Custom('GetDragonSheHe')]... ölmekte olan hayvanın melemesinden zevk alıyor."

 agot_dragon_personality.0004.a:0 "Gerçekten dehşet verici bir canavar ama... benim canavarım."

 agot_dragon_personality.0004.b:0 "Bu yakışıksız! [growing_dragon.Custom('GetDragonSheHe')] bir daha yaparsa [growing_dragon.Custom('GetDragonHerHim')]'i dövün!"

 agot_dragon_personality.0004.c:0 "Bu iyi bir işaret! [growing_dragon.Custom('GetDragonSheHe')|U] istediği şey için savaşıyor!"

 agot_dragon_personality.0005.t:0 "Nazik Bir Dev"

 agot_dragon_personality.0005.desc:0 "Endişe duvar onarımından çok, ondan önceki adımdı. [growing_dragon.GetFirstName] gibi bir ejderhayı başka yere götürmek, geçici bile olsa, hafife alınacak bir iş değil.\n\nZanaatkârlar yaklaştığında [growing_dragon.GetFirstNameNoTooltip]'in onları bölgesini koruyan bir hırıltıyla karşılayacağını bekliyordum. Ne var ki [growing_dragon.Custom('GetDragonSheHe')] yalnızca [growing_dragon.Custom('GetDragonHerHis')] bakışını kaldırdı; gözleri hayvani içgüdüleri aşan bir zekâyla parlıyordu. [growing_dragon.Custom('GetDragonHerHis')] kanatlarını vakur bir biçimde gererek [growing_dragon.Custom('GetDragonSheHe')] ağır ağır yürüdü; her adım bilinçli ve telaşsızdı, [growing_dragon.Custom('GetDragonHerHis')] kuyruğu arkada nazikçe süzülüyordu. [growing_dragon.Custom('GetDragonSheHe')|U] anın gerginliğini yatıştıran bir sükûnetle yeni bir yere yerleşti.\n\nİşçiler işlerine başladı; kendilerini sakin bir merakla izleyen ejderhaya minnet ve saygı dolu bakışlar fırlatarak."

 agot_dragon_personality.0005.a:0 "Uygun! Belki de ejderha yetiştirmek hiç de o kadar zor değil."

 agot_dragon_personality.0005.b:0 "Bu bir rezalet! Düşmanlarımız bizden nasıl korkacak?"

 agot_dragon_personality.0005.c:0 "Belki [growing_dragon.Custom('GetDragonHerHim')]'i başka hayvanlarla tanıştırabiliriz?"

 agot_dragon_personality.0006.t:0 "Dik Başlı Bir Kertenkele"

 agot_dragon_personality.0006.desc:0 ""Deniyoruz ama korkarım [growing_dragon.GetFirstName] hiç iş birliği yapmıyor." Bakıcının sesi konuşurken gergin; [growing_dragon.GetNameNoTooltip]'i bağlayan zincirle boğuşup onu yeniden duvara kilitlemeye çalışırken sesindeki tansiyonu duyabiliyorum.\n\n[growing_dragon.GetNameNoTooltip] hiçbir zaman özellikle itaatkâr bir yaratık olmasa da, [growing_dragon.Custom('GetDragonSheHe')] artık giderek kontrol edilmesi zorlaştı. Kendi iradesine sahip bir ejderha korkunç bir şey olsa da, bunun [growing_dragon.GetNameNoTooltip] için en iyi yol olup olmadığını merak ediyorum."

 agot_dragon_personality.0006.a:0 "Bir koyundansa kendi iradesine sahip bir ejderha tercih ederim."

 agot_dragon_personality.0006.b:0 "Bir ejderha kontrol edilmeli! [growing_dragon.GetNameNoTooltip], [growing_dragon.Custom('GetDragonSheHe')] itaat edene dek aç kalacak!"

 agot_dragon_personality.0006.c:0 "Böyle bir haşmete gereken saygı #bold gösterilmeli#!"

 agot_dragon_personality.0007.t:0 "Mütevazı Bir Tiran"

 agot_dragon_personality.0007.desc:0 "[growing_dragon.GetFirstNamePossessive] besleyicilerinden bugün can sıkıcı haberler geldi — [growing_dragon.Custom('GetDragonSheHe')], odada başka kimse olduğu sürece yemeyi reddetmeye başlamış. Görünüşe göre başka biri varsa, [growing_dragon.Custom('GetDragonSheHe')] sadece onlara bakıyor. Bu durum, besleyicilerden biri kendi öğle yemeğini aynı anda yemeye karar verene dek sürdü ve meğer [growing_dragon.GetNameNoTooltip] besleyicinin önce yemesini bekliyormuş!\n\n[growing_dragon.GetNameNoTooltip] açıkça destekleyici bir huya sahip; asıl soru şu: bunun devam etmesine izin verecek miyim?"

 agot_dragon_personality.0007.a:0 "Oh, bu eğitimi kolaylaştıracak!"

 agot_dragon_personality.0007.b:0 "Bir ejderha, ayaktakımının üstündeki yerini bilmeli!"

 agot_dragon_personality.0007.c:0 "[growing_dragon.GetFirstNamePossessiveNoTooltip] iyi huyu için fazladan yiyecek ver."

 agot_dragon_personality.0008.t:0 "Emredici Bir Varlık"

 agot_dragon_personality.0008.desc:0 "[growing_dragon.GetFirstNamePossessive] besleyicilerinden bugün can sıkıcı haberler geldi — [growing_dragon.Custom('GetDragonSheHe')], kendisine verilmesini beklemek yerine yiyecek talep etmeye başlamış. İşin kötüsü, [growing_dragon.Custom('GetDragonSheHe')] kendisine yaklaşan hizmetkârlara #EMP eğilmezse#! hırlamaya bile başlamış.\n\n[growing_dragon.GetNameNoTooltip] açıkça kibirli bir huy edinmiş; asıl soru şu: bunun devam etmesine izin verecek miyim?"

 agot_dragon_personality.0008.a:0 "Sonuçta bir ejderhaya saygı gösterilmeli."

 agot_dragon_personality.0008.b:0 "Benim çatımın altında yaşadığın sürece #EMP bana#! saygı duyacaksın!"

 agot_dragon_personality.0008.c:0 "O halde... en iyisi ona hızla hizmet etmek!"

 agot_dragon_personality.0009.t:0 "Sabırlı Bir Ejderha"

 agot_dragon_personality.0009.desc:0 "Salonlarımda yürürken bir yan odadan tartışma sesi duyuyorum; tam zamanında durup hizmetkârlarımdan birinin diğerine tokat attığını görüyorum! İtiraz edemeden beni fark edip açıklıyor: "Bunu görmek zorunda kaldığınız için üzgünüm. Bu ahmak bugün [growing_dragon.GetFirstName]'i beslemeyi unutmuş. Anlaşılan canavar o kadar sessiz ki unutuluyor!"\n\n[growing_dragon.GetNameNoTooltip]'in fark edilmesinin zor olduğunu duymuştum ama bu boyutunu beklemiyordum! Araya girmeli miyim, yoksa bu sadece [growing_dragon.Custom('GetDragonHerHis')] doğasının bir parçası mı?"

 agot_dragon_personality.0009.a:0 "Bir ejderha fevri olmamalı; bu eğitimi kolaylaştıracak!"

 agot_dragon_personality.0009.b:0 "Sabır zayıflıktır! [growing_dragon.Custom('GetDragonSheHe')]'nin öğrenmesini sağlayacağım!"

 agot_dragon_personality.0009.c:0 "Bir dahaki sefere onunla yemek ye; eminim o zaman fark edersin!"

 agot_dragon_personality.0010.t:0 "Talepleri Olan Bir Ejderha Yavrusu"

 agot_dragon_personality.0010.desc:0 "Bu ses bir türlü kesilmiyor! Bir saattir duyuyorum ve beni deli ediyor! Sonunda araştırmaya karar veriyorum ve [growing_dragon.GetFirstName]'in hizmetkârlarımdan birine itiraz ettiğini buluyorum.\n\n"Özür dilerim!" diye haykırıyor "[growing_dragon.GetNameNoTooltip]'i zaten besledik ama yine de şikâyet ediyor! Koku gelince parmaklıkları tırmalıyor!".\n\nGörünüşe göre [growing_dragon.GetNameNoTooltip] yaşlandıkça sabırsızlaştı ve şimdi bununla uğraşmak zorundayım."

 agot_dragon_personality.0010.a:0 "Talepleri olması doğal, sadece kulak asma."

 agot_dragon_personality.0010.b:0 "Bu sefer besleme, bir dahaki sefere iki katı yemek ver."

 agot_dragon_personality.0010.c:0 "[growing_dragon.Custom('GetDragonHerHim')]'i daha sessiz bir yere taşıyın o zaman! [growing_dragon.Custom('GetDragonHerHim')]'i susturan her neyse!"

 agot_dragon_personality.0011.t:0 "Nazik Bir Kıyamet"

 agot_dragon_personality.0011.desc:0 "[growing_dragon.Custom('GetDragonHerHis')] doğal içgüdülerini korumak için bazen [growing_dragon.GetFirstName]'e canlı av avlatıyorum. Bugün [growing_dragon.Custom('GetDragonHerHim')] ile birlikte bir geyiği kilitlemiştim; ama [growing_dragon.GetNameNoTooltip] saldırmak yerine yaratığa yaklaşıp şimdi onu okşuyor!\n\nBirkaç dakika sonra geyik bile rahatlamış görünüyor ve uzanıyor! [growing_dragon.GetNameNoTooltip] bu arkadaşlıktan keyif alıyor ve hatta geyiğin [growing_dragon.Custom('GetDragonHerHis')] yüzünü yalamasına izin veriyor!\n\nBöyle bir doğa bu duvarların içinde işe yarasa da, bunun [growing_dragon.Custom('GetDragonHerHis')] savaş yeteneklerini nasıl etkileyeceğini merak ediyorum."

 agot_dragon_personality.0011.a:0 "Ayyy! Ne tatlı!"

 agot_dragon_personality.0011.b:0 "Hayır, onu öldüreceksin, #EMP böyle#!"

 agot_dragon_personality.0011.c:0 "Görünüşe göre bir dost edindin! Bu gece burada bırak."

 agot_dragon_personality.0012.t:0 "Savunmacı Bir Yırtıcı"

 agot_dragon_personality.0012.desc:0 "Bir parça et daha atıyorum ve temiz bir #italic şlap#! sesiyle yere düşüyor. [growing_dragon.GetFirstNamePossessive] gözleri uçarken eti takip etse de, [growing_dragon.Custom('GetDragonSheHe')] ancak geri çekildikten sonra yemeye başlıyor. Bir tane daha atmak için öne adım atıyorum ama karşılığında şikâyetçi bir tıslama alıyorum.\n\nGörünüşe göre [growing_dragon.GetNameNoTooltip] giderek bölgesini koruyan bir hale geliyor ve şu an yemediği hiçbir şeye yakın olmaktan rahatsız oluyor.\n\nBöyle bir doğa vahşi doğada işe yarasa da, bunun [growing_dragon.Custom('GetDragonHerHis')] insanlarla yaşamını nasıl etkileyeceğini merak ediyorum."

 agot_dragon_personality.0012.a:0 "Temkinli olmak iyi bir şey."

 agot_dragon_personality.0012.b:0 "Bir ejderha binicisine güvenebilmeli."

 agot_dragon_personality.0012.c:0 "O zaman ona daha çok yiyecek ver; [growing_dragon.Custom('GetDragonSheHe')] daha rahat olacaktır!"

 agot_dragon_personality.0013.t:0 "Kurnaz Bir Yiyici"

 agot_dragon_personality.0013.desc:0 "Günlük beslenme sırasında [growing_dragon.GetFirstName] ile tuhaf bir sahne yaşandı. Bakıcıların bir yaban domuzu getirdiğini izledim. [growing_dragon.GetNameNoTooltip] açgözlülükle saldırmak yerine dikkat çekici bir itidal sergiledi.\n\n[growing_dragon.GetSheHe|U] domuzun etrafında döndü, burun delikleri açık ve gözleri kilitli; ama [growing_dragon.Custom('GetDragonHerHis')] güçlü çeneleri kapanmadı. [growing_dragon.Custom('GetDragonHerHis')] burnuyla bir dürtükle [growing_dragon.Custom('GetDragonSheHe')] domuzu ayağa kaldırıp köşedeki büyüyen yosunlara götürdü. Orada [growing_dragon.Custom('GetDragonSheHe')] domuzun gevşek bitkileri yemesini izledi. Ancak domuz doyduktan sonra [growing_dragon.GetNameNoTooltip] kendi yemeğine koyuldu; artık doymuş domuzu kızartarak.\n\n[growing_dragon.Custom('GetDragonHerHis')] yemekteki bu disiplin, [growing_dragon.GetNameNoTooltip]'in doğası hakkında çok şey anlatıyordu: oldukça görkemli bir itidale sahip bir ejderha."

 agot_dragon_personality.0013.a:0 "İlginç. Bu ejderhayı izlememiz gerekecek."

 agot_dragon_personality.0013.b:0 "Bir ejderha obur olmalı! [growing_dragon.Custom('GetDragonHerHim')]'i yemek yemeye zorlayacağız!"

 agot_dragon_personality.0013.c:0 "Çok iyi! [growing_dragon.GetFirstNamePossessiveNoTooltip] sabrını ödüllendir!"

 agot_dragon_personality.0014.t:0 "Dipsiz Bir Kuyu"

 agot_dragon_personality.0014.desc:0 "Aldığım mali raporları inceliyorum ve özellikle büyük bir kalem dikkatimi çekiyor. Ejderha yemi; geçen yılın aynı dönemindeki tutarın iki katı. Görevlilerime sorduğumda [growing_dragon.GetFirstName]'in giderek daha çok yediğini, istediği kadar yem verilmediğinde şiddetle şikâyet ettiğini öğreniyorum. Tehditler altında bakıcılar ona istediğini veriyormuş!\n\nBu kadar yemek odaklı bir ejderha oldukça uysal olsa da, bu iş çığırından çıkıyor. Belki bu, büyüyen bir ejderha yetiştirmenin sadece bir parçasıdır?"

 agot_dragon_personality.0014.a:0 "Bir ejderha iyi beslenmeli; bu eğitimi kolaylaştıracak!"

 agot_dragon_personality.0014.b:0 "Yemek değil, idman! [growing_dragon.Custom('GetDragonHerHim')]'i egzersiz yapmaya zorlayacağız!"

 agot_dragon_personality.0014.c:0 "En azından [growing_dragon.Custom('GetDragonHerHim')]'e yemeğini kazandırın!"

 agot_dragon_personality.0015.t:0 "Yamyam Bir İçgüdü"

 agot_dragon_personality.0015.desc:0 "Bakıcılardan korkunç haberler!\n\nGörünüşe göre beslenme sırasında [growing_dragon.GetFirstName], [growing_dragon.Custom('GetDragonHerHis')] zincirlerinden kurtulup [growing_dragon_victim.GetFirstName]'e saldırmış! [growing_dragon_victim.GetFirstNameNoTooltip], kimse müdahale edemeden öldürüldü ve [growing_dragon.GetNameNoTooltip] kalıntıları zevkle yedi."

 agot_dragon_personality.0015.a:0 "Ejderhalar savaşır, bu onların doğası."

 agot_dragon_personality.0015.a.f:0 "[growing_dragon_victim.GetFirstNameNoTooltip]'in kaybını ve bunun gibi olayların yaşanma ihtimalini kabulleniyorsun."

 agot_dragon_personality.0015.b:0 "Bu kabul edilemez! [growing_dragon.GetNameNoTooltip]'i gönderin!"

 agot_dragon_personality.0015.c:0 "[growing_dragon.Custom('GetDragonHerHim')]'i tutamayız. [growing_dragon.Custom('GetDragonHerHim')]'i bırakamayız..."

 agot_dragon_personality.0015.c.f:0 "[growing_dragon.GetNameNoTooltip]'i öldürmekten başka seçeneğin yok."

 agot_dragon_personality.0016.t:0 "Kaçak Ejderha!"

 agot_dragon_personality.0016.desc_start:0 "Saray kargaşa içinde! [growing_dragon.GetFirstName], [growing_dragon.Custom('GetDragonHerHis')] zincirlerinden kurtuldu ve başıboş; onu idam etmeye gönderilenlere bir alev ve öfke tufanıyla karşı koyuyor!\n\n"

 agot_dragon_personality.0016.desc_knight:0 "[slain_knight.GetName]'in ölenler arasında olduğu söyleniyor,"

 agot_dragon_personality.0016.desc_guard:0 "Girişimde birçok muhafızın öldüğü söyleniyor,"

 agot_dragon_personality.0016.desc_end:0 "ve [growing_dragon.GetNameNoTooltip]'in göklere yükselip ardında bir yıkım izi bıraktığı söyleniyor. Canavar kırsala doğru ilerliyor ve [growing_dragon.GetNameNoTooltip] artık hem insan hem ejderha etine merak salmış bir halde özgürken ne olacağından korkuyorum."

 agot_dragon_personality.0016.a:0 "Ne dehşeti saldım başıma?"
