l_english:

 agot_dorne.0001.t:0 "Kumda Bir Yılan"

 agot_dorne.0001.desc:0 "Arzularım her zaman zehirim oldu, ama Dorne'da bu o kadar da kötü bir şey değil. Bugün Su Bahçeleri'nde gezinirken Lord Uller'in büyüleyici kızı gözüme çarpıyor. Ama o ilgime her zamanki baygınlıkla karşılık vermiyor. Aksine, gözlerini kısıp sırıtıyor..."

 agot_dorne.0001.a:0 "Dudakların zehirli; sarılalım..."

 agot_dorne.0001.b:0 "Sıradan bir fahişe ilgimi hak etmiyor..."
