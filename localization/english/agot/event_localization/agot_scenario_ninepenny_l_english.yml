l_english:

 agot_ninepenny.0001.t:0 "Dokuzlar Çetesi"

 agot_ninepenny.0001.desc:0 ""Her birimiz kendimize bir krallık oyacağız," diye ilan ediyor [adarys.GetName], İhtilaflı Topraklar'daki büyük Taç Ağacı'nın altında. Doğum hakkım kolay kazanılmayacak — Golden Company'nin kontrolünü ele geçirmek bile hiç de kolay olmadı. Şimdi, önümde Essos'un en alçak haydutlarından dokuzu diz çöküyor... Yalnızca [ROOT.Char.GetNickname] denen biriyle anılan biri kadar destek toplayabilir.\n\nArkamda [saan.GetNickname], [old_mother.GetFirstNameNicknamed], [butcher.GetNickname], [bad_apple.GetNickname], [nine_eyes.GetNickname], [ebon_prince.GetNickname] ve [lashare.GetNickname] varken... Demir Taht benim olacak. Ama [ROOT.Char.Custom('BlackfyreRebellions')|l] dikkatli planlama gerektirecek; zira sonraki adımlarım, Yedi Krallık'ın küçük konseyine ulaşacak dalgalar yaratacak kesinlikle. #bold Acele etmeliyim, yoksa düşmanlarım savaşı bana getirir.#!"

 agot_ninepenny.0001.a:0 "Silvertongue'u Tyrosh'a yerleştireceğiz."

 agot_ninepenny.0001.b:0 "Bunun için vaktim yok. Adımtaşları'nı alacağız, sonra Westeros'a!"

 agot_ninepenny.0001.b.colonize:0 "Bunun için vaktim yok. Adımtaşları'nı alacağız, sonra Westeros'a!"

 agot_ninepenny.0001.b.alt:0 "Yaşlı Ana Adımtaşları'nı alacak."

 agot_ninepenny.0001.b.alt.colonize:0 "Yaşlı Ana Adımtaşları'nı alacak."

 agot_ninepenny.0001.c:0 "Korsan Lys'i mi istiyor? Öyleyse alacak!"

 agot_ninepenny.0001.d:0 "Lashare Myr'ı isteyecek."

 agot_ninepenny.0001.e:0 "Dokuz Göz Pentos'u alacak."

 agot_ninepenny.0001.f:0 "Doğum hakkımı iddia etme zamanı!"

 agot_ninepenny.0001.g:0 "Bundan bıktım."

 agot_ninepenny.0002.t:0 "$agot_ninepenny.0001.t$"

 agot_ninepenny.0002.desc.tyrosh:0 "Tyrosh, müttefikim [adarys.GetNameNicknamed]'in becerikli ellerindeyken Dokuzlar Çetesi giderek güçleniyor. Gözümde değerli bir ödül: [daemon.GetFirstNameNicknamed] bir zamanlar Tyrosh'ta yaşıyordu ve yeni bir tiran — pardon, arkon — ile Blackfyre desteğini bulmak zor olmayacak.\n\nŞans cesurlardan yanadır ve bir sonraki hamlemi aceleyle yapmalıyım. Westeros'un lordları benim tehdidimin söylentilerini duymuş olmalılar."

 agot_ninepenny.0002.desc.lys:0 "Bir korsan kralı için bir korsanın toprakları: Sevimli Lys'i yönetmek için [saan.GetNameNicknamed]'den daha uygun kimse yok. Şehrin zenginliği davama da büyük destek olacak — üstelik savaşın stresini atmak için Parfümlü Bahçe'yi ziyaret etmeye kim karşı koyabilir.\n\nAma zaman her şeydir ve bir sonraki hamlemi aceleyle yapmalıyım. Dokuzlar Çetesi'nin başarılarının haberi şimdiye dek Westeros'a ulaşmış olmalı."

 agot_ninepenny.0002.desc.pentos:0 "Müttefikim [nine_eyes.GetNameNicknamed] için Pentos'u fethetmek Dokuzlar Çetesi için büyük bir nimet olacak: Kralın Şehri'nin tam karşısında, Dar Deniz'in ötesinde değerli bir liman — ve doğum hakkım. Şehir, masalların alay ettiği kadar savunmasız çıktı.\n\nKorkak bir yürek güzel bir hanımı asla kazanmaz ve benim ödülüm sıradan bir kadından çok daha büyük. Hızla hareket etmeli, bu ivmeyi krallığıma taşımalıyım."

 agot_ninepenny.0002.desc.myr:0 "Myr, [lashare.GetNameNicknamed] için yüce bir ödül ve onun yönetimi Dokuzlar Çetesi'ni cesaretlendirecek: Sanat ve bilim meseleleri beni pek ilgilendirmese de, Myr Denizi Westeros'a giden yolda stratejik bir basamak sağlıyor.\n\nGücümüz artıyor, ama tehlike de öyle. Yedi Krallık, kolektif güçlerini rengârenk ittifakıma karşı her an getirebilir."

 agot_ninepenny.0002.desc.stepstones:0 "Dokuzlar Çetesi artık Adımtaşları elinde tutarken Demir Taht'a saldırı mesafesindeyim — tutması güçlü, ama koruması kırılgan bir konum. Düşmanlarım hiç şüphesiz büyüyen Blackfyre Ordusu'nu fark edecek; Yedi Krallık'a kendim yürümezsem her an saldırıya hazır olmalıyım.\n\nDoğum hakkım o kadar yakın ki, tadını alabiliyorum... Kan ve demirin metalik tadı... Kaderim, Kara Ejderha'nın hayali, beni bekliyor."

 agot_ninepenny.0002.desc:0 "[claimant.GetName]'in erken ölümüyle, ölmüş bir [claimant.GetWomanMan] için savaşı sürdürmemiz için çok az sebep kaldı. Dikkatimizi daha acil meselelere çevireceğiz.\n\nBuraya tam olarak nasıl geldik? Hepimiz birbirimize bakıyoruz; Dokuzlar Çetesi'nin her üyesi diğeri kadar şaşkın. Peki, neden küçük bir savaş yapmıyoruz?"

 agot_ninepenny.0003.t:0 "$agot_ninepenny.0001.t$"

 agot_ninepenny.0003.desc:0 "#bold Demir Taht artık benim!#!\n\nBüyükbabamın, sahte kral Daeron'un gözünden düşmesinden yıllar sonra, bir Blackfyre nihayet haklı olarak Yedi Krallık'ın tahtına oturuyor. Ama diyarımda meşruiyetimden şüphe edecekler olacak; Westeros'un boynunu sıkmak için elimden geleni yapmak bana yakışır.\n\nBir Targaryen gelini alırsam, hiç kimse çocuklarımızın soyundan şüphe etmez. Bir kocanın varlığı bir sorun... ama aşılmaz bir sorun değil."

 agot_ninepenny.0003.a:0 "Yeni gelinimi alacağım."

 agot_ninepenny.0003.b:0 "Şunun görünüşü hoşuma gidiyor."

 agot_ninepenny.0003.c:0 "Kendi gelinimi kendim seçeceğim!"

 agot_ninepenny.0004.t:0 "$agot_ninepenny.0001.t$"

 agot_ninepenny.0004.desc:0 "Essos'ta, Dokuzlar Çetesi olarak bilinen korsanlar ve paralı askerlerden oluşan rengârenk ittifak, endişe verici bir hızla başarı kazanıyor... [councillor.GetName] bana, kendisine [maelys.GetTitledFirstNameNicknamedRegnal] diyen bu adamın ilk başta hayal edilenden daha büyük bir tehdit olabileceğini söylüyor — kendisinin ve yükselmiş paralı askerler ile katillerden oluşan sarayının elde ettiği başarılarla cesaretlenmiş."

 agot_ninepenny.0004.a:0 "Önleyici bir saldırı en iyisi olacak."

 agot_ninepenny.0004.a.tt:0 "Blackfyre taht iddiacısına ve müttefiklerine karşı sancakları çağıracaksın."

 agot_ninepenny.0004.a.summerhall:0 "Summerhall planlarından vazgeçeceksin."

 agot_ninepenny.0004.b:0 "Bu Dokuz Peni Krallar endişemiz değil."

 agot_ninepenny.0005.t:0 "Bir Saldırı"

 agot_ninepenny.0005.desc:0 "[mesenger.GetName] bana talihsiz bir haberle geliyor: [king.Custom('InsultAdjective')] [king.GetName] kuvvetlerini toplamaya başlamış... Şimdi vurmalıyız, yoksa iddiam tarihe karışır!"

 agot_ninepenny.0005.a:0 "#bold Savaşa!#!"

 agot_ninepenny.0008.t:0 "Geyik ve Canavar"

 agot_ninepenny.0008.desc:0 "Savaşın ortası, kendimi #bold canlı#! hissettiğim yerdir. Yoluma çıkan şanssız bir velet gibi değil. Kılıcımın tek bir savuruşu bir düşman askerini temiz biçimde ikiye böler... şey, kan hariç temiz biçimde #bold kan#!.\n\nÖnümde, öncü ile artçı arasındaki küçük bir açıklıkta onu görüyorum: [baratheon.GetFullNameNicknamed]; sancağındaki geyik açıkça Evi [baratheon.GetHouse.GetName]'den. Böyle bir rakip benim için kolay iş olur ve bu geyik gibi birini öldürürsem Targaryen taht iddiacıları çılgına döner.\n\n[location.GetName], [baratheon.GetFirstNamePossessiveNoTooltip] sonu olacak."

 agot_ninepenny.0008.a:0 "Kendini hazırla, geyik."

 agot_ninepenny.0009.t:0 "Canavar ve Geyik"

 agot_ninepenny.0009.desc:0 "Savaşın gelgiti bir fırtınaya benzer — kılıçların ve kalkanların birbirine çarpışı, gök gürültüsü gibi. Etrafımdaki adamlar, kaderleri bıçakla mühürlenmiş halde yere düşüyor.\n\nÖnümde, kan ve bağırsaklar fışkırarak ikiye bölünen bir asker izliyorum; saldıranını ortaya çıkarıyor: Cehennemden fırlamış bir çehre, [maelys.GetFullNameNicknamed]. Önümüzdeki küçük açıklıktan beni açıkça görüyor ve bana doğru çılgınca bir atak başlatıyor.\n\n[baratheon.Custom('SignatureWeaponNameOrType')]'imi kaldırıyorum ve Savaşçı'nın bana güç vermesi için dua ediyorum."

 agot_ninepenny.0009.a:0 "[ROOT.Char.GetHouse.GetMotto]."

 agot_ninepenny.0013.t:0 "Buğday Şövalyesi"

 agot_ninepenny.0013.desc:0 "Kıskaçlı yumruğum, bir zamanlar adamın yüzü olan kızıl sisten geri çekiliyor. Buğday armalı şövalyeyi bir kenara fırlatıp, azgın savaşın kükürtüyle ciğerlerimi dolduruyorum. Haklı kralı öldürmeye çalışacak sıradaki adam gelsin.\n\nBir böğürtü duyuyorum ve önümde bir çelik bulutu, benim armamı taşıyan adamları biçiyor. Sonunda, #bold layık bir meydan okuma#! bulmuş olabilirim."

 agot_ninepenny.0013.a:0 "Bu buğday şövalyesi harmanlanacak..."

 agot_ninepenny.0014.t:0 "Taht İddiacısı"

 agot_ninepenny.0014.desc:0 "Bir prens tarafından bahşedilen [selmy.GetNickname] lakabına liyakatsiz ulaşılmaz. Savaş alanındaki hâkimiyetim eşsiz; taht iddiacısının askerlerinin arasından, olgun buğday başaklarını biçen bir tırpan gibi kanlı bir yol açıyorum.\n\nÖnümde düşmanımı görebiliyorum; benimkine denk bir lakabı olan biri: [maelys.GetNickname]. Efsanemin hakkını verme zamanı... #bold tanrının hatasını öldürme#! zamanı."

 agot_ninepenny.0014.a:0 "Savaşçı bana güç versin."

 agot_ninepenny.0020.t:0 "Whingerler Toplanıyor"

 agot_ninepenny.0020.desc:0 "Demir Taht'a oturduğum an, [spokesperson.GetFirstNameNicknamed] yaklaşıyor; [spokesperson.GetHerHis] gözünde açgözlülük parıldıyor.\n\n"Madem ki kıymetli krallığını aldın, Majesteleri," diyor [spokesperson.GetFirstNameNoTooltip], neredeyse alaycı bir tonla, "her birimize kendi krallıklarımızı oymamız için verdiğin yeminini tutacak mısın?""

 agot_ninepenny.0020.a:0 "Sanırım gerçekten söz vermiştim..."

 agot_ninepenny.0020.b:0 "Defolun gidin, sizler."

 agot_ninepenny.0022.t:0 "$agot_ninepenny.0001.t$"

 agot_ninepenny.0022.desc:0 "Demir Taht savaşı bitmiş olabilir, ama Dokuzlar Çetesi'nin önünde daha çok zafer var. Kılıçlarımız daha kınına girmeden düşmanlarımız bize karşı harekete geçecek.\n\n[ninepenny_king.GetFirstNameNicknamed] [ninepenny_king.GetHerHis] kendine ait bir krallık iddia etme arzusuyla yaklaşıyor — ve arkamda Yedi Krallık'ın gücüyle, ona [ninepenny_king.GetHerHim] vermeyi amaçlıyorum."

 agot_ninepenny.0023.t:0 "Krallar Çetesi"

 agot_ninepenny.0023.loner:0 "Son fethin tozu dindi ve #bold benim#! Demir Taht'ımın önünde tek başıma duruyorum: Andalların, Rhoynarların ve İlk İnsanların gerçek Kralı!\n\nDokuzlar Çetesi'nin geri kalanı can vermiş olsa da, şimdi son sınavımla yüzleşiyorum... fethettiklerimizi yönetmek. #weak Rengârenk çetemin geri kalanı artık birer hayalet olsa da...#!"

 agot_ninepenny.0023.desc:0 "Son fethin tozu dindi ve Dokuzlar Çetesi, #bold benim#! Demir Taht'ımın önünde bir kez daha toplandı. [ninepenny_king.GetFirstNameNicknamed], Andalların, Rhoynarların ve İlk İnsanların gerçek Kralı [ROOT.Char.GetFullNameNicknamedRegnal]'in şerefine kadeh kaldırıyor!\n\nSavaşlar kazanıldı, krallıklarımız fethedildi... Şimdi rengârenk çetemizin sonu geldi; #bold şimdi, hükmetmeliyiz.#!"

 agot_ninepenny.0023.a:0 "Uzun süre hüküm sürelim!"

 agot_ninepenny.0024.t:0 "$agot_ninepenny.0001.t$, Dağılıyor"

 agot_ninepenny.0024.desc:0 "[claimant.GetFirstNameNicknamed]'i tahta oturtmanın başarısızlığıyla, rengârenk Dokuzlar Çetesi bir yol ayrımıyla karşı karşıya... Zaferin kanatlarında uçmak bizi ileri taşıdı; yenilginin acısı bizi söndürdü.\n\nDüşüncesizce bir savaşa daha atılmak yerine, kendi diyarlarımıza dönmeye, kendi zaferlerimizle yetinmeye karar verdik."

 agot_ninepenny.0024.a:0 "Dağılacağız."

 agot_ninepenny.0030.prefix:0 "Sadakat Ödüllendirildi:"

 agot_ninepenny.0030.t:0 "$agot_ninepenny.0030.prefix$ Yaşlı Anne"

 agot_ninepenny.0030.desc:0 "Yedi Krallık'ı kontrol ettiğime göre, destekçilerimin sadakatini ödüllendirmeliyim. Savaşın iyi ve kötü günlerinde, korsan kraliçesi [old_mother.GetNameNicknamed], fethime verdiği destekte sebatlı kaldı. Bu bağlılıkla, Adımtaşlar'ın hükümdarı olarak sadık bir tebaa olurdu."

 agot_ninepenny.0030.a:0 "Evet, Yaşlı Anne iddiasına kavuşacak."

 agot_ninepenny.0030.b:0 "Hayır, o kayalık adaları pek seviyorum."

 agot_ninepenny.0031.t:0 "Kendime Ait Bir Krallık"

 agot_ninepenny.0031.desc:0 "Rengârenk Dokuzlar Çetesi en büyük fetihimizi tamamladı: [maelys.GetFullNameNicknamedRegnal]'i, #bold onun#! doğum hakkı olduğu gibi, Demir Taht'a oturttuk. Bir ulak beni Kızıl Kale'nin taht odasına çağırıyor; [maelys.GetFirstNameNoTooltip] beni alışılmış tavrından belirgin biçimde farklı, sıcak bir şekilde karşılıyor.\n\n"[ROOT.Char.GetFirstNameNicknamed], savaşlarımızda bana sadakatle hizmet ettin," diyor; deforme yüzünde belki bir gülümseme iması. "Bu sadakat için, sana Adımtaşlar Krallığı'nı bahşedeceğim.""

 agot_ninepenny.0031.a:0 "Beni onurlandırdınız, Majesteleri."

 agot_ninepenny.0031.a.tt:0 "Biçimsiz ikinci kafası bile gülümsüyor gibi. Ne manzara!"

 agot_ninepenny.0032.t:0 "$agot_ninepenny.0030.prefix$ Çürük Elma"

 agot_ninepenny.0032.desc:0 "Yedi Krallık'ı kontrol ettiğime göre, destekçilerimin sadakatini ödüllendirmeliyim. Evi [bad_apple.GetHouse.GetName]'in Reach'te derin kökleri var ve [bad_apple.GetFullNameNicknamed] iyi — uysal — bir Yüce Lord olurdu. Belki de Çürük Elma'ya Reach'in kontrolünü vermeliyim?"

 agot_ninepenny.0032.a:0 "Evet, hükümdarlığımı destekleyecek."

 agot_ninepenny.0032.b:0 "Hayır, işleri olduğu gibi bırakmayı tercih ederim."

 agot_ninepenny.0033.t:0 "$agot_ninepenny.0031.t$"

 agot_ninepenny.0033.desc:0 "Rengârenk Dokuzlar Çetesi en büyük fetihimizi tamamladı: [maelys.GetFullNameNicknamedRegnal]'i, #bold onun#! doğum hakkı olduğu gibi, Demir Taht'a oturttuk. Bir ulak beni Kızıl Kale'nin taht odasına çağırıyor; [maelys.GetFirstNameNoTooltip] beni alışılmış tavrından belirgin biçimde farklı, sıcak bir şekilde karşılıyor.\n\n"[ROOT.Char.GetFirstNameNicknamed], savaşlarımızda bana sadakatle hizmet ettin," diyor; deforme yüzünde belki bir gülümseme iması. "Bu sadakat için, sana Reach Krallığı'nı bahşedeceğim.""

 agot_ninepenny.0033.a:0 "$agot_ninepenny.0031.a$"

 agot_ninepenny.0033.a.tt:0 "Bir an için biçimsiz ikinci kafasının sırıttığını görmeye yemin ediyorsun..."

 agot_ninepenny.0034.t:0 "$agot_ninepenny.0030.prefix$ Abanoz Prens"

 agot_ninepenny.0034.desc:0 "Yedi Krallık'ı kontrol ettiğime göre, destekçilerimin sadakatini ödüllendirmeliyim. Yaz Adaları erişimimin dışında olsa da, belki Abanoz Prens'i güçlü Dragonstone koltuğuyla tatmin edebilirim?"

 agot_ninepenny.0034.a:0 "Onun yönetimi yalnızca benimkini güçlendirir."

 agot_ninepenny.0034.b:0 "Hayır, Dragonstone doğru değil."

 agot_ninepenny.0035.t:0 "$agot_ninepenny.0031.t$"

 agot_ninepenny.0035.desc:0 "Rengârenk Dokuzlar Çetesi en büyük fetihimizi tamamladı: [maelys.GetFullNameNicknamedRegnal]'i, #bold onun#! doğum hakkı olduğu gibi, Demir Taht'a oturttuk. Bir ulak beni Kızıl Kale'nin taht odasına çağırıyor; [maelys.GetFirstNameNoTooltip] beni alışılmış tavrından belirgin biçimde farklı, sıcak bir şekilde karşılıyor.\n\n"[ROOT.Char.GetFirstNameNicknamed], savaşlarımızda bana sadakatle hizmet ettin," diyor; deforme yüzünde belki bir gülümseme iması. "Yaz Adaları'nı sana sunabilmeyi dilerdim; umarım Dragonstone, süregelen sadakatine layıktır.""

 agot_ninepenny.0035.a:0 "$agot_ninepenny.0031.a$"

 agot_ninepenny.0035.a.tt:0 "Daha önce biçimsiz ikinci kafasının hiçbir hareket yaptığını görmemiştin; ama bakışı dosdoğru sana dikiliyor. İzliyor. Bekliyor."

 agot_ninepenny.0036.t:0 "$agot_ninepenny.0030.prefix$ Kasap"

 agot_ninepenny.0036.desc:0 "Yedi Krallık'ı kontrol ettiğime göre, destekçilerimin sadakatini ödüllendirmeliyim. İhtilaflı Topraklar, destekçim [butcher.GetFirstNameNicknamed] gibi itibarsız... ve yeni tahtımdan uzak. Belki de İhtilaflı Topraklar'ı ona bahşetmeliyim; sadakatiyle beni desteklemeye devam edeceğini bilerek?"

 agot_ninepenny.0036.a:0 "Bir Kasap için iyi bir yer."

 agot_ninepenny.0036.b:0 "Hayır, o topraklar için başka planlarım var."

 agot_ninepenny.0037.t:0 "$agot_ninepenny.0031.t$"

 agot_ninepenny.0037.desc:0 "Rengârenk Dokuzlar Çetesi en büyük fetihimizi tamamladı: [maelys.GetFullNameNicknamedRegnal]'i, #bold onun#! doğum hakkı olduğu gibi, Demir Taht'a oturttuk. Bir ulak beni Kızıl Kale'nin taht odasına çağırıyor; [maelys.GetFirstNameNoTooltip] beni alışılmış tavrından belirgin biçimde farklı, sıcak bir şekilde karşılıyor.\n\n"[ROOT.Char.GetFullNameNicknamed], savaşlarımızda bana sadakatle hizmet ettin," diyor; deforme yüzünde belki bir gülümseme iması. "Bu sadakat için, sana İhtilaflı Topraklar Krallığı'nın hükümdarlığını bahşedeceğim.""

 agot_ninepenny.0037.a:0 "$agot_ninepenny.0031.a$"

 agot_ninepenny.0037.a.tt:0 "Biçimsiz ikinci kafası da gülümsüyor mu? Jimhaerys gözlerinin içine — ve ruhunun derinliklerine — bakıyor."

 agot_ninepenny.0040.t:0 "Doğmamış Taht İddiacısı"

 agot_ninepenny.0040.desc:0 "Görünüşe göre yeni karım [wife.GetFullName]'in şişmekte olan karnında kızıl bir ejderha piçi var. Bu, hükümdarlığımın ilerleyen dönemlerinde sorun çıkarabilir. İlk düşüncem bıçağı kapıp onu çıkarmak, ama Üstat [maester.GetFirstName] bunun yeni karımı öldürebileceğini söylüyor. Sorunu benim için çözecek bir çay öneriyor..."

 agot_ninepenny.0040.a:0 "Deli ay çayını içecek."

 agot_ninepenny.0040.a.success.tt:0 "[wife.GetFirstName] ay çayını içti"

 agot_ninepenny.0040.b:0 "Ben [ROOT.Char.GetFirstNameNicknamedNoTooltip]'im! Bir bebektten korkmam."

 agot_ninepenny.0041.t:0 "$agot_ninepenny.0040.t$"

 agot_ninepenny.0041.desc:0 "Üstat [maester.GetName] ciddi bir ifadeyle bana geliyor. Elbette [maester.GetSheHe] içimde büyüyenin ne olduğunu — ve böyle bir çocuğun yeni kral için oluşturacağı tehdidi — biliyor.\n\n"Majesteleri, kral size belirli bir... ilaç hazırlamamı emretti," diye mırıldanıyor [maester.GetFirstNameNoTooltip]; [maester.GetHerHis] sözleri acıyla boş çınlıyor. "Çayı burada bırakıp dışarıda bekleyeceğim. Lütfen, en iyisi bu..."\n\n[maester.GetSheHe] odamdan çıkarken, [helaena.GetFullName]'yi ve yavrularını kaybetmekle yüzleştiğinde yaptığı seçimi düşünmeden edemiyorum... Yakındaki pencere aralık ve Maegor'un Kalesi'ni çevreleyen kuru hendeğin demir kazıkları bana bu hapishaneden bir kurtuluş sunar."

 agot_ninepenny.0041.a:0 "Ay çayını, kendi güvenliğim için içeceğim."

 agot_ninepenny.0041.a.success.tt:0 "[wife.GetFirstName] ay çayını içti"

 agot_ninepenny.0041.b:0 "Bu hayat yaşamaya değmez."

 agot_ninepenny.0042.t:0 "$agot_ninepenny.0040.t$"

 agot_ninepenny.0042.desc:0 "Üstat [maester.GetName], çaresiz bir ifadeyle yatak odama koşarak geliyor; [maester.GetHerHis] gözleri korkudan — ya da bu keder mi? — çılgın.\n\n"Majesteleri, ben çok... üzgünüm..." Haberin ağır olduğunu anlayabiliyorum, ama [maester.GetHerHis] sonraki sözleri zalim yüreğime bile acı ve utanç saplıyor: Karım [wife.GetFirstName], hamileliğine son vermek için ay çayını içmek yerine kendini pencereden aşağı atmış. Maegor'un Kalesi'ni çevreleyen kuru hendeğin demir kazıkları onu hizmetimden azat etti."

 agot_ninepenny.0042.a:0 "Ellerimde daha fazla [wife.GetHouse.GetName] kanı."

 agot_ninepenny.0042.b:0 "#bold Sen#! bunun olmasına izin verdin, üstat!"

 agot_ninepenny.0050.t:0 "Reyne Anıları"

 agot_ninepenny.0050.desc:0 "Ser [robb.GetFullNameNicknamed], Daemon Blackfyre'ın asil kahramanlar birliğinin üyelerinden biriydi. Her dönemin en iyi şövalyelerinden biri, Kara Ejderha'nın iddiasını desteklerken yiğitçe can verdi.\n\nŞimdi, doğuda yeni bir ejderha yükseliyor: [maelys.GetFullNameNicknamed]. İçgüdüm savaşın dışında kalıp [throne.GetFullNameNicknamedRegnal]'in savaşı nasıl yürüttüğünü değerlendirmek olsa da... [robb.GetFirstNamePossessive] mirasını bu çatışmaya taşıma fırsatı cezbedici..."

 agot_ninepenny.0050.a:0 "Kara Ejderha için!"

 agot_ninepenny.0050.b:0 "Bu düşünceler budalaca."

 agot_ninepenny.0060.t:0 "Saan'ın Parşömenleri"

 agot_ninepenny.0060.desc:0 "[saan.GetTitledFirstName] bana, Volantis'e yaptığı bir baskında aldığını iddia ettiği kadim Valyria parşömenlerinden bir hediye getirdi. Kadim anavatanımın dili bana iyi bilinir ve bu parşömen sayfalarının sunduğu sırlar merak uyandırıcı.\n\nEjderhaların nasıl uyandırılacağını — ve bunun bedelini — anlatıyorlar. Westeros'u geri alırsam, son yaşayan ejderha hiç şüphesiz meşruiyetimi pekiştirir. Ama ödenecek bedel ağır: #bold kral kanı#! kurbanı."

 agot_ninepenny.0060.desc_alt:0 "[saan.GetTitledFirstName]'in ölümünün ardından, varisleri bir hediyeyle huzuruma çıktı. Volantis'e yaptığı bir baskın sırasında aldığına inandıkları kadim Valyria parşömenlerini sunuyorlar. Kadim anavatanımın dili bana iyi bilinir ve bu parşömen sayfalarının sunduğu sırlar merak uyandırıcı.\n\nEjderhaların nasıl uyandırılacağını — ve bunun bedelini — anlatıyorlar. Westeros'u geri alırsam, son yaşayan ejderha hiç şüphesiz meşruiyetimi pekiştirir. Ama ödenecek bedel ağır: #bold kral kanı#! kurbanı."

 agot_ninepenny.0060.a:0 "Oğlumun damarlarında kral kanı akıyor..."

 agot_ninepenny.0060.a.tt:0 "[maenar.GetName]'i kurban edeceksin"

 agot_ninepenny.0060.b:0 "Bu parşömenler yalnızca ucuz bir biblio olabilir."

 agot_ninepenny.0061.t:0 "Odun Yığını"

 agot_ninepenny.0061.desc:0 "Adamlarım ateşi kurdu; kuru çıra arasına, çocukluğumdan beri yanımda taşıdığım taş yumurta kümesini yerleştirdi. Emri veriyorum ve oğlum çadırından refakatle getiriliyor. Önünde duranı görünce paniğe kapılıyor; yüzüne korku ve idrak yayılıyor.\n\nAma korkacak bir şey yok; o, duman ve ateş arasında en güçlü yırtıcının biçiminde yeniden doğacak. Eti pullarla takas edecek ve Ejderhaların Babası tahtını geri alacak."

 agot_ninepenny.0061.a:0 "Kurbanın layık bir kurban!"

 agot_ninepenny.0061.a.tt:0 "Ejderhaları uyandır..."

 agot_ninepenny.0062.t:0 "Ejderha Hayallerinin Söndüğü"

 agot_ninepenny.0062.desc:0 "Çığlıklar... delici ve tiz, sonra sessizlik. Koku, fazla kızgın bir mangalda fazla uzun bırakılmış et ve çıtırtı gibi. Ve son kor kömürleri söndükten sonra taş yumurtalar aynen duruyordu, değişmemiş. Oğlumun kurbanı... hiçbir şey yapmadı.\n\n"

 agot_ninepenny.0062.rage:0 "Bu idrak içime işlerken, içimde kontrol edilemez bir öfkenin kabardığını hissediyorum. Bir öfke seli üzerime boşalıyor, gözlerim kararıyor. Biçimsiz yumruğumun uyanmamış ejderha yumurtalarını parçaladığı hissini yalnızca kısaca fark ediyorum... Sonra, yeniden sessizlik.\n\nKırık taş yumurtaların parçaları ellerimi kesiyor ve ejderhanın kızıl kanı ön kollarımdan parlak biçimde akıyor."

 agot_ninepenny.0062.sad:0 "Bu idrak içime işlerken... hissizleşiyorum. Kurum yığınına yaklaşıp taş yumurtaları sakin bir kayıtsızlıkla yerden alıyorum. Anın sessizliği, arkamdaki dalga çarpışıyla bozuluyor; beni suya çekiyor.\n\nBu yumurtalar, atalarımın bir zamanlar büyük olan hanesinin yalnızca bir nişanesi — ama gerçek güç, damarlarımdaki ejderha kanından gelir. Soğuk bir savuruşla yumurtaları denize fırlatıyorum."

 agot_ninepenny.0062.a:0 "Demir Taht'ı #bold alacağım#!."

 agot_ninepenny.0063.t:0 "Bir Güneş İçin Bir Oğul"

 agot_ninepenny.0063.desc:0 "[maenar.GetFirstName]'in tiz çığlıkları gece boyunca yankılanıyor; alevler vücudunu yalarken bir çocuğun acısının sesi. Neredeyse sendeleyeceğim, ama ejderhanın yeniden doğuşu düşüncesi beni sağlamlaştırıyor. Alevler yükseliyor, yanan et kokusu havayı dolduruyor ve çığlıklar sessizliğe dönüşüyor.\n\nBir an için en kötüsünden korkuyorum, ama sessizlik dayanılmaz hale gelir gelmez, gece boyunca ve dünyanın her yerinde yüksek bir çatırtı yankılanıyor.\n\nGözlerimin önünde tek bir ejderha yumurtası çatlıyor ve küçük, pullu bir kafa dışarı çıkıyor."

 agot_ninepenny.0063.a:0 "Ejderhalar geri döndü!"

 agot_ninepenny.0064.t:0 "Kara Ejderha Yükseliyor!"

 agot_ninepenny.0064.desc:0 "Haber, Yedi Krallık'ta ve ötesinde yabani ateş gibi yayıldı — ejderhalar geri döndü!\n\n[maelys.GetName]'in, son ejderhaları uyandırmak için umutsuz bir girişimde kendi oğlunu kurban ederek bazı kadim Valyria parşömenlerinden kutsal olmayan bir ritüel gerçekleştirdiğini söylüyorlar. Westeros'un dehşetine ve Dokuzlar Çetesi'nin sevincine, ritüel başarılı oldu!\n\nKara Ejderha artık doğuda yükseliyor ve Targaryenler, bir zamanlar hükmettikleri şeyle yüzleşiyor: bir ejderha lorduunun gücüyle."

 agot_ninepenny.0064.a.maelys_positive:0 "Hayret verici bir gelişme!"

 agot_ninepenny.0064.a.maelys_negative:0 "Dünya bu korkunç haberle sarsılıyor!"

 agot_ninepenny.0065.t:0 "Kara Ejderha Yükseliyor!"

 agot_ninepenny.0065.desc:0 "Haber, Yedi Krallık'ta ve ötesinde yabani ateş gibi yayıldı — ejderhalar geri döndü!\n\n[maelys.GetName]'in, son ejderhaları uyandırmak için umutsuz bir girişimde kendi oğlunu kurban ederek bazı kadim Valyria parşömenlerinden kutsal olmayan bir ritüel gerçekleştirdiğini ve ritüelin başarılı olduğunu söylüyorlar!\n\nTüm hazırlıklarım ve tüm araştırmalarım bir yana, ejderhaları geri getiren bir Blackfyre oldu.\n\nCan için can, ödemek zorunda kalacağım bedel gerçekten bu mu?"

 agot_ninepenny.0065.a:0 "Ne gerekiyorsa yapmalıyız"

 agot_ninepenny.0065.b:0 "Hayır, buna katlanamam"

 agot_ninepenny.shatter_band_oathbreaker_tooltip:0 "Yeminini bozmak Dokuzlar Çetesi ittifaklarını parçalayacak"

 agot_ninepenny.shatter_band_loss_tooltip:0 "Bu kayıp Dokuzlar Çetesi ittifaklarını parçalayacak"

 agot_ninepenny.1000.t:0 "Ejderhanın Mirası"

 agot_ninepenny.1000.desc:0 "Şarkıcıların haklı olarak 'Yusufçuk Prensi' dediği asi ilk doğanım [duncan.GetFirstNameNicknamed], Dragonstone'dan çok hayırlı bir kuzgun haberi getirdi: Torunum [rhaella.GetFirstName] ilk torun torunuma hamile!\n\nO ve kardeşi [aerys.GetFirstName], isteklerime aynı şekilde karşı gelmiş ebeveynlerinin buyruğuyla, [ROOT.Char.GetHouse.GetName] geleneğine uygun biçimde birbirleriyle evlenmiş olsalar da, en azından ejderha kanı güçlü kalıyor ve soyumuz dördüncü nesle dek güvende!\n\nMuhteşem bir kutlama yapmanın zamanı geldi. İradeli ve inatçı hanemin her ferdini ortak bir amaç için bir araya toplayan bir kutlama. Belki de babam Maekar'ın eski makamı Summerhall'da görkemli bir ziyafet?"

 agot_ninepenny.1000.a:0 "#bold Ejderha hanesi#! kutlamak için toplanacak!"

 agot_ninepenny.1000.b:0 "Hayır, Summerhall olmaz. Babamın anısı beni acıtıyor."

 agot_ninepenny.1002.t:0 "Dilde Kül"

 agot_ninepenny.1002.desc:0 "Kadim haklarının kısıtlandığı konusunda sızlanan lordların ve şövalyelerin bitmek bilmeyen dilekçelerini ve zar zor gizlenmiş tehditlerini ayıklarken kendimi kambur ve ağrılı buluyorum. Öyle kibirli adamlar ki, varisimin adaşı gibi bilgelikle yönetmek yerine, spor için küçük halkı çiğnemeyi tercih ediyorlar.\n\nGümüş diller ve çelik kılıçlar o inatçı dizleri bükemeyecekse, belki ejderha ateşi yüreklerini alçakgönüllü kılar. Topladığım her ejderha bilgisi parçasını baştan sona tarıyorum; Sitadel'den Asshai'ye üstatların, bilge kadınların ve âlimlerin saçmalıklarını umutsuzca yorumluyorum ama cevap elimden kaçıyor!\n\n#WF Yabani ateş...#! Kelime, [aerion.GetFirstNameNicknamed]'in gece yarısı ziyareti gibi düşüncelerime süzülüyor. Simyagerler Loncası'nın piromancıları bu maddeyi herkesten iyi bilir. Kardeşim deli ve zalim olsa da, ölümü #italic anlamsız#! görünse de, basit bir gerçeği kavramıştı: ejderhalar #bold ateş ve kandan#! doğar."

 agot_ninepenny.1002.a:0 "Büyük Üstat'ı çağır. Konuşacak çok şeyimiz var."

 agot_ninepenny.1003.t:0 "Yaz Sarayı"

 agot_ninepenny.1003.desc.rhae_dead:0 "Ejderha hanesi toplanıyor! Ailemizi bir kez daha bir arada görmek yüreğimi ısıtıyor.\n\nHiçbiri Evi [ROOT.Char.GetHouse.GetName]'i bekleyen görkemi anlamıyor... Gün bitmeden gücümüz yeniden kurulacak ve hanedanımızın simgesi bir kez daha kükreyerek canlanacak!\n\nHazırlıklar yapıldı ve bana sadık olanlar yerlerini aldı. #bold Ejderhaların#! gücüyle, Yedi Krallık'taki tüm lordlar diz çökecek... ama önce ziyafet çekeriz!"

 agot_ninepenny.1003.desc.egg:0 "Ejderha hanesi toplanıyor! Yoldan çıkmış çocuklarımın, torunlarımın ve hatta bazı kuzenlerimin geldiğini görüyorum. Ailemizin [rhaella.GetFirstName] ve [aerys.GetFirstName]'i tebriklerle kuşattığını ve [jae.GetFirstName]'in çocuklarıyla gururla parladığını izlemek yüreğimi ısıtıyor.\n\nHiçbiri, yaptığım fedakârlıklar yüzünden Evi [ROOT.Char.GetHouse.GetName]'i bugün bekleyen görkemi anlamıyor... yapmaya hâlâ razı olduğum fedakârlıklar yüzünden! Gün bitmeden gücümüz yeniden kurulacak ve hanedanımızın simgesi bir kez daha kükreyerek canlanacak!\n\nHazırlıklar yapıldı ve bana sadık olanlar yerlerini aldı. Artık meydan okuma yok, mazeret yok. Ailem #bold nihayet#! haklı olduğumu görecek ve sonra... Yedi Krallık'taki tüm lordlar diz çökecek... ama önce ziyafet çekeriz!"

 agot_ninepenny.1003.desc.jae:0 "Ejderha hanesi toplanıyor! Ailemizin [rhaella.GetFirstName] ve [aerys.GetFirstName]'i tebriklerle kuşattığını görmek yüreğimi ısıtıyor; ama babamın yokluğunda bir hüzün duymadan edemiyorum.\n\nHiçbiri, onun yaptığı fedakârlıklar yüzünden Evi [ROOT.Char.GetHouse.GetName]'i bugün bekleyen görkemi anlamıyor... mirasını onurlandırmak için yapmaya hâlâ razı olduğum fedakârlıklar yüzünden! Gün bitmeden gücümüz yeniden kurulacak ve hanedanımızın simgesi bir kez daha kükreyerek canlanacak!\n\nHazırlıklar yapıldı ve bana sadık olanlar yerlerini aldı. #bold Ejderhaların#! gücüyle, Yedi Krallık'taki tüm lordlar diz çökecek... ama önce ziyafet çekeriz!"

 agot_ninepenny.1003.desc.aerys:0 "Ejderha hanesi toplanıyor! Ailemizin sevgilim [rhaella.GetFirstName]'i tebriklerle kuşattığını görmek yüreğimi ısıtıyor; ama [ROOT.Char.Custom2('RelationToMeShort', egg)] [egg.GetFirstName] ve [ROOT.Char.Custom2('RelationToMeShort', jae)] [jae.GetFirstName]'in yokluğunda bir hüzün duymadan edemiyorum.\n\nKonukların hiçbiri, [egg.GetFirstNameNoTooltip]'in yaptığı fedakârlıklar yüzünden Evi [ROOT.Char.GetHouse.GetName]'i bugün bekleyen görkemi anlamıyor... mirasını onurlandırmak için yapmaya hâlâ razı olduğum fedakârlıklar yüzünden! Gün bitmeden gücümüz yeniden kurulacak ve hanedanımızın simgesi bir kez daha kükreyerek canlanacak!\n\nHazırlıklar yapıldı ve bana sadık olanlar yerlerini aldı. #bold Ejderhaların#! gücüyle, Yedi Krallık'taki tüm lordlar diz çökecek... ama önce ziyafet çekeriz!"

 agot_ninepenny.1003.desc.fallback:0 "Ejderha hanesi toplanıyor! Ailemizin [rhaella.GetFirstNameOrMe]'i tebriklerle kuşattığını görmek yüreğimi ısıtıyor; ama [ROOT.Char.Custom2('RelationToMeShort', egg)] [egg.GetFirstName]'in yokluğunda bir hüzün duymadan edemiyorum.\n\nKonukların hiçbiri, [egg.GetFirstNameNoTooltip]'in yaptığı fedakârlıklar yüzünden Evi [ROOT.Char.GetHouse.GetName]'i bugün bekleyen görkemi anlamıyor... mirasını onurlandırmak için yapmaya hâlâ razı olduğum fedakârlıklar yüzünden! Gün bitmeden gücümüz yeniden kurulacak ve hanedanımızın simgesi bir kez daha kükreyerek canlanacak!\n\nHazırlıklar yapıldı ve bana sadık olanlar yerlerini aldı. #bold Ejderhaların#! gücüyle, Yedi Krallık'taki tüm lordlar diz çökecek... ama önce ziyafet çekeriz!"

 agot_ninepenny.1003.a:0 "Akrabalarım! Summerhall'a hoş geldiniz!"

 invited_to_summerhall:0 "[attendee.GetNameNicknamed] Summerhall'a yolculuk ediyor"

 going_to_summerhall:0 "[attendee.GetNameNicknamed] Summerhall'a ulaştı"

 agot_ninepenny.1004.t:0 "$agot_ninepenny.1003.t$: Piromansi"

 agot_ninepenny.1004.desc:0 "Şenliklerin bir duraklamasında, yaklaşan girişimin bazı ince ayrıntılarını [pyromancer.GetName] ile ayarlamak için sıvışıyorum. [pyromancer.GetHerHim]'e ulaşamadan, [beseecher.GetName] bana yaklaşıyor; gözleri korkudan iri, acılı bir fısıltıyla konuşuyor: "Majesteleri, lütfen! Planladığınız şey — bu büyücülük! Hayır, daha kötüsü — #bold kan büyüsü#!"\n\n[beseecher.GetHerHis] endişelerini, ailemin benimkileri hep savuşturduğu şekilde savuşturuyorum; bir an bile düşünmeden. #S Ben#! artık kralım ve yalnızca #S ben#! yapılması gereken kurbanı emredebilirim.\n\n[pyromancer.GetFirstNameNoTooltip]'i buluyorum ve [pyromancer.GetSheHe] tüm şüpheleri gideriyor; loncasının uzmanlığına kefil oluyor ve ejderhaların geri döneceğini, Evi [ROOT.Char.GetHouse.GetName]'in görkemi ve gücüyle yeniden kurulacağını ilan ediyor."

 agot_ninepenny.1004.a:0 "Yalnızca #S ben#! ne yapılması gerektiğini biliyorum."

 agot_ninepenny.1004.b:0 "[beseecher.GetFirstNameNoTooltip] haklı, ben kördüm."

 agot_ninepenny.1005.t:0 "$agot_ninepenny.1003.t$: Tören"

 agot_ninepenny.1005.desc:0 "Konuklar, kaba cübbeli adamların dizildiği büyük salonda hararetli fısıltılar arasında toplanıyor; başlıklı yüzleri, taşıdıkları mumların hastalıklı yeşil titreyişiyle aydınlanıyor.\n\nTüm dikkat, salonun ortasındaki devasa mangalda: yanmamış kömürlerin üzerinde yedi yumurta yatıyor; aralarında beşik arkadaşım da var. Piromancıların üzerlerine sürdüğü sıvı ejderha alevi karışımıyla yeşilimsi bir cila parlıyorlar: #WF yabani ateş!#!\n\nRitüelin son bileşeni bir kurban..."

 agot_ninepenny.1005.blood:0 "Kral kanı yeterli olmalı..."

 agot_ninepenny.1005.self:0 "Bunu başka birinden isteyemem"

 agot_ninepenny.1005.rhaella:0 "Bu Rhaella'nın kaderi"

 agot_ninepenny.1005.duncan:0 "[ROOT.Char.Custom2('RelationToMeShort', duncan_alive)]... Çok üzgünüm"

 agot_ninepenny.1005.a:0 "Ejderhalar taştan uyanacak!"

 agot_ninepenny.1006.t:0 "$agot_ninepenny.1003.t$: Ahmaklığın Alevleri"

 agot_ninepenny.1006.egg_main:0 "#bold Ailem yanıyor!#! Kontrolden çıkan ritüel ateşinin akıl almaz sıcağıyla kirişler çatlıyor ve taşlar eğriliyor! Çevremdeki saray, #italic kibrimle#! alev almış — ailemi, parçalanan kirişlerin ve eriyen taşların altından çığlık atarlarken tek tek yutuyor. Duman, gözyaşlarımla boğulmama engel olamıyor...\n\n"

 agot_ninepenny.1006.main_fallback:0 "#bold Ailem yanıyor!#! Kontrolden çıkan ritüel ateşinin akıl almaz sıcağıyla kirişler çatlıyor ve taşlar eğriliyor! Çevremdeki saray alevler içinde — ailemi, parçalanan kirişlerin ve eriyen taşların altından çığlık atarlarken tek tek yutuyor. Duman, gözyaşlarımla boğulmama engel olamıyor...\n\n"

 agot_ninepenny.1006.dunc_egg:0 "Önümde bir biçim enkazı kenara itiyor. Sıcak ve duman arasından yalnızca kurum lekeli beyaz bir pelerin seçebiliyorum. [saviour.GetFirstNameNicknamed], yaralı ama hâlâ başkalarına yardım etmek için çabalayan, tüm bu yıllar boyunca sadık olduğu yerde yanıma koşuyor. Dostluğumuzu sonlandırmak için zor bir seçim kaldı."

 agot_ninepenny.1006.fallback:0 "Önümde bir biçim enkazı kenara itiyor. Sıcak ve duman arasından yalnızca kurum lekeli beyaz bir pelerin seçebiliyorum. [saviour.GetFirstNameNicknamed], yaralı ama hâlâ başkalarına yardım etmek için çabalayan, yanıma koşuyor. Kaos ve felaketin ortasında yalnızca tek bir son emir haykırabiliyorum."

 agot_ninepenny.1006.a:0 "Rhaella'yı kurtar, [ROOT.Char.Custom2('RelationToMeShort', rhaella)]!"

 agot_ninepenny.1006.b:0 "Duncan'ı buradan çıkar!"

 agot_ninepenny.1006.c:0 "Lütfen, beni buradan çıkar!"

 agot_ninepenny.1006.d:0 "Çocuğum... Lütfen, buradan çıkmam gerekiyor!"

 agot_ninepenny.1007.t:0 "$agot_ninepenny.1003.t$: Tuz ve Duman Arasında"

 agot_ninepenny.1007.desc:0 "#bold Ejderha hanesi diri diri yandı.#! Şarkıcıların çalacağı şarkılar bunlar. Duyanlar bizim için ağlar mı? Ders öğrenilene dek kaç kez başarısız olmalıyız? [ROOT.Char.Custom2('RelationToMeShort', egg)] daha iyi bilmeliydi. [aerion.GetFirstNameNicknamed]'den ne öğrendik? Summerhall'dan ne öğreneceğiz? Bütün bunlar #S anlamsızdı#!. [ROOT.Char.Custom2('RelationToMeShort', egg)|U], neden...?\n\nEn azından [rhaegar.GetFirstName] yıkımdan sağ çıktı. Üstatlar, stresin [rhaella.GetFirstNamePossessiveOrMy] doğumunu başlattığını söylüyor. Bundan ne çıkarsa çıksın, verasetin güvende olduğunu biliyoruz... ama hangi kral tacını böyle almak ister? Hangi çocuk, küllerinin saçıldığı kavrulmuş bir yığının üzerinde sevdiği ailesine elveda demek ister?"

 agot_ninepenny.1007.a:0 "Ne dehşetler yarattık?"

 agot_ninepenny.1007.a.tt:0 "[ROOT.Char.Custom2('RelationToMeShort', rhaegar)] [rhaegar.GetName] saraya kabul edilecek."

 agot_ninepenny.1008.t:0 "$agot_ninepenny.1003.t$: Trajedinin Kucağı"

 agot_ninepenny.1008.desc:0 "[saviour.GetFirstNameNicknamed] bizi kavrayıp Summerhall'ın dış mahallelerine koşturuyor. Bir teşekkür sözcüğü bile öksürüp çıkaramadan dumana ve alevlere dalıp gidiyor. Anlar sürünüyor; hizmetkârlar çığlık atıp harap saraydan kaçışırken — ama [saviour.GetFirstNamePossessive] beyaz pelerini, her şeyi yutan yangının içinden asla çıkmıyor.\n\n[egg.GetFirstNameNicknamedPossessiveRegnal]'in oğullarının hepsi arasından yalnızca ben, Evi [ROOT.Char.GetHouse.GetName]'in hesabından kurtuldum. Bu, diyar, ailem ve yüreğim için #bold sakatlayıcı#! bir darbe. Yapabildiğim tek şey, sevgili [jenny.GetFirstName]'ye sıkıca sarılmak ve aşk için bir kenara bırakmaya can attığım iddiayla ilerlemek."

 agot_ninepenny.1008.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_ruler'))] beni bir sebeple kurtardı..."

 agot_ninepenny.1009.t:0 "$agot_ninepenny.1003.t$: Kendi Ellerimle Yarattığım Trajedi"

 agot_ninepenny.1009.desc:0 "[saviour.GetFirstName] beni büyük salonun dumanlı kalıntılarından çıkarıyor. [saviour.GetHerHis|U] yüzü inanmazlıkla, sonra umutsuzlukla ve nihayet tam bir #bold hor görme#! ile çarpılıyor.\n\n[saviour.GetHerHis] bakışı altında solarım; hâlâ akan gözyaşları yanaklarımı yakarken. Bir şövalye ile [saviour.GetHerHis] yaveri arasında söz söylenmesine gerek yok. Emir almadan, [saviour.GetSheHe] sarayın yanan enkazına geri koşmak için dönüyor."

 agot_ninepenny.1009.a:0 "[saviour.GetSheHe|U] belki hâlâ birini kurtarabilir..."

 agot_ninepenny.1009.b:0 "[saviour.GetFirstNameNicknamedNoTooltip], sana emrediyorum: Kralının yanında kal!"

 agot_ninepenny.1010.t:0 "$agot_ninepenny.1003.t$: Geriye Ne Kalır?"

 agot_ninepenny.1010.desc:0 "Summerhall anısı, hayatımın geri kalanında beni takip edecek. Diğer tanıkların gözleri daha az boş değil. Hayatta kalanlar arasında ne neşe ne de kahkaha var. Gördüklerimize bir anlam vermeye çalışırken zar zor bir sözcük konuşuluyor. O ateşin sıcağını asla unutmayacağımı biliyorum. Bir süre ondan korkuyla rüyalar göreceğimi bekliyorum ve ailemin ölüm çığlıklarının beni asla terk etmeyeceğinden şüpheliyim...\n\nAma yaşayanlar devam etmek zorunda. Summerhall harabe halinde yatsa bile, Evi [ROOT.Char.GetHouse.GetName] küllerinden yükselip hükmetmeli. Ejderha yumurtalarının kaybı hanedanımıza bir darbe daha — ama eğer onların cazibesi bu trajediye yol açtıysa, belki de kaybolmaları en iyisidir."

 agot_ninepenny.1010.a:0 "#bold Ateş ve kan...#!"

 agot_ninepenny.1011.t:0 "Summerhall Ziyafeti"

 agot_ninepenny.1011.desc:0 "Ziyafet bir zafer! Hanemizin ve bizi bekleyen büyük geleceğin görkemli bir kutlaması.\n\nEn önemlisi, [rhaella.GetFirstName] [rhaegar.GetFirstName] adında güzel bir bebek doğurdu.\n\n[rhaegar.GetSheHe|U] bir gün Yedi Krallık'ın varisi olacak ve — tanrılar izin verirse — bilgelik ve adaletle, birçok görkemli yaz boyunca yönetmek üzere Demir Taht'a oturacak. Ejderha Hanesi'nin uzun süre hatırlayacağı bir olay bu."

 agot_ninepenny.1011.a:0 "Tek yürekle kutluyoruz!"

 agot_ninepenny.1012.t:0 "$agot_ninepenny.1003.t$: Ejderhanın Kükreyişi!"

 agot_ninepenny.1012.desc:0 "Odun yığınının alevleri, seyirciler korkulu bir endişeyle izlerken gittikçe yükseliyor. Sonunda yumurtalardan biri kımıldamaya başlıyor ve sessiz salonda belirgin bir çatırtı sesi yankılanıyor. Yumurtalardan biri çatladı!\n\nBüyük salon, yeni doğmuş bir ejderhanın çığlıklarıyla doluyor; hava duman ve kükürt kokusuyla yoğun. Konuklar hayret içinde ve ejderhaların yeniden doğuşuna tanıklık ederken gözlerindeki korku ve merak karışımını görebiliyorum.\n\n[dragon_first.GetName] şimdilik küçük, ama [dragon_first.Custom('GetDragonSheHe')] güçlü bir canavara dönüşecek. Ejderhaların gücü Evi [ROOT.Char.GetHouse.GetName]'e geri döndü ve diyar, ejderha lordlarının gücünü yakında yeniden tanıyacak!"

 agot_ninepenny.1012.desc_three:0 "Odun yığınının alevleri, seyirciler korkulu bir endişeyle izlerken gittikçe yükseliyor. Sonunda yumurtalardan biri kımıldamaya başlıyor ve sessiz salonda belirgin bir çatırtı sesi yankılanıyor. Sonra ikincisi sallanmaya başlıyor, sonra üçüncüsü...\n\nEvi [ROOT.Char.GetHouse.GetName] için ejderhanın üç başı. Büyük salon, yeni doğan ejderhaların çığlıklarıyla doluyor; hava duman ve kükürt kokusuyla yoğun. Konuklar hayret içinde ve ejderhaların yeniden doğuşuna tanıklık ederken gözlerindeki korku ve merak karışımını görebiliyorum.\n\nEjderhalar şimdilik küçük, ama güçlü canavarlara dönüşecekler. Doğuda kara bir ejderha yükseliyor olabilir, ama biz hazır olacağız."

 agot_ninepenny.1012.desc_many:0 "Odun yığınının alevleri, seyirciler korkulu bir endişeyle izlerken gittikçe yükseliyor. Sonunda yumurtalardan biri kımıldamaya başlıyor ve sessiz salonda belirgin bir çatırtı sesi yankılanıyor. Sonra ikincisi sallanmaya başlıyor...\n\nBüyük salon, yeni doğan ejderhaların çığlıklarıyla doluyor; hava duman ve kükürt kokusuyla yoğun. Konuklar hayret içinde ve ejderhaların yeniden doğuşuna tanıklık ederken gözlerindeki korku ve merak karışımını görebiliyorum.\n\nEjderhalar şimdilik küçük, ama güçlü canavarlara dönüşecekler. Ejderhaların gücü Evi [ROOT.Char.GetHouse.GetName]'e geri döndü ve diyar, ejderha lordlarının gücünü yakında yeniden tanıyacak!"

 agot_ninepenny.1012.a:0 "Bununla her şey mümkün!"

 agot_ninepenny.1012.b:0 "Umarız bedelini hak ederler..."

 agot_ninepenny.1012.tt_hatched:0 "[this_egg.GetName] çatladı"

 agot_ninepenny.1012.tt_not_hatched:0 "[this_egg.GetName] yok edildi"

 agot_ninepenny.1013.t:0 "Targaryenler Yeniden Binmeye Başlıyor!"

 agot_ninepenny.1013.desc:0 "Diyar, Summerhall'daki gelişmelerle sarsılıyor. Ejderhalar geri döndü! Piromancıların rehberliğinde, [egg_hatcher.GetHouse.GetName] dünyayı sarsan gücü yeniden doğurdu ve diyar, ejderha lordlarının gücünü yakında yeniden tanıyacak!\n\nEjderhalar şimdilik küçük, ama güçlü canavarlara dönüşecekler. Ejderhaların gücüyle Evi [egg_hatcher.GetHouse.GetName], Yedi Krallık üzerindeki hükümdarlığını pekiştiriyor."

 agot_ninepenny.1013.a.hatcher_positive:0 "Yaşamak için ne güzel bir zaman!"

 agot_ninepenny.1013.a.hatcher_negative:0 "Dünya asla eskisi gibi olmayacak..."

 agot_ninepenny.1014.t:0 "Ejderhalar Yeniden Doğuyor"

 agot_ninepenny.1014.desc_dragons_no_sacrifice_rhaegar:0 "Hem bebek [rhaegar.GetFirstName]'in hayırlı doğumu hem de ejderhaların dünyaya dönüşüyle, Evi [ROOT.Char.GetHouse.GetName]'in geleceği hiç bu kadar parlak olmamıştı! Güç ve görkemin yeni bir çağı kesin bizi bekliyor; bir gün, yakında bizim emrimizde olacak güçlü ejderhalara binmiş gelecek varisi [rhaegar.GetFirstNameNoTooltip] önderlik edecek.\n\nEjderha Hanesi'nin — ve dünyanın — uzun süre hatırlayacağı bir olay bu."

 agot_ninepenny.1014.desc_dragons_no_sacrifice:0 "Ejderhaların dünyaya dönüşüyle, Evi [ROOT.Char.GetHouse.GetName]'in geleceği hiç bu kadar parlak olmamıştı! Güç ve görkemin yeni bir çağı kesin bizi bekliyor.\n\nEjderha Hanesi'nin — ve dünyanın — uzun süre hatırlayacağı bir olay bu."

 agot_ninepenny.1014.desc_dragons_sacrifice_rhaegar:0 "Ejderhalar, [sacrifice.GetTitledFirstNamePossessive] canı pahasına Targaryenlere geri döndü. Gerçekten buna değdi mi?\n\nTrajediye rağmen [rhaella.GetFirstName] [rhaegar.GetFirstName] adında güzel bir bebek doğurdu.\n\n[rhaegar.GetSheHe|U] bir gün Yedi Krallık'ın varisi olacak ve — tanrılar izin verirse — bilgelik ve adaletle, onu koruyacak bir ejderha yoldaşla birçok görkemli yaz boyunca yönetmek üzere Demir Taht'a oturacak. Ejderha Hanesi'nin uzun süre hatırlayacağı bir olay bu."

 agot_ninepenny.1014.desc_dragons_sacrifice:0 "Ejderhalar, [sacrifice.GetNamePossessive] canı pahasına Targaryenlere geri döndü. Gerçekten buna değdi mi?"

 agot_ninepenny.1014.a:0 "Tek yürekle kutluyoruz!"

 agot_ninepenny.1014.b:0 "[sacrifice.GetFirstNameNoTooltip] anısına"

 agot_ninepenny.1015.t:0 "Ejderha Hayalleri Suya Düştü"

 agot_ninepenny.1015.desc_dragons_no_sacrifice_rhaegar:0 "Kazık ateşinin alevleri, izleyiciler korku içinde izlerken giderek yükseliyor. Yumurtadan çıkma belirtisi için hevesle bekliyorum. Ve bekliyorum. Ve bekliyorum.\n\nErtesi sabah korlar soğumuş; ne ejderha, ne yumurta, ne de umut kalmış.\n\nEh, belki bir ejderha vardır ama o kazıktan doğmadı. Gece boyunca [rhaella.GetFirstName], [rhaegar.GetFirstName] adında güzel bir bebek doğurdu. Ejderhalardan mahrum kalacaksam, en azından hanemin geleceğinin güvende olduğunu bilmek beni tatmin eder."

 agot_ninepenny.1015.desc_dragons_no_sacrifice:0 "Kazık ateşinin alevleri, izleyiciler korku içinde izlerken giderek yükseliyor. Yumurtadan çıkma belirtisi için hevesle bekliyorum. Ve bekliyorum. Ve bekliyorum.\n\nErtesi sabah korlar soğumuş; ne ejderha, ne yumurta, ne de umut kalmış."

 agot_ninepenny.1015.desc_dragons_sacrifice_rhaegar:0 "Kazık ateşinin alevleri, izleyiciler korku içinde izlerken giderek yükseliyor. Yumurtadan çıkma belirtisi için hevesle bekliyorum. Ve bekliyorum. Ve bekliyorum.\n\nErtesi sabah korlar soğumuş; ne ejderha, ne yumurta, ne de umut kalmış.\n\nEh, belki bir ejderha vardır ama o kazıktan doğmadı. Gece boyunca [rhaella.GetFirstName], [rhaegar.GetFirstName] adında güzel bir bebek doğurdu. Ejderhalardan mahrum kalacaksam, en azından hanemin geleceğinin güvende olduğunu bilmek beni tatmin eder."

 agot_ninepenny.1015.desc_dragons_sacrifice:0 "Kazık ateşinin alevleri, izleyiciler korku içinde izlerken giderek yükseliyor. Yumurtadan çıkma belirtisi için hevesle bekliyorum. Ve bekliyorum. Ve bekliyorum.\n\nErtesi sabah korlar soğumuş; ne ejderha, ne yumurta, ne de umut kalmış."

 agot_ninepenny.1015.a:0 "[sacrifice.GetFirstNamePossessiveNoTooltip] canı, hiç için mi?"

 agot_ninepenny.1015.b:0 "Hayat böyle..."

 agot_ninepenny.1020.t:0 "Summerhall'dan Önce Bir Trajedi"

 agot_ninepenny.1020.desc:0 "[ROOT.Char.Custom2('RelationToMe', egg)] [egg.GetNameNicknamedRegnal] son nefesini Demir Taht'ın üzerinde aldı. Şimdi hükümet yükü omuzlarımda ve simgesi olan oyuk taç başımda duracak.\n\nÖyle anlaşılıyor ki, [egg.GetHerHis] ölümünden önce [egg.GetSheHe], [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('rhaella') )] [ROOT.Char.Custom2('RelationToMe', rhaella)] [rhaella.GetNamePossessive] yaklaşan doğumunu kutlamak için eğlence sarayımız Summerhall'da Evi [ROOT.Char.GetHouse.GetName]'in büyük bir kutlamasına karar vermiş.\n\nBelki de şenliklere devam ederek mirasını onurlandırmalıyım?"

 agot_ninepenny.1020.a:0 "[egg.GetTitledFirstNameRegnal]'i bu kutlamayla onurlandıracağız!"

 agot_ninepenny.1020.a.tt:0 "Summerhall ziyafetine yeniden karar veriyorsun."

 agot_ninepenny.1020.b:0 "Kutlama [egg.GetHerHim] ile birlikte öldü."

 agot_ninepenny.1020.b.tt:0 "Summerhall ziyafeti iptal edilecek."

 agot_ninepenny.1021.t:0 "$agot_ninepenny.1020.t$"

 agot_ninepenny.1021.desc:0 "Çalışma odamda diyarın meseleleriyle ilgilenirken [ROOT.Char.Custom2('RelationToMe', consoler)] [consoler.GetName] büyük bir üzüntüyle, [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('rhaella') )] [ROOT.Char.Custom2('RelationToMe', rhaella)] [rhaella.GetName]'in vefat ettiğini söylemek için yaklaşıyor.\n\nGörünüşe göre Summerhall, hayal ettiğim kadar neşeli bir kutlama olmayacak; ama ejderha hanesinin toplanması için hâlâ sebepler var..."

 agot_ninepenny.1021.a:0 "Birlikte durmalıyız."

 agot_ninepenny.1021.b:0 "[rhaella.GetNamePossessive] ölümü bu kadar tazeyken olmaz..."

 agot_ninepenny.1021.b.tt:0 "Summerhall yolculuğun iptal edilecek."

 agot_ninepenny.1022.t:0 "Kesintiye Uğrayan"

 agot_ninepenny.1022.desc:0 "[opponent.GetFullName] tehdidi baş gösterirken, Summerhall'da bir kutlama düzenlemek için ideal bir zaman olmayabilir. Ama iptal edilirse, tüm hazırlıklarımız boşa gidecek..."

 agot_ninepenny.1022.a:0 "Devam etmeliyiz."

 agot_ninepenny.1022.b:0 "Savaş önceliklidir."

 agot_ninepenny.1022.b.tt:0 "Summerhall yolculuğun iptal edilecek."

 agot_ninepenny.1023.t:0 "Summerhall'da Bir Trajedi"

 agot_ninepenny.1023.desc:0 "Summerhall'dan en şaşırtıcı haberi getiren bir kuzgun geldi. Mesaja inanılacaksa, devasa bir yangın, sarayın tamamını ve [king.GetFullNameNicknamedPossessiveRegnal] kendi ailesinin çok sayıda ferdini kül etti!\n\nParşömen ne bir suçludan bahsediyor ne de bir komplocu adı veriyor. Böyle bir trajediye yalnızca bir kaza mı yol açtığına inanmamız bekleniyor? Ya da belki tanrıların iradesi? Kimileri [king.GetHouse.GetName]'in hükmetmeye uygunluğunu sorgulayacak hiç şüphesiz, ama belki de şüpheleri, her zaman olduğu gibi, hoşnutsuz mırıltılar olarak kalacak."

 agot_ninepenny.1023.a:0 "'Ateş ve Kan' gerçekten de..."

 agot_ninepenny.1024.t:0 "Bir Davet"

 agot_ninepenny.1024.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('king'))], [king.GetTitledFirstName], hepimizi Summerhall'da Targaryenlerin yeni neslinin doğumunu kutlamaya davet etti! Ejderha hanesinin bir araya gelişi pek neşeli görünüyor."

 agot_ninepenny.1024.a:0 "Ne eğlenceli!"

 agot_ninepenny.1100.t:0 "$agot_ninepenny.1003.t$"

 agot_ninepenny.1100.desc:0 "Ejderha hanesi toplanıyor! [summerhall_leader.GetName], [rhaella.GetFirstName]'in hamile olması ve [summerhall_leader.GetHouse.GetName] hanedanının görkemi şerefine Summerhall sarayında büyük bir ziyafet için birçoğumuzu davet etti.\n\nTaç elbette hiçbir masraftan kaçınmayacak ve önemli olan herkes orada olacak. Bu, hiçbir konuğun unutamayacağı bir toplanma olabilir!"

 agot_ninepenny.1100.desc_no_rhae:0 "Ejderha hanesi toplanıyor! [summerhall_leader.GetName], [summerhall_leader.GetHouse.GetName] hanedanının görkemi şerefine Summerhall sarayında büyük bir ziyafet için birçoğumuzu davet etti.\n\nTaç elbette hiçbir masraftan kaçınmayacak ve önemli olan herkes orada olacak. Bu, hiçbir konuğun unutamayacağı bir toplanma olabilir!"

 agot_ninepenny.1100.a:0 "Güzel bir ziyafeti severim!"

 agot_ninepenny.1101.t:0 "Uh Oh"

 agot_ninepenny.1101.desc:0 "#S Bu delilik!#! [summerhall_leader.GetName], #bold yabani ateş ve kan kurbanıyla#! bir ejderha yumurtası üzerinde kutsal olmayan bir ritüel deniyor!! Katılımcıların çoğu kararsızlıkla felç olmuş — ve protesto eden birkaç kişi bile bu alçaklığı durduramıyor.\n\nAma piromancılar ritüel ateşinin kontrolünü kaybetti ve alevler büyük salona taşıyor! Ateş, yer, duvar ve çatı boyunca merhametsizce yayılıyor... yoluna çıkan her şeyi yutuyor ve hepimizi bu ejderhanın ağzına hapsediyor..."

 agot_ninepenny.1101.a:0 "Böyle değil!"

 agot_ninepenny.2000.t:0 "Kâğıttan Aslan"

 agot_ninepenny.2000.desc:0 "[tytos.GetTitledFirstName], o dizleri bükük serseri, yıllardır tebaasının korkusuzca ve karşılıksız borçlanmasına izin verdi. Ona olan borçlarım çok, ama ödemek aptallık olur... Ve ben aptal değilim; ben #bold bir aslanım#!.\n\nOğlu [tywin.GetFirstName] ise daha korkutucu bir figür. Kurnaz ve acımasız bir adam — baba dediği o boş tenin aksine.\n\nKeşke [tion.GetName] kendini öldürtmeseydi... O zaman [ROOT.Char.Custom2('RelationToMe', ellyn)] [ellyn.GetFirstName] Kaya'nın Leydisi olurdu ve yeğenim de varis. Ve bu borç da anlamsızlaşırdı.\n\nKimileri bir Lannister'ın borcunu her zaman ödediğini söyler; altınla değilse kanla. Belki de [tytos.GetNickname]'i yatıştırmalıyım, oğlunun gazabından kaçınmak için..."

 agot_ninepenny.2000.a:0 "Benden bir kuruş bile görmeyecek."

 agot_ninepenny.2000.b:0 "#italic O kadar#! alçakça eğileceğim... şimdilik."

 agot_ninepenny.2001.t:0 "Gülünç Aslan"

 agot_ninepenny.2001.desc:0 "Tebaam [roger.GetTitledFirstName], Evi [ROOT.Char.GetHouse.GetName]'e olan borçlarını ödemeyecek... Ve [ROOT.Char.Custom2('RelationToMe', tywin)] [tywin.GetFirstName] #bold öfkeden deliye dönmüş#!!\n\n"Mevkiimizi unutuyorsun, baba," diye tıslıyor [tywin.GetFirstNameNoTooltip]. "Bir Lannister borçlarının ödenmesini talep etmezse, düşmanlarımız bizi beceriksiz diye damgalar; ya da daha kötüsü."\n\nKeşke bu kadar sitemkâr olmasa... Bana saygı duysa... #italic Birisi#! bana saygı duysa... "Elbette [roger.GetFirstNameNoTooltip] zamanla ödeyecektir. [tywin.GetFirstNameNoTooltip], öfken muhakemeni bulandırıyor—" Cümlemi bitiremeden [tywin.GetFirstNameNoTooltip] bana bir tokat atıyor.\n\n[roger.GetTitledFirstNameNoTooltip]'i hesaba katmazsam, [tarbeck.GetTitledFirstName] gibi diğer tebaalar bunu fark edecek. Hiç şüphem yok; ama inatçı adamları bana saygı duymaya nasıl zorlayabilirim?"

 agot_ninepenny.2001.a:0 "Bu #italic çok fazla#!. [roger.GetTitledFirstNamePossessiveNoTooltip] sözünü kabul etmeliyim."

 agot_ninepenny.2001.b:0 "B-B-Belki... geri ödemeyi #bold talep#! edebilirim."

 agot_ninepenny.2001.b.tt:0 "Castamere ve Tarbeck Konağı'na kuzgunlar göndereceksin."

 agot_ninepenny.2002.t:0 "Aslanın Yakarışı"

 agot_ninepenny.2002.desc.tytos:0 "[lion_lord.GetFirstNameNicknamed] bir mektup göndermiş; tüm ödenmemiş borçların ödenmesini ve Casterly Kayası'na bir rehine gönderilmesini talep ediyor. Dişsiz Aslan gibi dizleri bükük birinin böyle bir şey yapabilmesi akıl almaz... Elbette oğlunun bu işte parmağı var.\n\n[ROOT.Char.Custom2('RelationToMe', reyne)] [reyne.GetName] küçümseyerek homurdanıyor. "Bu yakarış çöp — boş adamdan boş tehdit," diyor [reyne.GetSheHe]. Ama Kaya'ya gidersem [lion_lord.GetFirstNameNoTooltip]'e kendim akıl erdirebileceğim hissinden kurtulamıyorum."

 agot_ninepenny.2002.desc:0 "[lion_lord.GetFirstNameNicknamed] bir mektup göndermiş; tüm ödenmemiş borçların ödenmesini ve Casterly Kayası'na bir rehine gönderilmesini talep ediyor. [lion_lord.GetFirstNameNoTooltip] korkutucu bir figür. Kurnaz ve acımasız bir adam — baba dediği o boş tenin aksine.\n\n[ROOT.Char.Custom2('RelationToMe', reyne)] [reyne.GetName] küçümseyerek homurdanıyor. "Bu yakarış çöp — bu aslan yavrusunun pençesi yok," diyor [reyne.GetSheHe]. Ama Kaya'ya gidersem [lion_lord.GetFirstNameNoTooltip]'e kendim akıl erdirebileceğim hissinden kurtulamıyorum."

 agot_ninepenny.2002.a:0 "İşleri kendi ellerime alacağım."

 agot_ninepenny.2002.a.tt:0 "Casterly Kayası'na gidip [lion_lord.GetTitledFirstName]'i akla gelmeye zorlayacaksın."

 agot_ninepenny.2002.b:0 "Bu mektubu yak."

 agot_ninepenny.2002.b.tt:0 "[reyne.GetLadyLord] haklı, aslanın dişi yok."

 agot_ninepenny.2002.c:0 "Sanırım ona geri ödeyebilirim..."

 agot_ninepenny.2004.t:0 "Zincirlerdeki Tarbeck"

 agot_ninepenny.2004.desc:0 "Bugün saraya dönüşüm ürkütücü bir sessizlikle karşılanıyor — odanın havasını boğan zoraki bir suskunluk. [ROOT.Char.Custom2('RelationToMe', lion_son)] [lion_son.GetName] önümde, uğursuzca duruyor ve söyleyeceği şeyi sevmeyeceğimi şimdiden anlıyorum...\n\n"Baba, Kaya'nın beklenmedik bir ziyaretçisi var," diyor [lion_son.GetFirstNamePossessiveNoTooltip]; her kelime hesaplı, "ama korkarım [tarbeck.GetTitledFirstName] kendini zindanlarımızda buldu."\n\n[lion_son.GetHerHis|U] kastettiğini anında anlıyorum, ama cevap veremeden odaya bir haberci habercilik koşuyor... [ellyn.GetTitledFirstName], karşılık olarak [ROOT.Char.Custom2('RelationToMe', kidnapped_lannister)] [kidnapped_lannister.GetName]'i ve Lannisport'lu [lannisport_1.GetName] ile [lannisport_2.GetName]'i tutsak etmiş!"

 agot_ninepenny.2004.a:0 "[tarbeck.GetTitledFirstName]'i serbest bırakmalı ve topraklarıma birliği geri getirmeliyim!"

 agot_ninepenny.2004.b:0 "[ellyn.GetNameNoTooltip] gururumu tehdit edecekse, bedelini öder."

 agot_ninepenny.2005.t:0 "Zincirlerdeki Tarbeck"

 agot_ninepenny.2005.desc:0 "[tarbeck.Custom('InsultAdjective')] [tarbeck.GetFullName], salonuma binip borçlarından sıyrılmanın yolunu aramak gibi büyük bir hata yaptı. Belki benden babam gibi biri olmamı bekledi... Aptal şimdi, hükmümü beklerken zindanlarımda yatıyor.\n\nKarşılık olarak karısı [ellyn.GetFullName], [ROOT.Char.Custom2('RelationToMe', kidnapped_lannister)] [kidnapped_lannister.GetName]'i ve önemsiz iki Lannisport adamını, [lannisport_1.GetName] ve [lannisport_2.GetName]'i yakaladı — haklı efendilerine karşı #bold açık#! bir isyan eylemi. Böyle bir ihanete tek bir cevap vardır."

 agot_ninepenny.2005.a:0 "Lord [tarbeck.GetHouse.GetName]'i ölüme gönder ve adamları topla."

 agot_ninepenny.2006.t:0 "Pençeleri Sökülmüş Aslan"

 agot_ninepenny.2006.desc:0 "Kaya ziyaretim planlandığı gibi gitmedi — varışımı ekmek ve tuzla değil, [lion_son.GetName]'in beni zincire vurup zindana atmasıyla karşıladılar.\n\nKarım [ellyn.GetFullName], serbest bırakılmamı sağlamak için hızlı davrandı; kendi tutsaklarımızı kaparak... En önemlisi, [tytos.GetNamePossessive] [tytos.Custom2('RelationToMe', kidnapped_lannister)] [kidnapped_lannister.GetName]!\n\nGörünüşe göre aslanın oğlu yetkisini aştı ve babasının daha soğukkanlı kafası günü kazandı. Serbest bırakıldım ve tüm borçlarım affedildi!"

 agot_ninepenny.2006.a:0 "Tanrılara şükür [lion_son.GetNameNoTooltip] kendi bildiğini okuyamadı."

 agot_ninepenny.2007.t:0 "Asi Aslan"

 agot_ninepenny.2007.desc:0 "Bana, sevgili kız kardeşimin eşi [tarbeck.GetTitledFirstName]'in, Casterly Kayası'nda [lion_lord.GetTitledFirstName] ile görüşme talep ederken #italic hapsedildiği ve öldürüldüğü#! haberi ulaştı. Daha da kötüsü, eniştemin celladı tarafından üç parçaya doğrandığı söyleniyor.\n\nBöyle bir eylem, tanrıların ve insanların gözünde açık bir ihlal ve aslan sancağımı isyanda yükseltmekten başka seçeneğim yok! #bold Reyneler gururlu hiçbir lorda boyun eğmeyecek!#!"

 agot_ninepenny.2007.a:0 "Güçlerimizi toplayın!"

 agot_ninepenny.2008.t:0 "Tiran Aslan"

 agot_ninepenny.2008.desc:0 "[tarbeck.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', tarbeck)], Casterly Kayası'nda [lion_lord.GetTitledFirstName] ile görüşme talep ederken #italic hapsedildi ve öldürüldü#!. Daha da kötüsü, celladı tarafından üç parçaya doğrandığı haberi geldi.\n\nBöyle bir eylem, tanrıların ve insanların gözünde açık bir ihlal ve sancaklarımı isyanda yükseltmekten başka seçeneğim yok! #bold Hiçbir aslan, tebaasını cezasız parçalayamaz!#!"

 agot_ninepenny.2008.a:0 "Güçlerimizi toplayın!"

 agot_ninepenny.2009.t:0 "Huzursuz Yavrularım"

 agot_ninepenny.2009.desc:0 "[lion_son.GetName] hareketsiz kalmayı sevmez ve korkarım işleri kendi eline alıyor. Bana, Lannister birliklerini toplamaya, kendi tebaama karşı savaşa hazırlanmaya başladığı haberi ulaşıyor.\n\nKuvvet toplamaya başlaması için [lion_son.Custom2('RelationToMe', brother)] [brother.GetName]'i öncülerle birlikte gönderdi. Durum kontrolümün çok ötesine sarmaladı... [lion_son.GetNameNoTooltip] hainlerin gerektiği şekilde cevap vermesi gerektiğini söylüyor... #bold Aslanın pençeleri bileyleniyor.#!"

 agot_ninepenny.2009.a:0 "Savaş olabilir..."

 agot_ninepenny.2010.t:0 "Sahadaki Bedel"

 agot_ninepenny.2010.desc:0 "[reyne.GetFullName] ve [tarbeck.GetFullName], haneme olan ödenmemiş borçları çözmek için cömert teklifimi ikisi de görmezden geldi — ve böylece #bold hain#! olarak damgalandılar.\n\n[ROOT.Char.Custom2('RelationToMe', brother)] [brother.GetFirstName] birlikleri toplamaya başladı ve Evi [ROOT.Char.GetHouse.GetName]'e saygısızlık etmenin ne demek olduğunu onlara göstermek için bu aptalların üzerine yürüyeceğiz. Tebaalarımız aslana eğilmezse, kılıçla diz çöktürülecekler."

 agot_ninepenny.2010.a:0 "#bold [ROOT.Char.GetHouse.GetMotto]#!"

 agot_ninepenny.2011.t:0 "Bir Hırıltı, Şimdi Kükreme"

 agot_ninepenny.2011.desc:0 "Demek #bold bu#! noktaya geldik...\n\n[lion_lord.Custom('InsultAdjective')|l] [lion_lord.GetLadyLord|U] [lion_lord.GetHouse.GetName], tebaasını av gibi kıvrandırmak — ya da köpek gibi sadıklaştırmak istiyor. Öyle mi? Ben bir Clegane değilim! [tarbeck.GetTitledFirstName] kavgada yanımdayken, belki de içimizde hâlâ savaş var.\n\nCasterly Kayası'ndan gelen hırıltı gök gürültüsüne dönüştü, ama kükremeyi #bold bilen#! yalnızca Lannisterler değil!!"

 agot_ninepenny.2011.a:0 "İsyanımız şimdi başlıyor!"

 agot_ninepenny.2012.t:0 "Bir Hırıltı, Şimdi Kükreme"

 agot_ninepenny.2012.desc:0 "Demek #bold bu#! noktaya geldik...\n\n[lion_lord.Custom('InsultAdjective')|l] [lion_lord.GetLadyLord|U] [lion_lord.GetHouse.GetName], tebaasını av gibi kıvrandırmak — ya da köpek gibi sadıklaştırmak istiyor. Öyle mi? Ben bir Clegane değilim! [reyne.GetTitledFirstName] kavgada yanımdayken, belki de içimizde hâlâ savaş var.\n\nCasterly Kayası'ndan gelen hırıltı gök gürültüsüne dönüştü, ama bir kükreme yalnızca #bold aslan öldürmeyi#! bilmeyen bir [ROOT.Char.GetLadyLord]'u korkutur."

 agot_ninepenny.2012.a:0 "İsyanımız şimdi başlıyor!"

 agot_ninepenny.2013.t:0 "Kapıdaki Aslan"

 agot_ninepenny.2013.desc.ellyn:0 "Altın aslan, cıvatalı kumaşın üzerinde salonumuzu sarıyor... [tywin.GetFirstNameNicknamed] [tywin.GetDynastyHouseName] geldi.\n\nSonuç kaçınılmaz görünse de, meydan okuyuşumu sürdürmekten kendimi alamıyorum. "Batıdaki tek aslanlar siz değilsiniz, ser. Kardeşlerim geliyor ve onların pençeleri de sizinkiler kadar uzun ve keskin!""

 agot_ninepenny.2013.desc:0 "Altın aslan, cıvatalı kumaşın üzerinde salonumuzu sarıyor... [tywin.GetFirstNameNicknamed] [tywin.GetDynastyHouseName] geldi.\n\nLannister kuvvetleri, Reyne ordusu kuşatmayı bozmazsa bizi kesin açlıkla teslim alacak."

 agot_ninepenny.2013.a:0 "Dimdik duracağız."

 agot_ninepenny.2013.a.tt:0 "Kuşatmaya hazırlanıyorsun."

 agot_ninepenny.2013.b:0 "Bu umutsuz..."

 agot_ninepenny.2013.b.tt:0 "Sancaklarını indirip [tywin.GetDynastyHouseName] taleplerine boyun eğeceksin."

 agot_ninepenny.2014.t:0 "Tarbeck Konağı'nı Almak"

 agot_ninepenny.2014.desc.ellyn:0 "[taunter.GetFirstName] [location.GetNameNoTier]'den müzakere için dışarı çıkıyor. "Batıdaki tek aslanlar siz değilsiniz, ser. Kardeşlerim geliyor ve onların pençeleri de sizinkiler kadar uzun ve keskin," diye iddia ediyor [taunter.GetSheHe], kibirle.\n\nYalnızca bir aptal, [taunter.GetSheHe]'nin içinde bulunduğu ölümcül tehlikeyi göremez — basit bir teslimiyetle ilgilenmiyorum. Batı Toprakları'ndan isyanın geçici bir fikrini bile söndürmek istiyorum, #bold sonsuza dek#!."

 agot_ninepenny.2014.desc:0 "[tarbeck.GetFirstName], üstün kuvvetlerime karşı kaleyi tutuyor; kazanma ihtimali azalmasına rağmen azimli ve meydan okuyucu.\n\nYalnızca bir aptal, [tarbeck.GetSheHe]'nin içinde bulunduğu ölümcül tehlikeyi göremez — basit bir teslimiyetle ilgilenmiyorum. Batı Toprakları'ndan isyanın geçici bir fikrini bile söndürmek istiyorum, #bold sonsuza dek#!."

 agot_ninepenny.2014.a:0 "Bu kalenin alınmasını istemiyorum, yerle bir edilmesini istiyorum."

 agot_ninepenny.2014.a.tt:0 "Sert önlemler alınacak."

 agot_ninepenny.2014.b:0 "Sancakları zamanla eğilecek."

 agot_ninepenny.2014.b.tt:0 "Kuşatmaya normal şekilde devam edeceksin."

 agot_ninepenny.2015.t:0 "Sahadaki Bedel"

 agot_ninepenny.2015.desc.ellyn:0 "Kale yıkılmış ve harap. Toprak dümdüz edilmiş ve yakılmış. Zemin, #bold tuzlanmış#!.\n\n[taunter.GetFirstName], arkasına saklandığı siperlerin taşı altında ezildi..."

 agot_ninepenny.2015.desc:0 "Kale yıkılmış ve harap. Toprak dümdüz edilmiş ve yakılmış. Zemin, #bold tuzlanmış#!.\n\n[tarbeck.GetFirstName], arkasına saklandığı siperlerin taşı altında ezildi..."

 agot_ninepenny.2015.a:0 "Tebaalar dikkat etsin."

 agot_ninepenny.2015.a.tt:0 "Tarbeck Konağı'nda hazır bulunan herkes öldürüldü."

 agot_ninepenny.2016.t:0 "Tarbeck Salonu Söküldü"

 agot_ninepenny.2016.desc:0 "[taunter.GetName] cüretkârca [location.GetName] kalesini [tywin.Custom('InsultAdjective')] [tywin.GetName] [tywin.GetHouse.GetName]'e teslim etmeyi reddetti ve o alçak, şövalyelik ve savaşın tüm iyi yasalarına taban tabana zıt biçimde, kadim kalemizi yıkıp her sakini katlederek karşılık verdi."

 agot_ninepenny.2016.a:0 "Lannisterler bedelini ödeyecek..."

 agot_ninepenny.2017.t:0 "Tarbeck Salonu Söküldü"

 agot_ninepenny.2017.desc:0 "Bana, [tywin.GetFirstNameNicknamed]'in Tarbeck Konağı'nı yerle bir ettiği, kaleyi sakinlerinin üzerine yıktığı — duvarlarının içine sığınan herkesi öldürdüğü haberi ulaştı!"

 agot_ninepenny.2017.a:0 "#italic [tywin.GetFirstNameNoTooltip]...#!"

 agot_ninepenny.2018.t:0 "[tarbeck.GetLadyLord|U] [tarbeck.GetHouse.GetNameNoTooltip] Teslim Oldu"

 agot_ninepenny.2018.desc:0 "Savaş alanından haber bana ulaşıyor: [tarbeck.GetFullNameNicknamed] nihayet aklını başına topladı ve Evi Lannister'a olan borçlarını ödemeye karar verdi.\n\nBugün #bold kan dökülmesi#! önlendi."

 agot_ninepenny.2018.a:0 "[tywin.GetFirstNameNoTooltip]..."

 agot_ninepenny.2019.t:0 "Kapıdaki Aslan"

 agot_ninepenny.2019.desc:0 "[tywin.GetFirstNameNicknamed]'in [location.GetName]'e varması yalnızca bir zaman meselesiydi... Aslanın kükremesi şiddetli olabilir, ama şimdi [tywin.GetHerHis] pençelerinin ne kadar keskin olduğunu öğreneceğiz.\n\nEvi [reyne.GetHouse.GetName]'in geleceği buna bağlı. Bu geleceği şekillendirmedeki rolüm, #bold mahvoluşumuz#! olabilir."

 agot_ninepenny.2019.a:0 "[tywin.GetHerHim] beni eğdirmeyi denesin..."

 agot_ninepenny.2020.t:0 "Castamere'yi Almak"

 agot_ninepenny.2020.desc.reyne:0 "Derler ki bir aslan sürüsünde yalnızca bir baskın aslan olabilir; konumunu güvenceye almak için zaman zaman rakiplerini öldürmesi gerekir. [reyne.GetFirstNameNicknamed] beni Castamere tünellerinin dışında karşılıyor, ama [reyne.GetSheHe]'nin bir konuşmayla ilgilenmediğini anlayabiliyorum.\n\n"[ROOT.Char.GetLadyLord]," diye sırıtıyor [reyne.GetSheHe], yer altındaki maden kuyularının derinliklerinde bir kuşatmaya dayanabileceğine açıkça ikna olmuş. "Korkarım boşuna geldiniz. Tabii bana eğilmek istemezseniz..." Kibir — ve huysuzluk — gözlerimi #bold karartmaya#! yetti.\n\nTopuğumun üzerinde dönüp Lannister kuşatma hatlarına geri dönüyorum, ama aklım kararını verdi... Yalnızca bir teslimiyet istemiyorum. Hepsini #bold ölü#! istiyorum!!"

 agot_ninepenny.2020.desc:0 "Derler ki bir aslan sürüsünde yalnızca bir baskın aslan olabilir; konumunu güvenceye almak için zaman zaman yavruları öldürmesi gerekir. Beni Castamere tünellerinin dışında [reyne.GetFirstNameNicknamed] değil, [reyne.GetHerHis] [reyne.Custom2('RelationToMeShort', defender)] [defender.GetName] karşılıyor. [defender.GetSheHe|U], [reyne.GetLadyLord]'ünün yokluğunda görüşme için gelmiş.\n\n[defender.GetFirstNameNoTooltip], yer altındaki maden kuyularının derinliklerinde bir kuşatmaya dayanabileceğine ikna olmuş görünüyor. Rakip aslanımı [reyne.GetHerHis] kalesinde kıstıramamak beni hayal kırıklığına uğratsa da, [reyne.GetHerHis] ailesinden bir örnek — ve #bold [reyne.GetHerHis] makamından#! — oluşturmam gerektiğini biliyorum."

 agot_ninepenny.2020.a:0 "Madenlerinde saklansınlar mı? Madenlerinde ölecekler."

 agot_ninepenny.2020.a.tt:0 "Tünelleri suya boğacak, madenleri harabeye çevirecek ve içindeki herkesi öldüreceksin."

 agot_ninepenny.2020.b:0 "Kaleyi kuşatmayla alacağız."

 agot_ninepenny.2020.b.tt:0 "Kuşatmaya normal şekilde devam edeceksin."

 agot_ninepenny.2021.t:0 "Kükreme Yok, Yalnızca Cılız Çığlıklar"

 agot_ninepenny.2021.desc:0 "Reyneler kalelerinin altındaki maden kuyularının derinliklerine çekildiklerinde, kaderlerini mühürlediler. Birliklerime madenlerin her girişini kapatmalarını emrediyorum — bizi dışarıda tutmayı umuyorlardı, ama onun yerine onları içeride tutacağız.\n\nYakındaki bir dere, intikamımı üzerlerine yağdıracak. Adamlarım doğaçlama bir bentle akan suyu yönlendiriyor ve madenler yavaşça su dolmaya başlıyor... Kapatılmış çıkışların yakınında mevzilenmiş adamlar, derinliklerden cılız çığlıklar duyabiliyor; ama gün doğduğunda yalnızca sessizlik var.\n\nGüçlü Castamere böyle son bulacak işte: #bold bir kükremeyle değil, bir iniltiyle#!."

 agot_ninepenny.2021.a:0 "Tamamdır."

 agot_ruinized_castamere_effect_desc:0 "Castamere harap edilecek."

 agot_ninepenny.2022.t:0 "$agot_ninepenny.2021.t$"

 agot_ninepenny.2022.desc:0 "Bana Castamere'den bir kuzgun ulaşıyor; [ROOT.Char.Custom2('RelationToMeShort', doa)] [doa.GetFirstName], [tywin.GetFullNameNicknamed]'in yaklaşan kuşatmasına orada yiğitçe göğüs gerdi... Ama kara kanatlar kara sözler getirir ve hikâye beni dehşete düşürüyor:\n\nKuşatma sırasında Castamere sakinleri güvenlik için maden kuyularının derinliklerine kaçtıktan sonra, [tywin.Custom('InsultAdjective')] aslan [tywin.GetFirstNameNoTooltip], içeride mühürlenmelerini emretti — sonra madenleri su basmak için yakındaki bir derenin yönünü değiştirdi ve #bold hepsini boğdu#!.\n\nDeli aslan durdurulmalı ve bunu yalnızca başka bir aslan umabilir. [doa.GetFirstNameNoTooltip]'in, beni ileri iten cılız çığlıklarını neredeyse duyabiliyorum."

 agot_ninepenny.2022.a:0 "[ROOT.Char.GetHouse.GetMotto]"

 agot_ninepenny.2023.t:0 "$agot_ninepenny.2021.t$"

 agot_ninepenny.2023.desc:0 "Bana savaş alanından, [ROOT.Char.Custom2('RelationToMeShort', tywin)] [tywin.GetNameNoTooltip]'in isyankâr Reynelere karşı acımasız savaş oyununu oynadığı yerden haber ulaştı. Onun karanlık doğasını bilmeme rağmen, Castamere hikâyesi beni dehşete düşürüyor:\n\nKuşatma sırasında sakinler güvenlik için maden kuyularının derinliklerine kaçtıktan sonra, [tywin.GetFirstNameNoTooltip] varlıklarını Batı Toprakları'ndan silmeyi seçti — madenleri su basmak için yakındaki bir derenin yönünü değiştirip #bold hepsini boğarak#!.\n\nBu eylemin sözü yabani ateş gibi yayılacak... Madenlerin kapatılmış çıkışlarında mevzilenen muhafızların, sabah ışığına dek cılız çığlıklar duyabildiği söyleniyor."

 agot_ninepenny.2023.a:0 "İniltimi duyun..."

 agot_ninepenny.2030.t:0 "Babanın Kaprisleri"

 agot_ninepenny.2030.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', tytos)] [tytos.GetFirstName] zayıf bir adamdı; Batı Toprakları'nın lordlarının bu büyük hanenin mirası üzerinde azgınca koşmasına izin verdi. Şimdi [tytos.GetHerHim] yoldan çekilmişken, güçlü Evi [ROOT.Char.GetHouse.GetName]'in idaresini alabilirim.\n\nŞimdi Lordlar [reyne.GetHouse.GetName] ve [tarbeck.GetHouse.GetName], bu Aslan'ın, [ROOT.Char.GetHerHis] babasının pençelerinden daha uzun ve keskin pençeleri olduğunu görecek."

 agot_ninepenny.2030.a:0 "[ROOT.Char.GetHouse.GetMotto]"

 agot_ninepenny.2031.t:0 "Bir Aslan Savaşmalı"

 agot_ninepenny.2031.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', tytos_heir)] [tytos_heir.GetFirstName] bana, gözlerinde ateşle yaklaşıyor... Görünüşe göre savaşı kenardan izleme kararım pek hoş karşılanmamış.\n\n"Batı Toprakları'nın lordları, efendilerinin yalnızca bir kedi yavrusu olduğunu bilseler ne derlerdi!" diye haykırıyor [tytos_heir.GetFirstNameNoTooltip]; sözleri keskin hançerler gibi içime işliyor. Belki de konumumu yeniden düşünmeliyim..."

 agot_ninepenny.2031.a:0 "Savaşa katılacağım!"

 agot_ninepenny.2031.b:0 "Hayır, konumum değişmedi."

 agot_ninepenny.2032.t:0 "Savaştan Dersler"

 agot_ninepenny.2032.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', tytos_heir)] [tytos_heir.GetNameNoTooltip], savaş sırasında geçen çetin günlerde çok şey öğrendi. Geri döndüğümüze göre, [tytos_heir.GetHerHis] kasvetli bakışları yalnızca sertleşmiş gibi ve karşı görüşlü tebaaya karşı sabrı tükenmiş.\n\nKorkularım, [tytos_heir.GetSheHe] bana asi tebaalarım [reyne.GetFullName] ve [tarbeck.GetFullName] ile kötüleşen durum hakkında yaklaştığında doruk noktasına ulaşıyor. Evi [ROOT.Char.GetHouse.GetName]'e o kadar çok altın borçlular ki Kaya'nın tüm kasalarını doldurur ve fazlası kalır; ama ben, kırılgan bir barışı sürdürmek için onlara karışmadım. Şimdi [tytos_heir.GetNameNoTooltip]'in başka fikirleri var..."

 agot_ninepenny.2032.a:0 "Kaderlerini kontrol edemem."

 agot_ninepenny.2032.b:0 "Bu tür hırsları yalnızca zindan durdurur."

 agot_ninepenny.2033.t:0 "Korkaklarla Kuşatılmış"

 agot_ninepenny.2033.desc.ellyn:0 "[ROOT.Char.Custom2('RelationToMeShort', messenger)] [messenger.GetName], Tarbeck Konağı'ndan gece gündüz gizlenerek, omurgasız [tarbeck.GetName]'in Kaya'nın taleplerine boyun eğdiğini, beni siyasi olarak yalnız bıraktığını bildirmek için geldi."

 agot_ninepenny.2033.desc:0 "Bana, omurgasız [tarbeck.GetName]'in Kaya'nın taleplerine boyun eğdiği, beni siyasi olarak yalnız bıraktığı söylendi."

 agot_ninepenny.2033.a:0 "Mücadele burada bitmiyor."

 agot_ninepenny.2033.b:0 "Başka seçeneğim yok..."

 agot_ninepenny.2050.t:0 "Castamere Hükümdarlığı"

 agot_ninepenny.2050.desc:0 "#bold Savaş kazanıldı.#! Son darbeler vuruldu ve Evi [ROOT.Char.GetHouse.GetName], Batı Toprakları'nın hüküm süren aslanları olarak tek başına ayakta.\n\nYeni tebaalarıma ilk fermanlarımı göndermeye hazırlanırken sarayıma bir konuk giriyor. [singer.GetHerHis] tavrından [singer.GetSheHe]'nin bir ozan olduğunu anlayabiliyorum — peşindeki lirinden anlaşıldığı kadarıyla bir arpçı. "[ROOT.Char.GetLadyLord], ben [singer.GetNameNicknamed] ve savaştaki zaferinizi bir şarkıyla onurlandırmaya geldim," diyor [singer.GetSheHe]; [singer.GetHerHim] başlaması için işaret ediyorum... #indent_newline:6 \n\n#italic Ve böyle söyledi, ve böyle söyledi,\n  Castamere'nin hükümdarlığını,\nVe şimdi diyar onun çağrısına eğiliyor,\n  batıdakilerin hepsi duyacak diye.\nEvet, şimdi diyar onun çağrısına eğiliyor,\n  ve her can duymak zorunda.#! #!\n\nOzan, [singer.GetHerHis] şarkısını bitirdikten sonra derin bir reverans yapıyor."

 agot_ninepenny.2050.a:0 "Bu, düşmanlarımın tüm salonlarında söylensin."

 agot_ninepenny.2051.t:0 "Castamere Yağmurları"

 agot_ninepenny.2051.desc:0 "#bold Savaş kazanıldı.#! Son darbeler vuruldu ve Evi [ROOT.Char.GetHouse.GetName], Batı Toprakları'nın hüküm süren aslanları olarak rakipsiz kalıyor.\n\nSıradan hükmetme işine dönmeye hazırlanırken sarayıma bir konuk giriyor. [singer.GetHerHis] tavrından [singer.GetSheHe]'nin bir ozan olduğunu anlayabiliyorum — peşindeki lirinden anlaşıldığı kadarıyla bir arpçı. "[ROOT.Char.GetLadyLord], ben [singer.GetNameNicknamed] ve savaştaki zaferinizi bir şarkıyla onurlandırmaya geldim," diyor [singer.GetSheHe]; [singer.GetHerHim] başlaması için işaret ediyorum... #indent_newline:6 \n\n#italic Ve böyle söyledi, ve böyle söyledi,\n  Castamere'nin o lordu,\nAma şimdi yağmurlar ağlıyor salonunda,\n  duyacak kimse yok diye.\nEvet şimdi yağmurlar ağlıyor salonunda,\n  ve duyacak bir can yok diye.#! #!\n\nOzan, [singer.GetHerHis] şarkısını bitirdikten sonra derin bir reverans yapıyor."

 agot_ninepenny.9102.t:0 "Ejderha Görüntüleri"

 agot_ninepenny.9102.desc:0 "Summerhall trajedisinin üzerinden birkaç ay geçti ve Westeros'un dört bir yanından ejderha görüldüğü raporları yağmaya başladı. Önce delilik diye geçiştirildi, ama tanık sayısı artık inkâr edilemeyecek kadar fazla. Summerhall'daki ölümlere rağmen, [aegon.GetTitledFirstName] sonunda ejderhaları geri getirmeyi başarmış gibi görünüyor."

 agot_ninepenny.9102.a:0 "Ejderhalar bir kez daha diyarlarda dolaşıyor..."

 agot_ruinized_summerhall_effect_desc:0 "Summerhall bir harabeye indirgendi"

