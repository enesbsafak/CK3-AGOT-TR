 pregnancy.2001.father_is_paramour:0 "Sabrıma rağmen, ay kanım bir kez daha benden kaçıyor gibi görünüyor ve canlanmanın belirgin kıpırtılarını artık görmezden gelemiyorum. \n\nGörünüşe göre sadık aşığım [real_father.GetFirstName]'in çocuğunu taşıyorum!"

 pregnancy.2001.paramour:0 "Ne hoş küçük bir sürpriz!"

 pregnancy.2002.father_is_paramour:0 "Ay kanım bir kez daha benden kaçıyor ve canlanmanın belirgin kıpırtılarını artık görmezden gelemiyorum. \n\nGörünüşe göre sadık aşığım [real_father.GetFirstName]'in çocuğunu taşıyorum! \n\nHaberimi kocam [spouse.GetFirstName]'e açtığımda biraz kafası karışmış görünüyor. "Ama neredeyse hiç temas etmedik," diyor, parmaklarında sayarak son kaç ayı birlikte yatakta geçirmediğimizi hesaplamaya çalışıyor. \n\nBir dakika kadar sonra, yine de, çakıyor; ağzı kusursuz bir 'o' şekli alıyor. "Oooh! [real_father.GetFirstName] ile mi?" diye soruyor. Başımla onayladığımda [spouse.GetFirstName] gülüyor, kulaktan kulağa gülümseyerek, açıkça eğlenmiş halde. "Bunu yapabileceğini düşünmezdim!""

 pregnancy.2002.paramour:0 "Bunu yapabilecek #italic benim#! olsam gerek..."

 birth.2001.desc.mother.paramour:0 "Saatler süren doğum sancılarının ardından, bebeğin ağlayış sesini duymak içimi rahatlatıyor. Çocuk kundağa sarılırken kollarımı Üstada doğru uzatıyorum. "Ver onu bana!" diye yalvarıyorum, çocuğumla tanışmanın heyecanıyla. "Göreyim!" \n\nYeni doğanı kollarımda tutuyor ve yüzüne bakıyorum; [real_father.GetFirstName]'e olan benzerlik artık inkar edilemez. Önceden herhangi bir şüphe varsa bile, iyiden iyiye yok oldu. \n\n[real_father.GetFirstName] ile paylaştığım aşk, artık çocuğumuzda beden buldu. Ne kadar şanslıyız!"

 birth.2001.desc.mother.paramour.twins:0 "Saatler süren doğum sancılarının ardından, yeni doğmuş bir bebeğin ağlayışını duymak içimi rahatlatıyor — ama sancılarım bitmiyor ve kısa süre sonra, ilki kadar gürültücü ikinci bir bebek daha doğuruyorum! Ebe kadınlar bebekleri kundağa sararken kollarımı uzatıyorum. "Verin onları bana!" diye yalvarıyorum, onlarla tanışmanın heyecanıyla. "Göreyim!" \n\nEbeler bebekleri yatağımın başucunda bana uzatıyor ve onlara sonsuza dek bakacakmışım gibi bakıyorum; önceden herhangi bir şüphe varsa bile, [real_father.GetFirstName]'e olan benzerlik artık inkar edilemez olduğundan, o şüpheler iyiden iyiye yok oluyor! \n\n[real_father.GetFirstName] ile paylaştığım aşk, şimdi ikizlerimizde iki katına çıkmış halde. Ne kadar şanslıyız!"

 birth.2001.desc.father.paramour:0 "Herhangi bir Lord'dan, Prens'ten, hatta Kral'dan daha güçlü hissediyorum; zira tacımın adı neşe; kralların bile nadiren tattığı bir taç — sevgili aşığım [mother.GetFirstName] doğum yaptı! \n\nOnun #italic yapamayacağı#! bir şey var mı?"

 birth.2001.desc.father.paramour.twins:0 "Herhangi bir Lord'dan, Prens'ten, hatta Kral'dan daha güçlü hissediyorum; zira tacımın adı neşe; kralların bile nadiren tattığı bir taç — sevgili aşığım [mother.GetFirstName], çocuklarımızdan bir değil, #italic iki#! tane birden doğurdu! \n\nOnun #italic yapamayacağı#! bir şey var mı?"

 birth.2001.b.paramour:0 "İz bırakan aşka kaldıralım!"

