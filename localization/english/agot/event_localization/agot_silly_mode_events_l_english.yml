l_english:

 agot_silly_mode.0002.t:0 "Yumurta-sıradışı Mahkum"

 agot_silly_mode.0002.desc:0 ""Mi[ROOT.Char.GetLadyLord|l], Aegon, Ejderha Çukuru'nun en derin hücrelerinden birine kapatıldı," diye duyuruyor Ejderha Bakıcısı, hafifçe eğilerek. "Onu Kara Hücreler yerine neden orada hapsetmemi istediğinizi anlamıyorum, ama bir ejderhayı tutabilecek yer elbette bir adamı da tutar."\n\nŞaşkınlıkla ona bakıyorum. Kimileri Aegon'a "Yumurta" diyebilir, ama güvence altına alınmamış tüm ejderha yumurtalarının kuluçka için çukura taşınması emrim nasıl bu kadar feci yanlış yorumlanmış olabilir?"

 agot_silly_mode.0002.desc_mult:0 ""Mi[ROOT.Char.GetLadyLord|l], Aegonlar, Ejderha Çukuru'nun en derin hücrelerinden birine kapatıldı," diye duyuruyor Ejderha Bakıcısı, hafifçe eğilerek. "Onları Kara Hücreler yerine neden orada hapsetmemi istediğinizi anlamıyorum, ama bir ejderhayı tutabilecek yer elbette birkaç adamı da tutar."\n\nŞaşkınlıkla ona bakıyorum. Kimileri Aegonlara "Yumurtalar" diyebilir, ama güvence altına alınmamış tüm ejderha yumurtalarının kuluçka için çukura taşınması emrim nasıl bu kadar feci yanlış yorumlanmış olabilir?"

 agot_silly_mode.0002.a:0 "Kastettiğim bu değildi!"

 agot_silly_mode.0002.b:0 "Ben... tabii, teşekkür ederim."

 agot_silly_mode.0100.t:0 "Garip Bir Lezzet"

 agot_silly_mode.0100.desc:0 "Bir gün daha, bir angarya daha. Hüküm sürmek bazen feci sıradan olabiliyor; tek sürpriz, çevremdekilerin ara sıra gösterdiği beceri.\n\nBugün farklı, ne yazık ki: içeri yılan gibi pullu bir herif dalıyor — hem korkunç hem aşağılık bir varlık — elinde #italic garip bir armağan#!la. "Taze #bold turta#!, mi[ROOT.Char.GetLadyLord|l]," diyor gölgeli figür neşeli bir tonda. "Doğruca mutfaktan. Garip bir kız, iç harcı için bize en zarif etleri temin etti."\n\nYabancılardan gelen garip yiyeceklere güvenmek gibi bir huyum yok, ama o koku o kadar hoş ki..."

 agot_silly_mode.0100.a:0 "Sadece bir ısırık..."

 agot_silly_mode.0100.b:0 "Hiç yemese iyi olur."

 agot_silly_mode.0200.t:0 "Yumurta gibi Fikir"

 agot_silly_mode.0200.desc:0 "Aşçı içeri giriyor, adımları tereddütlü, gözleri endişeyle kocaman açılmış. "Beni çağırtmışsınız, mi[ROOT.Char.GetLadyLord|l]?"\n\n"Evet, bir omlet istiyorum. Çok özel bir omlet," diye yanıtlıyorum, seçtiğim kurbanı almak için yana dönerek.\n\nKaşları şaşkınlıkla çatılıyor, ama ejderha yumurtasını titreyen ellerine bıraktığımda bu çatılma anında saf bir şoka dönüşüyor. "Ben... emin değilim... İstediğiniz buysa," diye kekeliyor, yumurtaya her an patlayabilirmiş gibi bakarak.\n\nOna başımı sallıyorum, sırıtışım genişliyor. "İyice acıktım. Çok uzun sürme.""

 agot_silly_mode.0200.a:0 "Sabırsızlanıyorum!"

 agot_silly_mode.0201.t:0 "Yumurta gibi Fikir"

 agot_silly_mode.0201.desc:0 "Aşçı, yorgun ve hafif dağınık görünümlü bir hâlde geri dönüyor. Sinirli bir hareketle tabağı önüme koyuyor; omlet son derece sıradan görünüyor. Yapıldığı efsanevi ejderha yumurtasını ima eden hiçbir şey yok içinde. Altın kahvesi renginde, hafif kabarık ve üzerinden çok hafif bir ot kokusu geliyor.\n\n"Ben... umarım beğenirsiniz, mi[ROOT.Char.GetLadyLord|l]," diyor, sesi titrek.\n\nHayal kırıklığıyla tabağa bakıyorum. Parıltı yok, büyülü bir hale yok; sadece özenle yapılmış bir kahvaltı. Bir ısırık alıyorum."

 agot_silly_mode.0201.a:0 "Şey... harika!"

 agot_silly_mode.0201.b:0 "Yumurta-nefis!"

 agot_silly_mode.0201.c:0 "Yumurta-sıradışı!"

 agot_silly_mode.0201.d:0 "Yumurta-mükemmel bir iş, aşçı!"

 agot_silly_mode.0201.e:0 "Yumurta-tı tam umduğum ve hayalini kurduğum gibi!"

 agot_silly_mode.0201.f:0 "Bu güzel tadı yumurta-klayamam!"

 agot_silly_mode.0201.g:0 "Bu... bu yumurta-tik bir haz!"

 agot_silly_mode.0202.t:0 "$agot_silly_mode.0201.t$"

 agot_silly_mode.0202.desc:0 "$agot_silly_mode.0201.desc$"

 agot_silly_mode.0202.a:0 "Ne yersen osun."

 agot_silly_mode.0302.t:0 "Dokunaçlı Yıkım"

 agot_silly_mode.0302.desc:0 "Akıncılar, tuz ve çelikten bir sel gibi Eski Şehir'de ilerliyor. Yüksek Kule'nin gölgesine ulaştıklarında deniz kükreyerek karşı çıkıyor — ya da hoş karşılıyor. Limandan devasa bir dalga yükseliyor, onlarcasını boğarken canavarımsı bir kraken derinliklerden yükseliyor. Kale duvarları kalınlığındaki dev dokunaçlar, kadim kulenin çevresine dolanıyor. Yırtılan taşların iniltisiyle Yüksek Kule temellerinden sökülüyor ve dalgaların altında kaybolarak derinliklere gömülüyor."

 agot_silly_mode.0302.a:0 "Deniz hatırlar."

 agot_silly_mode.0302.b:0 "Ne-ne?"

 agot_silly_mode.0501.t:0 "Dev Bir Mum'a... mı Tapıyorlar...?"

 agot_silly_mode.0501.westeros_desc:0 "Kalenin cereyanlı koridorlarında yürürken, elinde mühürlü bir kuzgun parşömeni taşıyan bir saray mensubu yanıma yaklaşıyor. Parşömeni alınca Kale'nin balmumu mührünü görüyorum... En kötüsünü bekleyerek telaşla mührü kırıp yazışmayı açarken üzerime bir aciliyet duygusu çöküyor.\n\nAçtıktan sonra okumaya başlıyorum ve bunun, [GetTitleByKey('k_the_wall').GetName]'nden [messenger.GetName] tarafından iletilen sıradan bir mesaj olduğunu fark ediyorum. Uzak kuzeydeki bir grup yabanılın, Büyük Mum adını verdikleri şeye tapmaya başladıklarına dair garip davranışlar içeren bir rapor — nesillerdir topraklarının üzerindeki gökyüzünde asılı olduğu söylenen, dev bir mum olduğu rivayet edilen ve şimdi gizemli bir biçimde kaybolan bir mum. Mektubu bir kenara fırlatmadan önce birkaç kez yeniden okuyorum. Az önce okuduklarıma karşın şaşkınlıkla kalakalıyorum..."

 agot_silly_mode.0501.not_westeros_desc:0 "Okunmamış yazışmalarımı karıştırırken, Westeros'taki Kale'nin balmumu mührünü taşıyan bir mektup gözüme çarpıyor. Böyle bir iletişime duyduğum merak ağır basıyor; önce ona ilgi göstermeye karar veriyorum.\n\nMektubu açıp okumaya başlıyorum ve bunun, [GetTitleByKey('k_the_wall').GetName]'nden [messenger.GetName] tarafından iletilen bir mesaj olduğunu fark ediyorum. Uzak kuzeydeki bir grup yabanılın, Büyük Mum adını verdikleri şeye tapmaya başladıklarına dair garip davranışlar içeren bir rapor — nesillerdir topraklarının üzerindeki gökyüzünde asılı olduğu söylenen, dev bir mum olduğu rivayet edilen ve şimdi gizemli bir biçimde kaybolan bir mum. Başımı ellerimin arasına alıp yaslanmadan önce mektubu birkaç kez yeniden okuyorum... Az önce ne okudum ben?"

 agot_silly_mode.0501.nw_westeros_desc:0 "[GetTitleByKey('k_the_wall').GetName]'de hava her zaman cehennem gibi soğuk... Kimileri alışırsın der, ama bu, insanların gerçek olması için kendilerine anlattığı bir masaldan ibaret. Kendimi dağıtmaya çalışırken, günün erken saatlerinde devriye birliğinin yakaladığı bir yabanılla yapılan sorgulamayı hatırlıyorum. O deli, uzak kuzeydeki, gökyüzünde bir Büyük Mum'a tapmaya başlamış farklı bir yabanıl kabilesiyle ilgili türlü saçma çılgınlıklar sıralamıştı. Bu iddia, yabanılların vahşi standartlarına göre bile akıl dışıydı... İnsanı, insanları böyle bir deliliğe itebilecek kadar kuzeyde ne tür bir dünya olduğunu merak ediyor."

 agot_silly_mode.0501.btw_westeros_desc:0 "Göl Halkı kabileleri her zaman garip olmuştur... Diğer Özgür Halk arasında onlarla ilgili söylentiler, gökyüzünde dev bir mum içeren kafa karıştırıcı tapınma uygulamalarından söz ediyordu. Son zamanlarda bu uygulamalarla ilgili fısıltılar daha da yüksek ve sık hâle geldi; Büyük Mum denen şeyin, gökyüzündeki yerinden taşındığı söyleniyordu. Bunu kötü bir alamet ilan ettiler ve sonucunda daha da gayretkeşleştiler... Söylentilere göre, mumlarını bir kez daha gökyüzüne döndürmek için başka kabileleri kurban ediyorlar. Bu tam anlamıyla delilik — üzerinde çok uzun düşünmek neredeyse ürkütücü."

 agot_silly_mode.0501.a:0 "Orada neler oluyor?"

 agot_silly_mode.0502.t:0 "MUM! MUM! MUM!"

 agot_silly_mode.0502.desc:0 "Büyük Mum'un Buz Gölleri topraklarımızın üzerindeki yerinden taşınmasından bu yana epey zaman geçti. Büyük Mum'un, güneşin ışığının bize ulaşmasını engelleyerek üzerimizde asılı durmadığı bir zaman olduğuna inanmıyorum... halkımızı gözetliyordu... Büyük Mum'un kendini taşıdığı o kader gününden beri artık onun ilahi gölgesi altında değiliz. Bize yol gösteren Büyük Mum olmadan halkım kaybolmuş durumda. Bu yeni keşfedilmiş, göz alıcı ışığın içinde amaçsızca sendeliyoruz.\n\nNe yapmam gerektiğini biliyorum... Halkımı, rehberimiz Büyük Mum ile aydınlanmaya giden görkemli yeni bir yolun altında birleştirmeliyim! Belki hayatlarımızı Büyük Mum'un adına yaşamaya adarsak, onu topraklarımızın üzerine geri yönlendirebilir ve bizi eski görkemimize kavuşturabiliriz.\n\nSeyahate çıkmalı ve bu yeni yaşam biçimini tanıtmalıyım — Büyük Mum'un bilgeliğini ve yol göstericiliğini aktarmak için..."

 agot_silly_mode.0502.a:0 "Mum bilgedir, Mum hayattır..."

 agot_silly_mode.0502.a.tt:0 "Tüm kültürünüz Mumcular'a dönüşür"
