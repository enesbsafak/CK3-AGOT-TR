l_english:

 agot_titans_march.0001.t:0 "Piç Doğdu"

 agot_titans_march.0001.desc:0 "Bu nasıl olabilir? [daena.GetFirstName], kız kardeşim, kanım canım, en son Kız Kulesi'nden kaçtığında işlediği günahların meyvesi bir piç dünyaya getirdi. Çocuğa [daemon.GetFirstName] adını vermiş, ama babasını açıklamayı reddediyor.\n\nBu karanlık saatte bana yol gösterecek güç ve bilgelik için dua ettim; ama dualarım yanıtsız kalıyor. Çocuğun varlığı bile, bu kadar çaresizce aradığım saflığın alay konusu gibi. Etim ve kanım böyle bir zafiyete kapılmışken, nasıl Kutsanmış Kral olarak kalabilirim?\n\nGüçlü olmalıyım. Zira bu çocuk, Yediler'in önüme koyduğu pek çok imtihandan yalnızca biri. Belki de tanrılar beni bir kez daha sınamayı uygun gördü. Hepimizi bu lekeden arındırmanın bir yolunu bulmalıyım."

 agot_titans_march.0001.a:0 "Kefaret için oruç tutmalıyım."

 agot_titans_march.0001.b:0 "Yediler ikimizi de bağışlasın."

 agot_titans_march.0001.c:0 "Belki Kız Kulesi çözüm değil..."

 agot_titans_march.0100.t:0 "Konsey Toplanıyor"

 agot_titans_march.0100.desc:0 "[ROOT.Char.GetFirstNameNicknamed] son nefesini verdi. Kral öldü ve Demir Taht şimdi boş duruyor. Hak olarak, [egg3.GetTitledFirstNameRegnal]'in hayatta kalan en büyük çocuğu [daena.GetFirstName]'e geçmesi gerekir. Ancak [daena.GetFirstNameNoTooltip] vahşi ve dizginlenmemiş biri; hükümdarlığa pek uygun olmayabilir. Kız kardeşleri daha ölçülü bir seçenek olabilir: [rhaena.GetFirstName] tatlı ve dindardır, [elaena.GetFirstName] ise keskin zekâlı ve pratik biridir.\n\nYine de, kızlar hayatlarının büyük bölümünü Kız Kulesi'nde geçirdi ve hiçbirinin etkili biçimde hüküm sürememesi olasıdır. Hak iddiaları bir kenara bırakılırsa, sıradaki kişi üç kralın hükümdarlığı boyunca krallığı yöneterek yetenekli bir El olduğunu kanıtlamış [viserys.GetFirstName] olur.\n\nBoş tahtı doldurmak için kim yükselecek?"

 agot_titans_march.0100.a:0 "[daena.GetFirstNameNoTooltip]"

 agot_titans_march.0100.a.flavor:0 "[daena.GetFirstNameNoTooltip] meşru varistir; ona hakkı verilmezse bir veraset savaşı daha riske atamayız."

 agot_titans_march.0100.b:0 "[rhaena.GetFirstNameNoTooltip]"

 agot_titans_march.0100.b.flavor:0 "[rhaena.GetFirstNameNoTooltip] dindar bir kadındır ve kardeşinin mirasını koruyacaktır. [daena.GetFirstNameNoTooltip], günahları yüzünden mirastan mahrum edilmelidir."

 agot_titans_march.0100.c:0 "[elaena.GetFirstNameNoTooltip]"

 agot_titans_march.0100.c.flavor:0 "[elaena.GetFirstNameNoTooltip] zeki ve pratiktir; kızlar arasında hükümdarlığa en uygun olanıdır. [daena.GetFirstNameNoTooltip] vahşiliği yüzünden mirastan mahrum edilsin, [rhaena.GetFirstNameNoTooltip] ise arzuladığı yeminleri edebilir."

 agot_titans_march.0100.d:0 "[viserys.GetFirstNameNoTooltip]"

 agot_titans_march.0100.d.flavor:0 "Kızlar Kız Kulesi'nde tecrit edilmiş halde çok uzun zaman geçirdi; hiçbiri uygun bir kraliçe olmaz. [viserys.GetFirstNameNoTooltip] tahta çıksın."

 agot_titans_march.0301.t:0 "Kaç!"

 agot_titans_march.0301.desc:0 "Kız kardeşim [daena.GetFirstName], Kız Kulesi'nden bir kez daha kaçtı; bu kez oğlu [daemon.GetFirstName] ile birlikte ortadan kayboldu. Kimse nereye gittiğini bilmiyor ve geride hiçbir iz bırakmadı. Korkarım bu sefer geri dönmeyebilir. Davranışlarının utancı hanedanımızı lekeliyor ve ben onu durdurma gücünden yoksunum.\n\nBu deliliğe daha kaç kez katlanmak zorundayım? Halk onun başkaldırışını fısıldıyor ve sabrım tükeniyor. Yine de, dünyanın bir yerinde, büyük olasılıkla asi kanını taşıyan çocuğuyla kaybolmuş haldeyken onu düşünmek yüreğimi sızlatıyor. Kız kardeşimin kaçışı ikimizi de izleyen bir lanet ve onu bir daha görüp göremeyeceğimi merak ediyorum."

 agot_titans_march.0301.a:0 "Acaba [daena.GetHerHim]'in önünde nasıl bir kader var..."

 agot_titans_march.0301.b:0 "Kefaret için oruç tutmalıyım."

 agot_titans_march.0301.c:0 "Ana ona merhamet etsin."

 agot_titans_march.0302.t:0 "Yeni Bir Başlangıç"

 agot_titans_march.0302.desc:0 "Nihayet özgürüm. O yaldızlı zindan, Kız Kulesi, artık beni içinde tutamaz. Oğlum [daemon.GetFirstName]'i alıp onu sınırlayan duvarlardan kaçtım. Artık kendine 'Kutsanmış' diyen bir kardeşin keyfine bağlı kalmayacağım; artık asla seçmediğim bir hayatın beklentileriyle zincirlenmeyeceğim.\n\nKendime yeni bir hayat kurmaya başlamak için özgürlüğün ve fırsatın diyarı [GetTitleByKey('k_braavos').GetName]'e geldim."

 agot_titans_march.0302.a:0 "Hayatım benim, yaşamak bana kalmış."

 agot_titans_march.0401.t:0 "Gerçekleşen Bir Düş"

 agot_titans_march.0401.desc:0 "Bunca yıldan sonra hayalim nihayet hayat buldu: Visenya Tepesi'ndeki büyük sept tamamlandı!\n\n[high_septon.GetTitleAsName] onun benim adımı taşıyacağını ilan etti — #V Baelor Septi#!.\n\nAdımın, inancımızın tam kalbine bu kadar işleneceğini hiç hayal etmemiştim. Burası sıradan bir ibadet yeri değil; cisimleştirmeye çalıştığım her şeyin anıtı: her imtihanda bana yol gösteren bağlılık, dindarlık ve Yediler'e duyduğum sarsılmaz sevgi.\n\nYine de, burada dururken yolculuğumu düşünmeden edemiyorum; tanrıların istediği gibi yaşamaya çabaladığım sayısız an ve sendelediğim o kadar çok zaman. Bu adı, bu kutsal mekâna bağlanan o muazzam beklentileri gerçekten hak edebilir miyim? Zamanla, böyle bir mirasa layık adam olabilecek miyim?"

 agot_titans_march.0401.a:0 "Yediler bize yol göstersin."

 agot_titans_march.0402.t:0 "Kayıp Bir Kralın Düşü"

 agot_titans_march.0402.desc:0 "Visenya Tepesi'ndeki büyük sept nihayet tamamlandı. Görülmeye değer bir manzara: mermer kubbe güneş ışığında parlıyor, yedi kristal kule ilahi bir zarafetle parıldayarak gökyüzüne yükseliyor.\n\n[high_septon.GetTitleAsName], onun ilk hamisi olan kişinin adını taşıyacağını ilan etti — [baelor.GetFirstName] Septi. Yalnızca tanrıların lütfunu arayan, ama ne yazık ki bu günü görecek kadar yaşamayan bir krala yakışır bir saygı duruşu. Vizyonu, düşü gerçek oldu; ama artık o burada değil ve görkeminde yıkanamıyor.\n\nÖnünde dururken Baelor'u düşünmeden edemiyorum; olduğu adamı ve olmaya çalıştığı hükümdarı. Saflığı, sarsılmaz inancı ve Yediler'e duyduğu derin bağlılık — onu yücelten ve birçoğunun gözünde çöküşüne yol açan hasletler."

 agot_titans_march.0402.a:0 "Yediler bize yol göstersin."

 agot_titans_march.0402.b:0 "O bir aptaldı."

 agot_titans_march.1000.t:0 "Pentos Prensi"

 agot_titans_march.1000.desc:0 "Görünüşe göre gururumuz paramparça oldu. Üçüncü Braavos-Pentos Savaşı'ndaki yenilgi bize, gücümüzü yeniden kazanmak için yeni bir fırsat aramaktan başka seçenek bırakmadı. Gözlerimizi, fethe hazır bir ada topluluğu olan Stepstones'a çevirdik. Yine de, tüm çabalarımıza rağmen sefer başarısızlıkla sonuçlandı ve geri çekilmek zorunda kaldık.\n\nŞimdi, her zaman tetikte olan [GetTitleByKey('k_braavos').GetNameNoTier], geri çekilişimizi bir zayıflık işareti olarak gördü. Bir zamanlar bizim taşıdığımız o aynı gururdan doğan bir istilayla şimdi saldırıyorlar. Düşmanlarımız hatamızdan cesaret aldı ve kendi aşırı hırsımızın sonuçlarıyla baş başa kaldık."

 agot_titans_march.1000.a:0 "Buna dayanmalıyız."

 agot_titans_march.2000.t:0 "Braavos Deniz Lordu"

 agot_titans_march.2000.desc:0 "Üçüncü Braavos-Pentos Savaşı'ndaki zaferimizin ardından gücümüzü pekiştirmemiz gerektiğini biliyorduk. Ordumuzu daha da genişlettik, sırada ne geleceğine hazırlanıyorduk. Bu sırada gücünü ortaya koymaya hevesli [GetTitleByKey('k_pentos').GetNameNoTier], gözlerini Stepstones'a çevirdi ve o hayati adalarda bir tutunma noktası elde etmeye çalıştı.\n\nAma hırsları sarsıldı. Sefer başarısızlıkla sonuçlandı ve Stepstones'tan çekilişleri artık göz kamaştırıcı bir zayıflık işareti. Saldırı anı geldi çattı; bu, beklediğimiz fırsat ve onun geçmesine izin vermeyeceğiz."

 agot_titans_march.2000.a:0 "Bir kez daha zafer kazanacağız."

 agot_titans_march.3000.t:0 "Andalos Hanımı"

 agot_titans_march.3000.desc:0 "Babam son yıllarını, amansız bir kararlılıkla izlediği bir vizyon olan kadim bir Andal krallığını yeniden kurma hayaliyle geçirdi. Ama hayalini gerçekleştirmeyi görmeden ölüm onu aldı ve hırsı yarım kaldı. Ancak düşünün onunla ölmesine izin vermeyeceğim. Başladığı işi bitireceğim.\n\n[GetTitleByKey('k_braavos').GetNameNoTier] ile [GetTitleByKey('k_pentos').GetNameNoTier] arasındaki savaş sürüyor; bölgedeki güç dengesini çoktan yeniden şekillendirmiş bir çatışma bu. Bu, avantajı ele geçirip nüfuzumuzu genişletmek için mükemmel bir fırsat olabilir. Akıllıca davranırsam, babamın yeniden kurmaya çalıştığı gücü elde etmek için bu kaostan faydalanabiliriz."

 agot_titans_march.3000.a:0 "Savaşa!"

 agot_titans_march.3000.b:0 "Şimdilik zamanımı bekleyeceğim."

 agot_titans_march.4000.t:0 "Sürgündeki Bir Deniz Lordu"

 agot_titans_march.4000.desc:0 "Bir zamanlar [GetTitleByKey('k_braavos').GetNameNoTier]'in Deniz Lordu'ydum; makamımdan emin, halkımın güvenini kazanmıştım. Ama gölgelerin içinde ihanet kuluçkaya yattı. Koşulsuz güvendiğim filo amiralim [sealord.GetTitledFirstName], en beklemediğim anda vurdu. İhanetin soğuk çeliğiyle, beni deviren bir darbe yönetti; kendi hırsı onu Deniz Lordu makamına taşıdı. Bir zamanlar yuvam dediğim şehir artık onun emrinde.\n\nElimde canımdan ve bir zamanlar Braavos'a satılmış üç ejderha yumurtasından başka hiçbir şeyle kaçmadım. Yumurtalar güç vaadi taşıyor olabilir; ama şimdilik kaybettiklerimin kırılgan birer hatırlatıcısı.\n\nDünya acımasız ve Braavos'ta artık bana yer yok. Ama ben unutulmayacağım."

 agot_titans_march.4000.a:0 "Yeniden yükselmenin bir yolunu bulacağım."

 agot_titans_march.4001.t:0 "Yumurtaların Bedeli..."

 agot_titans_march.4001.desc:0 "Bu üç ejderha yumurtası — elimde kalan tek hazine — hem umudun hem de yıkımın simgesi. Yanlış ellerde yıkıcı bir güç olabilirler, ama aynı zamanda güçlü bir pazarlık kozu. Her zaman avantaj peşinde olan [prince.GetFullName], ister altınla ister güç vaatleriyle onlar için muhtemelen cömertçe öder. Pentos'un bu yumurtaları Braavos'a karşı savaşlarında kullanabilmesi daha da iyi olur."

 agot_titans_march.4001.a:0 "Altın bana ihtiyacım olan her şeyi alabilir."

 agot_titans_march.4001.tooltip:0 "#bold Kabul edilirse:#!"

 agot_titans_march.4001.eggs_gone:0 "#bold Bir dakika, yumurtalar nereye gitti...?#!"

 agot_titans_march.4001.alliance:0 "Müzakere edilmiş bir ittifak kurulacak"

 agot_titans_march.4001.b:0 "Asıl ihtiyacım olan şey askerî destek."

 agot_titans_march.4001.c:0 "Bir unvan isteyeceğim."

 agot_titans_march.4001.d:0 "Onların fiyatı biçilemez."

 agot_titans_march.4002.t:0 "Bir Teklif... Yumurtalarla!"

 agot_titans_march.4002.desc:0 "Braavos'un eski Deniz Lordu, şimdi eski benliğinin bir gölgesi, bana ilginç bir teklifle mektup yazdı. Bana üç ejderha yumurtası satmayı teklif ediyor; her çatışmanın kaderini değiştirebilecek nadir ve güçlü hazineler. Bir zamanlar Braavos'un gücünün dizginlerini elinde tutan bir adama güvenmeyeceğimi bilirim; ama böyle nadir bir armağanı edinme fırsatı göz ardı edilemez. Gerçek niyeti ne? Belki Braavos'un kalbine vurma şansı, belki de sadece avantaj elde etmenin bir yolu."

 agot_titans_march.4002.a:0 "Onlara sahip olmalıyım."

 agot_titans_march.4002.b:0 "Belki altın kabul eder."

 agot_titans_march.4002.tooltip:0 "#bold Kabul edilirse:#!"

 agot_titans_march.4002.c:0 "Belki askerî destek kabul eder."

 agot_titans_march.4002.d:0 "Belki ona bir unvan teklif edebilirim."

 agot_titans_march.4002.e:0 "İşe yaramaz süs eşyalarına ihtiyacım yok."

 agot_titans_march.4003.t:0 "Karşı Teklif"

 agot_titans_march.4003.desc:0 "Prens umduğum kadar hevesli değildi. İlk fiyatımı reddedip bir karşı teklif gönderdi; dikkatle değerlendirmem gereken bir teklif. Bu yumurtaların benden daha az değerli olduğunu düşünüyor ya da belki de sadece durumumdan faydalanmaya çalışıyor. Yine de, tamamen reddedilecek bir teklif değil. Yumurtalar güçlü bir pazarlık kozu olmaya devam ediyor ve onun koşullarının kabul edilebilir olup olmadığına karar vermeliyim."

 agot_titans_march.4003.a:0 "Sanırım idare eder."

 agot_titans_march.4003.b:0 "Bu, istediğim şey değil."

 agot_titans_march.4002_accepted.title:0 "Teklif Kabul Edildi!"

 agot_titans_march.4002_accepted.desc:0 "[prince.GetTitledFirstName], ejderha yumurtaları için fiyatını kabul etti"

 agot_titans_march.4002_refused.title:0 "Teklif Reddedildi!"

 agot_titans_march.4002_refused.desc:0 "[prince.GetTitledFirstName], ejderha yumurtalarınla ilgilenmiyor"

 agot_titans_march.5000.t:0 "Titan Yıkılıyor"

 agot_titans_march.5000.desc:0 "Stepstones'tan stratejik çekilişimizin ardından bizi evimizde savaş karşıladı; bunu düzenleyen, Pentos'un başındaki en büyük diken olan bir Braavos Deniz Lordu'ndan başkası değildi. Varsa yoksa aptalca bir hataydı. Güneyde geçirdikleri zamanla çelikleşmiş, hayli tecrübeli gazilerimiz, topraklarımıza girişlerini durdurmak için yürüdü. Onların, yıllarca süren korsan çatışmalarıyla yıpranmış, uyuşukça kılıçlarına atılacak yorgun bir acemi asker güruhundan başka bir şey bulmayı bekledikleri yerde, Prens'in adamları dimdik duruyordu.\n\nBizi zayıf sanmışlardı, ama biz mevzimizi koruduk ve sözde kendini 'kurtarıcı' ilan edenleri Andalos'tan attık. Toz duman yatıştığına göre, bir kez daha tartışmasız hâkimi olarak duruyoruz."

 agot_titans_march.5000.a:0 "Andalos bizim!"
