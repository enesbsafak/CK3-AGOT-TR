### TODO NOT-IN-ST: agot_dragon_warfare.0042.desc [AGOT: I direct our forces with great care, knowing that for this plan to work we need to be in the right place at the right time. I am about to give the order to charge when I see [dragonrider_in_battle.GetTitledFirstName] and [dragon_in_battle.GetNameNicknamed] flying towards us. Time to act!\n\nI give the order with a wave of my hand, and the water wizards begin their work as a spiraling column of water appears, towering over the battlefield.\n\n[dragon_in_battle.GetNameNoTooltip] roars in defiance, [dragon_in_battle.Custom('GetDragonHerHis')] wings beating furiously as [dragon_in_battle.Custom('GetDragonSheHe')] attempts to flee and [dragonrider_in_battle.GetTitledFirstNameNoTooltip] tries to maintain control over the [dragon_in_battle.Custom('GetDragonColorFull')] beast, but the pillar of water rapidly envelops the dragon and rider both. [dragon_in_battle.GetNameNoTooltip] struggles, [dragon_in_battle.Custom('GetDragonHerHis')] body writhing within the drowning grip of the abyss, but the relentless tide pulls [dragon_in_battle.Custom('GetDragonHerHim')] under. Slowly, the dragon's mighty form sinks, swallowed whole by the waters, [dragon_in_battle.Custom('GetDragonHerHis')] furious roars silenced beneath the depths.\n\nThe water finally recedes to reveal [dragon_in_battle.GetNameNoTooltip] lying lifeless with [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] broken body beside [dragon_in_battle.Custom('GetDragonHerHim')].]
