### TODO NOT-IN-ST: agot_dragon_warfare.0014.desc [AGOT: This will be remembered as one of the most devastating military blunders in the realm's history.\n\nThat such a standard plan — to meet up before the battle to discuss strategy and positioning — could go so wrong would have been unthinkable yesterday. [enemy_knight.GetTitledFirstName], as well as my other commanders and topmost warriors, met before the battle. But instead of discussing strategy, they faced horror: [dragonrider_in_battle.GetTitledFirstName] descended on dragonback and bathed my army's leaders in dragonflame!\n\nThose not dead are horrifically burned, thanks to the [dragon_in_battle.Custom('GetDragonColorFull')] terror [dragon_in_battle.GetNameNicknamed]. Myself and a few others only avoided such a fate by not yet having arrived... The leadership of our army is devastated, and we will now surely lose this battle.]
 agot_dragon_warfare.0014.desc:0 "This will be remembered as one of the most devastating military blunders in the realm's history.\n\nThat such a standard plan — to meet up before the battle to discuss strategy and positioning — could go so wrong would have been unthinkable yesterday. [enemy_knight.GetTitledFirstName], as well as my other commanders and topmost warriors, met before the battle. But instead of discussing strategy, they faced horror: [dragonrider_in_battle.GetTitledFirstName] descended on dragonback and bathed my army's leaders in dragonflame!\n\nThose not dead are horrifically burned, thanks to the [dragon_in_battle.Custom('GetDragonColorFull')] terror [dragon_in_battle.GetNameNicknamed]. Myself and a few others only avoided such a fate by not yet having arrived... The leadership of our army is devastated, and we will now surely lose this battle."
