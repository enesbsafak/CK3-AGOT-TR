### TODO NOT-IN-ST: agot_dragon_warfare.0019.desc [AGOT: I am overseeing the preparations of my lines for the inevitable the battle of [battle_location.GetName]. As I am directing the emplacements, I see [enemy_commander_in_battle.GetName] putting on their helmet across the enemy lines. Surely, [enemy_commander_in_battle.GetSheHe] can't be charging directly in front of the van?\n\n[enemy_commander_in_battle.GetSheHe|U] is! Like a runaway cart I see what will happen before it does. [dragonrider_in_battle.GetTitledFirstName] descends like a bolt of lightning on [dragon_in_battle.GetName], and with a #bold TH-WOOP#! that can be heard across the whole battlefield I watch [enemy_commander_in_battle.GetHerHis] body get struck from [enemy_commander_in_battle.GetHerHis] horse, flying dozens of feet before crashing into the ground. If that wasn't enough, [enemy_commander_in_battle.GetSheHe] is then crushed by [enemy_commander_in_battle.GetHerHis] own troops charge.]
 agot_dragon_warfare.0019.desc:0 "I am overseeing the preparations of my lines for the inevitable the battle of [battle_location.GetName]. As I am directing the emplacements, I see [enemy_commander_in_battle.GetName] putting on their helmet across the enemy lines. Surely, [enemy_commander_in_battle.GetSheHe] can't be charging directly in front of the van?\n\n[enemy_commander_in_battle.GetSheHe|U] is! Like a runaway cart I see what will happen before it does. [dragonrider_in_battle.GetTitledFirstName] descends like a bolt of lightning on [dragon_in_battle.GetName], and with a #bold TH-WOOP#! that can be heard across the whole battlefield I watch [enemy_commander_in_battle.GetHerHis] body get struck from [enemy_commander_in_battle.GetHerHis] horse, flying dozens of feet before crashing into the ground. If that wasn't enough, [enemy_commander_in_battle.GetSheHe] is then crushed by [enemy_commander_in_battle.GetHerHis] own troops charge."
