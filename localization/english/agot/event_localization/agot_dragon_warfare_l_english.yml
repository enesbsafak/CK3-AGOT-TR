### TODO NOT-IN-ST: agot_dragon_warfare.0022.desc [AGOT: I direct our forces with great care, knowing that for this plan to work we need to be in the right place at the right time. I am about to give the order to charge when I see [dragonrider_in_battle.GetTitledFirstName] and [dragon_in_battle.GetNameNicknamed] flying towards us. No time to plan, it's time to act!\n\nI give the order with a wave of my hand, and a bolt from our scorpion flies straight and true. Like an arrow from a master archer, it strikes [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] [dragon_in_battle.Custom('GetDragonColorFull')] dragon, arcs of blood and fire spraying from the wound. The dragon [dragon_in_battle.GetNameNoTooltip] lets out a roar of pain and rage, before they both crash into the ground in a great cloud of dust.]
 agot_dragon_warfare.0022.desc:0 "I direct our forces with great care, knowing that for this plan to work we need to be in the right place at the right time. I am about to give the order to charge when I see [dragonrider_in_battle.GetTitledFirstName] and [dragon_in_battle.GetNameNicknamed] flying towards us. No time to plan, it's time to act!\n\nI give the order with a wave of my hand, and a bolt from our scorpion flies straight and true. Like an arrow from a master archer, it strikes [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] [dragon_in_battle.Custom('GetDragonColorFull')] dragon, arcs of blood and fire spraying from the wound. The dragon [dragon_in_battle.GetNameNoTooltip] lets out a roar of pain and rage, before they both crash into the ground in a great cloud of dust."

