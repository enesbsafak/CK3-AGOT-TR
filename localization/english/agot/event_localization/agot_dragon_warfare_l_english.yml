### TODO NOT-IN-ST: agot_dragon_warfare.0024.desc [AGOT: I stand prepared for the battle, surrounded by retainers. In the line with my men, watching [dragonrider_in_battle.GetTitledFirstName] astride [dragon_in_battle.GetName] fly towards the enemy, I feel the adrenaline start to rise. We must surely win with such a force on our side!\n\nBefore my very eyes, however, a sudden gout of blood and flame sprays from [dragon_in_battle.GetFirstNamePossessiveNoTooltip] neck, the roar echoing across the soon-to-be battlefield! With a squint of my eyes I see its source — a bolt from a scorpion! Both dragon and rider cry as they crash into the ground in a great cloud of dust, and do not rise.]
 agot_dragon_warfare.0024.desc:0 "I stand prepared for the battle, surrounded by retainers. In the line with my men, watching [dragonrider_in_battle.GetTitledFirstName] astride [dragon_in_battle.GetName] fly towards the enemy, I feel the adrenaline start to rise. We must surely win with such a force on our side!\n\nBefore my very eyes, however, a sudden gout of blood and flame sprays from [dragon_in_battle.GetFirstNamePossessiveNoTooltip] neck, the roar echoing across the soon-to-be battlefield! With a squint of my eyes I see its source — a bolt from a scorpion! Both dragon and rider cry as they crash into the ground in a great cloud of dust, and do not rise."

