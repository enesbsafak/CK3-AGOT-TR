 killed_by_dragon_jaws_knight_friendly:0 "[CHARACTER.GetShortUINameNoTooltip] aniden inerek [CHARACTER.Custom('GetDragonHerHis')] devasa çenelerini [TARGET_CHARACTER.GetShortUINameNoTooltip]'in çevresinde kapattı; [TARGET_CHARACTER.GetHerHim]'i çığlık atarak gökyüzüne kaldırdı ve ardından [TARGET_CHARACTER.GetHerHim]'i aşağıdaki boşluğa bıraktı."

 killed_by_dragon_jaws_knight_enemy:0 "[CHARACTER.GetShortUINameNoTooltip] aniden inerek [CHARACTER.Custom('GetDragonHerHis')] devasa çenelerini [TARGET_CHARACTER.GetShortUINameNoTooltip]'in çevresinde kapattı; [TARGET_CHARACTER.GetHerHim]'i çığlık atarak gökyüzüne kaldırdı ve ardından [TARGET_CHARACTER.GetHerHim]'i aşağıdaki boşluğa bıraktı."

 killed_by_dragon_breath_knight_friendly:0 "Ani bir kükürtlü nefes rüzgârı, [TARGET_CHARACTER.GetShortUINameNoTooltip]'in tek uyarısıydı; ardından ölümcül bir alev jeti [TARGET_CHARACTER.GetHerHim]'i sardı ve geride yalnızca kömürleşmiş bir siluet bıraktı."

