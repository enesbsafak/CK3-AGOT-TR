l_english:

 agot_dragon_warfare.you_have_received_buff:0 "#P [dragon_in_battle.GetName] bu savaşta size çok yardımcı oldu!#!\n\n#weak Geçici bir etki aldınız.#!"

 agot_dragon_warfare.you_have_caused_buff:0 "#P [dragon_in_battle.GetName] bu savaşta tarafınıza çok yardımcı oldu!#!\n\n#weak Savaş komutanı geçici bir etki aldı.#!"

 agot_dragon_warfare.enemy_has_received_buff:0 "#N [dragon_in_battle.GetName] bu savaşta tarafınıza çok zarar verdi!#!\n\n#weak Düşman komutanı geçici bir etki aldı.#!"

 agot_dragon_warfare.0001.t:0 "Yer Sarsan Kükreme"

 agot_dragon_warfare.0002.t:0 "$agot_dragon_warfare.0001.t$"

 agot_dragon_warfare.0002.opening1:0 "Maiyetim ve ben, [dragon_commander_in_battle.GetName] kuvvetleriyle savaşa hazırlanırken alanın karşısındaki düşmanı seçiyoruz; tam o sırada havadan gelen bir #bold kükreme#! gökyüzünü ikiye bölüyor!\n\n"

 agot_dragon_warfare.0002.opening2:0 "Çeliğin çeliğe çarpması... Metalin ete gömülmesi... Çevremde savaşın sesleri acımasız bir kakofoni oluşturuyor. Ama delici bir #bold kükreme#! gürültüyü yardığında, dünyam sessizliğe gömülüyor.\n\n"

 agot_dragon_warfare.0002.opening3:0 "[dragon_commander_in_battle.GetNamePossessive] askerlerinin benim askerlerime doğru dalgası dehşet verici; ama dikkatim hızla gökyüzüne kayıyor. Kudretli bir #bold kükreme#! havayı yırtıyor, göğsümdeki soluğu söküp alıyor.\n\n"

 agot_dragon_warfare.0002.mid1:0 "Atım altımdan ürküp fırlıyor; [dragon_in_battle.GetNameNicknamed] adlı [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] canavarıyla gökyüzünde uçup giden [dragonrider_in_battle.GetTitledFirstName]'den dörtnala uzaklaşırken zor bela tutunuyorum!\n\n"

 agot_dragon_warfare.0002.mid2:0 "Çevremdeki en dayanıklı askerler bile ürperip yerinde kıpırdanıyor — [dragonrider_in_battle.GetTitledFirstName], [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] ejderhası [dragon_in_battle.GetNameNicknamed]'in sırtında savaş alanında fırtına gibi geçerken cesur görünmeye çalışıyorlar!\n\n"

 agot_dragon_warfare.0002.mid3:0 "[dragon_in_battle.Custom('GetDragonColorFull')] canavar [dragon_in_battle.GetNameNicknamed]'in çevresine alevler püskürtüp sırtındaki [dragonrider_in_battle.GetTitledFirstName]'i ateşten bir kucaklayışa alışını izlerken [ROOT.Char.Custom('signature_weapon')]'imi sıkıca kavrıyorum.\n\n"

 agot_dragon_warfare.0002.ending1:0 "Çevreme bakıyorum ve düşman askerlerinin hatlarımızda açılan boşluğa akın ettiğini görüyorum. Bu bölgeyi tutmak artık faydasız. Zorlu bir dörtnala geri çekiliyoruz; geride kalanlar ejderha ateşiyle yıkanırken hattımız geri çekilmek zorunda kalıyor."

 agot_dragon_warfare.0002.ending2:0 "Çevremde savunma hatlarım çöküyor. İnsanlar böyle bir gücün karşısında nedir ki? Acele bir geri çekilme emri veriyorum; ancak ejderha ateşi kaçan kuvvetleri boğarken onlarcasının bir anda ölümüyle buluştuğunu görüyorum."

 agot_dragon_warfare.0002.ending3:0 "Umutsuzluktan başka bir şey yok, yalnızca is ve duman. Atımı çevirip alandan hızla geri çekiliyorum. Kükreme artık yeterince boğuluyor... O kadar şanslı olmayan, can çekişen askerlerin çığlıkları ve iniltileriyle."

 agot_dragon_warfare.0002.a:0 "Böyle bir canavarın karşısında kim durabilirdi ki?!"

 agot_dragon_warfare.0003.t:0 "$agot_dragon_warfare.0001.t$"

 agot_dragon_warfare.0003.opening:0 "[dragon_in_battle.GetName]'in [battle_location.GetName] Savaşı'nda kullanılması son derece etkili oldu!\n\n"

 agot_dragon_warfare.0003.ending1:0 "Hatlarımız çarpışırken [dragonrider_in_battle.GetName] ve [dragon_in_battle.GetNameNicknamed], [dragon_in_battle.Custom('GetDragonHerHis')] dehşet verici #bold kükremesi#! karşısında kuvvetleri dağılan [enemy_knight.GetName]'e doğru uçtu. Hatları kırıldıktan sonra [dragonrider_in_battle.GetFirstNameNoTooltip] askerlerini ateşe boğdu. Birliklerimiz bozgunun ardından hücuma geçti ve düşman önümüzden kaçıyor!"

 agot_dragon_warfare.0003.ending2:0 "Savaşın kızgınlığında [dragonrider_in_battle.GetName], [dragon_in_battle.GetNameNicknamed]'in sırtında düşman hatlarına doğru dönüş yaptı. [dragon_in_battle.Custom('GetDragonColorFull')] canavar, çıra odunu gibi düşman hatlarını yaran gök gürültüsü gibi bir #bold kükreme#! saldı. [enemy_knight.GetName] ve [enemy_knight.GetHerHis] adamları düzensiz biçimde geri çekilirken [dragonrider_in_battle.GetFirstNameNoTooltip] üzerlerine ateş yağdırdı!"

 agot_dragon_warfare.0003.ending3:0 "Kılıç ve kalkan çarpışmaları yüksek sesle çınlarken [dragonrider_in_battle.GetNamePossessive] [dragon_in_battle.Custom('GetDragonColorFull')] ejderhası vahşi bir #bold kükreme#! saldı; düşman askerleri dört bir yana kaçıştı. Kendi askerlerimiz durumdan yararlanıp muhalefeti ezip geçti. Tüm bu süre boyunca [dragon_in_battle.GetNameNicknamed], [enemy_knight.GetFirstNamePossessiveNoTooltip] budalalığının üzerine alev tufanları yağdırıyor."

 agot_dragon_warfare.0003.ending4:0 "Çok az kişi, [dragon_in_battle.GetNamePossessive] #bold kükremesinin#! sağır edici sesinin savaş alanında dalgalar hâlinde yayıldığını inkâr edebilir. [enemy_knight.GetName] ve [enemy_knight.GetHerHis] birlikleri acele bir geri çekilişte sendeleyip tökezliyor; [dragonrider_in_battle.GetName] ise gürültünün üstünde haykırıyor: #emp Dracarys!#!"

 agot_dragon_warfare.0003.a:0 "Bu savaşa büyük bir nimet!"

 agot_dragon_warfare.0004.t:0 "$agot_dragon_warfare.0001.t$"

 agot_dragon_warfare.0004.opening1:0 "Kuvvetlerimizin komutanı olarak yüksek mevzim, birliklerimizin görebildiğinden hemen önce dehşeti görmemi sağlıyor. [dragon_in_battle.Custom('GetDragonColorFull')] canavar [dragon_in_battle.GetNameNicknamed]'in [enemy_knight.GetNamePossessive] mevzisine doğru uçuşunu izliyorum; [enemy_knight.GetHerHis] birlikleri tek bir direniş bile göstermeden dağılıyor."

 agot_dragon_warfare.0004.opening2:0 "Bir orduya komuta etmek kolay iş değildir; hele ejderha gibi dehşet verici bir güce sahip bir düşmana karşı hiç değil. [dragon_in_battle.Custom('GetDragonColorFull')] canavar [dragon_in_battle.GetNameNicknamed] [dragon_in_battle.Custom('GetDragonHerHis')] saldırısını [enemy_knight.GetNamePossessive] mevzisine yöneltirken bunu tedirginlikle izliyorum. Birlikler böcek gibi dağılıyor; ama ejderha ateşi çoğunu yakalıyor."

 agot_dragon_warfare.0004.opening3:0 "Savaş her zamanki gibi başlıyor: çeliğin çeliğe uyumsuz şakırtısı, staccato bir ölüm şarkısı çalıyor. Uzaktaki mevzimden, tını değişikliği algılanmadan önce manzara bana net görünüyor... [dragon_in_battle.GetNameNicknamed], [enemy_knight.GetNamePossessive] mevzisine dalışa geçiyor ve kaçan birliklerin üzerine ejderha ateşi salıyor. #italic Çığlıklar#! duyuyorum. #italic Bunlar insanların ölüm feryatları.#!"

 agot_dragon_warfare.0004.ending:0 "\n\nDaha sonra [enemy_knight.GetTitledFirstNameNoTooltip]'den ejderhanın dehşet verici bir #bold kükreme#! saldığını duyuyorum; ama artık önemi yok — verilen hasar verildi."

 agot_dragon_warfare.0004.a:0 "Böyle canavarlarla savaşırken daha fazla cesaret gerekir!"

 agot_dragon_warfare.0005.t:0 "$agot_dragon_warfare.0001.t$"

 agot_dragon_warfare.0005.opening1:0 "Savaş henüz bitmemişken [dragon_in_battle.GetName] ve ben savaş alanının üzerinde alçaktan uçuyoruz. Hatlarına doğru dönerken [dragon_in_battle.Custom('GetDragonColorFull')] bineğim büyük bir #bold kükreme#! salıyor; düşman [enemy_knight.GetName] sendelemeye başlıyor, [enemy_knight.GetHerHis] yoldaşları tam kendi kuvvetlerimiz hücuma geçerken dağılıyor.\n\n"

 agot_dragon_warfare.0005.opening2:0 "Savaş sürerken [dragon_in_battle.GetName]'i, [enemy_knight.GetName] tarafından özenle tutulan hattın üzerinde bir dalışa sokuyorum. Hiçbir uyarım olmadan [dragon_in_battle.GetNameNoTooltip] güçlü bir şekilde #bold kükriyor#! — öfkeyle dalgalanan dehşet verici bir ses.\n\n"

 agot_dragon_warfare.0005.cruel:0 "Bu düşman askerleri kurtçuktan farksız; ışığa maruz kalmış gibi ürküp kaçıyorlar. #italic Pis kurtçuklar#!, diye düşünüyorum kendi kendime."

 agot_dragon_warfare.0005.vengeful:0 "Düşman hatlarını bizzat kendim paramparça edeceğim. Bir ejderhaya karşı kim durabilir ki? #italic Bana#! karşı kim durabilir ki?!"

 agot_dragon_warfare.0005.mid:0 "Bu beklenmedik bozgun düşman birliklerini kargaşa ve korkuya sürüklüyor — kimi gruplar geri çekilerek kopuyor, kimileri asla gelmeyecek emirler için komutanlarına bakıyor, daha kimileriyse tam bir şok içinde donakalıyor."

 agot_dragon_warfare.0005.ending1:0 "Aşağıdaki birliklerimiz şimdi ileri atılıyor; bu fırsatı düşmanın savunma girişimlerini etkisiz kılmak için kullanıyor.\n\nAlttaki araziyi süzüp onu alevlere boğmaya hazırlanıyorum."

 agot_dragon_warfare.0005.ending2:0 "Askerlerimiz durumdan çabucak yararlanıyor; düşman hattı çökerken ileri hücum ediyor.\n\nKaçan düşmanın üzerine alev yağdırmaya hazırlanırken bakışlarım sertleşiyor."

 agot_dragon_warfare.0005.ending3:0 "Önümde gördüğüm tek şey düşman ordusunun sırtları.\n\nAltımdaki [dragon_in_battle.GetNameNoTooltip]'ten yayılan sıcağı ve gücü hissediyorum ve ne yapmam gerektiğini biliyorum."

 agot_dragon_warfare.0005.a.valyrian:0 "#EMP Dracarys!#!"

 agot_dragon_warfare.0005.a:0 "Üzerlerine ateş püskürt, [dragon_in_battle.GetNameNoTooltip]!"

 agot_dragon_warfare.0006.t:0 "Çılgın Bir Hücum"

 agot_dragon_warfare.0007.t:0 "$agot_dragon_warfare.0006.t$"

 agot_dragon_warfare.0007.opening1:0 "Kendimi [battle_location.GetName] Savaşı'nın kargaşasının ortasında buluyorum; çevremde insanlar ölüyor. Burun deliklerim kan kokusuyla doluyor ve kalbimin göğsümde güm güm atışını duyabiliyorum. Bir adamın gözlerinden hayatın sönüşünü izliyorum; insan çamurunun içinde renkler belirsiz. Arkamdan bir çığlık, bir çarpma ve bir sıcaklık dalgası."

 agot_dragon_warfare.0007.opening2:0 "Çevreme bakıyorum; acımasız [battle_location.GetName] Savaşı dört bir yanda gürültüyle sürüyor. Çelik çeliğe çarpıyor. İnsanlar inliyor ve sızlanıyor; çevremde anlatılmamış ölümlerle ölüyorlar. Hava demir kokulu kan kokusuyla doluyor, sonra koku keskin ve dumanlı bir hâl alıyor... #bold Ejderha ateşi!#!"

 agot_dragon_warfare.0007.opening3:0 "Bir beden üstüme çarpıp beni dengesizleştiriyor. Teri — ya da kanı mı? — kırparak uzaklaştırıp kendimi toparlıyorum ve [ROOT.Char.Custom('signature_weapon')]'imle bir düşman askerini daha yere seriyorum; kan zırhımın üzerine sıçrıyor. Ansızın bir sıcaklık patlaması savaş alanında dalgalanıyor."

 agot_dragon_warfare.0007.mid:0 "\n\nDönüp [dragonrider_in_battle.GetTitledFirstName]'in [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] ejderhası [dragon_in_battle.GetNameNicknamed]'le öncü kıtamızın arasından kanlı bir yol açtığını görüyorum!"

 agot_dragon_warfare.0007.ending1:0 "Dişler, kuyruk ve pençeler yıkımın bıraktığı alev izlerini takip ederken adamlar zırhlarının içinde pişiyor. Kimisi donakalıyor, böyle bir güç karşısında tepki veremiyor. Onlar ölüyor. Çoğu böylesine bir kudret karşısında çözülüp kaçıyor.\n\n"

 agot_dragon_warfare.0007.ending2:0 "Küle dönüşen askerler, kıtırdayıp çıtırdayan at etleri... Çevremdeki yıkım ölçülemez. Başka bir ejderha ateşi patlamasıyla bir dizi askerin kül oluşunu izliyorum; diğerleri dört bir yana kaçıyor. İnsanların böyle bir canavara karşı ne umudu olabilir?\n\n"

 agot_dragon_warfare.0007.lunatic:0 "Tam o anda önümde bir görüntü beliriyor: [ROOT.Char.GetTitledFirstName], bir ejderha avcısı, herkesin üzerinde yükselen bir kahraman. [ROOT.Char.GetHerHim]'in yanında övgüler söyleyen bir şarkıcı korosu. #italic O benim!#! diye düşünüyorum, [dragon_in_battle.GetNameNoTooltip]'e doğru çılgın hücumuma başlarken."

 agot_dragon_warfare.0007.rude:0 "Çevremdeki lanet kargaşa kafamın içindeki çılgınlığa dönüşüyor. O #bold lanet#! ejderha işi keseyi öldürebilecek biri varsa o da benim. Geliyorum, [dragon_in_battle.GetNameNoTooltip]. Senin celladın ben olacağım."

 agot_dragon_warfare.0007.shrewd:0 "Çevremdeki yıkım yavaşlıyor gibi; sanki zamanın ta kendisi derin bir nefes alıyor. Bir açık görüyorum: Ejderhayı isabetle delebilirsem, [dragon_in_battle.Custom('GetDragonHerHim')]'i pulların arasındaki zayıf bir noktadan vurabilirim. Belki ahmaklık, ama tek umudumuz bu."

 agot_dragon_warfare.0007.zealous:0 "Çevremdeki ölüm ve yıkımın ortasında tehlikeli bir yol görüyorum — yalnızca [ROOT.Char.GetFaith.HighGodName]'in bana yol gösterebileceği bir yol. Önümde bir ejderha; bir dua edip mübarek hücumuma hazırlanıyorum."

 agot_dragon_warfare.0007.fallback:0 "Çağrılmadan, yıkımın içinden geçen bir yol bana gösteriliyor. Onu görebiliyorum. Çılgınca bir hücum olurdu. #italic Umutsuz#! bir hücum. Ama belki de gereken tam olarak budur."

 agot_dragon_warfare.0007.a:0 "[enemy_knight.GetHouse.GetBaseName] Hanesi'ne şan olsun!"

 agot_dragon_warfare.0007.aawaaga:0 "#bold Aawaaga!#!"

 agot_dragon_warfare.0007.a.f:0 "Ejderha [dragon_in_battle.GetName]'i öldürmek için çılgınca bir hücum yapıyorsunuz"

 agot_dragon_warfare.0007.b:0 "Buradan çıkmam gerek!"

 agot_dragon_warfare.0007.b.f:0 "Diğerleri gibi koşuyorsunuz"

 agot_dragon_warfare.0008.t:0 "$agot_dragon_warfare.0006.t$"

 agot_dragon_warfare.0008.opening1:0 "[dragon_in_battle.GetName] ve ben [battle_location.GetName]'i alevlere boğarken [dragon_in_battle.Custom('GetDragonHerHis')] kanının altımda kabardığını hissediyorum. [dragon_in_battle.Custom('GetDragonSheHe')|U] gerçek bir savaş istiyor ve ben de isteğini kabul etmek zorunda hissediyorum. Öncü kıtalarının üzerine dalışa geçmeden önce son bir süpürme uçuşu yapıyor, kuvvetlerini diş, kuyruk ve pençe altında kırıp geçiyoruz. [dragon_in_battle.GetNameNoTooltip], [enemy_commander_in_battle.GetTitledFirstNamePossessive] ordusunu — ve adamlarını — parçalarken kanlar havada uçuşuyor.\n\n"

 agot_dragon_warfare.0008.opening2:0 "[dragon_in_battle.GetName] bir ejderha ateşi patlaması daha salarak [battle_location.GetName]'i alevlere boğuyor. [dragon_in_battle.Custom('GetDragonHerHis')] [dragon_in_battle.Custom('GetDragonColor')] pullarını okşayıp [dragon_in_battle.Custom('GetDragonHerHim')]'i ileri itiyorum. [enemy_commander_in_battle.GetTitledFirstNamePossessive] öncü kıtasına doğru dönüş yapıyoruz; [dragon_in_battle.GetNameNoTooltip] iniş yaparken adamları ve atları birbirinden ayırt etmeden parçalıyor.\n\n"

 agot_dragon_warfare.0008.opening3:0 "[battle_location.GetName]'de süren savaşın yakınına süzülürken [dragon_in_battle.GetNamePossessive] dizginlerine tutuşum sıkılaşıyor. [dragon_in_battle.Custom('GetDragonHerHis')|U] alevleri düşman hatlarını yarıyor; [enemy_commander_in_battle.GetTitledFirstNamePossessive] askerlerini yumuşak koyun eti gibi didikliyor. Kıkırdayarak bir asker kümesinin üzerine inen [dragon_in_battle.Custom('GetDragonSheHe')], [dragon_in_battle.Custom('GetDragonHerHis')] [dragon_in_battle.Custom('GetDragonColorFull')] kuyruğuyla kaçışan birkaç bedeni süpürüp atıyor.\n\n"

 agot_dragon_warfare.0008.fled:0 "Kimisi ağzı açık dikilmekten kendini alamıyor. [dragon_in_battle.GetNameNoTooltip] yine de hepsini parçalayıp geçiyor. Geri kalanlar kudretimizin önünde kaçıyor ve ben [enemy_knight.GetTitledFirstName]'in diğerleriyle birlikte yaya kaçışını seçiyorum."

 agot_dragon_warfare.0008.died:0 "Düşmanın kanı çevremizi sararken ve adamlar kudretimizin önünde kaçarken [enemy_knight.GetTitledFirstName]'in kaçan adamların arasında yılan gibi kıvrılarak doğrudan üstümüze geldiğini görüyorum! [enemy_knight.GetSheHe|U] bizi fazla yavaş sanıyor; ama baldırlarımın bir kıvrımıyla [dragon_in_battle.GetNameNoTooltip] dönüp [enemy_knight.GetHerHis] gövdesini tam ortasından ısırıyor ve [enemy_knight.GetHerHis] kanlı bacaklarını cansız bir şekilde yere düşmek üzere bırakıyor."

 agot_dragon_warfare.0008.killed:0 "Düşmanın kanı çevremizi sararken ve adamlar kudretimizin önünde kaçarken [enemy_knight.GetTitledFirstName]'in kaçan adamların arasında yılan gibi kıvrılarak doğrudan üstümüze geldiğini görüyorum! [enemy_knight.GetSheHe|U] var gücüyle koşuyor; [dragon_in_battle.GetNameNoTooltip]'i [enemy_knight.GetHerHim]'e çevirmek için baldırlarımı kıvsam da çok yavaş! [enemy_knight.GetFirstNameNoTooltip]'in tek bir isabetli darbe indirişini, [enemy_knight.GetHerHis] kılıcının, izlemekten başka yapabileceğim hiçbir şey yok "

 agot_dragon_warfare.0008.decapitated:0 "[dragon_in_battle.GetNamePossessiveNoTooltip] boynunu yarıp [dragon_in_battle.Custom('GetDragonHerHis')] kafasını tümden koparıyor! [dragon_in_battle.Custom('GetDragonHerHis')] başsız boynu geri sıçrarken kafa havada dönüyor."

 agot_dragon_warfare.0008.slit:0 "[dragon_in_battle.GetNamePossessiveNoTooltip] boynunu yarıp [dragon_in_battle.Custom('GetDragonHerHis')] gırtlağını açıyor!"

 agot_dragon_warfare.0008.fall:0 "\n\nEjderha kanı güçlü bir yay çizerek fışkırıyor ve [dragon_in_battle.Custom('GetDragonHerHis')]'in altımdan düştüğünü hissediyorum. Bir çığlık atıp yere yuvarlanıyorum, sertçe çarpıyorum."

 agot_dragon_warfare.0008.a:0 "Herkes önümüzde titreyecek!"

 agot_dragon_warfare.0008.b:0 "Ejderhamı öldürdün! Seni öldüreceğim!"

 agot_dragon_warfare.0008.b.f:0 "[enemy_knight.GetTitledFirstName] ile yerde düello yapacaksınız!"

 agot_dragon_warfare.0008.c:0 "Hayır! Böyle bir savaşçının karşısına çıkamam!"

 agot_dragon_warfare.0008.c.f:0 "[enemy_knight.GetFirstNameNicknamed]'den kaçıyorsunuz!"

 agot_dragon_warfare.0012.t:0 "Ateşli Bir Düzenleme"

 agot_dragon_warfare.0012.opening1:0 "Düşmanın mevzisinin yükseklerinde uçuyorum — yaklaşan savaş için adamlar ve atlar konumlanıyor. Koca ejderham [dragon_in_battle.GetName]'in sırtından bana sıradan karıncalar gibi görünüyorlar. Yine de bazı karıncalar diğerlerinden daha önemlidir ve bir araya toplanmış dalgalanan sancaklar, buradan bile dikkatimi çekiyor."

 agot_dragon_warfare.0012.opening2:0 "Bulutların yakınında, [dragon_in_battle.GetName]'in sırtından [battle_location.GetName] Savaşı'nın tümünü görebiliyorum — alaylarımızın minicik düzenleri düşmanın hatlarına çarpıyor. Buradan, komutanların oynadığı oyuncaklara benziyorlar. Gözlerim, o komutanların mevzisini işaretleyen hışırdayan bir sancak kümesine kayıyor..."

 agot_dragon_warfare.0012.opening3:0 "[battle_location.GetName] Savaşı'nın yükseklerinde dönüyorum; baldırlarımın [dragon_in_battle.Custom('GetDragonHerHis')] [dragon_in_battle.Custom('GetDragonColorFull')] yanlarına hafif dokunuşlarıyla [dragon_in_battle.GetName]'i ileri sürüyorum. Buradan düşmanın mevzisini net görüyorum — ön hatlardan uzakta gizlenmiş bir sürü dalgalanan sancak seçtiğim için nadir bir avantaj."

 agot_dragon_warfare.0012.mid:0 "\n\nHızla alçalırken [enemy_knight.GetTitledFirstName] ve kayda değer düşman savaşçılarının çoğunun tek bir bölgede toplandığını görüyorum!"

 agot_dragon_warfare.0012.cruel:0 "Bu düşmanlar kurtçuktur ve kıvrandıracağım onları. #italic Pis kurtçuklar#!, diye düşünüyorum, gelecek alevleri şimdiden tadarak. #italic Yanmaya hazırlanın...#!"

 agot_dragon_warfare.0012.vengeful:0 "Tek bir vuruşla bu savaşı bizzat sona erdirebilirim. Bir ejderhaya karşı kim durabilir ki? #italic Bana#! karşı kim durabilir ki?!"

 agot_dragon_warfare.0012.fallback:0 "Benimki gibi bir ejderhayla yüzleşirken yapılan ölümcül bir hata! [dragon_in_battle.Custom('GetDragonSheHe')] düşman komutanlığını ejderha ateşiyle kül etmeye hazırlanırken [dragon_in_battle.GetNamePossessiveNoTooltip] göğsünün kabardığını hissediyorum."

 agot_dragon_warfare.0012.a.valyrian:0 "#EMP Dracarys!#!"

 agot_dragon_warfare.0012.a:0 "Yak [enemy_knight.GetHerHim]'i, [dragon_in_battle.GetNameNoTooltip]!"

 agot_dragon_warfare.0013.t:0 "Yukarıdan Gelen Ölüm!"

 agot_dragon_warfare.0013.opening1:0 "[battle_location.GetName] alanındaki çadırımdan çıkıp karşıdaki düşmanla yüzleşmeye hazır şövalye ve komutan arkadaşlarımın çemberine doğru yürüyorum. Onları selamlamak üzereyken gökyüzünden büyük bir kükreme kesiliveriyor!"

 agot_dragon_warfare.0013.opening2:0 "Ordumun diğer komutanlarıyla birlikte [battle_location.GetName] alanını inceliyor; hatlarımızın mevzisini ve bu zırhlı askerlerin bir ejderhanın gücüne karşı nasıl dayanabileceğini değerlendiriyorum. Ansızın gökyüzünü tiz bir çığlık yırtıyor!"

 agot_dragon_warfare.0013.opening3:0 "[battle_location.GetName] Savaşı sürerken hava nemli ve ağır. Bizim emirlerimizle, gözümüzün önünde ölen adamlar... Komuta edenlerin yükü budur işte. Yukarılarda hızla hareket eden bir nokta görüyorum — mevzimize doğru dalışa geçtikçe kudretli bir kükreme duyuyorum!"

 agot_dragon_warfare.0013.mid:0 "[dragon_in_battle.GetNameNicknamed], üzerinde [dragonrider_in_battle.GetName] ile!\n\n[dragon_in_battle.Custom('GetDragonColorFull')] canavar inanılmaz bir hızla inerken şaşkına dönüyoruz. Boğazını açtığında ne olacağını anlıyorum; ama çok geç. Gürleyen nefes çekişini bir ateş kükremesi izliyor ve "

 agot_dragon_warfare.0013.death1:0 "koşmaya başlasam da alevlerden kaçamıyorum. Yalnızca bir saniyeliğine çığlık atabiliyorum; ardından hava ciğerlerimden sökülüyor ve etimin kemiklerimden soyulduğunu hissediyorum."

 agot_dragon_warfare.0013.death2:0 "büyük bir kayanın ardına atılsam da çevremde hayal edilemez bir sıcaklık hissediyorum. Pürüzsüz kaya yüzeyine dayalı elim, açık ateşteki bir domuz parçası gibi cızırdamaya başlıyor. Canlı canlı pişiyorum..."

 agot_dragon_warfare.0013.death3:0 "daha yavaş olan bazı yoldaşlarımın üzerinden atlasam da ben çok yavaşım. Bir anda bedenimin ejderha ateşiyle yutulduğunu hissediyorum; kollarımın ve bacaklarımın sinirleri bile küle dönüşüyor."

 agot_dragon_warfare.0013.burned1:0 "tek düşünebildiğim alevlerden nasıl kaçacağım. Koşmaya başladığımda ejderha ateşinin yere çarpışını hissediyorum; ana patlamadan kurtulmuş olsam da arkadan gelen sıcaklık kükremesi kıyafetlerimi yakıyor ve beni zırhımın içinde pişiriyor."

 agot_dragon_warfare.0013.burned2:0 "tek düşüncem kaçış. Büyük bir kayanın ardına atılıp ana ejderha ateşi patlamasının büzüldüğüm yerden uzaklaşışını izliyorum. Ne var ki rahatlama nefesim yarım kalıyor: Kıyafetlerimin alev aldığını fark ediyorum — karşılaştığım hiçbir ateşten daha sıcak."

 agot_dragon_warfare.0013.burned3:0 "Elimden geldiğince hızla fırlıyorum. Yanıma, bir zamanlar benim gibi komutan olan alevler içinde bir bedenin düştüğünü görüyor ve kaçmak için alevli kütleyi aşmak zorunda kalıyorum. [dragon_in_battle.GetNamePossessiveNoTooltip] ateşinin en kötüsü başka yere yönelmiş; ama akkor kızgınlığındaki zırhımın altında tenimin kabarıp çatladığını hissedebiliyorum."

 agot_dragon_warfare.0013.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_dragon_warfare.0014.t:0 "Korkunç Kanatlarda Kıyamet"

 agot_dragon_warfare.0014.desc:0 "Bu, krallık tarihinin en yıkıcı askeri hatalarından biri olarak hatırlanacak.\n\nSavaştan önce strateji ve mevzi görüşmek üzere buluşmak gibi sıradan bir planın bu kadar ters gitmesi daha dün akla ziyan gelirdi. [enemy_knight.GetTitledFirstName] ve diğer komutanlarım ile en seçkin savaşçılarım savaştan önce bir araya geldi. Ama strateji konuşmak yerine dehşetle yüzleştiler: [dragonrider_in_battle.GetTitledFirstName] ejderhasıyla inip ordumun liderlerini ejderha ateşiyle yıkadı!\n\nÖlmeyenler de [dragon_in_battle.Custom('GetDragonColorFull')] bela [dragon_in_battle.GetNameNicknamed] sayesinde dehşet verici şekilde yandı. Ben ve birkaç kişi, henüz varmadığımız için bu kaderden kurtulduk... Ordumuzun komuta kadrosu yok oldu ve bu savaşı artık kesinlikle kaybedeceğiz."

 agot_dragon_warfare.0014.a:0 "Kahretsin o kanatlı şeytanlar!"

 agot_dragon_warfare.0015.t:0 "İletilen Kıyamet"

 agot_dragon_warfare.0015.desc:0 "Bu, krallık tarihinin en kesin askeri zaferlerinden biri olarak hatırlanacak!\n\n[dragonrider_in_battle.GetTitledFirstName]'in ejderha sırtındaki kahramanlık dolu hamleleri sayesinde düşman komuta kadrosu yok edildi. Düşman komutanları savaştan önce strateji ve mevzi görüşmek üzere buluştu; ama böyle bir topluluk, [dragon_in_battle.GetNameNicknamed] için mükemmel bir hedef oluşturdu.\n\n[enemy_knight.GetTitledFirstName] ve kayda değer pek çok komutan ile savaşçı, hepsi ejderha ateşiyle buluştu! Ölmeyenler de [dragonrider_in_battle.GetFirstNameNoTooltip] ve [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı sayesinde dehşet verici şekilde yandı.\n\nDüşman düzensiz ve sıradan askerleri net bir yönlendirme olmadan sarsılıyor; bu savaşı kesinlikle kazanacağız."

 agot_dragon_warfare.0015.a:0 "Bize büyük şan!"

 agot_dragon_warfare.0016.t:0 "Cesaretin Riskleri"

 agot_dragon_warfare.0017.t:0 "$agot_dragon_warfare.0016.t$"

 agot_dragon_warfare.0017.opening1:0 "[battle_location.GetName] bulutlarının yükseklerinde, [dragon_in_battle.GetName]'in sırtında uçuyorum; düşman hücuma geçtiğinde örs-çekiç saldırısı yapmaya hazırım. Tam o sırada aşağı baktığımda görüyorum ki "

 agot_dragon_warfare.0017.opening2:0 "[battle_location.GetName] Savaşı'nın yükseklerinde [dragon_in_battle.GetName]'in sırtında süzülüyorum; düşman hatlarına yapacağımız bir sonraki saldırıyı düşünürken fark ediyorum ki "

 agot_dragon_warfare.0017.opening3:0 "[dragon_in_battle.GetName] bizi [battle_location.GetName]'in kargaşasının giderek daha yükseğine çekiyor ve bulutların arasında kısa bir mola veriyoruz. Savaş alanını süzerken görüyorum ki "

 agot_dragon_warfare.0017.mid:0 "[enemy_commander_in_battle.GetTitledFirstName] kuvvetlerini çoktan ileri sürdü! En şaşırtıcı olanı, [enemy_commander_in_battle.GetSheHe] kama düzenindeki hücumunu [enemy_commander_in_battle.GetHerselfHimself] yönetiyor!\n\n"

 agot_dragon_warfare.0017.rude:0 "Ne biçim bir ahmak! [enemy_commander_in_battle.GetFirstNameNoTooltip], açık alanda serbestçe hücum etmesine izin vereceğimi sanıyorsa, kafasının içi gerçekten de bokla dolu olmalı."

 agot_dragon_warfare.0017.cruel:0 "Bu cüret karşısında içimden köpürüyorum... Varlığımın her zerresi [enemy_commander_in_battle.GetHerHim]'in bedel ödemesini, hem de ağır bedel ödemesini istiyor. [dragon_in_battle.GetNameNoTooltip] bunu kuşkusuz başarabilir..."

 agot_dragon_warfare.0017.vengeful:0 "Böyle bir hamle, [dragon_in_battle.GetNamePossessiveNoTooltip] gücüne... #bold benim#! gücüme açık bir saygısızlık. Böyle bir hakareti kabul edemem."

 agot_dragon_warfare.0017.fallback:0 "Kuşkusuz cesurca; ama [enemy_commander_in_battle.GetHerHis] birliklerinden bu kadar uzaklaşmanın akıllıca olmadığını düşünmeden edemiyorum."

 agot_dragon_warfare.0017.a:0 "Kuyruk menzilindeki biri için cesur bir hamle..."

 agot_dragon_warfare.0017.a.f:0 "[dragon_in_battle.GetNameNoTooltip] ile aşağı süzülüp [enemy_commander_in_battle.GetFirstNameNoTooltip]'i [enemy_commander_in_battle.GetHerHis] atının üzerinden süpürüp alıyorsunuz."

 agot_dragon_warfare.0017.b.vengeful:0 "Yine de [enemy_commander_in_battle.GetSheHe] ne fark eder ki."

 agot_dragon_warfare.0017.b:0 "Bu, böyle bir cesarete saygısızlık olur."

 agot_dragon_warfare.0017.b.f:0 "Mevcut plana bağlı kalıyorsunuz."

 agot_dragon_warfare.0018.t:0 "$agot_dragon_warfare.0016.t$"

 agot_dragon_warfare.0018.opening1:0 "[battle_location.GetName] savaş alanını süzüyorum; atıma binmeden önce miğferimi takıyorum, at gözlükleri hücumumuza hazırlanan düşman hatlarını gösteriyor. Silahımı yanımdaki görevliden alıp birliklerimin önüne geçiyorum. Düşmanın bir ejderha binicisi olsa da, bugün bu alanı hâlâ kazanabileceğimizden eminim. Kesin bir hücum onları dağıtacak; ejderha binicisi olsun olmasın."

 agot_dragon_warfare.0018.opening2:0 "[battle_location.GetName]'in kargaşasına bakarken savaşın parmaklarımın arasından kayıp gittiğini hissetmekten kendimi alamıyorum. Belki, başka bir şey olmasa da, cesaretim kaderi değiştirebilir. Görevlimi çağırıp silahımı çekiyor ve atıma biniyorum. Düşmanın bir ejderha binicisi olabilir; ama bu savaş yerde kazanılacak."

 agot_dragon_warfare.0018.opening3:0 "Birliklerimin hatları boyunca at sürüyorum; bu askerleri kahramanlık hâline getirecek ilham verici bir konuşma düşünmeye çalışıyorum. #italic Savaş, ölebilirsin. Kaç, yaşarsın... en azından bir süre.#! Hayır, bu olmadı. Sözcükler tükenince en iyi seçeneğe karar veriyorum: Düşmanın saflarını yaracak kudretli bir hücuma önderlik edeceğim."

 agot_dragon_warfare.0018.ending:0 "\n\n[ROOT.Char.Custom('signature_weapon')]'imi kaldırıp hücum emrini veriyor ve birliklere bizzat öncülük ediyorum. Moralimiz yüksek, arayı hızla kapatıyoruz. Adamlarımın kükreyişinin beni ileri ittiğini, atımın toynaklarının altında yerin gümbürdediğini hissediyorum, ta-"

 agot_dragon_warfare.0018.a:0 "#bold FII-UYY!#!"

 agot_dragon_warfare.0018.a.f:0 "[dragon_in_battle.GetNameNoTooltip] sizi atınızdan süpürüp attı. Kırık bedeniniz, hücum eden kendi askerlerinizin altında eziliyor."

 agot_dragon_warfare.0019.t:0 "$agot_dragon_warfare.0016.t$"

 agot_dragon_warfare.0019.desc:0 "Kaçınılmaz [battle_location.GetName] savaşı için hatlarımın hazırlıklarını denetliyorum. Mevzileri yönlendirirken düşman hatlarının karşısında [enemy_commander_in_battle.GetName]'in miğferini taktığını görüyorum. [enemy_commander_in_battle.GetSheHe] elbette öncü kıtasının tam önünden hücum edecek değildir?\n\n[enemy_commander_in_battle.GetSheHe|U] ediyor! Freni boşalmış bir araba gibi ne olacağını gerçekleşmeden görüyorum. [dragonrider_in_battle.GetTitledFirstName], [dragon_in_battle.GetName] ile bir şimşek gibi iniyor ve tüm savaş alanında duyulan bir #bold FII-UYY#! sesiyle [enemy_commander_in_battle.GetHerHis] bedeninin atından koparılıp yere çakılmadan önce onlarca metre uçtuğunu izliyorum. Bu da yetmemiş gibi, ardından [enemy_commander_in_battle.GetSheHe] kendi birliklerinin hücumu altında eziliyor."

 agot_dragon_warfare.0019.a:0 "Cesur aptal."

 agot_dragon_warfare.0020.t:0 "Gökten İnen Şimşek"

 agot_dragon_warfare.0021.t:0 "$agot_dragon_warfare.0020.t$"

 agot_dragon_warfare.0021.desc:0 "[battle_location.GetName] savaşı sırasında kuvvetlerimizi yönlendiriyorum; [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetName]'in düşman hatlarına doğru uçtuğunu görüyorum. Harika bir işaret! Aynı anda hücum emri verecekken düşman hatlarının yönünden uçan bir metal parçasından ışık parıltısı görüyorum. Bir mancınık cıvatası! Doğrudan [dragonrider_in_battle.GetTitledFirstNameNoTooltip]'e gidiyor!\n\nCıvata [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] ejderhasına isabet ederken, yaradan kan ve ateş yayları fışkırırken izlemekten başka çarem yok. Ejderha [dragon_in_battle.GetNameNoTooltip] acı ve öfke dolu bir kükreme salıyor; ardından ikisi de büyük bir toz bulutu içinde yere çakılıyor."

 agot_dragon_warfare.0021.a:0 "Bu iyiye işaret değil."

 agot_dragon_warfare.0021.a.f:0 "Bir ejderha binicisinin ölümü tarafın için büyük bir kayıp."

 agot_dragon_warfare.0022.t:0 "$agot_dragon_warfare.0020.t$"

 agot_dragon_warfare.0022.desc:0 "Kuvvetlerimizi büyük bir özenle yönlendiriyorum; bu planın işlemesi için doğru zamanda doğru yerde olmamız gerektiğini biliyorum. Hücum emri verecekken [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetNameNicknamed]'in üstümüze doğru uçtuğunu görüyorum. Plan yapacak zaman yok, harekete geçme zamanı!\n\nElimi sallayarak emri veriyorum ve mancınığımızdan çıkan cıvata dosdoğru, isabetle uçuyor. Usta bir okçunun oku gibi [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] [dragon_in_battle.Custom('GetDragonColorFull')] ejderhasına saplanıyor; yaradan kan ve ateş yayları fışkırıyor. Ejderha [dragon_in_battle.GetNameNoTooltip] acı ve öfke dolu bir kükreme salıyor; ardından ikisi de büyük bir toz bulutu içinde yere çakılıyor."

 agot_dragon_warfare.0022.a:0 "Harika bir atış!"

 agot_dragon_warfare.0022.a.f:0 "Düşman ejderha binicisinin ölümü tarafın için büyük bir kazanç."

 agot_dragon_warfare.0023.t:0 "$agot_dragon_warfare.0020.t$"

 agot_dragon_warfare.0023.desc:0 "Altımdaki [dragon_in_battle.GetName]'in gücünü hissederken rüzgâr yüzümün önünden akıp geçiyor. Düşman hatlarına doğru uçuyoruz ve düşman komutanının kuvvetlerini yönlendirdiğini görebiliyorum. Onları ateşe boğmak üzereyken düşman hatlarından bir ışık parıltısı görüyorum. Bir mancınık cıvatası! Doğrudan üstümüze geliyor!\n\nCıvata [dragon_in_battle.GetNameNoTooltip]'e isabet ederken, yaradan kan ve ateş yayları fışkırırken izlemekten başka çarem yok. [dragon_in_battle.GetFirstNameNoTooltip] acı ve öfke dolu bir kükreme salıyor; son anlarımız için ikimiz de dehşet içinde haykırırken büyük bir alev püskürtüyor..."

 agot_dragon_warfare.0023.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_dragon_warfare.0023.a.f:0 "Cesedin daha sonra [dragon_in_battle.GetNameNoTooltip]'in enkazında bulunuyor."

 agot_dragon_warfare.0024.t:0 "$agot_dragon_warfare.0020.t$"

 agot_dragon_warfare.0024.desc:0 "Maiyetimle çevrili, savaşa hazır duruyorum. Adamlarımın hattında, [dragonrider_in_battle.GetTitledFirstName]'in [dragon_in_battle.GetName]'in sırtında düşmana doğru uçuşunu izlerken adrenalinin yükselmeye başladığını hissediyorum. Yanımızda böyle bir güç varken kesinlikle kazanmalıyız!\n\nNe var ki gözlerimin önünde [dragon_in_battle.GetFirstNamePossessiveNoTooltip] boynundan ani bir kan ve alev fışkırması yükseliyor; kükreme, savaşın kopacağı alanda yankılanıyor! Gözlerimi kısıp kaynağını seçiyorum — bir mancınık cıvatası! Ejderha da binicisi de büyük bir toz bulutu içinde yere çakılırken haykırıyor ve bir daha kalkmıyorlar."

 agot_dragon_warfare.0024.a:0 "Tarafımız için büyük bir kayıp."

 agot_dragon_warfare.0024.a.f:0 "Böyle büyük bir varlığın düşüşünü izlemek, yaklaşan savaş için sana derin bir huzursuzluk veriyor."

 agot_dragon_warfare.0025.t:0 "$agot_dragon_warfare.0020.t$"

 agot_dragon_warfare.0025.desc:0 "Savaşın bir sonraki safhasını dehşetle bekliyorum; yerde ne yaparsak yapalım, asıl savaşın [dragonrider_in_battle.GetTitledFirstName] ve [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı [dragon_in_battle.GetNameNicknamed] tarafından belirleneceğini biliyorum. Bizi, ve beni, ejderha ateşiyle yıkamaya hazır bir şekilde üstümüze uçmalarını izlerken alnımdan ter damlaları süzülüyor.\n\nAnsızın bir #emp *fiı-uyp*#! sesi duyuyorum; gökyüzünde gümüşten büyük bir çizgi kavis çiziyor ve [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] ejderhasına saplanıyor; yaradan kan ve ateş yayları fışkırıyor. Ejderha [dragon_in_battle.GetNameNoTooltip] acı ve öfke dolu bir kükreme salıyor; ardından ikisi de hatlarımızın önüne çakılıyor!"

 agot_dragon_warfare.0025.a:0 "Ha! Al sana büyük kertenkele!"

 agot_dragon_warfare.0025.a.f:0 "Bir zafer çığlığı atıyorsun; düşman ejderha binicisinin ölümü tarafın için büyük bir kazanç."

 agot_dragon_warfare.0040.t:0 "Büyük Tufan"

 agot_dragon_warfare.0041.t:0 "$agot_dragon_warfare.0040.t$"

 agot_dragon_warfare.0041.desc:0 "[battle_location.GetName] savaşı sırasında kuvvetlerimizi yönlendiriyorum; [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetNameNicknamed]'in düşman hatlarına doğru uçtuğunu görüyorum. Harika bir işaret! Aynı anda hücum emri verecekken savaş alanının üzerinde yükselen sarmal bir su sütunu beliriyor.\n\n[dragon_in_battle.GetNameNoTooltip] meydan okurcasına kükriyor; [dragon_in_battle.Custom('GetDragonSheHe')] kaçmaya çalışırken [dragon_in_battle.Custom('GetDragonHerHis')] kanatları öfkeyle çırpıyor ve [dragonrider_in_battle.GetTitledFirstNameNoTooltip] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı kontrol etmeye çabalıyor; ama su sütunu ejderhayı ve biniciyi hızla sarıp kuşatıyor. [dragon_in_battle.GetNameNoTooltip] çabalıyor, [dragon_in_battle.Custom('GetDragonHerHis')] bedeni uçurumun boğucu kavrayışı içinde kıvranıyor; ama amansız akıntı [dragon_in_battle.Custom('GetDragonHerHim')]'i aşağı çekiyor. Ejderhanın kudretli gövdesi yavaşça batıyor, sular tarafından bütünüyle yutuluyor; [dragon_in_battle.Custom('GetDragonHerHis')] öfkeli kükremeleri derinliklerin altında susuyor.\n\nSular nihayet çekildiğinde [dragon_in_battle.GetNameNoTooltip]'in cansız yattığı ve [dragon_in_battle.Custom('GetDragonHerHim')]'in yanında [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] kırık bedeninin olduğu ortaya çıkıyor."

 agot_dragon_warfare.0041.a:0 "Talihsizlik!"

 agot_dragon_warfare.0041.a.f:0 "Bir ejderha binicisinin ölümü tarafın için büyük bir kayıp."

 agot_dragon_warfare.0042.t:0 "$agot_dragon_warfare.0040.t$"

 agot_dragon_warfare.0042.desc:0 "Kuvvetlerimizi büyük bir özenle yönlendiriyorum; bu planın işlemesi için doğru zamanda doğru yerde olmamız gerektiğini biliyorum. Hücum emri verecekken [dragonrider_in_battle.GetTitledFirstName] ve [dragon_in_battle.GetNameNicknamed]'in üstümüze doğru uçtuğunu görüyorum. Harekete geçme zamanı!\n\nElimi sallayarak emri veriyorum ve su büyücüleri işe koyuluyor; savaş alanının üzerinde yükselen sarmal bir su sütunu beliriyor.\n\n[dragon_in_battle.GetNameNoTooltip] meydan okurcasına kükriyor; [dragon_in_battle.Custom('GetDragonSheHe')] kaçmaya çalışırken [dragon_in_battle.Custom('GetDragonHerHis')] kanatları öfkeyle çırpıyor ve [dragonrider_in_battle.GetTitledFirstNameNoTooltip] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı kontrol etmeye çabalıyor; ama su sütunu ejderhayı ve biniciyi hızla sarıp kuşatıyor. [dragon_in_battle.GetNameNoTooltip] çabalıyor, [dragon_in_battle.Custom('GetDragonHerHis')] bedeni uçurumun boğucu kavrayışı içinde kıvranıyor; ama amansız akıntı [dragon_in_battle.Custom('GetDragonHerHim')]'i aşağı çekiyor. Ejderhanın kudretli gövdesi yavaşça batıyor, sular tarafından bütünüyle yutuluyor; [dragon_in_battle.Custom('GetDragonHerHis')] öfkeli kükremeleri derinliklerin altında susuyor.\n\nSular nihayet çekildiğinde [dragon_in_battle.GetNameNoTooltip]'in cansız yattığı ve [dragon_in_battle.Custom('GetDragonHerHim')]'in yanında [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] kırık bedeninin olduğu ortaya çıkıyor."

 agot_dragon_warfare.0042.a:0 "Harika bir atış!"

 agot_dragon_warfare.0042.a.f:0 "Düşman ejderha binicisinin ölümü tarafın için büyük bir kazanç."

 agot_dragon_warfare.0043.t:0 "$agot_dragon_warfare.0040.t$"

 agot_dragon_warfare.0043.desc:0 "Altımdaki [dragon_in_battle.GetNameNicknamed]'in gücünü hissederken rüzgâr yüzümün önünden akıp geçiyor. Düşman hatlarına doğru uçuyoruz ve düşman komutanının kuvvetlerini yönlendirdiğini görebiliyorum. Onları ateşe boğmak üzereyken gökyüzünde aniden sarmal bir su sütununun belirdiğini görüyorum.\n\n[dragon_in_battle.GetNameNoTooltip] ürküp kaçmaya çalışıyor; ama kısa sürede tamamen suyla çevriliyoruz. Nefesimi tutmaya çalışıyorum; ama suyun amansız gücü azalmıyor ve başım dönmeye başlıyor..."

 agot_dragon_warfare.0043.a:0 "Çok huzurlu..."

 agot_dragon_warfare.0043.a.f:0 "Cesedin daha sonra [dragon_in_battle.GetNameNoTooltip]'in enkazında bulunuyor."

 agot_dragon_warfare.0044.t:0 "$agot_dragon_warfare.0040.t$"

 agot_dragon_warfare.0044.desc:0 "Maiyetimle çevrili, savaşa hazır duruyorum. Adamlarımın hattında, [dragonrider_in_battle.GetTitledFirstName]'in [dragon_in_battle.GetName]'in sırtında düşmana doğru uçuşunu izlerken adrenalinin yükselmeye başladığını hissediyorum. Yanımızda böyle bir güç varken kesinlikle kazanmalıyız!\n\nNe var ki gözlerimin önünde savaş alanının üzerinde yükselen sarmal bir su sütunu beliriyor.\n\n[dragon_in_battle.GetNameNoTooltip] meydan okurcasına kükriyor; [dragon_in_battle.Custom('GetDragonSheHe')] kaçmaya çalışırken [dragon_in_battle.Custom('GetDragonHerHis')] kanatları öfkeyle çırpıyor ve [dragonrider_in_battle.GetTitledFirstNameNoTooltip] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı kontrol etmeye çabalıyor; ama su sütunu ejderhayı ve biniciyi hızla sarıp kuşatıyor. [dragon_in_battle.GetNameNoTooltip] çabalıyor, [dragon_in_battle.Custom('GetDragonHerHis')] bedeni uçurumun boğucu kavrayışı içinde kıvranıyor; ama amansız akıntı [dragon_in_battle.Custom('GetDragonHerHim')]'i aşağı çekiyor. Ejderhanın kudretli gövdesi yavaşça batıyor, sular tarafından bütünüyle yutuluyor; [dragon_in_battle.Custom('GetDragonHerHis')] öfkeli kükremeleri derinliklerin altında susuyor.\n\nSular nihayet çekildiğinde [dragon_in_battle.GetNameNoTooltip]'in cansız yattığı ve [dragon_in_battle.Custom('GetDragonHerHim')]'in yanında [dragonrider_in_battle.GetTitledFirstNamePossessiveNoTooltip] kırık bedeninin olduğu ortaya çıkıyor."

 agot_dragon_warfare.0044.a:0 "Tarafımız için büyük bir kayıp."

 agot_dragon_warfare.0044.a.f:0 "Böyle büyük bir varlığın düşüşünü izlemek, yaklaşan savaş için sana derin bir huzursuzluk veriyor."

 agot_dragon_warfare.0045.t:0 "$agot_dragon_warfare.0040.t$"

 agot_dragon_warfare.0045.desc:0 "Savaşın bir sonraki safhasını dehşetle bekliyorum; yerde ne yaparsak yapalım, asıl savaşın [dragonrider_in_battle.GetTitledFirstName] ve [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı [dragon_in_battle.GetNameNicknamed] tarafından belirleneceğini biliyorum. Bizi, ve beni, ejderha ateşiyle yıkamaya hazır bir şekilde üstümüze uçmalarını izlerken alnımdan ter damlaları süzülüyor.\n\nAnsızın savaş alanının üzerinde yükselen sarmal bir su sütununun belirdiğini görüyorum.\n\n[dragon_in_battle.GetName] meydan okurcasına kükriyor; [dragon_in_battle.Custom('GetDragonSheHe')] kaçmaya çalışırken [dragon_in_battle.Custom('GetDragonHerHis')] kanatları öfkeyle çırpıyor ve [dragonrider_in_battle.GetTitledFirstName] [dragon_in_battle.Custom('GetDragonColorFull')] canavarı kontrol etmeye çabalıyor; ama su sütunu ejderhayı ve biniciyi hızla sarıp kuşatıyor. [dragon_in_battle.GetName] çabalıyor, [dragon_in_battle.Custom('GetDragonHerHis')] bedeni uçurumun boğucu kavrayışı içinde kıvranıyor; ama amansız akıntı [dragon_in_battle.Custom('GetDragonHerHim')]'i aşağı çekiyor. Ejderhanın kudretli gövdesi yavaşça batıyor, sular tarafından bütünüyle yutuluyor; [dragon_in_battle.Custom('GetDragonHerHis')] öfkeli kükremeleri derinliklerin altında susuyor.\n\nSular nihayet çekildiğinde [dragon_in_battle.GetName]'in cansız yattığı ve [dragon_in_battle.Custom('GetDragonHerHim')]'in yanında [dragonrider_in_battle.GetTitledFirstNamePossessive] kırık bedeninin olduğu ortaya çıkıyor."

 agot_dragon_warfare.0045.a:0 "Ha! Al sana büyük kertenkele!"

 agot_dragon_warfare.0045.a.f:0 "Bir zafer çığlığı atıyorsun; düşman ejderha binicisinin ölümü tarafın için büyük bir kazanç."

 agot_dragon_warfare.0026.battle_title:0 "Ejderha Müdahalesi:"

 agot_dragon_warfare.0026.t:0 "$agot_dragon_warfare.0026.battle_title$ Kanatlı Kurtarıcı"

 agot_dragon_warfare.0026.opening:0 "Tek bir sözcük. Tek bir sözcük savaş alanında bir gelgit dalgası gibi yankılanıyor. Bir avuç dayanıklı askerin yüreğine korku salan tek bir sözcük. "EJDERHA!" Savaş durma noktasına geliyor; tüm gözler gökyüzünde, hava korkuyla ağır.\n\nŞoktan sıyrılıp bu görüntüyü sorgulamaya başlıyorum... Ama [dragon_in_battle.GetNameNicknamed]'in canavarca kükremesi savaşın donmuş sükûnetini parçaladığında sorum boğazımda takılı kalıyor. Kıyamet kopuyor ve bir an için geri çekilmeyi düşünüyorum."

 agot_dragon_warfare.0026.outro:0 "Ne var ki kaderin bir cilvesiyle [dragon_in_battle.Custom('GetDragonColorFull')] canavar, bizim kuvvetlerimiz yerine düşmanın kuvvetlerini yakmayı tercih ediyor gibi görünüyor."

 agot_dragon_warfare.0026.a:0 "Bu bizim şansımız, ileri!"

 agot_dragon_warfare.0027.t:0 "$agot_dragon_warfare.0026.battle_title$ Cehennem Ateşi"

 agot_dragon_warfare.0027.opening1:0 "Kılıç ve kalkan çarpışmalarının ortasında beklenmedik bir ses yükseliyor: Gökyüzünden gelen titrek bir #bold kükreme#! Vahşi ejderha [dragon_in_battle.GetNameNicknamed], kan kokusuna kapılmış görünüyor — ve [dragon_in_battle.Custom('GetDragonSheHe')] hızla savaşa yaklaşıyor."

 agot_dragon_warfare.0027.opening2:0 "İki ordu birbirine çarpışırken hava kan ve boşalan bağırsak kokusuyla doluyor. #italic Kimse bu kokudan bahsetmez#!, diye düşünüyorum; derken birden daha kükürtlü bir pis koku fark ediyorum... Gözlerim gökyüzüne çekiliyor; orada [dragon_in_battle.Custom('GetDragonHerHim')]'i görüyorum: Vahşi ejderha [dragon_in_battle.GetNameNicknamed] savaşın içine uçuyor, havaya ateş püskürtüleri savuruyor."

 agot_dragon_warfare.0027.opening3:0 "[ROOT.Char.Custom('signature_weapon')]'imi can vermiş bir düşmanın yüzünden sıyırıp çekiyorum; bedeni bir kan gölüne sarkıyor. #italic Hiçbir adam bana karşı duramaz#!, diye düşünüyorum, çevremdeki kargaşayı gözden geçirirken. Bir anda özgüvenim dağılıyor: Öfke dolu bir kükreme havayı yarıyor; vahşi ejderha [dragon_in_battle.GetNameNicknamed] savaşın içine dalıyor."

 agot_dragon_warfare.0027.mid:0 "\n\n[dragon_in_battle.Custom('GetDragonColorFull')] canavar [dragon_in_battle.GetNameNoTooltip], #bold benim#! birliklerime bir ejderha ateşi tufanı salıyor; önümdekileri bir anda tutuşturuyor. Vahşi canavar bana dönüyor ve "

 agot_dragon_warfare.0027.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_dragon_warfare.0028.t:0 "$agot_dragon_warfare.0026.battle_title$ Kanatlı Şeytan"

 agot_dragon_warfare.0028.opening1:0 "Kuvvetlerimizin komutanı olarak yüksek mevzim, birliklerimizin görebildiğinden hemen önce dehşeti görmemi sağlıyor. Beklenmedik bir gelişmeyle [dragon_in_battle.Custom('GetDragonColorFull')] vahşi ejderha [dragon_in_battle.GetNameNicknamed] savaş alanına ulaştı; muhtemelen kan kokusuna kapılarak..."

 agot_dragon_warfare.0028.opening2:0 "Bir orduya komuta etmek kolay iş değildir... Bu savaş, delici bir kükreme havayı yarıncaya dek pek çoğundan daha az sınav gibi görünüyordu. [dragon_in_battle.Custom('GetDragonColorFull')] vahşi ejderha [dragon_in_battle.GetNameNicknamed] [dragon_in_battle.Custom('GetDragonHerHis')] saldırısını savaş alanına yöneltirken bunun nasıl geliştiğini tedirginlikle izliyorum."

 agot_dragon_warfare.0028.opening3:0 "Savaş her zamanki gibi başlıyor: çeliğin çeliğe uyumsuz şakırtısı, staccato bir ölüm şarkısı çalıyor. Uzaktaki mevzimden, tını değişikliği algılanmadan önce manzara bana net görünüyor... Vahşi ejderha [dragon_in_battle.GetNameNicknamed] beklenmedik biçimde geldi ve havaya ejderha ateşi püskürtüleri savuruyor."

 agot_dragon_warfare.0028.outro:0 "\n\n[dragon_in_battle.Custom('GetDragonSheHe')|U] şaşırtıcı biçimde karşıt kuvvetlerin safına geçti; sanki yalnızca #bold benim#! birliklerime zarar veriyor. Bu mesafeden, askerlerimin gözlerimin önünde küle dönüşünü izlemekten başka yapabileceğim hiçbir şey yok."

 agot_dragon_warfare.0028.a:0 "Kahrolası ejderha!"

 agot_dragon_warfare.0029.t:0 "$agot_dragon_warfare.0026.battle_title$ Kavurucu Hüküm"

 agot_dragon_warfare.0029.outro:0 "[dragon_in_battle.Custom('GetDragonColorFull')] bela, her iki tarafı da ayırt etmeden öldürüyor."

 agot_dragon_warfare.0029.a:0 "#bold KAÇ!#!"

 agot_dragon_warfare.0029.a.tt:0 "#N [dragon_in_battle.GetName] bu savaşta tüm taraflara büyük zarar verdi!#!\n\n#weak Görmek içler acısı.#!"

 agot_dragon_warfare.0030.t:0 "$agot_dragon_warfare.0026.battle_title$ Cehennem Ateşi"

 agot_dragon_warfare.0030.mid:0 "\n\n[dragon_in_battle.Custom('GetDragonColorFull')] canavar [dragon_in_battle.GetNameNoTooltip] savaşa katıldı ve artık her cephede savaşıyor. [dragon_in_battle.Custom('GetDragonSheHe')|U] tam önüme iniyor ve "

 agot_dragon_warfare.0030.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_dragon_warfare.0030.a.tt:0 "#N [dragon_in_battle.GetName] bu savaşta tüm taraflara büyük zarar verdi!#!\n\n#weak Eh, bu da kötü oldu.#!"

 agot_dragon_warfare.0031.t:0 "$agot_dragon_warfare.0026.battle_title$ Kavurucu Hüküm"

 agot_dragon_warfare.0031.outro:0 "\n\n[dragon_in_battle.Custom('GetDragonSheHe')|U] öfkesinde ayrım gözetmiyor; ejderha ateşini hem benim birliklerime hem de düşmana püskürtüyor. Bu mesafeden, askerlerimin gözlerimin önünde küle dönüşünü izlemekten başka yapabileceğim hiçbir şey yok."

 agot_dragon_warfare.0031.a:0 "Bu cehennemî bir kabus!"

 agot_dragon_warfare.0031.a.tt:0 "#N [dragon_in_battle.GetName] bu savaşta tüm taraflara büyük zarar verdi!#!\n\n#weak Kahretsin, daha dikkatli olmalıydım.#!"

 agot_dragon_warfare.0034.t:0 "$agot_dragon_warfare.0026.battle_title$ İntikam"

 agot_dragon_warfare.0034.intro:0 "Savaş bitti, biz kaybettik. Savaş alanından kaçarken tüyler ürperten bir manzarayla karşılaşıyorum. Vahşi ejderha [dragon_in_battle.GetNameNicknamed], mağrur bir tavırla ölülerin etini tıkınıyor. İçim tiksinme ve öfkeyle doluyor... Bu cehennemî canavarın karışması yüzünden bu savaşta yitirilen tüm canlar için yeterince öfke."

 agot_dragon_warfare.0034.one_knight:0 "[knight_one.GetName] için yeterince öfke."

 agot_dragon_warfare.0034.two_knights:0 "[knight_one.GetName] ve [knight_two.GetName] için yeterince öfke."

 agot_dragon_warfare.0034.three_knights:0 "[knight_one.GetName], [knight_two.GetName] ve [knight_three.GetName] için yeterince öfke."

 agot_dragon_warfare.0034.craven:0 "Ama öfkeme rağmen kendimi dehşetle kaçarken buluyorum."

 agot_dragon_warfare.0034.a:0 "Bunun bedelini ödeyeceksin, seni canavar!"

 agot_dragon_warfare.0034.a.tt:0 "Vahşi ejderhayı öldürmeye çalışacaksınız. #warning Bu son derece tehlikelidir.#!"

 agot_dragon_warfare.0034.b:0 "Buradan çıkmak zorundayım."

 agot_dragon_warfare.0034.b.craven:0 "[dragon_in_battle.Custom('GetDragonSheHe')]'nin sizi görmediğini umuyorsunuz!"

