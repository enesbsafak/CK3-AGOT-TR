 killed_by_dragon_flame_knight_friendly:0 "Yeri sarsan ateşli bir kükremeyle [GetTrait('dragon').GetName( GetNullCharacter )] [CHARACTER.GetShortUINameNoTooltip] kavurucu bir alev tufanı püskürterek [TARGET_CHARACTER.GetShortUINameNoTooltip]'i bir anda küle çevirdi."

 killed_by_dragon_flame_knight_enemy:0 "Yeri sarsan ateşli bir kükremeyle düşman [GetTrait('dragon').GetName( GetNullCharacter )] [CHARACTER.GetShortUINameNoTooltip] kavurucu bir alev tufanı püskürterek şövalyemiz [TARGET_CHARACTER.GetShortUINameNoTooltip]'i bir anda küle çevirdi."

 killed_by_dragon_tail_knight_friendly:0 "Hızlı ve ölümcül bir manevrayla [GetTrait('dragon').GetName( GetNullCharacter )] [CHARACTER.GetShortUINameNoTooltip]'in kuyruğu savrulup hücumun ortasında [TARGET_CHARACTER.GetShortUINameNoTooltip]'i yakaladı ve [TARGET_CHARACTER.GetHerHim]'i bir çocuk oyuncağı gibi fırlatıp attı."

