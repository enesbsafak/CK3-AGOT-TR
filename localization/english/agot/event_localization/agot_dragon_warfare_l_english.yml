### TODO NOT-IN-ST: agot_dragon_warfare.0015.desc [AGOT: This will be remembered as one of the most decisive military victories in the realms history!\n\nThanks to the heroic actions of [dragonrider_in_battle.GetTitledFirstName] on dragonback, the enemy leadership has been devastated. The enemy commanders met before the battle to discuss strategy and positioning, but such a grouping provided the perfect target for [dragon_in_battle.GetNameNicknamed].\n\n[enemy_knight.GetTitledFirstName], as well as many other commanders and warriors of note, were all met with dragonflame! Those not dead are horrifically burned, thanks to [dragonrider_in_battle.GetFirstNameNoTooltip] and [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] beast.\n\nThe enemy is disorganized, and their rank and file now falter without clear guidance; we will most assuredly win this battle.]
 agot_dragon_warfare.0015.desc:0 "This will be remembered as one of the most decisive military victories in the realms history!\n\nThanks to the heroic actions of [dragonrider_in_battle.GetTitledFirstName] on dragonback, the enemy leadership has been devastated. The enemy commanders met before the battle to discuss strategy and positioning, but such a grouping provided the perfect target for [dragon_in_battle.GetNameNicknamed].\n\n[enemy_knight.GetTitledFirstName], as well as many other commanders and warriors of note, were all met with dragonflame! Those not dead are horrifically burned, thanks to [dragonrider_in_battle.GetFirstNameNoTooltip] and [dragonrider_in_battle.GetHerHis] [dragon_in_battle.Custom('GetDragonColorFull')] beast.\n\nThe enemy is disorganized, and their rank and file now falter without clear guidance; we will most assuredly win this battle."
