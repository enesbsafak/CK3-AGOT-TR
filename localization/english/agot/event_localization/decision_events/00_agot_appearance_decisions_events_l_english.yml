 agot_appearance_decisions_events.1000.desc:0 "Önüme onlarca egzotik ve gösterişli renk serildi; masanın üzerinde bir gökkuşağı oluştu. Seçeneklerime hevesle bakıyorum, hangisinin bana en çok yakışacağını hayal etmeye çalışıyorum. Bir anlık düşüncenin ardından bir hizmetkâr omzuma dokunuyor. "Gözünüze kestirdiğiniz bir renk var mı, [ROOT.Char.GetLadyLord|U]?""

