 agot_appearance_decisions_events.4000.t:0 "Maske Sipariş Etmek"

 agot_appearance_decisions_events.4000.desc:0 "Kendimi bir kez daha aynada şekli bozulmuş yüzüme bakarken buluyorum. Bandajları çıkarıp yüzümü dünyaya göstermeyi seçtiğimden beri bunu giderek daha sık yaparken yakalıyorum kendimi. Ne kadar çok bakarsam, bana bakan şeyden o kadar iğreniyorum. Yüzümün tanıdık hatları sonsuza dek değişti ve kendimi bu halde görmeye nasıl devam edebileceğimden emin değilim.\n\nBu azaptan kurtulmak için bir şeyler yapmam gerektiğini anlıyorum. Her yansımadan bana bakan o kırık dehşet dışında hiçbir şeye odaklanamıyorsam, hükmedemem..."

 agot_appearance_decisions_events.4000.a:0 "Şekil bozukluğunu örtecek bir maske bana uygun olacak."

 agot_appearance_decisions_events.4000.b:0 "Tüm yüzümü örtmeliyim!"

 agot_appearance_decisions_events.4000.c:0 "Hayır, ben [disfigured_root.GetNameNoTooltip]'im! Maskeye ihtiyacım yok!"

 agot_appearance_decisions_events.4001.t:0 "Yüzümü Dünyaya Göstermek"

 agot_appearance_decisions_events.4001.desc:0 "Maskemi sipariş ettiğimden beri her sabah yaptığım gibi, deri kayışı başımın etrafına yerleştiriyor ve soğuk, aman vermez metalin kırık yüzüme düştüğünü hissediyorum. Ağır bir iç çekişle odayı geçiyor, yan masadan el aynasını alıp yüzüme kaldırıyorum.\n\nAynaya iğrenerek bakıyorum. Gerçek benliğini dünyaya göstermeye korkan bir korkak... Maskeyi odamda bırakıp sarayı yüzüm açıkta, olduğu gibi kabul etmeyi düşünmem ilk kez olmuyor."

 agot_appearance_decisions_events.4001.a:0 "Maskemi çıkarıp yüzümü bir kez daha dünyaya göstereceğim!"

 agot_appearance_decisions_events.4001.b:0 "Hayır, buna dayanamam."

 agot_appearance_decisions_events.5000.t:0 "Dünyaya Bir Göz"

 agot_appearance_decisions_events.5000.desc:0 "Yansımamı inceliyorum; gözümün kaybını sunmanın doğru yolu bu mu, emin değilim. Başka bir seçenek bana daha iyi hizmet edebilir.\n\nÖnüme birkaç örtü serildi. Bunlardan birini alıp almamaya ya da diyarın karşısına olduğum gibi çıkıp çıkmamaya karar vermeliyim."

