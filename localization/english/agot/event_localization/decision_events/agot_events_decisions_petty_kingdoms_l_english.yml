 agot_proclaim.0001.t:0 "Yeniden Kurulan Demir Taht"

 agot_proclaim.0001.desc:0 "Önemli bir olaylar dizisi içinde, Westeros topraklarını tek bir sancak altında birleştirecek bir hükümdar ortaya çıktı.\n\nYıllar süren amansız savaşlar, kurnaz diplomasi ve stratejik evliliklerin ardından bu lider, pek çok kişinin imkânsız olduğunu düşündüğü şeyi başardı — Demir Taht'ın yeniden kurulmasını. Westeros içindeki dokuz imparatorluk unvanından beşini elinde tutan bu hükümdar, eşsiz bir ustalık ve kararlılık sergiledi.\n\nBir zamanlar parçalanmış ve mirası çatışmalarla lekelenmiş olan Demir Taht, salt irade ve hırsla yeniden inşa edildi. Uzun süredir rekabetler ve savaşlarla bölünmüş olan Yedi Krallık, artık olası bir barış ve istikrar çağına umutla bakıyor.\n\nWesteros'un lordları ve hanımları artık bu değişen gerçeklikle hesaplaşmak zorunda. Diz çekecek misiniz, yoksa Demir Taht'ın gücüne meydan mı okuyacaksınız?"

 agot_proclaim.0100.t:0 "Yeniden Kurulan Runestone Krallığı"

 agot_proclaim.0100.desc:0 "Vadi'de yeni bir hükümdar ortaya çıktı; toprakları başarıyla yeniden birleştirip kadim Runestone Krallığı'nı restore etti.\n\nBu lider, Royce Hanedanı'nın mirasını canlandırarak bölgeye güç ve istikrarı geri getirdi.\n\nBu diriliş, güç dengesinde önemli bir değişime işaret ediyor. Vadi'deki bu yeni güce nasıl karşılık vereceksiniz?"

