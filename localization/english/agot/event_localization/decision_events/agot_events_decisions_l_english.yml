l_english:

 agot_decisions_events.0001.t:0 "Tartışmasız Bir Krallık"

 agot_decisions_events.0001.desc:0 "Konumumun gücü artık her türlü şüpheden uzak; nihayet diyarımı gerçek bir krallık ilan etmeye hazırım. Valyria'nın Felaketi'nden bu yana bu topraklar için savaşıldı ve yağmalandı, ama ben nihayet onları birleştirdim. Artık Tartışmalı Topraklar, diğer Özgür Şehirler arasında bir güç gösterisi olarak talan edilmeyecek; bunun yerine kendi diyarımızın gücüne dayanacak. Benim diyarım."

 agot_decisions_events.0001.a:0 "Krallığımız uzun yaşasın ve refaha kavuşsun."

 agot_decisions_events.0001.b:0 "Sonunda hayalim gerçekleşti..."

 agot_decisions_events.0002.t:0 "$agot_decisions_events.0001.t$"

 agot_decisions_events.0002.desc:0 "Güçten güce koşan [founder.GetTitledFirstName], nihayet [founder.GetHerHis] diyarını gerçek bir krallık ilan etti.\n\nBu artık birleşmiş diyarın gücü tartışmasız."

 agot_decisions_events.0002.a:0 "Kendimizi hepsine kanıtlayacağız."

 agot_decisions_events.0002.b:0 "İlginç."

 agot_decisions_events.0003.t:0 "$agot_decisions_events.0001.t$"

 agot_decisions_events.0003.desc:0 "Güçten güce koşan [founder.GetTitledFirstName], nihayet [founder.GetHerHis] diyarını gerçek bir krallık ilan etti.\n\nBu artık birleşmiş diyarın gücü tartışmasız."

 agot_decisions_events.0003.a:0 "Uzun dayanamazlar!"

 agot_decisions_events.0003.b:0 "Göz önünde tutulacak bir şey."

 agot_decisions_events.0003.c:0 "İlginç."

 k_undisputed_lands:0 "Tartışmasız Topraklar"

 k_undisputed_lands_adj:0 "$k_undisputed_lands$"

 bind_dragon_horn_decision:0 "Ejderha Boynuzunu Bağlamak"

 bind_dragon_horn_decision_desc:0 "Bir kan ritüeli, benimle sahip olduğum ejderha boynuzu arasında büyülü bir bağ kuracak. Bağlanmadığı takdirde boynuz düzgün çalışmayacaktır."

 bind_dragon_horn_decision_effect:0 "Büyük bir bedel karşılığında kendini ejderha boynuzuna bağlamaya çalışacaksın."

 bind_dragon_horn_decision_tooltip:0 "Ejderha boynuzuyla bir kan bağı ritüeli gerçekleştir"

 bind_dragon_horn_decision_confirm:0 "Ritüeli hazırla"

 binding_available_prisoner:0 "Kurban edilecek yetişkin bir mahkûmu var."

 binding_available_kin:0 "Kurban edilecek bir yakını var."

 binding_available_soulmate:0 "Kurban edilecek bir can yoldaşı var."

 binding_available_blood:0 "Yaralı değil."

 needs_the_rhllor_religion_chaplain:0 "[court_chaplain|El] R'hllor dinine bağlı."

 needs_the_flames_religion_chaplain:0 "[court_chaplain|El] Valyria dinine bağlı."

 needs_mystic_figure:0 "Bir saray mensubu [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] yaşam tarzına sahip."

 agot_bloodbinding:0 "Kan Bağı"

 agot_decisions_events.0100.t:0 "$agot_bloodbinding$: Bedel"

 agot_decisions_events.0100.desc:0 ""Bağın kalıcı olması için bir bedel ödenmeli," diye uyarıyor [ritualist.GetFirstNameNicknamed], "hem de değerli bir bedel. Bu tür büyü kolayca bükülmez... #bold kan için#! bükülür."\n\n"Hepsi bu da değil," diye sürdürüyor [ritualist.GetSheHe]. "Bağ ateşle güçlendirilmeli. Kan ve ateş, ateş ve kan." [ritualist.GetSheHe|U] sözleri bir an havada bırakıp devam ediyor. "Bir yabancının kurban edilmesi işe yarayabilir, tabii kendi kanından bir damla sunarsan... Ama #italic kişisel#! bir adak, kendi kanın ya da yakın bir akrabanınki, en iyisidir. Bedel büyük olacak, ama ödül daha da büyük olacak.""

 agot_decisions_events.0100.a:0 "Mahkûmları getirin."

 agot_decisions_events.0100.a.tt:0 "Kurbanını mahkûmların arasından seçeceksin, ama başarı şansın #difficulty_hard çok küçük#! olacak."

 agot_decisions_events.0100.b:0 "Ailemi çağırın."

 agot_decisions_events.0100.b.tt:0 "Kurbanını yakın akrabaların arasından seçeceksin; başarı şansın #difficulty_medium mütevazı#! olacak."

 agot_decisions_events.0100.c:0 "Kanı #BER ben#! sağlayacağım."

 agot_decisions_events.0100.c.tt:0 "Bunun için ağır bir bedel ödeyeceksin ve başarı şansın #difficulty_easy yüksek#! olacak."

 agot_decisions_events.0100.soulmate:0 "Kalbimi feda edeceğim, [soulmate.GetFirstName]."

 agot_decisions_events.0100.soulmate.tt:0 "Can yoldaşın [soulmate.GetTitledFirstNameNoTooltip] bu ritüelde kurban edilecek; #true_white;bold başarı garanti#!"

 agot_decisions_events.0100.d:0 "Bedel çok yüksek."

 agot_decisions_events.0100.hidden:0 ""

 agot_decisions_events.0101.t:0 "$agot_bloodbinding$: Kurban"

 agot_decisions_events.0101.desc:0 "Ritüel için kurbanı seç."

 agot_decisions_events.0101.a:0 "Uygun bir kurban..."

 agot_decisions_events.0101.b:0 "Farklı bir bedel ödenmeli."

 agot_decisions_events.0101.c:0 "Bir düşününce, bu aptalca."

 agot_decisions_events.0102.t:0 "$agot_bloodbinding$: Ritüel"

 agot_decisions_events.0102.intro.sacrifice_ritualist:0 ""Pekâlâ," diye konuşuyor [ritualist.GetFirstName] boğuk ama görev bilinciyle dolu bir tonda.\n\n"

 agot_decisions_events.0102.intro.sacrifice_child:0 ""[sacrifice.GetHerHim]'e haşhaş sütü verdim; [sacrifice.GetSheHe] hiçbir şey hissetmeyecek," diyor [ritualist.GetFirstNameNoTooltip], çocuğum [sacrifice.GetFirstName] içeri taşınırken. [sacrifice.GetHerHis] yüzüne baktıkça, buna değip değmeyeceğini merak etmeye başlıyorum. Değer; #bold değmek#! zorunda."

 agot_decisions_events.0102.intro.sacrifice_kin:0 "[sacrifice.GetFirstName] önüme getiriliyor ve seçimimin ağırlığı üzerime çökmeye başlıyor. #italic İşe yarayacak mı?#! diye geçiriyorum içimden, ama [ritualist.GetFirstNamePossessiveNoTooltip] gözlerindeki bakış bunun işe yarayacağını söylüyor. Böylesi bir güvenin yersiz olması elbette düşünülemez."

 agot_decisions_events.0102.intro.sacrifice_prisoner:0 "Mahkûmum [sacrifice.GetFirstName] önüme getiriliyor ve kararımın ağırlığı üzerime çökmeye başlıyor. Suçlu olsun olmasın, böyle bir kader adil bir ceza değil... Şüphe sızıyor içime, ama [ritualist.GetFirstNamePossessiveNoTooltip] gözlerindeki bakış beni rahatlatıyor. Bu #bold doğru#!."

 agot_decisions_events.0102.intro.sacrifice_soulmate:0 ""Aşkım, bu nedir?" Bu anda [soulmate.GetFirstNamePossessive] sesi damarlarımdaki ejderha camı gibi, beni içimden parçalıyor. [soulmate.GetHerHim]'e susmasını emrediyorum, ama sessizlik #bold o kadar da#! çok acıtıyor."

 agot_decisions_events.0102.intro.bleed_self:0 "Sırada olacaklara zihnen hazırlanıyorum. "Bu kolay olmayacak," diyor [ritualist.GetFirstNameNoTooltip] hafifçe. "Neredeyse ölümüne kadar kan kaybedeceksin ve belki de asla iyileşemeyeceksin." Bakışlarım ejderha boynuzuna sabitleniyor. "Hazır olduğunda başlayalım," diyor [ritualist.GetSheHe]."

 agot_decisions_events.0102.desc.blood_self:0 "\n\nBaşımı sallıyorum ve ritüel başlıyor. Keskin bir bıçağı kolumda temiz bir çizgi halinde gezdiriyorum; koyu kızıl sıvının önce yara boyunca kabarcıklar halinde yükseldiğini izliyorum. Sonra bir fışkırma geliyor; beklediğimden, umduğumdan fazla...\n\nBaşım dönüyor, görüş alanımın kenarlarından karanlık sızarken."

 agot_decisions_events.0102.desc.blood_sacrifice:0 "\n\n[sacrifice.GetFirstNameNoTooltip], bıçağımı [sacrifice.GetHerHis] boynunda pürüzsüzce gezdirdiğimde sarsılıyor. [sacrifice.GetSheHe|U] çığlık atmış olabilir, ama ses kan gurultusunda boğuluyor. Şimdi ardına kadar açılan yaradan ılık bir kızıl sel akıyor... ve [sacrifice.GetFirstNamePossessiveNoTooltip] gözlerindeki ışık sönüyor.\n\nBoynuz, kurbanın kanına bulanıyor. Ben de kendi kanımdan birkaç damla sunuyorum."

 agot_decisions_events.0102.desc.fire:0 "Ateşte boynuzun simgeleri parlakça parlıyor. Bağ mühürlendi. Ritüel sona erdi."

 agot_decisions_events.0102.a:0 "İşe... işe yaradı mı?"

 agot_decisions_events.0102.tt:0 "Öğrenmenin tek bir yolu var."

 agot_decisions_events.0102.toast.soulmate:0 "Ne yaptığını biliyorsun."

 agot_decisions_events.0105.t:0 "Zayıflayan Bağ"

 agot_decisions_events.0105.desc.intro:0 "Son zamanlarda [dragon.GetName] giderek huzursuzlaşıyor. [dragon.Custom('GetDragonSheHe')] giderek daha fazla emirlerime uymakta isteksiz davranıyor, hatta bazı emirlerime karşı gelmeye cüret ediyor. [dragon.Custom('GetDragonHerHim')] üzerindeki kontrolümün zorlandığından ve yakında [dragon.Custom('GetDragonSheHe')]'nin bağdan kurtulabileceğinden endişeleniyorum.\n\nBunu düzeltmenin tek bir yolu var; ejderha boynuzunu [dragon.GetNamePossessiveNoTooltip] huzurunda bir kez daha çalmalıyım."

 agot_decisions_events.0105.desc.imminent_break:0 "Korkarım ya bu ya da [dragon.GetNameNoTooltip] üzerindeki kontrolü tamamen kaybetmek."

 agot_decisions_events.0105.desc.imminent_shatter:0 "Zorla kurulan bağımızı [dragon.Custom('GetDragonSheHe')] parçalarsa, [dragon.GetNameNoTooltip] intikam peşine düşebilir."

 agot_decisions_events.0105.a:0 "Bunu düzeltmeliyim."

 agot_decisions_events.0106.t:0 "$agot_dragonbinding$: Kopan Bağ"

 agot_decisions_events.0106.desc:0 "[dragon.GetNameNicknamed] artık emirlerime uymuyor; [dragon.Custom('GetDragonHerHim')] üzerindeki kontrolüm tamamen kayboldu. Artık bir ejderha binicisi olmadığım gerçeğini kabul etmeliyim."

 agot_decisions_events.0106.a:0 "Kâhya, bana boynuzu bul."

 agot_decisions_events.0106.a.tt:0 "Boynuzla ejderhayı yeniden bağlamaya çalışacaksın."

 agot_decisions_events.0106.b:0 "Bu çok daha kötü sonuçlanabilirdi."

 agot_decisions_events.0106.dragon_flee:0 "Ejderha kontrolünden kurtulur ve bir [dragonpit|E] sahibi değilsen kaçıp gider"

 agot_decisions_events.0107.t:0 "$agot_dragonbinding$: Parçalanan Bağ"

 agot_decisions_events.0107.desc:0 "[dragon.GetName] üzerindeki bağ hızla çözüldü; bu, [dragon.Custom('GetDragonHerHis')] saf irade gücünün kanıtı. Yenilenen bir berraklıkla [dragon.GetNameNoTooltip], kaderi üzerinde bir kez daha tam kontrole sahip — ve [dragon.Custom('GetDragonSheHe')] #bold intikam#! istiyor. Kan büyüsüne hiç güvenmemeliydim!"

 agot_decisions_events.0107.a:0 "Boynuz, hemen!"

 agot_decisions_events.0107.b:0 "[dragon.GetNameNoTooltip], yanıma! #bold Yanıma#!! dedim!"

 agot_decisions_events.0107.b.valyrian:0 "#italic Dohaerās, [dragon.GetNameNoTooltip]! Lykiri!#!"

 agot_decisions_events.0109.t:0 "$agot_dragonbinding$: Sert Bir Uyanış"

 agot_decisions_events.0109.desc:0 "[dragon.GetNameNicknamed] emirlerime yanıt vermeyi aniden kesti. Bakışlarını üzerime çevirdiği ana dek, bu ejderhanın bana duyduğu derin nefreti hissedemiyorum...\n\nÇeneleri bedenimi kavradığı anda burada neler olduğunu anlıyorum. Bağ koparıldı! Başka biri kendini ejderha boynuzuma bağladı!"

 agot_decisions_events.0109.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_decisions_events.0110.t:0 "$agot_dragonbinding$: Ani Ayrılış"

 agot_decisions_events.0110.desc:0 "İlk başta [dragon.GetName]'i bu kadar ani ayrılmaya iten şeyin ne olduğu belirsizdi. Şu ana dek [dragon.Custom('GetDragonHerHim')] üzerindeki hâkimiyetim sağlam görünüyordu.\n\nAma düşününce tek bir doğal sonuç var; başka biri kendini ejderha boynuzuma bağladı! Geriye dönüp bakınca, o şeyi öylesine kaybetmemeliydim. Şanslı sayarım kendimi; bu çok daha kötü olabilirdi."

 agot_decisions_events.0110.a:0 "Yine de ejderhayı kaybetmek üzücü."

 agot_decisions_events.0200.t:0 "Braavos-Pentos Antlaşması: Bozuldu!"

 agot_decisions_events.0200.desc:0 "Sarayıma Pentos'un artık 209 Braavos-Pentos Antlaşması'na uymayacağı haberi ulaştı! Onu hükümsüz ve geçersiz ilan ettiler ve şimdiden ordularını ve köle kamplarını yeniden inşa ediyorlar!"

 agot_decisions_events.0200.a:0 "Ne yaptılar?!"

 agot_decisions_events.0200.b:0 "Bu savaş demek!"

 agot_decisions_events.0200.a_tt:0 "Braavos hükümdarları 15 yıl boyunca #bold Braavos-Pentos Antlaşması'nı Yeniden Dayatma#! Casus Belli'sini kullanabilecek"

 agot_decisions_events.0201.t:0 "Braavos-Pentos Antlaşması: Bozuldu!"

 agot_decisions_events.0201.desc:0 "Sarayıma doğrudan [GetTitleByKey('c_princes_quarter').GetNameNoTier]'den gelen haber şöyle: 209 Braavos-Pentos Antlaşması hükümsüz ve geçersiz ilan edildi.\n\nKöle ticaretine katılımımızı sürdürebilir, ordularımızı yeniden kurabilir ve özgürce paralı asker toplayabiliriz."

 agot_decisions_events.0201.a:0 "Pentos için!"

 agot_decisions_events.0202.t:0 "Braavos-Pentos Antlaşması: Bozuldu!"

 agot_decisions_events.0202.desc:0 "Pentoslu magisterler artık Braavosluların keyfine bağlı olmayacak!\n\nÇabalarım sayesinde 209 Braavos-Pentos Antlaşması resmen hükümsüz ve geçersiz ilan edildi. Artık Pentos şehri ordularımızı özgürce yeniden inşa edebilir, köleliğe katılabilir ve paralı asker toplayabilir."

 agot_decisions_events.0202.a:0 "Pentos için!"

 agot_decisions_events.0203.t:0 "Braavos-Pentos Antlaşması"

 agot_decisions_events.0203.desc:0 "Altıncı Braavos-Pentos Savaşı'ndaki yenilgimizin ardından [attacker.GetName], tüm Pentos'a şu yaptırımların uygulanacağını kararlaştırdı:\n\n$EFFECT_LIST_BULLET$Pentoshi ordusu önemli ölçüde azaltılacak.\n$EFFECT_LIST_BULLET$Pentosluların paralı asker tutması yasaklanacak.\n$EFFECT_LIST_BULLET$Ve son olarak, Pentos köle ticaretinden men edilecek."

 agot_decisions_events.0203.a:0 "Ne felaket..."

 agot_decisions_events.0204.t:0 "Braavos-Pentos Antlaşması"

 agot_decisions_events.0204.desc:0 "Altıncı Braavos-Pentos Savaşı'ndaki zaferimizin ardından düşmanlarımıza şu yaptırımlar derhal uygulanacak:\n\n$EFFECT_LIST_BULLET$Pentoshi ordusu önemli ölçüde azaltılacak.\n$EFFECT_LIST_BULLET$Pentosluların paralı asker tutması yasaklanacak.\n$EFFECT_LIST_BULLET$Ve son olarak, Pentos köle ticaretinden men edilecek."

 agot_decisions_events.0204.a:0 "Titan zafer kazandı!"

 agot_decisions_events.0205.t:0 "$agot_decisions_events.0202.t$"

 agot_decisions_events.0205.desc:0 "Braavos, [GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip]'in hükümsüz ve geçersiz ilan edildiğini duyurdu!\n\nArtık Pentos şehri ordularını özgürce yeniden inşa edebilir, köleliğe katılabilir ve paralı asker toplayabilir. Ayrıca Braavoslular, Pentos'a ve tebaasına karşı özgürce savaş açabilir!"

 agot_decisions_events.0205.a:0 "Bizi pek ilgilendirmiyor."

 agot_decisions_events.0205.a_pentos_pov:0 "Ve böylece Titan'ın kendi sözleri çöküyor!"

 agot_decisions_events.1000.t:0 "$rhaenys_circlet_name$"

 agot_decisions_events.1000.desc:0 "Kilitli bir kapının ardında, Hellholt'un mahzenlerinin derinliklerinde gizlenmiş halde aradığım şeyi buluyorum: [rhaenys.GetFirstNamePossessive] çelengi. Koyu Valyria çeliğinden işlenmiş, metalinde ince dalgalar olan, bantı elmas gibi kesilmiş ve her biri meşale ışığını canlı bir kor gibi yakalayan yakutlarla bezeli; nadir bir güzellikte.\n\n[meraxes.GetFirstName] gökten düştükten sonra [uller_ancestor.GetName] onu enkazdan çıkardı. Onu bir ganimet olarak, Dorne'a bu kadar yıkım getiren ejderha efendilerine karşı bir başkaldırı simgesi olarak sakladı. O günden beri burada, gölgede ve sessizlikte gömülü kaldı.\n\nAma sonsuza dek gizli kalmamalı."

 agot_decisions_events.1000.desc_targs:0 "\n\nOnu ortaya çıkarırsam, Targaryenlar neredeyse kesinlikle öfkelenecek. Belki de başka bir yoldan haber almalarından önce, onu sessizce bir iyi niyet göstergesi olarak geri vermek daha akıllıca olur."

 agot_decisions_events.1000.a:0 "Fetih hakkıyla Uller Hanesi'ne aittir."

 agot_decisions_events.1000.b:0 "Onu geri vereceğim."

 agot_decisions_events.1001.t:0 "$rhaenys_circlet_name$"

 agot_decisions_events.1001.desc:0 "Hellholt'tan, House [current_uller.GetHouse.GetName] tarafından yakın zamanda sergilenen halka açık bir gösteri hakkında söylentiler yayıldı; elmas biçimli yakutlarla süslü, Valyria çeliğinden bir çelenk. Hiç şüphe yok: [rhaenys.GetName]'in bir zamanlar taktığı taç.\n\n[meraxes.GetFirstName] gökten vurulduktan sonra, onun Dorne'un kumlarında kaybolduğuna inandık. Ama hayır. House Uller onu tüm bu süre boyunca elinde tuttu, nesiller boyunca gizlice sakladı.\n\nVe şimdi, sanki haklarıymış gibi onu sergiliyorlar. Onun anısının Dorneli bir ödül gibi gezdirilmesi, kolayca unutmayacağım bir hakarettir."

 agot_decisions_events.1001.a:0 "Bunu nasıl yaparlar!"

 agot_decisions_events.1001.b:0 "Affetmeyi denemeliyim."

 agot_decisions_events.1002.t:0 "$rhaenys_circlet_name$"

 agot_decisions_events.1002.desc:0 "Hellholt'tan bir ulak beklenmedik şekilde geliyor; yanında kadife kaplı küçük bir kutu ve [current_uller.GetName]'den mühürlü bir mektup taşıyor. İçinde sıradan bir biblo yok. [rhaenys.GetName]'in bir zamanlar taktığı, [meraxes.GetFirstName]'in Dorne semalarında vurulduktan sonra kaybolduğuna inandığımız çelenk.\n\n[current_uller.GetTitledFirstNameNoTooltip], bunu bana bir iyi niyet göstergesi olarak sunmak istediğini ve [current_uller.GetSheHe] ile [current_uller.GetHerHis] hanesinin onu bizden bu kadar uzun süre sakladıkları için pişmanlık duyduğunu yazıyor."

 agot_decisions_events.1002.a:0 "Sonunda bize geri döndü."

 agot_decisions_events.1010.t:0 "Kılıcı Kim Taşıyor?"

 agot_decisions_events.1010.desc:0 "Özel dairelerimde, uzun süredir kilitli duran bir sandık duruyor. Onu açmanın zamanı nihayet geldi. İçindekini gizleyen kızıl ipekleri çekip atıyorum; kundağı kara çelik ejderha başlarıyla süslü, koyu Valyria çeliğinden bir kılıç ortaya çıkıyor — Blackfyre, kralların kılıcı. Doğru ellerde güçlü bir sembole dönüşebilir."

 agot_decisions_events.1010.desc.targs:0 "\n\nTargaryenlar kılıcı yıllar önce kaybetmiş olabilir, ama ona karşı çıkacak bilinen bir Blackfyre olmadığından, kılıç üzerinde en güçlü hakka sahipler."

 agot_decisions_events.1010.desc.blackfyres:0 "\n\nAna Targaryen soyunun tükenmesiyle, kılıç üzerinde tek gerçek hak Blackfyre'lara ait."

 agot_decisions_events.1010.desc.both:0 "\n\nHem Targaryenlar hem de Blackfyre'lar, kılıcın kendilerine ait olduğunu iddia etmeye meyilli."

 agot_decisions_events.1010.a:0 "Bana aittir."

 agot_decisions_events.1010.b:0 "Onu Targaryenlere geri vereceğim."

 agot_decisions_events.1010.c:0 "Blackfyre'larındır."

 agot_decisions_events.1011.t:0 "$agot_decisions_events.1010.t$"

 agot_decisions_events.1011.desc:0 "Söylentiler doğru. Kralların kılıcı Blackfyre, [current_mopatis.GetName]'in ellerinde yeniden ortaya çıktı. Blackfyre haklı olarak bizimdir; Targaryen kanının ve ejderha efendisi mirasımızın simgesi."

 agot_decisions_events.1011.desc_keep:0 "Yine de onu alıkoymayı ve sanki üzerinde hakkı varmış gibi sergilemeyi seçti."

 agot_decisions_events.1011.desc_blackfyre:0 "Yine de onu [blackfyre_heir.GetName]'e verdi; hanemize doğrudan bir hakaret."

 agot_decisions_events.1011.a:0 "[current_mopatis.GetFirstNameNoTooltip] bunun bedelini ödeyecek!"

 agot_decisions_events.1011.b:0 "Bu meseleyi göz ardı etmeyi deneyeceğim."

 agot_decisions_events.1012.t:0 "$agot_decisions_events.1010.t$"

 agot_decisions_events.1012.desc:0 "Bir ulak beklenmedik şekilde geliyor; yanında kilitli büyük bir sandık taşıyor. Bana bir hediye olduğunu, [current_mopatis.GetName]'in nezaketi olduğunu söylüyor; ardından eşleşen anahtarı ve zarifçe yazılmış bir mektubu uzatıyor. Sandığı açıyorum; kundağı kara çelik ejderha başlarıyla süslü, koyu Valyria çeliğinden bir kılıç ortaya çıkıyor — Blackfyre, kralların kılıcı.\n\n[aegoniv.GetNameNicknamedRegnal] onu hain [daemon.GetName]'e aptalca verdiğinden beri Targaryenlardan uzaktaydı. [current_mopatis.GetFirstNameNoTooltip], onun elinde bulunduğunu keşfettiğini ve gerçek sahiplerine iade edilmesi gerektiğine inandığını yazıyor."

 agot_decisions_events.1012.a:0 "Sonunda bize geri döndü."

 agot_decisions_events.1013.t:0 "$agot_decisions_events.1010.t$"

 agot_decisions_events.1013.desc:0 "Söylentiler doğru. Kralların kılıcı Blackfyre, [current_mopatis.GetName]'in ellerinde yeniden ortaya çıktı. Blackfyre haklı olarak bizimdir; Blackfyre soyunun ve taht üzerindeki hakkımızın simgesi."

 agot_decisions_events.1013.desc_keep:0 "$agot_decisions_events.1011.desc_keep$"

 agot_decisions_events.1013.desc_blackfyre:0 "Yine de onu [targ_heir.GetName]'e verdi; hanemize doğrudan bir hakaret."

 agot_decisions_events.1013.a:0 "$agot_decisions_events.1011.a$"

 agot_decisions_events.1013.b:0 "$agot_decisions_events.1011.b$"

 agot_decisions_events.1014.t:0 "$agot_decisions_events.1010.t$"

 agot_decisions_events.1014.desc:0 "Bir ulak beklenmedik şekilde geliyor; yanında kilitli büyük bir sandık taşıyor. Bana bir hediye olduğunu, [current_mopatis.GetName]'in nezaketi olduğunu söylüyor; ardından eşleşen anahtarı ve zarifçe yazılmış bir mektubu uzatıyor. Sandığı açıyorum; kundağı kara çelik ejderha başlarıyla süslü, koyu Valyria çeliğinden bir kılıç ortaya çıkıyor — Blackfyre, kralların kılıcı.\n\nBu, hanemizin ve meşruiyetimizin simgesi; [aegoniv.GetNameRegnal] onu gerçek varisi olarak [daemon.GetName]'e armağan etti. [current_mopatis.GetFirstNameNoTooltip], onun elinde bulunduğunu keşfettiğini ve gerçek sahiplerine iade edilmesi gerektiğine inandığını yazıyor."

 agot_decisions_events.1014.a:0 "$agot_decisions_events.1012.a$"

