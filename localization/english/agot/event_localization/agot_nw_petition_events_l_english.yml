 nw_petition_supplies_army_mod:0 "İyi İaşe Edilmiş Kara Kardeşler"

 nw_petition_supplies_normal_mod:0 "İyi İaşe Edilmiş Küçük Karakollar"

 nw_petition_persuasion_succeeds:0 "[nw_petition_target.GetTitledFirstNameNoTooltip]'i ikna edebilirsiniz"

 nw_petition_persuasion_fail:0 "[nw_petition_target.GetTitledFirstNameNoTooltip]'i ikna edemezsiniz"

 nw_petition_persuasion_player_target:0 "[nw_petition_target.GetTitledFirstName]'i ikna etmeyi deneyeceksiniz"

 agot_nw_petition_events.01.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.01.desc:0 "Lord Kumandan'ın görevi nankör bir iştir — üstatla geçirilen uzun geceler, güneye erzak ve yeni asker temin etme umuduyla parşömenlere mürekkep dökmek ve kuzgunlar göndermek.\n\n"Kuzgunlar ve parşömenler ancak bu kadar işe yarar," diyor [nw_petition_envoy.GetTitledFirstName], kendinden memnun bir sırıtışla. "Bazı lordlar biraz ... #italic diplomatik#! çabaya daha iyi yanıt verebilir."\n\n[nw_petition_envoy.GetSheHe|U], [nw_petition_envoy.GetHerHim]'i güneye bir elçi olarak göndermem gerektiğini söylüyor. #italic Peki ne talep etmeliyim?#!"

 agot_nw_petition_events.01.a:0 "Daha fazla adam isteyeceğim."

 agot_nw_petition_events.01.b:0 "Erzak isteyeceğim."

 agot_nw_petition_events.01.c:0 "Neden ikisi de olmasın?"

 agot_nw_petition_events.01.d:0 "Belki de sonuçta bu iyi bir fikir değil."

 agot_nw_petition_events.0100.t:0 "Gizli Hazine"

 agot_nw_petition_events.0100.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip], değerli ziynet eşyalarından oluşan bir saklı yığının üzerine tökezledi. Şüphesiz ağırlığınca altın değerindeler!\n\nAma Lord Kumandan olarak benim düşüncelerimin ötesinde meseleler var. #italic Bu yeni kazandığım zenginlikle ne yapmalıyım?#!"

 agot_nw_petition_events.0100.a:0 "Nöbetçiler için sakla!"

 agot_nw_petition_events.0100.b:0 "Yerel bir hükümdara ver."

 agot_nw_petition_events.0100.c:0 "Yerel halka ver."

 agot_nw_petition_events.0101.t:0 "Layık Gönüllüler"

 agot_nw_petition_events.0101.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip], maceraya hevesli bir dizi coşkulu genç adamla tanıştı. Biraz ikna çabasıyla [nw_petition_envoy.GetSheHe], onları Gece Nöbetçileri'ne asker olarak katılmaya razı etti!"

 agot_nw_petition_events.0101.a:0 "Bulabildiğimiz her adama ihtiyacımız var."

 agot_nw_petition_events.0101.b:0 "Nöbetçiler, maceracıların yeri değildir."

 agot_nw_petition_events.0102.t:0 "Bir Erzak Teklifi"

 agot_nw_petition_events.0102.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip], yerel bir lordla dostça bir ilişki kurdu. Lordun elinde çok şey olmasa da, davamıza bazı erzaklar teklif etti."

 agot_nw_petition_events.0102.a:0 "Her armağanın hakkını vereceğiz."

 agot_nw_petition_events.0102.b:0 "Gece Nöbetçileri dilenci değildir."

 agot_nw_petition_events.0103.t:0 "Öfkeli Bir Kalabalık"

 agot_nw_petition_events.0103.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip] küçük bir sorunla karşılaştı... Yerel bir köylü önderi olan [peasant_leader.GetFirstName], [nw_petition_envoy.GetFirstNameNoTooltip]'i kasabadan kovmak için küçük bir kalabalık topladı. [nw_petition_envoy.GetSheHe|U]'in başka seçeneği yok — #italic [nw_petition_envoy.GetSheHe|l] kaçmalı mı, savaşmalı mı?#!"

 agot_nw_petition_events.0103.a:0 "Öndere saldır!"

 agot_nw_petition_events.0103.b:0 "Kaçmayı dene."

 nw_petition_rand_event_4_flee_succ:0 "Elçiniz öfkeli kalabalıktan başarıyla kaçar."

 nw_petition_rand_event_4_flee_fail:0 "Elçiniz öfkeli kalabalıktan kaçamaz."

 agot_nw_petition_events.0104.t:0 "Bir Haydutla Karıştırıldı"

 agot_nw_petition_events.0104.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip], yerel bir şövalye tarafından sıradan bir haydut sanıldı. [idiotic_knight_whomst_think_BB_is_bandit.GetFirstName], oynanacak tipten biri gibi görünmüyor... #italic [nw_petition_envoy.GetFirstNameNoTooltip] ne yapmalı?#!"

 agot_nw_petition_events.0104.a:0 "Onunla mantıklı konuşmayı dene."

 agot_nw_petition_events.0104.b:0 "Savaşma zamanı!"

 agot_nw_petition_events.0104.c:0 "Belki elçimin cazibesi işleri yoluna koyar?"

 nw_petition_rand_event_4_succ:0 "Elçiniz, şövalyeyi görevinin doğruluğuna ikna eder."

 nw_petition_rand_event_4_fail:0 "Şövalye #N ikna olmadı#!..."

 agot_nw_petition_events.0105.t:0 "Görevde Sarhoş"

 agot_nw_petition_events.0105.desc:0 "Görünüşe göre [nw_petition_envoy.GetFirstNameNoTooltip]'e duyduğum güven yerini bulmadı. Güneye elçim olarak seyahat ederken, [nw_petition_envoy.GetSheHe] bunun yerine her son meyhaneyi ve genelevi ziyaret etmeye zaman ayırdı.\n\nŞimdi [nw_petition_envoy.GetSheHe]'in [nw_petition_envoy.GetHerHis] çıplak elleriyle bir Yabanıl öldürdüğüne dair söylentiler bile var! #italic Hiç şüphe yok, sarhoş bir övünme...#!"

 agot_nw_petition_events.0105.a:0 "O sarhoş elçiyi bir yakalayayım..."

 agot_nw_petition_events.0106.t:0 "Kazara Bir Hakaret"

 agot_nw_petition_events.0106.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip], köylülerden lordlara, sokak müzisyenlerinden çit şövalyelerine kadar her türden insanla tanıştı. Yerel bir şövalye olan [local_knight.GetFirstName], elçimin söylediği bir şey yüzünden hakarete uğradığını iddia ediyor... #italic [nw_petition_envoy.GetFirstNameNoTooltip] ne yapmalı?#!"

 agot_nw_petition_events.0106.a:0 "Şövalyeye hakaretin karşılığını öde."

 agot_nw_petition_events.0106.b:0 "Şövalyeye defolup gitmesini söyle!"

 agot_nw_petition_events.0106.c:0 "Belki elçimin cazibesi işleri yoluna koyar?"

 agot_nw_petition_events.0107.t:0 "Meyhane Kavgası"

 agot_nw_petition_events.0107.desc:0 "Elçim [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_envoy.GetHerHis] seyahatleri sırasında yerel meyhanelere ara sıra uğrar, ancak bu geceki ziyaret diğerlerinden farklıydı.\n\nHer şey yeterince sakin başladı, ama [nw_petition_envoy.GetSheHe] ne olduğunu anlamadan durum #bold destansı bir meyhane kavgasına#! dönüştü!"

 agot_nw_petition_events.0107.a:0 "Dövüş! Dövüş! Dövüş!"

 agot_nw_petition_events.0108.t:0 "Bir Yankesici Saldırıyor"

 agot_nw_petition_events.0108.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip] her an tetikte olmalıdır. Gölgeli bir figür yaklaştığında, [vile_bandit.GetSheHe]'in kötü niyetli olup olmadığı asla bilinemez.\n\nBugün şans elçimin yanında değildi. Alçak bir haydut olan [vile_bandit.GetFirstName], [nw_petition_envoy.GetHerHim]'i yolda, her türlü yardımdan uzakta pusuya düşürmeyi başardı. #italic [nw_petition_envoy.GetFirstNameNoTooltip] ne yapmalı?#!"

 agot_nw_petition_events.0108.a:0 "Yankesiciyi öldür."

 agot_nw_petition_events.0108.b:0 "Belki bir rüşvet iş görür?"

 agot_nw_petition_events.0108.c:0 "Kaçma zamanı!"

 agot_nw_petition_events.0109.t:0 "Bir Hayvan Saldırıyor"

 agot_nw_petition_events.0109.desc:0 "Seyahat sırasında elçim [nw_petition_envoy.GetFirstNameNoTooltip] her an tetikte olmalıdır. Her köşe ve bucakta yaklaşan bir tehlike pusuda bekleyebilir.\n\nBugün şans elçimin yanında değildi. Azgın bir canavar, [nw_petition_envoy.GetHerHim]'i her türlü yardımdan uzakta, habersiz yakaladı. #italic [nw_petition_envoy.GetFirstNameNoTooltip] ne yapmalı?#!"

 agot_nw_petition_events.0109.a:0 "Canavarı öldür."

 agot_nw_petition_events.0109.b:0 "Kaçma zamanı!"

 nw_petition_rand_event_9_flee_succ:0 "Elçiniz canavardan başarıyla kaçar."

 nw_petition_rand_event_9_flee_fail:0 "Elçiniz canavardan kaçamaz."

 agot_nw_petition_events.0111.t:0 "Kanlı Bir Olay"

 agot_nw_petition_events.0111.desc:0 "Elçim [nw_petition_envoy.GetFirstNameNoTooltip] başını derde sokmuşa benziyor. Bir kavga çıktı, kan döküldü ve savaşanlardan yalnızca biri sağ çıkabildi..."

 agot_nw_petition_events.0111.a:0 "[nw_petition_envoy.GetSheHe] dilekçe verilen lorda doğru yola devam etse iyi olur!"

 agot_nw_petition_events.0111.b:0 "Hayır! Neden... [nw_petition_envoy.GetSheHe] çok gençti..."

 nw_petition_rand_event_10_win:0 "Elçiniz hayatta!"

 nw_petition_rand_event_10_wounded:0 "Elçiniz hayatta, ama yaralı."

 nw_petition_rand_event_10_defeat:0 "Elçiniz ölür..."

 agot_nw_petition_events.0113.t:0 "Düşmanlardan Kaçıldı"

 agot_nw_petition_events.0113.desc:0 "Beceri ya da şans sayesinde elçim [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_envoy.GetHerHis] takipçilerinden kaçmayı başardı. [nw_petition_envoy.GetSheHe] artık dilekçe verilen lorda doğru yola devam edebilir."

 agot_nw_petition_events.0113.a:0 "Ne kadar erken, o kadar iyi."

 agot_nw_petition_events.0114.t:0 "Elçi Yakalandı"

 agot_nw_petition_events.0114.desc:0 "[nw_petition_envoy.GetFirstNameNoTooltip]'in tüm çabalarına rağmen [nw_petition_envoy.GetSheHe], [nw_petition_envoy.GetHerHis] takipçilerinden kaçamadı. [nw_petition_envoy.GetSheHe|U], bir çalının arkasında saklanmış, [nw_petition_envoy.GetHerHis] tanrılarına dua ederken bulundu.\n\n#bold Bu, [nw_petition_envoy.GetHerHim]'in hayatta kalması için son şans.#!"

 agot_nw_petition_events.0114.a:0 "Elçim [nw_petition_envoy.GetHerHis] kaderini kabul etmeli."

 agot_nw_petition_events.0114.b:0 "[nw_petition_envoy.GetSheHe|U], [nw_petition_envoy.GetHerHis] hayatı için savaşmalı!"

 agot_nw_petition_events.0115.t:0 "Şövalye Mantığı Dinler"

 agot_nw_petition_events.0115.desc:0 "[idiotic_knight_whomst_think_BB_is_bandit.GetFirstNameNoTooltipPossessive] aptallığının derinliğinin sınırı yoktur. Ancak bazı tatlı sözler ve bol sabırla elçim [nw_petition_envoy.GetFirstNameNoTooltip], bön şövalyeyi [nw_petition_envoy.GetHerHis] görevinin doğruluğuna ikna etmeyi başardı."

 agot_nw_petition_events.0115.a:0 "Güzel, şimdi göreve devam."

 agot_nw_petition_events.0116.t:0 "Şövalye Hiç İstemiyor"

 agot_nw_petition_events.0116.desc:0 "[idiotic_knight_whomst_think_BB_is_bandit.GetFirstNameNoTooltipPossessive] aptallığının derinliğinin sınırı yoktur. Elçimin tatlı sözlerine ve bol sabrına rağmen bön şövalye, [nw_petition_envoy.GetFirstNameNoTooltip]'in bir haydut olduğuna inanıyor.\n\n"Ne de olsa başka neden#bold #! hep siyah giyiniyor olacaksın?" diye soruyor [idiotic_knight_whomst_think_BB_is_bandit.GetFirstNameNoTooltip], kendi aptallığının farkında olmaksızın. [idiotic_knight_whomst_think_BB_is_bandit.GetSheHe] mantık dinlemeyi reddediyor — #italic [nw_petition_envoy.GetFirstNameNoTooltip] ne yapmalı?#!"

 agot_nw_petition_events.0117.t:0 "Elçi Canavarı Öldürür"

 agot_nw_petition_events.0117.desc:0 "Şaşkınlığa uğramasına rağmen elçim [nw_petition_envoy.GetFirstNameNoTooltip] hızla tepki verdi ve [nw_petition_envoy.GetHerHim] canavarı savuşturmayı başardı.\n\nGöz göze gelip birbirlerinin çevresinde döndükten sonra canavar bir saldırı daha denedi — ancak elçimin kılıcı, yabani hayvanın göğsünün derinliklerinde hedefini buldu."

 agot_nw_petition_events.0117.a:0 "Güzel, şimdi göreve devam."

 agot_nw_petition_events.0118.t:0 "Elçi Canavarı Zor Öldürür"

 agot_nw_petition_events.0118.desc:0 "Yabani hayvan saldırısını başlattığında elçim [nw_petition_envoy.GetFirstNameNoTooltip] tamamen şaşkına dönmüştü. Canavarın tüm çabalarına rağmen [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_envoy.GetHerHis] soğukkanlılığını geri kazanıp saldırıyı savuşturmayı başardı.\n\nCanavar bir saldırı daha denediğinde, elçimin kılıcı yabani hayvanın göğsünün derinliklerinde hedefini buldu. Ne yazık ki bu kavga [nw_petition_envoy.GetHerHim]'i ağır biçimde yaraladı."

 agot_nw_petition_events.0118.a:0 "Yeter ki görevi geciktirmesin..."

 agot_nw_petition_events.0119.t:0 "Canavar Elçimi Öldürür"

 agot_nw_petition_events.0119.desc:0 "Ne yazık ki, yabani hayvan saldırısını başlattığında elçim [nw_petition_envoy.GetFirstNameNoTooltip] tamamen şaşkına dönmüştü. [nw_petition_envoy.GetHerHis] tüm çabalarına rağmen [nw_petition_envoy.GetSheHe], canavarın saldırısını savuşturacak soğukkanlılığı bir daha kazanamadı.\n\nGöz göze gelip birbirlerinin çevresinde döndükten sonra canavar bir saldırı daha için kendini azgınca ileri fırlattı — elçimi kafasından yakaladı ve [nw_petition_envoy.GetHerHis] yüzünü neredeyse tamamen söktü.\n\n#italic Dilekçem için söylenecek pek bir şey kalmadı...#!"

 agot_nw_petition_events.0119.a:0 "Belki [nw_petition_envoy.GetHerHis] kemikleri Kara Kale'ye iade edilebilir."

 agot_nw_petition_events.0120.t:0 "Elçi Canavardan Kaçar"

 agot_nw_petition_events.0120.desc:0 "Şaşkınlığa uğramasına rağmen elçim [nw_petition_envoy.GetFirstNameNoTooltip] hızla tepki verdi, [nw_petition_envoy.GetHerHis] soğukkanlılığını geri kazandı ve yabani hayvandan uzaklaşıp güvenliğe koştu.\n\nPek de şık olmasa da ve [nw_petition_envoy.GetHerHis] pantolonu artık daha koyu bir kahverengi olsa da, elçim canını kurtardı."

 agot_nw_petition_events.0120.a:0 "Lordla görüşmeden önce şu pantolonu yıka, lütfen."

 agot_nw_petition_events.1000.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1000.desc:0 "Hazırlıklar yapıldı, planlar hazırlandı ve şimdi [nw_petition_envoy.GetTitledFirstName], [nw_petition_envoy.GetHerHis] yola çıkışından önce son bir kez huzuruma geldi.\n\n"Lord Kumandan, güneyde görevlerimi ivedilikle yerine getireceğime, talep ettiklerimizle Kara Kale'ye döneceğime söz veriyorum," diye temin ediyor [nw_petition_envoy.GetFirstNameNoTooltip]. "Yol uzun ve beni pek çok tehlike beklese de, hayatımı ve onurumu bu amaca adıyorum. #bold İleri, [nw_petition_target.GetCapitalLocation.GetName]'e!""

 agot_nw_petition_events.1000.a:0 "İlerle ve görevini yap."

 agot_nw_petition_events.1001.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1001.desc:0 "[nw_petition_envoy.GetTitledFirstName]'in önündeki uzun yol ve [nw_petition_envoy.GetHerHim]'i bekleyen tehlikeler hakkında anlattıkları daha doğru olamazdı. Ama sonunda [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_envoy.GetHerHis] varış noktasına, [nw_petition_target.GetCapitalLocation.GetName]'e ulaştı!"

 agot_nw_petition_events.1001.a:0 "Ev sahibinin dilekçemizi kabul etmesi için dua edelim."

 agot_nw_petition_events.1002.t:0 "Gece Nöbetçileri'nden Elçi"

 agot_nw_petition_events.1002.desc.a:0 "Sarayıma tamamen siyahlara bürünmüş ve yoldan ter kokan tuhaf bir gezgin geliyor.\n\n"[nw_petition_envoy.GetTitledFirstName], my [ROOT.Char.GetLadyLord|l]," [nw_petition_envoy.GetSheHe] introduces [nw_petition_envoyGetHerselfHimself]. "I am here on a mission — as an envoy of the black brothers, the watchers on the Wall." I yawn, hoping this envoy will get to the point.\n\n"Ehem, my [ROOT.Char.GetLadyLord|l]. I am here to petition your court for supplies, to help our sworn order defend the Seven Kingdoms!"

 agot_nw_petition_events.1002.desc.b:0 "Sarayıma tamamen siyahlara bürünmüş ve yoldan ter kokan tuhaf bir gezgin geliyor.\n\n"[nw_petition_envoy.GetTitledFirstName], my [ROOT.Char.GetLadyLord|l]," [nw_petition_envoy.GetSheHe] introduces [nw_petition_envoyGetHerselfHimself]. "I am here on a mission — as an envoy of the black brothers, the watchers on the Wall." I yawn, hoping this envoy will get to the point.\n\n"Ehem, my [ROOT.Char.GetLadyLord|l]. I am here to petition your court for men, to help our sworn order defend the Seven Kingdoms!"

 agot_nw_petition_events.1002.desc.c:0 "Sarayıma tamamen siyahlara bürünmüş ve yoldan ter kokan tuhaf bir gezgin geliyor.\n\n"[nw_petition_envoy.GetTitledFirstName], my [ROOT.Char.GetLadyLord|l]," [nw_petition_envoy.GetSheHe] introduces [nw_petition_envoyGetHerselfHimself]. "I am here on a mission — as an envoy of the black brothers, the watchers on the Wall." I yawn, hoping this envoy will get to the point.\n\n"Ehem, my [ROOT.Char.GetLadyLord|l]. I am here to petition your court for both supplies and men, to help our sworn order defend the Seven Kingdoms!"

 agot_nw_petition_events.1002.a:0 "Evet, kara kardeşlere yardım etmek için elimden geleni ayırırım!"

 nw_ruler_accepted_petition:0 "Gece Nöbetçileri'nin dilekçesini kabul edersiniz."

 agot_nw_petition_events.1002.b:0 "Hım, kabul edebilirim... Gece Nöbetçileri isteğimi yerine getirebilirse."

 nw_ruler_select_condition:0 "Gece Nöbetçileri'nin dilekçesini şartlı olarak kabul edersiniz."

 agot_nw_petition_events.1002.c:0 "Ha! Snarkları ve grumkinleri gözlemek için yardım mı istiyorsun?"

 nw_ruler_petition_initial_reject:0 "Gece Nöbetçileri'nin dilekçesini reddedersiniz."

 agot_nw_petition_events.1003.t:0 "Gece Nöbetçileri'nden Elçi"

 agot_nw_petition_events.1003.desc:0 ""Gece Nöbetçileri'nden bir kardeşi ağırlamaktan gerçekten onur duyarım," diye başlıyorum, sinsi bir sırıtışla. "Sizin gibi biri, istediğiniz şeyin ağırlığını bilmelisiniz. Lord Kumandan bir kuzgun yerine neden bir elçi göndermiş olsun?"\n\nBunun üzerine [nw_petition_envoy.GetTitledFirstName] demek istediğimi anlamışa benziyor. "Gece Nöbetçileri'nden bu dilekçeyi kabul edecek olsam, karşılığında #italic bir şey#! isterdim...""

 agot_nw_petition_events.1003.a:0 "Yabanılların tutsak ettiği esirleri serbest bırak."

 agot_nw_petition_events.1003.b:0 "Bu işe yaramazı da yanına al."

 agot_nw_petition_events.1003.c:0 "Benim için bir Yabanıl kabilesine saldır."

 agot_nw_petition_events.1003.d:0 "Adil bir fiyat üzerinde anlaşabiliriz..."

 agot_nw_petition_events.1003.e:0 "Nadir bir eser altından daha değerlidir!"

 agot_nw_petition_events.1004.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1004.desc.a:0 "[nw_petition_target.GetCapitalLocation.GetName]'e gönderdiğim elçi [nw_petition_envoy.GetTitledFirstName]'den, müzakerelerin #bold fevkalade#! geçtiği haberini aldım.\n\nAyrıntılar hâlâ görüşülürken [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_target.GetLadyLord]'in dilekçemizi kabul edeceğine inanıyor."

 agot_nw_petition_events.1004.desc.b:0 "[nw_petition_target.GetCapitalLocation.GetName]'e gönderdiğim elçi [nw_petition_envoy.GetTitledFirstName]'den, müzakerelerin ılık geçtiği haberini aldım.\n\nAyrıntılar hâlâ görüşülürken [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_target.GetLadyLord]'in dilekçemizi kabul edeceğine inanıyor... #italic tek bir şartla.#!"

 agot_nw_petition_events.1004.desc.c:0 "[nw_petition_target.GetCapitalLocation.GetName]'e gönderdiğim elçi [nw_petition_envoy.GetTitledFirstName]'den, müzakerelerin #N berbat#! geçtiği haberini aldım.\n\nDaha fazla söze gerek yok. [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_target.GetLadyLord]'in dilekçemizi kabul etmeyeceğinden emin."

 agot_nw_petition_events.1004.a:0 "Kabul etmeliyim!"

 agot_nw_petition_events.1004.b:0 "[nw_petition_target.GetLadyLord]'i ikna etmeyi dene!"

 agot_nw_petition_events.1004.c:0 "Belki rüşvet işe yarar?"

 agot_nw_petition_events.1005.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1005.desc:0 "İnsanın hayatında varoluşunun amacını kanıtladığı nadir anlar vardır. Bugün [nw_petition_envoy.GetTitledFirstName], [nw_petition_envoy.GetHerHis] amacını kanıtladı.\n\n[nw_petition_envoy.GetHerHim]'e, [nw_petition_target.GetTitledFirstName]'i Gece Nöbetçileri'nin yardımına gelmeye ikna etme görevini verdim ve tanrılar şahit olsun... #bold  [nw_petition_envoy.GetFirstNameNoTooltip] başardı!#!"

 agot_nw_petition_events.1005.a:0 "[nw_petition_envoy.GetHerHis] başının dönmesine izin vermemeliyim."

 agot_nw_petition_events.1006.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1006.desc:0 "İnsanın hayatında varoluşunun amacını kanıtladığı nadir anlar vardır. Bugün zavallı [nw_petition_envoy.GetTitledFirstName] için #bold böyle#! bir gün değildi.\n\n[nw_petition_envoy.GetHerHim]'e, [nw_petition_target.GetTitledFirstName]'i Gece Nöbetçileri'nin yardımına gelmeye ikna etme görevini verdim ve tanrılar şahit olsun... #N [nw_petition_envoy.GetFirstNameNoTooltip] başarısız oldu.#!"

 agot_nw_petition_events.1006.a:0 "Ne büyük bir başarısızlık..."

 agot_nw_petition_events.1007.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1007.desc:0 "[nw_petition_envoy.GetTitledFirstName], Gece Nöbetçileri'nin davasını savunmak için bir kez daha döndü. Yeminler ve sözler, gecenin karanlığı ve soğuğun yaklaşması hakkındaki gevezeliği takip etmekte zorlanıyorum.\n\n[nw_petition_envoy.GetSheHe] dilekçeyi sonunda bitirdiğinde, [nw_petition_envoy.GetHerHim] ile göz göze geliyorum — birinin karakterini gerçekten ölçmenin tek yolu bu. O anda ne yapmam gerektiğini biliyorum."

 agot_nw_petition_events.1007.a:0 "İkna edici bir dava; ve kabul edeceğim."

 agot_nw_petition_events.1007.b:0 "İnancından şüphe duymuyorum, ancak dilekçeni reddetmek zorundayım."

 agot_nw_petition_events.1007.c:0 "Bu isteği ikinci kez yüzsüzce yapmaya cüret ediyorsun!"

 agot_nw_petition_events.1008.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1008.desc.a:0 "[nw_petition_envoy.GetTitledFirstName], [nw_petition_target.GetTitledFirstName]'i Gece Nöbetçileri'nin yardımına gelmeye ikna etmek için elinden gelen her şeyi yaptı — büyük bir başarıyla!\n\nŞimdi [nw_petition_envoy.GetSheHe], Duvar'a hoş bir dönüş için hazırlanmalı."

 agot_nw_petition_events.1008.desc.b:0 "[nw_petition_envoy.GetTitledFirstName], [nw_petition_target.GetTitledFirstName]'i Gece Nöbetçileri'nin yardımına gelmeye ikna etmek için elinden gelen her şeyi yaptı — ve sonunda bir anlaşmaya vardı...\n\nŞimdi [nw_petition_envoy.GetSheHe], Duvar'a hoş bir dönüş için hazırlanmalı."

 agot_nw_petition_events.1008.desc.c:0 "[nw_petition_envoy.GetTitledFirstName], [nw_petition_target.GetTitledFirstName]'i Gece Nöbetçileri'nin yardımına gelmeye ikna etmek için elinden gelen her şeyi yaptı — hepsi boşuna.\n\nŞimdi [nw_petition_envoy.GetSheHe], Duvar'ın sertliğine uzun ve acı bir dönüş için hazırlanmalı."

 agot_nw_petition_events.1008.a:0 "Kara Kale'ye doğru ileri!"

 agot_nw_petition_events.1009.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1009.desc.a:0 "[nw_petition_envoy.GetTitledFirstName], [nw_petition_envoy.GetHerHis] saf çabasıyla [nw_petition_target.GetTitledFirstName]'i dilekçemizin şartlarını kabul etmeye ikna etmeyi başardı."

 agot_nw_petition_events.1009.desc.b:0 "[nw_petition_envoy.GetTitledFirstName], [nw_petition_envoy.GetHerHis] saf çabasıyla [nw_petition_target.GetTitledFirstName]'i dilekçemizin yeni çerçevelenen şartlarını kabul etmeye ikna etmeyi başardı."

 agot_nw_petition_events.1009.desc.c:0 "[nw_petition_envoy.GetTitledFirstName]'in tüm çabalarına rağmen [nw_petition_target.GetTitledFirstName], dilekçeyi bir kez daha reddeder."

 agot_nw_petition_events.1009.a:0 "Kabul etmeliyim!"

 agot_nw_petition_events.1009.b:0 "Hayır, bu müzakere bitti."

 agot_nw_petition_events.1009.c:0 "Teşekkür ederim, [nw_petition_target.GetLadyLord]."

 agot_nw_petition_events.1010.t:0 "Yedi Krallığa Bir Elçi"

 agot_nw_petition_events.1010.desc.a:0 "[nw_petition_envoy.GetTitledFirstName], Kara Kale'den ayrılırken görevini ivedilikle sürdüreceğine, Gece Nöbetçileri için yardım sağlamak umuduyla taş üstünde taş bırakmayacağına söz verdi.\n\nBugün [nw_petition_envoy.GetFirstNameNoTooltip] yolculuğunu tamamlıyor; kapıdan girerken bir kahramana yaraşır karşılama hak ediyor.\n\n"You did it," I say, as I take a hold of [nw_petition_envoy.GetHerHis] hand. "You successfully served as an envoy of the Night's Watch."\n\n#italic Now, what to do with the hard-won prize?#!"

 agot_nw_petition_events.1010.desc.b:0 "[nw_petition_envoy.GetTitledFirstName], Kara Kale'den ayrılırken görevini ivedilikle sürdüreceğine, Gece Nöbetçileri için yardım sağlamak umuduyla taş üstünde taş bırakmayacağına söz verdi.\n\nBugün [nw_petition_envoy.GetFirstNameNoTooltip] yolculuğunu tamamlıyor; kapıdan girerken bir kahramana yaraşır karşılama hak ediyor.\n\n"You did it," I say, as I take a hold of [nw_petition_envoy.GetHerHis] hand. "You successfully served as an envoy of the Night's Watch."\n\n#italic Now, what to do with the hard-won prize?#!"

 agot_nw_petition_events.1010.desc.c:0 "[nw_petition_envoy.GetTitledFirstName] Kara Kale'den ayrılırken, Gece Nöbetçileri'ne yardım sağlama umuduyla taş üstünde taş bırakmayarak [nw_petition_envoy.GetHerHis] görevi ivedilikle sürdüreceğine söz verdi.\n\nBugün [nw_petition_envoy.GetFirstNameNoTooltip], [nw_petition_envoy.GetHerHis] yolculuğunu tamamlıyor; başarısız ama [nw_petition_envoy.GetSheHe] kapıdan geçerken yılmaz.\n\n"İstediğimizi alamamış olabilirsin," diyorum, [nw_petition_envoy.GetHerHis] elinden tutarak. "Ama sağ salim geri döndün.""

 agot_nw_petition_events.1010.a:0 "Adamları muhafızlara gönder."

 agot_nw_petition_events.1010.b:0 "Adamları kullanılmayan kaleleri garnizonlamaya gönder."

 agot_nw_petition_events.1010.c:0 "Erzakları kara kardeşlerimize gönder."

 agot_nw_petition_events.1010.d:0 "Erzakları daha küçük karakollara gönder."

 agot_nw_petition_events.1010.e:0 "Adamları muhafızlara ve erzakları kara kardeşlerimize gönder."

 agot_nw_petition_events.1010.f:0 "Adamları kullanılmayan kaleleri garnizonlamaya ve erzakları kara kardeşlerimize gönder."

 agot_nw_petition_events.1010.g:0 "Adamları muhafızlara ve erzakları daha küçük karakollara gönder."

 agot_nw_petition_events.1010.h:0 "Adamları kullanılmayan kaleleri garnizonlamaya ve erzakları daha küçük karakollara gönder."

 agot_nw_petition_events.1010.i:0 "Şimdi, mevzine geri dön."

 NW_SOMETHING_BROKE:0 "Elçimden haber beklemek başlıca uğraşım haline geldi — ama ne yazık ki rüzgârlar arasında bir şeyler kaybolmuşa benziyor.\n\nDaha fazla bekleyemem; elçimin önüme koyacağı seçimi yalnızca tahmin etmem gerekiyor. #italic Ne yapmalıyım?#!"

 agot_nw_petition_events.1011.t:0 "Konuk Hakkı Çiğnendi"

 agot_nw_petition_events.1011.opening:0 "Gece Nöbetçileri'nden Bir Elçi... Dışlanmış!"

 agot_nw_petition_events.1011.desc:0 "Gece Nöbetçileri'nin elçisi olarak [nw_petition_target.GetTitledFirstName]'in sarayını ziyaret ederken azarlandım ve küçük düşürüldüm. Tüm dünya [nw_petition_target.GetFirstNamePossessiveNoTooltip] utancını öğrenmeli!"

 agot_nw_petition_events.1011.a:0 "Gerçekten bir utanç!"

 agot_nw_petition_events.0200.t:0 "Gece Nöbetçileri'ne Katılma Arzusu"

 agot_nw_petition_events.0200.desc:0 "Elçim [nw_petition_envoy.GetTitledFirstName], [nw_petition_target.GetTitledFirstName]'in sarayını ziyaret ederken, [nw_petition_envoy.GetHerHis] ev sahibinin ailesinden bir üye ona yaklaşır.\n\n[nw_petition_200_lords_family_member.GetFirstNameNoTooltip], salonlarına bir kara kardeşin gireceği günü uzun zamandır hayal ettiğini söylüyor — #bold ona bu evi geride bırakıp Gece Nöbetçileri'ne katılma fırsatı verir!#!"

 agot_nw_petition_events.0200.a:0 "Daha fazla adama ihtiyacımız var!"

 agot_nw_petition_events.0200.b:0 "Buna izin veremeyiz."

 nw_post_petition_rand_event_1_family_member_taken:0 "[nw_petition_200_lords_family_member.GetFirstNamePossessiveNoTooltip] talebini kabul edersiniz. Tüm miras haklarından vazgeçerek Gece Nöbetçileri'ne katılacak."

 nw_post_petition_rand_event_1_family_member_refused:0 "[nw_petition_200_lords_family_member.GetFirstNamePossessiveNoTooltip] talebini reddedersiniz. Duvar, hayalperestlerin yeri değildir."

 agot_nw_petition_events.0202.t:0 "Acemiler Kaçmaya Çalışıyor"

 agot_nw_petition_events.0202.desc:0 "Bazen Gece Nöbetçileri'ne katılmak için alınan acemiler gönüllü gelmez. Ve çoğu zaman, gezgin bir kuzgun sürünün üzerinde dikkatli bir göz tutmalıdır.\n\nBugün bir grup yeni acemi kervandan kaçmaya çalıştı, ancak [nw_petition_envoy.GetTitledFirstName], uzağa gitmelerine fırsat vermeden onları yakalamayı başardı. #italic Peki, firarilerle ne yapmalı?#!"

 agot_nw_petition_events.0202.a:0 "Firarın cezası ölümdür."

 agot_nw_petition_events.0202.b:0 "Bulabildiğimiz her aceminin ihtiyacımız var. Onları bağışla."

 agot_nw_petition_events.0203.t:0 "Yerel Bir Şövalye Nöbetçilere Katılmak İstiyor"

 agot_nw_petition_events.0203.desc:0 "Gece Nöbetçileri'nin tehlikeleri — ve şanı — hakkında mitler ve söylentiler boldur. Bazıları yalnızca en büyük şövalyelerin yenebileceği buzdan varlıklar olan #italic Ak Gezenlerden#! söz eder. Başkaları ise Duvar'ın kuzeyinde hâlâ dolaşan #bold devlerden#! söz eder.\n\nŞan mı budalalık mı [nw_petition_203_local_knight.GetTitledFirstName]'in kafasına kök saldı, [nw_petition_envoy.GetTitledFirstName] emin değil. [nw_petition_envoy.GetSheHe]'in bildiği tek şey, bu şövalyenin Gece Nöbetçileri'ne katılma hayali olduğu!"

 agot_nw_petition_events.0203.a:0 "Daha fazla adama ihtiyacımız var!"

 agot_nw_petition_events.0203.b:0 "Buna izin veremeyiz."

 nw_post_petition_rand_event_4_knight_taken:0 "[nw_petition_203_local_knight.GetFirstNamePossessiveNoTooltip] talebini kabul edersiniz. [nw_petition_203_local_knight.GetSheHe], tüm miras haklarından vazgeçerek Gece Nöbetçileri'ne katılacak."

 nw_post_petition_rand_event_4_knight_refused:0 "[nw_petition_203_local_knight.GetFirstNamePossessiveNoTooltip] talebini reddedersiniz. Duvar, hayalperestlerin yeri değildir."

 agot_nw_petition_events.0204.t:0 "Yerel Demirci Erzak Teklif Ediyor"

 agot_nw_petition_events.0204.desc:0 "Batı Diyarları'nda bazıları Gece Nöbetçileri'ne hâlâ büyük saygı duyar — kara kardeşlerin yaptığı fedakârlığı ve yüzleştikleri ağır tehlikeleri bilenler.\n\nYerel bir demirci olan [nw_petition_204_blacksmith.GetFirstNameNoTooltip], Gece Nöbetçileri'nin görevine yardım etmek için elindeki erzakları sunmak üzere elçim [nw_petition_envoy.GetTitledFirstName]'i aradı."

 agot_nw_petition_events.0204.a:0 "Erzakları al."

 agot_nw_petition_events.0204.b:0 "Biz dilenci değiliz."

 nw_post_petition_rand_event_5_gain_supp:0 "Yerel demircinin erzaklarını kabul edersiniz."

 agot_nw_petition_events.0205.t:0 "Bozulmuş Erzaklar"

 agot_nw_petition_events.0205.desc:0 "Kara Kale'ye uzun dönüş yolculuğu yaparken elçim [nw_petition_envoy.GetTitledFirstName], erzakların önemli bir kısmının bozulduğunu keşfetti.\n\nBu çürümenin kalan erzaklara yayılması ve tüm bu yolculuğu #N işe yaramaz#! hale getirmesi an meselesi!"

 agot_nw_petition_events.0205.a:0 "Kahretsin!"

 agot_nw_petition_events.0205.b:0 "Kalanları kurtarmanın bir yolunu bul."

 agot_nw_petition_events.0205.c:0 "Erzakları yenilemesi için yerel bir lordu ikna et."

 agot_nw_petition_events.0205.d:0 "Çaresiz zamanlar çaresiz önlemler gerektirir; dilenme zamanı."

 nw_post_petition_rand_event_6_lose_supp:0 "Bozulmuş erzakları kaybedersiniz."

 nw_post_petition_rand_event_6_small_lose_supp:0 "Erzakların bir kısmını kurtardınız, ancak çoktan bozulanlar kurtarılamaz durumda."

 nw_post_petition_rand_event_6_gain_supp:0 "Çoktan bozulanların yerini dolduracak erzaklar elde edersiniz."

 agot_nw_petition_events.0206.t:0 "Aramızda Bir Hırsız"

 agot_nw_petition_events.0206.desc:0 "Kara Kale'ye dönüş yolculuğu, özellikle de taze erzaklarla dolu bir kervanla tehlikelerle doludur. Elçim [nw_petition_envoy.GetTitledFirstName], kampın üzerinde dikkatli bir göz tutmalıdır.\n\nBugün [nw_petition_envoy.GetSheHe], aramızda bir hırsız keşfetti! [nw_petition_envoy.GetHerHis] uyanıklığı sayesinde [nw_petition_206_supplies_thief.GetTitledFirstName], [nw_petition_206_supplies_thief.GetSheHe] kaçamadan yakalandı. #italic Peki, bu haydutla ne yapmalı?#!"

 agot_nw_petition_events.0206.a:0 "Bu suçun bedeli #bold ölümdür#!."

 agot_nw_petition_events.0206.b:0 "Hırsızı bir acemi olarak Duvar'a götür."

 agot_nw_petition_events.0206.c:0 "Bu pislikle yerel bir lord ilgilenebilir."

 nw_post_petition_rand_event_7_wall:0 "Gece Nöbetçileri'ne katılan acemilerin çoğu suçludur; bu neden farklı olsun?"

 agot_nw_petition_events.0207.t:0 "Gerekenden Fazla Erzak"

 agot_nw_petition_events.0207.desc:0 "Ne garip bir durum... Elçim [nw_petition_envoy.GetTitledFirstName] güneye yaptığımız görevin #bold o kadar iyi#! geçtiğini, gerçekte elimizde ne yapacağımızı bilemediğimiz kadar çok erzak olduğunu bildirdi.\n\nBir şeyleri geride bırakmayı düşünmek bile canımı acıtıyor; ancak olası bozulmayı önlemek için erzakların bir kısmını geride bırakmak daha mı iyi olur?"

 agot_nw_petition_events.0207.a:0 "Fazla erzakları sakla."

 agot_nw_petition_events.0207.b:0 "Erzakların bir kısmını halka ver."

 nw_post_petition_rand_event_8_gain_supp:0 "Riske rağmen tüm erzakları elinizde tutarsınız."

 nw_post_petition_rand_event_8_give_to_small_folk:0 "Erzakların bir kısmını halka verirsiniz; yerel kalkınmayı iyileştirirsiniz."
