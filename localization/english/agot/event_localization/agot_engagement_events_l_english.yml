 agot_engagement_objection_lowborn:0 "[betrothed_2.GetSheHe|U] dahası, bir sıradan insan!"

 agot_engagement_objection_bastard:0 "Bir piçle evlenmemin nasıl beklendiğini anlamıyorum."

 agot_engagement_objection_not_attracted_to_me:0 "Bana [betrothed_2.GetSheHe]'nin benim gibi [betrothed_1.Custom('WomenMenGirlsBoys')]'den #italic hoşlanmadığı#! bile söylendi."

 agot_engagement_objection_not_attracted_to_them:0 "[betrothed_2.GetHerHim] gibi bir [betrothed_2.Custom('WomanManGirlBoy')]'den asla #italic tatmin#! bulamayacağım!"

 agot_engagement_objection_dwarf:0 "[betrothed_2.GetSheHe|U]... bir cüce! Gerçek bir cüce!"

 agot_engagement_objection_hunchback:0 "[betrothed_2.GetSheHe|U] bir kambur! [betrothed_2.GetHerHim]'i hiç görmedin mi?!"

 agot_engagement_objection_greyscale:0 "Gri hastalık...öf! [betrothed_2.GetHerHim]'e bakmak bile içimi kaldırıyor!"

 agot_engagement_objection_hideous:0 "Açıkça söylemek gerekirse [betrothed_2.GetSheHe|U] tam bir çirkin."

 agot_engagement_objection_ugly:0 "Doğrudan söyleyeyim: [betrothed_2.GetSheHe] çirkin."

 agot_engagement_objection_unattractive:0 "[betrothed_2.GetHerHim]'in görünüşünden hoşlanmıyorum. Kim hoşlanabilir ki?"

 agot_engagement_objection_idiot:0 "[betrothed_2.GetSheHe|U] bir budala. Bir kütükle konuşsam daha iyi."

 agot_engagement_objection_dull:0 "Söylemekten nefret ediyorum, ama bu [betrothed_2.Custom('WomanManGirlBoy')] toprak kadar sıkıcı!"

 agot_engagement_objection_weak:0 "[betrothed_2.GetSheHe|U] çok zayıf ve güçsüz. [betrothed_2.GetHerHim]'e dokunursam parçalanacak diye neredeyse korkuyorum!"

 agot_engagement_objection_lesser:0 "[betrothed_2.GetSheHe|U] düşük bir aileden geliyor. Bu doğru ve sen de biliyorsun."

 agot_engagement_objection_lazy:0 "[betrothed_2.GetSheHe] bütün gün boyunca aylak aylak sürtmekten başka bir şey yapmıyor!"

 agot_engagement_objection_deceitful:0 "[betrothed_2.GetSheHe]'nin yaptığı tek şey, her şey hakkında yalan söylemek!"

 agot_engagement_objection_craven:0 "[betrothed_2.GetSheHe|U]'nin en ufak bir onuru bile yok!"

 agot_engagement_objection_shy:0 "[betrothed_2.GetSheHe|U] inanılmaz derecede utangaç. [betrothed_2.GetHerHim]'den tek bir kelime bile almakta zorlanıyorum!"

 agot_engagement_objection_bold:0 "[betrothed_2.GetSheHe|U] kendini beğenmişliğin zirvesinde!"

 agot_engagement_objection_meek:0 "[betrothed_2.GetSheHe|U] o kadar uysal ki, koca bir [betrothed_2.Custom('WomanManGirlBoy')] içinde minicik bir fare!"

 agot_engagement_objection_drunkard:0 "[betrothed_2.GetSheHe|U] çok fazla içiyor! [betrothed_2.GetHerHim]'i her gördüğümde, [betrothed_2.GetSheHe] kıpkırmızı suratlı ve peltek konuşuyor!"

 agot_engagement_objection_sad:0 "[betrothed_2.GetSheHe|U] iç çekmekten ve ağlamaktan başka bir şey yapmıyor — hiç bitmiyor mu?!"

 agot_engagement_objection_crazy:0 "[betrothed_2.GetSheHe|U] aklını kaçırmış! Sen de biliyorsun, ben de."

 agot_engagement_objection_unfaithful:0 "[betrothed_2.GetSheHe|U] bana ya da kimseye asla sadık kalmayacak. Bunun doğru olduğunu biliyorsun!"

 agot_engagement_objection_prude:0 "[betrothed_2.GetSheHe|U] benim zevkime göre fazlasıyla #italic gergin#! biri!"

 agot_engagement_objection_unkind:0 "Bu [betrothed_2.Custom('WomanManGirlBoy')] [Select_CString( betrothed_2.IsFemale, 'şeytani', 'kaba' )] ve zalim!"

 agot_engagement_objection_much_too_young:0 "[betrothed_2.GetSheHe|U] bana kıyasla neredeyse bir bebek! Bu hiç de yakışık almıyor!"

 agot_engagement_objection_too_young:0 "[betrothed_2.GetSheHe|U] benden çok daha genç!"

 agot_engagement_objection_too_old:0 "[betrothed_2.GetSheHe|U] benim için fazlasıyla yaşlı!"

 agot_engagement_objection_much_too_old:0 "[betrothed_2.GetSheHe|U] neredeyse yaşlı bir [betrothed_2.GetWomanMan]!"

 agot_engagement_objection_unlike:0 "Birbirimize her yönden o kadar uymuyoruz ki!"

 agot_engagement_objection_std:0 "[betrothed_2.GetHerHis] ağzının çevresindeki o yaralar... onları hiç görmedin mi?!"

 agot_engagement_objection_reputation:0 "[betrothed_2.GetHerHis] şöhreti ne olacak? Doğru mu? Benim böyle biriyle evlenmemi nasıl isteyebilirsin?"

 agot_engagement_objection_child:0 "[betrothed_2.GetSheHe]'nin bir çocuğu olduğunu biliyorsun, değil mi? Bir piç!"

 agot_engagement_objection_unremarkable:0 "[betrothed_2.GetSheHe|U] tamamen sıradan biri. [betrothed_2.GetHerHim]'de özel olan tek bir şey bile yok!"

 agot_engagement_events.0002.t:0 "Yüreğin İstediği"

 agot_engagement_events.0002.desc.intro:0 "Benim [ROOT.Char.Custom2('LMF_RelationToMe', SCOPE.sC('betrothed_1'))] odama giriyor,"

 agot_engagement_events.0002.desc.submissive:0 "[betrothed_1.GetHerHis] ellerini endişeyle ovuşturuyor ve konuşmakta isteksiz. Sonunda, biraz çabayla [betrothed_1.GetFirstName] açılıyor.\n\n"[betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], [betrothed_1.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_2'))] ile nişanımı düşünüyordum. Fikrini değiştirmen... hâlâ mümkün mü?"\n\n"

 agot_engagement_events.0002.desc.angry:0 "yumrukları sıkılı ve gözleri öfkeyle parlıyor. Bunun tatsız geçeceğini anında anlıyorum.\n\n"[betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], yapamam," diye haykırıyor [betrothed_1.GetFirstName]. "[betrothed_1.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_2'))] ile evlenmek istemiyorum!"\n\n"

 agot_engagement_events.0002.desc.beg:0 "belirgin biçimde gergin ama konuşmak için kendini hazırlıyor. [betrothed_1.GetFirstName]'e oturması için işaret ediyorum ve [betrothed_1.GetSheHe] başlıyor.\n\n"[betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], ben... [betrothed_1.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_2'))] hakkında düşünüyordum ve... [betrothed_2.GetHerHim] ile evlenmek istemiyorum."\n\n"

 agot_engagement_events.0002.desc.mid:0 "Şaşırıyorum. "Bunu neden söylüyorsun?"\n\n"

 agot_engagement_events.0002.desc.nothing:0 "[betrothed_1.GetSheHe|U] kıvranıyor ama uzun bir dakika boyunca hiçbir şey söylemiyor."

 agot_engagement_events.0002.desc.one:0 ""Bir tek şey seçmem gerekseydi? "

 agot_engagement_events.0002.desc.first:0 ""Nereden başlasam? "

 agot_engagement_events.0002.desc.second:0 " Ve dahası da var! "

 agot_engagement_events.0002.desc.third:0 ""\n\n"Hepsi bu mu?" diye soruyorum.\n\n"Hayır! "
 agot_engagement_events.0002.desc.lover:0 "Şey... Ben çoktan başka birini seviyorum. [betrothed_1.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_lover'))] ile birbirimiz için yaratıldık.""

 agot_engagement_events.0002.desc.end:0 " [betrothed_1.GetSheHe|U] derin bir nefes alıyor. "Lütfen, [betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )]! Beni buna zorlama! Sevdiğim bir [betrothed_2.Custom('WomanManGirlBoy')] ile evlenmek istiyorum. Bu konuda söz sahibi olmak istiyorum!"

 agot_engagement_events.0002.a:0 "Pekâlâ. Evlenmek zorunda değilsin... şimdilik."

 agot_engagement_events.0002.b:0 "Nişanı iptal edeceğim, ama #italic evleneceksin#!."

 agot_engagement_events.0002.c:0 "Onun yerine [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_lover'))] ile evlenmek için iznim var."

 agot_engagement_events.0002.d:0 "O zaman [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_lover'))] kendi nişanını bitirecek ve onun yerine seninle evlenecek."

 agot_engagement_events.0002.e:0 "O zaman [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('betrothed_lover'))] yeminlerinden vazgeçip onun yerine seninle evlenmek zorunda."

 agot_engagement_events.0002.f:0 "Sen deli misin?! Dediğimi yapacaksın!"

 agot_engagement_events.0002.f.tt:0 "[betrothed_1.GetShortUIName] fermanına kötü tepki verebilir"

 agot_engagement_events.0002.mild.tt:0 "[betrothed_1.GetFirstNameNoTooltip] teselli edilemez durumda"

 agot_engagement_events.0003.opening.harsh:0 "[actor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"

 agot_engagement_events.0003.opening.apologetic:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_engagement_events.0003.betrothed.start:0 "Uzun uzun düşündükten sonra bitirmeye karar verdim: "

 agot_engagement_events.0003.betrothed.torejected:0 "nişanımızı."

 agot_engagement_events.0003.betrothed.toliege:0 "senin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('rejected_betrothed'))] [rejected_betrothed.GetTitledFirstName] ile nişanımı."

 agot_engagement_events.0003.betrothed.end:0 "Sizi temin ederim, bunu [actor.Custom2('LMF_RelationToMeShort', SCOPE.sC('actor_liege'))] [actor_liege.GetTitledFirstName]'in onayı olmadan yapıyorum, ama hayatım artık [actor_liege.GetHersHis] kontrolünde değil. Bu benim kararım ve yalnızca bana ait."

 agot_engagement_events.0003.start:0 "Uzun uzun düşündükten sonra bozmaya karar verdim: "

 agot_engagement_events.0003.torejected:0 "benim [actor.Custom2('LMF_RelationToMeShort', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetTitledFirstName] ile nişanını."

 agot_engagement_events.0003.toliege:0 "benim [actor.Custom2('LMF_RelationToMeShort', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetTitledFirstName] ile senin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('rejected_betrothed'))] [rejected_betrothed.GetTitledFirstName] arasındaki nişanı."

 agot_engagement_events.0003.end:0 "Bu, [actor.Custom2('LMF_RelationToMePossessive', SCOPE.sC('rejecting_betrothed'))] ısrarlı talebi üzerine yapıldı; [rejecting_betrothed.GetHerHis] isteklerine göz yummanın yol açacağı her türlü rahatsızlık için özür dilerim."

 agot_engagement_events.0003.a:0 "[actor.GetSheHe] buna nasıl cüret eder..."

 agot_engagement_events.0006.opening:0 "[betrothed_1.Custom2('AppropriateGreetingNegative', ROOT.Char)]"

 agot_engagement_events.0006.desc:0 "Uzun süredir seninle yüz yüze görüşmeyi, benim [betrothed_1.Custom2('LMF_RelationToMeShort', ROOT.Char )]'in nasıl olur da benim [ROOT.Char.GetWifeHusband] olmayı dileyebileceğini sormayı düşündüm... ama yapamıyorum.\n\nBöyle düşüncesiz bir [ROOT.Char.Custom('InsultNoun')] tarafından yönetilen bir hayat yaşamayı hayal edemediğimden, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten ayrılacağım ve geri dönmeyeceğim. Beni arama."

 agot_engagement_events.0006.a:0 "[betrothed_1.GetSheHe|U] zamanı gelince geri dönecek. Buna eminim."

 agot_engagement_events.0006.b:0 "Öyleyse [betrothed_1.GetSheHe] mirasımdan pay alamayacak!"

 agot_engagement_events.0007.t:0 "Yüreğin İstediği"
 agot_engagement_events.0007.desc.incest:0 ""[betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], benim [betrothed_1.Custom2('LMF_RelationToMeShort', SCOPE.sC('betrothed_2'))] ile evlenmek istemiyorum. Aile içi evlilik..." [betrothed_1.GetHerHis|U] yüzü kararıyor; ailemizin geleneklerini bilse de bunlardan açıkça rahatsız.\n\n"Kanı saf tutar, tatlım," diyorum güven verici bir tonda, ama yalvarışlarımın bir anda kulak ardı edildiğini anlıyorum. [betrothed_1.GetFirstNameNoTooltip] benden yüzünü çeviriyor.\n\n"Senin gibi olmak istemiyorum," diye keskin bir nefesle söylüyor [betrothed_1.GetSheHe]. "İstemiyorum... #bold bunu#!."\n\nSonunda [betrothed_1.GetHerHim]'i yatıştırmayı başarıyorum, ya da öyle sanıyorum... "
 agot_engagement_events.0007.desc.normal:0 ""[betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], neden benim evliliğim seninki gibi olamıyor?" [betrothed_1.GetHerHis|U] yalvarışı bir şimşek gibi içimi sarsıyor. #italic [betrothed_1.GetFirstNameNoTooltip]'i, [betrothed_1.GetHerHis] [betrothed_1.Custom2('LMF_RelationToMeShort', SCOPE.sC('betrothed_2'))] ile evlenmeye zorlamayı nasıl düşünebilirdim?#!\n\n"Bu doğal değil ve... #bold [betrothed_2.GetHerHim]#!'i istemiyorum.\n\n[betrothed_1.GetFirstNameNoTooltip]'e söylediklerini düşüneceğimi söylüyorum... "

 agot_engagement_events.0007.desc.end:0 "ama, sabah olduğunda [betrothed_1.GetSheHe]'nin düğünü kendisinin çoktan iptal ettiğini öğreniyorum. Olan olmuş."

 agot_engagement_events.0007.a:0 "[betrothed_1.GetHerHis] kararını kabul etmekten başka seçeneğim yok."

 agot_engagement_events.0007.b:0 "Öyleyse [betrothed_1.GetSheHe] mirasımdan pay alamayacak!"

 agot_engagement_events.0008.t:0 "Kırılan Bir Hayal"

 agot_engagement_events.0008.desc:0 "[betrothed_1.GetFirstNameNoTooltip] ile tartışmam sürüyor, haykırışlarımız giderek yükseliyor; ta ki [betrothed_1.GetSheHe] sonunda bana dönüp, gözleri öfkeyle dolup [betrothed_1.GetHerHis] ültimatomunu verene dek.\n\n"Gelecekteki eşim konusunda fikrimi hesaba katmayı reddediyorsan, ben de seninkini hesaba katmayı reddediyorum!" [betrothed_1.GetSheHe|U] arkasını dönüp kapıya yürüyor ve yalnızca haykırmak için başını çeviriyor, "[betrothed_2.GetTitledFirstNameNoTooltip] ile evlenmeyeceğim... #bold ne de başka biriyle#!!"\n\nTehdidin boş olduğunu varsayıyorum, ama ertesi sabah benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('betrothed_1'))]'in [rejected_betrothal_owner.GetTitledFirstNameNoTooltip]'e çoktan yazıp nişanı kendisinin iptal ettiğini öğreniyorum. Olan olmuş."

 agot_engagement_events.0008.a:0 "Bu iyiye işaret değil..."

 agot_engagement_events.0008.b:0 "Ne yapacağıma karar verene dek [betrothed_1.GetHerHim]'i zindana at."

 agot_engagement_events.0008.c:0 "[betrothed_1.GetHerHim]'i derhal [ROOT.Char.Custom('FortifiedBuilding')]'den sürgün et!"

 agot_engagement_events.0009.t:0 "Kırık Bir Kalbin Son Atışı"

 agot_engagement_events.0009.desc:0 "[betrothed_1.GetFirstNameNoTooltip] ile tartışmam, yollarımızı ayırdığımızdan beri aklımı kurcalıyor.\n\nO saatlerden beri çalışma odamda oturup, olanları kafamda tekrar tekrar yaşadım. [betrothed_1.GetSheHe] giderken [betrothed_1.GetHerHis] yüzündeki ifade... her şeyi daha iyi halledebilir miydim?\n\nBir dakikadan fazla kestirmiş olamam ki kapımda bir tık sesi duyuluyor. Öne fırlıyorum, [betrothed_1.GetFirstNameNoTooltip]'in içeri girmesini umarak, özürlerimi çoktan hazırlıyorum. Bunun yerine, yüzü tanınmaz biçimde çarpılmış bir muhafızla karşılaşıyorum... #italic Dehşet mi? İnanamama mı??#!\n\nMuhafızın hikâyesi, taşan bir set gibi bir anda dökülüyor. "Sizin [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('betrothed_1'))], [ROOT.Char.GetLadyLord]'um, [betrothed_1.GetSheHe]... hizmetkârlardan biri [betrothed_1.GetHerHim]'i [betrothed_1.GetHerHis] odasında buldu ve..." Muhafızın sesi çatlıyor, ama ne olduğunu çoktan anlıyorum."

 agot_engagement_events.0009.a:0 "Hayır. Hayır hayır hayır #bold hayır#!!"

 agot_engagement_events.0010.opening:0 "[betrothed_1.Custom2('AppropriateGreetingNegative', ROOT.Char)]"

 agot_engagement_events.0010.start:0 "Bunu okuduğunda, [betrothed_1.Custom2('spoken_address_by_familiarity', ROOT.Char )], ben çoktan [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]'ten ayrılmış olacağım.\n\n"

 agot_engagement_events.0010.leave:0 "Nişan hayallerin — hayatımı kontrol etme umutların — beni yalnızca daha da uzaklaştırdı. Senin gibi düşüncesiz bir [ROOT.Char.Custom('InsultNoun')] ile yaşamaya devam edebileceğimi hayal edemiyorum."

 agot_engagement_events.0010.wall:0 "Beni isteğim dışında nişanlama umutların, kararımı benim yerime verdi: Gece Nöbeti'ne katılacağım; bir para birimi gibi muamele görmeyeceğim bir kardeşliğe."

 agot_engagement_events.0010.maester:0 "Kaderimi kontrol edip beni evliliğe zorlamayı umduysan, kararlılığımın ve becerikliliğimin sınırını yanlış ölçtün. Belki Hisar, bunlara daha iyi bir kullanım alanı bulur."

 agot_engagement_events.0010.septon:0 "Beni, isteklerime ve Bir Olan Yedili'nin isteklerine karşı, sığır gibi takas ederdin. Öyleyse, senin seçimlerin benimkileri belirledi: İnanca katılacağım."

 agot_engagement_events.0010.a.wall:0 "[betrothed_1.GetSheHe|U] evlenmek yerine siyahı kuşanmayı seçti..."

 agot_engagement_events.0010.a.maester:0 "Benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('betrothed_1'))] üstat olacak..."

 agot_engagement_events.0010.a.septon:0 "Benim [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('betrothed_1'))] din adamlarına katıldı..."

 agot_engagement_events.0010.a.leave:0 "[betrothed_1.GetSheHe] ne istiyorsa onu yapsın, [betrothed_1.GetSheHe] buraya dönmek zorunda değil. Asla!"

 agot_engagement_events.0010.b.leave:0 "[betrothed_1.GetSheHe|U] zamanı gelince geri dönecek. Buna eminim."

 agot_engagement_events.0021.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_engagement_events.0021.start:0 "Bunu uzun uzun düşündüm, ama "

 agot_engagement_events.0021.self.ruler:0 "[actor.GetTitleAsNameNoTooltip] konumumu, "

 agot_engagement_events.0021.self.heir:0 "geleceğin varisi konumumu, "

 agot_engagement_events.0021.self.default:0 "gelecekteki konumumu, "

 agot_engagement_events.0021.other.ruler:0 "[actor.Custom2('LMF_RelationToMePossessive', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetTitleAsNameNoTooltip] konumunu, "

 agot_engagement_events.0021.other.heir:0 "[actor.Custom2('LMF_RelationToMePossessive', SCOPE.sC('rejecting_betrothed'))] geleceğin varisi konumunu, "

 agot_engagement_events.0021.other.default:0 "[actor.Custom2('LMF_RelationToMePossessive', SCOPE.sC('rejecting_betrothed'))] gelecekteki konumunu, "

 agot_engagement_events.0021.mid:0 "hanedanımın geleceğini güvence altına almak için harekete geçmeliyim.\n\n"

 agot_engagement_events.0021.self.withtarget:0 "Ya nişanımız "

 agot_engagement_events.0021.self.withother:0 "Ya [rejected_betrothed.GetTitledFirstName] ile nişanım "

 agot_engagement_events.0021.other.withtarget:0 "Ya senin [rejecting_betrothed.GetTitledFirstName] ile nişanın "

 agot_engagement_events.0021.other.withother:0 "Ya [rejecting_betrothed.GetTitledFirstNamePossessive] [rejected_betrothed.GetTitledFirstName] ile nişanı "

 agot_engagement_events.0021.matrilineal:0 "ana soylu yapılmalı "

 agot_engagement_events.0021.patrilineal:0 "baba soylu yapılmalı "

 agot_engagement_events.0021.end:0 "yoksa korkarım şartlarından caymaktan başka seçeneğim kalmayacak."

 agot_engagement_events.0021.a:0 "Pekâlâ, şartlarını kabul ediyorum."

 agot_engagement_events.0021.a.matrilineal.tt:0 "[rejecting_betrothed.GetShortUINamePossessive|U] [rejected_betrothed.GetShortUIName] ile nişanı #EMP ana soylu#! hale gelecek"

 agot_engagement_events.0021.a.patrilineal.tt:0 "[rejecting_betrothed.GetShortUINamePossessive|U] [rejected_betrothed.GetShortUIName] ile nişanı #EMP baba soylu#! hale gelecek"

