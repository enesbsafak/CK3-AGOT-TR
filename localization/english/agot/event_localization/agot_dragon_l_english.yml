 agot_dragon.1007.t:0 "Ziyan Olan Hasat"

 agot_dragon.1007.desc:0 "Her söylenene bakılırsa plan işe yaradı; ne var ki ben #bold ejderhasız#! kaldım.\n\nOrtalıkta, [dragon_one.Custom('GetDragonColorFull')] canavar [dragon_one.GetNameNicknamed]'in, ejderha boynuzuna yüklediğim tüm güce meydan okuyarak [true_binder.GetTitledFirstName]'e gittiğine dair söylentiler dolaşıyor! Yoksa...\n\nVe işin kötüsü, [dragon_keeper.GetTitledFirstName]'de #bold benim#! boynuzum var!"

 agot_dragon.1007.a:0 "O #bold benim #! ejderhamdı!"

 agot_dragon.1008.t:0 "Koparılan Yabani Ot"

 agot_dragon.1008.desc:0 "Adaylar şanslarını denemeye hazır şekilde kendilerini tanıtıyor. Sayılarını sayarken birinin eksik olduğunu ancak çok geç fark ediyorum. Salonu çınlatan, ruhu yakan o ses yankılanmadan önce başlarına hangi korkunç ya da sıradan kaderin geldiğini düşünmeye yalnızca bir anım kalıyor. Bin ruhun çığlığı kemiklerimi küle çeviriyor — ya da en azından öyle hissettiriyor.\n\nArdından gelen sessizlikte büyük bir kafa karışıklığı var; [candidate_one.GetFirstName] haykırıp [false_seed.GetFirstName]'in tüyler ürperten görüntüsünü işaret edince kafa karışıklığı şoka dönüşüyor. Gözlerinden kan sızan ve neredeyse fark edilmez biçimde soluyan [false_seed.GetFirstNameNoTooltip], yanıp kabarmış ciğerleriyle nefes almak için çabalıyor.\n\n[false_seed.GetSheHe]'nin tutunduğu ejderha boynuzunun korosuna bir ses daha eklemesine yalnızca bir an var. Bir anlık sessizlik geçiyor, sonra bir an daha. Ejderhalardan çığlık yükselmiyor, uzakta kanat çırpışı yok. Adaylar, Ekim'e devam edilip edilmeyeceği konusunda yol göstermem için bana bakıyor."

 agot_dragon.1008.a:0 "Bu hiçbir şeyi değiştirmiyor... Devam edin!"

 agot_dragon.1008.b:0 "Bu #italic sahte tohumu#! araştırmalıyım."

 agot_dragon.1008.b_tt:0 "$agot_dragon.1001.b_tt$"

 agot_dragon.1009.t:0 "Kuraklık"

 agot_dragon.1009.desc:0 "[false_seed.GetFirstNamePossessive] [dragon_keeper.GetTitledFirstName] sarayına sızışı hakkında cesaret verici haberler almıştım; şimdiyse başarısızlık haberleri duyuyorum. Boynuzu çaldıktan sonra [false_seed.GetFirstNameNoTooltip]'in içeriden yandığı söyleniyor.\n\nHer anlatılana göre dehşet verici bir manzara; ama doğruysa önemli bir soru doğuruyor..."

 agot_dragon.1009.a:0 "#bold Ejderham#! nerede?"

 agot_dragon.1010.t:0 "Bir Ejderha Tohumunun Yükselişi"

 agot_dragon.1010.desc:0 "Kısa süre önce sarayıma katılan bir ejderha tohumu olan [recipient.GetName], ejderha çukurundaki yiğitliği için ödüllendirilmeli.\n\nNe var ki [recipient.GetHerHis] piç konumu işleri karmaşıklaştırdı. Bu yüzden [recipient.GetSheHe]'nin tam olarak nasıl ödüllendirilmesi gerektiğine daha yakından bakmalıyım."

 agot_dragon.1010.a:0 "Onları meşru ilan edeceğim."

 agot_dragon.1010.b:0 "Yeni bir [house|E] kurmalarına izin vereceğim."

 agot_dragon.1010.b_tt:0 "[recipient.GetName] yeni bir [bastard_branch|E] kuracak"

 agot_dragon.1010.c:0 "[recipient.GetHerHis|U] piçlik durumu fazla tartışmalı; başka bir şey teklif et."
