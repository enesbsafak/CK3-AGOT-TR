l_english:

 bright_text:0 "#high "

 dragon_homed_separate_from_rider:0 "Ejderha, binicisinden uzakta bir ejderha çukurunda"

 agot_dragon.0008.t:0 "Bir Terör Aracı"

 agot_dragon.0008.desc_intro:0 "[ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.GetName]'in binicisi olarak konumum düşünülürse, [actor.GetTitledFirstName]'den bir haber almam belki de şaşırtıcı değil; ama asıl şaşırtıcı olan içeriği. [actor.GetSheHe|U], savaşlarında sadece çarpışmamı değil, gittiğim her yerde etkin bir terör kampanyası yürütmemi istiyor — yalnızca düşmanlarımızın ordularını değil, topraklarını, tarlalarını ve insanlarını da yakmamı.\n\n"

 agot_dragon.0008.desc_keen:0 "Böyle bir strateji düşmanlarımızı önümüzden kaçıracak ve topraklarını bir nesil boyunca yaralayacak olsa da, insanlar #X yargılayacak#! beni — hem krallık hem de kendi Hanem içinde.\n\n"

 agot_dragon.0008.desc_not_keen:0 "Böyle bir strateji beni yüzlerce, belki binlerce kişinin katili yapacak. Bununla yaşayabilir miyim? Başkaları da #X yargılayacak#! beni — hem krallık çapında hem de kendi Hanem içinde.\n\n"

 agot_dragon.0008.desc_finish:0 "Bu tür bir eylem, hükümdarım ve komutanım tarafından bile zorlanamaz. Soru bu yüzden bana düşüyor: Bu isteği kabul mü edeyim, yoksa red mi?"

 agot_dragon.0008.a:0 "Senin isteğinle, yerine getirilecek."

 agot_dragon.0008.a.f:0 "[actor.GetTitledFirstNameNoTooltip] adına bir terör kampanyası yürüteceksiniz."

 agot_dragon.0008.b:0 "Senin için savaşırım ama cinayet işlemem."

 agot_dragon.0008.b.f:0 "[actor.GetTitledFirstNameNoTooltip]'i geri çevireceksiniz."

 agot_dragon.0008.accept.t:0 "Terör Kampanyası Başladı!"

 agot_dragon.0008.accept.desc:0 "[recipient.GetFirstName] isteğinizi kabul etti ve düşmanlarınızın yakabildiği topraklarını yakıyor."

 agot_dragon.0008.refuse.t:0 "Terör Kampanyası Reddedildi!"

 agot_dragon.0008.refuse.desc:0 "[recipient.GetFirstName] sizin terör aracınız olmayı reddetti."

 agot_dragon.0009.t:0 "Yakmayı Sonlandırmak"

 agot_dragon.0009.desc_intro:0 "[actor.GetTitledFirstName]'den bir haber geldi: Fırsat buldukça ejderham [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.GetName] ile düşmanlarımıza karşı yürüttüğüm terör kampanyasını durdurmam isteniyor.\n\n"

 agot_dragon.0009.desc_keen:0 "[ROOT.Char.MakeScope.Var('terror_campaign_instructor').GetCharacter.GetTitledFirstName]'in emirlerini aldığım günden beri heves ve şevkle yerine getiriyordum; şimdiyse benden bu görevi bırakmam mı isteniyor?\n\n"

 agot_dragon.0009.desc_not_keen:0 "[ROOT.Char.MakeScope.Var('terror_campaign_instructor').GetCharacter.GetTitledFirstName]'in emirlerini aldığım günden beri görevim olduğu üzere sadakatle yerine getiriyordum; şimdiyse benden bu göreve son vermem isteniyor.\n\n"

 agot_dragon.0009.desc_finish:0 "Ne var ki [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.GetName] benim, [actor.GetFirstNamePossessive] değil. Durdurmak da... devam etmek de bana kalmış."

 agot_dragon.0009.a:0 "Bu teröre son vereceğiz."

 agot_dragon.0009.b:0 "Hepsi #X YANANA#! kadar durmayacağız!"

 agot_dragon.0009.b.f:0 "Bu terör kampanyasını [actor.GetTitledFirstNameNoTooltip] adına sürdürmeye devam edeceksiniz."

 agot_dragon.0009.accept.t:0 "Terör Kampanyası Sona Erdi!"

 agot_dragon.0009.accept.desc:0 "[recipient.GetFirstName] isteğimi kabul etti ve artık düşmanlarımın topraklarını yakmayacak."

 agot_dragon.0009.refuse.t:0 "Terör Kampanyası Sürüyor!"

 agot_dragon.0009.refuse.desc:0 "[recipient.GetFirstName] yıkımı durdurmayı reddetti. [recipient.GetHerHim]'i hapse atabilirsiniz; ama böyle bir şeyi bir ejderha binicisine denemek kendi içinde riskler barındırır..."

 agot_dragon.0010.t:0 "Açık Gökyüzünün Özgürlüğü"

 agot_dragon.0010.night:0 "Ay, obsidiyen rengi gökyüzünde alçakta asılı duruyor, gümüş ışıltısını aşağıdaki dünyaya saçıyor. [ridden_dragon.GetName] uykulu gözlerle bana bakıyor; [ridden_dragon.Custom('GetDragonSheHe')] yaklaşmamın bir akşam gezintisi demek olduğunu anlayınca burun delikleri hevesle genişliyor.\n\n[ridden_dragon.Custom('GetDragonHerHis')|U] kanatları parıldayan yıldızlara karşı ritmik biçimde çırpıyor; güç ve zarafetin bir senfonisi gibi bizi gittikçe daha yükseğe taşıyor. Yükseldikçe dünya altımızda dönüşüyor. Aşağıdaki ormanlar gölge ve gümüşün yamalı bohçasına dönüşüyor, aralarından kıvrılan nehirler parıldayan cevher damarları gibi akıyor.\n\nRüzgâr çevremizde kırbaç gibi esiyor; [ridden_dragon.GetNamePossessiveNoTooltip] kanatlarının vurma ritminin altında akan bir kükreme. Ay ışığının kucaklayışında, dünyanın şarkısını içimde hissediyorum — ben bir bestekârım ve [ridden_dragon.GetNamePossessiveNoTooltip] uçuşu da benim melodim."

 agot_dragon.0010.sili:0 "[ridden_dragon.GetName]'in eyerine çıkıyorum, bacaklarımı savurup otururken eyerimin kayışlarını sıkarken [ridden_dragon.Custom('GetDragonHerHis')] güçlü kaslarının altımda gerildiğini hissediyorum. Bir komut ve bir hamleyle [ridden_dragon.Custom('GetDragonHerHim')]'in yukarı fırladığını hissediyorum; saniyeler içinde açık gökyüzünde süzülüyorum.\n\nBulutları yararken dünyanın ağırlığının omuzlarımdan düştüğünü hissediyorum... Geri dönmem gerektiğini biliyorum; ama ejderha uçuşunun gerçek coşkusunu tatmadan değil. Dizginleri bırakıyorum ve [ridden_dragon.GetNameNoTooltip], [ridden_dragon.Custom('GetDragonHerHis')] yeni kazanılmış özgürlüğüne sevinçle çığlık atarak kanatlarını açıp yukarı dönüyor. Dünya aşağıda beklerken, bir anlığına da olsa uçsuz bucaksız gökyüzünde ağırlıksız süzülüyoruz."

 agot_dragon.0010.lord:0 "[ridden_dragon.GetName] havalanıyor ve [ridden_dragon.Custom('GetDragonHerHis')] kanatlarının birkaç çırpışında ikimiz de gökyüzüne yaklaşıyoruz. Unvanımın ağır yükünü arkamda bırakıyorum. Her şeyin üzerine yükselmek için bir anlığına tüm sorumluluklarımı salıyorum — rüzgârın okşayışını ve güneşin öpücüğünü hissetmek için.\n\nKendimi tamamen bırakıp ana odaklanabildiğim anlar enderdir; bu da uçuşu daha da coşkulu kılıyor. [ridden_dragon.GetNameNoTooltip] dönmeye başlıyor ve birkaç dakikalık rahatlamanın ardından [ridden_dragon.Custom('GetDragonHerHim')]'e tekrar ve tekrar, #italic ve daha da#! yükselmesini emrediyorum.\n\nBulutların en yüksek zirvelerine ulaşıyoruz. Gözlerimi kapatıp kollarımı sonuna kadar açıyorum ve her şeyden uzak bu yerde, sanki #italic yeni bir gençlik#! gibi. [ridden_dragon.GetNamePossessiveNoTooltip] kükreyişi, [ridden_dragon.Custom('GetDragonSheHe')]'nin de paylaştığımız bu özel anlardan memnun olduğunu anlamamı sağlıyor."

 agot_dragon.0010.greeny:0 "[ridden_dragon.GetName] eyerine tırmanırken beni sabırsızlıkla mırıldıyor. [ridden_dragon.Custom('GetDragonHerHim')] ile kurduğum bağ, başka hiçbir yerde hissetmediğim bir şey; sözsüz bir komutla havalanıyoruz.\n\nDizginleri çekip [ridden_dragon.Custom('GetDragonHerHim')]'i #italic daha da#! yükseğe sürerken [ridden_dragon.GetNameNoTooltip] onaylayan bir kükreme salıyor. Sanki tanrılar bizi yukarı çekiyormuşçasına yükseliyor, sonra sessizliğe gömülüyoruz — tek ses, kanatların üzerinden geçen rüzgâr.\n\nBurada, bulutların üstünde, yüzümde güneşle özgürüm. Görevden özgür, kaygıdan özgür ve #italic tüm dünyevi yüklerden#! özgür. Her ejderha binicisinin hissettiğini bildiğim şeyi hissediyorum: bilinen dünyanın ötesine, ufku sonu gelmeden kovalamaya devam etme arzusu."

 agot_dragon.0010.troof:0 "Gökyüzü açık ve güneş parlak; bugün [ridden_dragon.GetName] ile sırtında vakit geçirmek için mükemmel bir gün. Eyerimi önceden hazırlamaları için ejderha bakıcılarını çağırdım ve en rahat binicilik kıyafetlerimi giydim.\n\nYaklaştığımda [ridden_dragon.Custom('GetDragonSheHe')] beni karşılamak için [ridden_dragon.Custom('GetDragonHerHis')] boynunu eğiyor. [ridden_dragon.Custom('GetDragonHerHis')] görkemine hayranlık duyarak elimi [ridden_dragon.Custom('GetDragonHerHis')] [ridden_dragon.Custom('GetDragonColorFull')] pullarının üzerinde kısa bir an gezdirmek için uzanıyor, sonra eyere çıkıp yerleşiyorum. Bacağımı eyerin üzerinden geçirip yerleşirken, gergin hislerimi uzun ve derin bir nefesle dışarı salıyorum.\n\nUçuşa hazırlanmak için basışımın sağlam olduğunu kontrol ediyor ve [ridden_dragon.Custom('GetDragonHerHis')] eyerinin tutamaklarını sıkıca kavrıyorum. Farkına varmadan toprakların çok üzerindeyiz; gökyüzünü Valyrian çeliği gibi yarıyoruz. Alttaki güçlü kuvveti ve üstteki rüzgârı hissederek karanın ve denizin ihtişamını içime çekiyorum. Ne görülmeye değer bir manzara!"

 agot_dragon.0010.tukha:0 "Bulutlara dokunmak için elimi uzatıyorum; çiy damlaları birleşiyor. Damlaların derinliği, ufukta yükselen fırtına gibi zihnimde beliriyor. Sonra şu soru çarpıyor aklıma: Bu duyguyu kaç kişi tatmıştır? Tüm tarih boyunca sayıları evimdeki tek bir salona sığar mıydı? Bugün yaşayan biri bunu biliyor mu, yoksa bu deneyimde yalnız mıyım?\n\n[ridden_dragon.GetName] düşüncelerimin farkındaymış gibi [ridden_dragon.Custom('GetDragonHerHis')] kanadını bulutun içine daldırıyor ve [ridden_dragon.Custom('GetDragonSheHe')]'nin de artık anı paylaştığını kabul etmek zorunda kalıyorum. Yanılıyor olabilirim, ama bu itirafın [ridden_dragon.GetNameNoTooltip]'e neşe getirdiğini hissediyorum. Bunda da bulunacak bir teselli var herhalde; aramızdaki bağın derinliğinin bir hatırlatıcısı."

 agot_dragon.0010.aemmly:0 "[ridden_dragon.GetName] bulutlara doğru yükselirken Kralın Şehri altımda küçülüyor. [ridden_dragon.Custom('GetDragonHerHis')|U] heyecanı manyetik; ne var ki [ridden_dragon.Custom('GetDragonHerHis')] kanatlarının atışı bir kalp atışı kadar huzur verici. Karasu Koyu'nun karşısına bakıp Driftmark ve Dragonstone'u seçiyorum; yüz yıl boyunca Valyria'nın son kalıntılarını taşıyan bu adalar, sokaktaki iri parke taşları boyutunda görünüyor.\n\nYakında hepsi geride kalıyor. [ridden_dragon.GetNameNoTooltip] bulutları yarıyor ve bir anda altımdaki kaotik, dört bir yana yayılan dünya yok oluyor. Nazik bir esinti tenime sürtünüyor ve üzerime uhrevi bir huzur çöküyor; gülümsemekten kendimi alamıyorum. [ridden_dragon.GetNameNoTooltip] neşeyle mırıldanıyor, sanki ait olduğu yerin burası olduğunu ilan eder gibi. Anın tadını çıkarıyoruz, ama sonsuza dek süremez."

 agot_dragon.0010.harrenhal:0 "[ridden_dragon.GetNamePossessive] eyeri vardığımda çoktan hazırdı. Ne iyi oldu; bu lanetli şatodan uzakta temiz bir nefes almak için sabırsızlanıyorum. Bu kasvetli odalar ve bu rahatsız edici aura kısa sürede ağır geliyor.\n\nBulutlara yaklaştıkça bu garip hissi atamıyorum, sanki bir şey beni izliyordu. Arkama kısa bir bakış atıyorum, adeta Harren'in hayaletinin beni takip etmediğinden emin olmak ister gibi; bu yükseklikte bile kalesi göz korkutucu görünüyor. Böylesine bir devasalık... Aşırılıklarından kurtulmak için bulutları delene dek beklemeliyim.\n\nBir bulut örtüsü, Harrenhal'ın baskısına karşı siperim oluyor; devasa boyutu, açık gökyüzünün sonsuz özgürlüğünün yanında hiç kalıyor. Bu lanetli şatonun bana yaşattığı onca dehşet bile beni [ridden_dragon.GetNameNoTooltip]'e bağlayan bağı zayıflatamıyor!"

 agot_dragon.0010.oldtown:0 "Hightower adının hakkını veriyor. [ridden_dragon.GetName]'in [ridden_dragon.Custom('GetDragonHerHis')] kanatlarıyla zirveyi aşması bir süre alıyor. Orada çevresinde dönüyoruz; sanki [ridden_dragon.GetNameNoTooltip] bir mumun alevine kapılan sıradan bir güveye dönüşmüş gibi.\n\nEjderhaların ete bürünmüş ateş olduğu ve onların doğuştan gelen üstünlüğünden kimsenin şüphe duymadığı doğru olabilir... o hâlde belki de çevresindeki her şeyin üzerinde yükselen bu devasa işaret, [ridden_dragon.Custom('GetDragonHerHim')]'e tanıdık gelen bir şeyi çağrıştırıyor.\n\nİkisi de birer simge. Biri insanın neler yaratabileceğinin; diğeri doğanın neler yaratabileceğinin. Saygı ve korku uyandıran iki varlık. Böylesiyle bir bağ kurabildiğimi bilmek beni #italic son derece#! memnun ediyor."

 agot_dragon.0010.coastal:0 "Ellerim [ridden_dragon.GetName]'in üzerinde, başım [ridden_dragon.Custom('GetDragonHerHim')]'e dayalıyken [ridden_dragon.Custom('GetDragonHerHis')] bedeninde akan yaşamı hissediyorum — bağımızla paylaşılan bir yaşam. [ridden_dragon.Custom('GetDragonHerHim')]'e gülümsüyorum ve [ridden_dragon.Custom('GetDragonSheHe')]'nin de ejderhalara özgü o dille bana gülümsediğine yemin edebilirim.\n\nVakit kaybetmeden havalanıyoruz. Bulutların yanında süzülüp dönerek gökyüzünün uçsuz bucaksızlığında kaybolmak kolayken, [ridden_dragon.GetNameNoTooltip] beni denize götürüyor. Bir başka uçsuz bucaksızlık, tıpkı onunki kadar görkemli.\n\n[ridden_dragon.Custom('GetDragonHerHis')|U] hızı öyle ki suyun yüzeyinde dalgacıklar oluşturuyor. Geçerken kaçışan balıklar dağılıyor; daha oyuncu olan yunuslarsa yanımızda yüzüyor. [ridden_dragon.Custom('GetDragonHerHis')] kanatlarının ani ve güçlü bir çırpışıyla [ridden_dragon.GetNameNoTooltip] yükseliyor; en yaramaz yunusun bile bizi takip edemeyeceği bir yere."

 agot_dragon.0010.cloudforest:0 "[ridden_dragon.GetName] kanatlarını açarak [ridden_dragon.Custom('GetDragonSheHe')]'nin uçmaya hazır olduğunu belirtiyor. [ridden_dragon.Custom('GetDragonHerHim')]'e birkaç şefkatli onay okşaması yapıyorum ve [ridden_dragon.Custom('GetDragonSheHe')] gökyüzüne fırlıyor.\n\nKısa süre sonra, görüşün yoğun sis kütleleriyle engellendiği bulut ormanlarındayız — ama bugün sis özellikle yoğun; sanki #italic bir şey#! uçmak yerine geri dönmemizi salık veriyor. Burada, yalnızken, aramızdaki bağı hiçbir müdahale olmadan hissedebiliyorum. [ridden_dragon.GetNameNoTooltip] bağımız sayesinde hayal kırıklığımı sezebiliyor ve sanki beni ondan kurtarmak için şiddetle ateşini salıveriyor.\n\nBu sisli kütleler su damlalarından başka bir şey değil ve ateş suyun önünde eğilemez — #attacker_color ejderha ateşi değil#!. Çevredeki sisin tümü dağılıyor... daha doğrusu, akkor hâldeki jetle süpürülüyor. Bir ejderha için bu masum görünen jest, herkese bu ilahi yaratıkların gücünü hatırlatıyor: #italic Doğa bile onların iradesine boyun eğmek zorunda.#!"

 agot_dragon.0010.frozenflats:0 "[ridden_dragon.GetName] ve ben bir süredir havadayız; [ridden_dragon.Custom('GetDragonSheHe')] buzlu zemine yaklaşan dalışlara başladığında daha yeni havalanmıştık. [ridden_dragon.Custom('GetDragonHerHis')] kanatlarının güçlü çırpışları [ridden_dragon.Custom('GetDragonHerHim')]'in düşüşünü yavaşlatmasını sağladı ve pençeli ayaklarını buzun üzerine yerleştirdi. O anda [ridden_dragon.Custom('GetDragonSheHe')] kaymaya başladı.\n\nBunun [ridden_dragon.Custom('GetDragonHerHim')]'i heyecanlandırmasını beklemezdim, ama gerçekten heyecanlandırıyor! Farkına varmadan bu ejderha gezintisi bir kayma seansına dönüştü. Ben de buzun tadını çıkarmak için eyerimden kayıyorum. Elbette çocukça bir eğlence; ama [ridden_dragon.GetNameNoTooltip] ile paylaşıldığında beni rahatsız etmiyor. [ridden_dragon.Custom('GetDragonSheHe')] yeterince eğlenince, [ridden_dragon.Custom('GetDragonHerHis')] dengesinden emin olmak için pençelerini buza sıkıca geçiriyor.\n\nEyere dönmek üzereyken [ridden_dragon.Custom('GetDragonHerHim')]'in [ridden_dragon.Custom('GetDragonHerHis')] kafasını eğip buzun üzerindeki yansımasına baktığını fark ediyorum. Ben de aynısını yapıyorum; ama kendi yüzümü değil, yalnızca [ridden_dragon.GetNameNoTooltip]'i görüyorum."

 agot_dragon.0010.urban1a:0 "Fazla laf kalabalığı yapmadan [ridden_dragon.GetName] beni şehrin çok yukarısına taşıyor. Bu gezintide, [ridden_dragon.Custom('GetDragonSheHe')]'nin gökyüzünün uçsuz bucaksızlığında kaybolmak istemediğini hissediyorum — hayır, biliyorum; biliyorum çünkü #italic hissediyorum#!. [ridden_dragon.Custom('GetDragonSheHe')]'nin istediği şey şehrin üzerinden uçmak ve böylece yeri ile sakinlerine hükmetmek. Tüm ejderhaların içinde, çevrelerindekilere hükmetmeye dair bu derin içgüdü yatar — kimi zaman gömülü.\n\n"

 agot_dragon.0010.urban1b:0 "Fazla laf kalabalığı yapmadan [ridden_dragon.GetName] bizi gökyüzüne fırlatıyor. Aşağıda şehir hayatla kaynıyor. Tüm bu insanlar, meşguliyetlerine kaptırmış sokaklarda akıp gidiyor — bir ejderhanın damarlarında kaynayan kan gibi. [ridden_dragon.Custom('GetDragonHerHim')]'i şehre o kadar yakın kalmaya iten şey kuşkusuz bu heyecandı; halkın düşünceli yüzlerini neredeyse net biçimde seçebiliyordum.\n\n"

 agot_dragon.0010.urban2a:0 "[ridden_dragon.Custom('GetDragonHerHim')]'e kaç kez binsem de, geçerken burnunu büken küçük insanlar hep oluyor. Çünkü sıradan insanların bizim yerimize geçebilmesinin tek yolu hayal gücü. Onlar ejderha binicilerinin sahip olduğu ayrıcalığa sahip değiller.\n\n"

 agot_dragon.0010.urban2b:0 "Küçük insanlar üzerlerinden uçan böyle bir yaratığı görmezden gelemez. Hepsi gözlerini gökyüzüne dikiyor... Bu gösteriyi kaç kez görseler de, sıradan insanlar bir ejderha binicisi olma ayrıcalığına asla erişemeyeceklerini biliyor.\n\n"

 agot_dragon.0010.urban3a:0 "Bu köylüler bu gücü, bu ihtişamı asla bilemeyecek. O, benim ve benim gibilerin hakkı. Ejderha binicileri küçük insanlara acımamalı — hayır, #italic acıyamaz#!. Bu, [ridden_dragon.GetNameNoTooltip]'in #italic bana#! bir armağanı."

 agot_dragon.0010.urban3b:0 "Böyle bir yaratığa binmenin nasıl bir his olduğunu asla bilemeyecek, beni [ridden_dragon.Custom('GetDragonHerHim')]'e bağlayan bağı asla anlayamayacaklar. Bu konuda onlara acıyorum; çünkü şu anda kendimi bu kadar dinç hissediyorsam, bu gerçekten de [ridden_dragon.GetNameNoTooltip] sayesinde."

 agot_dragon.0010.urban3c:0 "Sonsuza dek hep aynı kalacaklar... tüccarlar, demirciler, dokumacılar, kasaplar, neyse. İşe yarar olsalar da onlara mutlak özgürlüğün kapılarını asla açmayacak işler. Bu özgürlüğü yalnızca bir ejderha yaşayabilir ve [ridden_dragon.GetNameNoTooltip] ile kurulan bağı bu kadar kıymetli yapan da budur."

 agot_dragon.0010.a:0 "Rüzgâr! Gökyüzü! Ne özgürlük!"

 agot_dragon.0010.a.arrogant:0 "Burada, yukarıda insanların karşısında bir tanrı gibiyim!"

 agot_dragon.0010.a.f:0 "Gökyüzündeki vaktinizin tadını çıkaracaksınız."

 agot_dragon.0010.b:0 "Yolu göster [ridden_dragon.GetNameNoTooltip]!"

 agot_dragon.0010.b.f:0 "[ridden_dragon.GetNameNoTooltip]'in yolu göstermesine izin vereceksiniz."

 agot_dragon.0010.c:0 "Hava manevralarımızı çalışma zamanı."

 agot_dragon.0010.c.f:0 "[ridden_dragon.GetNameNoTooltip] ile savaş hareketlerinizi çalışacaksınız."

 agot_dragon.0011.t:0 "Ulaşılmaz Gökyüzü"

 agot_dragon.0011.desc:0 "[ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.GetName]'in eyerine çıkıyorum, bacaklarımı savurup otururken eyerimin kayışlarını sıkarken [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.Custom('GetDragonHerHis')] güçlü kaslarının altımda gerildiğini hissediyorum. Lanet... kayışlar, bağlanmıyorlar...#S Ahhh! #!\n\nBir şaplakla kendimi [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.GetFirstNameNoTooltip]'in yanına düşmüş buluyorum; bulanık görüşüm, [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.Custom('GetDragonHerHim')]'den gelen şaşkın bakışı kaydediyor. Ayağa kalkarken başımdaki zonklamayla birlikte maiyetimin bastırılmış kahkahaları çınlıyor. Belki de bugün ejderhaya binmek en iyi fikir değil."

 agot_dragon.0011.a:0 "Ah, olsun, belki bir dahaki sefere!"

 agot_dragon.0011.a.f:0 "Sarhoş hâliniz bugün ejderhaya binememenize yol açtı."

 agot_dragon.0012.t:0 "Sarhoş Bir Uçuş Kazası"

 agot_dragon.0012.desc:0 "[ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.GetName]'in eyerine tedirgin bir şekilde çıkıyorum; neredeyse basamağı kaçırıyorum, sonra bacaklarımı savurup [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.Custom('GetDragonHerHis')] sırtına geçmeyi başarıyorum. Peltek bir komut ve bir hamleyle [ROOT.Char.MakeScope.Var('current_dragon').GetCharacter.Custom('GetDragonHerHim')]'in yukarı fırladığını hissediyorum; saniyeler içinde açık gökyüzünde süzülüyorum.\n\nRüzgârın yüzümden geçtiğini hissediyorum; his, uyuşmuş tenime yayılırken gözlerimi kapatıyorum. Ansızın dengemin kaydığını hissediyorum — eyere uzanıyorum, ama savrulan parmaklarım tutunamıyor! Sorun değil, kayışlar beni yakalar elbet...\n\nYakalamıyorlar, bağlamayı unutmuşum."

 agot_dragon.0012.a:0 "#S Oh fuuuuuuuuuuuu—#!"

 agot_dragon.0012.a.f:0 "Sarhoşluğunuz bugün sonunuzu hazırladı."

 agot_dragon.0013.t:0 "Soyulan Derinin Korkunç Rüyaları"

 agot_dragon.0013.desc:0 "Yüzler. Uçup geçerken bana doğru çığlık atan yüzler; altımızda yanarken derileri ejderhamın kanatlarının izinde sıyrılıp düşüyor. Daha hızlı uçmaya çalışıyoruz, uçarken yakıyoruz; ama kemikler ileri doğru sendeleyerek yürümeye devam ediyor. Erkekler, kadınlar, çocuklar. Bize doğru çığlık atıyorlar. Yakalıyorlar. Bana doğru tırnaklarını geçiriyorlar. Durmam için yalvarıyorlar. Tutunuyorlar. Uzanıyorlar. Beni aşağı çekiyorlar.\n\nSoğuk terler içinde uyanıyorum, kalbim göğsümde güm güm atıyor. Yüzleri kafamdan atamıyorum. Çığlıkları kulaklarımdan silemiyorum. Yanan et kokusunu burnumdan söküp atamıyorum. Alevlerin sıcağını tenimden söküp atamıyorum.\n\n#S Suçluluğu kalbimden atamıyorum.#!"

 agot_dragon.0013.a:0 "Ben böyle dehşetleri neden yaptım ki!?"

 agot_dragon.0013.b:0 "Ben... içkide teselli bulurum... belki..."

 agot_dragon.0013.c:0 "Ben... geneleve gitmeliyim."

 agot_dragon.0013.d:0 "Bugün kimsenin yüzüne bakamam!"

 agot_dragon.0013.e:0 "Acılarını kendi acım olarak üstlenmeliyim!"

 agot_dragon.0013.f:0 "Yeni kıyafetler! Bunlar... lekelenmiş..."

 agot_dragon.0013.f.f:0 "Terör estirdiğiniz kıyafetlerin yerine yeni kıyafetler satın alacaksınız."

 agot_dragon.0013.g:0 "Rüyalarımda yüzlerle uğraşmaya alışığım..."

 agot_dragon.0013.h:0 "Hizmetkârlar! Bugün çifte kahvaltı istiyorum!"

 agot_dragon.0013.i:0 "Ben... bugün yemek yiyebileceğimi sanmıyorum."

 agot_dragon.0013.j:0 "Düşüncelerimi yazayım, belki yardımcı olur."

 agot_dragon.0013.k:0 "Evet, bugün sabah koşum biraz daha uzun olacak."

 agot_dragon.0013.l:0 "Yoksullara bağış yapacağım, belki bu suçluluğumu hafifletir."

 agot_dragon.0013.m:0 "KÖTÜ RÜYA KORKUNÇ! KÖTÜ KÖTÜ RÜYA!"

 agot_dragon.0014.t:0 "Diz Çöken [ROOT.Char.GetTitleAsNameNoTooltip]?"

 agot_dragon.0014.desc:0 ""Majesteleri, korkunç haberler var!" hizmetkârım koşarak bana doğru haykırıyor. "Haber geldi ki [attacker.GetTitledFirstName] boyun eğmenizi istiyor! [attacker.GetSheHe|U] tacınızı [attacker.GetHerHim]'e teslim etmenizi ve [attacker.GetHerHim]'i hak sahibi hükümdarınız olarak kabul etmenizi talep ediyor!"\n\nSaray dehşet içinde — savaş alanında bir ejderhayla yüzleşmek mi? Güçlerimi buna adamayı gerçekten istiyor muyum? Elbette, bağımsızlığımdan vazgeçmek de aynı ölçüde düşünülemez.\n\nNe yapmalıyım?"

 agot_dragon.0014.a:0 "[attacker.GetTitledFirstNameNoTooltip] ile yüzleşemem — diz çökeceğim."

 agot_dragon.0014.a.tt:0 "[attacker.GetTitledFirstNameNoTooltip]'e teslim olacaksınız."

 agot_dragon.0014.b.no_dragon:0 "[attacker.GetTitledFirstNameNoTooltip]'e diz çökmeyeceğim!"

 agot_dragon.0014.b.dragon:0 "Kendi ejderhalarımız var, teslim olmayacağız!"

 agot_dragon.0014.b.tt:0 "[attacker.GetTitledFirstNameNoTooltip]'e teslim olmayacaksınız."

 agot_dragon.0015.opening:0 "[defender.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_dragon.0015.desc:0 "Sana karşı koyamam. Ben, [defender.GetTitledFirstName], bu vesileyle sana bağlılık yemini ediyor ve seni hak sahibi hükümdarım olarak kabul ediyorum. Sana sadakatle hizmet edecek ve hak sahibi varislerinin hak iddialarını savunacağım."

 agot_dragon.0015.a:0 "Güzel, [defender.GetSheHe]'nin aklın yolunu görmesine sevindim."

 agot_dragon.0015.a.sadistic:0 "Eee, fethedilecek başka krallıklar her zaman vardır."

 agot_dragon.0016.t:0 "Cinsiyet Meselesi, Çözüldü"

 agot_dragon.0016.desc.start:0 "Şimdiye dek ben ve dünyanın geri kalanı [dragon.GetFirstName]'in erkek bir ejderha olduğunu varsayıyorduk"

 agot_dragon.0016.desc.my_dragon:0 "Aramızdaki bağ sayesinde artık #emp hissediyorum#! ki "

 agot_dragon.0016.desc.others_dragon:0 "Artık [dragonrider.GetTitledFirstName]'in şunu ilan ettiği söyleniyor:"

 agot_dragon.0016.desc.owned_dragon:0 "Personelimin gözlemlerine dayanarak artık bana şu söyleniyor: "

 agot_dragon.0016.desc.owned_dragon_revealing:0 "Artık bana [revealing.GetName] tarafından, [revealing.GetHerHis] gözlemlerine dayanarak şu söyleniyor: "

 agot_dragon.0016.desc.wild_dragon:0 "Küçük insanların gözlem ve dedikodularına dayanarak artık bana şu söyleniyor: "

 agot_dragon.0016.desc.confirm:0 "bu doğrulanmış durumda. [dragon.GetFirstNameNoTooltip] gerçekten de erkek.\n\nBöylece [dragon.GetNamePossessiveNoTooltip] cinsiyeti meselesi kesin olarak sona eriyor."

 agot_dragon.0016.desc.actually:0 "aslında [dragon.GetFirstNameNoTooltip] dişi!\n\nDünya, bırakabileceği yumurtaların haberini heyecanla bekliyor."

 agot_dragon.0016.a:0 "Anlıyorum! Öyleyse [dragon.Custom('DragonGirlBoy')]."

 agot_dragon.0016.b:0 "Öyleyse [dragon.Custom('DragonFemaleMale')]? Bunu bilmek iyi oldu."

 agot_dragon.0030.t:0 "$agot_dragon.0016.t$"

 agot_dragon.0030.desc:0 "Son zamanlarda [dragon.GetNamePossessive] cinsiyeti meselesi çok tartışılan bir konu hâline geldi. [revealing.GetName] ve ben konu hakkında sohbet ederken [child.GetName] oldukça sert bir şekilde söze karışıyor. "[dragon.GetNameNoTooltip] bir #italic [dragon.Custom('DragonGirlBoy')]#! ejderha!" diye haykırıyor [child.GetSheHe]. [child.GetNameNoTooltip] bunu nasıl biliyor belirsiz olsa da, [child.GetSheHe] [child.GetHerHis] tavrında oldukça kararlı."

 agot_dragon.0030.a:0 "Anlıyorum! Öyleyse [dragon.Custom('DragonGirlBoy')] bir ejderha."

 agot_dragon.0040.t:0 "Ejderhanın İlk Alevleri"

 agot_dragon.0040.desc.intro:0 "Geçerken [child.GetName]'in neşeli kahkahalarına kulak misafiri oluyorum; [child.GetSheHe] mutlaka [dragon.GetName] ile oynuyordur. Şu anki rotamı bırakıp ikiliye yaklaşıyorum ve manzara içimi ısıtıyor. Varlığımdan habersiz [child.GetNameNoTooltip], kıkır kıkır gülerek diyor ki "

 agot_dragon.0040.desc.fire_common:0 ""hadi [dragon.GetNameNoTooltip], alev püskürt [dragon.GetNameNoTooltip]!""

 agot_dragon.0040.desc.fire_valyrian:0 ""hadi [dragon.GetNameNoTooltip], dracarys [dragon.GetNameNoTooltip]!""

 agot_dragon.0040.desc.fire_breath:0 "Ejderhanın ağzından alevler fışkırıyor ve [child.GetNameNoTooltip] bir kez daha neşeyle kahkahalara boğuluyor."

 agot_dragon.0040.desc.fire_breath_craven:0 "Ejderhanın ağzından alevler fışkırıyor ve kendimi çıkışa doğru kaçarken buluyorum. Bir çocuk böyle bir güce sahip olmamalı."

 agot_dragon.0040.a:0 "Hayranlık verici."

 agot_dragon.0040.b:0 "Ejderha, birini öldürmeden önce kontrol altına alınmalı."

 agot_dragon.0018.t:0 "Bir Ejderhanın Ölümü"

 agot_dragon.0018.desc:0 "[dead_dragon.GetNameNicknamed] öldü, bu nasıl olabilir? Bu kadar uzun süredir paylaştığımız bağ artık yok.\n\n[dead_dragon.Custom('GetDragonSheHe')]'nin ilk aramızdan ayrılan olacağını hiç beklemezdim. Geride kalan olmak ıstırap verici ve bağımızın olduğu yerdeki boşluğu hissedebiliyorum — sanki biri onu göğsümden oyup çıkarmış gibi."

 agot_dragon.0018.a:0 "Seni özleyeceğim, [dead_dragon.GetNameNoTooltip]..."

 agot_dragon.0018.b:0 "Nasıl devam edeceğim?"

 agot_dragon.0019.t:0 "Yeni Bir Çift"

 agot_dragon.0019.desc:0 "Bana [dragon_female.GetFirstName] ve [dragon_male.GetFirstName]'in birlikte giderek daha fazla vakit geçirdikleri bildirildi. Görünüşe göre birbirlerine ısındılar ve artık bir çift oldukları düşünülüyor.\n\nUmarım bu, yakında bir yuva dolusu yumurtaya yol açar."

 agot_dragon.0019.a.compassionate:0 "#bold Ah!#! Ne harika!"

 agot_dragon.0019.a.sadistic:0 "Yavruları ne dehşetler getirecek!"

 agot_dragon.0019.a.lustful:0 "Bizden pek farklı değiller aslında."

 agot_dragon.0019.a.cynical:0 "Sonuçta hayvan değiller mi?"

 agot_dragon.0019.a:0 "Eee... iyi olmuş onlara, herhalde."

 agot_dragon.0019.tt:0 "[dragon_female.GetName] ve [dragon_male.GetName] artık bir çift"

 agot_dragon.0020.t:0 "Vahşileşen Ejderha"

 agot_dragon.0020.desc:0 "Hanemiz için acı haber: [dead_rider.GetName]'in ölümünün ardından [now_wild_dragon.GetName] uçup gitmiş görünüyor. [now_wild_dragon.GetFirstNameNoTooltip]'i uzaklaştıran keder miydi yoksa özgürlük arzusu mu, belki de asla bilemeyeceğiz.\n\nHepimiz için hüzünlü bir gün; artık hem ejderhanın hem de binicisinin kaybıyla baş etmek zorundayız."

 agot_dragon.0020.wild_fire_desc:0 "Hanemiz için tuhaf bir haber: [human_who_became_dragon.GetName]'in vahşi ateşten kaynaklanan kazasının ardından [now_wild_dragon.GetName] uçup gitmiş görünüyor. Bu gelişmelerin sonuçlarının ne olacağını bilmiyorum; ama çok tuhaf bir gün olduğunu söyleyebilirim."

 agot_dragon.0020.a:0 "Buna inanamıyorum..."

 agot_dragon.0020.a.f:0 "[now_wild_dragon.GetNameNoTooltip]'in kaybıyla nasıl başa çıkacağınız konusunda endişeleniyorsunuz."

 agot_dragon.0020.a.tt:0 "[now_wild_dragon.GetName] artık bir [wild_dragon|E]"

 agot_dragon.0021.desc:0 "[helping_dragon.GetName]'e doğru adımlıyorum; [helping_dragon.Custom('GetDragonSheHe')] [helping_dragon.Custom('GetDragonHerHis')] devasa bedenini bana çevirirken çizmelerimin sesi taşlarda yankılanıyor. [helping_dragon.Custom('GetDragonHerHis')] gözlerinin derinliklerine bakıyorum ve bana kuşku dolu bir bakış dönüyor. [helping_dragon.Custom('GetDragonHerHis')] hüznünü, [helping_dragon.Custom('GetDragonHerHis')] sorularını hissediyorum; ama sonunda [helping_dragon.Custom('GetDragonSheHe')] itaat edecek.\n\nEjderhanın ağzının açık olduğu, [helping_dragon.Custom('GetDragonHerHis')] boğazında ateşin biriktiği dehşet verici bir görüntü var. Bir sıcaklık dalgası ve tüm dünyam bembeyaz kesiliyor."

 agot_dragon.0021.a.valyrian:0 "#italic Kirimvose, [helping_dragon.GetNameNoTooltip].#!"

 agot_dragon.0021.a:0 "Teşekkür ederim, [helping_dragon.GetNameNoTooltip]..."

 agot_dragon.0022.desc:0 "[helping_dragon.GetName]'e doğru adımlıyorum; [helping_dragon.Custom('GetDragonSheHe')] [helping_dragon.Custom('GetDragonHerHis')] devasa bedenini bana çevirirken çizmelerimin sesi taşlarda yankılanıyor. [helping_dragon.Custom('GetDragonHerHis')] gözlerinin derinliklerine bakıyorum ve bana kuşku dolu bir bakış dönüyor. [helping_dragon.Custom('GetDragonHerHis')] hüznünü, [helping_dragon.Custom('GetDragonHerHis')] sorularını hissediyorum; ama sonunda [helping_dragon.Custom('GetDragonSheHe')] itaat edecek.\n\nEjderhanın ağzının açık olduğu, [helping_dragon.Custom('GetDragonHerHis')] boğazında ateşin biriktiği dehşet verici bir görüntü var. Bir sıcaklık dalgası ve kendimi sona hazırlıyorum; ama birden böğrümde bir #bold ÇARPMA #! hissediyorum ve yere savruluyorum."

 agot_dragon.0022.desc_ending:0 "Az önce durduğum yerde, hayatını benim için feda eden bir muhafız şimdi ejderha ateşiyle yıkanıyor."

 agot_dragon.0022.a:0 "Hayır! Ölmesi gereken bendim! #italic Bırak öleyim!#!"

 agot_dragon.0022.a.f:0 "Diğer muhafızlarınız sizi kendinizden kurtarırken sürükleyip götürüyorlar."

 agot_dragon.0023.t:0 "Bir Yamyam Tarafından Kovalanıyor!"

 agot_dragon.0023.sili:0 "[ridden_dragon.GetName]'in eyerine çıkıyorum, bacaklarımı savurup otururken eyerimin kayışlarını sıkarken [ridden_dragon.Custom('GetDragonHerHis')] güçlü kaslarının altımda gerildiğini hissediyorum. Bir komut ve bir hamleyle [ridden_dragon.Custom('GetDragonHerHim')]'in yukarı fırladığını hissediyorum; saniyeler içinde açık gökyüzünde süzülüyorum.\n\n"

 agot_dragon.0023.lord:0 "[ridden_dragon.GetName] havalanıyor ve [ridden_dragon.Custom('GetDragonHerHis')] kanatlarının birkaç çırpışında ikimiz de gökyüzüne yaklaşıyoruz. Unvanımın ağır yükünü arkamda bırakıyorum. Her şeyin üzerine yükselmek için bir anlığına tüm sorumluluklarımı salıyorum — rüzgârın okşayışını ve güneşin öpücüğünü hissetmek için.\n\n"

 agot_dragon.0023.greeny:0 "[ridden_dragon.GetName] eyerine tırmanırken beni sabırsızlıkla mırıldıyor. [ridden_dragon.Custom('GetDragonHerHim')] ile kurduğum bağ, başka hiçbir yerde hissetmediğim bir şey; sözsüz bir komutla havalanıyoruz.\n\n"

 agot_dragon.0023.tukha:0 "Bulutlara dokunmak için elimi uzatıyorum; çiy damlaları birleşiyor. Damlaların derinliği, ufukta yükselen fırtına gibi zihnimde beliriyor. Sonra şu soru çarpıyor aklıma: Bu duyguyu kaç kişi tatmıştır? Tüm tarih boyunca sayıları evimdeki tek bir salona sığar mıydı? Bugün yaşayan biri bunu biliyor mu, yoksa bu deneyimde yalnız mıyım?\n\n"

 agot_dragon.0023.aemmly:0 "[ridden_dragon.GetName] bulutlara doğru yükselirken Kralın Şehri altımda küçülüyor. [ridden_dragon.Custom('GetDragonHerHis')|U] heyecanı manyetik; ne var ki [ridden_dragon.Custom('GetDragonHerHis')] kanatlarının atışı bir kalp atışı kadar huzur verici. Karasu Koyu'nun karşısına bakıp Driftmark ve Dragonstone'u seçiyorum; yüz yıl boyunca Valyria'nın son kalıntılarını taşıyan bu adalar, sokaktaki iri parke taşları boyutunda görünüyor.\n\n"

 agot_dragon.0023.cont:0 "Birkaç dakika geçmeden arkamdan gelen bir kükreme sesi beni hayallerimden koparıyor! Dehşetle dönüp [cannibal_dragon.GetName]'i bizi var gücüyle kovalarken görüyorum; [cannibal_dragon.Custom('GetDragonHerHis')] gözleri [ridden_dragon.GetNameNoTooltip] ve bana kilitlenmiş!\n\nSavaşamayacak kadar devasa; hayatta kalma umudumuz varsa kaçmak zorundayız!"

 agot_dragon.0023.a:0 "Daha hızlı uç, [ridden_dragon.GetNameNoTooltip]!"

 agot_dragon.0023.a.valyrian:0 "Soves! Soves [ridden_dragon.GetNameNoTooltip]!"

 agot_dragon.0023.a.f:0 "Toparlayabildiğiniz tüm hızla [cannibal_dragon.GetNameNoTooltip]'den kaçmaya çalışıyorsunuz!"

 agot_dragon.0023.escape_t:0 "Kaçtı!"

 agot_dragon.0023.escape_tt:0 "Siz ve [ridden_dragon.GetNameNoTooltip] [cannibal_dragon.GetNameNoTooltip]'den kaçmayı başarıyorsunuz"

 agot_dragon.0024.t:0 "Sınır Gökyüzü!"

 agot_dragon.0024.martial:0 "Kılıçların, mızrakların ve kalkanların çarpışması kimi zaman teselli vericidir, ama çoğu zaman #bold ağırdır#!. [ridden_dragon.GetName]'in sırtında uzaklaşırken yüklerimden kurtulmuş hissediyorum — talim avlusunun gürültülü sesleri gittikçe zayıflıyor.\n\nBir gün savaşın gerilimlerinin bu dünyadan kesin olarak silineceğine inanmak saflık olurdu. Dünya çok büyük ve insan doğası, böyle bir hayalin gerçeğe dönüşmesi için fazla kavgacı. Ama [ridden_dragon.GetNameNoTooltip] ile uçmak bana kişisel bir ateşkes bahşediyor.\n\nBurada, ihtiyacım olan tek kalkan [ridden_dragon.Custom('GetDragonHerHim')] ve bileği taşımı getirmeme gerek yok; çünkü bağımız, kılıçların aksine, körelmez. En yiğit silah arkadaşımla geçirdiğim böyle bir huzur anı: İşte buna #bold gerçek zafer#! derim."

 agot_dragon.0024.learning:0 "Sıradan günlerde kitaplarımı ve içlerinde barındırdıkları tüm zenginlikleri bırakmak için acele etmem; ama [ridden_dragon.GetName] ile bir gezinti asla sıradan değildir. [ridden_dragon.Custom('GetDragonHerHim')] ile baş başa kalabildiğim özel bir andır — artık #bold düşünmek#! zorunda olmadığım bir an. O zaman tüm bu formülleri ve denklemleri, tüm bu yazıları ve hikâyeleri unutabilirim.\n\nKafam bir bulut kadar hafiflerken, merakımı kamçılayacak hiçbir şeyin kalmadığı kadar yükselebiliyorum. Burada önemli olan tek şey [ridden_dragon.GetNameNoTooltip]. Gökyüzünde, kağıt parçalarına işlenmiş mürekkep harfler yok; doğruluğu henüz kanıtlanacak dolambaçlı tarihler yok; soyut kavramlar üzerine faydasız düşünceler yok. Burada her şey somut ve tamamen açık.\n\nBen varım, [ridden_dragon.GetNameNoTooltip] var ve bağımız var. Ve bu #bold sadelik#! beni heyecanlandırıyor."

 agot_dragon.0024.intrigue:0 "Davetsiz birinin beni takip etmediğinden emin olmak ister gibi arkama son bir kez bakıyorum, sonra [ridden_dragon.GetName]'e biniyor ve [ridden_dragon.Custom('GetDragonHerHim')]'e havalanmasını emrediyorum. Bana zarar verebileceklerden uzaklaşmak başlı başına #bold özgürleştirici#!.\n\nArtık olası herhangi bir suikastçının veya komplocunun erişemeyeceği bir yerdeyim. Karanlık, onu nasıl kullanacağını bilenler için müthiş bir silahtır — ve ben nasıl kullanılacağını bilirim — ama sadık müttefikimle güneşin parlaklığında yıkanmanın bana iyi geldiğini inkar edemem.\n\nEndişelenecek gizli bıçak yok, başımın üzerinde sallanan bir komplo yok. Burada, gölgelerin soğukluğu artık bana hiçbir işe yaramıyor; üzerimde bu kurtarıcı etkiyi yaratan şey, [ridden_dragon.GetNameNoTooltip]'in #bold sıcaklığı#!."

 agot_dragon.0024.diplomacy:0 "Diplomasi bir sözcükler meselesidir. Sözlü ya da yazılı alınıp verilen sözcükler. Tartışmalar, görüşmeler, diyaloglar, konuşmalar... Her şey #bold alışverişle#! ilgilidir — hediyelerle ya da sözcüklerle. Ama herkes ejderha binicilerinin ejderhalarıyla iletişim kurduğu gibi iletişim kurabilseydi diplomasi çok daha kolay olurdu.\n\nArtık yorumlama, rol yapma, hile ve yaltaklanma olmazdı. Geriye yalnızca somut olan, gerçek olan kalırdı. İletişim en saf hâliyle. Zihin kağıdın yerini alır, bağ mürekkebin yerini alırdı. Böyle bir şey bir gün gerçekleşebilseydi, dünya kökten değişirdi. Ama o gün henüz gelmedi.\n\nBugünse yalnızca ejderha binicileri ejderhalarla iletişim kurabilir — yalnızca bir avuç kişiye bahşedilmiş bir ayrıcalık. Yine de [ridden_dragon.GetName] ve ben kendi dünyamızda birlikteyken, diplomasinin özünün #bold bağ#! kurmak olması gerektiğini hissetmekten kendimi alamıyorum."

 agot_dragon.0024.stewardship:0 "[ridden_dragon.GetName] ayrılmaya hazır görünüyor, ama ben hazır değilim. Hâlâ yapacak kontrolüm var. Eyer yerinde mi? Bu gezinti [ridden_dragon.Custom('GetDragonHerHis')] iştahını kabartırsa, çiftlik hayvanı olarak bana kaç altına mal olur? Kaç fersah uçabiliriz? Düşüncelerim öyle bunaltıcı ki aklıma gelen tek şey #bold sayılar#!.\n\nBeni tüm bunlardan çekip çıkaran alçak bir hırıltı. Haklısın, [ridden_dragon.GetNameNoTooltip], #italic hepsini unut!#! Bugün [ridden_dragon.Custom('GetDragonHerHim')] ile binmeyi seçtim çünkü düşünmek için değil, bu yükten kurtulmak için — işte bu yüzden eyere tırmanıp kendimi kaptırıyorum.\n\nHokkabazlar ve mızrak dövüşü yapan cücelerle yetmiş yedi çeşit yemekli görkemli bir şölen düzenlemiş gibi, krallığın maliyesi kadar hafif hissediyorum. [ridden_dragon.GetNameNoTooltip] ile birlikteyken beni ilgilendiren tek sayı, yükümlülüklerime dönmem için kalan dakikalar. Ve ilgimi çeken tek #bold zenginlik# de beni [ridden_dragon.Custom('GetDragonHerHim')]'e bağlayan şey."

 agot_dragon.0024.fallback:0 "$agot_dragon.0010.troof$"

 agot_dragon.0024.m:0 "Bir ejderha #italic sıradan#! bir silah değildir. [ridden_dragon.Custom('GetDragonSheHe')|U] ete bürünmüş savaştır."

 agot_dragon.0024.l:0 "[ridden_dragon.GetNameNoTooltip]'in bana öğreteceği çok şey var. Çözüm çoğu zaman #italic basit#! olur."

 agot_dragon.0024.i:0 "Karanlıkta örgüler kurulur, ama #italic ışık#! bana berraklık verir."

 agot_dragon.0024.d:0 "Keşke dostlarım ve müttefiklerim de benimle aynı şekilde #italic bağ#! kurabilse."

 agot_dragon.0024.s:0 "[ridden_dragon.GetNameNoTooltip] bunun doğrusunu bilir: Gerçek zenginlik, iyi harcanan #italic zamandır#!."

 agot_dragon.0024.oops:0 "$agot_dragon.0010.a$"

 agot_dragon.0024.flavor:0 "Ejderhanızla uçmaktan değerli bir ders kazanıyorsunuz."

 agot_dragon.0101.t:0 "Ateşe Susamışlık"

 agot_dragon.0101.aerion.desc:0 "Kâsemdeki içkiye bakıyorum, kenarları çoktan yeşil lekelerle kaplanmış; tam o sırada [worried_physician.GetFirstName] odama dalıyor, [worried_physician.GetHerHis] alnı terle kaplı ve endişeyle çatılmış.\n\n"Efendim!" diye haykırıyor [worried_physician.GetSheHe], kâseye uzanarak. "Ne yapıyorsunuz?"\n\n[worried_physician.GetHerHis] kavrayışından sıyrılırken ona pek kulak asmıyorum.\n\n"[aerion_brightflame.GetFirstNameNicknamed]'den hiçbir şey öğrenmedik mi?" diye sürdürüyor [worried_physician.GetSheHe], hâlâ nefesini toplamaya çalışarak. "O da dönüşmek için vahşi ateş içti ve sonunda çığlık atarak öldü.""

 agot_dragon.0101.desc:0 "Kâsemdeki içkiye bakıyorum, kenarları çoktan yeşil lekelerle kaplanmış; tam o sırada [worried_physician.GetFirstName] odama dalıyor, [worried_physician.GetHerHis] alnı terle kaplı ve endişeyle çatılmış.\n\n"Efendim!" diye haykırıyor [worried_physician.GetSheHe], kâseye uzanarak. "Ne yapıyorsunuz?"\n\n[worried_physician.GetHerHis] kavrayışından sıyrılırken ona pek kulak asmıyorum.\n\n"O kâseyi içmek sizi ejderhaya dönüştürmeyecek." diye sürdürüyor [worried_physician.GetSheHe], hâlâ nefesini toplamaya çalışarak. "Sizi yalnızca bir cesede dönüştürecek.""

 agot_dragon.0101.a:0 "Tüm düşmanlarımı küle çevireceğim!"

 agot_dragon.0101.b:0 "Bir daha düşününce, [worried_physician.GetFirstNameNoTooltip] haklı..."

 agot_dragon.0200.t:0 "Belalı [wild_dragon.GetNameNoTooltip]"

 agot_dragon.0200.desc:0 "[chancellor.GetTitledFirstName], [wild_dragon_location.GetName]'i kasıp kavuran bu belayı görüşmek için geliyor. "Bu ejderha hakkında bir şeyler yapmalıyız, [wild_dragon.GetNameNicknamed]. Krallık dehşet içinde; bu canavarın kırsalı paramparça etmesini seyrederek oturamayız. [wild_dragon.Custom('GetDragonHerHis')] inişinin [wild_dragon_location.GetNameNoTooltip]'te bulunduğuna dair ciddi haberler var; belki de bu işi kökten halletmesi için birini göndermenin vakti geldi.""

 agot_dragon.0200.a:0 "Zafer benim olacak."

 agot_dragon.0200.b:0 "Bu işi halledecek birine para öde."

 agot_dragon.0200.c:0 "[court_combatant.GetFirstNameNicknamed]'i gönder."

 agot_dragon.0200.d:0 "Pekâlâ, ben hallederim."

 agot_dragon.0200.e:0 "Kuduz bir canavarı kışkırtmamak en iyisidir."

 agot_dragon.0201.t:0 "$agot_dragon.0200.t$: Kiralık Katiller"

 agot_dragon.0201.desc:0 "Talimat üzerine [chancellor.GetTitledFirstName], ejderha [wild_dragon.GetNameNicknamed]'i öldürme görevini üstlenmeye gönüllü birkaç cüretkâr aday buldu... #italic tabii bir bedel karşılığında.#!"

 agot_dragon.0201.desc_child:0 "\n\nElbette, çocuğum [candidate_son.GetFirstNameNicknamed] de bu görevi üstlenmek için fazlasıyla hevesli görünüyor."

 agot_dragon.0201.a:0 "[candidate_merc.GetFirstName] en iyilerin en iyisi."

 agot_dragon.0201.b:0 "[candidate_knight.GetFirstName] uygun fiyatlı."

 agot_dragon.0201.personal_knight:0 "[candidate_personal_knight.GetFirstName] kendini kanıtladı; onun yerine [candidate_personal_knight.GetHerHim]'i gönder."

 agot_dragon.0201.c:0 "Çocuğum bize onur kazandıracak."

 agot_dragon.0201.d:0 "Bu aptallar olmaz; başka bir yol deneyeceğiz."

 agot_dragon.0201.e:0 "Bir daha düşününce, canavar yaşayabilir."

 agot_dragon.0202.t:0 "$agot_dragon.0200.t$ Devrildi"

 agot_dragon.0202.desc:0 "Günlerdir acı dolu bir bekleyiş içindeyken sokaklardan gelen sevinç çığlıklarıyla uyanıyorum; balkona koşup mübarek manzarayı görünce içim rahatlıyor.\n\n[dragon_fighter.GetTitledFirstNameNicknamed] ve [dragon_fighter.GetHerHis] kafilesi döndü! Arkalarında, devrilen canavar [wild_dragon.GetNameNicknamed]'den kalma ganimetlerle dolu bir araba var. Gözüm koparılmış bir pençeye ve ejderhanın boynundan kazınmış [wild_dragon.Custom('GetDragonColor')] pullarla dolu bir fıçıya takılıyor.\n\nHeyecanla sokakta [dragon_fighter.GetNameNoTooltip]'i karşılamaya koşuyorum; toprakları kasıp kavuran bir dehşet alt edildi ve kahramanlar yaptıklarından ötürü övülecek!"

 agot_dragon.0202.a:0 "Tüm tebaam bu günü kutlayacak!"

 agot_dragon.0202.a.tt:0 "[dragon_fighter.GetFirstNameNoTooltip], vahşi bela [wild_dragon.GetNameNoTooltip]'i öldürdü!"

 agot_dragon.0203.t:0 "$agot_dragon.0200.t$ Bir Kurban Daha İstiyor"

 agot_dragon.0203.desc_run:0 "[dragon_fighter.GetTitledFirstNameNicknamed], kendini korkak bir sürüngen olarak gösterdi! Toprakları terörize eden vahşi ejderhayla yüzleşmek yerine, [dragon_fighter.GetFirstNameNoTooltip] [wild_dragon.GetNamePossessive] [wild_dragon.Custom('GetDragonColor')] kanatlarını görür görmez kaçtı.\n\nBütün o böbürlenmelerine ve palavra atmalarına rağmen [dragon_fighter.GetFirstNameNoTooltip], [dragon_fighter.GetHerHis] günlerinin geri kalanı boyunca kendini rezil etti.\n\n[wild_dragon.GetNameNicknamedNoTooltip] hâlâ açık gökyüzünde süzülüp küçük insanları terörize ediyor; başka bir şey yapılması şart..."

 agot_dragon.0203.desc_dead:0 "[dragon_fighter.GetTitledFirstNamePossessive] yola çıkışından bu yana çok uzun süre haber alamadık; sonunda [dragon_fighter.GetHerHis] kafilesinden dağınık bir asker döndü. Getirdiği haberler bundan daha kötü olamazdı...\n\n[dragon_fighter.GetFirstNameNoTooltip] [dragon_fighter.GetDeathReason]; kafilesinin büyük kısmı da [wild_dragon.GetNameNicknamed] tarafından canlı canlı yendi! Geri kalanlar tepelere dağıldı, yavaş yavaş ailelerine ya da bilinmeyen yerlere dönüyorlar.\n\n[wild_dragon.GetNameNoTooltip] hâlâ açık gökyüzünde süzülüp küçük insanları terörize ediyor; başka bir şey yapılması şart... Ama şimdi ejderhaya kafa tutmaya kim cesaret edecek?"

 agot_dragon.0203.a:0 "#bold Lanet olsun!#!"

 agot_dragon.1001.t:0 "Ekim"

 agot_dragon.1001.targ:0 "#italic Sözde#! ejderha tohumları geldi. Bu müstakbel ejderha binicilerinin bazıları hanemin özelliklerini taşıyor, bazılarıysa bambaşka bir soydan geliyormuş gibi görünüyor. Kimi rahat bir güvenle duruyor, kimi korkudan terleyip titriyor.\n\nEjderha hanesi pek çok biçim alır ve bu toplanmış kalabalığın arasında gerçek ejderha kanı taşıyan birinin olmasını ummaktan kendimi alamıyorum.\n\nHer biri çağrıma cevap verdi ve her biri riski biliyor. Şimdi son bir an durup düşünmem gerekiyor.\n\n#italic Bu risklere değer mi?#!"

 agot_dragon.1001.desc:0 "#italic Sözde#! ejderha tohumları geldi. Bu müstakbel ejderha binicilerinin bazıları kadim büyük Valyria hanelerinin özelliklerini taşıyor, bazılarıysa bambaşka bir soydan geliyormuş gibi görünüyor. Kimi rahat bir güvenle duruyor, kimi korkudan terleyip titriyor.\n\nHer biri çağrıma cevap verdi ve her biri riski biliyor. Şimdi son bir an durup düşünmem gerekiyor.\n\n#italic Bu risklere değer mi?#!"

 agot_dragon.1001.a:0 "Başlamaları için işaret ver."

 agot_dragon.1001.b:0 "Riskler #italic fazla#! büyük."

 agot_dragon.1001.b_tt:0 "Ekim iptal edilecek"

 dragonseed_flees_during_taming_tt:0 "[tamer.GetFirstName], [dragon.GetFirstName]'den kaçtı"

 dragon_wounds_during_taming_tt:0 "[dragon.GetFirstName], [tamer.GetFirstName]'i yaraladı"

 dragon_burns_during_taming_tt:0 "[dragon.GetFirstName], [tamer.GetFirstName]'i yaktı"

 dragon_success_taming_tt:0 "[tamer.GetFirstName], [dragon.GetFirstName]'i evcilleştirdi!"

 agot_dragon.1003.t:0 "Hasat"

 agot_dragon.1003.desc_none_intro:0 "Ekim'in katliamının ortasında dururken çevremi ateş ve kan sarıyor. Duman çevremi kuşatıp burun deliklerim yanık et kokusuyla dolarken nefes almakta zorlanıyorum. Başarısız olan binicilerin uzaktan gelen çığlıkları hâlâ kafamda çınlıyor.\n\nEjderha tohumlarının sonuncusu da gitti ve ben başarısız oyunumun ardından yapayalnız kaldım. Ejderhaların ta kendisi planımı ve onu deneyen ejderha tohumlarını reddetti.\n\n"

 agot_dragon.1003.desc_none_llama:0 "Rahatsız edici bir sessizlik çökerken bunun bir alamet olduğunu hissetmekten kendimi alamıyorum. Ejderhalar ete bürünmüş ateştir; onları hazırlıksız birine sunmak ahmaklıktır."

 agot_dragon.1003.desc_none_aith:0 "Sahipsiz ejderhaların yarattığı yıkıma göz gezdirirken, belki de bunun en iyisi olduğunu düşünmeden edemiyorum. Bugün, bir ejderhanın ne kadar tehlikeli olabileceğinin — üstelik yanlış ellerde çok daha fazlasının — bir hatırlatıcısı."

 agot_dragon.1003.desc_one:0 "Başarı! [tamer_1.GetTitledFirstName], [dragon_1.GetFirstName]'i evcilleştirmeyi başardı."

 agot_dragon.1003.desc_two:0 "Başarı! [tamer_1.GetTitledFirstName] ve [tamer_2.GetTitledFirstName], sırasıyla [dragon_1.GetFirstName] ve [dragon_2.GetFirstName]'i evcilleştirmeyi başardı."

 agot_dragon.1003.desc_three:0 "Büyük bir başarı! [tamer_1.GetTitledFirstName], [dragon_1.GetFirstName]'i, [tamer_2.GetTitledFirstName] [dragon_2.GetFirstName]'i ve [tamer_3.GetTitledFirstName] de [dragon_3.GetFirstName]'i evcilleştirdi."

 agot_dragon.1003.desc_more:0 "Büyük bir başarı! [tamer_1.GetTitledFirstName], [dragon_1.GetFirstName]'i, [tamer_2.GetTitledFirstName] [dragon_2.GetFirstName]'i ve [tamer_3.GetTitledFirstName] de [dragon_3.GetFirstName]'i evcilleştirdi; dahası da var."

 agot_dragon.1003.desc_success:0 "Yeni ejderha binicileri önümde dizildi. Kıyamet'ten bu yana çok az kişinin bildiği bir güce sahipler ve ejderhalarını elimde tutacaksam sadakatlerini kazanmalıyım.\n\nOnlara ne sunayım?"

 agot_dragon.1003.a:0 "Altın teklif edeceğim."

 agot_dragon.1003.b:0 "Soylu bir unvan teklif edeceğim."

 agot_dragon.1003.c:0 "Sadakatlerini kazanmak için hem altın hem unvan."

 agot_dragon.1003.bastard_tt:0 "[bastard|e] oldukları için soylulukları konusunda bir seçim yapmanız gerekecek."

 agot_dragon.1003.d:0 "Onlara kanat bahşedildi; başka hiçbir şeye ihtiyaçları yok."

 agot_dragon.1003.e:0 "Talihsizlik."

 agot_dragon.1004.t:0 "Kötü Bir Tohum"

 agot_dragon.1004.desc.intro:0 "Adaylar şanslarını denemeye hazır şekilde kendilerini tanıtıyor. Sayılarını sayarken birinin eksik olduğunu ancak çok geç fark ediyorum. Salonu çınlatan, ruhu yakan o ses yankılanmadan önce başlarına hangi korkunç ya da sıradan kaderin geldiğini düşünmeye yalnızca bir anım kalıyor. Bin ruhun çığlığı kemiklerimi küle çeviriyor — ya da en azından öyle hissettiriyor.\n\nArdından gelen sessizlikte büyük bir kafa karışıklığı var; [candidate_one.GetFirstName] haykırıp [false_seed.GetFirstName]'in tüyler ürperten görüntüsünü işaret edince kafa karışıklığı şoka dönüşüyor. Gözlerinden kan sızan ve neredeyse fark edilmez biçimde soluyan [false_seed.GetFirstNameNoTooltip], yanıp kabarmış ciğerleriyle nefes almak için çabalıyor.\n\n[false_seed.GetSheHe]'nin tutunduğu ejderha boynuzunun korosuna bir ses daha eklemesine yalnızca bir an var."

 agot_dragon.1004.desc.multiple_dragons:0 "Şok içinde, ejderhaların çıkışa yönelmeye başladıklarını neredeyse fark etmiyoruz. Ne amaçla olduğunu bilmiyoruz; ama dışarı çıkmak istedikleri kesin. Yollarını kesme çabalarımıza rağmen iradeleri katı."

 agot_dragon.1004.desc.single_dragons:0 "Şok içinde, ejderha [dragon_one.GetName]'in çıkışa yönelmeye başladığını neredeyse fark etmiyoruz. Ne amaçla olduğunu bilmiyoruz; ama [dragon_one.GetSheHe]'nin dışarı çıkmak istediği kesin. [dragon_one.GetHerHis] yolunu kesme çabalarımıza rağmen iradesi katı."

 agot_dragon.1004.desc.outro:0 "Bunu durdurmak imkânsız... Oda kargaşa içinde."

 agot_dragon.1004.a:0 "Bu olamaz."

 agot_dragon.1005.t:0 "Bereketli Bir Hasat"

 agot_dragon.1005.desc.intro:0 "Plan #bold işe yaradı#!!\n\n[false_seed.GetFirstName], [false_seed.GetHerHis] görevini harikulade yerine getirdi! Keşke o an [dragon_keeper.GetTitledFirstNamePossessive] yüzündeki ifadeyi görebilseydim. Bu süreçte ejderha boynuzunu kaybetmek üzücü; onu geri almak için çabalamalıyım.\n\n"

 agot_dragon.1005.desc.multiple_dragons:0 "Her neyse, [dragon_one.GetName], [dragon_two.GetName] ve diğer ejderhalar önüme geldi — ve heyecanım elle tutulur düzeyde. Bir tanesini efendisi olarak sahipleneceğim."

 agot_dragon.1005.desc.two_dragons:0 "Her neyse, [dragon_one.GetName] ve [dragon_two.GetName] önüme geldi — ve heyecanım elle tutulur düzeyde. Bir tanesini efendisi olarak sahipleneceğim."

 agot_dragon.1005.desc.single_dragons:0 "Her neyse, [dragon_one.GetName] önüme geldi — ve heyecanım elle tutulur düzeyde. [dragon_one.GetHerHim]'i [dragon_one.Custom('GetDragonHerHis')] efendisi olarak sahipleneceğim."

 agot_dragon.1005.a:0 "[dragon_two.GetNameNoTooltip] benim ejderham olacak."

 agot_dragon.1005.a.tt:0 "[dragon_two.GetNameNoTooltip]'i evcilleştireceksiniz. Diğer ejderhalar size ait ve sizinle bağlı kalmaya devam edecek."

 agot_dragon.1005.b:0 "[dragon_one.GetNameNoTooltip] benim ejderham olacak."

 agot_dragon.1005.b.tt:0 "[dragon_one.GetNameNoTooltip]'i evcilleştireceksiniz. Diğer ejderhalar size ait ve sizinle bağlı kalmaya devam edecek."

 agot_dragon.1005.c:0 "Dünya benim."

 agot_dragon.1005.c.tt:0 "[dragon_one.GetNameNoTooltip]'i evcilleştireceksiniz"

 agot_dragon.1005.d:0 "Diğer ejderhaların arasından seçeceğim."

 agot_dragon.1005.e:0 "Gücüm artıyor."

 agot_dragon.1005.f:0 "Bu ejderhalar bana uygun değil."

 agot_dragon.1005.g:0 "[dragon_one.GetNameNoTooltip] bana uygun değil."

 agot_dragon.1006.t:0 "Beklenmedik Bir Hasat"

 agot_dragon.1006.desc:0 "[keeper_location.GetName]'den son derece tuhaf bir hikâye geldi...\n\nGörünüşe göre [dragon_keeper.GetName] ejderha evcilleştirme şansı için #italic sözde#! ejderha tohumlarını ağırlarken, adaylardan biri kendisinin #bold sahte bir tohum#! olduğunu açığa vurdu. [false_seed.GetFirstName], hem insanların hem ejderhaların gözü önünde, Ekim sırasında bir ejderha boynuzu çaldı — üstelik herhangi bir boynuz değil, #italic benim#! bağlandığım o boynuz.\n\n"

 agot_dragon.1006.desc.multiple_dragons:0 "[dragon_one.GetNameNicknamed], [dragon_two.GetNameNicknamed] ve dahası şu an önüme gelmeseydi buna asla inanmazdım! Görünüşe göre son derece şanslıyım."

 agot_dragon.1006.desc.two_dragons:0 "Ejderhalar [dragon_one.GetNameNicknamed] ve [dragon_two.GetNameNicknamed] şu an önüme gelmeseydi buna asla inanmazdım. Gerçekten de talihli bir hasat!"

 agot_dragon.1006.desc.one_dragon:0 "Ejderha [dragon_one.GetNameNicknamed] şu an önüme gelmeseydi buna asla inanmazdım. Görünüşe göre bazen başkalarının ektiğini biçersin..."

