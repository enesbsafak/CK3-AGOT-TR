### TODO NOT-IN-ST: agot_events_bastard.0956.desc [AGOT: After receiving [revealer.GetFirstNamePossessive] letter, my life has divided into two. Before this, and after. I am silent, unable to process that what is in front of me is now in front of the whole realm. It tells of the truth. That I was born of [real_mother.GetName] and [real_father.GetName]. What's worse, copies have been sent to all the realm!\n\nSuch a secret I held close for so long that it was not even I who could reveal it.\n\nThis should rightfully have been my decision, but [sharer.GetFirstNameNoTooltip] has robbed me of that option. Regardless, it has been done. Though it was not my desire, the realm is to know.]
 agot_events_bastard.0956.desc:0 "After receiving [revealer.GetFirstNamePossessive] letter, my life has divided into two. Before this, and after. I am silent, unable to process that what is in front of me is now in front of the whole realm. It tells of the truth. That I was born of [real_mother.GetName] and [real_father.GetName]. What's worse, copies have been sent to all the realm!\n\nSuch a secret I held close for so long that it was not even I who could reveal it.\n\nThis should rightfully have been my decision, but [sharer.GetFirstNameNoTooltip] has robbed me of that option. Regardless, it has been done. Though it was not my desire, the realm is to know."

