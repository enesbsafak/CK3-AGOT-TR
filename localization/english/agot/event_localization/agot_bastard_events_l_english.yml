 agot_events_bastard.0992.t:0 "Çizgi Aşıldı"

 agot_events_bastard.0992.desc:0 "Demek bu noktaya geldik.\n\n[ruler_scope.GetFirstNamePossessive] bildirimini almadığımı iddia etmek için çok fazla zaman geçti ve gerekli birlikleri seferber etmek için savaş sancaklarını çağıran kuzgunları gönderdim. Çizgi aşıldı, zar atıldı ve bu iş bittiğinde ya [reveal_scope.GetHouse.GetBaseName] ya da [ruler_scope.GetHouse.GetBaseName] zaferle hüküm sürecek.\n\nÖnümde toplanan sancakları inceliyorum; zalim [ruler_scope.GetName]'in adaletsiz taleplerine karşı gelmek için akın eden birçoklarını görüyorum."

 agot_events_bastard.0992.desc.same:0 "Demek bu noktaya geldik.\n\n[ruler_scope.GetFirstNamePossessive] bildirimini almadığımı iddia etmek için çok fazla zaman geçti ve gerekli birlikleri seferber etmek için savaş sancaklarını çağıran kuzgunları gönderdim. Çizgi aşıldı, zar atıldı ve meşru [ruler_scope.GetHouse.GetBaseName] kanla belirlenecek.\n\nÖnümde toplanan sancakları inceliyorum; zalim [ruler_scope.GetNameNoTooltip]'in adaletsiz taleplerine karşı gelmek için akın eden birçoklarını görüyorum."

 agot_events_bastard.0992.desc.ned:0 "Demek bu noktaya geldik.\n\n[ruler_scope.GetFirstNamePossessive] bildirimini almadığımı iddia etmek için çok fazla zaman geçti ve gerekli birlikleri seferber etmek için savaş sancaklarını çağıran kuzgunları gönderdim. Çizgi aşıldı, zar atıldı ve bu iş bittiğinde ya [reveal_scope.GetHouse.GetBaseName] ya da [ruler_scope.GetHouse.GetBaseName] zaferle hüküm sürecek.\n\nÖnümde toplanan sancakları inceliyorum ve bir zamanlar dostum olan kişiye karşı güneye yürümek yüreğimi sızlatıyor olsa da, doğru olanı yapmayı Lyanna'ya ve [reveal_scope.GetFirstName]'e borçlu olduğumu biliyorum. Hem insanların hem de kendimin merhameti için, bunun hızlı bir savaş olmasını diliyorum."

 agot_events_bastard.0992.a:0 "Birlikte adalet için yürüyoruz!"

 agot_events_bastard.0992.a.tt:0 "@warning_icon! #warning [ruler_scope.GetFirstNamePossessive] tahtı üzerinde iddia öne sürüp savaş ilan edeceksin. Saldırgan olarak savaşacaksın.#!"

 agot_events_bastard.0993.t:0 "Talepler Reddedildi"

 agot_events_bastard.0993.desc:0 "Demek bu noktaya geldik.\n\nTaleplerimi reddeden piç [reveal_scope.GetName], [ruler_scope.GetPrimaryTitle.GetName]'i yönetme niyetini ilan etti ve iddialarını desteklemek için müttefiklerini çağırdı. Böyle bir kuvveti toplamak için ne tür vaatlerde bulunmuş olmalı bilinmez; ama çizgi aşıldı, zar atıldı ve bu iş bittiğinde ya [reveal_scope.GetHouse.GetBaseName] ya da [ruler_scope.GetHouse.GetBaseName] zaferle hüküm sürecek.\n\nÖnümde toplanan sancakları inceliyorum; adil yönetimimi savunmak için akın eden birçoklarını görüyorum."

 agot_events_bastard.0993.desc.same:0 "Demek bu noktaya geldik.\n\nTaleplerimi reddeden piç [reveal_scope.GetName], [ruler_scope.GetPrimaryTitle.GetName]'i yönetme niyetini ilan etti ve iddialarını desteklemek için müttefiklerini çağırdı. Böyle bir kuvveti toplamak için ne tür vaatlerde bulunmuş olmalı bilinmez; ama çizgi aşıldı, zar atıldı ve bu iş bittiğinde ya gerçek bir [reveal_scope.GetHouse.GetBaseName] ya da sahte bir tanesi zaferle hüküm sürecek.\n\nÖnümde toplanan sancakları inceliyorum; adil yönetimimi savunmak için akın eden birçoklarını görüyorum."

 agot_events_bastard.0993.desc.robert:0 "Son birkaç haftanın olayları beni iliklerime kadar şok etti; en çok da kendimi şu an bulduğum yer.\n\nBir zamanlar dostum olan Eddard Stark, taleplerimin adaletsiz olduğunu ilan etti ve [reveal_scope.GetName]'i [ruler_scope.GetPrimaryTitle.GetName]'in hükümdarı olarak yerleştirmek için sancaklarını kaldırdı. Bu iddiayı desteklemek için birçok müttefikini ve vassalını çağırdı ve talebimin, birlikte devirdiğimiz Deli Kral'dan daha iyi olmadığımı kanıtladığını söyledi.\n\nAramızda bir zamanlar var olan dostluk artık bitti. Çizgi aşıldı, zar atıldı ve bu iş bittiğinde ya Stark ya da Baratheon zaferle hüküm sürecek.\n\nAsileri ezeceğim, Starkları ezeceğim ve o küçük ejderha dölünü, [reveal_scope.GetHerHis] babasını ve büyükbabasını ezdiğim gibi ezeceğim!"

 agot_events_bastard.0993.a:0 "Bu sahtekar asileri yok edeceğim!"

 agot_events_bastard.0993.a.tt:0 "@warning_icon! #warning [reveal_scope.GetName], taht için sana karşı savaş ilan etti. Savunmacı olarak savaşacaksın.#!"

 agot_events_bastard.0994.t:0 "Düzen Yeniden Sağlandı"

 agot_events_bastard.0994.desc:0 "Piçin isyanı bastırıldı.\n\n[claimant.GetName], hain müttefikleriyle birlikte zindanlarımda oturuyor. Tarihçiler bunun önlenebilir olup olmadığını ya da böyle bir gizliliğin her zaman başarısızlıkla sonuçlanmaya mahkum olup olmadığını tartışacak; ama ne olursa olsun, sonuç kesin.\n\nHouse [ROOT.Char.GetHouse.GetBaseName] hâlâ yönetiyor ve ben hâlâ hüküm sürüyorum!"

 agot_events_bastard.0994.a:0 "Barış nihayet geri dönüyor."

 agot_events_bastard.0995.t:0 "Doğuştan Hakkını İlan Etmek"

 agot_events_bastard.0995.desc:0 "Taht odasının büyük kapılarından adım atıyorum; Demir Taht'ın devasa formu mekana hakim, iki yanda toplanmış sarayın üzerinde yükseliyor. Beni çağırdığını hissediyorum ve kararlı bir adımla karşılık veriyorum.\n\nHer adımda, yanından geçtiğim daha fazla kişi diz çöküyor; yeni efendilerinin önünde eğiliyorlar. Aylar önce birçoğu sorgulamış olsa da, artık hiçbiri meşruiyetime meydan okumaya cesaret edemiyor.\n\nTahta doğru ilk adımlarımı atarken doğuşumun lekesinin yıkandığını hissediyorum ve zirveye ulaştığımda dönüp kılıcımı havaya kaldırarak yeni bir çağ ilan ediyorum!"

 agot_events_bastard.0995.a.king:0 ""I am [ROOT.Char.GetFirstNameNoTooltip] [father_house.GetBaseNameNoTooltip], and I am your King!""

 agot_events_bastard.0995.b.king:0 ""I am [ROOT.Char.GetFirstNameNoTooltip] [mother_house.GetBaseNameNoTooltip], and I am your King!""

 agot_events_bastard.0995.c.king:0 ""I am [ROOT.Char.GetFirstNameNoTooltip] [checking_house.GetBaseNameNoTooltip], and I am your King!""

 agot_events_bastard.0995.a.queen:0 ""I am [ROOT.Char.GetFirstNameNoTooltip] [father_house.GetBaseNameNoTooltip], and I am your Queen!""

 agot_events_bastard.0995.b.queen:0 ""I am [ROOT.Char.GetFirstNameNoTooltip] [mother_house.GetBaseNameNoTooltip], and I am your Queen!""

 agot_events_bastard.0995.c.queen:0 ""I am [ROOT.Char.GetFirstNameNoTooltip] [checking_house.GetBaseNameNoTooltip], and I am your Queen!""

 agot_events_bastard.0995.flavor:0 "Hükümdarlığın uzun ve müreffeh olsun!"

 agot_events_bastard.0995.stay_house:0 "Sen ve varislerin [house|E] [checking_house.GetName]'in bir parçası olmaya devam edeceksiniz"

 become_father_house_head:0 "[king.GetShortUIName|U], [father_house.GetBaseName|V] [house_head|E] olacak"

 become_mother_house_head:0 "[king.GetShortUIName|U], [mother_house.GetBaseName|V] [house_head|E] olacak"

 agot_events_bastard.0996.t:0 "Yeni Bir Gün Doğuyor"

 agot_events_bastard.0996.desc:0 "[claimant.GetFirstName]'in taht odasının kapılarından adım attığını izliyorum; [claimant.GetHerHis] başında taç. Kendinden emin gözler yeni bir çağı süzüyor ve her adımda ben de dahil daha fazla kişi yeni efendimizin önünde diz çöküyor.\n\nİçimde bir yerlerde hâlâ bu dünyada yaşadığımıza inanamıyorum; [claimant.GetSheHe]'in [claimant.GetHerHis] ebeveynliğinin gerçeğini bilmediği zamanlar o kadar uzak değil. Yine de benim bizi soktuğum yol sayesinde, [claimant.GetPrimaryTitle.GetName]'de yeni bir gün doğuyor."

 agot_events_bastard.0996.a:0 "Şu anda [claimant.GetSheHe]'in ne hissettiğini merak ediyorum..."

 agot_events_bastard.0996.b:0 "Yaşasın [claimant.GetNameNoTooltip]!"

 agot_events_bastard.0998.t:0 "Kraliyet Fermanı Uygulandı"

 agot_events_bastard.0998.desc_execute:0 "Savaş kazanıldı ve [claimant.GetName] artık merhametimize kalmış durumda. Hüküm, ferman edildiği gibi infaz edilecek."

 agot_events_bastard.0998.desc_send_to_order:0 "Savaş kazanıldı. [claimant.GetName], [claimant.GetHerHis] sahte iddialarından arındırılacak ve ferman edildiği gibi hizmete gönderilecek."

 agot_events_bastard.0998.desc_imprison:0 "Savaş kazanıldı. [claimant.GetName] zaten zincirlerde — ferman kılıçla uygulandı."

 agot_events_bastard.0998.desc_bring_to_court:0 "Savaş kazanıldı. [claimant.GetName], ferman edildiği gibi, yakından izleyebileceğimiz saraya getirilecek."

 agot_events_bastard.0998.desc_give_up_claims:0 "Savaş kazanıldı. [claimant.GetName], ferman edildiği gibi taht üzerindeki tüm iddialarından feragat edecek."

 agot_events_bastard.0998.desc_default:0 "Savaş kazanıldı. Fermanımız uygulanacak."

 agot_events_bastard.0998.a:0 "Adalet yerini buldu."

 agot_events_bastard.0999.t:0 "Taç Yenildi"

 agot_events_bastard.0999.desc:0 "Tüm olasılıklara rağmen, Tacın fermanını uygulama girişimine karşı galip geldik. Demir Taht'ın orduları geri püskürtüldü ve özgürlüğümüzü kazandık — yaşanan sıkıntılar için uygun tazminatlarla birlikte."

 agot_events_bastard.0999.a:0 "Adaletsiz hiçbir fermana boyun eğmeyiz."

 agot_events_bastard.1001.t:0 "Talepler Kabul Edildi"

 agot_events_bastard.1001.desc.jon:0 "[reveal_scope.GetFirstName] ve Eddard'ın önüme getirilmesini izliyorum. Korkak, iğrenç ejderha dölünün yanında tahtın önüne getirilirken gözlerimin içine bile bakmıyor.\n\n"For the crimes of harboring a Targaryen, a known threat to the realm—" As the charges and decrees are read I find myself unable to hear the words. My heart is pounding in my head. Rage boiling inside. I feel an inferno building in my body, my skin buzzing and alive with wrath. I don't notice myself standing, only realizing I am descending from the throne when I am halfway down it.\n\nWithout waiting for the judgment to finish, I take one of the Kingsguard's swords from their sheaths as I pass, and with a swing and a yell, I cleave Eddard Stark's head clean from his body, the swordpoint cracking the stonework beneath. [reveal_scope.GetFirstNameNoTooltip] cries out in horror before I silence [reveal_scope.GetHerHim] too with an upwards swing, blood and stonework arching in a glorious crimson and marble display.\n\nI stand there amidst the gore, Targaryen blood once again coating the ground of the court. Looking down at my one-time friend's lifeless eyes, I find no peace. The rage has not abated. Lyanna is still not here. The looks in my courtiers' eyes are the same I saw in the Mad King's court, and I wonder how it came to this."

 agot_events_bastard.1001.desc:0 "[reveal_scope.GetFirstName] ve [reveal_employer.GetFirstName]'in önüme ve tüm sarayın önüne getirilmesini izliyorum. Adalet Bakanım suçlamaları okumaya başlıyor ve olacaklar karşısında buna neden razı olduklarını merak ediyorum.\n\n"For the crimes of harboring a known threat to the realm, and for proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to focus on the words. Was it right to execute two for no direct action? What must be going through their minds in this moment? Yet as I am considering this, the proclamation is finished. The executioner steps up, and with a clean swing, removes the head of one, then the next. I may have private doubts, and the realm will react how it may."

 agot_events_bastard.1001.a:0 "Her neyse, bu mesele çözüldü."

 agot_events_bastard.1002.t:0 "Talepler Kabul Edildi"

 agot_events_bastard.1002.desc.jon:0 "[reveal_scope.GetFirstName]'in zincirlerle önüme getirilmesini izliyorum. İğrenç ejderha dölü, gözlerimin içinden ve ötesinden bakıyormuş gibi bana doğru bakıyor. Artık gerçeği bildiğime göre, [reveal_scope.GetHerHim]'de Rhaegar'ın çizgilerini nasıl hiç göremediğimi merak ediyorum.\n\n"For the crimes of proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to hear the words. My heart is pounding in my head. Rage boiling inside. I feel an inferno building in my body, my skin buzzing and alive with wrath. I don't notice myself standing, only realizing I am descending from the throne when I am halfway down it.\n\nWithout waiting for the judgment to finish, I take one of the Kingsguard's swords from their sheaths as I pass, and with a swing and a yell, I cleave the bastard's head clean from [reveal_scope.GetHerHis] body, the swordpoint cracking the stonework beneath. The court cries out in horror, but I cannot hear it over the sound of my own blood rushing through my head.\n\nI stand there amidst the gore, Targaryen blood once again coating the ground of the court. I look down at [reveal_scope.GetFirstNamePossessiveNoTooltip] lifeless eyes, and I find no peace. The rage has not abated. Lyanna is still not here. The looks in my courtiers' eyes are the same I saw in the Mad King's court, and I wonder how it came to this."

 agot_events_bastard.1002.desc:0 "[reveal_scope.GetFirstName]'in zincirlerle önüme getirilmesini izliyorum. Adalet Bakanım suçlamaları okumaya başlıyor ve olacaklar karşısında buna neden razı olduklarını merak ediyorum.\n\n"For the crimes of proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to focus on the words. Was it right to execute a baseborn for no directly treasonous action? What must be going through [reveal_scope.GetHerHis] mind in this moment? Yet as I am considering this, the proclamation is finished. The executioner steps up, and with one clean swing, removes the head of [reveal_scope.GetFullName]. I may have private doubts, and the realm will react how it may."

 agot_events_bastard.1002.a:0 "Her neyse, bu mesele çözüldü."

 agot_events_bastard.1003.t:0 "Talepler Kabul Edildi"

 agot_events_bastard.1003.desc.male:0 "Kara kanatlar bu kez kara sözler değil, barış sözleri taşıyor. Yatak odamdan zar zor çıkmışken Kara Kale'den gelen kuzgundan haberdar ediliyorum. Görünüşe göre [reveal_scope.GetFullName], talimat verildiği gibi kendini sunmuş ve Gece Nöbeti'nin görevlerini yerine getirmeye yemin etmiş. En önemlisi, toprak tutmamaya ve çocuk sahibi olmamaya.\n\nBu şaşırtıcı meselenin kan dökülmeden çözülmüş olmasına rahat bir nefes alıyorum ve dondurucu kuzeyde sorun çıkarması pek olası değil. Topraklar rahat edebilir, [reveal_scope.GetFirstName] benden korkmadan yaşayabilir ve ben de bu dikenim olmadan hüküm sürerim."

 agot_events_bastard.1003.desc.female:0 "Kara kanatlar bu kez kara sözler değil, barış sözleri taşıyor. Yatak odamdan zar zor çıkmışken Oldtown'daki ana manastırdan gelen kuzgundan haberdar ediliyorum. Görünüşe göre [reveal_scope.GetFullName], talimat verildiği gibi kendini sunmuş ve bir sessiz kız kardeşin kutsal ve karanlık görevlerini yerine getirmeye yemin etmiş. En önemlisi, sessizlik içinde hizmet etmeye ve koca almamaya.\n\nBu şaşırtıcı meselenin kan dökülmeden çözülmüş olmasına rahat bir nefes alıyorum ve Kızkardeşlik'in kollarında sorun çıkarması pek olası değil. Topraklar rahat edebilir, [reveal_scope.GetFirstName] benden korkmadan yaşayabilir ve ben de bu dikenim olmadan hüküm sürerim."

 agot_events_bastard.1003.a:0 "Bu mesele de böylece çözülmüş oldu."

 agot_events_bastard.1004.t:0 "Talepler Kabul Edildi"

 agot_events_bastard.1004.desc.jon:0 "[reveal_scope.GetFirstName]'in zincirlerle önüme getirilip taht odasının soğuk mermerine itilmesini izliyorum. Ejderha dölü, gözlerimin içinden ve ötesinden bakıyormuş gibi bana doğru bakıyor. Artık gerçeği bildiğime göre, [reveal_scope.GetHerHim]'de Rhaegar'ın çizgilerini nasıl hiç görmediğimi merak ediyorum.\n\n"For the crimes of proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to hear the words. Those eyes though....they look just like Lyanna's. For years I couldn't remember what she looked like, and just now I remember a piece for the first time in over a decade. Those are Lyanna's eyes. I hear my heart beat in my head, and only by the silence do I realize that the proclamation is over.\n\nWithout word from me, the guards begin to usher [reveal_scope.GetHerHim] towards the dungeon, and as [reveal_scope.GetSheHe] rises I find my memory stolen again. Lyanna's eyes perhaps, but that bearing is Targaryen. What I do with [reveal_scope.GetHerHim] is up to me now."

 agot_events_bastard.1004.desc:0 "[reveal_scope.GetFirstName]'in zincirlerle önüme getirilip taht odasının soğuk mermerine itilmesini izliyorum. Adalet Bakanım suçlamaları okumaya başlıyor ve buna neden razı olduklarını merak ediyorum.\n\n"For the crimes of proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to hear the words. I'm searching [reveal_scope.GetHerHis] eyes, seeking the motive behind [reveal_scope.GetHerHis] surrender. Was it cowardice, or a desire for peace? Perhaps this is part of some larger ploy? Only by the silence do I realize that the proclamation is over.\n\nWithout word from me, the guards begin to usher [reveal_scope.GetHerHim] towards the dungeon, and as [reveal_scope.GetSheHe] rises I find myself thinking on more practical concerns. What I do with [reveal_scope.GetHerHim] is up to me now."

 agot_events_bastard.1004.a:0 "En azından artık [reveal_scope.GetSheHe]'in ne yaptığını biliyorum."

 agot_events_bastard.1005.t:0 "Talepler Kabul Edildi"

 agot_events_bastard.1005.desc.jon:0 "[reveal_scope.GetFirstName]'in sarayın tamamının gözü önünde önüme getirilmesini izliyorum; taht odasının soğuk mermerinde diz çökmüş, ben [reveal_scope.GetHerHim]'in üzerinde başkanlık ediyorum. Sevgili Lyanna'm ile düşmanım Rhaegar'ın dölü, yeminleri kusursuz bir ezberle okuyor ve artık gerçeği bildiğime göre, [reveal_scope.GetHerHim]'de Rhaegar'ın çizgilerini nasıl hiç görmediğimi merak ediyorum.\n\n"- do so swear fealty to you and your heirs as rulers of the [ROOT.Char.GetPrimaryTitle.GetName]." As [reveal_scope.GetHerHis] oaths are finished and [reveal_scope.GetSheHe] rises I find myself shocked. Those eyes look just like Lyanna's. For years I couldn't remember what she looked like, and just now I remember a piece for the first time in over a decade. Those are Lyanna's eyes.\n\nWithout word from me, [reveal_scope.GetSheHe] steps out of the procession and into the thrum of court. Lyanna's eyes perhaps, but that bearing is Targaryen. What I do with [reveal_scope.GetHerHim] is up to me now."

 agot_events_bastard.1005.desc:0 "[reveal_scope.GetFirstName]'in sarayın tamamının gözü önünde önüme getirilmesini izliyorum; taht odasının soğuk mermerinde diz çökmüş, ben [reveal_scope.GetHerHim]'in üzerinde başkanlık ediyorum.\n\n"- do so swear fealty and loyalty to you and your heirs as the just rulers of the [ROOT.Char.GetPrimaryTitle.GetName]." As the oaths are finished and [reveal_scope.GetSheHe] rises I find myself searching [reveal_scope.GetHerHis] eyes, seeking the motive behind [reveal_scope.GetHerHis] surrender. Was it cowardice, or a desire for peace? Perhaps this is part of some larger ploy? Only by the silence do I realize that the swearing is over.\n\nWithout word from me, [reveal_scope.GetSheHe] steps out of the procession and into the thrum of court, joining their fellow courtiers."

 agot_events_bastard.1005.a:0 "Onurlandırmak, görmezden gelmek ya da uygun gördüğüm gibi kullanmak."

 agot_events_bastard.1005.b:0 "[reveal_scope.GetFirstNameNoTooltip] ünlü bir savaşçı; neden [reveal_scope.GetHerHim]'i Kral Muhafızları'ma davet etmiyorum?"

 agot_events_bastard.1005.c:0 "Öyleyse zindana!"

 agot_events_bastard.1005.d:0 "Onları House [reveal_scope.GetHouse.GetBaseName]'in gerçek bir üyesi olarak karşılayacağım"

 agot_events_bastard.1006.opening:0 "Westeros'un Tüm Lordlarına ve Leydilerine,"

 agot_events_bastard.1006.desc:0 "Ben, [reveal_scope.GetFullName], Eski ve Yeni Tanrılar huzurunda, [ruler_scope.GetPrimaryTitle.GetName] ve ilgili unvanları üzerindeki her türlü iddiadan feragat ediyorum. Doğumum gerçek olabilir, ama bu, konumumu ya da haklarımı hiçbir şekilde değiştirmez ve ben asla aksini iddia etmedim. [ruler_scope.GetFullName] tek yasal ve meşru hükümdardır ve ben [ruler_scope.GetHerHis] sadık tebaasından başka bir şey değilim."

 agot_events_bastard.1006.a:0 "Öyleyse barış."
