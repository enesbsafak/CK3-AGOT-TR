### TODO NOT-IN-ST: agot_events_bastard.0970.desc_execution_both [AGOT: Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has not just demanded [reveal_scope.GetFirstNamePossessive] head, but my own as well!\n\nThis incredible demand has echoed across the realm as evidence of [ruler_scope.GetTitledFirstNamePossessiveNoTooltip] tyranny, yet the fact remains that it is a royal decree. I could not possibly acquiesce to this demand, could I? And yet, if I do not, the realm will surely bleed.\n\nWhat shall it be, two heads, or thousands?]
 agot_events_bastard.0970.desc_execution_both:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has not just demanded [reveal_scope.GetFirstNamePossessive] head, but my own as well!\n\nThis incredible demand has echoed across the realm as evidence of [ruler_scope.GetTitledFirstNamePossessiveNoTooltip] tyranny, yet the fact remains that it is a royal decree. I could not possibly acquiesce to this demand, could I? And yet, if I do not, the realm will surely bleed.\n\nWhat shall it be, two heads, or thousands?"
