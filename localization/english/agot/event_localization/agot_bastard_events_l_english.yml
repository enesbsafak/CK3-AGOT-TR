 agot_events_bastard.0915.desc:0 "[reveal_scope.GetName] is silent for a long time. I can see [reveal_scope.GetHerHis] thoughts dancing across [reveal_scope.GetHerHis] face. Confusion. Happiness. Fear. "So..." [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says "This will change things, won't it?".\n\nWith that, there were plans to be made. [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know, and consequences to face."
