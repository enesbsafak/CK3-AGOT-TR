### TODO NOT-IN-ST: agot_events_bastard.0904.desc [AGOT: I open the letter with the seal of House [sharer.GetHouse.GetBaseName] without ceremony, but as I read the words enclosed my eyes widen in shock.\n\n]
 agot_events_bastard.0904.desc:0 "I open the letter with the seal of House [sharer.GetHouse.GetBaseName] without ceremony, but as I read the words enclosed my eyes widen in shock.\n\n"There is no easy way to say this, so I will say it bluntly," [sharer.GetName] begins after the usual formalities, "[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth."\n\nI drop the parchment onto the group in shock. I want to reject this revelation, scream that it isn't true, but in my heart I know it is. The only question is what to do with it."
### TODO NOT-IN-ST: agot_events_bastard.0904.desc.blind [AGOT: I ask [courtier.GetFirstName] to read me the letter with the seal of House [sharer.GetHouse.GetBaseName] on it, but I may regret that, for as [courtier.GetSheHe] reads the words on the page my blind eyes widen in shock.\n\n]
 agot_events_bastard.0904.desc.blind:0 "I ask [courtier.GetFirstName] to read me the letter with the seal of House [sharer.GetHouse.GetBaseName] on it, but I may regret that, for as [courtier.GetSheHe] reads the words on the page my blind eyes widen in shock.\n\n"There is no easy way to say this, so I will say it bluntly." [courtier.GetFirstNameNoTooltip] begins to read [sharer.GetNamePossessive] words after the usual formalities. "[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth."\n\n"M-my [ROOT.Char.GetLadyLord] I...don't know what to say!" [courtier.GetFirstNameNoTooltip] exclaims as I am stuck in shock. I want to reject this revelation, scream that it isn't true, but in my heart I know it is. The only question is what to do with it."

