 agot_events_bastard.0901.t:0 "Soy Soruları"

 agot_events_bastard.0901.desc:0 "[reveal_scope.GetFirstName]'e her baktığımda, [reveal_scope.GetHerHis] kanının gerçeğini ve bu tür gerçeklerin içerdiği tehlikeleri düşünmeden edemiyorum. [reveal_scope.GetHerHim]'in uzun ve kaygısız bir yaşam sürmesini istesem de, [reveal_scope.GetHerHis] tüm hayatının bir yalan üzerine kurulu olduğunu da kabul etmeliyim. [reveal_scope.GetSheHe]'in, [reveal_scope.GetHerHis] kraliyet kanının gerçeğini asla öğrenmeden yaşayıp ölmesi [reveal_scope.GetHerHim]'e adil değil. Bu adaletsizliğin yazarı olmaya daha fazla dayanamam."

 agot_events_bastard.0901.desc.jon:0 "[reveal_scope.GetFirstName]'e her baktığımda, yapılan vaatleri ve uzun süredir uykuda olan tehlikeleri hatırlıyorum; ama aynı zamanda tüm hayatı bir yalan üzerine kurulu bir çocuk görüyorum. "Promise me Ned..."\n\nNo. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth. I loved my sister, and I love her child as my own. She would not want [reveal_scope.GetHerHim] to have grown up not knowing the truth. Though it pains me, and may pain the realm moreso, I cannot be the author of this injustice any longer."

 agot_events_bastard.0901.a:0 "[reveal_scope.GetFirstNameNoTooltip], sana söylemeliyim, gerçek ebeveynlerin..."

 agot_events_bastard.0901.a.jon:0 "[reveal_scope.GetFirstNameNoTooltip], gerçeğin zamanı geldi. Ben senin baban değilim..."

 agot_events_bastard.0901.b:0 "Hayır, bunun için henüz zamanı değil."

 agot_events_bastard.0901.b.jon:0 "Yine de yapmalıyım. Suçluluğum, yaptığım sözün önüne geçemez."

 agot_events_bastard.0902.t:0 "Şoke Edici Gerçek"

 agot_events_bastard.0902.desc.jon:0 "Babam, kalenin dışında bir gezintiye çıkmamı istiyor; beni, inip oturduğumuz bir meşe koruluğuna götürüyor. Onu hiç bu kadar endişeli görmemiştim — gözlerimin içine bakmakta bile zorlanıyor.\n\nHarrenhal'daki turnuvadan, kız kardeşinden ve yıllar önceki Robert isyanından bahsederek başlıyor. Yıllardır bildiğim bir hikayeyi neden anlattığını merak etmeye başlıyorum; ancak ekstra ayrıntılar eklendikçe bu işin nereye vardığına inanamıyorum.\n\n"There is no easy way to say this, so I will say it bluntly. [ROOT.Char.GetFirstNameNoTooltip], I have lied to you. I am not your father. Your true father was [real_father.GetName], and you were born in a bed of winter roses to my sister, Lyanna Stark. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth."\n\nThe oak leaves rustle in the wind. I want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."

 agot_events_bastard.0902.desc.father:0 "Babam, kalenin dışında bir gezintiye çıkmamı istiyor; beni ormanın derinliklerindeki bir koruya götürüyor. "To not be overheard," he says sternly.\n\nWe dismount and sit. I have never seen him so anxious — he struggles to even look me in the eye."There is no easy way to say this, so I will say it bluntly. [ROOT.Char.GetFirstNameNoTooltip], your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth."\n\nThe leaves rustle in the wind. I want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."

 agot_events_bastard.0902.desc.mother:0 "Annem, beni elimden tutup hizmetkarları göndererek oturma odasına gelmemi istiyor. Onu hiç bu kadar endişeli görmemiştim — gözlerimin içine bakmakta bile zorlanıyor.\n\n\"Bunu söylemenin kolay bir yolu yok, o yüzden açıkça söyleyeceğim. [ROOT.Char.GetFirstNameNoTooltip], gerçek ebeveynlerin [real_mother.GetName] ve [real_father.GetName]. Bu sırrı saklamaya yeminliydim, ama aldatmacayı sürdürmeye kendimi bir türlü ikna edemedim. Korkarım sana bir yükü daha ağırıyla değiştirmekten başka bir şey yapmadım; ama en azından bu gerçekle ne yapacağına artık kendin karar verebilirsin."\n\nBu ifşayı reddetmek, gökyüzüne bunun doğru olmadığını haykırmak istiyorum; ama kalbimin derinliklerinde doğru olduğunu biliyorum. İster şimdi, ister gelecekte, bununla ne yapacağıma karar vermeliyim."

 agot_events_bastard.0902.a:0 "Ondan saklanmayacağım. Tüm dünya bilmeli."

 agot_events_bastard.0902.b:0 "Bu çok fazla! Düşünmek için zamana ihtiyacım var."

 agot_events_bastard.0902.b.flavor:0 "İstersen gerçeği kendin daha sonra açıklayabilirsin."

 agot_events_bastard.0903.t:0 "Soy Soruları"

 agot_events_bastard.0903.desc:0 "[reveal_scope.GetFirstName]'i her düşündüğümde, [reveal_scope.GetHerHis] kanının gerçeğini ve bu tür gerçeklerin içerdiği tehlikeleri hatırlamadan edemiyorum. [reveal_scope.GetHerHim]'in uzun ve kaygısız bir yaşam sürmesini istesem de, [reveal_scope.GetHerHis] tüm hayatının bir yalan üzerine kurulu olduğunu da kabul etmeliyim. [reveal_scope.GetSheHe]'in, [reveal_scope.GetHerHis] kraliyet kanının gerçeğini asla öğrenmeden yaşayıp ölmesi [reveal_scope.GetHerHim]'e adil değil. Bu adaletsizliğin yazarı olmaya daha fazla dayanamam."

 agot_events_bastard.0903.desc.jon:0 "Leydi Lyanna'ya yaptığım vaatleri ve isyandan önce bile Starklara ettiğim yeminleri iyi hatırlıyorum. Belki bu benim vereceğim bir karar değil, ama tüm hayatı bir yalan üzerine kurulu o çocuğu düşünmeden edemiyorum.\n\nHayır. [reveal_scope.GetSheHe]'in, gerçeği asla öğrenmeden yaşayıp ölmesi [reveal_scope.GetHerHim]'e adil değil. Kuşkusuz birçokları bunu benden yana haksızlık sayacak, ama gerçeği açığa çıkarmalıyım. Acıtsa da, ve belki toprakları daha da çok acıtacak olsa da, bu adaletsizliğin yazarı olmaya daha fazla dayanamam."

 agot_events_bastard.0903.a:0 "Doğrudan [reveal_scope.GetFirstNameNoTooltip]'e bir kuzgun göndereceğim."

 agot_events_bastard.0903.b:0 "Toprakların tamamı bunun gerçeğini öğrenmeli!"

 agot_events_bastard.0903.c:0 "Hayır. Gerçek şimdilik gizli kalmalı."

 agot_events_bastard.0904.t:0 "Şoke Edici Gerçek"

 agot_events_bastard.0904.desc:0 "House [sharer.GetHouse.GetBaseName] mührü taşıyan mektubu törensiz açıyorum; ancak içindeki sözcükleri okurken gözlerim şaşkınlıkla irileşiyor.\n\n"There is no easy way to say this, so I will say it bluntly," [sharer.GetName] begins after the usual formalities, "[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth."\n\nI drop the parchment onto the group in shock. I want to reject this revelation, scream that it isn't true, but in my heart I know it is. The only question is what to do with it."

 agot_events_bastard.0904.desc.blind:0 "[courtier.GetFirstName]'den, üzerinde House [sharer.GetHouse.GetBaseName] mührü olan mektubu bana okumasını istiyorum; ancak bundan pişman olabilirim, zira [courtier.GetSheHe] sayfadaki sözcükleri okurken kör gözlerim şaşkınlıkla irileşiyor.\n\n"There is no easy way to say this, so I will say it bluntly." [courtier.GetFirstNameNoTooltip] begins to read [sharer.GetNamePossessive] words after the usual formalities. "[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth."\n\n"M-my [ROOT.Char.GetLadyLord] I...don't know what to say!" [courtier.GetFirstNameNoTooltip] exclaims as I am stuck in shock. I want to reject this revelation, scream that it isn't true, but in my heart I know it is. The only question is what to do with it."

 agot_events_bastard.0904.a:0 "Ondan saklanmayacağım. Tüm dünya bilmeli."

 agot_events_bastard.0904.b:0 "Babama söylemeliyim! Ya da..[father.GetFirstNameNoTooltip]'e."

 agot_events_bastard.0904.b.flavor:0 "Ne yapacağınıza birlikte karar vereceksiniz."

 agot_events_bastard.0904.c:0 "Bu çok fazla! Düşünmek için zamana ihtiyacım var."

 agot_events_bastard.0904.c.flavor:0 "İstersen gerçeği kendin daha sonra açıklayabilirsin."

 agot_events_bastard.0904.d:0 "Bunu ifşa etmeyeceğim. [sharer.GetFirstNameNoTooltip]'in bilmesini sağlamalıyım."

 agot_events_bastard.0904.d.flavor:0 "[sharer.GetFirstName]'den sırrını saklamasını isteyen bir yanıt yazacaksın."

 agot_events_bastard.0905.t:0 "Saklanan Bir Sır...Bilinir mi?"

 agot_events_bastard.0905.desc:0 "Hayatımın en zor konuşmalarından birine hazırlanmıştım. Ne söyleyeceğimi, nasıl bir bakış atacağımı prova etmiştim. Mekanın gizli olacağını doğrulamış ve kimsenin bizi duyamayacağından emin olmuştum.\n\nAncak hikayemi anlatmaya başladığımda [reveal_scope.GetFirstName] beni durdurmak için elini kaldırıyor. "[ROOT.Char.GetFirstName]" [reveal_scope.GetSheHe] begins to say, addressing me by my first name "I already know. I've known for some time. I haven't yet revealed it but...I know." [reveal_scope.GetSheHe] says with a sigh.\n\nSuch a secret kept eating at me for such a long time, and [reveal_scope.GetSheHe] already knew?!"

 agot_events_bastard.0905.desc.actually_parent:0 "Hayatımın en zor konuşmalarından birine hazırlanmıştım. Ne söyleyeceğimi, nasıl bir bakış atacağımı prova etmiştim. Mekanın gizli olacağını doğrulamış ve kimsenin bizi duyamayacağından emin olmuştum.\n\nAncak hikayemi anlatmaya başladığımda [reveal_scope.GetFirstName] beni durdurmak için elini kaldırıyor. "Thank you" [reveal_scope.GetSheHe] begins to say "Thank you for telling me but...I already know. I've known for some time. I haven't yet revealed it but...I know." [reveal_scope.GetSheHe] says with a sigh.\n\nSuch a secret kept eating at me for such a long time, and [reveal_scope.GetSheHe] already knew?!"

 agot_events_bastard.0905.a:0 "Öyleyse sana toprak vereceğim; çocuğum olarak benim adıma hükmedeceksin."

 agot_events_bastard.0905.a.flavor:0 "[reveal_scope.GetFirstName] daha sonraki bir tarihte kendini ifşa etmeye karar verebilir..."

 agot_events_bastard.0905.b:0 "Öyleyse diyara söylemeliyiz!"

 agot_events_bastard.0905.c:0 "Öyleyse bil ki Gece Nöbetçileri senin için tek güvenli yer."

 agot_events_bastard.0905.d:0 "Bilmen yeterli. Onunla ne yapacağın sana kalmış."

 agot_events_bastard.0906.t:0 "Gizli Soy"

 agot_events_bastard.0906.desc.open:0 "Hikayemin sonuna yaklaştığımda [reveal_scope.GetFirstNamePossessive] yüzündeki ıstıraplı ifadeyi görüyorum; [reveal_scope.GetSheHe] bana sözlü bir yanıt vermeden önce uzun bir sessizlik geçiyor. "This changes nothing" [reveal_scope.GetSheHe] says decidedly. "I shall remain as I always have. I am simply [reveal_scope.GetNameNoTooltip]."\n\nI am taken aback by [reveal_scope.GetHerHis] certainty"

 agot_events_bastard.0906.desc.fake:0 "ve [reveal_scope.GetSheHe]'in beni [reveal_scope.GetHerHis] ebeveyni olarak tutmayı seçmesi beni bir ölçüde duygulandırdı; "

 agot_events_bastard.0906.desc.close:0 "ve yine de... tehdit sürüyor.\n\nPragmatik sorunun üstüne, tüm bunların bir başa çıkma mekanizması olup olmadığını ve [reveal_scope.GetSheHe]'in gerçeği dünyaya açıklamakla daha iyi durumda olup olmayacağını merak etmeden edemiyorum."

 agot_events_bastard.0906.a:0 "Yine de sana toprak vereceğim; çocuğum olarak benim adıma hükmedeceksin."

 agot_events_bastard.0906.a.flavor:0 "[reveal_scope.GetFirstName] daha sonraki bir tarihte kendini ifşa etmeye karar verebilir..."

 agot_events_bastard.0906.b:0 "Topraklara #bold mutlaka #!söylemeliyiz!"

 agot_events_bastard.0906.c:0 "Gece Nöbeti'nin senin için tek güvenli yer olduğunu bilmelisin."

 agot_events_bastard.0906.d:0 "Bilmen yeterli. Onunla ne yapacağın sana kalmış."

 agot_events_bastard.0907.t:0 "Sırrım Biliniyor"

 agot_events_bastard.0907.desc:0 "House [sharer.GetHouse.GetBaseName] mührü taşıyan mektubu törensiz açıyorum; ancak içindeki sözcükleri okurken gözlerim şaşkınlıkla irileşiyor.\n\n"There is no easy way to say this, so I will say it bluntly," [sharer.GetName] begins after the usual formalities, "[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception." They continue on with apologies and guidance, but I do not bother to finish. I let out a sigh. So someone else knows.\n\nI quickly burn the parchment in a nearby brazier while I ponder what to do with this. How should I deal with someone else knowing my secret?"

 agot_events_bastard.0907.desc.blind:0 "[courtier.GetFirstName]'den, üzerinde House [sharer.GetHouse.GetBaseName] mührü olan mektubu bana okumasını istiyorum; ancak bundan pişman olabilirim, zira [courtier.GetSheHe] sayfadaki sözcükleri okurken kör gözlerim şaşkınlıkla irileşiyor.\n\n"There is no easy way to say this, so I will say it bluntly." [courtier.GetFirstNameNoTooltip] begins to read [sharer.GetNamePossessive] words after the usual formalities. "[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but-" I hold up my hand to cut [courtier.GetFirstNameNoTooltip] off before [courtier.GetSheHe] is finished.\n\n"M-my [ROOT.Char.GetLadyLord] you...you knew!" [courtier.GetSheHe] exclaims, and I let out a sigh. Now it seems that not one, but two more people know. I must decide how to handle this."

 agot_events_bastard.0907.a:0 "Bu iş kontrolden çıkıyor. Dünya bilmek zorundaysa, onlara ben söyleyeceğim."

 agot_events_bastard.0907.b:0 "Bu gelişmeleri [father.GetFirstNameNoTooltip] ile görüşmeliyim."

 agot_events_bastard.0907.b.flavor:0 "Ne yapacağınıza birlikte karar vereceksiniz."

 agot_events_bastard.0907.c:0 "Hiç ideal değil...Düşünmek için zamana ihtiyacım var."

 agot_events_bastard.0907.c.flavor:0 "İstersen gerçeği daha sonra kendin açıklayabilirsin, ancak [sharer.GetName] işleri kendi eline alabilir..."

 agot_events_bastard.0907.d:0 "[sharer.GetFirstNameNoTooltip]'den sırrımı saklamasını isteyen bir yanıt yazacağım."

 agot_events_bastard.0908.t:0 "İhtiyat Talepleri"

 agot_events_bastard.0908.desc:0 "[reveal_scope.GetFirstName]'e bir mektup göndereli epey oldu; her gün bir yanıt alıp almadığımı ya da topraklara bir duyuru yapılıp yapılmadığını sorsam da, henüz hiçbir haber alamadım.\n\nNihayet, haftalarca süren bekleyişin ardından bir uşak bana bir yanıt aldığımı söylüyor. Ancak beklediğim yanıt değil bu.\n"Dear [ROOT.Char.GetFullName],\nThank you for your letter sharing what you know," [reveal_scope.GetSheHe] begins with indirect language, likely to avoid any incidents should the message be intercepted. "While I thank you for your candor, I must humbly ask that you keep this information to yourself. It is for me to decide when, and if, I shall let these facts be known, and I would ask you to respect my privacy in this regard."\n\n[reveal_scope.GetName] has made [reveal_scope.GetHerHis] choice, at least for now. It is now for me to decide if I shall respect it."

 agot_events_bastard.0908.a:0 "Hayır, topraklara #bold mutlaka #!söylenmeli!"

 agot_events_bastard.0908.b:0 "[reveal_scope.GetHerHis] isteklerine saygı göstereceğim."

 agot_events_bastard.0909.t:0 "Yanıtsız İfşalar"

 agot_events_bastard.0909.desc:0 "[reveal_scope.GetFirstName]'e bir mektup göndereli epey oldu; her gün bir yanıt alıp almadığımı ya da topraklara bir duyuru yapılıp yapılmadığını sorsam da, henüz hiçbir haber alamadım.\n\nNihayet, aylarca süren bekleyişin ve teslimatı garantilemek için gönderilen ikinci bir mektubun ardından, [reveal_scope.GetFirstNameNoTooltip]'in yanıtlamaya tenezzül etmediği gerçeğiyle yüzleşmeliyim. Kendi entrikalarını desteklemek için ya da basitçe korkudan olsun, bildiklerimi yine de paylaşıp paylaşmayacağıma şimdi karar vermeliyim."

 agot_events_bastard.0909.a:0 "Topraklara #bold mutlaka #!söylenmeli!"

 agot_events_bastard.0909.b:0 "Nasıl davranacağı [reveal_scope.GetHerHis] tercihidir; [reveal_scope.GetSheHe] dilediği gibi yapsın."

 agot_events_bastard.0910.t:0 "Soy Danışmaları."

 agot_events_bastard.0910.desc:0 ""Father... [ROOT.Char.GetFirstName]" [reveal_scope.GetFirstName] begins to say "I have received a letter from [sharer.GetFullName]. It says that I am the offspring of [real_mother.GetName] and [real_father.GetName]. I need your guidance now. What should we do?" [reveal_scope.GetSheHe] says, looking truly lost.\n\nSuch a secret kept eating at me for such a long time, and now [sharer.GetFirstNameNoTooltip] would tell [reveal_scope.GetFirstNameNoTooltip] just like that? Regardless, we must now deal with the consequences of their knowledge."

 agot_events_bastard.0910.a:0 "[sharer.GetLadyLord] [sharer.GetFirstNameNoTooltip]'e, [sharer.GetHerHis] ihtiyatını isteyen bir mektup kaleme almalısın."

 agot_events_bastard.0910.a.flavor:0 "[reveal_scope.GetFirstNameNoTooltip]'e, [sharer.GetFirstNameNoTooltip]'den susmasını isteyen bir yanıt yazmasında yardımcı olacaksın."

 agot_events_bastard.0910.b:0 "Ne olursa olsun, artık topraklara söylemeliyiz."

 agot_events_bastard.0910.c:0 "Gece Nöbeti artık senin için tek güvenli yer."

 agot_events_bastard.0911.t:0 "Evlilikteki Yalanlar "

 agot_events_bastard.0911.desc:0 "Lyanna'ya söz verdiğim günden beri bu anın geleceğini biliyordum, ama bu sözleri duymak yine de acıtıyor. "Liar!" I'm called by my beloved Cat, and I can do little but hang my head in shame. "So much for the honor of Eddard Stark! Honorable to everyone but to your wife it seems! I am supposed to be your confidant Ned!" she yells before trailing off " No..." she laughs mirthfully "No, you are more honorable in your vows to me than the world thought apparently." she trails off, her justified outburst calming, and I can think of nothing to say.\n\nShe looks back to me, tears in in her eyes. "Family, Duty, Honor," she says it like a mantra, "I know why you did it, Ned. A part of me is relieved. But damn it, I am your family too! You should have told me. This was not right. What the world thought of us. Of you. What I thought of [secret_target.GetHerHim]." She looks down, now looking ashamed. "This was not right," she repeats finally."

 agot_events_bastard.0911.a:0 ""I'm sorry Cat...""

 agot_events_bastard.0912.t:0 "Soy Soruları"

 agot_events_bastard.0912.desc:0 "[reveal_scope.GetFirstName]'e her baktığımda, [reveal_scope.GetHerHis] kanının gerçeğini ve bu tür gerçeklerin içerdiği tehlikeleri düşünüyorum. [reveal_scope.GetSheHe]'in, [reveal_scope.GetHerHis] tüm hayatının bir yalan üzerine kurulu olduğunu asla öğrenmeden uzun ve kaygısız bir yaşam sürmesi çok olası. [reveal_scope.GetSheHe]'in, [reveal_scope.GetHerHis] kraliyet kanının gerçeğini asla öğrenmeden yaşayıp ölmesi [reveal_scope.GetHerHim]'e adil mi? Belki [reveal_scope.GetHerHim]'e gerçeği söylemeliyim. Ayrıca, bundan fayda da sağlanabilir..."

 agot_events_bastard.0912.a:0 "[reveal_scope.GetFirstNameNoTooltip], gerçek ebeveynlerin..."

 agot_events_bastard.0912.b:0 "Hayır, bu açıklamanın zamanı değil."

 agot_events_bastard.0913.t:0 "Şoke Edici Gerçek"

 agot_events_bastard.0913.desc:0 "[employer.GetFullName], gece geç saatte [employer.GetHerHis] çalışma odasına katılmamı istiyor ve daha önce birkaç kez konuşmuş olsak da, kapıyı açtığımda hâlâ gerginim. İçeri adım attığımda [employer.GetSheHe|U] tuhaf bir şekilde huzursuz görünüyor; ama hiçbir şey beni söyleyecekleri şeye hazırlayamıyor.\n\n"[ROOT.Char.GetFirstName], it is time you knew the truth. Your true parents are [real_mother.GetName] and [real_father.GetName]. This secret was kept hidden from you for some time, and once I found out I believed it only proper that you know."\n\nI want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."

 agot_events_bastard.0913.a:0 "Ondan saklanmayacağım. Tüm dünya bilmeli."

 agot_events_bastard.0913.b:0 "Bu çok fazla! Düşünmek için zamana ihtiyacım var."

 agot_events_bastard.0913.b.flavor:0 "İstersen gerçeği kendin daha sonra açıklayabilirsin."

 agot_events_bastard.0914.t:0 "Bir Gerçek... Bilinen?"

 agot_events_bastard.0914.desc:0 "[reveal_scope.GetFirstName]'den gece geç saatte çalışma odama katılmasını istiyorum ve daha önce birkaç kez konuşmuş olsak da, onları içeri davet etmek için kapıyı açtığımda tepkileri konusunda hâlâ biraz çekingenim.\n\nKonuşmaya başlamadan önce kimsenin bizi duyamayacağını doğruladım; ancak hikayemi anlatmaya başladığımda [reveal_scope.GetFirstNameNoTooltip] beni durdurmak için elini kaldırıyor. "[ROOT.Char.GetFirstNameNoTooltip]" [reveal_scope.GetSheHe] begins to say, addressing me by my first name "I already know. I've known for some time. I haven't yet revealed it but...I know." [reveal_scope.GetSheHe] says with a sigh."

 agot_events_bastard.0914.a:0 "Akrabalığımızın şerefine yine de sana toprak vereceğim."

 agot_events_bastard.0914.a.flavor:0 "[reveal_scope.GetFirstName] daha sonraki bir tarihte kendini ifşa etmeye karar verebilir..."

 agot_events_bastard.0914.b:0 "Öyleyse diyara söylemeliyiz!"

 agot_events_bastard.0914.c:0 "Öyleyse bil ki Gece Nöbetçileri senin için tek güvenli yer."

 agot_events_bastard.0914.d:0 "Bilmen yeterli. Onunla ne yapacağın sana kalmış."

 agot_events_bastard.0915.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0915.desc:0 "[reveal_scope.GetName] uzun süre sessiz kalıyor. Düşüncelerinin [reveal_scope.GetHerHis] yüzünde dans ettiğini görebiliyorum. Kafa karışıklığı. Mutluluk. Korku. "So..." [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says "This will change things, won't it?".\n\nWith that, there were plans to be made. [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know, and consequences to face."

 agot_events_bastard.0916.t:0 "Bir Küçüğün Talebi"

 agot_events_bastard.0916.desc:0 "[reveal_scope.GetName] uzun süre sessiz kalıyor. Düşüncelerinin [reveal_scope.GetHerHis] yüzünde dans ettiğini görebiliyorum. Kafa karışıklığı. Mutluluk. Korku. "So..." [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says "This changes nothing. I am simply [reveal_scope.GetNameNoTooltip], whatever my birth.".\n\nI study [reveal_scope.GetHerHis] face, and [reveal_scope.GetSheHe] seems resolute in [reveal_scope.GetHerHis] answer. Fascinating. Still, I am [reveal_scope.GetHerHis] host, and privy to the secret besides. If I wanted, I could choose how we respond."

 agot_events_bastard.0916.a:0 "Akrabalığımızın şerefine yine de sana toprak vereceğim."

 agot_events_bastard.0916.a.flavor:0 "[reveal_scope.GetFirstName] daha sonraki bir tarihte kendini ifşa etmeye karar verebilir..."

 agot_events_bastard.0916.b:0 "Hayır, topraklara söylemeliyiz!"

 agot_events_bastard.0916.c:0 "Gece Nöbeti senin için tek güvenli yer. Yarın yola çıkacaksın."

 agot_events_bastard.0916.d:0 "Bilmen yeterli. Onunla ne yapacağın sana kalmış."

 agot_events_bastard.0917.t:0 "Soy Soruları"

 agot_events_bastard.0917.desc:0 "Doğrusu, [reveal_scope.GetFirstNamePossessive] soyunu o kadar sık düşünmüyorum. Ama artık ikimiz de [ROOT.Char.GetCurrentLocation.GetCounty.GetName]'deyken, [reveal_scope.GetHerHim]'i şahsen gördüğümde, bunu aklımdan çıkaramıyorum.\n\n[reveal_scope.GetHerHis|U] yüzü onlara gerçekten çok benziyor. [reveal_scope.GetSheHe]'in, [reveal_scope.GetHerHis] kraliyet kanının gerçeğini asla öğrenmeden yaşayıp ölmesi [reveal_scope.GetHerHim]'e adil mi? Belki [reveal_scope.GetHerHim]'e gerçeği söylemeliyim. Ayrıca, bundan fayda da sağlanabilir..."

 agot_events_bastard.0917.a:0 "[reveal_scope.GetFirstName], seninle konuşmam gerekiyor."

 agot_events_bastard.0917.a_tt:0 "[reveal_scope.GetName]'e [reveal_scope.GetHerHis] soyunun gerçeğini anlatacaksın. Burada bir konuk olduğun için, [reveal_scope.GetFirstNamePossessiveNoTooltip] bu bilgiyi kullanımını etkileyemeyeceksin."

 agot_events_bastard.0917.b:0 "Hayır, bu açıklamanın zamanı değil."

 agot_events_bastard.0918.t:0 "Şoke Edici Gerçek"

 agot_events_bastard.0918.desc:0 "[sharer.GetFullName], şu anda [ROOT.Char.GetCurrentLocation.GetCounty.GetName]'i ziyaret eden, bu akşam ilerleyen saatlerde bir yürüyüşe katılmamı nezaketle istiyor. Reddetmek için hiçbir neden göremeyince, [sharer.GetHerHis] davetini kabul ediyorum.\n\n[sharer.GetHerHim] yaklaşırken izlerken, [sharer.GetHerHis] tavrındaki bir şey beni tuhaf bir şekilde gerginleştiriyor. [sharer.GetSheHe|U] tuhaf bir şekilde gergin görünüyor, yine de sorunsuzca yanıma adımlıyor. Bir süre havadan sudan konuşuyoruz; ama kalenin duyulma menzilinden çıktığımızda [sharer.GetSheHe] ciddileşiyor.\n\n"[ROOT.Char.GetFirstName], it is time you knew the truth. Your true parents are [real_mother.GetName] and [real_father.GetName]. I do not know how many people know of this, but seeing you earlier I felt compelled to share it."\n\nI want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."

 agot_events_bastard.0918.a:0 "Ondan saklanmayacağım. Tüm dünya bilmeli."

 agot_events_bastard.0918.b:0 "Bu çok fazla! Düşünmek için zamana ihtiyacım var."

 agot_events_bastard.0918.b.flavor:0 "İstersen gerçeği kendin daha sonra açıklayabilirsin."

 agot_events_bastard.0919.t:0 "Bir Gerçek... Bilinen?"

 agot_events_bastard.0919.desc:0 "[reveal_scope.GetFirstName]'den o akşam ilerleyen saatlerde bir yürüyüşe katılmasını istiyorum ve [reveal_scope.GetHerHim]'i kesinlikle sarsacağından emin olduğum şeyle kıyaslanamasa da, [reveal_scope.GetHerHim]'i beni beklerken gördüğümde [reveal_scope.GetHerHis] tepkisi konusunda hâlâ biraz çekingenim.\n\nKonuşmaya başlamadan önce kimsenin bizi duyamayacağını doğrulamak için omzumu kontrol ettim; ancak hikayemi anlatmaya başladığımda [reveal_scope.GetFirstNameNoTooltip] beni durdurmak için elini kaldırıyor. "[ROOT.Char.GetFirstName]" [reveal_scope.GetSheHe] begins to say "I already know. I've known for some time. I haven't yet revealed it but...I know." [reveal_scope.GetSheHe] says with a sigh. "For my own reasons, I request that you keep this secret to yourself"."

 agot_events_bastard.0919.a:0 "Bu olmaz! Topraklara söyleyeceğim."

 agot_events_bastard.0919.a.flavor:0 "Westeros'taki her saraya mektup göndermek için gizlice sıvışıyorsun.\n@warning_icon!#warning Bu, senin ve toprakların için büyük sonuçlar doğurabilir.#!."

 agot_events_bastard.0919.b:0 "Bilmen yeterli. Onunla ne yapacağın sana kalmış."

 agot_events_bastard.0920.t:0 "Şoke Edici Gerçek"

 agot_events_bastard.0920.desc:0 "Her zamankinden daha geç çalışıyorken çalışma odamın kapısında kısa bir tıklama duyuyorum. "Enter," I say simply, expecting the maids to be checking in on me, but instead [learned_person.GetFirstName] steps through the door. "Forgive me my [ROOT.Char.GetLadyLord|U] I... wanted to find you at a time when we would not be disturbed." [learned_person.GetSheHe|U] says nervously as I put down my quill to give [learned_person.GetHerHim] my full attention.\n\nWith a sigh [learned_person.GetSheHe] begins "Facts have come up in my research. Facts that... have some rather drastic implications for you... and for the realm." [learned_person.GetSheHe] continues, and as [learned_person.GetHerHis] story unfolds I find myself stunned into silence, whatever previous matter I was writing on completely forgotten. [learned_person.GetNameNoTooltip] says that previously undiscovered documents reveal that my true parents are in fact [real_mother.GetName] and [real_father.GetName]!\n\nI do not believe it, and yet as [learned_person.GetFirstNameNoTooltip] lays out the evidence in front of me I am forced to accept that this is indeed reality."

 agot_events_bastard.0920.a:0 "Bu gerçekse, topraklara söylemeliyim."

 agot_events_bastard.0920.b:0 "Bunu istemiyorum. Bu bilgi gizli tutulmalı."

 agot_events_bastard.0951.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0951.first_person:0 "Westeros'un tüm lordlarına, çok uzun süredir gizlenen gerçeği bildirmek için yazıyorum. Ne düşünmüş olursanız olun, ben aslında [real_mother.GetName] ile [real_father.GetName]'in birliğinden doğdum. Sizden ve toprakların geri kalanından, bu yeni gerçeği ve beraberinde getirdiği sonuçları kabul etmenizi istiyorum."

 agot_events_bastard.0951.third_person:0 "Westeros'un tüm lordlarına, çok uzun süredir gizlenen gerçeği bildirmek için yazıyorum. Ne düşünmüş olursanız olun, [reveal_scope.GetName] aslında [real_mother.GetName] ile [real_father.GetName]'in birliğinden doğdu. Sizden ve toprakların geri kalanından, bu yeni gerçeği ve beraberinde getirdiği sonuçları kabul etmenizi istiyorum."

 agot_events_bastard.0951.a:0 "Pekala, bu kesinlikle ilginç."

 agot_events_bastard.0951.b:0 "Bunu ifşa edeceklerine inanamıyorum!"

 agot_events_bastard.0952.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0952.desc:0 "[reveal_scope.GetName] uzun süre sessiz kalıyor. Düşüncelerinin [reveal_scope.GetHerHis] yüzünde dans ettiğini görebiliyorum. Kafa karışıklığı. Mutluluk. Korku. "So..." [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says "This will change things, won't it?".\n\nThere were hugs, there were tears. The family was certainly shocked. But [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know."

 agot_events_bastard.0952.desc.jon:0 "[reveal_scope.GetName] uzun süre sessiz kalıyor. Düşüncelerinin [reveal_scope.GetHerHis] yüzünde dans ettiğini görebiliyorum. Kafa karışıklığı. Mutluluk. Korku. "Lyanna..." [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says "This will change things, won't it?".\n\nThere were hugs, there were tears. The family was certainly shocked. But [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know."

 agot_events_bastard.0953.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0953.desc:0 "[reveal_scope.GetName], [sharer.GetFullName]'den gelen mektubu bana uzattıktan sonra uzun süre sessiz kalıyor. Mektup gerçeği anlatıyor. [reveal_scope.GetFirstNameNoTooltip]'in [real_mother.GetName] ile [real_father.GetName]'den doğduğunu. O kadar uzun süre içimde sakladığım bir sır ki, onlara söyleyebilen bile ben olmadım.\n\nSarılmalar oldu, gözyaşları döküldü. Aile kesinlikle şok olmuştu. Ama [reveal_scope.GetFirstNameNoTooltip] kararını verdi. Topraklar bilecek."

 agot_events_bastard.0954.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0954.desc:0 "[reveal_scope.GetName], [sharer.GetFullName]'den gelen mektubu bana uzattıktan sonra uzun süre sessiz kalıyor. Mektup gerçeği anlatıyor. [reveal_scope.GetFirstNameNoTooltip]'in [real_mother.GetName] ile [real_father.GetName]'den doğduğunu. Daha da kötüsü, kopyalar tüm topraklara gönderilmiş!\n\nO kadar uzun süre içimde sakladığım bir sır ki, onu ifşa edebilen bile ben olmadım.\n\nSarılmalar oldu, gözyaşları döküldü. Bu haklı olarak [reveal_scope.GetHerHis] kararı olmalıydı, ama [sharer.GetFirstNameNoTooltip] bize bu seçeneği bırakmadı. Her ne olursa olsun, olan oldu. Ne benim ne de [reveal_scope.GetFirstNamePossessiveNoTooltip] kararı olsa da, topraklar bilecek."

 agot_events_bastard.0955.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0955.desc:0 "[reveal_scope.GetFirstName]'e bir mektup göndereli epey oldu; her gün bir yanıt alıp almadığımı ya da topraklara bir duyuru yapılıp yapılmadığını sorsam da, henüz hiçbir haber alamadım.\n\nNihayet, haftalarca süren bekleyişin ardından bir uşak bana bir yanıt aldığımı söylüyor.\n\n"Dear [ROOT.Char.GetFullNameNoTooltip]," [reveal_scope.GetSheHe] begins "I thank you for your candor, and I write to you in advance to let you know that I shall be writing to the realm in the coming days revealing that which you told me."\n\nIt seems [reveal_scope.GetNameNoTooltip] has made their choice, and I feel a weight leave my shoulders."

 agot_events_bastard.0955.a:0 "Şimdi onların ve [ruler_scope.GetFirstNameOrMe]'nin nasıl tepki vereceğini görelim..."

 agot_events_bastard.0956.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0956.desc:0 "[revealer.GetFirstNamePossessive] mektubunu aldıktan sonra hayatım ikiye bölündü. Bundan öncesi ve sonrası. Sessiz kalıyorum; önümdekinin artık tüm toprakların önünde olduğunu kabullenemiyorum. Mektup gerçeği anlatıyor. [real_mother.GetName] ile [real_father.GetName]'den doğduğumu. Daha da kötüsü, kopyalar tüm topraklara gönderilmiş!\n\nO kadar uzun süre içimde sakladığım bir sır ki, onu ifşa edebilen bile ben olmadım.\n\nBu haklı olarak benim kararım olmalıydı, ama [sharer.GetFirstNameNoTooltip] bana bu seçeneği bırakmadı. Her ne olursa olsun, olan oldu. Arzum olmasa da, topraklar bilecek."

 agot_events_bastard.0956.a:0 "Şimdi bakalım onlar ve [ruler_scope.GetFirstName] nasıl tepki verecek..."

 agot_events_bastard.0957.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0957.desc:0 "Ellerime bakıyorum ve hayatımın parçalara ayrıldığını hissediyorum. Nefes alamıyorum, görüşümün kararmaya başladığını hissediyorum ve önümdekinin bilincini zorlukla koruyorum. Hayatım ikiye bölündü. Bundan öncesi ve sonrası.\n\nBu mektup gerçeği anlatıyor. [real_mother.GetName] ile [real_father.GetName]'den doğduğumu. Daha da kötüsü, kopyalar tüm topraklara gönderilmiş!\n\nTüm hayatım bir yalanmış. Bana söylenmeliydi! Bu doğru değildi!"

 agot_events_bastard.0957.a:0 "Şimdi bakalım onlar ve [ruler_scope.GetFirstName] nasıl tepki verecek..."

 agot_events_bastard.0958.t:0 "Açığa Çıkan Gerçek"

 agot_events_bastard.0958.desc.bastard:0 "Kuzgunlar gönderildi. Mesajlar iletildi. Gerçek, bilindi.\n\nBöylesine büyük bir sırrı ifşa ettiğim için birçokları bana lanet okuyacak olsa da, iyi ya da kötü, gerçek artık ortalıkta. Belki önümüzdeki günlerde büyük bir rol oynayabilirim. Belki tüm bunlar boşa çıkacak. Her ne olursa olsun, gerçek soyum artık herkesçe kabul edildi; iyi ya da kötü."

 agot_events_bastard.0958.desc.host:0 "Kuzgunlar gönderildi. Mesajlar iletildi. Gerçek, bilindi.\n\nBöylesine büyük bir sırrı ifşa ettiğim için birçokları bana lanet okuyacak olsa da, iyi ya da kötü, gerçek artık ortalıkta. Belki önümüzdeki günlerde büyük bir rol oynayabilirim. Belki tüm bunlar boşa çıkacak. Her ne olursa olsun, [reveal_scope.GetFirstNamePossessive] gerçek soyu artık herkesçe kabul edildi; iyi ya da kötü."

 agot_events_bastard.0958.desc.else:0 "Kuzgunlar gönderildi. Mesajlar iletildi. Gerçek, bilindi.\n\nBöylesine büyük bir sırrı ifşa ettiğim için birçokları bana lanet okuyacak olsa da, iyi ya da kötü, gerçek artık ortalıkta. Belki önümüzdeki günlerde büyük bir rol oynayabilirim. Belki bu, rolümün bittiği yer. Her ne olursa olsun, [reveal_scope.GetFirstNamePossessive] gerçek soyu artık herkesçe kabul edildi; iyi ya da kötü."

 agot_events_bastard.0959.t:0 "Kraliyet Kanından Bir Piç"

 agot_events_bastard.0959.desc_opening:0 "Demir Taht'ta oturuyorum, saray önümde toplanmış, küçük lordlar arasındaki önemsiz bir anlaşmazlıkta hüküm veriyorum; ta ki [courtier.GetFullName] bir çığlıkla kapıdan içeri dalana dek: "Your Grace!".\n\n"What is the meaning of this interruption?!""

 agot_events_bastard.0959.desc_opening_wrathful:0 "Saray, soluk soluğa kalan [courtier.GetFirstNameNoTooltip]'e dönerken bağırıyorum. [courtier.GetSheHe|U] hızla tahtın önüne adımlayıp diz çöküyor.\n\n"

 agot_events_bastard.0959.desc_opening_not_wrathful:0 "[council.GetName], saray soluk soluğa kalan [courtier.GetFirstNameNoTooltip]'e dönerken bağırıyor. [courtier.GetSheHe|U] hızla tahtın önüne adımlayıp diz çöküyor.\n\n"

 agot_events_bastard.0959.desc_opening_end:0 ""I'm terribly sorry for the intrusion your Grace, but you must read this immediately!" [courtier.GetSheHe] says, offering a parchment with the seal of House [revealer.GetHouse.GetBaseName].\n\n"

 agot_events_bastard.0959.desc.landed:0 "Başmaester mektubu okurken şaşkınlığımı gizleyemiyorum. Mektup, [reveal_scope.GetFullName]'in aslında [real_father.GetFullName] ile [real_mother.GetFullName]'in [reveal_scope.Custom('GetDaughterSon')] olduğunu iddia ediyor! Daha da kötüsü, kopyaların tüm topraklara gönderilmiş olması muhtemel!"

 agot_events_bastard.0959.desc.courtier:0 "Başmaester mektubu okurken şaşkınlığımı gizleyemiyorum. Mektup, şu anda [reveal_employer.GetFullName] sarayında bulunan [reveal_scope.GetName]'in aslında [real_father.GetFullName] ile [real_mother.GetFullName]'in [reveal_scope.Custom('GetDaughterSon')] olduğunu iddia ediyor! Daha da kötüsü, kopyaların tüm topraklara gönderilmiş olması muhtemel!"

 agot_events_bastard.0959.desc.ned_revealer:0 "Başmaester mektubu okurken şaşkınlığımı gizleyemiyorum. Mektup, şu anda [reveal_employer.GetFullName] sarayında bulunan [reveal_scope.GetName]'in aslında [real_father.GetFullName] ile [real_mother.GetFullName]'in [reveal_scope.Custom('GetDaughterSon')] olduğunu iddia ediyor! Daha da kötüsü, kopyaların tüm topraklara gönderilmiş olması muhtemel!\n\n"There is more your Grace." [courtier.GetFirstNameNoTooltip] says, as though any other news could compare, and offers a second parchment. "It addressed to you specifically.""

 agot_events_bastard.0959.desc.robert:0 "Başmaester mektubu okurken şaşkınlığımı gizleyemiyorum. Mektup, şu anda [reveal_employer.GetFullName] sarayında bulunan [reveal_scope.GetName]'in aslında [real_father.GetFullName] ile [real_mother.GetFullName]'in [reveal_scope.Custom('GetDaughterSon')] olduğunu iddia ediyor! Daha da kötüsü, kopyaların tüm topraklara gönderilmiş olması muhtemel!\n\n"There is more your Grace." [courtier.GetFirstNameNoTooltip] says, as though any other news could compare, and offers a second parchment. "It is from Lord Eddard Stark.""

 agot_events_bastard.0959.desc.king_revealer:0 "Kuzgunlar gönderildi, topraklar bilgilendirildi ve beklendiği gibi, sabah Demir Taht'a oturduğumda hüküm vermem istenen ilk mesele bu oldu. [reveal_scope.GetName]'in aslında [real_father.GetFullName] ile [real_mother.GetFullName]'in çocuğu olduğu ifşası gerçekten benim tarafımdan paylaşılmış olsa da, tüm gözler bir sonraki sözcüğümü bekliyor. \n\nYani, bu ifşayla ilgili nasıl hüküm vereceğim?"

 agot_events_bastard.0959.robert:0 "Öyleyse ver onu!"

 agot_events_bastard.0959.a:0 "Bu hak iddia edene güçle yanıt vermeliyim!"

 agot_events_bastard.0959.a.flavor:0 "Bu mesele hakkında sert hüküm vereceksin."

 agot_events_bastard.0959.b:0 "Yanıt vermeliyim, ama aceleci olmayalım."

 agot_events_bastard.0959.b.flavor:0 "Bu mesele hakkında hafif hüküm vereceksin."

 agot_events_bastard.0959.c:0 "Bu önemli değil. Bu konuda hiçbir şey söylemeyeceğim."

 agot_events_bastard.0959.c_order:0 "[reveal_scope.GetHerHis] yeminleriyle [reveal_scope.GetSheHe]'in gerçek bir hakkı yok."

 agot_events_bastard.0959.c.flavor:0 "Bu gelişmeye yanıt vermeyeceksin."

 agot_events_bastard.0960.t:0 "Bir Dosttan Yalvarış"

 agot_events_bastard.0960.desc.ned_revealer:0 "İkinci mektup elime tutuşturulurken kalbimin battığını hissediyorum; Stark Hanedanı'nın mührünü titreyen parmaklarla açıyorum. "Oldest Friend," it begins, and already I can feel my throat close with emotion.\n\n"I know you better than anyone, and I know the rage, sorrow, and betrayal that this news has foisted on your heart. For this, I am sorry beyond words. I had long wished to tell you in better circumstances, but I could live with the lie no longer." I feel my fists clench as I continue to read, trying and failing to not bare my heart in front of the court.\n\n"Despite this, I hope that I may still reach out to and regard you as a friend. Perhaps I do not deserve to entreat you as such anymore, but for the love I bear both you and my sister's child I must try. I know you Robert, and I know well your wrath. Well did we both love Lyanna, and it is in her name I ask you to show mercy. This is not the last of the dragonspawn, but the last of a woman we both loved. For the sake of her memory, please show mercy to her child.\nEver your friend, Eddard Stark."\n\nI blink the tears nearly formed in my eyes away and the court comes into focus. They are waiting for my answer."

 agot_events_bastard.0960.desc:0 "İkinci mektup elime tutuşturulurken kalbimin battığını hissediyorum; Stark Hanedanı'nın mührünü titreyen parmaklarla açıyorum. "Oldest Friend," it begins, and already I can feel my throat close with emotion.\n\n"I know you better than anyone, and I know the rage, sorrow, and betrayal that this news has foisted on your heart. For this, I am sorry beyond words. I had long wished to tell you in better circumstances, but circumstances have moved beyond my control." I feel my fists clench as I continue to read, trying and failing to not bare my heart in front of the court.\n\n"Despite this, I hope that I may still reach out to and regard you as a friend. Perhaps I do not deserve to entreat you as such anymore, but for the love I bear both you and my sister's child I must try. I know you Robert, and I know well your wrath. Well did we both love Lyanna, and it is in her name I ask you to show mercy. This is not the last of the dragonspawn, but the last of a woman we both loved. For the sake of her memory, please show mercy to her child.\nEver your friend, Eddard Stark."\n\nI blink the tears nearly formed in my eyes away and the court comes into focus. They are waiting for my answer."

 agot_events_bastard.0960.a:0 "Hiçbir adam böyle bir ihaneti yaşamamıştır!"

 agot_events_bastard.0960.b.son:0 "Öfkem sınırsız, ama Lyanna'nın bebeğini katletmeyeceğim."

 agot_events_bastard.0960.b.daughter:0 "Öfkem sınırsız, ama Lyanna'nın kızını katletmeyeceğim."

 agot_events_bastard.0960.c:0 "O kadar uzun yıllar oldu ki... Sevdiğim insanlara karşı harekete geçmeyeceğim."

 agot_events_bastard.0960.c.flavor:0 "Bu gelişmeye yanıt vermeyeceksin."

 agot_events_bastard.0961.t:0 "Sert Bir Yanıt"

 agot_events_bastard.0961.desc:0 "Elime tutuşturulan parşömenden başımı kaldırıp bir umut dolu yüz denizine bakıyorum. Nasıl yanıt vereceğimi, nasıl hüküm vereceğimi bekliyorlar. Taht üzerinde böylesine pervasız bir iddia, en ılımlı hükümdarlara bile bir yanıt gerektirir — ve ben ılımlı değilim.\n\nPeki, bu üstü kapalı meydan okumaya nasıl karşılık vermeliyim?"

 agot_events_bastard.0961.a:0 "İkisinin de kafalarını kazıklara dikeceğim!"

 agot_events_bastard.0961.a.flavor:0 "Hem [reveal_scope.GetFirstName]'in hem de [reveal_employer.GetFirstNamePossessive] kafalarını talep edeceksin!"

 agot_events_bastard.0961.b:0 "[reveal_scope.GetHerHis] kafasını isteyeceğim!"

 agot_events_bastard.0961.c.nw:0 "Gece Nöbeti'ne katılacak! Ancak o zaman yaşayabilir!"

 agot_events_bastard.0961.c.ss:0 "Kızkardeşlik'e katılmalı! Ancak o zaman yaşayabilir!"

 agot_events_bastard.0961.d:0 "Böyle bir kan için tek güvenli yer benim zindanımdır!"

 agot_events_bastard.0962.t:0 "Ilımlı Bir Yanıt"

 agot_events_bastard.0962.desc:0 "Elime tutuşturulan parşömenden başımı kaldırıp bir umut dolu yüz denizine bakıyorum. Nasıl yanıt vereceğimi, nasıl hüküm vereceğimi bekliyorlar. Böyle bir iddia kuşkusuz bir tehdit oluştursa da, [reveal_scope.GetName] henüz bana karşı harekete geçmedi ve sanki geçmiş gibi cezalandırılmayı hak etmiyor. Peki, bu habere nasıl karşılık vermeliyim?"

 agot_events_bastard.0962.a.nw:0 "Günlerini Sur'da geçirmesine izin verilecek."

 agot_events_bastard.0962.a.ss:0 "Sessiz Kız Kardeşler'e katılmasına izin verilecek."

 agot_events_bastard.0962.b:0 "[reveal_scope.GetSheHe|U] tutuklanmalı."

 agot_events_bastard.0962.c:0 "[reveal_scope.GetName], yeni konumunu kayda geçirmek üzere saraya katılabilir."

 agot_events_bastard.0962.d:0 "[reveal_scope.GetName], iddiası olmadığını beyan etmeli; bu yeterli."

 agot_events_bastard.0963.t:0 "Yeni Bir [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] mi?"

 agot_events_bastard.0963.t_unchanged_dynasty:0 "$agot_events_bastard.0959.t$"

 agot_events_bastard.0963.desc.jon:0 "Tahtta oturuyorum, her zamanki gibi hüküm veriyorum; ta ki House [revealer.GetHouse.GetBaseName] mührüyle bana tuhaf bir haber sunulana dek. Okurken gözlerim şaşkınlıkla irileşiyor.\n\nGörünüşe göre [reveal_scope.GetFullName], tıpkı benim gibi [reveal_scope.GetDynasty.GetBaseName] kanından! Gasıp Savaşı sırasında [real_father.GetFullName] ile [real_mother.GetFullName]'in birliğinden doğan [reveal_scope.GetSheHe], artık kraliyet soyundan olduğu biliniyor!\n\nElime tutuşturulan parşömenden başımı kaldırıp bir umut dolu yüz denizine bakıyorum. Bu aile dramasına nasıl yanıt vereceğimi bekliyorlar. Böyle bir iddia kuşkusuz bir tehdit oluştursa da, [reveal_scope.GetNameNoTooltip] bana karşı harekete geçmedi ve aslında — gayrimeşru olsun ya da olmasın — akrabam. Peki, bu habere nasıl karşılık vermeliyim?"

 agot_events_bastard.0963.desc.my_son:0 "Tahtta oturuyorum, her zamanki gibi hüküm veriyorum; ta ki House [revealer.GetHouse.GetBaseName] mührüyle bana şok edici bir haber sunulana dek. Okurken gözlerim irileşiyor ve çenem neredeyse yere düşüyor.\n\nGörünüşe göre [reveal_scope.GetFullName], aslında benim öz çocuğum! [real_mother.GetFullName] ile olan birliğimden doğan [reveal_scope.GetSheHe], artık tüm topraklarca kraliyet soyundan olduğu biliniyor.\n\nElime tutuşturulan parşömenden başımı kaldırıp bir umut dolu yüz denizine bakıyorum. Bu aile dramasına nasıl yanıt vereceğimi bekliyorlar. Bilinmeyen bir oğlun ortaya çıkışı kuşkusuz gücüme karşı bir tehdit oluştursa da, [reveal_scope.GetNameNoTooltip] bana karşı harekete geçmedi. Peki, bu habere nasıl karşılık vermeliyim?"

 agot_events_bastard.0963.desc.my_daughter:0 "Tahtta oturuyorum, her zamanki gibi hüküm veriyorum; ta ki House [revealer.GetHouse.GetBaseName] mührüyle bana şok edici bir haber sunulana dek. Okurken gözlerim irileşiyor ve çenem neredeyse yere düşüyor.\n\nGörünüşe göre [reveal_scope.GetFullName], aslında benim öz çocuğum! [real_mother.GetFullName] ile olan birliğimden doğan [reveal_scope.GetSheHe], artık tüm topraklarca kraliyet soyundan olduğu biliniyor.\n\nElime tutuşturulan parşömenden başımı kaldırıp bir umut dolu yüz denizine bakıyorum. Bu aile dramasına nasıl yanıt vereceğimi bekliyorlar. Bilinmeyen bir kızın ortaya çıkışı kuşkusuz gücüme karşı bir tehdit oluştursa da, [reveal_scope.GetNameNoTooltip] bana karşı harekete geçmedi. Peki, bu habere nasıl karşılık vermeliyim?"

 agot_events_bastard.0963.desc_unchanged_dynasty:0 "Tahtta oturuyorum, her zamanki gibi hüküm veriyorum; ta ki House [revealer.GetHouse.GetBaseName] mührüyle bana tuhaf bir haber sunulana dek. Okurken gözlerim şaşkınlıkla irileşiyor.\n\nGörünüşe göre [reveal_scope.GetFullName], [real_mother.GetFullName] aracılığıyla zaten benim hanemden olan biri, artık şüpheye yer bırakmayacak şekilde [reveal_scope.GetDynasty.GetBaseName] kanını tam olarak taşıdığı kanıtlandı. [real_father.GetFullName] ile [real_mother.GetFullName]'den doğan [reveal_scope.GetSheHe], yalnızca adıyla değil, her iki soy kanıyla da akraba duruyor.\n\nElime tutuşturulan parşömenden başımı kaldırıp bir umut dolu yüz denizine bakıyorum. Bu aile dramasına nasıl yanıt vereceğimi bekliyorlar. Böyle bir iddia kuşkusuz bir tehdit oluştursa da, [reveal_scope.GetNameNoTooltip] bana karşı harekete geçmedi ve aslında — gayrimeşru olsun ya da olmasın — akrabam. Peki, bu habere nasıl karşılık vermeliyim?"

