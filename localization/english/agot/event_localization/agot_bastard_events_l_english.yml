 agot_events_bastard.0970.t_nothing:0 "Haber Yoksa, İyi Haber mi?"

 agot_events_bastard.0970.desc_execution_both:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U] yalnızca [reveal_scope.GetFirstNamePossessive] kafasını değil, benimkini de talep etti!\n\nBu inanılmaz talep, [ruler_scope.GetTitledFirstNamePossessiveNoTooltip] zulmünün kanıtı olarak topraklarda yankılandı; yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı olmam asla söz konusu olamaz, değil mi? Ve yine de, razı olmazsam topraklar kesinlikle kanayacak.\n\nNe olacak; iki kafa mı, yoksa binlerce mi?"

 agot_events_bastard.0970.desc_execution_bastard:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], taç adına derhal alınmak üzere [reveal_scope.GetFirstNamePossessive] kafasını talep etti.\n\nBu sert talep topraklarda yankılandı; sertliği birçoklarını rahatsız etti, yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı oluyor muyum? Olabilir miyim? Ve yine de, razı olmazsam topraklar kesinlikle kanayacak.\n\nNe olacak; bir kafa mı, yoksa binlerce mi?"

 agot_events_bastard.0970.desc_send_to_nw:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], [reveal_scope.GetFirstName]'in, günlerini dondurucu kuzeyde geçirmek üzere Gece Nöbeti'ne gönderilmesini talep etti.\n\nBu talep topraklarda yankılandı; sertliği birçoklarını tedirgin etti, yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; bir can mı, yoksa binlerce mi?"

 agot_events_bastard.0970.desc_send_to_ss:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], [reveal_scope.GetFirstName]'in, günlerini dini hizmette geçirmek üzere Sessiz Kızkardeşler'e gönderilmesini talep etti.\n\nBu talep topraklarda yankılandı; sertliği birçoklarını tedirgin etti, yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; bir can mı, yoksa binlerce mi?"

 agot_events_bastard.0970.desc_imprison:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], [reveal_scope.GetFirstName]'in, günlerini zincirlerde geçirmek üzere [ruler_scope.GetHerHis] zindanına gönderilmesini talep etti.\n\nBu talep topraklarda yankılandı ve bir kraliyet fermanının gücünü taşıyor. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; bir can mı, yoksa binlerce mi?"

 agot_events_bastard.0970.desc_bring_to_court:0 "House [ruler_scope.GetHouse.GetBaseName] mührünü taşıyan bir mektup geldi. [ruler_scope.GetName]'den gelen mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], [reveal_scope.GetFirstName]'in, günlerini bir saray mensubu olarak geçirmek üzere kendi gözetimi altında yaşaması için kendi kalemden başkente taşınmasını talep etti.\n\nBu talep topraklarda yankılandı ve bir kraliyet fermanının gücünü taşıyor. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; bir saray mensubu mu, yoksa barış mı?"

 agot_events_bastard.0970.desc_give_up_claims:0 "House [ruler_scope.GetHouse.GetBaseName] mührünü taşıyan bir mektup geldi. [ruler_scope.GetName]'den gelen mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetName], [ruler_scope.GetHerHis] merhametiyle, [reveal_scope.GetFirstName]'in, ifşa edilen soyunun temsil edebileceği her türlü iddiadan feragat eden kamusal ve yasal bir beyanda bulunmasını talep etti.\n\nBu talep topraklara gönderildi ve birçokları bunun son gelişmelere adil bir yanıt olduğuna inanıyor. Yine de, kader çarkı dönerse haklı olarak kendilerine ait olan iddialardan vazgeçmek, birinin onuru üzerinde bir lekedir.\n\nÖyleyse ne olacak; gurur mu, yoksa barış mı?"

 agot_events_bastard.0970.desc_nothing:0 "Günler ve geceler boyunca [ruler_scope.GetName]'in bu ifşalara yanıt olarak ne yapabileceği konusunda endişelendim ve gerildim; ancak [reveal_scope.GetNamePossessive] doğumunun gerçeği topraklara gönderileli haftalar oldu. Elbette [ruler_scope.GetSheHe] artık duymuş olmalı?\n\n[ruler_scope.GetTitledFirstNameNoTooltip]'in bu meseleyi kapatmaya karar verdiği sonucuna varmak zorundayım. Şu anda basitçe [ruler_scope.GetHerHis] dikkatinin altında olması ya da [ruler_scope.GetSheHe]'in umursamaması fark etmez; görünüşe göre Kral Toprakları'ndan hiçbir talep gelmeyecek."

