### TODO NOT-IN-ST: agot_events_bastard.0970.desc_nothing [AGOT: For days and nights I have stressed and strained over what [ruler_scope.GetName] may do in response to these revelations, yet it has been weeks now since the truth of [reveal_scope.GetNamePossessive] birth was sent to the realm. Surely [ruler_scope.GetSheHe] must have heard by now?\n\nI am forced to conclude that [ruler_scope.GetTitledFirstNameNoTooltip] has simply decided to let this matter rest. Whether simply beneath [ruler_scope.GetHerHis] notice at this moment or [ruler_scope.GetSheHe] just does not care, it seems that there will be no demands coming from King's Landing.]
 agot_events_bastard.0970.desc_nothing:0 "For days and nights I have stressed and strained over what [ruler_scope.GetName] may do in response to these revelations, yet it has been weeks now since the truth of [reveal_scope.GetNamePossessive] birth was sent to the realm. Surely [ruler_scope.GetSheHe] must have heard by now?\n\nI am forced to conclude that [ruler_scope.GetTitledFirstNameNoTooltip] has simply decided to let this matter rest. Whether simply beneath [ruler_scope.GetHerHis] notice at this moment or [ruler_scope.GetSheHe] just does not care, it seems that there will be no demands coming from King's Landing."
