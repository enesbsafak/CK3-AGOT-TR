### TODO NOT-IN-ST: agot_events_bastard.0955.desc [AGOT: It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after weeks of waiting, a page tells me that I have received a reply.\n\n]
 agot_events_bastard.0955.desc:0 "It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after weeks of waiting, a page tells me that I have received a reply.\n\n"Dear [ROOT.Char.GetFullNameNoTooltip]," [reveal_scope.GetSheHe] begins "I thank you for your candor, and I write to you in advance to let you know that I shall be writing to the realm in the coming days revealing that which you told me."\n\nIt seems [reveal_scope.GetNameNoTooltip] has made their choice, and I feel a weight leave my shoulders."
