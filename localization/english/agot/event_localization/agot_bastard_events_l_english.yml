### TODO NOT-IN-ST: agot_events_bastard.0963.desc.jon [AGOT: I am seated on the throne, ruling as I do, when a queer piece of news is offered to me in the seal of House [revealer.GetHouse.GetBaseName]. As I read, my eyes widen with shock.\n\nIt appears that [reveal_scope.GetFullName] is, in fact, of [reveal_scope.GetDynasty.GetBaseName] blood like me! Born to a union of [real_father.GetFullName] and [real_mother.GetFullName] during the War of the Usurper, [reveal_scope.GetSheHe] is now known to be of royal descent!\n\nI look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond to this bit of family drama. Though such a claim doubtless represents a threat, [reveal_scope.GetNameNoTooltip] has not acted against me, and is in fact my kin, baseborn or no. How, then, should I answer this news?]
 agot_events_bastard.0963.desc.jon:0 "I am seated on the throne, ruling as I do, when a queer piece of news is offered to me in the seal of House [revealer.GetHouse.GetBaseName]. As I read, my eyes widen with shock.\n\nIt appears that [reveal_scope.GetFullName] is, in fact, of [reveal_scope.GetDynasty.GetBaseName] blood like me! Born to a union of [real_father.GetFullName] and [real_mother.GetFullName] during the War of the Usurper, [reveal_scope.GetSheHe] is now known to be of royal descent!\n\nI look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond to this bit of family drama. Though such a claim doubtless represents a threat, [reveal_scope.GetNameNoTooltip] has not acted against me, and is in fact my kin, baseborn or no. How, then, should I answer this news?"
