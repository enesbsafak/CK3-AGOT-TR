### TODO NOT-IN-ST: agot_events_bastard.0901.desc [AGOT: Every time I look at [reveal_scope.GetFirstName], I cannot help but think of the truth of [reveal_scope.GetHerHis] blood, and also the dangers present in such truths. Though I want [reveal_scope.GetHerHim] to live a long and carefree life, I must also acknowledge [reveal_scope.GetHerHis] whole life is built upon a lie. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth of [reveal_scope.GetHerHis] royal blood. I cannot be the author of this injustice any longer.]
 agot_events_bastard.0901.desc:0 "Every time I look at [reveal_scope.GetFirstName], I cannot help but think of the truth of [reveal_scope.GetHerHis] blood, and also the dangers present in such truths. Though I want [reveal_scope.GetHerHim] to live a long and carefree life, I must also acknowledge [reveal_scope.GetHerHis] whole life is built upon a lie. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth of [reveal_scope.GetHerHis] royal blood. I cannot be the author of this injustice any longer."
### TODO NOT-IN-ST: agot_events_bastard.0901.desc.jon [AGOT: Every time I look at [reveal_scope.GetFirstName], I remember promises made and dangers long dormant, but I also see a child whose whole life is built upon a lie.]
 agot_events_bastard.0901.desc.jon:0 "Every time I look at [reveal_scope.GetFirstName], I remember promises made and dangers long dormant, but I also see a child whose whole life is built upon a lie. "Promise me Ned..."\n\nNo. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth. I loved my sister, and I love her child as my own. She would not want [reveal_scope.GetHerHim] to have grown up not knowing the truth. Though it pains me, and may pain the realm moreso, I cannot be the author of this injustice any longer."
