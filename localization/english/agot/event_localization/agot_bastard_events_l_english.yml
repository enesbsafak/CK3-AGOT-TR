### TODO NOT-IN-ST: agot_events_bastard.0911.desc [AGOT: I knew this moment was coming since the day I promised Lyanna, but it still stings to hear the words.]
 agot_events_bastard.0911.desc:0 "I knew this moment was coming since the day I promised Lyanna, but it still stings to hear the words. "Liar!" I'm called by my beloved Cat, and I can do little but hang my head in shame. "So much for the honor of Eddard Stark! Honorable to everyone but to your wife it seems! I am supposed to be your confidant Ned!" she yells before trailing off " No..." she laughs mirthfully "No, you are more honorable in your vows to me than the world thought apparently." she trails off, her justified outburst calming, and I can think of nothing to say.\n\nShe looks back to me, tears in in her eyes. "Family, Duty, Honor," she says it like a mantra, "I know why you did it, Ned. A part of me is relieved. But damn it, I am your family too! You should have told me. This was not right. What the world thought of us. Of you. What I thought of [secret_target.GetHerHim]." She looks down, now looking ashamed. "This was not right," she repeats finally."
### TODO NOT-IN-ST: agot_events_bastard.0911.a [AGOT: ]
 agot_events_bastard.0911.a:0 ""I'm sorry Cat...""

