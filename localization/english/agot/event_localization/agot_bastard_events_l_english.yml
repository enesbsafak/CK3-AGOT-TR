### TODO NOT-IN-ST: agot_events_bastard.0905.desc [AGOT: I had been prepared for one of the most difficult conversations of my life. Practicing what I would say, the look I would give. I confirmed that the location would be secret and ensured that we wouldn't be overheard.\n\nYet as I begin to weave my tale [reveal_scope.GetFirstName] puts a hand up to stop me.]
 agot_events_bastard.0905.desc:0 "I had been prepared for one of the most difficult conversations of my life. Practicing what I would say, the look I would give. I confirmed that the location would be secret and ensured that we wouldn't be overheard.\n\nYet as I begin to weave my tale [reveal_scope.GetFirstName] puts a hand up to stop me. "[ROOT.Char.GetFirstName]" [reveal_scope.GetSheHe] begins to say, addressing me by my first name "I already know. I've known for some time. I haven't yet revealed it but...I know." [reveal_scope.GetSheHe] says with a sigh.\n\nSuch a secret kept eating at me for such a long time, and [reveal_scope.GetSheHe] already knew?!"
### TODO NOT-IN-ST: agot_events_bastard.0905.desc.actually_parent [AGOT: I had been prepared for one of the most difficult conversations of my life. Practicing what I would say, the look I would give. I confirmed that the location would be secret and ensured that we wouldn't be overheard.\n\nYet as I begin to weave my tale [reveal_scope.GetFirstName] puts a hand up to stop me.]
 agot_events_bastard.0905.desc.actually_parent:0 "I had been prepared for one of the most difficult conversations of my life. Practicing what I would say, the look I would give. I confirmed that the location would be secret and ensured that we wouldn't be overheard.\n\nYet as I begin to weave my tale [reveal_scope.GetFirstName] puts a hand up to stop me. "Thank you" [reveal_scope.GetSheHe] begins to say "Thank you for telling me but...I already know. I've known for some time. I haven't yet revealed it but...I know." [reveal_scope.GetSheHe] says with a sigh.\n\nSuch a secret kept eating at me for such a long time, and [reveal_scope.GetSheHe] already knew?!"
