### TODO NOT-IN-ST: agot_events_bastard.0908.desc [AGOT: It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after weeks of waiting, a page tells me that I have received a reply. It is not, though, the one I expect.\n]
 agot_events_bastard.0908.desc:0 "It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after weeks of waiting, a page tells me that I have received a reply. It is not, though, the one I expect.\n"Dear [ROOT.Char.GetFullName],\nThank you for your letter sharing what you know," [reveal_scope.GetSheHe] begins with indirect language, likely to avoid any incidents should the message be intercepted. "While I thank you for your candor, I must humbly ask that you keep this information to yourself. It is for me to decide when, and if, I shall let these facts be known, and I would ask you to respect my privacy in this regard."\n\n[reveal_scope.GetName] has made [reveal_scope.GetHerHis] choice, at least for now. It is now for me to decide if I shall respect it."
