 agot_events_bastard.1001.t:0 "Talepler Kabul Edildi"
### TODO NOT-IN-ST: agot_events_bastard.1001.desc.jon [AGOT: I watch as [reveal_scope.GetFirstName] and Eddard are brought before me. The coward won't even meet my eyes as he is brought before the throne next to the despicable dragonspawn.\n\n]
 agot_events_bastard.1001.desc.jon:0 "I watch as [reveal_scope.GetFirstName] and Eddard are brought before me. The coward won't even meet my eyes as he is brought before the throne next to the despicable dragonspawn.\n\n"For the crimes of harboring a Targaryen, a known threat to the realm—" As the charges and decrees are read I find myself unable to hear the words. My heart is pounding in my head. Rage boiling inside. I feel an inferno building in my body, my skin buzzing and alive with wrath. I don't notice myself standing, only realizing I am descending from the throne when I am halfway down it.\n\nWithout waiting for the judgment to finish, I take one of the Kingsguard's swords from their sheaths as I pass, and with a swing and a yell, I cleave Eddard Stark's head clean from his body, the swordpoint cracking the stonework beneath. [reveal_scope.GetFirstNameNoTooltip] cries out in horror before I silence [reveal_scope.GetHerHim] too with an upwards swing, blood and stonework arching in a glorious crimson and marble display.\n\nI stand there amidst the gore, Targaryen blood once again coating the ground of the court. Looking down at my one-time friend's lifeless eyes, I find no peace. The rage has not abated. Lyanna is still not here. The looks in my courtiers' eyes are the same I saw in the Mad King's court, and I wonder how it came to this."
### TODO NOT-IN-ST: agot_events_bastard.1001.desc [AGOT: I watch as [reveal_scope.GetFirstName] and [reveal_employer.GetFirstName] are brought before me and the whole court. My Justice begins to read the charges, and I find myself wondering why they agreed to this, given what's about to happen.\n\n]
 agot_events_bastard.1001.desc:0 "I watch as [reveal_scope.GetFirstName] and [reveal_employer.GetFirstName] are brought before me and the whole court. My Justice begins to read the charges, and I find myself wondering why they agreed to this, given what's about to happen.\n\n"For the crimes of harboring a known threat to the realm, and for proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to focus on the words. Was it right to execute two for no direct action? What must be going through their minds in this moment? Yet as I am considering this, the proclamation is finished. The executioner steps up, and with a clean swing, removes the head of one, then the next. I may have private doubts, and the realm will react how it may."

 agot_events_bastard.1001.a:0 "Her neyse, bu mesele çözüldü."

 agot_events_bastard.1002.t:0 "Talepler Kabul Edildi"
### TODO NOT-IN-ST: agot_events_bastard.1002.desc.jon [AGOT: I watch as [reveal_scope.GetFirstName] is brought before me in chains. The despicable dragonspawn stares right toward me, as though looking through and past my eyes. Now that I know the truth, I wonder how I ever didn't see Rhaegar's features in [reveal_scope.GetHerHim].\n\n]
 agot_events_bastard.1002.desc.jon:0 "I watch as [reveal_scope.GetFirstName] is brought before me in chains. The despicable dragonspawn stares right toward me, as though looking through and past my eyes. Now that I know the truth, I wonder how I ever didn't see Rhaegar's features in [reveal_scope.GetHerHim].\n\n"For the crimes of proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to hear the words. My heart is pounding in my head. Rage boiling inside. I feel an inferno building in my body, my skin buzzing and alive with wrath. I don't notice myself standing, only realizing I am descending from the throne when I am halfway down it.\n\nWithout waiting for the judgment to finish, I take one of the Kingsguard's swords from their sheaths as I pass, and with a swing and a yell, I cleave the bastard's head clean from [reveal_scope.GetHerHis] body, the swordpoint cracking the stonework beneath. The court cries out in horror, but I cannot hear it over the sound of my own blood rushing through my head.\n\nI stand there amidst the gore, Targaryen blood once again coating the ground of the court. I look down at [reveal_scope.GetFirstNamePossessiveNoTooltip] lifeless eyes, and I find no peace. The rage has not abated. Lyanna is still not here. The looks in my courtiers' eyes are the same I saw in the Mad King's court, and I wonder how it came to this."
### TODO NOT-IN-ST: agot_events_bastard.1002.desc [AGOT: I watch as [reveal_scope.GetFirstName] is brought before me in chains. My Justice begins to read the charges, and I find myself wondering why they agreed to this, given what's about to happen.\n\n]
 agot_events_bastard.1002.desc:0 "I watch as [reveal_scope.GetFirstName] is brought before me in chains. My Justice begins to read the charges, and I find myself wondering why they agreed to this, given what's about to happen.\n\n"For the crimes of proclaiming false claims to the throne—" As the charges and decrees are read I find myself unable to focus on the words. Was it right to execute a baseborn for no directly treasonous action? What must be going through [reveal_scope.GetHerHis] mind in this moment? Yet as I am considering this, the proclamation is finished. The executioner steps up, and with one clean swing, removes the head of [reveal_scope.GetFullName]. I may have private doubts, and the realm will react how it may."

 agot_events_bastard.1002.a:0 "Her neyse, bu mesele çözüldü."

 agot_events_bastard.1003.t:0 "Talepler Kabul Edildi"
### TODO NOT-IN-ST: agot_events_bastard.1003.desc.male [AGOT: Dark wings for once do not bear dark words, but instead bear words of peace. I am barely out of my bedchambers when I am made aware of the raven from Castle Black. It seems that [reveal_scope.GetFullName] has presented himself as instructed, and has sworn to uphold the duties of the Night's Watch. Most importantly, to hold not lands and father no children.\n\nI breathe a sigh of relief that this surprising issue was resolved without bloodshed, and in the frozen north, he is unlikely to cause any trouble. The realm can rest easy, [reveal_scope.GetFirstName] can live without fear of me, and I rule without this thorn in my side.]
 agot_events_bastard.1003.desc.male:0 "Dark wings for once do not bear dark words, but instead bear words of peace. I am barely out of my bedchambers when I am made aware of the raven from Castle Black. It seems that [reveal_scope.GetFullName] has presented himself as instructed, and has sworn to uphold the duties of the Night's Watch. Most importantly, to hold not lands and father no children.\n\nI breathe a sigh of relief that this surprising issue was resolved without bloodshed, and in the frozen north, he is unlikely to cause any trouble. The realm can rest easy, [reveal_scope.GetFirstName] can live without fear of me, and I rule without this thorn in my side."
