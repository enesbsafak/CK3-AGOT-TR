### TODO NOT-IN-ST: agot_events_bastard.0920.desc [AGOT: I am working later than usual when I receive a short knock at my study door.]
 agot_events_bastard.0920.desc:0 "I am working later than usual when I receive a short knock at my study door. "Enter," I say simply, expecting the maids to be checking in on me, but instead [learned_person.GetFirstName] steps through the door. "Forgive me my [ROOT.Char.GetLadyLord|U] I... wanted to find you at a time when we would not be disturbed." [learned_person.GetSheHe|U] says nervously as I put down my quill to give [learned_person.GetHerHim] my full attention.\n\nWith a sigh [learned_person.GetSheHe] begins "Facts have come up in my research. Facts that... have some rather drastic implications for you... and for the realm." [learned_person.GetSheHe] continues, and as [learned_person.GetHerHis] story unfolds I find myself stunned into silence, whatever previous matter I was writing on completely forgotten. [learned_person.GetNameNoTooltip] says that previously undiscovered documents reveal that my true parents are in fact [real_mother.GetName] and [real_father.GetName]!\n\nI do not believe it, and yet as [learned_person.GetFirstNameNoTooltip] lays out the evidence in front of me I am forced to accept that this is indeed reality."
