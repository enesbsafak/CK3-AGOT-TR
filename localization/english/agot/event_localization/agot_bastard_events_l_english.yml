 agot_events_bastard.0971.desc_execution_bastard:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], taç adına derhal alınmak üzere benim kafamı talep etti.\n\nBu sert talep topraklarda yankılandı; sertliği birçoklarını rahatsız etti, yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı olabilir miyim? Kendi hayatımdan vazgeçebilir miyim? Ve yine de, razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; benim canım mı, yoksa binlerce başkasının mı?"

 agot_events_bastard.0971.desc_send_to_nw:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], günlerimi dondurucu kuzeyde geçirmek üzere Gece Nöbeti'ne katılmamı talep etti.\n\nBu talep topraklarda yankılandı; sertliği birçoklarını tedirgin etti, yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; benim canım mı, yoksa binlerce mi?"

 agot_events_bastard.0971.desc_send_to_ss:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], günlerimi dini hizmette geçirmek üzere Sessiz Kızkardeşler'e gönderilmemi talep etti.\n\nBu talep topraklarda yankılandı; sertliği birçoklarını tedirgin etti, yine de gerçek şu ki bu bir kraliyet fermanı. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; benim canım mı, yoksa binlerce mi?"

 agot_events_bastard.0971.desc_imprison:0 "Kara kanatlar, House [ruler_scope.GetHouse.GetBaseName] mührüyle kaplı kara sözler taşıyor. [ruler_scope.GetName]'den gelen bir mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], [ruler_scope.GetSheHe] aksine hüküm verene dek günlerimi zincirlerde geçirmek üzere [ruler_scope.GetHerHis] zindanında hapsedilmeyi kabul etmemi talep etti.\n\nBu talep topraklarda yankılandı ve bir kraliyet fermanının gücünü taşıyor. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; benim özgürlüğüm mü, yoksa barış mı?"

 agot_events_bastard.0971.desc_bring_to_court:0 "House [ruler_scope.GetHouse.GetBaseName] mührünü taşıyan bir mektup geldi. [ruler_scope.GetName]'den gelen mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe|U], hayatımı bir saray mensubu olarak geçireceğim [ruler_scope.GetHerHis] sarayına katılmak için topraklarımı ve unvanlarımı bırakmamı talep etti.\n\nBu talep topraklarda yankılandı ve beni bağışlasa da, ben topraklı bir [ROOT.Char.GetLadyLord]'um ve bu talep tartışmasız değil. Bu talebe razı oluyor muyum? Razı olmazsam topraklar kesinlikle kanayacak.\n\nÖyleyse ne olacak; benim topraklarım mı, yoksa barış mı?"

 agot_events_bastard.0971.desc_give_up_claims:0 "House [ruler_scope.GetHouse.GetBaseName] mührünü taşıyan bir mektup geldi. [ruler_scope.GetName]'den gelen mektup, yanlış anlaşılmaya ya da yanlış yoruma yer bırakmıyor. [ruler_scope.GetSheHe], [ruler_scope.GetHerHis] merhametiyle, ifşa edilen soyumun temsil edebileceği her türlü iddiadan feragat eden kamusal ve yasal bir beyanda bulunmamı talep etti.\n\nBu talep topraklara gönderildi ve birçokları bunun son gelişmelere adil bir yanıt olduğuna inanıyor. Yine de, kader çarkı dönerse haklı olarak kendilerine ait olan iddialardan vazgeçmek, birinin onuru üzerinde bir lekedir.\n\nÖyleyse ne olacak; benim gururum mu, yoksa topraklarda barış mı?"

 agot_events_bastard.0971.desc_nothing:0 "Günler ve geceler boyunca [ruler_scope.GetName]'in son ifşalara yanıt olarak ne yapabileceği konusunda endişelendim ve gerildim; ancak doğumumun gerçeği topraklara gönderileli haftalar oldu. Elbette [ruler_scope.GetSheHe] artık duymuş olmalı?\n\n[ruler_scope.GetName]'in bu meseleyi kapatmaya karar verdiği sonucuna varmak zorundayım. Şu anda basitçe [ruler_scope.GetHerHis] dikkatinin altında olması ya da [ruler_scope.GetSheHe]'in umursamaması fark etmez; görünüşe göre Kral Toprakları'ndan hiçbir talep gelmeyecek."

 agot_events_bastard.0971.nw_army_for_claim:0 "Komutanın Adamları"

 agot_events_bastard.0980.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0980.desc:0 "Herkes bilsin ki [reveal_scope.GetName] ve [reveal_employer.GetName], [reveal_scope.GetFirstNamePossessiveNoTooltip] soyunu hesaba katarken kendilerini tahta sunmaktaki başarısızlıkları nedeniyle toprakların haini ilan edilmiş ve bu vesileyle ölüme mahkum edilmişlerdir.\n\n[reveal_scope.GetHerHim]'e yardım eden herkes aynı kaderi paylaşacaktır."

 agot_events_bastard.0980.a:0 "Ne kadar acımasız bir talep!"

 agot_events_bastard.0981.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0981.desc:0 "Herkes bilsin ki [reveal_scope.GetName], [reveal_scope.GetHerHis] soyunu hesaba katarken kendini tahta sunmaktaki başarısızlığı nedeniyle toprakların haini ilan edilmiş ve ölüme mahkum edilmiştir.\n\n[reveal_scope.GetHerHim]'e yardım eden herkes aynı kaderi paylaşacaktır."

 agot_events_bastard.0981.desc_resolved:0 "Herkes bilsin ki [reveal_scope.GetName], ortaya çıkışlarının tehdidi nedeniyle toprakların haini ilan edilmiş ve ölüme mahkum edilmiştir.\n\n[reveal_scope.GetHerHis] kaderi, topraklarımın güvenliğini tehdit eden herkesi bekleyen kaderin bir hatırlatıcısı olsun."

 agot_events_bastard.0981.a:0 "Ne kadar sert bir hüküm!"

 agot_events_bastard.0982.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0982.desc.male:0 "Herkes bilsin ki [reveal_scope.GetName]'e, soyunun topraklar için temsil ettiği tehdit nedeniyle Gece Nöbeti'yle kara yemini etmesi emredilmiştir."

 agot_events_bastard.0982.desc.female:0 "Herkes bilsin ki [reveal_scope.GetName]'e, soyunun topraklar için temsil ettiği tehdit nedeniyle Sessiz Kızkardeşlik'e katılması emredilmiştir."

 agot_events_bastard.0982.desc_pending:0 "[reveal_scope.GetHerHim]'in bu talepten kaçmasına yardım ederken bulunan herhangi bir lord ya da leydi, toprakların haini ilan edilecek ve ona göre muamele görecektir."

 agot_events_bastard.0982.desc_resolved:0 "Saray, [reveal_scope.GetHerHim]'e [reveal_scope.GetHerHis] hizmeti için teşekkür eder ve [reveal_scope.GetSheHe]'in yeni konumunda da aynı derecede iyi hizmet edeceğini umar."

 agot_events_bastard.0982.a:0 "Sırf doğduğu için mi cezalandırılıyor? Hiç doğru görünmüyor."

 agot_events_bastard.0983.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0983.desc:0 "Herkes bilsin ki [reveal_scope.GetName], soyunun topraklar için bir tehdit oluşturmadığı kanıtlanana dek hapsedilmek üzere çağrılmıştır. [reveal_scope.GetHerHim]'in bu çağrıdan kaçmasına yardım ederken bulunan herhangi bir lord ya da leydi, toprakların haini ilan edilecek ve ona göre muamele görecektir."

 agot_events_bastard.0983.desc_resolved:0 "Herkes bilsin ki [reveal_scope.GetName], saray [reveal_scope.GetHerHis] soyunun topraklar için bir tehdit olmadığına ikna olana dek hapsedilmiştir. [reveal_scope.GetHerHim]'in kaçışına yardım etmek için komplo kurarken bulunan herhangi bir lord ya da leydi, toprakların haini ilan edilecek ve ona göre muamele görecektir."

 agot_events_bastard.0983.a:0 "Sırf doğduğu için mi hapsedildi? Hiç doğru görünmüyor."

 agot_events_bastard.0984.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0984.desc:0 "Herkes bilsin ki [reveal_scope.GetName], soyunun topraklar için bir tehdit oluşturmadığı kanıtlanana dek [ruler_scope.GetHerHis|U] Kraliyet Haşmetleri'nin koruması altında saraya çağrılmıştır. [reveal_scope.GetHerHim]'in bu çağrıdan kaçmasına yardım ederken bulunan herhangi bir lord ya da leydi, toprakların haini ilan edilecek ve ona göre muamele görecektir."

 agot_events_bastard.0984.a.courtier:0 "Adil bir karşılık gibi görünüyor."

 agot_events_bastard.0984.a.landed:0 "Topraklarını bırakmaya mı zorlandı? Sert."

 agot_events_bastard.0985.opening:0 "Sayın [ROOT.Char.GetFullNameNoTooltip],"

 agot_events_bastard.0985.desc:0 "Herkes bilsin ki [reveal_scope.GetName]'e, taht ya da ilgili unvanlar üzerindeki her türlü iddiadan feragat eden, kamusal ve yasal olarak bağlayıcı bir beyanda bulunması talimatı verilmiştir."

 agot_events_bastard.0985.desc_pending:0 "[reveal_scope.GetHerHim]'in bu talepten kaçınmasına ya da başka şekilde lafla sıyrılmasına yardım ederken bulunan herhangi bir lord ya da leydi, toprakların haini ilan edilecek ve ona göre muamele görecektir."

 agot_events_bastard.0985.desc_resolved:0 "Bu tehdit, kan dökülmeden çözülecektir; merhametim ve arzum budur. Beyan, önümüzdeki günlerde kulelerinize ulaşmalı ve herkesin bunu gerçek olarak kabul etmesini bekliyorum."

 agot_events_bastard.0985.a:0 "Adil bir karşılık gibi görünüyor."

 agot_events_bastard.0986.t:0 "Taç Yürüyüşe Geçiyor"

 agot_events_bastard.0986.desc:0 "Bize, [ruler_scope.GetName]'in meydan okumamıza karşı sabrını yitirdiği haberi ulaştı. Tacın orduları toplanıyor ve görünüşe göre [ruler_scope.GetSheHe], [Select_CString( reveal_scope.IsLocalPlayer, 'me', reveal_scope.GetName )] hakkındaki fermanını silah gücüyle uygulamayı planlıyor. Kendimizi savunmaya hazırlanmalıyız."

 agot_events_bastard.0986.desc.same:0 "Bize, kendi akrabamız olan [ruler_scope.GetName]'in meydan okumamıza karşı sabrını yitirdiği haberi ulaştı. [Select_CString( reveal_scope.IsLocalPlayer, 'me', reveal_scope.GetName )] hakkındaki fermanını uygulamak için tacın orduları toplanıyor. Aile arasında bu noktaya gelinmesi bir trajedi, ancak kendimizi savunmaya hazırlanmalıyız."

 agot_events_bastard.0986.a:0 "Gelsinler."

 agot_events_bastard.0986.a.tt:0 "@warning_icon! #warning [ruler_scope.GetNameNoTooltip], [reveal_scope.GetNameOrMeNoTooltip] hakkındaki kraliyet fermanını uygulamak için savaş ilan edecek. Savunmacı sen olacaksın.#!"

 agot_events_bastard.0987.t:0 "Kraliyet Fermanını Uygula"

 agot_events_bastard.0987.desc:0 "[reveal_scope.GetName] hakkındaki talebimiz meydan okumayla karşılandı. Söz zamanı bitti — ordularımızı toplayıp fermanımızı Taç hakkıyla [reveal_employer.GetName] üzerinde uygulayacağız."

 agot_events_bastard.0987.desc.same:0 "Kendi akrabamız olan [reveal_scope.GetName] hakkındaki talebimiz meydan okumayla karşılandı. Aileye karşı yürümek bizi acıtsa da, Taç'ın otoritesi korunmalı. Ordularımızı toplayıp fermanımızı [reveal_employer.GetName] üzerinde uygulayacağız."

 agot_events_bastard.0987.a:0 "Tacın sözü yasadır."

 agot_events_bastard.0987.a.tt:0 "@warning_icon! #warning [reveal_scope.GetName] hakkındaki kraliyet fermanını uygulamak için [reveal_employer.GetName]'e savaş ilan edeceksin.#!"

 agot_events_bastard.0990.t:0 "Evlilik İttifakları"

 agot_events_bastard.0990.desc.landed:0 "Westeros hanedanlarının kriz zamanlarında ittifak için evlilik araması uzun zamandır yaygındır. [ruler_scope.GetPrimaryTitle.GetName] üzerinde evlenmemiş bir hak iddia eden biri olarak, artık kendilerini kraliyet hanesine bağlamak isteyenler için epey bir kısmet sayılıyorum.\n\nÇıktığım çalkantılı yolu öngörerek, potansiyel evlilik teklifleri aramak için toprakların daha hırslı hanelerine ince sinyaller gönderdim. Önümüzdeki tehlikeler ve bir ittifakın sunabileceği nimet göz önüne alındığında, belki bunlardan birini kabul etmek en iyi yol olacaktır."

 agot_events_bastard.0990.desc.landed_singular:0 "Westeros hanedanlarının kriz zamanlarında ittifak için evlilik araması uzun zamandır yaygındır. [ruler_scope.GetPrimaryTitle.GetName] üzerinde evlenmemiş bir hak iddia eden biri olarak, artık kendilerini kraliyet hanesine bağlamak isteyenler için epey bir kısmet sayılıyorum.\n\nHouse [potential_spouse_1.GetHouse.GetBaseName] tarafından bana böyle bir teklif yapıldı; yaklaşan savaşta yardım vaat ediyor. Önümüzdeki tehlikeler ve bir ittifakın sunabileceği nimet göz önüne alındığında, belki bu teklifi kabul etmek en iyi yol olacaktır."

 agot_events_bastard.0990.desc.courtier:0 "Westeros hanedanlarının kriz zamanlarında ittifak için evlilik araması uzun zamandır yaygındır. [ruler_scope.GetPrimaryTitle.GetName] üzerinde evlenmemiş bir hak iddia eden biri olan [reveal_scope.GetName], artık kendilerini gelecekteki hükümdara bağlamak isteyenler için epey bir kısmet sayılıyor.\n\nÇıktığımız çalkantılı yolu öngörerek, potansiyel evlilik teklifleri aramak için toprakların daha hırslı hanelerine ince sinyaller gönderdim. Önümüzdeki tehlikeler ve bir ittifakın sunabileceği nimet göz önüne alındığında, belki bunlardan birini kabul etmek en iyi yol olacaktır."

 agot_events_bastard.0990.desc.courtier_singular:0 "Westeros hanedanlarının kriz zamanlarında ittifak için evlilik araması uzun zamandır yaygındır. [ruler_scope.GetPrimaryTitle.GetName] üzerinde evlenmemiş bir hak iddia eden biri olan [reveal_scope.GetName], artık kendilerini gelecekteki hükümdara bağlamak isteyenler için epey bir kısmet sayılıyor.\n\nHouse [potential_spouse_1.GetHouse.GetBaseName] tarafından bana böyle bir teklif yapıldı; yaklaşan savaşta yardım vaat ediyor. Önümüzdeki tehlikeler ve bir ittifakın sunabileceği nimet göz önüne alındığında, belki bu teklifi kabul etmek en iyi yol olacaktır."

