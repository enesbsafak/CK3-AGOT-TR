l_english:

 agot_war.0001.t:0 "Ganimetler Galiplerindir"

 agot_war.0001.desc:0 "Savaş bitti; zafere katkım kimsenin kuşku duyamayacağı kadar büyük.\n\nBu savaşın kazanılmasına yardım ettim. Güçlerim, eylemlerim ve liderliğim olmasaydı, kim bilir neler olurdu. Dolayısıyla [attacker.GetName] bana ödül ve ayrıcalıklar tanımaya gönüllü olabilir."

 agot_war.0001.a:0 "Ödüllendirilmeliyim!"

 agot_war.0001.b:0 "Hayır, bunu istemeyeceğim."

 agot_war.0002.t:0 "$agot_war.0001.t$"

 agot_war.0002.desc:0 "Hangi kraliyet lütfunu istemeliyim?"

 agot_war.0002.a:0 "Altın. Sade ve basit."

 agot_war.0002.b:0 "[spoiler_kg_candidate.GetFirstName], [attacker.Custom('KingsguardName')]'ne girmeli."

 agot_war.0002.c:0 "Akrabam için bir kraliyet evliliği."

 agot_war.0002.d:0 "[title.GetNameNoTier] benim olmalı."

 agot_war.0002.e:0 "Küçük Konseyde bir koltuk istiyorum."

 agot_war.0003.t:0 "$agot_war.0001.t$"

 agot_war.0003.desc:0 "[whiner.GetName]'in son zaferimde büyük bir rol oynadığı herkesin malumu. Şaşırtıcı olmayan bir şekilde [whiner.GetSheHe], bunu [whiner.GetHerHis] lehine kullanmayı planlıyor; zira [whiner.GetSheHe] şimdi [whiner.GetHerHim]'e bir kraliyet lütfu bahşetmemi istiyor.\n\n"

 agot_war.0003.requested_gold.desc:0 "[whiner.GetNameNoTooltip], yeni hazinelerimden hatırı sayılır miktarda altın istedi."

 agot_war.0003.requested_kg.desc:0 "[whiner.GetNameNoTooltip], aile üyesi [spoiler_kg_candidate.GetShortUIName]'in [ROOT.Char.Custom('KingsguardName')]'me kabul edilmesini rica etti."

 agot_war.0003.requested_marriage.desc:0 "[whiner.GetNameNoTooltip], aile üyesi [spoiler_marriage_candidate.GetShortUIName]'e kraliyet evliliği gibi yüce bir ödülün bahşedilmesini istedi. Rıza gösterirsem [spoiler_marriage_candidate.GetNameNoTooltip] ile evleneceğiz."

 agot_war.0003.requested_titles.desc:0 "[whiner.GetNameNoTooltip], [whiner.GetSheHe]'e [title.GetNameNoTier] unvanının verilmesini rica etti."

 agot_war.0003.requested_council.desc:0 "[whiner.GetNameNoTooltip], [whiner.GetSheHe]'e Küçük Konseyde bir koltuk verilmesini rica etti."

 agot_war.0003.a:0 "Öyleyse altını alacaklar."

 agot_war.0003.b:0 "[spoiler_kg_candidate.GetFirstName], [attacker.Custom('KingsguardName')]'ne katılacak."

 agot_war.0003.c:0 "[spoiler_marriage_candidate.GetName] benimle evlenecek."

 agot_war.0003.c_betrothal:0 "[spoiler_marriage_candidate.GetName] benimle nişanlanacak."

 agot_war.0003.d:0 "Fazla aceleciler."

 agot_war.0003.e:0 "[title.GetName]'i alacaklar!"

 agot_war.0003.f:0 "Küçük Konseyde bir koltuk, tamam."

 agot_war.0004.t:0 "$agot_war.0001.t$"

 agot_war.0004.desc:0 "Kraliyet evliliği için hangi akrabamı seçmeliyim?"

 agot_war.0004.a:0 "Bu kişi, sanırım."

 agot_war.0004.a_tt:0 "[spoiler_marriage_candidate.GetUIName], [attacker.GetShortUIName]'e evlilik seçeneği olarak önerilecek"

 agot_war.0003.rejection_msg:0 "Kraliyet Lütfu Reddedildi!"

 agot_war.0003.rejection_msg_desc:0 "[attacker.GetName] kraliyet lütfunuzu reddetti."

 agot_war.0003.acceptance_msg:0 "Kraliyet Lütfu Bahşedildi"

 agot_war.0003.acceptance_msg_desc:0 "[attacker.GetName], dilediğiniz kraliyet lütfunu bahşetti."
