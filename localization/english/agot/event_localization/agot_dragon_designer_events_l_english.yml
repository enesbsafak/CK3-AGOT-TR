l_english:

 agot_dragon_designer.0001.t:0 "Yeni Bir Ejderha Binicisi"

 agot_dragon_designer.0001.desc:0 "Yeni bir ejderha binicisi olarak dünyada yerimi edinmenin zamanı geldi. Ben ne biçimde bir ejderha binicisiyim?"

 agot_dragon_designer.0001.egg:0 "Yalnızca bir yumurtam var."

 agot_dragon_designer.0001.egg_tt:0 "Ejderha yumurtanın rengini seçeceksin."

 agot_dragon_designer.0001.a:0 "Ejderham..."

 agot_dragon_designer.0001.a.tt:0 "Ejderhanı yaratman ya da seçmen istenecek."

 agot_dragon_designer.0001.b:0 "Eski Valyria'dan kalma bir ejderha boynuzuna sahibim."

 agot_dragon_designer.0001.b.tt:0 "Ejderha boynuzu, ejderha kanı sunmadan ya da gerektirmeden ejderha evcilleştirmenin tehlikeli bir yolunu sağlar."

 agot_dragon_designer.0002.t:0 "Ejderha Seçimi"

 agot_dragon_designer.0002.desc:0 "Göklerden, ateş ve kan kalem ve mürekkebimken tarihin sayfalarını yazacağım; ama hangi ejderhayla hüküm süreceğim? Uçmaya hevesli, genç ama savaşa hazır bir ejderha mı istiyorum, yoksa yıkım ve ölüm yağdıracağım koca yaşlı bir deniz canavarı mı?"

 agot_dragon_designer.0002.baby:0 "Bir yavru."

 agot_dragon_designer.0002.a:0 "Genç bir ejderha."

 agot_dragon_designer.0002.b:0 "Yetişkin bir ejderha."

 agot_dragon_designer.0002.c:0 "Yaşlı bir canavar."

 agot_dragon_designer.0002.d:0 "Kadim bir canavar."

 agot_dragon_designer.0002.e:0 "Vahşi bir ejderha."

 agot_dragon_designer.0002.e.tt:0 "Yaşayan, vahşi ejderhaların arasından bir ejderha seçmen istenecek."

 agot_dragon_designer.0002.f:0 "Bir düşününce, ben farklı bir kategoriye aitim."

 agot_dragon_designer.0002.f.tt:0 "Ana ejderha tasarımcısı olayına geri döneceksin."

 agot_dragon_designer.0002.gender:0 "Ejderhanın Cinsiyeti:"

 agot_dragon_designer.0002.gender.male:0 "$agot_dragon_designer.0002.gender$ #bold #B Erkek#!"

 agot_dragon_designer.0002.gender.female:0 "$agot_dragon_designer.0002.gender$ #bold #D Dişi#!"

 agot_dragon_designer.0002.gender.unspecified:0 "$agot_dragon_designer.0002.gender$ #bold #M Sürpriz Yap#!"

 agot_dragon_designer.0002.gender.tt:0 "Bu, doğacak ejderhanın cinsiyeti olacak. Erkek/dişi/rastgele arasında geçiş yapmak için bu seçeneğe tıklayın."

 agot_dragon_designer.0003.t_hatchling:0 "Bir Yavru"

 agot_dragon_designer.0003.t_young:0 "Genç Bir Ejderha"

 agot_dragon_designer.0003.t_adult:0 "Görkemli Bir Yaratık"

 agot_dragon_designer.0003.t_old:0 "Zorlu Bir Canavar"

 agot_dragon_designer.0003.t_ancient:0 "Kadim Bir Canavar"

 agot_dragon_designer.0003.desc_hatchling:0 "Bu ejderha yakın zamanda yumurtasından çıktı ve önünde bir dünya olasılık var. Bu ejderha neye dönüşecek? Hangi mucizeleri ve hangi dehşetleri saçacak?"

 agot_dragon_designer.0003.desc_young:0 "Bu ejderha, yavruluk döneminden bu yana tamamen büyüdü, ama önünde hâlâ uzun bir yol var. Yolculuğun her adımında ve kanatlarının her çırpılışında büyüyecek. Ejderhanın alevleri sıcak ama henüz denenmemiş; ancak bu durum uzun süre böyle kalmayacak."

 agot_dragon_designer.0003.desc_adult:0 "Bu tamamen ürkütücü ejderhanın gözlerinde gurur ve zekâ parıldıyor. Yaş onu daha da büyüttü, ama yine de gençliğinin alevleri hâlâ kor gibi yanıyor. Cephaneliğinde deneyim ve güç bulunan bu ejderhaya karşı kim durabilmeyi umabilir?"

 agot_dragon_designer.0003.desc_old:0 "Yaşlı bir ejderha, yaşına rağmen daha az tehlikeli değildir. Bu ağır canavar hâlâ öfke ve açlıkla yanıyor; bir atı bütün olarak yutabilir ve binicisinin tek bir emriyle koca orduları alevler içinde bırakabilir. Bu ejderha efsanelerin, mitlerin ve masalların maddesidir."

 agot_dragon_designer.0003.desc_ancient:0 "Hava, bu ejderhanın hırıltılarının yankılarıyla inliyor gibi; havalanırken her adımda yer titriyor. Koca kanatlarının gölgesinde kasabalar ve kaleler bütün olarak yutuluyor ve tüm canlılar onun ağzına bakıp ölümü görüyor. Bu kadim ejderha, dünyanın en çok korkulan varlıklarından biri ve bunun farkında."

 agot_dragon_designer.0003.a:0 "Şu huya bir bakalım..."

 agot_dragon_designer.0003.a.baby:0 "Bu ejderha şunlarla doğdu..."

 agot_dragon_designer.0003.a.tt:0 "Ejderhanın özelliklerini özelleştireceksin."

 agot_dragon_designer.0003.b:0 "Pek doğru görünmüyor..."

 agot_dragon_designer.0003.b.tt:0 "Ejderhanın görünümünü özelleştireceksin."

 agot_dragon_designer.0003.c:0 "Dünya bizim!"

 agot_dragon_designer.0003.c.tt:0 "Ejderhanı tasarlamayı bitireceksin."

 agot_dragon_designer.0003.c.needs_traits_tt:0 "@warning_icon! #warning Ejderhanın özellik seti eksik. Seçim yapmadan devam edersen özellikler rastgele atanacak.#!"

