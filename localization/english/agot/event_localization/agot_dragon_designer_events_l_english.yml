### TODO NOT-IN-ST: agot_dragon_designer.2000.desc [AGOT: Dragons refuse to venture beyond the Wall, and this far north an attempt to cradle an egg will more than like end in it turning to stone. If I can keep my egg safe until I can make my way south beyond the Wall and the Gift, maybe, just maybe, I can hatch a dragon of my own. Alternatively, a dragon horn might give me an advantage south of the Wall.]
 agot_dragon_designer.2000.desc:0 "Dragons refuse to venture beyond the Wall, and this far north an attempt to cradle an egg will more than like end in it turning to stone. If I can keep my egg safe until I can make my way south beyond the Wall and the Gift, maybe, just maybe, I can hatch a dragon of my own. Alternatively, a dragon horn might give me an advantage south of the Wall."
