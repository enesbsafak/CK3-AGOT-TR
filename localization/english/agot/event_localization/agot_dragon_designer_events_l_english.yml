### TODO NOT-IN-ST: agot_dragon_designer.0003.desc_adult [AGOT: Pride and intelligence glimmer in the eyes of this utterly fearsome dragon. Age has seen it grow even larger, and yet the fires of its youth still burn hot. With experience and power in this dragon's arsenal, who could hope to stand against it?]
