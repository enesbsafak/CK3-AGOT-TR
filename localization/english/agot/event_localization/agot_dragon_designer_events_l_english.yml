 agot_dragon_designer.2000.t:0 "Buzda Ateş"

 agot_dragon_designer.2000.desc:0 "Ejderhalar Duvar'ın ötesine geçmeyi reddeder ve bu kadar kuzeyde bir yumurtayı kucakta ısıtmaya çalışmak, büyük olasılıkla taşa dönüşmesiyle sonuçlanır. Yumurtamı, Duvar'ın ve Hediye'nin ötesinde güneye inebilene dek güvende tutabilirsem, belki, yalnızca belki, kendi ejderhamı yumurtadan çıkarabilirim. Alternatif olarak, bir ejderha boynuzu bana Duvar'ın güneyinde avantaj sağlayabilir."

 agot_dragon_designer.2000.egg:0 "Bakışlarımı yumurtama çeviriyorum."

 agot_dragon_designer.2000.egg_tt:0 "Ejderha yumurtanın rengini seçeceksin."

