### TODO NOT-IN-ST: agot_dragon_designer.0003.desc_young [AGOT: This dragon is fully grown from its time as a hatchling, but still has a long road ahead of it. It shall grow with every step of the journey and every beat of its wings. The dragon's fires are hot yet untested, but that will not remain the case for long.]
