### TODO NOT-IN-ST: agot_dragon_designer.0003.desc_old [AGOT: An elder dragon is no less dangerous for its age. This lumbering beast still burns with fury and hunger, able to swallow a horse whole and set even entire armies aflame with but a single command from its rider. This dragon is the stuff of legends, of myth and fable.]
 agot_dragon_designer.0003.desc_old:0 "An elder dragon is no less dangerous for its age. This lumbering beast still burns with fury and hunger, able to swallow a horse whole and set even entire armies aflame with but a single command from its rider. This dragon is the stuff of legends, of myth and fable."
### TODO NOT-IN-ST: agot_dragon_designer.0003.desc_ancient [AGOT: The air seems to groan with the echoes of this dragon's growls, the very ground trembles at every step as it takes off. Towns and castles are swallowed whole in the shadow of its vast wings, and all living things gaze into its maw and see death. This ancient dragon is one of the most feared beings in the world, and knows it.]
