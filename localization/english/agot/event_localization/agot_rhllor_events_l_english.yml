l_english:

 agot_rhllor.0001.t:0 "Son Umut"

 agot_rhllor.0001.multiple.desc:0 "Acı beni tüketiyor. Bedenim, onulmaz yaralar ve içimde derinlerde azan hastalık yüzünden yırtılmış ve güçten düşmüş halde iflas ediyor. Her çareyi, her çaresiz umudu denedim; ama gücüm yalnızca tükeniyor.\n\nGeriye tek bir yol kaldı, her şey kaybolmadan önce tek bir son şans. Kızıl rahip ateşten, acıyı yakıp kül edebilecek arındırıcı ışıktan söz ediyor. [red_priest.GetHerHis|U] sözleri cesur, [red_priest.GetHerHis] inancı sarsılmaz. [red_priest.GetSheHe|U], alevlerin hiçbir faninin elinin onaramayacağı şeyi iyileştireceğini iddia ediyor.\n\n[red_priest.GetHerHis] tanrısına inanıp inanmadığımı bilmiyorum, ama daha fazla dayanamayacağımı biliyorum."

 agot_rhllor.0001.wound.desc:0 "Yara iltihaplanıyor, kırmızı ve şiş; nasıl bakılırsa bakılsın kapanmayı reddediyor. Her hareket, kendi kırılganlığımın bir hatırlatıcısı olarak bedenime taze bir acı gönderiyor.\n\nÖnümde çok az seçenek kaldı. Kızıl rahip, [red_priest.GetHerHis] ateşinin hiçbir bıçağın ya da merhemin başaramadığını yapabileceğini iddia ediyor. [red_priest.GetSheHe|U], alevin zayıflığı arındırdığını, eti kaynayıp çürümeyi yakıp yok edebileceğini söylüyor.\n\nBelki [red_priest.GetSheHe] haklıdır. Belki delidir. Ama hiçbir şey yapılmazsa, [red_priest.GetHerHim]'i sorgulayacak kadar uzun yaşayamam."

 agot_rhllor.0001.disease.desc:0 "Gücümün, görünmez eller tarafından çalınır gibi kayıp gittiğini hissediyorum. Her nefes bir mücadele, her gün bir öncekinden daha ağır. Hastalık sürüyor; denediğim çarelere karşı kayıtsız, savaşma irademe aldırışsız.\n\nKızıl rahip ateşten, hastalığı yakıp yok edebilecek arındırıcı güçten söz ediyor. [red_priest.GetSheHe|U], alevlerin yalan söylemediğine, tükenmediğine yemin ediyor. [red_priest.GetSheHe] haklıysa, bu benim tek şansım.\n\n[red_priest.GetSheHe] yanılıyorsa, pişman olacak kadar uzun vaktim olmayacak."

 agot_rhllor.0001.deadly_curse.desc:0 "Her geçen gün daha da kayıp gittiğimi hissediyorum. Bu iyileşebilecek bir yara değil, seyrini tamamlayacak bir hastalık da değil. Bu daha derin, daha zalim ve aman bilmez bir şey.\n\nBöyle illetlerin geri döndürülemeyeceğini, bunun yalnızca kader olduğunu, kaldırılamayacak bir yük olduğunu söyleyenler var. Ama kızıl rahip kadere inanmaz. [red_priest.GetSheHe|U] ateşe inanır. [red_priest.GetSheHe|U], en ağır lanetlerin bile yakılıp yok edilebileceğini iddia ediyor.\n\nBelki bu deliliktir. Belki de tek umudum."

 agot_rhllor.0001.a:0 "Ateş beni kurtarabilirse, yaksın bakalım."

 agot_rhllor.0001.b:0 "Fikrimi değiştirdim."

 agot_rhllor.0002.t:0 "Yargı Alevleri"

 agot_rhllor.0002.desc:0 "[patient.GetTitledFirstName] yaklaşıyor, [patient.GetHerHis] adımları acının ağırlığını taşıyor. [patient.GetHerHis] bedenindeki hasarı görüyorum — onulmayı reddeden yaralar, [patient.GetHerHis] gücünü kemiren hastalık, giderek yaklaşan bir ölüm gölgesi. [patient.GetSheHe|U] bana bir inançlı olarak değil, başka hiçbir yerde kurtuluş kalmadığı için son çareye tutunan çaresiz bir [Select_CString(patient.IsFemale,'kadın','adam')] olarak geliyor.\n\nAteş arındırabilir. Ateş iyileştirebilir. Ama ateş nazik değildir. Işık Efendisi armağanlarını karşılıksız vermez — her zaman bir bedel vardır. Soru şu: [patient.GetTitledFirstNameNoTooltip], onun merhametine layık mı... yoksa [red_priest.GetSheHe] bu uğurda mı yanacak?"

 agot_rhllor.0002.a:0 "R'hllor'un ışığı seni arındıracak."

 agot_rhllor.0002.b:0 "Ateşte yürüyeceksen, önce onun gerçeğini kucaklamalısın."

 agot_rhllor.0002.b.tt:0 "[patient.GetTitledFirstName]'i inancına geçmeye çağırıyorsun"

 agot_rhllor.0002.c:0 "Alevler senin için değil."

 agot_rhllor.0003.title:0 "Ateşte Bir Dua"

 agot_rhllor.0003.desc:0 "Kızıl rahip [red_priest.GetHerHis] ritüelini başlatıyor; alevler yükselip odaya titrek gölgeler düşürürken kutsal sözleri mırıldanıyor. Sıcaklık büyüyor, tenime baskı yapıyor — yalnızca ısı değil, daha derin, canlı bir şey.\n\n[red_priest.GetSheHe|U], R'hllor'un ışığından, ateşin arındırma ve yenileme gücünden söz ediyor. Ama ateş her şeyi bir anda iyileştirmez. Hangi illeti [red_priest.GetHerHis] tanrısının merhametine emanet edeceğimi seçmeliyim."

 agot_rhllor.0003.a:0 "Lütfen, yaralarımı iyileştir!"

 agot_rhllor.0003.b:0 "Yorgunum — bana güç ver!"

 agot_rhllor.0003.c:0 "Bu lanetli hastalığı yak!"

 agot_rhllor.0003.d:0 "Bu dertten kurtar beni, kötüleşmeden!" #early_great_pox

 agot_rhllor.0003.e:0 "Bu dertten kurtar beni, kötüleşmeden!" #lovers_pox

 agot_rhllor.0003.f:0 "Erimeyip tükenmeyeceğim — kurtar beni!"

 agot_rhllor.0003.g:0 "Bedenimi güçlendir, bu zayıflığı kov!"

 agot_rhllor.0003.h:0 "Eklemlerimdeki acı dayanılmaz!"

 agot_rhllor.0003.i:0 "Nefes alışım çabaya dönüşmesin!"

 agot_rhllor.0003.j:0 "İçimde büyüyen bu gölgeyi arındır!"

 agot_rhllor.0003.k:0 "Beni bu ateşli hastalığın pençesinden kurtar!"

 agot_rhllor.0003.l:0 "Bu salgını geride bırakayım!"

 agot_rhllor.0003.m:0 "Temizle tenimi, bir bütün olayım yine!"

 agot_rhllor.0003.n:0 "Bu laneti etimden sök at!"

 agot_rhllor.0003.o:0 "Karnımdaki acıyı dindir, sana yalvarıyorum!"

 agot_rhllor.0003.p:0 "Bu laneti durdur, beni özgür bırak!"

 agot_rhllor.0003.q:0 "Havaya ihtiyacım var! Yeniden nefes alayım!"

 agot_rhllor.0003.r:0 "Bu yayılan taşı yak!"

 agot_rhllor.0003.s:0 "Hastalık beni ele geçirmeden kurtar!"

 agot_rhllor.0003.t:0 "Titrememi dindir, bana sıcaklık ver!"

 agot_rhllor.0003.u:0 "Yeniden yürümek istiyorum!"

 agot_rhllor.0004.t:0 "Kurtuluşun Bedeli"

 agot_rhllor.0004.desc:0 "Kızıl rahip [red_priest.GetHerHis] ritüelini başlatmıyor. Bunun yerine, [red_priest.GetSheHe] sarsılmaz bir inançla bana bakıyor; [red_priest.GetHerHis] sesi konuşurken kararlı.\n\n#EMP "Ateş arındırabilir. Ateş iyileştirebilir. Ama R'hllor, armağanlarını ışığında yürümeyen birine neden versin?" #!\n\n[red_priest.GetSheHe|U] bana yardım etmeyecek — henüz. Eski tanrılarımdan, eski yollarımdan vazgeçip kendimi Işık Efendisi'ne adayıp adaymayacağıma bağlı. Acım sona erebilir, ama yalnızca [red_priest.GetHerHis] alevinin önünde diz çökersem."

 agot_rhllor.0004.a:0 "Yemin ederim! Yeter ki iyileştir beni!"

 agot_rhllor.0004.b:0 "Hayır, buna değmez."

 agot_rhllor.0005.t:0 "Alev Tarafından Terk Edilmiş"

 agot_rhllor.0005.desc:0 "Kızıl rahip bana bakıyor, [red_priest.GetHerHis] ifadesi okunaksız. [red_priest.GetHerHim]'in ritüele başlamasını, fısıltıyla söylenen duaları, yükselen alevlerin sıcaklığını bekliyorum — ama hiçbiri gelmiyor.\n\n#EMP "Işık Efendisi lütuflarını dilediği yere verir. Sen seçilmiş değilsin." #!\n\n[red_priest.GetHerHis|U] sözleri kesin, [red_priest.GetHerHis] tonu sarsılmaz. [red_priest.GetSheHe|U] beni iyileştirmeyecek. Şüphe mi, küçümseme mi, yoksa anlayışımı aşan bir şey mi, bilmiyorum. Ama [red_priest.GetSheHe] beni geri çevirdi; beni eskisi gibi acı çekmeye terk ediyor."

 agot_rhllor.0005.a:0 "Öyleyse kaderimiz bu olsun."

 agot_rhllor.0005.b:0 "Bu kâfiri zindana atın!"

 agot_rhllor.0006.t:0 "Bir Budalanın Budalalığı"

 agot_rhllor.0006.desc:0 "Bu budala ışığa sırtını dönüyor, [patient.GetHerHis] sahte tanrılarına, [patient.GetHerHis] boş inancına tutunuyor. [patient.GetSheHe|U], ateşin gerçeği önünde diz çökmektense acı çekmeyi yeğliyor.\n\n[patient.GetHerHim] gibi [Select_CString(patient.IsFemale,'kadınlar','adamlar')] daha önce de gördüm — gururlu, inatçı, R'hllor'un iradesine kör. Kimileri sönen korslar gibi solup sefaletlerinde kıvranır. Kimileri tamamen tükenir, bedenleri kendi başkaldırışlarının ağırlığı altında çöker.\n\nR'hllor'un merhameti sunuldu ve reddedildi. Şimdi, [patient.GetHerHim]'i nasıl bir kaderin beklediğini yalnızca alevler bilir."

 agot_rhllor.0006.a:0 "Öyle olsun. [patient.GetSheHe|U] [patient.GetHerHis] seçimini yaptı."

 agot_rhllor.0006.b:0 "[patient.GetSheHe|U] buna pişman olacak."

 agot_rhllor.0007.t.success:0 "Ateşin Merhameti"

 agot_rhllor.0007.t.failure:0 "Ateşin Yargısı"

 agot_rhllor.0007.patient.fail.desc:0 "Alevler kükrüyor, rahip ilahiler söylüyordu, ama hiçbir şey değişmedi. Isıyı, beklentinin ağırlığını hissettim; yine de bedenim olduğu gibi kaldı — illetli, güçsüz. Bu R'hllor'un yargısı mıydı, yoksa rahibin başarısızlığı mı?"

 agot_rhllor.0007.patient.crit_fail.desc:0 "Hiç bilmediğim bir acı içime yayıldı. Arındırması gereken ateş, bunun yerine etimi harap etti; beni titreyen, kırık bir halde bıraktı. Kızıl rahibin ifadesi değişmedi; sanki [red_priest.GetSheHe] bunu bekliyormuş gibi. R'hllor beni gerçekten terk mi etmişti?"

 agot_rhllor.0007.patient.succ.desc:0 "Ateş tenimi yaladı; ama acı yerine sıcaklık hissettim — derin, kuşatıcı ama zalim olmayan bir sıcaklık. Acım yavaşça hafifledi, gücüm geri geldi. Hâlâ bendim, ama yeniden bir bütündüm. Kızıl rahip sessizce izledi, [red_priest.GetHerHis] bakışları okunaksız."

 agot_rhllor.0007.patient.crit_succ.desc:0 "Bu, iyileşmekten öteydi. Ateş bedenimde dolaştı; uzuvlarımı tazelenmiş güçle doldurdu, duyularımı keskinleştirdi. Kendimi daha hafif, daha güçlü hissettim; sanki yalnızca et değil, daha büyük bir şey yeniden kurulmuştu. Rahip beni inceledi, [red_priest.GetHerHis] dudakları sessiz dua sözcükleri döktü."

 agot_rhllor.0007.red_priest.fail.desc:0 "Alevler yüksek yandı, ama ışık yanıt vermedi. Isıyı hissettim, duaları fısıldadım; ama önümdeki beden değişmedi. Bu ruh layık değil miydi, yoksa ateşin iradesini yanlış mı okudum?"

 agot_rhllor.0007.red_priest.crit_fail.desc:0 "Bir uyarı. Bir ceza. Alevler fazla şiddetle kabardı ve durduramadan, kavurucu acının hüküm sürdüğünü gördüm. Ritüel başarısız olmuştu; ama bundan da öte — ateş arındırmak yerine yutmuştu. R'hllor konuşmuştu ve yargısı zalimdi."

 agot_rhllor.0007.red_priest.succ.desc:0 "Ateş yanıt verdi. İllet yavaşça kayboldu, yaralar kapandı, acı yükseldi. Bu sıradan bir iyileşme değildi — bu, Işık Efendisi'nin iradesiydi ve bugün [patient.GetSheHe] merhamet göstermeyi uygun görmüştü."

 agot_rhllor.0007.red_priest.crit_succ.desc:0 "Alevlerin yalnızca iyileştirmekten daha fazlasını yaptığını izledim — dönüştürdüler. Bu bedeni dolduran güç, yalnızca onarılmış et değildi; daha fazlası, ilahi bir şeydi. R'hllor onları yalnızca iyileşmenin ötesinde kutsamıştı. Belki de bu kişi gerçekten seçilmişti."

 agot_rhllor.0007.patient.fail.outro_desc:0 "\n\nAteş sönüyor ve ben olduğum gibi kalıyorum. Güçsüz. Kırık. Kızıl rahip ne çağırmayı umduysa gelmedi. Belki alevler, kendilerine seslenen herkese yanıt vermiyor."

 agot_rhllor.0007.patient.crit_fail.outro_desc:0 "\n\nİçimi bir acı sancısı deldi, ateş tenimi kemirdi. Bu iyileşme değildi — bu yıkımdı. Soluk soluğa sendeledim, bedenim eskisinden de güçsüz. [red_priest.GetHerHis] tanrısını mı kızdırmıştım, yoksa [red_priest.GetSheHe] mi?"

 agot_rhllor.0007.patient.succ.outro_desc:0 "\n\nAlevler geri çekiliyor ve daha rahat nefes alıyorum. Sızı gitmiş, hastalık sönmüş. Yeniden bir bütünüm. Rahip, sanki bu hep kesinmiş gibi başını sallıyor."

 agot_rhllor.0007.patient.crit_succ.outro_desc:0 "\n\nİçimden, bildiğim her şeyin ötesinde bir güç fışkırıyor. Ateş yalnızca iyileştirmedi — beni daha fazlası yaptı. Kızıl rahip izliyor, [red_priest.GetHerHis] gözleri inançtan daha derin bir şeyle yanıyor."

 agot_rhllor.0007.red_priest.fail.outro_desc:0 "\n\nKorlar sönüyor ve illet sürüyor. Ateş sessizdi. Bu ruh seçilmedi — ya da belki ben onun ışığını çağırmaya layık değildim."

 agot_rhllor.0007.red_priest.crit_fail.outro_desc:0 "\n\nAlevler arındırmadı. Yuttular. Bedenin kasılıp kıvrandığını, ateşin damgasının ete işlendiğini izliyorum. R'hllor onlardan yüzünü çevirdi — ya da daha kötüsü, onları mahkûm etti."

 agot_rhllor.0007.red_priest.succ.outro_desc:0 "\n\nIşık Efendisi yanıt verdi. İllet yok oldu, ateşin merhameti sunuldu. Bugün, alev iyileştirdi."

 agot_rhllor.0007.red_priest.crit_succ.outro_desc:0 "\n\nBu, sıradan bir iyileşme değildi. R'hllor'un eli onlara dokundu, onları ateşinde yeniden dövdü. Yalnızca yeniden bir bütün değiller — daha büyük bir şey oldular."

 agot_rhllor.0007.patient.succ_wounds.outro_desc:0 "\n\nAcı hafifledi. Bir zamanlar yırtık ve çiğ olan etim artık kaynaşmış; geriye yalnızca yaranın anısı kaldı. Ateş, çeliğin onaramadığını onardı."

 agot_rhllor.0007.patient.succ_disease.outro_desc:0 "\n\nDerin bir nefes alıyorum ve haftalardır ilk kez bedenim direnmiyor. Hastalık yok oldu, üzerimdeki pençesi kırıldı. Yeniden bir bütünüm."

 agot_rhllor.0007.patient.succ_curse.outro_desc:0 "\n\nBu kadar uzun süre taşıdığım yük hafifledi. Uzuvlarım titremiyor, nefesim artık takılmıyor. Belki asla eskisi gibi olamayacağım; ama bugün, ışığın içinde yürüyorum."

 agot_rhllor.0007.patient.crit_succ_wounds.outro_desc:0 "\n\nYalnızca yaralarım kapanmakla kalmadı; bedenim daha güçlü, daha hızlı hissediyor — sanki ateşin kucağında yeniden dövülüp sertleştirilmişim gibi. Eskiden neysem, artık daha fazlasıyım."

 agot_rhllor.0007.patient.crit_succ_disease.outro_desc:0 "\n\nAteş, hastalığımı arındırmaktan daha fazlasını yaptı — içimde bir şeyi uyandırdı. Uzuvlarım artık sızlamıyor, zihnim artık bulanmıyor. Kendimi canlı hissediyorum; sanki hastalık yıllardır gücümü emiyormuş ve ancak şimdi olmam gerektiği gibi duruyorum."

 agot_rhllor.0007.patient.crit_succ_curse.outro_desc:0 "\n\nAyağa kalkıyorum; yalnızca iyileşmiş değil, çoktan unuttuğum bir biçimde bütün hissediyorum. Nefesim düzenli, bedenim sağlam. Ateş beni yalnızca iyileştirmedi — bana yeni bir güç bahşetti."

 agot_rhllor.0007.patient.fail_wounds.outro_desc:0 "\n\nAlevler söndü, ama yaralarım duruyor. Tenimde kalan sıcaklık dışında hiçbir fark hissetmiyorum. Rahibin duaları sağır kulaklara ulaştı."

 agot_rhllor.0007.patient.fail_disease.outro_desc:0 "\n\nBekliyorum, göğsüm beklentiyle sıkışıyor. Ama hastalık beni bırakmıyor. Uzuvlarım hâlâ ağır, bedenim hâlâ güçsüz. Ateş yanıt vermedi."

 agot_rhllor.0007.patient.fail_curse.outro_desc:0 "\n\nAyağa kalkarken uzuvlarım titriyor, eskisinden güçlü değilim. Atmayı umduğum ağırlık hâlâ bana yapışık. Belki ateş bile bu laneti yakıp yok edemiyor."

 agot_rhllor.0007.patient.crit_fail_wounds.outro_desc:0 "\n\nUzuvlarımı kavurucu bir acı sarıyor. Ateş, onarmak için değil bozmak için tenimi yalarken soluk soluğa sendeliyorum. Ritüel beni iyileştirmedi — beni eskisinden daha kırık bıraktı."

 agot_rhllor.0007.patient.crit_fail_disease.outro_desc:0 "\n\nDamarlarımda ısı yayılıyor, ama dua ettiğim rahatlama değil. Görüşüm kararıyor, bedenim şiddetle titriyor. Ateş beni yüzüstü bıraktı. Hayır — bana ihanet etti."

 agot_rhllor.0007.patient.crit_fail_curse.outro_desc:0 "\n\nGöğsüm sıkışıyor, uzuvlarım kasılıyor. Bu bir lütuf değildi. Alevler beni damgaladı, eskisinden daha kötü bıraktı. Belki rahip yanılıyordu. Ya da belki R'hllor beni layık görmemiştir."

 agot_rhllor.0007.red_priest.succ_wounds.outro_desc:0 "\n\nYaralar kapanıyor, et kaynaşıyor. Ateş işini yaptı; bedeni, çeliği mühürlediği gibi mühürledi. Bu, Işık Efendisi'nin iradesiydi."

 agot_rhllor.0007.red_priest.succ_disease.outro_desc:0 "\n\nHastalığın onları terk edişini, nefeslerinin düzelmesini, renklerinin geri dönmesini izliyorum. Ateş yanıt verdi. İllet artık yok."

 agot_rhllor.0007.red_priest.succ_curse.outro_desc:0 "\n\nHer yük kaldırılamaz, ama bugün ateş birini hafifletti. Eskisinden daha sağlam ayakta duruyorlar. Bu bir mucize değil, ama yeterli."

 agot_rhllor.0007.red_priest.crit_succ_wounds.outro_desc:0 "\n\nBu, sıradan bir iyileşme değildi. Ateş onları güçlendirdi, ocaktaki çelik gibi yeniden dövdü. Yalnızca bir bütün değiller — daha fazlalar."

 agot_rhllor.0007.red_priest.crit_succ_disease.outro_desc:0 "\n\nPek çok kişinin iyileştiğini gördüm, ama bu farklı. İllet yalnızca yakılıp yok edilmedi — beden yenilendi, eskisinden fazlası verildi."

 agot_rhllor.0007.red_priest.crit_succ_curse.outro_desc:0 "\n\nR'hllor yalnızca merhamet göstermekten daha fazlasını yaptı — bu kişiyi alevlerinde yeniden dövdü. Eskisinden güçlü ayağa kalkıyorlar. Ateş onları seçti."

 agot_rhllor.0007.red_priest.fail_wounds.outro_desc:0 "\n\nAteş sessizdi. Yaralar duruyor. Bu bir sınav mı, yoksa bir yargı mı, söyleyemem."

 agot_rhllor.0007.red_priest.fail_disease.outro_desc:0 "\n\nHastalık sürüyor, alevlerden etkilenmiyor. Kurtuluş arayan herkes onu bulamaz."

 agot_rhllor.0007.red_priest.fail_curse.outro_desc:0 "\n\nYük duruyor. Belki ateş bile bu kaderi yakıp yok edemez."

 agot_rhllor.0007.red_priest.crit_fail_wounds.outro_desc:0 "\n\nAlevler onarmadı. Yuttular. Yanmış eti, yüzlerine kazınmış acıyı görüyorum. Ateş bugün merhametle yanıt vermedi."

 agot_rhllor.0007.red_priest.crit_fail_disease.outro_desc:0 "\n\nKasılıp kıvranıyorlar, bedenleri acıyla sarsılıyor. Ateş hastalığı arındırmadı — daha da kötüleştirdi."

 agot_rhllor.0007.red_priest.crit_fail_curse.outro_desc:0 "\n\nZalim bir yargı. İllet kaybolmuyor — derinleşiyor; sanki ateş onları daha da lanetlemiş gibi."

 agot_rhllor.0007.a.patient.success:0 "Ateş beni iyileştirdi. Sana teşekkür borçluyum."

 agot_rhllor.0007.a.patient.crit_success:0 "Her zamankinden daha güçlü hissediyorum. Bu sıradan bir iyileşme değildi."

 agot_rhllor.0007.a.patient.failure:0 "Alevler hiçbir şey yapmadı. Belki bu, bir budalanın umuduydu."

 agot_rhllor.0007.a.patient.crit_failure:0 "İyileşme vaat ettin, ama ateş bana yalnızca acı getirdi!"

 agot_rhllor.0007.a.red_priest.success:0 "Işık Efendisi bugün sana merhametini bahşetti. Onu akıllıca kullan."

 agot_rhllor.0007.a.red_priest.crit_success:0 "Ateş seni yalnızca iyileştirmedi — seni yeniden dövdü. Artık eskisinden güçlüsün."

 agot_rhllor.0007.a.red_priest.failure:0 "Işığı arayan herkes onu bulamaz. Belki bu bir yargı değil, bir sınavdır."

 agot_rhllor.0007.a.red_priest.crit_failure:0 "Alevler merhametlerini sunmadılar... Konuştular ve iradeleri kesindir."

 agot_rhllor.0007.b:0 "Ateş beni kurtardı... Artık gerçeğini görüyorum. R'hllor'un ışığında yürüyeceğim."

 agot_rhllor.0007.c:0 "Bu iyileşme değildi — bu işkenceydi! Muhafızlar, bu sahte rahibi yakalayın!"

 agot_rhllor.0008.t:0 "Ateşin Fısıltısı"

 agot_rhllor.0008.desc:0 "Bir kızıl rahip olan [red_priest.GetTitledFirstName] öne çıkıyor, [red_priest.GetHerHis] cübbesi titreyen korlar gibi dalgalanıyor. [red_priest.GetHerHis|U] bakışı üzerimde oyalanıyor — korkuyla değil, hürmetle değil, kesinlikle.\n\n#EMP "Sen illetlisin," #! diyor [red_priest.GetSheHe], [red_priest.GetHerHis] sesi sakin ama boyun eğmez.#EMP "Belki henüz hissetmiyorsun. Belki işaretleri görmezden geldin. Ama ateş, gözün görmediğini görür. Işık Efendisi beni bir sebeple sana getirdi." #!\n\n[red_priest.GetHerHim]'i ben aramamıştım; yine de [red_priest.GetSheHe] burada duruyor, başkalarının veremediğini sunuyor."

 agot_rhllor.0008.a:0 "Bana yardım edebiliyorsan, yap."

 agot_rhllor.0008.b:0 "Ateşine ihtiyacım yok."

 agot_rhllor.0009.t:0 "Ateşte Bir Pazarlık"

 agot_rhllor.0009.desc:0 "Bir kızıl rahip olan [red_priest.GetTitledFirstName] öne çıkıyor, [red_priest.GetHerHis] cübbesi rüzgârdaki korlar gibi dalgalanıyor. [red_priest.GetSheHe] konuşurken [red_priest.GetHerHis|U] gözleri inançla yanıyor.\n\n#EMP "Görsen de görmesen de, sen hastasın. Ateş, etin gizlediğini ortaya çıkarır. Ama R'hllor, [red_priest.GetHerHis] armağanlarını karşılıksız vermez. İyileşmek istiyorsan, önce onun ışığında yürümelisin." #!\n\n[red_priest.GetSheHe|U] kurtuluş sunuyor — ama bir bedel karşılığında. Onun iyileştirmesini kabul etmek için eski tanrılarımı terk edip Işık Efendisi'ni benimsemeliyim."

 agot_rhllor.0009.a:0 "Kurtuluş demekse, ateşte yürürüm."

 agot_rhllor.0009.b:0 "Senin tanrının önünde diz çökmeyeceğim."

 agot_rhllor.0009.c:0 "Bu kâfir zayıfları avlıyor — [red_priest.GetHerHim]'i yakalayın!"
