l_english:

 death_management.killer.witnessed.enemy_dragon:0 "Kimse [battle_death_killer.GetFirstName]'in gücüne karşı duramadı. [battle_death_killer_rider.GetTitledFirstName] tarafından sürülen ejderha, düşman hatlarını yara yara ilerledi; [dead_character.GetFirstNameNoTooltip] de sayısız kurbanından biri oldu. "

 death_management.killer.witnessed.friendly_dragon:0 "Kimse [battle_death_killer.GetFirstName]'in dehşetine karşı duramadı. [battle_death_killer_rider.GetTitledFirstName] tarafından sürülen ejderha, saflarımızı yara yara ilerledi; [dead_character.GetFirstNameNoTooltip] de ateş ve alevlere kurban gidenlerden biriydi. "

 death_management.killer.witnessed.your_killer_dragon:0 "[battle_death_killer.GetFirstName]'in üzerinde savaş alanını yara yara ilerlerken kimse onun gücüne karşı duramadı. [battle_death_killer.GetFirstName]'e saldırı emri verdiğimde gözlerim aniden tam önümüzde, doğrudan ateş hattında duran [dead_character.GetTitledFirstName]'i yakalıyor."

 death_management.killer_dragon:0 "[dead_character.GetSheHe|U], [battle_death_killer_rider.GetTitledFirstName]'in ejderhası [battle_death_killer.GetFirstName] önünde can verenlerden biriydi.'#!"

