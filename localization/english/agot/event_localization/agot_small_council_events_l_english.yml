l_english:

 agot_small_council.1.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_small_council.0001.t:0 "Küçük Konseyde Görev Yapıyor"

 agot_small_council.0001.desc:0 "[secondary_recipient.GetSheHe] küçük konseyde diyara hangi görevde hizmet edecek?"

 agot_small_council.0001.a:0 "[secondary_recipient.GetSheHe|U], Kralın Elim olarak hizmet edecek."

 agot_small_council.0001.b:0 "[secondary_recipient.GetSheHe|U], Şansölyem olarak hizmet edecek."

 agot_small_council.0001.c:0 "[secondary_recipient.GetSheHe|U], Kâhyam olarak hizmet edecek."

 agot_small_council.0001.d:0 "[secondary_recipient.GetSheHe|U], Mareşalim olarak hizmet edecek."

 agot_small_council.0001.e:0 "[secondary_recipient.GetSheHe|U], Amiralim olarak hizmet edecek."

 agot_small_council.0001.f:0 "[secondary_recipient.GetSheHe|U], Casuslar Efendim olarak hizmet edecek."

 agot_small_council.0001.g:0 "Bu [secondary_recipient.GetWomanMan] benim ahırımı temizlemeye bile pek uygun değil."

 agot_small_council.0003.desc:0 "Hükümdarım, sevgili vassalimin becerileri kendi topraklarımın kâhyalığı için bu kadar hayatiyken, onun hizmetini size sunmamı pek bekleyemezsiniz. Doğrudan size hizmet etselerdi mahrum kalacağım gelirleri saymıyorum bile..."

 agot_small_council.0003.a:0 "Korkularınızı dindirmeme izin verin."

 agot_small_council.0003.a.tt:0 "[secondary_recipient.GetName], konseyinize katılıyor"

 agot_small_council.0003.b:0 "Kendi vassallerimin hakları için ödeme yapmayacağım!"

 agot_small_council.0003.c:0 "Bunu altından çok daha değerli bir şey için yapacaksınız"

 agot_small_council.0004.desc:0 "Diyarın kendisine hizmet edecek sadık ve yetenekli Lordlara ihtiyacı olduğunu anlıyorum, tıpkı bana olduğu gibi.\n\nBelki de bana her ihtiyacım olduğunda destek olacağınıza söz verirseniz, meşru vassalimin hizmetini elinizde tutmanıza izin vermek içimi rahatlatır."

 agot_small_council.0004.a:0 "Kabul ediyorum, diyarın iyiliği için."

 agot_small_council.0004.a.tt:0 "[secondary_recipient.GetName], konseyinize katılıyor"

 agot_small_council.0004.b:0 "Seninle pazarlık etmeyeceğim!"

 agot_small_council.0004.c:0 "Önce bana ödeyecek başka borçların var"

 agot_small_council.0005.desc:0 "[secondary_recipient.GetNamePossessive] hükümdarı olarak haklarımdan vazgeçmeye niyetim yok; boş koltuğunuzu dolduracak farklı bir [secondary_recipient.GetLadyLord] bulmanız gerekecek."

 agot_small_council.0005.a:0 "Öyleyse beni bir daha rahatsız etme, budala."
