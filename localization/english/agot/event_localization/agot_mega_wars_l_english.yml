 agot_mega_wars.0003.desc.c.5:0 "\n\n[ROOT.Char.GetLiege.GetTitledFirstName] bağımsızlık ilan etmeyi seçti..."

 agot_mega_wars.0003.a:0 "Asiler bunun bedelini ağır ödeyecek."

 agot_mega_wars.0003.a.tt:0 "[mw_rebel_leader.GetFullName]'e ve [mw_rebel_leader.GetHerHis] komplocularına ihanet ediyorsunuz."

 agot_mega_wars.0003.a.dragonstone_positive:0 "Umarım askerlerim [Select_CString(mw_crown.IsFemale,'queen','king')]'e iyi hizmet eder."

 agot_mega_wars.0003.a.dragonstone_negative:0 "[mw_crown.GetSheHe|U] haklı değil. Dragonstone benim olmalı!"

 agot_mega_wars.0003.ba:0 "Seçimimi çoktan yaptım..."

 agot_mega_wars.0003.bb:0 "Savaşın gidişatı karar verecek..."

 agot_mega_wars.0003.bc:0 "İşin içine girmek için bir neden göremiyorum."

 agot_mega_wars.0003.b.tt:0 "Bu savaşa katılmayacak ve [mw_old_stance_leader.GetFullName]'i desteklemeye devam edeceksiniz."

 agot_mega_wars.0003.c:0 "İsyanın davası haklı!"

 agot_mega_wars.0003.c.tt:0 "İsyana [mw_rebel_leader.GetFullName]'in tarafında katılıyorsun."

 agot_mega_wars.0003.c.tt.independence:0 "Bu bir bağımsızlık savaşı olduğundan, galip gelirseniz siz de bağımsızlık kazanacaksınız!"

 agot_mega_wars.0003.da:0 "[ROOT.Char.GetLiege.GetTitledFirstName]'i takip edeceğim!"

 agot_mega_wars.0003.db:0 "Şimdi kendi yolumuzu çizme zamanı!"

 agot_mega_wars.0003.d.tt:0 "[mw_crown.GetFullName]'e karşı kendi bağımsızlık savaşınızı başlatıyorsunuz."

 agot_mega_wars.0003.tt.negative:0 "Daha önce [mw_is_loyal_to.GetName]'e sadakat yemini ettiğim için davranışım onursuzluk olarak görülecek."

