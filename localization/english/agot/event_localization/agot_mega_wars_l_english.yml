 agot_mega_wars.0505.b:0 "... ona sahip olacak"

 agot_mega_wars.0505.c:0 "Sonuçta, neden kendime saklamayayım ki?"

 agot_mega_wars.0506.t:0 "Kraliyet Sonrası"

 agot_mega_wars.0506.desc:0 "Savaş kazanıldı; kraliyet ailesi tahttan indirildi. Gasıbın sancağı artık Kralın Şehri'nin üzerinde dalgalanıyor.\n\nŞimdi zor bir karar verilmeli: Eski kraliyet ailesine ne yapılmalı? YER TUTUCU Eski kraliyet ailesine ne yapılacağına karar ver; Onları rahat bırak, hepsini öldür, sürgün et"

 agot_mega_wars.0506.a:0 "Onları rahat bırak."

 agot_mega_wars.0506.b:0 "Hepsini öldür."

 agot_mega_wars.0506.c:0 "Onları krallıktan kov."

 agot_mega_wars.0510.t:0 "Yeni Bir Hükümdar"

 agot_mega_wars.0510.desc.a:0 "[primary_target_title.GetNameNoTooltip] lordlarına ve hanımefendilerine,"

 agot_mega_wars.0510.desc.b:0 "\nBen, [choosing_ruler.GetFullName], işbu fermanla ilan ediyorum ki:"

 agot_mega_wars.0510.desc.c:0 "\n $EFFECT_LIST_BULLET$ Bundan böyle [primary_target_title.GetName]'i ben yöneteceğim"

 agot_mega_wars.0510.desc.d:0 "\n $EFFECT_LIST_BULLET$ Bundan böyle [primary_target_title.GetName]'i [chosen_crown_ruler.GetName] yönetecek"

 agot_mega_wars.0510.desc.e:0 "\n $EFFECT_LIST_BULLET$ [war_loser.GetName], [primary_target_title.GetHolder.GetTitledFirstName] lehine tahttan indirilecek"

 agot_mega_wars.0510.desc.f:0 "\n $EFFECT_LIST_BULLET$ [old_demesne_main_title.GetHolder.GetLadyLord|U] [old_demesne_main_title.GetHolder.GetFirstName]'e [old_demesne_main_title.GetName] bağışlanacak"

 agot_mega_wars.0510.a:0 "Hırslarımı kendime saklayacağım."

 agot_mega_wars.0510.b:0 "[primary_target_title.GetHolder.GetTitledFirstName] nasıl hükmedecek acaba..."

 agot_mega_wars.0600.t:0 "Savaşın Ardından"

 agot_mega_wars.0600.desc:0 "En sonunda, bana karşı ayaklanıp haklı hükümdarlığımı bozmaya çalışanlar karşısında zafere ulaştık. Hainler artık avucumun içindeyken, başlarına nasıl bir kader geleceğini seçme zamanı geldi. Onlara merhamet mi göstereceğim, yoksa suçlarının bedelini mi ödeteceğim... "

 agot_pui_events.0600.desc.mw_rebels_won:0 "Tüm ihtimallere rağmen, bir zamanlar tahta göz diken zorbaları devirdik; güç üzerindeki kavrayışlarını parçalayıp hak sahibi hükümdar olarak yerimi sağlamlaştırdık. Güç koridorları artık bize açık ve davamıza karşı çıkanlar yenik düştü.\n\nBizi zincirlerde tutmaya çalışanların kaderini belirleme zamanı geldi. Merhamet mi göstereceğiz, yoksa yol açtıkları acılar için adalet mi dağıtılacak?"

 agot_mega_wars.0600.a:0 "Onları önüme getirin!"

 agot_mega_wars.0601.t:0 "Savaşın Ardından"

 agot_mega_wars.0601.desc:0 "[selected_traitor.GetTitledFirstName] önümde diz çöküyor; [selected_traitor.GetHerHis] ihaneti için hükmümü almaya hazır. [selected_traitor.GetSheHe]'nin alması gereken ceza için önümde pek çok seçenek var; kimi hafif, kimi ağır. Hangisini seçeceğim, [selected_traitor.GetHerHis] tahta karşı ihanetinin ne kadar ağır olduğuna bağlı."

 agot_mega_wars.0601.a:0 "[selected_traitor.GetLiege.GetTitledFirstNameNoTooltip] [selected_traitor.GetHerHis] cezasına karar verecek."

 agot_mega_wars.0601.b:0 "Bırak [selected_traitor.GetLiege.GetTitledFirstNameNoTooltip] [selected_traitor.GetLiege.GetHerHis] vasallarının cezasına karar versin."

 agot_mega_wars.0601.b.tt:0 "[selected_traitor.GetLiege.GetTitledFirstNameNoTooltip] [temp_traitors_scope.GetTitledFirstNamePossessiveNoTooltip] cezasına karar verecek."

 agot_mega_wars.0601.c:0 "[selected_traitor.GetSheHe|U] zindanlarımda biraz daha bekleyebilir."

 agot_mega_wars.0601.d:0 "Benim iradem yerine gelecek."

 agot_mega_wars.0601.e:0 "#N DEBUG #! Tüm hainleri atla"

