 agot_mega_wars.0002.t:0 "Savaştaki Bir Krallık"

 agot_mega_wars.0002.desc:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTier] bir savaş hâlinde. Büyük lordlara kuzgunlar gönderip onları [mw_crown.GetFullNamePossessive] savunmasına çağırmalıyız."

 agot_mega_wars.0002.a:0 "Sancakları çağır!"

 agot_mega_wars.0002.a.tt:0 "[mw_rebel_leader.GetName] size karşı bir [Concept('agot_mega_wars', 'Mega War')|E] başlattı!"

 agot_mega_wars.0003.desc.a.10:0 "Zamanımız geldi! [mw_rebel_leader.GetTitledFirstName], bizim desteğimizle fraksiyonumuzun taleplerini [mw_crown.GetTitledFirstName]'e iletti. Ne var ki [mw_crown.GetNameRegnal] bizi reddetti. İstediğimizi almak için artık demir diplomasi kullanmamız gerekiyor..."

 agot_mega_wars.0003.desc.a.11:0 "[mw_rebel_leader.GetFullName], [war.GetName] içinde [mw_crown.GetFullName]'e karşı ayaklandı. [mw_diarch_target.GetName] için naiplik omuzlarıma bindiğinden, [mw_diarch_target.GetPrimaryTitle.GetNameNoTier]'in [mw_crown.GetTitledFirstName] ile mi duracağına, [mw_rebel_leader.GetTitledFirstName]'e mi katılacağına ya da tarafsız kalıp kararımı zamanın akışına mı bırakacağıma karar vermeliyim. Ayrıca bu çatışmadaki rolümün ne olacağına da karar vermem gerekiyor..."

 agot_mega_wars.0003.desc.a.12:0 "[mw_rebel_leader.GetFullName], [war.GetName] içinde [mw_crown.GetFullName]'e karşı ayaklandı. [mw_diarch_target.GetName] için naiplik omuzlarıma bindiğinden, [mw_diarch_target.GetPrimaryTitle.GetNameNoTier]'in [mw_crown.GetTitledFirstName] ile mi duracağına, [mw_rebel_leader.GetTitledFirstName]'e mi katılacağına ya da tarafsız kalıp kararımı zamanın akışına mı bırakacağıma karar vermeliyim."

 agot_mega_wars.0003.desc.a.13:0 "[SCOPE.sC('dragonstone_prince').Custom2('RelationToMeShort', SCOPE.sC('mw_crown'))] [Select_CString(mw_crown.IsFemale,'queen','king')], savaşa gideceğimizi ilan etti. [mw_rebel_leader.GetFullName], [war.GetName] içinde bize karşı ayaklandı!\n\nDragonstone [Select_CString(dragonstone_prince.IsFemale,'Princess','Prince')]'i olarak birliklerim krallığı savunmada vazgeçilmezdir. Bu korkunç bir dönem ve her sağlıklı asker hanemiz ve onurumuz için savaşmaya hazır olmalı.\n\nSavaşın alevleri üzerimizde ve düşmana karşı dimdik durmalıyız."

 agot_mega_wars.0003.desc.a.14:0 "Zamanı geldi! [mw_rebel_leader.GetTitledFirstName], fraksiyonun taleplerini [mw_crown.GetTitledFirstName]'e iletti. [mw_crown.GetHerHis] reddinden sonra artık istediklerini... demir diplomasiyle elde etmeye çalışacaklar..."

 agot_mega_wars.0003.desc.a.15:0 "[mw_rebel_leader.GetTitledFirstName], [war.GetName] içinde [mw_crown.GetFullName]'e karşı ayaklandı. [mw_crown.GetFullName] ile durmayı, [mw_rebel_leader.GetFullName]'e katılmayı ya da tarafsız kalıp kararımı zamanın akışına bırakmayı seçmeliyim."

 agot_mega_wars.0003.desc.a.20:0 "[mw_rebel_leader.GetFullName], [mw_crown.GetFullName]'e savaş ilan etti. [mw_diarch_target.GetName] için naiplik omuzlarıma bindiğinden, [mw_diarch_target.GetPrimaryTitle.GetNameNoTier]'in kendini [mw_crown.GetFullNamePossessiveNoTooltip] davasına adayıp adamayacağına, [mw_rebel_leader.GetFullNameNoTooltip]'e sadık kalıp kalmayacağına ya da tarafsız kalıp kararımı zamanın akışına bırakıp bırakmayacağıma karar vermeliyim."

 agot_mega_wars.0003.desc.a.21:0 "[mw_rebel_leader.GetTitledFirstName], [mw_crown.GetFullName]'e savaş ilan etti. Kendimi [mw_crown.GetFullNamePossessive] davasına mı adayacağımı, [mw_rebel_leader.GetTitledFirstNamePossessive] davasına mı adayacağımı ya da tarafsız kalıp kararımı zamanın akışına mı bırakacağımı seçmeliyim."

 agot_mega_wars.0003.desc.b.1:0 "Ne var ki daha önce [mw_loyalty_target_1.GetName]'e sadakat yemini ettiğim için artık sözümde durmam bekleniyor..."

 agot_mega_wars.0003.desc.c.1:0 "\n\nHükümdarım [ROOT.Char.GetLiege.GetTitledFirstName]'e karşı bir savaş yürütürken ellerim bağlı..."

 agot_mega_wars.0003.desc.c.2:0 "\n\n[ROOT.Char.GetLiege.GetTitledFirstName] Tahtı desteklemeyi seçti..."

