 agot_mega_wars.0004.desc:0 "Savaşın patlak vermesiyle güçlerimi göndermem bekleniyor. Ne kadarını seferber edeceğime karar vermeliyim..."

 agot_mega_wars.0004.a:0 "[mw_target_scope.GetTitledFirstName] tüm adamlarımı alacak!"

 agot_mega_wars.0004.b:0 "[mw_target_scope.GetSheHe|U] zaten yeterince alıyor."

 agot_mega_wars.0005.desc.a:0 "Savaş sürerken, [ROOT.Char.GetDiarchy.GetDiarch.GetDiarchTitle] olan [ROOT.Char.GetDiarchy.GetDiarch.GetFirstName], [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'in [war.GetName] içinde [mw_crown.GetFullName]'i desteklemesine karar verdi."

 agot_mega_wars.0005.desc.b:0 "Savaş sürerken, [ROOT.Char.GetDiarchy.GetDiarch.GetDiarchTitle] olan [ROOT.Char.GetDiarchy.GetDiarch.GetFirstName], [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'in tarafsız kalmasına karar verdi."

 agot_mega_wars.0005.desc.c:0 "Savaş sürerken, [ROOT.Char.GetDiarchy.GetDiarch.GetDiarchTitle] olan [ROOT.Char.GetDiarchy.GetDiarch.GetFirstName], [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'in [war.GetName] içinde [mw_rebel_leader.GetFullName]'i desteklemesine karar verdi."

 agot_mega_wars.0005.desc:0 "\nKontrolü yeniden kazandığım anda yeniden düşünüp zamanın gidişatının cepheleri nasıl şekillendirdiğine bağlı olarak kendi kararımı vermeliyim..."

 agot_mega_wars.0005.a:0 "Ne yapalım, işte böyle..."

