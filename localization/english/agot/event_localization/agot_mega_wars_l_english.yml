 agot_mega_wars.0503.d:0 "Kendime saklayacağım."

 agot_mega_wars.0503.desc.msg:0 "[old_demesne_main_title.GetName], [old_demesne_main_title.GetHolder.GetLadyLord|U] [old_demesne_main_title.GetHolder.GetFirstName]'e bağışlandı."

