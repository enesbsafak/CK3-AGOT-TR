 agot_mega_wars.0603.desc.a:0 "İhanet suçumun cezası olarak [ROOT.Var('crown_target').Char.GetName] şunları buyurdu: "

 agot_mega_wars.0603.desc.b:0 "[ROOT.Var('selected_hostage').Char.GetName], [ROOT.Var('crown_target').Char.GetTitledFirstName] tarafından rehin alınacak:"

 agot_mega_wars.0603.desc.c:0 "\n\n[selected_title.GetName] elimden alınacak."

 agot_mega_wars.0603.desc.d:0 "\n\nBirincil unvanlarım elimden alınacak."

 agot_mega_wars.0603.desc.e:0 "\n\nİkincil unvanlarım elimden alınacak."

 agot_mega_wars.0603.desc.f:0 "\n\nHanem tüm topraklarından ve unvanlarından yoksun bırakılacak."

 agot_mega_wars.0603.desc.g:0 "\n\nMevcut makamım dışındaki tüm unvanlar elimden alınacak."

 agot_mega_wars.0603.desc.h:0 "\n\nTopraklarımın yarısı elimden alınacak."

 agot_mega_wars.0603.desc.i:0 "\n\n[ROOT.Char.MakeScope.Var('selected_artifact').Artifact.GetName]'i [ROOT.Var('crown_target').Char.GetName]'e vermek zorundayım."

 agot_mega_wars.0603.desc.j:0 "\n\nİdam edileceğim."

 agot_mega_wars.0603.desc.k:0 "\n\nAilem idam edilecek."

 agot_mega_wars.0603.desc.l:0 "\n\nTüm hanedanım yok edilecek."

 agot_mega_wars.0603.desc.m:0 "\n\nSiyahları giymem için Duvar'a gönderileceğim."

 agot_mega_wars.0603.desc.n:0 "\n\n[ROOT.Var('crown_target').Char.GetPrimaryTitle.GetNameNoTier]'den kovulacağım."

 agot_mega_wars.0603.desc.o:0 "\n\nAilem [ROOT.Var('crown_target').Char.GetPrimaryTitle.GetNameNoTier]'den kovulacak."

 agot_mega_wars.0603.desc.p:0 "\n\nTüm hanedanım [ROOT.Var('crown_target').Char.GetPrimaryTitle.GetNameNoTier]'den kovulacak."

