 agot_mega_wars.0010.a:0 "Bakalım bu iş nasıl sonuçlanacak..."

 agot_mega_wars.0011.t:0 "[mw_independence_rebel_leader.GetDynastyName] Ayaklanması"

 agot_mega_wars.0011.desc.a:0 "[mw_crown.GetPrimaryTitle.GetNameNoTier] kaos içindeyken [mw_independence_rebel_leader.GetTitledFirstName] [mw_crown.GetTitledFirstName]'e bağlılığını reddedip isyan bayrağını kaldırdı."

 agot_mega_wars.0011.desc.b:0 "[mw_crown.GetPrimaryTitle.GetNameNoTier] kaos içindeyken [mw_independence_rebel_leader.GetTitledFirstName] ve [mw_independence_rebel_loc_scope.GetTitledFirstName] [mw_crown.GetTitledFirstName]'e bağlılıklarını reddedip isyan bayrağını kaldırdı."

 agot_mega_wars.0011.desc.c:0 "[mw_crown.GetPrimaryTitle.GetNameNoTier] kaos içindeyken [mw_independence_rebel_leader.GetTitledFirstName] ve diğerleri [mw_crown.GetTitledFirstName]'e bağlılıklarını reddedip isyan bayrağını kaldırdı."

 agot_mega_wars.0011.a:0 "[mw_independence_rebel_leader.GetSheHe|U] bu günü çok arar!"

 agot_mega_wars.0011.a.tt:0 "[temp_loc_scope.GetTitledFirstName] ile savaşa gireceğim!"

 agot_mega_wars.0011.b:0 "Bu işten yoruldum, bırak [mw_independence_rebel_leader.GetHerHim] gitsin..."

 agot_mega_wars.0011.b.tt:0 "[temp_loc_scope.GetTitledFirstName] bağımsız oluyor!"

 agot_mega_wars.0012.opening:0 "[mw_independence_rebel_leader.GetName]'e,"

 agot_mega_wars.0012.desc.a:0 "[mw_independence_rebel_leader.GetPrimaryTitle.GetNameNoTier] hakla benim; savaşmadan ondan vazgeçmem!"

 agot_mega_wars.0012.desc.b:0 "Daha fazla kan dökülmesini önlemek için [mw_independence_rebel_leader.GetPrimaryTitle.GetNameNoTier] üzerindeki egemenliğimden vazgeçmekten başka seçeneğim yok."

 agot_mega_wars.0012.a:0 "Öyleyse savaş olacak!"

 agot_mega_wars.0012.b:0 "Akıllıca bir seçim."

 agot_mega_wars.0020.opening:0 "Bir sadakat meselesi..."

 agot_mega_wars.0020.desc:0 "[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetName], [faction_target.GetName] [faction_targeted_title.GetName]'i çok uzun süredir yönetiyor; oysa hak sahibi [ROOT.Char.Custom('GetQueenKing')] sensin. Bu yüzden [faction_target.GetTitledFirstName]'e tahtı sana devretmesi için taleplerimi ilettim. Ne yazık ki [faction_target.GetSheHe] reddetti ve savaş artık kaçınılmaz.\nBu mücadelede bize önderlik edecek misin?"

 agot_mega_wars.0020.a:0 "Hakla bana ait olanı alacağım!"

 agot_mega_wars.0020.b:0 "Bu fazla riskli. Devam edin ama beni bu işin dışında tutun..."

 agot_mega_wars.0020.c:0 "Ellerim bağlı..."

 agot_mega_wars.0021.opening:0 "Bir sadakat meselesi..."

 agot_mega_wars.0021.desc.a:0 "[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetName], nihayet iddiam zorlanacak. [faction_target.GetFirstName]'in günleri saysın ve [faction_claimant.Custom('GetQueenKing')] [faction_claimant.GetFirstName]'in hükümdarlığı başlasın.\nBizi zafere ben götüreceğim!"

 agot_mega_wars.0021.desc.b:0 "[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetName], nihayet iddiam zorlanacak.\nİşler bu durumdayken bu mücadelede sana destek olamam."

 agot_mega_wars.0021.a:0 "Öyle olsun."

 agot_mega_wars.0500.t:0 "Kral Olmak ya da Olmamak"

 agot_mega_wars.0500.desc.a:0 "Katil [defender.GetHouse.GetBaseName] hanedanıyla savaşımdan galip çıktım."

 agot_mega_wars.0500.desc.ba:0 "Bana sadık güçler #italic beni#! [ROOT.Char.Custom('GetQueenKing')] yapmak istiyor. İddiamın, [ROOT.Char.Custom2('RelationToMe', claim_ancestor)] [claim_ancestor.GetFirstName] [claim_ancestor.GetDynastyName]'den geleceğini söylüyorlar..."

 agot_mega_wars.0500.desc.bb:0 "\n\nAma kendime sormalıyım: Gerçekten [ROOT.Char.Custom('GetQueenKing')] olmak istiyor muyum? Bence [chosen_LP.GetFirstName] [chosen_LP.GetDynastyName] krallığı yönetmeye çok daha uygun."

 agot_mega_wars.0500.desc.bc:0 "\n\nAma kendime sormalıyım: Gerçekten [ROOT.Char.Custom('GetQueenKing')] olmak istiyor muyum? Bence [option_LP_1.GetFirstName] [option_LP_1.GetDynastyName] ve [option_LP_2.GetFirstName] [option_LP_2.GetDynastyName] krallığı yönetmeye çok daha uygun."

 agot_mega_wars.0500.desc.bd:0 "\n\nAma kendime sormalıyım: Gerçekten [ROOT.Char.Custom('GetQueenKing')] olmak istiyor muyum? Bence [option_LP_1.GetFirstName] [option_LP_1.GetDynastyName] ve [option_LP_2.GetFirstName] [option_LP_2.GetDynastyName] gibi lordlar krallığı yönetmeye çok daha uygun."

 agot_mega_wars.0500.desc.be:0 "\n\nBana itiraz edecek başka kimse kalmadığına göre [primary_target_title.GetName]'i kendime alabilirim."

 agot_mega_wars.0500.desc.c:0 "Bu büyük adamlardan birini kral yapmayı seçersem kimse seçimime itiraz etmeyecek..."

 agot_mega_wars.0500.desc.d:0 "Ne yazık ki [ROOT.Var('si_selected_character').Char.GetTitledFirstName] reddetti; [ROOT.Var('si_selected_character').Char.GetSheHe] krallığı yönetmeyecek. Bu yüzden bir kez daha karar vermek zorundayım...."

 agot_mega_wars.0500.a:0 "[defender.GetTitledFirstName]'i tahttan indirmek yeterli olmalı."

 agot_mega_wars.0500.b:0 "Haklılar, hükmetmesi gereken benim."

 agot_mega_wars.0500.ca:0 "[chosen_LP.GetTitledFirstName] hükmetmeli."

 MEGA_WARS_0500_ca_TOOLTIP:0 "[chosen_LP.GetTitledFirstName] seçiminize yanıt verecek."

