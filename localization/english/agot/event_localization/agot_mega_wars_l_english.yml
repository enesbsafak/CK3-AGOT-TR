 agot_mega_wars.0505.t:0 "Dragonstone Meselesi"

 agot_mega_wars.0505.desc:0 "[old_demesne_main_title.GetName] meselesi çözüldüğüne göre geriye son bir soru kalıyor: Targaryen Hanesi'nin kadim makamı ve Demir Taht varisinin makamı olan Dragonstone'a ne olacak?\n"

