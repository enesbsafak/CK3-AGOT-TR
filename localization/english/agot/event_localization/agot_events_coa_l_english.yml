l_english:

 agot_coa_events.0002.t:0 "Yeni Bir Sancak Sahiplenme"

 agot_coa_events.0002.desc:0 "Savaş davulları diyarın dört bir yanında yankılanırken, kişisel yiğitliğinizi ve hırsınızı yansıtan bir sancak taşıyarak kuvvetlerinizin ön saflarında duruyorsunuz.\n\nKontrolünüz altındaki topraklar için kişisel armanızı benimseyerek ailenizden ayrışmaya karar verip vermeyeceğinize karar verme zamanı geldi. Bu cesur hamle, benzersiz liderliğinizi ve başlatmayı amaçladığınız yeni çağı simgeleyecek.\n\nAkrabalarınızın gölgelerinin üzerine çıkacak mısınız, yoksa Hanenizin mirasını onurlandırmaya devam mı edeceksiniz?"

 agot_coa_events.0002.a:0 "Sancağım dalgalanacak."

 agot_coa_events.0002.a.tt:0 "[agot_personal_coa|e]'niz, toprak sahibi unvanlarınız için kullanılacak."

 agot_coa_events.0002.b:0 " Ailemin sancağını tutacağım."
