l_english:

 agot_knighthood.0016.t:0 "Gezgin Şövalye"

 agot_knighthood.0016.desc:0 "Bir gezgin şövalye son birkaç gecedir salonlarımda uyuyor. Görünüşe göre oğlum [potential_child_squire.GetName] ondan hoşlanmaya başladı. Gezgin şövalye de aynı şekilde oğluma ısındı. Oğlum, onun şövalyelik ve mertlik dolu heyecanlı hikâyelerini dinledikten sonra gezgin şövalyeye hayran kaldı.\n\nSarayımdaki son gününde gezgin şövalye, sarayımda kalmayı ve oğlumu yaveri olarak almayı teklif ediyor.\n\nAdam yeterince onurlu görünüyor ve bu, oğlumu çok ama çok mutlu edecek. Bunu düşünmem gerekiyor."

 agot_knighthood.0016.a:0 "Evet, kalmalısın ve onu yaver olarak almalısın!"

 agot_knighthood.0016.a.tt:0 "[hedge_knight.GetName], sarayına katılacak ve oğlunu [hedge_knight.GetHerHis] [squire|e] olarak alacak."

 agot_knighthood.0016.b:0 "Hayır, doğru şövalye olduğunu düşünmüyorum."

 agot_knighthood.0016.b.tt:0 "[hedge_knight.GetName], sarayından ayrılacak."

 agot_knighthood.0700.t:0 "Gezgin Şövalye ve Yedek"

 agot_knighthood.0700.desc:0 "[hedge_knight.GetName] adında bir gezgin şövalye, yakın zamanda sarayımı ziyaret etti. Doğuştan bir [hedge_knight.GetCulture.GetName]; bir lordun hizmetini aramak için diyarı boydan boya dolaşmış. Söylentiye göre Batı Toprakları'nın küçük bir soylu soyundan geldiği ve elbette bir şövalye olduğu dışında bu adam hakkında pek az şey biliyorum.\n\nOna hiç ilgi göstermedim ve bu yüzden yakında yola koyulmasını bekliyordum. Ancak o, gizlice yanıma geldi ve istediği kadar kalmasına izin verilmesi karşılığında oğlum [potential_child_knight.GetName]'i şövalye ilan etmeyi teklif etti!"

 agot_knighthood.0700.a:0 "Sanırım böyle bir düzenleme yapılabilir."

 agot_knighthood.0700.b:0 "Hayır, buna razı olmayacağım."

 agot_knighthood.0701.t:0 "Gezgin Şövalye ve Lord"

 agot_knighthood.0701.desc:0 "[hedge_knight.GetName] adında bir gezgin şövalye, yakın zamanda sarayımı ziyaret etti. Doğuştan bir [hedge_knight.GetCulture.GetName]; bilinmeyen sebeplerle diyarı boydan boya dolaşıyor.\n\nBen ona hiç ilgi göstermesem de, görünüşe göre o bana ilgi gösterdi. Bu sabah erkenden hizmetkârlarımdan birine, bana şövalyelik teklif eden, ta kendisi [hedge_knight.GetFirstNamePossessive] imzalı kaba yazılmış bir not iletildi. Nota göre, doğru fiyat karşılığında ben de şövalye ilan edilebilirim."

 agot_knighthood.0701.a:0 "Bu anlaşmayı kabul edeceğim."

 agot_knighthood.0701.b:0 "Hayır, buna razı olmayacağım."

 agot_knighthood.0017.t:0 "Hanedan Şövalyeliği"

 agot_knighthood.0017.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_squire'))] [potential_squire.GetName] henüz bir yaver değil. Belki [potential_squire.GetHerHim]'e yaverim olmayı teklif ederek aramızda daha iyi bir ilişki kurabilirim?"

 agot_knighthood.0017.a:0 "Evet, [potential_squire.GetHerHim]'e yaverlik teklif et."

 agot_knighthood.0017.a.tt:0 "[potential_squire.GetName]'den [squire|e] olmasını istersin"

 agot_knighthood.0017.b:0 "Hayır, bu zaman kaybı."

 agot_knighthood.0017.b.tt:0 "[potential_squire.GetName]'den yaverin olmasını istemezsin."

 agot_knighthood.0018.opening:0 "[potential_knight_for_child.GetName]'e,"

 agot_knighthood.0018.desc:0 "Henüz bir yaver olmadığını fark ettim! Bunu düzeltmek istersen, kendine yakında gönüllü bir şövalye bulman gerek...\n\nNeyse ki kader bizi kan bağıyla bağladı! Arzu edersen, seni yaverim yaparım ve bir gün, hak edersen, sana şövalyelik bahşederim."

 agot_knighthood.0018.a:0 "Vay, kabul ediyorum!"

 agot_knighthood.0018.b:0 "Üzgünüm, ama olmaz."

 agot_knighthood.0018.b_toast:0 "[potential_squire.GetName] Yanıtlıyor"

 agot_knighthood.0018.b_toast_tt:0 "[potential_squire.GetName], teklifini reddetti."

 agot_knighthood.0019.opening:0 "[knight_offerer.GetName]'e,"

 agot_knighthood.0019.desc:0 "Yaverin olma teklifini kabul ediyorum. Damarlarımızda aynı kan akıyor; o halde bu bağları güçlendirmeye bakmalıyız!"

 agot_knighthood.0019.a:0 "Harika!"

 agot_knighthood.became_a_squire_toast.t:0 "Yaverlik"

 agot_knighthood.became_a_squire_toast.tt:0 "[my_knight.GetName]'in yaveri oldum"

 agot_knighthood.0300.t:0 "Bir Yaverin İlerleyişi"

 agot_knighthood.0300.desc:0 "Yaverim [my_squire.GetName], [my_squire.GetHerHis] değerini kanıtladı! [my_squire.GetSheHe|U] bir yaver olarak çok yol kat etti ve [my_squire.GetHerHim]'in şövalye ilan edilme zamanının geldiğine inanıyorum."

 agot_knighthood.0300.a:0 "[my_squire.GetHerHim]'i şövalye ilan edeceğim."

 agot_knighthood.0300.a.tt:0 "[my_squire.GetName] şövalye ilan edilecek!"

 agot_knighthood.0320.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))|U] Şövalye İlan Edildi!"

 agot_knighthood.0320.desc_same_house:0 "Kulağıma, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))] [my_relation.GetTitledFirstName]'in şövalye ilan edildiği haberi ulaştı! [my_relation.GetSheHe|U], [ROOT.GetCharacter.GetHouse.GetName] Hanedanı'nı çok gururlandırdı."

 agot_knighthood.0320.desc_not_same_house:0 "Kulağıma, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_relation'))] [my_relation.GetTitledFirstName]'in şövalye ilan edildiği haberi ulaştı! [my_relation.GetSheHe|U] hepimizi çok gururlandırdı."

 agot_knighthood.0320.a:0 "[my_relation.GetHerHim]'e ne mutlu!"

 agot_knighthood.increase_progtoknighthood_toast.tt:0 "Şövalyelik ilerleyişin artar."

 agot_knighthood.decrease_progtoknighthood_toast.tt:0 "Şövalyelik ilerleyişin azalır."

 agot_knighthood.0021.a_toast:0 "Yaverlik Verildi"

 agot_knighthood.0021.a_toast.tt:0 "[potential_knight.GetNamePossessive] yaveri oldun."

 agot_knighthood.0021.b_toast:0 "[nearby_knight.GetName] Yanıtlıyor"

 agot_knighthood.0021.b_toast.tt:0 "[nearby_knight.GetName], isteğini reddetti."

 agot_knighthood_squire_offer_accept_toast:0 "Yaverlik Teklifi Kabul Edildi"

 agot_knighthood_squire_offer_accept_toast.tt:0 "Bir Yaver Kazandın!"

 agot_knighthood_squire_offer_reject_toast:0 "Yaverlik Teklifi Reddedildi"

 agot_knighthood_squire_offer_reject_toast.tt:0 "Yaverlik teklifin #N reddedildi!#!"

 agot_knighthood_offer_rejected_toast:0 "Şövalyelik Teklifi Reddedildi"

 agot_knighthood_offer_rejected_toast.tt:0 "Şövalyelik teklifin #N reddedildi!#!"

 agot_knighthood_made_a_knight_generic_toast:0 "Birini Şövalye İlan Ettin!"

 agot_knighthood_made_a_knight_generic_toast.tt:0 "Birini Şövalye İlan Ettin"

 agot_knighthood.0601.t:0 "Savaş Alanı Şövalyeliği"

 agot_knighthood.0601.desc:0 "[battle_province.GetName]'deki savaşın ardından, hizmetkârlarımdan biri bana, son derece iyi performans gösteren askerlerin listesini sunuyor. Özellikle [soldier_to_be_knighted.GetNamePossessive] adı gözüme çarpıyor.\n\nHizmetkârım, onları aceleyle düzenlenecek bir savaş alanı töreniyle şövalye ilan etmemi öneriyor; ona göre, bu askerleri savaşın kıyımının ve yıkımının ortasında dururlarken şövalye ilan etmek, saflarımızda morali ateşleyecek."

 agot_knighthood.0601.a:0 "Evet, [soldier_to_be_knighted.GetFirstName]'i şövalye ilan edeceğim."

 agot_knighthood.0601.a.tt:0 "[soldier_to_be_knighted.GetName]'i şövalye ilan edeceksin."

 agot_knighthood.0601.b:0 "Hayır, onları şövalye ilan etmeyeceğim."

 agot_knighthood.0602.t:0 "Savaş Alanı Şövalyeliği"

 agot_knighthood.0602.desc:0 "[battle_province.GetName]'deki savaşın ardından, ben de dâhil bir avuç adam, kumandan [side_commander.GetName] tarafından çağrıldık.\n\n[side_commander.GetSheHe], savaş alanındaki yiğitliğimizden etkilendiğini ve bu işlerimizden dolayı şövalye ilan edileceğimizi bildirdi!"

 agot_knighthood.0602.a:0 "Artık bir şövalyeyim!"

 agot_knighthood.0602.a.tt:0 "Şövalye ilan edildin!"

 agot_knighthood.0800.t:0 "Çocuklardan Şövalye Yapmak"

 agot_knighthood.0800.desc:0 "Çocuğum [squire.GetName] artık yaverlik yaşında. Belki Kral Muhafızı üyelerinden birine [squire.GetHerHim]'i yaver olarak almasını emredebilirim? [knight.GetName]'in iyi bir aday olacağına inanıyorum."

 agot_knighthood.0800.a:0 "Evet!"

 agot_knighthood.0800.b:0 "Hayır!"

 agot_knighthood.0801.t:0 "Çocuklardan Şövalye Yapmak"

 agot_knighthood.0801.desc:0 "Çocuğum [squire.GetName] artık yaverlik yaşında. Belki diyarımdaki bir vasala [squire.GetHerHim]'i yaver olarak almasını emredebilirim? [knight.GetName]'in iyi bir aday olacağına inanıyorum."

 agot_knighthood.0801.a:0 "Evet!"

 agot_knighthood.0801.b:0 "Hayır!"

 agot_knighthood.0802.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)],"

 agot_knighthood.0802.desc:0 "İşbu emrimle [squire.GetName]'i yaverin olarak al! Umarım [squire.GetName]'e şövalye olmanın ne demek olduğunu öğretirsin!"

 agot_knighthood.0802.a:0 "Emir aldım."

 agot_knighthood.0820.t:0 "Şövalyenin Yaveri Olur"

 agot_knighthood.0820.desc:0 "Araziyi keşfederken küçük bir çocuk yanıma yaklaşıyor.\n\n"Efen[ROOT.Char.GetLadyLord]'im," diye başlıyor [wannabe_squire.GetSheHe], "[tournament_province.GetName]'deki turnuvaya katılıyorsunuz, değil mi?"\n\n"Katılıyorum, ama sana ne, [wannabe_squire.Custom('GirlBoy')]?" diye yanıtlıyorum; çocukla ilgilenmek için arazideki keşfime ara veriyorum.\n\n"Beni de götürün, efen[ROOT.Char.GetLadyLord]'im," diyor [wannabe_squire.GetSheHe]. "Bir şövalyenin yaveri olur, ben de turnuvada size hizmet edebilirim... Atları tımar edip eyerlemeyi, yemek yapmayı bilirim; ve mızrak dövüşü zamanı geldiğinde sizi silahlayıp zırhlandırabilirim, ser.""

 agot_knighthood.0820.a:0 "Turnuva için bir yavere ihtiyacım var; ama beni dinlesen iyi olur."

 agot_knighthood.0820.b:0 "Defol, sana ihtiyacım yok."

 contest_winner_ceremony_knighthood_tt:0 "[host.GetShortUIName|U] Tarafından Şövalye İlan Edildi"
