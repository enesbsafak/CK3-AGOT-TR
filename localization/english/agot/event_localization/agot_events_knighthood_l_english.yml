### TODO NOT-IN-ST: agot_knighthood.0820.desc [AGOT: As I am exploring the grounds, a small child approaches me.\n\n]
 agot_knighthood.0820.desc:0 "As I am exploring the grounds, a small child approaches me.\n\n"M'[ROOT.Char.GetLadyLord]," [wannabe_squire.GetSheHe] begins, "you're part of the tourney at [tournament_province.GetName], aren't you?"\n\n"I am, but what does it matter to you, [wannabe_squire.Custom('GirlBoy')]?" I reply, pausing my exploration of the grounds to deal with the child.\n\n"Take me with you, m'[ROOT.Char.GetLadyLord]," [wannabe_squire.GetSheHe] says. "A knight needs a squire, and I could serve you at the tourney... I know how to groom and saddle horses, cook, and I can arm and armor you when it's time for your joust, ser.""
