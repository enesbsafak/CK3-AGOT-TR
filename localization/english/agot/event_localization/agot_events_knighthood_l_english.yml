### TODO NOT-IN-ST: agot_knighthood.0016.desc [AGOT: A hedge knight has been sleeping in my halls for the past few nights. It seems my son, [potential_child_squire.GetName], has taken a liking to him. Likewise, the hedge knight has become fond of my son as well. My son became enamored with the hedge knight after hearing him recount his thrilling tales of knighthood and chivalry.\n\nOn [hedge_knight.GetHerHis] last day in my court, the hedge knight offers to stay in my court and let my son be his squire.\n\nThe man seems honorable enough, and it would make my son very, very happy. I have to think about this.]
 agot_knighthood.0016.desc:0 "A hedge knight has been sleeping in my halls for the past few nights. It seems my son, [potential_child_squire.GetName], has taken a liking to him. Likewise, the hedge knight has become fond of my son as well. My son became enamored with the hedge knight after hearing him recount his thrilling tales of knighthood and chivalry.\n\nOn [hedge_knight.GetHerHis] last day in my court, the hedge knight offers to stay in my court and let my son be his squire.\n\nThe man seems honorable enough, and it would make my son very, very happy. I have to think about this."
