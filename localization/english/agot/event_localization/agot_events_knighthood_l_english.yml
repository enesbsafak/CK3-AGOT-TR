### TODO NOT-IN-ST: agot_knighthood.0700.t [AGOT: The Hedge Knight and the Spare]
 agot_knighthood.0700.t:0 "The Hedge Knight and the Spare"
### TODO NOT-IN-ST: agot_knighthood.0700.desc [AGOT: A hedge knight by the name of [hedge_knight.GetName], has recently visited my court. A [hedge_knight.GetCulture.GetName] by birth, he has traveled across the realm to seek the service of a lord. I know little of this man, save for the fact that he allegedly comes from minor Westerlands noble stock, and is, of course, a knight.\n\nI have not paid any attention to him, and as such, I expected him to be moving on soon. However, he came to me, in confidence, and offered to knight my son, [potential_child_knight.GetName], in exchange for being allowed to stay for as long as he pleases!]
 agot_knighthood.0700.desc:0 "A hedge knight by the name of [hedge_knight.GetName], has recently visited my court. A [hedge_knight.GetCulture.GetName] by birth, he has traveled across the realm to seek the service of a lord. I know little of this man, save for the fact that he allegedly comes from minor Westerlands noble stock, and is, of course, a knight.\n\nI have not paid any attention to him, and as such, I expected him to be moving on soon. However, he came to me, in confidence, and offered to knight my son, [potential_child_knight.GetName], in exchange for being allowed to stay for as long as he pleases!"
### TODO NOT-IN-ST: agot_knighthood.0700.a [AGOT: I suppose such an arrangement can be made.]
 agot_knighthood.0700.a:0 "I suppose such an arrangement can be made."

 agot_knighthood.0700.b:0 "Hayır, buna razı olmayacağım."
