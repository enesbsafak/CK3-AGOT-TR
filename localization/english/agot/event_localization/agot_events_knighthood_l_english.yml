### TODO NOT-IN-ST: agot_knighthood.0701.desc [AGOT: A hedge knight by the name of [hedge_knight.GetName], has recently visited my court. A [hedge_knight.GetCulture.GetName] by birth, he is traveling across the realm for reasons unknown.\n\nWhile I have not paid an attention to him, it seems he has paid attention to me. A crudely written note offering me knighthood, signed by none other than [hedge_knight.GetFirstNamePossessive], was delivered to one of my servants early this morning. For the right price, the note claims, I can be made a knight.]
 agot_knighthood.0701.desc:0 "A hedge knight by the name of [hedge_knight.GetName], has recently visited my court. A [hedge_knight.GetCulture.GetName] by birth, he is traveling across the realm for reasons unknown.\n\nWhile I have not paid an attention to him, it seems he has paid attention to me. A crudely written note offering me knighthood, signed by none other than [hedge_knight.GetFirstNamePossessive], was delivered to one of my servants early this morning. For the right price, the note claims, I can be made a knight."
