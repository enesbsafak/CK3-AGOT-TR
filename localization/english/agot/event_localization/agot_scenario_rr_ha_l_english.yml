l_english:

 agot_scenario_rr_ha.0010.t:0 "Bir Savaş Konseyi"

 agot_scenario_rr_ha.0010.desc:0 "Sayın [ROOT.Char.GetTitledFirstName],\nBu mesajın sizi iyi bir durumda bulmasını umarım. [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName] önderliğindeki isyana karşı plan yapmak üzere [GetTitleByKey('c_harrenhal').GetNameNoTier]'de bir savaş konseyi topluyorum. Katılımınız ve bu çatışmayı en iyi nasıl sona erdireceğimize dair tartışmalarımıza katkınız paha biçilemez olacaktır. Birlikte bu meydan okumaya karşı koyup Yedi Krallık'ı korumak için gerekeni yapalım. Sizi Harrenhal'de görmeyi dört gözle bekliyorum. \nHizmetinizde,"

 agot_scenario_rr_ha.0010.a:0 "Elbette katılacağım!"

 agot_scenario_rr_ha.0010.b:0 "Toplantılardan nefret ederim..."

 agot_scenario_rr_ha.0011.t:0 "Harrenhal'ın Ardından"

 agot_scenario_rr_ha.0011.desc:0 "Kuzgunlar salındı ve şimdi babamın vasallarıyla dolu bir odanın önünde, içinde bulunduğum vahim durumu düşünüyorum. Bir kralı tahttan indirmek — yalnızca bir kralı değil, babamı... Bu akıl almaz görünüyor.\n\nYine de, önümde davama katılacak kadar sadık olabilecek kişiler var. Ya şimdi ya hiç: #bold [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName]'i Demir Taht'tan uzaklaştırmayı önereyim mi?#!"

 agot_scenario_rr_ha.0011.a:0 "Kral II. Aerys'in hükümdarlığı sona ermeli..."

 agot_scenario_rr_ha.0011.a.tt:0 "Önünüzde oturanlara planlarınızı anlatmaya başlıyorsunuz; bu vasallardan hangisinin safınıza katılacağını — ya da sizi Deli Kral'ın kendisine ihbar edeceğini — bilmiyorsunuz..."

 agot_scenario_rr_ha.0011.b:0 "Gündemdeki savaşa odaklanmalıyız!"

 agot_scenario_rr_ha.0011.b.tt:0 "Entrikayı tamamen bırakıyorsunuz; bunun yerine, Gasıp'ı yenmek umuduyla gerçek bir savaş konseyine öncülük ediyorsunuz."

 agot_scenario_rr_ha.0012.t:0 "Harrenhal'ın Ardından"

 agot_scenario_rr_ha.0012.desc:0 "Veliaht prens, Gasıp Savaşı'nı görüşmek üzere babasının en seçkin vasallarını bir araya getirdi. Masanın etrafındakileri keskin bir bakışla süzüyorum, kimlerin arasına katıldığımı tartıyorum.\n\nUzun bir aradan sonra [GetScriptedCharacterByHistoryID('Targaryen_3').GetFirstName] konuşmasına başlıyor. "Değerli danışmanlarım, sizi buraya yanlış bir bahane ile çağırdım; affedilmesini umduğum bir aldatmaca bu," diye başlıyor. Koltuğumda huzursuzca kıpırdanıyorum.\n\n"Toplanmamızın asıl nedeni şu: Babam, [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName] Hanedanı'ndan [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName], delirdi — ateşe kafayı takmış, paranoyayla besleniyor. Bir zamanlar büyük olan hanedanımızı uçurumun kenarına, yok oluşun tam eşiğine getirdi." #italic Sessiz havayı bir bıçak gibi kesen bir nefes sesi duyuluyor.#!\n\nRhaegar en yüksek dereceden bir vatana ihanet öneriyor... #bold Deli Kral'ı tahttan indirmek!#!"

 agot_scenario_rr_ha.0012.a:0 "Ejderha prens haklı; onun entrikasına katılacağım."

 agot_scenario_rr_ha.0012.b:0 "Kralları yargılamak bana düşmez."

 agot_scenario_rr_ha.0012.c:0 "Kral Aerys'i derhal bilgilendirmeliyim!"

 agot_scenario_rr_ha.0013.t:0 "Savaş Konseyi"

 agot_scenario_rr_ha.0013.desc:0 "Veliaht prens, Gasıp Savaşı'nı görüşmek üzere babasının en seçkin vasallarını bir araya getirdi. Masanın etrafındakileri keskin bir bakışla süzüyorum, kimlerin arasına katıldığımı tartıyorum.\n\nKısa bir aradan sonra [GetScriptedCharacterByHistoryID('Targaryen_3').GetFirstName] isyanın askerî taktiklerini büyük bir ayrıntıyla anlatmaya başlıyor. İtiraf etmeliyim ki aramızdaki en deneyimli savaşçılar bile onun bilgisini etkileyici buldu."

 agot_scenario_rr_ha.0013.a:0 "Bu kesinlikle savaş çabalarına yardımcı olacak!"

 agot_scenario_rr_ha.0014.t:0 "Haydut Bir Konsey"

 agot_scenario_rr_ha.0014.desc:0 "Oğlum, veliaht prens, cüretkâr ve zaman zaman budalaca cesur — ama arkamdan bir savaş konseyi toplayacağını hiç beklemezdim!\n\nBu sabah daha sadık vasallarımdan birinden bir kuzgun geldi; [GetScriptedCharacterByHistoryID('Targaryen_3').GetFirstName]'in #bold benim#! diyarımın büyük bir bölümünü, #bold benim#! savaşımı yönetmesi için kendisine akıl versinler diye çağırdığını anlatıyordu.\n\nBir gasıpla uğraşmak zorundayım; inşallah #N bir başkasıyla#! daha uğraşmak zorunda kalmam..."

 agot_scenario_rr_ha.0014.a:0 "Şimdi Rhaegar'la kendim uğraşmak zorundayım..."

 agot_scenario_rr_ha.0015.t:0 "Savaş Konseyi"

 agot_scenario_rr_ha.0015.desc:0 "Çevremde, babamın en seçkin vasalları oturuyor; şimdi Gasıp Savaşı'nı görüşmek üzere bana geldiler. Masanın etrafındakileri keskin bir bakışla süzüyor, davet ettiklerimi dikkatle tartıyorum.\n\nKısa bir aradan sonra isyanın askerî taktiklerini büyük bir ayrıntıyla anlatmaya başlıyorum. Başımı kaldırdığımda en deneyimli savaşçılarımdan bazılarının onaylarcasına başlarını salladığını fark ediyorum."

 agot_scenario_rr_ha.0015.a:0 "Umarım bu, savaş çabalarına yardımcı olur..."

 agot_scenario_rr_ha.0020.t:0 "Harrenhal'ın Ardından"

 agot_scenario_rr_ha.0020.desc:0 "Zaman geldi, entrika tartışıldı ve şimdi danışmanlarımın önünde yanıtlarını bekliyorum.\n\nGözlerim odada ileri geri dolaşıyor. Önümde pek çok sadık vasal oturuyor. "Babam Deli Kral'ın hükümdarlığına son vermek için bana kim katılacak?"\n\nSorularım, odadaki tüm havayı emen bir akrep oku gibi çarpıyor. Ama çok geçmeden çevremdekiler konuşmaya başlıyor. Kısa süre sonra bir destek korosu yükseliyor — yine de aramızdan bazıları sessiz kalıyor..."

 agot_scenario_rr_ha.0020.a:0 "Ve böylece #N akli dengesi bozuk ejderhayla#! dansım başlıyor."

 agot_scenario_rr_ha.0020.join_rhaegar:0 "Hangi danışmanlar entrikanıza katılacak?"

 agot_scenario_rr_ha.0020.join_rhaegar_ally:0 "[custom_tooltip_trick.GetName] entrikanızı destekliyor."

 agot_scenario_rr_ha.0021.t:0 "İkinci Bir Gasıp mı!?"

 agot_scenario_rr_ha.0021.desc:0 "Örümcek bir kulağıma fısıldarken, ateşbüyücüleri diğerine mırıldanırken endişelenecek o kadar çok şey var ki. Ama bugün, kuzgunla bir endişe daha geliyor.\n\nSadık bir vasalım, #italic kendi oğlum [GetScriptedCharacterByHistoryID('Targaryen_3').GetFirstName]'den#! gelen bir entrikadan beni haberdar etti...\n\nVeliaht prens beni kaçırmayı, tahttan indirmeyi planlıyor... İhanetin bedelini öğrenecek, tüm suç ortakları da öğrenecek!"

 agot_scenario_rr_ha.0021.a:0 "HAİNLER! #N HEPSİ YANACAK!#!"

 agot_scenario_rr_ha.0030.t:0 "Harrenhal'ın Ardından"

 agot_scenario_rr_ha.0030.desc:0 "Bugün, tüm diyar rahat bir nefes alabilir: Deli Kral, II. [GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName], zindanımda oturuyor.\n\nBabam, gençlik günlerinden bu yana ne kadar da düşmüş... Hükümdarlığının Yedi Krallık için taşıdığı büyük umut, delilik yüzünden rotasından saptı. Ve şimdi, tüm Westeros için en iyisini yapmalıyım...\n\nKehanet, vaat edilen prensten söz eder ve bugün o prens #bold bir kral#! olur."

 agot_scenario_rr_ha.0030.a:0 "Babamın hükümdarlığı nihayet sona erdi."

 agot_scenario_rr_ha.0031.t:0 "Harrenhal'ın Ardından"

 agot_scenario_rr_ha.0031.desc:0 "Bugün, tüm diyar yas tutuyor: Deli Kral, II. [GetScriptedCharacterByHistoryID('Targaryen_1').GetFirstName], onu yakalayıp hükümdarlığına hızla son verme planımdan sıyrıldı.\n\nDanışmanlarımdan birinin kuzgunu ona mı ulaştı? Yoksa Örümcek'in küçük kuşları bunu kendileri mi halletti? Gerçeğini belki de asla bilemeyeceğim.\n\nTek bildiğim, Yedi Krallık'ın babamın zulmü altında devam edemeyeceği. Ama artık Deli Kral'ı tahttan indirmek çok daha zor hâle geldi."

 agot_scenario_rr_ha.0031.a:0 "Öyleyse savaş..."
