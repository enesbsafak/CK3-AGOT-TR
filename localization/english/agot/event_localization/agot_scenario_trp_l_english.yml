l_english:

 agot_scenario_trp.0001.t:0 "Serseri Prens'in Savaşı"

 agot_scenario_trp.0001.desc:0 "[current_dragon.GetName]'in sırtından iniyor, önümdeki savaş kampını süzmek için miğferimi çıkarıyorum. Targaryen ve Velaryon sancakları rüzgârda dalgalanıyor; askerler şimdiden bir sonraki taarruzumuz için hazırlanıyor. [ROOT.Char.GetCurrentLocation.GetName] adası kolayca düştü, ama Adımtaşlar'ın geri kalanı bu kadar basit olmayacak.\n\nDragonstone Prensi doğum hakkım reddedilmiş olsa da, kardeşimin beni karanlığa mahkûm etmesine izin vermeyeceğim. Adımtaşlar'ı fethedeceğim ve bu ikinci oğlun, Evi [ROOT.Char.GetHouse.GetName]'in gerçek varisi olduğunu kanıtlayacağım!"

 agot_scenario_trp.0001.a:0 "Hiçbir #emp Yengeç Besleyici#! beni durduramaz!"

 agot_scenario_trp.0002.t:0 "Güvenceye Alınmış Bir Çıkarma"

 agot_scenario_trp.0002.desc_crabfeeder:0 "Zafer! Bu taht iddiası amirallerin ilki yenildi ve Adımtaşlar'ın kalbi bizim! Görünüşe göre Triarchy, eylemlerimizden haberdar olmuş ve [crabfeeder.GetFirstNameNicknamedPossessive] bizi durdurma çabalarına katılmış.\n\nDahası, amiralleri üzerindeki önceliğine onay verdikleri ve kuvvetlerinin onun sancağı altında birleşik toplandığı görülüyor.\n\nBirleşik olsun, bölünmüş olsun, yüzlerce gemi ya da binlerce, onların beni durdurmasına izin vermeyeceğim! Herkes #italic Ateş ve Kan'ın#! gerçek anlamını öğrenecek!"

 agot_scenario_trp.0002.desc_other:0 "Zafer! Bu taht iddiası amirallerin ilki yenildi ve Adımtaşlar'ın kalbi bizim! Görünüşe göre Triarchy, eylemlerimizden haberdar olmuş ve amirallerinin bizi durdurma çabalarına katılmış.\n\nDahası, [stepstones_commander.GetTitledFirstName]'e öncelik verdikleri ve kuvvetlerinin [stepstones_commander.GetHerHis] sancağı altında birleşik toplandığı görülüyor.\n\nBirleşik olsun, bölünmüş olsun, yüzlerce gemi ya da binlerce, onların beni durdurmasına izin vermeyeceğim! Herkes #italic Ateş ve Kan'ın#! gerçek anlamını öğrenecek!"

 agot_scenario_trp.0002.a:0 "Bu Adımtaşlar benim olacak!"

 agot_scenario_trp.0003.t:0 "Dar Deniz'in Kralı"

 agot_scenario_trp.0003.desc:0 "Adımtaşlar benim! Triarchy'nin filosu harabe halinde, orduları rüzgârla savrulmuş.\n\nAdımtaşlar ve Dar Deniz'in Kralı olarak taçlandırıldım ve dünya artık biliyor ki en az bir Targaryen, hanesinin kaderini hâlâ temsil ediyor!\n\nTriarchy bu adaların kenarına itilmiş olsa da, yenilgiyi kabul edip etmeyecekleri ya da kaybettikleri toprakları geri almaya çalışıp çalışmayacakları görülecek.\n\nBir sonraki hamlelerinin haberi yakında kesin gelir; ama bu arada nefes alacak küçük bir pencere var ve bu sırada ben muzafferim!"

 agot_scenario_trp.0003.a:0 "Kralının önünde eğil!"

 agot_scenario_trp.0003.a.tt:0 "Triarchy yakında yenilgiyi kabul edip etmeyeceğine ya da kaybettikleri toprakları geri almaya çalışıp çalışmayacağına karar verecek"

 agot_scenario_trp.0004.t:0 "Çölden Yılanlar"

 agot_scenario_trp.0004.desc:0 "Görünüşe göre Dorneliler, sınırlarının yanında ikinci bir Targaryen diyarına razı değiller. Bana, Adımtaşlar'a kendi ordularını gönderdikleri ve beni tahttan indirmeyi bir kez daha denemesi için Triarchy'ye yalvardıkları haberi ulaştı!\n\nSon savaşımızdan hâlâ toparlanıyor olsak da, bu yükselmiş tüccarlar yeni çöl faresi dostlarıyla birlikte yenilmesi zor olabilir. Belki de görkemimle yetinip Kızıl Kale'ye dönmeliyim; ya da belki de dünyaya, Targaryenlerin aldıklarını tuttuklarını göstermeliyim!"

 agot_scenario_trp.0004.a:0 "Dorneli olsun olmasın, düşmanlarımız yanacak!"

 agot_scenario_trp.0004.b:0 "Denizdeki bir taş yığını için bunca şey mi?"

 agot_scenario_trp.0005.t:0 "Denizin Rakipsiz Ejderha Lordu"

 agot_scenario_trp.0005.desc:0 "Triarchy, hükümdarlığımı kabul etmek zorunda kaldı ve kesin biçimde Essos'a geri çekildi. Adımtaşlar'ın benim olduğunu kanıtladım ve onları kolayca bırakmayacağım!\n\nDiyarım güçlü ve hükümdarlığım altında birleşikken, şimdi bir seçimle karşı karşıyayım. Doğuda, yaralarını yalayan uzun süredir düşmanım duruyor. Onlar zayıfken vurabilir ve bu imparatorluğu #italic benim#! hükümdarlığım altına alabilirim. Batıda,"

 agot_scenario_trp.0005.desc.west_brother:0 "kardeşim Demir Taht'ta oturuyor. Onu sevsem de, gerçek bir ejderha olmadığını biliyorum. Ona meydan okumaya cesaret edebilir miyim?"

 agot_scenario_trp.0005.desc.west_niece:0 "yeğenim Demir Taht'ta oturuyor. Ama bir kız, Targaryen mirasının gerçek varisi değil. Yine de onu hâlâ seviyorum."

 agot_scenario_trp.0005.desc.west_other:0 "bazı sahte varis Demir Taht'ta oturuyor; başarıları benimkilerin yanında sönük kalıyor."

 agot_scenario_trp.0005.desc.end:0 "Tahta sadakat yemini de edebilirim. Elbette Yedi Krallık'a yeni bir krallık eklemek bir ödülü hak eder?\n\nSon olarak, görkemimle yetinip diyarımı yönetmeye de devam edebilirim. Seçim benim."

 agot_scenario_trp.0005.a:0 "Triarchy'yi fethedeceğim!"

 agot_scenario_trp.0005.b:0 "Yeter artık numara. Demir Taht benim olmalı!"

 agot_scenario_trp.0005.c:0 "Adımtaşlar Yedi Krallık'a eklenecek!"

 agot_scenario_trp.0005.c.tt:0 "Diyara büyük hizmetin için sana ek lütuf bahşedilebilir"

 agot_scenario_trp.0005.d:0 "Fethetmeyi kanıtladım. Şimdi yönetmeyi kanıtlayacağım."

 agot_scenario_trp.0005.d.tt:0 "Bağımsız kalacak ve Adımtaşlar'ı yönetmeye devam edeceksin"

 agot_scenario_trp.0005.e:0 "Bu kaya diyarından bıktım. Kızıl Kale'ye döneceğim."

 agot_scenario_trp.0006.t:0 "Bir Denizyılanının Daveti"

 agot_scenario_trp.0006.desc:0 "Bir zamanların savaş müttefiki ve dostum [corlys.GetTitledFirstName], beni Driftmark'a davet etti! Daha önce bulunmuş olsam da ve Corlys'i en son görmemden o kadar da uzun süre geçmemişken, sözlerinde bir... fırsat iması var. Corlys her zaman görkemli jestlerin adamıydı ve aklında ne olduğunu merak etmeden edemiyorum.\n\nBu daveti kabul etmeli miyim, yoksa burada mı kalmalıyım?"

 agot_scenario_trp.0006.a:0 "Denizyılanı'nın aklındakini görelim."

 agot_scenario_trp.0006.a.f:0 "Yarın yola çıkmak üzere bir gemi emrediyorsun."

 agot_scenario_trp.0006.a.tt:0 "Driftmark'a yolculuk ediyorsun"

 agot_scenario_trp.0006.b:0 "Denizyılanı'nın oyunlarına vaktim yok."

 agot_scenario_trp.0006.b.tt:0 "Corlys'in davetini reddediyorsun"

 agot_scenario_trp.0007.t:0 "Denizyılanı'nın Kızı"

 agot_scenario_trp.0007.desc:0 "Corlys'in beni neden Driftmark'a davet ettiğini anlamam uzun sürmüyor. Karaya çıktıktan dakikalar içinde beni, kızı Leydi [laena.GetFirstName]'nin bizi beklediği bahçeye götürüyor. Gerçekten güzel bir kadına dönüşmüş ve cazibesinin üzerimdeki etkisini inkâr edemiyorum.\n\n"

 agot_scenario_trp.0007.desc_betrothed:0 "Ancak bu planların bir pürüzü var. Görünüşe göre bu güzelliğe sahip olacaksam, ejderhanın önce şövalyeyi öldürmesi gerekiyor. Corlys'in anlattığına göre, yıllar önce Laena, babasının unvanını miras aldıktan sonra babasının mirasını hızla israf eden ve şimdi Corlys'in sözünü tutmasını sağlamaya çalışarak Corlys'in sarayında yaşayan [laena_betrothed.GetFirstName] ile nişanlanmıştı."

 agot_scenario_trp.0007.desc_not:0 "Elbette, bir zamanlar ilk karısının yasını tutarken kardeşime sunulmuştu. Ama o reddetti ve şimdi o burada, benimle ve o kadar #italic yakın#! ki. Açıkça onun için kaçırılmış bir fırsattı; ama bu kadar uzun süre kenarda durmaya çalıştıktan sonra, mirasta olduğu gibi evlilikte de ondan ikinci olmayı kabul edebilir miyim?"

 agot_scenario_trp.0007.a:0 "Bu rakibi biçeceğim!"

 agot_scenario_trp.0007.a.tt:0 "Kazanırsan [laena.GetName] ile evleneceksin"

 agot_scenario_trp.0007.b:0 "Leydim, elinizi isteyebilir miyim?"

 agot_scenario_trp.0007.b.tt:0 "Laena'nın elini evlilik için isteyeceksin"

 agot_scenario_trp.0007.c:0 "Kardeşimin arkasından ikinci kemanı çalmayacağım!"

 agot_scenario_trp.0007.c.f:0 "İlk geminin eve dönmesini emrediyorsun."

 agot_scenario_trp.daemon_leaves_tt:0 "Adımtaşlar'ı kaderine bırakıp Kızıl Kale'ye döneceksin."

 agot_scenario_trp.0101.t:0 "Denizyılanı"

 agot_scenario_trp.0101.desc:0 "Amiral gemim Denizyılanı'nın güvertesinde duruyorum; Evi [ROOT.Char.GetHouse.GetName]'in görkemi için bir maceraya daha yelken açmaya hazır. Triarchy'nin Adımtaşlar'daki tarifeleri, kazandığım zenginlikleri boğuyor ve bazı yükselmiş tüccarların tek kalem darbesiyle emeklerimi yıkmasına izin vermeyeceğim.\n\nBu işte, [daemon.GetCurrentLocation.GetName]'e çoktan ayak basmış ve savaşın bir sonraki aşaması için hazırlanmaya başlamış [daemon.GetTitledFirstName] ile müttefik oldum. Ona katılacağım ve birlikte Triarchy'yi diz çöktüreceğiz!"

 agot_scenario_trp.0101.a:0 "Adımtaşlar'a!"

 agot_scenario_trp.0101.a.tt:0 "Bu savaşa karşı çıkarak, karın ve çocukların bu çatışmada ejderhalarına binmeyecek"

 agot_scenario_trp.0102.t:0 "Driftmark İçin Yenilgi"

 agot_scenario_trp.0102.desc:0 "Adımtaşlar'daki savaş iyi gitmedi. Triarchy'nin filosu çok güçlüydü ve"

 agot_scenario_trp.0102.desc.dead:0 "Daemon'un ölümüyle"

 agot_scenario_trp.0102.desc.alive:0 "Daemon'un Kızıl Kale'ye kaçışıyla"

 agot_scenario_trp.0102.desc.end:0 "zafer şansımız suya düştü.\n\nTriarchy, ticaretimize kesin olarak daha da ağır tarifeler dayatacak ve Evi Velaryon'un görkeminin yakın gelecekte sönebileceğinden korkuyorum."

 agot_scenario_trp.0102.a:0 "Hiç böyle bir yenilgi yaşamadım!"

 agot_scenario_trp.0103.t:0 "Denizyılanı'nın İntikamı"

 agot_scenario_trp.0103.desc:0 "Zafer! Triarchy'nin filosu alevler içinde ve onunla birlikte Adımtaşlar'daki hâkimiyetleri ile ticaretimizin ikisi de küle döndü.\n\nBirleşik ordularımızın önünde bir törenle [daemon.GetFirstName]'i Adımtaşlar ve Dar Deniz'in Kralı olarak taçlandırdım ve serbest geçiş ile liman güvenceleriyle Evi Velaryon bir kez daha Westeros'un en zengini!"

 agot_scenario_trp.0103.a:0 "Bu ittifak verimli oldu! Devam etmeli!"

 agot_scenario_trp.0103.a.daemon_t:0 "İttifak Sağlamlaştı"

 agot_scenario_trp.0103.a.daemon_tt:0 "Velaryon-Serseri Prens ittifakı devam edecek"

 agot_scenario_trp.0103.b:0 "Dünya, Denizyılanı ile uğraşılmaz olduğunu biliyor!"

 agot_scenario_trp.0103.b.daemon_t:0 "İttifak Sona Erdi"

 agot_scenario_trp.0103.b.daemon_tt:0 "Velaryon Filosu, amaçlarına ulaşmış olarak eve döndü"

 agot_scenario_trp.0104.t:0 "Açık Sularda Gemiler"

 agot_scenario_trp.0104.desc:0 "Sağlam bir çıkarma kuruldu ve Triarchy'nin filosu, Adımtaşlar ablukasını artık sürdürmeyi umamaz.\n\nİstersem Driftmark'a geri yelken açıp lüks hayatıma dönebilirim. Ama bu kadar yolu geldim ve devam edersem görkem ile altının beni beklediğine eminim!"

 agot_scenario_trp.0104.a:0 "Bu fırsatın kaçmasına izin vermeyeceğim!"

 agot_scenario_trp.0104.b:0 "Gemilerim serbestçe seyredebiliyor, böylece amaçlarıma ulaşıldı."

 agot_scenario_trp.0104.b.f:0 "Daemon'u savaşlarıyla baş başa bırakacaksın."

 agot_scenario_trp.0105.t:0 "Ufukta Yükselen Bir Yemin"

 agot_scenario_trp.0105.desc:0 ""O zamanlar mantıklı gelen bir anlaşmaydı..."\n\nSevgili kızım [laena.GetFirstName], yıllardır [laena_betrothed.GetName] ile nişanlı, ama eşleşmenin uygunluğu ciddi biçimde düşüşte. Eski Deniz Lordu ile anlaşmaya vardıktan kısa süre sonra [laena_betrothed.GetFirstNameNoTooltip] babasının makamını miras aldı ve babasının mirasını derhal israf etti.\n\nKızımla nişanı son kalan varlığı olduğundan, o zamandan beri sarayımda yaşıyor; sözümü tutmamı sağlamaya çalışarak.\n\nİsteklerini yıllardır, [laena.GetFirstNamePossessiveNoTooltip] gençliğini gerekçe göstererek savuşturabildim; ama artık yetişkin bir kadın olduğuna göre, bu oyunu çok daha uzun sürdüremeyeceğim."

 agot_scenario_trp.0105.a:0 "Yemin yemindir. Bozmayacağım."

 agot_scenario_trp.0105.a.f:0 "Ağır bir yürekle evliliğe rıza gösteriyorsun. Belki zamanla kendini layık bir eş olarak kanıtlar... ama şüphelisin."

 agot_scenario_trp.0105.b:0 "Hayır, zaman hâlâ doğru değil, özür dilerim."

 agot_scenario_trp.0105.b.f:0 "Evliliği ertelemek için daha fazla bahane buluyorsun."

 agot_scenario_trp.0105.b.tt:0 "Laena evli kalmazsa, gelecekte daha avantajlı fırsatlar olabilir"

 agot_scenario_trp.0106.t:0 "Yenilenen Bir Hırs"

 agot_scenario_trp.0106.desc:0 "Kulağıma ilginç bir haber geldi. Görünüşe göre [king.GetTitledFirstName]"

 agot_scenario_trp.0106.desc_visy:0 " bir kez daha karısız. Bir zamanlar kızımı onunla evlendirmeye çalışmıştım, ama o zamanlar çok genç ilan edildi ve o bunun yerine o Hightower fahişesiyle evlendi. Pekala, aptal o; zira bir kez daha karısız ve kızım artık yetişkin bir kadın.\n\nÖnceki reddinin hakareti hâlâ acıtsa da, Demir Taht'a evliliğin prestijinin hâlâ mevcut olduğunu ve haneme bir nimet olacağını inkâr edemem. Belki kızımın elini bir kez daha sunmalıyım?"

 agot_scenario_trp.0106.desc_daemon:0 " Kızıl Kale'de kendisine katılacak yeni bir eş arıyor.\n\nAdımtaşlar'daki günlerimizi ve birlikte kazandığımız görkemi sevgiyle anıyorum. Bir zamanlar ağabeyiyle evliliği reddetmiş olsam da, belki eski dostum artık kral olduğuna göre kızımla bir eşleşmeye daha açıktır? İyi bir genç kadına dönüştü ve kimse böyle bir eşleşmenin uygunluğunu inkâr edemez."

 agot_scenario_trp.0106.desc_other:0 " Kızıl Kale'de kendisine katılacak yeni bir eş arıyor.\n\nDaha önce böyle bir eşleşme aramış olsam da, zaman doğru değildi. [laena.GetFirstName] çok gençti, şimdi bile kabul edebilirim. Yine de, gururumun yarası acıyor ve [king.GetFirstNameNoTooltip]'in kabul edeceğinden emin olamam. Yine de, böyle bir eşleşmenin faydaları açık."

 agot_scenario_trp.0106.desc_betrothed:0 "\n\nElbette bir de [laena_betrothed.GetFirstName] meselesi var; ama Demir Taht'a bir evlilik söz konusuyken o kolayca bir kenara itilebilir."

 agot_scenario_trp.0106.a:0 "Kızımın elini sunacağım!"

 agot_scenario_trp.0106.a.f:0 "Kızının elini evlilik için sunmak üzere Kızıl Kale'ye yolculuk ediyorsun."

 agot_scenario_trp.0106.a.tt:0 "[king.GetTitledFirstName] kabul ederse, [laena.GetFirstName] ile evlenecek"

 agot_scenario_trp.0106.b:0 "Bu yoldan daha önce geçtim. Bir daha sunmayacağım."

 agot_scenario_trp.0106.b.tt:0 "Kızının elini evlilik için sunmayacaksın"

 agot_scenario_trp.0107.t:0 "Silah Arkadaşı, Damat Adayı?"

 agot_scenario_trp.0107.desc:0 "Bugün kulağıma, eski silah arkadaşım [daemon.GetTitledFirstName]'in yakın zamanda kendini karısız bulduğu haberi geldi. Bir zamanlar [laena.GetFirstName]'yi kardeşiyle evlendirmeye çalışmıştım; belki o daha iyi bir talip olur? Onu yıllardır tanıyorum ve büyük hırslı bir adam olsa da, yetenekli bir savaşçı, bir ejderha binicisi, bir Targaryen ve diyarın bir Prensi.\n\nElbette, böyle bir eşleşmenin... yönetilmesi gerekirdi; işin içindeki ruhların gücü göz önüne alındığında. Ama faydaları açık. Belki Daemon'u Driftmark'a davet edip birbirlerine olan ilgilerini ölçmeliyim?"

 agot_scenario_trp.0107.a:0 "Bu olasılıkları keşfetmenin zararı olmaz."

 agot_scenario_trp.0107.a.f:0 "Daemon'a, dostça bir ziyaret bahanesiyle Driftmark'a davet eden bir mektup yazıyorsun."

 agot_scenario_trp.0107.a.landed_tt:0 "[daemon.GetFirstName] davetini değerlendirecek."

 agot_scenario_trp.0107.a.unlanded_tt:0 "[daemon.GetFirstName] kısa süre içinde gelecek."

 agot_scenario_trp.0107.b:0 "Daemon'u tanırım. Böyle bir eşleşme Laena'nın çıkarına değil."

 agot_scenario_trp.0108.t:0 "Kötü Geciktirilmiş Nişan"

 agot_scenario_trp.0108.desc:0 "Gerçekten de bu zavallı eşleşmenin önlenemediği görülüyor.\n\n[laena.GetFirstName], yirmi yılı aşkın süredir [laena_betrothed.GetFirstName] ile nişanlı ve artık yaşının, alabileceği #italic diğer#! eşleşme teklifleri için sorun olmaya başlayacağı noktaya geliyor. Görünüşe göre gerçekten uygun bir eşleşme bulma pencerem kapandı.\n\nBu durumdan en iyisini çıkarmak ve [laena_betrothed.GetFirstNameNoTooltip]'in kızıma layık bir eş olduğunu kanıtlayabilmesini ummak zorunda kalacağım."

 agot_scenario_trp.0108.a:0 "Pekala. Bunu sonuna kadar göreceğim."

 agot_scenario_trp.0108.a.f:0 "Laena ile [laena_betrothed.GetFirstNameNoTooltip] arasındaki nişanı korumaya karar veriyorsun."

 agot_scenario_trp.0108.b:0 "Hayır! Yapmayacağım! Bu komedi bitti!"

 agot_scenario_trp.0108.b.f:0 "Laena ile [laena_betrothed.GetFirstNameNoTooltip] arasındaki nişanı bozuyorsun."

 agot_scenario_trp.0109.t:0 "Bir Kız Evliliği İkilemi"

 agot_scenario_trp.0109.desc:0 "Daemon, ilgilenmesi gereken başka meseleleri gerekçe göstererek Driftmark'a yolculuk yapmayacağı haberini gönderdi.\n\nBu haber hayal kırıklığı yaratsa da, zaten anlaşacakları hiç de kesin değildi. Yine de, [laena.GetFirstNamePossessive] evliliği meselesi acil bir endişe olmaya devam ediyor."

 agot_scenario_trp.0109.a:0 "Başka fırsatlar için göz kulak olmam gerekecek."

 agot_scenario_trp.0109.a.tt:0 "Laena için bir eşleşme aramaya devam ediyorsun"

 agot_scenario_trp.0110.t:0 "Daemon Reddediyor!"

 agot_scenario_trp.0110.desc_betrothed:0 "Her şey çok iyi gidiyordu! [daemon.GetFirstName] Driftmark'a geldiğinde, [laena.GetFirstName] ile kesinlikle âşık gibiydiler. Bunun o gün çözüleceğini düşünmüştüm!\n\nAma hayır! Nişanı öğrendiğinde, tanıdığım adamdan beklediğim gibi geleneğe rağmen istediğini almak yerine, tamamen reddetti! "Valyria kadınlarının gönlü için adam dövüşmeyi bıraktım!" dedi; ne anlama geliyorsa.\n\nGörünüşe göre kızım için başka bir eşleşme bulmam gerekecek ve [laena_betrothed.GetFirstName] hâlâ beni sinirlendirmenin yollarını buluyor!"

 agot_scenario_trp.0110.desc_not:0 "Her şeyi planlamıştım! [daemon.GetFirstName] Driftmark'a gelecek, [laena.GetFirstName] ile âşık olacaklar ve hanem sonsuza dek Targaryenlere bağlanacaktı!\n\nAma hayır! Geldiğine ve ağırlanmaktan memnun olduğuna emin olsam da, Laena'ya karşı soğuk ve mesafeliydi. Aralarında bir eşleşme konusunu açtığımda, fikirden hakarete uğramıştı!\n\nSanki onu yalnızca kardeşi müsait olmadığı için sunduğumu ve onu başından atmaya çalıştığımı düşünüyordu! Ne cüret! Kızım için başka bir eşleşme bulmam gerekecek ve bu hakaretin beni takip etmemesini ummalıyım."

 agot_scenario_trp.0110.a:0 "Bunun işe yarayacağından o kadar emindim ki..."

 agot_scenario_trp.0110.a.tt:0 "Laena için bir eşleşme aramaya devam edeceksin"

 agot_scenario_trp.0111.t:0 "Ejderhanın Fethi"

 agot_scenario_trp.0111.desc:0 "Planım umduğumdan daha iyi işledi!\n\n[daemon.GetFirstName] Driftmark'a geldiğinde, [laena.GetFirstName] ile kesinlikle âşık gibiydiler. Nişanın sorun olacağını düşünmüştüm, ama serseri rakibini bir an bile düşünmeden biçti!\n\nGecikme için bir sebep görmedim ve o gün onları evlendirmek için septónu çağırdım. Diyarın en etkileyici adamlarından birine güzel bir törendi.\n\nBir baba daha ne isteyebilir ki?"

 agot_scenario_trp.0111.a:0 "Çok gururluyum!"

 agot_scenario_trp.0111.a.daemon_t:0 "Zaferde Neşe"

 agot_scenario_trp.0112.t:0 "Dış Bahis"

 agot_scenario_trp.0112.desc:0 "[daemon.GetFirstName] tüm beklenen tantanayla geldi, ama ziyaretinden ne çıkacağını asla tahmin edemezdim. [laena.GetFirstName] ile kesinlikle âşık gibiydiler ve nişanın o gün çözüleceğini düşünmüştüm! Nişanı öğrendiğinde, [laena_betrothed.GetFirstName]'i düelloya davet etti!\n\nHayret verici bir şekilde, bu ünlü kılıç ustası ve ejderha binicisi, yükselmiş bir tüccar tarafından yenildi! [laena_betrothed.GetFirstName], karnına bir kılıç darbesiyle onu öldürdü ve Laena ile hemen şimdi evlenmesini talep ediyor!"

 agot_scenario_trp.0112.a:0 "Buna inanamıyorum!"

 agot_scenario_trp.0113.t:0 "Denizyılanı Baştan Çıkarma Planı Başarılı"

 agot_scenario_trp.0113.desc:0 "Plan tam umduğum gibi işledi!\n\n[daemon.GetFirstName] Driftmark'a geldiğinde, [laena.GetFirstName] ile kesinlikle âşık gibiydiler. Teklifi yapması uzun sürmedi ve ben de hiçbir sorun olmadan kabul edebildim!\n\nTören güzeldi ve ikisi birlikte çok mutlu görünüyor. Kızımla gurur duyuyorum ve böyle bir eşleşme bulduğu için çok mutluyum!"

 agot_scenario_trp.0113.a:0 "Bir babanın isteyebileceği her şey!"

 agot_scenario_trp.0113.a.daemon_t:0 "Evlilik Kabul Edildi"

 agot_scenario_trp.0201.t:0 "Yengeçlerin Generali"

 agot_scenario_trp.0201.desc:0 "İyi bir general görevinden — ya da düşmanlarından — kaçınmaz. Myr surlarından İhtilaflı Topraklar'a dek onlarcasıyla yüzleştim. Son on yıldır Triarchy'nin Adımtaşlar'daki kuvvetlerinin komutanıyım; adadan adaya, acımasız mağara savaşı seferlerinde önemsiz korsan krallarıyla savaşıyorum. Şimdi yeni bir düşmanla karşı karşıyayım; yer altında koşuşan ya da denizlerde yelken açan değil, uçan biri!\n\n[daemon.GetTitledFirstName] [daemon.GetHouse.GetName], Serseri Prens, [daemon.GetCurrentLocation.GetName]'e ayak bastı ve boş bir görkem girişimiyle Adımtaşlar'ı fethetmek için bir sefer başlattı. Onun başarılı olmasına ve Triarchy'nin düşmesine izin vermeyeceğim!"

 agot_scenario_trp.0201.a:0 "Yengeçler ejderha eti tadacak!"

 agot_scenario_trp.0202.t:0 "Külden Bir Taç"

 agot_scenario_trp.0202.desc:0 "Felaket! Ejderhanın ordusu Adımtaşlar'da bir tutunma noktası kurdu ve amiral arkadaşlarımdan biri, [Naethys_113.GetFirstName], çoktan ejderha ateşine kurban gitti. Bunu tek başımıza yapamayız!\n\nNeyse ki, görünüşe göre gerek yok. Triarchy'nin savaşımıza katıldığı haberi bana ulaştı! Dahası, Adımtaşlar'daki kuvvetlerimiz üzerinde bana öncelik verdiler. Onları yüzüstü bırakmayacağım!"

 agot_scenario_trp.0202.a:0 "Kuvvetlerimizi zafere taşıyacağım!"

 agot_scenario_trp.0203.t:0 "Ejderha Ezildi!"

 agot_scenario_trp.0203.desc:0 "Zafer! Bu Westeroslu ejderhalar yenilmez olmaktan çok uzak. Serseri Prens"

 agot_scenario_trp.0203.desc_fled:0 "utandırılmış ve yenilmiş halde Kızıl Kale'ye kaçtı."

 agot_scenario_trp.0203.desc_dead:0 "denize atıldı; ejderha kanı artık kıyılarımızı yalıyor."

 agot_scenario_trp.0203.desc_end:0 "Adımtaşlar bir kez daha bizim!\n\nNe var ki çatışma, Dar Deniz'deki güç dengesini büyük ölçüde değiştirdi ve Triarchy bu çatışmada gücünün büyük kısmını harcadı. Belki de yeni bulunan birliğimiz gücünü batıdan doğuya kaydırabilir? Bağımsızlık için oynamanın tam zamanıysa, işte o an!"

 agot_scenario_trp.0203.a:0 "Eski müttefikimize ihanet etmeyeceğiz, kucağa dönüş budur."

 agot_scenario_trp.0203.b:0 "Bu adalar benim ve başka kimsenin değil!"

 agot_scenario_trp.1000.t:0 "Yabancılaşmış Bir Kardeş"

 agot_scenario_trp.1000.desc:0 "Yanımdaki dikenin ta kendisi; kardeşim [daemon.GetTitledFirstName]'in [daemon.GetCurrentLocation.GetName]'e ayak bastığı ve Adımtaşlar'ı fethetmek için bir sefer başlattığı haberi bana ulaştı. Triarchy'ye karşı hiçbir sevgim olmasa da ve kardeşim için az da olsa endişe duysam da, böyle bir savaş hırsı bilge bir hükümdara yakışmaz.\n\nSeferinin nasıl gideceğini ve diyarın geleceği için ne anlama geldiğini zaman gösterecek."

 agot_scenario_trp.1000.a:0 "İyi şanslar kardeşim, seni deli aptal."

 agot_scenario_trp.1001.t:0 "Amcam Benim"

 agot_scenario_trp.1001.desc:0 "Amcam [daemon.GetTitledFirstName]'in [daemon.GetCurrentLocation.GetName]'e ayak bastığı ve Adımtaşlar'ı fethetmek için bir sefer başlattığı haberi bana ulaştı. Keşke beni de yanına alsaydı!\n\nNe yazık ki, hâlâ babamın keyfi isteklerine boyun eğmek zorundayım. Ama belki gelecek, kanatlarımı açmama izin verir?"

 agot_scenario_trp.1001.a:0 "İyi şanslar, amca!"

 agot_scenario_trp.1002.t:0 "Deniz Kıyısında Çarpışma"

 agot_scenario_trp.1002.desc.daemon:0 "Aşağıdaki savaş şiddetleniyor; Triarchy, bir kez olsun mağaralarında saklanmak yerine kuvvetlerimizle çarpışıyor. Bir gemi hattını daha yakarken, aşağıdaki kıyıda tanıdık bir figür görüyorum. Yengeç Besleyici, [crabfeeder.GetFirstName], burada!\n\nOnu gökten kolayca yakabilirim, ama bana korkak denmesine izin vermeyeceğim. İneceğim ve onunla teke tek dövüşeceğim!\n\nCaraxes'i ani bir dalışa çekiyorum; [crabfeeder.GetHouse.GetNameNoTooltip] adamları patlamadan geriye dağılıyor. Ama Yengeç Besleyici geri adım atmıyor. #bold İyi.#!\n\nKuma iniyorum, Kara Kızkardeş'i çekiyorum ve sözsüzce onu meydan okurcasına kaldırıyorum."

 agot_scenario_trp.1002.desc.crabfeeder:0 "Gemilerim kıyıda yanıyor; mağaralara çekilemeden kuvvetlerimiz kıstırıldı. Bir adamın daha kafasını gövdesinden ayırırken, yukarıdaki gökten bir göktaşı gibi düşen tanıdık bir figür görüyorum. Serseri Prens, [daemon.GetFirstName], burada!\n\nEjderha ateşiyle yıkanmaya hazırlanıyorum, ama Prens önüme iniyor; Kara Kızkardeş'i çekip sözsüzce onu meydan okurcasına kaldırıyor.\n\nBunu yüz yüze bitirmek istiyor. #bold İyi.#!\n\nAdamlarıma geride durmalarını emrediyor, kılıcımı çekiyor ve onu karşılamak için öne adım atıyorum."

 agot_scenario_trp.1002.a:0 "Gel de öl o zaman!"

 agot_scenario_trp.1003.t:0 "İhtiyaç İçindeki Bir Kardeş"

 agot_scenario_trp.1003.desc:0 "Kardeşim [daemon.GetName]'den haber alalı iki yılı aşkın süre geçti ve Adımtaşlar'daki seferinin bıçak sırtında olduğunu duyuyorum.\n\nYardımımı asla istemeyeceğini bilsem de, kenarda durup başarısız olmasına gerçekten izin verebilir miyim? Ona yardım göndermeyi mi seçmeliyim, yoksa kaderiyle tek başına yüzleşmesine izin mi vermeliyim?"

 agot_scenario_trp.1003.a:0 "Westeros'un ağırlığı Triarchy'nin üzerine çökecek!"

 agot_scenario_trp.1003.b:0 "Adamlarımız olmasa da kasalarımızın desteğine sahip olacak."

 agot_scenario_trp.1003.c:0 "Kardeşim kendi başına başarılı olur ya da #N başarısız olur#!."

 agot_scenario_trp.1004.t:0 "Bir Başka Ejderha Diyarı"

 agot_scenario_trp.1004.desc:0 "[daemon.GetName]'in Adımtaşlar'ı fethettiğini ve kendini Dar Deniz'in Kralı olarak taçlandırdığını öğrendim. Triarchy'ye karşı hiçbir sevgim yok, ama kuzey komşularıma karşı daha da az sevgim var.\n\nKonsey üyelerim, doğu kıyılarımızdan gelen, Kralın Şehri'ndeki akrabalarıyla ittifak kurması muhtemel bu yeni tehdide göz yummamamızı öğütlüyor. Yakın zamanda yenilmiş olsak da, ittifak kurarsak Triarchy ve Dorneliler bu ikinci oğulu kesin tahtından indirebilir; ejderha olsun olmasın."

 agot_scenario_trp.1004.a:0 "Kalemimi getirin. Triarchy'ye yazacağım."

 agot_scenario_trp.1004.b:0 "Yabancı toprağı savunmak için Dorniş kanı dökülmeyecek."

 agot_scenario_trp.1005.t:0 "Deniz Ötesinden Bir Teklif"

 agot_scenario_trp.1005.desc:0 ""[ROOT.Char.GetLadyLord]! Deniz ötesinden haber!" Bir sayfa çocuğunun, bana küçük bir kağıt şeridi uzatırken haykırdığını duyuyorum. Dorne'dan bir mektup! Hızla okuyorum ve yüreğim havalanıyor.\n\nGörünüşe göre Dorneliler, [daemon.GetName]'in kendine Dar Deniz'in Kralı süsü vererek Adımtaşlar'da rahat etmesini istemiyor.\n\nMektup, Dorne'un bu ikinci oğulu tahtından indirmek için bizimle ittifak teklif ettiğini söylüyor! Son savaştan hâlâ toparlanıyor olsak da, ittifak kurarsak Triarchy ve Dorneliler bu serseri prensi kesin tahtından indirebilir; ejderha olsun olmasın."

 agot_scenario_trp.1005.a:0 "Dornelilere yazın. İttifak kuracağız!"

 agot_scenario_trp.1005.b:0 "O lanet adalar için yeterince kan döktük."

 agot_scenario_trp.1006.t:0 "Triarchy Kabul Ediyor!"

 agot_scenario_trp.1006.desc:0 "Triarchy'nin ittifak teklifimi kabul ettiği haberi bana ulaştı! Çoktan yeni gemileri yelkenlerini açıyor, orduları Adımtaşlar'a doğru yelken açıyor. Yardımımızla [daemon.GetName] kesinlikle tahttan indirilecek!"

 agot_scenario_trp.1006.a:0 "Bundan kesinlikle pişman olmayacağız!"

 agot_scenario_trp.1007.t:0 "Triarchy Reddediyor"

 agot_scenario_trp.1007.desc:0 "Triarchy'nin ittifak teklifimi reddettiği haberi bana ulaştı. Son savaştan hâlâ toparlandıklarını ve bu kadar yakında bir savaşa daha girme arzusu duymadıklarını iddia ediyorlar.\n\nBunun, önemli direnişin sonu anlamına gelebileceğinden ve [daemon.GetFirstNameNicknamed]'in Dar Deniz'in Kralı olarak kalacağından korkuyorum."

 agot_scenario_trp.1007.a:0 "Çekingenliklerinin bilgeliğini zaman gösterecek."

 agot_scenario_trp.1008.t:0 "Köpüklerde Kan"

 agot_scenario_trp.1008.desc.daemon:0 "Kara Kızkardeş'in tek bir vuruşuyla iğrenç Yengeç Besleyici'nin kafasını gövdesinden ayırıyorum; şok olmuş yüz, kan havada bir yay çizerken gelgitlere yuvarlanıyor.\n\nCaraxes'in onaylayan bir kükreme çıkardığını duyuyorum ve dönüp Triarchy kuvvetlerinin dağılarak gemilerine kaçtığını görüyorum. Generalleri ölüyken, Triarchy'nin Dar Deniz'deki konumu mahkûm."

 agot_scenario_trp.1008.desc.crabfeeder:0 "Kılıcımın son bir umutsuz savuruşuyla, yükselmiş prensi taşaklarından beynine kadar ikiye bölüyorum!\n\nIşık gözlerini terk etmeden önce şokla aşağı bakmaya zar zor vakti oluyor ve Valyria kılıcı ellerinden düşüyor. Ama tehdit bitmedi... Büyük canavarın ne yaptığını görmek için bakıyorum ve protesto edercesine kükreyip gökyüzüne bir alev dalgası salarak beni yere savuruyor. Büyük bir kanat çırpışıyla havalanıp kim bilir nereye uçuyor.\n\nDenize geri bakıyorum ve kuvvetlerimin Velaryon birliklerini yavaşça alt ettiğini görüyorum. Prensleri ölüyken, bize karşı maceraları kesinlikle mahkûm."

 agot_scenario_trp.1008.a:0 "Adımtaşlar benim!"

 agot_scenario_trp.1009.t_alive:0 "Serseri Prens Geri Dönüyor!"

 agot_scenario_trp.1009.t_dead:0 "Serseri Prens Geri Dönüyor..."

 agot_scenario_trp.1009.desc_alive:0 "[daemon.GetTitledFirstName]'in Kızıl Kale'ye döndüğü haberi bana ulaştı; Caraxes'in bu sabah Ejderha Çukuru'na uçtuğu görülmüş. Görünüşe göre Adımtaşlar'ı terk etmiş; oradaki durumu hoşuna gitmeyerek. Daha hayırlı bir şey beklemiş olsam da, onu güvende görmek beni memnun etti.\n\nDar Deniz'in Kralı olsun ya da olmasın, artık deneyimli bir savaş komutanı. Belki de diyara değerini kanıtlamanın başka bir yolunu bulur."

 agot_scenario_trp.1009.desc_dead:0 "[daemon.GetTitledFirstName], Kızıl Kale'ye döndü; ama umduğu şekilde değil. Görünüşe göre [daemon.GetDeathReason] Adımtaşlar'ı fethetme girişimi sırasında.\n\n"

 agot_scenario_trp.1009.desc_dead_related:0 "Bu kaybın yasını derinden tutarken,"

 agot_scenario_trp.1009.desc_dead_unrelated:0 "biraz rahatlamış hissediyorum; ne de olsa"

 agot_scenario_trp.1009.desc_dead_end:0 "Dar Deniz'in, Westeros gemileri için tehlikeli bir yer olmaya devam edeceği görülüyor."

 agot_scenario_trp.1009.a_alive:0 "Hoş geldin!"

 agot_scenario_trp.1009.a_dead:0 "Huzur içinde yat."

 agot_scenario_trp.1009.a_dead_unrelated:0 "Eh, endişelenecek bir rakip eksildi."

 agot_scenario_trp.1010.t:0 "Prens Bir Kral Olarak Dönüyor!"

 agot_scenario_trp.1010.desc:0 "[daemon.GetTitledFirstName]'in Kızıl Kale'ye döndüğü haberi bana ulaştı; Caraxes'in bu sabah Ejderha Çukuru'na uçtuğu görülmüş. Muzaffer dönüyor: Adımtaşlar ve Dar Deniz'in rakipsiz Kralı! Triarchy, adalar üzerindeki tüm iddialarından vazgeçti!\n\nEjderha sırtında döndüğünü duyduğumda küçük bir endişem olsa da, görünüşe göre övünmekten fazlası için gelmiş. Bana sadakat yemini etmeye gelmiş!\n\nOnu reddetmeyeceğim. Kendini layık bir hükümdar olarak kanıtladı ve onu diyara geri almaktan memnunum. Ancak, hizmeti için ona bir lütuf bahşetmem bekleniyor. Bu teklifi uzatayım mı?"

 agot_scenario_trp.1010.a:0 "Böyle sadık bir hizmetin karşılığında ne isterdin?"

 agot_scenario_trp.1010.a.tt:0 "Daemon, senden isteyeceği bir lütuf seçecek."

 agot_scenario_trp.1010.b:0 "Şey, eee, evet, teşekkür ederim."

 agot_scenario_trp.1010.b.tt:0 "Ona bir lütuf teklif etmeyeceksin."

 agot_scenario_trp.1010.b.toast.t:0 "Lütuf Reddedildi"

 agot_scenario_trp.1010.b.toast.desc:0 "Sana bir lütuf teklif edilmedi."

 agot_scenario_trp.1011.t:0 "Bir Krallığın Bedeli"

 agot_scenario_trp.1011.desc:0 "[sitting_ruler.GetTitledFirstName]'in önüne adım atıp diz çöküyorum; başım saygıyla eğik. Geniş bir hareketle tacı başımdan alıp [sitting_ruler.GetHerHis] ayaklarının dibine bırakıyorum.\n\nBeklendiği gibi [sitting_ruler.GetFirstNameNoTooltip] sadakatimi zarafetle kabul ediyor ve ayağa kalkmamı istiyor. Artık yalnızca Prens değil, Adımtaşlar'ın Yüce Lordu'yum.\n\nDahası, diyara hizmetim için bir lütuf bahşedildi. Soru şu: ne isteyeceğim?"

 agot_scenario_trp.1011.desc.rhaenyra_rejected:0 "Şok! Şimdiye dek tüm etkileşimlerimizde ilgili görünmesine rağmen, Rhaenyra'nın bende hiçbir ilgisi yok gibi görünüyor. [sitting_ruler.GetTitledFirstNamePossessive] onayına rağmen evlilik teklifimi reddetti.\n\nNazikçe [sitting_ruler.GetSheHe] bana onun yerine başka bir lütuf teklif etti."

 agot_scenario_trp.1011.desc.rejected_start:0 ""Fazla ileri gidiyorsun!" [sitting_ruler.GetTitledFirstNamePossessive] sesindeki red açık. "Fikrimi değiştirmeden önce başka birini seç!" diyor [sitting_ruler.GetSheHe]. Görünüşe göre isteğim"

 agot_scenario_trp.1011.desc.rejected_heir_boon:0 "varis olarak haklı yerim için, [sitting_ruler.GetFirstNameNoTooltip] için fazla ileri; getirdiğim bariz meşruiyete ve yeteneğe rağmen."

 agot_scenario_trp.1011.desc.rejected_rhaenyra_boon:0 "Rhaenyra'nın eli için, [sitting_ruler.GetFirstNameNoTooltip]'i öfkelendiriyor; böyle bir birliğin getireceği bariz siyasi ve kişisel faydalara rağmen."

 agot_scenario_trp.1011.desc.rejected_divorce_boon:0 "Bronz Cadaloz'dan boşanma için "ettiğim yeminlere aykırı" ya da başka bir dini saçmalık deniyor."

 agot_scenario_trp.1011.desc.rejected_hand_boon:0 "El olarak atanmam "siyasi olarak uygulanamaz" deniyor."

 agot_scenario_trp.1011.desc.rejected_gold_boon:0 "basit onurlar ve altın için şu an mali olarak uygulanabilir değil deniyor."

 agot_scenario_trp.1011.desc.rejected_end:0 "\n\n[sitting_ruler.GetSheHe] bana başka birini seçme şansı teklif etmiş olsa da, bir #emp Kral#! arzuları için yalvarmak zorunda mı kalmalı? Göğsümde kaynayan öfkeyi hissedebiliyorum.\n\nYine de, tüm bu yıllardan sonra, burada tanınmayacak mıyım?"

 agot_scenario_trp.1011.tt:0 "[sitting_ruler.GetTitledFirstName] isteğini reddedebilir"

 agot_scenario_trp.1011.a:0 "Doğum hakkım! Beni Dragonstone Prensi ve haklı varisin ilan et!"

 agot_scenario_trp.1011.b:0 "İstediğim... Rhaenyra."

 agot_scenario_trp.1011.b.ruler:0 "İstediğim... sen."

 agot_scenario_trp.1011.c:0 "İğrenç karımdan kurtulmak istiyorum."

 agot_scenario_trp.1011.d:0 "Kralın Eli olarak atanmak istiyorum!"

 agot_scenario_trp.1011.e:0 "Altın ve onuruma bir şenlik yeterli olur."

 agot_scenario_trp.1011.f:0 "Lanet olsun bu kaleye ve senin hükümdarlığına da!"

 agot_scenario_trp.1011.f.f:0 "Öfkeni kontrol edemiyorsun ve öfke taşıyor."

 agot_scenario_trp.1012.t:0 "Bir Krallığın Bedeli"

 agot_scenario_trp.1012.desc:0 "Daemon dizlerinden doğruluyor, bir an düşünmüş gibi görünüyor."

 agot_scenario_trp.1012.desc.rhaenyra_rejected:0 "Şaşkınlıkla, Rhaenyra'nın Daemon'da hiçbir ilgisi olmadığı ve evlilik teklifini reddettiği görülüyor. Gözlerindeki hayal kırıklığını görebiliyorum ve bu yüzden ona yerine başka bir lütuf teklif ediyorum."

 agot_scenario_trp.1012.desc.heir:0 "Yine de, ne isteyeceği hiçbir zaman soru olmadı. Her zaman istediği şey buydu.\n\n"Doğum hakkımı istiyorum." diyor, neredeyse bir fısıltıyla. "Dragonstone Prensi ve haklı varisin olmak istiyorum." sesini, sarayın duyabileceği kadar yükseltiyor.\n\nNe cüretkâr bir istek! Bahşetmeye cesaret edebilir miyim?"

 agot_scenario_trp.1012.desc.rhaenyra:0 "Sıradakini asla beklemezdim.\n\n"I want Rhaenyra." he says, a sparkle in his eye as he looks past me to her. "I want to wed her in the tradition of our house. Bring the dragon together as one." He raises his voice, enough for the court to hear.\n\nAghast faces line the court, but Rhaenyra is not one of them. She looks at me, and I can see the same sparkle in her eye. She #emp wants#! this!"

 agot_scenario_trp.1012.desc.rhaenyra.ruler:0 "Sıradakini asla beklemezdim.\n\n"I want you." he says, a sparkle in his eye, that wry smile over his lips. "I want to wed you in the tradition of our house. Bring the dragon together as one. I've always wanted you Rhaenyra, and I know you've always wanted me. End the farce. Let it be known."\n\nAghast faces line the court, but I cannot help but smile. I #emp want#! this too!"

 agot_scenario_trp.1012.desc.divorce:0 "Sıradaki beklenmeliydi.\n\n"I wish to be rid of my loathsome wife." he says, to the gasp of the court. "I want to be free of the Bronze Bitch; to marry someone more worthy of my station. I have proven myself a worthy ruler, and I think the realm would agree that I deserve such a reward."\n\nSuch a boon is simultaneously trivial, yet completely scandalous!"

 agot_scenario_trp.1012.desc.hand:0 "Sıradaki beklenmeliydi.\n\n"I wish to be named Hand of the King!" he says, to the gasp of the court. "I want to be your right hand, your most trusted advisor, as I always should have been. I have proven myself a worthy ruler, and there is none better to be your Hand."\n\nWhile certainly a political statement, I cannot deny that he has proven himself a worthy ruler."

 agot_scenario_trp.1012.desc.gold:0 "Sırada ne geleceği, onun gibi bir adamdan beklenmeliydi.\n\n"Pekala Majesteleri... altın her zaman hoş karşılanır. Ve onuruma bir şenlik çok memnuniyetle karşılanırdı. Kendimi layık bir hükümdar olarak kanıtladım ve diyarın böyle bir ödülü hak ettiğimi kabul edeceğini düşünüyorum." diyor, muzip bir gülümsemeyle.\n\nKazanılan topraklarla kıyaslandığında böyle bir lütuf önemsiz!"

 agot_scenario_trp.1012.a:0 "Ve öyle olacak!"

 agot_scenario_trp.1012.a.toast.t:0 "Lütuf Bahşedildi"

 agot_scenario_trp.1012.a.toast.desc.heir:0 "Dragonstone Prensi ve Demir Taht'ın haklı varisi ilan edildin!"

 agot_scenario_trp.1012.a.toast.desc.rhaenyra:0 "Sana Rhaenyra Targaryen'in eli bahşedildi!"

 agot_scenario_trp.1012.a.toast.desc.divorce:0 "Karından boşanman bahşedildi ve yeniden evlenmekte özgürsün!"

 agot_scenario_trp.1012.a.toast.desc.hand:0 "Kralın Eli olarak atandın!"

 agot_scenario_trp.1012.a.toast.desc.gold:0 "Sana büyük bir altın meblağ ve onuruna bir şenlik bahşedildi!"

 agot_scenario_trp.1012.b:0 "Bu çok ileri! Fikrimi değiştirmeden önce başka birini seç!"

 agot_scenario_trp.1012.b.again:0 "Cüret mi ediyorsun!?"

 agot_scenario_trp.1012.b.tt:0 "İsteğini reddedeceksin ve Daemon başka bir lütuf isteyebilecek"

 agot_scenario_trp.1012.b.again.tt:0 "İsteğini reddedeceksin."

 agot_scenario_trp.1013.t:0 "Prensin Eli"

 agot_scenario_trp.1013.desc:0 "[daemon.GetTitledFirstName]'in Kızıl Kale'ye döndüğü haberi bana ulaştı; Caraxes'in bu sabah Ejderha Çukuru'na uçtuğu görülmüş. Muzaffer dönüyor: Adımtaşlar ve Dar Deniz'in rakipsiz Kralı! Dahası, sadakat yemini etmeye gelmiş!\n\nSaray tahtın önünde toplanırken, [sitting_ruler.GetTitledFirstName] Daemon'a diyara hizmeti için bir lütuf teklif ediyor. Gözlerimle buluşuyor; sözler dudaklarından çıkmadan ne isteyeceğini biliyorum.\n\n"Rhaenyra'yı istiyorum.""

 agot_scenario_trp.1013.a:0 "Ah #italic Daemon!#!"

 agot_scenario_trp.1013.b:0 "Bir ödül broşu gibi sunulmayacağım!"

 agot_scenario_trp.1014.t:0 "Üzerlerinde Kan Kızılı Kanatlar"

 agot_scenario_trp.1014.desc:0 "Yıllardır bu gelgit yıkanmış adalarda, Triarchy adına diğer amiral arkadaşlarımla aramdaki rahatsız bir rekabetle hüküm sürüyorum. Geçen gemilere koyduğumuz vergilerden büyük zenginlik çıkarabildiysem de, hiçbirimiz önceliği alamadık.\n\nŞimdi ise işleri sarsmak için yeni bir gücün geldiği haberi bana ulaştı. [daemon.GetTitledFirstName], [daemon.GetCurrentLocation.GetName]'e ayak bastı ve Adımtaşlar'ı fethetmek için bir sefer başlattı! Arkasında bir ejderhayla, korkutucu bir düşman olacağı kesin.\n\nAramızda kayıp aşk olmasa da, farklarımızı bir kenara bırakıp bu Serseri Prens'i derinliklere geri göndermeye yemin ettik!"

 agot_scenario_trp.1014.a:0 "Adımtaşlar bu yükselmiş prense düşmeyecek!"

 agot_scenario_trp.1015.t:0 "Denizde Küller"

 agot_scenario_trp.1015.desc:0 "Felaket! Ejderhanın ordusu Adımtaşlar'da bir tutunma noktası kurdu ve amiral arkadaşlarımdan biri, [Naethys_113.GetFirstName], çoktan ejderha ateşine kurban gitti. Bunu tek başımıza yapamayız!\n\nNeyse ki, görünüşe göre gerek yok. Triarchy'nin savaşımıza katıldığı haberi bana ulaştı! Adımtaşlar'daki kuvvetlerimiz üzerinde [drahar.GetTitledFirstNameNicknamed]'e öncelik vermiş olsalar da, ben [drahar.GetHerHis] ikincisi ilan edildim. Bu düzenlemeyi kabul etmekten başka çarem yok; hayatta kalmamız buna bağlı!"

 agot_scenario_trp.1015.a:0 "#EMP GALİP#! gelmeliyiz!"

 agot_scenario_trp.1016.t:0 "Adımtaşlar Yanıyor"

 agot_scenario_trp.1016.desc:0 "Adımtaşlar'dan korkunç haber! Görünüşe göre [daemon.GetTitledFirstName] Adımtaşlar'a bir istila başlatmış ve şimdiden üçte birini fethetmiş! Kukla amirallerimiz şimdiye dek onu durduramadı; köklü ve doğrudan bir müdahale gerekiyor!\n\nBu savaşa kendimiz katılacağız, amirallerimizin didişmesine son vereceğiz ve bu Serseri Prens'i adalete teslim edeceğiz!"

 agot_scenario_trp.1016.a:0 "Adımtaşlar üzerindeki hâkimiyetimiz korunacak!"

 agot_scenario_trp.1018.t:0 "Ejderha Düşüyor!"

 agot_scenario_trp.1018.desc.start:0 "Zafer! Zor kazanılmış olsa da, [daemon.GetTitledFirstName] kuvvetleri birleşik gücümüzle boy ölçüşemedi!"

 agot_scenario_trp.1018.desc.alive:0 "Serseri Prens, utandırılmış ve yenilmiş halde Kızıl Kale'ye kaçtı. Adımtaşlar bir kez daha bizim!"

 agot_scenario_trp.1018.desc.dead:0 "Ejderha kanı artık Adımtaşlar'ın kıyılarını yıkıyor ve bedeni denizin derinliklerinde yatıyor. Adımtaşlar bir kez daha bizim!"

 agot_scenario_trp.1018.desc.end:0 "\n\nYine de her şey yolunda değil. Prens yenilmiş olabilir, ama tehdit öldükçe ittifakımızın birleştirici gücü de ölüyor. Amiral arkadaşlarım çoktan ganimet için didişmeye başladı ve her birimiz şimdi seçmek zorundayız — barış mı, savaş mı?"

 agot_scenario_trp.1018.a:0 "Yeterince kan döküldü. Barış yapılmalı!"

 agot_scenario_trp.1018.a.tt:0 "Amiral arkadaşların kabul ederse, Triarchy'nin bir tebaası olarak barışçıl biçimde geri döneceksin."

 agot_scenario_trp.1018.b:0 "Adımtaşlar yalnızca benim olacak!"

 agot_scenario_trp.1018.b.tt:0 "Adımtaşlar'daki diğer her hükümdara savaş ilan edeceksin. Onlar da birbirlerine savaş ilan edecek. Kim kazanırsa Adımtaşlar'ın tek hükümdarı olacak."

 agot_scenario_trp.1020.t:0 "Zamanımızda Barış"

 agot_scenario_trp.1020.desc:0 "Görünüşe göre ne ben ne de amiral arkadaşlarım Adımtaşlar'ın bu kadar yakında yeniden yandığını görmek istemiyor. Yıllardır birbirimizin boğazındayız, ama farklarımızı bir kenara bırakıp statükoya dönmeye karar verdik.\n\nAdımtaşlar bir kez daha Triarchy'nin kontrolünde ve düzenli ticaret akışı yeniden başladı. Yeni topraklar kazanmamış olsam da, akranlarımın saygısını ve onları zafere taşıyabileceğim bilgisini kazandım."

 agot_scenario_trp.1020.desc.no_three_daughters:0 "Görünüşe göre ne ben ne de amiral arkadaşlarım Adımtaşlar'ın bu kadar yakında yeniden yandığını görmek istemiyor. Yıllardır birbirimizin boğazındayız, ama farklarımızı bir kenara bırakıp statükoya dönmeye karar verdik.\n\nTriarchy'nin rehberliği artık bizim için mevcut olmasa da, böyle sakin kafalar yönetimdeyken barışın galip gelebileceği umulur. Akranlarımın saygısını ve onları bilgece yönetebileceğim bilgisini kazandım."

 agot_scenario_trp.1020.a:0 "Barış, nihayet."

 agot_scenario_trp.1021.t:0 "Sığlıklar Üzerinde Kaos"

 agot_scenario_trp.1021.desc:0 "Barış süreci başarısız oldu.\n\nÇabalarıma rağmen, amiral arkadaşlarımın — başta [war_instigator.GetTitledFirstName] — aramızdan kimin Adımtaşlar'ı yöneteceğine karar vermenin tam zamanı olduğuna karar verdiği görülüyor.\n\nBu istediğim yol olmasa da, kader savaşacağımıza hükmetti."

 agot_scenario_trp.1021.a:0 "Benim olanı alamayacaksın!"

 agot_scenario_trp.1022.t:0 "Birleşik Adalar"

 agot_scenario_trp.1022.desc:0 "Zafer!\n\nAkranlarım arasında yüce duruyorum; bir zamanların amiral arkadaşlarımın kuvvetleri denize savruldu ve artık sancağım altında hizmet ediyor. Önümüzdeki günlerde homurdanıp söylenseler de, şimdilik benimler ve Adımtaşlar hükümdarlığım altında birleşti!\n\nElbette, bu diyarım her zaman Triarchy'den yalnızca gevşek biçimde bağımsızdı. Bu büyük diyarın bir tebaası olarak yönetmeye devam etmeyi mi, yoksa bağımsızlığımı resmileştirmeyi mi seçmeliyim?"

 agot_scenario_trp.1022.a:0 "Adımtaşlar, Triarchy'nin bir tebaası olarak kalacak."

 agot_scenario_trp.1022.b:0 "#EMP Biz#! bu adalar için savaştık ve onlar yalnızca bizim olacak!"

 agot_scenario_trp.1023.t:0 "Kan Döküldü, Neyin İçin?"

 agot_scenario_trp.1023.desc:0 "Şu anda Adımtaşlar'ı sarmalayan bu amiraller ve önemsiz korsan lordları yarışması net bir kazanan çıkarmadı.\n\nKatılımcılar çeşitli mağaralarında ve adalarında yaralarını yalarken, Triarchy artık böyle bir kan dökülmesine izin veremez. Bazı çatışmalar hâlâ sürüyor olsa da, bir şey kesin.\n\nBu işten kimse taçlandırılmayacak."

 agot_scenario_trp.1023.desc.no_three_daughters:0 "Şu anda Adımtaşlar'ı sarmalayan bu amiraller ve önemsiz korsan lordları yarışması net bir kazanan çıkarmadı.\n\nKatılımcılar çeşitli mağaralarında ve adalarında yaralarını yalarken, hiçbiri gerçek öncelik iddia edemez. Bazı çatışmalar hâlâ sürüyor olsa da, bir şey kesin.\n\nBu işten kimse taçlandırılmayacak."

 agot_scenario_trp.1023.a:0 "Belki de bu en iyisi."

 agot_scenario_trp.1024.t:0 "Adımtaşlar'dan Azarlama"

 agot_scenario_trp.1024.desc_daemon_lost_first:0 "Adımtaşlar üzerindeki hâkimiyetimiz her zaman uygulamadan çok bir öneri meselesiydi. O amiraller gemilerinin nereden geldiğini, adamlarının nerede yaşadığını bilirlerdi. En azından şimdiye dek...\n\n[stepstones_ruler.GetName]'in amiraller arasındaki bölgesel çatışmada yakın zamanda üstün geldiği ve [stepstones_ruler.GetHerHis] yeni krallığı üzerindeki otoritemizi azarladığı haberi bana ulaştı."

 agot_scenario_trp.1024.desc_daemon_lost_second:0 "Ejderhayı geri püskürttükten sonra Adımtaşlar üzerindeki hâkimiyetimizin güvenceye alındığını düşünürdü insan. Açıkça, [stepstones_ruler.GetName] ile elimizi fazla zorladık.\n\n[stepstones_ruler.GetSheHe]'nin [stepstones_ruler.GetHerHis] yeni krallığı üzerindeki otoritemizi azarladığını ve [stepstones_ruler.GetHerHis] bağımsızlığını ilan ettiğini duydum!"

 agot_scenario_trp.1024.a:0 "O yükselmiş korsan!"

 agot_scenario_trp.1024.b:0 "Buna göz yummayacağız!"

 agot_scenario_trp.1025.t:0 "Ejderha Prens'in Gazabı"

 agot_scenario_trp.1025.desc.refused:0 "Yine, [sitting_ruler.GetTitledFirstName] lütufumu reddetti!"

 agot_scenario_trp.1025.desc.rage:0 "[sitting_ruler.GetTitledFirstName]'in lütufumu reddetmesi düşünülemez!"

 agot_scenario_trp.1025.desc:0 "Bu en üst düzey bir hakaret! Düşünmek ki: Ben, büyük Caraxes'in binicisi ve Kara Kızkardeş'in sahibi, Adımtaşlar ve Dar Deniz'in Kralı, Demir Taht'ın #emp haklı varisi#!, ilk doğan ben olmadığım için tahtta olmayacak şımartılmış bir zayıf tarafından reddedilmeliyim!\n\nÖfkemin hepsini tüketiyor, ejderhamın ateşi göğsümde yanıyor. Yediler, Boğulmuş Tanrı, Kızıl Tanrı, tüm lanet tanrılar ve Westeros'taki her lanet olası kadın ve erkeğin sağduyusu adına #N BEN BİR KEZ BİLE TANINMAYI HAK EDİYORUM!#!"

 agot_scenario_trp.1025.a:0 "Caraxes! #N;bold DRACARYS!#!"

 agot_scenario_trp.1025.a.tt:0 "[sitting_ruler_heir.GetSheHe] hayatta kalırsa, Westeros'u yönetme hakkı için [sitting_ruler_heir.GetTitledFirstName]'e savaş ilan edeceksin"

 agot_scenario_trp.1025.b:0 "O zaman lütufum Demir Taht olacak!"

 agot_scenario_trp.1025.b.f:0 "Tahtı darbe ile almak için kılıcını çekiyorsun!"

 agot_scenario_trp.1025.b.fone:0 "$agot_scenario_trp.1025.b.f$ [daemon_kg_1.GetFullName], seninle [sitting_ruler.GetTitledFirstName] arasında duruyor."

 agot_scenario_trp.1025.b.ftwo:0 "$agot_scenario_trp.1025.b.f$ [daemon_kg_1.GetFullName] ve [daemon_kg_2.GetFullName], seninle [sitting_ruler.GetTitledFirstName] arasında duruyor."

 agot_scenario_trp.1025.b.tt:0 "[sitting_ruler.GetTitledFirstName], taht için seninle düello yapabilir ya da teslim olabilir"

 agot_scenario_trp.1025.b.ttone:0 "[daemon_kg_1.GetFullName] ile düello yapacaksın"

 agot_scenario_trp.1025.b.tttwo:0 "[daemon_kg_1.GetFullName] ve [daemon_kg_2.GetFullName] ile düello yapacaksın"

 agot_scenario_trp.1025.b.ttadult:0 "Kazanırsan, [sitting_ruler.GetTitledFirstName] taht için seninle düello yapabilir ya da merhametine teslim olabilir"

 agot_scenario_trp.1025.b.ttchild:0 "Bir çocuk olarak, [sitting_ruler.GetTitledFirstName] tahtı sana teslim etmek zorunda kalacak"

 agot_scenario_trp.1025.c:0 "Sen benim hükümdarım değilsin!"

 agot_scenario_trp.1025.c.f:0 "[sitting_ruler.GetTitledFirstName]'e olan sadakatini geri çekiyor ve taht odasından fırtına gibi çıkıyorsun."

 agot_scenario_trp.1025.d:0 "İntikam en soğuk yenen yemektir."

 agot_scenario_trp.1025.d.f:0 "Reddi kibarca kabul ediyorsun, ama intikam için plan yapmaya başlıyorsun..."

 agot_scenario_trp.1026.t:0 "Prensin Dehşeti"

 agot_scenario_trp.1026.desc:0 "Daemon, isteğimi reddetmem karşısında öfkeyle kaleden fırtına gibi çıkıyor. Arkasından sesleniyorum, ama sözlerime kör.\n\nYorgun bir iç çekişle tahta oturuyorum; ama kaçınılmaz olarak göndermemiz gereken mektubu yazması için bir kâtip çağıramadan, kalenin dışından büyük bir #bold KÜKREME#! duyuyorum; ardından olağanüstü bir #bold çarpışma sesi!#!\n\nİdrak, buz banyosu gibi üzerime yıkanıyor; kemiklerime işleyen soğuk bir dehşet. Yapmış olamaz — Daemon bile bu kadar yıkıcı olmazdı...\n\nDüşünce, göz kamaştırıcı bir ışık parlamasıyla kesiliyor ve taht odasındaki her şey kül olmadan önce açık gökyüzünü kısaca görüyorsun."

 agot_scenario_trp.1026.a:0 "Kahrol Daemon!"

 agot_scenario_trp.1029.t:0 "Daemon'un Hırsı Açığa Çıktı!"

 agot_scenario_trp.1029.desc.start:0 ""Yediler, Boğulmuş Tanrı, Kızıl Tanrı, tüm lanet tanrılar ve Westeros'taki her lanet olası kadın ve erkeğin sağduyusu adına #N BEN BİR KEZ BİLE TANINMAYI HAK EDİYORUM!#!" diye bağırıyor [daemon.GetFirstName]; Kara Kızkardeş'i gözümün görebildiğinden hızlı çekerek.\n\n"

 agot_scenario_trp.1029.desc.kgone:0 "Kral Muhafızlarım yeterince hızlı; [daemon_kg_1.GetFullName]"

 agot_scenario_trp.1029.desc.kgoneend:0 " karşılık olarak kendi kılıcını çekerek. Daemon bir an tereddüt edip gözlerini benimkiyle kilitliyor."

 agot_scenario_trp.1029.desc.kgtwo:0 " ve [daemon_kg_2.GetFullName] karşılık olarak kendi kılıçlarını çekerek. Daemon bir an tereddüt edip gözlerini benimkiyle kilitliyor."

 agot_scenario_trp.1029.desc.brother:0 ""Bunu bana vermeyeceksen, sevgili kardeşim,"

 agot_scenario_trp.1029.desc.niece:0 ""Bunu bana vermeyeceksen #italic prenses#!,"

 agot_scenario_trp.1029.desc.other:0 ""Yoluma çıkacaksan"

 agot_scenario_trp.1029.desc.cont:0 "o zaman her zaman #bold benim#! olması gerekeni alacağım!""

 agot_scenario_trp.1029.desc.kgkill:0 "\n\nVuran bir yılan gibi [daemon_kg_1.GetFullNameNoTooltip]'e saldırıyor; şövalyenin kılıcını savurup Kara Kızkardeş'i [daemon_kg_1.GetHerHis] göz çukuruna saplıyor."

 agot_scenario_trp.1029.desc.kgkilltwo:0 "[daemon_kg_2.GetFirstNameNoTooltip] pek de iyi durumda değil; kısa bir çarpışmanın ardından Daemon'un kılıcı [daemon_kg_2.GetHerHis] boğazını buluyor."

 agot_scenario_trp.1029.desc.end:0 "Taht odası, Daemon'un ağır nefes alışı dışında sessiz. Şok olmuş saray mensupları hareket etmekten korkuyor; ne olacağını izliyorlar. Gözlerindeki ateşi görüyorum; sözsüzce kılıcını bana doğrultuyor."

 agot_scenario_trp.1029.a:0 "Hain seni! Seni kendim yere sereceğim!"

 agot_scenario_trp.1029.a.tt:0 "Demir Taht'ı yönetme hakkı için [daemon.GetTitledFirstName] ile düello yapacaksın."

 agot_scenario_trp.1029.b:0 "Seni yenemem! Teslim oluyorum!"

 agot_scenario_trp.1029.b.tt:0 "Tahtı [daemon.GetTitledFirstName]'e teslim ediyorsun"

 agot_scenario_trp.1029.b.tt_child:0 "Bir çocuk olduğun için teslim olmaktan başka seçeneğin yok."

 agot_scenario_trp.1030.t:0 "Yükselen Hükümdarlık"

 agot_scenario_trp.1030.desc.start:0 "[loser_of_IT_duel.GetFirstName] ayaklarımın dibinde ölü yatıyor ve taht odası bir an sessiz kalıyor; tek bir alkış odaya yankılanana dek. Dönüp cesur bir saray mensubu görüyorum; sonra bir başkası, sonra bir başkası; oda alkış sesleriyle dolana dek.\n\nTahta bakıyorum ve kararlı adımlarla, haklı yerimi almak için Demir Taht'a çıkıyorum."

 agot_scenario_trp.1030.desc.brother:0 "Kardeşimin ölümü yüreğime ağır gelecek olsa da, gerekli olanı yaptığımı biliyorum."

 agot_scenario_trp.1030.desc.uncle:0 "Amcamın ölümü yüreğime ağır gelecek olsa da, gerekli olanı yaptığımı biliyorum."

 agot_scenario_trp.1030.desc.niece:0 "Yeğenimin ölümü yüreğime ağır gelecek olsa da, gerekli olanı yaptığımı biliyorum."

 agot_scenario_trp.1030.a:0 "Diyar benim, olması gerektiği gibi."

 agot_scenario_trp.1030.a.tt:0 "[dragonstone_claimant.GetTitledFirstName] hâlâ duruyor ve hükümdarlığına meydan okuyabilir."

 agot_scenario_trp.1031.t:0 "Serseri Prens'in Sonu"

 agot_scenario_trp.1031.desc.start:0 "$agot_scenario_trp.1029.desc.start$agot_scenario_trp.1029.desc.kgone$"

 agot_scenario_trp.1031.desc.kgkilled:0 "\n\nVuran bir yılan gibi [daemon_kg_1.GetFullNameNoTooltip]'e saldırıyor; şövalyenin kılıcını savurup Kara Kızkardeş'i [daemon_kg_1.GetHerHis] göz çukuruna saplıyor. Ama gidebildiği yer bu kadar; [daemon_kg_2.GetFullNameNoTooltip] bir öfkeyle üzerine çullanıyor; ikisi bir çelik fırtınasında çarpışıyor; ta ki [daemon_kg_2.GetFirstNameNoTooltip] kılıcını Daemon'un yüreğine saplayana dek."

 agot_scenario_trp.1031.desc.kglived:0 "\n\nVuran bir yılan gibi [daemon_kg_1.GetFullNameNoTooltip]'e saldırıyor; şövalyenin kılıcını savurup Kara Kızkardeş'i hızla [daemon_kg_1.GetHerHis] göz çukuruna saplamaya çalışıyor. [daemon_kg_1.GetSheHe] çok hızlı; başını çevirip kılıcının kabzasını Daemon'un yüzünün yanına geçirerek onu kısa süreliğine sersemletiyor. [daemon_kg_1.GetFirstNameNoTooltip] bir an bile durmuyor ve kılıcını Daemon'un yüreğine saplıyor."

 agot_scenario_trp.1031.desc.fightend:0 "\n\nTaht odası, Daemon'un yorgun nefes alışı ve göğsünden damlayan kanın sesi dışında sessiz. Bana dönüyor, ağzından kan damlıyor. Öksürüyor, dudaklarından daha fazla kan dökülüyor ve dizlerinin üzerine düşüyor."

 agot_scenario_trp.1031.desc.brother:0 ""#italic Kardeşim... Ben...#!""

 agot_scenario_trp.1031.desc.niece:0 ""#italic Rhaenyra... Ben...#!""

 agot_scenario_trp.1031.desc.other:0 ""#italic Sen... Ben...#!""

 agot_scenario_trp.1031.desc.end:0 "Yere düşüyor, son sözleri söylenmemiş."

 agot_scenario_trp.1031.a.brother:0 "Hırsın sana her şeye mal oldu, kardeşim..."

 agot_scenario_trp.1031.a.niece:0 "Keşke bu şekilde olmasaydın, amca..."

 agot_scenario_trp.1031.a.other:0 "Bunu kendin istedin, Daemon."

 agot_scenario_trp.1032.t:0 "Yükselen Serseri Prens"

 agot_scenario_trp.1032.desc.surrendered:0 "Kralın Şehri'nden şok edici haber! Görünüşe göre [daemon.GetFullName], Adımtaşlar'ı fethinin ardından Demir Taht'a sadakat yemini ettikten sonra, [sitting_ruler.GetTitledFirstName]'in sunduğu ödüllerden tatmin olmadı. O kadar öfkelendi ki [sitting_ruler.GetTitledFirstNameNoTooltip]'i hapsetmeyi başardı ve şimdi Demir Taht'a kendisi oturuyor!\n\nDiyarın tüm lordlarının onu Yedi Krallık'ın tartışmasız hükümdarı olarak tanımasını talep ediyor! Targaryenlerin ata makamının hükümdarı ve önceki veliaht olarak, lordlar taleplerine uyup uymayacağımızı görmek için bana bakacak."

 agot_scenario_trp.1032.desc.dead:0 "Kralın Şehri'nden korkunç haber! Görünüşe göre [daemon.GetFullName], Adımtaşlar'ı fethinin ardından Demir Taht'a sadakat yemini ettikten sonra, [sitting_ruler.GetTitledFirstName]'in sunduğu ödüllerden tatmin olmadı. O kadar öfkelendi ki kılıcını çekip [sitting_ruler.GetTitledFirstNameNoTooltip]'i öldürdü ve şimdi Demir Taht'a kendisi oturuyor!\n\nDiyarın tüm lordlarının onu Yedi Krallık'ın tartışmasız hükümdarı olarak tanımasını talep ediyor! Targaryenlerin ata makamının hükümdarı ve önceki veliaht olarak, lordlar taleplerine uyup uymayacağımızı görmek için bana bakacak."

 agot_scenario_trp.1032.a:0 "Bana zarar vermeyeceğinden eminim..."

 agot_scenario_trp.1032.b:0 "Bu yükselmiş prense boyun eğmeyeceğim!"

 agot_scenario_trp.1033.t:0 "Dragonstone Boyun Eğiyor"

 agot_scenario_trp.1033.desc:0 "Dragonstone'dan haber döndü: [dragonstone_claimant.GetTitledFirstName] bana yazdı; yönetimimi Yedi Krallık'ın haklı hükümdarı olarak kabul ediyor ve [dragonstone_claimant.GetSheHe]'nin hükümdarlığıma meydan okumayacağını, bana zarar vermeye çalışmayacağını garanti ediyor.\n\n[dragonstone_claimant.GetHerHis] desteği ve kamuoyu önünde tanımasıyla, meşruiyetime yönelik en büyük tehdit, daha başlamadan bastırıldı. Hükümdarlığım güvende."

 agot_scenario_trp.1033.a:0 "Elbette Dragonstone #emp bizim#! ata makamımız..."

 agot_scenario_trp.1033.a.f:0 "[dragonstone_claimant.GetTitledFirstNameNoTooltip] boyun eğmiş olsa da, bu ona iyi davranmak zorunda olduğun anlamına gelmez."

 agot_scenario_trp.1034.t:0 "Prens Daha Büyük"

 agot_scenario_trp.1034.desc:0 "Şaşkınlıkla, [sitting_ruler.GetTitledFirstName] hızla ayağa kalkıyor ve kılıcını çekmek yerine önümde diz çöküp başından tacı sunuyor. "Yürüdüğün yol buysa Daemon, seni durduramam... ama artık sana ikinci Maegor diyenler haklı çıkacak." diyor [sitting_ruler.GetSheHe]; gözleri yerde.\n\nTacı alıp başıma koyuyorum. Bir el hareketiyle [sitting_ruler.GetTitledFirstNameNoTooltip]'i zincirlere vurulmuş halde götürttürüyorum ve her zaman benim olması gereken o koltuğu almak için yürüyorum."

 agot_scenario_trp.1034.a:0 "Diyar benim, olması gerektiği gibi."

 agot_scenario_trp.1034.a.dragonstone:0 "Şimdi, Dragonstone ile ilgilenmek gerek..."

 agot_scenario_trp.1035.t:0 "Hor Görülen Bir Prens"

 agot_scenario_trp.1035.desc:0 "Daemon, isteğimi reddetmem karşısında öfkeyle kaleden fırtına gibi çıkıyor. Beni ve sarayımı türlü küfürlerle anarak söyleniyor; sonra sadakatini geri çekip bir kez daha bağımsızlık ilan ederek çıkıp gidiyor!\n\nArkasından sesleniyorum, ama sözlerime kör. Yorgun bir iç çekişle tahta oturuyorum. Bu kesinlikle daha iyi sonuçlanabilirdi."

 agot_scenario_trp.1035.a:0 "Buna göz yummayacağım!"

 agot_scenario_trp.1035.b:0 "Eh, iradeli adamların hali böyle."

 agot_scenario_trp.1036.t:0 "Diyarın Kararı"

 agot_scenario_trp.1036.desc:0 "Uzun süredir soyumu sürdürecek yaşayan bir oğlum yoktu, ama artık yok! Tanrılar bana bir erkek bebek bahşetmeyi uygun gördü ve [male_child_born.GetFirstName] onun adı olacak. Diyar bu habere seviniyor!\n\nYine de bu, çok uzun zaman önce verdiğim kararı sorguya açıyor. Veraset sorunu her zaman aklımdaydı ve [female_current_heir.GetFirstName] varisim ilan edilmişken, yeni ailemi ışığında bu kararı değiştirip değiştirmeyeceğime şimdi karar vermeliyim."

 agot_scenario_trp.1036.a:0 "Evlenecekler ve [male_child_born.GetFirstNameNoTooltip] varis ilan edilecek!"

 agot_scenario_trp.1036.b:0 "Fikrimi değiştirmeyeceğim, ama diyarı güvenceye almak için evlenecekler."

 agot_scenario_trp.1036.b_tt:0 "[TopScope.GetValue('courtly_vassals_count')] $courtly_vassals$ seninle #N -15#! görüş kaybedecek"

 agot_scenario_trp.1036.c:0 "[male_child_born.GetFirstNameNoTooltip], gelenek olduğu üzere varis ilan edilecek."

 agot_scenario_trp.1036.d:0 "Bir kez karar verdim ve şimdi değiştirmeyeceğim."

 agot_scenario_trp.1036.d_tt:0 "[TopScope.GetValue('courtly_vassals_count')] $courtly_vassals$ seninle #N -25#! görüş kaybedecek"

 agot_scenario_trp.1037.t:0 "Babanın Kararları"

 agot_scenario_trp.1037.desc:0 "Babam [ROOT.Char.GetFather.GetTitledFirstName], yaşayan bir oğul olmadığından, uzun süredir benim onun yasal ve tek varisi olduğumu savunuyordu. Ama kardeşim [male_child_born.GetFirstName]'in doğumuyla, diyar veraseti sorguya açıyor.\n\n"

 agot_scenario_trp.1037.desc.supplanted:0 "Tüm akıl ve mantığa karşı, babam kardeşimi varis ilan etmeye karar verdi; beni veraset çizgisinden çıkararak! Kızıl Kale'ye dönüp kardeşimi Dragonstone Prensi olarak kabul etmem gerekiyor!"

 agot_scenario_trp.1037.desc.married_supplanted:0 "Tüm akıl ve mantığa karşı, babam kardeşimi varis ilan etmeye karar verdi; beni veraset çizgisinden çıkararak! Dahası, Kızıl Kale'ye dönüp kardeşimi Dragonstone Prensi ve nişanlım olarak kabul etmem gerekiyor!"

 agot_scenario_trp.1037.desc.married:0 "Bu kırılgan durumun iğnesini geçirmek için babam, yaş farkına rağmen yeni kardeşimle nişanlanmam gerektiğine karar verdi. Pek heyecan verici bir ihtimal olmasa da, babamın kararını kabul etmeliyim."

 agot_scenario_trp.1037.desc.stayed:0 "Bilgeliğiyle babam, onun varisi olarak kalmaya devam edeceğime ve konumuma yönelik her meydan okumayla yasanın tüm gücüyle karşılaşılacağına karar verdi."

 agot_scenario_trp.1037.a:0 "Babamın kararını kabul etmeliyim."

 agot_scenario_trp.1037.b:0 "Arkamda durduğun için teşekkürler, baba."

 agot_scenario_trp.1037.c:0 "Buna boyun eğmeyeceğim ve diyar da benimle duracak!"

 agot_scenario_trp.1038.t:0 "Denizyılanı'nın Yenilenen Hırsı"

 agot_scenario_trp.1038.desc:0 "[corlys.GetName] saraya geldiğinde, doğal olarak ona özel bir görüşme verdim. Bir eylem adamı; ziyaretinin gerçek sebebini açıklaması uzun sürmedi.\n\nBir teklifle geldi; bir zamanlar yapılmış ama geri çevrilmiş, şimdi yeniden yapılan bir teklif. Kızı Leydi [laena.GetFirstName] ile evlenmemi istiyor. Artık yetişkin bir kadın, bir ejderha binicisi ve üstelik güzel. Denizyılanı, kabul edersem filosunun, kasalarının ve hanesinin sonsuz sadakatini vaat etti."

 agot_scenario_trp.1038.a:0 "İyi bir kraliçe olur!"

 agot_scenario_trp.1038.a.toast.title:0 "Kral Kabul Ediyor!"

 agot_scenario_trp.1038.b:0 "[corlys.GetTitledFirstNameNoTooltip], sadakatin zaten bende değil mi?"

 agot_scenario_trp.1038.b.toast.title:0 "Kral Reddediyor!"

 agot_scenario_trp.1039.t:0 "Güzel Bakire İçin Meydan Okuma"

 agot_scenario_trp.1039.desc:0 "Denizyılanı bana şeytani bir oyun oynadı! Teklifinden kurtulmaya çalışırken, serseri prens [daemon.GetFirstName]'in bizzat gelip kızı Leydi [laena.GetFirstName]'nin eli için yarışmasını ayarladı! Daha da kötüsü, bu kaba adam bunu bir gösteriye çevirmeye karar verdi ve eli için beni düelloya davet etti!"

 agot_scenario_trp.1039.a:0 "Şey... kabul etmeliyim!"

 agot_scenario_trp.1041.t:0 "Cephedeki Savaş"

 agot_scenario_trp.1041.desc:0 "Artık deneyimli bir savaş komutanıyım; kuvvetlerimi birçok çatışmada zafere taşıdım. Yine de karım [rhea.GetFirstName] beni hâlâ rahatsız ediyor; öldürdüğüm tüm adamların arasında bu lanet kadın yok!\n\nYine de tüm savaşlar kılıçla yapılmaz ve aklıma bazı düşünceler geldi. Etrafta olmadığım sırada bir kaza geçirse, kim beni suçlayabilir? Ondan kurtulabilirim ve kimse daha akıllı olamaz."

 agot_scenario_trp.1041.a:0 "Onu bir av gezisine göndereceğim ve en iyisini umacağım."

 agot_scenario_trp.1041.a.tt:0 "Trajik bir av kazasında sonunu buluyor"

 agot_scenario_trp.1041.a.tt_survived:0 "Av gezisinden sağ çıkıyor"

 agot_scenario_trp.1041.b:0 "Böyle bir seviyeye inmeyeceğim."

 agot_scenario_trp.1042.t:0 "Ejderhanın Isırığı"

 agot_scenario_trp.1042.desc_survived:0 "Av için atımı eyerlemeye gittiğimde, hizmetkârlarımın arasında birçok yeni yüzle çoktan toplanmış olduğunu buldum. Şüpheye yatkın biri değilim; o zaman hiçbir şey düşünmedim; ama grubumuz ormana doğru sürerken, sessiz ve sönük ifadeleri tüylerimi diken diken etti.\n\nBir tepeyi aşarken, grup beni atımdan çekmeye çalıştı! Kılıcımla şanslı bir savuruşla saldırganlarımdan birini öldürdüm ve kaçtım! Suikastçı adaylarını arkamda, takip eden nal seslerinin sesiyle bırakarak, böyle bir komplonun arkasında kim olabilirdi diye merak ettim?"

 agot_scenario_trp.1042.desc_died:0 "Av için atımı eyerlemeye gittiğimde, hizmetkârlarımın çoktan toplanmış olduğunu buldum! Böyle bir gayret için onları takdir ettim; ama ormana doğru sürerken, alışılmadık biçimde sessiz olduklarını fark ettim.\n\nSorunun ne olduğunu sormak için öne eğiliyorum ve sırtımda keskin bir çekiş hissediyorum! Atımdan #bold güm#! diye düşüyorum ve canavarın üzerime kapandığını hissederken, ihanete uğradığımı biliyorum..."

 agot_scenario_trp.1042.a:0 "Daemon... #emp *öksürük*#! seni alçak!"

 agot_scenario_trp.1042.b:0 "Bunun arkasında kimin olduğunu bildiğimi sanıyorum..."

 agot_scenario_trp.1042.b.f:0 "Suikast girişiminin arkasında [daemon.GetTitledFirstName]'in olduğundan şüpheleniyorsun; ama kanıtın yok."

 agot_scenario_trp.1043.t:0 "O Kaltak'ı Yere Ser"

 agot_scenario_trp.1043.desc_survived:0 "Lanet olsun!\n\n[rhea.GetName]'i öldürme planım başarısız oldu; yerleştirdiğim hizmetkârlar canına kastetme girişimini berbat etti. Birini biçip tertemiz atıyla uzaklaştı! En azından sonrasında dağılma akıllılığını gösterdiler.\n\nBeni doğrudan bu olaya bağlayan hiçbir şey olmasa da, Bronz Cadaloz'un katılımımdan şüphelenmesi hiç şüphesiz..."

 agot_scenario_trp.1043.desc_died:0 "Başarı!\n\nYerleştirdiğim hizmetkârlar kaltak'ı atından itti; sonra aygırı keskin bir dala saplayıp hayvanı onun üzerine fırlattı. Bana, yatakta yatarken yaralarından kanayarak öldüğü söylendi."

 agot_scenario_trp.1043.a:0 "Nihayet, özgürüm!"

 agot_scenario_trp.1043.b:0 "Eh, hiçbir şey ilk seferde yolunda gitmez..."

 agot_scenario_trp.1043.c:0 "Bu çok riskli."
