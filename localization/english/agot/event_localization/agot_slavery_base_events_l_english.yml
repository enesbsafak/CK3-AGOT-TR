l_english:

 agot_slavery.0101.t:0 "Braavos'un İlk Yasası"

 agot_slavery.0101.desc:0 "[ROOT.Char.Custom('IdleActivity')] ile o kadar meşguldüm ki bu yabancının odama girişini fark etmedim. [faceless_man.GetWomanMan], gölgelerden öne adım atıyor; [faceless_man.GetHerHis] yüzünde ürkütücü biçimde yanlış bir şeyler var. #italic Dikkatimi [faceless_man.GetHerHis] gözlerinin köşelerine çeken tanıma mı — yoksa derin, karanlık bir terslik mi?#!\n\n"Braavos'un kurucuları, biliyorsun, Valyria'dan kaçan kölelerdi," diyor [faceless_man.GetSheHe] sakince, bir kedinin zarif adımlarıyla bana yaklaşarak. "Her şeyin üstünde tek bir yasa koydular: Braavos'ta hiçbir erkek, kadın veya çocuk asla köle, bağımlı veya borç esiri olmayacak."\n\nBoynumun arkasında ter damlalarının biriktiğini hissediyorum; gözlerim [faceless_man.GetWomanMan]'in eline kayıyor. Yeni bileylenmiş bir bıçak, [faceless_man.GetHerHis] parmaklarının arasından uzanıyor. "Sen o yasaya ihanet ettin, onu haksız kazançlar için bir kenara attın," diye sürdürüyor [faceless_man.GetSheHe]. "Ve bunun için, Çok Yüzlü Tanrı'ya hizmet etmelisin... #bold ölümde#!."\n\nBir bilek hareketiyle bıçak boynumdan geçiyor — son nefesim, fışkıran parlak kırmızı havuzda hapsoluyor."

 agot_slavery.0101.a:0 "#weak *gurultu*#!"

 agot_slavery.9001.t:0 "Akınlardan Ele Geçirilen Yeni Köleler"

 agot_slavery.9001.desc:0 "Son akınımdan kafeslerde kaderlerini endişeyle bekleyen birçok yeni canla dönüyorum. Topraklarımda onları yeni bir yaşam bekliyor; aileleri ve evleri çoktan ufkun ötesinde kayboldu.\n\nTopraklarımda fazladan ellere ihtiyaç duyacak birçok yer var. Peki onları nereye göndermeliyim?"

 agot_slavery.9001.a:0 "[option_1.GetName]"

 agot_slavery.9001.b:0 "[option_2.GetName]"

 agot_slavery.9001.c:0 "[option_3.GetName]"

 agot_slavery.9001.d:0 "[option_4.GetName]"

 agot_slavery.9001.e:0 "[option_5.GetName]"

 agot_slavery.9001.f:0 "[option_6.GetName]"

 agot_slavery.9003.t:0 "Özgürleşenler Hizmetlerini Sunuyor"

 agot_slavery.9003.desc:0 "Kampım, askerlerin büyük zaferlerini kutlamasıyla yaşamla inliyor; hazırlanabilecek en güzel ziyafet onların keyfi için serilmiş. Kaptanlarımdan biri, yüzünde gurur ifadesiyle çadırıma giriyor. "[ROOT.Char.GetTitledFirstName], yeni özgürleşenlerden birkaçı huzurunuza çıkmak istiyor." Ona başımla onay veriyorum, eski kölelerin mutlaka edeceği teşekkür yağmurunu bekleyerek.\n\n[freedman_1.GetFirstName], peşindeki diğer özgürleşenlerle birlikte yaklaşıyor; tam önümde durup diz çöküyorlar. "[ROOT.Char.GetLadyLord|U]! Köle tacirleri bizi çaldığında evlerimizi yıktılar, ailelerimizi katlettiler..." [freedman_1.GetFirstNameNoTooltip|U], gözyaşlarını tutmaya çalışırken sanki [freedman_2.GetHerHis] gücünden almak istercesine yanındaki [freedman_2.GetFirstName]'in tanıdık yüzüne bakıyor.\n\n"Bizi pençelerinden kurtardığınız için size teşekkür ediyoruz, ama dönecek hiçbir şeyimiz yok. Alçakgönüllülükle sizden hizmetinize girmemizi kabul etmenizi diliyorum. Zanaatlarımızda hepimiz çok becerikliyiz; eminim bize bir kullanım alanı bulursunuz!""

 agot_slavery.9003.a:0 "Elbette sana bir yer bulabilirim!"

 agot_slavery.9003.b:0 "Yeni bir efendi aramak yerine hayatlarınızı yeniden kurmalısınız."

 agot_slavery.9100.t:0 "Fetih Zincirleri"

 agot_slavery.9100.desc:0 "Son zamanlarda fethettiğim toprakların arasında, uzun süredir eski efendilerine işgücü ve para sağlayan köle kampları yer alıyor. Bu topraklar artık hükmüm altında olduğuna göre, kaderleri benim elimde. Bu uygulamaları diyarın yararına sürdürmeye mi, yoksa sona erdirmeye mi karar vermeliyim."

 agot_slavery.9100.a:0 "Kampler kalacak."

 agot_slavery.9100.b:0 "Onları sökün."

 agot_slavery.9100.b.tt:0 "$building_type_agot_slave_camps_01$ hattındaki tüm [buildings|E] yok edilecek"

 agot_slavery.9100.b.tt2:0 "Tüm Köle Nüfusu [modifiers|E] kaldırılacak"
