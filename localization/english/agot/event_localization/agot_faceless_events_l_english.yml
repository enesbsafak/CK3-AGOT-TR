### TODO NOT-IN-ST: agot_faceless_interaction.0009.desc [AGOT: A visit to the market is always a sure way to lift my spirits — the hustle of porters, the bustle of merchants; all of the commotion thrills me! To think, such livelihood is owed to my own good stewardship.\n\nBut among the tradesfolk are those less fortunate souls; those wretches who survive merely off scraps and the small kindnesses of others. This afternoon, I come across one such soul, who would otherwise be easy to ignore, if not for his large #bold mastiff#!.\n\nSuch a rare breed — and, judging by its looks, well-fed! In fact, though its owner is all skin and bones, the dog looks to be all muscle. I approach the pauper, figuring I may offer a bit of coin and take his pup to a better life in my kennels.\n\n]
 agot_faceless_interaction.0009.desc:0 "A visit to the market is always a sure way to lift my spirits — the hustle of porters, the bustle of merchants; all of the commotion thrills me! To think, such livelihood is owed to my own good stewardship.\n\nBut among the tradesfolk are those less fortunate souls; those wretches who survive merely off scraps and the small kindnesses of others. This afternoon, I come across one such soul, who would otherwise be easy to ignore, if not for his large #bold mastiff#!.\n\nSuch a rare breed — and, judging by its looks, well-fed! In fact, though its owner is all skin and bones, the dog looks to be all muscle. I approach the pauper, figuring I may offer a bit of coin and take his pup to a better life in my kennels.\n\n"
