### TODO NOT-IN-ST: agot_faceless_interaction.0008.desc [AGOT: A walk at dusk is a rare pleasure, especially at the end of a tense day, and the castle's wallwalk provides an enviable seclusion from the apple polishers and lickspittles of my court. I take every caution to ensure that I am alone with my thoughts for these walks, leaving behind even my personal guards while I take in the view from up high.\n\nFrom atop the wallwalk, my duties shrink away — and I feel just a bit lighter. As I lean myself between two merlons, I can feel the wind rushing up the castle wall to meet me... It feels almost like flying.\n\n]
 agot_faceless_interaction.0008.desc:0 "A walk at dusk is a rare pleasure, especially at the end of a tense day, and the castle's wallwalk provides an enviable seclusion from the apple polishers and lickspittles of my court. I take every caution to ensure that I am alone with my thoughts for these walks, leaving behind even my personal guards while I take in the view from up high.\n\nFrom atop the wallwalk, my duties shrink away — and I feel just a bit lighter. As I lean myself between two merlons, I can feel the wind rushing up the castle wall to meet me... It feels almost like flying.\n\n"
