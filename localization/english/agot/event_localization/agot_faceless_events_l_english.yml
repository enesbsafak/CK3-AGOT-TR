### TODO NOT-IN-ST: agot_faceless_interaction.0005.desc [AGOT: It oft amuses me how like my townsfolk are to a colony of bees, bumbling about in their business, traveling to and fro with urgency that must seem so significant to their slight status. Even today, the streets are bustling with workers; brewers and bakers, beggars and butchers.\n\nEven the town itself seems alive; new buildings being built, furnishings in transit to their new homes. Just ahead of my entourage, I see a large harp being hoisted by pulley to the third story of a house — surely that of some wealthy merchant. The street itself is nearly blocked by the workers, but no one would dare stop a ruler from passing by.\n\n]
