l_english:

 agot_faceless_interaction.0001.t:0 "Yüzsüz Adam"

 agot_faceless_interaction.0001.desc:0 "O kadar [ROOT.Char.Custom('IdleActivity')] ile meşguldüm ki bu yabancının odama girişini fark etmedim. Rüzgâr kadar yumuşak ve keskin bir sesle [faceless_man.GetSheHe], [faceless_man.GetHerselfHimself]'i Braavos'un Yüzsüz Adamları'ndan biri olarak tanıtıyor. Sorgum alındı; "

 agot_faceless_interaction.0001.desc_no:0 "yine de kabul edecekleri bir bedel yok."

 agot_faceless_interaction.0001.desc_extreme:0 "bedel akıl almaz."

 agot_faceless_interaction.0001.desc_high:0 "hizmetlerinin bedeli epey yüksek."

 agot_faceless_interaction.0001.desc_low:0 "bedel, eldeki göreve uygun."

 agot_faceless_interaction.0001.desc_minimal:0 "bedel, yalnızca [gold_i] 300."

 agot_faceless_interaction.0001.desc_blood:0 "\n\n"There is another option, however," [faceless_man.GetSheHe] whispers, the words rustling in the air like leaves. "A life for a life; your life will make us square.""

 agot_faceless_interaction.0001.desc_child:0 "\n\n"There is another option, however," [faceless_man.GetSheHe] sighs, like a calming breeze. "A life for a life; [child_price.GetFirstNamePossessive] blood may pay your debt.""

 agot_faceless_interaction.0001.desc_artifact:0 "\n\n"There is another option, however," [faceless_man.GetSheHe] hisses like a gust through reeds. "An artifact, of roughly equal value, would suit our needs handsomely.""

 agot_faceless_interaction.0001.gold_price:0 "İşte paran."

 agot_faceless_interaction.0001.child_price:0 "Sen... çocuğu alabilirsin."

 agot_faceless_interaction.0001.blood_price:0 "Can cana adil bir takastır."

 agot_faceless_interaction.0001.artifact_price:0 "[artifact_price.GetName] ile ödeyeceğim"

 agot_faceless_interaction.0001.no:0 "Ne talihsizlik."

 agot_faceless_interaction.0001.cancel:0 "Biraz düşününce, fikrimi değiştiriyorum."

 agot_faceless_blood_price.tt:0 "#warning Yüzsüz Adamlar tam geri ödeme bekleyecek.#!"

 agot_faceless_interaction.0002.t:0 "Valar Morghulis"

 agot_faceless_interaction.0002.desc_intro:0 "Huzurlu öğleden sonram, hizmetkârlardan biri sanarak yanıldığım bir [faceless_man.GetWomanMan] tarafından bölünüyor. [faceless_man.GetHerHis|U] varlığı, havayı incelikle ağırlıkla dolduruyor; sanki odalarıma nemli bir fırtına çökmüş gibi.\n\nResmî bir tanıştırma yapılmasa da, [faceless_man.GetSheHe] ürkütücü bir biçimde tanıdık hissettiriyor; [faceless_man.GetHerHis] adını soruyorum ve [faceless_man.GetSheHe] kısa kısa cevap veriyor: "Bir [faceless_man.GetWomanMan]'ın adı olmaz."\n\n"

 agot_faceless_interaction.0002.desc_oyster:0 "[faceless_man.GetSheHe]'in açıkladığına göre, [victim.GetTitledFirstName] bozuk bir istiridye yemiş ve [victim.GetSheHe], hızlı — ama acılı — bir hastalık nöbetine yenik düşmüş."

 agot_faceless_interaction.0002.desc_furniture:0 "[faceless_man.GetSheHe]'in paylaştığına göre, [victim.GetTitledFirstName] talihinin kurbanı olmuş; ağır bir müzik aletini kaldıran bir makara, [victim.GetHerHis] başının üzerinde kopmuş ve zavallı kurbanı ezmiş."

 agot_faceless_interaction.0002.desc_horse:0 "Her sözcüğü titizlikle seçerek konuşan [faceless_man.GetSheHe], bana [victim.GetTitledFirstName]'in bir at binme kazası geçirdiğini söylüyor. "[victim.GetHerHis|U] hayatı... söndürüldü.""

 agot_faceless_interaction.0002.desc_slip:0 "[faceless_man.GetSheHe]'in paylaştığına göre, [victim.GetTitledFirstName], yüksek bir rafın tepesinden bir şey almaya çalışırken küçük bir talihsizlik yaşamış. [victim.GetSheHe|U], kayıp düştükten sonra [victim.GetHerHis] boynunu kırmış."

 agot_faceless_interaction.0002.desc_fall:0 "[faceless_man.GetSheHe]'in açıkladığına göre, [victim.GetTitledFirstName], [victim.GetHerHis] kalesinin sur yolundan ölümcül bir düşüş yaşadı."

 agot_faceless_interaction.0002.desc_dog:0 "Her sözcüğü titizlikle seçerek konuşan [faceless_man.GetSheHe], bana [victim.GetTitledFirstName]'in, çarşıda gezinirken azılı bir köpek tarafından [victim.GetHerHis] boğazının parçalandığını söylüyor. "Ne acı...""

 agot_faceless_interaction.0002.desc_fallback:0 "[faceless_man.GetSheHe], [victim.GetTitledFirstName]'in ölümünü doğrulasa da, [victim.GetHerHis] ölümünün yöntemi ve biçimi hakkında sessiz kalıyor."

 agot_faceless_interaction.0002.desc_blood_price:0 "\n\nAma [faceless_man.GetWomanMan] henüz bitmedi. Bir sırıtış gibi görünen kısacık bir kıpırtıyla [faceless_man.GetSheHe] bana şunu hatırlatıyor: Bir hayat borçlu..."

 agot_faceless_interaction.0002.a:0 "$VALAR_DOHAERIS$"

 VALAR_DOHAERIS:0 "[Glossary( 'Valar dohaeris.', 'VALAR_DOHAERIS_GLOSS' )]"

 agot_faceless_interaction.0004.t:0 "İstiridyeler, Deniz Tarağı ve Kabuklu!"

 agot_faceless_interaction.0004.desc:0 "Tuzlu meltem! Martıların çığlıkları! Liman işçilerinin koşuşturması! Hepsini içine çekmek için güzel bir gün.\n\nBöyle bir gezi için maiyetimi küçük tutarım. Rıhtımlarda gezinen, çeşitli esnafın mallarını inceleyen meraklı bir [ROOT.Char.GetTitleAsNameNoTooltip] olarak sahne yaratmaya gerek yok. Özellikle muhteşem bir süs eşyasına göz dikmiştim ki en harika melodiyi duyuyorum: "İstiridyeler, deniz tarağı ve kabuklular," bir şarkı gibi yankılanıyor ve balıkçının tezgâhına koşmaktan kendimi alamıyorum.\n\nBir düzine satın alıyorum; işçinin bana en iyilerini vermesini sağlamak için tıklayıp duruyorum. Yine de, beşincisini yerken başım dönmeye başlıyor."

 agot_faceless_interaction.0004.desc_faceless:0 "Ansızın bağırsaklarımın kontrolünü kaybediyorum ve yere düşerken bir pirinç tüccarının tezgâhına kapaklanıyorum. Kusuyorum; ağzımdan ve burnumdan iğrenç bir sıvı boşalıyor. Boğazımı yakıcı bir acı dolduruyor ve gözlerim, kendi kafatasımdan kaçacakmışçasına dışarı fırlıyor.\n\nBir kadın çığlık atıyor; ama benim gördüğüm tek şey, küt kuyruklu kirli bir kedi; görüşüm kararırken ara sokağa doğru süzülüp gidiyor."

 agot_faceless_interaction.0004.desc_fakeout:0 ""Nefes al, Efen[ROOT.Char.GetTitleAsNameNoTooltip]'im," diye dürtüyor [colleague.GetFirstName], "bunları çok hızlı yiyorsun, yavaşla."\n\nDerin bir nefes alıyorum; kendimi toparlamak için rıhtımın çevresine göz atıyorum. Perişan bir gri kedi ara sokağa süzülüp gidiyor ve kanın coşkusu sönüyor."

 agot_faceless_interaction.0004.a:0 "Deniz ürünlerini sevmem bile!"

 agot_faceless_interaction.0004.a_fakeout:0 "Ben sadece... deniz ürünlerini gerçekten seviyorum..."

 agot_faceless_interaction.0005.t:0 "Ölümcül Mobilya"

 agot_faceless_interaction.0005.desc:0 "Şehir halkımın bir arı kolonisiyle ne kadar benzer olduğu beni sık sık eğlendirir; kendi işlerinde acemice debelenirler, önemsiz mevkilerine öyle önemli görünmesi gereken bir telaşla bir oraya bir buraya gidip gelirler. Bugün bile sokaklar işçilerle kaynıyor; biracılar ve fırıncılar, dilenciler ve kasaplar.\n\nŞehrin kendisi bile canlı görünüyor; yeni binalar inşa ediliyor, eşyalar yeni evlerine taşınıyor. Maiyetimin hemen önünde, bir evin üçüncü katına makarayla kaldırılan büyük bir arp görüyorum — elbette zengin bir tüccarınki olsa gerek. Sokak neredeyse işçiler tarafından tıkanmış durumda; ama kimse bir hükümdarın geçişini durdurmaya cüret edemez.\n\n"

 agot_faceless_interaction.0005.desc_faceless:0 "Aleti kaldıran gergin halatların altından hızlı adımlarla geçiyorum; ansızın bir kopma sesi duyuyorum, ardından peş peşe bağırışlar ve bir çığlık. Tam zamanında yukarı bakıp kaderimi görüyorum: düşen bir ev eşyası, [ROOT.Char.GetFaith.DeathDeityNamePossessive] selamını iletmeye geliyor."

 agot_faceless_interaction.0005.desc_fakeout:0 "Aleti kaldıran gergin halatların yanından hızlı adımlarla geçiyorum; ansızın bir kopma sesi duyuyorum, ardından peş peşe bağırışlar ve bir çığlık. Düşen ev eşyası yere çarpıp paramparça oluyor ve peşinden zavallı bir işçiyi eziyor. [ROOT.Char.GetFaith.DeathDeityName]'e yalnızca şunu diyebiliyorum: #italic bugün değil#!."

 agot_faceless_interaction.0005.a:0 "Ah!"

 agot_faceless_interaction.0005.a_fakeout:0 "Bu kıl payıymış."

 agot_faceless_interaction.0006.t:0 "Tay Oyunu"

 agot_faceless_interaction.0006.desc:0 "Görevlerimden bir kaçış, ne kadar kısa olursa olsun, stresime iyi geldi. Burada, at sırtında; hükümdarlığın tekdüzeliğinde çoğu zaman kaybolan bir amaç ve gurur duygusu hissedebiliyorsun. Küçük maiyetim ve ben, atlarımızı dinlendirmek için eyerden kısa bir mola vermeyi seçtik.\n\n"Epey dikkat çekici bir savaş atı," diyor bir hizmetkâr, bir atı dizgininden tutarak. Maiyetimdekilerin çoğunu iyi tanıyorum; yine de seçemediğim bir şeyler ters görünüyor. Savaş atı bir yudum su içerken hizmetkâra ikinci kez bakıyorum.\n\n"

 agot_faceless_interaction.0006.desc_faceless:0 "Hizmetkârın yüzüne odaklanmam her şeyi tüketiyor... Bir adım daha yaklaşıyorum; bu olası davetsiz misafiri yakalamaya hazırken, önümdeki at ansızın sarsılıyor ve bacağını tüm gücüyle yüzüme doğru savuruyor. Başım kanlı bir biçimde geriye savrulurken şüphelerim buharlaşıyor; şüpheciliğin yerini acı alıyor ve dünyam kararıyor."

 agot_faceless_interaction.0006.desc_fakeout:0 "Aha, bu [servant.GetFirstName]! Yakından bakınca fark ediyorum! Ama öne bir adım attığımda, at yana sıçrıyor ve bir anda tüm şüpheler boşa çıkıyor. Güçlü bir tekme ile [servant.GetFirstNamePossessiveNoTooltip] yüzü parlak kırmızı bir ezik yığınına dönüşüyor ve şokla dehşetin çığlığı duyularımı dolduruyor."

 agot_faceless_interaction.0006.a:0 "H...öf!"

 agot_faceless_interaction.0006.a_fakeout:0 "İnanılmaz!"

 agot_faceless_interaction.0007.t:0 "Tam Ulaşamadığı Yerde"

 agot_faceless_interaction.0007.desc:0 "Bir hükümdar için yalnız geçirilen zaman bulunmaz bir nimettir; bu yüzden, danışmanlarımın ayrılmasının ardından geçen en kısa anın bile keyfini çıkarırım. Bugün, uzun ve sıkıcı bir tartışmanın ardından kendimi danışma odasında yalnızlığın tadını çıkarırken buluyorum — zihnimi istediği yere dalıp gitmeye bırakarak.\n\nÖylece oturup boş hayallere dalmışken, yakındaki bir kitaplığın tepesinden bir parıltı fark ediyorum. İkinci kez bakıyorum ve bu kez kitaplığın tepesinde yaldızlı bir şey olduğunu net biçimde görebiliyorum; gözlerden ve akıllardan uzakta saklanmış nadir bir hazine.\n\nSandalyemi alıp kitaplığın kenarına taşıyorum; üzerine çıkıp tepeye uzanıyorum... ama ne yazık ki, ne ise o, ulaşamayacağım bir yerde kalıyor. Keşke #italic birazcık#! daha uzanabilseydim...\n\n"

 agot_faceless_interaction.0007.desc_faceless:0 "Parmak uçlarım kitaplığın tepesini sıyırırken arkamda bir hışırtı duyuyorum, ama daha tepki veremeden altımdaki sandalye çekiliyor ve dünya tepetaklak oluyor... Dehşet verici bir çatırtı, kendi sesime çok benzeyen cılız bir çığlık duyuyorum, sonra her şey kararıyor."

 agot_faceless_interaction.0007.desc_fakeout:0 "Altımdaki sandalye hafifçe sallanıyor; ama raflara tutunarak kendimi dengelemeyi başarıyorum. Etrafıma bakınıyorum; birinin beni izliyormuş gibi ani bir huzursuzluk çarpıyor bana... Kaçırılmış bir fırsata razı olarak aşağı atlıyorum."

 agot_faceless_interaction.0007.a:0 "Bu gerçekten benim sonum mu?"

 agot_faceless_interaction.0007.a_fakeout:0 "Hiçbir hazine kırık bir boyuna değmez!"

 agot_faceless_interaction.0008.t:0 "Sur Yolu Boyunca"

 agot_faceless_interaction.0008.desc:0 "Alacakaranlıkta yürüyüş ender bir zevktir; hele de gergin bir günün sonunda. Kaledeki sur yolu da, sarayımdaki yağdanlıklardan ve dalkavuklardan kıskanılacak bir uzaklaşma sunar. Bu yürüyüşlerde düşüncelerimle baş başa kalmak için her türlü önlemi alırım; yukarıdan manzarayı izlerken kişisel muhafızlarımı bile geride bırakırım.\n\nSur yolunun tepesinde görevlerim küçülüp uzaklaşır — ve kendimi birazcık daha hafif hissederim. İki mazgal arasına yaslandığımda, kale duvarından yükselen rüzgârın beni karşılamak için geldiğini hissedebiliyorum... Neredeyse uçmak gibi hissettiriyor.\n\n"

 agot_faceless_interaction.0008.desc_faceless:0 "Bir an için duyguya kapılıyorum; yüzüme çarpan hava akımı, duyularımı dolduruyor. Neredeyse arkamda bir hareket duyduğuma yemin edebilirim; derken bedenim ansızın ağırlıksızlaşıyor. Artık neredeyse uçuyormuş gibi hissetmiyorum... Gerçekten #bold uçuyorum#! — daha doğrusu, aşağıdaki kaba yontulmuş avluya doğru düşüyorum. Nefesimi içime çekiyorum ama hava, ölümüme karşı bana hiçbir mühlet vermiyor."

 agot_faceless_interaction.0008.desc_fakeout:0 "Bir an için duyguya kapılsam da, hava akımı karşısında gözlerim yaşarmaya başlıyor ve kendimi geri çekiyorum. Bir adım geri attığımda, duyularımı ürkütücü bir his dolduruyor... Sanki biri beni izliyormuş gibi."

 agot_faceless_interaction.0008.a:0 "Ve ben özgürüm; serbest düşüşteyim."

 agot_faceless_interaction.0008.a_fakeout:0 "Belki yürüyüşlerimi yer seviyesinde yapmalıyım."

 agot_faceless_interaction.0009.t:0 "Yoksulun Köpeği"

 agot_faceless_interaction.0009.desc:0 "Çarşıya bir ziyaret, moralimi düzeltmenin her zaman kesin bir yoludur — hamalların telaşı, tüccarların koşuşturması; tüm bu curcuna beni heyecanlandırıyor! Düşününce, böylesi bir geçim düzeni benim iyi idareciliğimin sayesindedir.\n\nAma esnafın arasında daha az şanslı ruhlar da var; yalnızca kırıntılarla ve başkalarının küçük iyilikleriyle hayatta kalan zavallılar. Bu öğleden sonra, tam da böyle bir ruha rastlıyorum; kocaman #bold mastifi#! olmasa, görmezden gelmek kolay olurdu zaten.\n\nÖyle nadir bir tür ki — ve görünüşüne bakılırsa, iyi beslenmiş! Aslında sahibi bir deri bir kemikken, köpek tamamen kastan ibaret görünüyor. Yoksula yaklaşıyorum; bir parça bozukluk teklif edip onun yavrusunu köpek kulübelerimde daha iyi bir yaşama götürmeyi düşünüyorum.\n\n"

 agot_faceless_interaction.0009.desc_faceless:0 "Köpeğe yaklaşıyorum; gözleri beni karşılıyor, savunmamı düşürmem için beni uyutuyor. #italic Ne iyi bir çocuk,#! diye düşünüyorum; derken birden... Dilenci bana kocaman bir sırıtışla bakıyor ve azgın köpek, boynuma doğru hamle yapıyor. Tek bir ısırıkla boğazım boynumdan koparılıyor."

 agot_faceless_interaction.0009.desc_fakeout:0 "Köpeğe yaklaşıyorum; ihtiyatla elimi koklamasına izin veriyorum. Dilenci, razı olsun ya da olmasın arkadaşını alabileceğimi bilerek bana umutsuzca bakıyor."

 agot_faceless_interaction.0009.a:0 "#X *gurulda*#!"

 agot_faceless_interaction.0009.a_fakeout:0 "Hayatındaki tek neşesini nasıl alabilirim?"

 agot_faceless_interaction.0009.b:0 "Bu yeterli olmalı..."

 agot_faceless_decision.0001.t:0 "Yeni Bir Yüz Seçmek"

 agot_faceless_decision.0001.desc:0 "Yeni bir yüz seçip yeni bir hayata başlama zamanı. Kimin yüzünü takmayı seçersem seçeyim, kuşkusuz Çok Yüzlü Tanrı'ya iyi hizmet edecektir."

 agot_faceless_decision.0001.desc_face:0 "Yeni bir yüz seçme zamanı. Kimin yüzünü takmayı seçersem seçeyim, kuşkusuz Çok Yüzlü Tanrı'ya iyi hizmet edecektir."

 agot_faceless_decision.0001.victims:0 "Geçmişimde yeni bir yüz bulacağım."

 agot_faceless_decision.0001.hall:0 "Yüzler Salonu'nda ihtiyacım olan var."

 agot_faceless_decision.0001.cancel:0 "Belki başka bir zaman..."

 agot_faceless_decision.0001.cancel.tt:0 "Karar iptal edilecek."

 agot_faceless_decision.0002.t:0 "Tanıdık Yüzler"

 agot_faceless_decision.0002.desc:0 "Çok Yüzlü Tanrı'nın hizmetinde sona erdirdiğim nice hayatı düşünürken, daha fazla adanmışlık için bunlardan birinin layık bir yüz olup olmayacağını merak ediyorum."

 agot_faceless_decision.0002.desc_face:0 "Çok Yüzlü Tanrı'nın hizmetinde sona erdirdiğim nice hayatı düşünürken, bunlardan birinin yeni bir adanmışlık yaşamına layık olup olmayacağını merak ediyorum."

 agot_faceless_decision.0002.select:0 "Bu."

 agot_faceless_decision.0002.select.tt:0 "[THIS.Var('si_selected_character').Char.GetName] seçimini onaylaman istenecek."

 agot_faceless_decision.0002.back:0 "Belki başka bir yüz..."

 agot_faceless_decision.0002.cancel:0 "Biraz düşününce."

 agot_faceless_decision.0002.cancel.tt:0 "Karar iptal edilecek."

 agot_faceless_decision.0003.t:0 "Yüzler Salonu"

 agot_faceless_decision.0003.desc:0 "Korkunç tablolar gibi yüz sıraları bana bakıyor. Her yüz bir zamanlar bir hayattı; şimdi ölümde, her biri Çok Yüzlü Tanrı'ya hizmet ediyor."

 agot_faceless_decision.0003.face_1:0 "[face_1.GetName]"

 agot_faceless_decision.0003.face_2:0 "[face_2.GetName]"

 agot_faceless_decision.0003.face_3:0 "[face_3.GetName]"

 agot_faceless_decision.0003.face_4:0 "[face_4.GetName]"

 agot_faceless_decision.0003.face_5:0 "[face_5.GetName]"

 agot_faceless_decision.0003.random:0 "Herhangi bir yüz olur."

 agot_faceless_decision.0003.random.tt:0 "Rastgele bir karakter oluşturulacak."

 agot_faceless_decision.0003.back:0 "Belki başka bir yüz..."

 agot_faceless_decision.0003.cancel:0 "Bu kadarı yeter."

 agot_faceless_decision.0003.cancel.tt:0 "Karar iptal edilecek."

 agot_faceless_decision.0004.t:0 "Yüzler Salonu: [selected_face.GetNameNoTooltip]"

 agot_faceless_decision.0004.desc:0 "Yüzü elimde tutarken, yaşanmış hayatı — ve henüz yaşanacak hayatı — düşünüyorum."

 agot_faceless_decision.0004.confirm:0 "$VALAR_DOHAERIS$"

 agot_faceless_decision.0004.take_new_face.tt:0 "Yeni bir görünüme bürüneceksin, ama yine kendin kalacaksın."

 agot_faceless_decision.0004.take_new_character.tt:0 "Yeni bir kimliğe bürünüp bir maceracı olarak hayata başlayacaksın."

 agot_faceless_decision.0004.back:0 "Belki başka bir yüz..."

 agot_faceless_decision.0004.cancel:0 "Her şeye rağmen, benim hayatım henüz bitmedi."

 agot_faceless_decision.0004.cancel.tt:0 "Karar iptal edilecek."

 agot_faceless_decision.0005.t:0 "$agot_faceless_interaction.0002.t$"

 agot_faceless_decision.0005.desc:0 "Çok Yüzlü Tanrı'nın hizmetkârı olarak, ölümün hepimize #S geldiğini#! hatırlamak bazen zordur. Bir ibadet arkadaşı, bana bu gerçeği hatırlatmaya geldi."

 agot_faceless_decision.0005.a:0 "$VALAR_DOHAERIS$"

 agot_faceless_decision.0005.b:0 "Bugün değil!"

 faceless_will_become_landless_run.tt:0 "Mevcut tüm unvanlarından vazgeçip topraksız bir maceracı olacaksın."

 faceless_lose_hall_access.tt:0 "Artık Yüzler Salonu'na erişimin olmayacak."
