### TODO NOT-IN-ST: agot_faceless_interaction.0007.desc [AGOT: Time alone is hard to come by for a ruler, which is why I relish even the briefest moment after my councilors' departure to myself. Today, after much tedious discussion, I find myself basking in solitude in the council chamber — allowing my mind to wander where it will.\n\nAs I sit, enraptured in idle thought, I notice a glint from atop a nearby bookshelf. I take a second glance, and this time I can see clearly there is something gilded atop the bookshelf; some rare treasure, tucked away from sight and out of mind.\n\nI pick up my chair and move it to the edge of the bookshelf, hopping up and reaching for the top... but alas, whatever it is remains just out of reach. If only I could stretch #italic slightly#! further...\n\n]
 agot_faceless_interaction.0007.desc:0 "Time alone is hard to come by for a ruler, which is why I relish even the briefest moment after my councilors' departure to myself. Today, after much tedious discussion, I find myself basking in solitude in the council chamber — allowing my mind to wander where it will.\n\nAs I sit, enraptured in idle thought, I notice a glint from atop a nearby bookshelf. I take a second glance, and this time I can see clearly there is something gilded atop the bookshelf; some rare treasure, tucked away from sight and out of mind.\n\nI pick up my chair and move it to the edge of the bookshelf, hopping up and reaching for the top... but alas, whatever it is remains just out of reach. If only I could stretch #italic slightly#! further...\n\n"
