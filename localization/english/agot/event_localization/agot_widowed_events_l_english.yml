l_english:

 agot_widowed_events.0001.t:0 "Aşkın Tatlı Hatırası"

 agot_widowed_events.0001.desc:0 "Sevgili [dead_lover.GetFirstNameNicknamedNoTooltip], bu ölümlü dünyadan göçüp gitti. #italic [dead_lover.GetHerHim] ile bir gün daha geçirmek için neler vermezdim ki...#!\n\nSalonlarım bomboş geliyor — ama yine de burada oyalanmak zorundayım. Belki bu hüzün zamanla hafifler."

 agot_widowed_events.0001.a:0 "[dead_lover.GetHerHim] olmadan yoluma devam etmeliyim."

 agot_widowed_events.0002.t:0 "Aşkın Acı Sancısı"

 agot_widowed_events.0002.desc:0 "Sevgili [widowed_memory.GetFirstNameNicknamedNoTooltip]'in hâlâ bu dünyada yürüdüğü günler dün gibi; her zaman [widowed_memory.Custom('quirk_pos_adjective')], [widowed_memory.Custom('quirk_pos_pp')] ve beni [widowed_memory.GetHerHis] dokunuşuna hasret bırakarak. Keşke [widowed_memory.GetHerHim] ile bir gün daha geçirebilseydim...\n\nKederimin hüzünlü derinliklerinde yüzerek yapayalnız ayakta durduğumu fark ettiğimde düşüncelerim yarıda kesiliyor."

 agot_widowed_events.0002.a:0 "Hayatımda geriye kalan tek şey bu mu?"

 agot_widowed_events.0003.t:0 "Bir Bedel Karşılığında Aşk"

 agot_widowed_events.0003.desc:0 "Bu dünyada hiçbir şey [widowed_memory.GetFirstNameNicknamedPossessiveNoTooltip] [widowed_memory.Custom('quirk_pos_noun')]'in yerini tutamaz... #italic ya da öyle sanmıştım.#!\n\nGeç saatlere dek [location.GetName]'in daha çirkin semtlerinde dolaşmam, beni aşkın bulunabildiği, #bold bir bedel karşılığında#! bir mekâna götürüyor. [succubus.GetFirstName] beni [succubus.Custom('quirk_pos_adjective')] bir sırıtışla karşılıyor ve göğsümde, sevgili [widowed_memory.GetFirstNameNicknamedPossessiveNoTooltip]'in ölümünden beri hissetmediğim bir kalp atışı duyuyorum."

 agot_widowed_events.0003.a:0 "Para, bir [succubus.GetWomanMan]'in dokunuşu için kesinlikle değer."

 agot_widowed_events.0003.b:0 "Hayır, bu doğru değil..."

 agot_widowed_events.0004.t:0 "Aşk Bir Aptallıktır"

 agot_widowed_events.0004.desc:0 "Zaman geçti, ama sevgili [widowed_memory.GetFirstNameNicknamedNoTooltip]'i düşündüğümde hâlâ bir sızı hissediyorum. #italic Bu acı ne zaman dinecek?#!\n\n#bold Hayır.#! Bu saçmalık. Aşk, çabalarımın bir israfı ve ona zamanımın bir dakikasını daha vermeyeceğim."

 agot_widowed_events.0004.a:0 "Artık hiçbir şey hissetmiyorum."

 agot_widowed_events.0004.b:0 "Hayır, bu doğru değil..."

 agot_widowed_events.0005.t:0 "Bir Aşk... Okumaya Dair"

 agot_widowed_events.0005.desc:0 "Zaman geçti, ama sevgili [widowed_memory.GetFirstNameNicknamedNoTooltip]'i düşündüğümde hâlâ bir sızı hissediyorum. #italic Bu aşkı nasıl geride bırakabilirim?#!\n\nKendi düşüncelerimle boğuşurken taht odama, sarayımın bilgili bir üyesi olan [learned_courtier.GetFirstNameNicknamed] giriyor. [learned_courtier.GetSheHe|U], [learned_courtier.Custom('quirk_pos_adverb')] bir bakışla beni süzüyor, sonra şöyle diyor: "My [ROOT.Char.GetLadyLord|l], bilirsiniz ki kırık bir kalbin tek gerçek ilacı... #bold öğrenmektir#!"\n\n[learned_courtier.GetFirstNameNoTooltip]'i kuşkuyla süzüyorum, ama belki [learned_courtier.GetSheHe] haklıdır? Kendimi çalışmalarıma adamalı mıyım?"

 agot_widowed_events.0005.a:0 "Mecburum!"

 agot_widowed_events.0005.b:0 "Kitaplar zayıflar içindir."

 agot_widowed_events.0005.maester.tt:0 "Üstat olmak için tüm dünyevi varlıklarından vazgeçersin."

 agot_widowed_events.0006.t:0 "Bir Aşk... İçkiye Dair"

 agot_widowed_events.0006.desc:0 "Bu dünyada hiçbir şey [widowed_memory.GetFirstNameNicknamedPossessiveNoTooltip] [widowed_memory.Custom('quirk_pos_noun')]'in yerini tutamaz... #italic ya da öyle sanmıştım.#!\n\nGeç saatlere dek [location.GetName]'in daha çirkin semtlerinde dolaşmam, beni [party_friend.GetFirstName] ile birlikte canlı bir meyhaneye götürüyor. "My [ROOT.Char.GetLadyLord|l], size nasıl iyi vakit geçirileceğini — #bold ve tüm hüznünüzün nasıl unutulacağını#! göstereceğim," diye ilan ediyor [party_friend.GetSheHe].\n\nÇevremdeki günahların sesleri duyularımı kaplıyor. Bir yudum alıp kalabalığı selamlamak için kadehimi kaldırıyorum."

 agot_widowed_events.0006.a:0 "Bu, ... #bold unutulacak#! bir gece olacak!"

 agot_widowed_events.0006.a.tt:0 "Sefahatinizin sonuçları olabilir."

 agot_widowed_events.0006.b:0 "[widowed_memory.GetFirstName]'e, sevgilime bir kadeh kaldırıyorum!"

 agot_widowed_events.0007.t:0 "Bir Aşk... Bahçeciliğe Dair"

 agot_widowed_events.0007.desc:0 "Zaman geçti, ama sevgili [widowed_memory.GetFirstNameNicknamedNoTooltip]'i düşündüğümde hâlâ bir sızı hissediyorum. #italic Bu aşkı nasıl geride bırakabilirim?#!\n\nYeni kazandığım boş zamanımın çoğunu açık havada geçirdim, doğayı yoldaşım ettim. Belki aşkımın onuruna, büyüyecek bir ağaç dikerim?"

 agot_widowed_events.0007.a:0 "Aşkımızın bir anıtı olarak ayakta kalacak."

 agot_widowed_events.0007.b:0 "Bunların hepsi saçmalık..."

 agot_widowed_events.0008.t:0 "Yeni Bir Aşk: Bir Yavru Köpek"

 agot_widowed_events.0008.desc:0 "Bu dünyada hiçbir şey [widowed_memory.GetFirstNameNicknamedPossessiveNoTooltip] [widowed_memory.Custom('quirk_pos_noun')]'in yerini tutamaz... #italic ya da öyle sanmıştım.#!\n\n[ROOT.Char.Custom2('RelationToMeShort', pet_giver)]'im [pet_giver.GetFirstName], elinde ensesinden tuttuğu bir yavruyla yanıma geliyor. "My [ROOT.Char.GetLadyLord|l], bu küçük yavru, hissettiğiniz hüznün birebir ilacıdır," diyor [pet_giver.GetFirstNameNoTooltip]. "Ona bir yuva verir misiniz?""

 agot_widowed_events.0008.a:0 "Yeni bir evcil hayvan hayatımdaki boşluğu doldurabilir..."

 agot_widowed_events.0008.b:0 "Ben daha çok kedici biriyim."

 agot_widowed_events.0009.t:0 "Yeni Bir Aşk: Bir Yavru Kedi"

 agot_widowed_events.0009.desc:0 "Bu dünyada hiçbir şey [widowed_memory.GetFirstNameNicknamedPossessiveNoTooltip] [widowed_memory.Custom('quirk_pos_noun')]'in yerini tutamaz... #italic ya da öyle sanmıştım.#!\n\n[ROOT.Char.Custom2('RelationToMeShort', pet_giver)]'im [pet_giver.GetFirstName], elinde ensesinden tuttuğu bir yavruyla yanıma geliyor. "My [ROOT.Char.GetLadyLord|l], bu küçük kedi, hissettiğiniz hüznün birebir ilacıdır," diyor [pet_giver.GetFirstNameNoTooltip]. "Ona bir yuva verir misiniz?""

 agot_widowed_events.0009.a:0 "Yeni bir evcil hayvan hayatımdaki boşluğu doldurabilir..."

 agot_widowed_events.0009.b:0 "Ben daha çok köpekçi biriyim."

 agot_widowed_events.0010.t:0 "Donmuş Aşk"

 agot_widowed_events.0010.desc:0 "Sevgili [widowed_memory.GetFirstNameNicknamedNoTooltip]'in hâlâ bu dünyada yürüdüğü günler dün gibi; her zaman [widowed_memory.Custom('quirk_pos_adjective')], [widowed_memory.Custom('quirk_pos_pp')] ve beni [widowed_memory.GetHerHis] dokunuşuna hasret bırakarak. Keşke [widowed_memory.GetHerHim] ile bir gün daha geçirebilseydim...\n\nZaman ilerlese de, bir daha asla evleneceğimi sanmıyorum."

 agot_widowed_events.0010.a:0 "[widowed_memory.GetHerHim]'i hep yanımda taşıyacağım."

 agot_widowed_events.0010.b:0 "Belki de sadece daha fazla zamana ihtiyacım var."
