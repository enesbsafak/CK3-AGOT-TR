l_english:

 agot_scenario_rr_toj.0001.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0001.desc:0 "Lyanna hâlâ Dorne'un dağlarında, Neşe Kulesi denen o yerde tutuluyor. O bir tutsak olduğu sürece bu çatışma asla gerçekten sona eremez. Rhaegar onu korumasız bırakmış olamaz ve hâlâ hesabı sorulmayan birkaç Kral Muhafızı var. Onu kurtarmak kolay olmayacak."

 agot_scenario_rr_toj.0001.a:0 "Bu iş yapılmalı. Bana katılacak cesareti kimde?"

 agot_scenario_rr_toj_1_tooltip:0 "Sana eşlik edecek bir yoldaş topluluğu toplayacaksın."

 agot_scenario_rr_toj.0002.desc:0 "[agot_toj_chain_leader.GetFirstNameNoTooltip] beni, Rhaegar Targaryen'in tutsağı Lyanna Stark'ı kurtarmak için [agot_toj_chain_leader.GetHerHim] ile birlikte Neşe Kulesi'ne yapacağı yolculuğa katılmaya çağırıyor. Tehlike büyük olacak, ama onurum geri adım atmama izin vermiyor."

 agot_scenario_rr_toj.0002.a:0 "Bundan yüz çeviremem. [agot_toj_chain_leader.GetFirstNameNoTooltip]'un yanındayım!"

 agot_scenario_rr_toj.0002.b:0 "Başka görevlerim var. Katılmayacağım."

 agot_scenario_rr_toj.0003.desc:0 "Grup üzerinde göz gezdirirken yüreğimde umut uyanıyor. Daha cesur, daha sadık yoldaşlar dileyemezdim. Hayatımıza mal olsa da Lyanna'yı güvenliğe kavuşturacağız!"

 agot_scenario_rr_toj.0003.a:0 "Hadi gidelim! Vakit kaybetmeyelim."

 AGOT_TOJ_COMPANION_JOINED:0 "[temp_companion.GetFirstName] sana katıldı!"

 agot_scenario_rr_toj.0004.desc_trident.a:0 "Harap kule, kan kırmızısı Dorniş dağlarının önünde yükseliyor; Targaryen zalimliğinin ve kibrinin bir abidesi. Üç beyaz pelerinli figür bizi bekliyor — Aerys'in Kral Muhafızı şövalyeleri, mineli zırhları öğleden sonranın parlaklığında ışıldıyor. Bunlar Ser Gerold Hightower, Ak Boğa, bu andlı kardeşlerin Muhafız Kumandanı; Ser Arthur Dayne, Sabahın Kılıcı, diyarın en usta kılıç ustası ve en usta kılıcın sahibi; ve Ser Oswell Whent, kara mizahlı ama görevine sadık ve dürüst.\n\nAdamlarım yanımda duruyor — hepsi hayalet, zira böylesine metin hasımları kim yenebilmeyi umabilir? \n"Seni [trident_battle.GetNameNoTooltip]'te aradım." \n\n"Orada değildik," diye karşılık verdi Ak Boğa. \nKılıcımı çekmiş halde öne adım atarken, \n\nArthur Dayne, Dawn'ı kınından çıkarırken "Ve şimdi başlıyor," diyor. Işık soluk kılıcının üzerinde dans ediyor."

 agot_scenario_rr_toj.0004.desc.a:0 "Harap kule, kan kırmızısı Dorniş dağlarının önünde yükseliyor; Targaryen zalimliğinin ve kibrinin bir abidesi. Üç beyaz pelerinli figür bizi bekliyor — Aerys'in Kral Muhafızı şövalyeleri, mineli zırhları öğleden sonranın parlaklığında ışıldıyor. Bunlar Ser Gerold Hightower, Ak Boğa, bu andlı kardeşlerin Muhafız Kumandanı; Ser Arthur Dayne, Sabahın Kılıcı, diyarın en usta kılıç ustası ve en usta kılıcın sahibi; ve Ser Oswell Whent, kara mizahlı ama görevine sadık ve dürüst.\n\nAdamlarım yanımda duruyor — hepsi hayalet, zira böylesine metin hasımları kim yenebilmeyi umabilir? — ve kılıcımı çekmiş halde öne adım atıyorum.\n\n"Ve şimdi başlıyor," diyor Arthur Dayne, Dawn'ı kınından çıkarırken. Işık soluk kılıcının üzerinde dans ediyor."

 agot_scenario_rr_toj.0004.desc.b:0 "Harap kule, kan kırmızısı Dorniş dağlarının önünde yükseliyor; Targaryen zalimliğinin ve kibrinin bir abidesi. Üç beyaz pelerinli figür bizi bekliyor — Aerys'in Kral Muhafızı şövalyeleri, mineli zırhları öğleden sonranın parlaklığında ışıldıyor. Bunlar Ser Gerold Hightower, Ak Boğa, bu andlı kardeşlerin Muhafız Kumandanı; Ser Arthur Dayne, Sabahın Kılıcı, diyarın en usta kılıç ustası; ve Ser Oswell Whent, kara mizahlı ama görevine sadık ve dürüst.\n\nAdamlarım yanımda duruyor — hepsi hayalet, zira böylesine metin hasımları kim yenebilmeyi umabilir? — ve kılıcımı çekmiş halde öne adım atıyorum.\n\n"Dur," diyor Ak Boğa. Kılıcı hâlâ kınında. "Yolunuzu kesmeyeceğiz. Diyar yeterince kan döktü. Artık katliama iştahım yok.""

 agot_scenario_rr_toj.0004.desc.c:0 "YER TUTUCU"

 agot_scenario_rr_toj.0004.a.1:0 ""Hayır," diyorum, sesimde hüzün. "Şimdi sona eriyor.""

 agot_scenario_rr_toj.0004.a.tt:0 "Çelik çeliğe çarpıyor. Hepsinin üstünde Lyanna'nın sesi yankılanıyor: \"Eddard!""

 agot_scenario_rr_toj.0004.a.2:0 "Tanrılar merhametlidir."

 agot_scenario_rr_toj.9004.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.9004.desc:0 "[agot_toj_chain_leader.GetTitledFirstName] ile birlikte duruyor, Aerys'in Kral Muhafızı şövalyelerine bakıyorum; zırhları ılık öğleden sonra güneşinde parlıyor. Bunlar Ak Boğa Ser Gerold Hightower, Ser Oswell Whent ve diyarın en usta kılıç ustası Sabahın Kılıcı Ser Arthur Dayne. Korudukları harap kule arkalarında heybetle yükseliyor.\n\nBana eşlik eden adamların yüzlerine bakınca korku ve endişe görüyorum. Ben de aynı şekilde hissediyorum, zira böylesine ünlü savaşçıları kim yenebilmeyi umabilir?\n\n[agot_toj_chain_leader.GetTitledFirstNameNoTooltip], kılıcı çekik vaziyette öne adım atıyor. "Dur," diyor Ak Boğa, efendimin hareketini durdurarak. "Yolunuzu kesmeyeceğiz. Diyar yeterince kan döktü. Artık katliama iştahım yok." Kılıcı kınında kalıyor."

 agot_scenario_rr_toj.9004.a:0 "Ne bulacak?"

 agot_scenario_rr_toj.0005.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0005.desc:0 "Bir anda zaman durmuş gibi oldu; adamlarımın korkusu yatıştı ve savaşa doğru atıldılar. Zafere ya da bozguna. Çarpışan kılıçların ve kırılan kalkanların sesi havada ağırlaşıyor, yere düşen bir askerin sağır eden gümbürtüsü araya giriyor. Kılıçlar, geriye yalnızca sessizlik kalana dek dans etti.\n\nYere özensizce serilmiş halde Aerys'in Kral Muhafızlarının cansız cesetleri yatıyor, kanları altlarındaki kumtaşını lekeliyor; sadık yoldaşlarımın çoğu da onlarla aynı akıbete ortak olmuş.\n\n[surviving_companion.GetFirstName] kılıcını Sabahın Kılıcı'nın boynundan çekip, hâlâ sıcak olan kanı çeliğin üzerinden siliyor."

 agot_scenario_rr_toj.0005.tooltip:0 "[surviving_companion.GetFirstName] dışında bütün yoldaşların can verdi."

 agot_scenario_rr_toj.0005.a:0 "Hayatta kaldık."

 agot_scenario_rr_toj.9005.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.9005.desc:0 "[agot_toj_chain_leader.GetTitledFirstName]'in arkasında duruyor, Aerys'in Kral Muhafızı şövalyeleriyle yüz yüzeyim. Zırhları parlak parlıyor, arkalarında yükselen harap kuleyle zıtlık oluşturuyor. Ser Arthur Dayne büyük kılıcı Dawn'ı kınından çıkarıyor. "Ve şimdi başlıyor," diyor. [agot_toj_chain_leader.GetTitledFirstNameNoTooltip] hüzünle karşılık vererek öne adım atıyor: "Hayır, şimdi sona eriyor."\n\nBir anda yoldaşlarım ve ben savaşa atılıyoruz; kazansak da kaybetsek de davamız haklı. Hava kırılan kalkanların ve çarpışan kılıçların sesiyle doluyor, çeliğin dansı sağır eden bir sessizlikle ansızın sona eriyor.\n\nDizlerimin üzerine düşüyorum, acı hızla bedenimi sarıyor. Etrafıma bakınca yoldaşlarımın cansız cesetlerini görüyorum. Sert ayak sesleri duyuyorum, beyaz zırhları gözlerimi kamaştırıyor. Görüşümü karartan daralan karanlıkla umutsuzca savaşmaya çalışıyorum."

 agot_scenario_rr_toj.9005.a:0 "Başarısız oldum..."

 agot_scenario_rr_toj.0006.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0006.desc:0 "Bir anda zaman durmuş gibi oldu; adamlarım hâlâ korkulu ve endişeli bir halde savaşa ilerliyor. Zafere ya da bozguna. Kızıl dağlarda çeliğin çeliğe çarpan sağır eden sesi yankılanıyor. Kalkanlar parçalanıyor, zırhlar yere çarpıyor.\n\nÇevremde sadık yoldaşlarım düşüyor, Aerys'in andlı kılıçları tarafından acımasızca biçiliyorlar. Kılıcıma tutuşum sıkılaşıyor, azmim keskinleşiyor. Yenmeyi umamayacağım bir düşmanla yüz yüzeyim.\n\nSert kumtaşının üzerine serilmiş halde yatıyorum, acı tüm varlığımı sarıyor. Aklım gezinip duruyor: 'Kuzey ne olacak şimdi? Bildik karlar, Winterfell'in sıcak ve huzurlu salonları — bir daha asla göremeyeceğim manzaralar. Ah Lyanna, seni kurtaramadım.'"

 agot_scenario_rr_toj.0006.tooltip:0 "Bütün yoldaşların can verdi."

 agot_scenario_rr_toj.0006.a:0 "Üzgünüm Lyanna, seni yüzüstü bıraktım..."

 agot_scenario_rr_toj.9006.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.9006.desc:0 "[agot_toj_chain_leader.GetTitledFirstName]'in arkasında duruyor, Aerys'in Kral Muhafızı şövalyeleriyle yüz yüzeyim. Zırhları parlak parlıyor, arkalarında yükselen harap kuleyle zıtlık oluşturuyor. Ser Arthur Dayne büyük kılıcı Dawn'ı kınından çıkarıyor, güneş ışığı kılıcının üzerinde oynuyor. "Ve şimdi başlıyor," diyor. [agot_toj_chain_leader.GetTitledFirstNameNoTooltip] hüzünle karşılık vererek öne adım atıyor: "Hayır, şimdi sona eriyor."\n\nBir anda havadaki tüm gerginlik artıyor. Yoldaşlarım ve ben, efendimizi zafere ya da bozguna izleyerek savaşa atılıyoruz. Kısa süre sonra duyulan tek ses, çarpışan kılıçlar ve parçalanan kalkanlar oluyor. Çeliğin dansı ansızın duruyor, sağır eden bir sessizliğe bırakıyor yerini.\n\nKılıcımı öldürdüğüm bir düşmanın boynundan çekiyorum; beyaz zırhları, altlarında biriken kanla lekelenmiş. Etrafıma şöyle bir bakınca bu çetin savaştan yalnızca [agot_toj_chain_leader.GetTitledFirstNameNoTooltip]'in sağ çıktığını görüyorum."

 agot_scenario_rr_toj.9006.a:0 "Hayatta kaldık."

 agot_scenario_rr_toj.0007.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0007.desc:0 "Kral Muhafızı'nın üç şövalyesi ölü yatıyor, kızıl lekeler pelerinlerini kanlı gözyaşı izleri gibi kirletiyor. Sadakatlerinin hizmet ettikleri canavara bu kadar boşa harcanması ayıp. Onlar için taş yığınları dikeceğiz, ama şimdi değil. Lyanna bekleyemez."

 agot_scenario_rr_toj.0007.a:0 "Geliyoruz, Lyanna!"

 agot_scenario_rr_toj.0008.desc.a:0 "Robert'ın İsyanı bastırıldı ve bu anlamsız savaş nihayet sona erdi, ama ben rahat edemiyorum. Lyanna, onu bıraktığım yerde, çatışmalardan uzakta, Dorne'un güneyinde bekliyor. Yanına gitmeli ve iyi olduğunu görmeliyim. Kehanetlerin gerçekleşip gerçekleşmediğini görmeliyim."

 agot_scenario_rr_toj.0008.desc.b:0 "Robert'ın İsyanı bastırıldı ve bu anlamsız savaş nihayet sona erdi, ama ben rahat edemiyorum. Efendim Rhaegar öldü, ama tanrılar izin verirse sevgilisi Lyanna hâlâ yaşıyor. Dorne'a, Neşe Kulesi'ne gitmeli ve onu geri getirmeliyim. Böyle kara haberler taşımaktan korkuyorum, ama Rhaegar'a duyduğum sevgi için bu yapılmalı."

 agot_scenario_rr_toj.0008.a:0 "Güneye, Kızıl Dağlar'a yolculuk ediyorum. Neşe Kulesi'ne."

 agot_scenario_rr_toj.0009.desc.a:0 "Neşe Kulesi, Kızıl Dağlar arasında yükseliyor; ıssız bir coğrafyanın ortasında bir umut simgesi. Diyar derin yaralar aldı, ama bu savaş, geleceğinden korktuğum şeyle kıyaslandığında önemsiz bir çatışmadan ibaret. Yine de Lyanna'da umut var. Çocuğumuzda, gelmekte olan buza karşı yanacak bir ateş var."

 agot_scenario_rr_toj.0009.desc.b:0 "Neşe Kulesi, Kızıl Dağlar arasında yükseliyor; kanlı bir coğrafyanın ortasında bir aşk simgesi. Efendim Rhaegar sevgilisi Lyanna'yı savaşın yıkımından uzakta, güven içinde burada bıraktı ve şimdi ona ölümünün kara haberini götürmek bana düşüyor."

 agot_scenario_rr_toj.0009.a:0 "Lyanna bekliyor."

 agot_scenario_rr_toj.0010.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0010.desc.a:0 "Lyanna'nın çığlıkları beni merdivenlerden yukarı taşıyor, acısı ruhumda bir mahmuz. Tepesine ulaşıp kan ve gül kokan bir odaya giriyorum. Her yerde kan var — bacaklarının arasında, yatakta, yerde — ve bir çocuk var. Kızarmış yüzlü, ağlayan, canlı bir bebek. Lyanna bana gülümsüyor. Yaşayacak.\n\nAma çocukla ne yapmalı? "Söz ver bana, [ROOT.Char.GetFirstNameNicknamedNoTooltip]," diyor."

 agot_scenario_rr_toj.0010.desc.b:0 "Lyanna'nın çığlıkları beni merdivenlerden yukarı taşıyor, acısı ruhumda bir mahmuz. Tepesine ulaşıp kan ve gül kokan bir odaya giriyorum. Her yerde kan var — bacaklarının arasında, yatakta, yerde — ve bir çocuk var. Kızarmış yüzlü, ağlayan, canlı bir bebek.\n\nLyanna ise solgun. Çığlık atacak gücü tükenmiş, yapabildiği tek şey fısıldamak. Yanına gidiyorum, kulağımı dudaklarına yaklaştırıyorum, elini avuçlarımın arasına alıyorum.\n\n"Söz ver bana, [ROOT.Char.GetFirstNameNicknamedNoTooltip]," diyor."

 agot_scenario_rr_toj.0010.desc.c:0 "Lyanna'nın çığlıkları beni merdivenlerden yukarı taşıyor, acısı ruhumda bir mahmuz. Tepesine ulaşıp kan ve gül kokan bir odaya giriyorum. Her yerde kan var — bacaklarının arasında, yatakta, yerde — ve bir çocuk var. Tanrı yardımcım olsun, kollarında bir çocuk var ve o ölmüş.\n\nBirlikte ağlıyoruz, Lyanna ve ben, verecek gözyaşımız kalmayana dek, sonra gözyaşsız ağlıyoruz. Nazikçe ölü bebeği kollarından alıp bir kumaşa sarıyorum.\n\nBu kadar derin bir acıya sözcük yok."

 agot_scenario_rr_toj.0010.desc.d:0 "Lyanna'nın çığlıkları beni merdivenlerden yukarı taşıyor, acısı ruhumda bir mahmuz. Tepesine ulaşıp kan ve gül kokan bir odaya giriyorum. Her yerde kan var — bacaklarının arasında, yatakta, yerde — ve bir çocuk var. Tanrı yardımcım olsun, kollarında bir çocuk var ve o ölmüş.\n\nNazikçe ölü bebeği kollarından alıp bir kumaşa sarıyorum. Lyanna elimi kavrıyor, ben de onu kollarıma alıyorum. Hiçbir şey demiyor, ama gücünün tükendiğini hissediyorum. Yaşam onu terk ederken avucunu açıyor ve avucundan gül yaprakları kayıyor; solmuş ve kararmış."

 agot_scenario_rr_toj.0010.desc.e:0 "\nLyanna'nın çocuğuna uygun bir aile bulmak için yoldaşlarıma bakıyorum."

 agot_scenario_rr_toj.0010.a:0 "Söz veriyorum, Lyanna. Çocukla ilgileneceğim ve [baby_snow.GetHerHis] kimliğini gizli tutacağım."

 agot_scenario_rr_toj.0010.b:0 "Söz veriyorum, Lyanna. Çocukla ilgileneceğim, ama [baby_snow.GetHerHis] kimden olduğu bilinmeli."

 agot_scenario_rr_toj.0010.c:0 "Söz veriyorum, Lyanna. Çocuğun güvende olacak, ama bunun tek yolu yoldaşlarımdan birinin [baby_snow.GetHerHim] evlat edinmesi."

 agot_scenario_rr_toj.0010.d:0 "Gel, Lyanna. Eve dönmeliyiz."

 agot_scenario_rr_toj.0016.desc.a:0 "Merdivenlerden çıkarken yüreğim ağır. Tepesine ulaşıp gül kokan bir odaya giriyorum. Lyanna yatakta yatıyor, kolları şişkin karnını sarmış. Hamile.\n\nNefesimi tutmuş bir an sadece bakakalıyorum. Lyanna bakışlarıma karşılık veriyor, buz grisi gözlerinde vahşi bir meydan okuma yanıyor.\n\n"Babası kim?" diye soruyorum.\n\n"Rhaegar Targaryen. Sevgili prensim.""

 agot_scenario_rr_toj.0016.desc.b:0 "Merdivenlerden çıkarken yüreğim ağır. Tepesine ulaşıp gül kokan bir odaya giriyorum. Lyanna bir pencerenin önünde duruyor, kahverengi saçları rüzgârda dalgalanıyor. Bana dönüyor ve bu dağlarda aylarca gizlenmiş olmasına rağmen buz grisi gözlerinde öyle bir yaşam var ki nefesim boğazımda düğümleniyor.\n\n"Benim için geleceğini biliyordum," diyor."

 agot_scenario_rr_toj.0016.desc.c:0 "Merdivenlerden çıkarken yüreğim heyecanlı. Tepesine ulaşıp gül kokan bir odaya giriyorum. Lyanna'm yatakta yatıyor, kolları şişkin karnını sarmış. #italic Çocuğumuz #!. Gülüşü onda iyi olan her şey — vahşilik, gurur, zekâ ve güzellik. Onda ve Lyanna'nın rahminde bu Yedi Krallık ve tüm dünya için hâlâ umut var. Onda buz ve ateşin şarkısı yatıyor."

 agot_scenario_rr_toj.0016.desc.d:0 "Merdivenlerden çıkarken yüreğim heyecanlı. Tepesine ulaşıp gül kokan bir odaya giriyorum. Lyanna bir pencerenin önünde duruyor, kahverengi saçları rüzgârda dalgalanıyor. Bana dönüyor ve bu dağlarda aylarca gizlenmiş olmasına rağmen buz grisi gözlerinde öyle bir yaşam var ki nefesim boğazımda düğümleniyor.\n\n"Savaş kazanıldı mı?" diye soruyor. Burada geçirdiği zaman onu sabırsızlandırmış.\n\n"Kazanıldı," diye karşılık veriyorum. "Çocuk yok mu?"\n\n"Henüz yok, prensim. Ama daha vakit var.""

 agot_scenario_rr_toj.0016.a:0 "Bu kule sana yeterince ev sahipliği yaptı. Hadi eve gidelim."

 agot_scenario_rr_toj.0016.b:0 "Bunu öğrenen olursa diyar yeniden kan döker."

 SCENARIO_RR_PREGNANCY_TRUTH_REVEALED_NO:0 "Çocuğun gerçek soyu hakkında yalan söyleyecek ve bunu gizli tutacaksın."

 agot_scenario_rr_toj.0016.c:0 "En azından Robert gerçeği bilmeyi hak ediyor."

 SCENARIO_RR_PREGNANCY_TRUTH_REVEALED_TO_ROBERT:0 "Çocuğun gerçek soyu hakkında herkese yalan söyleyecek ama Robert'a gerçeği söyleyeceksin."

 agot_scenario_rr_toj.0016.d:0 "Bunu gizleyemeyiz."

 SCENARIO_RR_PREGNANCY_TRUTH_REVEALED_TO_EVERYONE:0 "Çocuğun gerçek soyu hakkında yalan söylemeyecek ve diyara Rhaegar'ın gelecek çocuğundan bahsedeceksin."

 agot_scenario_rr_toj.0016.e:0 "Evlenelim Lyanna, bu sıkıntılı günleri geride bırakalım."

 agot_scenario_rr_toj.0011.desc:0 "Lyanna ile Rhaegar'ın çocuğuna bakılmasını sağlayacağıma söz verdim, ama [baby_snow.GetHerHis] ebeveyni olmaya en uygun kim? Yoldaşlarıma tamamen güveniyorum, ama çocuğu kendim evlat edinip [baby_snow.GetHerHim] kendi evladım gibi büyütmek daha uygun olmaz mı?"

 agot_scenario_rr_toj.0011.a:0 "Sorumluluk bana ait. Çocukla kendim ilgileneceğim."

 agot_scenario_rr_toj.0011.b:0 "Bu sorumluluğu [si_selected_character.GetFirstNameNicknamedNoTooltip]'e emanet ediyorum."

 agot_scenario_rr_toj.0012.desc:0 "Çocuğun evlat edinilip bakılmasını sağlayacağıma söz verdim, ama ya Robert? Nişanlısının Prens Rhaegar'a bir çocuk doğurduğunu bilmek isterdi, ama böyle bir bilgiye hakkı var mı? Targaryenlere olan nefreti de Lyanna'ya olan sevgisi de tartışılmaz, ama çocuğun bunlardan hangisini miras alacağını bilemem. Her iki halde de çocuk, Demir Taht'ta oturan kim olursa olsun her zaman bir tehdit oluşturacak."

 agot_scenario_rr_toj.0012.a:0 "Robert'a söylemek [baby_snow.GetHerHim] tehlikeye atar. Sır saklanmalı."

 agot_scenario_rr_toj.0012.b:0 "Robert, her şeyden çok Lyanna'yı sevdi. Onun çocuğunu bilmeyi hak ediyor."

 agot_scenario_rr_toj.0013.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0013.desc:0 "Çocuğu kollarıma alıyorum. [baby_snow.GetSheHe] şaşırtıcı derecede sakin; [baby_snow.GetHerHis] doğumuyla sonuçlanan tüm o kaos ve kan gölünün farkında değil. Bu da adil. Çocuk bu savaş hakkında ne kadar az şey bilirse, taşıması gereken yük o kadar hafif olur.\n\nÇocuğun bakımını ayarladım ve [baby_snow.GetHerHis] soyu hakkında ne yapılacağına karar verdim, ama [baby_snow.GetHerHim] vermem gereken bir şey daha var."

 agot_scenario_rr_toj.0013.a:0 "Çocuğun bir isme ihtiyacı var."

 agot_scenario_rr_toj.0014.t:0 "Şafağın Tonları"

 agot_scenario_rr_toj.0014.desc:0 "İçinde bulduklarımla hayatım sonsuza dek değişmiş olarak kuleden uzaklaşıyorum. Yine de eve dönmekte özgür değilim. Verilecek daha kararlar, yapılacak daha işler var.\n\nKral Muhafızı'nın üç şövalyesinin cesetleri, bıraktığımız yerde hâlâ yatıyor; canları Dorne'un kızıl toprağıyla karışmış. Düşmandık, ama onurlu adamlardı; kargalara yem olmaktan daha iyi bir kaderi hak ediyorlardı. Onlar için kulenin taşlarıyla taş yığınları dikiyoruz. Yapabileceğimizin en iyisi bu.\n\nİşimiz nihayet bitince Ser Arthur Dayne'ın taş yığınının yanına oturuyorum ve büyük şövalyenin kılıcını kucağıma yatırıyorum. Adı Dawn. Kimileri tüm Westeros'taki en paha biçilmez kılıç der. En güzeli olduğunu kimse inkâr edemez. Binlerce yıldır Dayne soyundan, hanenin başına değil, yalnızca buna en layık kılıç ustalarına miras kalmış. Ser Arthur bunun Yıldızdüşüşü'ne geri verilip bir sonraki Sabahın Kılıcı'na bahşedilmesini isterdi."

 agot_scenario_rr_toj.0014.a:0 "Öyle de olacak."

 agot_scenario_rr_toj.0014.b:0 "Bu gelenek şimdi sona eriyor. Dawn benim."

 agot_scenario_rr_toj.0015.t:0 "Şafağın Tonları"

 agot_scenario_rr_toj.0015.desc:0 "Yıldızdüşüşü'ne yolculuk çetin ama zorunlu. Kızıl Dağlar'ın en batısında, Torentine nehrinin bir adasında konumlanan kale kadim ve sağlam. Kapıları bana ardına kadar açılıyor, ama beni karşılamak için hiçbir asker kıtası çıkmıyor. Onun yerine yalnızca tek bir kadın var.\n\nEvi Dayne'in renklerine uygun, koyu mor bir elbise giyiyor; ama gözlerinin menekşesi daha da canlı. Bu, Sabahın Kılıcı'nın kız kardeşi Ashara olmalı. Ellerimde Dawn'ı görüyor, bu kılıcı Yıldızdüşüşü'ne taşımamın ne anlama geldiğini anlıyor; yine de aklını kurcalayan soruyu soruyor.\n\n"Kardeşim?"\n\nSadece başımı sallayıp ona kılıcı uzatabiliyorum. Dawn'ı eline alınca cesur görüntüsü çatlıyor, uzun süredir tuttuğu gözyaşları nihayet boşalıyor. Bu kadının ayaklarına bir trajedi daha yığmamak için çok şey verirdim, ama başka yol yoktu."

 agot_scenario_rr_toj.0015.a:0 "İş tamamlandı."

 agot_scenario_rr_toj.0017.t:0 "Neşe Kulesi'nden Haber"

 agot_scenario_rr_toj.0017.desc.a:0 "Yüksek bir kulenin yalnızlığında güneşin ayın yoluna bıraktığını izliyorum; gökyüzü, sönmekte olan bir ateşin renklerine bürünmüş. Kapıdaki tıklama düşüncelerimi bölüyor, ama bu çetin günlerde elçileri geri çevirme lüksüm yok.\n\nŞaşkınlıkla Ser [scoped_kg_messenger.GetFirstName]'in içeri girip diz çöktüğünü görüyorum. Emirleri Neşe Kulesi'nde kalmaktı.\n\n"Prensim," diyor. "Haber getiriyorum."\n\n"Söyle," diyorum.\n\n"Lyanna Stark doğum yaptı."\n\nKonuşmama izin vermiyor, Ser [scoped_kg_messenger.GetFirstName]'in bitirmesini bekliyorum.\n\n"İkisi de sağlıklı, hem anne hem çocuk. Andlı kardeşlerim onları güvende tutuyor."\n\nGöğsümde bir sevinç ve umut sıcaklığı doğuyor. Tüm bu katliam boşuna değilmiş."

 agot_scenario_rr_toj.0017.desc.b:0 "Yüksek bir kulenin yalnızlığında güneşin ayın yoluna bıraktığını izliyorum; gökyüzü, sönmekte olan bir ateşin renklerine bürünmüş. Kapıdaki tıklama düşüncelerimi bölüyor, ama bu çetin günlerde elçileri geri çevirme lüksüm yok.\n\nŞaşkınlıkla Ser [scoped_kg_messenger.GetFirstName]'in içeri girip diz çöktüğünü görüyorum. Emirleri Neşe Kulesi'nde kalmaktı.\n\n"Prensim," diyor. "Haber getiriyorum."\n\n"Söyle," diyorum.\n\n"Lyanna Stark doğum yaptı."\n\nKonuşmama izin vermiyor, Ser [scoped_kg_messenger.GetFirstNameNoTooltip]'in bitirmesini bekliyorum.\n\n"Çocuk yaşıyor, ama Lyanna... prensim, Leydi Stark hayatta kalamadı."\n\nBir an ya da bir çağ boyunca sessizlikte kayboluyorum, ayırt edemiyorum. Umut dolu bir haberin böyle bir acıya sarılı gelmesi, önce kaçınılmaz görünmeseydi imkânsız olurdu.\n\n"Teşekkürler, Ser [scoped_kg_messenger.GetFirstNameNoTooltip]. Gidebilirsin.""

 agot_scenario_rr_toj.0017.desc.c:0 "Yüksek bir kulenin yalnızlığında güneşin ayın yoluna bıraktığını izliyorum; gökyüzü, sönmekte olan bir ateşin renklerine bürünmüş. Kapıdaki tıklama düşüncelerimi bölüyor, ama bu çetin günlerde elçileri geri çevirme lüksüm yok.\n\nŞaşkınlıkla Ser [scoped_kg_messenger.GetFirstName]'in içeri girip diz çöktüğünü görüyorum. Emirleri Neşe Kulesi'nde kalmaktı.\n\n"Prensim," diyor. "Haber getiriyorum."\n\n"Söyle," diyorum.\n\n"Lyanna Stark doğum yaptı."\n\nKonuşmama izin vermiyor, Ser [scoped_kg_messenger.GetFirstName]'in bitirmesini bekliyorum.\n\n"Anne yaşıyor, ama çocuk... ölü doğdu."\n\nBir an ya da bir çağ boyunca sessizlikte kayboluyorum, ayırt edemiyorum. Tüm bu acıya, bu savaşa, bu ıstıraba katlanmak; sonra çocuğun, bir ebeveynin sıcaklığını hiç hissetmeden ölmesi. Vaad Edilen Prens olabilirdi, ama o her şeyden önce bizim çocuğumuzdu.\n\nLyanna'nın yanında olmalıyım."

 agot_scenario_rr_toj.0017.desc.d:0 "Yüksek bir kulenin yalnızlığında güneşin ayın yoluna bıraktığını izliyorum; gökyüzü, sönmekte olan bir ateşin renklerine bürünmüş. Kapıdaki tıklama düşüncelerimi bölüyor, ama bu çetin günlerde elçileri geri çevirme lüksüm yok.\n\nŞaşkınlıkla Ser [scoped_kg_messenger.GetFirstName]'in içeri girip diz çöktüğünü görüyorum. Emirleri Neşe Kulesi'nde kalmaktı.\n\n"Prensim," diyor. "Haber getiriyorum."\n\n"Söyle," diyorum.\n\n"Lyanna Stark doğum yaptı."\n\nKonuşmama izin vermiyor, Ser [scoped_kg_messenger.GetFirstName]'in bitirmesini bekliyorum.\n\n"Üzgünüm prensim, ne anne ne çocuk hayatta kaldı."\n\nBir an ya da bir çağ boyunca sessizlikte kayboluyorum, ayırt edemiyorum. Tüm bu ıstırap boşunaydı ve dahası gelecek var."

 agot_scenario_rr_toj.0017.a:0 "Derhal Neşe Kulesi'ne yola çıkacağım."

 agot_scenario_rr_toj.0017.b:0 "Ayrılamam. Görevlerim beni burada tutuyor."

 agot_scenario_rr_toj.0018.t:0 "Neşe Kulesi"

 agot_scenario_rr_toj.0018.desc.a:0 "Lyanna'nın sesi beni Neşe Kulesi'nin basamaklarından yukarı çekiyor. Gül ve bal kokan bir odaya giriyorum, ama o tatlı kokular bile bu manzarayı anlatmaya yetmez. Lyanna yatakta oturuyor, çocuğumuz dizinde zıplıyor. Başını kaldırıp bakışlarımla buluşuyor, buz grisi gözleri sevinç gözyaşlarıyla nemli. Sonra çocuk ağlıyor, Lyanna gülüyor ve yumuşak zıplamasına devam ediyor. Onların sevgisinde umut var."

 agot_scenario_rr_toj.0018.desc.b:0 "Lyanna'nın hayaleti beni Neşe Kulesi'nin basamaklarından yukarı çekiyor. Sanki yanımda yürüyor da sırtta geçtiğim taş yığınının altına gömülmemiş gibi sesini duyabiliyorum. Tepedeki oda soğuk, ama hâlâ Lyanna'nın çok sevdiği güller kokuyor. Yerler çürümüş yapraklarla dolu.\n\nKral Muhafızı şövalyelerimden biri çocuğu bana uzatıyor, duymaya dayanamayacağım taziye sözleri söylüyor. Bu çocuk için ödediğim bedel — Lyanna'nın ödediği, tüm diyarın ödediği — adil değil, en az çocuğun kendisi için. Ama yine de, bu Vaad Edilen Prens. Yükleri çok olacak."

 agot_scenario_rr_toj.0018.desc.c:0 "Lyanna'nın gözyaşları beni Neşe Kulesi'nin basamaklarından yukarı çekiyor. Tepedeki oda soğuk, ama hâlâ Lyanna'nın çok sevdiği güller kokuyor. Yerler çürümüş yapraklarla dolu. Lyanna bakışlarımla buluşuyor ve ilk kez, nehir topraklarında beni büyüleyen o vahşi parıltıyı gözlerinde göremiyorum. Gözlerinde, dokunuşunda benim için yalnızca acı var; yine de bunda bile bir görevim var. Yanına gidiyorum, kollarıma alıyorum. Paylaştığımız kederin sözcüğü yok, bu yüzden konuşmuyorum. Daha fazla gözyaşı yok — Lyanna'nın verecek gözyaşı kalmadı. Soğuk bir sessizlikte acı çekiyoruz."

 agot_scenario_rr_toj.0018.desc.d:0 "Lyanna'nın hayaleti beni Neşe Kulesi'nin basamaklarından yukarı çekiyor. Sanki yanımda yürüyor da sırtta geçtiğim taş yığınının altına gömülmemiş gibi sesini duyabiliyorum. Tepedeki oda soğuk, ama hâlâ Lyanna'nın çok sevdiği güller kokuyor. Yerler çürümüş yapraklarla dolu.\n\nBurada o kadar çok acı ve o kadar çok kırılmış umut var ki. Odanın soğuğu, gelecek olan ve tüm neşenin sonu olacak kışın habercisi.\n\nAcıyana dek yumruğumu sıkıyorum. Kendimi yasa bırakmama, pes etmeme izin veremem. Bu felaketi hâlâ durdurabilirim, ama melankoliye teslim olursam değil."

 agot_scenario_rr_toj.rhaegar.a:0 "Söz veriyorum, Lyanna. Çocuk benim kanımdan ve öyle büyütülecek."

 agot_scenario_rr_toj.rhaegar.b:0 "Söz veriyorum, Lyanna. Çocuk benim kanımdan ve meşru evlat gibi muamele görecek."

 agot_scenario_rr_toj.rhaegar.c:0 "Evlenelim Lyanna, çocuklarımızın diyarı miras alacağına yemin ederim."

 agot_scenario_rr_toj.rhaegar.d:0 "Evlenelim Lyanna, bu sıkıntılı günleri geride bırakalım."

 agot_scenario_rr_toj.rhaegar.e:0 "Onu teselli edeceğim..."

 agot_scenario_rr_toj.rhaegar.f:0 "Belki de kader böyle değildi..."

 agot_scenario_rr_toj.rhaegar.g:0 "Huzur içinde yat, Lyanna."

 agot_scenario_rr_toj.0050.desc.a:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor ve hiç bu kadar kara sözler okumamıştım. Sevgili Lyanna'm ölmüş — Dorne'daki isimsiz bir kulede Targaryen pisliği tarafından öldürülmüş.\n\nBu kötülüğün karşılığını dünyadaki tüm kan ödeyemez, ama yaşadığım sürece hiçbir ejderha dölü güvende olmayacak. Soylarının toprağa gömülüşünü topuğumun altında göreceğim."

 agot_scenario_rr_toj.0050.desc.b:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor ve hiç bu kadar kara sözler okumamıştım. Sevgili Lyanna'm ölmüş — ejderha dölü pisliği tarafından kirletilmiş ve Rhaegar'ın çocuğunu doğururken ölmüş.\n\nBu kötülüğün karşılığını dünyadaki tüm kan ödeyemez, ama Lyanna'nın hatırası için Targaryen soyunun toprağa gömülüşünü topuğumun altında göreceğim."

 agot_scenario_rr_toj.0050.desc.c:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor, ama sözler onu taşıyan kuşla uyuşmuyor. Sevgili Lyanna'm yaşıyor! Onu Dorne'un dağlarındaki harap bir kulede bulmuşlar. Bir zafer daha!"

 agot_scenario_rr_toj.0050.desc.d:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor; ilk sözlerde yüreğim havalansa da mesajın sonunda titriyorum. Sevgili Lyanna'm yaşıyor, ama piç Rhaegar Targaryen'in ejderha dölü bir çocuğunu doğurmuş. Eski ve yeni tüm tanrılar adına yemin ederim ki ejderha dölü soyunu toprağa gömeceğim!"

 agot_scenario_rr_toj.0050.desc.e:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor; ilk sözlerde yüreğim havalansa da mesajın sonunda titriyorum. Sevgili Lyanna'm yaşıyor, ama hamile — evlenemeden lekelendi! Mektup ona zorla sahip olan tanrının lanetlediği piçin adını içermiyor, ama gerçeği bir öğrenirsem kafatasını çıplak ellerimle ezeceğim!"

 agot_scenario_rr_toj.0050.desc.f:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor; ilk sözlerde yüreğim havalansa da mesajın sonunda titriyorum. Sevgili Lyanna'm yaşıyor, ama hamile — piç ejderha dölü Rhaegar Targaryen evlenemeden onu lekeledi! Eski ve yeni tüm tanrılar adına yemin ederim ki ejderha dölü soyunu toprağa gömeceğim!"

 agot_scenario_rr_toj.0050.desc.g:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor ve hiç bu kadar kara sözler okumamıştım. Sevgili Lyanna'm ölmüş — onu Dorniş dağlarında bir kulede ölüme terk eden isimsiz bir kahpe oğlu tarafından kirletilmiş. Tüm tanrılar adına yemin ederim, adamın adını bir öğrenirsem kafatasını çıplak ellerimle ezeceğim!"

 agot_scenario_rr_toj.0050.desc.h:0 "Bir kuzgunun kara kanatlarıyla bana bir mektup geliyor ve hiç bu kadar kara sözler okumamıştım. Sevgili Lyanna'm ölmüş — alçak ejderha dölü Rhaegar Targaryen tarafından kirletilmiş ve Dorniş dağlarında bir kulede ölüme terk edilmiş. Eski ve yeni tüm tanrılar adına yemin ederim ki ejderha dölü soyunu toprağa gömeceğim!"

 agot_scenario_rr_toj.0050.desc.i:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde ölü bulunmuş. Böyle masum birinin bu kadar gereksiz yere ölmesi ayıp."

 agot_scenario_rr_toj.0050.desc.j:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde ölü bulunmuş. Daha da ürkütücüsü, ölmeden önce Rhaegar Targaryen'in çocuğunu doğurmuş gibi görünüyor. Robert'ın öfkesi korkunç olacak, kimse bundan şüphe edemez."

 agot_scenario_rr_toj.0050.desc.k:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde canlı bulunmuş — Starklar ve Baratheonlar için en sevindirici haber."

 agot_scenario_rr_toj.0050.desc.l:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde canlı bulunmuş, ama haberin bir pürüzü var: Rhaegar Targaryen'in çocuğunu doğurmuş. Robert'ın öfkesi korkunç olacak, kimse bundan şüphe edemez"

 agot_scenario_rr_toj.0050.desc.m:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde canlı bulunmuş, ama haberin bir pürüzü var: bir avam tarafından kirletilmiş ve şimdi onun çocuğuna hamile. Robert'ın öfkesi korkunç olacak, kimse bundan şüphe edemez."

 agot_scenario_rr_toj.0050.desc.n:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde canlı bulunmuş, ama haberin bir pürüzü var: Lyanna, Rhaegar Targaryen'in çocuğuna hamile! Robert'ın öfkesi korkunç olacak, kimse bundan şüphe edemez."

 agot_scenario_rr_toj.0050.desc.o:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde ölü bulunmuş. Böyle masum birinin bu kadar gereksiz yere ölmesi ayıp."

 agot_scenario_rr_toj.0050.desc.p:0 "Dorne'dan haber getiren bir kuzgun geliyor: Eddard'ın küçük kız kardeşi ve Robert Baratheon'un nişanlısı Lyanna Stark, Dorniş dağlarında bir gözetleme kulesinde ölü bulunmuş. Daha da ürkütücüsü, Rhaegar Targaryen'in çocuğuna hamile olduğu görülüyor."

 agot_scenario_rr_toj.0050.desc.q:0 "Bunu görüyorsan, bir şeyler ters gitti"

 agot_scenario_rr_toj.0050.a:0 "Tanrıların yolları gizemlidir."

 agot_scenario_rr_toj.0050.b:0 "Lanet olsun bu zalim dünyaya. Seni her zaman hatırlayacağım, sevgilim. Lyanna'm."

 agot_scenario_rr_toj.0050.c:0 "Lanet olsun bu çocuğa! Lanet olsun tüm ejderha döllerine!"

 agot_scenario_rr_toj.0050.d:0 "Onu geri alamam. Rhaegar'ın kokusu onu asla terk etmeyecek."

 agot_scenario_rr_toj.0050.e:0 "O hâlâ sevgili Lyanna'm. Hiçbir şey değişmedi."

 AGOT_SCENARIO_RR_TOJ_MARRY_LYANNA_DISINHERIT:0 "Lyanna'yı Elia'nın yerine karın olarak alıyorsun. Ondan olan tüm çocuklarını mirastan mahrum edeceksin."

 AGOT_SCENARIO_RR_TOJ_MARRY_LYANNA:0 "Lyanna'yı Elia'nın yerine karın olarak alıyorsun."

 agot_scenario_rr_toj.0060.t:0 "Ejderhanın İhaneti"

 agot_scenario_rr_toj.0060.desc:0 "Aldığım mesajı okumak birkaç denememi alıyor; okuduğum şeyin ciddiyetini tam olarak kavrayabilmem için. O kadar tuhaf ki önce mutlaka ateşlenmişim, ya da belki güneşte fazla kalıp gözlerimi zedelemişim diye düşünüyorum. \n\n Ama ne yazık ki, tekrar tekrar ve bir kez daha okuduktan sonra görünüşe göre Rhaegar Targaryen, her ne sebeple olursa olsun, Elia'yı bir kenara bırakmaya, çocuklarını mirastan mahrum etmeye ve tüm ailemizi şerefsizleştirmeye karar vermiş."

 agot_scenario_rr_toj.0060.a:0 "Öfkem ölçülemez ve günüm mahvoldu. Bu kabullenilemez."

 agot_scenario_rr_toj.0060.b:0 "Eh. Stresi azalınca fikrini değiştireceğinden eminim..."

 agot_scenario_rr_toj.0100.t:0 "Kulenin Sonuçları"

 agot_scenario_rr_toj.0100.desc:0 "Yeter yalan, yeter aldatmaca. Bunun sürmesine izin veremem. Bu çocuk benim mirasımdan değil — bu, Targaryen imparatorluğunun bir çocuğu ve Stark kanı onların elinde yeterince acı çekti. \n\n Ayrıca, bu çocuk Lyanna'dan kalan son şey. Gözlerinin içine bakıp böyle bir yalanı sürdüremem. Bu çocuk sadece gerçeğin simgesi değil — bu savaşa gerçekten neyin yol açtığının — aynı zamanda Lyanna ve Rhaegar'ın her şeyi riske atmaya razı oldukları bir aşktan geriye kalan tek şey. \n\n Ben sadece bir insanım. Bu çocuğun kim olacağına karar vermek bana düşmez. Bu, tanrıların ve yalnızca tanrıların işi ve ben onların biçtiği soyu elinden almaya yanaşmam."

 agot_scenario_rr_toj.0100.a:0 "Hayat böyle..."

 agot_scenario_rr_toj.0100.desc.alive_alive:0 "En karanlık saatlerde bile neşe bulunabilir. Yeni doğanın ağlayışı genelde yeterli bir rahatlamadır, ama bir annenin çocuğunu ilk kez kucağına alırkenki sesini duymak ve onun güçlü ve sağlıklı çıktığını bilmek başlı başına bir lütuf. \n\nGörünüşe göre tanrılar bugün Lyanna'ya gülümsüyor; doğum sancılarının şiddeti ve acısına rağmen hem o hem de bebeği hayatta kalmış!"

 agot_scenario_rr_toj.0100.desc.dead_alive:0 "En karanlık saatlerde bile neşe bulunabilir. Annenin sesi zayıf ve hastalıklı bir halde sönerken, son saatlerinde çocuğuna verebildiği sevgiyi aktarırken; yeni doğanın ağlayışı güçlü, sağlam ciğerler ve yaşama arzusuyla kutsanmış. \n\nÇok sevilen bir çocuğu doğurduktan sonra Lyanna doğum sancılarına dayanamamış ve doğum sırasında ölmüş."

 agot_scenario_rr_toj.0100.desc.alive_dead:0 "En karanlık saatlerde bile neşe bulunabilir — ama bir annenin yeni doğan çocuğuna yas tutarken ağlayışının sesi, en güçlü iyimserin bile yüreğine şüphe ekebilir. \n\nYoğun, kanlı ve acılı bir doğumun ardından Lyanna doğumdan sağ çıktı, ama ölü doğum yaptı."

 agot_scenario_rr_toj.0100.desc.dead_dead:0 "Tüm bu kan, tüm bu gözyaşı ve kırık kalpler — tüm bu #italic savaş#! — boşuna. Tamamen boşuna. \n\nUzun ve zorlu bir mücadeleye rağmen ne Lyanna ne de bebeği doğum sancılarının acısını yenebildi; bebek daha ilk nefesini alamadan ikisi de göçüp gitti. \n\nİnsanların yüreğindeki bu yer nedir? Ah, evet. Umutsuzluğun çukuru..."

 agot_scenario_rr_toj.0201.desc.a:0 "Yıldızdüşüşü'nü gece sarıyor, ama ay, kaleyi ve çevresindeki dağları soluk gümüşten bir kılıfa bürüyor. Bu yarı aydınlık coğrafyadan beyaz pelerinli bir şövalye kapıma yaklaşıyor — bir Kral Muhafızı şövalyesi ve yanında, kollarında bir bebek tutan bir kadın. Son derece ihtiyatlı bir şekilde, özel konuşabileceğimiz odama gizlice alıyorum. Şövalye [scoped_kingsguard.GetTitledFirstName] ve kadın da Robert Baratheon'un nişanlısı Leydi Lyanna Stark. Ve çocuk... öğrendiğim kadarıyla çocuk güçlük çıkarıyor.\n\n"Son saldırganları da bitirdiğimizde," diyor [scoped_kingsguard.GetTitledFirstName], "sağ kalanlarımızı saydık ve ölülerimizi gömdük. Ondan sonra Leydi Stark ve çocuğu üzerine uzun uzun düşündük. Prensimiz ölüyken gidebileceğimiz başka bir yer yoktu."\n\n Leydi Stark'ı her ne pahasına olursa olsun koruma emirlerini anlatıyor. Utançtan mı sadakatten mi bilemem, bahsetmediği tek şey çocuğun babası. Soruyu soruyorum. Tereddüt ediyor, ama cevap veriyor.\n\n"Rhaegar. Çocuğun babası Rhaegar."\n\nDuyduklarımı sindirmeye çalışırken derin bir sessizlik çöküyor. Sonunda [scoped_kingsguard.GetTitledFirstName] yeniden konuşuyor. "Leydi ve ben durumu uzun uzun konuştuk. Çocuğun güvenliğini sağlamanın tek yolu, [baby_snow.GetHerHim] sarayınızda bir piç olarak büyütülmesi. Bu Leydi Stark'ın isteği, [root.Char.GetLadyLord], ve prensimizin de istediği bu olurdu."\n\nLyanna'nın gözlerinin içine bakıyorum; gözyaşları olsa da kararlılık da var. Gerçekten de çocuğun annesinin dileği bu. Ne kadar acı bir karar olmalı, hayal etmeye çalışıyorum."

 agot_scenario_rr_toj.0201.desc.b:0 "Yıldızdüşüşü'nü gece sarıyor, ama ay, kaleyi ve çevresindeki dağları soluk gümüşten bir kılıfa bürüyor. Bu yarı aydınlık coğrafyadan beyaz pelerinli bir şövalye kapıma yaklaşıyor — bir Kral Muhafızı şövalyesi. Son derece ihtiyatlı bir şekilde, özel konuşabileceğimiz odama gizlice alıyorum. Şövalye [scoped_kingsguard.GetTitledFirstName] ve kucağında beyaz bir kumaşa sarılı, çığlık atan bir bebek taşıyor. Bana Prens Rhaegar'ın Leydi Lyanna Stark'ı koruma emrinden, doğumda ölümünden ve Neşe Kulesi'nden Yıldızdüşüşü'ne yolculuğundan bahsediyor. Utançtan mı sadakatten mi bilemem, bahsetmediği tek şey çocuğun babası. Soruyu soruyorum. Tereddüt ediyor, ama cevap veriyor.\n\n"Rhaegar. Çocuğun babası Rhaegar."\n\nDuyduklarımı sindirmeye çalışırken derin bir sessizlik çöküyor. Sonunda [scoped_kingsguard.GetTitledFirstName] yeniden konuşuyor. "Çocuğun güvenliğini sağlamanın tek yolu, [baby_snow.GetHerHim] sarayınızda bir piç olarak büyütülmesi. Prensimizin de istediği bu olurdu."

