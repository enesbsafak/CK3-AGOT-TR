 agot_scenario_rr_toj.0304.desc:0 "Avluda dolaşıyordum, [ROOT.Char.Custom('GetCourtyard')], adımı duyup döndüm. Ser [surviving_kingsguard.GetFirstNameNoTooltip] yaklaşıyor; yanında bir kadın, solgun ve bitkin, kollarında koyu saçlı küçük bir bohça.\n\n"[rhaegar.GetTitledFirstName] bana ve kardeşlerime Neşe Kulesi'nde kalıp Leydi Lyanna'ya ve çocuklarına nöbet tutmamızı emretti," diyor. "Ama artık güvenli değildi. Ser [dead_kingsguard_1.GetFirstNameNoTooltip] ve Ser [dead_kingsguard_2.GetFirstNameNoTooltip] savunmasında düştüler." Sözsüz ve sorgulayan bir bakışla kadına bakıyor, ama kadın hiçbir şey demiyor; gözleri kucağındaki çocuğa boş boş dikili.\n\nBana dönüp alçak sesle konuşuyor. "[baby_snow.GetHerHis|U] adı [baby_snow.GetFirstName]. Sizin [ROOT.Char.Custom2('RelationToMeShort',baby_snow)]unuz.""

 agot_scenario_rr_toj.0304.desc_lyanna_dead:0 "Avluda dolaşıyordum, [ROOT.Char.Custom('GetCourtyard')], adımı duyup döndüm. Ser [surviving_kingsguard.GetFirstNameNoTooltip] yaklaşıyor; yol yorgunu ve ciddi, kollarında sessizce duran koyu saçlı küçük bir bebek.\n\n"[rhaegar.GetTitledFirstName] bana ve kardeşlerime Neşe Kulesi'nde kalıp Leydi Lyanna'ya ve çocuklarına nöbet tutmamızı emretti," diyor. "Ama artık güvenli değildi. Ser [dead_kingsguard_1.GetFirstNameNoTooltip] ve Ser [dead_kingsguard_2.GetFirstNameNoTooltip] savunmasında düştüler. Leydi doğumu atlatamadı."\n\nBebeğe bakıyor, sesi yumuşuyor. "[baby_snow.GetHerHis|U] adı [baby_snow.GetFirstName]. Sizin [ROOT.Char.Custom2('RelationToMeShort',baby_snow)]unuz.""

 agot_scenario_rr_toj.0304.desc_child:0 "Bugün bir yabancı geldi ve o geldiğinden beri büyükler yüksek sesle, ciddi tonlarla konuşuyorlar.\n\nSonunda parlak beyaz zırhlı bir adam bana doğru yürüyor. Kollarında küçük bir bohça taşıyor. Diz çöktüğünde içindekini görüyorum: yumuşak bir kumaşa sarılı minicik bir bebek.\n\n"Bu senin [ROOT.Char.Custom2('RelationToMeShort',baby_snow)]," diyor yumuşakça. "Adı Jon.""

 agot_scenario_rr_toj.0304.a:0 "Eğer [baby_snow.GetSheHe] gerçekten Rhaegar'ınsa, taht [baby_snow.GetHerHim] aittir."

 agot_scenario_rr_toj.0304.a_child:0 "[baby_snow.GetSheHe|U] [baby_snow.Custom('QueenKing')] olmak için doğmuştu."

 agot_scenario_rr_toj.0304.b:0 "Onları geri çeviremem."

 agot_scenario_rr_toj.0304.b_child:0 "Bir [ROOT.Char.Custom2('RelationToMeShort',baby_snow)] mu?"

 agot_scenario_rr_toj.0600.t:0 "Winterfell'in Dişi Kurdu"

 agot_scenario_rr_toj.0600.desc:0 "Lyanna gece geri dönüyor, tek söz etmeden. Solgun ve içine kapanık; kaçırıldığı geceden beri olanlar hakkında tek kelime etmeyi reddediyor.\n\n"Bir şey değiştirir mi? Artık savaş var. Babam öldü, Brandon öldü... bir kez yapılan bazı şeyler geri alınamaz." Sessizce yüzünü çeviriyor. "Winterfell benim evim, hiç ayrılmamalıydım. Bir daha ayrılmak ister miyim emin değilim.""

 agot_scenario_rr_toj.0600.a:0 "Ayrılmayacaksın, yemin ederim."

 agot_scenario_rr_toj.0600.b:0 "Şimdilik nasıl istersen; bir gün fikrini değiştirebilirsin..."

 agot_scenario_rr_toj.0600.c:0 "Bazı sözler o kadar kolay bozulmaz."

