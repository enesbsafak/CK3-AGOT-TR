 agot_scenario_rr_toj.0201.a:0 "[baby_snow.GetHerHim] kendi çocuğum gibi büyüteceğim."

 agot_scenario_rr_toj.0201.b:0 "[new_father_2.GetFirstNameNoTooltip] uygun bir evlat edinen baba olur."

 agot_scenario_rr_toj.0201.c:0 "[new_father_3.GetFirstNameNoTooltip] istediğimde bunu yapar."

 agot_scenario_rr_toj.0201.d:0 "Bu konuda [new_father_4.GetFirstNameNoTooltip]'e güvenilebilir."

 agot_scenario_rr_toj.0201.e:0 "Lyanna sarayımızda kalabilir ve çocuğunu kendi evladı gibi büyütebilir."

 agot_scenario_rr_toj.0201.tooltip:0 "[new_father.GetFirstNameNoTooltip] bebeği kendi piçi olarak alacak. Bebek [new_father.GetNamePossessive] hanesinin bir parçası olacak ve onlardan biri gibi büyütülecek."

 agot_scenario_rr_toj.0301.t:0 "Winterfell'in Dişi Kurdu"

 agot_scenario_rr_toj.0301.desc:0 "Yaşanan her şey ve şimdi yaşanması gereken her şeyle birlikte, Westeros'ta kalamam."

 agot_scenario_rr_toj.0301.a:0 "Hepsini [ROOT.Char.Custom2('RelationToMeShort',baby_snow)] için geride bırakacağım."

 agot_scenario_rr_toj.0302.t:0 "Kuleden Gelen [baby_snow.Custom('GirlBoy')|U]"

 agot_scenario_rr_toj.0302.desc:0 "Avluda dolaşıyordum, [ROOT.Char.Custom('GetCourtyard')], adımı duyup döndüm. [surviving_kingsguard.GetTitledFirstName] yaklaşıyor; yanında Lyanna, solgun ve bitkin, kollarında koyu saçlı küçük bir bohça.\n\n"Ne olduğunu duyduk ve elimizden geldiğince çabuk geldik," diyor Ser [surviving_kingsguard.GetFirstNameNoTooltip]. "Ser [dead_kingsguard_1.GetFirstNameNoTooltip] ve Ser [dead_kingsguard_2.GetFirstNameNoTooltip] kuleyi savunurken düştüler."\n\nYanında Lyanna, sessiz ve öfkeli bir homurtu çıkarıyor. Önce konuşmuyor, sadece bebeğe bakıyor ve parmaklarını saçlarında nazikçe gezdiriyor. "[baby_snow.GetHerHim] için başka güvenli yer yok," diye mırıldanıyor. "Artık yok.""

 agot_scenario_rr_toj.0302.desc_lyanna_dead:0 "Avluda dolaşıyordum, [ROOT.Char.Custom('GetCourtyard')], adımı duyup döndüm. Ser [surviving_kingsguard.GetFirstNameNoTooltip] yaklaşıyor; yol yorgunu ve ciddi, kollarında sessizce duran koyu saçlı küçük bir bebek.\n\n"Ser [dead_kingsguard_1.GetFirstNameNoTooltip] ve Ser [dead_kingsguard_2.GetFirstNameNoTooltip] kuleyi savunurken düştüler. Lyanna... doğumu atlatamadı. Üzgünüm."\n\nNazikçe çocuğu bana uzatıyor. "Bir [ROOT.Char.Custom2('RelationToMeShort', baby_snow)].""

 agot_scenario_rr_toj.0302.a:0 "[baby_snow.GetSheHe|U] benim kanımdan ve öyle büyütülecek."

 agot_scenario_rr_toj.0302.b:0 "[baby_snow.GetSheHe|U] benim kanımdan ve meşru evlat gibi muamele görecek."

 agot_scenario_rr_toj.0302.c:0 "Evlenelim Lyanna, çocuklarımızın diyarı miras alacağına yemin ederim."

 agot_scenario_rr_toj.0302.d:0 "Evlenelim Lyanna, bu sıkıntılı günleri geride bırakalım."

