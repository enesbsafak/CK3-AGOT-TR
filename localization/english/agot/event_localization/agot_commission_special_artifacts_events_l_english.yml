l_english:

 agot_commission_special_artifact_crown.0001.t:0 "Taç Siparişi"

 agot_commission_special_artifact_crown.0001.desc:0 "Westeros'ta çok az kişinin taç sahibi olmasına izin verilir. Takma yetkisine sahip olanlar ise daha da azdır. Hükümranlığımı temsil edecek ve meşrulaştıracak yeni bir güç sembolü yaratmanın zamanı geldi. Tarih beni adımla, işlerimle ve taşımayı seçtiğim sembollerle hatırlasın. Kuşaktan kuşağa aktarılan, gücümü ve nüfuzumu açıkça sergileyen bir taç sipariş edeceğim."

 agot_commission_special_artifact_crown.0001.desc_coronation:0 "Her taç giyme töreni bir taç gerektirir; bu yüzden bir tane sipariş edeceğim. Kuşaktan kuşağa aktarılan, gücümü ve nüfuzumu açıkça sergileyen bir yadigâr olacak."

 agot_commission_special_artifact_crown.0001.a:0 "İşte bu."

 agot_commission_special_artifact_crown.0001.b:0 "Fikrimi değiştirdim. Artık yeni bir taç yaptırmak istemiyorum."

 agot_commission_special_artifact_crown_spouse.0001.desc:0 "Westeros'ta çok az kişinin taç sahibi olmasına izin verilir. Takma yetkisine sahip olanlar ise daha da azdır. Eşime bahşedilmek üzere yeni bir taç sipariş edeceğim."

 agot_commission_special_artifact_armor.0001.t:0 "Zırh Siparişi"

 agot_commission_special_artifact_armor.0001.desc:0 "Zırh, basit bir korumadan çok daha fazlasıdır; onu giyenin statüsünü ve varlığını yansıtır. Ölçülerime göre dövülmüş ve hatırlanmaya değer yeni bir takım sipariş edeceğim."

 agot_commission_special_artifact_armor.0001.a:0 "İşte bu."

 agot_commission_special_artifact_armor.0001.b:0 "Fikrimi değiştirdim. Artık yeni zırh yaptırmak istemiyorum."
