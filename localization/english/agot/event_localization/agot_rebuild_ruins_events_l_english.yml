l_english:

 ruin_sigil_ring:0 "Harabelerin Mühür Yüzüğü"

 ruin_sigil_ring_desc:0 "Harabe bir kalenin yeniden inşası sırasında bulunan bir mühür yüzüğü. Mühür zamanla solmuş olsa da, bir zamanlar bu harabeler üzerinde hakimiyet kuran talihsiz hanedana ait olduğuna dair hiçbir şüphe yok."

 ruin_sword:0 "Harabelerin Çelik Kılıcı"

 ruin_sword_desc:0 "Harabe bir kale yeniden inşa edilirken bulunan çelik külçelerinden yapılmış bir kılıç."

 ruin_mace:0 "Harabelerin Çelik Topuzu"

 ruin_mace_desc:0 "Harabe bir kale yeniden inşa edilirken bulunan çelik külçelerinden yapılmış bir topuz."

 ruin_spear:0 "Harabelerin Çelik Mızrağı"

 ruin_spear_desc:0 "Harabe bir kale yeniden inşa edilirken bulunan çelik külçelerinden yapılmış bir mızrak."

 ruin_axe:0 "Harabelerin Çelik Baltası"

 ruin_axe_desc:0 "Harabe bir kale yeniden inşa edilirken bulunan çelik külçelerinden yapılmış bir balta."

 ruin_dagger:0 "Harabelerin Çelik Hançeri"

 ruin_dagger_desc:0 "Harabe bir kale yeniden inşa edilirken bulunan çelik külçelerinden yapılmış bir hançer."

 agot_rebuilding_ruins.0001.t:0 "Kömür Satıcıları"

 agot_rebuilding_ruins.0001.desc:0 "Bir zamanlar büyük lordların yurdu olan bu yerden geriye yalnızca karanlık harabeler ve sıklaşmış ormanlar kaldı.\n\nYeniden inşa çalışmalarına başlarken, bölgede göz ardı ettiğimiz sıradan halktan birkaç yoksul kömür satıcısı fark ediyoruz. Ama şimdi yeniden inşa çalışmalarının sürekli aksadığını görüyoruz. Ekipman hasar görüyor ya da kayboluyor. Erzaklar gece çalınıyor.\n\nAdamlarımdan biri kömür satıcılarının sorumlu olduğunu iddia ediyor; geçimlerini sağladıkları ormanlık alanı kaybetmekten korktuklarını söylüyor."

 agot_rebuilding_ruins.0001.a:0 "Haydutlar gibi davranıyorlarsa, onlara öyle davranacağım!"

 agot_rebuilding_ruins.0001.a.tt:0 "Gazabını kömür satıcılarının üzerine indirirsin."

 agot_rebuilding_ruins.0001.b:0 "Onlarla konuşurum; tehdit olmadığımızı anlamalarını sağlarım."

 agot_rebuilding_ruins.0001.b.tt:0 "Belki diplomasi onları senin yanına çeker — ya da bu başarısız olursa, ormanlarının kaybı için adil bir tazminat."

 agot_rebuilding_ruins.0001.win.title:0 "Yerel halkla bir anlaşmaya varıldı."

 agot_rebuilding_ruins.0001.lose.title:0 "Kömür satıcılarına tazminat ödendi."

 agot_rebuilding_ruins.0001.c:0 "Belki onlara bir hediye bize iyi niyet kazandırır?"

 agot_rebuilding_ruins.0001.c.tt:0 "Kömür satıcılarına, ormandan elde ettikleri gelirin kaybını telafi etmek için altın teklif edersin."

 agot_rebuilding_ruins.0002.t:0 "Kümes Haydutları"

 agot_rebuilding_ruins.0002.desc:0 "Adamlarım sabahın çoğunu harabelerde #N bir horoz için mi?#! arayarak geçirdi.\n\nBazı adamlar, gece boyunca ayaklarının altından geliyormuş gibi duyulan bir horoz ötüşü işittiklerini iddia ediyor. İddialarının kanıtını bulmak için çılgına dönen adamlar, kanatlıyı aramaya başladı.\n\nBüyük bir şaşkınlıkla, adamlarım saklanmış horozu — gizli bir mahzendeki birkaç #bold adamla#! birlikte — buldu. Görünüşe göre bir haydut çetesi harabeleri operasyon üssü olarak kullanıyor ve bizim gelişimiz onları saklanmaya zorlamış."

 agot_rebuilding_ruins.0002.a:0 "Onları tutuklayın!"

 agot_rebuilding_ruins.0002.a.tt:0 "Açıkça kanun kaçağılar ve adalet yerini bulmalı."

 agot_rebuilding_ruins.0002.b:0 "Öldürün ve ganimeti alın..."

 agot_rebuilding_ruins.0002.b.tt:0 "Bu kanun kaçaklarına adaleti sen sağlayacaksın ve ganimetleri ödül olarak hizmet edecek."

 agot_rebuilding_ruins.0002.c:0 "Belki benim için çalışmakla ilgilenirler?"

 agot_rebuilding_ruins.0002.c.tt:0 "Kanun kaçaklarının silah kullanmayı bildikleri açık; umalım ki sana yararlı olurlar."

 agot_rebuilding_ruins.0003.t:0 "Gömülü Hazine"

 agot_rebuilding_ruins.0003.desc:0 "İşçilerimden bazıları, çökmüş bir odayı enkazdan temizlerken sevindirici bir keşif yaptı — #bold döşeme tahtalarının altına gizlenmiş bir kese altın bulundu!#!\n\nBu sikkeler kime aitse artık hayatta değil... Sahiplenmek benim hakkım."

 agot_rebuilding_ruins.0003.a:0 "Şanslı bir keşif!"

 agot_rebuilding_ruins.0003.a.tt:0 "Kader sana gülümsüyor."

 agot_rebuilding_ruins.0004.t:0 "Haydut Saldırısı"

 agot_rebuilding_ruins.0004.desc:0 "#bold O piçler, kurt saatini vurmak için bekledi!#! Harabelerin yakınındaki sık ormanların arasına gizlenmiş büyük bir haydut grubu pusuda bekliyordu.\n\nKibirden, umutsuzluktan ya da aptallıktan olsun, bu eğitimsiz serseriler adamlarıma saldırabileceklerine inanıyor. Komutayı alıp almamaya ya da çatışmaya katılmaya hızla karar vermeliyim."

 agot_rebuilding_ruins.0004.a:0 "Adamlarıma komuta edip onları püskürteceğim!"

 agot_rebuilding_ruins.0004.a.tt:0 "Askeri bilgini kullanarak adamlarını haydutlara karşı yönlendireceksin."

 agot_rebuilding_ruins.0004.a.win.title:0 "Savaş Kazanıldı!"

 agot_rebuilding_ruins.0004.a.lose.title:0 "Savaş Kaybedildi..."

 agot_rebuilding_ruins.0004.b:0 "Çatışmaya ben de katılacağım!"

 agot_rebuilding_ruins.0004.b.tt:0 "Savaşta hünerin sana yol gösterecek; haydutların lideriyle göğüs göğüse çarpışacaksın."

 agot_rebuilding_ruins.0004.b.win.title:0 "Savaş Kazanıldı!"

 agot_rebuilding_ruins.0004.b.lose.title:0 "Savaş Kaybedildi..."

 agot_rebuilding_ruins.0004.c:0 "Bu iş kaybedildi, en iyisi geri çekilmek..."

 agot_rebuilding_ruins.0004.c.tt:0 "Rakibinden güçsüzsün; kaçıp başka bir günü görmek daha iyi."

 agot_rebuilding_ruins.0005.t:0 "Hayalet Hikayeleri"

 agot_rebuilding_ruins.0005.desc:0 "Harabedeki yeniden inşa başladığından beri, şövalyem [agot_ghost_story_knight.GetTitledFirstName] halkın harabeler hakkında anlattığı hikayeleri aktarmaya başladı. Her köşede adamlarımın arasında fısıltılar duyuyorum...\n\n #italic      tüyler ürperten çığlıklar...#!\n\n #italic            çılgına dönmüş korkaklar...#!\n\n #italic                  canlı kalan yok...#! \n\nNe yazık ki, bir zamanlar harabelere sahip olan talihsiz hanedana dair bu masallar sarayımda yayılıyor."

 agot_rebuilding_ruins.0005.a:0 "Bu harabelerde geceyi geçirerek bu meseleyi ebediyen kapatacağım."

 agot_rebuilding_ruins.0005.a.tt:0 "Bu hikayelere son verecek ve kendi cesaretini kanıtlayacaksın!"

 agot_rebuilding_ruins.0005.b:0 "Ha! Bırak aptallar konuşsun."

 agot_rebuilding_ruins.0005.b.tt:0 "Salonlarda ne fısıldadıkları seni neden ilgilendirir?"

 agot_rebuilding_ruins.0005.c:0 "[agot_ghost_story_knight.GetFirstNameNoTooltip]'in içine korku salacağım..."

 agot_rebuilding_ruins.0005.c.tt:0 "Şövalyenle konuşacak, bu tür hikayelerin [agot_ghost_story_knight.GetHerHim]'i ne kadar korkak gösterdiğine dikkat çekeceksin."

 agot_rebuilding_ruins.0005.c.win.title:0 "Etki bırakmış gibisin!"

 agot_rebuilding_ruins.0005.c.lose.title:0 "[agot_ghost_story_knight.GetHerHim]'i daha da fazla korkuttun..."

 agot_rebuilding_ruins.0006.t:0 "Hayalet Hikayeleri: Huzurlu Gece"

 agot_rebuilding_ruins.0006.desc:0 "Harabelerde geceyi geçirmek hayal ettiğimden daha hoştu. Hikayelere rağmen, güzel bir gece uykusu çekebildim!\n\nŞafak sökünce, serin sabah havası beni canlandırarak uyandırdı; kendimi dinç ve neşeli hissediyorum. Adamlarım ve ben orman kenarındaki geyik bolluğunu fark ediyoruz ve benim için endişelenen saraydakileri düşünüp içten bir kahkaha atıyorum."

 agot_rebuilding_ruins.0006.a:0 "Bu kesinlikle o hikayelere son verecek."

 agot_rebuilding_ruins.0007.t:0 "Hayalet Hikayeleri: Korkunç Gece"

 agot_rebuilding_ruins.0007.desc:0 "#bold Kahrolsun bu harabeler...#! #italic ama belki de çoktan kahrolmuşlardır...#! \n\nKorkunç bir gece geçirdim! Uyumaya çalıştığım her an kabuslar beni ele geçirdi ve gece boyunca uluyan fırtına, işkenceye ortak olmuş gibiydi.\n\nSabah olduğunda, bir zamanlar hayalet hikayelerine gülen adamlar bile artık uykusuz gözlerle onları tekrarlıyordu."

 agot_rebuilding_ruins.0007.a:0 "Kahretsin o hikayeler... kahretsin bu harabeler..."

 agot_rebuilding_ruins.0008.t:0 "Hayalet Hikayeleri: Ölülerin Görüleri"

 agot_rebuilding_ruins.0008.desc:0 "#bold Kahrolsun bu harabeler...#! #italic ama belki de çoktan kahrolmuşlardır...#! \n\nRüyalarım, bir zamanlar bu harabelere hükmeden talihsiz hanedanın son anlarını yaşadığım korkunç kabuslarla doluydu. Çılgına dönmüş korkaklar kaçmaya çalışırken bir dizi tüyler ürperten çığlık. [ROOT.Char.GetFaith.DeathDeityName] bizim için geldiğinde kalabalığın arasında yakalanmış haldeyim; canlı kalan yok... \n\nBu kabuslar beni şafaktan önce uyandırıyor ve huzursuz zihnimi sakinleştirmeyi umarak ay ışığıyla aydınlanan harabelerde dolaşıyorum; ta ki onu görene dek — ay ışığında parıldayan, yerde duran #bold eski bir mühür yüzüğü#!."

 agot_rebuilding_ruins.0008.a:0 "Talihsiz bir hanedanın yadigarı."

 agot_rebuilding_ruins.0009.t:0 "Demirci Gizleniği"

 agot_rebuilding_ruins.0009.desc:0 "Bu harabe kalenin birçok gizemi, kadim yapının kalıntılarını istila eden yosunlu çalılıkların altında yatıyor.\n\nHarabelerin enkazını temizlerken adamlarımdan biri, bir zamanlar kalenin demirhanelerinin durduğu yerde bir çelik külçe gizleniği ortaya çıkarıyor. Yıllara rağmen çelik çok iyi durumda."

 agot_rebuilding_ruins.0009.a:0 "Bu bana biraz para kazandırmalı."

 agot_rebuilding_ruins.0009.a.tt:0 "Çelik külçeleri satarsın."

 agot_rebuilding_ruins.0009.b:0 "Belki kendi demircim bir şeyler yapabilir..."

 agot_rebuilding_ruins.0009.b.tt:0 "Demircin, harabelerin çelik külçelerinden sana bir silah dövmeyi deneyecek."

 agot_rebuilding_ruins.0009.sword.title:0 "Kılıç Dövüldü"

 agot_rebuilding_ruins.0009.mace.title:0 "Topuz Dövüldü"

 agot_rebuilding_ruins.0009.axe.title:0 "Balta Dövüldü"

 agot_rebuilding_ruins.0009.spear.title:0 "Mızrak Dövüldü"

 agot_rebuilding_ruins.0009.dagger.title:0 "Hançer Dövüldü"

 agot_rebuilding_ruins.0010.t:0 "Hızlı Bir Karar"

 agot_rebuilding_ruins.0010.desc:0 "Böyle bir harabeyi yeniden inşa etmek kolay bir iş değildir. Yılların çürümesi onarılmalı ve bir zamanlar gururlu olan duvar işçiliği restore edilmeli.\n\nBugün adamlarımdan bazıları tuğla paletlerini harabe kalenin yüksek kısımlarına çekerken, halatlardan birinin çözülmeye başladığını fark ediyorum. Aşağıda [agot_rebuilding_ruin_block_head.GetTitledFirstName]'i görüyorum, hiçbir şeyden habersiz — #italic ama [agot_rebuilding_ruin_block_head.GetHerHim]'e yardım etmek için yeterli zaman var mı?#!"

 agot_rebuilding_ruins.0010.a:0 "Umalım ki [agot_rebuilding_ruin_block_head.GetSheHe] zarar görmez..."

 agot_rebuilding_ruins.0010.a.tt:0 "[agot_rebuilding_ruin_block_head.GetHerHim]'i uyarmayı denersin."

 agot_rebuilding_ruins.0010.b:0 "Belki hâlâ [agot_rebuilding_ruin_block_head.GetWomanMan]'e ulaşıp [agot_rebuilding_ruin_block_head.GetHerHim]'i koruyabilirim!"

 agot_rebuilding_ruins.0010.b.tt:0 "Bunu yapmak seni tehlikeye atar, ama [agot_rebuilding_ruin_block_head.GetFirstNameNoTooltip] minnettar kalacak."

 agot_rebuilding_ruins.0011.t:0 "Taşa Kazınmış Seçenekler"

 agot_rebuilding_ruins.0011.desc:0 "Yeniden inşa çalışması için taş, topraklarımın dört bir yanından getiriliyor. Adamlarımdan biri, yakınlarda potansiyel bir taş kaynağı olduğuna dikkat çekti — ancak bu, birkaç yıl içinde tükenecek küçük bir ocak olurdu."

 agot_rebuilding_ruins.0011.a:0 "Bu küçük ocak için fon sağlayacağım."

 agot_rebuilding_ruins.0011.b:0 "Altınım başka yerde daha iyi harcanır."

 agot_rebuilding_ruins.0012.t:0 "Ayrıntılarda"

 agot_rebuilding_ruins.0012.desc:0 "Yeniden inşa çalışmaları iyi gidiyor; yine de kendimi gece geç saatlere kadar inşaat planlarını incelerken buluyorum. Bazen küçük değişiklikler yapıyor ya da halihazırda uygulanan planları geliştirmenin ufak yollarını görüyorum.\n\nAdamlarımdan bazıları, yeniden inşaya fazla kaptırdığımdan endişe ettiklerini söyledi..."

 agot_rebuilding_ruins.0012.a:0 "Bu kesinlikle bir saplantı değil!"

 agot_rebuilding_ruins.0012.a.tt:0 "Harabeler yeniden inşa edildiğinde dinleneceksin."

 agot_rebuilding_ruins.0012.b:0 "Belki de haklılar..."

 agot_rebuilding_ruins.0012.b.tt:0 "Öğüdü kabul eder ve projeyi denetlemekten çekilirsin."

 agot_rebuilding_ruins.0013.t:0 "Bronz Levha"

 agot_rebuilding_ruins.0013.desc:0 "Harabeleri yeniden inşa ederken adamlarım, harabelerin kendisinden daha eski görünen ilginç bir yadigara rastladı. İlk İnsanlar'ın runlarıyla kaplı bir bronz levha."

 agot_rebuilding_ruins.0013.a:0 "Bu biraz altın getirebilir!"

 agot_rebuilding_ruins.0013.a.tt:0 "Levhayı altın karşılığında satarsın."

 agot_rebuilding_ruins.0013.b:0 "Belki levhayı çözebilirim..."

 agot_rebuilding_ruins.0013.b.tt:0 "Çok bilgili ve beceriklisin; zamanla gerçeği ortaya çıkarabilirsin."

 agot_rebuilding_ruins.0013.c:0 "Kale'deki maesterler onu tercüme edebilir."

 agot_rebuilding_ruins.0013.c.tt:0 "Levhayı Kale'ye götürmesi için bir ulak tutarsın."

 agot_rebuilding_ruins.0014.t:0 "Bronz Tanrı"

 agot_rebuilding_ruins.0014.desc:0 "Bir maester, Royce Hanedanı'nın zırhını ve mührünü referans alarak levhanın bir kısmını çözmeyi başardı. Levha, Ormanın Çocukları ile yapılan anlaşmadan önce İlk İnsanlar'ın kadim bir tanrısına yapılan bir dua ritüeliydi: #bold Bronz Tanrı#!, bir savaş ve madencilik tanrısı.\n\nMaester, Bronz levhayı makul bir meblağ karşılığında satın almaya istekli olduğunu yazıyor."

 agot_rebuilding_ruins.0014.a:0 "Belki bu ritüeli #italic ben#! denemeliyim."

 agot_rebuilding_ruins.0014.a.tt:0 "Çoktan ölmüş bir tanrıya dua edersin."

 agot_rebuilding_ruins.0014.b:0 "#bold Altın#! memnuniyetle karşılanır!"

 agot_rebuilding_ruins.0014.b.tt:0 "Kale bunun için iyi para öder."

 agot_rebuilding_ruins.0015.t:0 "Bronz Tanrı'ya Dualar"

 agot_rebuilding_ruins.0015.desc:0 "Gece geç saatte, maesterin tarif ettiği ritüeli gerçekleştiriyorum. Ritüel tamamlandığında içimi ateşli bir coşku dolduruyor — inancımın bana hiç vermediği ezici bir duygu."

 agot_rebuilding_ruins.0015.a:0 "Belki İlk İnsanlar haklıydı."

 agot_rebuilding_ruins.0015.b:0 "Hayır... İnancıma sadık kalacağım."

 agot_rebuilding_ruins.0016.t:0 "Örnek Olan Lider"

 agot_rebuilding_ruins.0016.desc:0 "Harabelerdeki çalışma hem fiziksel hem zihinsel olarak yorucu. Makamıma rağmen, saray mensuplarımın yanında çalışarak yeniden inşa çabalarının fiziksel gerekliliklerine giderek daha fazla yardım ettiğimi fark ediyorum. Bugün, saray mensuplarımın onlarla birlikte çalışmam sayesinde bana yeni bir saygı duyduklarını gördüm."

 agot_rebuilding_ruins.0016.a:0 "Çok el, işi hafifletir!"

 agot_rebuilding_ruins.0017.t:0 "Meraklı Bir Ziyaretçi"

 agot_rebuilding_ruins.0017.desc:0 "Eski harabeleri eski ihtişamına kavuşturma çabalarım hakkında söylentiler yayıldı. Bugün, yeniden inşa çalışmalarını gezmek isteyen meraklı bir Lord beni ziyaret etti."

 agot_rebuilding_ruins.0017.a:0 "Onları harabelerin askeri tarihi ve avantajlarıyla ağırlarım!"

 agot_rebuilding_ruins.0017.a.tt:0 "Askeri bilgini kullanırsın."

 agot_rebuilding_ruins.0017.b:0 "Çabalarımı ve maliyet tasarrufu önlemlerimi açıklarım!"

 agot_rebuilding_ruins.0017.b.tt:0 "Yönetim bilgini kullanırsın"

 agot_rebuilding_ruins.0017.c:0 "Cazibem yeterli olacaktır."

 agot_rebuilding_ruins.0017.c.tt:0 "Diplomasi bilgini kullanırsın"

 agot_rebuilding_ruins.0017.win.title:0 "İyi bir izlenim bıraktın"

 agot_rebuilding_ruins.0017.lose.title:0 "İyi bir izlenim bırakamadın"

 agot_rebuilding_ruins.0018.t:0 "Harabelerin Çiçeği"

 agot_rebuilding_ruins.0018.desc:0 "Bir zamanlar soylu bir hanedanın merkezi olan harabeler, artık yerel halkın ziyaret edip kullandığı bir yerdir. Yeniden inşa çabalarımız yerel halk arasında bir anlaşmazlığa yol açmış olsa da, yerel bir kız aramızda köprü oldu. Müzik yeteneğiyle donanmış olan kız, harabelerde çalışan saray mensuplarımı ve şövalyelerimi kazandı. Bugün işçilerden birinin sahip olduğu arpı çalmaya başladı ve herkes onu dinlemek için durdu."

 agot_rebuilding_ruins.0018.a:0 "Sanırım bugün inşaata ara vereceğiz!"

 agot_rebuilding_ruins.0018.a.tt:0 "Müziğin tadını çıkarıp dinlenelim artık."

 agot_rebuilding_ruins.0018.b:0 "Böyle bir yetenek sarayımda memnuniyetle karşılanır!"

 agot_rebuilding_ruins.0018.b.tt:0 "Ona sarayında bir yer teklif edersin!"

 agot_rebuilding_ruins.1001.t:0 "Bataklıktaki Çeneler"

 agot_rebuilding_ruins.1001.desc:0 "Bir kalenin çevresi, savunucularını surları ve perde duvarları kadar — hatta onlardan daha fazla — koruyabilir; tıpkı Dev Mızrağı'nın zirvesindeki Eyrie veya Kızıl Çatal kıyısındaki Riverrun gibi.\n\nAma bazen bir günün elverişli çevresi, başka birinin öngörülemez tehlikesine dönüşebilir. Bu benim yüküm oldu; kertenkele-aslanlar bataklığın içinden habersiz işçilere saldırıyor."

 agot_rebuilding_ruins.1001.a:0 "Bu büyüklükteki bir proje için kayıplar kabul edilebilir."

 agot_rebuilding_ruins.1001.b:0 "Sahayı korumak için adam tut."

 agot_rebuilding_ruins.1001.c:0 "Bu bataklık iblislerini avlamaları için profesyoneller gönder!"

 agot_rebuilding_ruins.1001.c.tt:0 "Bir kertenkele-aslan kafatasıyla dönerler"

 agot_rebuilding_ruins.1001.d:0 "Yalnızca en az çalışkan olanları yediklerinden emin ol."

 agot_rebuilding_ruins.1001.e:0 "Bu canavarların insan etini sevmesinin bir nedeni olmalı..."

 agot_rebuilding_ruins.1002.t:0 "Harabelerden Dersler"

 agot_rebuilding_ruins.1002.desc:0 "Moat Cailin her zaman bir harabe olmadığı gibi, Neck de her zaman bir bataklık değildi. Birçokları bu bataklığın, kertenkele-aslanlar ve kan çiçekleriyle istila edilmiş halinin, Çocuklar'ın kiniyle doğduğuna inansa da, meselenin gerçeği hâlâ çok tartışılıyor.\n\nMoat Cailin'in kendisi, Çocuklar'ın karanlık büyülerini çağırdıkları yer olarak şüphelenilen mevkidir ve Kale'den acilen bir maester geldi. Görünüşe göre Moat Cailin'i restore etme girişimim bazı bilgi izlerini bozabilir ve [new_maester.GetName] iş tamamlanmadan önce sahaya erişmek istiyor.\n\n[new_maester.GetSheHe|U] varlığının işi kesintiye uğratabileceğini gizlemiyor, ancak [new_maester.GetSheHe] saygıyla bu iyiliği kendisine bahşetmemi istiyor."

 agot_rebuilding_ruins.1002.a:0 "Çok iyi, ama bilgilerinin bir kısmını benimle paylaş."

 agot_rebuilding_ruins.1002.a.tt:0 "[new_maester.GetNamePossessiveNoTooltip] kitabını alırsın"

 agot_rebuilding_ruins.1002.b:0 "Vazgeçebileceğin değerli bir şeyin olmalı."

 agot_rebuilding_ruins.1002.c:0 "Geri kalmayı göze alamam."

 agot_rebuilding_ruins.1002.d:0 "Ben de öğrenmeye hevesliyim."

 agot_rebuilding_ruins.2000.t:0 "Harren'in Alevleri"

 agot_rebuilding_ruins.2000.desc:0 "Son birkaç gündür, Harrenhal restorasyon sahasında yayılan bir ateş hakkında raporlar alıyorum. İlk başta izole bir hastalık olduğunu düşünüp pek aldırış etmedim, ancak vakalar çoğalmaya devam etti.\n\nArtık içten yanan bir ateş gibi iç ağrılarından söz ediliyor. #italic Kara Harren'i alan o ateşin ta kendisi,#! diye fısıldayanlar var. Bu lanet masalının #WF vahşi ateş#! gibi yayılması uzun sürmedi.\n\nİşin gecikmesini istemiyorsam, işçiler için bir şeyler yapmalıyım. Bu hastalığın nedenini araştırabilirim, her ne kadar bu zaman kaybı olabilirse de."

 agot_rebuilding_ruins.2000.a:0 "Bu belanın kaynağını bulmalıyım."

 agot_rebuilding_ruins.2000.a.tt:0 "Bunun kökenini ortaya çıkarmak için hangi yöntemin kullanılacağını sen seçeceksin "curse""

 agot_rebuilding_ruins.2000.b:0 "Birkaç günlük dinlenme yeterli olmalı."

 agot_rebuilding_ruins.2000.b.tt:0 "Bunun arkasında bir lanet olmadığını ve işlerin kendiliğinden yoluna gireceğini umuyorsun"

 agot_rebuilding_ruins.2000.c:0 "Onları tedavi etmeye gerek yok — yeter ki değiştirin."

 agot_rebuilding_ruins.2000.c.tt:0 "Sorunun Harrenhal'ın kendisinden çok hasta işçiler olduğunu umuyorsun"

 agot_rebuilding_ruins.2000.d:0 "[physician.GetName] bununla ilgilenebilir."

 agot_rebuilding_ruins.2000.d.tt:0 "Sorunu çözmek için [physician.GetNamePossessiveNoTooltip] becerilerine güvenirsin"

 agot_rebuilding_ruins.2000.e:0 "Bazı bitkilerden yapılacak bir infüzyon yardımcı olabilir."

 agot_rebuilding_ruins.2001.t:0 "Açığa Çıkan Gizem"

 agot_rebuilding_ruins.2001.desc:0 "Lanet olsun ya da olmasın, bir şey kalenin restorasyonunu aksatıyor ve kaynağını bulmalıyım."

 agot_rebuilding_ruins.2001.a:0 "Pekala... nereden başlamalı?"

 agot_rebuilding_ruins.2001.a.tt:0 "Nereye bakacağını bilmeden bu işin aslını öğrenmeyi deneyeceksin"

 agot_rebuilding_ruins.2001.b:0 "Sanırım benzer vakalar hakkında okumuştum..."

 agot_rebuilding_ruins.2001.b.tt:0 "Bunu araştırmak için bilgine güvenirsin "curse""

 agot_rebuilding_ruins.2001.c:0 "Hiçbir şey şüphemden kaçamaz."

 agot_rebuilding_ruins.2001.c.tt:0 "Sürekli uyanıklığın ipuçlarını bulmayı kolaylaştırır."

 agot_rebuilding_ruins.2001.d:0 "Ustabaşıyla konuşmam gerekiyor."

 agot_rebuilding_ruins.2001.d.tt:0 "Yönetimdeki deneyimin soruşturmana yardımcı olur"

 agot_rebuilding_ruins.2001.success:0 "Kaynağı keşfedersin"

 agot_rebuilding_ruins.2001.failure:0 "Kaynağı keşfedemezsin"

 agot_rebuilding_ruins.2002.t:0 "Çözülen Gizem"

 agot_rebuilding_ruins.2002.d:0 "Sonunda tüm bu belaya neyin yol açtığını keşfettim. Bunun nedeni öfkeli bir hayalet değil, sadece beceriksiz bir aşçıydı. İşçiler, çürük yiyeceklerle hazırlanan yemekleri yiyordu. Ateş, gıda zehirlenmesinden kaynaklanıyordu ve bu içten yanan ateş hikayeleri, saf işçilerin abartılmış karın ağrılarından başka bir şey değildi.\n\nBu mesele çözüldüğüne göre, çalışma devam edebilir."

 agot_rebuilding_ruins.2002.a:0 "Umalım ki başka olaylar yaşanmasın..."

 agot_rebuilding_ruins.2003.t:0 "Derinleşen Gizem"

 agot_rebuilding_ruins.2003.d:0 "Aramalarım hiçbir sonuç vermedi.\n\nBana güldüklerini duyuyorum, #italic kahretsin hayaletler!#!\n\nBu kale restore edilmiş görmeden ölürsem, her gökteki her tanrıya yemin ederim ki geri dönüp hepinizi rahatsız edeceğim!"

 agot_rebuilding_ruins.2003.a:0 "Bu kale beni öldürebilir!"

 agot_harrenhal_curse_gone:0 "Hayaletler kovuldu"

 agot_harrenhal_curse_not_gone:0 "Ateş, çalışmayı önemli ölçüde yavaşlatıyor"

 agot_rebuilding_ruins.2200.t:0 "Canlanan Ateş"

 agot_rebuilding_ruins.2200.desc_opening:0 "Sağanak yağmurun dinmeye niyeti yok ve tepede süzülen fırtına bulutları, Harrenhal'ın taşlarından bile daha kara. Ustabaşıyla konuşmak için bir an ayırıyorum.\n\nÖngörülemez havaya rağmen, bugün işin iyi ilerleyeceğini umuyordum; ama bu hesap"

 agot_rebuilding_ruins.2200.desc_zealous:0 "[ROOT.Char.GetFaith.HighGodName]'nin müdahalesi hesaba katılmamıştı.\n\n"

 agot_rebuilding_ruins.2200.desc_not_zealous:0 "bu sahayı tekrar tekrar rahatsız eden #italic kötü şans#! hesaba katılmamıştı.\n\n"

 agot_rebuilding_ruins.2200.desc_ending:0 "#italic GÜÜÜM!#! Yıldırım, Kingspyre Kulesi'ni vuruyor! Kara Dehşet bu göklerde uçtuğundan beri görülmemiş bir şiddetle kule, alevler içinde kalan bir meşaleye dönüşüyor. Tüm kuleler arasında vurulan tam da bu olmalıydı! İşçilerin yüzünde batıl inançtan beslenen paniğin yayıldığını görüyorum — müdahale etmezsem inşaat sahasının her yerine yayılabilecek bir panik..."

 agot_rebuilding_ruins.2200.a:0 "Yıldırım, lanetlerin tekelinde değildir. İşinize dönün!"

 agot_rebuilding_ruins.2200.success.tt:0 "İşçiler kendilerini toplar ve yangın kontrol altına alınır"

 agot_rebuilding_ruins.2200.success:0 "Halkı sakinleşmeye ikna edersin"

 agot_rebuilding_ruins.2200.failure.tt:0 "Panik kargaşa yaratır ve yangın gecikmelere yol açar"

 agot_rebuilding_ruins.2200.failure:0 "Halkı sakinleşmeye ikna edemezsin"

 agot_rebuilding_ruins.2200.b:0 "Ne kadar çok konuşursan "curses" the less time you're getting paid!"

 agot_rebuilding_ruins.2200.b_success.tt:0 "Halk uyarını dinler ve işine döner"

 agot_rebuilding_ruins.2200.b_failure.tt:0 "Halk uyarını dikkate almaz ve iş gecikir"

 agot_rebuilding_ruins.2200.b.tt:0 "Uyarın lanet söylentilerini keser ve işçiler alevleri söndürmek için koşuşur."

 agot_rebuilding_ruins.2200.c:0 "Korkman gereken şey lanetler değil."

 agot_rebuilding_ruins.2200.c.tt:0 "Karanlık şöhretin, lanet korkusunu gölgede bırakır ve işçileri yangını derhal boğmaya iter."

 agot_rebuilding_ruins.2200.d:0 "Alevler... çok muhteşemler..."

 agot_rebuilding_ruins.2200.d.tt:0 "Rahatsız edici tavrın, işçileri lanetlerin asla yapamayacağı kadar korkutur ve yangını söndürmek için çırpınırlar."

 agot_rebuilding_ruins.2300.t:0 "Veba Taşıyıcıları"

 agot_rebuilding_ruins.2300.desc:0 "İşçilerin çekiçlerinin sürekli şakırtısı benim için beyaz gürültüye dönüştü; şantiyede dolaşırken onu görmezden geliyorum. Ancak korkmuş işçilerin çığlıkları hemen dikkatimi çekiyor.\n\n"My [ROOT.Char.GetLadyLord]," says the foreman, rushing to greet me in the yard. I have already guessed the problem when I see the grey, matted forms of rodents squirming in all directions behind him. In a few words, I learn that the workers claim to have disturbed dormant spirits during the work, and they believe those spirits have sent armies of crawling pests through the castle as revenge.\n\nIf I can't go hunting for specters, I can certainly go hunting for rats."

 agot_rebuilding_ruins.2300.a:0 "Fare avcılarının var olma nedeni budur."

 agot_rebuilding_ruins.2300.b:0 "Fareler beni korkutmaz!"

 agot_rebuilding_ruins.2300.b.tt:0 "Bu ciddi sonuçlara yol açabilir. Bu canavarların ne tür bir kötülük taşıdığını kim bilir..."

 agot_rebuilding_ruins.2300.c:0 "[ROOT.Char.Custom('DogStoryName')]! Gel buraya!"

 agot_rebuilding_ruins.2300.c_cat:0 "[ROOT.Char.Custom('CatStoryName')], ne yapacağını biliyorsun..."

 agot_rebuilding_ruins.2300.c.tt:0 "Fareleri avlaması için evcil hayvanını gönderirsin"

 agot_rebuilding_ruins.2300.d:0 "Hepsini yakın!"

 agot_rebuilding_ruins.2300.d.tt:0 "Ateşin arındıramayacağı hiçbir kötülük yoktur"

 agot_rebuilding_ruins.2400.t:0 "Muhtaç Bir [bewitched.GetWomanMan|U]"

 agot_rebuilding_ruins.2400.desc:0 "Bir kez daha kendimi, Harrenhal'daki yeniden inşa çalışmalarını rahatsız eden bitmek bilmeyen iş akışının içinde buluyorum; çoğu zaman alacakaranlıktan sonraya dek beni şantiyede tutuyor. İşçilerden arınmış kale, amansız yağmur vınlaması dışında boğucu bir sessizlik atmosferi taşıyor.\n\nO neredeyse sessizlik, ayak seslerinin patırtısıyla bozuluyor: Sağanak yağmurun arasından karşımda güzel bir [bewitched.GetWomanMan] beliriyor. [bewitched.GetHerHis|U] gözleri bana bakıyor; sanki [bewitched.GetSheHe] ruhumun ta derinliklerini arıyor.\n\n[bewitched.GetSheHe|U] mütevazı giyimli; [bewitched.GetHerHis] sade giysilerinden tamamen ayrışan bir kolye hariç.\n\nDile baldan tatlı gelen pürüzsüz bir sesle [bewitched.GetSheHe] kendini tanıtıyor; [bewitched.GetFirstName], saygıyla yağmurdan sığınma istiyor."

 agot_rebuilding_ruins.2400.a:0 "Bu gece çatım senindir."

 agot_rebuilding_ruins.2400.a.tt:0 "Zavallı gezgini gece için kibarca ağırlamayı kabul edersin"

 agot_rebuilding_ruins.2400.b:0 "Burası bir meyhaneye mi benziyor? Defol!"

 agot_rebuilding_ruins.2400.b.tt:0 "Kadının kaleye girmesine izin vermeye hiç niyetin yok"

 agot_rebuilding_ruins.2401.t:0 "Kale'yi Aramak"

 agot_rebuilding_ruins.2401.desc_denied_witch:0 "Kaleye karanlık çöktü ve aklımda şu var: [bewitched.GetFirstName]'in, girişini reddettiğimden beri kalemde gizlice yaşadığı haberini aldım. [bewitched.GetSheHe|U] salonlarımda sanki onlara sahipmiş gibi dolaşıyor.\n\n[bewitched.GetHerHim]'i bulmayı kendime görev ediniyorum; Yüz Ocak Salonu'nu ve Avcı Salonu'nu aramama rağmen hiçbir sonuç yok. Saatler geçmiş gibi hissettikten sonra, Kingspyre Kulesi'nden Dul Kulesi'ne geçtiğimi fark ediyorum.\n\n"

 agot_rebuilding_ruins.2401.desc_restored_widow_tower:0 "Kule restore edildiğinden beri çok daha iyi görünüyor, ancak havada rahatsız edici bir şey asılı. Tüm akıl ve mantığın ötesinde bir şey. Bu [bewitched.GetWomanMan]'den mi geliyor?\n\n"

 agot_rebuilding_ruins.2401.desc_not_restored_widow_tower:0 "Kule, Harrenhal'daki neredeyse her şey gibi her zaman rahatsız edici bir aura yaymıştır; ancak bu tuhaf [bewitched.GetWomanMan] burada dururken bu his daha da baskın.\n\n"

 agot_rebuilding_ruins.2401.desc_ending:0 "[bewitched.GetHerHim]'i görüyorum; ay ışığı tam üzerinde, yumuşak solgun ışıkta neredeyse kırılgan görünüyor. Ama sonra [bewitched.GetSheHe] üzerime çullanıyor — elinde bir hançer, kabzası [bewitched.GetHerHis] kolyesindeki mücevherle parıldıyor..."

 agot_rebuilding_ruins.2401.a:0 "Kendimi savunmalıyım!"

 agot_rebuilding_ruins.2402.t:0 "Bir Uyanış Anı"

 agot_rebuilding_ruins.2402.desc_welcomed_witch:0 "Uykumda birinin bakışlarını üzerimde hissederek irkilerek uyanıyorum. Odama baktığımda olağandışı hiçbir şey ve beni izleyen kimse bulamıyorum.\n\nÇarşaflarımın arasından doğrulmaya başlarken yatağımda yanımda bir şey fark ediyorum: [bewitched.GetFirstNamePossessive] boynuna dolanmış olarak gördüğüm [harrenhal_soul.GetName].\n\nBu buradaysa, [bewitched.GetSheHe] de burada mıydı? [bewitched.GetSheHe] hâlâ kalede mi?"

 agot_rebuilding_ruins.2402.desc_denied_witch:0 "Bir çığlık atıyorum ve bir anlık şaşkınlığın ardından zihnimi saran sis dağılıyor. Çevremdeki oda yavaşça tanıdık bir netliğe kavuşuyor. Kendi yatağımdayım, şafak penceremden içeri süzülüyor, ama dün gece ne olduğunu hatırlayamıyorum.\n\n#italic Sadece bir rüyaydı...#! #bold ya da bir kabustu!#! Bu düşünce beni rahatlatıyor; ta ki yatağımda bir şey keşfedene dek: [harrenhal_soul.GetName], tertemiz."

 agot_rebuilding_ruins.2402.a:0 "Bunu kendime saklamalıyım."

 agot_rebuilding_ruins.2402.a.tt:0 "Bu hikaye seni rahatsız etse de, deli sanılmaktansa bunu tercih edersin"

 agot_rebuilding_ruins.2402.a.tt_2:0 "[bewitched.GetHerHim]'den hiçbir iz yok ve [bewitched.GetSheHe]'in hiç burada olduğuna dair bir işaret de yok. [bewitched.GetSheHe]'in burada olduğundan emin misin?"

 agot_rebuilding_ruins.2402.b:0 "[bewitched.GetHerHim]'i bulmak için mümkün olan her şeyi yapmalıyım!"

 agot_rebuilding_ruins.2402.b.tt:0 "Hiçbir şey başarmasa bile, kaygını bir şeye odaklamak için kaleyi alt üst etmeye karar veriyorsun; onarımları engellese bile"

 agot_rebuilding_ruins.2402.c:0 "Gördüğüm en tuhaf rüya değil."

 agot_rebuilding_ruins.2402.d:0 "[ROOT.Char.GetFaith.HighGodName] bana ihtiyacım olan gücü verecek!"

 agot_rebuilding_ruins.2500.t:0 "Kaçan Ustabaşı"

 agot_rebuilding_ruins.2500.desc:0 "Harrenhal'ın laneti inşaatı ve rüyalarımı rahatsız etmeye devam ederken, işçilerin kendileri de sarsılmaya başlıyor. Artık ustabaşı, güvenliğini benim altınıma tercih ederek gitmeye kararlı. Bu lanetli yerde çalışmaya razı birini bulabileceğimi pek sanmıyordum, ama bana iki potansiyel yedek önerme nezaketini gösterdi.\n\nBiri deneyimsiz ve bu yüzden daha ucuz, ancak cesaretsiz değil — yine de yakın gözetime ihtiyacı olacak. Diğeri deneyimli ama bu yerin lanetlerinden korkuyor; cesareti için ağır bir bedel ödemediğim sürece. Kimse istemeden, üçüncü bir adam beni görmeye geldi: tavrı tuhaf, fiyatı makul, ancak deneyimi hakkında sorulduğunda kaçamak cevaplar veriyor."

 agot_rebuilding_ruins.2500.a:0 "İşçilere, bütçelediğimden daha fazla harcamayacağım."

 agot_rebuilding_ruins.2500.a.tt:0 "Paradan çok zaman harcamayı tercih ediyorsun. Yine de genç ustabaşının şantiyede rahat etmesine nasıl yardım edeceğini seçmek zorunda kalacaksın"

 agot_rebuilding_ruins.2500.b:0 "Bu projenin bitmesini istiyorum, bedeli ne olursa olsun."

 agot_rebuilding_ruins.2500.b.tt:0 "Her şeyin yolunda gitmesini sağlamak için fahiş bir meblağ ödemeyi kabul ediyorsun"

 agot_rebuilding_ruins.2500.c:0 "Bu üçüncü adam hakkında daha fazlasını dinleyeceğim."

 agot_rebuilding_ruins.2500.c.tt:0 "Bu kişi ne kadar gizemli olursa olsun, ilk ikisine bir alternatif teşkil ediyor"

 agot_rebuilding_ruins.2500.continue:0 "Harrenhal'ın restorasyonu devam ediyor."

 agot_rebuilding_ruins.2500.foreman_flee:0 "Bu "foreman" disappears with your money."

 agot_rebuilding_ruins.2500.foreman_robbed:0 "Harrenhal'da çalışmayı kabul eden yeni bir ustabaşı bulunana dek inşaat sahası kesintiye uğrayacak."

 agot_rebuilding_ruins.2501.t:0 "Yeni Ustabaşı"

 agot_rebuilding_ruins.2501.desc:0 "Korktuğum gibi, yeni ve deneyimsiz ustabaşım teslim tarihlerini karşılamakta ve işçileri işe odaklamakta zorlanıyor. Ona para kazandırmış olabilirim, ama verimsizliği yüzünden daha fazlasını kaybedebilirim. İnşaatı kendim denetleyerek ya da saray mensuplarımdan birini görevlendirerek bununla mücadele etmenin bir yolunu bulmalıyım.\n\nHer halükarda, bu proje ilerlemeli!"

 agot_rebuilding_ruins.2501.a:0 "Bunu kendim halledeceğim."

 agot_rebuilding_ruins.2501.a.success:0 "Sorunları başarıyla halledersin"

 agot_rebuilding_ruins.2501.a.failure:0 "Daha fazla soruna yol açarsın"

 agot_rebuilding_ruins.2501.b:0 "Yavru kuşların uçmasına nasıl yardım edileceğini bilirim."

 agot_rebuilding_ruins.2501.c:0 "[steward.GetName], bununla ilgilen."

 agot_rebuilding_ruins.2501.c_success:0 "[steward.GetName] sorunları başarıyla halleder"

 agot_rebuilding_ruins.2501.c_failure:0 "[steward.GetName] hata yapar ve daha fazla soruna yol açar"

 agot_rebuilding_ruins.2501.d:0 "[architect.GetName], bu tam senlik."

 agot_rebuilding_ruins.2501.d_failure:0 "[architect.GetName] hata yapar ve daha fazla soruna yol açar"

 agot_rebuilding_ruins.2600.t:0 "Yalanların Habercisi"

 agot_rebuilding_ruins.2600.desc:0 "Bir kişinin talihsizliği, başkasının sevincidir, denir ve birçok ozan ile çalgıcı bunun doğruluğunu şarkıyla garanti eder. Ozanlar çoğu zaman gerçeği şekillendirir; kan dökülmesini ve acı kavgaları, kederi gösteriye ve aptallığı şöhrete dönüştüren dizelere çevirir.\n\nBöyle bir çalgıcı Harrenhal'a geldi. [bard.GetSheHe]'in kötü şöhretli karanlık kuzgunu olan [bard.GetName], meyhanelerde [bard.GetHerHis] bardağını ve saraylarda [bard.GetHerHis] kesesini dolduracak şarkılar için ilham arıyor.\n\nİşçiler, çizmelerine giren bir çakıl taşı olmadan da yeterince tedirgin. Bu şarkıcıyla uğraşırken dikkatli olmalıyım."

 agot_rebuilding_ruins.2600.a:0 "Onu buraya kadar altın getirdiyse, altın onu uzaklaştırabilir."

 agot_rebuilding_ruins.2600.a.tt:0 "Ozan, sorun çıkarmadan ayrılır"

 agot_rebuilding_ruins.2600.a.ttwo:0 "Ozan ayrılır... ve toprakların genelinde sana yönelik iğrenç şarkılar yayar"

 agot_rebuilding_ruins.2600.a.toast:0 "Ozan ayrılır"

 agot_rebuilding_ruins.2600.b:0 "Biri şu serseriyle ilgilensin!"

 agot_rebuilding_ruins.2600.b.tt:0 "Kaptanlarından biri, birkaç muhafızla ozanı durdurmayı gönüllü olarak üstlenir"

 agot_rebuilding_ruins.2600.b.ttwo:0 "Kaptan, sorunsuz bir şekilde ozanı hapse atmayı başarır"

 agot_rebuilding_ruins.2600.b.tthree:0 "Ozan hapse atılır, ancak yakalanması birkaç küçük kazaya yol açar"

 agot_rebuilding_ruins.2600.b.tfour:0 "Ozanın kaçma girişimi, onun, kaptanın ve tersanenin aleyhine sonuçlanır"

 agot_rebuilding_ruins.2600.b.toast:0 "Ozan, hiçbir sorun yaşanmadan tutuklanır."

 agot_rebuilding_ruins.2600.b.toast_two:0 "Ozan tutuklanır ancak insanlar yaralanır"

 agot_rebuilding_ruins.2600.b.toast_three:0 "Ozan tutuklanır, ancak ağır bir bedelle"

 agot_rebuilding_ruins.2600.c:0 "Ben de bir bakıma ozanımdır!"

 agot_rebuilding_ruins.2600.c_success:0 "[bard.GetName]'i ozanlar savaşında yenersin"

 agot_rebuilding_ruins.2600.c_failure:0 "[bard.GetName] seni ozanlar savaşında yener"

 agot_rebuilding_ruins.2600.d:0 "Bir ejderhanın soluyabildiği şeyin yanında sözler rüzgardır."

 agot_rebuilding_ruins.2600.d.tt:0 "Ozan, Harrenhal'ın gölgesinden korkmuyorsa, [dragon.GetName]'in gölgesinden korkacaktır"

 agot_rebuilding_ruins.2700.t:0 "Yeşil Adam"

 agot_rebuilding_ruins.2700.desc:0 "Harrenhal'daki işçiler, geceleri görülen bir ruhtan fısıltıyla söz ediyor. Normalde buna kulak asmazdım — ne de olsa burası Harrenhal ve nasıl bir kale inşa ettiğimizi biliyorduk. Ancak son zamanlarda dinlemeye meyilliyim; işçiler, karanlıkta gezen Yüzler Adası'nın bir #italic yeşil adamı#!na altın adaklar bıraktıklarını anlatıyor.\n\nHikayelere hâlâ inanmasam da, koca masalların yeşerdiği yerde iş yavaşlar ve bizi programa geri döndürmeliyim. Bu altına aç ruhtan nasıl kurtulacağım?"

 agot_rebuilding_ruins.2700.a:0 "Sadece altının nereye bırakıldığını izlemem... ve beklemem gerekiyor."

 agot_rebuilding_ruins.2700.a.tt:0 "Bu #italic bağış toplayıcısını#! suçüstü yakalamak istiyorsan, ihtiyatlı olmalısın"

 agot_rebuilding_ruins.2700.a.toast:0 "Yeşil adam hakkındaki soruşturman başarısız olur"

 agot_rebuilding_ruins.2700.a.duel_win_tt:0 "#italic Bağış toplayıcısını#! keşfedersin!"

 agot_rebuilding_ruins.2700.a.duel_loss_tt:0 "#italic Bağış toplayıcısını#! keşfedemezsin!"

 agot_rebuilding_ruins.2700.b:0 "Yeşil adamlar böyle bir şey yapmazlar."

 agot_rebuilding_ruins.2700.b_tt:0 "Eski Tanrılar hakkındaki bilginle halkı ikna etmeyi denersin"

 agot_rebuilding_ruins.2700.b_duel_win_tt:0 "Halk ikna olur"

 agot_rebuilding_ruins.2700.b.toast_win:0 "Halkı ikna edersin"

 agot_rebuilding_ruins.2700.b_duel_loss_tt:0 "Halk ikna olmaz"

 agot_rebuilding_ruins.2700.b.toast_loss:0 "Onları ikna edemezsin"

 agot_rebuilding_ruins.2700.b_tt_old_gods:0 "Tanrıların hakkındaki bilgin halkı ikna eder"

 agot_rebuilding_ruins.2700.d:0 "Avı takip etme konusunda kimseden geri kalmam."

 agot_rebuilding_ruins.2700.d.tt:0 "İz sürmedeki deneyimin işe yarayacak"

 agot_rebuilding_ruins.2700.e:0 "Bu yeşil adamı alt edebilirim."

 agot_rebuilding_ruins.2700.e.tt:0 "Aldatmadaki hünerin, yeşil adamın oyunlarını görmeni sağlayacak"

 agot_rebuilding_ruins.2700.f:0 "Eski Tanrılar'ın kutsamasını almalıyım."

 agot_rebuilding_ruins.2700.f.tt:0 "Belki bu mütevazı bağış sana ilahi bir lütuf kazandırabilir"

 agot_rebuilding_ruins.2700.f.toast:0 "Yüzler Adası'nın tanrıları sana sağır kalıyor."

 agot_rebuilding_ruins.2700.f.toasttwo:0 "Sende bir şeyler değişti... tanrılar dinliyor muydu?"

 agot_rebuilding_ruins.2701.t:0 "Sahte Ruh"

 agot_rebuilding_ruins.2701.desc:0 "Demek ünlü #italic yeşil adam#! buymuş. [green_man.GetName] adıyla anılan ve herhangi bir çiftçiden daha gizemli olmayan bu adam, #italic gerçek#! yeşil adamların efsanelerini taklit eden bir kıyafetle — taç olarak yapraklar ve başlık olarak geyik boynuzları dahil — insanların saflığından yararlanmakla yetiniyordu.\n\nŞimdi onunla ne yapacağıma karar vermeliyim. Aldatmacasını ifşa edersem, işçiler rahatlayacak ve görevlerine dönecek. Öte yandan, altın adaklarında oldukça cömert davranıyorlar..."

 agot_rebuilding_ruins.2701.a:0 "Herkes 'yeşil adam'ın kimliğini öğrenecek."

 agot_rebuilding_ruins.2701.a.tt:0 "İşçiler gönül rahatlığıyla görevlerine döner"

 agot_rebuilding_ruins.2701.b:0 "Yeteneklisin... bildiğin her şeyi bana öğret."

 agot_rebuilding_ruins.2701.b.tt:0 "Birkaç ders karşılığında dolandırıcının oyununu sürdürmesine izin verirsin"

 agot_rebuilding_ruins.2701.c:0 "Kazanılacak çok altın var... ama onu kazanacak olan sadece birimiz olacak."

 agot_rebuilding_ruins.2701.c.tt:0 "Yeşil adamın yerini alır ve işçilerin bağış yapmaya devam etmesine izin verirsin"

 agot_rebuilding_ruins.2800.t:0 "Görüler Ağacı"

 agot_rebuilding_ruins.2800.desc_opening:0 ""We must take down this... #italic thing#!! My [ROOT.GetCharacter.GetLadyLord], who knows what is watching us through those eyes?"\n\nUntil now, it was the haunting ghosts of Harrenhal that unsettled my workers, but today it is something more tangible that agitates them. One of the workers, [worker.GetName], claims that the heart tree of the fortress's godswood carries an ancient evil, and that it must be cut down."

 agot_rebuilding_ruins.2800.desc_weirwood:0 "\n\nNeck'in güneyinde zaten çok fazla kalp ağacı kesildi!"

 agot_rebuilding_ruins.2800.desc_no_weirwood:0 "\n\nİşçiler arasında bu ağaçlardan ve bu salonlardan korku duyan birçok kişi var. [worker.GetNameNoTooltip]'in devam etmesine izin verirsem daha da tedirgin olurlar."

 agot_rebuilding_ruins.2800.desc_weirwood_craven:0 "\n\nO gözler bana bakmaktan hiç vazgeçmedi ve onların ardında yatan şeyin gazabını üzerime çekersem ne olacağından korkuyorum."

 agot_rebuilding_ruins.2800.desc_closing:0 ""It's out of the question!" I retort in a tone that shows no weakness. Despite this, [worker.GetNameNoTooltip] seems unlikely to back down. I now face a difficult choice."

 agot_rebuilding_ruins.2800.desc_closing_shy_craven:0 ""It's out of the question!" I retort, rousing what little courage I have to say it. Despite this, [worker.GetNameNoTooltip] seems unlikely to back down. I now face a difficult choice."

 agot_rebuilding_ruins.2800.a:0 "Bana başka seçenek bırakmıyorsun."

 agot_rebuilding_ruins.2800.a.tt:0 "[worker.GetNameNoTooltip]'in boyun eğmesi için güç kullan"

 agot_rebuilding_ruins.2800.b:0 "Söz konusu bile olamaz, demiştim!"

 agot_rebuilding_ruins.2800.b.duel_win_tt:0 "[worker.GetNameNoTooltip] ikna olur"

 agot_rebuilding_ruins.2800.modifier:0 "Halk işine döner, ancak ilerleme yine de iki ay gecikir"

 agot_rebuilding_ruins.2800.b.duel_loss_tt:0 "[worker.GetNameNoTooltip] ikna olmaz ve zorla uzaklaştırılması gerekir"

 agot_rebuilding_ruins.2800.c.tt:0 "İkinci girişim ilkinden daha ikna edici olacak"

 agot_rebuilding_ruins.2800.d:0 "Biri, lütfen, bir şey yapsın!"

 agot_rebuilding_ruins.2800.d.tt:0 "Bunu kendin çözemeyince, yardım dilenmeye tenezzül edersin"

 agot_rebuilding_ruins.2800.e:0 "Pekala, ver şu baltayı. Bunu ben bitireceğim."

 agot_rebuilding_ruins.2800.e.tt:0 "Gerçekten de bitirirsin — [worker.GetHerHim]'i de"

 agot_rebuilding_ruins.2800.a.win.title:0 "[worker.GetName]'in kanı kalp ağacının dibine dökülüyor"

 agot_rebuilding_ruins.2800.b.win.title:0 "[worker.GetName] iradene boyun eğer"

 agot_rebuilding_ruins.2800.b.loss.title:0 "[worker.GetName] dinlemeyi reddeder"

 agot_rebuilding_ruins.2800.d.win.title:0 "[worker.GetName] zamanında durdurulur"

 agot_rebuilding_ruins.2800.d.win.desc:0 "Diğer işçilerin hızlı müdahalesi seni hayatını riske atmaktan kurtarır."

 agot_rebuilding_ruins.2800.e.win.title:0 "[worker.GetName]'in kanı kalp ağacının dibine dökülüyor"

 agot_rebuilding_ruins.2801.t:0 "Kanayan Kalp"

 agot_rebuilding_ruins.2801.desc:0 "Akşam vakti kendimi ak ağaca geri dönerken buluyorum; kendi kendime, önceki olaydan kalan izlerin giderildiğinden emin olmak istediğimi söylüyorum. Talihsiz bir hikaye, ama belki de bu şekilde bitmesi en iyisiydi.\n\nBaşımı kaldırdığımda ak ağacın yüzünün bana baktığını görüyorum. Ağacın gözleri içimi delip geçerken, cildimde tuhaf bir his süzülüyor. Son ziyaretimde olmayan bir şey artık kabuğun arasından beliriyor gibi. Bu harabenin hayaletleri mi, yoksa bir büyünün etkisi altında mıyım bilmiyorum; ama ay ışığının altında özsu... olması gerekenden daha kırmızı görünüyor."

 agot_rebuilding_ruins.2801.desc_old_gods:0 "Yaprakların hışırtısında eski tanrıların seslerini duyuyorum."

 agot_rebuilding_ruins.2801.desc_craven:0 "#italic Direnmeye gücüm yok.#!"

 agot_rebuilding_ruins.2801.desc_inquisitive:0 "#italic Bilmek zorundayım!#!"

 agot_rebuilding_ruins.2801.desc_ending:0 "Bir adım yaklaşıp elimi yüzüne koyuyorum."

 agot_rebuilding_ruins.2801.a:0 "Bir şey görüyorum..."

 agot_rebuilding_ruins.2802.t:0 "Yeni Bir Şafak"

 agot_rebuilding_ruins.2802.desc:0 "#italic Öfkeli göklerden, akkor yağmur taşın üzerine düşer. Büyük hanımlar eğilip solarken geriye yalnızca gölge ve duman kalır. Şafak söker ve onunla birlikte yeni bir çağın başlangıcı gelir. Dehşet çöker ve hava onunla dolup taşar.#!\n\nGörü parçalanmış ve dağınık, ama içinde gizli bir anlam seziyorum. Görüyorum..."

 agot_rebuilding_ruins.2802.a:0 "...güç!"

 agot_rebuilding_ruins.2802.b:0 "...ölüm!"

 agot_rebuilding_ruins.2802.c:0 "...vaatlerle dolu bir gelecek!"

 agot_rebuilding_ruins.2802.d:0 "...Valyria'nın Kıyameti?"

 agot_rebuilding_ruins.2802.e:0 "...Harrenhal'ın laneti?"

 agot_rebuilding_ruins.2804.t:0 "Bitmeyen Dalga"

 agot_rebuilding_ruins.2804.desc:0 "#italic Tiz çığlıkların öncülük ettiği bitmek bilmeyen bir sürü; boğuk dilleri rüzgarla taşınıyor. Arkalarında çimenler sonsuza dek yatar ve kılıçları genç filizleri bile cesede dönüştürür. Uzun saçları rüzgarda kamçılanır, ölüm hayatlarına yön verir ve ateş sonlarını işaretler.#!\n\nGörü parçalanmış ve sürükleniyor, ama içinde gerçek bir şey seziyorum. Görüyorum..."

 agot_rebuilding_ruins.2804.a:0 "...ölümcül kılıçlar!"

 agot_rebuilding_ruins.2804.b:0 "...durdurulamaz bir güç!"

 agot_rebuilding_ruins.2804.c:0 "...öfkeli bir hücum!"

 agot_rebuilding_ruins.2804.d:0 "...açık bir alanda bir Dothraki sürüsü?"

 agot_rebuilding_ruins.2804.e:0 "...Uzun Gece?"
