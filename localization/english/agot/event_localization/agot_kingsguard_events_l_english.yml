l_english:

 agot_kingsguard.1001.t:0 "Yerine Gelen Bir Yemin: [AGOTGetTitledFirstNameNicknamedNoTooltip(dead_kingsguard)]"

 agot_kingsguard.1001.fallback.t:0 "Bozulan Bir Yemin: [AGOTGetTitledFirstNameNicknamedNoTooltip(removed_kg)]"

 agot_kingsguard.1001.desc.intro:0 "[dead_kingsguard.Custom2('MyCharacterIntroduction',ROOT.Char)|U], [dead_kingsguard.GetHerHis] ağır yeminini yerine getirdi ve beyaz pelerininin örtüsü altında bu dünyadan göçtü. [AGOTGetTitledFirstNameNicknamedNoTooltip(dead_kingsguard)], [dead_kingsguard.GetHerHis] [dead_kingsguard.GetAge][dead_kingsguard.Custom('GetAgeOrdinal')] yaşında [dead_kingsguard.GetDeathReason]."

 agot_kingsguard.1001.fallback.desc.intro:0 "[removed_kg.Custom2('MyCharacterIntroduction',ROOT.Char)|U] kendini rezil etti ve beyaz pelerini elinden alındı."

 agot_kingsguard.1001.desc.talented:0 "\n\n[dead_kingsguard.GetSheHe|U], akıl almaz bir üne sahip bir savaşçıydı. [dead_kingsguard.GetHerHim]'i elinde kılıçla görme bahtına erenler, [dead_kingsguard.GetHerHim]'in beden bulmuş [dead_kingsguard.GetFaith.WarGodName] gibi savaştığını anlatırdı. [dead_kingsguard.GetHerHis|U] çeliği artık [dead_kingsguard.GetHerHim]'in yanında yatıyor, ama diyarın dört bir yanındaki genç savaşçıların zihninde yüzyıllarca yankılanacak!"

 agot_kingsguard.1001.desc.suitable:0 "\n\n[dead_kingsguard.GetFirstNameNicknamedNoTooltip], silah becerisiyle iyi bir ün edinmiş, efendisi [king.GetTitledFirstNameRegnal]'in hizmetinde büyük bir soğukkanlılıkla kendini kanıtlamış usta bir [dead_kingsguard.Custom('KnightCultureNoTooltip')] idi."

 agot_kingsguard.1001.desc.passing:0 "\n\n[dead_kingsguard.GetSheHe|U], gürbüz ve güvenilir bir savaşçıydı; ne var ki kimse [dead_kingsguard.GetSheHe]'in savaşçıların en azılısı olduğunu söylemezdi."

 agot_kingsguard.1001.desc.unsuitable:0 "\n\n[dead_kingsguard.GetFirstNameNicknamedPossessiveNoTooltip] muhafızlıktaki yeri sorgulanabilirdi; ancak yeminle bağlı olduğundan değiştirilemezdi."

 agot_kingsguard.1001.desc.end:0 "\n\n[dead_kingsguard.GetHerHis] [dead_kingsguard.GetFaith.PositiveAfterLife]'e göçüyle birlikte, beyaz pelerinlerin namlı saflarındaki boşluğu doldurma görevi artık bana düşüyor."

 agot_kingsguard.1001.fallback.desc.end:0 "\n\n[removed_kg.GetHerHis] ayrılışıyla birlikte, beyaz pelerinlerin namlı saflarındaki boşluğu doldurma görevi artık bana düşüyor."

 agot_kingsguard.1001.a:0 "Bana diyarın en büyük şövalyelerini getirin!"

 agot_kingsguard.1001.a.tt:0 "Potansiyel adaylar önüne çıkarılacak."

 agot_kingsguard.1001.b:0 "Büyük lordların soylularını gönderin!"

 agot_kingsguard.1001.b.tt:0 "Büyük lordlar adaylarını gönderecek ama reddedilmeye içerleyebilirler."

 agot_kingsguard.1001.c:0 "Daha acil meseleler var."

 agot_kingsguard.1001.c.tt:0 "Onları kişisel muhafızına davet etmek için diyarındaki karakterlerle etkileşime gir."

 agot_kingsguard.1002.t:0 "Pelerini Devretme"

 agot_kingsguard.1002.desc.intro:0 "[dead_kingsguard.Custom2('MyCharacterIntroduction',ROOT.Char)|U], [dead_kingsguard.GetHerHis] ağır yeminini yerine getirdi ve beyaz pelerininin örtüsü altında bu dünyadan göçtü. [AGOTGetTitledFirstNameNicknamedNoTooltip(dead_kingsguard)], [dead_kingsguard.GetHerHis] [dead_kingsguard.GetAge][dead_kingsguard.Custom('GetAgeOrdinal')] yaşında [dead_kingsguard.GetDeathReason]."

 agot_kingsguard.1002.fallback.desc.intro:0 "[removed_kg.Custom2('MyCharacterIntroduction',ROOT.Char)|U] kendini rezil etti ve beyaz pelerini elinden alındı."

 agot_kingsguard.1002.desc.end:0 "\n\n[AGOTGetTitledFirstNameNicknamed(lord_commander)], diyarın en büyük şövalyelerini önüme getirdi; [ROOT.Char.Custom('KingsguardName')]'in en yeni üyesini aralarından seçebilirim."

 agot_kingsguard.1002.a:0 "[AGOTGetTitledFirstNameNicknamedNoTooltip(kingsguard_candidate_1)] kesin seçimdir!"

 agot_kingsguard.1002.b:0 "[AGOTGetTitledFirstNameNicknamedNoTooltip(kingsguard_candidate_2)], bir savaşçının boyuna posuna sahip!"

 agot_kingsguard.1002.c:0 "[AGOTGetTitledFirstNameNicknamedNoTooltip(kingsguard_candidate_3)], bu makam için biçilmiş kaftan!"

 agot_kingsguard.1002.d:0 "Hah, bunların hiçbiri olmaz."

 agot_kingsguard.1002.d.tt:0 "Kral Muhafızı'na atamak için diyarındaki karakterlerle etkileşime geç" #[ROOT.Char.Custom('KingsguardName')] <- this doesn't work in tooltips

 agot_kingsguard.1002.e:0 "Başka bir yere bakmam gerekecek."

 agot_kingsguard.1002.e.tt:0 "Kral Muhafızı'na atamak için diyarındaki karakterlerle etkileşime geç" #[ROOT.Char.Custom('KingsguardName')] <- this doesn't work in tooltips

 agot_kingsguard.1003.t:0 "Pelerini Devretme"

 agot_kingsguard.1003.desc.intro:0 "[dead_kingsguard.Custom2('MyCharacterIntroduction',ROOT.Char)|U], [dead_kingsguard.GetHerHis] ağır yeminini yerine getirdi ve beyaz pelerininin örtüsü altında bu dünyadan göçtü. [AGOTGetTitledFirstNameNicknamedNoTooltip(dead_kingsguard)] [dead_kingsguard.GetDeathReason]."

 agot_kingsguard.1003.fallback.desc.intro:0 "[removed_kg.Custom2('MyCharacterIntroduction',ROOT.Char)|U] kendini rezil etti ve beyaz pelerini elinden alındı."

 agot_kingsguard.1003.desc.no_options:0 "\n\nNe yazık ki [AGOTGetTitledFirstNameNicknamed(lord_commander)], diyarın soylularını dikkatle inceledikten sonra [ROOT.Char.Custom('KingsguardName')] içinde hizmet etmeye layık uygun aday bulunamadığını bildiriyor."

 agot_kingsguard.1003.desc.end:0 "\n\nDiyarın dört bir yanından çeşitli soyluların çocukları avluda toplandı; yanımdaki [AGOTGetTitledFirstNameNicknamed(lord_commander)], [ROOT.Char.Custom('KingsguardName')] içinde hizmet etmek için hangilerinin ideal aday olacağını not ediyor."

 agot_kingsguard.1005.opening:0 "[kingsguard_candidate.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_kingsguard.1005.opening_desc:0 "[ROOT.Char.Custom('KingsguardName')] içinde hizmet etmek benim için onur olur!"

 agot_kingsguard.1005.host_likes_me:0 "Umarım katılırsın, yoksa yokluğun çok aranır."

 agot_kingsguard.1005.host_gets_along_with_me:0 "Saygın bir [ROOT.Char.GetTitleAsNameNoTooltip] olarak, katılımınızla onur duyarım."

 agot_kingsguard.1005.host_dislikes_me:0 "Adı sanı duyulmuş herkesin orada olmasını bekliyorum, ne yazık ki buna sen de dahilsin."

 agot_kingsguard.1005.a:0 "Yeminlerini etmek için başkente geleceksin!"

 agot_kingsguard.1007.opening:0 "[kingsguard_candidate.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_kingsguard.1007.opening_desc:0 "[ROOT.Char.Custom('KingsguardName')] içindeki hizmeti geri çevirmek zorundayım.\n\n"

 agot_kingsguard.1007.faith:0 "Hayatımı senin tuhaf ve [ROOT.Char.Custom('InsultAdjective')] tanrılarına hizmete adamayacağım."

 agot_kingsguard.1007.claim:0 "İddialarımı ve unvanlarımı eski bir çift giysi gibi bir kenara atamam."

 agot_kingsguard.1007.lustful:0 "Bekâr bir yaşam için tenin zevklerinden vazgeçmeyi asla umamazdım!"

 agot_kingsguard.1007.ambitious:0 "Hayatımın önünde, sen lazımlığının başında son kaz ciğeri parçalarını geğirirken yanında dikilmekten çok daha büyük bir amaç var."

 agot_kingsguard.1007.reject:0 "Hanedanımın bana ihtiyacı, sarayından daha fazla."

 agot_kingsguard.1007.hate:0 "Yeminli kalkanın olarak hizmet etmektense, ölü bir domuzun şişmiş götünü öpmeyi tercih ederim."

 agot_kingsguard.1007.a:0 "Bu kez bana diyara hizmet edecek birini getirin!"

 agot_kingsguard.1007.a.tt:0 "Daha fazla şövalye çağırtacaksın."

 agot_kingsguard.1007.b:0 "[kingsguard_candidate.GetSheHe|U], [ROOT.Char.GetTitleAsNameNoTooltip]'lerini reddeder miymiş?!"

 agot_kingsguard.1008.t:0 "Bahşedilen Yeminler"

 agot_kingsguard.1008.desc:0 "[kingsguard_candidate.Custom2('MyCharacterIntroduction',ROOT.Char)|U], önümde diz çökerek hayatını benimkiyle değiştireceğine, sözüme itaat edip sırlarımı saklayacağına, benim isteğimle fikrini söyleyeceğine ya da dilini tutacağına ve adımın, hanedanımın ve tahtımın onurunu savunacağına yemin ediyor. [kingsguard_candidate.GetSheHe|U] ayağa kalkıyor ve tüm gücüyle bana, beni korumak için hayatını vereceğine dair söz veriyor."

 agot_kingsguard.1008.a:0 "Kalk, Ser [kingsguard_candidate.GetFirstNameNoTooltip]."

 agot_kingsguard.1009.t:0 "[kingsguard_candidate.Custom2('RelationToMeShort', SCOPE.sC('family_member') )|U]'nin Tepkisi"

 agot_kingsguard.1009.desc.mad:0 ""Arkamdan iş çevirip [family_member.Custom2('RelationToMeShort', kingsguard_candidate)]'i muhafızına atayabileceğini mi sanıyorsun, seni [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNoun')]!?" Benim [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('family_member') )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] [family_member.GetName], [kingsguard_candidate.GetNameNicknamedNoTooltip]'in kutsanma töreninden sonra öfkeyle yanıma geliyor. \n\n"

 agot_kingsguard.1009.desc.heir:0 ""Varisimi benden çalmış olabilirsin ama bunu unutmayacağım.""

 agot_kingsguard.1009.desc.glad:0 ""Sana teşekkür etmeliyim, [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip]; [family_member.Custom2('RelationToMeShort', kingsguard_candidate)]'e kraliyet muhafızlığında hizmet etme onurunu bahşettiğin için." Benim [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('family_member') )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] [family_member.GetName], [ROOT.Char.Custom('KingsguardName')]'in en yeni üyesi [kingsguard_candidate.GetFullName]'in atama töreninden sonra yanıma geliyor."

 agot_kingsguard.1009.a.mad:0 "Senin gibilere özür borcum yok."

 agot_kingsguard.1009.a.glad:0 "Gerçekten de, beni korumak bir onurdur."

 agot_kingsguard.1010.t:0 "Yoksun Bir Kardeşlik"

 agot_kingsguard.1010.desc.intro:0 "[dead_kingsguard.Custom2('MyCharacterIntroduction',ROOT.Char)]'in vefatıyla [ROOT.Char.Custom('KingsguardName')], liderlikten yoksun kaldı. "

 agot_kingsguard.1010.fallback.desc.intro:0 "[removed_kg.Custom2('MyCharacterIntroduction',ROOT.Char)]'in ayrılışıyla [ROOT.Char.Custom('KingsguardName')], liderlikten yoksun kaldı. "

 agot_kingsguard.1010.desc.end:0 "Şimdi [removed_kg.GetHerHis] çelik ayakkabılarını doldurma gibi kritik bir görev başlıyor. [AGOTGetTitledFirstName(kingsguard_successor)], bu iş için en uygun [kingsguard_successor.GetWomanMan] gibi görünüyor ve çoğunluk, [AGOTGetTitledFirstName(removed_kg)]'in yerine Kumandan olmasını bekliyor. Ancak seçim nihayetinde benim elimde."

 agot_kingsguard.1010.fallback.desc.end:0 "Şimdi [removed_kg.GetHerHis] çelik ayakkabılarını doldurma gibi kritik bir görev başlıyor. [ROOT.Char.Custom('KingsguardName')] boşalmışken, beyaz pelerine layık şövalyeler bulmak için en doğru zaman olabilir."

 agot_kingsguard.1010.a:0 "[AGOTGetName(kingsguard_successor)], makamın doğal varisidir."

 agot_kingsguard.1010.b:0 "[AGOTGetName(kingsguard_1)], [ROOT.Char.Custom('KingsguardName')]'e liderlik edecek."

 agot_kingsguard.1010.c:0 "[AGOTGetName(kingsguard_2)], [ROOT.Char.Custom('KingsguardName')]'e liderlik edecek."

 agot_kingsguard.1010.d:0 "[AGOTGetName(kingsguard_3)], [ROOT.Char.Custom('KingsguardName')]'e liderlik edecek."

 agot_kingsguard.1010.e:0 "Belki bir başkası [removed_kg.GetNamePossessive] yerini alır."

 agot_kingsguard.1010.f:0 "Kimse... kimse kalmadı."

 agot_kingsguard.1011.a:0 "[AGOTGetName(kingsguard_4)], [ROOT.Char.Custom('KingsguardName')]'e liderlik edecek"

 agot_kingsguard.1011.b:0 "[AGOTGetName(kingsguard_5)], [ROOT.Char.Custom('KingsguardName')]'e liderlik edecek"

 agot_kingsguard.1011.c:0 "[AGOTGetName(kingsguard_6)], [ROOT.Char.Custom('KingsguardName')]'e liderlik edecek"

 kingsguard_other_selections_available_tt:0 "Diğer muhafızlarımı değerlendireceğim"

 agot_kingsguard.2001.t:0 "[ROOT.Char.Custom('KingsguardName')] Tayini"

 agot_kingsguard.2001.desc:0 "[GetPlayer.Custom2('RelationToMe',SCOPE.sC('councillor'))] [councillor.GetShortUIName]'i, [target_character.GetUINamePossessive] sarayında önemli bir kişiyi korumak üzere görevlendirebilirim."

 agot_kingsguard.2001.desc_own_court:0 "[GetPlayer.Custom2('RelationToMe',SCOPE.sC('councillor'))] [councillor.GetTitledFirstName]'i, konuklarımdan ya da saray erkanımdan birini korumakla görevlendirebilirim."

 agot_kingsguard.2001.desc_bodyguard_courtowner:0 "Alternatif olarak, [target_character.GetTitledFirstName]'e [target_character.GetHerselfHimself] için bir muhafız tayin edebilirim."

 agot_kingsguard.2001.a:0 "Belirlenen hedefi koru."

 agot_kingsguard.2001.b:0 "[target_character.GetTitledFirstName]'i koru."

 agot_kingsguard.2001.c:0 "Aslında, boşver."

 indicate_bodyguard_target:0 "[councillor.GetTitledFirstName], [si_target.GetShortUIName]'i korumaya başlar."

 set_relation_bodyguard_first:0 "[TARGET_CHARACTER.GetUIName], [CHARACTER.GetUIName]'i korumaya başlar."

 agot_kingsguard.2002.title:0 "Kaçak [ROOT.Char.Custom('KingsguardName')]!"

 agot_kingsguard.2002.desc:0 "[recipient.GetTitledFirstName], yakalanmaktan kurtulmayı başardı ve şehre kaçtı! Belki [recipient.GetHerHis] kaçışını engellemek için hâlâ zaman vardır.\n\n[kingsguard.GetName] nöbette ve [recipient.GetNameNoTooltip]'i yolda yakalayabilir; ya da [goldcloaks.GetName]'e haber gönderip Şehir Muhafızları'nın tüm gücünü ayağa kaldırabilirim."

 agot_kingsguard.2002.a:0 "[kingsguard.GetName], yeminli kardeşini bana geri ver!"

 agot_kingsguard.2002.a.failure:0 "[recipient.GetName] kaçacak"

 agot_kingsguard.2002.b:0 "[goldcloaks.GetTitledFirstName], onu yakala!"

 agot_kingsguard.2002.c:0 "Bırak [recipient.GetHerHim] gitsin; [recipient.GetSheHe] bana bir tehdit değil."

 agot_kingsguard.2003.title:0 "Kaçak [ROOT.Char.Custom('KingsguardName')]!"

 agot_kingsguard.2003.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fleeing_kingsguard'))] sığınma talebiyle sarayıma geldi. [crown.GetTitledFirstNamePossessive], [fleeing_kingsguard.GetFirstName]'i uydurma bir suçlamayla tutuklatmaya çalıştı ve artık [fleeing_kingsguard.GetSheHe], [fleeing_kingsguard.GetHerselfHimself]'i diyarın bir kaçağı olarak buluyor. Şimdi ne yapacağıma karar verirken, görevimle ailem arasında zor bir seçim yapmalıyım."

 agot_kingsguard.2003.a:0 "Sen benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fleeing_kingsguard'))]'imsin ve yerin burası."

 agot_kingsguard.2003.b:0 "Duvar'a gidersen, [crown.GetTitledFirstNamePossessive] erişiminin dışında olursun!"

 agot_kingsguard.2003.c:0 "Dar Deniz'in ötesine kaçmalısın!"

 agot_kingsguard.2003.d:0 "Üzgünüm [fleeing_kingsguard.GetFirstName], ama bir kaçağı barındıramam."

 agot_kingsguard.3001.t:0 "Bir Çocuğun Hayali"

 agot_kingsguard.3001.desc:0 "Küçük [child.GetFirstName] her zaman [king.Custom('KingsguardName')] hikâyelerine tutkun oldu; en çok da [lord_commander.GetTitledFirstName]'e; [lord_commander.GetHerHim]'i, Ayna Kalkanlı Ser [GetScriptedCharacterByHistoryID('Heroes_25').GetFirstName] ve Yıldız Gözlü Ser [GetScriptedCharacterByHistoryID('Heroes_24').GetFirstName] ile aynı ışıkta görüyor.\n\n[child.GetHerHis] bu efsane figürlere benzeme hayallerine pek önem vermedim; çünkü tüm çocukların öykündüğü kahramanlar vardır. Ama [child.GetFirstNameNoTooltip] büyüdükçe, [child.GetHerHis] [king.Custom('KingsguardName')]'ine katılma hayali her geçen gün daha gerçek oldu. Daha bugün önüme çıkıp, [king.GetTitledFirstNamePossessive] [king.Custom('KingsguardName')] üyesi olmak için eğitime başlayabilmesi adına [child.GetHerHim] için planlamış olabileceğim nişanları bir kenara bırakmamı istedi."

 agot_kingsguard.3001.a:0 "Elbette, küçük hanım."

 agot_kingsguard.3001.b:0 "Aileye karşı görevin, taca karşı görevinden önce gelir."

 agot_kingsguard.3002.t:0 "Şövalyeliğin Bir Feneri"

 agot_kingsguard.3002.desc:0 "Dikkatimi çekti ki [ROOT.Char.Custom('KingsguardName')]'imden [gallant_kingsguard.GetFirstNameNicknamed], diyarın diline düştü. Halk [gallant_kingsguard.GetHerHim]'den efsane savaşçılarla aynı nefeste söz ediyor; oynayan genç yaverler [gallant_kingsguard.GetHerHis] edasını takınıp [gallant_kingsguard.GetHerHis] en büyük savaşlarındaki kahramanlıklarını canlandırıyor ve genç kızlar, [gallant_kingsguard.GetHerHis] şöhretindeki bir [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'ine lütuflarını bahşetmeyi hayal ediyor.\n\nBu söylentiler artık sarayımı da sardı. Sarayın [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'leri [gallant_kingsguard.GetHerHis] işlerini taklit etmeye çalışıyor ve sarayın [gallant_kingsguard.Custom('AttractionWomanManMultiple')]'leri [gallant_kingsguard.GetHerHis] ilgisi için yarışıyor. Artık [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] boyunca [gallant_kingsguard.GetFirstNameNoTooltip] adının beceri, onur ve şövalyelikle eşanlamlı olması olağan bir durum."

 agot_kingsguard.3002.a:0 "Seni takdir ediyorum, Ser [gallant_kingsguard.GetFirstNameNoTooltip]."

 agot_kingsguard.3002.b:0 "En sevdiğim konudan konuşmayı tercih ederim: kendimden."

 agot_kingsguard.3003.t:0 "Aleni [ROOT.Char.Custom('KingsguardName')|U]: Suçüstü Yakalandı!"

 agot_kingsguard.3003.desc_bedroom:0 ""Hazretleri, [ROOT.Char.Custom('KingsguardName')]'inizden [lusty_kingsguard.GetName], [lusty_kingsguard.GetHerHis] odasında, ta kendisi [lusty_lover.GetFullName] ile eğlenirken yakalandı!"

 agot_kingsguard.3003.desc_brothel:0 ""Hazretleri, [ROOT.Char.Custom('KingsguardName')]'inizden [lusty_kingsguard.GetName], bir zevk evinin karanlık köşelerinde, namlı fahişe [lusty_lover.GetName] ile edepsizce işlerle uğraşırken yakalandı!""

 agot_kingsguard.3003.a:0 "Bu yeminbozanla ne yapacağıma karar verene dek [lusty_kingsguard.GetHerHim]'i zindana at."

 agot_kingsguard.3003.b:0 "[lusty_kingsguard.GetHerHim]'i sakatla ve [lusty_kingsguard.GetHerHim]'i Gece Nöbeti'ne katılmaya gönder."

 agot_kingsguard.3003.c:0 "[lusty_kingsguard.GetHerHim]'i [lusty_kingsguard.GetHerHis] beyaz pelerininden yoksun bırak."

 agot_kingsguard.3003.d:0 "Herkesin kendince kusurları olur..."

 agot_kingsguard.3003.e:0 "Beyaz pelerinin sende kalabilir ama [lusty_lover.GetFirstNameNoTooltip] benimdir."

 agot_kingsguard.3004.t:0 "[ROOT.Char.Custom('KingsguardName')|U] için Yol Açın!"

 agot_kingsguard.3004.desc:0 ""[ROOT.Char.Custom('KingsguardName')] için yol açın!" Bağırış taht salonunun ucundan yankılandı. Tam zamanında dönüp [marching_kingsguard.GetNameNicknamed]'in, endişe verici bir hızla yürüyerek [marching_kingsguard.GetHerHis] yolunda aptal aptal dikilen genç [obstructing_brat.GetName]'e bağırdığını izliyorsun. \n\nİster inat olsun ister cehalet, [obstructing_brat.GetName] mesajı almıyor. Çocuk, [ROOT.Char.Custom('KingsguardName')]'imin yere vuran topuğunun altında eziliyor; muhafız, [obstructing_brat.GetHerHim]'in içinden bir su birikintisine basmış gibi kayıtsız bir bakışla geçip gidiyor.\n\nÇizmenin altında ezilen [obstructing_brat.GetName] artık mahkeme salonunun zemininde acıyla inleyerek yatıyor ve [marching_kingsguard.GetName], sabah nöbeti için yolunu bana doğru sürüyor."

 agot_kingsguard.3004.a:0 "Kimse [ROOT.Char.Custom('KingsguardName')]'i [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] işi sırasında bölemez."

 agot_kingsguard.3004.b:0 "[marching_kingsguard.GetName], deli misin?! Git [obstructing_brat.GetName]'i ayağa kaldır."

 agot_kingsguard.3004.c:0 "Çocuğu Üstad'a gönder."

 agot_kingsguard.3004.cure_toast:0 "Üstat [obstructing_brat.GetName]'i Başarıyla Tedavi Etti"

 agot_kingsguard.3004.toast:0 "Üstat Başarısız Oldu"

 agot_kingsguard.3004.toast_desc:0 "[obstructing_brat.GetName] yaralı kalmaya devam ediyor."

 agot_kingsguard.3005.t:0 "[essosi_warrior.GetSheHe|U] Hararetle Tavsiye Ediliyor"

 agot_kingsguard.3005.desc:0 "[sponsor.GetTitledFirstName], bana yabancı bir [essosi_warrior.GetWomanMan] ile taht salonuna giriyor.\n\n"Efen[ROOT.Char.GetLadyLord]," diye hırıldıyor [sponsor.GetFirstNameNoTooltip], yüzünde gururlu bir ifadeyle. "Sizi Essos'un gördüğü en büyük savaşçıyla tanıştırmak benim için onurdur. [essosi_warrior.GetFirstNameNoTooltip], Braavos'tan Asshai'ye dek bilinir ve [essosi_warrior.GetSheHe], [ROOT.Char.Custom('KingsguardName')]'inize mükemmel bir katkı sağlar.""

 agot_kingsguard.3005.a:0 "[ROOT.Char.Custom('KingsguardName')]'e hoş geldin!"

 agot_kingsguard.3005.agot_kingsguard.tt:0 "[essosi_warrior.GetName], senin [GetPlayer.Custom('KingsguardName')]'ine katılacak "

 agot_kingsguard.3005.b:0 "Belki başka bir pozisyon alırsın?"

 agot_kingsguard.3005.court_position.tt:0 "[essosi_warrior.GetName] için uygun bir makam bulacaksın."

 agot_kingsguard.3005.c:0 "Daha fazla saray erkanına ihtiyacım yok."

 agot_kingsguard.3006.t:0 "[ROOT.Char.Custom('KingsguardName')]: Silah Kardeşleri"

 agot_kingsguard.3006.desc:0 "[friendly_kingsguard.GetFullName], dışa dönük türden bir [friendly_kingsguard.GetWomanMan]; her zaman sohbet başlatmaya ya da bir sohbetin içine girmeye hevesli. [ROOT.Char.Custom('KingsguardName')]'imin daha vakur üyelerine ters gelse de, [kingsguard_friend.GetFullName] ile kardeşlerden ayırt edilemez olmuşlar.\n\nBirlikte talim yapıyor, birlikte kahvaltı ediyor ve her savaşın kıyıcısında birbirlerini yüreklendirerek yan yana bulunuyorlar. Bu iki savaşçı arasındaki kan bağı, sarayda herkesin diline dolandı; bu bağın [ROOT.Char.Custom('KingsguardName')] içindeki gücü, yönetimimi daha da sağlamlaştırmaya hizmet eder."

 agot_kingsguard.3006.a:0 "Dostlukları onları daha büyük yiğitliklere götürsün!"

 agot_kingsguard.3007.notification:0 "[ROOT.Char.Custom('KingsguardName')] Gelişti"

 agot_kingsguard.3007.desc:0 "[improved_kingsguard.GetNamePossessive] avludaki saatlerce süren talimi ve [improved_kingsguard.GetHerHis] yeminlerine bağlılığı bu gelişmeyi sağladı."

 agot_kingsguard.3008.t:0 "[candidate.GetSheHe|U] Hararetle Tavsiye Ediliyor"

 agot_kingsguard.3008.desc:0 "[sponsor.GetTitledFirstName], bana yabancı bir [candidate.GetWomanMan] ile taht salonuna giriyor.\n\n"Efen[ROOT.Char.GetLadyLord]," diye hırıldıyor [sponsor.GetFirstNameNoTooltip], yüzünde gururlu bir ifadeyle. "Sizi [candidate.GetFullNameNoTooltip] ile tanıştırmak benim için onurdur. [candidate.GetSheHe|U], kayda değer bir askeri yeteneğe sahip, son derece kudretli bir [candidate.GetWomanMan]; evliliği ve unvanları, bir gün [ROOT.Char.Custom('KingsguardName')]'inize katılma umuduyla bir kenara bırakmıştır.""

 agot_kingsguard.3008.a:0 "[ROOT.Char.Custom('KingsguardName')]'e hoş geldin!"

 agot_kingsguard.3008.agot_kingsguard.tt:0 "[candidate.GetName], senin [GetPlayer.Custom('KingsguardName')]'ine katılacak "

 agot_kingsguard.3008.b:0 "Belki başka bir pozisyon alırsın?"

 agot_kingsguard.3008.b.tt:0 "[candidate.GetName]'e, bir yer boşaldığında makam verileceğine dair söz verilecek."

 agot_kingsguard.3008.c:0 "Senin gibilerin beni koruyacağı kadar umutsuz değilim."

 agot_kingsguard.3010.t:0 "[strong_kingsguard.GetHerHis] Alnının Teri"

 agot_kingsguard.3010.desc:0 "[ROOT.Char.Custom('KingsguardName')]'imden [strong_kingsguard.GetFullName], tüm vaktini Kale'nin avlularında ve ahırlarında geçirmeye başladı; ancak diğerleri yalnızca kılıç veya binicilik talimi yaparken, [strong_kingsguard.GetFirstNameNoTooltip] her dakikayı giderek daha yorucu ve zorlu fiziksel işler arayarak geçiriyor gibi.\n\nFark [strong_kingsguard.GetHerHis] görünümünde açıkça görülüyor; [strong_kingsguard.GetHerHis] bedeni giderek daha zorlu, yoğun ve sağlam bir hal aldı; bu da, [strong_kingsguard.GetFirstNameNoTooltip] iş başındayken avlunun çevresinde her zaman bulunabilen, hayran hayran bakan sarayın [strong_kingsguard.Custom('AttractionGirlBoyPlural')]'lerinin ilgisini çekiyor."

 agot_kingsguard.3010.a:0 "Belki bir portre için modellik yapabilirsin, [strong_kingsguard.Custom('SisterBrother')]!"

 agot_kingsguard.3011.t:0 "Bir Meydan Okuyan Yaklaşıyor"

 agot_kingsguard.3011.desc:0 "Müjdeci [challenger.GetFullName]'in gelişini duyurduğunda, sıkıcı saray günü kuşkusuz canlandı; taht salonuna bir dilekçe için değil de savaş alanı için giyinmiş halde yürüdü.\n\n"Benim [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip]'im," diye başlıyor [challenger.GetSheHe], [challenger.GetHerHim]'i öne çağırdığımda. "[ROOT.Char.Custom('KingsguardName')], diyarın asil bir kurumudur. Ama şu andan itibaren vücudunuzu savunma şerefi bir kurtçukta. [unworthy_kingsguard.Custom('InsultAdjective')] [unworthy_kingsguard.Custom('InsultNoun')] [unworthy_kingsguard.GetFullName]'in sizin yanınızı kirletmeye hakkı yok!"\n\n[unworthy_kingsguard.GetFirstNameNoTooltip], kendisine hitap edildiğini fark edip aniden hazır ola geçiyor. "Efen[ROOT.Char.GetTitleAsNameNoTooltip]'im, [ROOT.Char.Custom('KingsguardName')] yeminli bir kardeşliktir. Ömür boyu hizmet ederiz; kanım, sizin kanınız için dökülmeye bağlıdır," diye kekelemektedir [unworthy_kingsguard.GetSheHe|l].\n\n"Bunda bir sorun yok," diye yanıtlıyor [challenger.GetName], [challenger.Custom('quirk_pos_pp')]. "Seni görevinden memnuniyetle azlederim.""

 agot_kingsguard.3011.a:0 "Öyleyse kapımı daha iyi olan adam beklesin."

 agot_kingsguard.3011.a.challenger.toast:0 "[challenger.GetTitledFirstName], [unworthy_kingsguard.GetTitledFirstName]'i öldürdü"

 agot_kingsguard.3011.a.unworthy_kingsguard.toast:0 "[unworthy_kingsguard.GetTitledFirstName], [challenger.GetTitledFirstName]'i öldürdü "

 agot_kingsguard.3011.b:0 "Evine dön, [challenger.GetTitledFirstNameNoTooltip]. [unworthy_kingsguard.GetTitledFirstNameNoTooltip], [unworthy_kingsguard.GetHerHis] maaşını fazlasıyla hak etti."

 agot_kingsguard.3011.c:0 "Kimse atamalarımı sorgulayamaz. Muhafızlar!"

 agot_kingsguard.3012.t:0 "Kırık Bir Hayal"

 agot_kingsguard.3012.desc:0 "Balkondan avludaki beceriksiz [failed_kingsguard.Custom('GetDaughterSon')]'ime aşağıdan bakıyorum. [failed_kingsguard.GetSheHe|U], [ruler.GetHerHis] hazretlerinin seçkin muhafızına katılma yolculuğuna başladığı günden bu yana neredeyse hiç ilerleme göstermeden avluda beceriksizce debeleniyor. Belki de araya girmeliyim. Sonuçta, [failed_kingsguard.GetHerHim]'in boş bir umutla devam etmesine izin vermek, bu aptallığı şimdi ve burada ezmekten daha zalimce değil mi?"

 agot_kingsguard.3012.a:0 "Bunu geride bırakmanın zamanı geldi."

 agot_kingsguard.3012.b:0 "Gece Nöbeti'nin her zaman iyi adamlara ihtiyacı vardır!"

 agot_kingsguard.3012.c:0 "[failed_kingsguard.GetSheHe|U] gelişecek!"

 agot_kingsguard.3013.t:0 "Hatırlanacak Bazı İçkiler"

 agot_kingsguard.3013.desc:0 "[drunken_kingsguard.GetFullName]'in, nöbeti dışındaki tüm vaktini yerel meyhanelerde ve içki dükkânlarında içip âlem yaparak geçirdiği biliniyor. [drunken_kingsguard.GetSheHe|U], şehirde ve sarayda nam salmaya başladı; herkesi masanın altında bırakacak kadar içmekten, kafasının üzerinde durarak koca bir Arbor altını fıçısını devirebilmeye varan hikâyeler anlatılıyor.\n\nŞimdi ise kulağıma, [drunken_kingsguard.GetFirstName]'in bir eşek ve bir petek balı bir geneleve götürdüğüne dair özellikle endişe verici bir hikâye ulaştı. Bu davranış, [ROOT.Char.Custom('KingsguardName')] üyesine yakışmaz gibi görünüyor; ama en hafif tabirle bazı ilginç anekdotlara yol açtı."

 agot_kingsguard.3013.a:0 "Hücrelerde geçireceği bir gece [drunken_kingsguard.GetHerHim]'i ayıltır."

 agot_kingsguard.3013.b:0 "[ROOT.Char.Custom('KingsguardName')] olmak yıpratıcı bir iş; [drunken_kingsguard.GetHerHim]'e dokunma."

 agot_kingsguard.3013.c:0 "[drunken_kingsguard.GetFullName], benim gönlümden geçen türden bir [drunken_kingsguard.GetWomanMan]!"

 agot_kingsguard.3014.t:0 "Kılıç Ustası [ROOT.Char.Custom('KingsguardName')]"

 agot_kingsguard.3014.desc:0 "[ROOT.Char.Custom('KingsguardName')]'imden [lifestyle_kingsguard.GetFullName], yanımda olmadığı zamanların çoğunu avlumda geçiriyor; [lifestyle_kingsguard.GetSheHe], diyarın en büyük savaşçılarıyla kılıç kılıca gelirken alnından terler akıyor.\n\n[lifestyle_kingsguard.GetNameNoTooltip], silah ustalarımın ve [GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName]'in tanıdık bir yüzü haline geldi ve [lifestyle_kingsguard.GetHerHis] kılıç mahareti sarayın diline düştü. [lifestyle_kingsguard.GetHerHim]'i, güneşin ilk doğuşundan son bakışına dek avluda görmek olağandışı değil. [lifestyle_kingsguard.GetNameNoTooltip], usta bir kılıç üstadı olarak nam kazandı."

 agot_kingsguard.3014.a:0 "Belki kılıç talimimde bana yardım edebilirsin, [lifestyle_kingsguard.GetFirstNameNoTooltip]?"

 agot_kingsguard.3015.t:0 "Avcı [ROOT.Char.Custom('KingsguardName')]"

 agot_kingsguard.3015.desc:0 "[ROOT.Char.Custom('KingsguardName')]'imden [lifestyle_kingsguard.GetFullName], yanımda olmadığı zamanların çoğunu kraliyet ormanlarımda geçiriyor; [lifestyle_kingsguard.GetHerHis] itibarlı makamının sağladığı ayrıcalıklardan sonuna dek yararlanıyor.\n\n[lifestyle_kingsguard.GetNameNoTooltip], ormancılarımın ve av bekçilerimin tanıdık bir manzarası haline geldi ve [lifestyle_kingsguard.GetHerHis] yay isabetliliği sarayın diline düştü. [lifestyle_kingsguard.GetHerHim]'in seferlerinden çizmeleri çamurlu, maiyeti [lifestyle_kingsguard.GetHerHis] son kupasını taşıyarak dönmesi olağandışı değil. [lifestyle_kingsguard.GetHerHis|U] dairesi postlarla, derilerle ve kafataslarıyla süslü; [lifestyle_kingsguard.GetNameNoTooltip], gerçek bir avcı olarak nam kazandı."

 agot_kingsguard.3015.a:0 "Bu akşamki yemeğim için bana semiz bir geyik yakala, [lifestyle_kingsguard.GetFirstNameNoTooltip]!"

 agot_kingsguard.3016.t:0 "Doğancı [ROOT.Char.Custom('KingsguardName')]"

 agot_kingsguard.3016.desc:0 "[ROOT.Char.Custom('KingsguardName')]'imden [lifestyle_kingsguard.GetFullName], yanımda olmadığı zamanların çoğunu kraliyet ormanlarımda geçiriyor; [lifestyle_kingsguard.GetHerHis] itibarlı makamının sağladığı ayrıcalıklardan sonuna dek yararlanıyor.\n\n[lifestyle_kingsguard.GetNameNoTooltip], ormancılarımın ve av bekçilerimin tanıdık bir manzarası haline geldi ve [lifestyle_kingsguard.GetHerHis] yay isabetliliği sarayın diline düştü. [lifestyle_kingsguard.GetHerHim]'in seferlerinden çizmeleri çamurlu, maiyeti [lifestyle_kingsguard.GetHerHis] son kupasını taşıyarak dönmesi olağandışı değil. [lifestyle_kingsguard.GetHerHis|U] dairesi postlarla, derilerle ve kafataslarıyla süslü; [lifestyle_kingsguard.GetNameNoTooltip], gerçek bir avcı olarak nam kazandı."

 agot_kingsguard.3016.a:0 "Gerçekten asil bir uğraş, [lifestyle_kingsguard.GetFullNameNoTooltip]!"

 agot_kingsguard.3017.t:0 "[ROOT.Char.Custom('KingsguardName')]: Rezil Bir Cinayet!"

 agot_kingsguard.3017.desc:0 "[ROOT.Char.Custom('KingsguardName')]'imden [eunuch_kingsguard.GetFullName]'in çıplak cesedi yerel bir genelevin dışında bulundu. [eunuch_kingsguard.GetSheHe|U]'in hadım edilmiş olduğu ortaya çıktı ve hakarete tuz biber ekercesine, [eunuch_kingsguard.GetHerHis] kendi pipisi [eunuch_kingsguard.GetHerHis] ağzına tıkılmıştı. Kaynaklarımıza göre, bir çalışanla tartışma halindeyken kendisini [eunuch_kingsguard.GetHerHis] alt tabakalarının üstesinden gelmesiyle buldu. Çıplak ve [eunuch_kingsguard.GetHerHis] silahından yoksun halde, fahişelerin üstesinden gelmesiyle bulundu.\n\nBununla cesaretlenen halk öfkeye kapıldı ve sokaklarda ayaklanma başladı. Görünüşe göre [eunuch_kingsguard.GetFirstName] iyi tanınıyordu ama pek sevilmiyordu."

 agot_kingsguard.3017.a:0 "[eunuch_kingsguard.GetFirstNameNoTooltip], seni budala!"

 agot_kingsguard.9100.t:0 "Yeni Bir [ROOT.Char.Custom('KingsguardName')]"

 agot_kingsguard.9100.desc:0 "[loser.GetName]'i yendiğime göre, [loser.GetHerHis] [ROOT.Char.Custom('KingsguardName')] atamalarını muhafaza edip etmemeye, yoksa kendi atadıklarımı mı görevlendireceğime karar vermeliyim.\n\nKendi atadıklarımı [ROOT.Char.Custom('KingsguardName')]'e yükseltmek kuşkusuz güvenliğimi teminat altına alır, ama belki mevcut üyelerden bazılarını tutmak için bir gerekçe bulunabilir?"

 agot_kingsguard.9100.a:0 "Yargılama başlasın."

 agot_kingsguard.9101.t:0 "Yeni Bir [ROOT.Char.Custom('KingsguardName')]"

 agot_kingsguard.9101.desc:0 "Kimin, birileri olacaksa, [ROOT.Char.Custom('KingsguardName')]'den çıkarılacağına dair kararımı verme zamanı geldi."

 agot_kingsguard.9101.a:0 "Benim iradem yerine gelecek."

 agot_kingsguard.9101.a_tt:0 "[THIS.Char.GetName], [THIS.Char.GetHerHis] makamından alınacak ve hapsedilecek."

 agot_kingsguard.9101.b:0 "[kg.GetNameNoTooltip], [ROOT.Char.Custom('KingsguardName')]'imde kalabilir."

 agot_kingsguard.9101.c:0 "[kg.GetNameNoTooltip], [ROOT.Char.Custom('KingsguardName')]'imde kalabilir."
