l_english:

 pregnancy.1001.motheroffering:0 "Ana'ya bir adak adayacağım."

 pregnancy.1001.motheroffering.self:0 "Hamileliğimi gözetmesi için."

 pregnancy.1001.motheroffering.father:0 "Karımı gözetmesi için."

 pregnancy.1001.motheroffering.deadhusband:0 "Bana son armağanı heba olmasın diye..."

 agot_religion_flavor.0002.t:0 "Kaybolanlara Yardım"

 agot_religion_flavor.0002.desc:0 "Savaş sona eriyor; günü kazandık, ama hangi bedelle? Leş yiyiciler çoktan alana geliyor; ölüleri ve ölmekte olanları didiklemeye hazır. Birliklerimize eşlik eden bir septon yanıma geliyor ve bugün hayata gözlerini yumanlara Yabancı'nın yardım etmesi için küçük bir türbe adayıp adayamayacağımızı soruyor."

 agot_religion_flavor.0002.a:0 "Yabancı'ya küçük bir türbe yapacağız."

 agot_religion_flavor.0002.b:0 "Daha fazlasını yapmalıyız; cehennemler olsun, küçük bir yapı bile inşa edelim!"

 agot_religion_flavor.0002.c:0 "Ölüler öldü; artık onlara yardım edemeyiz..."

 agot_religion_flavor.0100.t:0 "Bakire Günü"

 agot_religion_flavor.0100.desc:0 "Günlük işlerime başlarken, kendimi çevremdeki konuşmaları dalgın dalgın dinlerken buluyorum. Kısa bir süre sonra sarayın dilinde Bakire Günü olduğunu fark ediyorum — ve bu gün, bugüne denk geliyor.\n\nEvlenmemiş tüm bakirelerin, yakındaki tapınağa bir hac yolculuğu yapıp Bakire'nin heykelinin ayaklarına mum yakmaları ve boynuna parşömen çelenkler asmaları beklenir.\n\nGünün önemi neredeyse gözümden kaçmış olsa da, günün etkinlikleri için nasıl hazırlanmam gerektiğine hâlâ karar vermeliyim..."

 agot_religion_flavor.0100.a:0 "Belki biraz altın bağışlarım."

 agot_religion_flavor.0100.b:0 "Tapınakta yardım etmek için gönüllü olmalıyım."

 agot_religion_flavor.0100.c:0 "Bu yılki etkinliklerin herhangi birine katılamayacak kadar meşgulüm..."

 agot_religion_flavor.0100.d:0 "Genç [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('maiden_daughter'))] [maiden_daughter.GetName] kesinlikle katılmalı."

 agot_religion_flavor.0100.e:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('maiden_daughter'))] [maiden_daughter.GetName] kesinlikle katılmalı."

 agot_religion_flavor.0100.f:0 "Hac yolculuğunu bizzat yapıp katılacağım."

 agot_religion_flavor.0100.g:0 "Katılmalıyım... ama vaktim yok."

 agot_religion_flavor.0100.g.tt:0 "Görevlerinden kaçmaya çalışıyorsun; ama #bold birileri#! gözetliyor olabilir."

 agot_religion_flavor.0100.h:0 "Belki giderim ve günün şarkılarının keyfini çıkarırım."

 agot_listened_to_songs:0 "Günü şarkıları dinleyerek geçirdin."

 agot_religion_flavor.0101.t:0 "Tapınağa Varmak"

 agot_religion_flavor.0101.desc:0 "Önümdeki merdivenler, sanki göklerin ta kendisine yükseliyor gibi görünüyor. Tepesinde, mermer duvarları ve altın kubbeli çatısıyla Tapınak oturuyor — inancın tüm mensuplarını kurtuluş için duvarlarının içine davet eden bir işaret kulesi. Çevremde, bu kutsal günü benimle birlikte kutlamaya gelen diyarın diğer bakireleri var.\n\nMerdivenleri çıkarken, hepimiz masumiyetimizi birlikte kutlarken önümüzde olacak dua ve şarkı dolu güne hazırlanıyorum..."

 agot_religion_flavor.0101.a:0 "Şarkı söyleme, dans etme ve dua etme zamanı"

 agot_religion_flavor.0102.t:0 "Yedi Mumu Yakmak"

 agot_religion_flavor.0102.desc:0 "Bakire'nin heykeline yaklaşıyorum; elimde yedi mumu yakmak için kullanılacak ince bir odun parçası, bileğimde bir parşömen çelenk asılı. Heykelin ayaklarına yavaşça yaklaşıp parşömen çelengi heykelin boynuna yerleştiriyorum. Diğer bakirelerin yerleştirdiği çelenklerin üzerine oturup kalıyor.\n\nHeykelin önünde diz çöküp, çıra ucunu bir başka mumun alevine değdirerek kendi alevimi tutuşturuyorum. Önümdeki yedi mumu, Rahibe'nin öğrettiği şekilde teker teker yakıyorum. Yedisi de yandığında ellerimi birleştirip dua etmeye hazırlanıyorum..."

 agot_religion_flavor.0102.a:0 "Bir Olan Yediler'e Dua Et"

 agot_religion_flavor.0103.t:0 "Rahibe Her Şeyi Görür"

 agot_religion_flavor.0103.desc:0 "Bakire Günü etkinliklerine katılma düşüncesi bile beni sıkıyor; yapmam gereken, çok daha önemli öyle çok işim var ki. Peki ya kıymetli zamanımı yalnızca boşa harcamaya yarayan bu önemsiz etkinliklere katılmak yerine bu işlerle ilgilenmeye karar verirsem? Kuşkusuz, benim yokluğum fark edilmeyecek.\n\nBahçelerimde gezintiye çıktığımda, arkamdan bir boğaz temizleme sesi duyuyorum. Dönüp arkamda duran [maiden_day_septa.GetName]'i görüyorum; [maiden_day_septa.GetHerHis] yüzünde, kızgınlığı gizlediği belli olan bir gülümseme.\n\n"Evladım, neden Bakire Günü etkinlikleri için hazırlanmıyorsun? Gerçekten gitmelisin, geç kalmak istemezsin, değil mi?""

 agot_religion_flavor.0103.a:0 "Nerede olmam gerektiğini bana söylemeye kalkışman ne kadar da cüretkârca."

 agot_religion_flavor.0103.b:0 "Neden gideyim ki, artık bir bakire değilim."

 agot_religion_flavor.0103.b.tt:0 "Böyle bir iddia sonuçsuz kalmayabilir..."

 agot_religion_flavor.0103.b.toast:0 "[maiden_day_septa.GetName], seni diyara zina eden biri olarak lanetledi."

 agot_religion_flavor.0103.c:0 "Peki, festivallere katılacağım."

 agot_religion_flavor.0105.t:0 "İnatçı... Her Zamanki Gibi"

 agot_religion_flavor.0105.desc:0 "Bakire Günü geldi çattı. [maiden_daughter.GetFirstNamePossessive] odalarına gidiyorum; [maiden_daughter.GetSheHe]'in ayrılmak için hiçbir hazırlık yapmadığını görüyorum.\n\n"Neden hazır değilsin? Kısa süre içinde Tapınağa gitmeliyiz."\n\n"Bekâretim hakkında bir cadaloz Rahibe'nin ders vermesini dinlemekten daha yüksek yükümlülüklerim var," diyor [maiden_daughter.GetSheHe] kızgın bir tonda.\n\nİlk kez değil, [maiden_daughter.GetHerHim] ile işlerin ne olduğu fark etmeksizin neden hep bu kadar zor olmak zorunda olduğunu merak ediyorum..."

 agot_religion_flavor.0105.a:0 "Canım, lütfen git. Rahibeler'e karşı gelmenin akıllıca olmadığını biliyorsun."

 agot_religion_flavor.0105.a.tt:0 "[maiden_daughter.GetName] ile mantıklı konuşmayı deniyorsun"

 agot_religion_flavor.0105.b:0 "İnancın hizmetkârları olarak, katılmak bizim görevimiz."

 agot_religion_flavor.0105.c:0 "Bu küstah çocuk bana itaatsizlik etmeye nasıl cüret eder!"

 agot_religion_flavor.0105.c.tt:0 "[maiden_daughter.GetFirstNameNoTooltip]'e, [maiden_daughter.GetHerHim]'in yüzüne bir tokat atarak ders veriyorsun"

 msg_went_to_celebrations:0 "[maiden_daughter.GetSheHe] yumuşuyor ve festivale katılıyor."

 agot_religion_flavor.0106.t:0 "İnancın Bir Evladı"

 agot_religion_flavor.0106.desc:0 "Bakire Günü yine geldi çattı. [maiden_daughter.GetNamePossessive] odalarına, hazırlanma sürecini kontrol etmek için gidiyorum; kapıyı aralayıp içeri göz atıyorum; [maiden_daughter.GetHerHim]'i derin uykuda bekliyorum... ama görüyorum ki [maiden_daughter.GetHerHis] saçı çoktan süslü bir örgüyle toplanmış ve [maiden_daughter.GetSheHe] [maiden_daughter.GetHerHis] elbisesini giymek üzere!\n\nSessizce oda kapısını kapatıyorum; kalbim gururla doluyor. Giriş salonuna dönüp bekliyorum ve [maiden_daughter.GetSheHe] hazırlanmayı bitirdiğinde beni bulmaya geliyor; tapınağa gitmeden önce bana sarılıyor."

 agot_religion_flavor.0106.a:0 "Böyle sorumluluk sahibi bir çocuk yetiştirdiğim için gurur duyuyorum."

 agot_religion_flavor.0108.t:0 "Tarihe Geçen Öfke Nöbeti"

 agot_religion_flavor.0108.desc:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', maiden_daughter)] öfkeyle [maiden_daughter.GetHerselfHimself]'i [maiden_daughter.GetHerHis] yatağa atıyor; kollarını [maiden_daughter.GetHerHis] göğsünde kavuşturuyor.\n\n"Söylediğimin arkasındayım! O boğucu, modası geçmiş festivale gitmeyeceğim!" diye ilan ediyor [maiden_daughter.GetSheHe], inatla. "Kim bütün gününü şarkı söyleyip birbirlerinin saçını örmekle geçirmek ister ki?! Bu sıkıcı ve anlamsız bir zaman kaybı!""

 agot_religion_flavor.0108.a:0 "İkimize de #bold sakinleşmek için#! alan tanıyacağım."

 agot_religion_flavor.0108.a.tt:0 "Sinirlenerek, [maiden_daughter.GetHerHim]'i [maiden_daughter.GetHerselfHimself] baş başa bırakıyorsun"

 agot_religion_flavor.0109.t:0 "Artık Bir Bakire Değil"

 agot_religion_flavor.0109.desc:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', maiden_daughter)|U], benimle konuşurken gergin görünüyor. "Dürüst olabilir miyim, [maiden_daughter.Custom2('spoken_address_by_familiarity', ROOT.Char )]?"\n\nSinirle başımı sallayıp evet diyorum; içimde bir beklenti büyüyor; [maiden_daughter.GetSheHe] devam etmeden önce.\n\n"Bekâretimi artık taşımıyorum..." diye fısıldıyor [maiden_daughter.GetNameNoTooltip]."

 agot_religion_flavor.0109.a:0 "..."

 agot_religion_flavor.0109.a.tt:0 "Şok içinde ve üzgün, ne yapacağını ya da ne söyleyeceğini bilemeden [maiden_daughter.GetHerHis] odalarından ayrılıyorsun."

 agot_religion_flavor.0109.b:0 "Bekâretini #bold evlenmeden#! kaybettin mi?!"

 agot_religion_flavor.0110.t:0 "Etkinlikten Önce Küçük Bir Yardım"

 agot_religion_flavor.0110.desc:0 "Bakire Günü yine geldi çattı. [maiden_daughter.GetNamePossessive] odalarına, [maiden_daughter.GetHerHis] ilerleyişini kontrol etmek için gidiyorum. İçeri bakmak için [maiden_daughter.GetHerHis] kapısını yavaşça aralıyorum; [maiden_daughter.GetHerHim]'i giyinmiş, ama [maiden_daughter.GetHerHis] saçını kendi başına örmekte zorlanırken görüyorum. Kapıyı tamamen açıp içeri giriyorum\n\n[maiden_daughter.GetSheHe] beni hemen fark edip soruyor: "[maiden_daughter.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], saçımı örebilir misiniz?" Gülümseyip evet diyorum. [maiden_daughter.GetHerHis] fırçasını alıp düğümleri usulca tarıyorum; ardından [maiden_daughter.GetHerHis] saçını güzel bir örgü topuzla bağlıyorum..."

 agot_religion_flavor.0110.a:0 "Ne harika bir yakınlaşma deneyimi!"

 agot_religion_flavor.0110.a.tt:0 "[maiden_daughter.GetName] festivale katılacak"

 agot_religion_flavor.0111.t:0 "Tapınağa Sabah Yürüyüşü"

 agot_religion_flavor.0111.desc:0 "Bakire Günü geldi çattığında, diyarın tüm bakirelerinin Tapınaktaki etkinliklere katılması beklenir. [ROOT.Char.Custom2('direct_address_by_familiarity', maiden_daughter)|U], [maiden_daughter.GetHerHis] başına katılamayacak kadar küçük; bu yüzden [maiden_daughter.GetHerHim] ile birlikte yürümek zorunda kalacağım. [maiden_daughter.GetSheHe], gün için özel yapılmış [maiden_daughter.GetHerHis] elbisesini giyip hazır olduğunda, [maiden_daughter.GetSheHe] minicik elini uzatıyor; benim tutmam için sabırla bekliyor.\n\n[maiden_daughter.GetSheHe|U], elimi [maiden_daughter.GetHerHis] elinde tuttuğumda tatlı tatlı gülümsüyor ve Tapınağa doğru yola koyuluyoruz. Yolculuk boyunca o kadar çok konuşup kıkırdıyoruz ki, bir anda neredeyse vardığımızı fark ediyorum..."

 agot_religion_flavor.0111.a:0 "Umarım festivallerin keyfini çıkarır..."

 agot_religion_flavor.0112.t:0 "İlham Kaynağı"

 agot_religion_flavor.0112.desc:0 "Bayram şarkılarını dinlerken, gözlerim sürekli tek bir bakireye takılıyor. [maiden_day_muse.GetHerHim]'in şarkı söyleyip dans edişini izlerken, kendimi [maiden_day_muse.GetHerHim]'e daha da yakınlaşmanın bir yolunu ararken buluyorum...\n\n[maiden_day_muse.GetHerHis] hoş sesini duyabilecek kadar yaklaşabiliyorum; [maiden_day_muse.GetHerHis] güzelliği şarkıların çekiciliğini daha da artırıyor. [maiden_day_muse.GetSheHe] şarkı söylemeyi bitirdiğinde [maiden_day_muse.GetHerHim] ile sohbet başlatıyorum. [maiden_day_muse.GetFirstNameNicknamed]'in tanrılar tarafından gönderildiğine hiç şüphem yok; ama burada daha fazlası mı var?"

 agot_religion_flavor.0112.a:0 "Tanrılar bizi [maiden_day_muse.GetHerHim] sesiyle kutsuyor..."

 agot_religion_flavor.0112.a.tt:0 "Günü [maiden_day_muse.GetHerHim]'in şarkılarını dinleyerek geçiriyorsun"

 agot_religion_flavor.0112.b:0 "Belki baş başa kalabileceğimiz bir yer bulmalıyız?"

 agot_religion_flavor.0112.b.tt:0 "Güzel bakireyi etkilemeye çalışıyorsun"

 msg_got_rejected_by_muse:0 "[maiden_day_muse.GetFirstNameNoTooltip] yakınlaşma girişimlerini reddedip festivale geri dönüyor."

 agot_religion_flavor.0113.t:0 "Havada Aşk"

 agot_religion_flavor.0113.desc:0 "Çok geçmeden, meraklı gözlerden uzakta [maiden_day_muse.GetName] ile baş başa kalıyorum. Aramızdaki hava elektrikli; her bakış ve her hareket bizi daha da yakınlaştırıyor; ta ki sessizlik bile dile getirilmemiş niyetle ağırlaşana dek.\n\nÇok geçmeden irade tamamen gevşiyor ve anda kendimizi kaybediyoruz; aramızda birikmiş olana teslim olurken dış dünya hiçliğe karışıyor."

 agot_religion_flavor.0113.a:0 "Belki bu, tanrılardan [maiden_day_muse.GetHerHim] ile evlenmem için bir işarettir."

 agot_religion_flavor.0113.b:0 "[maiden_day_muse.GetHerHim]'i son görüşüm bu olamaz."

 agot_religion_flavor.0113.c:0 "Bu yalnızca geçici bir andı. Başka bir şey değil."
