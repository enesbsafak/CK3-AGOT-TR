 agot_colonization_events.1206.t:0 "[obstacle_province.GetNameNoTooltip]: Kurnaz Eşkıya"

 agot_colonization_events.1206.desc:0 "[obstacle_province.GetName] yerleşiminden gelen en son raporları incelerken, bana hitaben yazılmış bir mektup bulduğumda şaşırıyorum. Bölgeyi rahatsız eden haydutların liderlerinden biri olan [brigand.GetName] tarafından gönderilmiş.\n\nMektubun içeriği cesur olduğu kadar arsızca: [brigand.GetFirstName], bana bağlılık yemini edip vassalım olmak karşılığında, yerleşimi [brigand.GetHerHis] kendi malı olarak talep etmek için iznim olmasını istiyor.\n\nBu gerçekten alışılmadık bir teklif olsa da, belki burada bulunmaya değer bir şey vardır?"

 agot_colonization_events.1206.a:0 "Çirkin bir teklif. Bu aptalı yakalat."

 agot_colonization_events.1206.b:0 "Bunun yerine, bu eşkıyayı hizmetime alacağım."

 agot_colonization_events.1206.c:0 "Pekala. Bana bağlılık yemini et."

 agot_colonization_events.1206.c.tt.success:0 "[brigand.GetFirstNameNoTooltip] sözünü tutar."

 agot_colonization_events.1206.c.tt.failure:0 "[brigand.GetFirstNameNoTooltip], [obstacle_province.GetNameNoTooltip]'i [brigand.GetHerselfHimself] için ele geçirir."

 agot_colonization_events.1206.d:0 "Bağlılığına ihtiyacım yok. [obstacle_province.GetNameNoTooltip] senindir."

 agot_colonization_events.1206.d.tt:0 "[brigand.GetFirstNameNoTooltip]'e [obstacle_province.GetNameNoTooltip] bahşedilir."

 agot_colonization_events.1301.t:0 "[obstacle_province.GetNameNoTooltip]: Ormanda Kaybolan"

 agot_colonization_events.1301.desc:0 "[obstacle_province.GetName] yerleşiminden kötü haberler alıyorum. Yerleşimi ziyaret edip yakınlardaki arazide yürüyüşe çıkarken, [lost_person.GetNameNoTooltip] derin ormanlarda kaybolmuş!\n\nHiçbir iz bırakmadan kaybolmak, çok az kişinin övünebileceği bir başarıdır; ancak bu kayboluşun gönüllü olmadığını hissediyorum. [lost_person.GetFirstNameNoTooltip] büyük bir tehlike içinde olabilir...\n\nBu duruma yanıt vermek bana düşüyor."

 agot_colonization_events.1301.a:0 "Masraftan kaçınmayın! [lost_person.GetHerHim]'in bulunmasını istiyorum!"

 agot_colonization_events.1301.b:0 "Arama ekibine kendim liderlik edeceğim!"

 agot_colonization_events.1301.duel_success:0 "[lost_person.GetFirstNameNoTooltip]'i kurtarırsın."

 agot_colonization_events.1301.duel_failure:0 "[lost_person.GetFirstNameNoTooltip]'i bulamazsın."

 agot_colonization_events.1301.c:0 "Çabalarımız bunun yerine yerleşime yardım etmeye yönelmelidir."

 agot_colonization_events.1301.c.death:0 "[lost_person.GetFirstNameNoTooltip]'in yalnızca kalıntıları bulunur."

 agot_colonization_events.1301.c.vanished:0 "[lost_person.GetFirstNameNoTooltip] hiçbir iz bırakmadan kayıp kalır."

 agot_colonization_events.1301.c.laamp:0 "[lost_person.GetFirstNameNoTooltip], bir [adventurer|E] olarak hayatta kaldı."

 agot_colonization_events.1302.t:0 "[obstacle_province.GetNameNoTooltip]: Ormanın Getirisi"

 agot_colonization_events.1302.desc:0 "[obstacle_province.GetName] yerleşiminden bir rapor aldım. Koloniyi çevreleyen sık ormanlar, bölgede temel altyapının kurulabilmesi için yeterince temizlendi.\n\nBu iyi haberle birlikte, yerleşimden bir soru dikkatimi çekiyor: Ormanların içinden yollar açılırken kesilen tüm odunlarla ne yapılmalı?"

 agot_colonization_events.1302.a:0 "İhtiyacımız olmayanı satmalıyız."

 agot_colonization_events.1302.duel_success:0 "Büyük kârlar elde etmeyi başarırsın."

 agot_colonization_events.1302.duel_failure:0 "Yalnızca kıt kanaat kârlar elde edersin."

 agot_colonization_events.1302.b:0 "Odunu yerleşimi inşa etmek için kullan."

 agot_colonization_events.1302.c:0 "Kutlamak için büyük bir şenlik ateşi yapalım!"

 agot_colonization_events.1302.d:0 "Ormanlar ekilebilir hale getirilebilir..."

 agot_colonization_events.1303.t:0 "[obstacle_province.GetNameNoTooltip]: Kadim Harabe"

 agot_colonization_events.1303.desc:0 "[obstacle_province.GetName] yerleşimindeki işçilerim iyi ilerleme kaydediyor. Çalılıklar temizlendi ve sık ormanın içinden yollar açıldı; böylece koloni gerekli altyapısını kurabiliyor.\n\nÇevredeki toprakları temizlerken, işçiler kökeni ve amacı bilinmeyen kadim bir harabe keşfetti. Bu yeri bir zamanlar hangi kayıp kültürün inşa ettiğini kim söyleyebilir?\n\nHarabe, yerleşimin gelişimine acil bir engel olmasa da, soru hâlâ geçerliliğini koruyor: Onunla ne yapılmalı?"

 agot_colonization_events.1303.a:0 "Harabeyi kullanılabilir bir binaya dönüştürmeyi deneyelim."

 agot_colonization_events.1303.duel_success:0 "[obstacle_province.GetNameNoTooltip]'de yeni bir bina inşa edilir"

 agot_colonization_events.1303.duel_failure:0 "Harabe çöker, geride yalnızca toz kalır"

 agot_colonization_events.1303.b:0 "Harabeyi olduğu gibi bırak ve yerleşime odaklan."

 agot_colonization_events.1303.c:0 "Harabeyi incelemeli ve elimizden geleni onarmalıyız!"

 agot_colonization_events.1303.d:0 "Yıkın onu! Taşları başka yerde kullanılabilir."

 agot_colonization_events.1304.t:0 "[obstacle_province.GetNameNoTooltip]: Doğanın İntikamı"

 agot_colonization_events.1304.desc:0 "[obstacle_province.GetName] yerleşiminden şaşırtıcı haberler alıyorum. Yerel işçiler, koloniyi çevreleyen sık ormanların bir kısmını özenle kesiyordu; ancak özellikle karanlık bir gecenin ardından, ağaçların birçoğu gizemli bir şekilde geri gelmiş!\n\nBuna neyin yol açtığı belirsiz, ancak yerleşimin işlerinin büyük bir kısmı boşa gitmiş. İşçiler giderek hüsrana uğruyor; verimlilik ve moral düşüyor. Görünüşe göre hızlı davranmalıyım..."

 agot_colonization_events.1304.a:0 "Bu ağaçları kendim keseceğim!"

 agot_colonization_events.1304.duel_success:0 "Çabaların başarılı olur."

 agot_colonization_events.1304.duel_failure:0 "Ağaçlar daha fazla sayıda geri döner."

 agot_colonization_events.1304.b:0 "İşçilerimi güçlendirmek için birkaç asker ayıralım."

 agot_colonization_events.1304.c:0 "Şimdilik bu ağaçları kendi haline bırak... ve başka yerde inşa et."

 agot_colonization_events.1304.d:0 "Burada doğayı nasıl yatıştıracağımı biliyorum..."

 agot_colonization_events.1401.t:0 "[obstacle_province.GetNameNoTooltip]: Hendek ve Kurutma"

 agot_colonization_events.1401.desc:0 "[obstacle_province.GetName]'deki yeni kolonimizin çevresindeki bataklık arazi birçok açıdan faydalı oldu. Birincisi, kolayca savunulabilir; zira yaklaşma yolları herhangi bir büyük insan topluluğu için zordur. İkincisi, bataklık araziler çipura, tatlı su levreği, turna ve yılan balığıyla kaynıyor; yerleşimcilerim bunları taze tutabilir ya da kış için tütsüleyebilir.\n\nÖte yandan, bataklıklar ciddi bir su baskını tehdidi oluşturuyor; özellikle bataklık adacıklarının yükselen sularla boğulabildiği bahar çözülmesi sırasında. Buna karşı korunmak için yerleşimcilerim, evlerini korumak ve tarım için arazi kurutmak üzere bir bent ve kanal sistemi üzerinde çalışmaya başladı. Bu, muazzam miktarda emek gerektiriyor ve yeni kurulan koloni için zorlu bir yük olduğunu kanıtladı. Şimdi, bentlerden birinin yarıldığı ve sel sularının yerleşimi tamamen yok etmekle tehdit ettiği görülüyor."

 agot_colonization_events.1401.a:0 "Bir yardım çalışmasını denetleyeceğim ve yeni iş gücüne yatırım yapacağım."

 agot_colonization_events.1401.a.duel_success:0 "Projen bütçenin altında kalır."

 agot_colonization_events.1401.a.duel_failure:0 "Projen bütçeyi aşar."

 agot_colonization_events.1401.success.toast.t:0 "Proje Bütçenin Altında"

 agot_colonization_events.1401.failure.toast.t:0 "Proje Bütçeyi Aşıyor"

 agot_colonization_events.1401.b:0 "Bendi yeniden inşa edip bitirmeye yardım etmeleri için bazı birlikler görevlendir."

 agot_colonization_events.1401.c:0 "Belki bu koloni en başından mahkumdu..."

 agot_colonization_events.1402.t:0 "[obstacle_province.GetNameNoTooltip]: Bataklık Humması"

 agot_colonization_events.1402.desc:0 "[obstacle_province.GetName]'deki bataklık yerleşimim, bahar sel baskınları sırasında sık sık su altında kalır; ancak yükselen suları tutmak ve yönlendirmek için bir set sistemi tamamlandıkça tehdit yavaşça azalıyor.\n\nYine de koloni, görünüşe göre suların üzerinde kaynaşan ısıran böceklerin yol açtığı gizemli bir rahatsızlıkla boğuşuyor. Bu sıtma, ateş, titreme ve korkunç yorgunluk getiriyor.\n\nKoloniciler artık, acılarını dindirmek için söğüt kabuğu ve böcekleri uzak tutması için pelin otu stokları talep eden mektuplar yazmış."

 agot_colonization_events.1402.a:0 "İhtiyaçları olanı alacaklar."

 agot_colonization_events.1402.b:0 "Din adamlarının burada biraz hayır işleri yapmasının zamanı geldi..."

 agot_colonization_events.1402.c:0 "Bataklıkları kurutmak için daha çok çalışsalardı, bu bir sorun olmazdı!"

 agot_colonization_events.1501.t:0 "[obstacle_province.GetNameNoTooltip]: Son Akın"

 agot_colonization_events.1501.desc:0 "Karanlığın örtüsü altında, umutsuz korsan artıklarından oluşan bir çete koloninin depo barakalarına saldırıyor. Tahılı yakıyor ve binaları ateşe veriyor; korkmuş yerleşimcileri güvenlik arayışı içinde çırpınmaya bırakıyorlar. Korsanlar geceye karışırken, yanmış zemin, yağmalanmış erzak ve çılgın kahkahaların uzak yankıları hakkında raporlar geliyor.\n\nBu akıncılarla kararlı bir şekilde ilgilenmezsem koloni çok daha uzun dayanamaz."

 agot_colonization_events.1501.a:0 "Onları kovala ve son adamına kadar cezalandır."

 agot_colonization_events.1501.a.duel_success:0 "Askerlerin akıncıları sürpriz yakalar ve bölge üzerindeki hakimiyetlerini kırar"

 agot_colonization_events.1501.a.duel_failure:0 "Kovalamacada adam kaybedersin. Akıncılar hayati erzaklarla ortadan kaybolur"

 agot_colonization_events.1501.b:0 "Savunmaları güçlendir ve kalan stoğu koru."

 agot_colonization_events.1501.b.duel_success:0 "İhtiyatlı planlaman zaman kazandırır ve askerlerin onları püskürtene dek erzakları korur"

 agot_colonization_events.1501.b.duel_failure:0 "Korsan akıncıları ölümcül bir güçle hızla yeniden saldırır"

 agot_colonization_events.1501.c:0 "Korsanlar burayı kolonileştirmeyi boş bir uğraşa çevirdi."

 agot_colonization_events.1501.success.toast.t:0 "Korsan Kalıntıları Temizlendi"

 agot_colonization_events.1501.failure.toast.t:0 "Korsan Kalıntıları Kaldı"

 agot_colonization_events.1502.t:0 "[obstacle_province.GetNameNoTooltip]: Kıyıdaki Gölgeler"

 agot_colonization_events.1502.desc:0 "Tuhaf haberlerle uyandım: bu sabah sis, [obstacle_province.GetName] yakınlarındaki kıyı şeridinde sürüklenen, hava koşullarından yıpranmış bir gemiyi ortaya çıkarmak için aralandı. Hiçbir tüccar beklenmiyordu ve koloniciler kıyıda toplanıp huzursuzca mırıldanıyor; geminin terk edilmiş mi, lanetli mi yoksa kötü bir alamet mi olduğundan emin değillerdi. Saatler geçti, ancak gemi sürüklenip sessiz kalmaya devam etti.\n\nAkşam olduğunda, kimse inen bir can görmemiş olmasına rağmen, koloni kapısına paslı bir hançerle iliştirilmiş bir uyarı bulundu.\n\n#italic Çalınanı geri almaya geldik. Stoklarınızı ve gemilerinizi teslim edin, yoksa gelgitin altında boğulun.#!"

 agot_colonization_events.1502.a:0 "Onları ateş ve çelikle karşılarız."

 agot_colonization_events.1502.a.duel_success:0 "Adamların çıkarma ekibini püskürtür ve gemilerini yakar"

 agot_colonization_events.1502.a.duel_failure:0 "Akıncılar, sisin içinde kaybolmadan önce limanı yağmalar"

 agot_colonization_events.1502.b:0 "Onlara, temelli ortadan kaybolmaları için altın teklif et."

 agot_colonization_events.1502.b.duel_success:0 "Parayı alıp gelgitlerle birlikte ortadan kaybolurlar"

 agot_colonization_events.1502.b.duel_failure:0 "Parayı alır ve yine de saldırırlar"

 agot_colonization_events.1502.c:0 "Bu korsanlar, değdiklerinden daha fazla dert olduklarını kanıtlıyor."

 agot_colonization_events.1502.success.toast.t:0 "Korsan Kalıntıları Temizlendi"

 agot_colonization_events.1502.failure.toast.t:0 "Korsan Kalıntıları Kaldı"

 agot_colonization_events.1503.t:0 "[obstacle_province.GetNameNoTooltip]: Korsan Komutanı"

 agot_colonization_events.1503.desc:0 "[pirate_leader.GetName], hayatta kalan korsan liderlerinden biri, bir avuç artığı toplayıp [obstacle_province.GetNameNoTooltip] yakınlarında bir yerde müstahkem bir kamp kurmuş. [pirate_leader.GetSheHe|U], bir elçi aracılığıyla onları rahat bırakmamızı, aksi takdirde koloninin yanacağını bildirmiş.\n\nTam bir saldırı felaketle sonuçlanabilir, ancak hareketsizlik de aynı derecede tehlikeli olabilir."

 agot_colonization_events.1503.a:0 "[pirate_leader.GetFirstNameNoTooltip]'i teke tek dövüşe davet et."

 agot_colonization_events.1503.a.duel_success:0 "Korsan komutanını kendin öldürürsün ve [pirate_leader.GetHerHis] mürettebatı dağılır"

 agot_colonization_events.1503.a.duel_failure:0 "[pirate_leader.GetSheHe|U] seni yener"

 agot_colonization_events.1503.b:0 "Karanlığın örtüsü altında kaleye saldır."

 agot_colonization_events.1503.b.duel_success:0 "Kale yok edilir. Tehdit sona erer"

 agot_colonization_events.1503.b.duel_failure:0 "Askerlerin bir tuzağa yürür. Çok azı canlı döner"

 agot_colonization_events.1503.c:0 "Gitmelerini görmek için altın teklif et."

 agot_colonization_events.1503.c.duel_success:0 "Altını alıp sislerin içinde kaybolurlar"

 agot_colonization_events.1503.c.duel_failure:0 "Altını alır ve sana cömertliğin için teşekkür eder \"donation\""

 agot_colonization_events.1503.d:0 "Onları rahat bırakırsak, elbette onlar da aynısını yapar..."

