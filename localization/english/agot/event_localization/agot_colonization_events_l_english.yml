 agot_colonization_events.1101.t:0 "[obstacle_province.GetNameNoTooltip]: Yoh-gi"

 agot_colonization_events.1101.desc:0 "[obstacle_province.GetName]'deki yerleşimcilerim, kolonilerinin yakınında dolaşan ayılara alışık. Genellikle yalnızca biraz ekstra dikkat yeterlidir ve en meraklı canavarlar bile çoğu zaman tencere kapaklarının gürültülü şakırtısıyla caydırılabilir.\n\nBir ayı farklıdır. Yerel lehçede 'Yoh-gi' olarak bilinen bu ayı, ortalama bir ayıdan daha zekidir; çalışma ekiplerini takip eder ve yemek için durakladıklarında onlara saldırır. İşçiler dağılır dağılmaz, erzak için yüklerini yağmalar ve yanlarında getirdikleri tüm yiyecekleri çalar.\n\nYerleşimde sorunun nasıl çözüleceğine dair ciddi bir tartışma var. Koloni, ayıya karşı bir sefer düzenlemek isteyen korucular tutmuş. Ancak yerleşimin demircisi, ayının, kendi tasarımı olan ve ballı bir arı kovanıyla yemlenen ustaca bir tuzağa çekilebileceğine inanıyor."

 agot_colonization_events.1101.a:0 "Korucu seferini denetle."

 agot_colonization_events.1101.a.duel_success:0 "Korucular Yoh-gi'yi ve türünün geri kalanını başarıyla avlar"

 agot_colonization_events.1101.a.duel_failure:0 "Korucular ayı tarafından alt edilir"

 agot_colonization_events.1101.b:0 "Tuzağını kurması için demirciye ödeme yap."

 agot_colonization_events.1101.c:0 "Ne saçmalık! Bu canavarı bizzat ben halledeceğim."

 agot_colonization_events.1101.c.duel_success:0 "Yoh-gi'yi ve türünün geri kalanını başarıyla avlarsın"

 agot_colonization_events.1101.c.duel_failure:0 "Ayı seni alt eder ve ezilirsin"

 agot_colonization_events.1101.d:0 "Hey, hey, hey! O ayıya dokunma!"

 agot_colonization_events.1101.success.toast.t:0 "Ayı İni Temizlendi"

 agot_colonization_events.1101.failure.toast.t:0 "Ayı İni Duruyor"

 agot_colonization_events.1102.t:0 "[obstacle_province.GetNameNoTooltip]: Ayıgild"

 agot_colonization_events.1102.desc:0 "Zorlu arazide dört gün yürüdükten sonra, ayı avım finale yaklaşıyor. Kocaman bir dişi ayı, bir mağaranın ağzında duruyor; bakışları bana kilitlenmiş. Arka ayakları üzerinde doğrulup kükrüyor, ancak saldırıp kayalık sığınağını terk etmekte isteksiz görünüyor. Bunu bir zayıflık işareti sayarak öne atılıp mızrağımı göğsüne saplıyorum. Kısa bir boğuşmanın ardından ayı, seğirerek yere yığılıyor. Son gücüyle bir kez daha gözlerimin içine bakıyor; neredeyse... yalvarır gibi bir ifadeyle. Şaşkınlıkla geri çekilip mızrağı bırakıyorum.\n\nİşte o anda bir miyavlama duyuyorum.\n\nMağaranın derinliğinde gürültünün kaynağını buluyorum — hâlâ kör ve güçsüz, minicik bir yavru bana doğru sürünüyor. Ezici bir suçluluk duygusu beni kavrıyor. Beslemesi pahalı olur, ama belki ayıyı kendim büyütebilirim..."

 agot_colonization_events.1102.a:0 "Onu acısından kurtaracağım."

 agot_colonization_events.1102.b:0 "Yavruyu kendim büyütmeyi deneyeceğim."

 agot_colonization_events.1102.b.success.toast.t:0 "Eğitim Başarılı"

 agot_colonization_events.1102.b.failure.toast.t:0 "Eğitim Başarısız"

 agot_colonization_events.1102.c:0 "Belki tek başına hayatta kalabilir..."

 agot_colonization_events.1103.t:0 "[obstacle_province.GetNameNoTooltip]: Akın"

 agot_colonization_events.1103.desc:0 "[obstacle_province.GetNameNoTier]'deki yeni yerleşim güzelce şekilleniyor. Bir grup bina çoktan yükseldi; sayısız bacadan ve ateş çukurundan gökyüzüne duman yükseliyor. Tarım için arazi temizlendi ve vahşi doğa yavaş yavaş evcilleştirilmiş, bakımlı bir manzaraya yer açıyor. Kaydedilen ilerleme üzerine düşünürken, hayallerim bir çığlıkla kesiliyor.\n\nBir ayı! Devasa gövdesiyle yerleşimin kalbine atılıyor ve kolonicileri kuka gibi savuruyor."

 agot_colonization_events.1103.a:0 "Bana bir yay getirin! Onu kendim yere sereceğim."

 agot_colonization_events.1103.a.duel_success:0 "Ayıyı öldürmeyi başarırsın"

