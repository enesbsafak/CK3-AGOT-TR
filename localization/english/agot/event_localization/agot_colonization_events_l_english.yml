 agot_colonization_events.1001.failure.toast.t:0 "Kurt İni Duruyor"

 agot_colonization_events.1002.t:0 "[obstacle_province.GetNameNoTooltip]: Kuşatıldık"

 agot_colonization_events.1002.desc:0 "Gece çökmeden [obstacle_province.GetName] yerleşimime ulaşmayı umuyordum, ancak tekrarlanan gecikmeler alacakaranlık düştüğünde bizi birkaç mil uzakta bıraktı. Loş ışıkta, gür gövdeli ağaçlardan oluşan bir korunun kenarında kamp kurduk ve kamp ateşi yakmaya koyulduk. Konfor eksikliğine rağmen, yıldızlarla dolu gökyüzünün güzelliğini izlerken üzerime bir sakinlik çöküyor.\n\nAniden bir hırıltı duyuyorum. Ateşin karşısında bir çift göz görüyorum. Tam o anda, çiftin yanına iki düzine başka göz katılıyor ve kuşatıldığımızı anlıyorum. Acımasız bir uluma kulaklarımızı tırmalıyor ve hatamız netleşiyor — bir kurt ininin yanına kamp kurmuşuz! Yeni yerleşimimizi kurulduğu günden beri rahatsız eden gri terörün kaynağı burası."

 agot_colonization_events.1002.a:0 "Bana gelin! Bu şeytanların postlarını yüzelim!"

 agot_colonization_events.1002.b:0 "[knight.GetFirstNameNoTooltip], bizi bu canavarlardan koru!"

 agot_colonization_events.1002.c:0 "Alevli bir meşale kapın, koşarak kaçacağız!"

 agot_colonization_events.1003.t:0 "[obstacle_province.GetNameNoTooltip]: Kurt Ana"

 agot_colonization_events.1003.desc:0 "Aylarca süren aramanın ardından nihayet keşfedildi — [obstacle_province.GetName]'in büyük kurt ini. Sürü devasa ve doğaüstü derecede kurnazdı; çoğu zaman filizlenen karakolumuza erzak taşıyan tüccarları yoldan alıkoyuyordu, ama şimdi etrafını sardık.\n\nKamplarımızda şimdiden birçok post birikmiş durumda, ancak ini yok etmek için son hamleyi yapma konusunda biraz tedirginlik var; zira sürüye, neredeyse bir midilli boyutunda ve ağzı avlarının kanıyla kızıla boyanmış büyük bir dişi kurt önderlik ediyor. Yaklaştıkça korkumuz artıyor; zira dişi kurt, eşelenen bir yavru kurt yığınının önünde duruyor ve hırlayışı ile ısırışı, onları tüm gücü ve vahşetiyle savunmaya kararlı olduğunu açıkça ortaya koyuyor."

 agot_colonization_events.1003.a:0 "Bu sadece bir kırma it! Onunla kendim ilgileneceğim!"

 agot_colonization_events.1003.a.duel_success:0 "Dişi kurdu öldürmeyi başarırsın"

 agot_colonization_events.1003.a.duel_failure:0 "Dişi kurdu öldüremezsin"

 agot_colonization_events.1003.b:0 "Etrafını sarın! Birlikte onu yere sereceğiz!"

 agot_colonization_events.1003.b.duel_success:0 "Dişi kurdu başarıyla köşeye sıkıştırırsın"

 agot_colonization_events.1003.b.duel_failure:0 "Dişi kurt kaçmayı başarır"

 agot_colonization_events.1003.c:0 "Hmm, belki daha sonra geri gelmeliyiz."

 agot_colonization_events.1004.t:0 "[obstacle_province.GetNameNoTooltip]: Kurt-Köpekleri"

 agot_colonization_events.1004.desc:0 "[obstacle_province.GetName]'den ilginç haberler alıyorum. Oradaki yerleşimciler, hayvanların ve evlerin sadık ve güvenilir bekçileri olarak hizmet eden birçok evcil köpeği topraklarına getirmiş. Ancak bu, rahatsız edici sonuçlar doğurmuş. Kurt popülasyonu azalırken ve bu evcil köpekler topraklarda daha büyük sayılarda dolaşırken, kurtlar ve tazılar birbirine karıştıkça melez bir tür daha yaygın hale gelmeye başlamış.\n\nBu 'kurt-köpekleri' bir kurdun özelliklerine ama bir köpeğin mizacına sahip ve yerel halk arasında evcil hayvan ve bekçi olarak oldukça popüler olmaya başlamış. Ancak bazıları, bu melezlerin gerçekten evcilleştirilemeyecek kadar vahşi olabileceğini ya da popülasyon kontrolsüzce patlarsa kendi vahşi sürülerini oluşturabileceklerini dile getiriyor!"

 agot_colonization_events.1004.a:0 "Bu uygulama durdurulmalı ve bir itlaf planı uygulanmalı."

 agot_colonization_events.1004.b:0 "Bir kurdun bedeni, ama bir köpeğin sadakati..."

 agot_colonization_events.1004.c:0 "Ne ilginç bir av olurlardı!"

 agot_colonization_events.1004.a.duel_success:0 "[obstacle_province.GetName] bir kurt görüntüsü kazanır"

 agot_colonization_events.1004.a.success.toast.t:0 "Kurtlar başarıyla doğaya salındı"

