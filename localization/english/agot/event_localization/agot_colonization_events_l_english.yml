 agot_colonization_events.1001.t:0 "[obstacle_province.GetNameNoTooltip]: Kurtlarla Yüzleşme"

 agot_colonization_events.1001.desc:0 "İzcilerim günlerdir [obstacle_province.GetName]'in [obstacle_province.Custom('TerrainTypeProvince')]'ini didik didik arıyor.\n\nÇoğu eli boş döndü; bazıları ise hiç dönmedi. Söylentisi yayılan bu kurt ini gerçekten var mı, yoksa bu topraklarda gezen kurtlar bir büyünün ya da şeytani bir işin sonucu mu diye merak etmeye başlıyorum.\n\nSonunda, son izcim bana rapor veriyor; kıyafetleri yırtık pırtık, gözlerinde sarsılmış bir bakış.\n\n"My [ROOT.Char.GetLadyLord], I have found it! The den is well concealed in the deepest reaches of the [obstacle_province.Custom('TerrainTypeProvince')], and the wolves there are many and fierce.""

 agot_colonization_events.1001.a:0 "Onlarla kendim ilgileneceğim."

 agot_colonization_events.1001.a.duel_success:0 "Kurtları alt edersin"

 agot_colonization_events.1001.a.duel_failure:0 "Kurtların üstesinden gelemezsin"

