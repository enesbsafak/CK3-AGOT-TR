 agot_colonization_events.1204.t:0 "[obstacle_province.GetNameNoTooltip]: Yabanıl Kabileler"

 agot_colonization_events.1204.desc:0 "Sur'un ötesi uzun zamandır seyrek yerleşimlidir. Bu soğuk yeri hâlâ vatan edinen az sayıdaki insan ilkel, dayanıklı ve taş kalplidir. [obstacle_province.GetName] büyüdükçe, bölgede bulunabilen az sayıdaki kaynak için rekabet etmek zorunda kalan yerel halkın öfkesi de büyüyor.\n\nBir zamanlar uzaktan gerilimli bekleşmeler olan şeyler, küçük çaplı çatışmalara, sığır akınlarına ve ara sıra fidye için adam kaçırmalara tırmanmaya başladı. Bu kabileler işleri kendi ellerine almaya karar verirse, bir akın başlatmaları halinde [obstacle_province.GetNameNoTooltip]'i tamamen yok etme ihtimalleri çok gerçek. Bir şeyler yapılmalı."

 agot_colonization_events.1204.a:0 "Bu haydutları dağıtın!"

 agot_colonization_events.1204.a.duel_success:0 "Adamların haydutları katleder"

 agot_colonization_events.1204.a.duel_failure:0 "Adamların haydutlar tarafından geri püskürtülür"

 agot_colonization_events.1204.b:0 "Şefe bir elçi gönder."

 agot_colonization_events.1204.b.duel_success:0 "Halklarımız arasında net sınırlar belirlersin"

 agot_colonization_events.1204.b.duel_failure:0 "Müzakere çabaların başarısız olur"

 agot_colonization_events.1204.c:0 "Bu paçavralı vahşiler sanki bir tehditmiş gibi."

 agot_colonization_events.1204.success.toast.t:0 "Haydutlar Temizlendi"

 agot_colonization_events.1204.failure.toast.t:0 "Haydutlar Kaldı"

 agot_colonization_events.1205.t:0 "[obstacle_province.GetNameNoTooltip]: Hain"

 agot_colonization_events.1205.desc:0 "[obstacle_province.GetName]'in haydutlarına karşı çalışmalar zorlu ve yavaş, ancak genel olarak istikrarlı ilerliyor. Önceden vahşi doğayı haydut ve eşkıya kampları kaplarken, artık karakollarının çoğu yok edildi. Yine de koloniciler için tehdit sürüyor. Kalan haydutlar ve sağ kalanlar bir araya gelerek tek bir büyük kamp kurdu.\n\nBir sabah, yırtık pırtık, vahşi görünümlü bir [traitor.GetWomanMan] tahtımın önünde diz çöküyor.\n\n"Yer Highness, I am aware that the poor villagers of [obstacle_province.GetNameNoTooltip] have been hurt badly by the menace of bandits, living every day under the fear of attack!" [traitor.GetSheHe|U] grins. "I have a proposition for you: I let some of your village guards in at night, and they can kill every last bandit! All I ask for is a meager sum of gold, much less than what it would take to destroy the camp by force."\n\nIt is an interesting proposition..."

 agot_colonization_events.1205.a:0 "Pekala, sen öyle diyorsan."

 agot_colonization_events.1205.a.duel_success:0 "Plan beklendiği gibi işler."

 agot_colonization_events.1205.a.duel_failure:0 "İhanete uğrarsın."

 agot_colonization_events.1205.b:0 "Askerlerim haydut pisliklerini lanetleyecek."

 agot_colonization_events.1205.b.duel_success:0 "Adamların haydutları katleder."

 agot_colonization_events.1205.b.duel_failure:0 "Adamların haydutlarca geri püskürtüldü."

 agot_colonization_events.1205.c:0 "Yardımına ihtiyacım yok."

