 agot_colonization_events.1004.b.failure.toast.t:0 "Vahşi kurt evcilleştirilmedi"

 agot_colonization_events.1005.t:0 "[obstacle_province.GetNameNoTooltip]: Kaybolanlar"

 agot_colonization_events.1005.desc:0 "Bugün [obstacle_province.GetName]'den üzücü haberler dikkatimi çekiyor; son bir dizi trajedi oradaki yerleşimleri sarsmış. Bölgedeki yerel kurt sürüleri, görünüşe göre topraklarına yapılan sürekli tecavüzlerden cesaret alarak, gençleri, çaresizleri ve yaşlıları büyük sayılarda avlamaya başlamış.\n\nDaha önce hiç görülmemiş bir cüretle, geceleri devasa sürüler halinde köylerin içine süzülmeye bile başlamışlar! Kurtlar, bebekleri beşiklerinden çalacak kadar cesaretlenmeden bir şeyler yapılmalı."

 agot_colonization_events.1005.a:0 "Köylüleri örgütleyip savaşı kurtlara taşımalıyız!"

 agot_colonization_events.1005.a.duel_success:0 "Kurt ini temizlendi"

 agot_colonization_events.1005.a.duel_failure:0 "Kurt ini duruyor ve koloni kaybedildi"

 agot_colonization_events.1005.success.toast.t:0 "Kurt ini temizlendi!"

 agot_colonization_events.1005.failure.toast.t:0 "Kurt ini temizlenemedi"

 agot_colonization_events.1005.b:0 "Köylüleri topla ve kurtları ateşle dışarı çıkar."

 agot_colonization_events.1005.b.duel_success:0 "Kurt inini yakarsın"

 agot_colonization_events.1005.b.duel_failure:0 "Kurt ini duruyor ve koloni kaybedildi"

 agot_colonization_events.1005.c:0 "Talihsizlik, ama sınır bölgesinin riskleri bunlar."

 agot_colonization_events.1006.t:0 "[obstacle_province.GetNameNoTooltip]: Avlanan"

 agot_colonization_events.1006.desc:0 "Başlangıçta kolay bir itlaf gibi görünen şey hızla kontrolden çıktı. Kocaman siyah bir kurt, intikamcı sürüsüyle birlikte sisin örtüsü altında gece boyunca grubumu takip etti ve saldırdı. [obstacle_province.GetName]'in kurt inine götürdüğüm avcılar birer birer avlandı ve kısa süre sonra, doğaüstü canavarla yüzleşmek üzere yapayalnız kaldım.\n\nGördüğüm en büyük kurt kesinlikle bu; gözlerindeki rahatsız edici derecede zeki parıltı, topraklarından derhal kaçmazsam uzun ve sefil bir ölüm vaat ediyor."

 agot_colonization_events.1006.a:0 "Güzel bir halı edersin."

 agot_colonization_events.1006.a.duel_success:0 "Kurt ini temizlendi"

 agot_colonization_events.1006.a.duel_failure:0 "Kurt ini duruyor"

 agot_colonization_events.1006.success.toast.t:0 "Kurt ini temizlendi!"

 agot_colonization_events.1006.failure.toast.t:0 "Kurt ini temizlenemedi"

 agot_colonization_events.1006.b:0 "Bir ateş yakarsam, canavarı tuzağa düşürüp bu şekilde öldürebilirim."

 agot_colonization_events.1006.c:0 "Cesurca, hem de cesurca kaçacağım!"

 agot_colonization_events.1006.b.duel_success:0 "Kurt ini temizlendi"

 agot_colonization_events.1006.b.duel_failure:0 "Kurt ini duruyor"

 agot_colonization_events.1007.t:0 "[obstacle_province.GetNameNoTooltip]: Tepelerden Ulumalar"

 agot_colonization_events.1007.desc:0 "Sarayıma, [obstacle_province.GetName] yerleşiminden haberler taşıyan bir ulak geliyor. Haberler iyiye işaret ediyor; ancak ulak raporunu bitirirken köylülerin bir talebini iletir: kurtların çoğunu yerleşimden sürmüş olsalar da, köyden birkaç mil ötedeki tepelerde hâlâ kayda değer bir sürü kalmış. Onları kesin olarak yok etmek için yardımımı istiyorlar.\n\n[steward.Custom('GetCouncilOrCourtPosition')] araya giriyor: "If the wolves have truly been driven into the hills miles away from the settlement, I feel there is little need for us to interfere. The wolves will end up moving on on their own.""

 agot_colonization_events.1007.a:0 "Hiçbir risk almayalım. Gerekli yardımı göndereceğim."

 agot_colonization_events.1007.b:0 "[steward.GetFirstName]'e katılmak zorundayım; kurtlar artık çok az tehdit oluşturuyor."

 agot_colonization_events.1007.success.toast.t:0 "Kurtlar Doğal Olarak Dağılır"

 agot_colonization_events.1007.failure.toast.t:0 "Kurtlar Kalır"

 agot_colonization_events.1008.t:0 "[obstacle_province.GetNameNoTooltip]: Av Kulüpleri"

 agot_colonization_events.1008.desc:0 "[obstacle_province.GetName]'deki tehlikeli kurt popülasyonunu yok etmeye yönelik özverili çabalar sayesinde, avcılar çabalarını daha iyi koordine etmek için av kulüpleri kurmaya başladı.\n\nKurt itlafını çok daha güvenli ve kolay hale getirmek gibi bariz faydanın yanı sıra, avcılık yerel topluluklarda güçlü ve cesur kişiler arasında bir uğraş olarak yaygınlaşıp popülerleştikçe, bölgede kendine özgü bir alt kültürün yeşermesini sağlıyor."

 agot_colonization_events.1008.a:0 "Geçici bir heves, ama yine de ilginç."

 agot_colonization_events.1008.success.toast.t:0 "Av kulüpleri teşvik edildi!"

 agot_colonization_events.1008.failure.toast.t:0 "Kurt avı kontrolden çıkıyor!"

 agot_colonization_events.1008.b:0 "Bu av kulüplerini daha da teşvik etmeliyiz!"

 agot_colonization_events.1008.b.duel_success:0 "Av kulüplerini başarıyla teşvik edersin"

 agot_colonization_events.1008.b.duel_failure:0 "Av kontrolden çıkıyor..."

 agot_colonization_events.1008.c:0 "Bu insanları ziyaret etmeliyim; paylaşacakları birkaç ipucu ve taktik mutlaka vardır."

 agot_colonization_events.1009.t:0 "[obstacle_province.GetNameNoTooltip]: Gecenin Ulumaları"

 agot_colonization_events.1009.desc:0 "[obstacle_province.GetName]'deki koloninin ilerleyişini kontrol etmek için ziyaret ettiğimde, bazı köylerin tamamen yıkıma uğradığını fark ediyorum — yarı boş hayalet kasabalar; bitkin köylüler, kendi dirgenleriyle yere düşmekten zor bela alıkonan, dayanıksız kazıklı çitlerle korunuyor. Kurtların o kadar çok ve korkunç olduğunu, geceleri hayatta kalmanın bile bir mücadele olduğunu söylüyorlar. Bu durum sürdürülemez.\n\nMaiyetimle birlikte kurtları itlaf etmek için bir kuvvet toplamak üzere eve dönmeye hazırlanırken, küçük bir avuç insanla grubun geri kalanından ayrı düşüyorum. Çok geçmeden, gecenin sessiz kasveti, en az yüz kurt olduğu kesin olan bir ulumayla yıkılıyor. Göz açıp kapayıncaya dek, maiyetim dört bir yandan hırlayan ve dişlerini gösteren kurtlarca sarılıyor; yalnızca meşalelerimin ışığı onları uzak tutuyor. Ama meşale ışığı sönerken, kurtlar giderek daha da yakınlaşıyor..."

 agot_colonization_events.1009.a:0 "Düzen! Düzene girin ve bize çarpıp kırılsınlar!"

