 agot_colonization_events.1103.b:0 "Boruları çalın! Buna bir son vermeliyiz!"

 agot_colonization_events.1103.b.duel_success:0 "Grubun ayıyı öldürmeyi başarır"

 agot_colonization_events.1103.b.duel_failure:0 "Grubun ayıyı öldüremez"

 agot_colonization_events.1103.c:0 "Kaçın! Bu düşman hepimizden daha büyük!"

