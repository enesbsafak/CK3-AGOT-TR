 agot_colonization_events.1504.t:0 "[obstacle_province.GetNameNoTooltip]: Pusu"

 agot_colonization_events.1504.desc:0 "Kıyı yakınlarında rutin devriyeler gerçekleştirirken, adamlarım iyi silahlanmış korsanlarca pusuya düşürüldü. Gizli mağaralar, akınlar için bir hazırlık üssü olarak hizmet ediyor. Bu artıklar amaçsız akıncılar değil; örgütlü ve ölümcüller.\n\nOnları şimdi kökünden söküp atmazsak, yerleşimin ta kendisini ele geçirebilirler."

 agot_colonization_events.1504.a:0 "Mağaralara baskın düzenle. Kimseyi sağ bırakma."

 agot_colonization_events.1504.a.duel_success:0 "Mağaralar temizlenir"

 agot_colonization_events.1504.a.duel_failure:0 "Adamların karanlıkta katledilir"

 agot_colonization_events.1504.b:0 "Çok tehlikeli. Ek muhafızlar görevlendir ve gitmeleri için dua et"

 agot_colonization_events.1504.success.toast.t:0 "Korsan Kalıntıları Temizlendi"

 agot_colonization_events.1504.failure.toast.t:0 "Korsan Kalıntıları Kaldı"
