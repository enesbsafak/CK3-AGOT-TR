 agot_colonization_events.1103.success.toast.t:0 "Ayı İni Temizlendi"

 agot_colonization_events.1104.t:0 "[obstacle_province.GetNameNoTooltip]: Mantar Ayısı"

 agot_colonization_events.1104.desc:0 "[steward.Custom('GetCouncilOrCourtPosition')] [steward.GetFirstName], [obstacle_province.GetName]'deki yeni kurulan kolonimizden haberler getiriyor. O kadar kafa karıştırıcı bir hikaye ki [steward.GetFirstNameNoTooltip], bana getirmeden önce doğrulamakta ısrar etti; ama artık gerçekliğinden emin. Görünüşe göre kolonicilerimizden biri, tüketimi şaşırtıcı görüler ve yoğun bir mutluluk hissi veren, özellikle güçlü bir mantar türü keşfetmiş.\n\nBu iyi hoş olabilir, ancak ekili bir mantar parseli, korkunç boyutlarda yerel bir ayı tarafından yağmalanmış. Bu ayı ardından devasa boyutlarda bir öfke nöbetine girerek evleri ve ambarları yok etmiş ve yerleşimcileri katletmiş; öyle ki koloni artık varoluşsal bir tehditle karşı karşıya."

 agot_colonization_events.1104.a:0 "Bu kürklü tehditle ilgilenmesi için askerlerimizden bazılarını yönlendir."

 agot_colonization_events.1104.a.duel_failure:0 "Askerlerin ayıyı kovamaz"

