 agot_colonization_events.1202.t:0 "[obstacle_province.GetNameNoTooltip]: Kıstırma"

 agot_colonization_events.1202.desc.marshal:0 "[marshal.GetCouncilTitle] [marshal.GetName] bana sevindirici haberler getiriyor. Yerel garnizon, [obstacle_province.GetName]'deki yerleşimimi terörize eden bir haydut grubunun sığınağını keşfetmiş. Askerler kanun kaçaklarını çembere almış ve son birkaç gündür yoğun bir ok atışması yaşanıyor. Ama şu ana dek, bu çıkmazı bitirecek kesin bir hamle yapılmadı.\n\nHaydut lideri, gerekirse sonuna kadar savaşmaya istekli görünüyor; ancak kayda değer bir ödeme karşılığında bölgeyi terk etmeyi teklif etmiş."

 agot_colonization_events.1202.desc.knight:0 "Askeri danışmanım [marshal.GetNameNoTooltip] bana sevindirici haberler getiriyor. Yerel garnizon, [obstacle_province.GetNameNoTooltip]'deki yerleşimimi terörize eden bir haydut grubunun sığınağını keşfetmiş. Askerler kanun kaçaklarını çembere almış ve son birkaç gündür yoğun bir ok atışması yaşanıyor. Ama şu ana dek, bu çıkmazı bitirecek kesin bir hamle yapılmadı.\n\nHaydut lideri, gerekirse sonuna kadar savaşmaya istekli görünüyor; ancak kayda değer bir ödeme karşılığında bölgeyi terk etmeyi teklif etmiş."

 agot_colonization_events.1202.a:0 "Onları ezin!"

 agot_colonization_events.1202.a.duel_success:0 "Adamların bela çıkaranların sonuncusunu da öldürüyor."

 agot_colonization_events.1202.a.duel_failure:0 "Adamların haydutlarca geri püskürtüldü."

 agot_colonization_events.1202.b:0 "Ya askere alınmaya ikna edilebilirlerse?"

 agot_colonization_events.1202.b.duel_success:0 "Haydut liderini, sürekli bir ücret karşılığında koloniyi savunmaya yardım etmeye ikna edersin."

 agot_colonization_events.1202.b.duel_failure:0 "Müzakere çabaların başarısız oluyor."

 agot_colonization_events.1202.c:0 "Sanırım seyahat masraflarını ödeyebilirim..."

 agot_colonization_events.1203.t:0 "[obstacle_province.GetNameNoTooltip]: Kardeşlik"

 agot_colonization_events.1203.desc:0 "Haydutluk bir süredir [obstacle_province.GetName]'de bir sorun olmuştur. Başlangıçta yalnızca birkaç izole serseri ve eşkıya çetesi olanlar, zamanla seçkin birkaç patronun komutası altında birleşmeye başladı. Acımasız, zeki ve hırslı olan bu haydutlar, [obstacle_province.GetNameNoTooltip]'in cılız garnizonunu silahlarını bırakıp bu sözde 'Kardeşlik'i koloninin yeni yöneticileri olarak kabul etmeye yıldıracak kadar büyüyüp örgütlendi. Bu, doğal olarak beni çok endişelendiriyor.\n\nBir eğitimli savaşçı ordusu toplayarak, [obstacle_province.GetNameNoTooltip]'i bu gaspçılardan geri almak için yürüyüşe hazırlanıyorum. Ancak varışta, ateşkes bayrağı altında karşılanıyorum. Kardeşlik'in liderleri benimle görüşmek için öne çıkıp bir teklif sunuyor. Kardeşlik bölgede meşru bir lonca haline gelene dek, kuvvetleriyle [obstacle_province.GetNameNoTooltip]'i koruyacaklar ve emekleriyle onu inşa edecekler; karşılığında af ve bir vergi muafiyeti dönemi istiyorlar. [obstacle_province.GetNameNoTooltip]'in onların yönetimi altında ne kadar iyi inşa edilmiş hale geldiğine bakılırsa, belki de tekliflerini kabul etmeliyim..."

 agot_colonization_events.1203.a:0 "Elbette bunun işe yarayacağını düşünmemiştin, değil mi?"

 agot_colonization_events.1203.a.duel_success:0 "Adamların Kardeşlik üyelerini katleder."

 agot_colonization_events.1203.a.duel_failure:0 "Adamların haydutlarca geri püskürtüldü."

 agot_colonization_events.1203.b:0 "İlginç bir teklif! Ama bende çok daha iyisi var."

 agot_colonization_events.1203.b.duel_success:0 "Loncayı, bir ücret karşılığında koloniyi terk etmeye ikna edersin."

 agot_colonization_events.1203.b.duel_failure:0 "Müzakere çabaların başarısız oluyor."

 agot_colonization_events.1203.c:0 "Tamam! Bağlılık yeminlerinizi burada alacağım."

