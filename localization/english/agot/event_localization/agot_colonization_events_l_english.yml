 agot_colonization_events.1106.t:0 "[obstacle_province.GetNameNoTooltip]: İnsan Yiyen"

 agot_colonization_events.1106.desc:0 "Gece izliyor. Yedi fit boyunda ve yarım ton ağırlığında. Derisi ejderha pullarından daha kalın ve sert, dişleri ve pençeleri kılıçlardan büyük, nefesinin kokusu savaş sonrası bir çayırdan daha iğrenç. Yüz savaşın yara izini taşıyor ve yüzü yüz yılın yorgunluğunu ve morluklarını gösteriyor.\n\nEn azından, [obstacle_province.GetName]'den gelen mektupların anlattığı bu. Bu büyük ayı hakkındaki bazı bilgilerin abartılmış olması muhtemel, ancak hissettikleri açık. Birçok şey bildiriyorlar: neredeyse yenilmez olduğunu; bin ok atışından sağ çıktığını; elli adamdan oluşan av partilerini katlettiğini; ve gece, görünmeden köye girip hayvanları ve kasabalıları — özellikle kasabalıları! — katlettiğini. Koloniciler açık: yardım için, her şey için yalvarıyorlar; bu gece terörünün kesin olarak ortadan kaldırılması için."

 agot_colonization_events.1106.success.toast.t:0 "Ayı Öldürüldü"

 agot_colonization_events.1106.failure.toast.t:0 "Ayı İni Duruyor"

 agot_colonization_events.1106.a:0 "Bu canavarı katletmeleri için en iyi savaşçılarımı gönder!"

 agot_colonization_events.1106.b:0 "[marshal.GetFirstName], kolonicileri topla ve bana bu ayının kafasını getir."

 agot_colonization_events.1106.b.duel_success:0 "Ayı öldürüldü"

 agot_colonization_events.1106.b.duel_failure:0 "Ayı hayatta kaldı"

 agot_colonization_events.1106.c:0 "Ah, bu sadece köylülerin batıl inancı! Ayıyla kendileri ilgilenebilirler."

 agot_colonization_events.1107.t:0 "[obstacle_province.GetNameNoTooltip]: Nefret Edilen Düşmanlar"

 agot_colonization_events.1107.desc:0 "[obstacle_province.GetName]'deki koloni büyüdükçe, bölgedeki baş belası ayı popülasyonu avlanıyor — güvenlik, yiyecek ve salt spor için. Ancak eylemlerimiz bu ayıların gazabını üzerimize çekmiş gibi görünüyor; zira kolonimin ilerleyişini kontrol etmek için ziyaret ettiğimde, şimdiye dek gördüğüm en büyük ayının yanı sıra lanet olası yaratıklarca kuşatılıyoruz. Daha da kötüsü, bu ayı küçük ayılara bir şekilde komuta ediyor gibi görünüyor!"

 agot_colonization_events.1107.success.toast.t:0 "Ayı Öldürüldü"

 agot_colonization_events.1107.failure.toast.t:0 "Ayı İni Duruyor"

 agot_colonization_events.1107.a:0 "Ayı sezonu geldi, çocuklar!"

 agot_colonization_events.1107.b:0 "O iri yaratığın kafasını kesin, ayılar dağılır."

 agot_colonization_events.1107.duel_success:0 "Ayı öldürüldü"

 agot_colonization_events.1107.duel_failure:0 "Ayı hayatta kaldı"

 agot_colonization_events.1107.c:0 "Ben, şey, takviye almaya giderken onları oyalayın!"

 agot_colonization_events.1108.t:0 "[obstacle_province.GetNameNoTooltip]: Ayı Kışkırtma"

 agot_colonization_events.1108.desc:0 "[obstacle_province.GetName]'i kontrol etmek için ziyaret etmeye karar verdiğimde, gelişimi kutlamak için düzenlenmiş gösterişli bir festivalle karşılanıyorum. Yiyecekler tepeler gibi yığılı, içkiler akıyor. Şenliğin zirvesinde, büyük bir arenaya götürülüp yüksek koltuğa oturtuluyorum. Arenanın çukuruna bir kapıdan bir dizi kötü suratlı, iri köpek getiriliyor. Ve sonra, büyük bir şaşkınlıkla, diğer kapıdan hüzünlü görünüşlü bir ayı ağır ağır sendeleyerek çıkıyor!\n\nKöpekler, bir ok gibi fırlayıp canavara saldırıyor, ona diş geçirmeye çalışıyor. Bu olay hızla bir kan cümbüşüne dönüşüyor; ama sonunda ayı, hayatta kalan tazı tarafından yere seriliyor. Yanımda oturan gülümseyen valiye bakmak için döndüğümde, bu gösteriye vereceğim tepkiyi düşünüyorum."

 agot_colonization_events.1108.a:0 "İşte buna eğlence derim!"

 agot_colonization_events.1108.b:0 "Bu iğrenç bir uygulama ve bir daha yapmayacaksınız!"

 agot_colonization_events.1108.c:0 "...Bundan nasıl para kazanırım?"

 agot_colonization_events.1108.c.duel_success:0 "Bu ayı dövüşlerini başarıyla paraya çevirirsin"

 agot_colonization_events.1108.success.toast.t:0 "Başarılı Para Kazanma"

 agot_colonization_events.1108.c.duel_failure:0 "Bu ayı dövüşlerini paraya çeviremezsin"

 agot_colonization_events.1108.failure.toast.t:0 "Başarısız Para Kazanma"

 agot_colonization_events.1109.t:0 "[obstacle_province.GetNameNoTooltip]: Tembellik ve Vahşet"

 agot_colonization_events.1109.desc:0 "Bu sabah masama [obstacle_province.GetName]'den oldukça endişe verici haberler ulaşıyor. Orada bulunan yerel ayı popülasyonu, yerleşimin başlangıcından beri canavarların saldırgan doğası nedeniyle yerel halkın başına sürekli bir bela olmuş. Yeleli, orak pençeli ve keçe tüylü olan bu ayıları bu kadar tehlikeli yapan şey vahşetleri — çok az kışkırtmayla ve çok az uyarıyla insanlara saldırıyorlar. İşler o kadar kötüleşti ki yerel vali, bu tembel ayıların oluşturduğu tehditle ilgilenmem için şahsen beni talep etti."

 agot_colonization_events.1109.success.toast.t:0 "Ayı Öldürüldü"

 agot_colonization_events.1109.failure.toast.t:0 "Ayı İni Duruyor"

 agot_colonization_events.1109.a:0 "[knight.GetFirstName], ayı avına çıkmak ister misin?"

 agot_colonization_events.1109.b:0 "Biri bana iyi ayı mızrağımı uzatsın!"

 agot_colonization_events.1109.duel_success:0 "Ayı öldürüldü"

 agot_colonization_events.1109.duel_failure:0 "Ayı hayatta kaldı"

 agot_colonization_events.1109.c:0 "Her şey çok ilginç, ama vaktim yok."

 agot_colonization_events.1201.t:0 "[obstacle_province.GetNameNoTooltip]: Dışlanmışlar"

 agot_colonization_events.1201.desc.1:0 "Haftalardır [obstacle_province.GetName] yerleşiminden yalvaran mektuplar alıyorum. Kasabanın yiyecek stoklarına tekrar tekrar akın düzenleyen bir kanun kaçağı çetesi tarafından rahatsız ediliyorlar."

 agot_colonization_events.1201.desc.2.marshal:0 "[marshal.GetCouncilTitle] [marshal.GetName], haydutları kovmak için bir cezalandırma seferi öneriyor.\n\nAncak, "

 agot_colonization_events.1201.desc.2.knight:0 "Askeri danışmanım [marshal.GetName], haydutları kovmak için bir cezalandırma seferi öneriyor.\n\nAncak, "

 agot_colonization_events.1201.desc.3.spymaster:0 "[spymaster.GetCouncilTitle] [spymaster.GetName], bu durumun görünenden fazlası olduğunu fısıldıyor. Görünüşe göre kanun kaçakları en erken koloniciler arasındaydı ve çoğunlukla dürüst tebaalardı — ta ki daha iyi silahlanmış ve zaten inşa edilmiş barınakları çalabilecekken kendi elleriyle barınak inşa etmeye daha az meyilli olan eski askerler onları evlerinden sürene dek."

 agot_colonization_events.1201.desc.3.scholar:0 "bilgin [spymaster.GetName], bu durumun görünenden fazlası olduğunu fısıldıyor. Görünüşe göre kanun kaçakları en erken koloniciler arasındaydı ve çoğunlukla dürüst tebaalardı — ta ki daha iyi silahlanmış ve zaten inşa edilmiş barınakları çalabilecekken kendi elleriyle barınak inşa etmeye daha az meyilli olan eski askerler onları evlerinden sürene dek."

 agot_colonization_events.1201.a:0 "Kimin orada önce olduğu umurumda değil. Bunu kılıçlarla çözün!"

