 agot_colonization_events.1105.t:0 "[obstacle_province.GetNameNoTooltip]: Görünenden Fazlası"

 agot_colonization_events.1105.desc:0 "[obstacle_province.GetName] çevresindeki topraklar, uzun zamandır oralara yuva yapan iri ayılarla ünlüdür.\n\nKolomimin ilerleyişini kontrol etmek için ziyaret ettiğimde, yolda devasa ayılardan oluşan küçük bir aile gibi görünen bir grup tarafından durduruluyorum. Onlara önderlik eden, iri yarı bir adam gibi görünen devasa bir yaratık, öldürdüğümüz tüm ayıların intikamını almamak için topraklarından gitmemizi istiyor."

 agot_colonization_events.1105.a:0 "Denemeni bir göreyim, vahşi!"

 agot_colonization_events.1105.b:0 "Ayılarını yerleşimlerimizden uzak tut..."

