### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0453.desc [AGOT: As I drift into sleep, I am pulled into yet another strange dream. I find myself standing in a desolate field, the sky above me dark and heavy. From the distance, a crow swoops down, its black wings cutting through the air with silent precision. As it draws closer, something strange catches my eye, this is no ordinary crow. A third eye, perched in the center of its forehead, stares at me, unblinking and all-knowing. The crow circles above, its gaze unnerving, as though it sees far more than I can comprehend.\n\nIt caws once, its cry echoing across the empty landscape, and I feel as though I am being watched by something far beyond the bird itself.\n\nI wake, my heart heavy with the weight of its gaze, and the image of the three-eyed crow lingering in the darkness of my thoughts.]
