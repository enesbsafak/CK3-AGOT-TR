### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0466.desc [AGOT: Sleep pulls me into yet another vision, one that burns as bright as the sun. A figure stands before me, surrounded by flames, their form distorted by the searing heat as the fire consumes them. The heat is unbearable, the flames rising higher, swallowing the figure whole.\n\nI try to reach them, but the fire forces me back. Just as they disappear into the inferno, I look up and see the night sky itself ablaze, as though the stars are burning, the heavens igniting with fire. The ground trembles beneath me, and from the heart of the flames, a shadow stirs. A dragon, great and terrible, steps from the fire, its scales gleaming like molten steel. Its eyes lock onto mine, and I can feel its presence, ancient and powerful.\n\nI wake in a cold sweat, the image of the dragon and the figure burned into my mind, their fates intertwined with the fiery sky above.]
