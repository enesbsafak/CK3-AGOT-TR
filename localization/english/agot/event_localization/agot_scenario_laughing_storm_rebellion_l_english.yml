### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0463.desc [AGOT: I have returned from the small ranging, but something from the journey clings to my thoughts, like a shadow that will not fade. Out there, in the wild, amid the snow and desolation, I thought I saw something, or someone.\n\nA child, small and quick, darting between the trees. For a moment, their skin looked strange... green, like the forest itself. It was only a glimpse, and when I looked again, they were gone. No one else in the group saw anything. I asked, but the looks they gave me made me doubt my own eyes.\n\nWas it just a trick of the light, or something more? The image of that green-skinned child haunts me, even now. I can not shake the feeling that what I saw was real, but I am not sure what it was, or what it meant.]
 agot_laughing_storm_rebellion.0463.desc:0 "I have returned from the small ranging, but something from the journey clings to my thoughts, like a shadow that will not fade. Out there, in the wild, amid the snow and desolation, I thought I saw something, or someone.\n\nA child, small and quick, darting between the trees. For a moment, their skin looked strange... green, like the forest itself. It was only a glimpse, and when I looked again, they were gone. No one else in the group saw anything. I asked, but the looks they gave me made me doubt my own eyes.\n\nWas it just a trick of the light, or something more? The image of that green-skinned child haunts me, even now. I can not shake the feeling that what I saw was real, but I am not sure what it was, or what it meant."
