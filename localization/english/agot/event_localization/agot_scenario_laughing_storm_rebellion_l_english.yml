 agot_laughing_storm_rebellion.0024.none.desc:0 "Zamanı geldi. Ordum hazır, sancaklar yüksek dalgalanıyor, yürekler savaşa bileylenmiş. Sadık müttefikler yanımdayken, savaş çağrısı Fırtına Toprakları'nda yankılanıyor. Evi [lyonel.GetHouse.GetBaseName]'e yapılan şerefsizlik, bir fırtınanın gazabıyla cevaplanacak.\n\nOnurumuzu ve bağımsızlığımızı geri kazanmak için ilerliyoruz, önümüzdeki her zorlukla yüzleşmeye hazırız. Demir Taht titresin, çünkü fırtınanın gazabı üzerlerine geliyor."

 agot_laughing_storm_rebellion.0024.a:0 "Savaşa!"

 agot_laughing_storm_rebellion.0025.t:0 "Kralın İkilemi"

 agot_laughing_storm_rebellion.0025.desc:0 "[lyonel.GetTitledFirstName], [duncantall.GetTitledFirstName]'e karşı muharebe yargılamasını reddetti; beklemediğim bir hamle. Bu beklenmedik gelişme beni zor bir kararla baş başa bırakıyor.\n\nAradığı bağımsızlığı, diğer lordlar için oluşturacağı emsalin riskini göze alarak mı bahşedeyim, yoksa meydan okuyuşunun sonuçlarını mı uygulayayım; diyarı daha fazla çatışmaya sürükleme riskiyle? Fırtına Toprakları'nın kaderi ve Demir Taht'ın istikrarı terazide."

 agot_laughing_storm_rebellion.0025.a:0 "Sonuçlarıyla yüzleşmeli."

 agot_laughing_storm_rebellion.0025.b:0 "Ona bağımsızlığını bahşetmeliyim."

 agot_laughing_storm_rebellion.0026.t:0 "Fırtına Kralı"

 agot_laughing_storm_rebellion.0026.desc:0 "Zafer bizim. Bağımsızlığımızı kazandım ve Fırtına Toprakları, Durrandonların bizden önce yaptığı gibi bir kez daha özerk yönetilecek. Sancaklarımız yüksek dalgalanıyor; egemenliğimizi ve kadim haklarımızın restorasyonunu ilan ediyor.\n\nEvi [lyonel.GetHouse.GetBaseName]'in onuru onarıldı ve Demir Taht'ın boyunduruğundan azade, kendi kaderimizi şekillendirmeye hazırız. Herkes bilsin: Fırtına Kralı yüce hüküm sürüyor."

 agot_laughing_storm_rebellion.0026.a:0 "Fırtına Toprakları'na zafer!"

 agot_laughing_storm_rebellion.0027.t:0 "Toplanan Fırtına"

 agot_laughing_storm_rebellion.0027.desc:0 "Muharebe yargılamasını reddederek artık savaşın eşiğindeyim. Gerginlik hissedilir düzeyde ve Fırtına Toprakları kaçınılmaz çatışmaya hazırlanıyor. Bağımsızlığımızı güvenceye almak ve onurumuzu savunmak için, Demir Taht'ın gazabı karşısında bizimle duracak müttefikler aramalıyım.\n\nÖnümüzdeki yol tehlike dolu, ama sadık destekçilerle her fırtınaya göğüs gerebiliriz."

 agot_laughing_storm_rebellion.0027.a:0 "Müttefikleri topla."

 agot_laughing_storm_rebellion.0028.t:0 "Barış Sağlandı"

 agot_laughing_storm_rebellion.0028.desc:0 "Bir mücadele döneminin ardından, kraldan yeni bir nişan ayarlandı ve barış yeniden avucumuzun içinde. Fırtına Toprakları artık geleceğe umutla bakabilir; onurumuz sağlam, Demir Taht ile bağlarımız onarılmış.\n\nBu ittifak istikrar ve yenilenmiş bir birlik duygusu vaat ediyor; refaha ve halkımızın esenliğine odaklanmamıza izin veriyor."

 agot_laughing_storm_rebellion.0028.desc.no_betrothal:0 "Bir mücadele döneminin ardından barış yeniden avucumuzun içinde. Fırtına Toprakları artık geleceğe umutla bakabilir; onurumuz sağlam, Demir Taht ile bağlarımız onarılmış.\n\nBu ittifak istikrar ve yenilenmiş bir birlik duygusu vaat ediyor; refaha ve halkımızın esenliğine odaklanmamıza izin veriyor."

 agot_laughing_storm_rebellion.0028.a:0 "Bu yeni bulunan barışı kucaklayacağız."

 agot_laughing_storm_rebellion.0029.t:0 "Fırtına Kralı"

 agot_laughing_storm_rebellion.0029.desc:0 "Evi [lyonel.GetHouse.GetBaseName], bağımsızlık mücadelesinde zaferi kazandı. Fırtına Toprakları, Durrandonların onlardan önce yaptığı gibi bir kez daha özerk yönetilecek. Sancakları artık yüksek dalgalanıyor; egemenliklerini ve kadim haklarının restorasyonunu ilan ediyor.\n\nEvi [lyonel.GetHouse.GetBaseName]'in onuru onarıldı ve Demir Taht'tan azade, kendi kaderlerini şekillendirmeye hazırlar."

 agot_laughing_storm_rebellion.0029.a:0 "Gülen Fırtına son gülüşü gülen mi oldu?"

 agot_laughing_storm_rebellion.0030.t:0 "Barış Sağlandı"

 agot_laughing_storm_rebellion.0030.desc:0 "Bir mücadele döneminin ardından bir çözüme ulaşıldı ve diyara istikrar geri geldi. Fırtına Toprakları artık geleceğe bakmalı; yakın zamandaki kargaşaları, çatışmanın yüksek bedelinin bir hatırlatıcısı olarak.\n\nBarış onarılırken diyar iyileşme sürecine başlayabilir. Odak şimdi yeniden inşaya ve tüm halkının esenliğini sağlamaya kayıyor.\n\nBu an, birliğin öneminin ve barışın kırılgan doğasının bir dersi olarak hizmet etsin."

 agot_laughing_storm_rebellion.0030.a:0 "Umarız barış kalıcı olur."

 agot_laughing_storm_rebellion.0031.t:0 "Fırtına Ucu"

 agot_laughing_storm_rebellion.0031.desc:0 "[lyonel.GetFullNameNicknamed], [duncantall.GetTitledFirstName]'e karşı muharebe yargılamasında sonunu buldu. Bir zamanlar göz korkutucu bir tehdit olan meydan okuyuşu ve yiğitliği artık susturuldu. Diyarı parçalamakla tehdit eden isyan, liderinin düşmesiyle kısa kesildi.\n\nBarışın bedeli ağır oldu ve bu çatışmanın yankıları tarih sayfalarında kalacak. Fırtına Toprakları boyun eğdirilmişken diyar iyileşmeye başlayabilir, ama bu olayın gölgesi yıllarca Demir Taht'ın üzerinde asılı kalacak."

 agot_laughing_storm_rebellion.0031.a:0 "Savaştı, kaybetti ve şimdi dinleniyor."

 agot_laughing_storm_rebellion.0032.t:0 "Fırtınanın Gazabı"

 agot_laughing_storm_rebellion.0032.desc:0 "[duncantall.GetTitledFirstName]'i muharebe yargılamasında yendikten sonra kraldan adalet talep ediyorum: oğlu [duncansmall.GetTitledFirstNameNicknamed] Duvar'a gönderilsin ve hanelerimizi bağlayacak yeni bir nişan yapılsın. Ama kral haklı taleplerimi reddetti!\n\nBu hakaret küstahça ve tahammül edilemez. Artık silaha sarılıp bağımsızlığımız için savaşmaktan başka çare yok.\n\nFırtına Toprakları artık Demir Taht'a boyun eğmeyecek. Savaş kapıda ve onurumuzun zaferle onarıldığını göreceğiz."

 agot_laughing_storm_rebellion.0032.a:0 "Bana meydan okuduğu günü anacak."

 agot_laughing_storm_rebellion.0032.b:0 "Belki de barış aramak daha akıllıca olurdu."

 agot_laughing_storm_rebellion.0034.t:0 "Ejderhanın Hesap Günü"

 agot_laughing_storm_rebellion.0034.desc:0 "Bir zamanlar Demir Taht'a bağlı olan Fırtına Toprakları artık ayrı duruyor; [lyonel.GetNamePossessive] sancağı altında isyanla kurulmuş bir krallık.\n\nBabamın hükümdarlığı diyarın bölünmesine tanıklık etti; kabullenemeyeceğim bir hata. Targaryenlerin gücü o kadar kolay kırılmaz ve Fırtına Toprakları bizim hakkımız. Savaşın bir bedeli vardır. Kan, altın ve canlar — şimdi vereceğim karar çağlar boyunca yankılanacak."

 agot_laughing_storm_rebellion.0034.a:0 "Fırtına Toprakları'nı ateş ve kanla alacağım."

 agot_laughing_storm_rebellion.0034.b:0 "Şimdilik özgürlüklerinde kalsınlar."

 agot_laughing_storm_rebellion.0037.t:0 "Bölünmüş Bir Taht"

 agot_laughing_storm_rebellion.0037.desc:0 "Bir zamanlar Demir Taht'a bağlı olan [reconquest_target_title.GetName] artık meydan okuyan bir krallık olarak duruyor; bağımsızlıkları babamın başarısızlığının acı bir hatırlatıcısı. Her geçen gün daha cüretkârlaşıyorlar, servetleri şişiyor, güçleri denetimsiz. Krallık parçalanmış hissediyor, taht yokluklarıyla küçülmüş.\n\nİsyanlarının ağırlığı beni kemiriyor ve buna daha fazla katlanamam. Demir Taht bütün olmalı, egemenliği tartışmasız. [reconquest_target_title.GetNameNoTooltip]'i özgür bırakmak, düşmanlarımızın eline silah vermektir."

 agot_laughing_storm_rebellion.0037.a:0 "Demir Taht bütün olmalı. Savaşa hazırlan."

 agot_laughing_storm_rebellion.0037.b:0 "Belki de şimdi savaş zamanı değil."

 agot_laughing_storm_rebellion.0038.t:0 "Asmadan Bir Taç"

 agot_laughing_storm_rebellion.0038.desc:0 "Nesiller boyunca Arbor, adı büyük ama değerce asla üstün olmayan efendilere diz çöktü. Gemilerimiz onların kasalarını doldurdu, şaraplarımız sofralarını süsledi, ama yine de onların ağacında yalnızca bir daldık. Artık değil.\n\n[stormlands.GetNameNoTier], ejderhanın hükmünden azade duruyor; [arbor.GetNameNoTier] de öyle. Dünya bilsin — ben bağların ve filoların sıradan bir lordu değil, kendi başına bir kralım. Arbor hiçbir efendiye boyun eğmez."

 agot_laughing_storm_rebellion.0038.a:0 "Arbor, her zaman olması gerektiği gibi kendini yönetsin."

 agot_laughing_storm_rebellion.0039.t:0 "Asma Özgürleşiyor"

 agot_laughing_storm_rebellion.0039.desc:0 "İnsanlar hatırladığından beri [arbor.GetNameNoTierPossessive] zenginliği ve filoları [reach.GetNameNoTier]'e hizmet etti; lordları sadık tebaalar olarak yemin edip bağlandı.\n\nAma şimdi, ejderha bir kenara atılmış ve kendi yönetimimiz güvenceye alınmışken, kendilerine ait bir taç iddia ediyorlar. [k_arbor_holder.GetTitledFirstNameNicknamed] kendini [Select_CString(k_arbor_holder.IsFemale,'queen','king')] ilan ediyor, sancakları artık bizim çağırabileceğimiz sancaklar değil."

 agot_laughing_storm_rebellion.0039.desc.olenna:0 "\n\n[olenna.GetTitledFirstName] salonlarımda oyalanıyor; adı konuk, gerçekte bir rehine. [k_arbor_holder.GetTitledFirstNameNoTooltip] kendine [Select_CString(k_arbor_holder.IsFemale,'queen','king')] diyebilir, Arbor'un Reach'ten ayrı durduğunu iddia edebilir, ama kan, gururdan daha güçlü bir zincirdir."

 agot_laughing_storm_rebellion.0039.a:0 "Reach tek başına duruyor."

 agot_laughing_storm_rebellion.0039.b:0 "Arbor'a haber gönder — [k_arbor_holder.GetHerHis] tacı, onun canı için."

 agot_laughing_storm_rebellion.0040.t:0 "Bir Tacın Bedeli"

 agot_laughing_storm_rebellion.0040.desc:0 "Bir mesaj geliyor, boğazıma dayanmış bir kılıcın ağırlığıyla. [olenna.GetTitledFirstName], [e_reach_holder.GetTitledFirstName]'in zindanlarında; [e_reach_holder.GetHerHis] tacımı kök salmadan kırma girişiminde bir piyon. [e_reach_holder.GetSheHe|U] basit bir seçim sunuyor — sadakat yemini et, Arbor'un her zaman eğildiği gibi eğil, ya da [olenna.GetTitledFirstNameNoTooltip]'in meydan okuyuşumun bedelini ödemesini izle.\n\nDiz çökmek, kazandığımız her şeyi geri almaktır. Reddetmek, kendi kanımı mahkûm etmektir. Doğru seçim yok, yalnızca yaşamak zorunda kalacağım seçim var."

 agot_laughing_storm_rebellion.0040.a:0 "Arbor eğiliyor — Olenna yaşamalı."

 agot_laughing_storm_rebellion.0040.b:0 "Üzgünüm, Olenna."

 agot_laughing_storm_rebellion.0041.t:0 "Bir Kenara Atılan Taç"

 agot_laughing_storm_rebellion.0041.desc:0 "[k_arbor_holder.GetTitledFirstName] aklını başına topladı. [k_arbor_holder.GetHerHis|U] tacı bir kenara atıldı, [k_arbor_holder.GetHerHis] sancakları indirildi ve [arbor.GetNameNoTier] bir kez daha [reach.GetNameNoTier]'e eğiliyor. Terk edilmiş bir taht, geri kazanılan bir can. Adil bir takas — ya da belki [k_arbor_holder.GetSheHe]'nin yapabileceği tek takas.\n\n[k_arbor_holder.GetHerHis] teslimiyetiyle, [olenna.GetTitledFirstNamePossessive] zindanlarımdaki yeri artık bir amaca hizmet etmiyor. Arbor bir kez daha benim; her zaman olması gerektiği gibi."

 agot_laughing_storm_rebellion.0041.a:0 "Onu serbest bırak — bu mesele kapandı."

 agot_laughing_storm_rebellion.0042.t:0 "Bir Tacın Bedeli"

 agot_laughing_storm_rebellion.0042.desc:0 "[k_arbor_holder.GetTitledFirstName] seçimini yaptı. [arbor.GetNameNoTier] tek başına duruyor, sancakları eğilmemiş, tacı kırılmamış. [k_arbor_holder.GetSheHe|U] diz çökmektense kendi kanının dökülmesini tercih eder. Öyle olsun.\n\n[olenna.GetTitledFirstNamePossessive] kaderi mühürlendi. Bana meydan okuyanlara bir uyarı; çok sıkı tutulan bir taht için ödenen bir bedel. [reach.GetNameNoTier] bu hakareti unutmayacak, ben de unutmayacağım.\n\nArbor ayakta kalabilir, ama kökleri kendi kanıyla sulandı."

 agot_laughing_storm_rebellion.0042.a:0 "Öyle olsun."

 agot_laughing_storm_rebellion.0050.t:0 "Gülen Fırtına İsyanı"

 agot_laughing_storm_rebellion.0050.desc:0 "Diyar kaosun pençesinde. [lyonel.GetTitledFirstNameNicknamed], Demir Taht'a karşı açık isyanda sancaklarını yükseltti. Öfkesi, tahtın varisi [duncansmall.GetTitledFirstNameNicknamed]'in Lyonel'in kızını, aşk için düşük doğumlu bir kızla evlenmek üzere bir kenara bırakmasıyla alevlendi — Evi Baratheon'u küçük düşüren ve Fırtına Ucu ile Kralın Şehri arasındaki ittifakı parçalayan bir skandal.\n\nGülen Fırtına alay konusu olmayacak. Meydan okuyuşu Fırtına Toprakları'nda yankılanıyor; diyarı savaşa sürükleme tehdidi taşıyan, Targaryen hükmüne bir meydan okuma. Lyonel öfkeyle vururken, Demir Taht bir hesap gününe hazırlanmalı. Savaş rüzgârları uluyor ve her hane sadakatlerinin nerede olduğuna karar vermeli."

 agot_laughing_storm_rebellion.0050.a:0 "Fırtına geldi."

 agot_laughing_storm_rebellion.0100.t:0 "Liderlik Meydan Okuması"

 agot_laughing_storm_rebellion.0100.desc:0 "[daemonbf_lsr.GetTitledFirstNameNicknamed]'in liderlikle boğuşmasını çok uzun süre izledim. İşleri kendi ellerime alma zamanı geldi. Liderlik hakkı için Daemon'a düelloya meydan okuyacağım.\n\nYalnızca güç ve kararlılıkla geleceğimizi güvenceye alabilir ve haklı olarak bize ait olanı geri kazanabiliriz."

 agot_laughing_storm_rebellion.0100.a:0 "Liderlik benim olacak."

 agot_laughing_storm_rebellion.0100.b:0 "[daemonbf_lsr.GetFirstNameNoTooltip]'i lider olarak bırakıyorum."

 agot_laughing_storm_rebellion.0101.t:0 "Hükümranlık Düellosu"

 agot_laughing_storm_rebellion.0101.desc:0 "[maelysbf_lsr.GetTitledFirstNameNicknamed], liderliğime meydan okuyarak kontrolü kendisi ele geçirmek istiyor. Bu düelloyu reddetmek, halkımızın saygısını ve sadakatini kaybetmek demek. Hükmetme hakkımı savunmanın ve gücümü kanıtlamanın zamanı geldi.\n\nBu meydan okumayı kabul etmeli ve konumumu ile davamızın geleceğini güvenceye almak için [maelysbf_lsr.GetFirstNameNoTooltip] ile dövüşmeliyim."

 agot_laughing_storm_rebellion.0101.a:0 "Düello başlasın."

 agot_laughing_storm_rebellion.0102.t:0 "Blackfyre'ın Gölgesi"

 agot_laughing_storm_rebellion.0102.desc:0 "[maelysbf_lsr.GetFirstNameNicknamed], paralı askerleriyle sarayıma fırtına gibi daldı; gözleri hırs ve zalimlikle yanıyor. Üzerime abanırken yüreğimi saran korkuyu hissediyorum; canavarca varlığı kaderimin üzerine karanlık bir gölge düşürüyor.\n\nDoğduğum unvanlar, bildiğim her şey elimden kayıp gidiyor; dahası, bakışları yalnızca hırsızlık vaat etmiyor. Beni idam etmeye, canıma ve iddiama son vermeye niyetli. Canavarın karşısında tek başıma duruyorum, geleceğim neredeyse sönmüş."

 agot_laughing_storm_rebellion.0102.a:0 "Canavardan kaçış yok."

 agot_laughing_storm_rebellion.0102.b:0 "Bu son olamaz."

 agot_laughing_storm_rebellion.0102.c:0 "[king_house_member.GetTitledFirstName] bunu öğrenmeli."

 agot_laughing_storm_rebellion.0104.maelys.t:0 "Canavarın Yükselişi"

 agot_laughing_storm_rebellion.0104.notmaelys.t:0 "Canavarın Çöküşü"

 agot_laughing_storm_rebellion.0104.maelys.desc:0 "Liderlik artık benim. Güç ve kararlılıkla halkımı zafere taşıyacak ve haklı olarak bize ait olanı geri kazanacağım. Davamızın geleceği benim elimde ve zafere ulaşana dek hiçbir şeyden vazgeçmeyeceğim.\n\nBize karşı çıkan herkes titresin, zira artık 'Canavar' Maelys liderlik ediyor."

 agot_laughing_storm_rebellion.0104.notmaelys.desc:0 "Maelys düştü ve liderliğim artık güvence altında. Güç ve kararlılıkla halkımı zafere taşıyacağım."

 agot_laughing_storm_rebellion.0104.notmaelys.a:0 "İleri!"

 agot_laughing_storm_rebellion.0104.maelys.a:0 "Ve şimdi hükümdarlığım başlıyor."

 agot_laughing_storm_rebellion.0105.t:0 "Küller ve Yeminler"

 agot_laughing_storm_rebellion.0105.desc:0 "Üç yıl oldu ve yenilginin tadı hâlâ dilimde safra gibi. Dördüncü Blackfyre İsyanı, soğuk çeliğe ve hain kanına karşı parçalandı; sancaklarımız yırtıldı, akrabalarımız öldürüldü ya da dağıtıldı.\n\n[daemon_blackfyre.GetFirstName] için kan döktüm, oğulları için, sönmekte olan bir hanedanın yıkıntısından oymaya yemin ettiğimiz hayal için. Ama yine de yetmedi. Golden Company ayakta.\n\nSürgünler, kırılanlar, savaştan başka ev bilmeyen kılıçlar. Blackfyreler bitmedi, ben de bitmedim. Bir gün Dar Deniz'i yeniden geçeceğiz. Bir gün ejderha hakkını alacak."

 agot_laughing_storm_rebellion.0105.a:0 "Hiçbir kral sonsuza dek yaşamaz."

 agot_laughing_storm_rebellion.0201.t:0 "Pullanmış Buluntu"

 agot_laughing_storm_rebellion.0201.desc:0 "Bir saray mensubu, avluda bulunan bir keşfin haberiyle soluğu kesilmiş halde odama koşuyor. Bir bebek bulunmuş; terk edilmiş ve yapayalnız. Çocuğa yaklaşınca olağanüstü bir şey fark ediyorum. [allard.GetHerHis|U] derisinin tuhaf bir dokusu var, pul gibi.\n\nÇocuğun durumundan etkilenip duygulanarak [allard.GetHerHim] kanatlarımın altına almaya karar veriyorum; [allard.GetSheHe]'nin sarayımın güvenliği ve rehberliği içinde büyütüleceğine yemin ederek."

 agot_laughing_storm_rebellion.0201.a:0 "Hoş geldin, küçük pullu bebek."

 agot_laughing_storm_rebellion.0300.t:0 "Casterly Kayası'nın Büyücü Kadını"

 agot_laughing_storm_rebellion.0300.desc:0 "Lütuftan düşmek acı bir şey, ama geri çevrilemeyecek kadar acı değil. [tytos.GetTitledFirstName] yumuşak bir adam, nazik bir dokunuşla etkilenen biri ve ben hâlâ erkeklere eşlerini unutturmayı biliyorum.\n\n[jeyne.GetTitledFirstName]? Bir gölge, Casterly Kayası koridorlarında uçuşan bir fısıltı; ama ben onlara adımı yeniden söyleteceğim.\n\nYeterince hor görüldüm. Kendi yolumu oymak zorundayım ve bu yol [tytos.GetTitledFirstNameNoTooltip]'in yüreğinden geçiyorsa, öyle olsun."

 agot_laughing_storm_rebellion.0300.a:0 "Aslanın yüreği yakında benim için atacak."

 agot_laughing_storm_rebellion.0301.t:0 "Aslanın Baştan Çıkarılışı"

 agot_laughing_storm_rebellion.0301.desc:0 "[ellyn.GetFirstName] yakınında duruyor; sözleri bal kadar tatlı, gözleri bir zamanlar olanın ve yeniden olabileceğin vaatleriyle dolu. Aramızdaki hava yoğunlaşıyor; eli benimkine değiyor, dokunuşu Casterly Kayası'nın soğuk taş duvarlarını delip geçiyor.\n\n[jeyne.GetFirstName]... karım, görevim. Ama Ellyn; ateşiyle, hırsıyla. İçimde bir şeyi uyandırıyor, tehlikeli bir şey. Geri mi döneyim, yoksa alevin ikimizi de tüketmesine izin mi vereyim?"

 agot_laughing_storm_rebellion.0301.a:0 "Jeyne karım, onurum onunla."

 agot_laughing_storm_rebellion.0301.b:0 "Belki ateş riske değer."

 agot_laughing_storm_rebellion.0302.t:0 "Bir Aslan Tarafından Reddedilmek"

 agot_laughing_storm_rebellion.0302.desc:0 "Tytos geri döndü. O zayıf, sızlanan aslan benim yerime [jeyne.GetFirstName]'i seçti. Ona soğuk görevden başka bir şey sunmayan donuk, renksiz bir kadın. Ben ona güç, zafer, bir kraliçenin hükümdarlığını teklif ettim ve o hâlâ ona tutunuyor.\n\nOnun gibi aptallar sık sık bu tür seçimler yapar, ama bir aptalın hatası cevapsız kalmayacak. Bu hakareti kabul edip bırakabilirim, ya da [jeyne.GetFirstNamePossessiveNoTooltip] Casterly Kayası leydisi olarak hükümdarlığının, hayal ettiğinden çok daha kısa olmasını sağlayabilirim."

 agot_laughing_storm_rebellion.0302.a:0 "Zamanımı bekleyeceğim... şimdilik."

 agot_laughing_storm_rebellion.0302.b:0 "Jeyne, bana karşı gelmenin bedelini ödeyecek."

 agot_laughing_storm_rebellion.0303.t:0 "Aslanın Gerçek Eşi"

 agot_laughing_storm_rebellion.0303.desc:0 "[tytos.GetFirstName] bana geldi, nihayet her zaman bildiğimi gördü: ben onun haklı kraliçesiyim, onu [jeyne.GetFirstName]'in asla yapamayacağı yüksekliklere taşıyabilecek kişi. Ama aramızda hâlâ bir engel var. Jeyne.\n\nO onun karısı olduğu sürece gerçekten birlikte hükmedemeyiz. Tytos'u onu bir kenara bırakmaya, beni bir kez daha Casterly Kayası'nın Leydisi yapmaya ikna etmeliyim. Birlikte, olmamız gerektiği gibi hükmedeceğiz."

 agot_laughing_storm_rebellion.0303.a:0 "Bunu resmiyet kazandırmalıyız, aşkım."

 agot_laughing_storm_rebellion.0304.t:0 "Bir Aslanın İkilemi"

 agot_laughing_storm_rebellion.0304.desc:0 "[ellyn.GetFirstNamePossessive] arzusu parlak yanıyor, ama önümüzdeki yol tehlike dolu. [jeyne.GetFirstName] hâlâ karım olarak yerini koruyor; ilişkimizi gizli tutabilsem de, sırların Casterly Kayası koridorlarında gün yüzüne çıkma huyu var.\n\nYüce Septón tek başına Jeyne ile bağımı koparıp Ellyn ile evlenme özgürlüğü bahşedebilir, ama böyle bir talep hafife alınmaz. Gölgelerde devam mı edeyim, yoksa bedeli ne olursa olsun yeni bir geleceğe doğru cesur bir adım mı atayım?"

 agot_laughing_storm_rebellion.0304.a:0 "Bu şimdilik gizli kalsın..."

 agot_laughing_storm_rebellion.0304.b:0 "Babamın kutsamasını isteyeceğim."

 agot_laughing_storm_rebellion.0304.c:0 "Yüce Septón'un kutsamasını isteyeceğim."

 agot_laughing_storm_rebellion.0305.t:0 "Bir Babanın Yükü"

 agot_laughing_storm_rebellion.0305.desc:0 "[tytos.GetFirstName], oğlum, önümde duruyor; aşktan ve [ellyn.GetFirstName]'den bahsediyor. [jeyne.GetFirstName]'i, karısını bir kenara bırakıp ölen kardeşinin dul karısıyla evlenmek istiyor. Geleneklerimize, Lannisterlerin uzun süredir gözettiği düzene aykırı. Yine de, gönlü kararlı ve belki bir yol vardır.\n\nHanemizin ağırlığını arkama alıp meseleyi zorlarsam, Yüce Septón ikna edilebilir."

 agot_laughing_storm_rebellion.0305.a:0 "Yüce Septón'a yazacağım."

 agot_laughing_storm_rebellion.0306.t:0 "Yüce Septón'un Hükmü"

 agot_laughing_storm_rebellion.0306.desc:0 "Yüce Septón'un cevabı, geleneğin ve tanrı ile insan yasalarının ağırlığıyla dolu geliyor. Bu boşanmanın kutsal evlilik bağlarına ağır bir suç olacağını yazıyor."

 agot_laughing_storm_rebellion.0306.greedy.desc:0 "\n\nAma mektup sona yaklaşırken üslup yumuşuyor. Satır aralarında bir fısıltı. Belki de uygun bir minnettarlık gösterisiyle, yüreği ikna edilebilir. Dikkatle sunulursa altın kabul etmekten çekinmeyeceği sözü hızla yayılıyor.\n\nSeçim şimdi önümde. Bu meseleyi geride bırak, ya da kutsamasının bedelini öde."

 agot_laughing_storm_rebellion.0306.a:0 "Oldu. Devam etmeliyiz."

 agot_laughing_storm_rebellion.0306.b:0 "Belki cömert bir teklif fikrini değiştirir."

 agot_laughing_storm_rebellion.0306.c:0 "Rüşvetle onurumu lekeleyemem."

 agot_laughing_storm_rebellion.0306.c.tt:0 "Ellyn'in kardeşi Roger, Yüce Septón'a rüşvet vermeyi de deneyebilir"

 agot_laughing_storm_rebellion.0307.t:0 "Bir Kardeşin İkilemi"

 agot_laughing_storm_rebellion.0307.desc:0 "[gerold.GetFirstName], [tytos.GetFirstName]'in [jeyne.GetFirstName]'den boşanıp [ellyn.GetFirstName] ile evlenmesi için Yüce Septón'un kutsamasını istedi, ama kutsama reddedildi; tabii altın Yüce Septón'un fikrini değiştiremezse.\n\nİlginçtir ki, Lannisterlerin zenginliğine rağmen Tytos rüşveti ödemedi. Şimdi [ellyn.GetFirstNamePossessiveNoTooltip] umutları terazide ve o bana, kardeşine yardım etmem için dönüyor.\n\nOnun yeniden güce yükselişini görmek isterdim, ama bedel Castamere için bile küçümsenecek bir meblağ değil."

 agot_laughing_storm_rebellion.0307.a:0 "Bedel, Ellyn için bile çok yüksek."

 agot_laughing_storm_rebellion.0307.b:0 "Kız kardeşim için, ne gerekirse ödeyeceğim."

 agot_laughing_storm_rebellion.0308.t:0 "Yasayla Bağlı, Arzuyla Parçalanmış"

 agot_laughing_storm_rebellion.0308.desc:0 "Görünüşe göre boşanmam için yasal bir yol yok; [jeyne.GetFirstName]'e ettiğim yeminlerden beni azat edecek bir Yüce Septón kutsaması yok. Tanrılar da insanlar da yolumuza dikiliyor, ama yüreğim hâlâ [ellyn.GetFirstName]'ye özlem duyuyor.\n\nGelenek bizi zincirlerde tutabilir, ama aşk bu kadar kolay boyun eğmez."

 agot_laughing_storm_rebellion.0308.a:0 "Yasa ne derse desin, yine de birbirimizi sevebiliriz."

 agot_laughing_storm_rebellion.0308.b:0 "Yedi Cehennem'e kadar gelenek, Ellyn ile evleneceğim!"

 agot_laughing_storm_rebellion.0308.b.tt:0 "Babama bu yüzden mirastan reddedilmiş olabilirim"

 agot_laughing_storm_rebellion.0309.t:0 "Bir Oğlun İhaneti"

 agot_laughing_storm_rebellion.0309.desc:0 "Tytos, yasaya ve ailemizin onuruna karşı geldi; [jeyne.GetFirstName]'i bir kenara atıp Reyne kızıyla evlendi. Geleneğin üzerinde yüreğini seçti; ne uğruna? Evi Lannister'a utanç getirebilecek gelip geçici bir tutku.\n\nOnu uyardım ve yine de dünyamızı bir arada tutan düzene karşı davrandı."

 agot_laughing_storm_rebellion.0309.a:0 "Tanrılar seni affetsin... ve pişman olma."

 agot_laughing_storm_rebellion.0309.b:0 "Sen benim oğlum değilsin, kendini mirastan reddedilmiş say."

 agot_laughing_storm_rebellion.0310.t:0 "Kaderle Bağlanmış"

 agot_laughing_storm_rebellion.0310.desc:0 "Nihayet, Yüce Septón onayını verdi. [jeyne.GetFirstName]'den özgürlüğüme giden yol açık ve [ellyn.GetFirstName] gerçek karım olarak yanımda duracak.\n\nYediler bize gülümsedi ve artık önümüzde hiçbir engel yok. Birlikte, Ellyn ve ben geleceğimizi, belki de Evi Lannister'ın kaderini yeniden şekillendireceğiz. Dünya fısıldasın ve dedikodu yapsın; bu büyük bir şeyin başlangıcı."

 agot_laughing_storm_rebellion.0310.ellyn.desc:0 "[tytos.GetTitledFirstNamePossessive] [jeyne.GetFirstName]'den özgürlüğünün yolu açık ve şimdi gerçek karısı olarak hak ettiğim yeri yanında alacağım.\n\nYediler bize gülümsedi ve her zaman hükmetmem gereken güçle aramda hiçbir şey durmuyor. Birlikte, Tytos ve ben geleceğimizi, belki de Evi Reyne'in kaderini yeniden şekillendireceğiz. Fısıldasın ve dedikodu yapsınlar, cesaretleri yetiyorsa — bu yalnızca başlangıç."

 agot_laughing_storm_rebellion.0310.ellyn_anyway.desc:0 "Başardık. Diyarın isteklerine karşı, saray mensuplarının fısıltılarına ve geleneğin ağırlığına karşı, artık [tytos.GetFirstName]'in karısı olarak duruyorum. Yediler bu birliği kutsamamış olabilir, ama güç dindarlıktan gelmez; hırstan gelir ve bende bundan fazlasıyla var.\n\nSoylular incilerine sarılsın, septónlar vaaz versin; zira ben her zaman olmam gereken yerdeyim. Birlikte hükmedeceğiz ve bize karşı çıkanlar, meydan okumanın bedelini öğrenecek."

 agot_laughing_storm_rebellion.0310.a:0 "Yeni hayatımız şimdi başlıyor."

 agot_laughing_storm_rebellion.0311.t:0 "Bir Sevgilinin İhaneti"

 agot_laughing_storm_rebellion.0311.desc:0 "[tytos.GetFirstName]'in tamamen benim olacağını, [jeyne.GetFirstName]'i benim için bir kenara atacağını sanmıştım. Ama şimdi, paylaştığımız her şeyin ardından tereddüt ediyor. O ürkek kadının yanında kalmayı, birlikte tutabileceğimiz gücü iddia etmeye tercih ediyor.\n\nNe kadar zayıf, görev ve korkuyla ne kadar kolay sürükleniyor. Ondan daha fazlasını bekliyordum, ama görünüşe göre planlarımı yeniden düşünmeliyim. Benimle büyüklüğe yükselmeyecekse, belki başka bir yol bekliyordur."

 agot_laughing_storm_rebellion.0311.a:0 "Bu kadar kolay bir kenara atılmayacağım."

 agot_laughing_storm_rebellion.0400.t:0 "Sur'da Yeni Lord Kumandan"

 agot_laughing_storm_rebellion.0400.desc:0 "[jack.GetTitledFirstName]'in yakın zamandaki ölümüyle, Gece Nöbeti'nin Andlı Kardeşleri beni yeni kumandanları olarak seçti. Şimdi kardeşliği gözetmek ve diyarı Duvar'ın ötesinde pusuya yatan tehlikelerden korumak benim görevim...\n\n#weak Gece toplanıyor ve şimdi nöbetim başlıyor. Ölümüme dek sürecek. Eş almayacağım, toprak tutmayacağım, çocuk babası olmayacağım. Taç giymeyeceğim ve zafer kazanmayacağım. Görevimde yaşayıp öleceğim. Karanlıktaki kılıç benim. Duvarlardaki bekçi benim. Soğuğa karşı yanan ateş, şafağı getiren ışık, uyuyanları uyandıran boru, insan diyarlarını koruyan kalkan benim. Hayatımı ve onurumu Gece Nöbeti'ne adıyorum; bu gece ve gelecek tüm geceler için.#!"

 agot_laughing_storm_rebellion.0400.a:0 "Ve şimdi nöbetim başlıyor."

 agot_laughing_storm_rebellion.0401.t:0 "Kara Kızkardeş"

 agot_laughing_storm_rebellion.0401.desc:0 "[bloodraven.GetTitledFirstName]'i Duvar'a göndereli yıllar oldu ve onunla birlikte Valyria çeliği kılıcı [dark_sister_sword.GetName] de gitti. Kara Kızkardeş kadar kadim ve güçlü bir kılıç, Duvar'da değil tahta ait.\n\nBrynden'e haber gönderip kılıcı hak ettiği yere, Demir Taht'a geri getirmesi için ona bir servet altın teklif edebilirim."

 agot_laughing_storm_rebellion.0401.a:0 "Kara Kızkardeş Demir Taht'a ait."

 agot_laughing_storm_rebellion.0401.b:0 "Kılıç benim için bir anlam ifade etmiyor."

 agot_laughing_storm_rebellion.0402.opening:0 "[bloodraven.GetTitledFirstNameNoTooltip]'e"

 agot_laughing_storm_rebellion.0402.desc:0 "Sana kralın olarak değil, Eski Valyria kanının soyundan biri olarak yazıyorum: tahta ait olanı tahta geri vermeni istiyorum. [dark_sister_sword.GetName], efsanelerin kılıcı, atalarımızın ellerinde hem kan hem de zafer görmüş bir bıçak, Duvar'ın donmuş topraklarında değil Demir Taht'a aittir.\n\nSana ağırlığına ve değerine yaraşır bir altın meblağ teklif ediyorum; bir kez daha ait olduğu yerde dinlensin diye. Ne dersin, Brynden? Hanemizi onurlandırıp Kara Kızkardeş'i geri mi vereceksin, yoksa karlara mı kaybolacak?"

 agot_laughing_storm_rebellion.0402.a:0 "Kara Kızkardeş benimle kalacak."

 agot_laughing_storm_rebellion.0402.b:0 "Kara Kızkardeş'i hak ettiği yere geri vereceğim."

 agot_laughing_storm_rebellion.0403.opening:0 "Sayın [aegonv.GetTitledFirstNameNoTooltip]"

 agot_laughing_storm_rebellion.0403.desc:0 "Mektubun bana Duvar'da ulaştı ve isteğini dikkatle değerlendirdim. [dark_sister_sword.GetName] bana sadık bir yoldaş oldu; eski çağların büyük Targaryenlerine olduğu gibi. Kesiği düşmanlarımızın kanını tattı ve elimde diyarı savundu. Ama ben artık eskisi gibi bir adam değilim ve kılıcı kuşanma zamanım geçti.\n\nDiyarın iyiliği ve hanemizi onurlandırmak için, Kara Kızkardeş'i sana geri vereceğim; bir kez daha olması gerektiği gibi Demir Taht'a hizmet etsin. Onu tutacak layık bir el bulasın."

 agot_laughing_storm_rebellion.0403.a:0 "Kara Kızkardeş hak ettiği yuvasına dönüyor."

 agot_laughing_storm_rebellion.0404.opening:0 "Sayın [aegonv.GetTitledFirstNameNoTooltip]"

 agot_laughing_storm_rebellion.0404.desc:0 "Sözlerin bana ulaştı, ama teklifini reddetmeliyim. [dark_sister_sword.GetName], sayısız savaşta yanımdaydı; çeliği hainlerin ve diyarın düşmanlarının kanıyla lekeli. O artık bana ait; burada, Duvar'da; diyara hizmetinin sürdüğü yerde. Kuzey sert ve acımasız, ama kefaretimi burada ödüyorum ve Kara Kızkardeş de amacını burada yerine getiriyor.\n\nBu donmuş vahşi doğada sunduğun altının bana değeri yok ve ondan vazgeçmeyeceğim. Bir kez kurulan bazı bağlar kırılamaz."

 agot_laughing_storm_rebellion.0404.a:0 "Bu unutulmayacak."

 agot_laughing_storm_rebellion.0420.t:0 "Duvar'ın Ötesinden Gelen Çağrı"

 agot_laughing_storm_rebellion.0420.desc:0 "Görüler güçlendi: ağaç, soğuk ve Duvar'ın ötesinden çağırıyormuş gibi görünen tuhaf fısıltılar. Şimdi, her zamankinden net hissediyorum; donmuş vahşi doğada beni çeken bir şey var. Gece boyunca uluyan rüzgâr, bir ses gibi; beni kuzeye, bilinen dünyanın sınırının ötesinde ne varsa keşfetmeye davet ediyor.\n\nHer içgüdüm bunun tehlikeli, belki de bir tuzak olduğunu söylüyor, ama çekim yadsınamaz. Duvar, benimle ötesinde bekleyen arasında duruyor; ama kaderimin orada, buzun ve gölgelerin içinde olduğu hissini görmezden gelemiyorum."

 agot_laughing_storm_rebellion.0420.a:0 "Cevap Duvar'ın ötesinde, onları bulmalıyım."

 agot_laughing_storm_rebellion.0420.a.tt:0 "Kuzeye yolculuk etmeye başlıyorsun"

 agot_laughing_storm_rebellion.0420.b:0 "Görevim burada."

 agot_laughing_storm_rebellion.0421.t:0 "Kanatlı Yılan'ın Son Uçuşu"

 agot_laughing_storm_rebellion.0421.desc:0 "Orada, kadim ağacın altında onları görüyorum: rüyalarımdaki yeşil derili çocuklar. Sessizce duruyorlar, gözleri bende; sanki en başından beri beni bekliyorlardı. Çevrelerindeki hava farklı; kadim ve güçlü bir şeyle yüklü. Ben de içimde hissediyorum: bir değişim, sanki bir parçam çoktan değişmiş; artık önceki adam olmadığım gibi.\n\nYaklaşıyorum ve ormanın kendisi nefes alıyor gibi; yapraklar, neredeyse anlayabildiğim sırlar fısıldıyor. Çocuklar konuşmuyor, ama davetlerini, çağrılarını hissediyorum; beni kendi dünyalarına, hayal edebileceğimden çok daha kadim bir şeye çekiyor."

 agot_laughing_storm_rebellion.0421.a:0 "Bu yolun nereye gittiğini görmeliyim."

 agot_laughing_storm_rebellion.0421.a.tt:0 "...ve belki asla geri dönmem."

 agot_laughing_storm_rebellion.0451.t:0 "Ağaç"

 agot_laughing_storm_rebellion.0451.desc:0 "Uyku beni sararken, kendimi bir rüyaya süzülürken buluyorum; birçok kez yürüdüğüm, ama yine de daha az tedirgin edici gelmeyen bir rüya. Çevremdeki dünya silikleşiyor ve artık Gece Nöbeti'nin Muhafız Kumandanı değilim; tuhaf, soğuk bir coğrafyada yalnız bir figürüm. Önümde, bir tepede bir ağaç duruyor; devasa ve kadim, soluk kabuğu ay ışığında kemik gibi parlıyor. Altında, bekleyen bir ağız gibi açılan bir mağara.\n\nOnun çekimini hissediyorum, beni yaklaşmaya çağırıyor. Öne adım atıyorum, ama ayaklarımın altındaki zemin donmaya başlıyor; buzlu parmaklarla yukarı süzülüp beni yerimde tutmakla tehdit ediyor. İlerlemek için mücadele ediyorum, ama kırağı güçleniyor.\n\nAğaca ulaşmama az kala soğuk beni alt ediyor ve irkilerek uyanıyorum; görü hâlâ zihnimde canlı."

 agot_laughing_storm_rebellion.0451.a:0 "Bu rüya gerçekten ne anlama geliyor?"

 agot_laughing_storm_rebellion.0451.a.tt:0 "...süzülen soğukluk ben miyim? Karanlık mağara? Ya da belki ağacın kendisi?"

 agot_laughing_storm_rebellion.0452.t:0 "Kara Kurt"

 agot_laughing_storm_rebellion.0452.desc:0 "Uyku beni sürüklerken, kendimi başka bir rüyada salınırken buluyorum. Dünya, çorak ve karla kaplı bir vahşi doğa; rüzgâr pelerinimi bıçak gibi kesiyor. Uzakta onu görüyorum: gördüğüm herhangi birinden daha büyük bir kurt; kürkü gece göğü kadar kara, coğrafyanın gölgelerine karışıyor. Gözleri, soluk karın üzerinde kan gibi kızıl, şiddetli ve tedirgin edici bir ışıkla parlıyor. Kurt, o yanan gözlerle beni izliyor; bakışı soğuğu delip geçiyor, sanki benim bilmediğim bir şeyi biliyor.\n\nYaklaşmayı deniyorum, ama her adımda kurt, her zaman erişimimin hemen dışında, sise çekiliyor. Karların içinde kaybolmadan önce gördüğüm son şey kızıl gözler.\n\nYüreğim çarparak irkiliyorum; kara kurdun görüntüsü zihnime kazınmış."

 agot_laughing_storm_rebellion.0452.a:0 "Bu kurt benden ne istiyor?"

 agot_laughing_storm_rebellion.0452.a.tt:0 "...ve gözleri neden benimkilere bu kadar benziyor?"

 agot_laughing_storm_rebellion.0453.t:0 "Tuhaf Karga"

 agot_laughing_storm_rebellion.0453.desc:0 "Uykuya süzülürken, yine başka bir tuhaf rüyaya çekiliyorum. Kendimi ıssız bir tarlada dururken buluyorum; üzerimdeki gökyüzü karanlık ve ağır. Uzaktan bir karga süzülüyor; kara kanatları havayı sessiz bir kesinlikle yarıyor. Yaklaştıkça tuhaf bir şey gözüme çarpıyor: bu sıradan bir karga değil. Alnının ortasına tünemiş üçüncü bir göz, kırpmadan ve her şeyi bilircesine bana bakıyor. Karga yukarıda daireler çiziyor; bakışı ürkütücü, sanki kavrayabildiğimden çok daha fazlasını görüyor.\n\nBir kez gaklıyor; çığlığı ıssız coğrafyada yankılanıyor ve kuşun kendisinin çok ötesinde bir şey tarafından izlendiğimi hissediyorum.\n\nYüreğim, bakışının ağırlığıyla dolu olarak uyanıyorum ve üç gözlü karganın görüntüsü düşüncelerimin karanlığında oyalanıyor."

 agot_laughing_storm_rebellion.0453.a:0 "Karga üçüncü gözüyle hangi sırları görüyor?"

 agot_laughing_storm_rebellion.0453.a.tt:0 "...bende ne görüyor?"

 agot_laughing_storm_rebellion.0454.t:0 "Tırmanan Çocuk"

 agot_laughing_storm_rebellion.0454.desc:0 "Uyku beni bir kez daha sarıyor; hem tuhaf hem tanıdık gelen bir rüyaya çekiyorum. Kendimi büyük bir kalenin gölgelerinde dururken buluyorum; duvarları gökyüzüne uzanıyor. Göz ucuyla bir oğlan görüyorum; küçük ve çevik, duvarları rahatça tırmanıyor; elleri ve ayakları taşta imkânsız tutamaklar buluyor. Bir gölge gibi hareket ediyor, korkusuz ve hızlı, gittikçe yükseliyor. Çocuk geriye bakmıyor, sanki düşme korkusu tanımıyor.\n\nOna sesleniyorum, ama sesim rüzgâr tarafından yutuluyor. Yükselişine devam ediyor; herhangi bir ölümlünün gitmemesi gereken yerden daha yükseğe, kulenin tepesindeki sise karışana dek. \n\nÇocuğun görüntüsü zihnimde taze olarak uyanıyorum; imkânsız tırmanışı düşüncelerimin gerisinde oyalanıyor."

 agot_laughing_storm_rebellion.0454.a:0 "Çocuk kim ve neye tırmanıyor?"

 agot_laughing_storm_rebellion.0454.a.tt:0 "...ve nasıl inecek?"

 agot_laughing_storm_rebellion.0455.t:0 "Ağaç Yeniden Çağırıyor"

 agot_laughing_storm_rebellion.0455.desc:0 "Bir kez daha uyku beni aynı rüyaya, aynı görüye geri çekiyor. Büyük ağaç hâlâ tepede duruyor; soluk kabuğuyla coğrafyaya hükmediyor, dalları bükülmüş parmaklar gibi gökyüzüne uzanıyor. Altındaki mağara, hatırladığımdan daha karanlık, ağzı kocaman açık; sanki bir şeyi, ya da birini bekliyor. Ayaklarımın altındaki kırağı geri dönüyor, yukarı süzülüyor, ama bu sefer soğuk adımlarımı durdurmuyor.\n\nİleri yürüyorum; her adım daha yavaş, daha ağır, ama ağacın çağrısı artık daha net, daha acil. Tepenin dibine yaklaşırken rüzgârlar uluyor ve zemin altımda titriyor. Ağacın dalları canlıymış gibi sallanıyor, beni daha da yakına çağırıyor.\n\nAniden uyanıyorum; rüyanın ürpertisi havada, ağacın çekimi her zamankinden güçlü."

 agot_laughing_storm_rebellion.0455.a:0 "Ağacın altında ne var?"

 agot_laughing_storm_rebellion.0455.a.tt:0 "...ve neden bana sesleniyor?"

 agot_laughing_storm_rebellion.0456.t:0 "Kardaki Kurt"

 agot_laughing_storm_rebellion.0456.desc:0 "Bir kez daha rüyaya çekiliyorum; donmuş coğrafya önümde uzanıyor. Rüzgâr tenimi ısırıyor, ama beni tedirgin eden soğuk değil; uzaktan beni izleyen gözler. Kara kurt yine orada, her zamankinden büyük; kürkü kara karşı gölgelerle karışıyor. Kızıl gözleri karanlıkta parıldıyor, izliyor, bekliyor.\n\nBu sefer yaklaştığımda geri çekilmiyor. Bunun yerine yerinde duruyor, kırpmadan, bakışı bana kilitlenmiş. Öne adım atıyorum ve kurt donmuş havada gümbürdeyen alçak bir hırıltı çıkarıyor. İletişim kurmaya, beni uyarmaya, ya da belki sınamaya çalışıyor gibi. Daha da yaklaşıyorum, ama kurt dişlerini gösteriyor, kızıl gözleri daha parlak parlıyor. Yerimde donup kalıyorum; ilerlemekle geri çekilmek arasında parçalanmış.\n\nAn uzuyor ve sonra uyanıyorum; kurdun bakışı hâlâ zihnimde yanıyor."

 agot_laughing_storm_rebellion.0456.a:0 "Bu kurt benden ne istiyor?"

 agot_laughing_storm_rebellion.0456.a.tt:0 "...ve neyi bekliyor?"

 agot_laughing_storm_rebellion.0457.t:0 "Sessiz Nöbet"

 agot_laughing_storm_rebellion.0457.desc:0 "Uyku beni bir kez daha gecelerimi takip eden tuhaf görüye geri çekiyor. Aynı ıssız tarla önümde uzanıyor; çorak ve cansız. Bu sefer karga neredeyse anında beliriyor; sessiz kanatlarla karanlık gökyüzünden süzülüyor. Üç gözü loş ışıkta parlıyor, bakışları her zamankinden daha yoğun, daha delici. Özellikle üçüncü göz, ruhumun tam içine bakıyor gibi; yalnızca ne olduğumu değil, ne olabileceğimi de görür gibi.\n\nKarga yakındaki bükülmüş bir dala konuyor, sessizce beni izliyor. Varlığını, gücünü hissediyorum; anlayışımın ötesinde bir kuvvet. Bir kez gaklıyor, her zamankinden daha yüksek ve bir an için tüm dünya sesinde titriyor. Karga hâlâ beni izliyor; sanki henüz kavrayamadığım bir şeyi anlamamı bekliyor.\n\nKaranlıkta uyanıyorum; karganın kırpmayan gözleri zihnimde, sanki uyanık dünyaya kadar beni izlemiş gibi."

 agot_laughing_storm_rebellion.0457.a:0 "Karga hangi bilgiyi tutuyor?"

 agot_laughing_storm_rebellion.0457.a.tt:0 "...ve neden beni arıyor?"

 agot_laughing_storm_rebellion.0458.t:0 "Gökyüzündeki Ateş"

 agot_laughing_storm_rebellion.0458.desc:0 "Bir kez daha rüyaya çekiliyorum. Çocuk orada, kadim kalenin imkânsız yükseklikteki duvarlarına aynı zahmetsiz zarafetle tırmanıyor. Bu sefer yaklaşıyorum, kulenin dibine doğru ilerliyorum; taşlar ayaklarımın altında soğuk. Yaklaşırken üzerimdeki gökyüzü kararıyor ve kızıl bir kuyruklu yıldız, yanan bir kılıç gibi gökyüzünü yarıyor. Ateşli kuyruğu çocuğun tırmanışını aydınlatıyor, uzun ve tuhaf gölgeler düşürüyor. Kuyruklu yıldızın ihtişamıyla donup kalıyorum; havada uyanan daha büyük bir şeyin ağırlığını hissediyorum.\n\nÇocuğa geri baktığımda o gitmiş. Yerinde, bir zamanlar durduğu duvara tünemiş tek bir kara karga duruyor. Bir an bana bakıyor, sonra kanatlarını açıp gökyüzüne uçuyor ve uzakta kayboluyor.\n\nKızıl kuyruklu yıldızın ve kaybolan çocuğun görüntüsü zihnime kazınmış olarak uyanıyorum."

 agot_laughing_storm_rebellion.0458.a:0 "Kuyruklu yıldız hangi felaketi getiriyor?"

 agot_laughing_storm_rebellion.0458.a.tt:0 "...ve çocuğa ne oldu?"

 agot_laughing_storm_rebellion.0459.t:0 "Gecenin Gölgeleri"

 agot_laughing_storm_rebellion.0459.desc:0 "Uyku beni yakalıyor ve karanlığa gömülüyorum; yıldızsız bir gece, beni kemiğime kadar donduran bir soğuk. Çevremdeki dünya donmuş, bir kar ve buz örtüsüyle kaplı. Rüzgâr bin ses gibi uluyor; korku ve felaket fısıltıları taşıyor. Uzakta, amansız soğuğa karşı yaşamak için mücadele eden bir ateşin zayıf titreyişini görüyorum. Ona doğru yürümeyi deniyorum, ama her adımda karanlık yoğunlaşıyor, ışığı yutuyor.\n\nKarda gölgeler kayıp kıvrılıyor ve içlerinde bir şeyin hareket ettiğini fark ediyorum; kadim bir şey, kötü bir şey. Başımı kaldırıyorum ve üzerimdeki gökyüzü boş; ne ay ne yıldız, yalnızca sonsuz bir hiçlik.\n\nSoğuk beni daha sıkı kavrıyor ve ateş sönüyor. Karanlık bastırırken uyanıyorum; ürperti hâlâ tenime yapışık."

 agot_laughing_storm_rebellion.0459.a:0 "Gecenin gölgelerinde ne kıpırdıyor?"

 agot_laughing_storm_rebellion.0459.a.tt:0 "...ve neden bu kadar soğuk?"

 agot_laughing_storm_rebellion.0460.t:0 "Yeniden Yürümek"

 agot_laughing_storm_rebellion.0460.desc:0 "Uyku beni sürüklerken, rahatsız edici derecede tanıdık gelen bir dünyaya fırlatılıyorum. Hava soğuk, çürüme kokusuyla yoğun. Issız bir tarlada duruyorum; altımdaki zemin çatlamış ve çorak. Uzakta, yavaşça, doğal olmayan bir şekilde hareket eden figürler görüyorum. Önce gölge gibi görünüyorlar, ama yaklaştıkça onları net görüyorum.\n\nBunlar insan değil, cesetler. Yüzler ölümde donmuş, gözler boş, deri gri ve çürüyen; ama damarlarında hâlâ yaşam akıyormuş gibi hareket ediyorlar. Ölüler yükselmiş, tuhaf bir sessizlikle bana doğru yürüyorlar. Gözleri bir anda hiçbir şeyi ve her şeyi görüyor gibi. Konuşmayı, seslenmeyi deniyorum, ama sesim çıkmıyor. Aniden ölülerden biri başını çeviriyor, cansız bakışını bana dikiyor.\n\nSoğuk bir ter içinde uyanıyorum; yürüyen o cesetlerin görüntüsü zihnimde oyalanıyor."

 agot_laughing_storm_rebellion.0460.a:0 "Ölüler neden yükseliyor?"

 agot_laughing_storm_rebellion.0460.a.tt:0 "...ve ne arıyorlar?"

 agot_laughing_storm_rebellion.0461.t:0 "Ejderhanın Rüyası"

 agot_laughing_storm_rebellion.0461.desc:0 "Üstat Aemon'un odasına sessizce adım atıyorum; ona küçük bir şey sormak niyetiyle. Ama konuşamadan, uykusunda kıpırdandığını görüyorum; kaşları çatık. Gözleri aniden açılıyor ve bir an için şaşkın görünüyor; rüya ile uyanık dünya arasında sıkışmış. Doğrulup gözlerini kırpıştırıyor; sanki bir görünün kalıntıları hâlâ ona yapışık.\n\n#italic "Ejderhanın üç başı var,"#! diye mırıldanıyor, neredeyse kendi kendine; sesi alçak ve kararsız. #italic "Hep vardı... hep olacak. Üç baş, tek gövde. Onlar olmadan ejderha... ejderha kırılmıştır."#! Gözlerini ovuşturup bana bakıyor; sanki orada olduğumu ilk kez fark ediyormuş gibi. #italic "Görüyor musun? Tek baş yetmez. Diğerleri yükselmeli."#!\n\nUykunun sisini dağıtmaya çalışır gibi başını sallıyor; sözleri hâlâ anlamla ağırlaşmış. Onu izliyorum; bilgiden mi konuşuyor, yoksa bir rüyanın kalıntılarından mı emin değilim; sözlerinin ağırlığı havada asılı kalıyor."

 agot_laughing_storm_rebellion.0461.a:0 "O rüyada ne gördü?"

 agot_laughing_storm_rebellion.0462.t:0 "Uzaktaki Ejderha"

 agot_laughing_storm_rebellion.0462.desc:0 "Gecenin geç saatlerinde kendimi Üstat Aemon'un odasına adım atarken buluyorum. Uyanık, ama bakışları uzak; sanki odanın çok ötesine, benim göremediğim bir şeye bakıyor. Gözleri benimkiyle buluşuyor, ama içlerinde kafa karışıklığı seziyorum; sanki hâlâ bir rüya ile uyanık dünya arasında hapsolmuş.\n\n#italic "Uzak bir diyarda bir Targaryen var..."#! diyor alçak sesle, sesi belirsizlikle kalın. #italic "Nerede olduğunu bilmiyorum, ama gördüm... buradan uzakta, kaybolmuş ve başıboş dolaşan, bizim kanımızdan birini."#! Elleri hafifçe titriyor; alnına bastırıp görüyü anlamlandırmaya çalışıyor. #italic "Anlamıyorum... ama önemli olduklarını biliyorum. Bir şekilde bize bağlılar."#!\n\nSesi kesiliyor, hiçliğe bakıyor; sanki görünün izlerini hâlâ görüyormuş gibi. Sözleri havada asılı kalıyor; beni bu uzak, bilinmeyen Targaryen hakkında düşündürüyor."

 agot_laughing_storm_rebellion.0462.a:0 "Benim hakkımda mı konuşuyor?"

 agot_laughing_storm_rebellion.0463.t:0 "Çocuk"

 agot_laughing_storm_rebellion.0463.desc:0 "Küçük keşif görevinden döndüm, ama yolculuktan bir şey düşüncelerime yapıştı; solmayan bir gölge gibi. Orada, vahşi doğada, kar ve ıssızlık arasında, bir şey gördüğümü sandım; ya da birini.\n\nKüçük ve hızlı bir çocuk, ağaçların arasında süzülüyor. Bir an için derileri tuhaf göründü... yeşil, ormanın kendisi gibi. Yalnızca bir anlık bir görüntüydü; tekrar baktığımda gitmişlerdi. Gruptaki başka kimse bir şey görmedi. Sordum, ama bana verdikleri bakışlar kendi gözlerimden şüphe etmeme neden oldu.\n\nSadece bir ışık oyunu muydu, yoksa daha fazlası mı? O yeşil derili çocuğun görüntüsü beni hâlâ takip ediyor. Gördüğüm şeyin gerçek olduğu hissini silkeleyemiyorum, ama ne olduğundan ya da ne anlama geldiğinden emin değilim."

 agot_laughing_storm_rebellion.0463.a:0 "Sadece bir akıl oyunu muydu?"

 agot_laughing_storm_rebellion.0464.t:0 "Ormanın Çocukları"

 agot_laughing_storm_rebellion.0464.desc:0 "Keşif görevinde, gruptan kısa bir mesafe uzaklaşmış, vahşi doğanın sessizliğini keşfetmeye meraklı buldum kendimi. İşte o zaman onları gördüm: ağaçların hemen ötesinde duran üç çocuk. Derilerinin tuhaf bir tonu vardı, neredeyse yeşil; ormanın içine, onun bir parçasıymış gibi karışıyordu. Konuşmadılar, ama gözleri beni yakına çağırıyor, sessizce kendi dünyalarına davet ediyor gibiydi. Onlara doğru bir adım attım; tuhaf bir çekim hissederek, ama sonra diğerlerini hatırladım.\n\nOnları toplamak için aceleyle geri döndüm; gördüklerimi göstermeye hevesli. Ama grubumla döndüğümde çocuklar gitmişti; sanki hiç orada olmamışlar gibi yok olmuşlardı. Diğerleri bana kuşkuyla baktı ve her şeyi hayal ettiğimi sorgulamaya başladım. Ama varlıklarının hissi hâlâ sürüyor; sanki gölgelerden izliyorlar."

 agot_laughing_storm_rebellion.0464.a:0 "Orman bana oyun mu oynuyor?"

 agot_laughing_storm_rebellion.0465.t:0 "Kardeşler"

 agot_laughing_storm_rebellion.0465.desc:0 "Kuzey'in buz gibi rüzgârı Karakale'nin üzerinde süpürüyor; artık taşıdığım çetin görevin sürekli bir hatırlatıcısı. Duvar'ın karşısına bakarken düşüncelerim istemeden çok eskilere, zihnime ruh üzerindeki yara izleri gibi kazınmış yüzlere kayıyor. İki kardeş, anılarımda en net biçimde beliriyor: biri, hırs onu benden koparmadan önce bir zamanlar sevdiğim asil ve gururlu; diğeri, intikam ve acının gölgelenmiş bir figürü, düşmanlığı ayaklarımın altındaki buz kadar soğuk.\n\nBu düşünceler beni kemiriyor, yıllar geçmesine rağmen yeniden yüzeye çıkıyor. Kan ve ihanet bağları, beni şimdi olduğum adama şekillendirdi; dünyanın sınırında nöbet tutan bir adama. Ne teselli ne de geçmişin yankılarından kaçış sunan bir görev. Belki de sonsuz kar ve kadim ağaçlar arasında huzuru bulmam gerekiyor — ya da o hayaletleri sonuna dek taşımam."

 agot_laughing_storm_rebellion.0465.a:0 "Geçmiş asla gerçekten arkamızda değil."

 agot_laughing_storm_rebellion.0466.t:0 "Alevlerden Yükseliş"

 agot_laughing_storm_rebellion.0466.desc:0 "Uyku beni yine bir görüye çekiyor; güneş kadar parlak yanan bir görü. Önümde bir figür duruyor, alevlerle sarılı; ateş onları tüketirken formu kavurucu sıcaklıkla bozulmuş. Sıcaklık dayanılmaz, alevler yükseliyor, figürü bütünüyle yutuyor.\n\nOnlara ulaşmayı deniyorum, ama ateş beni geri püskürtüyor. Alevlerin içinde kayboldukları anda başımı kaldırıyorum ve gece göğünün kendisinin alevler içinde olduğunu görüyorum; sanki yıldızlar yanıyor, gökler ateşle tutuşuyor. Altımdaki zemin titriyor ve alevlerin yüreğinden bir gölge kımıldıyor. Bir ejderha, büyük ve korkunç, ateşten adım atıyor; pulları erimiş çelik gibi parlıyor. Gözleri benimkilere kilitleniyor ve varlığını hissedebiliyorum; kadim ve güçlü.\n\nSoğuk bir ter içinde uyanıyorum; ejderhanın ve figürün görüntüsü zihnime kazınmış, kaderleri yukarıdaki ateşli gökyüzüyle iç içe."

 agot_laughing_storm_rebellion.0466.a:0 "Ejderha uyandı... ama hangi bedelle?"

 agot_laughing_storm_rebellion.0467.t:0 "Alevler İçindeki Taht"

 agot_laughing_storm_rebellion.0467.desc:0 "Uyku beni sararken, ateş ve yıkım görüsüne çekiliyorum. Önümde büyük bir şehir uzanıyor, ama bir şeyler feci biçimde ters. Onu tüketen alevler sıradan ateş değil; etrafındaki havayı büken tuhaf, doğal olmayan bir yeşil; ürkütücü ve kötü niyetli bir ışıkla parlayan. Yabani ateş.\n\nYeşil alevler binaların kenarlarını yiyip taş ve ahşabı grotesk biçimlere eritirken çıtırdayıp tıslıyorlar. Ateş canlı gibi, aç gibi; yalnızca şehrin yapılarını değil, altındaki zemini de tüketiyor.\n\nYanan taş ve kül kokusu havayı dolduruyor ve şehrin kalbinin enkaza dönüşünü çaresizce izliyorum. Aniden uyanıyorum; yanan şehrin görüntüsü düşüncelerime kazınmış, yeşil yabani ateş hâlâ zihnimde yanıyor."

 agot_laughing_storm_rebellion.0467.a:0 "Bu, Aerion'un bükülmüş bir anısı mı?"

 agot_laughing_storm_rebellion.0467.a.tt:0 "...yoksa daha kötü bir şey mi?"

 agot_laughing_storm_rebellion.0468.t:0 "Ejderhanın Fısıltıları"

 agot_laughing_storm_rebellion.0468.desc:0 "Duvar'ın tepesinde dururken, donmuş ıssızlık önümde sonsuza uzanırken, rüzgâr buz gibi havada çok eski bir ses gibi fısıldıyor. Soğuk tenimi ısırıyor, ama geçmişin ağırlığı beni daha çok üşütüyor. Düşüncelerim eski masallara kayıyor; geleceği gören, gelecek olan şeylerin hayaletleriyle lanetlenmiş rüyalar gören Targaryenlere.\n\nFetih'ten çok önce, ejderhaların şimdinin ötesini gördüğü söylenirdi; rüyaları hem bir lütuf hem bir lanetti. Titrek alevlerde görülen ateş, kan ve felaket kehanetleri bir bedel getiriyordu — hayal kuranları deliliğe ya da umutsuzluğa sürüklüyordu.\n\nUzaklara bakarken karla kaplı dünya değişiyor gibi. O rüyaların ağırlığı üzerime çöküyor. Bu mirası paylaşıyor muyum? Geleceğin gölgeleri, korkunç bir bedelle gelecek olanı göstererek bana mı sesleniyor? Duvar cevap vermiyor; yalnızca soğuk ve sessizlik sunuyor."

 agot_laughing_storm_rebellion.0468.a:0 "Bu rüyalar bir armağan mı?"

 agot_laughing_storm_rebellion.0468.a.tt:0 "...yoksa açığa çıkmayı bekleyen bir lanet mi?"

 agot_laughing_storm_rebellion.0469.t:0 "Soğuk Karanlık Gece"

 agot_laughing_storm_rebellion.0469.desc:0 "Dışarıda soğuk rüzgâr uluyor, Kuzey'in bitmeyen ürpertisini taşıyor. Odamın içinde, yalnız bir mumun titreyen alevi taş duvarlara gölgeler düşürüyor. Gece Nöbeti'nin kara pelerinine sarılmış, sessizce oturuyorum. Eski ihanet anılarının zihnime süzüldüğü gecelerden biri bu.\n\nGözüm uzak köşeye kayıyor; orada bir kuzgun sessizce tünemiş, izliyor. Kendi kendime mırıldanıyorum, çok eski bir konuşmayı anımsayarak: #italic "Hain korkak çıkarsa ihanet daha az alçak olmaz."#! Butterwell bu dersi öğrenmişti ve şimdi bu kardeşler de benim gölgemde dikkatle yürüyor.\n\nGece derinleşiyor, soğuk Karakale'nin duvarlarına baskı yapıyor. Orada, karanlıkta bir yerlerde sırlar kıpırdanıyor, ama şimdilik her şey durgun. Uyanık kalıyorum, nöbetim bitmek bilmiyor."

 agot_laughing_storm_rebellion.0469.a:0 "Gece uzun, ama ben dayanacağım."

 agot_laughing_storm_rebellion.0469.a.tt:0 "Ateş yumuşakça çıtırdıyor, Kuzey'in amansız ürpertisine karşı pek az sıcaklık sunuyor"

 agot_laughing_storm_rebellion.0469.b:0 "İhanet iz bırakır, ama uyanıklığım kalkanımdır."

 agot_laughing_storm_rebellion.0469.b.tt:0 "Kuzgunun gözü mum ışığında parıldıyor; hiçbir sırrın bakışımdan güvende olmadığının bir hatırlatıcısı"

 agot_laughing_storm_rebellion.0469.c:0 "Soğuk ısırabilir, ama nöbetim sürüyor."

 agot_laughing_storm_rebellion.0469.c.tt:0 "Dışarıda rüzgâr gece boyunca çığlık atıyor. İçeride, sessizce oturuyorum, her zaman uyanık"
