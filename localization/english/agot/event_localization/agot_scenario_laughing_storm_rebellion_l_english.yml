### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0001.desc [AGOT: The betrayal cuts deeper than any blade. [duncansmall.GetTitledFirstNameNicknamed], once betrothed to my beloved daughter [cassandra.GetFirstName], has forsaken his vows and taken up with that mysterious girl, [jenny.GetNameNicknamed]. This affront to House [lyonel.GetHouse.GetBaseName] cannot stand.\n\nThe honor of my family lies in ruin, trampled beneath the whims of the Iron Throne. House [lyonel.GetHouse.GetBaseNameNoTooltip] will brook no insult. Independence is my recourse, and should it come to war, so be it.\n\nThe Stormlands shall stand alone, and I shall reclaim my family's honor with all the strength we can muster.]
 agot_laughing_storm_rebellion.0001.desc:0 "The betrayal cuts deeper than any blade. [duncansmall.GetTitledFirstNameNicknamed], once betrothed to my beloved daughter [cassandra.GetFirstName], has forsaken his vows and taken up with that mysterious girl, [jenny.GetNameNicknamed]. This affront to House [lyonel.GetHouse.GetBaseName] cannot stand.\n\nThe honor of my family lies in ruin, trampled beneath the whims of the Iron Throne. House [lyonel.GetHouse.GetBaseNameNoTooltip] will brook no insult. Independence is my recourse, and should it come to war, so be it.\n\nThe Stormlands shall stand alone, and I shall reclaim my family's honor with all the strength we can muster."
