### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0004.desc [AGOT: The journey to King's Landing has been long and fraught with anticipation. Now, I stand before the Red Keep, facing [duncantall.GetFirstName] 'the Tall,' the Lord Commander of the Kingsguard. Memories of past battles fought together flash through my mind, but today, camaraderie is cast aside.\n\nThis is a fight for honor, for the name of House [lyonel.GetHouse.GetBaseName]. The eyes of the realm are upon us, and only one shall emerge victorious.\n\nLet the clash of steel ring louder than my laughter, and may the better fighter win this fateful duel.]
