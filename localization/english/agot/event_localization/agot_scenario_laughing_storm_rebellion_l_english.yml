### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0002.desc [AGOT: The weight of the crown has never felt heavier. My son, [duncansmall.GetTitledFirstNameNicknamed], has shattered a betrothal, forsaking [cassandra.GetFullName] for [jenny.GetFirstNameNicknamed].\n\nThe fury of [lyonel.GetFullNameNicknamed] now threatens the realm. He has demanded independence from the Iron Throne, ready to plunge the kingdom into war to reclaim his family's honor. As the king, I must act swiftly to avert disaster.\n\nA proposal of trial by combat between [lyonel.GetTitledFirstNameNoTooltip] and [duncantall.GetTitledFirstName] 'the Tall' may offer a path to peace. It is a gamble, but one that might save the realm from needless bloodshed.]
 agot_laughing_storm_rebellion.0002.desc:0 "The weight of the crown has never felt heavier. My son, [duncansmall.GetTitledFirstNameNicknamed], has shattered a betrothal, forsaking [cassandra.GetFullName] for [jenny.GetFirstNameNicknamed].\n\nThe fury of [lyonel.GetFullNameNicknamed] now threatens the realm. He has demanded independence from the Iron Throne, ready to plunge the kingdom into war to reclaim his family's honor. As the king, I must act swiftly to avert disaster.\n\nA proposal of trial by combat between [lyonel.GetTitledFirstNameNoTooltip] and [duncantall.GetTitledFirstName] 'the Tall' may offer a path to peace. It is a gamble, but one that might save the realm from needless bloodshed."
