### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0452.desc [AGOT: As sleep drags me under, I find myself adrift in another dream. The world is a barren, snow-covered wasteland, with a wind that cuts through my cloak like a knife. In the distance, I see it: a wolf, larger than any I have ever seen, its fur dark as the night sky, blending into the shadows of the landscape. Its eyes, red, like blood against the pale snow, glow with a fierce, unsettling light. The wolf watches me with those burning eyes, its gaze piercing through the cold, as if it knows something I do not.\n\nI try to step closer, but with each stride, the wolf retreats into the mist, always just beyond my reach. The red eyes are the last thing I see before it vanishes into the snow.\n\nI wake with a start, my heart pounding, the image of the dark wolf burned into my mind.]
