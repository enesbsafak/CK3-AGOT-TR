### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0003.desc [AGOT: A raven arrives bearing the king's proposal, an offer to settle this conflict with a single duel, a trial by combat against [duncantall.GetTitledFirstName] 'the Tall.' I remember fighting alongside him in battles past — comrades once, now potential foes. This duel is more than a clash of steel; it is a battle for honor, the very soul of House [lyonel.GetHouse.GetBaseName].\n\nTo refuse would mean independence, but at what cost? The time has come to decide our fate.]
 agot_laughing_storm_rebellion.0003.desc:0 "A raven arrives bearing the king's proposal, an offer to settle this conflict with a single duel, a trial by combat against [duncantall.GetTitledFirstName] 'the Tall.' I remember fighting alongside him in battles past — comrades once, now potential foes. This duel is more than a clash of steel; it is a battle for honor, the very soul of House [lyonel.GetHouse.GetBaseName].\n\nTo refuse would mean independence, but at what cost? The time has come to decide our fate."
