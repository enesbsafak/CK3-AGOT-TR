### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0451.desc [AGOT: As sleep takes me, I find myself slipping into a dream, one I have walked through many times, yet it feels no less unsettling. The world around me fades, and I am no longer Lord Commander of the Night's Watch, but a lone figure in a strange, cold landscape. Before me, on a hill, stands a tree, vast and ancient, its pale bark shining like bone in the moonlight. Beneath it, a cave yawns like a waiting mouth.\n\nI feel the pull of it, calling me closer. I step forward, but the ground beneath my feet begins to freeze, creeping up with icy fingers, threatening to hold me in place. I struggle forward, but the frost grows stronger.\n\nJust before I can reach the tree, the cold overtakes me, and I wake in a start, the vision still vivid in my mind.]
 agot_laughing_storm_rebellion.0451.desc:0 "As sleep takes me, I find myself slipping into a dream, one I have walked through many times, yet it feels no less unsettling. The world around me fades, and I am no longer Lord Commander of the Night's Watch, but a lone figure in a strange, cold landscape. Before me, on a hill, stands a tree, vast and ancient, its pale bark shining like bone in the moonlight. Beneath it, a cave yawns like a waiting mouth.\n\nI feel the pull of it, calling me closer. I step forward, but the ground beneath my feet begins to freeze, creeping up with icy fingers, threatening to hold me in place. I struggle forward, but the frost grows stronger.\n\nJust before I can reach the tree, the cold overtakes me, and I wake in a start, the vision still vivid in my mind."
