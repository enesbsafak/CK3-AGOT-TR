l_english:

 agot_laughing_storm_rebellion.0001.t:0 "Fırtına Öfkeleniyor"

 agot_laughing_storm_rebellion.0001.desc:0 "İhanet her kılıçtan daha derin keser. Bir zamanlar sevgili kızım [cassandra.GetFirstName] ile nişanlı olan [duncansmall.GetTitledFirstNameNicknamed], yeminlerinden vazgeçip o gizemli kızla, [jenny.GetNameNicknamed] ile birlikte oldu. Evi [lyonel.GetHouse.GetBaseName]'e yapılan bu hakaret kabul edilemez.\n\nAilemin onuru, Demir Taht'ın keyfi istekleri altında çiğnenmiş halde yıkıntı içinde. Evi [lyonel.GetHouse.GetBaseNameNoTooltip] hakarete tahammül etmeyecek. Bağımsızlık tek çarem; ve iş savaşa varacaksa, varacak.\n\nFırtına Toprakları tek başına ayakta duracak ve ailemin onurunu toplayabildiğimiz tüm güçle yeniden kazanacağım."

 agot_laughing_storm_rebellion.0001.a:0 "Öfke Bizim!"

 agot_laughing_storm_rebellion.0002.t:0 "Ufukta Bir Fırtına"

 agot_laughing_storm_rebellion.0002.desc:0 "Taç hiç bu kadar ağır gelmemişti. Oğlum [duncansmall.GetTitledFirstNameNicknamed], [cassandra.GetFullName]'i [jenny.GetFirstNameNicknamed] için terk ederek bir nişanı bozdu.\n\n[lyonel.GetFullNameNicknamed]'in öfkesi artık diyarı tehdit ediyor. Demir Taht'tan bağımsızlık talep etti; ailesinin onurunu kazanmak için krallığı savaşa sürüklemeye hazır. Kral olarak felaketi önlemek için hızla hareket etmeliyim.\n\n[lyonel.GetTitledFirstNameNoTooltip] ile [duncantall.GetTitledFirstName] 'uzun boylu' arasında bir muharebe yargılaması teklifi, barışa bir yol açabilir. Bu bir kumar, ama diyarı gereksiz kan dökülmesinden kurtarabilecek bir kumar."

 agot_laughing_storm_rebellion.0002.a:0 "Muhafız Kumandanı halletsin."

 agot_laughing_storm_rebellion.0003.t:0 "Onur Düellosu"

 agot_laughing_storm_rebellion.0003.desc:0 "Kralın teklifini getiren bir kuzgun geldi: bu çatışmayı tek bir düello ile, [duncantall.GetTitledFirstName] 'Uzun Boylu'ya karşı bir muharebe yargılaması ile çözme önerisi. Geçmiş savaşlarda onunla omuz omuza dövüştüğümü hatırlıyorum — bir zamanlar yoldaştık, şimdi potansiyel düşmanız. Bu düello çelikten bir çarpışmadan fazlası; Evi [lyonel.GetHouse.GetBaseName]'in ta kendisi olan onur için bir savaş.\n\nReddetmek bağımsızlık demek olur, ama bedeli ne? Kaderimizi belirleme zamanı geldi."

 agot_laughing_storm_rebellion.0003.a:0 "Tanrılar karar versin; bunu #bold muharebe yargılamasıyla#! çözeceğiz."

 agot_laughing_storm_rebellion.0003.b:0 "Sahte bir kralın taleplerine boyun eğmeyeceğim."

 agot_laughing_storm_rebellion.0004.t:0 "Fırtınanın ve Çeliğin Çarpışması"

 agot_laughing_storm_rebellion.0004.desc:0 "Kralın Şehri yolculuğu uzun ve beklentiyle doluydu. Şimdi Kızıl Kale'nin önünde duruyor, Kral Muhafızı'nın Muhafız Kumandanı [duncantall.GetFirstName] 'Uzun Boylu' ile yüz yüzeyim. Birlikte dövüştüğümüz geçmiş savaşların anıları gözlerimin önünden geçiyor, ama bugün yoldaşlık bir kenara atıldı.\n\nBu, Evi [lyonel.GetHouse.GetBaseName] adına, onur için bir savaş. Diyarın gözleri üzerimizde ve yalnızca biri galip gelecek.\n\nÇeliğin çarpışması kahkahamdan daha yüksek çınlasın ve bu kader düellosunda daha iyi dövüşen kazansın."

 agot_laughing_storm_rebellion.0004.a:0 "#bold Ha ha ha!#!"

 agot_laughing_storm_rebellion.t:0 "Muharebe Yargılaması"

 agot_laughing_storm_rebellion.duncan_won:0 "[duncantall.GetTitledFirstNameNoTooltip], [lyonel.GetTitledFirstNameNoTooltip]'e karşı düelloyu kazandı."

 agot_laughing_storm_rebellion.lyonel_won:0 "[lyonel.GetTitledFirstNameNoTooltip], [duncantall.GetTitledFirstNameNoTooltip]'e karşı düelloyu kazandı."

 agot_laughing_storm_rebellion.0007.t:0 "Fırtınanın Çöküşü"

 agot_laughing_storm_rebellion.0007.desc:0 "Düello bitti ve kılıçların çınlaması anıya karıştı. Hünerime rağmen [duncantall.GetTitledFirstName] galip geldi. Yenilgi, yutulması acı bir hap; kaybın ağırlığı omuzlarıma çöküyor.\n\nEvi [lyonel.GetHouse.GetBaseName]'in onuru, hırpalanmış ve yaralı halde, artık [aegonv.GetTitledFirstNameRegnal]'in ellerinde. Demir Taht'ın önünde diz çöküp kralın hükmünü beklerken, Fırtına Toprakları'nın geleceği terazide. Kral benim ve hanem için ne kader buyuracak?"

 agot_laughing_storm_rebellion.0007.a:0 "Kaderimi onurla kabul edeceğim."

 agot_laughing_storm_rebellion.0008.t:0 "Kralın Merhameti"

 agot_laughing_storm_rebellion.0008.desc:0 "[lyonel.GetFullNameNicknamed] önümde duruyor, yenilmiş ama kırılmamış. [duncantall.GetTitledFirstName]'e kaybetmesine rağmen diyardaki gerginlik sürüyor. Kral olarak barış ve istikrar ihtiyacını görüyorum. Ağır bir ceza isyanın alevlerini körükleyebilir, ama merhamet uçurumu onarabilir.\n\nKırılgan uyumu korumak için Baratheonları tahta daha yakın bağlayacak bir evlilik ittifakı sunmayı düşünüyorum.\n\nKızımın elini oğluna mı sunayım, yoksa başka bir jest yapmadan yalnızca yenilenmiş sadakatini mi talep edeyim?"

 agot_laughing_storm_rebellion.0008.a:0 "Rhaelle'nin elini oğluna sunuyorum."

 agot_laughing_storm_rebellion.0008.b:0 "Vaella'nın elini oğluna sunuyorum."

 agot_laughing_storm_rebellion.0008.c:0 "Hiçbir şey sunmuyorum."

 agot_laughing_storm_rebellion.0009.t:0 "Fırtına Ucu"

 agot_laughing_storm_rebellion.0009.desc:0 "[lyonel.GetFullNameNicknamed], [duncantall.GetTitledFirstName]'e karşı muharebe yargılamasında sonunu buldu. Bir zamanlar göz korkutucu bir tehdit olan meydan okuyuşu ve yiğitliği artık susturuldu. Diyarı parçalamakla tehdit eden isyan, liderinin düşmesiyle kısa kesildi.\n\nBarışın bedeli ağır oldu ve bu çatışmanın yankıları tarih sayfalarında kalacak. Fırtına Toprakları boyun eğdirilmişken diyar iyileşmeye başlayabilir, ama bu olayın gölgesi yıllarca Demir Taht'ın üzerinde asılı kalacak."

 agot_laughing_storm_rebellion.0009.a:0 "Savaştı, kaybetti ve şimdi dinleniyor."

 agot_laughing_storm_rebellion.0010.t:0 "Fırtınanın Ardından"

 agot_laughing_storm_rebellion.0010.betrothal.desc:0 "Muharebe yargılamasındaki yenilgimin ardından [aegonv.GetTitledFirstNameRegnal] bir zeytin dalı uzatıyor: kızı [targ_betrothed.GetTitledFirstNamePossessive] elini oğlum [bara_betrothed.GetTitledFirstName] ile evlendirmeyi teklif ediyor. Evi [lyonel.GetHouse.GetBaseName] ile Demir Taht arasındaki uçurumu onarmayı amaçlayan bu jest, potansiyel barış ve birliğin ağırlığını taşıyor.\n\nHanemin onuru, Fırtına Toprakları'nın geleceğini güvenceye alabilecek bir bağ kurarak bu birliktelikle onarılabilir."

 agot_laughing_storm_rebellion.0010.nobetrothal.desc:0 "Muharebe yargılamasındaki yenilgimin ardından, Demir Taht'tan gelen sessizlik sağır edici. [aegonv.GetTitledFirstNameRegnal] ne bir evlilik eli sunuyor, ne de bir barış jesti; yalnızca kaybımın soğuk gerçeği.\n\nEvi [lyonel.GetHouse.GetBaseName]'in onuru lekelendi ve Fırtına Toprakları'nın geleceği belirsiz. Tek başıma duruyor, hanem için sonraki adımları düşünüyorum; önümdeki yolun zorluklarla dolu olduğunu ve bu yenilginin gölgesinin büyük olduğunu bilerek."

 agot_laughing_storm_rebellion.0010.a:0 "Kralın teklifini kabul ediyorum."

 agot_laughing_storm_rebellion.0010.b:0 "Bu teklifi reddetmek zorundayım."

 agot_laughing_storm_rebellion.0010.c:0 "Kaderimi kabul ediyorum."

 agot_laughing_storm_rebellion.0011.t:0 "Yüreğin İkilemi"

 agot_laughing_storm_rebellion.0011.desc:0 "Ağabeyim [duncansmall.GetFirstName]'in davranışları içimde derin düşünceler uyandırdı. [cassandra.GetTitledFirstName]'i [jenny.GetFirstNameNicknamed] için bırakıp gerçek aşkın çağrısını izleme seçimi, kendi yolumu sorgulamama neden oldu. [celia.GetTitledFirstName] ile bir evliliğe bağlanmışken, yüreğim gerçek aşkım [shaera.GetFirstName]'ya hasret.\n\nGörevin ağırlığı ile aşkın çekimi içimde şiddetli bir savaş veriyor. Kardeşimin izinden gidip yüreğimin arzusunu mu kovalayayım, yoksa ettiğim yeminlere bağlı mı kalayım?"

 agot_laughing_storm_rebellion.0011.a:0 "Evet, yüreğimi izlemeliyim."

 agot_laughing_storm_rebellion.0011.b:0 "Hayır, görev galip gelmeli."

 agot_laughing_storm_rebellion.0012.t:0 "Önündeki Yolu Sorgulamak"

 agot_laughing_storm_rebellion.0012.desc:0 "Ağabeylerimin seçimlerine tanık olan — yüreklerini izleyip aşk için evlenmek üzere boşanan — kendimi kargaşa içinde buluyorum. Neredeyse hiç tanımadığım bir kız olan [olenna.GetTitledFirstName] ile yaklaşan bir evliliğe bağlanmışken, kuşku düşüncelerimi bulandırıyor. [olenna.GetTitledFirstName] hoş görünebilir, ama aklım ve yüreğim başka yerde.\n\nGörevin beklentileri ağır geliyor, ama gerçek mutluluk arzusu çağırıyor. Kendi yolumu çizip aşkı mı arayayım, yoksa önüme konan yükümlülüklere mi bağlı kalayım?"

 agot_laughing_storm_rebellion.0012.a:0 "Evet, kendi yüreğimi izlemeliyim."

 agot_laughing_storm_rebellion.0012.b:0 "Hayır, görev bana yol göstermeli."

 agot_laughing_storm_rebellion.0013.t:0 "Bozulan Birliktelikler"

 agot_laughing_storm_rebellion.0013.desc:0 "Acı bir olaylar dizisi yaşandı. [jaehaerys.GetTitledFirstName], [celia.GetTitledFirstName] ile nişanını bozdu ve [shaera.GetTitledFirstName], [luthor.GetTitledFirstName] ile nişanını kopardı. Gelenek ve göreve meydan okuyarak, şimdi birbirleriyle evli olduklarını iddia ediyorlar.\n\nBu pervasız hareket, ittifakların ve beklentilerin temellerini sarsarak nifak ve hayal kırıklığı ekti. Birlikteliklerinin sonuçları diyarlarda yankılanacak; hane reisleri bu beklenmedik ve talihsiz kararların yansımalarıyla boğuşmak zorunda kalacak."

 agot_laughing_storm_rebellion.0013.a:0 "Bu ciddi bir hata."

 agot_laughing_storm_rebellion.0013.b:0 "Cezalandırılmalılar."

 agot_laughing_storm_rebellion.0014.t:0 "Nişan Bozuldu"

 agot_laughing_storm_rebellion.0014.desc:0 "Haber ağır bir yürekle geliyor. [daeron.GetTitledFirstName], [olenna.GetTitledFirstName] ile nişanını bozdu; birleşmeleri için özenle kurulan planları bir kenara atarak. Bu öngörülmeyen olaylar dizisi oldukça talihsiz; hayal kırıklığı ve belirsizlik yaratıyor.\n\nBu bozulan sözün yansımaları, ittifakları ve beklentileri sarsarak her iki haneye de yayılacağı kesin."

 agot_laughing_storm_rebellion.0014.aegonv.a:0 "Bu büyük bir hayal kırıklığı."

 agot_laughing_storm_rebellion.0014.runceford.a:0 "Belki de Garlan'a bir nişan teklifiyle ulaşmanın zamanıdır."

 agot_laughing_storm_rebellion.0014.runceford.a.tt:0 "[olenna.GetTitledFirstName] ile [luthor.GetTitledFirstName] arasında bir nişan teklif edilecek"

 agot_laughing_storm_rebellion.0014.runcefordx.a:0 "Bu büyük bir hayal kırıklığı."

 agot_laughing_storm_rebellion.0015.t:0 "Yeni Bir Teklif"

 agot_laughing_storm_rebellion.0015.desc:0 "[daeron.GetTitledFirstName]'in [olenna.GetTitledFirstName] ile nişanını bozmasının ardından, babası [runceford.GetTitledFirstName] bana yeni bir teklifle geldi. [olenna.GetTitledFirstName] ile oğlum [luthor.GetTitledFirstName] arasında bir nişan öneriyor.\n\nBu ittifak çok değerli olabilir; Evi [garlan.GetHouse.GetBaseName]'in bağlarını güçlendirip geleceğini sağlamlaştırabilir. Dikkatle değerlendirilmesi gereken bir fırsat."

 agot_laughing_storm_rebellion.0015.a:0 "Bu birliktelik hanemize fayda sağlayacak."

 agot_laughing_storm_rebellion.0015.b:0 "Bu teklifi reddetmeliyim."

 agot_laughing_storm_rebellion.0016.t:0 "Bir Babanın Kararı"

 agot_laughing_storm_rebellion.0016.desc:0 "[garlan.GetTitledFirstName], [olenna.GetTitledFirstName] ile [luthor.GetTitledFirstName]'i nişanlama teklifini kabul etti. Bu ittifak, hanelerimiz arasında büyük değer ve güçlenen bağlar vaat ediyor. Ancak [olenna.GetFirstNamePossessiveNoTooltip] babası olarak, bu birleşmenin onun için de faydalı olmasını sağlamak benim görevim.\n\nSon karar bana ait ve ailemiz için avantajları, kızımın gelecekteki mutluluğuna karşı dikkatle tartmalıyım."

 agot_laughing_storm_rebellion.0016.a:0 "Nişanla devam edelim."

 agot_laughing_storm_rebellion.0016.b:0 "Olenna'nın hatırına reddetmeliyim."

 agot_laughing_storm_rebellion.0017.t:0 "Kurulan İttifak"

 agot_laughing_storm_rebellion.0017.desc:0 "Nihayet, [olenna.GetTitledFirstName] ile [luthor.GetTitledFirstName] arasındaki nişan kesinleşti. Bu birliktelik hanelerimiz arasındaki bağları güçlendirmeyi, karşılıklı faydalar getirmeyi ve gelecekteki ittifaklarımızı sağlamlaştırmayı vaat ediyor.\n\nBu ortaklıkla her iki aile de güç ve nüfuz kazanacak, müreffeh bir geleceğin yolunu açacak."

 agot_laughing_storm_rebellion.0017.a:0 "Bu kutlama gerektirir."

 agot_laughing_storm_rebellion.0018.t:0 "Kaçırılan Bir Fırsat"

 agot_laughing_storm_rebellion.0018.desc:0 "[olenna.GetTitledFirstName] ile [luthor.GetTitledFirstName] arasındaki nişan reddedildi. Yazık; bu birliktelik her iki hanemiz için de son derece faydalı olur, bağlarımızı güçlendirir ve geleceklerimizi güvenceye alırdı.\n\nAksiliğe rağmen ileriye bakmalı ve ittifaklarımızı ile ailemizin refahını güçlendirmek için başka yollar düşünmeliyiz."

 agot_laughing_storm_rebellion.0018.a:0 "Çocuğum aşkını başka yerde bulacak."

 agot_laughing_storm_rebellion.0020.t:0 "Fırtınanın Zaferi"

 agot_laughing_storm_rebellion.0020.desc:0 "Muharebe yargılaması bitti ve [duncantall.GetTitledFirstName], elimle yenilmiş halde yatıyor. Evi [lyonel.GetHouse.GetBaseName]'in onuru onarıldı ve zaferin heyecanı damarlarımda nabız gibi atıyor. Şimdi bir yol ayrımında duruyorum.\n\n"

 agot_laughing_storm_rebellion.0020.desc.both:0 "Bağımsız kalmayı seçebilir, Demir Taht'tan azade kendi yolumu çizebilirim. Ya da bir kez daha sadakat yemini edebilirim, ama yalnızca [aegonv.GetTitledFirstNameRegnal]'den yeni bir nişan ve [duncansmall.GetTitledFirstNameNicknamed]'in Duvar'a sürgün edilmesi koşuluyla."

 agot_laughing_storm_rebellion.0020.desc.only_banishment:0 "Bağımsız kalmayı seçebilir, Demir Taht'tan azade kendi yolumu çizebilirim. Ya da bir kez daha sadakat yemini edebilirim, ama yalnızca [duncansmall.GetTitledFirstNameNicknamed]'in Duvar'a sürgün edilmesi koşuluyla."

 agot_laughing_storm_rebellion.0020.desc.only_betrothal:0 "Bağımsız kalmayı seçebilir, Demir Taht'tan azade kendi yolumu çizebilirim. Ya da bir kez daha sadakat yemini edebilirim, ama yalnızca [aegonv.GetTitledFirstNameRegnal]'den yeni bir nişan koşuluyla."

 agot_laughing_storm_rebellion.0020.desc.none:0 "Bağımsız kalmayı seçebilir, Demir Taht'tan azade kendi yolumu çizebilirim. Ya da bir kez daha sadakat yemini edebilirim, ama bunu körü körüne yapmayacağım."

 agot_laughing_storm_rebellion.0020.a:0 "Sadakat yemini ediyorum, ama adalet talep ediyorum."

 agot_laughing_storm_rebellion.0020.a.simple:0 "Daha fazla çekişmeye gerek yok — sadakat yemini ediyorum."

 agot_laughing_storm_rebellion.0020.b:0 "Fırtına Toprakları tek başına duracak."

 agot_laughing_storm_rebellion.0021.t:0 "Fırtınanın Talepleri"

 agot_laughing_storm_rebellion.0021.no_demand.t:0 "Fırtınanın Zaferi"

 agot_laughing_storm_rebellion.0021.desc:0 "[lyonel.GetFullNameNicknamed], [duncantall.GetTitledFirstName]'i yenerek muharebe yargılamasında galip geldi.\n\n"

 agot_laughing_storm_rebellion.0021.desc.both:0 "Şimdi bir kez daha sadakat yemini etmeyi teklif ediyor, ama sadakatinin bir bedeli var: Taç'tan yeni bir nişan ve oğlum [duncansmall.GetTitledFirstNameNicknamed]'in Duvar'a sürgünü. Karar ağır; diyarın onuru ile güçlü bir tebaanın taleplerini dengelemek gerekiyor.\n\nŞartlarını kabul etmenin ya da reddetmenin sonuçlarını dikkatle düşünmeliyim."

 agot_laughing_storm_rebellion.0021.desc.only_banishment:0 "Şimdi bir kez daha sadakat yemini etmeyi teklif ediyor, ama sadakatinin bir bedeli var: oğlum [duncansmall.GetTitledFirstNameNicknamed]'in Duvar'a sürgünü. Karar ağır; diyarın onuru ile güçlü bir tebaanın taleplerini dengelemek gerekiyor.\n\nŞartlarını kabul etmenin ya da reddetmenin sonuçlarını dikkatle düşünmeliyim."

 agot_laughing_storm_rebellion.0021.desc.only_betrothal:0 "Şimdi bir kez daha sadakat yemini etmeyi teklif ediyor, ama sadakatinin bir bedeli var: Taç'tan yeni bir nişan. Karar ağır; diyarın onuru ile güçlü bir tebaanın taleplerini dengelemek gerekiyor.\n\nŞartlarını kabul etmenin ya da reddetmenin sonuçlarını dikkatle düşünmeliyim."

 agot_laughing_storm_rebellion.0021.desc.none:0 "Şimdi, talep ve koşul olmadan bir kez daha sadakat yemini etmeyi teklif ediyor. Yemini diyara bir ölçüde barış geri getiriyor, ama geçmiş çekişmeler kolay unutulmuyor.\n\nŞimdilik diyar yeniden bir bütün."

 agot_laughing_storm_rebellion.0021.a:0 "Bu cüretkâr talebi reddediyorum."

 agot_laughing_storm_rebellion.0021.a.no_demand:0 "Barış kalıcı olsun."

 agot_laughing_storm_rebellion.0021.b:0 "Bu teklif barışı geri getirebilir."

 agot_laughing_storm_rebellion.0022.t:0 "Geyiğin Meydan Okuyuşu"

 agot_laughing_storm_rebellion.0022.desc:0 "[lyonel.GetTitledFirstNamePossessive] cevabı hızlı ve keskin geldi — bu eşleşmeyi reddediyor. Özür yok, nezaket yok; yalnızca hanesini benimkine bağlamayacak bir adamın demir gibi iradesi, barışta bile.\n\nDüelloyu kaybetti, ama bunda boyun eğmez duruyor. Fırtına bu kadar kolay evcilleştirilmeyecek."

 agot_laughing_storm_rebellion.0022.a:0 "Öyle olsun."

 agot_laughing_storm_rebellion.0022.a.tt:0 "Öyle olsun."

 agot_laughing_storm_rebellion.0023.t:0 "İsyana Çağrı"

 agot_laughing_storm_rebellion.0023.desc:0 "[duncansmall.GetTitledFirstNameNicknamedPossessive] bozulan nişanının Evi [lyonel.GetHouse.GetBaseName]'e getirdiği şerefsizlik, artık [lyonel.GetTitledFirstNameNicknamedPossessive] Demir Taht'a karşı isyanını körüklüyor. [lyonel.GetTitledFirstNameNoTooltip] müttefiklerini topluyor, bağımsızlık için savaşmayı arıyor.\n\nBenim çocuğum da Targaryenlerin elinden acı çekti; bu da [lyonel.GetFirstNameNoTooltip]'in mücadelesine katılmayı haklı gösteriyor. Ama ben her zaman Demir Taht'a sadık oldum ve isyanın sonuçları ağır. Hanemizin geleceğini şekillendirecek çok önemli bir karar."

 agot_laughing_storm_rebellion.0023.a:0 "'Gülen Fırtına'nın yanındayız."

 agot_laughing_storm_rebellion.0023.b:0 "Demir Taht'a sadık kalıyoruz."

 agot_laughing_storm_rebellion.0024.t:0 "Fırtına Başlıyor"

 agot_laughing_storm_rebellion.0024.garlan_steffon_runceford.desc:0 "Zamanı geldi. Ordum hazır, sancaklar yüksek dalgalanıyor, yürekler savaşa bileylenmiş. [runceford.GetTitledFirstName], [garlan.GetTitledFirstName] ve [steffon.GetTitledFirstName] yanımdayken, savaş çağrısı Fırtına Toprakları'nda yankılanıyor. Evi [lyonel.GetHouse.GetBaseName]'e yapılan şerefsizlik, bir fırtınanın gazabıyla cevaplanacak.\n\nOnurumuzu ve bağımsızlığımızı geri kazanmak için ilerliyoruz, önümüzdeki her zorlukla yüzleşmeye hazırız. Demir Taht titresin, çünkü fırtınanın gazabı üzerlerine geliyor."

 agot_laughing_storm_rebellion.0024.steffon_runceford.desc:0 "Zamanı geldi. Ordum hazır, sancaklar yüksek dalgalanıyor, yürekler savaşa bileylenmiş. [steffon.GetTitledFirstName] ve [runceford.GetTitledFirstName] yanımdayken, savaş çağrısı Fırtına Toprakları'nda yankılanıyor. Evi [lyonel.GetHouse.GetBaseName]'e yapılan şerefsizlik, bir fırtınanın gazabıyla cevaplanacak.\n\nOnurumuzu ve bağımsızlığımızı geri kazanmak için ilerliyoruz, önümüzdeki her zorlukla yüzleşmeye hazırız. Demir Taht titresin, çünkü fırtınanın gazabı üzerlerine geliyor."

