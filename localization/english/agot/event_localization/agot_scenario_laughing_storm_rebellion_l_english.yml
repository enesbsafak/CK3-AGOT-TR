### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0467.desc [AGOT: As sleep overtakes me, I am pulled into a vision of fire and destruction. A great city stretches before me, but something is terribly wrong. The flames consuming it are not ordinary fire, but a strange, unnatural green, glowing with an eerie and malevolent light that twists the very air around it. Wildfire.\n\nThe buildings crackle and hiss as the green flames devour their edges, melting stone and wood into grotesque shapes. The fire seems alive, hungry, not only consuming the city's structures but the very ground beneath it.\n\nThe smell of burning stone and ash fills the air, and I watch, helpless, as the heart of the city is reduced to ruin. I wake suddenly, the image of the burning city etched into my thoughts, the green wildfire still burning in my mind.]
