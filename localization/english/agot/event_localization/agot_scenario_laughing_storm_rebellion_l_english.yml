### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0460.desc [AGOT: As sleep pulls me under, I am thrust into a world that feels disturbingly familiar. The air is cold, thick with the scent of decay. I stand in a desolate field, the ground beneath me cracked and barren. In the distance, I see figures moving slowly, unnaturally. At first, they appear as shadows, but as they draw nearer, I see them clearly.\n\nThese are not men, they are corpses. Faces frozen in death, eyes hollow, skin gray and rotting, but they move as though life still courses through their veins. The dead have risen, walking toward me with an eerie silence. Their eyes seem to see nothing and everything all at once. I try to speak, to call out, but my voice fails. Suddenly, one of the dead turns its head, fixing its lifeless gaze on me.\n\nI wake in a cold sweat, the image of those walking corpses lingering in my mind.]
 agot_laughing_storm_rebellion.0460.desc:0 "As sleep pulls me under, I am thrust into a world that feels disturbingly familiar. The air is cold, thick with the scent of decay. I stand in a desolate field, the ground beneath me cracked and barren. In the distance, I see figures moving slowly, unnaturally. At first, they appear as shadows, but as they draw nearer, I see them clearly.\n\nThese are not men, they are corpses. Faces frozen in death, eyes hollow, skin gray and rotting, but they move as though life still courses through their veins. The dead have risen, walking toward me with an eerie silence. Their eyes seem to see nothing and everything all at once. I try to speak, to call out, but my voice fails. Suddenly, one of the dead turns its head, fixing its lifeless gaze on me.\n\nI wake in a cold sweat, the image of those walking corpses lingering in my mind."
