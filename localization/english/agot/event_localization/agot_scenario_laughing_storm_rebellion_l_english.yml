### TODO NOT-IN-ST: agot_laughing_storm_rebellion.0105.desc [AGOT: Three years, and still the taste of defeat lingers like bile on my tongue. The Fourth Blackfyre Rebellion shattered against cold steel and traitor's blood, our banners torn, our kin slain or scattered.\n\nI bled for [daemon_blackfyre.GetFirstName], for his sons, for the dream we swore to carve from the ruin of a fading dynasty. And yet, it was not enough. But the Golden Company remains.\n\nThe exiled, the broken, the swords that know no home but war. The Blackfyres are not finished, and neither am I. One day, we will cross the Narrow Sea again. One day, the dragon will have its due.]
 agot_laughing_storm_rebellion.0105.desc:0 "Three years, and still the taste of defeat lingers like bile on my tongue. The Fourth Blackfyre Rebellion shattered against cold steel and traitor's blood, our banners torn, our kin slain or scattered.\n\nI bled for [daemon_blackfyre.GetFirstName], for his sons, for the dream we swore to carve from the ruin of a fading dynasty. And yet, it was not enough. But the Golden Company remains.\n\nThe exiled, the broken, the swords that know no home but war. The Blackfyres are not finished, and neither am I. One day, we will cross the Narrow Sea again. One day, the dragon will have its due."
