l_english:

 agot_artifact_events.0010.t:0 "[prisoner.GetTitledFirstNameNoTooltip]'in Eşyaları"

 agot_artifact_events.0010.desc:0 "[prisoner.GetNameNicknamed] hâlâ gözetimim altında; özgürlüğü reddedilirken, [prisoner.GetHerHis] eşyalarının akıbeti zihnimi kurcalıyor.\n\n[prisoner.GetHerHis] esir edeni olarak, salıverilme koşulu olarak bazı eserlere el koyabilirim. Taleplerim özenle seçilirse, bu eşyalar değerli olabilir."

 agot_artifact_events.0010.a:0 "Her biri için ne yapacağıma karar vermeliyim..."

 agot_artifact_events.0010.a_tt:0 "[prisoner.GetTitledFirstNamePossessiveNoTooltip] eşyalarının her birini sırayla değerlendireceğim."

 agot_artifact_events.0010.a_tt_artifact:0 "[artifact_to_inform.GetName] ile ne yapacağımı değerlendireceğim."

 agot_artifact_events.0010.b:0 "Taleplerimi yeniden değerlendireceğim."

 agot_artifact_events.0010.c:0 "Bunlar yeterli olacak."

 agot_artifact_events.0010.c_tt:0 "[artifact_to_show.GetNameNoTooltip]'i talep edeceğim."

 agot_artifact_events.0011.t:0 "$agot_artifact_events.0010.t$"

 agot_artifact_events.0011.desc:0 "[prisoner.GetTitledFirstName]'e, [prisoner.GetHerHis] eşyalarının bir kısmı karşılığında gözetimimden ayrılma şansı sunmaya karar verdim. Şimdi hangi eşyaları talep edeceğime karar vermeliyim.\n\n[artifact_to_steal.GetName] aklıma geliyor. Bunu talep listeme eklemeli miyim, yoksa öyle mi bırakmalıyım? Teklifi sunarsam [prisoner.GetSheHe] bu eserden vazgeçmeye razı olur mu?"

 agot_artifact_events.0011.a:0 "Bunu talep listeme ekleyeceğim."

 agot_artifact_events.0011.a_valyrian_tt_no_house:0 "[prisoner.GetTitledFirstNameNoTooltip] kabul ederse, [prisoner.GetHouse.GetNameNoTooltip] Hanesi üyeleri, bir aile yadigârını aldığınız için size kızacak."

 agot_artifact_events.0011.a_illustrious:0 "Nadirlik nedeniyle, bu eseri fidye olarak almak [prestige_i|E] #N 1000#! tutacaktır."

 agot_artifact_events.0011.a_famed:0 "Nadirlik nedeniyle, bu eseri fidye olarak almak [prestige_i|E] #N 500#! tutacaktır."

 agot_artifact_events.0011.a_masterwork:0 "Nadirlik nedeniyle, bu eseri fidye olarak almak [prestige_i|E] #N 250#! tutacaktır."

 agot_artifact_events.0011.a_common:0 "Nadirlik nedeniyle, bu eseri fidye olarak almak [prestige_i|E] #N 100#! tutacaktır."

 agot_artifact_events.0011.b:0 "Bu eseri almaya niyetim yok."

 agot_artifact_events.0011.b_tt:0 "Bu eser, hak sahibine aittir."

 agot_artifact_events.0011.c:0 "Eserleri incelemeyi bitirdim."
