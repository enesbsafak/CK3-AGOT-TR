l_english:

 agot_proclamation_events.1000.t:0 "Yeni Bir Büyük Hane"

 agot_proclamation_events.1000.desc_intro:0 "[king.GetFirstName]'in, [king.GetHerHim] bana yeni bir unvan olan [kingdom_title_to_grant.GetName]'i ve içindeki topraklar üzerindeki hükümranlığı bahşederken, [Select_CString(king.IsFemale,'Kraliçem','Kralım')] önünde diz çöküp bağlılığımı yemin ediyorum.\n\n"

 agot_proclamation_events.1000.desc.not_legitimate_house:0 "Eski ve yeni tüm vassallerimin gözü önünde, soyumun hiç ulaşmadığı bir makama yükseltiliyorum. Diyarımda yeni bir Büyük Hane doğuyor, adı toprakların dört bir yanında yankılanıyor. Yine de şüphe fısıltıları sürüyor ve bazıları, [legitimate_house.GetBaseName] Hanesi'nin üyesi olmadığım için bu unvanı alma hakkımı sorguluyor."

 agot_proclamation_events.1000.desc.legitimate_house:0 "Eski ve yeni tüm vassallerimin gözü önünde, ailemin kadim topraklarını geri alıyorum; bir Büyük Hane'nin hak ettiği yere dönüşü. Atalarımı onurlandırmaya ve bu unvanın bir daha asla elimizden çıkmamasını sağlamaya ant içiyorum."

 agot_proclamation_events.1000.a:0 "[new_holder.GetHouse.GetBaseNameNoTooltip] Hanesi için gelecek parlak."

 agot_proclamation_it_succession_msg_title:0 "Demir Taht'ın Veraseti"

 agot_proclamation_it_succession_msg_inheritance:0 ""Sayın [player.GetLadyLord|U], [new_holder.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'tan [new_holder.GetHouse.GetBaseName] Hanesi'nin mührünü taşıyan bir mektup ulaştı; [previous_holder.GetTitledFirstName|U] [previous_holder.GetDeathReason] — [previous_holder.GetSheHe] huzur içinde yatsın.\n\n[new_holder.GetFirstName] [new_holder.GetHouse.GetBaseName], [new_holder.GetPrimaryTitle.GetNameNoTooltip]'in meşru halefi ilan edildi.""

 agot_proclamation_it_succession_msg_conquest:0 ""Sayın [player.GetLadyLord|U], [new_holder.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'tan [new_holder.GetHouse.GetBaseName] Hanesi'nin mührünü taşıyan bir mektup ulaştı; [previous_holder.GetFirstName] [previous_holder.GetHouse.GetBaseName] önderliğindeki kuvvetler yenilgiye uğratıldı ve [new_holder.GetTitledFirstName] [new_holder.GetHouse.GetBaseName], fetih hakkıyla Demir Taht'ı ele geçirdi.""

 agot_proclamation_it_succession_msg_abdication:0 ""Sayın [player.GetLadyLord|U], [new_holder.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'tan [new_holder.GetHouse.GetBaseName] Hanesi'nin mührünü taşıyan bir mektup ulaştı; beklenmedik bir gelişmeyle, Majesteleri [previous_holder.GetFirstNameRegnal] [new_holder.GetHouse.GetBaseName], [previous_holder.GetHerHis] hüküm hakkından vazgeçti. Bu nedenle [new_holder.GetTitledFirstName] [new_holder.GetHouse.GetBaseName], [previous_holder.GetHerHis] halefi ilan edilmiş ve Yedi Krallık'ı yönetmek üzere Demir Taht'a çıkacaktır.""

 agot_proclamation_it_succession_msg_usurped:0 ""Sayın [player.GetLadyLord|U], [new_holder.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'tan [new_holder.GetHouse.GetBaseName] Hanesi'nin mührünü taşıyan bir mektup ulaştı; [new_holder.GetTitledFirstName] [new_holder.GetHouse.GetBaseName], Demir Taht'ı [previous_holder.GetFirstName] [previous_holder.GetHouse.GetBaseName]'ten almış ve Yedi Krallık'ın yeni hükümdarı ilan edilmiştir.\n\nKimileri fısıltıyla [new_holder.GetHerHim]'i taht gaspçısı olarak ansa da, Demir Taht'ın artık [new_holder.GetHerHis] elinde olduğu inkar edilemez.""

 agot_proclamation_it_succession_msg_fallback:0 ""Sayın [player.GetLadyLord|U], [new_holder.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]'tan [new_holder.GetHouse.GetBaseName] Hanesi'nin mührünü taşıyan bir mektup ulaştı; [new_holder.GetTitledFirstName] [new_holder.GetHouse.GetBaseName], Yedi Krallık'ın yeni hükümdarı ilan edildi.""
