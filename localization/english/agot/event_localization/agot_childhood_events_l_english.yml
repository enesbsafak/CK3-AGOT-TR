 agot_childhood_events.0028.desc.intro:0 "Uzaktan [child.GetFirstName]'in neşeli kahkahalarını duyuyorum; [child.GetSheHe] [dragon_doll.GetName] ile oynuyor olmalı. Sessiz olmaya çalışarak yaklaşıyorum; ikili ve manzara beni neşeyle dolduruyor. Varlığımdan habersiz [child.GetNameNoTooltip] kıkırdamalar arasında diyor ki, "

 agot_childhood_events.0028.desc.fire_common:0 ""Yine, [dragon_doll.GetNameNoTooltip], alev saç, [dragon_doll.GetNameNoTooltip]!""

