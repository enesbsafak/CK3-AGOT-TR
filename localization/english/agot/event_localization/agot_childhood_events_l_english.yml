 agot_childhood_events.0101.t:0 "Farklı Türden Bir Dans"

 agot_childhood_events.0101.desc:0 "Avluda dolaşırken [other_child.GetFirstName]'in tahta bir kılıçla görünmez bir düşmanla savaştığını görüyorum. "Take that, you fiend!" [other_child.GetSheHe] orada olduğumu fark edene dek birkaç dakika merakla izliyorum.\n\n"Merhaba, leydim. Sadece talim yapıyordum ve, şey, etrafta başka kimse yoktu... tabii katılmak istemezseniz?" [other_child.GetSheHe] hafifçe kızarıyor."

 agot_childhood_events.0101.desc.alone:0 "Avluda dolaşırken birkaç tane terk edilmiş talim kılıcı görüyorum — nedimelerin oğulları oynuyor olmalı ve maç ortasında bırakıp gitmişler. Bir süreliğine gidecek hiçbir yerim yok..."

 agot_childhood_events.0101.a:0 "Bu eğlenceli görünüyor!"

 agot_childhood_events.0101.b:0 "Erkekler gibi öğrenmeliyim!"

 agot_childhood_events.0101.c:0 "Hayır, bu saçmalık."

 agot_childhood_events.0101.tt:0 "Kılıç talimine başlayacaksın"

 agot_childhood_events.0102.t:0 "Sıra Dışı Bir Uğraş"

 agot_childhood_events.0102.desc:0 "Avluda dolaşırken tahta kılıçlarla oyun oynayarak dövüşen birkaç çocuk görüyorum. Biri ötekini ustalıkla silahsızlandırıyor; irkildiğimde onu tanıyorum — benim [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName].\n\nBeni çoktan görmüş olmalı; çünkü anında koşarak yanıma geliyor. "Gördün mü? Kazandım! Büyüyünce Visenya ya da Nymeria gibi bir savaşçı olacağım!""

 agot_childhood_events.0102.desc.alone:0 "Avluda dolaşırken havaya karşı kılıç talimi yapan bir çocuk görüyorum. İrkildiğimde bunun benim [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] olduğunu fark ediyorum.\n\nGörünüşe göre o da beni görüyor ve anında koşarak yanıma geliyor. "Kılıç taliminin bu kadar eğlenceli olduğunu bilmiyordum! Büyüyünce Visenya ya da Nymeria gibi bir savaşçı olmak istiyorum!""

 agot_childhood_events.0102.a:0 "Pekâlâ, öğrendiğin başka neler var göster bakalım."

 agot_childhood_events.0102.b:0 "Belki o da savaş sanatını öğrenmek ister..."

 agot_childhood_events.0102.c:0 "Bu, bir leydiye yakışır bir uğraş değil!"

 agot_childhood_events.0102.tt:0 "[child.GetFirstName] kılıç talimine başlayacak"

