l_english:

 agot_childhood_events.0001.t:0 "Bozuk Paranın Dönüşü"

 agot_childhood_events.0001.desc:0 "Ne zaman bir [GetPlayer.GetHouse.GetBaseName] doğsa tanrılar bir bozuk para atar — bir yüzünde büyüklük, diğerinde delilik.\n\n[child.Custom('CoinFlipChild')]"

 agot_childhood_events.0001.a:0 "Hayat böyle..."

 agot_childhood_events.0002.t:0 "$agot_childhood_events.0001.t$"

 agot_childhood_events.0002.desc:0 "Ne zaman bir [GetPlayer.GetHouse.GetBaseName] doğsa tanrılar bir bozuk para atar — bir yüzünde büyüklük, diğerinde delilik. Ve dünya sonucu beklemek için nefesini tutar.\n\nGörünüşe göre bugün para lehte düştü... [child.GetFirstName] [child.Custom('CoinFlip')]"

 agot_childhood_events.0002.a:0 "Kariyerini büyük bir ilgiyle izleyeceğiz."

 agot_childhood_events.0003.t:0 "$agot_childhood_events.0001.t$"

 agot_childhood_events.0003.desc:0 "Ne zaman bir [GetPlayer.GetHouse.GetBaseName] doğsa tanrılar bir bozuk para atar — bir yüzünde büyüklük, diğerinde delilik. Ve dünya sonucu beklemek için nefesini tutar.\n\nGörünüşe göre bugün para... pek de lehte düşmedi. [child.GetFirstName] deliliğin ta kendisi gibi görünüyor."

 agot_childhood_events.0003.a:0 "Yazıklar olsun [GetPlayer.GetHouse.GetBaseName] Hanesi'ne!"

 coin_flip_diligent:0 "doğuştan çalışkan ve [ROOT.Char.GetSheHe]'in yaptığı her şeye adanmış görünüyor."

 coin_flip_learning:0 "bilimsel sanatlara doğal bir yeteneği varmış gibi görünüyor."

 coin_flip_martial:0 "askerî ilimlere doğal bir yeteneği varmış gibi görünüyor."

 coin_flip_intrigue:0 "entrikaya doğal bir yeteneği varmış gibi görünüyor."

 coin_flip_stewardship:0 "mülki idareye doğal bir yeteneği varmış gibi görünüyor."

 coin_flip_diplomacy:0 "diplomasiye doğal bir yeteneği varmış gibi görünüyor."

 coin_flip_prowess:0 "kılıçta doğal bir hüneri varmış gibi görünüyor."

 coin_flip_shrewd:0 "[ROOT.Char.GetSheHe]'in giriştiği her işe doğal bir yeteneği varmış gibi görünüyor."

 coin_flip_genius:0 "[ROOT.Char.GetSheHe]'in giriştiği her işte şaşırtıcı bir sezgiye sahip görünüyor."

 coin_flip_child_diligent:0 "Yeteneksizliğim için [ROOT.Char.GetFaith.HighGodName]'e lanet etmek istediğim anlar oluyor; ama şikâyetin beni bir yere götürmeyeceğini biliyorum. Her gün, yenmeye niyetlendiğim bir meydan okuma; her gece, öne geçme fırsatı. İki elimle sebat etmeliyim — hayır, #italic edeceğim#!."

 coin_flip_child_learning:0 "Deliliğim varsa o da karşılaştığım her kitabı okumadan edemememdir... Bir dakika, [GetPlayer.GetHouse.GetBaseName] deliliği hiç böyle tezahür etmiş miydi? Kütüphaneye gidip bu konuda eser olup olmadığına bakmam gerekecek!"

 coin_flip_child_martial:0 "Daha bugün saraydaki şövalyeler kaleye sahte bir kuşatma düzenlemek için toplandı. Kale duvarlarından süregelen 'savaşı' izlerken delirecekmiş gibi hissettim! Verilen her karar yanlıştı ve ideal taktik acı verecek kadar ortadaydı. #italic Aptal mı bunlar?#!"

 coin_flip_child_intrigue:0 "Sarayda gizli bakışlarını paylaşan nedimeler fark etmiyor olabilir ama gizlemeye çalıştıkları yasak aşk, gören herkes için gündüz gibi ortada... en azından ben böyle sanıyordum. Ama saraydaki bir başka [ROOT.Char.Custom('GirlBoy')|l]'e bundan söz ettiğimde, [ROOT.Char.GetSheHe] neden bahsettiğimi hiç anlamadı. Sanırım bu tür şeyleri ben daha kolay seziyorum."

 coin_flip_child_stewardship:0 "Kâhyalardan biriyle — adını çoktan unuttum — saatlerce aynı konu etrafında döne döne konuştuktan sonra başım ağrıyor ve zihnim uykuya hasret. 'Yaşına göre para işlerine hayli vakıfsın,' cümlesini bir daha hiç duymasam mutlu ölürüm."

 coin_flip_child_diplomacy:0 "Kahramanlar Çağı'nın hikâyelerini büyülenmiş seyircime anlatmaktan aldığım zevke pek az şey yaklaşabilir. Hikâyeyi daha önce sayısız kez dinlemiş olsalar da her sözüme asılmaları... Bu işte epey yetenekli olduğumu söyleyebilirim!"

 coin_flip_child_prowess:0 "Zihnim bir kez daha kılıç talimine kayıyor. Vur! Savuştur! #bold Ripost!#! Şövalyelerimiz düello ederken bu hareketleri kaç kez izledim? Sıra sonunda bana düello düşünce yanıtım basit: Savuştur! Ripost! #bold İyi maç!#!"

 coin_flip_child_shrewd:0 "Naibime defalarca, mahkûmları idam etmek yerine casus olarak salıvermenin savunulacak bir yanı olduğunu anlattım. Ama her seferinde aldığım yanıt, bir [ROOT.Char.GetLadyLord]'un görevinin adil olmak olduğu. Keşke diğerleri adaletin daha #italic pragmatik#! yollarla da sağlanabileceğini görseydi."

 coin_flip_child_genius:0 "İncelediğim her konu, sırlarını bana o kadar mutlu teslim ediyor ki. Hangi nutku yetkinleştireyim? Hangi stratejiyi fethedeyim? Hangi entrikayı öreyim? Hangi kuramı çözeyim? Zavallı naibim bana yetişmekte zorlanıyor! #bold İyi.#!"

 coin_flip_child_lunatic_1:0 "Başsız kral odanın köşesinden bir kez daha izliyor. Peşimde bakışını, düşünürken düşüncelerini, uyurken sesini hissediyorum. Yavaşça, armağanlı doğamı ve birbirimize ne kadar benzediğimizi anlatan masallarla beni uykuya sallıyor. Ne kadar çok konuşursa sözlerinin doğruluğunu o kadar iyi anlıyorum."

 coin_flip_child_possessed_1:0 "Koridorlarda seke seke ilerlerken nedimeler neden bizi izliyor? Ne kadar özel olduğumuzu hissedebiliyorlar mı? Hayır, hayır, elbette hissedemezler. Ama ya biliyorlarsa? Ne kadar özel olduğumuzu kimse bilemez. Bizi ayırmaya çalışırlar, bunu hissedebiliyorum. Bu gece plan yapmamız gerekecek."

 coin_flip_child_arbitrary:0 "Bir yanda armağan, öte yanda delilik — hepsi o kadar korkunç sıkıcı ki. Üstelik çocukça da! Bir insan bunu nasıl ayırt etsin ki? Ortada nesnel bir ölçüt yok ya. Saraydakiler neden bu konuda konuşmayı bırakmıyor? Yani gerçekten kimin umurunda? Benim kesinlikle değil, önemli olan da bu."

 coin_flip_child_paranoid:0 "Uyuyamıyorum. Ne içebiliyor ne yiyebiliyorum. Düşünemiyorum bile. Nedimelerin beni izleyişini hissedebiliyorum — paranın tura mı yazı mı geleceğini bekliyorlar. Beni delirtiyorlar! Ama... ben de merak etmeden edemiyorum. Deliriyor muyum? İşaret bu mu? Hepsi saçma bir masal, öyle olmalı. Saraydaki öteki çocukları itaat içinde tutmak için uydurulmuş. [GetPlayer.GetHouse.GetBaseName] deliliği diye bir şey yok... değil mi?"

 coin_flip_child_wrathful:0 "Üç haftadır [GetPlayer.GetHouse.GetBaseName] tarihinin aynı bölümünü işliyoruz ve bu derslerle sabrım tükenmek üzere. Bugün naibimin bazı nedimelerle konuşurken hiçbir alanda yeteneğim olmadığını söylediğini duydum. Dillerini tutmazlarsa, tutmalarını ben sağlayacağım."

 coin_flip_child_fire_obsessed:0 "Sarayda [GetPlayer.GetHouse.GetBaseName] Hanesi'nin armağanlı doğasına dair fısıltılar duymuştum; ama armağanların bu kadar görünür olacağını hiç kestiremezdim. Ne zaman titrek bir aleve baksam... görüler görüyorum. Ne olduğunu bilmediğim anlar; ama öfkeli ateşler bana bir şey anlatmaya çalışıyor olmalı. Beni bir şeye karşı mı uyarıyorlar? Yanıtı ancak gerçekten görkemli bir odun ateşinde bulacağım."

 agot_childhood_events.0004.t:0 "Tohum Güçlüdür..."

 agot_childhood_events.0004.desc:0 "[child.GetFirstName] büyüdükçe [child.GetHerHim]'de kendimden gittikçe daha az iz görüyorum. [child.GetSheHe] gerçekten benim mi?"

 agot_childhood_events.0004.a:0 "Bir düşününce, belki de hiçbir şey yoktur..."

 agot_childhood_events.0004.b:0 "Gerçeği öğrenmeliyim!"

 agot_childhood_events.0004.b.success:0 "Çocuğun senden değilse sırrı öğreneceksin"

 agot_childhood_events.0004.b.success.bastard.t:0 "Soruşturma Başarılı"

 agot_childhood_events.0004.b.success.bastard.desc:0 "[child.GetFirstName] aslında [real_father.GetFullName]'in çocuğu!"

 agot_childhood_events.0004.b.success.notbastard.t:0 "Soruşturma Başarılı"

 agot_childhood_events.0004.b.success.notbastard.desc:0 "[child.GetFirstName] gerçekten de benim çocuğummuş!"

 agot_childhood_events.0004.b.failure:0 "Kanıt bulamıyorsun"

 agot_childhood_events.0004.b.failure.t:0 "Soruşturma Başarısız"

 agot_childhood_events.0004.b.failure.desc:0 "Kanıt bulamadın."

 agot_childhood_events.0004.c:0 "Herkes gerçeği öğrenmeli!"

 agot_childhood_events.0004.c.tt:0 "Çocuklarını alenen piçlikle suçlayacaksın."

 agot_childhood_events.0004.c.tt.1:0 "Kimse sana inanmıyor ve vasalların suçlamanı onursuzca buluyor."

 agot_childhood_events.0004.c.tt.2:0 "Suçlama güvenilir bulunuyor"

 agot_childhood_events.0004.c.failure.t:0 "Suçlama Başarısız"

 agot_childhood_events.0004.c.failure.desc:0 "Kimse suçlamalarına inanmıyor; artık seni onursuz bir yalancı sanıyorlar."

 agot_childhood_events.0004.c.success.t:0 "Suçlama Başarılı"

 agot_childhood_events.0004.c.success.desc:0 "Kamuoyu suçlamalarına inanıyor. [child.GetFirstName], Tartışmalı Soy özelliğini kazandı."

 agot_childhood_events.0004.d:0 "Doğuştan benim olsalar da olmasalar da hiçbir şey değişmez."

 agot_childhood_events.0004.d.tt:0 "Karının tartışmalı soy sırları varsa geçersiz sayılacak."

 agot_childhood_events.0007.t:0 "Sarayın Renkleri"

 agot_childhood_events.0007.desc.courtier:0 "[dyed_hair.GetNamePossessive] saçı, [dyed_hair.GetHerHim] girdiği her odanın merkezi yapıyor."

 agot_childhood_events.0007.desc.sellsword:0 "Geçenlerde Özgür Şehirler'den saraydan geçen gezgin bir paralı asker vardı; [dyed_hair.GetHerHis] saçının kesinlikle inanılmaz rengini fark etmemek elimde değildi!"

 agot_childhood_events.0007.a:0 "Belki denemeliyim..."

 agot_childhood_events.0007.tt:0 "Saçını özgür şehirlerin tarzında boyatacaksın!"

 agot_childhood_events.0007.b:0 "Böyle bir gösteriş ancak alay konusu olur."

 agot_childhood_events.0008.t:0 "Aptallığa Boyanmış"

 agot_childhood_events.0008.desc:0 "[home.GetNameNoTooltip]'in koridorlarında yürürken gözümün kenarında tuhaf bir rengin bulanıklığını yakalıyorum. Başımı öyle hızlı çeviriyorum ki neredeyse boynumu kırıyorum; çünkü benim [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dyed_hair'))] [dyed_hair.GetFirstName]'in [dyed_hair.GetHerHis] saçını gülünç bir renge boyadığını fark ediyorum.\n\n"Ne dersin, [dyed_hair.Custom2('RelationToMeShort', ROOT.Char)]? Essos'un Özgür Şehirleri'nde en moda tarz bu.""

 agot_childhood_events.0008.a:0 "Madem istediğin bu..."

 agot_childhood_events.0008.b:0 "Derhal gidip şu pisliği saçından yıkayacaksın!"

 agot_childhood_events.0008.c:0 "Harika görünüyorsun!"

 agot_childhood_events.0008.c.tt:0 "Sen de saçını boyatacaksın!"

 agot_childhood_events.0009.t:0 "Bir Koğuşun Eğitimi"

 agot_childhood_events.0009.desc:0 "Odanda oturup genç yavrunun geleceğini düşünürken, aklına rahatsız edici bir düşünce geliyor. [ward.GetFirstName] hızla büyüyor ve [ward.GetSheHe]'in bu dünyadaki yolunu şekillendirmek için rehberliğe ve eğitime ihtiyacı olduğu gittikçe daha belirgin hale geliyor. Bu hayati görevin kime emanet edileceğine karar verme zamanı geldi."

 agot_childhood_events.0009.a:0 "Peki ya ben?"

 agot_childhood_events.0009.a.tt:0 "Belki de [ward.GetFirstName]'i hayatın çalkantılı yolculuğunda yönlendirmesi gereken sensin. Deneyimin ve bilgeliğin, [ward.GetHerHis] karakterini şekillendirmede ve [ward.GetHerHim] layık bir vâris olarak yoğurmada paha biçilmez olabilir."

 agot_childhood_events.0009.b:0 "[guardian.GetFirstName] nasıl olur?"

 agot_childhood_events.0009.b.tt:0 "Zihnin, bilgeliği ve dürüstlüğüyle tanınan bir figür olan [guardian.GetFirstName]'e kayıyor. [ward.GetFirstName]'i onun bakımına emanet etmek, büyüme ve öğrenme fırsatlarıyla dolu parlak bir geleceği güvence altına alabilir."

 agot_childhood_events.0009.c:0 "Peki ya başka biri?"

 agot_childhood_events.0009.c.tt:0 "Bu sorumluluğu taşıyacak başka birini bulacaksın."

 agot_childhood_events.0009.d:0 "Henüz karar vermedim."

 agot_childhood_events.0009.d.tt:0 "Sorumluluğun ağırlığı üzerine çöküyor ve bu dönüm noktası kararını vermekte tereddüt ediyorsun. Belki de bu kararı şimdilik ertelemek, daha fazla düşünmeye zaman tanımak en iyisi."

 agot_childhood_events.0011.t:0 "Umut Vaat Eden Bir Yıldız"

 agot_childhood_events.0011.desc:0 "[prodigy.GetFirstName]'i avluda [prodigy.GetHerHis] talim kılıcıyla çalışırken izlerken, [prodigy.GetHerHis] ayaklarının hızlı ve çevik hareketlerini, kılıcının sağlam ve akıcı savurmalarını fark ediyorum.\n\n[prodigy.GetSheHe|U] daha çoğunun kellesiz tavuklar gibi kılıçla sendeleyip durduğu bir yaşta, çoktan olağanüstü bir kılıç ustasına dönüşüyor. Bu sadece aile gururu olabilir; ama bu çocuğun [dawn.GetName] kılıcını kuşanma hakkını kazanıp Sabahın Kılıcı diye anılabileceğine inanıyorum.\n\n[prodigy.GetHerHim] şimdi zorlarsam, [prodigy.GetSheHe] ya [prodigy.GetHerHis] tam potansiyeline ulaşacak ya da baskı altında çökecek — göze alabileceğim bir risk mi bu?"

 agot_childhood_events.0011.a:0 "[prodigy.GetHerHis|U] gerçek eğitimi şimdi başlıyor."

 agot_childhood_events.0011.a.tt:0 "[prodigy.GetHerHim]'i Sabahın Kılıcı olma yoluna sokacaksın"

 agot_childhood_events.0011.b:0 "[prodigy.GetSheHe|U] daha bir çocuk; [prodigy.GetHerHim]'in [prodigy.GetHerHis] kendi yolunda büyümesine izin vereceğim."

 agot_childhood_events.0011.b.tt:0 "[prodigy.GetFirstNameNoTooltip] her çocuk gibi kendi hâlinde gelişecek"

 agot_childhood_events.dragon_doll:0 "Ejderha Bebeği:"

 agot_childhood_events.0020.t:0 "$agot_childhood_events.dragon_doll$ Ejderhasız Çocuk"

 agot_childhood_events.0020.desc_dragons_live:0 "Eski Valyria'nın törelerine göre [child.GetFirstName]'in çocuklukta bir ejderhayla bağ kurması gerekirdi; oysa bugüne dek [child.GetSheHe] ejderhasız kaldı.\n\nBenim gibi bir [ROOT.Char.GetTitleAsNameNoTooltip] bile [child.GetHerHim]'e veremese de ejderha bağı öyle bir armağan değil; yüreğim çocuk için sızlıyor. Ama bu yanlışı düzeltmek ve atalarımızın geleneklerini yaşatmak için mutlaka bir şeyler yapılabilir; belki bir çocuğa daha cazip gelecek bir armağan bulabilirim..."

 agot_childhood_events.0020.desc_dragons_dead:0 "Eski Valyrialılar ejderhalarının sırtında karaya ve gökyüzüne hükmediyordu. Ama ejderhaların hepsi gitti.\n\nYine de ejderhalar kimliğimizin özü, gücümüzün ve amacımızın simgesi olmayı sürdürüyor. Belki [child.GetFirstName]'i [child.GetHerHis] mirasına âşık etmenin bir yolu vardır..."

 agot_childhood_events.0020.a:0 "Çocuğun bir ejderhası olacak!"

 agot_childhood_events.0020.a.tt:0 "[child.GetNameNoTooltip] için bir ejderha bebeği üzerinde çalışmaya başlayacaksın."

 agot_childhood_events.0020.ignore:0 "Saygısızca bir teklif; ejderhalar oyuncak değildir!"

 agot_childhood_events.0021.t:0 "$agot_childhood_events.dragon_doll$ [newly_created_artifact.GetNameNoTooltip]"

 agot_childhood_events.0021.desc_simple:0 "Son gözü iliştirirken elim titriyor; gevşek ipliği kendi üzerinde düğümlüyorum. Bebek sonunda bitti... ve armağanıma işlediğim onca kusuru görebiliyorum; ama idare eder.\n\n[child.GetFirstName]'in ertesi sabah uyanmasını bekliyorum. [child.GetSheHe] kıpırdandığında [child.GetHerHim] için hazırladığım armağanı gösteriyorum. [child.GetSheHe|U] onu kollarımdan kapıp heyecanla oyuncağa sarılıyor.\n\n[child.GetHerHis|U] sevinci üzerime yayılıyor. Oyuncağın kusurları bile olsa, bu proje için ödeyebileceğim her bedele değer."

 agot_childhood_events.0021.desc_exquisite:0 "Son ipliği özenle kesiyorum; bebeği incelerken iç geçiriyorum. Mükemmel, diye sevinçle rahatlayarak nefes veriyorum.\n\n[child.GetFirstName]'i [child.GetHerHis] uykusundan uyandırıp oyuncağı hevesle [child.GetHerHis] ellerine tutuşturuyorum. [child.GetSheHe|U] oyuncağı bir yana bir yana savururken sevinçle kıkırdıyor; sonunda bebeğe sımsıkı sarılarak bir kez daha gece uykusuna çekiliyor. [child.GetHerHis|U] heyecanı karşı konulmazdı ve bu proje için ödeyebileceğim her bedele değerdi."

 agot_childhood_events.0021.a:0 "Ah, yüreğim..."

 agot_childhood_events.0021.a.callous:0 "İyi etmiş [child.GetHerHim]."

 agot_childhood_events.0021.desc_chosen_dragon:0 "\n\nYalnızca [chosen_dragon.GetNameNicknamed] ejderhasının bir taklidi olsa da [child.GetFirstNameNoTooltip], bebekle sanki kucağından bir yavru ejderhaymış gibi çoktan bağ kurdu."

 agot_childhood_events.0021.desc_named_dragon:0 "\n\n[child.GetFirstNameNoTooltip] ejderhaya sevecenlikle bir de isim verdi: [newly_created_artifact.GetNameNoTooltip]."

 agot_childhood_events.0022.t:0 "$agot_childhood_events.dragon_doll$ Bir Ejderhanın Bedeli"

 agot_childhood_events.0022.desc:0 "Ejderhalar ateş ve etten yapılma efsanevi yaratıklardır; ama böyle malzemeler bir bebeği mahveder... Bunların yerine ne kullanmalıyım?"

 agot_childhood_events.0022.a:0 "Yalnızca en seçkin malzemeleri kullanacağım! İpekler ve mücevherler!"

 agot_childhood_events.0022.a.tt:0 "Bebeğin kalitesi #V #Bold önemli ölçüde arttı#!#!."

 agot_childhood_events.0022.b:0 "Elbette altın ipliğe gerek yok..."

 agot_childhood_events.0022.b.tt:0 "Bebeğin kalitesi #V #Bold hafifçe arttı#!#!."

 agot_childhood_events.0022.c:0 "Depodakilerle yetinemez miyiz?"

 agot_doll_quality_significantly_increased:0 "Bebeğin kalitesi #V #Bold önemli ölçüde arttı#!#!."

 agot_doll_quality_slightly_increased:0 "Bebeğin kalitesi #V #Bold hafifçe arttı#!#!."

 agot_doll_quality_slightly_decreased:0 "Bebeğin kalitesi #V #Bold bir parça azalıyor#!#!."

 agot_doll_quality_significantly_decreased:0 "Bebeğin kalitesi #V #Bold önemli ölçüde azalıyor#!#!."

 agot_childhood_events.0023.t:0 "$agot_childhood_events.dragon_doll$ Ejderha Tasarlamak"

 agot_childhood_events.0023.desc:0 "Bu kadar narin ve ayrıntılı bir proje için zaman da para kadar önemli bir etken. Görevlerim bu haldeyken zanaatıma odaklanabilmek için saraydan uzaklaşmam gerekebilir; zamanımı nasıl bölmeli?"

 agot_childhood_events.0023.a:0 "Ayırabildiğim her saniyeyi adayacağım!"

 agot_childhood_events.0023.b:0 "Her biri eşit ilgi görecek."

 agot_childhood_events.0023.c:0 "Bu bir hobi, başka bir şey değil."

 agot_childhood_events.0024.t:0 "$agot_childhood_events.dragon_doll$ Canlı Renkler"

 agot_childhood_events.0024.desc_dragons_live:0 "Ejderhalar kendilerine özgü renk paletleriyle ünlüdür. [GetScriptedCharacterByHistoryID('dragon_balerion').GetNameNicknamedPossessive] alevlerinin şöhretinden [GetScriptedCharacterByHistoryID('dragon_silverwing').GetName]'in parlayan pullarına dek, daha canlı bir desen gerekip gerekmediğini merak ediyorum; sonuçta bu bir çocuk oyuncağı."

 agot_childhood_events.0024.desc_dragons_dead:0 "Ejderhalar yaşarken kendilerine özgü renk paletleriyle ünlüydü. [GetScriptedCharacterByHistoryID('dragon_balerion').GetNameNicknamedPossessive] alevlerinin şöhretinden [GetScriptedCharacterByHistoryID('dragon_silverwing').GetName]'in parlayan pullarına dek, daha canlı bir desen gerekip gerekmediğini merak ediyorum; sonuçta bu bir çocuk oyuncağı."

 agot_childhood_events.0024.desc_fallback:0 "Ejderhalar kendilerine özgü renk paletleriyle ünlüdür; daha canlı bir desen gerekip gerekmediğini merak ediyorum; sonuçta bu bir çocuk oyuncağı."

