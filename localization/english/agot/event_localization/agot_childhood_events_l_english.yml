 agot_child_personality_events.2010.t:0 "Geçimsiz Hizmetkârlar"

 agot_child_personality_events.2010.guardian:0 "[guardian.GetTitledFirstName] önüme iki hizmetkâr getirdi; salonun iki ucundan birbirine bakan yüzleri öfkeden kıpkırmızı. Görünüşe göre bir perde Arbor kırmızısıyla lekelenmiş ve her biri diğerini suçluyor. İkisi de lekeyle ilgilenmeye yanaşmıyor; kızgın hizmetkârlar da moral bozuyor. [guardian.GetFirstNameNoTooltip], kişiliğimin bir sınavı olarak bu anlaşmazlığı çözme görevini bana veriyor."

 agot_child_personality_events.2010.no_guardian:0 "İki hizmetkâr odama daldı; ikisinin de yüzü öfkeden kıpkırmızı. Her biri, diğerinin dün gece temizlik yaparken bir kupa Arbor kırmızısıyla perdeyi lekelediğini iddia ediyor. Bu anlaşmazlığın morale zararı ortada ve hızlıca karşılık vermeliyim."

 agot_child_personality_events.2010.a:0 "Temizlik yükünü paylaşacaksın."

 agot_child_personality_events.2010.b:0 "İkiniz de kovuldunuz!"

 agot_child_personality_events.2010.c:0 "Dün gece kim nöbetçiydi?"

 agot_child_personality_events.201.desc:0 "Benim [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName], [child.GetHerHis] yeteneklerinin yeni bir sınavıyla karşılaştı. Geçimsiz iki hizmetkâr bir anlaşmazlıkla geldi; her biri diğerinin pahalı bir perde takımının üzerine güzel bir Arbor kırmızısı döktüğünü iddia ediyordu. Diğer hizmetkârlar dikkatle izlerken bağırışlar ve sivri sözlerle birbirlerine girdiler."

