 agot_childhood_events.0027.desc:0 "Bebeklerin düğme gözlü olması gelenektir; ama ejderhalar, çoğu bebeğin biçimlendirildiği sıradan hayvanlardan çok daha uludur. Belki daha gösterişli bir şey yakışır; yine de bu ek bir masraf olur... Gözbebeği olarak değerli taşlar yerleştirmeyi düşünüyorum."

