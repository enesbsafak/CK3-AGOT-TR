 agot_childhood_events.0025.t:0 "$agot_childhood_events.dragon_doll$ Erteleme"

 agot_childhood_events.0025.desc:0 "[child.GetFirstNamePossessive] odasının önünden geçerken yüzümü ekşitiyorum ve aklıma ejderha bebeği geliyor... özel odalarımın bir yerlerine gizlenmiş, sırtına iğne batırılmış, yarım kalmış halde duruyor. Doğrusu bu projeyi sonuna kadar götürmek için pek motivasyon bulamıyorum.\n\nAklıma her geldiğinde kendimi paylıyorum. Tamamlanmayı bekleyen işin gölgesi beni sarıyor ve her hareketimi engelliyor; bitirene ya da rafa kaldırana dek suçluluk duymadan başka hiçbir şeye odaklanamıyorum.\n\nBir yandan, öz disiplin — iğneyi eline alıp başlamak — kilit nokta olabilir. Ne var ki yeni bir proje bulmak çok daha cazip. Belki yeni bir beceri öğrenirsem çocuğun oyuncağını bitirmek için ilham bulurum."

 agot_childhood_events.0025.a:0 "Devam et, oyuncak kendini bitirmeyecek."

