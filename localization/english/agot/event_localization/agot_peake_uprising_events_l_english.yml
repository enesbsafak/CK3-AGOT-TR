l_english:

 agot_peake_uprising.0001.t:0 "Peake Ayaklanması"

 agot_peake_uprising.0001.desc:0 "Sahte ejderha [daemon.GetFirstNameNicknamedPossessive] tahtını gasp ettiğinden beri House [ROOT.Char.GetHouse.GetName]'in varlığı, utanç ve rezillikten başka ne oldu ki?\n\nO günden beri düşmanlarımız topraklarımızı kemirmekten büyük keyif aldı! Mander'den denizadamlarını kovduğumuzdan beri elimizde tuttuğumuz toprakları!\n\nYeter artık! Sahte Doğumlu [daeron.GetFirstName] tahta çıktığından beri kaybettiğimiz her şeyi geri alacağız ya da bu uğurda yok olacağız! Solmakta olan bir hanedan olarak acı çekmeyeceğiz.\n\nYine de, gücümüzü kanıtlayabilirsek, belki gerçek hükümdara, [aenysclaimant.GetTitledFirstName] [aenysclaimant.GetHouse.GetName]'e, Dar Deniz'in ötesinden dönmesi için ilham verebiliriz..."

 agot_peake_uprising.0001.a:0 "Onurumuz yeniden tesis edilecek!"

 agot_peake_uprising.0002.t:0 "$agot_peake_uprising.0001.t$"

 agot_peake_uprising.0002.desc:0 "Son kırk yılda dördüncü kez, Starpike'ın zavallı sakinleri Demir Taht'a karşı ayaklandı! Bu kez ne müttefikleri var ne de kendilerini adayacakları bir Kara Ejderha.\n\n[peake.GetTitledFirstNamePossessive] zavallı isyanı bir angaryadan başka bir şey değil; pek zorluk çıkarmayacak. [peake.GetHerHis|U] talepleri mantıksız; Ashford ve başka toprakları, elimizde kalan azıcık güce bile güvenilmez olduğunu bir kez daha kanıtlayan bir hanedana teslim etmeyeceğim.\n\nGün bittiğinde ellerinde sadece Starpike kalacak!"

 agot_peake_uprising.0002.a:0 "Bu hainleri bizzat ezeceğim!"

 agot_peake_uprising.0003.t:0 "$agot_peake_uprising.0001.t$"

 agot_peake_uprising.0003.desc:0 "Ne tuhaf bir fırsat... [peake.GetFullName], ilk bakışta başarısızlığa mahkûm görünen bir isyanla kralın barışını bozdu.\n\n[maekar.GetTitledFirstNameRegnal], [maekar.GetHerHis] sancaklarından hiçbirini bile çağırmadı; yalnızca [maekar.GetSheHe] ve [egg.GetTitledFirstName]'in toplayabildiği adamlara güveniyor. Demir Taht benden yardım istemedi, ama yardımımı da reddetmeyecektir.\n\nNeticede, ejderha hanedanının gözüne girmenin zararı olmaz. Hele Casterly Kayası'nda sönükleşmiş, yaşlı ve ilgisiz bir [gerold.GetTitledFirstName] hüküm sürerken."

 agot_peake_uprising.0003.a:0 "Şafakta Starpike'a doğru yola çıkıyoruz!"

 agot_peake_uprising.0004.t:0 "$agot_peake_uprising.0001.t$"

 agot_peake_uprising.0004.desc:0 "Benim [ROOT.Char.Custom2('RelationToMeShort', maekar)]'im [maekar.GetTitledFirstNameRegnal], Dorne Sınır Beylikleri'nde [peake.GetTitledFirstName]'in beceriksiz isyanını ezmek için bir ordu topladı. Şimdilik House [peake.GetHouse.GetName] tek başına ayaklanmış görünüyor; ama her zaman Kara Ejderha'nın gölgesini izleyen ilk hanedan onlardı. [aenysclaimant.GetFirstName] [aenysclaimant.GetHouse.GetName] Dar Deniz'in öte yakasında kalsa da, bunun dördüncü bir isyanın başlangıcı olmadığından emin olmak için dikkatli olmalıyız.\n\nTahtın barışı ve düzeni yeniden tesis etmesine yardım etmek isteyen herkesle birlikte yola çıkacağım; umarım [peake.GetFirstNameNoTooltip] fazla direnişle karşılaşmadan yere serilir."

 agot_peake_uprising.0004.a:0 "Az kan dökülmesi için dua ediyorum."

 agot_peake_uprising.0005.t:0 "Starpike Kuşatması"

 agot_peake_uprising.0005.desc:0 "Kudretli kraliyet ordusu Starpike surlarının dışında toplandı. Bütün askerlerimiz kuşatma için yerleşti, ama üstteki duvarlarda yalnızca birkaç düzine adam var.\n\n[egg.GetTitledFirstName], her zamanki şefkatiyle kan dökülmesini engellemek istiyor; [peake.GetTitledFirstName]'in umudu tükenip [peake.GetHerHis] saflarında hoşnutsuzluk baş gösterene dek kuşatmayı sürdürmem için bana yalvardı. Öte yandan [reyne.GetTitledFirstName] şan kazanmaya hevesli görünüyor; birkaç düzine adamın direnmesini beklerken aylarca kuşatma altında kalmamak için kaleye hücum etmem konusunda bana baskı yapıyor.\n\nİki argümanın da haklı yanları var; ama hangisi daha inandırıcı?"

 agot_peake_uprising.0005.a:0 "Hücuma başlayın!"

 agot_peake_uprising.0005.b:0 "Zaman bizden yana; kuşatmayı sürdürün."

 agot_peake_uprising.0006.t:0 "$agot_peake_uprising.0005.t$"

 agot_peake_uprising.0006.desc:0 "Adamlarım Peake direnişinin son kalıntılarını bastırırken Starpike'ın büyük salonunda duruyoruz. [peake.GetSheHe] neyi başarmayı umduysa, [peake.GetTitledFirstName] tamamen başarısız oldu ve şimdi bedelini ödemeli.\n\nHouse Peake'in Starpike dışındaki tüm topraklarından edilmesine çoktan karar verilmişti; ama bu, bu aptal savaşı vermek zorunda kalmamızdan önceydi. Çok kan döküldü; ama [peake.GetFirstNameNoTooltip] kesinlikle bunun için ölmeli... İhanet Peake kanında akıyor gibi; [peake.GetFirstNamePossessiveNoTooltip] suçları yüzünden hepsini cezalandırmak çok mu fazla olur?\n\nŞimdi House [peake.GetHouse.GetName]'e ne olmalı?"

 agot_peake_uprising.0006.a:0 "Toprak kaybı yeterli, başka kimsenin ölmesine gerek yok."

 agot_peake_uprising.0006.b:0 "[peake.GetTitledFirstNameNoTooltip]'e ibret olacak!"

 agot_peake_uprising.0006.c:0 "House Peake'in bizi bir daha rahatsız etmesine izin verilmemeli!"

 agot_peake_uprising.0007.t:0 "$agot_peake_uprising.0005.t$"

 agot_peake_uprising.0007.desc:0 "Kralın orduları Starpike surlarına saldırıyor; ezici bir gücüz. Bir koçbaşı kapıları davul gibi dövüyor; zaferimizi müjdeleyen sabit bir ritim. Adamlar [lordpeake.GetFirstNamePossessive] surlarını savunmak için kalan #italic zavallı#! gruba üstün gelmek için düzinelerce kuşatma merdivenine tırmanıyor.\n\nSütunlardan birine bizzat öncülük ediyorum; kralın savaşın tehlikelerine doğru hücuma öncülük ettiğini görmek askerlerin moraline iyi gelir. Yeni kurulan kuşatma merdivenlerinden birini tutup telaşla tırmanmaya başlıyorum.\n\nYukarı bakıyorum ve iki askerin siperlerin kenarına kocaman bir kaya taşıdığını görüyorum; tüm güçleriyle itiyorlar. Aklımdan tek bir düşünce geçiyor. #italic Bir kralın ölme yolu bu olmamalı.#!"

 agot_peake_uprising.0007.a:0 "#difficulty_hard #italic Ahh!#!#!"

 agot_peake_uprising.0008.t:0 "$agot_peake_uprising.0005.t$"

 agot_peake_uprising.0008.desc:0 "Benim [ROOT.Char.Custom2('RelationToMeShort', maekar)]'im [maekar.GetTitledFirstNameRegnal] #bold öldü!#! Ve suç [peake.GetTitledFirstName]'te; bu [peake.GetHerHis] anlamsız isyanıydı! Aynı sayıda onyıl içindeki dördüncüsü.\n\nBabamın fermanlarıyla House Peake, yalnızca Starpike kalesi elinde kalacak şekilde topraklarından ve sancak beylerinden edilmişti. Artık en zayıf Sınır Beyleri lordlarından biriler. Ama bu, bir kralı öldürmelerinden önce kararlaştırılmıştı...\n\nWesteros'un en alçak hanedanı olan bu hanedan, suçlarının bedelini daha ne kadar ödemeli?"

 agot_peake_uprising.0008.a:0 "Yeterince kan döküldü."

 agot_peake_uprising.0008.b:0 "[peake.GetTitledFirstNameNoTooltip]'in başını isteyeceğim!"

 agot_peake_uprising.0008.c:0 "Dört kez, dört fazla! Soyları sona erecek!"

 agot_peake_uprising.0009.t:0 "Büyük Konsey"

 agot_peake_uprising.0009.desc:0 "[maekardead.GetNameRegnal] ölü yatıyor. Prens Aerion Brightflame'ın ölümünden sonra Maekar, yeni bir Dragonstone Prensi ve varis seçmemişti. Veraset üzerinde çatışmayı önlemek için yeni bir hükümdarı taçlandırmak üzere büyük bir konsey toplandı.\n\nBeş hak iddiası değerlendiriliyor: Prens [maegorclaimant.GetName]'in, Prenses [vaellaclaimant.GetName]'in ve amcaları [eggclaimant.GetTitledFirstName]'in hakları. Bunların ötesinde, Kara Ejderha'nın bir soyundan gelen sürgünde bir mektup yazıyor; zayıf bir ihtimal, [aenysclaimant.GetName] tahtı sözleriyle kazanmayı umuyor. Seçeneklerinden memnun olmayan bazı lordlar, tahtı [aemonclaimant.GetName]'e sunmayı umuyor; ama onun yeminlerini bir kenara bırakmaya razı olup olmadığı belirsiz...\n\nKonsey kimi seçer?"

 agot_peake_uprising.0009.d:0 "Vaella'nın sadece kısa bir naipliğe ihtiyacı olacak; o Kraliçe olacak!"

 agot_peake_uprising.0009.c:0 "Maegor hak olarak sıradaki; o olmalı!"

 agot_peake_uprising.0009.a:0 "Aegon hüküm sürecek kadar büyüdü; naiplerin boyunduruğu altında acı çekmemize gerek yok!"

 agot_peake_uprising.0009.b:0 "Belki Aemon yeminlerini bir kenara bırakmaya razıdır..."

 agot_peake_uprising.0009.e:0 "Kara Ejderha ikna edici bir noktaya değiniyor..."

 agot_peake_uprising.0010.t:0 "Ebedi Sadakat"

 agot_peake_uprising.0010.desc:0 "Artık haklı olarak Andalların, Rhoynarların ve İlk İnsanların Kralı ilan edildiğime göre, içinde bulunduğum durumun ağırlığını kavrıyorum. Blackfyre'ların davasını House [peake.GetHouse.GetName] kadar aralıksız destekleyen çok az hanedan var.\n\nYeni kazandığım güçle krallığı dilediğim gibi şekillendirebilirim; buna kendi destekçilerimi kayırmak da dahil... [peake.GetFullName] huzuruma getirildi; [peake.GetHerHis] hanedanının reisi ve krallık için parlak bir gelecek. House Peake sadakatleri için ödüllendirilmeli mi?"

 agot_peake_uprising.0010.a:0 "Sadakatlerini defalarca kanıtladılar..."

 agot_peake_uprising.0010.b:0 "Peake mi? Kimdi bunlar?"

 agot_peake_uprising.0011.t:0 "Starpike'a Hücum"

 agot_peake_uprising.0011.desc:0 "[maekar.GetTitledFirstNameRegnal]'in kraliyet ordusu ileri atılıyor, Starpike kapılarına hücum ediyor. Yoğun asker kalabalığına bakıyorum ve başında gururlu bir [maekar.GetHouse.GetName] sancağı görüyorum. Kral [maekar.GetHerselfHimself] hücuma öncülük ederken askerlerim görünürdeki her taşı üzerlerine fırlatıyor. Düşman ordusunu süzerken, kraliyet saflarından yükselen yüksek bir çığlık, ardından siperlerimin bir yerinden bir sevinç narası duyuyorum.\n\n"Kral öldü!" sözlerini savaş alanının dört bir yanında duyuyorum ve aşağı baktığımda [maekar.GetTitledFirstNameNoTooltip]'in ezilmiş bedeninin cepheden geri sürüklendiğini görüyorum; [maekar.GetHerHis] miğferi başıboş bir taşla ezilmiş.\n\nŞimdi kapılar düştü, Starpike onlarla birlikte alındı ve biz kralı öldürdük."

 agot_peake_uprising.0011.a:0 "Merhamet için dua edeceğiz..."

 agot_peake_uprising.0012.t:0 "$agot_peake_uprising.0011.t$"

 agot_peake_uprising.0012.desc:0 "[maekar.GetTitledFirstNameRegnal]'in kraliyet ordusu ileri atılıyor, Starpike kapılarına hücum ediyor. Yoğun asker kalabalığına bakıyorum ve başında gururlu bir [maekar.GetHouse.GetName] sancağı görüyorum. Kral [maekar.GetHerselfHimself] hücuma öncülük ederken askerlerim görünürdeki her taşı üzerlerine fırlatıyor. Ordu, kralın öncülüğünde kapılarımızı hızla yıkıyor. Bir sıçan sürüsü gibi savunmamızdaki gedikten içeri akıyor.\n\nKral Starpike'a girdi ve yorgun sancak beylerimi hızla alt ediyor. Kaybettik ve kral bizi [maekar.GetHerHis] avucunda tutacak."

 agot_peake_uprising.0012.a:0 "Merhamet için dua edeceğiz..."

 agot_peake_uprising.0013.t:0 "Ödüllendirilen Sadakat"

 agot_peake_uprising.0013.desc:0 "[aenys.GetNameNicknamed] kral olarak taçlandırıldı. [aenys.GetSheHe]'nin benim hanedanımın [aenys.GetHerHis]'e olan uzun sadakatini unutacağından korkmuştum; ama [aenys.GetSheHe] çoktan bunu ödüllendirmeye karar vermiş görünüyor. Bize yeni topraklar verilecek ve Sınır Beyleri lordları arasında yeniden güçlü kılınacağız.\n\nHouse Peake, kara ejderhanın gölgesinde refaha kavuşacak."

 agot_peake_uprising.0013.a:0 "Tanrılar iyidir."

 agot_peake_uprising.0014.t:0 "Fatih'in Silahı"

 agot_peake_uprising.0014.desc:0 "Babamın krallık hayalini gerçekleştirdiğime göre, rolüme uygun görünmeliyim. Taçlar var, bir taht var; şimdi fatihin kılıcına, Blackfyre'a ihtiyacım var. Benim [ROOT.Char.Custom2('RelationToMeShort', bittersteel )] [bittersteel.GetNameNicknamed], babama adını veren kılıçla birlikte Dar Deniz'in öte yakasında kalmaya devam ediyor.\n\nBelki [bittersteel.GetHerHim]'e ve akrabalarımın geri kalanına, Westeros'a dönmeleri ve bana Blackfyre'ı getirmeleri için haber salmalıyım."

 agot_peake_uprising.0014.a:0 "Derhal bir elçi gönder!"

 agot_peake_uprising.0014.b:0 "Bu çabaya değmez."

 agot_peake_uprising.0015.t:0 "$agot_peake_uprising.0014.t$"

 agot_peake_uprising.0015.desc:0 "Westeros'tan bir elçi geldi. Benim [ROOT.Char.Custom2('RelationToMeShort', aenys )] [aenys.GetNameNicknamedPossessive] kumarı tuttu ve [aenys.GetSheHe] şimdi Demir Taht'ta oturuyor. [aenys.GetSheHe] tahtı büyük bir konseyde kazanmış olsa da, tacı giyiyor. Bu kadar uzun süredir beslediğimiz hayal nihayet gerçek oldu ve Westeros'ta kara bir ejderha hüküm sürüyor. [aenys.GetSheHe|U] sürgünümün sona ermesi karşılığında Blackfyre'ı [aenys.GetHerHim]'e teslim etmek üzere memleketime dönmemi istiyor.\n\nBu yeni krala güvenmeli miyim?"

 agot_peake_uprising.0015.a:0 "Hırsım gerçekleşti."

 agot_peake_uprising.0015.a.tt:0 "Teklifi kabul edip Westeros'a dönüyorsun."

 agot_peake_uprising.0015.b:0 "Aenys bir kukladan başka bir şey değil."

 agot_peake_uprising.0015.b.tt:0 "Bu saçmalığı reddediyorsun."

 agot_peake_uprising.0016.t:0 "$agot_peake_uprising.0014.t$"

 agot_peake_uprising.0016.desc:0 "Bittersteel, Demir Taht'ın önüne adımlıyor ve iki eliyle önüme bir kılıç kaldırıyor. Kınından çıkarınca Valyria çeliği ortaya çıkıyor; duman kadar karanlık ve büyüyle dövüldüğü için dalga dalga. Atalarımın kılıcına sahip oldum ve kendimi babamın varisi olarak pekiştirdim. Amcam, bazı akrabalarımın kin güttükleri için Altın Bölük'te kaldığını bildiriyor; ama artık Kılıcı Taşıyan Kral ben olduğuma göre bunun pek önemi yok!"

 agot_peake_uprising.0016.a:0 "Kara Ejderha çağı başlıyor!"

 agot_peake_uprising.0017.t:0 "$agot_peake_uprising.0014.t$"

 agot_peake_uprising.0017.desc:0 "Amcam Bittersteel adının hakkını yine verdi. Elçimi bana geri gönderdi; Westeros'a dönmeyeceğini, hak olarak bana ait olan kılıcı da bana vermeyeceğini bildiriyor. Bana Blackfyre'ı inkar edecek ve böylece oturduğum tahtta babamın hak iddiasına dair hakkımı da inkar etmiş olacak. Her halükarda, kılıç şimdilik uzağımda ve akrabalarım da onunla birlikte."

 agot_peake_uprising.0017.a:0 "Yazık..."

 royal_host:0 "Kraliyet Ordusu"
