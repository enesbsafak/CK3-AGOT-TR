l_english:

 silent_sister_title_localization:0 "Sessiz Kız Kardeş"

 silent_sister_title_holder:0 "[CHARACTER.Custom('SilentSisterCheck')]"

 SilentSisterTitle:0 "Sessiz Kız Kardeş"

 SilentMotherTitle:0 "Sessiz Ana"

 agot_silent_sisters.sent_to_silent_sisters:0 "[sister_candidate.GetFirstNameOrMe|U], Sessiz Kız Kardeşlik'e katılmak üzere gönderilecek."

 agot_silent_sisters.0003.t:0 "Sessiz Bir Çocuk mu?"

 agot_silent_sisters.0003.desc.volunteering:0 "[sister_candidate.GetName] hiçbir zaman zor ya da özellikle gürültücü bir çocuk olmadı. Bu yüzden, çalışma odamın kapısındaki sessiz tıkırtıyı duyduğumda irkiliyorum. Kapı aralığından yüzü beliriyor; ağır adımlarla içeri giriyor. "Ben....bir ricam var." diyor alçak bir sesle, elleriyle oynayarak. Konuşmaya pek yanaşmayan biri için bu bir sürpriz. "Nedir evladım?" diye soruyorum, onu usulca yüreklendirerek.\n\n"Sessiz Kız Kardeşler'e katılmak istiyorum." diyor; karakterine yakışmayan bir kararlılıkla gözlerimin içine bakarak. "Yeminleri etmek ve hayatımı Yediler'e sessiz bir hizmete adamak istiyorum". Bu istek karşısında afallıyorum. Sessiz Kız Kardeşlik mi? [sister_candidate.GetFirstName] için, kendi kızım mı? Belki asil bir dava, ama bu kadar aşırı yaşamak...istediği bu olsa bile, onun için istediğim hayat bu mu?"

 agot_silent_sisters.0003.desc.suggesting:0 "[sister_candidate.GetName] hiçbir zaman zor ya da özellikle gürültücü bir çocuk olmadı; bugün de bu açıkça sergilendi. Görünüşe göre bugün tapınakta dua ederken, ahırdan boşanan bir at dörtnala içeri girmiş! Konuşmaktan korktuğundan mı yoksa saf dindarlıktan mı bilinmez, [sister_candidate.GetFirstName] hiç tepki vermeyen tek kişiydi!\n\nNe kadar... farklı bir çocuk. Soyluların hayatının onun için gerçekten en iyisi olup olmadığını merak ediyorum. Sarayı ağırlayabilecek, bir haneyi düzenli tutabilecek, çocuk yetiştirebilecek mi? Bu düşünce beni şaşırtsa da, belki de Sessiz Kız Kardeşlik'e katılması gerektiğini merak ediyorum? Kusursuz bir aday gibi görünüyor ve belki orada daha iyi bir hayat sürer. Yine de, kendi kızımı gönderebilir miyim? Onlar öyle aşırı bir hayat yaşıyorlar ki...onun için istediğim hayat bu mu?"

 agot_silent_sisters.0003.a:0 "Evet, Kız Kardeşlik [sister_candidate.GetFirstName]'e iyi gelecek."

 agot_silent_sisters.0003.b:0 "Saçmalık, çocuklarımdan hiçbiri Yabancı ile evlenmeyecek!"

 agot_silent_sisters.0004.t:0 "Dullar İçin Bir Sığınak"

 agot_silent_sisters.0004.desc:0 "Odamın sessizliğinde, titrek mum ışığının yanında oturuyor; önümde uzanan yolu düşünüyorum. Kocam, artık yok. Kale bomboş hissediyor; taş duvarları her zamankinden daha soğuk; içimdeki boşluğu yankılıyor.\n\nSaraydaki kadınlar arasında fısıltılar duydum; belki de Sessiz Kız Kardeşler arasında bir yaşamı düşünmenin zamanının geldiğine dair üstü kapalı öneriler. Ölüm tanrısı Yabancı'nın hizmetine yemin etmek. Sonsuza dek griye bürünmüş, gözlerim dışında yüzü peçeli; sessizlik ve iffet yemini ederek hayatımı ölüleri ahirete hazırlamaya adayacaktım.\n\nVerasetim güvence altında ve belki görevim tamamlandı? Siyasetin günlük telaşından böylesine uzaklaşmanın çekiciliğini inkâr edemem. Yine de, gerçekten tüm dünyevi bağlarından vazgeçip sessizliği kucaklayabilir miyim?"

 agot_silent_sisters.0004.a:0 "Niyetimi bildiren bir mektup [silent_sisterhood_holder.GetTitledFirstName]'e yazacağım."

 agot_silent_sisters.0004.b:0 "Hayır, bunu geride bırakacağım."

 agot_silent_sisters.0005.t:0 "Yabancı'nın Karısına Göz Dikmek"

 agot_silent_sisters.0005.desc:0 "[dead_relative.GetFirstName]'in cenazesinden önce ortalıkta dolaşıyordum; hizmetkârların, cenaze için hazırlanmak üzere tapınağa bir tabut taşıdığını gördüm. Arkasından, dua ederek başları öne eğik yürüyen küçük bir Sessiz Kız Kardeş grubu geliyordu. İçlerinden birinin yürüyüşündeki bir şey...gözümü son derece kutsallıktan uzak bir biçimde çekti. Bilinçli bir seçim yapmadan, kendimi onları izleyerek içeri girerken buldum.\n\n[dead_relative.GetFirstNamePossessive] bedenini taş levhaya yatırıp o ürkütücü işlerine başladıklarında, dalgınlığımdan sıçrayarak uyanıyorum; benim kanımdan olanın kanının masa üzerinde akması, her insanı bu tür düşüncelerden çekecek kadar fazla. Yine de, tam o anda, cesedin ötesinden gözleri gözlerime kilitleniyor. Bu...aynı kıvılcım mı? İmkânsız olsa da eminim. O #S ilgi duyuyor#!!\n\nDaha bir şey yapamadan, daha dikkatli ve açık ara daha az çekici olan kız kardeşlerden biri beni bir dizi jestle dışarı çıkarıyor. Utanç olsun ki, cenazenin geri kalanında onu aklımdan çıkaramıyorum. Yarın gidecekler...yine de, nerede kaldığını biliyorum...cesaret edebilir miyim?"

 agot_silent_sisters.0005.a:0 "Oh evet, cesaret ediyorum. Kesinlikle cesaret ediyorum."

 agot_silent_sisters.0005.a.flavor:0 "[attractive_silent_sister.GetFirstNamePossessive] odasını, o ayrılmadan önce ziyaret edeceksin..."

 agot_silent_sisters.0005.b:0 "Yediler'i asla böyle lekeleyemem!"

 agot_silent_sisters.0005.b.flavor:0 "Biraz düşününce, Yabancı'ya boynuz takmak kötü bir fikir gibi görünüyor."

 agot_silent_sisters.0006.t:0 "Hazzı Sökmek"

 agot_silent_sisters.0006.desc:0 "Adının, sonradan öğrendiğim üzere, [attractive_silent_sister.GetFirstName] olduğu bu kadın kapıyı çabucak açtı; tek bir sözcük bile edilmeden kendimi odada, ardından yatağında, ardından kucağında buldum. Vücudunu saran bezlerden soyduktan sonra, Yabancı'nın ne kadar şanslı bir adam olduğunu düşünürken buldum kendimi. Besbelli o ise böyle düşünmüyordu ve yaşadığımız sessiz cinsel haz, kutsallıktan son derece uzaktı.\n\nSon bir sessiz nefesle bitirdiğimizde, gördüğüm en açık kadının yanında uzanıyordum. Konuştuk; sesi kulağıma tatlı geliyordu ve bu kadar uzun süre sessizlik yemini etmiş biri için söyleyeceği çok şey olduğu belliydi. Bunun getirdiği haz inkâr edilemez olsa da, bu en üst dereceden bir saygısızlıktır. Peki, şimdi ne yapmalıyım?"

 agot_silent_sisters.0006.a:0 "Birlikte olmak için yaratılmışız! Her nasılsa..."

 agot_silent_sisters.0006.b:0 "Sonuçta, bu sırrı kiminle paylaşmak daha iyi olur?"

 agot_silent_sisters.0006.c:0 "Bu besbelli bir hataydı."

 agot_silent_sisters.0006.c.flavor:0 "[attractive_silent_sister.GetFirstName], senin için yeminini bozduktan sonra mutlu olmayacak."

 agot_silent_sisters.0007.t:0 "Gerçekten Karanlık Bir Kız Kardeş"

 agot_silent_sisters.0007.desc.deviant:0 "[dead_relative.GetNamePossessive]'i ve [dead_relative.GetHerHis] tüm işlerini anan güzel bir ayin oldu. Yaşam ve ölümün anlamına dair düşüncelere dalmışken, ayin çoktan bittikten uzun süre sonra kendimi tapınakta buluyorum. Öyle bir durgunluk sunmuş olmalıyım ki Sessiz Kız Kardeş [defiler.GetFirstName], cesede doğru adım atarken varlığımdan haberdar olmadı.\n\nİlk başta bedenin son hazırlıklarını yaptığını sanıyorum; ama soyunmaya başladığında anlıyorum ki...oh...oh Tanrılar!"

 agot_silent_sisters.0007.desc.cannibal:0 "[dead_relative.GetNamePossessive]'i ve [dead_relative.GetHerHis] tüm işlerini anan güzel bir ayin oldu. Yaşam ve ölümün anlamına dair düşüncelere dalmışken, ayin çoktan bittikten uzun süre sonra kendimi tapınakta buluyorum. Öyle bir durgunluk sunmuş olmalıyım ki Sessiz Kız Kardeş [defiler.GetFirstName], cesede doğru adım atarken varlığımdan haberdar olmadı.\n\nİlk başta bedenin son hazırlıklarını yaptığını sanıyorum; ama bunun yerine eğilip [dead_relative.GetFirstNamePossessiveNoTooltip]'in taze cesedinden kanlı bir ısırık alıyor!"

 agot_silent_sisters.0007.a:0 ""Muhafızlar! Bu iğrenç kadını tutuklayın!""

 agot_silent_sisters.0007.b:0 "Belki bu bilgiyi kullanabilirim..."

 agot_silent_sisters.0007.c:0 "Aslında, bu oldukça eğlenceli görünüyor!"

 agot_silent_sisters.0007.d:0 ""Önce ben, önce ben!""
