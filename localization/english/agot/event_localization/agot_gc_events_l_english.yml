l_english:

 agot_gold_company_formation.0001.t:0 "Altın Şirket"

 agot_gold_company_formation.0001.desc:0 "[disgruntled_merc.GetName] yanıma yaklaşıyor, [disgruntled_merc.GetHerHis] yüzünde öfke, [disgruntled_merc.GetHerHis] eli [disgruntled_merc.GetHerHis] kılıcının kabzasında sımsıkı.\n\n"[ROOT.GetCharacter.GetName], bu şirketi son kez hayal kırıklığına uğrattın. Hizmetinden ayrılıyor ve kendi şirketimi kuruyorum; erkeklerin saygı duymayı öğreneceği bir şirket. "

 agot_gold_company_formation.0001.desc_flavor_base:0 "Ayrıca, artık senin budala yönetiminden kurtulduğuma göre, odağım günün birinde geri almaya dönüyor"

 agot_gold_company_formation.0001.desc_self_claim:0 "$agot_gold_company_formation.0001.desc_flavor_base$ #Bold kaybettiğim unvanlar#! — [ROOT.Char.GetPrimaryTitle.GetName] altında imkânsız olacak bir başarı""

 agot_gold_company_formation.0001.desc_family_claim:0 "$agot_gold_company_formation.0001.desc_flavor_base$ #Bold ailemin kaybettiği unvanlar#! — [ROOT.GetCharacter.GetPrimaryTitle.GetName] altında imkânsız olacak bir başarı.""

 agot_gold_company_formation.0001.desc_blackfyre_loyalist:0 "$agot_gold_company_formation.0001.desc_flavor_base$ #Bold Kara Ejderha'nın kaybettiği unvanlar#! — [ROOT.GetCharacter.GetPrimaryTitle.GetName] altında imkânsız olacak bir başarı.""

 agot_gold_company_formation.0001.a:0 "Hain!"

 agot_gold_company_formation.0001.b:0 "$BULLET$[GetTrait('varangian').GetName( GetNullCharacter )] [GetCourtPositionType('bodyguard_court_position').GetName()]sı [Concept( 'aptitude', 'Yatkınlığını' )|E] arttırır ([aptitude|E] seviyesine bağlıdır)\n$BULLET$Şartları sağlayan [Concept( 'courtiers', 'Saray Mensuplarından' )|E] [GetTrait('varangian').GetName( GetNullCharacter )] ve [GetTrait('loyal').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliklerini' )|E] kazananların sayısı artar\n$BULLET$Daha çok Vareg Muhafızı belirir\n@warning_icon! #X Basileus'un ölümünden sonra Vareg Muhafızları bir miktar [gold_i] altın talep eder.#!"

 agot_gold_company_formation.0002.t:0 "Altın Şirket"

 agot_gold_company_formation.0002.desc:0 "#italic "Our word is good as gold."#!\n\nWith armored horsemen, ferocious crossbowmen, towering catapults, and more, a new sellsword company has emerged: the Golden Company.\n\nThe Golden Company has pledged its support to any who can afford them. But unlike other sellswords, their true allegiance is to the Black Dragon, House Blackfyre.\n\nThey will not stop until the Black Dragon is crowned."

 agot_gold_company_formation.0002.a:0 "Bu Westeros için ne anlama geliyor?"

 agot_gold_company_formation.0002.b:0 "Neler başaracaklarını merak ediyorum..."
