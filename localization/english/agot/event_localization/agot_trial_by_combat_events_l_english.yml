l_english:

 agot_trial_by_combat.0000.t:0 "Muharebe Yargılaması"

 agot_trial_by_combat.0001.opening:0 "[recipient.Custom2('AppropriateGreeting',actor)]"

 agot_trial_by_combat.0001.desc:0 "Suçların için yargılama olmayacak; burada çürüyüp öleceksin."

 agot_trial_by_combat.0001.a:0 "Şu [recipient.Custom('InsultAdjective')] [recipient.Custom('InsultNoun')]!"

 agot_trial_by_combat.0002.trigger_failure.actor:0 ""Muharebe yargılamam geçersiz kılındı""

 agot_trial_by_combat.0002.trigger_failure.recipient:0 "[actor.GetFirstNameNoTooltip]'in muharebe yargılaması geçersiz kılındı"

 agot_trial_by_combat.1000.t:0 "$agot_trial_by_combat.0000.t$: Bir Şampiyon Seçmek"

 agot_trial_by_combat.1000.desc:0 "[actor.GetTitledFirstNamePossessive] muharebe yargılaması talebini kabul ettim.\n\nGelenek, benim adıma savaşacak bir şampiyon seçmemi gerektiriyor; ama kimi seçmeli?"

 agot_trial_by_combat.1000.bout_moves_forward:0 "Dövüş ilerliyor..."

 agot_trial_by_combat.1000.a:0 "...en bariz seçimdir."

 agot_trial_by_combat.1000.a.tt:0 "Seçtiğin şampiyon senin için savaşacak"

 agot_trial_by_combat.1000.b:0 "Şampiyonum olması için bir paralı asker tutacağım."

 agot_trial_by_combat.1000.b.tt:0 "Senin için savaşması karşılığında yerel bir paralı askere para ödenecek"

 agot_trial_by_combat.1000.c:0 "Kendi şampiyonum olarak savaşacağım."

 agot_trial_by_combat.1000.c_silly_jae:0 "BU İHTİYAR!"

 agot_trial_by_combat.1000.c.tt:0 "Muharebe yargılamasında kendin şampiyon olacaksın."

 agot_trial_by_combat.1000.d:0 "Ateş şampiyonum olacak"

 agot_trial_by_combat.1000.d.targ:0 "Ateş, Targaryen Hanedanı'nın şampiyonudur!"

 agot_trial_by_combat.1000.d.tt:0 "[actor.GetTitledFirstName] ve [actor.GetHerHis] şampiyonu, ikisi de yanacak."

 agot_trial_by_combat.1000.e:0 "[dragon.GetFirstName] şampiyonum olacak!"

 agot_trial_by_combat.1000.e.targ:0 "Ejderha, Targaryen Hanedanı'nın şampiyonudur!"

 agot_trial_by_combat.1000.e.tt:0 "[actor.GetTitledFirstName] ve [actor.GetHerHis] şampiyonu, [dragon.GetName] tarafından ikisi de canlı canlı yakılacak."

 agot_trial_by_combat.1001.desc:0 "Özgürlüğümü kazanmak için önce bu muharebe yargılamasını kazanmalıyım.\n\nBenim adıma savaşacak bir şampiyon seçebilirim; ama kimi seçmeli?"

 agot_trial_by_combat.2000.t:0 "$agot_trial_by_combat.0000.t$: [duel_location.GetBaseNameNoTierNoTooltip]"

 agot_trial_by_combat.2000.desc.intro:0 "Zincirlere vurulmuş halde, tam vaktinde [duel_location.GetBaseNameNoTier] yakınlarındaki belirlenmiş yere getiriliyorum ve [recipient.GetTitledFirstName]'in, küçük bir tanık maiyetiyle birlikte beni çoktan beklemekte olduğunu buluyorum."

 agot_trial_by_combat.2000.desc.recipient_fighting:0 "[recipient.GetSheHe|U] bana, bu yargılamada bizzat savaşmayı seçtiğini bildiriyor."

 agot_trial_by_combat.2000.desc.recipient_has_champion:0 "[recipient.GetSheHe|U], [recipient_champion.GetFirstNameNoTooltip]'i [recipient.GetHerHis] şampiyonu olarak seçti."

 agot_trial_by_combat.2000.desc.actor_fighting:0 "Kendi adıma savaşacağım için, zincirlerim çözülüyor ve bana bir silah ile zırh veriliyor."

 agot_trial_by_combat.2000.desc.actor_has_champion:0 "Şampiyonum [actor_champion.GetFirstNameNoTooltip] çoktan vardı; zırhını kuşanmış ve hazır."

 agot_trial_by_combat.2000.desc.outro:0 "\n\nFormaliteler kısa sürüyor. Neden burada olduğumuzu hepimiz biliyoruz ve konuşma noktasının çoktan ötesindeyiz."

 agot_trial_by_combat.2000.a:0 "En iyi [actor_champion.GetWomanMan] kazansın."

 agot_trial_by_combat.2000.a.tt:0 "Muharebe yargılaması başlıyor!"

 agot_trial_by_combat.2001.t:0 "$agot_trial_by_combat.0000.t$: [duel_location.GetBaseNameNoTierNoTooltip]"

 agot_trial_by_combat.2001.desc.intro:0 "[actor.GetTitledFirstName]'i, [actor.GetHerHis] yargılaması için [duel_location.GetBaseNameNoTier] yakınlarındaki savaş alanına zincirlere vurulmuş halde getirttim."

 agot_trial_by_combat.2001.desc.actor_fighting:0 "[actor.GetSheHe|U] bu yargılamada bizzat savaşmayı seçti; bu yüzden bir şampiyon beklemeye gerek yok."

 agot_trial_by_combat.2001.desc.actor_has_champion:0 "[actor.GetHerHis|U] seçtiği şampiyon [actor_champion.GetTitledFirstName], kısa sürede varır."

 agot_trial_by_combat.2001.desc.recipient_fighting:0 "[actor.GetTitledFirstNamePossessive] suçluluğunu bizzat kanıtlama fırsatını sabırsızlıkla bekliyorum."

 agot_trial_by_combat.2001.desc.recipient_has_champion:0 "[recipient.GetTitledFirstName] yanımda duruyor; [actor.GetTitledFirstNamePossessive] suçluluğunu kanıtlayabilmek için düellonun başlamasını bekliyor."

 agot_trial_by_combat.2001.desc.outro:0 "\n\nFormaliteler kısa sürüyor. Neden burada olduğumuzu hepimiz biliyoruz ve konuşma noktasının çoktan ötesindeyiz."

 agot_trial_by_combat.2001.a:0 "En iyi [recipient_champion.GetWomanMan] kazansın."

 agot_trial_by_combat.2001.a.tt:0 "Muharebe yargılaması başlıyor!"

 agot_trial_by_combat.3001.t:0 "$agot_trial_by_combat.0000.t$: Zafer!"

 agot_trial_by_combat.3001.desc.intro:0 "[actor.GetFaith.PantheonTerm|U] dün bana cömertçe gülümsedi!"

 agot_trial_by_combat.3001.desc.both_fighting:0 "Silahımı indirdiğimde [recipient.GetName] düşüyor. Soluk soluğa dururken, kazandığımı fark ediyorum! Tanrılar beni esirgedi ve her zaman haklı olduğumu gösterdi!"

 agot_trial_by_combat.3001.desc.actor_own_champion:0 "Silahımı indirdiğimde [recipient_champion.GetName] düşüyor. Bir an soluk soluğa duruyorum; sonra başımı kaldırıp ayrılmadan önce [recipient.GetName]'e sırıtıyorum."

 agot_trial_by_combat.3001.desc.recipient_own_champion:0 "[actor_champion.GetName], [recipient.GetName]'i öldürürken İnsanların ve Tanrıların gözünde aklanmış olarak duruyorum!"

 agot_trial_by_combat.3001.desc.both_champion:0 "[actor_champion.GetName], [recipient_champion.GetName]'i öldürürken İnsanların ve Tanrıların gözünde aklanmış olarak duruyorum! Ve ayrılırken [recipient.GetName]'e sırıtıyorum."

 agot_trial_by_combat.3001.desc.outro:0 "\n\nDün, aramızdaki anlaşmazlığı [actor.GetFaith.PantheonTerm]'in önüne koyduk ve [actor.GetFaith.PantheonTerm] akıllıca yanıt verdi."

 agot_trial_by_combat.3001.a:0 "Adalet yerini buldu."

 agot_trial_by_combat.3002.t:0 "$agot_trial_by_combat.0000.t$: Yenilgi!"

 agot_trial_by_combat.3002.desc.intro:0 "[recipient.GetFaith.PantheonTerm|U] dün bana gülümsemedi."

 agot_trial_by_combat.3002.desc.actor_own_champion:0 "Aşağılık [actor.GetName], [recipient_champion.GetName]'i biçip geçerken iç geçiriyorum. Tanrılar beni neden terk etti? Aşağı baktığımda, [actor.GetNameNoTooltip] bana kocaman sırıtıyor ve ayrılmadan önce alaycı bir selam veriyor."

 agot_trial_by_combat.3002.desc.both_champion:0 "Aşağılık [actor.GetName]'in şampiyonu [actor_champion.GetName], [recipient_champion.GetName]'i biçip geçerken iç geçiriyorum. Tanrılar beni neden terk etti? \n\n[actor.GetName]'e baktığımda, [actor.GetSheHe] sırıtıyor ve ayrılmadan önce alaycı bir selam veriyor. "

 agot_trial_by_combat.3002.desc.outro:0 "\n\nDün, aramızdaki anlaşmazlığı [actor.GetFaith.PantheonTerm]'in önüne koyduk ve Tanrılar aleyhime saf tuttu. Hanedanım onların öfkesini kazanmak için ne yaptı?"

 agot_trial_by_combat.3002.a:0 "Hah, burada adalet yoktu."

 agot_trial_by_combat.3003.t:0 "$agot_trial_by_combat.0000.t$: Zafer!"

 agot_trial_by_combat.3003.desc.intro:0 "[recipient.GetFaith.PantheonTerm|U] dün bana cömertçe gülümsedi!"

 agot_trial_by_combat.3003.desc.both_fighting:0 "Silahımı indirdiğimde [actor.GetName] düşüyor. Soluk soluğa dururken, kazandığımı fark ediyorum! Tanrılar beni esirgedi ve her zaman haklı olduğumu gösterdi!"

 agot_trial_by_combat.3003.desc.actor_own_champion:0 "[recipient_champion.GetName], [actor.GetName]'i öldürürken İnsanların ve Tanrıların gözünde aklanmış olarak duruyorum!"

 agot_trial_by_combat.3003.desc.recipient_own_champion:0 "Silahımı indirdiğimde [actor_champion.GetName] düşüyor. Bir an soluk soluğa duruyorum; sonra başımı kaldırıp ayrılmadan önce [actor.GetName]'e sırıtıyorum."

 agot_trial_by_combat.3003.desc.both_champion:0 "[recipient_champion.GetName], [actor_champion.GetName]'i öldürürken İnsanların ve Tanrıların gözünde aklanmış olarak duruyorum! Ve ayrılırken [actor.GetName]'e sırıtıyorum."

 agot_trial_by_combat.3003.desc.outro:0 "\n\nDün, aramızdaki anlaşmazlığı [actor.GetFaith.PantheonTerm]'in önüne koyduk ve [actor.GetFaith.PantheonTerm] akıllıca yanıt verdi."

 agot_trial_by_combat.3003.a:0 "Adalet yerini buldu."

 agot_trial_by_combat.3004.t:0 "$agot_trial_by_combat.0000.t$: Yenilgi!"

 agot_trial_by_combat.3004.desc.intro:0 "Nasıl bu noktaya geldim? #EMP adalet#! aramak için [actor.GetFaith.PantheonTerm]'in huzuruna çıktım!"

 agot_trial_by_combat.3004.desc.recipient_own_champion:0 "[recipient.GetSheHe], benim şampiyonum [actor_champion.GetName] düşerken son darbesini indirirken, lanet olası [recipient.GetName] boylu boyunca dikilip bana doğru sırıtıyor. "

 agot_trial_by_combat.3004.desc.both_champion:0 "[recipient_champion.GetName], benim şampiyonum [actor_champion.GetName] düşerken son darbesini indirirken, lanet olası [recipient.GetName] boylu boyunca dikilip bana sırıtıyor."

 agot_trial_by_combat.3004.desc.outro:0 "\n\nArtık tüm dünya, meselelerimizin çözüldüğünü ve adaletin yerini bulduğunu kabul ediyor."

 agot_trial_by_combat.3004.a:0 "Hah, burada adalet yoktu."

 agot_trial_by_combat.9000.t:0 "Muharebe Yargılaması"

 agot_trial_by_combat.9000.desc:0 "Hapishaneden zincirlere vurulmuş halde, muharebe yargılamamın yapılacağı yere götürülüyorum. Ancak bir savaş alanı yerine, iki odun yığını buluyorum; biri, şampiyonum [actor_champion.GetTitledFirstName]'in çoktan bağlandığı yığın.\n\n\"Bugün şampiyonum olarak ateşi seçtim,\" diye çılgınca kıkırdıyor [recipient.GetTitledFirstName]."

 agot_trial_by_combat.9000.desc.self_champion:0 "Hapishaneden zincirlere vurulmuş halde, muharebe yargılamamın yapılacağı yere götürülüyorum. Ancak bir savaş alanı yerine, hazır bir odun yığını buluyorum ve muhafızlar beni ona doğru sürüklemeye başlıyor.\n\n\"Bugün şampiyonum olarak ateşi seçtim,\" diye çılgınca kıkırdıyor [recipient.GetTitledFirstName]."

 agot_trial_by_combat.9000.a:0 "Ah."

 agot_trial_by_combat.9001.t:0 "Muharebe Yargılaması"

 agot_trial_by_combat.9001.desc:0 "[actor_champion.GetTitledFirstName] vardığında hazırım. Muhafızlarıma [actor_champion.GetHerHim]'i yakalatıp hazırladığım iki odun yığınından birine bağlatıyorum ve ardından [actor.GetTitledFirstName]'i çağırıyorum.\n\n[actor.GetSheHe] durumu fark ettiğinde [actor.GetHerHis] yüzündeki ifade muhteşem.\n\n\"Bugün şampiyonum olarak ateşi seçtim,\" diyorum. \"Şimdi başlayalım.\""

 agot_trial_by_combat.9001.desc.self_champion:0 "Odun yığını hazır olur olmaz, [actor.GetTitledFirstName]'i çağırıyorum.\n\n[actor.GetSheHe] durumu fark ettiğinde [actor.GetHerHis] yüzündeki ifade muhteşem.\n\n\"Bugün şampiyonum olarak ateşi seçtim,\" diyorum. \"Şimdi başlayalım.\""

 agot_trial_by_combat.9001.a:0 "Çok güzel."

 agot_trial_by_combat.9001.tt:0 "[actor.GetTitledFirstName] ve [actor.GetHerHis] şampiyonu [actor_champion.GetTitledFirstName], ikisi de ölüyor."

 agot_trial_by_combat.9001.tt.self_champion:0 "[actor.GetTitledFirstName] ölüyor."

 agot_trial_by_combat.9100.t:0 "Muharebe Yargılaması"

 agot_trial_by_combat.9100.desc:0 "Hapishaneden zincirlere vurulmuş halde, muharebe yargılamamın yapılacağı yere götürülüyorum. Ancak bir savaş alanı yerine, [recipient.GetTitledFirstName]'in yanında duran [dragon.GetName]'i buluyorum!\n\n\"Bugün şampiyonum olarak [dragon.GetFirstNameNoTooltip]'i seçtim,\" diyor [recipient.GetTitledFirstNameNoTooltip] buruk bir gülümsemeyle; [actor_champion.GetFirstName], bir ejderhayla kafa kafaya yüzleşme ihtimali karşısında dehşete kapılmış görünüyor."

 agot_trial_by_combat.9100.desc.self_champion:0 "Hapishaneden zincirlere vurulmuş halde, muharebe yargılamamın yapılacağı yere götürülüyorum. Ancak bir savaş alanı yerine, [recipient.GetTitledFirstName]'in yanında duran [dragon.GetName]'i buluyorum!\n\n\"Bugün şampiyonum olarak [dragon.GetFirstNameNoTooltip]'i seçtim,\" diyor [recipient.GetTitledFirstNameNoTooltip] buruk bir gülümsemeyle ve bir ejderhayla kafa kafaya yüzleşeceğimi fark ettiğimde kalbimi dehşet sarmalıyor."

 agot_trial_by_combat.9100.a:0 "Ah."

 agot_trial_by_combat.9101.t:0 "Muharebe Yargılaması"

 agot_trial_by_combat.9101.desc:0 "[dragon.GetFirstName] hafifçe tıslıyor; av kokusu yayılırken havayı yokluyor. [actor_champion.GetTitledFirstName] vardığında, [actor_champion.GetSheHe]'in yaptığı yüz her şeyi anlatıyor. İkisinin gözünden de umut uçuyor; geriye yalnızca hor görme ve umutsuzluk kalıyor.\n\n\"Bugün şampiyonum olarak [dragon.GetFirstNameNoTooltip]'i seçtim,\" diyorum; zaten açık olanı dile getirerek. \"Şimdi başlayalım.\""

 agot_trial_by_combat.9101.desc.self_champion:0 "[dragon.GetFirstName] hafifçe tıslıyor; av kokusu yayılırken havayı yokluyor. [actor.GetTitledFirstName] vardığında, [actor.GetSheHe]'in yaptığı yüz her şeyi anlatıyor. [actor.GetHerHis] gözlerinden umut uçuyor; geriye yalnızca hor görme ve umutsuzluk kalıyor.\n\n\"Bugün şampiyonum olarak [dragon.GetFirstNameNoTooltip]'i seçtim,\" diyorum; zaten açık olanı dile getirerek. \"Şimdi başlayalım.\""

 agot_trial_by_combat.9101.a:0 "Sonuç belliydi, ama gösteri güzeldi."

 agot_trial_by_combat.9101.tt:0 "[actor.GetTitledFirstName] ve [actor.GetHerHis] şampiyonu [actor_champion.GetTitledFirstName], [dragon.GetName] tarafından ikisi de canlı canlı yakılıyor."

 agot_trial_by_combat.9101.tt.self_champion:0 "[actor.GetTitledFirstName], [dragon.GetName] tarafından canlı canlı yakılıyor."

