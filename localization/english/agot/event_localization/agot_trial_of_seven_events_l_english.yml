l_english:

 agot_trial_of_seven.0100.t:0 "Diyarın Önünde Bir Talep"

 agot_trial_of_seven.0100.desc:0 "Taç başıma daha yeni oturmuştu ki suçlama yüksek sesle dile getirildi. [accuser_leader.GetTitledFirstName], yönetimimi gasp olarak nitelendiriyor ve krallığın benim tarafımdan alındığını öne sürerek bunun için hüküm talep ediyor.\n\nTalep yeterince açık. Bir Yediler Yargılaması. Yedi şampiyona karşı yedi; benim davam [accuser_leader.GetHersHis] ile karşı karşıya, yönetimimin kaderi sonuca bağlı. Reddetmek birçok gözde itiraf olarak yorumlanır. Kabul etmek ise diyarın kendisini alana sürmektir."

 agot_trial_of_seven.0100.desc.helper:0 "Taç başıma daha yeni oturmuştu ki suçlama yüksek sesle dile getirildi. [accuser_leader.GetTitledFirstName], yönetimimi gasp olarak nitelendirmek için öne çıkıyor ve iddiasının çalındığını ilan ettikleri [true_heir.GetTitledFirstName] adına bir Yediler Yargılaması talep ediyor.\n\nTalep yeterince açık. Yedi şampiyona karşı yedi; benim davam, onların üstlendiği davayla karşı karşıya, yönetimimin kaderi sonuca bağlı. Reddetmek birçok gözde korku olarak yorumlanır. Kabul etmek ise diyarın kendisini alana sürmektir."

 agot_trial_of_seven.0100.desc.accuser:0 "Taç, [defender_leader.GetTitledFirstNamePossessive] alnında huzursuz duruyor ve diyarın başka türlü davranmasına izin vermeyeceğim. Lordların ve halkın gözü önünde bu yönetimin ne olduğunu, bir gasp olduğunu ilan ediyor ve tanrıların ve insanların gözleri önünde hüküm talep ediyorum.\n\nBir Yediler Yargılaması. Benim ve savunduğum iddianın yanında durmak için yedi şampiyon, tahtta oturan için yedi şampiyon. Yalnızca sözlerin çözemeyeceğini, çelik ve inanç karar versin. [defender_leader.GetSheHe] reddederse diyar, o sessizliğin ne anlama geldiğini bilecek."

 agot_trial_of_seven.0100.a:0 "Tanrılar [accuser_leader.GetSheHe]'in haklı mı haksız mı olduğuna karar versin."

 agot_trial_of_seven.0100.a.accuser:0 "Yediler tanıklık etsin."

 agot_trial_of_seven.0101.t:0 "Yargıya Giden Yol"

 agot_trial_of_seven.0101.desc:0 "[crown_thief.GetTitledFirstName]'i gasp için hesap vermeye çağırmanın bir yolu var. Bir Yediler Yargılaması talep edip suçlamayı açığa çıkarabilirim; tanrıların ve diyarın gözü önünde, taht üzerindeki meşru iddia [crown_theft_king_legit_heir.GetTitledFirstNamePossessive] için savaşabilirim."

 agot_trial_of_seven.0101.desc.legit_heir:0 "Belki de olanı kabul etmekte çok aceleci davrandım. [crown_thief.GetTitledFirstName], benim olması gereken tahtta oturuyor ve diyar mesele çözülmüş gibi davranmaya bırakıldı. Oysa başka bir yol daha var. Bir Yediler Yargılaması suçlamayı açığa çıkarabilir; iddiamın gerçekten çalınıp çalınmadığına çeliğin ve tanrıların karar vermesini sağlayabilir."

 agot_trial_of_seven.0101.a:0 "Düşüneceğim."

 agot_trial_of_seven.0101.a.tt:0 "Artık hükümdara karşı bir Yediler Yargılaması Talep edebilirsin."

 agot_trial_of_seven.9999.t:0 "Reddedilen Meydan Okuma"

 agot_trial_of_seven.9999.desc:0 "Talebim reddedildi. [recipient.GetTitledFirstName] alanda bana cevap vermeyecek, diyarın önünde davasını benimkiyle karşı karşıya getirmeyecek. Ret, nezaketle sarılmış ama altındaki gerçeği duyuyorum. Çeliği riske atmayacaklar; çelik çok yüksek sesle konuşabilecekken."

 agot_trial_of_seven.9999.a:0 "Bu konuda sessiz kalmayacağım."

 agot_trial_of_seven.0103.t:0 "Diyarın Önünde Hüküm"

 agot_trial_of_seven.0103.desc.legit_won:0 "Yargılama konuştu ve hüküm açık. Ben ve benim için duranlar yenildik; davam, tanıklık eden herkesin önünde kırıldı.\n\nAlan cesetlerle tıkanmış; tacın bedeli kanla ve çelikle yazılı. Taç artık, iddiası sözlerle değil, ölümün kendisinden koparılmış zaferle kanıtlanan [legit_heir.GetTitledFirstName]'e geçiyor. Alınan şey, diyarın gözü önünde geri alındı ve artık hiçbir lord bu hükmün belirsiz olduğunu öne süremez."

 agot_trial_of_seven.0103.desc.legit_won.usurper_died:0 "Yargılama konuştu ve hüküm açık. [usurper.GetTitledFirstName], [usurper.GetHerHim] için duranlarla birlikte ölü yatıyor; [usurper.GetHerHis] davası, tanıklık eden herkesin önünde kırıldı.\n\nAlan cesetlerle tıkanmış; tacın bedeli kanla ve çelikle yazılı. Taç artık, iddiası sözlerle değil, ölümün kendisinden koparılmış zaferle kanıtlanan [legit_heir.GetTitledFirstName]'e geçiyor. Alınan şey, diyarın gözü önünde geri alındı ve artık hiçbir lord bu hükmün belirsiz olduğunu öne süremez."

 agot_trial_of_seven.0103.desc.legit_helper_won:0 "Yargılama konuştu ve hüküm açık. [legit_combatant.GetTitledFirstName] ve [legit_combatant.GetHerHis] yoldaşı, beni ve benim için duranları yendi; davam, tanıklık eden herkesin önünde kırıldı.\n\nAlan cesetlerle tıkanmış; tacın bedeli kanla ve çelikle yazılı. Taç artık, iddiası sözlerle değil, ölümün kendisinden koparılmış zaferle kanıtlanan [legit_heir.GetTitledFirstName]'e geçiyor. Alınan şey, diyarın gözü önünde geri alındı ve artık hiçbir lord bu hükmün belirsiz olduğunu öne süremez."

 agot_trial_of_seven.0103.desc.legit_helper_won.usurper_died:0 "Yargılama konuştu ve hüküm açık. [legit_combatant.GetTitledFirstName] ve [legit_combatant.GetHerHis] yoldaşı, [usurper.GetTitledFirstName]'i ve [usurper.GetHerHim] için duranları yendi; [usurper.GetHerHis] davası, tanıklık eden herkesin önünde kırıldı.\n\nAlan cesetlerle tıkanmış; tacın bedeli kanla ve çelikle yazılı. Taç artık, iddiası sözlerle değil, ölümün kendisinden koparılmış zaferle kanıtlanan [legit_heir.GetTitledFirstName]'e geçiyor. Alınan şey, diyarın gözü önünde geri alındı ve artık hiçbir lord bu hükmün belirsiz olduğunu öne süremez."

 agot_trial_of_seven.0103.desc.legit_helper_won.legit_heir_died:0 "Yenilgi beni ve benimle birlikte şampiyonlarımı buldu; yine de zafer bile hiçbir netlik sunmuyor. [legit_heir.GetTitledFirstName] öldü; hükmü talep eden taraf onu alamadan yere serildi.\n\nAlan sessizliğe gömüldü, yaşayanlara hiçbir teselli vermiyor. [legit_heir.GetTitledFirstNameNoTooltip] tacın olması gereken başa döndüğünü görecek kadar yaşamamış olsa da hüküm yine de geçerli; kana ve kayba mühürlü. Taç artık, yalnızca bir tahtı değil, hayatlarla ödenmiş bir adaletin ağırlığını da miras alan [final_heir.GetTitledFirstName]'e geçiyor."

 agot_trial_of_seven.0103.desc.legit_helper_won.legit_heir_died.usurper_died:0 "Alan alabildiği her şeyi aldı. [usurper.GetTitledFirstName], [usurper.GetHerHim] için duranlarla birlikte ölü yatıyor; ama [legit_heir.GetTitledFirstName] de öyle, hüküm talep edilemeden yere serildi.\n\nArdından gelen sessizlik hiçbir cevap sunmuyor. [legit_heir.GetTitledFirstNameNoTooltip], tacın taşıması gereken başa döndüğünü görecek kadar yaşamamış olsa da hüküm yine de geçerli; kana ve kayba mühürlü. Taç, yalnızca bir tahtı değil, hayatlarla ödenmiş bir adaletin yükünü de miras alan [final_heir.GetTitledFirstName]'e geçiyor."

 agot_trial_of_seven.0103.desc.usurper_won:0 "Suçlayıcılar bozguna uğradı. [legit_combatant.GetTitledFirstName], davası sona ermiş halde alanda yenilmiş yatıyor.\n\nToprağın kendisi, itaatsizliğin bedeline tanıklık ediyor. Taç, onu devirmeyi amaçlayan yargılamayla sarsılmadan yerinde duruyor. Suçlamaya çelikle cevap verildi ve diyara, başkalarının tutamadığında ayakta kalan yönetimi kabullenmekten başka seçenek kalmadı."

 agot_trial_of_seven.0103.desc.legit_helper_won.no_heir:0 "Yargılama [legit_combatant.GetTitledFirstName] için zafer bahşediyor, ama [legit_heir.GetTitledFirstName] öldü; kıyımın içinden kalkıp kazanılanı talep edecek bir varis bırakmadı.\n\nAlan hiçbir cevap sunmuyor; yalnızca cesetler ve sessizlik. Hükmü cevaplayacak kan kalmayınca taç, zaferle değil zorunlulukla bana geçiyor. Diyar hükümdarını koruyor ama bir zamanlar talep edilen adalet, ölülerle birlikte gömüldü."

 agot_trial_of_seven.0103.desc.legit_heir_won_after_all:0 "Kılıçlar çekildi ve hayatlar tüketildi; yine de mücadele, çoğunun umduğu netlik olmadan sona erdi. [usurper.GetTitledFirstName] alanda ölü yatıyor ve bu düşüşle çatışmanın biçimi, herhangi bir hükmün yapabileceğinden fazlasıyla değişti.\n\nYediler Yargılaması zaferle değil, sessizlikle kapanıyor ve ardından [final_heir.GetTitledFirstName] tahta oturuyor. Tanrıların meseleyi gerçekten yargılayıp yargılamadığı, yoksa yalnızca başka birinin eline geçişini mi izlediği, diyarın kararına bırakılıyor."

 agot_trial_of_seven.0103.desc.legit_heir_won_after_all.legit_heir:0 "Kılıçlar çekildi ve hayatlar tüketildi; yine de mücadele, çoğunun umduğu netlik olmadan sona erdi. [usurper.GetTitledFirstName] alanda ölü yatıyor ve bu düşüşle çatışmanın biçimi, herhangi bir hükmün yapabileceğinden fazlasıyla değişti.\n\nYediler Yargılaması zaferle değil, sessizlikle kapanıyor ve ardından ben tahta oturuyorum. Tanrıların meseleyi gerçekten yargılayıp yargılamadığı, yoksa yalnızca başka birinin eline geçişini mi izlediği, diyarın kararına bırakılıyor."

 agot_trial_of_seven.0103.desc.legit_heir_won_after_all.usurper:0 "Kılıçlar çekildi ve hayatlar tüketildi; yine de mücadele, çoğunun umduğu netlik olmadan sona erdi. [legit_heir.GetTitledFirstName] alanda ölü yatıyor ve bu düşüşle çatışmanın biçimi, herhangi bir hükmün yapabileceğinden fazlasıyla değişti.\n\nYediler Yargılaması zaferle değil, sessizlikle kapanıyor ve ardından ben tahta oturuyorum. Tanrıların meseleyi gerçekten yargılayıp yargılamadığı, yoksa yalnızca başka birinin eline geçişini mi izlediği, diyarın kararına bırakılıyor."

 agot_trial_of_seven.0103.a:0 "Umarım [final_heir.GetTitledFirstNameNoTooltip] akıllıca hüküm sürer."

 agot_trial_of_seven.0103.b:0 "Yazık."

 agot_trial_of_seven.0103.c:0 "Diyar kimin hâlâ ayakta olduğunu hatırlasın."

 agot_trial_of_seven.0103.d:0 "Bu kadar kan, hepsi boşuna."

 agot_trial_of_seven.0104.t:0 "Yedilerin Hükmü"

 agot_trial_of_seven.0104.desc.legit_won:0 "Yargılama konuştu ve hüküm, kırık kalkanlarla kana bulanmış toprak üzerinde taşınıyor. [usurper.GetTitledFirstName], [usurper.GetHerHim] için duranlarla birlikte yenildi; tacı çalan iddia diyarın önünde çıplak bırakıldı.\n\nAlan cesetlerle tıkanmış; adaletin bedeli çelikle ve ölümle apaçık yazılı. Benden alınanı geri alıyorum; bir kararnameyle ya da lütufla değil, başkasının tutamadığı yerde hayatta kalarak. Taç, lordların ve tanıkların gözü önünde hak ettiği yere dönüyor ve artık hiç kimse hükmün belirsiz olduğunu iddia edemez."

 agot_trial_of_seven.0104.desc.legit_helper_won:0 "Ben alanda durmadım ama alan benim adıma savaşıldı. [legit_heir_helper.GetTitledFirstName] ve [legit_heir_helper.GetHerHis] yoldaşları, açık çarpışmada gaspçının davasını kırdı ve başkasının başına sahte bir taç yerleştiren yalanı sona erdirdi.\n\nAlan o hakikatin bedelini kanla ve sessizlikle ödedi. Benden alınan şey yine de iade edildi; kendi elimle değil, ben yapamadığımda davamı taşıyan şampiyonlarca kanıtlandı. Diyar hükmünü aldı ve taç, yasanın ve kanın istediği gibi bana geri dönüyor.\n\nBenim duramadığım yerde kimin durduğunu unutmuyorum. [legit_heir_helper.GetTitledFirstNameNoTooltip], iddiam yaşasın diye canını ve adını riske attı ve bu borcun ağırlığı beni tahtta da izleyecek. Diyar belki yalnızca iade edilen tacı görüyor, ama onu hangi kanın satın aldığını biliyorum."

 agot_trial_of_seven.0104.desc.legit_helper_won.legit_heir_died:0 "Zafer alanda kazanıldı ama zamanında gelmedi. [legit_heir_helper.GetTitledFirstName], izleyen herkesin önünde gaspçının davasını paramparça etti; oysa [legit_heir.GetTitledFirstName], hükmün yerine geldiğini görecek kadar yaşamadı.\n\nAlan sessizliğiyle hiçbir teselli sunmuyor. Haksızlığa uğrayan gitmiş olsa da hüküm hâlâ geçerli; kana ve fedakârlığa mühürlü. Taç artık bana geçiyor; zaferle değil, geri getirmesi amaçlanan kişiyi kurtarmak için çok geç talep edilmiş bir adaletin gölgesinde.\n\nBen bir tahttan fazlasını miras alıyorum. [legit_heir_helper.GetTitledFirstNameNoTooltip], haklı taşıyıcısı yapamadığında ailemin davasını taşıdı ve bu borç, düşenlerle birlikte ölmez. Bugünden itibaren ne gelirse gelsin, kan ve talih iddiayı bitirmekle tehdit ettiğinde iddiayı kimin cesaretinin koruduğunu hatırlayacak."

 agot_trial_of_seven.0104.desc.usurper_won:0 "Yargılama sona erdi ve alan cevabını merhametsizce veriyor. İddiamı savunmak için ayağa kalkanlar yıkılmış yatıyor ve onlarla birlikte benim adıma getirilen suçlama da düşüyor.\n\nSözlerin başarısız olduğu yerde çelik konuştu. [usurper.GetTitledFirstName] tahtta kalıyor ve meydan okumam diyarın önünde tüm geçerliliğini yitiriyor. Taç el değiştirmiyor ve bu alanda kan döken suçlama, ölülerle birlikte gömülüyor."

 agot_trial_of_seven.0104.a:0 "Mesele çözüldü."

 agot_trial_of_seven.0105.t:0 "$agot_trial_of_seven.0104.t$"

 agot_trial_of_seven.0105.desc.legit_heir_won_after_all:0 "Gaspın ardından çağrılan bir Yediler Yargılaması'nın haberi diyara yayılıyor: [main_title.GetNameNoTier]'in alınışını geri almaya yönelik çaresiz bir silaha çağrı. Şampiyonlar seçildi, kılıçlar çekildi ve izleyen kalabalığın önünde kan döküldü.\n\nAncak hüküm gerçekten kesinleşemeden ölüm araya girdi. [usurper.GetTitledFirstName], çarpışmada öldürüldü ve yargılama anlamından kısaldı. Gaspçı ölünce [main_title.GetNameNoTierNoTooltip], bir hükümle değil, olağan veraset düzeniyle [final_heir.GetTitledFirstName]'e geçiyor.\n\nAlan cesetlerle dolup taşıyor ve diyara, yargılamanın ölümün çoktan karara bağladığı hiçbir şeyi değiştirmediğine dair acı bir anlayış kalıyor."

 agot_trial_of_seven.0105.desc.legit_won:0 "[main_title.GetNameNoTier] [usurper.GetTitledFirstName] tarafından gasp edildikten sonra, suçu tanrıların ve insanların gözü önünde cevaplamak için bir Yediler Yargılaması çağrıldı. Suçlamaya çelikle karşılık verildi ve tacın kaderi kana bulanmış bir alana bırakıldı.\n\nYargılama artık hükmünü verdi. [legit_heir.GetTitledFirstName] suçlayıcıların arasında yer aldı ve açık çarpışmada [usurper.GetTitledFirstNamePossessiveNoTooltip] davasını kırarak zaferle çıktı. [main_title.GetNameNoTierNoTooltip], bir kararnameyle ya da uzlaşmayla değil, diyarın tanıklık ettiği bir zaferle hak sahibine iade edildi.\n\nSaraydan kırlara dek hüküm kesinleşmiş olarak konuşuluyor; tacın bedeli sözlerle değil, hayatlarla ölçülüyor."

 agot_trial_of_seven.0105.desc.legit_helper_won:0 "Gaspın ardından, [main_title.GetNameNoTier] üzerindeki haklı iddia meclis salonu yerine alana taşındı. Bir Yediler Yargılaması toplandı; şampiyonları, hırsızlığa kanla karşılık vermeye çağırdı.\n\nAlan artık cevabını verdi. [legit_combatant.GetTitledFirstName], [usurper.GetTitledFirstNamePossessive] şampiyonlarına karşı üstün geldi ve tacı hukuk dışı elinde tutan davayı paramparça etti. [final_heir.GetTitledFirstName] savaşanlar arasında yer almasa da hüküm [final_heir.GetHerHim]'den yana.\n\n[main_title.GetNameNoTierNoTooltip], yargılamanın hükmüyle el değiştiriyor ve bir zamanlar diyarı bölen suçlama, izlemeye gelen herkesin gözü önünde cevaplanıyor."

 agot_trial_of_seven.0105.desc.usurper_won:0 "[main_title.GetNameNoTier]'in gasp edilmesinin ardından, [usurper.GetTitledFirstNamePossessive] yönetme hakkına meydan okumak için bir Yediler Yargılaması çağrıldı. [legit_combatant.GetTitledFirstNamePossessive] ve suçlayıcılar şampiyonlarını seçti ve diyar, çeliğin hırsın aldığını geri alıp alamayacağını görmek için toplandı.\n\nYargılama, hüküm arayanlar için başarısızlıkla sonuçlandı. Tacı hedef alan şampiyonlar yenilgiye uğradı ve [legit_heir.GetTitledFirstName] adına getirilen suçlama alanda yere serildi.\n\n[main_title.GetNameNoTierNoTooltip], [usurper.GetTitledFirstNameNoTooltip]'in elinde kaldı. Suçlama geçerliliğini yitirdi ve diyar, kanla sınandığında ayakta kalan yönetimi kabullenmek zorunda kaldı."

 agot_trial_of_seven.0105.desc.legit_helper_won.no_heir:0 "[main_title.GetNameNoTier] [usurper.GetTitledFirstName] tarafından alındıktan sonra, kaybedilenin geri getirilmesi için bir Yediler Yargılaması çağrıldı. Şampiyonlar suçlamaya karşılık verdi ve tacın kaderi alana bırakıldı.\n\nZafer çarpışmada kazanıldı. [legit_combatant.GetTitledFirstName], diyarın dört bir yanından gelen tanıkların önünde [usurper.GetTitledFirstNamePossessiveNoTooltip] davasını kırdı. Yine de hükmü teslim alacak bir el bulunmuyor. [legit_heir.GetTitledFirstName], kararı görecek kadar yaşamadı ve yargılamanın hükmüne cevap verecek bir varis de kalmadı.\n\nZaferden yararlanacak hiçbir talepkâr kalmadığından, [main_title.GetNameNoTierNoTooltip] [final_usurper.GetTitledFirstName]'in elinde kalıyor. Yargılama, geri getirdiği şeylerle değil; tacı değiştirmeden tükettiği hayatlarla hatırlanıyor."

 agot_trial_of_seven.0105.a:0 "Öyleyse mesele çözülmüştür."

 agot_trial_of_seven.0200.t:0 "Diyarın Önündeki Yargılama"

 agot_trial_of_seven.0200.desc.defender.against_accuser:0 "Zincirlere rağmen muharebe yargılaması hakkını talep ediyorum; çeliğin ve onurun özgürlüğümü kazandırabileceğine güvenerek. Ama [accuser_ruler.GetTitledFirstName] bu yolu bana çok görüyor. Sarayın ve tacın önünde [accuser_ruler.GetSheHe], çok daha büyük bir şeyi, bir Yediler Yargılaması'nı talep ediyor.\n\n[accuser_ruler.GetHerHis] hükmü için yedi şampiyon, benim için yedi şampiyon ayağa kalkacak. İki kılıç arasında çözülebilecek olan şey, artık tanrıların ve diyarın gözleri önünde tartılacak. Bu adalet mi yoksa zulüm mü, alan kısa sürede karar verecek."

 agot_trial_of_seven.0200.desc.defender.against_accuser_kin:0 "Tek bir kılıç ve aleyhimdeki suçlamaya cevap vermek için adil bir şans istedim. Bunun yerine, [accuser_ruler.GetTitledFirstNamePossessive] akrabası [accuser_candidate_kin.GetTitledFirstName] öne çıkıp tacın adına bir Yediler Yargılaması talep ediyor. Bir şövalye düellosu olması gereken şey, tüm diyarın izleyeceği bir gösteriye dönüştü.\n\nYanımda durmaları için artık yedi şampiyon bulunmalı, yoksa ilk darbe inmeden davam çöker. Gururun ve makamın kelimelerin ötesinde çarpıttığı şeyi, çelik yargılayacak."

 agot_trial_of_seven.0200.desc.accuser:0 "Gözetimim altında tutulan [defender_leader.GetTitledFirstName], [defender_leader.GetHerHim]'e yöneltilen suçlamalara karşılık vermek için muharebe yargılaması talep ediyor. Tek bir düello meseleyi çabucak bitirirdi, ama her zaman temiz biçimde değil.\n\nSarayda bazıları, tacı ilgilendiren bir anlaşmazlığın tek bir kılıcın verebileceğinden daha büyük bir ağırlığı hak ettiğini fısıldıyor. [defender_leader.GetSheHe]'in istediği muharebeyi verebilirim... ya da reddedip bunun yerine Yediler Yargılaması talep edebilirim."

 agot_trial_of_seven.0200.desc.accuser_kin.start:0 "Tutsağım [defender_leader.GetTitledFirstName], meseleyi tek bir kılıçla çözmek isteyerek muharebe yargılaması istiyor. Buna izin vermeye niyetlenmiştim ki [accuser_candidate_kin.GetTitledFirstName] sarayın önüne çıkıp böyle bir anlaşmazlığın basit bir düellodan fazlasını gerektirdiğini ilan etti."

 agot_trial_of_seven.0200.desc.accuser_kin.end:0 "[accuser_candidate_kin.GetSheHe] bunun yerine Yediler Yargılaması talep ediyor; tacı savunmak için yedi şampiyonun, ona karşı da yedisinin çıkmasını öne sürüyor. Saray artık izliyor; akrabamın bu meseleyi sürdürmesine izin verip vermeyeceğimi... ya da ipleri kendim ele alıp almayacağımı bekliyor."

 agot_trial_of_seven.0200.desc.accuser_kin.end.from_tbc:0 "[accuser_candidate_kin.GetSheHe], tacı savunmak için yedi şampiyonun, ona karşı da yedisinin çıkmasını öne sürerek Yediler Yargılaması talep ediyor. Saray artık izliyor; akrabamın bu meseleyi sürdürmesine izin verip vermeyeceğimi... ya da ipleri kendim ele alıp almayacağımı bekliyor."

 agot_trial_of_seven.0200.desc.accuser.from_tbc:0 "Gözetimim altında tutulan [defender_leader.GetTitledFirstName], [defender_leader.GetHerHim]'e yöneltilen suçlamalara karşılık vermek için muharebe yargılaması talep ediyor. Tek bir düello meseleyi çabucak bitirirdi, ama her zaman temiz biçimde değil.\n\nSarayda bazıları, tacı ilgilendiren bir anlaşmazlığın tek bir kılıcın verebileceğinden daha büyük bir ağırlığı hak ettiğini fısıldıyor. Öğütleri dikkate alındı. Tek bir düello yerine, mesele tanrıların ve diyarın gözü önünde bir Yediler Yargılaması ile çözülecek."

 agot_trial_of_seven.0200.desc.accuser_kin.start.from_tbc:0 "Tutsağım [defender_leader.GetTitledFirstName], meseleyi tek bir kılıçla çözmek isteyerek muharebe yargılaması istiyor. Meseleye bir Yediler Yargılaması ile karar verileceğini ilan etmek üzereyken, [accuser_candidate_kin.GetTitledFirstName] sarayın önüne çıkıp benden önce söz alıyor."

 agot_trial_of_seven.0200.a:0 "Pekâlâ, [accuser_candidate_kin.GetFirstNameNoTooltip] Yediler Yargılaması'nı sürdürsün."

 agot_trial_of_seven.0200.b:0 "Bu meseleye karar verecek olan benim. Bir Yediler Yargılaması talep ediyorum."

 agot_trial_of_seven.0200.c:0 "[defender_leader.GetTitledFirstNameNoTooltip]'e Muharebe Yargılaması veriyorum."

 agot_trial_of_seven.0200.d:0 "Öyleyse yedi kişiyle duracağım."

 agot_trial_of_seven.0200.a.tt:0 "Bu seçim, Muharebe Yargılaması yerine bir Yediler Yargılaması başlatır."

 agot_trial_of_seven.0200.a.tt.from_tbc:0 "Yediler Yargılaması başlıyor.."

 agot_trial_by_combat.1000.f:0 "Bir Yediler Yargılaması talep ediyorum."

 agot_trial_of_seven.0200.b.from_tbc:0 "Öyleyse şampiyonlar çağrılsın"

 agot_trial_of_seven.0200.b.generic:0 "$agot_trial_by_combat.1000.f$"

 accuser_kin_plotting:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] works in shadows against me. I will have judgment in the open."\n\n"

 accuser_kin_abduction:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] would drag me off like a thief in the night. Let the realm see this answered."\n\n"

 accuser_kin_murder:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] tried to end me in secret. If death is to be risked, let it be under the gods."\n\n"

 accuser_kin_torture:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] has made me suffer for sport. I will not let this end with a single blade."\n\n"

 accuser_kin_maimed:0 "\n\n"Look at what [defender_leader.GetTitledFirstNameNoTooltip] has done to me. Let seven blades speak for what words cannot."\n\n"

 accuser_kin_stole:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] stole what was mine by right. I will not be bought off with excuses."\n\n"

 accuser_kin_sabotage:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] turned on me when it mattered most. Let the gods measure that treachery."\n\n"

 accuser_kin_slander:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] has dragged my name through filth. I will have a verdict the realm cannot ignore."\n\n"

 accuser_kin_imprison:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] has put me in chains. If judgment is to be passed, it will be passed properly."\n\n"

 accuser_kin_banished:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] drove me from my place as if I were nothing. Let this be answered before all."\n\n"

 accuser_kin_deposed:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] would tear down rightful order. Let seven champions defend it."\n\n"

 accuser_kin_child_kill:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] took my child from me. I will not let this be settled quietly."\n\n"

 accuser_kin_execute:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] has made a mockery of justice. Let the gods decide what law could not."\n\n"

 accuser_kin_mute:0 "\n\n[accuser_candidate_kin.GetTitledFirstNameNoTooltip] yumruğunu masaya vuruyor ve aceleyle bir parşömen parçasına Yediler Yargılaması talebi yazıyor.\n\n"

 accuser_kin_tried_to_aith_me:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] tried to eat me once. I would prefer the gods decide whether that was proper."\n\n"

 accuser_kin_sacrifice:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] would spill my blood for dark rites. Let the Seven answer that."\n\n"

 accuser_kin_beaten:0 "\n\n"[defender_leader.GetTitledFirstNameNoTooltip] beat me without mercy once. I will not give [defender_leader.GetHerHim] an easy answer today."\n\n"

 accuser_kin_insane:0 "\n\n"One blade is not enough! Seven! Seven will please the gods!"\n\n"

 agot_trial_of_seven.0201.t:0 "Yedilerin Düştüğü Yer"

 agot_trial_of_seven.0201.desc.defender_won_default.accuser_pov:0 "Bitti. Yediler Yargılaması aleyhime karar verdi ve alan, inkâr etmeye çalıştığım şeyi cevapladı. Şampiyonlarım yıkılmış ya da yenilmiş halde yatıyor ve [tos_final_accused.GetTitledFirstName], tanrıların ve diyarın gözü önünde aklanmış olarak duruyor.\n\nBöyle bir zafer kapalı kapılar ardında gizlenemez. Lordlar kimin üstün geldiğini hatırlayacak, halk ise hikâyeyi gerçek olana dek tekrarlayacak. [tos_final_accused.GetHerHim]'in üzerine yıkmak istediğim hüküm neyse, üzerime dönmüş halde yatıyor."

 agot_trial_of_seven.0201.desc.defender_won_accuser_died.accuser_pov:0 "Yediler Yargılaması kan ve yıkımla sona erdi ve ben bedele bakakaldım. [tos_final_accuser.GetTitledFirstNamePossessive] davası alanda düştü ve [tos_final_accuser.GetSheHe] bir daha ayağa kalkmadı. [tos_final_accused.GetTitledFirstName] galip olarak duruyor ve diyar buna tanıklık etti.\n\nSaray artık gözlerini alandan, ardından gelene çeviriyor. Çeliğin ve Yediler'in iradesiyle [tos_final_accused.GetTitledFirstName] aklanmış duruyor. [tos_final_accused.GetHerHim]'e yöneltilen suçlamalar neyse cevaplandı ve diyar, tanrıların hükmünün apaçık kılındığını gördü."

 agot_trial_of_seven.0201.desc.accuser_won_default.accuser_pov:0 "Yediler Yargılaması bitti ve tanrılar davamdan yana oldu. Şampiyonlarım alanı tuttu ve [tos_final_accused.GetTitledFirstName]'e, talep ettiği özgürlük yerine yalnızca yenilgi kaldı.\n\nYine de zaferin bile bir bedeli var. Yedi kılıç toplandı ve birçoğu geldiği gibi dönmeyecek. Yine de diyar, hükmün gözler önünde verilişini gördü ve o görüntü, herhangi bir kılıç kadar keskin bir silahtır."

 agot_trial_of_seven.0201.desc.accuser_won_defender_died.accuser_pov:0 "Yediler Yargılaması sona erdi ve [tos_final_accused.GetTitledFirstName] bir daha asla inatla tek söz söylemeyecek. Alan, [tos_final_accused.GetHerHim]'i hakkı olarak aldı ve son darbeler inerken şampiyonlarım ayakta durdu.\n\nKimi buna adalet diyecek, kimi de yasal bir maske takan düpedüz güç. Fısıldasınlar. Diyar, tanrıların karar verişini izledi ve ölüler hükümleri tartışmaz."

 agot_trial_of_seven.0201.desc.defender_won_default.defender_pov:0 "Yediler Yargılaması bitti ve ben hâlâ nefes alıyorum. Tacın ve hükmün ağırlığına karşı şampiyonlarım durdu ve alan cevabını verdi. Tanrıların ve diyarın gözü önünde davam, beni tutması amaçlanan zincirlerden daha güçlü olduğunu kanıtladı.\n\nAma zafer asla temiz değildir. Toprak onun bedeliyle lekeli ve ölenlerin çığlıkları, her tezahürattan daha uzun yankılanır. Yine de... onların hükmünden özgürüm ve diyar bunu gördü."

 agot_trial_of_seven.0201.desc.defender_won_accuser_died.defender_pov:0 "Yediler Yargılaması sona erdi ve tanrılar, kimsenin yanılamayacağı bir sesle cevap verdi. Şampiyonlarım alanı tuttu ve [tos_final_accuser.GetTitledFirstName], çeliğin baskısı arasında düştü. Tacın hükmü [tos_final_accuser.GetHerHim] ile birlikte öldü.\n\nAlan artık sessiz; hükmü çoktan yasaya ve hafızaya işliyor. Tanrıların iradesiyle ve şampiyonlarımın gücüyle her suçlamadan arınmış duruyorum. Aleyhimde söylenen her neyse çelikle cevaplandı ve kazanılan hükmü hiç kimse inkâr edemez."

 agot_trial_of_seven.0201.desc.accuser_won_default.defender_pov:0 "Bitti. Yediler Yargılaması aleyhime döndü ve şampiyonlarım alanı tutamadı. Tanrılar, talep ettiğim cevabı bana vermedi; ya da onu karşı tarafa verdiler.\n\nBu zincirleri hakla kırma şansım neyse kanla tüketildi. Şimdi kaybedilmiş bir yargılamanın ardından gelenlerle yüzleşmeliyim: hükme inanan bir diyar ve bu soruyu zorladığımı unutmayacak bir galiple."

 agot_trial_of_seven.0201.desc.defender_won_accuser_died.inherited_crown_pov:0 "Yediler Yargılaması sona erdi ve onunla birlikte, bir zamanlar benimle taç arasında duran hayat da. [tos_final_accuser.GetTitledFirstName] alanda düştü ve yönetimin ağırlığı bana sessiz bir verasetle değil, kan ve hüküm yoluyla geçiyor.\n\nAlana bir taht aramaya gelmedim, yalnızca adalet aramaya; ama çelik ikisini de benim yükleneceğim hale getirdi. Tanrılar herkesin gözü önünde konuştu ve ben yargılamadan yalnızca aklanmış olarak değil, beni kırması amaçlanan hükmün kendisiyle taçlanmış olarak kalkıyorum."

 agot_trial_of_seven.0201.desc.defender_won_default.observer_pov:0 "Yediler Yargılaması sona erdi ve galip, herkesin göreceği biçimde ortada duruyor. [tos_final_accused.GetTitledFirstName] üstün geldi; [tos_final_accuser.GetTitledFirstNamePossessive] kılıçlarının tükendiği yerde şampiyonları hâlâ ayakta.\n\nDiyar bundan yıllarca söz edecek. Bu tür yargılamalar nadirdir; sonucu iktidarı ve cezayı birden ilgilendirdiğinde daha da nadir. Bir tutsağın talebi olan şey, herkesin tanıklık ettiği bir hüküm haline geldi ve kimse bunu yakın zamanda unutmayacak."

 agot_trial_of_seven.0201.desc.defender_won_accuser_died.observer_pov:0 "Yediler Yargılaması, cesetlerle yazılmış bir hükümle sona erdi. [tos_final_accused.GetTitledFirstName] kazandı ve [tos_final_accuser.GetTitledFirstName], düşen şampiyonların yanında alanda ölü yatıyor.\n\n[tos_final_accuser.GetTitledFirstNameNoTooltip] düştüğüne göre yargılama şüpheye pek yer bırakmıyor. Tanrıların ve insanların gözü önünde [tos_final_accused.GetTitledFirstNameNoTooltip] aklanmış duruyor; [tos_final_accused.GetHerHim]'e yöneltilen suçlamalar açıkça cevaplandı. Bir zamanlar sözlerle tartışılan şey artık çelikle çözüldü."

 agot_trial_of_seven.0201.desc.accuser_won_default.observer_pov:0 "Yediler Yargılaması bitti ve [tos_final_accuser.GetTitledFirstNamePossessive] tarafı alanı aldı. [tos_final_accused.GetTitledFirstName] yenildi ve hüküm, neredeyse kutsal metin gibi ateş başından saraya yayılıyor.\n\nKimi buna adalet diyor, kimi kaçınılmazlık. Her iki halde de diyar, sözlerin çözemeyeceğini yedi kılıcın belirlediğini izledi. Hüküm çelikte kazanıldı ve diyar bunu gördü."

 agot_trial_of_seven.0201.desc.accuser_won_defender_died.observer_pov:0 "Yediler Yargılaması, [tos_final_accused.GetTitledFirstName]'in alanda ölümüyle sona erdi. [tos_final_accuser.GetTitledFirstNamePossessive] şampiyonları ayakta kaldı ve tutsağın davası [tos_final_accused.GetHerHim] ile birlikte öldü.\n\nTanrıların açıkça konuştuğunu iddia edenler olacak; tanrıların yalnızca izlemek zorunda bırakıldığında ısrar edenler de. Her iki halde de soruyu sorma hakkı için bir hayat ödendi ve diyar bedeli hatırlayacak."

 agot_trial_of_seven.0201.desc.defender_won_accuser_died.inherited_crown_observer_pov:0 "Yediler Yargılaması, hiçbir ozanın zalim görünmeden yazamayacağı bir zaferle sona erdi. [tos_final_accuser.GetTitledFirstName] alanda ölü yatıyor ve bir zamanlar tutsak olarak adlandırılan kişi, tanrıların ve insanların önünde meşru hükümdar olarak yükseliyor.\n\nBir hüküm talebi olarak başlayan şey, tacın kendisinin devri haline geldi. Çelik, suçlamaya da verasete de cevap verdi ve izleyen herkes, bu tahtın sessizce alınmadığını, Yediler'in bakışı altında kazanıldığını biliyor."

 agot_trial_of_seven.0201.a:0 "Tanrılar böyle hükmetti."

 agot_trial_of_seven.0202.t:0 "Karanlıkta Bir Ziyaretçi"

 agot_trial_of_seven.0202.desc:0 "Bu duvarların içinde saatler yavaş akıyor; yalnızca uzak ayak sesleri ve görünmeyen suyun damlayışı bölüyor. Kapı nihayet açıldığında başka bir muhafız bekliyorum... tanıdık bir yüz değil.\n\n[tos_friend.GetTitledFirstName] loş ışığa adım atıyor ve bir an için gülümseyeceğimi mi yoksa bu manzaraya söveceğimi mi bilemiyorum. [tos_friend.GetSheHe|U], beni burada tutan hanedanın adını taşıyor ama [tos_friend.GetHerHis] gözlerinde o demirden eser yok. Dinleyen kulaklara dikkat ederek alçak sesle konuşuyoruz; ta ki [tos_friend.GetSheHe] sonunda benim adıma [tos_imprisoner.GetTitledFirstName] ile konuşacağına söz verene dek.\n\nBelki küçük bir şeydir — bir salondan diğerine taşınan sözler — ama hiç sözünüz yokken küçük bir vaat bile farklı hissettirir."

 agot_trial_of_seven.0202.a:0 "O umuda tutunacağım."

 agot_trial_of_seven.0202.b:0 "Hanedanının iyiliklerine ihtiyacım yok."

 agot_trial_of_seven.0203.t:0 "Tacın Huzurunda"

 agot_trial_of_seven.0203.desc:0 "Benim için bir muhafız geliyor. Bir sorgu daha bekliyorum. Bunun yerine, [SCOPE.sC('tos_prisoner').Custom2('RelationToMeShort', SCOPE.sC('tos_friend'))] [tos_friend.GetTitledFirstName]'in beklediği küçük bir odaya götürülüyorum. [tos_friend.GetSheHe|U] hoşbeşle vakit kaybetmiyor. Onurumla bu duvarlardan çıkmayı amaçlıyorsam, [tos_friend.GetSheHe] diyor, bunun için savaşmaya hazır olmalıyım.\n\nBir muharebe yargılaması ileriye giden tek yolum olabilir. [tos_imprisoner.GetTitledFirstName]'in saygı duyacağı tek dil, sözler değil çelik olabilir. Çok geçmeden muhafız bizi, [tos_imprisoner.GetTitledFirstNameNoTooltip] ve toplanmış saray erkanının cevabımı beklediği daha büyük bir salona götürüyor. Tüm gözler bana dönüyor; ne talep edeceğimi duymayı bekliyor... edeceksem tabii."

 agot_trial_of_seven.0203.a:0 "Muharebe yargılaması talep ediyorum."

 agot_trial_of_seven.0203.b:0 "Bunu bir gösteriye dönüştürmeyeceğim."

 agot_trial_of_seven.0203.b.tt:0 "Zindana geri götürülüyorsun."

 agot_trial_of_seven.0204.t:0 "Bir Merhamet Meselesi"

 agot_trial_of_seven.0204.desc:0 "[tos_friend.GetTitledFirstName], cesur olduğu kadar da münasebetsiz bir istekle önüme çıkıyor. Özenli sözler ve ölçülü bir tonda konuşan [tos_friend.GetSheHe], [tos_prisoner.GetTitledFirstName]'i gözetimimden bırakmamı istiyor.\n\n[tos_friend.GetSheHe|U], meselenin çoktan bedelini ödettiğini ve şimdi gösterilecek merhametin daha fazla sıkıntıyı önleyeceğini söylüyor. Yine de bir tutsağın zincirleri sebepsiz yere nadiren sökülür ve saray, ne cevap vereceğimi görmek için yakından izliyor."

 agot_trial_of_seven.0204.a:0 "Pekâlâ. [tos_prisoner.GetHerHim]'i bırak."

 agot_trial_of_seven.0204.b:0 "Özgürlüğün bir bedeli var. Öde onu."

 agot_trial_of_seven.0204.c:0 "Hayır. [tos_prisoner.GetSheHe|U], ait olduğu yerde kalacak."

 agot_trial_of_seven.0204.d:0 "[tos_prisoner.GetTitledFirstNameNoTooltip]'i serbest bırak... ve [tos_prisoner.GetHerHim]'i Duvar'a gönder."

 agot_trial_of_seven.0205.t:0 "[tos_imprisoner.Custom('GetQueenKing')|U]'den Bir Söz"

 agot_trial_of_seven.0205.desc.ok:0 "Kapı bir kez daha açılıyor ve [tos_friend.GetTitledFirstName] geri dönüyor. Bu kez [tos_friend.GetHerHis] ifadesinde sessiz bir rahatlama var.\n\n[tos_friend.GetSheHe|U], [tos_imprisoner.GetTitledFirstName]'in beni bırakmayı kabul ettiğini söylüyor. Beni burada tutan zincirler çok geçmeden sökülecek ve bu duvarların ötesindeki yol yeniden benim olacak."

 agot_trial_of_seven.0205.desc.gold:0 "Kapı açıldığında, arkasında [tos_friend.GetTitledFirstName] bekliyor duruyor; ama [tos_friend.GetHerHis] yüzündeki ifade, umduğum gibi değil.\n\n[tos_imprisoner.GetTitledFirstName] özgürlüğümü verecek, ama yalnızca bir bedel karşılığında. Bu zincirler sökülmeden önce altın el değiştirmeli."

 agot_trial_of_seven.0205.desc.no:0 "[tos_friend.GetTitledFirstName] hücreme geri dönüyor ama [tos_friend.GetSheHe]'in getirdiği haber, duymayı umduğum şey değil.\n\n[tos_imprisoner.GetTitledFirstName] isteği reddetmiş. Zincirlerim duruyor ve bu duvarlardan çıkacağıma dair beslediğim her umut boşa çıktı."

 agot_trial_of_seven.0205.desc.nw:0 "Kapı yeniden açıldığında [tos_friend.GetTitledFirstName] bekliyor duruyor; ama [tos_friend.GetHerHis] gözlerindeki ağırlık, bunun basit bir ziyaret olmadığını söylüyor.\n\n[tos_imprisoner.GetTitledFirstName] beni bırakmayı kabul etti... ama özgürlüğe değil. Duvar'a gönderileceğim; orada siyah giyip günlerimin geri kalanını Gece Nöbeti'nin hizmetinde geçireceğim."

 agot_trial_of_seven.0205.a:0 "Pekâlâ. Kabul ediyorum."

 agot_trial_of_seven.0205.b:0 "Bu adalet değil."

 agot_trial_of_seven.0205.b.nw:0 "Bu adalet değil. Muharebe yargılaması talep ediyorum."

 agot_trial_of_seven.0205.c:0 "Öyle olsun."

 agot_trial_of_seven.1000.t:0 "Yedilerin Şampiyonları"

 agot_trial_of_seven.1000.desc:0 "Yediler Yargılaması yaklaştı. Kılıçlar çekildiğinde davam için duracak olanları seçmeliyim.\n\nYanımda duracak altı kişiyi toplayamazsam, hüküm tek bir darbe vurulmadan gelecek ve suçluluk adıma yüklenecek.\n\nBirçok şövalye kılıçlarını çoktan sundu. Aralarından kimlerin yanımda alana çıkacağına karar vermeliyim."

 agot_trial_of_seven.1000.desc.lost_before_started:0 "Sessizlik bozulmadan sürüp gidiyor. Yanımda durmak için daha fazla şampiyon öne çıkmıyor ve suçlamaya cevap verecek yedi kişi olmadan yargılama yapılamaz.\n\nYasaya ve geleneğe göre suçlama cevapsız kalıyor ve ben suçlu bulunuyorum."

 agot_trial_of_seven.1000.desc.sellsword:0 "Sessizlik istediğimden daha uzun sürüyor. Sonunda, sert bakışlı bir savaşçı kalabalıktan öne çıkıyor; ancak altın teklifim açıkça ortaya konunca duraksıyor.\n\nÇeliğin sadakatleri çoktur ve bugün altın, bir kılıcı davama bağlamaya yetiyor."

 agot_trial_of_seven.1000.desc.helper_knight.a:0 "Sessizlik ağır ve bozulmamış halde sürüyor. Sonunda [helper_knight.GetTitledFirstName] öne çıkıyor; kalabalıktan ayrılıp kılıcını davama sunuyor."

 agot_trial_of_seven.1000.desc.helper_knight.b:0 "Önce kimse kımıldamıyor. Sonra [helper_knight.GetTitledFirstName] kalabalığın arkasında bırakıp açık alana adım atıyor ve benim için durmaya istekli olduğunu ilan ediyor."

 agot_trial_of_seven.1000.desc.helper_knight.c:0 "An, sessizlik içinde uzayıp gidiyor; ta ki [helper_knight.GetTitledFirstName] bunu bozup kılıcını yanıma koymak için öne gelene dek."

 agot_trial_of_seven.1000.desc.helper_knight.d:0 "Tüm gözler kalabalığa kilitlenmişken [helper_knight.GetTitledFirstName] tek başına öne çıkıyor, sessizliği bozuyor ve kılıcını davama adıyor."

 agot_trial_of_seven.1000.desc.helper_knight.e:0 "Uzun bir an boyunca kimse kımıldamıyor. Sonra kalabalıktan tek bir figür, [helper_knight.GetTitledFirstName] öne çıkıyor; sessizliği bozuyor ve kılıcını davama sunuyor."

 agot_trial_of_seven.1000.desc.helper_squire:0 "Sessizlik, anı bütünüyle yutmakla tehdit ediyor; ta ki kalabalığın kıyısından genç bir yaver, [helper_knight.GetTitledFirstName] öne çıkana dek. [helper_knight.GetHerHis] sesinde bir tereddüt var ama korku değil.\n\nÖnümde tek dizinin üzerine çökerek [helper_knight.GetSheHe] başını eğiyor ve herkesin duyacağı biçimde net konuşuyor.\n\n#EMP "[the_other_leader.GetTitledFirstNameNoTooltip], beni şövalye ilan et... ve yanında duracağım.#!""

 agot_trial_of_seven.1000.a:0 "İyi bir seçim."

 agot_trial_of_seven.1000.a.buy:0 "Sessizlikten daha gür konuşur altın."

 agot_trial_of_seven.1000.a.tt:0 "Seçtiğin şampiyon senin tarafında savaşacak.\n"

 agot_trial_of_seven.1000.a.lost_before_started:0 "Kaderim mühürlendi."

 agot_trial_of_seven.1000.a.need_new_char:0 "Benimle duracak ve savaşacak kim?"

 agot_trial_of_seven.1000.a.squire_approved:0 "Kalk, Ser [helper_knight.GetFirstNameNoTooltip]. Yanımda dur."

 agot_trial_of_seven.1000.a.squire_approved.tt:0 "#EMP Savaşçı adına sana cesur olmanı buyuruyorum. Baba adına adil olmanı buyuruyorum. Ana adına genç ve masumları savunmanı buyuruyorum. Bakire adına tüm kadınları korumanı buyuruyorum.\n#!"

 agot_trial_of_seven.1000.b.squire_denied:0 "Yapmamalıyım."

 agot_trial_of_seven.1000.b.squire_denied.tt:0 "Yeterli şampiyon olmadan Yediler Yargılaması başlayamaz ve suçlu bulunursun."

 agot_trial_of_seven.1001.t:0 "Yediye Karşı Yedi"

 agot_trial_of_seven.1001.t.accusers:0 "$agot_trial_of_seven.1002.t$: [accuser_leader.GetTitledFirstNameNoTooltip] ve Suçlayıcılar"

 agot_trial_of_seven.1001.t.defenders:0 "$agot_trial_of_seven.1002.t$: [defender_leader.GetTitledFirstNameNoTooltip] ve [defender_leader.GetHerHis] Şampiyonları"

 agot_trial_of_seven.1001.desc:0 "Diyarın gözleri önünde, kadim Yediler Yargılaması nihayet çağrılıyor. Artık ne bir lordun sözü ne de bir kralın fermanı bu anlaşmazlığa son verebilir; yalnızca her dava için kaldırılmış yedi kılıç ve tanrıların çelikle ve kanla bahşettiği hüküm. Suçlayan ve suçlanan karşı karşıya duruyor; kaderleri, adlarına savaşan şampiyonlar kadar kesin biçimde birbirine bağlı. Alan tanıklık etsin ve son kılıç sustuğunda tanrılar kimin hakikatten yana, kimin günahtan yana durduğuna karar verecek.\n\n#EMP [oth_1.GetTitledFirstName], [oth_5.GetTitledFirstName], [oth_4.GetTitledFirstName], [oth_2.GetTitledFirstName], [oth_3.GetTitledFirstName], [oth_6.GetTitledFirstName] ve [oth_7.GetTitledFirstName] ile birlikte duruyor.\n\nKarşılarında, [roy_5.GetTitledFirstName], [roy_4.GetFirstName], [roy_2.GetTitledFirstName], [roy_3.GetTitledFirstName], [roy_6.GetTitledFirstName] ve [roy_7.GetTitledFirstName] ile birlikte [roy_1.GetTitledFirstName] duruyor.#!"

 agot_trial_of_seven.1001.a:0 "Tanrılar böyle hükmedecek."

 agot_trial_of_seven.1001.a.second:0 "Yediler Yargılaması başlasın."

 agot_trial_of_seven.1002.t:0 "Yediler Yargılaması"

 agot_trial_of_seven.1002.desc.usurpation:0 "Söylenti, saraylardan ordugâhlara hızla yayılıyor. [the_other_leader.GetTitledFirstName], [the_royal_leader.GetTitledFirstNamePossessive] yükselişini açıkça gasp olarak nitelendirip tanrıların ve insanların önünde hüküm talep ettiği için bir Yediler Yargılaması çağrıldı.\n\nBu tür yargılamalar nadirdir; taç ile iddia karşı karşıya geldiğinde daha da nadir. Lordlar, çoktan toplanan şampiyonlar hakkında fısıldaşıyor; her kılıç, hangi hükümdarın hakikatten, hangisinin günahtan yana olduğunu kanıtlamaya antlı. Çok geçmeden çelik, hiçbir meclisin çözemediğine karar verecek."

 agot_trial_of_seven.1002.desc.imprisonment:0 "Haber hızla yayılıyor: muharebe yargılaması talebi olarak başlayan şey, çok daha büyük bir şeye dönüştü. [the_other_leader.GetTitledFirstName], [the_royal_leader.GetTitledFirstNamePossessive] hükmüne cevap vermek için teke tek dövüş çağrısı yaptıktan sonra taç bunu reddetti ve onun yerine bir Yediler Yargılaması ilan etti.\n\nBirçokları buna cüretkâr bir hamle, bazıları zalimce bir hamle diyor; çünkü bu tür yargılamalar anlaşmazlıkları, tüm diyarın görmezden gelemeyeceği gösterilere dönüştürüyor. Şampiyonlar yakından uzağa toplanıyor ve çok geçmeden yedi kılıca karşı yedi kılıç, yalnızca sözlerin çözemeyeceği bir kaderi belirleyecek."

 agot_trial_of_seven.1002.a:0 "Yargılamayı yakından takip edeceğim."

 agot_trial_of_seven.1002.a.tt:0 "Yediler Yargılaması'nı gelişirken gözlemleyeceksin."

 agot_trial_of_seven.1002.b:0 "Bu beni ilgilendirmez."

 agot_trial_of_seven.1003.t:0 "$agot_trial_of_seven.1000.t$"

 agot_trial_of_seven.1003.desc.need_more_knights.a:0 "Sayı yetersiz. Suçlamaya cevap vermek için gereken yedi kişiye henüz sahip değilim ve yargılama olduğu gibi ilerleyemez.\n\nSayılar yeniden sayılıp eksik bulunurken anın ağırlığı her yandan üzerime çöküyor. Bu dava ileri taşınacaksa daha fazla şampiyon bulunmalı; yoksa hüküm çeliksiz verilecek."

 agot_trial_of_seven.1003.desc.need_more_knights.b:0 "Üzerimdeki bakışlar hiçbir cevap sunmuyor. Çok az kişi öne çıktı ve gereken sayı hâlâ karşılanmadı.\n\nSessizlik uzadıkça kalabalığın kıyılarında mırıltılar yükseliyor; kimi meraklı, kimi kindar. Daha fazlası seçilene dek Yediler Yargılaması tamamlanmamış halde, izleyen herkesin gözü önünde terazide asılı kalıyor."

 agot_trial_of_seven.1003.desc.need_more_knights.c:0 "Yasa açık ve sayı henüz karşılanmadı. Birlikte duracak yedi kişi olmadan suçlamaya cevap verilemez.\n\nGeleneğin sözleri düşüncelerimde gür bir biçimde yankılanıyor; çok eskiden öğrenilmiş ve bu şekilde sınanması hiç amaçlanmamış sözler. Bu yargılama ilerleyecekse daha fazla şampiyon bulunmalı, yoksa yasa beni merhametsizce yargılayacak."

 agot_trial_of_seven.1003.desc.need_more_knights.d:0 "Önümdekiler yeterli değil. Yedi henüz tamamlanmadı ve an tamamlanmamış halde uzayıp gidiyor.\n\nHer kalp atışı, kalabalığın gözlerini biraz daha yaklaştırıyor; başka birinin öne çıkıp çıkmayacağını bekliyorlar. Yanımda duracak daha fazlası gelmezse bu yargılama yapılmayacak ve sonuç burada, şimdi kararlaştırılacak."

 agot_trial_of_seven.1003.desc.need_more_knights.e:0 "Çağrıma sessizlik cevap veriyor. Durmaya istekli olanlar çoktan öne çıktı ve onlara katılacak başka kimse gelmiyor.\n\nBir an için şüphe, herhangi bir kılıçtan daha derin kesiyor ve davamın sonunun geldiği yer burası mı diye düşünüyorum. Daha fazla şampiyon seçilecekse, onları aramak gerekecek; yoksa sessizliğin kendisi cevabım olacak."

 agot_trial_of_seven.1003.a.honorable.a:0 "Hakkın hâlâ durduğu yerde kim duracak?"

 agot_trial_of_seven.1003.a.honorable.b:0 "Burada adalete hâlâ inanan kimse yok mu?"

 agot_trial_of_seven.1003.a.honorable.c:0 "Doğru olanın yanında duracak kimse kalmadı mı?"

 agot_trial_of_seven.1003.a.honorable.d:0 "Yemini hatırlayan şövalye kalmadı mı?"

 agot_trial_of_seven.1003.a.honorable.e:0 "Aranızda gerçek şövalye yok mu?!"

 agot_trial_of_seven.1003.a.greedy.a:0 "Kılıcını hangi bedel kazandırır?"

 agot_trial_of_seven.1003.a.greedy.b:0 "Burada iyi bir ücret için savaşacak kim var?"

 agot_trial_of_seven.1003.a.greedy.c:0 "Cesareti için ödenmeye razı olacak kimse yok mu?"

 agot_trial_of_seven.1003.a.greedy.d:0 "Kılıcını altın için satacak kim?"

 agot_trial_of_seven.1003.a.greedy.e:0 "Aranızda adil bir bedel karşılığında savaşacak kim?"

 agot_trial_of_seven.1003.a.dishonorable.a:0 "Hepiniz alandan bu kadar mı korkuyorsunuz?"

 agot_trial_of_seven.1003.a.dishonorable.b:0 "Çağırdığımda kimse cevap vermeyecek mi?"

 agot_trial_of_seven.1003.a.dishonorable.c:0 "Gerçekten benim için durmaya uygun kimse yok mu?"

 agot_trial_of_seven.1003.a.dishonorable.d:0 "Gerçekten korkakların arasında mı duruyorum?"

 agot_trial_of_seven.1003.a.dishonorable.e:0 "Aranızda benim için öne çıkacak olan kim?"

 agot_trial_of_seven.1004.t:0 "Çeliksiz Yargılanan"

 agot_trial_of_seven.1004.desc:0 "Meydan okuma, cevap bulamadan sendeleiyor. [leader_lost_before_started.GetTitledFirstName], [leader_lost_before_started.GetHerHim]'in yanında durması gereken altı şampiyonu toplayamıyor ve Yediler Yargılaması yapılamıyor.\n\nYasaya ve geleneğe göre suçlama cevapsız kalıyor. Suçluluk [leader_lost_before_started.GetHerHim]'in üzerine yükleniyor ve mesele, tek bir kılıç çekilmeden çözülüyor."

 agot_trial_of_seven.1004.a:0 "[leader_lost_before_started.GetHerHim]'i gözümün önünden kaldır."

 agot_single_combat.0031.b:0 "Bu son değil."

 they_agot_unavailable_due_to_grand_wedding:0 "Büyük Bir Düğüne katıldıkları için müsait değiller"

 i_agot_unavailable_due_to_grand_wedding:0 "Büyük Bir Düğüne katıldığım için müsait değilim"
