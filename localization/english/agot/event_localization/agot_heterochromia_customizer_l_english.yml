 agot_heterochromia_customizer.1000.desc:0 "#bold Heterokromi Göz Özelleştirici#!'ye hoş geldiniz! Karakterinizin ikinci gözünün hangi renkte olmasını istediğinizi seçebilmeniz için lütfen dikkatlice okuyun. \n\nHangi heterokromik göz rengini istediğinizi seçmek için menüyü kullanın. Göz renginin üzerlerinde nasıl görüneceğini görmek için sağdaki karakterinizi kullanabilirsiniz."

