l_english:

 agot_travel_events.0001.t:0 "Yolculuk: Kavşakta"

 agot_travel_events.0001.desc:0 "Nehir Toprakları'nda ilerlerken, kavşağın hemen yanında uzaktan üç katlı bir han belirir.\n\nKısa süre sonra havayı yüksek sesler doldurur; tıpkı pişen keklerin kokusu gibi... öyle tatlı bir koku ki neredeyse tadını alabiliyorum.\n\nHiç şüphe yok ki yol arkadaşlarım da iyi bir dinlenmeye itiraz etmeyecektir."

 agot_travel_events.0001.a:0 "Bu gece dinlenmek için güzel bir yer."

 agot_travel_events.0001.a.tt:0 "Handa bir mola veriyorsun."

 agot_travel_events.0001.b:0 "Varacağımız yere ulaşınca dinleneceğiz."

 agot_travel_events.0001.b.tt:0 "Yolculuğuna devam ediyorsun."

 agot_travel_events.0002.t:0 "Yolculuk: Han"

 agot_travel_events.0002.desc:0 "En uygun zamanda varıyoruz; han yaşamla dolu ve kahkahalarla inliyor.\n\nArkada, içen bir grup şövalye görüyorum; yüzlerinin halinden, bizden çok önce gelmiş olmalılar... Belki onlara katılabilirim?\n\nYanımda [fellow_traveler.GetName] beni bal şarabı paylaşmaya davet ediyor; belki de fırsatı değerlendirip [fellow_traveler.GetHerHim] ile daha çok vakit geçirmek için onun yerine açık havayı tercih edebilirim?"

 agot_travel_events.0002.a:0 "Yol arkadaşlarıma sadık kalacağım."

 agot_travel_events.0002.gregarious:0 "Han sahibi! En seçkin içkilerini talep ediyorum!"

 agot_travel_events.0002.gregarious.tt:0 "Maiyetinin üyeleri sana karşı #P 20#! [opinion|E] kazanıyor"

 agot_travel_events.0002.b:0 "Şövalyelere yaklaş."

 agot_travel_events.0002.b.tt:0 "Dost canlısı görünüyorlar?"

 agot_travel_events.0002.c:0 "[fellow_traveler.GetName]'e dışarıda katılacağım."

 agot_travel_events.0002.c.tt:0 "Onun yerine yürüyüşe çıkıyorsun."

 agot_travel_events.0002.gluttonous:0 "Burada limonlu kek servis ediyorlar mı?"

 agot_travel_events.0002.gluttonous.tt:0 "Limonlu, limonlu limonlu kekler..."

 agot_travel_events.0003.t:0 "Kavşakta: Hayal Kırıklığına Uğramış Paralı Asker"

 agot_travel_events.0003.desc:0 "Gürültülü grupta, görünüşe göre çetenin lideri olan [sellsword.GetFullName] ile tanışırım. [sellsword.GetHerHis|U] asık suratı, [sellsword.GetHerHis] dertlerini çabucak ele verir.\n\n"Gerçeği söylemek gerekirse, [ROOT.Char.GetTitleAsNameNoTooltip]'im, umduğumdan daha az başarılıyız. Adamlarımın çoğu ya öldü ya da kaçtı. Yakında kalanları meşgul edecek bir sözleşme bulamazsam, hepsinin gideceğinden korkuyorum... ya da daha kötüsü."\n\nBir kadeh daha yuvarladıktan sonra [sellsword.GetSheHe] ekler: "Belki de bu hayat bana göre değil ve böylesi daha iyi olur; en azından eve dönme şansım olur." Yine de, acılığına rağmen gözlerinde bir kararlılık kırıntısı görebiliyorum..."

 agot_travel_events.0003.a:0 "Umutsuzluğa kapılma, sana birebir bir işim var."

 agot_travel_events.0003.b:0 "Adamlarını kiralayacağım; git ve özgür ol."

 agot_travel_events.0003.c:0 "Paralı askerlere güvenilmez."

 agot_travel_events.0004.t:0 "Kavşakta: Sarhoş Şövalye"

 agot_travel_events.0004.desc:0 "Masaya yaklaştığımda en iri şövalyenin yüzü kıpkırmızı olur; [drunk_knight.GetSheHe] birden [drunk_knight.GetHerHis] koltuğundan fırlar ve bağırır: "Vay canına! Bak sen kimler gelmiş! [ROOT.Char.GetName] [ROOT.Char.GetHerselfHimself]!"\n\n[drunk_knight.GetSheHe] beni tanıyor gibi görünse de ben [drunk_knight.GetHerHim]'i çıkaramıyorum. Daha karşılık vermeyi umut edemeden şövalye kılıcını çeker ve bana meydan okur: "Merak ediyorum, gerçekten söylendiği kadar iyi misin? Yoksa sadece süslü zırhlı bir korkak mısın?"\n\nHan yavaşça sessizliğe gömülür ve herkesin bakışının üzerimde olduğunu hissederim."

 agot_travel_events.0004.a:0 "Kavga arıyorsan, bulacaksın!"

 agot_travel_events.0004.a.success:0 "Şövalyeyi yeniyorsun!"

 agot_travel_events.0004.a.failure:0 "Şövalye seni aşağılıyor."

 agot_travel_events.0004.b:0 "Kendini kanıtlamak mı istiyorsun? Neden bana katılmıyorsun?"

 agot_travel_events.0004.b.success:0 "Şövalyeyi ikna ediyorsun!"

 agot_travel_events.0004.b.failure:0 "Şövalye seninle alay ediyor."

 agot_travel_events.0004.c:0 "[ROOT.Char.GetFirstNameNoTooltip] mi? Beni biriyle karıştırıyor olmalısınız..."

 agot_travel_events.0004.c.success:0 "Şövalyeyi ikna ediyorsun!"

 agot_travel_events.0004.c.success.tt:0 "Şövalye seni rahat bırakıyor."

 agot_travel_events.0004.c.failure:0 "Kendini aşağılıyorsun."

 agot_travel_events.0005.t:0 "Kavşakta: Parmak Dansı"

 agot_travel_events.0005.desc:0 "Gezintimden hana dönerken yüksek bir tak sesi duyarım; iki adam birbirine balta fırlatıyor! Durup akrobasilerini izlerken, biri beni fark eder ve seslenir: "Katılmak ister misin?"\n\n"Parmak dansı diyoruz ona," diye açıklar [drunk_ironborn.GetFirstName]. "Tek yapman gereken, adımını şaşırmadan baltayı yakalamak ya da üzerinden atlamak."\n\n"Ah, bahse girerim senin gibi iyi bir savaşçı sorunsuz başarır!" diye gülerek ekler [drunk_ironborn.GetSheHe|l]."

 agot_travel_events.0005.a:0 "Yeterince kolay görünüyor!"

 agot_travel_events.0005.b:0 "Kazanırsam baltan benim olacak!"

 agot_travel_events.0005.success:0 "Kazanmayı başarıyorsun."

 ironborn_axe:0 "Demir Adalı Baltası"

 ironborn_axe_description:0 "Demir Adalar'dan, ince çelikten yapılma geleneksel bir balta. Bir zamanlar Demir Adalı bir gezgin olan [drunk_ironborn.GetFullName]'e aitti. [ROOT.Char.GetFullName] tarafından bir parmak dansında kazanıldı."

 agot_travel_events.0005.failure:0 "Balta seni yakalıyor"

 agot_travel_events.0005.c:0 "HAH! Balta fırlatmak mı? İyi bir soytarı olursun sen!"

 agot_travel_events.0005.c.success:0 "[drunk_ironborn.GetSheHe|U]... aslında kabul ediyor..."

 agot_travel_events.0005.c.failure:0 "Demir Adalıları gücendiriyorsun."

 cultural_acceptance_mocked_customs:0 "Alay edilen gelenekler"

 agot_travel_events.0005.d:0 "Kavşaklar gerçekten de tuhaf yol arkadaşları edindirir..."

 agot_travel_events.0005.d.tt:0 "Demir Adalıları oyunlarıyla baş başa bırak."

 agot_travel_events.0006.t:0 "Yolculuk: Han Derdi"

 agot_travel_events.0006.desc:0 "Yaklaştığımızda atmosfer tedirginleşir. Kapıyı ittiğimde bizi devrilmiş masalar ve kırılmış camlar karşılar.\n\nHan sahibi bizi [innkeeper.GetHerHis] yüzünde endişeli bir ifadeyle karşılar: "Özür dilerim gezginler, korkarım burada aradığınız sıcak karşılamayı bulamayacaksınız. Bir grup haydut kısa süre önce hana saldırdı; onları savuşturmayı başardık ama intikamla yakında geri döneceklerinden endişeleniyorum."\n\n"Yine de, becerikli ellere ihtiyacımız olabilir.""

 agot_travel_events.0006.a:0 "Kalıp yardım edeceğiz."

 agot_travel_events.0006.a.brave:0 "İhtiyaç içindekileri korumak benim kutsal yeminim."

 agot_travel_events.0006.a.tt:0 "Haydutlarla yüzleşmeyi kabul ediyorsun."

 agot_travel_events.0006.b:0 "Yardımcı olabilirim... doğru bir ücret karşılığında."

 agot_travel_events.0006.b.success:0 "Han sahibi korumanın karşılığını ödüyor."

 agot_travel_events.0006.b.failure:0 "Han sahibini kızdırıyorsun ve [innkeeper.GetSheHe] kalışını reddediyor."

 agot_travel_events.0006.c:0 "Doğrusu... Sadece geçip gidiyoruz."

 agot_travel_events.0007.t:0 "Kavşakta: Pusu"

 agot_travel_events.0007.desc:0 "Hazırlıklarımızı yaparken [fellow_knight.GetName] yanıma yaklaşıp şunu önerir: "[ROOT.Char.GetTitleAsNameNoTooltip]'im, biz ilk darbeyi vurabilecekken burada oturup beklemek hata olur. Handan, o toprakları herkesten iyi bilen birkaç adam topladım; bırak onlarla gideyim ve haydutlar bize ulaşmadan onları yandan çevirelim.""

 agot_travel_events.0007.a:0 "Hayatlarınızı riske atmayacağım; düşmanla birlikte yüzleşeceğiz."

 agot_travel_events.0007.a.tt:0 "Haydutlar gelene dek beklemeye devam ediyorsun."

 agot_travel_events.0007.b:0 "Pekâlâ, dönüşünüzü bekleyeceğim."

 agot_travel_events.0007.b.tt:0 "[fellow_knight.GetSheHe|U] haklı olabilir..."

 agot_travel_events.0007.b.success:0 "Pusu başarılı."

 agot_travel_events.0007.b.fail:0 "Şövalyen geri dönmüyor."

 agot_travel_events.0008.t:0 "Kavşakta: Sahte Şövalye"

 agot_travel_events.0008.desc:0 "Uzun beklememiz gerekmez; çok geçmeden Ser [evil_bandit.GetFullNameNicknamed] önderliğindeki haydutlar bir kez daha yağma için geri gelir.\n\nYanımda duran adamlarım bana döner, hevesle bir emir beklerler. Nasıl yaklaşmalıyım?"

 agot_travel_events.0008.a:0 "Komutanla bizzat yüzleşeceğim."

 agot_travel_events.0008.a.tt:0 "[evil_bandit.GetFirstName] ile düello başlar."

 agot_travel_events.0008.b:0 "Güçlerimin geri kalanıyla saldır."

 agot_travel_events.0008.b.success:0 "Haydutları yeniyorsun."

 agot_travel_events.0008.b.failure:0 "Geri püskürtülüyorsun ve aceleyle ayrılmak zorunda kalıyorsun."

 agot_travel_events.0008.c:0 "KAÇIN! KAÇIN!!"

 agot_travel_events.0008.c.escape:0 "Zar zor da olsa kaçmayı başarıyorsun..."

 agot_travel_events.0008.c.wounded:0 "Bir ok sana isabet ediyor!"

 agot_travel_events.0010.t:0 "Kavşakta: Ayrılış"

 agot_travel_events.0010.desc:0 "Ayrılmaya hazırlanırken [innkeeper.GetFirstName], [innkeeper.GetHerHis] ellerinde küçük bir tahta kutuyla yanıma yaklaşır.\n\n"Çok bir şey olmadığını biliyorum ama son saldırıdan elimizde kalan tek şey bu. Lütfen bunu minnettarlığımızın bir nişanesi olarak kabul et. Sizin yardımınız olmadan, burada neler olabileceğini kim bilir...""

 agot_travel_events.0010.greed_desc:0 "Ayrılmaya hazırlanırken [innkeeper.GetFirstName], [innkeeper.GetHerHis] minnettarlığını ifade etmek için yanıma yaklaşır.\n\n"Sizin yardımınız olmadan, burada neler olabileceğini kim bilir... Yolculuklarınız güvenli olsun, cesurluğunuzu başkalarının da duymasını sağlayacağım.""

 agot_travel_events.0010.a:0 "Elveda."

 agot_travel_events.0010.aa:0 "En hoş karşılanan ödül."

 agot_travel_events.0010.b:0 "Gerek yok. Bu sadece hakkıydı."

 agot_travel_events.0010.b.tt:0 "Maiyetin şövalyeliğini fark ediyor ve sana karşı #P 10#! [opinion|E] kazanıyor."

 agot_travel_events.0011.t:0 "Kavşakta: Boşa Geçen Zaman"

 agot_travel_events.0011.desc.intro:0 "Birkaç gün geçer ama handan yalnızca bir avuç ayyaş geçer; yakınlarda hiçbir haydut izi yoktur. Han sahibinin endişeleri yersiz miydi? Ya da belki de varlığımız onları ürküttü? Bunu anlamanın imkânı yok...\n\n"

 agot_travel_events.0011.wasgreedy:0 "Atlarımızı hazırlarken [innkeeper.GetFirstName], [innkeeper.GetHerHis] ellerinde küçük bir tahta kutuyla yanıma yaklaşır.\n\n"Çok bir şey değil ama son saldırıdan elimizde kalan tek şey bu. Lütfen, zahmetiniz için.""

 agot_travel_events.0011.a:0 "Elveda."

 agot_travel_events.0011.b:0 "Elveda."

 agot_travel_events.1000.t:0 "Kışyarı: Varış"

 agot_travel_events.1000.desc:0 "Kışyarı - [winterfell_lord.GetHouse.GetName] Hanesi'nin makamı ve Kuzey'in kalbi; Kuzey'in uçsuz bucaksızlığı içinde gururlu ve yüce bir biçimde duruyor.\n\nKral Yolu'ndan kaleye yaklaşırken, surların dışındaki geniş ve şu an büyük ölçüde boş olan Kış Şehri yerleşiminin içinden geçiyorum. Daha doğuya ilerledikçe surlar ufka hükmetmeye başlıyor. Dış sur seksen fite, iç sur ise yirmi fit daha yükseğe ulaşıyor. Karanlık ve griler; yıpranmış taş, kalenin büyük yaşına tanıklık ediyor.\n\nDoğu Kapısı açık ve davetkâr duruyor; içeride [winterfell_lord.GetFullName] tuz ve ekmekle bekliyor. Konuk hakkı bağışlandıktan sonra [winterfell_lord.GetSheHe] size kaleyi keşfetme serbestliği tanıyor."

 agot_travel_events.1000.godswood:0 "Eski Tanrılar'ın yurdu olan ünlü #bold tanrıkoruluğunu#! keşfedeceğim."

 agot_travel_events.1000.tombs:0 "Tarihin sonsuza dek nöbet tuttuğu meşhur #bold mezarlıkları#! keşfedeceğim."

 agot_travel_events.1000.glass_gardens:0 "Kalenin atan kalbi olan kutlu #bold cam bahçelerinde#! yürüyeceğim."

 agot_travel_events.1000.wintertown:0 "Doğrusu Kış Şehri'ni ve onun daha ... #italic şehvetli#! cazibelerini gezmeyi tercih ederim."

 agot_travel_events.1000.opt_out:0 "Keşifle vakit kaybedecek zamanım yok."

 agot_travel_events.1001.t:0 "Winterfell: Tanrı Ormanı"

 agot_travel_events.1001.intro_old_gods:0 "Tanrıkoruluğunda yürürken eve dönmüş gibi hissetmekten alamıyorum; tanrıkoruluğunun karanlık ve ilkel güzelliği gizemli bir biçimde bana sesleniyor.\n\n"

 agot_travel_events.1001.intro_other:0 "Tanrıkoruluğunda yürürken kendimi izinsiz girmiş gibi hissetmekten alamıyorum; yine de tanrıkoruluğunun karanlık ve ilkel güzelliği aynı biçimde bana sesleniyor.\n\n"

 agot_travel_events.1001.desc:0 "Ağaçların arasından ilerlerken kendimi, hemen yanında koca bir weirwood kalp ağacının büyüdüğü kaplıcaları çevreleyen küçük bir açıklığın önünde buluyorum. Havuza ve ağaca yaklaşırken bir zorunluluk hissediyorum."

 agot_travel_events.1001.a:0 "#bold Kalp ağacı#!; Eski Tanrılar'ın ta kendisi bana sesleniyor."

 agot_travel_events.1001.b:0 "#bold Kaplıcaların#! sıcaklığı ve gençleştirici gücü inkâr edilemez."

 agot_travel_events.1002.t:0 "Winterfell: Tanrı Ormanı"

 agot_travel_events.1002.desc:0 "Kalp ağacının önünde diz çöktüğümde huzur buluyorum.\n\nOrmandaki her şeyi çok daha net duyabiliyorum: dallardaki rüzgârın sesini, kayalardaki suyu, ormandaki hayvanların ağır adımlarını ve tüm bunların içinden, #italic evet#!, Eski Tanrılar, #bold gerçek#! tanrılar benimle konuşuyor."

 agot_travel_events.1002.a:0 "[GetReligionByKey('the_pact_religion').GetName]'in bir takipçisi olarak yeniden doğmuş gibi hissediyorum."

 agot_travel_events.1002.b:0 "Hayır, [ROOT.Char.GetFaith.HighGodName]'e sadık kalmalıyım!"

 agot_travel_events.1002.c:0 "[GetReligionByKey('the_pact_religion').GetName] ile yeni baştan uyumlanmış hissediyorum."

 agot_travel_events.1003.t:0 "Winterfell: Tanrı Ormanı"

 agot_travel_events.1003.desc:0 "Havuzda uzanırken, uzun zamandır beni rahatsız eden tüm stresin ve endişenin ılık sularla birlikte süzülüp gittiğini hissediyorum. Yukarıdaki keskin havaya karşın, kaplıcaların kucaklayışı yıllardır hissetmediğim bir rahatlık sunuyor. Burada çağlar boyu süzülebilirim; yine de artık gevşediğime göre işlerimin başına dönmeliyim."

 agot_travel_events.1003.a:0 "Gelecek için yeni bir huzur duygusu hissediyorum."

 agot_travel_events.1004.t:0 "Winterfell: Mahzenler"

 agot_travel_events.1004.desc:0 "Kadim Birinci Kale'nin önünden geçip, eski Kış Kralları'nın hizmetkârlarının yattığı mezarlıktaki liken benekli mezar taşlarının arasında yürürüm.\n\nÖnümde eski bir demir kapı durur: labirent gibi mezarlıkların girişi. Yaşayanların dünyasından ölülerin yer altı mahzenlerine inerken her adım yeni bir ürpertiyle işaretlenir.\n\nMezarlıkların arasında yürürken karanlık koridorları bir labirent gibi bulurum. Soluk meşale ışığı pek yol gösterici değildir. Bir kavşağa geldiğimde, #bold sağa#! ya da #bold sola#! karar vermeliyim."

 agot_travel_events.1004.a:0 "Sağa gideceğim, o yönde bir şey görüyorum galiba."

 agot_travel_events.1004.b:0 "Solda bir meşale var; gidilecek yol orası olmalı!"

 agot_travel_events.1005.t:0 "Winterfell: Mahzenler"

 agot_travel_events.1005.intro:0 "Koridorda ilerlemeye devam ederken kendimi taçlı bir kral olan bir adamın heykeliyle burun buruna bulurum. Tahtının iki yanında taş ulukurtlar durur; kucağında ise çoktan paslanmış bir kılıç vardır. Kenara kazınmış birkaç söz hafifçe aşınmış ama hâlâ okunabilir:\n\n"

 agot_travel_events.1005.jon:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele bakarken ona kendiliğimden daha büyük bir saygı duyuyorum. İşte doğudan akıncıları ve köle tacirlerini kovup Beyaz Liman'ın kadim öncülü olan Kurt İni'ni inşa eden Kral. Adam, korkunç bir savaşçı ve güçlü bir kraldı."

 agot_travel_events.1005.brandon:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele bakarken ona kendiliğimden daha büyük bir saygı duyuyorum. Bu, Sur'un Ötesindeki Kral Joramun ile birleşip Gece Kralı'nı ve Ceset Gelinini yok eden ünlü kraldı. İkisi birlikte, insan diyarlarını Gece Kralı'nın mutlaka yaratacağı dehşetlerden koruyacaktı."

 agot_travel_events.1005.theon:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele bakarken ona kendiliğimden daha büyük bir saygı duyuyorum. Aç Kurt, Kuzey'in dışında bile ünlüdür; Andallar gelmeden önce Kuzey'i birleştirmesi, ardından söz konusu istilacıları yenmesi ve hatta Essos'ta Andalos'un ta kendisine saldırmasıyla bilinir. Andaldan Demir Adam'a ve daha fazlasına, herkesle savaştı; gerçek bir savaş efendisiydi."

 agot_travel_events.1005.rodrik:0 "#bold [stark_ancestor.GetFullNameNicknamed].#! Heykele bakarken ona kendiliğimden daha büyük bir saygı duyuyorum. Rodrik Stark bugün bile türkülerde anılır; özellikle Demir Adamlar'la herhangi bir sorun baş gösterdiğinde. Ayı Adası'nı mürekkepbalıklarından bir bilek güreşiyle kazanıp onu Mormont Hanesi'ne bağışladığı söylenir."

 agot_travel_events.1005.a:0 "Buradaki tarih elle tutulur."

 agot_travel_events.1006.t:0 "Winterfell: Mahzenler"

 agot_travel_events.1006.desc:0 "Kısa süre sonra mezarlıkların derinliklerinde bir çırak bulur beni ve yemeğin yakında servis edileceğini duyurur. Neyse ki çırak çıkış yolunu biliyor ve beni yeniden yüzeye çıkarıyor."

 agot_travel_events.1006.a:0 "Bu günü unutmayacağım."

 agot_travel_events.1007.t:0 "Winterfell: Mahzenler"

 agot_travel_events.1007.desc:0 "Açıkça yanlış yolu seçmişim; çünkü kendimi şimdi bu koridorlarda daha da fazla kaybolmuş buluyorum. Meşaleler gelişigüzel yerleştirilmiş ve beni gittikçe daha da aşağılara çekiyor. #italic Her aşağı adım, yeni bir ürperti getiriyor.#!\n\nDuvarlardan ve tavandan yayılan tuhaf bir sıcaklık hissediyorum; beni derinliklere çekiyor. Bir köşeyi dönünce, Kışyarı'nın altındaki mezarlıkta bulmayı asla beklemediğim şeyi görürüm...\n\nÖnümde bir #bold ejderha yumurtası#!! Bir çeşit yuvaya yerleştirilmiş; belli ki bir amaçla buraya bırakılmış, ama bu amacın ne olabileceğini aklım almıyor bile."

 agot_travel_events.1007.a:0 "Elbette amacı burada kalmak."

 agot_travel_events.1007.b:0 "Sonuçta neden olmasın? Neden almayayım?"

 agot_travel_events.1008.t:0 "Kışyarı: Cam Bahçeleri"

 agot_travel_events.1008.desc:0 "Cam bahçelerine girerken birden fazla giyinmiş gibi hissediyorum. Kalenin keskin soğuğuyla savaşmak için giydiğim kürkler ve pelerinler bu cam evlerde fazlasıyla sıcak geliyor.\n\nÇevremde, yerin derinliklerinden getirilen buharı ve sıcak havayı salan bakır borular var. Kışın en soğuk günlerinde bile sıra sıra sebze ve başka yiyecekler yetişiyor. Daha da arka tarafa ilerlediğimde, ünlü #bold;color:{0.52,0.65,0.86} kış gülleri#!'ni görebiliyorum. Soluk mavi yaprakları, şimdiye dek gördüğüm hiçbir güle benzemeyen çarpıcı bir görünüme sahip."

 agot_travel_events.1008.a:0 "Mühendisliği inceleyip kopyalamanın mümkün olup olmadığına bakmalıyım"

 agot_travel_events.1008.b:0 "Belki eve götürmek üzere bir çiçek isteyebilirim..."

 agot_travel_events.1008.c:0 "Cam bahçeleri gerçekten de görülmeye değer bir harika."

 agot_travel_events_unlocked_glass_garden:0 "Cam Bahçesi düklük binasının kilidini açıyorsun."

 agot_travel_events.1009.t:0 "Kışyarı: Kış Şehri"

 agot_travel_events.1009.desc:0 "Kadim kaleden çıkıp Kış Şehri'ne yöneliyorum. Dolu olmaktan uzak olsa da orada hâlâ ortalıkta dolanan çok insan var: Ürünlerini sergileyen çiftçiler, mallarını bağıra bağıra satan zanaatkârlar, arada bir şarkı tutturmuş sokak müzisyenleri...\n\nGizli gizli soruşturarak kısa sürede aradığım yeri buluyorum: #bold Güller#!. Yerlilerin hepsi iyi vakit geçireceğim konusunda bana güvence verdi; kesemle birlikte eminim geçireceğim."

 agot_travel_events.1009.a:0 "Biraz para harcama zamanı..."

 agot_travel_events.1009.b:0 "Belki de onun yerine meyhanede bir içki..."

 agot_travel_events.0012.t:0 "Bir Ejderha, Ejderha Gördüm!"

 agot_travel_events.0012.desc:0 "[location.GetName]'de ilerlerken yaşlı bir kadınla genç bir adam arasındaki konuşmaya kulak misafiri olurum.\n\n"Ejderha, ejderha gördüm!" diye haykırır yaşlı kadın. "Ne? Yine ne var anne?" "Dağ kadar büyüktü ve gece kadar kara. Tam gökyüzünün karşısına uçtu!" diye sürdürür telaşlı bir sesle.\n\n"Şimdi de ejderha mı?" diye yanıtlar oğlu, gözlerini devirerek. "Lütfen anne. Böyle devam edersen kasabadaki herkes senin deli olduğunu sanacak; benim de senin masallarını dinlemekten daha iyi işlerim var." diyerek alayla dönüp yürümeye koyulur.\n\n"Göreceksin! O bir ejderhaydı!" diye seslenir arkasından. "Hepimizi öldürecek ve o zaman bana inanacaksın!""

 agot_travel_events.0012.a:0 "Bir ejderha mı?! Derhal aramalıyız!"

 agot_travel_events.0012.a.f:0 "Önümüzdeki hafta boyunca ejderha için arama yapıyorsun."

 agot_travel_events.0012.a.toast.title:0 "Burada Ejderha Yok"

 agot_travel_events.0012.a.toast.desc:0 "Ejderhayı aradın ama hiçbir şey bulamadın."

 agot_travel_events.0012.b:0 "Ah, zavallı yaşlıcığım, izin ver yardımın parasını ödeyeyim."

 agot_travel_events.0012.b.f:0 "Yaşlı kadın için biraz ruhsal yardımın parasını ödüyorsun."

 agot_travel_events.0012.c:0 "Ne tuhaf bir konuşma."

 agot_travel_events.0012.c.f:0 "Yoluna devam ediyorsun."

 agot_travel_events.0012.d:0 "Hayır, o haklı! Ben de gördüm!"

 agot_travel_events.0012.d.f:0 "Yaşlı kadının çığırtkanlıklarına sen de sesini katıyorsun."

 agot_travel_events.0013.t:0 "Myr: Skolastik Loncalar"

 agot_travel_events.0013.desc:0 "Şehirde ilerlerken, hepsi derin bir tartışma içinde olan bir grup bilgine ve öğrenciye rastlarım. Skolastik Loncaların üyeleridirler ve yakın tarihli bir keşfin ince ayrıntılarını tartışmaktadırlar. Dinlerken, bu bilginlerden öğrenmek için eşsiz bir fırsatım olduğunu fark ederim."

 agot_travel_events.0013.a:0 "Şehrimi bazı bilginler davet edebilirim."

 agot_travel_events_unlocked_observatory:0 "Gözlemevi düklük binasının kilidini açıyorsun."

 agot_travel_events.0013.b:0 "Dur ve onlarla konuş."

 agot_travel_events.0013.c:0 "Yoluma devam edeceğim."

 maester_option_tt:0 "Yolculuğa uygun bir [GetCourtPositionType('maester_court_position').GetName] görevlendirmelisin"

 agot_travel_events.2000.t:0 "Tehlike [wild_dragon.GetNameNoTooltip]: Pusuda"

 agot_travel_events.2000.desc:0 "[location.GetNameNoTooltip] boyunca yolculuk şimdiye dek sessiz geçti; beladan uzaktı. Ne var ki atlar göze çarpacak kadar tedirgin. Nedeni ancak çok geç olduğunda keşfediyorum...\n\nTepede beliren ejderha [wild_dragon.GetNameNicknamed], emredercesine gökyüzünü süpürüyor. Daha da kötüsü, hareketlerine bakılırsa fark edilmekten kurtulamamışız."

 agot_travel_events.2000.fight:0 "Çok geç, savaşa hazırlanın."

 agot_travel_events.2000.fight.tt:0 "[wild_dragon.GetNameNoTooltip] ile çatışmaya başlayacaksın"

 agot_travel_events.2000.run:0 "KAÇIN!"

 agot_travel_events.3000.t:0 "Savaşçı Birliği Seçmeleri"

 agot_travel_events.3000.desc:0 "Maiyetim [3000_county_liege.GetTitledFirstName]'in topraklarında ilerlerken, yakındaki bir virajda yankılanan kaba yontulmuş silahların uzaktan gelen tak taklarını ve çınlamalarını duyarız. Köşeyi dönünce, [3000_county_liege.GetTitledFirstNameNoTooltip]'i [3000_county_liege.GetHerselfHimself] küçük bir tepenin üzerinde stoik bir duruşla, her türden fiziksel meydan okumada yarışan bir grup özgür halkı denetlerken görürüm. Her biri meydan okumayla boğuşur; yıkanmamış bu müstakbel savaşçı kalabalığının yüzleri kızarmış, alınları terden sırılsıklamdır. Görünüşe göre [3000_county_liege.GetTitledFirstNameNoTooltip]'in yeni bir savaşçı birliği için deneme alanına rastlamışız."

 agot_travel_events.3000.kneeler.desc:0 "Misafirperver olmayan yabanıl topraklarda seke seke ilerlerken, her adım ekibim ve benim için öncekinden daha tehlikeli olurken, yakındaki bir virajın ötesinden kaba yontulmuş silahların tak taklarını ve çınlamalarını, eforla boğuşanların yadsınamaz homurtularını duyarız. Kılıçlarımızı çekip elimizde kılıçlarla köşeyi döneriz. Ama beklediğimiz gibi bir savaş yerine, görünüşte vahşi bir kalabalığın üzerinde duran, daha soylu görünümlü bir yabanıl buluruz. [3000_county_liege.GetSheHe|U], yabanıllar güçlerini kanıtlamaya çalışırken yüzleri kıpkırmızı kesilen yabanılları dikkatle izleyerek, görünüşe göre bir hüner sınavını gözlemlemektedir."

 agot_travel_events.3000.a:0 "Ben bir tane alayım!"

 agot_travel_events.3000.a.tt:0 "Yarışmacılar arasından seçimini yapmak için itibarını kullanacaksın."

 agot_travel_events.3000.b:0 "Bak, [3000_county_liege.GetFirstNameNoTooltip], eğer ben... senin için bir onur olmaz mıydı?"

 agot_travel_events.3000.b.tt:0 "[3000_county_liege.GetFirstNameNoTooltip]'i sana bir yarışmacıyı almayı kabul ettirmeye çalışacaksın"

 agot_travel_events.3000.b.success.tt:0 "[3000_county_liege.GetNameNoTooltip] kabul ediyor"

 agot_travel_events.3000.b.failure.tt:0 "[3000_county_liege.GetNameNoTooltip] bu tekliften hakaret almış durumda"

 agot_travel_events.3000.c:0 "Buradaki en iyi savaşçının kim olduğunu görmek mi istiyorsun? Göstereyim."

 agot_travel_events.3000.c.tt:0 "Tekli dövüşe katılacaksın"

 agot_travel_events.3000.d:0 "Bırakalım kendi hallerine."

 agot_travel_events.3000.d.tt:0 "Yoluna devam edeceksin"

 agot_travel_events.3001.t:0 "$agot_travel_events.3000.t$: Kadro"

 agot_travel_events.3001.desc:0 "Yarışmacılara yaklaştığımda, çoğu zavallıca bir hürmetle bakışlarımdan çekilirken umut vadeden üçünü görürüm; sırayla her birini işaret ederim. [3000_county_liege.GetName] onları öne çağırır; kendilerini [skilled_fighter.GetHerHis] hüneriyle nam salmış tehlikeli bir savaşçı olan [skilled_fighter.GetName]; [fit_fighter.GetHerHis] ham atletizmiyle tanınan [fit_fighter.GetName] ve [big_fighter.GetName] adlı dev gibi bir savaşçı olarak tanıtırlar."

 agot_travel_events.3001.a:0 "Peki, başlasın o zaman; kazanana doğal olarak ben sahip çıkarım."

 agot_travel_events.3001.a.tt:0 "Seçmelerin galibi sana katılıyor"

 agot_travel_events.3001.b:0 "Bir yarışta talih değişkendir; ben buradaki en iyinin kim olduğunu zaten biliyorum."

 agot_travel_events.3001.b.tt:0 "Yarışmanın favorileri arasından seçimini yapacaksın"

 agot_travel_events.3002.t:0 "$agot_travel_events.3000.t$: Kazanan"

 agot_travel_events.3002.desc:0 "Ağır yüklerle boğuşarak, uzun koşular ve çelik sınavlarıyla geçen, amansız emek ve meşakkat saatlerinin ardından finalistler tekli dövüş için öne çıkarılır. İki savaşçı duruş alır; gerginlikten hava iyice seyrekleşir. Kılıçlar fırlar ve dans başlar. Sonsuzluk gibi hissettiren bir anın ardından [tryouts_winner.GetName], [tryouts_winner.GetHerHis] rakibini toprağa serilmiş halde yalnız bırakır."

 agot_travel_events.3002.a:0 "İşte benim şampiyonum."

 agot_travel_events.3003.t:0 "$agot_travel_events.3000.t$: Seçimini Yapmak"

 agot_travel_events.3003.desc:0 "Gözlerimi üç favoriye çeviriyorum. [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'in en iyileri oldukları tartışmasız. Şimdi kendi tercihimi bulmalıyım."

 agot_travel_events.3003.a:0 "Hiçbir şey askerî hüneri geçemez; [skilled_fighter.GetFirstNameNoTooltip]'i alıyorum."

 agot_travel_events.3003.b:0 "[fit_fighter.GetNamePossessive] atletizmi her türlü şöhretin ötesinde; [fit_fighter.GetHerHim]'i alıyorum."

 agot_travel_events.3003.c:0 "O boyutta biriyle dövüşmem bile gerekebilir. [big_fighter.GetFirstNameNoTooltip]'i alıyorum!"

 agot_travel_events.3010.t:0 "$agot_travel_events.3000.t$: Yarışmaya Katılmak"

 agot_travel_events.3010.desc:0 "Gurubun önüne doğru ilerleyip, varışımda tanık olduğum fiziksel meydan okumalar için hazırlanmaya başlarım. Ama başlamama fırsat kalmadan [3000_county_liege.GetName] elini kaldırır ve konumum gereği yarışmanın tekli dövüş aşamasına doğrudan gideceğimi, müstakbel akıncıların en iyi savaşçılarından biriyle karşılaşacağımı duyurur. Öne çıkan yarışmacı, [first_duelist.GetName] adlı göz korkutucu görünümlü bir savaşçıdır."

 agot_travel_events.3010.a:0 "Ha! Bakalım siz [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] halkı nelerden yapılmışsınız."

 agot_travel_events.3010.a.tt:0 "[first_duelist.GetNameNoTooltip] ile tekli dövüş başlayacak"

 agot_travel_events.3010.b:0 "Bir düşününce, araya girmem kabalıktı."

 agot_travel_events.3010.b.tt:0 "Tekli dövüşten çekineceksin"

 agot_travel_events.3012.t:0 "$agot_travel_events.3000.t$: Zafer"

 agot_travel_events.3012.desc:0 "Kılıçlarımız çarpışırken metal çınlaması havada yankılanır. İleri geri gideriz; kılıçlar aramızda bir bulanıklık içinde dans eder; tam bir berraklık anında bir açık görürüm. Silahım hedefini bulur ve düello biter. Galip olarak etrafıma bakındığımda, [3000_county_liege.GetNamePossessive] yüzünden bunun [3000_county_liege.GetSheHe]'in umduğu sonuç olmadığını anlarım. Yine de, bu zaferi lehime kullanmamak israf olur."

 agot_travel_events.3012.a:0 "Bu muydu [first_duelist.GetCulture.GetCollectiveNounNoTooltip]'in en iyisi? Acınası."

 agot_travel_events.3012.a.tt:0 "Hakaretin uzun süre hatırlanacak"

 agot_travel_events.3012.b:0 "Zayıf şef, zayıf birlik, [3000_county_liege.GetFirstNameNoTooltip]."

 agot_travel_events.3012.b.tt:0 "[3000_county_liege.GetNameNoTooltip] bu hakareti kolayca sineye çekmeyecek"

 agot_travel_events.3012.c:0 "Buradaki en iyiyim; bu artık benim savaşçı birliğim."

 agot_travel_events.3012.c.tt:0 "En iyi yarışmacıları yanına alacaksın"

 agot_travel_events.3012.d:0 "İyi dövüştün, [first_duelist.GetFirstNameNoTooltip]; [3000_county_liege.GetNameNoTooltip]'e iyi hizmet edeceksin."

 agot_travel_events.3012.d.tt:0 "[first_duelist.GetNameNoTooltip], [3000_county_liege.GetNameNoTooltip]'e katılacak"

 agot_travel_events.3013.t:0 "$agot_travel_events.3000.t$: Elendi"

 agot_travel_events.3013.desc:0 "Kılıcım yere takırdayarak düşer ve teslim olmak zorunda kalırım. Toplanan savaşçıların yargılayıcı bakışları ve gülen yüzleri karşısında yanaklarım taze bir utangaçlıkla kızarır. Böyle bir aşağılanmanın ardından gerçekten tek bir seçenek kalır."

 agot_travel_events.3013.a:0 "Hm, buradaki iyi işe devam edin; biz yola koyuluyoruz."

 agot_travel_events.3013.a.tt:0 "Aşağılanmış halde ayrılıyorsun"

 agot_travel_events.3014.t:0 "$agot_travel_events.3000.t$: Tekli Dövüş Geçersiz"

 agot_travel_events.3014.desc:0 "Bir şeyler ters gitti ve karşılaşma iptal edildi."

 agot_travel_events.3014.a:0 "Öyleyse yola koyulalım."

 agot_travel_events.3014.a.tt:0 "Yolculuğun devam ediyor"

 agot_travel_events.4000.t:0 "Ağaçlardaki Kahkaha"

 agot_travel_events.4000.desc:0 "Sık ormanın içinde ilerlerken izleniyor olma hissine kapılırım. Geçen her anla, ağaçların hışırtısı gittikçe daha çok fısıltı gibi gelmeye başlar — ve yol arkadaşlarımın yüzlerindeki endişeli ifadeler, onların da benim algımı paylaştığını gösterir. Tam o sırada, ormanın derinliklerinden bir çocuğa aitmiş gibi tiz bir kahkaha sesi bize ulaşır. Kısa süre sonra benzer çocuksu sesler, rahatsız edici biçimde dört bir yanımızda yankılanan, görünüşte eğlenen kıkırdamalar korosuna katılır."

 agot_travel_events.4000.unknownchildren.desc:0 "Ağaçların arasında herhangi bir siluet seçmeye çalışıyorum; ama orman çok sık. Kahkahanın kaynağı, ürkütücü olduğu kadar gizemli kalmaya devam ediyor."

 agot_travel_events.4000.knownchildren.desc:0 "Nerede olduğumuzu düşünürsek tek bir sonuca varılabilir: Bizi gizemli komşularımız Ormanın Çocukları izliyor."

 agot_travel_events.4000.a:0 "Bir [ROOT.Char.GetTitleAsNameNoTooltip|U]'ye gülmeye mi cüret ediyorsun? Gösteririm sana!"

 agot_travel_events.4000.a.first_ranger:0 "$first_ranger_landless_malee gülmeye mi cüret ediyorsun? Gösteririm sana!"

 agot_travel_events.4000.a.tt:0 "Bu küstahlığı cezalandırmak için seslerin peşinden koşuyorsun"

 agot_travel_events.4000.b:0 "Çocuklar tehdit değil; burada kamp kurabiliriz."

 agot_travel_events.4000.b.tt:0 "Gece için kampını her zamanki gibi kuruyor ve izleyicilerin merakını gidermesine izin veriyorsun"

 agot_travel_events.4000.c.knownchildren:0 "O küçük ucubeleler güvenilmez; aceleyle yola koyulalım."

 agot_travel_events.4000.c.unknownchildren:0 "Bu lanetli ormanlardan ayrılmalıyız."

 agot_travel_events.4000.c.tt:0 "Ekibine tempoyu artırmasını ve yoluna devam etmesini emrediyorsun"

 agot_travel_events.4001.t:0 "$agot_travel_events.4000.t$: Rüzgâr Kovalamak"

 agot_travel_events.4001.desc:0 "Öfkeye kapılıp, hınç dolu bir niyetle ağaçların arasına dalarım. Kıkırdamalar durmaz; ne kadar hızlı koşarsam koşayım, suçluları görüş alanına almak için fazlasıyla uzak kalırlar. Hayal kırıklığı öfkemi körükler; ama sonunda nefes alma ihtiyacı kovalamacanın önüne geçer ve ekibimi çok geride bıraktığımı fark ederim. Yalnızım; etrafımı, gözle görülür biçimde daha az eğlenen ve daha hor gören bir kahkaha çevreliyor."

 agot_travel_events.4001.a:0 "Kendinizi gösterin yoksa bütün bu ormanı yakarım!"

 agot_travel_events.4001.a.tt:0 "Sesleri saklandıkları yerden kışkırtarak çıkarmayı deniyorsun"

 agot_travel_events.4001.b:0 "Ben... kendimi bu duruma sokmamalıydım."

 agot_travel_events.4001.b.tt:0 "Aşağılanmış halde geri dönüş yolunu bulmaya çalışıyorsun"

 agot_travel_events.4002.t:0 "$agot_travel_events.4000.t$: Gülünecek Bir Şey Değil"

 agot_travel_events.4002.desc:0 "Kahkaha aniden kesilir. Bir an sonra, hafifçe bir fısıltı alışverişi duyarım; ardından, hep bir ağızdan ağacın gıcırdaması ve ağaca sürtünerek kayması gibi yadsınamaz bir ses gelir."

 agot_travel_events.4002.a:0 "Oh, sanıyorsun ki sen-#XB ACK!#!"

 agot_travel_events.4002.a.tt:0 "Çevrendeki orman kararırken, son bir kez patlak veren bir kahkaha salvosu duyarsın"

 agot_travel_events.4003.t:0 "$agot_travel_events.4000.t$: Şarkıyla Akşam"

 agot_travel_events.4003.desc:0 "Kamp alanına uygun ilk açıklığa ilerlerken fısıltılar ve kıkırdamalar peşimizi bırakmaz. Geceye hazırlanma çabamız, duyulur biçimde Çocuklar için azımsanmayacak bir eğlence kaynağıdır; her yeni işe başladığımızda kahkahalar yükselir, ama yerleştiğimizde azalır ve yerini biraz daha uzaktan gelen bir şarkı sesine bırakır. Meraklarını gideren Ormanın Çocukları, akşamlarını bizim sık sık yaptığımız gibi bir şarkıyı paylaşarak geçirmeye karar vermiş. Ama biz rekabet etmeye cesaret edemeyiz; çünkü şarkıları, hiçbirimizin duyduğu hiçbir şeyden daha güzel. Ateşin etrafında otururken, gözleri yaşaran [other_traveller.GetName]'in fısıldadığını duyarım: "Bunu dinlemeye devam etmek için her şeyi verirdim.""

 agot_travel_events.4003.a:0 "Bu vesileyle, bir armağan bırakmalıyız."

 agot_travel_events.4003.a.tt:0 "Çocuklar için biraz yedek yolculuk erzakı bırakacaksın"

 agot_travel_events.4003.b:0 "Bu kalitedeki ozanlar özel bir ödülü hak ediyor."

 agot_travel_events.4003.b.tt:0 "Ormanın Çocukları'na [artifact_gift.GetName] armağanını bağışlayacaksın"

 agot_travel_events.4003.c:0 "Şşşt... bırakalım sadece bunun tadını çıkaralım."

 agot_travel_events.4003.c.tt:0 "Şarkının seni uykuya beşik gibi sallamasına izin vereceksin"

 agot_travel_events.4004.t:0 "$agot_travel_events.4000.t$: Hoş Bir Uyanış"

 agot_travel_events.4004.desc:0 "Yeni bir gün doğar ve sabah kuşlarının cıvıltısı beni keyifli uykumdan uyandırır. Gözlerimi açmadan gülümsediğimi fark ederim. Kamp alanını gözden geçirdiğimde, maiyetimin de görünüşe göre benzer bir ruh hâlinde olduğunu görürüm. Ormanın Çocukları'nın sesi hiçbir yerden gelmez; ama dün akşamın anısı hâlâ sürer."

 agot_travel_events.4004.gotreward.desc:0 "\n\n Kampın kıyısındaki düz bir kayanın üzerine bıraktığın armağanın kaybolduğunu, yerinde ise bir deri bohça olduğunu fark edersin. Bohçayı açtığında içinden [reward_artifact.GetName] çıkar."

 agot_travel_events.4004.a.gotreward:0 "Ne cömertler."

 agot_travel_events.4004.a.noreward:0 "Güzelmiş."

 agot_travel_events.4004.a.tt:0 "Yolculuğun devam ediyor"

 travel_events.4012.desc_alt:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]'in vahşi topraklarında ilerlerken, kendimi izleniyor gibi belirgin bir hisle bulurum. Saklanarak, hem de kötüce, maiyetimizi izleyen cılız, kirli bir [feral_child_scope.Custom('GirlBoy')] görürüm.\n\nKervanımızın bir üyesi bana, yerlilerin bu toprakların [feral_child_scope.GetFirstNameNoTooltip] dedikleri biri tarafından perili olduğunu söylediğini aktarır; söylentiye göre insan toplumundan çok uzakta, bir [feral_child_scope.Custom('GetAnimalType')] tarafından büyütülmüş.\n\nGörünüşe göre zavallı yaratık bize hayranlık duymaya başlamış ve hatta kayda değer bir yetkinliğe ulaşmasa da biraz temel Ortak Dil konuşmaya başlamış."
