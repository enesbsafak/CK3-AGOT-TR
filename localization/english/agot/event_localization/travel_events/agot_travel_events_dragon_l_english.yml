l_english:

 agot_travel_events_dragon.0001.t:0 "Takla Atmak"

 agot_travel_events_dragon.0001.desc:0 "[pet_dragon.GetName] ile alttaki toprakların üzerinde süzülürken can sıkıntısı üzerime çökmeye başlıyor. Havalanmanın yeniliği geçti ve dengem oturmaya başladı. Ejderhalar, savaşta ya da avlanırken havada manevra yapma yetenekleriyle bilinir; ama bu tür numaralar bir ejderha binicisi için epey risk taşır.\n\nYine de, biraz eğlenmek yolculuğumu canlandırabilir."

 agot_travel_events_dragon.0001.a:0 "Bir takla atmaya ne dersin?"

 agot_travel_events_dragon.0001.b:0 "İhtiyatlı olmakta fayda var."

 agot_travel_events_dragon.0001.injury_warning:0 "@warning_icon! #X Yaralanabilirsin.#!"

 agot_travel_events_dragon.0001.success:0 "Başarı!"

 agot_travel_events_dragon.0001.success.flip_past:0 "[pet_dragon.GetName] takla atıyor!"

 agot_travel_events_dragon.0001.success.flip:0 "[pet_dragon.GetName] geriye yaslanıyor ve ben daha sıkı tutunurken [pet_dragon.GetHerHis] ağırlığının altımda kaydığını hissediyorum. Nefes kesen birkaç an boyunca yukarısı aşağı, aşağısı yukarı oluyor; gökyüzü beni alttan yutmakla tehdit ederken zemin başımın üstünde akıp geçiyor. Çok geçmeden her şey olması gerektiği gibi oluyor; [pet_dragon.GetNameNoTooltip] kendini doğrultup dümdüz ileri uçmaya dönüyor, ama yüreğim göğsümde heyecanla çarpıyor."

 agot_travel_events_dragon.0001.failure:0 "Başarısızlık!"

 agot_travel_events_dragon.0001.failure.flip_past:0 "[pet_dragon.GetName] takla atmayı başaramıyor..."

 agot_travel_events_dragon.0001.failure.flip:0 "[pet_dragon.GetName] geriye yaslanmaya başlıyor; ama ejderha [pet_dragon.Custom('GetDragonHerHis')] ağırlığını düzgünce kaydıramayıp gökyüzünde rahatsızca kıvrılınca ben telaşla tutunmaya çalışıyorum. Neredeyse ölüme düşüyorum; ama bacağım eyerimin kayışlarına acıyla takılıyor. Yeniden yukarı tırmanmak nahoş bir heyecan; neyse ki rotaya geri dönmeyi başarıyoruz."

 agot_travel_events_dragon.0001.no_attempt:0 "Gerek yok."

 agot_travel_events_dragon.0001.no_attempt.flip:0 "Risk etmeye değmez..."

 agot_travel_events_dragon.0005.t:0 "Gökyüzünün Güzelliği"

 agot_travel_events_dragon.0005.desc:0 "[pet_dragon.GetName] ile uçarken bulutları yarıyoruz ve ikimizi de harikulade bir manzara karşılıyor. Dört bir yanımız tanrıların tahtı sayılabilecek bir diyar; sert grilerle işaretlenmiş yumuşak beyaz duvarlar, altımızdaki topraklar ise canlanmış bir harita gibi uzanıyor."

 agot_travel_events_dragon.0005.a:0 "Her şey öyle sakin ki; her şeyden o kadar uzakta ki."

 agot_travel_events_dragon.0005.b:0 "Ne kadar muhteşem! Kadim ejderha binicilerinin diyarına ortak oluyorum!"

 agot_travel_events_dragon.0005.c:0 "Burada yukarıda olmak beni tanrılara yaklaştırıyor."

 agot_travel_events_dragon.0006.t:0 "Huzursuz Ejderha"

 agot_travel_events_dragon.0006.desc:0 "Uçuşumuz her şey yolunda giderken birden [pet_dragon.GetName] kişnemeye ve tepinmeye başlıyor — ormanların üzerinden geçerken huzursuzlaşıyor!\n\nAçlık, can sıkıntısı ya da sıkıntı yüzünden [pet_dragon.GetNameNoTooltip] kesinlikle aşağıdaki bir şeyle ilgili endişeli görünüyor. Ne yapmalıyım?"

 agot_travel_events_dragon.0006.a:0 "İlgilenmemiz gereken daha önemli işler var. Uçmaya devam et."

 agot_travel_events_dragon.0006.a.tt:0 "Gecikmeyeceksin; ama ejderhan, onu görmezden geldiğin için memnun olmayacak."

 agot_travel_events_dragon.0006.b:0 "İn, [pet_dragon.GetNameNoTooltip]. Seni ne tedirgin ediyor?"

 agot_travel_events_dragon.0006.b.tt:0 "Gecikeceksin."

 agot_travel_events_dragon.0007.t:0 "$agot_travel_events_dragon.0006.t$"

 agot_travel_events_dragon.0007.desc:0 "[pet_dragon.GetName] güm diye iniyor, beni eyerimde sarsıyor. Ejderhamın huzursuzluğunun kaynağını araştırınca...\n\nHiçbir şey bulamıyoruz... [pet_dragon.GetNameNoTooltip] hâlâ tedirgin görünüyor; ama [pet_dragon.Custom('GetDragonHerHis')] bedeni altımda gevşedikçe gerginliğin yavaşça azalmaya başladığını hissediyorum. Ejderhamı ürküten ne varsa ya gitmiş ya da hiç var olmamış; dizginleri yeniden elime alırken içimi bir hayal kırıklığı sızısı kaplıyor."

 agot_travel_events_dragon.0007.a:0 "Hepimiz zaman zaman hata yaparız. Bir zarar yok."

 agot_travel_events_dragon.0007.b:0 "Zevksiz yaratık. Geç kalmamız iyi olmaz."

 agot_travel_events_dragon.0008.t:0 "$agot_travel_events_dragon.0006.t$"

 agot_travel_events_dragon.0008.desc:0 "[pet_dragon.GetName] güm diye iniyor, beni eyerimde sarsıyor. Ejderhamın huzursuzluğunun kaynağını araştırınca...\n\n"

 agot_travel_events_dragon.0008.desc.pred:0 "[pet_dragon.GetNameNoTooltip] ve benim ani istilam karşısında açıkça tedirgin olmuş vahşi bir [ROOT.Char.Custom('RegionalFerociousAnimal')]. Muhtemelen boşuna ama bir o kadar vahşi bir meydan okuma gösterisiyle, iri canavar alçak bir uyarı hırıltısı çıkarıyor. Bir ejderhanın savaş ve kaçış arasındaki ilk tercihi genellikle savaşmaktır ve [pet_dragon.GetNameNoTooltip] bu cüretkâr meydan okumayı kabul edebilecek biri gibi görünüyor."

 agot_travel_events_dragon.0008.desc.prey:0 "[pet_dragon.GetNameNoTooltip] gibi bir tepe yırtıcısının ani varlığı karşısında buz kesen, ürkmüş bir [ROOT.Char.Custom('GetRandomRegionalSmallGame')]den başka bir şey değil. [pet_dragon.GetNameNoTooltip]'in dehşet içindeki hayvanı kısa sürede işini bitirmesi için tek bir emir yeter; ama gerçekten buna değer mi?"

 agot_travel_events_dragon.0008.a.valyrian:0 "#emp Dracarys!#!"

 agot_travel_events_dragon.0008.a:0 "Küle çevir onu, [pet_dragon.GetNameNoTooltip]!"

 agot_travel_events_dragon.0008.b:0 "Uç, [pet_dragon.GetNameNoTooltip]!"

 agot_travel_events_dragon.0008.c:0 "Zavallıcığı rahat bırak..."

 agot_travel_events_dragon.0009.t:0 "İnsan Gözetlemek"

 agot_travel_events_dragon.0009.desc:0 "Ejderha sırtında yolculuk bazen sıkıcı olabiliyor; ara sıra bir bulut dışında yoldaş yok ve onlar da pek iyi sohbetçi sayılmaz. Çoğu zaman, aşağıdaki zeminde bir insan izi arayarak ve seçebildiğim ayırt edici özellikleri not ederek vakit geçiriyorum — yüksekten bakınca hiç de kolay bir iş değil.\n\nBugün, zorlukla seçebildiğim bir yolcu fark ediyorum. Ama [pet_dragon.GetName] ona doğru çekilmiş görünüyor; ben de daha yakından bakmak için onu inişe geçmeye ikna ediyorum."

 agot_travel_events_dragon.0009.desc.good:0 "Yakına iniyorum ve kendisine [good_commoner.GetFirstNameNicknamed] diyen bir [good_commoner.GetWomanMan] tarafından sıcak bir karşılamayla karşılaşıyorum. [pet_dragon.GetNameNoTooltip] [good_commoner.GetHerHis] varlığında rahat görünüyor; ben de atlıyorum. Kısa bir sohbet için elbette vaktim vardır?"

 agot_travel_events_dragon.0009.desc.bad:0 "Yakına iniyorum ve kendini tanıtma nezaketi bile göstermeyen düşmanca bir [bad_commoner.GetWomanMan] tarafından karşılanıyorum. [pet_dragon.GetNameNoTooltip] endişeyle diken üstünde; ben de bu sıradan insanın iyi biri olmadığına dair içgüdüsel bir hisse kapılıyorum..."

 agot_travel_events_dragon.0009.desc.noble:0 "Yakına iniyorum ve bu topraklarda yerel biri olması gereken [noble.GetTitledFirstNameNicknamed] ile karşılaşıyorum. Belki [noble.GetSheHe] kaybolmuştur, belki de yalnızca iyi bir sohbete ihtiyacı vardır."

 agot_travel_events_dragon.0009.a:0 "Peki, kendinden bahset!"

 agot_travel_events_dragon.0009.b:0 "Bunun için vaktim yok."

 agot_travel_events_dragon.0009.c:0 "Çürük elmalarla başa çıkmanın tek bir yolu vardır!"

 agot_travel_events_dragon.0009.d:0 "Bu kişiyi bir hücreye koyacağım..."

 agot_travel_events_dragon.0009.e:0 "Bu küçük halk beni ilgilendirmemeli."

 agot_travel_events_dragon.0009.f:0 "Evinize dönmenize yardım edebilirim, [noble.GetLadyLord]."

 agot_travel_events_dragon.0009.g:0 "Belki bir sohbete vaktiniz vardır?"

 agot_travel_events_dragon.0009.g.modifier_desc:0 "[noble.GetName] ile bir sohbet gerçekleştirdi."

 agot_travel_events_dragon.0009.h:0 "En iyisi yoluma devam etmem..."

 agot_travel_events_dragon.0009.h.modifier_desc:0 "[noble.GetName]'i görmezden geldi."

 agot_travel_events_dragon.0011.t:0 "Bir Fırtına!"

 agot_travel_events_dragon.0011.desc:0 "Gökyüzü güzel ve uçsuz bucaksız olsa da, çoğu zaman karadan ve denizden daha hain olabilir. [pet_dragon.GetName] ve ben, tam altından uçarken belirmiş gibi görünen bir fırtınaya yakalanınca bunu ilk elden hatırlıyorum.\n\n[pet_dragon.GetNameNoTooltip], rüzgârlar hız kazanırken elinden gelenin en iyisini yapıp rüzgâra karşı uçmaya çalışıyor ve tepemizde gök gürlüyor. Uzak ufukta bir şimşek çakıyor; fırtınanın tehlikesini hatırlatıyor. Bu fırtınanın yakın zamanda geçmeyeceği açık; ama şanslıysak, gecikmek istemiyorsak sağ salim atlatabiliriz."

 agot_travel_events_dragon.0011.a:0 "İnmeliyiz ve geçmesini beklemeliyiz."

 agot_travel_events_dragon.0011.a.tt:0 "Üç ila yedi gün gecikeceksin; ama yaralanmayacaksın."

 agot_travel_events_dragon.0011.b:0 "İçinden uç!"

 agot_travel_events_dragon.0011.b.tt:0 "Yaralanma riski alacaksın; ama gecikme olmayacak."

 agot_travel_events_dragon.0013.t:0 "Yanlış Yol!"

 agot_travel_events_dragon.0013.desc:0 "Yolculuğumuzun son derece olaysız bir kısmı — o kadar ki [pet_dragon.GetName] sıkılmış görünüyor. Eyerde uzanırken [pet_dragon.Custom('GetDragonSheHe')] keskin bir virajla rotadan sapıyor!\n\nAni yön değişimi beni dalgınlığımdan sıçratıyor ve dizginlere uzanmaya zorluyor. [pet_dragon.GetNameNoTooltip] tereddütle amaçlanan rotamıza dönmeye başlarken emirler haykırıyorum."

 agot_travel_events_dragon.0013.a:0 "Oraya vardığımızda dilediğini yapmakta özgür olacaksın, [pet_dragon.GetNameNoTooltip]."

 agot_travel_events_dragon.0013.tt:0 "Yolculuğun gecikti."

 agot_travel_events_dragon.0021.t:0 "Oyunbaz Ejderha"

 agot_travel_events_dragon.0021.desc:0 "Özellikle sıradan bir toprak parçasının üzerinden uçarken [pet_dragon.GetName] bana tuhaf tuhaf bakmaya başlıyor. Ejderhamın, henüz bir yavruyken bana verdiği bakışlar bu; ve oynamak istediği anlamına geliyor. Onu suçlamak zor; bir ejderha, avlanmadığı, yemediği ya da savaşmadığı zamanlarda kolayca sıkılır. Ama [pet_dragon.GetNameNoTooltip] fazla oyalanırsa geç kalabiliriz."

 agot_travel_events_dragon.0021.a:0 "Ne zararı olabilir?"

 agot_travel_events_dragon.0021.a.tt:0 "[pet_dragon.GetName] ile oynayacaksın"

 agot_travel_events_dragon.0021.b:0 "Hayır, gitmemiz gereken yerler var."

 agot_travel_events_dragon.0021.b.tt:0 "[pet_dragon.GetName] ile oynamayacaksın"

 agot_travel_events_dragon.0022.t:0 "Oyunbaz Ejderha"

 agot_travel_events_dragon.0022.desc.played:0 "Sırıtıp eyer çantalarıma uzanıyorum. Çiğ etle getir-götür oynamak bizim için eski bir oyundur; ama [pet_dragon.GetNameNoTooltip] ve ben hâlâ bayılıyoruz. Havada uçuşan parçalar arasında bir keçi bacağı, bir yaban öküzü böğrü, hatta bir tavuk göğsü var — [pet_dragon.GetNameNoTooltip] bunları kapıp közleyip lokmaları bütünüyle yutuyor. Kimi zaman [pet_dragon.GetNameNoTooltip] hemen yakalamak için şaha kalkıyor; kimi zaman [pet_dragon.Custom('GetDragonSheHe')] bekleyip yere düşen eti kovalıyor. Nihayet [pet_dragon.GetNameNoTooltip] sakinleşiyor ve yolculuğumuza tazelenmiş halde dönüyoruz."

 agot_travel_events_dragon.0022.desc.no_play:0 "[pet_dragon.GetNameNoTooltip] yalvaran bakışını sürdürüyor; [pet_dragon.Custom('GetDragonHerHis')] gözleri neredeyse mahzunlaşıyor ve boğazından protesto edercesine yumuşak, homurtulu bir hırıltı yükseliyor. Ancak birkaç emirden sonra [pet_dragon.GetNameNoTooltip] nihayet pes edip başını çeviriyor ve varış noktamıza doğru uçmaya devam ediyor."

 agot_travel_events_dragon.0022.desc.fallback:0 "Dürüstçe söylemek gerekirse buna gerek yok, ama yine de, iyi kod yapısı adına. /omuz silker."

 agot_travel_events_dragon.0022.a:0 "Bu eğlenceliydi. Aferin, [pet_dragon.GetNameNoTooltip]."

 agot_travel_events_dragon.0022.b:0 "Bu yalvarış bir ejderhaya hiç yakışmıyor."

 agot_travel_events_dragon.0023.t:0 "Oyunbaz Ejderha"

 agot_travel_events_dragon.0023.desc:0 "Gece için kamp kurarken [pet_dragon.GetNameNoTooltip] ateşin yanında oturduğum yere ağır ağır yürüyor ve [pet_dragon.Custom('GetDragonHerHis')] burnuyla, ejderhamın sıkıldığını söyleyen çekingen ve hevesli bir biçimde beni dürtüyor. Doğal olarak [pet_dragon.Custom('GetDragonHerHis')] ilk içgüdüsü beni oynamaya ikna etmek. Ejderhalar birbirleriyle oynarken yemeklerini halat çekme oyununa çevirir; binicileriyle de pek farklı olmaz. Ama saat geç oldu ve uyku yakın; bu yüzden [pet_dragon.GetNameNoTooltip]'e sadece gözden kaybolmasını söyleyebilirim."

 agot_travel_events_dragon.0023.a:0 "Neden olmasın? Git kendine çekecek bir şey bul, [pet_dragon.GetNameNoTooltip]."

 agot_travel_events_dragon.0023.a.tt:0 "Bağı artırır ve ejderhan yorulabilir; bu da kampını bozma olasılığını azaltır."

 agot_travel_events_dragon.0023.b:0 "Hayır, uyumama izin ver, [pet_dragon.GetNameNoTooltip]."

 agot_travel_events_dragon.0023.b.tt:0 "Bağı azaltır ve ejderhan yorgun olmaz; bu da [pet_dragon.Custom('GetDragonHerHim')]'in kendi başına yaramazlık yapma olasılığını artırır."

 agot_travel_events_dragon.0024.t:0 "Oyunbaz Ejderha"

 agot_travel_events_dragon.0024.desc.played:0 "Emirlerimi harfiyen uygulayan [pet_dragon.GetNameNoTooltip] hevesle uçup gidiyor ve hiç şüphesiz kolayca koklayarak bulduğu ölü bir [ROOT.Char.Custom('GetRandomRegionalSmallGame')] ile geri dönüyor. [pet_dragon.GetNameNoTooltip] yaratığın başını bana uzatıyor; ben de kulaklarından tutup çekmeye başlıyorum. Elbette bu bir oyun; [pet_dragon.GetNameNoTooltip]'in doğal gücü benimkini kat kat aşıyor; yine de [pet_dragon.GetNameNoTooltip] kendini tutuyor ve en sonunda leşi ellerimden söküp gece atıştırmalığının tadını zaferle çıkarmak için uzaklaşıyor."

 agot_travel_events_dragon.0024.desc.no_play:0 "Elimi [pet_dragon.GetNameNoTooltip]'in beni dürtüklediği burnuna koyup iç çekiyorum. Yüksek Valyria dilim açık ve seçik; ama [pet_dragon.GetNameNoTooltip]'i dönüp beni yalnız bırakmaya ikna etmek birkaç emir alıyor. Gündüz ve gece uzundu; bir ejderhayla ölü bir av yüzünden güreşmek gerçekten çok fazla şey istemek olur."

 agot_travel_events_dragon.0024.desc.fallback:0 "Dürüstçe söylemek gerekirse buna gerek yok, ama yine de, iyi kod yapısı adına. /omuz silker."

 agot_travel_events_dragon.0024.a:0 "Ah, bir ejderhayla bağ kurmak gerçekten çok özel."

 agot_travel_events_dragon.0024.b:0 "Üzgünüm, [pet_dragon.GetNameNoTooltip], ama bir ejderha binicisi bile dinlenmek zorunda."

 agot_travel_events_dragon.0031.t:0 "Türbülans!"

 agot_travel_events_dragon.0031.desc:0 "Hava sakin ve istikrarlı — ta ki [pet_dragon.GetName] ve ben beklenmedik bir türbülans patlamasına yakalanana dek! Sert hava, kendimi bağlarken beni neredeyse eyerden fırlatıyor ve [pet_dragon.GetNameNoTooltip] protesto edercesine hırlayıp ani sert direnç karşısında kendini doğrultmaya çalışıyor.\n\nTürbülans beklediğimden daha sert ve daha uzun sürüyor; bu çile boyunca zemin bana davetkâr bir şekilde bakarken kendimi ejderhama karşı destekliyorum."

 agot_travel_events_dragon.0031.a:0 "Eğil, kaç, dal, yanla ve kaç!"

 agot_travel_events_dragon.0031.a.tt:0 "Gecikme ve yaralanma şansın var"

 agot_travel_events_dragon.0047.t:0 "Aç Ejderha!"

 agot_travel_events_dragon.0047.desc:0 "Gökyüzü çoğunlukla boş olsa da, bugün [pet_dragon.GetName] ve ben göç sırasındaki bir kuş sürüsüne rastlıyoruz — ve bir açlık kriziyle [pet_dragon.Custom('GetDragonColor')] bineğim, atıştırmalık umuduyla keskin dişleriyle onlara hamle yapıyor! Biraz disiplinsizce ama bir ejderhanın katil içgüdüleri bazen engellenemez."

 agot_travel_events_dragon.0047.a:0 "Onları gökten topla, [pet_dragon.GetNameNoTooltip]!"

 agot_travel_events_dragon.0047.a.tt:0 "Gecikeceksin; ama ejderhan bunu takdir edecek."

 agot_travel_events_dragon.0047.b:0 "Kendine hâkim ol!"

 agot_travel_events_dragon.0047.b.tt:0 "Gecikmeyeceksin; ama ejderhan bunu takdir etmeyecek."

 agot_travel_events_dragon.0048.t:0 "$agot_travel_events_dragon.0047.t$"

 agot_travel_events_dragon.0048.desc_fish:0 "Çoğu zaman bulutların arasında yükseklerde uçsak da, bugün [pet_dragon.GetName] tuzlu bir deniz melteminin estiği suyun yakınına iniyor. Berrak mavi dalgaların üzerinde süzülürken, aşağıda bir şey [pet_dragon.GetNamePossessiveNoTooltip] dikkatini çekiyor.\n\nAltımızda yüzen belirgin gölgeli bir şekil olduğuna göre, bir balık olduğundan şüpheleniyorum. Belki bir morina ya da çupra. En büyük av olmasa da, [pet_dragon.GetNamePossessiveNoTooltip] boş midesini kandırmaya yetecek."

 agot_travel_events_dragon.0048.desc_dolphin:0 "Çoğu zaman bulutların arasında yükseklerde uçsak da, bugün [pet_dragon.GetName] tuzlu bir deniz melteminin estiği suyun yakınına iniyor. Berrak mavi denizin üzerinden geçerken [pet_dragon.GetNamePossessive] midesi, gürültüsünü neredeyse [pet_dragon.Custom('GetDragonHerHim')]'in içinden hissedebileceğim kadar yüksek sesle guruldüyor.\n\nAşağıdaki sulara bakınca tanıdık bir manzara görüyorum: nefes almak için dalgaları yaran yunuslar. [pet_dragon.GetNameNoTooltip] de fark ediyor ve bu, aç ejderham için açıkça iştah açıcı bir görüntü."

 agot_travel_events_dragon.0048.desc_whale:0 "[pet_dragon.GetNamePossessive] koca kanatlarının açık deniz üzerindeki çırpışları, altımızdaki çarpan dalgalarla aynı şiddette. [pet_dragon.GetNameNoTooltip] kadar büyük bir ejderha gerçekten obur olabilir ve [pet_dragon.Custom('GetDragonSheHe')] aşağıda yüzeye çıkan devasa bir balina görünce bir açlık kriziyle aniden aşağı fırlayınca bunu net biçimde hatırlıyorum!\n\nBir balinayı denizden, kocaman bir üzüm tanesi gibi koparmak hiç de kolay bir iş olmazdı; ama [pet_dragon.GetNameNoTooltip] yeterince büyük ve güçlü; talihsiz leviathan, gökyüzünün kraliyet ailesi için krala layık bir ziyafetten başka bir şey olmayabilir."

 agot_travel_events_dragon.0048.a:0 "Ağını at, [pet_dragon.GetNameNoTooltip]!"

 agot_travel_events_dragon.0048.a.tt:0 "$agot_travel_events_dragon.0047.a.tt$"

 agot_travel_events_dragon.0048.b:0 "Kendine hâkim ol!"

 agot_travel_events_dragon.0048.b.tt:0 "$agot_travel_events_dragon.0047.b.tt$"

 agot_travel_events_dragon.0049.t:0 "$agot_travel_events_dragon.0047.t$"

 agot_travel_events_dragon.0049.desc:0 "Gökyüzü büyük ölçüde boş olsa da, altımızdaki yuvarlanan otlakların üzerinde [pet_dragon.GetName], aşağıdaki çiftlik hayvanlarını yakından fark ediyor. [pet_dragon.GetNamePossessiveNoTooltip] gözleri ve midesi önünde gerçek bir ziyafet gibi yayılan otlayan [ROOT.Char.Custom('RegionalFarmAnimalPlural')] tarlası var ve [pet_dragon.Custom('GetDragonColor')] koca canavar, [pet_dragon.Custom('GetDragonSheHe')] emrimi beklerken neredeyse havada salya akıtıyor."

 agot_travel_events_dragon.0049.a:0 "Çiftçiler bir ikisinin eksikliğini hissetmez..."

 agot_travel_events_dragon.0049.a.tt:0 "$agot_travel_events_dragon.0047.a.tt$"

 agot_travel_events_dragon.0049.b:0 "Kendine hâkim ol!"

 agot_travel_events_dragon.0049.b.tt:0 "$agot_travel_events_dragon.0047.b.tt$"

 agot_travel_events_dragon.0050.t:0 "$agot_travel_events_dragon.0047.t$"

 agot_travel_events_dragon.0050.desc:0 "Aşağıdaki gölgeli ormanların üzerinde süzülürken [pet_dragon.GetName] tedirgin bir haykırış çıkarıyor; bunu [pet_dragon.Custom('GetDragonHerHis')] açken ve avlanmaya hevesliyken çıkardığı olağan ses olarak anında tanıyorum. Bu dürtü o kadar güçlü ki [pet_dragon.GetNameNoTooltip] ağaçların üzerinde yavaşlıyor ve üzerinden geçen ani gölgede — o kadar yüksekten bile — görünür biçimde gerilen yalnız bir [ROOT.Char.Custom('GetRandomRegionalSmallGame')] fark ediyor. [pet_dragon.Custom('GetDragonColorGrade')] bineğimin onu mideye indirmesine izin vermek önemsiz bir mesele olurdu; ama gideceğimiz yerler var..."

 agot_travel_events_dragon.0050.a:0 "Zararı yok. Sonuçta bir ejderha, ancak bir ejderha olabilir."

 agot_travel_events_dragon.0050.a.tt:0 "$agot_travel_events_dragon.0047.a.tt$"

 agot_travel_events_dragon.0050.b:0 "Pöh, zamanımızı almaya değmez. İleri!"

 agot_travel_events_dragon.0050.b.tt:0 "$agot_travel_events_dragon.0047.b.tt$"

 agot_travel_events_dragon.0051.t:0 "$agot_travel_events_dragon.0047.t$"

 agot_travel_events_dragon.0051.desc:0 "[pet_dragon.GetNameNoTooltip] ve ben yolculuğumuza devam ederken, ejderhamın giderek daha çok yere baktığını fark ediyorum. [pet_dragon.GetNameNoTooltip]'in beni diyarın üzerinde taşırken acıktığı açık; çok geçmeden aşağıda kendi avıyla meşgul iri bir [ROOT.Char.Custom('RegionalFerociousAnimal')] görüyorum. Yaya olarak böyle bir [ROOT.Char.Custom('RegionalFerociousAnimal')] büyük bir tehlike olurdu; ama [pet_dragon.GetNameNoTooltip] için o, [pet_dragon.GetHerHis] dişlerinin ve alevinin insafına kalmış, yere bağlı başka bir canavardan ibaret."

 agot_travel_events_dragon.0051.a:0 "Alt edebiliriz, [pet_dragon.GetNameNoTooltip]!"

 agot_travel_events_dragon.0051.a.tt:0 "$agot_travel_events_dragon.0047.a.tt$"

 agot_travel_events_dragon.0051.b:0 "Bir düşününce, dışarıda daha iştah açıcı yemekler olabilir..."

 agot_travel_events_dragon.0051.b.tt:0 "$agot_travel_events_dragon.0047.b.tt$"

 agot_travel_events_dragon.0056.t:0 "Kuş Saldırısı!"

 agot_travel_events_dragon.0056.desc:0 "Gökyüzünün dinginliğinin tadını çıkarırken [pet_dragon.GetName] ve ben, kendisini ejderhamın dengi sanan çılgın bir yırtıcı kuşun saldırısına uğruyoruz! [pet_dragon.GetNameNoTooltip] ve ben onu yiğitçe savuştururken kuş öfkeyle gaklayıp kör bir hiddetle gagalıyor."

 agot_travel_events_dragon.0056.a:0 "Defol, pis yaratık!"

 agot_travel_events_dragon.0056.a.tt:0 "Gecikme ve yaralanma şansın var."

 agot_travel_events_dragon.9000.t:0 "Geri Bırakılanlar"

 agot_travel_events_dragon.9000.desc:0 "[awkward_entourage_member.GetName], yolculuğumuz için [dragon.GetFirstName]'i eyerlerken bana çekingen bir şekilde yaklaşıyor. "Ne yazık ki, [dragon.GetFirstNameNoTooltip]'i varış noktanıza götürmeyi seçtiğiniz için, ejderha binicisi olmayanlarımız yolculuklarınızda size eşlik edemeyecek. Saraya dönüşünüzü heyecanla bekleyeceğiz, [ROOT.Char.GetLadyLord|l].""

 agot_travel_events_dragon.9000.a:0 "Yazık."

 agot_travel_events_dragon.9000.tt:0 "[entourage_member.GetFirstName], maiyetten ayrılıyor."
