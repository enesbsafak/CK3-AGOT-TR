 agot_multi_duel.0030.desc.intro.a:0 "Kendimi zafer ile benim aramda duran [duelist_enemy.GetTitledFirstName] ile yüz yüze bulurum."

 agot_multi_duel.0030.desc.intro.b:0 "[duelist_enemy.GetTitledFirstName] ile yüzleşme zamanı geldi. Artık geri dönüş yok."

 agot_multi_duel.0030.desc.intro.c:0 "Karşımda, savaşa hazır kararlı bir rakip olan [duelist_enemy.GetTitledFirstName] duruyor."

 agot_multi_duel.0030.desc.intro.d:0 "[duelist_enemy.GetTitledFirstName] ile düelloya hazırlanırken gerginlik elle tutulur düzeyde."

 agot_multi_duel.0030.desc.intro.e:0 "İşte bu an. [duelist_enemy.GetTitledFirstName] ile ölümüne bir savaşta çatışmak üzereyiz."

 agot_multi_duel.0030.desc.intro.f:0 "Savaşa hazırlanırken [duelist_enemy.GetTitledFirstNamePossessive] gözlerinde soğuk bir kararlılık var."

 agot_multi_duel.0030.desc.intro.g:0 "Hazır duruyorum, [duelist_enemy.GetTitledFirstName] ile yüzleşiyorum; yalnızca birimizin buradan yürüyüp çıkacağını bilirim."

 agot_multi_duel.0030.desc.intro.h:0 "Artık yalnızca ben ve [duelist_enemy.GetTitledFirstName] varız. Bu düellonun sonucu her şeyi değiştirecek."

 agot_multi_duel.0030.desc.intro.i:0 "Bu ölümcül yarıştaki rakibim [duelist_enemy.GetTitledFirstName] ile yüzleşirken hava beklentiyle dolu."

 agot_multi_duel.0030.desc.intro.j:0 "[player_duelist.Custom('signature_weapon')] silahımı sıkıca kavrarım; [duelist_enemy.GetTitledFirstName]'in de aynısını yaptığını bilirim."

 agot_multi_duel.0030.desc.intro.k:0 "[duelist_enemy.GetTitledFirstName] ile göz göze gelirim; bu düellonun son düellom olabileceğini bilirim."

 agot_multi_duel.0030.desc.intro.l:0 "[duelist_enemy.GetTitledFirstName]'in karşısında dururken korkuya yer yok; yalnızca odaklanma var."

 agot_multi_duel.0030.desc.intro.m:0 "Savaşmaya hazırlanırken [duelist_enemy.GetTitledFirstNamePossessive] duruşundaki kararlılığı görebiliyorum."

 agot_multi_duel.0030.desc.intro.n:0 "[duelist_enemy.GetTitledFirstName] karşımdayken bunun kazanmam gereken bir savaş olduğunu bilirim."

 agot_multi_duel.0030.desc.intro.o:0 "Derin bir nefes alırım; [duelist_enemy.GetTitledFirstName] ile düelloya hazırlanırken kendimi toparlarım."

 agot_multi_duel.0030.desc.intro.p:0 "[duelist_enemy.GetTitledFirstName]'e, rakibime odaklanınca savaş alanı gözümden kaybolur."

 agot_multi_duel.0030.desc.intro.q:0 "Değerimi kanıtlama zamanı. [duelist_enemy.GetTitledFirstName] ile çatışmak üzereyiz."

 agot_multi_duel.0030.desc.intro.r:0 "Birçok zorlukla yüzleştim ama hiçbiri [duelist_enemy.GetTitledFirstName] gibi değildi."

 agot_multi_duel.0030.desc.intro.s:0 "[duelist_enemy.GetTitledFirstName] ile karşı karşıya geldiğimde içimde bir kararlılık dalgası hissederim."

 agot_multi_duel.0030.desc.intro.t:0 "Bundan kaçış yok. [duelist_enemy.GetTitledFirstName] ile savaşmak üzereyiz."

 agot_multi_duel.0030.desc.outro.a:0 "Savaşın eşiğinde dururken olacakların ağırlığını hissederim."

 agot_multi_duel.0030.desc.outro.b:0 "Çatışmaya hazırlanırken dünya nefesini tutmuş gibi. Gerginlik boğucu ama bir o kadar da canlandırıcı. Önümüzdeki anların her şeyi tanımlayacağını biliyorum."

 agot_multi_duel.0030.desc.outro.c:0 "Soğuk bir rüzgâr esiyor; savaşılıp kazanılmış sayısız muharebenin ağırlığını taşıyor. Bu da farksız; yine de her şey kıldan ince bir ipe bağlıymış gibi hissettiriyor."

 agot_multi_duel.0030.desc.outro.d:0 "Her kalp atışıyla gerçeğin anı yaklaşıyor. Ellerimdeki gücü, irademin kuvvetini hissedebiliyorum."

 agot_multi_duel.0030.desc.outro.e:0 "Çevremizdeki savaş alanı önemsizleşip söner. Geriye yalnızca ben ve [duelist_enemy.GetTitledFirstNameNoTooltip] kalır; her birimiz bizi bu ana getiren güçlerce sürükleniyoruz."

 agot_multi_duel.0030.desc.outro.f:0 "Hava şiddetin vaadiyle yüklü. Yaptığımız her şey, olduğumuz her şey bu ana çıkar. Kaslarımdaki gerginliği, duruşumdaki hazırlığı hissedebiliyorum."

 agot_multi_duel.0030.desc.outro.g:0 "Her nefes, her saniye bizi kaçınılmaz çatışmaya yaklaştırıyor. Tereddüt edecek zaman kalmadı."

 agot_multi_duel.0030.desc.outro.h:0 "[player_duelist.Custom('signature_weapon')] silahımın ağırlığı hiç olmadığı kadar fazla geliyor — fiziksel kütlesinden değil, olacakların yükünden."

 agot_multi_duel.0030.desc.outro.i:0 "Bu, bizi bu noktaya getiren her şeyin doruğudur. Önümüzdeki muharebe yalnızca hayatta kalmayla ilgili değil; kaderle, kim olduğumuzla ve neyi temsil ettiğimizle ilgilidir."

 agot_multi_duel.0030.desc.outro.j:0 "Fırtınadan önceki sessizlikte düşüncelerimi ve cesaretimi toplarım. Olacakların gerçeğinden kaçış yok."

 agot_multi_duel.0030.desc.outro.k:0 "Dünya bu tek, ürkütücü ana kadar daralır. Savaşın tüm gürültüsü, tüm kaosu arka plana çekilir."

 agot_multi_duel.0030.desc.outro.l:0 "Vurmaya hazırlanırken olacakların dehşeti çöker üzerime. Bu yalnızca bir muharebe değil; bir yolculuğun sonu, güç ve iradenin son sınavı."

 agot_multi_duel.0030.desc.outro.m:0 "Gerginlik dayanılmaz; yine de sakin kalmaya zorlarım kendimi. Daha önce zorluklarla yüzleştim ama hiçbiri bunun gibi değildi."

 agot_multi_duel.0030.desc.outro.n:0 "Düello yaklaşırken zaman yavaşlıyor gibi. Zihnimde her ayrıntı keskinleşir — [player_duelist.Custom('signature_weapon')] silahımın ağırlığı, ayaklarımın altındaki zemin, [duelist_enemy.GetTitledFirstNamePossessiveNoTooltip] gözlerindeki kararlılık."

 agot_multi_duel.0030.desc.outro.o:0 "Beklenti, kıvrılmış ve vurmaya hazır canlı bir şey gibi. Varlığımın her zerresinde hissederim: Bu düellonun diğerlerinden farklı olacağı kesin."

 agot_multi_duel.0030.desc.outro.p:0 "Karşı karşıya dururken kaderin ağırlığı çöker üzerime. Bu yalnızca bir düello değil; bir yol ayrımı, hayatlarımızın gidişatını belirleyecek bir an."

 agot_multi_duel.0030.desc.outro.q:0 "Fırtınadan önceki sessizlik sağır edicidir; gelecek şiddeti gizleyen bir durgunluk. Bu anda açıktır ki düellodan başka hiçbir şeyin önemi yok."

 agot_multi_duel.0030.desc.outro.r:0 "Geçen her saniyeyle kaçınılmaz yaklaşıyor. Düello bir kavgadan fazlasıdır; öğrendiğim her şeyin, olduğum her şeyin sınavıdır."

 agot_multi_duel.0030.desc.outro.s:0 "Bu anda bir kesinlik var; her şeyin bu noktaya çıktığı hissi."

 agot_multi_duel.0030.desc.outro.t:0 "[duelist_enemy.GetTitledFirstNameNoTooltip] ile yüzleşmeye hazırlanırken yaptığım her seçimin ağırlığını hissederim."

 agot_multi_duel.0030.desc.outro2.a:0 "\n\nHer karar, her hamle yalnızca bu düellonun sonucunu değil, önümüzde uzanan yolu da belirleyecek. Hataya yer yok."

 agot_multi_duel.0030.desc.outro2.b:0 "\n\nZafer yalnızca onu kapabilenin olacak."

 agot_multi_duel.0030.desc.outro2.c:0 "\n\nKararlılığım sertleşir. Buradan ayrılan kişi ben olmalıyım."

 agot_multi_duel.0030.desc.outro2.d:0 "\n\nAma bu yeterli olacak mı? Yakında soru kalmayacak; yalnızca düellonun soğuk gerçeği olacak."

 agot_multi_duel.0030.desc.outro2.e:0 "\n\nYalnızca biri galip çıkacak ve ortaya konanların bedeli bundan daha yüksek olamaz."

 agot_multi_duel.0030.desc.outro2.f:0 "\n\nKimin daha güçlü olduğunu kanıtlama zamanı."

 agot_multi_duel.0030.desc.outro2.g:0 "\n\nDüello başlayacak ve yalnızca birimiz sonunu görecek. O kişinin ben olacağına kararlıyım."

 agot_multi_duel.0030.desc.outro2.h:0 "\n\nDüello yalnızca bir kavga değildir; çelik ve hünerle verilen bir yargı, bir hesaplaşmadır."

 agot_multi_duel.0030.desc.outro2.i:0 "\n\nHarekete geçme zamanı geldi."

 agot_multi_duel.0030.desc.outro2.j:0 "\n\nÇarpışan iki gücüz ve toz yatıştığında ayakta kalan yalnızca birimiz olacak."

 agot_multi_duel.0030.desc.outro2.k:0 "\n\nŞimdi önemli olan önümüzdeki düello; birimizin düşeceği sınav alanı."

 agot_multi_duel.0030.desc.outro2.l:0 "\n\nHazır olduğumu ummaktan başka çarem yok."

 agot_multi_duel.0030.desc.outro2.m:0 "\n\nBu düello belirleyici an olacak; beni ya kıracak ya da zafere ulaştıracak savaş."

 agot_multi_duel.0030.desc.outro2.n:0 "\n\nSırada ne varsa ondan kaçış yok."

 agot_multi_duel.0030.desc.outro2.o:0 "\n\nBu, her şeyi değiştirecek bir andır."

 agot_multi_duel.0030.desc.outro2.p:0 "\n\nNefesimi düzene sokarım; sıradakinin beni tanımlayacağını bilirim."

 agot_multi_duel.0030.desc.outro2.q:0 "\n\nSonuç, ikimizin de öngöremeyeceği biçimlerde geleceği şekillendirecek."

 agot_multi_duel.0030.desc.outro2.r:0 "\n\nBunu sonuna kadar götürecek kadar güçlü olduğumu ummaktan başka çarem yok."

 agot_multi_duel.0030.desc.outro2.s:0 "\n\nDüello yalnızca zafer ya da yenilgiyle ilgili değildir; temel bir şeyi kanıtlamakla ilgilidir — kendime ve [duelist_enemy.GetTitledFirstNameNoTooltip]'e."

 agot_multi_duel.0030.desc.outro2.t:0 "\n\nBu düello en büyük sınav olacak; beni ya yaratacak ya da yok edecek an."

 agot_multi_duel.1000.b:0 "Belki de şimdi teslim olmak daha akıllıca."

 agot_multi_duel.0030.a.a:0 "Ve şimdi başlıyor."

 agot_multi_duel.0030.a.b:0 "Gel üstüme!"

 agot_multi_duel.0030.a.c:0 "Savaşma zamanı."

 agot_multi_duel.0030.a.d:0 "Artık oyun yok."

 agot_multi_duel.0030.a.e:0 "Bu burada bitiyor."

 agot_multi_duel.0030.a.f:0 "Şimdi bitiyor."

 agot_multi_duel.0030.a.g:0 "Onur için!"

 agot_multi_duel.0030.a.h:0 "Yüzleş benimle!"

 agot_multi_duel.0030.a.i:0 "Hazırım."

 agot_multi_duel.0030.a.j:0 "Ölümüne!"

 agot_multi_duel.0030.a.k:0 "Bu şimdi bitiyor."

