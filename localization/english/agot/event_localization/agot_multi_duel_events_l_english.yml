l_english:

 agot_multi_duel.header:0 "[background_terrain_scope.GetNameNoTooltip]'te Çatışma"

 agot_multi_duel.tos_header:0 "Yediler Yargılaması"

 agot_multi_duel.1002.a.t:0 "$agot_multi_duel.tos_header$: Hâlâ Ayakta"

 agot_multi_duel.1002.desc.tos.stands_winner_pov:0 "[loser_multi_duelist.GetTitledFirstName]'i yere serdim; çatışmanın bittiğinden emindim. Bir anlığına [loser_multi_duelist.GetSheHe], savaşın karmaşasının ortasında hareketsiz yattı.\n\nSonra [loser_multi_duelist.GetSheHe] ayağa kalkar. Kanlar içinde, dengesiz ama yeniden ayakta; acı ve mantık sanki bir kenara atılmış gibi kendini mücadeleye geri sokar."

 agot_multi_duel.1002.desc.tos.stands_loser_pov:0 "[winner_multi_duelist.GetTitledFirstNamePossessive] darbesi beni yere serer; çelik ve gürültü çevremde çarpışırken dünya dönmeye başlar. Bir an için mücadelenin bittiğini hissederim.\n\nKendimi acıya rağmen yukarı zorlarım; nefesim kesik, kollarım ve bacaklarım isyan eder. Ne gelirse gelsin, yerde kalmayacağım."

 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend:0 "[loser_multi_duelist.GetTitledFirstName]'i yere serdim; çatışmanın bittiğinden emindim. Bir anlığına [loser_multi_duelist.GetSheHe], savaşın karmaşasının ortasında hareketsiz yattı."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend:0 "[winner_multi_duelist.GetTitledFirstNamePossessive] darbesi beni yere serer; çelik ve gürültü çevremde çarpışırken dünya dönmeye başlar. Bir an için mücadelenin bittiğini hissederim."

 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_1:0 "\n\nGürültüyü yarar bir ses; [loser_duelist_friend.GetTitledFirstName] kalabalıktan bağırır.\n\n#EMP "Kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Bu mücadele senin kaybetmen için değil!"#! \n\nVe [loser_multi_duelist.GetSheHe] her nasılsa ayağa kalkar. Kanlar içinde, dengesiz ama yeniden ayakta; acı ve mantık sanki bir kenara atılmış gibi kendini mücadeleye geri sokar."

 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_2:0 "\n\nÇatışmanın ortasında bir haykırış yankılanır; [loser_duelist_friend.GetTitledFirstName] kalabalığın içinden seslenir.\n\n#EMP "Ayağa kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Düşeceğin yer burası değil!"#! \n\nTüm mantığa rağmen [loser_multi_duelist.GetSheHe], düello yeniden başlarken hırpalanmış ama boyun eğmemiş halde kendini yeniden dik tutar."

 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_3:0 "\n\nÇeliğin gümbürtüsünün üzerinden [loser_duelist_friend.GetTitledFirstNamePossessive] sesi net bir şekilde çınlar.\n\n#EMP "Kalk, ser! Onlara hâlâ ayakta olduğunu göster!"#! \n\nBir an sonra [loser_multi_duelist.GetSheHe], sendeleyerek ama savaşmaya hazır halde yeniden [loser_multi_duelist.GetHerHis] ayaklarının üzerine çıkar."

 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_4:0 "\n\nGürültüyü yırtan çaresiz bir haykırış yükselir; [loser_duelist_friend.GetTitledFirstName], [loser_multi_duelist.GetHerHim]'i yüreklendirir.\n\n#EMP "Kalk artık! Yedi seni izliyor — teslim olma!"#! \n\nKesik kesik bir nefesle [loser_multi_duelist.GetSheHe], çatışmanın bitmesine izin vermeyerek bir kez daha ayağa kalkar."

 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_5:0 "\n\nKalabalığın kenarından [loser_duelist_friend.GetTitledFirstName] ateşli bir kararlılıkla bağırır.\n\n#EMP "Kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Kalk ve onlarla yüzleş!"#! \n\nYavaşça ve inatla [loser_multi_duelist.GetSheHe] dengesini toplar ve mücadeleye geri adım atar."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_1:0 "\n\nBuğunun arasından [loser_duelist_friend.GetTitledFirstName]'in kaosun üzerinde bağırdığını duyarım.\n\n#EMP "Kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Kalk ve savaş!"#! \n\nSes sisi yarar; acının içinden kendimi doğrulturum, nefesim kesik, kollarım ve bacaklarım isyan eder. Ne gelirse gelsin, yerde kalmayacağım."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_2:0 "\n\nKaosun ortasında [loser_duelist_friend.GetTitledFirstNamePossessive] sesi bana ulaşır.\n\n#EMP "Kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Henüz yenilmedin!"#! \n\nSözler buğuyu yakıp geçer ve mücadelenin burada bitmesine izin vermeyerek kendimi doğrulturum."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_3:0 "\n\nKulaklarımdaki çınlamayı tanıdık bir ses yarar; [loser_duelist_friend.GetTitledFirstName], sert ve boyun eğmez.\n\n#EMP "Kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Ayağa kalk ve savaş!"#! \n\nDişlerimi sıkarak kendimi yeniden ayağa çekerim; her hareketimin peşinden acı sürüklenir."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_4:0 "\n\nÇelik çatırtısının üzerinden [loser_duelist_friend.GetTitledFirstName]'in adımı seslendiğini duyarım.\n\n#EMP "Dik dur! Şimdi düşme!"#! \n\nBu haykırış beni ayakta tutar ve acıyı geride bırakıp bir kez daha ayağa kalkarım."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_5:0 "\n\nGürültünün ötesinde bir yerlerden [loser_duelist_friend.GetTitledFirstName] çaresiz bir telaşla bağırır.\n\n#EMP "Kalk, [loser_multi_duelist.GetTitledFirstNameNoTooltip]! Mücadele senin — ayağa kalk!"#! \n\nSözler sisi yarar ve kendimi doğrulturum; nefesim kesik ama kararlılığım kırılmamış."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_1:0 "\n\nBir anlığına dünya söner; eğitim alanında, topraktan kalkmaya çabalamamı izleyen [my_teacher_knight.GetTitledFirstName]'in üzerimde durduğunu görürüm. [my_teacher_knight.GetSheHe|U] başını sallar; sesi sağlam ve tanıdıktır.\n\n#EMP "Kalk. Bir şövalye ne kadar sert düşerse düşsün ayağa kalkar."#! \n\nÇelik duyularıma yeniden çarpar ve anı paramparça olur. Kesik bir nefes alır, elimi ezilmiş toprağa dayar ve kendimi bir kez daha doğrulturum."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_2:0 "\n\nKaranlık üzerime çöker; ta ki [my_teacher_knight.GetTitledFirstNamePossessive] sesi onu yarana dek; sakin ve boyun eğmez, tıpkı her çürüğün bir ders, her düşüşün yeni bir komut olduğu eski günlerdeki gibi.\n\n#EMP "Acı geçer. Ayakta durmak bir seçimdir."#! \n\nSavaşın gümbürtüsü keskin ve ezici bir halde geri döner. Dişlerimi sıkarak sızının içinden geçer ve kendimi ayaklarıma çekerim."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_3:0 "\n\nBir an için artık savaş alanında değil, uzak bir anının tozundayım; [my_teacher_knight.GetTitledFirstName], kılıca layık olduğumu kanıtlamak için çabalarken beni kollarını kavuşturmuş halde izliyor.\n\n#EMP "Tekrar. Yerde kalmamayı öğrenene dek."#! \n\nÇeliğin çatırtısı anıyı silip atar. Ciğerlerim yanarak sendeleye sendeleye doğrulurum; dersin burada bitmesine izin vermem."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_4:0 "\n\nGürültü kaybolur ve [my_teacher_knight.GetTitledFirstNamePossessive] sesini, [my_teacher_knight.GetSheHe], bitkinlik beni ele geçirmek üzereyken beni ileri ittiği, çoktan unutulmuş bir yolda yanımda duruyormuşçasına net duyarım.\n\n#EMP "Gerçek bir şövalye dayanır."#! \n\nÇelik çınlaması ve bağırılan emirlerle şimdi geri çarpıverir. O eski güçten güç alarak kollarımı ve bacaklarımı itaat ettirir ve bir kez daha ayağa kalkarım."

 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_5:0 "\n\nBir anlığına savaş yok olur; yerini, başarısız bir idman karşılaşmasının ardından el uzatmak yerine sessizce ayağa kalkmamı bekleyen [my_teacher_knight.GetTitledFirstName]'in sert bakışı alır.\n\n#EMP "Merhamet bekleme. Kalk."#! \n\nGörüntü duman gibi sönerken şimdinin ağırlığı geri döner. Sert bir nefes ve titreyen bir kararlılıkla kendimi doğrultur ve mücadeleye geri dönerim."

 agot_multi_duel.1002.a:0 "Mücadele sürüyor."

 agot_multi_duel.1003.a.t:0 "$agot_multi_duel.tos_header$: Yere Serilmiş"

 agot_multi_duel.1003.desc.tos.downed_winner_pov:0 "[loser_multi_duelist.GetTitledFirstName] yeniden ayağa kalkmayı dener ama güç tükenmiştir. [loser_multi_duelist.GetHerHim] ayakta tutan ne varsa sonunda başarısız olmuştur ve [loser_multi_duelist.GetSheHe] yeniden yere düşer.\n\nMücadele bitmiştir. [loser_multi_duelist.GetSheHe|U] hâlâ nefes almaktadır ama artık çeliğe çelikle karşılık veremez."

 agot_multi_duel.1003.desc.tos.downed_loser_pov:0 "Kendimi yukarı zorlarım ama bedenim bana itaat etmez. Acı her şeyi bastırır ve kollarım, bacaklarım artık emir dinlemez.\n\nMücadele bensiz sürmüş ve burada sona eriyor. Üzerimde, ulaşamayacağım bir zaferin tadını alan, kanlar içinde ama kırılmamış [winner_multi_duelist.GetTitledFirstName]'i görüyorum."

 agot_multi_duel.1003.a:0 "Biri daha ayakta kalmayacak."

 agot_multi_duel.1004.a.t:0 "$agot_multi_duel.tos_header$: Geri Alınan Suçlama"

 agot_multi_duel.1004.desc.tos.yields_winner_pov:0 "[loser_multi_duelist.GetTitledFirstName] sonunda pes eder; [loser_multi_duelist.GetHerHis] gücü tükenmiş, [loser_multi_duelist.GetHerHis] iradesi kırılmıştır. Çelik bir kez daha yanıt veremeden [loser_multi_duelist.GetSheHe] teslim olur.\n\nSözler kısa süre sonra gelir. [tos_accused.GetTitledFirstName]'e yöneltilen suçlama geri çekilir ve meydan okuma alemin gözü önünde terk edilir. Sorgulanan şey artık tartışılmaz ve Yedilerin Yargılaması kanla değil teslimiyetle sona erer."

 agot_multi_duel.1004.desc.tos.yields_loser_pov:0 "Güç beni terk eder; onunla birlikte beni buraya kadar taşıyan kesinlik de. [loser_multi_duelist.Custom('signature_weapon')] silahımı indirir ve ayakta durmaktan kazanılacak bir şey kalmadığını bilerek teslim olurum.\n\nİzleyen herkesin önünde iddiamı geri çeker ve [tos_accused.GetTitledFirstName]'e karşı çağırdığım yargılamadan vazgeçerim. Kanıtlamaya çalıştığım gerçek, benim elimle kanıtlanmayacak. Yedilerin Yargılaması burada, benim teslimiyetimle sona erer."

 agot_multi_duel.1004.desc.tos.yields_observer_pov:0 "Çatışma yavaşlar, sonra durulur. Yargılamayı çağıran ve [tos_accused.GetTitledFirstName]'e yöneltilen suçlamayı alemin önüne koyan [loser_multi_duelist.GetTitledFirstName] sonunda teslim olur.\n\nBu teslimiyetle iddianın kendisi de geri çekilir. Yedilerin Yargılaması son darbeyle değil, suçlayanın kendi sözlerinin başlatılanı bozmasıyla sona erer. Tanıklık eden herkesin önünde mesele çözülür ve suçlama ortadan kalkar."

 agot_multi_duel.1004.a:0 "Yargılama burada sona eriyor."

 agot_multi_duel.1005.t.tos:0 "$agot_multi_duel.tos_header$: Bozulan Yargılama"

 agot_multi_duel.1005.desc.tos:0 "Yedilerin Yargılaması sonuna erdirilemeden, [dead_enemy_leader.GetTitledFirstName]'in alanın dışında öldüğü haberi ulaşır. Şans, talihsizlik ya da tamamen başka bir el yüzünden olsun, şampiyonları bir araya çağıran dava artık geçerli değildir.\n\nİddiaya karşılık verecek ne bir suçlayan ne de bir suçlanan kaldığı için yargılama süremez. Toplanan kılıçlar salıverilir ve çelikle karara bağlanması gereken mesele, sessizliğe gömülür."

 agot_multi_duel.1005.a:0 "Bitti."

