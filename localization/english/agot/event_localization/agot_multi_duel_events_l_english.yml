 agot_multi_duel.0100.desc.accuser_yielded:0 "Çatışma bir darbe daha olmadan sona erer. [main_loser_leader.GetTitledFirstName], [main_loser_leader.GetHerHis] [main_loser_leader.Custom('signature_weapon')] silahını indirip çeliği alana getiren iddiadan geri adım atarak alemin önünde teslim olur.\n\nArdından gelen sözler her darbeden daha önemlidir. Suçlama tanrıların ve insanların gözü önünde geri çekilir ve Yedilerin Yargılaması kanla değil teslimiyetle bozulur. Haklı çıkarım; adım bir fermanla değil, suçlayanın kendi geri çekilişiyle temizlenir. Alem, aleyhimdeki iddianın [main_loser_leader.GetTitledFirstNamePossessiveNoTooltip] kendi sözleriyle ortadan kaldırılışına tanıklık eder."

 agot_multi_duel.0100.desc.accuser_downed:0 "Mücadele [main_loser_leader.GetTitledFirstName]'i alanda kırılmış halde bırakır; gücü tükenmiştir ve bir daha ayağa kalkamaz. [main_loser_leader.GetHerHim]'i bu yargılamaya taşıyan kararlılık neyse sonunda başarısız olmuştur.\n\nSuçlayan devam edemeyince Yedilerin Yargılaması sonuna ulaşır. Yasaya ve töreye göre iddia, [main_loser_leader.GetTitledFirstNamePossessiveNoTooltip] yenilgisiyle birlikte düşer. Bu çelik yargısını izleyen herkesin önünde haklı çıkarım; davam sözlerle değil, en önemli anda dayanmakla kazanılmıştır."

 agot_multi_duel.0100.desc.accuser_dead:0 "Son çatışma [main_loser_leader.GetTitledFirstName]'i alanda düşmüş halde bırakır; bu yargılamayı çağıran ses sonunda susturulmuştur.\n\nSuçlayan gitmişken Yedilerin Yargılaması kan ve kesinlikle sona erer. Yanıtlanacak bir meydan okuma, tartışılacak bir iddia kalmamıştır. Yalnızca hayatta kalarak haklı çıkarım; antların ve suçlamaların bir zamanlar başarısız olduğu yerde davam kanıtlanır ve alem, hükmün nereye düştüğüne dair şüphesiz kalır."

 agot_multi_duel.0100.desc.accused_downed:0 "[main_loser_leader.GetTitledFirstName] savaş alanında yere serilir; mücadele [main_loser_leader.GetHerHim] son kez terk ederken gücü tükenir. Çatışma, [main_loser_leader.GetHerHim] ayakta duramaz hale gelmesiyle sona erer.\n\nYedilerin Yargılaması sonunda hükmünü verir. Suçlananın ayakta kalamadığı yerde ben ayakta duruyorum; çelik ve töre gereği suçluluk [main_loser_leader.GetTitledFirstNamePossessiveNoTooltip] adına yazılmıştır. Alemin önünde öne sürdüğüm iddia kanıtlanmış ve talep ettiğim hüküm verilmiştir."

 agot_multi_duel.0100.desc.accused_dead:0 "Düello kanla sona erer; [main_loser_leader.GetTitledFirstName], aleyhinde çağrılan yargının altında düşer. Anın anlamı yerine otururken alan durulur.\n\nYedilerin Yargılaması sonunda karara bağlanır. Suçlananın ayakta kalamadığı yerde galip ben duruyorum ve iddia herkesin görebileceği biçimde alanda kanıtlanmıştır. Daha fazla söze gerek yok, şüphe kalmamıştır. Alemin yanıtı çeliğe açıkça yazılmıştır."

 agot_multi_duel.0100.desc.accuser_yielded.observer:0 "[main_loser_leader.GetTitledFirstName], izleyen herkesin önünde [main_loser_leader.GetHerHis] [main_loser_leader.Custom('signature_weapon')] silahını indirip teslim olunca çatışma durulur. Çelik sesi söner; anın anlamı alana çökerken yerini gergin bir sessizliğe bırakır.\n\nSuçlama geri çekilince Yedilerin Yargılaması kendi içinde çöker. [main_winner_leader.GetTitledFirstName]'e yöneltilen iddia kanla değil, suçlayanın teslimiyetiyle bozulur. Tanrıların ve insanların önünde mesele bir darbe daha atılmadan çözülür ve alem, çelik yerine sözlerle söylenen bir hükümle baş başa kalır."

 agot_multi_duel.0100.desc.accuser_downed.observer:0 "[main_loser_leader.GetTitledFirstName] yere yığılır ve bir daha ayağa kalkamaz. Alan, gelmeyen bir hareketi bekleyerek gergin bir sessizlikte kalır.\n\nYedilerin Yargılaması, suçlayanın savaş alanında yenilmesiyle sona erer. Töre ve yasaya göre, şampiyonu dayanamayan iddia geçersiz kalır. [main_winner_leader.GetTitledFirstName] alemin gözü önünde haklı çıkar; suçlama, diğerinin sendelemesine rağmen ayakta kalan güçle yanıtlanmıştır."

 agot_multi_duel.0100.desc.accuser_dead.observer:0 "Son değiş tokuş [main_loser_leader.GetTitledFirstName]'i alanda düşmüş halde bırakır; onunla birlikte bu yargılamayı var eden ses de düşer. Alan, anın kesinliğini özümserken çatışma sona erer.\n\nYedilerin Yargılaması kanla karara bağlanır. Suçlayanın ayakta kalamadığı yerde [main_winner_leader.GetTitledFirstName] ayakta kalır; iddia yalnızca hayatta kalarak yanıtlanır. Daha fazla hükme gerek yoktur ve alem, çeliğe açıkça yazılmış bir karara tanıklık eder."

 agot_multi_duel.0100.desc.accused_downed.observer:0 "[main_loser_leader.GetTitledFirstName] yere serilir ve mücadeleye devam edemez. Çatışma, suçlananın iddiaya karşı ayağa kalkamayacağı açıkça belli olana dek sönüp gider.\n\nYedilerin Yargılaması sonunda hükmünü verir. [main_winner_leader.GetTitledFirstName] tüm tanıkların önünde galip durur ve suçluluk alemin gözü önünde sabit olur. Sorgulanan şey artık hiçbir belirsizliğe yer bırakmadan yanıtlanmıştır."

 agot_multi_duel.0100.desc.accused_dead.observer:0 "Düello, [main_loser_leader.GetTitledFirstName]'in alanda yere serilmesiyle sona erer; son darbe, iddiaya yönelik daha fazla inkârın önünü keser.\n\nYedilerin Yargılaması kan ve kesinlikle sonuçlanır. Suçlama çelikle kanıtlanır ve alem seyrederken [main_winner_leader.GetTitledFirstName] galip çıkar. Hükmün nereye düştüğüne dair şüphe kalmamıştır ve mesele sonsuza dek çözülmüştür."

 agot_multi_duel.0100.desc.accuser_yielded.loser:0 "Güç beni terk eder; onunla birlikte beni buraya kadar taşıyan kesinlik de. [main_loser_leader.Custom('signature_weapon')] silahımı indirirken kolum titriyor; anın ağırlığı her yaradan daha ağır.\n\nİzleyen herkesin önünde teslim olurum. Öne sürdüğüm iddiayı geri çeker ve çeliği alana getiren meydan okumadan vazgeçerim. Yedilerin Yargılaması benim teslimiyetimle sona erer; bu kadar cüretkârca dile getirdiğim suçlama sözlerimle birlikte ölür ve alem, daha ileri gidemediğim anda geri adım attığımı hatırlar."

 agot_multi_duel.0100.desc.accuser_downed.loser:0 "Ayağa kalkmayı denerim ama bedenim bana itaat etmez. Yer uzak ve dengesiz gelir; acı her şeyi bastırırken savaşın gürültüsü bulanıklaşır.\n\nGerçek kaçınılmaz hale gelir. Alemin önüne getirdiğim iddiayı sürdürmek için artık ayakta duramıyorum. Yedilerin Yargılaması benim yenilgimle sona erer ve gücümün tükendiği yerde suçlamam da başarısız olur. İzleyen herkesin önünde meydan okumam savaş alanında paramparça olur."

 agot_multi_duel.0100.desc.accused_downed.loser:0 "Mücadele gücümü tüketir; ta ki bacaklarım çöküp ayakta duramayana dek. Her nefes yakar ve kararlaştırılanın farkında kalmaya çabalarken alan eğilir.\n\nYedilerin Yargılaması aleyhimdeki iddiaya çelikle yanıt verir. İzleyen herkesin önünde hüküm verilirken yerde kırılmış halde kalırım; kaderim sözlerle ya da antlarla değil, anın gerektirdiğinde dayanamayışımla mühürlenir."

