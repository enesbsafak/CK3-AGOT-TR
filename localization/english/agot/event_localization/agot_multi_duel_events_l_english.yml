 agot_multi_duel.0020.desc.intro1:0 "[winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName] arasındaki çatışma, savaşın kaosunun ortasında bir fırtına gibi patlar; loş ışıkta dans eden silahları gözlerimi üzerine çeker."

 agot_multi_duel.0020.desc.intro2:0 "Savaşın gürültüsü düelloları sahneye çıkarken ölümcül niyetle birbirinin çevresini dönen [winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName]'i gözlerim yakalar."

 agot_multi_duel.0020.desc.intro3:0 "Karmakarışık kıyasıya dövüşün ortasında dikkatim, ölümcül bir amaçla parıldayan kılıçlarıyla birbirine saldıran [winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName]'e takılır."

 agot_multi_duel.0020.desc.intro4:0 "[winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName], savaş alanında yankılanan bir şiddetle karşılaşır; düelloları, dikkatimi esir alan ölümcül bir danstır."

 agot_multi_duel.0020.desc.intro5:0 "Kaosun ortasında [winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName]'in göz göze geldiğini fark ederim; ikisi de savaşın seyrini değiştirebilecek bir düelloda hünerlerini kanıtlamaya kararlı."

 agot_multi_duel.0020.desc.intro6:0 "Savaş şiddetlenirken [winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName]'in birbirine yaklaştığını görürüm; her hareketleri hesaplı ve ölümcül."

 agot_multi_duel.0020.desc.intro7:0 "[winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName] kıyasıya bir çatışmaya tutuşur; silahları, savaşın gürültüsünü yaran bir sesle birbirine çarpar."

 agot_multi_duel.0020.desc.intro8:0 "Gözlerim, kanla bitebilecek bir düelloda silahları vurmaya hazır biçimde savaş alanında dolanan [winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName]'e takılır."

 agot_multi_duel.0020.desc.intro9:0 "Savaşın ortasında [winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName] arasındaki düello bir fener gibi parlar; hayatta kalmak için savaşırken hünerlerini sonuna kadar sergilerler."

 agot_multi_duel.0020.desc.intro10:0 "[winner_duelist.GetTitledFirstName] ile [loser_duelist.GetTitledFirstName] şiddetli bir çarpışmayla birbirine girer; kılıçlarından sıçrayan kıvılcımlar, düello sürerken savaş alanını aydınlatır."

 agot_multi_duel.0020.desc.middle1:0 "[winner_duelist.GetTitledFirstNameNoTooltip] hızlı bir saplamayla ileri atılır; ama [loser_duelist.GetTitledFirstNameNoTooltip] yana kayarak hedefini neredeyse bulan acımasız bir [loser_duelist.Custom('AGOT_SignatureWeaponCritical')] ile karşılık verir."

 agot_multi_duel.0020.desc.middle2:0 "[loser_duelist.GetTitledFirstNamePossessiveNoTooltip] [loser_duelist.Custom('signature_weapon')] havada ıslık çalarken [winner_duelist.GetTitledFirstNameNoTooltip] altına eğilir ve kan akıtan hızlı bir [winner_duelist.Custom('AGOT_SignatureVerb')] ile [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] yanına karşılık verir."

 agot_multi_duel.0020.desc.middle3:0 "[winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNameNoTooltip]'in güçlü darbesini bloke edip [loser_duelist.GetHerHim]'i geri iterken ve bir dizi saldırıya girişirken düello kızışır."

 agot_multi_duel.0020.desc.middle4:0 "[loser_duelist.GetTitledFirstNameNoTooltip] sola sahte bir hamle yaparak [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] savunmasını açığa çeker ve ardından [winner_duelist.GetTitledFirstNameNoTooltip]'i neredeyse ayaklarından kesecek [winner_duelist.Custom('AGOT_SignatureWeaponHeavy')] bir darbe indirir."

 agot_multi_duel.0020.desc.middle5:0 "[winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] baş üstü savurmasını savuşturup yakına girer, [winner_duelist.GetHerHis] dizini [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] karnına geçirir ve [loser_duelist.GetHerHim] geri iter."

 agot_multi_duel.0020.desc.middle6:0 "[loser_duelist.GetTitledFirstNameNoTooltip] [loser_duelist.GetHerHis] [loser_duelist.Custom('signature_weapon')] ile alçaktan süpürür, [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] bacaklarını hedefler; ama [winner_duelist.GetTitledFirstNameNoTooltip] saldırının üzerinden atlayıp [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] omzuna şiddetli bir [winner_duelist.Custom('AGOT_SignatureWeaponCritical')] ile karşılık verir."

 agot_multi_duel.0020.desc.middle7:0 "[winner_duelist.GetTitledFirstNameNoTooltip] ile [loser_duelist.GetTitledFirstNameNoTooltip] öfkeli bir tempoda karşılıklı darbeler savurur; her biri saldırıyı sürdürürken ölümden kıl payı sıyrılır."

 agot_multi_duel.0020.desc.middle8:0 "[loser_duelist.GetTitledFirstNameNoTooltip] ağır bir darbeden sıyrılarak hızını kullanır ve [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] koluna sıyırıcı bir darbe indirip kızıl bir iz bırakır."

 agot_multi_duel.0020.desc.middle9:0 "[winner_duelist.GetTitledFirstNameNoTooltip], sahte bir geri çekilmeyle [loser_duelist.GetTitledFirstNameNoTooltip]'i açılmaya kışkırtır, sonra araya girip [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] göğsüne ezici bir darbe indirir."

 agot_multi_duel.0020.desc.middle10:0 "[loser_duelist.GetTitledFirstNamePossessiveNoTooltip] [loser_duelist.Custom('signature_weapon')], [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] [winner_duelist.Custom('signature_weapon')] ile yankılanan bir çarpışmayla karşılaşır; ancak [winner_duelist.GetTitledFirstNameNoTooltip] hızla karşılık vererek [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] ile [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] boğazına yüklenir."

 agot_multi_duel.0020.desc.outro1:0 "\n\nSon, çaresiz bir saplamayla [winner_duelist.GetTitledFirstNameNoTooltip], [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] ile [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] göğsünü deler ve düelloyu bir kan fışkırmasıyla bitirir. [loser_duelist.GetTitledFirstNameNoTooltip] bir daha ayağa kalkmamak üzere yere düşer."

 agot_multi_duel.0020.desc.outro2:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip], [winner_duelist.GetTitledFirstNameNoTooltip]'i silahsızlandırmayı başarır; ama [loser_duelist.GetSheHe] [winner_duelist.GetHerHim]'i bitiremeden [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] [winner_duelist.Custom('signature_weapon')] yolunu [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] kalbine bulur. [loser_duelist.GetTitledFirstNameNoTooltip], yere çarpmadan önce ölmüş halde çöküverir."

 agot_multi_duel.0020.desc.outro3:0 "\n\n[winner_duelist.GetTitledFirstNamePossessiveNoTooltip] [winner_duelist.Custom('signature_weapon')], [loser_duelist.GetTitledFirstNameNoTooltip]'i boğazından yakalar; [loser_duelist.GetTitledFirstNameNoTooltip] cansız bir halde çökerken bir kan fışkırması düellonun sonunu işaretler."

 agot_multi_duel.0020.desc.outro4:0 "\n\n[loser_duelist.GetTitledFirstNamePossessiveNoTooltip] son umutsuz savurması boşa gider ve [loser_duelist.GetHerHim], [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] öldürücü darbesine açık kalır. [winner_duelist.GetTitledFirstNamePossessiveNoTooltip] [winner_duelist.Custom('signature_weapon')], [loser_duelist.GetHerHis] kalbini [winner_duelist.Custom('AGOT_SignatureWeaponCriticalPresent')] ve [loser_duelist.GetTitledFirstNameNoTooltip] son bir nefesle düşer."

 agot_multi_duel.0020.desc.outro5:0 "\n\nAcımasız bir savurmayla [winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNameNoTooltip]'in başını uçurur ve düelloyu tek, kesin bir hamleyle bitirir. [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] bedeni yere çöker."

 agot_multi_duel.0020.desc.outro6:0 "\n\n[winner_duelist.GetTitledFirstNamePossessiveNoTooltip] son darbesi [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] yanını [winner_duelist.Custom('AGOT_SignatureWeaponCriticalPresent')]; ölümcül yara, [loser_duelist.GetTitledFirstNameNoTooltip]'i, [loser_duelist.GetSheHe] ölü bir halde çökmeden önce dizlerinin üzerine düşürür."

 agot_multi_duel.0020.desc.outro7:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNameNoTooltip]'e öldürücü darbeyi indirir; [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')], [winner_duelist.GetHerHis] rakibinin göğsüne derince saplanır. [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] cansız bedeni yere yığılır."

 agot_multi_duel.0020.desc.outro8:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] açılır ve [winner_duelist.GetTitledFirstNameNoTooltip] bundan faydalanarak [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] ile tek ve isabetli bir saplamayla [winner_duelist.GetHerHim]'i delip geçer. [loser_duelist.GetTitledFirstNameNoTooltip], yere çarpmadan önce ölmüş halde düşer."

 agot_multi_duel.0020.desc.outro9:0 "\n\nHızlı ve vahşi bir darbeyle [winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] boğazını yarar. [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] gözleri şokla irileşirken [loser_duelist.GetSheHe] çöker; yaradan kan boşalır."

 agot_multi_duel.0020.desc.outro10:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] savunmasını delip geçer ve [winner_duelist.GetHerHis] [winner_duelist.Custom('signature_weapon')] ile [loser_duelist.GetHerHis] karnına derince saplanır. [loser_duelist.GetTitledFirstNameNoTooltip] bir an sendeleyip kanla lekelenen toprağın üzerine cansız bir halde yığılır."

 agot_multi_duel.0020.desc.outro_survived1:0 "\n\nİki düellocu da kanlar içinde ve hırpalanmış halde ama sağ olarak ayrılır ve yaralarını sarmak için geri çekilirler."

 agot_multi_duel.0020.desc.outro_survived2:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNameNoTooltip]'i silahsızlandırmayı başarır; ama öldürücü darbeyi indireceği yerde [winner_duelist.GetSheHe] [loser_duelist.GetHerHim]'i bağışlar ve [loser_duelist.GetHerHim]'in mücadeleden sürünerek uzaklaşmasına izin verir."

 agot_multi_duel.0020.desc.outro_survived3:0 "\n\nDüello çıkmazda sona erer; iki adam da devam edemeyecek kadar bitkindir. Onurları zedelenmemiş halde, temkinli bakışlarla geri çekilirler."

 agot_multi_duel.0020.desc.outro_survived4:0 "\n\nSavaş alanındaki ani bir dikkat dağılması, hem [winner_duelist.GetTitledFirstNameNoTooltip]'i hem de [loser_duelist.GetTitledFirstNameNoTooltip]'i düelloyu kesmeye iter; hiçbiri böyle bir belirsizlikte darbe riskini göze almak istemez."

 agot_multi_duel.0020.desc.outro_survived5:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip] ile [loser_duelist.GetTitledFirstNameNoTooltip] temkinli temkinli birbirinin çevresini döner; ama hiçbiri öldürücü darbe için bir açık bulamaz. Sonunda ikisi de bere içinde ama sağ olarak ayrılırlar."

 agot_multi_duel.0020.desc.outro_survived6:0 "\n\nMücadele, düşman askerlerinin dalgasıyla kesilir; [winner_duelist.GetTitledFirstNameNoTooltip] ve [loser_duelist.GetTitledFirstNameNoTooltip] düelloyu kesip daha büyük savaşa dönmek zorunda kalır."

 agot_multi_duel.0020.desc.outro_survived7:0 "\n\nİki adam da çöküşün eşiğindedir; ama hiçbiri teslim olmaz. Sonunda her biri diğerinin hünerine saygı duyarak düelloyu bitirmeyi kabul eder."

 agot_multi_duel.0020.desc.outro_survived8:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetTitledFirstNameNoTooltip]'i yaralamayı başarır; ama [winner_duelist.GetSheHe] onu bitiremeden diğer savaşçılar aralarına dalar, anı bozar ve düelloyu sona erdirir."

 agot_multi_duel.0020.desc.outro_survived9:0 "\n\nİki adam da yorulunca darbeleri gücünü kaybeder ve sonunda geri adım atarak bir baş işaretiyle beraberliği kabul eder ve kavgaya yeniden katılırlar."

 agot_multi_duel.0020.desc.outro_survived10:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip] ölümcül olması gereken bir darbe indirir; ama [loser_duelist.GetTitledFirstNamePossessiveNoTooltip] zırhı onu kurtarır. Mücadelenin süresiz sürebileceğini anlayan ikisi, soluk soluğa kalarak ayrılırlar."

 agot_multi_duel.0020.desc.outro_survived1.stands_up:0 "\n\nAğır bir darbe [loser_duelist.GetTitledFirstNameNoTooltip]'i yere çarpar; bir anlığına savaşın kargaşasına karışır. Düello karara bağlanacakmış gibi göründüğü anda [loser_duelist.GetSheHe] kendini [loser_duelist.GetHerHis] ayaklarına çeker ve ilerlemeye devam eder."

 agot_multi_duel.0020.desc.outro_survived2.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] sendeler ve sertçe düşer; çarpma, yakındaki seyircilerin nefesini keser. Yine de anlar sonra [loser_duelist.GetSheHe], darbeyi silkip kendini yeniden mücadeleye zorlayarak ayağa kalkar."

 agot_multi_duel.0020.desc.outro_survived3.stands_up:0 "\n\nÇatışma, [loser_duelist.GetTitledFirstNameNoTooltip] yere serilmiş ve [loser_duelist.Custom('signature_weapon')] [loser_duelist.GetHerHis] elinden kaymış halde sona erer. [loser_duelist.GetSheHe] çaba ve kararlılıkla onu geri alır, mücadeleyle bir kez daha yüzleşmek için kendini doğrultur."

 agot_multi_duel.0020.desc.outro_survived4.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] dengesini kaybedip yığılan bedenlerin arasına savrulur. Düello bir an duraksar; [loser_duelist.GetSheHe], yaralı ama teslim olmaya niyeti olmayan bir halle yeniden ayağa kalkar."

 agot_multi_duel.0020.desc.outro_survived5.stands_up:0 "\n\nÇelik ve kuvvet [loser_duelist.GetTitledFirstNameNoTooltip]'i yere serer; [loser_duelist.GetHerHim]'in altında toz ve kan karışır. Yine de [loser_duelist.GetSheHe] orada kalmaz; savaş gürlerken tırnaklarıyla [loser_duelist.GetHerHis] ayaklarına geri tutunur."

 agot_multi_duel.0020.desc.outro_survived6.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] saldırının altında kalır; yer [loser_duelist.GetHerHim]'i karşılamak için yükselirken [loser_duelist.GetHerHis] nefesi kesilir. Bir an sonra [loser_duelist.GetSheHe], düellonun bu kadar kolay bitmesine izin vermeyerek kendini yeniden dik tutmaya zorlar."

 agot_multi_duel.0020.desc.outro_survived7.stands_up:0 "\n\nEzici bir dövüş temposu [loser_duelist.GetTitledFirstNameNoTooltip]'i hareketsiz ve sersemlemiş halde toprağa gömer. Duraklama kısadır ve çok geçmeden [loser_duelist.GetSheHe], azim ve kararlılık [loser_duelist.GetHerselfHimself] tekrar kavgaya taşırken bir kez daha ayağa kalkar."

 agot_multi_duel.0020.desc.outro_survived8.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] geriye ve yere sürülür; düşüş düelloyu bir anlığına böler. Keskin bir nefes ve dişe diş bir kararlılıkla [loser_duelist.GetSheHe] dengesini toplar ve yeniden ileri adım atar."

 agot_multi_duel.0020.desc.outro_survived9.stands_up:0 "\n\nMücadelenin gücü sonunda [loser_duelist.GetTitledFirstNameNoTooltip]'i savurur; silahlar yerde sürtünür. Yine de [loser_duelist.GetSheHe] teslim olmaz; kendini doğrultup çatışmaya yeniden katılır."

 agot_multi_duel.0020.desc.outro_survived10.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] yere serilir ve bir anlığına çevresindeki kaosa karışır. Sonra [loser_duelist.GetSheHe], hırpalanmış ama ayakta yeniden belirir ve düello sürer."

 agot_multi_duel.0020.desc.outro_survived1.stands_up.friend:0 "\n\nAğır bir darbe [loser_duelist.GetTitledFirstNameNoTooltip]'i yere serer; [loser_duelist.GetHerHim]'in nefesi bir anda dışarı fırlar. Düello bitmek üzereyken gürültüyü bir ses yarar; [loser_duelist_friend.GetTitledFirstName] kalabalıktan bağırır.\n\n#EMP "Kalk, [loser_duelist.GetTitledFirstNameNoTooltip]! Ayağa kalk, mücadele bitmedi!"#! \n\nBu haykırışla canlanan [loser_duelist.GetSheHe], kendini yeniden dik durmaya zorlar."

 agot_multi_duel.0020.desc.outro_survived2.stands_up.friend:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] sertçe düşer; [loser_duelist.GetSheHe] yere çarparken toz yükselir. Çatışma bir an duraksar; ta ki [loser_duelist_friend.GetTitledFirstNamePossessive] sesi gürültüyü yarana dek.\n\n#EMP "Ayağa kalk, [loser_duelist.GetFirstNameNoTooltip]! Kalk ve onlarla yüzleş!"#! \n\nKeskin bir nefesle [loser_duelist.GetSheHe] kendini [loser_duelist.GetHerHis] ayaklarının üzerine çeker."

 agot_multi_duel.0020.desc.outro_survived3.stands_up.friend:0 "\n\nÇelik, [loser_duelist.GetTitledFirstNameNoTooltip]'i geriye ve aşağı iter; [loser_duelist.Custom('signature_weapon')] [loser_duelist.GetHerHis] elinden kayar. An yerine oturmadan kalabalıktan bir haykırış yükselir; [loser_duelist_friend.GetTitledFirstName], [loser_duelist.GetHerHim]'i yüreklendirir.\n\n#EMP "Kalk! Henüz yenilmedin, ayağa kalk!"#! \n\n[loser_duelist.GetSheHe] dişlerini sıkarak bir kez daha doğrulur."

 agot_multi_duel.0020.desc.outro_survived4.stands_up.friend:0 "\n\nDövüş temposunun gücü [loser_duelist.GetTitledFirstNameNoTooltip]'i ezilmiş toprağın üzerinde savurur. Seyircilerin arasında mırıltılar dolaşır; ta ki bir ses diğerlerinin üzerinde yükselene dek: [loser_duelist_friend.GetTitledFirstName], sert ve boyun eğmez.\n\n#EMP "Ayağa kalk, [loser_duelist.GetFirstNameNoTooltip], onlara gücünü göster!"#! \n\nÇağrıya karşılık veren [loser_duelist.GetSheHe], dengesiz ama kırılmamış halde yeniden ayağa kalkar."

 agot_multi_duel.0020.desc.outro_survived5.stands_up.friend:0 "\n\nSaldırının ağırlığıyla yere serilen [loser_duelist.GetTitledFirstNameNoTooltip], toz ve çeliğin arasında çöker. Düello neredeyse sonuca bağlanmışken savaşçıların ötesinden bir haykırış yükselir; [loser_duelist_friend.GetTitledFirstName] seslenir.\n\n#EMP "Kalk şimdi! Yedi seni izliyor, düşme!"#! \n\nSözler alanda yayılırken [loser_duelist.GetSheHe] yeniden [loser_duelist.GetHerHis] ayaklarının üzerine çıkar."

 agot_multi_duel.0020.desc.outro_survived1.downed:0 "\n\nAcımasız bir dövüş temposu [loser_duelist.GetTitledFirstNameNoTooltip]'i yere çarpar ve bu kez hızlı bir toparlanma yoktur. [loser_duelist.GetSheHe] ayağa kalkmaya çabalar; ama güç tükenmiştir ve düello [loser_duelist.GetSheHe]'in düştüğü yerde sona erer."

 agot_multi_duel.0020.desc.outro_survived2.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] sertçe yere çakılır; çarpmanın etkisi [loser_duelist.GetHerHim]'deki mücadele azmini söndürür. [loser_duelist.GetSheHe] kıpırdasa da dengesini yeniden kuramaz."

 agot_multi_duel.0020.desc.outro_survived3.downed:0 "\n\nÇelik ve kuvvet [loser_duelist.GetTitledFirstNameNoTooltip]'i yerin üzerinde savurur. [loser_duelist.GetSheHe] geri dönmeyen bir denge arar ve düello o an karara bağlanır."

 agot_multi_duel.0020.desc.outro_survived4.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] saldırının altında kalır ve öylece yatar; nefesi kesik, kolları ve bacakları tepkisizdir. Ayağa kalkma girişimi söner ve mücadele biter."

 agot_multi_duel.0020.desc.outro_survived5.downed:0 "\n\nSon bir darbe [loser_duelist.GetTitledFirstNameNoTooltip]'i yere serer; toz ve kan [loser_duelist.GetSheHe]'in düştüğü yeri işaretler. [loser_duelist.GetSheHe] bir daha ayağa kalkmaz ve düello sonuna ulaşır."

 agot_multi_duel.0020.desc.outro_survived6.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip], mücadelenin yükü altında çöker; ayağa kalkma çabası boşa çıkar. Kalabalık artık açıkça görebilmektedir: [loser_duelist.GetSheHe] devam edemez."

 agot_multi_duel.0020.desc.outro_survived7.downed:0 "\n\nÇatışma, [loser_duelist.GetTitledFirstNameNoTooltip] yere serilmiş, gücü tükenmiş ve kararlılığı bitmiş halde sona erer. [loser_duelist.GetSheHe] kıpırdasa da mücadeleye karşılık vermek için ayağa kalkamaz."

 agot_multi_duel.0020.desc.outro_survived8.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] [loser_duelist.GetHerHis] ayaklarından savrulur ve düştüğü yerde kalır. Düello duraklar, sonra biter; [loser_duelist.GetSheHe]'in artık ayakta duramayacağı açıkça ortaya çıkar."

 agot_multi_duel.0020.desc.outro_survived9.downed:0 "\n\nKarşılaşmanın gücü sonunda [loser_duelist.GetTitledFirstNameNoTooltip]'i ezer ve [loser_duelist.GetHerHim]'i yere serer. Ayağa kalkma çabası başarısız olur ve sonuç artık şüpheye yer bırakmaz."

 agot_multi_duel.0020.desc.outro_survived10.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] yere serilir ve öyle kalır; savaşma iradesi bitkinlik ve acıyla kırılır. Düello yeni bir darbeyle değil, [loser_duelist.GetHerHis] ayağa kalkamamasıyla sona erer."

 agot_multi_duel.0020.desc.outro_survived1.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip], [loser_duelist.GetHerHis] [loser_duelist.Custom('signature_weapon')] silahını indirip izleyen herkesin önünde teslim olurken çatışma yavaşlar. Jestin anlamı yerine otururken bir sessizlik çöker.\n\nBu teslimiyetle Yedilerin Yargılaması amacını yitirir. [loser_duelist.GetSheHe|U] [tos_accused.GetTitledFirstName]'e yönelttiği suçlamayı geri çeker ve çeliği alana çağıran iddia [loser_duelist.GetHerHis] kendi sözleriyle çürütülür."

 agot_multi_duel.0020.desc.outro_survived2.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] mücadeleden geri çekilir; [loser_duelist.Custom('signature_weapon')] indirilmiş ve iradesi tükenmiş halde alemin gözü önünde teslim olur. Düello son darbeyle değil teslimiyetle sona erer.\n\nYedilerin Yargılaması o an dağılır. [loser_duelist.GetSheHe|U] [tos_accused.GetTitledFirstName]'e yönelttiği suçlamayı geri çeker ve alemi sarsan meydan okuma ortadan kalkar."

 agot_multi_duel.0020.desc.outro_survived3.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] teslim olurken alanda bir sessizlik yayılır; [loser_duelist.GetHerHis] [loser_duelist.Custom('signature_weapon')] silahını tanrıların ve insanların gözü önünde indirir. Anlamı tanıklık eden herkes için açıktır.\n\nTeslim olarak [loser_duelist.GetSheHe], [tos_accused.GetTitledFirstName]'e yönelttiği suçlamayı geri çeker ve Yedilerin Yargılaması'nın gerekçesini ortadan kaldırır. Hükme getirilen mesele kanla değil teslimiyetle çözülür."

 agot_multi_duel.0020.desc.outro_survived4.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] duraksar, sonra teslim olur; çatışma nihayet yatışırken [loser_duelist.GetHerHis] [loser_duelist.Custom('signature_weapon')] silahını indirir. Alan dinleyerek bekler.\n\nSuçlayanın teslimiyetiyle Yedilerin Yargılaması çöker. [loser_duelist.GetSheHe|U] [tos_accused.GetTitledFirstName]'e yönelttiği suçlamayı geri çeker ve çelikle hüküm isteyen iddia herkesin gözü önünde çürütülür."

 agot_multi_duel.0020.desc.outro_survived5.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip] teslim olunca an kırılır; güç de kesinlik de tükenmiştir. Çelik sessizliğe gömülür ve düello bir darbe daha atılmadan sona erer.\n\nYedilerin Yargılaması devam edemez. [loser_duelist.GetSheHe|U] [tos_accused.GetTitledFirstName]'e yönelttiği iddiasını geri çeker; suçlamayı ileri taşıyacak ne bir ses ne de bir şampiyon kalır."

 agot_multi_duel.0020.a.a:0 "Odaklan!"

 agot_multi_duel.0020.a.b:0 "Savunmanı yukarıda tut!"

 agot_multi_duel.0020.a.c:0 "Bitir şunu, çabuk!"

 agot_multi_duel.0020.a.d:0 "Sırtını kolla!"

 agot_multi_duel.0020.a.e:0 "Odaklanmayı kaybetme!"

 agot_multi_duel.0020.a.f:0 "Savaşmaya devam et!"

