 agot_title_and_name_events.0001.t:0 "Kraliyet Kanı Meselesi"

 agot_title_and_name_events.0001.desc:0 "[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('child'))] [AGOTGetName(child)], kraliyet kanı taşıyor ancak bu sıfatla tanınmıyor. [ROOT.Char.GetTitleAsNameNoTooltip] olarak, [child.GetHerHis] kraliyet soyunu herkesin bilmesi için bu onuru [child.GetHerHim]'e bahşetme gücü bende."

 agot_title_and_name_events.0001.desc.twins:0 "[AGOTGetName(child)] ve [AGOTGetName(child_2)], [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('scoped_relative'))] [AGOTGetName(scoped_relative)]'in yeni doğan çocukları, kraliyet kanı taşıyor ancak bu sıfatla tanınmıyorlar. [ROOT.Char.GetTitleAsNameNoTooltip] olarak, kraliyet soyunu herkesin bilmesi için bu onurları onlara bahşetme gücü bende."

 agot_title_and_name_events.0001.desc.triplets:0 "[AGOTGetName(child)], [AGOTGetName(child_2)] ve [AGOTGetName(child_3)], [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('scoped_relative'))] [AGOTGetName(scoped_relative)]'in yeni doğan çocukları, kraliyet kanı taşıyor ancak bu sıfatla tanınmıyorlar. [ROOT.Char.GetTitleAsNameNoTooltip] olarak, kraliyet soyunu herkesin bilmesi için bu onurları onlara bahşetme gücü bende."

 agot_title_and_name_events.0001.a:0 "Kraliyet kanı, kraliyet tanınması gerektirir."

 agot_title_and_name_events.0001.b:0 "Uzak akrabalar böyle bir onuru hak etmiyor."

