 agot_title_and_name_events.0002.desc:0 "Hanem üyeleri kraliyet kanı taşıyor, ancak bu sıfatla tanınmıyorlar. [ROOT.Char.GetTitleAsNameNoTooltip] olarak, kraliyet soyunu herkesin bilmesi için bu onurları onlara bahşetme gücü bende.\n\n#I Kraliyet unvanı bahşedeceğiniz akrabaları seçin#!"
