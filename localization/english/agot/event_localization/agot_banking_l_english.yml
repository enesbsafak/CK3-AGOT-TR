 bank_name_normal_list:0 "[Character.GetLocalizedText( 'bank_name' )]"

 agot_banking.0700.t:0 "Banka Tasfiye Edildi"

 agot_banking.0700.desc:0 "Korkunç haber! Bankamızın merkezi artık [NewHolder.GetTitledFirstNameNicknamed]'in elinde. [NewHolder.GetHerHis] toprakları zaten başka bir banka barındırdığından, [NewHolder.GetSheHe] rekabeti azaltmak için bankamızı tasfiye etmeye karar verdi.\n\nTüm hissedarlara bankanın mevcut nakit rezervinin bir kısmı ödenecek. Bundan sonra banka varlığını sona erdirecek."

 agot_banking.0700.a:0 "Böylece bu girişim sona eriyor."

 event_window_widget_enter_bank_name_prompt:0 "Banka Adı Seç (şununla başlamamalı: "The"):"

 agot_banking.0701.t:0 "Bir Bankayı Yağmalamak?"

 agot_banking.0701.desc:0 "Havada köz kokusu ile neşeli savaşçıların gürültüsü birbirine karışıyor. Birliğim, ünlü [bank_shareholder.Custom('agot_bank_name')]'ne ev sahipliği yapan [barony.GetNameNoTierNoTooltip]'yi başarıyla kuşattı.\n\nÖnümüzde cezbedici bir fırsat duruyor: bu bankanın kasalarında şüphesiz bolca hazine ve hayal bile edilemeyecek bir zenginlik var... Ve topraklar üzerindeki kontrolümüz, bankanın askerlerime karşı savunmasız olduğu anlamına geliyor.\n\nAncak böyle bir eylem fark edilmeden kalmazdı. Banka bu saldırganlığı karşılıksız bırakmazdı..."

 agot_banking.0701.a:0 "Bu fırsatı boşa harcayamam!"

 agot_banking.0701.b:0 "[bank_shareholder.Custom('agot_bank_name')] benim düşmanım değil."

 agot_banking.0702.t:0 "Banka Yağmalandı"

 agot_banking.0702.desc:0 "[barony.GetNameNoTierNoTooltip] kuşatmasının ardından, saldırgan [bank_raider.GetTitledFirstNameNicknamed] bankamızın merkezini yağmalamaya karar verdi ve [bank_raider.GetHerHis] askerleri kasalarımızın bir kısmına zorla girmeyi başardı. Nakit rezervimizden [bank_raider.MakeScope.Var('raided_gold').GetValue|2|N] tutarında altın çaldılar.\n\nBanka, bu düşmanca eyleme karşı elindeki tüm imkanlarla kendini savunmalı!\n\n[bank_raider.GetTitledFirstNameNoTooltip]'e, [bank_raider.GetHerHis] eylemlerinin korkunç sonuçları olacağını bildirebiliriz — ve çalınan paranın ceza eklenerek geri ödenmesi gerektiğini.\n\n[bank_raider.GetSheHe] reddederse, [bank_raider.GetHerHim]'i diğer herhangi bir temerrüt faili gibi ele alacağız... #bold sertçe.#!"

 agot_banking.0702.a:0 "Mektubu gönder."

 agot_banking.0702.b:0 "Hiçbir harekette bulunmayacağız..."

 agot_banking.0703.t:0 "[raided_director.Custom2('AppropriateGreetingNegative', bank_raider)]"

 agot_banking.0703.desc:0 "Bankamızı soyman sonuçsuz kalmayacak. Sana çalınan altını bir ceza ücretiyle birlikte iade etmen için tek seferlik bir fırsat sunuyoruz. Reddedersen, parayı başka yollarla geri almak zorunda kalacağız."

 agot_banking.0703.a:0 "Talep ettiğinizi derhal ödeyeceğim."

 agot_banking.0703.b:0 "Geri ödeme için biraz zamana ihtiyacım var."

 agot_banking.0703.b_tt:0 "Çaldığın para, yıllık %5 faizle 3 yıl içinde geri ödenecek bir krediye dönüştürülecek."

 agot_banking.0703.c:0 "Benden bir metelik bile göremezsin!"

 agot_banking.0703.c_tt:0 "Bankaya yapılan tüm ödemeleri reddediyorsun; banka bunu bir temerrüt olarak değerlendirecek..."

 agot_banking.0704.t:0 "Akıncı Ödedi"

 agot_banking.0704.desc:0 "[bank_raider.GetTitledFirstNameNicknamed] boyun eğdi ve çalınanı, %10'luk bir ceza ücretiyle birlikte geri ödedi."

 agot_banking.0704.a:0 "Akıllıca bir karar."

 agot_banking.0705.t:0 "Akıncı Geri Ödeme Sözü Verdi"

 agot_banking.0705.desc:0 "[bank_raider.GetTitledFirstNameNicknamed] boyun eğdi ve çalınanı önümüzdeki 3 yıl içinde geri ödemeyi vaat etti. Bunu, yıllık %5 faiz oranlı bir kredi olarak değerlendireceğiz."

 agot_banking.0705.a:0 "Umalım ki [bank_raider.GetSheHe] anlaşmaya sadık kalır."

 gift_share_interaction:0 "Banka Hissesi Hediye Et"

 gift_share_interaction_desc:0 "Karaktere banka hisselerinden birini hediye et"

 gift_share:0 "Al, bir hisse"

 take_share_interaction:0 "Banka Hisselerini Al"

 take_share_interaction_desc:0 "Bir hane üyesinden tüm banka hisselerini al"

 take_share:0 "Hisselerini ver bana"

 agot_banking.0801.t:0 "İflas Tehdidi"

 agot_banking.0801.desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin işletme maliyetlerini karşılayacak yeterli nakit rezervi yok. Bu yüzden tüm hissedarlardan, iflastan kaçınmak için derhal ek hisse satın almaları isteniyor.\n\nYeterli fon toplanamazsa, banka kapılarını kalıcı olarak kapatmak zorunda kalacak."

 agot_banking.0801.a:0 "Üzerime düşeni yapacağım."

 agot_banking.0801.b:0 "Diğer hissedarlara güveneceğim."

 agot_banking.0803.t:0 "İflas"

 agot_banking.0803.desc:0 "Felaket!\n\n[ROOT.Char.Custom('agot_bank_name')], işletme maliyetlerini karşılayacak kadar yeni yatırım toplayamadı. Sonuç olarak banka artık resmen iflas etmiştir ve faaliyetlerini kalıcı olarak sona erdirecektir."

 agot_banking.0803.a:0 "Yatırımım kayboldu..."

 agot_banking.0804.t:0 "Banka Kurtarıldı"

 agot_banking.0804.desc:0 "Yeterince hissedarın yatırımlarını bir kez daha artırma isteği sayesinde, bankanın yaklaşan iflası önlendi."

 agot_banking.0804.a:0 "Ne rahatlama!"
