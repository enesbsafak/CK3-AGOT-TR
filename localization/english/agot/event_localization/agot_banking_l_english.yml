 agot_banking.0202.bank3.desc:0 "[ROOT.Char.Custom('agot_bank_name')] her 5 yılda bir hissedarlarına dönem içindeki performansını bildirir ve yatırımcılarına temettü öder.\n\n#T [agot_bank_director|E] [director.GetTitledFirstName] tarafından sunulan güncel rakamlar şunlardır:#!\n\nKullanılabilir sermaye:                            #bold [ROOT.Var('bank3_FreeCapital').GetValue|2] #!\nMüşterilere kredi olarak verilen sermaye:       #bold [ROOT.Var('bank3_LoanedCapital').GetValue|2] #!\nYatırım fonu hacmi:             #bold [ROOT.Var('bank3_InvestmentFund').GetValue|2] #!\nBankanın toplam değeri:                #bold [ROOT.Var('bank3_BankValue').GetValue|2] #!\nÇıkarılan hisse sayısı:             #bold [ROOT.Var('bank3_NofShares').GetValue|0] #!\nGelir:                                          #bold [ROOT.Var('bank3_Earnings').GetValue|2|P] #!\nGiderler:                                         #bold [ROOT.Var('bank3_Expenses').GetValue|2|N] #!\nTemerrüt nedeniyle kaybedilen krediler:                     #bold [ROOT.Var('bank3_LostLoans').GetValue|2|N] #!\nNet kâr:                                        #bold [ROOT.Var('bank3_Profit').GetValue|2] #!\nHisse başına kâr:                              #bold [ROOT.Var('bank3_ProfitPerShare').GetValue|2] #!\nHisse başına temettü:                         #bold [ROOT.Var('bank3_DividendPerShare').GetValue|2] #!"

 agot_banking.0202.a:0 "Kapsamlı bir değerlendirme!"

 agot_banking.0203.t:0 "Bankanın Teklifi"

 agot_banking.0203.desc:0 "[ROOT.Char.Custom('agot_bank_name')], hisse satın alma talebime yanıt olarak bir elçi gönderdi. Sahip olduğum her hisse için her beş yılda bir [Concept('agot_bank_dividend_level','temettü')|E] alacağım. Ve bir gün kendimi mali açıdan köşeye sıkışmış bulursam, hisseyi her zaman toplu bir meblağ karşılığında satabilirim.\n\nBir hissenin güncel fiyatı @gold_icon! [ROOT.Var('ShareBuyingPrice').GetValue|2|N]."

 agot_banking.0203.a:0 "Bunu karşılayamam!"

 agot_banking.0203.b:0 "Anlaştık!"

 agot_banking.0203.c:0 "5 hisse satın alacağım."

 agot_banking.0203.d:0 "Şimdi değil, fikrimi değiştirdim."

 agot_banking.0204.t:0 "Bankadan Bir Hisse Satmak"

 agot_banking.0204.desc:0 "[ROOT.Char.Custom('agot_bank_name')]'ne, her birkaç yılda bir gönderdikleri birkaç metelik için bağladığım parayı çok görüyorum! Hisse değeri çökmeden, hâlâ elimdeyken bir hissemi satıp altınımı geri almak daha iyi olur.\n\n[ROOT.Char.Custom('agot_bank_name')]'nden bir hisse satabilir ve güncel değeri olan @gold_icon! [ROOT.Var('ShareSellingPrice').GetValue|2|N] kadarını alabilirim."

 agot_banking.0204.a:0 "Bu kabul edilebilir."

 agot_banking.0204.b:0 "Aslında hissemi saklayacağım."

 agot_banking.0205.t:0 "Bankanın Yeni Direktörü"

 agot_banking.0205.desc:0 "[ROOT.Char.Custom('agot_bank_name')], devam eden faaliyetlerinin koşullarını denetlemek ve ayarlamak için yeni bir [agot_bank_director|E] seçti.\n\nYeni [agot_bank_director|E] [director.GetTitledFirstName], [ROOT.Var('director_winner_votes').GetValue] oy aldı ve bankayı sürekli büyüyen bir refaha taşıyacak!"

 agot_banking.0205.a:0 "Bravo, bravo!"

 agot_banking.0205.a_tt:0 "[THIS.Var('director_votes').GetValue] oy aldınız."

 agot_banking.0206.t:0 "Risk Düzeyine Karar Ver"

 agot_banking.0206.desc:0 "Bir müşteriye kredi vermeden önce [agot_bank|E], önce onun kredi puanını belirler. Banka, bu puana göre müşteriye kredi verilip verilemeyeceğine karar verir.\n\nBankanın [agot_bank_director|E] olarak, güvenilmez müşterilerin kredilerini reddetmeden önce bankanın ne kadar risk kabul etmeye istekli olduğunu tanımlamak bana düşüyor."

 agot_banking.0206.a:0 "İhtiyatlı olacağız. Gereksiz riskler almaya gerek yok!"

 agot_banking.0206.b:0 "Dengeli bir yaklaşım izleyeceğiz; riskleri ve potansiyel kazançları eşit şekilde tartacağız."

 agot_banking.0206.c:0 "Gelen gelsin!"

 agot_banking.0207.t:0 "Temettü Düzeyine Karar Ver"

 agot_banking.0207.desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin [agot_bank_director|E] olarak, bankanın kârının ne kadarının hissedarlara ödeneceğine karar vermek bana düşüyor. [agot_bank_dividends|E] olarak ödenmeyen para bankada kalır ve gelecekte daha fazla kredi vererek daha çok kâr elde etmek için kullanılabilir."

 agot_banking.0207.a:0 "Uzun vadeli büyümeye odaklanmalıyız!"

 agot_banking.0207.a_tt:0 "Bankanın [agot_bank_profits|E]'inin %50'si her 5 yılda bir hissedarlara temettü olarak ödenecek."

 agot_banking.0207.b:0 "Dengeli bir politika daha sürdürülebilir."

 agot_banking.0207.b_tt:0 "Bankanın [agot_bank_profits|E]'inin %75'i her 5 yılda bir hissedarlara temettü olarak ödenecek."

 agot_banking.0207.c:0 "Hissedarlarımızı zenginleştirmek için buradayız!"

 agot_banking.0207.c_tt:0 "Bankanın [agot_bank_profits|E]'inin %100'ü her 5 yılda bir hissedarlara temettü olarak ödenecek."

 agot_banking.0210.t:0 "Bir Borçlu Temerrüde Düşüyor"

 agot_banking.0210.desc:0 "Bir kâtip, [FinalDefaulter.GetTitledFirstName]'in artık [ROOT.Var('show_loan').GetValue|2] @gold_icon tutarındaki kredisini ödeyemediğini veya ödemeye istekli olmadığını bildirdi. Ödünç verilen para bu yüzden kaybedilmiş sayılıyor. Bu, [agot_bank|E]'nin derhal harekete geçmesini gerektiriyor. Fonları öylece bırakırsam hissedarlarımız çılgına dönecek!\n\nBankanın [agot_bank_director|E] olarak bu davayı nasıl ele alacağıma ben karar verebilirim."

 agot_banking.0210.a:0 "Bunu kendim halledeceğim."

 agot_banking.0210.a_tt:0 "Kaybedilen krediyi geri kazanmak için çeşitli seçenekler sunulacak."

 agot_banking.0210.b:0 "Bir hissedar halledebilir."

 agot_banking.0210.b_tt:0 "Bankanın diğer hissedarlarından biri, kaybedilen kredinin nasıl geri kazanılacağına karar verecek."

 agot_banking.0210.c:0 "Artık beni temerrüde düşenlerle uğraştırma!"

 agot_banking.0210.c_tt:0 "Bundan böyle tüm temerrütleri diğer hissedarlar halledecek."

 agot_banking.0210.d:0 "İş yapmanın bedeli bu."

 agot_banking.0210.d_tt:0 "Bu krediyi gelecekte tahsil edemeyeceksin!"

 agot_banking.0211.t:0 "Bir Borçlu Temerrüde Düşüyor"

 agot_banking.0211.raid_failed_desc:0 "Felaket! [FinalDefaulter.GetTitledFirstNamePossessive] muhafızları iyi hazırlanmıştı ve tuttuğumuz korsanları, [FinalDefaulter.GetHerHis] topraklarından kayda değer miktarda altın yağmalamalarına fırsat vermeden püskürttüler.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.assassin_failed_desc:0 "Felaket! [FinalDefaulter.GetTitledFirstName]'i öldürmesi için gönderdiğimiz suikastçı geri dönmedi. [FinalDefaulter.GetFirstNamePossessive] muhafızları tarafından yakalandığını ve görevinde başarısız olduğunu varsaymalıyız.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.claim1_failed_desc:0 "Felaket! [FinalDefaulter.GetTitledFirstNamePossessive] unvanı üzerinde uydurmaya çalıştığımız iddia, potansiyel alıcıların hiçbirini meşruiyetine ikna edecek kadar inandırıcı değildi.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.claim2_failed_desc:0 "Kötü haber: [FinalDefaulter.GetTitledFirstNamePossessive] unvanı üzerindeki sahte iddiamızı [buyer.GetTitledFirstName]'e satmayı denedik, ancak [buyer.GetSheHe] istediğimiz fiyatı ödemeyi reddetti.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.letter1_failed_desc:0 "Kötü haber: [FinalDefaulter.GetTitledFirstNamePossessive] efendisine gönderdiğimiz mektup, onları vassallarının haksızlıklarını düzeltmeye ikna etmedi. Görünüşe göre [FinalDefaulter.GetTitledFirstName], iddialarımızın gayrimeşru olduğunu başarıyla savundu.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.letter2_failed_desc:0 "Kötü haber: [FinalDefaulter.GetTitledFirstNamePossessive] efendisi, iddialarımızın meşru olduğunu inkâr edemese de, [FinalDefaulter.GetTitledFirstNameNoTooltip]'e bankayla yaptığı anlaşmaya sadık kalmasını emretmeyi yine de reddediyor.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.letter3_failed_desc:0 "Kötü haber: [FinalDefaulter.GetTitledFirstNamePossessive] efendisi, vassalına anlaşmasına sadık kalmasını emretmeye ikna edilmiş olsa bile, [FinalDefaulter.GetTitledFirstNameNoTooltip] açıkça itaat etmeyi reddetti.\n\nDaha doğrudan bir yol denemek zorunda kalacağız..."

 agot_banking.0211.economy_failed_desc:0 "Talihsiz haber: [FinalDefaulter.GetTitledFirstNamePossessive] ekonomisine yaptığımız agresif yatırımlar başarılı olmadı. Görünüşe göre [FinalDefaulter.GetSheHe], bize borçlu olunan parayı [FinalDefaulter.GetHerHis] yerel ekonomisinden cebimize aktarmamızı önlemek için karşı önlemler aldı.\n\nBaşka bir yol denemek zorunda kalacağız..."

 agot_banking.0211.director_desc:0 "[FinalDefaulter.GetTitledFirstNamePossessive] kayıp kredisini geri kazanmak için seçebileceğiniz çeşitli yaklaşımlar var."

 agot_banking.0211.delegated_desc:0 "[agot_bank_director|E] [director.GetTitledFirstName], [FinalDefaulter.GetTitledFirstNamePossessive] kredisinde temerrüde düştüğünü sana bildirdi ve kaybedilen parayı geri kazanmanı emretti.\n\nBu görevi yerine getirmek için seçebileceğin çeşitli yaklaşımlar var."

 agot_banking.0211.a:0 "[FinalDefaulter.GetTitledFirstName]'in topraklarını yağmalaması için korsan tut."

 agot_banking.0211.a_tt:0 "Bu, bankaya @gold_icon! [default_revisor.MakeScope.Var('RaiderCost').GetValue] mal olacak. Başarılı olursa, akıncılar borçlu olunan parayı bankaya iade edecek ve alabilecekleri fazla yağmayı kendilerine saklayacak."

 agot_banking.0211.b:0 "Bir suikastçı gönder; [FinalDefaulter.GetHerHis] varisiyle daha fazla şansımız olur."

 agot_banking.0211.b_tt:0 "Bu, bankaya @gold_icon! [default_revisor.MakeScope.Var('AssassinCost').GetValue] mal olacak. Suikastçı [FinalDefaulter.GetTitledFirstName]'i öldürmeyi başarırsa, borç olanı [FinalDefaulter.GetHerHis] varisinden geri almaya çalışacağız."

 agot_banking.0211.c:0 "[FinalDefaulter.GetTitledFirstName]'in unvanı üzerinde sahte bir iddia uydur."

 agot_banking.0211.c_tt:0 "Bu, bankaya @gold_icon! [default_revisor.MakeScope.Var('ClaimCost').GetValue] mal olacak. Başarılı olursak, iddiayı [FinalDefaulter.GetTitledFirstName]'in hırslı bir komşusuna satmayı deneyebiliriz."

 agot_banking.0211.d:0 "[FinalDefaulter.GetTitledFirstName]'in efendisine bir mektup yaz."

 agot_banking.0211.d_tt:0 "Bu, bankaya @gold_icon! [default_revisor.MakeScope.Var('LetterCost').GetValue] mal olacak. [FinalDefaulter.GetTitledFirstNamePossessive] efendisi, vassalının [FinalDefaulter.GetSheHe] ile banka arasında yaptığı anlaşmaya sadık kalmasını talep edebilir ya da borcu kendi cebinden kapatabilir."

 agot_banking.0211.e:0 "[FinalDefaulter.GetTitledFirstName]'in ekonomisini baltala."

 agot_banking.0211.e_tt:0 "Bu, bankaya @gold_icon! [default_revisor.MakeScope.Var('EconomyCost').GetValue] mal olacak. Başarılı olursak, önümüzdeki aylar boyunca bize borçlu olunan her meteliği doğrudan [FinalDefaulter.GetTitledFirstNamePossessive] ekonomisinden sıkacağız; yatırımlarımızdan toplayacak ve çevredeki kasabaları felç edeceğiz. Toparlanmaları biraz zaman alacak."

 agot_banking.0211.g:0 "Yapabileceğimiz hiçbir şey yok."

 agot_banking.0211.g_tt:0 "Bu kredi, şimdi de gelecekte de tahsil edilemez!"

 agot_banking.0211.a.failure:0 "Akın başarısız olur."

 agot_banking.0211.a.success:0 "Akın başarılı olur."

 agot_banking.0211.b.failure:0 "Suikastçı başarısız olur."

 agot_banking.0211.b.success:0 "Suikastçı başarılı olur."

 agot_banking.0211.c.failure:0 "İddia gayrimeşru görülür."

 agot_banking.0211.c.success:0 "İddia meşru kabul edilir."

 agot_banking.0211.d.failure:0 "Efendileri suçlamalarına güvenmez."

 agot_banking.0211.d.success:0 "Efendileri, iddialarının geçerli olduğuna ikna olur."

 agot_banking.0211.e.failure:0 "Ekonomilerini baltalama girişimi başarısız olur."

 agot_banking.0211.e.success:0 "Ekonomilerini baltalama girişimi başarılı olur."

 agot_banking.0212.t:0 "Geri Kazanılan Kredi"

 agot_banking.0212.raid_success_desc:0 "İşe yaradı!\n[FinalDefaulter.GetTitledFirstNamePossessive] başkentine gönderdiğimiz korsanlar, [FinalDefaulter.GetFirstNamePossessive] muhafızları anlamlı bir savunma örgütleyemeden köy ve kasabaları yağmalayıp yeterince ganimetle ortadan kaybolmayı başardı. Yağmaladıkları altın, [FinalDefaulter.GetTitledFirstNamePossessiveNoTooltip] temerrüde düşen kredisinden kaynaklanan kayıpları telafi etmeye tam da yetiyor."

 agot_banking.0212.assassin_success_desc:0 "İşe yaradı!\n[FinalDefaulter.GetTitledFirstName]'i öldürmesi için gönderdiğimiz suikastçı başarılı oldu. Umalım ki [FinalDefaulter.GetHerHis] varisi daha mantıklı bir insandır; aksi takdirde onlar da kendilerini mezarın eşiğinde bulabilir..."

 agot_banking.0212.claim_success_desc:0 "İşe yaradı!\nUydurduğumuz iddia meşru kabul edildi ve onu [buyer.GetTitledFirstName]'e satmayı başardık. [buyer.GetSheHe] karşılığında verdiği para, [FinalDefaulter.GetTitledFirstNamePossessive] kredisinden kaynaklanan kayıpları telafi etmeye yetiyor. Umalım ki [buyer.GetFirstNameNoTooltip], [FinalDefaulter.GetFirstNameNoTooltip]'e savaş meydanında bankaya neden karşı gelmemesi gerektiğini öğretir."

 agot_banking.0212.letter1_success_desc:0 "İşe yaradı!\n[FinalDefaulter.GetTitledFirstNamePossessive] efendisi iddiamızı meşru kabul etti ve ödenmemiş borcu kendi cebinden ödeyerek kapattı. Artık [FinalDefaulter.GetTitledFirstNamePossessiveNoTooltip] borcu ödenmiş sayıldığına göre, [FinalDefaulter.GetHerHim] efendisinin gazabına katlansın."

 agot_banking.0212.letter2_success_desc:0 "İşe yaradı!\n[FinalDefaulter.GetHerHis] efendisi, [FinalDefaulter.GetTitledFirstName]'e bankaya borçlu olduğu parayı ödemesini emrettikten sonra, [FinalDefaulter.GetSheHe] itaat etti ve bir ceza ödemeyi ve asıl borçlu olduğu tutarı önümüzdeki üç yıl içinde geri ödemeyi kabul etti."

 agot_banking.0212.economy_success_desc:0 "İşe yaradı!\n[FinalDefaulter.GetTitledFirstNamePossessive] başkentine yaptığımız agresif yatırımlar, [FinalDefaulter.GetHerHis] topraklarının yerel ekonomisinden kendi kasalarımıza yeterince para aktarmamızı sağladı ve [FinalDefaulter.GetTitledFirstNamePossessiveNoTooltip] temerrüde düşen kredisinden kaynaklanan kayıpları telafi etmemize olanak verdi."

 agot_banking.0212.a:0 "Banka alacağını aldı."

 agot_banking.0213.t:0 "Hisse Bölünmesi"

 agot_banking.0213.desc:0 "[ROOT.Char.Custom('agot_bank_name')] son yıllarda refaha erdi ve tek bir hissenin değeri arttı. Bu, yeni hisse satın almayı zorlaştırdığından, banka bir hisse bölünmesi yapmaya karar verdi:\n\nHer hissedarın elindeki hisseler ikiye bölünecek. Böylece yeni hisselerin fiyatı yarıya inecek, tüm mevcut hissedarlar ise aynı değeri elinde tutmaya devam edecek."

 agot_banking.0213.a:0 "Akıllıca bir hamle."

 agot_banking.0213.a_tt:0 "Artık eskisinin iki katı kadar hisseye sahipsin."

 agot_banking.0301.t:0 "[ROOT.Char.Custom('agot_bank_name')]'in Defter Tutması"

