 take_loan_decision:0 "Banka Kredisi Talep Et"

 take_loan_decision_desc:0 "Dünyanın en zengin ve en itibarlı finans kurumları, güvenilir buldukları herkese kredi vermekten fazlasıyla memnundur. Ancak dikkatli olun: [agot_bank|E]'nin alacağını tahsil edeceği boşuna söylenmemiştir."

 take_loan_decision_effect:0 "[agot_bank|E]'nden bir temsilci, bir kredi ve koşullarını müzakere etmek üzere gönderilecek."

 take_loan_decision_tooltip:0 "Seçilen bankaya kredi talebi içeren bir mektup gönder."

 take_loan_decision_tooltip_confirm_text_desc:0 "Bir banka seç."

 take_loan_bank_cash_reserve:0 "Şu anda hiçbir banka, yeni kredi vermeye yetecek kadar nakit tutmuyor."

 agot_repay_loan_decision:0 "Banka Kredisini Geri Öde"

 agot_repay_loan_decision_desc:0 "Mevcut kredini vade bitmeden tamamen ya da kısmen ödeyebilirsin."

 agot_repay_loan_decision_tooltip:0 "Borçlu olduğunuzu geri ödemek için size farklı planlar sunulacak."

 agot_repay_loan_decision_tooltip_confirm_text_desc:0 "Seçeneklerimi göster."

 agot_repay_loan_decision_effect:0 "Mevcut kredini vade bitmeden tamamen ya da kısmen ödeyebilirsin."

 buy_shares_decision:0 "Bankaya Yatırım Yap"

 buy_shares_decision_shareholder_IB_desc:0 "[ROOT.Char.Custom('agot_bank_name')] yeni yatırımları kabul ediyor.\n\nŞu anda [ROOT.Var('IB_Shares').GetValue] hisseye sahibim, ama daha büyük bir paya hâlâ sahip olabilirken talip olmak akıllıca olur. Daha büyük bir pay, bankanın [Concept('agot_bank_profits','kârları')|E]ndan daha büyük bir [Concept('agot_bank_dividend_level','temettü')|E] anlamına gelir."

 buy_shares_decision_shareholder_bank1_desc:0 "[ROOT.Char.Custom('agot_bank_name')] yeni yatırımları kabul ediyor.\n\nŞu anda [ROOT.Var('bank1_Shares').GetValue] hisseye sahibim, ama daha büyük bir paya hâlâ sahip olabilirken talip olmak akıllıca olur. Daha büyük bir pay, bankanın [Concept('agot_bank_profits','kârları')|E]ndan daha büyük bir [Concept('agot_bank_dividend_level','temettü')|E] anlamına gelir."

 buy_shares_decision_shareholder_bank2_desc:0 "[ROOT.Char.Custom('agot_bank_name')] yeni yatırımları kabul ediyor.\n\nŞu anda [ROOT.Var('bank2_Shares').GetValue] hisseye sahibim, ama daha büyük bir paya hâlâ sahip olabilirken talip olmak akıllıca olur. Daha büyük bir pay, bankanın [Concept('agot_bank_profits','kârları')|E]ndan daha büyük bir [Concept('agot_bank_dividend_level','temettü')|E] anlamına gelir."

 buy_shares_decision_shareholder_bank3_desc:0 "[ROOT.Char.Custom('agot_bank_name')] yeni yatırımları kabul ediyor.\n\nŞu anda [ROOT.Var('bank3_Shares').GetValue] hisseye sahibim, ama daha büyük bir paya hâlâ sahip olabilirken talip olmak akıllıca olur. Daha büyük bir pay, bankanın [Concept('agot_bank_profits','kârları')|E]ndan daha büyük bir [Concept('agot_bank_dividend_level','temettü')|E] anlamına gelir."

 buy_shares_decision_desc:0 "Atıl duran altının hiçbir faydası yok. Yerel bankam yatırımcılara açıkken bir hisse satın alabilirim — ve onunla birlikte, işlerinde söz sahibi olma ve [agot_bank_profit|E]'nden bir pay alma hakkı da gelir."

 buy_shares_decision_tooltip:0 "Yerel bankanızdan hisse satın alın"

 buy_shares_decision_tooltip_confirm_text_desc:0 "Bir hissenin güncel fiyatı nedir?"

 buy_shares_decision_effect:0 "Size, bankanın güncel değerlemesine göre belirlenen bir fiyattan banka hissesi satın alma şansı sunulacak."

 bank_needs_no_cash:0 "Banka yeterli nakit rezervine sahip ve şu anda yeni yatırım kabul etmiyor"

 sell_shares_decision:0 "Hisse Sat"

 sell_shares_decision_IB_desc:0 "[ROOT.Char.Custom('agot_bank_name')] şu anda hisselerinizden birinin karşılığını ödeyecek kadar altına sahip.\n\nŞu anda Demir Bank'ta [ROOT.Var('IB_Shares').GetValue] hisseye sahipsiniz."

 sell_shares_decision_bank1_desc:0 "[ROOT.Char.Custom('agot_bank_name')] şu anda hisselerinizden birinin karşılığını ödeyecek kadar altına sahip.\n\nŞu anda bankada [ROOT.Var('bank1_Shares').GetValue] hisseye sahipsiniz."

 sell_shares_decision_bank2_desc:0 "[ROOT.Char.Custom('agot_bank_name')] şu anda hisselerinizden birinin karşılığını ödeyecek kadar altına sahip.\n\nŞu anda bankada [ROOT.Var('bank2_Shares').GetValue] hisseye sahipsiniz."

 sell_shares_decision_bank3_desc:0 "[ROOT.Char.Custom('agot_bank_name')] şu anda hisselerinizden birinin karşılığını ödeyecek kadar altına sahip.\n\nŞu anda bankada [ROOT.Var('bank3_Shares').GetValue] hisseye sahipsiniz."

 sell_shares_decision_tooltip:0 "Sana bir hissenin güncel fiyatına eşit altın teklif edilecek."

 sell_shares_decision_tooltip_confirm_text_desc:0 "Bir hissenin güncel fiyatı nedir?"

 sell_shares_decision_effect:0 "Sana bir hissenin güncel fiyatına eşit altın teklif edilecek."

 set_risk_level_decision:0 "Risk Seviyesini Değiştir"

 set_risk_level_decision_desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin [agot_bank_director|E] olarak, bankanın kredi verirken veya yatırım yaparken ne kadar [Concept('agot_bank_risk_level','risk')|E] kabul etmeye istekli olduğuna karar verebilirsin."

 set_risk_level_decision_tooltip:0 "Krediler ve yatırımlar için düşük, orta ve yüksek risk seviyeleri arasında seçim yapabileceksin."

 set_risk_level_decision_tooltip_confirm_text_desc:0 "Bankanın politikalarını yeniden değerlendireceğim."

 set_risk_level_decision_effect:0 "Krediler ve yatırımlar için düşük, orta ve yüksek risk seviyeleri arasında seçim yapabileceksin."

 set_dividend_level_decision:0 "Temettü Oranlarını Ayarla"

 set_dividend_level_decision_desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin [agot_bank_director|E] olarak, bankanın [agot_bank_profits|E]'inin ne kadarının hissedarlarına ödeneceğini ayarlayabilirsin."

 set_dividend_level_decision_tooltip:0 "Düşük, orta ve yüksek [agot_bank_dividends|E] oranları arasında seçim yapabileceksin."

 set_dividend_level_decision_tooltip_confirm_text_desc:0 "Bankanın politikalarını yeniden değerlendireceğim."

 set_dividend_level_decision_effect:0 "Düşük, orta ve yüksek [agot_bank_dividends|E] oranları arasında seçim yapabileceksin."

 show_bank_numbers_decision:0 "Defteri İncele"

 show_bank_numbers_decision_confirm:0 "Bir göz atalım"

 show_bank_numbers_decision_desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin defterinde görülebilecek çeşitli mali varlıkları ve yükümlülükleri var. Bu, bankanın şu anda elinde ne kadar olduğunu ve gelecekte ne kadar tahsil edebileceğini gösterecek."

 show_bank_numbers_decision_tooltip:0 "Hesaplara bir göz atalım"

 show_bank_numbers_decision_effect:0 "Size bankanın güncel tüm önemli rakamlarının bir özeti sunulacak."

 fill_investment_fund_decision:0 "Yatırım Fonunu Yenile"

 fill_investment_fund_decision_desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin [agot_bank_director|E] olarak, bankanın yatırım fonunu büyütme fırsatına sahipsin. Bu fondaki para, sürekli kâr fırsatları sağlayan küçük işletmelere ve projelere yatırılır. Ancak yatırılan para her zaman tamamen kaybolma riski taşır; bu da bankanın likiditesini tehdit edebilir. Yatırım fırsatlarının sürdürülebilirliğini ve güvenilirliğini iyi anlamak, iyi uzun vadeli performans sağlamanın anahtarıdır."

 fill_investment_fund_decision_tooltip:0 "Her iki yılda bir 1000 altın yatırabilirsin. Yatırım fonunun performansı, mevcut direktörün yönetim becerisine bağlıdır."

 fill_investment_fund_decision_tooltip_confirm_text_desc:0 "Banka refaha erecek."

 fill_investment_fund_decision_effect:0 "Bankanın nakit rezervinden yatırım fonuna 1000 altın aktaracaksın. Yatırım fonundaki para bağlıdır ve geri çekilemez."

 agot_banking.0215.t:0 "Yeni Direktör Seçimi"

 agot_banking.0215.desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin bir sonraki [agot_bank_director|E]'sini seçme zamanı geldi.\n\nBankayı refah dolu bir geleceğe taşıması için makama bir hissedar seçilmeli. Bankada en çok hisseye sahip dört hissedar, liderlik için adaydır.\n\nHer hissedar bir adaya oy verebilir. Aday, hissedarın sahip olduğu her hisse için bir oy alır. Kazanan, en çok oyu alan adaydır.\n\nOylarınız kime gidecek?"

 agot_banking.0215.a:0 "[director_candidate1.GetTitledFirstName]'e oy veriyorum."

 agot_banking.0215.b:0 "[director_candidate2.GetTitledFirstName] benim desteğimi alıyor."

 agot_banking.0215.c:0 "[director_candidate3.GetTitledFirstName] gelecektir."

 agot_banking.0215.d:0 "[director_candidate4.GetTitledFirstName]'i seçiyorum."

 agot_banking.1001.t:0 "Bir Banka Seç"

 agot_banking.1001.desc:0 "Kredi sağlayan birden çok [agot_banks|E] var. Hangisiyle iletişime geçilsin?"

 agot_banking.1001.a:0 "Braavos'un Demir Bank'ını seçiyorum."

 agot_banking.1001.low_interest:0 "Bu bankadaki [agot_bank_interest_rate|E] düzeyi #difficult_easy şu anda düşürülmüş#!."

 agot_banking.1001.medium_interest:0 "Bu bankadaki [agot_bank_interest_rate|E] düzeyi #difficult_medium şu anda dengeli#!."

 agot_banking.1001.high_interest:0 "Bu bankadaki [agot_bank_interest_rate|E] düzeyi #difficult_hard şu anda artırılmış#!."

 agot_banking.1001.b:0 "[director_bank1.Custom('agot_bank_name')]'ni seçiyorum."

 agot_banking.1001.c:0 "[director_bank2.Custom('agot_bank_name')]'ni seçiyorum."

 agot_banking.1001.d:0 "[director_bank3.Custom('agot_bank_name')]'ni seçiyorum."

 agot_banking.1001.e:0 "Fikrimi değiştirdim."

 set_interest_level_decision:0 "Faiz Oranlarını Ayarla"

 set_interest_level_decision_desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin [agot_bank_director|E] olarak, yeni verilen kredilerin genel [agot_bank_interest_rate|E] düzeyini ayarlayabilirsin."

 set_interest_level_decision_tooltip:0 "Daha düşük, normal ve daha yüksek faiz oranları arasında seçim yapabileceksin. Faiz oranı ne kadar düşükse o kadar çok müşteri çekersin ve kredi başına [agot_bank_profits|E]'in o kadar düşük olur; ve tam tersi."

 set_interest_level_decision_tooltip_confirm_text_desc:0 "Bankanın politikalarını yeniden değerlendireceğim."

 set_interest_level_decision_effect:0 "Daha düşük, normal ve daha yüksek faiz oranları arasında seçim yapabileceksin. Faiz oranı ne kadar düşükse o kadar çok müşteri çekersin ve kredi başına [agot_bank_profits|E]'in o kadar düşük olur; ve tam tersi."

 agot_banking.0208.t:0 "Faiz Oranı Düzeyine Karar Ver"

 agot_banking.0208.desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin [agot_bank_director|E] olarak, yeni verilen kredilerin genel [agot_bank_interest_rate|E] düzeyine karar vermek bana düşüyor. Faiz oranı ne kadar düşük olursa, o kadar çok müşteri çekebilirim, ancak kredi başına [agot_bank_profits|E]'im o kadar düşük olur; tam tersi de geçerli."

 agot_banking.0208.a:0 "Daha rekabetçi olmalıyız."

 agot_banking.0208.a_tt:0 "Yıllık faiz oranı bir yüzde puanı düşürülür. Bu daha fazla müşteri çekerken, müşteri başına kârı azaltır."

 agot_banking.0208.b:0 "Dengeli bir politika daha sürdürülebilir."

 agot_banking.0208.b_tt:0 "Yıllık faiz oranı varsayılan düzeye ayarlanacak."

 agot_banking.0208.c:0 "Daha kârlı olmalıyız."

 agot_banking.0208.c_tt:0 "Yıllık faiz oranı bir yüzde puanı artırılır. Bu daha az müşteri çekerken, müşteri başına kârı artırır."

 found_bank_decision:0 "Yeni Bir Banka Kur"

 found_bank_decision_desc:0 "Yeterince servet ve mali bilgi biriktirdiysen, yeni bir [agot_bank|E] kurarak refahını genişletmek isteyebilirsin."

 found_bank_decision_tooltip:0 "Başkentinde yeni bir banka kurulacak. Bankanın ilk [agot_bank_director|E]'si sen olacaksın ve topraklarındaki her karakter, hissedar olmak için yeni bankaya para yatırabilir."

 found_bank_decision_tooltip_confirm_text_desc:0 "Refaha!"

 not_in_a_megawar_realm:0 "Toprakların savaşla bölünemez"

 agot_found_bank_decision_effect_tooltip:0 "Başkentinde yeni bir [agot_bank|E] kurulacak. Bankanın ilk [agot_bank_director|E]'si sen olacaksın ve topraklarındaki her karakter, hissedar olmak için yeni bankaya para yatırabilir."

 rename_bank_decision:0 "Bankayı Yeniden Adlandır"

 rename_bank_decision_desc:0 "İsimler güç barındırır. Son zamanlarda [ROOT.Char.Custom('agot_bank_name')]'nin vermesi gereken güveni veremediği endişesine kapıldım. Yeni bir isim, imajına yeni bir hayat üfleyebilir ve daha fazla güven ile daha çok yatırım sağlanmasına yardımcı olabilir."

 rename_bank_decision_tooltip:0 "Bankan için yeni bir isim seç"

 rename_bank_decision_tooltip_confirm_text_desc:0 "Hatırlanmaya değer bir isim verelim."

 agot_rename_bank_decision_effect_tooltip:0 "Banka için yeni bir isim seçebilirsin."

 agot_banking.0601.t:0 "Yeni Bir Banka"

 agot_banking.0601.desc:0 "Bugün yeni bir banka kapılarını açtı ve ben onun ilk [agot_bank_director|E]'si olacağım. Banka derhal kredi dağıtmaya başlayacak ve bankanın refahını güçlendirmek için yeni yatırımcılar bulunacak.\n\nYeni bankanın adı ne olmalı?"

 agot_banking.0601.a:0 "Gelecek parlak!"

 agot_banking.0602.t:0 "Önemli Yeni Bir Borçlu"

 agot_banking.0602.desc:0 "Bugün, [messaged_director.Custom('agot_bank_name')], [NewDebtor.GetTitledFirstName]'e [NewDebtor.MakeScope.Var('loaned_amount').GetValue|2|P] gibi devasa bir miktarda altın kredi verdi. Bu, [NewDebtor.GetHerHim]'i en büyük müşterilerimizden biri yapıyor."

 agot_banking.0602.a:0 "Seninle iş yapmak bir zevkti."

 agot_banking.0607.t:0 "Bir İsmin Ağırlığı"

 agot_banking.0607.desc:0 "Bir isim algıyı şekillendirebilir, mirası tanımlayabilir ve paradan çok daha öte bir ağırlık taşır. Bankanın direktörü olarak, onu yeniden adlandırma ayrıcalığı — ve gücü — artık bana düşüyor. Mevcut isim görevini yaptı... ama artık yeterli olmadığına inanıyorum. Bu kurum hırslarımı yansıtacaksa, onlara layık bir isim taşımalı."

 agot_banking.0607.a:0 "Yakışan bir isim."

 show_shareholders_decision:0 "Hissedarları Göster"

