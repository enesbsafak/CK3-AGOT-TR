l_english:

 agot_banking.0001.t:0 "Bankadan Gelen Elçiler"

 agot_banking.0001.desc:0 "Kullarım bana, [agot_bank|E] elçilerinin kendileriyle talep ettiğim görüşme için nihayet geldiğini bildirdi. Bu saygın konukları gücendirmek istemediğimden, onlarla ilgilenmek üzere derhal yola koyuluyorum.\n\nElçiler salonumda yabancı görünüyor; cübbeleri, muhafızlarımın haşlanmış deri zırhlarıyla keskin bir tezat oluşturuyor. Ancak teklifleri yeterince açık.\n\nÖnüme, süreleri ve değerleri değişen çeşitli krediler seriyorlar. Asıl mesele, hangisinin ihtiyaçlarıma en uygun olduğu."

 agot_banking.0001.a:0 "#bold Küçük#! bir miktar altını #bold uzun#! vadede seçiyorum."

 agot_banking.0001.a_tt:0 "Bu kredi #difficulty_easy en düşük#! [agot_bank_interest_rate|E]'ne sahip olacak."

 agot_banking.0001.b:0 "#bold Küçük#! bir miktar altını #bold kısa#! vadede seçiyorum."

 agot_banking.0001.b_tt:0 "Bu, kredinin [agot_bank_interest_rate|E]'ni #difficulty_medium orta düzeyde#! artıracak."

 agot_banking.0001.c:0 "#bold Büyük#! bir miktar altını #bold uzun#! vadede seçiyorum."

 agot_banking.0001.c_tt:0 "Bu, kredinin [agot_bank_interest_rate|E]'ni #difficulty_hard önemli ölçüde#! artıracak."

 agot_banking.0001.d:0 "#bold Büyük#! bir miktar altını #bold kısa#! vadede seçiyorum."

 agot_banking.0001.d_tt:0 "Bu kredi #XB çok riskli#!dir. [agot_bank_interest_rate|E] yüksek olacak."

 agot_banking.0001.e:0 "Fikrimi değiştirdim, onları geri gönder."

 agot_banking.0001.e_tt:0 "Elçiler geri gönderilir."

 agot_banking.0002.t:0 "Kredi Reddedildi"

 agot_banking.0002.desc:0 "Kredimin koşullarını ve potansiyel risklerini değerlendirdikten sonra [agot_bank|E] elçileri, fon talebimi reddetti. Mevcut mali durumum fazlasıyla belirsiz görünüyor; bankanın mevcut mali rezervleri ve geri ödeme tarihlerine uyabileceğime olan inancı göz önüne alındığında, böyle bir kredi [Concept('agot_bank_risk_level', 'yüksek risk') |E] taşıyacaktır."

 agot_banking.0002.a:0 "İhtiyaç duyduğum fonları başka yerde bulacağım."

 agot_banking.0003.t:0 "Bankadan Bir Teklif"

 agot_banking.0003.desc:0 "Riskleri tarttıktan sonra, [agot_bank|E] elçileri bana aşağıdaki koşullarla bir kredi teklif etmeye karar verdi:\n@gold_icon! [ROOT.Var('loaned_amount').GetValue|2|P] tutarında kredi alacağım.\nPara, [ROOT.Var('loan_term').GetValue|0|N] yıl içinde, yıllık [ROOT.Var('loan_interest_rate').GetValue|0|N] yüzde [agot_bank_interest_rate|E] ile geri ödenecek.\n\n#help @warning_icon! Kredi süresi boyunca ölürsen, faiz dahil borcun tamamı derhal muaccel hale gelir ve hayatta kalan birincil varisin tarafından ödenmesi gerekir.#!"

 agot_banking.0003.a:0 "Bu koşullar bir hakarettir. Yolunuza gidin!"

 agot_banking.0003.b:0 "Bu anlaşma makul, kabul ediyorum!"

 agot_banking.0003.c:0 "Vade ve tutar hakkında tekrar konuşalım."

 agot_banking.0004.t:0 "Bankanın Alacağı"

 agot_banking.0004.desc:0 "Elçilerin [agot_bank|E] alacağını tahsil etmek için gelmesiyle salonlarıma gerginlik yayılıyor.\n\nKısa bir nezaket alışverişinin ardından bankanın elçileri bana birkaç sayfa kağıt uzatıyor. İlki, vadesinin artık dolduğunu kanıtlayan orijinal kredi sözleşmesinin bir kopyası. İkincisi ise artık onlara toplam [ROOT.Var('total_repayment').GetValue|2|N] borçlu olduğumu ve bunun derhal ödenmesi gerektiğini gösteren bir hesap dökümü."

 agot_banking.0004.a:0 "Kredim tamamen ödenecek."

 agot_banking.0004.a_tt:0 "Kredin kapanacak ve borçsuz olacaksın."

 agot_banking.0004.b:0 "Şimdilik sadece faizi karşılayabilirim."

 agot_banking.0004.b_tt:0 "Krediniz uzatılacak ve [Concept('agot_bank_interest_rate', 'faiz') |E] işlemeye devam edecek. Bu, bir temerrüt olarak sayılmaz."

 agot_banking.0004.c:0 "Henüz hiçbir şey ödeyecek durumda değilim..."

 agot_banking.0004.c_tt:0 "Banka bunu bir temerrüt olarak değerlendirecek. Ancak yeni bir anlaşmayı kabul edebilirsin: Kredi 5 yıl uzatılacak, fakat gelecekteki tüm kredilerinizde [agot_bank_interest_rate|E] önemli ölçüde artacak. #italic Bu son şansınız!#!"

 agot_banking.0004.d:0 "Benden bir kuruş göremezsin!"

 agot_banking.0004.d_tt:0 "Kredinizi ödemeyi reddediyorsunuz. Banka bundan hoşnut olmayacak, bir daha asla kredi alamayacaksınız... Ve banka alacağını her zaman tahsil eder."

 agot_banking.0005.t:0 "Geri Ödeme"

 agot_banking.0005.desc:0 "Kredimi vadesi dolmadan önce geri ödeyebilirim. Borcun tamamını veya sadece yarısını ödemeyi seçebilirim."

 agot_banking.0005.a:0 "Kredimi tamamen geri ödeyeceğim."

 agot_banking.0005.a_tt:0 "Kredin kapanacak ve borçsuz olacaksın."

 agot_banking.0005.b:0 "Borçlu olduğumun yarısını karşılayacağım."

 agot_banking.0005.b_tt:0 "Kredi tutarının yarısını ve işlenen [Concept('agot_bank_interest_rate','faiz')|E]'in yarısını ödersiniz. Kalan tutar, kredinin vadesi dolduğunda ödenebilir."

 agot_banking.0005.c:0 "50 ödeyeceğim."

 agot_banking.0005.c_tt:0 "50 altın ödersiniz. Kalan tutar, kredinin vadesi dolduğunda ödenebilir."

 agot_banking.0005.d:0 "Fikrimi değiştirdim, daha sonra geri ödeyeceğim."

 agot_banking.0006.t:0 "Miras Kalan Borç"

 agot_banking.0006.desc:0 "[parent_debtor.GetTitledFirstName], [parent_debtor.GetSheHe] huzur içinde yatsın, [agot_bank|E]'ne borçluydu.\n\nBenim de devam eden bir kredim olduğundan, banka bana iki kredinin birleştirileceğini bildiren bir mektup gönderdi; zira yasal varis olduğum için [parent_debtor.GetFirstNamePossessiveNoTooltip] yükümlülüklerini yerine getirmekle mükellefim.\n\nŞu an borçlu olduğum toplam tutar @gold_icon! [ROOT.Var('total_repayment').GetValue|2|N]."

 agot_banking.0006.a:0 "Miras için teşekkürler..."

 agot_banking.0007.t:0 "Miras Kalan Borç"

 agot_banking.0007.desc:0 "[parent_debtor.GetTitledFirstName], [parent_debtor.GetSheHe] huzur içinde yatsın, [agot_bank|E]'ne borçluydu.\n\n[parent_debtor.GetHerHis] yasal varisi olduğum için [parent_debtor.GetFirstNamePossessiveNoTooltip] yükümlülüklerini yerine getirmekle mükellefim. Bankanın yakında benimle iletişime geçmesini beklemeliyim.\n\nBorçlu olduğum toplam tutar @gold_icon! [ROOT.Var('total_repayment').GetValue|2|N]."

 agot_banking.0007.a:0 "Miras için teşekkürler..."

 agot_banking.0101.t:0 "Bankanın Gazabı"

 agot_banking.0101.desc:0 "[agot_bank|E] tarafından gönderilen ve finanse edilen akıncılar, makamımı yağmalamak amacıyla topraklarıma akın etti!\n\nNeyse ki askerlerim, kayda değer bir hasar verilmeden önce onları püskürtmeye yetecek kadar güçlüydü. Yakalanan akıncılar, borçlu olduğum parayı ödemememi tazmin etmek için banka tarafından kiralandıklarını itiraf etti. Görünüşe göre banka, alacağını tahsil etmek için artık daha uç yöntemlere başvuruyor.\n\nUmalım ki tekrar denerlerse sonuç aynı olur..."

 agot_banking.0101.a:0 "Alacaklarını tahsil etmenin yolu gerçekten bu mu?"

 agot_banking.0102.t:0 "Bankanın Gazabı"

 agot_banking.0102.desc:0 "Tarlalarım çorak kaldı ve tebaam sevdiklerinin yasını tutuyor; topraklarımı yağmalayan paralı askerler, yağmaladıklarını [agot_bank|E]'ndeki efendilerine iade etmek üzere denize süzülerek geri dönüyor!\n\nKuvvetlerim onların gücünü püskürtmeye yetmedi ve yerel garnizon onların iradesine boyun eğdi. Topraklar bu akının izlerini uzun süre, tebaam ise belki daha da uzun süre taşıyacak.\n\nAkından kısa süre sonra bankadan bir mektup alıyorum; borcumu kapatmış saydıklarını basitçe bildiriyor."

 agot_banking.0102.a:0 "Ödemem gereken bedel bu mu?"

 agot_banking.0103.t:0 "Karanlıkta Bir Hançer"

 agot_banking.0103.desc:0 "[agot_bank|E] peşime bir suikastçı gönderdi!\n\nMuhafızlarım görevlerinde gayretliydi; saldırgan, güvenilir bir hizmetkarın yüzüne bürünmüş olmasına rağmen kimliğini bir şekilde tespit ettiler! Sessiz ve korkakça bir infazdan kurtuldum, ancak karanlıkta başka bir hançerin gölgesi üzerimde süzülüyor. Görünüşe göre banka, alacağını tahsil etmek için hiçbir şeyden geri durmayacak."

 agot_banking.0103.a:0 "Kahrolsun o açgözlü muhasebeciler!"

 agot_banking.0104.t:0 "Valar Ademmis"

 agot_banking.0104.desc:0 "Ne acımasız bir ironi: bankanın gönderdiği suratsız bir adam, temerrüde düşmemi içinden çıkılmaz bir soruna dönüştüren dertlere kafa yorarken tam gözlerimin önünde kendini göstermeli. Bir hizmetkarın kimliğine bürünen kişi, üzerime sessizce sokulup boğazıma bir bıçak dayamakta hiç zorlanmadı.\n\nKan serbestçe akıyor ve bu hareket o kadar büyük bir ustalıkla yapıldı ki dudaklarımdan bir yardım çığlığı bile koparamıyorum.\n\nÖlmekte olan acımın ortasında, alacaklılarımın sabrını yitirdiğini ve varisimin daha uysal olacağını umduklarını anlıyorum."

 agot_banking.0104.a:0 "[ROOT.Char.Custom('Scream')]"

 agot_banking.0105.t:0 "Boşa Çıkan Bir Darbe"

 agot_banking.0105.desc:0 "[agot_bank|E], beni [ROOT.Char.GetLadyLord] makamından devirme girişiminde başarısız oldu!\nBir vassalımın, temerrüde düşen kredimi ödemesi karşılığında topraklarımı fethetmesini desteklemeyi planlamışlardı. Başarısız oldular ve kılıçlar şimdilik sessiz kaldı — öyle ya, bankanın günün birinde altınını geri almak için hırslı ve hain bir ortak bulacağına şüphe yok.\n\nBanka, iktidarımı zayıflatmaya ve en beklemediğim anda taht sahtekarları çıkarmaya devam edecek."

 agot_banking.0105.a:0 "Hükümdarlığım o kadar da istikrarsız değil!"

 agot_banking.0106.t:0 "Altın Bir Rakip"

 agot_banking.0106.desc:0 "[agot_bank|E], beni tahttan indirmesi için [buyer.GetTitledFirstName]'in arkasında durdu! [buyer.GetFirstNameNoTooltip], bu ihanette bankanın desteğini almak karşılığında ödenmemiş temerrüt borcumu ödemeyi kabul etti. Bankanın bana karşı olduğu yönündeki basit bir açıklama bile akranlarımın gözündeki meşruiyetime zarar verdi.\nŞimdi geriye yalnızca [buyer.GetFirstNameNoTooltip]'in iddiasını öne sürüp sürmeyeceğini görmek kaldı..."

 agot_banking.0106.a:0 "Onu savaşmadan bırakmam!"

 agot_banking.0116.t:0 "Yükselmek İçin Bir Şans"

 agot_banking.0116.desc:0 "Bugün sarayıma, [agot_bank|E]'nin temsilcisi olduğunu iddia eden bir adam geldi. Kimliğini doğruladıktan sonra, bankanın [FinalDefaulter.GetFirstNamePossessive] topraklarını ele geçirmemi desteklemeye istekli olduğunu bildirdi. Onlar için tek yapmam gereken, [FinalDefaulter.GetTitledFirstNameNoTooltip]'in temerrüde düştüğü kredinin kalanını ödemek. Bedel yüksek, ama yine de cezbedici bir teklif..."

 agot_banking.0116.a:0 "Bu verimli bir ortaklık olacak!"

 agot_banking.0116.b:0 "Bu toprakları arzulamıyorum."

 agot_banking.0107.t:0 "Bir Alacaklının Talepleri"

 agot_banking.0107.desc:0 "[agot_bank|E], efendime bir mektup göndererek [debtors_liege.GetHerHim]'i ödeme temerrüdüm hakkında bilgilendirdi ve fonlarını tahsil edebilmek için [debtors_liege.GetHerHis] desteğini talep etti. [debtors_liege.GetTitledFirstName]'i, bankanın iddialarının geçersiz ve haksız olduğuna ikna etmeyi deneyebilirim; belki o zaman beni bankayı tazmin etmeye zorlamaz... ya da daha da sert önlemler alabilirim..."

 agot_banking.0107.a:0 "Elbette [debtors_liege.GetSheHe] beni bankacılara satmayacaktır."

 agot_banking.0108.t:0 "Bozulan Bir Sözleşme"

 agot_banking.0108.desc:0 "[FinalDefaulter.GetTitledFirstName]'in [FinalDefaulter.GetHerHis] kredisinde temerrüde düştüğü ve [agot_bank|E]'ne daha fazla ödeme yapmayı ya da yeni bir planı kabul etmeyi reddettiği bilgisi bana ulaştı.\n\nBanka, [FinalDefaulter.GetFirstNamePossessiveNoTooltip] efendisi olarak tebaamı sözleşmelerine sadık kalmaya zorlamakla yükümlü olduğumda ısrar ediyor.\n\nBir an için bankanın talebini reddetmeyi düşünüyorum — vassalımı karşıma almamak için — ancak bu kesinlikle bir hakaret olarak görülecek ve ileride kendi adıma bir krediye ihtiyaç duyarsam bankaların fon sağlama isteğine zarar verecektir.\n\n[FinalDefaulter.GetFirstNamePossessiveNoTooltip] borcunu kendim ödeyebilirim... Ama bu davranışı ödüllendirmek istemiyorum."

 agot_banking.0108.a:0 "[FinalDefaulter.GetFirstNameNoTooltip] sözleşmesine sadık kalmalı!"

 agot_banking.0108.a_tt:0 "[FinalDefaulter.GetTitledFirstName] reddederse, hapis cezası için bir gerekçe elde edersin."

 agot_banking.0108.b:0 "Borç olanı kendi cebimden ödeyeceğim..."

 agot_banking.0108.c:0 "Para yüzünden çıkan bu küçük tartışmalar beni ilgilendirmez."

 agot_banking.0108.c_tt:0 "Bu, gelecekteki tüm kredilerinizin [agot_bank_interest_rate|E]'ni artıracak."

 agot_banking.0109.t:0 "Korkunç Bir Emir"

 agot_banking.0109.desc:0 "[debtors_liege.GetTitledFirstName] beni çağırarak yakın zamanda temerrüde düştüğüm kredinin kalanını ödememi talep etti. [agot_bank|E]'nin, alacağını tahsil edene dek beni rahatsız etmekten vazgeçmeyeceği ve geri ödeme peşinde amansız olacağı açık. Bu altın, efendime karşı gelmeye değer mi?\n\n[debtors_liege.GetFirstNameNoTooltip], bankayla olan sözleşmeme sadık kalmakla yükümlü olduğumu, geri ödemeye devam etmem gerektiğini ve üç yıl içinde ödemeyi tamamlamamın yanı sıra önceki temerrüdüm için derhal bir ceza ödemesi yapmam gerektiğini ilan etti."

 agot_banking.0109.a:0 "Efendimin emrettiği gibi."

 agot_banking.0109.a_tt:0 "Kredin devam edecek, geri ödeme üç yıl içinde vadesini dolduracak."

 agot_banking.0109.b:0 "Yapmayacağım!"

 agot_banking.0109.b_tt:0 "Uymayı reddedersen, efendin seni hapsetmeye teşebbüs edebilir!"

 agot_banking.0110.t:0 "Yerine Getirilen Bir Yükümlülük"

 agot_banking.0110.desc:0 "[FinalDefaulter.GetTitledFirstName] emrime uydu ve [agot_bank|E]'ne olan kredisini üç yıl içinde geri ödemeyi taahhüt etti."

 agot_banking.0110.a:0 "[FinalDefaulter.GetFirstName]'in sözünü tutmasına sevindim."

 agot_banking.0111.t:0 "Karşı Çıkılan Bir Emir"

 agot_banking.0111.desc:0 "[FinalDefaulter.GetTitledFirstName], [agot_bank|E]'ne olan temerrüde düşmüş kredisini ödemeyi reddetti.\n\nBu saygısızlık cezasız kalamaz!"

 agot_banking.0111.a:0 "[FinalDefaulter.GetSheHe|U] bundan pişman olacak."

 agot_banking.0112.t:0 "Altınla Ödenen Bir İyilik"

 agot_banking.0112.desc:0 "[debtors_liege.GetTitledFirstName], [debtors_liege.GetHerHis] sarayına bir [agot_bank|E] temsilcisinin geldiğini ve yakın zamandaki temerrüdüm karşısında harekete geçmemin talep edildiğini bana bildirdi. Bankayla iyi ilişkilerini sürdürmek için [debtors_liege.GetSheHe] borçlu olduğumu bizzat ödedi. Ancak karşılığında bir iyilik bekleyecek."

 agot_banking.0112.a:0 "Yeter ki ben ödemeyeyim..."

 agot_banking.0113.t:0 "Önlenen Felaket"

 agot_banking.0113.desc:0 "[agot_bank|E] ekonomimi yoksullaştırmaya çalıştı!\n\nBaşkentimdeki kilit işletmeleri ele geçirmeye, halkın zararına fiyatları yükseltip maliyetleri kısarak borçlu olduğum parayı doğrudan hazinelerimden sızdırmaya çalıştılar. Neyse ki girişimleri o kadar aşikardı ki onu zamanında fark edip devralmayı önceden engelledim; böylece ekonominin sağlığını güvence altına alıp hasarın çoğunu önledim."

 agot_banking.0113.a:0 "Halkım benim yüzümden dolandırılmayacak."

 agot_banking.0114.t:0 "Ekonomik Çöküş"

 agot_banking.0114.desc:0 "[agot_bank|E] ekonomimi baltaladı!\n\nŞehirlerimdeki temel işletmeleri ele geçirdiler ve borçlu olduğum parayı doğrudan hazinelerimden ve halkın cebinden sızdırmak için fiyatları yükselttiler! Ben farkına varamadan, banka kayıplarını karşılamak için başkentimden hatırı sayılır miktarda fonu kendi cebine aktardı. Verdikleri hasar uzun süre kalıcı olacak ve halkımı yıllarca yoksullaştıracak."

 agot_banking.0114.a:0 "Bu bir felaket!"

 agot_banking.0115.t:0 "Bir Borçlunun Ölümü"

 agot_banking.0115.desc:0 "[DeadDefaulter.GetFirstName], [DeadDefaulter.GetHerHis] kredisini geri alma çabalarımız hayata geçirilemeden öldü; bu yüzden borçları [DeadDefaulter.GetHerHis] varisine geçti ve şimdilik başka bir işlem yapılmasına gerek yok."

 agot_banking.0115.a:0 "Bazı sorunlar kendiliğinden çözülür."

 agot_banking.0202.t:0 "[ROOT.Char.Custom('agot_bank_name')]'in Defter Tutması"

 agot_banking.0202.IB.desc:0 "Braavos'un Demir [agot_bank|E]'si her 5 yılda bir hissedarlarına son dönemdeki performansını bildirir ve yatırımcılarına temettü öder.\n\n#T [agot_bank_director|E] [director.GetTitledFirstName] tarafından sunulan güncel rakamlar şunlardır:#!\n\nKullanılabilir sermaye:                            #bold [ROOT.Var('IB_FreeCapital').GetValue|2] #!\nMüşterilere kredi olarak verilen sermaye:       #bold [ROOT.Var('IB_LoanedCapital').GetValue|2] #!\nYatırım fonu hacmi:             #bold [ROOT.Var('IB_InvestmentFund').GetValue|2] #!\nBankanın toplam değeri:                #bold [ROOT.Var('IB_BankValue').GetValue|2] #!\nÇıkarılan hisse sayısı:             #bold [ROOT.Var('IB_NofShares').GetValue|0] #!\nGelir:                                          #bold [ROOT.Var('IB_Earnings').GetValue|2|P] #!\nGiderler:                                         #bold [ROOT.Var('IB_Expenses').GetValue|2|N] #!\nTemerrüt nedeniyle kaybedilen krediler:                     #bold [ROOT.Var('IB_LostLoans').GetValue|2|N] #!\nNet kâr:                                        #bold [ROOT.Var('IB_Profit').GetValue|2] #!\nHisse başına kâr:                              #bold [ROOT.Var('IB_ProfitPerShare').GetValue|2] #!\nHisse başına temettü:                         #bold [ROOT.Var('IB_DividendPerShare').GetValue|2] #!"

 agot_banking.0202.bank1.desc:0 "[ROOT.Char.Custom('agot_bank_name')] her 5 yılda bir hissedarlarına dönem içindeki performansını bildirir ve yatırımcılarına temettü öder.\n\n#T [agot_bank_director|E] [director.GetTitledFirstName] tarafından sunulan güncel rakamlar şunlardır:#!\n\nKullanılabilir sermaye:                            #bold [ROOT.Var('bank1_FreeCapital').GetValue|2] #!\nMüşterilere kredi olarak verilen sermaye:       #bold [ROOT.Var('bank1_LoanedCapital').GetValue|2] #!\nYatırım fonu hacmi:             #bold [ROOT.Var('bank1_InvestmentFund').GetValue|2] #!\nBankanın toplam değeri:                #bold [ROOT.Var('bank1_BankValue').GetValue|2] #!\nÇıkarılan hisse sayısı:             #bold [ROOT.Var('bank1_NofShares').GetValue|0] #!\nGelir:                                          #bold [ROOT.Var('bank1_Earnings').GetValue|2|P] #!\nGiderler:                                         #bold [ROOT.Var('bank1_Expenses').GetValue|2|N] #!\nTemerrüt nedeniyle kaybedilen krediler:                     #bold [ROOT.Var('bank1_LostLoans').GetValue|2|N] #!\nNet kâr:                                        #bold [ROOT.Var('bank1_Profit').GetValue|2] #!\nHisse başına kâr:                              #bold [ROOT.Var('bank1_ProfitPerShare').GetValue|2] #!\nHisse başına temettü:                         #bold [ROOT.Var('bank1_DividendPerShare').GetValue|2] #!"

