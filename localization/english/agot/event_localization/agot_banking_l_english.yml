 take_vassal_loan_interaction:0 "Bir Vassaldan Kredi İste"

 take_vassal_loan_interaction_desc:0 "Vassalından kişisel bir kredi iste. Kredinin faizi %25 olacak ve 5 yıllık sürenin ardından geri ödenmesi bekleniyor."

 liege_requests_loan:0 "Son zamanlarda bazı mali zorluklarla karşılaştım. Bana [actor.MakeScope.Var('vassal_loan_amount').GetValue] altın kredi vermeye istekli olur musun?\nTutar, %25 faiziyle birlikte 5 yıl içinde geri ödenecek."

 agot_banking.0501.t:0 "[loan_vassal.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_banking.0501.desc:0 "Kredi talebini kabul etmekten memnuniyet duyuyorum ve altını sana göndereceğim. Beş yıl dolduğunda ödemenin tamamlanmış olmasını bekliyorum."

 agot_banking.0501.a:0 "İyi haber!"

 agot_banking.0502.t:0 "[loan_vassal.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_banking.0502.desc:0 "Maalesef aradığın krediyi sana sağlayamam. Bu parayı yıllarca belirli amaçlar için kullanmak üzere kenara ayırdım. Umarım anlayış gösterir ve beni bağışlarsın."

 agot_banking.0502.a:0 "Hayal kırıklığı."

 agot_banking.0503.t:0 "Sözverenim,"

 agot_banking.0503.desc:0 "Kredi talebini yerine getireli beş yıl oldu. Anlaştığımız gibi geri ödeme zamanı geldi. Sözünü tutacak ve bana ait olanı iade edecek kadar onurlu mısın?"

 agot_banking.0503.a:0 "Borçlu olduğum her şeyi geri ödeyeceğim."

 agot_banking.0503.a_tt:0 "Kredi tamamen ödenecek."

 agot_banking.0503.b:0 "Şimdilik sadece faizi karşılayabilirim."

 agot_banking.0503.b_tt:0 "Kredi beş yıl daha uzatılacak."

 agot_banking.0503.c:0 "Şu anda hiçbir şey ödeyemem. Ama sana bir iyilik borçlu kalacağım!"

 agot_banking.0503.c_tt:0 "Kredinde temerrüde düşüyor ve hiçbir şey ödemiyorsun. Kredi beş yıl daha uzatılacak ve [vassal_loan_creditor.GetTitledFirstName] üzerinde zayıf bir koz elde edecek."

 agot_banking.0503.d:0 "Hiçbir şey ödeyemem. Seni uygun gördüğün herhangi bir şekilde tazmin edeceğim!"

 agot_banking.0503.d_tt:0 "Kredinde ikinci kez temerrüde düşüyorsun. Kredi kapatılacak ve karşılığında [vassal_loan_creditor.GetTitledFirstName] üzerinde güçlü bir koz elde edecek."

 agot_banking.0503.e:0 "Benden bir kuruş göremezsin!"

 agot_banking.0503.e_tt:0 "Ödemeyi reddediyorsun. Bu, krediyi geçersiz kılar, ancak karşılığında [vassal_loan_creditor.GetTitledFirstName] ana unvanın üzerinde bir iddia elde edecek."

 agot_banking.0504.t:0 "Sevgili vassalım,"

 agot_banking.0504.repay_full_desc:0 "Beş yıl önce bana cömertçe verdiğin krediyi geri ödemenin zamanı nihayet geldi. İhtiyaç anında yardım etme isteğini son derece takdir ediyorum; nezaketin unutulmayacak."

 agot_banking.0504.repay_interest_desc:0 "Bana verdiğin krediyi geri ödemenin zamanı geldi... Ancak şu anda kredinin tamamını ödeyemiyorum, yalnızca son beş yılın faizini ödeyeceğim! Beş yıl daha sonra borçlu olduğumu tamamlayacağıma söz veriyorum. Umarım anlarsın, sadık vassalım."

 agot_banking.0504.first_default_desc:0 "Bana verdiğin krediyi geri ödemenin zamanı gelmiş olsa da... Şu anda herhangi bir ödeme yapamayacağım için üzgünüm. Beş yıl içinde borçlu olduğum şeyi alacağına söz veriyorum! Bu kusurun telafisi olarak sana bir iyilik tanıyacağım; ister vergi indirimi, ister konseyimde bir koltuk olsun."

 agot_banking.0504.second_default_desc:0 "On yıl önce bana sağladığın krediyi ödeyemediğim için derin özürlerimi sunuyorum. Bu süregelen rahatsızlığın telafisi olarak, gücüm dahilindeki her talebi yerine getireceğim. Sadece söyle, olacaktır!"

 agot_banking.0504.refusal_desc:0 "Bana ödünç verdiğin para geri ödenmeyecek. İstikrarı korumak ve toprakların ihtiyaçlarını karşılamak için ihtiyacım olanı almanın, senin efendin olarak benim hakkım olduğuna karar verdim. Bunu ek bir vergi olarak gör. Benden geri ödeme almayacaksın ve ileride tahsilat talep etmeye cesaret etme."

 agot_banking.0504.a:0 "Seninle iş yapmak bir zevkti."

 agot_banking.0504.b:0 "Eh, hiç yoktan iyidir herhalde."

 agot_banking.0504.c:0 "Bir dahaki sefere para görmem daha iyi olur."

 agot_banking.0504.d:0 "Anlaştığımız şey bu değildi!"

 agot_banking.0504.e:0 "Borç başka yollarla ödenecek. Hükmetmeye layık değilsin."

 repay_vassal_loan_decision:0 "Vassal Kredisini Geri Öde"

 repay_vassal_loan_decision_desc:0 "Bir vassaldan beş yıllık bir sözleşmeyle borç para aldın. Kredinin vadesi dolmadan önce tamamını geri ödeyebilirsin."

 repay_vassal_loan_decision_tooltip:0 "Kredinin tamamını ve işleyen faizi ödeyeceksin."

 repay_vassal_loan_decision_tooltip_confirm_text_desc:0 "Dert edecek bir şey daha az."

 repay_vassal_loan_decision_effect:0 "Mevcut vassal kredini, kredinin vadesi dolmadan önce geri ödeyebilirsin."

