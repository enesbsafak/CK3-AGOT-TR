 agot_banking.0605.t:0 "Dünyanın Bilinen Tüm Bankaları"

 agot_banking.0605.desc:0 "Bunlar, dünyada faaliyet gösteren bankaların direktörleri ve banka değerleridir:"

 agot_banking.0605.a:0 "Teşekkür ederim."

 agot_banking.0211.letter4_failed_desc:0 "Kötü haber: [FinalDefaulter.GetTitledFirstNameNoTooltip], yeni bir geri ödeme planı için önerdiğimiz cömert teklifi açıkça değerlendirmeyi reddetti.\n\nDaha doğrudan bir yol denemek zorunda kalacağız..."

 agot_banking.0212.letter3_success_desc:0 "İşe yaradı!\n[FinalDefaulter.GetTitledFirstNameNoTooltip], cömert teklifimizi kabul etti, ceza ücretini ödedi ve borcunun tamamını 3 yıl içinde geri ödemeyi taahhüt etti."

 agot_banking.0211.f:0 "[FinalDefaulter.GetTitledFirstName]'e bir mektup gönder."

 agot_banking.0211.f_tt:0 "Bu, bankaya @gold_icon! [default_revisor.MakeScope.Var('LetterCost').GetValue] mal olacak. [FinalDefaulter.GetTitledFirstName]'e yeni bir geri ödeme planı sunacağız: Son ödemeyi 3 yıl daha erteleyebiliriz, ancak [FinalDefaulter.GetTitledFirstName] ödenecek faiz tutarının yarısı kadar ek bir ceza ücretini derhal ödemek zorunda."

 agot_banking.1108.t:0 "Cömert Bir Teklif"

 agot_banking.1108.desc:0 "[agot_bank|E]'nden borcumu ödeme konusundaki isteksizliğimden yakınan bir mektup aldım. Her iki tarafın da kabul edebileceği bir çözüm bulmak için banka yeni bir geri ödeme planı öneriyor: Ödenecek faiz tutarının yarısı kadar bir ceza ücretini derhal ödemem gerekecek. Buna karşılık, son ödeme 3 yıl daha ertelenecek."

 agot_banking.1108.a:0 "Bu adil bir teklif."

 agot_banking.1108.a_tt:0 "Kredin devam edecek, geri ödeme üç yıl içinde vadesini dolduracak."

 agot_banking.1108.b:0 "Yapmayacağım!"

 agot_banking.1108.b_tt:0 "Bankanın teklifini reddediyorsun. Bu, daha sert bir tepkiyle sonuçlanabilir..."

 agot_banking.0606.t:0 "Yeni Bir Hissedar"

 agot_banking.0606.desc:0 "Bugün, [ROOT.Char.Custom('agot_bank_name')] [NewShareholder.GetTitledFirstName]'e yeni bir hisse verdi."

 bank_name_default:0 "[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] Bankası"

 bank_name_default_IB:0 "Braavos'un Demir Bank'ı"

 bank_name_default_Rogare:0 "Rogare Bankası"

 bank_name_default_blank:0 ""

 bank_name_fallback:0 "[ROOT.Char.GetCulture.GetNameNoTooltip] Bankası"

