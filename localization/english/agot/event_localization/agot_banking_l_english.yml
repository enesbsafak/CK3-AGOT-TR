 agot_banking.0604.desc:0 "Bunlar, borç tutarına (kredi tutarı artı faiz) göre azalan sırada sıralanan [ROOT.Char.Custom('agot_bank_name')]'nin en büyük borçlularıdır:"

 agot_banking.0604.a:0 "Teşekkür ederim."

