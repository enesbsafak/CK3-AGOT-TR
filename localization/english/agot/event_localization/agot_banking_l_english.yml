 agot_banking.0401.t:0 "Yatırım Fonunu Doldur"

 agot_banking.0401.desc:0 "[agot_bank|E]'nin yatırım fonunu yenileyerek, bu para artık borçlanmak isteyenlere kredi olarak dağıtılamayacak.\n\nKarşılığında, mantıklı yatırımlar yapılırsa fon her yıl kâr sağlayacak. Ancak istikrarsız ve riskli fırsatlara yapılan yatırımlar, fondaki parayı kaybetme riski taşır; bu da yetkin bir [agot_bank_director|E] tarafından iyi yönetilmezse çok daha olasıdır!"

 agot_banking.0401.a:0 "Yatırımı yap."

 agot_banking.0401.a_tt:0 "@gold_icon! 1000, bankanın nakit rezervinden kalıcı olarak yatırım fonuna aktarılacak. @warning_icon! #X Para bir kez fona yatırıldıktan sonra fondan geri çekmek mümkün değildir. #!"

 agot_banking.0401.b:0 "Fikrimi değiştirdim."

 agot_banking.0403.t:0 "Yatırım Fonunun Getirileri"

 agot_banking.0403.positive_desc:0 "Her yıl olduğu gibi, bankanın kâtipleri bana yatırım fonunun performansına dair en son rakamları ulaştırıyor.\n\nBu yıl, yatırılan para bize @gold_icon! [ROOT.Var('ShownInvestProfit').GetValue|0|P] kâr kazandırdı."

 agot_banking.0403.neutral_desc:0 "Her yıl olduğu gibi, bankanın kâtipleri bana yatırım fonunun performansına dair en son rakamları ulaştırıyor.\n\nGörünüşe göre bu yıl kazançlar ve kayıplar birbirini dengelemiş."

 agot_banking.0403.negative_desc:0 "Her yıl olduğu gibi, bankanın kâtipleri bana yatırım fonunun performansına dair en son rakamları ulaştırıyor.\n\nYatırım yaptığımız bazı işletmelerin zor duruma düştüğü, hatta tamamen kapandığı zorlu bir yıl oldu. Fon yalnızca kâr edemedi, hacmi de @gold_icon! [ROOT.Var('ShownInvestProfit').GetValue|0|N] azaldı."

 agot_banking.0403.a:0 "Şimdilik yeterince rakam var."

