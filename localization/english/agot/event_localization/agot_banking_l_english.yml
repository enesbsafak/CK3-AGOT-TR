 agot_banking.0603.desc:0 "Bunlar, hisse sayısına göre azalan sırada sıralanan [ROOT.Char.Custom('agot_bank_name')]'nin güncel hissedarlarıdır:"

 agot_banking.0603.a:0 "Teşekkür ederim."

 show_debtors_decision:0 "Önemli Borçluları Göster"

 show_debtors_decision_desc:0 "[ROOT.Char.Custom('agot_bank_name')]'nin kâtipleri size bankanın en büyük borçlularının bir listesini sunacak."

 show_debtors_decision_tooltip:0 "Bankanın en önemli borçlularının listesi gösterilecek."

 show_debtors_decision_confirm:0 "Bir bakalım"

 show_debtors_decision_effect:0 "Bankanın en önemli borçlularının listesi gösterilecek."

