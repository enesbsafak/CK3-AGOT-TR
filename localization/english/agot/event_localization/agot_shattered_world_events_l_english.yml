l_english:

 agot_shattered_world.1000.t:0 "Yeni Bir Gelecek"

 agot_shattered_world.1000.desc:0 "Tarihin yazılmamış sayfaları beni çağırıyor ve sonunda onları dolduracak imkânlara sahibim. [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]'imi topladım, nüfuzumu genişlettim ve diyarımı tehlikeler ile vaatler arasında yönettim.\n\nArtık her seçimim yeni bir çağı başlatıyor; her zafer, hükümranlığımın hikâyesini yazıyor. Mücadeleyi kucaklamalı ve geleceğimi efsaneye dönüştürmeliyim — ama bunu nasıl yapacağım?"

 agot_shattered_world.1000.a:0 "Yeni bir [Concept('administrative','Özgür Şehir')|E] kuracağım."

 agot_shattered_world.1000.b:0 "Bir [Concept('feudal','Feodal Monarşi')|E] kuracağım."

 agot_shattered_world.1000.c:0 "Büyük bir [pirate_government|E] kuracağım."
