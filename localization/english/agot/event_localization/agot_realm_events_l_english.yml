l_english:

 agot_realm.1001.t:0 "Tarihi Bir Hak"

 agot_realm.1001.desc:0 "[historic_claimant.GetFullName] günün bir sonraki dilekçecisi. "Efendim, [claim_title.GetName] sizde ama [dynasty.GetName] hanedanı onu nesiller boyunca elinde tuttu. Kadim haklara saygı gösterilir ve ben o kadim soyun bir evladı olarak, bu toprakları aileme geri vermenizden büyük minnet duyarım. Karşılığında her zaman sadık bir vasal olacağıma yemin ederim!""

 agot_realm.1001.a:0 "Bu toprakları benim için tutacaksın."

 agot_realm.1001.b:0 "Bugün hiçbir şey alamayacaksın, ama ekmeğimi ve tuzumu paylaşmaya hoş geldin."

 agot_realm.1001.c:0 "Sen kim oluyorsun da talepte bulunuyorsun?! Bu serseriyi zindana atın!"

 agot_realm.1001.d:0 "Bir düşüneyim... reddedildi!"

 agot_realm.0020.t:0 "Memeler"

 agot_realm.0020.desc:0 "Diyarda, [lover.Custom('ComplimentAdjective')] sevgilim [lover.GetName] ile at sürerken kendimizi Nehir Toprakları'nın derinliklerinde buluyoruz. Aşk dolu şakalaşmamız, ufukta beliren iki çimenli tepenin görünmesiyle kesintiye uğruyor ve ikimiz de kıkırdıyoruz. \n\nBu belirli arazi parçası, bir kadın korsesine olan hiç de gizli olmayan benzerliğinden ötürü halk arasında [teats.GetName] olarak bilinir. Yine de başınızı yana eğdiğinizde, size yakından bildiğiniz bir çifti hatırlatıyor.\n\n"My [ROOT.Char.GetLadyLord]," diyor [lover.GetName] [lover.Custom('quirk_pos_adverb')] bir tavırla, sizi hayallerinizden uyandırarak ve gülümseyerek karşılık veriyor. "Aklından bir şey mi geçiyor?" Aklınızda bir fikir belirmeye başlarken gözlerinizi tepelere kaydırmamayı başarıyorsunuz..."

 agot_realm.0020.a:0 "Ey güçlüler, şu memelere bakın ve umutsuzluğa kapılın"

 agot_realm.0020.a.tt:0 "Memeler, [lover.GetFirstNamePossessive] Memeleri olarak yeniden adlandırılacak"

 renamed_teats:0 "[GetGlobalVariable('teats_name').Char.GetFirstNamePossessive] Memeleri"

 agot_realm.0020.b:0 "Benimkiler daha iyi"

 agot_realm.0020.b.tt:0 "Memeler, sizin memelerinize göre yeniden adlandırılacak"

 agot_realm.0020.c:0 "Hiçbir şey, canım."

 agot_realm.0030.t:0 "Taht [ROOT.Char.GetHerHim|U]'i Reddediyor"

 agot_realm.0030.desc:0 "Demir Taht denen o eğri büğrü metal canavarın üzerinde [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]'i yönetiyorum. Keşke lütuf ya da tazminat için mırıldanan bitmek bilmeyen dilekçeci, saray mensubu ve dalkavuk alayını dinlemekten başka yapılacak iş olsa. Bir başkası diz çöküp yağcıca ricasını dillendirirken yumruklarımı sıkıyorum. Kıymetli zamanımın ne büyük bir israfı.\n\nBirdenbire kolumda beyaz bir sıcaklık parlar ve acıyla geri çekilirim. Kan sızınca tuniğimin kolu koyu bir kırmızıya bulanır. Yırtık kumaş parçası, kolumu kestiğim demir dişe hâlâ saplanmış durumda.\n\n"Üstat, üstadı çağırın!" diye seslenir bir ses.\n"[ROOT.Char.GetSheHe|U]'i taht ısırdı!" diye haykırır bir başkası.\n"[ROOT.Char.GetSheHe|U] azarlandı!"\n#EMP "[ROOT.Char.GetFirstNameNoTooltip] gerçek bir [ROOT.Char.GetTitleAsNameNoTooltip|l] değil!"#!"

 agot_realm.0030.a:0 "Bu bir alamet..."

 agot_realm.0030.a.tt:0 "Vasallarınız bunu kötü bir işaret olarak yorumlayacak"

 agot_realm.0031.t:0 "Aile Üyesi İdam Edildi!"

 agot_realm.0031.desc:0 "Trajik bir haber! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))]'im [victim.GetTitledFirstName], [executioner.GetTitledFirstName] tarafından idam edildi!\n\nKâğıttaki sözcüklerin sıradanlığı, yüreğimdeki acıyı gizliyor. Aileme ve onuruma yönelik böyle şiddetli bir saldırı, efendim tarafından yapılmış olsa bile karşılıksız kalamaz. Ne yapmalıyım?"

 agot_realm.0031.a:0 "Bu sahte [executioner.GetTitleAsNameNoTooltip|l] artık hüküm süremeyecek!"

 agot_realm.0031.a.f:0 "Müttefiklerinize yazıyor ve güçlerinizi toplamaya başlıyorsunuz."

 agot_realm.0031.b:0 "[executioner.GetHerHis] hükümdarlığını şu ya da bu şekilde sona erdireceğim..."

 agot_realm.0031.b.f:0 "[executioner.GetTitledFirstNameNoTooltip]'in çöküşü için entrika kurmaya başlıyorsunuz."

 agot_realm.0031.c:0 "Bu affedilmeyecek!"

 agot_realm.0031.c.f:0 "[executioner.GetTitledFirstNamePossessiveNoTooltip] hükümdarlığının size nasıl haksızlık ettiğini hatırlayacaksınız."

 agot_realm.0031.d:0 "Trajik olsun ya da olmasın, bu [executioner.GetHerHis] hakları dahilindeydi."

 agot_realm.0031.d.f:0 "[executioner.GetTitledFirstNamePossessiveNoTooltip] hükümdarlığına karşı çıkmayacak, [victim.GetTitledFirstNamePossessiveNoTooltip] ölümü meselesini kapatacaksınız."

 agot_realm.0040.t:0 "Bir Veraset Meselesi"

 agot_realm.0040.desc:0 "Diyar, gelenek ve güvenle bir arada tutulur. Halklarımızın ortak gelenekleri ve o halkların — ve sadık vasallarımın — bana duyduğu güven. Her geleneğe göre haklı bir vâris olan [new_heir.GetName]'in sevinçli doğumuyla birlikte, diyarın verasetinde bir kavşak noktasına geldim.\n\n[old_heir.GetName] uzun süredir vârisim olarak sırada duruyor ve yargıma duyulan güven, diyarın [old_heir.GetHerHim] ile ilgili çekincelerini yatıştırdı."

 agot_realm.0040.capable:0 "[old_heir.GetFirstNameNoTooltip] uygun bir hükümdardır, bunu bana herhangi bir lord söyleyebilir. [old_heir.GetSheHe|U] kuşkusuz diyarı daha büyük bir refaha götürür."

 agot_realm.0040.friend:0 "Ve [old_heir.GetFirstNameNoTooltip] her zaman bana yakın olmuştur, [old_heir.Custom('GetDaughterSon')]'um olduğu kadar bir gölge gibi. [old_heir.GetHerHis|U] bana olan güveni de aynı derecede önemli!"

 agot_realm.0040.outro:0 "\n\nAma, ortada bu kadar çok şey varken, [new_heir.GetFirstNameNoTooltip] daha iyi bir vâris olur muydu?"

 agot_realm.0040.a:0 "[old_heir.GetNameNoTooltip] vârisim olarak kalacak."

 agot_realm.0040.b:0 "[new_heir.GetNameNoTooltip]'in [new_heir.GetHerHis] doğuştan hakkını yadsıyamam."
