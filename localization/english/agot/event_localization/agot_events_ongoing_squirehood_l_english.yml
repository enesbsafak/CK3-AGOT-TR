l_english:

 agot_squirehood_ongoing.tt.success:0 "Başarılı Talim"

 agot_squirehood_ongoing.tt.failure:0 "Başarısız Talim"

 agot_squirehood_ongoing.desc.success:0 "Yaverlik görevinde başarılı oldun."

 agot_squirehood_ongoing.desc.failure:0 "Yaverlik görevinde başarısız oldun."

 agot_squirehood_ongoing.0001.t:0 "Bir Yaverin Yaşamı ve Görevleri"

 agot_squirehood_ongoing.0001.desc:0 "Ser [my_knight.GetFirstName] beni ahırlara götürüyor, bana bir eyer ve bazı binicilik takımları uzatıyor. [my_knight.GetSheHe|U], beni eyerde rahatlatmak amacıyla kırsalda at sürmeye gideceğimizi duyuruyor; çünkü bir şövalyenin at üstündeki becerisi, diğerleri kadar önemlidir."

 agot_squirehood_ongoing.0001.a:0 "Umarım eğitimim beni yanıltmaz."

 agot_squirehood_ongoing.0002.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0002.desc:0 "Ser [my_knight.GetFirstName], önüme bir takım yedek zırh ve kirli bir bez fırlatıyor. Üzerine o kadar çok çamur, pislik ve kurumuş kan yapışmış ki kendi yansımamı zar zor görebiliyorum.\n\n"Bir şövalye zırhını her zaman temiz tutmalı," diyor [my_knight.GetSheHe], "bu yedek takımı temizlemeyi çalış. Şövalye olduğunda nasıl yapıldığını bilmekten memnun olacaksın.""

 agot_squirehood_ongoing.0002.a:0 "Umarım iyi bir iş çıkarabilirim."

 agot_squirehood_ongoing.0003.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0003.desc:0 "Ser [my_knight.GetFirstName], bana köreltilmiş bir talim kılıcı uzatıyor ve kendininkini kaldırıp [my_knight.GetHerHim]'i silahsızlandırmam için meydan okuyor.\n\nKılıca bakıyorum, ardından onaylarcasına başımı sallayıp kavrayışımı sıkılaştırıyor ve ileri atılıyorum."

 agot_squirehood_ongoing.0003.a:0 "Elimden gelenin en iyisini yapacağım."

 agot_squirehood_ongoing.0004.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0004.desc:0 "[second_squire.GetName] ve ben, ellerimizde köreltilmiş kılıçlarla talim alanında birbirimizin çevresinde dönüyoruz. İkimiz de hızla vurup savuşturuyor, diğerinin savunmasındaki bir boşluğu arıyoruz.\n\nOrtada ölüm olmasa da, Ser [my_knight.GetFirstName], müsabakamızı büyük bir dikkatle izliyor ve galip çıkmak [my_knight.GetHerHim]'i kuşkusuz etkilerdi."

 agot_squirehood_ongoing.0004.a:0 "[second_squire.GetNameNoTooltip]'i geçmeliyim!"

 agot_squirehood_ongoing.0005.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0005.desc:0 "Ser [my_knight.GetFirstName], günün büyük bölümünde beni talim alanında yalnız bıraktı.\n\nYalnızca köreltilmiş bir kılıç ve bir mankenle donanmış olarak kılıç ustalığımı çalışmam emredildi. [my_knight.GetFirstNameNoTooltip], bir savaşçının kusurlarını talim olmadan bulabilmesi gerektiğini iddia ediyor. Bu sözlerin doğruluğunu kanıtlamak için çabalamalıyım."

 agot_squirehood_ongoing.0005.a:0 "Pratik yapan, mükemmelleşir."

 agot_squirehood_ongoing.0006.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0006.desc:0 "Ser [my_knight.GetFirstName], [my_knight.GetHerHis] zırhını önüme bırakıyor; yüzeyi #italic yine#! çamur, gres ve kirle kaplı. [my_knight.GetSheHe|U] bana bir bez atıyor ve iyi bir yaver olup [my_knight.GetHerHis] zırhını cilalamamı söylüyor."

 agot_squirehood_ongoing.0006.a:0 "Leke bırakmadan temizlemeye çalışacağım, ser."

 agot_squirehood_ongoing.0007.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0007.desc:0 "Ser [my_knight.GetFirstName], [my_knight.GetHerHis] masasına çağırıyor; orada bir parşömen parçası ve bir tüy kalemle çalışıyor.\n\n[my_knight.GetSheHe], parşömenin üzerine birkaç hanedanın armasını kaba biçimde çiziyor. [my_knight.GetFirstNameNoTooltip], bir şövalyeyi ya da lordu yalnızca armalarından tanıyamamanın bir saygısızlık işareti olduğunu ve bunu asla göstermemem gerektiğini açıklıyor.\n\n[my_knight.GetSheHe|U], parşömeni bana doğru çevirip her birini gösteriyor; hepsi [my_knight.Custom('AGOTGetKnightRegions')] bölgesinden gelen, armayla adın birleşimini zihnime kazıyor."

 agot_squirehood_ongoing.0007.a:0 "Hepsini ezberlemeye çalışacağım."

 agot_squirehood_ongoing.0008.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0008.desc:0 "Ser [my_knight.GetFirstName], küçük bir tahta sandığın üzerine çıkmamı sağlıyor; etrafımda işleriyle uğraşan bir şövalye, yaver ve çırak kalabalığı toplanmış.\n\n[my_knight.GetSheHe|U] omzuma vuruyor ve toplananlara bir komut vermemi; yüksek ama net olmam gerektiğini söylüyor. Talim alanının gürültüsü arasında [my_knight.GetHerHim]'i zor duyabiliyorum; ama [my_knight.GetSheHe] bana, bir şövalyenin en zorlu ortamlarda bile komut verebilmesi gerektiğini söylüyor; çünkü savaş alanı asla sessiz bir yer değildir."

 agot_squirehood_ongoing.0008.a:0 "Var gücümle deneyeceğim."

 agot_squirehood_ongoing.0009.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0009.desc:0 "Ser [my_knight.GetFirstName], bir kez daha şövalye olmanın ne demek olduğu hakkında bana ders veriyor.\n\nKılıç ustalığını, savaş alanı taktiklerini, hatta at biniciliğini tartışmak yerine [my_knight.GetSheHe], bana şövalyelik ve onur erdemlerini öğretiyor ve geçmişin yiğit şövalyelerinin ve büyük işlerinin hikâyelerini anlatıyor."

 agot_squirehood_ongoing.0009.a:0 "[my_knight.GetSheHe]'in söylediklerini ezberlemeye çalışacağım."

 agot_squirehood_ongoing.0010.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0010.desc:0 "Ser [my_knight.GetFirstName] ve ben, evimizin çevresindeki kırsalda bir köye doğru telaşla at sürüyoruz. Bölgede haydutluk azıtı durumda ve köylüler, sıcak yemek ve bir çuval bozukluk karşılığında köye yardım edip korumak için yakındaki şövalyeleri çağırdı.\n\n"Hizmet şövalyeleri çoğu zaman lordlar ile halkları arasında aracılık etmek zorunda kalır." diye açıklıyor [my_knight.GetFirstNameNoTooltip]. Haydutları durdurup köye yardım ederek Ser [my_knight.GetFirstNameNoTooltip], bana şövalyeliğin bilmediğim bir yüzünü göstermeyi umuyor."

 agot_squirehood_ongoing.0010.a:0 "Kilitlenmiş bir dikkatle dinleyeceğim."

 agot_squirehood_ongoing.0011.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0011.desc:0 "Bir yaverin yaşamı her zaman göz kamaştırıcı değildir.\n\nBugün şövalyem Ser [my_knight.GetFirstName]'in hayvanlarıyla ilgilenmem emredildi. Bunu korkuyla beklesem de, yine de görevime koyulmalı ve bu canlıları hızla temizlemeye ve beslemeye çalışmalıyım."

 agot_squirehood_ongoing.0011.a:0 "Onları usulünce temizlemeliyim."

 agot_squirehood_ongoing.0012.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0012.desc:0 "Kılıçların şangırtısı ve ateşli bağırışlar çevremi sarıyor. Talim kılıcımı kaldırıp talim ortağıma çılgınca savuruyorum; ardından dönüp #italic diğer#! talim ortağımla yüzleşmek için hızla bir savuşturmayla havaya bir hamle gönderiyorum.\n\nŞövalyem Ser [my_knight.GetFirstName], bugün birden fazla ortağa karşı çalışmamı emretti. Tek bir rakiple yüzleşme konusunda epey deneyimim olsa da, birden çok kişiyle idman yapmak hâlâ alışmaya çalıştığım bir deneyim. Yine de [my_knight.GetFirstNameNoTooltip], bu tür senaryoların savaş alanına daha yakın olduğunu hatırlatıyor."

 agot_squirehood_ongoing.0012.a:0 "Kendimi öne çıkarmaya çalışacağım."

 agot_squirehood_ongoing.0013.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0013.desc:0 "Ser [my_knight.GetFirstName], beni silahhanede yalnızca bir bez parçasıyla bıraktı.\n\nGün batımından önce buradaki her silahı temizlemeyi çalışmam emredildi."

 agot_squirehood_ongoing.0013.a:0 "Bu silahlar parlamalı."

 agot_squirehood_ongoing.0014.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0014.desc:0 "Bugün Ser [my_knight.GetFirstName]'e bir iş için eşlik etmem emredildi.\n\nYeterince atımız olmasına rağmen, şövalyemin tüm zırhını ve silahlarını kendi üzerimde taşımak zorunda bırakıldım. [my_knight.GetSheHe|U] bana, atların zaten yorgun olduğunu ve bir yaverin efendisinin donanımını taşımasının güç ve karakter geliştirdiğini söylüyor."

 agot_squirehood_ongoing.0014.a:0 "[my_knight.GetHerHim]'i hayal kırıklığına uğratamam."

 agot_squirehood_ongoing.0015.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0015.desc:0 "Ser [my_knight.GetFirstName], birkaç küçük çırağı benim sorumluluğuma bıraktı. Huysuz ve disiplinsiz olsalar da, onlara kılıç oyununun temellerini öğretmem, onları gruplara ayırıp öğrendiklerimin olabildiğince çoğunu aktarmam emredildi. Öğrenmek zaten yeterince zorluktu; şimdi kendimden bir öğretmen çıkarmalıyım.\n\nYine de belki bu iyidir; bir şövalyenin yaverlerine öğretmesi gerekir."

 agot_squirehood_ongoing.0015.a:0 "İyi bir öğretmen olmaya çalışacağım."

 agot_squirehood_ongoing.0016.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0016.desc:0 "Ser [my_knight.GetFirstName] ve ben yolculuk ederken, [my_knight.GetSheHe], [my_knight.Custom('AGOTGetKnightRegions')] bölgesindeki şövalyelerin adlarını saymaya başlıyor. Adı geçen her şövalye için, o kişinin kişisel alametini ya da hanedan armasını betimleyen bir cevap vermem gerekiyor. Zihnim, cevaplar için diyarı bezeyen nice aslan, kuş, ayı ve kurdun arasında hızla koşturuyor."

 agot_squirehood_ongoing.0016.a:0 "Bilgimi sergilemeliyim."

 agot_squirehood_ongoing.0017.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0017.desc:0 "Ser [my_knight.GetFirstName], [second_squire.GetName] ile beni birbirimizden birkaç metre uzağa yerleştirdi.\n\nBirbirimize komut cümleleri bağırmamız emredildi; her seferinde aramızda dönüşümlü olarak. Ser [my_knight.GetFirstNameNoTooltip], bunun bizi daha iyi liderler yapacağını düşünüyor; savaş alanında akranlarımıza bile kendimizi duyurup anlatmaya hazır olmalıyız."

 agot_squirehood_ongoing.0017.a:0 "[second_squire.GetNameNoTooltip], beni duyabiliyor musun?"

 agot_squirehood_ongoing.0018.t:0 "$agot_squirehood_ongoing.0001.t$"

 agot_squirehood_ongoing.0018.desc:0 "Bir yaverin yaşamı çoğu zaman yoğun olsa da, bugün biraz boş vaktim olan ender bir an. Buna rağmen şövalyem, yine de [my_knight.GetHerHis] öğretilerinden bazılarını tazelemem gerektiğini öne sürdü..."

 agot_squirehood_ongoing.0018.a:0 "Komut sesimi çalışacağım."

 agot_squirehood_ongoing.0018.b:0 "Askeri taktiklerim bilenmelidir."

 agot_squirehood_ongoing.0400.t:0 "Yaver Eğitimi"

 agot_squirehood_ongoing.0400.desc:0 "Yaverim [my_squire.GetFirstName]'in akıl hocası olarak, [my_squire.GetHerHim]'i şövalyeliğin yollarında eğitmek benim sorumluluğum.\n\nBugün [my_squire.GetHerHim] ile şövalyeliğin temel işlevlerinden birini çalışmaya karar verdim bile; ama şimdi hangisini çalışacağıma karar vermem gerekiyor..."

 agot_squirehood_ongoing.0400.a:0 "Strateji Çalıştır."

 agot_squirehood_ongoing.0400.b:0 "Şövalyelik Kuralları Çalıştır."

 agot_squirehood_ongoing.0400.c:0 "Kılıç Ustalığı Çalıştır."

 agot_squirehood_ongoing.0400.d:0 "At Biniciliği Çalıştır."

 agot_squirehood_ongoing.0400.good_training.tt:0 "Yaverin #P iyi bir talim geçirecek#!"

 agot_squirehood_ongoing.0400.bad_training.tt:0 "Yaverin #N kötü bir talim geçirecek#!"

 agot_squirehood_ongoing.0400.had_a_training_session.t:0 "Şövalyen sana eğitim verdi!"

 agot_squirehood_ongoing.0400.had_a_training_session.desc.strat.good:0 "Şövalyen sana stratejiyi öğretti. İyi bir talimdi!"

 agot_squirehood_ongoing.0400.had_a_training_session.desc.strat.bad:0 "Şövalyen sana stratejiyi öğretti. Kötü bir talimdi."

 agot_squirehood_ongoing.0400.had_a_training_session.desc.chiv.good:0 "Şövalyen sana şövalyelik kurallarını öğretti. İyi bir talimdi!"

 agot_squirehood_ongoing.0400.had_a_training_session.desc.chiv.bad:0 "Şövalyen sana şövalyelik kurallarını öğretti. Kötü bir talimdi."

 agot_squirehood_ongoing.0400.had_a_training_session.desc.arms.good:0 "Şövalyen sana kılıç ustalığını öğretti. İyi bir talimdi!"

 agot_squirehood_ongoing.0400.had_a_training_session.desc.arms.bad:0 "Şövalyen sana kılıç ustalığını öğretti. Kötü bir talimdi."

 agot_squirehood_ongoing.0400.had_a_training_session.desc.horse.good:0 "Şövalyen sana at biniciliğini öğretti. İyi bir talimdi!"

 agot_squirehood_ongoing.0400.had_a_training_session.desc.horse.bad:0 "Şövalyen sana at biniciliğini öğretti. Kötü bir talimdi."

 agot_squirehood_ongoing.0401.t:0 "Yaver Eğitimi"

 agot_squirehood_ongoing.0401_good_strategy_training.desc:0 "[my_squire.GetName] ve ben bugün strateji çalıştık. Bir şövalyenin, bir kumandanın planında üzerine düşeni oynayabilmesi için önce onu anlamayı öğrenmesi gerekir. Daha geniş resmi ve içindeki yerinin değerini görmek.\n\nTalim sırasında [my_squire.GetNameNoTooltip], bir savaş için uygun arazi seçiminde ve bir plan çökerse diye güçlü yedek planlar oluşturmada yetenek gösterdi.\n\n[my_squire.GetSheHe|U]'in içinde bir kumandan zihni olabilir!"

 agot_squirehood_ongoing.0401_bad_strategy_training.desc:0 "[my_squire.GetName] ve ben bugün strateji çalıştık. Bir şövalyenin, bir kumandanın planında üzerine düşeni oynayabilmesi için önce onu anlamayı öğrenmesi gerekir. Daha geniş resmi ve içindeki yerinin değerini görmek.\n\nTalim sırasında [my_squire.GetNameNoTooltip], arazinin kullanımını ve birlikleriniz için manevra planlamayı anlamakta zorluk gösterdi.\n\n[my_squire.GetSheHe|U]'de kumandan zihni olmayabilir."

 agot_squirehood_ongoing.0401_good_chivalry_training.desc:0 "[my_squire.GetName] ve ben bugün şövalyelik kurallarını çalıştık. Bir şövalyeyi paralı askerden ayıran nedir? Şövalyeliğin yeminlerinin ta kendisi.\n\nTalim sırasında [my_squire.GetNameNoTooltip], şövalye ruhlu, iyi ve onurlu bir yaver olduğunu kanıtladı. [my_squire.GetSheHe]'in şövalyeliğin daha soyut fikirlerini ve bir onur yasasını ne kadar benimsediğini görmek beni çok memnun etti."

 agot_squirehood_ongoing.0401_bad_chivalry_training.desc:0 "[my_squire.GetName] ve ben bugün şövalyelik kurallarını çalıştık. Bir şövalyeyi paralı askerden ayıran nedir? Şövalyeliğin yeminlerinin ta kendisi.\n\nTalim sırasında [my_squire.GetNameNoTooltip], varsayımsal durumlarımızda pek az onur ve sadakatle hareket ederek şövalyeliğin temellerini bile anlayamadı. [my_squire.GetSheHe]'in şövalyelik ve onur konusunda hâlâ zorlanmasını görmek beni çok hayal kırıklığına uğrattı."

 agot_squirehood_ongoing.0401_good_arms_training.desc:0 "[my_squire.GetName] ve ben bugün talim kılıçlarıyla idman yaptık; çünkü kılıç, hizmetine değer her şövalyenin uzvunun bir uzantısı olmalıdır.\n\nTalim sırasında [my_squire.GetNameNoTooltip], [my_squire.GetHerHis] talim kılıcıyla hızlı düşünme ve savaşçılık becerisi sergiledi; çevik ayak hareketleri ve istisnai içgüdüler gösterdi. [my_squire.GetSheHe]'in bugün daha zorlu tatbikatlarda ustalaşmaya ne kadar kararlı olduğunu görmek etkileyiciydi."

 agot_squirehood_ongoing.0401_bad_arms_training.desc:0 "[my_squire.GetName] ve ben bugün talim kılıçlarıyla idman yaptık; çünkü kılıç, hizmetine değer her şövalyenin uzvunun bir uzantısı olmalıdır.\n\nTalim sırasında [my_squire.GetNameNoTooltip], gösterdiğim teknikleri kavrayamadı; ayak hareketleriyle boğuştu ve çok uzun süre savunmada kaldı. [my_squire.GetSheHe|U], daha basit tatbikatlarda bile zorlanıyor gibiydi."

 agot_squirehood_ongoing.0401_good_horse_training.desc:0 "[my_squire.GetName] ve ben bugün at sürdük. Atlıyken savaşamayan şövalye nedir ki.\n\nAt sürerken, [my_squire.GetNameNoTooltip], [my_squire.GetHerHis] atıyla güçlü bir bağ kurduğunu gösterdi; binek ile binici arasında, mızrak dövüşünde ya da savaş alanında ihtiyaç duyacakları çevik hareketler ve güven sergiledi."

 agot_squirehood_ongoing.0401_bad_horse_training.desc:0 "[my_squire.GetName] ve ben bugün at sürdük. Atlıyken savaşamayan şövalye nedir ki.\n\nTalim sırasında [my_squire.GetNameNoTooltip], [my_squire.GetHerHis] atıyla bağ kurmakta zorlandı; kontrolü kaybetti ve çok az güven sağlayabildi. Birlikte mızrak dövüşüne çıksalardı birbirleri için risk oluştururlardı; engellere çarpar ve savaş alanı için fazla yavaş hareket ederlerdi."

 agot_squirehood_401_good_strategy_training:0 "strateji. Verimli bir talimdi."

 agot_squirehood_401_good_chivalry_training:0 "şövalyelik kuralları. Verimli bir talimdi."

 agot_squirehood_401_good_arms_training:0 "silah ustalığı. Verimli bir talimdi."

 agot_squirehood_401_good_horse_training:0 "at biniciliği. Verimli bir talimdi."

 agot_squirehood_401_bad_strategy_training:0 "strateji. Zayıf bir talimdi."

 agot_squirehood_401_bad_chivalry_training:0 "şövalyelik kuralları. Zayıf bir talimdi."

 agot_squirehood_401_bad_arms_training:0 "silah ustalığı. Zayıf bir talimdi."

 agot_squirehood_401_bad_horse_training:0 "at biniciliği. Zayıf bir talimdi."

 agot_squirehood_ongoing.0401.desc_fallback:0 "[my_squire.MakeScope.Var('agot_squire_training').GetFlagName] konusunda eğitildin"

 agot_squirehood_ongoing.0401.a:0 "Mükemmel bir talim!"

 agot_squirehood_ongoing.0401.b:0 "Hayal kırıklığı..."
