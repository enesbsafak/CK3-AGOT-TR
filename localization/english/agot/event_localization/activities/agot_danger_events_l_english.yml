l_english:

 agot_danger.0001.title:0 "$travel_danger_prefix$ Bir Yabanıl Akıncı Birliği!"

 agot_danger.0001.desc:0 "Kafilemiz [location.GetName]'den geçerken, savaş çığlığı havayı yararak bizi korkunun tam kalbinden bıçaklıyor. En cesur gezginler arasında bile bu ses, yürekli adamları annelerinin eteklerine koştururdu.\n\n"Yabanıllar, [ROOT.Char.GetLadyLord]'im!" Bir muhafızın sesi gerginliği delip geçiyor; kılıcını çekip ileri doğrulturken dikkatimi çekiyor. Aramızda panik yabanalevi gibi yayılıyor; korku korosuna bir ses daha katılıyor. "Ne kadar #bold çoklar#!!"\n\nSayıları azımsanacak gibi olmasa da düşmanlar kocaman, korkusuz ve mallarımız için canlarını vermeye hazır görünüyorlar. Aralarında bir figür öne çıkıyor: görünüşe göre bir lider olan [btw_raider.GetFirstNameNicknamed]. [btw_raider.GetHerHis] zalimliği, bunun gibi cüretkâr akınları ve ateşli öfkesiyle tanınan bir Yabanıl.\n\nAkıncılar yaklaşırken atım şahlanıp kişniyor, beni düşürmekle tehdit ediyor; ama ben dizginleri sıkıca tutup dik oturuyorum. [ROOT.Char.Custom('signature_weapon')] silahımı havaya kaldırıp haykırıyorum..."

 agot_danger.0001.a:0 "Geri dönün! Derhal geri dönün!"

 agot_danger.0001.a.tt:0 "Sen ve maiyetin Yabanıl akıncılardan kaçmayı deniyorsunuz."

 agot_danger.0001.a.toast:0 "Kaç!"

 agot_danger.0001.a.fleeing:0 "Hiç zorlanmadan kaçtın. Al bakalım, [btw_raider.GetFirstName]!"

 agot_danger.0001.a.minordelay:0 "Kaçtın ama bu yolculuğunda küçük bir gecikmeye neden oldu."

 agot_danger.0001.a.majordelay:0 "Kaçtın ama bu yolculuğunda büyük bir gecikmeye neden oldu."

 agot_danger.0001.a.minortheft:0 "Canınızı kurtardınız ama eşyalarınızın hepsini değil."

 agot_danger.0001.a.majortheft:0 "Canlarınızı kurtardınız ama kaçarken para kesen eyerinden düştü."

 agot_danger.0001.a.minorcombo:0 "Manevraya rağmen [btw_raider.GetFirstNameNoTooltip] eşyalarından bir kısmını çalmayı başardı."

 agot_danger.0001.a.majorcombo:0 "Karmaşık manevraya rağmen [btw_raider.GetFirstNameNoTooltip] eşyalarının çoğunu çalmayı başardı."

 agot_danger.0001.a.scattered:0 "Maiyetin darmadağın oldu - herkes kendi başına!"

 agot_danger.0001.b:0 "Kendinize gelin beyler ve arkamdan gelin! Hücum!"

