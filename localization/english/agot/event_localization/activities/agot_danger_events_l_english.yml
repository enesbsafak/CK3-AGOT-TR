 agot_danger.0002.title:0 "$travel_danger_prefix$ Dağlarda Çatışma!"

 agot_danger.0002.desc:0 "Kafilemiz [location.GetName]'den geçerken, savaş çığlığı ince sabah havasını yararak omurgamızdan aşağı ürpertiler gönderiyor. En cesur gezginler arasında bile bu ses, yürekli adamları annelerinin eteklerine koştururdu.\n\n"Süvariler, [ROOT.Char.GetLadyLord]'im!" Bir gözcünün sesi gerginliğin içinde çınlıyor; kılıcını çekip ileri doğrultarken dikkatimi çekiyor. Henüz görülecek bir şey yok; ama bir düzine ya da daha fazla atın nal sesleri gittikçe yükselerek yaklaşıyor. Onları görünce aramızda panik yabanalevi gibi yayılıyor; korku korosuna bir ses daha katılıyor. "Ne kadar #bold çoklar#!!"\n\nSayıları azımsanacak gibi olmasa da düşmanlar kocaman, korkusuz ve mallarımız için canlarını vermeye hazır görünüyorlar. Başlarında, çizgili gölgederi pelerinli, iki elle kullanılan büyük bir kılıçla kuşanmış dev gibi bir [moon_raider.GetWomanMan] sürüyor. Maiyetimden biri [moon_raider.GetHerHis] adını haykırıyor; görünüşe göre bu akıncı birliğinin lideri olan [moon_raider.GetFirstNameNicknamed]'miş. [moon_raider.GetHerHis] zalimliği, bunun gibi cüretkâr akınları ve ateşli öfkesiyle tanınan bir Dağlı.\n\nAkıncılar yaklaşırken atım şahlanıp kişniyor, beni düşürmekle tehdit ediyor; ama ben dizginleri sıkıca tutup dik oturuyorum. [ROOT.Char.Custom('signature_weapon')] silahımı havaya kaldırıp haykırıyorum..."

