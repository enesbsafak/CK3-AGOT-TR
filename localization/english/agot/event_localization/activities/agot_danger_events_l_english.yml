 agot_danger.0003.title:0 "$travel_danger_prefix$ Buzlu Yarık"

 agot_danger.0003.desc:0 "Buz tabakasında ilerlerken, yüzeyini çizen yarıklar ve oluklar arasında ve çevresinde dikkatle yol alırken arkamdan hafif bir çığlık duyuyorum. Sesi takip etmek için döndüğümde, maiyetimin en gerisinde kalan ağır davranan [crevasse_fallerinto.GetName]'i bir yarığın kenarına tutunmuş halde görüyorum. [crevasse_fallerinto.GetHerHis|U] kızağı [crevasse_fallerinto.GetHerHim]'in altında sarkıyor. Kızağın ağırlığı [crevasse_fallerinto.GetHerHim]'i [crevasse_fallerinto.GetHerHis] sonuna doğru çekerken [crevasse_fallerinto.GetSheHe] çaresizce savaşarak bana haykırdıkça [crevasse_fallerinto.GetHerHis|U] yüzü dehşetle buruşuyor."

 agot_danger.0003.a:0 "Elimde ip bulundurmamın nedeni bu."

 agot_danger.0003.a.tt:0 "[crevasse_fallerinto.GetFirstNameNoTooltip]'i ustalıkla kementliyorsun, ipi kendine doluyorsun ve yardım gelene dek topuklarını yere geçiriyorsun."

 agot_danger.0003.b:0 "Sıkı tutun, seni yukarı çekiyorum!"

 agot_danger.0003.b.toast.success.t:0 "[crevasse_fallerinto.GetName]'i [crevasse_fallerinto.GetHerHis] kızağıyla birlikte yukarı çekmeyi başardın."

 agot_danger.0003.b.toast.failure.t:0 "Kavrayışın kaydı ve [crevasse_fallerinto.GetName] [crevasse_fallerinto.GetHerHis] ölümüne düştü"

 agot_danger.0003.c:0 "Birleşik ağırlık fazla fazla; [crevasse_fallerinto.GetTitledFirstNamePossessiveNoTooltip] kızak koşumunu kesmek zorundayım."

 agot_danger.0003.c.tt:0 "Erzak kaybı, kısıtlı paylaşman gerektiği anlamına geliyor."

 agot_danger.0003.d:0 "Pekâlâ, [crevasse_fallerinto.GetFirstNameNoTooltip], artık kendi payına düşeni yapma zamanı."

 agot_danger.0003.d.tt:0 "[crevasse_fallerinto.GetName]'i kızağın soğuk uçuruma sürükleyişini kayıtsızca izliyorsun."

 agot_danger.0004.title:0 "$travel_danger_prefix$ Eti Sıyıran Rüzgâr"

 agot_danger.0004.desc:0 "Sur'un ötesine uzanan acımasız vahşi doğada yolculuk, iyi bir günde bile yeterince zordur. Görünüşe göre bugün o günlerden biri olmayacak. Hava, kürklerimin ve pelerinimin her aralığına bıçak gibi saplanıyor; uğuldayan kasırgalar duyularımı dövüyor. Üstümdeki bulutların, beni kör edecek karları da beraberinde getireceğini biliyorum. Karlarla birlikte ıslaklık da gelecek; ıslaklıkla birlikte donma da. Bir barınak artık hayat kurtarabilir."

 agot_danger.0004.a:0 "Yakınlarda bir mağara olduğunu kesin biliyorum!"

 agot_danger.0004.a.tt:0 "Kasırga yatışana dek bir mağarada barınacaksın."

 agot_danger.0004.b:0 "Bir barınak bulmalıyız, çabuk!"

 agot_danger.0004.b.tt:0 "Sığınabileceğin bir yer arayacaksın. Ekibin bir kısmı soğuktan zarar görebilir."

 agot_danger.0004.b.toast.lostlimb.t:0 "[frostbite_victim.GetName], [frostbite_victim.GetHerHis] etiyle Soğuk Tanrılar'ı besledi."

 agot_danger.0004.c:0 "Hiçbir havayı umursamıyorum. Yürü ya da öl."

 agot_danger.0004.c.tt:0 "Buzlu rüzgârların arasında yola devam edeceksin; maiyetinin pek çok üyesi donma yarası alacak ya da can verecek."

 agot_danger.0004.c.toast.death.t:0 "[frostbite_victim.GetName], dondurucu rüzgâra yenik düştü."

 agot_danger.0005.title:0 "$travel_danger_prefix$ Eti Sıyıran Rüzgâr"

 agot_danger.0005.desc:0 "Yukarıdaki bulutlardan ilk kar taneleri dökülmeye başlar başlamaz mağaranın karanlık sığınağına atlıyorum. Rüzgârın uğultusu içeride bile peşimizi bırakmıyor; ama mağaranın duvarları kalın ve bizi soğuğun en kötüsünden koruyacak.\n\nMağaranın derinliklerine adım attığımda, dağıtacak meşalem olmayan karanlığa gözlerim alışırken, beni mağaranın daha derinlerinde resimlerin beklediğini görünce şaşırıyorum. Bizden önce burayı sığınak olarak kullanan bazı insanların figürleri."

 agot_danger.0005.a:0 "Şu duvar resimlerine bak, kadim olmalılar!"

 agot_danger.0005.a.tt:0 "Mağara resimlerini yakından inceleyecek ve onlardan bir şeyler çıkarmayı deneyeceksin."

 agot_danger.0005.a.success:0 "Resimlerde bir şey tanımayı başarıyorsun."

 agot_danger.0005.a.failure:0 "Bunlar sadece insan, hayvan ve nesne figürleri. Hoş ama sana hiçbir şey anlatmıyorlar."

 agot_danger.0005.a.toast.failure.t:0 "Mağara resimleri hiçbir sır ifşa etmiyor."

 agot_danger.0005.b:0 "Ateş sıcak; ama [cave_companion.GetFirstNameNoTooltip] daha sıcak."

 agot_danger.0005.c:0 "Madem burada mahsur kaldık, etrafı aramak zarar vermez."

 agot_danger.0005.c.tt:0 "Mağarayı değerli eşyalar için arayacaksın."

 agot_danger.0005.c.mushrooms:0 "Leziz mantarlar buluyorsun"

 agot_danger.0005.c.mushrooms.toast:0 "Leziz mantarlar buldun."

 agot_danger.0005.c.tiny_gold:0 "Değerli bir süs eşyası buluyorsun"

 agot_danger.0005.c.tiny_gold.toast:0 "Değerli bir süs eşyası buldun."

 agot_danger.0005.c.minor_gold:0 "Bir kürk deposu buluyorsun"

 agot_danger.0005.c.minor_gold.toast:0 "Bir kürk deposu buldun"

 agot_danger.0005.c.bear.tt:0 "Mağaranın sahibini buluyorsun"

 agot_danger.0005.d:0 "Yerleşelim. Bir ateş yakıp hikâyeler anlatalım."

 agot_danger.0005.d.tt:0 "Ateşin başında hikâyeler paylaşarak kar fırtınasını atlatacaksın."

 agot_danger.0006.title:0 "$travel_danger_prefix$ Eti Sıyıran Rüzgâr"

 agot_danger.0006.desc:0 "Mağara resimlerine yakından baktığımda, hepsinin tek bir halka ait olmadığını görüyorum. Duvarları, düzinelerce klanın ve kabilenin tarihleri süslüyor; mücadelelerini ve zaferlerini anlatıyor. Burası, şimdi bizi koruduğu gibi hepsini de barındırmış. Bu duvarlar hikâyelerini anlatıyor; sanki uzaktaki rüzgâr seslerinin arasından hayaletlerinin bana fısıldadığını duyabiliyorum. Resimleri daha ayrıntılı inceledikçe birkaçı bana seslenmeye başlıyor.\n\nHangisine odaklanmalıyım?"

 agot_danger.0006.a:0 "Bu küçük resim sıraları... aralarında bir düzen var. Bu şiir mi?"

 agot_danger.0006.a.tt:0 "Şiiri çözmeye çalışırken, farkında olmadan kendi parçalarından birkaçını bestelersin."

 agot_danger.0006.b:0 "O sahneyi tanıyorum; klanımızın kurucusu, tek dişli beyaz mamutu öldürüyor!"

 agot_danger.0006.b.tt:0 "Atanın başarılarının çağdaş bir kaydına sahip olmak, klanının efsanesine yardımcı olacak."

 agot_danger.0006.c:0 "Burada resmedilen balıkçılık tekniğini hiç duymamıştım; çok zekice."

 agot_danger.0006.c.tt:0 "Sahnelerin bazıları, görevlerini ilham verici bir ustalıkla yürüten figürler gösteriyor."

 agot_danger.0007.title:0 "$travel_danger_prefix$ Eti Sıyıran Rüzgâr"

 agot_danger.0007.desc:0 "Mağaranın derinliklerine inmeye başladığımda, zemini kaplayan hem canavar hem insan kemikleri buluyorum. Bazı kemiklerde hâlâ et olduğunu ve kısıtlı ışığımızda kızıl kanla parladığını fark edince duraklıyorum. Kalın kaslı, iri yarı bir ayının görüş alanına girmesiyle içgüdüsel olarak silahıma uzanmaya başlıyorum. Geriye doğru yaslanıp meydan okurcasına kükrerken ağzından düzenli damlalar halinde kan sızıyor."

 agot_danger.0007.a:0 "Bu mağara ikimize yetecek kadar büyük değil."

 agot_danger.0007.b:0 "Herkes, mızraklarını hazırlasın!"

 agot_danger.0007.b.cleankill.tt:0 "Ekibin ayıyı olaysız bir biçimde öldürüyor."

 agot_danger.0007.b.bearwound.tt:0 "Birisi yaralanacak."

 agot_danger.0007.b.toast.bearwound.t:0 "[injury_target.GetName] bir ayı tarafından parçalandı"

 agot_danger.0007.b.toast.bearkill.t:0 "[injury_target.GetName], bir ayının ininde [injury_target.GetHerHis] sonunu buldu"

 agot_danger.0007.b.toast.cleankill.t:0 "Kimse ayı tarafından yaralanmadı."

 agot_danger.0008.title:0 "$travel_danger_prefix$ Eti Sıyıran Rüzgâr"

 agot_danger.0008.desc:0 "Ölmekte olan ayının başında duruyorum; yaratık son hırıltılı nefesini alırken kanı silahımı kaplıyor. Bedeni, eski ininin zemininde gevşiyor ve rahat bir nefes alıyorum. Kalan ekibime sırıtarak bakıyorum; bu ayı epey bir hikâye olacak. Öldürdüğümüz yaratıktan ganimeti ilk seçme hakkının bende olduğunu bilerek hepsi şimdi beni bekliyor."

 agot_danger.0008.a:0 "Yaşadıklarımızı düşünürsek, o gür kürke hayır diyemem."

 agot_danger.0008.a.tt:0 "Bir Ayı Postu saray eseri elde ediyorsun."

 agot_danger.0008.b:0 "Canavarın başını al ve benim için kafatasını temizle."

 agot_danger.0008.b.tt:0 "Bir Ayı Kafatası saray eseri elde ediyorsun."

 agot_danger.0008.c:0 "O kudretli pençeleri alacağım; yoksa boyutlarına kimse inanmaz."

 agot_danger.0008.c.tt:0 "Bir Ayı Pençeleri envanter eseri elde ediyorsun."

 agot_danger.0009.title:0 "$travel_danger_prefix$ İnce Buzda"

 agot_danger.0009.desc:0 "Uzak kuzeyde, söz edilecek yollar neredeyse yoktur; sıkı kullanılan patikalar bile azdır ve birbirinden çok uzaktır. Dondurucu boşluklar buzlu dağlar ve yarıklarla bezenmiştir; çoğu kez açık ve düz arazinin tek bölümü donmuş bir nehirdir. Kafilemiz böyle bir yere rastladı; yolculuğumuzun sonraki bölümü için onu yol olarak kullanma fırsatı sunuyor. Ne var ki yılın bu zamanında buzun kalınlığı şüphelidir; hain arazide güvenli bir geçiş belirsizdir."

 agot_danger.0009.a:0 "Buzu denemek için önce ben yürüyeceğim."

 agot_danger.0009.a.tt:0 "Buzun ağırlığın altında çatlayıp çatlamayacağını deneyeceksin"

 agot_danger.0009.a.icegood.tt:0 "Buz yeterince kalın"

 agot_danger.0009.a.icegood.toast:0 "Buz yeterince kalındı"

 agot_danger.0009.a.icebadnope.tt:0 "Buzun çatladığını zamanında fark ediyorsun"

 agot_danger.0009.a.icebadnope.toast:0 "Buzun kırılmasından kurtuldun"

 agot_danger.0009.a.icebadfall.tt:0 "Buzun içinden düşüyorsun"

 agot_danger.0009.b:0 "[travel_leader.GetFirstNameNoTooltip], git ve bu buzun bizi taşıyıp taşımayacağına bak."

 agot_danger.0009.b.tt:0 "[travel_leader.GetName] buzun kalınlığını deneyecek"

 agot_danger.0009.b.icebadnope.tt:0 "[travel_leader.GetFirstNameNoTooltip] buzun çatladığını zamanında fark ediyor"

 agot_danger.0009.b.icebadnope.toast:0 "[travel_leader.GetFirstNameNoTooltip] buzun kırılmasından kurtuldu"

 agot_danger.0009.b.icebadfall.tt:0 "[travel_leader.GetFirstNameNoTooltip] buzun içinden düşüyor"

 agot_danger.0009.c:0 "Bu çok riskli; sağlam karada ilerlemeye devam ediyoruz."

 agot_danger.0009.c.tt:0 "Dondurucu nehir kıyısının zorlu arazisinde yoluna devam ediyorsun"

 agot_danger.0010.title:0 "$travel_danger_prefix$ İnce Buzda"

 agot_danger.0010.desc:0 "Buzlu nehrin düz yüzeyine doğru ilerliyorum; ağırlığımı arka ayağımda tutmaya çalışarak dikkatle yürüyorum; ama hain buz arkamda kırılıyor. Dondurucu su beni yutmadan hemen önceki o kısacık anda, şunları başarıyorum..."

 agot_danger.0010.a:0 "... dalış için kendimi hazırlıyorum."

 agot_danger.0010.a.tt:0 "Kendi başına yeniden yüzeye çıkmayı deneyeceksin"

 agot_danger.0010.a.swim.tt:0 "Dondurucu sudan yeniden çıkıyorsun"

 agot_danger.0010.a.toast:0 "Buzun altından yeniden yüzeye çıktın"

 agot_danger.0010.a.sink.tt:0 "Buzlu nehir canını alıyor"

 agot_danger.0010.b:0 "... [travel_leader.GetFirstNameNoTooltip]'e yardım için haykırıyorum."

 agot_danger.0010.b.tt:0 "[travel_leader.GetName] seni kurtarmayı deneyecek"

 agot_danger.0010.b.swim.tt:0 "[travel_leader.GetName] seni sudan çıkarmayı başarıyor"

 agot_danger.0010.b.toast:0 "[travel_leader.GetFirstNameNoTooltip] seni dondurucu sudan çıkardı"

