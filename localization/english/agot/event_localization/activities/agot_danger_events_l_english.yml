 agot_danger.0001.b.robbed:0 "Yenildin, toplandın ve soyuldun; neyin varsa aldılar."

 agot_danger.0001.b.kidnapping:0 "Yenildin ve Yabanıllar [kidnapped_entourage.GetName]'i alıp götürdü..."

