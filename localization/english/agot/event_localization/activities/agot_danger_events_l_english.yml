### TODO NOT-IN-ST: agot_danger.0005.desc [AGOT: I leap into the dark sanctuary of the cave just as the first snows start to fling themselves down from the clouds above. The howling of the wind still haunts us inside, but the walls of the cave are thick, and they will shelter us from the worst of the cold.\n\nAs I step further into the cave, my eyes adjusting to the darkness I have no torches to dispel, I am surprised to find paintings waiting for me deeper within the cave. Figures of some folk who used this place for shelter before us.]
 agot_danger.0005.desc:0 "I leap into the dark sanctuary of the cave just as the first snows start to fling themselves down from the clouds above. The howling of the wind still haunts us inside, but the walls of the cave are thick, and they will shelter us from the worst of the cold.\n\nAs I step further into the cave, my eyes adjusting to the darkness I have no torches to dispel, I am surprised to find paintings waiting for me deeper within the cave. Figures of some folk who used this place for shelter before us."
