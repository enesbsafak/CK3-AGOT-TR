### TODO NOT-IN-ST: agot_danger.0004.desc [AGOT: Traveling through the unforgiving wilderness that stretches beyond the Wall is difficult enough on a good day. Today, it seems, will not be one of those. The air jabs its way into every gap in my furs and cloak, and the howling gales pummel my senses. I know the clouds above will carry with them snow to blind me as well. With the snows will also come wet, and with wet will come freezing. Shelter might save lives now.]
 agot_danger.0004.desc:0 "Traveling through the unforgiving wilderness that stretches beyond the Wall is difficult enough on a good day. Today, it seems, will not be one of those. The air jabs its way into every gap in my furs and cloak, and the howling gales pummel my senses. I know the clouds above will carry with them snow to blind me as well. With the snows will also come wet, and with wet will come freezing. Shelter might save lives now."
