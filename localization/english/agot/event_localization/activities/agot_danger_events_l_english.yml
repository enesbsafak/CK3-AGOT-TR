 agot_danger.0010.b.bothsink.tt:0 "İkiniz de buzun altında boğuluyorsunuz"

 agot_danger.0011.title:0 "$travel_danger_prefix$ İnce Buzda"

 agot_danger.0011.desc:0 "[travel_leader.GetFirstNameNicknamed] emirlerime sadakatle uyar ve donmuş yüzeye iner. [travel_leader.GetSheHe|U] daha üç adım atar atmaz, görünüşte hiçbir uyarı olmadan [travel_leader.GetHerHis] ayaklarının altındaki buz şiddetle çatlar - ve [travel_leader.GetSheHe] yüzeyin altında kaybolur."

 agot_danger.0011.a:0 "[travel_leader.GetSheHe|U] artık kendi başına."

 agot_danger.0011.a.tt:0 "Kenarda durup [travel_leader.GetFirstNameNoTooltip]'in yeniden yüzeye çıkmasını bekliyorsun - ya da çıkmamasını"

 agot_danger.0011.a.swim.tt:0 "[travel_leader.GetFirstNameNoTooltip] buzun altından çıkıyor"

 agot_danger.0011.a.swim.toast:0 "[travel_leader.GetFirstNameNoTooltip] dondurucu sudan yeniden yüzeye çıkıyor"

 agot_danger.0011.a.sink.tt:0 "[travel_leader.GetFirstNameNoTooltip] nehirde boğuluyor"

 agot_danger.0011.a.sink.toast:0 "[travel_leader.GetFirstNameNoTooltip] dondurucu derinliklerde can verdi"

 agot_danger.0011.b:0 "[travel_leader.GetHerHim]'e yardım etmeliyim!"

 agot_danger.0011.b.tt:0 "[travel_leader.GetName]'i kurtarmak için atılıyorsun"

 agot_danger.0011.b.swim.tt:0 "[travel_leader.GetFirstNameNoTooltip]'i buzun altından çıkarmayı başarıyorsun"

 agot_danger.0011.b.swim.toast:0 "[travel_leader.GetFirstNameNoTooltip]'i boğulmaktan kurtardın"

 agot_danger.0011.b.sink.tt:0 "[travel_leader.GetFirstNameNoTooltip] ulaşılamayacak kadar derine batıyor"

 agot_danger.0011.b.sink.toast:0 "[travel_leader.GetFirstNameNoTooltip] nehirde boğuluyor"

 agot_danger.0011.b.bothsink.tt:0 "[travel_leader.GetFirstNameNoTooltip] ile birlikte suya düşüp ölüyorsunuz"
