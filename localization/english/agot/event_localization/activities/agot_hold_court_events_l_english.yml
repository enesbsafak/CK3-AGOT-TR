l_english:

 agot_hold_court.1001.t:0 "$hold_court_header$ Bir Üst Derece Teklifi"

 agot_hold_court.1001.desc:0 "Vassalim [paramount_petitioner.GetTitledFirstName] tahtıma yaklaşıp derin bir eğiliyor.\n\n"Selamlar, majesteleri. [paramount_title.GetName]'in taçtan ayrı bir sahibi yok. Bu bölgeyi sizin adınıza yönetmek için kendimi öne sürmek istiyorum.""

 agot_hold_court.1001.a:0 "[paramount_title.GetName]'i benim için yöneteceksiniz."

 agot_hold_court.1001.b:0 "Kaybettin! Hiçbir şey alamıyorsun! İyi günler, ser! "

 agot_hold_court.1011.t:0 "$hold_court_header$ Kanlı Sınırlar"

 agot_hold_court.1011.desc_paramount:0 "[aggressor_vassal.GetName], [defender_vassal.GetName]'i, haklı olarak [aggressor_vassal.GetHerHim]'e bağlılık borçlu olan topraklar ve lordlar üzerinde hukuka aykırı biçimde hüküm sürmekle suçluyor. [defender_vassal_vassal.GetName]'in [defender_vassal.GetName]'e bağlılık göstermesinin diyarda dengesizlik yarattığını, bu toprakların ve gelirlerinin kendisine bağlanması gerektiğini öne sürdüğünden, [vassal_claim.GetName] [aggressor_vassal.GetHerHis] başlıca öfke kaynağı.\n\n"

 agot_hold_court.1011.desc_direct:0 "[aggressor_vassal.GetName], [defender_vassal.GetName] tarafından tutulan ve doğrudan size bağlı olan [vassal_claim.GetName]'in kendi De Jure topraklarının bir parçası olduğunu ve diyarın çıkarı için burayı kendilerine geri vermeniz gerektiğini iddia ediyor.\n\n"

 agot_hold_court.1011.desc_historic_claimant:0 "Ayrıca [defender_vassal.GetTitledFirstName]'in [vassal_claim.GetName]'in meşru efendisi bile olmadığını; [dynasty.GetName] Hanesi'nin burayı uzun yıllar boyunca [aggressor_vassal.GetPrimaryTitle.GetName]'e bağlı kalarak iyi niyetle elinde tuttuğunu belirtiyor. Bu nedenle, ailesi tarihsel topraklarından edilmiş olan [historic_claimant.GetName]'e yeniden tahsis edilebileceğini öne sürüyor."

 agot_hold_court.1011.desc_historic_same:0 "[dynasty.GetName] Hanesi, [vassal_claim.GetName]'in geleneksel sahibidir; bu yüzden [defender_vassal.GetName], toprağa sahip olma hakkına sahiptir."

 agot_hold_court.1011.desc_default:0 "[vassal_claim.GetName] [dynasty.GetName]."

 agot_hold_court.1011.desc_paramount_titles:0 "İşleri daha da karmaşıklaştırmak için, [defender_vassal_vassal.GetTitledFirstName] diyarın dört bir yanında unvanlara sahip"

 agot_hold_court.1011.desc_titles:0 "İşleri daha da karmaşıklaştırmak için, [defender_vassal.GetTitledFirstName] diyarın dört bir yanında unvanlara sahip."

 agot_hold_court.1011.a.direct:0 "[defender_vassal.GetTitleAsNameNoTooltip], size bağlılık yemini edecek."

 agot_hold_court.1011.a.indirect:0 "[defender_vassal_vassal.GetTitleAsNameNoTooltip], size bağlılık yemini edecek."

 agot_hold_court.1011.b.direct:0 "[defender_vassal.GetFirstNamePossessive] diyarı çok büyüdü ve bölünmesi gerekiyor."

 agot_hold_court.1011.b.indirect:0 "[defender_vassal_vassal.GetFirstNamePossessive] diyarı çok büyüdü ve bölünmesi gerekiyor."

 agot_hold_court.1011.c:0 "O fazla unvanları senin için alacağım!"

 agot_hold_court.1011.d:0 "[vassal_claim.GetNameNoTier], tarihsel olarak [historic_claimant.GetHouse.GetName] Hanesi'nin merkezidir; [historic_claimant.GetFirstName]'e verilecektir!"

 agot_hold_court.1021.t:0 "[historic_claimant.GetName]"

 agot_hold_court.1021.desc:0 "Hey dostum [claim_title.GetName] senin ama [dynasty.GetName] Hanesi yüzyıllardır ona sahipti ve bizim hiç toprağımız yok, belki bana verirsin uwu "
