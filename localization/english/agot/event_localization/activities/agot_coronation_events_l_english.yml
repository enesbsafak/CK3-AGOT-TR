l_english:

 coronation.0001.t:0 "Son Hazırlıklar"

 coronation.0001.desc_intro:0 "Hizmetkarlar [barony.GetNameNoTier] avlusunda koşuşturarak son süslemeleri yerleştirirken, saray mensupları yerlerini alıyor. Bu törene katılacakların çoğu henüz gelmedi."

 coronation.0001.dislikes_host_vassal:0 "Hâlâ inanamıyorum; o [host.Custom('InsultNoun')], [center_portrait.GetFirstName|U], taç giyip yeni [center_portrait.GetTitleAsNameNoTooltip|U]mız olacak. [center_portrait.GetHerHim|l] ile aynı odada durmaya bile dayanamıyorum, bir de diz çökme zorunluluğu yok mu."

 coronation.0001.dislikes_host_other:0 "Hâlâ inanamıyorum; o [host.Custom('InsultNoun')], [center_portrait.GetFirstName|U], taç giyip [center_portrait.GetTitleAsNameNoTooltip|U] olacak. [center_portrait.GetHerHim|l] ile aynı odada durmaya bile dayanamıyorum."

 coronation.0001.likes_host:0 "Bugün yeni [center_portrait.GetTitleAsNameNoTooltip|U]mıza taç giydireceğimize inanmak güç. [center_portrait.GetFirstName|U] bu görevin üstesinden gelebilecek gibi görünüyor. [center_portrait.GetPrimaryTitle.GetNameNoTierNoTooltip]in [center_portrait.GetFirstNamePossessiveNoTooltip|U] çok yetenekli ellerinde olacağını bilmek içimi rahatlatıyor. [center_portrait.GetHerHis|l] saltanatı uzun ve bereketli olsun."

 coronation.0001.neutral:0 "Bugün yeni bir [center_portrait.GetTitleAsNameNoTooltip|U]a taç giydiriyoruz. [center_portrait.GetFirstName|U] yetenekli görünüyor; gerçekten bu işe uygun olup olmadığını zaman gösterecek."

 coronation.0001.host:0 "Bugün [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip|U]ı olarak taç giyiyorum."

 coronation.0001.intent_woo_arrived:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Bu amaçla kalabalığın arasında [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi görüyorum; [ROOT.Char.GetInvolvedActivityIntent.GetName|l] için kurduğum plan [ROOT.Char.GetIntentTarget.GetHerHim]e doğru planlandığı gibi ilerleyebilir."

 coronation.0001.intent_woo:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Ancak [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi henüz hiçbir yerde bulamıyorum. [ROOT.Char.GetInvolvedActivityIntent.GetName|l] planımın ilerlemesi için [ROOT.Char.GetIntentTarget.GetHerHim]in gelmesini sabırsızlıkla bekliyorum."

 coronation.0001.intent_murder_arrived:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Bu amaçla kalabalığın arasında [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi görüyorum; [ROOT.Char.GetInvolvedActivityIntent.GetName|l] için kurduğum plan [ROOT.Char.GetIntentTarget.GetHerHim]e doğru planlandığı gibi ilerleyebilir."

 coronation.0001.intent_murder:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Ancak [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi henüz hiçbir yerde bulamıyorum. [ROOT.Char.GetInvolvedActivityIntent.GetName|l] planımın ilerlemesi için [ROOT.Char.GetIntentTarget.GetHerHim]in gelmesini sabırsızlıkla bekliyorum."

 coronation.0001.intent_befriend_arrived:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Bu amaçla kalabalığın arasında [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi görüyorum; [ROOT.Char.GetInvolvedActivityIntent.GetName|l] için kurduğum plan [ROOT.Char.GetIntentTarget.GetHerHim]e doğru planlandığı gibi ilerleyebilir."

 coronation.0001.intent_befriend:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Ancak [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi henüz hiçbir yerde bulamıyorum. [ROOT.Char.GetInvolvedActivityIntent.GetName|l] planımın ilerlemesi için [ROOT.Char.GetIntentTarget.GetHerHim]in gelmesini sabırsızlıkla bekliyorum."

 coronation.0001.intent_diplomacy_arrived:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Bu amaçla kalabalığın arasında [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi görüyorum; [ROOT.Char.GetIntentTarget.GetHerHim]le ittifak kurma planım planlandığı gibi ilerleyebilir."

 coronation.0001.intent_diplomacy:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Ancak [ROOT.Char.GetIntentTarget.GetTitledFirstName]yi henüz hiçbir yerde bulamıyorum. [ROOT.Char.GetIntentTarget.GetHerHim]le ittifak kurma planımın ilerlemesi için [ROOT.Char.GetIntentTarget.GetHerHim]in gelmesini sabırsızlıkla bekliyorum."

 coronation.0001.intent_legitimize_bastard:0 "\n\nYine de [ROOT.Char.GetIntentTarget.GetFirstNameNicknamed]nin [center_portrait.GetHerHis|U] Hazretleri tarafından meşrulaştırılması hedefi aklımın en önünde. Tek umudum, [center_portrait.GetFirstNameNoTooltip|U]nün davamı kabul edip kraliyet meşrulaştırma fermanı çıkarması."

 coronation.0001.intent_sabotage_coronation:0 "\n\nŞansım yaver giderse bu töreni durdurabilir ya da en azından geciktirebilirim."

 coronation.0001.intent_vie_male:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Bu amaçla kalabalığın arasında Hazretlerini görüyorum. Küçük Konseye katılma planımı uygulayabilmem için onunla baş başa kalmam şart."

 coronation.0001.intent_vie_female:0 "\n\nŞenliklere rağmen gerçekleştirmem gereken başka hedeflerim de var. Bu amaçla kalabalığın arasında Hazretlerini görüyorum. Küçük Konseye katılma planımı uygulayabilmem için onunla baş başa kalmam şart."

 coronation.0001.waiting_for_officiant:0 "[lower_right_portrait.GetTitledFirstNameNicknamed|U]nin gelişini sabırsızlıkla bekliyorum. Son hazırlıklar yapılırken [lower_right_portrait.GetHerHim|l] ile konuşacak daha çok şey var."

 coronation.0001.a.good:0 "Ne muhteşem bir gün!"

 coronation.0001.a.bad:0 "Bu günün bitmesini sabırsızlıkla bekliyorum."

 coronation.0001.a.sabotage:0 "[center_portrait.GetFirstNamePossessiveNoTooltip] gününü mahvetme zamanı!"

 coronation.0001.after.tt:0 "Davet edilen herkese kuzgun gönderilecek."

 coronation.0002.t:0 "Yeni Bir Tören Yöneticisi"

 coronation.0002.desc:0 "Öngörülemeyen koşullar beni taçlandıracak yeni birini bulmaya zorluyor. Dolu salona bakıyorum, umarım kayda değer biri [old_coronation_officiant.GetTitledFirstNameNicknamed|U] yerini almaya razı olur."

 coronation.0002.desc_removed:0 "Öngörülemeyen koşullar beni taçlandıracak yeni birini bulmaya zorluyor. Dolu salona bakıyorum, umarım kayda değer biri [old_coronation_officiant.GetTitledFirstNameNicknamed|U] yerini almaya razı olur."

 coronation.0002.desc_no_officiant:0 "Bana taç giydirecek birine ihtiyacım olabileceği aklıma geliyor. Davetlilerle dolu salona bakıyorum; kayda değer biri bu rolü üstlenmeye gönüllü olur mu diye merak ediyorum."

 coronation.0002.a:0 "Bana başka biri taç giydirecek!"

 coronation.0002.a.tt:0 "[new_coronation_officiant.GetTitledFirstNameNicknamed|U] taç giyme töreninizin yöneticisi olarak görev yapacak."

 coronation.0002.a.tt_hof:0 "[new_coronation_officiant.GetTitledFirstNameNicknamed|U] sizin [head_of_faith|E]nizdir, bu sayede [piety_i] [piety|E] kazancınız artar."

 coronation.0002.a.tt_pv:0 "[new_coronation_officiant.GetTitledFirstNameNicknamed|U] bir [powerful_vassal|E]dır, bu sayede [legitimacy_i] [legitimacy|E] kazancınız artar."

 coronation.0002.a.tt_dynn:0 "[new_coronation_officiant.GetTitledFirstNameNicknamed|U] [dynasty|E]nizin bir üyesidir, bu sayede [dynasty_prestige_i] [dynasty_prestige|E] kazancınız artar."

 coronation.0002.a.tt_consort:0 "[new_coronation_officiant.GetTitledFirstNameNicknamed|U] sizin [spouse|E]inizdir, bu sayede [prestige_i] [prestige|E]niz artar."

 coronation.0002.b:0 "Belki de bana [intent_target.GetTitledFirstNameNicknamed|U] taç giydirmeli."

 coronation.0002.b.tt:0 "[new_coronation_officiant.GetTitledFirstNameNicknamed|U] taç giyme töreninizin yöneticisi olarak görev yapacak."

 coronation.0002.c:0 "Canı cehenneme, kendim yapacağım!"

 coronation.0002.c.tt:0 "Kendini taçlandıracaksın."

 coronation.0003.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"

 coronation.0003.desc_seven_kingdoms:0 "Büyük bir onur ve heyecanla, Andalların, Rhoynarların ve İlk İnsanların [sender.GetTitleAsNameNoTooltip|U]ı, Yedi Krallığın [sender.GetLadyLord|U]ı ve Diyarın Koruyucusu, [sender.GetHouse.GetName|U] Hanesinden [sender.GetFirstNameNoTooltip|U] olarak sizi bu davete çağırıyorum. [GetActivityType('activity_agot_coronation').GetName|l]imin kutlu günü [county.GetNameNoTier]da, [barony.GetNameNoTier]de gerçekleştirilecektir."

 coronation.0003.desc_other:0 "Büyük bir onur ve heyecanla, [sender.GetPrimaryTitle.GetNameNoTierNoTooltip]in [sender.GetTitleAsNameNoTooltip|U]ı, [sender.GetHouse.GetName|U] Hanesinden [sender.GetFirstNameNoTooltip|U] olarak sizi bu davete çağırıyorum. [GetActivityType('activity_agot_coronation').GetName|l]imin kutlu günü [county.GetNameNoTier]da, [barony.GetNameNoTier]de gerçekleştirilecektir."

 coronation.0003.desc_officiant:0 "\n\nSaygın konumunuz ve sarsılmaz sadakatinizin takdiriyle, töreni yönetmenizi ve tacı başıma koyma onurunu taşımanızı alçakgönüllülükle rica ediyorum. Bu kutsal etkinliğe katılımınız yalnızca aramızdaki bağın birliğini ve gücünü simgelemekle kalmayacak, saltanatım için asil bir örnek de teşkil edecektir.\n\n[county.GetNameNoTierNoTooltip]e yolculuğunuz tez ve güvenli olsun. Gelişinizi ve sarsılmaz desteğinizin sözünü sabırsızlıkla bekliyorum."

 coronation.0003.desc_guest:0 "\n\n[county.GetNameNoTierNoTooltip]e yolculuğunuz tez ve güvenli olsun. Gelişinizi ve sarsılmaz desteğinizin sözünü sabırsızlıkla bekliyorum."

 coronation.0003.desc_vassal:0 "\n\nDiyarın sadık bir vassalı olarak katılımınız hem rica hem de zorunludur. Bu önemli etkinliğe katılmanız ve diz çökerek bağlılığınızı herkesin önünde ilan etmeniz beklenir. Bu davranış, taca olan sadakatinizin ve diyarın süregelen birliğine bağlılığınızın göstergesi olacaktır.\n\n[county.GetNameNoTierNoTooltip]e yolculuğunuz tez ve güvenli olsun. Gelişinizi ve sarsılmaz desteğinizin sözünü sabırsızlıkla bekliyorum."

 coronation.0003.a:0 "Memnuniyetle; hemen yola koyuluyorum."

 coronation.0003.b:0 "Yerime birini göndereceğim."

 coronation.0003.c:0 "İlgilenmem gereken daha önemli işler var."

 coronation.0003.c.tt_refusal:0 "[recipient.GetTitledFirstNameNoTooltip|U] Taç Giyme Törenine Katılmayı Reddetti"

 coronation.0003.c.tt_officiant_refusal:0 "[recipient.GetTitledFirstNameNoTooltip|U] Taç Giyme Törenini Yönetmeyi Reddetti"

 coronation.0004.t:0 "[ROOT.Char.GetCapitalLocation.GetNameNoTooltip] Temsilcisi"

 coronation.0004.desc:0 "[coronation_target.GetTitledFirstName]nin taç giyme töreniyle birlikte Taca bağlılığımı yenilemem bekleniyor. Katılamadığım için yerime birinin gitmesi gerekiyor."

 coronation.0004.a:0 "[potential_representative_1.GetFirstNameNoTooltip|U] mantıklı seçim."

 coronation.0004.a.tt:0 "[potential_representative_1.GetShortUIName] daveti sizin adınıza kabul etti"

 coronation.0004.b:0 "[potential_representative_2.GetFirstNameNoTooltip|U] olmalı."

 coronation.0004.b.tt:0 "[potential_representative_2.GetShortUIName] daveti sizin adınıza kabul etti"

 coronation.0004.c:0 "[potential_representative_3.GetFirstNameNoTooltip|U] öyle olsun."

 coronation.0004.c.tt:0 "[potential_representative_3.GetShortUIName] daveti sizin adınıza kabul etti"

 coronation.0004.d:0 "Danışmanlarımdan biri beni temsil edecek."

 coronation.0004.d.tt:0 "Uygun danışmanlarınız arasından seçim yapacaksınız"

 coronation.0005.t:0 "Taç Seçimi"

 coronation.0005.desc:0 "Son hazırlıklar sürerken [coronation_officiant.GetTitledFirstNameNoTooltip] yanıma yaklaşıyor. "Your Grace, we must decide upon which crown you wish to be crowned with."\n\nI take a moment to consider which of the crowns in my collection should be used."

 coronation.0005.desc_high_septon:0 "Son hazırlıklar sürerken [coronation_officiant.GetTitledFirstNameNicknamedNoTooltip|U] yanıma yaklaşıyor. "Your Grace, we must decide upon which crown you wish to be crowned with."\n\nI take a moment to consider which of the crowns in my collection should be used."

 coronation.0005.desc_after_sabotage:0 "Birisi tacımı çaldıktan sonra, koleksiyonumdaki diğer taçlar arasından seçim yapmalıyım"

 coronation.0005.a:0 "Bu gayet işe yarar."

 coronation.0005.a.tt:0 "Size taç giydirmek için #high [selected_crown_for_coronation.GetNameNoTooltip]#! kullanılacak"

 coronation.0005.b:0 "Bunların hiçbiri uygun değil; yeni bir taç sipariş edeceğim."

 coronation.0006.t:0 "Taç Giymek ya da Giyememek"

 coronation.0006.desc:0 "Diyarda savaş patlak verdi ve daha taç giyemedim. Bu şartlar altında resmi bir taç giyme töreninden vazgeçersem diyar beni affedebilir. Öte yandan, diyarın lordları bunu ilerleyen yıllarda yüzüme vurabilir."

 coronation.0006.a:0 "Tahtımı güvence altına almak için yapılmalı."

 coronation.0006.a.tt:0 "Resmiyetsiz bir şekilde taç giyeceksiniz"

 coronation.0006.b:0 "Ya düzgünce yapılmalı ya da hiç yapılmamalı."

 coronation.0006.b.tt:0 "Bir [GetActivityType( 'activity_agot_coronation' ).GetName] düzenlemek için savaşın sonuçlanmasını bekleyeceksiniz"

 coronation.0008.t:0 "Olgunluk Çağı"

 coronation.0008.desc:0 "Taç giymemi geciktirmek için artık yaşımı bahane edemem. Diyar, tahtıma oturmaya layık olmadığıma karar vermemesi için yakında bir tören bekleyecektir."

 coronation.0008.a:0 "Ve böylece başlıyor."

 coronation.0100.t:0 "Taç Giyme Töreni Başlıyor"

 coronation.0100.desc_diplo:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Hazırlıklar yapılırken zihnim şimdiden sıradakine odaklanmış durumda. Tüm ritüellerin ve törenlerin ardında, taç giyme törenleri her şeyden önce siyasi olaylardır. Gülümsemelere ve hürmete rağmen, vassallarım yönetimimi kabul edecek mi diye merak ediyorum."

 coronation.0100.desc_religious:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Taç giyme töreninin tüm adımları önemlidir. Nihayetinde herhangi bir ritüelin geçerliliği, tüm parçalarının doğru biçimde icra edilmesine bağlıdır.\n\n[other_guest.GetTitledFirstName|U]nün ve [other_guest.GetHerHis|l] yardımcılarını dikkatle izliyorum; kaçırılan herhangi bir unsur, meşruiyetimin sorgulanmasına yol açabilir."

 coronation.0100.desc_shy:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Her şey bunaltıcı: gösterişli süslemeler, misafirlerin durmak bilmeyen gevezeliği ve her hareketimi yargılayan vassallarımın delici bakışları.\n\nTüm bunlar kaygı dolu fırtınalı bir girdapta birleşiyor; tek umudum taç giydiğim anda yatışması. Elimde olsaydı bu formalitelerin hepsinden kurtulurdum."

 coronation.0100.desc_arrogant:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Gün daha yeni başladı ve [other_guest.GetTitledFirstName|U]nün durmak bilmeyen gevezeliğinden çoktan bıktım. Şaşırtıcı olmayan bir şekilde, sabahın büyük bölümünde için için kaynadım.\n\nBu gidişle taç giydiğimde ateş püskürebileceğim. Sabrım iyice tükeniyor."

 coronation.0100.desc_paranoid:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Sözde iyi dilekçilerin ve hürmetkâr vassalların tamamı sahte gülümsemelerinin ardında yalan ve hile gizliyor.\n\nTaç başıma konduğunda kuzgunlar etrafımda dönmeye başlayacak. Ama asla bana zarar veremeyecekler."

 coronation.0100.desc_appearance:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Ancak dikkatim çevremdeki tüm bakışlarda. Engelimin kimilerinde tiksinti, kimilerinde dehşet uyandırdığını biliyorum ama bugün bana bakmak zorunda kalacaklar.\n\nUmarım yorumlarını kendilerine saklarlar."

 coronation.0100.desc_seducer:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Dikkatim yaklaşan törenden etrafta koşuşturan genç ve güzel hizmetkarlara kayıyor. Etkinlik başlamadan önce bir ikisini göze batmadan benimle kaçmaları için ikna edebilir miyim diye merak ediyorum. Kimsenin fark etmesi pek olası değil."

 coronation.0100.desc_drunkard:0 "Nihayet [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]in [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak resmen taç giyeceğim gün geldi. Yaklaşan törene rağmen en büyük arzum sert bir içki. Etrafta koşuşturan hizmetkarları izlerken, susuzluğumu gidermek için birine istediğim içeceği getirmesini emrediyorum. Birini bitirir bitirmez bir yenisi getiriliyor. Günün sonunda ayakta durabilirsem bu bir mucize olacak."

 coronation.0100.desc_guest:0 "Gün geldi çattı. [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]i yönetme işinin üstesinden [coronation_target.GetFirstName|U]nün gelip gelemeyeceğini yalnızca zaman gösterecek."

 coronation.0100.a:0 "Böylece başlıyor..."

 coronation.0150.t:0 "Gerçek [coronation_target.GetTitleAsNameNoTooltip|U]"

 coronation.0150.desc_ct_intro:0 "Tören nihayet doruk noktasına ulaştı. [officiant.GetTitledFirstNameNicknamed|U] beni [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadı ve şimdi bana taç giydirmeye hazırlanıyor. Taç başıma konarken [officiant.GetTitledFirstNameNicknamedNoTooltip|U] ilan ediyor:"

 coronation.0150.desc_ct_no_crown_intro:0 "Tören nihayet doruk noktasına ulaştı. [officiant.GetTitledFirstNameNicknamed|U] beni [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadı. Ortada taç olmadığından [officiant.GetTitledFirstNameNicknamedNoTooltip|U] yalnızca ilan ediyor:"

 coronation.0150.desc_self_crowner_intro:0 "Tören nihayet doruk noktasına ulaştı. [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsandım ve tacı başıma koymaya hazırlanıyorum. Taç alnıma yerleşirken ayağa kalkıp kalabalığa dönüyorum."

 coronation.0150.desc_self_crowner_no_crown_intro:0 "Tören nihayet doruk noktasına ulaştı. [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsandım. Ortada taç olmadığından kalabalığa dönüp ilan ediyorum:"

 coronation.0150.desc_officiant_intro:0 "Tören nihayet doruk noktasına ulaştı. [coronation_target.GetTitledFirstName|U]nü [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadım ve [coronation_target.GetHerHim]e taç giydirmeye hazırlanıyorum. Tacı [coronation_target.GetFirstNamePossessiveNoTooltip|U]nün başına koyarken ilan ediyorum:"

 coronation.0150.desc_officiant_no_crown_intro:0 "Tören nihayet doruk noktasına ulaştı. [coronation_target.GetTitledFirstName|U]nü [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadım, ancak [coronation_target.GetHerHis|l] başına koyacak tacımız yok. Bu yüzden yalnızca ilan ediyorum:"

 coronation.0150.desc_guests_intro:0 "Tören nihayet doruk noktasına ulaştı. [officiant.GetTitledFirstNameNicknamed|U], [coronation_target.GetTitledFirstName|U]nü [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadı ve şimdi [coronation_target.GetHerHim]e taç giydirmeye hazırlanıyor. Taç [coronation_target.GetFirstNamePossessiveNoTooltip|U]nün başına konarken [officiant.GetTitledFirstNameNicknamedNoTooltip|U] ilan ediyor:"

 coronation.0150.desc_guests_no_crown_intro:0 "Tören nihayet doruk noktasına ulaştı. [officiant.GetTitledFirstNameNicknamed|U], [coronation_target.GetTitledFirstName|U]nü [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadı, ancak ortada görünecek bir taç yok. [officiant.GetTitledFirstNameNicknamedNoTooltip|U] yalnızca ilan ederken şaşkın bakışlar paylaşıyoruz:"

 coronation.0150.desc_guests_self_crowner_intro:0 "Tören nihayet doruk noktasına ulaştı. [coronation_target.GetTitledFirstName|U] [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsandı ve [coronation_target.GetSheHe|l] tacı [coronation_target.GetHerHis|l] başına koyuyor.\n\nBize dönerek [coronation_target.GetSheHe|l] ilan ediyor:"

 coronation.0150.desc_guests_self_crowner_no_crown_intro:0 "Tören nihayet doruğuna ulaştı. [coronation_target.GetTitledFirstName|U], [coronation_target.GetFaith.GetNameNoTooltip]'in geleneksel ayinleriyle meshedildi ama ortada taç yok.\n\nBize dönerek [coronation_target.GetSheHe|l] sadece şunu ilan ediyor:"

 coronation.0150.desc_saboteur_no_crown_intro:0 "Tören nihayet doruk noktasına ulaştı. [officiant.GetTitledFirstNameNicknamed|U], [coronation_target.GetTitledFirstName|U]nü [coronation_target.GetFaith.GetNameNoTooltip]nin geleneksel ritüelleriyle kutsadı, ancak ortada görünecek bir taç yok. [officiant.GetTitledFirstNameNicknamedNoTooltip|U] yalnızca ilan ederken çevremdekiler şaşkın bakışlar paylaşıyor:"

 coronation.0150.desc_saboteur_self_crowner_no_crown_intro:0 "Tören nihayet doruğuna ulaştı. [coronation_target.GetTitledFirstName|U], [coronation_target.GetFaith.GetNameNoTooltip]'in geleneksel ayinleriyle meshedildi ama ortada taç yok.\n\nBize dönerek [coronation_target.GetSheHe|l] sadece şunu ilan ediyor:"

 coronation.0150.desc_proclamation_seven_kingdoms:0 "\n\n#italic "Before Gods and Men, I proclaim [coronation_target.GetFirstNameNoTooltipRegnal|U] of House [coronation_target.GetHouse.GetNameNoTooltip|U], [coronation_target.GetTitleAsNameNoTooltip|U] of the Andals, the Rhoynar, and the First Men, [coronation_target.GetLadyLord|U] of the Seven Kingdoms, and Protector of the Realm! Long may [coronation_target.GetSheHe] reign!" #!"

 coronation.0150.desc_proclamation_seven_kingdoms_self:0 "\n\n#italic "I am [coronation_target.GetFirstNameNoTooltipRegnal|U] of House [coronation_target.GetHouse.GetNameNoTooltip|U], [coronation_target.GetTitleAsNameNoTooltip|U] of the Andals, the Rhoynar, and the First Men, [coronation_target.GetLadyLord|U] of the Seven Kingdoms, and Protector of the Realm! Long may I reign!" #!"

 coronation.0150.desc_proclamation_other:0 "\n\n#italic "Before Gods and Men, I proclaim [coronation_target.GetFirstNameNoTooltipRegnal|U] of House [coronation_target.GetHouse.GetNameNoTooltip|U], [coronation_target.GetTitleAsNameNoTooltip|U] of [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip|U]! Long may [coronation_target.GetSheHe] reign!" #!"

 coronation.0150.desc_proclamation_other_self:0 "\n\n#italic "I am [coronation_target.GetFirstNameNoTooltipRegnal|U] of House [coronation_target.GetHouse.GetNameNoTooltip|U], [coronation_target.GetTitleAsNameNoTooltip|U] of [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip|U]! Long may I reign!" #!"

 coronation.0150.desc_ct_outro:0 "\n\nOnlarla yüzleşmek için ayağa kalktığımda kalabalık tezahürat yapmaya başlıyor."

 coronation.0150.desc_ct_no_crown_outro:0 "\n\nOnlarla yüzleşmek için ayağa kalktığımda, davetliler şaşkın bakışlar paylaşırken salon birkaç dakika sessiz kalıyor."

 coronation.0150.desc_self_crowner_outro:0 "$coronation.0150.desc_ct_outro$"

 coronation.0150.desc_self_crowner_no_crown_outro:0 "\n\nDavetliler şaşkın bakışlar paylaşırken salon birkaç dakika sessiz kalıyor."

 coronation.0150.desc_officiant_outro:0 "\n\nKalabalık tezahürat yapmaya başlıyor ve hepimiz, umarız barışçıl ve refah dolu bir saltanatın başlangıcına tanıklık ediyoruz."

 coronation.0150.desc_officiant_no_crown_outro:0 "\n\nDavetliler şaşkın bakışlar paylaşırken salon birkaç dakika sessiz kalıyor."

 coronation.0150.desc_guests_outro:0 "\n\nKalabalık tezahürat yapmaya başlıyor ve hepimiz, umarız barışçıl ve refah dolu bir saltanatın başlangıcına tanıklık ediyoruz."

 coronation.0150.desc_guests_no_crown_outro:0 "\n\nUzun bir süre kimse ses çıkarmıyor; sonunda biri çekingen çekingen alkışlamaya başlıyor ve biz de tereddütle ona katılıyoruz."

 coronation.0150.desc_guests_self_crowner_outro:0 "$coronation.0150.desc_officiant_outro$"

 coronation.0150.desc_guests_self_crowner_no_crown_outro:0 "\n\nUzun bir süre kimse ses çıkarmıyor; sonunda biri çekingen çekingen alkışlamaya başlıyor ve biz de tereddütle ona katılıyoruz."

 coronation.0150.desc_saboteur_no_crown_outro:0 "\n\nUzun bir süre kimse ses çıkarmıyor. Bunun benim işim olduğunu bildiğim için yüzümde yavaşça bir gülümseme beliriyor. Sonra biri çekingen çekingen alkışlamaya başlıyor ve diğerleri tereddütle katılıyor."

 coronation.0150.a:0 "Yaşasın kralımız!"

 coronation.0150.b:0 "Yaşasın kraliçemiz!"

 coronation.0150.c:0 "[coronation_target.GetFaith.HighGodName] şahidimiz olsun!"

 coronation.0150.a.tt_seven_kingdoms:0 "[coronation_target.GetShortUIName|U] Demir Tahta oturacak"

 coronation.0150.a.tt_other:0 "[coronation_target.GetShortUIName|U] [coronation_target.GetHerHis|l] tahtına oturacak"

 coronation.0150.b.tt_seven_kingdoms:0 "[coronation_target.GetShortUIName|U] Demir Tahta oturacak"

 coronation.0150.b.tt_other:0 "[coronation_target.GetShortUIName|U] [coronation_target.GetHerHis|l] tahtına oturacak"

 coronation.0150.c.tt_seven_kingdoms:0 "[coronation_target.GetShortUIName|U] Demir Tahta oturacak"

 coronation.0150.c.tt_other:0 "[coronation_target.GetShortUIName|U] sizin tahtınıza oturacak"

 coronation.0151.t:0 "Tahta Oturuş"

 coronation.0151.desc_intro_ruler_seven_kingdoms:0 "Taç giydim ve artık bu unvana layık olduğumu kanıtlayıp Fethedenin tahtına oturmalıyım. Kalabalıktan uzaklaşıp dönüyorum ve salonu sessizlik kaplıyor. Her adımı odada yankılanırken dar ve düzgün olmayan basamaklardan yukarı tırmanmaya başlıyorum.\n\n"

 coronation.0151.desc_intro_ruler_other:0 "Tahtıma oturmalıyım. Her adımı odada yankılanırken basamakları özenle çıkıyorum. Tahta yaklaştıkça tacın ağırlığı zihnimi dolduruyor ve sarayın gözleri üzerimde. Havada beklenti yoğun.\n\n"

 coronation.0151.desc_intro_ruler_slips:0 "Basamaklardan yuvarlanıyorum, ancak hızla ayağa kalkıp üzerimi silkelemeyi başarıyorum. Kalabalıktan uzaklaşıp dönüyorum ve salonu yeniden sessizlik kaplıyor. Her adımı odada yankılanırken basamakları tırmanmaya devam ediyorum.\n\n"

 coronation.0151.desc_intro_ruler_recovers:0 "Neredeyse düşmeme rağmen dengemi yeniden kazanmayı başarıyorum.\n\n"

 coronation.0151.desc_unworthy:0 "Havaya sinen hissedilir tedirginliğe karşı azmimi güçlendirmek için bir an duruyorum. Dönüp yavaşça Demir Tahta oturuyorum. Tedirginliğimin hafiflediğini hissettiğim anda parmağımda keskin bir batma hissediyorum ve elimi pürüzlü demirden hızla çekiyorum. \n\nKan yaradan sızmaya başlarken uzun bir süre yaraya bakıyorum. Kanlı elimi pelerinimin altına saklamaya çalışırken kalabalıktan nefes sesleri duyuyorum."

 coronation.0151.desc_worthy:0 "Havaya sinen hissedilir tedirginliğe karşı azmimi güçlendirmek için bir an duruyorum. Dönüp yavaşça Demir Tahta oturuyorum. En rahat koltuk sayılmaz ve alışabileceğimden şüpheliyim ama idare ederim.\n\nDiz çökmeye gelen vassallarımdan ilkini içeri almaları için görevlilerime işaret ediyorum."

 coronation.0151.desc_other:0 "Azmimi güçlendirmek için bir an duruyorum, dönüp yavaşça tahta oturuyorum. Ardından diz çökmeye gelen vassallarımdan ilkini içeri almaları için görevlilerime işaret ediyorum."

 coronation.0151.desc_intro_guest_seven_kingdoms:0 "[coronation_target.GetFirstName|U] taç giydi ve artık Demir Tahta oturmalı. Kalabalıktan uzaklaşıp dönüyor ve salonu sessizlik kaplıyor. Her adımı odada yankılanırken dar ve düzgün olmayan basamakları çıkışını nefesimizi tutarak izliyoruz."

 coronation.0151.desc_intro_guest_other:0 "[coronation_target.GetFirstName|U] taç giydi ve artık tahtına oturmalı. Kalabalıktan uzaklaşıp dönüyor ve salonu sessizlik kaplıyor. Her adımı odada yankılanırken basamakları çıkışını nefesimizi tutarak izliyoruz."

 coronation.0151.desc_intro_guest_slips:0 "[coronation_target.GetFirstName|U] taç giydi. [coronation_target.GetSheHe|l] tahta çıkarken kayıp basamaklardan düşüyor ve ben istemeden nefes nefese kalıyorum. [coronation_target.GetSheHe|U] tekrar ayağa kalkıyor ve salonu yeniden sessizlik kaplıyor. Her adımı odada yankılanırken dar ve düzgün olmayan basamakları yeniden çıkışını nefesimizi tutarak izliyoruz."

 coronation.0151.desc_intro_guest_recovers:0 "[coronation_target.GetFirstName|U] taç giydi. Artık tahta oturmalı. Kalabalıktan uzaklaşıp dönüyor ve salonu sessizlik kaplıyor. Her adımı odada yankılanırken basamakları çıkışını nefesimizi tutarak izliyoruz. Bir an [coronation_target.GetSheHe|l] dengesini kaybediyor ama hemen toparlanıyor."

 coronation.0151.desc_unworthy_guest:0 "\n\nHavaya sinen hissedilir bir tedirginlikle [coronation_target.GetSheHe|U] zirveye ulaşıp duraksıyor. [coronation_target.GetSheHe|U] dönüp Demir Tahta oturuyor. Tedirginliğimizin hafiflediğini hissettiğimiz anda [coronation_target.GetSheHe|l] haykırıyor, #italic "Ouch!" #!. We all let out a collective gasp as blood begins to ooze from [coronation_target.GetHerHis|U] Grace's wound.\n\nWe all share concerned glances, wondering if this is an dire presage of the reign to come."

 coronation.0151.desc_worthy_guest:0 "\n\nHavaya sinen hissedilir bir tedirginlikle [coronation_target.GetSheHe|U] zirveye ulaşıp duraksıyor. Hazretlerinin Tahta oturuşunu izliyoruz; ilk vassallarını [coronation_target.GetHerHim|l]in önünde diz çökmeye çağırıyor."

 coronation.0151.desc_other_guest:0 "\n\nHavaya sinen hissedilir bir tedirginlikle [coronation_target.GetSheHe|U] zirveye ulaşıp duraksıyor. [coronation_target.GetHerHim|l]in tahta oturuşunu izliyoruz; ilk vassallarını [coronation_target.GetHerHim|l]in önünde diz çökmeye çağırıyor."

 coronation.0151.a:0 "Diz çökme zamanı..."

 coronation.0151.b:0 "Lordları önüme getirin..."

 coronation.0151.c:0 "Belki de layık değilim."

 coronation.0152.t:0 "Diz Çökme"

 coronation.0152.desc:0 "[coronation_target.GetTitledFirstNamePossessive|U] hizmetkarları beni öne çağırıyor. Tek dizimin üzerine çöküp yeminimi okumaya hazırlanırken, yeni efendimin gözüne girmek için bir hediye vermenin akıllıca olabileceği aklıma geliyor."

 coronation.0152.a:0 "Boyun eğmem yeterlidir."

 coronation.0152_submission:0 "Diz çöküyorsunuz ama hiçbir şey vermiyorsunuz."

 coronation.0152.b:0 "Bir söz vereceğim."

 coronation.0152_hook:0 "Diz çöküp Taca bir iyilik sözü veriyorsunuz."

 coronation.0152.c:0 "Taca ödediğim haracı artıracağım."

 coronation.0152_contract:0 "Diz çöküp Taca ödediğiniz vergileri artırıyorsunuz."

 coronation.0152.d:0 "Altın ikram edeceğim."

 coronation.0152_gold:0 "Diz çöküp Taca altın hediye ediyorsunuz."

 coronation.0152.e:0 "Diz çökmeyi reddediyorum."

 coronation.0152_refusal:0 "Diz çökmeyi reddediyor ve sonuçlarına katlanacaksınız."

 coronation.0152_refusal.tt:0 "Etkinlikten çıkarılabilirsiniz"

 coronation.0154.t:0 "Eğilen Dizler"

 coronation.0154.desc_seven_kingdoms:0 "Demir Tahta oturduğumda vassallarımın her biri diz çöküyor. Kimisi hediye getiriyor, kimisi altın sunuyor, kimisi de kendini bana borçlandırıyor."

 coronation.0154.desc_other:0 "Tahtıma oturduğumda vassallarımın her biri diz çöküyor. Kimisi hediye getiriyor, kimisi altın sunuyor, kimisi de kendini bana borçlandırıyor."

 coronation.0154.desc_refusal:0 "Ancak bazıları yeminlerini bozarak [coronation_target.GetTitleAsNameNoTooltip]larına diz çökmeyi reddetti. Şenlikler sona erdiğinde bu hainlerle ilgilenmem gerekecek."

 coronation.0154.a:0 "Çok iyi."

 coronation.0200.t:0 "Taç Giyme Ziyafeti Başlıyor"

 coronation.0200.desc_host:0 "Tüm formaliteleri geride bıraktığımıza göre artık kutlama zamanı!\n\nHizmetkarlara yiyecek ve içecekleri getirmeleri, misafirleri de ziyafet yerine yönlendirmeleri için işaret veriyorum.\n\nZiyafet başlasın!"

 coronation.0200.desc:0 "Taç giyme töreninin resmi kısmı — tören — nihayet geride kaldı.\n\nHerkes, kendimize sunulmak üzere hazırlanan kocaman yemeği, heyecanlı eğlenceyi ve coşkulu şenliği beklerken gülümsüyor.\n\nHadi afiyet olsun!"

 coronation.0200.a:0 "Afiyet olsun!"

 coronation.0200.b:0 "Kendimi eğlendireceğim!"

 every_attending_relative_of_coronation_target:0 "[coronation_target.GetUIName]nin törene katılan tüm akrabaları"

 coronation.0900.t:0 "Taç Giyme Töreni Geçersiz"

 coronation.0900.desc:0 "[dead_spouse.GetTitledFirstNamePossessive] ani ölüm haberi, güneşli bir günde gök gürültüsü gibi çarpıyor taç giyme törenindekileri.\n\nŞarkılar kesiliyor, gülen yüzler gözyaşına dönüyor, yerdeki çiçekler yas tutan kalabalığın ayakları altında dağılıp eziliyor.\n\nMutluluk için olan böyle bir günün yas gününe dönüşmesi gerçek bir trajedi..."

 coronation.0900.a:0 "Gerçekten bir trajedi..."

 coronation.9000.tt:0 "[previous_host.GetUIName|U], iptal edilen [GetActivityType('activity_agot_coronation').GetName] için [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0] tutarında geri ödeme aldı"

 coronation.0910.desc:0 "[dead_spouse.GetTitledFirstNamePossessive] ani ölüm haberi ta kemiğime işliyor; kendi taç giyme günümüzde gelen bu haber ne kadar beklenmedik ve trajik.\n\nDaha bir gün bile evli kalamadık ve sen çoktan elimden alındın..."

 coronation.0910.a:0 "Beni yasımda yalnız bırakın..."

 coronation.9015.tt:0 "[ROOT.Char.GetUIName|U], iptal edilen [GetActivityType('activity_wedding').GetName] için [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0] tutarında geri ödeme aldı"

 coronation.0915.desc:0 "[previous_host.Custom2('MyCharacterIntroduction', ROOT.Char)], vefat ettiği sırada bir [GetActivityType('activity_wedding').GetName] düzenliyordu. Davet edilmediğim nefis bir etkinlik.\n\n[previous_host.GetSheHe] artık olmadığına göre, parti dağılmış durumda ve herkes hayal kırıklığıyla evine gönderildi."

 coronation.0915.a:0 "Orada olmalıydım."

 coronation.0920.desc:0 "[free_spouse.GetTitledFirstName] ile taç giyme törenimi gerçekten dört gözle bekliyordum ama görünüşe göre [ROOT.Char.GetFaith.HouseholdGodName] benim için — ya da [free_spouse.GetFirstNameNoTooltip] için — başka planlar yapmış.\n\nNişan geçerliliğini korusa da, Büyük Düğün sözü artık hükümsüz ve geçersiz."

 coronation.0920.a:0 "Bu çok üzücü..."

 coronation.0921.desc:0 "[prisoner_spouse.GetTitledFirstNamePossessive] hapsedilmesi haberi tüm kutlamaları durduruyor. Görünüşe göre [ROOT.Char.GetFaith.HouseholdGodName] [prisoner_spouse.GetHerHim] için başka planlar yapmış.\n\nNişan geçerliliğini korusa da, Büyük Düğün sözü artık hükümsüz ve geçersiz."

 coronation.0921.a:0 "Ne hayal kırıklığı."

 coronation.0950.t:0 "Sonuç"

 coronation.0950.desc:0 "Son misafir — #EMP nihayet#! — ayrıldığında etrafıma bakıyorum: ıssız mekân, yemek artıkları, yere dökülmüş [ROOT.Char.Custom('RegionalDrink')], havada hâlâ yankılanan insan kahkahalarının yankıları... ve tatmin olmuş hissediyorum.\n\nNe muhteşem bir gündü! Organize etme işini çok iyi yaptım."

 coronation.0950.a:0 "Hepinize geldiğiniz için teşekkür ederim!"

 coronation.0960.desc:0 "Yeni bir gün doğuyor — [other_spouse.GetFirstName] ile hayatımın ilk günü.\n\nNe kadar nefis olurlarsa olsunlar, kutlamaları ve şenlikleri geride bırakıp yeni olağan hayatımıza geçme zamanı."

 coronation.0970.desc:0 "Misafirler birer birer ayrılıyor ve benim de gitme zamanım geldi.\n\nTaç giyme töreni, akranlarımla kaynaşmak ve dinlenmek için harika bir fırsattı; yorgun ama memnun bir şekilde mekândan ayrılıyor, yeni efendimize en iyi dileklerimi gönderiyorum."

 coronation.0970.a:0 "Tekrar tebrikler!"

 coronation.0997.desc_intro:0 "[missing_spouse.GetFirstName] için bekleyiş fazla uzadı ve [missing_spouse.GetSheHe]nün yol boyunca ortadan kaybolduğu artık aşikâr.\n\nKısa süre sonra insanlar konuşmaya başlıyor. Buraya pek uzak olmayan bir kasabadan gelen dedikoduya göre [missing_spouse.GetSheHe] en son şüpheli bir pazarda ot alırken görülmüş; bazıları ise yemin edercesine en son uzak diyarlara giden bir gemiye binerken gördüklerini iddia ediyor."

 coronation.0997.desc_spouse:0 "\n\nHer halükârda [missing_spouse.GetFirstNameNoTooltip]nün kaçtığı açık; çünkü [missing_spouse.GetSheHe], benimle evli kalmaktansa serseri bir hayat yaşamayı tercih ediyor."

 coronation.0997.desc_generic:0 "\n\nHer halükârda [missing_spouse.GetFirstNameNoTooltip]nün kaçtığı açık; çünkü [missing_spouse.GetSheHe], [other_spouse.GetFirstName] ile evli kalmaktansa serseri bir hayat yaşamayı tercih ediyor."

 coronation.0998.desc:0 "Bir taç giyme törenine eşlik eden tüm umutların boşa gitmesi ve büyük bir etkinlik düzenlemek için harcanan tüm emeğin çöpe gitmesi her zaman hüzünlü bir gündür.\n\nNe yazık ki bu taç giyme töreni olmaya yazılmamıştı.\n\nHizmetkarlar temizliğe başlarken misafirler, şaşkın ve hayal kırıklığına uğramış gruplar hâlinde kendi evlerine dönmek üzere ayrılıyor."

 coronation.0998.desc_stolen_crown:0 "[coronation_target.GetTitledFirstNamePossessiveOrMy|U] taç giyme töreni, birinin tacı çalması nedeniyle beklenmedik şekilde iptal edildi.\n\nBir taç giyme törenine eşlik eden tüm umutların boşa gitmesi ve büyük bir etkinlik düzenlemek için harcanan tüm emeğin çöpe gitmesi her zaman hüzünlü bir gündür.\n\nNe yazık ki bu taç giyme töreni olmaya yazılmamıştı.\n\nHizmetkarlar temizliğe başlarken misafirler, şaşkın ve hayal kırıklığına uğramış gruplar hâlinde kendi evlerine dönmek üzere ayrılıyor."

 coronation.0998.a:0 "Çok yazık."

 coronation.0999.t:0 "$coronation.0900.t$"

 coronation.0999.desc:0 "Son gelen haber kutlamaları böldü ve herkesi şaşkın ve kafası karışmış bir hâlde bıraktı.\n\nGörünüşe göre ev sahibinin statüsü ve mal varlığı taç giyme töreninin sürmesine izin vermiyor; onu yönetecek güçlü bir ev sahibi olmadan geriye yalnızca hayal kırıklığıyla eve dönmek kalıyor."

 coronation.0999.a:0 "Ne acı..."

 coronation.2000.t:0 "[coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip] Üzerindeki Hakkım"

 coronation.2000.desc:0 "[barony.GetNameNoTierNoTooltip] dışında, diyarın dört bir yanından gelen lord ve leydilerle içeri girip yerlerimizi bulmayı beklerken aklıma şu düşünce geliyor: Bugün taç giymesi gereken ben olmalıydım.\n\nBir plan şekillenmeye başlarken bu düşünce içimi kemiriyor. Belki de [coronation_target.GetTitledFirstNamePossessive] vassalları arasından hakkım için destekçiler toplayabilirim. Ardından [coronation_target.GetFirstNameNoTooltip] taç giymeden hemen önce itirazımı herkesin duyacağı şekilde dile getiririm.\n\nFarklı rütbelerde çeşitli lordlar ve leydiler görüyorum; kimisi nüfuzlu, kimisininse vasat bir şöhreti var."

 coronation.2000.a:0 "Yaklaşalım."

 coronation.2000.a.tt:0 "[potential_supporter.GetTitledFirstName]ye yaklaşacaksınız"

 coronation.2000.b:0 "Yeterince desteğim var."

 coronation.2000.b.tt:0 "Davanıza destek vermesi için başka kimseyi ikna etmeye çalışmayacaksınız"

 coronation.2000.c:0 "Bunun yerine haklarımdan feragat edeceğim"

