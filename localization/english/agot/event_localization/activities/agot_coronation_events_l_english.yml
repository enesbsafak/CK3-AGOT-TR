 coronation.1120.t:0 "[asking_guest.GetCapitalLocation.GetNameNoTooltip] Piçi"

 coronation.1120.a:0 ""Your Grace, I ask your permission to legitimize [bastard_scope.GetFirstNameNoTooltip|U]...""

 coronation.1120.a.success:0 "[bastard_scope.GetFirstNameNoTooltip|U] kraliyet fermanıyla meşrulaştırıldı"

 coronation.1120.a.failure:0 "[coronation_target.GetTitledFirstNameNoTooltip|U] ikna olmadı"

 coronation.1121.request_favor_tt:0 "[coronation_target.GetTitledFirstNameNoTooltip|U] karşılığında bir [favor|E] isteyebilir"

 coronation_bastard_intent.legitimization_intent.success.tt:0 "[bastard_scope.GetFirstNameNoTooltip]yi meşrulaştırma talebi kabul edildi."

 coronation.1120.b:0 ""Your Grace, you #bold will#! legitimize [bastard_scope.GetFirstNameNoTooltip|U]...""

 coronation.1120.c:0 ""On second thought, never mind...""

 coronation.1120.desc.intro:0 "Diyarın lordları ve leydileri [activity_barony.GetNameNoTier]ye doğru ilerlemeye başlarken, [coronation_target.GetHerHis|l] görevlileriyle birlikte [coronation_target.GetTitledFirstName|U]nü görüyorum. [bastard_scope.GetFirstName|U]nü yanıma alıp [coronation_target.GetTitleAsNameNoTooltip]nün yanına yaklaşıyorum. "Your Grace!" I call out, catching [coronation_target.GetHerHis|l] attention.\n\n[coronation_target.GetTitledFirstNameNoTooltip|U] turns, [coronation_target.GetHerHis|l] eyes narrowing with curiosity. "[asking_guest.GetTitledFirstNameNoTooltip|U], what can I do for you?""

 coronation.1121.desc:0 "Diyarın lordları ve leydileri [activity_barony.GetNameNoTier]ye doğru ilerlemeye başlarken, [asking_guest.GetTitledFirstName|U]nün hemen ardından [bastard_scope.GetFirstName|U] ile yaklaştığını görüyorum. "Your Grace!" [asking_guest.GetSheHe|U] calls out. [asking_guest.GetTitledFirstNameNoTooltip|U] bows deeply, [bastard_scope.GetFirstNameNoTooltip|U] follows suit.\n\n"[asking_guest.GetTitledFirstNameNoTooltip|U], what can I do for you?" I ask. \n\n"Your Grace, this is [bastard_scope.GetFirstNameNoTooltip|U]. [bastard_scope.GetSheHe|U] has served faithfully in my household, and I wish to see [bastard_scope.GetHerHim|l] legitimized."\n\nI study [bastard_scope.GetFirstNameNoTooltip|U], then [asking_guest.GetTitledFirstNameNoTooltip|U]. "Your bastard [asking_guest.Custom2('RelationToMe', SCOPE.sC('bastard_scope'))], you mean."\n\n[asking_guest.GetTitledFirstNameNoTooltip|U] nods. "Yes, Your Grace. [bastard_scope.GetFirstNameNoTooltip|U] is my blood and has proven [bastard_scope.GetHerselfHimself|l] worthy of my name.""

 coronation.1121.desc_hooked:0 "Diyarın lordları ve leydileri [activity_barony.GetNameNoTier]ye doğru ilerlemeye başlarken, [asking_guest.GetTitledFirstName|U]nün hemen ardından [bastard_scope.GetFirstName|U] ile yaklaştığını görüyorum. "Your Grace!" [asking_guest.GetSheHe|U] calls out.\n\n"[asking_guest.GetTitledFirstNameNoTooltip|U], what can I do for you?" I ask. \n\n[asking_guest.GetTitledFirstNamePossessiveNoTooltip|U] tone changes abruptly from one of deference to one of confidence. "Your Grace, this is [bastard_scope.GetFirstNameNoTooltip|U]. [bastard_scope.GetSheHe|U] has served faithfully in my household, and seeing as I am owed a favor by the Crown, I wish to see [bastard_scope.GetHerHim|l] legitimized.""

 coronation.1121.a:0 "Haklısın, [bastard_scope.GetSheHe|l] Hanenizin meşru bir üyesi olmalı"

 coronation.1121.a_hooked:0 "Pekâlâ. [bastard_scope.GetSheHe|U] Hanenizin meşru bir üyesi olacak"

 coronation.1121.b:0 "Karşılığında ne?"

 coronation.1121.c:0 "Şu an endişelenecek daha önemli işlerim var"

 coronation.1130.t:0 "Törende Sabotaj"

 coronation.1130.desc:0 "Misafirler yerlerine oturup [host.GetTitledFirstName|U]nün [host.GetHerHis|l] görkemli girişini beklerken, kendimi düşüncelere dalmış buluyorum. Büyük Salonu beklenti uğultusu dolduruyor, ancak aklıma karanlık bir fikir sızıyor.\n\nBu işi hızlıca sona erdirmenin bir yolu var mı diye merak ediyorum: töreni aksatmak ve yeni [host.GetTitleAsNamePossessiveNoTooltip|l] saltanatını daha başlamadan sarsmak. Gözlerim odayı tarıyor; tahtın yanındaki muhafızların stratejik konumlarını, süslemelerin dizilimini ve tacın yerleşimini not ediyorum.\n\nBir plan şekillenmeye başlıyor; hassasiyet ve gizlilik gerektiren bir plan. Taç giyme törenini sabote etmek, [host.GetFirstNamePossessiveNoTooltip] otoritesine meydan okumak için gereken kaosu yaratabilir."

 coronation.1130.a:0 "[sabotage_target_crown.GetName|U]ni çalabilirim"

 coronation.1130.a.tt:0 "#V Töreni geciktirmek veya durdurmak için [sabotage_target_crown.GetNameNoTooltip|U]ni çalmaya çalışacaksınız.#!\n\n@warning_icon! #warning Bu plan daha riskli; yakalanma ve başarısız olma ihtimali yüksek.#!"

 coronation.1130.b:0 "[sabotage_target_throne.GetName|U]ni sabote edebilirim."

 coronation.1130.b.tt:0 "#V [sabotage_target_throne.GetNameNoTooltip|U]ni sabote etmeye çalışacaksınız.#!\n\n@warning_icon! #warning Bu plan daha riskli; yakalanma ve başarısız olma ihtimali yüksek"

 coronation.1130.c:0 "Belki de hoşnutsuz bir hak sahibinin bu konuda söyleyecek bir şeyi vardır"

 coronation.1130.c.tt:0 "#V Törene katılan bir hak sahibini, [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip] üzerindeki hakkını ileri sürmeye ikna edeceksiniz#!.\n\n@warning_icon! #warning Başarılı olursa bir [Concept('agot_mega_wars', 'Mega War')|E] tetiklenecek#!"

 coronation.1130.d:0 "Düşmanlık besleyen iki Hanenin ortalığı karıştırmasına yol açabilirim"

 coronation.1130.d.tt:0 "#V Birbirine düşman iki [house_heads|E]ni karşı karşıya getireceksiniz.#!\n\n@warning_icon! #warning Başarılı olursa biri yaralanabilir (veya ölebilir)#!"

 coronation.1130.e:0 "$coronation.1160.c$"

 coronation.1131.desc_intro:0 "Planım için potansiyel müttefikler ararken odayı göze çarpmadan tarıyorum."

 coronation.1131.desc_kingsguard:0 "Bakışlarım, [coronation_target.GetTitleAsNameNoTooltip]den açıkça hoşlanmamasıyla bilinen Kral Muhafızı'nın önde gelen bir üyesi olan [potential_distraction_1.GetTitledFirstName|U]nün üzerinde duruyor. Diğer muhafızlar üzerindeki [potential_distraction_1.GetSheHe|U] otoritesi ve nüfuzu, doğru kullanıldığında güçlü bir dikkat dağıtıcı olabilir."

 coronation.1131.desc_knight:0 "Bakışlarım, [coronation_target.GetTitleAsNameNoTooltip]den açıkça hoşlanmamasıyla bilinen bir şövalye olan [potential_distraction_1.GetTitledFirstName|U]nün üzerinde duruyor. [potential_distraction_1.GetSheHe|U], bir olay çıkararak muhafızların dikkatini çekebilir."

 coronation.1131.desc_master_whisper:0 "\n\nYakınlarda, [coronation_target.GetTitledFirstNamePossessiveNoTooltip|U] Fısıltılar Efendisini, [potential_distraction_2.GetTitledFirstName|U]nü görüyorum. Kurnazlığı ve girift casus ağıyla tanınan [potential_distraction_2.GetHerHis|l] bilgiyi etkileme ve yönlendirme yeteneği, doğru kullanıldığında güçlü bir dikkat dağıtıcı olabilir."

 coronation.1131.desc_schemer:0 "\n\nYakınlarda, planım için bir başka potansiyel müttefik görüyorum: [potential_distraction_2.GetTitledFirstName|U]. [potential_distraction_2.GetHerHis|U] keskin dili ve kaos yaratma merakı, [potential_distraction_2.GetSheHe|l] konuşmayı ya da bir olay çıkarmayı seçerse dikkati kolayca başka yöne çekebilir."

 coronation.1131.desc_end:0 "\n\nSon olarak, hesaplı bir kayıtsızlık havasıyla gevşeyip oturan [potential_distraction_3.GetTitledFirstName|U]nü fark ediyorum. [coronation_target.GetTitleAsNameNoTooltip]e karşı hiçbir sevgi beslemiyor; bu da [potential_distraction_3.GetHerHim|l]i ideal bir aday yapıyor.\n\nBu üç potansiyel dikkat dağıtıcıyı belirledikten sonra, sabotajın yolu şekillenmeye başlıyor."

