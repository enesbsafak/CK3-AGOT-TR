 coronation.2014.c:0 "Hadi ama... bu hiç olmamış gibi davranalım."

 coronation.2015.t:0 "İtiraz Etmek ya da Etmemek"

 coronation.2015.desc:0 "[coronation_target.GetTitledFirstName], orta koridorda [officiant.GetTitledFirstNameNicknamed|U]ye doğru ilerlerken, [coronation_target.GetSheHe|l] tahtın dibine vardığında bunun itiraz edip hakkımın meşruiyetini ilan etme anı olduğunu anlıyorum. Bunu yapmak bir savaş başlatabilir, ancak sessiz kalmak, [coronation_target.GetPrimaryTitle.GetTierAsNameNoTooltip]i yönetmeye asla layık görülmeyeceğim anlamına gelebilir."

