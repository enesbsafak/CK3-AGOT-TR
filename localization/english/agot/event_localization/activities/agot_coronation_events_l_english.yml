 coronation.1140.a:0 "Uppala!"

 coronation.1140.desc_seven_kingdoms:0 "Yedi Krallığın [coronation_target.GetTitleAsNameNoTooltip|U]ı olarak taç giydim. Şimdi, bu unvana layık olduğumu kanıtlayıp Fethedenin tahtına oturmalıyım. Tahta yaklaştıkça tacın ağırlığı zihnimi dolduruyor; basamakları büyük bir özenle çıkıyorum. Sarayın gözleri üzerimde, havada beklenti yoğun. Tam son basamağa ulaştığımda ayağım beklenmedik kaygan bir yerde kayıyor.\n\nToplanan lordların ve leydilerin nefes sesleri salonda yankılanıyor, endişeleri hissedilir derecede. Düşüşümü durduracak bir şey umuduyla uzanıyorum. Göz ucuyla, düşebileceğim yerin yakınında çıkıntı yapan bir bıçak görüyorum."

 coronation.1140.desc_other:0 "Taç giydim ve artık tahtıma oturmalıyım. Tahta yaklaştıkça tacın ağırlığı zihnimi dolduruyor; basamakları büyük bir özenle çıkıyorum. Sarayın gözleri üzerimde, havada beklenti yoğun. Tam son basamağa ulaştığımda ayağım beklenmedik kaygan bir yerde kayıyor.\n\nToplanan lordların ve leydilerin nefes sesleri salonda yankılanıyor, endişeleri hissedilir derecede. Düşüşümü durduracak bir şey umuduyla uzanıyorum."

 coronation.1141.t:0 "Hak Sahibi Seçmek"

 coronation.1141.desc:0 "Bu kutlamaları hızlı — ve vaktinden önce — sona erdirme çabalarımda, [coronation_target.GetPrimaryTitle.GetNameNoTier] için hoşnutsuz bir hak sahibi bulmayı seçtim. Kalabalığı tarayıp tören sırasında davasını sunması için #italic ikna etmem#! gereken kişiyi belirliyorum."

 coronation.1141.a:0 "Yaklaşalım"

 coronation.1141.a.tt:0 "[coronation_claimant.GetTitledFirstName]ye yaklaşıp [coronation_claimant.GetHerHis|l] [claim|E]ni [coronation_target.GetPrimaryTitle.GetNameNoTooltip] üzerinde ileri sürmeye ikna edeceksiniz"

 coronation.1141.b:0 "Bu benim yapacağım iş değil"

