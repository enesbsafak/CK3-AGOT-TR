 coronation.1030.t:0 "[ROOT.Char.Custom('GoodBad')|U] Bir Alamet"

 coronation.1030.desc:0 "Misafirler toplandı, tören başlamak üzere ve her şey yolunda görünüyor; derken gözlerimin önünde sıra dışı bir şey oluyor.\n\n"

 coronation.1030.desc_good1:0 "Görünüşte kaybolmuş bir yaban ördeği, misafirlerin arasında kararlı adımlarla henüz farkına varmamış olan [coronation_target.GetTitledFirstName]ye doğru sallana sallana ilerliyor. Kuş, [coronation_target.GetHerHim]e ulaştığında sağır edici bir #EMP VAAK VAAK!!#! sesi çıkarıp dönüyor ve [coronation_target.GetFirstNamePossessiveNoTooltip] şaşkınlığı ile kalabalığın eğlencesi arasında oradan uzaklaşıyor."

 coronation.1030.desc_good2:0 "[coronation_target.GetTitledFirstName|U] salona doğru ilerlerken tökezleyip düşmek üzere çırpınıyor! Endişeli bir hizmetkâr yaklaştığında, [coronation_target.GetSheHe] yalnızca gülümseyip suçluyu yerden alıyor: bir at nalı!"

 coronation.1030.desc_good3:0 "[coronation_target.GetTitledFirstName] göründüğünde solumuzdaki bir kuş sürüsü aniden havalanıp doğrudan [coronation_target.GetHerHis] başının üzerinden sağına doğru uçuyor!"

 coronation.1030.desc_bad1:0 "Bir hizmetkâr mutfağa giderken tökezleyip koca bir tuzluğu yere döküyor!"

 coronation.1030.desc_bad2:0 "[coronation_target.GetTitledFirstName]nün boynundaki nazarlık çözülüp yere düşüyor ve telaşlı hizmetkarlar tarafından dikkatsizce eziliyor!"

 coronation.1030.desc_bad3:0 "Görünüşe göre hiçbir yerden fırtına bulutları toplanıp tam mekânın üzerinde birleşiyor. Güzel, güneşli bir gökyüzü hızla karanlık ve tehditkâr bir hâle bürünüyor; başlamak üzere olan törenin üzerine uğursuz bir gölge düşürüyor."

 coronation.1030.desc_outro:0 "\n\nTüm bu sahneyi benim gibi gören [1030_chatter.GetTitledFirstName] gözüme takılıp yorum yapıyor:"

 coronation.1030.desc_good:0 ""That was... surprising, wasn't it?""

 coronation.1030.desc_bad:0 ""That was... really bad, wasn't it?""

 coronation.1030.a:0 "Ne uğurlu bir işaret!"

 coronation.1030.b:0 "Hiçbir #EMP ŞEY#! ifade etmiyor."

 coronation.1030.c:0 "Ne kadar uğursuz bir işaret! MAHVOLDUK!"

 coronation.1030.d:0 "Harika! Tam bir [ROOT.Dynasty.GetName] taç giyme töreni!"

 coronation.1150.t:0 "Romantik Gözlem"

 coronation.1150.desc:0 "Taç giyme törenleri genellikle uzun ve sıkıcıdır; gözlerim sürekli misafir kalabalığını arzularımın hedefi için tarıyor: [intent_target.GetTitledFirstName]."

 coronation.1150.desc_1:0 "\n\n[intent_target.GetHerHim]i nihayet bulduğumda, [intent_target.GetSheHe] kalabalıktan biraz uzakta, yüzünde keyifli bir gülümsemeyle mekânın süslemelerinden çiçekleri kokluyor."

 coronation.1150.desc_2:0 "\n\n[intent_target.GetHerHim]i nihayet bulduğumda, [intent_target.GetSheHe] dolu tabaklar ve [host.Custom('RegionalDrink')] fıçılarıyla telaşla koşuşturan hizmetkarlara büyük bir dikkatle bakıyor."

 coronation.1150.desc_3:0 "\n\n[intent_target.GetHerHim]i nihayet bulduğumda, [intent_target.GetSheHe] küçük bir misafir grubuyla düğünlerin anlamsızlığı hakkında dedikodu yapıyor."

 coronation.1150.desc_4:0 "\n\n[intent_target.GetHerHim]i nihayet bulduğumda, [intent_target.GetSheHe] bazı misafirlere evliliğin kutsallığı üzerine vaaz veriyor."

 coronation.1150.desc_fallback:0 "\n\n[intent_target.GetHerHim]i nihayet bulduğumda, [intent_target.GetSheHe] küçük bir misafir grubuyla kaynaşmakla meşgul."

 coronation.1150.desc_conclusion:0 "[intent_target.GetHerHim]e yaklaşmak için mükemmel bir fırsat."

 coronation.1150.a:0 "Bu şartlar biraz #EMP şiir#! gerektiriyor!!"

 coronation.1150.b:0 "Düğünlerin beni ne #EMP moduna#! soktuğunu biliyor musun?"

 coronation.1150.c:0 "Bana bundan biraz daha bahseder misin?"

 coronation.1150.a.success:0 "[intent_target.GetFirstNameNoTooltip] ilgilendi"

 coronation.1150.a.success.tt:0 "[intent_target.GetFirstNameNoTooltip] üzerinde iyi bir izlenim bıraktınız"

 coronation.1150.a.failure:0 "[intent_target.GetFirstNameNoTooltip] rahatsız oldu"

 coronation.1150.a.failure.tt:0 "[intent_target.GetFirstNameNoTooltip]yi rahatsız ettiniz"

 coronation.1160.t:0 "Davetsiz Misafirler"

 coronation.1160.desc:0 "Taç giyme törenleri halk için her zaman büyük bir gösteridir; halk, hükümdarlarının bir an olsun görüntüsüne erişmek ve zenginliklerinden tatmak umuduyla toplanır.\n\nÖzellikle, görünüşü son derece yorgun bir grup köylünün, büyük ziyafet için süren hazırlıkları büyük bir dikkatle izlediğini fark etmemek elde değil..."

 coronation.1160.a:0 "İçeri alabilirim!"

 coronation.1160.a.tt:0 "Bu işe renk katacak!"

 coronation.1160.b:0 "Onlara gizlice biraz yiyecek kaçırabilirim!"

 coronation.1160.b.tt:0 "[host.GetFirstNameNoTooltip] asla fark etmeyecek!"

 coronation.1160.c:0 "Bu benim yapabileceğim iş değil."

 coronation.1161.desc:0 "Bir süredir etkinliği çevreleyen büyüyen halk kalabalığını fark ediyorum.\n\nBeklemediğim şey, küçük bir gruplarının mutfaklara saldırıp ellerinden geldiğince çok [ROOT.Char.Custom('RegionalDrink')] ve [ROOT.Char.Custom('GetExpensiveMeal')] içmeye ve mideye indirmeye çalışmaları oldu!\n\n#EMP İçeri nasıl girdiler?!#!"

 coronation.1161.a:0 "Kovun onları!"

 coronation.1161.b:0 "Herkes neşemizi paylaşsın!"

 coronation.1161.success:0 "Köylüler dışarı kovuldu"

 coronation.1161.success.tt:0 "Düzeni yeniden sağladınız"

 coronation.1161.success.tt2:0 "[host.GetFirstName] köylüleri dışarı kovdu."

 coronation.1161.failure:0 "Kalabalığı kontrol edemiyorsunuz"

 coronation.1161.failure.tt:0 "Davetsiz misafirler ortalığı kasıp kavurmaya devam ediyor"

 coronation.1161.failure.tt2:0 "[host.GetFirstName], davetsiz misafirlerle başa çıkamadı."

 coronation.1161.b.tt:0 "[host.GetFirstName], köylülerin kalmasına izin verdi."

 coronation.1190.t:0 "Dini Şikâyetler"

 coronation.1190.desc:0 "Herkes mekânın ihtişamı karşısında heyecanlı ve hayran. [grumbler.GetTitledFirstName] dışında herkes.\n\n[grumbler.GetHerHis] gelişinden bu yana [grumbler.GetFirstNameNoTooltip], şikâyet edecek bir bahane arayarak ortalıkta dolaşıp duruyor. "All these grandiose displays are #EMP sinful#!!" "Is there nothing #EMP holy#! you have to wear?" "Is this all a show of luxury and vanity?""

 coronation.1190.a:0 "Kendimden utanıyorum..."

 coronation.1190.b:0 "Muhafızlar, bu keyif kaçıranı kapıya kadar eşlik edin."

 coronation.1190.c:0 "Hiçbir şey duymamış gibi davranacağım."

 coronation.1190.d:0 "Evet, ve ben de keyfini çıkaracağım!"

 coronation.1190.e:0 "Evet, #italic siz#! #italic benim#! af dileyeceksiniz!"

 coronation.1210.t:0 "Siyasi Sohbet"

 coronation.1210.desc:0 "Tören devam ederken sonunda kendimi [talk_to.GetTitledFirstName]nün yanına atmayı ve [talk_to.GetHerHim]le kısa bir sohbete girmeyi başarıyorum; sohbet hızla daha ilginç bir alana kayıyor: siyaset.\n\n[talk_to.GetHerHim]i tam da istediğim noktaya getirene dek birkaç rahat söz paylaşıyoruz."

 coronation.1210.desc_gold:0 "\n\n"It pains me to admit it, but my coffers are empty!""

 coronation.1210.desc_fear:0 "\n\n"I live in constant fear for my [talk_to.GetPrimaryTitle.GetTierAsNameNoTooltip], and myself...""

 coronation.1210.desc_raids:0 "\n\n"I am greatly concerned by the recent raids in my lands...""

 coronation.1210.desc_rivals:0 "\n\n"I can't sleep at night, I see my enemies in every shadow!""

 coronation.1210.desc_age:0 "\n\n"It pains me to admit it, but I'm not getting any younger!""

 coronation.1210.desc_bad_harvest:0 "\n\n"Sadly, we've had some bad harvests that set our growth back recently...""

 coronation.1210.desc_rain:0 "\n\n"Unexpected rains have been plaguing my people and damaging the harvest...""

 coronation.1210.desc_enemies:0 "\n\n"You can never feel too safe. Your enemies are always getting stronger around you.""

 coronation.1210.a:0 "Birisi bundan faydalanırsa yazık olur, değil mi?"

 coronation.1210.a.success:0 "[talk_to.GetFirstNameNoTooltip] gözünü korkuttu"

 coronation.1210.a.failure:0 "[talk_to.GetFirstNameNoTooltip] gözünü korkutmadı"

 coronation.1210.b:0 "Zor zamanlarda güçlü müttefiklere sahip olmak iyidir!"

 coronation.1210.b.success:0 "[talk_to.GetFirstNameNoTooltip] etkilendi"

 coronation.1210.b.failure:0 "[talk_to.GetFirstNameNoTooltip] size güvenmiyor"

 coronation.1210.c:0 "Bir koruyucu edinmeyi düşündünüz mü?"

 coronation.1210.c.success:0 "[talk_to.GetFirstNameNoTooltip] ikna oldu"

 coronation.1210.c.failure:0 "[talk_to.GetFirstNameNoTooltip] şüphelendi"

