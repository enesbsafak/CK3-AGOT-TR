 coronation.2011.t:0 "[potential_supporter.GetPrimaryTitle.GetNameNoTierNoTooltip] Vassalları"

 coronation.2011.desc:0 "[barony.GetNameNoTierNoTooltip]nün loş bir salonunda, toplanan vassallarımın önünde duruyorum. "My lords and ladies," I begin, my voice firm and resolute, "we face a pivotal moment for the future of the realm. A new claimant has emerged, one who promises a better path for all our houses." I scan the faces before me, seeing a mix of curiosity and skepticism. "Supporting this claimant, [coronation_claimant.GetTitledFirstName], will ensure our prosperity and stability."\n\nJust as I finish, [vassal_objector.GetTitledFirstName] steps forward, [vassal_objector.GetHerHis|l] brow furrowed with concern. "My [potential_supporter.GetLadyLord|l]," [vassal_objector.GetSheHe|l] begins, [vassal_objector.GetHerHis|l] voice steady but edged with doubt. "We have all taken oaths to serve [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip]. How can we be certain this claimant's promises are genuine? What assurance do we have that we won't be trading one set of problems for another? How can we be sure we will win a war against [coronation_target.GetTitledFirstName]?"

 coronation.2011.a:0 "Elbette hepiniz bunun [potential_supporter.GetPrimaryTitle.GetNameNoTierNoTooltip]e fayda sağlayabileceğini görüyorsunuz."

 coronation.2011.b:0 "Efendiniz olarak size koruma sağlayacağım."

