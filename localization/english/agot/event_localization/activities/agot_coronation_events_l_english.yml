 coronation.1132.t:0 "Sabotaj Önlendi"

 coronation.1132.desc_1:0 "Taç giyme töreni hazırlıkları sürerken büyük salon telaşla uğulduyor. Bu koşuşturma sırasında [tattle_tale.GetTitledFirstName|U] kararlı adımlarla bana doğru geliyor; [tattle_tale.GetHerHis|l] ifadesi ciddi. [tattle_tale.GetSheHe|U] önümde diz çöküyor. "Your Grace," [tattle_tale.GetTitledFirstNameNoTooltip|U] begins, [tattle_tale.GetHerHis|l] voice low but urgent. "I bring troubling news. There is a plot to sabotage your coronation."\n\n"Who is behind this treachery?" I demand. "[saboteur.GetTitledFirstName|U]," [tattle_tale.GetTitledFirstNameNoTooltip|U] replies. "[saboteur.GetSheHe|U] was caught attempting to disrupt the proceedings.""

 coronation.1132.a:0 "[saboteur.GetHerHim|l] dışarı atın!"

 coronation.1132.a.tt:0 "[saboteur.GetTitledFirstNameNoTooltip|U] evine dönüyor"

 coronation.1132.b:0 "[saboteur.GetTitledFirstNameNoTooltip|U]nün bir hücrede ne hâle geleceğini görelim"

 coronation.1132.b.tt:0 "[saboteur.GetTitledFirstNameNoTooltip|U]nü Kara Hücre'ye atacaksınız"

 coronation.1132.c:0 "Kimseye zarar gelmedi; geçmiş olsun, bu konu kapansın"

 coronation.1132.c.tt:0 "[saboteur.GetTitledFirstNameNoTooltip|U]nün misafir olarak kalmasına izin veriyorsunuz, ancak [saboteur.GetSheHe|l] daha fazla soruna yol açabilir"

 coronation.1134.t:0 "Kaybolan Taç"

 coronation.1134.desc:0 "[sabotage_target_crown.GetName|U]nün bulunduğu odaya yaklaştığımda, kapıda dikilmiş, duruşu sert ve tetikte olan [kingsguard.GetName|U]nü görüyorum. Planımın ağırlığı zihnimi bastırıyor. Suç ortağım [distraction.GetName|U]ye anlayışla başını sallayarak göze çarpmadan işaret veriyorum.\n\n[distraction.GetFirstNameNoTooltip|U]nün yanına yaklaşırken sesimi fısıltıya düşürüyorum. "We need to create a diversion," I say, glancing at [kingsguard.GetFirstNameNoTooltip|U]. "You need to engage [kingsguard.GetHerHim|l] in conversation, draw [kingsguard.GetHerHis|l] attention away from the door. Make it convincing."\n\n[distraction.GetFirstNameNoTooltip|U] gives a slight nod, preparing to execute the distraction."

 coronation.1134.a:0 ""[distraction.GetFirstNameNoTooltip], pick a fight with [kingsguard.GetFirstNameNoTooltip]...""

 coronation.1134.b:0 ""[distraction.GetFirstNameNoTooltip], use your wits to outsmart [kingsguard.GetFirstNameNoTooltip]...""

 coronation.1134.c:0 ""[distraction.GetFirstNameNoTooltip], charm [kingsguard.GetFirstNameNoTooltip]...""

 coronation.1134.d:0 ""[distraction.GetFirstNameNoTooltip], pretend to stand guard and relieve [kingsguard.GetFirstNameNoTooltip]""

 coronation.1134.d.tt.success:0 "[kingsguard.GetFirstNameNoTooltip] mevzisini terk ediyor"

 coronation.1134.d.tt.failure:0 "[kingsguard.GetFirstNameNoTooltip] mevzisini terk etmeyi reddediyor"

