 coronation.1138.desc:0 "Taht salonuna gitmeye hazırlanırken [coronation_officiant.GetTitledFirstName|U] beni bitişikteki bir odaya çekiyor. [coronation_officiant.GetSheHe|l] gözlerimden kaçınırken [coronation_officiant.GetHerHis|U] yüzünde temkinli bir ifade var.\n\n"Your Grace," [coronation_officiant.GetSheHe|l] finally says. "I have failed you. It appears your crown has been taken and I was unable to recover it. However, this need not interrupt the ceremony, we will just forego that... formality.""

 coronation.1138.a:0 ""You idiot! Someone else will have the honor of anointing me""

