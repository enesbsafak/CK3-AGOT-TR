 coronation.2014.t:0 "İtiraz Eden"

 coronation.2014.desc:0 "[officiant.GetTitledFirstNameNicknamed|U] beni kutsamaya başlayacağı sırada, toplanan kalabalığın arasından bir ses havayı delip geçiyor. "STOP! Enough of this farce! [coronation_target.GetFirstNameNoTooltip] is no true [coronation_target.GetTitleAsNameNoTooltip]... but #italic I am!#!" I turn to see my [coronation_target.Custom2('RelationToMe', SCOPE.sC('coronation_claimant'))], [coronation_claimant.GetFirstName], risen to his feet.\n\nThe tension in the room is palpable as all slowly turn to me with baited breath."

 coronation.2014.a:0 "MUHAFIZLAR! Şu [coronation_claimant.Custom('InsultNoun')]yi dışarı atın!"

 coronation.2014.a.tt:0 "[coronation_claimant.GetTitledFirstName]yi törenden dışarı atıyorsunuz"

 coronation.2014.b:0 "Biri şu [coronation_claimant.Custom('InsultNoun')]yi tutuklasın!"

