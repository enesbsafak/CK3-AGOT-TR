 coronation.1141.flavor:0 "@warning_icon! #warning [coronation_claimant.GetTitledFirstNamePossessive] [claim|E]ni desteklemeniz beklenecek#!"

 coronation.1142.t:0 "[coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip] Hak Sahibi"

 coronation.1142.desc:0 "Tören başlamadan önce, kalabalığın kenarında duran [coronation_claimant.GetTitledFirstName]nün yanına soylu topluluğunun arasından ilerliyorum. [coronation_claimant.GetHerHis|U] bakışları törene kilitlenmiş; [coronation_claimant.GetHerHis|l] gözlerinde kabulleniş ve düşünce karışımı var. "Quite the spectacle, isn't it?" I begin in a tone casual. \n\n"Indeed," [coronation_claimant.GetSheHe|l] replies curtly.\n\nI lean in slightly, lowering my voice just enough. "You know, #italic many#! here believe you possess the qualities of a true leader. Some even whisper that the realm would prosper under your rule."\n\n[coronation_claimant.GetFirstNamePossessiveNoTooltip] eyes flicker with a spark of interest. "Do they?" [coronation_claimant.GetSheHe|l] asks."

 coronation.1142.a:0 "Gerçekten de öyle!"

 coronation.1142.b:0 "Aslında yalan söyledim. Söylediklerimi unut."

 coronation.1142.b.tt:0 "[coronation_claimant.GetFirstNameNoTooltip]yi [coronation_claimant.GetHerHis|l] [claim|E]ni ileri sürmeye ikna etme girişimlerinizden vazgeçiyorsunuz"

 coronation.1143.t:0 "[coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip] Üzerindeki Hakkım"

 coronation.1143.desc:0 "Taç giyme töreni devam ederken kalabalığın kenarında duruyor, bakışlarım önümdeki görkemli gösteriye kilitlenmiş. Anın ağırlığı zihnimi bastırıyor; içimde kabulleniş ve düşünce karışımı var. "Quite the spectacle, isn't it?" a voice says beside me, drawing my attention. I turn to see [saboteur.GetTitledFirstName], offering a casual smile.\n\n"Indeed," I reply curtly.\n\n[saboteur.GetSheHe|U] leans in slightly, [saboteur.GetHerHis|l] voice dropping to a conspiratorial whisper. "You know, #italic many#! here believe you possess the qualities of a true leader. Some even whisper that the realm would prosper under your rule.""

 coronation.1143.a:0 "Hakkımı ileri süreceğim ve siz de beni desteklemelisiniz"

 coronation.1143.a.tt:0 "Törendeki en güçlü lordlarla konuşup onları davana katılmaya ikna edeceksiniz\n\n@warning_icon! #warning Bu seçeneği izlemek kaçınılmaz olarak [coronation_claimant.GetShortUIName] ile [coronation_target.GetShortUIName] arasında bir savaşa yol açacak"

