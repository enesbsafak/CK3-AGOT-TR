 coronation_claimant_renounce_log:0 "[coronation_claimant.GetHerHis|l] efendisine itaat göstergesi olarak [coronation_claimant.GetShortUIName], [coronation_target.GetPrimaryTitle.GetName] üzerindeki tüm haklarından feragat etti."

 coronation.2001.desc:0 "[potential_supporter.GetTitledFirstName]nün yanına yaklaşıyor, [potential_supporter.GetHerHis|l] yanına vardığımda saygıyla eğiliyorum. "My [potential_supporter.GetLadyLord|l], a word about the future of the realm," I murmur, keeping my tone low and measured. [potential_supporter.GetSheHe|U] turns to me, [potential_supporter.GetHerHis|l] expression composed and unreadable. "Of course," [potential_supporter.GetSheHe|l] replies, inclining [potential_supporter.GetHerHis|l] head slightly to indicate that I should continue.\n\n"With the current state of the realm, many feel the need for change," I begin, choosing my words carefully. "A new direction that ensures prosperity and stability for all houses, including yours." [potential_supporter.GetTitledFirstNameNoTooltip] listens intently, [potential_supporter.GetHerHis|l] eyes never leaving mine. [potential_supporter.GetSheHe|U] nods thoughtfully at appropriate moments, acknowledging my points without revealing [potential_supporter.GetHerHis|l] true thoughts. [potential_supporter.GetHerHis|U] calm demeanor gives nothing away, leaving me to wonder if I've made any impact."

 coronation.2001.a:0 "Hakkımı desteklemelisiniz çünkü bunun için"

