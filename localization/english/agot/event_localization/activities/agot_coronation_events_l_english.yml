 coronation.2001.b.tt:0 "Başka birine yaklaşacaksınız"

 coronation.2002.t:0 "Hak Sahibi"

 coronation.2002.desc:0 "[barony.GetNameNoTierNoTooltip]de toplanmış soyluların arasında dururken saygılı bir selamla bana yaklaşan bir figür fark ediyorum. Sakin ve kararlı görünen [coronation_claimant.GetTitledFirstName]. "My [potential_supporter.GetLadyLord|l], a word about the future of the realm," [coronation_claimant.GetSheHe|l] murmurs, [coronation_claimant.GetHerHis|l] voice low and measured. I turn to face [coronation_claimant.GetHerHim|l] fully, maintaining a neutral expression. "Of course," I reply, giving a slight nod to encourage them to continue.\n\n[coronation_claimant.GetSheHe|U] speaks of the realm's current state, hinting at the need for change and a new direction that promises prosperity and stability for all houses, including my own. I listen intently, nodding thoughtfully at intervals to show that I'm engaged, though I make sure my face betrays nothing of my true feelings.\n\nFinally, [coronation_claimant.GetSheHe|l] says, "That is why you should support my claim to [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip].""

