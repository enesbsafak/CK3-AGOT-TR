 coronation.1144.desc:0 "Tüm çabalarıma rağmen [coronation_claimant.GetShortUINameNoFormat] mantığı görmeyi ve [coronation_target.GetPrimaryTitle.GetNameNoTierNoTooltip] üzerindeki hakkını ileri sürmeyi başaramadı. Bu beklenmedik bir aksilik oldu. Günü mahvetmek için mutlaka başka bir yol bulmam gerekecek."

