 coronation.1137.desc:0 "Çalınan tacı ellerimde sıkıca kavramış, [coronation_officiant.GetTitledFirstNamePossessive|U] odasına götürülürken [kingsguard_notifier.GetFirstNamePossessive|U] kolumu amansızca kavrıyor. Tüm gözler bana dönerken oda sessizliğe gömülüyor.\n\n[coronation_officiant.GetTitledFirstNameNoTooltip|U] delici bakışlarıyla öne çıkıyor. "Return the crown," [coronation_officiant.GetSheHe|l] commands, [coronation_officiant.GetHerHis|l] voice steady but urgent.\n\nI hesitate, feeling the weight of the crown in my hands and the tension in the room. Silence stretches between us, thick with anticipation. Finally, I meet [coronation_officiant.GetHerHis|l] eyes with a sly smile. "In exchange for what?"\n\n[coronation_officiant.GetHerHis|U] stunned expression is almost satisfying. [coronation_officiant.GetSheHe|U] looks to [kingsguard_notifier.GetFirstNameNoTooltip|U], clearly at a loss who meets [coronation_officiant.GetHerHis|l] gaze expectantly, waiting for [coronation_officiant.GetHerHim|l] to decide what comes next. Finally, [coronation_officiant.GetSheHe|l] breaks the silence. "What do you want?""

 coronation.1137.a:0 ""Seeing you squirm was enough.""

 coronation.1137.a.tt:0 "[sabotage_target_crown.GetNameNoTooltip|U]nü hiçbir koşul olmadan iade ediyorsunuz"

 coronation.1137.b:0 ""You can have the crown back, for a price...""

 coronation.1137.b.tt:0 "[sabotage_target_crown.GetNameNoTooltip|U]nü [gold|E] karşılığında iade ediyorsunuz"

 coronation.1137.c:0 ""I'll return the crown, but you owe me...""

 coronation.1137.c.tt:0 "[sabotage_target_crown.GetNameNoTooltip|U]nü iade ediyorsunuz ve [coronation_officiant.GetTitledFirstNameNoTooltip|U] size bir [favor|E] borçlu oluyor"

 coronation.1137.d:0 ""I shall keep this""

