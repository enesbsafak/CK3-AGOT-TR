 coronation.1138.b:0 ""I suppose I don't need a crown to be [coronation_target.GetTitleAsNameNoTooltip|U]""

 coronation.1138.b.tt:0 "Törenle devam edeceksiniz"

 coronation.1135.a.carry_on.tt:0 "[coronation_target.GetShortUIName], [coronation_officiant.GetShortUIName]nü tören yöneticisi olarak tuttu"

 coronation.1138.c:0 "Yedeklerimizin olması ne iyi"

 coronation.1138.c.tt:0 "Taç giymek için yeni bir taç seçeceksiniz"

 coronation.1138.d:0 ""We will cancel. Having no crown defeats the point of being #italic crowned#!""

 coronation.1138.d.tt:0 "Taç giyme törenini iptal edeceksiniz"

 coronation.1139.t:0 "[sabotage_target_throne.GetNameNoTooltip]nü Sabote Etmek"

 coronation.1139.desc:0 "Taht salonuna girdiğimde, [sabotage_target_throne.GetNameNoTooltip]nün yakınında konuşlanmış, duruşu sert ve tetikte olan [kingsguard.GetName|U]nü görüyorum. Suç ortağım [distraction.GetName|U]ye anlayışla başını sallayarak göze çarpmadan işaret veriyorum.\n\n[distraction.GetFirstNameNoTooltip|U]nün yanına yaklaşırken sesimi fısıltıya düşürüyorum. "We need to create a diversion," I say, glancing at [kingsguard.GetFirstNameNoTooltip|U]. "You need to engage [kingsguard.GetHerHim|l] in conversation, draw [kingsguard.GetHerHis|l] attention away from the [sabotage_target_throne.GetNameNoTooltip]. Make it convincing."\n\n[distraction.GetFirstNameNoTooltip|U] gives a slight nod, preparing to execute the distraction."

