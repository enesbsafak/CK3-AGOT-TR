 agot_reaving.0001.t:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] Yağması"

 agot_reaving.0001.desc:0 "Uzun gemileri hazırlayıp, kara diyarlıların çocuklarına fısıldayacağı türden bir Büyük Yağma'ya çıkmanın zamanı geldi. Peki samanı hangi tarladan biçeceğiz?"

 agot_reaving.0001.a:0 "İhtilaflı Topraklar yağma için olgun durumda."

 agot_reaving.0001.b:0 "Kuzey Essos bunun bedelini ödeyecek."

 agot_reaving.0001.c:0 "Yaz Denizi toprakları zayıf."

 agot_reaving.0001.d:0 "Köleci Koyu'nda bol ganimet var!"

 agot_reaving.0001.e:0 "Fikrimi değiştirdim. Doğru zaman değil."

 agot_reaving.0010.desc:0 "Davetimi kabul edip de yalnızca [other_host.GetTitledFirstNamePossessive] sarayına gitmeyi tercih etmenin sebebini bilmiyorum, ama bil ki bunu unutmayacağım."

 agot_reaving.0010.a:0 "Talihsizlik."

 agot_reaving.1002.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_reaving.1002.opening_desc:0 "Sizi, [barony.GetNameNoTier]'deki sarayımda düzenlenecek bir ziyafete davet ediyorum!"

 agot_reaving.1002.host_likes_me:0 "Umarım katılırsın, yoksa yokluğun çok aranır."

 agot_reaving.1002.host_gets_along_with_me:0 "Saygın bir [ROOT.Char.GetTitleTierName] olarak, katılımınızla onur duyarım."

 agot_reaving.1002.host_dislikes_me:0 "Adı sanı duyulmuş herkesin orada olmasını bekliyorum, ne yazık ki buna sen de dahilsin."

 agot_reaving.1002.a:0 "Elbette katılacağım."

 agot_reaving.1002.b:0 "Katılacağım. İsteksizce."

 agot_reaving.1002.c:0 "Üzgünüm ama meşgulüm."

 agot_reaving.1002.d:0 "Hayır, reddediyorum!"

 agot_reaving.1003.desc:0 "Sizi, [barony.GetNameNoTier]'deki sarayımda düzenlenecek Büyük Yağma'ya davet ediyorum! Şerefli varlığınıza layık, görkemli bir etkinlik olacak."

 agot_reaving.1003.a:0 "Benim için zevktir."

 agot_reaving.1003.b:0 "İlgilenmem gereken daha önemli işler var."

 agot_reaving.1004.desc:0 "Sizi, [barony.GetNameNoTier]'deki sarayımda düzenlenecek bir agot_reaving'e davet ediyorum! Lezzetli yiyecekler ve eğlencelerle dolu görkemli bir etkinlik olacak."

 agot_reaving.1004.a:0 "Benim için zevktir."

 agot_reaving.1004.b:0 "İlgilenmem gereken daha önemli işler var."

 agot_reaving.1008.t:0 "Büyük Yağma: Yola Çıkış"

 agot_reaving.1008.desc.opening:0 "[ROOT.Char.GetCapitalLocation.GetName] limanını bir direk ve seren çalılığı dolduruyor. Bu sağlam uzun gemi filosu, [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]'in çağrısına uyan sadık ve yürekli Demirdoğanlar tarafından kürek çekiliyor. Dar Deniz'in ötesindeki yeşil toprakları yağmalayarak damarlarındaki tuzu kanıtlama fırsatı için can atıyorlar. \n\n[ROOT.Char.Custom('ReavingDestination')]'e yapılacak Büyük [reaving|E] için hazırlanırken, [ROOT.Char.GetFaith.PantheonTerm]'in yelkenlerimizi dolduracağını ve kılıçlarımıza yön vereceğini biliyorum."

 agot_reaving.1008.desc.short:0 "\n\nBiz kendimizi kana ve şana bularken, diyarın esenliğini haneme emanet ediyorum."

 agot_reaving.1008.desc.medium:0 "\n\nBen [ROOT.Char.GetFaith.HighGodNameAlternate] ile giderken diyarım beklemek zorunda, ne kadar uzak kalırsam kalayım."

 agot_reaving.1008.desc.long:0 "\n\nVaracağım yer evimden çok uzakta ama [ROOT.Char.GetFaith.DivineRealm]'e hizmet uğruna, kendi diyarım bile beklemek zorunda."

 agot_reaving.1008.desc.very_long:0 "\n\nUzun süre yok olacağım ve [ROOT.Char.GetFaith.HighGodNameAlternate]'in diyarımı da gözetmesi için dua etmekten başka çarem yok."

 agot_reaving.1008.a:0 "Demir Bedeli ödeyeceğiz."

 agot_reaving.1009.t:0 "Sıcak Bir Karşılama"

 agot_reaving.1009.likes_host:0 "Tüm konuklar büyük salonda toplandı ve zarif ev sahibimiz [activity.GetOwner.GetTitledFirstName], hepimizi ziyafete hoş geldiniz dedi!"

 agot_reaving.1009.dislikes_host:0 "Tüm konuklar büyük salonda toplandı ve [activity.GetOwner.Custom('InsultAdjective')] ev sahibimiz [activity.GetOwner.GetTitledFirstName], nihayet hepimizi ziyafete hoş geldiniz dedi."

 agot_reaving.1009.a.gluttonous:0 "Buradan mutfağın kokusunu alabiliyorum!"

 agot_reaving.1009.a.drunkard:0 "Fıçılar nerede!"

 agot_reaving.1009.a.gregarious:0 "Herkesle konuşmak için sabırsızlanıyorum!"

 agot_reaving.1009.a.shy:0 "Burada bir sürü insan var..."

 agot_reaving.1009.a:0 "Bunu dört gözle bekliyorum!"

 agot_reaving.1009.b:0 "Umarım vaktime değer."

 agot_reaving.2001.t:0 "Test"

 agot_reaving.2001.desc:0 "İcles"

 agot_reaving.2002.t:0 "Sakat Bir Gemi: Yamyam"

 agot_reaving.2002.desc:0 "Mürettebat ufukta sakat bir yelkenli gemi fark etti. Gemiye yaklaşırken bizi ölüm kokusu karşıladı. Güverteye adım attığımda ne olduğunu anladım ve doğranmış cesetleri gördüm. Çaresiz adamlar çaresiz işler yapar; gemi sakatlanıp erzak azalmaya başlayınca adamlar birbirine düşmüş. Adamlarım ve ben kıyımdan değerli bir şeyler aramaya başlamıştık ki bir çığlık duyduk ve elinde kılıcıyla bize doğru hücum eden açlıktan kudurmuş deli bir adam gördük!"

 agot_reaving.2002.a:0 "Silahlanın!"

 agot_reaving.2002.a.tt:0 "Kılıcını çek ve deliyle kafa kafaya hesaplaş!"

 agot_reaving.2002.b:0 "Bu ne delilik! Gemiye geri dönün!"

 agot_reaving.2002.b.tt:0 "Hiçbir altın buna değmez!"

 agot_reaving.2002.a.success_title:0 "Yamyamı Öldürdük"

 agot_reaving.2002.a.failure_title:0 "Kaçmaya Zorla!"

 agot_reaving.2003.t:0 "Sakat Bir Gemi: Bir Kaptanın Kumarı"

 agot_reaving.2003.desc:0 "Mürettebat ufukta sakat bir yelkenli gemi fark etti. Gemiye yaklaştığımızda bir adamın ve mürettebatının beklediğini gördük. Sakat gemisine binmemizi engellemek için hiçbir hamle yapmadılar; bunun yerine gözlerini ortalarındaki tek adama diktiler. Bunun kaptanları olduğunu hemen anladım. Kaptan yaklaşıp gözlerimin içine baktı: "Demirdoğan olduğunuzu ve bizi kurtarmaya ya da ihtiyacımız olanlar için ticaret yapmaya gelmediğinizi biliyorum. Bunun yerine bir teklif sunuyorum." Kaptan, geminin küpeştesinde büyük bir sandığı dengeleyip onu denize fırlatmakla tehdit eden iki adamı işaret etti. "O sandık gemimizdeki tüm değerli eşyalarımızı tutuyor. Önerim şu: bir zar oyunu oynayalım; siz kazanırsanız sandık sizin, ben kazanırsam fazladan yelkenler ve erzak alırım...""

 agot_reaving.2003.a:0 "Demir Bedeli ödeyeceğim, aramızda bir düello"

 agot_reaving.2003.a.tt:0 "Kaptanla kendin savaş ve Hazine için Demir Bedeli öde!"

 agot_reaving.2003.b:0 "Oyununu oynayacağım..."

 agot_reaving.2003.b.tt:0 "Kaptanla zar atacaksın, kazanan her şeyi alsın!"

 agot_reaving.2003.c:0 "Fırtına Tanrısı tüm insanların düşmanıdır"

 agot_reaving.2003.c.tt:0 "Fırtına Tanrısı tüm insanların düşmanıdır; Boğulmuş Tanrı'nın oğullarının onun girişimlerini boşa çıkarmak görevi değil mi? Fırtına Tanrısı'na inat, onlara gereken erzakı vereceksin!"

 agot_reaving.2003.a.success_title:0 "Kaptanı Öldürdük ve Hazineyi Kazandık!"

 agot_reaving.2003.a.failure_title:0 "Kaptana kaybettin..."

 agot_reaving.2003.b.success_title:0 "Zar Seni Kazanan Yaptı!"

 agot_reaving.2003.b.failure_title:0 "Zar senden yana değildi..."

 agot_reaving.2004.t:0 "Sakat Bir Gemi: Demirdoğan"

 agot_reaving.2004.desc:0 "Mürettebat ufukta sakat bir yelkenli gemi fark etti. Yaklaştığımızda bunun bir Demirdoğan gemisi olduğunu görünce içimiz cız etti! Mürettebat, kardeşlerimize kıyıya ulaşabilmeleri için erzak verip gemilerini yamamalarına yardım etmeyi konuşuyor."

 agot_reaving.2004.a:0 "Erzak katkısında bulunacağım"

 agot_reaving.2004.a.tt:0 "Kardeşlerine yardım etmek için erzaklarının bir kısmını, örneğin kumanyanı ya da ganimetini vereceksin."

 agot_reaving.2004.b:0 "Benden hiçbir şey alamayacaklar"

 agot_reaving.2004.b.tt:0 "Kendi malımı neden vereyim, daha iyi hazırlanmalıydılar!"

 agot_reaving.2005.t:0 "Boş Bir Köy"

 agot_reaving.2005.desc:0 "Gece karanlığının örtüsü altında, küreklerimizi sararak küçük kıyı köyüne ayak bastık. İnişimizin fark edilmediği için sevinmiştik; sonra nedeninin ne olduğu yavaşça içimize işledi. Köy boştu. Değerli eşyaların yerli yerinde bırakıldığı köy manzarası adamlarımdan bazılarını tedirgin etti; diğerleri hiç sorgulamadan yağmaya koyuldu. Köyün kenarında adamlardan biri büyük bir çukur buldu; içinde köylülerin cesetleri vardı, yüzleri hastalıktan buruşmuş."

 agot_reaving.2005.a:0 "Altın, riski fazlasıyla karşılıyor..."

 agot_reaving.2005.a.tt:0 "Ölülerin ona ihtiyacı yok, neden almayalım?."

 agot_reaving.2005.b:0 "Yağmayı durdur ve git."

 agot_reaving.2005.b.tt:0 "Hayatın hiçbir altın miktarına değmez..."

 agot_reaving.2006.t:0 "Köy: Kurban"

 agot_reaving.2006.desc:0 "Gece karanlığının örtüsü altında, küreklerimizi sararak küçük kıyı köyüne ayak bastık. Yaklaşımımız fark edilmedi çünkü köy bir etkinlik kutluyordu. Kahkahalar, şarkılar duyabiliyor ve birkaç odun yığınının yanışından gelen ışığı görebiliyorduk. Biz Demirdoğanlar kutlamanın ortasına daldığımızda odun yığınlarının ne olduğunu gördüm. Üçü, bir zamanlar insan olan kömürleşmiş kalıntılarla alev alev yanıyordu; dördüncüsü yanmamıştı ve bir ağacın gövdesine bağlanmış bir kadın vardı, ayaklarının çevresinde bu ateş tanrısına sunulan çalı çırpı ve değerli adaklarla. Festival katılımcılarının çoğu kaçmaya çalışıyor, bazıları silah kuşanmıştı; çoğunlukla Kızıl Cübbeliler. Kızıl Cübbelilerden biri bir silah kapıp yakılması gereken kadını koruyor gibi görünüyor..."

 agot_reaving.2006.a:0 "Bulabildiğim değerli eşyaları toplayacağım!"

 agot_reaving.2006.a.tt:0 "Kadını umursamıyorum, altını!"

 agot_reaving.2006.b:0 "Kadını özgür bırakacağım!"

 agot_reaving.2006.b.tt:0 "Kadını özgür bırakıp onu tuz karım olarak alacağım!"

 agot_reaving.2006.a.success_title:0 "Kızıl rahibi öldürdük ve altın için Demir Bedel ödedik!"

 agot_reaving.2006.a.failure_title:0 "Kızıl rahip seni kaçmaya zorladı..."

 agot_reaving.2006.b.success_title:0 "Kızıl rahibi öldürdük ve kadın için Demir Bedel ödedik!"

 agot_reaving.2006.b.failure_title:0 "Kızıl rahip seni kaçmaya zorladı..."

 agot_reaving.2007.t:0 "Dev Deniz Canavarı: Saldırı"

 agot_reaving.2007.desc:0 "Adamlar, son birkaç gündür bizi takip eden büyük bir balina fark etti. Canavar mesafesini koruyor ama adamlar, yüzeye çıktığında üzerinde yara izleri görebildiklerini söylüyor. Acaba balina İbbenyalı gemilerinin saldırılarından sağ çıkmış mı? Bu düşünce aklımda uzun süre kalmadı; canavar saldırmaya karar verdi. Adamlarım ve ben, gemimizi batırmadan önce canavarı yere sermek ya da kaçırmak için koşturup silahlanıyoruz!"

 agot_reaving.2007.a:0 "Kahretsin şu İbbenyalı balina avcılarını!"

 agot_reaving.2007.a.tt:0 "Canavar artık av olmadığına karar verdi ve geminizi bir İbbenyalı balina avcısı sanarak saldırıya geçti!"

 agot_reaving.2008.t:0 "Takip: İbbenyalı"

 agot_reaving.2008.desc:0 "Gemiyi görmeden önce kokusunu aldık. Önümüzde bir İbbenyalı balina avcısı gemisi vardı; adamlar takip edip etmeme konusunda ikiye bölünmüştü. Bazıları yağmalamaya değmeyeceğini düşünüyordu, bazılarıysa sıkılmış ya da kavga arzuluyor gibiydi; sonuçta böyle bir gemiyi yakalamak kolay olurdu. Adamlar nasıl davranmamız gerektiğine karar vermem için bana bakıyor."

 agot_reaving.2008.a:0 "Mevzilerinize! Onu yakalayacağız!"

 agot_reaving.2008.a.tt:0 "Altın altındır ve biz Demir Bedeli öderiz!"

 agot_reaving.2008.b:0 "Bu kokuya değmez..."

 agot_reaving.2008.b.tt:0 "Böyle bir koku sana ve mürettebatına bir süre yapışıp kalır..."

 agot_reaving.2009.t:0 "Rüzgârsız Bir Gün"

 agot_reaving.2009.desc:0 "Bugün yelkenlerimizden rüzgâr kesildi; bizi neredeyse akıntıya terk edilmiş bıraktı. Adamlar geminin güvertesinde dolaşıp durgun suların tekdüzeliğiyle savaşmanın yollarını arıyor; bazıları "Parmak Dansı" oynamaya koyuldu, diğerleri zarlara bahis yatırmaya başladı."

 agot_reaving.2009.a:0 "Herkes küreğe! Fırtına Tanrısı bizi yağmadan alıkoyamaz"

 agot_reaving.2009.a.tt:0 "Rüzgâr hızınızı çalamayacak! Yağmalanacak kıyılar ve ganimetler var..."

 agot_reaving.2009.b:0 "Parmak Dansı'nı herkes kadar iyi oynarım"

 agot_reaving.2009.b.tt:0 "Demir Adaları'nda sevilen ama tehlikeli olan bir balta fırlatma oyunu."

 agot_reaving.2009.c:0 "Belki zarlarda şansım olur"

 agot_reaving.2009.c.tt:0 "Kumar oyununda altınını riske at!"

 agot_reaving.2009.a.success_title:0 "Parmak Dansı'nda kazandın!"

 agot_reaving.2009.a.failure_title:0 "Balta ellerinden kayıp gitti..."

 agot_reaving.2009.b.success_title:0 "Zar senden yanaydı!"

 agot_reaving.2009.b.failure_title:0 "Zarlar iyi davranmadı..."

 agot_reaving.2010.t:0 "Takip: Pentoslu Gemi"

 agot_reaving.2010.desc:0 "Adamlar bir Pentoslu gemi gördü. Rüzgârlar bizden yana ve gemi dolu bir yükle ağır aksak ilerliyor gibi görünüyor. Geminin yükünde bulunacak, Pentos'un meşhur peynirlerini ve Soluk Kehribar Şarabı'nı düşününce ağzım sulanıyor."

 agot_reaving.2010.a:0 "Mevzilerinize! Onu yakalayacağız!"

 agot_reaving.2010.a.tt:0 "Gemiyi kovalamaya başlayın! Sonuçta siz Denizin Kurtlarısınız!"

 agot_reaving.2010.b:0 "Zamanımıza değmez"

 agot_reaving.2010.b.tt:0 "Daha iyi avlar var oralarda..."

 agot_reaving.2010.a.success_title:0 "Gemiyi Yakaladın!"

 agot_reaving.2010.a.failure_title:0 "Gemi kaçtı..."

 agot_reaving.2011.t:0 "Takip: Lys Gemisi"

 agot_reaving.2011.desc:0 "Ufukta bir Lys gemisi görüldü. Böyle bir gemi değerli eşyalar ve belki de anavatanındaki yastık evleri için ayrılmış köleler taşıyor olabilir. Adamlar, takip edip etmeyeceğimiz konusunda karar için bana bakıyor."

 agot_reaving.2011.a:0 "Bir tuz karısı edinmeye niyetliyim!"

 agot_reaving.2011.a.tt:0 "Gemiyi kovalamaya başlayın! Sonuçta siz Denizin Kurtlarısınız!"

 agot_reaving.2011.b:0 "Mevzilerinize! Onu yakalayacağız!"

 agot_reaving.2011.b.tt:0 "Gemiyi kovalamaya başlayın! Sonuçta siz Denizin Kurtlarısınız!"

 agot_reaving.2011.c:0 "Zamanımıza değmez"

 agot_reaving.2011.c.tt:0 "Daha iyi avlar var oralarda..."

 agot_reaving.2011.a.success_title:0 "Gemiyi yakaladın ve bir tuz karısı edindin!"

 agot_reaving.2011.a.failure_title:0 "Gemi kaçtı..."

 agot_reaving.2011.b.success_title:0 "Gemiyi yakaladın!"

 agot_reaving.2011.b.failure_title:0 "Gemi kaçtı..."

 agot_reaving.2012.t:0 "Tyroşi Savaş Kadırgası"

 agot_reaving.2012.desc:0 "Bir Tyroşi savaş kadırgası görüldü; kuşkusuz ticaret yollarına sorun çıkaran Adımtaşları'ndaki bir korsan beyini temizlemek için yola çıkmış."

 agot_reaving.2012.a:0 "Belki kılıçlarımızı onlara satabiliriz?"

 agot_reaving.2012.a.tt:0 "Tyroşilere paralı asker olarak çalışmayı teklif et; biraz küçümsenirsin ama altın kazanılır!"

 agot_reaving.2012.b:0 "Onlardan kaçınmak en iyisi.."

 agot_reaving.2012.b.tt:0 "Onlarla karşılaşmaktan hayır gelmez..."

 agot_reaving.2012.a.success_title:0 "Paralı Asker Olarak Çalış"

 agot_reaving.2012.a.failure_title:0 "Teklif reddedildi..."

 agot_reaving.2013.t:0 "Küçük Balıkçı Köyü"

 agot_reaving.2013.desc:0 "Küçük bir balıkçı köyünü yağmaladık; karaya çıktığımızda bize hiçbir direniş olmadı. Çoğu kaçmaya ve saklanmaya çalıştı, birkaçı direniş gösterdi ama eğitimli değillerdi ve çabucak yere serildi. Ele geçirilen ganimet azdı."

 agot_reaving.2013.a:0 "Burada ne altını var?"

 agot_reaving.2013.a.tt:0 "Burada değerli bazı şeyler olmalı..."

 agot_reaving.2013.b:0 "O benim tuz karım olacak."

 agot_reaving.2013.b.tt:0 "İyi bir tuz karısı olacak."

 agot_reaving.2013.c:0 "O benim tuz karım olacak."

 agot_reaving.2013.c.tt:0 "İyi bir tuz karısı olacak."

 agot_reaving.2013.d:0 "O benim tuz karım olacak."

 agot_reaving.2013.d.tt:0 "İyi bir tuz karısı olacak."

 agot_reaving.2014.t:0 "Küçük Korsan Yuvası"

 agot_reaving.2014.desc:0 "Adımtaşları'nda küçük bir korsan beyinin yuvasına rastladık. Onlardan daha iyi silahlanmış olsak da, kıyı şeridindeki müstahkem bir mağaraya sığınmışlar. Bir hücum başlatıp savunmaları kırabiliriz ya da belki birkaç adamı gizlice sokup bir yol açabiliriz"

 agot_reaving.2014.a:0 "İçeri savaşarak girmemiz gerekecek!"

 agot_reaving.2014.a.tt:0 "Müstahkem mağaraya karşı bir hücum başlat, silah gücünle içeri girmeye çalışacaksın!"

 agot_reaving.2014.b:0 "Belki de en iyi seçeneğimiz gizlilik..."

 agot_reaving.2014.b.tt:0 "Başka bir giriş yolu olmalı..."

 agot_reaving.2014.a.success_title:0 "Korsan Yuvasına Girdik!!"

 agot_reaving.2014.a.failure_title:0 "İçeri girmeyi başaramadık... Geri döneceğiz!"

 agot_reaving.2014.b.success_title:0 "Bir giriş yolu bulduk!"

 agot_reaving.2014.b.failure_title:0 "Başka bir yol bulamadık.. Geri döneceğiz!"

 agot_reaving.2015.t:0 "Yengeçlere Yem"

 agot_reaving.2015.desc:0 "Yardım yalvarışları dikkatimizi, bölgeye Denizadamı Kralı'nın Mızrakları adını kazandıran, denizden fışkıran taşlık kütleye çekti. Bir adam bu taş mızraklardan birinde mahsur kalmıştı; bulunduğumuz yerden bile yengeçlerin şimdiden üzerine üşüşmeye çalıştığını görebiliyordum. İlk düşüncem bir gemi kazasından kurtulan olduğuydu, ama yol arkadaşlarımdan biri adamın aslında taşa bağlı olduğunu ve ne suç işlediyse korkunç olması gerektiğini belirtti."

 agot_reaving.2015.a:0 "Yol arkadaşım haklı, en iyisi o budalayı bırakmak"

 agot_reaving.2015.a.tt:0 "Birileri bu adama acımasız bir ölüm vermek için emek harcamış; bu şekilde ölmeyi hak eden türden bir adam istemem."

 agot_reaving.2015.b:0 "Adamı kurtaracağım"

 agot_reaving.2015.b.tt:0 "Adamı yengeçlere yem olmaktan kurtaracağım, bana hayatını borçlanacak!"

 agot_reaving.2016.t:0 "Muhtaç Bir Demirdoğan"

 agot_reaving.2016.desc:0 "Bir köyü yağmalarken bir mızrakçı adamlarımızdan birini iyice sıkıştırıyordu ve durum iyi sonuçlanacak gibi görünmüyordu. Mızrakçı, baskı yaptığı Demirdoğan'a tamamen odaklanmış durumda ve bana açık bir boşluk veriyor; hızlı bir öldürmek olurdu."

 agot_reaving.2016.a:0 "Adama saldır"

 agot_reaving.2016.a.tt:0 "Hızlı bir saldırı mızrakçının baskısını kırar ve Demirdoğan arkadaşının toparlanmasına olanak tanır."

 agot_reaving.2017.t:0 "Yağma: [GetTrait('shieldmaiden').GetName(GetNullCharacter)]"

 agot_reaving.2017.desc:0 "Açık denizde son karşılaşmadan bu yana günler geçmişti ki ana güvertede bir kavga patlak veriyor. Gürültüyü kontrol altına aldığınızda, kargaşanın kaynağının çevresinde bir halka oluşmuş.\n\n "[shieldmaiden.GetName] en başından beri bir [shieldmaiden.GetWomanMan] imiş, Kaptan!" Mürettebatından biri, [shieldmaiden.GetWomanMan] biniş baltasını [shieldmaiden.GetHerHim] çevresinde savurup mürettebatı uzakta tutarken hırlıyor. [shieldmaiden.GetSheHe]'in silahına hâkim olduğu açık; bir kaçak yolcudan bekleyeceğiniz becerinin ötesinde.\n\n"[ROOT.Char.GetTitledFirstName]," diyor [shieldmaiden.GetSheHe]. "Tüm hayatım boyunca Demir Bedel'i ödemek için eğitim aldım; yalnızca size hizmet etmek ve Boğulmuş Tanrı'nın lütfunu kazanmak istiyorum. Lütfen bu büyük sefere katılmama izin verin!""

 agot_reaving.2017.a:0 "Bir [GetTrait('shieldmaiden').GetName(GetNullCharacter)], bir sonraki akınımızda iyi bir yol arkadaşı olur!"

 agot_reaving.2017.b:0 "Benim için savaşan bir kadın istemem."

 agot_reaving.2017.c:0 "Boğulmuş Tanrı'ya başka bir şekilde hizmet edebilirsin."

 agot_reaving.2017.d:0 "Belki kamaramda bana katılabilirsin... ve zırhı üzerinde bırakabilirsin."

 agot_reaving.9002.t:0 "Büyük Dönüş"

 agot_reaving.9002.desc:0 ""

 agot_reaving.9002.a:0 "Biz gerçek Demirdoğanız"
