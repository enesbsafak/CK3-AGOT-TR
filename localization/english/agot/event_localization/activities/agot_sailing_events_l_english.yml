 agot_sailing.3936.desc_good:0 "Eski Valyria'ya yolculuk muhteşem bir başarıyla sonuçlandı; yolculuğumuzun sonu açık gökyüzü ve elverişli rüzgârlarla karşılanıyor. Düşlerini gördüğümüz dehşetler yalnızca düştü: rüyalar.\n\nEve dönerken karnımda hafif bir gıdıklanma hissediyorum. #italic Aha! Neredeyse bir gündür bir şey yemedim!#!"

 agot_sailing.3936.desc_bad:0 "Eski Valyria'ya yolculuk muhteşem bir başarıyla sonuçlandı, ama yolculuğumuzun sonu karanlık gökyüzü ve hoş olmayan rüzgârlarla karşılanıyor. Düşlerini gördüğümüz dehşetler rüyadan fazlası olabilir.\n\nEve dönerken [host.GetTitledFirstName] karnında hafif bir gıdıklanmadan yakınıyor. Sonra [host.GetSheHe] bir kemirilme hissinden söz ediyor; sanki [host.GetHerHis] iç organları [host.GetHerHis] bedeninden kaçmaya çalışıyor gibi.\n\n[host.GetHerHis] alnından damlayan teri fark ediyorum ve [host.GetHerHis] kolundaki derinin bir anlığına kıpırdadığına yemin edebilirim. [host.GetSheHe] giysilerini iç çamaşırına kadar soymaya başlarken [host.GetHerHim]'den bir fırın gibi ısı yayıldığını hissedebiliyorum. #italic [host.GetSheHe|U] yanıyor!#!\n\n[host.GetFirstNameNoTooltip] karnını kavrıyor; ama [host.GetSheHe] çığlık atmak için ağzını açtığında ağzından yalnızca duman çıkıyor...\n\nGeri kalanımızı nasıl bir zalim kader bekliyor? Kendi derim ürpermeye başlıyor."

 agot_sailing.3936.desc_bad_two:0 "Eski Valyria'ya yolculuk muhteşem bir başarıyla sonuçlandı, ama yolculuğumuzun sonu karanlık gökyüzü ve hoş olmayan rüzgârlarla karşılanıyor. Düşlerini gördüğümüz dehşetler rüyadan fazlası olabilir.\n\nEve dönerken kaptan kamarasından bir çığlık duyuluyor. İçeri koşuyorum; [host.GetTitledFirstName]'i acı içinde yerde kıvranırken buluyorum. Yaklaştığımda duraklıyorum... Oda nemli ve soğuk olmasına rağmen [host.GetHerHis] bedeninden yayılan ısı kavuran bir fırın gibi. Ve daha da kötüsü! [host.GetHerHis] derisinin altında bir ileri bir geri hareket eden kıvranan kütleler gördüğüme yemin edebilirim.\n\n[host.GetHerHim]'den ürperip uzaklaşıyorum; teselli etmek için çok geç. Ve şimdi benim de iç organlarımda kemirilen bir his var. Bir zamanlar soğuk olan oda şimdi ateş gibi.\n\nGeminin pruvasına fırlıyorum, koşarken giysilerimi çıkarıyorum. [host.GetFirstNamePossessiveNoTooltip] derisinin altında gördüğüm kıvranmalar artık kendi derimde açıkça görülüyor. Ve acı... #EMP Nasıl da yanıyor!#!\n\nKarnımı kavrıyorum, ama çığlık atmak için ağzımı açtığımda ağzımdan yalnızca duman çıkıyor..."

 agot_sailing.3936.desc_cancelled:0 "Eski Valyria'ya yolculuk başarısız olsa da, yolculuğumuzun sonu açık gökyüzü ve elverişli rüzgârlarla karşılanıyor. Belki de dehşetlerin hepsi arkamızda.\n\nAma güvertede dolaşırken karnımda hafif bir gıdıklanma hissediyorum... #italic Aha! Neredeyse bir gündür bir şey yemedim!#!"

 agot_sailing.3936.a_good:0 "$agot_sailing.3907.a_good$"

 agot_sailing.3936.a_bad:0 "$agot_sailing.3907.a_bad$"

 agot_sailing.3937.t:0 "$agot_sailing.3903.t$"

 agot_sailing.3937.desc:0 "Rota bizi Dumanlı Deniz'i kaplayan kırık ve buharlı kayalıkların yanından geçirirken güvertede duruyorum. Zihnimde, kadim Valyria'nın harabelerinde gizli olduğundan emin olduğumuz sayısız hazineyi şimdiden görüyorum. Altın, mücevher ve elbette paha biçilemez Valyria çeliği... Yakında hepsi bizim olacak...\n\nYüksek bir #italic çatırtı#! beni gerçeğe döndürüyor; gökyüzü bir anda kül ve ateşle doluyor. Yanan kayalardan oluşan bir yağmur gemiyi sarıyor; alevler hızla yayılmaya başlıyor. Dehşetle izlerken yelkenler tutuşuyor, alevler direkten güverteye sıçrıyor.\n\nPanik ve acı çığlıkları arasında çevremi dayanılmaz bir ısı sarıyor. Düşünmeden aşağıdaki azgın sulara atlıyorum; gözlerimin önünde geminin batışını görüyorum. Enkazdan uzaklaşmak için çılgınca kürek çekiyorum..."

 agot_sailing.3937.a:0 "$agot_sailing.3903.a$"

 agot_sailing.5500.t:0 "Deniz Yaratığı Avı"

 agot_sailing.5500.desc:0 "Aracımız okyanusun geniş açıklığına doğru yol aldıkça [first_mate.GetFirstName] yanıma yaklaşıyor. ""Okyanusun sakinlerine karşı bütün gözler tetikte, kaptan. Biri bir şey gördüğü anda ilk sana haber verilir.""\n\nBaşımı sallıyorum, beklentim yükseliyor. Bugün ne tür bir yaratıkla karşılaşacağız acaba, diye merak ediyorum?"

 agot_sailing.5500.desc.a:0 "Önceki karşılaşmamızı geride bırakarak tayfaya ufukta dikkatli gözcülük etmeye devam etmelerini söylüyorum. Başka bir deniz yaratığı bulacağız, bundan eminim..."

 agot_sailing.5500.a:0 "Aklınızı başınızda toplayın, adamlar!"

 agot_sailing.5500.a.tt:0 "Avlayacak #high bir deniz yaratığı#! arayacaksın"

 agot_sailing.5501.t:0 "Av Görüldü"

 agot_sailing.5501.desc.a:0 "Çağrının duyulması uzun sürmez. "Turtle sighted, captain!"\n\nSwimming lazily next to our vessel, a large green #high sea turtle#! can be seen. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.a:0 "Bu kolay olmalı..."

 agot_sailing.5501.a.tt:0 "#high Deniz kaplumbağasını#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.b:0 "Çağrının duyulması uzun sürmez. "Seal sighted, captain!"\n\nSwimming lazily next to our vessel, a rotund grey #high seal#! can be seen. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.b:0 "Gidip şu foku yakalayın!"

 agot_sailing.5501.b.tt:0 "#high Foku#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.c:0 "Çağrının duyulması uzun sürmez. "Dolphin sighted, captain!"\n\nSwimming excitedly next to our vessel, a slender #high white dolphin#! can be seen. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.c:0 "Yunusu avlayalım."

 agot_sailing.5501.c.tt:0 "#high Beyaz yunusu#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.d:0 "Çağrının duyulması uzun sürmez. "Walrus sighted, captain!"\n\nLounging lazily on a rocky islet near our vessel, a massive #high walrus#! can be seen. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.d:0 "Dişleri iyi bir fiyata satılır!"

 agot_sailing.5501.d.tt:0 "#high Morsu#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.e:0 "Çağrının duyulması uzun sürmez. "Orca sighted, captain!"\n\nSwimming speedily next to our vessel, an imposing #high orca#! can be seen. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.e:0 "Zıpkınımı getirin!"

 agot_sailing.5501.e.tt:0 "#high Orkayı#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.f:0 "Çağrının duyulması uzun sürmez. "Whale at starboard, captain!"\n\nJust then, a massive eruption of water is blown into the air and the whale's large form bursts through the waves. It is a fully grown #high humpback whale#!. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.f:0 "Av zamanı, adamlar!"

 agot_sailing.5501.f.tt:0 "#high Kambur balinayı#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.g:0 "Çağrının duyulması uzun sürmez. "Whale at starboard, captain!"\n\nJust then, a massive eruption of water is blown into the air and the whale's large form bursts through the waves. It is a fully grown #high sperm whale#!. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.g:0 "Bu bir servet değerinde olacak!"

 agot_sailing.5501.g.tt:0 "#high İspermeçet balinasını#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.h:0 "Çağrının duyulması uzun sürmez. "Whale straight ahead, captain!"\n\nJust then, a massive eruption of water is blown into the air and the whale's large form bursts through the waves. It is a massive #high blue whale#!, a true leviathan. "Do we go for it, captain?" [first_mate.GetFirstName] asks."

 agot_sailing.5501.h:0 "Kocaman biri! Yakalayalım!"

 agot_sailing.5501.h.tt:0 "#high Mavi balinayı#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.i:0 "Birkaç saatlik deniz yolculuğunun ardından korku ve dehşet çığlıklarıyla irkiliyorum. "Kraken! Kraken!" the men shout, some already running in fear.\n\nIt seems that our prey has found us instead of us finding it. The water behind our ship churns, soon revealing the scaled head of a fully grown #high kraken#!, tentacles thrashing violently around it.\n\n[first_mate.GetFirstName] runs up to me. "What's it going to be, captain? Do we fight? Or attempt to escape?""

 agot_sailing.5501.i:0 "Kaçmayacağım! Kavgaya hazır olun, adamlar!"

 agot_sailing.5501.i.tt:0 "#high Krakensi#! avlamaya karar veriyorsun"

 agot_sailing.5501.desc.j:0 "Çağrının duyulması uzun sürmez. "Whale at starboard, captain!"\n\nJust then, a massive eruption of water is blown into the air and the whale's large form bursts through the waves. The ship is rocked by a powerful blow, knocking us to our feet. As I struggle to get up, [first_mate.GetFirstName] crawls up to me, face as white as a sheet.\n\n"I—it's the White Dread, captain!" [first_mate.GetSheHe] stammers. I've heard the tales: a white whale of sheer cunning and malice that is said to haunt the waters of the Shivering Sea. It has sunk many ships, and now... it has found us."

 agot_sailing.5501.desc.k:0 "Deniz uzun süre sessiz kalıyor, sanki okyanusun kendisi beklentiyle nefesini tutmuş gibi. Huzursuzum; dümenin yanında bir ileri bir geri yürüyorum. Derken nihayet gözcü bağırıyor: ""Balina görüldü!""\n\nÖne atılıyorum, gözlerim inanamayarak irileşiyor. Bizi buldu. Ak Dehşet hızla yaklaşıyor, dalgaları yara yara doğrudan gemimizle çarpışma rotasında ilerliyor.\n\nZıpkınımı kapmadan önce bir an gözlerimi kapatıyorum. ""Kavgaya hazır olun, adamlar!"" diye bağırıyorum; beyaz balina dalıp vahşi saldırısına başlıyor."

 agot_sailing.5501.reroll:0 "\n\nNe yazık ki gün, yeni av aramaya devam edemeyecek kadar ilerledi; o halde bu idare edecek"

 agot_sailing.5501.j:0 "Bugün, Ak Dehşet son nefesini verecek!"

 agot_sailing.5501.j.tt:0 "#high Ak Dehşet'i#! avlamaya karar veriyorsun"

 agot_sailing.5501.k:0 "Oralarda başka yaratıklar da olmalı."

 agot_sailing.5501.k.tt:0 "Başka yerde av aramak için gemiyi geri döndürüyorsun"

 agot_sailing.5501.l:0 "Buradan çıkmalıyız!"

 sailing.hunt.success:0 "Ganimetini gemiye çekip limana dönmek için rotayı belirliyorsun"

 sailing.hunt.failure.tt:0 "Atışını ıskalıyorsun"

 sailing.hunt.failure:0 "Avın dalıp derinliklerde gözden kayboluyor"

