 agot_sailing.5509.a.success:0 "Mavi balinayı öldürüyorsun"

 agot_sailing.5510.t:0 "Kraken Avı"

 agot_sailing.5510.desc:0 "Korkunç kraken saldırısına başlarken geminin çevresinde kıyamet kopuyor. Denizciler korku içinde çığlık atıyor; bazıları yaratığın gazabından kaçmak için kendini kenara atıyor. Kudretli dokunaçları geminin teknesine çarpıyor; yayılan şok dalgaları tayfamın çoğunu güverteye deviriyor.\n\nOkçular canavarı taciz ederek dikkatini dağıtıp daha da kızdırıyor. Gagalı başı gazap içinde doğruluyor ve şimdi elinde zıpkınla durduğum geminin pruvasına hızla yaklaşıyor. Çarpışmadan önceki son saniyelerde silahın sapındaki kavrayışımı sıkılaştırıyorum. Tek şansım bu olacak ve değerlendirmek zorundayım."

 agot_sailing.5510.a:0 "Sonun geldi, pis yılan!"

 agot_sailing.5510.a.success:0 "Krakensi öldürüyorsun"

 agot_sailing.5510.a.failure:0 "Zıpkının krakenin dokunaçları tarafından kenara savruluyor"

 agot_sailing.5510.b:0 "Boruyu çal!"

 agot_sailing.5510.b_tt:0 "Krakene dikkat dağıtmak umuduyla boruyu çalıyorsun"

 agot_sailing.5511.t:0 "Ak Dehşet Avı"

 agot_sailing.5511.desc:0 "Bir şok dalgası daha gemiyi sarsıyor. Teknesi çatlayan gemi yan yatmaya başlıyor. Çılgınca canavarı görmeye çalışıyorum, ama çok hızlı. Geminin dibine dalıp küt kafasını alttan aracımıza geçiriyor; tayfalar havaya savruluyor. Ak Dehşet geminin önünde dalgaların arasından yükseliyor ve gözlerini benimkilerle kilitliyor.\n\nKurnazlığını fark ediyorum ve omurgamdan aşağı ürperti iniyor. Bu, Westeros denizlerinde rastlanan hiçbir düşmana benzemiyor. Yine de Ak Dehşet, benimle alay etme cüretini göstererek - sadece bir anlığına da olsa - kendini açıkta bıraktı. Canavar zafer kükremesi atıp bir saldırı daha hazırlanırken aceleyle zıpkınımı hazırlıyorum..."

 agot_sailing.5511.desc.a:0 "Zıpkınımın etrafındaki kavrayışımın sıkılaştığını hissediyorum; parmak boğumlarım bembeyaz oluyor. ""Bu sefer #italic kaçamayacaksın#!, canavar,"" diye kendi kendime mırıldanıyorum; tam o sırada bir şok dalgası daha tüm gemiyi sarsıp pek çok tayfayı havaya savuruyor.\n\nAma ayaklarım sağlam basıyor. Bu canavarı öldürüp onun pis varlığına kesin olarak son verme kararlılığıyla doluyum.\n\nGeminin dümenine tam zamanında varıyorum; Ak Dehşet'in karşımda zafer kazanmış gibi doğrulduğunu görüyorum. Gözlerini benimkilerle kilitliyor, beni meydan okuyor. #italic Alay ediyor#!. Kolu kaldırıp nişan alırken içimi öfke kaplıyor..."

 agot_sailing.5511.a:0 "Seni şimdi yakaladım, canavar..."

 agot_sailing.5511.a.success:0 "Ak Dehşet'i öldürüyorsun!"

 agot_sailing.5511.a.failure:0 "Ak Dehşet zıpkınından sıyrılıyor"

 agot_sailing.5512.t:0 "Ak Dehşet'in Laneti"

 agot_sailing.5512.desc:0 "Gemimiz okyanusta aksaya aksaya ilerliyor, hırpalanmış ve zar zor su üstünde. Ak Dehşet, birden yükselen sisin içinde kayboldu.\n\nKendimi konuşamaz halde buluyorum; o azgın balinayla karşılaşmanın şoku hâlâ üzerimde. Delici bakışını hâlâ hissedebiliyorum. Beni izliyor. Beni bekliyor. Bir yerlerde, yol açtığı yıkımın keyfini çıkarıyor. İçimde öfke yükseliyor; çaresiz bir gazap içinde yumruklarımı sıkıyorum.\n\nBu böyle kalamaz!"

 agot_sailing.5512.a:0 "Seni #italic bitireceğim#!, canavar!"

 agot_sailing.5512.b:0 "Hayır, bırakmalıyım... bırakmalıyım..."

 agot_sailing.5512.c:0 "Başarısızlık büyük bir öğretmendir..."

 agot_sailing.5600.t:0 "Yaratık Aramak"

 agot_sailing.5600.desc:0 "Aracımız açık okyanusa doğru yol aldıkça, [host.GetTitledFirstName] ile [first_mate.GetFirstName]'in konuşmalarını kulak misafiri oluyorum. ""Derinliklerin sakinlerine karşı gözcülük ediyoruz, kaptan,"" diye açıklar [first_mate.GetFirstName]. ""Biri bir şey gördüğü anda ilk sen haberdar olursun.""\n\nSakin okyanusa dönüp bugün ne tür bir yaratıkla karşılaşacağımızı merak ediyorum.\n\nBir süre sonra ana direkten bir gürültü duyuyorum - gözcü bir şey görmüş!"

 agot_sailing.5600.a:0 "Av başladı!"

 agot_sailing.5601.t:0 "Başarı!"

 agot_sailing.5601.desc.a:0 """Kaplumbağa görüldü, kaptan!""\n\nGemimizin yanında hevesle yüzen kocaman yeşil bir #high deniz kaplumbağası#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, kaplumbağaya nişan alır ve...\n\n#italic Şak!#! İsabet! Kısa süre sonra kaplumbağanın yeşil leşi güverteye çekilir."

 agot_sailing.5601.desc.b:0 """Fok görüldü, kaptan!""\n\nGemimizin yanında tembel tembel yüzen tombul bir #high boz fok#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, foka nişan alır ve...\n\n#italic Şak!#! İsabet! Kısa süre sonra fokun boz leşi güverteye çekilir."

 agot_sailing.5601.desc.c:0 """Yunus görüldü, kaptan!""\n\nGemimizin yanında heyecanla yüzen ince yapılı #high beyaz bir yunus#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, yunusa nişan alır ve...\n\n#italic Şak!#! İsabet! Kısa süre sonra yunusun bembeyaz leşi güverteye çekilir."

 agot_sailing.5601.desc.d:0 """Mors görüldü, kaptan!""\n\nGemimizin yakınındaki kayalık bir adacıkta tembel tembel uzanmış kocaman bir #high mors#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, morsa nişan alır ve...\n\n#italic Şak!#! İsabet! Kısa süre sonra morsun koca gövdesi güverteye çekilir."

 agot_sailing.5601.desc.e:0 """Orka görüldü, kaptan!""\n\nGemimizin yanında hızla yüzen heybetli bir #high orka#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, orkaya nişan alır ve...\n\n#italic Şak!#! İsabet! Kısa süre sonra orkanın kaslı leşi güverteye çekilir."

 agot_sailing.5601.desc.f:0 """Sancak tarafında balina, kaptan!""\n\nBu çağrı yükselir yükselmez havaya devasa bir su sütunu fışkırır ve balinanın kocaman gövdesi dalgaları yararak su yüzüne çıkar. Tamamen yetişkin bir #high kambur balina#! bu. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, balinaya nişan alır ve...\n\n#italic Şak!#! İsabet! Ama böyle bir yaratığı öldürmeye tek başına yetmez. Diğer tayfalar da mermilerini hazırlar ve kanayan balinaya ek isabetler kaydeder. Uzun bir mücadeleden sonra kambur balinanın devasa leşi nihayet güverteye çekilir."

 agot_sailing.5601.desc.g:0 """Tam ileride balina, kaptan!""\n\nBu çağrı yükselir yükselmez havaya devasa bir su sütunu fışkırır ve bir balinanın kocaman gövdesi dalgaları yararak su yüzüne çıkar. Tamamen yetişkin bir #high kara ispermeçet balinası#! bu. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, balinaya nişan alır ve...\n\n#italic Şak!#! İsabet! Ama böyle bir yaratığı öldürmeye tek başına yetmez. Diğer tayfalar da mermilerini hazırlar ve kanayan balinaya ek isabetler kaydeder. Uzun bir mücadeleden sonra ispermeçet balinasının kudretli leşi nihayet güverteye çekilir."

 agot_sailing.5601.desc.h:0 """Tam ileride balina, kaptan!""\n\nBu çağrıyı duyar duymaz havaya devasa bir su sütunu fışkırır ve balinanın kudretli gövdesi dalgaları yararak su yüzüne çıkar. Devasa bir #high mavi balina#! bu; gerçek bir leviathan. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, balinaya nişan alır ve...\n\n#italic Şak!#! İsabet! Ama böyle bir yaratığı öldürmeye tek başına yetmez. Diğer tayfalar da mermilerini hazırlar ve kanayan balinaya ek isabetler kaydeder. Uzun bir mücadeleden sonra mavi balinanın kocaman leşi nihayet güverteye çekilir."

 agot_sailing.5601.desc.i:0 "Birkaç saatlik deniz yolculuğunun ardından korku ve dehşet çığlıklarıyla irkiliyorum. "Kraken! A kraken has come!" the men shout, some already fleeing in terror.\n\nIt seems our prey has found us instead. The water behind our ship churns violently, soon revealing the scaled head of a truly monstrous #high kraken#!, its slimy beak snapping with a hideous howl.\n\nI see [first_mate.GetFirstName] rush up to [host.GetTitledFirstNameNicknamed]. "What's it going to be, captain? Do we fight, or attempt to escape?"\n\n"I will not run!" [host.GetTitledFirstNameNoTooltip] exclaims. "Prepare yourselves, men!"\n\nThe kraken is a terrifying monster, and many sailors are struck by its tentacled arms and dragged screaming into the depths. Just as I begin to fear the ship might be lost, a harpoon pierces the creature's eye, vanishing completely into the soft bulk of its bulbous flesh. It shrieks — louder than ever before. And then... it goes limp. At last, the beast is slain."

 agot_sailing.5601.desc.i_two:0 "Birkaç saatlik deniz yolculuğunun ardından korku ve dehşet çığlıklarıyla irkiliyorum. "Kraken! A kraken has come!" the men shout, some already fleeing in terror.\n\nIt seems our prey has found us instead. The water behind our ship churns violently, soon revealing the scaled head of a truly monstrous #high kraken#!, its slimy beak snapping with a hideous howl.\n\nI see [first_mate.GetFirstName] rush up to [host.GetTitledFirstNameNicknamed]. "What's it going to be, captain? Do we fight, or attempt to escape?"\n\n"I will not run!" [host.GetTitledFirstNameNoTooltip] exclaims. "Prepare yourselves, men!"\n\nThe kraken is a terrifying monster, and many sailors are struck by its tentacled arms and dragged screaming into the depths. [host.GetTitledFirstNameNoTooltip] blows his krakenhorn, the thunderous call distracting the great beast just long enough for a harpoon to pierce the creature's eye, vanishing completely into the soft bulk of its bulbous flesh. It shrieks — louder than ever before. And then... it goes limp. At last, the beast is slain."

 agot_sailing.5601.desc.j:0 "Av kötü gidiyor. Saatlerdir hiçbir yaratık görünmedi ve sıkılmaya başlıyorum. Tam o sırada arkamdan ürkmüş bir haykırış yükseliyor. "Whale at starboard, captain!"\n\nIn an instant, a massive plume of water erupts into the air and the whale's enormous form bursts through the waves. The ship is rocked by a tremendous blow, knocking us off our feet. As I struggle to rise, [first_mate.GetFirstName] crawls toward me, face as white as a sheet.\n\n"I—it's the White Dread, the... the Terror of the Seas!" [first_mate.GetSheHe] stammers. I've heard the tales: a white whale of terrible cunning and malice said to haunt these waters like a gargantuan ghost. It has sunk many ships, and now... it has found us.\n\n"Make ready to fight!" [host.GetTitledFirstNameNicknamed] shouts, grabbing a harpoon. The ship takes another hit, and I am thrown into a barrel of provisions lashed to the deck. As I regain my footing, I see the White Dread rear up with a deafening howl of pain — somehow, from somewhere, a harpoon has pierced its heart. We have ended a legend today."

 agot_sailing.5601.desc.k:0 "Deniz uzun bir süre sessiz kalıyor, sanki okyanusun kendisi beklentiyle nefesini tutmuş gibi. Dümenin yanında huzursuzca volta atıyorum. Derken nihayet gözcü haykırıyor: ""Balina görüldü!""\n\nÖne atılıyorum, gözlerim inanamayarak irileşiyor. Bizi yine buldu. Ak Dehşet hızla yaklaşıyor, dalgaları yara yara doğrudan gemimizle çarpışma rotasında ilerliyor.\n\nZıpkınlardan birini kapmadan önce bir an gözlerimi kapatıyorum. Bu sefer boş durmayacağım, yemin ederim; beyaz balina dalıp vahşi saldırısına başlıyor.\n\nGemi müthiş bir darbeyle sarsılıyor ve altımda tahtaların çatladığını duyuyorum. Kendimi doğrultmaya zorlarken zıpkının etrafındaki kavrayışımı sıkılaştırıyorum. Kalan gücümü toplayıp silahı Ak Dehşet'e fırlatıyorum; balina bir saldırı daha için doğrulurken zıpkın göğsünü delip geçiyor. Sağır edici bir acı uluyuşu koyuveriyor... ve sonra, çırpına çırpına ölüyor."

 agot_sailing.5601.a:0 "Aferin!"

 agot_sailing.5602.t:0 "Başarısızlık..."

 agot_sailing.5602.desc.a:0 """Kaplumbağa görüldü, kaptan!"" Gemimizin yanında hevesle yüzen kocaman yeşil bir #high deniz kaplumbağası#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, kaplumbağaya nişan alır ve...\n\n#italic Iska!#! Kaplumbağa sessizce suyun altına süzülür ve gözden kaybolur."

 agot_sailing.5602.desc.b:0 """Fok görüldü, kaptan!""\n\nGemimizin yanında tembel tembel yüzen tombul bir #high boz fok#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, foka nişan alır ve...\n\n#italic Iska!#! Fok kırgın bir çığlık atar, dalar ve gözden kaybolur."

 agot_sailing.5602.desc.c:0 """Yunus görüldü, kaptan!""\n\nGemimizin yanında heyecanla yüzen ince yapılı #high beyaz bir yunus#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, yunusa nişan alır ve...\n\n#italic Iska!#! Yunus korku dolu bir çığlık atar, dalar ve gözden kaybolur."

 agot_sailing.5602.desc.d:0 """Mors görüldü, kaptan!""\n\nGemimizin yakınındaki kayalık bir adacıkta tembel tembel uzanmış kocaman bir #high mors#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, morsa nişan alır ve...\n\n#italic Iska!#! Mors öfkeli bir uluyuş koyuverir, dalgaların arasına dalar ve gözden kaybolur."

 agot_sailing.5602.desc.e:0 """Orka görüldü, kaptan!""\n\nGemimizin yanında hızla yüzen heybetli bir #high orka#! görülüyor. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, orkaya nişan alır ve...\n\n#italic Iska!#! Orka şaşkın bir çığlık atar, dalar ve gözden kaybolur."

 agot_sailing.5602.desc.f:0 """Sancak tarafında balina, kaptan!""\n\nBu çağrı yükselir yükselmez havaya devasa bir su sütunu fışkırır ve balinanın kocaman gövdesi dalgaları yararak su yüzüne çıkar. Tamamen yetişkin bir #high kambur balina#! bu. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, balinaya nişan alır ve...\n\n#italic Iska!#! Kambur balina gemiden uzaklaşır, dalar ve gözden kaybolur."

 agot_sailing.5602.desc.g:0 """Tam ileride balina, kaptan!""\n\nBu çağrı yükselir yükselmez havaya devasa bir su sütunu fışkırır ve bir balinanın kocaman gövdesi dalgaları yararak su yüzüne çıkar. Tamamen yetişkin bir #high kara ispermeçet balinası#! bu. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, balinaya nişan alır ve...\n\n#italic Iska!#! İspermeçet balinası kuyruğuyla geminin yanına şak diye vurur ve gemiyi öylesine sarsar ki sendeleyerek zor ayakta dururum. Sonra dalar ve gözden kaybolur."

 agot_sailing.5602.desc.h:0 """Tam ileride balina, kaptan!""\n\nBu çağrıyı duyar duymaz havaya devasa bir su sütunu fışkırır ve balinanın kudretli gövdesi dalgaları yararak su yüzüne çıkar. Devasa bir #high mavi balina#! bu; gerçek bir leviathan. ""Deneyelim mi, kaptan?"" diye sorar [first_mate.GetFirstName].\n\n[host.GetTitledFirstNameNicknamed] bir zıpkın kapar, balinaya nişan alır ve...\n\n#italic Iska!#! Mavi balina şaşırtıcı bir çeviklikle tepki verir. Gemimizden uzaklaşır, dalar ve gözden kaybolur."

 agot_sailing.5602.desc.i:0 "Birkaç saatlik deniz yolculuğunun ardından korku ve dehşet çığlıklarıyla irkiliyorum. "Kraken! A kraken has come!" the men shout, some already fleeing in terror.\n\nIt seems our prey has found us instead. The water behind our ship churns violently, soon revealing the scaled head of a truly monstrous #high kraken#!, its slimy beak snapping with a hideous howl.\n\nI see [first_mate.GetFirstName] rush up to [host.GetTitledFirstNameNicknamed]. "What's it going to be, captain? Do we fight, or attempt to escape?"\n\n"I will not run!" [host.GetFirstName] exclaims. "Prepare yourselves, men!"\n\nThe kraken is a terrifying monster, and many sailors are struck by its tentacled arms and dragged into the depths. Harpoons simply slide off its slimy skin. It will not die! Luckily for us, the kraken finally loses interest and dives, taking a good number of unlucky souls with it and leaving us with nothing to show for it but wounds and a damaged ship."

 agot_sailing.5602.desc.i_two:0 "Birkaç saatlik deniz yolculuğunun ardından korku ve dehşet çığlıklarıyla irkiliyorum. "Kraken! A kraken has come!" the men shout, some already fleeing in terror.\n\nIt seems our prey has found us instead. The water behind our ship churns violently, soon revealing the scaled head of a truly monstrous #high kraken#!, its slimy beak snapping with a hideous howl.\n\nI see [first_mate.GetFirstName] rush up to [host.GetTitledFirstNameNicknamed]. "What's it going to be, captain? Do we fight, or attempt to escape?"\n\n"I will not run!" [host.GetFirstName] exclaims. "Prepare yourselves, men!"\n\nThe kraken is a terrifying monster, and many sailors are struck by its tentacled arms and dragged into the depths. [host.GetTitledFirstNameNoTooltip] blows his krakenhorn, drawing the beast's attention, but wounded and beset from all sides, the monster's will to survive proves too strong to keep it docile more than a moment. Harpoons simply slide off its slimy skin. It will not die! Luckily for us, the kraken finally loses interest and dives, taking a good number of unlucky souls with it and leaving us with nothing to show for it but wounds and a damaged ship."

 agot_sailing.5602.desc.j:0 "Av kötü gidiyor. Saatlerdir hiçbir yaratık görünmedi ve sıkılmaya başlıyorum. Tam o sırada arkamdan ürkmüş bir haykırış yükseliyor. "Whale at starboard, captain!"\n\nIn an instant, a massive plume of water erupts into the air and the whale's enormous form bursts through the waves. The ship is rocked by a tremendous blow, knocking us off our feet. As I struggle to rise, [first_mate.GetFirstName] crawls toward me, face as white as a sheet.\n\n"I—it's the White Dread, the... the Terror of the Seas!" [first_mate.GetSheHe] stammers. I've heard the tales: a white whale of terrible cunning and malice said to haunt these waters like a gargantuan ghost. It has sunk many ships, and now... it has found us.\n\n"Make ready to fight!" [host.GetTitledFirstNameNicknamed] shouts, grabbing a harpoon. The ship takes another hit, and I am thrown into a barrel of provisions lashed to the deck. As I regain my footing, I see the White Dread rear up with a deafening howl of triumph — it has torn our ship nearly to shreds and deems us defeated. As it dives, I feel my heart pounding louder than ever before. This monster will haunt my nightmares, I fear..."

 agot_sailing.5602.desc.k:0 "Deniz uzun bir süre sessiz kalıyor, sanki okyanusun kendisi beklentiyle nefesini tutmuş gibi. Dümenin yanında huzursuzca volta atıyorum. Derken nihayet gözcü haykırıyor: ""Balina görüldü!""\n\nÖne atılıyorum, gözlerim inanamayarak irileşiyor. Bizi yine buldu. Ak Dehşet hızla yaklaşıyor, dalgaları yara yara doğrudan gemimizle çarpışma rotasında ilerliyor.\n\nZıpkınlardan birini kapmadan önce bir an gözlerimi kapatıyorum. Bu sefer boş durmayacağım, yemin ederim; beyaz balina dalıp vahşi saldırısına başlıyor.\n\nGemi müthiş bir darbeyle sarsılıyor ve altımda tahtaların çatladığını duyuyorum. Kendimi doğrultmaya zorlarken zıpkının etrafındaki kavrayışımı sıkılaştırıyorum. Kalan gücümü toplayıp silahı Ak Dehşet'e fırlatıyorum - ama balina atışımı küstahça bir rahatlıkla savuşturuyor! Balina sağır edici bir zafer uluyuşuyla doğruluyor - gemimizi neredeyse lime lime etti ve bizi bir kez daha mağlup sayıyor. Neredeyse alay edercesine havaya koca bir su fışkırtısı püskürtüp yeniden dalgaların altına dalıyor."

 agot_sailing.5602.a:0 "Ve o kadar yaklaşmıştık ki..."

 agot_sailing.5603.t:0 "Ak Dehşet Kaçıyor"

 agot_sailing.5603.desc:0 "Bugün deniz sakin - neredeyse dingin bile. Güvertede durup dalgaların aracımızın teknesine yumuşakça vuruşunu izliyorum. Tam o sırada gözüm suyun karanlık yüzeyinin altında bir hareket yakalıyor. Orada bir şey var - beyaz bir nokta, giderek büyüyor, büyüyor ve-\n\nSağır edici bir çarpışmayla koca bir yaratık gemiyi sarsıyor ve beni yere deviriyor. Yeniden ayağa kalktığımda, alışılmadık derecede beyaz bir balinanın dalgaların arasından doğrulduğunu görüyorum; kızıl gözleri gemimize dikili.\n\n"

 agot_sailing.5603.a:0 "O canavar da #italic neydi#! böyle?"

 agot_sailing.6000.toast:0 "Kuşatma sırasında bir hazine haritası çaldın."

 agot_sailing.6000.toast_desc:0 "Varlıklı bir ticaret gemisinin kaybolduğu [sunken_ship_province.GetName]'i işaret eden bir araştırma koleksiyonu ortaya çıkarıyorsun."

 agot_sailing.6001.t:0 "Enkazı Aramak"

 agot_sailing.6001.desc:0 "Kıyı boyunca yelken açarken haritayı bir kez daha kontrol ediyorum. Geminin bilinen son konumuna yaklaşıyoruz. Okyanus tabanına battığı yer bu civarda olmalı.\n\n[first_mate.GetName]'e seslenip [first_mate.GetHerHim]'e, tayfanın herhangi bir enkaz belirtisine karşı gözcülük etmesini emrediyorum. Ayrıca dalış çanının hazırlanmasını istiyorum. Enkazı bulduğumuzda, en kısa sürede dalmaya hazır olmak istiyorum.\n\nOkyanus tabanında hangi zenginliklerin gizlendiğini merak ediyorum!"

 agot_sailing.6001.a:0 "Bölgeyi ara!"

 agot_sailing.6001.a.success.tt:0 "Enkazın izlerini buluyorsun"

 agot_sailing.6001.a.failure.tt:0 "Gemiden hiçbir iz bulamıyorsun"

 agot_sailing.6002.t:0 "Dalmaya Hazırlık"

 agot_sailing.6002.desc:0 """[host.GetLadyLord]'um!""\n\n[first_mate.GetName], denize dalıp giden benim dikkatimi çekmek için bağırır.\n\nGeminin kenarında duran [first_mate.GetSheHe]'nin yanına gidiyorum; demir aldığımız yerden kısa bir yelken mesafesindeki suya bakıyoruz - ve işte o an görüyorum.\n\nDingin suyun çok altında bir batık yatıyor!"

 agot_sailing.6002.a:0 "Yüzme zamanı!"

 agot_sailing.6002.b:0 "Bu çok tehlikeli."

 agot_sailing.6003.t:0 "Derinliklere Dalmak"

 agot_sailing.6003.desc:0 "Çan aşağı inmeye başlayınca, okyanus tabanına varana dek onu derinliklere doğru takip ediyorum. Dalgaların altında giderek daha derine inerken, çevreme bakıp yönümü bulmaya çalışıyorum.\n\nYağmalamaya geldiğim gemi paramparça halde, kalıntıları deniz tabanına saçılmış.\n\nEnkazın arasında hangi tehlikelerin saklandığını, burada hangi hazinelerin gizli kaldığını bilmiyorum; ama akıl almaz zenginliklerin düşüncesi bile kalbimi hızlandırıyor."

 agot_sailing.6003.a:0 "Bakalım ne bulabileceğim!"

 agot_sailing.6004.t:0 "Beyaz Balina!"

 agot_sailing.6004.desc:0 "Enkaza yaklaşırken suların ne kadar boş olduğunu fark etmemek elde değil. Harabelerin arasında hiçbir yırtıcı sinsice beklemiyor, yakınlarda zar zor bir balık bile yüzüyor.\n\nBu huzursuz sessizliği düşünürken, uzaklardan koca bir canavarın çağrısını duyuyorum.\n\nBeyaz bir balina!\n\nSonunda onu uzakta seçiyorum. Başka hiçbir yaratığın yaklaşmaya cesaret edememesinin nedeni bu olmalı. Canavarın bizzat kendisi bir lütuf!\n\nEnkazı dikkatle arayabilir, geride kalmış hangi hazine varsa alabilirim."

 agot_sailing.6004.a:0 "Şu hazineyi gemiye geri götürelim."

 agot_sailing.6005.t:0 "Köpekbalıkları Yolu Kapatıyor"

 agot_sailing.6005.desc:0 "Enkaza giden yolu bir köpekbalığı sürüsü çevrelemiş. Aralarından zorla geçmeyi deneyebilirim ya da yanlarından sinsice süzülmeye çalışabilirim. Aksi halde, tehlike fazla büyük olursa hazineden vazgeçmem gerekebilir."

 agot_sailing.6005.a:0 "Aralarından zorla geçeceğim!"

 agot_sailing.6005.a.success:0 "Köpekbalıklarını yana itiyorsun"

 agot_sailing.6005.toast.a.success:0 "Köpekbalıklarının arasından zorla geçip hazineye ulaşıyorsun"

 agot_sailing.6005.a.failure:0 "Köpekbalıklarıyla başa çıkılamıyor"

 agot_sailing.6005.toast.a.failure:0 "Köpekbalıkları seni bastırıp kaçmaya zorluyor"

 agot_sailing.6005.b:0 "Yanlarından dikkatlice süzülebilirim."

 agot_sailing.6005.b.success:0 "Köpekbalıklarının yanından süzülerek geçiyorsun"

 agot_sailing.6005.toast.b.success:0 "Köpekbalıklarının yanından süzülüp hazineye ulaşıyorsun"

 agot_sailing.6005.b.failure:0 "Köpekbalıklarının yanından süzülüp geçemiyorsun"

 agot_sailing.6005.toast.b.failure:0 "Köpekbalıkları seni fark edip kaçmaya zorluyor"

 agot_sailing.6005.c:0 "Bu fazlasıyla tehlikeli."

 agot_sailing.6006.t:0 "Bu Karanlık Derinliklerde"

 agot_sailing.6006.desc:0 "Canavarsı görüntüler çoğu zaman uğursuz kehanettir; önümde gelişen sahneyi izlerken sinirlerim geriliyor: Dokunaçlı bir yaratık - elbette efsanevi bir kraken - avıyla boğuşup kıvranıyor... amiral gemimin iki katı büyüklüğünde kocaman bir boz balina.\n\nAma aşağıda yatan hazine artık çok yakın. Önümüzdeki dalış tehlikeli; ama geri dönmeyi gerçekten göze alabilir miyim?"

 agot_sailing.6006.a:0 "Hazine riske değer!"

 agot_sailing.6006.a.success:0 "Hazineyle kaçacaksın"

 agot_sailing.6006.toast.a.success:0 "Hazineyle birlikte gemiye döndün"

 agot_sailing.6006.a.failure:0 "Dev yaratıkların savaşının arasında kalıyorsun"

 agot_sailing.6006.toast.a.failure:0 "Dev yaratıkların mücadelesinde yaralandın"

 agot_sailing.6006.b:0 "Bunun için canını riske atmazsın!"

 death_by_kraken:0 "@death_icon! Kraken tarafından eziliyorsun"

 agot_sailing.6007.t:0 "Boşa Giden Yolculuk"

 agot_sailing.6007.desc:0 "[host.GetTitledFirstName] seferden tek bir hazine bile getiremeden geminin güvenliğine dönüyor. [host.GetSheHe|U] hepimizi buraya kadar sürükledi, elimizde [host.GetHerHis] başarısızlığından başka bir şey kalmadı..."

 agot_sailing.6007.a:0 "Eve dönelim."

 agot_sailing.6010.t:0 "Kaptanın Dönüşü"

 agot_sailing.6010.desc_big:0 "[host.GetTitledFirstName] enkazdan çıkarılan bir sandıkla dönüyor. Yıllarca denizin altında kalmaktan paslanmış ve şişmiş olsa da sandık hızla açılıyor; derinliklere gömüldüğü sanılan koca bir servet gün yüzüne çıkıyor."

 agot_sailing.6010.desc_normal:0 "[host.GetTitledFirstName] enkazdan çıkarılan bir sandıkla dönüyor. Yıllarca denizin altında kalmaktan paslanmış ve şişmiş olsa da sandık hızla açılıyor; derinliklere gömüldüğü sanılan bir servet gün yüzüne çıkıyor."

 agot_sailing.6010.desc_small:0 "[host.GetTitledFirstName] enkazdan çıkarılan bir sandıkla dönüyor. Yıllarca denizin altında kalmaktan paslanmış ve şişmiş olsa da sandık hızla açılıyor; derinliklere gömüldüğü sanılan küçük bir servet gün yüzüne çıkıyor."

 agot_sailing.6010.desc:0 "[host.GetTitledFirstName] hazinesiz dönüyor. Enkazın yakınına ulaşmak fazla tehlikeli çıktı ve seferin yolculuğa gösterebileceği bir kazanç yok."

 agot_sailing.6010.a:0 "Eve dönelim."

 agot_sailing.6012.t:0 "Boşa Giden Yolculuk"

 agot_sailing.6012.desc:0 "Gemiye sağ salim dönüyorum, ama seferin gösterecek bir hazinesi yok. Bütün bu insanları buraya ben getirdim; artık hatırlayacakları tek şey benim başarısızlığım olacak."

 agot_sailing.6012.a:0 "Hadi eve dönelim..."

 agot_sailing.6013.t:0 "Yüzme Zamanı"

 agot_sailing.6013.desc:0 """[host.GetLadyLord]'um!""\n\n[first_mate.GetName], denize bakışlarını dikmiş olan [host.GetTitledFirstNamePossessive] dikkatini çekmek için bağırır.\n\nBen de [first_mate.GetHerHim]'in yanında küpeşteye yaslanıp demir aldığımız yerden kısa bir yelken mesafesindeki suya bakıyorum - ve işte o an görüyorum!\n\nDingin suyun çok altında bir batık yatıyor!"

 agot_sailing.6013.a:0 "O halde [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )] dalışını yapsın..."

 agot_sailing.6014.t:0 "Başarılı Bir Kurtarma"

 agot_sailing.6014.desc:0 "Enkazdan çıkarılan bir sandıkla gemiye dönüyorum. Yıllarca denizin altında kalmaktan paslanmış ve şişmiş olsa da açmayı başarıyoruz; derinliklere gömüldüğü sanılan hazineler gün yüzüne çıkıyor. Sonunda bu lanetli yeri arkamızda bırakabiliriz."

 agot_sailing.6014.vermax_skull:0 "\n\nOkyanus tabanında, [GetScriptedCharacterByHistoryID('dragon_vermax').GetName]'ın kalıntılarını da buldum. [vermax.GetSheHe|U] Ejderhaların Dansı sırasında Yutak'ta düştüğü söyleniyordu. Hazine ararken [vermax.GetHerHis] dinlenme yerini ortaya çıkaracağımızı kim tahmin edebilirdi?"

 agot_sailing.6014.a:0 "Layık bir ganimet!"

 agot_sailing.6014.a_generic_artifact:0 "#V Kazandın#! [generic_artifact.GetNameNoTooltip] [artifact|E]"

 agot_sailing.6014.a_valyrian_steel_sword:0 "#V Kazandın#! [valyrian_steel_sword.GetNameNoTooltip] [artifact|E]"

 agot_sailing.6014.a_spare:0 "#V Kazandın#! bir [spare.GetNameNoTooltip] [artifact|E]"

 found_new_map:0 "Yeni bir hazine haritası buldun"

 agot_sailing.9001.t:0 "Bir Yolculuğun Sonu" #(Mariner trait +1)

 agot_sailing.9001.desc:0 "Uzun yolculuğum, gemim limana geri çekilirken sona eriyor. İçimi bir başarı duygusu kaplıyor; denizci olarak hünerimin bu yolculukla keskinleştiğini biliyorum. İçimde bir yan denizde kalmayı özlese de, şimdi ülkemi yönetme işine dönmeliyim..."

 agot_sailing.9001.a:0 "...yine de yüreğim bir kez daha denizi özlüyor."

 agot_sailing.9002.t:0 "Bir Yolculuğun Sonu" #(Mariner trait +1)

 agot_sailing.9002.desc:0 "Uzun yolculuğum, gemim limana geri çekilirken sona eriyor. Yolculuk umduğum gibi bitmese de, şimdi sayfayı çevirip ülkemi yönetme işine dönmeliyim..."

 agot_sailing.9002.a:0 "...yine de yüreğim bir kez daha denizi özlüyor."

 agot_sailing.9100.t:0 "Korsan Hazırlıkları"

 agot_sailing.9100.desc:0 "Rıhtıma doğru ilerliyorum, tuzlu deniz havasını ciğerlerimin derinliklerine çekiyorum. Beni canlandırıyor; yine de demirde bekleyen gemimi görmek kadar değil. Hem gemi hem rıhtım telaş içinde; tayfam müstehcen şarkılar söyleyerek erzak yüklüyor.\n\nKaptan yardımcısı yaklaştığımı fark edip abartılı bir zarafetle eğiliyor. Güverteye çıkarken gülümseyip başımla karşılık veriyorum. Birinci kaptanım ""Güvertede kaptan!"" diye haykırıyor; tayfadan bir alkış koro halinde yükseliyor. İşe koyulmaya can atıyor, hevesliler.\n\nŞimdi geriye yalnızca görevimize karar vermek kalıyor. Açık sularda bir ödül aramak için mi yelken açacağız, yoksa düşman kıyılara bir akın mı düzenleyeceğiz?"

 agot_sailing.9100.a:0 "Kıyı akınına çıkıyoruz!"

 agot_sailing.9100.b:0 "Açık sularda sinsice dolaşacağız!"

 agot_sailing.9110.t:0 "Hedef Seçmek"

 agot_sailing.9110.desc:0 "Subaylarım toplantı odasında toplanıyor; uzun meşe masanın üzerine bir dizi harita açtım. Onlara gemiyi bir akına çıkaracağımızı söyledim, ama hedefi henüz seçmedim. Bu konuda söz hakkı tanımanın morali yükselteceğini düşünüyorum; bu yüzden her hedefin kıymetini tartışırlarken dinliyorum.\n\nBir saat sonra tartışma kızışmaya başlıyor ve konuyu sonuçlandırmanın zamanı geldiğine karar veriyorum. Kadehimi masaya çarpıyorum; adamlar susup beklentiyle bana bakmaya dönüyor."

 agot_sailing.9110.a:0 "[piracy_destination_1.GetName]'e akın düzenleyelim"

 agot_sailing.9110.b:0 "[piracy_destination_2.GetName]'i yağmalayacağız!"

 agot_sailing.9110.c:0 "[piracy_destination_3.GetName]'i sabote etmeye ne dersin?"

 agot_sailing.9110.d:0 "Yakınlarda akın düzenlenecek bir yer yok gibi görünüyor"

 agot_sailing.9111.t:0 "Deniz Devriyesi Görüldü!"

 agot_sailing.9111.desc:0 "Hedefimize yaklaşırken tayfada beklenti yükseliyor. Kara yelkenler açıldı; kuvvetli bir arka rüzgâr bizi ileri sürüklüyor, geminin burnu bileylenmiş bir bıçak gibi dalgaları yarıyor.\n\nBirden seren çanaklığından bir çığlık yükseliyor - bir devriye gemisi görülmüş. Araç zarif hatlı ve silahlı tayfalarla dolu. Bir seçim yapmalıyım: gemiye kafa kafaya saldırmak, manevrayla onu atlatmayı denemek ya da kuyruğu kıvırıp eve dönmek..."

 agot_sailing.9111.a:0 "Hazır olun, denizciler! Onlarla çarpışıyoruz!"

 agot_sailing.9111.a.success:0 "Devriye gemisini batırıyorsun"

 agot_sailing.9111.a.failure:0 "Gemine savaşta hasar geliyor, ama aksaya aksaya eve varmayı başarıyorsun"

 agot_sailing.9111.toast.a.success:0 "Devriye gemisi batırıldı!"

 agot_sailing.9111.toast.a.failure:0 "Gemin hasar aldı!"

 agot_sailing.9111.c:0 "Yelkenleri açın! Onlardan hızlıyız!"

 agot_sailing.9111.c.success:0 "Devriye gemisinden sıyrılıyorsun"

 agot_sailing.9111.c.failure:0 "Devriye gemisi aracına hasar verip seni geri çekilmeye zorluyor"

 agot_sailing.9111.toast.c.success:0 "Devriye gemisi atlatıldı!"

 agot_sailing.9111.toast.c.failure:0 "Gemin hasar alıyor ve geri çekilmek zorunda kalıyorsun"

 agot_sailing.9111.e:0 "Bu çok riskli. Gemiyi geri çevir!"

 agot_sailing.9114.t:0 "Akın"

 agot_sailing.9114.desc:0 "Sonunda ileride kıyıyı seçiyoruz ve hedefimizin silueti ufukta belirmeye başlıyor. Tayfam güvertede toplanıp silahlarını biler ve cesaret için içkilerini yuvarlarken martılar direğin çevresinde dönüyor.\n\nŞimdi asıl karar zamanı - bu alçakça girişimden en iyi nasıl kâr elde edilir?"

 agot_sailing.9114.a:0 "[selected_piracy_destination.GetName]'deki üretimi sabote edelim."

 agot_sailing.9114.a.success:0 "[selected_piracy_destination.GetName] [development|E] faktörünü ve [garrison|E] boyutunu azaltıyorsun"

 agot_sailing.9114.a.failure:0 "Muhafızlar seni yaraladı"

 agot_sailing.9114.toast.a.success:0 "Eyâlet sabote edildi!"

 agot_sailing.9114.toast.a.failure:0 "Sabotaj başarısız oldu!"

 agot_sailing.9114.b:0 "Paranı kazanma zamanı! [selected_piracy_destination.GetName]'i yağmalayacağız."

 agot_sailing.9114.b.success:0 "[selected_piracy_destination.GetNameNoTooltip]'i yağmalıyorsun"

 agot_sailing.9114.b.failure:0 "Muhafızlar seni yaraladı"

 agot_sailing.9114.toast.b.success:0 "Eyâlet yağmalandı!"

 agot_sailing.9114.toast.b.failure:0 "Yağma başarısız oldu!"

 agot_sailing.9114.c:0 "Doğrudan [selected_piracy_destination_baron.GetName]'in üzerine gidelim."

 agot_sailing.9114.c.success:0 "[selected_piracy_destination_baron.GetName]'i yaralıyorsun"

 agot_sailing.9114.c.failure:0 "[selected_piracy_destination_baron.GetName] tarafından yaralanıyorsun"

 agot_sailing.9114.toast.c.success:0 "Düelloyu kazanıyorsun!"

 agot_sailing.9114.toast.c.failure:0 "Düelloyu kaybediyorsun!"

 agot_sailing.9114.d:0 "Bazı köylüleri kaçırmalıyız!"

