 agot_sailing.3928.desc:0 "Uzun süredir denizdeyiz; şiddetli karşı rüzgârlar yüzünden ilerlememiz umduğumuzun çok altında. Daha kötüsü, erzaklar tehlikeli biçimde tükeniyor...\n\n[host.GetTitledFirstNameNicknamed] tayfanın itirazlarını duydu, ama aramızdaki en gürültücülerle sert biçimde başa çıktı. Moral sarsıldı ve guruldayan karınların sesi sıradanlaştı - ama en azından önümüzdeki yolculuk için yaşıyoruz."

 agot_sailing.3928.a:0 "Aferin, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"

 agot_sailing.3929.t:0 "$agot_sailing.3304.t$"

 agot_sailing.3929.desc:0 "Uzun süredir denizdeyiz; şiddetli karşı rüzgârlar yüzünden ilerlememiz umduğumuzun çok altında. Daha kötüsü, erzaklar tehlikeli biçimde tükeniyor...\n\n[mutiny_leader.GetTitledFirstNameNicknamed] yolculuk boyunca nifak tohumları ekti ve şimdi [mutiny_leader.GetHerHis] zamanı geldi. [host.GetTitledFirstNameNicknamed] tayfayı katı tayınların gerekliliğine ikna etmeye çalışırken [mutiny_leader.GetFirstNameNoTooltip]'in aklında başka bir fikir var...\n\nKısa bir boğuşmanın ardından [host.GetFirstName] kalastan yürümeye zorlanıyor!"

 agot_sailing.3929.a:0 "Elveda, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]..."

 agot_sailing.3930.t:0 "$agot_sailing.3400.t$"

 agot_sailing.3930.desc:0 "Rüya dün gece yine geldi. #italic Yıkan ateş. Mum gibi eriyen taş, buhara dönüşen kaynayan deniz, kendi alevleri tarafından yutulurken çığlık atan ejderhalar. Ve o ses - tanrılar, o ses - dünyanın ta kendisi yarılıyormuş gibi.#!\n\n#EMP Valyria'nın Kıyameti!#!\n\nBunu herkesin gözünde görüyorum. Korku göğsümde taş gibi oturuyor. Ama kaptan bize korkak demiyor. [host.GetSheHe|U] dinliyor.\n\n"

 agot_sailing.3930.a:0 "Kâbuslar geri dönebilir. Ama şimdilik, kürek çekiyoruz."

 agot_sailing.3931.t:0 "$agot_sailing.3400.t$"

 agot_sailing.3931.desc:0 "Rüya dün gece yine geldi. #italic Yıkan ateş. Mum gibi eriyen taş, buhara dönüşen kaynayan deniz, kendi alevleri tarafından yutulurken çığlık atan ejderhalar. Ve o ses - tanrılar, o ses - dünyanın ta kendisi yarılıyormuş gibi.#!\n\n#EMP Valyria'nın Kıyameti!#!\n\nBunu herkesin gözünde görüyorum. Korku göğsümde taş gibi oturuyor. Ama kaptan durmayacak. [host.GetHerHim]'e söyledikten sonra bile - #italic yalvardıktan#! sonra bile - [host.GetTitledFirstName] ileri gitmekte ısrar ediyor; sanki sayılar Valyria'nın Kıyameti'ni durdurabilirmiş gibi, sanki tanrıların kendileri bize bir uyarı göndermişken mantığın bir önemi varmış gibi haritalardan ve mesafelerden söz ediyor.\n\n"

 agot_sailing.3931.a:0 "[host.GetHerHis] cenaze ateşindense [host.GetHerHis] öfkesi yeğdir."

 agot_sailing.3932.t:0 "$agot_sailing.3501.t$"

 agot_sailing.3932.desc:0 "Kayıp Valyria'nın bulunduğu yere yaklaşırken iyi rüzgârlar, sakin dalgalar ve açık gökyüzü iç açıcı bir manzara sunuyordu. Ama bir anda her şey değişiyor.\n\nGeminize doğru devasa bir fırtına bulutu yuvarlanıyor, ardından bir tane daha, bir tane daha, bir tane daha. Düzenleri neredeyse bizim konumumuzu hedef almış gibi. #EMP Fırtınaların kılıcı#! gibi görünüyor!\n\n[host.GetTitledFirstNameNicknamed] öne atılıyor; gök gürültüsü çatırtılarının ve bardaktan boşanırcasına yağan sağanağın arasından emirler yağdırıyor. ""Yelkenleri açın, neredeyse geldik!"" [host.GetHerHim]'in bağırdığını duyuyorum ve ileride [host.GetSheHe]'nin haklı olduğunu görüyorum..."

 agot_sailing.3932.a:0 "Olabilir mi?"

 agot_sailing.3933.t:0 "$agot_sailing.3502.t$"

 agot_sailing.3933.desc:0 "Kayıp Valyria'nın bulunduğu yere yaklaşırken iyi rüzgârlar, sakin dalgalar ve açık gökyüzü iç açıcı bir manzara sunuyordu. Ama bir anda her şey değişiyor.\n\nGeminize doğru devasa bir fırtına bulutu yuvarlanıyor, ardından bir tane daha, bir tane daha, bir tane daha. Düzenleri neredeyse bizim konumumuzu hedef almış gibi. #EMP Fırtınaların kılıcı#! gibi görünüyor!\n\n[host.GetTitledFirstNameNicknamed] öne atılıyor; gök gürültüsü çatırtılarının ve bardaktan boşanırcasına yağan sağanağın arasından emirler yağdırıyor. Ama emirler çevremizdeki fırtınanın gücüne yetişemiyor.\n\nDuyduğum son şey, çevremdeki azgın suların her yanı yutan gümbürtüsü...\n\nVe sonra karanlık çöküyor."

 agot_sailing.3933.a:0 "N-gh..."

 agot_sailing.3934.t:0 "$agot_sailing.3900.t$"

 agot_sailing.3934.desc:0 "[host.GetTitledFirstNameNicknamed] sonunda paramparça adaları görünce [host.GetHerHis] yüzünde çılgın bir gülümseme beliriyor, ağzından hafif histerik bir kahkaha taşıyor. Başardık. Mücadeleler büyüktü, çoğu kişi bunun imkânsız olduğundan şüphe ediyordu - ama başardık. Bu, kesinlikle Valyria'nın On Dört Alev'i'nden geriye kalan olmalı.\n\nAncak yaklaştıkça bir soru fısıldanıyor... karaya çıkmayı deneyecek miyiz?\n\nHer yandan sarp kayalık yüzeyleri kolay bir çıkışı imkânsız kılıyor - ve suyun ve kayaların üzerinden her yandan duman yükseliyor. Üstüne çıkmak, kendi üzerimize kıyamet çağırmak demek - tıpkı eskiden ejderha efendilerinin başına gelen kıyamet gibi."

 agot_sailing.3934.a:0 "[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )] ne yapacak?"

 agot_sailing.3935.t:0 "$agot_sailing.3901.t$"

 agot_sailing.3935.desc:0 "[host.GetTitledFirstNameNicknamed] paramparça adalardan herhangi birine çıkma girişiminden vazgeçti; sarp kayalıklar ve taşlık kıyılar [host.GetHerHim]'i yaklaşmaktan alıkoydu. Buna rağmen gemiyi olabildiğince yaklaştırıyor, durmadan daha da yaklaşıyoruz. Yaklaştıkça Valyria'nın Kıyameti'nin boyutları gözler önüne seriliyor. Her yanı saran dumanın arasından yıkık kuleler, sütunlar, büsbütün harap olmuş kentler ve konutlar görülüyor. Yine de böyle korkunç bir durumda bile On Dört Alev'in bir zamanlar ne kadar görkemli olduğu sezilebiliyor.\n\nSonunda, adaların çevresinde defalarca dönüp durduktan sonra, gönül rahatlığıyla eve dönüyoruz. Başkalarının bir efsane sandığı şeyi bulduk, eşi benzeri olmayan tehlikelere göğüs gerdik ve çoktan kaybolmuş Valyria'nın son kalıntısına şahit olduk. [host.GetFirstNamePossessiveNoTooltip] hünerinden ya da ününden kimse şüphe duyamaz."

 agot_sailing.3935.a:0 "Çok etkileyici, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"

