 agot_sailing.9114.e:0 "Bu çok riskli. Gemiyi geri çevir!"

 agot_sailing.9120.t:0 "Ticaret Gemisi"

 agot_sailing.9120.desc:0 "Hava güzeldi, rüzgârlar elverişliydi; yine de günlerdir yelken açtık ve tek bir gemi bile görmedik. Tayfa huzursuzlanıp huysuzlaşıyor. Enerjileri yakında başka yöne yönlendirilmezse birbirlerine dönebileceklerinden korkmaya başlıyorum.\n\nDerken bir çığlık yükseliyor - batı ufkunda yelkenler! Gemiyi döndürüp avımıza doğru doğrudan bir rota çiziyorum. Yaklaştıkça gülümsememek elde değil - bu layık bir ödül. Yükünün ağırlığıyla suya gömülmüş, şişko bir ticaret teknesi."

 agot_sailing.9120.a:0 "Kendinize gelin, adamlar! O ticaret gemisini yağmalayacağız!"

 agot_sailing.9120.a.success:0 "Ticaret gemisini yağmalıyorsun!"

 agot_sailing.9120.toast.a.success:0 "Ticaret gemisi yağmalandı!"

 agot_sailing.9120.a.failure:0 "Geminin savunması fazla güçlü çıkıyor..."

 agot_sailing.9120.toast.a.failure:0 "Saldırı başarısız oldu!"

 agot_sailing.9120.c:0 "Onları batırmak yerine gemiyi kendimize geçirebilirken neden batıralım?"

 agot_sailing.9120.c.success:0 "Gemiyi ele geçirip başkentine geri götürüyorsun!"

 agot_sailing.9120.toast.c.success:0 "Ticaret gemisi ele geçirildi!"

 agot_sailing.9120.c.failure:0 "Geminin savunması fazla güçlü çıkıyor..."

 agot_sailing.9120.toast.c.failure:0 "Esir alma başarısız oldu!"

 agot_sailing.9120.e:0 "Bu çok riskli. Gemiyi geri çevir!"

 agot_sailing.9130.t:0 "Korsanların Çatışması"

 agot_sailing.9130.desc:0 "[selected_piracy_destination.GetName]'e yaklaşırken, yelkenler görüldüğüne dair bir çığlık yükseliyor. Yaklaşan araca daha yakından baktığımızda bunun kolay bir av olmadığı anlaşılıyor; kendi ganimetinin peşinde, yıpranmış bir korsan gemisi bu.\n\nTayfasının üstesinden gelebilirsek gemide büyük zenginlikler bulabiliriz; ne var ki bu savaş risksiz olmayacak."

 agot_sailing.9130.a:0 "Ödülümüzü kapamayacaklar. Saldırın!"

 agot_sailing.9130.a.success:0 "Korsan gemisini yağmalıyorsun!"

 agot_sailing.9130.toast.a.success:0 "Korsan gemisi yağmalandı!"

 agot_sailing.9130.a.failure:0 "Düşman tayfasının üstesinden gelemiyorsun..."

 agot_sailing.9130.toast.a.failure:0 "Gemi hasar aldı!"

 agot_sailing.9130.c:0 "Kaptanlarıyla düello edeceğim, [dueled_pirate.GetName]!"

 agot_sailing.9130.c.success:0 "[dueled_pirate.GetName]'in kaderini sen belirliyorsun"

 agot_sailing.9130.toast.c.success:0 "Düello kazanıldı!"

 agot_sailing.9130.c.failure:0 "Düelloyu kaybediyorsun"

 agot_sailing.9130.toast.c.failure:0 "Yenildin!"

 agot_sailing.9130.d:0 "Yelkenleri açın! Geri çekiliyoruz!"

 agot_sailing.9131.t:0 "Kaptan [dueled_pirate.GetFirstNameNoTooltip] Alçaltıldı"

 agot_sailing.9131.desc:0 "Şiddetli bir düellonun ardından, yenilgiye uğrattığım [dueled_pirate.GetSheHe] kıvrılmış halde güvertede yatarken sonunda tepesinde dikiliyorum. İki tayfa da oldukları yerde donakalmış; ben anın tadını çıkarırken beni dikkatle izliyorlar. Sessizliği, merhamet dilenmeye başlayan rakibimden yükselen acılı bir inilti bozuyor.\n\nŞimdi bu zaferden en iyi nasıl yararlanacağıma karar vermeliyim. Hünerimi kanıtladım, ama önümde daha da büyük fırsatlar olabilir..."

 agot_sailing.9131.a:0 "Seni prangaya vuralım!"

 agot_sailing.9131.b:0 "Denizin zayıflığa merhameti yoktur. [dueled_pirate.GetFirstNameNoTooltip] kalastan yürüyecek!"

 agot_sailing.9131.c:0 "İyi dövüştün - bana katıl!"

 agot_sailing.9131.toast.c.success:0 "[dueled_pirate.GetNameNoTooltip] tayfana katıldı!"

 agot_sailing.9131.d:0 "Eline sağlık, iyi bir tayfan var..."

 agot_sailing.9131.d.success:0 "Düşman tayfasını saflarına katıyorsun"

 agot_sailing.9131.toast.d.success:0 "Tayfa toplandı!"

 agot_sailing.9131.d.failure:0 "Tayfayı ikna edemiyorsun"

 agot_sailing.9131.toast.d.failure:0 "Tayfa sana katılmayı reddediyor"

 agot_sailing.9131.e:0 "Merhametsiz değilim. Defol git!"

 agot_sailing.9131.toast.e.success:0 "[dueled_pirate.GetNameNoTooltip] serbest bırakıldı!"

 agot_sailing.9140.t:0 "Ganimetin Arasında Bir Harita mı?"

 agot_sailing.9140.desc:0 "Yenilgiye uğrattığımız kaptanın kamarasını ararken bir yığın harita buluyorum. İlk bakışta sıradan görünüyorlar, ama yakından incelediğimde çok daha değerli bir şey keşfediyorum - bir geminin dalgaların altında battığının görüldüğü yere giden bir hazine haritası.\n\nEkteki belgelere göre gemi zenginliklerle yüklüydü. Bu hazinenin bir kısmı hâlâ okyanus tabanında yatıyor olabilir mi? Bir dalış çanımız varsa yelken açıp kalanı aramak için enkazı inceleyebiliriz!"

 agot_sailing.9140.a:0 "Yeni bir yolculuk planlamalıyız!"

 agot_sailing.9150.t:0 "[host.GetTitledFirstNamePossessiveNoTooltip] Namına Bir Başarısızlık"

 agot_sailing.9150.desc:0 "Başarılı bir akın düzenleme çabalarımız boşa çıktı; suç tamamen [host.GetTitledFirstName]'in omuzlarında. [host.GetHerHis|U] beceriksiz liderliği bizi yanlış yola saptırdı; hayal kırıklığım ölçülemez, günüm mahvoldu."

 agot_sailing.9150.a:0 "Ne hayal kırıklığı..."

 agot_sailing.9151.t:0 "Başarılı Bir Akın!"

 agot_sailing.9151.desc:0 "Sonunda ileride kıyıyı seçiyoruz ve hedefimizin silueti ufukta belirmeye başlıyor. Tayfa güvertede toplanıp silahlarını biler ve cesaret için içkilerini yuvarlarken martılar direğin çevresinde dönüyor.\n\n[host.GetTitledFirstName] planımıza karar verdi:"

 agot_sailing.9151.desc_sabotaged_production:0 "Yerel altyapıyı sabote edeceğiz; üretim araçlarına onarılmaz hasar vereceğiz.\n\nGeri kalanı bulanık, ama bir iki binayı ateşe verdiğimi net biçimde hatırlıyorum. #EMP Ne günlerdi!#!"

 agot_sailing.9151.desc_pillage_settlement:0 "Yerleşimi yağmalayıp paralarını kendimize alacağız.\n\nBirkaç değerli eşyayı cebe indirme fırsatı memnuniyet verici; farkına varmadan gemideyim ve başarılı yağmayı tayfa arkadaşlarıma anlatıyorum. #EMP Ne heyecan!#!"

 agot_sailing.9151.desc_duel_the_baron:0 "[host.GetSheHe|U] hünerini göstermek için yerel hükümdarla düello edecek.\n\n[host.GetHerHis|U] planı kusursuz işliyor; [host.GetSheHe] rakibini kolayca yaralamayı başarıyor. #EMP Etkileyici!#!"

 agot_sailing.9151.desc_kidnap_villager:0 "Yerel köylüleri kaçıracağız.\n\nYerliler elbette [host.GetTitledFirstNameNoTooltip]'in ileride işine yarayacaktır. #EMP Muhteşem başarı!#!"

 agot_sailing.9151.a:0 "İyi liderlik, [host.GetTitledFirstNameNoTooltip]!"

 agot_sailing.9152.t:0 "Başarısız Bir Akın..."

 agot_sailing.9152.desc:0 "Sonunda ileride kıyıyı seçiyoruz ve hedefimizin silueti ufukta belirmeye başlıyor. Tayfa güvertede toplanıp silahlarını biler ve cesaret için içkilerini yuvarlarken martılar direğin çevresinde dönüyor.\n\n[host.GetTitledFirstName] planımıza karar verdi:"

 agot_sailing.9152.desc_sabotaged_production:0 "Yerel altyapıyı sabote edeceğiz; üretim araçlarına onarılmaz hasar vereceğiz.\n\nPlan ne yazık ki yolunda gitmiyor; bir binayı ateşe vermeye çalışırken bir muhafız çıkagelip beni patakladı. Hatırladığım bir sonraki şey, teknede geri dönmüş olduğum. #EMP Ah!#!"

 agot_sailing.9152.desc_pillage_settlement:0 "Yerleşimi yağmalayıp paralarını kendimize alacağız.\n\nNe yazık ki tayfamız için yerleşim iyi korunuyor ve yerlilerin değerli eşyalarını cebe indirme denememiz geri püskürtüldü. #EMP Ne yazık!#!"

 agot_sailing.9152.desc_duel_the_baron:0 "[host.GetSheHe|U] hünerini göstermek için yerel hükümdarla düello edecek.\n\nNe yazık ki [host.GetHerHis|U] planı yolunda gitmiyor ve bu sırada [host.GetSheHe] yaralanıyor. #EMP Yazık!#!"

 agot_sailing.9152.desc_kidnap_villager:0 "Yerel köylüleri kaçıracağız.\n\nNe yazık ki yerleşimin bu kadar iyi korunduğunu beklemiyorduk ve denemelerimiz boşa çıktı. #EMP Tüh!#!"

 agot_sailing.9152.a:0 "Kötü liderlik, [host.GetTitledFirstNameNoTooltip]..."

 agot_sailing.9501.t:0 "[ship_province.GetNameNoTooltip] Açıklarında Bir Trajedi"

 agot_sailing.9501.desc_intro:0 "[admiral.GetName] elinde bir mektupla yanıma yaklaşıyor. [admiral.GetSheHe|U] bana denizde yaşanan yakın tarihli bir trajediden bahsetmek istiyor.\n\n[ship_province.GetName] kıyıları açıklarında bir gemi hazin sonunu bulmuş; sağ kalan sayısı çok az."

 agot_sailing.9501.desc_reaction_sadistic:0 "\n\n[admiral.GetSheHe]'nin bu haberi bana getirmeyi neden seçtiğini merak ediyorum. Denizin aldığı canlardan çok, kaybolan kargoya ve boşa giden paraya üzülüyorum."

 agot_sailing.9501.desc_reaction:0 "\n\nKorkunç bir trajedi. Canını kaybedenleri ve arkalarında yas bırakan aileleri düşünmemek elimde değil."

 agot_sailing.9501.desc_reaction_compassionate:0 "\n\nBu trajedi kalbimi parçalıyor. Dalgaların altında kaybolan o kadar çok can, parçalanan o kadar çok aile var ki... Böyle bir acının düşüncesi bile içime ağır oturuyor."

 agot_sailing.9501.desc_greed_greedy:0 "\n\n[admiral.GetNameNoTooltip] kaybolan kargodan söz ederken aklıma bir düşünce geliyor. O geminin nerede battığını biliyorum - [ship_province.GetNameNoTooltip] kıyılarının açığında. Bir gemi donatıp dalgıçlar göndererek kalanları çıkarabilirim... ne var ki [admiral.GetNameNoTooltip] enkazdan ilk haberdar olan kişi değilmiş gibi görünüyor. Başkaları şimdiden oraya yöneliyor olabilir."

 agot_sailing.9501.desc_greed_not_tarth:0 "\n\n[admiral.GetNameNoTooltip] mektubu okumaya devam ediyor; talihsiz gemide büyük bir servetin kaybolduğunu, şimdi okyanus tabanına saçıldığını anlatıyor. Belki de Tarth'ın meşhur safir denizleri bile artık güzellikte kendine rakip bulmuştur."

 agot_sailing.9501.desc_greed_tarth:0 "\n\n[admiral.GetNameNoTooltip] mektubu okumaya devam ediyor; talihsiz gemide büyük bir servetin kaybolduğunu, şimdi okyanus tabanına saçıldığını anlatıyor. Belki de Tarth'ın meşhur safir denizleri bile artık güzellikte kendine rakip bulmuştur."

 agot_sailing.9501.a:0 "Ne acıklı haber."

 agot_sailing_end:0 "@warning_icon! #X Bu seçenek etkinliği sona erdirir#!"

 agot_sailing_end_failure:0 "@warning_icon! #X Bu, etkinliği sona erdirir#!"
