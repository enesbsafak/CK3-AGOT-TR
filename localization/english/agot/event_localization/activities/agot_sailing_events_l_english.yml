 agot_sailing.3921.desc:0 "[host.GetTitledFirstNameNicknamed] [host.GetHerHis] denizcilik haritalarını ve notlarını uzun uzun inceledikten sonra şaşkın görünüyor. On Dört Alev'in içinde iyi bir demir yeri için muhtemel bir nokta bulmak hiç de küçük bir iş değil ve [host.GetSheHe] bunun üstesinden gelebilecek gibi görünmüyor.\n\nYavaşça [first_mate.GetTitledFirstName] elini [host.GetHerHis] omzuna koyuyor. ""Belki... bir başka sefere buluruz?"""

 agot_sailing.3921.a:0 "Ne yazık, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]..."

 agot_sailing_kraken_spawn:0 "Yelken açmaya devam ederken pruvaya hafif bir huzursuzluk çöküyor. Uzaklarda denizin yüzeyinin altında kıpırdayan bir şey görüyorum... akıl almaz büyüklükte ve yaklaştıkça büyüyor.\n\n#EMP Kudretli bir kraken!#! Efsaneler böyle efsanevi yaratıklardan söz eder, ama çoğu kişi bunları sütannelerin ve rahibelerin masalları sayar."

 agot_sailing.3922.t:0 "$agot_sailing.3200.t$"

 agot_sailing.3922.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed] öne atılıp net bir emir haykırıyor: canımızdan olmayalım diye geri çekilmeliyiz!"

 agot_sailing.3922.a:0 "Bu yolculuk bitti."

 agot_sailing.3923.t:0 "$agot_sailing.3200.t$"

 agot_sailing.3923.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed] bir kükreme koyuveriyor; bu an planlanmıştı. [host.GetSheHe|U] krakendorusunu [host.GetHerHis] dudaklarına götürüp derin, çınlayan bir ses çıkarıyor. Bu ses geminin güvertesini bile sarsıyor; etrafımdakilerin acı içinde kulaklarını kapadıklarını görüyorum.\n\nKraken ise hiç etkilenmemiş görünüyor. Bir anda yükselen bir dokunaç bir şak diye [host.GetFirstNameNoTooltip]'in üzerine iniyor ve borunun sesini bir çarpma sesiyle kesiyor. Dokunaç, artık kan, kemik ve etten ibaret bir su birikintisine dönüşen kaptanımızın kalıntılarından ayrılırken gözlerimi kaçıramıyorum. Ne yazık ki üzerimde süzülen dokunaçtan bile haberim olmuyor..."

 agot_sailing.3923.a:0 "Ah... ah, hayır!"

 agot_sailing.3924.t:0 "$agot_sailing.3200.t$"

 agot_sailing.3924.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed] hücum emri veriyor; biz de yaylarımızı kurup canavara ok yağdırıyoruz. Havada çınlayan delici bir feryat kemiklerimi ürpertiyor... sonra her şey sessizleşiyor.\n\n[host.GetFirstNameNoTooltip] başardı! [host.GetSheHe|U] krakenti öldürdü!"

 agot_sailing.3924.desc_horn:0 "$agot_sailing_kraken_spawn$\n\nTayfanın geri kalanıyla birlikte [host.GetTitledFirstNameNicknamed]'in arkasına çekiliyoruz; [host.GetSheHe] krakendorusunu [host.GetHerHis] dudaklarına götürüp o derin, gök gürültüsü gibi yankılanan sesi çıkarıyor. Ses denizin üzerinde yayılıyor ve birkaç an sonra koca canavar geri çekilmeye başlayıp geldiği derinliklerin içinde gözden kayboluyor. Artık borunun gerçek bir güç taşıdığından kuşku yok.\n\nTayfanın geri kalanıyla birlikte çılgınca sevinç çığlıkları atıyoruz; bazıları kutlamak için gizli içki stoklarını açıyor."

 agot_sailing.3924.a:0 "Şu [host.GetWomanMan]'e bir içki getirin!"

 agot_sailing.3925.t:0 "$agot_sailing.3200.t$"

 agot_sailing.3925.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed] hücum emri veriyor, biz de yaylarımızı kuruyoruz. Ama canavar okları hiçe sayıyor. Canavar üstümüze çullanıyor; tayfaları güverteden tabaktan limonlu kek alır gibi kapıyor.\n\nBir dokunaç akıl almaz bir kuvvetle bileğime dolanıyor; parmaklarım mide bulandırıcı bir çıtırtıyla eziliyor. Canavar beni ağzına doğru kaldırırken paramparça elim onun kavrayışına hapsoluyor..."

 agot_sailing.3925.a:0 "Hayır... böyle değil!"

 agot_sailing.3925.a.success.tt:0 "Bir şekilde canını kurtarmayı başarıyorsun"

 agot_sailing.3925.a.failure.tt:0 "@death_icon! Bütün halde yutuluyorsun, bir daha asla görülmüyorsun"

 agot_sailing.3925.b:0 "Bir tek kendimi kurtarabilseydim..."

 agot_sailing.3925.b.success.tt:0 "Canın sağ salim kurtuluyor, ama elin olmadan"

 agot_sailing.3925.b.failure.tt:0 "@death_icon! Neredeyse bütün halde yutuluyorsun, ama belki elin bir gün su yüzüne çıkar"

 agot_sailing.3926.t:0 "$agot_sailing.3300.t$"

 agot_sailing.3926.desc:0 "Uzun süredir denizdeyiz; şiddetli karşı rüzgârlar yüzünden ilerlememiz umduğumuzun çok altında. Daha kötüsü, erzaklar tehlikeli biçimde tükeniyor...\n\n[host.GetTitledFirstNameNicknamed] bunu açıkça fark etti; hedefimize varmadan açlıktan ölmemek için dikkatli bir erzak tayınlama uyguladı. Hesaplı tutum işe yarıyor gibi - hepimiz aç olsak da hâlâ yaşıyoruz."

 agot_sailing.3926.a:0 "Aferin, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]!"

 agot_sailing.3926.a.fatty:0 "Ama hangi bedelle? [host.GetFirstNameNoTooltip] bunu neden yapsın ki?!"

 agot_sailing.3927.t:0 "$agot_sailing.3300.t$"

 agot_sailing.3927.desc:0 "Uzun süredir denizdeyiz; şiddetli karşı rüzgârlar yüzünden ilerlememiz umduğumuzun çok altında. Daha kötüsü, erzaklar tehlikeli biçimde tükeniyor...\n\n[host.GetTitledFirstNameNicknamed] katı tayınlar uygulamaya çalıştı, ama [host.GetHerHis] hesapları yanlış görünüyor... Çevremizde denizden başka bir şey yok. Gemide yemek yok - yalnızca açlık sancıları bizi yiyip bitirirken yavaş çığlıklarımız var."

 agot_sailing.3927.a:0 "Lütfen, sadece bir ısırık..."

