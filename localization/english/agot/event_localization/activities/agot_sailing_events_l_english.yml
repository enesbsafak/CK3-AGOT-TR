﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿l_english:

 agot_sailing.0800.t:0 "Limana Varış"

 agot_sailing.0800.desc:0 "[location.GetName] limanının yürüyüş yollarında ilerliyorum; çevremi taze okyanus havası sarıyor. Yolculuğumda kullanılacak gemi tayfa tarafından hazırlanırken, yoldaşlarımla birlikte limanda biraz daha vakit geçirebiliriz.\n\nÜzerimizde martıların çığlıklarını duyuyor, aşağıda dalgaların rıhtımlara çarpışını izliyorum. Deniz önümde uzanıyor; onunla birlikte sunduğu sonsuz olanaklar da. Yakında orada olacağız, açık sularda."

 agot_sailing.0800.a:0 "Deniz çağırıyor."

 agot_sailing.0800.b:0 "Gemiyi donatacak yeterli adamımız yok."

 nice_try_tt:0 "Sahip olduğun hiçbir hazine haritası yelken açtığın yere götürmez"

 agot_sailing.1005.t:0 "Tersane Cazibesi"

 agot_sailing.1005.desc:0 "Yolculuğuma çıkmadan önce rıhtımda dolaşırken, gözlerinde parıltıyla çekici bir [hooker.GetWomanMan] yanıma yaklaşıyor.\n\n""Yola çıkmadan önce biraz eğlenceye ne dersin, denizci?"" diye şehvetli bir ses tonuyla sorar [hooker.GetFirstName].\n\nÖnümüzdeki yolculuk için hâlâ yapmam gereken pek çok şey var, ama biraz da vakit var..."

 agot_sailing.1005.a:0 "Ne dersin, [hooker.GetFirstNameNoTooltip], #EMP bol bol#! eğlenelim mi? Yakında görüşürüz!"

 agot_sailing.1005.b:0 "Zararsız bir eğlencenin nesi yanlış, değil mi?"

 agot_sailing.1005.c:0 "Çekil git, pis [hooker.GetWomanMan]!"

 sailing_gained_concubine_log:0 "[hooker.GetFirstName]'i [concubine|E] olarak kazandın"

 sailing_had_sexual_encounter:0 "[hooker.GetFirstName] ile ""romantik"" bir karşılaşma yaşadı"

 agot_sailing.1006.t:0 "Yatak Odasında Bir Hançer"

 agot_sailing.1006.desc:0 "Yatağa uzanıp keyif ve tatminle gülümserken [hooker.GetFirstName]'in üzerime tırmandığını ve [hooker.GetHerHis] kaftanını gevşettiğini görüyorum.\n\nNe var ki ikinci bir tur umutları, [hooker.GetHerHis] yüzünün ciddileşmesiyle bir anda yok oluyor; [hooker.GetSheHe] bir hançeri [hooker.GetHerHis] başının üzerine kaldırıp gülerek bıçağı aşağı indiriyor.\n\n""Yüzsüzler'den bir armağan, ahmak [ROOT.Char.GetTitleAsNameNoTooltip]!"""

 agot_sailing.1006.a:0 "[hooker.GetFirstNameNoTooltip]! Dur... hayır!"

 agot_sailing.1006.a.desc:0 "Bıçağı saptırmak için elinden geleni yapıyorsun:"

 agot_sailing.1006.duel_success:0 "Tüm olasılıklara karşın hançeri kapıp [hooker.GetHerHim]'i tutukluyorsun"

 agot_sailing.1006.duel_failure:0 "Hançerin göğsüne derinlemesine saplandığını hissediyorsun; görüşün yavaşça kararıyor"

 agot_sailing.1007.t:0 "Beklerken Oymacılık"

 agot_sailing.1007.desc:0 "Erzağın gemiye yüklenmesini beklerken rıhtımda dolaşıyorum; tahta kazıma sesi can sıkıntımı bölüyor. Sesi takip edince, tayfadan [whittler.GetFirstName]'in bir parça keresteden küçük, ince işçilikli bir heykelcik oyduğunu görüyorum.\n\n[whittler.GetFirstNameNoTooltip] işinden başını kaldırıp gülümsüyor ve beni yanına çağırıyor. ""Merhaba, [whittler.Custom2('spoken_address_by_familiarity', ROOT.Char)]. Biraz ahşap oymacılığına katılmak ister misin?""\n\nBıçakla hünerli bir iş gerektiriyormuş gibi görünüyor, ama denersem bir şeyler yapabileceğimden eminim..."

 agot_sailing.1007.a:0 "Çocuğum için küçük bir şey yapacağım."

 agot_sailing.1007.b:0 "Sevdiğim için tatlı bir hatıra yapacağım."

 agot_sailing.1007.c:0 "Sözlerimi müziğe dökmek için bir flüt yapacağım."

 agot_sailing.1007.d:0 "Vakit geçirmek için basit bir şey yapacağım."

 agot_sailing.1007.e:0 "Vaktimi boş işlerle harcamayı tercih etmem."

 agot_sailing.1008.t:0 "Meyhane Kavgası"

 agot_sailing.1008.desc:0 "Yolculuğumuzdan önceki gece; yerel bir meyhanede tayfamla yiyip içerek eğleniyorum. Keyifler yerinde; herkes birbirinin denizcilik hikâyelerini bastırmaya çalışırken kahkahalar eksik olmuyor.\n\nBirden, sarhoş müşterilerin uğultusunun üzerinden barda yükselen sesler duyuyorum; tartışmaya dönüşüyor. Gözlerimi kısınca bunlardan birinin tayfa arkadaşım [brawler.GetFirstName] olduğunu görüyorum.\n\nAnlaşmazlık çabucak tam bir bağrışma kavgasına dönüşüyor, tükürükler saçılıyor. Az sonra yumruklar yükseliyor ve [brawler.GetFirstNameNoTooltip] iri kıyım kabadayı grubuna karşı yardım çağırıyor."

 agot_sailing.1008.a:0 "Bunu çözmenin daha iyi bir yolu olmalı?"

 agot_sailing.1008.a.success:0 "Durumu çabucak yatıştırıp kabadayıları sakinleştiriyorsun"

 agot_sailing.1008.a.failure:0 "Çabaların kulak ardı ediliyor ve ikiniz de cüretinizin bedelini dayakla ödüyorsunuz"

 agot_sailing.1008.b:0 "Geliyorum, [brawler.GetFirstNameNoTooltip]!"

 agot_sailing.1008.b.success:0 "Sen ve [brawler.GetFirstNameNoTooltip] kabadayılarla çabucak işi bitiriyorsunuz"

 agot_sailing.1008.b.failure:0 "Sen ve [brawler.GetFirstNameNoTooltip] kabadayılar tarafından iyice pataklanıyorsunuz"

 agot_sailing.1008.c:0 "Kendi başının çaresine bak, [brawler.GetFirstNameNoTooltip]..."

 agot_sailing.1009.t:0 "İçki Yarışı"

 agot_sailing.1009.desc:0 "Saat gerçekten çok ilerledi; birkaç kadehten fazla içmiş olan tayfam yine her zamanki şaklabanlıklarında: hünerleri ve geçmiş zaferleriyle ilgili hikâyeler ve böbürlenmeler paylaşıyorlar.\n\nHafifçe sendeleyerek tayfa arkadaşım [challenger.GetFirstName] ayağa kalkıyor, elinde kadeh; kadehi tahta masaya çarpıyor.\n\n"

 agot_sailing.1009.a:0 "Benden daha uzun dayanabileceğini mi sanıyorsun? #EMP Sarhoş olmalısın#!..."

 agot_sailing.1009.a.success:0 "Kadehler devrilip birçok tur attıktan sonra nihayet [challenger.GetFirstNameNoTooltip]'in yere çakıldığını duyuyorsun."

 agot_sailing.1009.a.failure:0 "İçki çabucak başına vuruyor ve bayılıyorsun."

 agot_sailing.1009.b:0 "Senden fazla içmeyi asla umamam, [ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('challenger'))]!"

 agot_sailing.1010.t:0 "Falcı"

 agot_sailing.1010.desc:0 "Rıhtım boyunca yürürken, dalgaların ritmiyle inip kalkan gemi direklerini izliyorum; yolun kenarındaki küçük bir arabanın yanında, beni yanına çağıran yaşlı bir kocakarının sesini duyuyorum.\n\nYaklaştığımda, önündeki süslü küçük masadan bir avuç rün kazınmış taşı kadife bir keseye topluyor; keseyi sallayıp beş taş çekiyor ve onları düzgün bir sıra halinde diziyor.\n\n""İyi günler, denizci. Bu gizemli taşlara Hadal Olanlar sihirli güç aşıladı; önündeki yolculuğun için bir kehanet sunacak güçleri var. Yeter ki avucuma gümüş koy..."""

 agot_sailing.1010.a:0 "Bırak şu taşların ne diyeceğini duyayım..."

 agot_sailing.1010.a.success.t:0 "Kehanetler iyi!"

 agot_sailing.1010.a.success:0 "Taşlar yolculuğun ve gelecek yılların için iyi haberler kehanet ediyor"

 agot_sailing.1010.a.failure.t:0 "Kehanetler kötü!"

 agot_sailing.1010.a.failure:0 "Taşlar yolculuğun ve gelecek yılların için kötü haberler kehanet ediyor"

 agot_sailing.1010.b:0 "Bir avuç taşla iş çeviren şarlatana para harcamayacağım!"

 agot_sailing.1011.t:0 "Tersane Lezzeti"

 agot_sailing.1011.desc:0 "Yolculuğumun sabahı; tayfa arkadaşım [fellow_diner.GetFirstName] ile rıhtım boyunca gemime doğru yürüyorum.\n\nYaklaşan maceramız hakkında sohbet ederken [fellow_diner.GetHerHis] burun deliklerinin genişlediğini ve yüzüne kocaman bir gülümsemenin yayıldığını görüyorum. [fellow_diner.GetSheHe] kolumdan çekip kokuyu takip ederek iki depo arasına sıkışmış harap bir yiyecek tezgâhına gidiyor."

 agot_sailing.1011.a:0 "Sanırım deneyeceğim... İnsan bir kez yaşar!"

 agot_sailing.1011.a.success.t:0 "Yemek nefisti!"

 agot_sailing.1011.a.success:0 "Yemek nefisti; karnın tok ve yolculuğa hazırsın"

 agot_sailing.1011.a.too_spicy.t:0 "Yemek fazlasıyla acıydı!"

 agot_sailing.1011.a.too_spicy:0 "Yemekteki baharat rahatsız edici derecede güçlüydü; seni hararetle terletiyor"

 agot_sailing.1011.a.failure.t:0 "Kendimi hiç iyi hissetmiyorum..."

 agot_sailing.1011.a.failure:0 "Kötü hazırlanan yemek, sabahki yelken öncesinde kendini berbat ve hasta hissetmene yol açıyor"

 agot_sailing.1011.b:0 "Aklını mı kaçırdın? Şu tabakların ne kadar kirli olduğuna bak!"

 agot_sailing.1012.t:0 "Havadan Bir Saldırı!"

 agot_sailing.1012.desc:0 "Rıhtımda yürürken, ilerideki yolculuk için erzaklarımızı zihnimden sayıyorum; birden başıma sert bir darbe geliyor. Elimi başıma götürüp şimdi cıvık bir hal almış şakağıma dokunuyorum, sonra bana bu kadar cüretkârca saldıracak kişiyi bulmak için dönüyorum!\n\nYanımdaki tayfa arkadaşım [laugher.GetFirstName] kahkahayı basıyor, ardından rıhtımın ucunu işaret ediyor.\n\n""Sanırım saldırganını orada bulacaksın, [ROOT.Char.GetTitleAsNameNoTooltip]!""\n\nRıhtımın ucuna bakınca sonunda anlıyorum - orada tek başına bir martı tünemiş, bana dik dik bakıyor. Elim aşağı indirdiğimde, üstüme pislemiş olduğu gerçeğini seçebiliyorum."

 agot_sailing.1012.a:0 "Karşılaştığım en ölümcül savaşçı!"

 agot_sailing.1012.b:0 "Bana gülmeye nasıl CÜRET edersin? Derini yüzerim!"

 agot_sailing.1013.t:0 "Deneyimli Bir Denizci"

 agot_sailing.1013.desc:0 "Tayfa listelerimi gözden geçirirken, gemimizde olması gerekenlerden birkaç kişi eksik olduğunu görünce telaşlanıyorum. Sefer için özel bir zarar teşkil etmese de, geminin tam donanımlı olmasını tercih ederim.\n\nLimanın uğrak yerlerini aradıktan sonra, pek çok sefer görmüş, çok gezmiş bir denizci olan [recruit.GetFirstName]'i duyuyorum. Sonunda [recruit.GetHerHim]'in izini buluyorum, ama dehşete düşüyorum: [recruit.GetSheHe] çoktan başka bir tayfayla anlaşmış!\n\nYaklaştığımı fark edip dönen [recruit.GetFirstNameNoTooltip] kaşını kaldırıyor.\n\n""Yardımcı olabileceğim bir şey var mı?"""

 agot_sailing.1013.a:0 "Sana sunabileceğim epeyce bir fırsat var..."

 agot_sailing.1013.a.success:0 "Denizciyi tayfana katılmaya başarıyla ikna ediyorsun"

 agot_sailing.1013.a.failure:0 "Denizciyi ikna edemiyorsun"

 agot_sailing.1013.b:0 "Söylesene, her zamanki yemeğin ne? İki katını ödeyeceğim!"

 agot_sailing.1013.c:0 "Yeterince denizcimiz var. İdare ederiz."

 agot_sailing.1014.t:0 "Çarşıda Bir Gün"

 agot_sailing.1014.desc:0 "Gemiye erzak yüklenirken vakit bulup yerel pazarları geziyorum.\n\nPek çok tüccar mallarını bana tanıtmak için bağırıyor. Burada gerçekten egzotik şeyler var - hiç tatmadığım yiyecekler ve anlayamadığım dillerde yazılmış kitaplar. Ayrıca seçkin bir içki koleksiyonu da mevcut. Tayfanın, bunlardan alıp dönersem buna kesinlikle bayılacağını biliyorum!\n\nBurada ilgimi çeken bir şey var mı?"

 agot_sailing.1014.a:0 "Şu kitap ilginç görünüyor!"

 agot_sailing.1014.a.tt:0 "[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )] özelliği ilerlemeni artırma şansı."

 agot_sailing.1014.a.success.toast:0 "[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )] olarak bonus deneyim kazandın"

 agot_sailing.1014.a.failure.toast:0 "[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )] olarak deneyim kazanamadın"

 agot_sailing.1014.b:0 "İçkileri devir ve [ROOT.Char.GetFaith.HighGodName]'e şükret!"

 agot_sailing.1014.c:0 "Portakal mı? Gerçekten tuhaf bir meyve!"

 agot_sailing.1014.d:0 "Bir hazine haritası mı? Orada ne bulabilirim ki?"

 agot_sailing.1014.d.tt.success.toast:0 "Gerçek bir hazine haritası aldın"

 agot_sailing.1014.d.tt.failure.toast:0 "Sahte bir hazine haritası aldın"

 agot_sailing.1014.e:0 "Ben gayet iyiyim, teşekkürler."

 agot_sailing.1015.t:0 "Yaşlı Dilenci"

 agot_sailing.1015.desc:0 "[location.GetName] limanında kısa bir gezintiye çıktığımız sırada [dockyard_guest.GetFirstName] ile bana yaşlı bir dilenci yaklaşıyor."

 agot_sailing.1015.a:0 "Peki, bakalım sırların bedeline değer mi."

 agot_sailing.1015.b:0 "[dockyard_guest.GetFirstNameNoTooltip] haklı. Eşyalarını topla ve git."

 agot_sailing.1015.c:0 "Bana öğretebileceği bir şey yok. Yolumuza devam ederiz."

 agot_sailing.1016.t:0 "Teknede mi?"

 agot_sailing.1016.desc:0 """Sık sık teknede #italic bulunmamışımdır#! ben!""\n\nİki liman işçisi arasındaki tartışma tüm bakışları üzerine çekmiştir; [location.GetName] limanı bu manzara karşısında sus pus olmuştur.\n\n""Hayır, senin üzerinde bulunduğun şey tekne değil. Teknede #bold bulunmamış #italic olmana#!#! imkân yok!"" Bu anlaşmazlık karşısında ağzım açık kalıyor; zihnim hayatın karmaşıklığıyla boğuşuyor. Bu ahmak liman işçileri de kim, neyi tartışıyorlar burada?"

 agot_sailing.1016.a:0 "Ne saçma bir şey."

 agot_sailing.1016.b:0 "Hayır, hayır, haklı bir noktası var!"

 agot_sailing.1016.b.tt:0 "Ölüm bir tekne olabilir mi?"

 agot_sailing.1990.t:0 "Bir Kaptan Yamağı"

 agot_sailing.1990.desc:0 "Yelken açmadan önce birinci kaptanımı seçmeliyim - açık denizde yanımda duracak ve komuta yükünü paylaşacak kişiyi.\n\nBugün burada toplananlar arasında aile fertleri, dostlar ve deneyimli denizciler var. Kimi net bir denizcilik hünerine sahip, kimiyse sadakat, yakınlık ya da hırs yüzünden burada. Limanın güvenliğini geride bıraktığımızda her biri kendince işe yarayabilir."

 agot_sailing.1990.a:0 "Benim birinci kaptanım olacaklar!"

 agot_sailing.1991.t:0 "Uçsuz Bucaksız Okyanusa"

 agot_sailing.1991.desc:0 "Gemi limandan sendeleyerek ayrılırken [host.GetTitledFirstNameNicknamed]'i ve [host.GetHerHis] birinci kaptanı [first_mate.GetFirstName]'i görüyorum - maceramız başlarken bakışları ufka kilitlenmiş."

 agot_sailing.1991.a:0 "Ne avlayacağımızı görmek için sabırsızlanıyorum!"

 agot_sailing.1991.b:0 "İyi bir akın olacak!"

 agot_sailing.1991.c:0 "Kadim Valyria'nın gizemleri bizi bekliyor..."

 agot_sailing.1991.d:0 "Batık hazineler bizim olacak!"

 agot_sailing.2001.t:0 "Zar Oynamaya Davet"

 agot_sailing.2001.desc:0 "Geminin ana güvertesinde yürürken alt güverteden bir kalabalığın seslerini duyuyorum. Nöbette olmayan tüm güverte tayfaları bir masanın çevresinde toplanmış; duman ve içki buharları arasında kıyasıya bir zar oyunu sürüyor.\n\n""Gel buraya, kaptan,"" diye seslenir [first_mate.GetFirstName], ""Sana bunun nasıl oynandığını gösterelim!""\n\nKalabalıktan bir bağırış yükselir: ""[ROOT.Char.GetHerHis] tüm altınını alma, bir kısmı benim ücretim!"" ve ardından kahkaha gürültüsü."

 agot_sailing.2001.a:0 "Tabii! Zar oynarım!"

 agot_sailing.2001.b:0 "Beni kumar oynarken yakalayamazsın!"

 agot_sailing.2001.c:0 "Tayfamı tanımak için bir fırsat."

 agot_sailing.2002.t:0 "Zor Durumdaki Bir Gemi"

 agot_sailing.2002.desc:0 "Limandan pek uzak olmayan kıyı boyunca ilerlerken gözcülükteki tayfamdan biri, uzaklarda çırpınan yerel bir gemi gördüğünü söyleyerek haykırıyor.\n\nBuradan bile geminin sert denizlerden ya da akıncılardan hasar aldığı açık; tayfası güvertede koşuşturup onarımları yapmaya çalışırken gemiyi zar zor su üstünde tutuyor. Belli ki savunmasız bir durumdalar ve yardıma ihtiyaçları var."

 agot_sailing.2002.a:0 "Dur ve onlara yardım etmeyi dene!"

 agot_sailing.2002.a.tt_success:0 "Tayfayı kurtarıyorsun"

 agot_sailing.2002.a.tt_failure:0 "Gemi tayfası ve yüküyle birlikte batıyor"

 agot_sailing.2002.b:0 "Sağ kalanları öldürürsek ganimeti tutabiliriz..."

 agot_sailing.2002.b.tt_success:0 "Tekneyi basıp tayfasını öldürüyorsun"

 agot_sailing.2002.b.tt_failure:0 "Tekneyi basıyorsun, ama kaosun içinde yaralanıyorsun"

 agot_sailing.2002.c:0 "Boş ver, yanından geçip gidelim."

 agot_sailing.2003.t:0 "Leviathan"

 agot_sailing.2003.desc:0 "Güvertenin boydan boya yürürken derin bir nefes alıyorum; yüzüme çarpan serin deniz rüzgârı ve tuzlu hava. Bugün yelken açmak için güzel bir gün!\n\nKısa yolculuk, saray hayatına kıyasla canlandırıcı bir tempo değişikliği olmuştu; tam o sırada görüyoruz: uzakta bir su fıskiyesi, ardından dalgaların arasından yükselen şarap kızılı bir et adası.\n\nTüm derinliklerin en büyük canavarlarından biri.\n\nBir balina!"

 agot_sailing.2003.a:0 "Zıpkınları getirin!"

 agot_sailing.2003.a.tt_success:0 "Balinayı öldürüp kıyıya çekiyorsun"

 agot_sailing.2003.a.tt_failure:0 "Canavar senden kaçıyor"

 agot_sailing.2003.b:0 "Başkaları halletsin, bana sadece leşi getirin."

 agot_sailing.2003.c:0 "Ne #EMP muhteşem#! bir av!"

 agot_sailing.2003.c.tt:0 "Derinliklerin #EMP gerçek#! bir leviathanıyla karşı karşıyasın"

 agot_sailing.2003.c.tt_success:0 "$agot_sailing.2003.a.tt_success$"

 agot_sailing.2003.c.tt_failure:0 "$agot_sailing.2003.a.tt_failure$"

 agot_sailing.2003.d:0 "Ürkütücü görkemde bir yaratık, bırakalım gitsin."

 agot_sailing.2003.d.tt:0 "Balina özgürce gidiyor."

 agot_sailing.2004.t:0 "Açık Denizde Bir Savaş"

 agot_sailing.2004.desc:0 "Geniş açık okyanusta yelken açarken deniz sakin ve berrak görünüyor. Güvertede durup güneşin ışığının keyfini çıkarırken bir bağırış sessizliği yırtıyor.\n\n""Kaptan!"" diye bağırır birinci kaptanım, ""Bilinmeyen bir gemi yüksek hızla üzerimize geliyor!""\n\nHızla aracımın küpeştesine koşup ufku tarıyorum ve sonunda hızla yaklaşan karanlık bir form seçiyorum. Ne olduğu ortada - bir korsan gemisi. Çok geçmeden üstümüze gelecekler. Savaşalım mı, yoksa kaçalım mı?"

 agot_sailing.2004.a:0 "Gelsinler!"

 agot_sailing.2004.a.success:0 "Korsanları püskürtüyorsun"

 agot_sailing.2004.a.failure:0 "Korsanlar değerli eşyalarını yağmalıyor"

 agot_sailing.2004.b:0 "Yelkenleri açın!"

 agot_sailing.2005.t:0 "Denizci Denize Düştü!"

 agot_sailing.2005.desc:0 "Artık açık denizdeyiz; azgın sular bizi bir ileri bir geri sallıyor. Ayakta durmak zaman zaman zor olsa da idare edilebilir.\n\nBirden panik dolu bir ses keskin biçimde yükseliyor; dönünce denizcilerimden birinin kenardan düştüğünü görüyorum! Küpeşteye koşup başının dalgaların arasında oraya buraya savrulduğunu görüyorum.\n\nŞimdi harekete geçmeliyim, yoksa o azgın derinliklerde kesin ölecek."

 agot_sailing.2005.a:0 "Dayan, geliyorum!"

 agot_sailing.2005.a.tt_success:0 "Tayfa arkadaşını kurtarıyorsun"

 agot_sailing.2005.a.tt_failure:0 "Tayfa arkadaşını kurtaramıyorsun"

 agot_sailing.2005.b:0 "Sen, şu halatı kap! Sen, küçük tekneyi hazırla!"

 agot_sailing.2005.b.tt_success:0 "Kurtarma denemen başarılı oluyor"

 agot_sailing.2005.b.tt_failure:0 "Kurtarma denemen başarısız oluyor"

 agot_sailing.2005.c:0 "Çok geç - ambar kapaklarını kapatın!"

 agot_sailing.2006.t:0 "Bir İskambil Oyunu"

 agot_sailing.2006.desc:0 "Gece için kamarama çekilirken alt güverteden bir kalabalığın seslerini duyuyorum. Nöbette olmayan tüm güverte tayfaları bir masanın çevresinde toplanmış; duman ve içki buharları arasında kıyasıya bir iskambil oyunu sürüyor.\n\n""Gel buraya, kaptan,"" diye seslenir [first_mate.GetFirstName], ""Sana bunun nasıl oynandığını gösterelim!""\n\nKalabalıktan bir bağırış yükselir: ""[ROOT.Char.GetHerHis] tüm altınını alma, bir kısmı benim ücretim!"" ve ardından kahkaha gürültüsü."

 agot_sailing.2006.a:0 "Yer açın, ben de varım."

 agot_sailing.2006.a.tt_success:0 "Oyunu kazanıyorsun"

 agot_sailing.2006.a.tt_failure:0 "Altınını kaybediyorsun"

 agot_sailing.2006.b:0 "Peki, güvendiğim ekstra aslarım nerede?"

 agot_sailing.2006.b.tt_success:0 "Oyunun fark edilmiyor"

 agot_sailing.2006.b.tt_failure:0 "Yakalanıyorsun"

 agot_sailing.2006.c:0 "Oynamaya devam edin, beyler. Ben sadece bir içki içeceğim."

 agot_sailing.2007.t:0 "Dayanılmaz Nifak"

 agot_sailing.2007.desc:0 "Şimdiye dek yolculuk sorunsuz ilerledi, ama tayfadan homurtular yükselmeye başladığını fark ettim. Çok geçmeden, fazla çalışmış bir tayfa arkadaşı yanıma yaklaşıyor. Sakalı parlaktı ama çok fazla rıhtım görmüş bir denizcinin yıpranmış elleri var. Sesi sert, ama bıkkınlığı açık.\n\n"

 agot_sailing.2007.a:0 "Tayfaya ileri atılmalarını emret."

 agot_sailing.2007.a.tt_success:0 "Tayfa arzularının üzerine çıkıyor"

 agot_sailing.2007.a.tt_failure:0 "Essos'tan biraz daha ne zaman?"

 agot_sailing.2008.t:0 "Durgun Denizler"

 agot_sailing.2008.desc:0 "Günlerdir yelkenlerimizi dolduracak en ufak bir rüzgâr nefesi bile hissetmedik. Tayfanın huzursuzlaştığını görebiliyorum, ama bu konuda ne yapacağımı bilmiyorum. [first_mate.GetFirstName], [first_mate.GetHerHis] yüzünde ciddi bir ifadeyle beni kamaramda görmek istiyor.\n\n"

 agot_sailing.2008.a:0 "Pekâlâ, [ROOT.Char.GetFaith.WaterGodHerHim]'e altın ve dualar sunalım..."

 agot_sailing.2008.b:0 "Bu konuda daha fazla laf dinlemem; rüzgârları bekleyeceğiz!"

 agot_sailing.2008.c:0 "Tayfaya rüzgârların [ROOT.Char.GetFaith.WaterGodName] tarafından yönetilmediğini anlat."

 agot_sailing.2009.t:0 "Yıldızlar Aynı Parlıyor"

 agot_sailing.2009.desc:0 "Kamaramdan çıktığımda gece olmuş. Güverte alışılmadık derecede sessiz. Tayfadan birinin sessizce oturduğunu görüyorum; [stargazer.GetHerHis] gözleri yıldızlara dikili.\n\n"

 agot_sailing.2009.a:0 "Onları kullanarak yol bulabilirsin!"

 agot_sailing.2009.a.mariner_progress:0 "[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )] yaşam tarzı deneyimi kazanıyorsun."

 agot_sailing.2009.a.success.toast:0 "Denizcilik Bilgini Paylaşıyorsun"

 agot_sailing.2009.b:0 "Onları [ROOT.Char.GetFaith.NightGodName] yarattı. Şu yıldız kümesini görüyor musun? İşte o..."

 agot_sailing.2009.c:0 "Bir gün, denizlerde gezindiğimiz gibi onların arasında yelken açacağız."

 agot_sailing.2010.t:0 "Denizcilik Kazası!"

 agot_sailing.2010.desc:0 "Bir haftadır hava açık ve rüzgâr düzenli; yelken açmak kolay, gemideki moral yüksek.\n\nAni bir rüzgâr esintisi geldiğinde herkesi şaşırtıyor. Arkamdan bir imdat çığlığı duyuyorum; dönünce [sailor.GetFirstNameNoTooltip]'i güverteye serilmiş halde, [sailor.GetHerHis] bacağı kötü bir açıyla durmuş buluyorum.\n\n[first_mate.GetFirstName] endişeyle yanımda, talimatlarımı bekliyor."

 agot_sailing.2010.a:0 "Bana çabucak yelken bezi ve tahta direk getirin!"

 agot_sailing.2010.a.success:0 "İşi hakkıyla yapıyorsun"

 agot_sailing.2010.a.failure:0 "Durumu daha da kötüleştiriyorsun"

 agot_sailing.2010.b:0 "Bırak [sailor.GetHerHim]'i, [sailor.GetSheHe] bir dahaki sefere daha az sakar olur."

 agot_sailing.2010.c:0 "Gemiyi sen devral [first_mate.GetFirstNameNoTooltip], bununla başa çıkamıyorum!"

 agot_sailing.2011.t:0 "Aniden Çöken Sis"

 agot_sailing.2011.desc:0 "Limandan ayrılıp yola çıktıktan kısa süre sonra aracımızı, bir anda ortaya çıkmış gibi görünen hızla yükselen bir sis perdesi sarıyor. Gökyüzü de çevremizdeki okyanus da görünmez oluyor ve bir karar verilmesi gerektiği kısa sürede anlaşılıyor.\n\nSisin yakında dağılması umuduyla rotamızı koruyalım mı, yoksa gemiyi geri döndürüp gecikmeyi göze alarak büsbütün siste kaybolmaktan kaçınalım mı?"

 agot_sailing.2011.a:0 "Rotayı koru! Bu sis yakında dağılacak..."

 agot_sailing.2011.a.success:0 "Yoğun sisten kaçıyorsun"

 agot_sailing.2011.a.failure:0 "Aracın siste kayboluyor"

 agot_sailing.2011.b:0 "Gemiyi geri döndürüp gecikmeyi kabul etsek iyi olur"

 agot_sailing.2011.c:0 "Gerçek bir denizci sisten korkmaz - yelkenleri aç, dümdüz ileri!"

 agot_sailing.2020.t:0 "$agot_sailing.2002.t$: Tayfayı Kurtar"

 agot_sailing.2020.desc:0 "Uzaklarda bir gemi daha görüldü! Batmak üzere görünüyor; kısa bir görüşmenin ardından [host.GetTitledFirstNameNicknamed] batan geminin tayfasını kurtarmayı denemeye karar veriyor.\n\n"

 agot_sailing.2020.desc.jerk:0 "Denizcilerimiz gemiyi enkaza halat atacak kadar yaklaştırıp, köpüren suya halatlar atarak talihsiz geminin tayfasını tek tek çekmeyi başarırken tiksintiyle izliyorum.\n\nKıymetli zamanımızın ve emeğimizin israfı..."

 agot_sailing.2020.desc.normal:0 "Denizcilerimiz gemiyi enkaza halat atacak kadar yaklaştırıp, köpüren suya halatlar atarak talihsiz geminin tayfasını tek tek çekmeyi başarırken tatmin ve hayretle izliyorum.\n\nKendilerini kurtaran denizcilerimize teşekkür ediyor, bir sonraki limanda gemiden ayrılmayı teklif ediyorlar."

 agot_sailing.2020.a:0 "İyi iş çıkarıldı!"

 agot_sailing.2020.b:0 "[host.GetFirstNameNoTooltip] ne düşünüyordu ki..."

 agot_sailing.2020.c:0 "Bir geminin bu kadar çabuk batışını izlemek çok büyüleyici..."

 agot_sailing.2021.t:0 "$agot_sailing.2002.t$: Denizde Kayboldu"

 agot_sailing.2021.desc:0 "Uzaklarda bir gemi daha görüldü! Batmak üzere görünüyor; kısa bir görüşmenin ardından [host.GetTitledFirstNameNicknamed] batan geminin tayfasını kurtarmayı denemeye karar veriyor.\n\nEnkaza yaklaşırken yüksek bir çatırtı duyuluyor. Kırık geminin ana direği, güverteden kalanların üzerine devriliyor; dehşet içinde izlerken bütün gemi paramparça olup aç dalgalara yutuluyor.\n\nTayfadan ancak birkaç kişi kurtarılabiliyor; denizcilerin geri kalanı gemilerini sulu bir mezara kadar izliyor!"

 agot_sailing.2021.a:0 "Tanrılar aşkına! Ne felaket!"

 agot_sailing.2021.b:0 "Deniz acımasız bir metres..."

 agot_sailing.2022.t:0 "$agot_sailing.2002.t$: Gemiye Baskın"

 agot_sailing.2022.desc:0 "Uzaklarda bir gemi daha görüldü! Batmak üzere görünüyor; kısa bir görüşmenin ardından [host.GetTitledFirstNameNicknamed] enkazı yağmalamaya, sağ kalanları öldürmeye karar veriyor.\n\nDenizcilerimizin bitkin tayfayla çabucak işi bitirip, bulabilecekleri ne kadar ganimet varsa enkazı didik didik aramasını izliyorum. Geri döndüklerinde yüzlerindeki başarılı adam gülümsemelerini görüyorum."

 agot_sailing.2022.a:0 "Haramilikten gelen kazanç..."

 agot_sailing.2022.b:0 "Bir adamın kaybı, başkasının hazinesidir!"

 agot_sailing.2023.t:0 "$agot_sailing.2002.t$: Sessizce Uzaklaşmak"

 agot_sailing.2023.desc:0 "Uzaklarda bir gemi daha görüldü! Batmak üzere görünüyor; kısa bir görüşmenin ardından denizcilerin gemiyi yanaştırmasını izliyorum. [host.GetTitledFirstNameNicknamedPossessive] emriyle üzerlerine bindiler; bir kavga başladı. [host.GetTitledFirstNameNicknamed]'in bu sırada yaralandığına tanık oluyorum; ardından [host.GetSheHe] ve denizciler taşıyabildikleri kadar ganimetle geri dönüyorlar...."

 agot_sailing.2023.a:0 "Belki de böylesi daha iyiydi."

 agot_sailing.2024.t:0 "$agot_sailing.2002.t$: Yoldan Geçenler"

 agot_sailing.2024.desc:0 "Uzaklarda bir gemi daha görüldü! Batmak üzere görünüyor; ama kısa bir görüşmenin ardından [host.GetTitledFirstNameNicknamed] enkazdan kaçınmaya karar veriyor.\n\nGemimiz batan aracın yanından geçerken, tayfasının gemilerini sulu bir mezara kadar izleyerek feryat ettiğini görüyorum."

 agot_sailing.2024.a:0 "Umarım gemimiz onlarınkinden daha sağlam çıkar."

 agot_sailing.2024.b:0 "Deniz acımasız bir metres..."

 agot_sailing.2024.c:0 "Ganimetlerini biz alabilirdik..."

 agot_sailing.2024.d:0 "[host.GetFirstNameNoTooltip] geçip gitmekle haklı çıktı."

 agot_sailing.2025.t:0 "$agot_sailing.2003.t$: Canavarı Parçala"

 agot_sailing.2025.desc:0 "Ana güvertede dinlendirici bir yürüyüş yaparken denizcilerin heyecanla bağrıştıklarını duyuyorum. Bir balina görülmüş!\n\n[host.GetTitledFirstNameNicknamed] koca canavarı avlamayı deneme emri veriyor. Tayfalar zıpkınları hazırlıyor; ta ki bir mermi balinanın sırtını delene dek. Çalkalanan sular bir an kırmızıya dönüyor ve yaratık kısa bir mücadeleden sonra cansızlaşıyor.\n\nAdamların, parçalanmak üzere yakındaki bir kıyıya çekilebilmesi için leşe daha fazla halat bağlamasını izliyorum."

 agot_sailing.2025.a:0 "Bu kadar kudretli canavarlar bile öldürülebilir."

 agot_sailing.2025.b:0 "Görkemli ölümler uğursuz kehanettir."

 agot_sailing.2026.t:0 "$agot_sailing.2003.t$: Canavar Kaçıyor"

 agot_sailing.2026.desc:0 "Ana güvertede dinlendirici bir yürüyüş yaparken denizcilerin heyecanla bağrıştıklarını duyuyorum. Bir balina görülmüş!\n\n[host.GetTitledFirstNameNicknamed] koca canavarı avlamayı deneme emri veriyor. Tayfalar zıpkınları hazırlıyor, ama hiçbiri hedefi bulamıyor. Çok geçmeden balina dalıp gözden kayboluyor."

 agot_sailing.2026.a:0 "Hayal kırıklığı yaratan bir son!"

 agot_sailing.2026.b:0 "Belki de en iyisi böyle..."

 agot_sailing.2027.t:0 "$agot_sailing.2003.t$: Leşi Bul"

 agot_sailing.2027.desc:0 "Ana güvertede dinlendirici bir yürüyüş yaparken denizcilerin heyecanla bağrıştıklarını duyuyorum. Bir balina görülmüş!\n\n[host.GetTitledFirstNameNicknamed] koca canavarı avlamayı deneme emri veriyor. Tayfalar zıpkınları hazırlayıp fırlatıyor; ta ki bir mermi tam isabet edene dek. Deniz bir an kırmızıya dönüyor, ama balina zıpkını kırmayı başarıp kovalayanlardan kaçıyor.\n\nUzun bir arayışın ardından tayfa, yakındaki bir kıyıya vurmuş leşi bulup onu parçalamaya başlıyor."

 agot_sailing.2027.a:0 "Bizden sonsuza dek kaçamazdı."

 agot_sailing.2028.t:0 "$agot_sailing.2003.t$: Muhteşem Av"

 agot_sailing.2028.desc:0 "Ana güvertede dinlendirici bir yürüyüş yaparken denizcilerin heyecanla bağrıştıklarını duyuyorum. Muhteşem beyaz bir balina görülmüş!\n\n[host.GetTitledFirstNameNicknamed] deneyimli bir avcı; [host.GetSheHe] bu durumun hakkından elbette gelecektir. Zıpkınlar hazırlanıyor; havaya fışkıran tuzlu su sütunu canavarın yerini ele veriyor. [host.GetFirstNameNoTooltip] nişan alıp çengelli ucu leviathanın etine saplıyor ve gövdesine bir halat sıkıca bağlıyor. Gemimiz yaklaştıkça [host.GetFirstNameNoTooltip] bir mızrak çekip öldürücü darbeyi indiriyor."

 agot_sailing.2028.a:0 "Beyazla kırmızının harikası!"

 agot_sailing.2028.b:0 "Böyle bir görkem rahat bırakılmalıydı..."

 agot_sailing.2029.t:0 "$agot_sailing.2003.t$: Kısa Süren Ahmaklık"

 agot_sailing.2029.desc:0 "Ana güvertede dinlendirici bir yürüyüş yaparken denizcilerin heyecanla bağrıştıklarını duyuyorum. Muhteşem beyaz bir balina görülmüş!\n\n[host.GetTitledFirstNameNicknamed] deneyimli bir avcı; [host.GetSheHe] bu durumun hakkından elbette gelecektir. Zıpkınlar hazırlanıyor; havaya fışkıran tuzlu su sütunu canavarın yerini ele veriyor. [host.GetFirstNameNoTooltip] nişan alıyor, ama çengelli uç hedefi ıskalıyor. Leviathan derin ve hüzünlü bir şarkı kükreyerek sonsuza dek suyun altında gözden kayboluyor."

 agot_sailing.2029.a:0 "Belki [host.GetFirstNameNoTooltip] göründüğü kadar hünerli değildir."

 agot_sailing.2030.t:0 "$agot_sailing.2003.t$: Bir Canavarla Karşı Karşıya"

 agot_sailing.2030.desc:0 "Ana güvertede dinlendirici bir yürüyüş yaparken denizcilerin heyecanla bağrıştıklarını duyuyorum. Bir balina görülmüş!\n\nBir av servet getirebilirdi ama [host.GetTitledFirstNameNicknamed] canavara dokunmamaya karar veriyor. Görkemli yaratık geminin yanından geçip nefesini ve havaya tuzlu su fışkırtısı püskürtürken hayranlıkla izliyorum. Sonunda sakin dalgaların altına dalıp gözden kayboluyor."

 agot_sailing.2030.a:0 "Ne dingin bir deneyim!"

 agot_sailing.2030.b:0 "[host.GetFirstNameNoTooltip] canavarın kaçmasına izin vermekle aptallık etti..."

 agot_sailing.2031.t:0 "$agot_sailing.2004.t$"

 agot_sailing.2031.desc:0 "Uçsuz bucaksız ufka bakarken aniden alarm çığlıkları duyuluyor. Uzakta, doğrudan üzerimize gelen bir gemi görüldü. "Pirates!" the sailors cry, looking to [host.GetTitledFirstNameNicknamed] for guidance.\n\n"Worry not, men!" [host.GetSheHe] says with confidence. "They are no match for us!"\n\nIndeed, after a brief fight, the pirates are repelled and retreat, disappearing into the quiet ocean's vastness."

 agot_sailing.2031.a:0 "Ve bir daha geri gelme!"

 agot_sailing.2032.t:0 "$agot_sailing.2004.t$"

 agot_sailing.2032.desc:0 "Uçsuz bucaksız ufka bakarken aniden alarm çığlıkları duyuluyor. Uzakta, doğrudan üzerimize gelen bir gemi görüldü. "Pirates!" the sailors cry, looking to [host.GetTitledFirstNameNicknamed] for guidance.\n\n"Get ready to fight!" [host.GetSheHe] commands, drawing steel. Soon, the pirates are upon us.\n\nBut after a brief fight, the pirates overcome our crew, looting our valuables before disappearing into the wide ocean's vastness."

 agot_sailing.2032.a:0 "Belalarını alsınlar!"

 agot_sailing.2033.t:0 "$agot_sailing.2004.t$"

 agot_sailing.2033.desc:0 "Uçsuz bucaksız ufka bakarken aniden alarm çığlıkları duyuluyor. Uzakta, doğrudan üzerimize gelen bir gemi görüldü. "Pirates!" the sailors cry, looking to [host.GetTitledFirstNameNicknamed] for guidance.\n\n"Hoist all sails!" [host.GetSheHe] commands. "We can outrun them!" And indeed, our ship proves fast enough to keep the pirate vessel at a safe distance. Soon enough, the raiders give up and disappear into the horizon."

 agot_sailing.2033.a:0 "Gemide bir kadeh şerefe!"

 agot_sailing.2034.t:0 "$agot_sailing.2005.t$"

 agot_sailing.2034.desc:0 "Gemiyi başında düşüncelere dalmış dururken ani bir haykırış beni irkiltiyor. "Man overboard! Man overboard!"\n\nI rush towards the source of the clamor to see [host.GetTitledFirstNameNicknamed] jump from the ship's deck, plunging beneath the waves. When [host.GetSheHe] finally reappears, [host.GetSheHe] is dragging the drowning sailor back towards the ship."

 agot_sailing.2034.a:0 "Ne büyük iş!"

 agot_sailing.2035.t:0 "$agot_sailing.2005.t$"

 agot_sailing.2035.desc:0 "Gemiyi başında düşüncelere dalmış dururken ani bir haykırış beni irkiltiyor. "Man overboard! Man overboard!"\n\nI rush towards the source of the clamor to see [host.GetTitledFirstNameNicknamed] jump from the ship's deck, plunging beneath the waves. When [host.GetSheHe] finally reappears, I realize [host.GetSheHe] has come up empty-handed..."

 agot_sailing.2035.a:0 "Bir denizci daha kayboldu..."

 agot_sailing.2036.t:0 "$agot_sailing.2005.t$"

 agot_sailing.2036.desc:0 "Gemiyi başında düşüncelere dalmış dururken ani bir haykırış beni irkiltiyor. "Man overboard! Man overboard!"\n\nI rush towards the source of the clamor to see [host.GetTitledFirstNameNicknamed] shouting orders from the ship's deck, organizing a hasty rescue. Soon after, [host.GetSheHe] pulls the drowning sailor back aboard, saving his life."

 agot_sailing.2036.a:0 "Etkileyici!"

 agot_sailing.2037.t:0 "$agot_sailing.2005.t$"

 agot_sailing.2037.desc:0 "Gemiyi başında düşüncelere dalmış dururken ani bir haykırış beni irkiltiyor. "Man overboard! Man overboard!"\n\nI rush towards the source of the clamor to see [host.GetTitledFirstNameNicknamed] shouting orders from the ship's deck, organizing a hasty rescue. But to the crew's dismay, the drowning sailor has already disappeared beneath the waves..."

 agot_sailing.2037.a:0 "Talihsiz bir kayıp..."

 agot_sailing.2038.t:0 "$agot_sailing.2005.t$"

 agot_sailing.2038.desc:0 "Gemiyi başında düşüncelere dalmış dururken ani bir haykırış beni irkiltiyor. "Man overboard! Man overboard!"\n\nI rush towards the source of the clamor to see [host.GetTitledFirstNameNicknamed] shouting orders from the ship's deck. "Leave him! We have no time for a risky rescue attempt.""

 agot_sailing.2038.a:0 "Deniz gerçekten acımasız olabilir..."

 agot_sailing.2040.t:0 "$agot_sailing.2007.t$: Sızlananlar Defolun"

 agot_sailing.2040.desc:0 "Yolculuk şimdiye dek iyi gidiyor ama zamanla mürettebattan homurtular duymaya başlıyorum. Denizciler sıkı çalışıyor ama bazıları nifak çıkarıyor.\n\nAynı şikâyeti tekrar tekrar duyuyorum: "When will we explore Essos? We want to see more of Essos!"\n\n[host.GetTitledFirstNameNicknamed] soon grows tired of endlessly repeated questions and manages to convince the crew to focus on our planned destination."

 agot_sailing.2040.a:0 "Bu, onları susturur."

 agot_sailing.2041.t:0 "$agot_sailing.2007.t$: Essos'tan Biraz Daha Ne Zaman?"

 agot_sailing.2041.desc:0 "Yolculuk şimdiye dek iyi gidiyor ama zamanla mürettebattan homurtular duymaya başlıyorum. Denizciler sıkı çalışıyor ama bazıları nifak çıkarıyor.\n\nAynı şikâyeti tekrar tekrar duyuyorum: "When will we explore Essos? We want to see more of Essos!"\n\n[host.GetTitledFirstNameNicknamed] is equally annoyed but instructs the crew to rise above the whinging and simply ignore the discord."

 agot_sailing.2041.a:0 "Bu sorular ne zaman bitecek?"

 agot_sailing.2042.t:0 "$agot_sailing.2008.t$: Bir Adak"

 agot_sailing.2042.desc:0 "Günlerdir yelkenlerimizi dolduracak en ufak bir rüzgâr nefesi bile hissetmedik. Tayfanın huzursuzlaştığını görebiliyorum, ama bu konuda ne yapılabileceğini bilmiyorum.\n\n[host.GetTitledFirstNameNicknamed]'in geminin birinci kaptanıyla konuştuğu görülüyor; kaptan, gemiyi yeniden rüzgârla kutsamaları için tanrılara bir adak sunmaya kaptanı ikna etmeye çalışıyor. Ve gerçekten de [host.GetFirstNameNoTooltip] öneriyi çabucak kabul ediyor ve bir adak sunuluyor."

 agot_sailing.2042.a:0 "Umarım bu işe yarar..."

 agot_sailing.2043.t:0 "$agot_sailing.2008.t$: Bekleme Oyunu"

 agot_sailing.2043.desc:0 "Günlerdir yelkenlerimizi dolduracak en ufak bir rüzgâr nefesi bile hissetmedik. Tayfanın huzursuzlaştığını görebiliyorum, ama bu konuda ne yapılabileceğini bilmiyorum.\n\n[host.GetTitledFirstNameNicknamed]'in geminin birinci kaptanıyla konuştuğu görülüyor; kaptan, gemiyi yeniden rüzgârla kutsamaları için tanrılara bir adak sunmaya kaptanı ikna etmeye çalışıyor. Ama [host.GetFirstName] öneriye başını sallıyor."

 agot_sailing.2043.a:0 "Umarım burada mahsur kalmayız..."

 agot_sailing.2044.t:0 "$agot_sailing.2008.t$: Dindarca Bir Ders"

 agot_sailing.2044.desc:0 "Günlerdir yelkenlerimizi dolduracak en ufak bir rüzgâr nefesi bile hissetmedik. Tayfanın huzursuzlaştığını görebiliyorum, ama bu konuda ne yapılabileceğini bilmiyorum.\n\n[host.GetTitledFirstNameNicknamed]'in geminin birinci kaptanıyla konuştuğu görülüyor; kaptan, gemiyi yeniden rüzgârla kutsamaları için tanrılara bir adak sunmaya kaptanı ikna etmeye çalışıyor. Ama [host.GetFirstName] öneriye başını sallayıp tayfaya rüzgârların hiçbir deniz tanrısı tarafından yönetilmediğini anlatmaya çalışıyor."

 agot_sailing.2044.a:0 "Bu akıllıca mı?"

 agot_sailing.2045.t:0 "$agot_sailing.2010.t$"

 agot_sailing.2045.desc:0 "Günlerdir hava açık ve rüzgâr düzenli; yelken açmak kolay, tayfanın morali yüksek.\n\nAni rüzgâr esintisi nihayet geldiğinde herkesi şaşırtıyor. Yakınlardan bir imdat çığlığı duyuyorum; dönünce [sailor.GetFirstName]'i güverteye serilmiş halde, [sailor.GetHerHis] bacağı kötü bir açıyla durmuş buluyorum. [host.GetTitledFirstNameNicknamed] yaralı denizcinin yanında diz çökmüş, bacağı yerine oturtmaya çalışıyor.\n\nİç açıcı olmayan bir çıtırtıyla bacak daha doğal bir konuma yerleşiyor; denizcinin acısı neredeyse anında hafifliyor."

 agot_sailing.2045.a:0 "Aferin, kaptan!"

 agot_sailing.2046.t:0 "$agot_sailing.2010.t$"

 agot_sailing.2046.desc:0 "Günlerdir hava açık ve rüzgâr düzenli; yelken açmak kolay, tayfanın morali yüksek.\n\nAni rüzgâr esintisi nihayet geldiğinde herkesi şaşırtıyor. Yakınlardan bir imdat çığlığı duyuyorum; dönünce [sailor.GetFirstName]'i güverteye serilmiş halde, [sailor.GetHerHis] bacağı kötü bir açıyla durmuş buluyorum. [host.GetTitledFirstNameNicknamed] yaralı denizcinin yanında diz çökmüş, bacağı yerine oturtmaya çalışıyor.\n\nİç açıcı olmayan bir çıtırtıyla bacak dönüyor, ama denizcinin acı dolu çığlıkları kaptanın işleri daha da kötüleştirdiğini gösteriyor..."

 agot_sailing.2046.a:0 "Ah, hayır!"

 agot_sailing.2047.t:0 "$agot_sailing.2010.t$"

 agot_sailing.2047.desc:0 "Günlerdir hava açık ve rüzgâr düzenli; yelken açmak kolay, tayfanın morali yüksek.\n\nAni rüzgâr esintisi nihayet geldiğinde herkesi şaşırtıyor. Yakınlardan bir imdat çığlığı duyuyorum; dönünce [sailor.GetFirstName]'i güverteye serilmiş halde, [sailor.GetHerHis] bacağı kötü bir açıyla durmuş buluyorum. [host.GetTitledFirstNameNicknamed] yaralı denizcinin başında, [host.GetHerHis] yüzünde hoşnutsuz bir ifadeyle duruyor."

 agot_sailing.2047.a:0 "Sert ama doğru sözler."

 agot_sailing.2048.t:0 "$agot_sailing.2010.t$"

 agot_sailing.2048.desc:0 "Günlerdir hava açık ve rüzgâr düzenli; yelken açmak kolay, tayfanın morali yüksek.\n\nAni rüzgâr esintisi nihayet geldiğinde herkesi şaşırtıyor. Yakınlardan bir imdat çığlığı duyuyorum; dönünce [sailor.GetFirstName]'i güverteye serilmiş halde, [sailor.GetHerHis] bacağı kötü bir açıyla durmuş buluyorum. [host.GetTitledFirstNameNicknamed] yaralı denizcinin yanında duruyor, [host.GetHerHis] yüzünde dehşet ifadesi. Kaptanımız [first_mate.GetHerHim]'e durumu ele almasını emrettiği sırada [first_mate.GetName] az sonra geliyor..."

 agot_sailing.2048.a:0 "Umarım bacak yerine oturtulur."

 agot_sailing.2049.t:0 "$agot_sailing.2011.t$: Kaçış"

 agot_sailing.2049.desc:0 "Limandan ayrılıp yola çıktıktan kısa süre sonra gemimizi, bir anda ortaya çıkmış gibi görünen hızla yükselen bir sis perdesi sarıyor. Gökyüzü de çevremizdeki okyanus da görünmez oluyor. Kısa süre sonra bir şeyler yapılması gerektiği anlaşılıyor.\n\n[host.GetTitledFirstNameNicknamed] yönümüzü kaybetmeden sisten kurtulmayı umarak rotayı korumaya karar veriyor. Ve gerçekten de kumar işe yarıyor: sis dağılmaya başlıyor, gemi istediği rotaya geri dönüyor."

 agot_sailing.2049.a:0 "Ne şans!"

 agot_sailing.2050.t:0 "$agot_sailing.2011.t$: Kayboldu"

 agot_sailing.2050.desc:0 "Limandan ayrılıp yola çıktıktan kısa süre sonra gemimizi, bir anda ortaya çıkmış gibi görünen hızla yükselen bir sis perdesi sarıyor. Gökyüzü de çevremizdeki okyanus da görünmez oluyor. Kısa süre sonra bir şeyler yapılması gerektiği anlaşılıyor.\n\n[host.GetTitledFirstNameNicknamed] yönümüzü kaybetmeden sisten kurtulmayı umarak rotayı korumaya karar veriyor. Ama saatlerce yelken açtıktan sonra bile sisin sonu görünmüyor..."

 agot_sailing.2050.a:0 "Bizi hiç salacak mı?"

 agot_sailing.2051.t:0 "$agot_sailing.2011.t$: Geri Dön"

 agot_sailing.2051.desc:0 "Limandan ayrılıp yola çıktıktan kısa süre sonra gemimizi, bir anda ortaya çıkmış gibi görünen hızla yükselen bir sis perdesi sarıyor. Gökyüzü de çevremizdeki okyanus da görünmez oluyor. Kısa süre sonra bir şeyler yapılması gerektiği anlaşılıyor.\n\n[host.GetTitledFirstNameNicknamed] yönümüzü kaybetme tehlikesine karşı gemiyi geri döndürmeye karar veriyor. Bu elbette bir gecikmeye yol açacak, ama en azından günlerce siste kaybolmayız."

 agot_sailing.2051.a:0 "Akıllıca bir seçim!"

 agot_sailing.2052.t:0 "$agot_sailing.2011.t$: Manevra"

 agot_sailing.2052.desc:0 "Limandan ayrılıp yola çıktıktan kısa süre sonra gemimizi, bir anda ortaya çıkmış gibi görünen hızla yükselen bir sis perdesi sarıyor. Gökyüzü de çevremizdeki okyanus da görünmez oluyor. Kısa süre sonra bir şeyler yapılması gerektiği anlaşılıyor.\n\nDeneyimli bir denizci olan [host.GetTitledFirstNameNicknamed] hiçbir endişe belirtisi göstermiyor. ""Gerçek bir denizci sisten korkmaz,"" diyor [host.GetSheHe]. ""Rotamızı koruyun, dümdüz ileri! Sis yakında dağılacak."""

 agot_sailing.2052.a:0 "Umarım haklısındır..."

 agot_sailing.2100.t:0 "Ferahlatıcı Meltemler"

 agot_sailing.2100.desc:0 "Geminin en önünde durup atmosferin tadını çıkarırken okyanus rüzgârı saçlarımı okşuyor. #Italic Bu yolculuğa çıkmamın nedeni bu#!! diye geçiriyorum içimden. Kendimi nadiren bu kadar... rahat hissetmişimdir.\n\nBir an gözlerimi kapatıp düşüncelerimi salıyorum; yalnızca çarpan dalgaların sesine, ayaklarımın altındaki tahtaların yumuşak salınımına ve yakın kıyılardan gelen martıların silik çığlıklarına odaklanıyorum. Evet. Bu... işte bu."

 agot_sailing.2100.a:0 "Stresimin süpürülüp gittiğini hissediyorum..."

 agot_sailing.2101.t:0 "Konuşmak İçin Bir An"

 agot_sailing.2101.opening:0 "Aracımız uzakta kocaman bir deniz feneri olan büyük bir kasabanın yanından geçerken, yolcuların çoğu manzarayı hayranlıkla izliyor. [woo_target.GetFirstName] yakınlarda uzanmış: sıradan bir sohbet için ideal an şimdi."

 agot_sailing.2101.married:0 "[woo_target.GetHerHis] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], dikkati dağılmışken harekete geçiyorum."

 agot_sailing.2101.married_absent:0 "[woo_target.GetHerHis|U] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], çok uzaklarda..."

 agot_sailing.2101.currentspouse:0 "Belki bugün [woo_target.GetWomanMan]'ı kazanırım!"

 agot_sailing.2101.desc:0 "\n\n"Ah [woo_target.GetTitledFirstName], it's a rare chance to chat in the enclosure of a seaborne ship. I hope you're finding some enjoyment on this marvelous voyage," I say in a relaxed tone.\n\nI'm quite convinced that [woo_target.GetHerHis] smile carries more than mere politeness."

 agot_sailing.2101.a:0 "Açık sularda yelken açmaktan daha iyisi yoktur!"

 agot_sailing.2101.a.tt:0 "#F [woo_target.GetFirstNamePossessiveNoTooltip] hareketli yönüne hitap et.#!"

 agot_sailing.2101.b:0 "Dostlarla dünyanın güzelliklerini görmek, gerçekten yaşamaktır."

 agot_sailing.2101.b.tt:0 "#F [woo_target.GetFirstNamePossessiveNoTooltip] sosyal yönüne hitap et.#!"

 agot_sailing.2101.c:0 "Çalışkan denizcilere zaman zaman gerçekten acıyorum."

 agot_sailing.2101.c.tt:0 "#F [woo_target.GetFirstNamePossessiveNoTooltip] merhametli yönüne hitap et.#!"

 agot_sailing.2101.d:0 "Yeterince hünerli olsaydım geminin su üstünde kalmasına yardım ederdim."

 agot_sailing.2101.d.tt:0 "#F [woo_target.GetFirstNamePossessiveNoTooltip] çalışkan yönüne hitap et.#!"

 agot_sailing.2101.e:0 "Gerekirse okyanusun bereketi bütün kasabaları doyurabilir."

 agot_sailing.2101.e.tt:0 "#F [woo_target.GetFirstNamePossessiveNoTooltip] idareci yönüne hitap et.#!"

