 agot_sailing.3100.t:0 "Valyria'ya Rota Çizmek"

 agot_sailing.3100.desc:0 "[first_mate.GetFirstNameNoTooltip]'in, tayfanın geri kalanını toparlamaya başlayınca heyecanla dolduğunu görüyorum; tayfa çabucak yelkenleri açmaya ve demiri kaldırmaya koyuluyor.\n\nAlt güverteye, kamarama iniyorum; kaptan masasının üzerine serilmiş deniz haritalarının üzerine gün ışığının dolması için bir kapak açıyorum. [first_mate.GetFirstNameNoTooltip] içeri girip yanıma katılıyor.\n\n""Ee, lanetli Valyria topraklarına doğru yola çıkıyoruz, kaptan?"""

 agot_sailing.3100.a:0 "Her talimatımı uygulayın!"

 agot_sailing.3100.a.success:0 "Başarıyla bir rota çiziyorsun"

 agot_sailing.3100.a.success.tt:0 "Açık denize kendinden emin biçimde çıkıyorsun."

 agot_sailing.3100.a.failure.tt:0 "Makul bir rota bulamıyorsun."

 agot_sailing.3101.t:0 "Çizilen Rota"

 agot_sailing.3101.desc:0 "Haritalarımı uzun uzun inceleyip Valyria'nın tarihine dair notlarımla karşılaştırdıktan sonra On Dört Alev'e doğru doğuya bir rota çiziyorum.\n\nBir tüy kalem çıkarıp konumu büyük bir çarpıyla işaretliyor ve kendinden emin bir bakışla birinci kaptanıma dönüyorum.\n\n""Özgür Şehirler'in topraklarının yanından geçip Köle Körfezi'ne yöneleceğiz, oradan Dumanlı Deniz'e 260 derecelik bir pusula açısıyla gireceğiz!"""

 agot_sailing.3101.a:0 "Yolculuğumuz burada başlıyor."

 agot_sailing.3102.t:0 "Hâlâ Gizli Bir Yol"

 agot_sailing.3102.desc:0 "Haritalarımı uzun uzun inceleyip Valyria'nın tarihine dair notlarımla karşılaştırdığım halde On Dört Alev'in içinde iyi bir demir yeri için muhtemel bir noktayı bir türlü kesin olarak bulamıyorum. Gerçekten de samanlıkta iğne aramak gibi.\n\nGöz ucuyla [first_mate.GetFirstNamePossessiveNoTooltip] güveninin, [first_mate.GetSheHe] ne kadar şaşkın olduğumu fark ettikçe sönmeye başladığını görüyorum. Yavaşça [first_mate.GetSheHe] elini omzuma koyuyor.\n\n""Belki... bir başka sefere buluruz?"""

 agot_sailing.3102.a:0 "Sanırım [first_mate.GetSheHe] haklı. Ölümümüze yelken açarız."

 agot_sailing.3200.t:0 "Korkunç Bir Kraken"

 agot_sailing.3200.desc:0 "Yelken açarken içimdeki huzursuzluğu bir türlü atamıyorum, ara sıra derin sulara bakıyorum. Uzaklarda su yüzeyini bir anlığına yaran bir şey görüyor ve omurgamdan uğursuz bir ürperti iniyor. Onu yeniden görüyorum, yaklaşıyor; suda ilerleyen pullu bir şeyi seçebiliyorum artık.\n\nDaha net seçmeye başladıkça korku beni neredeyse yere seriyor - koca bir gemi büyüklüğünde, uzun dokunaçlı bir gövdesi ve tepeli bir başı var; daha önce hiç görmediğim bir şey. Bugün pek çok denizde bulunan çok daha küçük mürekkep balıklarının uzak akrabası olan efsanevi krakenterden biri. Onun bir efsane olduğunu sanıyordum!\n\nŞimdi çabuk karar vermeliyim; gemime bakarken gözleri kötücül bir arzuyla dolu, yaklaşıyor. Savaşıp yola devam mı edeyim, yoksa geri dönüp kaçmayı mı deneyeyim?"

 agot_sailing.3200.a:0 "Okçular, yaylarınızı hazırlayın! Bu canavarı öldüreceğiz!"

 agot_sailing.3200.a.success:0 "Krakensi başarıyla öldürüyorsun"

 agot_sailing.3200.a.success.tt:0 "Sen ve tayfan büyük zaferini kutluyorsunuz."

 agot_sailing.3200.a.failure:0 "Krakenin saldırısına yenik düşüyorsun"

 agot_sailing.3200.a.failure.tt:0 "@death_icon! Kraken gemini harap ediyor; ölümle yüz yüze geliyorsun."

 agot_sailing.3200.b:0 "Bizi buradan çıkarın! Onu yenebileceğimizi umamayız!"

 agot_sailing.3200.b.tt:0 "Limanın geri kaçmaya çalışıyorsun."

 agot_sailing.3200.b.success.tt:0 "Sen ve gemin yara almadan kaçmayı başarıyorsunuz."

 agot_sailing.3200.b.failure.tt:0 "Kaçıyorsun, ama gemin ciddi hasar alıyor."

 agot_sailing.3200.c:0 "Borunun gücünü deneme zamanı..."

 agot_sailing.3200.c_success:0 "Krakenin zihnini başarıyla bağlayıp gitmesini emrediyorsun"

 agot_sailing.3200.c_failure:0 "Krakenin zihnini bağlayamıyorsun ve gemini yok ediyor"

 agot_sailing.3201.t:0 "Kraken-Katili"

 agot_sailing.3201.t_horn:0 "Kraken-Komutanı"

 agot_sailing.3201.desc:0 "Canavar gemiye saldırmaya çalışırken tayfam ona ok yağdırıyor; ben de bir yandan ona daha güçlü bir darbe indirecek bir açık arıyorum. Sonunda, dişsiz gagasıyla beni kapmaya çalıştığı anda zar zor yana kaçıp [ROOT.Char.Custom('signature_weapon')] ile gözüne bir darbe indiriyorum.\n\nAcı içinde feryat eden canavar çırpınıp beni güverteye savuruyor. Ne var ki darbem tam isabet etti - canavar son bir çığlık atıp denize yığılıyor, leşi su yüzüne çıkıyor.\n\nTayfam çılgınca sevinç çığlıkları atıyor; bazıları kutlamak için gizli içki stoklarını açıyor. Birinci kaptanım [first_mate.GetFirstNameNoTooltip] omzuma şaplak indiriyor."

 agot_sailing.3201.desc_horn:0 "Tayfa arkamda geri çekilirken krakendorusunu dudaklarıma götürüp o derin, gök gürültüsü gibi yankılanan sesi çıkarıyorum. Ses denizin üzerinde yayılıyor ve birkaç an sonra koca canavar geri çekilmeye başlayıp geldiği derinliklerin içinde gözden kayboluyor. Artık borunun gerçek bir güç taşıdığından kuşku yok.\n\nTayfa çılgınca sevinç çığlıkları atıyor; bazıları kutlamak için gizli içki stoklarını açıyor. Birinci kaptanım [first_mate.GetFirstNameNoTooltip] omzuma sağlam bir şaplak indiriyor. ""Aferin, [ROOT.Char.GetTitleAsNameNoTooltip]! Canavarın hiç şansı yoktu!"""

 agot_sailing.3201.a:0 "Evet, evet! Ve artık yolumuz açık..."

 agot_sailing.3201.b:0 "Yeter bu saçmalık, bir içkiye ihtiyacım var!"

 agot_sailing.3202.t:0 "Lezzetli Bir Atıştırmalık"

 agot_sailing.3202.desc:0 "Korkunç kraken, tayfamın çaresizce dizdiği okları hiçe sayıp sağa sola tayfa kapıyor!\n\nAz sonra sıra bana geliyor. Bir kez kaçıyorum, iki kez, sonra... hiçbir şey."

 agot_sailing.3202.a:0 "Hayır... böyle değil!"

 agot_sailing.3202.a.success.tt:0 "Bir şekilde canını kurtarmayı başarıyorsun."

 agot_sailing.3202.a.failure.tt:0 "@death_icon! Bütün halde yutuluyorsun, bir daha asla görülmüyorsun."

 agot_sailing.3300.t:0 "Tükenen Erzaklar"

 agot_sailing.3300.desc:0 "Denizde uzun zaman geçirdim; şiddetli karşı rüzgârlar yüzünden umduğum kadar yol alamadım. Daha kötüsü, birinci kaptanım erzaklarımızın tehlikeli biçimde azaldığını ve hedefimize varmadan tükeneceğimizi söylüyor. Tayfamın arasında şimdiden kavgalar başladı; liderliğim olmadan bu yolculuk kesinlikle felaketle sonuçlanacak.\n\nHavuç mu sopa mı kullanacağıma karar verme zamanı. Elimizde kalan erzakları biraz daha uzatacak adil bir yol tasarlamayı deneyebilirim ya da savaşta erzak idaresi bilgimi kullanarak demirden bir yumrukla disiplin dayatabilirim.\n\nBir alternatif olarak erzaklarımız limana dönüş yolculuğuna yeterdi; ama şimdi gerçekten pes edebilir miyim?"

 agot_sailing.3300.a:0 "Elimizde kalanın yeteceğinden eminim..."

 agot_sailing.3300.a.success:0 "Kalan erzakları başarıyla tayınlıyorsun"

 agot_sailing.3300.a.success.tt:0 "Yolculuğu karşılayacak kadar yiyecek ve içeceğin olacak."

 agot_sailing.3300.a.failure:0 "Tayın miktarını yanlış hesaplıyorsun"

 agot_sailing.3300.a.failure.tt:0 "@death_icon! Sen ve tüm tayfan denizde açlıktan öleceksiniz."

 agot_sailing.3300.b:0 "Cevap disiplindir; bu gemi artık savaş düzeninde!"

 agot_sailing.3300.b.success:0 "Tayfanı başarıyla dizginliyorsun"

 agot_sailing.3300.b.success.tt:0 "Lojistik bilgin ve adamlar arasındaki disiplin talebin, açlıktan ölmemeni sağlıyor."

 agot_sailing.3300.b.failure:0 "Durumu idare edemiyorsun"

 agot_sailing.3300.b.failure.tt:0 "@death_icon! Sert tavrın ve disiplini sağlayamaman tayfayı isyana sürüklüyor; tayfa zorbalığından kurtuluyor."

 agot_sailing.3300.c:0 "Sanırım denedim, ama risk etmeye değmez."

 agot_sailing.3300.c.tt:0 "Limanın yolunu tutuyorsun."

 agot_sailing.3300.d:0 "[man_meat.GetName] korkunç derecede iştah açıcı görünüyor..."

 agot_sailing.3300.d.tt:0 "Tayfayı doyurmak için [man_meat.GetNameNoTooltip]'i yemeyi seçiyorsun"

 agot_sailing.3301.t:0 "Dikkatli Tayın"

 agot_sailing.3301.desc:0 "Bazı hesapçı tutumlarla, gemimde katı bir tayın rejimi uygulayarak sınırlı erzaklarımızı adil bir şekilde uzatmayı başardım.\n\nKarnımız yolculuğumuzun ilk ayağındaki kadar dolu olmasa da, en azından hiçbir tayfa üyesi adaletsizlik diye bağıramaz."

 agot_sailing.3301.a:0 "Biri sana, biri bana."

 agot_sailing.3302.t:0 "Açlık"

 agot_sailing.3302.desc:0 "Gemideki herkes için makul bir günlük yiyecek ve su tayını hesapladığımda moral yüksekti. Ama neşe çok geçmeden umutsuzluğa dönüştü; stoklarımız kurudu, kıyıdan kilometrelerce uzakta, karadan iz yok.\n\nBoğazım kupkuru, karnım en acı kramplarla ağrıyor. Ömrüm azaldı; tayfamın çoğu şimdiden can verdi.\n\nNe oldu?"

 agot_sailing.3302.a:0 "Elde var bir değeri eklemeyi mi unuttum?"

 agot_sailing.3303.t:0 "Kıt Kanaat Geçinmek"

 agot_sailing.3303.desc:0 "Tayfamın ilk direnişine rağmen, sağlam bir elle ve tavizsiz bir tutumla erzak durumumuzun kontrolünü yeniden ele geçirmeyi başardım.\n\nMoraller sarsılmış olabilir ve guruldayan karınların sesi sıradanlaştı - ama en azından önümdeki yolculuğa yeniden odaklanabilirim."

 agot_sailing.3303.a:0 "Yapılması gerekiyordu."

 agot_sailing.3304.t:0 "İsyan"

 agot_sailing.3304.desc:0 "Tayfamı demirden bir yumrukla dizginleme çabalarım felaketle sonuçlandı. Aç ve hoşnutsuz adamlarım, bizi efsanevi hedefimize götürecek gücü bulamadı ve gemimi isyan edip devirdi!\n\nKollarımı arkamdan sıkıca bağlayıp benimle ne yapacaklarını tartışırlarken beni armalardan sürüklediler. Ardından, görünen elebaşları [mutiny_leader.GetTitledFirstNameNicknamed] beni ayağa kaldırıp geminin kenarından sarkan, aceleyle kurulmuş kalasın üzerine itti; geri dönüşümü uzattığı kılıçla koruyor.\n\n"

 agot_sailing.3304.a:0 "Korkaklar! Hainler!"

 agot_sailing.3305.desc:0 "Uzun süredir denizdeyiz; şiddetli karşı rüzgârlar yüzünden ilerlememiz umduğumuzun çok altında. Daha kötüsü, erzaklar tehlikeli biçimde tükeniyor...\n\n[host.GetTitledFirstNameNicknamed] tayfayı katı tayınlar uygulamaya ikna etmeye çalıştı, ama çok az, çok geç. Erzağın sonu geldi; yakında biz de öyle olacağız."

 agot_sailing.3305.a:0 "Lütfen, sadece bir ısırık..."

 agot_sailing.3306.t:0 "Suda Yem"

 agot_sailing.3306.desc:0 "Yolculuk korkunç biçimde ters gitti ve erzaklarımız kırıntılara kadar tükendi... Gemidekilerin bazıları, fare yakalama denemeleri başarısız olduktan sonra ipin yıpranmış uçlarını kemirmeye bile başladı.\n\n[man_meat.GetTitledFirstName] açlık sancılarından durmadan yakınıyor; sanki geri kalanımız aynı acıyı hissetmiyormuşuz gibi. Bu, bir [ROOT.Char.GetWomanMan]'ı #emp deli etmeye#! yeter de artar!\n\n[man_meat.GetHerHis|U] şikâyetleri [man_meat.GetHerHis] tüm enerjisini tüketmişe benziyor ve [man_meat.GetSheHe] bayılıp güverteye seriliyor. [man_meat.GetHerHis] sıska bacaklarının ne kadar... yumuşak göründüğünü fark etmemek elde değil. #emp Ah, bir parça et... Ruhumu canlandırmak için kesinlikle ihtiyacım olan şey bu!#!"

 agot_sailing.3306.a:0 "Et yeniden menüde, beyler!"

 agot_sailing.3306.d.tt:0 "[man_meat.GetTitledFirstName]'i yiyip bitiriyorsun ve tayfana da dadanma seçeneği sunuyorsun."

 agot_sailing.3307.desc:0 "Yolculuk korkunç biçimde ters gitti ve erzaklarımız kırıntılara kadar tükendi... Gemidekilerin bazıları, fare yakalama denemeleri başarısız olduktan sonra ipin yıpranmış uçlarını kemirmeye bile başladı.\n\n[man_meat.GetTitledFirstName] açlık sancılarından durmadan yakınıyor; sanki geri kalanımız aynı acıyı hissetmiyormuşuz gibi. Bu, bir [ROOT.Char.GetWomanMan]'ı #emp deli etmeye#! yeter de artar!\n\n[man_meat.GetFirstNameNoTooltip] bayılıp güverteye serildiğinde, [host.GetTitledFirstNameNicknamed]'in [man_meat.GetHerHim]'e tehditkâr bir bakış attığını fark ediyorum. #emp Elbette, [host.GetSheHe] [man_meat.GetHerHim]'i yemeyi aklından geçirmiyordur!#!\n\nÖlüm çabuk geldi; korkunun etin tadını bozduğu söylenir, [host.GetFirstNameNoTooltip] [man_meat.GetFirstNamePossessiveNoTooltip] boğazını [man_meat.GetHerHis] uykusunda kesti. Demir kokulu kanın kokusu burnumda. Karnım gurulduyor. #emp Sonuçta, neden olmasın? [man_meat.GetSheHe|U] zaten ölü!#!"

 agot_sailing.3307.a:0 "Hayatta kalmak için yaptıklarımıza bak!"

 agot_sailing.3307.b:0 "Hayır, hayır, kendi ayartılarıma göğüs germeliyim."

 agot_sailing.3307.b.success_tt:0 "Az tayınla açlığı savuşturmayı başarıyorsun"

 agot_sailing.3400.t:0 "Valyria Kıyameti'nin Deliliği"

 agot_sailing.3400.desc:0 "Histeri sesleriyle uyanıyorum. Kamaramdan çıktığımda, her zaman soğukkanlı olan birinci kaptanım [first_mate.GetFirstName]'i kapımın önünde hıçkırırken buluyorum. Başka bir tayfa üyesi aramadan önce [first_mate.GetHerHim]'i sarsıp bir cevap almaya çalışıyorum.\n\nTayfanın arasında dolaşıp titreyen elleri ve boş gözleri olan denizcileri sorguluyorum. Herkes aynı görüntüden söz ediyor - alev ve küle yeniden doğan Valyria'nın Kıyameti; taşı da eti de yutan, denizi bile kaynatan bir ateş fırtınası. Bu görüntüler zihinlerine dağlama gibi kazınmış.\n\nGemim suyun üzerinde ölü yatıyor. Ne bir yelken kalktı ne bir kürek çekildi. Tayfa güvertenin dört bir yanında kümeler halinde büzüşüp eski ve yeni tanrılara dua fısıldıyor. İleri gitmeyecekler. #EMP Gidemezler#!.\n\n""Geri dön, kaptan,"" diye yalvarır [first_mate.GetFirstNameNoTooltip], sesi çatlıyor. ""Kıyamet bizi uyarıyor. Valyrialıların yandığı gibi yanacağız."" Diğerleri [first_mate.GetHerHis] yalvarışını tekrarlıyor; korkuları gemide salgın gibi yayılan canlı bir şey."

 agot_sailing.3400.a:0 "Cesur olun, dostlarım: bu yalnızca bir rüya. Neredeyse geldik!"

 agot_sailing.3400.a.success:0 "Sözlerin tayfanı rahatlatıyor"

 agot_sailing.3400.a.success.tt:0 "Tayfanı toparlayıp amacına dair şüphelerini gideriyorsun"

 agot_sailing.3400.a.failure:0 "Sözlerin kulak ardı ediliyor"

 agot_sailing.3400.a.failure.tt:0 "Tayfan umutsuzluğa kapılıp hayatta kalmalarını garantiye almak için seni esir alıyor"

 agot_sailing.3400.b:0 "Kıyamet sizin kafanızda, ama #EMP ben#! tam buradayım!"

 agot_sailing.3400.b.desc:0 "Yüksek [dread|E] değerini kullanıp tayfa arkadaşlarını akılsızlıklarından kurtarmaya çalışıyorsun."

 agot_sailing.3400.b.success.tt:0 "Tayfanı gazabına uğramamak için şüphelerini görmezden gelerek korkutup iş başına döndürüyorsun"

 agot_sailing.3400.b.failure.tt:0 "Tehditlerin tayfanı, şüphelerinin üstesinden gelecek kadar korkutamıyor"

 agot_sailing.3400.c:0 "Kemiklerimdeki soğuğu hissediyorum... geri dönmeliyiz."

 agot_sailing.3400.c.tt:0 "Limana geri dönüyorsun"

 agot_sailing.3401.t:0 "Delilik Sönüyor"

 agot_sailing.3401.desc:0 "Sözlerim tayfamı sarmış olan ateşli rüyayı yarıyor. Olan biteni görüyorum - gözlerindeki vahşi ışık sönüyor, yerini daha sağlam bir şey alıyor. Akıl, gelgit gibi geri dönüyor.\n\nTayfa tek tek kendine geliyor. [first_mate.GetFirstName] bana katılıyor, gözleri önümüzdeki yolculuk için berrak. Pruvamızı bir kez daha doğuya, o uzak, lanetli sulara çeviriyoruz.\n\nTayfa sessizce çalışıyor; ama bu artık korkunun sessizliği değil. Uçuruma bakıp yine de ileri yelken açmayı seçmiş adamların sessizliği."

 agot_sailing.3401.a:0 "Korkuya hükmettik."

 agot_sailing.3402.t:0 "Delilik Ele Geçiriyor"

 agot_sailing.3402.desc:0 "Dinlemiyorlar. Önce mantıkla deniyorum, sonra komutla - sesim bıçak kadar keskin. Ama korku onları sarmış ve korku, insanları kendi güm güm atan kalplerinden başka her şeye sağır eder.\n\nDümenin yanına gittiğimde [first_mate.GetFirstName] önümü kesmek için hareket ediyor. Birinci kaptanım [first_mate.GetSheHe] yavaşça başını sallıyor."

 agot_sailing.3402.a:0 "Ben deli değilim! #EMP Siz#! hepiniz delisiniz!"

 agot_sailing.3500.t:0 "Fırtınalar Ordusu"

 agot_sailing.3500.desc:0 "Sonunda her şey yolunda gidiyor. Ölçümlerime göre, kayıp Valyria'nın bulunduğu yere yaklaşıyor olmalıyım; denizler bize nazik davrandı - iyi rüzgârlar, sakin dalgalar.\n\nNe var ki bu düşünceleri kurarken her şey değişiyor. Rüzgâr aracımı dövüyor, dalgalar derinlerdeki davullar gibi üzerine iniyor. Sonra yağmur başlıyor - önce bir damla, ardından bardaktan boşanırcasına. En sakin günün içinden, hayatım boyunca görmediklerimden farklı, öyle bir öfkeyle fırtına doğuyor.\n\nSağanak yağışın arasından geminin üzerinde toplanan giderek daha çok fırtına bulutu görebildiğimi sanıyorum. Bir dalga yüzüme çarpıp derinliklere geri çekiliyor. Yine de bunu düşünecek vaktim yok - fırtınaya göğüs germeyi mi yoksa son engelde geri dönmeyi mi seçmeliyim?"

 agot_sailing.3500.a:0 "Bu fırtınaya #EMP mutlaka#! hükmetmeliyiz!"

 agot_sailing.3500.a.success:0 "Fırtınayı atlatmayı başarıyorsun"

 agot_sailing.3500.a.success.tt:0 "Fırtınayı güvenle atlatmak için denizdeki tüm deneyiminden yararlanıyorsun"

 agot_sailing.3500.a.failure:0 "Gemin fırtınada kayboluyor"

 agot_sailing.3500.a.failure.tt:0 "@death_icon! Fırtına senin için fazla ağır oluyor ve dalgaların arasında kayboluyorsun"

 agot_sailing.3500.b:0 "Bu delilik! Geri dönmeliyiz!"

 agot_sailing.3500.b.tt:0 "Limana geri dönüyorsun"

 agot_sailing.3501.t:0 "Fırtınaya Binmek"

 agot_sailing.3501.desc:0 "Dümenle boğuşuyorum, gemiyi bir azgın dalganın tepesinden daha aşıyorum. Gök gürlüyor, şimşek karanlığı deliyor.\n\nArmaları yeniden ayarlamak için emirler ve talimatlar yağdırıyorum; denizciler emirlerimi yerine getirmek için öfkeyle çalışıyor. Gemim hırpalanmış ve yara bere içinde, ama pes etmeyi reddediyorum.\n\nSonunda, ne var ki rüzgârlar sakinleşmeye, dalgalar alçalmaya başlıyor. Fırtına yatışıyor; güneş bulutların arasından ilk kez sıyrıldığında bundan daha güzel bir manzara hayal edemiyorum. Önüme çıkan tüm gelgitlere hükmederek, eşi benzeri olmayan bir fırtınaya göğüs gerdim.\n\nVe uzaklarda... olabilir mi?"

 agot_sailing.3501.a:0 "Yelkenleri açın, neredeyse geldik!"

 agot_sailing.3502.t:0 "Sulu Bir Mezar"

 agot_sailing.3502.desc:0 "Adamlarıma emirler yağdırarak fırtınayla çaresizce boğuşuyorum. Ama bu sıradan bir fırtına değil.\n\nRüzgârların uzun süredir hırpaladığı ana direk dayanamayıp çatırdayarak ana güverteye devrilirken o yüksek çıtırtıyı duyuyorum. Gemi parçalanmaya başlıyor ve azgın dalgalar beni derinlere sürüklüyor.\n\nDuyduğum son şey, çevremdeki azgın suların her yanı yutan gümbürtüsü...\n\nVe sonra karanlık çöküyor."

 agot_sailing.3502.a:0 "N-gh..."

 agot_sailing.3503.desc:0 "[host.GetFirstName]'in adamlara devam etmelerini emretmeye çalıştığını duyuyorum. Ama bu sıradan bir fırtına değil.\n\nRüzgârların uzun süredir hırpaladığı ana direk dayanamayıp çatırdayarak ana güverteye devrilirken o yüksek çıtırtıyı duyuyorum. Gemi parçalanmaya başlıyor ve azgın dalgalar beni derinlere sürüklüyor.\n\nDuyduğum son şey, çevremdeki azgın suların her yanı yutan gümbürtüsü...\n\nVe sonra karanlık çöküyor."

 agot_sailing.3900.t:0 "On Dört Alev"

 agot_sailing.3900.desc:0 "Sonunda paramparça adaları görünce yüzümde çılgın bir gülümseme beliriyor, ağzımdan hafif histerik bir kahkaha taşıyor. Başardık. Mücadeleler büyüktü, çoğu kişi bunun imkânsız olduğundan şüphe ediyordu - ama başardık. Bu, kesinlikle Valyria'nın On Dört Alev'i'nden geriye kalan olmalı.\n\nAncak yaklaştıkça düşünceli bir halde kaşlarımı çatıyorum. Karaya çıkmayı deneyecek miyiz?\n\nHer yandan sarp kayalık yüzeyleri kolay bir çıkışı imkânsız kılıyor - ve suyun ve kayaların üzerinden her yandan duman yükseliyor. Üstüne çıkmak, kendi üzerimize kıyamet çağırmak demek - tıpkı eskiden ejderha efendilerinin başına gelen kıyamet gibi.\n\nŞimdi bir seçimim var - çıkmak mı, yoksa uzaktan hayran hayran izlemek mi?"

 agot_sailing.3900.a:0 "Riske değmez; buraya sadece gelmek bile türküye değer!"

 agot_sailing.3900.a.tt:0 "Aracından Valyria'ya saygıyla bakıyorsun"

 agot_sailing.3900.b:0 "Buraya kadar geldim; hadi bir iniş noktası bulalım."

 agot_sailing.3900.b.success:0 "Valyria harabelerini keşfetmeyi başarıyorsun"

 agot_sailing.3900.b.failure:0 "Keşfin ani bir kazayla sonuçlanıyor."

 agot_sailing.3901.t:0 "Valyria'nın Görkemi"

 agot_sailing.3901.desc:0 "Paramparça adalardan herhangi birine çıkma girişiminden vazgeçiyorum; sarp kayalıklar ve taşlık kıyılar beni yaklaşmaktan alıkoyuyor. Buna rağmen gemiyi olabildiğince yaklaştırıyor, durmadan daha da yaklaşıyoruz. Yaklaştıkça Valyria'nın Kıyameti'nin boyutları gözler önüne seriliyor. Her yanı saran dumanın arasından yıkık kuleler, sütunlar, büsbütün harap olmuş kentler ve konutlar görülüyor. Yine de böyle korkunç bir durumda bile On Dört Alev'in bir zamanlar ne kadar görkemli olduğu sezilebiliyor.\n\nSonunda, adaların çevresinde defalarca dönüp durduktan sonra, gönül rahatlığıyla eve dönüyoruz. Başkalarının bir efsane sandığı şeyi bulduk, eşi benzeri olmayan tehlikelere göğüs gerdik ve çoktan kaybolmuş Valyria'nın son kalıntısına şahit olduk. Hünerimden ya da ünümden kimse şüphe duyamaz."

 agot_sailing.3901.a:0 "Bu manzarayı asla unutmayacağım."

 agot_sailing.3902.t:0 "Harabeleri Keşfetmek"

 agot_sailing.3902.desc:0 "Gemiye ayak basacak bir yer bulmaya çalışarak dikkatlice iniyor, yukarı bakıyorum. Çoğu dalgalara yenik düşmüş olsa da, bu adayı şekillendiren yanardağın zirvesi hâlâ göğü deliyor; sarp kayalıklar köpüren dalgaların çok üzerine yükseliyor. Gözlerimi kısarak en sonunda, Kıyamet yüzünden büsbütün parçalanmış, kayalığın yüzeyine oyulmuş zamana direnen basamaklara giden, engebeli kayaların arasından bir yol buluyorum.\n\nBasamakları tırmandıktan sonra sonunda, bir şekilde büyük ölçüde sağlam kalmış kadim bir Valyria sarayına ulaşıyorum. Sessiz yapıdan duman sızıyor, çevresine bir umutsuzluk havası çökmüş. Değerli bir şey bulmak için etrafa bakınıyorum..."

 agot_sailing.3902.a:0 "Burada geriye harabelerden başka bir şey kalmamış."

 agot_sailing.3902.b:0 "Dağılın! Başka ne bulabileceğimize bakalım!"

 attempt_to_leave_valyria:0 "Valyria'dan ayrılmaya çalışıyorsun"

 valyrian_artifact:0 "Eski Valyria'dan bir [artifact|E] buldun"

 guest_reached_valyria_tt:0 "Her konuk [GetModifier( 'guest_reached_valyria' ).GetNameWithTooltip|L] kazanır"

 agot_sailing.3903.t:0 "Deniz Macerası Hezimeti"

 agot_sailing.3903.desc:0 "Rota bizi Dumanlı Deniz'i kaplayan kırık ve buharlı kayalıkların yanından geçirirken güvertede duruyorum. Zihnimde, kadim Valyria'nın harabelerinde gizli olduğundan emin olduğumuz sayısız hazineyi şimdiden görüyorum. Altın, mücevher ve elbette paha biçilemez Valyria çeliği... Yakında hepsi benim olacak...\n\nYüksek bir #italic çatırtı#! beni gerçeğe döndürüyor; gökyüzü bir anda kül ve ateşle doluyor. Yanan kayalardan oluşan bir yağmur gemiyi sarıyor; alevler hızla yayılmaya başlıyor. Dehşetle izlerken yelkenler tutuşuyor, alevler direkten güverteye sıçrıyor.\n\nPanik ve acı çığlıkları arasında çevremi dayanılmaz bir ısı sarıyor. Düşünmeden aşağıdaki azgın sulara atlıyorum; gözlerimin önünde geminin batışını görüyorum. Enkazdan uzaklaşmak için çılgınca kürek çekiyorum..."

 agot_sailing.3903.a:0 "Ben— yüzmeye... devam etmeliyim..."

 agot_sailing.3904.t:0 "Harabelerdeki Tehlike"

 agot_sailing.3904.desc_one:0 "Karaya ayak bastığımızda, Dumanlı Deniz'e tepeden bakan sarp kayalıkların zirvesine çıkan kırık bir yol buluyoruz. Basamaklar tehlikeli; bizi çok yavaş ilerlemeye zorluyor. Sonunda zirveye ulaşıyor, bir zamanlar Valyrialı bir ejderha efendisinin görkemli malikânesine ait olabilecek harap bir avluya varıyoruz.\n\nYoldaşlarıma dönüyorum. ""Birilerinin buraya gelebileceğinden çoğu kişi şüphe etti, ama biz bütün kötüleyenlere karşı geldik! Şimdi Valyria'nın zenginlikleri alınmayı bekliyor! Haydi-""\n\nKonuşmamı arkamızdan yükselen yüksek bir #italic kükreme#! kesiyor. Tam zamanında döndüğümde doğaüstü bir hızla üzerime sıçrayan korkunç, pullu bir yaratık görüyorum..."

 agot_sailing.3904.desc_two:0 "Karaya ayak bastığımızda, Dumanlı Deniz'e tepeden bakan sarp kayalıkların zirvesine çıkan kırık bir yol buluyoruz. Basamaklar tehlikeli; bizi çok yavaş ilerlemeye zorluyor. Sonunda içinden duman tüten küçük bir mağaraya ulaşıyoruz\n\n""Bu da ne?"" diye nefesimi tutarak söylüyorum; küçük bir yaratık ortaya çıkıyor. Tüyleri kar gibi bembeyaz, ama başından koyu renkli, pullu dokunaçlar fışkırıyor.\n\n""Sadece bir tavşan!"" Ama yaklaştığımızda bu pis yaratık kocaman, keskin dişleriyle ileri atılıyor. Adamlarımdan birinin kafasını koparışını dehşet içinde izliyorum...\n\n""KAÇIN!"" diye bağırıyorum, ama hepimiz için çok geç olduğunu biliyorum."

 agot_sailing.3904.desc_three:0 "Karaya ayak bastığımızda, Dumanlı Deniz'e tepeden bakan sarp kayalıkların zirvesine çıkan kırık bir yol buluyoruz. Basamaklar tehlikeli; bizi çok yavaş ilerlemeye zorluyor. Sonunda içinden duman tüten küçük bir mağaraya ulaşıyoruz.\n\nMağaranın ağzında, pullu taşlardan oluşan küçük bir kav kafesi fark ediyorum... #italic Olabilir mi?!#!\n\n#EMP Ejderha yumurtaları!#! Onlara doğru koşarken kalbim güm güm atıyor. Ama elim kav kafesindeki en büyük yumurtaya değdiği anda yumurta tükürür gibi hırlayıp çatlayarak açılıyor. Çıkardığı sonraki sesin - yeri sarsan, delici bir çığlığın - tanrılar bile adını koyamaz. Kafamın iki yanından aşağı süzülen kanın sıcaklığını hissedecek kadar acıya dayanıyorum; beynim kafamın içinde eriyor."

 agot_sailing.3904.desc_four:0 "Karaya ayak bastığımızda, Dumanlı Deniz'e tepeden bakan sarp kayalıkların zirvesine çıkan kırık bir yol buluyoruz. Basamaklar tehlikeli olduğundan tırmanırken bir elimi kayalığın yüzeyinde tutuyorum. Ama adımlarım o kadar dikkatli değil ve gevşek bir taşa takılıyorum.\n\nDengemi kaybederken tutunmak için kaya gibi bir uzva yapışıyorum, ama uzuv elimde kopuyor. Yere yığılıyorum; kesin ölüme düşmekten kurtuluyorum, ama gözlerim avucumdaki taşa kilitlenmiş: #italic Bu... bir parmak mı?#!\n\nBakışım yukarı kayıyor; kayalığa karışmış, dehşetle donmuş bir taş yüz görüyorum. Neredeyse bana bakıyormuş gibi... derken bir anda diğer eli ileri fırlayıp boğazımı kavrıyor. Bu boğuşmanın içinde zar zor bir çığlık atabiliyorum."

 agot_sailing.3904.desc_five:0 "Karaya ayak bastığımızda, Dumanlı Deniz'e tepeden bakan sarp kayalıkların zirvesine çıkan kırık bir yol buluyoruz. Basamaklar tehlikeli; bizi çok yavaş ilerlemeye zorluyor. Sonunda içinden duman tüten küçük bir mağaraya ulaşıyoruz.\n\nMağaranın ağzında, içine parıldayan bir kılıç saplanmış kocaman siyah bir taş fark ediyorum. Metaldeki dalgalanmaların tek anlamı olabilir: #italic Valyria çeliği!#!\n\nBöyle bir ödül tüm yolculuğa değer. Kabzayı sıkıca kavradığımda ne kadar sağlam saplanmış olduğunu hissediyorum. Var gücümle çekmek hiçbir işe yaramıyor.\n\nKendimi taştaki bu kılıca o kadar kaptırıyorum ki tayfamın sessizleştiğini zar zor fark ediyorum. Nihayet çevreme bakmaya cesaret edince, üzerimde dimdik duran zifiri siyah bir figür görüyorum; teni ejderhacami gibi, sivri orak biçimli kolları üzerime kalkmış. Biri aşağı inip paha biçilmez kılıcı hâlâ kavrayan kolumu tümüyle koparıyor.\n\nDiğeri başıma doğru inmeye başlıyor."

 agot_sailing.3904.desc_six:0 "Karaya ayak bastığımızda, Dumanlı Deniz'e tepeden bakan sarp kayalıkların zirvesine çıkan kırık bir yol buluyoruz. Basamaklar tehlikeli; bizi çok yavaş ilerlemeye zorluyor. Sonunda içinden duman tüten küçük bir mağaraya ulaşıyoruz.\n\nLoş aydınlatılmış alana adım attığımda beni, sanki ısınmak için birbirine sokulmuş taş figürler karşılıyor. #italic Hayır, korunmak için!#!\n\nBurası bir mağara değil; bir mezar! Çıkışa dönmek için döndüğümde bacağımda taş gibi bir kavrayış hissediyorum. Taş bedenlerden biri beni yakalamış; baldırımı birden keskin bir acı yırtıyor. Yere yığılırken bir taş elin daha kolumda, sonra sırtımda, sonra boynumda olduğunu hissediyorum..."

 agot_sailing.3904.a:0 "[ROOT.Char.Custom('Scream')]"

 ship_sunk:0 "Gemin Valyria'da kayboluyor"

 ship_sunk_bell:0 "Dalış Çanın geminle birlikte kayboluyor"

 agot_sailing.3905.t:0 "Harabelerde Bir Hazine"

 agot_sailing.3905.desc:0 "Gemiden inip Valyria kıyısına ayak basarken [host.GetTitledFirstNameNicknamed]'i dikkatle takip ediyorum. Yüzlerce yıldır ziyaret edilmemiş bir toprak; Valyria'nın Kıyameti'nden beri, [GetScriptedCharacterByHistoryID('Varezys_1').GetName] toprağı geri alıp kendini İmparator ilan etmeye kalkıştığından beri.\n\nKaraya çıktığımda, bu adayı şekillendiren yanardağın zirvesinin göğü deldiğini görebiliyorum. [host.GetFirstNameNoTooltip] ilerideki yolu seçince hepimiz [host.GetSheHe]'yi harabelerin arasından takip ediyoruz. [host.GetSheHe], kırık taş merdivenlerin sonuna ulaştığında, ortaya çıkarabileceğimiz ne kadar kalıntı varsa harabeyi çevresince aramamızı emrediyor.\n\nAramaya başlamak için ileri adım attığımda, içinden hâlâ duman sızan, en sağlam kalmış eski Valyria sarayı harabelerinden birinde olduğumuzu görüyorum; dumanına rağmen güzel.\n\nMolozları eşelerken zaman geçiyor; ta ki onu bulana dek - bir [newest_found_artifact.GetName].\n\nBir moloz yığınının altında, benim onu almamı bekleyen kadim, kıymetli bir Valyria yadigârı... kıymetlimi almamı..."

 agot_sailing.3905.a:0 "Eski Valyria'dan kalma bir yadigâr!"

 agot_sailing.3938.t:0 "Tehlikeli Ada"

 agot_sailing.3938.desc:0 "Liderimizin keşfetmeyi seçtiği adanın kayalık kıyısına adım atıyorum. Yakındaki kayalıkların tepesinde görünen kavrulmuş harabelere ulaşmanın yolunu ararken grubumuza huzursuz bir his eşlik ediyor.\n\nAşağı yukarı bir saat geçtikten sonra, koyu renkli taşların kırık basamaklarından yukarı doğru ilerliyor gibi görünen küçük bir patika buluyoruz. Patikayı izleyerek sonunda harabelere ulaşıyoruz. Burası bir zamanlar bir saray ya da Valyrialıların görkemli günlerinde yükselttikleri başka bir yapı olabilir. Şimdi geriye kasvetli bir taş işçiliğinden başka bir şey kalmamış.\n\nGöz ucuyla bir hareket görüyorum, ama dönmeye başladığım anda çoktan çok geç. Soğuk, güçlü eller doğaüstü bir kuvvetle boynumu kavrıyor; her şey kararmadan önce duyduğum son şey korkunç bir tıslama sesi..."

 agot_sailing.3938.a:0 "Ağhh-"

 agot_sailing.3938.a.tt:0 "Sefer başarısız oldu; herkes Valyria'da kayboldu, bir daha asla görülmedi"

 agot_sailing.3906.t:0 "Harabeleri Yağmalamak"

 agot_sailing.3906.desc:0 "[candle_store.GetName] yeterli değilmiş! Harabeleri arayın, taş üstünde taş bırakmayın. Daha değerli bir şey bulun!\n\nBüyük değer taşıyan başka bir şey çıkarması umuduyla tayfaya arama emri veriyorum.\n\nHarabeler çevremizde tütmeye devam ediyor; Kıyamet'in yol açtığı yıkım korkunç boyutlarda, burada geriye pek bir şey kaldıysa şaşarım. Ama bu yeri sık sık ziyaret etmek fazla tehlikeli; elimizden geleni alıp eve dönmeliyiz.\n\nBu cehennem çukurunda ne saklanıyor olabilir kim bilir? Tayfa acele etmeli."

 agot_sailing.3906.a:0 "Taş üstünde taş bırakma!"

 agot_sailing.3907.t:0 "Eve Dönüş Yolculuğu"

 agot_sailing.3907.desc_good:0 "Eski Valyria'ya yolculuk muhteşem bir başarıyla sonuçlandı; yolculuğumuzun sonu açık gökyüzü ve elverişli rüzgârlarla karşılanıyor. Düşlerini gördüğüm dehşetler yalnızca düştü: rüyalar.\n\nEve dönerken karnımda hafif bir gıdıklanma hissediyorum. #italic Aha! Neredeyse bir gündür bir şey yemedim!#!"

 agot_sailing.3907.desc_bad:0 "Eski Valyria'ya yolculuk muhteşem bir başarıyla sonuçlandı, ama yolculuğumuzun sonu karanlık gökyüzü ve hoş olmayan rüzgârlarla karşılanıyor. Düşlerini gördüğüm dehşetler rüyadan fazlası olabilir.\n\nEve dönerken karnımda hafif bir gıdıklanma hissediyorum. Sonra bir kemirilme; sanki iç organlarım bedenimden kaçmaya çalışıyor gibi.\n\nAlnımdan damlayan teri fark ediyorum ve kolumdaki derinin bir anlığına kıpırdadığına yemin edebilirim. Giysilerimi iç çamaşırıma kadar soymaya başlıyorum, ama içimden yayılan ısı fazla güçlü. #italic Yanıyorum!#!\n\nKarnımı kavrıyorum; derimin altında tuhaf bir kıvranma hissediyorum. Çığlık atmak için ağzımı açıyorum, ama ağzımdan yalnızca duman çıkıyor."

 agot_sailing.3907.a_good:0 "Sakladığım o limonlu kekler nerede?"

 agot_sailing.3907.a_bad:0 "Demek ateş solucanı hikâyeleri gerçekmiş?!"

 agot_sailing.3920.t:0 "$agot_sailing.3101.t$"

 agot_sailing.3920.desc:0 "[host.GetTitledFirstNameNicknamed] [host.GetHerHis] denizcilik haritalarını ve notlarını uzun uzun inceledikten sonra haykırıyor: ""Özgür Şehirler'in topraklarının yanından geçip Köle Körfezi'ne yöneleceğiz, oradan Dumanlı Deniz'e 260 derecelik bir pusula açısıyla gireceğiz!""\n\n[host.GetHerHis] zekâsından şüphe edenlerin hepsi derin bir oh çekiyor."

