 agot_sailing.2203.desc:0 "Elimden geldiğince çabuk harekete geçiyorum; [murder_target.GetTitledFirstName]'in uyuduğu yatağın yanına adım atıyorum. Hançerimi çeker çekmez [murder_target.GetHerHim]'in kıpırdandığını görüyorum."

 agot_sailing.2203.agent:0 "[abduct_schemer.GetFirstName]'i hayal kırıklığına uğratmak istemiyorum..."

 agot_sailing.2203.success:0 "\n\n"[ROOT.Char.GetFirstNameNoTooltip]?! What are y—" [murder_target.GetFirstNameNoTooltip] slumps back onto the bed, as my dagger pierces deep into [murder_target.GetHerHis] heart.\n\nThe deed is done before [murder_target.GetSheHe] can even finish [murder_target.GetHerHis] final words, and I quickly look to cover my tracks, tossing the body overboard through the cabin's single window."

 agot_sailing.2203.failure:0 "\n\n"[ROOT.Char.GetFirstNameNoTooltip]?! You fiend!" [murder_target.GetFirstNameNoTooltip] somehow manages to roll out of the way as my dagger jolts forward. Then, [murder_target.GetFirstNameNoTooltip] scrambles to [murder_target.GetHerHis] feet.\n\nBut [murder_target.GetSheHe] dashes out of the cabin's door as I try to regain my balance, looking over [murder_target.GetHerHis] shoulder fearfully, shouting at the top of [murder_target.GetHerHis] lungs. I won't catch [murder_target.GetHerHim] in time..."

 agot_sailing.2203.a:0 "Kimse şüphelenmeden güverteye dönmeliyim..."

 agot_sailing.2203.b:0 "Lanet olsun! Lanet olsun! Lanet olsun!"

 agot_sailing.2204.t:0 "Karanlıkta Bir Hançer"

 agot_sailing.2204.desc:0 "Akşam iyice ilerlemiş; hak ettiğim dinlenmeyi almak için kamarama çekildim. Tam uykuya dalmak üzereyken arkamdan gelen olağandışı bir sesle irkiliyorum. Gözlerimi tam zamanında açıyorum; [murder_actor.GetTitledFirstName], [murder_actor.GetHerHis] hançeri başının üzerinde kaldırılmış halde üzerime iniyor."

 agot_sailing.2204.success:0 "\n\n[murder_actor.GetFirstNamePossessiveNoTooltip] gözlerindeki kararlılığı çok geç fark ediyorum; [murder_actor.GetHerHis] savrulmasından kaçamıyorum ve bir güm diye yatağıma savruluyorum, hançer kalbime saplanıyor.\n\n[murder_actor.GetFirstName]'in dudaklarında hafif ama zalim bir gülümsemeyle son bir anlık görüntüsü belirirken görüşüm bulanıklaşıyor. ""Elveda, [ROOT.Char.GetFirstNameNoTooltip]."""

 agot_sailing.2204.failure:0 "\n\n[murder_actor.GetFirstNameNoTooltip] beni öldürmeye çalışıyor! Çaresizce yana kaçıyorum; hançerin ucu üzerime inerken bana sürtünüp geçiyor ve beceriksizce yere yuvarlanıyorum; ama [murder_actor.GetSheHe] dengesini kaybedip küfürler savururken ayağa fırlamayı başarıyorum.\n\nKamaradan dışarı fırlıyorum, uyanık olan herkesten yardım istemek için var gücümle koşuyorum."

 agot_sailing.2204.a:0 "Ne—! H—"

 agot_sailing.2204.b:0 "Koşmaya devam et!"

