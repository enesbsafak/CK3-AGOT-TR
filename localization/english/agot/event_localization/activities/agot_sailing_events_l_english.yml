 agot_sailing.2201.t:0 "Asıl Ödül"

 agot_sailing.2201.desc:0 "Limandan ayrılıp açık sulara çıktığımızda, geminin ana direğinin yanında duran ve benim gözetimimden habersiz [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [murder_target.GetTitledFirstName]'i göz ucuyla izliyorum."

 agot_sailing.2201.agent:0 "[murder_schemer.GetTitledFirstName] burada olamadı ama bu, beklediğimiz fırsat olabilir.\n\n"

 agot_sailing.2201.a:0 "Bugün o gün."

 sailing_murder_accomplice_tt:0 "[THIS.Char.GetShortUIName|U] [murder_target.GetShortUIName]'i öldürmeye teşebbüs edecek"

 agot_sailing.2202.opening:0 "Günlerdir gemide günlük işlerini yapan [murder_target.GetTitledFirstName]'i gölge gibi takip ediyorum. Nihayet özellikle sisli bir akşam geliyor ve hedefimin [murder_target.GetHerHis] kamarasında yalnız olduğundan eminim.\n\n"

 agot_sailing.2202.desc:0 "İçeri girdiğimde [murder_target.GetHerHim]'i [murder_target.GetHerHis] yatağında derin uykuda buluyorum."

 agot_sailing.2202.a:0 "Hançerimin tek bir darbesi [murder_target.GetHerHim]'den sonsuza dek kurtulmak için yeter!"

 agot_sailing.2202.a.tt:0 "#EMP Önüme çıkan bu harika fırsatı kaçırmamalıyım...#!"

 agot_sailing.2202.b:0 "Hayır, riske değmez..."

 agot_sailing.2202.b.tt:0 "#EMP Ya [murder_target.GetSheHe] yaşarsa...?#!"

