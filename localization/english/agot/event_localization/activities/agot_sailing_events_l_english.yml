 agot_sailing.2301.t:0 "Konuşmak İçin Bir An"

 agot_sailing.2301.desc:0 "Güneş pırıl pırıl parlıyor; gemimiz açık sularda hızla, iyi bir tempoyla ilerliyor. [befriend_target.GetFirstName] pek uzakta değil, manzarayı hayranlıkla izliyor: [befriend_target.GetHerHim]'i etkilemek için şansım bu.\n\n"

 agot_sailing.2302.reply_sailor:0 """$agot_sailing.2101.a$""\n\n"

 agot_sailing.2302.reply_pity:0 """$agot_sailing.2101.c$""\n\n"

 agot_sailing.2302.reply_wastrel:0 """$agot_sailing.2101.d$""\n\n"

 agot_sailing.2302.reply_steward:0 """$agot_sailing.2101.e$""\n\n"

 agot_sailing.2302.opening:0 "Gemi dingin okyanusu yara yara ilerlerken [befriend_actor.GetTitledFirstName] usulca yanıma sokuluyor.\n\n[befriend_actor.GetSheHe|U] içten bir gülümsemeyle şöyle diyor:"

 agot_sailing.2302.sailor:0 "$agot_sailing.2302.reply_sailor$Bu, kusur bulabileceğim bir söz değil."

 agot_sailing.2302.pity:0 "$agot_sailing.2302.reply_pity$[befriend_actor.GetHerHis] sözlerinin doğruluğunu inkâr edemem; zalim bir iş bu."

 agot_sailing.2302.wastrel:0 "$agot_sailing.2302.reply_wastrel$Kesinlikle doğru; onun yerine yapabileceğim onca faydalı iş varken..."

 agot_sailing.2302.steward:0 "$agot_sailing.2302.reply_steward$Doğayı düzene sokmakta zevk bulmayı kesinlikle anlıyorum."

 agot_sailing.2302.fallback:0 "Ne diyeceğimi bilemiyorum."

 agot_sailing.2302.a:0 "Belki düşündüğümden daha çok ortak noktamız var."

 agot_sailing.2303.opening:0 "Gemimiz hedefine doğru istikrarlı biçimde yol alırken [befriend_actor.GetTitledFirstName] yanıma yaklaşıyor."

 agot_sailing.2303.sailor:0 "$agot_sailing.2302.reply_sailor$\n\nBuna daha çok karşı çıkamazdım..."

 agot_sailing.2303.pity:0 "$agot_sailing.2302.reply_pity$Ne zayıflık ama; dünya zalim."

 agot_sailing.2303.wastrel:0 "$agot_sailing.2302.reply_wastrel$Hepimizin eğlenceye zaman ayırmaya ihtiyacı var."

 agot_sailing.2303.steward:0 "$agot_sailing.2302.reply_steward$Ne kadar sıradan..."

 agot_sailing.2303.fallback:0 "[befriend_actor.GetSheHe|U] umutla gülümsüyor; karşılığında yakınlık beklediği besbelli."

 agot_sailing.2303.a:0 "Söylesene, oradaki ne?"

 agot_sailing.2304.reply:0 "[befriend_target.GetTitledFirstName] benimle pek çok ortak noktası varmış gibi görünüyor"

 agot_sailing.2304.sailor:0 "$agot_sailing.2304.reply$, limanda bir gemiyi demirlemenin ve emniyete almanın doğru yolunun inceliklerine heyecanla gömülerek."

 agot_sailing.2304.pity:0 "$agot_sailing.2304.reply$, bu kadar çok çalışmak zorunda olanlara acımamı paylaşarak."

 agot_sailing.2304.wastrel:0 "$agot_sailing.2304.reply$, [befriend_target.GetHerHis] zamanının başka yerde daha iyi değerlendirilebileceğinden yakınarak."

 agot_sailing.2304.steward:0 "$agot_sailing.2304.reply$, deniz ticaret yolları hakkındaki bilgilerini paylaşmaya hevesli."

 agot_sailing.2304.fallback:0 "$agot_sailing.2304.reply$, yanımdayken [befriend_target.GetHerHis] tavırlarını yumuşatarak."

 agot_sailing.2304.desc:0 "\n\nYola devam ettiğimizde ayrılmamız neredeyse imkânsız - [befriend_target.GetHerHim]'i kazanmak için doğru sözleri bulacağımı biliyordum!"

 agot_sailing.2304.a:0 "Sanırım [befriend_target.GetHerHim]'i kazandım..."

 agot_sailing.2305.reply:0 "Sözlerim [befriend_target.GetTitledFirstName] üzerinde pek etki yaratmışa benzemiyor"

 agot_sailing.2305.sailor:0 "$agot_sailing.2305.reply$, zira [befriend_target.GetSheHe] sadece kibarca gülümseyip boğazını temizliyor; konuşmayı kibarca bitirmenin yolunu arıyor besbelli."

 agot_sailing.2305.pity:0 "$agot_sailing.2305.reply$, zira [befriend_target.GetSheHe] bana tuhaf bir bakış atıp [befriend_target.GetHerHis] kafasını kaşıyor."

 agot_sailing.2305.wastrel:0 "$agot_sailing.2305.reply$, zira [befriend_target.GetSheHe] sözlerim karşısında tamamen dehşete kapılmış görünüyor."

 agot_sailing.2305.steward:0 "$agot_sailing.2305.reply$, zira [befriend_target.GetSheHe] çabucak ilgisini kaybediyor; ticaret yolları hakkında konuşmaya hiç niyeti yok besbelli."

 agot_sailing.2305.fallback:0 "$agot_sailing.2305.reply$, zira [befriend_target.GetSheHe] hiçbir şey demiyor."

 agot_sailing.2305.desc:0 "\n\n[befriend_target.GetSheHe] başkalarıyla sohbet etmek üzere uzaklaştıktan sonra tek başıma dikilirken kendimi aptal gibi hissediyorum..."

 agot_sailing.2305.a:0 "Aferin, [ROOT.Char.GetFirstNameNoTooltip]."

 sailing_woo_success_key_title:0 "$agot_sailing.2301.t$"

 sailing_woo_failure_key_title:0 "$agot_sailing.2301.t$"

