 agot_sailing.5509.desc:0 "Güvertede duruyorum, elimde zıpkın. Geminin yakınında okyanusun yüzeyinin hemen altında yüzen görkemli mavi balinaya nişan alırken tayfa beni merakla izliyor.\n\n""Sakin ol,"" diye geçiriyorum içimden, silahın sapındaki kavrayışımı sıkılaştırarak."

