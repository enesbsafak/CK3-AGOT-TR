l_english:

 activity_dragon_hatching:0 "Ejderha Yumurtası Çıkarma"

 activity_dragon_hatching_host_an_a:0 "$host_activity_a$"

 activity_dragon_hatching_desc:0 "Ejderha yumurtanızı çıkarmayı deneme zamanı geldi. Bu görkemli ana tanıklık etmek için bir tören düzenlenecek."

 activity_dragon_hatching_selection_tooltip:0 "Ejderha yumurtanızı çıkarmayı deneyip yeni bir çağ başlatın.\n\nBeklenen ödüller:\n$agot_host_hatching_potential_reward$"

 agot_host_hatching_potential_reward:0 "$BULLET_WITH_TAB$Ejderha Yumurtanızı [artifact|E] çıkarabilir ve yok edebilir\n$BULLET_WITH_TAB$Başarılı olursa, yeni doğmuş bir [dragon|E] sarayınıza katılacak\n\n#n @warning_icon! Başarısızlık beklenmedik sonuçlara yol açabilir#!"

 activity_dragon_hatching_predicted_cost:0 "Ejderha çıkarma töreninizin kesin maliyeti, seçilen çıkarma tarzına ve tören sırasındaki tercihlerinize bağlı olacaktır."

 activity_dragon_hatching_destination_selection:0 "#V Ejderha Yumurtası Çıkarma#! törenini yalnızca [capital|E]nizde, bir [dragonpit|E]de veya #V özel bir konumda#! düzenleyebilirsiniz."

 activity_dragon_hatching_conclusion_desc:0 "[GetActivityType( 'activity_dragon_hatching' ).GetName] sona erdi"

 activity_dragon_hatching_guest_desc:0 "Katılımcılar"

 activity_dragon_hatching_guest_help_text:0 "Ejderha yumurtanızın çıkışına tanıklık etmek için kimi davet edeceğinizi seçin."

 TRAVEL_NAME_FOR_activity_dragon_hatching:0 "$TRAVEL_NAME_FOR_activity_tournament$"

 ceremony:0 "Tören Hazırlıkları"

 ceremony_desc:0 "Ateşler hazırlanıyor, bilgiler gözden geçiriliyor ve bu gösteri için gerekli düzenlemeler yapılıyor. Yakında gökyüzünde yeni bir ejderha süzülecek."

 hatching_attempt:0 "Çıkarma Girişimi"

 hatching_attempt_desc:0 "Ejderha yumurtanızı çıkarmayı deneyeceksiniz."

 hatching_outcome:0 "Çıkarma Sonucu"

 hatching_outcome_desc:0 "Çıkarma girişiminizin sonucu ortaya çıkacak."

 activity_dragon_hatching_no_dlc:0 "$activity_dragon_hatching$"

 activity_dragon_hatching_no_dlc_desc:0 "$activity_dragon_hatching_desc$"

 activity_dragon_hatching_no_dlc_selection_tooltip:0 "$activity_dragon_hatching_selection_tooltip$"

 activity_dragon_hatching_no_dlc_predicted_cost:0 "$activity_dragon_hatching_predicted_cost$"

 activity_dragon_hatching_no_dlc_destination_selection:0 "$activity_dragon_hatching_destination_selection$"

 activity_dragon_hatching_no_dlc_conclusion_desc:0 "$activity_dragon_hatching_conclusion_desc$"

 activity_dragon_hatching_no_dlc_guest_desc:0 "$activity_dragon_hatching_guest_desc$"

 activity_dragon_hatching_no_dlc_guest_help_text:0 "$activity_dragon_hatching_guest_help_text$"

 TRAVEL_NAME_FOR_activity_dragon_hatching_no_dlc:0 "$TRAVEL_NAME_FOR_activity_dragon_hatching$"

 hatching_type:0 "Çıkarma Türü"

 hatching_type_knowledge:0 "Bilgiyle Çıkarma"

 hatching_type_knowledge_desc:0 "Ejderha yumurtanızın çıkarılmasında size yardım etmeye gönüllü tüm üstatları, ejderha bakıcılarını ve ejderha bilgisinin diğer bilinen âlimlerini çağıracaksınız."

 hatching_type_esoteric:0 "Ezoterik Çıkarma"

 hatching_type_esoteric_desc:0 "Ejderha yumurtanızın çıkarılmasında size yardım etmeye gönüllü büyücüleri, simyacıları ve ezoterik bilginin diğer bilinen saklayıcılarını çağıracaksınız."

 agot_dragon_hatching_destination_selection:0 "Ejderhalar ve ejderha bilgisi açısından bilinen öneme sahip yerler, bir ejderha yumurtasını çıkarmak için iyi adaylardır."

 hatching_sacrifice:0 "Kurban"

 hatching_sacrifice_animal:0 "Hayvan"

 hatching_sacrifice_animal_desc:0 "Bu çıkarma için güç kaynağı olarak bir hayvanın yaşamını kullanacaksınız. Kurban edilecek hayvan, zamanı geldiğinde seçilecek."

 hatching_sacrifice_blood:0 "Kan"

 hatching_sacrifice_blood_desc:0 "Bu çıkarma için güç kaynağı olarak kanın gücünü kullanacaksınız. Kanın kaynağını zamanı geldiğinde seçebileceksiniz."

 hatching_sacrifice_life:0 "Yaşam"

 hatching_sacrifice_life_desc:0 "Bu çıkarma için güç kaynağı olarak yaşamın gücünü kullanacaksınız. Uygun anda kimin kurban edileceğini seçebileceksiniz."

 hatching_catalyst:0 "Katalizör"

 hatching_catalyst_minor:0 "Basit"

 hatching_catalyst_minor_desc:0 "Bu çıkarma için katalizör olarak basit bir ısı kaynağı kullanacaksınız; süslemeye ya da törene gerek yok."

 hatching_catalyst_medium:0 "Uygun"

 hatching_catalyst_medium_desc:0 "Uygun bir yuva ve gösterişli bir yerleştirme töreniyle, bu olaya yakışır bir katalizör eşliğinde çıkarma törenini gerçekleştireceksiniz."

 hatching_catalyst_major:0 "Büyük"

 hatching_catalyst_major_desc:0 "Törene harcanan büyük miktarda kaynak ve emekle, etkinliğe büyük bir alay eşliğinde özel yapılmış bir yuvada yumurtayı ısıtacaksınız."

 hatching_catalyst_massive:0 "Devasa"

 hatching_catalyst_massive_desc:0 "Topladığınız büyük miktarda ejderha bilgisi sayesinde, yumurtanın ısıtılmasında başarıya giden tüm farklı yolların kapsandığından emin olabilirsiniz."

 hatch_dragon_intent:0 "Bir Ejderha Çıkarmak"

 hatch_dragon_intent_desc:0 "Bu etkinlikte tek ilginiz var: bir [dragon|El]nün çıkması."

 witness_hatch_dragon_intent:0 "Bir Ejderha Çıkışına Tanıklık Etmek"

 witness_hatch_dragon_intent_desc:0 "Nesilde bir kez yaşanacak bir olaya tanıklık etmek için buradasınız: [dragons_plural|El]nün dünyaya dönüşü."

 agot_hatching_prov_has_KL_dragonpit:0 "#P +++ $building_type_dragonpit_01$ne sahip#! ([building|E])\n"

 agot_hatching_prov_has_dragonpit:0 "#P ++ Jenerik $building_type_dragonpit_01$ne sahip#! ([building|E])\n"

 agot_hatching_prov_has_dragonmont:0 "#P +++ $building_type_dragonstone_01$dır#!\n"

 agot_hatching_prov_is_realm_capital:0 "#P + Diyarınızın başkentidir#!\n"

 agot_hatching_prov_is_summerhall:0 "#N -- $building_type_agot_summerhall_01$ne sahip#! ([building|E])\n"

 agot_hatching_something_broke:0 "Bir şey törenin planlandığı gibi ilerlemesini engelledi."

 agot_hatching_host_folded:0 "Yumurtayı çıkarmamaya karar verdiniz."

 agot_hatching_host_folded_guest:0 "[host.GetName] yumurtayı çıkarmamaya karar verdi."

 agot_hatching_success:0 "Ejderha yumurtanız çatladı!"

 agot_hatching_success_guest:0 "[host.GetName], [host.GetHerHis] ejderha yumurtasını başarıyla çıkardı!"

 agot_hatching_fail:0 "Ejderha yumurtanız çatlamadı."

 agot_hatching_fail_guest:0 "[host.GetName], [host.GetHerHis] ejderha yumurtasını çıkarmayı başaramadı."

 hatching_cannot_be_held:0 "Güncel olaylar nedeniyle, On İkinci Ayın 1'i, 268 A.C.'ye dek bir çıkarma etkinliği düzenlenemez."

 agot_dragon_hatching.0001.t:0 "Hazırlıklar"

 agot_dragon_hatching.0001.desc:0 "Diyarın en büyük akademik zekalarına, ejderha yumurtamı çıkarma uğraşıma yardım etmeleri için [province.GetName]e çağrı mektupları gönderdim. Çoktan üstatlardan ve ejderha bilgisinde iyi yetişmişlerden yanıtlar alıyorum.\n\nÇoğu şüpheci olsa da bir ejderha yumurtasının çatlamasını görme merakında samimi; diğerleri ise bilgilerini sınayıp dünyaya bir ejderha getirmek için istekli. Böyle büyük bir girişime yardım etme onuruna erişenler şimdiden [province.GetNameNoTooltip]e doğru yola çıkmış durumda."

 agot_dragon_hatching.0001.opt.a:0 "Bol bilgi ve biraz şansla, hâlâ başarılı olabiliriz."

 agot_dragon_hatching.0002.t:0 "Hazırlıklar"

 agot_dragon_hatching.0002.desc:0 "Dünyanın ünlü büyü ve sihir zekalarına, sanatlarını davama katkı sağlamaları için [province.GetName]e gelmeleri üzere çağrılar gönderdim. Dünyanın daha egzotik köşelerinden gelen diğer isimlerin yanı sıra Qarth'taki büyücülerin ve Qohor'daki maegilerin yanıtlarını gözden geçiriyor; bu kadar iddialı büyülere yardım etmeye hevesli, en saygın ve bilgili olanlarını not ediyorum.\n\nEzoterik misafirlerim yola çıktığına göre, benim de yola çıkma vaktim geldi."

 agot_dragon_hatching.0002.opt.a:0 "Alışılmadık hedeflere ulaşmak için alışılmadık yollara başvurmak gerekir."

 agot_dragon_hatching.preparations.tt:0 "Seçilen yumurtayı çıkarmayı deneyeceksiniz"

 agot_dragon_hatching.0003.t:0 "Büyüklüğe Doğru"

 agot_dragon_hatching.0003.desc:0 "[ROOT.Char.GetCurrentLocation.GetName]den [egg.GetName] ile [province.GetName] eyaletine doğru yola çıktım. Şu an bile ondan yayılan gücü hissedebiliyorum; heyecanımla birlikte taşıyor. Bu kadar kıymetli bir yük ile yolculuğun güvenli ve kesintisiz geçmesini umuyorum. Başım dik, kaderime doğru yola koyuldum."

 agot_dragon_hatching.0003.opt.a:0 "İleri, #bold büyüklüğe#!!"

 agot_dragon_hatching.0005.t:0 "Büyüklüğe Tanıklık İçin"

 agot_dragon_hatching.0005.desc:0 "[ROOT.Char.GetCurrentLocation.GetName]den [province.GetName] eyaletine doğru yola çıktım. Böyle büyük bir olaya ortak olmak bir onurdur ve kesinlikle unutulmaz bir deneyim olacaktır."

 agot_dragon_hatching.0005.opt.a:0 "Geç kalmamak en iyisi."

 agot_dragon_hatching.0006.t:0 "Geleceği Getirmek İçin"

 agot_dragon_hatching.0006.desc_knowledge:0 "Misafirlerim geldi ve bana yardım eden çeşitli akademisyenler hazırlıklarını tamamladı. Artık törene kimin öncülük edeceğine ve bundan sonra nasıl ilerleyeceğine karar vermeliyim."

 agot_dragon_hatching.0006.desc_esoteric:0 "Misafirlerim geldi ve gözdem olan maegiler büyülerini söylemeye ve iksirlerini hazırlamaya başladı. Artık ritüelde bize kimin öncülük edeceğine karar vermeliyim."

 agot_dragon_hatching.0006.opt.a:0 "Tabii ki ben!"

 agot_dragon_hatching.0006.opt.a.tt:0 "Ritüel lideri siz olacaksınız"

 agot_dragon_hatching.0006.opt.b:0 "[scholar.GetFirstName] aramızda en bilgili kişi."

 agot_dragon_hatching.0006.opt.b.tt:0 "[scholar.GetShortUINameNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0006.opt.c:0 "[septon.GetFirstNameNicknamed] bize Yediler'in lütfuyla öncülük edecek."

 agot_dragon_hatching.0006.opt.c.tt:0 "[septon.GetFirstNameNicknamedNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0006.opt.d:0 "Büyücü [warlock.GetFirstName] ritüeli yönetecek."

 agot_dragon_hatching.0006.opt.d.tt:0 "[warlock.GetShortUINameNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0006.opt.e:0 "Ateşbüyücüsü [pyromancer.GetFirstName]'nün alevleri bize yol gösterecek."

 agot_dragon_hatching.0006.opt.e.tt:0 "[pyromancer.GetShortUINameNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0006.opt.f:0 "Orman cadısı [witch.GetFirstName] bize eski yollarda öncülük edecek."

 agot_dragon_hatching.0006.opt.f.tt:0 "[witch.GetShortUINameNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0006.opt.g:0 "R'hllor'un kendi rahibi [rhllor_priest.GetFirstName] bize yol gösterecek."

 agot_dragon_hatching.0006.opt.g.tt:0 "[rhllor_priest.GetShortUINameNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0006.opt.h:0 "Tüm Westeros'un ejderha bilgisinde en yetkin ismi olan [archmaester.GetFirstName]yi çağıracağım."

 agot_dragon_hatching.0006.opt.h.tt:0 "[archmaester.GetShortUINameNoTooltip] ritüel lideri olacak"

 agot_dragon_hatching.0007.t:0 "$agot_dragon_hatching.0006.t$"

 agot_dragon_hatching.0007.desc_knowledge:0 "Misafir arkadaşlarım ve ben geldik; çeşitli okumuş adamlar hazırlıklarını yaparken telaşla ortalıkta koşuşturuyor. Görünüşe göre geriye yalnızca ev sahibimizin bu yumurtanın çatlaması için gereken her şeyi kurmayı bitirmesi kaldı."

 agot_dragon_hatching.0007.desc_esoteric:0 "Misafir arkadaşlarım ve ben geldik; ev sahibimizin çağırttığı büyücüler de geldi. Ürkütücüler, ama yine de işlerine koyuluş biçimleri büyüleyici. Görünüşe göre geriye yalnızca çıkarma töreni için gerekli ritüelleri seçmek kaldı."

 agot_dragon_hatching.0007.opt.a:0 "Ne büyük bir çaba! Sabırsızlanıyorum!"

 agot_dragon_hatching.0007.opt.a.fear:0 "Bunun güvenli olduğundan emin miyiz?"

 agot_dragon_hatching.0007.opt.a.flavor:0 "Tören hazırlanırken izliyorsunuz."

 agot_dragon_hatching.0008.t:0 "Bir Canavar İçin Bir Canavar"

 agot_dragon_hatching.0008.desc_knowledge:0 "Bilgili topluluğumda canlı bir yaratığı kurban etme konusunda bir tereddüt havası olsa da, bu törenin başarılı olması için bir canın verilmesi gerektiği konusunda herkes hemfikir. Tarihleri ve mevcut metinleri inceledikten sonra, artık hangi tür canavarın kurban edileceğine karar vermeliyiz."

 agot_dragon_hatching.0008.desc_esoteric:0 "Evrenin yasaları açıktır: can, canla ödenmelidir. Aramızdaki maegiler ve büyücüler, çıkarmanın başarılı olması için bir kurbanın gerekli olduğu konusunda hemfikir. Artık hangi canavarın kurban edileceğine karar vermeliyiz."

 agot_dragon_hatching.0008.opt.a_dog:0 "Ah sadık [ROOT.Char.Custom('DogStoryName')], son eylemin asil bir eylem olacak."

 agot_dragon_hatching.0008.opt.a_dog_tt:0 "#bold;V [ROOT.Char.Custom('DogStoryName')]'nin yaşamı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0008.opt.a_cat:0 "Sevgili [ROOT.Char.Custom('CatStoryName')], kurbanın boşa gitmeyecek."

 agot_dragon_hatching.0008.opt.a_cat_tt:0 "#bold;V [ROOT.Char.Custom('CatStoryName')]'nin yaşamı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0008.opt.b:0 "Belki yerel halktan bazı çiftlik hayvanları feda edilebilir?"

 agot_dragon_hatching.0008.opt.b_tt:0 "Bazı #bold;V yerel çiftlik hayvanlarının yaşamı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0008.opt.c:0 "Bu olay için avlanmış biraz av hayvanı getirin."

 agot_dragon_hatching.0008.opt.c_tt:0 "Bir #bold;V yaban hayvanın yaşamı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0008.opt.d:0 "Sıradan bir canavar olmaz. Daha egzotik bir şey bulmalıyız!"

 agot_dragon_hatching.0008.opt.d_tt:0 "Bir #bold;V egzotik hayvanın yaşamı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0009.t:0 "Kan Bedeli"

 agot_dragon_hatching.0009.desc_knowledge:0 "Valyrialıların ejderhalarını çıkarmak için kanbüyüsü kullandığı iyi bilinir. Odadaki bilgili topluluk ne kadar kullanıldığını tartışıyor; ancak herkes benzer bir sununun başarıya ulaşma olasılığının en yüksek olduğu konusunda hemfikir. Artık karar, kanın kimden alınacağı."

 agot_dragon_hatching.0009.desc_esoteric:0 "En büyük kanbüyücüleri, tarihe karışmış bir çağda ejderhaları çıkaranlar, eski Valyrialılardı. Misafirlerimin en gizemlileriyle çevrili ve maegilerimin dikkatli gözleri altında, benzer bir sunuyu nasıl yapacağımıza karar vermeliyim."

 agot_dragon_hatching.0009.opt.a:0 "Kendi kanımdan başkası yetmez."

 agot_dragon_hatching.0009.opt.a_tt:0 "#bold;V Kanınız#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0009.opt.b:0 "Eminim lider olarak [ritual_leader_character.GetFirstNameNicknamed], [ritual_leader_character.GetHerHis] kanını memnuniyetle sunacaktır."

 agot_dragon_hatching.0009.opt.b_tt:0 "#bold;V [ritual_leader_character.GetFirstNameNicknamedPossessiveNoTooltip] kanı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0009.opt.c:0 "Bu büyük proje için herkes damarını açacak."

 agot_dragon_hatching.0009.opt.c_tt_1:0 "Hazır bulunan #bold;V herkesin kanı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0009.opt.c_tt_2:0 "@warning_icon! #X Her katılımcı yaralanacak#!"

 agot_dragon_hatching.0009.opt.d:0 "[prisoner_blood_sacrifice.GetFirstName] itiraz edemez..."

 agot_dragon_hatching.0009.opt.d_tt:0 "#bold;V [prisoner_blood_sacrifice.GetShortUINamePossessiveNoTooltip] kanı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0009.opt.e:0 "Bir düşününce, başka bir yol var."

 agot_dragon_hatching.0009.opt.e_tt:0 "Kan seçenekleri ekranına geri döneceksin."

 agot_dragon_hatching.0010.t:0 "$agot_dragon_hatching.0009.t$"

 agot_dragon_hatching.0010.desc:0 "Valyrialıların ejderhalarını çıkarmak için kanbüyüsü kullandığı iyi bilinir. Odadaki bilgili topluluk ne kadar kullanıldığını tartışıyor; aramızdaki daha mistik olanlarsa benzer bir sununun başarıya ulaşma olasılığının en yüksek olduğundan emin.\n\n[host.GetTitledFirstName]nün bir hayvanın ya da tutsağın kanını akıtmasını bekliyordum; ama [host.GetSheHe] bunun yerine hepimizden tören için kendi damarlarımızı açmamızı istedi!"

 agot_dragon_hatching.0010.opt.a:0 "Yapılması gerekiyorsa, yapılmalı."

 agot_dragon_hatching.0010.opt.b:0 "Buna onay vermedim!"

 agot_dragon_hatching.0011.t:0 "Cana Can"

 agot_dragon_hatching.0011.desc_knowledge:0 "Üstatlarım ve bilgili adamlarım arasında bu eylemin barbarlığına dair bir tereddüt havası olsa da, bu kadar büyülü bir yapıya sahip nesnelerle uğraşırken bu tür bir ödemenin karşılığını bulma olasılığının en yüksek olduğu konusunda hepimiz hemfikiriz. Cana can pahalı bir bedel gibi görünebilir; ancak en şüpheci akıl bile bir ejderhanın yaşayan herkesten daha değerli olduğunu inkâr edemez."

 agot_dragon_hatching.0011.desc_esoteric:0 "Büyücülerimin ve sihirbazlarımın her biri bana aynı şeyi söylüyor: Tüm Valyria ve ejderhaları #bold kanbüyüsüne#! batmıştı. Onunla bu yeni yaşamı dünyaya getirebilirim. Ama can ancak canla ödenir ve artık bedelimi seçmeliyim."

 agot_dragon_hatching.0011.desc_escaped_attendee:0 "[escaped_unwilling_attendee.GetFirstName] muhafızlarımdan kaçmayı başarmış ve törenden firar etmiş görünüyor. Bana söylenen, [escaped_unwilling_attendee.GetSheHe]nün büyük olasılıkla arazide saklandığı ya da çoktan evine doğru yola çıktığı. Kuşkusuz [escaped_unwilling_attendee.GetSheHe] bana fena hâlde kızgın; ama tören devam etmek zorunda ve hâlâ çıkarma için bir can seçmeliyim."

 agot_dragon_hatching.0011.desc_refused_leader:0 "Beni ve katılanları hayal kırıklığına uğratarak, [ritual_leader_character.GetFirstNameNicknamed] çıkarma için [ritual_leader_character.GetHerHis] canını sunmayı reddetti. Artık bedeli ödeyecek başka birini seçmek bana düşüyor."

 agot_dragon_hatching.0011.desc_refused_attendee:0 "[attendee_life_sacrifice_refusing.GetFirstName], çıkarma için [attendee_life_sacrifice_refusing.GetHerHis] canını sunmayı reddederek güvenli bir mesafeden izlemeyi tercih etti. Artık bedeli ödeyecek başka birini seçmek bana düşüyor."

 agot_dragon_hatching.0011.opt.a:0 "Bunun için kendi canımı vereceğim."

 agot_dragon_hatching.0011.opt.a_tt:0 "#bold;V Kendi canınız#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0011.opt.b:0 "Eminim lider olarak [ritual_leader_character.GetFirstNameNicknamed], [ritual_leader_character.GetHerHis] kendi canını memnuniyetle sunacaktır."

 agot_dragon_hatching.0011.opt.b_accepts:0 "#bold;V [ritual_leader_character.GetFirstNameNicknamedPossessiveNoTooltip] canı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0011.opt.b_declines:0 "[ritual_leader_character.GetFirstNameNicknamed] reddediyor ve başka birini seçmelisiniz"

 agot_dragon_hatching.0011.opt.c:0 "Bedeli ödemesi için bir tutsak seçeceğim!"

