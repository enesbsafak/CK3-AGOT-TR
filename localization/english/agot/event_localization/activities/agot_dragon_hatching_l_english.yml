 agot_dragon_hatching_dragonlore.0001.t:0 "Ejderha Bilgisi: Rhaenys Tepesi"

 agot_dragon_hatching_dragonlore.0001.desc:0 "Bir zamanlar en azılı ejderhalardan bazılarına ev sahipliği yapan bu devasa yapı, artık bir harabeden ibaret. Tünellerinde yürürken saf büyüklüğü karşısında hayranlığa kapılıyor ve öneminin ağırlığıyla esir oluyorum.\n\nÖylesine etkilenmişim ki molozların arasındaki tozlu kâğıtları neredeyse fark etmiyorum. Ejderha bakıcılarının kullandığı çıkarma tekniklerine işaret ediyor gibi görünüyorlar!"

 agot_dragon_hatching_dragonlore.0001.opt:0 "Bu işe yarayacak!"

 agot_dragon_hatching_dragonlore.0002.t:0 "Ejderha Bilgisi: Ejderha Kayası"

 agot_dragon_hatching_dragonlore.0002.desc:0 "Ejderhadağı'nın tünellerinde dolaşırken boyutlarını kavramakta zorlanıyorum. Ejderhalar yüzyıllardır burada yuvalanmış; yine de işte buradayım. \n\nBir köşeyi dönünce, kuluçkahane olması gereken yere giriyorum. Bir tomar parşömen yığınına takılmasam daha fazla araştırırdım. Yakından incelediğimde, çoğunun okunamaz olduğunu görmek beni biraz hayal kırıklığına uğratıyor. \n\n#I Ama biri okunaklı!#! Adadaki ejderha bakıcılarının yumurtaları çatlayana dek nasıl büyüttüğünü ayrıntılarıyla anlatıyor!"

 agot_dragon_hatching_dragonlore.0002.opt:0 "Bunu not etmeliyim..."

 agot_dragon_hatching_dragonlore.0003.t:0 "Ejderha Bilgisi: Kale"

 agot_dragon_hatching_dragonlore.0003.desc:0 "Kale'ye vardığımda, bir Başüstat beni bir kitap koleksiyonuna yönlendiriyor. Kitaplar kadim görünüyor ama açıkça iyi bakılmışlar. Bir yerlerde rahat bir sandalye bulmalıyım; görünüşe göre bu kitap epey kalın. \n\nKitap, yıllar önce Targaryenlerin eski Valyria'dan Ejderha Kayası'na göçünden başlayarak bilinen çeşitli yumurta çıkarmalarını oldukça derinlemesine anlatıyor."

 agot_dragon_hatching_dragonlore.0003.opt:0 "Çalışmaya başlamalıyım!"

 agot_dragon_hatching_dragonlore.0004.t:0 "Ejderha Bilgisi: Yazsarayı"

 agot_dragon_hatching_dragonlore.0004.desc:0 "Yazsarayı'nın yanan harabelerinin kokusunu hâlâ alabildiğime yemin edebilirdim. Burada bir trajedi yaşandı; ama ben, Olasılıksız Aegon Kral'ı bu kadar incelikle planlanmış bir çıkarma ritüeli düzenlemeye iten bilgiyi bulmaya kararlıyım. \n\nYaz konutunun yapısından geriye pek bir şey kalmamış; yalnızca kavrulmuş tuğla yığınları ve arada bir cam parçası. Ne var ki çalılıklar her yeri kaplamış; ipucu aramayı güçleştiriyor. \n\nNeyse ki çabalarım karşılığını veriyor. Özenli aramam, düşmüş tuğlaların altına gömülü Kral'ın notlarının parçalarını ortaya çıkarıyor. Onları kendim birleştirmem gerekecek ama bu iyi bir ilerleme!"

 agot_dragon_hatching_dragonlore.0004.opt:0 "Burada gerçekten ne olmuş?"

 agot_dragon_hatching_dragonlore.0005.t:0 "Ejderha Bilgisi: Harrenhal"

 agot_dragon_hatching_dragonlore.0005.desc:0 "Bence Harrenhal'ın hikâyeleri ona hakkını vermiyor. Hiçbir sakin, bir zamanlar görkemli olan bu kaleyi yeniden inşa etme meydan okumasını göze alamadı. Bunun yerine harabe hâlinde yatıyor. \n\nAyak bastığım hiçbir kaleden kat kat büyük; Kızıl Kale bile kıyaslanamaz. Bir zamanların büyük kuleleri, ben gelmeden çok önce ejderha ateşiyle çatlamış ve bükülmüş. Kara Harren bu duvarlara güveniyordu ve soyu bu duvarların içinde sona erdi. Kale, ejderhaya meydan okunmaması gerektiğinin bir hatırlatıcısı olarak duruyor."

 agot_dragon_hatching_dragonlore.0005.opt:0 "Kara Harren bir aptaldı."

 agot_dragon_hatching_dragonlore.0006.t:0 "Ejderha Bilgisi: Ateş Tarlaları"

 agot_dragon_hatching_dragonlore.0006.desc:0 "Aegon ve kız kardeş-eşleri Fetih sırasında burayı kavurduktan sonra çimenler çoktan yeniden büyüdü. Yine de ovalarda hâlâ bir ölümlülük havası var. \n\nBurada binlerce adam öldü, ejderha ateşiyle kül oldu. Gardener Hanesi bu tarlalarda soyları tükendi; Lannister Hanesi ise çok geçmeden diz çöktü. \n\nBu savaş, üç fethin de birlikte savaştığı tek andı; üç ejderha da tek vücut gibi savaştı. Savaş, bir adadan çıkıp Yedi Krallığın, belki de dünyanın en güçlü insanları hâline gelen üç birey tarafından kullanılan ejderha gücünün gerçek bir yansımasıydı."

 agot_dragon_hatching_dragonlore.0006.opt:0 "O gücün bir kırıntısına sahip olduğunu düşün!"

 agot_dragon_hatching_dragonlore.0007.t:0 "Ejderha Bilgisi: Kızıl Göl"

 agot_dragon_hatching_dragonlore.0007.desc:0 "Kızıl Göl'ün kıyılarında yolculuk ederken, uçsuz bucaksız mavi alanın kalbindeki kayalık adayı ziyaret etme fırsatını değerlendiriyorum. Şimdi burada sükûnet hüküm sürse de, ada bir zamanlar korkunç [silverwing.GetName] tarafından mesken tutulmuştu.\n\nİnsanlara alışık olmasına rağmen, gümüş pullu canavar son binicisi [ulf.GetFullName] öldükten sonra yabanileşti ve bu küçük adada inini kurdu.\n\nEjderhaların Dansı, Yedi Krallığın tarihindeki en kanlı ve en çalkantılı çatışmalardan biriydi. Valyrialılar ilk kez Ondört Alev olarak bilinen büyük volkanik dağların ortasında ejderhaları evcilleştirdiklerinden beri, bu görkemli yaratıklar uzun zamandır korkunç savaş silahları olarak kullanılıyordu ve Dans, bunların arasındaki karanlık kayıtlardan yalnızca biridir."

 agot_dragon_hatching_dragonlore.0007.a:0 "Ateş ve kan, gerçekten de."

 agot_dragon_hatching_dragonlore.0008.t:0 "Ejderha Bilgisi: İn"

 agot_dragon_hatching_dragonlore.0008.desc_intro:0 "Tam adayı geride bırakmaya hazırlanırken, ayna gibi bir parıltı dikkatimi çekiyor.\n\n"

 agot_dragon_hatching_dragonlore.0008.desc_clutch:0 "Her biri farklı renklerde parıldayan üç büyük ve oldukça tuhaf değerli taş seçiyorum. Önce gözlerime inanamıyorum; ama yanlarına çömeldiğimde minik pullar ortaya çıkıyor!\n\nÖnümde koca bir ejderha yumurtası döşesi yatıyor!"

 agot_dragon_hatching_dragonlore.0008.desc_pair:0 "Temkinli yaklaşıyor ve çamur kaplı iki tuhaf taş görüyorum. Toprağı silkelediğimde kalbim hızlanıyor — parmaklarımın altında toprak yerini parıldayan pullara bırakıyor; sıradan bir kaya değil, bir ejderha yumurtası tutuyorum!\n\nBurada ne kadar süredir gizli duruyorlar?"

 agot_dragon_hatching_dragonlore.0008.desc_single:0 "Yaklaşıp ağır, çamurlu bir taşı kaldırıyorum; toprağı silkelediğimde kalbim hızlanmaya ve parmaklarım titremeye başlıyor — elimde sıradan bir taş değil, bir ejderha yumurtası tuttuğumu hemen anlıyorum!\n\nBurada ne kadar süredir gizli duruyor?"

 agot_dragon_hatching_dragonlore.0008.a:0 "İnanılmaz!"

 agot_dragon_hatching_dragonlore_increase:0 "Ejderha Bilginiz Artıyor"

 agot_dragon_egg_lay.female_revealed:0 "\n\nElbette, bir döşe yumurtladığına göre, [dragon_parent.GetNameNoTooltip]nün aslında dişi bir ejderha olduğunu artık biliyoruz."

 agot_dragon_egg_lay.female_revealed_past:0 "\n\nElbette, bir döşe yumurtladığına göre, [dragon_parent.GetNameNoTooltip]nün aslında dişi bir ejderha olduğunu artık biliyoruz."

 agot_dragon_egg_cradling.1001.t:0 "Taş Yumurta"

 agot_dragon_egg_cradling.1001.desc:0 "Bir şeyler ters gitti.\n\nSoğuk ejderha yumurtamı bir mangalın üzerinde tutuyor, pullu yüzeyinden eskiden yayılan sıcaklığın bir kısmını geri kazandırmaya çalışıyorum. Mangaldan gelen alev ve duman dışını ısıtıyor; ama içindeki yaşam gizli — yakında parlak renkli bir taştan başka bir şey olmayacak. Kader bu ejderhayı bana çok gördü.\n\nBaşka biriyle denemeli miyim?"

 agot_dragon_egg_cradling.1001.a:0 "Bana başka bir yumurta getir."

 agot_dragon_egg_cradling.1001.a.tt:0 "[new_egg.GetName]ni beşikte beklemeye başlayacaksınız"

 agot_dragon_egg_cradling.1001.b:0 "Bu nasıl olabilir?"

 agot_dragon_egg_cradling.1002.t:0 "Taş Yumurta"

 agot_dragon_egg_cradling.1002.young_desc:0 "[egg_owner.GetNamePossessive] odasına giriyor, [egg_owner.GetHerHis] ejderha yumurtasının beşikte çatlamayı beklediği yere yaklaşıyorum. Ellerimi yumurtanın pullu yüzeyinde gezdiriyor ve avucumun altında taştan başka bir şey hissetmeyince ürperiyorum. Alışılmış sıcaklık neredeyse tamamen yok olmuş; içindeki ejderha büyük olasılıkla kayıp, asla çatlamayacak.\n\n[egg_owner.GetHerHim]e denemesi için başka bir yumurta vereyim mi?"

 agot_dragon_egg_cradling.1002.desc:0 "[egg_owner.GetNamePossessive] odasına giriyorum; [egg_owner.GetHerHim]i odanın köşesindeki şöminenin yanında otururken, [egg_owner.GetHerHis] ejderha yumurtasını alevlerin hemen üzerinde kavramış halde görüyorum. Ateşten kıvrımlar pullu yüzeyin altını yalıyor ve duman yumurtanın alışılmış parlak rengini karartıyor. "It's gone cold," [egg_owner.GetSheHe] says, tears dripping down [egg_owner.GetHerHis] face. I reach through the smoke and run my hands along the surface. The egg is as lifeless as a stone.\n\nShould I have [egg_owner.GetHerHim] try another?"

 agot_dragon_egg_cradling.1002.a:0 "Başka birini deneyelim."

 agot_dragon_egg_cradling.1002.a.tt:0 "[egg_owner.GetNameNoTooltip], [new_egg.GetName]ni beşikte beklemeye başlayacak"

 agot_dragon_egg_cradling.1002.b:0 "Çok üzgünüm, [egg_owner.GetNameNoTooltip]..."

 agot_dragon_egg_cradling.2000.t:0 "Beşik Dostları"

 agot_dragon_egg_cradling.2000.desc_start1:0 "Hayranlıkla [child.GetName]ye bakıyorum; yarattığım şeye bak. [child.GetSheHe|U] koca dünyayı hak ediyor ve umarım bir gün buna gökler de dahil olur."

 agot_dragon_egg_cradling.2000.desc_start2:0 "[child.GetName] kırpışan gözlerle bana bakıyor, [child.GetHerHis] kolları bana uzanmaya çalışıyor. [child.GetHerHis] beşiğinin yanında duruyorum; elimde sıcaklık yayan bir ejderha yumurtası var."

 agot_dragon_egg_cradling.2000.desc_targ:0 "Rhaena, Jaehaerys ve Alysanne'in beşiklerine birer yumurta koyduğundan beri bu bir Targaryen geleneğidir."

 agot_dragon_egg_cradling.2000.desc:0 "Çocuğum bir ejderha yumurtasıyla beşik paylaşır ve yumurta [child.GetHerHim] için çatlarsa, aralarındaki bağ çok daha güçlü olacak."

 agot_dragon_egg_cradling.2000.a:0 "Birlikte beşikte bekleyecekler."

 agot_dragon_egg_cradling.2000.a.tt:0 "[child.GetNameNoTooltip], [cradle_egg.GetName]ni beşikte beklemeye başlayacak."

 agot_dragon_egg_cradling.2000.b:0 "Beşik, bir ejderha yumurtasının yeri değildir."

 agot_dragon_egg_cradling.2001.t:0 "İkisi İçin Bir Yumurta"

 agot_dragon_egg_cradling.2001.t.two:0 "İkisi İçin Yumurtalar"

 agot_dragon_egg_cradling.2001.desc.intro:0 "Hayranlıkla ikizlere, [child_1.GetName] ve [child_2.GetName]ye bakıyorum; yarattığım şeye bak. Her biri koca dünyayı hak ediyor ve umarım bir gün buna gökler de dahil olur."

 agot_dragon_egg_cradling.2001.desc_targ:0 "$agot_dragon_egg_cradling.2000.desc_targ$"

 agot_dragon_egg_cradling.2001.desc.two_egg:0 "Neyse ki ikisi için de yeterince yumurta var."

 agot_dragon_egg_cradling.2001.desc.one_egg:0 "Elimde yalnızca bir yumurta varken zor bir karar vermek zorundayım; yumurtayı [child_1.GetNamePossessiveNoTooltip] beşiğine mi koyayım, yoksa [child_2.GetNamePossessiveNoTooltip] beşiğine mi?"

 agot_dragon_egg_cradling.2001.a:0 "İkisi de yumurta alacak."

 agot_dragon_egg_cradling.2001.a.tt:0 "[child_1.GetNameNoTooltip] ve [child_2.GetNameNoTooltip]nün beşikte bekleyecekleri yumurtaları seçeceksiniz."

 agot_dragon_egg_cradling.2001.b:0 "Yalnızca [child_1.GetName] bir yumurtayla beşikte bekleyecek."

 agot_dragon_egg_cradling.2001.b.tt:0 "[child_1.GetNameNoTooltip]nün beşikte bekleyeceği yumurtayı seçeceksiniz."

 agot_dragon_egg_cradling.2001.b.tt.one_egg:0 "[child_1.GetNameNoTooltip], [cradle_egg_1.GetName] ile beşikte beklemeye başlayacak."

 agot_dragon_egg_cradling.2001.c:0 "Yalnızca [child_2.GetName] bir yumurtayla beşikte bekleyecek."

 agot_dragon_egg_cradling.2001.c.tt:0 "[child_2.GetNameNoTooltip]nün beşikte bekleyeceği yumurtayı seçeceksiniz."

 agot_dragon_egg_cradling.2001.c.tt.one_egg:0 "[child_2.GetNameNoTooltip], [cradle_egg_1.GetName] ile beşikte beklemeye başlayacak."

