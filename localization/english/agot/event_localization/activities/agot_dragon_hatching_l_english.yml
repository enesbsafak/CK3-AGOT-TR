 agot_dragon_hatching.0018.desc_knowledge:0 "Zorla kurban edeceğim kişinin seçimi dikkatle düşünmem gereken bir karardır; çünkü katılanların çoğu, çıkarma için bir canın alınması fikrinden şimdiden tedirgin. Kimi seçtiğim herkes tarafından görülecek ve akıllıca seçmeye özen göstermeliyim."

 agot_dragon_hatching.0018.desc_esoteric:0 "Zorla kurban edeceğim kişinin seçimi dikkatle düşünmem gereken bir karardır; çünkü kanın gücünün, can daha önemli bir bireye ait olduğunda daha güçlü olduğu teorize edilmiştir. Kralın, lordun ya da sıradan birinin kanı — hepsi eşit tartılmıyor olabilir..."

