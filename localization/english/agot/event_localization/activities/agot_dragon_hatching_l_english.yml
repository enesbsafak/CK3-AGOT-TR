 agot_dragon_egg_cradling.2002.t:0 "Beşik Yumurtası Seçimi"

 agot_dragon_egg_cradling.2002.desc:0 "Çocuğunuzun beşikte bekleyeceği yumurtayı seçin."

 agot_dragon_egg_cradling.2002.a:0 "Bu yumurta iş görür."

 agot_dragon_egg_cradling.2002.a.tt:0 "[child.GetNameNoTooltip], [cradle_egg.GetName] ile beşikte beklemeye başlayacak."

 agot_dragon_egg_cradling.2002.b:0 "Fikrimi değiştirdim."

 agot_dragon_egg_cradling.2012.t:0 "$agot_dragon_egg_cradling.2001.t.two$"

 agot_dragon_egg_cradling.2012.desc.intro:0 "Hayranlıkla ikizlere, [child_1.GetName] ve [child_2.GetName]ye bakıyorum; yarattığımız şeye bak. Her biri koca dünyayı hak ediyor ve umarım bir gün buna gökler de dahil olur. $agot_dragon_egg_cradling.2000.desc_targ$ [other_parent.GetTitledFirstNameNoTooltip] ve ben ikimizin de birer yumurtası var; ikisine tam yetecek kadar."

 agot_dragon_egg_cradling.2012.a:0 "[child_1.GetNameNoTooltip]ye bir yumurta sağlayacağım; [other_parent.GetTitledFirstNameNoTooltip] de [child_2.GetNameNoTooltip]ye."

 agot_dragon_egg_cradling.2012.a.tt:0 "[child_1.GetNameNoTooltip], [my_egg.GetName] ile beşikte beklemeye başlayacak. [child_2.GetNameNoTooltip], [parent_two_egg.GetName] ile beşikte beklemeye başlayacak."

 agot_dragon_egg_cradling.2012.b:0 "[child_2.GetNameNoTooltip]ye bir yumurta sağlayacağım; [other_parent.GetTitledFirstNameNoTooltip] de [child_1.GetNameNoTooltip]ye."

 agot_dragon_egg_cradling.2012.b.tt:0 "[child_1.GetNameNoTooltip], [parent_two_egg.GetName] ile beşikte beklemeye başlayacak. [child_2.GetNameNoTooltip], [my_egg.GetName] ile beşikte beklemeye başlayacak."

 agot_dragon_egg_cradling.2012.c:0 "Hiçbiri yumurta almayacak."

 agot_dragon_egg_cradling.child_cradle_title:0 "[child.GetName] Beşikte Beklemeye Başlıyor"

 agot_dragon_egg_cradling.child_cradle_desc:0 "[child.GetNameNoTooltip], [spouse.GetTitledFirstName]nün yumurtasıyla beşikte beklemeye başladı."

 agot_dragon_egg_cradling_birth.0002.t:0 "Yumurtam Çatladı!"

 agot_dragon_egg_cradling_birth.0002.desc:0 "Hayatımda hiç bu kadar sevinç hissetmemiştim! Yumurtam çatladı ve kabuğunun kalıntılarından bir ejderha sürünerek çıktı.\n\nPaylaştığımız bağı ve ömrümün sonuna dek yanımda olacaklarını şimdiden hissedebiliyorum. Cinsiyetlerinin ne olduğunu henüz söyleyemesem de, tarihin asla unutmayacağı bir isme ihtiyaçları var.\n\nOnlara ne ad vermeliyim?"

 agot_dragon_egg_cradling_birth.0002.a:0 "Birlikte bir ömür boyu macera yaşayacağız."

 agot_dragon_egg_cradling_birth.0002.a_tt_dragon_born:0 "Yeni bir [dragon|e] doğdu."

 agot_dragon_egg_cradling_birth.0002.a_tt_egg_destroyed:0 "#v Ejderha yumurtanız#! [artifact|e] #N yok edildi#!."

 agot_dragon_egg_cradling_birth.0003.t:0 "Bakımımdaki Bir Yavru"

 agot_dragon_egg_cradling_birth.0003.desc:0 "Bakımımdaki bir yumurta çatladı! [dragon.GetName] doğdu ve aileme katıldı; ancak cinsiyeti hemen belli değil, zamanla belirlenecek.\n\nŞimdilik [dragonkeepers|e], [dragon.GetNameNoTooltip]yi bakımlarına aldı; ben de barınma ve büyüme hazırlıklarını düşünmeliyim. Ama önce önemli şey önemlidir: bir ejderhanın bir isme ihtiyacı var. Ne olacak?"

 agot_dragon_egg_cradling_birth.0003.opt.a:0 "Tarihin sayfalarına kazınacak bir isim."

 agot_dragon_egg_cradling_birth.0004.t:0 "Cinsiyet Aşikâr!"

 agot_dragon_egg_cradling_birth.0004.desc:0 "[dragon_gender|EU] özünde gizemli bir kavramdır; ama bu sefer gizem ortadan kalkmış gibi görünüyor!\n\n[revealing.GetFullName] bana, [dragon.Custom('GetDragonSheHe')]nin yaşamının ilk haftasında sergilediği davranışlara dayanarak [dragon.GetName]nün bir [dragon.Custom('DragonFemaleMale')] ejderha olduğundan emin olduğunu söylüyor."

 agot_dragon_egg_cradling_birth.0004.a:0 "Kim mi iyi bir [dragon.Custom('DragonGirlBoy')]?"

 agot_dragon_egg_cradling_birth.0010.t:0 "[dragon.GetNameNoTooltip], Ejderha"

 agot_dragon_egg_cradling_birth.0010.desc.intro:0 "[child.GetNamePossessive] beşikte beklediği yumurta nihayet çatladı! [child.GetNameNoTooltip] ve [child.GetHerHis] [dragon.Custom('GetDragonColorFull')] ejderhası birbirinden ayrılmaz oldu; [child.GetSheHe] artık sürekli ondan bahsediyor."

 agot_dragon_egg_cradling_birth.0010.desc.child:0 "Bugün [child.GetNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]m, en şaşırtıcı açıklamayı yaptı. Çocukla ejderhayı konuşurken [child.GetSheHe] cesurca söze karıştı: "#italic the naaame#! is [dragon.GetName]!" "

 agot_dragon_egg_cradling_birth.0010.desc.courtier:0 "Bugün saray mensubum [child.GetNameNoTooltip] en şaşırtıcı açıklamayı yaptı. Çocukla ejderhayı konuşurken [child.GetSheHe] cesurca söze karıştı: "#italic the naaame#! is [dragon.GetName]!" "

 agot_dragon_egg_cradling_birth.0010.a:0 "[dragon.GetNameNoTooltip], ne uygun bir isim."

 agot_dragon_egg_cradling_birth.0010.b:0 "[dragon_baby_reference.GetNameNoTooltip] daha uygun olmaz mı?"

 agot_dragon_egg_cradling_birth.0010.b.tt:0 "Ejderhanın adı [dragon_baby_reference.GetNameNoTooltip] olacak."

 agot_dragon_egg_cradling_birth.0010.c:0 "Bu bir ejderha için uygun bir isim değil, bunun yerine şunu dene..."

 agot_dragon_egg_cradling_birth.0010.c.tt:0 "Ejderha için yeni bir isim seçeceksiniz."

 agot_dragon_egg_cradling_birth.0011.t:0 "$birth.9004.t$"

 agot_dragon_egg_cradling_birth.0011.desc:0 "Ejderhanın adı saçmalıktı; [child.GetName], anlayacak yaşa geldiğinde bana teşekkür edecek."

 agot_dragon_egg_cradling_birth.0011.a:0 "Çok daha iyi."

 agot_dragon_egg_lay.0001.t:0 "[dragon_parent.GetNameNoTooltip] Bir Yumurta Yumurtluyor!"

 agot_dragon_egg_lay.0001.desc:0 "[dragon_parent.GetName] #bold bir yumurta#! yumurtladı! [dragon_parent.GetNameNoTooltip] ondan ayrılmaya hazır olduğu anda ejderha bakıcılarım yumurtayı kuluçkaya hızla taşıdı. Geriye bu kadar az ejderha yumurtası ve daha da az yaşayan ejderha kalmışken, [dragon_parent.GetNamePossessiveNoTooltip] yeni armağanı paha biçilemez değerde.\n\nDoğru alıcıyı bulursam tek bir yumurta bile beni akıl almaz zenginliğe kavuşturabilir... Yine de ailemin geleceğini güvence altına almak için saklamak en iyisi olabilir?\n\nBelki [ROOT.Char.GetHouse.GetName] Hanesi yakında bir ejderhaya daha sahip olur?"

 agot_dragon_egg_lay.0001.opt:0 "Bu harika bir haber!"

 agot_dragon_egg_lay.0002.t:0 "[dragon_parent.GetNameNoTooltip] Bir Döşe Doğuruyor!"

 agot_dragon_egg_lay.0002.desc:0 "[dragon_parent.GetName] #bold [dragon_parent.MakeScope.Var('spawn_eggs').GetValue] yumurtalık#! bir döşe yumurtladı! Ejderha bakıcılarım tek bir yumurtadan fazlasını beklemedikleri için kuluçka için yeni alanları hızla hazırladı.\n\nBu hazinelere kavuştuğum için dünyanın geri kalanı kıskançlıkla izliyor. Bugün [dragon_parent.GetNameNoTooltip]'ten doğan şey, neredeyse tüm ailelerin asla ulaşamayacağı servetten ya da kullanabileceklerinden fazlası olan güçten daha değerli.\n\nYakında [ROOT.Char.GetHouse.GetName] Hanesi'nin tüm soyları gökyüzüne yükselecek!"

 agot_dragon_egg_lay.0002.opt:0 "Kutsandık!"

 dragon_laid_eggs:0 "Ejderhanız [dragon_parent.GetName] [dragon_parent.MakeScope.Var('spawn_eggs').GetValue] yumurta yumurtladı"

 dragon_laid_egg_before_death:0 "Ejderhanız [dragon_parent.GetName], [dragon_parent.GetSheHe] ölmeden önce bir yumurta yumurtladı"
