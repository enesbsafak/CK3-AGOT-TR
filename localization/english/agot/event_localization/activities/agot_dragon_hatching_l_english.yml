 agot_dragon_hatching.0019.desc:0 "Hiç kimse bir ejderha çıkarma töreninin kurbanız olacağını beklemiyordu; ama [host.GetTitledFirstNamePossessive] muhafızlarının yaklaştığını görünce, seçilen kişinin ben olduğumu anlıyorum!\n\nBeni götürmelerine bir an kaldı — ne yapmalıyım?!"

