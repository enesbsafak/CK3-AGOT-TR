 agot_dragon_hatching.0012.desc_knowledge:0 "Tutsak seçimi dikkatle düşünmem gereken bir karardır; çünkü katılanların çoğu, çıkarma için bir canın alınması fikrinden şimdiden tedirgin. Kimi seçtiğim herkes tarafından görülecek ve akıllıca seçmeye özen göstermeliyim."

 agot_dragon_hatching.0012.desc_esoteric:0 "Tutsak seçimi dikkatle düşünmem gereken bir karardır; çünkü kanın gücünün, can daha önemli bir bireye ait olduğunda daha güçlü olduğu teorize edilmiştir. Kralın, lordun ya da sıradan birinin kanı — hepsi eşit tartılmıyor olabilir..."

 agot_dragon_hatching.0012.opt.a:0 "Sonuçta itiraz edemezler..."

 agot_dragon_hatching.0012.opt.a_tt:0 "Seçilen #bold;V tutsağın canı#! bu çıkarmanın güç kaynağı olacak"

 agot_dragon_hatching.0012.opt.b:0 "Bir düşününce, başka seçenekler var."

 agot_dragon_hatching.0012.opt.b_tt:0 "Geri dönüp başka bir kurban seçeceksin"

 agot_dragon_hatching.0013.t:0 "Güç Kaynağı"

 agot_dragon_hatching.0013.desc_opening_knowledge:0 "Toplanan üstatlar ve âlimler, nadiren tek bir yerde toplanan bir bilgi pınarıdır. Okumuş adamlar arasında iyi bilindiği üzere, zanaatlarının inceliklerini tartışmayı ve müzakere etmeyi severler. Günün konusu çıkarmanın güç kaynağı ve tartışma kızışmış durumda. Sonunda kararı [host.GetTitledFirstName] verecek.\n\n"

 agot_dragon_hatching.0013.desc_opening_esoteric:0 "Beni çevreleyen gizli bilimlerin çeşitli uygulayıcıları ve satıcıları rengârenk bir güruh; ancak çıkarmanın güç kaynağının son derece önemli olduğu inancında birleşmişler. Tartışma kızışmış durumda, ama sonunda kararı [host.GetTitledFirstName] verecek.\n\n"

 agot_dragon_hatching.0013.desc_animal_pet_dog:0 "Gerçek bir fedakârlık gösterisiyle, ev sahibimiz sevgili köpeği [host.Custom('DogStoryName')]'nin çıkarmanın güç kaynağı olacağını paylaşıyor."

 agot_dragon_hatching.0013.desc_animal_pet_cat:0 "Gerçek bir fedakârlık gösterisiyle, ev sahibimiz sevgili kedisi [host.Custom('CatStoryName')]'nin çıkarmanın güç kaynağı olacağını paylaşıyor."

 agot_dragon_hatching.0013.desc_animal_livestock:0 "Kararın isabetinden emin olmasam da, ev sahibimiz köylülerden alınan yerel bir yük hayvanını çıkarmanın güç kaynağı olarak kullanmayı seçti."

 agot_dragon_hatching.0013.desc_animal_wild:0 "[host.GetSheHe|U], ejderhaların yaban ruhunun ancak bir yaban hayvanının kurban edilmesiyle çağrılabileceğine inanıyor ve uygun bir yaratık getirmeleri için avcılar gönderdi."

 agot_dragon_hatching.0013.desc_animal_exotic:0 "Kuşkusuz egzotik bir gösteri olacak şekilde, ev sahibimiz Uzak Doğu'dan bir yaratığı çıkarmanın güç kaynağı olarak kullanmayı seçti; yaratık şu anda bulunduğumuz yere yolda."

 agot_dragon_hatching.0013.desc_blood_myself:0 "Gerçek bir fedakârlık gösterisiyle, ev sahibimiz başarıyı garantilemenin tek yolunun bu olduğuna inanarak [host.GetHerHis] kendi kanını çıkarmanın güç kaynağı olarak kullanmayı seçti."

 agot_dragon_hatching.0013.desc_blood_leader:0 "[ritual_leader_character.GetHerHis] çabalarına gerçek bir inanç gösterisiyle, törenin lideri [ritual_leader_character.GetFirstNameNicknamed], [ritual_leader_character.GetHerHis] kendi kanını çıkarmanın güç kaynağı olarak sundu."

 agot_dragon_hatching.0013.desc_blood_everyone:0 "[host.GetSheHe|U], toplananların birleşik gücünün ejderhayı ortaya çıkarmaya yeteceğine inanarak, hazır bulunan herkesi kanlarını çıkarmanın güç kaynağı olarak sunmaya çağırdı."

 agot_dragon_hatching.0013.desc_blood_prisoner:0 "[host.GetHerHis] bilgeliğiyle, [host.GetSheHe] [prisoner.GetSheHe] itiraz edecek durumda olmadığından, [host.GetHerHis] tutsağı [prisoner.GetFirstName]nün kanını çıkarmanın güç kaynağı olarak kullanmayı seçti."

 agot_dragon_hatching.0013.desc_life_myself:0 "Gerçek bir fedakârlık gösterisiyle, ev sahibimiz [host.GetHerHis] kendi canını bu girişime adayarak, [host.GetHerHis] canını çıkarmanın güç kaynağı olarak kullanmayı seçti."

 agot_dragon_hatching.0013.desc_life_leader:0 "Buradaki amacına gerçek bir inanç gösterisiyle, törenin lideri [ritual_leader_character.GetFirstNameNicknamed], [ritual_leader_character.GetHerHis] kendi canını çıkarmanın güç kaynağı olarak sundu."

 agot_dragon_hatching.0013.desc_life_attendee:0 "Törenin amacına gerçek bir inanç gösterisiyle, [attendee.GetFirstName] [attendee.GetHerHis] kendi canını çıkarmanın güç kaynağı olarak sundu."

 agot_dragon_hatching.0013.desc_life_prisoner:0 "[host.GetHerHis] bilgeliğiyle, [host.GetSheHe] [prisoner.GetSheHe] itiraz edecek durumda olmadığından, [host.GetHerHis] tutsağı [prisoner.GetFirstName]nün canını çıkarmanın güç kaynağı olarak kullanmayı seçti."

 agot_dragon_hatching.0013.desc_life_everyone:0 "[host.GetSheHe|U] henüz bu kararı vermeye hazır görünmüyor ve yalnızca zamanı gelince hepimizin öğreneceğini söylüyor."

 agot_dragon_hatching.0013.desc_close_happy:0 "Gerçekten de bu, büyük bir etkinliğe dönüşüyor!"

 agot_dragon_hatching.0013.desc_close_worried:0 "Tören ilerledikçe içimde bir dehşet hissi uyanmasına engel olamıyorum."

 agot_dragon_hatching.0013.opt.a:0 "Sıradaki: tören."

 agot_dragon_hatching.0014.t:0 "Gücün Katalizörü"

 agot_dragon_hatching.0014.desc_opening_knowledge:0 "Güç kaynağı belirlendi; şimdi, onun etkinleşmesini tetikleyerek yumurtayı canlandırmanın en iyi yolunu belirlemeliyiz. İçindeki ejderhanın sağlıklı ve güçlü doğmasını sağlamak için yumurta belirli bir sıcaklığa kadar ısıtılmalı."

 agot_dragon_hatching.0014.desc_opening_esoteric:0 "Kurban belirlendiğine göre, artık verilen can gücünün enerjisini yumurtaya işlemek için katalizörü hazırlamalıyız. Gelecek ritüelde açığa çıkacak enerjiler ne çok yoğun ne de çok zayıf olmalı; yoksa yumurta bu süreçte yok olabilir."

 agot_dragon_hatching.0014.desc_minor:0 "Çıkarma için katalizör olarak basit bir ısı kaynağı kullanmayı seçtim; süslemeye ya da törene gerek yok. Yine de ne kullanılacağı kararı hayati önem taşıyor."

 agot_dragon_hatching.0014.desc_medium:0 "Bunun için gerekli yatırımı ve hazırlıkları çoktan yaptım; ancak gerekli ısının tam olarak nasıl sağlanacağı hâlâ bir tartışma konusu."

 agot_dragon_hatching.0014.desc_major:0 "Törene büyük miktarda kaynak ve uygun tantana yatırıldığına göre, artık özel tasarlanmış yuvasındaki yumurtayı nasıl ısıtacağıma karar vermeliyim."

 agot_dragon_hatching.0014.desc_massive:0 "Okuduğum ejderha bilgisinin her sayfası ve Valyria tanrılarına ettiğim her dua beni bu ana getirdi. Yaptığım kapsamlı ve geniş kapsamlı hazırlıklar, ne olursa olsun yumurtanın mükemmel sıcaklığa kadar ısıtılmasını sağlayacak. Yine de artık yumurtayı neyin ısıtacağına karar vermeliyim."

 agot_dragon_hatching.0014.opt.warning:0 "#warning @warning_icon! Çıkarma törenini durdurmak için son şansınız bu #!"

 agot_dragon_hatching.0014.opt.a_rational:0 "Eee, odunla, başka neyle?"

 agot_dragon_hatching.0014.opt.a_bold:0 "Odun ve çıra getirin!"

 agot_dragon_hatching.0014.opt.a_tt:0 "Bu çıkarma için ısı kaynağı olarak #bold;V odun#! kullanacaksınız"

 agot_dragon_hatching.0014.opt.b:0 "Kor kömür iş görür."

 agot_dragon_hatching.0014.opt.b_ttplsnohasherror:0 "Bu çıkarma için ısı kaynağı olarak #bold;V kor kömür#! kullanacaksınız"

 agot_dragon_hatching.0014.opt.c:0 "Isı kaynağı yanar yağ olacak."

 agot_dragon_hatching.0014.opt.c_tt:0 "Bu çıkarma için ısı kaynağı olarak #bold;V yağ#! kullanacaksınız"

 agot_dragon_hatching.0014.opt.d:0 "En kızgın alevlerden başkası olmaz! Yabanağını getirin!"

 agot_dragon_hatching.0014.opt.d_tt:0 "Bu çıkarma için ısı kaynağı olarak #WF2;bold yabanağını#! kullanacaksınız"

 agot_dragon_hatching.0014.opt.e:0 "Ejderhadağı'nı kullanmalıyız!"

 agot_dragon_hatching.0014.opt.e_tt:0 "Bu çıkarma için ısı kaynağı olarak #bold;V volkanı#! kullanacaksınız"

 agot_dragon_hatching.0014.opt.f:0 "Isı kaynağımız güneşin gücü olacak! Büyüteci getirin!"

 agot_dragon_hatching.0014.opt.f_tt:0 "#bold;V Büyüteç#! mi kullanacaksınız...? Öyle diyorsanız..."

 agot_dragon_hatching.0014.opt.leave_coward:0 "Bunu sürdüremem!"

 agot_dragon_hatching.0014.opt.leave_bold:0 "Bu artık çok ileri gitti!"

 agot_dragon_hatching.0014.opt.leave_rational:0 "Bu asla işe yaramaz!"

 agot_dragon_hatching.0014.opt.leave_tt:0 "#warning @warning_icon! Törenden vazgeçeceksiniz #!"

 agot_dragon_hatching.0015.t:0 "Yeni Şafak Yok"

 agot_dragon_hatching.0015.desc_knowledge:0 "Hizmetkarların sancakları indirdiğini ve üstatların ciltlerini topladığını görüyorum. Duyuru yapılmadan önce nedenini çoktan biliyorum. [host.GetTitledFirstName] cesaretini yitirdi — tören olmayacak. Yumurta kırılmamış, içindeki ejderha uyanmamış halde duruyor. Tören bitti ve yeni bir ejderha hayali öldü."

 agot_dragon_hatching.0015.desc_esoteric:0 "Ne olduğunu anlamadan büyücüler ve maegiler kovuldu. Mumlar söndürüldü ve tütsüler üflendi. Görünüşe göre [host.GetTitledFirstName] yaklaşan ritüelden vazgeçti. Yumurta kırılmamış, içindeki ejderha uyanmamış halde duruyor. Tören bitti ve yeni bir ejderha çağı hayali öldü."

 agot_dragon_hatching.0015.opt.a_rational:0 "Belki de hayırlısı budur."

 agot_dragon_hatching.0015.opt.a_coward:0 "Tanrılara şükür!"

 agot_dragon_hatching.0015.opt.a_bold:0 "[host.GetSheHe]nün vazgeçtiğine inanamıyorum!"

 agot_dragon_hatching.0016.t:0 "Tören"

 agot_dragon_hatching.0016.desc_opening_craven:0 "Elim titriyor ve sakinleştirmek için öbür elimle tutuyorum."

 agot_dragon_hatching.0016.desc_opening_normal:0 "Hava beklentiyle dolu; toplanan insanlar dile getirilmiş ve dile getirilmemiş heyecanı paylaşıyor."

 agot_dragon_hatching.0016.desc_opening_bold:0 "Yeni bir çağ doğuyor ve onun başlangıcında olmak ne büyük keyif!"

 agot_dragon_hatching.0016.desc_knowledge_opening_me:0 "Törene başlama zamanı geldi. Ellerimde yumurta, arkamda çağların bilgisiyle toplananların önünde duruyorum."

 agot_dragon_hatching.0016.desc_knowledge_opening_other:0 "Törene başlama zamanı geldi. [ritual_leader_character.GetFirstNameNicknamed], [ritual_leader_character.GetHerHis] ellerinde yumurta, [ritual_leader_character.GetHerHis] arkasında çağların bilgisiyle üstümüzde duruyor."

 agot_dragon_hatching.0016.desc_esoteric_opening_me:0 "Ritüele başlama zamanı geldi. Ayinler okundu ve iksirler hazırlandı. Ellerimdeki yumurta sıcak hissederken, çevremde yükselen ilahileriyle toplananların önünde duruyorum."

 agot_dragon_hatching.0016.desc_esoteric_opening_other:0 "Ritüele başlama zamanı geldi. Ayinler okundu ve iksirler hazırlandı. [ritual_leader_character.GetFirstNameNicknamed] önümüzde duruyor; uzun zaman önce unutulmuş bir dilde şarkı söylerken öğretilen ilahi boğazımdan dökülüyor."

 agot_dragon_hatching.0016.desc_esoteric_opening_other_prisoner:0 "Ritüele başlama zamanı geldi. Ayinler okundu ve iksirler hazırlandı. Başıma ne geleceğinden endişelenirken garip ilahiler odayı dolduruyor."

 agot_dragon_hatching.0016.desc_animal_pet_dog:0 "Köpek önüne getiriliyor: "

 agot_dragon_hatching.0016.pet_dog_host:0 "[ROOT.Char.Custom('DogStoryName')] getirilirken [ROOT.Char.Custom('DogStorySheHe')] kararsız görünüyor: "

 agot_dragon_hatching.0016.desc_animal_pet_cat:0 "Kedi önüne getiriliyor: "

 agot_dragon_hatching.0016.pet_cat_host:0 "[ROOT.Char.Custom('CatStoryName')] getirilirken [ROOT.Char.Custom('CatStorySheHe')] temkinli görünüyor: "

 agot_dragon_hatching.0016.desc_animal_livestock:0 "[ROOT.Char.Custom('RegionalFarmAnimal')] önüne getiriliyor: "

 agot_dragon_hatching.0016.desc_animal_wild:0 "Avlanmış hayvanların bedenleri önüne getiriliyor: "

 agot_dragon_hatching.0016.desc_animal_exotic:0 "Önüme getirilen yaratığı tanıyamıyorum: "

 agot_dragon_hatching.0016.desc_me_stop:0 "benim."

 agot_dragon_hatching.0016.desc_leader_stop:0 "[ritual_leader_character.GetFirstNameNicknamedNoTooltip]."

 agot_dragon_hatching.0016.desc_animal_my_dog:0 "Ne olacağını bilerek [ROOT.Char.Custom('DogStoryHerHim')] görmek yüreğimi sızlatıyor; ama bunun yapılması gerektiğini biliyorum."

 agot_dragon_hatching.0016.desc_animal_my_cat:0 "[ROOT.Char.Custom('CatStoryHerHim')] görmek yüreğimi sızlatıyor; ama bunun yapılması gerektiğini biliyorum."

 agot_dragon_hatching.0016.desc_animal_exotic_end:0 "Tüyleri tuhaf ve çıkardığı sıkıntı sesleri her kulağa yabancı."

 agot_dragon_hatching.0016.desc_animal_kill_me:0 "Bıçağı kaldırıp tek temiz bir vuruşla indiriyorum; yaratığın canı tek bir hamleyle sona eriyor."

 agot_dragon_hatching.0016.desc_animal_kill_leader:0 "[ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı kaldırıp tek temiz bir vuruşla indiriyor; yaratığın canı tek bir hamleyle sona eriyor."

 agot_dragon_hatching.0016.desc_blood_me:0 "Kâse önüme getiriliyor, kolum "

 agot_dragon_hatching.0016.desc_blood_me_me:0 "açık ve hazır. Bıçağı tenimde gezdirdiğimde dudağımı ısırıyorum; kızıl kan kâseye akıyor."

 agot_dragon_hatching.0016.desc_blood_me_prisoner:0 "kelepçelere karşı çırpınırken [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı kolumda gezdiriyor; kızıl kan kâseye akıyor. Tüm bu adaletsizliğe haykırıyorum ama çığlıklarım duyulmuyor."

 agot_dragon_hatching.0016.desc_blood_me_leader:0 "açık ve hazır. [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı kolumda gezdirirken dudağımı ısırıyorum; kızıl kan kâseye akıyor."

 agot_dragon_hatching.0016.desc_blood_me_everyone:0 "Diğerlerinin de aynısını yapmasını izliyorum; [ritual_leader_character.GetFirstNameNicknamedNoTooltip] her birini aynı şekilde kesiyor."

 agot_dragon_hatching.0016.desc_blood_me_everyone_leader:0 "Ardından herkesin önüne geçip toplanan herkese aynısını yapıyorum; birleşen can kanımız tek bir havuzda toplanıyor."

 agot_dragon_hatching.0016.desc_blood_leader:0 "Kâse [ritual_leader_character.GetFirstNameNicknamedNoTooltip]nün önüne getiriliyor; [ritual_leader_character.GetHerHis] kolu açık ve hazır. [ritual_leader_character.GetSheHe|U], bıçağı [ritual_leader_character.GetHerHis] teninde gezdirdiğinde [ritual_leader_character.GetHerHis] dudağını ısırıyor; kızıl kan seçilen kâseye akıyor."

 agot_dragon_hatching.0016.desc_blood_prisoner:0 "Kâse [prisoner.GetName]nün önüne getiriliyor; [prisoner.GetSheHe] haykırırken kolu zorla bastırılıyor, bıçak [prisoner.GetHerHis] teninde gezdiriliyor ve kızıl kan kâseye akıyor."

 agot_dragon_hatching.0016.desc_blood_everyone_refused:0 "Kâse benim dışımda herkesin önüne getiriliyor; her kol açık ve hazır. Bıçak sırayla her birinin üzerinde gezdiriliyor; yaralıların çığlıkları odayı doldururken kızıl kan kâseye akıyor. Aralarında olmadığıma sevinsem de bana utandırıcı bakışlarla bakıyorlar."

 agot_dragon_hatching.0016.desc_life_myself_me_self:0 "Derin bir nefes alıp öne çıkıyorum ve bıçağı elime alıyorum; nihai fedakârlığı yapmaya hazırım. Yumurtanın önünde duruyorum, bıçak boğazıma dayalı ve #emp kesiyorum#!.\n\nBir anlık acı, göğsümden süzülen bir sıcaklık hissi... ve sonra hiçbir şey..."

 agot_dragon_hatching.0016.desc_life_myself_me_leader:0 "Derin bir nefes alıp öne çıkıyorum; [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı boğazıma dayıyor. Gözlerimi kapatıyorum...\n\nBir anlık acı, göğsümden süzülen bir sıcaklık hissi... ve sonra hiçbir şey..."

 agot_dragon_hatching.0016.desc_life_myself_other_self:0 "Hiç de azımsanmayacak bir hayranlık ve dehşetle [host.GetTitledFirstNameNoTooltip]nün öne çıkışını izliyorum. [host.GetSheHe|U] yumurtanın önünde duruyor, bıçak [host.GetHerHis] boğazına dayalı ve #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [host.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_myself_other_leader:0 "Hiç de azımsanmayacak bir hayranlık ve dehşetle [host.GetTitledFirstName]nün yumurtanın önüne çıkışını izliyorum. [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı [host.GetHerHis] boğazına dayıyor. [host.GetTitledFirstNameNoTooltip] [host.GetHerHis] gözlerini kapatıyor ve #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [host.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_leader_self:0 "Derin bir nefes alıp öne çıkıyorum ve [host.GetTitledFirstNamePossessive] davası için nihai fedakârlığı yapmaya hazır olarak bıçağı elime alıyorum. Yumurtanın önünde duruyorum, bıçak boğazıma dayalı ve #emp kesiyorum#!. Bir anlık acı, göğsümden süzülen bir sıcaklık hissi... ve sonra hiçbir şey..."

 agot_dragon_hatching.0016.desc_life_leader_host:0 "[ritual_leader_character.GetFirstNameNicknamedPossessiveNoTooltip]nün bana ve davama olan bağlılığı karşısında mütevazılaşıyorum; [ritual_leader_character.GetSheHe] öne çıkıyor. [ritual_leader_character.GetSheHe|U] yumurtanın önünde duruyor, bıçak [ritual_leader_character.GetHerHis] boğazına dayalı ve #emp kesiyor#!. [ritual_leader_character.GetHerHis|U] kanı yumurtanın üzerine akıyor ve [ritual_leader_character.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_leader_other:0 "[ritual_leader_character.GetFirstNameNicknamedPossessiveNoTooltip]nün [host.GetTitledFirstNamePossessive] davasına olan bağlılığını hayranlıkla izliyorum; [ritual_leader_character.GetFirstNameNoTooltip] öne çıkıyor. [ritual_leader_character.GetSheHe|U] yumurtanın önünde duruyor, bıçak [ritual_leader_character.GetHerHis] boğazına dayalı ve #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [ritual_leader_character.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_attendee_me:0 "Derin bir nefes alıp öne çıkıyorum; [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı boğazıma dayıyor. Bu yeni çağı getirmek için nihai fedakârlığı yapmaya hazır, gözlerimi kapatıyorum...\n\nBir anlık acı, göğsümden süzülen bir sıcaklık hissi... ve sonra hiçbir şey..."

 agot_dragon_hatching.0016.desc_life_attendee_leader:0 "[attendee.GetFirstNamePossessive] [host.GetFirstNamePossessiveOrMyNoTooltip] davasına olan bağlılığı karşısında mütevazılaşıyorum; [attendee.GetSheHe] yumurtanın önüne çıkıyor. Bıçağı [attendee.GetHerHis] boğazına dayıyorum ve #emp kesiyorum#!. [attendee.GetHerHis|U] kanı yumurtanın üzerine akıyor ve [attendee.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_attendee_host:0 "[attendee.GetFirstNamePossessive] bana ve davama olan bağlılığı karşısında mütevazılaşıyorum; [attendee.GetSheHe] öne çıkıyor. [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı [attendee.GetHerHis] boğazına dayarken [attendee.GetSheHe|U] yumurtanın önünde duruyor. [attendee.GetSheHe|U] [attendee.GetHerHis] gözlerini kapatıyor ve [ritual_leader_character.GetFirstNameNicknamedNoTooltip] #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [attendee.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_attendee_other:0 "[attendee.GetFirstNamePossessive] davaya olan bağlılığını hayranlıkla izliyorum; [attendee.GetSheHe] nihai fedakârlığı yapmaya hazır şekilde öne çıkıyor. [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı [attendee.GetHerHis] boğazına dayarken [attendee.GetSheHe|U] yumurtanın önünde duruyor ve #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [attendee.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_attendee_me_unwilling:0 "Bir homurtuyla öne itiliyorum; [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı boğazıma dayıyor. Bir küfür savurmak için ağzımı açıyorum ama [ritual_leader_character.GetSheHe] daha hızlı...\n\nBir anlık acı, göğsümden süzülen bir sıcaklık hissi... ve sonra hiçbir şey..."

 agot_dragon_hatching.0016.desc_life_attendee_leader_unwilling:0 "[host.GetFirstNamePossessiveOrMyNoTooltip] davası için [attendee.GetFirstNamePossessive]nün öne itilişini izliyorum. [attendee.GetSheHe|U] yumurtanın önüne zorla çıkarılıyor ve ben bıçağı [attendee.GetHerHis] boğazına dayıyorum. #emp Kes#!. [attendee.GetHerHis|U] kanı yumurtanın üzerine akıyor ve [attendee.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_attendee_host_unwilling:0 "Davam için [attendee.GetFirstNamePossessive]nün öne itilişini izliyorum. [attendee.GetSheHe|U] yumurtanın önüne zorla çıkarılıyor ve [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı [attendee.GetHerHis] boğazına dayıyor. #emp Kes#!. [attendee.GetHerHis|U] kanı yumurtanın üzerine akıyor ve [attendee.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_attendee_other_unwilling:0 "Dehşet içinde [attendee.GetFirstNamePossessive]nün öne itilişini izliyorum. [attendee.GetSheHe|U] yumurtanın önüne zorla çıkarılıyor ve [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı [attendee.GetHerHis] boğazına dayıyor. #emp Kes#!. [attendee.GetHerHis|U] kanı yumurtanın üzerine akıyor ve [attendee.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_prisoner_me:0 "Bağlarıma karşı çırpınırken yumurtanın önüne getiriliyorum. [ritual_leader_character.GetFirstNameNicknamedNoTooltip] soğuk bir bıçağı boğazıma dayıyor ve tüm bu adaletsizliğe haykırmadan önce boynumda keskin bir acı hissediyorum. Görüşüm bulanıyor, göğsüm sıcak hissediyor ama içeriden soğuyor ve sonra hiçbir şey hissetmiyorum..."

 agot_dragon_hatching.0016.desc_life_prisoner_leader:0 "Muhafızlara tutsağı getirmelerini işaret ediyorum. [prisoner.GetFirstNameNoTooltip] yumurtanın önüne getiriliyor ve bıçağı [prisoner.GetHerHis] boğazına doğrultuyorum. Zamanlama çok önemli; [prisoner.GetSheHe] daha konuşamadan #emp kesiyorum#!. Kan yumurtanın üzerine akıyor ve [prisoner.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_prisoner_host:0 "Muhafızlara tutsağı getirmelerini işaret ediyorum. [prisoner.GetFirstNameNoTooltip] yumurtanın önüne getiriliyor ve [ritual_leader_character.GetFirstNameNicknamedNoTooltip] bıçağı [prisoner.GetHerHis] boğazına doğrultuyor. Zamanlama çok önemli; [ritual_leader_character.GetFirstNameNicknamedNoTooltip], [prisoner.GetSheHe] daha konuşamadan #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [prisoner.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_prisoner_other:0 "Huzursuzlukla muhafızların [prisoner.GetFirstNameNoTooltip]yi yumurtanın önüne getirmesini izliyorum. [ritual_leader_character.GetFirstNameNicknamedNoTooltip], [prisoner.GetSheHe] daha konuşamadan bıçağı [prisoner.GetHerHis] boğazına doğrultuyor ve #emp kesiyor#!. Kan yumurtanın üzerine akıyor ve [prisoner.GetSheHe] cansız bir biçimde yere düşüyor."

 agot_dragon_hatching.0016.desc_life_everyone_me:0 "Sırayla misafirlerime, ardından muhafızlarıma bakıyorum. Bir baş selamıyla her birini öne getirmeye başlıyorlar. Her biri yumurtanın önüne getirilirken, bıçak boğazlarına dayanırken ve canları çıkarma için verilirken odayı itiraz, öfke ve korku çığlıkları dolduruyor. Hazır bulunan herkesin kanı çevremde toplanırken yumurtanın önünde duruyorum; sonunda sıra bana geliyor. Talimatlar açık; bununla kesinlikle başarılı olmalıyız.\n\nGözlerimi kapatıyorum, bıçağın boğazımda sürtündüğünü hissediyorum ve sonra hiçbir şey yok..."

 agot_dragon_hatching.0016.desc_life_everyone_oh_no:0 "Ne kurban edileceğine dair hâlâ bir söz yokken, muhafızların kılıçlarını çekip herkesi öne getirmeye başlaması karşısında şoka uğruyorum. Odadaki itiraz, öfke ve korku çığlıklarına benim sesim de karışıyor. Yine de gözlerimin önünde her biri yumurtanın önüne getiriliyor, bıçak boğazlarına dayanıyor ve canları çıkarma için veriliyor. İtiraz ediyorum ama çığlıklarım duyulmuyor. Direniyorum ama çabalarım boşa. Son bir nefret ve meydan okuma bakışıyla yumurtanın önüne getiriliyorum, bıçak boğazıma dayanıyor ve canım çıkarma için veriliyor..."

 agot_dragon_hatching.0016.desc_newline:0 "\n\n"

 agot_dragon_hatching.0016.desc_minor_wood:0 "Odunlar bir yığın hâlinde diziliyor ve yumurta üstüne yerleştiriliyor. Alevler yakılıyor ve ısı yükselmeye başlıyor."

 agot_dragon_hatching.0016.desc_minor_coal:0 "Kor kömürler yumurtanın altına yerleştirilerek alttan ısıtıyor."

 agot_dragon_hatching.0016.desc_minor_oil:0 "Yumurta bir yağ kâsesine yerleştiriliyor; sıvı, ısınmayı başlatmak için bir meşaleyle tutuşturuluyor."

 agot_dragon_hatching.0016.desc_minor_wildfire:0 "Yabanağı yumurtanın üzerine dökülüp tutuşturuluyor; parlayan yeşil alevler kabuğu yalıyor."

 agot_dragon_hatching.0016.desc_minor_lava:0 "Küçük bir lav damarı bulunuyor ve yumurta küçük bir erimiş kaya havuzuna yerleştiriliyor."

 agot_dragon_hatching.0016.desc_minor_magnifying_glass:0 "Yumurtanın önüne büyük bir mercek getiriliyor; güneş ışınları onun içinden odaklanarak kabuğa ısı uygulanıyor."

 agot_dragon_hatching.0016.desc_medium_wood:0 "Büyük bir odun yığını kuruluyor; yumurta üstüne yerleştiriliyor ve eşit ısınma sağlamak için çevresinde küçük ateşler yakılıyor."

 agot_dragon_hatching.0016.desc_medium_coal:0 "Yumurtanın önüne halka biçiminde kor kömürler yerleştiriliyor, üzerlerine büyük bir mangal konuyor. Yumurta içine yerleştiriliyor; ısı alttan yükseliyor."

 agot_dragon_hatching.0016.desc_medium_oil:0 "Yumurtanın önüne karışık yağlarla dolu büyük bir kâse getiriliyor. Yumurta içine yerleştiriliyor ve sıvı, ısınmayı başlatmak için bir meşaleyle tutuşturuluyor."

 agot_dragon_hatching.0016.desc_medium_wildfire:0 "Bir yabanağı havuzu çıkarılıyor ve yumurta içine daldırılıyor. Sıvı tutuşturuluyor; uhrevi yeşil alevler içindeki yumurtayı örtüyor."

 agot_dragon_hatching.0016.desc_medium_lava:0 "Büyük bir lav havuzu bulunuyor ve yumurta dikkatle içine yerleştiriliyor. Erimiş kaya yumurtanın çevresinde köpürüp kaynıyor; ısı onu ısıtmak için yükseliyor."

 agot_dragon_hatching.0016.desc_medium_magnifying_glass:0 "Yumurtanın önüne büyük bir mercek getiriliyor; güneş ışınları onun içinden odaklanarak kabuğa ısı uygulanıyor. Mercek yavaş bir çemberde döndürülüyor; her geçişte ısı yükseliyor."

 agot_dragon_hatching.0016.desc_major_wood:0 "Hayatımda görmediğim büyüklükte bir odun yığını kuruluyor. Yumurta büyük bir törenle dikkatle üstüne yerleştiriliyor ve alevler yakılıyor. Isı yükseliyor ve yumurta parlamaya başlıyor."

 agot_dragon_hatching.0016.desc_major_coal:0 "Yumurtanın önüne büyük bir pirinç ve demir mangal getiriliyor; içindeki kömürler kızgın kırmızı parlıyor. Uygun sözler söylenirken yumurta içine yerleştiriliyor ve ısı yükselmeye başlıyor."

 agot_dragon_hatching.0016.desc_major_oil:0 "Yumurtanın önüne bilinen dünyanın dört bir yanından karışık yağlarla dolu büyük bir kâse getiriliyor. Yumurta içine yerleştiriliyor ve sıvı, ısınmayı başlatmak için bir meşaleyle tutuşturuluyor. Yumurtanın üstüne daha fazla yağ dökülüyor; alevler gittikçe yükseliyor."

 agot_dragon_hatching.0016.desc_major_wildfire:0 "Yumurtanın önüne en güçlü ve en tehlikeli yabanağı getiriliyor; sıvı kabuğun üzerine dökülüyor. Yumurtanın altına bir havuz dolusu bırakılıyor ve uhrevi yeşil alevler yakılıyor."

 agot_dragon_hatching.0016.desc_major_lava:0 "Ejderhadağı içindeki büyük bir lav odası, yumurta için bir yuva hâline getirildi. Büyük bir tören ve özenle yumurta içine yerleştiriliyor; erimiş kaya çevresinde köpürüp kaynıyor."

 agot_dragon_hatching.0016.desc_major_magnifying_glass:0 "Yumurtanın önüne bir dizi büyük mercek getiriliyor; güneş ışınları onların içinden odaklanarak kabuğa ısı uygulanıyor. Bir ışık korosu gibi mercekler yavaş bir çemberde döndürülüyor; ışık ve ısı gösterisi göz kamaştırıcı."

 agot_dragon_hatching.0016.desc_massive_wood:0 "Odun yığını, neredeyse bir bina kadar yükseklikte bir odun dağı. Bir meşale alayıyla yumurta içine yerleştiriliyor ve alevler yakılıyor. Isı şiddetli; görmek güç olsa da yumurta parlıyor gibi görünüyor."

 agot_dragon_hatching.0016.desc_massive_coal:0 "Yumurtanın önüne içinde bir atın ayakta durabileceği büyüklükte, pirinç ve demirden büyük bir mangal getiriliyor. İçindeki kömürler beyaz kor gibi parlıyor ve yumurta törenle içine yerleştiriliyor. Isı şiddetli ve yumurta parlamaya başlıyor."

 agot_dragon_hatching.0016.desc_massive_oil:0 "Büyük boş bir kâse çıkarılıyor; bilinen dünyanın dört bir yanından yağlar sırayla önüne getiriliyor. Çeşitli inançlardan kutsal erkekler ve kadınlar, kâseye dökülen kendi yağlarının üzerine dualar ediyor. Yumurta içine yerleştiriliyor ve sıvı, ısınmayı başlatmak için bir meşaleyle tutuşturuluyor."

 agot_dragon_hatching.0016.desc_massive_wildfire:0 "Yumurtanın önüne en güçlü ve en tehlikeli yabanağı getiriliyor; sıvı kabuğun üzerine dökülüyor. Yumurtanın altına bir havuz dolusu bırakılıyor ve alevler yakılıyor. Ateşin kükreyişi sağır edici; sanki sıcaklıkla #emp çığlık atıyor#!."

 agot_dragon_hatching.0016.desc_massive_lava:0 "Ejderhadağı'nın tam tepesine büyük bir demir halka geçirildi; yumurta içindeki erimiş kayanın üzerinde asılı duruyor. Büyük bir törenle herkes, yumurtanın lava indirilişini izliyor. Erimiş kaya yumurtanın çevresinde köpürüp kaynıyor; ısı hararet derecesine yükseliyor."

 agot_dragon_hatching.0016.desc_massive_magnifying_glass:0 "Yumurtanın önüne çeşitli biçim ve boyutlarda bir dizi mercek getiriliyor; güneş ışınları onların içinden odaklanarak kabuğa ısı uygulanıyor. Her biri binlerce ışık noktasıyla dans ediyor; orada bulunan hiç kimsenin unutamayacağı bir gösteriyle daireler çizilirken ısı yükseliyor."

