 agot_dragon_hatching.0101.t:0 "Hırsın Felaketi!"

 agot_dragon_hatching.0101.desc:0 "Felaket!\n\nGözlerimin önünde yumurta paramparça oluyor; içindeki ejderhanın gücü ve icra edilen ayinler bir yıkım dalgası hâlinde açığa çıkıyor. Isı dayanılmaz; alevler önlerine çıkan her şeyi yutuyor. Ahmaklığım hepimizin felaketine yol açtı ve yeni bir ejderha hayali ateşte ve kanda öldü."

 agot_dragon_hatching.0101.opt.a:0 "Tanrılar, hayır!"

 agot_dragon_hatching.0102.t:0 "$agot_dragon_hatching.0101.t$"

 agot_dragon_hatching.0102.desc:0 "Felaket!\n\nGözlerimin önünde yumurta paramparça oluyor; içindeki ejderhanın gücü ve icra edilen ayinler bir yıkım dalgası hâlinde açığa çıkıyor. Isı dayanılmaz; alevler önlerine çıkan her şeyi yutuyor. [host.GetTitledFirstName]nün ahmaklığı hepimizin felaketine yol açtı ve yeni bir ejderha hayali ateşte ve kanda öldü."

 agot_dragon_hatching.0102.opt.a:0 "$agot_dragon_hatching.0101.opt.a$"

 agot_dragon_hatching.0201.t:0 "Hırsın Faciası!"

 agot_dragon_hatching.0201.desc:0 "Facia!\n\nYumurta ısıda parçalanıyor; içindeki güç onu ortadan ikiye ayırıyor ve etrafa yanan kabuk ve iç organ parçaları fırlatıyor. Uçuşan enkaz toplananlara çarpıyor; insanları da yerleri de alevler içinde bırakıyor. Yeni bir ejderha hayalim ateşte ve kanda öldü."

 agot_dragon_hatching.0201.opt.a:0 "Eğil ve siper al!"

 agot_dragon_hatching.0202.t:0 "$agot_dragon_hatching.0201$"

 agot_dragon_hatching.0202.desc:0 "Facia!\n\nYumurta ısıda parçalanıyor; içindeki güç onu ortadan ikiye ayırıyor ve etrafa yanan kabuk ve iç organ parçaları fırlatıyor. Uçuşan enkaz toplananlara çarpıyor; insanları da yerleri de alevler içinde bırakıyor. [host.GetTitledFirstNamePossessive] yeni bir ejderha hayali ateşte ve kanda öldü."

 agot_dragon_hatching.0202.opt.a:0 "$agot_dragon_hatching.0201.opt.a$"

 agot_dragon_hatching.0303.t:0 "Hırsın Örsünde Kırılış"

 agot_dragon_hatching.0303.desc:0 "#bold;italic *ÇITIRT*#!\n\nSes sağır edici derecede yüksek. Hayal kırıklığına uğramış bağırış ve iç çekişlerin büyük bir korosu eşliğinde, yumurta ısının altında parçalara ayrıldı. Hayallerim — ve yumurtam — önümdeki kabuk kadar paramparça."

 agot_dragon_hatching.0303.opt.a:0 "Kahretsin!"

 agot_dragon_hatching.0304.t:0 "Boşa Giden Çabalar"

 agot_dragon_hatching.0304.desc:0 "Kalabalık nefesini tutmuş bakıyor; yumurtanın çatlamasını, hareket etmesini, #emp bir şey#! yapmasını bekliyor. Ama hiçbir şey olmuyor. Olduğu gibi kalıyor: kırılmamış ve boyun eğmez.\n\nHayal kırıklığı öksürükleri ve başarısızlık fısıltıları havayı doldururken, çabalarımın boşa gittiğini kabul etmeliyim. Ağır bir yürekle hizmetkarlara yumurtayı kaldırıp temizliğe başlamalarını söylüyorum."

 agot_dragon_hatching.0304.opt.a:0 "$agot_dragon_hatching.0303.opt.a$"

 agot_dragon_hatching.0305.t:0 "$agot_dragon_hatching.0303.t$"

 agot_dragon_hatching.0305.desc:0 "#bold;italic *ÇITIRT*#!\n\nSes sağır edici derecede yüksek. Aralarında benimkinin de olduğu hayal kırıklığına uğramış bağırış ve iç çekişlerin büyük bir korosu eşliğinde, yumurta ısının altında parçalara ayrıldı. [host.GetTitledFirstNamePossessive] hayalleri — ve [host.GetHerHis] yumurtası — önümüzdeki kabuk kadar paramparça."

 agot_dragon_hatching.0305.opt.a:0 "Ve o kadar umut verici görünüyordu ki..."

 agot_dragon_hatching.0306.t:0 "$agot_dragon_hatching.0304.t$"

 agot_dragon_hatching.0306.desc:0 "Kalabalık nefesini tutmuş bakıyor; yumurtanın çatlamasını, hareket etmesini, #emp bir şey#! yapmasını bekliyor. Ama hiçbir şey olmuyor. Olduğu gibi kalıyor: kırılmamış ve boyun eğmez.\n\nHayal kırıklığı öksürükleri ve başarısızlık fısıltıları havayı doldururken, [host.GetTitledFirstName] [host.GetHerHis] çabalarının boşa gittiğini kabul etmek zorunda. [host.GetHerHim]in hizmetkarlara yumurtayı kaldırıp temizliğe başlamalarını söyleyişini görüyorum; ben de yalnızca sempatiyle başımı sallayabiliyorum."

 agot_dragon_hatching.0306.opt.a:0 "$agot_dragon_hatching.0305.opt.a$"

 agot_dragon_hatching.0401.t:0 "Yeni Bir Şafak"

 agot_dragon_hatching.0401.desc:0 "Bir an her şey sessiz. Kalabalık nefesini tutuyor. Hiçbir şey olmayacakmış gibi görünüyor... Sonra yumurta titriyor ve çatlıyor. Küçük, pullu bir kafa beliriyor; ardından uzun, kıvrımlı bir boyun geliyor. İçindeki ejderha doğdu! Yeni bir ejderha çağı başladı ve onu başlatan benim!"

 agot_dragon_hatching.0401.opt.a:0 "Yaşasın!"

 agot_dragon_hatching.0401.opt.a_tt:0 "Başarıyla bir ejderha çıkardınız!"

 agot_dragon_hatching.0402.t:0 "$agot_dragon_hatching.0401.t$"

 agot_dragon_hatching.0402.desc:0 "Bir an her şey sessiz. Kalabalık nefesini tutuyor. Hiçbir şey olmayacakmış gibi görünüyor... Sonra yumurta titriyor ve çatlıyor. Küçük, pullu bir kafa beliriyor; ardından uzun, kıvrımlı bir boyun geliyor. İçindeki ejderha doğdu! Yeni bir ejderha çağı başladı ve ben de buna tanıklık etmek için buradaydım!"

 agot_dragon_hatching.0402.opt.a:0 "$agot_dragon_hatching.0401.opt.a$"

