l_english:

 agot_hunt_activity.001.t:0 "Yoldaki Yabancı"

 agot_hunt_activity.001.desc:0 "Avlanırken bir adama rastlıyorum — sırtı yara bere içinde, #italic dev gibi#! bir adam. Korkmuş görünüyor; sanki #italic kendisi#! avlanıyormuş gibi bakışları oraya buraya kayıyor.\n\n Sık çalılıkların arasına gizlendiğim için bu yabancı beni fark etmiş gibi görünmüyor. Ne yapmalıyım?"

 agot_hunt_activity.001.a:0 "Kendimi göstereyim ve onu sakinleştirmeye çalışayım."

 agot_hunt_activity.001.b:0 "Gizli kal."

 agot_hunt_activity.001.c:0 "Kaç, ikimiz de tehlikedeyiz!"

 agot_hunt_activity.002.t:0 "Gizli Kalmak"

 agot_hunt_activity.002.desc:0 "Yabancı, artık koşamayacak kadar yorgun bir hâlde durunca küfürlerini ve ağlayışlarını duyabiliyorum. "Geri dönemem" sözünü tekrar tekrar mırıldandığını seçebiliyorum, yeminle.\n\n Ormanın karanlığında gizli kaldığım birkaç dakika sonra, birdenbire yabancının arkasında üç adam beliriyor. Onu arıyor gibiydiler — ve iyilik olsun diye değil. Adamlardan biri köleci kırbacıyla ona vurmaya başlıyor!"

 agot_hunt_activity.002.a:0 "Onun için artık hiçbir şey yapamam."

 agot_hunt_activity.002.b:0 "Ona yardım etmeye çalışmalıyım!"

 agot_hunt_activity.003.t:0 "Yabancıyla Bir Konuşma"

 agot_hunt_activity.003.desc:0 "Yabancı, kendisini Dar Deniz'in ötesinde soylu bir evin savaşçısı olarak tanıtıyor. Ama artık, bir yıldan uzun süre önce esir edildikten sonra yalnızca bir köle. Benden yardım diliyor — sahiplerinin onu kovaladığını söylüyor!"

 agot_hunt_activity.003.a:0 "Ona yardım edeceğim!"

 agot_hunt_activity.003.b:0 "Ne yazık ki kaderiyle yüzleşmek zorunda."

 agot_hunt_activity.004.t:0 "Yabancıyı Geride Bırakmak"

 agot_hunt_activity.004.desc:0 "Zavallı yabancıdan gittikçe uzaklaşırken, genç adamın korku dolu çığlıklarını ve kırbacın ete çarparken çıkardığı o yüksek şaklayışını duyuyorum. Çığlıklar, nihayet kesilene dek giderek daha da ıstıraplı hâle geliyor.\n\n O yabancının, kendisini avlayan o adamların elinde nasıl bir sona ulaştığını ancak hayal edebiliyorum. Ve kendi kendime soruyorum, #italic doğru olanı mı yaptım?#!"

 agot_hunt_activity.004.a:0 "Olaylar böyle gelişir..."

 agot_hunt_activity.004.b:0 "Onu kurtarmalıydım!"

 agot_hunt_activity.005.t:0 "Yabancı'nın Bakıcıları"

 agot_hunt_activity.005.desc:0 "Üç adam yanıma yaklaşıyor. Biri, yabancı bir tarzda şık giysiler içinde bir tüccara benziyor; diğer ikisi ise hafif deri zırhlı savaşçılara benziyor.\n\n Tüccar, kaçan kölesini yakaladığım için beni gururla teşekkür ediyor ve yardımımın ödüllendirileceğine söz veriyor."

 agot_hunt_activity.005.a:0 "Onu adamlara geri ver."

 agot_hunt_activity.005.b:0 "Gücüyle, epey bir parayı hak etmeli..."

 agot_hunt_activity.005.c:0 "Belki onun yeteneklerinde bir adam işime yarar?"

 agot_hunt_activity.006.t:0 "Yabancı'nın Bakıcıları"

 agot_hunt_activity.006.desc:0 "Gizlendiğim yerden doğruluyorum; üç adamı irkiltiyorum — cezanın tanıksız olduğunu sanıyorlardı. Yabancı bir tarzda şık giysiler giyen adamlardan biri bana sesleniyor:\n\n "Burada olmaman gerekirdi, dostum. Buradaki malımız kendine bir kaçış planı kurmuştu, ama onun için pek iyi sonuçlanmadı," diyor, tedirgin edici bir sırıtışla. "Hadi git, bizi yalnız bırak, sorun çıkmasın.""

 agot_hunt_activity.006.a:0 "İki kez söylenmesine gerek yok!"

 agot_hunt_activity.006.b:0 "Belki onun yeteneklerinde bir adam işime yarar?"

 agot_hunt_activity.006.c:0 "Hepsini öldürün!"

 agot_hunt_activity.007.t:0 "Yeni Satın Alımım"

 agot_hunt_activity.007.desc:0 "Köle sahiplerini hallettiğime göre, görünüşe bakılırsa bir köle edindim. Artık karar bana kalmış... #italic ona ne olacak?#!"

 agot_hunt_activity.007.a:0 "Onu özgür bırakacağım!"

 agot_hunt_activity.007.b:0 "Sarayıma katılacak."

 agot_hunt_activity.007.c:0 "Hayatına son vermek benim hakkım!"

 magot_hunt_activity.006.desc:0 "PLACEHOLDER Üç adamla yüzleşme"
