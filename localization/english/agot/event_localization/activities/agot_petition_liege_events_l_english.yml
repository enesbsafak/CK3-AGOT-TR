l_english:

 petition_liege.0101.t.title_paramount:0 "$petition_liege_header$ Üst Derece Talepkarı"

 petition_liege.0101.desc.title_paramount:0 "saygılarımla, Majesteleri, [petition_paramount.GetName] haklı olarak benimdir!" \n\n"Güçlü [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] üzerindeki hükümranlığınız, [petition_liege.GetLadyLord], bana içtenlikle talep ettiğim tek bir krallığı yönetme hakkını veremez misiniz? Sahip olduğumuz topraklar için hakların ne kadar hayati olduğunu anlamalısınız.""

 petition_liege.0101.accept.title_paramount:0 "Pekâlâ, üst derecelik senin."

 petition_liege.0101.accept.title_paramount.tt:0 "[petition_vassal.GetName], [petition_paramount.GetName]'i ve vassallerini alır"

 petition_liege.0101.bribe_gold.title_paramount:0 "Sana ne, [petition_vassal.GetFirstNameNoTooltip]?"

 petition_liege.0101.bribe_favor.title_paramount:0 "Bana borçlu olunanları kolayca unutmam."

 petition_liege.0101.bribe_factions.title_paramount:0 "Bu unvan karşılığında, sonsuz sadakatini istiyorum."

 petition_liege.0101.bribe_contract.title_paramount:0 "Bu topraklar daha ağır yükümlülüklerle gelir."

 petition_liege.0101.refusal.title_paramount:0 "Ben de [petition_paramount.GetNameNoTierNoTooltip] üzerinde hak iddia ediyorum."

 petition_liege.0101.refusal.title_paramount_tt:0 "[petition_paramount.GetNameNoTooltip]'in De jure vassalleri bunu bir yıl daha talep edemez"

 petition_liege.0201.desc.title_paramount:0 "\n\n[petition_liege.GetHerHis] [petition_paramount.GetName] üzerindeki meşru hakkımı saygıyla öne sürüyor, bunu kanıtlayan uzun belgeleri sunuyor ve [petition_liege.GetTitleAsNamePossessiveNoTooltip] yanıtını bekliyorum."

 petition_liege.0101.t.legitimate_house_boost:0 "$petition_liege_header$ Meşru Hane Güçlendirme"

 petition_liege.0101.desc.legitimate_house_boost:0 "bildiğiniz üzere, Majesteleri, [petition_legitimate_house_boost_title.GetName] üzerindeki hükümdarlığım... daha kısa geçmişimiz nedeniyle sorgulanıyor."\n\n"İkimizin de yararına, hanemin [agot_legitimate_house|E] olma iddiasını desteklemenizi ve diyarda bu belirsizlikten doğan huzursuzluğu bastırmama yardım etmenizi istiyorum.""

 petition_liege.0101.accept.legitimate_house_boost:0 "Bu konuda [petition_vassal.GetHouse.GetName] Hanesi'ni destekleyeceğim."

 petition_liege.0101.bribe_gold.legitimate_house_boost:0 "Belki bu faydanın kanıtını görebilirsem?"

 petition_liege.0101.bribe_favor.legitimate_house_boost:0 "Sizin topraklarınızdaki destek, benimkilerdeki destektir."

 petition_liege.0101.bribe_factions.legitimate_house_boost:0 "Kendini bana bağlarsan, evet."

 petition_liege.0101.bribe_contract.legitimate_house_boost:0 "Karşılığında senden daha fazlasını isteyeceğim."

 petition_liege.0101.refusal.legitimate_house_boost:0 "Bu meselede geleneğe karşı çıkamam."

 petition_liege.0201.desc.legitimate_house_boost:0 "\n\nHiç tereddüt etmeden, hanemin [petition_legitimate_house_boost_title.GetNameNoTier]'in [agot_legitimate_house|E] olma iddiasını savunuyor; verdiğimiz sayısız adil hükmü ve [petition_liege.GetHerHis] topraklarının yasalarını nasıl gözettiğimizi sıralıyorum."
