 agot_btw_maintenance.0100.t:0 "Krallık Kur"

 agot_btw_maintenance.0100.desc:0 "[kingdom_title.GetName]'i kurabilir ve güçlü, korkulan bir hükümdar olabilirim! Ardından [kingdom_title.GetNamePossessive] tüm bağımsız de jure vassallerinden bana bağlılık yemini etmelerini ve vassalim olmalarını talep edebilirim."

 agot_btw_maintenance.0100.a:0 "Krallığı kur."

 agot_btw_maintenance.0100.b:0 "Boş ver."

 agot_btw_maintenance.0101.t:0 "Bağlılık Yemini Et"

 agot_btw_maintenance.0101.desc:0 "[ROOT.Char.Custom2('RelationToMe', king.Self)] [king.GetFullName], [kingdom_title.GetName]'i kurdu ve artık kendini [king.GetTitleAsNameNoTooltip] olarak adlandırıyor! [king.GetSheHe|U], [king.GetHerHim]'e bağlılık yemini etmemi ve [king.GetHerHis] vassali olmamı talep ediyor."

 agot_btw_maintenance.0101.a:0 "Bağlılık yemini et."

 agot_btw_maintenance.0101.b:0 "Bağımsız kal."
