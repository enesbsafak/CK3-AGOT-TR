l_english:

 agot_fourth_blackfyre_rebellion.0001.t:0 "Blackfyre İddiası"

 agot_fourth_blackfyre_rebellion.0001.desc:0 "[daemon.GetTitledFirstName] taht üzerindeki hakkını ileri sürdü. Vakit geldi; bir kez daha güçlerimizi birleştirip Targaryenları ve onların dalkavuk beylerini yerle bir etmeliyiz. Uzun bir kış, aptal bir kral ve hoşnutsuz beyler, Westeros'u alınmaya hazır hale getirdi. Bu sefer zafer avucumuzda — hissedebiliyorum.\n\nSavaşa!"

 agot_fourth_blackfyre_rebellion.0001.a:0 "Altının Altında, Acı Çelik!"

 agot_fourth_blackfyre_rebellion.0002.t:0 "Acı Hizmet"

 agot_fourth_blackfyre_rebellion.0002.desc:0 "[daemon.GetTitledFirstName] nihayet tahtı kazandı! O şanlı günden bu yana haftalar geçti ve her şey yerine oturmaya başladı...\n\nYeni kralın artık sadık hizmetkârlara ihtiyacı var — Majestelerine Westeros'un geleneklerinde yol gösterecek danışmanlara. Onun tahta çıkışındaki rolüm göz önüne alındığında, kendime bir görev talep edebilirim.\n\nYa da belki basit bir ödül yeterli olur."

 agot_fourth_blackfyre_rebellion.0002.a:0 "Kralın Eli uygun bir makam olur."

 agot_fourth_blackfyre_rebellion.0002.b:0 "Kral Muhafızı'nda hizmet edeceğim... Yüce Kumandan olarak!"

 agot_fourth_blackfyre_rebellion.0002.c:0 "Summerhall'ı alacağım."

 agot_fourth_blackfyre_rebellion.0002.d:0 "Altının altında... daha da fazla altın var!"

 agot_fourth_blackfyre_rebellion.0002.e:0 "Hiçbir şey talep etmiyorum; görevimi yerine getirmiş olmak bana yeter."

 agot_fourth_blackfyre_rebellion.0002.gc_tt:0 "[daemon.GetFirstName], Altın Bölük'ü [special_troops|E] olarak alır."

 agot_fourth_blackfyre_rebellion.0010.t:0 "Bir Blackfyre Zaferi"

 agot_fourth_blackfyre_rebellion.0010.desc:0 "Neredeyse inanılmaz...\n\nNesiller boyunca atalarım zorluklara, sürgüne ve alaya katlandı. House [ROOT.Char.GetHouse.GetName] savaştı ve entrika çevirdi, kan döktü ve öldü; hepsi tek bir hayal, tek bir amaç için: doğuştan hakkımızı, Demir Taht üzerindeki haklı yerimizi geri kazanmak. Bugün, bu hayal gerçek oluyor.\n\nDemir Taht'ın basamaklarını çıkarken, aklım adaşıma gidiyor. Taht salonuna dönüp bakarken gözlerim doluyor. #italic Bir görseydin beni şimdi, büyükbaba...#!\n\nYıllar aldı, ama sonunda House [ROOT.Char.GetHouse.GetNameNoTooltip]'ten bir Daemon, Demir Taht'a oturdu. Ben, bin yıl ve daha fazlası sürecek bir hanedan için yalnızca bir tohumum!"

 agot_fourth_blackfyre_rebellion.0010.a:0 "Hükümdarlığım şimdi başlıyor!"

 agot_fourth_blackfyre_rebellion.0011.t:0 "İstila!"

 agot_fourth_blackfyre_rebellion.0011.desc:0 "Batı istilası için güçlerimi hazırlarken kalbim heyecan ve korkunun karışımıyla atıyor — doğuştan hakkım için son bir girişim.\n\nWesteros kan dökecek; bu kesin, ama soylu bir dava için kan dökecek. [GetScriptedCharacterByHistoryID('Targaryen_88').GetTitledFirstNamePossessiveRegnal] büyükbabamın niyeti açıktı: ona [blackfyre.GetName]'i bahşederek onu gerçek varisi olarak işaretledi. Ardından gelen Targaryen krallarının hepsi, hak etmeyen gaspçılardan başka bir şey değildi.\n\n#bold Diyar, haklı Kralı'nın önünde eğilecek!#!"

 agot_fourth_blackfyre_rebellion.0011.a:0 "Zaferin kokusunu alıyorum..."

 agot_fourth_blackfyre_rebellion.0011.a.tt:0 "Geleneksel [ROOT.Char.GetHouse.GetNameNoTooltip] taraftarlarından yalnızca bir avuç davamıza katıldı. Demir Taht'ın gücüne karşı kendi başıma ayakta kalarak, başkalarının başarısız olduğu yerde isyanımın başarıya ulaşabileceğini kanıtlarsam, daha fazlası haklı savaşımıza katılabilir. Hatta belki uygun bir ölümle kefeyi lehime çevirebilirim..."

 agot_fourth_blackfyre_rebellion.0012.t:0 "Bir Başka Blackfyre İsyanı"

 agot_fourth_blackfyre_rebellion.0012.desc:0 "Diyar için ağır haber: hain House [daemon.GetHouse.GetNameNoTooltip]'in uzun süredir unutulmuş bir ferdi [daemon.GetTitledFirstNameRegnal], Westeros'a ayak bastı! [aegor.GetTitledFirstName] önderliğinde binlerce kişilik bir orduya komuta ediyor. Diyarın yaralarının iyileştiği sanılırken, Yedi Krallık bir kez daha savaşta.\n\nDiyar yeniden kargaşaya sürüklenmişken, bir seçim yapılmalı."

 agot_fourth_blackfyre_rebellion.0012.a:0 "Silah başına! Bu kara ejderha ezilmeli."

 agot_fourth_blackfyre_rebellion.0012.b:0 "Belki bu avantajlı olabilir..."

 agot_fourth_blackfyre_rebellion.0012.c:0 "Belki bu kara ejderhaya katılmalıyım?"

 agot_fourth_blackfyre_rebellion.0013.t:0 "Bir İsyan Yılı"

 agot_fourth_blackfyre_rebellion.0013.desc:0 "Taht için savaş ilan edeli bir yıl oldu. Ne kadar dayanırsak, sözde [aegonv.GetTitledFirstName]'e karşı direnişte ne kadar uzun hayatta kalırsam, o kadar çok bey sancağımız altına akın ediyor gibi görünüyor. Bir zamanlar atalarımın davalarına koşan eski Blackfyre taraftarlarının çoğu artık benim için savaş ilan etti.\n\nYenilenen desteklerinin çatışmanın kefesini değiştirip değiştirmeyeceğini zaman gösterecek."

 agot_fourth_blackfyre_rebellion.0013.a:0 "Yelkenlerimizde ikinci bir rüzgâr!"

 agot_fourth_blackfyre_rebellion.0014.t:0 "Cesur Zaferim"

 agot_fourth_blackfyre_rebellion.0014.desc:0 "Neredeyse inanılmaz, ama yine de gerçek. [aegonv.GetTitledFirstNamePossessive] en azılı koruyucusu [duncantall.GetNameNicknamed]'i öldürdüm. Böyle bir başarı, daha tereddütlü beylerden bazılarına ilham vermiş görünüyor.\n\nAkla hayale sığmaz işi başarmış olmanın ardından, bir zamanlar atamın davasına koşan eski Blackfyre taraftarlarının çoğu artık benim için savaş ilan etti."

 agot_fourth_blackfyre_rebellion.0014.a:0 "Yenilmem imkânsız!"

 agot_fourth_blackfyre_rebellion.0015.t:0 "Acı Bir Talep"

 agot_fourth_blackfyre_rebellion.0015.desc:0 "Zaferimin, Demir Taht'a çıkışımın üzerinden haftalar geçti. Bu haftalarda boş durmadım. Gücümü pekiştirmek ve House [ROOT.Char.GetHouse.GetName]'in Taht üzerindeki kavrayışının yıllarca güvende olmasını sağlamak için geceler gündüzler harcadım.\n\nŞimdi, Taht'ta dinlenip eserimin şanının tadını çıkarırken, [aegor.GetFirstName] bana bir istekle geliyor...\n\n"

 agot_fourth_blackfyre_rebellion.0015.gold:0 "Zaferimizi güvence altına alma çabalarım için mütevazı bir 1000 altın. Adamlarım yorgun, ama ne olursa olsun sana hizmet etmeye devam edeceğiz.\n\nEmeklerimiz için yalnızca küçük bir meblağ istiyoruz. Altınla birlikte, yükselişini kutlamak için etrafa dağıtılacak bolca şan var!"

 agot_fourth_blackfyre_rebellion.0015.hotk:0 "Efendim, haklı davana hizmet etmek bir onurdu. Taht artık tek gerçek kralına kavuştuğuna göre, mütevazı bir dille El'in olarak atanmayı diliyorum. Günlerimin sonuna dek hükümdarlığına hizmet etmeme ve bilgeliğimi sunmama izin ver."

 agot_fourth_blackfyre_rebellion.0015.summerhall:0 "Zaferimizle birlikte Altın Bölük artık dağılacak. Haklı efendimizi tahtına kavuşturma olan tek ve biricik amacımızı tamamladık. Şimdi mütevazı bir dille yerleşeceğimiz bir toprak diliyorum; sana sadakatle bir bey olarak hizmet edebileceğim bir yer."

 agot_fourth_blackfyre_rebellion.0015.lc:0 "Efendim, sancaklarının altında savaşmak bir onurdu. Taht artık tek gerçek kralına kavuştuğuna göre, mütevazı bir dille hayatımı adayıp seni her türlü zarardan korumaya söz vermeme izin ver. Kral Muhafızı, şu anki haliyle, yanlış haneye ve yanlış krala hizmet etti; Majestelerinin güvenine layık değiller.\n\nİnisiyatifi ben alacağım. Beni Yüce Kumandanın ilan et, hanedanının bin yıl süreceğinden emin olayım!"

 agot_fourth_blackfyre_rebellion.0015.gc_tt:0 "Altın Bölük ordusunu [special_troops|E] olarak alırsın."

 agot_fourth_blackfyre_rebellion.0015.a:0 "Makul bir dilekçe; kabul edeceğim."

 agot_fourth_blackfyre_rebellion.0015.b:0 "Söylemek beni üzüyor, ama hayır..."

 agot_fourth_blackfyre_rebellion.1000.t:0 "Dördüncü Bir İsyan mı?"

 agot_fourth_blackfyre_rebellion.1000.desc:0 "Kış sona erdiğine göre, bir başka istilanın vakti geldi. Benden önceki babam ve ondan önceki babası gibi, ben de koca bir ordunun dümenindeyim. Bittersteel ve Altın Bölük yanımdayken zorlu bir kuvvet oluşturacağız. Ama iş çok uzakta.\n\nDiyar, sancaklarımız kadar yıpranmış olduğumuzu sanıyor; ama bu semiz yüksek beylere House [ROOT.Char.GetHouse.GetName]'in Yedi Krallık'ı yönetmek için gereken gücü ve nüfuzu hâlâ kullanabildiğini gösterebiliriz. Dar Deniz'i aşıp yerel güçlerden bazılarını davamıza kazanmalı ve [aegonv.GetHouse.GetName] yönetimini içeriden parçalamalıyız.\n\nBüyük Konsey'in utanç verici ihaneti unutulmamalı. Hakkım olanı alacağım ya da uğruna öleceğim. House [ROOT.Char.GetHouse.GetNameNoTooltip] Demir Taht'a oturacak!"

 agot_fourth_blackfyre_rebellion.1000.a:0 "İstila edeceğim!"

 agot_fourth_blackfyre_rebellion.1000.a.tt:0 "#EMP İstilana tam olarak iki hafta sonra başlayacaksın.#!"

 agot_fourth_blackfyre_rebellion.1000.b:0 "Bir düşününce..."

 agot_fourth_blackfyre_rebellion.1000.b.tt:0 "#EMP Şimdilik istila umutlarını bir kenara bırakıyorsun.#!"

 agot_fourth_blackfyre_rebellion.1001.t:0 "Altının Altında, Acı Çelik"

 agot_fourth_blackfyre_rebellion.1001.desc:0 "[daemon.GetTitledFirstNamePossessiveRegnal] başına yerleştirdiğim taç, ileriye yalnızca tek bir yol bırakıyor. Kış nihayet sona erdiğine göre, Taht için bir başka girişimde bulunma fırsatı doğuyor.\n\nSon denememizin acı tadı hâlâ ağzımda. Yaşlandıkça, Taht'a bir [daemon.GetHouse.GetName] oturtma çaresizliğim her geçen yıl artıyor. Yine de, lanetli Kan Kuşu Kral tarafından öylesine aptalca görevden alındığına göre, şansımız hiç bu kadar iyi olmamıştı.\n\nAltın Bölük kılıçlarımızı bileyecek. Daha bitmedik. Sevgili kardeşim [daemoni.GetFirstName], sonunda eve gidiyoruz!"

 agot_fourth_blackfyre_rebellion.1001.desc.b:0 "Sürgündeki yıllarım artık hayatımın çoğunu oluşturuyor. Defalarca, isyan üstüne isyan, anavatanımıza dönüp Demir Taht'a bir [daemon.GetHouse.GetName] oturtma umuduyla Dar Deniz'i geçtik. Defalarca başarısız olduk.\n\nSon denememizin acı tadı hâlâ ağzımda. Yaşlandıkça, Taht'a bir [daemon.GetHouse.GetNameNoTooltip] oturtma çaresizliğim her geçen yıl artıyor. Yine de, lanetli Kan Kuşu Kral tarafından öylesine aptalca görevden alındığına göre, Taht için bir başka girişimde bulunma fırsatı doğuyor.\n\nBelki de hâlâ geç değil..."

 agot_fourth_blackfyre_rebellion.1001.a:0 "Kılıçlarınızı hazırlayın, adamlar!"

 agot_fourth_blackfyre_rebellion.1001.a.b:0 "Ne yapacağız?"

 agot_fourth_blackfyre_rebellion.1002.t:0 "Beklenmedik Bir Hükümdarlık"

 agot_fourth_blackfyre_rebellion.1002.desc:0 "Demir Taht'a çıkışımın üzerinden üç yıl geçti ve onu gölgeleyen sert kış artık yok. Dördüncü bir oğlun dördüncü oğlu olarak doğmuş biri olarak, kendimi hiç bu imrenilecek durumda bulmayı hayal etmemiştim. Yine de, yeni kazandığım güçleri ezilenlerin, zayıfların ve şanssızların yararına kullandım — daha geleneksel beylerim arasında bazı anlaşmazlıklara yol açan bir hamle.\n\nŞimdi doğudan mırıltılar kulağıma ulaştı. Sözde [daemon.GetTitledFirstName] adında bir [daemon.GetHouse.GetName] sahtekârı, istila için güç topluyor. Demir Taht'ı haklı hükümdarından koparmaya yönelik bir başka girişim.\n\nBu yaklaşan fırtınadan [ROOT.Char.GetHouse.GetName] yönetimi sağ çıkacaksa, hoşnutsuz beylerimle ittifaklar kurmalı ve köprüler inşa etmeliyim. Tanrılar bana güç versin..."

 agot_fourth_blackfyre_rebellion.1002.a:0 "Belki Kan Kuşu haklıydı..."

 agot_fourth_blackfyre_rebellion.1003.t:0 "Yusufçukların Prensi"

 agot_fourth_blackfyre_rebellion.1003.desc:0 "Güneş doğuda, Dragonmont'un arkasından doğuyor ve uzun gölgesini Dragonstone'un üzerine düşürüyor. Bir kez daha kendimi bu kalenin ve beyliğinin getirdiği ağır yükün hayranlığında buluyorum. Bu kaderi ben seçmedim. Tanrılar ve babam [aegonv.GetFirstName] bunu bana dayattı.\n\nŞimdi, Tyrosh'ta yeni bir [daemon.GetHouse.GetName] ordusu toplanırken, babam beni bazı beylerin kızıyla nişanlamayı düşünüyor — doğudan gelecek saldırıya dayanacak bir ittifakı pekiştirmek için.\n\nHevesli olmadığımı söylemek eksik kalır. Daha yetişkin bir adam bile değilim; yine de babam, hayatımın geri kalanında yatağını kiminle paylaşmak istediğime benim karar vermemi istiyor — oysa kendisi hayatının ilerleyen yıllarında, hem de aşk için evlendi. Bu adaletsizlik beni hüsranla kıvrandırıyor. Yine de, iyi bir kral diyarın her şeyden önce geldiğini bilir. İki arada bir deredeyim."

 agot_fourth_blackfyre_rebellion.1003.a:0 "Tanrılar zalim!"

 agot_fourth_blackfyre_rebellion.1004.t:0 "Altın Aslan"

 agot_fourth_blackfyre_rebellion.1004.desc:0 "Bir zamanlar bana 'Altın' Lord Gerold derlerdi. Kurnaz ve becerikli bir beydim. Hükümdarlığım, müreffeh ve adildi. Buraya gelmek için yıllar boyunca pek çok tatsız iş yapmak zorunda kaldım — beni utandıran ve korkutan işler. Yine de ağacı canlı ve sağlıklı tutmak için, House [ROOT.Char.GetHouse.GetName]'in ve Batı Toprakları'nın yararına bazı yabani otlar sökülmeli.\n\nYine de hırslarım için tanrılar beni cezalandırmayı uygun gördü. Önce karımı, sonra sevgili oğlumu ve varisimi aldılar. Kederim, yaşım ve hastalığım, bir zamanlar yaptığım gibi beylik dizginlerini çekmemi imkânsız kıldı. Şimdi günlerimin çoğunu yatak odamda kitaplarımla geçiriyorum; sarayım ise farklı türden Reyne'larla kaynıyor. Ve Dar Deniz'in ötesinde savaş demleniyor.\n\nBelki cezam haksız değil..."

 agot_fourth_blackfyre_rebellion.1004.a:0 "Diyar bir kez daha kükreyişimi duyacak mı?"

 agot_fourth_blackfyre_rebellion.1005.t:0 "Gülen Fırtına"

 agot_fourth_blackfyre_rebellion.1005.desc:0 "Bir başka fırtınalı gece Fırtına Burnu'nun üzerinden geçiyor; belki de farklı türden bir fırtınanın habercisi. Doğuda bir [daemon.GetHouse.GetName] sahtekârı — bu günlerde hiç olmadığı kadar sık görülüyor — Demir Taht'ı talep etmek için ayağa kalktı. Bu sahte ejderhalar yerlerini ne zaman öğrenecek?\n\nEfendim [aegonv.GetTitledFirstName]'in, sevgili kızım [cassandra.GetFirstName]'i oğlu ve varisi [duncansmall.GetTitledFirstNameNicknamed] ile evlendirmek istediği söylentileri kulağıma ulaştı. Akıllıca bir seçim, derim! Nişan muhtemelen önümüzdeki aylarda kesinleşecek.\n\nŞimdi, kılıcımı bilemeli ve beylerimi gelecek savaşlara hazırlamalıyım. Blackfyre Ordusu'nun karaya çıkacağı yer benim topraklarım olacak gibi görünüyor; ve ben, şahsen, [daemon.GetTitledFirstName] ile yüz yüze gelmek için sabırsızlanıyorum."

 agot_fourth_blackfyre_rebellion.1005.a:0 "Savaş borularının sesini ne kadar da özlemişim!"

 agot_fourth_blackfyre_rebellion.1010.t:0 "Potansiyel Bir Eşleşme"

 agot_fourth_blackfyre_rebellion.1010.desc:0 "Bir sonraki Blackfyre istilası giderek yaklaşıyor. [ROOT.Char.GetPrimarySpouse.GetFirstName], yaklaşan savaşta hanemizi korumaya yardımcı olması için [lyonel.GetTitledFirstName] ile potansiyel bir ittifak önerdi. Oğlum [duncansmall.GetFirstName], [lyonel.GetTitledFirstNamePossessiveNoTooltip] kızı [cassandra.GetFirstName] reşit olduğunda onunla evlenmeye razıysa, bu eşleşme son derece değerli olabilir.\n\nÖnce [duncansmall.GetFirstNameNoTooltip]'in bu eşleşmeye razı olup olmadığını öğrenmeliyim. Ancak o zaman [lyonel.GetTitledFirstNameNoTooltip] ile iletişime geçmeliyim."

 agot_fourth_blackfyre_rebellion.1010.a:0 "Kuzgunları salın!"

 agot_fourth_blackfyre_rebellion.1010.b:0 "Onun yardımına ihtiyacım yok..."

 agot_fourth_blackfyre_rebellion.1011.t:0 "Reddetme"

 agot_fourth_blackfyre_rebellion.1011.desc:0 "Oğlum [duncansmall.GetFirstName], [cassandra.GetFirstName] ile nişanlanmayı reddetti... Şaşırdığımı söyleyemem, gerçi hayal kırıklığına uğradım. [duncansmall.GetFirstNameNoTooltip] her zaman kendi bildiği yolu izlemiştir; bu, House [ROOT.Char.GetHouse.GetNameNoTooltip]'in çıkarlarının aleyhine olsa bile..."

 agot_fourth_blackfyre_rebellion.1011.a:0 "Bu çocuktan umut yok..."

 agot_fourth_blackfyre_rebellion.1011.a.tt:0 "[duncansmall.GetShortUINamePossessive] reddi, onu mirastan çıkarmana izin verecek."

 agot_fourth_blackfyre_rebellion.1012.t:0 "Kabul!"

 agot_fourth_blackfyre_rebellion.1012.desc:0 "Oğlum [duncansmall.GetFirstName], [cassandra.GetFirstName] ile nişanlanmayı kabul etti... En büyük engeli aştığımıza eminim. [duncansmall.GetFirstNameNoTooltip] ikisinin daha kararsızı. Şimdi [lyonel.GetFirstName]'in eşleşmeyi kabul edip etmeyeceğini görmeliyiz."

 agot_fourth_blackfyre_rebellion.1012.a:0 "Geyik elbette kabul edecek?"

 agot_fourth_blackfyre_rebellion.1013.t:0 "Geyiğin Yanıtı"

 agot_fourth_blackfyre_rebellion.1013.desc.a:0 "Sevinçten havalara uçuyorum. [lyonel.GetTitledFirstName], kızı [cassandra.GetFirstName]'i oğlum [duncansmall.GetFirstName] ile nişanlamayı kabul etti. [duncansmall.GetFirstNamePossessiveNoTooltip] onayıyla ittifak kesinleşti. Geleceğimiz artık daha parlak görünüyor. Yaklaşan fırtınayla... gülen bir fırtınayla yüzleşeceğiz."

 agot_fourth_blackfyre_rebellion.1013.desc.r:0 "[lyonel.GetTitledFirstNamePossessive] yanıtı bu sabah geldi ve umduğum gibi değildi...\n\n[duncansmall.GetFirstNameNoTooltip]'in kendisi eşleşmeye razı olsa bile, [cassandra.GetFirstName]'i oğlum [duncansmall.GetFirstName] ile nişanlamayı reddetti. Belki de beylerimin reformlarıma duyduğu hüsranı hafife aldım...\n\n[duncansmall.GetTitledFirstNameNoTooltip] için yeni bir eşleşme bulunmalı. Zamanımız daralıyor!"

 agot_fourth_blackfyre_rebellion.1013.a.a:0 "Tam da planlandığı gibi."

 agot_fourth_blackfyre_rebellion.1013.a.r:0 "Ne yazık..."

 agot_fourth_blackfyre_rebellion.1014.t:0 "Yusufçukların Prensi"

 agot_fourth_blackfyre_rebellion.1014.desc:0 "Oğlum [duncansmall.GetFirstName] tahttan feragat etti! Ona duyduğum hayal kırıklığı sır değildi, ama bu kadar kökten bir harekete başvuracağını beklemiyordum...\n\nTopraklarını ve unvanlarını [jaehaerys.GetTitledFirstName]'e bırakıp, sıradan bir dilenciden pek de farklı olmadan, şimdi yollarda..."

 agot_fourth_blackfyre_rebellion.1014.a:0 "Bu çocuktan #italic gerçekten#! de umut yok..."

 agot_fourth_blackfyre_rebellion.1020.t:0 "Bir Ebeveyn Talebi"

 agot_fourth_blackfyre_rebellion.1020.desc:0 "Başkentteki babamdan bir kuzgun geldi. [lyonel.GetTitledFirstNamePossessive] kızı [cassandra.GetFirstName] reşit olduğunda onunla evlenmemi istiyor. Bunu beklemediğimi söyleyemem, hoşnutsuz olsam da. Evliliğe hazır değilim; bu benim için açık.\n\nYine de, diyarın istikrarı ve iyiliği göz önünde bulundurulmalı. Bir sonraki Blackfyre İsyanı'ndan sağ çıkacaksak ittifaklar kurulmalı..."

 agot_fourth_blackfyre_rebellion.1020.a:0 "Diyarın iyiliği için bunu kabul ediyorum!"

 agot_fourth_blackfyre_rebellion.1020.a.tt:0 "Bu ittifak teklifi yalnızca [lyonel.GetFirstName] de eşleşmeyi kabul ederse ilerleyecek."

 agot_fourth_blackfyre_rebellion.1020.b:0 "Ben- ben istemiyorum!"

 agot_fourth_blackfyre_rebellion.1020.b.tt:0 "Reddedersen, [aegonv.GetFirstName] sonuçsuz bir şekilde seni #EMP mirastan çıkarabilir#!."

 agot_fourth_blackfyre_rebellion.1021.t:0 "Hayal Kırıklığı"

 agot_fourth_blackfyre_rebellion.1021.desc:0 "Sonunda yapamadım. Babamın [cassandra.GetFirstName] ile nişanlanma isteğini reddettim...\n\nYanıtı kesinlikle onaylamayan bir sessizlik olacak. Bana kızması şaşırtıcı değil. Ama bir ittifak uğruna hayatımı tanımadığım bir kadına bağlamayacağım. Babam bunu, kalbinin derinliklerinde anlamalı."

 agot_fourth_blackfyre_rebellion.1021.a:0 "Ben... yapmam gerekeni yaptım!"

 agot_fourth_blackfyre_rebellion.1021.b:0 "Belki de babam gerçekten çıkarlarımı düşünüyordu..."

 agot_fourth_blackfyre_rebellion.1021.c:0 "Buna bir an daha dayanamam! Tahttan feragat ediyorum!"

 duncan_the_small_laamp_name_1:0 "Süzülen Avcılar"

 duncan_the_small_laamp_name_2:0 "Yusufçuğun Sürüsü"

 duncan_the_small_laamp_name_3:0 "Kılıç Sürüsü"

 duncan_the_small_laamp_name_4:0 "İncecik Taç"

 agot_fourth_blackfyre_rebellion.1022.t:0 "Şimdilik Özgürlük"

 agot_fourth_blackfyre_rebellion.1022.desc:0 "Neşeli — gerçi beklenmedik — haber! [lyonel.GetTitledFirstName], babamın beni kızı [cassandra.GetFirstName] ile nişanlama teklifini reddetti...\n\nBunu göreceğimi söyleyemem. Yine de şikâyet edemem, elbette. [aegonv.GetTitledFirstName|U] kesinlikle hayal kırıklığına uğrayacak, belki de gücenecek; ama diyarın bundan zarar göreceğinden şüpheliyim. Önümüzdeki yıllarda benim için başka bir eşleşme bulmaya çalışabilir, ama hırslarının bu reddedişle törpülendiğine hiç şüphe yok. Belki hâlâ daha fazla zamanım olabilir..."

 agot_fourth_blackfyre_rebellion.1022.a:0 "Kesinlikle itiraz etmiyorum!"

 agot_fourth_blackfyre_rebellion.1030.t:0 "Potansiyel Bir İttifak"

 agot_fourth_blackfyre_rebellion.1030.desc:0 "[aegonv.GetTitledFirstName] bir ittifak teklifiyle bana ulaştı: Eşleşmeyi kabul edersem, oğlu [duncansmall.GetName], kızım [cassandra.GetFirstName] ile nişanlanacak. Bu, nadir bir fırsat olabilir. Sonuçta kraliyet ailesiyle akraba olmak, diyarın yönetimi üzerinde muazzam bir nüfuz getirir.\n\nYine de bu, herhangi bir... dış tehdit karşısında desteğimin bekleneceği anlamına geliyor.\n\nSeçeneklerimi dikkatle tartmalıyım."

 agot_fourth_blackfyre_rebellion.1030.a:0 "[aegonv.GetTitledFirstName] kabul ettiğimi bilsin!"

 agot_fourth_blackfyre_rebellion.1030.a.tt:0 "Teklifi kabul ediyorsun."

 agot_fourth_blackfyre_rebellion.1030.a.notification:0 "[lyonel.GetFirstName] teklifi kabul ediyor."

 agot_fourth_blackfyre_rebellion.1030.b:0 "Cömert bir teklif, ama şu an benim çıkarıma değil."

 agot_fourth_blackfyre_rebellion.1030.b.tt:0 "Teklifi reddediyorsun."

 agot_fourth_blackfyre_rebellion.1030.b.notification:0 "[lyonel.GetFirstName] teklifi reddediyor."

 agot_fourth_blackfyre_rebellion.1031.t:0 "Kraliyetten Bir Red"

 agot_fourth_blackfyre_rebellion.1031.desc:0 "Kraliyetle bir nişan umudum boşa çıkmış görünüyor. O aptal velet [duncansmall.GetTitledFirstName], tatlı kızım [cassandra.GetFirstName] ile nişanlanmayı, 'siyaset için değil aşk için evlenmek istediğini' söyleyerek reddetmiş görünüyor.\n\nBunlar yalnızca fısıltı olsa ve resmî bir teklif yapılmamış olsa da, hayal kırıklığımı gizleyemem. House [ROOT.Char.GetHouse.GetNameNoTooltip]'ten bir hanımefendinin, görünüşe göre, bu prense yakışır bir eş olmaması ne kadar acı."

 agot_fourth_blackfyre_rebellion.1031.a:0 "Bu kraliyet veledi tahta oturduğunda Yedili hepimize yardım etsin..."

 agot_fourth_blackfyre_rebellion.9990.t:0 "Ejderha ve Duvar"

 agot_fourth_blackfyre_rebellion.9990.desc:0 "Savaş kanlı bir iştir; bunu yıllardır biliyorum. Yine de hiçbir şey beni şu an içinden geçtiğim katliama hazırlayamazdı. Kılıcımı ölmekte olan bir düşmanın atına saplarken, üzerime bir kırmızı bağırsak ve kan duşu yağıyor.\n\nMiğferimin gözlüğünden kanı siliyorum ve sonra onu görüyorum — askerlerimin üzerinde yükselen ve kudretli bir büyük kılıç sallayan biri. Ben dönüp kaçamadan beni fark ediyor; tam zırhlı bir şövalyeyi, yetişkin bir savaş atını devirebilecek bir kuvvetle kenara itiyor.\n\nTanrıların hayrına, doğruca bana geliyor..."

 agot_fourth_blackfyre_rebellion.9990.a:0 "[ROOT.Char.GetHouse.GetMotto]"

 agot_fourth_blackfyre_rebellion.9991.t:0 "Duvar ve Ejderha"

 agot_fourth_blackfyre_rebellion.9991.desc:0 "Bir başka savaş, bir başka isyan. Düşman hattını görece kolaylıkla ezip geçiyor, Blackfyre askerlerini büyük kılıcımla ikiye biçiyorum. Son yıllarda gücüm yaşla birlikte azalmış olsa da, hâlâ ortalama bir askerin üç katı güçlü olduğumu bilmek güzel.\n\nAniden, savaşın kızıl sisi ötesinden onu görüyorum — sözde [daemon.GetTitledFirstName], binicisinin altındaki bir atı deşiyor. Bu isyanı bugün, kılıcımla tek bir büyük savurmayla bitirebilirim..."

 agot_fourth_blackfyre_rebellion.9991.a:0 "Kral için!"

 agot_fourth_blackfyre_rebellion.9994.t:0 "Aslan Yavrusu"

 agot_fourth_blackfyre_rebellion.9994.desc:0 "Düşman hattını biçip eziyorum. Blackfyre'ı savaş alanında dans ettirirken önümde düşman üstüne düşman düşüyor. [aegonv.GetTitledFirstNamePossessive] köpekleri sallayıp ıskalıyor ya da kılıçları zırhıma karşı işe yaramazca çınlıyor. Hiçbir kılıç ya da topuz, benim Valyria çeliğimle boy ölçüşemez.\n\nBir kez daha savuruyorum — ve Blackfyre, yakutlarla kaplı bir uzun kılıca çarpıyor. Onun altında, küstahça gülümseyen, altın saçlı bir genç duruyor."

 agot_fourth_blackfyre_rebellion.9994.a:0 "Kayboldun mu, küçük aslan?"

 agot_fourth_blackfyre_rebellion.9995.t:0 "Acı Bir Çelik Çatışması"

 agot_fourth_blackfyre_rebellion.9995.desc:0 "Bir kara ejderhayı diğerinin ardından doğruyor, biçiyor ve yere seriyorum. Bu asi budalalar yakında geldikleri denize geri püskürtülecek. Sözde [daemon.GetTitledFirstName]'i savaş alanının karşısında seçiyorum; ulaşamayacağım kadar uzakta. Keşke biraz daha yakın olsa...\n\nSiyah damarlı bir çelik parıltısı gözüme çarpıyor. Yaşlanan Bittersteel, hattımızdan kanlı bir yol oyuyor. Sonsuz şana uzanan bu fırsatı yakalamalıyım!"

 agot_fourth_blackfyre_rebellion.9995.a:0 "Belki hâlâ bir efsane olabilirim!"
