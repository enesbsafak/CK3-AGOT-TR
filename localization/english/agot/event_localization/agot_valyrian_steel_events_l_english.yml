l_english:

 agot_valyrian_steel.0001.t:0 "Sabahın Kılıcı"

 agot_valyrian_steel.0001.desc:0 "Sabah ışığı, Dawn'ın taş kaidesinde durduğu yere dek odayı boydan boya kaplıyor. Kılıç, karanlık ve süslü bir kınla örtülü, düşmüş bir yıldızın kalbinden dövülmüş dolunay kadar solgun; yuvarlak topuzu, sabah ışığında parlayan altın bir güneş biçiminde. Sabah Yıldızı Kılıcı'nın taşıyıcısı olmadığında Dawn'ın kaldığı yer burasıdır; şan ve şeref dönemleri arasında dinlendiği yer. \n\nDawn'ı, onu taşımaya layık bir Dayne'e bahşetmek kadim bir sorumluluktur ve bu sorumluluk şimdi bana düşüyor. Atalarımızın standartlarını karşılayacak layık bir şövalye seçmeliyim. \nSon birkaç yıldır, [my_relation.GetFirstName]'in yetenekli ve onurlu bir şövalye olduğu dikkatimi çekti — ama onlar bir sonraki #S Sabah Yıldızı Kılıcı#! olmaya layık mı?"

 agot_valyrian_steel.0001.a:0 "Dawn'ı [my_relation.GetHerHim]'e bahşedeceğim."

 agot_valyrian_steel.0001.b:0 "Hayır, [my_relation.GetHerHim]'i layık bulmuyorum."

 agot_valyrian_steel.0002.t:0 "Sabahın Kılıcı"

 agot_valyrian_steel.0002.desc:0 "Şafaktan birkaç saat önce, gecenin karanlığında, üstadım bana [my_relation.GetFullNameRegnal]'den gelen ve acil olduğunu söylediği bir mektup getiriyor. Mektubu ellerimde çevirip açmak için mor mum mührü kırıyorum. \n\nGörünüşe göre [my_relation.GetFirstName], onuru kabul edersem beni bir sonraki #SSabah Yıldızı Kılıcı#! ilan etmek istiyor. Pek çok büyük Dayne, gelecekteki eşi Prenses Nymeria için Kral Yorick V Yronwood ve ordularına karşı savaşan Lord Davos Dayne gibi, o efsanevi kılıcı taşıdı. Bu figürler hanemize şan getirdi. Onların izinden gitmeye gerçekten layık mıyım?"

 agot_valyrian_steel.0002.a:0 "Bu çağrıyı kabul edeceğim."

 agot_valyrian_steel.0002.b:0 "Ben Sabah Yıldızı Kılıcı değilim."

 agot_valyrian_steel.0004.t:0 "Matemin Kılıcı"

 agot_valyrian_steel.0004.desc:0 "[dead_relative.GetFirstName]'in ölümüyle birlikte Sabah Yıldızı Kılıcı makamı boş kaldı. Cenaze ayinleri bittiğinde ve [dead_relative.GetHerHim], Bir Olan Yedili'nin huzurunda dinlendiğinde; Dawn, yeni bir taşıyıcı beklemek üzere kaidesine dönecek. Tarihimizde, layık bir aday olmadığı için bu unvanın boş kaldığı yıllar olmuştur. \n\nAncak, hanemizden bir başkası Sabah Yıldızı Kılıcı unvanına ve onunla gelen şereflere ve görevlere layık olabilir. [my_relative.GetFirstName] şimdiye dek olağanüstü bir yetenek sergiledi ve onurlu bir [my_relative.GetWomanMan] olduğunu kanıtladı. Belki de bir sonraki #S Sabah Yıldızı Kılıcı#! olmaya bile layıklar?"

 agot_valyrian_steel.0004.a:0 "Dawn'ı [my_relation.GetHerHim]'e bahşedeceğim."

 agot_valyrian_steel.0004.b:0 "Hayır, [my_relation.GetHerHim]'i layık bulmuyorum."

 agot_valyrian_steel.1000.t:0 "Ayaklarımın Dibinde Valyria Çeliği"

 agot_valyrian_steel.1000.desc:0 "Savaşın harareti sönerken, alnımdaki düşman kanını silerken, üstün hünerim olmasaydı canımı alacak olan silahı görüyorum.\n\nÇamur ve sayısız cesedin ortasında House [artifact_knight.GetHouse.GetBaseName]'in Valyria çeliği kılıcı yatıyor. Sahipsiz kaldığına göre, almam bana kalmış..."

 agot_valyrian_steel.1000.a:0 "Kılıcı kazandım, onu sahipleniyorum!"

 agot_valyrian_steel.1000.a.tt:0 "#v House [artifact_knight.GetHouse.GetBaseName] böyle bir hakareti kolay kolay affetmeyecek!#!"

 agot_valyrian_steel.1000.b:0 "O bana ait değil."

 agot_valyrian_steel.1000.b.tt:0 "[looted_vs_sword.GetName], House [artifact_knight.GetHouse.GetBaseName]'e iade edilecek"

 agot_valyrian_steel.1001.t:0 "Esir Alınan Valyria Çeliği Kullanıcısı"

 agot_valyrian_steel.1001.desc:0 "Savaş kazanıldı. Güçlerim zafer kazandı ve düşmanlarım bozguna uğrayarak kaçıyor. Savaş alanından düşenlerin cesetleri toplanıp esirler alınırken, sadık savaşçılarımdan biri, değerli silahından yoksun bırakılmış [artifact_knight.GetTitledFirstNameNicknamed]'i önüme getiriyor.\n\n[looted_vs_sword.GetName], House [artifact_knight.GetHouse.GetBaseName]'in Valyria çeliği kılıcı avucumun içinde... Onu sahiplenme hakkımı yalnızca bir aptal tartışır."

 agot_valyrian_steel.1001.a:0 "Güzel bir ganimet olur!"

 agot_valyrian_steel.1001.b:0 "Böyle bir davranış adıma yalnızca onursuzluk getirir!"

 agot_valyrian_steel.1010.t:0 "[enemy_knight.Custom2('AppropriateGreeting', ROOT.Char)]"

 agot_valyrian_steel.1010.desc:0 "Ailenizin kıymetli kılıcı benim elime geçti.\n\nOnu, benimle bir savaşta karşı safta çarpışan [artifact_knight.GetName]'in elinden aldım; [artifact_knight.GetHerHis] ölümü üzücüdür ve [artifact_knight.GetHerHis] ailesini haklarından yoksun bırakarak kendimi onursuzluğa düşürmem. [looted_vs_sword.GetNameNoTooltip] sizindir."

 agot_valyrian_steel.1010.a:0 "[looted_vs_sword.GetNameNoTooltip] evinin yolunu buldu."

 agot_valyrian_steel.1011.t:0 "Çalınan Aile Yadigârı"

 agot_valyrian_steel.1011.desc.prisoner:0 "Alçak [vs_artifact_thief.GetName] beni yalnızca zincire vurmakla kalmadı, hapsedilmişliğimi de [looted_vs_sword.GetName]'i çalmak için bir fırsat olarak kullandı! #italic House [ROOT.Char.GetHouse.GetName]#!'in kılıcı!\n\nOnu #italic geri#! almalıyım! Şerefim ve House [ROOT.Char.GetHouse.GetNameNoTooltip]'in şerefi için."

 agot_valyrian_steel.1011.desc.house_head:0 "[battle_memory.GetName]'den gelen haber, bitkin bir haberciyle ulaşıyor.\n\nAlçak [vs_artifact_thief.GetName], benim [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('artifact_knight'))] [artifact_knight.GetName]'i yalnızca zincire vurmakla kalmadı, [artifact_knight.GetHerHis] hapsedilmişliğini de [looted_vs_sword.GetName]'i çalmak için bir fırsat olarak kullandı! #italic House [ROOT.Char.GetHouse.GetName]#!'in kılıcı!\n\nOnu #italic geri#! almalıyım! Şerefim ve House [ROOT.Char.GetHouse.GetNameNoTooltip]'in şerefi için."

 agot_valyrian_steel.1011.desc.slain:0 "[battle_memory.GetName]'de [artifact_knight.GetName], adamlarının yanında yiğitçe savaşırken, savaşın hararetinde canavar [enemy_knight.GetName] tarafından biçilerek öldü.\n\nYalnızca [artifact_knight.GetFirstNamePossessiveNoTooltip] canı değil, [looted_vs_sword.GetName] de kaybedildi. House [artifact_knight.GetHouse.GetNameNoTooltip]'in gözbebeği olan bu kıymetli eşya, [enemy_knight.GetNameNoTooltip] tarafından kişisel bir ödül gibi kuşanıp sergilenmek üzere çalındı!"

 agot_valyrian_steel.1011.tt.house_opinion_loss:0 "#v Senin#! Hanenin tüm üyeleri"

 agot_valyrian_steel.1011.feud:0 "House [vs_artifact_thief.GetHouse.GetName] bu hakaretin bedelini ağır ödeyecek!"

 agot_valyrian_steel.1011.feud.tt:0 "[scheme|E] artırılmış bir [success_chance|E]'ye sahip olacak"

 agot_valyrian_steel.1011.a:0 "[looted_vs_sword.GetNameNoTooltip]'i ne pahasına olursa olsun #italic geri#! getirmeliyim."

 agot_valyrian_steel.1011.b:0 "Bu benim gücümün dışında... Yapabileceğim hiçbir şey yok."

 agot_valyrian_steel.1011.c:0 "[looted_vs_sword.GetNameNoTooltip], şimdilik [vs_artifact_thief.GetFirstNamePossessive] yanında duracak..."

 agot_valyrian_steel.1012.t:0 "[expected_vs_artifact_holder.Custom2('AppropriateGreetingNegative', ROOT.Char)]"

 agot_valyrian_steel.1012.desc:0 "Sen onursuz bir hırsızsın! Herkes bilsin ki [looted_vs_sword.GetName] hakça bana aittir! House [expected_vs_artifact_holder.GetHouse.GetName]'in şerefinin iade edildiğini ve [looted_vs_sword.GetNameNoTooltip]'in ailemin korumasına döndüğünü göreceğim."

 agot_valyrian_steel.1012.a:0 "[expected_vs_artifact_holder.GetHerHim] sızlanıp dursun, [looted_vs_sword.GetNameNoTooltip] benim!"

 agot_valyrian_steel.2000.t:0 "Kaybın Yası"

 agot_valyrian_steel.2000.desc:0 "[location.GetName] sokaklarında yürürken zihnim, Ejderhaların Dansı sırasında burada yaşanan dehşet verici olaylara ve Ser [ancestor.GetFullName]'in hem büyük yiğitliğine hem de utancına gidiyor. Talihi kara Prens Joffrey'i savunmak için hücum ederken, Yedilinin Akını sırasında öldürüldü. House [ROOT.Char.GetDynasty.GetName]'in büyük gururudur ve sayısız şarkıya konu olmuştur — ancak kaybı, atalardan kalma Valyria çeliği kılıcı Lamentation'ın da kaybıydı.\n\nYıllardır görülmedi, ama kalbimde bilirim ki gün yüzüne çıkarılacak bir iz olmalı. Bir zamanlar bizim olanı geri kazanmanın şanına götürecek bir iz. Ser Willam'ın yiğitçe düşüşünün ardından, sonrasında ne olduğuna dair çelişkili görgü tanıkları vardır, ama çoğu tek bir noktada birleşir..."

 agot_valyrian_steel.2000.a:0 "Ejderha Çukuru..."

 agot_valyrian_steel.2000.a.tt:0 "Lamentation'ın kayboluşunu araştıracaksın..."

 agot_valyrian_steel.2000.b:0 "O canavarca dönemi unutmaya bırakmak daha iyidir."

 agot_valyrian_steel.2001.t:0 "Ejderhaların Ağıdı"

 agot_valyrian_steel.2001.desc:0 "Ejderha Çukuru'nun harap kalıntılarına iniyorum ve burada yaşananların ağır atmosferi elle tutulur gibi. Bir mezar haline gelen çöken abidenin altında ezilen binlerce insanın ve çığlık çığlığa ölen koca kertenkelelerin son anlarında kristalleşmiş bir ölüm, kül ve korku buhusu süzülüyor.\n\nDolaşırken önümde uzanan işin boyutunu fark etmeye başlıyorum. Dehşet içinde çığlık atarak ölen insanların ve hayvanların kemiklerini gün yüzüne çıkarmak için bir kurtarma planı. Meşakkatli bir iş olacak ve hiçbir sonuç vermeyebilir. Ama taşların arasında yakutu bulma şansı için, paha biçilemez olabilir."

 agot_valyrian_steel.2001.a:0 "Bu kalıntıları kazmak pahalıya mal olacak..."

 agot_valyrian_steel.2001.a.tt:0 "Molozu temizlemek için adamlar tutacaksın."

 agot_valyrian_steel.2001.b:0 "Belki Yüce Üstat arayışıma yardımcı olabilir?"

 agot_valyrian_steel.2001.b.tt:0 "Yüce Üstat [maester.GetFullName], [maester.GetHerHis] arşivlerinde bir şeyler bulunduruyor olabilir."

 agot_valyrian_steel.2001.c:0 "Belki küçük halkın izlenecek bir ipucu vardır."

 agot_valyrian_steel.2001.d:0 "Geçmişe koşmak budalalıktır. Kendi geleceğimi ben döveceğim."

 agot_valyrian_steel.2002.t:0 "Hiçbir Şey!"

 agot_valyrian_steel.2002.desc:0 "Devasa çabalarımıza rağmen, Lamentation'ın nerede olduğu ya da o gece bu çukurda ne olduğu hakkında henüz hiçbir şey bulamadık. Bunun umutsuz bir çaba olduğunu hissetmeye başlıyorum."

 agot_valyrian_steel.2002.a:0 "Burada OLMALI, hissedebiliyorum!"

 agot_valyrian_steel.2002.a.tt:0 "Daha fazla adam, daha fazla kürek, kazmaya devam!"

 agot_valyrian_steel.2002.b:0 "Belki de üstat doğru seçimdi."

 agot_valyrian_steel.2002.c:0 "Bir köylü isyanı, köylüleri araştıralım."

 agot_valyrian_steel.2002.c.tt:0 "Pire Dibleri'nde etrafa soracaksın."

 agot_valyrian_steel.2002.d:0 "Bu aptalca bir hayal."

 agot_valyrian_steel.2003.t:0 "Yeniden Keşfedildi!"

 agot_valyrian_steel.2003.desc:0 "Sonunda, yıllar süren kargaşanın ardından Lamentation gün yüzüne çıkarıldı ve House [ROOT.Char.GetDynasty.GetName]'in şefkatli ellerine iade edildi. Tarihimize değer veririz, çünkü Yedi Krallık'ın en saygın hanelerinden biriyiz ve şimdi elimde, köklü tarihimizin meşruiyetinin somut kanıtı duruyor."

 agot_valyrian_steel.2003.a:0 "Hatırlıyoruz!"

 agot_valyrian_steel.2004.t:0 "Zamana Karıştı."

 agot_valyrian_steel.2004.desc:0 "Görünüşe göre Lamentation şimdilik kayıp kalmaya mahkûm..."

 agot_valyrian_steel.2004.a:0 "Belki de onu edinmek bana nasip değil..."

 agot_valyrian_steel.2004.a.tt:0 "Çaban başarısız oldu."

 agot_valyrian_steel.2005.t:0 "Bilgi!"

 agot_valyrian_steel.2005.desc:0 "Büyük Üstat Verkos, ejderhanın kılıcını yemiş ve sonra dışkılamış olabileceğini öne sürdü; kim bilir, delice görünüyor ama gidip bakabilirsin. Ejderha cesetleri geleneksel olarak Dragonstone'a getirilirdi."

 agot_valyrian_steel.2005.a:0 "Şu ejderha gübresine bakmanın vakti."

 agot_valyrian_steel.2005.a.tt:0 "Dragonstone'a bir gemi kiralayacaksın."

 agot_valyrian_steel.2005.b:0 "Bu kesinlikle çılgınca, Pire Dibinde soruşturacağım."

 agot_valyrian_steel.2006.t:0 "Dragonstone Araması"

 agot_valyrian_steel.2006.desc:0 "[host.GetFullName], kayıp kılıcımı arayışımda beni Dragonstone'a zarifçe karşılıyor. Ejderha cesetlerinin ve benzerlerinin yıllardır alevlerde yok edilmek üzere Dragonstone'a, Dragonmont'a getirildiğini söylüyor. Ancak orası tehlikeli."

 agot_valyrian_steel.2006.a:0 "Yarın yola çıkıyoruz!"

 agot_valyrian_steel.2006.a.tt:0 "Dragonstone'a bir gemi kiralayacaksın."

 agot_valyrian_steel.2006.b:0 "Bu kesinlikle çılgınca, Pire Dibinde soruşturacağım."

 agot_valyrian_steel.2007.t:0 "Dragonstone Araması"

 agot_valyrian_steel.2007.desc:0 "Dragonmont'un tepesi ürkütücü şeylerle dolu, biraz tehlikeli"

 agot_valyrian_steel.2007.a:0 "Boğaz'da ilerliyoruz."

 agot_valyrian_steel.2007.a.success:0 "Sırtta yolunu buluyorsun."

 agot_valyrian_steel.2007.a.fail:0 "Oynak çakıllarda kayıyorsun."

 agot_valyrian_steel.2007.b:0 "Geri dönmeliyiz!"

 agot_valyrian_steel.2008.t:0 "Boğaz'ın İçine"

 agot_valyrian_steel.2008.desc:0 "Şimdi etrafa bakalım, bir görelim"

 agot_valyrian_steel.2008.a:0 "Dağılın ve her köşeyi bucağı arayın."

 agot_valyrian_steel.2009.t:0 "Yanmış Kemikler"

 agot_valyrian_steel.2009.desc:0 ""

 agot_valyrian_steel.2009.a:0 "Lamentation kayıp olarak kalıyor..."

 agot_valyrian_steel.2010.t:0 "Lamentation ile Sevinç"

 agot_valyrian_steel.2010.desc:0 "House [ROOT.Char.GetDynasty.GetName]"

 agot_valyrian_steel.2010.a:0 "Kılıç yeniden yapıldı."

 agot_valyrian_steel.3001.t:0 "Karanlık Bir Koruyucu"

 agot_valyrian_steel.3001.desc:0 "[blackfyre.GetName] ve [darksister.GetName] uzun süredir [targ_dynn.GetName] hanedanının simgeleri olmuştur. Blackfyre kralların kılıcıdır; gücün ve hükümdarlığın simgesi. Diğer yandan Kara Kız Kardeş, savaşçıların kılıcıdır; yalnızca efendilerini ve kanlarını korumaya gerçekten layık olanlara bahşedilir. Bu nesilde merak ediyorum... Kara Kız Kardeş'i kuşanmaya layık göreceğim biri var mı?"

 agot_valyrian_steel.3001.a:0 "Ailemizi savunması için [family_choice.GetTitledFirstName]'e güveniyorum."

 agot_valyrian_steel.3001.b:0 "[house_choice.GetTitledFirstName] zorlu bir savaşçı."

 agot_valyrian_steel.3001.c:0 "Varisi olduğum için [heir_choice.GetTitledFirstName]'e gitmeli."

 agot_valyrian_steel.3001.d:0 "Akrabalık muhafızları yeminli koruyuculardır; [kingsguard_choice.GetTitledFirstName] en iyi seçim."

 agot_valyrian_steel.3001.e:0 "[girl_choice.GetTitledFirstName] kendini kanıtladı."

 agot_valyrian_steel.3001.f:0 "Layık kimse yok."

 agot_valyrian_steel.4000.t:0 "Brightroar'ı Geri Al"

 agot_valyrian_steel.4000.desc_gerion:0 "[tommen.GetFullName]'in Valyria seferi sırasında Brightroar'ı kaybetmesinin üzerinden yüzyıllar geçti. House [ROOT.Char.GetDynasty.GetBaseName] o günden beri Valyria çeliği bir kılıçtan yoksun.\n\nBelki de kılıcı geri kazanmayı denemenin zamanıdır? Benim [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('explorer'))] [explorer.GetFirstName], uzun süredir hem şan hem servet için Eski Valyria'ya yolculuk etmek üzere iznimi istiyor.\n\nYolculuk hem pahalı hem de tehlikeli olacak... ama ödüller etkileyici olabilir."

 agot_valyrian_steel.4000.desc_gen:0 "[tommen.GetFullName]'in Valyria seferi sırasında Brightroar'ı kaybetmesinin üzerinden yüzyıllar geçti. House [ROOT.Char.GetDynasty.GetBaseName] o günden beri Valyria çeliği bir kılıçtan yoksun.\n\nBelki de kılıcı geri kazanmayı denemenin zamanıdır? Altının çözemediği çok az sorun vardır. Yeterli para ve gözü pek maceracılarla Brightroar geri kazanılabilir.\n\nYerel bir kaptan olan [explorer.GetFirstName], sefere liderlik etmeyi teklif etti.\n\nYolculuk hem pahalı hem de tehlikeli olacak... ama ödüller etkileyici olabilir."

 agot_valyrian_steel.4000.a:0 "Güvenle dön, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('explorer'))]..."

 agot_valyrian_steel.4000.a.tt:0 "[explorer.GetFirstName] Valyria'ya yolculuk edip Brightroar'ı geri getirmeye çalışacak"

 agot_valyrian_steel.4000.b:0 "Güvenle dön, [explorer.GetName]"

 agot_valyrian_steel.4000.b.tt:0 "[explorer.GetFirstName] Valyria'ya yolculuk edip Brightroar'ı geri getirmeye çalışacak"

 agot_valyrian_steel.4000.c:0 "Belki de Valyria'ya sefere çıkmanın zamanı değil..."

 agot_valyrian_steel.4000.c.tt:0 "Seferi iptal edeceksin ve altının sana iade edilecek"

 agot_valyrian_steel.4002.t:0 "Brightroar'ı Geri Al"

 agot_valyrian_steel.4002.desc:0 "[explorer.GetFirstNamePossessive] dönüş haberi bana ulaştı. İskeleye koşuyorum ve tayfanın şimdiden Eski Valyria'dan altın dolu sandıkları ve diğer ganimetleri boşalttığını görüyorum.\n\n[explorer.GetFirstName], elinde büyük bir kılıçla bana yaklaşıyor. [explorer.GetSheHe|U] eğilip onu bana sunuyor. "Brightroar, [ROOT.Char.GetLadyLord]'um. [tommen.GetFirstNamePossessive] gemisinin enkazını Dumanlı Deniz'in derinliklerinde bulduk... Kılıcın House [ROOT.Char.GetDynasty.GetBaseName]'e dönmesinin vakti çoktan geldi."\n\nKılıcı ellerime alıyorum. Brightroar nihayet evine döndü."

 agot_valyrian_steel.4002.a:0 "[ROOT.Char.GetHouse.GetMotto]!"

 agot_valyrian_steel.4003.t:0 "Brightroar'ı Geri Al"

 agot_valyrian_steel.4003.desc:0 "[explorer.GetFirstNamePossessive] seferinin gecikmesi çok uzun sürdü. Şimdiye kadar dönmüş olmaları gerekirdi.\n\nDumanlı Deniz'de korkunç bir şeylerin ters gittiğinden korkuyorum..."

 agot_valyrian_steel.4003.a:0 "Valyria bir can daha aldı..."

 agot_valyrian_steel.5000.t:0 "Uzun Diken Yeniden Çiçek Açıyor"

 agot_valyrian_steel.5000.desc:0 "Demircilerimin görevlerini tamamladığı haberi ulaştı. Bir zamanların büyük uzun kılıcıyla, şimdi yeniden onarılmış haliyle buluşmak için bahçeye çağrılıyorum!\n\nDemirci, parlak güneş ışığında parıldayan dalgalı yeşil-gri kılıcı çıkarıyor. Altınla sıkıca örülü kundağı, yeniden dövülmüş kabzası ve yuvarlak topuzu — hanemin meşruiyetini simgeleyen yeşil mermer bir el.\n\nHer gülün bir dikeni olsa da, varislerim bir [longthorn.GetName] taşıyacak!"

 agot_valyrian_steel.5000.desc_alt:0 "Demircilerimin görevlerini tamamladığı haberi ulaştı. Bir zamanların büyük uzun kılıcına, şimdi yeniden onarılmış haline tanık olmak için bahçeye çağrılıyorum!\n\nDemirci, parlak güneş ışığında parıldayan dalgalı yeşil-gri kılıcı çıkarıyor. Altınla sıkıca örülü kundağı, yeniden dövülmüş kabzası ve yuvarlak topuzu — yeşil mermer bir el.\n\nHer gülün bir dikeni olsa da, ben bir [longthorn.GetName] taşıyacağım!"

 agot_valyrian_steel.5000.a:0 "Yanmış kılıç yeniden onarılacak!"

 agot_valyrian_steel.8000.t:0 "Yeniden Dövme: Bir Fedakârlık"

 agot_valyrian_steel.8000.desc:0 ""Valyria çeliği dövmenin sırrı çoktan kayboldu... Ancak mevcut bir Valyria çeliği eserini yeni bir şeye dönüştürmek mümkün olabilir — #bold eğer#! orijinal eseri kaybetmeyi göze alırsan," diye öneriyor [court_smith.GetFirstName] gergin bir şekilde."

 agot_valyrian_steel.8000.a:0 "Layık bir adak."

 agot_valyrian_steel.8000.a.tt:0 "Yeni bir kılıç yaratmak için seçtiğin eseri yok edeceksin."

 agot_valyrian_steel.8000.b:0 "Bunu yapamam."

