l_english:

 agot_religious_decision.1001.t:0 "Kalp Ağacı"

 agot_religious_decision.1001.desc:0 "İnanç ne olursa olsun, dünyada pek az yer; huzur ve doğaüstü yalnızlık bakımından bir tanrı korusunun kalbiyle kıyaslanabilir. Ama burası içinde gezinebileceğiniz sıradan bir dinlenme bahçesi değil — Eski Tanrılar burada hüküm sürer.\n\nKalp ağacına yaklaşırken, içimden geçen tek şey..."

 agot_religious_decision.1001.a:0 "...ilahi kutsamayı dilemek."

 agot_religious_decision.1001.b:0 "...sağlık dilemek."

 agot_religious_decision.1001.c:0 "...huzur dilemek."

 agot_religious_decision.1001.d:0 "...yol göstericilik dilemek."

 gain_piety_tooltip:0 "Dindarlığım gözden kaçmıyor"

 wounds_turn_to_cripple_tooltip:0 "Yaraların tamamen iyileşiyor, ancak [GetTrait('crippled').GetName( GetNullCharacter )] oluyorsun"

 weirwood_fertility_bonus_modifier:0 "Weirwood Bereket Duası"

 weirwood_minor_health_bonus_modifier:0 "Weirwood Sağlık Lütfu"

 weirwood_medium_health_bonus_modifier:0 "Weirwood Sağlık Lütfu"

 weirwood_stress_modifier:0 "Weirwoodların Huzuru"

agot_religious_decision.1101.t:0 "Kızıl Yaprakların Altında"

agot_religious_decision.1101.desc:0 "High Heart'a dikilen weirwoodlar olağanüstü bir canlılıkla kök saldı. Kemik beyazı gövdeleri göğe doğru kıvrılıyor, dalları rüzgârda fısıldıyor gibi görünen kızıl yapraklarla yüklü. Burada hava sessizlik ve huşu ile dolu; yalnızca yaprakların hışırtısı bu sessizliği bölüyor.\n\nKoruluğun kalbinde, kadim kütüklerin bir zamanlar sessizce yas tuttuğu yerde duruyor ve Eski Tanrıların bir kez daha izlediğini hissediyorum. Bu kutsal yer yeniden yaşıyor."

agot_religious_decision.1101.a:0 "Tanrılar yolumu aydınlatsın."

 agot_religious_decision.3001.t:0 "Kutsanmış Alevler"

 agot_religious_decision.3001.desc:0 "[ROOT.Char.GetFaith.HighGodName]'in seçilmişleriyle kül ve kor dilinde kutsanmış ateş aracılığıyla konuştuğu söylenir — rahipleri için bile kavranması güç bir dil.\n\nGece ateşlerini izliyorum ve merak ediyorum: içlerinde ne görebilirim?\n\n[red_priest.GetFirstName], bir adak sunmanın [ROOT.Char.GetFaith.HighGodNameAlternate]'in lütfunu kesinlikle kazandıracağını öne sürüyor."

 agot_religious_decision.3001.prisoner:0 "Kral kanında güç vardır; [ROOT.Char.GetFaith.HighGodName]'i memnun edecek bir güç."

 agot_religious_decision.3001.prisoner.tt:0 "İnancının gayretli [vassals|E], [courtiers|E] ve [guests|E], #V sana# #P 10#! [opinion|E] kazanır!"

 agot_religious_decision.3001.prisoner.tt.a:0 "Ritüel kurbanlar uygulamayan tüm [vassals|E], [courtiers|E] ve [guests|E], #V senden# #N 30#! [opinion|E] kaybeder!"

 agot_religious_decision.3001.peasants:0 "Birkaç sıradan insan [ROOT.Char.GetFaith.HighGodNameAlternate]'i tatmin eder mi?"

 agot_religious_decision.3001.peasants.tt:0 "Ritüel kurbanlar uygulamayan tüm [courtiers|E] ve [guests|E], #V senden# #N 15#! [opinion|E] kaybeder!"

 agot_religious_decision.3001.peasants.tt.a:0 "İnancının gayretli [courtiers|E] ve [guests|E], #V sana# #P 10#! [opinion|E] kazanır!"

 agot_religious_decision.3001.false_idols:0 "[ROOT.Char.GetFaith.HighGodName]'den başka tanrı yoktur; sahte putlar yanacak."

 agot_religious_decision.3001.false_idols.tt:0 "Daha küçük bir adak, aradığım lütfu kazandırmayabilir..."

 agot_religious_decision.3001.a:0 "Bu sefer adak sunmayacağım."

 agot_religious_decision.3001.a.tt:0 "Adak sunulmayacak."

 agot_religious_decision.3001.b:0 "Bir düşününce, şu an doğru zaman değil."

 agot_religious_decision.3002.t:0 "Cevapsız Dualar"

 agot_religious_decision.3002.desc:0 "[red_priest.GetFirstName] ile birlikte gece üstüne gece saatlerce kutsal ateşlere baktık ve tüm çabalarımıza rağmen ne figür ne de şekil belirdi — gökyüzüne yalnızca duman ve korlar yükseliyor..."

 agot_religious_decision.3002.offering_desc:0 "Saatler geçiyor ve [red_priest.GetFirstName] sönmeyen bir şevkle dualarına devam etse bile, alevler ne şekil ne de hayal gösteriyor.\n\nGözlerim yükselen dumandan yanmaya başlıyor — sunduğum kurbana rağmen, sıradan bir gece ateşinden başka bir şey görmüyorum..."

 agot_religious_decision.3002.zealous:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] beni terk mi etti?"

 agot_religious_decision.3002.cynical:0 "Sonuçta diğerleri gibi bir ateş..."

 agot_religious_decision.3002.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] sessiz kalıyor."

 agot_look_into_flames.vision_intro_desc:0 "Gecenin karanlığını kovan şenlik ateşinin önünde [red_priest.GetFirstName] dualarında ısrar ederken, ben yavaşça düşüncelere dalıyorum.\n\n"

 agot_look_into_flames.vision_outro_desc:0 " #italic [ROOT.Char.GetFaith.HighGodName]'den gerçek bir görüyle mi kutsandım? Hangi mesajı taşıyor olabilir...?#!"

 agot_look_into_flames.vision_title:0 "Alevlerde Bir Görü"

 agot_religious_decision.3003.t:0 "$agot_look_into_flames.vision_title$: Gölge"

 agot_religious_decision.3003.desc:0 "Alevlerin büyüsüne kapılmışken, yalnız bir gölgenin yalnızca bir anlık görüntüsünü yakalıyorum; karanlıkta saklanan, güçlükle seçilebilen bir silüet ve alevler titrediğinde, figür jestleriyle bir davet uzatıyor gibi görünüyor.\n\nOmurgamdan bir ürperti geçiyor ve tuhaf gölge belirdiği kadar hızla buhara dönüşüyor; ateş yine yalnızca ateş."

 agot_religious_decision.3003.a:0 "Henüz doğmamış bir dostluğun fısıltısı mı?"

 agot_religious_decision.3003.b:0 "Karanlıkta pusuya yatmış gölgeler... henüz gerçekleşmemiş bir tehlikenin uyarısı mı?"

 agot_religious_decision.3003.tt:0 "Dualarım kabul oldu."

 agot_religious_decision.3004.t:0 "$agot_look_into_flames.vision_title$: Savaşçı"

 agot_religious_decision.3004.desc:0 "Dans eden alevlerin büyüsüne kapılmışken, ateşin ötesinde bir silüet görüyorum; ayaklarının dibinde düşmüş düşmanlarla çevrili, kudretli bir kılıç kuşanmış bir fatih. Bir anda savaşçının kılıcı parçalanıyor ve göğe sayısız kıvılcım saçıyor.\n\nOmurgamdan bir ürperti geçiyor ve ateş yine yalnızca bir ateş."

 agot_religious_decision.3004.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] beni zafere götürecek."

 agot_religious_decision.3004.b:0 "Çekişmeden uzak durmak daha iyi..."

 agot_religious_decision.3005.t:0 "$agot_look_into_flames.vision_title$: Kale"

 agot_religious_decision.3005.desc:0 "En kısa an için göğe yükselen kıvılcımlar daha parlak yanıyor gibi görünüyor ve dans eden alevlerin arasından bakarken, bir şekilde tanıdık gelen görkemli bir kale seçiyorum; parıldayan altın korlara karışıp eriyor.\n\nKalp atışım hızlanıyor, ama bir anda her şey yok oluyor ve ateş yeniden yalnızca bir ateş."

 agot_religious_decision.3005.a:0 "Beni bekleyen gelecekteki şan ve servetin yankısı."

 agot_religious_decision.3005.a.tt:0 "Sebatım ve gayretim mutlaka ödüllendirilecek."

 agot_religious_decision.3005.b:0 "Küle dönmüş kadim Valyria'nın bir görüntüsü."

 agot_religious_decision.3005.b.tt:0 "Görüden etkilenerek, kadim imparatorlukları incelemeye odaklanıyorum."

 agot_religious_decision.3006.t:0 "$agot_look_into_flames.vision_title$: Karanlıkta Hançerler"

 agot_religious_decision.3006.desc:0 "Çatırdayan ateş göğe kıvılcımlar saçmaya devam ederken, bir kalp atışından daha uzun olmayan bir an için bu kıvılcımlar; yukarıda yükselen kalın dumanın örttüğü gölgeleri zahmetsizce delip geçen yanan hançerlere dönüşüyor.\n\nKorkuya kapılıp ateşin sıcağına rağmen titriyorum ve bir anda her şey yok oluyor; ateş yine yalnızca bir ateş."

 agot_religious_decision.3006.a:0 "Tedbirli olmalıyım."

 agot_religious_decision.3006.b:0 "Belki de saldırma zamanıdır?"

 agot_religious_decision.3007.t:0 "$agot_look_into_flames.vision_title$: Dans Eden Simgeler"

 agot_religious_decision.3007.desc:0 "Titreyen alevlere kapılmışken, duman ve ateş girdapları şekillenmeye başlıyor ve en kısa an için kutsanmış ateş tuhaf simgeler gösteriyor; sanki gölgelerin kendisi önümde dans ediyormuş gibi oluşup, titreyip birbirine karışıyorlar.\n\nBelirdikleri kadar hızlı eriyip gidiyorlar ve alevler yeniden sıradan bir ateşten ibaret."

 agot_religious_decision.3007.a:0 "Yüce gizemlerin derinliklerine inmek zorundayım!"

 agot_religious_decision.3007.b:0 "Cevaplar kadim masalların içinde olmalı..."

 agot_religious_decision.3008.t:0 "$agot_look_into_flames.vision_title$: Zarar Görmeden Yürümek"

 agot_religious_decision.3008.t.scheme:0 "$agot_look_into_flames.vision_title$: Açığa Çıkan Hainlik"

 agot_religious_decision.3008.desc:0 "Kutsal ritüelleri gerçekleştiren [red_priest.GetFirstName], gece ateşlerinin önünde dualarına devam ederken yalnızca bir anlığına "

 agot_religious_decision.3008.scheme_murder_desc:0 "dans eden alevler peçeli bir gölgenin silüetini ortaya çıkarıyor — ve bunun #bold beni öldürmeyi#! planlayan [owner.GetTitledFirstName] olduğunu fark ediyorum!"

 agot_religious_decision.3008.scheme_abduction_desc:0 "dans eden alevler peçeli bir gölgenin silüetini ortaya çıkarıyor — ve bunun #bold beni kaçırmayı#! planlayan [owner.GetTitledFirstName] olduğunu fark ediyorum!"

 agot_religious_decision.3008.scheme_steal_artifact_desc:0 "dans eden alevler peçeli bir gölgenin silüetini ortaya çıkarıyor — ve bunun benden #bold bir eser çalmayı#! planlayan [owner.GetTitledFirstName] olduğunu fark ediyorum!"

 agot_religious_decision.3008.scheme_fallback_desc:0 "dans eden alevler peçeli bir gölgenin silüetini ortaya çıkarıyor — ve bunun bana karşı entrika çeviren [owner.GetTitledFirstName] olduğunu fark ediyorum!"

 agot_religious_decision.3008.no_scheme_desc:0 "Alevlerde kendimi tanıyorum.\n\nElimde meşale, karanlığın içinde zarar görmeden yürüyorum. Her zamankinden daha eminim ki [ROOT.Char.GetFaith.HighGodNameAlternate] beni izliyor."

 agot_religious_decision.3008.a:0 "[ROOT.Char.GetFaith.HighGodName] beni kayırıyor."

 agot_religious_decision.3008.b:0 "O [owner.Custom('InsultAdjective')] alçak!"

 agot_religious_decision.4000.t:0 "Bir Ticaret Seferi İçin Büyük Teklif"

 agot_religious_decision.4000.desc:0 "Danışmanlarım ve tüccarlarım uzak diyarlardaki el değmemiş pazarlar hakkında fısıldaşıyorlar. Uzunca bir değerlendirmenin ardından, sarayıma büyük bir ticaret seferi önermeye karar verdim. Bu girişim ülkeme muazzam bir servet getirebilir, ama aynı zamanda yararsız bir kaynak israfı da olabilir. Konsey planımı tartışmak üzere toplanırken, yolculuğa ne kadar yatırım yapacağıma karar vermeliyim."

 agot_religious_decision.4000.a:0 "Mütevazı bir yatırım; suları test etmeye yetecek kadar."

 agot_religious_decision.4000.a.flavor:0 "Bir sefer yola çıkacak ve iki ay içinde geri dönecek."

 agot_religious_decision.4000.b:0 "Dengeli bir yatırım; göze çarpan bir etki yaratmaya yetecek kadar."

 agot_religious_decision.4000.b.flavor:0 "Bir sefer yola çıkacak ve altı ay içinde geri dönecek."

 agot_religious_decision.4000.c:0 "Cömert bir yatırım; hatırı sayılır ödüller elde etmeye yetecek kadar."

 agot_religious_decision.4000.c.flavor:0 "Bir sefer yola çıkacak ve bir yıl içinde geri dönecek."

 agot_religious_decision.4000.d:0 "Savurgan bir yatırım; hiçbir masraftan kaçınmayacağım."

 agot_religious_decision.4000.d.flavor:0 "Bir sefer yola çıkacak ve iki yıl içinde geri dönecek."

 agot_religious_decision.4000.e:0 "Boş ver."

 agot_religious_decision.4001.t:0 "Sefer Dönüyor"

 agot_religious_decision.4001.desc:0 "Aylarca süren beklentinin ardından ticaret seferim nihayet geri döndü, ancak sonuçlar umduğumdan çok uzak. Zayıf planlama, kötü hava ve korsan saldırıları dâhil bir dizi talihsizlik; filoya, yapılan yatırıma kıyasla yolculuktan gösterecek çok az şey bıraktı. Bazı mallar kurtarıldı, ancak girişim vaat edilen ödülleri getirmedi."

 agot_religious_decision.4001.a:0 "Talihsizlik."

 agot_religious_decision.4002.t:0 "Sefer Dönüyor"

 agot_religious_decision.4002.desc:0 "Ticaret seferim geri döndü ve mütevazı bir mal sevkiyatı getirdi. Umduğum servet değildi ama kesinlikle bir başarısızlık da sayılmaz. Yeni ticaret yolları kuruldu, gerçi hayal ettiğim kadar kârlı değiller. Yine de bir başlangıç."

 agot_religious_decision.4002.a:0 "Beklenebileceği kadar iyi."

 agot_religious_decision.4003.t:0 "Sefer Dönüyor"

 agot_religious_decision.4003.desc:0 "Ticaret seferim zaferle geri döndü; servet ve yeni ticaret yollarıyla yüklü. Güvence altına aldığım yeni yabancı ticaret ortakları, yaptığım yatırımı fazlasıyla karşılıyor. Bu girişim, başkentimin gelişen bir ticaret merkezi olarak ününü güçlendirdi."

 agot_religious_decision.4003.a:0 "İnanılmaz!"

 agot_religious_decision.5000.t:0 "Balina Avı Seferi"

 agot_religious_decision.5000.desc:0 "Balina avlama seferimi başlatmak için gereken erzak ve parayı toplama zamanı."

 agot_religious_decision.5000.a:0 "Bu sefere cömertçe harcayacağım."

 agot_religious_decision.5000.b:0 "Orta düzeyde fon yatıracağım."

 agot_religious_decision.5000.c:0 "Asgari düzeyde harcayacağım."

 agot_religious_decision.5000.d:0 "Boş ver, artık ilgilenmiyorum."

 agot_religious_decision.5001.t:0 "Balina Avı Seferi"

 agot_religious_decision.5001.desc_great:0 "Denizi taramaya başlayalı yalnızca birkaç saat olmuşken, yakınlarda su yüzeyine çıkan birkaç balina fark ediliyor. Hatırı sayılır bir mesafede olmama rağmen, hepsinin küçük adalar boyutunda olduğunu görebiliyorum. En azından kıyıdaki tüccarlara anlatacağım hikâye bu.\n\nNe olursa olsun, tayfam ve ben açıkça görüyoruz ki küçük bir servet değerindeler!"

 agot_religious_decision.5001.desc_good:0 "Tayfalarımdan birinin ani bir haykırışı dikkatimi çekiyor.\n\nYükselen haykırışları, çevrilen kafaları ve uzatılan parmakları takip ediyorum ve sonunda uzakta çırpınan bir balina görüyorum. Görebildiğim kadarıyla, iyi fiyata satılması muhtemel olanlardan biri..."

 agot_religious_decision.5001.desc_bad:0 "Sefer çok uzun sürdü. Tayfalarım inleyip sızlanıyor; balinadan eser görmediğimizi, bu gidişle muhtemelen hiç göremeyeceğimizi söylüyorlar.\n\nTembellikleri beni incitse de, haklı olduklarından korkuyorum. Bu sefer bir israf ve kasam kendi hırsım tarafından soyuldu!"

 agot_religious_decision.5001.a:0 "Onların peşinden gitmeliyim!"

 agot_religious_decision.5001.b:0 "Benim olacak!"

 agot_religious_decision.5001.c:0 "Lanet olsun!"

 agot_religious_decision.5001.a.tt_success:0 "Balinaları öldürüp onlarla birlikte eve dönüyorsun"

 agot_religious_decision.5001.b.tt_success:0 "Balinayı öldürüp onunla birlikte eve dönüyorsun"

 agot_religious_decision.5001.a.tt_failure:0 "Balinayı öldüremiyorsun"

 agot_religious_decision.5100.t:0 "İçten Gelen Bir Çağrı"

 agot_religious_decision.5100.desc.holy_site:0 "Önümde, pürüzsüz yüzeyi donuk ve çağlar ötesi bir güç yansıtan, yağlı siyah taştan devasa bir dikilitaş duruyor. Sessiz nöbetinde, unutulmuş gizemlerin ipuçları kımıldanıyor.\n\nÇağlar boyunca insanlar parçalarını hatıra olarak aldı, kimileri de anıtlar dikti. Burada doğal bir dikilitaş duruyor — ama içinde hangi gizemler yatıyor olabilir? Neyi feda etmeliyim?"

 agot_religious_decision.5100.desc.artifact:0 "Elimde, pürüzsüz yüzeyi donuk ve çağlar ötesi bir güç yansıtan, yağlı siyah taştan bir parça duruyor. Elimdeki taşa bakarken, unutulmuş gizemlerin ipuçları kımıldanıyor.\n\nÇağlar boyunca bu taştan büyük anıtlar yontuldu ve hiç durmaması gereken yerlerde yağlı siyah dikilitaşlar yükseliyor. Benden öncekiler de bunun gibi parçalar taşıdı — ama içlerinde hangi gizemler yatıyor olabilir? Neyi feda etmeliyim?"

 agot_religious_decision.5100.a:0 "Görkemli bir adak"

 agot_religious_decision.5100.a.tt:0 "Sahip olabileceği gücü yatıştırmak için bu yağlı taşın önüne büyük değer taşıyan bir şey koyuyorum. Böyle bir hediye... dikkat çekebilir."

 agot_religious_decision.5100.b:0 "Mütevazı bir haraç"

 agot_religious_decision.5100.b.tt:0 "Daha gösterişsiz ama yine de anlamlı, o kadar abartılı olmayan bir adak. Belki taşın öfkesini uyandırmadan ilgisini çekmeye yeter."

 agot_religious_decision.5100.c:0 "Hiçbir şey, yalnızca kendim"

 agot_religious_decision.5100.c.tt:0 "Maddi bir servet yerine, kendi irademi taşın merhametine bırakıyorum; anlayış ya da delilik arıyorum. Taş karşılığında ne talep edecek?"

 agot_religious_decision.5100.d:0 "Olduğu gibi bırak"

 agot_religious_decision.5100.d.tt:0 "Taş rahatsız edilmeden duruyor. Gücü inkâr edilemez, ama belki böyle bir adak için henüz doğru zaman değil — ya da onu tamamen görmezden gelmek daha akıllıca."

 agot_religious_decision.5101.t:0 "Ritüel"

 agot_religious_decision.5101.desc.start_no_offering:0 "Taşın önünde duruyor, ona yalnızca varlığımı veriyorum. Sanki taş beni kendine çekiyor ve kararımı tartıyor gibi hissediyorum."

 agot_religious_decision.5101.desc.start_offering:0 "Adağımı taşın önüne koyuyorum; bir hürmet işareti. Taş, sanki daha fazlasını bekliyormuş gibi jestimi neredeyse kabul ediyor."

 agot_religious_decision.5101.desc:0 "\n\nOdaklanmış bir niyet ritüeline başlıyorum; taş, yağlı pürüzsüzlüğün hissi, artık düşüncelerimin merkezinde. Her jest, söylenen ya da düşünülen her söz kasti görünüyor; sanki eylemin kendisi olacakları şekillendirecek güce sahipmiş gibi."

 agot_religious_decision.5101.desc.end_no_change:0 "\n\nTaştan dönüp uzaklaşırken, arkamda sessiz taşla birlikte değişmediğimi hissediyorum. Sessiz bir hayal kırıklığı var; sanki çabalar boşunaymış gibi, ama söylenmeden kalan bir şeyler olduğu hissinden de kurtulamıyorum."

 agot_religious_decision.5101.desc.end_changed:0 "\n\nTaştan dönüp uzaklaşırken, içimde bir şeylerin değiştiğini hissediyorum. Ne olduğunu söylemek zor, ama değişimi, yüzeyin hemen altında süzülen o hissi fark edebiliyorum."

 agot_religious_decision.5101.shrewd:0 "Keskinleşmiş zihin"

 agot_religious_decision.5101.shrewd.tt:0 "Taş bana daha keskin bir strateji anlayışı bıraktı. Daha net düşündüğümü, başkalarının hamlelerini rahatsız edici bir isabetle önceden sezdiğimi görüyorum."

 agot_religious_decision.5101.strong:0 "Boyun eğmeyen güç"

 agot_religious_decision.5101.strong.tt:0 "Taş bana fiziksel güçte bir patlama bahşetti. Kendimi daha yetenekli hissediyorum; bedenim artık eskisinden daha zorlu bir kuvvet."

 agot_religious_decision.5101.good:0 "Taştan bir hediye"

 agot_religious_decision.5101.good.tt:0 "Taş ne yaptıysa, olumlu bir şey getirdi. Belki yeni bulunmuş bir bilgelik ya da önümdeki yolda beklenmedik bir avantaj."

 agot_religious_decision.5101.no_change_tt:0 "Taş hiçbir şey yapmadı. Umutlarım ve beklentilerim suya düştü; her şey boşuna mıydı diye sorgulamaya başladım."

 agot_religious_decision.5101.bad:0 "Ödenen bir bedel"

 agot_religious_decision.5101.bad.tt:0 "Ne değiştiyse, bana pahalıya mal oldu. Taş bana bir şey vermiş olabilir, ama karşılığında aynı kadarını da almış."

 agot_religious_decision.5101.possessed:0 "Karanlıkta bir ses"

 agot_religious_decision.5101.possessed.tt:0 "İçimde bir şeylerin kımıldadığını, zihnimde kök salan yabancı bir varlık hissediyorum. Taşın gücü, açıklayamadığım şekillerde beni sahiplenmiş gibi."

 agot_religious_decision.5101.no_change.zealous:0 "Tanrılar neden benden nefret ediyor?"

 agot_religious_decision.5101.no_change.zealous.tt:0 "Tanrıların beni reddettiğini, lütuflarının kavrayışımdan uzaklaştığını hissediyorum. Hayal kırıklığına uğramış ve kafası karışmış bir halde, cevapların olmadığı yerde cevap arıyorum."

 agot_religious_decision.5101.no_change:0 "Cevapsız"

 agot_religious_decision.5101.no_change.tt:0 "Taş hiçbir şey yapmadı. Umutlarım ve beklentilerim suya düştü; her şey boşuna mıydı diye sorgulamaya başladım."

 agot_religious_decision.5200.t:0 "Hayatın Kendi Özü"

 agot_religious_decision.5200.desc:0 "Mahkûmlarımdan hangisinin kanı akıtılacak?"

 agot_religious_decision.5200.a:0 "Bu iş görür."

 agot_religious_decision.5200.b:0 "$agot_religious_decision.5200.a$"

 agot_religious_decision.5201.t:0 "Hayatın Kendi Özü"

 agot_religious_decision.5201.desc:0 "İşkencecilerimin [living_blood_bag.GetName]'i zindana sürükleyip sülükleri ve öteki dehşet aletleriyle kanını akıtmaya başlamalarını kasvetli bir hayranlıkla izliyorum."

 agot_religious_decision.5201.a:0 "Ne heyecanlı!"

 agot_religious_decision.5201.a_tt:0 "20 kan kazandın."
