l_english:

 agot_greensight.0001.intro_own_foresight:0 "Uykumdan irkilerek uyanıyorum, rüyamın ayrıntılarını çılgınca hatırlamaya çalışırken şakaklarımı tutuyorum.\n"

 agot_greensight.0001.intro_visit:0 "Uykumdan uyanırken [greenseer.GetFirstNameNoTooltip] odama giriyor, [greenseer.GetHerHis] sesi fısıltılı, [greenseer.GetHerHis] hareketleri gizemli.\n\n#italic "[ROOT.Char.GetFirstNameNoTooltip], feci bir şey öngördüm..."#!"

 agot_greensight.0001.intro_letter:0 "Sabahın erken saatlerinde, güne başlamaya hazırlanırken bir hizmetkâr beni sessiz bir köşeye çağırıyor. "Affedersiniz, [greenseer.GetTitledFirstName]'den bir kuzgun geldi. Size bir mektup vardı ve üzerinde, gelir gelmez okumanızın acil olduğunu söyleyen bir not iliştirilmişti."\n\n#italic "[ROOT.Char.GetFirstNameNoTooltip], bir rüya gördüm... #!""

 agot_greensight.0001.murder:0 "\n#italic    Bir dişi geyik gölün suyundan içiyor...#!\n#italic       bir ağacın ardında gizlenmiş bir kurdun gölgesi bekliyor, dişleri açlıkla parlıyor...#!\n#italic          geyik, boynu delinip canı çekilirken acıyla böğürüyor ve yere yığılıyor.#!\n\nBirileri öldürmek için plan yapıyor"

 agot_greensight.0001.abduction:0 "\n#italic    Bir ağacın dallarında parıldayan elmalar asılı...#!\n#italic       bir rüzgâr esiyor ve tek bir elmayı alıp götürüyor...#!\n#italic          birini daha, sonra birini daha alıyor. Ta ki tek bir elma bile kalmayıp ağaç çıplak kalana dek.#!\n\nBirileri kaçırmak için entrika çeviriyor"

 agot_greensight.0001.fallback:0 "\n#italic    Toprağın üzerinde gururla yükselen bir dağ...#!\n#italic       yer sarsılıyor, gökyüzü titriyor ve dağ temellerinden korkuyor...#!\n#italic          ve tam yer çatlamaya başlarken, ben de irkilerek uyanıyorum.#!\n\nBirileri aleyhine plan yapıyor"

 agot_greensight.0001.elope:0 "\n#italic    Çevrelerinde fırtına koparken yan yana büyüyen iki ağaç...#!\n#italic       rüzgâr onları ayırmaya çalışırken dalları yıl be yıl iç içe geçiyor...#!\n#italic          zorluk ve mücadele boyunca bir olmuş iki varlık.#!\n\nBirileri kaçıp gitmek için plan yapıyor"

 agot_greensight.0001.steal_back_artifact:0 "\n#italic    Kış ayları boyunca toprağı kaplayan bir kar fırtınası...#!\n#italic      altındaki her şeyi buzlu bir kafese hapsediyor ve onları belirsizliğin arafında bırakıyor...#!\n#italic          kar eriyip gittiğinde, orada olanlardan hiçbir şey kalmıyor.#!\n\nBirileri bir şeyler çalmaya çalışıyor"

 agot_greensight.0001.target_seer:0 " [target.GetHerHim]!"

 agot_greensight.0001.target_other:0 " benim [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]!"

 agot_greensight.0001.target_me:0 " beni!"

 agot_greensight.0001.child_new_seer:0 "\n\nGörünüşe göre [greenseer.GetFirstNameNoTooltip] görü yeteneğini kazandı. Çocuk için yüreğim sızlıyor; bu, gelecek yıllarda taşınması ağır bir yük olacak..."

 agot_greensight.0001.self_new_seer:0 "\n\nGörünüşe göre ben bir yeşilgörenim. Gelecek kehanetleri düşünürken, bu düşlerin yük olmaktan çok yardımcı olmasını umuyorum..."

 agot_greensight.0001.relative_new_seer:0 "\n\nGörünüşe göre [greenseer.GetFirstNameNoTooltip] görü yeteneği kazandı ve bir yeşilgören oldu. [greenseer.GetHerHis] hatrına, bunun lanetten çok bir nimet olduğunun kanıtlanmasını umuyorum..."

 agot_greensight.0001.known_seer:0 "\n\nBilgi için ne kadar minnettar olsam da, [greenseer.GetFirstNameNoTooltip]'e musallat olan düşlerin [greenseer.GetHerHim]'i fazla etkilememesini umuyorum..."

 agot_greensight.0001.known_seer_self:0 "\n\nBu komployu durdurabilene dek, bu görüler kesinlikle bana musallat olacak..."

 agot_greensight.0001.a:0 "Bunun arkasındaki alçağı durdurmalıyız!"

 agot_greensight.0100.t:0 "Öngörülen Sorun"

 agot_greensight.0100.desc.1:0 "Gecenin ortasında uyandım "

 agot_greensight.0100.desc.root_is_seer:0 "ter ve korku içinde. Yaklaşan kıyametimi gördüğüm bir rüya gördüm! Ne olacağından emin olamam, ama şimdi gerçekleşmesini engellemeye yetecek kadarını biliyorum."

 agot_greensight.0100.desc.other_seer:0 "acil ayak seslerinin sesine. Bir hizmetkâr, [ROOT.Var('seer').Char.GetName]'den derhal açılmak üzere bir mektup geldiğini söylüyor. Heyecanla mektubu açıyorum ve yaklaşan kıyametimi öngördüklerini görüyorum! Ne olduğundan pek emin olamadıklarını, ama gerçekleşmesini engellemem için yeterince ayrıntı verdiklerini söylüyorlar."

 agot_greensight.0100.desc.fallback:0 "Yaklaşan felaketim önceden görüldü."

 agot_greensight.0100.a:0 "Kıl payı!"
