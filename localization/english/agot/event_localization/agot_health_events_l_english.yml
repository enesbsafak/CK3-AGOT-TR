 health.3101.m:0 "Bir Üstat Çağırın! Hemen!"

 health.3101.m.tt:0 "Kale ile iletişime geçip bize bir [GetCourtPositionType('maester_court_position').GetName()] göndermelerini isteyeceğiz"

 health.3101.m_sick_physician:0 "Yeni bir üstada ihtiyacım var!"

 maester_level_up_chance_effect.t:0 "Üstadın Bilgisi Artar"

 health.6002.desc_dragon:0 "Bu fikir bana yabancı değil. Son zamanlarda karanlık düşünceler içindeyim ve bunun fark edilmiş olması gerek. [helping_dragon.GetFirstName]'e doğru yürürken, halimdeki bir şey yanlış mesaj veriyor olmalı."

 health.6001.dragon:0 "Binici olarak son hamlemde [helping_dragon.GetName]'i kullanacağım."

 agot_health_events.1000.t:0 "Bulanık Görüş"

 agot_health_events.1000.desc:0 "Cildin sayfalarını incelerken mürekkep gözlerimin önünde bulanıklaşıp dans etmeye başlıyor. Bir zamanlar net olan sözcükler şimdi okunaksız şekillere bürünürken panik beni kavrıyor. \n\nGözlerimi sıkıca kırptım, geçici bir dalgınlık olduğunu umarak. Ama harfler benden kaçmaya devam edip belirsizliğin içinde kaybolurken panik beni yeniden sarıyor..."

 agot_health_events.1000.a:0 "Görüşüme ne oluyor?"

 agot_health_events.1001.t:0 "Tek Gözü Kör"

 agot_health_events.1001.desc:0 "Sol gözümün kenarına karanlık sızarken kalbim hızla çarpıyor; günler geçtikçe ıslak kâğıda yayılan mürekkep gibi yayılıyor. Sağ gözümün görüşü daha zayıf olsa da hâlâ yerinde; sol gözüm ise inatçı bir buğuya yenik düşmeye devam ediyor.\n\nÇaresizce ovuşturuyorum ama faydası yok. Bulanıklık yoğunlaşıyor ve çok geçmeden sol gözümden gelen tüm görüntü kayboluyor.\n\nTek gözüm kördü, dünyamın yarısı artık karanlığa bürünmüş. Bu ani, dehşet verici değişimle boğuşurken korku pençesini üzerimde sıkılaştırıyor."

 agot_health_events.1001.a:0 "Bu yeni, parçalanmış gerçeklikte nasıl yol bulacağım?"

 agot_health_events.1002.t:0 "Yaştan Kör"

 agot_health_events.1002.desc:0 "Görüşümün yarısını kaybettiğimden beri, ne kadar zayıf olsa da kalan görüşüme daha çok güvenmeyi ve yeni uyum yolları bulmayı öğrendim. Ama kalan görüşüm gün geçtikçe bulanıklaşırken korku beni hiç terk etmiyor. \n\nBir sabah uyandığımda sağ gözümdeki kalan tüm görüşün de yok olduğunu görüyorum! Dünyamın nihayet tam bir karanlığa gömüldüğünü fark ettiğimde panik yükseliyor.\n\nKör oldum.\n\nKalbim hızla çarpıyor, ama şimdi daha yeni, daha ürkütücü bir meydan okumayla yüzleşmeliyim: görüşün hiç olmadığı bir dünyada yol bulmak. Korku beni kavrıyor, ama bir kez daha uyum sağlama gücünü bulmalıyım."

 agot_health_events.1002.a:0 "Yaşlılık benden daha fazlasını aldı."

 agot_health_events.1003.t:0 "Yaştan Kör"

 agot_health_events.1003.desc:0 "Kalbim hızla çarpıyor, alnımda soğuk bir ter oluşuyor. Odaklanmaya yönelik her deneme dünyayı daha da bulanıklaştırıyor. Gözlerimi ovuşturuyorum ama faydası yok. Odanın canlı renkleri bulanık bir griye solmaya başladı ve gölgeler görüş alanımın kenarlarına süzülüyor.\n\nGerçek bana bir darbe gibi çarpıyor — görüşümü kaybediyorum.\n\nÇevremi anlamlandırmak için çabalarken korku pençesini sıkılaştırıyor. Gerçek artık yadsınamaz; yaşlılık görüşümü çalmaya başladı ve karanlık yavaşça yaklaşıp beni kaçışı olmayan bir boşluğun içine sarıyor."

 agot_health_events.1003.a:0 "Görünüşe göre İnsanın düşmanı zamandır."

 agot_health_events.1004.t:0 "Görme Korkusu"

 agot_health_events.1004.desc:0 "Sonraki birkaç günü bir sisin içinde geçiriyorum; dünyam gölgelere ve belirsiz ana hatlara indirgenmiş durumda. Her gün sonsuz gibi geliyor; kaybettiğim görüşü telafi etmek için duyularım keskinleşmiş.\n\nSonra, bir sabah uyanıp pencereden süzülen güneş ışığına gözlerimi kırpıştırıyorum. Oda netleşiyor, ayrıntılar gözlerimin önünde billurlaşıyor. Bildik çevreyi algıladıkça içimi bir rahatlama kaplıyor.\n\nGörüşüm, kaybolduğu kadar aniden geri döndü ve bana görme armağanına karşı yeni bir minnet bıraktı."

 agot_health_events.1004.a:0 "Dünya harika bir renk atlıkarıncası."

 agot_health_events.3001.t:0 "Asla İyileşmeyecek Bir Yara"

 agot_health_events.3001.desc_intro:0 "El aynamda, uzun iyileşme sürecim boyunca yüzümü kaplamış olan sargı bezlere bakıyorum. İyileşme sürecimde, ne kadar itiraz etsem de altlarında ne olduğunu görmem yasaklanmıştı. İyileşme tamamlandığında yeni yüzümü görmek için bolca zaman olacağı söylenmişti. Sonunda sargıları söküyorum, ama karşımdaki aynadaki kişiyi tanıyamadığımı fark ediyorum."

 agot_health_events.3001.desc_disfigurement_1:0 "\n\nYara, yüzümün sağ tarafını harap etti... çenemdeki ve hatlarımdaki hasar felaket düzeyinde... hatırladığım yansıma gitmiş.\n\nŞimdi bir kararla karşı karşıyayım — diyarın gözünden saklamak için maske mi takmalıyım, yoksa yeni çehremi herkesin görmesine izin mi vermeliyim?"

 agot_health_events.3001.desc_disfigurement_2:0 "\n\nYara yüzümü harap etti... burnum yok olmuş ve ağzımın sağ tarafı korkunç biçimde şekilsiz... hatırladığım yansıma gitmiş.\n\nŞimdi bir kararla karşı karşıyayım — diyarın gözünden saklamak için maske mi takmalıyım, yoksa yeni çehremi herkesin görmesine izin mi vermeliyim?"

 agot_health_events.3001.desc_disfigurement_3:0 "\n\nYara ağzımı yok etti... etime verdiği hasar ağır... hatırladığım yansıma gitmiş.\n\nŞimdi bir kararla karşı karşıyayım — diyarın gözünden saklamak için maske mi takmalıyım, yoksa yeni çehremi herkesin görmesine izin mi vermeliyim?"

 agot_health_events.3001.desc_disfigurement_4:0 "\n\nYara, yüzümün sol tarafını harap etti... hatırladığım yansıma gitmiş.\n\nŞimdi bir kararla karşı karşıyayım — diyarın gözünden saklamak için maske mi takmalıyım, yoksa yeni çehremi herkesin görmesine izin mi vermeliyim?"

 agot_health_events.3001.desc_disfigurement_5:0 "\n\nYara yüzümü harap etti... burnum yok olmuş... hatırladığım yansıma gitmiş.\n\nŞimdi bir kararla karşı karşıyayım — diyarın gözünden saklamak için maske mi takmalıyım, yoksa yeni çehremi herkesin görmesine izin mi vermeliyim?"

 agot_health_events.3001.a:0 "Bu dehşete tanık olsunlar."

 agot_health_events.3001.b:0 "Hüküm sürmeme yardım etmesi için maske takmalıyım."

 agot_health_events.3001.c:0 "Tüm yüzümü dünyadan gizleyeceğim."

 agot_health_events.4000.t:0 "Yeri Doldurulamaz Bir Kayıp"

 agot_health_events.4000.desc:0 "Sargılar nihayet çıkarıldı ve gerçek ortada. Bir zamanlar acının olduğu yerde artık yalnızca bir yokluk var. Yara iyileşti ama gözüm geri gelmeyecek.\n\nÖnüme birkaç örtü serildi. Birini alıp almamaya ya da diyarla olduğum gibi yüzleşmeye karar vermeliyim."

 agot_health_events.4000.a:0 "Sade bir kumaş bant yeterli olur."

 agot_health_events.4000.b:0 "Basit bir göz bandı pratik seçim."

 agot_health_events.4000.c:0 "Üçgen bir göz bandı beni diğerlerinden ayıracak."

 agot_health_events.4000.d:0 "Yuvarlak bir göz bandı olur."

 agot_health_events.4000.e:0 "Mevkime yakışır, süslü bir bant."

 agot_health_events.4000.f:0 "Temiz bir sargı yeterli olur."

 agot_health_events.4000.g:0 "Hiçbir şey takmayacağım ve gerçeğin görülmesine izin vereceğim."
