l_english:

 agot_prison.1001.t:0 "Susturulmuş"

 agot_prison.1001.start.desc:0 "Gardiyan, panik içindeki [recipient.GetTitledFirstName]'i odaya sürüklüyor. "Lütfen! Her şeyi söylerim, istediğiniz her şeyi!" [recipient.GetHerHis|U] itirazları, gardiyan [recipient.GetHerHim]'in ağzını tıkayıp [recipient.GetHerHim]'i masaya bağlarken yarıda kesiliyor.\n\n"

 agot_prison.1001.cruel.desc:0 ""Ah, [recipient.GetFirstNameNoTooltip]," diye teatral bir iç çekiş çekiyorum. "Görüyorsun ya, sorun tam da bu. Bir daha kimseye tek bir şey bile söylemeni istemiyorum.""

 agot_prison.1001.compassionate.desc:0 ""Bu barbarca görünebilir," diyorum hekim [physician.GetHerHis] aletlerini hazırlarken, "ama bu diyarın istikrarı için. İnan bana — acı çekmenden zevk almıyorum.""

 agot_prison.1001.child.desc:0 ""Her şey daha iyi hissettirecek," diyor hekim, [recipient.GetTitledFirstName]'e sakinleştirici iksiri uzatırken. [recipient.GetHerHis|U] küçük eli titriyor, ama [recipient.GetSheHe] yine de içiyor.\n\n[recipient.Custom('GirlBoy')] uykuya dalınca, hekim bana uzun uzun bakıyor. "Emin misiniz bu konuda, [actor.GetLadyLord]?""

 agot_prison.1001.a:0 "Oh, evet, bu #emp can#! yakacak."

 agot_prison.1001.b:0 "Nedenlerim var."

 agot_prison.1002.t:0 "Susturulmuş"

 agot_prison.1002.start.desc:0 "Kaderimi sessizce düşünürken gardiyan aniden kapıyı çarparak açıyor ve beni hücreden sürükleyip çıkarıyor. Orada, loş koridorda, [actor.GetTitledFirstName] beni bekliyor.\n\n"

 agot_prison.1002.cruel.desc:0 "[actor.GetHerHis] yüzündeki memnun ifade omurgamdan aşağı bir ürperti gönderiyor.\n\n"Telaşlanma. Kellen için gelmedim — geveze dilin gayet yeterli olur. Sıcak kerpetenleri getir bana""

 agot_prison.1002.compassionate.desc:0 ""[recipient.GetFirstNameNoTooltip], bilmeni isterim ki bundan zevk almıyorum. Seni susturmak zorundayım. Diyarın istikrarı için.""

 agot_prison.1002.child.desc:0 ""Her şeyin daha iyi hissetmeni sağlar," diyor hekim, [physician.GetSheHe] bana küçücük bir cam şişe uzatırken. Burası kötü bir yer, kötü insanlarla dolu, ama [physician.GetHerHis] gözleri... hoşlar. Titreyen bir el ile şişeyi dudaklarıma götürüyorum."

 agot_prison.1002.a:0 "Di... dilim mi? Bırak beni! #emp Hayııır!#!"

 agot_prison.1002.b:0 "Ben... kendimi tuhaf hissediyorum..."
