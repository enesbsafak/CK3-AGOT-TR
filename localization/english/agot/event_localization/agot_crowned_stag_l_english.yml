l_english:

 agot_crowned_stag.0001.t:0 "Taçlı Geyik"

 agot_crowned_stag.0001.desc:0 "Kanlı bir mücadelenin ve sevgili Lyanna'nın kaybının ardından, Deli Kral'ın zulmüne karşı galip geldik. Son Targaryenlar ve hain soyları, Dar Deniz'in ötesine sürüldü. Artık Westeros'un meşru kralı olarak hüküm sürüyorum.\n\nYaşasın Robert, Adının Birincisi, Andalların, Rhoynarların ve İlk İnsanların Kralı, Yedi Krallık'ın Efendisi ve Diyarın Koruyucusu!"

 agot_crowned_stag.0001.a:0 "Bizimkidir Öfke!"

 agot_crowned_stag.0002.t:0 "Kraliyet Görevleri: Arzular"

 agot_crowned_stag.0002.desc:0 "Kral olmak zor bir iş. Dilekçe sahipleriyle görüşmek, konsey toplantılarında saatlerce boş oturmak, aynı gevezelik eden seslerin bana önemsiz meselelerden bahsettiğini dinlemek. Burada koyun otlatma hakları, şurada Myr ile nakliye hatları. Bunda ne şan var ne heyecan. Kanım eskisi gibi coşmuyor — #italic Tanrılar#! adına, çekicimi kaldırdığımda nasıl da gürlerdi. Yeniden hayatta hissetmeyi ne çok özlüyorum.\n\nArtık savaş kalmadığına göre, belki de rahatlamanın diğer, daha şehvetli yolunu keşfetmeliyim. İpek Sokağı'nın tam da bunu sunduğunu duydum..."

 agot_crowned_stag.0002.a:0 "#bold Tanrılar#! adına, bir kadına ihtiyacım var!"

 agot_crowned_stag.0002.b:0 "Bu kadar alçalmayacağım."

 agot_crowned_stag.0003.t:0 "Kraliyet Görevleri: Rahatlama"

 agot_crowned_stag.0003.desc:0 "Genel eve girdiğimde akşam karanlığı çoktan çökmüş, ama loş ışıkta bile kadınların yeterince davetkâr ve güzel göründüğünü anlayabiliyorum. Çok geçmeden biri yanıma yaklaşıp tatlı bir gülümseme sunuyor."\n\n"Hoş geldiniz, efendim," diyor. "Ben [prostitute_character.GetFirstName]. Size nasıl hizmet edebilirim?"\n\nBir saat içinde beni sarhoş etmiş durumda; karnımdaki hafif sıcaklık, merdivenlere giden adımları fazla düşünmeden atmamı kolaylaştırıyor. Aklımda tam olarak bu vardı. Bir savaşa #italic pek#! benzemiyor, ama idare eder. Şimdilik idare eder... "

 agot_crowned_stag.0003.a:0 "Sonunda, biraz rahatlama..."

 agot_crowned_stag.0003.a.tt:0 "[prostitute_character.GetFirstName] ile yattın"

 agot_crowned_stag.1000.t:0 "Gece Toplanır"

 agot_crowned_stag.1000.desc:0 "Benjen sessizce yanıma yaklaşıyor, yüzü gergin ve ciddi. "Artık uygun bir varisin var ve yakında muhtemelen birkaç tane daha olacak. Bana artık ihtiyacın yok."\n\n"Benjen—" "Gece Nöbetçileri'ne katılmak için iznini istiyorum," diye sözümü kararlılıkla kesiyor. "Ned, Kışyarı'nda kalamam. Babam, Brandon, Lya... belki sen burada yeni bir aile kurup mutluluğu bulabilirsin, ama ben onların hayaletlerinden başka bir şey görmüyorum. Bir şeyi farklı yapabilir miydim diye sürekli düşünüyorum, belki..."\n\nYüzündeki kırık keder, kararlılığa dönüşüyor. "Gece Nöbetçileri'nin her zaman askere ihtiyacı vardır. Orada iyi işler yapabilirim.""

 agot_crowned_stag.1000.a:0 "Eğer gerekli görüyorsan."

 agot_crowned_stag.1000.b:0 "Bir aile ferdini daha kaybetmeye dayanamam."
