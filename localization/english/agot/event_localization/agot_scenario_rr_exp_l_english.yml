 agot_scenario_events_rr.loyalists.t:0 "Gaspçının Savaşı"

 agot_scenario_events_rr.rebels.t:0 "Robert'in İsyanı"

 agot_events_scenario_rr_exp.1.desc:0 "[GetScriptedCharacterByHistoryID('Stark_5').GetFirstName] ile aramda alevlenen aşk, ilk karşılaşmamızdan itibaren ikimizin de yüreğinde derin yandı. Kraliçem, Aşk ve Güzellik Kraliçem, don kadar mavi kış gülleri tacıyla. Aşkımız birçoklarını kızdırdı, en çok da nişanlısı [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName]'i. Öfkesi Krallıkların üzerine kapkara bir gölge düşürüyor, ama ailelerimizin yargılayıcı gözlerinden uzakta Dorne'a koşup kaçmamızı engelleyemedi. Aşkım Sevinç Kulesi'nde güvende ve bizi ayırabilecek güçte hiçbir ordu yok. Kaderimiz önceden yazıldı; bizimki Buz ve Ateşin şarkısı..."

 agot_events_scenario_rr_exp.1.a:0 "Ejderha bu kadar kolay kırılmaz."

 agot_events_scenario_rr_exp.2.desc:0 "Hainler! Hepsi hain! Adalet hakkımı reddetmek, Kral'ın barışını bozmak [GetScriptedCharacterByHistoryID('Arryn_3').GetFirstName] [GetScriptedCharacterByHistoryID('Arryn_3').GetHouse.GetName] kimmiş? [GetScriptedCharacterByHistoryID('Stark_1').GetHouse.GetName]lar, oğlumun hayatını bu kadar küstahça talep ediyorlar; oğlum sadece o kurt kızı [GetTitleByKey('c_storms_end').GetNameNoTier]'nin o şehvet düşkünü lordluğundan koruduğu için! Sahip oldukları her şeyi haneme borçlu olan [GetScriptedCharacterByHistoryID('Tully_1').GetHouse.GetName]lar da, şimdi Krallarına karşı açık isyan başlatıyor! Nankör [GetScriptedCharacterByHistoryID('Lannister_1').GetFirstName] [GetScriptedCharacterByHistoryID('Lannister_1').GetHouse.GetName] ise tüm bu süre boyunca [GetTitleByKey('c_casterly_rock').GetNameNoTier]'in altında saklanıyor, Ak Gezenler alsın onu! Bedelini ödeyecekler! #bold Ateş ve Kanla ödeyecekler! #"

 agot_events_scenario_rr_exp.2.a:0 "#bold Yakın onları! Hepsini yakın!#!"

 agot_events_scenario_rr_exp.3.desc:0 "[GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName] ve taraftarları, meşru hükümdarımız [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName]'e karşı ayaklandı. [GetScriptedCharacterByHistoryID('Targaryen_1').GetHouse.GetName]lar, Yedi Krallık'ın meşru Efendileridir ve biz [GetScriptedCharacterByHistoryID('Tyrell_8').GetHouse.GetName]lar diyardaki konumumuzu onlara borçluyuz. Bugünkü yerimize düşüncesiz kararlar alarak gelmedik; savaşlarımızı özenle seçerek ve görevimizi yerine getirerek geldik. Artık sadık her vassalin görevi olacağı üzere, isyancılara karşı tacı savunacağız."

 agot_events_scenario_rr_exp.3.a:0 "Ve böyle yaparak, her geçen gün daha da güçleneceğiz."

 agot_events_scenario_rr_exp.4.desc:0 "[GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName], kız kardeşim [GetScriptedCharacterByHistoryID('Martell_7').GetFirstNamePossessive] Veliaht Prens [GetScriptedCharacterByHistoryID('Targaryen_3').GetFirstName] ile evliliği sayesinde kan bağıyla müttefikimiz. Lord [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName], [GetScriptedCharacterByHistoryID('Stark_3').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_3').GetHouse.GetName]'in kardeşinin ve babasının idamının yanı sıra Prens [GetScriptedCharacterByHistoryID('Targaryen_3').GetFirstNamePossessive]'in [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_5').GetHouse.GetName]'i kaçırmasının ardından zalim kralın zulmüne karşı ayaklandı. Davası haklı olabilir, ama yeğenlerim başkentte kralın doğrudan gözetimi altındayken, tacı desteklemek için yürümekten başka çaremiz yok."

 agot_events_scenario_rr_exp.4.a:0 "Dorne'un Lordları yürüyecek."

 agot_events_scenario_rr_exp.5.desc:0 "Sevgilim [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName], aşağılık [GetScriptedCharacterByHistoryID('Targaryen_3').GetShortUIName] tarafından kaçırıldı. Bu zalimce eylemi [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName]'e protesto ettikten sonra, [GetScriptedCharacterByHistoryID('Stark_1').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_1').GetHouse.GetName], oğlu [GetScriptedCharacterByHistoryID('Stark_2').GetFirstName] gözlerinin önünde acımasızca diri diri yakıldı. Şimdi Ned ve ben, müttefiklerimizle birlikte Deli Kral'ın zulmüne karşı duruyoruz. Kralın yerine kimin geçmesi gerektiğini henüz bilmiyor olabiliriz, ama bir şey kesin: ejderhanın saltanatı sona erdi!"

 agot_events_scenario_rr_exp.5.a:0 "Targaryenlar benim ellerimle yıkılacak..."

 agot_events_scenario_rr_exp.6.desc:0 "Kız kardeşim [GetScriptedCharacterByHistoryID('Targaryen_3').GetShortUIName]'in elinde ve deli [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName], en büyük ağabeyim [GetScriptedCharacterByHistoryID('Stark_2').GetFirstName] çaresizce izlerken babamı diri diri yaktı. [GetScriptedCharacterByHistoryID('Stark_5').GetFirstNamePossessive] nişanlısı Robert, kralın zulmüne karşı ayaklandı ve dostuma adaleti getirmesinde elimden gelenin en iyisini yapacağım."

 agot_events_scenario_rr_exp.6.a:0 "Lyanna yeniden güvende olacak..."

 agot_events_scenario_rr_exp.7.desc:0 "Eski evlatlıklarım [GetScriptedCharacterByHistoryID('Stark_3').GetFirstName] ve [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName], [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName]'in zulmüne karşı ayaklandı. Deli Kral, [GetScriptedCharacterByHistoryID('Stark_1').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_1').GetHouse.GetName]'i yaktı ve Robert'ın nişanlısı [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_5').GetHouse.GetName]'in kaçırılmasına göz yumdu. Yoldaşlarımın yalnız kalmasına izin vermeyeceğim. Vadi'nin şövalyeleri hazır bekliyor ve [GetScriptedCharacterByHistoryID('Arryn_3').GetHouse.GetName] Hanesi, diyara adaleti getirmek için yardım edecek."

 agot_events_scenario_rr_exp.7.a:0 "Galip geleceğiz"

 agot_events_scenario_rr_exp.8.desc:0 "[GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName], yine bir delilik nöbetiyle, [GetScriptedCharacterByHistoryID('Stark_1').GetFirstName] ve [GetScriptedCharacterByHistoryID('Stark_2').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_2').GetHouse.GetName]'i acımasızca idam ettirdi. [GetScriptedCharacterByHistoryID('Targaryen_3').GetShortUIName] ayrıca [GetScriptedCharacterByHistoryID('Stark_5').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_5').GetHouse.GetName]'i kaçırdı. Kızım [GetScriptedCharacterByHistoryID('Tully_4').GetFirstName], Lord [GetScriptedCharacterByHistoryID('Stark_3').GetFirstName] ile evli olduğundan Starklarla kan bağıyla müttefikiz. Deli Kral'ın hükümdarlığının çoktan tadının kaçtığı açık; diyara her ne pahasına olursa olsun düzen geri getirilmeli."

 agot_events_scenario_rr_exp.8.a:0 "Nehir Lordları hazır bekliyor"

 agot_events_scenario_rr_exp.9.desc:0 "Eski dostum [GetScriptedCharacterByHistoryID('Targaryen_1').GetShortUIName], düşüncesiz eylemleriyle [GetScriptedCharacterByHistoryID('Stark_3').GetFirstName] [GetScriptedCharacterByHistoryID('Stark_3').GetHouse.GetName], [GetScriptedCharacterByHistoryID('Baratheon_2').GetFirstName] [GetScriptedCharacterByHistoryID('Baratheon_2').GetHouse.GetName] ve müttefiklerini isyana itti. Kral, Kralın Eli olarak sadık hizmetime rağmen beni defalarca aşağıladı. Batı Toprakları'nda hevesli bir müttefik bulacağını düşünüyorsa, çok yanılıyor. Şimdilik otur, bekle ve gözlemle."

 agot_events_scenario_rr_exp.9.a:0 "Aslan uyuyor... şimdilik..."

 agot_events_scenario_rr_exp.10.desc:0 "Savaş bir kez daha Westeros'a geldi. Şan ve yağma hırsına kapılmış oğullarım, beni kılıç kuşanmaya ikna etmeye çalıştı. Ama ben yaşlı, hasta bir adamım. Şanımı onlarca yıl önceki savaşlarda kazandım. Savaştan, kan dökülmesinden bıktım ve halkımı yağma ile fetih alışkanlıklarından vazgeçirmek için attığım adımların, sarp kıyılarımızdan tek bir uzun gemi ayrılır ayrılmaz boşa gideceğinden korkuyorum. Demir Bedeli'ni ödemeyeceğiz; en azından şimdilik..."

 agot_events_scenario_rr_exp.10.a:0 "En azından şimdilik değil..."
