l_english:

 agot_pirate_events.0003.t:0 "Liman Gümrükleri"

 agot_pirate_events.0003.desc:0 "Korsan sığınağı [port_name.GetName]'e ulaştım.\n\nRıhtıma adım attığımda, bir kerelik #P [SCOPE.GetValue('port_docking_fee')|0]#! @gold_icon! yanaşma ücreti ve şu an #P [SCOPE.GetValue('yearly_port_fee')|0]#! @gold_icon! olarak listelenen yıllık bir ücret ödemem gerektiği söyleniyor.\n\nYıllık ücretler, limanın sahibinin keyfine göre aniden değişebilir ve gemimin boyutuna göre hesaplanır.\n\nYıllık ücreti ödememenin #N hapisle sonuçlanabileceği#! konusunda uyarılıyorum."

 agot_pirate_events.0003.a:0 "Anlaşıldı."

 agot_pirate_events.0004.t:0 "Liman Gümrükleri"

 agot_pirate_events.0004.desc:0 "Yıllık liman ücretlerini ödemenin vakti geldi. [port_holder.GetName]'e #P [SCOPE.GetValue('yearly_port_fee')|0]#! @gold_icon! ödemeliyim."

 agot_pirate_events.0004.a:0 "Ödeyeceğim."

 agot_pirate_events.0004.b:0 "Ödemeyi reddediyorum."

 agot_pirate_events.0004.c:0 "Belki bu ödemeden kaçınmak için nüfuzumu kullanabilirim..."

 agot_pirate_events.0004.c_tt:0 "[port_holder.GetShortUIName] üzerindeki [strong_hook|E]'ini kullanman, bu yılki zorunlu ödemeden kaçınmanı sağlayacak."

 agot_pirate_events.0100.t:0 "Korsan Olmak"

 agot_pirate_events.0100.desc:0 "Maceraperest hayatımı geride bırakıp korsanlığı benimsedim."

 agot_pirate_events.0100.a:0 "Korsanlık hayatı bana uygun."

 agot_pirate_events.0101.t:0 "Denizlere"

 agot_pirate_events.0101.desc:0 "Topraksız bir kaptan olarak yaşamak için unvanlarımı ve topraklarımı bıraktım; yalnızca denize ve gemime bağlıyım."

 agot_pirate_events.0101.a:0 "Korsanlık hayatı benim!"

 agot_pirate_auto_join_port_war_interface_toast_title:0 "Savunma Savaşına Katılındı"

 agot_pirate_auto_join_port_war_interface_toast:0 "Limanının bulunduğu bölge için savaşa otomatik olarak katıldın."

 agot_pirate_events.0200.t:0 "Sürgün"

 agot_pirate_events.0200.desc:0 "[port_name.GetName] hükümdarı [actor.GetName], derhal limandan ayrılmamı ya da hapisle yüzleşmemi talep eden bir ferman çıkardı!"

 agot_pirate_events.0200.a:0 "Öyleyse [new_destination.GetName]'e yelken açacağım."

 agot_pirate_events.0200.b:0 "Bırakalım [actor.GetHerHim] beni tutuklamayı denesin!"

 agot_pirate_events.0200.c:0 "Seçeneklerim sınırlı; belki de korsanlıktan emekli olmanın vakti geldi."

 agot_pirate_events.0200.msg_pirate_moved_title:0 "Korsan Ayrıldı"

 agot_pirate_events.0200.msg_pirate_moved_desc:0 "[recipient.GetName], [port_name.GetNameNoTooltip]'ten ayrılma talebine uydu!"

 agot_pirate_events.0200.msg_pirate_squatting_title:0 "Korsan Ayrılmayı Reddediyor"

 agot_pirate_events.0200.msg_pirate_squatting_desc:0 "[recipient.GetName], [port_name.GetNameNoTooltip]'ten ayrılmayı reddetti! Bir [character_interaction|e] ile onların ikametgâhını ele geçirmeyi deneyebilirsin."

 agot_pirate_events.0200.msg_pirate_renouncd_piracy_title:0 "Artık Korsan Değil"

 agot_pirate_events.0200.msg_pirate_renouncd_piracy_desc:0 "[recipient.GetName], onları [port_name.GetNameNoTooltip]'ten sürmeye yönelik çabalarının ardından korsanlıktan vazgeçti! Artık bir [adventurer|e] oldular."

 agot_pirate_events.0300.t:0 "Liman Ücretleri Reddedildi"

 agot_pirate_events.0300.desc:0 "Limanlarımdan birine yanaşmış bir korsan olan [pirate.GetName], bana #P [SCOPE.GetValue('yearly_port_fee')|0]#! @gold_icon! tutarındaki yıllık ücreti ödemeyi reddetti."

 agot_pirate_events.0300.a:0 "Şimdilik görmezden geleceğim."

 agot_pirate_events.0300.b:0 "Gemilerine el koy ve [pirate.GetHerHim]'i hapse at."

 agot_pirate_events.9000.t:0 "Yeni Bir Kaptan Yükseliyor"

 agot_pirate_events.9000.desc:0 "Kaptan [dying_pirate_predecessor.GetName] öldü! #italic [ROOT.Char.GetPrimaryTitle.GetNameNoTier]#! komutası bana verildi ve artık onların kaptanı olarak hüküm sürüyorum."

 agot_pirate_events.9000.desc_maa_reset:0 "\n\nKaptanlığım #italic [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]#! boyunca hızla tanınsa da, bir zamanlar [dying_pirate_predecessor.GetNameNoTooltip]'e hizmet eden savaş görmüş askerlerin büyük bölümü, başka yerlerde yeni meydan okumalar aramak üzere ayrıldı.\n\nYine de tüm umutlar kaybolmuş değil; selefimin ölüm haberi, bana bağlılık yemini etmeye hevesli yeni kılıçları çekmeye başladı."

 agot_pirate_events.9000.a:0 "Yolculuğum başlıyor."

