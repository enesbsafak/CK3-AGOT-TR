 agot_pirate_events.9201.t:0 "Kasvetli Bir Girişim"

 agot_pirate_events.9201.desc:0 ""Efendim," diyor [colonist.GetName] yorgun bir iç çekişle, "Bu topraklar çiftçiler ve tüccarlar için değil, korsanlar ve yağmacılar için yaratıldı. Toprak sığ, kıyı tehlikeli ve korsanlar hâlâ sular ve tepelerde kol geziyor. Senin yardımın olmadan onu bayındır kılamam — üstelik o zaman bile, maliyetine asla değmeyeceğinden korkuyorum."\n\nYardım edersem bu toprakları yönetimimde tutabilirim; ama [colonist.GetFirstNameNoTooltip]'in iddia ettiği kadar çoraksa, maliyetin karşılığı hiç alınır mı? Yine de, efendi olarak vassallarımı ihtiyaçlarında desteklemek benim görevim; bu görevde başarısız olursam, ne kadar sadık kalacaklarını, hatta vassal kalıp kalmayacaklarını kimse bilemez."

 agot_pirate_events.9201.a:0 "İhtiyacın olan parayı alacaksın."

 agot_pirate_events.9201.b:0 "Bu senin sorumluluğun; benden hiçbir şey alamayacaksın."

 agot_pirate_events.9201.b.tt:0 "[colonist.GetTitledFirstNameNoTooltip] bu karara kötü tepki verebilir."

 agot_pirate_events.9300.t:0 "Varoluşsal Tehdit"

 agot_pirate_events.9300.desc:0 "[attacker.GetName], bölgedeki korsanlığı bozmak için bir istila başlattı. Tehditlerinin ciddiyeti göz önüne alındığında, süzerenimiz [defender.GetName] ile otomatik olarak güçlerimizi birleştirdik!\n\nKaybedersek, topraklarımız vahşi doğaya dönüşecek ve korsan gemilerimiz dağılacak."

 agot_pirate_events.9300.a:0 "Üstün gelmeliyiz."

