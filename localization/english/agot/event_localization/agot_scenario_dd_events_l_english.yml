 agot_scenario_dd.0200.t:0 "Pek Mütevazı Olmayan Bir Talep"

 agot_scenario_dd.0200.desc.early:0 "[duskendale.GetNameNoTier] meselesi hâlâ uygun bir çözüme kavuşmadı. Toprak hâlâ terazide.\n\nÖzel olarak [tywin.GetTitledFirstName], bir [chosen_sibling.Custom2('RelationToMeShort', SCOPE.sC('tywin'))]ine, Evi Darklyn'in çaresizce istediği ferman da dâhil olmak üzere toprağın verilmesini istiyor. [chosen_sibling.GetTitledFirstName]'in uygun bir tebaa olabileceğini öne sürüyor. \n\nEl sadık olsa da; ejderha kanı kalın akar. [viserys.GetFirstNameNicknamed]'e kendine ait bir kale vermek istiyorum. Her iki halde de, bu hainle savaş meydanında buluşacağız. Onlar kurtlar için akşam yemeği."

 agot_scenario_dd.0200.desc.tywin:0 "Babam gitti ve Yedi Krallık hükümdarlığım altında; dikkatime, [duskendale.GetNameNoTier] meselesinin hâlâ uygun bir çözüme kavuşmadığı getiriliyor. Sinsi [denys.GetTitledFirstName] kendini bağımsız ilan etti, kanındaki kadim kralların üslubunu kendine mal ederek. Birçokları bu savaşın çoktan kazanıldığını düşünüyor ve Darklyn toprakları hakkı için adlarını öne sürüyor.\n\n[tywin.GetTitledFirstName], [chosen_sibling.Custom2('RelationToMeShort', SCOPE.sC('tywin'))] [chosen_sibling.GetTitledFirstName]'e, hepsini başlatan kraliyet fermanıyla birlikte toprağın verilmesini istiyor.\n\nBu sadık Elimizi memnun etse de, ejderha kanı kalın akar ve kardeşim [viserys.GetFirstNameNicknamed]'in [viserys.GetHerHis] kendine ait bir kalesi olmalı. Her iki halde de, hain tarlada bekliyor."

 agot_scenario_dd.0200.desc.viserys:0 "Babam gitti ve Yedi Krallık hükümdarlığım altında; dikkatime, [duskendale.GetNameNoTier] meselesinin hâlâ uygun bir çözüme kavuşmadığı getiriliyor. Sinsi [denys.GetTitledFirstName] kendini bağımsız ilan etti, kanındaki kadim kralların üslubunu kendine mal ederek. Birçokları bu savaşın çoktan kazanıldığını düşünüyor ve Darklyn toprakları hakkı için adlarını öne sürüyor.\n\nEl'in vefatından önce [tywin.GetTitledFirstName], bir akrabasına, Denys'in talep ettiği fermanla birlikte Darklyn topraklarının verilmesini istemişti.\n\nTywin artık bu iddiayı öne sürecek durumda olmadığına göre, kardeşim [viserys.GetFirstNameNicknamed]'e kendine ait bir kale vermeliyim. Ama bunu güvenceye almak için bu hainle savaş meydanında buluşmalıyız."

