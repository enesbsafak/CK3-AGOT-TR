l_english:

 agot_scenario_dd.1000.t.rhaegar:0 "Babam, Kafesteki Ejderha"

 agot_scenario_dd.1000.t.aerys:0 "Kafesteki Ejderha"

 agot_scenario_dd.1000.t.denys:0 "Tutsağım, Kafesteki Ejderha"

 agot_scenario_dd.1000.desc.rhaegar:0 "Konseyim bana ağır bir haberle geldi: Babam [aerys.GetTitledFirstNameRegnal], [denys.GetTitledFirstName] tarafından esir alındı!\n\nLimanının kaçınılmaz çöküşünü kurtarmak için aptalca bir girişimle, Duskendale Lordu taçtan daha fazla özerklik veren bir imtiyaz fermanı talep etti. Kralın Eli [tywin.GetTitledFirstName] onu reddetti. Ama bu aptal vergilerini ödemeyi kesti, sonra da kralı bizzat [duskendale.GetNameNoTier]'e, dilekçesini dinlemesi için davet etti.\n\nBabam, kukladan ibaret olmadığını kanıtlama umuduyla, El olmadan onunla görüşmeyi kabul etti. Şimdi bir rehine ve [denys.GetTitledFirstNameNoTooltip], surları basarsak onu öldüreceğine yemin etti.\n\nBabamın hayatı artık El'in elinde ve Yedi Krallık onun nasıl davranacağını görmek için bekliyor."

 agot_scenario_dd.1000.desc.aerys:0 "[duskendale.GetNameNoTier]'e geldiğimde gücümü kanıtlamayı umuyordum. [denys.GetTitledFirstName], batmakta olan limanını kurtarmak için boş bir umutla taçtan bir kraliyet fermanı istedi, ama [tywin.GetFirstName] dilekçeyi hemen reddetti — yine sanki #italic o#! kralmış, ben de rahatsız bir sandalyede oturan bir aptalmışım gibi davranıyor.\n\nÖnce Duskendale'nin Sıçan Lordu vergilerini ödemeyi kesip dilekçesini bizzat dinlemem için beni çağırdığında görmezden gelmiştim. Ama sonra El buna karşı çıktı. #italic Aslan#! hangi hakla #italic ejderhaya#! emir verir? Bu yüzden Duskendale'ye sürdüm ve şimdi büyük bir salon yerine bir hücredeyim. Küçüldüğünü hissedebiliyorum, ayak sesleri yükseliyor, göğsümdeki atış hızlanıyor. Aklım mı iflas ediyor, yoksa yüreğim mi ayırt edemiyorum.\n\n#bold Beni dışarı çıkarın!#!"

 agot_scenario_dd.1000.desc.denys:0 "Oyunum işe yaradı! [aerys.GetTitledFirstNameRegnal] bir hücrede tek başına oturuyor, yakalanmış bir köpek gibi köşeye sinmiş. Şimdi diyarın dört bir yanında bana hain dediklerini duyuyorum. Hanenizin yüz kat ve daha fazlasıyla hak ettiği şeyi istemek ihanet midir?\n\nDornelilerle eşit bir ferman — tek isteğim buydu. Bir fermanla limanımı kurtarabilir, hanemi eski gücüne kavuşturabilirdim. Ama yüzyıllarca hizmetten sonra bile [tywin.GetTitledFirstNamePossessive] reddi anında geldi. Bir yol ayrımına bırakılmıştım. Hanemi yıkılışa terk edebilirdim, ya da aslanın zırhında bir zayıflık bulabilirdim. İkincisini seçtim.\n\n[aerys.GetFirstNameNoTooltip]'in kışkırtılınca benimle buluşmaya geleceğini biliyordum; adam bir aptal. Taze tutulmuş bir av gibi kendini bana teslim etti. Şimdi ondan ihtiyacım olanı çıkarmalıyım.\n\nUmarım #italic iradesi#! #italic aklı#! kadar zayıftır!"

 agot_scenario_dd.1000.opt.a:0 "Umarım El onu kurtarabilir."

 agot_scenario_dd.1000.opt.b:0 "Tywin! Rhaegar! #bold Biri!#!"

 agot_scenario_dd.1000.opt.c:0 "Gardiyan, aletleri topla!"

 agot_scenario_dd.0001.t:0 "Esir Aptal"

 agot_scenario_dd.0001.desc:0 "[aerys.GetTitledFirstNameRegnal], tebaası [denys.GetTitledFirstName] tarafından esir alındı. #italic Ne yazık...#!\n\n[duskendale.GetNameNoTier] lordu bir süredir Demir Taht için bir baş belası. İşe yaramaz limanını kurtarmak için boş bir girişimle, kendisine daha fazla özerklik ve daha düşük tarifeler tanıyan bir kraliyet fermanı talep etti. Reddedilince, aptal vergilerini ödemeyi bırakmaya karar verdi.\n\nKral da [denys.GetTitledFirstNameNoTooltip] kadar aptal olarak, bu anlaşmazlığı çözmek için tek başına [duskendale.GetNameNoTierNoTooltip]'e sürmeyi seçti. Şaşırtıcı olmayan bir şekilde, kral artık bir tutsak; saldırı belirtisi görülmesi halinde ölüm vaadiyle. Hiç şüphesiz [denys.GetTitledFirstNameNoTooltip] boyun eğmemi zorlamaya çalışıyor — ve bu işten kendine bir ferman koparmaya. Boyun eğersem taç gerçekten zayıf görünecek, ama kral öldürülürse daha da zayıf görünecek.\n\nNeyse ki, Kralın Eli olarak küçük konseyi kararımı dinlemesi için topladım. Hiçbir şey olmasa, sessiz kalamayız."

 agot_scenario_dd.0001.opt.a:0 "Lord Denys fermanına kavuşacak."

 agot_scenario_dd.0001.opt.b:0 "Duskendale'yi kuşatın, boyun eğmeyeceğiz."

 agot_scenario_dd.0002.t:0 "Kafesteki Kraldan Haber"

 agot_scenario_dd.0002.desc:0 "Tam [duskendale.GetNameNoTier]'e haber gönderip [denys.GetTitledFirstName]'e fermanını vermeyi kabul etmeye hazırlanırken, elçinin kral tarafından gönderildiğini iddia ettiği bir mektup şeklinde haber geliyor.\n\nMektubun kralın kendi eliyle yazıldığını tanıyorum, ama aceleyle karalanmış ve düzensiz. Mektup boyun eğmemiz için yalvarıyor, ama açıkça baskı altında yazılmış. Bunun krala işkence edildiği anlamına geldiğinden eminim ve kendi kesinliğim elbette sarsılıyor.\n\nKrala işkence eden bir düşmana boyun eğmek, kralın kurtarma girişiminde ölmesinden daha zararlı olabilir. Kral cezasız yakalanabiliyorsa, tacın kendisinin korkulacak bir yanı yok demektir. Yeniden değerlendirmeli ve seçimimden emin olmalıyım."

 agot_scenario_dd.0002.opt.a:0 "Duskendale'ye sürüyoruz, savaşa."

 agot_scenario_dd.0002.opt.b:0 "Kararımda dimdik duruyorum."

 agot_scenario_dd.0003.t:0 "El Süpürür"

 agot_scenario_dd.0003.desc:0 "Kralın Eli, taç ile [denys.GetTitledFirstName] arasındaki anlaşmayı bozma taleplerinde babama açıkça karşı geldi. Şaşırdığımı söylesem yalan olur; aralarındaki uçurum her geçen gün büyüyordu. Yine de bu, kral için vahim bir haber; özgürlüğü anlamına gelse bile. Eli bu kadar cüretkârca karşısına çıkarken, diyarın geri kalanı ne düşünecek?\n\nBabam taht üzerindeki kavrayışını mı kaybediyor? Artık hükmetmeye uygun mu? Değilse, onun yerine Demir Taht'a oturmak bana düşer. [tywin.GetTitledFirstName]'in gücünün dizginlenmesi gerektiğinden korkuyorum, taç hatırına. Onu Elden indirmek anlaşmanın sonu ve açık savaş demek. Zor bir seçim, ama doğru seçim olabilir mi?"

 agot_scenario_dd.0003.opt.a:0 "Lordları toplamalı ve diyarın kendi kararını vermesine izin vermeliyim."

 agot_scenario_dd.0003.opt.b:0 "Tywin'in yerine El olacağım. Savaşa!"

 agot_scenario_dd.0003.a.tt:0 "Demir Taht'ın kaderi için oy kullanacak bir Büyük Konsey çağırıyor ve hazırlık için Kralın Şehri'ne yolculuk ediyorsun."

 agot_scenario_dd.0003.b.tt:0 "Tywin'i Kralın Eli makamından alıyor ve makamı kendin üstleniyor; onun başlatması gereken savaşı başlatıyorsun."

 agot_scenario_dd.0004.t:0 "Büyük Konsey Toplanıyor"

 agot_scenario_dd.0004.desc:0 "Bir kuzgun geliyor: Veliaht Prens [rhaegar.GetFirstNameNicknamed] tarafından, [aerys.GetTitledFirstNameRegnal]'in kaderini karara bağlayacak bir Büyük Konsey için çağrılmışım. Kırk dört yıldır Büyük Konsey toplanmamıştı.\n\nBunun ne anlama gelebileceğinden korkuyorum, ama çağrıya cevap vermek görevim."

 agot_scenario_dd.0004.opt.a:0 "Atları hazırlayın, Kralın Şehri'ne gidiyoruz."

 agot_scenario_dd.0004.opt.b:0 "Zahmet edemem, ilgilenmem gereken başka işler var."

 agot_scenario_dd.0004.a.tt:0 "Büyük Konsey için Kralın Şehri'ne doğru yola çıkıyorsun."

 agot_scenario_dd.0004.b.tt:0 "Çağrıyı görmezden gelip işin içine girmiyorsun."

 agot_scenario_dd.0005.t:0 "277 A.C. Büyük Konseyi"

 agot_scenario_dd.0005.desc:0 "[aerys.GetTitledFirstNameRegnal]'in kaderini karara bağlayacak Büyük Konsey'e katılmak için geldim. Beni Veliaht Prens [rhaegar.GetFirstName] ve Kralın Eli [tywin.GetTitledFirstName] karşılıyor.\n\nYakında diyarın geleceği için oy vereceğiz. Oyum, önümüzdeki elli yıl boyunca Demir Taht'ta kimin oturacağını belirleyebilir.\n\nSelamlaşmalar bitince bir hizmetkâr bana yaklaşıp konaklamama götürmeyi teklif ediyor. Onları takip etmeliyim; böyle bir yolculuktan sonra yerleşmem gerek."

 agot_scenario_dd.0005.opt.a:0 "Umarım bu uzun sürmez..."

 agot_scenario_dd.0005.a.tt:0 "Hizmetkârı yatak odalarına kadar takip ediyorsun."

 agot_scenario_dd.0006.t:0 "Taraf Seçimi"

 agot_scenario_dd.0006.desc.voting:0 "Bugün [aerys.GetTitledFirstNameRegnal]'in kaderini karara bağladığımız gün.\n\nKralın Şehri'nde geçirdiğimiz süre boyunca derin tartışmalar yapıldı ve diyarın lordları arasında bir uzlaşma var gibi görünüyor.\n\nBirçoklarının kralı tahttan indirmek için oy vereceği varsayılıyor. Ama gerçekten böyle mi hissediyorlar, yoksa uzun kuşatma — ve ortada olmayan kral — onları Veliaht Prens ile Kralın Eli'nin isteğine boyun eğmeye mi zorladı?\n\nZaman gösterecek."

 agot_scenario_dd.0006.desc.observing:0 "Bugün [aerys.GetTitledFirstNameRegnal]'in kaderini karara bağladığımız gün. Taşlar dizildi ve konsey başladı. Konuşmalarımızı yaptık, niyetimizi açıkça bildirdik. Kral tahttan indirilmeli.\n\nToplanan konsey üyeleri oy kullanırken hayatlarımız onların ellerinde olacak. Zira kral Demir Taht'ta kalırsa, bunun için kafalarımızı kesinlikle ister. Bu riski biliyorduk ve diyarın iyiliği için kabul ettik.\n\nOylama başlarken derin bir nefes alıyorum."

 agot_scenario_dd.0006.opt.a:0 "Kral Aerys II'yi tahttan indirmek için oy veriyorum."

 agot_scenario_dd.0006.opt.b:0 "Kral Aerys II lehine oy veriyorum."

 agot_scenario_dd.0006.opt.c:0 "Umarım oy verenler bilgedir."

 agot_scenario_dd.0006.a.tt:0 "Veliaht Prens Rhaegar'ın yanında yer almayı seçiyorsun."

 agot_scenario_dd.0006.b.tt:0 "Kral Aerys II'ye sadık kalıyorsun."

 agot_scenario_dd.0006.c.tt:0 "Katılımcıları yakından izliyorsun."

 agot_scenario_dd.0007.t:0 "Büyük Konsey'in Sonuçları"

 agot_scenario_dd.0007.desc.tywin:0 "Kalabalığın uğultusu yavaşça sönüyor; Veliaht Prens [rhaegar.GetFirstName] ve ben Demir Taht basamaklarının dibinde duruyoruz. Sonuçlar geldi ve hapsedilmiş [aerys.GetTitledFirstNameRegnal]'e, kendi tahttan indirilişini kabul etmesi umuduyla bir ültimatom ileteceğiz.\n\nYeni bir kral, ama aynı El. Bu sefer ona kendini dinletmem gerekecek."

 agot_scenario_dd.0007.desc.rhaegar:0 "Kalabalığın uğultusu yavaşça sönüyor; Kralın Eli [tywin.GetFirstName] ve ben Demir Taht basamaklarının dibinde duruyoruz. Sonuçlar geldi ve hapsedilmiş [aerys.GetTitledFirstNameRegnal]'e, kendi tahttan indirilişini kabul etmesi umuduyla bir ültimatom ileteceğiz.\n\nNihayet Demir Taht'a çıkma zamanı geldi. Bu günün geleceğini biliyordum, ama bu kadar yakında olacağını değil. Şimdi tek umudum, babamın olanı kabullenip geçmişe tutunmaması."

 agot_scenario_dd.0007.desc.guest.yes:0 "Kalabalığın uğultusu yavaşça sönüyor; Veliaht Prens [rhaegar.GetFirstName] ve Kralın Eli [tywin.GetTitledFirstName] Demir Taht basamaklarının dibinde duruyor. Sonuçlar geldi ve hapsedilmiş [aerys.GetTitledFirstNameRegnal]'e bir ültimatom iletecekler.\n\nEl'in yüzündeki sırıtışa bakınca, bunun bir taht gaspı olduğu hissine kapılmaktan kendimi alamıyorum. Lehte oy verdim, ama yüksek sesle söylemeye cesaret edemem. Onurumu lekelese bile en güçlünün yanında duruyorum."

 agot_scenario_dd.0007.desc.guest.no:0 "Kalabalığın uğultusu yavaşça sönüyor; Veliaht Prens [rhaegar.GetFirstName] ve Kralın Eli [tywin.GetTitledFirstName] Demir Taht basamaklarının dibinde duruyor. Sonuçlar geldi ve hapsedilmiş [aerys.GetTitledFirstNameRegnal]'e bir ültimatom iletecekler.\n\nEl'in yüzündeki sırıtışa bakınca, bunun bir taht gaspı olduğu hissine kapılmaktan kendimi alamıyorum. Aleyhte oy verdim, ama yüksek sesle söylemeye cesaret edemem. Gelecek için kendimi hazırlamalıyım."

 agot_scenario_dd.0007.opt.a:0 "Evi Lannister'ın geleceği parlak..."

 agot_scenario_dd.0007.opt.b:0 "Hükümdarlığa ya da savaşa hazırlanmalıyım."

 agot_scenario_dd.0007.opt.c:0 "Bu gerçekten bir oylama mıydı?"

 agot_scenario_dd.0007.a.tt:0 "Her şeyi çözdüğünü düşünerek içten bir kahkaha atıyorsun."

 agot_scenario_dd.0007.b.tt:0 "Babanın oylamaya karşı çıkacağını bekliyorsun."

 agot_scenario_dd.0007.c.tt:0 "Oylamanın en başından ayarlandığını seziyorsun."

 agot_scenario_dd.0009.t:0 "277 A.C. Büyük Konseyi"

 agot_scenario_dd.0009.desc:0 "Oylar kullanıldı ve sayım sunuldu. Hain tebaalarım hiç şüphesiz [tywin.GetTitledFirstName] ve [rhaegar.GetTitledFirstName] ile beni devirmek için anlaştı. Sırtım duvara dayalıyken, duvarların üzerime kapandığını #italic hissedebiliyorum#!.\n\nBunlar atalarımın günleri olsaydı, ejderha sırtından onları yerle bir ederdim. Ne yazık ki elimde yalnızca #WF yabani ateş#! ve bu lanetli diyarda kalan birkaç sadık lord var. Soru önümde yükseliyor: Haklı hükümdarlığımı savunmalı mıyım?"

 agot_scenario_dd.0009.opt.a:0 "Boyun eğmeliyim."

 agot_scenario_dd.0009.opt.b:0 "#bold Hainler benden yalnızca ateş ve kan alacak!#!"

 agot_scenario_dd.0009.a.tt:0 "Demir Taht üzerindeki haklarını kaybediyorsun."

 agot_scenario_dd.0009.b.tt:0 "Prens, iktidar için toplarını atacak."

 agot_scenario_dd.0020.t:0 "Büyük Konsey Toplanıyor"

 agot_scenario_dd.0020.desc:0 "Veliaht prens beni Büyük Konsey hazırlıkları için Kralın Şehri'ne çağırdı. İkimiz de [aerys.GetTitledFirstNameRegnal]'in tahttan indirilmesi gerektiğinde hemfikiriz ve diğer lordları yanımıza çekmekte sorun yaşamayız. Kırk dört yıldır Büyük Konsey toplanmamıştı, diyar izleyecek.\n\nİşi doğru oynarsam konumumu sağlamlaştırabilir — ve diyara daha iyi bir kral verebilirim. Ama bu kadar yüksek riskler dikkat ister..."

 agot_scenario_dd.0020.opt.a:0 "Atları hazırlayın, Kralın Şehri'ne gidiyoruz."

 agot_scenario_dd.0020.opt.b:0 "Casterly Kayası'nda kalacağım."

 agot_scenario_dd.0020.a.tt:0 "Büyük Konsey için Kralın Şehri'ne doğru yola çıkıyorsun."

 agot_scenario_dd.0020.b.tt:0 "Çağrıyı görmezden gelip işin içine girmiyorsun."

 agot_scenario_dd.0080.t:0 "Duskendale Kaybedildi"

 agot_scenario_dd.0080.desc:0 "[rescue_war_winner.GetTitledFirstName] kapıları yardı; orduları içeri akarken okçular son savunmacıları surlardan tek tek düşürüyor. Savaş sesleri doruk noktasına ulaşıp katliam seslerine dönüşürken [duskendale.GetNameNoTier]'de yangınlar ortalığı kasıp kavuruyor.\n\nSurlarımın dışında böyle bir kuvvet toplanmışken [aerys.GetFirstName]'i rehin tutmak ne budalalık. Hanem yakında bir anıdan ibaret kalacak; kral yaşarsa, kendisine yapılanların ardından bize pek merhamet göstermeyecektir. Aklımın ön saflarına bir ihanet daha sokuluyor: tehdidimi yerine getirip kralı sonlandırmak.\n\nSavaş her halükarda bitti... Galipleri nasıl karşılayayım?"

 agot_scenario_dd.0080.opt.a:0 "Kaleyi teslim et, kralı onlara ver."

 agot_scenario_dd.0080.opt.b:0 "Kralın kafasını onlara fırlat!"

 agot_scenario_dd.0080.a.tt:0 "Kraliyet kuvvetleri tarafından esir alınıyorsun; hakkında görüş bildirilerek karar verilecek."

 agot_scenario_dd.0080.b.tt:0 "Teslim olmadan önce kralı idam ediyorsun, ardından kraliyet kuvvetleri tarafından esir alınıyorsun; hakkında görüş bildirilerek karar verilecek."

 agot_scenario_dd.0081.t.fail:0 "Kafesteki Sıçan"

 agot_scenario_dd.0081.t.success:0 "Kayıp Tutsak"

 agot_scenario_dd.0081.t.early_death:0 "Hanemizin Geleceği"

 agot_scenario_dd.0081.desc.fail:0 "[courtier.GetFirstName] bana bir hediye getirdi. Bir Kral Muhafızı, [aerys.GetTitledFirstName]'i kurtarmak için surlarıma tırmanmayı akıllıca bulmuş. Bu, son Blackfyre'ın katili Ser [selmy.GetFirstNameNicknamed]'den başkası değil! Onu gözetimimde bulmak ne hoş bir tesadüf.\n\nMerak ediyorum, daha kaç kişi gönderdiler — zira kesinlikle tek bir adam göndermezlerdi, ne kadar cesur olursa olsun. Eğer bu tür ajanlar surları aştıysa, bunu bitirme zamanı. Boğazlarını keseceğim ve işin içinden çıkacağım.\n\nDuskendale, ejderhalar gelmeden önce olduğu gibi bağımsız bir toprak olacak. Geri istiyorlarsa, benden zorla almaları gerekecek."

 agot_scenario_dd.0081.desc.success:0 "[courtier.GetFirstName], alarm çanları Dun Kalesi'ni sarsarken koşarak odama geliyor. "Efendim! Kral kaçırıldı!" [courtier.GetSheHe] bana, sesindeki korku apaçık biçimde haykırıyor. Bakışlarımı aşağıdaki kasabaya çeviriyorum, tam iki süvarili bir atın kale kapılarından fırlayıp kasabanın içinden geçip gidişini görmek için.\n\nBalkon korkuluğuna sıkılan ellerimle damarlarımda öfke kaynıyor. Kral olmadan kozum yok — ve koz olmadan #bold mahvolduk#!.\n\n[courtier.GetFirstNameNoTooltip]'e dönüyorum; öfke bedenimi ele geçirip mantığı bir kenara itiyor."

 agot_scenario_dd.0081.desc.early_death:0 "[aerys.GetTitledFirstName] gitti; kozum da onunla birlikte öldü. O olmadan yeni bir rota çizmeliyim; bu ancak savaş demek olabilir. Demir Taht bizi çok uzun süre boyunduruğu altında tuttu — onlar zenginleşirken bizim limanımızın çökmesine, gücümüzün tükenmesine izin verdi.\n\nHanemi kurtaracaksam, bizi yeniden kral yapmalıyım."

 agot_scenario_dd.0081.opt.a:0 "Boğazlarını kesin ve bana bir taç getirin."

 agot_scenario_dd.0081.opt.b:0 "#italic Gel buraya aptal!#!"

 agot_scenario_dd.0081.opt.c:0 "Yeniden kral olacağız!"

 agot_scenario_dd.0081.a.tt:0 "Bunu, kralı ve Kral Muhafızı'nı idam etmek için bahane olarak kullanıyorsun. Bu fırsatla Yedi Krallık'tan ayrılıp bağımsız oluyorsun."

 agot_scenario_dd.0081.b.tt:0 "Kral zindanlardan kaçtı ve adamlarından hiçbirinin açıklaması yok. Öfkeni haberciden çıkarıyorsun."

 agot_scenario_dd.0081.c.tt:0 "Kralın erken ölümüyle birlikte, Yedi Krallık'tan ayrılmaya odaklanıyorsun."

 agot_scenario_dd.0095.t:0 "Bir Kralın Kurtarılması"

 agot_scenario_dd.0095.desc:0 "Kralın Eli [tywin.GetTitledFirstName], [duskendale.GetNameNoTier]'i kuşatmak için güçlü bir orduyla sürüyor. Orada, kralı [denys.GetTitledFirstName]'in zindanlarından kurtarmayı umuyor.\n\nAma aklımı kurcalayan bir soru var: #italic Babam kurtarılmalı mı?#!"

 agot_scenario_dd.0095.opt.a:0 "Sancaktarları çağırın! Duskendale'ye yelken açıyoruz."

 agot_scenario_dd.0095.opt.b:0 "El benden yardım alamayacak."

 agot_scenario_dd.0095.a.tt:0 "Babanı kurtarmak için savaşa katılıyorsun."

 agot_scenario_dd.0095.b.tt:0 "Babanı kurtarma savaşını görmezden geliyorsun."

 agot_scenario_dd.0100.t:0 "Duskendale Kuşatması"

 agot_scenario_dd.0100.desc.aerys:0 "Açık havayı yeniden tenimde hissediyorum ve güneşin cildimi öpmesine izin veriyorum. [rescue_war_winner.GetTitledFirstName] beni kurtardı, eziyetlerimden ve hücrelerin karanlığından azat etti.\n\nDaha iyi bir havaya çıkmanın hayalini kurmuştum; onun yerine, azgın yangınlara ve ölmekte olan aptallara çıkarıldım. Dun Kalesi'nden dumanlar yükselirken leş kargaları ziyafet çekiyor. Konseyim surların dışında beni bekliyor; özgürlüğüme kavuşalı kısa bir süre oldu ama çoktan çeneleri kapanmıyor. Üç kez lanetlenmiş hainler, Evi Darklyn ile ne yapılacağını merak ediyorlar.\n\nTopraklarını ellerinde tutamazlar, ama hepsi ölmek zorunda mı? Hücremin dehşetleri aklımdayken, karar vermek bana düşüyor. Topraklarının meselesi de hemen ardından gelecek.\n\n[renfred.GetTitledFirstName] iyi ve sadık bir tebaa; belki Darklyn toprakları ona geçmeli. Ya da belki en küçük oğlum [viserys.GetTitledFirstName]'e uygun bir unvan."

 agot_scenario_dd.0100.desc.rhaegar:0 "[rescue_war_winner.GetTitledFirstName] başarılı oldu, kapılar yarıldı. Duskendale yanıyor ve kasaba yağmalanırken halkı dehşet ve ıstırap içinde çığlık atıyor; ama en azından babam özgür.\n\nYine de onda şimdiden bir değişim görüyorum; eskisi gibi olmayacak. Geleceği düşünmeden önce, şimdiyle ilgilenmeliyim. Babam özgürken, Evi Darklyn topraklarını kimin alacağına dair karar verilecek.\n\nKardeşim [viserys.GetTitledFirstName]'in tüm yüreğimle doğru seçim olduğuna inanıyorum."

 agot_scenario_dd.0100.opt.a:0 "Evi Rykker toprağı alacak ve diyar öfkemi tanıyacak."

 agot_scenario_dd.0100.opt.b:0 "Evi Rykker toprağı alacak, yeter ki hainler bir daha asla toprak sahibi olmasın."

