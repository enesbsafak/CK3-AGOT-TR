### TODO NOT-IN-ST: agot_scenario_dd.0111.desc.tywin [AGOT: The war is over! I have stormed the gates of [duskendale.GetNameNoTier], and taken hold of the Dun Fort. I have given the men leave to sack the town — we have been here for long months, and they deserve the spoils. I look out at the raging fires and dying denizens of Duskendale, what a waste...\n\nI step over a Darklyn soldier left to rot in the blood-soaked street, a nearby fire reflected in the surface of his sword. Something occurs to me then, House Darklyn's Valyrian steel sword [stalwart.GetName] is here. Long have I wanted a blade to replace Brightroar...\n\nI must have it!]
 agot_scenario_dd.0111.desc.tywin:0 "The war is over! I have stormed the gates of [duskendale.GetNameNoTier], and taken hold of the Dun Fort. I have given the men leave to sack the town — we have been here for long months, and they deserve the spoils. I look out at the raging fires and dying denizens of Duskendale, what a waste...\n\nI step over a Darklyn soldier left to rot in the blood-soaked street, a nearby fire reflected in the surface of his sword. Something occurs to me then, House Darklyn's Valyrian steel sword [stalwart.GetName] is here. Long have I wanted a blade to replace Brightroar...\n\nI must have it!"
### TODO NOT-IN-ST: agot_scenario_dd.0111.desc.rhaegar [AGOT: The war is over, I have stormed the gates of [duskendale.GetNameNoTier]. I have given orders for innocents to be spared, but controlling an army in a siege is like controlling the tides. Already, rage overflows across this ancient port, with the screams of the innocent drowning out any justification this battle might have had.\n\nA Darklyn soldier lies dead at my feet, his lifeless eyes locked on the last sky he'd ever seen, and I am left to wonder if any good might come of this. The man's sword reflects my face back to me, and I remember [stalwart.GetName], the ancestral blade of House Darklyn.\n\nPerhaps I could put it to use.]
 agot_scenario_dd.0111.desc.rhaegar:0 "The war is over, I have stormed the gates of [duskendale.GetNameNoTier]. I have given orders for innocents to be spared, but controlling an army in a siege is like controlling the tides. Already, rage overflows across this ancient port, with the screams of the innocent drowning out any justification this battle might have had.\n\nA Darklyn soldier lies dead at my feet, his lifeless eyes locked on the last sky he'd ever seen, and I am left to wonder if any good might come of this. The man's sword reflects my face back to me, and I remember [stalwart.GetName], the ancestral blade of House Darklyn.\n\nPerhaps I could put it to use."
