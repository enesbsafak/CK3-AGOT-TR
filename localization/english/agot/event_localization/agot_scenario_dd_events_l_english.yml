 agot_scenario_dd.0300.t:0 "Evi Targaryen'in Geleceği"

 agot_scenario_dd.0300.desc.start:0 "Babam ve Tywin gitti; hanemizi daha fazla korumak için en iyi ittifaklara karar vermek bana düşüyor. Evlenmeliyim, ama bu küçük bir iş değil. Yedi Krallık'ın Kraliçesi'ni seçeceğim; bunu iyi düşünmeliyim.\n\n"

 agot_scenario_dd.0300.desc.c:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Güzelliğini kimse inkâr edemez, Evi Lannister'ın gücünü de; ne var ki gözlerinde, bana yanan bir krallığın hayallerini yaşatan soğuk bir hırs var."

 agot_scenario_dd.0300.desc.e:0 "[elia.GetName] ile evlenebilirim; güneş yüzlü Dorne'un nahif prensesi. Hanesinin benimkiyle uzun bağları var ve kendileri de güçlüler."

 agot_scenario_dd.0300.desc.a:0 "[ashara.GetName] ile evlenebilirim; Yıldızdüşüşü'nün menekşe gözlü güzeli. Hanesi diyarın en büyük şövalyelerini yetiştiriyor."

 agot_scenario_dd.0300.desc.l:0 "Kuzey'in [lyanna.GetName]'inin güzel, vahşi tabiatlı ve güçlü iradeli olduğunu söylüyorlar. Eski Valyria kanıyla evlenen ilk Stark olurdu."

 agot_scenario_dd.0300.desc.ce:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Ama uzak güneyde, güneş yüzlü Dorne'un nahif prensesi [elia.GetName] de var. Onunla evlenmek, Dorne ile Demir Taht arasındaki bağları yeniden güçlendirir."

 agot_scenario_dd.0300.desc.ca:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Ama Dorne'da uygun bir kraliçe olabilecek bir başka güzellikten bahsediyorlar: Yıldızdüşüşü'nün menekşe gözlü kızı [ashara.GetName]."

 agot_scenario_dd.0300.desc.cl:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Ama Kuzey'in [lyanna.GetName]'inin de güzel, vahşi tabiatlı ve güçlü iradeli olduğunu söylüyorlar. İkisi de uygun bir kraliçe olabilir."

 agot_scenario_dd.0300.desc.cea:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Bir de güneş yüzlü Dorne'un nahif prensesi [elia.GetName] var. Son olarak, Yıldızdüşüşü'nün menekşe gözlü kızı [ashara.GetName]."

 agot_scenario_dd.0300.desc.cel:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Kuzey'in [lyanna.GetName]'inin de güzel, vahşi tabiatlı ve güçlü iradeli olduğunu söylüyorlar. Son olarak, güneş yüzlü Dorne'un nahif prensesi [elia.GetName]'i seçebilirim."

 agot_scenario_dd.0300.desc.cal:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Kuzey'in [lyanna.GetName]'inin de güzel, vahşi tabiatlı ve güçlü iradeli olduğunu söylüyorlar. Son olarak, Yıldızdüşüşü'nün menekşe gözlü kızı [ashara.GetName] var."

 agot_scenario_dd.0300.desc.ceal:0 "[cersei.GetName] ile uzun zamandır planladığım nişanım hâlâ geçerli. Büyük bir güzellik ve hanesi güçlü. Kuzey'in [lyanna.GetName]'inin de güzel, vahşi tabiatlı ve güçlü iradeli olduğunu söylüyorlar. Sonra güneş yüzlü Dorne'un nahif prensesi [elia.GetName] var. Son olarak, Yıldızdüşüşü'nün menekşe gözlü kızı [ashara.GetName]."

 agot_scenario_dd.0300.desc.ea:0 "İki net seçenek öne çıkıyor, ikisi de uzak güneyden. Bir yanda tacın Evi Martell ile bağlarını güçlendirecek güneş yüzlü Dorne'un nahif prensesi [elia.GetName]; diğer yanda Evi Dayne'den, Yıldızdüşüşü'nün menekşe gözlü güzeli [ashara.GetFirstName]."

