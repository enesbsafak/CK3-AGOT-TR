 agot_scenario_dd.0220.desc.rhaegar:0 "[duskendale.GetNameNoTier] için savaşlar başarısız oldu; her şeyi planlayamazsınız. Sonsuza dek ileri geri gitmeyi bekleyemeyeceğimize göre, onu zorla alacağız. Toprağın ne olacağına karar vermek bana ait olacak, itiraz dinlemeyeceğim.\n\nKendimi Duskendale'nin hükümdarı ilan ediyorum ve bu işi yaparken, kraliyet kararnamesiyle üzerindeki tüm iddiaları da kaldıracağım."

 agot_scenario_dd.0220.desc.denys:0 "[duskendale.GetNameNoTier] için savaşlar başarısız oldu; her şeyi planlayamazsınız. Demir Taht ve kuvvetleri, toprağımı zorla almak için kapılarımda.\n\nBitti, her şeyi kaybettim."

 agot_scenario_dd.0220.desc.war:0 "[duskendale.GetNameNoTier] üzerinde iddia öne sürmek için savaşlar başarısız oldu; her şeyi planlayamazsınız. Toprağı kendim alacağım, zorla. Ejderhanın gazabıyla yüzleşecekler. Toprağın ne olacağına karar vermek sonunda bana ait olacak; adaylarımın işi sonuna kadar götürmemesinden bıktım.\n\nUmarım beni bekliyorlardır, zira babamın intikamını alırken [denys.GetFullNamePossessiveNoTooltip] yüzündeki ifadeyi görmek istiyorum."

