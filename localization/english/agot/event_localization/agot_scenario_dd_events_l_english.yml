### TODO NOT-IN-ST: agot_scenario_dd.0001.desc [AGOT: [aerys.GetTitledFirstNameRegnal] has been taken prisoner by his vassal, [denys.GetTitledFirstName]. #italic A pity...#!\n\nThe lord of [duskendale.GetNameNoTier] has been a nuisance to the Iron Throne for some time now. In some vain attempt to save his useless port, he requested a royal charter from the crown, granting him greater autonomy and lower tariffs. After being refused, the fool then decided to cease paying his taxes.\n\nThe king, as much the fool as [denys.GetTitledFirstNameNoTooltip], chose to ride to [duskendale.GetNameNoTierNoTooltip] on his own to resolve this dispute. Unsurprisingly, the king is now a prisoner, with the promise of death should there be signs of an assault. No doubt [denys.GetTitledFirstNameNoTooltip] seeks to force my submission — and earn himself a charter in the bargain. The crown will appear weak indeed if I give in, but weaker still if the king is killed.\n\nRegardless, as the Hand of the King, I have called the small council to hear my decision. If nothing else, we cannot be silent.]
 agot_scenario_dd.0001.desc:0 "[aerys.GetTitledFirstNameRegnal] has been taken prisoner by his vassal, [denys.GetTitledFirstName]. #italic A pity...#!\n\nThe lord of [duskendale.GetNameNoTier] has been a nuisance to the Iron Throne for some time now. In some vain attempt to save his useless port, he requested a royal charter from the crown, granting him greater autonomy and lower tariffs. After being refused, the fool then decided to cease paying his taxes.\n\nThe king, as much the fool as [denys.GetTitledFirstNameNoTooltip], chose to ride to [duskendale.GetNameNoTierNoTooltip] on his own to resolve this dispute. Unsurprisingly, the king is now a prisoner, with the promise of death should there be signs of an assault. No doubt [denys.GetTitledFirstNameNoTooltip] seeks to force my submission — and earn himself a charter in the bargain. The crown will appear weak indeed if I give in, but weaker still if the king is killed.\n\nRegardless, as the Hand of the King, I have called the small council to hear my decision. If nothing else, we cannot be silent."
