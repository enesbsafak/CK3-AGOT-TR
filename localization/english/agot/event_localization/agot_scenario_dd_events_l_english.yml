 agot_scenario_dd.0198.t:0 "Cesur Bir Başarısızlık"

 agot_scenario_dd.0198.desc:0 "Kapımdaki ayak seslerinin sesiyle irkiliyorum. Gardiyanım bana bir hediye getiriyor ve bir gümbürtüyle, en iyi Kral Muhafızlarımdan biri olan Ser [selmy.GetFirstNameNicknamed]'in kafası olduğu ortaya çıkıyor. Bedenim titremeye başlıyor, gözyaşları görüşümü doldurup bulandırıyor. Ne çaba göstermiş olursa olsun, şövalyem beni kurtarma girişiminde başarısız oldu. [tywin.GetTitledFirstName]'in saldırısı neredeyse kesinleşmişken, [denys.GetTitledFirstName]'in beni idam etme tehditlerini uygulamaktan başka çaresi yok. Ayak sesleri yaklaşıyor ve gardiyanın yüzünde iğrenç bir sırıtış belirdiğini görüyorum.\n\nBen ejderhayım! Ölemem!"

 agot_scenario_dd.0198.opt.a:0 "@death_icon! Hayır! Bu olamaz!"

 agot_scenario_dd.0198.a.tt:0 "Zindanlarda idam ediliyorsun."

 agot_scenario_dd.0199.t.saved:0 "Kral Yaşıyor"

 agot_scenario_dd.0199.t.failed:0 "Kral Öldü"

 agot_scenario_dd.0199.desc.saved.camp:0 "Kampın kenarında nal sesleriyle uyanıyorum. Çılgınca verilen emirlerin ve sevinç çığlıklarının karışımını duyuyorum. Çadırımdan çıkarken Ser [selmy.GetFirstName]'in kampın kenarında durduğunu görüyorum. Atının sırtında yığılmış ve titreyen bir figür var; gözlerim alışınca babamın gümüş saçlarını görüyorum.\n\nSer [selmy.GetFirstNamePossessiveNoTooltip] kumarı başarılı oldu, kral kurtuldu. Onun yerine geçmek zorunda kalmayacağımı bilmenin rahatlığıyla bir iç çekiyorum.\n\nKamp bir hareket fırtınası; kimi şövalyeyi kutlamaya koşuyor, kimi saldırı için yerlerine koşuyor. [tywin.GetTitledFirstName] kalenin basılmasını emretti ve şimdiden heybetli surların ardından alevlerin yükseldiğini görüyorum."

 agot_scenario_dd.0199.desc.saved.home:0 "Duskendale dışındaki [tywin.GetTitledFirstNamePossessive] kampından bir kuzgun geldi. Kral Muhafızı'ndan Ser [selmy.GetFirstNameNicknamed], Dun Kalesi'ne cüretkâr bir görevle girmeyi başardı ve babamı kurtardı.\n\nUzun bir rahatlama iç çekişi bırakıyorum; en azından şimdilik, onun yerine Demir Taht'a oturmak zorunda kalmayacağım. Okumaya devam ediyorum: [tywin.GetTitledFirstNameNoTooltip] kraliyet kuvvetlerini kasabayı basmaya ayırdı ve yakında onun suyun ötesinde bir meşale gibi yandığını görebilirim. Babamın misillemesinin nazik olacağından şüpheliyim."

 agot_scenario_dd.0199.desc.failed.camp:0 "[tywin.GetTitledFirstNamePossessive] çadırından çıkıyorum; toplanan ordu şaşkınlık içinde. Bir elçi gelmiş ve [denys.GetTitledFirstName]'in hem Ser [selmy.GetFirstName]'i hem de babamı öldürdüğünü duyurmuş.\n\nMidemde bir çukur oluşuyor; yalnızca ölümünden değil, üzerime çöken ağırlıktan da. Şimdiden askerlerin ve şövalyelerin bana beklenti dolu gözlerle baktığını görüyorum. Beni kralları olarak görüyorlar ve ben daha ölü bir adamın oğlu olmakla baş edemedim. [tywin.GetTitledFirstNameNoTooltip] şimdiden saldırıyı planlamaya geçti; konsey masasında ise taç giyme ve düğün fısıltıları dolaşıyor.\n\nBabamın cenazesi daha soğumadı, onlar çoktan onu geride bıraktı. Yeni görevimin baskısı beni ezmek için hazır ve ben daha hiçbir şeye başlamadım bile."

 agot_scenario_dd.0199.desc.failed.home:0 "Duskendale dışındaki kamptan bir kuzgun geldi. Üstat konuşmadan önce, haberin kara olduğunu anlıyorum. Ser [selmy.GetFirstName], budalaca bir kurtarma planıyla yakalanmış ve öldürülmüş. Onunla birlikte babam da. Artık müzakere umudu yok; [tywin.GetTitledFirstName] surlara saldırıp kasabayı yağmalamak zorunda kalacak.\n\nNormalde Duskendale'nin masumlarını düşünürdüm, ama aklım kederle çok bulanık. Şimdiden beklentinin ve kehanetin ağırlığını üzerimde hissediyordum; şimdi bir de taç ekleyeceğim. Babam öldü ve Prens Rhaegar da öldü; onun yerinde bir kral doğmalı."

 agot_scenario_dd.0199.desc.war.nobs:0 "[denys.GetTitledFirstName], kapıları yarıp içeri girdiğimizde babamı öldürdü.\n\nGeri çekilip şartlar üzerinde müzakere etseydik, belki de kral kurtarılabilirdi. Kendimi toparlamak için kısa bir an alıyorum ve hükümdarlığın yükünün artık bana ait olduğunu fark ediyorum.\n\n[iron_throne.GetNameNoTier] babam ölüyken boş duruyor; [denys.GetTitledFirstNamePossessiveNoTooltip] tehditlerini daha ciddiye almalıydık.\n\nŞimdi yapabileceğim tek şey, babamı onurlandırmak için iyi bir kral olmayı ummak. İlk görevim elbette Darklynlere ne yapılacağı olacak."

 agot_scenario_dd.0199.desc.war:0 "[denys.GetTitledFirstName], kapıları yarıp içeri girdiğimizde babamı öldürdü.\n\nGeri çekilip Ser [selmy.GetFirstName]'in planının ilerlemesine izin verseydik, belki de kral hâlâ hayatta olurdu. Kendimi toparlamak için kısa bir an alıyorum ve hükümdarlığın yükünün artık bana ait olduğunu fark ediyorum.\n\n[iron_throne.GetNameNoTier] babam ölüyken boş duruyor; [denys.GetTitledFirstNamePossessiveNoTooltip] tehditlerini daha ciddiye almalıydık.\n\nŞimdi yapabileceğim tek şey, babamı onurlandırmak için iyi bir kral olmayı ummak. İlk görevim elbette Darklynlere ne yapılacağı olacak."

