### TODO NOT-IN-ST: agot_scenario_dd.0080.desc [AGOT: [rescue_war_winner.GetTitledFirstName] has breached the gates, his armies swarming through as archers pick the last of the defenders off the walls. Fires rage across [duskendale.GetNameNoTier] as the sounds of battle reach a fever pitch, then shift to those of slaughter.\n\nWhat a folly this ploy was, to keep [aerys.GetFirstName] hostage with such might assembled outside my walls. My House will be naught but a memory soon, if the king should live he will have little mercy after all that has been done to him. A further treason presses its way to the fore of my mind, to make good on my threat, and end the king.\n\nThe battle is over either way... How shall I greet the victors?]
