### TODO NOT-IN-ST: agot_scenario_dd.0198.desc [AGOT: I jolt at the sound of footsteps at my door. My jailor brings me a present, and with a thud it is revealed to be the head of Ser [selmy.GetFirstNameNicknamed] — one of my finest Kingsguard. My body begins to shake, as tears fill and distort my vision. Whatever his efforts, my knight failed in his attempt to rescue me. With an assault by [tywin.GetTitledFirstName] all but assured, [denys.GetTitledFirstName] has no choice but to follow through on his threats to execute me. Footsteps approach, and I see the jailor take on a wicked grin.\n\nI am the dragon! I cannot die!]
 agot_scenario_dd.0198.desc:0 "I jolt at the sound of footsteps at my door. My jailor brings me a present, and with a thud it is revealed to be the head of Ser [selmy.GetFirstNameNicknamed] — one of my finest Kingsguard. My body begins to shake, as tears fill and distort my vision. Whatever his efforts, my knight failed in his attempt to rescue me. With an assault by [tywin.GetTitledFirstName] all but assured, [denys.GetTitledFirstName] has no choice but to follow through on his threats to execute me. Footsteps approach, and I see the jailor take on a wicked grin.\n\nI am the dragon! I cannot die!"
