### TODO NOT-IN-ST: agot_scenario_dd.0003.desc [AGOT: The Hand of the King has openly defied my father in his demands to break the agreement between the Crown and [denys.GetTitledFirstName]. I wish I was surprised, but the rift between them has been growing wider with each passing day. Still, this is dire news for the king, even if it means his freedom. With his Hand acting so brazenly against him, what will the rest of the realm think?\n\nIs my father losing his grasp on the throne? Is he even fit to rule any longer? If not, then it would fall to me to sit the Iron Throne in his stead. I fear [tywin.GetTitledFirstName] needs to have his power checked, for the sake of the crown. Removing him as Hand would mean an end to the deal, and open war. A hard choice, but could it be the right one?]
 agot_scenario_dd.0003.desc:0 "The Hand of the King has openly defied my father in his demands to break the agreement between the Crown and [denys.GetTitledFirstName]. I wish I was surprised, but the rift between them has been growing wider with each passing day. Still, this is dire news for the king, even if it means his freedom. With his Hand acting so brazenly against him, what will the rest of the realm think?\n\nIs my father losing his grasp on the throne? Is he even fit to rule any longer? If not, then it would fall to me to sit the Iron Throne in his stead. I fear [tywin.GetTitledFirstName] needs to have his power checked, for the sake of the crown. Removing him as Hand would mean an end to the deal, and open war. A hard choice, but could it be the right one?"
