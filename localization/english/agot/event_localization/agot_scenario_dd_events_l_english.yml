### TODO NOT-IN-ST: agot_scenario_dd.1000.desc.rhaegar [AGOT: My council has come to me with grave news: My father, [aerys.GetTitledFirstNameRegnal], has been taken prisoner by [denys.GetTitledFirstName]!\n\nIn a foolhardy attempt to save his port from its inevitable decline, the Lord of Duskendale requested a charter of greater autonomy from the crown. [tywin.GetTitledFirstName], the Hand of the King, refused him. But the fool ceased paying his taxes, then invited the king directly to [duskendale.GetNameNoTier] to hear his petition.\n\nMy father, hoping to prove himself more than a figurehead, agreed to meet him without the Hand. Now he is a hostage, and [denys.GetTitledFirstNameNoTooltip] has sworn to kill him should we storm the walls.\n\nMy father's life is now held by the Hand, and Seven Kingdoms wait to see how he will act.]
 agot_scenario_dd.1000.desc.rhaegar:0 "My council has come to me with grave news: My father, [aerys.GetTitledFirstNameRegnal], has been taken prisoner by [denys.GetTitledFirstName]!\n\nIn a foolhardy attempt to save his port from its inevitable decline, the Lord of Duskendale requested a charter of greater autonomy from the crown. [tywin.GetTitledFirstName], the Hand of the King, refused him. But the fool ceased paying his taxes, then invited the king directly to [duskendale.GetNameNoTier] to hear his petition.\n\nMy father, hoping to prove himself more than a figurehead, agreed to meet him without the Hand. Now he is a hostage, and [denys.GetTitledFirstNameNoTooltip] has sworn to kill him should we storm the walls.\n\nMy father's life is now held by the Hand, and Seven Kingdoms wait to see how he will act."
### TODO NOT-IN-ST: agot_scenario_dd.1000.desc.aerys [AGOT: When I came to [duskendale.GetNameNoTier], I had hoped to prove my strength. [denys.GetTitledFirstName] asked the crown for a royal charter, in some vain hope of saving his failing port, but [tywin.GetFirstName] swiftly rejected the petition — once again acting as though #italic he#! were the king, and I merely a fool on an uncomfortable chair.\n\nAt first I'd ignored when the Rat Lord of Duskendale ceased paying his taxes, asking for me to meet him to hear his petition myself. But then the Hand spoke against it. By what right does the #italic lion#! order the #italic dragon?!#! So, I rode to Duskendale, and now instead of a great hall I am in a cell. I can feel it growing smaller, the footsteps grow louder, the beating in my chest grows faster. I cannot tell if my mind is failing, or my heart.\n\n#bold Let me out!#!]
 agot_scenario_dd.1000.desc.aerys:0 "When I came to [duskendale.GetNameNoTier], I had hoped to prove my strength. [denys.GetTitledFirstName] asked the crown for a royal charter, in some vain hope of saving his failing port, but [tywin.GetFirstName] swiftly rejected the petition — once again acting as though #italic he#! were the king, and I merely a fool on an uncomfortable chair.\n\nAt first I'd ignored when the Rat Lord of Duskendale ceased paying his taxes, asking for me to meet him to hear his petition myself. But then the Hand spoke against it. By what right does the #italic lion#! order the #italic dragon?!#! So, I rode to Duskendale, and now instead of a great hall I am in a cell. I can feel it growing smaller, the footsteps grow louder, the beating in my chest grows faster. I cannot tell if my mind is failing, or my heart.\n\n#bold Let me out!#!"
### TODO NOT-IN-ST: agot_scenario_dd.1000.desc.denys [AGOT: My ploy has worked! [aerys.GetTitledFirstNameRegnal] sits alone in a cell, huddled in a corner like a captured dog. I hear them now, calling me traitor across the realm. Is it treason to ask for that which your House has earned a hundred times and more?\n\nA charter to match the Dornish, that was my only request. With a charter I could save my port, with a charter I could bring my House to its former strength. Yet even after centuries of service, [tywin.GetTitledFirstNamePossessive] rejection was swift. I was left at a fork in the road. I could let my House fall to ruin, or I could find a weakness in the lion's armor. I chose the latter.\n\nI knew [aerys.GetFirstNameNoTooltip] would ride to meet me when goaded; the man is a fool. He delivered himself to me like a freshly caught meal. Now I must extract what I need from him.\n\nI hope his #italic will#! is as weak as his #italic mind!#!]
 agot_scenario_dd.1000.desc.denys:0 "My ploy has worked! [aerys.GetTitledFirstNameRegnal] sits alone in a cell, huddled in a corner like a captured dog. I hear them now, calling me traitor across the realm. Is it treason to ask for that which your House has earned a hundred times and more?\n\nA charter to match the Dornish, that was my only request. With a charter I could save my port, with a charter I could bring my House to its former strength. Yet even after centuries of service, [tywin.GetTitledFirstNamePossessive] rejection was swift. I was left at a fork in the road. I could let my House fall to ruin, or I could find a weakness in the lion's armor. I chose the latter.\n\nI knew [aerys.GetFirstNameNoTooltip] would ride to meet me when goaded; the man is a fool. He delivered himself to me like a freshly caught meal. Now I must extract what I need from him.\n\nI hope his #italic will#! is as weak as his #italic mind!#!"
