 agot_scenario_dd.0315.desc.start:0 "Babam, rızamı ya da fikrimi soran tek bir kuzgun göndermeden karar vererek, yaklaşan nişanımdan haber gönderdi. Nişanı kabul edip etmeyeceğimi, yoksa babamın isteğine karşı kendi gelinimi mi bulacağımı düşünmeliyim.\n\n"

 agot_scenario_dd.0315.desc.c:0 "Hiçbir şey yapmazsam, [tywin.GetName]'in kızı [bachelorette.GetName] ile nişanlanacağım. Güzelliğini kimse inkâr edemez, Evi Lannister'ın gücünü de; ne var ki gözlerinde, bana yanan bir krallığın hayallerini yaşatan soğuk bir hırs var. Görünüşe bakılırsa kusursuz bir gelecek Kraliçesi, ama bana böyle kuşkular yaşatan biriyle evlenebilir miyim?\n\n"

 agot_scenario_dd.0315.desc.l:0 "Hiçbir şey yapmazsam, Kuzey'in [bachelorette.GetName]'i ile nişanlanacağım. Özgür ruhlu olduğu biliniyor ve güzelliğe dönüşeceğine inanılıyor. Hiçbir Stark, Evi Targaryen'in bir ferdiyle evlenmedi ve Kuzey ile taze bağlar kurmak akıllıca olabilir. Ama genç; yakında evlenmek ve bir varis üretmek konumum için en iyisi olurdu.\n\n"

 agot_scenario_dd.0315.desc.e:0 "Hiçbir şey yapmazsam, güneş yüzlü Dorne'un nahif prensesi [bachelorette.GetName] ile nişanlanacağım. Hanesinin benimkiyle uzun bağları var ve kendileri de güçlüler; ama nahif bir prenses, nahif bir kraliçe eder.\n\n"

 agot_scenario_dd.0315.desc.a:0 "Hiçbir şey yapmazsam, Yıldızdüşüşü'nün menekşe gözlü güzeli [bachelorette.GetName] ile nişanlanacağım. Evi Dayne siyasi açıdan en güçlüsü olmasa da, diyarın en iyi şövalyelerini yetiştiriyorlar ve o herhangi bir kral için uygun bir kraliçe olurdu.\n\n"

 agot_scenario_dd.0315.desc.finish:0 "Peki [bachelorette.GetNameNoTooltip] ile mi evleneyim, yoksa babama karşı gelip kendi seçtiğim biriyle mi?"

 agot_scenario_dd.0315.opt.a:0 "Dişi aslanla evleneceğim."

 agot_scenario_dd.0315.opt.b:0 "Ejderha ile kurt evlenecek."

 agot_scenario_dd.0315.opt.c:0 "Dorne ile bağlarımız her zaman güçlendirilebilir."

 agot_scenario_dd.0315.opt.d:0 "Starfall'ın ışığı Ashara ile evleneceğim."

 agot_scenario_dd.0315.opt.e:0 "Başka birini bulacağım."

 agot_scenario_dd.0315.e.tt:0 "Babana karşı gelecek ve eşi kendi başına arayacaksın"

 agot_scenario_dd.0316.t:0 "İsyankâr Prens"

 agot_scenario_dd.0316.desc:0 "Dragonstone'dan haber geldi; oğlum Rhaegar, [bachelorette.GetName] ile dikkatle müzakere ettiğim nişanını reddetti. Bu, yalnızca nişanlısına ve [bachelorette.GetHerHis] hanesine karşı ağır bir hakaret değil, aynı zamanda kral olarak isteklerime ve irademe açık bir meydan okuma. Zaten onun bana karşı komplo kurduğundan, belki de tahtı gasp etmeyi düşündüğünden şüpheleniyordum; bu felaket meydan okumayla ihanetinin kanıtı daha da arttı.\n\nŞimdi kararıyla yaşamaktan ve gözümü üzerinde tutmaktan başka yapabileceğim pek az şey var..."

 agot_scenario_dd.0316.opt.a:0 "Pekâlâ öyleyse, kendi lanet olası gelinini kendisi seçsin!"

 agot_scenario_dd.0316.a.tt:0 "Oğlun şu an nişanlanmayacak"

