 agot_scenario_dd.0197.b.tt:0 "Duskendale'yi Evi Rykker'e veriyor ve Darklynleri ile Hollardları topraksız ve iddiasız bırakıyorsun."

 agot_scenario_dd.0197.c.tt:0 "Duskendale'den kaçıyorsun ve Evi Darklyn ile Evi Hollard'ın idamını emrediyorsun. Evi Targaryen'e Duskendale bahşedilecek."

