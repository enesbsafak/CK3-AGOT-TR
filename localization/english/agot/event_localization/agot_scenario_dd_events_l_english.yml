 agot_scenario_dd.0201.t:0 "Pek Mütevazı Olmayan Bir Talep"

 agot_scenario_dd.0201.desc.tywin:0 "Savaş bitti; aptal [denys.GetTitledFirstName], küçücük isyanını kaç kişinin destekleyeceğini düşünmeden bize saldırdı. Bu mesele çözüldüğüne göre, [duskendale.GetNameNoTier] hâlâ davama sadık uygun bir sahibe muhtaç.\n\n[tywin.GetTitledFirstName], [chosen_sibling.Custom2('RelationToMeShort', SCOPE.sC('tywin'))] [chosen_sibling.GetTitledFirstName]'e, Darklynlerin istediği fermanla birlikte toprağın verilmesini istiyor.\n\nEl sadık olsa da, ejderha kanı kalın akar. [viserys.GetFirstNameNicknamed]'e kendine ait bir kale vermek istiyorum. Nasıl ilerleyeceğimi düşünmeliyim..."

 agot_scenario_dd.0201.desc.viserys:0 "Savaş bitti; aptal [denys.GetTitledFirstName], küçücük isyanını kaç kişinin destekleyeceğini düşünmeden bize saldırdı. Bu mesele çözüldüğüne göre, [duskendale.GetNameNoTier] hâlâ davama sadık uygun bir sahibe muhtaç.\n\nVefatından önce özel olarak [tywin.GetTitledFirstName], bir akrabasına, Denys'in talep ettiği avantajlarla birlikte toprağın verilmesini istiyordu.\n\nTywin artık itiraz edecek durumda olmadığına göre, kardeşim [viserys.GetFirstNameNicknamed]'e kendine ait bir kale vermeliyim. Onu hükmetmeye hazırlayacağız."

