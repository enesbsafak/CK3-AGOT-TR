 agot_scenario_dd.0300.desc.el:0 "Diyarın iki ucundan iki seçenek öne çıkıyor. Bir yanda tacın Evi Martell ile bağlarını güçlendirecek güneş yüzlü Dorne'un nahif prensesi [elia.GetName]; diğer yanda Evi Stark'tan, Kuzey'in güzel ve iradeli kızı [lyanna.GetFirstName]."

