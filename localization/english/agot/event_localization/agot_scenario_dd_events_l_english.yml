 agot_scenario_dd.0100.e.tt:0 "Kralı kurtardıktan sonra Dragonstone'a dönüyorsun."

 agot_scenario_dd.0111.t:0 "$agot_scenario_dd.0100.t$"

 agot_scenario_dd.0111.desc.tywin:0 "Savaş bitti! [duskendale.GetNameNoTier]'in kapılarını basıp Dun Kalesi'ne hâkim oldum. Adamlara kasabayı yağmalamak için izin verdim — aylardır buradayız, ganimeti hak ediyorlar. Azgın yangınlara ve can çekişen Duskendale sakinlerine bakıyorum, ne israf...\n\nKana bulanmış sokakta çürümeye bırakılmış bir Darklyn askerinin üzerinden atlıyorum; yakındaki bir yangın kılıcının yüzeyinde yansıyor. O an aklıma bir şey geliyor: Evi Darklyn'in Valyria çeliği kılıcı [stalwart.GetName] burada. Uzun zamandır Brightroar'ın yerini alacak bir kılıç istiyorum...\n\nOna sahip olmalıyım!"

 agot_scenario_dd.0111.desc.rhaegar:0 "Savaş bitti, [duskendale.GetNameNoTier]'in kapılarını bastım. Masumların bağışlanması için emir verdim, ama kuşatmada bir orduyu kontrol etmek, gelgitleri kontrol etmek gibidir. Şimdiden öfke bu kadim limanın üzerine taşıyor; masumların çığlıkları, bu savaşın sahip olabileceği her türlü meşruiyeti boğuyor.\n\nAyaklarımın dibinde ölü bir Darklyn askeri yatıyor, cansız gözleri göreceği son gökyüzüne kilitlenmiş; bundan iyi bir şey çıkıp çıkamayacağını merak ediyorum. Adamın kılıcı yüzümü bana yansıtıyor ve Evi Darklyn'in atadan kalma kılıcı [stalwart.GetName]'ı hatırlıyorum.\n\nBelki onu işe koşabilirim."

