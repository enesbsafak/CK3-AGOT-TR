 agot_scenario_dd.0195.t:0 "Cesur Barristan"

 agot_scenario_dd.0195.desc:0 "[duskendale.GetNameNoTier]'e saldırı planlanırken Ser [selmy.GetFirstNameNicknamed] söze karışıyor. Kralı kurtarmak için kendi planı var; o kadar tehlikeli ki imkânsız denilebilir. Ya adının hakkını veriyor, ya da beyaz pelerini giymiş en aptal şövalye.\n\nŞüpheciliğime rağmen, Ser Barristan'ın maharetli bir şövalye ve eşsiz bir savaşçı olduğunu kabul etmeliyim. Böyle bir oyunu başarabilecek bir adam varsa, o da [maelys.GetFirstNameNicknamed]'in katili olurdu. Ama küçük konseye dediğim gibi, kralı kaybetmek, yerine [rhaegar.GetTitledFirstName] gibi daha büyük birini kazanmaktır; ve buna izin vermek için saldırımı ertelesem bile, baştan budalalık.\n\nYine de, bir karar verilmeli."

 agot_scenario_dd.0195.opt.a:0 "Barristan planını deneyebilir, ama uzun beklemeyeceğim."

 agot_scenario_dd.0195.opt.b:0 "Bunun peşinden gitmesine izin veremem."

 agot_scenario_dd.0195.a.tt:0 "Barristan'ın gitmesine izin veriyorsun."

 agot_scenario_dd.0195.b.tt:0 "Barristan'ın ayrılmasını engelliyorsun."

 agot_scenario_dd.0196.t:0 "Bir Kral Muhafızının Zaferi"

 agot_scenario_dd.0196.desc:0 "Ser [selmy.GetFirstNameNicknamed], kralı kurtarma planını açıkladı; niyeti, gece yarısı yalnızca bir hançerle, tek başına kaleye girmek. Kralın Eli [tywin.GetTitledFirstName] bu planı reddetti ve uygulanmasını yasakladı.\n\nVeliaht prens olarak onu geçersiz kılmayı ve [duskendale.GetNameNoTier]'e bir saldırı babamın hayatını tehlikeye atmadan önce Barristan'ı babamı kurtarmaya göndermeyi seçebilirim. Ama bu plan gerçekten uygulanabilir mi? Ne kadar cesur olursa olsun, tek bir adam bunu gerçekten başarabilir mi?"

 agot_scenario_dd.0196.opt.a:0 "Barristan şansını deneyecek."

 agot_scenario_dd.0196.opt.b:0 "Buna izin vermeyeceğim."

 agot_scenario_dd.0196.a.tt:0 "Barristan Selmy'yi, kralı Darklyn zindanından kurtarma göreviyle gönderiyorsun."

 agot_scenario_dd.0196.b.tt:0 "Barristan Selmy'nin hayatını bu şekilde riske atmasına izin vermeyeceksin."

 agot_scenario_dd.0197.t:0 "Beyaz Kurtarıcı"

 agot_scenario_dd.0197.desc:0 "Hücremin köşesinde yatarken bedenimin titrediğini hissediyorum. Sıcaklık yok, güvenlik yok. Yüreğim göğsümde çarpıyor, başım tüy kadar hafif. Karanlıkta şekillerin hareket ettiğini gördüğüme yemin edebilirim; dönüp baktığımda gölgelerde hiçbir şey beklemiyor. Yaklaşan ayak seslerini zar zor fark ediyorum; sanırım gardiyan yine benim için geliyor.\n\nKendi yedi cehennemimin sisleri arasından başımı kaldırıyorum ve tanıdık bir figürün beklediğini görüyorum. Ser [selmy.GetFirstNameNicknamed] hücremin dışında, dilenci kıyafetleri içinde; bir elinde kanlı bir hançer, diğerinde anahtarlar. Ona soru soramadan kapıyı açıyor ve yola koyuluyoruz. Kurtarma bir bulanıklık gibi geçiyor; Kral Muhafızım garnizonu pasta keser gibi biçerken, ne olduğunu anlamadan kasabadan çoktan çıkmışız. Şövalyem ve ben bakılırken, konsey Duskendale ve onu yöneten haneler için planlarımı soruyor.\n\nOnlara ne diyeyim?"

 agot_scenario_dd.0197.opt.a:0 "Evi Rykker toprağı alacak. Hepsini kılıçtan geçir, sonuncusuna kadar."

 agot_scenario_dd.0197.opt.b:0 "Bırakalım bu sefil yeri, toprağı Evi Rykker'e ver."

 agot_scenario_dd.0197.opt.c:0 "Evi Targaryen toprağı alacak. Hepsini kılıçtan geçir, sonuncusuna kadar."

 agot_scenario_dd.0197.opt.d:0 "Bırakalım bu sefil yeri, toprağı Evi Targaryen'e ver."

