### TODO NOT-IN-ST: agot_scenario_dd.0002.desc [AGOT: Just as I prepare to send word to [duskendale.GetNameNoTier], agreeing to give [denys.GetTitledFirstName] his charter, news arrives in the form of a letter sent, the messenger claims, by the king.\n\nI recognize it as being in the king's own hand, but hastily scrawled out and unevenly written. The letter begs us to give in, though it was clearly written under duress. I am certain that this means the king has been tortured, and my own certainty of course wavers.\n\nTo give in to a foe who would torture the king may be more damaging than the king himself dying in an attempted rescue. If one can capture the king with impunity, the crown itself has no cause to be feared. I must reevaluate, and be certain of my choice.]
 agot_scenario_dd.0002.desc:0 "Just as I prepare to send word to [duskendale.GetNameNoTier], agreeing to give [denys.GetTitledFirstName] his charter, news arrives in the form of a letter sent, the messenger claims, by the king.\n\nI recognize it as being in the king's own hand, but hastily scrawled out and unevenly written. The letter begs us to give in, though it was clearly written under duress. I am certain that this means the king has been tortured, and my own certainty of course wavers.\n\nTo give in to a foe who would torture the king may be more damaging than the king himself dying in an attempted rescue. If one can capture the king with impunity, the crown itself has no cause to be feared. I must reevaluate, and be certain of my choice."
