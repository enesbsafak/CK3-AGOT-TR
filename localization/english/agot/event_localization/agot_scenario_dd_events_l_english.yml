### TODO NOT-IN-ST: agot_scenario_dd.0006.desc.voting [AGOT: Today is the day we decide the fate of [aerys.GetTitledFirstNameRegnal].\n\nDeep discussions have been had in the time we've been in King's Landing, and there seems to be agreement among the lords of the realm.\n\nIt is assumed many will vote to depose the king. But is that truly how they feel, or has the long siege — and absent king — forced them to give in to the Crown Prince and Hand of the King?\n\nOnly time will tell.]
 agot_scenario_dd.0006.desc.voting:0 "Today is the day we decide the fate of [aerys.GetTitledFirstNameRegnal].\n\nDeep discussions have been had in the time we've been in King's Landing, and there seems to be agreement among the lords of the realm.\n\nIt is assumed many will vote to depose the king. But is that truly how they feel, or has the long siege — and absent king — forced them to give in to the Crown Prince and Hand of the King?\n\nOnly time will tell."
### TODO NOT-IN-ST: agot_scenario_dd.0006.desc.observing [AGOT: Today is the day we decide the fate of [aerys.GetTitledFirstNameRegnal]. The pieces have been set, and the council has begun. We have made our speeches, and made our intent well known. The king must be deposed.\n\nAs the assembled councilors vote, our lives will be in their hands. For if the king should remain on the Iron Throne, surely he will have our heads for this. We knew this risk, and we have accepted it for the good of the realm.\n\nAs the voting begins, I take a deep breath.]
 agot_scenario_dd.0006.desc.observing:0 "Today is the day we decide the fate of [aerys.GetTitledFirstNameRegnal]. The pieces have been set, and the council has begun. We have made our speeches, and made our intent well known. The king must be deposed.\n\nAs the assembled councilors vote, our lives will be in their hands. For if the king should remain on the Iron Throne, surely he will have our heads for this. We knew this risk, and we have accepted it for the good of the realm.\n\nAs the voting begins, I take a deep breath."
