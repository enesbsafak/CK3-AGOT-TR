 agot_scenario_dd.0100.opt.d:0 "Evi Targaryen toprağı alacak, yeter ki hainler bir daha asla toprak sahibi olmasın."

 agot_scenario_dd.0100.opt.e:0 "Nihayet, babam özgür."

 agot_scenario_dd.0100.a.tt:0 "Kralın Şehri'ne dönüyorsun, ama önce Darklynleri ve Hollardları ortadan kaldırıyorsun. Evi Rykker'e Duskendale bahşedilecek."

 agot_scenario_dd.0100.b.tt:0 "Duskendale'yi Evi Rykker'e veriyor ve Darklynleri ile Hollardları topraksız ve iddiasız bırakıyorsun."

