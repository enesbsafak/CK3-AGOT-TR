 activity_agot_coronation_guest_help_text:0 "Davet edilen [guests|E], sana olan [opinion|E]'ini artırma fırsatına sahip olacak.\nTaç giyme törenleri ayrıca [prestige|E] kazanmak, biraz [stress|E] kaybetmek, [piety|E] kazanmak ve [legitimacy|E]'ini artırmak için bir fırsattır."

