 coronation_pomp_humble:0 "Mütevazı"

 coronation_pomp_humble_desc:0 "$EFFECT_LIST_BULLET$ [GetVassalStance( 'zealot' ).GetName] ve [GetVassalStance( 'parochial' ).GetName] [vassal|E] [opinion|E]'ini $coronation_positive_increase$ edecek.\n$EFFECT_LIST_BULLET$ [GetVassalStance( 'courtly' ).GetName] ve [GetVassalStance( 'glory_hound' ).GetName] [vassal|E] [opinion|E]'ini $coronation_negative_decrease$ edecek.\n$EFFECT_LIST_BULLET$ Tamamlandığında çok daha fazla [piety|E] kazanılır, ancak daha az [legitimacy|E] ve [prestige|E].\n\n#weak Gösteriş yok; yalnızca başına bir tacın yerleştirilmesi. Taç giyme, kişinin egosunu şişirme zamanı değil, tanrılara saygısını kanıtlama zamanıdır.#!"

 coronation_pomp_appropriate:0 "Uygun"

 coronation_pomp_appropriate_desc:0 "$EFFECT_LIST_BULLET$ [GetVassalStance( 'parochial' ).GetName] ve [GetVassalStance( 'zealot' ).GetName] [vassal|E] [opinion|E]'ini $coronation_positive_increase$ edecek.\n$EFFECT_LIST_BULLET$ [GetVassalStance( 'courtly' ).GetName] ve [GetVassalStance( 'glory_hound' ).GetName] [vassal|E] [opinion|E]'ini $coronation_negative_decrease$ edecek.\n$EFFECT_LIST_BULLET$ Tamamlandığında [piety|E], [legitimacy|E] ve [prestige|E] ödülleri etkilenmez\n\n#weak Krallığın büyük ya da küçük tüm hanedanları, başına taç konulana dek seni ancak meşru görür. Ancak o zaman diz çökerler.#!"

 coronation_pomp_impressive:0 "Etkileyici"

 coronation_pomp_impressive_desc:0 "$EFFECT_LIST_BULLET$ [GetVassalStance( 'courtly' ).GetName] ve [GetVassalStance( 'glory_hound' ).GetName] [vassal|E] [opinion|E]'ini $coronation_positive_increase$ edecek.\n$EFFECT_LIST_BULLET$ [GetVassalStance( 'parochial' ).GetName] ve [GetVassalStance( 'zealot' ).GetName] [vassal|E] [opinion|E]'ini $coronation_negative_decrease$ edecek.\n$EFFECT_LIST_BULLET$ Tamamlandığında daha az [piety|E] kazanılır.\n$EFFECT_LIST_BULLET$ Tamamlandığında daha fazla [legitimacy|E] ve [prestige|E] kazanılır.\n\n#weak Düzgün bir taç giyme töreni formalite gerektirir; hüküm sürenlerden beklenen şeyler bunlardır. Krallığın tüm lordlarının yeminlerine sadık kalacağından emin olmak için hiçbir masraftan kaçınmadın.#!"

 coronation_pomp_grandiose:0 "Görkemli"

 coronation_pomp_grandiose_desc:0 "$EFFECT_LIST_BULLET$ [GetVassalStance( 'glory_hound' ).GetName] ve [GetVassalStance( 'courtly' ).GetName] [vassal|E] [opinion|E]'ini $coronation_positive_increase$ edecek.\n$EFFECT_LIST_BULLET$ [GetVassalStance( 'parochial' ).GetName] ve [GetVassalStance( 'zealot' ).GetName] [vassal|E] [opinion|E]'ini $coronation_negative_decrease$ edecek.\n$EFFECT_LIST_BULLET$ Tamamlandığında çok daha az [piety|E] kazanılır.\n$EFFECT_LIST_BULLET$ Tamamlandığında çok daha fazla [legitimacy|E] ve [prestige|E] kazanılır.\n\n#weak Gösteriş yapamıyorsan hüküm sürmenin anlamı ne? Hiçbir şey olmasa bile, bu senin gösterişli kibirin için yaşayan bir anıt olacak.#!"

