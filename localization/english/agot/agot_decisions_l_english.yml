 disavow_incest_decision:0 "Ensesti Reddet"

 disavow_incest_decision_desc:0 "Yüzyıllardır Targaryen kan soyu ensest pratiğiyle saf tutuldu; İnanç, istisnacılık doktrini altında bize özel bir muafiyet tanıyordu. Ama şimdi bu geleneği yeniden gözden geçirmenin zamanı geldi. Eski yollara tutunmaya devam etmek değer mi, yoksa yeni ittifaklar arayıp hanemizin ufkunu genişletmeli miyiz?"

 disavow_incest_decision_tooltip:0 "Hane içinde kardeş evliliği pratiğini yasakla."

 disavow_incest_decision_confirm:0 "Gelenekten kopacağız"

 reinstate_incest_decision:0 "Ensesti Yeniden Yürürlüğe Koy"

 reinstate_incest_decision_desc:0 "Hanimiz bir zamanlar ensest pratiğiyle korunan kan soyunun saflığı sayesinde serpilmişti. Bu geleneğin ötesine geçmiş olsak da, inancın istisnacılık doktrini hâlâ geçerli; bize bu kadim geleneği sürdürme hakkını veriyor. Mirasımızı kucaklayıp bizi bir zamanlar tanımlayan geleneği mi yeniden tesis etmeliyiz?"

 reinstate_incest_decision_tooltip:0 "Hane içinde kardeş evliliği pratiğine izin ver."

 reinstate_incest_decision_confirm:0 "Eski yolları yeniden tesis edeceğiz"

