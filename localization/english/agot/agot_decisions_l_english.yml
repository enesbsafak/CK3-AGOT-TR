 dynamic_bastard_house_revival_decision_westeros_needs_legitimization:0 "[top_liege.GetName], [bastard_house_of.GetName] Hanesi'nin adını, sözünü ve armasını üstlenme dilekçenizi dinleyecek."

 agot_events_generic.0030.t:0 "Seni sefil [ROOT.Char.Custom('GirlBoy')],"

 agot_events_generic.0030.desc_vassal:0 "Seni pislikten çekip çıkardım, istersem geri de atarım! Bu aşağılık dünyada bilgeliğin son sütunu olan #EMP Krallık Şehri'nin#! gerçekten senin olabileceğini #EMP gerçekten#! sanmadın, değil mi! En küçük parmağın bile onun parıltılı tuğlalarına basmaya layık değil! Geri ver, yoksa Karakova senin boğulma çukurun olur — gerekirse seni oraya kendim fırlatırım."

 agot_events_generic.0030.a:0 "Ben sadece onu senin için gözetiyordum!"

 agot_events_generic.0030.b:0 "Umarım sızlanan kıçın Demir Taht'ta kesilir."

 agot_buy_knighthood_decision:0 "Şövalyelik Satın Al"

 agot_buy_knighthood_decision_desc:0 "Toplumsal baskı şövalyeliğin satışını ve satın alınmasını yasaklasa da, doğru fiyata şövalyelik satmaya istekli yakınlar her zaman olacaktır. Önemsiz koşullar yüzünden, hayatımın bu noktasında şövalye yapılmadım. Nüfuzumu ve servetimi kullanarak bunu kesinlikle düzeltebilirim."

 agot_buy_knighthood_decision_desc_outsider:0 "Şövalyelik geçmişimde pek değer görmese, hatta pek anlamlı olmasa da, şövalye olmak yine de ilgimi çekiyor. Bir #italic yabancıyı#! şövalye yapmaya istekli birini bulmak zor olacak, ama doğru fiyata istekli birini bulabileceğime eminim."

 agot_buy_knighthood_decision_confirm:0 "Satın al!"

 agot_buy_knighthood_decision_tooltip:0 "Şövalyelik satın alacaksınız"

 agot_decision_bought_knighthood_effect_tt:0 "#V Yakın aileniz#!, şövalye ilan edilmeniz konusunda bilgilendirilecek."

 reforge_valyrian_steel_decision:0 "Valyria Çeliği Kılıcı Yeniden Döv"

 reforge_valyrian_steel_decision_desc:0 "Kendi tasarımım olan yeni bir kılıç dövmek istiyorum"

 reforge_valyrian_steel_decision.tt:0 "Elindeki Valyria çeliği kılıcı yeniden dövme sürecine başlayacaksın"

 reforge_valyrian_steel_decision_confirm:0 "Demirciyi çağır!"

 reforge_valyrian_steel_decision_tooltip:0 "Elindeki Valyria çeliği kılıcı yeniden dövme sürecine başlayacaksın"

