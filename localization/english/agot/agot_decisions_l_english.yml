 claim_dawn_unworthy_decision_desc:0 "Kılıç hakça benimdir, "layık" olsam da olmasam da onu kendime ait olarak sahipleniyorum."

 claim_dawn_unworthy_decision_tooltip:0 "Efsanevi kılıç Şafak'ı kendine mal et"

