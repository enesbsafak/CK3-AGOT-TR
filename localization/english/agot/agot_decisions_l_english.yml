 agot_minor_decisions_events.0005.desc:0 "#italic [ROOT.Char.GetFullNameNicknamedNoTooltip] tamamen deliliğe gömüldü...#!\n\nSarayın dört bir yanındaki fısıltıları duyabiliyorum. Saray mensuplarım beni görünüşümde olmasa da davranışlarımda bir baş belası sanıyor. Beni böyle görüyorlarsa, belki de görünüşü korumaktan vazgeçmeliyim."

