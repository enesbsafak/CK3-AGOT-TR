 agot_commission_special_artifact_decision_desc:0 "Bir hükümdar, yaptıkları kadar taşıdıklarıyla da yargılanır. Taç ya da zırh, böyle bir parça hem sembol hem beyan işlevi görür. Makamıma layık yeni bir eser yaptıracağım."

