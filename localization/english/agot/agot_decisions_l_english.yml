 reforge_valyrian_steel_additional_requirements:0 "$court_smith_court_positionunuzun ya Valyria çeliği dövme bilgisine ya da [GetFaithDoctrine('tenet_blood_magic_steel').GetBaseName] ilkesine sahip bir inanca ihtiyacı var"

