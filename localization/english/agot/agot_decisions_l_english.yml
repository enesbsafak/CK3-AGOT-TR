 claim_dawn_worthy_decision:0 "Şafak'ı Talep Et"

 claim_dawn_worthy_decision_desc:0 "Layık olduğuma inanıyorum."

 claim_dawn_worthy_decision_tooltip:0 "Efsanevi kılıç Şafak'ı kendine mal et"

 claim_dawn_worthy_decision_confirm:0 "Layığım!"

 recover_brightroar_decision:0 "Brightroar'ı Geri Al"

 recover_brightroar_decision_desc:0 "Lannister Hanedanı'nın atalarından kalma kılıcı Parlak Kükreme'yi aramak için Eski Valyria'nın tehlikeli kalıntılarına girmesi için cesur bir kâşife fon sağlayacağım."

 recover_brightroar_decision_tooltip:0 "Parlak Kükreme'yi geri almak için bir sefer planla"

 recover_brightroar_decision_confirm:0 "Bir gemi hazırla"

 decision_reforge_longthorn:0 "Longthorn'u Onar"

 decision_reforge_longthorn_desc:0 "Uzundiken'in kılıcı yaşıyor, zira Valyria çeliği ejderha ateşine bile dayanır. Ancak hanemiz, Yüksek Bahçe geri alınıp Gardener Hanedanı şana kavuşturulana dek yeniden dövülmeyeceğine dair ağır bir yemin etti."

 decision_reforge_longthorn_tooltip:0 "Uzundiken'in kılıcını kullanılabilir bir kılıca yeniden dövdüreceksiniz"

 decision_reforge_longthorn_confirm:0 "Demircileri çağır!"

 decision_reforge_longthorn_alt:0 "Longthorn'u Onar"

 decision_reforge_longthorn_desc_alt:0 "Uzundiken'in kılıcı yaşıyor, zira Valyria çeliği ejderha ateşine bile dayanır. Sonunda eski şanına kavuşturulacak; kadim ihtişamı yeniden geri gelecek."

 retrieve_hidden_artifact_decision:0 "Gizli Eseri Geri Al"

 retrieve_hidden_artifact_decision_desc:0 "Dünyanın haberi olmadan, [ROOT.Char.Custom('HiddenArtifact')] benim elimde. Onu gizli tutmak için artık bir neden görmüyorum. Onu açığa çıkarmanın zamanı geldi."

 retrieve_hidden_artifact_decision_tooltip:0 "Şu anda gizlenmiş olan bir eseri geri al"

 retrieve_hidden_artifact_decision_confirm:0 "Herkes bilsin!"

 retrieve_stored_artifacts_decision:0 "Saklanmış Eserleri Geri Al"

 retrieve_stored_artifacts_decision_desc:0 "Targaryen Hanedanı'nın pek çok yadigârı, Kızıl Kale'nin altındaki mahzenlerde unutulmuş halde duruyor. Taçlar ve kadim ejderha kafatasları sessizlik içinde toz biriktiriyor. Onların gün yüzüne çıkarılıp tarihteki hak ettikleri yere kavuşturulma zamanı geldi."

 retrieve_stored_artifacts_decision_tooltip:0 "Kızıl Kale'nin altında saklanan Targaryen eserlerini geri al"

 retrieve_stored_artifacts_decision_confirm:0 "Hizmetkârları aşağı gönder"

