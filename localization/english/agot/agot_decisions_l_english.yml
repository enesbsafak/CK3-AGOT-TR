 weirwood_meditate_decision:0 "Bir Weirwood'da Meditasyon Yap"

 weirwood_meditate_decision_desc:0 "İnançtan bağımsız olarak, dünyada birkaç yer bir tanrı koruluğunun kalbine huzur ve uhrevi yalnızlık açısından yaklaşabilir. Belki de rehberlik için kalp ağacını ziyaret etmeliyim."

 weirwood_meditate_decision_tooltip:0 "Yenilenme şansı için tanrı koruluğunu ziyaret edeceksiniz."

 weirwood_meditate_decision_confirm:0 "Ağaçlar beni çağırıyor"

 high_heart_the_pact_decision:0 "Yüksek Kalp'in Weirwoodlarını Yeniden Yetiştir"

 high_heart_the_pact_decision_desc:0 "Çok uzun süredir Yüksek Kalp, Andalların ve yeni tanrılarının bir anıtı olarak duruyor. Tepenin bir kez daha weirwoodlarla taçlanmasının zamanı geldi — oymalı yüzleri ziyaret etmek isteyen herkesi izliyor."

 high_heart_the_pact_decision_effect:0 "Koruğu yeniden dikeceksiniz; sonunda [GetBuilding('agot_high_heart_01').GetName]'e dönüşecek"

 high_heart_the_pact_decision_tooltip:0 "Yüksek Kalp'in weirwoodlarını yeniden yetiştireceksiniz"

 high_heart_the_pact_decision_confirm:0 "Eski Tanrılar fısıldıyor!"

 high_heart_the_seven_decision:0 "Yüksek Kalp'in Weirwoodlarını Kes"

 high_heart_the_seven_decision_desc:0 "Erreg'in iyi işi boşa çıkarıldı. Şimdi Yüksek Kalp'i bir kez daha şeytan ağaçlarından temizlemeliyiz."

 high_heart_the_seven_decision_tooltip:0 "Yüksek Kalp'in weirwoodlarını keseceksiniz"

 high_heart_the_seven_decision_confirm:0 "Yediler'in emrettiği gibi!"

 evil_goose_decision:0 "Ölü Kaz Ağacını Kes"

 evil_goose_decision_desc:0 "Cargyll Hanedanı, Asık Suratlı Ağacı keserek büyük kazın intikamını alacak."

 evil_goose_decision_tooltip:0 "Asık Suratlı Ağacı keseceksiniz"

 evil_goose_decision_confirm:0 "Büyük kaz için!"

 house_revival_tooltip:0 "Şiddet ya da kader yüzünden bu Hane'nin soyu tükenmiştir; ancak ünlü tarihi sayesinde yeniden canlandırılabilir."

 darklyn_revival_decision:0 "Darklyn Hanedanı'nı Canlandır"

 darklyn_revival_desc:0 "Yüz Krallık Çağı'nda, Duskendale'li Darklyn Hanedanı, Karakova Çağlayanı'nın ağzına sahip çıkarak kral olarak hüküm sürdü. Son Lord Darklyn, kralını esir aldığında makamını, topraklarını ve hayatını kaybetti. İsyanının bedeli ailesinin sonu oldu. Belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 darklyn_revival_decision_confirm:0 "Alacakaranlığın Loş Işığı Altında"

 reyne_revival_decision:0 "Reyne Hanedanı'nı Canlandır"

 reyne_revival_desc:0 "Reyne Hanedanı soyunu Kahramanlar Çağı'ndaki İlk İnsanlara dayandırır; Castamere makamlarını zengin bir maden sistemi çevresinde kurarak Batı Diyarları'nda kendilerine büyük bir güç sağladılar. Reyne Hanedanı, Lord Roger Reyne borçlarını ödemeyi reddedip Lannister Hanedanı'na isyan ettiğinde çöküşüyle yüzleşti. İsyanları, hanedanlarının soyunun tükenmesiyle hızla son buldu. Belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 reyne_revival_decision_confirm:0 "Uzun ve Keskin"

 gardener_revival_decision:0 "Gardener Hanedanı'nı Canlandır"

 gardener_revival_desc:0 "Pek çok hanenin efsanevi Garth Yeşil El'den türediği söylenir; hiçbiri Gardener Hanedanı kadar prestijli değildir. Son Gardener Kralı Mern IX ve akrabaları, 1BC'de Ateş Tarlası'nda diri diri yakıldı; Gardener hanedanı böylece sona erdi. Toprakları, sadakatle kâhyalık yapmış Tyrell Hanedanı'na verildi. Belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 gardener_revival_decision_confirm:0 "En Uzun Ağaç"

 durrandon_revival_decision:0 "Durrandon Hanedanı'nı Canlandır"

 durrandon_revival_desc:0 "Kahramanlar Çağı'nda efsanevi Kral Durran Tanrı Kederi, Fırtına Ucu kalesini yükseltti ve Fırtına Toprakları Krallığı'nı kurarak Durrandon Hanedanı'nın hükümdarlığını pekiştirdi. Yüzyıllar sonra soyundan gelen Kibirli Argilac, krallığını ve hayatını kaybetti — toprakları ve kızı Lord Orys Baratheon'a verildi; Durrandon hanedanı sona erdi. Belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 durrandon_revival_decision_confirm:0 "Gazap Bizimdir"

 stark_revival_decision:0 "Stark Hanedanı'nı Canlandır"

 stark_revival_desc:0 "Kader ve talihsizlik yüzünden, Kurucu Bran'in kadim Hanesi'nin soyu tükenerek Starkların Kışyarı'nda binlerce yıl süren hükümdarlığı sona erdi. Kışyarı'nı geri aldım — belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır... Zira Kışyarı'nda her zaman bir Stark olmalıdır."

 stark_revival_decision_confirm:0 "Kış Geliyor"

 arryn_revival_decision:0 "Arryn Hanedanı'nı Canlandır"

 arryn_revival_desc:0 "Kader ve talihsizlik yüzünden, Şahin Şövalye'nin kadim Hanesi'nin soyu tükenerek Arrynlerin Vadi'de binlerce yıl süren hükümdarlığı sona erdi. Kartal Yuvası'nı geri aldım — belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 arryn_revival_decision_confirm:0 "Onur Kadar Yüce"

 lannister_revival_decision:0 "Lannister Hanedanı'nı Canlandır"

 lannister_revival_desc:0 "Kader ve talihsizlik yüzünden, Kurnaz Lann'in kadim Hanesi'nin soyu tükenerek binlerce yıl süren Lannister hükümdarlığı sona erdi. Casterly Kayası'nı geri aldım — belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 lannister_revival_decision_confirm:0 "Kükrememi Duy!"

 hoare_revival_decision:0 "Hoare Hanedanı'nı Canlandır"

 hoare_revival_desc:0 "Binlerce yıldır ailem Demir Adalar'ı yönetti; Batı Diyarları'nın tüm kıyılarında demir ve korku biçti. Bizi alçaltan yalnızca ejderha ateşi oldu — ama hâlâ ayaktayız. Atalarımızın yurdu Orkmont'u geri aldım. Belki de Zalim Qhored'in [dynasty|E]'ini başına geçeceğim kişiyle yeniden kurmanın zamanıdır."

 hoare_revival_decision_confirm:0 "Kana Bulanmış"

 justman_revival_decision:0 "Justman Hanedanı'nı Canlandır"

 justman_revival_desc:0 "Çok uzun zaman önce, Blackwood ve Bracken kanının çocuğu Benedict Rivers, Mızrak'ı kendi hükümdarlığı altında birleştirdi ve Justman Hanedanı'nı kurdu. Demir Doğanlar soylarını acımasızca sona erdirene kadar neredeyse üç yüz yıl Nehir Toprakları'nı yönettiler. Ben de bu iki soyun bir çocuğuyum — belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 justman_revival_decision_confirm:0 "Kazanılan Bir Ad"

 saerygan_revival_decision:0 "Saerygan Hanedanı'nı Canlandır"

 saerygan_revival_desc:0 "Kader ve talihsizlik yüzünden, kadim Saerygan Hanesi'nin soyu tükenerek, Valyria Serbest Diyarı'nı zirvesinde gören ve Valyria Felaketi'nden sağ çıkan bir hanenin yüzlerce yıllık hükümdarlığı sona erdi. Belki de bu bir zamanlar büyük olan [dynasty|E]'i başına geçeceğim kişiyle geri getirmenin zamanıdır."

 saerygan_revival_decision_confirm:0 "Kazanılan Bir Ad"

 dynamic_bastard_house_revival_decision:0 "[ROOT.Char.GetHouse.MakeScope.Var('bastard_house_of').House.GetName] Hanesi'ni Canlandır"

 dynamic_bastard_house_revival_decision_desc:0 "[ROOT.Char.GetHouse.MakeScope.Var('bastard_house_of').House.GetName] Hanesi'nin soyu tükenmiştir. Bu Hanenin doğrudan soyundan gelen biri olarak mirasını ve adını geri alabilirim."

 dynamic_bastard_house_revival_decision_confirm:0 "[ROOT.Char.GetHouse.MakeScope.Var('bastard_house_of').House.GetName] Hanesi, yeniden doğacak!"

