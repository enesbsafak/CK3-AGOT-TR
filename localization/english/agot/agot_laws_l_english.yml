 pirate_tax_rate_01:0 "Dostça"

 pirate_tax_rate_01_effects:0 "$EFFECT_LIST_BULLET$[GetCouncilTaskType('task_find_secrets').GetName|V] [councillor_task|E]: bir [secret|E] öğrenme şansında #P +%10#! ek artış\n#underline #underline [agot_landless_pirate_domiciles|e] şunları ödeyecek#!:#!\n$EFFECT_LIST_BULLET$ [GetDomicileBuilding('agot_pirate_ship_main_01').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_02').GetName]: 5 @gold_icon! yanaşma ücreti ve 20 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_03').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_04').GetName]: 10 @gold_icon! yanaşma ücreti ve 40 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_05').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_06').GetName]: 15 @gold_icon! yanaşma ücreti ve 60 @gold_icon! yıllık ücret."

 pirate_tax_rate_02:0 "Standart"

 pirate_tax_rate_02_effects:0 "#underline [agot_landless_pirate_domiciles|e] şunları ödeyecek#!:\n$EFFECT_LIST_BULLET$ [GetDomicileBuilding('agot_pirate_ship_main_01').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_02').GetName]: 7.5 @gold_icon! yanaşma ücreti ve 30 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_03').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_04').GetName]: 12.5 @gold_icon! yanaşma ücreti ve 50 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_05').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_06').GetName]: 17.5 @gold_icon! yanaşma ücreti ve 70 @gold_icon! yıllık ücret."

 pirate_tax_rate_03:0 "Yüksek"

 pirate_tax_rate_03_effects:0 "$EFFECT_LIST_BULLET$[agot_landless_pirate_domiciles|e], [GetScheme('agot_raid_pirate_domicile').GetTypeName] [schemes|E]'lerine karşı daha fazla koruma alacak\n#underline [agot_landless_pirate_domiciles|e] şunları ödeyecek#!:\n$EFFECT_LIST_BULLET$ [GetDomicileBuilding('agot_pirate_ship_main_01').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_02').GetName]: 10 @gold_icon! yanaşma ücreti ve 40 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_03').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_04').GetName]: 15 @gold_icon! yanaşma ücreti ve 60 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_05').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_06').GetName]: 20 @gold_icon! yanaşma ücreti ve 80 @gold_icon! yıllık ücret."

 pirate_tax_rate_04:0 "Haraççı"

 pirate_tax_rate_04_effects:0 "$EFFECT_LIST_BULLET$[agot_landless_pirate_domiciles|e], [GetScheme('agot_raid_pirate_domicile').GetTypeName] [schemes|E] başlatmaya daha az eğilimli olacak\n#underline [agot_landless_pirate_domiciles|e] şunları ödeyecek#!:\n$EFFECT_LIST_BULLET$ [GetDomicileBuilding('agot_pirate_ship_main_01').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_02').GetName]: 12.5 @gold_icon! yanaşma ücreti ve 50 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_03').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_04').GetName]: 17.5 @gold_icon! yanaşma ücreti ve 70 @gold_icon! yıllık ücret.\n$EFFECT_LIST_BULLET$[GetDomicileBuilding('agot_pirate_ship_main_05').GetName] & [GetDomicileBuilding('agot_pirate_ship_main_06').GetName]: 22.5 @gold_icon! yanaşma ücreti ve 90 @gold_icon! yıllık ücret."

