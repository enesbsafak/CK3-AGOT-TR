l_english:

 agot_battlefield_duel.0002.t:0 "Yenilmiş Düşman"

 agot_battlefield_duel.0002.desc:0 "[sc_loser.GetTitledFirstName]'in kırık bedeninin başında duruyorum. Kırık, ama ölü değil. Çevremizde savaş sürüyor ve kaybedecek zaman yok. Ya [sc_loser.GetHerHim]'i öldürmeli, ya da [sc_loser.GetHerHim]'i kendime esir almalıyım."

 agot_battlefield_duel.0002.a:0 "Askerler! [sc_loser.GetHerHim]'i derhal zincire vurun!"

 agot_battlefield_duel.0002.b:0 "Esirler o kadar zahmetli ki. [sc_loser.GetHerHim]'le işi bitirmek en iyisi."

 agot_battlefield_duel.0003.t:0 "Yenilmiş Düşman"

 agot_battlefield_duel.0003.desc:0 "[sc_loser.GetTitledFirstName]'in, kendi elimle yere serdiğim kırık bedeninin başında duruyorum. Yalnızca bir savaşçı olsa da, böyle zaferler savaşın kaderini değiştirebilir."

 agot_battlefield_duel.0003.a:0 "Silahıma bir çentik daha."

 agot_battlefield_duel.0004.t:0 "Savaşta Yenildi"

 agot_battlefield_duel.0004.desc:0 "[sc_victor.GetTitledFirstName]'in ayakları dibinde paramparça yatıyorum, dilimde kan tadı. Kırık, ama hâlâ hayatta ve düşmanımın merhametine kalmış durumdayım.\n\n[sc_victor.GetTitledFirstNameNoTooltip] [sc_victor.GetHerHis] askerlerine sesleniyor.\n\n"[sc_loser.GetTitledFirstNameNoTooltip]'i derhal zincire vurun!""

 agot_battlefield_duel.0004.a:0 "Demek esir olacağım..."

 agot_battlefield_duel.0005.t:0 "Savaşta Yenilgi"

 agot_battlefield_duel.0005.desc:0 "[sc_victor.GetTitledFirstName]'in ayakları dibinde paramparça yatıyorum, dilimde kan tadı. Kırık, ama hâlâ hayatta ve düşmanımın merhametine kalmış durumdayım.\n\n[sc_victor.GetTitledFirstNameNoTooltip], göreceğim son şey olacak gibi görünen darbe için [sc_victor.GetHerHis] silahını kaldırıyor."

 agot_battlefield_duel.0005.a:0 "Bu son."
