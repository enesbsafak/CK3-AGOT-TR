 agot_dragonpit_amenities_default_desc:0 "[dragonpits|E] için ayrılan, yalnızca en temel zorunluluklara ayrılmış mutlak asgari finansman."

 agot_dragonpit_amenities_small_desc:0 "[dragonpit|E] ve [dragonkeepers|E]'ine, basit onarımlar ve bakım için yeterli olacak temel düzeyde kaynak ayrılır."

 agot_dragonpit_amenities_middling_desc:0 "[dragonpit|E] ve [dragonkeepers|E]'ine orta düzeyde kaynak ayrılır; barındırılan ejderhalar için yeterli yem ve uyarım sağlanır."

 agot_dragonpit_amenities_spacious_desc:0 "Kadim Valyria'nın en seçkin ejderha kuleleriyle kıyaslanabilir olan bu [dragonpit|E], iyi finanse edilip bakımı yapılır; hareketliliğin uğultusu saray için bir görüntü ve diyar için bir gurur kaynağıdır."

 agot_dragonpit_amenities_grand_desc:0 "[dragonpit|E] artık ejderhalar için yalnızca bir barınma yeri olmaktan çok daha fazlasını işlev görüyor. İçerideki canavarların yaşamını desteklemek için ejderha bilgisi üzerine koca kütüphaneler ve geniş bir lojistik ağı faaliyet gösteriyor."

 agot_dragonpit_amenities_default_owner:0 "Baş Ejderha Bakıcıları genellikle berbat [aptitude|e] ile gelir."

