 building_type_agot_great_fleet_01:0 "Filo Limanı"

 building_type_agot_great_fleet_01_desc:0 "Bu liman, yakın denizler ve kıyılar üzerinde donanma gücü gösteren büyük bir filoyu barındırır."

 building_agot_great_fleet_01:0 "Filo Limanı"

 building_agot_great_fleet_01_desc:0 "Bu liman, yakın denizler ve kıyılar üzerinde donanma gücü gösteren büyük bir filoyu barındırır. Böyle bir inşaat ancak bir [great_project|E] ile gerçekleştirilebilir."

 building_agot_great_fleet_02:0 "Geniş Filo Limanı"

 building_agot_great_fleet_02_desc:0 "Bu liman, çok daha büyük bir filoyu desteklemek üzere genişletilmiş; erişimini uzatıyor ve yakın denizler ile kıyılar üzerinde hem donanma gücü hem de artan servet gösteriyor. Böyle bir inşaat ancak bir [great_project|E] ile gerçekleştirilebilir."

 building_agot_great_fleet_03:0 "Müthiş Silahlanma"

 building_agot_great_fleet_03_desc:0 "Bu liman artık devasa bir filoyu barındırarak onu, yakın denizler ve kıyılara hükmeden, savaş ve ticaretin belirleyici bir aracına dönüştürüyor. Düşman donanmalarını ezebilecek ve iradesini dalgalara dayatabilecek müthiş bir askerî güç olarak duruyor. Böyle bir inşaat ancak bir [great_project|E] ile gerçekleştirilebilir."
