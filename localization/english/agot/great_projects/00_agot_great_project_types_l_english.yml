l_english:

 great_project_type_construct_great_fleet_01:0 "Büyük Bir Filo İnşa Et"

 great_project_type_construct_great_fleet_01_desc:0 "[domain|E]'imin kıyıları korunmalı; denizlerde güvenliği sağlamak ve güç gösterisi yapmak için büyük bir filo inşa etmekten daha iyi bir yol var mı?"

 great_project_type_construct_great_fleet_01_coastal_barony:0 "Kıyıda bir baronluk olmalı"

 great_project_type_construct_great_fleet_02:0 "Büyük Filoyu Genişlet"

 great_project_type_construct_great_fleet_02_desc:0 "[domain|E]'i korumak için büyük bir filo geliştirdikten sonra, filonun büyümeye yeri olduğunu fark ettik. Servetimizi ve gücümüzü göstermek için onu daha da genişletmekten daha iyi bir yol var mı?"

 great_project_type_construct_great_fleet_02_coastal_county:0 "Kıyıda bir kontluk olmalı ve $building_agot_great_fleet_01$'e sahip olmalı"

 great_project_type_construct_great_fleet_03:0 "Filo Silahlanması Kur"

 great_project_type_construct_great_fleet_03_desc:0 "Büyük filo genişletildiğine göre artık [domain|E]'imde bir gelişme feneri olarak duruyor. Ancak böyle bir refah korunmalı. Diyarımın sularını gerektiği gibi savunmak için büyük bir silahlanma kurmalıyız!"

 great_project_type_construct_great_fleet_03_coastal_county:0 "Kıyıda bir kontluk olmalı ve $building_agot_great_fleet_02$'e sahip olmalı"

 great_project_type_construct_great_fleet_01_contribution_materials:0 "Malzemeler"

 great_project_type_construct_great_fleet_01_contribution_materials_desc:0 "Hiçbir şey yoktan inşa edilemez. [great_project|E]'e filo üzerindeki çalışmayı tamamlamak için gereken tüm malzemeleri sağlayacağız."

 great_project_type_construct_great_fleet_01_contribution_workforce:0 "İş Gücü"

 great_project_type_construct_great_fleet_01_contribution_workforce_desc:0 "Gemiler kendilerini inşa etmez! Bu büyük girişimi tamamlamak için gereken insan gücünü [great_project|E]'e sağlayacağız."

 great_project_type_construct_great_fleet_01_contribution_engineers:0 "Donanma Mühendisleri"

 great_project_type_construct_great_fleet_01_contribution_engineers_desc:0 "Usta gemi yapımcıları ve donanma mühendisleri, uzmanlıklarını [great_project|E]'e aktararak filonun inşasını iyileştirecek."

 great_project_type_construct_great_fleet_01_contribution_military_wharf:0 "Askeri Rıhtım"

 great_project_type_construct_great_fleet_01_contribution_military_wharf_desc:0 "[great_project|E]'e özel bir liman ve kuru havuz eklemek, filonun dayanıklılığını ve ömrünü artıracaktır."

 great_project_type_construct_great_fleet_01_contribution_merchant_quays:0 "Tüccar İskeleleri"

 great_project_type_construct_great_fleet_01_contribution_merchant_quays_desc:0 "[great_project|E]'e özel tüccar iskeleleri eklemek, filo limanından geçen ticaret ve geliri artıracaktır."

