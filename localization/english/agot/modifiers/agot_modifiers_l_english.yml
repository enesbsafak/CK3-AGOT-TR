 agot_true_knight:0 "Diyarın Gerçek Şövalyesi"

 agot_true_knight_desc:0 "Bu karakter, unvanlarına layık olduğunu kanıtladı"

 agot_won_finger_dance:0 "Parmak Dansını Kazandı"

 agot_won_finger_dance_desc:0 "Bu karakter, Demirdoğumlulara karşı bir parmak dansında kendini kanıtladı"

 agot_won_tavern_brawl:0 "Meyhane Kavgasını Kazandı"

 agot_won_tavern_brawl_desc:0 "Bu karakter yakın zamanda bir meyhane kavgasında galip geldi"

 agot_hired_outlaw_band:0 "Paralı Asker Çetesi Tuttu"

 agot_hired_outlaw_band_desc: "Bu karakter, sancağı altında kanun kaçakları istihdam ediyor."

 agot_rumors_of_dragons:0 "Ejderha Söylentileri"

 agot_rumors_of_dragons_desc:0 "Bu ilçe, yakınlardaki bir ejderha söylentilerinden tedirgin; halk daha uysal ama daha az üretken oluyor."

 agot_invite_scholars:0 "Çok Sayıda Âlim Davet Etti"

 agot_invite_scholars_desc:0 "Bu karakter, varlıklarından bilgi ve bilgelik kazanmayı umarak sarayına pek çok bilgin davet etti."

 agot_discuss_scholars:0 "Artırılmış Bilgi"

 agot_discuss_scholars_desc:0 "Bu karakter bilginlerle tartıştı ve onlardan pek çok bilgi edindi."

 agot_rewarded_builders:0 "İnşaatçıları Ödüllendirdi"

 agot_rewarded_builders_desc:0 "İnşaatçılar çalışmaları için ödüllendirildi"

 agot_harrenhal_health:0 "Dindar Dua"

 agot_harrenhal_health_desc:0 "Tanrılar beni duydu mu?"

 agot_green_man_gold:0 "Yeşil Adam'ın Altını"

 agot_reclaimed_knowledge_modifier:0 "Geri Kazanılan Bilgi"

 agot_reclaimed_knowledge_modifier_desc:0 "Bu karakter, kadim, atalardan kalma piktogramlardan yararlı bilgiler topladı."

 agot_cheerful_disposition_modifier:0 "Neşeli Huy"

 agot_cheerful_disposition_desc:0 "Bu karakter gülümsemeyi ve gülmeyi özellikle kolay buluyor."

 agot_sponsored_torturer_inventor_modifier:0 "İşkenceci Kâşifini Destekledi"

 agot_sponsored_torturer_inventor_modifier_desc:0 "Bu karakter, işkence için kullanılan karmaşık ve acı verici aygıtlar yaratma konusunda uzmanlaşmış bir mucidi finanse etti."

 agot_sponsored_construction_inventor_modifier:0 "Mimarlık Kâşifini Destekledi"

 agot_sponsored_construction_inventor_modifier_desc:0 "Bu karakter, etkileyici ve benzersiz yapıların tasarımında ve icadında üstün bir mimarı finanse etti."

 agot_generic_daydreaming_modifier:0 "Liman Hayalleri"

 agot_generic_daydreaming_modifier_desc:0 "Bu karakter düşüncelere dalmış; hareketli bir limanda gelip giden gemileri hayal ediyor, zihni denizcilik faaliyeti görüntüleriyle süzülüyor."

 agot_delicious_food_modifier:0 "Lezzetli Yemek"

 agot_delicious_food_modifier_desc:0 "Bu karakter, tat tomurcuklarını sevinçle dans ettiren inanılmaz lezzetli ve doyurucu bir yemekten keyif aldığı için son yemeğinin anısını tadını çıkararak hatırlıyor."

 agot_quick_thinking_intrigue_modifier:0 "Çabuk Düşünen"

 agot_quick_thinking_intrigue_modifier_desc:0 "Bu karakter hızlı düşünür; entrika meselelerinde zihni çevik ve keskin, kurnaz ve ilgi çekici stratejileri hızla tasarlamada ustadır."

 agot_supports_tyroshi_slave_industry_modifier:0 "Tyroshlu Köle Endüstrisi Destekçisi"

 agot_supports_tyroshi_slave_industry_modifier_desc:0 "Bu karakterin Tyroş köle endüstrisinde parmağı vardır; fırsat buldukça bu uygulamayı ve efendilerini destekler."

 agot_supports_tyroshi_dye_industry_modifier:0 "Tyroshlu Boya Endüstrisi Destekçisi"

 agot_supports_tyroshi_dye_industry_modifier_desc:0 "Bu karakter, Tyroş'u tanımlayan canlı ve renkli ticarete güçlü destek göstererek Tyroş boya endüstrisini aktif biçimde destekliyor."

 agot_supports_tyroshi_sex_industry_modifier:0 "Tyroshlu Yastık Evi Endüstrisi Destekçisi"

 agot_supports_tyroshi_sex_industry_modifier_desc:0 "Bu karakter, konfor ve arkadaşlık sunan şehrin lüks ve şımartıcı kuruluşlarını aktif biçimde destekleyerek Tyroş yastık evi endüstrisini destekliyor."

 agot_filler_upset_merchants:0 "Üzgün Tüccarlar"

 agot_filler_maester_visit_bonus:0 "İlmi Projeler"

 agot_filler_maester_visit_success_bonus:0 "İlmi İlerlemeler"

 agot_filler_maester_visit_success_bonus_desc:0 "Yabancı bir bilgin tarafından yürütülen özenli araştırmalar sayesinde bu ilçe serpiliyor."

 agot_filler_deadly_gardens:0 "Ölümcül Bahçıvan"

 agot_filler_deadly_gardens_desc:0 "Bu karakter zehirli bitki örtüsüne özel bir ilgi duyuyor; bahçelerini en egzotik zehirli bitki çeşitleriyle süslüyor."

 agot_filler_exotic_collection:0 "Ölümcül Koleksiyon"

 agot_filler_exotic_collection_desc:0 "Bu karakter, ne amaçla olursa olsun, zehirli hayvanlara özel bir ilgi duyuyor."

 agot_filler_mysterious_disappearances:0 "Gizemli Kaçırmalar"

 agot_filler_mysterious_disappearances_desc:0 "Son kayıplar yerel küçük halk arasında pek çok endişeye yol açtı... bazıları yerel muhafızların işin içinde olabileceğini fısıldıyor."

 agot_filler_grave_robbers:0 "Kararmış Mezarlar"

 agot_filler_grave_robbers_desc:0 "Köylülerin dehşetine rağmen, yerel mezarlıklardan cesetlerin kaybolduğu söyleniyor — yerel hükümdarın tuhaf biçimde görmezden geldiği bir gerçek..."

 agot_filler_piracy_disrupts_trade:0 "Korsanlık Ticareti Bozuyor"

 agot_filler_piracy_disrupts_trade_desc:0 "Yakındaki limanlara giden çok sayıda tüccar gemisinin giderek daha açgözlü korsanların eline geçmesiyle ticaret aksaklıkları sürüyor."

 agot_filler_employs_pirates:0 "Korsan Tutuyor"

 agot_filler_employs_pirates_desc:0 "Bu karakterin yerel korsan lordlarıyla karanlık işler çevirdiği söyleniyor. Kârlı olsa da, bu uygulama çoğu kişi tarafından hoş karşılanmıyor."

 agot_filler_safe_shipping_lanes:0 "Güvenli Deniz Yolları"

 agot_filler_safe_shipping_lanes_desc:0 "Artan devriyeler korsanları deniz trafiğini taciz etmekten etkili biçimde caydırdığı için burada ticaret serpiliyor."

 agot_filler_local_militia:0 "Cesaretlenmiş Denizciler"

 agot_filler_local_militia_desc:0 "Korsan tehdidi büyürken, çoğu kişi mallarını savunmak için silaha sarıldı."

 agot_filler_smugglers_alliance:0 "Kara Piyasalar"

 agot_filler_smugglers_alliance_desc:0 "Hırsızlar ve kaçakçılar yerel pazarlara hükmediyor; yozlaşmış muhafızlar ise görmezden geliyor."

 proven_against_pirates_modifier:0 "Korsanlara Karşı Kanıtlanmış"

 proven_against_pirates_modifier_desc:0 "Bu karakter, diyarına yönelik bir korsan saldırısını püskürttü."

 proven_against_pirates_offensive_modifier:0 "Korsanlara Karşı Kanıtlanmış"

 proven_against_pirates_offensive_modifier_desc:0 "Bu karakter, diyarının kıyılarında ve ötesinde korsanlığı baltaladı."

 agot_disrupted_piracy_modifier:0 "Korsanlık Engellendi"

 agot_disrupted_piracy_modifier_desc:0 "Yerel korsanlara karşı düzenlenen son seferler bu eyaleti daha güvenli hale getirdi."

 agot_stunned_by_pirates_modifier:0 "Korkunç Korsanlar"

 agot_stunned_by_pirates_modifier_desc:0 "Yerel korsanların bu eyaletin efendisine karşı kazandığı çarpıcı zafer, tebaasını şok ve korku içinde dondurdu."

 proven_against_anti_pirate_invaders_offensive_modifier:0 "Dirençli Korsan"

 proven_against_anti_pirate_invaders_offensive_modifier_desc:0 "Bu karakter, yağmacılıklarına son vermek isteyen işgalcileri alt etti."

 agot_bested_anti_pirate_invaders:0 "Beklenmedik Yağma"

 agot_bested_anti_pirate_invaders_desc:0 "Bu eyaletin korsanlarına karşı yapılan başarısız bir istila, buradaki yağma stokunu güçlendirdi."

 humiliated_by_pirates:0 "Korsanlarca Aşağılanmış"

 humiliated_by_pirates_desc:0 "Bu karakterin kıyılarını korsanlardan temizleme girişimi acınası biçimde başarısız oldu."

 pirate_adventurer_modifier:0 "Adımtaşları Maceracısı"

 pirate_adventurer_modifier_desc:0 "Bu karakter, Basamak Taşları'nda bir diyar kurmak için haydutlar ve maceracılardan oluşan bir orduyla evini terk etti."

 castle_storming_event_modifier:0 "Saldırı Sürüyor"

 castle_storming_event_modifier_desc:0 "Bu karakter şu anda büyük bir kaleye yapılan saldırıya önderlik ediyor."

 castle_storming_fort_level_event_modifier:0 "Saldırı Sürüyor"

 castle_storming_fort_level_event_modifier_desc:0 "Bu toprak şu anda kararlı bir düşman gücünün saldırısı altında."

 agot_pentos_braavos_treaty:0 "Braavos-Pentos Antlaşması"

 agot_pentos_braavos_treaty_desc:0 "Bu karakter, MS 209 Braavos-Pentos Antlaşması'na tabidir. Paralı asker tutmaları ve köle ticaretine katılmaları yasaktır. Askeri güçleri de ciddi biçimde engellenmiştir."

 agot_exile_faegon_invader_embark_modifier:0 "İstilacı"

 agot_exile_faegon_invader_embark_modifier_desc:0 "Bu karakter bir istila başlatıyor."

