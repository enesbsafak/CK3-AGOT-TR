l_english:

 flames_visions_of_conquest:0 "Visions of Conquest"

 flames_visions_of_conquest_desc:0 "Bu karakter, savaşta büyük zaferlerin onları beklediğine inanıyor."

 flames_visions_of_reconciliation:0 "Visions of Reconciliation"

 flames_visions_of_reconciliation_desc:0 "Bu karakter, çatışmadan uzak durmayı seçti."

 flames_visions_friendship:0 "Visions of Friendship"

 flames_visions_friendship_desc:0 "Bu karakter, yeni dostluklar ve ittifaklar kurmaya adanmıştır."

 flames_visions_ominous_visions:0 "Ominous Visions"

 flames_visions_ominous_visions_desc:0 "Tuhaf görüler, bu karakterin tehlike kapıda pusuda beklediğine inanmasına yol açtı."

 flames_visions_studying_prophecies:0 "Studying Prophecies"

 flames_visions_studying_prophecies_desc:0 "Alevlerin içinde görülen görüler, bu karakteri anlamlarını kavramak umuduyla ruhani bir yola yönlendirdi."

 flames_visions_studying_scriptures:0 "Studying Ancient Texts"

