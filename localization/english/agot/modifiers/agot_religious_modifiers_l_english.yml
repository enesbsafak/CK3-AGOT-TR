 flames_visions_fortune:0 "Visions of Fortune"

 flames_visions_fortune_desc:0 "Bu karakter, çalışkanlığının er ya da geç karşılığını bulacağından emin."

 flames_visions_glimpse_of_past:0 "Visions of the Past"

 flames_visions_glimpse_of_past_desc:0 "Bu karakter, çoktan yitip gitmiş imparatorlukların ve tarihlerinin büyüsüne kapıldı."

