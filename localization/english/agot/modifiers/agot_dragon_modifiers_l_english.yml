 dragon_battle_prowess_modifier_1:0 "Riding Dragon in Battle"

 dragon_battle_prowess_modifier_1_desc:0 "Bu karakter, acemi bir ejderhaya biniyor ve bu yüzden savaş alanında çok daha ölümcül."

 dragon_battle_prowess_modifier_2:0 "Riding Dragon in Battle"

 dragon_battle_prowess_modifier_2_desc:0 "Bu karakter, küçük bir ejderhaya biniyor ve bu yüzden savaş alanında çok daha ölümcül."

 dragon_battle_prowess_modifier_3:0 "Riding Dragon in Battle"

 dragon_battle_prowess_modifier_3_desc:0 "Bu karakter, orta boy bir ejderhaya biniyor ve bu yüzden savaş alanında çok daha ölümcül."

 dragon_battle_prowess_modifier_4:0 "Riding Dragon in Battle"

 dragon_battle_prowess_modifier_4_desc:0 "Bu karakter, orta boy bir ejderhaya biniyor ve bu yüzden savaş alanında çok daha ölümcül."

 dragon_battle_prowess_modifier_5:0 "Riding Dragon in Battle"

 dragon_battle_prowess_modifier_5_desc:0 "Bu karakter bir ejderhaya biniyor ve bu yüzden savaş alanında çok daha ölümcül."

 dragon_supporting_army:0 "Dragon Supporting Army"

 dragon_supporting_army_desc:0 "Bu ejderha bir orduyu destekliyor ve mevcut orduyu desteklemeyi bırakmadan yeni bir orduyu destekleyemeyecek."

 base_dragon_army_modifier_1:0 "Novice Ejderha Army Support"

 base_dragon_army_modifier_1_desc:0 "Bu komutanın ordusu, küçük ve deneyimsiz bir ejderha tarafından destekleniyor. O ve binicisi, kanat saldırılarının korkunç bir düşmanla karşılaşmasını sağlayacak."

 base_dragon_army_modifier_2:0 "Minor Ejderha Army Support"

 base_dragon_army_modifier_2_desc:0 "Bu komutanın ordusu bir ejderha tarafından destekleniyor. O ve binicisi, okçu hatlarını ateşle taciz edecek ve çatışmada seçili taarruzları destekleyecek."

 base_dragon_army_modifier_3:0 "Moderate Ejderha Army Support"

 base_dragon_army_modifier_3_desc:0 "Bu komutanın ordusu bir ejderha tarafından destekleniyor. Binicisinin hücumunu destekleyecek ve düşman hattının hedefli biçimde imha edilmesine olanak sağlayacak."

 base_dragon_army_modifier_4:0 "Medium Ejderha Army Support"

 base_dragon_army_modifier_4_desc:0 "Bu komutanın ordusu orta boy bir ejderha tarafından destekleniyor. Böyle bir canavar, sayıca üstün orduları bile sahaya çıkmayı yeniden düşünmeye zorlamalı."

 base_dragon_army_modifier_5:0 "Fierce Ejderha Army Support"

 base_dragon_army_modifier_5_desc:0 "Bu komutanın ordusu, azgın bir ejderha tarafından destekleniyor; bu yüzden düşman, savaşı tek başlarına kazanmasınlar diye onu dikkatle izlemeli."

 base_dragon_army_modifier_6:0 "Great Ejderha Army Support"

 base_dragon_army_modifier_6_desc:0 "Bu komutanın ordusu, büyük bir ejderha tarafından destekleniyor. Böyle bir canavarın sırtında olmak, savaş alanına hükmetmektir ve böyle bir ordunun kaybedebileceği bir durum hayal edebilen azdır."

 base_dragon_army_modifier_7:0 "Grand Ejderha Army Support"

 base_dragon_army_modifier_7_desc:0 "Bu komutanın ordusu, koca bir ejderha tarafından destekleniyor. Binicisi, savaş alanında insanlar arasında bir tanrıdır ve savaşın bir ucundan diğerine herkes onun gücü karşısında titreyecek."

 base_dragon_army_modifier_8:0 "Terrifying Ejderha Army Support"

 base_dragon_army_modifier_8_desc:0 "Bu komutanın ordusu, dehşet verici bir ejderha tarafından destekleniyor. Böyle bir canavar havalandığında güneşi karartacak ve gerekirse orduları tek başına yerle bir edecek."

 base_dragon_army_modifier_9:0 "Tyrannical Ejderha Army Support"

 base_dragon_army_modifier_9_desc:0 "Bu komutanın ordusu, gerçekten büyük bir ejderha tarafından destekleniyor. Böyle bir ejderha hiçbir zaman insanlar tarafından devrilmedi ve bu güce düşman olan herkes düşecek."

 base_dragon_army_modifier_10:0 "Godly Ejderha Army Support"

 base_dragon_army_modifier_10_desc:0 "Bu komutanın ordusu, onu destekleyen ejderhanın yanında gereksiz kalıyor. Böyle bir canavar Felaket'ten bu yana görülmedi ve tüm düşmanlara getirdiği şey de budur."

 base_dragon_army_modifier_scorpions_counter_1:0 "Scorpion Aerial Opposition"

 base_dragon_army_modifier_scorpions_counter_1_desc:0 "Düşman ordusunun akrepleri var; bu komutanın ejderha desteğini kısmen dengeleyerek."

