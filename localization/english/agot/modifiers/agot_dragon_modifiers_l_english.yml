 agot_dragon_in_dragonpit_desc:0 "Bu ejderha bir [dragonpit|E]'te tutuluyor. Hem ejderha hem de herkes için doğada olmaktan kuşkusuz daha güvenli olsa da, ejderhalar esaret için yaratılmadı."

