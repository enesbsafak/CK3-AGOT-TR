 dragon_bond_oral_folklore_success_modifier:0 "Sözlü Halk Hikâyeleri Başarıyla Kullanıldı"

 dragon_bond_oral_folklore_success_modifier_desc:0 "Sözlü halk bilgisi, ejderhayla bağ kurma konusunda birkaç yararlı içgörü sağladı."

 dragon_bond_oral_folklore_failure_modifier:0 "Oral Folklore was Useless"

 dragon_bond_oral_folklore_failure_modifier_desc:0 "Sözlü halk bilgisinden ejderhayla bağ kurma konusunda hiçbir içgörü edinilmedi."

 dragon_bond_written_lore_success_modifier:0 "Eski Valyria Tomarları Başarıyla Kullanıldı"

 dragon_bond_written_lore_success_modifier_desc:0 "Eski Valyria ciltlerinde sunulan bilgiler, ejderhayla bağ kurma konusunda yararlı içgörüler sağladı."

 dragon_bond_written_lore_failure_modifier:0 "Useless Old Valyrian Tomes"

 dragon_bond_written_lore_failure_modifier_desc:0 "Eski Valyria ciltlerinden ejderhayla bağ kurma konusunda hiçbir içgörü edinilmedi."

 dragon_bond_good_hdk_assistance:0 "Head Dragonkeeper Provides Aid"

 dragon_bond_good_hdk_assistance_desc:0 "Baş ejderha bakıcısı ejderhaya yardım etti ve ejderha bunu iyi karşıladı."

 dragon_bond_bad_hdk_assistance:0 "Head Dragonkeeper Fails to Provide Aid"

 dragon_bond_bad_hdk_assistance_desc:0 "Baş ejderha bakıcısı ejderhaya yardım etmekte başarısız oldu."

 dragon_bond_good_singing:0 "Valyrian Songs Prove Useful"

 dragon_bond_good_singing_desc:0 "Ejderhaya Valyria dilinde şarkı söylendi ve ejderha bunu iyi karşıladı."

 dragon_bond_bad_singing:0 "Valyrian Songs Prove Useless"

 dragon_bond_bad_singing_desc:0 "Ejderha, kendisine söylenen Valyria şarkılarından etkilenmedi."

 dragon_bond_good_speaking:0 "Valyrian Proves Fruitful"

 dragon_bond_good_speaking_desc:0 "Ejderhayla Valyria dilinde konuşuldu ve ejderha bunu iyi karşıladı."

 dragon_bond_bad_speaking:0 "Valyrian Proves Fruitless"

 dragon_bond_bad_speaking_desc:0 "Ejderha, kendisiyle konuşulan Valyria dilinden etkilenmedi."

 dragon_bond_riding_success_modifier:0 "Riding Exercise Proves Useful"

 dragon_bond_riding_success_modifier_desc:0 "Ejderhaya binildi ve ejderha bunu iyi karşıladı."

 dragon_bond_visitation_modifier:0 "Daily Visitations"

 dragon_bond_visitation_modifier_desc:0 "Ejderha, müstakbel binicisi tarafından her gün ziyaret ediliyor."

 dragon_bond_sleep_success_modifier:0 "Well-Rested"

 dragon_bond_sleep_failure_modifier:0 "Disrupted Sleep"

 dragon_bond_lullaby_success_modifier:0 "Lulled to Sleep"

 dragon_bond_lullaby_failure_modifier:0 "Rahatsız Edici Sesler"

 agot_worshiping_dragon:0 "Worshiping Dragon"

 agot_worshiping_dragon_desc:0 "Bu ilçe, [COUNTY.MakeScope.Var('worshiped_dragon').GetCharacter.GetFirstName] ejderhasına tapıyor. Halkı daha mutlu ve biraz daha çok çalışıyor; ama adakları yerel vergi toplama üzerinde bir sızıntıya yol açıyor."

 agot_restricted_dragon_worship:0 "Denied Dragon Worship"

 agot_restricted_dragon_worship_desc:0 "Halk, lordlarının dini inançlarını reddetmesine öfkeli."

 agot_dragon_worship_massacre:0 "Dragon Ritual Massacre"

 agot_dragon_worship_massacre_desc:0 "Burada in kuran ejderhaya tapan yerel bir tarikatın katledilmesinin ardından, bu ilçe daha uysal; ancak daha az üretken."

 agot_dragon_cult_gone_wrong:0 "Dragon Cult Devoured"

 agot_dragon_cult_gone_wrong_desc:0 "Burada in kuran ejderha [COUNTY.MakeScope.Var('worshiped_dragon').GetCharacter.GetFirstName]'e tapınmak üzere yakın zamanda kurulan yerel bir tarikat, bir adak töreni sırasında [COUNTY.MakeScope.Var('worshiped_dragon').GetCharacter.GetFirstNameNoTooltip] tarafından yutulunca beklendiği gibi sona erdi."

 agot_dropping_coins_from_dragon:0 "Damaged by Dropping Coins"

 agot_dropping_coins_from_dragon_desc:0 "Bu ilçenin hükümdarı, ejderhasından bozuk para bırakmaya karar verdiğinde fiziği temelden yanlış anladı."

 agot_raining_money:0 "It's Raining Money!"

 agot_raining_money_desc:0 "Bu ilçenin halkı, hükümdarlarının ejderhasının tepesinden servetlerini bırakma kararından dolayı çok mutlu."

 agot_charted_realm_dragonback:0 "Charted Realm from Dragonback"

 agot_charted_realm_dragonback_desc:0 "Bu karakter, ejderhasını kullanarak diyarının haritasını çıkardı; önceden gizli kalmış ikmal yollarını ve pusu yerlerini işaretledi."

 agot_patrolled_on_dragonback:0 "Dragonrider Patrol Efforts"

 agot_patrolled_on_dragonback_desc:0 "Bu eyalet, kaçakçılardan ve haydutlardan arınmış, kesintisiz ticaret akışını sağlayan bir ejderha binicisinin devriye çalışmasının odağıydı. Bu tür bir çabanın ardından bu ağların toparlanması uzun yıllar alacak."

 agot_dragon_fertilizer:0 "Dragon Fertilizer"

 agot_dragon_fertilizer_desc:0 "Bu ilçenin tarlalarını gübrelemek için bir ejderha kullanıldı; beklenen hasat artırıldı."

 agot_cleared_woods_with_dragonfire:0 "Ejderha Ateşiyle Temizlenen Ormanlar"

 agot_cleared_woods_with_dragonfire_desc:0 "Bu ilçedeki ormanlar ejderha ateşiyle temizlendi; daha fazla toprağın tarım için kullanılması sağlandı ama askeri ikmal için doğal bolluk azaldı."

 agot_clearing_woods_with_dragonfire:0 "Clearing with Dragonfire"

 agot_clearing_woods_with_dragonfire_desc:0 "Bu karakter, yeni yerleşimler için toprakları temizlemekte ejderhasını kullanıyor; işçilik maliyetlerini düşürüp inşaat hızını artırıyor."

 agot_contributing_to_dragonlore:0 "Contributing to Dragonlore"

 agot_contributing_to_dragonlore_desc:0 "Diyarın bilginleri, bu karakterin ejderha bilgisine katkıda bulunma yönündeki süregelen çabalarını büyük takdirle karşılıyor."

 agot_feast_hall_destroyed_by_dragon:0 "Ejderhaca Yıkılan Ziyafet Salonu"

 agot_feast_hall_destroyed_by_dragon_desc:0 "Bir ejderha, bu karakterin ziyafet salonunu yok etti; saray mensupları odalarında yemek yemek zorunda kaldı ve gerekli fonlar yeniden inşaya aktarıldı."

 agot_dragon_party:0 "Successful Dragon Party"

 agot_dragon_party_desc:0 "Her türlü akla ve mantığa rağmen, bu karakter bir ejderhanın katılımıyla başarılı bir parti düzenlemeyi başardı! Katılanlar heyecandan coşkulu ve çevrelerce insanlar hâlâ bunun hakkında konuşuyor."

 agot_dragon_scale_poltice:0 "Dragon Scale Poultice"

 agot_dragon_scale_poltice_desc:0 "Bu karakter, ejderha pullarından yapılmış bir lapa ile tedavi edildi; tamamen psikolojik olsun ya da olmasın, daha canlı hareket ediyor gibi görünüyor."

 agot_dragon_blood_poltice:0 "Dragon Blood Poultice"

 agot_dragon_blood_poltice_desc:0 "Bu karakter, ejderha kanından yapılmış bir lapa ile tedavi edildi; tamamen psikolojik olsun ya da olmasın, bir nebze #italic deli dolu#! görünüyor."

 agot_dragon_claw_poltice:0 "Dragon Claw Poultice"

 agot_dragon_claw_poltice_desc:0 "Bu karakter, ejderha pençesinden yapılmış bir lapa ile tedavi edildi; tamamen psikolojik olsun ya da olmasın, son zamanlarda daha dikkatli görünüyor."

 agot_dragon_tooth_poltice:0 "Dragon Tooth Poultice"

 agot_dragon_tooth_poltice_desc:0 "Bu karakter, ejderha dişinden yapılmış bir lapa ile tedavi edildi; tamamen psikolojik olsun ya da olmasın, son zamanlarda daha sosyal görünüyor."

 agot_dragon_excrement_poltice:0 "Mysterious Dragon Poultice"

 agot_dragon_excrement_poltice_desc:0 "İçeriğini açıklamayı reddetse de, bu karakter bir ejderhanın parçalarından yapılmış bir lapa ile tedavi edildi; tamamen psikolojik olsun ya da olmasın, sağlık abidesi gibi görünüyor."

 agot_dragon_potion_bad_health:0 "İksirden Rahatsız"

 agot_dragon_potion_bad_health_desc:0 "Bu karakter, gizemli bir iksir içiyor; tamamen psikolojik olsun ya da olmasın, kendini iyi hissetmiyor gibi görünüyor."

 agot_dragon_potion_good_health:0 "İksirden İyi Hissediyor"

 agot_dragon_potion_good_health_desc:0 "Bu karakter, gizemli bir iksir içiyor; tamamen psikolojik olsun ya da olmasın, sağlık abidesi gibi görünüyor."

 agot_murdered_the_innocents:0 "Öldürülen Masumlar"

 agot_murdered_the_innocents_desc:0 "Bu karakter, tek suçları kendisine yanlış bakmak olan masum insanları öldürmek için ejderhasını kullandı."

 agot_wild_dragon_killed_peasants:0 "Wild Dragon Killed Peasants"

 agot_wild_dragon_killed_peasants_desc:0 "Vahşi bir ejderha, bu ilçede bir grup köylüyü öldürdü ve küçük halk bundan memnun değil."

 agot_wild_dragon_killed_livestock:0 "Wild Dragon Killed Livestock"

 agot_wild_dragon_killed_livestock_desc:0 "Vahşi bir ejderha, yerel çiftlik hayvanlarını yemeye başladı; küçük halkın hayatlarını iyileştirme imkânını azaltıyor."

 agot_tamed_dragon_killed_livestock:0 "Tamed Dragon Killed Livestock"

 agot_tamed_dragon_killed_livestock_desc:0 "Ehlileştirilmiş bir ejderha, yerel çiftlik hayvanlarını yemeye başladı; küçük halkın hayatlarını iyileştirme imkânını azaltıyor."

 agot_wild_dragon_destroyed_crops:0 "Wild Dragon Destroyed Crops"

 agot_wild_dragon_destroyed_crops_desc:0 "Vahşi bir ejderha, bu ilçenin çevresindeki tarlaları mahvetti ve sonuç olarak halk açlığın eşiğinde."

 agot_wild_dragon_killed_courtier:0 "Wild Dragon Killed Courtier"

 agot_wild_dragon_killed_courtier_desc:0 "Vahşi bir ejderha, bu karakterin bir saray mensubunu öldürdü ve saray bu yüzden kargaşa içinde!"

 agot_tamed_dragon_killed_predator:0 "Tamed Dragon Killed Predator"

 agot_tamed_dragon_killed_predator_desc:0 "Ehlileştirilmiş bir ejderha, yerel bir yırtıcıyı yemek yaptı; küçük halkın hayatını iyileştirdi."

 agot_bond_gives_strength:0 "Dragon Bond Giving Strength"

 agot_bond_gives_strength_desc:0 "Bu karakterin ejderhasıyla olan bağı ona tazelenmiş bir dirilik hissi verdi."

 agot_bond_gives_relief:0 "Dragon Bond Giving Relief"

 agot_bond_gives_relief_desc:0 "Bu karakterin ejderhasıyla olan bağı, günlük streslerinden kurtulma hissi veriyor."

 agot_dragon_fire:0 "Dragon Fires Raging"

 agot_dragon_fire_desc:0 "Bir ejderhanın gazabının alevleri burada hâlâ yanıyor. İnsanlar evlerini terk ediyor, geçim kaynaklarının yandığını görüyor ve yolları yoksul ve ölmekte olan insanlarla dolduruyor."

 agot_dragon_damage_1:0 "Minor Ejderha Hasarı"

 agot_dragon_damage_1_desc:0 "Bir ejderha kırsala öyle bir zarar verdi ki bazı ormanlar ve küçük köyler zarar gördü. Odun kıtlığı ve verilen zarar, ilçe toparlanana dek inşaatı ve vergi toplamayı olumsuz etkileyecek."

 agot_dragon_damage_2:0 "Moderate Ejderha Hasarı"

 agot_dragon_damage_2_desc:0 "Bir ejderha geçti ve bir dizi köyü yaktı. Onarımlar tamamlanana dek vergiler ve inşaat çalışmaları zararla ilgilenmek için aktarılmalı."

 agot_dragon_damage_3:0 "Ejderha Hasarı"

 agot_dragon_damage_3_desc:0 "Bir ejderha geçti ve bir dizi köyü yaktı. Dışarı çıkan yollarda hâlâ mülteciler görülebiliyor. Onarımlar tamamlanana dek vergiler ve inşaat çalışmaları zararla ilgilenmek için aktarılmalı."

 agot_dragon_damage_4:0 "Severe Ejderha Hasarı"

 agot_dragon_damage_4_desc:0 "Bir ejderha geçti ve burayı yaktı. Pek çok köy saldırıya uğradı ve bazıları asla tam olarak toparlanamayabilir. Bu ilçenin vergilerinin ve inşaat çalışmalarının çoğu zararla ilgilenmek için aktarılıyor."

 agot_dragon_damage_5:0 "Terrible Ejderha Hasarı"

 agot_dragon_damage_5_desc:0 "Bir ejderha geçti ve burayı yaktı. Köyler ve kasabalar büyük hasar gördü ve çevrede kilometrelerce duman görülebiliyor. Onarım yavaş ilerliyor; bir nebze normalliğin geri dönmesi aylar alabilir."

 agot_dragon_damage_6:0 "Critical Ejderha Hasarı"

 agot_dragon_damage_6_desc:0 "Bir ejderha geçti ve burayı fena halde yaktı. Büyük altyapı hasar gördü ve bu haldeyken insanların temel ihtiyaçları risk altında. Bu kriz çözülene dek bu ilçe neredeyse işe yaramaz olacak."

 agot_dragon_damage_7:0 "Extreme Ejderha Hasarı"

 agot_dragon_damage_7_desc:0 "Bir ejderha geçti ve burayı fena halde yaktı. Büyük kasabalar ve köyler, bunun yanı sıra daha pek çok bölge küle döndü. Bir çeşit normal hayatın geri dönmesi en az bir yıl alacak."

 agot_dragon_damage_8:0 "Devastating Ejderha Hasarı"

 agot_dragon_damage_8_desc:0 "Bir ejderha geçti ve burayı şiddetle yaktı. Şehirlerin, kasabaların ve köylerin çoğu ya küle döndü ya da mülteci akınıyla yüzleşiyor. İlçe en az bir yıl boyunca üretken olmayacak."

 agot_dragon_damage_9:0 "Catastrophic Ejderha Hasarı"

 agot_dragon_damage_9_desc:0 "Bir ejderha geçti ve burayı neredeyse küle çevirdi. Yanmamış ne bir kasaba ne bir köy ne de bir şehir kaldı. Vergi toplamak imkânsız ve tüm inşaat çalışmaları yeniden inşa çabasına ayrılmalı."

 agot_dragon_damage_10:0 "Apocalyptic Ejderha Hasarı"

 agot_dragon_damage_10_desc:0 "Bu ilçe, insanların bir zamanlar yaşadığı bir yerden çok, lanetli bir öbür dünya tasavvuruna benziyor. Toprağın kendisi yanmış durumda; insanlar şöyle dursun, bitkilerin bile geri dönmesi yıllar alacak."

 agot_chain_dragon_filler_modifier:0 "Restrained Dragon"

 agot_chain_dragon_filler_modifier_desc:0 "Bu ejderha, ağır zincirler kullanılarak bağlandı."

 dragon_siege_modifier_passive:0 "Dragon's Siege Support"

 dragon_siege_modifier_passive_desc:0 "Bu karakterin kuşatması, kampındaki bir ejderhanın varlığıyla destekleniyor. Düşmanları, canavarın üzerlerine salıverilmesinden korkuyor ve sonuç olarak moral cezası çekiyor."

 dragon_siege_modifier_minor:0 "Minor Ejderha Kuşatma Yıkımı"

 dragon_siege_modifier_minor_desc:0 "Bir ejderhanın eylemleriyle temel savunmalar hasar gördü; dış mevziler ve gözetleme kuleleri yakıldı."

 dragon_siege_modifier_medium:0 "Moderate Ejderha Kuşatma Yıkımı"

 dragon_siege_modifier_medium_desc:0 "Bu eyalet, bir ejderhanın eylemleriyle hasar gördü; mevziler, gözetleme kuleleri, erzak ve teçhizat şeritler halinde yakıldı."

 dragon_siege_modifier_major:0 "Major Ejderha Kuşatma Yıkımı"

 dragon_siege_modifier_major_desc:0 "Bu eyalet, duvarları bile küle çeviren bir ejderhanın eylemleriyle büyük hasar gördü."

 dragon_siege_modifier_massive:0 "Extreme Ejderha Kuşatma Yıkımı"

 dragon_siege_modifier_massive_desc:0 "Bu eyalet yalnızca ismen öyledir; zira bir ejderha üzerindeki toprağı yerle bir etti."

