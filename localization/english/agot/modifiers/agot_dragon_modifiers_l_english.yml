 agot_taught_dragonlore_desc:0 "Bu karaktere ejderha ehlileştirme hakkında bilgi öğretildi."

 agot_child_interested_in_dragons:0 "Interested in Dragons"

 agot_child_interested_in_dragons_desc:0 "Bu karakterin ejderhalara ilgisi var."

 agot_child_terrified_by_dragons:0 "Terrified by Dragons"

 agot_child_terrified_by_dragons_desc:0 "Bu karakterin ejderhalara karşı çocukluktan kalma bir korkusu var."

 agot_dragon_disinterest:0 "Draconic Disinterest"

