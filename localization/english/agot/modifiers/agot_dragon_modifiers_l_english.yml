 agot_conducting_dragon_research:0 "Conducting Dragon Research"

 agot_conducting_dragon_research_desc:0 "Bu karakter ejderhalar üzerine araştırma yapıyor."

 agot_fled_siege_on_dragon:0 "Ejderha Sırtında Kuşatmadan Kaçtı"

