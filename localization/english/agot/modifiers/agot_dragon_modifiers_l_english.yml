 dragon_bond_fed_meat_sheep_success_modifier:0 "Raw Mutton ile Beslendi"

 dragon_bond_fed_meat_sheep_success_modifier_desc:0 "Ejderha, büyük memnuniyetiyle, çiğ koyun etiyle beslendi."

