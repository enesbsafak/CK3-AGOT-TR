l_english:

 rp_hunter_modifier:0 "Doğan Hanedan: Hunter"

 rp_hunter_modifier_desc:0 "Hükümdar olmadan önce bu karakter mütevazı bir avcıydı. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_exsoldier_modifier:0 "Doğan Hanedan: Soldier"

 rp_exsoldier_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir askerdi. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_merchant_modifier:0 "Doğan Hanedan: Merchant"

 rp_merchant_modifier_desc:0 "Hükümdar olmadan önce bu karakter bir tüccardı. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_blackmailer_modifier:0 "Doğan Hanedan: Blackmailer"

 rp_blackmailer_modifier_desc:0 "Bu karakter, kurnazlık ve entrikayla hükümdar oldu. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir haydut olarak görüyor."

 rp_knight_modifier:0 "Doğan Hanedan: Hedge Knight"

 rp_knight_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir maceraperest şövalyeydi. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_sailor_modifier:0 "Doğan Hanedan: Sailor"

 rp_sailor_modifier_desc:0 "Hükümdar olmadan önce bu karakter bir denizciydi. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_healer_modifier:0 "Doğan Hanedan: Healer"

 rp_healer_modifier_desc:0 "Hükümdar olmadan önce bu karakter bir şifacıydı. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_orphan_modifier:0 "Doğan Hanedan: Orphan"

 rp_orphan_modifier_desc:0 "Hükümdar olmadan önce bu karakterin ebeveynleri, çocuklarına bu konumu kazandıran büyük bir başarı göstererek öldü. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_sellsword_modifier:0 "Doğan Hanedan: Sellsword"

 rp_sellsword_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir paralı askerdi. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir haydut olarak görüyor."

 rp_steward_modifier:0 "Doğan Hanedan: Steward"

 rp_steward_modifier_desc:0 "Hükümdar olmadan önce bu karakter aşağılık bir kahyaydı. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_fool_modifier:0 "Doğan Hanedan: Fool"

 rp_fool_modifier_desc:0 "Hükümdar olmadan önce bu karakter bir saray soytarısıydı. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, bir soytarıdan biraz fazlası olarak görüyor."

 rp_mercenary_modifier:0 "Doğan Hanedan: Mercenary"

 rp_mercenary_modifier_desc:0 "Hükümdar olmadan önce bu karakter bir paralı asker birliğine liderlik ediyordu. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir haydut olarak görüyor."

 rp_reaver_modifier:0 "Doğan Hanedan: Reaver"

 rp_reaver_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir akıncıydı. Kazandıkları ihtişama rağmen, birçokları hâlâ onları, hayattaki konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_paramore_modifier:0 "Doğan Hanedan: Lover"

 rp_paramore_modifier_desc:0 "Hükümdar olmadan önce bu karakter, derebeyinin sevgilisiydi. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir köylü olarak görüyor."

 rp_hedgewizard_modifier:0 "Doğan Hanedan: Hedge Wizard"

 rp_hedgewizard_modifier_desc:0 "Hükümdar olmadan önce bu karakter bir çit büyücüsüydü. Birçokları hâlâ onları, hayattaki mevcut konumlarına uygun olmayan, yükselmiş bir şarlatan olarak görüyor."

 rp_wildling_hunter_modifier:0 "Bir Şefin Yükselişi: Hunter"

 rp_wildling_hunter_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir avcıydı. Becerileri ve ihtişamları onlara bu konumu kazandırdı."

 rp_wildling_raider_modifier:0 "Bir Şefin Yükselişi: Raider"

 rp_wildling_raider_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir akıncıydı. Becerileri ve ihtişamları onlara bu konumu kazandırdı."

 rp_wildling_assassin_modifier:0 "Bir Şefin Yükselişi: Killer"

 rp_wildling_assassin_modifier_desc:0 "Hükümdar olmadan önce bu karakter kötü şöhretli bir katildi. Gözü peklik ve kanla konumlarını sağlamlaştırdılar."

 rp_wildling_shipwreck_modifier:0 "Bir Şefin Yükselişi: Shipwreck Survivor"

 rp_wildling_shipwreck_modifier_desc:0 "Hükümdar olmadan önce bu karakter, gemi kazası geçirmiş bir yabancıydı. Kurnazlık, zenginlik ve azimle konumlarına yükseldiler."

 rp_wildling_nightwatch_modifier:0 "Bir Şefin Yükselişi: Night's Watch Deserter"

 rp_wildling_nightwatch_modifier_desc:0 "Hükümdar olmadan önce bu karakter, Gece Nöbeti'nin bir Kardeşiydi. Bazıları hâlâ onları küçümsemekle birlikte, yine de konumlarını hak ettiler."

 rp_wildling_woodswitch_modifier:0 "Bir Şefin Yükselişi: Woods-Witch"

 rp_wildling_woodswitch_modifier_desc:0 "Hükümdar olmadan önce bu karakter, yetenekleri için değer verilen bir şifacıydı. Bu sayede konumlarına yükseldiler."

 rp_wildling_elected_modifier:0 "Bir Şefin Yükselişi: Natural Leader"

 rp_wildling_elected_modifier_desc:0 "Hükümdar olmadan önce bu karakter doğuştan bir liderdi. Arkalarındakilerin desteğiyle konumlarına yükseldiler."

 rp_wildling_warg_bear_modifier:0 "Bir Şefin Yükselişi: Warg-Bear"

 rp_wildling_warg_bear_modifier_desc:0 "Hükümdar olmadan önce bu karakter yalnızca sıradan bir deri değiştiriciydi. Bir ayıyla bağ kurarak konumlarına yükseldiler."

 rp_wildling_warg_direwolf_modifier:0 "Bir Şefin Yükselişi: Warg-Direwolf"

 rp_wildling_warg_direwolf_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir vargdı. Bir ulu kurtla bağ kurarak konumlarına yükseldiler."

 rp_wildling_warg_shadowcat_modifier:0 "Bir Şefin Yükselişi: Warg-Shadowcat"

 rp_wildling_warg_shadowcat_modifier_desc:0 "Hükümdar olmadan önce bu karakter sıradan bir deri değiştiriciydi. Bir gölge kediyle bağ kurarak konumlarına yükseldiler."
