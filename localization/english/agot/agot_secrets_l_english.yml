 agot_secret_events.0001.t:0 "Sırrım Açığa Çıktı!"

 agot_secret_events.0001.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U], Yabanıl olduğum için beni ihbar etti."

 agot_secret_events.0001.a:0 "Oyunum ortaya çıktı!"

 agot_secret_events.0101.t:0 "Bir Sır Açığa Çıktı!"

 agot_secret_events.0101.desc:0 "[owner.GetFirstName|U] her zaman tuhaf tipli görünüyordu — saraydaki diğerlerine pek uymayan, ama sevimli ve içten bir biçimde. Ama bilmediğim şey, gerçeğin çok daha karanlık olduğuydu: [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)], [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U]'in aslında #N bir Yabanıl#! olduğunu açıkça kanıtlayan deliller ortaya çıkardı!!\n\nDüşünmek bile... Böyle bir vahşiyle ekmek böldüğümü düşünmek..."

 agot_secret_events.0101.likes_negative:0 "Asla... Böyle bir şey aklıma bile gelmezdi!"

 agot_secret_events.0101.dislikes_negative:0 "Beni iğrendiriyorsun, [owner.GetFirstNameNoTooltip]!"

 agot_secret_events.0101.b:0 "Bu Yabanıl, [owner.GetHerHis] suçlarının bedelini ödeyecek. Muhafızlar!"

 agot_secret_events.0101.c:0 "Bu suçlamalar, kin ve yalandan başka bir şey değil."

 agot_secret_events.1001.t:0 "Sırrım Açığa Çıktı!"

 agot_secret_events.1001.desc:0 "#Bold Gülen Ağaç Şövalyesi#! olduğum ortaya çıktı!! Yaptıklarımdan utanmıyorum; o yaverler onursuz ve zalimdi, #italic birinin#! haddini bildirmesi gerekiyordu. Ancak yendiğim şövalyeler, bir kadın tarafından yenildiklerini öğrenmekten pek memnun kalmayabilir."

 agot_secret_events.1001.desc_aerys:0 "\n\n[aerys.GetTitledFirstName] o zamanlar öfkeden kudurmuş ve bu gizemli şövalyeyi hain ilan etmişti. Umarım yıllar öfkesini dindirmiştir..."

 agot_secret_events.1001.a:0 "Olan oldu."

 agot_secret_events.1002.t:0 "Bir Sır Açığa Çıktı!"

 agot_secret_events.1002.desc:0 "[owner.GetTitledFirstName]'in, Harrenhal Turnuvası'nın gizemli şövalyesi #Bold Gülen Ağaç Şövalyesi#! olduğu ortaya çıktı. Daha dünkü bir kızın üç eğitimli şövalyeyi yenmesi..."

 agot_secret_events.1002.desc_aerys:0 "\n\n[aerys.GetTitledFirstName] o zamanlar öfkeden kudurmuş ve gizemli şövalyeyi hain ilan etmişti. Yıllar öfkesini dindirmediyse, bu ifşa onu tehlikeli bir duruma sokmuş olabilir..."

 agot_secret_events.1002.a:0 "Ah, Lyanna..."

 agot_secret_events.1002.b:0 "Onu zincirler içinde bana getir"

 agot_secret_events.2004.t:0 "Kayıp Varisin Dönüşü"

 agot_secret_events.2004.desc:0 "Evinden kaçalı yıllar oldu; hanen darmadağın olduktan sonra hayatta kalmak için gizli bir kimlik edindin. Şimdi, sana hak ettiğin şeyi geri alma fırsatı doğuyor.\n\nAncak bu iş zorlu ve yerini geri kazanmak için bölgenin hükümdarı [helping_ruler.GetFirstName]'in yardımına ihtiyacın olabilir."

 agot_secret_events.2004.a:0 "Üstümden yardım istemeliyim."

 agot_secret_events.2004.b:0 "Geçmişteki benliğim gitti; devam etmeliyim."

 agot_secret_events.2004.c:0 "Eve dönme zamanı."

 agot_secret_events.2004.d:0 "Diğer yolları bırakıp macera arıyorum."

 agot_secret_events.2005.t:0 "Kayıp Varisin Dönüşü"

 agot_secret_events.2005.desc:0 "Evimden kaçalı yıllar oldu; hanem darmadağın olduktan sonra hayatta kalmak için gizli bir kimlik edindim. Şimdi, bana hak ettiğim şeyi geri alma fırsatı doğuyor.\n\nUmarım doğru kararı veririm."

 agot_secret_events.2005.a:0 "Hedeflerime ancak savaşla ulaşabilirim."

 agot_secret_events.2005.a.tt:0 "Seni desteklemek için toplanmış bir ordu alacaksın"

 agot_secret_events.2005.b:0 "Gerçek benliğimi dünyaya açıklıyorum."

 agot_secret_events.2005.c:0 "Daha iyi bir fırsatı bekleyeceğim."

 agot_secret_events.2005.d:0 "Mevcut hayatımla devam etmeliyim."

 agot_secret_events.2006.t:0 "Kayıp Varis"

 agot_secret_events.2006.desc:0 "Evimden kaçalı yıllar oldu; hanem darmadağın olduktan sonra hayatta kalmak için gizli bir kimlik edindim. Dünya değişmiş ve gerçek adım unutulup gitmiş olsa da, şimdi kimliğimi geri alma ve gerçek soyumu dünyaya ifşa etme fırsatı doğuyor."

 agot_secret_events.2006.a:0 "Gerçek benliğimi dünyaya açıklıyorum."

 agot_secret_events.2006.b:0 "Mevcut hayatımla devam etmeliyim."

 agot_secret_events.2007.t:0 "Kayıp Varisin İfşası"

 agot_secret_events.2007.desc:0 "Hayretler içinde, [secret_child.GetFirstName]'in aslında bir zamanlar büyük saygı gören soylu bir hanenin kayıp varisi [true_char.GetFirstName] olduğunu keşfettim. Şimdi [secret_child.GetSheHe], [secret_child.GetHerHis] vatanını geri alma konusunda benden yardım istiyor.\n\nBu karar omuzlarımda ağır bir yük. Diyarımı savaşa sürüklemek anlamına gelse bile destek mi vereyim, yoksa [secret_child.GetHerHim] geri mi çevirip geçmişin gömülü kalmasına mı izin vereyim?"

 agot_secret_events.2007.a:0 "Savaş anlamına gelse bile [secret_child.GetFirstNameNoTooltip]'e yardım et."

 agot_secret_events.2007.a.tt:0 "[true_char.GetFirstName]'i desteklemek için toplanmış bir ordu alacaksın"

 agot_secret_events.2007.b:0 "Geçmiş gömülü kalsın."

 agot_secret_events.2008.t:0 "Kaderin Kavşağı"

 agot_secret_events.2008.desc:0 "Üstüm, vatanımı geri almada bana yardım etmeyi reddetti ve savaş açmak için gereken desteği benden esirgedi. Yine de bir seçim kaldı.\n\nDoğuştan hakkımı geri alma şansı için her şeyi riske atarak gerçek kimliğimi dünyaya ifşa edebilirim. Ya da gizli kalıp hanemin anısının karanlıklara karışmasına izin verebilirim. Seçeceğim yol, kaderimi belirleyecek."

 agot_secret_events.2008.a:0 "Gerçek benliğimi dünyaya açıklıyorum."

 agot_secret_events.2008.b:0 "Mevcut hayatımla devam etmeliyim."

 agot_secret_events.2008.c:0 "Diğer yolları bırakıp macera arıyorum."

 agot_secret_events.2009.t:0 "Dönüş"

 agot_secret_events.2009.desc:0 "Kuzgunlar şaşırtıcı haberler getirdi: Uzun süredir öldüğü sanılan [secret_child.GetFirstName], gizli bir kimlikle yaşıyormuş. Şimdi [secret_child.GetSheHe] yeniden ortaya çıktı ve [secret_child.GetHerHis] gerçek benliğini ifşa etti.\n\nDiyar, [secret_child.GetHerHis] bir sonraki hamlesiyle ilgili söylentilerle çalkalanıyor. [secret_child.GetSheHe] kaybettiği mirası geri almaya mı çalışacak, yoksa [secret_child.GetSheHe]'in başka planları mı var? Yaşananlar, topraklarımızın geleceğini şekillendirmeye mahkûm."

 agot_secret_events.2009.a:0 "İlginç."

 secret_spawned_army:0 "[secret_child.GetFirstNamePossessive] Ordusu"

 agot_secret_events.3000.t:0 "Sırrım Açığa Çıktı!"

 agot_secret_events.3000.desc.intro:0 "[GetScriptedCharacterByHistoryID('Targaryen_27').GetFirstNameNicknamed], Yedi Krallık üzerinde hak iddia ettiğinde yanında iki kız kardeş-eşi vardı: [GetScriptedCharacterByHistoryID('Targaryen_28').GetFirstNameNicknamed] ve [GetScriptedCharacterByHistoryID('Targaryen_29').GetFirstNameNicknamed]. Ejderhalar Westeros'un büyük bölümünü fethetti, ama Dorne boyun eğmedi.\n\nNe var ki Rhaenys, fethi tamamlamak için [GetScriptedCharacterByHistoryID('dragon_meraxes').GetName]'e binip güneye gittiğinde, ejderha çölde can verdi ve onun tacı bir daha asla bulunamadı. Anlatılan hikâye buydu...\n\n"

 agot_secret_events.3000.desc.self:0 "Dünyaya [ROOT.Char.Custom('HiddenArtifact')] eserine sahip olduğumu açıkladım."

 agot_secret_events.3000.desc.other:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U], dünyaya [ROOT.Char.Custom('HiddenArtifact')] eserine sahip olduğumu açıkladı."

 agot_secret_events.3000.desc.shared:0 "\n\nUller Hanesi, [meraxes.GetFirstNameNoTooltip]'i yere serdiğimizde [rhaenys.GetFirstNameNoTooltip]'ten alınan taçtan bu yana ona sahipti — [uller_ancestor.GetFullName]..."

 agot_secret_events.3000.desc.shared_uller_ancestor:0 "\n\nUller Hanesi, [meraxes.GetFirstNameNoTooltip]'i yere serdiğimizde onu [rhaenys.GetFirstNameNoTooltip]'ten aldığım günden beri bu taca sahip — ben..."

 agot_secret_events.3000.desc.targs:0 "\n\nTargaryen'lerin bu ifşayı iyi karşılaması pek olası değil. Belki de başka bir yoldan haber almadan önce, iyi niyet göstergesi olarak onu sessizce geri vermek daha akıllıca olur."

 agot_secret_events.3000.a:0 "Fetih hakkıyla Uller Hanesi'ne aittir."

 agot_secret_events.3000.b:0 "Onu geri vereceğim."

 agot_secret_events.3010.t:0 "Sırrım Açığa Çıktı!"

 agot_secret_events.3010.desc.self:0 "Dünyaya [ROOT.Char.Custom('HiddenArtifact')] eserine sahip olduğumu açıkladım."

 agot_secret_events.3010.desc.other:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U], dünyaya [ROOT.Char.Custom('HiddenArtifact')] eserine sahip olduğumu açıkladı."

 agot_secret_events.3010.desc.shared:0 "\n\nMopatis Hanesi, [illyrio.GetFullName] gençliğinde ele geçirdiğinden beri kılıca sahipti. Böyle bir şekilde ifşa edilmesi talihsizlik oldu."

 agot_secret_events.3010.desc.shared_illyrio:0 "\n\nOnu ele geçireli uzun yıllar oldu; bir şekilde işe yarar hâle getirmeyi ummuştum, ama görünüşe göre bu ifşa bana bu fırsatı tanımadı."

 agot_secret_events.3010.desc.targs:0 "\n\nTargaryen'ler kılıcı yıllar önce kaybetmiş olabilir, ama ona itiraz edecek bilinen bir Blackfyre olmadığından, kılıç üzerinde en güçlü hakka onlar sahip."

 agot_secret_events.3010.desc.blackfyres:0 "\n\nAna Targaryen soyunun tükenmesiyle birlikte, kılıç üzerindeki tek gerçek hak Blackfyre'lara aittir."

 agot_secret_events.3010.desc.both:0 "\n\nHem Targaryen'lerin hem Blackfyre'ların kılıcın kendilerine ait olduğunu iddia etmeleri muhtemel."

 agot_secret_events.3010.a:0 "Bana aittir."

 agot_secret_events.3010.b:0 "Onu Targaryenlere geri vereceğim."

 agot_secret_events.3010.c:0 "Blackfyre'larındır."
