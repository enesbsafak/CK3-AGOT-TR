 LEGACY_DAYNE_PROWESS:0 "Starfall'ın salonlarında Dayne Hanesi'nin şövalyeleri, bir sonraki Sabah Yıldızı'nın (Sword of the Morning) sorumluluğunu üstlenecek ve efsanevi Şafak kılıcını kuşanacak kişi olmak için yarışır.\nDoğdukları andan itibaren aşılanan bu rekabet, Dayne Hanesi'nin Westeros'un bildiği en büyük şövalyelerden bazılarını yetiştirmesini sağlamıştır ve bu [dynasty|E] hanedanın üyelerinin daha iyi $trait_education_martial_prowess$ [traits|E] özellikleri almasıyla sonuçlanır."

