 game_concept_btw_struggle:0 "Sur'un Ötesi Mücadelesi"

 game_concept_btw_struggle_desc:0 "The $game_concept_btw_struggle$, duvarın ötesindeki asırlık ihtilaflı ilişkileri tasvir eder. Uzun Gece'nin sonunda, sekiz bin yıl önce Duvar'ın inşasıyla doğmuş olsa da, [struggle|E], nefret dolu şiddet, temkinli ateşkesler ve pragmatik iş birliği [struggle_phase_phases|E] arasında değişir. Böyle bir durumda kalıcı müttefikler azdır ve [rulers|E], yalnızca ortak bir [faith|E] ya da [culture|E]'ye güvenmek konusunda temkinli olmalıdır."

 struggle_btw_phase_opportunity:0 "Fırsat"

 struggle_btw_phase_opportunity_desc:0 "$game_concept_struggle_phase_btw_opportunity_desc$"

 struggle_btw_phase_hostility:0 "Düşmanlık"

 struggle_btw_phase_hostility_desc:0 "$game_concept_struggle_phase_btw_hostility_desc$"

 struggle_btw_phase_compromise:0 "Uzlaşma"

