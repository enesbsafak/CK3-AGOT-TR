 found_empire_decision_not_part_of_btw_struggle:0 "$btw_struggle$ içinde [struggle_uninvolved|E]'sin"

 FORM_BTW_MUST_END_STRUGGLE_TRIGGER:0 "[btw_struggle|E] çözülmeden $e_beyond_the_wall$ kurulamaz"

 game_concept_struggle_phase_btw_opportunity:0 "Fırsat Evresi"

 game_concept_struggle_phase_btw_opportunity_desc:0 "[struggle_phase_btw_conciliation|E] sırasındaki görece huzurlu bir arada yaşama döneminin ardından, rehavet baş gösterir. Herkes işlerin sadece #EMP yürüyeceğini#! rahatça varsar ve bu da daha kurnaz [characters|E]'in saflıklarından faydalanmasına olanak tanır.\n\nNihayetinde, taze suistimaller ya [struggle_phase_btw_hostility|E]'e tırmanmaya yol açar ya da kurnaz siyaset [struggle_phase_btw_conciliation|E] yoluyla tedirgin bir dengeye ulaşır."

 game_concept_struggle_phase_btw_hostility:0 "Düşmanlık Evresi"

 game_concept_struggle_phase_btw_hostility_desc:0 "Bu $game_concept_struggle_phase_phase$'de gerilim yükselir ve sinirler gerilir. [struggle_phase_btw_opportunity|E] sırasındaki tekrarlanan kötülük eylemleri ve büyüyen yanlış anlamalar, farklı [cultures|E]'e sahip [characters|E]'e karşı yükselen bir nefrete yol açmıştır.\n\nAncak böylesi bir kan dökücülük sonsuza dek süremez. Nihayetinde, ister daha sakin kafalar ister basit bir yorgunluk, duvarın ötesindeki toprakları [struggle_phase_btw_compromise|E]'e getirir."

 game_concept_struggle_phase_btw_compromise:0 "Uzlaşma Evresi"

 game_concept_struggle_phase_btw_compromise_desc:0 "[struggle_phase_btw_hostility|E] mücadelesinden duyulan bıkkınlık ya da [struggle_phase_btw_conciliation|E] sırasındaki hünerli tırmanış sayesinde, $game_concept_struggle_phase_btw_compromise$, Yabanıllar arasında büyüyen bir uyumu temsil eder. Farklılıklar bir kenara bırakılır ve ortak tarih ile miras, eski hasımları birbirine bağlar.\n\nDuvarın ötesindeki topraklar bir yol ayrımında durur: çatışmalar yeniden baş gösterirse, [struggle_phase_btw_opportunity|E] onları bekliyor."

 game_concept_struggle_phase_btw_conciliation:0 "Yatışma Evresi"

 game_concept_struggle_phase_btw_conciliation_desc:0 "Kayda değer bir [struggle_phase_btw_compromise|E]'in ürünü olarak, bu $game_concept_struggle_phase_phase$ sırasında Yabanıllar arasındaki ilişkiler o kadar samimi bir hal alır ki dışarıdakiler bu hoşgörüyü anlamakta güçlük çeker.\n\nAncak bu sonsuza dek süremez ve güven suistimalleri nihayetinde [btw_struggle|E]'i yeniden [struggle_phase_btw_compromise|E]'e geri getirir."

 game_concept_btw_reclamation:0 "Duvar Ötesi Geri Kazanım"

 game_concept_btw_reclaiming:0 "Duvar Ötesi Geri Kazanma"

 game_concept_btw_reclamations:0 "Duvar Ötesi Geri Kazanımlar"

 game_concept_btw_reclamation_desc:0 "Bu, [btw_struggle|E]'in [struggle_involved|E] [rulers|E]'ine sunulan özel bir [war|E] türüdür.\n\nSaldırgan, bir [struggle_interloper|E] ya da [struggle_uninvolved|E] [ruler|E] tarafından tutulan herhangi bir [struggle_involved|E] [counties|E] içeren bir [duchy|E] fethetmeyi amaçlar; eğer o Dükalık dışında toprakları yoksa onları [vassalize|E] eder."

 game_concept_secure_btw_foothold_decision:0 "$secure_btw_foothold_decision_title$"

 game_concept_secure_btw_foothold_decision_desc:0 "[btw_struggle|E]'i sona erdirmesine olanak tanıyan, [struggle_involved|E] olmayan bir [ruler|E] için bir [decision|E]."
