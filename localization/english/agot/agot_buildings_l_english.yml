 building_agot_pirate_supply_01:0 "Sessiz Saklanma Yeri"

 building_agot_pirate_supply_01_desc:0 "Sakin bir saklanma yeri bir kaçakçı için her zaman işe yarar; çünkü ne zaman ihtiyaç duyacaklarını kimse bilemez."

 building_agot_pirate_supply_02:0 "Göze Çarpmayan İskeleler"

 building_agot_pirate_supply_02_desc:0 "Bazı rıhtımlar, uygun evrakı olmayanlar için daha elverişlidir."

 building_agot_pirate_supply_03:0 "Boğuk Kürekler"

 building_agot_pirate_supply_03_desc:0 "Gece karaya çıkmak iyi bir göz, yıldız bilgisi, cesur bir yürek ve en önemlisi..."

 building_agot_pirate_supply_04:0 "Issız Sığınak"

 building_agot_pirate_supply_04_desc:0 "Dışarıdakilerden uzak, güvenli bir sığınak her zaman kaçakçılara muhtaçtır - mecazi fırtınalar için de, gerçek fırtınalar için de."

 building_agot_pirate_supply_05:0 "Dredged Shores"

 building_agot_pirate_supply_05_desc:0 "Bütün limanlar kendilerine kapalıyken girişimci bir kaçakçı ne yapmalı? Kendi limanını yapmalı! Ve..."

 building_agot_pirate_supply_06:0 "Yasadışı Liman"

 building_agot_pirate_supply_06_desc:0 "Liman yetkililerine rüşvet ver, gece sız, muhafızları atlat - kendi yasadışı... varken neden?"

 building_type_agot_pirate_troop_01:0 "Cephanelik"

 building_type_agot_pirate_troop_01_desc:0 "Denizde bir gemiyi ele geçirmek kolay bir iş değildir - yakalamanın yanı sıra, savaşmaya hazır şekilde... binmelisiniz."

 building_agot_pirate_troop_01:0 "Gizlenmiş Silahlar"

 building_agot_pirate_troop_01_desc:0 "Bütün korsanların kendi silah stokları vardır; en aşağı aşçıdan kaptanın kendisine kadar herkesin silahı olmalı."

 building_agot_pirate_troop_02:0 "Yağmalanmış Depolar"

 building_agot_pirate_troop_02_desc:0 "Bir gemi ele geçirilirken alınan en faydalı ganimetlerden biri, yenilgiye uğratılan tayfanın silahlarıdır; ..."

 building_agot_pirate_troop_03:0 "Warehouse Stockpiles"

 building_agot_pirate_troop_03_desc:0 "İyi bir silah stoku her zaman iyi bir fikirdir."

 building_agot_pirate_troop_04:0 "Floating Armory"

 building_agot_pirate_troop_04_desc:0 "Silahlarınızı nerede saklamak en iyisidir? Denizde! Böylece hiçbir hırsız, haklı olarak çaldıklarınızı çalamaz!"

 building_agot_pirate_troop_05:0 "Egzotik Silahlar"

 building_agot_pirate_troop_05_desc:0 "Denizler büyük bir potadır; sırada ne ele geçireceğinizi asla bilemezsiniz - belki bir Norvoşi..."

 building_agot_pirate_troop_06:0 "Fleet Arsenal"

 building_agot_pirate_troop_06_desc:0 "Düzgün bir korsan lordu yalnızca kendi tayfasını değil, bütün filoyu donatır; böylece bütün gemiler dolu dizgin saldırıya hazır olur."

 building_type_agot_pirate_military_01:0 "Korsan İskeleleri"

 building_type_agot_pirate_military_01_desc:0 "Korsan, gemisiz hiçbir şeydir; gemilerin sayısı ve kalitesi arttıkça korsan da o kadar korkunç olur."

 building_agot_pirate_military_01:0 "Yalnız Demirleme"

 building_agot_pirate_military_01_desc:0 "Geminin bakımı her zaman yapılmalıdır; tek başına paspaslamak zorunda kalsan bile."

 building_agot_pirate_military_02:0 "Doğaçlama Demirleme"

 building_agot_pirate_military_02_desc:0 "Bir korsan elindekilerle yetinmek zorundadır; doğaçlama bir demir yeri en iyisi olmasa da. Yine de gemilerin demirleyip tazelenmesine olanak tanır."

 building_agot_pirate_military_03:0 "Derme Çatma Rıhtım"

 building_agot_pirate_military_03_desc:0 "Bu harap rıhtım, gerçek bir iskeleye daha yakındır, ama yine de daha iyi olabilir."

 building_agot_pirate_military_04:0 "Deniz Kaçakları"

 building_agot_pirate_military_04_desc:0 "Bu rıhtım işçileri ve denizciler dünyanın dört bir yanında çalıştı; Braavos'tan Leng'e; ..."

 building_agot_pirate_military_05:0 "Sailor Barracks"

 building_agot_pirate_military_05_desc:0 "Rıhtımdaki denizciler için barınma ihtiyacı arttı; bu yüzden tüm konforlarıyla bir kışla inşa edilecek..."

 building_agot_pirate_military_06:0 "Corsair Dockyards"

 building_agot_pirate_military_06_desc:0 "Bunlar artık gerçek, özel tersaneler; ... çağıran tüm korsanlara ve deniz akıncılarına hizmet veriyor."

 building_type_agot_pirate_fortification_01:0 "Gözetleme Kuleleri"

 building_type_agot_pirate_fortification_01_desc:0 "Westeros'un kalelerinin veya Essos'un şehirlerinin aksine, korsanlar ve deniz akıncıları ... ağır tahkim etmez."

 building_agot_pirate_fortification_01:0 "Sarhoş Devriyeler"

 building_agot_pirate_fortification_01_desc:0 "İyi yardımcı bulmak zordur; bu devriyelerin kanıtladığı gibi - içkinin yalnızca onları ayakta tutmak için olduğunu iddia ederler."

 building_agot_pirate_fortification_02:0 "Far-eyes"

 building_agot_pirate_fortification_02_desc:0 "Uzak-gözler, ufukta her zaman kara veya gemi belirtisi tarayan gözcülerdir; bu..."

 building_agot_pirate_fortification_03:0 "Crow's Nests"

 building_agot_pirate_fortification_03_desc:0 "Uzak-gözlerin nöbetine yardımcı olmak için, seren çanaklıkları onlara ufku izleyecekleri bir yer sağlar."

 building_agot_pirate_fortification_04:0 "İşaret Bayrakları"

 building_agot_pirate_fortification_04_desc:0 "Sinyal bayraklarının kullanımı, farklı gözcüler, gemiler ve... arasında mesajların hızla paylaşılmasını sağlar."

 building_agot_pirate_fortification_05:0 "Myrish Eyes"

 building_agot_pirate_fortification_05_desc:0 "Myr gözlerinin kullanımı, gözcülerin her zamankinden daha uzağı görmesini sağlar. Bir zamanlar bir leke olan..."

 building_agot_pirate_fortification_06:0 "Bilge-rotted Wrecks"

 building_agot_pirate_fortification_06_desc:0 "Sığınağı daha iyi korumak için, sintine çürüklüğüne uğramış batıklar, herhangi bir... karşı korumak için etrafına çekildi."

 agot_pirate_ship_main_01_domicile_building:0 "Converted Galley"

 agot_pirate_ship_main_01_domicile_building_desc:0 "Bu kadırga, güçlendirilmiş pruvası ve daha fazla küreğiyle bir savaş gemisine dönüştürüldü."

