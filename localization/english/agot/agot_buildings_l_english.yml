 building_godswood_01:0 "Tanrı Bahçesi"

 building_godswood_01_desc:0 "Teknik olarak bir tanrı ormanı olsa da, bu gerçekten yalnızca bakımlı bir bahçedir; mevcut tek ağaç..."

 building_godswood_02:0 "Küçük Tanrı Ormanı"

 building_godswood_02_desc:0 "Birkaç ağacı ve ortasında bir yürek ağacı olan küçük bir tanrı ormanı; güzel bir ibadet yeri sunar."

 building_godswood_03:0 "Orta Tanrı Ormanı"

 building_godswood_03_desc:0 "Meşe, karaağaç ve huş ağaçlarının bulunduğu orta büyüklükte bir tanrı ormanı - ortasında bir yürek ağacı. Sıradan görünümüne rağmen..."

 building_godswood_04:0 "Serpilen Tanrı Ormanı"

 building_godswood_04_desc:0 "Meşe, karaağaç ve huş ağaçlarının bulunduğu, göz alabildiğine uzanan bir tanrı ormanı; birkaç demirağacı fidanı da büyümeye başlamış."

 building_godswood_05:0 "Büyük Tanrı Ormanı"

 building_godswood_05_desc:0 "Servi, meşe, karaağaç, huş ve genç demirağaçlarının bulunduğu büyük bir tanrı ormanı; ortasında bir yürek ağacı..."

 building_godswood_06:0 "Büyük Tanrı Ormanı"

 building_godswood_06_desc:0 "Bir dönüm genişliğinde, servi, meşe, karaağaç, huş ve birkaç demirağacıyla dolu büyük bir tanrı ormanı; ortasında bir yürek ağacı..."

 building_godswood_07:0 "Muhteşem Tanrı Ormanı"

 building_godswood_07_desc:0 "Bu tanrı ormanı kıyas götürmez; dönümlerce uzanır ve servi, meşe, karaağaç, huş, demirağacı..."

 building_godswood_08:0 "Devasa Tanrı Ormanı"

 building_godswood_08_desc:0 "Bu ilkel tanrı ormanı, birden fazla kalenin boyutunu aşar ve gerçekten başlı başına bir ormandır..."

