 building_type_scorpion_emplacement_01:0 "Scorpion Emplacements"

 building_type_scorpion_emplacement_01_desc:0 "Yeniden doldurması yavaş, adamın yüklemeden ateşleyemeyeceği kadar büyük bir arbalet; akrep mancınıkları uzun süredir bu kıyılardaki surların ve gemilerin gözdesiydi."

