 building_type_agot_urban_farms_01:0 "Fırınlar"

 building_type_agot_urban_farms_01_desc:0 "Şehrin atan kalbi kale değil, demirci ocağı değil, fırındır."

 building_agot_urban_farms_01:0 "Köy Fırını"

 building_agot_urban_farms_01_desc:0 "Ekmek her köyün anahtarıdır; onsuz insanlar aç kalır; bu yüzden köy fırıncısı kilit bir kişidir..."

 building_agot_urban_farms_02:0 "Fırın"

 building_agot_urban_farms_02_desc:0 "Büyüyen bir nüfusu desteklemek için daha fazla ekmek gerekecek; bu yüzden daha büyük bir fırın yapılmalı."

 building_agot_urban_farms_03:0 "Cookhouse"

 building_agot_urban_farms_03_desc:0 "Fırın gelişti; artık başka yiyecekler de servis ediyor. Bu büyüme insanları iyi destekledi."

 building_agot_urban_farms_04:0 "Wayside Inn"

 building_agot_urban_farms_04_desc:0 "Seyahat arttıkça, artık dört bir yandan insanlar hanın yemeğini yemek ve dinlenmek için uğruyor."

 building_agot_urban_farms_05:0 "Kasaba Fırını"

 building_agot_urban_farms_05_desc:0 "Artan insan sayısıyla, köy bir kasabaya dönüştü ve fırın da onunla birlikte büyüdü..."

 building_agot_urban_farms_06:0 "Ünlü Han"

 building_agot_urban_farms_06_desc:0 "Hanlar vardır, bir de hanlar vardır. Burası yalnızca denizciler arasında değil, ... arasında da bir itibar edinmiştir."

 building_agot_urban_farms_07:0 "Şehir Fırını"

 building_agot_urban_farms_07_desc:0 "Kasaba gerçek bir şehre dönüştükçe, onu besleyenler de gelişip büyüdü."

 building_agot_urban_farms_08:0 "Baker's Guild"

 building_agot_urban_farms_08_desc:0 "Bir zamanlar fırıncılar bağımsız ve ayrıyken, şimdi şehir hayatının talepleri nedeniyle..."

 building_type_agot_steppe_farms_01:0 "Çayır Çiftlikleri"

 building_type_agot_steppe_farms_01_desc:0 "Bozkır ve Otlak'ın ıssız topraklarında bile çiftçilik yapılır."

 building_agot_steppe_farms_01:0 "Saman Çiftlikleri"

 building_agot_steppe_farms_01_desc:0 "Bölgenin düşük yağışı nedeniyle çoğunlukla saman yetiştiren küçük dış çiftlikler."

 building_agot_steppe_farms_02:0 "Fasulye Çiftlikleri"

 building_agot_steppe_farms_02_desc:0 "Bu çiftlikler, diğer ürünleri ve hayvanları desteklemek için fasulye yetiştirmeye başladı."

 building_agot_steppe_farms_03:0 "Arpa Çiftlikleri"

 building_agot_steppe_farms_03_desc:0 "Arpa bu daha kurak topraklarda kilit bir üründür ve daha büyük bir nüfusu besleyecek daha yüksek hasat verimi sağlar."

 building_agot_steppe_farms_04:0 "Hardal Çiftlikleri"

 building_agot_steppe_farms_04_desc:0 "Hardal, bozkırların ve kuzey yerlerin ikliminde iyi yaşayabilen dayanıklı bir üründür."

 building_agot_steppe_farms_05:0 "Buğday Çiftlikleri"

 building_agot_steppe_farms_05_desc:0 "Buğday çiftlikleri her nüfus için anahtardır; bozkırda bile bol hasat sağlar."

 building_agot_steppe_farms_06:0 "Çavdar Çiftlikleri"

 building_agot_steppe_farms_06_desc:0 "Çavdar çiftlikleri, bozkır çiftlikleri için kilit bir yiyecek ve gelir kaynağıdır; yiyecek ve... sağlar."

 building_agot_steppe_farms_07:0 "Karışık Tahıl Çiftlikleri"

 building_agot_steppe_farms_07_desc:0 "Yalnızca tek bir ürüne güvenmek talihsizliğe yol açabilir. Ancak geniş bir çeşitliliğe sahip olarak..."

 building_agot_steppe_farms_08:0 "Kış Buğdayı Çiftlikleri"

 building_agot_steppe_farms_08_desc:0 "Kıştan ve hatta yaz karından sağ çıkmak için, Kış Buğdayı Kuzey'de çiftçiliğin anahtarıdır."

 building_type_city_walls_01:0 "Şehir Surları"

 building_type_city_walls_01_desc:0 "Bir kale surları kadar büyük olmasa da, bu surlar bu ekonomik merkezi... koruyan basit surlardır."

 building_city_walls_01:0 "Hızlı Palisad"

 building_city_walls_01_desc:0 "Bu palisad, olası saldırganları caydırmak umuduyla hızla inşa edildi."

 building_city_walls_02:0 "Ahşap Duvarlar"

 building_city_walls_02_desc:0 "Kalıcı ahşap surlar artık bu kasabada yaşayan tüccarları ve halkı koruyor."

 building_city_walls_03:0 "Basit Taş Duvarlar"

 building_city_walls_03_desc:0 "Daha fazla tüccar ve lonca çekme umuduyla, bu yerleşim artık basit taş surlarla övünüyor..."

 building_city_walls_04:0 "Taş Duvarlar"

 building_city_walls_04_desc:0 "Bu yerleşim, artık onu akıncılardan ve haydutlardan koruyan taş surlarla övünüyor."

 building_type_agot_slave_camps_01:0 "Slave Camps"

 building_type_agot_slave_camps_01_desc:0 "Harika eserler, Eski Ghis'in ve Valyria Özgür Kalesi'nin kölelerinin sırtında inşa edildi. Bir..."

 building_agot_slave_camps_01:0 "Küçük Köle Ağılı"

 building_agot_slave_camps_01_desc:0 "Sıkışık ve sefil bir ağıla kapatılmış, bu penin içinde yalnızca bir avuç köle hayatta kalabiliyor..."

 building_agot_slave_camps_02:0 "Büyük Köle Ağılı"

 building_agot_slave_camps_02_desc:0 "Genişletilmiş bir ağıl daha fazla köle alabilir; özellikle de sakinleri için yalnızca asgari ihtiyaçlar sağlanıyorsa."

 building_agot_slave_camps_03:0 "Slave Slums"

 building_agot_slave_camps_03_desc:0 "Köle ağılları taşmaya başladığında, özel bir kenar mahalle gerekebilir. Bu sefil, kalabalık..."

 building_agot_slave_camps_04:0 "Auction Block"

 building_agot_slave_camps_04_desc:0 "Bölge genelinde köle alıp satma yeri olarak bilinen açık artırma platformu, köleleştirilmişleri küçük düşürür..."

 building_agot_slave_camps_05:0 "Slave Hold"

 building_agot_slave_camps_05_desc:0 "Köleler, daha sıkı kontrol sağlamak için ayrılmış mahzenlere kapatılabilir; yeter ki huzursuzluk tohumları..."

 building_agot_slave_camps_06:0 "Büyük Açık Artırma Bloğu"

 building_agot_slave_camps_06_desc:0 "İnsanlar burada düzenlenen büyük köle müzayedelerine katılmak için dört bir yandan gelir; burayı önemli..."

 building_agot_slave_camps_07:0 "Slave District"

 building_agot_slave_camps_07_desc:0 "Köle sayısının fazlalığı, asgari ve cılız erzakla bile barınmaları için tam bir bölge gerektirir..."

 building_agot_slave_camps_08:0 "Slave Quarter"

 building_agot_slave_camps_08_desc:0 "Köle sayısı, başlı başına bir şehir büyüklüğüne ulaştıkça, ayrılmış bir köle mahallesi gerekli hale gelir."

