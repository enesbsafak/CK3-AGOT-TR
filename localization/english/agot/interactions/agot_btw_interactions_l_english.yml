l_english:

 agot_btw_nightswatch_petition_non_rc:0 "Hükümdara Dilekçe Ver"

 agot_btw_wildling_call_to_arms:0 "Yabanıl Silah Çağrısı"

 agot_btw_interaction_events.0001.opening:0 "Silahlara Çağrı"

 agot_btw_interaction_events.0001.desc:0 "Uzun zamandır kara kargalar, ölü eti gibi özgür halkın topraklarını didik didik ediyor — adamlarımızın, kadınlarımızın ve çocuklarımızın ölümüyle besleniyorlar.\n\nDiz çökenler taçları ve çelik kılıçlarıyla gelmeden önce, tüm insanlar bu toprağı paylaşıyordu. #bold Ve böyle de yeniden olacak.#!\n\nBana katılın, diz çökenlere karşı birlik olmuş bir savaş verelim!"

 agot_btw_interaction_events.0001.a:0 "Elbette, katılacağım!"

 agot_btw_interaction_events.0001.b:0 "Katılacağım... #italic bir bedel karşılığında.#!"

 agot_btw_interaction_events.0001.c:0 "Ha! Senin gibilerine asla katılmam, [wildling_caller.GetFirstNameNoTooltip]!"

 agot_btw_interaction_events.0002.opening:0 "Silahlara!"

 agot_btw_interaction_events.0002.desc:0 "Bir zamanlar, kara kargalar üzerimize çullanmadan çok önce, özgür halk toprakla birlik içinde yaşardı. #bold Birlikte, o günleri yeniden görebiliriz!#!\n\nDiz çökenler bizi gördüklerinde çelik zırhları içinde titreyecekler — özgür halk, onlara karşı mücadelemizde birleşmiş!"

 agot_btw_interaction_events.0002.a:0 "Gerçekten görülmeye değer bir manzara!"

 agot_btw_interaction_events.0003.opening:0 "Bir Bedel Karşılığında..."

 agot_btw_interaction_events.0003.desc:0 "Diz çökenlere karşı yüreğimde sevgi yok, Duvar'ı koruyan kara kargalara da.\n\nAma altına karşı yüreğimde sevgi var, o yüzden taleplerimi karşılarsan davana katılmayı düşünürüm."

 agot_btw_interaction_events.0003.a:0 "Ödeyebileceğim tüm yardıma ihtiyacım var."

 agot_btw_interaction_events.0003.b:0 "Akrabalarım altından daha değerli."

 agot_btw_interaction_events.0003.c:0 "Beni dilenci yerine koyduğun günü pişmanlıkla anacaksın..."

 agot_btw_interaction_events.0004.opening:0 "Kendi Başına"

 agot_btw_interaction_events.0004.desc:0 "Diz çökenlere karşı sürdüğün boktan savaşa katılarak ölmekten daha kötü bir ölüm düşünemiyorum.\n\nDüşününce, kim daha beter? Lanet kargalar mı, yoksa sen mi, [ROOT.Char.GetCulture.GetName]."

 agot_btw_interaction_events.0004.a:0 "Şu iğrenç hain!"

 agot_btw_interaction_events.0005.opening:0 "Altından Daha Değerli"

 agot_btw_interaction_events.0005.desc:0 "Taleplerini altınla karşılayamam, ama sana bundan çok daha değerli bir şey verebilirim...\n\n[wildling_potential_house_hostage.GetFullName] akrabam, kendi kanımdan ve yaklaşan savaşımız sırasında değerli bir rehine olarak hizmet edecek."

 agot_btw_interaction_events.0005.a:0 "Böyle bir teklifi reddedemem."

 agot_btw_interaction_events.0005.b:0 "Ha! Güzel şaka."

 agot_btw_interaction_events.0006.opening:0 "Silahlara!"

 agot_btw_interaction_events.0006.desc:0 "Sadece laftan ibaret olmadığını kanıtladın — ve bu, biz özgür halk için çok şey ifade ediyor.\n\nBu savaşına katılacağım. Diz çökenler bizi görünce titreyecek."

 agot_btw_interaction_events.0006.a:0 "Duymak güzel."

 agot_btw_interaction_events.0007.opening:0 "Ben Ziyafet Çekerken Ölmekten Keyif Al"

 agot_btw_interaction_events.0007.desc:0 "Aptal [ROOT.Char.GetTitledFirstNameNoTooltip], sadakatimi satın alma girişimlerin beni keyiflendirdi. #bold Senin gibi birinin yanında savaşa katılacağımı düşünmek bile!#!\n\nGülmekten kendimi alamıyorum..."

 agot_btw_interaction_events.0007.a:0 "Kahrolası aşağılık hain!"
