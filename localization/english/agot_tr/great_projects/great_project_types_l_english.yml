### TODO AGOT-CHANGED: great_project_type_grand_canals_desc [AGOT: Prior custodians of this land have constructed vast canal networks, linking rivers and lakes through man-made waterways, connecting north and south. Expanding this system with modern techniques will make it even more efficient, while honoring the legacy and skill of the original engineers. | TR: Bu toprakların önceki koruyucuları, insan yapımı su yollarıyla nehirleri ve gölleri birbirine bağlayan, kuzeyi ve güneyi birbirine bağlayan geniş kanal ağları inşa ettiler. Bu sistemin modern tekniklerle genişletilmesi, zamanında bu atılımı gerçekleştirmiş mühendislerin mirasına ve becerisine saygı gösterirken, onu daha da verimli hale getirecektir.]
 great_project_type_grand_canals_desc: "Prior custodians of this land have constructed vast canal networks, linking rivers and lakes through man-made waterways, connecting north and south. Expanding this system with modern techniques will make it even more efficient, while honoring the legacy and skill of the original engineers."
