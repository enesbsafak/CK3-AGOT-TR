### TODO AGOT-CHANGED: great_project_type_great_wall_desc [AGOT: The Great Wall stands as a testament to our predecessors' engineering skill and ingenuity in deterring potential invaders. Yet, as with everything else, time has taken its toll. The wall is in dire need of improvement. | TR: Çin Seddi, seleflerimizin mühendislik mahareti ve zekâsıyla istilacıları caydırmak için örüldü. Ne var ki her şey gibi zaman onun da tahrip olmasına sebep oldu. Seddin acil surette güçlendirilmesi gerekir.]
 great_project_type_great_wall_desc: "The Great Wall stands as a testament to our predecessors' engineering skill and ingenuity in deterring potential invaders. Yet, as with everything else, time has taken its toll. The wall is in dire need of improvement."
### TODO AGOT-CHANGED: great_project_type_grand_canals [AGOT: The Grand Canals | TR: Büyük Kanallar]
