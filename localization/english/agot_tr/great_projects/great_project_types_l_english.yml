l_english:
 great_project_type_great_wall: "Çin Seddini Güçlendir"
 great_project_type_great_wall_desc: "Çin Seddi, seleflerimizin mühendislik mahareti ve zekâsıyla istilacıları caydırmak için örüldü. Ne var ki her şey gibi zaman onun da tahrip olmasına sebep oldu. Seddin acil surette güçlendirilmesi gerekir."
 great_project_type_grand_canals: "Büyük Kanallar"
 great_project_type_grand_canals_desc: "Bu toprakların önceki koruyucuları, insan yapımı su yollarıyla nehirleri ve gölleri birbirine bağlayan, kuzeyi ve güneyi birbirine bağlayan geniş kanal ağları inşa ettiler. Bu sistemin modern tekniklerle genişletilmesi, zamanında bu atılımı gerçekleştirmiş mühendislerin mirasına ve becerisine saygı gösterirken, onu daha da verimli hale getirecektir."
 grand_canals_effect_desc: "Hedef alan [GetModifier('tgp_grand_canal_modifier').GetNameWithTooltip] kazanır"
 great_project_type_construct_great_barracks: "Büyük Kışla İnşa Et"
 great_project_type_construct_great_barracks_desc: "Sayısız askeri barındırabilecek büyük bir kale inşa ederek askerî gücümüzü gösterebiliriz. Askeri komutanlar daha fazla asker ve büyük garnizonlar toplayabilecek ve bu da bölgenin savunma gücüne büyük katkı sağlayacaktır."
 great_project_type_construct_great_barracks_does_not_already_have_barracks: "Hâlihazırda bir [GetBuilding('celestial_great_barracks_01').GetName] [Concept('building', 'Binası')|E] yok"
 project_great_barracks_replace_tt: "@alert_icon! #alert_trial Bu, mevcut [Concept('duchy_building', 'Düklük Binasının')|E] değişmesine sebep olacak#!"
 you_are_owner_of_the_project: "[Concept('great_project', 'Büyük Projenin')|E] sahibisiniz"
 you_have_a_grand_marshal_desc: "Bir [minister_grand_marshal|E] sahibisiniz"
 great_project_purge_treasury_debt_msg_t: "[GetGreatProjectType('minister_project_conduct_census').GetNameNoTooltip] Kaynaklı"
