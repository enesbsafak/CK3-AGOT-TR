 tenet_benevolent_governance_name: "Benevolent Governance"
### TODO AGOT-CHANGED: tenet_benevolent_governance_desc [AGOT: Those who govern over the masses have a moral duty to promote that which is good and abjure that which is evil. It is only by adhering to this principle that a ruler may truly be just. | TR: Halkı yönetenlerin, erdemi yüceltmek ve kötülüğü reddetmek gibi ahlakî bir görevi vardır. Bir hükümdar ancak bu ilkeye bağlı kalarak gerçekten adil olabilir.]
 tenet_benevolent_governance_desc: "Those who govern over the masses have a moral duty to promote that which is good and abjure that which is evil. It is only by adhering to this principle that a ruler may truly be just."
