### TODO AGOT-CHANGED: tenet_fp3_fedayeen_desc [AGOT: When ordinary warfare will not avail, it is our duty before [ROOT.Faith.HighGodNameAlternate] to destroy [ROOT.Faith.HighGodHerHis|U] enemies through infiltration and deception. We must fear neither death nor pain, and eagerly lay down our lives for the greater cause. | TR: Er meydanı çare olmadığında, [ROOT.Faith.HighGodNameAlternate] bizden onun düşmanlarını gizlilik ve aldatma yoluyla ortadan kaldırmamızı bekler. Ne ölümden ne de acıdan korkmalı, daha büyük bir amaç uğruna hayatlarımızı riske atmalıyız.]
 tenet_fp3_fedayeen_desc: "When ordinary warfare will not avail, it is our duty before [ROOT.Faith.HighGodNameAlternate] to destroy [ROOT.Faith.HighGodHerHis|U] enemies through infiltration and deception. We must fear neither death nor pain, and eagerly lay down our lives for the greater cause." 
