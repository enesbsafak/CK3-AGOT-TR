l_english:
 tenets_name:0 "Öğretiler"
 PIETY_LONG_PEACE:0 "Uzun Barış"
 tenet_vows_of_poverty_name:0 "Yoksulluk Yemini"
 tenet_vows_of_poverty_desc:0 "Para insanın kalbini ve vicdanını çürütür, gerçek inançlarından uzaklaştırır. Gerçekten önemli olan şeylere odaklanmak istiyorsak maddi zenginliğe sahip olmaktan kaçınmalıyız." #krutygetarts
 tenet_consolamentum_name:1 "Endura"
 tenet_consolamentum_name_alternate:0 "İntihar Ayini"
 tenet_consolamentum_desc:0 "Yaşlandığımızda veya hastalandığımızda ruhumuzu günahlardan temizleyen bir ayin yaparız. Tekrar günahlar ile kirlenmemek için ayin tamamlandığında hayatımıza hızlıca ve kesin bir şekilde son veririz."
 tenet_pentarchy_name:0 "Pentarşi"
 tenet_pentarchy_alternate_name:0 "Pentarşi"
 tenet_pentarchy_desc:0 "Kutsal bölgelerimiz sadece kutsal yerler değildir, dindar liderlerimizin oturup yönetmeleri gereken koltuklardır."
 tenet_polyamory_name:0 "Çokaşklılık"
 tenet_polyamory_desc:0 "[ROOT.Faith.FertilityGodName] bizi nasıl seviyorsa biz de birbirimizi öyle koşulsuz sevmeliyiz. Sadece bir kişinin diğer kişinin sevgisine sahip olması gibi zamanı geçmiş düşüncelerden kurtulmalıyız."
 tenet_warmonger_name:0 "Savaşçı"
 tenet_warmonger_desc:0 "İnanç ve savaş beraber yaşar. Kutsal adına savaşmayı reddeden gerçek bir inanan olamaz."
 tenet_astrology_name:0 "Astroloji"
 tenet_astrology_desc:0 "Gece gökyüzü, kutsalın mekânına açılan bir penceredir. Dünyanın büyük sırları ve gizemleri orada yazılıdır. Eğer kişi nereye bakmasını biliyorsa bunları öğrenebilir."
 tenet_sacred_shadows_name:0 "Kutsal Yalanlar"
 tenet_sacred_shadows_desc:0 "Yalan söylemek var olan en büyük sanattır. Başkalarını yalanlarına inandıranlar kutsaldır. Kendilerine başarılı bir şekilde yalan söyleyebilenler ise durdurulamazdır."
