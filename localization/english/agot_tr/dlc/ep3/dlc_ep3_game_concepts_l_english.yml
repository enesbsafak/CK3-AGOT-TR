### TODO AGOT-CHANGED: game_concept_contract_scheme_desc [AGOT: Many $game_concept_task_contracts$ require [adventurers|E] to successfully complete a [scheme|E].\n\nThese can be harmful (like murdering a [contractor_possessive|E] [rival|E]), pleasant (like simply telling stories to entertain their [court|E] for a few months), or innocuous (like transcribing texts for them).\n\nIf the $game_concept_scheme$ is failed or abandoned for any reason, the $game_concept_task_contract$ is failed too. | TR: $game_concept_task_contracts$in birçoğu, [Concept('adventurers', 'Maceracıların')|E] bir [Concept('scheme', 'Planı')|E] başarıyla yerine getirmesi gerekir.\n\nBunlar zarar verici planlar olabileceği gibi (mesela [contractor_possessive|E] [Concept('rival', 'Rakibini')|E] ortadan kaldırmak), keyif verici planlar da olabilir (birkaç ay boyunca [Concept('court', 'Saraylarında')|E] eğlendirici hikâyeler anlatmak) veya sıradan planlar olabilir (onlar için çeviri yapmak).\n\nEğer $game_concept_scheme$ başarısız olursa veya bir sebepten terk edilirse, $game_concept_task_contract$ de başarısız olmuş sayılır.]
 game_concept_contract_scheme_desc: "Many $game_concept_task_contracts$ require [adventurers|E] to successfully complete a [scheme|E].\n\nThese can be harmful (like murdering a [contractor_possessive|E] [rival|E]), pleasant (like simply telling stories to entertain their [court|E] for a few months), or innocuous (like transcribing texts for them).\n\nIf the $game_concept_scheme$ is failed or abandoned for any reason, the $game_concept_task_contract$ is failed too."
