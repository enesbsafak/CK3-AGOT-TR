### TODO AGOT-CHANGED: game_concept_camp_desc [AGOT: $game_concept_camps$ are a portable mess of tents, pack animals, and people. They vary in size from just a small circle to great roving armies.\n\nEach [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] which moves across the map with them.\n\n[camp_buildings|E] may be built here, which provide powerful bonuses to the $game_concept_adventurer$ in lieu of [counties|E] of their own. [followers|E], like their [family|E] and [knights|E], travel with the $game_concept_camp$, and may be appointed as [officers|E].\n\n#WEAK Like [courts|E], $game_concept_camps$ include some nameless [characters|E] not important enough to portray — albeit less of them.\n\nEven when not [traveling|E] between $game_concept_counties$, $game_concept_camps$ are generally not static in the [location|E] they're in, and will move around every few nights.#! | TR: $game_concept_camps$, seyyar çadırlar, yük hayvanları ve insanlardan oluşur. Küçük gruplar şeklinde olabilecekleri gibi, devasa bir ordu hâlinde de olabilirler.\n\nHer [GetGovernment( 'landless_adventurer_government' ).GetName], [domicile|E] olarak haritada onlarla beraber hareket eden bir $game_concept_camp$a sahiptir.\n\n[camp_buildings|E], bir bakıma [Concept('counties', 'Kontlukların')|E] görevini görerek $game_concept_adventurers$ için güçlü bonuslar sağlar. [followers|E], örneğin [Concept('family', 'Akrabaları')|E] ve [knights|E], $game_concept_camp$ ile beraber hareket ederler ve [officers|E] olarak atanabilirler.\n\n#WEAK Tıpkı [courts|E] gibi, $game_concept_camps$ da isimsiz bazı [Concept('characters', 'Karakterlere')|E] ev sahipliği yapabilir.\n\n$game_concept_counties$ arasında [Concept('traveling', 'Seyahat')|E] etmedikleri zamanlarda dahi, $game_concept_camps$ bulundukları [Concept('location', 'Konumda')|E] sabit bir şekilde durmazlar, birkaç günde bir yer değiştirirler.#!]
 game_concept_camp_desc: "$game_concept_camps$ are a portable mess of tents, pack animals, and people. They vary in size from just a small circle to great roving armies.\n\nEach [GetGovernment( 'landless_adventurer_government' ).GetName] has a $game_concept_camp$ [domicile|E] which moves across the map with them.\n\n[camp_buildings|E] may be built here, which provide powerful bonuses to the $game_concept_adventurer$ in lieu of [counties|E] of their own. [followers|E], like their [family|E] and [knights|E], travel with the $game_concept_camp$, and may be appointed as [officers|E].\n\n#WEAK Like [courts|E], $game_concept_camps$ include some nameless [characters|E] not important enough to portray — albeit less of them.\n\nEven when not [traveling|E] between $game_concept_counties$, $game_concept_camps$ are generally not static in the [location|E] they're in, and will move around every few nights.#!"
