### TODO AGOT-CHANGED: game_concept_task_contract_desc [AGOT: $game_concept_task_contracts$ are the primary way that [adventurers|E] make [gold|E] or [prestige|E]. They can also award [provisions|E], [piety|E], and even [artifacts|E].\n\nEach one is a task put out by a local [ruler|E] — generally requiring the $game_concept_adventurer$ to perform a [scheme|E], complete a [travel|E], or help them in [war|E] — and can be undertaken for a reward and to put the [contractor|E] on the [contact_list|E].\n\nMore $game_concept_task_contracts$ are spawned by traveling either long distances or to new [kingdoms|E].\n\nThe higher the [title_tier|E] or the $game_concept_ruler$ offering a $game_concept_task_contract$, the higher that $game_concept_task_contract_possessive$ [task_contract_tier_tier|E]. Higher tiers pay #EMP substantially#! better.\n\n#alert_trial Beware [criminal_task_contracts|E]: their rewards are often excellent, but the world has far less understanding for the petty crimes of some homeless vagrant than a [landed|E] [liege|E].#! | TR: $game_concept_task_contracts$ [Concept('adventurers', 'Maceracıların')|E] [gold|E] veya [prestige|E] kazanmasının başlıca yoludur. Bunlara ek olarak [provision|E], [piety|E] ve hatta [artifacts|E] elde edilebilir.\n\nSözleşmeler yerel bir [ruler|E] tarafından gerçekleştirilmesi istenen, genellikle $game_concept_adventurer$nın ücret karşılığında bir [scheme|E] tamamlamasını, [travel|E] tamamlamasını veya onlara içerisinde bulundukları [Concept('war', 'Savaşta')|E] yardım etmesini gerektiren görevlerdir. Sözleşme tamamlandığında [Concept('contractor', 'İşveren')|E] [Concept('contact_list', 'Bağlantı Listesinde')|E] yer edinir.\n\nUzun seyahatler sonrasında veya yeni [Concept('kingdoms', 'Krallıklara')|E] seyahat edilmesiyle yeni $game_concept_task_contracts$ belirir.\n\n$game_concept_task_contract$ öneren $game_concept_ruler$ın [Concept('title_tier', 'Kademesi')|E] ne kadar yüksekse, $game_concept_task_contract_possessive$ [Concept('task_contract_tier_tier', 'Kademesi')|E] de o kadar yüksektir. Yüksek kademe sözleşmeler #EMP çok daha fazla#! ücrete sahiptir.\n\n#alert_trial [Concept('criminal_task_contracts', 'Suç Sözleşmelerine')|E] dikkat edin: ücretleri harikadır fakat dünya [landed|E] bir [Concept('liege', 'Süzerene')|E] nazaran evsiz bir haydutun işlediği suçlara karşı çok daha az sabır gösterir.#!]
 game_concept_task_contract_desc: "$game_concept_task_contracts$ are the primary way that [adventurers|E] make [gold|E] or [prestige|E]. They can also award [provisions|E], [piety|E], and even [artifacts|E].\n\nEach one is a task put out by a local [ruler|E] — generally requiring the $game_concept_adventurer$ to perform a [scheme|E], complete a [travel|E], or help them in [war|E] — and can be undertaken for a reward and to put the [contractor|E] on the [contact_list|E].\n\nMore $game_concept_task_contracts$ are spawned by traveling either long distances or to new [kingdoms|E].\n\nThe higher the [title_tier|E] or the $game_concept_ruler$ offering a $game_concept_task_contract$, the higher that $game_concept_task_contract_possessive$ [task_contract_tier_tier|E]. Higher tiers pay #EMP substantially#! better.\n\n#alert_trial Beware [criminal_task_contracts|E]: their rewards are often excellent, but the world has far less understanding for the petty crimes of some homeless vagrant than a [landed|E] [liege|E].#!"
