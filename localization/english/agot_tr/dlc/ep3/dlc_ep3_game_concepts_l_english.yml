### TODO AGOT-CHANGED: game_concept_governor_desc [AGOT: A $game_concept_governor$ is the primary vassal of a [liege|E] with a [government_bureaucratic_gov|E]. They are appointed by their Liege to preside over the lands within the [realm|E], utilizing their [governor_efficiency|E].\n\nA $game_concept_governor$'s [title|E], as well as the [counties|E] it includes, is referred to as a [province|E]. [governance_issues|E] may appear inside a Province, which the $game_concept_governor$ has to solve.\n\n$game_concept_governors$ can accumulate [influence|E] and manipulate the [succession|E] of other $game_concept_governorships$. | TR: $game_concept_governor$, [Concept('government_bureaucratic_gov', 'Bürokratik Yönetimlere')|E] sahip [Concept('liege', 'Süzerenlerin')|E] başlıca vasalıdır. Süzeren tarafından, [Concept('realm', 'Ülkenin')|E] belli bir bölümünü yönetmek üzere atanırlar ve sahip oldukları [Concept('governor_efficiency', 'Vali Verimliliğinden')|E] faydalanırlar.\n\n$game_concept_governor$nin [Concept('title', 'Unvanı')|E], beraberindeki [counties|E] ile birlikte [province|E] olarak adlandırılır. Eyalet içerisinde [governance_issues|E] belirebilir, $game_concept_governor$ olarak bu meseleleri çözmeniz gerekir.\n\n$game_concept_governors$ [influence|E] biriktirerek diğer $game_concept_governorships$in [Concept('succession', 'Verasetini')|E] manipüle edebilir.]
 game_concept_governor_desc: "A $game_concept_governor$ is the primary vassal of a [liege|E] with a [government_bureaucratic_gov|E]. They are appointed by their Liege to preside over the lands within the [realm|E], utilizing their [governor_efficiency|E].\n\nA $game_concept_governor$'s [title|E], as well as the [counties|E] it includes, is referred to as a [province|E]. [governance_issues|E] may appear inside a Province, which the $game_concept_governor$ has to solve.\n\n$game_concept_governors$ can accumulate [influence|E] and manipulate the [succession|E] of other $game_concept_governorships$."
