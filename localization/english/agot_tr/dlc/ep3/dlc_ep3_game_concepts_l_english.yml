### TODO AGOT-CHANGED: game_concept_follower_desc [AGOT: A $game_concept_follower$ is an [unlanded|E] character who accompanies an [adventurer|E].\n\nMechanically, they are equivalent to [courtiers|E], though they are under less obligation to show respect or hang around if they dislike their leader.\n\nThe collective [opinion|E] of a character's $game_concept_followers$ determine their [camp_temperament|E].\n\n$game_concept_followers$ can:\n$BULLET_WITH_TAB$Serve as [officers|E]\n$BULLET_WITH_TAB$Serve in [armies|E] as [commanders|E] or [knights|E]\n$BULLET_WITH_TAB$Let their [adventurer|E] press their [claims|E] in [war|E] | TR: Bir [Concept('adventurer', 'Maceracıya')|E] eşlik eden [unlanded|E] karakterlere $game_concept_follower$ denir.\n\nMekanik olarak [courtiers|E] ile benzeşirler fakat liderlerinden hazzetmemeleri durumunda saygı göstermeye ve sabretmeye daha az meyillidirler.\n\n$game_concept_followers$in karaktere olan ortak [Concept('opinion', 'Görüşü')|E] [Concept('camp_temperament', 'Kamp Huzurunu')|E] belirler.\n\n$game_concept_followers$:\n$BULLET_WITH_TAB$[officer|E] olarak hizmet edebilir\n$BULLET_WITH_TAB$[commander|E] veya [knight|E] olarak [Concept('armies', 'Orduda')|E] hizmet edebilir\n$BULLET_WITH_TAB$[adventurer|E] karakterler tarafından [claims|E] [Concept('war', 'Savaşta')|E] ele geçirilebilir]
 game_concept_follower_desc: "A $game_concept_follower$ is an [unlanded|E] character who accompanies an [adventurer|E].\n\nMechanically, they are equivalent to [courtiers|E], though they are under less obligation to show respect or hang around if they dislike their leader.\n\nThe collective [opinion|E] of a character's $game_concept_followers$ determine their [camp_temperament|E].\n\n$game_concept_followers$ can:\n$BULLET_WITH_TAB$Serve as [officers|E]\n$BULLET_WITH_TAB$Serve in [armies|E] as [commanders|E] or [knights|E]\n$BULLET_WITH_TAB$Let their [adventurer|E] press their [claims|E] in [war|E]"
