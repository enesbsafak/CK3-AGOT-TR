### TODO AGOT-CHANGED: game_concept_adventurer_desc [AGOT: An $game_concept_adventurer$ is an [unlanded|E] [character|E] who leads a [camp|E].\n\nThey do not have [vassals|E], nor do they earn income passively in the usual fashion — instead, they must take [task_contracts|E] to earn their coin, or call in favors from their [contact_list|E].\n\n$game_concept_adventurers$ may freely roam the map. Their main concern is making sure they have enough [provisions|E] to survive on the move.\n\nInstead of [crown_authority|E], most $game_concept_adventurers$ will set a [camp_purpose|E]. This indicates what type of group they have and why they stick together.\n\n#WEAK Driven seventh sons with no inheritance, ambitious nomads, petulant run-aways, curious scholars, vicious sell-swords, and deposed nobles alike all flesh out the ranks of these tireless wanderers.\n\nTheir sole uniting factor is a hunger for something more than a quiet life of obscurity, and the will to do something about it.#! | TR: Bir [Concept('camp', 'Kampa')|E] liderlik eden [unlanded|E] [Concept('character', 'Karakterlere')|E] $game_concept_adventurer$ denir.\n\n[vassals|E] yoktur ve normal yöntemlerle gelir elde etmezler, bunun yerine para kazanabilmek için [Concept('task_contracts', 'Sözleşmeler')|E] yapmaları gerekir veya [contact_list|E] üzerinden yardım isteyebilir.\n\n$game_concept_adventurers$ haritada özgürce dolaşabilirler. Öncelikli kaygıları, hayatta kalabilmek için yeterli [Concept('provisions', 'Erzaka')|E] sahip olmaktır.\n\n[crown_authority|E] yerine, çoğu $game_concept_adventurers$ bir [Concept('camp_purpose', 'Kamp Amacına')|E] sahiptir. Bu, ne tür bir grup olduklarını ve neden birlikte olduklarını gösterir.\n\n#WEAK Bu gezginler miras şansı olmayan yedinci çocuklar, hırslı göçebeler, hırçın firariler, meraklı âlimler, kurnaz paralı askerler ve sürgün edilmiş soylular olabilir.\n\nBunları bir araya getiren yegâne unsur, bilinmezlik dolu bir hayattan daha fazlasını arzulamaları ve bunun için yola koyulmuş olmalarıdır.#!]
 game_concept_adventurer_desc: "An $game_concept_adventurer$ is an [unlanded|E] [character|E] who leads a [camp|E].\n\nThey do not have [vassals|E], nor do they earn income passively in the usual fashion — instead, they must take [task_contracts|E] to earn their coin, or call in favors from their [contact_list|E].\n\n$game_concept_adventurers$ may freely roam the map. Their main concern is making sure they have enough [provisions|E] to survive on the move.\n\nInstead of [crown_authority|E], most $game_concept_adventurers$ will set a [camp_purpose|E]. This indicates what type of group they have and why they stick together.\n\n#WEAK Driven seventh sons with no inheritance, ambitious nomads, petulant run-aways, curious scholars, vicious sell-swords, and deposed nobles alike all flesh out the ranks of these tireless wanderers.\n\nTheir sole uniting factor is a hunger for something more than a quiet life of obscurity, and the will to do something about it.#!"
