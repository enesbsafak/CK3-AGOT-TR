### TODO AGOT-CHANGED: game_concept_contractor_desc [AGOT: A $game_concept_contractor$ is the [character|E] putting out a $game_concept_task_contract$.\n\nThe $game_concept_task_contract$ will generally chiefly affect them, and they are usually the one paying an [adventurer_possessive|E] wages.\n\n#N [criminal_task_contracts|E] are generally #BOL not#! put out by their $game_concept_contractor$, and instead focus on exploiting them — for instance, tricking someone into giving you [gold|E] because they signaled their gullability.#! | TR: $game_concept_task_contract$ veren [Concept('character', 'Karakterlere')|E] $game_concept_contractor$ denir.\n\nVerdikleri $game_concept_task_contract$ genellikle onları etkileyecek türden olacaktır ve genellikle [adventurer_possessive|E] ücretini onlar karşılar.\n\n#N [criminal_task_contracts|E] genellikle $game_concept_contractor$ tarafından #BOL verilmez#!, onun yerine onları suistimal etmeye odaklanır - örneğin kolay güvendiğini belli eden birini kandırarak [Concept('gold', 'Altınını')|E] almak gibi.#!]
 game_concept_contractor_desc: "A $game_concept_contractor$ is the [character|E] putting out a $game_concept_task_contract$.\n\nThe $game_concept_task_contract$ will generally chiefly affect them, and they are usually the one paying an [adventurer_possessive|E] wages.\n\n#N [criminal_task_contracts|E] are generally #BOL not#! put out by their $game_concept_contractor$, and instead focus on exploiting them — for instance, tricking someone into giving you [gold|E] because they signaled their gullability.#!"
