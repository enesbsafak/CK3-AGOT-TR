### TODO AGOT-CHANGED: game_concept_estate_desc [AGOT: An $game_concept_estate$ is a type of [domicile|E] held by the [house_head|E] of notable [noble_families|E] within [administrative|E] [realms|E]. They represent private landholdings untied to any particular [landed|E] [title|E].\n\n[estate_buildings|E] may be constructed here to expand the family's wealth and [influence|E], and the $game_concept_estate$ will be inherited by future generations. | TR: $game_concept_estate$, [administrative|E] [Concept('realms', 'Ülkelerde')|E] [Concept('noble_families', 'Soylu Ailelerin')|E] [house_head|E] tarafından sahip olunan bir [domicile|E] türüdür. [landed|E] bir [Concept('title', 'Unvandan')|E] bağımsız olarak sahip olunan kişisel mülkleri yansıtırlar.\n\nAilenin servetini ve [Concept('influence', 'Nüfuzunu')|E] güçlendirmek adına burada [estate_buildings|E] inşa edilebilir, sonraki nesiller $game_concept_estate$yi miras olarak devralırlar.]
 game_concept_estate_desc: "An $game_concept_estate$ is a type of [domicile|E] held by the [house_head|E] of notable [noble_families|E] within [administrative|E] [realms|E]. They represent private landholdings untied to any particular [landed|E] [title|E].\n\n[estate_buildings|E] may be constructed here to expand the family's wealth and [influence|E], and the $game_concept_estate$ will be inherited by future generations."
