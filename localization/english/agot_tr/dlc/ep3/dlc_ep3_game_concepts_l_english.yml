### TODO AGOT-CHANGED: game_concept_camp_temperament_desc [AGOT: Unlike the rigid hierarchy of a [court|E], $game_concept_camps$ are largely informal places where grumbling from important [characters|E] #EMP other#! than the leading [adventurer|E] can matter a great deal.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$ confer positive [character_modifiers|E] on their $game_concept_adventurer$. They require the majority [opinion|E] of all named [characters|E] to be [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] or more.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$ apply negative $game_concept_character_modifiers$ to their $game_concept_adventurer$. They require the majority $game_concept_opinion$ of all named $game_concept_characters$ to be [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] or less.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_camps$ are any where the range of $game_concept_opinions$ fall between these two extremes. They apply no $game_concept_modifiers$.\n\n#WEAK The effects of $game_concept_camp_temperament$ scale with an $game_concept_adventurer_possessive$ [prestige_level|E]. The more famous the $game_concept_adventurer$, the more dramatic the possible benefits — and drawbacks — of the atmosphere in their $game_concept_camp$.#! | TR: $game_concept_camps$, [Concept('court', 'Saraylardan')|E] farklı olarak katı bir hiyerarşiye sahip değildir ve Kampa liderlik eden [adventurer|E] #EMP dışındaki#! önemli [Concept('characters', 'Karakterlerin')|E] homurdanmaları ciddi rahatsızlıklara sebep olabilir.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$, $game_concept_adventurer$ için pozitif [character_modifiers|E] sağlarlar. Bunun için tüm [Concept('characters', 'Karakterlerin')|E] çoğunluk [Concept('opinion', 'Görüşünün')|E] [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] veya yukarısında olması gerekir.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$, $game_concept_adventurer$ için negatif $game_concept_character_modifiers$ verir. Bunun için tüm [Concept('characters', 'Karakterlerin')|E] çoğunluk [Concept('opinion', 'Görüşünün')|E] [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] veya altında olması gerekir.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_opinion$ü bu iki sınırın arasında olan $game_concept_camps$ herhangi bir $game_concept_modifiers$ vermezler.\n\n#WEAK $game_concept_camp_temperament$nun etkisi $game_concept_adventurer_possessive$ [prestige_level|E] ile doğru orantılıdır. $game_concept_adventurer$, ne kadar tanınıyorsa, $game_concept_camp$ın potansiyel faydaları - ve zararları da o kadar keskin olur.#!]
 game_concept_camp_temperament_desc: "Unlike the rigid hierarchy of a [court|E], $game_concept_camps$ are largely informal places where grumbling from important [characters|E] #EMP other#! than the leading [adventurer|E] can matter a great deal.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$ confer positive [character_modifiers|E] on their $game_concept_adventurer$. They require the majority [opinion|E] of all named [characters|E] to be [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] or more.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$ apply negative $game_concept_character_modifiers$ to their $game_concept_adventurer$. They require the majority $game_concept_opinion$ of all named $game_concept_characters$ to be [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] or less.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_camps$ are any where the range of $game_concept_opinions$ fall between these two extremes. They apply no $game_concept_modifiers$.\n\n#WEAK The effects of $game_concept_camp_temperament$ scale with an $game_concept_adventurer_possessive$ [prestige_level|E]. The more famous the $game_concept_adventurer$, the more dramatic the possible benefits — and drawbacks — of the atmosphere in their $game_concept_camp$.#!"
