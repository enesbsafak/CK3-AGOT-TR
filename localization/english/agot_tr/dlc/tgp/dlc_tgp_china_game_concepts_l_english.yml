### TODO AGOT-CHANGED: game_concept_mandate_of_heaven_desc [AGOT: The $game_concept_mandate_of_heaven$ is a special type of [legitimacy|E] only available to [son_of_heaven|E]. It represents the monarch's right to rule, and who is considered the supreme ruler under all of heaven.\n\nThe Mandate is closely connected to the [dynastic_cycle|E]. The Cycle affect how the reigning monarch gains Legitimacy and may also change [situation_dynastic_cycle_phase|E] based on the monarch's level of Mandate. | TR: $game_concept_mandate_of_heaven$, yalnızca [Concept('son_of_heaven', 'Göklerin Oğluna')|E] özgü özel bir [legitimacy|E] türüdür. Hükümdarın hükmetme hakkını ve gökyüzünün altındaki en yüce hükümdarın kim olduğunu temsil eder.\n\nBu yetki, [dynastic_cycle|E] ile yakından bağlantılıdır. Döngü, mevcut hükümdarın Meşruiyet kazanma biçimini etkiler ve hükümdarın yetki seviyesine bağlı olarak [Concept('situation_dynastic_cycle_phase', 'Hanedan Döngü Çağını')|E] değiştirebilir.]
 game_concept_mandate_of_heaven_desc: "The $game_concept_mandate_of_heaven$ is a special type of [legitimacy|E] only available to [son_of_heaven|E]. It represents the monarch's right to rule, and who is considered the supreme ruler under all of heaven.\n\nThe Mandate is closely connected to the [dynastic_cycle|E]. The Cycle affect how the reigning monarch gains Legitimacy and may also change [situation_dynastic_cycle_phase|E] based on the monarch's level of Mandate."
