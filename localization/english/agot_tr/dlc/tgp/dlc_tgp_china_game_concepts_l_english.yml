### TODO AGOT-CHANGED: game_concept_exam_score_desc [AGOT: The $game_concept_exam_score$ determines how likely an entrant is to pass a [imperial_examination|E]\n\nThe score is based on the entrant's [learning|E], [stewardship|E] and [martial|E] [skills|E] depending on the focus of the $game_concept_examination$.\n\nOnly the top ten entrants in the [GetActivityType('activity_imperial_examination').GetName] [activity|E] may attempt the @palace_exam_icon! #V Palace Examination#!. | TR: $game_concept_exam_score$, bir adayın [imperial_examination|E] sınavını geçme olasılığını belirler.\n\nBaşlangıç puanı, adayın [GetTrait('confucian_education').GetName(GetNullCharacter)] [Concept('trait', 'Özelliğine')|E] ve $game_concept_examination$ın odağına bağlı olarak [learning|E], [stewardship|E] ve [martial|E] [Concept('skills', 'Becerilerine')|E] göre hesaplanır.\n\nYalnızca [GetActivityType('activity_imperial_examination').GetName] [Concept('activity', 'Etkinliğindeki')|E] en yüksek puan sahibi on aday @palace_exam_icon! #V Saray Sınavı#!'na katılabilir.]
 game_concept_exam_score_desc: "The $game_concept_exam_score$ determines how likely an entrant is to pass a [imperial_examination|E]\n\nThe score is based on the entrant's [learning|E], [stewardship|E] and [martial|E] [skills|E] depending on the focus of the $game_concept_examination$.\n\nOnly the top ten entrants in the [GetActivityType('activity_imperial_examination').GetName] [activity|E] may attempt the @palace_exam_icon! #V Palace Examination#!."
