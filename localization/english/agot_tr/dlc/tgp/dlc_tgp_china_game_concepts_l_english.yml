### TODO AGOT-CHANGED: game_concept_favored_movement_desc [AGOT: The $game_concept_favored_movement$ is the [movement|E] that has gained the support of [son_of_heaven|E]. | TR: $game_concept_favored_movement$, [Concept('son_of_heaven','Göklerin Oğlunun')|E] desteğini kazanmış olan [Concept('movement','Harekettir')|E].\n$BULLET_WITH_TAB$Üyeler, [SelectLocalization(GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china')] ülkesindeki herhangi bir [title|E] için fazladan [candidate_scores|E] elde eder\n$BULLET_WITH_TAB$[GetDecision('movement_petition_decision').GetName] [Concept('decision', 'Kararı')|E] üzerinden yapılan arzuhâllerin kabul edilme olasılığı artar\n$BULLET_WITH_TAB$[Concept('dynastic_cycle','Hanedan Döngüsü')|E] [Concept('situation_catalyst_catalysts','Tetikleyicileri')|E], hangi [Concept('movement', 'Hareketin')|E] desteklendiğine göre tetiklenir\n$BULLET_WITH_TAB$[GetDecision('favored_movement_consults_heaven_decision').GetName] [Concept('decision', 'Kararı')|E] açılır\n\n#help Gözde Hareket olmak için mevcuttaki Gözde Hareketin liderini [GetActivityType('activity_debate').GetName] [Concept('activity', 'Etkinliğinde')|E] yenmelisiniz.#!]
