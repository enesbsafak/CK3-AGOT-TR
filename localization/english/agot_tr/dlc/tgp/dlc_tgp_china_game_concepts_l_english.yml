 game_concept_personal_movement_power_desc: "$game_concept_personal_movement_power$, bir üyenin bağlı bulunduğu [Concept('movement','Hareketin')|E] genel [Concept('movement_power_short','Gücünü')|E] ne kadar arttırdığını gösterir."
