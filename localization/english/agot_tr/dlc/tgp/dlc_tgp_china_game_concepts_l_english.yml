 game_concept_elder_desc: "$game_concept_elder$, bir veya daha fazla [Concept('disciples', 'Nefere')|E] sahip olan, öğretilerinin takip edildiği [Concept('character', 'Karakterdir')|E].\n\n$disciple_elder_benefits_tt$"
 game_concept_earthquake: "Deprem"
 game_concept_earthquakes: "Depremler"
 game_concept_earthquake_desc: "$game_concept_earthquake$, az sayıda [Concept('counties', 'Kontlukta')|E] ani ve ağır yıkıma neden olan bir [natural_disaster|E] türüdür.\n$game_concept_earthquakes$, yalnızca sismik etkinliğe daha yatkın bölgelerde meydana gelebilir."
 game_concept_flood: "Sel"
 game_concept_floods: "Seller"
 game_concept_flooded: "Sular Altında"
 game_concept_flood_desc: "$game_concept_flood$, çok sayıda [Concept('counties', 'Kontlukta')|E] giderek artan hasara neden olan bir [natural_disaster|E] türüdür.\n$game_concept_floods$, yalnızca büyük nehirlerin kıyılarında meydana gelebilir."
