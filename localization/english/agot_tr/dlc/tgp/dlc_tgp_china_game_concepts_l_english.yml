 game_concept_son_of_heaven: "Son of Heaven"
### TODO AGOT-CHANGED: game_concept_son_of_heaven_desc [AGOT: The $game_concept_son_of_heaven$ is the [hegemon|E] of China and the [top_liege|E] of the [celestial_government|E].\n\nThe $game_concept_son_of_heaven$ has a special form of [legitimacy|E], the [mandate_of_heaven|E], and a unique [situation_participant_group|E] simply called $game_concept_son_of_heaven$. | TR: $game_concept_son_of_heaven$, Çin'in [Concept('hegemon', 'Hegemonu')|E] ve [Concept('celestial_government', 'Semavi Yönetimin')|E] [Concept('top_liege', 'Ana Süzerenidir')|E].\n\n$game_concept_son_of_heaven$, [mandate_of_heaven|E] adı verilen özel bir [legitimacy|E] biçimine ve yalnızca $game_concept_son_of_heaven$ olarak adlandırılan özel bir [Concept('situation_participant_group', 'Katılımcı Grubuna')|E] sahiptir.]
 game_concept_son_of_heaven_desc: "The $game_concept_son_of_heaven$ is the [hegemon|E] of China and the [top_liege|E] of the [celestial_government|E].\n\nThe $game_concept_son_of_heaven$ has a special form of [legitimacy|E], the [mandate_of_heaven|E], and a unique [situation_participant_group|E] simply called $game_concept_son_of_heaven$."
### TODO AGOT-CHANGED: game_concept_treasury [AGOT: Treasury | TR: Hazine]
 game_concept_treasury: "Treasury"
### TODO AGOT-CHANGED: game_concept_treasury_desc [AGOT: In certain [administrative_governments|E], Treasury represents assets that may only be used for governmental purposes, in contrast with your personal [gold|E].\n\n$BULLET$#indent_newline:2 As a [vassal|E], you will receive Treasury from your [liege|E], based on your [tax|E] contributions and other obligations#!\n$BULLET$#indent_newline:2 Treasury is created by the [top_liege|e], who converts a percentage of [taxation|E] income into Treasury#!\n$BULLET$#indent_newline:2 You can transfer [gold|E] to the Treasury at will#!\n$BULLET$#indent_newline:2 The Treasury stays with the [title|E] if it gets a new [holder|E]#! | TR: Bazı [Concept('administrative_governments','İdari Yönetim')|E] sistemlerinde Hazine, kişisel [Concept('gold','Altın')|E] varlığınızdan farklı olarak yalnızca devlet işlerinde kullanılabilecek kaynakları temsil eder.\n\n$BULLET$#indent_newline:2 Bir [Concept('vassal','Vasal')|E] olarak, [Concept('liege','süzereninizden')|E] [Concept('tax','Vergi')|E] katkılarınıza ve diğer yükümlülüklerinize göre Hazine alırsınız#!\n$BULLET$#indent_newline:2 Hazine, [Concept('top_liege','Ana Süzeren')|E] tarafından yaratılır, bu kişi [Concept('taxation','Vergi')|E] gelirinin bir kısmını Hazineye dönüştürür#!\n$BULLET$#indent_newline:2 Dilediğiniz zaman [Concept('gold','Altınınızı')|E] Hazineye aktarabilirsiniz#!\n$BULLET$#indent_newline:2 Hazine, bir [Concept('holder','Sahibi')|E] değiştiğinde [Concept('title','Unvanla')|E] birlikte kalır#!]
 game_concept_treasury_desc: "In certain [administrative_governments|E], Treasury represents assets that may only be used for governmental purposes, in contrast with your personal [gold|E].\n\n$BULLET$#indent_newline:2 As a [vassal|E], you will receive Treasury from your [liege|E], based on your [tax|E] contributions and other obligations#!\n$BULLET$#indent_newline:2 Treasury is created by the [top_liege|e], who converts a percentage of [taxation|E] income into Treasury#!\n$BULLET$#indent_newline:2 You can transfer [gold|E] to the Treasury at will#!\n$BULLET$#indent_newline:2 The Treasury stays with the [title|E] if it gets a new [holder|E]#!"
