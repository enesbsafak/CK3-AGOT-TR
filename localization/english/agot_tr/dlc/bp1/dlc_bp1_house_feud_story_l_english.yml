 game_concept_house_feuds: "Feuds"
 game_concept_house_feud_desc:4 "Kimi zaman kişisel rekabetler, [Concept( 'house', 'Haneler' )|E] arasında bir kan davasına dönüşebilir.\n\n#help Düşman hane üyelerini öldürmek, işkenceye maruz bırakmak, boynuzlamak, soymak ve onlara karşı [wars|E] kazanmak sizin hanenizin puanınını arttırırken, bu eylemlere maruz kalmak puanınızı azaltır.\n\nKan Davası esnasında, tüm [house|E] üyeleri, düşman haneye karşı [hostile_scheme|E] avantajı elde ederler ve karşı haneden kişileri hedef almaya daha meyilli olurlar.\n\nKan Davası sona erdiğinde haneniz, düşman haneye verdiği zarar göre [GetModifier('house_feud_terrible_modifier').GetNameWithTooltip] ila [GetModifier('house_feud_excellent_modifier').GetNameWithTooltip] arasında bir ödül elde eder.#!"
 swap_feud_tt:0 "[house_feud_existing.GetBaseName] [Concept( 'house', 'Hanesiyle' )|E] olan [Concept( 'house_feud', 'Kan Davasını' )|E] Sona Erdir"
