l_english:
 game_concept_struggle:1 "Mücadele"
 game_concept_struggle_struggles:0 "Mücadeleler"
 game_concept_struggle_desc:2 "$game_concept_struggle_struggles$, birçok [Concept( 'faiths', 'Mezhebi' )|E] ve [Concept( 'cultures', 'Kültürü' )|E] içine alan büyük [Concept( 'struggle_region_regions', 'Bölgelerdeki' )|E] uzun süreli çatışmalardır. Mücadelenin sınırları içerisinde zamanla değişen ilginç özel kurallar ve [Concept( 'modifiers', 'etkiler' )|E] olabilir. On yıllar ve yüzyıllar sürdüğü için mücadeledeki bütün [characters|E] her zaman birbirleriyle [Concept( 'war', 'Savaşta' )|E] değildir.\n\nHer mücadele çeşitli [Concept( 'struggle_phase_phases', 'Aşamalardan' )|E] oluşur. [Concept( 'struggle_region', 'Mücadele Bölgesi' )|E] içerisindeki karakterler eylemlerde bulundukça (savaş ilan etmek, [Concept( 'marrying', 'evlenmek' )|E] vs.) farklı aşamalara doğru ilerleme sağlayan [Concept( 'struggle_catalyst_catalysts', 'Tetikleyicileri' )|E] aktifleştirebilirler.\n\nBölgede [Concept( 'land', 'toprak' )|E] sahibi olan karakterler, diğer katılımcılar tarafından mücadelenin ne kadar önemli bir parçası olarak görüldüklerine göre [struggle_involved|E], [struggle_interloper_interlopers|E] veya [struggle_uninvolved|E] sayılır."
 game_concept_struggle_phase:1 "Mücadele Aşaması"
 game_concept_struggle_phase_phase:1 "Aşama"
 game_concept_struggle_phase_phases:0 "Aşamalar"
 game_concept_struggle_phase_desc:1 "Mücadele Aşaması, [Concept( 'struggle_region', 'Bölge' )|E] içerisindeki [struggle_involved|E] [Concept( 'characters', 'Karakterlerin' )|E] ve [Concept( 'counties', 'Kontlukların' )|E] ruh halini yansıtır diyebiliriz. [Concept( 'struggle', 'Mücadele' )|E] diyaloğuna hâkim olan kısa süreli toplumsal eğilimleri ve geçici tavrı temsil eder.\n\n#weak Örneğin bir aşamada, bölgedeki insanlar mezhebin geri kalanının aksine dinî hoşgörünün çok önemli olduğunu düşünmeye başlayabilir.#!"
 game_concept_struggle_catalyst:1 "Mücadele Tetikleyicisi"
 game_concept_struggle_catalyst_catalyst:1 "Tetikleyici"
 game_concept_struggle_catalyst_catalysts:0 "Tetikleyiciler"
 game_concept_struggle_catalyst_desc:2 "[struggle_struggles|E], [Concept( 'struggle_region', 'bölgedeki' )|E] insanların tavrını değiştirecek kayda değer gelişmeler yaşandıkça çeşitli [struggle_phase_phases|E] arasında gidip gelir. Hangi aşama için hangi eylemlerin kayda değer olduğunu Mücadele arayüzünde görebilirsiniz.\n\n#weak Örneğin, [Concept( 'iberian_struggle', 'İberya Mücadelesinin' )|E] [struggle_phase_iberia_opportunity|E] ya [Concept( 'struggle_phase_iberia_hostility', 'Düşmanlık Aşamasına' )|E] ya da [Concept( 'struggle_phase_iberia_conciliation', 'Uzlaşma Aşamasına' )|E] evrilebilir. Önemli bir [Concept( 'character', 'karakteri' )|E] öldürmek ilkine daha yaklaştırırken farklı [Concept( 'faith', 'mezhepten' )|E] biriyle [Concept( 'marriage', 'evlilik' )|E] [Concept( 'alliance', 'ittifakı' )|E] kurmak diğerinde ilerleme verir."
 game_concept_struggle_large_conquest:1 "Büyük Mücadele Fethi"
 game_concept_struggle_large_conquest_desc:1 "Bazı tetikleyiciler saldıran tarafın büyük bir [war|E] zaferi elde etmesini gerektiriyor.\n\nAşağıdaki [casus_bellis|E] büyük zafer için geçerlidir:\n$EFFECT_LIST_BULLET$ $duchy_conquest_cb$ \n$EFFECT_LIST_BULLET$ $individual_duchy_de_jure_cb$ \n$EFFECT_LIST_BULLET$ $imperial_reconquest_cb$ \n$EFFECT_LIST_BULLET$ $invasion_war$ \n$EFFECT_LIST_BULLET$ $clan_invasion_war$ \n$EFFECT_LIST_BULLET$ $mongol_invasion_war$ \n$EFFECT_LIST_BULLET$ $major_religious_war$ $game_concept_war$ \n$EFFECT_LIST_BULLET$ Hem [great_holy_war_directed|E] hem de [great_holy_war_undirected|E] Kutsal Savaşlar \n$EFFECT_LIST_BULLET$ $tribal_subjugation_cb$"
 game_concept_struggle_conquest:1 "Mücadele Çarpışmaları"
 game_concept_struggle_conquest_conquest:1 "Çarpışma"
 game_concept_struggle_conquest_conquests:0 "Çarpışmalar"
 game_concept_struggle_conquest_desc:2 "[struggle_phase|E] arasında geçiş yaptıkça değişen tavırlara göre [Concept( 'struggle', 'Mücadeledeki' )|E] [Concept( 'rulers', 'Hükümdarlar' )|E] da sınır anlaşmazlıklarına ve önemsiz kavgalara dâhil olur. Herhangi bir toprakta isterseniz birçok çeşit ihtilaf bulabileceğiniz için hükümdarlar küçük boyutlu toprak fetihleriyle hedeflerini doğrudan yenebilir veya vasallaştırabilir.\n\nFetihler mücadelenin durumuna göre değiştiği için [prestige|E] miktarı da mevcut aşamaya göre belirlenir."
 game_concept_enforce_truce:0 "Ateşkese Zorlama"
 game_concept_enforced_truce:0 "Ateşkese Zorlandı"
 game_concept_enforce_truce_desc:2 "[struggle_involved|E] [rulers|E] tarafından kullanılabilen bu özel [interaction|E], bir [Concept( 'war', 'savaşın' )|E] [white_peace|E] ile sonuçlanmasını sağlar ve [truce|E] ilan eder.\n\nSadece en az bir tarafın [independent|E] veya aynı [Concept( 'realm', 'ülkeden' )|E] olduğu, daha düşük [Concept( 'rank', 'kademedeki' )|E], [struggle_involved|E] [Concept( 'rulers', 'hükümdarların' )|E] savaşlarını bitirmek için kullanılabilir."
