### TODO AGOT-CHANGED: game_concept_legend_promoter_desc [AGOT: A $game_concept_legend_promoter$ is a [ruler|E] that supports another ruler's [legend|E].\n\nA $game_concept_legend_promoter$ gets extra bonuses that vary depending on the [legend_type|E] and [legend_quality|E] of the $game_concept_legend$ in exchange for a monthly [gold|E] contribution. | TR: Başka bir [Concept( 'ruler', 'Hükümdarın' )|E] [Concept( 'legend', 'Destanını' )|E] destekleyen [Concept( 'ruler', 'Hükümdara' )|E] $game_concept_legend_promoter$ denir.\n\nBir $game_concept_legend_promoter$, aylık [gold|E] katkısı karşılığında Destanın [Concept( 'legend_type', 'Türüne' )|E] ve [Concept( 'legend_quality', 'Kalitesine' )|E] bağlı olarak [Concept( 'legend', 'Destanın' )|E] etkilerinden faydalanır.]
 game_concept_legend_promoter_desc: "A $game_concept_legend_promoter$ is a [ruler|E] that supports another ruler's [legend|E].\n\nA $game_concept_legend_promoter$ gets extra bonuses that vary depending on the [legend_type|E] and [legend_quality|E] of the $game_concept_legend$ in exchange for a monthly [gold|E] contribution."
