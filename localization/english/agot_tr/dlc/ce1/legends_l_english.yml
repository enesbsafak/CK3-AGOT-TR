### TODO AGOT-CHANGED: legend_chapter_extra_deed_ancestral_glory [AGOT: The beautiful countryside of [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] had fallen to brigands and bandits since the [ROOT.Legend.Custom('GetAncestorFirstNamePossessiveNoTooltip')] time, but [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] soon set to work righting wrongs and protecting the people [ROOT.Legend.GetProtagonist.GetSheHe] was to rightfully rule. | TR: [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] topraklarının güzel kırları [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')] zamanından bu yana çapulcuların ve kanunsuzların eline düştü lakin [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] derhâl işe koyulup yanlışları düzeltti ve halkını olması gerektiği gibi korudu.]
 legend_chapter_extra_deed_ancestral_glory: "The beautiful countryside of [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] had fallen to brigands and bandits since the [ROOT.Legend.Custom('GetAncestorFirstNamePossessiveNoTooltip')] time, but [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] soon set to work righting wrongs and protecting the people [ROOT.Legend.GetProtagonist.GetSheHe] was to rightfully rule."
### TODO AGOT-CHANGED: legend_chapter_famous_deed_war_won [AGOT: Battles waged back and forth, and war painted the land crimson with the blood of the righteous and villainous in equal measure. [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip|U] remained unshaken as the forces of evil attempted to outwit [ROOT.Legend.GetProperty( 'winner' ).Char.GetHerHis] masterful military stratagem. Ultimately their efforts would prove to be fruitless. | TR: Bitmek bilmeyen muharebeler ve savaşlar sonucunda tüm diyar hem iyilerin hem kötülerin kanıyla kızıla boyandı. [ROOT.Legend.GetProperty( 'winner' ).Char.GetTitledFirstNameNoTooltip|U], kötülüğün tohumları onun eşi benzeri görülmemiş askerî dehasının altını kazımaya çalışırken hiç endişe duymadı. Eninde sonunda da bu uğraşlarının boşuna olduğu kanıtlandı.]
 legend_chapter_famous_deed_war_won: "Battles waged back and forth, and war painted the land crimson with the blood of the righteous and villainous in equal measure. [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip|U] remained unshaken as the forces of evil attempted to outwit [ROOT.Legend.GetProperty( 'winner' ).Char.GetHerHis] masterful military stratagem. Ultimately their efforts would prove to be fruitless."
### TODO AGOT-CHANGED: legend_chapter_famous_deed_tournament_won [AGOT: Minds and voices clashed in equal measure to blades in a great show of the martial arts, but no mind was as clever nor blade as sharp as [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]! One after another, contestants lined up only to be brought to weeping by the untouchable [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. | TR: Çatışma alanında zihinler ve sesler, kılıçlar ile kıyaslanabilecek seviyede çarpıştı lakin ne bir zihin ne de bir kılıç [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ile mücadele edebildi! Birbirinin ardına yarışmacılar sıralandı ve hepsi tek tek amansız [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] tarafından yere serildi.]
 legend_chapter_famous_deed_tournament_won: "Minds and voices clashed in equal measure to blades in a great show of the martial arts, but no mind was as clever nor blade as sharp as [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]! One after another, contestants lined up only to be brought to weeping by the untouchable [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]."
### TODO AGOT-CHANGED: legend_chapter_extra_deed_tournament_won [AGOT: None could keep from remembering the glory of [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] first tournament, but a single victory was not enough for [ROOT.Legend.GetProtagonist.GetHerHim]. The other contestants surrounded [ROOT.Legend.GetProtagonist.GetHerHim] in a storm of blades, but [ROOT.Legend.GetProtagonist.GetSheHe] remained unshaken. [ROOT.Legend.GetProtagonist.GetSheHe|U] emerged victorious to a crowd screaming [ROOT.Legend.GetProtagonist.GetHerHis] name! | TR: Hiç kimse [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ve katıldığı ilk turnuvayı unutamaz lakin tek bir galibiyet onun için yeterli değildi. Diğer yarışmacılar etrafını kılıçlarıyla sarıyordu ancak o bundan hiç etkilenmeden olduğu yerde duruyordu. Tüm herkes onun adına tezahürat ederken galip geliyordu!]
 legend_chapter_extra_deed_tournament_won: "None could keep from remembering the glory of [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] first tournament, but a single victory was not enough for [ROOT.Legend.GetProtagonist.GetHerHim]. The other contestants surrounded [ROOT.Legend.GetProtagonist.GetHerHim] in a storm of blades, but [ROOT.Legend.GetProtagonist.GetSheHe] remained unshaken. [ROOT.Legend.GetProtagonist.GetSheHe|U] emerged victorious to a crowd screaming [ROOT.Legend.GetProtagonist.GetHerHis] name!"
### TODO AGOT-CHANGED: legend_chapter_extra_deed_recent_battle [AGOT: On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] valiantly fought [ROOT.Legend.GetProtagonist.GetHerHis] enemies, leading with unmatched courage and strategic brilliance. With [ROOT.Legend.GetProtagonist.GetHerHis] sword held high and his unwavering determination, he inspired victory against [ROOT.Legend.GetProtagonist.GetHerHis] foes. | TR: [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] vatanına geri dönerken düşmanlarıyla çetince savaştı, ordularını eşi benzeri görülmemiş bir cesaret ve stratejik deha ile yönetti. Havadaki kılıcı ve sarsılmaz iradesi ile düşmanlarına karşı galibiyeti kesinleştirdi.]
 legend_chapter_extra_deed_recent_battle: "On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] valiantly fought [ROOT.Legend.GetProtagonist.GetHerHis] enemies, leading with unmatched courage and strategic brilliance. With [ROOT.Legend.GetProtagonist.GetHerHis] sword held high and his unwavering determination, he inspired victory against [ROOT.Legend.GetProtagonist.GetHerHis] foes."
### TODO AGOT-CHANGED: legend_chapter_extra_deed_recent_tournament [AGOT: On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] was captivated by the splendor of glorious tournament grounds. With sword in hand and armor gleaming under the sun's gaze, [ROOT.Legend.GetProtagonist.GetSheHe] faced formidable opponents with unwavering resolve. The audience clamored, fair ladies and impressionable pages threw themselves at [ROOT.Legend.GetProtagonist.GetHerHis] feet! The winner! The best knight! | TR: [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] vatanına dönerken muazzam turnuva alanlarının çekiciliğine kapıldı. Elinde kılıcı ve güneşin altında parlayan zırhı ile yılmaz azme sahip rakipleriyle yüz yüze geldi. Seyirciler haykırdı, güzel hanımefendiler ve kolayca etkilenen yaverler kendilerini onun ayaklarına fırlattı! Galibiyetin sahibi! En iyi şövalye!]
 legend_chapter_extra_deed_recent_tournament: "On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] was captivated by the splendor of glorious tournament grounds. With sword in hand and armor gleaming under the sun's gaze, [ROOT.Legend.GetProtagonist.GetSheHe] faced formidable opponents with unwavering resolve. The audience clamored, fair ladies and impressionable pages threw themselves at [ROOT.Legend.GetProtagonist.GetHerHis] feet! The winner! The best knight!"
