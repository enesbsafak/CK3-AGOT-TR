### TODO AGOT-CHANGED: legend_chapter_battle_enemy_commander [AGOT: Amidst the melee, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] found themselves face to face with none other than the wretched enemy commander! After an almighty duel, the vile cur was smote down by [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U], blood running free down [ROOT.Legend.GetProtagonist.GetHerHis] blade as the battle swirled around them. | TR: Mücadele sırasında [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U], kendini sefil düşman komutanının karşısında buldu! Çetin bir düellonun ardından adi pislik [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] tarafından yere serildi, etrafındaki savaş devam ederken rakibinin kanı kılıcından damlıyordu.]
