### TODO AGOT-CHANGED: legend_chapter_extra_deed_struggle [AGOT: In spite of all the greatness [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had achieved, there were still those who doubted [ROOT.Legend.GetProtagonist.GetHerHis] vision to solve the [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]. [ROOT.Legend.GetProtagonist.GetHerHis|U] enemies were soon defeated on the battlefields of both debate and war, until all were grovelling at [ROOT.Legend.GetProtagonist.GetHerHis] feet and begging [ROOT.Legend.GetProtagonist.GetHerHis] mercy. | TR: [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], sayısız başarıya sahip olsa da [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] için sunduğu çözümlere şüpheyle yaklaşan insanlar vardı. Düşmanları hem tartışma hem de muharebe alanında kısa sürede bertaraf edildi, ta ki hepsi onun ayağına kapanıp merhamet dilenene kadar.]
 legend_chapter_extra_deed_struggle: "In spite of all the greatness [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had achieved, there were still those who doubted [ROOT.Legend.GetProtagonist.GetHerHis] vision to solve the [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]. [ROOT.Legend.GetProtagonist.GetHerHis|U] enemies were soon defeated on the battlefields of both debate and war, until all were grovelling at [ROOT.Legend.GetProtagonist.GetHerHis] feet and begging [ROOT.Legend.GetProtagonist.GetHerHis] mercy."
