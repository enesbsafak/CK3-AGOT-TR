### TODO AGOT-CHANGED: game_concept_legend [AGOT: Legend | TR: Destan]
 game_concept_legend: "Legend"
### TODO AGOT-CHANGED: game_concept_legend_desc [AGOT: A $game_concept_legend$ represents the important deeds that a Character achieved in life, and are created from [legend_seeds|E].\n\nLegends are powerful ways to obtain [legitimacy|E], and other possible rewards like [skill|E] increases, [opinion|E] bonuses, [dynasty_prestige|E], [prestige|E] or [piety|E]. [baronies|E] in which a $game_concept_legend$ has spread may also receive additional effects, if held by the $game_concept_legend$ owner or a [legend_promoter|E].\n\n$game_concept_legends$ have a [legend_type|E] that governs those rewards: they can be Legitimizing, Holy or Heroic. Each $game_concept_legend$ also has a [legend_quality|E] level, which influences the strength of those rewards, as well as its spread. | TR: $game_concept_legend$, bir Karakterin hayatta başardığı önemli işleri tasvir eder ve [legend_seeds|E] ile oluşturulur.\n\nDestanlar [legitimacy|E] elde etmenin etkili yollarından biridir. [skill|E] artışları, [opinion|E] bonusları, [dynasty_prestige|E], [prestige|E] veya [piety|E] olası ödüllerdendir. Bir [Concept( 'legend', 'Destanın' )|E] yayıldığı [Concept( 'baronies', 'Baronluklar' )|E] $game_concept_legend$ sahibi ya da [legend_promoter|E] tarafından tutulursa ek etkiler de alabilir.\n\n[Concept( 'legends', 'Destanların' )|E] ödüllere etki eden bir [legend_type|E] vardır ve bunlar: Meşrulaştırıcı, Kutsal veya Kahramanca olabilirler. Her [Concept( 'legend', 'Destanın' )|E] ayrıca bu ödüllerin gücünü ve yayılımını etkileyen bir [legend_quality|E] seviyesi vardır.]
 game_concept_legend_desc: "A $game_concept_legend$ represents the important deeds that a Character achieved in life, and are created from [legend_seeds|E].\n\nLegends are powerful ways to obtain [legitimacy|E], and other possible rewards like [skill|E] increases, [opinion|E] bonuses, [dynasty_prestige|E], [prestige|E] or [piety|E]. [baronies|E] in which a $game_concept_legend$ has spread may also receive additional effects, if held by the $game_concept_legend$ owner or a [legend_promoter|E].\n\n$game_concept_legends$ have a [legend_type|E] that governs those rewards: they can be Legitimizing, Holy or Heroic. Each $game_concept_legend$ also has a [legend_quality|E] level, which influences the strength of those rewards, as well as its spread."
### TODO AGOT-CHANGED: game_concept_owned_legend [AGOT: Owned Legend | TR: Sahip Olunan Destan]
 game_concept_owned_legend: "Owned Legend"
### TODO AGOT-CHANGED: game_concept_owned_legend_desc [AGOT: An $game_concept_owned_legend$ is a [legend|E] owned by a [ruler|E], who is the main beneficiary of its effects.\n\nThe owner of a $game_concept_legend$ can be its [legend_protagonist|E], but it's not necessary.\n\nA $game_concept_legend$ can also be supported by [legend_promoters|E], who pay a monthly contribution to also get part of its bonuses. | TR: $game_concept_owned_legend$, bir [ruler|E] tarafından sahip olunan bir [Concept( 'legend', 'Destandır' )|E]. Bu [ruler|E], [Concept( 'legend', 'Destanın' )|E] etkilerinin ana yararlanıcısıdır.\n\n$game_concept_legend$ sahibi [legend_protagonist|E] olabilir ancak bu şart değildir.\n\nBir $game_concept_legend$ bonuslarının bir kısmından faydalanmak için aylık katkı payı ödeyen [legend_promoters|E] tarafından desteklenebilir.]
 game_concept_owned_legend_desc: "An $game_concept_owned_legend$ is a [legend|E] owned by a [ruler|E], who is the main beneficiary of its effects.\n\nThe owner of a $game_concept_legend$ can be its [legend_protagonist|E], but it's not necessary.\n\nA $game_concept_legend$ can also be supported by [legend_promoters|E], who pay a monthly contribution to also get part of its bonuses."
