 learn_own_court_language_desc_general:0 "Saray Dilimi Öğren [Concept( 'scheme', 'planı' )|E], [Concept( 'royal_court', 'kraliyet sarayınızın' )|E] [Concept( 'court_language', 'saray dilini' )|E] öğrenmeye çalıştığınız bir [Concept( 'personal_scheme', 'kişisel plandır' )|E]. $learn_language_desc_general_shared$"
