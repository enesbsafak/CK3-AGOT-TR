 seduce:1 "Baştan Çıkarma"
 seduce_desc:0 "Güzel sözler ve jestlerle [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] adlı kişinin kalbini çalacağım - O benim olacak!"
 seduce_desc_general:1 "[Concept( 'scheme_target', 'Plan Hedefini' )|E] [lover|E] yapmayı amaçlayan [Concept( 'personal_schemes', 'kişisel planlara' )|E] $seduce$ denir.\n\nKarakter [Concept( 'opinion', 'görüşü' )|E], kişilik [Concept( 'trait', 'özelliklerinin' )|E] uyumu ve [marriage|E] durumu başta olmak üzere [Concept( 'success_chance', 'Başarı İhtimalini' )|E] etkileyen çok sayıda faktör vardır.\n\nBaştan Çıkarma Planları hedefin kim olduğuna bağlı olmak üzere [secret_scheme_single|E] olabilirler."
 sway:1 "Etkileme"
 sway_desc:0 "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] adlı kişiye kendimi anlatmaya ve benden hoşlanmasını sağlamaya çalışacağım."
 sway_desc_general:1 "Etkileme planı, bir başka karakterin size karşı olan [Concept( 'opinion', 'Görüşünü' )|E] yükseltmeyi amaçlayan [Concept( 'personal_schemes', 'kişisel planlara' )|E] denir. Bu Planlar büyük oranda karakterinizin [Concept( 'diplomacy', 'Diplomasisine' )|E] bağlıdır. [hostile_scheme|E] olmadığı için [secret_scheme_single|E] değildir ve [agent|E] kullanılmaz.\n\nBirçok Plandan farklı olarak Etkileme Planları tamamlandıktan sonra tekrar başlarlar. Bu şekilde elde ettiğiniz Görüş artışı birbirinin üstüne eklendiği için, bu Planı aktif tutmak [Concept( 'scheme_target', 'plan hedefinin' )|E] sizi gittikçe daha çok sevmesini sağlar."
