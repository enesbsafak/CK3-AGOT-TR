 abduct_desc:0 "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] adlı kişiyi kaçırıp [Concept( 'imprison', 'Hapsetmeye' )|E] çalışacağım!"
 abduct_desc_general:2 "Hedefi [Concept( 'imprison', 'Hapsetmeyi' )|E] amaçlayan [Concept( 'hostile_schemes', 'düşmancıl planlara' )|E] $abduct$ denir. [Concept( 'intrigue', 'Entrikaya' )|E] dayalı [secret_scheme_single|E] bir Plandır ve [Concept( 'agents', 'Yardakçılardan' )|E] yararlanılabilir.\n\n$abduct$nın başarılı olması durumunda [scheme_target|E] [scheme_owner|E] tarafından hapsedilir."
