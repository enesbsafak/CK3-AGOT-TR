 game_concept_board_game_type_tabula:0 "Tavla"
 game_concept_board_game_type_tabula_desc:1 "$game_concept_board_game_type_desc_guts$\n\nTavlada:\n$EFFECT_LIST_BULLET$ [intrigue|E], [Concept( 'learning', 'öğrenimi' )|E] karşılar\n$EFFECT_LIST_BULLET$ [learning|E], [Concept( 'stewardship', 'idareyi' )|E] karşılar\n$EFFECT_LIST_BULLET$ [stewardship|E], [Concept( 'intrigue', 'entrikayı' )|E] karşılar"
