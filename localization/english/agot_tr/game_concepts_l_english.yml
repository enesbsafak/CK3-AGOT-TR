### TODO AGOT-CHANGED: game_concept_dynast_desc [AGOT: A $game_concept_dynast$ is the [house_head|E] that heads the entire [dynasty|E] and all of its [houses|E].\n\nThe Dynasty Head wields certain unique powers over the members of the Dynasty, known as [dynast_interactions|E]. The $game_concept_dynast$ also picks [dynasty_perks|E] for the $game_concept_dynasty$.\n\nNormally, the $game_concept_dynast$ is the $game_concept_house_head$ that can have the most [soldiers|E]. If all $game_concept_house_heads$ have the [administrative|E] [government|E], the $game_concept_dynast$ is instead whoever has the highest [powerful_family_rating|E]. | TR: $game_concept_dynast$ tüm [dynasty|E] ve onun altındaki [Concept('houses', 'Hanelerin')|E] [Concept('house_head', 'Hane Reisidir')|E].\n\nHanedan Reisi Hanedan mensupları üzerinde çeşitli yetkilere sahiptir, bunlara [dynast_interactions|E] denir. $game_concept_dynasty$ın [dynasty_perks|E] $game_concept_dynast$ tarafından belirlenir.\n\nGenellikle, en fazla [Concept('soldier', 'Askere')|E] sahip $game_concept_house_head$ $game_concept_dynast$ olur. Eğer tüm $game_concept_house_heads$ [administrative|E] [government|E] sahibiyse, en yüksek [powerful_family_rating|E] sahibi kişi $game_concept_dynast$ olur.]
 game_concept_dynast_desc: "A $game_concept_dynast$ is the [house_head|E] that heads the entire [dynasty|E] and all of its [houses|E].\n\nThe Dynasty Head wields certain unique powers over the members of the Dynasty, known as [dynast_interactions|E]. The $game_concept_dynast$ also picks [dynasty_perks|E] for the $game_concept_dynasty$.\n\nNormally, the $game_concept_dynast$ is the $game_concept_house_head$ that can have the most [soldiers|E]. If all $game_concept_house_heads$ have the [administrative|E] [government|E], the $game_concept_dynast$ is instead whoever has the highest [powerful_family_rating|E]."
 game_concept_dynasty:0 "Hanedan"
 game_concept_dynasty_members:0 "Hanedan Mensupları"
 game_concept_dynasty_desc:1 "[land|E] sahibi bir Hanedan kurucusunun soyundan gelen [nobles|E] bütününe $game_concept_dynasty$ denir. Kurucu [house|E] [cadet_branches|E] olarak adlandırılan yeni Hanelere ayrılabilse de, tüm bu Hanelerin mensupları Hanedanın bir parçası sayılır.\n\nKarakteriniz öldüğünde bir [Concept( 'player_heir', 'Oyuncu Vârisine' )|E] sahip olmanız gerekir, aksi takdirde oyun sona erer (dilerseniz bir başka hükümdarı seçerek aynı dünyada oynamaya devam edebilirsiniz).\n\nTıpkı karakterlerin [prestige|E]i gibi, hanedanların da [Concept( 'dynasty_prestige', 'İhtişamı' )|E] vardır."
 game_concept_renown: "$game_concept_dynasty_prestige$"
 game_concept_house:0 "Hane"
 game_concept_houses:0 "Haneler"
 game_concept_house_desc:1 "[Concept( 'dynasty', 'Hanedanın' )|E] kollarına $game_concept_house$ denir. Haneler mevcut [house_head|E]ne hesap vermektense yeni bir Hane kurmak isteyen [Concept( 'rulers', 'Hükümdarlarca' )|E] kurulabilir.\n\nHaneler her ne kadar kendi isimlerine ve armalarına sahip olsalar da ortak [Concept( 'dynasty_prestige', 'İhtişama' )|E] sahiptirler ve Hanedana mensup diğer karakterler [player_heir|E] de olabilirler."
