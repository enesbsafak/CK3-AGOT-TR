 game_concept_unreformed_pagan_combat_bonus_desc:1 "[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] [faiths|E] get a [battle|E] [advantage|E] in [counties|E] of their faith."
 game_concept_vote_strength:0 "Oy Gücü"
 game_concept_game_over:0 "Oyunun Bitişi"
 game_concept_game_over_desc:0 "Soyunuz sona erdiğinde oyun biter.\n\nOyun, soyunuz için bitmiş olsa da dünyanın herhangi bir yerinde başka bir [ruler|E] ile oynamayı tercih edebilirsiniz.\n\nOyun iki şekilde bitebilir:\n$BULLET_WITH_TAB$[player_heir|E] olmadan ölürseniz\n$BULLET_WITH_TAB$1453 yılına ulaşırsanız"
 game_concept_reform:0 "Reform"
 game_concept_vassal_contract:0 "Vasal Sözleşmesi"
 game_concept_vassal_contracts:0 "Vasal Sözleşmeleri"
 game_concept_vassal_contract_desc:0 "Vasal sözleşmeleri, [vassal|E] ve [Concept( 'liege', 'Süzereni' )|E] arasındaki [Concept( 'obligations', 'Yükümlülükleri' )|E] belirler.\n\n[feudal|E], [clan|E], [administrative|E] ve [nomadic|E] yönetim biçimlerine sahip vasalların farklı [Concept( 'obligations', 'Yükümlülüklere' )|E] erişimleri vardır, bunlar her vasal için özel olarak ayarlanır.\n\nTüm vasallar, [Concept( 'obligations', 'Yükümlülüklerine' )|E] bağlı olarak [Concept( 'taxes', 'Vergilerinin' )|E] ve [Concept( 'levies', 'Milislerinin' )|E] belli bir oranını süzerenlerine verirler. #EMP Bu [modifier_contributions|E] [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )] gibi seçenekler ile daha da kişiselleştirilebilir.#!\n\nBazı özel sözleşmeler belirli kademeler ile sınırlıdır:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] ve [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] ve daha üzeri\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] ve daha üzeri\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: sadece [counts|E]\n\n#weak [governor|E] [Concept( 'obligations', 'Yükümlülükleri' )|E] ayrıca [province_administrations|E] olarak bilinir.#!"
 game_concept_board_game_match:0 "Maç"
 game_concept_board_game:0 "Masa Oyunu"
 game_concept_board_games:0 "Masa Oyunları"
 game_concept_board_game_game:0 "Oyun"
 game_concept_board_game_match_desc:0 "Masa oyunları, iki oyuncunun birbirlerine karşı rekabet ettiği beceri ve şans oyunlarıdır. Dostça bir şekilde yapılabilirler ya da üzerine bahse girilebilir.\n\n#weak Birkaç farklı [board_game_type|E] vardır ama [board_game_winning|E] ve oynama yöntemi aynıdır. Sadece kullanılan beceriler değişir.#!"
 game_concept_board_game_type:0 "Masa Oyunu Türü"
 game_concept_board_game_types:0 "Masa Oyunu Türleri"
 game_concept_board_game_type_counter:1 "karşılar"
 game_concept_board_game_type_counters:0 "karşılar"
 game_concept_board_game_type_desc_guts:0 "Masa oyunu oynarken farklı oynayış türleri rakibinizin hamlelerini karşılayabilir. Hamleleri karşıladıktan sonra hamle başarılı olsa bile kazanılan puan azalır. Uzman oyuncular doğrudan #EMP sizin hamlelerinizi#! karşılamaya oynayabilir."
 game_concept_board_game_type_desc:2 "$game_concept_board_game_type_desc_guts$\n\nMasa oyunları bunlardır:\n$EFFECT_LIST_BULLET$ [board_game_type_chess|E]\n$EFFECT_LIST_BULLET$ [board_game_type_pachisi|E]\n$EFFECT_LIST_BULLET$ [board_game_type_hnefatafl|E]\n$EFFECT_LIST_BULLET$ [board_game_type_tabula|E]\n$EFFECT_LIST_BULLET$ [board_game_type_go|E]\n$EFFECT_LIST_BULLET$ [board_game_type_fidchell|E]"
