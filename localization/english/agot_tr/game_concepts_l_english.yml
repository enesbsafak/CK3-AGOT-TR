### TODO AGOT-CHANGED: game_concept_county_desc [AGOT: A $game_concept_county$ is a [title|E] one [title_tier|E] below a [duchy|E] and one above a [barony|E].\n\nThe $game_concept_title$ includes the [county_capital|E] in the $game_concept_county$, as well as [de_jure|E] rights to all the [baronies|E] in the $game_concept_county$.\n\n$game_concept_counties$ always have [holders|E] because $game_concept_county_capitals$ cannot be destroyed. | TR: $game_concept_county$, [Concept( 'duchy', 'Düklüğün' )|E] bir [title_tier|E] altında ve [Concept( 'barony', 'Baronluğun' )|E] bir [title_tier|E] üstünde olan bir [Concept( 'title', 'Unvandır' )|E].\n\nKontluk Unvanları [Concept('county_capital', 'Kontluk Başkentinin')|E] yanı sıra $game_concept_county$ içindeki tüm [baronies|E] üzerinde [de_jure|E] haklara sahiptir.\n\n$game_concept_county_capitals$ yok edilemediği için, $game_concept_counties$ın her zaman bir [Concept('holder', 'Sahibi')|E] vardır.]
