 game_concept_blood_brothers: "Blood Brothers"
### TODO AGOT-CHANGED: game_concept_blood_brother_desc [AGOT: A $game_concept_blood_brother$ is a special form of [friend|E] and [ally|E]. [characters|E] may only have one $game_concept_blood_brother$: this $game_concept_blood_brother$ becomes a symbolic member of their family (and, thus, must not already be [family|E]). If a $game_concept_blood_brother$'s call to [war|E] is refused, the [relation|E] will break and the two will become [rivals|E].\n\nBlood Brothers, their [children|E], and their Primary Spouses have increased mutual [opinion|E] and may negotiate [alliances|E] with one another.\n\nBlood Brotherhood is available through [nomadic_government|E], the [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )] [trait|E], or via [tradition|E]. | TR: $game_concept_blood_brother$, özel bir [friend|E] ve [ally|E] türüdür. [characters|E] yalnızca bir adet $game_concept_blood_brother$ edinebilir: bu kişi sembolik olarak ailesinin bir parçası hâline gelir (bu nedenle hâlihazırda [Concept('family', 'Aile Üyesi')|E] olmamalıdır). Eğer bir $game_concept_blood_brother$nin [war|E] çağrısı reddedilirse, bu [relation|E] bozulur ve taraflar [rival|E] hâline gelir.\n\nKan Kardeşler, [children|E] ve birincil eşleri arasında karşılıklı [opinion|E] artışı olur ve birbirleriyle [Concept('alliances', 'Müttefik')|E] olabilirler.\n\nKan Kardeşliği, [nomadic_government|E] biçimiyle, [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )] [Concept('trait', 'Özelliğiyle')|E] ya da belli [Concept('tradition', 'Gelenekler')|E] aracılığıyla elde edilebilir.]
 game_concept_blood_brother_desc: "A $game_concept_blood_brother$ is a special form of [friend|E] and [ally|E]. [characters|E] may only have one $game_concept_blood_brother$: this $game_concept_blood_brother$ becomes a symbolic member of their family (and, thus, must not already be [family|E]). If a $game_concept_blood_brother$'s call to [war|E] is refused, the [relation|E] will break and the two will become [rivals|E].\n\nBlood Brothers, their [children|E], and their Primary Spouses have increased mutual [opinion|E] and may negotiate [alliances|E] with one another.\n\nBlood Brotherhood is available through [nomadic_government|E], the [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )] [trait|E], or via [tradition|E]."
 game_concept_manage_guards:0 "$task_manage_guards$"
 game_concept_manage_guards_desc:0 "$game_concept_manage_guards$ [marshal|E] tarafından gerçekleştirilen bir [Concept( 'councillor_task', 'konsey üyesi görevidir' )|E].\n\n[Concept( 'knight_effectiveness', 'Şövalye verimliliğini' )|E] arttırır ve konsey üyesinin [Concept( 'liege', 'süzerenine' )|E] karşı olan [Concept( 'hostile_scheme', 'düşmancıl planların' )|E] [Concept( 'success_chance', 'başarı ihtimalini' )|E] azaltır."
 game_concept_collect_taxes:0 "$task_collect_taxes$"
 game_concept_collect_taxes_desc:0 "$game_concept_collect_taxes$ [steward|E] tarafından gerçekleştirilen bir [Concept( 'councillor_task', 'konsey üyesi görevidir' )|E].\n\nKarakterin kendi [domain|E]ündeki tüm vergileri arttırır."
 game_concept_promote_culture:0 "$task_promote_culture$"
 game_concept_promote_culture_desc:1 "$game_concept_promote_culture$ [steward|E] tarafından gerçekleştirilen bir [Concept( 'councillor_task', 'konsey üyesi görevidir' )|E].\n\nBir [Concept( 'county', 'Kontluğun' )|E] [Concept( 'culture', 'Kültürünü' )|E] hükümdarının kültürüne uyacak şekilde değiştirir."
 game_concept_accept_culture:0 "$task_accept_culture$"
 game_concept_accept_culture_desc:0 "$game_concept_accept_culture$ [steward|E] tarafından gerçekleştirilen bir [Concept( 'councillor_task', 'konsey üyesi görevidir' )|E].\n\nHedef [Concept( 'culture', 'kültür' )|E] ve [Concept( 'rulerpossessive', 'hükümdarın' )|E] kültürü arasındaki [Concept( 'cultural_acceptance', 'kültürel kabullenmeyi' )|E] arttırır."
 game_concept_ducal_conquest:0 "Düklük Fethi"
