### TODO AGOT-CHANGED: game_concept_story_content_wallada_desc [AGOT: #tooltip_heading Story Style: Moderate#!\n\nAs Wallada, you will level up the bespoke [GetTrait('violet_poet').GetName( GetNullCharacter )] by writing poetry and founding lyrical salons across the world, improving a unique tome as you go.\n\nYour story's conclusion is as dramatic as you choose to make it, but despite being childless, you will be given ways to continue playing.\n\n$game_concept_story_generic_desc_boilerplate$ | TR: #tooltip_heading Hikâye Tipi: Ortalama#!\n\nWallada ile şiir yazarak, dünyanın dört bir yanında şiir odaları kurarak ve ilerledikçe benzersiz bir eser oluşturarak sizin için tasarlanan [GetTrait('violet_poet').GetName( GetNullCharacter )] özelliğini geliştireceksiniz.\n\nHikâyenizin sonu sizin seçtiğiniz kadar dramatik olacak ve çocuksuz olmanıza rağmen oyuna devam etmeniz için size çeşitli yollar sunulacak.\n\n$game_concept_story_generic_desc_boilerplate$]
