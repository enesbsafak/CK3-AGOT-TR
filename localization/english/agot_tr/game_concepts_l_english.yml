### TODO AGOT-CHANGED: game_concept_perpetual_hook_desc [AGOT: A $game_concept_perpetual_hook$ is a [hook|E] that you might have on a character who owes you a favor, or that you have manipulated to do your will.\n\nThey cannot be used to force someone to become your [agent|E] in a [GetScheme('murder').GetTypeName] and do not provide a passive benefit #weak (for that, a [strong_hook|E] is necessary.)#!\n\n$game_concept_perpetual_hooks$ are not spent when used, but instead go on a cooldown before they can be used again.#! | TR: $game_concept_perpetual_hook$, size iyilik borcu olan biri ya da kendi isteğinizi yapmaya ikna ettiğiniz biri üzerinde sahip olduğunuz [Concept( 'hook', 'Kozdur' )|E].\n\nBirini [GetScheme('murder').GetTypeName] planında [agent|E] olmaya zorlamak için kullanılamaz ve pasif bir etkisi de yoktur. #weak (Bunun için [strong_hook|E] gerekir)#!\n\n$game_concept_perpetual_hooks$ kullanıldığı zaman kaybolmazlar, belli bir bekleme süresi geçtikten sonra tekrar kullanılabilirler.#!]
 game_concept_perpetual_hook_desc: "A $game_concept_perpetual_hook$ is a [hook|E] that you might have on a character who owes you a favor, or that you have manipulated to do your will.\n\nThey cannot be used to force someone to become your [agent|E] in a [GetScheme('murder').GetTypeName] and do not provide a passive benefit #weak (for that, a [strong_hook|E] is necessary.)#!\n\n$game_concept_perpetual_hooks$ are not spent when used, but instead go on a cooldown before they can be used again.#!"
 game_concept_strong_hook:0 "Güçlü Koz"
 game_concept_strong_hooks:0 "Güçlü Kozlar"
 game_concept_strong_hook_desc:2 "$game_concept_strong_hook$ bir karaktere [blackmail|E] uygulamak için kullanabileceğiniz önemli [Concept( 'hooks', 'Kozlardır' )|E].\n\n$game_concept_strong_hooks$ [Concept( 'weak_hooks', 'Zayıf Kozlara' )|E] nazaran çok daha etkilidir ve bunlarla [GetScheme('murder').GetTypeName] planınızda [agent|E] olmaya zorlamak gibi birisini kirli işlerinizi yapmaya zorlayabilirsiniz #weak ($game_concept_weak_hooks$ın kullanılabileceği şeyler dâhil!)#!\n\n$game_concept_strong_hook$ aynı zamanda koza sahip olan kişiyi hedeften gelebilecek düşmancıl eylemlere karşı korur.\n\n$game_concept_strong_hooks$ kullanıldıklarında kaybedilmez, bunun yerine bir daha kullanılabilmeleri için bir miktar süre geçmesi gerekir. Koz kullanıldığında pasif fayda etkisini yitirmez."
 game_concept_favor:0 "İyilik Borcu"
