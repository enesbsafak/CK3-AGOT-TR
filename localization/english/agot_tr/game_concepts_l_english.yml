 game_concept_secrecy:0 "Gizlilik"
 game_concept_secrecy_desc:1 "[Concept( 'hostile_scheme', 'Düşmancıl Planın' )|E] gizliliği, [Concept( 'scheme', 'planın' )|E] hedefinden saklı kalma ihtimalini gösterir.\n\nPlan başlatıldıktan sonra bir süre hiçbir şekilde keşfedilemez. Daha sonra her ay bir [Concept( 'scheme_breach_short', 'Çatlak' )|E] üzerinden keşfedilme riski ile karşı karşıya kalır. [Concept( 'agents', 'Yardakçılarınız' )|E] planın keşfedilip keşfedilememesi üzerinde çok büyük etkiye sahiptir.\n\n#WEAK Gizlilik oranı %80 olan bir planın tamamlandığında keşfedilme oranı %20'dir ve bunun yanında her ay %2'lik bir keşfedilme oranı da vardır.#!"
### TODO AGOT-CHANGED: game_concept_secrecy_grace [AGOT: Grace | TR: Hoşgörü Süresi]
 game_concept_secrecy_grace: "Grace"
### TODO AGOT-CHANGED: game_concept_secrecy_grace_desc [AGOT: $game_concept_secrecy_grace_desc.boilerplate$\n\nAfter the grace period is over, $game_concept_schemes$ may be discovered monthly, causing a [scheme_breach_short|E]. This is at a far reduced rate than when the scheme is executed, but checked significantly more frequently. | TR: $game_concept_secrecy_grace_desc.boilerplate$\n\nHoşgörü süresi bittikten sonra planın her ay keşfedilme riski bulunur ve [Concept( 'scheme_breach_short', 'Çatlağa' )|E] yol açabilir. Bu risk, plan bitirildiğinde daha azdır ama daha sık kontrol edilmeye başlanır.]
 game_concept_secrecy_grace_desc: "$game_concept_secrecy_grace_desc.boilerplate$\n\nAfter the grace period is over, $game_concept_schemes$ may be discovered monthly, causing a [scheme_breach_short|E]. This is at a far reduced rate than when the scheme is executed, but checked significantly more frequently."
 game_concept_county_development:0 "Gelişmişlik"
 game_concept_development:0 "Gelişmişlik"
 game_concept_county_development_desc:0 "$game_concept_county_development$ bir [Concept( 'county', 'Kontluktaki' )|E] yerel altyapının ve teknolojik ilerlemenin ölçütüdür.\n\nYüksek $game_concept_county_development$ $game_concept_county$tan alınan [levy|E] sayısını, [tax|E] gelirini ve kontluktaki [supply_limit|E]ni arttırır."
 game_concept_county_development_growth:0 "Gelişmişlik Artışı"
 game_concept_development_growth:0 "Gelişmişlik Artışı"
 game_concept_county_development_growth_desc:0 "$game_concept_county_development_growth$ bir [Concept( 'county', 'Kontluğun' )|E] [Concept( 'development', 'Gelişmişliğini' )|E] arttırmak için ne kadar ilerleme kaydettiğini gösterir.\n\n$game_concept_county_development_growth$ 100'e ulaştığında $game_concept_county_development$ 1 artar."
 game_concept_county_control:0 "Kontluk Kontrolü"
 game_concept_control:0 "Kontrol"
 game_concept_county_control_desc:0 "$game_concept_county_control$, yönetimin bir [county|E] üzerindeki idaresini gösterir. Özellikle [holdings|E]den [tax|E] toplarken önemli hâle gelir.\n\nBir kontluk [war|E] sonucu el değiştirdiğinde kontrol büyük ölçüde azalır, bu nedenle eğer [casus_belli|E] izin veriyorsa kontluğun [Concept( 'holder', 'Sahibini' )|E] vasallaştırmak daha iyi bir karar olabilir. Kontluk kontrolü ayrıca [sieges|E] ve [Concept( 'peasant_faction', 'Köylü Ayaklanmaları' )|E] sonucu da düşebilir.\n\nDüşük kontrol [county_corruption|E]na neden olabilir. Kontrolü arttırmanın ana yolu [Concept( 'marshal', 'Mareşalinize' )|E] verebileceğiniz bir [Concept( 'councillor_task', 'konsey üyesi görevidir' )|E]."
 game_concept_absolute_control:0 "Mutlak Kontrol"
### TODO AGOT-CHANGED: game_concept_absolute_control_short [AGOT: Absolute | TR: Mutlak]
 game_concept_absolute_control_short: "Absolute"
 game_concept_absolute_control_desc:1 "$game_concept_absolute_control$, hükümdarın halkın üzerinde tamamen irade kurduğunu gösteren ve $absolute_control_perk_name$ [Concept( 'perk', 'Yeteneği' )|E] ile açılan özel bir [control|E] durumudur.\n\n$game_concept_control$ #V 100#!'e ulaştığı zaman artık '$ABSOLUTE_COUNTY_CONTROL$' yazmaya başlar ve [tax|E] ile [Concept( 'levies', 'milislere' )|E] fazladan bonuslar verir."
 game_concept_fleet:0 "Filo"
 game_concept_fleets:0 "Filolar"
 game_concept_fleet_desc:1 "Bir deniz bölgesine hareket eden [armies|E] otomatik olarak bir $game_concept_fleet$ya [Concept( 'embark', 'biner' )|E]. [embarking] bir miktar [Concept( 'gold', 'Altına' )|E] mal olur, gemilerin tedarikini ve inşasını temsil eder.\n\n$game_concept_fleet$dayken [armies] hızlıca sular üzerinde ilerleyebilir fakat denizde geçirilen #V [GetDefine('NFleet', 'ATTRITION_AFTER_DAYS')|0]#! günden sonra bakım masrafları #V %25#! artar ve ordu [supply|E] kaybetmeye başlarlar.\n\n$game_concept_fleets$ birbirleriyle [battles|E]e girmez.\n\n$game_concept_army$ karaya çıktığında $game_concept_fleet$ kaybolur ve $game_concept_army$ da [recently_disembarked|E] olur."
 game_concept_vassal_taxes:0 "Vasal Vergileri"
 game_concept_vassal_taxes_desc:1 "Vasal vergileri, [Concept( 'vassals', 'Vasallarınızdan' )|E] aldığınız [Concept( 'taxes', 'vergilerden' )|E] oluşur. Aldığınız miktar vasalın [Concept( 'obligations', 'yükümlülüklerine' )|E] bağlıdır.\n\nVasalın kendi vasallarından topladığı vergiler ile karışmasın diye vasalın bakış açısından bu vergilere [liege_taxes|E] denir."
 game_concept_usurp:0 "Gasp Etme"
 game_concept_usurped:0 "Gasp Edildi"
 game_concept_gender_law:0 "Cinsiyet Yasası"
 game_concept_gender_laws:0 "Cinsiyet Yasaları"
 game_concept_gender_law_desc:0 "Her [Concept( 'ruler', 'Hükümdarın' )|E] [Concept( 'titles', 'Unvanların' )|E] [Concept( 'succession', 'Verasette' )|E] kime geçeceğini belirleyen bir cinsiyet yasası vardır. Cinsiyet yasaları ayrıca [Concept( 'armies', 'Ordulara' )|E] kimin komuta edebileceğini ve birden fazla [spouses|E]e veya [concubines|E]e sahip olunup olunamayacağını belirler.\n\nSeçilebilir cinsiyet yasaları [Concept( 'faith', 'Mezhebin' )|E] 'Cinsiyet için Görüşü' ilkesine göre değişir."
 game_concept_depose:0 "Tahttan İndirme"
 game_concept_deposed:0 "Tahttan İndirilmiş"
 game_concept_depose_desc:0 "[rulers|E] [faction|E] talepleri veya özel olaylar sonucu tahttan indirilebilir. Eski hükümdar hâlâ hayatta olsa bile [Concept( 'heirs', 'Vârisleri' )|E] [Concept( 'titles', 'Unvanları' )|E] devralır." #krutygetarts
 game_concept_cultural_acceptance:0 "Kültürel Kabullenme"
 game_concept_cultural_acceptance_desc:2 "Kültürel kabullenme iki [Concept( 'cultures', 'kültürün' )|E] birbirine ne kadar hoşgörülü olduğunu ölçer.\n\nBaşlıca etkisi farklı kültürlerden olan iki karakterin [Concept( 'opinion', 'görüşlerinin' )|E] ne kadar düşük olacağını belirlemektir. Bunun yanında [Concept( 'county_opinion', 'halk görüşünü' )|E] ve [hybrid_culture|E] oluşturma maliyetini de etkiler.\n\nKültürel kabullenme [war|E], [title|E] verme ve feshetme, [accept_culture|E] [councillor_task|E] gibi birçok şey sonucunda değişebilir.\n\nKabullenme, [Concept( 'cultural_acceptance_baseline', 'kültürel kabullenme temel değerinden' )|E] daha fazlaysa zamanla bu değere geri dönecektir."
 game_concept_ethos:0 "Değerler"
 game_concept_ethos_desc:2 "Bir [Concept( 'culture', 'kültürün' )|E] değeri kültürün ahlaki ve yol gösterici ilkelerini, kültürden olanların hayata nasıl yaklaştığını temsil eder.\n\nDeğer ayrıca yeni [traditions|E] getirmenin [Concept( 'culture_head', 'kültür önderine' )|E] ne kadara mal olacağını da belirler.[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_ethos_desc_REFORM_DLC', '' )]"
 game_concept_ethos_desc_REFORM_DLC:0 "\n\n[culture_head|E], [reformation|E] yoluyla kültürün değerini değiştirebilir."
 game_concept_language:0 "Dil"
 game_concept_languages:0 "Diller"
 game_concept_language_desc:3 "Dil, [Concept( 'culture', 'kültürün' )|E] hangi dilde konuştuğunu belirleyen bir [Concept( 'culture_pillar', 'kültürel özelliktir' )|E]. Aynı dili konuşan kültürlerin [cultural_acceptance_baseline|E] daha yüksektir.\n\nBir [character|E] birden fazla dil bilebilir. Dil bilmek, o dilde konuşan yabancı karakterlerin ve [Concept( 'counties', 'kontlukların' )|E] o karaktere karşı sahip olduğu [cultural_acceptance|E] [opinion|E] cezasını yarıya indirir. Ayrıca [faction_independence|E] ve [Concept( 'claimant_factions', 'Hak Sahibi örgütleşmelerini' )|E] caydırır.\n\nKarakterler [GetScheme('learn_language').GetTypeName] [Concept( 'scheme', 'planını' )|E] kullanarak yeni diller öğrenebilir. Karakterlerin öğrenebileceği dil sayısı [Concept( 'language_limit', 'yabancı dil sınırı' )|E] ile sınırlıdır."
 game_concept_cultural_head:0 "Kültürel Önder"
 game_concept_culture_head:1 "Kültür Önderi"
 game_concept_culture_head_desc:3 "Kültür önderi, kendi [Concept( 'culture', 'Kültüründe' )|E] en fazla nüfuza sahip olan [Concept( 'rulers', 'Hükümdardır' )|E].\n\nDaha belirgin olmak gerekirse, [Concept( 'realm', 'Ülkesinde' )|E] kendi [Concept( 'culture', 'Kültüründen' )|E] en fazla [Concept( 'county', 'Kontluğa' )|E] sahip olan hükümdar, [domain|E]ünün nerede olduğuna veya başka kültürlerden ne kadar toprağa sahip olduğuna bakılmaksızın kültür önderi olur.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nKültür önderi [cultural_fascination|E] belirleyerek hangi [innovation|E]a öncelik verileceğini seçebilir.\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
### TODO AGOT-CHANGED: game_concept_culture_head_desc_NOMAD_DLC [AGOT: \n\n[nomadic|E] [rulers|E], however, will choose their $game_concept_cultural_head$ based on who has the largest [herd|E], regardless of rank. In case of settled rulers being part of the same [culture|E] as nomads, the [military_power|E] will be the deciding factor instead. | TR: \n\nÖte yandan [nomadic|E] [rulers|E], fark etmeksizin en çok [Concept('herd', 'Sürüye')|E] sahip karakteri $game_concept_cultural_head$ olarak görür. Aynı [Concept('culture', 'Kültürde')|E] hem göçebe hem yerleşik karakterler bulunması durumunda ise [military_power|E] belirleyici rol oynar.]
 game_concept_culture_head_desc_NOMAD_DLC: "\n\n[nomadic|E] [rulers|E], however, will choose their $game_concept_cultural_head$ based on who has the largest [herd|E], regardless of rank. In case of settled rulers being part of the same [culture|E] as nomads, the [military_power|E] will be the deciding factor instead."
 game_concept_culture_head_desc_REFORM_DLC:0 "$game_concept_culture_head$ ayrıca kültürlerinin belirli yönlerini [reform|E] edebilir."
 game_concept_culture_head_desc_NO_REFORM_DLC:0 "$game_concept_culture_head$ ayrıca kültürleri için yeni [traditions|E] getirebilir."
 game_concept_core_tenet:1 "Öğreti"
 game_concept_core_tenet_desc:1 "[doctrines|E] bir [Concept( 'faith', 'Mezhebin' )|E] hangi tutumu sergileyeceğini seçmesi gereken sorunlar iken $game_concept_core_tenets$ mezhebin özgün yöntemlerini ve törenlerini yansıtır."
 game_concept_core_tenets:1 "Öğretiler"
 game_concept_holy_war:0 "Kutsal Savaş"
 game_concept_holy_wars:0 "Kutsal Savaşlar"
 game_concept_holy_war_holy:0 "Kutsal"
 game_concept_holy_war_desc:4 "$game_concept_holy_war$ bir [ruler|E] tarafından farklı [Concept( 'faith', 'Mezhepteki' )|E] bir hükümdara açılan özel bir [war|E]tır.\n\n$game_concept_holy_wars$ genellikle yıkıcıdır, genellikle kazanan taraf hedef bölgedeki tüm [Concept( 'counties', 'Kontlukları' )|E] kendisi için ele geçirir. Ancak saldıranın mezhebi [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] ise veya hedef bölgede savunan tarafın kontrol ettiği, saldıran tarafla aynı mezhebe sahip [vassals|E] varsa bu vasallar fethedilmek yerine kazanana aktarılabilir.\n\nDiğer savaşların aksine hedef karakter ile aynı mezhepten olan hükümdarlar [alliance|E] gerekmeden savunmaya katılabilirler.\n\nKutsal savaşlar açılıp açılamayacağı [religious_families|E]ne göre değişir."
 game_concept_great_holy_war:0 "Büyük Kutsal Savaş"
 game_concept_great_holy_wars:0 "Büyük Kutsal Savaşlar"
 game_concept_great_holy_war_desc:3 "$game_concept_great_holy_war$ sadece belirli [Concept( 'faiths', 'Mezheplerin' )|E] [head_of_faith|E]nin açabileceği özel bir [war|E]tır. Amacı bir [Concept( 'kingdom', 'Krallığın' )|E] tamamını kendi mezheplerinin kontrolüne geçirmektir.\n\n$game_concept_great_holy_wars$ seçilen [kingdom|E] içindeki farklı [religion|E]den olan tüm [Concept( 'rulers', 'Hükümdarları' )|E] hedef alır ve onları birlikte savunmaya zorlar. Eğer kazanırlarsa hedef krallıktaki tüm [titles|E] saldıranlar arasında bölüştürülür.\n\n[Concept( 'doctrines', 'İlkelerine' )|E] göre bir mezhep [directed_great_holy_war|E]a veya [undirected_great_holy_war|E]a sahip olabilir ama herhangi bir $game_concept_great_holy_war$a da sahip olmayabilir.\n$EFFECT_LIST_BULLET$[GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName] veya [GetFaithDoctrine('tenet_warmonger').GetBaseName] [Concept( 'core_tenet', 'Öğretisi' )|E] Büyük Kutsal Savaş açabilmek için gereklidir\n$EFFECT_LIST_BULLET$[GetFaithDoctrine('doctrine_temporal_head').GetBaseName] lidere sahip olan mezhepler sadece düzenli büyük kutsal savaş açabilir\n$EFFECT_LIST_BULLET$[GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] lidere sahip olan mezhepler sadece düzensiz büyük kutsal savaş açabilir\n$EFFECT_LIST_BULLET$Mezhep liderine sahip olmayan mezhepler herhangi bir şekilde büyük kutsal savaş açamazlar\n\nBazı mezheplerde büyük kutsal savaşlar için 'Haçlı' veya 'Cihat' gibi özel isimler vardır. Bu büyük kutsal savaşların sadece adı farklıdır, diğer tüm büyük kutsal savaşlarla aynı işlerler."
 game_concept_war_chest:0 "Savaş Sandığı"
 game_concept_war_chest_desc:1 "$game_concept_war_chest$ [gold|E], [piety|E] ve [prestige|E] içeren bir sandıktır. İçindekilerin ana kullanım amacı [undirected_great_holy_wars|E] kazanıldığında ödül olarak dağıtılmasıdır. Bu dağıtım saldıranların [Concept( 'war', 'Savaştaki' )|E] katılımına göre yapılır.\n\n$game_concept_war_chest$nın bir miktarı da savaş başladığında saldıranlar arasında bölüştürülecektir.\n\nEğer [undirected_great_holy_war|E] kaybedilirse savunan taraf $game_concept_war_chest$ndaki dindarlık ve prestiji aralarında paylaşır #weak (altın kaybolur)#!"
 game_concept_crusade:0 "Haçlı"
