 game_concept_war:0 "Savaş"
 game_concept_wars:0 "Savaşlar"
 game_concept_war_desc:0 "[Concept( 'realm', 'Ülkenizi' )|E] genişletmenin en basit yolu savaşlardır. Ancak $game_concept_war$ ilan etmek için bir gerekçe gerekir, buna da [casus_belli|E] denir. $game_concept_war$a girdiğinizde seçilen savaş sebebinin izin verdiğinden daha fazlasını alamazsınız.\n\nSavaşlar, [battle|E]lerde düşman [Concept( 'armies', 'Ordularını' )|E] yenerek ve düşman [holdings|E]ini [occupation|E] ederek kazanılır. Bunları yaptığınızda [war_score|E] kazanırsınız ve nihayetinde [peace_offer|E] ile düşmanın [defeat|E]yi kabul etmesini sağlayabilirsiniz.\n\n$game_concept_war$ın sonucu ne olursa olsun, saldıran taraf bir süreliğine savunan tarafa karşı [truce|E] hâlinde olur ama savunan taraf istediği zaman yeni bir savaş açabilir."
### TODO AGOT-CHANGED: game_concept_loot [AGOT: Loot | TR: Ganimet]
 game_concept_loot: "Loot"
### TODO AGOT-CHANGED: game_concept_loot_desc [AGOT: If a [holding|E] is [Concept( 'raid', 'Raided' )|E], [occupied|E] in a [siege|E], or engaged in [bartering|E], the attacker or [barterer|E] will get an amount of [gold|E] equal to the $game_concept_loot$. The more prosperous a [holding|E] is, the more $game_concept_loot$ it will have.\n\nA Holding which has been Raided, Sieged, or Bartered with recently will not have any Loot. | TR: Bir [holding|E] [Concept( 'raid', 'Yağmalanırsa' )|E], [siege|E] sonrası [Concept('occupied', 'İşgal Edilirse')|E] veya [Concept('bartering', 'Takas')|E] yapılırsa, saldıran veya [barterer|E], $game_concept_loot$ miktarı kadar [gold|E] kazanır. Bir [holding|E] ne kadar zenginse, o kadar fazla $game_concept_loot$e sahip olur.\n\nYakın zamanda Yağmalanmış, Kuşatılmış veya Takas yapılmış bir Yerleşim bir süreliğine Ganimete sahip olmaz.]
 game_concept_loot_desc: "If a [holding|E] is [Concept( 'raid', 'Raided' )|E], [occupied|E] in a [siege|E], or engaged in [bartering|E], the attacker or [barterer|E] will get an amount of [gold|E] equal to the $game_concept_loot$. The more prosperous a [holding|E] is, the more $game_concept_loot$ it will have.\n\nA Holding which has been Raided, Sieged, or Bartered with recently will not have any Loot."
### TODO AGOT-CHANGED: game_concept_barter [AGOT: Barter | TR: Takas]
 game_concept_barter: "Barter"
### TODO AGOT-CHANGED: game_concept_barter_desc [AGOT: [GetGovernment( 'wanua_government' ).GetName] [rulers|E] can raise [barterers|E] to gain [gold|E] through peaceful means. Bartering works similarly to [raiding|E], with some key differences — it is not a [hostile_army|E] action, and you need [barter_goods|E].\n\nYou need #V 2#! Barter Goods to gain #V 1#! [loot|E] from a [holding|E]. If you have too little, nothing will happen.\n\nBartering is a friendly action, and the targeted holding will gain [GetModifier('recently_bartered_modifier').GetNameWithTooltip] upon completion. Unlike Raiding, you can freely Barter in the lands of your [tributaries|E] and [suzerain|E]. | TR: [GetGovernment( 'wanua_government' ).GetName] [Concept('rulers', 'Hükümdarları')|E] [barterers|E] toplayarak barışçıl yollarla [gold|E] kazanabilir. Takas, [Concept('raiding', 'Yağmaya')|E] benzer şekilde çalışır ancak bazı önemli farklar vardır, Takas yapmak [hostile_army|E] bir eylem değildir ve [barter_goods|E] gerektirir.\n\nBir [Concept('holding', 'Yerleşimden')|E] #V 1#! [loot|E] kazanmak için #V 2#! Takas Malı gerekir. Eğer Takas Malınız yoksa, Takas yapamazsınız.\n\nTakas dostane bir eylemdir ve hedeflenen yerleşim tamamlandığında [GetModifier('recently_bartered_modifier').GetNameWithTooltip] kazanır. Yağmalamadan farklı olarak, [tributary|E] ve [suzerain|E] topraklarında özgürce Takas yapabilirsiniz.]
 game_concept_barter_desc: "[GetGovernment( 'wanua_government' ).GetName] [rulers|E] can raise [barterers|E] to gain [gold|E] through peaceful means. Bartering works similarly to [raiding|E], with some key differences — it is not a [hostile_army|E] action, and you need [barter_goods|E].\n\nYou need #V 2#! Barter Goods to gain #V 1#! [loot|E] from a [holding|E]. If you have too little, nothing will happen.\n\nBartering is a friendly action, and the targeted holding will gain [GetModifier('recently_bartered_modifier').GetNameWithTooltip] upon completion. Unlike Raiding, you can freely Barter in the lands of your [tributaries|E] and [suzerain|E]."
