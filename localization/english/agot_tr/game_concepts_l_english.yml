 game_concept_accolade_types:0 "Mükâfat Nitelikleri"
### TODO AGOT-CHANGED: game_concept_accolade_type_desc [AGOT: An [accolade|E] has up to #value 3#! Attributes, which provide scaling bonuses as their higher levels are unlocked. Each Attribute has #value 3#! Levels. When an Accolade increases its [accolade_rank|E], its owner may either increase the level of an existing Attributes or add a new Attribute to the Accolade. The [acclaimed_knight|E], however, must satisfy any new Attribute's requirements.\n\nEach [knight|E] is only eligible for certain Attributes, which may be based on [traits|E], [skills|E] or experiential unlocks while serving as a Captain.\n\nEvery Accolade must have unique Attributes: a Liege #high cannot#! duplicate Attributes between Accolades. Each Accolade may also specialize in only #value 1#! [men_at_arms|E]-type Attribute. | TR: Bir [accolade|E], daha yüksek seviyeleri açıldıkça fazladan bonuslar sağlayan en fazla #value 3#! Niteliğe sahip olabilir. Her Niteliğin kendi içerisinde #value 3#! Seviyesi vardır. Bir Mükâfat [Concept('accolade_rank', 'Kademesi')|E] arttığında, sahibi ya mevcut Niteliklerden birinin seviyesini yükseltebilir ya da Mükâfata yeni bir Nitelik ekleyebilir. Ancak [acclaimed_knight|E], her yeni Niteliğin şartlarını karşılamak zorundadır.\n\nHer [knight|E] yalnızca belirli Nitelikler için uygundur, bunlar [traits|E], [skills|E] veya şövalye olarak hizmet ederken açılan tecrübeye dayalı koşullara bağlı olabilir.\n\nHer Mükâfatın Nitelikleri özel olmalıdır. Bir Süzeren farklı Mükâfatlarda aynı Nitelikleri #high kullanamaz#!. Ayrıca her Mükâfat yalnızca #value 1#! adet [men_at_arms|E] türü üzerinde uzmanlaşabilir.]
 game_concept_accolade_type_desc:1 "An [accolade|E] has up to #value 3#! Attributes, which provide scaling bonuses as their higher levels are unlocked. Each Attribute has #value 3#! Levels. When an Accolade increases its [accolade_rank|E], its owner may either increase the level of an existing Attributes or add a new Attribute to the Accolade. The [acclaimed_knight|E], however, must satisfy any new Attribute's requirements.\n\nEach [knight|E] is only eligible for certain Attributes, which may be based on [traits|E], [skills|E] or experiential unlocks while serving as a Captain.\n\nEvery Accolade must have unique Attributes: a Liege #high cannot#! duplicate Attributes between Accolades. Each Accolade may also specialize in only #value 1#! [men_at_arms|E]-type Attribute."
 game_concept_accolade_rank:0 "Mükâfat Kademesi"
 game_concept_accolade_ranks:0 "Mükâfat Kademeleri"
 game_concept_accolade_rank_short:0 "Kademe"
 game_concept_accolade_rank_desc:1 "Bir [accolade|e], sahibinin [knight_army_modifiers|e] gibi [accolade_type|e] bonuslarını açmasına ve geliştirmesine imkân veren, aşamalı #value 6#! Kademeye sahiptir.\n\nHer Kademe [glory|E] kazanılarak açılır, Şan kaybı ise bunların kaybedilmesine sebep olabilir. Bir Mükâfat Kademe kaybettiğinde, bir [Concept('accolade_type', 'Mükâfat Niteliğinin')|E] bir kademesi devre dışı kalır. Kademenin yeniden kazanılması, Niteliğin ve bonusunun geri gelmesini sağlar."
 game_concept_glory:0 "Şan"
### TODO AGOT-CHANGED: game_concept_glory_desc [AGOT: An [accolade_possessive|E] Glory increases its [accolade_rank|E].\n\nGlory is gained by the [acclaimed_knight|E] winning [battles|E], defeating warriors, competing in [GetActivityType( 'activity_tournament' ).GetName] [contests|E], and attending [activities|E].\n\nHowever, the Accolade's Glory is lowered when the Acclaimed Captain is involved in losing battles, and may also diminish on [accolade_succession|E] if the Acclaimed Captain did not die in battle, a duel, or some other honorable fashion. | TR: Bir [accolade_possessive|E] Şanı, [Concept('accolade_rank', 'Mükâfat Kademesini')|E] arttırır.\n\nŞan, [acclaimed_knight|E] [battle|E] ve düello kazanarak, [GetActivityType( 'activity_tournament' ).GetName] [Concept('contests', 'Müsabakalarına')|E] katılarak ve [Concept('activities', 'Etkinliklere')|E] katılarak kazanılır.\n\nBununla birlikte, Tanınmış Şövalye kaybedilen muharebelerde yer aldığında Mükâfatın Şanı azalır, ayrıca Tanınmış Şövalye savaşta, düelloda ya da başka bir onurlu biçimde ölmediyse [accolade_succession|E] esnasında da azalabilir.]
 game_concept_glory_desc:1 "An [accolade_possessive|E] Glory increases its [accolade_rank|E].\n\nGlory is gained by the [acclaimed_knight|E] winning [battles|E], defeating warriors, competing in [GetActivityType( 'activity_tournament' ).GetName] [contests|E], and attending [activities|E].\n\nHowever, the Accolade's Glory is lowered when the Acclaimed Captain is involved in losing battles, and may also diminish on [accolade_succession|E] if the Acclaimed Captain did not die in battle, a duel, or some other honorable fashion."
 game_concept_tax_collector: "Tahsildar"
 game_concept_tax_collector_desc: "$game_concept_tax_collector$ [Concept( 'tax_jurisdictions', 'Vergi Grubunun' )|E] çalışmasını sağlar.\n\n[Concept( 'aptitude', 'Yatkınlıkları' )|E] [Concept( 'liege', 'Süzerenleri' )|E] için ne kadar [tax|E] ve [levy|E] toplayabileceklerini belirler."
 game_concept_tax_collectors: "Tahsildarlar"
 game_concept_tax_decree: "Vergi Kararnamesi"
 game_concept_tax_decree_desc: "Her [tax_jurisdiction|E], [Concept( 'taxpayers', 'Vergi Mükelleflerinin' )|E] [tax|E] ve [levy|E] katkısını belirleyen farklı $game_concept_tax_decree$ne sahip olabilir.\n\n$game_concept_tax_decrees$ genellikle başka bir fayda veya zarar karşılığında [Concept( 'obligations', 'Yükümlülükleri' )|E] değiştirir."
 game_concept_tax_decrees: "Vergi Kararnameleri"
 game_concept_taxpayer: "Vergi Mükellefi"
 game_concept_taxpayers: "Mükellefler"
 game_concept_taxpayer_desc: "$game_concept_taxpayers$ [Concept( 'tax_jurisdiction', 'Vergi Grubuna' )|E] atanmış [clan|E] [Concept( 'vassals', 'Vasallardır' )|E], [tax_collector|E] olduğu müddetçe süzerenlerine aylık [tax|E] ve [levy|E] sağlarlar."
 game_concept_hostage: "Rehine"
 game_concept_hostages: "Rehineler"
 game_concept_hostage_desc: "[Concept( 'home_court', 'Aile Saraylarından' )|E] barışın veya teslimiyetin teminatı olarak gönderilen, bir [Concept( 'ruler', 'Hükümdarın' )|E] [Concept( 'close_family_member', 'Yakın Akrabasıdır' )|E].\n\nRehine almalarına veya göndermelerine rağmen [war|E] ilan eden hükümdarların itibarları büyük ölçüde zarar görür, koruyucular da düşmanlarının rehinelerini serbestçe idam edebilir.\n\nİyi muamele gören rehineler, koruyucularına sadık hâle gelebilir ve hatta [friend|E] olabilirler. Koruyucular da onların üzerinde [hook|E] kazanabilirler.\n\n$game_concept_hostages$, topraksız çocuklar olmalıdır. Bunun yanında aile saraylarının hükümdarlarının kardeşleri, yeğenleri veya torunları olmalıdır.\n\nKoruyucular; rehineleri reşit yaşa ulaştığında onlar üzerinde kişiliklerine, aralarındaki görüşe ve sarayda geçirdikleri zamana göre [perpetual_hook|E] kazanma şansına sahiptir."
 game_concept_home_court: "Aile Sarayı"
 game_concept_home_courts: "Aile Sarayları"
 game_concept_home_court_desc: "[Concept( 'hostage', 'Rehinenin' )|E] [Concept('close_family_member', 'Yakın Akrabası')|E] olan bir [ruler|E], barışın veya teslimiyetin teminatı olarak onu bir [Concept( 'warden', 'Koruyucunun' )|E] yanına göndermiştir."
 game_concept_warden: "Koruyucu"
 game_concept_wardens: "Koruyucular"
 game_concept_warden_desc: "Barışın veya teslimiyetin teminatı olarak kendisine yabancı bir [Concept( 'home_court', 'Saraydan' )|E] bir [hostage|E] gönderilen [Concept( 'ruler', 'Hükümdarlardır' )|E].\n\n[wardens|E], [Concept( 'court', 'Saraylarındaki' )|E] her [hostage|E] için zamanla [prestige_i|E][prestige|E] kazanırlar."
 game_concept_adopt: "Evlat Edin"
 game_concept_adopts: "Evlat Edindi"
 game_concept_adopted: "Evlat Edinilmiş"
 game_concept_funeral: "Cenaze"
 game_concept_funeral_desc: "Yakın zamanda gerçekleşen bir [Concept( 'character_death', 'Karakter Ölümü' )|E] sonrasında [host|E] tarafından düzenlenebilen, ölen kişiye saygılarını sunmaları için çeşitli [Concept( 'characters', 'Karakterlerin' )|E] davet edilebilildiği bir [Concept( 'activity', 'Etkinliktir.' )|E]. Cenazeler genellikle [legitimacy|E] arttırır, [stress|E] azaltır ve [piety|E] fırsatları sağlar."
 game_concept_funerals: "Cenazeler"
 game_concept_scheme_breach_short: "Çatlak"
 game_concept_scheme_breaches_short: "Çatlaklar"
 game_concept_scheme_breach: "Plan Çatlağı"
 game_concept_scheme_breaches: "Plan Çatlakları"
 game_concept_scheme_breach_desc: "Çatlaklar, [Concept( 'secret_scheme', 'Gizli Planlardaki' )|E] sorunları temsil eder. [Concept( 'scheme', 'Planda' )|E] çatlak oluştuğunda [Concept( 'success_chance', 'Başarı İhtimali' )|E] azalır. Her oluşan çatlak, başarı ihtimalini daha da azaltır. Çatlak sayısı #V 5'e#! ulaştığında plan otomatik olarak başarısız olur.\n\n#WEAK Çatlakların gizliliğe herhangi bir etkisi yoktur.#!"
 game_concept_story_cycle: "Hikâye"
 game_concept_story_cycles: "Hikâyeler"
 game_concept_story_cycle_desc: "Hikâye, bir [ruler|E] ile bağlantılı kişisel bir durumdur.\n\n[GetModifier('dog_story_modifier').GetNameWithTooltip] sahibi olmaktan #V [GetTrait('conqueror').GetName( GetNullCharacter )]#! olmaya kadar birçok farklı Hikâye türü vardır. Her biri farklı unsurlardan oluşur, genellikle önemli [characters|E], [titles|E] veya [decisions|E] içerir."
 game_concept_story_content_hereward: "$game_concept_story_generic_prefix$ $bookmark_laamps_hereweard_the_wake$"
 game_concept_story_content_hereward_desc: "#tooltip_heading Hikâye Tipi: Kapsamlı#!\n\nHereward ile sürgününüz kısa sürecek. Yabancıların kontrolündeki İngiltere'ye dönerek adınızı temize çıkarmak, Normanları öldürmek ve özgürlük için savaşacaksınız.\n\nBu süre boyunca İngiltere'nin Norman yönetimine karşı direnişini anlatan özel bir mekanik aktif olacak ve bu sırada senaryolaştırılmış hikâye olayları gerçekleşecek. Hikâyeniz ölümle bitecek, ya sizin ya da düşmanınızın.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_wallada: "$game_concept_story_generic_prefix$ $bookmark_laamps_wallada_bint_al_mustakfi$"
 game_concept_story_content_wallada_desc: "#tooltip_heading Hikâye Tipi: Ortalama#!\n\nWallada ile şiir yazarak, dünyanın dört bir yanında şiir odaları kurarak ve ilerledikçe benzersiz bir eser oluşturarak sizin için tasarlanan [GetTrait('violet_poet').GetName( GetNullCharacter )] özelliğini geliştireceksiniz.\n\nHikâyenizin sonu sizin seçtiğiniz kadar dramatik olacak ve çocuksuz olmanıza rağmen oyuna devam etmeniz için size çeşitli yollar sunulacak.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan: "$game_concept_story_generic_prefix$ $bookmark_laamps_hassan_sabbah$"
 game_concept_story_content_hasan_desc: "#tooltip_heading Hikâye Tipi: Ortalama#!\n\nHasan ile dinî fanatizm yolunda ilerleyeceksiniz. Gerçek inancın ışığını getirecek yerler seçecek ve [Concept( 'counties', 'Kontluklarının' )|E] mezhebini göz göre göre değiştireceksiniz.\n\nSonunda, hikâyeniz seçtiğiniz düşmana karşı büyük bir dinî ayaklanma ile sonuçlanacak.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_game_rule_extreme: "Aşırı Oyun Kuralı"
 game_concept_game_rule_extreme_desc: "Bu oyun kuralı oyunu #bold oldukça fazla#! zor hâle getirir."
 game_concept_story_content_jamukha: "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
 game_concept_story_content_jamukha_desc: "#tooltip_heading Hikâye Tarzı: Hafif#!\n\nCamuka olarak her zaman Temuçin'in gölgesinde yaşadınız, artık kendi kudretinizi kanıtlamanın vakti geldi. Ona sadık kalmaya devam mi edeceksiniz yoksa gecenin karanlığında boğazını mı keseceksiniz?\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_wanua: "Vanua"
 game_concept_wanua_government: "Vanua Yönetimi"
 game_concept_wanua_desc: "$wanua_government_adjective$ [government|E] biçimi, [GetGovernment('tribal_government').GetNameWithIcon] [government|E] biçimiyle benzer zayıflıklar paylaşır ancak ayrıca daha düşük [Concept('domain_limit', 'Mülk Limitine')|E] ve [Concept('vassal_limit', 'Vasal Limitine')|E] sahiptir. [buildings|E] inşa etmek ve [men_at_arms|E] toplamak için [gold|E] kullansalar da Binalardan çok az Altın kazanırlar.\n\nBununla beraber [barter_goods_i][barter|E] yapabilir, [raid|E] düzenleyebilirler. [tributary|E] olmaktan [legitimacy|E] kazandıkları için [GetGovernment('mandala_government').GetName] ile sinerjiye sahiptir."
 game_concept_bloc_supremacy_war: "Blok Üstünlük Savaşı"
 game_concept_bloc_supremacy: "Blok Üstünlüğü"
 game_concept_supremacy: "Üstünlük"
 game_concept_bloc_supremacy_war_desc: "$game_concept_bloc_supremacy_war$, iki [soryo|E] [Concept('house_blocs', 'Hane Bloğunun')|E] [Concept('leading_houses', 'Lider Haneleri')|E] arasındaki özel bir [war|E] türüdür.\n\n#high Diğer $game_concept_war$ türlerinin aksine, her iki $game_concept_bloc$ içindeki tüm üyeler de savaşa dâhil olur.#!\n\nKazanan $game_concept_bloc$ [cohesion|E] kazanırken, kaybeden $game_concept_bloc$ sahip olduğu $game_concept_cohesion$ değerinin üçte birini kaybeder.\n\nAyrıca [house_head|E] kaybeden Bloğun Lider Hanesinin Hane Reisi tarafından [Concept('cowed', 'Sindirilmemiş')|E], üzerinde [Concept('hooked', 'Koz')|E] sahibi olunmayan, [Concept('vassal', 'Vasalı')|E], [Concept('ally', 'Müttefiği')|E] veya [Concept('friends', 'Arkadaşı')|E] olmayan ve [GetTrait('loyal').GetName( GetNullCharacter )] özelliğine sahip olmayan [soryo|E] [Concept('member_houses', 'Üye Haneler')|E] kazanan Bloğa katılır."
