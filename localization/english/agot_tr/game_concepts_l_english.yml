 game_concept_scheme_countermeasure_countermeasure: "Countermeasure"
### TODO AGOT-CHANGED: game_concept_scheme_countermeasure_countermeasures [AGOT: Countermeasures | TR: Karşı Önlemler]
 game_concept_scheme_countermeasure_countermeasures: "Countermeasures"
### TODO AGOT-CHANGED: game_concept_scheme_countermeasure_desc [AGOT: When you suspect that a [scheme|e] is targeting you, you can do something about it by directing all your defenses against one type of $game_concept_scheme$ at the cost of others.\n\nBecause of this, only one can be active at a time. Strengthening defenses in one area involves drawing attention away from another.\n\nThey can be used to reduce [secrecy|E] or adjust the [success_chance|E] of different groups of $game_concept_schemes$. They may buy you time or shore up your defenses, but come with drawbacks that mean you do not want to have one active at all times. | TR: Bir [Concept( 'scheme', 'Planın' )|E] hedefi olduğunuzdan şüpheleniyorsanız, diğerlerini göz ardı ederek sadece belirli bir tür plana karşı savunmaya geçebilirsiniz.\n\nBu nedenle aynı anda sadece bir tanesi aktif olabilir. Savunmanız bir alanda artarken diğer alanlarda zayıflar.\n\nFarklı türden planların [Concept( 'secrecy', 'Gizliliğini' )|E] düşürmek ya da [Concept( 'success_chance', 'Başarı İhtimalini' )|E] değiştirmek için kullanılabilirler. Plana karşı koymak için size gereken zamanı tanıyabilirler ancak dezavantajları nedeniyle her zaman bir tanesini aktif tutmak pek akıllıca olmayabilir.]
 game_concept_scheme_countermeasure_desc: "When you suspect that a [scheme|e] is targeting you, you can do something about it by directing all your defenses against one type of $game_concept_scheme$ at the cost of others.\n\nBecause of this, only one can be active at a time. Strengthening defenses in one area involves drawing attention away from another.\n\nThey can be used to reduce [secrecy|E] or adjust the [success_chance|E] of different groups of $game_concept_schemes$. They may buy you time or shore up your defenses, but come with drawbacks that mean you do not want to have one active at all times."
 game_concept_personal_scheme:0 "Kişisel Plan"
 game_concept_personal_schemes:0 "Kişisel Planlar"
 game_concept_personal:0 "Kişisel"
### TODO AGOT-CHANGED: game_concept_personal_scheme_desc [AGOT: $game_concept_personal_schemes$ are [schemes|E] that aim to induce a status between the [scheme_owner|E] and the [scheme_target|E].\n\nExamples of $game_concept_personal_schemes$ are:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName] | TR: $game_concept_personal_schemes$ [scheme_owner|E] ile [scheme_target|E] arasındaki ilişkiyi geliştirmeyi amaçlayan [Concept( 'schemes', 'Planlardır' )|E].\n\nBazı kişisel planlar:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]]
 game_concept_personal_scheme_desc: "$game_concept_personal_schemes$ are [schemes|E] that aim to induce a status between the [scheme_owner|E] and the [scheme_target|E].\n\nExamples of $game_concept_personal_schemes$ are:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
 game_concept_scheme_owner:0 "Plan Sahibi"
