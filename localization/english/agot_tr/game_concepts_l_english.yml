### TODO AGOT-CHANGED: game_concept_hostage_desc [AGOT: A [close_family_member|E] of a [ruler|E], sent away from their [home_court|E] as an assurance of peace or submission.\n\nThe reputation of $game_concept_rulers$ who declare [war|E] despite sending or receiving a $game_concept_hostage$ will be dramatically damaged, and $game_concept_wardens$ may freely execute the $game_concept_hostages$ of their enemies.\n\nWell-treated $game_concept_hostages$ are likely to become loyal to their $game_concept_warden$, who may gain a [hook|E], or even become [friends|E] with them.\n\n$game_concept_hostages$ must be landless children, siblings, nieces, nephews, or grandchildren of their $game_concept_home_courts_possessive$ $game_concept_ruler$.\n\n$game_concept_wardens$ have a chance to gain a [perpetual_hook|E] on a child $game_concept_hostage$ when they come of age, based on personality, opinion, and years spent at the $game_concept_wardens$ court. | TR: [Concept( 'home_court', 'Aile Saraylarından' )|E] barışın veya teslimiyetin teminatı olarak gönderilen, bir [Concept( 'ruler', 'Hükümdarın' )|E] [Concept( 'close_family_member', 'Yakın Akrabasıdır' )|E].\n\nRehine almalarına veya göndermelerine rağmen [war|E] ilan eden hükümdarların itibarları büyük ölçüde zarar görür, koruyucular da düşmanlarının rehinelerini serbestçe idam edebilir.\n\nİyi muamele gören rehineler, koruyucularına sadık hâle gelebilir ve hatta [friend|E] olabilirler. Koruyucular da onların üzerinde [hook|E] kazanabilirler.\n\n$game_concept_hostages$, topraksız çocuklar olmalıdır. Bunun yanında aile saraylarının hükümdarlarının kardeşleri, yeğenleri veya torunları olmalıdır.\n\nKoruyucular; rehineleri reşit yaşa ulaştığında onlar üzerinde kişiliklerine, aralarındaki görüşe ve sarayda geçirdikleri zamana göre [perpetual_hook|E] kazanma şansına sahiptir.]
 game_concept_hostage_desc: "A [close_family_member|E] of a [ruler|E], sent away from their [home_court|E] as an assurance of peace or submission.\n\nThe reputation of $game_concept_rulers$ who declare [war|E] despite sending or receiving a $game_concept_hostage$ will be dramatically damaged, and $game_concept_wardens$ may freely execute the $game_concept_hostages$ of their enemies.\n\nWell-treated $game_concept_hostages$ are likely to become loyal to their $game_concept_warden$, who may gain a [hook|E], or even become [friends|E] with them.\n\n$game_concept_hostages$ must be landless children, siblings, nieces, nephews, or grandchildren of their $game_concept_home_courts_possessive$ $game_concept_ruler$.\n\n$game_concept_wardens$ have a chance to gain a [perpetual_hook|E] on a child $game_concept_hostage$ when they come of age, based on personality, opinion, and years spent at the $game_concept_wardens$ court."
