### TODO AGOT-CHANGED: game_concept_bloc_supremacy_war_desc [AGOT: A $game_concept_bloc_supremacy_war$ is a special type of [war|E] waged between the [leading_houses|E] of two [soryo|E] [house_blocs|E].\n\n#high Unlike other $game_concept_wars$, all members of both $game_concept_blocs$ will join.#!\n\nThe victorious $game_concept_bloc$ will gain [cohesion|E], while the losing $game_concept_bloc$ will lose a third of its $game_concept_cohesion$.\n\nIn addition, any [soryo|E] [member_houses|E] of the losing $game_concept_bloc$ whose [house_head|E] is not [GetTrait('loyal').GetName( GetNullCharacter )], [hooked|E] by, a sub-[vassal|E] of, an [ally|E] of, [friends|E] with, or [cowed|E] of the losing $game_concept_leading_house_possessive$ $game_concept_house_head$, will join the victorious $game_concept_bloc$. | TR: $game_concept_bloc_supremacy_war$, iki [soryo|E] [Concept('house_blocs', 'Hane Bloğunun')|E] [Concept('leading_houses', 'Lider Haneleri')|E] arasındaki özel bir [war|E] türüdür.\n\n#high Diğer $game_concept_war$ türlerinin aksine, her iki $game_concept_bloc$ içindeki tüm üyeler de savaşa dâhil olur.#!\n\nKazanan $game_concept_bloc$ [cohesion|E] kazanırken, kaybeden $game_concept_bloc$ sahip olduğu $game_concept_cohesion$ değerinin üçte birini kaybeder.\n\nAyrıca [house_head|E] kaybeden Bloğun Lider Hanesinin Hane Reisi tarafından [Concept('cowed', 'Sindirilmemiş')|E], üzerinde [Concept('hooked', 'Koz')|E] sahibi olunmayan, [Concept('vassal', 'Vasalı')|E], [Concept('ally', 'Müttefiği')|E] veya [Concept('friends', 'Arkadaşı')|E] olmayan ve [GetTrait('loyal').GetName( GetNullCharacter )] özelliğine sahip olmayan [soryo|E] [Concept('member_houses', 'Üye Haneler')|E] kazanan Bloğa katılır.]
 game_concept_bloc_supremacy_war_desc: "A $game_concept_bloc_supremacy_war$ is a special type of [war|E] waged between the [leading_houses|E] of two [soryo|E] [house_blocs|E].\n\n#high Unlike other $game_concept_wars$, all members of both $game_concept_blocs$ will join.#!\n\nThe victorious $game_concept_bloc$ will gain [cohesion|E], while the losing $game_concept_bloc$ will lose a third of its $game_concept_cohesion$.\n\nIn addition, any [soryo|E] [member_houses|E] of the losing $game_concept_bloc$ whose [house_head|E] is not [GetTrait('loyal').GetName( GetNullCharacter )], [hooked|E] by, a sub-[vassal|E] of, an [ally|E] of, [friends|E] with, or [cowed|E] of the losing $game_concept_leading_house_possessive$ $game_concept_house_head$, will join the victorious $game_concept_bloc$."
