### TODO AGOT-CHANGED: game_concept_house_head_desc [AGOT: Every [house|E] within a [dynasty|E] has a $game_concept_house_head$, who wields certain unique powers over the members of the House.\n\nNotably, the $game_concept_house_head$ can legitimize [bastards|E], call the members of the House to [war|E] and demand conversion of [landed|E] members. The $game_concept_house_head$ also gets a [weak_hook|E] on all members of their House that are born while they are in power.\n\nWhen they die, their [primary_heir|E] becomes the new $game_concept_house_head$.\n\n[clan_house_heads|E] have special rules and privileges. | TR: [dynasty|E] dâhilindeki her [house|E]nin Hane mensupları üzerinde çeşitli yetkilere sahip bir $game_concept_house_head$ vardır.\n\nÖrneğin $game_concept_house_head$ [bastards|E]i meşrulaştırabilir, Hane mensuplarını [Concept( 'war', 'Savaşa' )|E] çağırabilir ve [landed|E] mensupların din değiştirmesini talep edebilir. $game_concept_house_head$ aynı zamanda baştayken dünyaya gelmiş Hane mensupları üzerinde [weak_hook|E] elde eder.\n\nÖldüklerinde [primary_heir|E] yeni $game_concept_house_head$ olur.\n\n[clan_house_heads|E] özel kurallara ve ayrıcalıklara sahiptir.]
 game_concept_house_head_desc: "Every [house|E] within a [dynasty|E] has a $game_concept_house_head$, who wields certain unique powers over the members of the House.\n\nNotably, the $game_concept_house_head$ can legitimize [bastards|E], call the members of the House to [war|E] and demand conversion of [landed|E] members. The $game_concept_house_head$ also gets a [weak_hook|E] on all members of their House that are born while they are in power.\n\nWhen they die, their [primary_heir|E] becomes the new $game_concept_house_head$.\n\n[clan_house_heads|E] have special rules and privileges."
