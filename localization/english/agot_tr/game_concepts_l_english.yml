 game_concept_majesty_tour_desc:0 "[Concept( 'vassals', 'Vasallarınızın' )|E] aklını çelerek size karşı olan [Concept( 'opinion', 'görüşlerini' )|E] arttırmaya çalıştığınız [Concept( 'tour_type', 'gezi türüdür' )|E]."
 game_concept_accolade:0 "Mükâfat"
 game_concept_accolades:0 "Mükâfatlar"
 game_concept_accolade_desc:5 "Mükâfatlar, [Concept( 'liege', 'Süzerenleri' )|E] tarafından [Concept( 'knights', 'Şövalyelere' )|E] verilen onurlardır.\n\nMükâfatı elinde tutan şövalye [acclaimed_knight|E] olur.\n\nTanınmış Şövalye [glory|E] kazandıkça [Concept('accolade_squires', 'Yaverlerinin')|E] Yetkinliği artar (böylece [accolade_succession|E] iyileşir) ve [accolade_ranks|E] kazanılabilir. Bunlar daha fazla [Concept('accolade_types', 'Mükâfat Niteliğinin')|E] açılmasını sağlar ve daha güçlü bonuslar sunar.\n\nTanınmış Şövalye öldüğünde [accolade_succession|E] gerçekleşir ve şövalyenin yerine, becerileri [Concept('accolade_squires', 'Yaver')|E] Yetkinliği tarafından belirlenen bir mirasçı geçer.\n\n[innovations|e] ve yüksek [Concept('title_tiers', 'Unvan Seviyeleri')|e] sayesinde [rulers|E] aynı anda daha fazla Mükâfata sahip olabilirler."
 game_concept_accolade_desc:5 "Mükâfatlar, [Concept( 'liege', 'Süzerenleri' )|E] tarafından [Concept( 'knights', 'Şövalyelere' )|E] verilen onurlardır.\n\nMükâfatı elinde tutan şövalye [acclaimed_knight|E] olur.\n\nTanınmış Şövalye [glory|E] kazandıkça [Concept('accolade_squires', 'Yaverlerinin')|E] Yetkinliği artar (böylece [accolade_succession|E] iyileşir) ve [accolade_ranks|E] kazanılabilir. Bunlar daha fazla [Concept('accolade_types', 'Mükâfat Niteliğinin')|E] açılmasını sağlar ve daha güçlü bonuslar sunar.\n\nTanınmış Şövalye öldüğünde [accolade_succession|E] gerçekleşir ve şövalyenin yerine, becerileri [Concept('accolade_squires', 'Yaver')|E] Yetkinliği tarafından belirlenen bir mirasçı geçer.\n\n[innovations|e] ve yüksek [Concept('title_tiers', 'Unvan Seviyeleri')|e] sayesinde [rulers|E] aynı anda daha fazla Mükâfata sahip olabilirler."
