### TODO AGOT-CHANGED: game_concept_story_content_hasan_desc [AGOT: #tooltip_heading Story Style: Moderate#!\n\nAs Hasan, you will be guided down a path of religious fanaticism, picking a place to bring the light of the True Faith to and converting [counties|E] out from under their [rulers|E].\n\nEventually, your story will culminate with a major religious uprising against your chosen foe.\n\n$game_concept_story_generic_desc_boilerplate$ | TR: #tooltip_heading Hikâye Tipi: Ortalama#!\n\nHasan ile dinî fanatizm yolunda ilerleyeceksiniz. Gerçek inancın ışığını getirecek yerler seçecek ve [Concept( 'counties', 'Kontluklarının' )|E] mezhebini göz göre göre değiştireceksiniz.\n\nSonunda, hikâyeniz seçtiğiniz düşmana karşı büyük bir dinî ayaklanma ile sonuçlanacak.\n\n$game_concept_story_generic_desc_boilerplate$]
