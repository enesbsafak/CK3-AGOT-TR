### TODO AGOT-CHANGED: game_concept_hegemon_desc [AGOT: A $game_concept_hegemon$ is a [ruler|E] whose [primary_title|E] is a [hegemony|E].\n\nTheir [rank|E] is the highest possible, directly above [emperors|E]. As such, they can have any non-$game_concept_hegemons$ as their [vassals|E], and they can never have a [liege|E]. | TR: [Concept( 'primary_title', 'Birincil Unvanı' )|E] bir [hegemony|E] olan [Concept( 'ruler', 'Hükümdarlar' )|E] $game_concept_hegemon$ olarak adlandırılır.\n\n[Concept( 'rank', 'Kademesi' )|E] mümkün olan en yüksek seviyededir ve [Concept( 'emperors', 'İmparatorların' )|E] bir üstündedir. Bu yüzden $game_concept_hegemon$ olmayan herkes [Concept('vassal', 'Vasalları')|E] olabilir ve kimse [Concept('liege', 'Süzerenleri')|E] olamaz.]
 game_concept_hegemon_desc: "A $game_concept_hegemon$ is a [ruler|E] whose [primary_title|E] is a [hegemony|E].\n\nTheir [rank|E] is the highest possible, directly above [emperors|E]. As such, they can have any non-$game_concept_hegemons$ as their [vassals|E], and they can never have a [liege|E]."
 game_concept_culture:0 "Kültür"
