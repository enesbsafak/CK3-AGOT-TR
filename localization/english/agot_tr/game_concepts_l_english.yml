### TODO AGOT-CHANGED: game_concept_gunpowder_desc [AGOT: Handgunners are [men_at_arms|E] who are armed with potent gunpowder weapons.\n\nWhile each kind of Handgunner is unique, they generally [counter|E] [heavy_infantry|E], and are in turn Countered by [heavy_cavalry|E] and [light_cavalry|E]. | TR: Tüfekçiler, güçlü barutlu silahlarla donatılmış [men_at_arms|E] birlikleridir.\n\nBirçok Tüfekçi türü olsa da genellikle [heavy_infantry|E] birliklerini [counter|E]; buna karşılık [heavy_cavalry|E] ve [light_cavalry|E] tarafından karşılanır.]
 game_concept_gunpowder_desc: "Handgunners are [men_at_arms|E] who are armed with potent gunpowder weapons.\n\nWhile each kind of Handgunner is unique, they generally [counter|E] [heavy_infantry|E], and are in turn Countered by [heavy_cavalry|E] and [light_cavalry|E]."
 game_concept_counter:0 "Karşılama"
 game_concept_counters:0 "Karşılar"
 game_concept_men_at_arms_counter:0 "Düzenli Asker Karşılama"
 game_concept_men_at_arms_counter_desc:0 "Çoğu [men_at_arms|E] başka bir $game_concept_men_at_arms$ türünü karşılayabilir.\n\nBir [regiment|E] başkası tarafından karşılandığında [Concept( 'battle', 'Muharebedeki' )|E] verimliliği düşer. Onu karşılayan birlikler ne kadar kalabalıksa karşılanan birliğin aldığı ceza da o kadar fazladır."
 game_concept_cowed:1 "Sindirilmiş"
 game_concept_cowed_desc:2 "Sindirilmiş karakterler bir karakterin karşısında korkudan felç geçirirler. Onlara karşı [faction|E] başlatmak gibi düşmancıl eylemlerde bulunmaktan genellikle kaçınırlar.\n\nBir karakter [dread|E]tan ve/veya korkak bir kişilikten dolayı sindirilir veya gözü korkar."
 game_concept_supply:0 "İkmal"
 game_concept_supply_state:0 "İkmal Durumu"
 game_concept_supply_desc:1 "$game_concept_supply$ bir [Concept( 'army', 'Ordunun' )|E] taşıdığı yiyecekler ve ekipmanlardır. Ordunun büyüklüğü bulunduğu yerin [supply_limit|E]nden fazlaysa $game_concept_supply$ kaybetmeye başlar. \n\nİkmali az olan ordular [Concept( 'battle', 'Muharebede' )|E] [advantage|E] cezası alır ve eğer $game_concept_supplies$i biterse [attrition|E]ya maruz kalır.\n\nOrdu $game_concept_supply_limit$ni geçmediği dost topraklarda kaldığı sürece zaman içerisinde kendi ikmali artar."
### TODO AGOT-CHANGED: game_concept_scheme_speed [AGOT: Scheme Phase Length | TR: Plan Aşama Süresi]
