 game_concept_betrothal_desc_NO_TOTO_DLC:0 "$game_concept_betrothal$ taraflardan birinin henüz [adult|E] olmaması durumunda, gelecekte [marry|E]ileceğine ilişkin bir çeşit söz vermedir.\n\nNişanlanmalar tıpkı Evlilikler gibi [alliance|E] edinmenizi sağlayabilir ancak ondan farklı olarak kolaylıkla bozulabilirler. Yetişkinliğe erişildiğinde Nişan, Evliliğe dönüşür."
 game_concept_betrothal_desc_TOTO_DLC:0 "$game_concept_betrothal$, gelecekte yapılacak bir [Concept( 'marriage', 'Evlilik' )|E] için teminatta bulunmadır. Taraflardan birinin henüz [adult|E] olmaması durumunda veya bir [GetActivityType( 'activity_wedding' ).GetName] için [Concept( 'grand_wedding_promised', 'söz verildiğinde' )|E] yapılabilir.\n\nNişanlanmalar tıpkı Evlilikler gibi [alliance|E] edinmenizi sağlayabilir. Normal nişanlar istendiği kadar uzun sürebilir ve kolayca bozulabilir. İki taraf da yetişkinliğe eriştiğinde nişan, evliliğe dönüştürülebilir. Ancak [GetActivityType( 'activity_wedding' ).GetName] sözü verilmiş ise sadece Büyük Düğün tamamlandığında gerçek bir evliliğe dönüştürülür."
 game_concept_marry:0 "Evlen"
 game_concept_bastard:0 "Piç"
 game_concept_bastards:0 "Piçler"
 game_concept_bastard_desc:1 "$game_concept_bastards$ evlilik dışı doğan gayrimeşru çocuklardır. Bu nedenle miras yoluyla [title|E] devralamazlar. Ebeveynleri tarafından [house_head|E]nin onayı ile [Concept( 'legitimized', 'meşrulaştırılabilir' )|E].\n\nPiçin hangi [house|E]ye mensup olduğu doğduklarında ebeveynlerinin [Concept( 'faiths', 'Mezheplerinin' )|E] [Concept( 'doctrines', 'İlkelerine' )|E] göre belirlenir.\n\nEğer bir piçe unvan verilirse veya çocuk sahibi olursa yeni bir [dynasty|E] kurar."
