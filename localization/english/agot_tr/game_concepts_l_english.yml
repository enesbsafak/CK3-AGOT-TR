 game_concept_dreams_desc: "Characters with the [GetTrait('dragon_dreams').GetName( GetNullCharacter )] or [GetTrait('greensight').GetName( GetNullCharacter )] [traits|E] may occasionally experience dreams that will alert them to potential schemes or plots against them or their loved ones."
 game_concept_board_game_type_go:0 "Go"
