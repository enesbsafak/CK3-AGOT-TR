### TODO AGOT-CHANGED: game_concept_languages [AGOT: Tongues | TR: Diller]
 game_concept_languages:0 "Tongues"
### TODO AGOT-CHANGED: game_concept_language_desc [AGOT: A Tongue is the [culture_pillar|E] that determines what tongue the general populace of a [culture|E] speaks. $game_concept_cultures$ which speak the same language gain a permanent bonus to their [cultural_acceptance_baseline|E].\n\nA [character|E] can know one or more Tongues. Knowing a tongue cuts the [cultural_acceptance|E] [opinion|E] penalty in half towards Characters and [counties|E] that speak it. It also discourages [faction_independence|E] and [claimant_factions|E].\n\nCharacters can learn additional tongues by using the [GetScheme('learn_language').GetTypeName] [scheme|E]. Characters can comfortably learn tongues up to their [language_limit|E]. | TR: Dil, [Concept( 'culture', 'kültürün' )|E] hangi dilde konuştuğunu belirleyen bir [Concept( 'culture_pillar', 'kültürel özelliktir' )|E]. Aynı dili konuşan kültürlerin [cultural_acceptance_baseline|E] daha yüksektir.\n\nBir [character|E] birden fazla dil bilebilir. Dil bilmek, o dilde konuşan yabancı karakterlerin ve [Concept( 'counties', 'kontlukların' )|E] o karaktere karşı sahip olduğu [cultural_acceptance|E] [opinion|E] cezasını yarıya indirir. Ayrıca [faction_independence|E] ve [Concept( 'claimant_factions', 'Hak Sahibi örgütleşmelerini' )|E] caydırır.\n\nKarakterler [GetScheme('learn_language').GetTypeName] [Concept( 'scheme', 'planını' )|E] kullanarak yeni diller öğrenebilir. Karakterlerin öğrenebileceği dil sayısı [Concept( 'language_limit', 'yabancı dil sınırı' )|E] ile sınırlıdır.]
 game_concept_language_desc:3 "A Tongue is the [culture_pillar|E] that determines what tongue the general populace of a [culture|E] speaks. $game_concept_cultures$ which speak the same language gain a permanent bonus to their [cultural_acceptance_baseline|E].\n\nA [character|E] can know one or more Tongues. Knowing a tongue cuts the [cultural_acceptance|E] [opinion|E] penalty in half towards Characters and [counties|E] that speak it. It also discourages [faction_independence|E] and [claimant_factions|E].\n\nCharacters can learn additional tongues by using the [GetScheme('learn_language').GetTypeName] [scheme|E]. Characters can comfortably learn tongues up to their [language_limit|E]."
 game_concept_cultural_head:0 "Kültürel Önder"
 game_concept_culture_head:1 "Kültür Önderi"
 game_concept_culture_head_desc:3 "Kültür önderi, kendi [Concept( 'culture', 'Kültüründe' )|E] en fazla nüfuza sahip olan [Concept( 'rulers', 'Hükümdardır' )|E].\n\nDaha belirgin olmak gerekirse, [Concept( 'realm', 'Ülkesinde' )|E] kendi [Concept( 'culture', 'Kültüründen' )|E] en fazla [Concept( 'county', 'Kontluğa' )|E] sahip olan hükümdar, [domain|E]ünün nerede olduğuna veya başka kültürlerden ne kadar toprağa sahip olduğuna bakılmaksızın kültür önderi olur.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nKültür önderi [cultural_fascination|E] belirleyerek hangi [innovation|E]a öncelik verileceğini seçebilir.\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_culture_head_desc_NOMAD_DLC: "\n\nÖte yandan [nomadic|E] [rulers|E], fark etmeksizin en çok [Concept('herd', 'Sürüye')|E] sahip karakteri $game_concept_cultural_head$ olarak görür. Aynı [Concept('culture', 'Kültürde')|E] hem göçebe hem yerleşik karakterler bulunması durumunda ise [military_power|E] belirleyici rol oynar."
 game_concept_culture_head_desc_REFORM_DLC:0 "$game_concept_culture_head$ ayrıca kültürlerinin belirli yönlerini [reform|E] edebilir."
 game_concept_culture_head_desc_NO_REFORM_DLC:0 "$game_concept_culture_head$ ayrıca kültürleri için yeni [traditions|E] getirebilir."
 game_concept_core_tenet:1 "Öğreti"
 game_concept_core_tenet_desc:1 "[doctrines|E] bir [Concept( 'faith', 'Mezhebin' )|E] hangi tutumu sergileyeceğini seçmesi gereken sorunlar iken $game_concept_core_tenets$ mezhebin özgün yöntemlerini ve törenlerini yansıtır."
 game_concept_core_tenets:1 "Öğretiler"
 game_concept_holy_war:0 "Kutsal Savaş"
 game_concept_holy_wars:0 "Kutsal Savaşlar"
 game_concept_holy_war_holy:0 "Kutsal"
 game_concept_holy_war_desc:4 "$game_concept_holy_war$ bir [ruler|E] tarafından farklı [Concept( 'faith', 'Mezhepteki' )|E] bir hükümdara açılan özel bir [war|E]tır.\n\n$game_concept_holy_wars$ genellikle yıkıcıdır, genellikle kazanan taraf hedef bölgedeki tüm [Concept( 'counties', 'Kontlukları' )|E] kendisi için ele geçirir. Ancak saldıranın mezhebi [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] ise veya hedef bölgede savunan tarafın kontrol ettiği, saldıran tarafla aynı mezhebe sahip [vassals|E] varsa bu vasallar fethedilmek yerine kazanana aktarılabilir.\n\nDiğer savaşların aksine hedef karakter ile aynı mezhepten olan hükümdarlar [alliance|E] gerekmeden savunmaya katılabilirler.\n\nKutsal savaşlar açılıp açılamayacağı [religious_families|E]ne göre değişir."
 game_concept_great_holy_war:0 "Büyük Kutsal Savaş"
 game_concept_great_holy_wars:0 "Büyük Kutsal Savaşlar"
### TODO AGOT-CHANGED: game_concept_great_holy_war_desc [AGOT: A $game_concept_great_holy_war$ is a special type of [war|E] that only the [head_of_faith|E] of certain [faiths|E] can declare, with the goal of bringing an entire [kingdom|E] under the rule of their Faith.\n\n$game_concept_great_holy_wars$ target all [rulers|E] of another [religion|E] within a chosen [kingdom|E], forcing them to defend together. If victorious, all [titles|E] within the targeted Kingdom will be seized and divided between the attackers.\n\nDepending on its [doctrines|E], a Faith might have access to [directed_great_holy_wars|E], [undirected_great_holy_wars|E] or no $game_concept_great_holy_wars$ at all:\n$EFFECT_LIST_BULLET$The [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName], or [GetFaithDoctrine('tenet_warmonger').GetBaseName] [core_tenets|E] are required to access to Great Holy Wars in general\n$EFFECT_LIST_BULLET$Faiths with a [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] Head only have access to Directed Great Holy Wars\n$EFFECT_LIST_BULLET$Faiths with a [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] Head only have access to Undirected Great Holy Wars\n$EFFECT_LIST_BULLET$Faiths without a Head of Faith cannot declare any Great Holy Wars, even if they would normally be eligible\n\nSome Faiths have special names for their Great Holy Wars. These Great Holy Wars differ in name only, and function as any other Great Holy War. | TR: $game_concept_great_holy_war$ sadece belirli [Concept( 'faiths', 'Mezheplerin' )|E] [head_of_faith|E]nin açabileceği özel bir [war|E]tır. Amacı bir [Concept( 'kingdom', 'Krallığın' )|E] tamamını kendi mezheplerinin kontrolüne geçirmektir.\n\n$game_concept_great_holy_wars$ seçilen [kingdom|E] içindeki farklı [religion|E]den olan tüm [Concept( 'rulers', 'Hükümdarları' )|E] hedef alır ve onları birlikte savunmaya zorlar. Eğer kazanırlarsa hedef krallıktaki tüm [titles|E] saldıranlar arasında bölüştürülür.\n\n[Concept( 'doctrines', 'İlkelerine' )|E] göre bir mezhep [directed_great_holy_war|E]a veya [undirected_great_holy_war|E]a sahip olabilir ama herhangi bir $game_concept_great_holy_war$a da sahip olmayabilir.\n$EFFECT_LIST_BULLET$[GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName] veya [GetFaithDoctrine('tenet_warmonger').GetBaseName] [Concept( 'core_tenet', 'Öğretisi' )|E] Büyük Kutsal Savaş açabilmek için gereklidir\n$EFFECT_LIST_BULLET$[GetFaithDoctrine('doctrine_temporal_head').GetBaseName] lidere sahip olan mezhepler sadece düzenli büyük kutsal savaş açabilir\n$EFFECT_LIST_BULLET$[GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] lidere sahip olan mezhepler sadece düzensiz büyük kutsal savaş açabilir\n$EFFECT_LIST_BULLET$Mezhep liderine sahip olmayan mezhepler herhangi bir şekilde büyük kutsal savaş açamazlar\n\nBazı mezheplerde büyük kutsal savaşlar için 'Haçlı' veya 'Cihat' gibi özel isimler vardır. Bu büyük kutsal savaşların sadece adı farklıdır, diğer tüm büyük kutsal savaşlarla aynı işlerler.]
 game_concept_great_holy_war_desc:3 "A $game_concept_great_holy_war$ is a special type of [war|E] that only the [head_of_faith|E] of certain [faiths|E] can declare, with the goal of bringing an entire [kingdom|E] under the rule of their Faith.\n\n$game_concept_great_holy_wars$ target all [rulers|E] of another [religion|E] within a chosen [kingdom|E], forcing them to defend together. If victorious, all [titles|E] within the targeted Kingdom will be seized and divided between the attackers.\n\nDepending on its [doctrines|E], a Faith might have access to [directed_great_holy_wars|E], [undirected_great_holy_wars|E] or no $game_concept_great_holy_wars$ at all:\n$EFFECT_LIST_BULLET$The [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName], or [GetFaithDoctrine('tenet_warmonger').GetBaseName] [core_tenets|E] are required to access to Great Holy Wars in general\n$EFFECT_LIST_BULLET$Faiths with a [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] Head only have access to Directed Great Holy Wars\n$EFFECT_LIST_BULLET$Faiths with a [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] Head only have access to Undirected Great Holy Wars\n$EFFECT_LIST_BULLET$Faiths without a Head of Faith cannot declare any Great Holy Wars, even if they would normally be eligible\n\nSome Faiths have special names for their Great Holy Wars. These Great Holy Wars differ in name only, and function as any other Great Holy War."
 game_concept_war_chest:0 "Savaş Sandığı"
 game_concept_war_chest_desc:1 "$game_concept_war_chest$ [gold|E], [piety|E] ve [prestige|E] içeren bir sandıktır. İçindekilerin ana kullanım amacı [undirected_great_holy_wars|E] kazanıldığında ödül olarak dağıtılmasıdır. Bu dağıtım saldıranların [Concept( 'war', 'Savaştaki' )|E] katılımına göre yapılır.\n\n$game_concept_war_chest$nın bir miktarı da savaş başladığında saldıranlar arasında bölüştürülecektir.\n\nEğer [undirected_great_holy_war|E] kaybedilirse savunan taraf $game_concept_war_chest$ndaki dindarlık ve prestiji aralarında paylaşır #weak (altın kaybolur)#!"
 game_concept_crusade:0 "Haçlı"
 game_concept_crusades:0 "Haçlılar"
 game_concept_rank:0 "Kademe"
 game_concept_ranks:0 "Kademeler"
 game_concept_clergy:0 "Ruhban"
 game_concept_clergy_desc:1 "[court_chaplains|E], [realm_priests|E], [theocratic|E] hükümdarlar ve [GetTrait('devoted').GetName( GetNullCharacter )] özelliğine sahip olan herkes ruhban sınıfından sayılır.\n\n[Concept( 'faith', 'Mezhebin' )|E] [Concept( 'doctrines', 'İlkeleri' )|E] kimin ruhban sınıfından olabileceğini ve ruhban mensuplarının evlenip evlenemeyeceğini, toprak devralıp alamayacağını vb. gibi şeyleri belirler."
 game_concept_church_property:0 "Kilise Yerleşimleri"
 game_concept_church: "Kilise"
 game_concept_church_property_desc:0 "Kilise Yerleşimleri, [Concept( 'realm_priest', 'Ülke Rahibinin' )|E] kontrolündeki [temples|E]dır.\n\n[GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] [Concept( 'doctrine', 'İlkesine' )|E] sahip [Concept( 'faiths', 'Mezheplerde' )|E] kilise yerleşimi bulunmaz ve [temples|E] herhangi bir ceza olmadan doğrudan ruhban sınıfından olmayan [rulers|E] tarafından kontrol edilebilir."
 game_concept_embarked:0 "Gemiye Binmiş"
 game_concept_embark:0 "Bindirme"
 game_concept_era:0 "Dönem"
 game_concept_eras:0 "Dönemler"
### TODO AGOT-CHANGED: game_concept_era_desc [AGOT: [innovations|E] can only be discovered if the [culture|E] has reached the requisite Era. The next Era can only start past a certain year, and if at least #V 50%#! of the Innovations of the previous Era have been discovered.\n\nRulers with [tribal_government|E] and [nomadic_government|E] can only make use of $culture_era_tribal$ Innovations. | TR: [innovations|E] sadece [culture|E] gereken döneme ulaştığında açılabilir. Sonraki dönem belli bir yılı geçtikten ve daha önceki dönemdeki buluşların en az #V %50#!'si açıldığında başlayabilir.\n\n[tribal_government|E] ve [nomadic_government|E] sahibi olan hükümdarlar sadece kabile dönemi buluşlarını kullanabilir.]
 game_concept_era_desc:1 "[innovations|E] can only be discovered if the [culture|E] has reached the requisite Era. The next Era can only start past a certain year, and if at least #V 50%#! of the Innovations of the previous Era have been discovered.\n\nRulers with [tribal_government|E] and [nomadic_government|E] can only make use of $culture_era_tribal$ Innovations."
 game_concept_cultural_spread: "Kültürel Yayılma"
 game_concept_spread: "Yayılma"
 game_concept_cultural_spread_desc: "Henüz keşfedilmemiş [innovations|E] barındıran diğer [cultures|E] ile temas, bu $game_concept_innovations$dan birinin daha hızlı keşfedilmesini sağlar. Uygun [cultures|E] arasından, en yüksek [cultural_acceptance|E] değerine sahip olan, [innovation|E] ilerlemesini yaymak üzere seçilir."
 game_concept_bred:0 "Eşleştirilmiş"
 game_concept_breed:0 "Eş Seçimi Yap"
 game_concept_cadet_branch:0 "Alt Hane"
 game_concept_cadet_branches:0 "Alt Haneler"
 game_concept_damage:0 "Hasar"
 game_concept_damage_desc:1 "[soldiers|E]in hasarı [battle|E] sırasında düşmana ne kadar [casualty|E] verdirebileceğini gösterir.\n\n[levy|E] askerleri [GetDefine('NCombat', 'LEVY_ATTACK')|0] hasar verir."
 game_concept_toughness:0 "Dayanıklılık"
 game_concept_toughness_desc:1 "[soldiers|E]in dayanıklılığı [battle|E] sırasında bir [casualty|E] hâline gelmeden ne kadar [damage|E] alabileceklerini belirler.\n\n[levy|E] askerleri [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] dayanıklılığa sahiptir."
 game_concept_screen:0 "Siper"
 game_concept_screen_desc:0 "Yenilen [army|E], [Concept( 'battle', 'Muharebenin' )|E] [aftermath|E] safhasında verdiği [casualty|E] miktarını ordunun toplam siper değerine göre azaltabilir."
 game_concept_completely_controls:0 "Tamamen Kontrol"
 game_concept_completely_control:0 "Tamamen Kontrol"
 game_concept_completely_controlled:0 "Tamamen Kontrol Ediliyor"
 game_concept_complete_control:0 "Tam Kontrol"
