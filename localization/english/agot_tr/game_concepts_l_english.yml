### TODO AGOT-CHANGED: game_concept_scheme_phase_desc [AGOT: A $game_concept_scheme_phase_phase$ is the length of time it takes to boost [scheme_success_chance|E] #EMP once#!.\n\nEach $game_concept_scheme_phase_phase$ the $game_concept_scheme$ will gain an [scheme_opportunity_opportunity|e]. The [scheme_speed_single|e] can be shortened by appointing [agents|e], and is increased by the [scheme_resistance|e] of the target. | TR: Plan aşaması, [scheme_success_chance|E] #EMP bir kere#! arttırılana kadar geçen süredir.\n\nPlanın her aşamasında [scheme_opportunity_opportunity|e] kazanılır. [scheme_speed_single|E] yardakçılar ile kısaltılabilir, hedefin [scheme_resistance|e] nedeniyle artabilir.]
 game_concept_scheme_phase_desc: "A $game_concept_scheme_phase_phase$ is the length of time it takes to boost [scheme_success_chance|E] #EMP once#!.\n\nEach $game_concept_scheme_phase_phase$ the $game_concept_scheme$ will gain an [scheme_opportunity_opportunity|e]. The [scheme_speed_single|e] can be shortened by appointing [agents|e], and is increased by the [scheme_resistance|e] of the target."
 game_concept_secret:0 "Sır"
 game_concept_secrets:0 "Sırlar"
 game_concept_secret_desc:0 "$game_concept_secrets$ karakterlerin utanç verici, ahlak dışı veya düpedüz [crime|E] teşkil etmesi sebebiyle diğerlerince bilinmemesini istediği şeylerdir.\n\nSırlar [Concept( 'spymaster', 'Casusbaşına' )|E] verilen '$task_find_secrets$' [councillor_task|E] aracılığıyla keşfedilebilir. Birinin $game_concept_secret$rını bildikten sonra bunu bir [hook|E] olarak kullanarak karaktere [blackmail|E] uygulayabilirsiniz."
