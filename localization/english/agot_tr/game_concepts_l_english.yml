### TODO AGOT-CHANGED: game_concept_duchy_desc [AGOT: A $game_concept_duchy$ is a [title|E] one [title_tier|E] below a [kingdom|E] and one above a [county|E].\n\nThe [holder|E] of a $game_concept_duchy$ has [de_jure|E] rights to its constituent $game_concept_counties$ and can have [counts|E] as [vassals|E].\n\nDuchies may be dormant and have no current Holder. Such $game_concept_title_succession$ can be created by a [ruler|E] who controls at least half of its $game_concept_counties$. | TR: $game_concept_duchy$, [Concept( 'kingdom', 'Krallığın' )|E] bir [title_tier|E] altında ve [Concept( 'county', 'Kontluğun' )|E] bir [title_tier|E] üstünde olan bir [Concept( 'title', 'Unvandır' )|E].\n\nDüklük Unvanının [Concept('holder', 'Sahibi')|E], düklüğü oluşturan $game_concept_counties$ üzerinde [de_jure|E] haklara sahiptir ve [count|E] [Concept('vassals', 'Vasallara')|E] sahip olabilir.\n\nDüklük Unvanları oluşturulmamış olabilir ve bu bir [Concept('holder', 'Sahipleri')|E] olmayabilir. Bu durumda Kontluklarının en az yarısını kontrol eden bir [ruler|E] tarafından oluşturulabilirler.]
 game_concept_duchy_desc: "A $game_concept_duchy$ is a [title|E] one [title_tier|E] below a [kingdom|E] and one above a [county|E].\n\nThe [holder|E] of a $game_concept_duchy$ has [de_jure|E] rights to its constituent $game_concept_counties$ and can have [counts|E] as [vassals|E].\n\nDuchies may be dormant and have no current Holder. Such $game_concept_title_succession$ can be created by a [ruler|E] who controls at least half of its $game_concept_counties$."
