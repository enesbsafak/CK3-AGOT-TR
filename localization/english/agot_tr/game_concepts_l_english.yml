 game_concept_hooked:0 "Koz Elde Edilmiş"
 game_concept_hook_desc:1 "$game_concept_hook$ bir karakterin diğerine istediğini yaptırabilmesini sağlar.\n\nİki tür koz vardır, [weak_hooks|E] ve [strong_hooks|E].\n\n$game_concept_hooks$ çeşitli etkileşimleri zorla gerçeğe dönüştürmek üzere kullanılabilir, örneğin [marriage|E] teklifleri ve [vassal_contract|E] değişiklikleri."
 game_concept_weak_hook:0 "Zayıf Koz"
 game_concept_weak_hooks:0 "Zayıf Kozlar"
 game_concept_weak_hook_desc:1 "$game_concept_weak_hook$ iyilik borcu olan veya etki altına almayı başardığınız karakterlere karşı sahip olabileceğiniz, sıklıkla rastlanan bir [hook|E] türüdür.\n\nHer ne kadar [marriage|E] teklifleri gibi $game_concept_weak_hooks$ aracılığıyla zorlayabileceğiniz çok sayıda etkileşim olsa da, bu türdeki kozlarla birisini [GetScheme('murder').GetTypeName] planınızda [agent|E] olmaya zorlayamazsınız ve bu koza sahip olmak pasif fayda sağlamaz #weak (onun için [strong_hook|E] gerekir.)#!\n\n[noble|E] bir [house|E]de dünyaya gelen her çocuk [house_head|E]ne $game_concept_weak_hook$ sağlar.\n\n$game_concept_weak_hook$ bir kere kullanıldığında #emphasis kaybedilir.#!"
