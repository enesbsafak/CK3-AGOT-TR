### TODO AGOT-CHANGED: game_concept_scheme_growth_desc [AGOT: Every [scheme_phase_phase|E], a $game_concept_scheme$'s [success_chance|E] is increased by this value, until the maximum current [scheme_potential_potential|E] is hit.\n\n#WEAK For instance, if a $game_concept_scheme$ currently has 50% $game_concept_success_chance$, a $game_concept_scheme_potential_potential$ of 54%, and a $game_concept_scheme_growth_growth$ of 3%, then after one $game_concept_scheme_phase_phase$ has gone by, it'll have 53% $game_concept_success_chance$.\n\nSince $game_concept_scheme_growth_growth$ is still capped by $game_concept_scheme_potential_potential$, after the next phase, the $game_concept_scheme$ would only have 54% $game_concept_success_chance$.#! | TR: Bir planın [success_chance|E] her aşamada bu miktar kadar artar. Mevcut maksimum [Concept( 'scheme_potential_potential', 'Potansiyele' )|E] ulaşıldığında artış durur.\n\n#WEAK Örneğin planın mevcut başarı ihtimali %50, potansiyeli %54 ve artışı %3 ise bir aşama sonrasında planın başarı ihtimali %53 olur.\n\nArtış, potansiyel tarafından sınırlandırıldığı için sonraki aşamada başarı ihtimali sadece %54 olur.#!]
 game_concept_scheme_growth_desc: "Every [scheme_phase_phase|E], a $game_concept_scheme$'s [success_chance|E] is increased by this value, until the maximum current [scheme_potential_potential|E] is hit.\n\n#WEAK For instance, if a $game_concept_scheme$ currently has 50% $game_concept_success_chance$, a $game_concept_scheme_potential_potential$ of 54%, and a $game_concept_scheme_growth_growth$ of 3%, then after one $game_concept_scheme_phase_phase$ has gone by, it'll have 53% $game_concept_success_chance$.\n\nSince $game_concept_scheme_growth_growth$ is still capped by $game_concept_scheme_potential_potential$, after the next phase, the $game_concept_scheme$ would only have 54% $game_concept_success_chance$.#!"
