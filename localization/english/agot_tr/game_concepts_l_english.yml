### TODO AGOT-CHANGED: game_concept_clan_house_head_desc [AGOT: A $game_concept_clan_house_head$ is in many ways like a normal [house_head|E], but differs in some notable ways.\n\n$game_concept_clan_house_heads$ do not get a [weak_hook|E] on all the members of their [house|E]. They have more influence over [house_unity|E] than other house members. Additionally, any house member may challenge a $game_concept_clan_house_head$ for superiority to become the $game_concept_house_head$ themself. | TR: $game_concept_clan_house_head$ birçok yönden sıradan [Concept( 'house_head', 'Hane Reislerine' )|E] benzese de, bazı önemli farklara sahiptir.\n\n$game_concept_clan_house_heads$ tüm [house|E] üyeleri üzerinde [weak_hook|E] sahibi olmazlar. [house_unity|E] üzerinde diğer hane üyelerinden daha fazla etki sahibidirler. Ek olarak herhangi bir hane üyesi, $game_concept_clan_house_head$ne meydan okuyarak yeni $game_concept_house_head$ olmaya çalışabilir.]
 game_concept_clan_house_head_desc: "A $game_concept_clan_house_head$ is in many ways like a normal [house_head|E], but differs in some notable ways.\n\n$game_concept_clan_house_heads$ do not get a [weak_hook|E] on all the members of their [house|E]. They have more influence over [house_unity|E] than other house members. Additionally, any house member may challenge a $game_concept_clan_house_head$ for superiority to become the $game_concept_house_head$ themself."
 game_concept_denounce:0 "Kına"
