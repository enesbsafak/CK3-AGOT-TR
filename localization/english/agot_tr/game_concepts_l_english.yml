### TODO AGOT-CHANGED: game_concept_debt_desc [AGOT: Debt is the state of having a negative amount of [gold_i][gold|E]. This typically happens when a [ruler|E] at war hires [mercenaries|E] without having enough Gold to cover the full cost, or when they are at war for too long.\n\n While in Debt you cannot declare new [wars|E], your [men_at_arms|E] do not reinforce, and your enemies will have an [advantage|E] over you in battle. The deeper into debt you fall, the more penalties you will get — fewer [levies|E], reduced [county_opinion|E], and your [vassals|E] will like you less.\n\nIn addition to this, various other minor destabilizing events may occur, such as gaining [county_corruption|E] in your [domain|E] [counties|E]. \n\n#help It is generally a good idea to strike your enemies while they are in Debt, as they will fight with reduced [advantage|E]!#! | TR: Borç, [gold_i][gold|E] miktarının ekside olduğu anlamına gelir. Bu genellikle savaştaki bir [ruler|E] yeteri kadar altını olmadan [mercenary|E] kiraladığında veya savaş çok uzadığında gerçekleşir.\n\nBorçtayken [war|E] ilan edemezsiniz, [men_at_arms|E]ler takviye almaz ve muharebelerde düşmanınız [advantage|E] kazanır. Borcunuz ne kadar artarsa aldığınız ceza o kadar fazla olur. [levy|E] sayınız, [county_opinion|E] azalır ve [Concept( 'vassals', 'Vasallarınız' )|E] sizi daha az sever.\n\nBuna ek olarak [domain|E] [Concept( 'counties', 'Kontluklarında' )|E] [county_corruption|E]nın artması gibi çeşitli olumsuz ve istikrarı bozacak küçük olaylar yaşanabilir.\n\n#help Genellikle düşmanlarınıza Borçlu durumdayken saldırmak genellikle iyi bir fikirdir, daha düşük [advantage|E] sahibi olurlar!#!]
 game_concept_debt_desc: "Debt is the state of having a negative amount of [gold_i][gold|E]. This typically happens when a [ruler|E] at war hires [mercenaries|E] without having enough Gold to cover the full cost, or when they are at war for too long.\n\n While in Debt you cannot declare new [wars|E], your [men_at_arms|E] do not reinforce, and your enemies will have an [advantage|E] over you in battle. The deeper into debt you fall, the more penalties you will get — fewer [levies|E], reduced [county_opinion|E], and your [vassals|E] will like you less.\n\nIn addition to this, various other minor destabilizing events may occur, such as gaining [county_corruption|E] in your [domain|E] [counties|E]. \n\n#help It is generally a good idea to strike your enemies while they are in Debt, as they will fight with reduced [advantage|E]!#!"
