### TODO AGOT-CHANGED: game_concept_barony_desc [AGOT: A $game_concept_barony$ is a [title|E] of the lowest [title_tier|E].\n\n$game_concept_baronies$ have the smallest footprint on the map, organized into larger [counties|E].\n\n$game_concept_barony$ $game_concept_titles$ must always have a [holder|E] if they contain a [holding|E]. | TR: $game_concept_barony$, en düşük [title_tier|E] [Concept( 'title', 'Unvandır' )|E].\n\n$game_concept_baronies$, harita üzerindeki en küçük alana sahiptir ve bir araya gelerek [Concept('counties', 'Kontlukları')|E] oluştururlar.\n\nEn az bir [holding|E] barındıran her $game_concept_barony$ $game_concept_titles$ının her zaman bir [Concept('holder', 'Sahibi')|E] vardır.]
 game_concept_barony_desc: "A $game_concept_barony$ is a [title|E] of the lowest [title_tier|E].\n\n$game_concept_baronies$ have the smallest footprint on the map, organized into larger [counties|E].\n\n$game_concept_barony$ $game_concept_titles$ must always have a [holder|E] if they contain a [holding|E]."
### TODO AGOT-CHANGED: game_concept_baron_desc [AGOT: A $game_concept_baron$ is a [ruler|E] whose [primary_title|E] is a [barony|E].\n\nTheir [rank|E] is the lowest possible, directly below [counts|E]. As such, they cannot have [vassals|E] and any non-$game_concept_baron$ can be their [liege|E]. | TR: [Concept( 'primary_title', 'Birincil Unvanı' )|E] bir [barony|E] olan [Concept( 'ruler', 'Hükümdarlar' )|E] $game_concept_baron$ olarak adlandırılır.\n\nOlabilecek en düşük [Concept( 'rank', 'Kademeye' )|E] sahiptirler ve [Concept( 'counts', 'Kontların' )|E] altındadırlar. Bu yüzden [vassal|E] sahibi olamazlar ve $game_concept_baron$ olmayan diğer tüm hükümdarlar onların [Concept( 'liege', 'Süzereni' )|E] olabilir.]
 game_concept_baron_desc: "A $game_concept_baron$ is a [ruler|E] whose [primary_title|E] is a [barony|E].\n\nTheir [rank|E] is the lowest possible, directly below [counts|E]. As such, they cannot have [vassals|E] and any non-$game_concept_baron$ can be their [liege|E]."
