### TODO AGOT-CHANGED: game_concept_story_content_hereward_desc [AGOT: #tooltip_heading Story Style: Extensive#!\n\nAs Hereward, your exile abroad will prove to be short-lived. With England under the foreign yoke, you will return home to fight for freedom, clear your name, and kill Normans.\n\nA special mechanic will be active for the duration, charting England's resistance to Norman rule, and scripted story events will play during this. Your story will culminate with death: yours, or your enemy's.\n\n$game_concept_story_generic_desc_boilerplate$ | TR: #tooltip_heading Hikâye Tipi: Kapsamlı#!\n\nHereward ile sürgününüz kısa sürecek. Yabancıların kontrolündeki İngiltere'ye dönerek adınızı temize çıkarmak, Normanları öldürmek ve özgürlük için savaşacaksınız.\n\nBu süre boyunca İngiltere'nin Norman yönetimine karşı direnişini anlatan özel bir mekanik aktif olacak ve bu sırada senaryolaştırılmış hikâye olayları gerçekleşecek. Hikâyeniz ölümle bitecek, ya sizin ya da düşmanınızın.\n\n$game_concept_story_generic_desc_boilerplate$]
 game_concept_story_content_hereward_desc: "#tooltip_heading Story Style: Extensive#!\n\nAs Hereward, your exile abroad will prove to be short-lived. With England under the foreign yoke, you will return home to fight for freedom, clear your name, and kill Normans.\n\nA special mechanic will be active for the duration, charting England's resistance to Norman rule, and scripted story events will play during this. Your story will culminate with death: yours, or your enemy's.\n\n$game_concept_story_generic_desc_boilerplate$"
