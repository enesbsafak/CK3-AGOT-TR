### TODO AGOT-CHANGED: FACTION_DEMAND_NOMADIC_VASSAL_DESC [AGOT: We will no longer tolerate your vile oppression of the proud [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Born to roam free beneath these open skies, we reject your tyranny — our time is at hand!\n\nWe shall cast off your rule and that of your liege, [faction_target.GetTitledFirstName], once and for all!! | TR: Biz, gururlu [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural], artık senin alçakça baskını kabul etmeyeceğiz. Açık göklerin altında özgür yaşamak için doğduk ve zorbalığını reddediyoruz!\n\nSenin ve süzereninin hükmünü sonsuza dek üzerimizden atacağız!]
