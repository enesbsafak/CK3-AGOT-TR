### TODO AGOT-CHANGED: FACTION_DEMAND_NOMADIC_DESC [AGOT: We will no longer bow beneath your yoke of oppression! We, the proud [GetGovernment( 'nomad_government' ).GetName] [peasant_leader.GetCulture.GetCollectiveNoun], were born to roam free beneath these endless skies.\n\nWith [peasant_leader.GetFaith.WarGodName] guiding our riders, we shall break from your pathetic rule and reclaim our place on the open steppe! | TR: Bundan böyle baskı zincirine boyun eğmeyeceğiz! Biz, gururlu [GetGovernment( 'nomad_government' ).GetName] [peasant_leader.GetCulture.GetCollectiveNoun], uçsuz bucaksız göklerin altında özgürce dolaşmak için doğduk.\n\n[peasant_leader.GetFaith.WarGodName] atlılarımıza rehberlik edecek, senin zavallı hükmünü yıkacak ve açık bozkırdaki yerimizi geri alacağız!]
