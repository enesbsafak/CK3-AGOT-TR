 master_of_hunt_court_position_task_regular_game: "Normal Av İzleme"
 master_of_hunt_court_position_task_regular_game_desc: "$master_of_hunt_court_position$, avlanmak için ortalama miktarda itibar kazandıracak tilkiler veya geyikler gibi normal avları takip edecek."
