l_english:
 master_of_hunt_court_position_task_dangerous_game: "Tehlikeli Av İzleme"
 master_of_hunt_court_position_task_dangerous_game_desc: "$master_of_hunt_court_position$, avlanmak için bolca itibar kazandıracak kurtlar veya ayılar gibi tehlikeli avları takip edecek."
