 master_of_hunt_court_position_task_legendary_game: "Efsanevi Av İzleme"
 master_of_hunt_court_position_task_legendary_game_desc: "$master_of_hunt_court_position$, avlanmak için muazzam miktarda itibar kazandıracak efsanevi yaratıkları takip etmeye çalışacak."
