 FACTION_POWER_INTERNAL_ISSUES:0 "Mevcut Örgütleşmeler: #V $VALUE|0$#!"
 FACTION_DEMAND_ACCEPT:0 "Görünen o ki başka bir seçeneğim yok..."
 FACTION_DEMAND_REFUSE:0 "Boyun eğmeyeceğim!"
 FACTION_DEMAND_ACCEPTED_OPT:0 "Akıllıca bir karar."
 FACTION_DEMAND_REFUSED_OPT:0 "Öyleyse savaşa gireceğiz!"
 FACTION_DEMAND_SEND_DEMAND_NOTIFICATION_OPT:0 "Ültimatomu gönder!"
 FACTION_IMPRISONMENT_RETALIATION_WARNING:2 "#high [recipient.GetShortUIName] zindana atılırsa [retaliating_faction.GetName] isyan başlatabilir!#!"
 FACTION_FAILED_IMPRISONMENT_RETALIATION:1 "Yol arkadaşlarımızdan [recipient.GetShortUIName], [actor.GetShortUIName] tarafından haksız bir biçimde hapsedilmeye çalışıldı."
 FACTION_SUCCESSFUL_IMPRISONMENT_RETALIATION:1 "Yol arkadaşlarımızdan [actor.GetShortUIName], [recipient.GetShortUIName] tarafından haksız bir biçimde hapsedildi."
 FACTION_IMPRISONMENT_RETALIATION_END:0 "\n\n[retaliating_faction.GetName] hedefli bu küstah saldırı bir savaş sebebidir. Vakit birlik olma vaktidir. Zamanı geldiğinde birbirimizi kollamazsak teker teker avlanırız!"
 FACTION_IMPRISONMENT_RETALIATION_OPT:0 "Savaşa!"
 FACTION_DEMAND_COLLAPSE:1 "[faction_target.GetPrimaryTitle.GetNameNoTier] Dağılma Talebi"
 FACTION_DEMAND_COLLAPSE_DESC:1 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n[faction_target.GetPrimaryTitle.GetNameNoTier] bütünlüğünü koruyamadığınızı kabul etme vakti geldi. Sizin veya herhangi birinin özgürlüğe ihtiyacı olan bu bölgedeki hükmünü sona erdirme zamanı geldi. Ya taleplerimizi kabul edersiniz ya da muharebe alanında kılıçlarımızla yüzleşirsiniz!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED:1 "Dağılma Talepleri Kabul Edildi"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC:1 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTalihsiz talepleriniz ancak ve ancak hepimizin zayıf düşmesine sebep olacak. Her şeye rağmen ülkemi gereksiz kan dökmelerden korumak adına bağımsızlık taleplerinizi kabul etmek durumundayım."
 FACTION_DEMAND_COLLAPSE_REFUSED:1 "Dağılma Talepleri Reddedildi"
 FACTION_DEMAND_COLLAPSE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nRezil şantaj girişimin başarısız oldu. Etrafına ne kadar onursuz, haysiyetsiz adam toplarsan topla savaşmadan teslim olmayacağım. Hakkım olan için ölmeye hazırım!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION:1 "[faction_target.GetPrimaryTitle.GetNameNoTier] Yok Edildi!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION_DESC:0 "Vakit geldi! [faction.GetName], [faction_target.GetName] ile o unvana sahip olanın ve olacak olanların tüm hüküm hakkını yitirdiği konusunda hemfikir. Ya bağımsızlığımızı verecekler ya da biz gidip alacağız!"
 FACTION_DEMAND_INDEPENDENCE:0 "Bağımsızlık Talebi"
 FACTION_DEMAND_INDEPENDENCE_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n[faction_leader.GetPrimaryTitle.GetNameNoTier] ve [faction.GetName] dâhilindeki diğer tüm unvanların tam bağımsızlığını tanımanızın vakti geldi. Taleplerimizi kabul etmezseniz muharebe alanında kılıçlarımızla yüzleşmek zorunda kalacaksınız!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED:0 "Bağımsızlık Talebi Kabul Edildi"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC:1 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTalihsiz talepleriniz ancak ve ancak hepimizin zayıf düşmesine sebep olacak. Her şeye rağmen ülkemi gereksiz kan dökmelerden korumak adına bağımsızlık taleplerinizi kabul etmek durumundayım."
 FACTION_DEMAND_INDEPENDENCE_REFUSED:0 "Bağımsızlık Talebi Reddedildi"
 FACTION_DEMAND_INDEPENDENCE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nÇirkin şantaj girişiminiz sonuç vermedi. Bağımsızlık hayallerinizi gerçeğe dönüştürmek adına yanınıza ne kadar gafil toplarsanız toplayın, dik duracağım ve savaşmadan boyun eğmeyeceğim. Gerekirse hakkım olanı savunurken canımı veririm!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION:0 "Bağımsızlık!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION_DESC:0 "Beklenen gün geldi çattı. [faction.GetName]sine mensup kişiler [faction_target.GetName] adlı kişinin sahip olduğu yönetme hakkını kaybettiği konusunda hemfikir. Ya bağımsızlığımız verilecek ya da onu zorla alacağız!" #krutygetarts
 FACTION_DEMAND_BRIBE_CO_EMPEROR: "Makam verirsem işbirliği yapmak zorunda kalırlar değil mi?"
 FACTION_DEMAND_BRIBE_CO_EMPEROR_REASON: "[Select_CString( faction_leader.IsLocalPlayer, '', faction_leader.GetShortUIName )][Select_CString( faction_leader.IsLocalPlayer, '', ', ' )][faction|E] [claimant|E] olmalı[Select_CString( faction_leader.IsLocalPlayer, 'sınız', '' )] #weak ([faction.GetSpecialCharacter.GetTitledFirstName])#!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE: "Örgütleşmeden Karşı Teklif"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTaleplerinizde haklılık payı var - hatta belki de yaptığım hataları öne seriyor. Silahlarınızı bırakıp Eş[faction_target.GetTitleAsNameNoTooltip] olarak bana katıl ve [faction_target.GetPrimaryTitle.GetDefinitiveName] ikimizin kontrolünde olsun!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_ACCEPT: "Böyle bir teklifi reddedemem..."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_REJECT: "Hah, zehirli bir şarap kadehinden farksız."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION: "Örgütleşme Liderinin Makamı Yükseltildi"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nMemnuniyetle bildirmek istiyorum ki [faction_target.GetTitledFirstName] taleplerimizin mantığını anlamaya başladı. Kendisi #EMP beni#! Eş [faction_target.GetTitleAsNameNoTooltip] olarak atadı ve ben de şu andan itibaren silahlarımızı bırakmayı kabul ettim."
 FACTION_DEMAND_PEASANT:1 "[ROOT.Char.Custom2('InsultAdjective', ROOT.Char)|U] [ROOT.Char.GetTitledFirstName],"
 FACTION_DEMAND_PEASANT_DESC:0 "Baskıcı yasalarınıza yeterince katlandık. Artık yeter! Bundan böyle size vergi ödemeyeceğiz.\n\nSandıklarınız ve ambarlarınız boşaldığı vakit belki bize daha adil davranmanız gerektiğini fark edersiniz."
 FACTION_DEMAND_PEASANT_ACCEPT:0 "Sanırım onlara vergi muafiyeti tanıyabilirim..."
 FACTION_DEMAND_PEASANT_REFUSE:0 "Asla! Köylünün görevi lorduna hizmet etmektir!"
 FACTION_PEASANT_NAME:0 "Köylü Sürüsü"
 FACTION_PEASANT_TITLE_NAME:0 "Köylü Ayaklanması"
 FACTION_DEMAND_NOMADIC: "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))|U] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_NOMADIC_DESC: "Bundan böyle baskı zincirine boyun eğmeyeceğiz! Biz, gururlu [GetGovernment( 'nomad_government' ).GetName] [peasant_leader.GetCulture.GetCollectiveNoun], uçsuz bucaksız göklerin altında özgürce dolaşmak için doğduk.\n\n[peasant_leader.GetFaith.WarGodName] atlılarımıza rehberlik edecek, senin zavallı hükmünü yıkacak ve açık bozkırdaki yerimizi geri alacağız!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Hayhay! Ülkemde sizin pis sürülerinize yer yok."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Biz, gururlu [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural], artık senin alçakça baskını kabul etmeyeceğiz. Açık göklerin altında özgür yaşamak için doğduk ve zorbalığını reddediyoruz!\n\nSenin ve süzereninin hükmünü sonsuza dek üzerimizden atacağız!"
 FACTION_DEMAND_NOMADIC_VASSAL_JOIN_WAR: "O hâlde savaş meydanında görüşeceğiz, #EMP eşkıya#!!"
 FACTION_DEMAND_POPULIST:0 "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))|U] [ROOT.Char.GetTitledFirstName],"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "[ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)|U] hükmünüzün daha fazla zulmetmesine izin vermeyeceğiz. [peasant_leader.GetFaith.GetName|U], [ROOT.Char.GetPrimaryTitle.GetName] topraklarının üstün inancı olarak tanınmalı!\n\nMezhebimize hak ettiği itibarı verin ya da inancına sadık halkın gazabıyla yüzleşmeye hazırlanın!"
 FACTION_DEMAND_POPULIST_DESC_CULTURE:0 "[peasant_leader.GetCulture.GetName] kültürümüzü baskı altında yaşamaya daha fazla katlanmayacağız. Kendi kaderimizi kendimizin tayin etme vakti geldi.\n\nBize bu hakkı tanımayı reddetmeniz durumunda tüm halkın gazabını üstünüzde bulacaksınız!"
 FACTION_DEMAND_POPULIST_DESC_FAITH:0 "[peasant_leader.GetFaith.GetAdherentNamePlural] olarak baskı altında yönetilmeye daha fazla katlanmayacağız. Kendi kaderimizi kendimizin tayin etme vakti geldi.\n\n[peasant_leader.GetFaith.WarGodName] önderliğinde birleşip kendimizi [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] hükümdarlığından kurtaracağız!"
 FACTION_DEMAND_POPULIST_DESC:0 "[peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] olarak baskı altında yönetilmeye daha fazla katlanmayacağız. Kendi kaderimizi kendimizin tayin etme vakti geldi.\n\n[peasant_leader.GetFaith.WarGodName] önderliğinde birleşip kendimizi [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] hükümdarlığından kurtaracağız!" #krutygetarts
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT:0 "Bir dakika... Bunun yerine ben sizden biri hâline gelsem?"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT_STATE_FAITH: "[peasant_leader.GetFaith.GetNameNoTooltip|U] bu onura sahip olacak."
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENDENCE:0 "Kendileri bilir, böyle huysuz bir güruhla uğraşacak vaktim yok!"
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENCE_TT:0 "#N Bu seçenek topraksız hâle gelmenizle sonuçlanacak!#!"
 FACTION_DEMAND_POPULIST_REFUSE:0 "Özgürlük mü? Öldüğünüzde özgür kalırsınız!"
 FACTION_DEMAND_POPULIST_REFUSE_ADMIN: "Böyle değişiklikler yapmak senin haddin değil, adi [peasant_leader.Custom2('InsultNoun', ROOT.Char)]!"
 FACTION_DEMAND_POPULIST_REFUSE_TT:0 "#high [peasant_leader.GetTitledFirstName]#! ve #high [faction.GetName]#! size [war|E] açacak"
 FACTION_POPULIST_REVOLT_TITLE_NAME:0 "Halkçı Örgütleşme"
 FACTION_NOMADIC_REVOLT_TITLE_NAME: "Göçebe İsyanı"
 FACTION_POPULIST_CREATED_TITLE_NAME:0 "[founder_culture.GetCollectiveNounNoTooltip]"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_SAME_CULTURE_AND_FAITH:0 "Geleneklerimiz ve inançlarımız aynı olabilir ama artık ne sen ne de [faction_target.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [faction_target.GetTitledFirstName] karşımızda duramaz!\n\nYa kenara çekil ya da hakkımız olan bağımsızlığımızı kazanmamızda bize yardım et!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE:0 "[peasant_leader.GetCulture.GetName] geleneklerine karşı yapılan zulümlere artık göz yumamayız. Zaman geldi!\n\nSüzerenin [faction_target.GetTitledFirstName] ile ancak tam bağımsızlık sözüyle masaya otururuz."
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH:0 "[peasant_leader.GetFaith.GetAdherentNamePlural] sefalet içinde yaşıyor ve buna dur demenin vakti geldi. Artık kimse bize zulmedemeyecek!\n\n[peasant_leader.GetFaith.WarGodNamePossessive] önderliğinde ayaklanarak süzerenin [faction_target.GetTitledFirstName] ve onun kirli pençelerinden kurtulacağız."
 FACTION_DEMAND_POPULIST_VASSAL_DESC:0 "[peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] efalet içinde yaşıyor ve buna dur demenin vakti geldi. Artık kimse bize zulmedemeyecek!\n\nSüzerenin [faction_target.GetTitledFirstName] ile senin tiranlığından bağımsızlık için savaşacağız!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_REBELS:0 "Davanıza katılmak istiyorum!"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS:0 "Peki ya sizin geleneklerinizi benimseyip yardım edersem?"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS_TT:0 "[Concept( 'liege', 'Süzereninize' )|E] karşı isyancılara yardım edeceksiniz"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR:0 "O zaman dersini muharebe alanında vereceğim #EMP hain#!!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT:0 "Bu savaşa katılamazsınız çünkü zaten katılımcılardan biriyle savaştasınız"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT_2:0 "Bu savaşa katılamazsınız çünkü başka bir savaştaki müttefikinizle savaşa girersiniz"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_TT:0 "İsyancılara karşı [Concept( 'liege', 'Süzereninize' )|E] yardım edeceksiniz"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE:0 "Hiç bulaşmasam daha iyi..."
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_A:0 "#high [populist_war.GetName]#! Savaşına katılmayacaksınız"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B:0 "#N Eğer süzereniniz teslim olursa ülkenizin bir kısmını kaybedeceksiniz!#!"
 POPULIST_FACTION_INDEPENDENCE_TITLE:0 "Bağımsızlık Kazanıldı"
 POPULIST_FACTION_INDEPENDENCE_DESC:0 "[popular_faction|E] sonucunda bağımsızlığınızı elde ettiniz. [faction_target.GetTitledFirstName] artık süzereniniz değil."
 VASSAL_JOINS_LIEGE_TOOLTIP:0 "#high [vassal_to_join_liege.GetTitledFirstName]#! sizin yanınızda Savunanlar tarafına katıldı"
 VASSAL_JOINS_REBELS_TOOLTIP:0 "#high [vassal_to_join_rebels.GetTitledFirstName]#! karşı taraftaki Saldıranlar tarafına katıldı"
 FACTION_DISCONTENT_CA_1:0 "Kısıtlı Taht Otoritesi: #V %$VALUE|0$#!"
 FACTION_DISCONTENT_CA_2:0 "Yüksek Taht Otoritesi: #V %$VALUE|0$#!"
 FACTION_DISCONTENT_CA_3:0 "Mutlak Taht Otoritesi: #V %$VALUE|0$#!"
 FACTION_DEMAND_LIBERTY:0 "Özgürlük Talebi"
 FACTION_DEMAND_LIBERTY_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVasallarınızın kadim hak ve özgürlüklerini tanımanızın vakti geldi! Ya [faction.GetName]nin taleplerini kabul edersiniz ya da muharebe alanında kılıçlarımızla yüzleşirsiniz!"
 FACTION_DEMAND_LIBERTY_ACCEPTED:0 "Özgürlük Talebi Kabul Edildi"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n'Hak ve özgürlük' olarak isimlendirdiğiniz bu bencilce talepler emin olun ülkemizin zayıflamasından başka bir şeye sebep olmayacak. Her şeye rağmen ülkemi gereksiz kan dökmelerden korumak adına taleplerinizi kabul etmek durumundayım."
 FACTION_DEMAND_LIBERTY_REFUSED:0 "Özgürlük Talebi Reddedildi"
 FACTION_DEMAND_LIBERTY_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nBu gülünç sindirme girişimleriniz asla başarılı olamaz. [faction_target.GetTitleAsNameNoTooltip] benim! Siz hainlere hadlerini muharebe alanında öğreteceğim!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION:0 "Ya Bağımsızlık ya Ölüm!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION_DESC:0 "Beklenen gün geldi çattı. [faction.GetName] [faction_target.GetName] adlı kişinin sahip olduğu tiranlık derecesindeki yetkilerinden arındırılması gerektiği konusunda hemfikir... Gerekirse savaşarak."
 FACTION_DEMAND_CLAIMANT:0 "Hak Sahibi Talebi"
 FACTION_DEMAND_CLAIMANT_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n[faction_targeted_title.GetNameNoTier] unvanı meşru olarak [faction_claimant.GetName] adlı kişinin hakkıdır ve bu hakkına kavuşması için yeterli desteği toplamış durumdayız. Bu gerçeği barışçıl bir şekilde kabul etmemeniz durumunda zorla kabul ettirmek zorunda kalacağız!"
 FACTION_DEMAND_CLAIMANT_DESC_ME:0 "[faction_targeted_title.GetNameNoTier] unvanı meşru olarak benim hakkım ve nihayet hakkımı elde etmek adına yeterli desteği topladım. Bu gerçeği ya barışçıl bir şekilde kabul edersin ya da zorla kabul ettirmek zorunda kalırız!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED:0 "Hak Sahibi Talebi Kabul Edildi"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC:0 "Görünen o ki bu saçma maceralar uğruna gerekirse ülkeyi kaosa sürüklemeye razısın. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] topraklarının bekası adına talebini kabul etmek zorundayım ancak şunu bil ki burada büyük bir yanlış yapılmıştır. Bu iş burada bitmeyecek!"
 FACTION_DEMAND_CLAIMANT_REFUSED:0 "Hak Sahibi Talebi Reddedildi"
 FACTION_DEMAND_CLAIMANT_REFUSED_DESC:1 "[faction_claimant.GetShortUINamePossessive|U] unvanımdaki sözde hak iddiası geceleri çocuklara anlatılan masallardan daha hayalî. Etrafını istediğin kadar kandırılmış budalalarla doldur, bunların hiçbiri benim gözümü korkutamaz. Doğuştan gelen hakkımı başkalarına devretmektense ölürüm daha iyi!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION:0 "Meşru Hak İddiası!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC:1 "Beklenen gün geldi çattı. [faction_targeted_title.GetNameNoTier] unvanının gerçek sahibinin [faction_claimant.GetName] olduğu iddiası çatısında birleşmiş kişiler nihayet kendisini hakkı olan tahta geçirmek için harekete geçmiş durumda. Gerekirse kılıç ve ateşin yoluyla adaletin yerini bulmasını sağlayacağız!"
 FACTION_CLAIMANT_INVITE:1 "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_DESC:0 "[faction_target.GetName] meşru olarak size ait olması gereken bir tahtta oturuyor. Ülkenin diğer önde gelen isimlerinin bu haklı davanızda yanınızda olacağından emin bir biçimde sahip olduğunuz hak iddiasını desteklemeye hazırım. Tek yapmanız gereken onay vermek."
 FACTION_CLAIMANT_INVITE_ACCEPT:0 "Nihayet!"
 FACTION_CLAIMANT_INVITE_REFUSE:0 "Olmaz..."
 FACTION_CLAIMANT_INVITE_ACCEPTED:1 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC:0 "Nihayet! [faction_target.GetName] [faction_target.GetTitleAsNameNoTooltip] taklidi yapan bir soytarıdan başka bir şey değil. Eminim ki tüm ülke benim bu haklı davamda destekçim olacaktır. Benim yanımda duranları unutmayacağımdan emin olabilirsiniz."
 FACTION_CLAIMANT_INVITE_ACCEPTED_OPT:0 "Artık her şey an meselesi..."
 FACTION_CLAIMANT_INVITE_REFUSED:1 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_REFUSED_ALLY_DESC:0 "Hak iddiamın meşruluğu su götürmez bir gerçek ancak [faction_target.GetTitledFirstName] ile olan mevcut ittifakım böyle bir hamlede bulunmama mani oluyor. Ruhen yanınızda olacağımdan emin olabilirsiniz."
 FACTION_CLAIMANT_INVITE_REFUSED_HOOK_DESC:0 "Hak iddiam meşru olsa da, ne yazık ki yanınızda yer almam mümkün değil. #emphasis Elimde olmayan sebeplerden dolayı#! [faction_target.GetTitledFirstName] adlı kişiye karşı bir hamlede bulunmam mümkün değil. Size bol şans diliyorum."
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC:1 "[faction_target.GetTitledFirstName] adlı kişiye karşı harekete geçildiğini görmek mükemmel ancak içerisinde bulunduğum kötü vaziyet sebebiyle yanınızda bulunmam mümkün değil. Eğer başarılı olursanız size borçlu olacağım."
 FACTION_CLAIMANT_INVITE_REFUSED_CHILD_DESC:1 "[faction_target.GetTitledFirstName] adlı kişinin kötü biri olduğunu ve benim ondan daha iyi hükümdar olacağımı düşünmenize sevindim!\n\nNe yazık ki şu sıralar oyuncaklarımla oynamakla meşgulüm ama olur da kazanırsanız oyuncaklarımdan birkaçını size vereceğimden emin olabilirsiniz!"
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC:0 "Nihayet! [faction_target.GetName] [faction_target.GetTitleAsNameNoTooltip] taklidi yapan bir soytarıdan başka bir şey değil. Eminim ki tüm ülke bu haklı davamda destekçim olacaktır.\n\nNe yazık ki bulunduğum düşük konum neticesinde size yardım etmem mümkün görünmüyor ancak başardığınız #emphasis takdirde#! güzel bir şekilde ödüllendirileceğinizden emin olabilirsiniz!"
 FACTION_CLAIMANT_INVITE_REFUSED_DESC:1 "Hakkıma olan inancınızdan dolayı minnettar olsam da, bu girişimin başarısızlığa mahkûm olduğunu düşünüyorum. Bu sebeple size destek olamayacağım fakat olur da bir şekilde davanızda başarılı olursanız tahttaki haklı yerimi kabul edeceğimden emin olabilirsiniz."
