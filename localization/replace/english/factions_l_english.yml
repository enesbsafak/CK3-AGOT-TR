 FACTION_DEMAND_CEREMONIAL_CLAIMANT: "Sembolik Hak Sahibi Talebi"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n[faction_targeted_title.GetNameNoTier] unvanının meşru hükümdarı [faction_targeted_title.GetHolder.GetFirstName] değil, [faction_claimant.GetName] olmalıdır. Bunu kimse inkâr edemez.\n\nBu gerçeği barışçıl biçimde kabul edin, yoksa bunu size zorla kabul ettireceğiz!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC_ME: "[faction_targeted_title.GetDefinitiveName|U] ilahi hakla bana aittir ve nihayet bunu gerçekleştirecek imkâna sahibim. Bu gerçeği barışçıl biçimde kabul edin, yoksa bunu size zorla kabul ettireceğim!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED: "Sembolik Hak Sahibi Talebi Kabul Edildi"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Bu budalaca girişimden vazgeçmektense tüm diyarı yakıp yıkmayı göze aldığınız bana açık. Ülkemizin iyiliği için taleplerinizi kabul etmeliyim fakat bilin ki bugün burada büyük bir adaletsizlik yapıldı. Bu böyle kalmayacak!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED: "Sembolik Hak Sahibi Talebi Reddedildi"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED_DESC: "[faction_claimant.GetShortUINamePossessive|U] [faction_targeted_title.GetDefinitiveName|l] üzerindeki iddiasına verdiğiniz destek, meşru [faction_targeted_title.GetHolder.GetTitleAsName] için bir hakarettir!\n\nİhanetiniz ve rezilliğiniz yakında ilahi yargıyla karşılığını bulacak, alçak hain!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION: "Meşru Bir İddia!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC: "An geldi! [faction_claimant.GetName] meşru [faction_targeted_title.GetHolder.GetTitleAsName] olarak destekleyen herkes artık tek vücut olacak ve onun hakkı olan [faction_targeted_title.GetDefinitiveName|l] unvanına gelmesini sağlayacak. Gerekirse kılıçla ve ateşle bunu gerçekleştireceğiz!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE: "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName], hakkıyla size ait olması gereken bir tahtı işgal ediyor! Sözümle ve kılıcımla iddianızı desteklemeye hazırım, diyardaki birçok kişinin de bu haklı davayı savunacağına eminim. Tek yapmanız gereken kabul etmek."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPT: "Nihayet!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_REFUSE: "Bu doğru değil..."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Nihayet! [faction_target.GetName] yalnızca bir [faction_target.GetTitleAsNameNoTooltip] rolü yapan bir soytarıdan ibaret, diyarın davam için ayağa kalkacağına eminim. Bana yardım edenler unutulmayacak."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_OPT: "Sadece zaman meselesi..."
 FACTION_DEMAND_IMPERIAL_POLICY: "İmparatorluk Politikası"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nDiyarın sadık [Concept('subjects', 'Tebaası')|E] yanlış yönlendirilmiş politikalarınıza yeterince katlandı. [faction.GetName], [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] için yeni bir yönü onaylamanızı talep ediyor, aksi hâlde size bunu zorla kabul ettireceğiz!"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED: "İmparatorluk Politikası Talebi Kabul Edildi"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Bu budalaca girişimden vazgeçmektense diyarı yakıp yıkmayı göze aldığınız aşikâr. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] topraklarının iyiliği için taleplerinizi kabul etmeliyim fakat bilin ki bugün burada büyük bir adaletsizlik yapıldı. Bu böyle kalmayacak!"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED: "İmparatorluk Politikası Talebi Reddedildi"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED_DESC: "Hükümetimin sağlam politikalarını kibirle ve huysuzca hiçe saymanız, bu tür kararları vermeye ne kadar uygunsuz olduğunuzun kanıtıdır.\n\nİhanetiniz ve rezilliğiniz yakında ilahi yargıyla karşılığını bulacak, alçak hain!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION: "Geminin Rotasını Çevirmek"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "An geldi! [faction_target.GetTitledFirstNamePossessive] yanlış yönlendirilmiş politikalarını sona erdirmeyi destekleyen herkes artık tek vücut olacak ve diyarın yeni bir yöne girmesini sağlayacak. Gerekirse kılıçla ve ateşle bunu gerçekleştireceğiz!"
