l_english:

 fp2_yearly.4008.desc.first_men.a:0 ""...Akdiğerler, Ebedî Kış Diyarları'ndan gelen kadim düşmanlardır. İnsan diyarlarının hepsinin sonunu getirmeye neredeyse muvaffak olanlar onlardı ve Duvar onları dışarıda tutmak için inşa edildi.""

 fp2_yearly.4008.desc.first_men.b:0 ""...Snark, Duvar'ın ötesinden gelen bir canavardır. Yalnız bırakılan çocukları avlar ve onları on yıl boyunca canlı canlı yediği söylenir. Ormanda yalnız gezen çocukların çığlıkları onu cezbeder.""

 fp2_yearly.4008.desc.first_men.c:0 ""...Grumkin, Duvar'ın ötesinden gelen, üç dilek bahşettiği söylenen bir canavardır; ama üçüncü dilek dikkatli ve özenle kullanılmazsa, dilek dileyenlerin çocuklarını gelecekte çalıp yerlerine kötü niyetli mırıltılar bırakır.""

 fp2_yearly.4008.desc.first_men.d:0 ""...Gecenin Gelen Şeyi, yüzyılda bir Gece Kalesi'ni ziyaret eden bir canavardır; onu görenleri delirtir ve öldürür, sonra ruhları ona zincirlenmiş çıraklar olmaya mahkûm edilir.""

 fp2_yearly.4008.desc.andal.a:0 ""...Kuğu Bakireleri, kurbanlarını Kadife Tepeleri'nin derinliklerine çeken güzel kadınlardı ve onları üreme ve geçim için hasat ederlerdi.""

 fp2_yearly.4008.desc.andal.b:0 ""...Cehennem Köpekleri, insanlar ölüleri arındırmak için şenlik ateşleri yaktığında ortaya çıkar. Gece kadar kara kürkleri ve köpüren ağızlarıyla, bir patlamayla küllerin arasından belirirler. Her biri, anlatacak kendi hikâyesi olan bir günahkârın ruhudur.""

 fp2_yearly.4008.desc.ironborn.a:0 ""...Deniz Ejderhaları derinliklerin en büyük dehşetidir ve türünün en büyüğü, bugün kemikleri hâlâ orada yatan Orkmont'ta Gri Kral tarafından öldürülen Nagga'dır.""

 fp2_yearly.4008.desc.ironborn.b:0 ""...Fok Adamlar, bazen denizcilere yardım eden, bazen de onları boğan deniz yaratıklarıdır. Derinliklerde yaşadıkları ve belki de Deniz Kralı ile Kraliçesi tarafından yönetildikleri söylenir. Rahibeler'in halkının onlardan türediği anlatılır.""

 fp2_yearly.4008.desc.hyrkoon.a:0 ""...Shrykeler, yeşil pullu tenli ve yılan ısırığına sahip yarı insanlardır; Beş Kale'nin ötesindeki ıssız topraklarda dolaşıp karşılaştıkları her şeyi tükettikleri söylenir.""

 fp2_yearly.4008.desc.valyrian.a:0 ""...Kaya Goblinleri, bir zamanlar Essos'ta Devler'le savaşan tepelerin halkıydı; onları yendiler, ama kısa süre sonra Kuğu Bakireleri'nin gizemli hilelerine yenik düştüler.""

 fp2_yearly.4008.desc.rhoynish.a:0 ""...Sfenks, yarı insan, yarı aslan ve yarı şahin ya da ejderha olan kurnaz bir yaratıktır; bir şehre ya da yola musallat olup bilmecesini bilemeyen herkesi öldürdüğü söylenir, bilebilenler bile bir Valyria kaderine mahkûmdur.""

 fp2_yearly.4008.desc.crackclaw.a:0 ""...Eziciler, geçmişte Kıskaç Burnu halkını tehdit eden deniz yaratıklarıdır; İlk İnsanlar onları karadan kovdu ve Ser Clarence Crabb krallarını alt etti.""

 fp2_yearly.4008.desc.westeros_generic:0 ""...Derinlerin İnsanları, denizin pullu, balık başlı halklarıdır; belki de Demir Adamlar'ın atalarıdırlar ve Bin Ada'da kötü ritüellerle tapınılırlar.""
