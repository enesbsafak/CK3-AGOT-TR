 unity_steer_house_direction_decision_desc: "Hane reisi olarak, sözlerim hane üyeleri arasında büyük bir etkiye sahiptir. Doğru kelimeleri kullanarak hane üyelerimin istediğim şekilde hareket etmelerini sağlayabilir, birliğimize yön verebilirim."
