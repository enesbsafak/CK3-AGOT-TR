 char_interaction.0011.a:0 "Olsun."
 char_interaction.0020.opening:2 "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 char_interaction.0020.desc:1 "Hanedan reisi olarak, sizi verasetten men ediyorum! [actor.GetDynastyName] Hanedanı'nın hiçbir mensubundan miras yoluyla unvan devralamayacaksınız."
 char_interaction.0020.a:0 "Ne? Neden!?"
 char_interaction.0030.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 char_interaction.0030.desc:1 "Hanedan reisi olarak, [actor.GetDynastyName] Hanedanı'nın mensuplarından miras yoluyla unvan devralabilme hakkınızı geri veriyorum."
 char_interaction.0030.a:0 "Teşekkürler!"
 char_interaction.0040.desc:1 "Hanedan reisi olarak, sizi kınıyorum ve [actor.GetDynastyName] Hanedanı'nın yüz karası olduğunuzu ilan ediyorum."
 char_interaction.0040.a:0 "Ne? Neden!?"
 char_interaction.0041.desc: "Davranışlarınız [actor.GetHouse.GetBaseName] hanesinin itibarına leke düşürüyor ve Hane Reisi olarak ailenin geri kalanını sizin bu hareketlerinize dair bilgilendirmeyi kendime görev bilirim.\n\n[actor.GetFaith.HighGodNamePossessive] nuru erdemli yola dönüşünüzde size rehberlik etsin, her ne kadar bir faydasının olacağını zannetmesem de."
 char_interaction.0041.a: "İftira!"
 char_interaction.0042.desc: "[recipient.Custom('FormalComplimentAdjective')|U] olduğunuz kadar [recipient.Custom('ComplimentAdjective')] birisiniz de, [actor.GetHouse.GetBaseName] hanelerinin tüm üyeleri için bir ilham kaynağısınız ve Hane Reisi olarak bu erdemli hareketlerinizi ailenin geri kalanına bildirmeyi kendime görev bilirim.\n\nUmarım her zaman [actor.GetFaith.HighGodNamePossessive] nuru sizinle olur."
 char_interaction.0042.a: "Harika!"
 char_interaction.0050.desc:1 "Hanedan reisi olarak, eski suçlarınızı affediyorum ve [actor.GetDynastyName] Hanedanı mensupları arasındaki kınanma cezanızı kaldırıyorum."
 char_interaction.0050.a:0 "Adalet yerini buldu!"
 char_interaction.0060.desc:1 "[target.GetName] unvanı bana yararlı olabilir, bu nedenle hanedan reisiniz olarak onun üzerinde hak iddia etmeye karar verdim. İstediğiniz anlamı yükleyebilirsiniz."
 char_interaction.0060.a:0 "Bunun iyi olacağını düşünmüyorum."
 char_interaction.0070.opening:0 "[actor.Custom2('AppropriateGreeting', recipient )]"
 char_interaction.0070.desc:1 "[actor.GetDynastyName] Hanedanı içindeki kavga bize yakışmıyor ve hemen sona ermeli. Hanedan reisiniz olarak siz ve hanedanınızdaki düşmanlarınız arasında beyaz barış ilan ediyorum!"
 char_interaction.0070.a:0 "Her şeye de burnunu sokuyor!"
 char_interaction.0071.desc:2 "[actor.GetDynastyName] Hanedanı içindeki kavga bize yakışmıyor ve hemen sona ermeli. Hanedan reisiniz olarak [recipient.GetFullName] ile sizin aranızda beyaz barış yapılması emrini verdim."
 char_interaction.0071.a:0 "Teşekkürler!"
 char_interaction.0078.desc_them:0 "[ward.GetTitledFirstName] benim tarafımdan eğitilecekti, bu konuda anlaşmıştık fakat maalesef başka öğrencilerle meşgulüm. Özür dilerim."
 char_interaction.0078.desc:0 "[ward.GetTitledFirstName], [guardian.GetTitledFirstName] tarafından eğitilecekti; bu konuda anlaşmıştık fakat maalesef başka öğrencilerle meşgulmüş. Özür dilerim."
 char_interaction.0078.a:0 "Hay...!"
 char_interaction.0079.desc_them:0 "[ward.GetTitledFirstName] sizin tarafınızdan eğitilecekti, bu konuda anlaştığımızı düşünüyordum. Fakat şimdi duydum ki başka öğrencilerle meşgulmüşsünüz?! Zamanımı harcadığınız için teşekkürler."
 char_interaction.0079.desc:0 "[ward.GetTitledFirstName], [guardian.GetTitledFirstName] tarafından eğitilecekti, bu konuda anlaştığımızı düşünüyordum. Fakat şimdi duydum ki zaten başka öğrencilerle meşgulmüş?! Zamanımı harcadığınız için teşekkürler."
 char_interaction.0079.a:0 "Hata yapmış olabilirim..."
 char_interaction.0080.desc:0 "[Select_CString( guardian.IsLocalPlayer, 'Sizin', guardian.GetShortUINameNoFormat )][Select_CString( guardian.IsLocalPlayer, '', ' adlı kişinin' )], [ward_liege.Custom2('RelationToMePossessive', SCOPE.sC('ward'))] [ward.GetShortUINameNoFormat] için eğitim [Select_CString( guardian.IsLocalPlayer, 'vermenizden', 'vermesinden' )] memnun olurum — soylu bir ruh için soylu bir eğitim gerekiyor."
 char_interaction.0080.desc_self:0 "Sizin [ward_liege.Custom2('RelationToMePossessive', SCOPE.sC('ward'))] [ward.GetShortUINameNoFormat] için eğitim vermenizden memnun olurum — soylu bir ruh için soylu bir eğitim gerekiyor."
 char_interaction.0080.desc_guardian_self_ward: "Sizi eğitmekten çok memnun olurum — soylu bir ruh için soylu bir eğitim gerekiyor."
 char_interaction.0080.desc_guardian_self: "Majestelerinin [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] [ward.GetShortUIName], benim tarafımdan eğitilirse çok memnun olurum — soylu bir ruh için soylu bir eğitim gerekiyor."
 char_interaction.0080.desc_guardian: "[guardian_liege.Custom2('RelationToMePossessive', SCOPE.sC('guardian'))|U] [guardian.GetShortUINameNoFormat], [Select_CString( ward.IsLocalPlayer, 'sizi', ward.GetShortUINameNoFormat )][Select_CString( ward.IsLocalPlayer, '', ' adlı kişiyi' )] eğitme fırsatına sahip olursa çok memnun olurum — soylu bir ruh için soylu bir eğitim gerekiyor."
 char_interaction.0080.desc_ward_selfaccept: "Beni eğitmenizden memnuniyet duyarım, soylu bir ruh için soylu bir eğitim!"
 char_interaction.0081.desc:0 "Üzülerek söylemek istiyorum ki önerdiğiniz eğitim anlaşmasından hoşnut kalmadık."
 char_interaction.0081.a:0 "Çok yazık."
