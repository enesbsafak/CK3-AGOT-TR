 char_interaction.0261.desc:0 "[intermediary.GetTitledFirstName] tarafından verilen yetki ile [landed_title.GetName] üzerindeki sahte hükmüne son veriyorum. Unvan kraliyet vesayeti ile benim tarafımdan yönetilecek."
