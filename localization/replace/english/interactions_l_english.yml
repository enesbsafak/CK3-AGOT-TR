 court_amenities_interactions.0002.desc_intro:0 "Saatlerdir düzgün giyim ve görünüş üzerine tartışıyoruz. El ve kollarımızı hiddetle birbirimize sallarken çok az kişinin duyduğu antik saray kanunlarından bahsediyoruz. Günün sonunda,"
 court_amenities_interactions.0002.desc_won.nakey:0 "tartışmayı kazanıyorum!\n\nBöylece [actor.GetName] avam kıyafetleri giyerek utanç verici vücudunu saklamak zorunda kaldı."
 court_amenities_interactions.0002.desc_won:0 "tartışmayı kazanıyorum!\n\nBöylece [recipient.GetName] tüm kıyafetlerini çıkartmak zorunda kaldı ve saraydaki herkes onun anadan doğma hâlini gördü!"
 court_amenities_interactions.0002.desc_lost.nakey:0 "kanunları ihlal edenin ben olduğumu fark ediyorum!\n\nKıyafetlerimi çıkartırken hayatımda ilk kez yaratıcının bana verdiği bedenden utanıyorum. Yakındaki muhafızlar ve stilistler beni pis avam kıyafetleriyle giydirmek için yanıma yaklaşıyor."
 court_amenities_interactions.0002.desc_lost:0 "kanunları ihlal edenin ben olduğumu fark ediyorum!\n\nKale muhafızları ve stilistler beni iç çamaşırlarıma kadar soyduktan sonra durmadıklarını fark ettiğimde utancımdan kıp kırmızı oluyorum. Tüm sarayın beni anadan doğma hâlimle görmesinin ardından iki bacağım arasındaki onurumla ortamdan kaçmaya başlıyorum."
