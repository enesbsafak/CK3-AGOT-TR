 char_interaction.0251.desc:1 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nSizin için iyi bir vasal oldum ama biliyorsunuz benim de vasallarım var.\n\nMevcut sözleşmem oldukça kısıtlayıcı ve hafifletecek bir şeyler yapmamız gerektiğine sizin de katılacağınızı umuyorum.\n\nUnutmayın, bana #emphasis borçlusunuz!#!"
