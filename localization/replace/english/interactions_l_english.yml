 char_interaction.0253.a: "Yeni sorumluluklarımı kabul ediyorum."
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n[recipient.GetPrimaryTitle.GetNameNoTooltip] için sunduğumuz armağanlar ve gösterdiğimiz hürmetin karşılığı olarak, bu bağlılığı [SCOPE.Custom('CelestialTributaryRequest')] ile onurlandırmanızı rica ediyorum.\n\nBu lütuf, tahtınız ile mütevazı ülkemiz arasındaki ahengi kuvvetlendirsin."
