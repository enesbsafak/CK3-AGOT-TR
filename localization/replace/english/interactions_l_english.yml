 char_interaction.0200.desc:0 "Düşünüp taşındıktan sonra, [landed_title.GetName] unvanı için gereken itibara ve sorumluluk bilincine sahip olmadığınıza karar verdim. Bu nedenle ülkenin iyiliği için unvanı sizin elinizden alıyorum."
