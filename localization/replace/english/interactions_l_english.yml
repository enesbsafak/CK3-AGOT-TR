 char_interaction.0083.related: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('ward'))]"
 char_interaction.0083.outro: "eğitimine başlaması için sonunda [ward_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] topraklarından geldi."
 char_interaction.0083.desc.host: "\n\n[guardian.GetTitledFirstName] yakın zamanda derslerine başlayacak."
 char_interaction.0083.desc: "\n\nSaraya yerleştikten sonra dersler başlayacak."
 char_interaction.0083.a: "Mükemmel."
 char_interaction.0084.desc: "Majestelerinin [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] [ward.GetTitledFirstName], güvenli bir şekilde [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] topraklarına ulaştı. Derslere en yakın zamanda başlayacağız."
 char_interaction.0084.a: "Çok iyi."
 char_interaction.0090.from_ward.desc:0 "Sarayınızda aldığım eğitimin artık ihtiyaçlarımı karşılamadığını düşünüyorum. En kısa sürede eşyalarımı toplayıp [capital.GetNameNoTierNoTooltip] için yola çıkacağım."
 char_interaction.0090.two_wards.desc:0 "Sarayınızda verilen eğitimin artık [ward.GetTitledFirstName] ve [ward_2.GetTitledFirstName] için uygun olduğunu düşünmüyorum. Tekrar bizim sarayımıza dönecekler."
 char_interaction.0090.one_ward.desc:1 "Sarayınızda verilen eğitimin artık [ward.GetTitledFirstName] için uygun olduğunu düşünmüyorum. Kendisi tekrar sarayımıza dönecek."
 char_interaction.0090.a:0 "Bunu bir hakaret olarak mı görmeliyim?"
 char_interaction.0100.desc:0 "Arkadaşım, lütfen minnettarlığımı ifade eden bu mütevazı hediyemi kabul et."
 char_interaction.0100.a:0 "Teşekkürler, hazinemi doldurmak için hiçbir fırsattan kaçınmam!"
 char_interaction.0110.desc:0 "Size [landed_title.GetName] unvanını, ona bağlı kademeyi, resmî topraklarını ve gelirini veriyorum. Umarım iyi hükmedersiniz."
 char_interaction.0110.a:0 "Gücüm artıyor!"
 char_interaction.0111.desc: "Sizi [landed_title.GetName] Valisi olarak atıyorum. Kendinizi [actor.GetTitleAsNameNoTooltip] hükmünün değerli bir temsilcisi olarak kanıtlamanız ve topraklarınızı iyi yönetmeniz dileğiyle!"
 char_interaction.0120.desc:0 "Her şeyi göz önünde bulundurduktan sonra sizi yasal vârisim yapmaya karar verdim. Beni hayal kırıklığına uğratmayın, kararımı değiştirmek için daha çok geç değil."
 char_interaction.0120.a:0 "Başka kim olacaktı!?"
 char_interaction.0130.a:0 "İyi bir değiş tokuş."
 char_interaction.0131.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0131.desc:0 "[secondary_recipient.GetShortUIName] için olan fidye teklifinizi tamamen saçma buluyorum. Onurlu olan şeyi yapıp onu serbest bırakın."
 char_interaction.0131.desc_personal:0 "Senin bu saçma fidye teklifini kabul edeceğime zindanda çürürüm daha iyi."
 char_interaction.0131.a:0 "Öğünlerini azaltmanın vakti geldi..."
 char_interaction.0140.desc:0 "Fidye teklifinizi kabul ediyorum. [secondary_recipient.GetShortUIName|U] en kısa sürede size dönecek!"
 char_interaction.0141.desc:0 "Fidye teklifinizi yetersiz buluyorum. [secondary_recipient.GetShortUIName] biraz daha benimle kalacak."
 char_interaction.0141.a:0 "Lanet olsun, [actor.Custom2('InsultAdjective', ROOT.Char)] [actor.Custom2('InsultNoun', ROOT.Char)]!"
 char_interaction.0150.desc:0 "Peki, seni serbest bırakıyorum. Arkadaşlığından hoşlanmaya başladığımı da belirtmek istiyorum."
 char_interaction.0151.desc:0 "Maalesef fidye teklifini reddetmeliyim. Bir süre daha misafirim olacaksın."
 char_interaction.0160.desc:0 "Serbest kalabilmek için taleplerini kabul etmekten başka seçeneğim yok."
 char_interaction.0160.desc_demand_conversion: "[actor.GetFaith.GetName] mezhebine geçeceğim."
 char_interaction.0160.desc_renounce_claims: "Sizin o [recipient.Custom2('InsultAdjective', actor)] topraklarınızdaki tüm hak iddialarımdan vazgeçeceğim."
 char_interaction.0160.desc_banish: "Gidecek ve bir daha geri dönmeyeceğim."
 char_interaction.0160.desc_gain_hook: "Size borçlu olacağım."
 char_interaction.0160.desc_take_vows: "[recipient.Custom('NunMonkPlural')|U] tarikatına katılacağım."
 char_interaction.0160.desc_become_executioner: "Size cellat olarak hizmet edeceğim."
 char_interaction.0160.desc_recruit: "Sizin o [recipient.Custom2('InsultAdjective', actor)] sarayınıza katılacağım."
 char_interaction.0160.desc_demand_admin: "Sizin o [recipient.Custom2('InsultAdjective', actor)] idarenizin bir parçası olacağım."
 char_interaction.0160.a:1 "Güle güle, [recipient.GetShortUINameNoTooltip]..."
 char_interaction.0160.a.courtier:0 "Nereye gittiğine dikkat et, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0161.desc:0 "Senin bu saçma taleplerini kabul edeceğime zindanda çürürüm daha iyi."
 char_interaction.0170.t:0 "Zor Zamanlar"
 char_interaction.0170.desc:0 "Sabahın erken saatlerinde iki tanımadığım gardiyan tarafından uyandırıldım. Dışarıya götürülürken ne olacağını çok iyi biliyordum. [actor.GetShortUINamePossessive] celladı önünde diz çökerken bir an barışçıl ve mükemmel bir berraklık tecrübe ettim."
 char_interaction.0170.desc_burned:0 "Tatsız ve az yemeğimi bitirdiğim anda kapı çarparak açıldı ve apar topar dışarıya götürüldüm. Benim için kolay bir ölüm olmayacak. Odun yığını yıkılmış ve şimdiden ayaklarımda sıcaklığını hissedebiliyorum. Suratlarında delice bir ifadeyle son anlarımı izleyen halka bir sessizlik çöküyor."
 char_interaction.0170.desc_devoured:0 "Kapı çarparak açılıyor ve [actor.GetShortUINamePossessive] gardiyanları beni yere atıp üzerime çöküyor. İçeriye daha sonra elinde bıçak ve yüzünde sinsi bir gülümsemeyle [actor.GetTitleAsNameNoTooltip] giriyor.\n\nBıçağını ve dişini etime geçirirken çığlıklarıma aldırış etmiyor. Bulanık bir şekilde yüzünün kanla, #EMP benim#! et parçalarımla kaplı olduğunu görüyorum. Yalvarıyorum ama zevkle yemeye devam etmesini izlerken bu şekilde öleceğimi fark ediyorum." #krutygetarts
 char_interaction.0170.desc_public:0 "Şafağa karşı beni zorla dışarı taşımaya çalışan iki muhafız tarafından uyandırıldım.\n\nToplanmış kalabalığın ortasınkdai dar ağacına yaklaştıkça yüreğim ezilmeye başladı. [actor.GetShortUINamePossessive] celladı bana bakarak gülümserken kılıcını havaya kaldırıyordu.\n\nCellat zorla diz çöktürüldüğüm yerin etrafında gezerken kalabalık sessizleşmeye başladı ve #EMP bam#!! Her şey karanlığa büründü."
 char_interaction.0170.a:0 "Çürümüş ruhuna ve sana lanet olsun, [actor.GetFirstNameNoTooltip]!!!"
 char_interaction.0170.life_is_just_a_joke.a:0 "Hayat #EMP tam bir#! şaka değil mi?"
 char_interaction.0180.desc:0 "Hane Reisin olarak tek gerçek inanç olan [actor.GetFaith.GetName] inancını benimsemen gerektiğine karar verdim ve korkarım ki bu konuda seçme şansın yok."
 char_interaction.0180.desc.liege:0 "Süzerenin olarak yanlış yoldan dönmeni ve bir [actor.GetFaith.GetAdherentName] bana katılmanı talep ediyorum."
 char_interaction.0180.a:0 "Sanırım mecburum."
 char_interaction.0181.desc:1 "Peki, alıştığım şeyleri yapmayı bırakmak garip gelecek ama [actor.GetFaith.GetAdjective] inancını benimseyeceğim."
 char_interaction.0182.desc:0 "Asla inancımdan vazgeçmeyeceğim ve bunun yerine kendi hanemi kuracağım!"
