### TODO AGOT-ONLY: court_amenities_interactions.0001.desc [AGOT: ]
 court_amenities_interactions.0001.desc:0 ""Just who do you presume to be, strutting around in that ridiculous outfit? This is a royal court, not a brothel! Go and find something more humble!""
 court_amenities_interactions.0001.desc_outro:0 "\n\n[actor.GetNameNoTooltip] beni [actor.GetPrimaryTitle.GetAdjective] kıyafet kanunlarını ihlal etmekle suçladı ve cezalandırılmamı talep etti. Böyle bir ceza üstümde asla kurtulamayacağım bir leke bırakacatır. Bu suçlamaların uydurma olduğu açıkça ortada ve kendimi düzgün bir şekilde savunursam bu suçlamalardan kurtulabilir hatta ona karşı saldırıya bile geçebilirim."
