 RELIGIOUS_HEAD_REQUEST_EXCOMMUNICATION:0 "[secondary_recipient.GetShortUIName|U] son yaptıklarıyla çok ileri gitti. Onu aforoz edip davranışlarını onaylamadığımızı dünyaya duyurmanızı rica ediyorum."
 RELIGIOUS_HEAD_ASK_GOLD:1 "İnançlı bir [actor.GetFaith.GetAdherentName] olarak çoğu zaman yapmak istediğim hayır işlerini para sıkıntısı nedeniyle yapamıyorum. İyi işler yapabilmem için bir miktar altın bağışlayabilir misiniz?"
