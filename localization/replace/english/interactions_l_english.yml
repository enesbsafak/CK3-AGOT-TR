 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET:0 "Hevesimiz herkese örnek olsa da inancımızın muzaffer olması için akıllıca davranmalıyız. Kutsal savaşımızın hedefini [target.GetNameNoTier] yapmak daha doğru bir hareket olmaz mı?"
 ASK_TO_TAKE_VOWS:0 "Bir manastıra girmenin sizin çıkarınız için çok iyi olacağına inanıyorum. Zorla katılmanızı sağlayamasam da gerçekten durumu değerlendirmeniz gerektiğini düşünüyorum..."
