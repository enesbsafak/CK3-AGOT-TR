 char_interaction.0262.desc:0 "[intermediary.GetTitledFirstName] yaptıklarınızı en kısa sürede öğrenecek ama $char_interaction.0199.desc$ "
 char_interaction.0262.a:0 "Zaten biliyor."
 char_interaction.0263.desc:0 "[intermediary.GetTitleAsNameNoTooltip] olan sen değilsin ve senin ıvır zıvırlarına boyun eğmiyorum. [landed_title.GetName] topraklarını istiyorsan ordunu getirmeyi dene."
 char_interaction.0263.result.criminal:0 "Eğer [Select_CString( actor.IsLocalPlayer, '', actor.GetShortUIName )][Select_CString( actor.IsLocalPlayer, 'geri adım atarsanız', 'geri adım atarsa' )]"
 char_interaction.0263.result.war:0 "Eğer [Select_CString( actor.IsLocalPlayer, '', actor.GetShortUIName )][Select_CString( actor.IsLocalPlayer, 'hak iddianızı kullanırsanız', ' hak iddiasını kullanırsa' )]"
 char_interaction.0263.a:0 "Öyleyse bu bir ihanet."
 char_interaction.0263.a.tt:0 "[intermediary.GetTitledFirstName] suçlarınızı öğrenecek"
 char_interaction.0263.b:0 "Blöf yaptığımı mı düşünüyorsun? Haydi, silahlarınızı kuşanın!"
 char_interaction.0271.desc:0 "[intermediary.GetTitledFirstName] tarafından verilen yetki ile ülke sınırlarındaki bazı küçük tutarsızlıkları düzeltiyorum.\n\n[intermediary.GetTitledFirstName] benim vasalım, sizin değil."
 char_interaction.0271.a:0 "Karşı çıkamam. Ama #EMP çıkabilseydim#!..."
 char_interaction.0272.desc:0 "Yetkinizin dışına çıkıyorsunuz ama sadece vekaleten olsa bile [intermediary.GetTitleAsName] otoritesine karşı koyamıyorum.\n\nVasalımı almanızı onaylıyorum."
 char_interaction.0272.a:0 "Hah, yola gel şöyle [recipient.GetFirstNameNoTooltip]."
 char_interaction.0273.desc:0 "Vasallarıma korumaya yemin ettim. Bu yemin senin gibileri de kapsıyor.\n\nOrdunla gelip [intermediary.GetTitledFirstName] ve onun topraklarını benden almaya çalışabilirsin ya da hangi delikten çıktıysan oraya geri dönebilirsin."
 char_interaction.0273.result.criminal:0 "$char_interaction.0263.result.criminal$"
 char_interaction.0273.result.war:0 "$char_interaction.0263.result.war$"
 char_interaction.0273.a:0 "Pişman olacaksın, [recipient.GetFirstNameNoTooltip]."
 char_interaction.0273.a.tt:0 "$char_interaction.0263.a.tt$"
 char_interaction.0273.b:0 "Ne #EMP güzel#! bir davet!"
 char_interaction.0281.desc:0 "[intermediary.GetTitledFirstName] tarafından verilen yetkiye uygun davranarak ahlaksız davranışlarda bulunduğunuz şüphesiyle hapsedilmenizi emrediyorum.\n\nAskerlerime teslim olun ya da sonuçlarına katlanın."
 char_interaction.0281.a:0 "Başka seçeneğim yok."
 char_interaction.0282.desc:0 "Yasa dışı, ahlaksız davranışlarda bulunan ben değil sensin.\n\nÜlkenin iyiliği için teslim olacağım fakat yaptıklarınızı asla unutmayacağımı bilin."
 char_interaction.0282.a:0 "Unutmanı istediğimi kim söyledi!?"
 char_interaction.0283.desc:0 "Sizin merhametinize sığınacağımı mı düşünüyorsunuz? Beni zindana atmak istiyorsanız gelin, kendiniz atın.\n\nÇok ısrar ediyorsanız birkaç #EMP arkadaşımla#! bizzat ben ziyarete gelebilirim."
 char_interaction.0283.a:0 "Bir gün pişman olacaksın."
 char_interaction.0283.a.tt:0 "$char_interaction.0263.a.tt$"
 char_interaction.0283.b:0 "Anlamadınız sanırım. Bu bir istek değil emirdi."
 char_interaction.0291.desc.positive:0 "Benim çıkarlarımı temsil etmenize güveniyor olsam da bu konuda hata yapmış olabilirsiniz. [recipient.GetTitledFirstName] sadık ve değerli bir vasal. Başka şeyler ile meşgul olmanızı öneririm."
 char_interaction.0291.desc.negative:0 "Hiçbir şeyi düzgün yapamıyor musun? [recipient.GetTitledFirstName] değerli ve ülkeye yararı olan biri. En aptal köylü bile bunun farkındadır. Senden iyi vasallara sataşmayı bırak da işini yap."
 char_interaction.0291.desc.neutral:0 "Buna izin vermek şu an için çıkarlarımla örtüşmüyor. Anlayacağınızı ve benim yerime ağırbaşlılıkla hükmetmeye devam edeceğinizi umuyorum.."
 char_interaction.0291.a:0 "Süzerenim iyisini bilir."
 char_interaction.0291.b:0 "Saygısız it!"
 char_interaction.0291.c:0 "Aptal!"
 char_interaction.0291.d:0 "Ahmak!"
 char_interaction.0291.e:0 "Bu. #EMP [Select_CString(intermediary.IsFemale, 'Kadından', 'Adamdan' )].#! Nefret. Ediyorum."
 char_interaction.0291.f:0 "Vay #EMP şerefsiz#!."
 char_interaction.0291.g:0 "Zindanda çürürsün umarım!"
 char_interaction.0291.h:0 "Bir dahaki sefere beni durduramaz..."
