 end_war_attacker_defeat_attacker_desc:0 "\nSizin gibi güçlü birini nasıl yenebileceğimi düşündüğümü bilmiyorum. Heyhat, geçmişi değil geleceği değiştirebilirim.\n\nSize teslim oluyorum, bu savaşı arkamızda bırakalım."
