 liege_offer_council_position_exchange:1 "\nKonseyimi yeniden düzenlemeye karar verdim. Şu andan itibaren bana artık [target.GetPositionName] olarak hizmet edeceksiniz.\n"
 liege_offer_council_position_liked:1 "\nBana olan bağlılığınızı gösterdiniz ve ben de sizi hizmetime alarak ödüllendirmek istiyorum.\n\n[actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ülkesinin konseyindeki [target.GetPositionName] koltuğunu teklif ediyorum.\n"
 liege_offer_council_position_powerful:1 "\nNüfuzlu bir [recipient.GetTitleAsNameNoTooltip] olarak konseyimde olmayı hak ediyorsunuz.\n\nSize [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ülkesinin konseyindeki [target.GetPositionName] koltuğunu teklif ediyorum.\n"
 liege_offer_council_position_disliked:1 "\nUzun bir süre düşündükten sonra, acı bir şekilde, boş olan konsey koltuğum için en iyi adayın gerçekten de siz olduğunuzu gördüm.\n\nYapmak istemesem de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ülkesinin konseyindeki [target.GetPositionName] koltuğunu size teklif etmek zorundayım.\n"
 liege_offer_council_position_skilled:1 "\nBecerileriniz gözümden kaçmadı, [recipient.GetFirstNameNoTooltip].\n\nSize [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ülkesinin konseyindeki [target.GetPositionName] koltuğunu teklif ediyorum.\n"
 liege_offer_council_position_fallback:1 "\nBugün şanslı günün [recipient.GetFirstNameNoTooltip], yeni bir [target.GetPositionName] lazım ve tek aday sensin.\n\nKabul edeceğinizi umuyorum?\n"
