 char_interaction.0010.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0010.desc: "[actor.GetFirstName], bence bu güzel bir vasallığın başlangıcı!"
 char_interaction.0010.a: "Evet efendim."
