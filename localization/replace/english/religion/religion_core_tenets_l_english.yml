 tenet_literalism_name:0 "Aslına Uygunluk"
 tenet_literalism_desc:0 "Kutsal metinlerimiz kutsalın niyetini açıkça belirtir, insan yorumuna çok fazla gerek yoktur."
 doctrine_parameter_literalist_debate_enabled:0 "[opinion|E] kaybederek ülkedeki diğer hükümdarlar ile tartışılabilir, bunun sonucunda [piety|E] kazanılabilir veya kaybedilebilir."
