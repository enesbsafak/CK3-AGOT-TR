 tenet_human_sacrifice_name:0 "İnsan Kurbanı"
 tenet_human_sacrifice_desc:0 "Bağlılığımızın en iyi göstergesi adak adamaktır. Sunabileceğimiz en değerli adak ise bir insan canıdır."
 doctrine_parameter_human_sacrifice_active:1 "[executions|E] [Concept( 'piety', 'Dindarlığı' )|E] azaltmak yerine arttırır.\n$EFFECT_LIST_BULLET$[Concept( 'sharing_power', 'Güç paylaşırken' )|E] [executions|E] hiç [Concept( 'prestige', 'Prestije' )|E] mal olmaz"
 doctrine_parameter_flower_war_cb_active:0 "Komşu ülkelere karşı [flowery_war|E] [Concept( 'casus_belli', 'Savaş Sebebini' )|E] verir."
 tenet_gruesome_festivals_blot_name:0 "Blót"
 tenet_gruesome_festivals_name:0 "Dehşet Festivaller"
 tenet_gruesome_festivals_desc:0 "Hepimiz kan içinde doğduk. Hayvanlarımızın, ailemizin, düşmanlarımızın kanıyla hayatta kalmaya devam ediyoruz. [ROOT.Faith.PantheonTerm] için de hak ettikleri kanı sunmalıyız."
 gruesome_festivals_active_name:0 "Büyük kurban ayinleri düzenleme"
 doctrine_parameter_gruesome_festivals_active:0 "Aynı [Concept( 'faith', 'mezhepten' )|E] olan vasallar ve [county_opinion|E] için yaklaşık her on yılda bir büyük kurban ayinleri düzenleyebilir."
 tenet_volcanic_veneration_name:0 "Yanardağ Saygısı"
 tenet_volcanic_veneration_desc:0 "Evimizin alevli çukurlarından fışkıran yeni doğmuş toprak kadar kutsal olan şey azdır. Hayatlarımızı felaketin ucunda, [ROOT.Faith.PantheonTerm] merhametliyse yaşarız."
 tenet_cthonic_redoubts_name:0 "Kitonik Tabyalar"
 tenet_cthonic_redoubts_desc:0 "Dünya'nın köklerinden daha iyi bir sığınak, çıkıntılı omurgalarından daha iyi bir kale, gizli patikalarından daha kutsal bir hac yoktur. Yaradılışı bu yüce zirvelerden izleriz ve Kutsal'ın gerçek kudretini hissederiz."
 doctrine_parameter_easier_to_convert_faith_in_mountains:0 "Dağlık [Concept( 'terrain', 'arazide' )|E] [convert_county|E] hızı: #P +%[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains:0 "Aynı [Concept( 'faith', 'mezhepten olan' )|E] dağlık [Concept( 'terrain', 'arazide' )|E] [promote_culture|E] hızı: #P +%[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains:0 "Dağlık [Concept( 'terrain', 'arazide' )|E] düşmancıl [convert_county|E] hızı: #P %[EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]#!"
 tenet_consolamentum_name:1 "Endura"
 tenet_consolamentum_name_alternate:0 "İntihar Ayini"
 tenet_consolamentum_desc:0 "Yaşlandığımızda veya hastalandığımızda ruhumuzu günahlardan temizleyen bir ayin yaparız. Tekrar günahlar ile kirlenmemek için ayin tamamlandığında hayatımıza hızlıca ve kesin bir şekilde son veririz."
 doctrine_parameter_consolamentum_active:1 "İnananlar yaşlandıklarında, âciz olduklarında veya ölüme yaklaştıklarında hayatlarını sona erdirmeye [decide|E]ebilirler. Bunu yapmak intihardan gelen normal cezaları beraberinde getirmeyecektir."
 tenet_gnosticism_name:0 "Gnostisizm"
 tenet_gnosticism_desc:0 "Bilgi yoluyla her insanın içinde saklı olan kutsal kıvılcım özgür kalıp manevi dünyadaki cennetsel kaynağına dönebilir."
 doctrine_parameter_hostility_override_tenet_gnosticism:3 "Diğer Gnostik ve İkici [Concept( 'faiths', 'Mezhepleri' )|E] $hostility_hostile_tooltippable$ veya $hostility_evil_tooltippable$ yerine [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] sayar."
