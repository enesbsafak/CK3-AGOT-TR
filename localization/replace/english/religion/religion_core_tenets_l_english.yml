 tenet_esotericism_kabbalah:0 "Kabala"
 tenet_esotericism_desc:0 "Kutsalın büyük gizemleri fânilerin anlayışının ötesinde olabilir ama bu cahillik için bahane edilemez. Bu gizemlerin varlığı bizi öğrenmeye ve etrafımızdaki dünyayı anlamaya çalışmaya zorlar."
 doctrine_parameter_tenet_esotericism_mystic_education:2 "[learning|E] [education_focus|E]na sahip çocuklar derslerinde başarılı olursa [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] özelliğini kazanabilir"
 tenet_esotericism_kabbalah_desc:0 "Kabala'nın öğretileri sayesinde insanlar sonsuz Tanrı, Ein Sof olarak bilinen sonsuzluğun doğası ve Tanrı'nın yarattıkları arasındaki ilişkiyi anlayabilir. Kabala, Yahudi mistisizminin temelini oluşturur ve inananları diğer Yahudi düşünce okullarıyla her zaman etkileşim içindedir."
 tenet_religious_kabbalah_cost_tooltip:0 "Kabala: #P -%10#!"
 tenet_adaptive_name:0 "Uyumsal"
 tenet_adaptive_desc:0 "Eski kısıtlamalara doğuştan bağlı kalmak inananlara sadece zarar verir. İnancımızın ana öğretilerine bağlı kaldığımız sürece yasalarımızı etrafımızdaki değişen dünyaya göre uyarlayabiliriz."
 doctrine_parameter_tenet_adaptive_conversion_resistance:0 "Kontluk Din Değiştirme Direnişi: #P +%30#!"
 doctrine_parameter_reduced_vassal_religion_discontent:1 "Kâfir [vassals|E] Bağımsızlıkçı ve Halkçı [Concept( 'factions', 'Örgütleşmelere' )|E] katılmaya daha az yatkındır."
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "Bu [Concept('doctrine', 'İlkeye')|E] sahip bir başka [Concept('faith', 'Mezhebe')|E] geçmenin [piety_i|E][piety|E] maliyeti: #P -50%#!"
 doctrine_parameter_immaterial_harmony_buddhist_take_vows: "[GetReligionByKey('buddhism_religion').GetAdjective] [Concept('faiths', 'Mezhepleri')|E] #V $take_vows_interaction$#! [Concept('interaction', 'Etkileşimini')|E] kullanabilir"
 tenet_inner_journey_name:0 "İç Yolculuk"
 tenet_inner_journey_desc:0 "Sadece kendimizi anlayarak dünyayı anlayabiliriz. Kendini keşfetme yolculuğu önemli olduğu kadar uzun ve zordur."
 doctrine_parameter_meditation_mechanics_active:0 "Karakterler İnzivada Meditasyon yapmaya [decide|E]erek [stress|E] azaltabilir ve inançla ilgili anlayışlar kazanabilir."
 tenet_dharmic_pacifism_name:0 "Dharma Barışçılığı"
 tenet_dharmic_pacifism_desc:0 "Hepimiz kozmik düzenin bir parçasıyız. Kendin de dâhil olmak üzere bir şeye karşı şiddet her şeye karşı şiddettir."
 tenet_bhakti_name:0 "Bhakti"
 tenet_bhakti_patron_god_name:0 "Hami Tanrılar"
 tenet_bhakti_desc:0 "Fâniler kutsalın yüceliğine ulaşamaz fakat kutsalın bir yönünü seçip onu taklit etmeye, ona tapınmaya ve kendimizi adamaya çalışırsak onlara normalden daha çok yaklaşabiliriz."
 doctrine_parameter_select_personal_god_active:1 "Hükümdarlar tapınacakları kişisel bir avatar seçmeye [decide|E]erek ona bağlı bir bonus kazanabilir."
 tenet_asceticism_name:0 "Çilecilik"
 tenet_asceticism_desc:0 "Maddi arayışlar bizi kutsal doğruya köreltir. Sadece lüks olmadan basit bir hayat yaşamaya yemin edersek manevi aydınlanmaya ulaşabiliriz."
 tenet_ritual_hospitality_name:0 "Misafirperverlik Geleneği"
 tenet_ritual_hospitality_alternate_name:0 "Puja"
 tenet_ritual_hospitality_desc:0 "Misafirperverlik, insanoğlunun sahip olabileceği en büyük erdemlerden biridir. Evimizde ağırladığımız hem fâni hem de kutsal konuklara her zaman saygıyla ve onurlu bir şekilde davranmalıyız."
 doctrine_parameter_host_honored_guests_active:0 "[rulers|E] diğer karakterleri Saygılı Misafir olarak ağırlayabilir, [piety|E] harcayarak [opinion|E] arttırır."
 tenet_warmonger_name:0 "Savaşçı"
 tenet_warmonger_desc:0 "İnanç ve savaş beraber yaşar. Kutsal adına savaşmayı reddeden gerçek bir inanan olamaz."
 doctrine_parameter_conquest_cb_enabled:0 "[rulers|E] komşu hükümdarlara karşı [Concept( 'casus_belli', 'Savaş Sebebine' )|E] sahiptir."
 doctrine_parameter_faith_can_raid:0 "Ganimet için yabancı [Concept( 'counties', 'kontlukları' )|E] [Concept( 'raiding', 'yağmalamaya' )|E] izin verir."
 doctrine_parameter_invasion_cb_enabled:0 "Prestijli [rulers|E] yaşamları boyunca bir kere İstila [Concept( 'casus_belli', 'Savaş Sebebini' )|E] kullanabilir."
 doctrine_parameter_great_holy_wars_active_if_reformed:1 "[faith|E] [organized|E] ise ve [head_of_faith|E] varsa [great_holy_wars|E] ilan edebilir."
 tenet_ancestor_worship_name:0 "Ataya Saygı"
 tenet_ancestor_worship_desc:0 "Atalarımız bizi mezarın ötesinden izliyor, rehberlik ediyor, yol gösteriyor. Bu nedenle onlara saygılı davranmalı ve onları onurlandırmalıyız."
 tenet_adorcism_name:0 "Adorsizm"
 tenet_adorcism_desc:0 "Dünyadaki ruhlar hem iyi hem de kötü birçok büyük iş yapabilir. Onlara saygı göstererek ve onları onurlandırarak bize iyilik ve düşmanlarımıza kötülük yapacaklarını umuyoruz."
 doctrine_parameter_spirit_possession_active:1 "'Ruhlardan Yardım İste' [decision|E]ını açar."
 tenet_ritual_celebrations_name:0 "Kutlama Ayinleri"
 tenet_ritual_celebrations_desc:1 "Kutsala tapınmak toplumla paylaşılması gereken bir şeydir. Kutsala saygı göstermek ve ona tapmak adına festivaller düzenlemek hepimizi bir araya getirir."
 doctrine_parameter_mandatory_feast_attendance:0 "[vassals|E] ziyafetlerinize katılmaya daha yatkındır. Gelmeyi reddedenler ise [piety|E] kaybeder."
 tenet_sky_burials_name:0 "Gökyüzü Defni"
 tenet_sky_burials_desc:1 "Ölüler yer altında hapsolmamalı. Onların leşçil kuşlar tarafından yenmesine izin vermek daha iyidir, böylece son bir cömertlik ile kendilerini beslemiş dünyayı geri besleyebilirler."
 doctrine_parameter_sky_burials_active:3 "[rulers|E] atalarına Gökyüzü Defni yapabilir, [piety|E] kazanıp [Concept( 'vassals', 'Vasallarını' )|E] mutlu ederler.\n$EFFECT_LIST_BULLET$[GetBuilding('charnel_grounds_01').GetName] [duchy_building|E] inşa edilebilir"
 can_build_towers_of_silence_active_name: "[GetBuilding('tower_of_silence_01').GetName] [duchy_building|E] inşa edilebilir"
 doctrine_parameter_can_build_towers_of_silence_active: "[vassals|E], #EMP eğer#! [Concept( 'liege', 'süzerenlerinin' )|E] [Concept( 'faith', 'mezhebi' )|E] $tenet_sky_burials_name$ öğretisine sahip değilse [GetBuilding('tower_of_silence_01').GetName] [Concept( 'duchy_building', 'Düklük Binasını' )|E] inşa ederek [county|E] dindarlığını arttırabilir"
 tenet_sacred_childbirth_name:0 "Kutsal Doğum"
 tenet_sacred_childbirth_alternate_name:0 "Kūdikis Lemti"
 tenet_sacred_childbirth_desc:0 "Annelerin doğum yaptığı hamamlar düzgün ayinler ile temizlenmeli ve düzenlenmeli. Kutsal böylece doğum esnasında bizi kutsayabilir."
 doctrine_parameter_safer_childbirths_active:0 "Anneler doğum esnasında #P daha az#! ölür."
 doctrine_parameter_healthier_children_active:0 "Çocuklar #P daha az#! hastalıklı olur veya ölü doğar."
 doctrine_parameter_piety_from_childbirth_active:0 "Anneler ve babalar, çocuk sahibi olduklarında [piety|E] kazanırlar"
 piety_from_childbirth_toast:0 "Kutsal Doğum"
 tenet_sanctity_of_nature_name:0 "Doğanın Kutsallığı"
 tenet_sanctity_of_nature_desc:1 "Doğal dünyayı kutsal olan yaratmıştır, biz sadece onun misafiriyiz. Her ağaca, her hayvana ve hatta yere bile saygılı olmalıyız."
