 tenet_legalism_desc:0 "Yasalarımız yüzyıllarca süregelen bilgeliğin ve dindarlığın sonucudur. Bunlara uymak insanın kendi doğasına göre dindarlıktır. Kim olursa olsun bir günahkâr asla yasaların üzerinde olamaz."
