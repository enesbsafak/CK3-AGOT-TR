 doctrine_parameter_same_culture_conversion_bonus_active:1 "[Concept( 'culture', 'Kültürümden' )|E] olan [counties|E] için din değiştirme hızı: #P +%50#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active:1 "[Concept( 'faith', 'Mezhebimden' )|E] olan [counties|E] için kültür yayma hızı: #P +%50#!"
 doctrine_parameter_other_culture_conversion_penalty_active:1 "Başka [Concept( 'culture', 'Kültürden' )|E] olan [counties|E]da din değiştirme hızı: #N -%50#!"
 tenet_pentarchy_name:0 "Pentarşi"
 tenet_pentarchy_alternate_name:0 "Pentarşi"
 tenet_pentarchy_desc:0 "Kutsal bölgelerimiz sadece kutsal yerler değildir, dindar liderlerimizin oturup yönetmeleri gereken koltuklardır."
 tenet_aniconism_name:0 "Anikonizm"
 tenet_aniconism_desc:0 "Oyulmuş tasvirlere tapınmak çoğu kişiyi kutsal doğruya kör etti. Kutsal mekânlarımızdan tüm simgeleri atacağız ki inananlarımız da aynı tuzağa düşmesin."
 doctrine_parameter_reforging_artifacts_costs_piety:0 "Bu [Concept( 'faith', 'Mezhepten' )|E] olan [rulers|E], [Concept( 'artifact', 'Eserleri' )|E] [Concept( 'reforge', 'Yeniden Oluşturmak' )|E] veya [Concept( 'repair', 'Tamir Etmek' )|E] için [piety|E] harcamalıdır"
 doctrine_parameter_destroying_artifacts_is_pious:0 "Bu [Concept( 'faith', 'Mezhepten' )|E] olan [rulers|E], [piety|E] kazanmak için [Concept( 'artifact', 'Eserleri' )|E] yok edebilir"
 destroying_artifacts_is_not_pious_tt:0 "[Concept( 'faith', 'Mezhebiniz' )|E] [piety|E] kazanmak için [artifact|E] yok edemez"
 artifact_is_rarer_than_masterwork_tt:0 "Bu [Concept( 'artifact', 'Eserin' )|E] [Concept( 'rarity', 'Nadirliği' )|E] Güzel'den daha yüksek"
 tenet_alexandrian_catechism_name:0 "İskenderiye Kateşizmi"
 tenet_alexandrian_catechism_desc:0 "İskenderiye Kateşizm Okulu uzun zaman boyunca ilahiyatçıları eleştirel olarak düşünmeye ve statükoyu sorgulamaya teşvik etmişti.\n\nOkul fiziki olarak yıkılmış olsa bile bu geleneği devam ettiriyoruz."
 tenet_islamic_rationalism_name: "İslami Akılcılık"
 tenet_islamic_rationalism_desc: "[ROOT.Faith.HighGodNameAlternate] adil ve bilge olduğu için, akla aykırı eylemler yapmayacağı ve yarattıklarının refahına zarar vermeyeceği öngörülmelidir. Sadece akıl ve mantık yoluyla onun büyük planındaki rolümüzü kavrayabilir, iyi ve kötüyü birbirinden ayırt edebiliriz."
 tenet_hedonistic_name:0 "Hedonistik"
 tenet_hedonistic_desc:0 "Kutsal olan, dünyayı bizim tecrübe edebileceğimiz ve tadabileceğimiz birçok zevkle doldurdu. Böyle şeylerden kaçınmak yaradılışın kendisinden kaçınmaktır."
 doctrine_parameter_piety_from_feasts_active:1 "[GetActivityType('activity_feast').GetName] düzenlemek [piety|E] kazandırır."
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" # Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "[GetActivityType('activity_festival').GetName] düzenlemek [piety|E] kazandırır."
 tenet_carnal_exaltation_name:0 "Dünyevi Yücelik"
 tenet_carnal_exaltation_desc:0 "İnsan vücudunun zevkleri diğer tüm dünyevi tecrübeleri aşan olağanüstü bir şeydir ve bizi kutsala yakınlaştırır. Cinsel arzularımızı yüceltmeli ve onu doyuracak fırsatlar aramalıyız."
 tenet_polyamory_name:0 "Çokaşklılık"
 tenet_polyamory_desc:0 "[ROOT.Faith.FertilityGodName] bizi nasıl seviyorsa biz de birbirimizi öyle koşulsuz sevmeliyiz. Sadece bir kişinin diğer kişinin sevgisine sahip olması gibi zamanı geçmiş düşüncelerden kurtulmalıyız."
 doctrine_parameter_no_unfaithfulness_penalty_active:0 "İnananlar evlilik dışı ilişkiler yaşayan eşlerine veya eşlerinin sevgililerine karşı [opinion|E] cezaları veya [imprisonment_reasons|E] almaz."
 tenet_unrelenting_faith_name:0 "Boyun Eğmeyen İnanç"
 tenet_unrelenting_faith_desc:0 "İnancımız güçlü ve gerekirse onun için savaşıp ölürüz. Ne kadar kazanması imkânsız bir durumda olsak bile asla pes etmeyiz."
 tenet_unrelenting_faith_zandik_name: "Haklı İsyan"
 tenet_unrelenting_faith_zandik_desc: "Hiçbir canlıya ve hiçbir şeye zarar vermek istemeyiz fakat yaşam biçimimiz tehlike altındaysa, acımasız bir şekilde onu savunmaya da hazırız." 
 tenet_rite_name:0 "Usul"
 tenet_rite_desc:0 "İnançlarımız ana mezhebimizden o kadar da farklı değil. Neden ana ilkeler, ve en önemlisi de, tahkim mercisinin neresi olduğu üzerinde aynı görüşe sahipsek önemsiz şeyler üzerinde tartışalım ki?"
 doctrine_parameter_maintains_head_of_faith_on_creation:0 "Yeni [faiths|E] oluşturulduklarında eski [Concept( 'head_of_faith', 'Mezhep Liderine' )|E] sahip olmaya devam eder"
