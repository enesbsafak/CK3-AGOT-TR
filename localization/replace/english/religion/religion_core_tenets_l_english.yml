 tenet_reincarnation_name:0 "Reenkarnasyon"
 tenet_reincarnation_desc:0 "Bu hayattan önce birçok hayat yaşadık ve bundan sonra da yaşamaya devam edeceğiz. Her ölüm yeni bir şeyin başlangıcıdır."
 tenet_reincarnation_zoroastrian_name: "Raj'a"
 tenet_reincarnation_zoroastrian_desc: "Tıpkı tanrıların insan bedeninde dünyaya gelmeleri gibi, biz de yeniden doğabiliriz. Erdemliler güzellik ve saflıkla ödüllendirilip zamanla saf ışıktan yapılma meleklere dönüşebilir."
 doctrine_parameter_reincarnation_resistance_to_conversion:0 "Kontluk Din Değiştirme Direnişi: #P +%20#!"
