 tenet_armed_pilgrimages_name:0 "Silahlı Hacılar"
 tenet_armed_pilgrimages_desc:0 "Hacılarımız dünya üzerindeki kutsal bölgelerimizi ziyaret etmek için uzun yollar gidiyor. Onları, onlara zarar vermek isteyenlerden korumak için memnuniyetle silahlanırız."
 doctrine_parameter_cheaper_holy_wars_active:0 "Bu [Concept( 'faith', 'Mezhebin' )|E] [Concept( 'rulers', 'Hükümdarları' )|E] [holy_wars|E] ilan etmek için #P -%20#! daha az [piety|E] harcar."
 doctrine_parameter_great_holy_wars_active:1 "[head_of_faith|E] varsa [faith|E] yüksek [Concept( 'fervor', 'Şevke' )|E] sahip olduğunda bir [great_holy_war|E] ilan edebilir."
 doctrine_parameter_ghw_no_hof_conversion_buffs_active:0 "[head_of_faith|E] yoksa inananlar her kontrol edilen [holy_site|E] için [convert_county|E] [Concept( 'councillor_task', 'Konsey Üyesi Görevine' )|E] bonus alır."
 doctrine_parameter_pilgrimage_decision_active:1 "Bu [Concept( 'faith', 'Mezhepten' )|E] olan karakterler bir [pilgrimage|E]cı başarıyla tamamladıklarında bonus alırlar."
 tenet_monasticism_name:0 "Manastır Hayatı"
 tenet_monasticism_desc:0 "Güzel yemeklerin ve içeceklerin zevki bizi kutsala hizmet etmekten alıkoyar. Bunlardan kaçınmanın en iyi yolu kendimizi ücra manastırlarda izole etmektir."
 doctrine_parameter_take_vows_active:0 "[courtiers|E] Yemin Ederek [GetTrait('devoted').GetName( GetNullCharacter )] olabilir."
 tenet_divine_marriage_name:0 "Kutsal Evlilik"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "Yakın akrabalarla evlenerek, ilk yaratılmışların kutsal birliğini örnek almış oluruz. İyi nitelikler ailemiz içerisinde nesilden nesile aktarılır, soyumuzu saf tutarak kötülüğe karşı olan ebedi savaşta daha güçlü olabiliriz."
 doctrine_parameter_divine_marriage_opinion:0 "[close_family|E]den biri ile evlenen inananların aynı [Concept( 'faith', 'Mezhepten' )|E] olan [Concept( 'vassals', 'Vasallarının' )|E] onlara karşı [Concept( 'opinion', 'görüşleri' )|E] $VALUE|0+=$ artar."
 doctrine_parameter_divine_marriage_piety_gain_active:2 "[GetFaithDoctrine('doctrine_monogamy').GetBaseName] evlilik bonusu [close_family|E] üyesi ile evleniyorsanız büyük miktarda [piety|E] da verir."
 tenet_pacifism_name:0 "Barışçılık"
 tenet_pacifism_desc:0 "Şiddet ızdıraba, acıya ve pişmanlığa sürükleyen iğrenç bir davranıştır. Mümkün olduğunca şiddetten kaçınarak inananların güven içinde yaşayacağı daha güçlü toplumlar inşa edebiliriz."
 doctrine_parameter_holy_wars_forbidden:0 "[holy_wars|E] ilan edemez veya [raid|E] yapamaz."
