 tenet_mendicant_preachers_name:0 "Dilenci Vaizler"
 tenet_mendicant_preachers_desc:0 "Misyonerlerimiz sırtlarında sadece kıyafetleriyle dünyanın her köşesine giderler. Ziyaret ettikleri yerlerinin cömertliğiyle yaşarlar ve karşılığında gerçek dinin öğretilerini paylaşırlar."
