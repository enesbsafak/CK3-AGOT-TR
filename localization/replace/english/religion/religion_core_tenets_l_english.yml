 tenet_communion_name:0 "Komünyon"
 tenet_communion_desc:0 "Ayinlerimiz sadece sembolik değildir, kutsal olanın varlığını hatırlatırlar. Bize törenlerde katılamayanlar veya katılmayanlar gerçek inanan olamazlar."
