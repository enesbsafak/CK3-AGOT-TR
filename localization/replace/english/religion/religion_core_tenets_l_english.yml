 tenet_false_conversion_sanction_desc:0 "Eğer hayatınız tehlikedeyse kalbinizde doğruya inandığınız sürece yalan bir dine geçtiğinizi söyleyebilirsiniz."
 doctrine_parameter_sanctioned_false_conversion:0 "Din Değiştirme Direnişi: #P +%30#!\n$EFFECT_LIST_BULLET$[characters|E] ve [counties|E] yanlış yönlendirilirlerse bazen tekrar bu [Concept( 'faith', 'Mezhebe' )|E] dönebilirler."
