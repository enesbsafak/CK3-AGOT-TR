 tenet_communal_identity_name:0 "Toplumsal Kimlik"
 tenet_communal_identity_desc:0 "İnancımız ve kültürümüz birbirleriyle özünde bağlantılıdır. Bu gelenek toplumumuzdaki bağları güçlendirse de yabancıları dışlar."
