 heresy_hostility_doctrine_name:0 "Sapkınlık"
 heresy_hostility_doctrine_desc:0 "Kendi zevkleri için dinî çarpıtan ve bozan sahte peygamberlerden sakın. Bu günahları işleyenler kâfirdir ve helak edilmelidir."
 divine_destiny_name:0 "Kutsal Kader"
 divine_destiny_doctrine_name:0 "Dünyanın Meşru Hükümdarları"
 divine_destiny_doctrine_desc:0 "Biz tüm insanlar için barış ve refah getirecekleriz. Biz dünyaya hükmetmeye hakkı olanlarız."
