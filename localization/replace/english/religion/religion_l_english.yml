 doctrine_deviancy_name:0 "Sapıklık"
 doctrine_deviancy_crime_name:0 "Suç"
 doctrine_deviancy_crime_desc:0 "Bir başkasını sevmenin tek bir yolu olduğu açık. Bu yoldan sapanlar günahkârdır ve cezalandırılmalıdır."
 doctrine_deviancy_shunned_name:0 "Ayıplanmış"
 doctrine_deviancy_shunned_desc:0 "Anormal ve garip olan bazı cinsel davranışlar vardır, bunlara sahip insanlar da anormal ve gariptir."
 doctrine_deviancy_accepted_name:0 "Kabul Edilmiş"
 doctrine_deviancy_accepted_desc:0 "Aşk güzel ve kutsaldır, nasıl yapıldığı fark etmeksizin. Herkes istediği gibi aşkını gerçekleştirebilir."
 doctrine_deviancy_virtuous_name:0 "Faziletli"
 doctrine_deviancy_virtuous_desc:0 "Aşk yapmak bizi kutsala daha da yakınlaştırır. Sıradan arzuların zincir vuramadığı kişiler inancımızda yüceliğin en üst mertebesidir."
