 doctrine_no_head_name:0 "Yok"
 doctrine_no_head_desc:0 "[ROOT.Faith.HighGodName] ve onun iradesini tamamen kavrayabilecek birinin olduğunu düşünmek aptalcadır. Herkes kendi kalbinin sesini dinlemeli ve kendine gösterilen yolu bulmalıdır."
