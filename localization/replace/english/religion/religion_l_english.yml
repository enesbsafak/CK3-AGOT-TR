 doctrine_clerical_succession_temporal_fixed_appointment_desc:0 "[ROOT.Faith.BishopNeuterPlural] kendi hükümdarları tarafından seçilmeli ancak sorumlulukları kutsal olduğu için kendilerine verilen görev geri alınamaz."
