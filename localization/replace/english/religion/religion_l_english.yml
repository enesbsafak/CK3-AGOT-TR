 doctrine_witchcraft_crime_name:0 "Suç"
 doctrine_witchcraft_crime_desc:0 "Bu dünyada sadece yaradan mucizeler gerçekleştirebilir. Onu taklit etmeye çalışan herkes kibri ve küstahlığı nedeniyle cezalandırılmalıdır."
 doctrine_witchcraft_shunned_name:0 "Ayıplanmış"
 doctrine_witchcraft_shunned_desc:0 "Dünyadaki doğaüstü şeyleri sadece yaradan kontrol edebilir, bu bilinmeyen güçleri bir ölümlünün emrine almaya çalışmak yanlıştır."
 doctrine_witchcraft_accepted_name:0 "Kabul Edilmiş"
 doctrine_witchcraft_accepted_desc:0 "Büyü dünyamızı kapsar, atalarımızın yaptığı gibi büyüyle uğraşmak da bizim hakkımızdır."
 doctrine_witchcraft_virtuous_name:0 "Faziletli"
 doctrine_witchcraft_virtuous_desc:0 "Cadılık yapmak ruhunu kötülüklere karşı açık bırakmaktır. Bu cesareti gösterip ruhlarını temiz tutabilenler kutlanmalıdır."
