 doctrine_clerical_succession_spiritual_appointment_desc:0 "[ROOT.Faith.BishopNeuterPlural|U], [ROOT.Faith.AltPriestTermPlural] tarafından atanmalı ancak seküler hükümdarlar da kendilerine hizmet etmekte başarısız olanları kovabilmeli."
