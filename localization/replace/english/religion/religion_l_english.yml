 special_doctrine_is_jewish_faith_desc:0 "Soylu olanların hepsi günahkâr bir hayat sürmez. Onların arasında Tanrı'nın seçilmiş halkına saygı gösterenler vardır ve onlar da karşılığında bizim saygımızı hak ediyorlar."
