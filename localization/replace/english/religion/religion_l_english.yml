 doctrine_homosexuality_shunned_desc:0 "Durum ne olursa olsun iki erkeğin birbirleriyle cinsel bir ilişki yaşaması doğal değildir."
 doctrine_homosexuality_accepted_name:1 "Kabul Edilmiş"
 doctrine_homosexuality_accepted_desc:0 "Aşk, insan bedenini aşan ve cinsiyetle sınırlandırılamayan harikulade bir şeydir."
