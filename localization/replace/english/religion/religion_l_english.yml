 doctrine_consanguinity_name:0 "Akraba Evliliği"
 doctrine_consanguinity_dynastic_name: "Soy Yasağı"
 doctrine_consanguinity_dynastic_desc: "Ne kadar uzak akraba olursa olsun, aynı aile adını ve ortak bir soyu paylaştığınız biriyle evlenmek kesinlikle yasaktır. Aynı şekilde kan bağına sahip olduğunuz başka aile adlarından kişilerle evlenmek de kabul edilemez."
 doctrine_consanguinity_restricted_name:0 "Yakın Akraba Yasaktır"
 doctrine_consanguinity_restricted_desc:0 "İki akrabanın evlenmesine veya cinsel ilişkiye girmesine izin vermek [ROOT.Faith.HighGodName] önünde suçtur."
 doctrine_parameter_consanguinity_restricted_marriage:0 "[extended_family_members|E] ve/veya [close_family_members|E] arasındaki evlilikler yasaktır."
 doctrine_parameter_consanguinity_restricted_close_kin_incest:0 "[extended_family_members|E] ve/veya [close_family_members|E] arasındaki cinsel ilişkiler ensest [Concept( 'secret', 'Sırrını' )|E] verir."
 doctrine_consanguinity_cousins_name:0 "Kuzen Evliliği"
 doctrine_consanguinity_cousins_desc:0 "Kuzenler kan bağına sahip olabilir fakat soyu korumak için evlenebilecek kadar birbirlerine uzaktırlar."
 doctrine_parameter_consanguinity_cousins_marriage:0 "Kuzenler birbirleriyle evlenebilir."
 doctrine_parameter_consanguinity_cousins_incest:0 "Kuzenler arasındaki cinsel ilişkiler ensest [Concept( 'secret', 'Sırrını' )|E] vermez."
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_name:0 "Yeğen ile Evlilik"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_desc:0 "Aralarındaki bağ doğrudan olmadığı sürece aile üyeleri hanedanın iyiliği için birbiriyle evlenebilir."
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_marriage:0 "Kuzen, hala/teyze ile yeğen veya amca/dayı ile yeğen evlilikleri olabilir."
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_incest:0 "Kuzenler arasındaki, hala/teyze ile yeğen veya amca/dayı ile yeğen arasındaki cinsel ilişkiler ensest [Concept( 'secret', 'Sırrını' )|E] vermez."
 doctrine_consanguinity_unrestricted_name:0 "Kısıtsız Evlilik"
 doctrine_consanguinity_unrestricted_desc:0 "Aile üyelerinin birbirlerini sevmesi sağlıklı ve doğaldır, bu sevginin cinsel ilişkileri kapsayamacağını söylemek ise aptalcadır."
 doctrine_parameter_consanguinity_unrestricted_marriage:0 "Aile üyeleri aralarında evlenebilir."
 doctrine_parameter_consanguinity_unrestricted_incest:0 "Aile üyeleri arasındaki cinsel ilişkiler ensest [Concept( 'secret', 'Sırrını' )|E] vermez."
 doctrine_parameter_consanguinity_restricted_dynastic_marriage: "Aynı [Concept('dynasty', 'Hanedana')|E] mensup kişiler arası evlilikler yasaktır"
