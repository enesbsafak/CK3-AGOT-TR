 doctrine_funeral_name: "Cenaze Geleneği"
 doctrine_funeral_stoic_name: "Stoacı Defin"
 doctrine_funeral_stoic_desc: "Beden ölmüştür ama ruh yaşamaya devam eder. Ölüm, yas tutma ve ağıt yakma zamanı değildir. Cenaze törenleri, ölünün bedenini sessiz ve mütevazı bir şekilde toprağa teslim ederek onu onurlandırır."
 doctrine_funeral_bewailment_name: "Feryatlı Defin"
 doctrine_funeral_bewailment_desc: "Ruh diğer dünyaya doğru uzun yolculuğuna başlamıştır, onları bir daha asla bu dünyada göremeyiz. Ölüyü tanıyan herkesin bir araya gelmesi ve kederlerini halka açık bir ağıt gösterisiyle sunması oldukça önemlidir. Bu hem ölüyü onurlandırır hem de ruhlarımızı kederden arındırır."
 doctrine_funeral_cremation_name: "Ölü Yakımı"
 doctrine_funeral_cremation_desc: "Küllerden geldik, küllere döneceğiz. Büyük bir cenaze ateşiyle ölen kişinin bedeninden kurtulunur ve ortaya çıkan küller ölülerin yolculuğuna devam etmesi için yeryüzüne yayılır."
 doctrine_funeral_sky_burial_name: "$tenet_sky_burials_name$"
 doctrine_funeral_sky_burial_desc: "$tenet_sky_burials_desc$"
 doctrine_funeral_mummification_name: "Mumyalama"
 mummification_funeral_name: "Mumyalama"
 doctrine_funeral_mummification_desc: "Bedenin işlevi sona ermiştir ama ruhun öbür dünyaya gideceği araç olmaya devam etmektedir. Bu nedenle fiziksel form da ruh kadar değişmez olmalıdır ve [ROOT.Faith.FateGodNamePossessive] yargısını beklemelidir."
 doctrine_family_rites_name: "Aile Ritüelleri"
 doctrine_family_rites_desc: "Ölüm, yaşayanlar için bir yas ve ritüel dönemidir. Hiyerarşi ve kıdem, ölümde de yaşamda olduğu kadar önemlidir. Vefatlarından sonra bile yaşlıları saygıyla yâd etmek ve bunu doğru biçimlerle yaptığınızı göstermek mühimdir."
