 doctrine_spiritual_head_name:0 "Manevi"
 doctrine_spiritual_head_desc:0 "Bedeni dünya ve ruhani dünya birbirine benzemez. Bize rehberlik etmesi ve mezhebimizi bedeni tutkulardan koruması için ruhani dünya kendi liderine sahip olmalıdır."
 doctrine_parameter_spiritual_head_of_faith:0 "[head_of_faith|E] makamı önemli bir ruhban sınıfı üyesine verilir."
