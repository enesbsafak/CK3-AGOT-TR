 doctrine_polytheist_name: "Çok Tanrıcı"
 doctrine_polytheist_desc: "Kainat, kudretli ilahlar ve ruhlarla doludur. Bazen bir panteonda yerleşik bir tanrılar kümesi bulunur, bazense ruhani âlem sayısızdır, etrafımızdaki her şeye nüfuz eder ve hatta adı konmuş tanrılara bile sahip olmayabilir."
 unreformed_faith_doctrine_name:1 "Reform Edilmemiş"
 unreformed_faith_name:1 "ilke"
 unreformed_faith_doctrine_desc:1 "Reform edilmemiş bir mezhep düzenli bir ruhban sınıfına ve kökleşmiş meşru ilkelere sahip değil. Farklı toplulukların mezhepleri sözde aynı olsa da çok farklı dinî inançlara ve kurallara sahip olabilirler."
