 doctrine_clerical_succession_spiritual_fixed_appointment_desc:0 "[ROOT.Faith.BishopNeuterPlural|U] İlah'a hizmet eder ve onun temsilcisi olarak [ROOT.Faith.AltPriestTermPlural] tarafından atanan kişiler yaşamları boyunca görevlerine devam eder."
