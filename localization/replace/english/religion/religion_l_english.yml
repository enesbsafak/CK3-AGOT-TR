 is_islamic_faith_name:0 "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc:0 "Bu dünyada Peygamber'in tüm öğretilerine uymasalar da Allah'ın buyruklarına sandıklarından daha bağlı yaşayanlar var. Zamanla bu yarı müminler günahkâr alışkanlıklarını bırakıp Ümmet'in gerçek birer mensubu olabilir."
