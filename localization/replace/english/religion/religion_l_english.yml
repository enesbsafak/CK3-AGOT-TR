 adoptionist_school_name:0 "Adoptiyanist İnanç"
 special_doctrine_adoptionist_school_elipandic_doctrine_name:0 "Elipandusçu Ekol"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc:0 "Adoptiyanizm'in Kristoloji'deki ince ayrıntılara odaklanmayı seçen ekolu olan Elipandusçuluk, Teslis dogmasıyla arasındaki #EMP kesin#! farklılıkların önemini vurgular. İyice açıklanan karmaşık bir tanımlamanın, basit ama kötü gerekçekli bir tanımlamadan daha iyi olduğuna inanılır."
 special_doctrine_adoptionist_school_felicitous_doctrine_name:0 "Münasip Ekol"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc:0 "Münasipçi $adoptionist$ saflığın ötesinde uygulanabilirliğe inanır. Düşmancıl bir sistemi baltalamak için o sistemin içinde çalışmaları gerektiğini düşünürler. Onlara göre onurlu bir amaç uğrunda iğrenç yalanlar söylemek, kaba doğrulardan daha iyidir."
 special_doctrine_adoptionist_school_radical_doctrine_name:0 "Radikal Ekol"
 special_doctrine_adoptionist_school_radical_doctrine_desc:0 "Radikal $adoptionist_adherent_plural$, Baba'dan başka Tanrı tanımadıklarını, ölümlü vücudun kutsallığını reddettiklerini itiraf ederler ve kendilerinden başka $christianity_religion_adherent$ tanımazlar. Kilise kanonunun her bir harfini kabul etmeden İsa'ya inanmak dönekliktir."
 special_doctrine_is_christian_faith_name:0 "İsa'nın Öğretileri"
 is_christian_faith_name:0 "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc:0 "Bu dünyada İsa'nın öğretilerine uyup onun kutsallığına inanmayanlar var. Bunu yapmak dinimizde küfür olsa da yanlış yola sapmış ruhlara karşı hoşgörüşü olmalıyız çünkü onlar da bir gün gerçek inancı görüp anlayabilirler."
