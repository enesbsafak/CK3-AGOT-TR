 doctrine_monotheist_name: "Tek Tanrıcı"
 doctrine_monotheist_desc: "Yalnızca tek bir tanrıya tapılır. Diğer sözde 'tanrılar' en iyi ihtimalle boş putlar, en kötü ihtimalleyse inananları [ROOT.Faith.HighGodNamePossessive] sözünden saptırmak için kötü niyetli bir aldatıcının tuzaklarıdır.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
