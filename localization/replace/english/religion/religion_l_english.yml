 doctrine_parameter_temporal_head_of_faith_directed_holy_wars:1 "Mezhepte [great_holy_wars|E] varsa Mezhep Lideri savaşı yönetebilir ve savaş hedefini seçebilir."
 doctrine_temporal_head_desc:0 "Ruhani ve bedeni dünyalar doğası gereği birbiriyle bağlıdır. Tek bir dünya için iki lidere sahip olmak aptalcadır."
 doctrine_marriage_type_name:0 "Evlilik Türü"
 doctrine_monogamy_name:0 "Tek Eşli"
 doctrine_monogamy_desc:0 "Evlilik iki birey arasındaki kutsal bir bağdır. Aynı anda birden fazla kişiyle böyle bir bağa sahip olmaya çalışmak saygısızlık olur."
 doctrine_polygamy_name:0 "Çok Eşli"
 doctrine_polygamy_desc:0 "Evlilik kutsal bir birliktelik olduğuna göre birden fazla evlilik daha kutsaldır. Her evlilik yine de kendi içinde kutsal olmalıdır."
 doctrine_concubines_name:1 "Cariyeler"
 doctrine_concubines_desc:1 "Evlilik kutsal bir bağdır ama eşe önem verildiği sürece cariyelere de sahip olunabilir."
