 building_type_zigong_mines_01: "Ziliujing ve Gongjing Tuz Kuyuları"
 building_type_zigong_mines_01_desc: "Tuz çıkarımı bakımından sahip olduğu eşsiz avantajlar sayesinde bu bölge, binlerce yıl önce Shang Hanedanı günlerinden beri yerin derinliklerinden tuz çıkarılan bir merkez olmuştur. Bugün de ve öngörülebilir gelecekte de bölge ekonomisinin başlıca unsurlarından biri olmayı sürdürmektedir."
