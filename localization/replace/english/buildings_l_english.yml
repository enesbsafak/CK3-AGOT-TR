 building_holy_site_japanese_temple_01_desc: "Bu bölgedeki [holy_site|E], dindar ve adanmışların buluşma noktasıdır. Ana tapınak yapısının neredeyse yarısını oluşturan etkileyici bir çatı uzaktan bile görülebilir. İçeride, tek bir büyük salon gerektiği kadar çok dindar ziyaretçiyi ağırlayabilir."
