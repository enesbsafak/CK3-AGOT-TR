 building_type_lahur_bazaar_01: "$building_lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$building_lahur_bazaar_01_desc$"
 building_lahur_bazaar_01: "Lahur Çarşısı"
 building_lahur_bazaar_01_desc: "Lahur'un eski şehri, evlerle çevrili iki büyük pazarın etrafında kurulmuş ve uzun bir kerpiç duvarla kuşatılmıştır. Bu canlı pazar kümesi, kimsenin hatırlayamadığı kadar uzun süredir vızıldayan bir faaliyetle doludur ve muhtemelen daha nice nesiller boyunca da öyle kalacaktır."
 building_lahur_bazaar_02: "Lahur'un Yaygın Çarşısı"
 building_lahur_bazaar_02_desc: "Ticaret Lahur'dan, suyun nehir yatağından aktığı kadar doğal akar. Küme pazarları mallarla taşar ve tüccarlarının keskin bakışlarının ardında, şehrin destansı geçmişinin tüm bilgeliği gizlenmiş gibidir."
 building_type_hamadan_bazaar_01: "Hamadan Çarşısı"
 building_type_hamadan_bazaar_01_desc: "$building_hamadan_bazaar_01_desc$"
 building_hamadan_bazaar_01: "Hamadan Çarşısı"
 building_hamadan_bazaar_01_desc: "Kadim Med halkının merkez yurdu olan Hamadan, kil tabletler ve çivi yazılı kitabeler çağından beri ticaretin merkezidir. Yüzlerce nesil tüccar, Hamadan'ın ana çarşısındaki tezgâhlar arasında mallarını satmış ve zanaatını icra etmiştir."
 building_hamadan_bazaar_02: "Hamadan'ın Yaygın Çarşısı"
 building_hamadan_bazaar_02_desc: "Hamadan'ın büyük çarşısı hiç olmadığı kadar zenginleşir, uzun ve vakur tarihinde eşi görülmemiş bir servet ve hareketlilik düzeyine ulaşır."
 building_type_sunday_bazaar_01: "Pazar Günü Çarşısı"
 building_type_sunday_bazaar_01_desc: "$building_sunday_bazaar_01_desc$"
 building_sunday_bazaar_01: "Pazar Günü Çarşısı"
### TODO AGOT-CHANGED: building_sunday_bazaar_01_desc [AGOT: Some locals will tell you that before there was money, Kashgar already had the Sunday Bazaar. Walking between the stalls of the market, it certainly feels that way â€” it's impossible to imagine a time without this place. | TR: Bazı yerliler, paradan önce bile Kaşgar'da Pazar Günü Çarşısı vardı derler. Tezgâhların arasında yürürken gerçekten de öyle hissedilir — bu yerin olmadığı bir zamanı hayal etmek imkânsızdır.]
 building_sunday_bazaar_01_desc: "Some locals will tell you that before there was money, Kashgar already had the Sunday Bazaar. Walking between the stalls of the market, it certainly feels that way â€” it's impossible to imagine a time without this place."
 building_sunday_bazaar_02: "Yaygın Pazar Günü Çarşısı"
 building_sunday_bazaar_02_desc: "Kaşgar'ın büyük Pazar Günü Çarşısı zamanın başlangıcından beri sürmüş olabilir ama bugün hissedilen refah, kuşkusuz çağlar boyunca hatırlanacaktır."
 building_type_mount_fuji_01: "Fuji Dağı"
### TODO AGOT-CHANGED: building_type_mount_fuji_01_desc [AGOT: The lone, towering, snow-capped peak of Fujisan marks the passage into eastern Japan and is a sight famed throughout the islands, drawing travelers and pilgrims, and granting repose to all who gaze upon it. Among the most sacred ShintÅ mountains, Fuji is home to #EMP Konohanasakuya-hime#!, goddess of volcanoes, the cherry blossom, and life's ephemeral delicacy. | TR: Fuji-san'ın tek başına yükselen, karlı zirvesi doğu Japonya'ya geçişi işaret eder, adaların her yanında ün salmış bu manzara yolcuları ve hacıları çeker, ona bakan herkese huzur verir. En kutsal Şintō dağları arasında yer alan Fuji, volkanların, kiraz çiçeğinin ve hayatın geçici inceliğinin tanrıçası #EMP Konohanasakuya-hime#!'ye ev sahipliği yapar.]
 building_type_mount_fuji_01_desc: "The lone, towering, snow-capped peak of Fujisan marks the passage into eastern Japan and is a sight famed throughout the islands, drawing travelers and pilgrims, and granting repose to all who gaze upon it. Among the most sacred ShintÅ mountains, Fuji is home to #EMP Konohanasakuya-hime#!, goddess of volcanoes, the cherry blossom, and life's ephemeral delicacy."
 building_mount_fuji_01: "$building_type_mount_fuji_01$"
 building_mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 building_type_waterworks_01: "Su Yönetimi"
 building_type_waterworks_01_desc: "Su, tüm yaşamın dayandığı temeldir. İstikrarlı bir su arzını sürdürmek ve onu etkin kullanmak, güçlü bir ülke ve güçlü bir saltanat için elzemdir."
 building_waterworks_01: "Yapay Göletler"
 building_waterworks_01_desc: "Suyu yönetmenin ilk adımı, yönetecek suya sahip olmaktır. Kil ile kaplanıp su tutması sağlanan basit bir çukur, suyun birikip daha sonra kullanılabileceği doğal bir birikim noktası oluşturur."
 building_waterworks_02: "Sarnıçlar"
 building_waterworks_02_desc: "Daha derin çukurlar, daha geçirimsiz kaplamalar ve basit çatılar, daha fazla suyun daha uzun süre saklanmasını sağlar ve kirlilik ya da buharlaşma kaynaklı kaybı azaltır."
 building_waterworks_03: "Düz Kanal Hatları"
 building_waterworks_03_desc: "Depolama alanları arasında kanallar kazmak, yönetilen suyu daha fazla insan için çok daha erişilebilir kılar. Su aşırı bol olduğunda taşkın riskini azaltır, kuraklıkta ise insanlara, hayvanlara ve ekinlere su sağlar. Doğru planlanırsa, hafif tekne trafiği için bile kullanılabilir."
 building_waterworks_04: "Sulama Havuzları"
 building_waterworks_04_desc: "Her türlü tepe, sırt ya da yükseklik değişimi, doğru setler kazıldığında su depolama alanına dönüştürülebilir. Kanallarla birbirine bağlanan bu açık su havuzları birbirini besleyerek, ne kadar suyun depolandığı ve ne kadarının kullanıldığı üzerinde daha büyük kontrol sağlar."
 building_waterworks_05: "Basamaklı Kuyular"
 building_waterworks_05_desc: "Su kontrolü, temel kuyu kazımıyla birleşerek, yerin içine oyulmuş ve her zaman toprağın bağrından bir miktar su alan muazzam yapılar oluşturabilir. Bu yeraltı yapıları, ihtiyaç oldukça daha fazla su besleyen veya suyu başka alanlara çeken yüzey savakları ve kanallarla hâlâ bağlanabilir."
 building_waterworks_06: "Kanal Kilitleri"
 building_waterworks_06_desc: "Kanaldaki suyun derinliği kapılar ve tahliyele noktaları aracılığıyla kontrol edilebilir. Bu kilitlerin gerisinde biriken su, kanalları mavna ve küçük gemiler için elverişli su yollarına dönüştürerek taşımacılıkta mükemmel kılar."
 building_waterworks_07: "Yapay Göller"
 building_waterworks_07_desc: "Anıtsal bir rezervuar, hatrı sayılır miktarda su tutabilir. Nehirler ve kanallarla beslenen yapay göller, geniş tarım alanlarına ve sayısız köye su sağlayabilir. İhtişamları sayesinde kendi başlarına da prestijli mekânlar olur, ibadet ve yönetim için etkili alanlara dönüşür."
 building_waterworks_08: "Şebeke ve Kanalizasyon Sistemleri"
 building_waterworks_08_desc: "Boru ve pompalarla su yukarı veya aşağı akabilir, en yüksek kulelere su verir ve atıkları en uzak fosseptiklere taşır. Hiçbir yer susuz kalmaz, fazlalık su ise tehlikeli bir sele dönüşmeden boşaltılabilir."
 building_type_spice_plantation_01: "Baharat Plantasyonları"
 building_type_spice_plantation_01_desc: "En güzel kokular ve en narin tatlar, yalnızca dünyanın çok belirli bölgelerinde yetişen bitkilerden elde edilebilir. Nadirlikleri ve kaliteleri, eğer toprak onları besleyebiliyorsa, üretimlerini olağanüstü kârlı kılar."
 building_spice_plantation_01: "Baharat Toplayıcılığı"
 building_spice_plantation_01_desc: "Baharatlar çeşitli ağaçlar, çalılar ve çiçekler tarafından doğal olarak üretilir. İşin püf noktası, önce o bitkileri #italic bulmaktır#!."
 building_spice_plantation_02: "Yetiştirilen Baharat Korulukları"
 building_spice_plantation_02_desc: "En çok talep gören baharatlar, doğru koşullarda, doğru emekle ve doğru nezaretçilerle yetiştirilebilir."
 building_spice_plantation_03: "Baharat Bahçeleri"
 building_spice_plantation_03_desc: "Geniş bir alanda geometrik bir yöntemle ekim yapmak, yıldan yıla çok daha öngörülebilir miktarda baharat üretir."
 building_spice_plantation_04: "Baharat Kurutma Alanları"
 building_spice_plantation_04_desc: "Mahsul bozulmadan önce daha fazlasının işlenebilmesi için, ürünlerin yakınında baharat kurutmaya alan ayırmak, genel üretim maliyetlerini düşürerek para kazandırır."
 building_spice_plantation_05: "Baharat Değirmenleri"
 building_spice_plantation_05_desc: "Öğütmek baharatın daha çabuk bozulmasına yol açabilir ama depolamayı da çok daha verimli kılar. Değirmenler ayrıca ayıklama işlemine yardımcı olarak daha saf bir ürün elde edilmesini sağlar."
 building_spice_plantation_06: "Baharat Mülkleri"
 building_spice_plantation_06_desc: "İşçi barınaklarını, ürün işlemeyi ve depolamayı, baharatların yetiştiği yere yakın tek bir alanda toplamak, daha az masrafla daha fazla baharat üretip satmayı büyük ölçüde kolaylaştırır."
 building_spice_plantation_07: "Plantasyon Arazi Yönetimi"
 building_spice_plantation_07_desc: "Toprak bizzat yeniden şekillendirilerek mahsul için daha fazla alan açılabilir. Teraslar ve kanallar, daha çok ekin için yeni fırsatlar yaratır."
 building_spice_plantation_08: "Endüstriyel Baharat Üretimi"
 building_spice_plantation_08_desc: "Doğru yönlendirmeyle tüm arazi en kârlı baharatların üretimine adanabilir. Dikilen her ağaç, yetiştirilen her çalı, toplanan her yaprak ve kurutulan her tohum, hazinede bir başka sikke daha demektir."
 building_type_examination_hall_01: "Sınav Salonu"
 building_type_examination_hall_01_desc: "İmparatorluk sınavları, yapılacak bir yer olmadan yapılamaz. Yerel valinin görevi, görevlilerin sınavları düzgün yürütmek için ihtiyaç duyduğu tüm kaynaklara sahip olmasını sağlamak ve sınava girenlerin kopya ihtimalini en aza indirirken onlara gerekli desteği vermektir."
 building_examination_hall_01: "Sınav Odaları"
 building_examination_hall_01_desc: "Devlet görevleri için adayları sınamak adına bir sınav yapılacak yer gerekir. Sınava ayrılmış bir oda asgarî düzeyde şarttır ama bu daha bir başlangıç."
 building_examination_hall_02: "Wenwu Tapınağı"
 building_examination_hall_02_desc: "Küçük bir dua, bazı adaylara dünyanın tüm çalışmasından ve hazırlığından daha fazla güven verebilir."
 building_examination_hall_03: "İmparatorluk Akademisi"
 building_examination_hall_03_desc: "Derslikler, sınav tesisleri, öğretim kadrosu odaları ve depoların oluşturduğu bir kompleks, imparatorluk sınavının her bir bölümünü azamî verim ve kaliteyle yürütmek için gereken kapsamlı desteği sağlar."
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "Bu [holding|E] içinde düzenlenen [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName] ve [GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName] [Concept('activities', 'Etkinlikleri')|E] için maliyet azaltımı: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
