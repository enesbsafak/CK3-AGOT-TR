 building_type_fengtian_mines_01: "Fengtian Yeşim Madenleri"
 building_type_fengtian_mines_01_desc: "Adanın orta kesimlerindeki yükseltiler boyunca uzanan Fengtian Yeşim Madenleri, değerli taşların deniz aşırı ticaretini kolaylaştırır. Yetkililer, yerliler ve uzak diyarlardan gelen tüccarlarca tercih edilen bu ışıl ışıl yeşil yeşim, kontluğun gelirinde özel bir yere sahiptir."
