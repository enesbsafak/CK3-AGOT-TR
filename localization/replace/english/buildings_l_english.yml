### TODO AGOT-CHANGED: building_heian_palace_01_desc [AGOT: Built by Emperor Kanmu as the centerpiece of his great city of Heian-kyÅ, or 'Peace Capital', the sprawling palace complex houses the imperial court, residence, and the central bureaucratic offices of Japan. Its corridors are bustling hubs of ceremony, politics, and intrigue, where ancient aristocratic families vie for influence. | TR: İmparator Kanmu tarafından büyük Heian-kyō şehrinin, yani 'Barış Başkenti'nin merkez taşı olarak inşa edilen bu geniş saray kompleksi, imparatorluk sarayını, ikametgâhı ve Japonya'nın merkez bürokratik dairelerini barındırır. Koridorları tören, siyaset ve entrikanın kaynaştığı merkezlerdir, kadim aristokrat aileler nüfuz için burada mücadele eder.]
