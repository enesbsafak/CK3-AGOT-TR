 building_white_deer_grotto_academy_01: "Beyaz Geyik Mağarası Akademisi"
 building_white_deer_grotto_academy_01_desc: "Beyaz geyiklerin özgürce dolaştığı bu yerde, münzevi Li Bo tarafından kurulan akademi, Yeni-Konfüçyusçuluğun bir merkezi olarak serpilip gelişti."
 building_type_shigu_academy_01: "$building_shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$building_shigu_academy_01_desc$"
 building_shigu_academy_01: "Shigu Akademisi"
 building_shigu_academy_01_desc: "Bu akademi, Hunan'ın sakin tepelerinde Klasikleri inceleyen âlimleri kendine çekti. Şiir ve felsefenin odağı olarak Tang geleneklerini Song'a taşıdı."
 building_type_culai_academy_01: "$building_culai_academy_01$"
 building_type_culai_academy_01_desc: "$building_culai_academy_01_desc$"
 building_culai_academy_01: "Culai Akademisi"
 building_culai_academy_01_desc: "Âlimler, Konfüçyus metinlerini inzivada çalışmak için Culai Dağı'nın zirveleri arasında bir akademi kurdu. Salonlarında doğa ile yönetimi uyumlaştırmaya dair münazaralar yankılanırdı."
 building_type_lize_academy_01: "$building_lize_academy_01$"
 building_type_lize_academy_01_desc: "$building_lize_academy_01_desc$"
 building_lize_academy_01: "Lize Akademisi"
 building_lize_academy_01_desc: "Lize Akademisi, Hebei'nin suları ve sazlıkları arasında ilmi teşvik eder, değişen sınırlar ortasında Konfüçyus düzeninin kuzeydeki kalesi gibi hizmet verir."
 building_type_maoshan_academy_01: "$building_maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$building_maoshan_academy_01_desc$"
 building_maoshan_academy_01: "Maoshan Akademisi"
 building_maoshan_academy_01_desc: "Ritüel, meditasyon ve kutsal metinler üzerine eğitim veren bir akademi, Song dönemi Konfüçyus akademilerine manevi bir karşı denge oluşturur."
 building_type_tiantai_monasteries_01: "$building_tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc: "$building_tiantai_monasteries_01_desc$"
 building_tiantai_monasteries_01: "Tiantai Manastırları"
 building_tiantai_monasteries_01_desc: "Tiantai ekolünün ilmî kurumu olan bu akademi, felsefe ve meditasyon öğretiminde uzmanlaşmıştır."
 building_type_jizu_shan_temples_01: "$building_jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc: "$building_jizu_shan_temples_01_desc$"
 building_jizu_shan_temples_01: "Jizu Shan Tapınakları"
 building_jizu_shan_temples_01_desc: "Bu Budist dağ manastırı kompleksi, Ezoterik Budizmin bir kalesi olarak hizmet etti. Hacılar burayı Hindistan'daki Akbaba Zirvesi'ne benzetirdi."
 building_type_nanhua_temple_01: "$building_nanhua_temple_01$"
 building_type_nanhua_temple_01_desc: "$building_nanhua_temple_01_desc$"
 building_nanhua_temple_01: "Nanhua Tapınağı"
 building_nanhua_temple_01_desc: "Chan Budizminin Altıncı Patriği Huineng'in makamı. Günümüzde de Chan öğretileri için canlı bir merkez olmayı sürdürür."
 building_type_byeokran_port_01: "$building_byeokran_port_01$"
 building_type_byeokran_port_01_desc: "$building_byeokran_port_01_desc$"
 building_byeokran_port_01: "Byeokran Limanı" # 碧瀾渡 (벽란도)
 building_byeokran_port_01_desc: "Gaeseong şehrinin hemen batısında, Ryeseong nehrinin ağzında yer alan Byeokran limanı, kuzey sınırlarını ve dağ sıralarını dolaşarak, yabancı malların ve yolcuların Kore yarımadasına girmesi için en doğrudan güzergâhtır."
 building_type_sado_mines_01: "$building_sado_mines_02$" # 佐渡金山
 building_type_sado_mines_01_desc: "$building_sado_mines_01_desc$"
 building_sado_mines_01: "Sado Altın Çukurları"
 building_sado_mines_01_desc: "Eski bir sürgün yeri olan Sado'nun uzak adasının, yüzeyinin altında böylesine bir altın zenginliğini gizlice saklıyor olabileceğini pek az kişi tahmin ederdi."
 building_sado_mines_02: "Sado Altın Madeni"
 building_sado_mines_02_desc: "Maden çukurları genişletildi ve altın çıkarımını gerçekten artırabilmek için mühendisler getirildi."
 building_sado_mines_03: "Büyük Sado Altın Madeni"
 building_sado_mines_03_desc: "Bu köy, sayısız maden çukurunun etrafında yeşerdi ve işçiler düzenli olarak yeni altın damarları buluyor."
 building_sado_mines_04: "Sado Altın Madenciliği Kompleksi"
 building_sado_mines_04_desc: "Altın çıkarımı neredeyse endüstriyel bir ölçeğe ulaştı, işçi sayısı artık binlerle ifade ediliyor. Bitmez tükenmez zenginlikler sanki madenlerden akıyor."
