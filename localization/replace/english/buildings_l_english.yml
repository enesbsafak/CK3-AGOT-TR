 building_citadel_thang_long_01: "Äai La Citadel"
 building_citadel_thang_long_01_desc: "Yerel ordular için askerî bir üs olarak hizmet veren ve istilacıları püskürtmeye yardımcı olmak için güçlü biçimde tahkim edilmiş bir iç kale."
### TODO AGOT-CHANGED: building_citadel_thang_long_02 [AGOT: Imperial Citadel of ThÄƒng Long | TR: Thăng Long İmparatorluk İç Kalesi]
 building_citadel_thang_long_02: "Imperial Citadel of ThÄƒng Long" # æ˜‡é¾
 building_citadel_thang_long_02_desc: "İmparatorluk İç Kalesi hem bir kale hem de kraliyet ikametgâhı görevi görür. Kale kompleksi, ana tahkimat bölgesi, imparatorluk şehri ve Yasak Şehir olmak üzere üç bölümden oluşur."
 building_type_po_klong_garai_01: "$building_po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$building_po_klong_garai_01_desc$"
 building_po_klong_garai_01: "Po Klong Garai Tapınağı"
 building_po_klong_garai_01_desc: "Cham mimarisinin zirvelerinden biri olan Po Klong Garai tapınağının, aynı adı taşıyan efsanevi kralı onurlandırmak için inşa edildiği söylenir. Üç ayrı tuğla kuleden oluşur ve başlıca sanat eseri olarak Tanrı Şiva'nın etkileyici bir heykeline sahiptir."
 building_type_dau_temple_01: "$building_dau_temple_01$"
 building_type_dau_temple_01_desc: "$building_dau_temple_01_desc$"
### TODO AGOT-CHANGED: building_dau_temple_01 [AGOT: DÃ¢u Temple | TR: Dâu Tapınağı]
 building_dau_temple_01: "DÃ¢u Temple"
