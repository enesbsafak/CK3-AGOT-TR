 building_type_powder_magazine_01: "Barut İmalathanesi"
 building_type_powder_magazine_01_desc: "Barutun işlevsel kalabilmesi için özel üretim, depolama ve bakım gerekir. [GetMaA('handgunners').GetName] ve bu güçlü kuvvete ihtiyaç duyan diğer birlikleri toplayabilmek için, ihtisaslaşmış binalar inşa edilmelidir."
 building_powder_magazine_01: "Barut Deposu"
 building_powder_magazine_01_desc: "Kazaları en aza indirmek için barutu dış etkenlerden güvenle koruyabilecek şekilde depolar."
 building_powder_magazine_02: "Barut Lojistik Bürosu"
 building_powder_magazine_02_desc: "Barutun karmaşık lojistiğini yürütecek bir iş gücünü denetleyebilen görevlilerin işe alınmasını, barutun doğru şekilde depolanmasını ve ülke genelinde sorunsuz biçimde taşınmasını sağlar."
 building_powder_magazine_03: "Kükürt Madeni"
 building_powder_magazine_03_desc: "Kimi zaman 'yanartaş' da denilen kükürt bol bulunur, ancak yüksek miktarlarda üretmek zor olabilir. Adanmış bir maden, bu kıymetli mineralin düzenli tedarikini garanti eder."
 building_powder_magazine_04: "Güherçile Atölyesi"
 building_powder_magazine_04_desc: "Barut yapımının kilit bileşeni olan güherçile, tüm binayı yakıp kül etmeden yüksek miktarda üretilebilmesi için kontrollü bir ortamda usta eller gerektirir."
 building_powder_magazine_05: "Barut Mahzenleri"
 building_powder_magazine_05_desc: "Barutu depolamak, güçlendirilmiş duvarlara sahip ve yerleşimlerden ve değerli alanlardan güvenle uzak konumlandırılmış özel binalar gerektirir."
 building_powder_magazine_06: "Karakol"
 building_powder_magazine_06_desc: "Barut kendi başına tehlikelidir, ancak yanlış ellere geçerse çok daha da tehlikeli hâle gelebilir. Artık barutu meraklı gözlerden korumak için çok sayıda muhafız istihdam edilmelidir."
 building_powder_magazine_07: "Barut Arıtma Atölyesi"
 building_powder_magazine_07_desc: "Farklı bileşenlerin birleştirilerek baruta dönüştürüldüğü ayrı bir bina. Bir kaza yaşanırsa, umarız artık tüm tesisi yerle bir etmez."
 building_powder_magazine_08: "El Topu Tesisi"
 building_powder_magazine_08_desc: "El topları güvenilmez olabilir ve kullanım sırasında çatlayabilir. Bu yüzden mümkün olan en iyi teçhizatı temin etmeli ve de en yüksek kalitede silahlar üretmek için bulunabilecek en yetkin ustaları tutmalıyız."
 building_type_mandala_capital_01: "Başkent Tapınak Kompleksi"
 building_type_mandala_capital_01_desc: "Bu [great_project|E] yalnızca bir tapınak değil. Bu, metanetimizin bir kanıtı. Başarılarımızın. #EMP ihtişamımızın#!. Böyle bir tapınak, ilahi ve kudretli Devaraja'mızın yönetimini ve iyiliğini simgeler."
 building_mandala_capital_01: "Süslü Tapınak"
 building_mandala_capital_01_desc: "Büyük bir mirasın mütevazı başlangıcı, bu süslü tapınak, hüküm süren Devaraja'ya ibadet ve dua etmek için bir yerdir."
 building_mandala_capital_02: "Heybetli Tapınak"
 building_mandala_capital_02_desc: "İlk tapınak binasını geliştirerek, başkent tapınağı ek mabetler, döşemeler ve süslemelerle genişletilmiştir."
 building_mandala_capital_03: "Tapınak Arazisi"
 building_mandala_capital_03_desc: "Tapınağı filizlenen bir tapınak arazisine dönüştürmek için daha fazla konaklama eklendi.\nArtık ibadet için çeşitli mabetlerin yanı sıra, ibadet edenler, hizmetkârlar ve ruhban sınıfı için de sığınacak yer barındırıyor."
 building_mandala_capital_04: "Büyük Tapınak Kompleksi"
 building_mandala_capital_04_desc: "Tapınak kompleksi artık küçük bir köy büyüklüğüne ulaştı ve çoğu ihtiyacında büyük ölçüde kendi kendine yeter hâle geldi.\nKüçük bir kutsal emanet mahfazası ve doğudan batıya uzanan yansıma havuzları eklendi, bu da ruhlar âlemiyle bağı daha da güçlendirdi."
 building_mandala_capital_05: "İlahi Tapınak Sarayı"
### TODO AGOT-CHANGED: building_mandala_capital_05_desc [AGOT: A rarely seen architectural gem, the temple palace has been expanded with magnificent lodgings for the divine Devaraja.\nMonuments, relics, treasures â€” travelers come from all over to marvel at the excess of this divine temple palace. | TR: Nadiren görülen bir mimari mücevher, tapınak sarayı, ilahi Devaraja için görkemli konaklamalarla genişletilmiştir.\nAnıtlar, kutsal emanetler, hazineler — gezginler bu ilahi tapınak sarayının ihtişamını görmek için her yerden gelir.]
 building_mandala_capital_05_desc: "A rarely seen architectural gem, the temple palace has been expanded with magnificent lodgings for the divine Devaraja.\nMonuments, relics, treasures â€” travelers come from all over to marvel at the excess of this divine temple palace."
 building_type_wulingyuan_01: "$building_wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$building_wulingyuan_01_desc$"
 building_wulingyuan_01: "Wulingyuan"
 building_wulingyuan_01_desc: "Bu dağlar, yerden göğe yükselen binlerce heybetli kumtaşı sütunuyla doludur. Sütunlar en çarpıcı özellik olsa da bölge, yarık vadiler, dereler, küçük göller ve mağaralarla da bezeli."
 building_type_leshan_giant_buddha_01: "$building_leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$building_leshan_giant_buddha_01_desc$"
 building_leshan_giant_buddha_01: "Leshan Dev Buda"
 building_leshan_giant_buddha_01_desc: "Bir uçurumun yamacına oyulmuş bu Buda heykeli, Min ve Dadu nehirlerinin birleştiği yere bakar, yolculuklarında yorgun düşen gezginleri selamlar."
 building_type_yungang_grottoes_01: "$building_yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$building_yungang_grottoes_01_desc$"
 building_yungang_grottoes_01: "Yungang Mağaraları"
 building_yungang_grottoes_01_desc: "Birkaç düzine büyük mağara ve yüzlerce küçük oyuğu barındıran devasa bir mağara tapınak kompleksi. Mağaralar, binlerce ve binlerce Buda heykeliyle doludur."
 building_type_wudang_mountain_temples_01: "$building_wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$building_wudang_mountain_temples_01_desc$"
 building_wudang_mountain_temples_01: "Wudang Dağı Tapınakları"
 building_wudang_mountain_temples_01_desc: "Wudang dağları, Taoizm için kutsal kabul edilen birkaç dağdan biridir. Ayrıca tai chi uygulamalarıyla ünlenen büyük bir tapınak kompleksine de ev sahipliği yapar."
 building_type_shaolin_monastery_01: "$building_shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$building_shaolin_monastery_01_desc$"
 building_shaolin_monastery_01: "Shaolin Manastırı"
 building_shaolin_monastery_01_desc: "Shaolin Manastırı, Shaolin kung fu'nun doğum yeri olması ve dövüş sanatlarında çok yetkin keşişler yetiştirmesiyle ünlüdür. Ancak aynı zamanda bir öğrenim ve çalışma yeridir, Budist metinlerin çevrildiği önemli bir merkezdir."
 building_type_lingyin_temple_01: "$building_lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$building_lingyin_temple_01_desc$"
 building_lingyin_temple_01: "Lingyin Tapınağı"
 building_lingyin_temple_01_desc: "Lingyin Tapınağı, 328 yılında Budizmi yaymak için Hintli bir keşiş ve hacı tarafından kurulmuştur. O günden beri tapınak muazzam ölçüde büyümüştür. Birçok pavyonu, çok sayıda mağara tapınağı ve pagodası vardır, binlerce keşişi barındırabilecek kadar yatakhaneye sahiptir."
 building_type_giant_wild_goose_pagoda_01: "$building_giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$building_giant_wild_goose_pagoda_01_desc$"
 building_giant_wild_goose_pagoda_01: "Büyük Yaban Kazı Pagodası"
 building_giant_wild_goose_pagoda_01_desc: "Büyük Yaban Kazı Pagodası ilk olarak 652 yılında metinleri, oymaları ve çeşitli figürleri saklayıp korumak için inşa edilmiştir. Daha sonra on katlı görkemli bir yapı olacak şekilde yeniden yapıldı, ancak çeşitli yeniden inşa ve onarımlar onu yedi kata düşürdü."
 building_type_kaifeng_palace_01: "$building_kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$building_kaifeng_palace_01_desc$"
 building_kaifeng_palace_01: "Kaifeng İmparatorluk Sarayı"
 building_kaifeng_palace_01_desc: "Kaifeng'deki imparatorluk sarayı, Song hanedanı başkentini bu şehre taşıdığında inşa edildi. Bu duvarların içinde güçlü ve etkin bir yönetim hüküm sürer, şehrin ve ülkenin bütünüyle refahını güvenceye alır."
 kaifeng_examination_cost_bonus_desc: "Bu [barony|E] [realm_capital|E] iken [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] [activity|E] maliyeti: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuilding('kaifeng_palace_01').GetName]"
 building_type_forbidden_city_01: "$building_forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$building_forbidden_city_01_desc$"
 building_forbidden_city_01: "Yasak Şehir"
 building_forbidden_city_01_desc: "Yasak Şehir, neredeyse bin ayrı binadan oluşan devasa bir imparatorluk sarayıdır. Tüm yerleşke yüksek bir duvar ve derin bir hendekle çevrilidir, yönetimi ve içeride durmaksızın çalışan sayısız görevliyi korur."
 beijing_palace_bonus_desc: "Bu [barony|E] [realm_capital|E] iken [governors|E] için [governor_efficiency|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('forbidden_city_bonus_value')]%#!"
 building_type_qianling_mausoleum_01: "$building_qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$building_qianling_mausoleum_01_desc$"
 building_qianling_mausoleum_01: "Qianling Mozolesi"
 building_qianling_mausoleum_01_desc: "Qianling Mozolesi, başlıca İmparator Gaozong ile İmparatoriçe Wu Zetian'ın mezarıdır, ancak Li ailesinin başka üyeleri de burada gömülüdür. Mezar tümseği, dikdörtgen bir duvarla ve çevreyi süsleyen çok sayıdaki taş heykelle korunur, bu heykeller mozolenin en ayırt edici unsurlarındandır."
 building_type_quanzhou_seaport_01: "$building_quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$building_quanzhou_seaport_01_desc$"
 building_quanzhou_seaport_01: "Quanzhou Deniz Limanı"
 building_quanzhou_seaport_01_desc: "Quanzhou limanı, uzak diyarlardan yabancı tüccarları kendine çeker. Arabistan'dan Anadolu'ya, Japonya'dan Kore'ye ve aradaki her yerden gemiler gelir. Bu ticaret gemisi akını yerel sanayilerin canlanmasını sağlar ve Quanzhou'yu bölgenin başlıca gemi inşa merkezi yapar."
 building_type_angkor_wat_01: "$building_angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$building_angkor_wat_01_desc$"
 building_angkor_wat_01: "Angkor Wat"
 building_angkor_wat_01_desc: "Angkor Wat, Vişnu'ya adanmış devasa bir tapınak kompleksidir. Hindu mitolojisinde tanrıların evi olan Meru Dağı'nı temsil edecek şekilde tasarlanmıştır. Yerleşke görkemli bir hendekle çevrilidir ve dini sanat, heykeller ve kabartmalarla taşan, galerili çok sayıda tapınak barındırır."
