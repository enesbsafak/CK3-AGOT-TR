 building_type_holy_site_great_mosque_of_samarra_01:0 "Samarra Ulu Camii"
 building_type_holy_site_great_mosque_of_samarra_01_desc:0 "Samarra Ulu Camii, Samarra'dan hüküm süren Abbâsî Halifesi Mütevekkil tarafından 851 yılında inşa edilmiştir. Büyüleyici bir sarmal minare olan Malviya Minaresi yapının en önemli özelliğidir." #krutygetarts
