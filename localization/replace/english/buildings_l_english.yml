### TODO AGOT-CHANGED: building_type_capital_bureau_01_desc [AGOT: A dedicated branch of government, which devotes all of its resources to manage the capital. A throng of clerks and servicemen resides within these walls, ready to serve at the jovÄ“nnio's command. | TR: Tüm kaynaklarını başkenti yönetmeye adayan özel bir devlet kurumu. Bu duvarların içinde, eparkın emirlerini hazır şekilde bekleyen bir kalabalık memur ve hizmetli grubu bulunur.]
 building_type_capital_bureau_01_desc: "A dedicated branch of government, which devotes all of its resources to manage the capital. A throng of clerks and servicemen resides within these walls, ready to serve at the jovÄ“nnio's command."
 building_capital_bureau_01: "Adliye"
 building_capital_bureau_01_desc: "Bir şehrin gelişip büyümesini sağlayan şey kanunlardır ve kanunlar ancak mahkemelerde uygulanabilir."
 building_capital_bureau_02: "Güvenlik Bürosu"
 building_capital_bureau_02_desc: "Bu büronun bünyesinde çalışan geniş bir polis gücü, şehri suçlulardan korur ve kanun kaçaklarını yakalar."
 building_capital_bureau_03: "İtfaiye Karargâhı"
 building_capital_bureau_03_desc: "Yangınlar, yoğun nüfuslu herhangi bir bölge için sürekli bir tehdittir. İyi eğitilmiş bir itfaiye ekibi, yangını yayılmadan söndürebilir."
 building_capital_bureau_04: "Lonca Yönetimi"
 building_capital_bureau_04_desc: "Şehirdeki birçok loncaya nezaret edecek yetkililerin atanması, her loncaların verimli çalışmasını, kaliteyi korumasını ve tüm gerekli prosedürlere uymasını sağlayacaktır."
 building_capital_bureau_05: "Yargı Dairesi"
 building_capital_bureau_05_desc: "Büyüyen ve genişleyen bir şehirde adli işlerin düzenlenmesi için genişletilmiş bir yargı dairesi şarttır. Kanun ve düzeni sağlamak için çalışan sayısız memur, kâtip ve yargıç bulunur."
 building_capital_bureau_06: "Şehir Hapishanesi"
 building_capital_bureau_06_desc: "Şehir genelinde küçük hapishaneler olabilir, ancak daha büyük bir cezaevi yasaları çiğneyen herkes için hazır bir hücrenin bulunmasını sağlar."
 building_capital_bureau_07: "Ticaret Odası"
 building_capital_bureau_07_desc: "Ticaret, yasalarla daha iyi düzenlenmesi gereken son derece kârlı bir iştir. Şehre giren malları ve vergileri denetleyerek başkentin kaynaklarını daha verimli yönetebilir ve belki de fazladan altın kazanabiliriz."
 building_capital_bureau_08: "Şehir Sarayı"
 building_capital_bureau_08_desc: "Çoğu sarayı gölgede bırakacak kadar büyük ve ihtişamlı bir konut, yöneticilerin her zaman yakında ve ulaşılabilir olmasını sağlar. Zira bir şehir asla tam anlamıyla uyumaz, ancak yöneticisi uyuyabilir."
 capital_bureau_custom_effect_desc: "#low Açar:#!\n[GetCourtPositionType('eparch_court_position').GetName()] [Concept('court_position', 'Saray Pozisyonunun')|E] [Concept('aptitude', 'Yatkınlığını')|E] arttırır"
 building_type_breweries_01: "Biracılık"
 building_type_breweries_01_desc: "Bu bina, çeşitli tür bira ile diğer fermente içeceklerin mayalanması ve depolanması için kullanılır. Yerel kültür ve ekonomide çok önemli bir rol oynamaktadır."
 building_breweries_01: "Bira Evi"
 building_breweries_01_desc: "Bira üretim sürecinin kalbi. Burada malzemeler karıştırılır, kaynatılır ve mayalanma için hazırlanır."
 building_breweries_02: "Mahzenler"
 building_breweries_02_desc: "Mayalanmış içkilerin yıllandırılmak üzere saklandığı, istenen tat ve niteliklerin oluşmasını sağlayan serin ve karanlık bir yer."
 building_breweries_03: "Üretim Fıçıları"
 building_breweries_03_desc: "Bira üretim sürecinde kritik bir adım olan şıranın kaynatıldığı, tat ve aroma vermek için çeşitli bitkilerin veya şerbetçiotunun eklendiği büyük fıçılar."
 building_breweries_04: "Tahıl Ambarı"
 building_breweries_04_desc: "Büyük miktarda tahılın haşeresiz ve kuru bir şekilde saklanmasına yarayan, bira yapımı için sürekli malzeme tedariki sağlayan bir ambar."
 building_breweries_05: "Kuyu Evi"
 building_breweries_05_desc: "Yüksek kaliteli mayalanma için gerekli olan temiz ve güvenilir bir su kaynağı sağlayan kuyu."
 building_breweries_06: "Fıçı Odası"
 building_breweries_06_desc: "Mayalanmış biranın fıçılarda özenle saklandığı, uygun şekilde mühürlendiği ve dağıtıma hazır hâle getirildiği bir alan."
 building_breweries_07: "Fıçılama Odası"
 building_breweries_07_desc: "Devasa fıçılardaki biranın küçük fıçılara aktarıldığı özel bir alan. Bunlar hanlar ve tavernalar tarafından tercih edilir."
 building_breweries_08: "Tadım Salonu"
 building_breweries_08_desc: "Bira üretenlerin ve konukların hem farklı hem de en yeni biraların tadını çıkarabilecekleri bir salon."
 brewery_effect_desc: "#low Açar:#!\n[court_position|E]: [GetCourtPositionType('court_brewmaster_court_position').GetName()]"
 building_type_oath_warriors_building_01: "Askerî Tahsisler"
 building_type_oath_warriors_building_01_desc: "Bu toprakların hükümdarı, Taç Giyme Töreninde savaşçıları gözetmeye yemin etmiştir."
 building_oath_warriors_building_01: "Gazilerin Küçük Tımarları"
 building_oath_warriors_building_01_desc: "Uzun hizmet görmüş aristokrat savaşçılara cömert yerel araziler verildi, bu durum bölge halkını sadakatle ülkeye hizmet etmeye teşvik etti."
 building_oath_warriors_building_02: "Askerî Malikâneler"
 building_oath_warriors_building_02_desc: "Muharebe meydanında ölmeme başarısı göstermiş aristokrasi mensubu savaşçılar refah içinde yaşarlar, kendilerine bağışlanan mülkler, bolca asker toplamalarına ve teçhizatlanmalarına imkân verir."
 building_oath_warriors_building_03: "Köy Tımarları"
 building_oath_warriors_building_03_desc: "Pek çok yerel köy, şövalye zabitlere şahsî mülk olarak tahsis edilmiş, bu da diğer sınıfların aleyhine güç ve servet toplamalarına imkân tanır."
 building_oath_warriors_building_04: "Geniş Askerî Mülkler"
 building_oath_warriors_building_04_desc: "Yerel vergilerin hatırı sayılır bir payı, tarlanın da yerleşimin de sahibi olan küçük savaşçı aristokratlara aktarılır, onların kudretli maiyetleri yine de hizmettedir."
 building_type_oath_faithful_building_01: "Dînî Anıtlar"
 building_type_oath_faithful_building_01_desc: "Bu toprakların hükümdarı, Taç Giyme Töreninde inançlıları gözetmeye yemin etmiştir."
 building_oath_faithful_building_01: "Yol Kenarı Sunakları"
 building_oath_faithful_building_01_desc: "Yol kıyılarındaki küçük sunaklarda, sade kutsal ikonlar yer alır."
 building_oath_faithful_building_02: "Mukaddes Kapılar"
 building_oath_faithful_building_02_desc: "Bu yerleşimin girişleri üzerine ve dört bir dînî eserler işlenmiş, bu eserler insanlara huşû telkin eder ve emniyetli geçit vadeder."
 building_oath_faithful_building_03: "Mabet Sığınakları"
 building_oath_faithful_building_03_desc: "Yerel mabet külliyeleri, tatlı su kuyularını barındıran kemerli bahçeler ve sükûnet dolu mekânlarla genişletilmiştir."
 building_oath_faithful_building_04: "Devasa Meydanlar"
 building_oath_faithful_building_04_desc: "Dînî eserlerle dolup taşan, israf ve tefecilikten arındırılan ve halka su sağlayan muazzam merkezî meydanlara büyük yatırımlar yapılmıştır."
 building_type_oath_poor_building_01: "Resmî Dârülacezeler"
 building_type_oath_poor_building_01_desc: "Bu toprakların hükümdarı, Taç Giyme Töreninde yoksulları gözetmeye yemin etmiştir."
 building_oath_poor_building_01: "Hayır Âdetleri"
 building_oath_poor_building_01_desc: "Varlıklı kimseler yetkililerce bilhassa kutsal günlerde, artan yiyecek ve servetlerini daha bahtsızlara vermeye teşvik edilir."
 building_oath_poor_building_02: "Yoksulhaneler"
 building_oath_poor_building_02_desc: "En yoksullar, dullar ve yaşlılar, sade barınaklarda mütevazı iaşe ve bir nebze bakım görür."
 building_oath_poor_building_03: "Hayır Daireleri"
 building_oath_poor_building_03_desc: "Dârülacezeler ve bedbahtlara hizmet eden ihtiyaçlar, imkân sahibi resmî görevlilerce yürütülür."
 building_oath_poor_building_04: "Hayır Müesseseleri"
 building_oath_poor_building_04_desc: "Memleketin dört bir yanında muhtaçlar mahrum bırakılmaz, latif barınaklar serseriliğe düşecekleri himaye eder, darüşşifalar hasta ve yaşlılarla ilgilenir, yoksul köylüler için cömert yardımlar yapılır."
