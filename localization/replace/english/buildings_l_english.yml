 building_type_the_great_wall_01_desc: "$building_the_great_wall_01_desc$"
 building_the_great_wall_01: "Çin Seddi"
 building_the_great_wall_01_desc: "Bu, Çin Seddi'nin en eski bölümüdür, büyük ölçüde Qin hanedanı tarafından inşa edilmiştir. Zamanın kumları taş, tuğla ve harcı yıpratmış olabilir ama hâlâ müthiş bir tahkimat parçasıdır."
 building_type_the_great_wall_02: "$building_the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$building_the_great_wall_02_desc$"
 building_the_great_wall_02: "Çin Seddi"
 building_the_great_wall_02_desc: "Han hanedanı, seleflerinin inşa ettiği mevcut duvarları büyük ölçüde genişletti. Çöller ve dağlar boyunca yüzlerce mil uzanan daha kapsamlı bölümlerden bazılarını inşa ettiler."
 building_type_the_great_wall_03: "$building_the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$building_the_great_wall_03_desc$"
 building_the_great_wall_03: "Çin Seddi"
 building_the_great_wall_03_desc: "Wei, Qi ve Sui hanedanları 5. ve 6. yüzyıllarda duvara eklemeler yaparak, çeşitli bölümleri daha iyi tahkimatlarla güçlendirdi."
 building_type_the_great_wall_04: "$building_the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$building_the_great_wall_04_desc$"
 building_the_great_wall_04: "Çin Seddi"
 building_the_great_wall_04_desc: "Mühendisliğin en etkileyici başarılarından biri olan bu devasa duvar, MÖ 7. yüzyıldaki ilk inşasından bu yana defalarca genişletildi. Artık binlerce mil boyunca uzanıyor, çok sayıda gözetleme kulesi, kışla ve garnizon istasyonu barındırıyor. Elbette hiçbir barbar istilacı bu kudretli engeli asla aşamaz, değil mi?"
