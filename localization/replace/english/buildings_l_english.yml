 building_lhasa_market_01: "Lhasa Pazarı"
 building_lhasa_market_01_desc: "Hindistan ile Çin arasında mükemmel bir kavşakta yer alan Lhasa tüccarları, görkemli Potala sarayının gölgesinde yolcuların ilgisi için yarışır."
 building_lhasa_market_02: "Lhasa'nın Yaygın Khrom'u"
 building_lhasa_market_02_desc: "Güneşin altında yeni bir şey yok, diye iddia eder Lhasa'nın tüccarları, çünkü İpek Yolu boyunca dolaşıp gelmeyen hiçbir biblo ya da mücevher yoktur."
