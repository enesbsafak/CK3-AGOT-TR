### TODO AGOT-CHANGED: building_type_mount_damavand_01_desc [AGOT: A great, snow-capped pinnacle steeped in ancient lore, Mount Damavand is said to be the prison of the monstrous tyrant ZahhÄk, where he will abide until the end of the world. Many heroes of old have performed great feats on this mountain, and to those who travel there today, its mighty presence seem to touch their very souls. A dormant volcano, its slopes are dotted by hot springs where weary travelers can stop and relax, pondering the deeds of the ancients. | TR: Karla kaplı muazzam bir dağ olan Damavand Dağı efsanevi Zahhāk'ın tutsak tutulduğu yer olarak bilinir. Rivayete göre burada dünyanın sonu gelesiye kadar kalacağı söylenir. Birçok eski kahraman bu dağda büyük başarılar elde etmiştir. Günümüzde bu dağı ziyaret edenler ise dağın muazzam varlığıyla ruhlarında huzur bulur. Sönmüş bir yanardağ olan bu dağın yamaçları ziyaretçiler için çok sayıda sıcak su kaplıcaları barındırır. Eski insanların nasıl yaşadıklarını düşünerek düşüncelere dalmak için mükemmel bir yerdir.]
