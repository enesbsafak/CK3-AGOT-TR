 building_type_itoigawa_mines_01_desc: "Kotakigawa Nehri, Myojo Dağı'nın eteklerindeki boğazdan akar ve büyük yeşim yatakları bakımından zengindir. Bu yataklar, bölgenin ve ötesinin en zarif yeşimlerinden bazılarını üretir, canlı yeşil renkleriyle gözü kamaştırır."
