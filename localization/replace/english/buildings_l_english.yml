 building_type_holy_site_imam_ali_mosque_01:0 "İmam Ali Mescidi"
 building_type_holy_site_imam_ali_mosque_01_desc:0 "İmam Ali Mescidi, Hz. Muhammed'in kuzeni ve ilk Şii imam olan Hz. Ali'nin türbesini barındırır. Her yıl gelen binlerce hacıyı caminin görkemli yeşil kubbesi karşılar."
