 building_type_ratnapura_mines_01:0 "Ratnapura Madenleri"
 building_type_ratnapura_mines_01_desc:0 "Mücevherler şehri Ratnapura, dünyanın en önemli yakut ve safir kaynaklarından biridir. Yüzlerce yıldır bu zenginlikler çıkarılmakta ve Hint alt kıtası, Güney Doğu Asya ve Çin'den gelen tüccarlarla ticareti yapılmaktadır."
