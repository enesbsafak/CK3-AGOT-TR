 building_dushan_mines_04_desc: "$building_hetian_mines_04_desc$"
 building_type_xiuyan_mines_01: "Xiuyan Yeşim Madenleri"
 building_type_xiuyan_mines_01_desc: "Bu kadim taş ocağı, topluluğunu binlerce yıl boyunca yüksek kaliteli yeşimle beslemiştir. Hongshan halkı, buradan bilezikler, aletler ve simgesel eserler gibi türlü zanaatkârlık ürünleri keşfedip kullanmış, toplumsal kullanım alanlarını ve aile itibarını zenginleştirmiştir."
