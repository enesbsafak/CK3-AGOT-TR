 building_dau_temple_01_desc: "A revered temple in Luy LÃ¢u, marks the spot where monks from far-off lands first came together. The brick tower, relics, and mummified masters that remain there embody centuries of devotion to Buddhism."
 building_type_liuhe_pagoda_01: "$building_liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$building_liuhe_pagoda_01_desc$"
 building_liuhe_pagoda_01: "Liuhe Pagodası"
 building_liuhe_pagoda_01_desc: "Gelgitleri yatıştırmak ve Buda'yı onurlandırmak için krallar tarafından yükseltilmiş, göğe uzanan bir pagoda. Işığı ülkeye yayılır, insan ile Göğün uyumunun simgesidir."
 building_type_muaro_jambi_01: "$building_muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$building_muaro_jambi_01_desc$"
 building_muaro_jambi_01: "Muaro Jambi Yerleşkeleri"
 building_muaro_jambi_01_desc: "Batang Hari Nehri boyunca uzanan Muaro Jambi'nin geniş tuğla yerleşkeleri hem ticareti hem de inancı korurdu. Srivijaya'nın bir kalesi olarak hükümdarlara sığınak sağladı ve Sumatra'nın kalbinde orduları bu duvarlar arasında seferber etti."
 building_type_hanging_temple_01: "$building_hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$building_hanging_temple_01_desc$"
 building_hanging_temple_01: "Asma Tapınak"
 building_hanging_temple_01_desc: "Asma Tapınak, Heng Dağı'nda bir uçurum yüzünden sarkan bir manastırdır. Efsaneye göre inşası yüzyıllar önce Liaoran adlı bir keşişle başladı. Kazıklar üzerine kurulmuş ahşap salonları, Budist, Taoist ve Konfüçyusçu bilgelere adanmış kutsal köşeler barındırır, inançları harmanlar ve zarif bir sükûnetle yerçekimine meydan okur."
 building_type_pagoda_of_fogong_temple_01: "$building_pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$building_pagoda_of_fogong_temple_01_desc$"
 building_pagoda_of_fogong_temple_01: "Fogong Tapınağı Pagodası"
 building_pagoda_of_fogong_temple_01_desc: "Fogong Tapınağı Pagodası, çivi kullanılmadan inşa edilmiş yüksek bir ahşap pagodadır. Dokuz kat yükselir, kutsal emanetler ve heykelleri barındırır. Usta tasarımı hâlâ bir mühendislik harikası ve inancın simgesidir."
 building_type_plain_of_jars_01: "$building_plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$building_plain_of_jars_01_desc$"
 building_plain_of_jars_01: "Kavanozlar Ovası"
 building_plain_of_jars_01_desc: "Kavanozlar Ovası, amacı gizemini koruyan dev taş kaplarla dolu geniş bir platodur. Bir zamanlar kadim ritüellerde kullanılmış olan bu kaplar, unutulmuş bir halkın kalıntıları olarak varlığını sürdürür, hayranlık ve yerel saygı uyandırır."
 building_type_dieng_plateau_01: "$building_dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$building_dieng_plateau_01_desc$"
 building_dieng_plateau_01: "Dieng Platosu"
 building_dieng_plateau_01_desc: "Dieng Platosu, sislerle örtülü volkanik bir havzadır, kükürt havuzları ve gaz menfezleri manzarayı delik deşik eder. Dağınık kadim tapınaklar ve ritüel efsaneler, burayı hem korkulan hem de saygı duyulan bir yer kılar, bir zamanlar kadim iyi ve kötü ilahların dolaştığı kutsal bir yayladır."
 building_type_mount_apo_01: "$building_mount_apo_01$"
 building_type_mount_apo_01_desc: "$building_mount_apo_01_desc$"
 building_mount_apo_01: "Apo Dağı"
 building_mount_apo_01_desc: "Lake Venado'nun üzerinde yükselen Apo Dağı'nın adı, Lumad dillerinde 'saygıdeğer yaşlı' anlamına gelir. Apo Sandawa'nın—kutsal dağın ruhunun—kısaltılmış bir biçimidir, 'Yaşlı Sandawa' ya da 'Büyükbaba Sandawa' olarak da anılır. Apo Sandawa için ritüeller, atasal ruhlara aracılık ettiği düşünülen kabilenin şamanı tarafından gerçekleştirilir."
 building_type_besakih_temple_01: "$building_besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$building_besakih_temple_01_desc$"
 building_besakih_temple_01: "Besakih Tapınağı"
 building_besakih_temple_01_desc: "'Bali'nin Ana Tapınağı' olarak bilinen Besakih, adanın en önemli ve en kutsal Hindu tapınak kompleksidir. Bali'nin en yüksek volkanı ve kutsal dağı olan Agung Dağı'nın eteklerinde yer alır. Ada için dini ve kültürel bir kalptir, herkes için büyük törenlere ev sahipliği yapar."
 building_type_gongsanseong_fortress_01: "$building_gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$building_gongsanseong_fortress_01_desc$"
 building_gongsanseong_fortress_01: "Gongsanseong Kalesi"
 building_gongsanseong_fortress_01_desc: "Gongsanseong Kalesi, Geum Nehri'nin üzerindeki tepeleri taçlandırır. Baekje'nin kraliyet iç kalesi olarak inşa edilen uzun surları ve taş kapıları, kralları ve halkı birlikte korurdu, hanedan gücü ve savunmasının dağlardaki bir sığınağıdır."
 building_type_krakatoa_01: "$building_krakatoa_01$"
 building_type_krakatoa_01_desc: "$building_krakatoa_01_desc$"
 building_krakatoa_01: "Krakatoa"
 building_krakatoa_01_desc: "Krakatoa, kıyı açıklarında küçük bir takımada üzerinde yer alan heybetli bir volkandır."
 building_type_borobudur_01: "$building_borobudur_01$"
 building_type_borobudur_01_desc: "$building_borobudur_01_desc$"
 building_borobudur_01: "Borobudur"
 building_borobudur_01_desc: "Borobudur, üst üste dizilmiş dokuz taş platformdan oluşan ve tepesinde merkezi bir kubbe bulunan devasa bir Budist tapınağıdır. Tapınak, binlerce kabartma ve yüzlerce Buda heykeliyle süslenmiştir."
 building_type_hoshi_ryokan_01: "$building_hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$building_hoshi_ryokan_01_desc$"
### TODO AGOT-CHANGED: building_hoshi_ryokan_01 [AGOT: HÅshi Ryokan | TR: Hōshi Ryokan]
 building_hoshi_ryokan_01: "HÅshi Ryokan"
### TODO AGOT-CHANGED: building_hoshi_ryokan_01_desc [AGOT: HÅshi Ryokan is an old traditional inn and a family business. It offers travellers a respite on their journey with rest, food, and access to hot spring baths. | TR: Hōshi Ryokan, eski bir geleneksel han ve aile işletmesidir. Yolculuk edenlere, dinlenme, yemek ve kaplıca banyolarına erişim sunarak yolda bir soluklanma imkânı sağlar.]
 building_hoshi_ryokan_01_desc: "HÅshi Ryokan is an old traditional inn and a family business. It offers travellers a respite on their journey with rest, food, and access to hot spring baths."
 building_type_celestial_great_barracks_01: "$building_celestial_great_barracks_01$"
 building_type_celestial_great_barracks_01_desc: "$building_celestial_great_barracks_01_desc$"
 building_celestial_great_barracks_01: "Büyük Kışla"
 building_celestial_great_barracks_01_desc: "Bu devasa kışla ve kale, yerel valiye ordularını güçlendirecek askerler sağlar ve bölgenin savunmasını büyük ölçüde iyileştirir."
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] askerî bir [governor|E] değil"
