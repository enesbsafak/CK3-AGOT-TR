 building_type_rammelsberg_mines_01:0 "Rammelsberg Madenleri"
 building_type_rammelsberg_mines_01_desc:1 "Rammelsberg Dağı'nın eteklerinde değerli bir gümüş madeni vardır."
 building_rammelsberg_mines_01:1 "Rammelsberg Maden Yerleşkesi"
 building_rammelsberg_mines_01_desc:1 "Cevherlerin olduğu yerde küçük bir maden yerleşkesi kuruldu. Burada yaşayanlar cevher damarlarını açıp madenleri çıkarmaya başladılar ama şu ana kadar sadece yüzeydekileri alabiliyorlar."
 building_rammelsberg_mines_02:1 "Rammelsberg Madeni"
 building_rammelsberg_mines_02_desc:1 "Yerleşke büyüdükçe daha fazla cevher çıkartılıyor. Becerikli mühendislerin de gelmesiyle gerçek bir maden inşa edilebilir."
 building_rammelsberg_mines_03:1 "Büyük Rammelsberg Madeni"
 building_rammelsberg_mines_03_desc:1 "Madende çalışan kişi arttıkça madenin kendisi de büyüyor. Yeni girişler inşa ediliyor ve derindeki cevherlerin çıkarılması için büyük kuyular kazılıyor."
 building_rammelsberg_mines_04:1 "Rammelsberg Maden Tesisi"
 building_rammelsberg_mines_04_desc:1 "Cevher üretimi arttıkça yerleşke etrafında çeşitli dökümhaneler ve ocaklar da kuruluyor. Burada yaşayanlar madeni işlemede uzman hâline gelmiş, becerileri de tüm dünyada biliniyor."
