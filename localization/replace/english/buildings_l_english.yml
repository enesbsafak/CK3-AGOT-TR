 building_type_hpakant_mines_01: "Hpakant Yeşim Madenleri"
 building_type_hpakant_mines_01_desc: "Ormanlık tepelerin derinlerinde, parlak jadeit damarları kıvrımlı nehirlerin ve kireçtaşı sırtlarının arasında ışıldar. Uzun yıllar boyunca bu yataklar yoldan geçenlerden ve yabancı tüccarlardan saklı kalmış, yerel halka değerli yeşil taştan sayısız kaya parçası sunmuştur."
