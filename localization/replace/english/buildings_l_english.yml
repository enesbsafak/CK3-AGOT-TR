 building_type_mount_baekdu_01: "Baekdu Dağı"
 building_type_mount_baekdu_01_desc: "Baekdu Dağı'nın görkemli zirvesinin, Kore yarımadasındaki tüm dağların kaynağı olduğu söylenir, yüksekleri bölgenin pek çok inancı ve halkı arasında kutsal bir mekândır."
