 building_type_offas_dyke_01_desc:0 "Etrafı toprak duvarla çevrelenmiş uzun bir hendek olan Offa'nın Hendeği, Anglo Sakson Mersiya Kralı tarafından Galler'de inşa edilmişti. Bu hendek diğer taraftaki orduya avantaj sağlar çünkü saldıranlar hendekten duvara doğru yukarı çıkmak zorunda kalır."
