 building_taghaza_mines_02:0 "Taghaza Madeni"
 building_taghaza_mines_02_desc:1 "Yerleşim büyüdükçe daha fazla tuz çıkarılıyor. Yetkin mühendislerin akını gerçek bir madenin inşasına olanak tanır."
 building_taghaza_mines_03:0 "Büyük Taghaza Madeni"
 building_taghaza_mines_03_desc:0 "Madencilik faaliyetleri büyüdükçe, madenlerin kendisi de büyüyor. Daha fazla giriş inşa ediliyor ve daha fazla tuz çıkarabilmek için büyük kuyular kazılıyor."
