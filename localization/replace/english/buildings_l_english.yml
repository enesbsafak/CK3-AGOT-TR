 building_type_lantian_mines_01_desc: "Lantian'ın tepeleri binlerce yıldır yüksek kaliteli yeşimin kaynağı olmuştur. Tarih boyunca imparatorluk mühürlerine oyulan ve Tang şairleri tarafından övülen bu soluk taş, bolluğundan ziyade kendine özgü güzelliği ve statüsü nedeniyle değerlidir."
