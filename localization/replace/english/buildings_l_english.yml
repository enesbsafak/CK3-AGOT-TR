 building_type_swahili_port_pemba_desc: "$building_swahili_port_pemba_desc$"
 building_swahili_port_zanzibar: "Zanzibar Ticaret Limanları"
 building_swahili_port_zanzibar_desc: "Unguja Adası'nın mercan adacıklarınca korunmuş kumlu kıyıları, gemiler için kusursuz bir sığınak oluşturur. Hint Okyanusu'nun dört bir yanından tüccarlar, Unguja'nın deniz ticaretinin merkezi olmasını sağlayan doğal avantajlarından yararlanmaya gelir."
 building_type_swahili_port_zanzibar: "$building_swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc: "$building_type_swahili_port_zanzibar_desc$"
 building_swahili_port_mombasa: "Mombasa Limanı"
 building_swahili_port_mombasa_desc: "Dik kayalıklarla çevrili taşlık bir ada üzerinde yükselen Mombasa, doğal olarak savunulabilir bir konuma sahiptir, buna rağmen deniz trafiğine benzersiz biçimde erişilebilir kalır."
 building_type_swahili_port_mombasa: "$building_swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc: "$building_swahili_port_mombasa_desc$"
 building_swahili_port_pate: "Pate Adası Ticaret Limanları"
 building_swahili_port_pate_desc: "Svahili çekirdek topraklarının kuzey ucunda yer alan Pate Adası, İslam'la ve dolayısıyla Orta Doğu ticaret ağlarıyla tanışan ilk Svahili bölgelerinden biriydi."
 building_type_swahili_port_pate: "$building_swahili_port_pate$"
 building_type_swahili_port_pate_desc: "$building_swahili_port_pate_desc$"
 building_swahili_port_lamu: "Lamu Ticaret Limanları"
 building_swahili_port_lamu_desc: "Kumsallarının sıcak beyazı ve kıyılarına ağır ağır vuran suların canlı mavisi, Lamu'nun can damarı olan hareketli ticareti gizler. Okyanus ötesi ticaretle uzun süredir bağlantılı olan bu yerde, bilinen dünyanın batı ve doğu uçlarından gelen mallar alınıp satılabilir."
 building_type_swahili_port_lamu: "$building_swahili_port_lamu$"
 building_type_swahili_port_lamu_desc: "$building_swahili_port_lamu_desc$"
### TODO AGOT-CHANGED: building_type_dragon_kiln_01 [AGOT: Porcelain Kiln | TR: Ejderha Fırını]
 building_type_dragon_kiln_01: "Porcelain Kiln"
 building_type_dragon_kiln_01_desc: "Dik bir yamaç kenarına inşa edilen bu fırın kompleksi, ticaret malı ve hediye olarak çok değer gören egzotik seramikleri üretmek için gereken son derece yüksek ısıları sağlayabilir."
 building_dragon_kiln_01: "Yamaç Fırını"
 building_dragon_kiln_01_desc: "Bu uzun fırın, ateşin çekişini yatay biçimde yönlendirerek çömlekçilerin değerli kaseler, vazolar ve diğer seramikleri üretmesi için gereken yoğun ısıyı oluşturur."
 building_dragon_kiln_02: "Saggar Fırını"
 building_dragon_kiln_02_desc: "Seramik üretimi, saggar adı verilen basit kaplar kullanılarak kolaylaştırılabilir, bunlar, fırınlanan çömlekleri duman, kül ve endüstriyel ölçekte üretimin getirdiği döküntüler gibi kirleticilerden ve hasardan korur."
 building_dragon_kiln_03: "Bölmeli Fırın"
 building_dragon_kiln_03_desc: "Fırının ana ateşini bir dizi bölme içine almak hem sıcaklığı düzenler hem de işçilerin seramikleri yükleyip boşaltmasını çok daha kolaylaştırır, daha büyük ölçekte daha kaliteli ürünler ortaya çıkar ve daha fazla insan bunlar için daha yüksek fiyat ödemeye razı olur."
 dragon_kiln_terrain_requirement_tt: "[terrain|E] #V $terrain_mountains$#!, #V $terrain_desert_mountains$#! veya #V $terrain_hills$#! değil!"
 dragon_kiln_quarry_requirement_tt: "[GetBuilding('quarries_01').GetName] veya üstünü gerektirir"
 TERRAIN_NOT_FARMLANDS: "Arazi $farmlands$ değil"
 building_type_burkhan_khaldun_01: "Burhan Haldun"
 building_type_burkhan_khaldun_01_desc: "Burhan Haldun, Khentii Dağları'nın en görkemlisi olarak yükselir.\nPek çok Moğol kahramanının doğum yeri olduğu söylenen bu dağın yamaçları, obalarla kaplıdır ve dağın lütfunu kazanmak için ona kurbanlar sunulur."
 building_burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
 building_burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"
 building_pleasure_dome: "Zevk Kubbesi"
 building_pleasure_dome_desc: "Hem askerî hem de kültürel bir merkez olarak hizmet veren Moğol sarayı. Zirvesinde, farklı türden şarapların yılan figürlerinin ağzından aktığı gümüşten bir ağaç şeklinde bir çeşme yer alır."
 building_type_pleasure_dome: "$building_pleasure_dome$"
 building_type_pleasure_dome_desc: "$building_pleasure_dome_desc$"
 building_type_murex_farm_01: "Dikenli Salyangoz Avcılığı"
### TODO AGOT-CHANGED: building_type_murex_farm_01_desc [AGOT: Purple dye is always in high demand. The snails from which this luxurious dye is made are harvested and processed here. | TR: İmparatorluk moru her zaman talepte olan bir şeydir. Bu lüks boyanın yapıldığı salyangozlar burada toplanır ve işlenir.]
 building_type_murex_farm_01_desc: "Purple dye is always in high demand. The snails from which this luxurious dye is made are harvested and processed here."
 building_murex_farm_01: "Dikenli Salyangoz Toplayıcılığı"
### TODO AGOT-CHANGED: building_murex_farm_01_desc [AGOT: A thriving Murex fishing industry has been established along the coast. It provides a modest but steady income through the sale of harvested snails. | TR: Akdeniz kıyısı boyunca bir dikenli salyangoz balıkçılığı sanayisi kurulmuştur. Hasat edilen salyangozların satışı, mütevazı ama istikrarlı bir gelir sağlamaktadır.]
 building_murex_farm_01_desc: "A thriving Murex fishing industry has been established along the coast. It provides a modest but steady income through the sale of harvested snails."
 building_murex_farm_02: "Dikenli Salyangoz İşleme Merkezi"
 building_murex_farm_02_desc: "Bu merkezlerde, dikenli salyangozlar verimli bir şekilde işlenerek daha yüksek kalitede mor boya elde ediliyor."
 building_murex_farm_03: "Boya Damıtımevi"
 building_murex_farm_03_desc: "Özel damıtımevi dikenli salyangoz salgılarını rafine ederek güçlü bir mor boyaya dönüştürüyor. Bu işlem, boyanın canlılığını ve değerini önemli ölçüde arttırır."
 building_murex_farm_04: "Kurutma Alanları"
 building_murex_farm_04_desc: "Açık hava alanları, boyanın paslanma sürecini hızlandırır. Bu da mor boyanın üretim süresini kısaltarak daha verimli bir iş akışı sağlar."
 building_murex_farm_05: "Usta Boyacılar Loncası"
### TODO AGOT-CHANGED: building_murex_farm_05_desc [AGOT: The Master Dyers Guild, renowned for achieving the perfect shade of Tyroshi purple, enhances the precision of textile dyeing. This results in consistently high-quality purple garments. | TR: Sur morunun mükemmel tonunu elde etmesini sağlayan Usta Boyacılar Loncası, tekstillerin daha doğru bir şekilde boyanmasını sağlıyor. Böylece yüksek kaliteli mor giysiler daha kolay ve daha hızlıca elde ediliyor.]
 building_murex_farm_05_desc: "The Master Dyers Guild, renowned for achieving the perfect shade of Tyroshi purple, enhances the precision of textile dyeing. This results in consistently high-quality purple garments."
 building_murex_farm_06: "İpek Dokuma Atölyesi"
 building_murex_farm_06_desc: "Bu atölye, boyama için ipek gibi lüks kumaşların dokumasında uzmanlaşmıştır. Olağanüstü kalitede giysiler üreterek ticari değerin de artmasını sağlarlar."
