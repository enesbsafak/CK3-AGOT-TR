 building_trosky_castle_01: "Trosky Kalesi"
 building_trosky_castle_01_desc: "Trosky Kalesi, çoktan sönmüş bir volkanın bazalt kaya oluşumları arasına inşa edilmiştir. Kale adını, çökmüş bir kalenin harabelerine benzeyen kaya biçiminden alır."
