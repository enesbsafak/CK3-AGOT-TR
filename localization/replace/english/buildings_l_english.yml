 building_type_chinjufu_01: "$building_chinjufu_01$"
 building_type_chinjufu_01_desc: "$building_chinjufu_01_desc$"
 building_chinjufu_01: "Chinjufu Bölgesi" # 鎮守府
 building_chinjufu_01_desc: "Aslen Taga'da konuşlu olan Chinjufu, kuzey Japonya'daki imparatorluk yatıştırma çabalarının tahkimli merkezidir, bölgenin savunması ve vergilendirilmesinden sorumlu özel bir komutan tarafından yönetilir."
