 building_type_kollur_mines_01:0 "Kollur Madenleri"
 building_type_kollur_mines_01_desc:0 "Kollur madenleri Hindistan alt kıtasındaki en büyük elmas madenidir. Çalışmak çok tehlikelidir ama elde edilebilecek zenginlikler de inanılmazdır."
 building_kollur_mines_01:0 "Kollur Maden Çukurları"
 building_kollur_mines_01_desc:0 "Küçük bir kil ve çakıl çukurunda sadece peştemal giyen işçiler elmas çıkarmak için gece gündüz çalışıyor."
 building_kollur_mines_02:0 "Kollur Madeni"
 building_kollur_mines_02_desc:1 "Elmas üretimini arttırmak için maden çukurları genişletildi ve mühendisler getirildi."
 building_kollur_mines_03:0 "Büyük Kollur Madeni"
 building_kollur_mines_03_desc:0 "Maden çukurlarının etrafında bir köy kuruldu, işçiler ise sık sık büyük elmaslar buluyor."
 building_kollur_mines_04:0 "Kollur Maden Tesisi"
 building_kollur_mines_04_desc:0 "İşçilerin sayısının binlere çıkmasıyla artık maden endüstriyel bir kapasiteye ulaştı. Madenlerden âdeta zenginlik akıyor."
 building_type_tribe_01:1 "Kabile Kalesi"
 building_type_tribe_01_desc:1 "Bir kabile köyünü koruyan basit ama etkili bir kale."
 building_tribe_01:1 "Kabile Kalesi"
 building_tribe_01_desc:1 "Kütüklerden ve kabaca yontulmuş taşlardan inşa edilen kale küçüklüğüne rağmen göz korkutucu."
 building_tribe_02:1 "Tahkimatlı Kabile Kalesi"
 building_tribe_02_desc:1 "Feodal kalelerden esinlenen tahkimatlı kale birçok yeni savunma unsuru barındırıyor."
 building_type_longhouses_01:1 "Toplanma Salonları"
 building_type_longhouses_01_desc:1 "Kabile şefleri, yaşlıları ve savaş beyleri kararlar verirken uzun evlerde toplanır. Büyük salonlar bu toplantılara ev sahipliği yapıp ziyafeti düzenleyenin prestijini arttırır."
 building_longhouses_01:1 "Uzun Evler"
 building_longhouses_01_desc:1 "Uzun evler yaşlılar arasındaki önemli toplantılara ev sahipliği yapacak kadar geniştir. Yasalar ve politikalar burada belirlenir."
 building_longhouses_02:1 "Büyük Salonlar"
 building_longhouses_02_desc:1 "Büyük salonlar bir şefin veya savaş beyinin coşkulu konuşmalar verdiği bir ana sahne içerir."
 building_type_war_camps_01:0 "Savaş Kampları"
 building_type_war_camps_01_desc:1 "Yiğit kabile askerleri savaşa çağrıldıklarında savaş kamplarında toplanır. Barış zamanlarında bile kaçınılmaz olan savaş için talim yapıp hazırlanırlar."
 building_war_camps_01:1 "Talim Alanları"
 building_war_camps_01_desc:2 "Talim ekipmanı, arenalar ve ahşap duvarlardan oluşan talim alanlarında savaşçılar becerilerini test edip geliştirir."
 building_war_camps_02:1 "Savaşçı Barınakları"
 building_war_camps_02_desc:1 "Savaşçı barınaklarına sadece en büyük savaşçılar girebilir. Uzaktan görmek bile insanı şevkle doldurur."
 building_type_palisades_01:0 "Kazık Duvarlar"
 building_type_palisades_01_desc:2 "Kazık duvarlardan oluşan katmanlar dağılmış kabile yerleşimlerini yağmalardan ve vahşi hayvanlardan korur."
 building_palisades_01:1 "Basit Kazık Duvar"
 building_palisades_01_desc:1 "Basit kazık duvarlar küçük çatışmalara karşı etkili olsa da büyük düşman grupları karşısında etkili değildir."
 building_palisades_02:1 "Surlar & Hendekler"
 building_palisades_02_desc:1 "Hendekler ile birlikte taşla güçlendirilmiş kazık duvarlar kuşatmalara karşı iyi bir koruma sağlar."
 building_type_market_villages_01:1 "Pazarlar"
 building_type_market_villages_01_desc:1 "Bu toprakların çok ziyaret edilen kesimlerinde küçük pazar köyleri ortaya çıkmaya başladı. Kabile üyeleri burada tüccarlar ile ticaret yapabiliyor."
 building_market_villages_01:1 "Ticaret Merkezleri"
 building_market_villages_01_desc:1 "Ticaret merkezleri tüccarların ve kabile üyelerinin bir araya gelmesini sağlar."
 building_market_villages_02:1 "Pazar Köyleri"
 building_market_villages_02_desc:2 "Belli aralıklarla bu köyler tüm bölgenin tüccarlarının katılım gösterdiği büyük pazarlara ev sahipliği yapar."
 building_type_water_temples_01: "Subak Su Tapınakları"
 building_type_water_temples_01_desc: "Su türbeleri ve tapınaklarına dayanan, iç bölgelere uygun sulama kooperatifleri, ritüel takvimler ekimi ve kanal bakımını koordine eder."
 building_water_temples_01: "Subak Bentleri ve Tarla Türbeleri"
 building_water_temples_01_desc: "Küçük bentler ve toprak kanallar çeltik tarlalarını birbirine bağlar, bir türbe adakları ve iş nöbetlerini gözetir. Güvenilir bir fazla ürün akmaya başlar, onunla birlikte ayinler de."
 building_water_temples_02: "Subak Konsey Türbeleri"
 building_water_temples_02_desc: "Birden çok türbe, takvime bağlı su paylaşımıyla daha geniş bir "subak"ı koordine eder, anlaşmazlıklar ve onarımlar topluca ele alınır, kontrol ve verim artar."
 building_water_temples_03: "Su Tapınağı Ağı"
 building_water_temples_03_desc: "Düzenli bir su-tapınağı devresi, eşzamanlı ekim ve nadas döngülerini denetler, zararlılar azalır, üretim yükselir ve ritüel dindarlık büyür."
 building_water_temples_04: "Büyük Su-Tapınağı Peyzajı"
 building_water_temples_04_desc: "Tüm havza, tapınak öncülüğündeki meclisler aracılığıyla düzenlenir, teraslar, savaklar ve kutlamalar bu eyaleti dindar bir ambar hâline getirir."
 building_type_stilted_granaries_01: "Kazık Üstü Ambarlar"
 building_type_stilted_granaries_01_desc: "Fare geçirmez, dört ya da daha fazla kazık üstüne yükseltilmiş depolar, haraç saklamak ve savaş çetelerini erzaklandırmak için idealdir."
 building_stilted_granaries_01: "Kazık Üstü Ambar"
 building_stilted_granaries_01_desc: "Basit bir dört direkli depo, tohumu ve haracı kuru tutar, köy muhafızları seferde daha iyi beslenir."
 building_stilted_granaries_02: "Ambar Sırası"
 building_stilted_granaries_02_desc: "Fare kırıcıları ve üstü örtülü basamakları olan kazık üstü depolardan bir hat. Tahıl yükümlülükleri daha istikrarlı hâle gelir ve askerî toparlanma hızlanır."
 building_stilted_granaries_03: "Oymalı Kazık Üstü Ambarlar"
 building_stilted_granaries_03_desc: "İtibar oymaları fazlayı işaretler, kâhyalar stokları ve erzak paylarını döndürerek daha uzun yürüyüşlere hazırlar."
 building_stilted_granaries_04: "Ambar Mahfili"
 building_stilted_granaries_04_desc: "Gözcü sundurması ve kayıt kulübesi bulunan çitli bir küme, gıda güvenliği tüm kontluğu dengeler."
 building_type_kora_kora_yards_01: "Kora-Kora Tersaneleri"
 building_type_kora_kora_yards_01_desc: "Denge kollu savaş kanoları için klan kayıkhaneleri ve kızaklar."
 building_kora_kora_yards_01: "Kano Kayıkhaneleri"
 building_kora_kora_yards_01_desc: "Kürekle yürütülen denge kollular için üstü kapalı kızaklar, mürettebat kıyı baskınları ve adalar arası koşular için talim yapar."
 building_kora_kora_yards_02: "Klan Tekne Tersanesi"
 building_kora_kora_yards_02_desc: "Kereste yığınları, lif bağları ve yedek denge kolları dönüşleri hızlandırır, akıncılar ganimet ve takas mallarıyla döner."
 building_kora_kora_yards_03: "Kora-Kora Tersanesi"
 building_kora_kora_yards_03_desc: "Daha büyük gövdeler, savaş platformları ve işaret davulları, kıyı devriyeleri ve mevsimlik seferler bir yaşam ritmi (ve gelir) hâline gelir."
 building_kora_kora_yards_04: "Büyük Savaş Kano Cephaneliği"
 building_kora_kora_yards_04_desc: "Tersane ustaları tüm filoları donatır, indirme rampaları, donanım atölyeleri ve toplanma platformları komşuların içine korku salar."
 building_type_idjang_forts_01: "Idjang Kaleleri"
 building_type_idjang_forts_01_desc: "Sırtlarda ya da tümseklerde konumlanan, teraslı kabile sitadelleri, güçlü mevziler."
 building_idjang_forts_01: "Kazıklı Idjang"
 building_idjang_forts_01_desc: "Savunulabilir bir yükseltinin tepesini ahşap bir palanka taçlandırır, gözcü ateşleri ve kuru hendekler akıncıları caydırır."
 building_idjang_forts_02: "Taş Duvarlı Idjang"
 building_idjang_forts_02_desc: "Önemli cephelerde ahşabın yerini moloz taş istinatlar alır, üstü kapalı yollar savunmacıların güvenle gidip gelmesini sağlar."
 building_idjang_forts_03: "Teraslı Idjang"
 building_idjang_forts_03_desc: "Basamak oyma yaklaşımlar, baskın merdivenleri ve atış platformları oklar ve mızraklar için öldürücü açılar yaratır."
 building_idjang_forts_04: "Sitadel Idjang"
 building_idjang_forts_04_desc: "Kapı kulesi, iç kule ve sarnıç, garnizon mevsimler boyunca dayanabilir."
 building_type_wantilan_01: "Wantilan"
 building_type_wantilan_01_desc: "Meclisler, ayinler ve gösteriler için açık, duvarsız büyük salonlar ve topluluk pavyonları."
 building_wantilan_01: "Küçük Wantilan"
 building_wantilan_01_desc: "Köy salonu toplanmaları, yeminleri ve provaları ağırlar, yaşlılar, büyümeden önce husumetleri hakeme bağlar."
 building_wantilan_02: "Wantilan Pavyonu"
 building_wantilan_02_desc: "Geniş, katlı çatılı bir salon, ortak ayinlerin moral ve prestiji yükselttiği festivalleri ve inisiyasyonları taşır."
 building_wantilan_03: "Tapınak Wantilan'ı"
 building_wantilan_03_desc: "Yerel kutsal mekâna bağlı, adaklar ve alaylar için bol alan sunan törensel bir sahne."
 building_wantilan_04: "Büyük Wantilan"
 building_wantilan_04_desc: "Davulların, dansçıların ve kaptanların tek bir çatı altında buluştuğu, simgesel bir arena."
 building_type_military_academy_01:0 "Askerî Akademiler"
 building_type_military_academy_01_desc:0 "Subay ve şövalye eğitimi için özel olarak inşa edilen okullar sayesinde orduların muharebedeki verimliliği artar."
 building_military_academy_01:0 "Askerî Okullar"
 building_military_academy_01_desc:0 "Subaylar becerilerine göre okula alınır. Doğal olarak okul sadece soyluları kabul eder."
 building_military_academy_02:0 "Subay Akademileri"
 building_military_academy_02_desc:1 "Orta ve üst kademe subaylar burada eğitim görürler, birlik düzenine, konuşlanma hazırlıklarına ve muharebe alanına dair bilgiler edinirler."
 building_military_academy_03:0 "Büyük Askerî Akademiler"
 building_military_academy_03_desc:2 "Büyük Askerî Akademiler gelişmiş bir askerî organizasyonun kalbidir. Subaylar burada arazi stratejisi, ordu organizasyonu ve savaş teknolojisindeki en son icatlara dair bilgiler edinirler." 
 building_type_march_01:0 "Sınır İstihkâmları"
 building_type_march_01_desc:0 "Sınır beyleri tahkimatlar ve garnizonlar ile sınırları korur."
 marches_effect_desc: "Özel [Concept('raid_intents', 'Yağma Niyetlerinin')|E] ihtimalini azaltır"
 marches_effect_2_desc: "Özel [Concept('raid_intents', 'Yağma Niyetlerini')|E] engeller"
 building_march_01:0 "Stratejik Tahkimatlar"
 building_march_01_desc:0 "Düklüğün en zayıf noktalarını koruması için sınır beyleri görevlendirilir. Sayıları az da olsa erken uyarı sistemi olarak işe yararlar ve arada sırada kaçakçı yakalarlar."
 building_march_02:0 "Sınır Tahkimatları"
 building_march_02_desc:1 "Sınır beyi sistemi tüm sınıra yaydırılır ve böylece savunma hattı oluşturulmuş olur."
 building_march_03:0 "Büyük Tahkimatlar"
 building_march_03_desc:0 "Düklükte inşa edilen büyük sınır beyi tahkimatları düşman güçlerin ilerlemesini ciddi ölçüde yavaşlatır."
 building_type_siege_works_01:0 "Kuşatma Çadırları"
 building_type_siege_works_01_desc:0 "Kuşatma çadırları sayesinde hükümdarlar yüksek kalite kuşatma silahları elde edip bunları tamir ettirebilir."
 building_siege_works_01:0 "Kuşatma Atölyeleri"
 building_siege_works_01_desc:1 "Kuşatma atölyeleri özelleştirilmiş prosedürler sayesinde kuşatma silahlarının daha hızlı bir şekilde hazırlanabilmesini sağlar."
 building_siege_works_02:0 "Mancınık Mühendisleri"
 building_siege_works_02_desc:1 "Kuşatma teknolojisinin en gelişmiş silahları olan mancınıkların doğru bir şekilde kullanılabilmesi için özel bir mühendis grubu gerekir."
 building_siege_works_03:0 "Top Dökümhanesi"
 building_siege_works_03_desc:1 "Toplar savaş sahnesine en son giriş yapan silahlardır. Gürültülü, ağır, manevra yapması zor olan bu silahlar taştan yapılma tahkimatlara karşı çok etkilidir. Toplara sahip olmak bizi düşmanlarımıza karşı avantajlı hâle getirir."
 building_type_royal_armory_01:0 "Kraliyet Cephanelikleri"
 building_type_royal_armory_01_desc:2 "Kraliyet tarafından desteklenen cephanelikler ordunun kullanacağı silahların istikrarlı bir şekilde tedarik edilmesini ve bu silahların bakımını sağlar."
 building_royal_armory_01:0 "Silah Depoları"
 building_royal_armory_01_desc:1 "Savaş zamanlarında köylü milisler depolardan silahlanabilir. Bu silahlar genellikle paslı baltalar, mızrak parçaları ve körelmiş kılıçlardan oluşsa da biraz bakımla köylülerin kullandığı tarım araç gereçlerinden çok daha etkili hâle getirilebilirler."
 building_royal_armory_02:0 "Kraliyet Silahhanesi"
 building_royal_armory_02_desc:1 "Silahhaneler savaşta kullanılmak için silah toplayıp bunların bakımını yapar. Silahlar iyi kalitededir ve her işe yaramaz sarhoşu uzaktan bakınca becerikli görünen bir askere dönüştürebilir."
 building_royal_armory_03:0 "Büyük Kraliyet Cephanelikleri"
 building_royal_armory_03_desc:1 "Büyük Kraliyet Cephanelikleri kısa sürede sayısız köylü milisi silahlandırmaya ve bölgedeki en iyi paralı askerleri çekmeye yetecek miktarda silaha ev sahipliği yapar."
 building_type_jousting_lists_01:0 "Mızrak Dövüşü Alanları"
 building_type_jousting_lists_01_desc:0 "Mızrak dövüşüne özel alanlar yaratarak orduya katılan süvari ve şövalye sayısı arttırılmaya çalışılır."
 building_jousting_lists_01:0 "Mızrak Dövüşü Alanı"
 building_jousting_lists_01_desc:0 "Süvarilerin ve şövalyelerin talim yapabileceği bir alan yıl boyunca açık ve düzenli tutulur."
 building_jousting_lists_02:0 "Turnuva Alanları"
 building_jousting_lists_02_desc:0 "Mızrak dövüşü turnuvaları ve turnuvayı izleyecek halk için oturaklar ile turnuva alanları çok sayıda katılımcı çeker."
 building_jousting_lists_03:0 "Kraliyet Turnuva Arenaları"
 building_jousting_lists_03_desc:0 "Soylu konuklar için geliştirilmiş oturaklar ve daha büyük panayır alanı ile bu turnuva arenası oldukça etkileyici."
 building_type_blacksmiths_01:1 "Demirciler"
 building_type_blacksmiths_01_desc:0 "Kraliyet tarafından tutulan demirciler, kraliyet muhafızları için silah ve zırh yapar. Böylece yüksek kalite silahların üretimini güvenceye alırız."
 building_blacksmiths_01:1 "Kraliyet Demircileri"
 building_blacksmiths_01_desc:1 "En iyi ve üretken demirciler kraliyet tarafından kraliyet muhafızları için kılıçlar, zırhlar ve kargılar üretmesi için işe alınır."
 building_blacksmiths_02:0 "Demirci Loncaları"
 building_blacksmiths_02_desc:0 "Demirci localarıyla birlikte hareket ederek çok sayıda ekipmanı ucuza sipariş edebiliriz."
 building_blacksmiths_03:0 "Kraliyet Demirhaneleri"
 building_blacksmiths_03_desc:0 "Tek amaçları kraliyet için silah yaratmak olan büyük demirhanelerde sadece en iyi demirciler çalışabilir."
 building_type_archery_ranges_01:0 "Okçuluk Alanları"
 building_type_archery_ranges_01_desc:0 "Özel okçuluk alanları sayesinde halk yaylar ile talim yapabilir ve tecrübeli okçular da becerilerini geliştirebilir."
 building_archery_ranges_01:0 "Ok Talim Alanı"
 building_archery_ranges_01_desc:0 "Ok atış alanlarında zengin fakir herkes talim yapabilir. Bunun nedeni ok atabilen köylülerin savaşta daha yararlı olması ve soyluların da turnuvalar için alıştırma yapabilmesidir."
 building_archery_ranges_02:0 "Kraliyet Yaycıları"
 building_archery_ranges_02_desc:1 "En iyi yaycılar kraliyet tarafından işe alınır ve amaca özel yüksek kalite yay yapabilirler."
 building_archery_ranges_03:0 "Nişancı Atış Alanları"
 building_archery_ranges_03_desc:0 "Köylüleri özendirmek ve nişancılarımızı geliştirmek için bu özel atış alanları uzun mesafeli okçuluk için tasarlandı."
 building_type_tax_assessor_01:0 "Vergi İdareleri"
 building_type_tax_assessor_01_desc:0 "Köylülerden vergi toplamak yorucu bir iş. Özel vergi idareleri kurarak daha iyi vergi toplayabiliriz."
 building_tax_assessor_01:0 "Vergi Tahakkuk Memurları"
 building_tax_assessor_01_desc:0 "Altınla veya çeşitli ürünlerle göreceli bir vergi ödemek her köylünün görevidir. Vergi tahakkuk memurlarımız ödenilen vergilerin bizim için yeteri kadar 'göreceli' olduğundan emin olur. Neyse ki köylülerin çoğu okuma yazma bilmiyor."
 building_tax_assessor_02:0 "İcra Memurları"
 building_tax_assessor_02_desc:0 "Köylülerin vergilerini ödemesini sağlamanın en iyi yolu ödemediklerinde mallarını alıp kendilerini zindana atmaktır. Bunlar her zaman bizim yanımızda olan icra memurlarının görevidir."
 building_tax_assessor_03:0 "Vergi Yargıçları"
 building_tax_assessor_03_desc:0 "Köylülerden vergi almak kolay olsa da zengin toprak sahiplerine baskı yapmak daha zor. Sadık yargıçlarımız tarafından yönetilen karmaşık bir idari ağ kurarak en zengin vasallarımızın bile gereken vergileri ödemesini sağlarız."
 building_type_leisure_palace_01:0 "Tatil Sarayları"
 building_type_leisure_palace_01_desc:0 "Tek bir lüks kalede kalmak iyi iken birkaç tanesine daha sahip olmak daha iyidir."
 building_leisure_palace_01:0 "Şato"
 building_leisure_palace_01_desc:0 "Sorumlulukların yükü çok fazla geldiğinde (veya köylüler duvarları aşmaya başladığında) tatil yapmak için uzaklardaki kırsal bir şato gibisi yoktur."
 building_leisure_palace_02:0 "Yaz Sarayı"
 building_leisure_palace_02_desc:0 "Yaz sarayları düklüğün güzel yerlerinde, köylülerin sıradan hayatlarından uzakta bulunur. Gücümüzü, prestijimizi ve herkesten üstün olduğumuzu göstermenin daha iyi bir yolu yoktur."
 building_leisure_palace_03:0 "Kış Sarayı"
 building_leisure_palace_03_desc:0 "Kış sarayı, yılın zorlu aylarında hükümdarın ailesine ev sahipliği yapmak için tasarlanmıştır. Dolu kileri ve savunaklı pozisyonu ile yakında çalışma ayrıcalığına sahip olan herkesin tepesinde dikilir."
 building_type_royal_forest_01:0 "Kraliyet Koruma Alanları"
 building_type_royal_forest_01_desc:0 "Kraliyet ormanları oldukça güzel bir zenginlik kaynağıdır. Bölgedeki yasayı çiğneyip, yerel halkın haklarını ellerinden alıp para karşılığı geri satmanıza izin verir. Avlanmanın zevkli olduğunu da söylemeye gerek yok."
 building_royal_forest_01:0 "Kraliyet Ormanları"
 building_royal_forest_01_desc:0 "Bu düklükteki büyük orman alanları kraliyet ailesi için ayrılmıştır. Köylüler bu ormanlarda yaşayamaz, avlanamaz ve ağaçları kesemez. Yoldan geçen vergi tahakkuk memurlarına saldırmak da özellikle yasaktır."
 building_royal_forest_02:0 "Geniş Kraliyet Ormanları"
 building_royal_forest_02_desc:0 "Kasabalar artık kraliyet ormanları ile çevrelenmiş durumda. Kasaba ve köy sakinleri, hükümdarın adamlarının 'bulduğu' haritalara göre kraliyet ormanlarında yaşama yanlışı yapmıştır."
 building_royal_forest_03:0 "Kraliyet Ormanı Mahkemeleri"
 building_royal_forest_03_desc:0 "Yasalar sadece onu uygulayan sistem kadar iyidir. Kraliyet ormanları da artık her emri gerçekleştirebilen mahkeme sistemine, yargıçlara, bekçilere ve kâtiplere sahip."
 building_type_royal_garden_01:0 "Kraliyet Bahçeleri"
 building_type_royal_garden_01_desc:0 "Pek az yer güzel bir bahçe kadar rahatlama ve sosyalleşme imkânı sağlar. Küçük bir bahçe birçok kişi için yeterli olsa da, zengin ve güçlü kişiler dikkat çekici güzellikler görmek ister."
 building_royal_garden_01:0 "Kapalı Bahçe"
 building_royal_garden_01_desc:0 "Etrafı taş duvarlarla kapatılmış küçük bahçe. Dış dünya ile olan bağı keserek huzur ve rahatlık ortamı sağlar."
 building_royal_garden_02:0 "Bahçe Kompleksi"
 building_royal_garden_02_desc:0 "Pahalı ve etkileyici bu bahçede çiçekler, bitkiler, meyve ağaçları ve daha niceleri bulunur. Bir bahçıvan ordusuyla idare edilen bu bahçe sürekli ilgi görür."
 building_royal_garden_03:0 "Kraliyet Parkı"
 building_royal_garden_03_desc:0 "Kraliyet parkı çevredeki araziye göre özenle hazırlanmış geniş ve etkileyici bir bahçedir. Herkese açıktır ve ziyaretçilerde hayranlık uyandırır."
 building_type_ananda_temple_01:0 "Ananda Tapınağı"
 building_type_ananda_temple_01_desc:0 "Paganlar şehirde ve etraftaki düzlüklerde binlerce pagodaya, tapınağa ve türbeye sahip olsa da Ananda Tapınağı hepsinden ayrılır. Mükemmel bir şekilde inşa edilmiş yapı birçok özgün levha ve taş oymalar barındırır. Bir ibadethane ve ilahiyat eğitimi merkezidir."
 building_ananda_temple_01:0 "$building_type_ananda_temple_01$"
 building_ananda_temple_01_desc:0 "$building_type_ananda_temple_01_desc$"
 building_type_hotin_fort_01:0 "Hotin Kalesi"
 building_type_hotin_fort_01_desc:0 "Hotin Kalesi, Dinyester Nehri'nin kıyısına inşa edilmiş küçük bir kaledir. Konumu sayesinde ticaret yollarını koruyor ve nehrin kontrol edilmesini sağlıyor."
 building_hotin_fort_01:0 "Hotin Kalesi"
 building_hotin_fort_01_desc:0 "$building_type_hotin_fort_01_desc$"
 building_hotin_fort_02:0 "Hotin Hisarı"
 building_hotin_fort_02_desc:0 "Eski kaleyi harabe gibi gösteren ihtişamlı bir hisar. Yüzyıllar boyunca devam eden inşaatlar sonrası hisar yüksek taş duvarlara, geniş bir hendeğe ve devasa kulelere sahip oldu. Hisar sayesinde kuşatmaya gelen ordularun büyük çoğunluğu eli boş döner."
 building_type_golden_gate_of_kiev_01:1 "Kiev'in Altın Kapısı"
 building_type_golden_gate_of_kiev_01_desc:1 "Konstantinopolis'teki bir kapıdan esinlenip inşa edilen ve adı koyulan Kiev'in Altın Kapısı, zafer takı olarak da kullanılır. Kapının üzerine inşa eden kilisenin altın kubbesi çok uzaklardan bile görülmesini sağlar ve kapıyı Kiev'in önemli bir sembolü yapar."
 building_golden_gate_of_kiev_01:0 "$building_type_golden_gate_of_kiev_01$"
 building_golden_gate_of_kiev_01_desc:0 "$building_type_golden_gate_of_kiev_01_desc$"
 building_type_heddal_stave_church_01:0 "Heddal Çıta Kilisesi"
 building_type_heddal_stave_church_01_desc:0 "Heddal Çıta Kilisesi, Norveç'teki en büyük çıta kilisedir ve mükemmel bir ahşap iç mimariye sahiptir. Efsanelere göre kilise, bir dağ trolü tarafından sadece üç günde inşa edilmiştir."
 building_heddal_stave_church_01:0 "$building_type_heddal_stave_church_01$"
 building_heddal_stave_church_01_desc:0 "$building_type_heddal_stave_church_01_desc$"
 building_type_temple_of_uppsala_01:0 "Uppsala Tapınağı"
 building_type_temple_of_uppsala_01_desc:0 "Uppsala Tapınağı, İskandinavya'nın büyük bir kesiminin dinî merkezi olarak görülür. Tapınağın yanındaki kutsal ağaç ve kuyu nedeniyle burayı İskandinav mitolojisindeki evrenin merkezi olan Yggdrasil'e benzetenler vardır."
 building_temple_of_uppsala_01:0 "$building_type_temple_of_uppsala_01$"
 building_temple_of_uppsala_01_desc:0 "$building_type_temple_of_uppsala_01_desc$"
 building_temple_of_uppsala_02:0 "Uppsala Katedrali"
 building_temple_of_uppsala_02_desc:0 "Güney Avrupa'daki katedrallere rakip olabilmesi için inşa edilen azametli ve görkemli Uppsala Katedrali'nde, birçok önemli İsveç hükümdarının mezarı ve çeşitli kutsal emanetler bulunur."
 building_type_lund_cathedral_01:0 "Lund Katedrali"
 building_type_lund_cathedral_01_desc:0 "Lund Katedrali, taş heykellerle donatılmış ihtişamlı bir kilisedir. Almanya'daki birçok kiliseyle ortak noktaları olan katedral, Romanesk mimariden esinlenerek inşa edilmiştir. Lund'un koruyucu azizi olan Aziz Lawrence'a adanmıştır."
 building_lund_cathedral_01:0 "$building_type_lund_cathedral_01$"
 building_lund_cathedral_01_desc:0 "$building_type_lund_cathedral_01_desc$"
 building_type_danevirke_01:0 "Danevirke"
 building_type_danevirke_01_desc:1 "Danevirke, Avrupa'dan Danimarka'ya yapılan saldırıları önlemek için inşa edilen geniş çaplı toprak tahkimatlardır. İnşa edildiğinden sonra pek çok kez genişletilmiş ve geliştirilmiştir."
 building_danevirke_01:0 "$building_type_danevirke_01$"
 building_danevirke_01_desc:0 "$building_type_danevirke_01_desc$"
