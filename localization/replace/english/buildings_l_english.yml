 building_type_hetian_mines_01: "Hotan Madenleri"
 building_type_hetian_mines_01_desc: "Hotan, zamanın başlangıcından beri Hetian yeşimi kaynağı olmuştur. Bu değerli beyaz taş, tüm yeşimler arasında en çok rağbet görenidir, pek çok kişi için altın ya da gümüşten bile daha kıymetlidir. Yeşim hem doğrudan dağdan çıkarılır, hem de açık ocaklardan ve nehir yataklarından toplanır."
 building_hetian_mines_01: "Hotan Maden Yerleşimi"
 building_hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
 building_hetian_mines_02: "Hotan Madeni"
 building_hetian_mines_02_desc: "Maden yerleşimi büyüdükçe, giderek daha fazla yeşim çıkarılmaktadır. Bu değerli taşların ünü arttıkça, yetkin mühendislerin ve tüccarların artan akını işletmenin kârlılığını büyük ölçüde yükseltir."
 building_hetian_mines_03: "Büyük Hotan Madeni"
 building_hetian_mines_03_desc: "Madencilik faaliyetleri büyüdükçe madenlerin kendisi de büyür. Daha fazla insan madencilikte istihdam edilir ve yeşimin çıkarıldığı çok sayıdaki noktaya gidiş geliş artık manzaranın sürekli bir parçası hâline gelir."
 building_hetian_mines_04: "Hotan Madencilik Kompleksi"
 building_hetian_mines_04_desc: "Zamanla yeşim, bu bölgenin yalnızca başlıca ihracatı değil, aynı zamanda pek çok zanaatkâr ve ustanın geçim kaynağı hâline gelmiştir. Artık sokakları atölyeler ve yeniden satıcılar gibi gerçek bir endüstri doldurur."
 building_type_dushan_mines_01:0 "Dushan Madenleri"
 building_type_dushan_mines_01_desc:0 "Çin'in dört büyük yeşiminden biri olan Dushan, Han Hanedanı'ndan beri bir yeşim madenciliği merkezidir. Diğer yeşim türlerinden, daha zengin bir renge sahip olması ve bu rengin çoğu zaman diğer türlere kıyasla daha karışık tonlar taşımasıyla ayrılır."
 building_dushan_mines_01:0 "Dushan Maden Yerleşimi"
