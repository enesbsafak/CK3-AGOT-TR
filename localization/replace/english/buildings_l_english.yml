 building_hakata_port_01: "Hakata Limanı" # 博多
### TODO AGOT-CHANGED: building_hakata_port_01_desc [AGOT: Since the earliest days of the Yamato, the port city of Hakata on KyÅ«shÅ«'s northern shore has been a naval gateway, a bustling nexus overseen by the nearby Dazaifu office, where traders sell goods from far-off lands and diplomatic delegations step onto Japan's shores. | TR: Yamato'nun en erken günlerinden beri, Kyūshū'nun kuzey kıyısındaki Hakata liman şehri bir deniz kapısıdır, yakınlardaki Dazaifu dairesi tarafından gözetilen, uzak diyarlardan gelen malların satıldığı ve diplomatik heyetlerin Japon kıyılarına ayak bastığı canlı bir kesişme noktasıdır.]
 building_hakata_port_01_desc: "Since the earliest days of the Yamato, the port city of Hakata on KyÅ«shÅ«'s northern shore has been a naval gateway, a bustling nexus overseen by the nearby Dazaifu office, where traders sell goods from far-off lands and diplomatic delegations step onto Japan's shores."
