 building_parthenon: "Partenon"
 building_parthenon_desc: "Kudretli Athena'nın kutsal tapınağı, aptal batıl inançların temizlenmesinden sonra bir kez daha gururla ayakta duruyor.\nBin yıldan daha uzun bir süre önce dikilmiş bu görkemli sütunlar ve duvarlar, şehre adını veren ve şehri kutsayan Bakire Tanrıça'nın sessiz bir sembolü olarak inananların evlerini korumaktadır."
 building_type_parthenon: "$building_parthenon$"
 building_type_parthenon_desc: "$building_parthenon_desc$"
 building_hagios_demetrios: "Aya Dimitri"
 building_hagios_demetrios_desc: "Aya Dimitri Kilisesi şehirdeki en önemli tapınaktır.\nMesih'e olan inanç daha yeni başlamışken ortaya çıkan bu yapı, Aziz Dimitri'nin diğer birçok ilk inananla birlikte hapsedildiği, şehit edildiği ve gömüldüğü Roma hamamını da barındırmaktadır."
 building_type_hagios_demetrios: "$building_hagios_demetrios$"
 building_type_hagios_demetrios_desc: "$building_hagios_demetrios_desc$"
 building_kassiopi_castle: "Kassiopi Kalesi"
 building_kassiopi_castle_desc: "Kıyıdaki heybetli bir tahkimat. Adayı anakaradan ayıran kanala yakın olduğu için, İyon Adaları bölgesinde önemli bir kontrol noktasıdır."
 building_type_kassiopi_castle: "$building_kassiopi_castle$"
 building_type_kassiopi_castle_desc: "$building_kassiopi_castle_desc$"
 building_saint_lazarus: "Aziz Lazarus Kilisesi"
 building_saint_lazarus_desc: "Bir zamanlar İsa tarafından ölümden diriltilen Beytanyalı Lazarus'un, ikinci ölümünün ardından Larnaka'ya gömüldüğü söylenir.\nMezar yüzyıllar boyunca saklı kalmış ancak bulunduktan sonra İmparator VI. Leo, azizin kalıntılarını Konstantinopolis'e taşıtmış ve mezarın üzerine bu görkemli kiliseyi inşa ettirmiştir."
 building_type_saint_lazarus: "$building_saint_lazarus$"
 building_type_saint_lazarus_desc: "$building_saint_lazarus_desc$"
 building_type_sumela_monastery_01: "Sümela Manastırı"
 building_type_sumela_monastery_01_desc: "Karadağ'daki sarp bir uçuruma inşa edilen bu manastırın kökenleri gizemlidir, 4. yüzyılda İmparator Theodosius'un emriyle inşa edildiği söylenir, ancak kutsal pınarı ve antik freskleri daha da eski olabilir.\nManastırın en etkileyici eseri, Havari Luka'nın kendi elleriyle boyadığı söylenen bir Meryem Ana freskidir."
 building_sumela_monastery_01: "$building_type_sumela_monastery_01$"
 building_sumela_monastery_01_desc: "Manastır harabe hâline geldikten sonra birkaç imparator tarafından restore edilmiş ve genişletilmiştir. General Belisarius'un müdahalesi yoluyla İmparator Justinianus mevcut yapıya ana katkıyı yapan kişi olmuştur."
 building_sumela_monastery_02: "Yenilenmiş $building_type_sumela_monastery_01$"
 building_sumela_monastery_02_desc: "Manastırın son kez yenilenmesinin üzerinden yüzyıllar geçti. En son müdahalede yeni binalar inşa edebilmek için manastıra daha fazla arazi, vergi muafiyeti ve imparatorluk bütçesi verilmiştir. Bundan en çok yararlanan, tamamen yeni freskler ile donanmış kaya kilisesi olmuştur."
 building_patras_castle: "Patra Kalesi"
 building_patras_castle_desc: "Vodias Dağlarının bir tepesinde yükselen Patras şehrinin antik akropolü, İmparator Justinianus döneminde bir kaleye dönüştürülmüştür.\nKale o zamandan beri kesintisiz olarak kullanılmaktadır, Aziz Andrew'un ve bir Roma bakiresi heykeli olan #EMP genius loci#! Patrinella'nın koruması altındadır."
 building_type_patras_castle: "$building_patras_castle$"
 building_type_patras_castle_desc: "$building_patras_castle_desc$"
 building_maiden_tower: "Kız Kulesi"
 building_maiden_tower_desc: "Bu küçük kaya, Bosporus'un girişindeki ideal konumu sayesinde Atinalı Alkibiadıs zamanında bile bir gümrük binasına ev sahipliği yapıyordu.\nAdanın üzerindeki üstahkem bir kule artık Karadeniz'e gelip giden tüm deniz trafiğini kontrol edebilmektedir. Ayrıca kule ile Konstantinopolis arasına deniz seviyesinde yer alan büyük bir zincir çekilerek tehlikeli veya istenmeyen herhangi bir geminin geçişi etkili bir şekilde engellenebilmektedir."
 building_type_maiden_tower: "$building_maiden_tower$"
 building_type_maiden_tower_desc: "$building_maiden_tower_desc$"
 building_despot_palace: "Despotların Sarayı"
 building_despot_palace_desc: "Taygetus Dağı'nda, tahkim edilmiş Mistra şehrinin hemen üzerinde güvenli bir konumda bulunan görkemli bir saraydır.\nSaray, Konstantinopolis salonlarının ihtişamıyla yarışacak tüm lükslere sahiptir, yalnızca en zengin ve en nüfuzlu valilere layıktır."
 building_type_despot_palace: "$building_despot_palace$"
 building_type_despot_palace_desc: "$building_despot_palace_desc$"
 building_type_meteora_01: "Meteora"
 building_type_meteora_01_desc: "Meteora, Pindus Dağlarının hemen yanında yükselen doğal sütunların oluşturduğu nefes kesici bir kaya oluşumuna yerel halk tarafından verilen isimdir."
 building_meteora_01: "$building_type_meteora_01$"
 building_meteora_01_desc: "Meteora'nın doğal mağaralarında 9. yüzyılın başlarından beri keşişler yaşamaktadır. Buna rağmen insan yapımı hiçbir bina manzarayı değiştirmemiştir."
 building_meteora_02: "$building_type_meteora_01$"
 building_meteora_02_desc: "Meteora'nın oyuk tepelerine sığınan münzevi keşişlerin sayısı arttıkça, manastırların sayısı da artmaya başladı.\nYine de insanın doğa üzerindeki hâkimiyeti burada hâlâ zayıf. Manastırlara ulaşmak son derece zordur. Çoğunlukla sadece merdivenlerden, halatlardan ve #EMP dualardan#! yararlanılır, çünkü ekipmanların arızalanması durumunda hayatta kalmak mümkün değildir."
 building_type_mount_athos_01: "Athos Dağı"
 building_type_mount_athos_01_desc: "Meryem Ana, Kıbrıs'ta Hristiyanlığı yaymaya çalışan oğlunun arkadaşı Lazarus'u ziyaret etmek için Filistin'den yelken açtığında geminin rotadan çıktığı ve Athos Dağı'nın yanında karaya oturduğu söylenir. Meryem Ana bölgenin doğal güzelliğine hayran kalır ve burayı kutsayarak kendisine ait bir bahçe olmasını ister ve cennetten gelen bir ses onun dileğini yerine getirir. Dağın bulunduğu Aynoroz yarımadası o zamandan beri kutsal bölge kabul edilmiştir. Adaya başka hiçbir kadının girmesine izin verilmez."
 building_mount_athos_01: "$building_type_mount_athos_01$"
 building_mount_athos_01_desc: "Hristiyan topluluklar İmparator I. Konstantin zamanından beri bu kayalıklı burunda yaşamaktadır, Aynoroz'dan gelen keşişler Yedinci İznik Konsili'ne de katılmışlardır. Buna rağmen henüz düzgün bir manastır topluluğu veya kalıcı bir bina bulunmamaktadır."
 building_mount_athos_02: "$building_type_mount_athos_01$"
 building_mount_athos_02_desc: "Athanasios adında bir keşişin Aynoroz'a gelişi, yarımada genelinde birkaç manastırın inşaatını başlatır. Bu manastırların ilki, her ikisi de Beşaret'e adanmış olan Büyük Lavra ve Vatopedi'dir. Bu manastırlarla birlikte yerel manastır yaşamına da düzen ve kurallar getirilmiştir."
 building_mount_athos_03: "$building_type_mount_athos_01$"
 building_mount_athos_03_desc: "Aynaroz'un bir manastır merkezi olarak popülaritesi, ruhban olmayan yönetimler tarafından kendisine sunulan birçok imtiyaz, özerk statüsü, gerçekten izole edilmiş yaşam tarzı ve gelişen ikona üretimi, yüzyıllar boyunca sürekli yeni keşişlerin yarımadaya gelmesini sağlamıştır.\nKeşişlerin sayısı arttıkça manastırların sayısı da artmıştır. Athos Dağı'nda şu anda yirmi manastır bulunmaktadır ve Ayanoz böylece bölgedeki en büyük ve en etkili manastır topluluklarından biri hâline gelmiştir."
 building_apollinare_nuovo: "Yeni Aziz Apollinare Bazilikası"
### TODO AGOT-CHANGED: building_apollinare_nuovo_desc [AGOT: The Basilica of Sant'Apollinare Nuovo has only gained its current name recently, when the relics of Saint Apollinaris were transferred from the neighboring Basilica in Classe. Its history, however, is much longer.\nFirst consecrated in the early 6th century by King Theodoric of the Ostrogoths as an Arian church, the building has seen many renovations both in structure and decoration while maintaining its unique style â€” an elegant mixture of western and eastern art â€” and its amazing Byzantine mosaics. | TR: Yeni Aziz Apollinare Bazilikası, bugünkü adını yakın zamanda, Aziz Apollinare'nin beden kalıntıları komşu Classe'deki bazilikadan getirildiğinde almıştır. Ancak tarihi çok daha eskidir.\nİlk olarak 6. yüzyılın başlarında Ostrogot Kralı Theodoric tarafından bir Ariusçu kilisesi olarak kutsanan binada, hem yapı hem de dekorasyon açısından pek çok kez renovasyon yapılmıştır ancak Batı ve Doğu sanatının zarif bir karışımı olan benzersiz tarzını ve muhteşem Bizans mozaiklerini de korumuştur.]
 building_apollinare_nuovo_desc: "The Basilica of Sant'Apollinare Nuovo has only gained its current name recently, when the relics of Saint Apollinaris were transferred from the neighboring Basilica in Classe. Its history, however, is much longer.\nFirst consecrated in the early 6th century by King Theodoric of the Ostrogoths as an Arian church, the building has seen many renovations both in structure and decoration while maintaining its unique style â€” an elegant mixture of western and eastern art â€” and its amazing Byzantine mosaics."
 building_type_apollinare_nuovo: "$building_apollinare_nuovo$"
 building_type_apollinare_nuovo_desc: "$building_apollinare_nuovo_desc$"
 building_saint_catherine: "Azize Katerina Manastırı"
 building_saint_catherine_desc: "Çölün ortasında mütevazı ancak geçmişi uzun bir manastırdır. İmparator Konstantin'in annesi, Yanan Çalı'nın Musa'ya göründüğü yerde bir manastırın inşa edilmesini etmretmiştir. Daha sonra İmparator Justinianus döneniminde manastır müstahkem hâle getirilmiş ve Musa'nın Kuyusu'nu da içine alacak şekilde genişletilmiştir. Kuruluşundan ancak yüzyıllar sonra Azize Katerina'nın kalıntıları manastıra ulaşmış ve manastırın adı değişmiştir.\nManastır her zaman en eski ve en üretken yazıt ile ikona yapım merkezlerinden biri olmuştur."
 building_type_saint_catherine: "$building_saint_catherine$"
 building_type_saint_catherine_desc: "$building_saint_catherine_desc$"
 building_jvari_monastery: "Cvari Manastırı"
 building_jvari_monastery_desc: "Aziz Nino'nun Gürcistan'a Hristiyanlığı yayarken mucizevi bir haç diktiği yere inşa edilen eski bir manastırdır.\nBu kutsal yapı Kafkasların dört bir yanından hacıları kendine çeker."
 building_type_jvari_monastery: "$building_jvari_monastery$"
 building_type_jvari_monastery_desc: "$building_jvari_monastery_desc$"
 building_etchmiadzin_cathedral: "Vagharshapat Katedrali"
 building_etchmiadzin_cathedral_desc: "Bu antik katedral Ermeni Apostolik Hristiyanlığının tarihî merkezidir. Aziz Krikor Lusavoriç tarafından Ermenistan Krallığı'nın yeni kabul edilen dininin zaferini sembolize etmek için bir pagan tapınağı üzerine kurulan kilise, Sasanilerin işgali sırasında neredeyse tamamen yıkılmış ve birkaç yıl sonra temelden yeniden inşa edilmiştir.\nAncak 7. yüzyıldan beri katedral defalarca yağmalanmış ve terk edilmiş, harabeye dönüşmüştür. Eski ihtişamına döndürebilmek pahalı ve zorlu olacak."
 building_type_etchmiadzin_cathedral: "$building_etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc: "$building_etchmiadzin_cathedral_desc$"
 building_cattolica_stilo: "Cattolica di Stilo"
 building_cattolica_stilo_desc: "Bu yapıdaki güçlü Bizans etkisi kolayca görülebilir, kayaların üzerine yerleştirilmiş kırmızı tuğlalardan inşa edilmiş, "yazılı haç" planlı ve freskler oluşan zengin bir dekorasyon. Stilaro Deresinin geçtiği vadiye hâkim olan, vaftizhaneye sahip küçük bir kilisedir.\nKilise, insanın kendisini Tanrı'ya daha yakın hissedebileceği, düşmanca doğanın içinde izole olmuş bir mücevherdir."
 building_type_cattolica_stilo: "$building_cattolica_stilo$"
 building_type_cattolica_stilo_desc: "$building_cattolica_stilo_desc$"
 building_hosios_loukas: "Hosios Lukas"
 building_hosios_loukas_desc: "Manastır, münzevi keşiş Steirisli Saygıdeğer Luka'nın kalıntılarının korunması için inşa edilmiştir.\nKutsal kalıntıların mucizevi bir yağ yaydığı söylenir ve kuluçka yoluyla iyileşmek için mezarın yanında uyuyan sayısız hacıyı kendine çeker. İç dekorasyonu çağın en iyi sanatçıları tarafından mozaikler, ikonalar, avizeler, oymalar ve kumaşlarla zenginleştirilmiştir. Bunların kalitsi ve abartılığı nedeniyle Doğu Akdeniz boyunca övgüyle anılmaktadır."
 building_type_hosios_loukas: "$building_hosios_loukas$"
 building_type_hosios_loukas_desc: "$building_hosios_loukas_desc$"
 building_sofia_ohrid: "Azize Sofya Kilisesi"
 building_sofia_ohrid_desc: "Ohri katedrali Slavlar bu topraklara geldiğinde yıkılmış ve bölge güvenli bir şekilde Hristiyanlara geri dönene kadar yeniden inşa edilmemiştir.\nŞu an, çağın en iyi sanatçılarının freskleriyle şekilde dekore edilmiş kubbeli bir bazilikadır."
 building_type_sofia_ohrid: "$building_sofia_ohrid$"
 building_type_sofia_ohrid_desc: "$building_sofia_ohrid_desc$"
 building_fairy_chimneys: "Troglodit Yerleşimler"
 building_fairy_chimneys_desc: "Bu bölgedeki yumuşak kayalar nedeniyle birçok doğal oluşumlu koniler, tepeler ve mağaralar vardır.\nİnsanlar yüzyıllar boyunca bu yapılardan faydalanarak önce ahırlar, depolar, sığınaklar, ardından evler ve üretim binaları, son olarak da kaya konilerinin içine kiliseler inşa etmiş ve her şeye sahip yerleşimler ortaya çıkmıştır."
 building_type_fairy_chimneys: "$building_fairy_chimneys$"
 building_type_fairy_chimneys_desc: "$building_fairy_chimneys_desc$"
 building_cilician_gates: "Kilikya Kapısı"
 building_cilician_gates_desc: "Kilikya Kapısı, Kilikya ovalarını Anadolu platosuna bağlayan Toros Dağları'ndaki bir geçittir.\nTarihin başlangıcından beri bu geçit etrafına savunmalar inşa edilmiştir çünkü burayı kontrol etmek Küçük Asya ve Orta Doğu'nun ana ticarî ve askerî atardamarlarından birini kontrol etmek anlamına gelir."
 building_type_cilician_gates: "$building_cilician_gates$"
 building_type_cilician_gates_desc: "$building_cilician_gates_desc$"
 building_swahili_port_pemba: "Pemba Ticaret Limanları"
### TODO AGOT-CHANGED: building_swahili_port_pemba_desc [AGOT: The reefs, beaches, and mangrove forests of Pemba Island provide an abundance of inlets and resources for the people of Pemba, making it a natural entrepÃ´t of the Zanj. | TR: Pemba Adası'nın resifleri, kumsalları ve mangrov ormanları Pemba halkına çok sayıda koy ve kaynak sunar, bu da adayı Zenc'in doğal bir aktarma merkezi hâline getirir.]
 building_swahili_port_pemba_desc: "The reefs, beaches, and mangrove forests of Pemba Island provide an abundance of inlets and resources for the people of Pemba, making it a natural entrepÃ´t of the Zanj."
