 building_type_holy_site_prophetic_mosque_01:0 "Mescid-i Nebevî"
 building_type_holy_site_prophetic_mosque_01_desc:0 "Mescid-i Nebevî, diğer adıyla Peygamber Mescidi, Hz. Muhammed'in kendisi tarafından kurulan üstü açık bir camidir. Hz. Muhammed'in inşa ettirdiği ilk camilerden biri olan Mescid-i Nebevî, peygamberin evinin yakınına kurulmuştur."
