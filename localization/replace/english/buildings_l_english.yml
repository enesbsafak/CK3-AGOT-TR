 building_type_khiva_bazaar_01_desc: "$building_khiva_bazaar_01_desc$"
 building_khiva_bazaar_01: "Hive Çarşısı"
 building_khiva_bazaar_01_desc: "Bozkırın Kapısı olan mütevazı Hive şehri, sınırda kâr ya da talih arayan tüccar ve gezgin bolluğuyla dikkat çeker."
 building_khiva_bazaar_02: "Hive'nin Yaygın Çarşısı"
