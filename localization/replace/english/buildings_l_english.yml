 building_ratnapura_mines_02:0 "Ratnapura Madeni"
 building_ratnapura_mines_02_desc:1 "Maden ocakları genişletildi ve mücevher çıkarma işlemini gerçekten hızlandırabilmek için mühendisler getirildi."
 building_ratnapura_mines_03:0 "Büyük Ratnapura Madeni"
 building_ratnapura_mines_03_desc:0 "Birçok maden çukurunun etrafında bir köy oluştu ve işçiler düzenli olarak büyük mücevherler buluyor."
 building_ratnapura_mines_04:0 "Ratnapura Maden Kompleksi"
 building_ratnapura_mines_04_desc:0 "Mücevher çıkarma işi neredeyse endüstriyel bir Büyüklüğündea ulaştı ve çalışan sayısı artık binlerle ifade ediliyor. Görünüşe göre madenlerden sonsuz zenginlik akıyor."
 building_type_mogok_mines_01:0 "Mogok Vadisi Madenleri"
 building_type_mogok_mines_01_desc:0 "Mogok Vadisi yakutları ve safirleriyle ünlüdür, ayrıca spinel ya da granat gibi daha az değerli taşlar da çıkarılır.\nYakutlar vadisini miktardan bile fazla öne çıkaran şey, taşların kalitesidir. Toprağın derinliklerinden çıkarılan koyu kızıl taşlar, yakıcı güneşin altında eşi benzeri olmayan bir ışıltıyla parıldar."
 building_mogok_mines_01:0 "Mogok Maden Ocakları"
 building_mogok_mines_01_desc:0 "$building_type_mogok_mines_01_desc$"
 building_mogok_mines_02:0 "Mogok Madeni"
 building_mogok_mines_02_desc:1 "Maden ocakları genişletildi ve değerli taş çıkarımını gerçekten arttırabilmek için mühendisler getirildi."
 building_mogok_mines_03:0 "Büyük Mogok Madeni"
 building_mogok_mines_03_desc:0 "Birçok maden ocağının çevresinde bir köy filizlendi ve işçiler düzenli olarak iri değerli taşlar buluyor."
 building_mogok_mines_04:0 "Mogok Madencilik Kompleksi"
 building_mogok_mines_04_desc:0 "Değerli taş çıkarımı neredeyse endüstriyel bir ölçeğe ulaştı, işçi sayısı artık binlerle ifade ediliyor. Madenlerden bitmek bilmez zenginlikler akıyor gibi görünüyor."
 building_type_zawar_mines_01:0 "Zawar Madenleri"
 building_type_zawar_mines_01_desc:0 "Zawar madenleri binlerce yıldır zengin bir Kurşun, Çinko ve Gümüş kaynağı olmuştur. Zawar'daki yataklar sadece bolluklarıyla değil, aynı zamanda cevherlerin daha gelişmiş metalürjik işlemler olmaksızın elle birbirinden ayrılmasını mümkün kılacak şekilde net bir şekilde ayrılmış olmalarıyla da benzersizdir."
