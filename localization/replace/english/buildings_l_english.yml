 building_type_holy_site_cologne_cathedral_01:0 "Köln Katedrali"
 building_type_holy_site_cologne_cathedral_01_desc:0 "Üç müneccimin naaşlarını barındıran Köln Katedrali tüm Hristiyan dünyasından hacıları çekiyor. Katedral Gotik mimarisi ile inşa edilmiş, kuleler ve birçok büyüleyici detayla süslenmiş."
 building_holy_site_cologne_cathedral_01:0 "$building_type_holy_site_cologne_cathedral_01$"
 building_holy_site_cologne_cathedral_01_desc:0 "$building_type_holy_site_cologne_cathedral_01_desc$"
 building_type_holy_site_canterbury_cathedral_01:1 "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_01_desc:1 "Romalı misyoner ve daha sonra başpiskopos olan Augustinus, kasabayı Kent'teki piskopos makamı olarak seçtikten sonra Canterbury Katedrali'ni inşa ettirmiştir. Katedral sayesinde şehrin önemi artmış ve İngiliz kilisesi üzerindeki otorite olmuştur."
 building_holy_site_canterbury_cathedral_01:1 "Canterbury Bazilikası"
 building_holy_site_canterbury_cathedral_01_desc:0 "$building_type_holy_site_canterbury_cathedral_01_desc$"
 building_type_holy_site_canterbury_cathedral_02:0 "$building_type_holy_site_canterbury_cathedral_03$"
 building_type_holy_site_canterbury_cathedral_02_desc:0 "Katedral zamanın geçişine ve sert koşullara karşı dokunulmaz değil. Norman tarzı, bir yangının neden olduğu hasarı onarmak için seçilmiş. Yeni haç biçimli nef önceki bazilikanın yerini almış ve daha sonra serbest duran bir çan kulesi eklenmiştir."
 building_holy_site_canterbury_cathedral_02:0 "Canterbury Tapınağı"
 building_holy_site_canterbury_cathedral_02_desc:0 "$building_type_holy_site_canterbury_cathedral_02_desc$"
 building_type_holy_site_canterbury_cathedral_03:0 "Canterbury Katedrali"
 building_type_holy_site_canterbury_cathedral_03_desc:0 "Katedrale verilen ciddi hasar tekrardan bir yeniden inşa projesi gerektirdi. Bazı bölümlerde Norman dokusu korunmuş olsa da, yapıyı yükseltmek için popüler Gotik tarz seçildi."
 building_holy_site_canterbury_cathedral_03:0 "$building_type_holy_site_canterbury_cathedral_02$"
 building_holy_site_canterbury_cathedral_03_desc:0 "$building_type_holy_site_canterbury_cathedral_02_desc$"
 building_type_doges_palace_01:0 "Palazzo Ducale"
 building_type_doges_palace_01_desc:0 "Doçe'nin Sarayı da denilen Palazzo Ducale, Venedik Cumhuriyeti hükûmetine ev sahipliği yapar. Etkileyici bir yapı olan köşk, konseye, senatoya, idari ve adalet işlerine özel olarak ayrılan çeşitli salonlar içerir."
 building_doges_palace_01:0 "$building_type_doges_palace_01$"
 building_doges_palace_01_desc:0 "$building_type_doges_palace_01_desc$"
 building_type_visby_ringmur_01:0 "Visby Şehir Surları"
 building_type_visby_ringmur_01_desc:0 "Visby Şehir Surları şehri yağmacılar veya Danimarkalılar gibi dış tehditlerden korur. Ayrıca vergi almak için gelen kişileri de etkili bir şekilde uzak tutar. Şehre ulaşmak isteyen düşmanlar önce her birinde okçular bulunan onlarca kuleyi geçmek zorunda."
 building_visby_ringmur_01:0 "$building_type_visby_ringmur_01$"
 building_visby_ringmur_01_desc:0 "$building_type_visby_ringmur_01_desc$"
 building_type_walls_of_benin_01:0 "Benin Surları"
 building_type_walls_of_benin_01_desc:0 "Benin Surları, Benin'in tamamının etrafını kaplayan devasa toprak duvarlardır #low (Edo dilinde İya denilir)#!. Bu surlar bir su yolu gibi tasarlanmıştı, içinde hendekler kazılmışken dışında toprak duvarlar bulunur."
 building_walls_of_benin_01:0 "$building_type_walls_of_benin_01$"
 building_walls_of_benin_01_desc:0 "$building_type_walls_of_benin_01_desc$"
 building_type_the_friday_mosque_01:0 "İsfahan Cuma Camii"
 building_type_the_friday_mosque_01_desc:0 "İsfahan Cuma Camii, Emevîler tarafından inşa edilmişti. Minarelerden birinin halifenin kendisi tarafından yapıldığı ve cami olmadan önce Zerdüştçülerin bir ibadethanesi olduğu söylenir."
 building_the_friday_mosque_01:0 "$building_type_the_friday_mosque_01$"
 building_the_friday_mosque_01_desc:0 "$building_type_the_friday_mosque_01_desc$"
 building_type_brihadeeswarar_temple_01:0 "Brihadeeswarar Tapınağı"
 building_type_brihadeeswarar_temple_01_desc:0 "Hindu tanrısı Şiva'ya adanan Brihadeeswarar Tapınağı, Dravid mimari tarzında inşa edilmiş en büyük Güney Hint tapınaklarından biridir. Tapınağın ismi 'Yüce Şiva Efendi Tapınağı' anlamına gelen Sanskritçe bir birleşik kelimedir."
 building_brihadeeswarar_temple_01:0 "$building_type_brihadeeswarar_temple_01$"
 building_brihadeeswarar_temple_01_desc:0 "$building_type_brihadeeswarar_temple_01_desc$"
 building_type_holy_site_mahabodhi_temple_01:0 "Mahabodhi Tapınağı"
 building_type_holy_site_mahabodhi_temple_01_desc:0 "Mahabodhi Tapınağı'nın Buda'nın aydınlandığı yere inşa edildiği söylenir. Bölge hem Budist hem de Hindu hacılar için çok önemlidir. Tapınağın inşaatı 200 yıllarında İmparator Asoka tarafından başlatılmış olup o zamandan bu yana birçok kez geliştirilmiş ve restore edilmiştir."
 building_holy_site_mahabodhi_temple_01:0 "$building_type_holy_site_mahabodhi_temple_01$"
 building_holy_site_mahabodhi_temple_01_desc:0 "$building_type_holy_site_mahabodhi_temple_01_desc$"
 building_type_holy_site_great_mosque_of_cordoba_01:0 "Kurtuba Camii"
 building_type_holy_site_great_mosque_of_cordoba_01_desc:0 "Kurtuba Camii, Vizigot Krallığı'nın Müslümanlar tarafından fethedilmesinden sonra bir Hristiyan kilisesinin üzerine inşa edilmiştir. İbadethane ilk başta hem Müslümanlar hem de Hristiyanlar tarafından ortak kullanılıyordu ama daha sonra yer açmak için Hristiyan kısmı satın alınıp yıkılmıştır."
