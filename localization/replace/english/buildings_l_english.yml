 building_type_herat_bazaar_01_desc: "$building_herat_bazaar_01_desc$"
 building_herat_bazaar_01: "Herat Çarşısı"
 building_herat_bazaar_01_desc: "Herat'ın hareketli pazarları, kadim Ahamenişlerin ona #italic Haraiva#! dediği zamanlardan beri nam salmıştır. Her gün şehre girip çıkan kervanlar, Herat çarşılarını Horasan'ın İncisi olarak damgalar."
 building_herat_bazaar_02: "Herat'ın Yaygın Çarşısı"
 building_herat_bazaar_02_desc: "Herat'ın çarşıları ticaret ve alışverişle taşar. Horasan'ın İncisi, herhangi bir tacın üzerindeki en iyi parlatılmış mücevherden bile daha ince ışıldar."
 building_type_dvin_shuka_01: "$building_dvin_shuka_01$"
 building_type_dvin_shuka_01_desc: "$building_dvin_shuka_01_desc$"
 building_dvin_shuka_01: "Dvin Şukası"
 building_dvin_shuka_01_desc: "Dvin'in saygın pazarı, zamanın başlangıcından beri Ermeni ticaretinin büyük merkezi olarak hizmet etmiştir. Duvarları renkli çiniler ve boyalı sıvalarla süslüdür, bu kadim pazar yerinin zenginliğini ve itibarını yansıtır."
 building_dvin_shuka_02: "Dvin'in Yaygın Şukası"
