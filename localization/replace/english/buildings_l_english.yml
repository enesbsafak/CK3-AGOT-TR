 building_type_holy_site_great_mosque_of_mecca_01:0 "Mescid-i Haram"
 building_type_holy_site_great_mosque_of_mecca_01_desc:0 "Mekke'de bulunan Mescid-i Haram, surları kutsal Kâbe'yi çevreleyen devasa ve antik bir yapıdır. Birçok büyük sultan camiyi ve etrafını genişletmiştir. Her Müslüman Hac sırasında burayı ziyaret etmelidir."
 building_holy_site_great_mosque_of_mecca_01:0 "$building_type_holy_site_great_mosque_of_mecca_01$"
