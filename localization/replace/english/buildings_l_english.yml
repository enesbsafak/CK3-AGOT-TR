 building_type_holy_site_fire_temple_01: "Büyük Ateş Tapınağı"
 building_type_holy_site_fire_temple_01_desc: "Bu muazzam yapı içerisinde "Zafer Ateşi" olarak bilinen #italic Ateş-i Behram#! yanmaktadır. En büyük ve en saf ateş olarak bilinen bu ateş içerisinde yıldırımdan, kraliyet mumlarından, ölü yakmaktan, altın dövmekten gelen ateşler bulunur. Bu harikayı görmek için uzak diyarlardan hacılar gelirken, büyücüler ise burada sonu gelmeyen arınma ritüellerini gerçekleştirirler."
