 building_type_hwangnyongsa_01_desc: "$building_hwangnyongsa_01_desc$"
 building_hwangnyongsa_01: "Hwangnyong Tapınağı" # 皇龍寺 (황룡사)
 building_hwangnyongsa_01_desc: "7. yüzyılda tamamlanan Hwangnyongsa, yani 'İmparatorluk Ejderha Tapınağı', Silla Kralı Jin-heung tarafından Budist öğretinin ve gücün merkezi olarak inşa edilmiş geniş bir komplekstir ve dünyanın en yüksek pagodalarından birine sahipti."
 building_type_white_deer_grotto_academy_01: "$building_white_deer_grotto_academy_01$"
