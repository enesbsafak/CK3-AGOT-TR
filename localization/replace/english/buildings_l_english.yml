 building_type_citadel_shrine_01: "Hisar Mabedi"
 building_type_citadel_shrine_01_desc: "Bir $building_type_temple_citadel_01$, kendi panteonuna ibadet edilecek bir yer olmadan tamamlanmış sayılmaz. İster sivil halk ister konuşlu askerler olsun, duvarların içinden yayılan kutsiyet her huzursuz ruhu yatıştırır."
 building_citadel_shrine_01: "Prasada Kulesi"
 building_citadel_shrine_01_desc: "Prasada, $building_type_temple_citadel_01$'i taçlandırır ve uzaktan asil bir silüet çizer. Böylece ibadet edenler Mabedi uzaktan bile hayranlıkla seyredebilir."
 building_citadel_shrine_02: "Prang Kulesi"
 building_citadel_shrine_02_desc: "Zarif oymalarla kaplı Prang, katman katman yükselen yapısıyla irtifa hissini güçlendirir. Dualar ister sözle ister tefekkür sessizliğiyle dışa vurulsun, göze hoş bir dinlenme sunar."
 building_citadel_shrine_03: "İlahi Heykeller"
 building_citadel_shrine_03_desc: "Bu heykel topluluğu ebediyeti düşünür gibi sürekli etere bakar, çoğu zaman da ibadet edenlerde karmaşık duygular uyandırır."
 building_citadel_shrine_04: "Singha Heykelleri"
 building_citadel_shrine_04_desc: "Sırıtan dişler ve sabit bakışlarla, bu vahşi bekçi aslanlar $building_type_temple_citadel_01$ sakinlerine koruma lütfunu sunar."
### TODO AGOT-CHANGED: building_citadel_shrine_05 [AGOT: NÄga Guardians | TR: Nāga Muhafızları]
 building_citadel_shrine_05: "NÄga Guardians"
 building_citadel_shrine_05_desc: "Kumtaşından özenle işlenmiş ve göğsüne mandala incelikle kazınmış bu yedi başlı yılanlar, Mabedin sakinlerine huzur ve refah bahşeder."
 building_citadel_shrine_06: "Kabartmalar"
 building_citadel_shrine_06_desc: "Halk, bu kabartmaların ince ayrıntılarını incelemek için sık sık durur, zira hem dramatik savaş dönemlerini, hem de çeşitli ilahi düzlemleri ve yaratılış mitlerini tasvir ederler."
 building_citadel_shrine_07: "Relik Mahfazaları"
 building_citadel_shrine_07_desc: "Çeşitli dini ve törensel heykel ve nesnelerle dolu bir hazine, bu $building_type_temple_citadel_01$, başka hiçbir yerde olmayan büyüklükte bir koleksiyona sahiptir."
 building_citadel_shrine_08: "Devaraja İmgesi"
 building_citadel_shrine_08_desc: "İlahi Varlık, görkemli bir duruşla zamanda donmuştur, ibadet edenler dualar eder ve sadakatle hürmet sunarak lütuflarını diler."
 building_type_sacred_pool_01: "Kutsal Havuz"
 building_type_sacred_pool_01_desc: "Böylesine büyük bir su kütlesinin pek çok amacı olabilir fakat mevsimler dönüp zaman geçtikçe havuzda yansıyan görüntülerin kimi zaman gerçekten aşkınlaştığı açıktır. Tahkimatın yanı sıra su ihtiyacının da kaynağı olan bu havuzlar, sakinlerinin gündelik yaşamının önemli bir parçasıdır."
 building_sacred_pool_01: "Nilüfer Göleti"
 building_sacred_pool_01_desc: "Güzelliği ve dinginliğiyle izleyenleri büyüleyen, ayrıca önemli manevi olaylara sahne olduğu iddia edilen uyumlu bir gölet."
 building_sacred_pool_02: "Kutsal Rezervuar"
 building_sacred_pool_02_desc: "Ölçeği büyüyen bu $building_sacred_pool_02$, zaman zaman yaban hayatını da çeker, bitki ve hayvanlar bir arada çalışarak ziyaretçilere yaşam döngüsü hissini ilham eder."
 building_sacred_pool_03: "Havza"
 building_sacred_pool_03_desc: "Ara sıra yapılan tören ve ritüeller için bir mekân, bu su kütlesi, hükümdarının artan ihtişamının hikâyesini anlatır."
 building_sacred_pool_04: "Hendek"
 building_sacred_pool_04_desc: "Artık ibadet yerini çepeçevre sarar, sakinler, $building_type_sacred_pool_01$ sayesinde kendileriyle muhtemel düşman güçler arasında bir savunma hattı oluştuğu için daha güvende hisseder."
 building_sacred_pool_05: "Küçük Baray"
 building_sacred_pool_05_desc: "Bir dizi bekçi aslan Baray'ı gözetir, böylece davetsiz misafirler durgun sularını aşmadan önce iki kez düşünür."
 building_sacred_pool_06: "Baray"
 building_sacred_pool_06_desc: "Doğudan batıya uzanan $building_sacred_pool_06$, seyri muhteşem bir manzaradır. Yılan heykelleri dış çevreyi kollamaya yardım eder."
 building_sacred_pool_07: "Büyük Baray"
 building_sacred_pool_07_desc: "Heykeller, çiçeklenen bitki örtüsü ve görkemli manzara bu görkemli su kütlesini tanımlar, kavurucu sıcak dönemlerinde serin bir ferahlık ve su sağlar."
 building_sacred_pool_08: "Kutsal Baray"
### TODO AGOT-CHANGED: building_sacred_pool_08_desc [AGOT: Travelers and other visitors passing by often stand in awe of this man-made body of water â€” its width making the eye barely able to see the edge at the other side. A true testament to the divine link of this location. | TR: Yoldan geçen gezginler ve diğer ziyaretçiler bu insan yapımı su kütlesi karşısında sık sık hayranlıkla durur — genişliği, karşı kıyıyı seçmeyi neredeyse imkânsız kılar. Bu, yerin ilahi bağının gerçek bir kanıtıdır.]
 building_sacred_pool_08_desc: "Travelers and other visitors passing by often stand in awe of this man-made body of water â€” its width making the eye barely able to see the edge at the other side. A true testament to the divine link of this location."
 building_type_vihara_halls_01: "Vihara Salonları"
 building_type_vihara_halls_01_desc: "Yağmur mevsiminde keşişleri korumak için inşa edilmiş manastır yapıları, sessiz tefekkür, dua ve toparlanma mekânlarıdır. Salonları genişletmek, burada yaşayan dindarların canlılığını ve bağlılığını artırır."
 building_vihara_halls_01: "Dua Mabedi"
 building_vihara_halls_01_desc: "$building_vihara_halls_01$ eklemesi, ziyaretçilere ibadet ve tefekkür için bir yer sunar."
 building_vihara_halls_02: "Kutsal Metin Kütüphanesi"
 building_vihara_halls_02_desc: "Hor Trai'nin duvarları içinde hem kadim hem de yeni metinler saklıdır. Gelen bağlılar, diledikleri vakit göz gezdirip aydınlanmalarını ilerletebilir."
 building_vihara_halls_03: "Sütunlu Şapeller"
 building_vihara_halls_03_desc: "Heybetli sütun dizileri bu şapellerin üzerinde yükselir, içerideki ibadet edenlere hoş yazıtlar ve çeşitli dini tasvirler sunar."
 building_vihara_halls_04: "Mandapa"
 building_vihara_halls_04_desc: "Bu sütunlu salonun muazzam boyutu, halka açık ritüeller veya diğer dini merasimleri icra etmek için mükemmeldir."
 building_vihara_halls_05: "Shala Köşkü"
 building_vihara_halls_05_desc: "Yeşilliğin ortasında bir köşk, bu yapının güzelliği, ancak taşıdığı maneviyat havasıyla boy ölçüşebilir."
 building_vihara_halls_06: "Sima Taşları"
 building_vihara_halls_06_desc: "Sınır taşları, $building_type_vihara_halls_01$ görevlilerine, keşişlerin ibadetlerini layıkıyla yapabilmesi için gerekli alanların uygun büyüklüğünü ve aralığını belirlemede yardımcı olur."
 building_vihara_halls_07: "Çan Kulesi"
 building_vihara_halls_07_desc: "Görkemli bir $building_vihara_halls_07$, bu $building_type_vihara_halls_01$'ı taçlandırır, gündüz güneş ışığını yansıtır, gece ise uzaktan heybetle belirir."
 building_vihara_halls_08: "Büyük Salonlar"
 building_vihara_halls_08_desc: "Bu salonların konforu ve imkânları, keşişleri daha uzaklardan gelmeye teşvik eder, öğretileri ve fikirleri eşsiz bir bilgi ağı içinde toplar ve yayar, yakın diyarlara uyum taşır."
