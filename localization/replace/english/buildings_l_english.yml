 building_mozu_tombs: "Mozu Mezarları"
 building_mozu_tombs_desc: "Mozu'daki anahtar deliği biçimli höyüklerin, geçmiş çağların imparatorlarına ev sahipliği yaptığı söylenir. Yakındaki körfezden geçen gemiler için bunlar hem dikkate değer bir nirengi noktası hem de geçmiş zamanların bir hatırlatıcısıdır."
