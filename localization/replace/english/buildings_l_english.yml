 building_murex_farm_07_desc: "The grand workshop focuses on mass production of Tyroshi purple-dyed textiles, significantly boosting income from the sale of these prestigious garments."
 building_murex_farm_08: "Mor Kraliyet Sarayı"
### TODO AGOT-CHANGED: building_murex_farm_08_desc [AGOT: A magnificent palace adorned with Tyroshi purple-themed decorations stands as a symbol of wealth and power. It showcases the local mastery in Tyroshi purple production. | TR: Sur moru temalı süslemelerle bezenmiş, zenginliğin ve gücün sembolü olan görkemli bir saray. Sur moru üretimindeki yerel ustalığı gözler önüne seriyor.]
 building_murex_farm_08_desc: "A magnificent palace adorned with Tyroshi purple-themed decorations stands as a symbol of wealth and power. It showcases the local mastery in Tyroshi purple production."
