 building_holy_site_great_mosque_of_cordoba_01_desc:0 "$building_type_holy_site_great_mosque_of_cordoba_01_desc$"
 building_type_walls_of_genoa_01:0 "Ceneviz Surları"
 building_type_walls_of_genoa_01_desc:0 "Ceneviz Surları, şehre büyük ölçüde özerklik verildikten sonra 9. yüzyılda inşa edilmiştir. Surların ve kıyıların koruması sayesinde bölge gelişip zenginleşebiliyor."
 building_walls_of_genoa_01:0 "$building_type_walls_of_genoa_01$"
 building_walls_of_genoa_01_desc:0 "$building_type_walls_of_genoa_01_desc$"
 building_type_holy_site_great_mosque_of_djenne_01:0 "Cenne Ulu Camii"
 building_type_holy_site_great_mosque_of_djenne_01_desc:0 "Cenne Ulu Camii, Bani Nehri'nin kıyısındadır. Tamamen kerpiçten inşa edildiği için çok bakım ister, inananlar da bu bakımı göstermekten şikâyet etmez. Her yıl insanlar camiyi tamir etmek ve geliştirmek için toplanır."
