### TODO AGOT-CHANGED: building_dazaifu_01_desc [AGOT: The town of Dazaifu is the imperial court's administrative center on distant KyÅ«shÅ«. Established to oversee the island's defense, facilitate overseas trade, and host foreign dignitaries, governorship of Dazaifu is a common career stepping stone of ambitious bureaucrats. | TR: Dazaifu kasabası, uzak Kyūshū'da imparatorluk sarayının idarî merkezidir. Adanın savunmasını gözetmek, denizaşırı ticareti kolaylaştırmak ve yabancı elçileri ağırlamak üzere kurulan Dazaifu'nun valiliği, hırslı bürokratlar için yaygın bir kariyer basamağıdır.]
