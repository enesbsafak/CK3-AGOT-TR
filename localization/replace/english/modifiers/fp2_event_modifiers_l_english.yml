l_english:
 fp2_smooth_market_oversight_modifier:0 "Kolay Pazar Kontrolü"
 fp2_smooth_market_oversight_modifier_desc:0 "Yerel muhtesibin dikkatliliği alışverişi kolay ve güvenilir kılmaya yardımcı oluyor."
 fp2_inefficient_market_oversight_modifier:0 "Kötü Pazar Kontrolü"
 fp2_inefficient_market_oversight_modifier_desc:0 "Yerel muhtesib pazardaki sorunları çözmeyi beceremiyor ve tüm iş kadıya kalıyor."
 fp2_free_market_boom_modifier:0 "Hisbesiz Pazar"
 fp2_free_market_boom_modifier_desc:0 "Bu kasabanın pazarları hisbeye sahip değil, bu yüzden muhtesiblerin denetlemesinden de kurtuluyorlar."
 fp2_ruthless_market_oversight_modifier:0 "Acımasız Pazar Kontrolü"
 fp2_ruthless_market_oversight_modifier_desc:0 "Yerel muhtesip en ufak anlaşmayı sağlarken bile asker desteği kullanıyor."
 fp2_forsaken_turned_levies_modifier:0 "Artan Askeriyecilik"
 fp2_forsaken_turned_levies_modifier_desc:0 "Ufak köylü milis grupları süzerenlerinin gözüne girmek için ihanetkâr örgütleşmeleri avlamaya çalışıyor."
 fp2_veteran_mercenaries_as_instructors_modifier:0 "Kıdemli Paralı Askerler Öğretmen Olarak İşe Alındı"
 fp2_veteran_mercenaries_as_instructors_modifier_desc:0 "Bu kontluk yerel milislerin eğitimi için tecrübeli paralı asker kaptanlarını işe almış."
 fp2_mercenary_acquaintances_modifier:0 "Paralı Asker Dostlar"
 fp2_mercenary_acquaintances_modifier_desc:0 "Bu karakter eski paralı asker kaptanlarıyla dostluk ediyor ve bu dostluklarından oldukça bilgi edinmiş."
 fp2_mercs_slaughtered_populance_modifier:0 "Paralı Askerler Nüfusu Katlediyor"
 fp2_mercs_slaughtered_populance_modifier_desc:0 "Bir grup silahlı asker bu toprakları mahvetmiş, yerli halkın her şeyini almış ve geride ötecek kuş bile bırakmamış."
 fp2_local_garrison_slaughtered_modifier:0 "Yerel Garnizon Yok Edildi"
 fp2_local_garrison_slaughtered_modifier_desc:0 "Bu kontluğun garnizonu tamamen yok edilmiş, bu da bölgeyi savunmasız kılıyor."
 fp2_elite_tactics_for_civil_guards_modifier:0 "Yerel Garnizon Seçkin Taktikler Kullanıyor"
 fp2_elite_tactics_for_civil_guards_modifier_desc:0 "Bu garnizondaki askerler oldukça yetenekli kolluk kuvvetlerinden oluşuyor, bu yüzden kanunsuzları oldukça etkili bir şekilde yakalayabiliyorlar."
 fp2_mercs_turned_farmers_modifier:0 "Çiftçilğe Başlamış Paralı Askerler"
 fp2_mercs_turned_farmers_modifier_desc:0 "Tehlikeli bir grup paralı asker bu topraklara gelip... çiftçilik yapmaya karar vermiş. Şimdilik barış içinde olsalar da gerekmesi durumunda yeni süzerenleri tarafından savaşa çağrılabilirler."
 fp2_lenient_towards_foreign_merchants_modifier:0 "Yabancı Tüccarlara Karşı Hoşgörülü"
 fp2_lenient_towards_foreign_merchants_modifier_desc:0 "Bu karakter dinî düşmanlıkları ticaret uğruna bir kenara bırakıyor. Hem zenginliğine zenginlik, hem de düşmanlarına düşman katıyor."
 fp2_2001_promise_reminder:0 "Özgürlük Sözü"
 fp2_2001_promise_reminder_desc:1 "Bu karakter kuşatılmış bir köyü kurtaracağına onuru üzerine söz vermiş."
 fp2_inexplicable_accounting_modifier:0 "Yanlış Sayım"
 fp2_inexplicable_accounting_modifier_desc:0 "Bu kontluğun sayımında bir hata var, altınlar eksik."
 fp2_improved_administrative_checks_modifier:0 "Geliştirilmiş İdari Kontroller"
 fp2_improved_administrative_checks_modifier_desc:0 "Bu kontluk aklanmış en ufak paranın bile ortaya çıkarılması için çaba sarf ediyor."
 fp2_mozarab_quarter_modifier:0 "Mozarap Mahalleleri"
 fp2_mozarab_quarter_modifier_desc:0 "Bu kontluğun şehirlerinde Mozaraplar için ayrılmış mahalleler var."

 fp2_mozarab_church_modifier:0 "Kabul Gören Mozaraplar"

 fp2_mozarab_church_modifier_desc:0 "Bu karakter topraklarında Mozarap kilislerinin kurulmasına izin vermiş."

 fp2_mozarab_rejected_modifier:0 "Mozarap Ayrımcılığı"

 fp2_mozarab_rejected_modifier_desc:0 "Bu karakter topraklarında Mozarap kiliselerinin kurulmasına izin vermiyor."
 fp2_multifaith_county_modifier:0 "Çoklu İnanç Hoşgörüsü"
 fp2_multifaith_county_modifier_desc:0 "Bu karakter topraklarında yaşayıp farklı inanca sahip olan kişiler için özgürlük tanımış."
 fp2_religious_strife_modifier:0 "Dinî Çatışma"
 fp2_religious_strife_modifier_desc:0 "Halkın din değiştirmeye zorlanması bu kontlukta dinî çatışmaların yayılmasına sebep olmuş."
 fp2_camino_santiago_ho_protected_modifier:0 "Kutsal Tarikat Koruması"
 fp2_camino_santiago_ho_protected_modifier_desc:0 "Bu kontluktan Santiago'ya giden yol bir [holy_order|E] tarafından korunuyor."
 fp2_camino_santiago_protected_modifier:0 "Paralı Muhafızlar"
 fp2_camino_santiago_protected_modifier_desc:0 "Bu kontluktan Santiago'ya giden yol bir paralı muhafızlar tarafından korunuyor."
 fp2_horchata_colonialism_modifier:0 "Horchata Sömürüsü"
 fp2_horchata_colonialism_modifier_desc:0 "Bu kontluk horchata yapımı için yer bademi üretimine zorlanmış."
 fp2_funded_agriculture_modifier:0 "Desteklenen Tarım"
 fp2_funded_agriculture_modifier_desc:0 "Bu kontluğa tarım alanlarını genişletmesi için gerekli kaynaklar sağlanmış."
 fp2_vow_against_conscription_modifier:0 "Askere Alıma Karşı Söz"
 fp2_vow_against_conscription_modifier_desc:0 "Bu kontluğa asker toplamaya karşı çıkma hakkı verilmiş. Böylelikle daha insani meselelere odaklanabilecekler."
 fp2_monument_to_war_modifier:0 "Fetih Anıtı"
 fp2_monument_to_war_modifier_desc:0 "Yanmış binalardan kalan yığının tepesinde bu toprakların fatihi adına bir anıt duruyor."
 fp2_village_rebuiling_efforts_modifier:0 "Köy Yeniden İnşası İçin Uğraşlar"
 fp2_village_rebuiling_efforts_modifier_desc:0 "Bu kontluk büyük bir felaketten sonra tekrar inşa ediliyor, süzerenleri süreci hızlandırmak için gerekli olan malzemeleri sağlamış."
 fp2_border_encampments_modifier:0 "Civar Kampları"
 fp2_border_encampments_modifier_desc:0 "Bu kontluk çadırlar ve gözcü kuleleri ile sarılı, ufak devriye grupları ile ellerindekini korunmaya çalışıyorlar."
 fp2_scallop_shell_artifact:0 "Deniz Tarağı"
 fp2_scallop_shell_artifact_desc:0 "Bu deniz tarağı sahibinin zor Camino de Santiago yolculuğunu yaptığının kanıdı."
 fp2_fake_scallop_shell_artifact:0 "Şüpheli Deniz Tarağı"
 fp2_fake_scallop_shell_artifact_desc:0 "Deniz tarağı genellikle Santiago'ya hacca gitmiş birinde bulunur. Fakat bunun çalıntı olduğu apaçık ortada."
 fp2_malato_bark_artifact:0 "Malato Ağacı Kabuğu"
 fp2_malato_bark_artifact_desc:0 "Ünlü Bask Malato Ağacından alınmış bir parça ağaç kabuğu."
 fp2_dismantling_verracos_modifier:0 "Verracos Yıkımı"
 fp2_dismantling_verracos_modifier_desc:0 "Bu kontluktaki antik boğa heykelleri yıkılıp inşaat malzemesine dönüştürülüyor, yerel yetkililer durum karşısında şaşakalmış."
 fp2_saints_tombs_modifier:0 "Aziz Mezarları"
 fp2_saints_tombs_modifier_desc:0 "Bu kontluğu kirleten taş boğa heykellerinin, Hristiyan azizlerinin mezarları olduğu biliniyor."
 fp2_controls_the_mediterranean_house_modifier:1 "Akdeniz'in Efendileri"
 fp2_controls_the_mediterranean_house_modifier_desc:0 "Bu hane Akdeniz'in ve ticaretinin kontrolünü ele geçirmesi ile tanınıyor."
 fp2_aragon_title_reward_house_modifier:0 "Aragón'un Kurucuları"
 fp2_aragon_title_reward_house_modifier_desc:0 "Bu hane, hırçın topraklar üzerinde hırçın savaşçılara sahip Aragón Krallığı'nı kurdu."
 fp2_sponsored_golden_age_modifier:0 "Altın Çağ Desteklendi"
 fp2_sponsored_golden_age_modifier_desc:0 "Bu karakter bölgesindeki bilimsel ilerlemenin yeni altın çağını destekledi."
 fp2_part_of_golden_age_modifier:0 "Altın Çağ Sırasında Bulunuyor"
 fp2_part_of_golden_age_modifier_desc:0 "Bu karakter bilimsel ilerlemenin altın çağı başladığında o bölgede bulunuyordu."
 fp2_epicenter_of_golden_age_modifier:0 "Altın Çağın Merkezi"
 fp2_epicenter_of_golden_age_modifier_desc:0 "Bu konum altın çağın en parlak beyinlerinin bulunduğu ve çalıştığı bir ilim merkezi."
 fp2_translated_skill_book_diplomacy_modifier:0 "Antik Diplomatik Notlar"
 fp2_translated_skill_book_diplomacy_modifier_desc:0 "Bu karakter pek çok çeşitli diplomatik durumla ilgilenmek için antik zamanlardan kalma notları çevirdi."
 fp2_translated_skill_book_martial_modifier:0 "Askerî Tarih Kitapları"
 fp2_translated_skill_book_martial_modifier_desc:0 "Bu karakter pek çok askerî tarih kitabı okumuş ve eski zamanların insanlarının uyguladığı taktik ve stratejileri öğrenmiş."
 fp2_translated_skill_book_stewardship_modifier:0 "Ekonomik Kuram Kitapları"
 fp2_translated_skill_book_stewardship_modifier_desc:0 "Bu karakter antik imparatorlukların devasa ekonomilerini nasıl yönettiğiyle alakalı kuramlar dolu olan bolca kitaplara sahip."
 fp2_translated_skill_book_intrigue_modifier:0 "Entrika Hikâyeleri"
 fp2_translated_skill_book_intrigue_modifier_desc:0 "Bu karakter entrika ile alakalı pek çok kitaba sahip, bu da planlar için çeşitli fikirler sunuyor."
 fp2_translated_skill_book_learning_modifier:0 "Felsefi Eserler Çevirdi"
 fp2_translated_skill_book_learning_modifier_desc:0 "Bu karakter antik felsefi eserlerin çevirisini karşıladı böylelikle daha üst seviye bir anlama yetisine sahip."
 fp2_rejection_of_old_thoughts_modifier:0 "Eski Fikirlerin Reddi"
 fp2_rejection_of_old_thoughts_modifier_desc:0 "Bu kontluk geçmişten ders almanın gereksiz olduğunu düşünen insanları çekiyor, pek çok yeni fikir ortaya çıkacak fakat hiçbiri kalıcı olmayacak."
 fp2_removed_cataracts_modifier:0 "Başarılı Katarakt Ameliyatı"
 fp2_removed_cataracts_modifier_desc:0 "Bu karakter başarılı bir katarakt ameliyatı geçirdi, neredeyse körken artık pek çok renk tonunu ayırt edebiliyor."
 fp2_religious_riots_modifier:0 "Dinî Ayaklanmalar Süregeliyor"
 fp2_religious_riots_modifier_desc:0 "Bu kontluğun büyük şehirlerinde dinî çatışmalar insanları bölmüş durumda."
 fp2_religious_riots_suppressed_modifier:0 "Dinî Ayaklanmalar Bastırılıyor"
 fp2_religious_riots_suppressed_modifier_desc:0 "İçten içe devam etse de bu kontluktaki dinî ayaklanmalar sert bir şekilde bastırıldı."
 fp2_religious_riots_defused_modifier:0 "Dinî Ayaklanmalar Engellendi"
 fp2_religious_riots_defused_modifier_desc:0 "Bazıları hâlâ ses çıkarsa da bu kontlukta dinî ayaklanmalar engellendi."
 fp2_pilgrim_roads_modifier:0 "Hac Yolları"
 fp2_pilgrim_roads_modifier_desc:0 "Bu kontluk hacıları kutsal bölgelere yönlendirmek için geniş bir yol ağına sahip."
 fp2_trusted_by_pilgrim_warriors_modifier:0 "Kutsal Savaşçılar Arasında Nam Salmış"
 fp2_trusted_by_pilgrim_warriors_modifier_desc:0 "Bu karakter din adına savaşan insanlara iyi davranmasıyla biliniyor, onlar da aynı şekilde karşılık veriyor."
 fp2_kept_accused_traitor_in_court_modifier:0 "Zayıflık Söylentileri"
 fp2_kept_accused_traitor_in_court_modifier_desc:0 "Bu karakterin yaptığı bir şeyden ötürü onunla alakalı her tür kötü söylenti ortaya atılmış."
 fp2_kept_op_knight_in_court_modifier:0 "Hüzünlü Savaşçılar"
 fp2_kept_op_knight_in_court_modifier_desc:0 "Bu karakterin şövalyeleri, çok daha iyi bir savaşçının gölgesinde kaldıkları için şevklerini kaybetmiş."
 fp2_kept_upstart_knight_in_court_modifier:0 "Yeniyetme Şövalyeler"
 fp2_kept_upstart_knight_in_court_modifier_desc:0 "Soylular bu karakterin sarayında daha fazla yeni şövalye olmaması için harekete geçmiş."
 fp2_kept_godless_mercenary_in_court_modifier:0 "Kalpleri Kararmış Paralı Askerler"
 fp2_kept_godless_mercenary_in_court_modifier_desc:0 "Dış etkenler bu karakterin iş verdiği tüm şövalyelerin sadece para için savaşan inançsız askerler olarak ün salmasını sağlamış."
