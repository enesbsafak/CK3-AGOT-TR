 travel_point_historical_name_visit_message: "[ROOT.Char.GetCurrentLocation.Custom('BattlePoiNameHistorical')]"
 BattlePoIHistoricalNameTours: "Puvatya Muharebesi"
 BattlePoIHistoricalDescTours: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '131721' ).GetFirstNameNicknamed]\nKaybeden: Abdurrahman el Gefiki\nTarih: 10 Ekim, 732 MS#!\n#weak Charles Martel'in Fransa'ya yönelik Emevi istilasını, Clain ve Vienne nehirlerinde püskürttüğü muharebe. Söylenene göre, Charles'ın adamları sarsılmaz bir duvar örerek Emevi süvarilerini durdurmayı başardı. Düşman komutanını bulup öldürdükten sonra, düşmanları muharebe alanından kaçtı.#!"
 BattlePoIHistoricalNameLechfeld: "Lechfeld Muharebesi"
 BattlePoIHistoricalDescLechfeld: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '1282' ).GetTitledFirstName]\nKaybeden: [GetScriptedCharacterByHistoryID( '460' ).GetFirstName] [GetScriptedCharacterByHistoryID( '460' ).GetDynastyName]\nTarih: 10 Ağustos, 955 MS#!\n#weak Sakson Kralı Otto'nun güçleri ile Macar kuvvetleri arasında yaşanan acımasız bir muharebe. Her iki taraf da yıkıcı kayıplar verdikten sonra, Macarlar etraflarının sarılacağını görünce kaçtılar.\n\nSavaş sona erdikten sonra, birçok Macar komutanı esir alınıp idam edildi ve Batı Avrupa'ya yönelik devam eden Macar tehdidi nihayet sona erdi.#!"
 BattlePoIHistoricalNameHastings: "Hastings Muharebesi"
 BattlePoIHistoricalDescHastings: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '140' ).GetFirstName] [GetScriptedCharacterByHistoryID( '140' ).GetDynastyName]\nKaybeden: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nTarih: 14 Ekim, 1066 MS#!\n#weak Hastings Muharebesi, Fatih William'in İngiltere üzerindeki gücünü pekiştirmesinde kilit savaşlardan biriydi. Yokuş yukarı savaşmak zorunda kalan Norman ordusu ilerleme kaydetmekte zorlandı ve hatta bir noktada geri çekilmeye başladı fakat William Anglosakson birliklerine karşı düzenlediği karşı saldırı ile toparlandı.\n\nDüşman kuvvetleri altında ezilen Harold, iki kardeşi [GetScriptedCharacterByHistoryID( '132' ).GetFirstNameNoTooltip] ve [GetScriptedCharacterByHistoryID( '130' ).GetFirstNameNoTooltip] ile birlikte hayatını kaybetti; böylece İngiliz tahtı boş kaldı.#!"
 BattlePoIHistoricalNameStamfordBridge: "Stamford Bridge Muharebesi"
 BattlePoIHistoricalDescStamfordBridge: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( '102531' ).GetNameNicknamed]\nTarih: 25 Eylül, 1066 MS#!\n#weak Stamford Bridge Muharebesi, İngiliz tahtı için mücadele eden üç aday – Normandiyalı William, Norveç Kralı Harald ve İngiltere Kralı Harold – arasındaki kilit çatışmalardan biriydi. Adamlarıyla kuzeye hızla ilerleyen Harold, Norveçli birlikleri sürpriz bir saldırıyla hazırlıksız yakaladı.\n\nHarald, soluk borusuna saplanan bir ok sonucu öldürüldü ve Harold'un kardeşi [GetScriptedCharacterByHistoryID( '124' ).GetFirstNameNoTooltip] onunla beraber hayatını kaybetti. Komutanlarını yitiren Norveç ordusu, savaşın ardından tamamen parçalandı.#!"
 BattlePoIHistoricalNameManzikert: "Malazgirt Muharebesi"
 BattlePoIHistoricalDescManzikert: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '3040' ).GetFirstName] [GetScriptedCharacterByHistoryID( '3040' ).GetDynastyName]\nKaybeden: [GetScriptedCharacterByHistoryID( '1734' ).GetFullName]\nTarih: 26 Ağustos, 1071 MS#!\n#weak 1068 yılında Bizans İmparatoru olarak taç giyen Romen Diyojen, Anadolu'ya yönelik Türk akınlarına karşı sefer düzenledi. Kısıtlı başarı elde ettikten sonra, Malazgirt yakınlarında Selçuklu İmparatorluğu'ndan Alp Arslan'a karşı harekete geçti.\n\nKomutanlarından birinin ordusunun büyük bir bölümünü geri çekmesiyle ihanete uğrayan Romen Diyojen, Türkler tarafından esir alındı. Daha sonra düşmanı tarafından serbest bırakılmasına rağmen, tahttan indirildi, kör edildi, sürgüne gönderildi ve aldığı yaralar sonucu hayatını kaybetti.#!"
 BattlePoIHistoricalNameYarmuk: "Yermük Muharebesi"
 BattlePoIHistoricalDescYarmuk: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '163015' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( '145071' ).GetFullName]\nTarih: 20 Ağustos, 636 MS#!\n#weak Yermük Muharebesi, Bizans tarihinin en önemli muharebelerinden biridir. Kesin bir yenilgi sonucunda, Bizans İmparatorluğu Suriye ve Mısır topraklarını kaybetti.\n\n6 gün süren savaşta, başlangıçta muharebenin akışı Müslümanların aleyhine gidiyordu ancak Yermük'te beşinci gün şafağıyla birlikte savunmadan saldırıya geçtiler. 6. gün, Müslüman süvarileri cesurca bir taarruz yaparak Bizans ordusunu kırmayı başardı.\n\nMoralleri çöken Bizans askerleri, uçurumlara düştü, boğuldu ya da düşman askerleri tarafından ezildi.#!"
 BattlePoIHistoricalNameDandanaqan: "Dandanakan Muharebesi"
 BattlePoIHistoricalDescDandanaqan: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '3036' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( '144129' ).GetFullName]\nTarih: 23 Mayıs, 1040 MS#!\n#weak Kuzey İran topraklarında güçlenmekte olan Selçuklular ile Gazneli İmparatorluğu arasında yapılan önemli bir muharebe. İlk çatışmalarda Selçuklu güçleri geri püskürtüldükten sonra, Gazneli kuvvetleri ganimetin paylaşılması konusunda tartışmaya başladı.\n\nDağınık ve savaşa hazırlıksız olan Gazneliler, Selçuklu birliklerinin ani dönüşüne hazırlıksız yakalandı. Rahatsız, aç ve morali bozulan Gazneli askerler, düşmanları tarafından ezildi.#!"
 BattlePoIHistoricalNameAror: "Aror Muharebesi"
 BattlePoIHistoricalDescAror: "#emp Kazanan: Muhammad ibn al-Qasim\nKaybeden: Raja Dahir\nTarih: 711 MS#!\n#weak Hindistan'a yönelik Emevi istilası sırasında, Sindh Kralı ile Emeviler arasında gerçekleşen bir muharebe.\n\nRakipleri başlangıçta sayıca üstün olmasına rağmen, Emevi komutanı ordusuna en avantajlı mevkiyi korumayı başardı. Savaş boyunca bu dengesizlik, Müslüman kuvvetlerin muharebenin akışını yavaşça lehlerine çevirmesine yol açtı ve Raja Dahir'in ölümüyle zaferleri kesinleşti.#!"
 BattlePoIHistoricalNameSvolder: "Svolder Muharebesi"
 BattlePoIHistoricalDescSvolder: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '101505' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( '144004' ).GetFullName]\nTarih: 9 Eylül, 999 MS#!\n#weak Olafr Tryggvason liderliğinde Norveç güçleri bir yanda yer alırken, karşılarında Danimarka Kralı Sveinn önderliğindeki Danimarka ve İsveç kuvvetlerinden oluşan bir koalisyon bulunuyordu.\n\nSayısal olarak büyük dezavantaja rağmen, Norveç Kralı düşman koalisyonundan kaçmayı reddetti ve İsveçliler ile Danimarkalılarla savaşa girdi; bu esnada onları 'at yiyenler' ve 'orman keçileri' olarak nitelendirmekten de geri kalmadı.\n\nSonuçta, düşmanlarına ağır darbe indirmiş olsa da, Norveç ordusu ezildi. Olafr savaşta kayboldu ve muhtemelen hayatını kaybetti.#!"
 BattlePoIHistoricalNameCivitate: "Civitate Muharebesi"
 BattlePoIHistoricalDescCivitate: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '1126' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( '1338' ).GetFullName]\nTarih: 18 Haziran, 1053 MS#!\n#weak Bu savaş, bir yanda Normanlar diğer yanda Papa liderliğindeki Almanlar ve yerel İtalyanları içeren bir koalisyon arasında gerçekleşti.\n\nSayısal üstünlüklerine rağmen, Papa koalisyonu muharebenin merkezindeki Norman piyadelerini kıramadı ve süvari kanatları Norman süvarilerine karşı yenildi.\n\nÇok geçmeden Papa'nın kendisi Normanlar tarafından esir alındı ve muharebe sona erdi.#!"
 BattlePoIHistoricalNameTalas: "Talas Muharebesi"
 BattlePoIHistoricalDescTalas: "#emp Kazanan: Abbasi Halifeliği\nKaybeden: Tang Hanedanlığı\nTarih: 751 MS#!\n#weak Abbasi Halifeliği'nin güneybatıdan Maveraünnehir topraklarına, Tang Hanedanlığı'nın ise doğudan bu bölgeye doğru genişlemesi bu iki devleti karşı karşıya getirdi.\n\nBaşlangıçta, Tang Hanedanlığı'nın ağır piyadeleri ve Türk paralı askerleri Abbasi güçlerini geri püskürtmede önemli rol oynadı; ancak paralı askerlerin taraf değiştirmesi ve birçok müttefikin ihanetiyle Tang kuvvetleri geri çekilmek zorunda kaldı.\n\nBu çatışma, Tang Hanedanlığı'nın batıya doğru genişlemesinin sonunu getirdi ve Maveraünnehir toprakları Müslümanların eline geçti.#!"
 BattlePoIHistoricalNameSufuku: "Subushi Muharebesi"
 BattlePoIHistoricalDescSufuku: "#emp Kazanan: Isawa Emishileri\nKaybeden: [GetScriptedCharacterByHistoryID( 'japanese_iruma_1' ).GetFullName]\nTarih: 789 MS#!\n#weak Emishilerin Japonlar tarafından boyun eğdirilmesinin parçası olan önemli bir muharebe.\n\nJapon kuvvetleri geri çekilen Emishilerin ardından Kitakami Nehri'nin iki yakası boyunca ilerleyerek başlangıçta ikiye ayrıldı. Emishi kuvvetleri Japonların nehri geçmesini engelledi ve onların büyük bir kısmını nehirle dağlar arasında kıstırdı.\n\nArdından gelen Japon bozgunu büyük bir utanç kaynağı oldu. Birçok asker ölümden kaçmak için nehirde çıplak hâlde yüzerek karşıya geçti. Ordu terhis edildi ve [GetScriptedCharacterByHistoryID( 'japanese_yamato_24' ).GetFullName] komutanlarını sert biçimde azarladı.#!"
 BattlePoIHistoricalNameBaekgang: "Baekgang Muharebesi"
 BattlePoIHistoricalDescBaekgang: "#emp Kazanan: Silla Krallığı ve Tang Çin'i\nKaybeden: [GetScriptedCharacterByHistoryID( 'japanese_abe_36' ).GetFullName]\nTarih: 663 MS#!\n#weak Tang ve Silla'nın, Baekje Restorasyon Hareketi güçleri ve onların Japon müttefikleriyle çarpıştığı önemli bir deniz muharebesi.\n\nMuharebe büyük ölçüde Baengma Nehri üzerinde yapıldı. Japon kuvvetleri sayıca üstün olsa da Tang donanması yerini korudu ve sonunda karşı saldırıya geçerek Japon filosunu bozguna uğrattı.\n\nTang ve Silla'nın bu kesin zaferi Japonya'nın Kore'den tamamen çekilmesine sebep oldu ve Baekje Restorasyon Hareketi'nin sonunu getirdi.#!"
 BattlePoIHistoricalNamePalembang: "Palembang'a Chola Saldırısı"
 BattlePoIHistoricalDescPalembang: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '189038' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( 'javanese_sailendra_25' ).GetFullName]\nTarih: 1025 MS#!\n#weak Chola kuvvetlerinin Palembang'daki Srivijaya başkentine ani saldırısı.\n\nChola kuvvetleri denizden gelerek Srivijaya başkentini hızla boyun eğdirdi ve yağmalayıp tahrip etti.\n\nPalembang'ın düşüşü Srivijaya İmparatorluğu'nun tamamen çökmesine yol açtı ve Chola nüfuzu bölgede onlarca yıl daha sürdü.#!"
 BattlePoIHistoricalNameAngkor: "Angkor Kuşatması"
 BattlePoIHistoricalDescAngkor: "#emp Kazanan: [GetScriptedCharacterByHistoryID( 'cham_panduranga_04' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( 'khmer_tribhuvanaditya_01' ).GetFullName]\nTarih: 1177 MS#!\n#weak Kambuja ülkesindeki iç çekişmeler ve darbeler dönemi, soylu olmayan Tribhuvanaditya'nın iktidara yükselmesiyle sonuçlandı. Diğer hak iddiacılarını destekleyen isyancılarla mücadele ederken, Champa Krallığı Kambuja'yı işgal etti.\n\nChampa kuvvetleri Mekong ve Tonle Sap boyunca ilerleyip Angkor başkentini yağmaladı ve Tribhuvanaditya'yı öldürdü.\n\nKuşatmanın ardından Kambuja ülkesi çöktü ganimet ya bölgede dağıtıldı ya da Cham tarafından memlekete taşındı.#!"
 BattlePoIHistoricalNameSongping: "Songping Kuşatması"
 BattlePoIHistoricalDescSongping: "#emp Kazanan: Yang Sijin\nKaybeden: Cai Xi\nTarih: 863 MS#!\n#weak Tang'ın Annan himayesindeki karışıklıklar, komşu Nanzhao Krallığı'nın yerel kabilelerle ittifak kurup bölgeyi ezici bir kuvvetle işgal etmesine yol açtı.\n\nNanzhao ordusu ve müttefikleri bir süre kenti kuşattıktan sonra nihayet iç şehre girdi, savunanlar doğu kapısında son bir direniş gösterdi, düşman süvarilerine pusu kurup birçoğunu öldüseler de yenildiler.\n\nBaşlangıçta Viet halkı tarafından hoş karşılanmış olsalar da Nanzhao kuvvetleri bölgeyi yağmaladı ve 864'teki bir Tang saldırısıyla tüm bölge geri kazanıldı.#!"
 BattlePoIHistoricalNameMuye: "Muye Muharebesi"
 BattlePoIHistoricalDescMuye: "#emp Kazanan: Kral Wu\nKaybeden: Shang İmparatoru Zhou\nTarih: 1046 MÖ#!\n#weak Muye Muharebesi, isyancı Kral Wu ile Shang imparatoru Zhou arasında yapıldı.\n\nWu'nun kuvvetleri başlangıçta sayıca azdı ancak büyük ölçüde askerî kölelerden oluşan Shang kuvvetleri savaş alanından kaçtılar. Kral Wu komutasındaki isyancı kuvvetler için çok kanlı bir zafer elde etti.\n\nMuharebe Shang hanedanının düşüşüyle ve yeni Zhou hanedanını kuran Kral Wu'nun Göklerin Buyruğunu ele geçirmesiyle sonuçlandı.#!"
 BattlePoIHistoricalNameRedCliffs: "Kızıl Kayalar Muharebesi"
 BattlePoIHistoricalDescRedCliffs: "#emp Kazanan: Sun Quan\nKaybeden: Cao Cao\nTarih: 208 MS#!\n#weak Kızıl Kayalar Muharebesi, Han hanedanının sonlarına doğru kuzeyli savaş beyi Cao Cao ile savaş beylerinden oluşan bir koalisyon arasında yapılan bir nehir muharebesiydi. Cao Cao, Yangtze Nehri üzerinden Güney Çin'e uzanan bir köprübaşı kurmaya çalışıyordu.\n\nTeslim oluyormuş gibi yapan müttefik kuvvetler, Cao Cao'nun gemilerini bir tuzağa çekmeyi başardı, gemileri ateşe vererek birçok askeri ve atı diri diri yaktılar. Ardından kuzey ordusu kargaşaya sürüklenip yenildi.\n\nBu yenilgi Cao Cao'nun Yangtze Nehri'nin ötesine ilerlemesini engelledi ve Üç Krallık döneminin ileriki yıllarının zeminini hazırladı.#!"
 BattlePoIHistoricalNameGuandu: "Guandu Muharebesi"
 BattlePoIHistoricalDescGuandu: "#emp Kazanan: Cao Cao\nKaybeden: Yuan Shao\nTarih: 200 MS#!\n#weak Guandu Muharebesi, Geç Doğu Han Hanedanı döneminde savaş beyleri Cao Cao ile Yuan Shao arasında yapıldı. Her iki savaş beyi de hatırı sayılır bir güç elde etmiş ve Çin'i denetim altına alma yolunda birbirlerinin başlıca engeli hâline gelmişti.\n\nCao Cao'nun kuvvetleri savaşta sayıca azdı ancak Yuan Shao'nun erzak deposuna yapılan ani baskın gibi taktikler kullanarak düşmanın belini büktüler.\n\nMuharebe dönemin bir dönüm noktası oldu, Cao Cao galip çıktı ve bu zafer, Üç Krallık dönemindeki gelecekteki Cao Wei devletinin önünü açtı.#!"
 BattlePoIHistoricalNameYiling: "Yiling Muharebesi"
 BattlePoIHistoricalDescYiling: "#emp Kazanan: Lu Xun - Doğu Wu\nKaybeden: Liu Bei - Shu Han\nTarih: 221 MS#!\n#weak Jing eyaletindeki kaybedilmiş toprakları geri almaya çalışan Liu Bei, ordularına bizzat önderlik ederek Doğu Wu'ya saldırdı ve başlangıçta başarı elde etti.\n\nMuharebe sırasında Liu Bei'nin kuvvetleri general Lu Xun tarafından bir tuzağa çekildi. Lu Xun, Shu Han kampını ateşe vererek Liu Bei'yi geri çekilmek zorunda bıraktı. Sonunda Liu Bei, adamlarına zırhlarını ateşe vermelerini emrederek saldıranlara karşı bir ateş duvarı oluşturdu ve savaş alanından şahsen ayrılabildi.\n\nMuharebe Liu Bei için kesin bir yenilgi oldu ve seferinin sonunu, ardından da kendi ölümünü getirdi.#!"
 BattlePoIHistoricalNameFeiRiver: "Fei Nehri Muharebesi"
 BattlePoIHistoricalDescFeiRiver: "#emp Kazanan: Xie An - Jin\nKaybeden: Fu Jian - Eski Qin Devleti\nTarih: 383 MS#!\n#weak Muharebe, yabancı kabileleri kendi sancağı altında birleştirmiş Eski Qin devletinin Jin topraklarının önemli kısımlarını ele geçirdiği uzun bir seferin doruk noktasıydı. Qin orduları sayıca Jin'den çok üstündü. Jin ise Fei Nehri'nde direnişe geçti.\n\nMuharebe sırasında Jin'in disiplinli ve iyi eğitimli birlikleri, geç Qin'in çok daha kalabalık ama dağınık ve motivasyonsuz birliklerini bozguna uğrattı.\n\nJin'in Qin kuvvetlerini çok az kayıpla yenmesi güç dengesini büyük ölçüde değiştirdi ve Güney Çin'in yüz yılı aşkın süre daha bağımsız kalmasını sağladı.#!"
 BattlePoIHistoricalNameCanheSlope: "Canhe Yamaçları Muharebesi"
 BattlePoIHistoricalDescCanheSlope: "#emp Kazanan: Touba Gui - Kuzey Wei\nKaybeden: Murong Bao - Geç Dönem Yan Hanedanı\nTarih: 395 MS#!\n#weak Muharebe, Geç Dönem Yan Hanedanı'nın Kuzey Wei hanedanına karşı bir cezalandırma seferine çıkmasıyla başlayan çatışmanın sonucuydu.\n\nGeç Dönem Yan Hanedanı kuvvetleri Canhae yamacına ulaştığında ordu bir fırtınaya yakalandı ve bu sırada düşmanları tarafından saldırıya uğradı. Geç Dönem Yan Hanedanı ordusu hazırlıksız yakalandı ve birçoğu bizzat Sarı Nehir'e kaçtı.\n\nMuharebe, bölgenin güç dengelerini tersine çevirdi ve Kuzey Wei, Geç Dönem Yan Hanedanı topraklarının çoğunu ele geçirdi.#!"
 BattlePoIHistoricalNameXiangji: "Xiangji Tapınağı Muharebesi"
 BattlePoIHistoricalDescXiangji: "#emp Kazanan: [GetScriptedCharacterByHistoryID( 'han_1528' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( 'an_qingxu' ).GetFullName]\nTarih: 757 MS#!\n#weak Bu muharebe, Kuzey Çin'in büyük kısmını ele geçirmiş isyancı kuvvetlere karşı yapılan bir Tang karşı saldırısının doruk noktasıydı ve An Lushan İsyanı'nın en kanlı çarpışmalarından biriydi. İki devasa ordu, Chang'an'ın kuzeyinde Xiangji Tapınağı civarında karşılaştı.\n\nGün ortasına gelindiğinde Tang ordusu yüksek araziyi ele geçirmişti, Yan ordusu ise Chang'an'ın önünde mevzilenmişti. Birkaç manevranın ardından muharebe, disiplinli birliklerin birbirine boyun eğmeden çarpıştığı uzun bir çıkmaza dönüştü ve sonunda Yan cephesi aşırı kayıplar yüzünden çöktü.\n\nMuharebenin vahşeti her iki orduyu da kırıp geçirdi ancak isyanın da belini kırdı. Tang kuvvetleri ertesi gün Chang'an'ı geri alabildi.#!"
 BattlePoIHistoricalNameGaoliang: "Gaoliang Nehri Muharebesi"
 BattlePoIHistoricalDescGaoliang: "#emp Kazanan: [GetScriptedCharacterByHistoryID( '194330' ).GetFullName]\nKaybeden: [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullName]\nTarih: 979 MS#!\n#weak Muharebe, Songların Liao hanedanının 960'ta fethettiği 16 vilayeti geri alma girişiminin bir parçasıydı ve sefere bizzat imparatorun kardeşi (gelecekteki İmparator [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip]) önderlik etti.\n\nYouzhou kenti, Liao takviye kuvvetleri savunucuları kurtarmaya gelmeden önce 3 ay boyunca kuşatma altında kaldı. Başlangıçta üstün durumda olan Song ordusu ise gece vakti üç yönden gelen saldırıyla hazırlıksız yakalandı.\n\nMuharebe, [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip] olay yerinden bir eşek arabasıyla kaçmasıyla sona erdi. Bu, Songların iktidara yükselişinden sonraki ilk büyük yenilgisiydi.#!"
