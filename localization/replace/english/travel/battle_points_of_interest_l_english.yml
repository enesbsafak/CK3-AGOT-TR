 BattlePoiDescriptionLocPikemenKnight: "$BattlePoiCommanderCulture$ mızrakçılarının, $BattlePoiBraveKnight$ önderliğinde, düşman hücumunu geri püskürtmesiyle zaferleri kesinleşti,"
 BattlePoiDescriptionLocVarangian: "Muharebe, $BattlePoiBraveKnight$ önderliğindeki bir grup Vareg'in muharebe hatlarını aşması ve düşman formasyonunun derinliklerine girmesiyle sona erdi,"
 BattlePoiDescriptionLocBerserker: "Muharebe, $BattlePoiBraveKnight$'in, $BattlePoiEnemyCommanderCulture$ hatlarının arasından koşarak beklenmedik bir dönüş yapmasıyla seyretti,"
 BattlePoiDescriptionLocMidFallback: "Taraflar birbirlerini yıprattı ve sonunda $BattlePoiCommanderCulture$, düşmanı kuşattı"
