 great_project_type_minister_project_culture: "Bölgeyi Asimile Et"
 minister_project_culture_name_chinese: "Bölgeyi Çinlileştir"
 minister_project_culture_name_default: "Bölgenin Kültürünü Değiştir"
 great_project_type_minister_project_culture_desc: "Ortak değerleri paylaşmadıkça nasıl hakikaten birleşik olabiliriz? Farklılıklar çekişme ve huzursuzluk doğurur. Bu meseleleri, kısmen de olsa uzun vadeli bir asimilasyon gayretiyle çözebiliriz. Tek millet. Tek vatan..."
