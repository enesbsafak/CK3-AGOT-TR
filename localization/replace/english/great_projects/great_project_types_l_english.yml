 great_project_type_strengthen_capital_desc: "Bir başkent sadece devletin ikamet edeceği bir yer değildir. Başkent ülkemin kalbidir ve hükmümün görkemli bir sembolü olmalıdır. Tüm şehri elden geçirerek, sokakları iyileştirerek, bir üniversiteyi finanse ederek, heykeller ve diğer anıtlar dikerek bu güzel şehir Hanedanımın bir yansımasına dönüşebilir."
