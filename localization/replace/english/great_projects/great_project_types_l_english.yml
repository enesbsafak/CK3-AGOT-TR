 great_project_type_mandala_capital_02: "$building_type_mandala_capital_01$ Yükseltmesi"
 great_project_type_mandala_capital_02_desc: "Artık kudretli mâbedimizi genişletebilecek durumdayız. Çağlar boyunca ayakta kalacak bir harika yaratalım!"
 great_project_type_mandala_capital_02_possessive: "Görkemli Tapınağın"
 great_project_type_mandala_capital_02_contribution_rite_of_worthiness: "Layık Olma Âyini"
 great_project_type_mandala_capital_02_contribution_rite_of_worthiness_desc: "Bu [de_jure|E] [kingdom|E] içindeki inananların adanmışlığıyla, [GetBuilding('mandala_capital_01').GetTypeName] için iyileştirmelerde bulunmaya layık olduğumuzu kanıtlayacağız!"
 great_project_type_mandala_capital_02_contribution_brick: "Tuğla"
 great_project_type_mandala_capital_02_contribution_brick_desc: "Hiçbir şey yoktan var edilemez. [Concept('great_project', 'Büyük Projeye')|E], $building_mandala_capital_02$ işleri için gereken tüm tuğlayı sağlayacağız."
 great_project_type_mandala_capital_02_contribution_tiles: "Kiremit"
 great_project_type_mandala_capital_02_contribution_tiles_desc: "İşlevsel bir çatı, kiremitli çatı demektir. En iyi kiremitlerimizi [Concept('great_project', 'Büyük Projeye')|E] gönderecek ve onu nemden koruyacağız!"
 great_project_type_mandala_capital_02_contribution_shallow_pools: "Sığ Havuzlar"
 great_project_type_mandala_capital_02_contribution_shallow_pools_desc: "Su ögeleri serinlik sağlar ve bizi ilâhî düzleme bağlar, bu bakımdan elzemdir."
 great_project_type_mandala_capital_02_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_02_contribution_work_force_desc: "Büyük başarılar büyük emek ister! Bu $building_mandala_capital_02$ üzerindeki yenilemeleri bitirmek için [Concept('great_project', 'Büyük Projeye')|E] daha fazla insan gücü sağlamalıyız."
 great_project_type_mandala_capital_02_contribution_decorative_tiles: "Süs Kiremitleri"
 great_project_type_mandala_capital_02_contribution_decorative_tiles_desc: "Çatılara süs kiremitleri ekleyelim. Kavisli kenarlar. İnce işçilikli oyma. Gözlere ve ilâhî olana hoş gelecek daha çok ihtişam."
 great_project_type_mandala_capital_02_contribution_decorated_domes: "Süslenmiş Kubbeler"
 great_project_type_mandala_capital_02_contribution_decorated_domes_desc: "İyi bir kubbe yuvarlak kubbedir. Kısa zamanda silmeler ve nâzik motiflerle süslenecekler."
 great_project_type_mandala_capital_02_contribution_family_statues: "Veliahtın Kutsal Heykeli"
 great_project_type_mandala_capital_02_contribution_family_statues_desc: "İlâhî soyumuzun vârislerinin mübarek çehreleri taşa işlenecek, böylece ebediyen hatırlanacaklar."
 great_project_type_mandala_capital_03: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_03_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_03_possessive: "$building_mandala_capital_03$nin"
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness: "Layık Olma Âyini"
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness_desc: "[GetBuilding('mandala_capital_01').GetTypeName] için iyileştirmelerde bulunmaya layık olduğumuzu kanıtlayacağız, tarihin sayfalarında daha yükseğe yükseleceğiz!"
 great_project_type_mandala_capital_03_contribution_volcanic_stone: "Volkanik Kaya"
 great_project_type_mandala_capital_03_contribution_volcanic_stone_desc: "En yüce emeller en sağlam temelleri ister. Ebediyen sürecek sarsılmaz temeller kurmak için gereken volkanik kayayı [Concept('great_project', 'Büyük Projeye')|E] sağlayacağız."
 great_project_type_mandala_capital_03_contribution_corbel_gateways: "Konsollu Kapı Geçitleri"
 great_project_type_mandala_capital_03_contribution_corbel_gateways_desc: "Mâbedi genişletirken yapıyı taşıyacak sahih çerçevelere ihtiyacımız var. Bu geçitler, aydınlanma arayışıyla avluda dolaşanları doğru yola sevk edecektir."
 great_project_type_mandala_capital_03_contribution_divine_statues: "İlâhî Heykeller"
 great_project_type_mandala_capital_03_contribution_divine_statues_desc: "Bu dev başlar ürkütücü görünebilir, lakin özünde bu mekânı kutsar, havayı ve fazileti telkin ederler."
 great_project_type_mandala_capital_03_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_03_contribution_work_force_desc: "İlâhî olana erişmek için çok çalışmalıyız. $building_mandala_capital_03$u inşa etmek için daha fazla adama ihtiyaç var, katkımız cömertçe mükâfatlandırılacaktır."
 great_project_type_mandala_capital_03_contribution_creation_aspect: "Yaratılış Heykelleri"
 great_project_type_mandala_capital_03_contribution_creation_aspect_desc: "Bu dev başlar ufka dalmış, planlayan, tertip eden, bu düzlemde ve ötekinde hayatı muhafaza eden çehrelere sahiptir. İlâhî hükümdarımıza şaşılacak derecede benzerler."
 great_project_type_mandala_capital_03_contribution_serenity_aspect: "Sükûnet Heykelleri"
 great_project_type_mandala_capital_03_contribution_serenity_aspect_desc: "Bu dev başlar sükûnet ve huzur saçar, sanki aydınlanmaya erişmiş gibidirler. İlâhî hükümdarımıza şaşılacak derecede benzerler."
 great_project_type_mandala_capital_03_contribution_destruction_aspect: "Yıkım Heykelleri"
 great_project_type_mandala_capital_03_contribution_destruction_aspect_desc: "Bu dev başların yüzünde azametli bir hiddet vardır, bu mukaddes topraklara tecavüze cüret eden düşmana doğru atılmaya hazırdırlar. İlâhî hükümdarımıza şaşılacak derecede benzerler."
 great_project_type_mandala_capital_03_contribution_trickery_aspect: "Hilekârlık Heykelleri"
 great_project_type_mandala_capital_03_contribution_trickery_aspect_desc: "Bu dev başların yüzünde muzır bir tebessüm vardır, hem hakikî hem felsefi manada içinizi gördükleri hissini uyandırırlar. İlâhî hükümdarımıza şaşılacak derecede benzerler."
 great_project_type_mandala_capital_03_contribution_gilded_domes: "Yaldızlı Kubbeler"
 great_project_type_mandala_capital_03_contribution_gilded_domes_desc: "İhtişamını saçması için $building_mandala_capital_03$nin kubbeleri sunulabilecek en nâzik altınla kaplanmalıdır."
 great_project_type_mandala_capital_03_contribution_family_temple_compound: "Aile Mâbedi Kümesi"
 great_project_type_mandala_capital_03_contribution_family_temple_compound_desc: "Bu büyük mâbedleri inşa eden ilâhî hükümdarın oğul ve kızlarının ibadeti için mukaddes bir külliye."
 great_project_type_mandala_capital_04: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_04_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_04_possessive: "$building_mandala_capital_04$nin"
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness: "Layık Olma Âyini"
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness_desc: "[GetBuilding('mandala_capital_01').GetTypeName] için iyileştirmelerde bulunmaya layık olduğumuzu kanıtlayacağız, dünyaya mührümüzü vuracağız!"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite: "Granit Levhalar"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite_desc: "Ölümsüz yegâne suret, taş işçiliğine oyulandır. Ebediyete kalacak $building_mandala_capital_04$ sanatı için en nâzik taşı temin edeceğiz."
 great_project_type_mandala_capital_04_contribution_zaungdans: "Zaungdanlar"
 great_project_type_mandala_capital_04_contribution_zaungdans_desc: "İlâhî merdivenler, yukarıya yükselmenin ve böylece ilâhî olana yaklaşmanın mühim bir parçasıdır. Ayrıca pazar tezgâhları ve sair ihtiyaçlar için de mükemmel bir mekândır."
 great_project_type_mandala_capital_04_contribution_gilded_shrines: "Yaldızlı Türbeler"
 great_project_type_mandala_capital_04_contribution_gilded_shrines_desc: "Putları barındıran türbelerimiz olacak, her puttaki her bir tanrı bize merhamet gösterecek ve ilâhî hükümdarımıza yardım edecektir."
 great_project_type_mandala_capital_04_contribution_work_force: "İşgücü"
 great_project_type_mandala_capital_04_contribution_work_force_desc: "Böylesi muazzam bir iş yalnızca bilek ve ter değil, keskin gözler, zarif aletler ve bir zanaatkârın zihnini ister. Sağlayacağımız emek, ham malzeme taşımakla kalmayacak, [Concept('great_project', 'Büyük Projenin')|E] şiddetle ihtiyaç duyduğu ince sanat eserlerini yaratacaktır."
 great_project_type_mandala_capital_04_contribution_bell_stupas: "Çan Stupaları"
 great_project_type_mandala_capital_04_contribution_bell_stupas_desc: "$building_mandala_capital_05$ için en nâzik mermer sunulacak, böylece en zarif temeller üzerine oturacaktır."
 great_project_type_mandala_capital_04_contribution_bejeweled_domes: "Mücevherli Kubbeler"
 great_project_type_mandala_capital_04_contribution_bejeweled_domes_desc: "Semâlar bu $building_mandala_capital_04$nin üzerinde parıldamalı, onu, sanki bizzat yıldızlar bu ilâhî külliyenin sütunları arasında konaklıyormuş gibi gösterecek mücevherlerle [Concept('great_project', 'Büyük Projeyi')|E] süsleyeceğiz."
 great_project_type_mandala_capital_04_contribution_family_temple_complex: "Aile Mâbedi Kompleksi"
 great_project_type_mandala_capital_04_contribution_family_temple_complex_desc: "Yüce Devaraja'mızın zürriyeti, kraliyet şehri içinde kendilerine mahsus bir Mâbedler Kompleksi ile onurlandırılacak. Burada, kudret dizginlerini ele almadan çok önce kendilerine ibadet edilecektir."
 great_project_type_mandala_capital_05: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_05_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_05_possessive: "$building_mandala_capital_05$nın"
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness: "Layık Olma Âyini"
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness_desc: "[GetBuilding('mandala_capital_01').GetTypeName] için iyileştirmelerde bulunmaya layık olduğumuzu kanıtlayacağız, onu ulu bir yapıya dönüştüreceğiz!"
 great_project_type_mandala_capital_05_contribution_marble_foundation: "Mermer Temel"
 great_project_type_mandala_capital_05_contribution_marble_foundation_desc: "$building_mandala_capital_05$ için en nâzik mermer sunulacak, böylece en zarif temeller üzerine oturacaktır."
 great_project_type_mandala_capital_05_contribution_divine_barays: "İlâhî Baraylar"
 great_project_type_mandala_capital_05_contribution_divine_barays_desc: "Yapımız, bizi düşmandan koruyan ve ruhlar âlemine bağlayan en derin havuzlara sahip olacaktır."
 great_project_type_mandala_capital_05_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_05_contribution_work_force_desc: "Ülkenin dört bucağından, en mütevazı köylüden en bilge âlime kadar her hünerden emekçileri $building_mandala_capital_05$nın inşasına yardımcı olmak üzere sağlayacağız."
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs: "Mücevherli Kabartmalar"
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs_desc: "Semavi dansçı kabartmaları duvarları kaplayacak, zarafeti yansıtacaklar, mücevherli kisveleriyle tamamlanacaklar."
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest: "Bunga Mas Ormanı"
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest_desc: "Bu denli yüce ve müstakim bir anıt, ince ve derin armağanlar ister. En seçkin zanaatkârların ince işçiliğiyle, altından yapılmış ağaçlar ve çiçeklerden oluşan bir sergiyi $building_mandala_capital_05$na sunacağız."
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex: "Hanedan Mâbedi Alanı"
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex_desc: "Başkentin mâbedler kompleksinde Devaraja'mız için bir bölüm, soyumuzun ve evlâdının ibadetine tahsis edilecektir."
 great_project_error_plan_mandala_capital: "Mandala Başkentinin genişlemesini planlamak için gerekenler eksik"
 only_single_great_project_type_allowed: "Bu türdeki bir [great_project|E] hâlihazırda planlama veya inşa aşamasında #bold değil#!"
