 great_project_type_mandala_capital_01: "$building_type_mandala_capital_01$"
 great_project_type_mandala_capital_01_desc: "Çağlara kendi katkımızı sunma vakti geldi. Yüce Devaraja'mızı onurlandırmak için kudretli bir mâbed inşa edeceğiz!"
 great_project_type_mandala_capital_01_possessive: "$building_type_mandala_capital_01$nin"
 great_project_type_mandala_capital_01_contribution_rite_of_worthiness: "Layık Olma Âyini"
 great_project_type_mandala_capital_01_contribution_rite_of_worthiness_desc: "Bu [de_jure|E] [kingdom|E] içindeki inananların adanmışlığıyla, bir [GetBuilding('mandala_capital_01').GetTypeName] inşa etmeye layık olduğumuzu kanıtlayacağız!"
 great_project_type_mandala_capital_01_contribution_slabs_of_sandstone: "Kumtaşı Levhalar"
 great_project_type_mandala_capital_01_contribution_slabs_of_sandstone_desc: "Bu tapınak ilâhî olana hürmet etse de, inşası için dünyevî imkânlar sağlanmalı. [great_project|E] için gerekli malzemeyi sağlamak, yapılabilecek en büyük katkılardandır."
 great_project_type_mandala_capital_01_contribution_laterite_blocks: "Laterit Bloklar"
 great_project_type_mandala_capital_01_contribution_laterite_blocks_desc: "Laterit toprak, sağlam bir temel ve süsleme için gereklidir."
 great_project_type_mandala_capital_01_contribution_timber: "Kereste"
 great_project_type_mandala_capital_01_contribution_timber_desc: "Kirişler, çatılar, döner kapılarla yapıyı desteklemek ve dekoratif kaplamalara imkân tanımak için ihtiyaç duyduğumuz tüm keresteyi kullanacağız."
 great_project_type_mandala_capital_01_contribution_work_force: "İşgücü"
 great_project_type_mandala_capital_01_contribution_work_force_desc: "Taşlar kendi kendine yürümez. Bu yüce vazifeyi tamamlamak için gereken ham insan gücünü [Concept('great_project', 'Büyük Projeye')|E] sağlayacağız."
 great_project_type_mandala_capital_01_contribution_woodcarvings: "Ahşap Oymalar"
 great_project_type_mandala_capital_01_contribution_woodcarvings_desc: "Dekoratif kaplamalara ek olarak, ilâhî olana hürmet eden ve halkımıza bereket getiren oymalar ve süslemeler yapacağız."
 great_project_type_mandala_capital_01_contribution_sanctified_domes: "Kutsanmış Kubbeler"
 great_project_type_mandala_capital_01_contribution_sanctified_domes_desc: "Kubbeler inşa edeceğiz, insan eliyle yapılmış bu eserler, kendi zekâmızı tefekkür etmemize imkân verir."
 great_project_type_mandala_capital_01_contribution_ornate_reliefs: "Süslü Kabartmalar"
 great_project_type_mandala_capital_01_contribution_ornate_reliefs_desc: "Devataları, apsaraları ve ilâhî anları tasvir eden kabartmalar bu mekânı dolduracak, müminlerini hayrete düşürecek."
 great_project_type_mandala_capital_01_contribution_family_shrine: "Aile Türbesi"
 great_project_type_mandala_capital_01_contribution_family_shrine_desc: "Yüce hükümdarlarımızın zürriyetine adanmış müstakil bir Türbe."
 great_project_mandala_capital_pick_aspect_tt: "Bir [mandala_aspect|E] benimsediniz"
