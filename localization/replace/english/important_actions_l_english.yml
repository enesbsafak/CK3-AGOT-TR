 TLFR_FOREIGN_RULER_SUCCESSION_TIPS:1 "#help Vasalınız, yabancı bir ülkede şu anki [Concept( 'primary_title', 'birincil unvanından' )|E] daha yüksek [Concept( 'title_tier', 'seviyedeki' )|E] bir unvan alırsa sizin vasalınız olmayı bırakır.\n\nVasalınızın toprağının ülkeden çıkmasını engellemek için aşağıdakileri yapmaya çalışabilirsiniz:\n$BULLET_WITH_TAB$Vasalınızın unvanını [Concept( 'revoke', 'feshedebilirsiniz' )|E]\n$BULLET_WITH_TAB$Vasalınıza miras olarak devralacağı unvanla aynı [Concept('title_tier', 'seviyede')|E] bir unvan verebilirsiniz#!"
