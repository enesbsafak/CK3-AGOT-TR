 CREATE_USURP_TITLE_PROS_CONS:1 "\n$BULLET_WITH_TAB$[Concept( 'rank', 'Kademenizi' )|E] arttırabilirsiniz\n$BULLET_WITH_TAB$[de_jure|E] [casus_bellis|E] kazanırsınız\n$BULLET_WITH_TAB$[vassals|E] sizi [Concept( 'rightful_liege', 'meşru süzerenleri' )|E] olarak görebilir\n$BULLET_WITH_TAB$[prestige|E] kazanırsınız\n\nFakat bazı olumsuz tarafları da vardır:\n$BULLET_WITH_TAB$Vasallarınız o unvanı istemeye başlayabilir\n$BULLET_WITH_TAB$[Concept( 'realm', 'Ülkenizin' )|E] [Concept( 'succession_law', 'veraset yasasına' )|E] göre birden fazla [realm_heirs|E] varsa kimin hangi unvanı miras olarak devralacağı değişir."
 CALL_TO_WAR_HELP:1 "\n\n#help Diğer [Concept( 'rulers', 'hükümdarları' )|E] savaşa çağırarak kazanma olasılığınızı arttırabilirsiniz ama katılan her [ally|E] için [prestige|E] ödemek gerektiğini unutmayın. Çağrınızı kabul ederlerse [dynasty|E] mensupları için [dynasty_prestige|E] ödemeniz gerekirken [house|E] mensupları bedavaya katılacaktır.#!"
