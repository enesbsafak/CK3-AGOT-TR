 action_can_use_hook_to_change_contract_desc:1 "Feodal [Concept( 'vassal', 'Vasalınız' )|E] olan [recipient.GetUIName] üzerinde sahip olduğunuz [Concept( 'hook', 'Kozu' )|E] kullanarak [vassal_contract|E] değişiklikleri yapabilirsiniz.\n\n#help Elinizdeki [Concept( 'hooks', 'Kozları' )|E] değerlendirmenin en iyi yollarından birisi [vassals_possessive|E] [Concept( 'obligations', 'Yükümlülüklerini' )|E] arttırmaktır.\n\nNormalde adaletsiz sözleşme teklif etmek [tyranny|E] elde etmenizle sonuçlanır fakat elinizdeki Kozu kullanarak bu durumu ortadan kaldırabilirsiniz. Tek [vassal_contract|E] değişiminde sadece bir adaletsiz teklifte bulunabilirsiniz, fazlası yine [tyranny] elde etmenizle sonuçlanır.\n\n[vassal_contract|E] üzerinde değişiklik yaparken #high 'Koz Kullan' kutusuna tik atmayı#! unutmayın.#!"
