 action_in_debt_desc: "Sahip olduğunuz [Concept( 'gold', 'altın' )|E] miktarı şu anda [gold_i|E]#V 0'ın#! altında, bu nedenle [Concept( 'debt', 'borçtasınız' )|E]!\n\nBorçta olmak aşağıdaki etkilere sahiptir:\n$BULLET_WITH_TAB$[war|E] açamazsınız.\n$BULLET_WITH_TAB$[gold_i|E][gold|E] gereken [Concept( 'men_at_arms', 'Düzenli Askerler' )|E] takviye almaz.\n$BULLET_WITH_TAB$[domain|E] topraklarınızda [county_corruption|E] yayılır.\n$BULLET_WITH_TAB$[vassals|E] [Concept( 'factions', 'örgütleşmelere' )|E] katılmaya daha meyillidir\n\nNe kadar fazla borçtaysanız o kadar fazla ceza alırsınız. Mevcut borç seviyenizin fazladan etkileri aşağıdaki gibidir:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Her ay altın kazanmıyorsanız giderinizi azaltmaya çalışın. Örneğin aşağıdakileri yapmayı deneyebilirsiniz:\n$BULLET_WITH_TAB$[Concept( 'armies', 'Ordularınızı' )|E] terhis edin.\n$BULLET_WITH_TAB$[Concept( 'men_at_arms', 'Düzenli askerlerinizin' )|E] sayısını azaltın veya tamamını yok edin\n$BULLET_WITH_TAB$[Concept( 'marshal', 'Mareşalinizi' )|E] kullanarak [Concept( 'control', 'kontrolü' )|E] arttırın\n$BULLET_WITH_TAB$[Concept( 'court_positions', 'Saray Pozisyonuna' )|E] sahip kişileri kovun#!"
