 board_games.0001.desc.intro.learning.crit_success:0 "efsanelere konu olacak derecede iyi bir hamle yapıyor."
 board_games.0001.desc.intro.learning.success:0 "birkaç bilinen iyi hamle yapıyor."
 board_games.0001.desc.intro.learning.failure:0 "birkaç oldukça düz hamle yapıyor."
 board_games.0001.desc.intro.learning.crit_failure:0 "daha iyi oyuncuları taklit etmeye çalıştığı birkaç kötü hamle yapıyor."
 board_games.0001.desc.intro.prowess.crit_success:0 "#EMP son derece#! zorlayıcı bir hamle yapıyor."
 board_games.0001.desc.intro.prowess.success:0 "etkili ve sağlam bir hamle yapıyor."
 board_games.0001.desc.intro.prowess.failure:0 "kötü ve başarısız bir hamle yapıyor."
 board_games.0001.desc.intro.prowess.crit_failure:0 "o kadar gülünç ve başarısız bir hamle yapıyor ki kendimi zor tutuyorum."
