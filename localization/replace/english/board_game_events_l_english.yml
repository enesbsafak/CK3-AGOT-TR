l_english:
 board_games.0000.t:0 "Güzel Oyun: [SCOPE.Custom('BG_GameType')|U]"
 board_games.0001.t:0 "$board_games.0000.t$"

 board_games.0001.desc.opponent_winning.diplomacy.low:0 ""Biliyor musun," diye düşünür rakibim, "pek konuşkan biri olmayabilirim, ama [SCOPE.Custom('BG_GameType')] oyununda ürkütücü derecede iyiyim.""

 board_games.0001.desc.opponent_winning.diplomacy.medium:0 ""Ahhhh, keşke topluluk önünde konuşmak da [SCOPE.Custom('BG_GameType')] oyununda seni yenmek kadar kolay olsaydı," diye söyler rakibim."

 board_games.0001.desc.opponent_winning.diplomacy.high:0 ""Hangisinin daha kolay olduğunu gerçekten bilmiyorum," diye yakınır rakibim, "seni [SCOPE.Custom('BG_GameType')] oyununda yenmek mi, yoksa senin utanç verici kaybının hikâyesini anlatmak mı.""

 board_games.0001.desc.opponent_winning.martial.low:0 ""Savaş [SCOPE.Custom('BG_GameType')] kadar kolay olsaydı, şimdiye kadar dünyayı yönetirdim," diye güler rakibim. "Ama sonra, bu sadece benim.""

 board_games.0001.desc.opponent_winning.martial.medium:0 ""Mmmm, pek stratejist sayılmazsın, değil mi?" diye kıkırdar rakibim."

 board_games.0001.desc.opponent_winning.martial.high:0 ""Savaş meydanı, oyun tahtası... hepsi en önemli şeyin bir parçası," diye cıvıldar rakibim. [bg_opponent.GetSheHe|U] vurgulamak için parmak eklemiyle [bg_opponent.GetHerHis] alnına vurur."

 board_games.0001.desc.opponent_winning.stewardship.low:0 ""Keşke para işleri de [SCOPE.Custom('BG_GameType')] oynamak kadar kolay olsaydı," diye söyler rakibim. "Gümüşlerin içinde yüzerdim.""

 board_games.0001.desc.opponent_winning.stewardship.medium:0 ""Sence [SCOPE.Custom('BG_GameType')] gerçek yönetim için iyi bir alıştırma mı?" diye sorar rakibim kayıtsızca. "Ben hep öyle düşünmüşümdür. Bununla... bir şey ima etmiyorum ama.""

 board_games.0001.desc.opponent_winning.stewardship.high:0 ""Her zaman [SCOPE.Custom('BG_GameType')]'in bir [bg_opponent.GetWomanMan]'e krallık yönetimi hakkında çok şey öğretebileceğini söylemişimdir," diye nutuk çeker rakibim. "Ve doğal olarak, tersi de geçerli.""

 board_games.0001.desc.opponent_winning.intrigue.low:0 ""İşte bu yüzden [SCOPE.Custom('BG_GameType')] seviyorum," diye fikir beyan eder rakibim. "Gizlice dolaşmak yok, yalan yok, sadece dürüst bir zekâ oyunu. Öyle bir oyun ki, yani...""

 board_games.0001.desc.opponent_winning.intrigue.medium:0 ""Birinin nasıl yalan söylediğini, [SCOPE.Custom('BG_GameType')] sırasında [bg_myself.Custom('MaskFace')]ni izleyerek #EMP birebir#! öğrenebileceğini biliyor muydun?" diye sorar rakibim. "Ah, demek istemedim... sadece bir not...""

 board_games.0001.desc.opponent_winning.intrigue.high:0 ""Dikkat et," diye sırıtır rakibim, "böyle bir hamle daha yaparsan tuzak [SCOPE.Custom('BG_GamePiece')]m devreye girecek.""

 board_games.0001.desc.opponent_winning.learning.low:0 ""Biliyor musun, zekamı kanıtlamam için #EMP kitap#! okumam gerektiğini söylüyorlar," diye nutuk çeker rakibim, "ama şu an o kadar da serseri olmadığım gayet açık.""

 board_games.0001.desc.opponent_winning.learning.medium:0 ""Açıkçası," diye söze başlar rakibim, "kime karşı oynadığını düşününce bu kadar iyi oynaman etkileyici.""

 board_games.0001.desc.opponent_winning.learning.high:0 ""[SCOPE.Custom('BG_GameType')] oyununu kapsamlıca inceledim," diye açıklar rakibim, "ve üzgünüm ama bu noktada kazanman için hiçbir yol olmadığını düşünüyorum.""

 board_games.0001.desc.opponent_winning.trait.lustful:0 ""Dünyanın hem en büyük aşığı #EMP hem de#! en iyi [SCOPE.Custom('BG_GameType')] oyuncusu olarak, bana kaybetmeni yadırgamıyorum," diye kıkırdar rakibim."

 board_games.0001.desc.opponent_winning.trait.chaste:0 ""Evdeki disiplin tahtada disiplin doğurur, bilirsin," diye nutuk çeker rakibim. "Biraz itidal uzun yol kat eder.""

 board_games.0001.desc.opponent_winning.trait.gluttonous:0 ""Sanırım zaferimi bir ziyafetle kutlayabilirim," diye düşünür rakibim. "Zafere eşlik etmesi için tatlı bir şeyler canım çekiyor.""

 board_games.0001.desc.opponent_winning.trait.temperate:0 ""Bu oyundan sonra kendime bir kupa gül kokulu su bile ikram edebilirim," diye düşünür rakibim. "Kendime sık sık ödül vermem, ama sanırım bunu hak ettim.""

 board_games.0001.desc.opponent_winning.trait.greedy:0 ""Şıngırdayan altından daha tatlı tek şey, bir [bg_myself.GetWomanMan]'in gözyaşlarının [SCOPE.Custom('BG_GameType')] tahtasına düşen yumuşak damlalarıdır," diye gülümser rakibim. "Katılmıyor musun?""

 board_games.0001.desc.opponent_winning.trait.generous:0 ""Bak, kazanıyor olabilirim, ama güzelce istersen... bu zaferi sana bırakmaya razıyım," diye açıklar rakibim, sesi nezaket ve acıma akıyor. "Hayatta [SCOPE.Custom('BG_GameType')] kazanmaktan daha önemli şeyler var.""
 board_games.0001.desc.opponent_winning.trait.lazy:0 "Rakibim sesli bir şekilde esniyor. "Beni biraz daha zorlamanı beklerdim, [bg_myself.GetFirstNameNoTooltip]. Kendimi uyumamak için zor tutuyorum.""

 board_games.0001.desc.opponent_winning.trait.diligent:0 ""İşte bu yüzden emek vermelisin," diye teselli eder rakibim, ses tonu #EMP tamamen#! katlanılmaz. "Hayatta da [SCOPE.Custom('BG_GameType')] oyununda da çok çalışmanın yerini hiçbir şey tutmaz.""
 board_games.0001.desc.opponent_winning.trait.wrathful:0 "Rakibim tuhaf ve beklenmedik bir şekilde sakin. "Ah, kızacağım pek bir şey yok," diyor ona baktığımı fark ettiğinde, "özellikle de işler bu kadar #EMP iyi#! giderken.""

 board_games.0001.desc.opponent_winning.trait.calm:0 ""Her zaman [SCOPE.Custom('BG_GameType')]'in anahtarının berrak bir zihin ve soğukkanlı bir kafa olduğunu bulmuşumdur," diye düşünür rakibim. "Bir gün sen de ona sahip olacaksın.""

 board_games.0001.desc.opponent_winning.trait.patient:0 ""Çoğu insan," diye ders verir rakibim, "[bg_opponent.Custom('BG_RandomArticleDirection')] [bg_opponent.Custom('BG_RandomRankPossessive')] [bg_opponent.Custom('BG_RandomMoveType')] yapmanın ne kadar zor olduğunu tam olarak anlamaz. Ona karşı savunmak bir yana.""

 board_games.0001.desc.opponent_winning.trait.impatient:0 ""[SCOPE.Custom('BG_GameType')] oynarken gerçekten oldukça yavaşsın, [bg_myself.Custom2('GetYoungMiddleAgedOld',bg_opponent)] [bg_myself.GetWomanMan]," diye mırıldanır rakibim, [bg_opponent.GetHerHis] parmaklarını tahtaya vurarak."

 board_games.0001.desc.opponent_winning.trait.arrogant:0 ""Üzülme [bg_myself.GetFirstNameNoTooltip]," diye yaltaklanır rakibim, [bg_opponent.GetSheHe] oturduğu yerde keyifle uzanırken. "Hepimiz bu kadar doğal #EMP yetenekli#! olamayız!""

 board_games.0001.desc.opponent_winning.trait.humble:0 ""Açıkçası harika gidiyorsun," diye cıvıldar rakibim. "Genelde bu kadar iyi oynamam, o yüzden sanırım sadece şanssızsın.""

 board_games.0001.desc.opponent_winning.trait.deceitful:0 ""Kendini çok üzme," diye yatıştırır rakibim, sesi bal gibi tatlı. "Hamlelerimi [bg_opponent.GetFaith.TricksterGodName] bile takip edemez.""

 board_games.0001.desc.opponent_winning.trait.honest:0 ""Vay, her şey beklediğimden #EMP çok#! daha iyi gidiyor!" diye haykırır rakibim. "Hiç de zor bir rakip değilsin... ah, kusura bakma, kaba olmak istemedim. Sadece dürüstüm.""

 board_games.0001.desc.opponent_winning.trait.craven:0 ""Ben... kazanıyor muyum? Kazanıyorum!" diye haykırır rakibim. [bg_opponent.GetSheHe|U] gerçekten şaşırmış görünüyor, ama sonra, maçın yarısını [bg_opponent.GetHerHis] parmaklarının arasından izlemekle #EMP geçirmişti#!."

 board_games.0001.desc.opponent_winning.trait.brave:0 ""Ufak bir kıkırdama kusuruma bakma," diye söyler rakibim. "ama beni yenmek için #EMP bundan#! daha cesur oynaman gerekecek.""

 board_games.0001.desc.opponent_winning.trait.shy:0 ""Bütün o alıştırmalar meyvesini veriyor!" diye cıyaklar rakibim, tahtanın haline ürkek bir gururla gülümseyerek."

 board_games.0001.desc.opponent_winning.trait.gregarious:0 ""Kendini çok kötü hissetme," diye uzatır rakibim, [bg_opponent.GetHerHis] parmaklarını çıtlatırken. "[SCOPE.Custom('BG_GameType')] oyununda dost edindiğim gibi kazanıyorum. Ürkütücü bir kolaylıkla.""

 board_games.0001.desc.opponent_winning.trait.ambitious:0 ""Sence oyunların bir tür... #EMP Kralı#! mı atarlar?" diye sorar rakibim, [bg_opponent.GetHerHis] çenesini kaşıyarak. "Ben zaten o unvana doğru ilerlediğimi hissediyorum, anlıyor musun.""

 board_games.0001.desc.opponent_winning.trait.content:0 ""Ne hoş bir oyun," diye kıkırdar rakibim. "Daha iyisini isteyemezdik, değil mi? Yani senin şansından başka.""

 board_games.0001.desc.opponent_winning.trait.arbitrary:0 ""Genelde kurallara pek meraklı biri değilimdir," diye fikir beyan eder rakibim, "ama [SCOPE.Custom('BG_GameType')] cazibesini az da olsa görmemi sağlıyor. Bazen başkalarına senden daha iyi olduğunu #EMP kabul ettirmeni#! sağlıyorlar.""

 board_games.0001.desc.opponent_winning.trait.just:0 ""Bak," diye açıklar rakibim, bana bir tomar kâğıt sallayarak. "Kurallara aykırı hamleler yapmaya devam etmene üzülüyorum, ama #EMP kuralları okusaydın#!, daha iyi oynardın.""

 board_games.0001.desc.opponent_winning.trait.cynical:0 ""Doğal olarak, sana karşı kolay davranmıyorum," diye sırıtır rakibim. "Sen bana #EMP kesinlikle#! kolay davranmazdın, o yüzden ne diye uğraşayım?""

 board_games.0001.desc.opponent_winning.trait.zealous:0 ""Bu kesin zaferin payını alabilmeyi isterdim," diye tembelce söyler rakibim, "ama hepsi [bg_opponent.GetFaith.KnowledgeGodName]'in işi, #EMP benim aracılığımla#!.""

 board_games.0001.desc.opponent_winning.trait.paranoid:0 ""Hâlâ aklında bir hile olduğunu biliyorum," diye kaşlarını çatar rakibim. "Hiç kimse bu kadar kolay yenilecek biri olamaz.""

 board_games.0001.desc.opponent_winning.trait.trusting:0 ""Sıra sende olduğu sırada ben helaya uğrayabilirim," diye gülümser rakibim. "Sakın [SCOPE.Custom('BG_GamePiecePlural')]le oynama!""

 board_games.0001.desc.opponent_winning.trait.compassionate:0 ""Seni zor bir duruma soktuğum için üzgünüm, [bg_myself.GetFirstNameNoTooltip]," der rakibim, [bg_opponent.GetHerHis] sesi gerçekten pişmanlık dolu. "[SCOPE.Custom('BG_GameType')] eğlenmek için oynuyorum, ama bence asıl eğlence #EMP ikimiz de#! keyif aldığımız zaman.""

 board_games.0001.desc.opponent_winning.trait.callous:0 ""[bg_opponent.GetFaith.HouseholdGodName] aşkına, pek direniş gösteremiyorsun, değil mi?" diye haykırır rakibim açık sözlülükle."

 board_games.0001.desc.opponent_winning.trait.sadistic:0 ""Yaralı bir düşmanla oynamak #EMP çok#! daha eğlenceli," diye uzatır rakibim azımsanmayacak kadar keyifli bir zehirle, "katılmıyor musun, [bg_myself.GetFirstNameNoTooltip]?""

 board_games.0001.desc.opponent_winning.trait.stubborn:0 ""Değişiklik olsun diye bu kadar kolay bir zafer kazanmak ne güzel," diye alay eder rakibim. "Genelde diğer oyuncu kazandığımı kabul etmeden önce birkaç saat tartışmam gerekir.""

 board_games.0001.desc.opponent_winning.trait.fickle:0 ""Hangi stratejiyi seçersem seçeyim, senin hep aynı şekilde kaybetmeni gerçekten çok seviyorum," diye espriler yapar rakibim."

 board_games.0001.desc.opponent_winning.trait.vengeful:0 ""Elbette, bunların hepsi bir öç alma," diye tıslar rakibim. "Ve #EMP gayet#! iyi biliyorsun nedenini.""

 board_games.0001.desc.opponent_winning.trait.forgiving:0 ""Açıkçası biraz daha zorlu bir rakip bekliyordum," diye sızlanır rakibim. "Ama sorun değil. En azından iyi bir antrenman oluyorsun.""
 board_games.0001.desc.opponent_winning.trait.rowdy:0 "Ufak rakibim bana karşı tehditler savuruyor ve bu sırada oyun masasını bir köşeye fırlatıyor."

 board_games.0001.desc.opponent_winning.trait.charming:0 ""[SCOPE.Custom('BG_GameType')] her gün oynamalıyız [bg_myself.GetFirstNameNoTooltip]," diye cıvıldar minik rakibim. "Hep çok eğlenceli!""

 board_games.0001.desc.opponent_winning.trait.curious:0 ""Biliyor musun," diye düşünür minik rakibim, "seni yenmekten gerçekten çok şey öğreniyorum.""

 board_games.0001.desc.opponent_winning.trait.pensive:0 ""[SCOPE.Custom('BG_GameType')] oynamayla ilgili çok şey okudum," diye parlar minik rakibim, "ama bunu #EMP uygulamanın#! bu kadar kolay olacağını bilmiyordum!""

 board_games.0001.desc.opponent_winning.trait.bossy:0 ""Seni yendikten sonra," diye ilan eder minik rakibim, "tatlı çörek istiyorum. Haraç olarak.""

 board_games.0001.desc.opponent_winning.relation.friend:0 ""Güler yüzlü ol, suratsız [bg_myself.Custom('MaskFace')]," diye güler rakibim. "Bu sadece dostlar arasında küçük bir oyun, değil mi?""

 board_games.0001.desc.opponent_winning.relation.best_friend:0 ""Ne kadar önemi varsa, kazan ya da kaybet," der en iyi dostum, "dünyada [SCOPE.Custom('BG_GameType')] oynamayı senden daha çok isteyeceğim kimse yok.""

 board_games.0001.desc.opponent_winning.relation.rival:0 ""[bg_opponent.GetFaith.FateGodName] aşkına, [SCOPE.Custom('BG_GameType')] oynamakta da hükmetmekte olduğun kadar kötüsün!" diye kahkaha atar rakibim."
 board_games.0001.desc.opponent_winning.relation.nemesis:0 "Can düşmanım hiçbir şey demiyor. Sadece bana bakıyor, [bg_opponent.Custom('EyeEyes')] saf #EMP nefret#! ile parlıyor."
 board_games.0001.desc.opponent_winning.relation.lover:0 "Benimle göz temasını kesmeden, sevgilim nazik bir şekilde parmaklarıyla [SCOPE.Custom('BG_GamePiecePlural')]ı okşamaya başlıyor ve... Aman. #EMP Aman aman#!"
 board_games.0001.desc.opponent_winning.relation.soulmate:0 "Ruh eşim [SCOPE.Custom('BG_GameType')] oyunumuza yarım yamalak dikkat ediyor. Genellikle, [bg_myself.Custom('EyeEyes')] bana derin bakışlar atmakla meşgul."

 board_games.0001.desc.opponent_winning.relation.bully:0 ""Gördün mü?" diye kıkırdar rakibim, "sana bu yüzden vuruyorum. Sen #EMP tam bir#! kaybedensin.""
 board_games.0001.desc.opponent_winning.relation.victim:0 "Kurbanımın gözleri haklı bir öfke ile parlıyor, sonunda bir şey #EMP kendi#! lehine gittiği için mutlu."
 board_games.0001.desc.opponent_winning.relation.crush:0 "Bir dakika, bir şey mi dedi? Sanırım bir şey dedi! Lanet olsun, bazen ona bakarken öyle bir dalıyorum ki şimdi her şeyi mahvettim."

 board_games.0001.desc.opponent_winning.relation.guardian:0 ""Beni dikkatle izle [bg_myself.GetFirstName]," der vasim. "Nasıl oynadığımı incele, belki bir şeyler öğrenirsin.""
 board_games.0001.desc.opponent_winning.relation.ward:0 "Öğrencim bana geniş bir gülümseme ile bakıyor. "Daha sık [SCOPE.Custom('BG_GameType')] oynayabilir miyiz? #EMP lütfen#!!""

 board_games.0001.desc.opponent_winning.hook_on.weak:0 "$board_games.0001.desc.opponent_winning.hook_on.strong$"

 board_games.0001.desc.opponent_winning.hook_on.strong:0 ""Oyunun kaderini tersine çevirmek iyi hissettiriyor, biliyor musun," der rakibim. "Her zaman beni parmağında oynattığın izlenimi veriyorsun. Tabii [SCOPE.Custom('BG_GameType')] oynamıyorsak.""

 board_games.0001.desc.opponent_winning.hooked_by.weak:0 "$board_games.0001.desc.opponent_winning.hooked_by.strong$"

 board_games.0001.desc.opponent_winning.hooked_by.strong:0 ""Aramızdaki #EMP anlaşma#! yüzünden bilerek kaybetmiyorsun, değil mi?" diye sorar rakibim, [bg_opponent.GetHerHis] çenesini düşünceli bir şekilde kaşıyarak. "Çünkü kaybetmeye çalışıyormuş gibi oynuyorsun.""

 board_games.0001.desc.opponent_winning.match_history.recently_won_against.default:0 ""Ahhh, seni kaç kez yendim şimdiye kadar?" diye kıkırdar rakibim. "#EMP Dürüst olmak#! gerekirse sayısını kaybettim.""

 board_games.0001.desc.opponent_winning.match_history.recently_won_against.county:0 ""[bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] iyi gidiyor biliyor musun," diye uzatır rakibim, "ben yönetimi devraldığımdan beri #EMP çok#! daha iyi.""

 board_games.0001.desc.opponent_winning.match_history.recently_won_against.gamble:0 ""Bir maç daha," diye not düşer rakibim, "skor tabloma bir galibiyet daha. Kendini iflas ettireceksin, biliyorsun.""

 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.default:0 ""İşte bu," diye kıkırdar rakibim, "oynadığımız o #EMP diğer#! maçtan #EMP çok#! daha iyi.""

 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.county:0 ""[bg_opponent.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] yüzünden, seni ne kadar yensem az," diye homurdanır rakibim, eski bahsimizden hâlâ yaralı."

 board_games.0001.desc.opponent_winning.match_history.recently_lost_against.gamble:0 ""Görünüşe bakılırsa bahis bu sefer benim lehime sonuçlanıyor, değil mi?" diye kıkırdar rakibim."

 board_games.0001.desc.opponent_winning.other.pro_gamer:0 ""Tekniklerime gerçekten çok dikkat etmelisin," diye yaltaklanır rakibim. "Şimdi profesyonel masa oyuncusu hamlesi denen bir şey yapacağım.""

 board_games.0001.desc.opponent_winning.other.avlf:0 ""#EMP Sen mi#! oyun üstadısın? Kendini pohpohlama, [bg_myself.GetFirstNameNoTooltip]. Oyuncu bile değilsin.""

 board_games.0001.desc.i_am_winning.diplomacy.low:0 ""Ben... yapamam... Bana biraz insaf et!" diye neredeyse bağırır rakibim, belli ki öfkeli ve doğru kelimeleri bulamıyor."
 board_games.0001.desc.i_am_winning.diplomacy.medium:0 "Rakibim hiçbir şey demiyor, sadece parmaklarını masanın üstünde tıkırdatarak bir cevap bulmaya çalışıyor."

 board_games.0001.desc.i_am_winning.diplomacy.high:0 ""Görünüşe göre," diye alay eder rakibim, "beni ufak bir dezavantajda bıraktın. Şimdilik.""

 board_games.0001.desc.i_am_winning.martial.low:0 ""Asker yönetemiyorum," diye inler rakibim, "[SCOPE.Custom('BG_GameType')] oynayamıyorum. Ben ne işe yararım?""
 board_games.0001.desc.i_am_winning.martial.medium:0 "Rakibim düşünceli bir şekilde çenesini sıvazlıyor. "Taktiklerimin işe yarayacağından #EMP emindim#!...""

 board_games.0001.desc.i_am_winning.martial.high:0 ""Bu gerçek bir savaş meydanı olsaydı," diye ilan eder rakibim, "işler #EMP kesinlikle#! farklı olurdu.""

 board_games.0001.desc.i_am_winning.stewardship.low:0 ""Rakamlar neden #EMP hep#! bu kadar zor?" diye somurtur rakibim. "[SCOPE.Custom('BG_GameType')|U] çok ileriyi düşünmeni gerektiriyor ve ben #EMP yapamıyorum#! işte!""
 board_games.0001.desc.i_am_winning.stewardship.medium:0 "Rakibim pürdikkat tahtaya bakıyor. "Ben... Ben bir yerde hata yapmış olmalıyım...""

 board_games.0001.desc.i_am_winning.stewardship.high:0 ""Söylemesi acı," diye homurdanır rakibim, "ama şans benden yana görünmüyor.""

 board_games.0001.desc.i_am_winning.intrigue.low:0 ""Bir anlığına bu #EMP aşikâr#! hile yapmayı bırakır mısın?" diye hırlar rakibim."

 board_games.0001.desc.i_am_winning.intrigue.medium:0 ""Stratejimin biraz daha... kurnazlığa ihtiyacı olduğundan şüpheleniyorum..." diye mırıldanır rakibim, hayal kırıklığıyla tahtaya bakarken."

 board_games.0001.desc.i_am_winning.intrigue.high:0 ""Kazandığını düşünüyor olabilirsin," diye kıkırdar rakibim, "ama bunu sadece öyle düşünmeni istediğim için düşünüyorsun. Ve ben, senin, benim bildiğimi bildiğini biliyorum.""

 board_games.0001.desc.i_am_winning.learning.low:0 ""Bu tamamen haksızlık, bu kuralların yarısını bile #EMP anlamıyorum#!," diye homurdanır rakibim. "Bunları oyun sırasında açıkça uyduruyorsun.""

 board_games.0001.desc.i_am_winning.learning.medium:0 ""[bg_myself.Custom('BG_RandomRankPossessive')] [bg_myself.Custom('BG_RandomMoveType')] hamlesini #EMP yine mi#! kullanıyorsun?" diye inler rakibim. "#EMP Çok#! kolaycısın.""

 board_games.0001.desc.i_am_winning.learning.high:0 ""Aptalın [bg_opponent.Custom('BG_RandomMoveType')] ile açılmamalıydım biliyordum," diye sızlanır rakibim. "Esasen çoktan kaybettim.""
 board_games.0001.desc.i_am_winning.trait.lustful:0 "Rakibim maça hiç dikkat etmiyor gibi gözüküyor, onun yerine bazı [SCOPE.Custom('BG_GamePiecePlural')]ın... şekline takılmış gibi."

 board_games.0001.desc.i_am_winning.trait.chaste:0 ""[SCOPE.Custom('BG_GameType')]'in sorunu da bu işte," diye haykırır rakibim, kollarını çılgınca sallayarak. "Tutkuları alevlendiriyor! Duyuları uyandırıyor! En ilkel haliyle çiğ, cinsel bir taşkınlık.""
 board_games.0001.desc.i_am_winning.trait.gluttonous:0 "Rakibim yavaşça ekmeğini ısırıyor, kırıntılar ve dikkatsizlik içerisinde kaybolmuş."

 board_games.0001.desc.i_am_winning.trait.temperate:0 ""Hrmph," diye homurdanır rakibim. "Böyle riskler almak bir gün başına iş açacak.""
 board_games.0001.desc.i_am_winning.trait.greedy:0 "Rakibim elindeki altını havaya atıp tutuyor, soğuk metal muhtemelen yaklaşan mağlubiyetine teselli oluyordur."
 board_games.0001.desc.i_am_winning.trait.generous:0 "Rakibim bana nazik bir gülümseme ile "#EMP Çok#! iyi gidiyorsun, böyle devam et!" diyor"

 board_games.0001.desc.i_am_winning.trait.lazy:0 ""Ah, sıra bende mi?" diye esner rakibim. "Kusura bakma, #EMP pek fazla#! dikkat etmiyordum.""

 board_games.0001.desc.i_am_winning.trait.diligent:0 ""Evet, şu an öndesin," diye ders verir rakibim, "ama biraz çabayla sana yetişebilirim!""
 board_games.0001.desc.i_am_winning.trait.wrathful:0 "Rakibimin atardamarı her an patlayacakmış gibi. "Kazanmaya devam edersen, tüm tahtaya #EMP kan#! kusacağım seni [bg_myself.Custom2('InsultNoun', SCOPE.sC('bg_opponent'))]!""
 board_games.0001.desc.i_am_winning.trait.calm:0 "Rakibimin genelde durgun ifadesi... bozulmuş gibi. Mutsuz gözüküyor."

 board_games.0001.desc.i_am_winning.trait.patient:0 ""Şimdilik üstünlük sende olabilir," diye gözlemler rakibim, "ama sonunda tökezleyeceksin. Herkes tökezler.""

 board_games.0001.desc.i_am_winning.trait.impatient:0 ""[bg_opponent.GetFaith.HighGodName] aşkına, zaten kazandın, #EMP tamam mı#!?" diye kaşlarını çatar rakibim. "#EMP Bitir#! şunu artık.""

 board_games.0001.desc.i_am_winning.trait.arrogant:0 ""Aslında beni yenmiyorsun, biliyorsun," diye öter rakibim. "Sen öyle #EMP sanıyor#! olabilirsin ama bu imkânsız.""
 board_games.0001.desc.i_am_winning.trait.humble:0 "Rakibimin kulakları hayal kırıklığından ötürü #EMP açıkça#! kızarmış. "Reddetmek mümkün değil, taktiklerin...," yutkunuyor, "kusursuz.""

 board_games.0001.desc.i_am_winning.trait.deceitful:0 ""Helaya gitmen gerekiyormuş gibi görünüyorsun," diye önerir rakibim, anlayışla. "Çekinme; ben tahtayı korurum.""

 board_games.0001.desc.i_am_winning.trait.honest:0 ""Bu kadar..." diye bir an duraksar rakibim, "#EMP zorlu#! bir rakip olacağını beklemiyordum.""
 board_games.0001.desc.i_am_winning.trait.craven:0 "Rakibim durmak bilmeden ileri geri sallanıyor, sanki bıraksan fırlayıp gidecekmiş gibi."

 board_games.0001.desc.i_am_winning.trait.brave:0 ""Bir planım var," diye övünür rakibim, "ve bu plan bütün oyunu tersine çevirecek!""
 board_games.0001.desc.i_am_winning.trait.shy:0 "Rakibim sessiz bir şekilde olduğu yerde duruyor, asık bir suratla oyunu kendi lehine nasıl çevireceğini düşünüyor."

 board_games.0001.desc.i_am_winning.trait.gregarious:0 ""Her zamanki rakiplerimden çok daha iyisin," diye hayranlıkla söyler rakibim, "ve ben #EMP bir sürü#! [SCOPE.Custom('BG_GameType')] oyunu oynarım.""

 board_games.0001.desc.i_am_winning.trait.ambitious:0 ""Bu maçtan..." diye duraksar rakibim, kelimeleri tükenmiş, "#EMP daha büyük#! beklentilerim vardı.""

 board_games.0001.desc.i_am_winning.trait.content:0 ""Ah neyse," diye iç çeker rakibim, "bunu kazanamayabilirim, ama elimden gelenin en iyisini yaptım.""

 board_games.0001.desc.i_am_winning.trait.arbitrary:0 ""Neden benim kurallarımı kullanamıyoruz anlamıyorum," diye yakınır rakibim. "Sana söylüyorum, [bg_opponent.GetCurrentLocation.GetNameNoTooltip]'de herkes böyle oynuyor.""

 board_games.0001.desc.i_am_winning.trait.just:0 ""Kanıtlayamam," diye mırıldanır rakibim, "ama #EMP eminim#! ki hile yapıyorsun.""

 board_games.0001.desc.i_am_winning.trait.cynical:0 ""#EMP Elbette#! kazanıyorsun," diye inler rakibim, asık suratla. "[SCOPE.Custom('BG_GameType')] oyununda kazanmama #EMP hiç kimse#! izin vermiyor.""

 board_games.0001.desc.i_am_winning.trait.zealous:0 ""[bg_opponent.GetFaith.KnowledgeGodName] aşkına! Kurtar beni bu beladan," diye mırıldanır rakibim [bg_opponent.GetHerHis] nefesinin altında."

 board_games.0001.desc.i_am_winning.trait.paranoid:0 ""Bunu sen planladın, değil mi?" diye neredeyse hırlar rakibim. "Hileli bir oyunla beni #EMP küçük düşürmeyi#! planladın!""

 board_games.0001.desc.i_am_winning.trait.trusting:0 ""[bg_opponent.GetFaith.KnowledgeGodName] aşkına," diye yakınır rakibim. "Sence sana çok mu açık verdim? Bu kadar erken ve bu kadar kötü kaybedeceğimi beklemiyordum.""

 board_games.0001.desc.i_am_winning.trait.compassionate:0 ""Biliyor musun," der rakibim anlamlı bir şekilde, "[SCOPE.Custom('BG_GameType')] #EMP eğlenmekle#! ilgili olmalı, sadece ne pahasına olursa olsun kazanmakla değil.""

 board_games.0001.desc.i_am_winning.trait.callous:0 ""Hmm, kaybetmek böyle bir şeymiş demek?" diye merak eder rakibim. "Pek hoşlanacağım bir şey değil.""
 board_games.0001.desc.i_am_winning.trait.sadistic:0 "Rakibim sessiz bir şekilde duruyor, [bg_opponent.Custom('EyeEyes')]nden karşısındaki yeteneğe duyduğu saygı ve kabullenmeye hazır olduğu mağlubiyet anlaşılıyor."

 board_games.0001.desc.i_am_winning.trait.stubborn:0 ""Beni yenemeyeceksin," diye tükürür rakibim dişlerinin arasından. "Beni #EMP hiç kimse#! yenemez.""

 board_games.0001.desc.i_am_winning.trait.fickle:0 ""[SCOPE.Custom('BG_GameType')] oynamaktan epey sıkılmaya başlıyorum," diye sızlanır rakibim. "Başka bir şey oynayamaz mıyız?""
 board_games.0001.desc.i_am_winning.trait.vengeful:0 "Rakibimin yüzünde hiçbir ifade yok. Parmaklarıyla oyun tahtasını sıkı sıkı tutuyor, sanki kendini engelliyormuş gibi."
 board_games.0001.desc.i_am_winning.trait.forgiving:0 "Rakibim ilginç bir şekilde oldukça sakin gözüküyor, ona baktığımda en ufak öfke sezemiyorum."

 board_games.0001.desc.i_am_winning.trait.rowdy:0 ""Bilmiş ol," diye fısıldar rakibim, "kaybedersem, bu oyunun tamamını senin aptal kafana fırlatacağım.""

 board_games.0001.desc.i_am_winning.trait.charming:0 ""Bana #EMP biraz#! daha kolay davranmak istemez misin?" diye sorar rakibim, [bg_opponent.GetHerHis] sesi yapmacık tatlılıkta."

 board_games.0001.desc.i_am_winning.trait.curious:0 ""Bir dakika... nasıl #EMP kazanıyor#! olabilirsin?" diye sorar rakibim, gerçekten inanamıyor."

 board_games.0001.desc.i_am_winning.trait.pensive:0 ""Ah, hayır, oynamamalıydım... şimdi de senin vaktini boşa harcadım..." diye mırıldanır rakibim."

 board_games.0001.desc.i_am_winning.trait.bossy:0 ""Hrmf, #EMP benim#! kurallarımla oynasaydık, #EMP o zaman#! sana gösterirdim!" diye inler rakibim."

 board_games.0001.desc.i_am_winning.relation.friend:0 ""Kahretsin," diye kıkırdar dostum, "[SCOPE.Custom('BG_GameType')] oyununda hiç kimseden kolay lokma olmuyorsun, değil mi?""

 board_games.0001.desc.i_am_winning.relation.best_friend:0 ""Her zaman derim ki," diye öter en iyi dostum, "birini [SCOPE.Custom('BG_GameType')] oyununda ezici bir şekilde yenmekten daha güzel bir şey yok. Seni kıskanıyorum!""

 board_games.0001.desc.i_am_winning.relation.rival:0 ""Beni küçük düşürmeye #EMP bayılıyorsun#!, değil mi?" diye tükürür rakibim, her zamanki gibi kaybedenin öfkesiyle."
 board_games.0001.desc.i_am_winning.relation.nemesis:0 "$board_games.0001.desc.opponent_winning.relation.nemesis$"

 board_games.0001.desc.i_am_winning.relation.lover:0 ""[SCOPE.Custom('BG_GameType')] oynamak #EMP zorunda#! değiliz, [bg_myself.GetFirstNameNoTooltip]," diye fısıldar sevgilim. "Eminim kendimizi eğlendirmenin başka yolları da vardır...""
 board_games.0001.desc.i_am_winning.relation.soulmate:0 "$board_games.0001.desc.opponent_winning.relation.soulmate$"

 board_games.0001.desc.i_am_winning.relation.bully:0 ""Sen beni yenersen, ben de seni yenerim. Bu kadar basit," diye kaşlarını çatar zorbam."
 board_games.0001.desc.i_am_winning.relation.victim:0 "Kurbanım sessiz duruyor ama gözlerinden yaşlar akmak üzere."
 board_games.0001.desc.i_am_winning.relation.crush:0 "Çocukluk aşkım... Olamaz! Bana sinirlenmiş, biliyorum, [bg_opponent.Custom('MaskFace')]nden anlıyorum!"

 board_games.0001.desc.i_am_winning.relation.guardian:0 ""Görünüşe göre öğreniyorsun," diye not düşer vasim huysuzca. "Ya da en azından beni daha verimli taklit ediyorsun.""
 board_games.0001.desc.i_am_winning.relation.ward:0 "Öğrencim ezici bir şekilde kaybetmesine kırılmış gibi, [bg_opponent.Custom('MaskFace')]nden anlaşılıyor."
 board_games.0001.desc.i_am_winning.hook_on.weak:0 "$board_games.0001.desc.i_am_winning.hook_on.strong$"

 board_games.0001.desc.i_am_winning.hook_on.strong:0 ""[bg_opponent.GetFaith.random_GoodGodNames]! Bana zerre kadar kontrol bırakmayacaksın, değil mi?" diye yakınır rakibim."
 board_games.0001.desc.i_am_winning.hooked_by.weak:0 "$board_games.0001.desc.i_am_winning.hooked_by.strong$"

 board_games.0001.desc.i_am_winning.hooked_by.strong:0 ""Burada borcunu #EMP tahsil etmek#! israf olmasaydı," diye kaşlarını çatar rakibim, "#EMP zorla#! kaybetmeni sağlamayı düşünebilirdim.""

 board_games.0001.desc.i_am_winning.match_history.recently_won_against.default:0 ""Eee," diye inler rakibim, "görünüşe göre #EMP bu#! oyun benim lehime gitmiyor.""

 board_games.0001.desc.i_am_winning.match_history.recently_won_against.county:0 ""Keşke [bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] ortadayken de bu kadar iyi oynasaydın," diye sırıtır rakibim."

 board_games.0001.desc.i_am_winning.match_history.recently_won_against.gamble:0 ""Ahhh," diye iç çeker rakibim. "Bazen kazanırsın, bazen kaybedersin. Sanırım bu sefer kazanma sırası sende.""

 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.default:0 ""Hayır, hayır, hayır!" diye sızlanır rakibim. "#EMP Yine mi#!, #EMP sana#! mı yenileceğim!""
 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.county:0 "Rakibim [bg_opponent.Custom('MaskFace')]ndeki teri siliyor, [bg_opponent.Custom('EyeEyes')]ndeki şaşkınlık oldukça belli bir şekilde. Şüphe yok ki ona [bg_myself.MakeScope.Var('bg_recent_land_less_stake').Title.GetNameNoTier] toprağına mal olan oyunu düşünüyor."

 board_games.0001.desc.i_am_winning.match_history.recently_lost_against.gamble:0 ""Sadece bir galibiyete ihtiyacım var, sadece bir galibiyete ihtiyacım var, sadece-" diye mırıldanır rakibim, tekrar tekrar, [bg_opponent.GetHerHis] nefesinin altından."
 board_games.0001.desc.intro.opening.defender:0 "[bg_opponent.GetTitledFirstName], çoktan yerine geçmiş [SCOPE.Custom('BG_GameType')] oyunumuzun başlamasını bekliyor, yüzünde ilginç bir #color_blue_gray [bg_myself.Custom('BG_RandomFacialExpression')]#! var."
 board_games.0001.desc.intro.opening.attacker:0 "[bg_opponent.GetTitledFirstName], karşıma oturuyor. Ufak [SCOPE.Custom('BG_GameType')] oyunumuz başlamak üzere ve yüzündeki #color_blue_gray [SCOPE.Custom('BG_RandomFacialExpression')]#!, kendisine ne kadar güvendiğini belli ediyor.\n\nÖnce başlıyor ve açılış olarak"
 board_games.0001.desc.intro.subsequent:0 "Maçımız devam ediyor. [bg_opponent.GetFirstName],"
 board_games.0001.desc.intro.diplomacy.crit_success:0 "oldukça iddialı ve riskli birkaç hamle yapıyor."
 board_games.0001.desc.intro.diplomacy.success:0 "yeterli ve akıllıca birkaç hamle yapıyor."
 board_games.0001.desc.intro.diplomacy.failure:0 "birkaç başarısız bir şekilde gizlenen hamle yapıyor."
 board_games.0001.desc.intro.diplomacy.crit_failure:0 "acınacak derecede kötü bir kafa karıştırma hamlesi yapıyor."
 board_games.0001.desc.intro.martial.crit_success:0 "birkaç oldukça başarılı yenilikçi stratejik hamle yapıyor."
 board_games.0001.desc.intro.martial.success:0 "birkaç başarılı değiştirilebilecek stratejik hamle yapıyor."
 board_games.0001.desc.intro.martial.failure:0 "birkaç... #EMP ilginç#! stratejik hamle yapmaya çalışıyor."
 board_games.0001.desc.intro.martial.crit_failure:0 "son derece #EMP komik#! stratejik birkaç hamle yapıyor."
 board_games.0001.desc.intro.stewardship.crit_success:0 "birkaç matematiksel olarak kusursuz hamle yapıyor."
 board_games.0001.desc.intro.stewardship.success:0 "birkaç oldukça iyi hesaplanmış hamle yapıyor."
 board_games.0001.desc.intro.stewardship.failure:0 "birkaç basit ve kötü hesaplanmış hamle yapıyor."
 board_games.0001.desc.intro.stewardship.crit_failure:0 "birkaç rezalet ve gülünç hamle yapıyor."
 board_games.0001.desc.intro.intrigue.crit_success:0 "birkaç son derece #EMP sinsi#! hamle yapıyor."
 board_games.0001.desc.intro.intrigue.success:0 "birkaç çeşitli tuzağa düşürme hamlesi yapıyor."
 board_games.0001.desc.intro.intrigue.failure:0 "oldukça bariz bir tuzak hamle yapıyor."
