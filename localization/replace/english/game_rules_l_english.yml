 game_rule.1101.desc.combat.commander: "Kendimi muharebenin tam ortasında buluyorum."
 game_rule.1101.desc.combat.not_present: "Ancak bizzat orada değilim."
 game_rule.1101.desc.combat.locale.stamford_bridge: "Sabahtan beri birliklerimiz köprüyü bir ileri bir geri geçmeye çalışıyor, her saat başı Derwent Nehri'nden geçen gruplar karşı kıyıdaki düşmanlarla savaşıyor.\n\nKelimenin tam anlamıyla bir katliam. Çığlıklar ve ölümden seslerinden başka bir şey yok, bazen araya cesetlerin suya çarpma sesi giriyor. Derwent kıpkırmızı akıyor ve kilometrelerce daha böyledir diye düşünüyorum. Kılıcımı yukarda tutarak, çıkmazı kırmak için son bir hücuma kalkıyorum ve muhafızlarımla beraber köprüyü geçmeye çalışıyorum..."
 game_rule.1101.desc.combat.locale.hastings: "Çarpışan metal sesleri, kalkanların parçalanması, atların böğürmesi, binlerce okun gökyüzüne fırlamasıyla tüm dünya alev alev yanıyor.\n\nÇığlık, kan ve vahşetten başka bir şey yok. Yaralıların ve ölmek üzer olanların çığlıkları, intikam küfürleri, kazananların yüreklendiren neşeli bağırışları.\n\nKaderimiz bıçak sırtında dengede duruyor. Son bir #EMP HÜCUM!#! çığlığıyla birliklerimi ileri sürüyorum..."
 game_rule.1101.desc.combat.locale.dover: "Tehlikeli uçurumlara bu kadar yaklaşmışken, her iki ordu da sadece düşmanlarını uçurumdan aşağı itmek için manevra yapıyor ama pek başarılı olamıyorlar.\n\nKan kokusu havayı kirletiyor, savaşın gürültüsü kilometrelerce öteden duyuluyor. Muharebeyi izleyen biri arada sırada kireçli yamaçlardan aşağı yuvarlanan bir ceset bile görebilir.\n\nBu devam edemez, bu devam #EMP etmeyecek#!, yoksa kendimizi tüketeceğiz. Bir haykırışla askerlerimi zafere doğru hücuma çağırıyorum..."
 game_rule.1101.desc.combat.locale.isle_of_wight: "Anakaradan uzakta kaçacak hiçbir yer yok ve her iki ordu da çaresizce ya zafer ya ölüm için savaşıyor. Sonuçta Medina'nın derinliklerine sürüklenmeyenler bu küçücük adada uzun süre saklanacak bir yer bulamazlar.\n\nBir şekilde askerlerimden uzaklaşıyorum, yanımda sadece az sayıda muhafızım var. Keşke bunu kendi avantajıma çevirebilseydim..."
 game_rule.1101.desc.combat.locale.forest_of_dean: "Bu vahşi ağaçların altında, çalılıklarda ve korularda, kan toprağı kolayca suluyor. Görüş mesafesi, muharebenin nasıl gittiğini kimsenin anlayamayacağı kadar zayıf.\n\nOrman hem sesi hem de yaşamı emiyor gibi görünüyor. Saflar arasında yayılan kargaşa ve ölüm miktarına göre garip bir şekilde sessizlik var. Yine de, sanırım belki de, işler lehimize dönüyor..."
 game_rule.1101.desc.combat.locale.london: "Siperlerin tepesindeki askerlerin işleri şu ya da bu yöne çekmeye yönelik tüm çabalarına rağmen, her iki taraf da durmak bilmeyen bir çıkmazın içinde debelenip duruyor.\n\nHava kan kokuyor, ölenlerin ve onları öldürenlerin gürültüsü havayı kaplıyor, toz ve terden oluşan sis bulutu kimin kazandığını söylemeyi imkânsız hâle getiriyor.\n\nYine de birliklerimi bu kaosun içinde terk edemem ve bir haykırışla kendimi bir kez daha düşmana fırlatıyorum. Bu bizim zamanımız, zafer bizim olacak, saflarını yarıp geçeceğiz..."
 game_rule.1101.desc.combat.locale.cirencester: "$game_rule.1101.desc.combat.locale.london$"
 game_rule.1101.desc.combat.locale.guildford: "İki ordunun da zirvesini tam olarak kontrol edemediği dolambaçlı tepe, muhteşem bir muharebeye sahne oluyor. Uzun ve dar olan bu tepede, yükselti avantajının kendilerini zafere taşıyacağına inanan her iki kuvvet de diğerini aşağıya doğru itmeye çalışıyor.\n\nYine de biliyorum ki tepeyi aşacak olanlar #EMP benim#! birliklerim, zaferin tadını alacak olanlar #EMP benim#! kuvvetlerim! İleri, #EMP ileri sizi köpekler!#! İleri! Zaferden sadece bir adım uzaktayız..."
 game_rule.1101.desc.combat.locale.lindisfarne: "Deniz dalgaları gözleri, Kuzey Denizi'nden gelen sert rüzgârlar elbiseleri ve kalkanları yırtıyor; yaralıların ve ölmekte olanların çığlıkları, önlerindeki katliam karşısında feryat eden manastır rahiplerine kadar ulaşıyor.\n\nEğer burada yenilirsem, [ROOT.Char.GetFaith.HighGodName] istediği için yenileyim. Yenilmezsem İngiltere'deki hakkımı desteklediğinin bir kanıtı olur! İleri, askerlerim, ileri! Bana tacımı getirin. Sonuna kadar savaşın..."
 game_rule.1101.desc.combat.locale.lands_end: "Buradaki çalılıklar ve kısa, sivri uçlu kayalıklar okyanusa kadar devam ediyor. Kırık arazi, muharebeyi kargaşaya sürüklüyor ve tek bir sıra hâlinde cephe çatışması yerine çok küçük gruplar yakından birbirlerine saldırıyorlar.\n\nYine de birliklerim sancağımı takip etmeye devam ediyor ve ben de safları ilerletmek için elimden geleni yapıyorum. Bana doğru toplanın! #EMP Toplanın!#! Haykırışım yankılanıyor, yankılanıyor ve yankılanıyor..."
 game_rule.1101.desc.combat.locale.stonehenge: "Teoride bu geniş ve düz arazilerin savaşmak için ideal bir yer olması gerekiyor. Orduların çarpışması için bolca alan var ama yine de... burada ürkütücü bir şeyler var. Garip bir şeyler.\n\nSavaşıyoruz, ölüyoruz ve öfkemizle gökleri dolduruyoruz ama havadaki bir şey kötülüğümüzü hızla emiyor gibi görünüyor. Yine de yavaşlayamam, önden gitmeliyim..."
 game_rule.1101.desc.combat.locale.southwark: "İngiltere'nin en zengin şehri bu kadar yakınken uğruna savaşılacak çok şey var. İster ev ister ganimet, ister şan ister dindarlık olsun, her iki ordu da defalarca birbirine hücum ediyor.\n\nThames'in güney kıyısı kanımızla köpürüyor ama vazgeçmeyeceğim. #EMP Vazgeçmeyeceğim.#!\n\nİngiltere zaten benim, bu muharebe bunu kanıtlayacak ve kazanmak için de tek gereken şey son bir hücum..."
 game_rule.1101.desc.combat.locale.riverside: "Beş on askerin yan yana durabileceği alan bile olmadığı için muharebe ustaca taktiklerden ziyade acımasız bir yıpratma mücadelesine dönüşüyor. İtip kalkışmalar arasında yaralıları cepheden geri çekme bazen kolay bazen imkânsız oluyor.\n\nYine de sadece saflarını delip geçebilirsek, sadece askerlerini dağıtabilirsek başarmış olacağız! Riske girerek en ön saflara doğru ilerliyorum, kılıcım hazır..."
 game_rule.1101.desc.combat.random.present.1: "Ordularımız birbirleriyle çarpışıyor ve havayı parçalanan kalkan, gıcırdayan metal, ölen insan ve at sesleri dolduruyor.\n\nSavaş acımasız olabilir ama bu savaştan çok kasaplık. Her iki taraftaki paralı askerler ve tecrübeliler, önlerine gelen taze askerleri acımasızca kılıçtan geçiriyor.\n\nBu kâbusun devam etmesine izin vermek istemiyorum ve ileri atılıyorum, korumalarım arkamdan takip ediyor..."
 game_rule.1101.desc.combat.random.present.2: "İki ordu çarpışıyor ve birbirinin etrafında dönüyor, her iki taraf da zayıflık arıyor. Dövüşüyoruz, sonra geri çekiliyoruz, sadece hattın biraz ilerisinde tekrar birbirimize giriyoruz.\n\nKayıplar şimdilik az ama havada bir ağırlık var. Hepimiz bu dansın sonsuza kadar devam edemeyeceğini, gerçek savaşın bir an önce başlaması gerektiğini biliyoruz.\n\nSavaş alanını kontrol etmek, ona boyun eğmekten daha iyidir. Kılıcımı havaya kaldırıp [ROOT.Char.GetFaith.WarGodNamePossessive] adını haykırarak kendimi ileri atıyorum, tüm [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] askerleri de beni takip ediyor..."
 game_rule.1101.desc.combat.random.present.3: "Güneş batmaya başlamış, iki ordu saatlerce birbirini katlederek zaman geçirmişti. Kılıç tutan eller gittikçe ağırlaşıyor, zihinler yorgunluktan yavaşlıyor. Güneş iyice ufkun altına inmeye başladığında muharebenin çıkmaza girme tehlikesi doğuyor.\n\nHayır.\n\nİzin vermeyeceğim. Bu iş burada, şimdi, benim zaferimle bitecek. Eminim..."
 game_rule.1101.desc.combat.random.absent.1: "Günün büyük bir bölümünde ordularımız birbirleriyle çarpışıyor. Önce onlarcası, sonra yüzlercesi ölüyor, askerler davam uğruna canlarını feda ederken cesetler toplanıyor.\n\nElbette, elbette her şeye değecek. Şüphem yok ki bu kadar ölümün bir karşılığı var, [ROOT.Char.GetFaith.DeathDeityNamePossessive] soğuk kucağına çığlık atarak gönderilen hayatların bir karşılığı olmalı."
 game_rule.1101.desc.combat.random.absent.2: "Muharebe acımasız. Parçalanmış kalkanların çarpışması ve ölenlerin feryatları havayı dolduruyor. Birkaç başarısız hücumun yarattığı kargaşa ve birbirine karışmış savaş hatlarının görüntüsü herhangi bir düzenin olmadığını gözler önüne seriyor.\n\nYine de askerler, hayatları pahasına da olsa bir [ROOT.Char.GetTitleAsNameNoTooltip] için savaşmaya, onun doğuştan gelen hakkının çiğnenmemesi için mücadele etmeye devam ediyor."
 game_rule.1101.desc.combat.random.absent.3: "Tırpanın önüne düşen buğdaylar gibi yüzlerce hayat kesiliyor. Kanlı işlerine devam eden kiralık katillerin asık suratları çoğu askerin gördüğü son şey oluyor.\n\nOnların fedakârlıkları kesinlikle ama kesinlikle buna değecek, yaklaşan zaferimin gerekli bir ön koşulu olacak. Her biri kader yolunda, tek bir amaç uğruna döşenmiş birer kaldırım taşı."
 game_rule.1101.desc.outro.present: "Karşımdakini kesip biçmekten başka bir şey düşünemiyorum. [loser.GetTitledFirstNamePossessive] ordusunu ezerken korumalarım etrafımda savaşmaya devam ediyor. Kılıcımın altında düşman kaçıyor."
 game_rule.1101.desc.outro.absent: "Sonunda düşmanın safları parçalanıyor ve ordusu bozguna uğruyor. Gün bizim günümüz, zafer bizim zaferimiz!"
 game_rule.1101.a: "İngiltere tekrar Viking hükmüne boyun eğmeyecek!"
 game_rule.1102.desc.outro.alive: "Ama sonunda hepsi boşa gidiyor. Saflarım kırıldı, düşman boşluğa doğru ilerledi ve ordularımın yok olmasıyla hayallerim tamamen suya düştü."
 game_rule.1102.desc.outro.dead: "Göğsümde bir ağrı beliriyor. Hayır, hayır, #BER hayır#!. Kim... Niye... Dünya yalpalanıyor ve yere yuvarlanıyorum. Yaramdan kan fışkırıyor. Yavaşça, ölüm beni alıp götürüyor."
 game_rule.1102.a: "Bu nasıl olabilir?!?"
 game_rule.1102.b: "#DIE1 Ben...#! #DIE2 bittim...#!"
