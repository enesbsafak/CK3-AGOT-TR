 game_rule.1141.t: "Witenagemot Seçimini Yaptı: [elect.GetHouse.GetNameNoTooltip] Hanesinden [elect.GetFirstNameNoTooltip]"
 game_rule.1141.intro.battlefield: "[winner.GetTitledFirstName] muharebede, gaspçı [loser.GetTitledFirstNameNicknamed] karşısında savaşırken öldü.\n\n"
 game_rule.1141.intro.home: "[loser.GetTitledFirstNameNicknamed] ordularının bozguna uğratıldığını duyunca [winner.GetTitledFirstName] beklenmedik bir şekilde mutluluktan kalp krizi geçirdi.\n\n"
 game_rule.1141.choice.margaret: "Garip bir mucize eseri Witenagemot, beklenen vâris [jiltee.GetFullNameNoTooltip] yerine #EMP beni#! seçti. Büyük earl'ler açıkça beni kontrol edebileceklerine inanıyor, beni hırsları için bir kukla olarak görüyorlar.\n\nBuna izin vermeyeceğim ama bu beklenmedik gücü memnuniyetle karşılıyorum - ne de olsa ben babamın ilk çocuğuyum."
 game_rule.1141.choice.edgar: "İngiliz siyasetinde uzun yıllardır görülmemiş bir bilgelikle Witenagemot, [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamed] halefinin sadece #EMP benim#! olabileceğime karar kıldı ve [jiltee.GetFullNameNoTooltip] yerine ülkeyi yönetmek için bana yetki verdi.\n\n[ROOT.Char.GetFaith.FateGodNamePossessive] lütfunu kazanmak için ne yaptığımı bilmiyorum ama her ne yaptıysam son derece memnunum."
 game_rule.1141.choice.svend: "Tahtta hak iddia eden diğer kişilerin yarattığı ölüm ve yıkımdan bıkan Witenagemot, beklenen vâris [jiltee.GetFullNameNoTooltip] yerine bir kez olsun mantıklı bir şekilde hareket ederek düzen getirecek en doğal aday olan #EMP beni#! seçti.\n\nDanimarka bir kez daha İngiltere tahtındaki doğal yerini alar."
 game_rule.1141.choice.aelfwine: "Gizemli bir deliliğin ele geçirdiği Witenagemot, eve dönüp babamın ve dedemin krallığını yönetmem için #EMP bana#! yalvardı. Vârisin [jiltee.GetFullNameNoTooltip] olması bekleniyordu.\n\nBunun gibi bir hırsım yoktu. Böyle bir şey istemedim. Elimden geldiğince kendimi tahttan uzak tuttum, ancak [elect.GetFaith.HighGodNamePossessive] iradesine karşı gelinmeyeceği açık. Sonsuza dek mutlu bir şekilde terk ettiğim topraklara geri dönüyorum."
 game_rule.1141.choice.cadoc: "Her zamanki gibi didişen Witenagemot ilginç bir karara vardı. Başka bir yabancı kralı hazmetmek istemedikleri ve birbirlerinden şüphelendikleri için İngiltere'yi yönetmek üzere #EMP beni#! seçtiler. Beni kendi isteklerine göre şekillendirebilecekleri zayıf bir kukla olarak gördükleri aşikar.\n\nBelki haklılar, belki de değiller. Yine de kendimi kanıtlamak için bu beklenmedik fırsatı memnuniyetle karşılıyorum!"
 game_rule.1141.a.margaret: "İngiltere'nin ilk kraliçesi!"
 game_rule.1141.a.edgar: "Doğum hakkım geri verildi!"
 game_rule.1141.a.svend: "Böyle biteceğini hep biliyordum."
 game_rule.1141.a.aelfwine: "Bunu hiç istemedim!"
 game_rule.1141.a.cadoc: "Bundan beş yüz yıl sonra bile adımı bilecekler!"
 game_rule.1142.t: "$game_rule.1141.t$"
 game_rule.1142.intro.battlefield: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] savaş alanında gaspçı [loser.GetTitledFirstNameNicknamed] karşısında savaşırken öldü.\n\n"
 game_rule.1142.intro.home: "[loser.GetTitledFirstNameNicknamed] ve ordusunun bozguna uğratıldığını duyan [winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] beklenmeyen bir şekilde mutluluktan kalp krizi geçirdi.\n\n"
 game_rule.1142.choice.preamble: "Tuhaf bir şekilde [elect.GetFirstName] [elect.GetHouse.GetName], Witenagemot tarafından tahta seçildi."
 game_rule.1142.choice.margaret: "Büyük amcası [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamed] ve babası da maceracı [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed] idi."
 game_rule.1142.choice.edgar: "Büyük amcası [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamed] ve babası da maceracı [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed] idi. [winner.GetFirstNameNoTooltip] tahtı gasp etmeden önce tercih edilen vâris oydu."
 game_rule.1142.choice.svend: "Dedesi [GetScriptedCharacterByHistoryID( '101505' ).GetTitledFirstNameNicknamed] idi ve [elect.GetPrimaryTitle.GetBaseNameNoTier] topraklarına hükmediyordu. Savaşın başlangıcında yer almamayı tercih etmişti."
 game_rule.1142.choice.aelfwine: "dedesi [GetScriptedCharacterByHistoryID( '101510' ).GetTitledFirstNameNicknamed] idi, Oksitanya'da fakir bir rahip olarak kendi isteğiyle sürgüne gitmişti."
 game_rule.1142.choice.cadoc: "Cornwall'lu soylunun adını sanını bilen pek yoktu."
 game_rule.1142.outro: "#EMP Benim#! seçilmem gerekiyordu.\n\nGörünüşe göre İngiltere'ye hükmedemeyeceğim."
 game_rule.1142.a: "Ne saçma iş! Taht benim!"
 game_rule.1142.b: "Konseyin iradesi kesin."
 game_rule.1142.c: "Hükümdarlığa çok yakındım..."
