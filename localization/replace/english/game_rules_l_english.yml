 game_rule.1131.desc.conquest_finished.die_home: "Muharebeyi kazandığımız haberi ulaştığında, sevinçten havalara uçuyorum! Kalbim sevinçten sıçrıyor, dönüyor, #EMP çarpıyor#!, #BER çığlık atıyor!#!\n\nBana... ne... oluyor... #DIE1 Nefes... alamıyorum...#!"
