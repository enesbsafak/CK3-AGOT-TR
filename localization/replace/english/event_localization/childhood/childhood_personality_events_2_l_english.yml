l_english:
 child_personality.7000.t:0 "Çalıntı Fıçı"
### TODO AGOT-ONLY: child_personality.7000.desc [AGOT: ]
 child_personality.7000.desc:0 ""Look what I've found, [child.GetFirstNameNoTooltip] – an entire keg of [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! I took it while the cooks weren't looking." [other_child.GetFirstName] says to me, a devilish look in [other_child.GetHerHis] eyes.\n\n"What are you waiting for? Lets drink it all before anyone notices it's gone!" [other_child.GetSheHe|U] exclaims.\n\nA tempting offer... but is it right?"
 child_personality.7000.a:0 "Ver şunu bana – fark edilmeden aldığın yere geri koyacağım."
 child_personality.7000.b:0 "Sen gerçek bir dostsun, [other_child.GetFirstNameNoTooltip]. Şerefe!"
 child_personality.7000.c:0 "Iıh, yapabileceğimi sanmıyorum. Sen iç."
 child_personality.7001.t:0 "$child_personality.7000.t$"
### TODO AGOT-ONLY: child_personality.7001.desc [AGOT: ]
 child_personality.7001.desc:0 ""I caught these two hiding in the food stores!" A very irate cook shouts at me, dragging my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] and [other_child.GetFirstName] in tow.\n\n"
### TODO AGOT-ONLY: child_personality.diligent.desc [AGOT: ]
 child_personality.diligent.desc:0 ""[other_child.GetFirstNameNoTooltip] had stolen a #EMP whole#! keg of [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! [child.GetFirstNameNoTooltip] tried to put it back by [child.GetHerselfHimself] before I noticed – but no such luck for [child.GetHerHim]!" [cook.GetSheHe|U] says angrily.\n\nIt seems as if my ward is a little troublemaker, but one that had a change of heart!"
### TODO AGOT-ONLY: child_personality.gregarious.desc [AGOT: ]
 child_personality.gregarious.desc:0 ""They stole a #EMP whole#! keg of [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] and drank most of it. Now look at them – drunk as lords, both of them! They can barely stand..." [cook.GetSheHe|U] says angrily.\n\nIt seems as if my ward has fallen to peer pressure, but at least [child.GetSheHe] and [other_child.GetFirstNameNoTooltip] seems to be thick as thieves."
### TODO AGOT-ONLY: child_personality.temperate.desc [AGOT: ]
 child_personality.temperate.desc:0 ""They stole a #EMP whole#! keg of [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')], and [child.GetFirstNameNoTooltip] just sat there as [other_child.GetFirstNameNoTooltip] drank [other_child.GetHerselfHimself] into near oblivion!" [cook.GetSheHe|U] says angrily.\n\nIt seems as if my ward protected [child.GetHerHis] partner in crime, keeping a lookout while abstaining from any drink [child.GetHerselfHimself]."
 child_personality.7001.diligent:0 "Kendi başına? Aferin [Select_CString(child.IsFemale, 'kızım', 'oğlum' )]!"
 child_personality.7001.gregarious:0 "Hah! İyi vakit geçirdin mi bari!"
 child_personality.7001.temperate:0 "İçmemen çok akıllıca olmuş."
 child_personality.7001.change.diligent:0 "Sanırım birilerinin sorumluluk konusunda bir derse ihtiyacı var."
 child_personality.7001.change.gregarious:0 "Şimdi beni iyi dinle, içki #EMP mutluluk#! ve #EMP eğlencenin#! kaynağıdır!"
 child_personality.7001.change.temperate:0 "Bundan sonra içkilerden uzak duracaksın, anladın mı?"
 spoilsport_opinion:0 "Mızıkçı"
 child_personality.7010.t:0 "Vaaz"
### TODO AGOT-ONLY: child_personality.7010.desc [AGOT: ]
 child_personality.7010.desc:0 ""Listen to my words, children. Today I will tell you about [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.PositiveAfterLife], [ROOT.Char.GetFaith.NegativeAfterLife], and even #EMP [ROOT.Char.GetFaith.DevilName]#! [ROOT.Char.GetFaith.DevilHerselfHimself]!" [sermon_priest.Custom('AgotGetPriestFirstName')] exclaims, fervor burning in [sermon_priest.GetHerHis] eyes.\n\nMe and the other children are spellbound by [sermon_priest.GetHerHis] sermon; who knew that the [ROOT.Char.GetFaith.ReligiousText] could be this #EMP fascinating!#!\n\nAs the sermon ends, I have to tell [sermon_priest.Custom('AgotGetPriestFirstNameNoTooltip')] my thoughts."
### TODO AGOT-ONLY: child_personality.7010.a [AGOT: ]
 child_personality.7010.a:0 ""My belief in [ROOT.Char.GetFaith.HighGodName|U] will #EMP never#! falter, [sermon_priest.Custom('AgotGetPriestFirstNameNoTooltip')]!""
### TODO AGOT-ONLY: child_personality.7010.b [AGOT: ]
 child_personality.7010.b:0 ""What was that about the #EMP 'Divine Right of [ROOT.Char.Custom('GetQueenKing')]s'#!?""
### TODO AGOT-ONLY: child_personality.7010.c [AGOT: ]
 child_personality.7010.c:0 ""This '[ROOT.Char.GetFaith.DevilName]' seems #EMP aspirational!#!""
 child_personality.7011.t:0 "$child_personality.7010.t$"
### TODO AGOT-CHANGED: child_personality.7011.desc [AGOT: Today [sermon_priest.Custom('AgotGetPriestFirstName')] held a fiery sermon for of all the children of the court, they were apparently spellbound as [sermon_priest.GetSheHe] zealously read from the [sermon_priest.GetFaith.ReligiousText].\n\nMy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] | TR: Bugün [sermon_priest.GetFirstName] saraydaki tüm çocuklar için bir vaaz verdi ve duyduğuma göre hepsi [sermon_priest.GetFirstName] [sermon_priest.GetFaith.ReligiousText] okurken âdeta büyülenmiş.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))|U] [child.GetFirstName]]
 child_personality.7011.desc:0 "Today [sermon_priest.Custom('AgotGetPriestFirstName')] held a fiery sermon for of all the children of the court, they were apparently spellbound as [sermon_priest.GetSheHe] zealously read from the [sermon_priest.GetFaith.ReligiousText].\n\nMy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] "
 child_personality.zealous.desc:0 "vaazdan oldukça etkilenmiş, belki biraz aşırı olarak. Vaaz bittiğinden beri sarayda yakalayabildiği herkese nasıl daha iyi [child.GetFaith.GetAdherentNamePlural] olabileceklerini anlatıyor..."
 child_personality.ambitious.desc:0 "ileride büyük şeyler başaracağına inanmış çünkü [child.GetFaith.HighGodName] onu koşulsuz destekliyormuş."
 child_personality.sadistic.desc:0 "#EMP [child.GetFaith.DevilName]#! ile ilgili kısımlara bayılmış! Saatlerdir ağzından [child.GetFaith.DevilName] ve nasıl onu örnek almak istediğini anlatıp duruyor..."
 child_personality.7011.zealous:0 "Güçlü bir iman seni önemli yerlere taşır [Select_CString(child.IsFemale, 'kızım', 'oğlum' )]."
 child_personality.7011.ambitious:0 "Bu doğru, asla tanrının senin tarafında olduğunu unutma!"
 child_personality.7011.sadistic:0 "Vicdani dertlerinin olmaması işine çok yarar."
 child_personality.7011.change.zealous:0 "#EMP İnanç#! her şeyin üstündedir, sevgili çocuğum."
 child_personality.7011.change.ambitious:0 "İnanç amaca giden yolda bir araçtır, fazlası değil!"
 child_personality.7011.change.sadistic:0 "Çocuk, bu dünya karanlık bir dünya. Ya ölürsün ya da öldürürsün."
 clever_child_opinion:0 "Akıllı Çocuk"
 delightfully_devilish_opinion:0 "Şeytan Tüylü"
 worried_opinion:0 "Endişeli"
 child_personality.7020.t:0 "Dayak"
### TODO AGOT-ONLY: child_personality.7020.desc [AGOT: ]
 child_personality.7020.desc:0 ""You stupid little [child.Custom2('InsultNoun', SCOPE.sC('evil_person'))]! Why must you always be in my way!? I am going to teach you a lesson..." [evil_person.GetFirstName] exclaims, reaching out for a nearby cudgel.\n\nWhat have I done wrong? I only wanted to see what [evil_person.GetFirstNameNoTooltip] was doing! [evil_person.GetSheHe|U] is approaching rapidly, raising the club in the air! Help!\n\n"If you tell anyone who did this to you, I will make sure you perish..." [evil_person.GetSheHe|U] grins."
 child_personality.7020.a:0 "İnsanlar! İnsanlar neden bu kadar zalim?"
 child_personality.7020.b:0 "Ya onun gibi başkaları da varsa!? #EMP Her zaman#! tetikte olmalıyım...!" ### CQC
 child_personality.7020.c:0 "Lütfen dur! Bana zarar verme, ne istersen yaparım!"
 child_personality.7021.t:0 "$child_personality.7020.t$"
 child_personality.7021.desc:0 "Evladıma bunu kim yaptı!? Her tarafı morarmış ama kimin yaptığını söylemeyi reddediyor. Büyük bir çocuk muydu? Yoksa soylulardan birini çıldırtana kadar rahatsız mı etti?\n\n"
 child_personality.shy.desc:0 "Zavallı çocuk konuşmayı tamamen kesti ve yakınlarda insan olduğunu hissettiği an bir yerlere saklanıyor..."
 child_personality.paranoid.desc:0 "Zavallı çocuk artık gölgesini gördüğünde bile korkudan yerinde zıplıyor. Zor bir yaşam, sürekli arkasına bakıyor, her zaman tetikte..."
 child_personality.craven.desc:0 "Zavallı çocuk yere iğne düşse korkudan boş bir dolaba saklanıyor. Sürekli korku içinde bir yaşam..."
 child_personality.7021.shy:0 "Çocuğum, istemiyorsan kimseyle konuşmak zorunda değilsin..."
 child_personality.7021.paranoid:0 "Tetikte ol, [Select_CString(child.IsFemale, 'kızım', 'oğlum' )]. Onlara başka bir fırsat verme."
 child_personality.7021.craven:0 "Kaç, saklan, ve asla düşmanlarına sana zarar verme fırsatı verme."
 child_personality.7021.change.shy:0 "İnsanlardan kaçınırsan güvende olursun..."
 child_personality.7021.change.paranoid:0 "Düşmanlar #EMP her yerde#!. Bunu aklına kazı."
 child_personality.7021.change.craven:0 "Fırsatın varken kaçmalıydın çocuk!"
 child_personality.7030.t:0 "Mutfakta Tek Başına"
 child_personality.7030.desc:0 "Sonunda, #EMP koca mutfak#! bana kaldı!\n\nAşçı [cook.GetFirstName] bulaşıkları yıkayacağımı duyunca akşam yemeği için [ROOT.Char.Custom('GetLivestockFowlIndef')] getirmeye gitti – ve mutfağı #EMP bomboş#! bıraktı.\n\nBal var, [child.Custom('FavoriteTreatDemand')] var, reçel var, [child.Custom('GetExpensiveDessert')] var, elma var... #EMP BU KADAR SEÇENEK BENİ ÖLDÜRÜYOR!#!\n\nŞimdi..."
 child_personality.7030.a:0 "...her şeyden biraz yiyip un çuvalı üzerinde uyuyacağım!"
 child_personality.7030.b:0 "...her şeyi yiyip karnımı tıka basa dolduracağım. Tek bir kırıntı bile kalmayacak!"
 child_personality.7030.c:0 "...tabii ki bulaşıkları yıkayacağım!"
 child_personality.7031.t:0 "$child_personality.7030.t$"
### TODO AGOT-ONLY: child_personality.7031.desc [AGOT: ]
 child_personality.7031.desc:0 ""Greetings, m'[ROOT.Char.GetLadyLord]." [cook.GetFirstName], one of the cooks, says. "I have yer [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] with me 'ere. [child.GetSheHe|U] promised to clean the pots in the cookery, y'see..."\n\n[cook.GetSheHe|U] draws in a sharp breath.\n\n"
### TODO AGOT-ONLY: child_personality.lazy.desc [AGOT: ]
 child_personality.lazy.desc:0 ""...but [child.GetSheHe] nibbled all the food like a little rat, and then fell asleep on a flour sack! [child.GetSheHe|U] is due a hidin' if you ask me, but I'll leave [child.GetHerHim] with ye to do with as ye see fit!"\n\nThis child is so unmotivated and lethargic, you could confuse [child.GetHerHim] for a corpse!"
### TODO AGOT-ONLY: child_personality.gluttonous.desc [AGOT: ]
 child_personality.gluttonous.desc:0 ""...but [child.GetSheHe] gobbled down every sweet [child.GetSheHe] could find, like a little pig! Now [child.GetSheHe] is all sweaty and red from exertin' [child.GetHerselfHimself] eatin'..."\n\n[child.GetFirstNameNoTooltip] never could resist sweet things, but this might be taking it a bit far..."
### TODO AGOT-ONLY: child_personality.compassionate.desc [AGOT: ]
 child_personality.compassionate.desc:0 ""...and clean #EMP every#! pot [child.GetSheHe] did! Even scrubbed the cauldron, without me even askin'! That's a sweet [child.Custom('GirlBoy')] ye got there."\n\nThis is indeed very selfless, but does this act suit [child.GetFirstNamePossessiveNoTooltip] stature..?"
 child_personality.7031.lazy:0 "Güzel, zorunda olmadıkça asla enerjini harcama!"
 child_personality.7031.gluttonous:0 "Aklında olsun, kimse sana ne yiyip yiyemeyeceğini söyleyemez."
 child_personality.7031.compassionate:0 "Ne kadar tatlı! İyilik asla ödülsüz kalmaz, unutma."
 child_personality.7031.change.lazy:0 "Böyle insanlar için enerjini harcama çocuk."
 child_personality.7031.change.gluttonous:0 "Tüm tatlıları yemeliydin, bu senin #EMP hakkın.#!"
 child_personality.7031.change.compassionate:0 "Hizmetkârlara daha iyi davranmalısın!"
 lazy_child_opinion:0 "Tembel Çocuk"
 little_pig_opinion:0 "Küçük Domuz"
 sweet_child_opinion:0 "Tatlı Çocuk"
 thankful_opinion:0 "Müteşekkir"
 child_personality.7040.t:0 "Saklanbak"
 child_personality.7040.desc:0 "Hizmetkârların odasındaki dolap #EMP en iyi#! saklanma yeri ve ben bir saklambaç dehasıyım! Mükemmel saklanma yerimden dışarıya bir göz atıyorum ve [lover_1.GetFirstName] ve [lover_2.GetFirstName] bir anda içeri giriyor.\n\n"Ah, benim [lover_2.Custom('RomanticComplimentAdjective')], [lover_2.Custom('RomanticComplimentNoun')] sevgilim, seni şu kıyafetlerden #EMP kurtaralım#!!" diyor [lover_1.GetFirstNameNoTooltip], elleri diğerinin vücudunda geziyor.\n\n"Acele et, sahip ol bana seni [lover_1.Custom('RaunchyComplimentNoun')] [Select_CString(lover_1.IsFemale, 'kadın', 'adam' )]!" [lover_2.GetFirstNameNoTooltip] bağırır gibi inliyor ve kendini yatağa atıyor.\n\n"
 child_personality.7040.desc_motherfather:0 "Anne? Baba? Ne... ne #EMP yapıyorlar!#!"
 child_personality.7040.desc_father:0 "Ba.. baba? Ne... ne #EMP yapıyorlar!#!"
 child_personality.7040.desc_mother:0 "An.. anne? Ne... ne #EMP yapıyorlar!#!"
 child_personality.7040.desc_default:0 "Ne yapı... oh... bunu #EMP görmüyor#! olmalıydım!"
 child_personality.7040.a.crush_version:0 "[child_crush_target.GetFirstNameNoTooltip] çok... #EMP çok güzel#!, âdeta bir [child_crush_target.Custom('GetBeautifulMetaphor')]."
 child_personality.7040.a:0 "Bu saklambaç #EMP çok daha zevkliymiş#!!" ### CQC
 child_personality.7040.b:0 "Gözlerim neler görüyor, biri bunu durdursun! #EMP Durun!#!"
 child_personality.7041.t:0 "$child_personality.7040.t$"
 child_personality.7041.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('child'))|U] [child.GetFirstName] hizmetçilerin odasında gardrobun içinde ne yapıyordu? Sadece saklambaç oynadığını iddia ediyor.\n\n"
 child_personality.lustful.desc:0 "Şapşal çocuk sırıtıyor, yanakları kızarmış, ağzından salyalar akıtıyor... ve dediğim hiçbir şeyi duymuyor\n\nOff... Sanırım ne gördüğünü biliyorum. Hizmetkârları... ee.. #EMP birlikte #! görmüş – gözlerdeki şehveti nerede olsa tanırım."
 child_personality.chaste.desc:0 "Çocuk hayalet görmüş gibi; titriyor, gözleri faltaşı gibi açılmış, duvarlara bakıyor...\n\nOff... Sanırım ne gördüğünü biliyorum. Hizmetkârları... ee.. #EMP birlikte #! görmüş.\n\nZavallı çocuk travmatize olmuş gibi, büyüdüğünde birine yakınlık kurmakta zorlanırsa hiç şaşırmam..."
 child_personality.7041.lustful:0 "Seni eşşek sıpası! Biraz da yetişkinliğine sakla!"
 child_personality.7041.chaste:0 "Gerektiğinden fazla yakınlık kurmamak onun için iyi olacak."
 child_personality.7041.change.lustful:0 "Korkacak bir şey yok çocuk! Büyüyünce anlayacaksın!"
 child_personality.7041.change.chaste:0 "Kendine gel! Bir [Select_CString(child.IsFemale, 'leydi', 'lord' )] asla böyle davranmamalı!"
 child_personality.7050.t:0 "Ekonomi Dersi"
### TODO AGOT-ONLY: child_personality.7050.desc [AGOT: ]
 child_personality.7050.desc:0 ""Without taxes, the royal treasury would soon run out. Loyal vassals are more than happy to pay." [teacher.GetFirstName], my teacher, says and [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('teacher'))].\n\n"Therefore it is of paramount importance to keep your subjects happy, do not tax them too much – nor too little, lest they find you complacent." [teacher.GetFirstNameNoTooltip] continues, turning a page.\n\n"From the highest [ROOT.Char.GetTitleTierName] to the lowest [ROOT.Char.Custom('lowly_servant_type')], everyone plays their part." [teacher.GetSheHe|U] says, closing the tome. "The lesson is finished, you may go now.""
 child_personality.7050.a:0 "Adalet mülkün temelidir!"
 child_personality.7050.b:0 "Hah! Ben hükmettiğimde vergiler #EMP yüksek#! ve #EMP bol olacak!#!"
 child_personality.7050.c:0 "Altından bir omlet yapmak için birkaç köylü kırmak gerekir..."
 child_personality.7051.t:0 "$child_personality.7050.t$"
 child_personality.7051.desc:0 "[child.GetFirstName]"
 child_personality.7051.desc_1:0 "şimdi hazine ve içindeki paranın yönetimi konulu dersimden"
 child_personality.7051.desc_2:0 "şimdi öğretmeni [teacher.GetFirstName] tarafından verilen hazine ve içindeki paranın yönetimi konulu dersinden"
 child_personality.7051.desc_fin:0 "çıktı.\n\n"
 child_personality.just.desc:0 "[child.GetFirstNameNoTooltip] dersi oldukça benimsemiş gözüküyor.\n\nSarayda yakalayabildiklerine ekonomide herkesin nasıl, ister en tepede olsun ister en aşağıda, kendisinde düşeni yapması gerektiğini anlatıyor."
 child_personality.greedy.desc:0 "Ama görünüşe göre sadece #EMP altın#! hakkındaki kısımlar aklında kalmış...\n\nŞimdi pek memnun olmasalar da tüm hizmetkârlardan vergi diye para topluyor."
 child_personality.callous.desc:0 "[child.GetFirstNameNoTooltip] dersi biraz... fazla ciddiye almış gibi gözüküyor.\n\nAlt sınıfların değerini anlamasına anlamış ama aynı zamanda köylülerin vergilerini ödemiyorlarsa hiçbir işe yaramadıklarını ve ortadan kaldırılmaları gerektiğini savunuyor. Biraz karanlık bir dünya görüşü..."
 child_personality.7051.just:0 "Sağlam bir adalet anlayışı hayatta çok işine yarayacaktır!"
 child_personality.7051.greedy:0 "Çok doğru. #EMP Paradan#! önemli hiçbir şey yoktur"
 child_personality.7051.callous:0 "Güzel. Basit #EMP duyguların#! seni yapman gerekenden alıkoymasına izin verme."
 child_personality.7051.change.just:0 "Hiçbir şey öğrenmedin mi!? Ders #EMP adalet!#! hakkındaydı!"
 child_personality.7051.change.greedy:0 "Haha! Hayır çocuk, yapman gereken onları iliklerine kadar sömürmek!"
 child_personality.7051.change.callous:0 "Duygu zayıflıktır çocuk. Zayıflıklarından kurtul."
 child_personality.7060.t:0 "[child.GetFaith.ReligiousText|U] ve Hikmetleri"
### TODO AGOT-ONLY: child_personality.7060.desc [AGOT: ]
 child_personality.7060.desc:0 ""Look at this page, [child.GetFirstNameNoTooltip]! I think it speaks of [child.GetFaith.random_GoodGodNames], it's really interesting." [other_child.GetFirstName] says, an open copy of the [child.GetFaith.ReligiousText] lying in front of [other_child.GetHerHim] on the floor.\n\n"There's so much we don't know, so much to learn! So many mysteries, so much knowledge – let's try to divine some more truths, imagine what we could become!" [other_child.GetFirstNameNoTooltip|U] says, [other_child.GetHerHis] gaze slowly turning upwards."
 child_personality.7060.a:0 "Bu kitapta, anlayanlar için çok önemli dersler var!"
 child_personality.7060.b:0 "Meh, benim #EMP [child.Custom('child_favorite_toy')] ile oynamayı tercih etmez misin!?#!"
 child_personality.7060.c:0 "Bildiklerim bana yetiyor, teşekkürler."
 child_personality.7061.t:0 "$child_personality.7060.t$"
 child_personality.7061.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('child'))|U] [child.GetFirstName], arkadaşı [other_child.GetFirstName] ile birlikte [child.GetFaith.ReligiousText] kitabının bir nüshasını alıp oyun odasına götürmüşler...\n\n"
 child_personality.humble.desc:0 "Saatlerce sayfalarda neyin anlatıldığını anlamaya çalışmışlar, [child.GetFaith.random_GoodGodNames] hakkında ve ilahi gizemler hakkında konuşmuşlar.\n\n[child.GetFirstNameNoTooltip] kutsal [child.GetFaith.GetAdjective] metinlerine karşı bir saygı besliyor gibi gözüküyor."
 child_personality.cynical.desc:0 "...ve mahvetmişler! Yırtık sayfalar, kapakta ayak izleri – sıfır saygı!\n\nGörünüşe göre [child.GetFirstNameNoTooltip] kutsal metinlere pek ehemmiyet vermiyor..."
 child_personality.content.desc:0 "[child.GetFirstNameNoTooltip] okumaya çalışmış ama kısa sürede bunun en iyi [child.GetFaith.PriestNeuterPlural] tarafından yapılacağını ve kendi hadlerine olmadığını anlamış.\n\nÇocuk kitaptaki derin anlamları anlayamamaktan hiç rahatsız olmuş gibi durmuyor..." ### CQC
 child_personality.7061.humble:0 "Kutsal metinlere saygı gösteriyorsun, aferin."
 child_personality.7061.cynical:0 "Hah! Hepsi saçmalık zaten."
 child_personality.7061.content:0 "Bilmemek mutluluktur."
 child_personality.7061.change.humble:0 "Kutsal metine saygı duyacaksın! Büyük #EMP bilgelik#! ve #EMP anlam#! içeriyorlar!"
 child_personality.7061.change.cynical:0 "Hepsi saçmalık çocuk. Yoksay."
 child_personality.7061.change.content:0 "Bildiklerinde tatmin olursan mutlu olursun."
 child_personality.7070.t:0 "Kan ve Tükürük"
 child_personality.7070.desc:0 "[child.Custom('GetExpensiveMeal')|U], en #EMP sevdiğim!#! Tam yumulacakken [other_child.GetFirstName] geliyor. Ne istiyor bu?\n\n"Kimler buradaymış, #EMP [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!#! Ne yiyorsun? İğrenç gözüküyor – izin ver biraz #EMP tatlandırayım!#!" diyor [other_child.GetFirstNameNoTooltip] ve tabağıma yaklaşıyor.\n\n#flatulence *Tü!*#! Koca bir tükürük topu yemeğimin tam ortasına yerleşiyor.\n\n"Bak şimdi çok daha lezzetli oldu! Hahahaha!" diye sırıtıyor."
 child_personality.7070.a:0 "Bu son damlaydı [other_child.Custom2('InsultNoun', ROOT.Char)]!"
 child_personality.7070.b:0 "Bundan böyle gizlice onun yemeklerine tüküreceğim #EMP afiyetler.#!"
 child_personality.7070.c:0 "Karşılık vermeyeceğim."
 child_personality.7070.c.flavor:0 "Sineye çek."
 child_personality.7071.t:0 "$child_personality.7070.t$"
 child_personality.7071.desc:0 "Görünüşe göre [other_child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] ile uğraşıyormuş ve birkaç gece önce akşam yemeğine tükürmüş.\n\n"
### TODO AGOT-ONLY: child_personality.vengeful.desc [AGOT: ]
 child_personality.vengeful.desc:0 ""You're a [other_child.Custom2('InsultNoun', SCOPE.sC('child'))]!" [child.GetFirstNameNoTooltip] screams. "But you're a [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!" [other_child.GetFirstNameNoTooltip] screams back.\n\n[child.GetFirstNameNoTooltip] has been fighting with [other_child.GetFirstNameNoTooltip] every day since! Not a minute goes by without [child.GetHerHim] plotting some sort of petty revenge..."
 child_personality.deceitful.desc:0 "Aşçılardan biri [child.GetFirstNameNoTooltip] gizlice [other_child.GetFirstNameNoTooltip] tarafından yenecek yemeğe tükürerek intikam alırken onu görmüş! Demek [other_child.GetFirstNameNoTooltip] akşam yemeğinde bu yüzden biraz... #EMP yeşilmiş#! – çocuğun yemeğine kim bilir kaç akşamdır tükürüyor..." ### CQC
 child_personality.calm.desc:0 "Görünüşe göre [child.GetFirstNameNoTooltip] pasif direnişi seçmiş çünkü hiçbir şekilde tepki vermiyor, [other_child.GetFirstNameNoTooltip] da çıldırıyor. [other_child.GetFirstNameNoTooltip] onu istediği kadar [child.Custom2('InsultNoun', SCOPE.sC('other_child'))] diye çağırsın ya da tokat atsın, tık yok..."
 child_personality.7071.vengeful:0 "İntikamın vakti de gelecek."
 child_personality.7071.deceitful:0 "Hah, [other_child.GetFirstNameNoTooltip] hak etmiş!"
 child_personality.7071.calm:0 "Yoksayarsan [other_child.GetFirstNameNoTooltip] kısa zamanda sıkılıp peşini bırakır."
 child_personality.7071.change.vengeful:0 "Bu kadar uysal olma! #EMP İntikam al!#!"
 child_personality.7071.change.deceitful:0 "İntikam soğuk yenen bir yemektir... #EMP dolaylı olarak.#!"
 child_personality.7071.change.calm:0 "Öbür yanağını dön çocuğum."
 child_personality.7080.t:0 "Cömertlik Üzerine Bir Ders"
### TODO AGOT-ONLY: child_personality.7080.desc_1 [AGOT: ]
 child_personality.7080.desc_1:0 ""Look at the poor and the downtrodden, [child.GetFirstNameNoTooltip]. There are many of them, and some are truly in need – others are mere charlatans seeking a handout." "
 child_personality.7080.desc_name_1:0 "[teacher.GetTitledFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_name_2:0 "[teacher.GetCouncilTitle] [teacher.GetFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_2:0 "diye bana açıklıyor ve küçük bir altın kesesi çıkarıyor.\n\n"Bunların arasında kim bugün sadakamıza en çok ihtiyaç duyuyor, sevgili çocuğum?" diyor ve keseyi bana uzatıyor.\n\nGörünüşe göre [teacher.GetFirstNameNoTooltip] benden altınları en çok ihtiyaç duyanlara dağıtmamı istiyor..." ### CQC
 child_personality.7080.a:0 "Hepsi hak ediyor! Verecek daha fazlamız var, değil mi?"
 child_personality.7080.b:0 "[ROOT.Char.Custom('lowly_servant_type')|U]! Hayır... şuradaki köylü! Bekle, belki de..."
 child_personality.7080.c:0 "Hiçbiri. İşe yaramaz çapulculardan başka bir şey değiller!"
 child_personality.7081.t:0 "$child_personality.7080.t$"
 child_personality.7081.desc:0 "[teacher.GetTitledFirstName] bugün [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('child'))] [child.GetFirstName] ile çarşıya çıkmış. Niyet [child.GetFirstNameNoTooltip] tarafından ihtiyaç duyanlara sadaka verilmesi ve böylece cömertlik ve hükümdarın ihtiyaç sahiplerine karşı görevine dair bir ders vermekmiş.\n\n"
### TODO AGOT-ONLY: child_personality.generous.desc [AGOT: ]
 child_personality.generous.desc:0 ""The [child.Custom('ComplimentAdjective')] child gave something to everyone." [teacher.GetFirstNameNoTooltip] says. "And when the purse ran dry, [child.GetSheHe] insisted that we'd go get another. Very selfless, maybe even excessively so."\n\nIt seems that little [child.GetFirstNameNoTooltip] has a very big heart."
### TODO AGOT-ONLY: child_personality.fickle.desc [AGOT: ]
 child_personality.fickle.desc:0 ""The scatterbrained child couldn't decide who to give the gold to." [teacher.GetFirstNameNoTooltip] says, visibly annoyed. "At the end, [child.GetSheHe] had given one coin to the one-legged [ROOT.Char.Custom('lowly_servant_type')], one to a blind urchin, used another coin to buy [child.Custom('FavoriteTreatDemand')], gave one to #EMP me#! of all people, and lost the last one in a ditch."\n\nIt seems that little [child.GetFirstNameNoTooltip] is quite unable to make up [child.GetHerHis] mind..."
### TODO AGOT-ONLY: child_personality.arrogant.desc [AGOT: ]
 child_personality.arrogant.desc:0 ""[child.GetSheHe|U] refused to give a single coin to #EMP anyone!#!" [teacher.GetFirstNameNoTooltip] exclaims. "Everyone we met were either 'undeserving' or 'beneath [child.GetHerHim]'... in the end, [child.GetSheHe] kept the gold."\n\n[child.GetFirstNameNoTooltip] seems to have developed an egotistical streak..."
 child_personality.7081.generous:0 "Onlara elimizden gelen tüm yardımı yapmak görevimiz!"
 child_personality.7081.fickle:0 "Tüm yolları seçebilecekken niye tek bir yol seçesin ki?" ### CQC
 child_personality.7081.arrogant:0 "Bu doğru çocuk. Senin #EMP seviyende#! değiller."
 child_personality.7081.change.generous:0 "Hayır, fakirlere merhamet göstermek #EMP zorundasın#!!"
 child_personality.7081.change.fickle:0 "Her zaman seçeneklerini değerlendirmelisin. Dikkatlice. Sürekli."
 child_personality.7081.change.arrogant:0 "Hah! Bu çapulcuların hiçbiri senin merhametine layık değil!"
 child_personality.7090.t:0 "Diplomasinin İncelikleri"
### TODO AGOT-ONLY: child_personality.7090.desc [AGOT: ]
 child_personality.7090.desc:0 ""Vassals will, at times, overstep their bounds." My teacher [teacher.GetFirstName] says. "Forgiveness will strengthen your bonds."\n\n"At times, put trust in a subject, despite their reputation. Lest you will be overburdened." [teacher.GetSheHe|U] drones on.\n\n"It is important that you give them the time they need to right their wrongs." [teacher.GetFirstNameNoTooltip] says, rolling up the parchment.\n\n"Now, what have you learned here today?" [teacher.GetSheHe|U] says, looking intently at me."
 child_personality.7090.a:0 "Herkes hata yapar, yargılamakta acele etmemeliyiz."
 child_personality.7090.b:0 "Tebaana güvenmek çok önemlidir!"
 child_personality.7090.c:0 "Sabırlı ol. İşlerin doğal akışında gelişmesine izin ver."
 child_personality.7091.t:0 "$child_personality.7090.t$"
 child_personality.7091.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))|U] [child.GetFirstName] bugün [teacher.GetFirstName] tarafından vasal yönetimi konusunda önemli bir ders aldı. Gerekli ama karmaşık bir konu, belki [child.GetFirstNameNoTooltip] için biraz fazla olabilir.\n\n"
### TODO AGOT-ONLY: child_personality.forgiving.desc [AGOT: ]
 child_personality.forgiving.desc:0 ""Everyone makes mistakes!" [child.GetFirstNameNoTooltip] exclaims. "When I rule, I will forgive and let live – so that my realm may prosper!"\n\nPerhaps [child.GetSheHe] would be a #EMP too#! forgiving ruler..?"
### TODO AGOT-ONLY: child_personality.trusting.desc [AGOT: ]
 child_personality.trusting.desc:0 ""My subjects only ever wish me well!" [child.GetFirstNameNoTooltip] exclaims. "I will trust my subjects indiscriminately – so that we can build the realm together!"\n\nOh you sweet, gullible child... that level of trust could be dangerous..."
### TODO AGOT-ONLY: child_personality.patient.desc [AGOT: ]
 child_personality.patient.desc:0 ""I must let things take their time." [child.GetFirstNameNoTooltip] says. "Only by being patient and letting my subjects work at their own pace may I rule wisely."\n\n[child.GetFirstNameNoTooltip] seems unaware that some subjects would willfully waste [child.GetHerHis] time..."
 child_personality.7091.forgiving:0 "İleriye giden yol affetmekten geçer."
 child_personality.7091.trusting:0 "Güzel, şüpheyi aklından uzaklaştır!"
 child_personality.7091.patient:0 "Sabırlı olmak ileride çok işine yarayacak."
 child_personality.7091.change.forgiving:0 "Affedicilik erdemlerin en büyüğüdür!"
 child_personality.7091.change.trusting:0 "Vasallarına güven, onlar sana asla zarar vermez!"
 child_personality.7091.change.patient:0 "Sabırlı ol, olayların gelişmesine izin ver ve sonra ölç, biç ve kararını ver."
 child_personality.7100.t:0 "Cephaneliğe Sızış"
 child_personality.7100.desc:0 "Sonunda içerideyiz! Cephanelikteki tüm silahlar avucumuzun içinde; çoook eğleneceğiz! Bizi dışarıda tutmaya çalışan kokuşmuş aptal yetişkinler, size kapak olsun!\n\n"Bak! Bir [other_child.Custom('signature_weapon')] buldum!" diyor suç ortağım [other_child.GetFirstName], elinde [other_child.Custom('SignatureWeaponActionPresentParticiple')].\n\nTam o sırada ben de bir [child.Custom('SignatureWeaponArticle')] [child.Custom('signature_weapon')] görüyorum ve dokunmak için uzanırken arkamdan bir "Ah" sesi duyuyorum – [other_child.GetFirstNameNoTooltip] kendini yaralamış, kan da var!\n\nNe yapacağım?!" ### CQC
 child_personality.7100.a:0 "Yaptıklarımızı #EMP hemen#! itiraf etmeliyiz"
 child_personality.7100.b:0 "Ne yaparsan yap, kıyafetlerime kan bulaştırma da. *[child.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')|U] [child.Custom('signature_weapon')]*"
 child_personality.7100.c:0 "SARGI GEREK, HEMEN ŞİMDİ!"
 child_personality.7101.t:0 "$child_personality.7100.t$"
 child_personality.7101.desc:0 "[ROOT.Char.Custom('CulturalCurse')|U]! Başbelası [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] ve arkadaşı [other_child.GetFirstName] cephaneliğe sızarken suç üstü yakalanmışlar. Silahların tehlikeli olduğunu bilmiyorlar mı?!\n\n"
 child_personality.honest.desc:0 "[other_child.GetFirstNameNoTooltip] kendini yaralamış ama şükürler olsun ki [child.GetFirstNameNoTooltip] hemen koşup durumu en yakındaki yetişkine söylemiş ve yaptıkları her şeyi itiraf etmiş.\n\n[child.GetFirstNameNoTooltip] gerçekten perişan gözüküyor, bir daha kolay kolay yalan söyleyeceğini sanmıyorum." ### CQC
 child_personality.arbitrary.desc:0 "Hizmetkârlardan biri çocukları suç üstü yakalamış. [other_child.GetFirstNameNoTooltip] yerde kanlar içinde ağlarken [child.GetFirstNameNoTooltip] hiçbir şey olmamış gibi [child.Custom('signature_weapon')] ile oynuyormuş...\n\nGörünüşe göre [child.GetFirstNameNoTooltip] [other_child.GetFirstNameNoTooltip] batırdı diye kendi eğlencesinden feragat etmek istememiş. Bu çocuğun hâli ne olacak..."
 child_personality.impatient.desc:0 "[child.GetFirstNameNoTooltip] kendini yaralamış [other_child.GetFirstNameNoTooltip] için sargı ararken yanlışlıkla bir zırh takımını devirmiş ve sesi duyan hizmetkârlardan birine yakalanmış.\n\nGörünüşe göre [child.GetFirstNameNoTooltip] üzerine düşünülmemiş planlara meyilli..."
 child_personality.7101.honest:0 "İtiraf etmiş olman olumlu."
 child_personality.7101.arbitrary:0 "Anlaşılabilir. Zaten [other_child.GetFirstNameNoTooltip] kimin umurunda ki?"
 child_personality.7101.impatient:0 "Arkadaşını kurtarmak için kendini mi riske attın? Aferin!"
 child_personality.7101.change.honest:0 "Suçunu itiraf etmeliydin velet!"
 child_personality.7101.change.arbitrary:0 "Oynamaya devam etmeliydin, [other_child.GetFirstNameNoTooltip] önemsiz biri."
 child_personality.7101.change.impatient:0 "Niye #EMP hemen#! yardıma gitmedin?"
 child_personality.7200.t:0 "Karanlık Mağara"
### TODO AGOT-ONLY: child_personality.7200.desc [AGOT: ]
 child_personality.7200.desc:0 ""You want your [other_child.Custom('child_favorite_toy')]? Huh, do you? #EMP Then go get it!#!" [other_child.GetFirstName] shouts, throwing the little [other_child.Custom('GirlBoy')]'s [other_child.Custom('child_favorite_toy')] deep into the dark, gloomy cave. The little [other_child.Custom('GirlBoy')] starts crying uncontrollably.\n\n"Now it'll keep the #EMP spiders#! and #EMP snakes#! company! It's lost, forever!" [other_child.GetFirstNameNoTooltip] exclaims, laughing.\n\nHow can [other_child.GetFirstNameNoTooltip] be so mean to that poor [other_child.Custom('GirlBoy')]!? The cave is full of creepy-crawlies... but I #EMP must#! do something!"
 child_personality.7200.a:0 "Korkma, oyuncağını alıp sana getireceğim!"
 child_personality.7200.b:0 "Muhafızlar! [other_child.GetFirstNameNoTooltip] gidip alacak."
 child_personality.7200.c:0 "Bu beni çok SİNİRLENDİRDİ! Seni eşek sudan gelene kadar döveceğim!"
 child_personality.7201.t:0 "$child_personality.7200.t$"
 child_personality.7201.desc:0 "Saraydaki çocuklardan [other_child.GetFirstName], daha küçük bir çocuğun [other_child.Custom('child_favorite_toy')] oyuncağını almış ve yakınlardaki bir mağaraya atmış. [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('child'))|U] oradaymış ve hepsini görmüş.\n\n"
 child_personality.brave.desc:0 "Mağaraya girdi ve neredeyse yarım saat çıkmadı! Ama sonunda elinde oyuncakla çıktığında diğer çocuğun yüzünü görmeliydin.\n\nÇok cesurcaydı ama aynı zamanda biraz da aptalca."
 child_personality.stubborn.desc:0 "[child.GetFirstNameNoTooltip] muhafızlara emredince [other_child.GetFirstNameNoTooltip] el mahkûm mağaraya girdi! Birkaç dakika sonra çığlıklar bir anda durunca dışarıdakiler bir an korktu ama [other_child.GetFirstNameNoTooltip] hemen elinde oyuncakla mağaradan çıktı.\n\nGörünüşe göre [child.GetFirstName] bir şeyin yapılmasının doğru olduğunu düşünüyorsa, onun yapılmasını sağlıyor. Güzellikle ya da zorla..."
 child_personality.wrathful.desc:0 "[child.GetFirstNameNoTooltip] öfkeden kıpkırmızı oldu ve [other_child.GetFirstNameNoTooltip] tanınmayacak hâle gelene kadar onu yumrukladı! Bu küçük çocuğa pek yaramadı ve daha fazla ağlattı...\n\nGörünüşe göre [child.GetFirstNameNoTooltip] öfkesini kontrol etmekte zorlanıyor..."
 child_personality.7201.brave:0 "Ne kadar cesurca!"
 child_personality.7201.stubborn:0 "İstediğin olacak, çocuk."
 child_personality.7201.wrathful:0 "[other_child.GetFirstNameNoTooltip] yaptığının bedelini ödemeliydi!"
 child_personality.7201.change.brave:0 "Oraya kendin girmeliydin, korkusuzca."
 child_personality.7201.change.stubborn:0 "Çocuğu oyuncağı almaya zorlamalıydın."
 child_personality.7201.change.wrathful:0 "Diğer çocuğu hemen orada yumruklamalıydın!"
