l_english:
 do_not_execute_murder_tooltip:0 "Cinayet teşebbüsünde bulunmayacaksınız"
 murder_child_really_tooltip:1 "Çocuk öldürmek... Emin misiniz?"
 murder_outcome_murdered_rival_tt: "[Concept( 'rival', 'Rakibinizden' )|E] daha uzun yaşadığınız için [prestige_i][EmptyScope.ScriptValue('rival_outlived_prestige_value')|P0] kazandınız"
 murder_unknown_murder_against_you_was_successful:0 "#X Bilinmeyen bir saldırgan tarafından öldürüldünüz!#!"
 murder_unknown_murder_against_you_was_successful_other:0 "#X [THIS.Char.GetShortUIName] bilinmeyen bir saldırgan tarafından öldürüldü!#!"
 murder_outcome.1001.t:0 "Suikastçı!"
 murder_outcome.1001.d:0 "Vakit geldi. Adamlarım yerlerini almış vaziyette. Bir adamım suikastçıya harekete geçileceği gün ödeme yapacak. Bir diğeri surlarda muhafız olmadığından emin olacak. Üçüncüsü ise mumlardan hedefin odasına doğru göze çarpmayan bir şekilde yol çizecek.\n\nHer şey hazır."
 murder_outcome.1001.a:0 "Yapın."
 murder_outcome.1001.b:0 "Bekleyin, henüz hazır değilim."
 murder_outcome.1002.t:0 "Tuzak"
 murder_outcome.1002.opening:0 "Adamlarım [target.GetTitledFirstName] için onu karanlık ormanların arasından geçirecek bir seyahat rotası hazırladı. $murder_outcome.1002.d$"
 murder_outcome.1002.opening_travel:0 "Adamların dediğine göre [target.GetTitledFirstName] şu anda [province.GetName] topraklarına seyahat ediyormuş. Yol üzerinde güzel fırsat yakalayabileceğimiz yerler de varmış.\n\n$murder_outcome.1002.d$"
 murder_outcome.1002.d:1 "Şimdi tek gereken, doğru yerde doğru zamanda onların önünü kesecek bir grup eşkıya.\n\nŞimdiden kanın toprağa dökülüşünü kafamda canlandırabiliyorum..."
 murder_outcome.1002.a:1 "Ah, ıssız yerler tehlikeli tehlikeli yerlerdir."
 murder_outcome.1002.b:0 "Bekleyin, doğru zaman henüz gelmedi."
 murder_outcome.1003.t:0 "Uğruna Ölünecek Bir Yemek"
 murder_outcome.1003.d:0 "Adamlarım hazırlıklarını tamamladı. Aşçıya gözünü kapaması için rüşvet verildi, zehir satın alındı ve [target.GetTitledFirstName] ona gönderdiğimiz hediye ördeği teslim aldı. Ördeğin etrafında dizilmiş yeşillikler zehrin kokusunu bastıracak. Ördeğin keskin tadı fâni dünyada aldığı son tat olacak."
 murder_outcome.1003.a:0 "Afiyet olsun, [target.GetFirstNameNoTooltip]..."
 murder_outcome.1003.b:0 "Bekleyin, daha fazla zamana ihtiyacım var!"
 murder_outcome.1004.t:0 "Davetsiz Misafir"
 murder_outcome.1004.desc:0 "Adamlarımdan biri [SCOPE.Custom('VenomousCreature')] satın aldı ve gün batmadan hedefin yatağına bırakması için hizmetçilerden biriyle anlaştı.\n\nGeriye kalan yegâne şey harekete geçilmesi için vereceğim işaret, ardından yatağına bırakılan [SCOPE.Custom('VenomousCreatureType')]n saldırmasıyla birlikte tahtalı köyü boylayacak!"
 murder_outcome.1004.a:0 "Umarım bu [SCOPE.Custom('VenomousCreatureTypePlural')] seni korkutmuyordur, [target.GetFirstNameNoTooltip]..."
 murder_outcome.1004.b:0 "Böyle olmaz."
 murder_outcome.1005.t:1 "$knight_culture_player_plural_no_tooltip$ ve Köylüler"
 murder_outcome.1005.desc:0 "[home_province.GetNameNoTier] topraklarında köylülerle yaşanan son gerilimlerin ardından, adamlarımdan biri enteresan bir fikirle yanıma geldi.\n\nDoğru isimlere rüşvet verip, her köşede azmettiricilerin bulunmasını sağlarsak, tam da [target.GetTitleTierName] sokaktan geçerken bir isyanın baş göstermesini sağlayabiliriz."
 murder_outcome.1005.a:0 "Ah, linçlere bayılırım."
 murder_outcome.1005.b:0 "Çok riskli bir plan!"
 murder_outcome.1006.t:0 "Şarap Fıçısı"
 murder_outcome.1006.desc:0 "[target.GetTitledFirstName], [home_province.GetName] topraklarındaki bir kutlamaya katılacakmış.\n\nKendisinin şarabı sevdiğini biliyorum, eğer şaraplarımı tatma amacı ile mahzenime çekebilirsem amacıma ulaşabilirim..."
 murder_outcome.1006.a:0 "Kolay olacak."
 murder_outcome.1007.t:0 "Dalgalı Sular"
 murder_outcome.1007.travel:0 "[target.GetTitledFirstName] şu anda [province.GetName] dolaylarında bir gemide."
 murder_outcome.1007.desc_not_inspection:0 "[target.GetTitledFirstName] bu hafta [province.GetNameNoTier] limanında demir atmış gemilerden birini ziyaret edecekmiş."
 murder_outcome.1007.desc:0 "[target.GetTitledFirstName] bu hafta [province.GetNameNoTier] limanında demir atmış gemilerden birini teftiş edecekmiş."
 murder_outcome.1007.desc_ending:0 "\n\nOnu gemiye taşıyacak kayığın yanıcı maddelerle kaplanmasını sağlayıp tam limanın ortasına gelince alevli bir ok ile işi bitirebilirim. Ya yanarak ölür ya da boğularak."
 murder_outcome.1007.desc_ending_travel:0 "\n\nYardakçılarım her bir odun parçasını yanıcı sıvılarla sırılsıklam etse, gemideki tek kayıkla da kaçarken gemiyi ateşe verseler [target.GetFirstNameNoTooltip] hiçbir yere kaçamaz... Belki yanında birkaç kişiyi de götürür."
 murder_outcome.1007.a:0 "Planı hazırlamaya başlayalım."
 murder_outcome.1008.t:0 "Ölüm İçeceği"
 murder_outcome.1008.desc:0 "Adamlarım içeceklerde iz bırakmadan çözünen gizli bir toz elde etmeyi başardılar. Hedefimin içeceklerini doldurmakla görevli hizmetçiler rüşveti kabul etti, geriye kalan tek şey bu zehri onun bir sonraki içkisine eklemek."
 murder_outcome.1008.a:0 "Yarasın!"
 murder_outcome.1201.t:0 "Tenha Yollar"
 murder_outcome.1201.desc:0 "[assassin.GetTitledFirstName], [target.GetTitledFirstName] için özel bir rota hazırladı. Çocuk tüm masumluğuyla ormanda eğlenceli vakit geçireceğini zannediyor.\n\nNe yazık ki [target.GetFirstNameNoTooltip] oyun oynadığı ormanlarda kaybolacak ve gecenin karanlığı çökmeden bulunamayacak. Ah, çok da gençti..."
 murder_outcome.1201.no_assassin:0 "Adamlarımdam birisi [target.GetTitledFirstName] için özel bir rota hazırladı. Çocuk tüm masumluğuyla ormanda eğlenceli vakit geçireceğini zannediyor.\n\nNe yazık ki [target.GetFirstNameNoTooltip] oyun oynadığı ormanlarda kaybolacak ve gecenin karanlığı çökmeden bulunamayacak. Ah, çok da gençti..."
 murder_outcome.1201.a:0 "Bir çocuğun ormanda kaybolması... Trajik ama bir o kadar da sıradan."
 murder_outcome.1201.b:0 "Olmaz, bunu tekrar düşünmeliyim!"
 murder_outcome.1202.t:0 "Savunmasız"
 murder_outcome.1202.desc:0 "Vakit geldi. Küçük [target.GetTitledFirstName], bakıcılarının doğru fiyata neler yapabileceğinden habersiz.\n\nElindeki büyükçe örgü şişinin plandaki rolünü anlatmasının ardından bakıcıyı gönderiyorum."
 murder_outcome.1202.a:0 "Fiyatı önemli değil, işini yap."
 murder_outcome.1202.b:0 "Ben ne yapıyorum böyle?"
 murder_outcome.1203.desc:0 "Bir bebeğe kıyacak insan bulmak zor olabilir fakat [SCOPE.Custom('VenomousCreatureType')] onun beşiğine bırakacak adam bulmak oldukça kolay.\n\nAdamımı [SCOPE.Custom('VenomousCreature')] çantasına koyarken izliyorum, içindeki yaratık neredeyse kurbanı büyüklüğünde!"
 murder_outcome.1204.t:0 "Acı Tatlı"
 murder_outcome.1204.desc:0 "[target.GetTitledFirstName] dünyada tek bir şeyi seviyorsa o da tatlı. Özellikle de [target.Custom('FavoriteTreat')]...\n\nYardakçılarımın yarı [target.Custom('FavoriteTreat')] yarı da zehirden oluşan bir tatlıyı çocuğun önünde unutmalarını sağlayabilirim."
 murder_outcome.1204.a:0 "Afiyet bal şeker olsun."
 murder_outcome.1205.t:0 "Tehlikeli Uçurumlar"
 murder_outcome.1205.desc_opening:0 "[target.GetTitledFirstName] yakında ölecek. Sonuçta her şey ölür: krallıklar, insanlar, #EMP kulelerden atılan küçük çocuklar#!...\n\n"
 murder_outcome.1205.desc_dog:0 "Yardakçılarım köpeğini yakalayıp surun iyice yüksek olan bir kısmından asacak. Çığlık atar gibi havlayan köpeğini gören çocuk da dayanamayıp kurtarmaya çalışır."
 murder_outcome.1205.desc_cat:0 "Yardakçılarım kedisini yakalayıp surun iyice yüksek olan bir kısmından asacak. Kedinin çığlıklarını duyan çocuk da dayanamayıp kurtarmaya çalışır."
 murder_outcome.1205.desc_toy:0 "Yardakçılarım en sevdiği oyuncağını surun iyice yüksek olan bir kısmından asacak. Onu geri almak için yapmayacağı şey yok."
 murder_outcome.1205.desc:0 "Yardakçılarım surun iyice yüksek bir kısmına giden yol üzerinde tatlılar bırakacak. Çocuk da kafasını kaldırıp tatlı dolu sepeti gördüğünde dayanamayacak."
 murder_outcome.1205.desc_ending:0 "Halatı çözmek için uğraşırken dengede kalması zor. Elbet ayağı kayar..."
 murder_outcome.1205.a:0 "Vah vah."
 murder_outcome.1301.t:0 "Karanlıkta Unutulmuş"
 murder_outcome.1301.desc:0 "Görünen o ki zindandaki gardiyanlar doğru fiyata bir grup saray mensubunu fark etmeyebiliyormuş. Adamlarım telaşlı adımlarla planımızı harekete geçirmek üzere zindanda ilerlerken, [target.GetTitledFirstName] bunun hayatında alacağı son ziyaret olduğundan bihaber..."
 murder_outcome.1301.a:0 "Acaba [prison_owner.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'kadının', 'adamın' )] öldüğünü ne zaman fark eder?"
 murder_outcome.1301.b:0 "Hayır, şimdi olmaz."
 murder_outcome.1302.t:0 "Davetsiz Misafir"
 murder_outcome.1302.desc:0 "[target.GetTitledFirstName] bir süredir ev hapsinde, bu da ona ulaşmayı normalden zor bir hâle getirmiş durumda. Neyse ki adamlarım"
 murder_outcome.1302.home_court_exists:0 "[target_home.GetNameNoTier] sarayından"
 murder_outcome.1302.home_court_does_not_exists:0 "hedefin eski sarayından"
 murder_outcome.1302.end:0 "ziyaretine gelmiş eski bir dostuymuş gibi yapmaya razı bir hizmetçi bulmuş..."
 murder_outcome.1302.a:0 "Hizmetçiyi silahlandırıp yollayın."
 murder_outcome.1302.b:0 "Hayır, şimdi olmaz."
 murder_outcome.1401.t:0 "Merhamet"
 murder_outcome.1401.desc:0 "Zavallı ve bir o kadar da savunmasız [target.GetTitledFirstName]... Böyle bir hayat gerçekten de yaşamaya değer mi?\n\nAdamlarım suikastçının hedefin odasına ulaşabilmesi için tüm hazırlıklarını tamamladı. Görünen o ki [target.GetTitleTierName] "uyuyor.""
 murder_outcome.1401.a:0 "Böylesi daha iyi."
 murder_outcome.1401.b:0 "Olmaz, bu yanlış."
 murder_outcome.2000.t:0 "Kaderin Cilvesi"
 murder_outcome.2000.desc:0 "[target.GetTitledFirstName] için tüm planlarımı hazırlamışken yanıma bir haberci geliyor. Görünen o ki [owner.Custom2('InsultNoun', ROOT.Char)] [Select_CString(target.IsFemale, 'kadın', 'herif' )] bana gerek olmadan kendiliğinden ölmüş!"
 murder_outcome.2000.a:0 "[ROOT.Char.GetFaith.DevilName|U] onu yanına arkadaş almıştır!"
 murder_outcome.2000.a.tt:0 "[target.GetTitledFirstName] [target.GetDeathReason]"
 murder_outcome.2500.desc:0 "[target.GetTitledFirstName] ile [ROOT.Char.GetFaith.DevilName|U] arasındaki buluşmanın son hazırlıklarını gerçekleştirirken bir kâhya yanıma geliyor. Görünen o ki [owner.Custom2('InsultNoun', ROOT.Char)] [Select_CString(target.IsFemale, 'kadın', 'herif' )] uzak topraklara göç etmiş ve artık ona erişmem mümkün değil!"
 murder_outcome.2500.a:0 "Benden kaçmış olabilirsin ama ölümden kaçamayacaksın!"
 murder_outcome.2001.t:0 "Suikastçı!"
 murder_outcome.2001.opening_1:0 "Planım başarılı oldu, [target.GetName] nihayet öldü!"
 murder_outcome.2001.opening_2:0 "Görünen o ki [target.GetTitledFirstName] sürekli yanında birileriyle dolaşan bir isim. Yine de suikastçının görevini yapması için tek bir fırsat aralığı yeterli oldu."
 murder_outcome.2001.opening_3:0 "Suikastçı görevini layıkıyla yerine getirdi, [target.GetName] nihayet öldü!"
 murder_outcome.2001.heh:0 "\nHah."
 murder_outcome.2001.owner_is_known_1:0 "\n\nNe yazık ki suçlamaların asılsız olduğunu belirtsem de, herkes bu işin arkasında benim olduğumdan emin."
 murder_outcome.2001.owner_is_known_2:0 "\n\nGörünen o ki birisi bir yerde boşboğazlık yapmış, cinayetteki rolüm herkes tarafından biliniyor! Neyse ki [target.GetTitledFirstName] şu an benden daha kötü bir konumda."
 murder_outcome.2001.no_awareness_1:0 "\n\nNeyse ki kimsenin cinayetteki rolüme dair en ufak bir fikri yok."
 murder_outcome.2001.no_awareness_2:0 "\n\nUstaca bir şekilde hiç iz bırakmadım. Aralarında şüphelenenler olsa dahi, kimse cinayetteki rolümü dile getirmeye cüret edemiyor."
 murder_outcome.2001.a.discovered:0 "Suikastçım orada onu #EMP gerçek#! katillerden korumak için bulunuyordu!"
 murder_outcome.2001.a:0 "Beklenmedik konukları severim."
 murder_outcome.2001.memories:0 "\n\n[bad_memory.GetDescription]. Dün gibi hatırlıyorum. [ROOT.Char.Custom('MurderMemoryEnding')|U]"
 murder_outcome.2002.t:0 "Tehlikeli Seyahatler"
 murder_outcome.2002.opening_1:0 "Dâhiyane planım sonuç verdi ve tuttuğum eşkıyalar sayesinde [target.GetTitledFirstName] artık ölü!"
 murder_outcome.2002.opening_2:0 "Eşkıyalar görevini layıkıyla yerine getirdi, [target.GetTitledFirstName] nihayet öldü!"
 murder_outcome.2002.opening_3:0 "[target.GetTitledFirstName] sıradan bir haydutun kılıcıyla bu dünyadan göç etti."
 murder_outcome.2002.heh:0 "\nHah."
 murder_outcome.2002.no_save:0 "\n\nKonvoy karanlığın bastırmasıyla dinlenmek üzere yanaştığı gibi kan ve altın peşindeki haydutlar etraflarını sardı. Askerler savaşmaya çalışsalar da, haydutların sayıca üstünlüğüne karşı koyamadılar ve [target.GetTitledFirstName] çıkan arbede esnasında hayatını kaybetti."
 murder_outcome.2002.owner_is_known_1:0 "\n\nGörünen o ki haydutlardan birisi yakalanmış ve onlara ödeme yaptığımı itiraf etmiş!"
 murder_outcome.2002.owner_is_known_2:0 "\n\nOlaydaki rolümün açığa çıkması haydutlardan birinin yakalanıp her şeyi itiraf ettiği anlamına geliyor!"
 murder_outcome.2002.no_awareness_1:0 "\n\nŞimdi herkes haydutların peşinde ve hiç kimse benden şüphelenmiyor!"
 murder_outcome.2002.no_awareness_2:0 "\n\nŞanslı bir şekilde haydutların da büyük bir kısmı saldırıda hayatını kaybetmiş. Ölüler konuşmaz. Kimse bu olaydaki rolümden haberdar olamayacak!"
 murder_outcome.2002.a.discovered:0 "Tek suçum şu çapulculara güvenmiş olmam..."
 murder_outcome.2002.a:0 "Hah! Belki de bu çapulcular o kadar da işe yaramaz değillerdir?"
 murder_outcome.2002.a.less_arrogant:0 "Bir taşla iki kuş!"
 murder_outcome.2003.t:0 "Son Yemek"
 murder_outcome.2003.opening_1:0 "Ördek ve küçük bir şişe zehir sayesinde [target.GetTitledFirstName] nihayet ölü!"
 murder_outcome.2003.opening_2:0 "Zehir görevini yerine getirdi, [target.GetTitledFirstName] nihayet ölü!"
 murder_outcome.2003.opening_3:0 "O ördek [Select_CString(target.IsFemale, 'kadının', 'adamın' )] hayatta aldığı son tat oldu!"
 murder_outcome.2003.owner_is_known_1:0 "\n\nGörünen o ki [target.GetTitledFirstName] boğulmak üzereyken ismimi zikretmeyi başarıp, ölümünün arkasında benim olduğumu herkese duyurmuş!"
 murder_outcome.2003.owner_is_known_2:0 "\n\nNe yazık ki zehir bulunmuş ve zehirci bana ihanet ederek ismimi vermiş!"
 murder_outcome.2003.owner_is_known_3:0 "\n\nHizmetçilerden biri suçluluk duygusuyla baş edemeyip her şeyi itiraf ettiği yetmezmiş gibi üstüne zehri de benden aldığını da söylemiş."
 murder_outcome.2003.no_awareness_1:0 "\n\nDaha da güzeli, tam ölmek üzereyken boğazına bir kemik kaçmış! Konuşamaz hâle gelen [target.GetTitledFirstName] benim ismimi verememiş!"
 murder_outcome.2003.no_awareness_2:0 "\n\nAdamlarım ustalıkla üstlerine herhangi bir şüphe çekmemeyi başarmış. Bu da kimsenin cinayetteki rolümü açığa çıkaramayacağı anlamına geliyor!"
 murder_outcome.2003.a.discovered_1:0 "Biraz çeşni katmak istemiştim!"
 murder_outcome.2003.a.discovered_2:0 "Aman canım. Hanginiz gerçekten kötü hissediyor?"
 murder_outcome.2003.a:0 "Yediklerinden olmalı."
 murder_outcome.2004.opening_1:0 "[target.GetTitledFirstName], yatağına bırakılan [SCOPE.Custom('VenomousCreature')]n [SCOPE.Custom('VenomousCreatureAttack')]yla hayatını kaybetti! Dinlenmek üzere odasına çekildikten kısa bir süre sonra saldırıya uğrayan [target.GetTitledFirstName], [SCOPE.Custom('VenomousCreatureType')] fark ettikten sonra muhafızları çağırsa da kimsenin elinden onu kurtarmak için bir şey gelmemiş."
 murder_outcome.2004.owner_is_known_1:0 "\n\nGörünen o ki ölmeden evvel benim adımı sayıklamaya başlamış. Cinayetteki rolüme dair şüpheler tüm ülkeye yayılmış durumda."
 murder_outcome.2004.no_awareness_1:0 "\n\nNeyse ki bu [SCOPE.Custom('VenomousCreatureTypePlural')] konuşmalarıyla bilinen hayvanlar değiller, bu sebeple kimse benden şüphelenmiyor."
 murder_outcome.2004.no_awareness_1_beaked_mammal:0 "\n\nNeyse ki bu gibi yaratıklar konuşamıyorlar - yani, konuşamıyorlardır herhâlde değil mi? - bu sebeple kimse benden şüphelenmiyor."
 murder_outcome.2004.a.discovered:0 "Bir [SCOPE.Custom('VenomousCreatureType')]n edasıyla [SCOPE.Custom('VenomousCreatureMovement')] vakti!"
 murder_outcome.2004.a:0 "Küçük dostum görevini layıkıyla yerine getirdi."
 murder_outcome.2005.opening_1:1 "[target.GetTitledFirstName], kendi halkı tarafından dövülerek öldürüldü!\n\nÖfkeli köylüler, hükümdarlarının hiçbir şey olmamış gibi sokaktan geçmesine daha fazla katlanamadılar ve hem onu hem de beraberindeki $knight_culture_player_plural_no_tooltip_lowercase$ alayını eşek sudan gelinceye kadar dövdüler!"
 murder_outcome.2005.owner_is_known_1:0 "\n\nBu olay sonrasında birçok köylü asılarak idam edildi, talihsiz bir şekilde bazıları idam edilmeden evvel benim adamlarım tarafımdan kışkırtıldıklarını söylediler."
 murder_outcome.2005.no_awareness_1:0 "\n\nAralarında azmettirici adamlarım da olmak üzere çok sayıda köylü asılarak idam edildi. Böylelikle olaydaki rolümün açığa çıkma ihtimali de kalmadı!"
 murder_outcome.2005.a.discovered:0 "Bu köylülerden bir cacık olmaz demiştim."
 murder_outcome.2005.a.discovered.less_arrogant:0 "Hem de kendi adamlarım tarafından! Kimler kimlerle..."
 murder_outcome.2005.a:0 "Halkın gücünü asla hafife almayın."
 murder_outcome.2006.desc:0 "[target.GetTitledFirstName] öldü. Cesedini kimse bulamayacak.\n\nBeni takip ederken çok heyecanlıydı, zaten sarhoştu ama şaraplarımla daha da sarhoş olmayı bekliyordu. "Kaliteli" şaraplarımı içerken hiçbir şeyden şüphelenmedi, içe içe uykuya daldı. Etrafını tuğlalarla kapatırken bile uyanmadı.\n\n"
 murder_outcome.2006.scheme_owner_known:0 "Maalesef onu mahzene götürürken görülmüşüm. Birkaç hafta içinde yeni ördüğüm duvarı yıkıp gerçekle karşılaştılar."
 murder_outcome.2006.scheme_unknown:0 "Neyse ki kimse mahzendeki tuhaf görünen yeni duvarı fark etmedi..."
 murder_outcome.2006.a.discovered:0 "Sarhoştu, kalacak bir yer verdim!"
 murder_outcome.2006.a:0 "Sonsuza kadar uyusun."
 murder_outcome.2007.desc:0 "[target.GetTitledFirstName] öldü, cesedi sulara karıştı.\n\nYardakçımın alevli oku gökyüzünde bir çizgi çekip kayığı ateşe verdi."
 murder_outcome.2007.desc_lowborn:0 "İçindeki herkes suya atladı, tabii ıslanan kıyafetleri de ağırlaştıkça ağırlaştı..."
 murder_outcome.2007.desc_highborn:0 "İçindeki herkes suya atladı, tabii kaliteli kumaşlı kıyafetleri de ağırlaştıkça ağırlaştı..."
 murder_outcome.2007.scheme_owner_known:0 "\n\nFakat okçum yakalandı ve tereddüt etmeden beni ele verdi."
 murder_outcome.2007.scheme_unknown:0 "\n\n#EMP Maalesef#! kimse kayığı vuran okçuyu görmemiş."
 murder_outcome.2007.a.discovered:0 "Yüzmeyi biliyor zannetmiştim."
 murder_outcome.2007.a:0 "Tüh, kötü olmuş."
 every_entourage_member:0 "[target.GetTitledFirstNameNoTooltip] maiyetindeki herkes:"
 murder_outcome.2008.desc_drunkard:0 "[target.GetTitledFirstName] çok sevdiği [target.Custom('RegionalAlcoholicDrink')] ile öldürüldü!"
 murder_outcome.2008.desc_not_drunkard:0 "[target.GetTitledFirstName], [target.Custom('RegionalDrink')] şişesinde boğularak hayatını kaybetti!"
 murder_outcome.2008.desc:0 "\n\nYardakçılarım kadehine zehri katıp, iz bırakmadan çözülmesini bekledi. [target.GetTitledFirstName] zehrin boğazından geçtiği ana kadar en ufak bir şeyden şüphelenmiyordu, olayı anladığında ise çok geçti.\n\n"
 murder_outcome.2008.scheme_owner_known:0 "Görünüşe göre yardakçılarım fark edilmiş ve rüşvet alan hizmetçi gecikmeden bana ihanet etmiş!"
 murder_outcome.2008.scheme_unknown:0 "Yardakçılarım kimse şüphelenmeden olay yerini terk etmeyi başarmışlar!"
 murder_outcome.2008.a.discovered:0 "İçecek bir şeyler istedi, biz de verdik."
 murder_outcome.2008.a:0 "Yarasın, [target.GetTitledFirstNameNoTooltip]!"
 murder_outcome.2201.t:0 "Parçalanmış Ceset"
 murder_outcome.2201.opening:0 "[target.GetTitledFirstName] öldü!\n\nGece geç saatlere kadar süren aramalar sonuçsuz kaldı, ertesi sabah devam eden aramalarda ise kanlar içerisinde, parçalanmış ve ezilmiş cesede ulaşıldı. Aç ve vahşi bir hayvanın işi gibi gözüküyor. En azından öyle olmasını umuyorum."
 murder_outcome.2201.scheme_owner_known:0 "\n\nFelaket bir şekilde adamım çocuk bulunur bulunmaz yere kapanıp her şeyi itiraf ediyor. Herkes bu trajedinin arkasında benim olduğumdan haberdar!"
 murder_outcome.2201.scheme_unknown:0 "\n\nNeyse ki herkes bu olayın trajik bir kaza olduğu konusunda hemfikir, kimse bu olayın bir plan sonucu gerçekleştiğine dair şüphe sahibi değil."
 murder_outcome.2201.a.discovered:0 "Beklenmedik engellerin üstesinden gelmek çocukluk döneminin önemli bir parçasıdır!"
 murder_outcome.2201.a:0 "Bir de çocuklar geleceğimizdir derler."
 murder_outcome.2202.desc:0 "İşin icabına bakıldı. [target.GetTitledFirstName] artık büyümeyecek, etrafındaki dünyayı tanıyamayacak. Görünüşe göre her şey oldukça hızlı, bir o kadar da kolay olmuş, kulağa doğru demirden bir şiş darbesi, parçalanan yumuşak deri ve kıkırdak..."
 murder_outcome.2202.desc_sadistic:0 "İstediğim o hazzı alana kadar saray mensubundan çığlıkları ve fışkıran kanı birkaç kez daha anlatmasını istiyorum."
 murder_outcome.2202.desc_normal:0 "Çok fazla ayrıntıya girilmesine müsaade etmeden saray mensubunu gönderiyorum."
 murder_outcome.2202.scheme_owner_known:0 "\n\nFelaket bir şekilde bakıcı yakalanıp, bu suçun azmettiricisi olarak benim adımı vermiş."
 murder_outcome.2202.scheme_unknown:0 "\n\nMevzubahis bakıcı yakalansa da, benim adımı söylemeye fırsatı olmadan hızlıca idam edilmiş."
 murder_outcome.2202.a:0 "Başka seçeneğim yoktu."
 murder_outcome.2202.a.tt:0 "#F Mecburdum!#!"
 murder_outcome.2202.a.sadistic:0 "Sıradaki kim?"
 murder_outcome.2203.desc:0 "İşin icabına bakıldı. [target.GetTitledFirstName] artık büyümeyecek, etrafındaki dünyayı tanıyamayacak. Görünüşe göre her şey oldukça hızlı gerçekleşmiş. Zehirli yaratık onu beşiğe bırakan kişi daha odayı terk etmeden görevine koyulmuş...\n\n"
 murder_outcome.2203.scheme_owner_known:0 "Felaket bir şekilde muhafızlar adamımı kıskıvrak yakalamışlar ve bu omurgasız adam her şeyin sorumlusunun ben olduğumu itiraf etmiş."
 murder_outcome.2203.scheme_unknown:0 "Muhafızlar da aynı hızla hareket ederek adamımı kıskıvrak yakalamayı başarmış. Suçun ardındaki kişiyi - yani beni - açığa çıkarmasına fırsat tanımadan idam etmişler."
 murder_outcome.2204.desc:0 "[target.GetTitledFirstName] öldü. Yemi yutmadı, âdeta sömürdü. Bir süre sonra nefesinin gittikçe daraldığını hissetti, boğazını tutup yere yığıldı. Tekrar kalkmayacak."
 murder_outcome.2204.scheme_owner_known:0 "\n\nMaalesef biri yardakçımı tatlıyı bırakırken görmüş. Tereddüt etmeden beni ele verdi."
 murder_outcome.2204.scheme_unknown:0 "\n\nTüm aşçılar, fırıncılar sorgulandı ama kimse bir şey bulamadı."
 murder_outcome.2205.t:0 "Gözden Düşüş"
 murder_outcome.2205.desc_opening:0 "[target.GetTitledFirstName] öldü. Ezilmiş cesedini buldular,"
 murder_outcome.2205.desc_dog:0 "hâlâ pis köpeğini tutuyordu."
 murder_outcome.2205.desc_cat:0 "hâlâ pis kedisini tutuyordu."
 murder_outcome.2205.desc_cat_alive:0 "kedi ise hiçbir yerde yoktu."
 murder_outcome.2205.desc_toy:0 "hâlâ en sevdiği oyuncağını tutuyordu."
 murder_outcome.2205.desc_nothing:0 "etrafında da şekerlemeler."
 murder_outcome.2205.desc:0 "Yüzünde sonsuz bir şaşkınlık ve korku ifadesi vardı."
 murder_outcome.2205.scheme_owner_known:0 "\n\nBiliyorum çünkü yardakçımın yakalanıp beni ele verdiğini öğrenince yüzümdeki ifade aynıydı."
 murder_outcome.2205.scheme_unknown:0 "\n\nNeyse ki herkes kazara düştüğünü zannediyor."
 murder_outcome.2301.t:0 "Karanlıkta Unutulmuş"
 murder_outcome.2301.opening_1:0 "Nihayet [target.GetTitledFirstName] öldü! Görünüşe göre [prison_owner.GetTitledFirstName] tarafından esir alındığı zindanda kimliği belirsiz kişilerce öldürülmüş. Açlıktan bitap düşmüş hâldeyken kendisini savunma gibi bir şansı da olmamış."
 murder_outcome.2301.heh:0 "\nHah."
 murder_outcome.2301.owner_is_known_1:0 "\n\nTalihsiz bir şekilde boşboğaz saray mensuplarından biri bu olaydan benim sorumlu olduğumu itiraf etmiş."
 murder_outcome.2301.no_awareness_1:0 "\n\nKatil zanlılarının [prison_owner.GetTitledFirstName] ile aynı saraydan olduklarına şüphe yok fakat bu zamana kadar çenelerini kapalı tutmayı başarmışlar. Bu sebeple kimse cinayetteki rolümden şüphelenmiyor."
 murder_outcome.2301.a.discovered:0 "Birini ölümüne terk edip, sonra gerçekten öldüğünde şaşırmış gibi yapamazsın."
 murder_outcome.2301.a:0 "Seni özgür bıraktım, [target.GetFirstNameNoTooltip]."
 murder_outcome.2302.t:0 "Davetsiz Misafir"
 murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName] öldü! Bir anda karşısında eski hizmetçisini gören [target.GetFirstNameNoTooltip], bu durum karşısında şaşırsa da, hizmetçi giysisinden hançeri çıkartınca taşlar yerine oturmuş. Çok fazla bir direniş gösterememiş."
 murder_outcome.2302.owner_is_known_1:0 "\n\nHizmetçi cinayeti işledikten sonra kaçarken kıskıvrak yakalanmış. Canı karşılığında bu cinayetin arkasında benim olduğumu itiraf etmiş."
 murder_outcome.2302.no_awareness_1:0 "\n\nHizmetçi her zaman olduğu gibi kimse en ufak bir şeyden şüphelenmeden kalabalığın arasına karışmış. Kimse cinayetteki rolüme dair en ufak bir şüpheye dahi sahip değil."
 murder_outcome.2302.a.discovered:1 "[target.GetFirstNameNoTooltip] bundan sonra kalıcı ev hapsinde."
 murder_outcome.2302.a:0 "Bir dost ziyareti kadar kolay."
 murder_outcome.2401.opening_1:0 "[target.GetTitledFirstName] fâni dünyadan göçtü, gerçi insan son zamanlarında ne kadar bu dünyadaydı diye düşünmeden edemiyor. Söylenene göre suikastçı yüzüne yastığı bastırırken karşı koymamış bile. Kumaşın altından gelen hafif bir iniltinin ardından sessizliğe gömülmüş."
 murder_outcome.2401.owner_is_known_1:0 "\n\nTalihsiz bir şekilde muhafızlar suikastçıyı fark etmiş ve çok geçmeden suikastçı cinayetteki rolümü itiraf etmiş!"
 murder_outcome.2401.no_awareness_1:0 "\n\nSuikastçı başarılı bir şekilde olay yerini terk etmeyi başarmış, cinayetteki rolüme dair kimsenin en ufak bir şüphesi dahi yok!"
 murder_outcome.2401.a.discovered:0 "Bunu cinayet olarak görmeyin, yardım olarak görün."
 murder_outcome.2401.a:0 "Huzur içinde yat, [target.GetFirstNameNoTooltip]."
 murder_outcome.4001.t:0 "Suikastçı!"
 murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName] zarar görmeden kaçtı!"
 murder_outcome.4001.failure_declaration_2:0 "[target.GetTitledFirstName] hedefli cinayet teşebbüsüm başarısız oldu!"
 murder_outcome.4001.failure_declaration_3:0 "Görünen o ki [target.GetTitledFirstName], bir kez daha [ROOT.Char.GetFaith.HighGodNamePossessive] adaletinden kurtulmayı başardı."
 murder_outcome.4001.desc:0 "Suikastçı [target.Custom('ResidenceBuilding')] binasına girmeyi başarsa da, hedefin odasına sızmayı başaramadı."
 murder_outcome.4001.exposed_scheme:0 "Beceriksiz [Select_CString(dummy_assassin_gender.IsFemale, 'kadının', 'adamın' )] yakalandığı yetmemiş, ölmek üzereyken adımı vermiş!"
 murder_outcome.4001.not_exposed_scheme:0 "Tespit edildiğini fark eden suikastçı, görevini yerine getiremeden kaçmak zorunda kalmış.\n\n[target.GetTitledFirstName] artık güvenliğine iki kat önem veriyor."
 murder_outcome.4001.a.discovered:0 "Onu oraya #EMP gerçek#! suikastçıyı korkutması için göndermiştim! Başarmış!"
 murder_outcome.4001.a:0 "Yaptıklarının bedelini bir gün ödeyeceksin [target.GetFirstNameNoTooltip]!"
 murder_outcome.4001.b:0 "İlk seferde başaramazsan tekrar dene demişler..."
 murder_outcome.4002.desc:1 "\n\nAdamlarım hedefin muhafızlarını alt etmekte başarısız oldu."
 murder_outcome.4002.exposed_scheme:0 "Daha da kötüsü aralarından bazıları yakalanıp, saldırıyı düzenlemeleri için onlara ödeme yaptığımı itiraf etti."
 murder_outcome.4002.not_exposed_scheme:0 "En azından birçoğu ismimi vermeden hayatını kaybetti. Herkes bu işin rastgele haydutlar tarafından gerçekleştirildiğini zannediyor."
 murder_outcome.4002.a:0 "Kahrolası çapulcular bir işi bile düzgün şekilde yapamıyorlar..."
 murder_outcome.4002.a.less_arrogant:0 "Bu kadar basit bir işi nasıl yapamıyorlar..."
 murder_outcome.4002.a.discovered:0 "Tipik haydutlar. Kurtulmak için söylemeyecekleri şey yok."
 murder_outcome.4003.desc:0 "\n\nZehir görevini yerine getirmedi. [target.GetTitleTierName] bir haftalığına yatalak kaldıktan sonra zehrin tüm etkilerini atlatmış gibi gözüküyor."
 murder_outcome.4003.exposed_scheme:0 "Tüm bunlar yetmezmiş gibi, zehri hazırlayan beceriksiz şifacı her şeyi teker teker anlatmış! [target.GetFirstNameNoTooltip] bu işin arkasında benim olduğumu biliyor."
 murder_outcome.4003.not_exposed_scheme:0 "Neyse ki bu durumun sıradan ve basit bir hastalık olduğunu kanaatine varılmış. [target.GetFirstNameNoTooltip] neyi atlattığına dair en ufak bir fikir sahibi bile değil."
 murder_outcome.4003.a:0 "Bir sonraki sefere zehri kaşıklarla dolduracağım!"
 murder_outcome.4003.a.discovered:0 "Ne olmuş [target.GetFirstNameNoTooltip] ördeği beğenmemiş mi?"
 murder_outcome.4004.failure_declaration_1:0 "[target.GetTitledFirstName] [SCOPE.Custom('VenomousCreature')]n saldırısını atlatmayı başarmış!"
 murder_outcome.4004.failed_attempt_1:0 "[SCOPE.Custom('VenomousCreatureType')|U]n saldırısı ilk başlarda etkili olsa da, hızlıca odaya çağrılan saray hekimi zehrin vücutta yayılmasını başarıyla engellemiş."
 murder_outcome.4004.scheme_owner_known:0 "\n\nTalihsiz bir şekilde [SCOPE.Custom('VenomousCreatureType')] yerleştiren hizmetçi kıskıvrak yakalandıktan sonra her şeyi teker teker anlatmış!"
 murder_outcome.4004.scheme_known:1 "\n\nYatakta [SCOPE.Custom('VenomousCreature')]n bulunması her gün rastlanan bir olay değil, buna karşın olayda benim parmağım olduğuna dair en ufak bir fikirleri bile yok."
 murder_outcome.4004.scheme_unknown:0 "\n\nEn azından bu saldırıda suçu bana değil, tamamen [SCOPE.Custom('VenomousCreatureType')]n üstüne atmışlar gibi gözüküyor."
 murder_outcome.4004.a:0 "Şansla bir yere kadar hayatta kalabilirsin, [target.GetFirstNameNoTooltip]!"
 murder_outcome.4005.failure_declaration_1:0 "[target.GetTitledFirstName] nasıl olduysa köylü sürüsünün saldırısından kurtulmayı başarmış!"
 murder_outcome.4005.failed_attempt_1:0 "\n\nAzmettiricilerim planlandığı üzere köylüleri dolduruşa getirse de, linç girişimi başlar başlamaz muhafızlar devreye girmiş. [target.GetTitleTierName] hiçbir şey olmamış gibi [target.Custom('ResidenceBuilding')] binasına doğru yol alırken, köylülerden hayatta kalanlar korku içerisinde kaçışıyordu."
 murder_outcome.4005.scheme_owner_known:0 "\n\nÇok sayıda köylü asılmış, azmettiricilerim ise olaydaki rolümü itiraf etmiş!"
 murder_outcome.4005.scheme_known:0 "\n\nÇok sayıda köylü asılmış, azmettiriciler ise dışarıdan bir mihrakın rolünü itiraf etmiş. Neyse ki bu mihrakın tam olarak ben olduğumu kimse bilmiyor."
 murder_outcome.4005.scheme_unknown:0 "\n\nÇok sayıda köylü, beraberlerinde azmettiricilerimle birlikte olaydaki rolüm açığa çıkmadan asılarak idam edilmiş."
 murder_outcome.4005.a:0 "Neden bizim yöneten, onların ise yönetilen olduğunun güzel bir örneği."
 murder_outcome.4005.a.discovered:0 "Yanlış kararlar vermek bu çapulcuların hayat biçimi."
 murder_outcome.4006.desc:0 "[target.GetTitledFirstName] beni mahzene takip ederken mutluydu. Hem heyecan hem şarap sarhoşu.\n\nBirkaç kadeh "kaliteli" şaraptan sonra uyuyakaldı ama duvarı örmeye bitirmeden hizmetkârlardan biri içeri girdi.\n\n"

 murder_outcome.4006.scheme_owner_known:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Peki [target.GetTitledFirstNameNoTooltip]? Ve [target.GetHerHim]i içeri kapatan yarım kalmış bir duvar... Ah, hayır.""

 murder_outcome.4006.scheme_unkown:0 ""Ah, görünüşe göre [target.GetTitledFirstNameNoTooltip] projenizin ortasında uyuyakalmış. [target.GetHerHim]i bir yatak odasına götürmesine yardım edebilir miyiz, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 murder_outcome.4006.a.discovered:0 "Kileri yeniliyordum sadece. Eski hâlini pek sevmedim."
 murder_outcome.4006.a:0 "...Tabii, teşekkürler."
 murder_outcome.4007.opening:0 "Yardakçımım alevli oku gökyüzünde bir çizgi çizdi ve kayığı ucu ucuna kaçırdı.\n\nAlev soğuk sularda sönerken kayıktakiler önce anlamsızca oka bakakaldılar. Birkaç saniye sonra da curcuna çıktı.\n\n"
 murder_outcome.4007.scheme_owner_known:0 "Daha da kötüsü okçuyu yakaladılar ve tereddüt etmeden beni ele verdi."
 murder_outcome.4007.scheme_unkown:0 "Neyse ki okçu kaçmayı başardı, kimse benden şüphelenmiyor."
 murder_outcome.4007.a.discovered:0 "Yüzmeyi öğrenmek istiyordu hep, yardımcı olmak istedim."
 murder_outcome.4007.a:0 "Yavaş yavaş giden bir kayığı vurmak ne kadar zor olabilir ki?!"
 murder_outcome.4008.desc:0 "[target.GetTitledFirstName] suikast girişimimden kurtulmayı başarmış!\n\nGörünüşe göre saray hizmetkârlarından birisi, onun için hazırlanan zehirli içkiden gizlice bir yudum almak istemiş, hizmetkârın olay yerinde hayatını kaybetmesi tüm planın açığa çıkmasına sebep olmuş."
 murder_outcome.4008.scheme_owner_known:0 "Tüm bunlar yetmezmiş gibi başka bir hizmetkâr bu girişimin ardında benim olduğumu söylemiş!"
 murder_outcome.4008.scheme_unkown:0 "Neyse ki hiçbir hizmetkâr olaydaki dahiliyetimi açığa çıkartmamış."
 murder_outcome.4008.a.discovered:0 "Bu ne cüret!"
 murder_outcome.4008.a:0 "Bir sonraki sefere hizmetkârları yoluma çıkmamayı öğrenecektir!"
 murder_outcome.4201.t:0 "Evin Yolu"
 murder_outcome.4201.opening:0 "\n\n[assassin.GetTitledFirstName] kurbanını ormanlığın içinde kaderine bıraktıktan sonra saraya geri döndü.\n\nSaraya girdiğinde #EMP hüzünlü#! bir ifadeyle çocuğun ormanda kaybolduğuna dair haberleri vermeye hazırlanıyordu - ta ki ana salonda [target.GetFirstName] ile karşılaşana dek!\n"Gel [assassin.GetFirstName], biraz daha oynayalım!""
 murder_outcome.4201.scheme_owner_known:0 "[assassin.GetFirstNameNoTooltip] yapılan sorgulama sonrasında her şeyi teker teker anlattı!"
 murder_outcome.4201.scheme_unknown:0 "[assassin.GetFirstNameNoTooltip] artık yakın bir şekilde takip ediliyor."
 murder_outcome.4201.a.discovered:0 "Cinayet teşebbüsünden ziyade #EMP merhamet#! teşebbüsü bu."
 murder_outcome.4201.a:0 "Sırta saplanan bir bıçak işi görürdü."
 murder_outcome.4202.opening:0 "[target.GetTitledFirstName] hâlâ hayatta! Görünen o ki bakıcı, eline fırsat geçmesine rağmen küçük bir çocuğa zarar vermeye kendini ikna edememiş."
 murder_outcome.4202.scheme_owner_known:0 "\n\nTüm bunlar yetmezmiş gibi vicdan azabına kapılıp her şeyi teker teker anlatmış!"
 murder_outcome.4202.scheme_known:0 "\n\nTüm bunlar yetmezmiş gibi vicdan azabına kapılıp her şeyi teker teker anlatmış! Neyse ki plandaki rolüm bir sır olarak kalmaya devam ediyor."
 murder_outcome.4202.scheme_unkown:0 "\n\nNeyse ki planımız hakkında sessiz kalmayı tercih etmiş. Belki de en iyisi bu..."
 murder_outcome.4202.a:0 "Dikkatli olmalıyım."
 murder_outcome.4203.opening:0 "[target.GetTitledFirstName] hâlâ hayatta! Görünen o ki [SCOPE.Custom('VenomousCreatureType')]n zehri yeterli olmamış, sadece bebeğin cildinde kızarıklıklara sebep olmuş.\n\n"
 murder_outcome.4203.scheme_owner_known:0 "Tüm bunlar yetmezmiş gibi omurgasız yardakçım yakalanıp her şeyi teker teker anlatmış! Bu teşebbüsün arkasında benim olduğum herkes tarafından biliniyor!"
 murder_outcome.4203.scheme_unkown:0 "Yardakçımın tespit edilmeden odadan ayrılmayı başarması bir teselli unsuru."
 murder_outcome.4204.desc_opening:0 "[target.GetTitledFirstName] hâlâ hayatta! Tatlıyı eline alır almaz sokak köpeklerinden biri elinden kapıp sokak arasında kaybolmuş.\n\n"
 murder_outcome.4204.scheme_unkown:0 "En azından kimse içinde ne olduğunu bilmeyecek..."
 murder_outcome.4204.a:0 "Bu bir işaret miydi?"
 murder_outcome.4205.desc_opening:0 "[target.GetTitledFirstName] hâlâ hayatta! Yardakçım onu surun üzerinden ittiğinde çocuğunun kıyafeti bir şeye takılmış. Çocuk da yardım gelene kadar öylece asılı kalmış."
 murder_outcome.4205.desc_dog:0 "Köpeğiyle birlikte kurtarmışlar..."
 murder_outcome.4205.desc_cat:0 "Kediyisiyle birlikte kurtarmışlar..."
 murder_outcome.4205.desc_toy:0 "Oyuncağıyla birlikte kurtarmışlar..."
 murder_outcome.4205.desc_nothing:0 "Şekerleme sepetiyle birlikte kurtarmışlar..."
 murder_outcome.4205.scheme_unkown:0 "En azından yardakçım yakalanmadı, çocuk da korkudan hiçbir şey hatırlamıyormuş."
 murder_outcome.4302.t:0 "Davetsiz Misafir"
 murder_outcome.4302.failure_declaration_1:0 "[target.GetTitledFirstName] hâlâ hayatta!"
 murder_outcome.4302.failed_lack_of_planning:0 "Belki de bunu daha iyi planlamalıydım. "Eski dostu" odaya girer girmez muhafızları çağırıp hizmetçiyi yakalatmış. Acaba daha önceden uyarıldı mı?"
 murder_outcome.4302.failed_attempt_1:0 "Anlaşılan "eski dostu" o kadar da becerikli birisi değilmiş, hançeri çıkarttığı gibi [target.GetFirstName] muhafızlara seslenmiş."
 murder_outcome.4302.disastrous_attempt_1:0 "\n\nTalihsiz bir şekilde hizmetçi canını kurtarmak adına olaydaki rolümü açığa çıkartmakta sakınca görmemiş."
 murder_outcome.4302.something_is_known:0 "\n\nEn azından olaydaki rolüm açığa çıkmadı."
 murder_outcome.4302.unknown_so_far:0 "\n\nHizmetçi kaçmayı başarsa da kaçarken denk geldiği ziynet eşyalarını da götürmesi, insanların bunun bir suikast değil de hırsızlık girişimi olduğu kanaatine varmasını sağladı."
 murder_outcome.4302.a:0 "Senin de vaktin gelecek, [target.GetFirstNameNoTooltip]..."
 murder_outcome.4301.t:0 "Karanlıkta Unutulmuş"
 murder_outcome.4301.failure_declaration_1:0 "Görünen o ki [target.GetTitledFirstName] hedefli cinayet teşebbüsüm başarısızlıkla sonuçlanmış!"
 murder_outcome.4301.failed_lack_of_planning:0 "Belki de daha iyi bir plan yapmalıydım. Sözde suikastçılar, aşırı hevesli gardiyanı gördükleri gibi kaçmaya başlamışlar ve işi yarım bırakmışlar."
 murder_outcome.4301.failed_attempt_1:0 "Sözde suikastçılarım hedefi eşek sudan gelinceye kadar dövse de [Select_CString(target.IsFemale, 'kadın', 'adam' )] hayata tutunmayı başarmış."
 murder_outcome.4301.something_is_known:0 "\n\nEylemin amacı aşikâr olsa da olaydaki rolüm henüz açığa çıkmış değil."
 murder_outcome.4301.unknown_so_far:0 "\n\nNeyse ki tüm bu curcuna mahkûmlar arasında bir kavgadan ibaret zannedilmiş. Kimse olayda bir parmağım olduğundan şüphelenmiyor."
 murder_outcome.4301.disastrous_lack_of_planning:0 "\n\nBelki de biraz daha sabırlı olmalıydım, sözde suikastçılar aşırı hevesli gardiyan tarafından engellenmekle kalmamışlar, aynı zamanda olayın sorumlusu olarak benim adımı vermişler!"
 murder_outcome.4301.disastrous_attempt_1:0 "\n\nSözde suikastçılar aşırı hevesli gardiyan tarafından engellenmekle kalmamışlar, aynı zamanda olayın sorumlusu olarak benim adımı vermişler!"
 murder_outcome.4301.a.discovered:0 "Bu kafeste çürümesi daha mı iyi?"
 murder_outcome.4301.a:0 "Kahretsin!"
 murder_outcome.4401.failure_declaration_1:0 "Nasıl olmuşsa [target.GetTitledFirstName] #EMP bir şekilde#! hâlâ hayatta!"
 murder_outcome.4401.failed_attempt_1:0 "Suikastçı planlandığı üzere [Select_CString(target.IsFemale, 'kadının', 'adamın' )] odasına girmiş fakat yastığı yüzüne ne kadar bastırırsa bastırsın [Select_CString(target.IsFemale, 'kadın', 'adam' )] bir türlü ölmek bilmemiş."
 murder_outcome.4401.disastrous_attempt_1:0 "\n\nÇok geçmeden muhafızlar olay yerine teşkil etmiş. Hain suikastçı planı itiraf etmekle kalmamış, aynı zamanda benim adımı da vermiş!"
 murder_outcome.4401.something_is_known:0 "\n\nÇok geçmeden muhafızlar olay yerine teşkil etse de, suikastçı kolaylıkla kaçmayı başarmış. Görünen o ki kimse olaydaki rolümden şüphelenmiyor."
 murder_outcome.4401.unknown_so_far:0 "\n\nMuhafızlar olay yerine teşkil ettiğinde suikastçı fark edilmeden kaçmayı başarmış. Kimse onun odada olduğunu dahi bilmiyor."
 murder_outcome.4302.a.discovered:0 "Ah, ölüm gününü karıştırmışım."
 murder_outcome.4401.a:0 "Senin de zamanın gelecek, [target.GetFirstNameNoTooltip]."
 murder_outcome.5001.t:0 "Dünyevi Yaşamın Sonu"
 murder_outcome.5001.poisoned_duck:0 "Ziyafette taze pişmiş ördeğin tadını çıkarırken bir anda boğazım uyuşuyor, kollarımı hareket ettiremiyorum. Neyin yaklaştığının farkındayım fakat bunu önlemek için yapabileceğim hiçbir şey yok.\n\nÇok geçmeden gözlerim kararıyor, uzaktan gelen gülüşme sesleri yerini çığlıklara bırakıyor ve her şey elimden kayıp gidiyor."
 murder_outcome.5001.gang_of_thugs:0 "Adamlarımla beraber karanlık bir ormana girdiğimiz gibi haydutların saldırısına uğruyoruz. Kısa süre içerisinde haydutların altınlarımızın değil, canımızın peşinde olduğu anlaşılıyor. Muhafızlarım cesurca çarpışsa da, eşkıyalar tarafından gafil avlanıyorlar.\n\nTüm gücümle koşuyorum, tam güvendeyim derken okun yaydan çıkma sesini duyuyorum."
 murder_outcome.5001.hired_assassin:0 "Gecenin bir yarısı uyandığımda odamda karanlık bir figür görüyorum. Muhafızlarıma ne olduğuna dair en ufak bir fikrim bile yok fakat ay ışığı figürün elindeki bıçağı aydınlattığında benim için çok geç olduğunu anlıyorum.\n\nBilenmiş bıçak etimi parçalarken neredeyse hiç ses çıkartmıyor, acı içerisinde kıvranırken çığlıklarımın duyulabilir olup olmadığını dahi anlayamıyorum."
 murder_outcome.5001.creepy_crawly_intro:0 "Bacağıma bir şeyin dokunduğunu fark etmemle birlikte üzerimdeki yorganı atıyorum, bu ani hareketim yataktaki misafirimi daha da kışkırtmış gibi gözüküyor."
 murder_outcome.5001.creepy_crawly_known:0 "Cılız ay ışığında dahi bir [ROOT.Char.Custom('VenomousCreature')] görebiliyorum. Bu yaratığın yatağımda ne işi var?"
 murder_outcome.5001.creepy_crawly_unknown:0 "Tehdit altında olduğunu hisseden [ROOT.Char.Custom('VenomousCreatureType')|U], onu yataktan atmaya çalışsam da hızlıca hareket edip saldırıyor."
 murder_outcome.5001.creepy_crawly_end:0 "[SCOPE.Custom('VenomousCreatureAttack')|U] öyle hafifçe sokuyor ki ilk başta neredeyse hissetmiyorum. Ancak yakıcı bir acının tüm vücudumu kaplaması uzun sürmüyor. Yardım çağırmaya çalışıyorum fakat uzuvlarım uyuşurken ve bilincim kaybolurken sesim çok zayıf çıkıyor."
 murder_outcome.5001.riled_up_mob:0 "[ROOT.Char.GetCurrentLocation.GetName] sokaklarında ilerlerken bir anda bağırışlar içerisinde bir grup köylü etrafımızı sarıyor. Ne olduğunu anlayamadan köylüler beni atımdan indirip tekmelemeye başlıyorlar. Muhafızlarımın çığlıklarını duyuyorum ama onlar bana ulaşamadan ölümün soğuk nefesi bana ulaşıyor."
 murder_outcome.5001.bricked:0 "Dün bazı kutlamalara katıldım ve hem neşe hem de şarap sarhoşluğuyla keyifli bir akşam geçirdim.\n\nSabah olduğunda akşamdan kalma bir hâlde, nerede olduğumu ve buraya nasıl geldiğimi hatırlamadan uyandığımda, kendimi bir mahzende buluyorum! Üstelik yeni örülmüş bir duvar tek çıkışı kapatıyor gibi gözüküyor. Kalın duvarlaryardım çağrılarımın dışarı çıkmasına izin vermiyor. Umudum sayamadığım her saatle birlikte daha da azalıyor. Yavaş yavaş artan bir güçsüzlük hissi bastırıyor... #EMP Biraz kestirsem iyi olur...#!"

 murder_outcome.5001.sunken_boat:0 "Bir gemide akşam esintisinin keyfini çıkarırken gökyüzünde alevli bir ok beliriyor. Bize doğru geliyor.\n\nKayığa vurduğunda kayığın üzerindekilerle birbirimzie bakakalıyoruz. Sonra kayık alev alıyor. Kendimi denizin soğuk sularına atıyorum ama yüzemiyorum. Ağırlaşan kıyafetlerim beni karanlığa çekiyor. Bir şeylere tutunmaya çalışıyorum ama etrafımda kimse yok. #EMP Nefes almaya çalışıyorum ama#!..."

 murder_outcome.5001.sunken_boat_travel:0 "Açık denizde gemideyken aniden gökyüzünde bize doğru gelen bir alevli ok beliriyor.\n\nGemiye isabet eder etmez her yeri alevler kaplıyor, ben de kendimi soğuk sulara atıyorum. Ağır kıyafetlerim beni karanlığa doğru çekerken yüzmeye, bir şeylere tutunmaya, nefes almaya çalışıyorum..."
 murder_outcome.5001.poisoned_drink_alcohol:0 "Elimde bir şişe [ROOT.Char.Custom('RegionalAlcoholicDrink')] ile akşamın tadını çıkarırken, bir anda boğazımda tuhaf bir duygu hissetmeye başlıyorum."
 murder_outcome.5001.poisoned_drink_no_alcohol:0 "Elimde bir şişe [ROOT.Char.Custom('RegionalDrink')] ile akşamın tadını çıkarırken, bir anda boğazımda tuhaf bir duygu hissetmeye başlıyorum."
 murder_outcome.5001.poisoned_drink:0 "Çok geçmeden nefes alabilmek, bağırabilmek, kanlar içerisinde tıkanan boğazımdan biraz olsun hava geçmesini sağlayabilmek için ellerimle boğazımı #EMP yırtmaya#! çalışıyorum. Bilincimi kaybetmek üzere yere yığıldığımda tırnaklarımdaki kan izi ve deri parçaları dikkatimi çekiyor... Bunları temizlemek zor olacak diye düşünürken..."
 murder_outcome.5001.assassin:0 "[assassin.GetFirstName] birlikte oyun oynamamız için beni ormana götürdü ve çok eğlendik. Fakat saklambaç oynarken çok uzun bir süre önce saklanmaya gitti, onu hiçbir yerde bulamıyorum. Hava gittikçe karanlıklaşmaya ve korkunçlaşmaya başlıyor..."
 murder_outcome.5001.courtier:0 "Birkaç saray mensubu birlikte oyun oynamamız için beni ormana götürdü ve çok eğlendik. Fakat saklambaç oynarken çok uzun bir süre önce saklanmaya gittiler, onları hiçbir yerde bulamıyorum. Hava gittikçe karanlıklaşmaya ve korkunçlaşmaya başlıyor..."
 murder_outcome.5001.lured_into_forest:0 "\n\nEve dönmeye çalışıyorum fakat tüm ağaçlar aynı gözüküyor. Bir süre sonra canavarların beni takip ettiğini duyabiliyorum. Koşmaya başlıyorum ama çok hızlılar. Çok büyük ve güçlü gözüküyorlar... Gözlerimi kapatıp anne diye ağlamaya başlıyorum."
 murder_outcome.5001.stab_infant:0 "Işıklar süzülüyor. Tanıdık yüzler, yabancı yüzler. Aşina olduğum sesler, ilk defa duyduğum sesler. Sert, soğuk bir ses kulaklarımı acıtıyor. Ağlamaya başlıyorum.\n\nBirisinin kafamı tuttuğunu hissediyorum. Sonrasında acı. Sonrasında ise hiçlik."
 murder_outcome.5001.infant_creepy_crawly:0 "İstediğim tek şey altımda yumuşacık bir yatak ve üstümde sıcacık bir yorgan. Uykuya dalmak üzereyken bir şey hissediyorum. Sanki bir şey vücudumun üstünde ilerliyor. Bir anda kolum acıyor ve ağlamaya başlıyorum.\n\nAcı dinmemekle kalmıyor, bir anda tüm vücuduma yayılıyor. #EMP Dayanamıyorum.#! Hiçbir şey kalmayıncaya kadar, acı diğer tüm hislerimi bastırıyor."
 murder_outcome.5001.poisoned_candy:0 "Kendi hâlimde oynarken biraz acıkmaya başlıyorum. Birdenbire bir hizmetkâr dünyanın en iyi hediyesiyle karşımda beliriyor. Ağzımı sulandıran, salyalarımı akıtan bir [ROOT.Char.Custom('FavoriteTreat')].\n\nBirkaç lokma sonra dünya dönmeye başlıyor, acıyla karnımı tutuyorum. #EMP Nefes alamıyorum#!! Elimde [ROOT.Char.Custom('FavoriteTreat')] ile yere yuvarlanıyorum."
 murder_outcome.5001.child_pushed_dog:0 "Kendi hâlimde oynarken uzaklardan bir ses duyuyorum. [ROOT.Char.Custom('DogStoryName')]! Çaresizce havlayıp ağlıyor. Gökyüzüne baktığımda surlardan bir halatla asıldığını görüyorum, koşa koşa yanına gidiyorum.\n\nHalatı çözmek için eğilirken dünya tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve–"
 murder_outcome.5001.child_pushed_cat:0 "Kendi hâlimde oynarken uzaklardan bir ses duyuyorum. [ROOT.Char.Custom('CatStoryName')]! Çaresizce miyavlayıp ağlıyor. Gökyüzüne baktığımda surlardan bir halatla asıldığını görüyorum, koşa koşa yanına gidiyorum.\n\nHalatı çözmek için eğilirken dünya tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve–"
 murder_outcome.5001.child_pushed_toy:0 "Kendi hâlimde oynarken gözümün ucundan bir şey görüyorum. En sevdiğim [target.Custom('child_favorite_toy')] surlardan bir halatla asılmış. Koşa koşa gidiyorum ama onu kurtarmak için eğilirken dünyam tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve–"
 murder_outcome.5001.child_pushed:0 "Kendi hâlimde oynarken gözümün ucundan bir şey görüyorum. Yerde merdivenlere doğru giden şekerlemeler. Dökülen şekerlemeleri takip edip merdivenlerinin sonuna ulaştığımda bir halatla surlardan aşağıya asılmış sepeti görüyorum. Ağzına kadar şekerle dolu! Almak için eğilirken birden dünya tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve–"
 murder_outcome.5001.beat_to_death_in_dungeon:0 "Hücremin kapısı açıldığında bir an için serbest bırakılacağımı zannediyorum. İçeri giren bir grup karanlık figürün ardından beni neyin beklediğini anlıyorum.\n\nAcımasızca dövülüyorum. Güçten düşmüş bedenim hiçbir direnç gösteremiyor. Yerde yatıp hayatımın içimden kayıp gittiğini hissederken, kanımın yerdeki su birikintisiyle karışmasını izliyorum."
 murder_outcome.5001.unwelcome_guest_house_arrest:0 "Odamda bekleyen [Select_CString(dummy_gender.IsFemale, 'kadını', 'adamı' )] gözüm bir yerden ısırıyor ama kim olduğunu çıkarmakta güçlük çekiyorum. Kaçmamam için kapıda dikilen muhafızları eski bir dostum olduğuna ikna etmiş gibi gözüküyor.\n\nSakladığı hançeri çıkarttığında"
 murder_outcome.5001.unwelcome_guest_house_arrest.target_court:0 "[target_home.GetNameNoTier] sarayında"
 murder_outcome.5001.unwelcome_guest_house_arrest.no_court:0 "[target.GetFirstNamePossessiveNoTooltip] sarayında"
 murder_outcome.5001.unwelcome_guest_house_arrest.end:0 "çalışan bir hizmetçi olduğunu fark ediyorum. Öyle hızlı bir hamle yapıyor ki, reaksiyon dahi veremiyorum."
 murder_outcome.5001.strangle_incapable:0 "Dünya dönmeye devam ediyor mu? Zamanın geçip geçmediğini anlayamıyorum. Göğsümdeki şey bir acı mı? Yoksa boğazımda mı? Bu vücut benim vücudum mu? Zihnimin gri bulutlarına çöken şey gece mi? Odaklanmak ne kadar da zor.\n\nÇok... zor..."
 murder_outcome.5001.schemer_known:0 "\n\nBana bunu kimin yaptığından en ufak bir şüphem yok. [owner.GetTitledFirstName]!"
 murder_outcome.5001.avenge_me:0 "Vârislerim, intikamımı alın!"
 murder_outcome.5001.not_my_time:0 "Önümde dolu dolu bir hayat vardı."
 murder_outcome.5001.option_incapable:0 "Nihayet, ölüm."
 murder_outcome.5002.t:0 "Cinayet Teşebbüsü!"
 murder_outcome.5002.poisoned_duck:0 "Hayatımda gördüğüm en dolgun ördekten bir lokma almak üzereyken hizmetçilerimden birisi yere yığılıyor. Salak benim yemeğimin tadına bakmış!\n\nSuçunun bedelini öderken, en azından ördeğe dokunmamak gerektiğini göstermiş oldu."
 murder_outcome.5002.gang_of_thugs:0 "Adamlarımla beraber karanlık bir ormana girdiğimiz gibi haydutların saldırısına uğruyoruz. Kısa süre içerisinde haydutların altınlarımızın değil, canımızın peşinde olduğu anlaşılıyor. Muhafızlarım yiğitçe çarpışsa da, eşkıyalar açıkça beni hedefliyor!\n\nİşin sonunda muhafızlarım bu sinsi saldırıya karşı koymayı başarıyor. Bu hain pusu az daha canıma mal oluyordu."
 murder_outcome.5002.hired_assassin:0 "Oturaktan çıkan ses bir anda uyanmama sebep oluyor. Karşımda karanlık bir figür gördüğüm gibi muhafızlara sesleniyorum. Kısa bir mücadeleden sonra odaya giren muhafızlar saldırganı etkisiz hâle getiriyor."
 murder_outcome.5002.creepy_crawly_end:0 "[SCOPE.Custom('VenomousCreatureType')|U]n güçlü zehiri vücudumda yayılırken, vakit kaybetmeden saray hekimini çağırıyorum. Acılar içerisinde geçen bir gecenin ardından güneşin doğmasıyla birlikte zehrin kıskacından kurtuluyorum."
 murder_outcome.5002.riled_up_mob:0 "[home_province.GetNameNoTier] sokaklarında ilerlerken bir anda bağırışlar içerisinde bir grup köylü etrafımızı sarıyor. Neyse ki muhafızlarım gözlerinin yaşına bakmadan bu çapulcuların icabına bakıyor, herhangi bir zarar görmeden [ROOT.Char.Custom('ResidenceBuilding')] binasına varıyorum."
 murder_outcome.5002.bricked:0 "Dün [home_province.GetName] topraklarında düzenlenen kutlamada eğlenirken hem mutluluk hem de şarap sarhoşuydum.\n\nSabah olduğunda akşamdan kalma bir hâlde, nerede olduğumu ve buraya nasıl geldiğimi hatırlamadan uyandığımda, kendimi bir mahzende buluyorum! Üstelik yeni örülmüş bir duvar #EMP neredeyse#! tek çıkışı kapatıyor gibi gözüküyor. Biri beni buraya canlı canlı gömmek istedi!"

 murder_outcome.5002.sunken_boat:0 "[province.GetNameNoTier] limanında bir kayık ile açıklarda demirlemiş gemiye giderken gökyüzünde alevli bir ok beliriyor. Bize doğru geliyor.\n\nGemiyi ucu ucuna kaçırıyor, suların içinde sönmesini izlemek için eğiliyorum. Eğildiğimde kayığın kokusu daha iyi geliyor. Rum ateşi! Biri beni öldürmek istedi!"
 murder_outcome.5002.poisoned_drink:0 "Akşam yemeği esnasında hizmetkârlardan birisi odaya dalıp, elimdeki kadehi yere fırlatıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], zehir! Affedin ama, bulaşıkçılardan birisi size gelmeden evvel bardağınızdan bir yudum almış ve... ve ölmüş!""
 murder_outcome.5002.lured_into_forest:0 "[assassin.GetFirstName] birlikte oynamamız için beni ormana götürdü ama saklandıktan sonra bir daha hiç gözükmedi!\n\nAğlayıp dalların arasından yürümeye çalışırken boğazım ağrıyana kadar yardım için bağırıyorum. Birdenbire ormandan çıkan yolu bulup sağ salim eve varıyorum."
 murder_outcome.5002.stab_infant:0 "Işıklar süzülüyor. Tanıdık yüzler, yabancı yüzler. Aşina olduğum sesler, ilk defa duyduğum sesler. Sert, soğuk bir ses kulaklarımı acıtıyor. Ağlamaya başlıyorum.\n\nArdından bir kadının hıçkırıklar içerisinde ağlamasını duyuyorum, yetişkin bir kadın. Panik dolu bağrışmalar geliyor. Ardından yalnız bırakılıyorum."
 murder_outcome.5002.infant_creepy_crawly:0 "Altımda yumuşacık bir örtü, üstümde sıcacık bir yorgan. Uykuya dalmak üzereyken bir şey hissediyorum. Sanki bir şey vücudumun üstünde ilerliyor. Bir anda kolum acıyor ve ağlamaya başlıyorum.\n\nÖnce bir adamın sesini duyuyorum, seslerin sayısı arttıkça harareti de artıyor. Seslerin uzaklaşmasıyla birlikte kolumdaki acı da diniyor ve uykuya dalıyorum."
 murder_outcome.5002.poisoned_candy:0 "Kendi hâlimde oynarken karşımdaki masanın üzerinde bir şey beliriyor. Ağzımı sulandıran, salyalarımı akıtan bir [ROOT.Char.Custom('FavoriteTreat')]. Kimse bana bakmıyor, biraz yesem kimse bir şey demez...\n\nTam ısıracakken kirli bir sokak köpeği atlayıp elimden alıyor. Tek bir lokmada yutuyor, kaçmaya çalışıyor ama yere devriliyor. Ölmüş."
 murder_outcome.5002.child_pushed_dog:0 "Kendi hâlimde oynarken uzaklardan bir ses duyuyorum. [ROOT.Char.Custom('DogStoryName')]! Çaresizce havlayıp ağlıyor. Gökyüzüne baktığımda surlardan bir halatla asıldığını görüyorum, koşa koşa yanına gidiyorum.\n\nHalatı çözmek için eğilirken dünya tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve... Bir şey olmuyor. Gözlerimi açtığımda duvardaki bir şeyin üzerimdeki [ROOT.Char.Custom('GetUpperClothingArticle')] yakaladığını görüyorum. Kurtuldum."
 murder_outcome.5002.child_pushed_cat:0 "Kendi hâlimde oynarken uzaklardan bir ses duyuyorum. [ROOT.Char.Custom('CatStoryName')]! Çaresizce miyavlayıp ağlıyor. Gökyüzüne baktığımda surlardan bir halatla asıldığını görüyorum, koşa koşa yanına gidiyorum.\n\nHalatı çözmek için eğilirken dünya tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve... Bir şey olmuyor. Gözlerimi açtığımda duvardaki bir şeyin üzerimdeki [ROOT.Char.Custom('GetUpperClothingArticle')] yakaladığını görüyorum. Kurtuldum."
 murder_outcome.5002.child_pushed_toy:0 "Kendi hâlimde oynarken gözümün ucundan bir şey görüyorum. En sevdiğim [target.Custom('child_favorite_toy')] surlardan bir halatla asılmış. Koşa koşa gidiyorum ama onu kurtarmak için eğilirken dünyam tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve... Bir şey olmuyor. Gözlerimi açtığımda duvardaki bir şeyin üzerimdeki [ROOT.Char.Custom('GetUpperClothingArticle')] yakaladığını görüyorum. Kurtuldum."
 murder_outcome.5002.child_pushed:0 "Kendi hâlimde oynarken gözümün ucundan bir şey görüyorum. Yerde merdivenlere doğru giden şekerlemeler. Dökülen şekerlemeleri takip edip merdivenlerinin sonuna ulaştığımda bir halatla surlardan aşağıya asılmış sepeti görüyorum. İçi ağzına kadar şekerleme dolu! Almak için eğilir eğilmez dünya tersine dönüyor. Düşüyorum. Yeryüzü yaklaşırken gözlerimi kapatıyorum ve... Bir şey olmuyor. Gözlerimi açtığımda duvardaki bir şeyin üzerimdeki [ROOT.Char.Custom('GetUpperClothingArticle')] yakaladığını görüyorum. Kurtuldum."
 murder_outcome.5002.beat_to_death_in_dungeon:0 "Hücremin kapısı açıldığında bir an için serbest bırakılacağımı zannediyorum. İçeri giren bir grup karanlık figürün ardından beni neyin beklediğini anlıyorum.\n\nAcımasızca dövülsem de, gardiyanın şans eseri bir biçimde hücrenin önünden geçmesi hayatımı kurtarıyor."
 murder_outcome.5002.unwelcome_guest_house_arrest:0 "Güya eski bir dost odamda bekliyormuş, bu yüzden odamda yüzü kapalı bir figürle karşılaştığımda oldukça şaşırdım - hiç de dosthane durmuyordu.\n\nBu nedenle, bir hançerin çekildiğini görür görmez kapıya koşmaya ve muhafızlara bağırmaya hazırdım. Odanın hemen dışında bekliyorlardı, bu yüzden onların da yabancıya güvenmediklerini varsayıyorum. Şanslıymışım."
 murder_outcome.5002.strangle_incapable:0 "Dünya dönmeye devam ediyor mu? Zamanın geçip geçmediğini anlayamıyorum. Göğsümdeki şey bir acı mı? Yoksa boğazımda mı? Bu vücut benim vücudum mu? Zihnimin gri bulutlarına çöken şey gece mi? Odaklanmak ne kadar da zor.\n\nYanımda birileri mi var? Duyamıyorum ama sanki birisinin bağırdığını #EMP hissediyorum#!. Ardından tekrar sessizlik hâkim oluyor."
 murder_outcome.5002.schemer_known:0 "\n\nTüm bunların arkasında [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] [owner_to_reveal.GetTitledFirstName] var!"
 murder_outcome.5002.will_find_out:0 "Bunun arkasında kimin olduğunu bulacağım!"
 murder_outcome.5002.revenge_will_be_had:0 "Yaptıklarının bedelini ödeyecek!"
 murder_outcome.5002.child:0 "Kim bu kadar zalim olabilir?"
 murder_outcome.5002.infant:0 "Ağlamaya devam ediyorum."
 murder_outcome.5002.option_incapable:0 "Ne oluyor?"
 murder_outcome.5002.memories_death:0 "\n\nBilincim kapanırken sakin bir ses duyuyorum:\n#EMP "İş tamam. [bad_memory.GetThirdPerspectiveDescription] ve bunun intikamı alındı. Şimdi ödemeyi alma zamanı."#!"
 murder_outcome.5002.memories:1 "\n\nOlayın olduğu yerin yakınında bir not bulunuyor: #EMP "Ödeme kesenin içinde. [bad_memory.GetThirdPerspectiveDescription] ve bunun intikamı alınacak."#!"
 murder_outcome.5002.house_feud:0 "\n\n[owner_to_reveal.GetHouse.GetBaseName] Hanesi! Bilmeliydim!"
 murder_outcome.4301.house_feud:0 "\n\nLanet olsun bu [target.GetHouse.GetBaseName] itlerine!"
 murder_outcome.2001.house_feud:0 "\n\nBir [target.GetHouse.GetBaseName] daha eksildi, ne güzel!"
 murder_outcome.2001.b:0 "Bu sadece bir başlangıç."
 murder_outcome.2001.c:0 "Adalet yerini buldu."
 murder_outcome_reworked.0000.success_declaration.generic.1: "[target.GetTitledFirstName] sonunda öldü!"
 murder_outcome_reworked.0000.success_declaration.generic.2: "[target.GetTitledFirstName] sonunda yardakçılarım tarafından öldürüldü!"
 murder_outcome_reworked.0000.success_declaration.generic.3: "[target.GetTitledFirstName], [ROOT.Char.GetFaith.DeathDeityNamePossessive] yeni misafiri oldu!"
 murder_outcome_reworked.0000.failure_declaration.generic.1: "[target.GetTitledFirstName] burnu kanamadan kurtuldu!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.2: "[target.GetTitledFirstName] cinayet teşebbüsümden kurtuldu!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.3: "[target.GetTitledFirstName] ölümün pençelerinden kurtuldu!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.4: "[target.GetTitledFirstName] hâlâ yaşıyor!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.5: "[target.GetTitledFirstName] öldürme planım başarısız oldu!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.6: "Nasıl olduysa [target.GetTitledFirstName] hâlâ yaşıyor!\n\n"
 murder_outcome_reworked.0000.memories.bad.general: "Çok net hatırlıyorum, [bad_memory.GetDescription]. [ROOT.Char.Custom('MurderMemoryEnding')]\n\n"
 murder_outcome_reworked.0000.memories.bad.house_feud: "Endişe edilecek bir [target.GetHouse.GetBaseName] daha azaldı.\n\n"
 murder_outcome_reworked.0000.memories.line_break: "Artık başımın belası değil, teşekkürler yüce [owner.GetFaith.FateGodName].\n\n"
 murder_outcome_reworked.0000.kept_secret.generic.1: "\n\nNeyse ki, söylentiler kesilmeyecek olsa da, benim suça karıştığım bilinmiyor."
 murder_outcome_reworked.0000.kept_secret.generic.2: "\n\nİzlerimi çok iyi gizledim. Saldırının arkasında olduğumdan şüphelenen biri olursa bile bunu açık açık söylemeye cesaret edemez."
 murder_outcome_reworked.0000.revealed.generic.1: "\n\nMaalesef, ne kadar inkâr edersem edeyim, her kesimden gelen asılsız suçlamalar olayın arkasında benim olduğumu iddia ediyor."
 murder_outcome_reworked.0000.revealed.success.1: "\n\nMaalesef birileri bir yerlerde hata yaptı ve benim suça karıştığımı ortaya çıkardı; en azından [target.GetTitledFirstName] benden daha kötü bir durumda, bununla da yetinebilirim."
 murder_outcome_reworked.0000.revealed.failure.1: "\n\nDaha da kötüsü, suça karıştığımı kanıtlayacak deliller ortaya çıktı. Hem kabiliyetsiz hem de katil olarak biliniyorum."
 murder_outcome_reworked.0000.addendum.house_feud.1: "Kahrolası [target.GetHouse.GetBaseName] #EMP soysuzları#!."
 murder_outcome_reworked.0000.addendum.house_feud.2: "[owner_to_reveal.GetHouse.GetBaseName] Hanesinin [target.GetFaith.random_NegativeAfterLife] içinde yeri hazır."
 murder_outcome_reworked.0000.addendum.house_feud.2.2: "ve "$murder_outcome_reworked.0000.addendum.house_feud.2$""
 murder_outcome_reworked.0000.addendum.house_feud.2.servants: "Hizmetkârlar homurdanıyor: $murder_outcome_reworked.0000.addendum.house_feud.2.2$"
 murder_outcome_reworked.0000.memories.target.voice_overheard: "\n\nZihnim kararırken soğuk bir fısıltı geliyor: #EMP "Bunu intikam say, sevgili [target.GetTitleAsNameNoTooltip]. [bad_memory.GetSecondPerspectiveDescription]. Umarım buna değmiştir."#!"
 murder_outcome_reworked.0000.memories.target.note_discovered: "\n\nOlay yerinin yakınında buruşturulmuş bir not bulundu: #EMP "Ödemenin tamamı kesenin içindedir. Sözleşme yapılmadan önce [bad_memory.GetThirdPerspectiveDescription]."#!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.1: "\n\nÖlümü beklerken, bunu başıma kimin getirdiğine dair aklımda bir an bile şüphe yok: [owner.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.2: "\n\nZihnim kararırken bile tek düşünebildiğim şey bu işin sorumlusu, o [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.child: "\n\nAilemin yürek burkan çaresizliğini asla göremeyeceğim, hizmetçiler arasındaki fısıltıları da asla duyamayacağım: "Kesin [owner_to_reveal.GetTitledFirstName] yaptı!""
 murder_outcome_reworked.0000.revealed.scheme_target.success.baby: "\n\nHizmetkârlar beni bulduğunda ne yaşadıkları paniği anlayacaktım ne de fısıltılarını duyacaktım: "Kesin [owner_to_reveal.GetTitledFirstName] yaptı!""
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby: "\n\nHizmetkârlar beni bulduğunda çığlıklarını anlamıyorum, ne de fısıltılarını: "Kesin [owner_to_reveal.GetTitledFirstName] yaptı!""
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.2: "\n\nHizmetkârların sinir dolu fısıltılarını anlamıyorum: ""Kesin [owner_to_reveal.GetTitledFirstName] yaptı!""
 murder_outcome_reworked.0000.revealed.scheme_target.success.baby.end: "Sonuçta sadece bir bebektim."
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.end: "Sonuçta sadece bir bebeğim."
 murder_outcome_reworked.0000.revealed.scheme_target.success.1.incapable: "\n\nBedenim bulunduğunda, anlamları zayıf zihnimde uzun zaman önce kaybolmuş olan birçok söz söylenecek: "Kesin [owner_to_reveal.GetTitledFirstName] yaptı!""
 murder_outcome_reworked.0000.revealed.scheme_target.failure.1.incapable: "\n\nKonuşmaları hâlâ anlayabilseydim, etrafımdaki herkesin mırıldandığı ve öfkeyle tekrarladığı sözler hakkında düşünebilirdim: "Kesin [owner_to_reveal.GetTitledFirstName] yaptı!""
 murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.1: "Bana bunun kimin yaptığı hakkında aklımda tek bir şüphe bile yok. [owner.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.2: "Bunu kesin o [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] [owner_to_reveal.GetTitledFirstName] yaptı!"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.1: "\n\nNe kadar inkâr ederse etsin, tüm deliller bu olayın sorumlusunun [owner_to_reveal.GetTitledFirstName] olduğunu gösteriyor."
 murder_outcome_reworked.0000.revealed.scheme_target.failure.2: "\n\nSuikast başarısız olmakla kalmadı, geride bıraktığı deliller suikasti kimin planladığını da açığa çıkardı: [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.owner.response.1: "Ne çirkin suçlamalar!"
 murder_outcome_reworked.0000.successful_scheme_target.adult: "Yapacağım daha çok şey vardı..."
 murder_outcome_reworked.0000.successful_scheme_target.child: "Bu adil değil!"
 murder_outcome_reworked.0000.successful_scheme_target.incapable: "Daha sonra, sadece hiçlik."
 murder_outcome_reworked.0001.desc.assassin_present_at_location.consort: "[assassin.GetFirstName], onun [assassin.Custom2('GetYourConsortType', target)] olarak zaten yerini almıştı: yapması gereken tek şey [target.GetFirstNameNoTooltip] uyuyana kadar beklemek ve yastığının altındaki bıçakla o köpeğin boğazını kesmekti. Pencereden attığı halat, kendine attığı birkaç bıçak kesiği ve aşağıda önceden hazırlanmış itiş kakış izleri, "gerçek" katilin kaçtığını resmediyor."
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_present_at_location: "[assassin.GetFirstName] planımızı mükemmel bir şekilde uyguladı. Gecenin köründe, iki devriyenin arasından gizlice geçip çalıntı bir anahtarla avımızın yatak odasına girdi. [target.GetFirstNameNoTooltip] kanında boğularak öldü."
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_remote_working: "[assassin.GetFirstName] tarafından kiralanan [Select_CString(dummy_assassin_gender.IsFemale, 'kadın', 'adam' )] planımızı mükemmel bir şekilde uyguladı. Gecenin köründe, iki devriyenin arasından gizlice geçip çalıntı bir anahtarla avımızın yatak odasına girdi. [target.GetFirstNameNoTooltip] kanında boğularak öldü."
 murder_outcome_reworked.0002.desc: "$murder_outcome.5001.hired_assassin$"
 murder_outcome_reworked.0003.desc: "Suikastçı en hassas anda kritik bir hata yaptı! [target.GetFirstNameNoTooltip] uyandığında yatağının yanında karanlığa bürünmüş bir figürün durduğunu görmüş, hemen yardım çığlığı atarak yardakçımızı aceleyle kaçmaya zorlamış."
 murder_outcome_reworked.0004.desc: "Patırtılar ve sessiz küfürler beni uykumdan uyandırıyor.\n\nYakınımda — #EMP oldukça yakınımda#! — karanlıkta gizlenmiş bir figür duruyor, görünüşe göre benim kadar o da şaşkın. Ani yardım çığlığım onu korkutup kaçırırken korumalarım içeri dalıyor."
 murder_outcome_reworked.0011.desc: "Aslında çok fazla şey gerekmedi. Gümüş isteyen aç gözlü bir haydut çetesi ve saldırmaları için güzel bir an. Yine sonuçlar #EMP olağanüstüydü#!. Saldırı, korumalarını tamamen hazırlıksız yakaladı ve canilerden biri o soysuzu tam gözünden vurdu."
 murder_outcome_reworked.0012.desc.alley: "[target.GetCurrentLocation.GetName] sokaklarında maiyetimle seyahat ederken,"
 murder_outcome_reworked.0012.desc.wilderness: "[target.GetCurrentLocation.GetName] patikalarında maiyetimle seyahat ederken,"
 murder_outcome_reworked.0012.desc: "aramızdan biri kan donduran bir çığlık atıyor.\n\nBirdenbire bir grup haydut tarafından saldırıya uğruyoruz! Etrafı ok vızıltıları ve kılıç sesleri dolduruyor, muhafızlarım teker teker yere yuvarlanıyor. Bu tuzağın bana mezar olmasını istemediğimden, daha güvenli bir yere doğru kaçmaya başlıyorum. Ancak, savaşın gürültüsü arasında, tek bir yay kirişinin tınısını duyuyorum."
 murder_outcome_reworked.0013.desc: "Planımız... çok mükemmel görünüyordu... Dikkatlarini dağıttıktan sonra ve çaresiz haydutlardan oluşan bir grup aniden saldıracak. It #EMP should#! have been [target.GetFirstNameNoTooltip] ölmeliydi ancak kahrolası korumaları kendilerini her kılıcın ve okun önüne attı, geri savurdu ve karşı saldırıya geçtiler. Kiraladığımız haydutlar kısa sürede dağıldı."
 murder_outcome_reworked.0014.desc: "aramızdan biri kan donduran bir çığlık atıyor.\n\nBirdenbire bir grup haydut tarafından saldırıya uğruyoruz! Etrafı ok vızıltıları ve kılıç sesleri dolduruyor, muhafızlarımla onları karşılamak için hücum ediyoruz. Şiddetli bir dövüş başlıyor, caniler #EMP açıkça#! en çok beni hedef alıyor. Sadece bir aptal bunun bir suikast girişimi olduğunu anlamaz."
 murder_outcome_reworked.0021.desc: "Planımın temellerini atmak haftalarımı aldı: onun gibi bir [Select_CString(target.IsFemale, 'kadına', 'adama' )] yakışan zehirli bir yemek. Aptallığından kimseyi şüphe ettirmeyen [target.GetFirstNameNoTooltip], zehirlenmiş ördeğin egzotik otlarla dolu yatağının ardındaki zehirin kokusunu alamadı. Zehrin acısını çok ama çok geç olana kadar fark etmediği açıktı."
 murder_outcome_reworked.0022.desc: "Ziyafetimde özellikle güzel bir ördek kızartmasının tadını çıkarırken... tadındaki bu garip acılık da neyin nesi? O aptal aşçı-\n\nBoğazım şişiyor. Kalın ve ağır bir şey boynumda patlıyor, bir fırtına gibi çöken baş ağrısıyla görüşüm bulanıklaşıyor. Neden... neden her şey kararıyor? Bir yerlerde, uzaktan gelen bir kahkaha sesi dehşete düşmüş bir çığlığa dönüşüyor. Odaklanamıyorum, #DIE1 düşünemiyorum#!, #DIE2 hayır...#!"
 murder_outcome_reworked.0023.desc: "#EMP Aptal!#! Nasıl oluyor da her zaman en mükemmel planlarımı bile mahvedecek biri çıkıyor?!\n\nÖrdek servis edilmeye hazırdı, zehir kokusu tatlı kokulu otlarla ustaca gizlenmişti, aşçılara rüşvetler verilmişti... Yine de hizmetkârlardan birisi #EMP illa#! yemeğin tadına bakacaktı. [target.GetFirstNameNoTooltip] daha bir ısırık alamadan aptal hizmetkâr herkesin önünde düşüp öldü!"
 murder_outcome_reworked.0024.desc: "Hayatımda gördüğüm en lezzetli ördek parçasını ısırmak üzereyken, hizmetkârlarımdan biri yüzüstü masaya yığılıp boğazını tutarak ölüyor. Ben yemeden önce gizlice yemeğin tadına bakmış!\n\nCezasını çekti ve en azından ördeğe dokunmam için bir uyarı oldu."
 murder_outcome_reworked.0031.desc: "Plan mükemmel işledi. Sevimli [SCOPE.Custom('VenomousCreature')]m, sessizce ve ilk tehdit anında saldırmaya hazır bir şekilde [target.GetFirstNameNoTooltip] gelsin diye bekliyordu. [target.GetFirstNameNoTooltip] her şeyden habersiz yatağına girince olanlar oldu."
 murder_outcome_reworked.0033.desc: "Plan sözde kusursuzdu: [SCOPE.Custom('VenomousCreature')]m, sessizce ve ilk tehdit anında saldırmaya hazır bir şekilde [target.GetFirstNameNoTooltip] yatağına gelsin diye bekliyordu! Bunun yerine o [target.Custom2('InsultNoun', ROOT.Char)] yataktaki kıpırtıları fark etmiş ve hayvancağızı oracıkta öldürüvermiş."
 murder_outcome_reworked.0034.desc: "Uyumak için yatağıma gittiğimde örtülerin arasında şüpheli bir kıpırtı dikkatimi çekiyor. Örtüleri dikkatlice geri çekince bir [SCOPE.Custom('VenomousCreatureType')]n gözleriyle karşılaşıyorum!\n\n"
 murder_outcome_reworked.0034.desc_unknown: "Küçük canavarın ne olduğunu tam olarak tespit edemiyorum ama dost canlısı olduğundan şüpheliyim."
 murder_outcome_reworked.0034.desc_end: "Hançerimi tereddüt etmeden çekip yaratığa saplıyorum."
 murder_outcome_reworked.0041.desc: "Kızgın köylülerden oluşan bir kalabalık, [target.GetFirstNameNoTooltip] kasabaya doğru giderken onu bekliyordu.\n\nEfendilerinin yanlarından dikkatsizce geçip gittiğini görmek onları çıldırtmaya yetti. [target.GetFirstNameNoTooltip] etrafındaki birkaç muhafız kana susamış bir kalabalığın kör öfkesi karşısında güçsüzdü. Tanınamayacak kadar ezilmiş, dövülmüş ve bıçaklanmış. Kurtulma şansı yok."
 murder_outcome_reworked.0042.desc: "Kasabadan geçerken düşüncelerime dalmış bir hâlde ilerliyorum. Bu yüzden muhafızlarımın gergin mırıldanmalarına ya da yolumuzu kesen kalabalığa dikkat etmiyorum. Fark ettiğimde ise artık çok geçti.\n\nÖfkeli köylüler etrafımızı sarıyor, bizi atlarımızdan indiriyor ve acımasızca dövüyorlar. Sayamayacağım kadar çok darbe aldıkça gözlerim kanla bulanıklaşıyor, sonra her şey siyaha dönüyor."
 murder_outcome_reworked.0043.desc: "Her şey çok iyi gidiyordu: yardakçılarım bir grup köylüyü iyice tahrik etmiş ve [target.GetFirstNameNoTooltip] gelsin diye beklemeye konulmuşlardı.\n\nAncak [target.GetFirstNameNoTooltip] muhafızlarla çevrili bir şekilde ortaya çıkınca kalabalığın öfkesi buhar olup uçtu! Sadece birkaç kişi saldırdı ve onlar da askerler tarafından çabucak bastırıldı."
 murder_outcome_reworked.0044.desc: "Maiyetimle birlikte kasabanın içinden geçerken, her taraftan bizi çevreleyen ve giderek büyüyen kalabalığı fark ediyorum.\n\nNeyse ki bu sabah, kalabalığın hoşnutsuzluğunu yatıştırmak için iyi silahlanmış askerlerden oluşan büyük bir grupla yola çıkmaya karar vermiştim. Kızgın görünen köylülerden oluşan küçük bir grup bize saldırmaya çalıştığında, muhafızlarım kolaylıkla onların icabına baktı ve geri kalanlar da dağıldı."
 murder_outcome_reworked.0051.desc: "Plan oldukça basitti. [target.GetFirstNameNoTooltip] zil zurna sarhoş olmadan masadan kalkmadığı için bir şeyler içmeye davet edilecekti. Aptal [Select_CString(target.IsFemale, 'kadın', 'adam' )] beklediğim gibi içip sarhoş olduktan sonra hiç itiraz etmeden beni bir mahzene kadar takip etti ve orada uyuyakaldı. Hizmetkârlarım odanın girişine duvar örerken kılını bile kıpırdatmadı."
 murder_outcome_reworked.0053.desc: "Her şey plana uygun gidiyordu. [target.GetFirstNameNoTooltip] zil zurna sarhoş olmadan masadan kalkmadığı için bir şeyler içmeye davet edilecekti. Aptal [Select_CString(target.IsFemale, 'kadın', 'adam' )] beklediğim gibi içip sarhoş olduktan sonra hiç itiraz etmeden beni bir mahzene kadar takip etti ve orada uyuyakaldı. Hizmetkârlarım girişi duvarla kapatıp onu içeri kilitleyeceklerdi ama #EMP çok yorulup#! işi tam bitirmeden gitmişler. [target.GetFirstNameNoTooltip] bir açıklık bulup kaçmış!"
 murder_outcome_reworked.0061.desc: "Gemiler her zaman batar. Bu hayatın bir gerçeğidir. Bazen, tam da kıyıdan biraz fazla uzakken, bazı müdahalelerle batmalarına #EMP yardım#! edilebilir. Açık denizdeki suyun insanı şoka sokacak kadar soğuk olduğunu da söylerler. [target.GetFirstNameNoTooltip] buna doğrulayabilirdi ama maalesef boğuldu. Büyük bir #EMP trajedi#!."
 murder_outcome_reworked.0062.desc_port: "Küçük bir gezi sırasında kendimi bir gemide buldum. Kıyıya hâlâ yakınken düşüncelere dalmış şekilde etrafa bakınıyorum ancak birdenbire çatlama sesleri ve denizcilerin çığlıklarını duyuyorum."
 murder_outcome_reworked.0062.desc_travel: "Açık denizi seviyorum! Güneş yüzümü kavuruyor, rüzgâr pelerinimi savuruyor, tuzlu suyun keskin kokusu burnuma doluyor, denizcilerin çılgın çığlıklarına eşlik eden ürpertici çatırtı sesleri— Bi' dakika, #EMP NE#!?!"
 murder_outcome_reworked.0062.desc: "\n\nKırık direk üzerime düşünce nefesim kesiliyor ve denize yuvarlanıyorum. Soğuk suya çarparak girince sersemleşiyorum, ağır kıyafetlerim beni iyice aşağıya çekiyor... dalgaların altına..."
 murder_outcome_reworked.0063.desc: "Gemiler her zaman batar. Bu hayatın bir gerçeğidir. En azından böyle #EMP olmalıydı#!! Yüzen bir hurdayı sabote edip [target.GetFirstNameNoTooltip] ile batmasını sağlamak ne kadar zor olabilir ki?\n\nGörünüşe göre yardakçılarım için çok zordu çünkü gemi yol boyunca sadece küçük bir sorun yaşadıktan sonra güvenli bir şekilde geri dönmüş. Sabotajın sebep olduğu belli bir sorun."
 murder_outcome_reworked.0064.desc: "Gemim batmakta olan güneşin ışıkları altında huzurla yol alırken bir çatırtı sesi ve denizcilerin çılgınca çığlıkları dikkatimi çekiyor. Bir anda, direğin bir parçası tam önüme düşerken muhafızlardan biri beni tutup güvenli bir yere itiyor.\n\nGemideki hasar oldukça büyük, ancak kaptan en yakın limana sağ salim döneceğimizden emin. Ve en önemlisi, kimsenin burnu bile kanamadı."
 murder_outcome_reworked.0071.desc: "[target.GetFirstNameNoTooltip] yemek sırasında kadehini başıboş bırakınca yardakçılarım fark edilmeden içkinin içine birkaç damla zehir koydu. Aptal [target.Custom2('InsultNoun', ROOT.Char)] kadehi tek seferde kafasına dikince ne olduğunu anlamadan ölmesi çok uzun sürmedi!"
 murder_outcome_reworked.0073.desc: "Yardakçılarım mutfağa gizlice zehirli bir fıçı sokmayı başardıktan sonra [target.GetFirstNameNoTooltip] için kadeh hazırlayıp servis ettiler. Ancak fıçı fikri bir hataydı.\n\nO [target.Custom2('InsultNoun', ROOT.Char)] kadehi daha dudaklarına değdirmeden hizmetkârlar odaya daldı ve aynı fıçıdan içen başka birinin hemen öldüğünü söyledi."
 murder_outcome_reworked.0074.desc: "Her zamanki gibi bir akşam yemeğinin tadını çıkarıyorum. Ağzına kadar dolu nefis bir kadeh önümde duruyor, oldukça iştah kabartıcı. Sonunda tutup ağzıma götürecekken bir sürü hizmetkâr çığlık atarak odaya dalıyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], durun! İçki zehirli! Birimiz aynı fıçıdan içti ve hemen öldü!" Elim havada donup kalıyorum."
 murder_outcome_reworked.4001.desc: "Orman gezisi için çok heyecanlıydı! Ne yazık ki ormanlar çocuklar için güvenli yerler değildir. Çok genç, çok #EMP saf#!. Heyecanlarına kapılıp yönlerini, bakıcılarını ve evlerinin yolunu kaybetmeleri çok kolaydır. Asla geri dönmezler. Tıpkı küçük [target.GetFirstNameNoTooltip] gibi. Gerçekten yazık."
 murder_outcome_reworked.4003.desc: "Çok kolay olması gerekiyordu! Ormanlar çocuklar için güvenli yerler değildir: karanlık; tehlikeli; uçurumlarla, zehirli bitkilerle ve ete aç canavarlarla dolu! Bir çocuk için kaybolup ölmek ne kadar zor olabilir ki?!\n\nGörünüşe göre [target.GetFirstNameNoTooltip] için çok zormuş. Küçük velet eve sağ salim dönmenin yolunu bulmuş!"
 murder_outcome_reworked.4011.desc: "Çocuklar çok kırılgan yaratıklardır. Herhangi bir hastalık onları ailelerinden koparabilir... ya da herhangi bir kaza! Narin küçük kafalar ve keskin iğneler içeren kazalar. İş hallolduğu sürece ayrıntılara ihtiyacım yok ve duymak da istemiyorum. Gerçekten üzücü."
 murder_outcome_reworked.4013.desc: "Söz konusu çocuklar olduğunda insanların pek çok endişesi oluyor. Suç ortaklarımın hepsi onun ölmesi konusunda hemfikirdi, bunu gerçekleştirmek için yüklü miktarda altın alıyorlardı ama yine de [target.GetFirstNameNoTooltip] bebeğin huzur içinde uyuduğunu görünce tereddüt ettiler! Çok kolaydı, kafasının en yumuşak olduğu yere keskin bir bıçak darbesi ile her şey bitecekti... Güzel bir fırsatı kaçırdık."
 murder_outcome_reworked.4021.desc: "İnsanlar tuhaf. Bir bebeğe el kaldırmaya istekli birini bulmak zor, ancak bir [SCOPE.Custom('VenomousCreature')] beşiğe yerleştirmek görünüşe göre çok daha kabul edilebilir. Küçük canavarın herhangi bir çekincesi yoktu ve bebeği tereddüt etmeden soktu. Zehir hızlıca etkisini gösterdi."
 murder_outcome_reworked.4023.desc: "Yardakçılar [SCOPE.Custom('VenomousCreature')] planlandığı gibi [target.GetFirstNameNoTooltip] bebeğin yatağına bırakmıştı ama görünüşe göre bebeğin hareketleri onu ürkütmüş ve saldırmak yerine saklanmayı tercih etmiş. İşe yaramaz yaratık birkaç saat sonra bir hizmetkâr tarafından dolabın altında saklanırken bulundu. Lanet bebek zarar görmeden kurtulmuş."
 murder_outcome_reworked.4024.desc: "Tek arzum altımda yumuşak bir yatak ve üzerimi örten sıcak bir battaniye. Vücudumda sanki bir şey hareket ediyormuş gibi tuhaf bir şeyler hissettiğimde neredeyse uykuya dalmak üzereydim. Aniden yanıma dönüyorum ve his kayboluyor. Uykuya dalıyorum.\n\nDaha sonra bir hizmetkârın tiz çığlıklarıyla uyandım. Neler olduğundan emin değilim: bir sürü yetişkin etrafta koşuşturuyor, sesleri yükseliyor ve birçoğu dolabın altında göremediğim bir şeyi işaret ediyor."
 murder_outcome_reworked.4031.desc: "Çocuklar çok saf! Yardakçılarımdan birinin hizmetkâr olarak kılık değiştirip [target.GetFirstNameNoTooltip] için bir parça lezzetli görünen zehirli bir pasta getirmesi yetti. Küçük velet hiçbir soru sormadan kocaman tabağı silip süpürdü!\n\nBelki de çocuklara yabancılardan şeker kabul etmemeyi öğretmeye başlamalıyız..."
 murder_outcome_reworked.4033.desc: "Çocukların deliliğine lanet olsun, ne yapacakları hiç belli değil! Oysa ki çok kolay olması gerekiyordu. [target.GetFirstNameNoTooltip] için lezzetli görünen zehirli bir pasta getir ve ölmesini bekle. Ne tür bir çocuk tatlı ikram edildiğinde aç değilim der?"
 murder_outcome_reworked.4034.desc: "Dışarıda oynarken susamaya başladığımı hissediyorum ve birden hizmetkârın teki gelip bana [ROOT.Char.Custom('FavoriteTreat')] vermek istiyor. Ama ben [ROOT.Char.Custom('FavoriteTreat')] istemiyorum ki su istiyorum! Şapşal!\n\nOlayla ilgili her şeyi çoktan unutmuştum ki saatler sonra birkaç hizmetkâr yanıma gelip çok akıllı ve cesur olduğumu söylüyor, zalim bir planı bozduğum için tebrik ediyorlar. Her neyse. Canım biraz [ROOT.Char.Custom('FavoriteTreat')] çekiyor sanki..."
 murder_outcome_reworked.4041.desc: "Her şey eninde sonunda düşer: krallıklar, [ROOT.Char.Custom('LadiesLords')], #EMP yüksek yerlerden çocuklar#!...\n\nKaçınılamaz bir kaza."
 murder_outcome_reworked.4043.desc: "Yardakçım onu itince giysileri hemen aşağıdaki çıkıntılı bir duvar parçasına takılmış. Çocuk da yardım gelene kadar öylece asılı kalmış."
 murder_outcome_reworked.7001.desc: "Gardiyanlar sadece kimin zindandan çıkmasına izin verildiğiyle ilgilenir, içeri girenlerle ya da onlara ne olduğuyla pek ilgilenmezler.\n\n#EMP Yakın arkadaşları#! [target.GetFirstNameNoTooltip] için ziyarete geldiklerini söyleyip yüklü miktarda rüşvet veren yardakçılarımın işi kolay oldu. Gardiyanlara çığlıklara ve kırılan kemik seslerine kulak asmamaları söylendi."
 murder_outcome_reworked.7003.desc: "$murder_outcome_reworked.7001.desc$ Peki neden iş bitmeden önce birden bire müdahale ettiler?!"
 murder_outcome_reworked.7004.desc: "$murder_outcome.5001.beat_to_death_in_dungeon$ Daha sonra tanıdığım gardiyanlar geliyor ve darbeler kesiliyor."
 murder_outcome_reworked.7011.desc: "[target.GetFirstNameNoTooltip] gibi ev hapsindeki mahkûmların yakından izlenmesi gerekiyor; bu yüzden yardakçılarımından birini onun yakın arkadaşı olarak gösterip evine sokmak oldukça akıllı bir hamleydi. Yardakçım, gardiyanlar daha bir şeylerin ters gittiğini anlamadan içeri girip işini halledip çıkmıştı."
 murder_outcome_reworked.7012.desc: "Muhafızlarım, tanımadığım yüzü kapalı birini eski arkadaşım diyerek odama soktular. Tam bir yanlışlık olduğunu, bu kişiyi tanımadığımı söyleyip itiraz edecektim ki gizli cebinden parlak bir hançer çıktı. #EMP Ah.#! O türden eski bir #EMP arkadaş#!.\n\nHançer bir oktan daha hızlı fırladığında tepki verecek zamanım kalmıyor ve ses çıkarmadan yere düşüyorum."
 murder_outcome_reworked.7013.desc: "[target.GetFirstNameNoTooltip] gibi ev hapsindeki mahkûmların yakından izlenmesi gerekiyor; bu yüzden yardakçılarımından birini onun yakın arkadaşı olarak gösterip evine sokmak oldukça akıllı bir hamleydi! Maalesef gardiyanlar onun hikâyesini pek yutmamışlar ve şüpheli bir durum olursa müdahale etmeye hazır bir şekilde odanın hemen dışında beklemişler. Cinayete teşebbüsü #EMP şüpheli bir durum#! olarak sayıyorlarmış."
 murder_outcome_reworked.8001.desc: "İhtişamlı günleri çoktan geride kalmıştı ama [target.GetFirstNameNoTooltip] yine de hayata o kadar uzun süre, o kadar umutsuzca, o kadar #EMP boşuna#! tutundu ki... Yardakçımın merhametli bir iş yaptığına inanıyorum. [target.GetFirstNameNoTooltip] sadece boş bir kabuktu. Bu gerçekten cinayet sayılır mı?"
 murder_outcome_reworked.8003.desc: "Bir yardakçının bu kadar beceriksiz olabilmesi imkânsız. Aklı artık yerinde olmayan, bir ayağı mezardaki bir insanı boğmak ne kadar zor olabilir ki? Tamemen rezalet."
