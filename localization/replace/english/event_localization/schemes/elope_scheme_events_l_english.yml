l_english:
 elope_event_title:0 "Birlikte Kaçma:"
 elope.0001.t:0 "$elope_event_title$ Gölgelerin Koruması Altında"
 elope.0001.positive.desc:0 "Son hazırlıklar tamamlandı. Kaçış rotası belirlendi, muhafızlara rüşvetleri verildi, [target.GetTitledFirstName] hazır. [location.GetNameNoTooltip] sokaklarına karanlığın çökmesiyle birlikte [target.Custom('LoverPetName')] özgür kalacak, onu [Select_CString(target.IsFemale, 'karım', 'kocam' )] yapacağım!"
 elope.0001.negative.desc:0 "Kafamdaki listenin üstünden bir kez daha geçiyorum. Kaçış rotasını belirledim, muhafızlara rüşvetleri ulaşmış olmalı, umarım [target.GetTitledFirstName] ona bıraktığım notu zamanında fark eder. Ya fark etmezse? Off, ya notu başkası aldıysa? Ters gidebilecek o kadar çok şey var ki...\n\nVakit endişeye kapılma vakti değil. Bu benim tek şansım. Ya başıma gelebileceklere hazırlıklı olmalıyım ya da bu işe hiç girmemeliyim."
 elope.0001.a:0 "Sana geliyorum, [target.GetFirstNameNoTooltip]!"
 elope.0001.b:0 "Ne yapıyorum ben? Bu delilik!"
 elope.0001.a.tt:0 "[target.GetShortUIName] ile kaçmaya çalışacağım"
 elope.0001.a.success:0 "#P Başarılı#! oldum"
 elope.0001.a.failure_discover:0 "#N Başarısız oldum ve girişimim açığa çıktı#!"
 elope.0001.a.failure_hidden:0 "#N Başarısız#! oldum ama girişimim açığa çıkmadı"
 elope.1001.t:0 "$elope_event_title$ Aşkın Gücü"
 elope.1001.start.desc:0 "Beklerken işlerin ters gitmesi durumunda yaşanabilecekleri hayal etmekten kendimi alamıyorum. Tamamen çaresizim - ve bu duyguya alışmak #EMP istemiyorum#!.\n\nİleride bana doğru yaklaşmakta olan bir meşale ışığı görüyorum, adamlarıma saklanmalarını söylüyorum."
 elope.1001.start.desc_brave:0 "Beklerken [target.GetFirstName] nerede diye düşünmeden edemiyorum. Sorun çıktı mı? Takip edenler olacak mı?\n\nİleride bana doğru yaklaşmakta olan bir meşale ışığı görüyorum, adamlarıma saklanmalarını söylüyorum."
 elope.1001.end.desc:0 "Işık yaklaşırken iki silüeti ayırt edebilmeye başladım. Silüetlerden biri kılıç taşıyor gibi gözüküyor, diğeri ise... #EMP O#! olmalı!\n\nBen ona doğru, [target.Custom('LoverPetName')] ise bana doğru koşuyor. Onu kollarımın arasına alıyorum. Böyle bir mutluluk yok. El ele koşmaya başlıyoruz."
 elope.1001.a:0 "Çabuk çabuk, [ROOT.Char.Custom('DefaultPriestTitle')] bizi bekliyor!" #krutygetarts
 elope.1002.t:0 "Bir Gece Ansızın"
 elope.1002.start.desc:1 "Kapıya sert bir şekilde vurulmasıyla uykumdan uyandım. "Efendim! Bir muhafız ölü bulundu ve majestelerinin [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('target'))] kayıp!""
 elope.1002.desc_naked:0 "Yataktan kalkıp daha kapıya ulaşmadan emirler vermeye başlıyorum."
 elope.1002.desc_not_naked:0 "Yataktan kalkıp bir yandan giyinirken bir yandan emirler veriyorum."
 elope.1002.desc:0 "\n\nSaatlerce süren aramanın ardından öğle saatlerinde [target.GetTitledFirstName] imzalı bir mektup bulunuyor. El yazısı mektubun onun tarafından yazıldığını doğruluyor.\n\n"
### TODO AGOT-ONLY: elope.1002.apologetic_relationship.desc [AGOT: ]
 elope.1002.apologetic_relationship.desc:0 ""My dearest [target.GetFirstNameNoTooltip], I am so very sorry, but I have to follow my heart. I have left you to marry the love of my life — [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)].""
### TODO AGOT-ONLY: elope.1002.unapologetic_relationship.desc [AGOT: ]
 elope.1002.unapologetic_relationship.desc:0 ""I have left to marry [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. Do not come after me — I would rather die than be yours again!""
### TODO AGOT-ONLY: elope.1002.apologetic_family.desc [AGOT: ]
 elope.1002.apologetic_family.desc:0 ""[target.Custom2('RelationToMeShort', ROOT.Char)|U], I have left to marry the love of my life — [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. All I want is to be happy. I hope you can find it in your heart to forgive me.""
### TODO AGOT-ONLY: elope.1002.unapologetic_family.desc [AGOT: ]
 elope.1002.unapologetic_family.desc:0 ""If you truly loved your own [ROOT.Char.Custom2('RelationToMeShort' , target)], you would have wanted me to be happy. But as you care so little for me, I have left to follow my heart. I will marry [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] and there is nothing you can do to stop me!""
 elope.1002.a.fallback:0 "Nasıl yapar?"
 elope.1002.a.vengeful:0 "Sadakatsiz [target.Custom2('InsultNounSexual', ROOT.Char)] hak ettiğini bulacak!"
 elope.1002.a.compassionate:0 "Umarım mutlu olur..."
 elope.1003.opening:0 "[target_keeper.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 elope.1003.start.desc:0 "Sizi bir konuda bilgilendirmek üzere yazıyorum,"
 elope.1003.target_root_family.desc:0 "majestelerinin [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('target'))] [target.GetFirstName]"
 elope.1003.target_keeper_relation.desc:0 "[target_keeper.Custom2('RelationToMePossessive' , SCOPE.sC('target'))|U] [target.GetFirstName]"
 elope.1003.target_liege_subject.desc:0 "vasalım [target.GetFirstName]"
 elope.1003.middle.desc:0 ""
 elope.1003.owner_root_family.desc:0 "majestelerinin [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('owner'))] [owner.GetFirstName] ile kaçmıştır!"
 elope.1003.your_character_introduction.desc:0 "[owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)] ile kaçmıştır!"
 elope.1003.end.desc:0 "Dürüst olmak gerekirse, bu büyük bir hakarettir. Ailenizin onurunu da lekelemiştir. Mevzubahis #EMP mutlu çift#!, kendilerine [capital.GetNameNoTooltip] şehrinde yeni bir yaşam kurmaya kalkışırsa, gerekenin yapılacağı konusunda size güveniyorum."
 elope.1003.a:0 "Felaket!"
 elope.1011.t:0 "$elope_event_title$ Karanlıktaki Meşaleler"
 elope.1011.middle.desc:0 "Karanlıkta iki silüet görüyorum... Bir dakika, üç... dört silüet mi?! [ROOT.Char.GetFaith.HighGodName] aşkına! Bu iyiye delâlet değil!"
 elope.1011.end.desc:0 "Verdiğim emirle çalılıkların arasından çekilmeye başlıyoruz. Bizi kovalayanların saklanmak gibi bir niyeti yok ve tüm hızlarıyla bize doğru yaklaşıyorlar.\n\n"Sonsuza dek saklanamazsın [ROOT.Char.GetTitledFirstNameNoTooltip]! Adamlarından birini yakaladık, sıra sende!""
 elope.1011.a:0 "#EMP Kaç kaç kaç!#!"
 elope.1012.t:0 "Başarısız Kaçma Girişimi"
 elope.1012.desc:0 "Muhafızlar merkezinde [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bulunan bir kaçırma girişimine mani olduklarını belirtiyorlar. Muhafızbaşının söylediğine göre [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] onu benden çalıp gizlice evlenmeyi planlıyormuş.\n\nTüm bunlar da yetmezmiş gibi odasında bulunan mektuplara bakılırsa [target.GetFirstNameNoTooltip] kaçmaya dünden razıymış!"
 elope.1012.a:0 "O [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNounSexual', ROOT.Char)] bir daha asla [ROOT.GetCharacter.Custom2('RelationToMePossessive' , SCOPE.sC('target'))] ile göz göze gelemeyecek!"
 elope.1012.b:0 "İhanet! #EMP Şu andan#! itibaren [target.GetFirstNameNoTooltip] odasından çıkamayacak!"
 elope.1012.c:0 "Onlara yaptıklarının bedelini ödeteceğim, kimse merak etmesin!"
 elope.1012.d:0 "Başıma ağrı girmeye başladı..."
 elope.1021.end.desc:0 "\n\nEmrim üzerine çalıların arasından geri çekiliyoruz. Tamamen şans eseri vagona ulaşmayı başarıp gecenin karanlığında kaçıyoruz."
 elope.1021.a:0 "[target.GetFirstNameNoTooltip], sevdiğim... Umarım her şey yolundadır."
 elope.2000.t:0 "Sevgilim,"
 elope.2000.start.desc:0 "Bana cesur olmamı söyledin ama daha fazla korkularımı saklayamıyorum."
 elope.2000.target_relation.desc:0 "Ya [target.Custom2('RelationToMePossessive' , SCOPE.sC('discoverer'))] planlarımızı öğrenirse? Geceleri gözüme uyku girmiyor. Yemek dahi yiyemiyorum. Sanki bir şeylerin farkında gibi geliyor - şüphelenmeye başlamış bile olabilir!"
 elope.2000.titledname.desc:0 "Ya [discoverer.GetTitledFirstName] planlarımızı öğrenirse? Ne zaman karşıma çıksa heyecandan suspus oluyorum. Bir şeylerin ters gittiğini fark etmesi an meselesi!"
 elope.2000.end.desc:0 "\n\nZamanımız tükeniyor. Ne olur [ROOT.Char.GetFirstNameNoTooltip], acele et!"
 elope.2000.a:0 "Daha erkenden harekete geçeceğiz, [target.Custom('LoverPetName')]."
 elope.2000.c:0 "Güven bana - her şey yolunda."
 elope.2000.c.success:0 "[target.GetShortUIName|U] ikna oldu"
 elope.2000.c.failure:0 "[target.GetShortUIName|U] ikna olmadı"
 elope.2000.b:0 "E öyleyse bana mektup göndermesen daha iyi!"
