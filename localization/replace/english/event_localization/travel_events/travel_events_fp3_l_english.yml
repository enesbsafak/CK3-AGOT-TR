l_english:
travel_events_fp3.0010.t: "Sönen Közler"

travel_events_fp3.0010.desc.intro:0 "Kafilemle birlikte aniden başlayan fırtınanın içinde hareket ederken, karşıdan gir grup Magi'nin geldiğini söylüyorum. Taşıdıkları tahtırevanda sönmek üzere közler bulunuyor. Rüzgâr ve yağmur kutsal alevi söndürmek üzere görünüyor.\n\nBir yandan ellerini silahlarına yakın tutarken, bir yandan da onlara yardım edeceğimizi umarak yardım çığlıkları atıyorlar."
travel_events_fp3.0010.a: "Etraflarını sarıp bu sapkınlığa son verin!"
travel_events_fp3.0010.a.success: "Ateşi söndürmeyi başardım"

travel_events_fp3.0010.a.failure:0 "Magi bizi geri püskürtmeyi başardı"
travel_events_fp3.0010.a.lightning.desc: "Fırtınada savaşmak tehlikeli olabilir"
travel_events_fp3.0010.b: "Kutsal alevi ele geçirin, benim elimde daha güvende olacaklar!"
travel_events_fp3.0010.b.success: "Kutsal alevi ele geçirmeyi başardınız"

travel_events_fp3.0010.b.failure:0 "Magi bizi geri püskürtmeyi başardı"
travel_events_fp3.0010.c: "Bize sığınabilirsiniz!"
travel_events_fp3.0010.c.success: "Kutsal alev sönmedi"

travel_events_fp3.0010.c.success.desc:0 "Magilerin minnetini kazandınız"
travel_events_fp3.0010.c.flavor: "Onları koruyabilirsek, bize minnettar kalacaklardır"
travel_events_fp3.0010.c.failure: "Kutsal alev söndü"
travel_events_fp3.0010.d: "Bu fırtına [ROOT.Char.GetFaith.HighGodNamePossessive] iradesinin bir göstergesi."
travel_events_fp3.0010.d.flavor: "Magileri kendi hâllerine bırakacaksınız"
travel_events_fp3.0011.t: "Sönen Közler"

travel_events_fp3.0011.desc.intro:0 "Magi cesurca dövüşerek bir yandan kutsal alevin sönmesine engel olurken bir yandan da adamlarıma karşı koymaya çalışıyor. Bir anlık açık yakaladığım gibi taşıdıkları tahtırevanı tekmeleyerek yere düşürmelerini sağlıyorum, tüm közler çamura bulanarak birer birer sönüyor.\n\nBen ve adamlarım kahrolmuş Magilerle alay ederken, sevincimiz bir anda yarıda kesiliyor. Hava aniden aydınlanıyor, şiddetli bir gök gürüldemesi yeri titretiyor. Gözlerimi açtığımda çamura bulanmış közlere bir yıldırımın isabet ettiğini ve közleri tekrardan alevlendirdiğini görüyorum. Adamlarım panik hâlinde yaşananları idrak etmeye çalışıyor."
travel_events_fp3.0011.a: "Herkes [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive] kudretine tanıklık etsin!"
travel_events_fp3.0011.b: "Bu yadsınamaz mucizeyi kalbimde saklayacağım."
travel_events_fp3.0011.c: "Yok daha neler! Bu sadece bir tesadüf."
travel_events_fp3.0012.t: "Sönen Közler"

travel_events_fp3.0012.desc.intro:0 "Magilerle birlikte harabelerin arasında güzel bir yer bulup sığınıyorsunuz. Islanan giysilerinizi kuruttuktan sonra kutsal alevin hâlâ yandığını gören ahali rahatlıyor. Anlaşılan fırtınanın dinmesini birlikte bekleyeceksiniz.\n\nMagilerin lideri gibi görünen [fp3_zoroastrian_armed_pilgrim.GetName] oldukça bilgisi birisine benziyor ve anlatacağı birçok hikâyesi var."
travel_events_fp3.0012.a: "Onlar uyurken kutsal alevi çalmalıyım..."
travel_events_fp3.0012.a.success: "Magi uyurken alevi çaldınız"

travel_events_fp3.0012.a.failure:0 "Magi sizi fark etti ve hırsız olduğunuz açığa çıktı"
travel_events_fp3.0012.b: "Bilgeliğiniz işime yarayabilir."
travel_events_fp3.0012.c: "Güvenli yolculuklar."
zoroastrian_brazier_name: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] Kutsal Alevi"

zoroastrian_brazier_desc:0 "Beceriksiz Magilerin elinden kurtarılan $zoroastrian_brazier_name$, közleri hâlâ yanıyor."
 travel_events_fp3.0020.t: "Sıradışı Bir Karşılaşma"
 travel_events_fp3.0020.desc.intro: "Öğlen vakti şiddetini iyice arttıran güneşten kaçmak adına mağarada geçici bir kamp kuruyoruz.\n\n"Sesi siz de duydunuz mu?" diye soruyor [travel_leader.GetName], dikkatli gözlerle çevreyi inceleyerek.\n\nArkamı dönmemle birlikte bir [Select_CString(fp3_young_rascal.IsFemale, 'kız çocuğunun', 'çocuğun' )] sessiz adımlarla yürüdüğünü görüyorum. Fark edildiğini anlayan çocuk bir anda mağaranın derinliklerine doğru kayboluyor."
 travel_events_fp3.0020.a: "Çocuğu takip edin!"
 travel_events.fp3.0020.a.flavor: "Mağaranın içerisinde ilerlemek tehlikeli olabileceği gibi bazı sırları açığa çıkarmanızı da sağlayabilir"
 travel_events_fp3.0020.a.success: "Çocuğu buldunuz"
 travel_events_fp3.0020.a.success.tooltip: "Çocuğu takip ettiniz ve yeraltının sırlarını açığa çıkardınız"
 travel_events_fp3.0020.b: "Burayı terk etmeliyiz."
 travel_events.fp3.0020.b.flavor: "[travel_leader.GetNameNoTooltip] mağaranın güvenli olmadığını söylüyor."
 travel_events_fp3.0020.b.tt: "Yolculuğunuz devam edecek."
 travel_events_fp3.0020.a.failure.title: "Karanlık tünellerde düşerek kendinizi yaralayacaksınız"
 travel_events_fp3.0020.a.failure: "Çocuğu bulamayıp günlerce mağaranın içerisinde kaybolacaksınız"
 travel_events_fp3.0021.t: "[ROOT.Char.GetCurrentLocation.GetCounty.GetName] Kehrizleri"
 travel_events_fp3.0021.desc: "Mağarada ilerlemeye devam ediyoruz, güneş ışığından uzaklaştıkça mağara daha karanlık ve nemli bir hâl alıyor.\n\n[Select_CString(fp3_young_rascal.IsFemale, 'Kız çocuğunu', 'Çocuğu' )] yakalamamla birlikte karşımdaki manzara karşısında dikkatim dağılıyor. Antik yeraltı kanallarından oluşan bu devasa sistem göz görebildiği yere kadar uzanıyor.\n\n"Sarayıma hoş geldiniz [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )]." diyor ve ekliyor: "Büyük ihtimalle sizinkinden büyüktür.""
 travel_events_fp3.0021.a: "Hazine avına çıkalım."
 travel_events_fp3.0021.a.success.t: "[newly_created_artifact.GetName] buldunuz"
 travel_events_fp3.0021.a.success.desc: "Antik bir hazine buldunuz"
 travel_events_fp3.0021.a.failure.t: "Yakaladığım Tek Sey Soğuk Algınlığı"
 travel_events_fp3.0021.a.failure.desc: "Az daha boğuluyordunuz da"
 travel_events_fp3.0021.a.artifact: "Eski bir eser buldum"
 travel_events_fp3.0021.b: "Bu yapıdan öğrenebileceğim çok şey var."
 travel_events_fp3.0021.b.success.t: "Sulama Teknikleri Öğrenildi"
 travel_events_fp3.0021.b.success.desc: "Kehriz üzerinde çalıştınız"
 travel_events_fp3.0021.b.failure.t: "Sorun gözünüzden kaçıyor"
 travel_events_fp3.0021.b.failure.desc: "Bu iş sizi aştı"
 travel_events_fp3.0021.c: "Büyüklerine saygı göstermeyi öğrenmelisin!"
 travel_events_fp3.0030.t: "Şahinlerin Ziyafeti"
 travel_events_fp3.0030.desc.intro: "Yırtıcı kuşlar tepemde daireler çizerken, güneşin kavurduğu toprağın üzerine korkutucu gölgeler yansıtıyorlar. Bir tepenin yamacına tırmanırken çürümüş et kokusundan kendimi alamıyorum.\n\nAkbabalar ve şahinler kayaların üzerine düzenli bir şekilde sıralanmış cesetlerin üzerinde ziyafet çekiyor. Bu esnada basit kıyafetler giyen bir adam yanıma yaklaşıyor.\n\n"Lütfen burayı terk edin [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )], burası sadece Nusessalar içindir...""
 travel_events_fp3.0030.a: "Bu barbarlık! Cesetleri gömeceğiz."
 every_faith_vassal: "[local_faith.GetAdjective] Tüm Vasallar"
 travel_events_fp3.0030.b: "Umarım ben de böyle defnedilirim, Nasu'dan arındırılmış bir şekilde..."
 travel_events_fp3.0030.c: "Bu güçlü kanatlarla göğe yükseldiğini hayal etsene..."
 travel_events_fp3.0030.d: "Her canlı bir gün ölümü tadacak."
 travel_events_fp3.0030.d_flavor: "Ölüm üzerine düşünüp cenaze törenini terk edeceksiniz"
 travel_events_fp3.0030.e: "Şahinlerin en gencini bana verin, onu eğitececeğim."
 travel_events_fp3.0030.e.tooltip: "Şahin eğitme şansına sahip olacaksınız."
 travel_events_fp3.0031.t: "Şahinlerin Ziyafeti"
 travel_events_fp3.0031.desc.intro: "Gökyüzü mezarlığında bulduğum şahini eğitmekte kararlıyım. Bunun için [ROOT.Char.Custom2('RelationToMePossessive', falcon_victim)] [falcon_victim.GetFirstName] ile birlikte ufak bir geziye çıkıyoruz. Yavru kuş eldivenimin arasında sabırla bekliyor.\n\n[falcon_victim.GetFirstNameNoTooltip] yanında getirdiği avı serbest bırakır bırakmaz, şahini serbest bırakıyorum ve uçmaya başlıyor. Şahin avına doğru hareketlenmektense [falcon_victim.GetFirstNameNoTooltip] yönünde saldırıya geçiyor. Biz onu kurtaramadan şahin pençeleriyle kanlı yaralar bırakıyor."
 travel_events_fp3.0031.a: "Bu davranışı düzeltebileceğime eminim."
 travel_events_fp3.0031.a.success.desc: "Eğitim faydalı oldu"
 travel_events_fp3.0031.a.success.t: "Sessizlik Kulesi kuşu güçlü bir av şahini oldu"
 travel_events_fp3.0031.a.failure.desc: "Kuş vahşi kalmaya devam etti"
 travel_events_fp3.0031.a.failure.t: "Şahin hâlâ insan etine karşı iştah sahibi"
 travel_events_fp3.0031.b: "Güzel... Güzel..."
 travel_events_fp3.0031.c: "En iyisi bu kuştan kurtulayım."
 travel_events_fp3.0031.d: "[ROOT.Char.GetCulture.GetPrefixNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'kadınları', 'erkekleri' )] bir kuşu nasıl evcilleştireceğini bilir."
 travel_events_fp3.0031.d.tt: "Bu seçenek $tradition_ep2_avid_falconers_name$ [Concept( 'culture_tradition', 'Kültür Geleneğine' )|E] sahip olduğunuz için seçilebilir"
 travel_events_fp3.0040.t: "Kısrak Sütü"
 travel_events_fp3.0040.desc.intro: "Yol üstünde Türk gezginlerin kampına rastlıyoruz. Grup misafirperver bir şekilde onlara katılmamızı söylüyor. Sert mizaca sahip [Select_CString(fp3_turkic_traveler.IsFemale, 'bir kadın', 'biri' )] kaseye beyaz bir sıvı döküyor ve bana uzatıyor."Bu kımızdır, bağırsaklarıma iyi gelir."\n\nDiğer ikili bir yandan beni izlerken bir yandan da aralarında fısıldaşıyor, söyledikleri bazı kelimeleri duyabiliyorum."
 travel_events_fp3.0040.desc.intro.a: "\n"Niye elimizdeki son kımızı bu yabancıya veriyoruz ki?"\n\nAnlaşılan onların dilini anlamadığımı düşünüyorlar, en azından zehir vermediklerini anlamış olduk."
 travel_events_fp3.0040.desc.intro.b: "\n"Ben botlarını alırım, sen şapkasını alırsın, anlaştık mı?"\n\nAnlaşılan onların dilini anlamadığımı düşünüyorlar, en azından asıl niyetlerini anlamış olduk."
 travel_events_fp3.0040.desc.intro.c: "Ne yazık ki dediklerini anlayamıyorum, umarım niyetleri iyidir..."
 travel_events_fp3.0040.a: "Onlara kendi dillerinde teşekkür edeceğim!"
 travel_events_fp3.0040.ab.tt: "Bu seçenek [fp3_turkic_traveler.GetCulture.GetLanguage.GetNameNoTooltip] konuşabildiğiniz için seçilebilir"
 travel_events_fp3.0040.b: "Onlara kendi dillerinde cevap vereceğim..."
 travel_events_fp3.0040.c: "Daha açık görüşlü olmalıyım."
 travel_events_fp3.0040.c.success: "Kımız çok lezzetliydi"
 travel_events_fp3.0040.c.success.t: "Kımız Çok Lezzetliydi!"
 travel_events_fp3.0040.c.failure: "Uyutulup soyuldunuz"
 travel_events_fp3.0040.c.failure.t: "Uyutulup Soyuldum!"
 travel_events_fp3.0040.d: "Kısrak sütü mü? Almayayım."
 travel_events_fp3.0040.e: "[Select_CString(fp3_turkic_traveler.IsFemale, 'Kadını', 'Onu' )] yanımıza almalıyız."
 travel_events_fp3.0050.t: "Mezar Hırsızları"
 travel_events_fp3.0050.desc.intro: "Yolda ilerlediğimizde tozlar içerisinde bir ahalinin, bir zamanlar etkileyici bir anıtmezarın olduğu yerden çıktığını görüyoruz. Ellerindeki çuvallar sallandıkça şıngırdıyor, ne yaptıklarını saklama ihtimalleri olmadığını anladıktan sonra bize doğru ilerliyorlar.\n\n"Zor zamanlardan geçiyoruz [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )]! Ailemize yemek götürmek zorundayız, cesetlerden çalacağımıza yaşayanlardan mı çalalım?""
 travel_events_fp3.0050.a: "Geçmişini koruyamayanın geleceği olmaz."
 travel_events_fp3.0050.b: "Benim payım nerede?"
 travel_events_fp3.0050.b.entourage: "[entourage_helper.GetName] ganimetleri inceliyor."
 travel_events_fp3.0050.b.success.desc: "Değerli bir hazine edineceksiniz"
 travel_events_fp3.0050.b.success.tooltip: "Antik bir hazine elde edeceksiniz"
 travel_events_fp3.0050.b.failure.desc: "Gözünüze değerli bir şey çarpmadı"
 travel_events_fp3.0050.b.failure.t: "Değerli Süsler Buldunuz"
 travel_events_fp3.0050.c: "Köylülerle uğraşacak vaktimiz yok."
