 activity_system.0500.t: "Acı Son"
 activity_system.0500.desc: "Gelen haberlere göre ev sahibimiz [host.GetNameNoTooltip] ölmüş. Bu öngörülemeyen koşullar nedeniyle etkinliği iptal edildi."
 activity_system.0500.a: "Gerçekten üzücü."
 activity_system.0501.t: "Bir Ruh Göçtü"
 activity_system.0501.desc: "Sınav salonunun dört bir yanında bir uğultu kopuyor. Bilginler ve keşişler, bir o yana bir bu yana koşturuyor. Avluda bir kalabalık toplanıyor, çok geçmeden ağlama sesleri yükselmeye başlıyor.\n\nGöklerin [Select_CString(ROOT.Char.GetTopLiege.IsFemale, 'kızı', 'oğlu' )] öldü."
 activity_system.0501.a: "İnanamıyorum..."
 activity_system.0550.t: "Planlarda Aksama"
 activity_system.0550.desc: "Ani ve öngörülemeyen tutsaklığım nedeniyle düzenlediğim etkinlik iptal edilmek zorunda.\n\nPlanlamak için harcadığım onca zaman..."
 activity_system.0550.a: "Planımın bir parçası değildi..."
 activity_system.0551.t: "Ev Sahibi Tutsak Oldu"
 activity_system.0551.desc: "Ev sahibimiz [host.GetNameNoTooltip] tutsak edildiği için katıldığım etkinlik iptal edildi."
 activity_system.0551.a: "Eve gitme vakti."
 activity_system.0552.t: "Karşılıksız Meydan Okuma"
 activity_system.0552.desc: "Bu da ne demek oluyor? Görünen o ki başka hiçbir hareket, [GetPlayer.Custom('GetMyMovementNoTooltip')] tarafından yapılan meydan okumaya karşılık vermeye yanaşmamış.\n\nKarşılıklı tartışacak kimse kalmadığı için münazara iptal edildi."
 activity_system.0552.a: "Bir dahaki sefere..."
 activity_system.0554.opening: "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 activity_system.0554.a: "Bu meydan okumayı kabul etmeliyim."
 activity_system.0554.b: "Uygun bir bahane uyduracağım."
