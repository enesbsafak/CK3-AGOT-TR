 ACTIVITY_LOG_ENTRY_EFFECT:1 "#S Etkiler#!\n$EFFECT$"
 activity_tournament_province_desc:2 "[ROOT.Province.GetName] topraklarında bir Turnuva düzenliyorsunuz\nUygun binalara sahip topraklar [gold_i][gold|E] indirimi sağlar"
 activity_feast_guest_desc:0 "$BULLET_WITH_TAB$Katılımcılar diğer katılanlar ile [opinion|E] kazanabilir\n$BULLET_WITH_TAB$Katılımcılar [stress_loss_i][stress|E] kaybedebilir\n$BULLET_WITH_TAB$Katılımcılar [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [Concept( 'trait', 'Özelliğini' )|E] kazanabilir"
 activity_tournament_guest_desc:1 "#weak Eğer katılabiliyorsunuz, turnuvalar müsabaka kazanma ve böylece ödüller alma fırsatı sunar. Bunun yanında rahatlamanızı ve askerî yeteneklerinizi geliştirmenizi de sağlayabilir.#!"
 guest_friendship_title:0 "$activity_pulse_action_guest_friendship$"

