 activity_system.0040.t:1 "Turnuva Sona Erdi"
 activity_system.0040.desc:1 "Tüh! Turnuvayla ilgili yeni durum nedeniyle iptal edilmek zorunda kalınmış.\n\nÖnümden sıra sıra morali bozuk insanlar geçiyor, ağlayan çocuklar anne babalarının ellerini tutuyor. Umarım yakın bir zamanda şenlik tekrar başlayabilir."
 activity_system.0040.a:1 "Yazık oldu."
 activity_system.0080.t:1 "Yeni Ev Sahibi"
 activity_system.0080.desc:2 "Turnuvanın önceki ev sahibinin ölmesiyle turnuvaya ne olacağı konusunda dedikodular dolaşıyordu.\n\nSonunda bir anlaşmaya varıldı."
 activity_system.0080.desc_other:0 "Şenlik devam edecek ama ev sahibi artık [host.GetTitledFirstName] olacak!"
 activity_system.0080.desc_me:0 "Şenlik devam edecek ve ev sahibi artık ben olacağım!"
 activity_system.0080.a:0 "Kaldığımız yerden devam."
 activity_system.0081.t:1 "Son Durak"
 activity_system.0081.desc.relation_family_liked:0 "Sevgili [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('old_host'))] [old_host.GetTitledFirstName] maalesef vefat etti"
 activity_system.0081.desc.relation_liked:0 "Değerli [old_host.GetTitledFirstName] maalesef vefat etti"
 activity_system.0081.desc.relation_family:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('old_host'))|U] [old_host.GetTitledFirstName] maalesef vefat etti"
 activity_system.0081.desc.relation_neutral:0 "[old_pilgrimage_host.GetTitledFirstName] maalesef vefat etti"
 activity_system.0081.desc.outro:0 "ve onun vârisi olarak yetkileri artık benim elimde.\n\nBu nedenle, kendi duygularımdan bağımsız olarak, cenazesini ne olacağına karar vermeliyim."
 activity_system.0081.a:0 "[ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip] onun eviydi."
 activity_system.0081.a.tt:0 "[old_host.GetShortUIName] son yolculuğu için [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip] topraklarına getirilecek."
 activity_system.0081.b:0 "[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] toprakları gibi kutsal bir toprağı hak ediyor."
 activity_system.0081.b.tt:0 "[old_host.GetShortUIName] son yolculuğu için [THIS.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] topraklarına getirilecek."
 activity_system.0081.c:0 "Önce [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], sonra evi."
 activity_system.0081.c.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] devam edecek ve daha sonra [old_host.GetShortUIName] son yolculuğu için [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip] topraklarına getirilecek."
 activity_system.0090.t:0 "Geçersiz Niyet"
 activity_system.0090.desc:1 "Durumlar değiştiği için niyetimi artık yerine getiremem. Endişeli endişeli oturmuş düşünürken diğerleri gülümsemeye devam ediyor, yüzümün hâlini fark etmiyor.\n\nNe yapsam acaba? Belki biraz rahatlayabilirim."
 activity_system.0090.a:1 "Başka şeylere odaklanmalıyım."
 activity_system.0091.t:1 "Geçersiz Niyet Hedefi"
 activity_system.0091.desc:1 "Durumlar değiştiği için niyetim artık amaçlarımla uyuşmuyor. Endişeli endişeli oturmuş düşünürken diğerleri gülümsemeye devam ediyor, yüzümün hâlini fark etmiyor.\n\nWho else should I be focusing on? Perhaps I should simply focus on myself?"
 activity_system.0091.a:1 "Yeni bir şeyler bulma zamanı..."
 activity_system.0100.t:2 "Kötü Şenlik"
 activity_system.0100.desc:0 "İnanılmaz! O kadar davete ve hazırlıklara rağmen hiç kimse [activity_type.GetNameNoTooltip()] için gelmedi. Belki [location.GetName] yolları tahmin ettiğimden daha tehlikeli.\n\n"
 activity_system.0100.outro_away:0 "[ROOT.Char.GetCapitalLocation.GetName] topraklarına dönme zamanım geldi."
 activity_system.0100.outro_home:0 "En azından kendi evimde düzenliyordum da yolculuktan kurtuldum."
 activity_system.0100.a:1 "Neden... neden kimse gelmedi?"
 activity_system.1010.t:0 "Kısa Yolculuk"
 activity_system.1010.desc:0 "Selefim [host.GetNameRegnal] ülkeyi gezerken vefat etti. Trajik bir şekilde [host.GetDeathReason].\n\n"
 activity_system.1010.desc.entourage:0 "[ROOT.Char.Custom2('RelationToMePossessive',SCOPE.sC('host'))|U] [host.GetFirstNameNoTooltip] maiyeti tarafından evine getirilecek."
 activity_system.1010.desc.ruler:0 "[host.GetTitleAsName] evinden bu kadar uzakta ölmeyi hak etmedi."
 activity_system.1010.a:0 "Huzurlar içinde yat [host.GetFirstName]."

 activity_system.1010.tt:0 "[host.GetShortUINameNoTooltip] adlı kişinin [Concept( 'activity', 'etkinliği' )|E] iptal oldu"
 activity_system.1011.desc:0 "Süzerenim [host.GetNameRegnal] ülkeyi gezerken vefat etti. Trajik bir şekilde [host.GetDeathReason].\n\nGezinin geri kalanı iptal oldu ve maiyeti cenazesini evine getirmek için yola çıktı."
 activity_system.0300.t:0 "Savaş Kimseyi Beklemez"
 activity_system.0300.desc.intro.traveling:0 "[target_activity_location.GetName] topraklarındaki [target_activity_type.GetNameNoTooltip] için yoldayken dinlenmek için durduğum [target_activity_location.GetName] halkı bile savaş borularının sesini duyabiliyor. "
 activity_system.0300.desc.intro.activity:0 "Savaş boruları [target_activity_location.GetName] topraklarında düzenlediğim [target_activity_type.GetNameNoTooltip] sırasında bile duyulabiliyor. "
 activity_system.0300.desc.attacker:1 "[war_opponent.GetNameRegnal|U] karşısında savaşa girdim."
 activity_system.0300.desc.defender:0 "[war_opponent.Custom2('InsultNoun', ROOT.Char)|U] [war_opponent.GetNameRegnal|U] bana savaş ilan etti!\n\n"
 activity_system.0300.desc.outro:0 "[target_activity_type.GetNameNoTooltip] düzenlemek için çok hazırlık yaptım ve misafirleri evlerine geri göndermeyi hiç istemiyorum. Fakat savaş küçümsenmemeli.\n\nBelki tamamen savaşa odaklansam daha iyi olur..."
 activity_system.0300.a:0 "Savaşı buradan yönetebilirim."
 activity_system.0300.a.tt:0 "[target_activity_type.GetNameNoTooltip] devam edecek"
 activity_system.0300.b:0 "Başka bir şeyle ilgilenecek durumda değilim."
 activity_system.0300.b.tt:0 "[target_activity_type.GetNameNoTooltip] iptal edilecek ve katılımcılar evlerine dönecek"
 activity_system.0300.b.tt.cost:0 "Bazı masraflar telafi edilebilir"
 activity_system.0301.t:0 "[target_activity_type.GetNameNoTooltip] İptal Edildi"

 activity_system.0301.desc:0 "#EMP "Savaşa! Savaşa!"#! [target_activity_host.GetTitledFirstNamePossessive] [knights|l] gürleyerek geçerken haykırıyor, boruları ötüyor ve sancakları gökyüzüne karşı parıldıyor.\n\nO [war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal] bizim [target_activity_type.GetNameNoTooltip]'imize hiç saygı duymuyor, görünüşe göre! [target_activity_host.GetTitleAsNameNoTooltip] ordusunu çağırıp [target_activity_host.GetFaith.WarGodName]'den zafer dilediğinden, etkinlik iptal edilecek.\n\nBir [target_activity_type.GetNameNoTooltip] asil ve değerli bir eğlencedir, ama silahlara çağrı her şeyden daha gür yankılanır."
 activity_system.0301.a:0 "Üzdü..."
 activity_system.0310.desc.intro:0 "[target_activity_host.GetName|U] tarafından düzenlenen [target_activity_type.GetNameNoTooltip] için [target_activity_location.GetName] topraklarındayken savaş çanları çalmaya başladı.\n\n"
 activity_system.0310.desc.primary_defender: "Alçak [attacker.GetTitledFirstName|U] bana savaş ilan etmiş!"
 activity_system.0310.desc.random_defender: "[attacker.GetTitledFirstName|U] ve [defender.GetTitledFirstName|U] arasındaki savaşta yardım için çağrıldım."
 activity_system.0310.a.tt:0 "[target_activity_type.GetNameNoTooltip] etkinliğine katılmaya devam edeceksiniz"
 activity_system.0310.b.tt:0 "[target_activity_type.GetNameNoTooltip] etkinliğini bırakıp evinize doğru yola çıkacaksınız"
 activity_system.0320.t:0 "Beklenmedik Son"
 activity_system.0320.desc:1 "Ev sahibimiz [host.GetName], topraklarının kontrolünü kaybettiği için [activity_type.GetNameNoTooltip()] beklenmedik bir şekilde sona erdi.\n\nBu kadar davetiyeden ve hazırlıktan sonra böyle bir şey olabileceğini bile tahmin etmiyordum. Maiyetim ile evimize dönme zamanımız geldi..."
 activity_system.0320.a:0 "Olan oldu."
 activity_system.0330.t:0 "Âciz"
 activity_system.0330.desc.intro:0 "Âciz hâle geldiğim için ne [activity_type.GetNameNoTooltip()] ne de diğer işlerle ilgilenecek durumum yok diyorlar!\n\n"
 activity_system.0330.desc.memory:0 "[incapable_memory.GetDescription].\n\n"
 activity_system.0330.desc.outro:0 "Evime, [home.GetName] topraklarına dönmekten başka seçeneğim yok."
 activity_system.0330.a:0 "Misafirlerin yolu açık olsun."
 activity_system.0331.t:0 "Âciz"
 activity_system.0331.desc:0 "Ev sahibimiz [host.GetName], etrafındakileri tarafından Âciz olarak görülmeye başlandı ve ne [activity_type.GetNameNoTooltip()] ne de diğer işlerle ilgilenecek durumunun olmadığını söylüyorlar!\n\nEve elimiz boş döneceğiz. "
 activity_system.0331.a:0 "Yazık."
 activity_system.0400.t:0 "Gecikme"
 activity_system.0400.desc_leader:0 "[travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] utana sıkıla yanıma geldiğinde kötü haberler getirdiğini anlıyorum.\n\n"Şu an [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] kadar geciktiğimizi tahmin ediyorum efendim, zamanında istikametimize ulaşamayabiliriz.""
 activity_system.0400.desc_no_leader:0 "Gökyüzünü ve sahip olduğum her haritayı inceliyorum ama hesaplamalarım bir türlü tutmuyor.\n\n[GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] kadar gecikmiş durumdayız ve böyle yol almaya devam edersek hedefimize zamanında ulaşamayacağız."
 activity_system.0400.a:0 "Acele edelim."
 activity_system.0400.a.tt:0 "Yolda bir şekilde hızlanmayı umuyorsunuz"
 activity_system.0400.b:0 "Değmez."
 activity_system.0401.t:0 "Çok Geç"
 activity_system.0401.desc_leader:0 "[travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ümitsiz bir şekilde yaklaşıyor.\n\n"Maalesef yetişemedik efendim, etkinlik bugün başladı ve maalesef yetişemedik.""
 activity_system.0401.desc_no_leader:0 "Gün bugün. Etkinlik başladı ama çabalarıma rağmen yetişemedik.\n\nGeri dönüp eve gitmekten başka seçeneğimiz kalmadı."
 activity_system.0401.a:0 "Tüh."
