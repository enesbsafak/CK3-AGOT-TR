l_english:
 tour_travel.1001.title:1 "Bir Serf ve [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1001.desc.intro:2 "Yolculuktan yorgun düşmüş, kemiklerimi dinlendirmenin ve biraz bira bulmanın hayaliyle [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] topraklarında yerel bir tavernaya giriyorum.\n\nSessiz düşüncelerim, bir yumruğun tahtayı parçalayan gürültüsü ve ardından gelen küçümseyici bir tükürüğün sesiyle bozuldu. "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))|U] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))]!"
 tour_travel.1001.desc.mid.wrong_language:1 "Daha [angry_peasant.GetCulture.GetLanguage.GetName] bile konuşamıyor ancak kendini bizim tek gerçek efendimiz olarak görüyor!""
 tour_travel.1001.desc.mid.wrong_culture:0 "Tamamen bir yabancı! [angry_peasant.GetCulture.GetName|U] bile olmayan biri bizi nasıl yönetebilir?""
 tour_travel.1001.desc.mid.wrong_faith:0 "O [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] bir kâfirdir! Tahtta kaldığı her saniye [angry_peasant.GetFaith.HighGodNamePossessive] iradesine karşı bir hakarettir.""
 tour_travel.1001.desc.mid.pretender:0 "[ROOT.Char.GetHouse.GetName|U] Hanesi mi? Hepsinin yüzüne tüküreyim! Herkes [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] topraklarının gerçek efendilerinin [claimant_character_scope.GetHouse.GetName] Hanesi olduğunu bilir.""
 tour_travel.1001.desc.mid.powerful_diarch:0 "Sözde [ROOT.Char.GetTitleAsNameNoTooltip|U] zayıf! [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] topraklarının gerçek hükümdarı [ROOT.Char.GetDiarch.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetDiarch.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetDiarch.GetFirstName]!""
 tour_travel.1001.desc.mid.just_plain_dislike_em:0 "Böyle [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetTitleAsNameNoTooltip] olur mu? Bundan anca [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] bir aptal olur!""
 tour_travel.1001.desc.outro.nudist:1 "\n\nKendimi çok belli etmemeye çalışıyordum ancak [ROOT.Char.GetTitleAsNameNoTooltip|l] gibi tavırlarım ve bakımlı [ROOT.Char.GetHouse.GetName] vücudumun kusursuzluğu beni ele vermiş gibi görünüyor. Durum daha da kötü bir hal almadan bir şeyler düşünmeliyim."
 tour_travel.1001.desc.outro:1 "\n\nKendimi çok belli etmemeye çalışıyordum ancak [ROOT.Char.GetTitleAsNameNoTooltip|l] gibi tavırlarım ve giysilerimdeki [ROOT.Char.GetHouse.GetName] armaları beni ele verdi. Durum daha da kötü bir hal almadan bir şeyler düşünmeliyim."
 tour_travel.1001.a:0 "Yüzüme söylesene, seni [angry_peasant.Custom2('InsultNoun', ROOT.Char)]!"
 tour_travel.1001.b:0 "Belki bir vergi indirimi fikrinizi değiştirir."
 tour_travel.1001.c:0 "[ROOT.Char.GetNameNoTooltip] ile beni benzettiniz galiba!"
 tour_travel.1002.title:1 "Yabani Otlar Arasında Bir [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|U]"
 tour_travel.1002.desc:1 "[pretty_peasant_county_scope.GetName] içinden geçerken kendimi manzaranın büyüsüne kapılmış buluyorum. Gerçekten de bu [pretty_peasant_county_scope.GetProvince.Custom('TerrainTypeProvince')] tüm [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] içindeki en güzeli olmalı ve burada yaşayan insanlar ondan da güzel.\n\nMaiyetim ile bir diğer köyden geçerken burada mütevazı görevlerini yerine getiren genç ve güzel birini buluyorum ve kalbimin heyecanlandığını hissediyorum. Onu bir [pretty_peasant.Custom('LoverPetName')] gibi sıradanlık içinde izlemek istiyorum, şiirin ete kemiğe bürünmüş hâli gibi, ve ben daha düşünemeden kalbim bana maiyetimi durdurmamı emretti bile."
 tour_travel.1002.a:0 "Duygularımı belli etmeliyim."
 tour_travel.1002.b:0 "Bir şey gördüğümü sandım... devam edelim."
 tour_travel.1003.title:0 "Bir [ROOT.Char.GetTitleAsNameNoTooltip|U] ile Konuşmak"
 tour_travel.1003.desc:0 "Gezime [angry_county_scope.GetName] kırsalında devam ederken, hoşnutsuz köylülerden bir temsilciyle buluşmak için düzenlemeler yapıldığı konusunda bilgilendirildim.\n\nAcınası bir yaratık önümde sürünüyor, [angry_county_scope.GetAdjective] halkının sözde itibarı hakkında konuşuyor. Ancak kısa sürede fark ediyorum ki bu [rude_peasant.Custom2('InsultAdjective', ROOT.Char)] [rude_peasant.Custom2('InsultNoun', ROOT.Char)] bana bir kez bile unvanım ile hitap etmedi. Bu da uygun gördüğüm şekilde cezalandırabileceğim bir suçtur."
 tour_travel.1003.a:0 "Bu yaratığı beş kilometre boyunca kırbaçlatın."
 tour_travel.1003.b:0 "Bu [angry_county_scope.GetProvince.Custom('TerrainTypeProvince')], onun iç organları ile süslensin."
 tour_travel.1003.c:0 "Cehaletini bağışla."
 tour_travel.1004.title:1 "$altruism_intent_header$ Şifalı Dokunuş"
 tour_travel.1004.desc.intro:0 "Köylülere kraliyet dokunuşumu bahşetmek için, [diseased_county_scope.GetName] topraklarına geliyorum. Fakat kasabaya gelir gelmez hiç şüphesiz şimdiye kadar gördüğüm en sefil yaratıkla karşı karşıya kalıyorum. En ufak bir çekincesi olmadan nasırlı ayaklarını tertemiz ellerimden birkaç santim öteye uzatıyor.\n\n"
 tour_travel.1004.desc.outro.christian:1 "Mesih'in havarilerinin ayaklarını yıkadığı gibi, ben de [ROOT.Char.GetFaith.HighGodNamePossessive] emrine göre sadık tebaamın ayaklarını yıkamam gerekiyor."
 tour_travel.1004.desc.outro:0 "Her ne kadar bu hastalıklı fakirin huzurunda bulunmaktan nefret etsem de, dokunuşumun en yakışıksız hastalıkları bile iyileştirebileceği söylenir."
 tour_travel.1004.a.tarantino:0 "İtiraf etmekten nefret ediyorum ancak bu biraz erotik."
 tour_travel.1004.a:0 "Senin için bir lütuf, benim için kötü bir anı."
 tour_travel.1004.b:0 "Bu ceset gibi ayakları sonsuza dek ovabilirim."
 tour_travel.1004.c:0 "Belki de alnına hafif bir dokunuş yeterli olacaktır."
 tour_travel.1004.d.meat:0 "O pis sosisleri benden uzak tutun!"
 tour_travel.1004.d.two_veg:0 "O pis [ROOT.Char.Custom('get_region_root_vegetable_plural')] gözüme gözükmesin!"
 tour_travel.1005.title:1 "$altruism_intent_header$ Kraliyet Dokunuşu"
 tour_travel.1005.desc:0 "Geldiğimin haberi tüm [county_to_bless_scope.GetName] topraklarına yayılmış gibi görünüyor, zira maiyetimiz kısa süre içinde kraliyet dokunuşuyla kutsanmak için yalvaran sayısız köylü ile kuşatıldı.\n\nElbette üzerlerine kendim kutsadığım sudan bir miktar serpebilirdim ve kesinlikle bununla tatmin olurlardı ancak hastalıklı bölgelerini sürmeleri için onlara kutsanmış paralar vermek onları çok daha uzun süre mutlu ve kutsanmış tutacaktır."
 tour_travel.1005.a:0 "Kutsanmış paralar dağıtacağım."
 tour_travel.1005.b:0 "Biraz su serpmek onları tatmin edecektir."
 tour_travel.1005.c:0 "Hiçbir şey alamazlar!"
 tour_travel.1006.title:1 "$altruism_intent_header$ Yoksullar için Sadaka"
 tour_travel.1006.desc:0 "[church_barony_scope.GetNameNoTooltip|U] içindeki [county_holder_to_bless_scope.GetFaith.HouseOfWorship] yakınından geçerken buradaki pek çok kişinin ruhani ihtiyaçlarına hizmet eden bu kutsal mekânı hayranlıkla seyretmek için alayımı durduruyorum.\n\n[county_holder_to_bless_scope.GetFaith.HouseOfWorship|U] ve merdivenleri vaziyetlerini iyileştirme umudu taşıyan muhtaçlarla dolu. Bu belki de [county_to_bless_scope.GetNameNoTooltip] halkına ne kadar yüce gönüllü ve nazik bir hükümdar olabileceğimi göstermek için harika bir fırsattır."
 tour_travel.1006.a:0 "Yoksullar için sadaka!"
 tour_travel.1006.b:0 "Para istiyorlarsa, fakir doğmamaları gerekirdi."
 tour_travel.1006.c:0 "Bu haşaratları kovun!"
 tour_travel.1007.title:0 "[wise_woman_barony_scope.GetNameNoTierNoTooltip|U] Bilgini"
 tour_travel.1007.desc.intro:0 "Maiyetim ile krallığımdaki yolculuğuma devam ederken, [wise_woman_barony_scope.GetNameNoTier] topraklarının en ücra köşelerinden geçiyoruz. Böyle bir şey olacağını tahmin bile edemezken [superstituous_courtier_scope.GetName] beni bir kenara çekerek ""[wise_woman_barony_scope.GetNameNoTierNoTooltip] Bilgini"" hakkında heyecanlı bir konuşma yaptı.\n\n" ### CQC
### TODO AGOT-ONLY: tour_travel.1007.desc.mid.ill [AGOT: ]
 tour_travel.1007.desc.mid.ill:0 ""Excuse me my [ROOT.Char.GetLadyLord], but I can see you are suffering tremendously from ailment and affliction. The Wise [wise_woman_scope.GetWomanMan|U] of [wise_woman_barony_scope.GetNameNoTierNoTooltip] is just a small detour away, and I know [wise_woman_scope.GetSheHe] has exactly what you need to be your healthy self again!""
### TODO AGOT-ONLY: tour_travel.1007.desc.mid.pregnant [AGOT: ]
 tour_travel.1007.desc.mid.pregnant:0 ""My [ROOT.Char.GetTitleAsNameNoTooltip|U], I can see that you are positively glowing and radiant as always, as one should be when with child. However, I can tell that the hard work of carrying a babe is causing you great discomfort, and the Wise [wise_woman_scope.GetWomanMan] nearby will have just the remedy needed to ease that which burdens you.""
### TODO AGOT-ONLY: tour_travel.1007.desc.mid.psychological [AGOT: ]
 tour_travel.1007.desc.mid.psychological:0 ""I know you have a tortured mind, [ROOT.Char.Custom('FormOfAddressForLiege')], and it causes you great anguish. Strong as your spirit is, that which ails your mind may be remedied perhaps by some incense or medicine from the famous Wise [wise_woman_scope.GetWomanMan|U] of [wise_woman_barony_scope.GetNameNoTierNoTooltip]!""
### TODO AGOT-ONLY: tour_travel.1007.desc.mid.weakened [AGOT: ]
 tour_travel.1007.desc.mid.weakened:0 ""With your injuries, [ROOT.Char.Custom('FormOfAddressForLiege')], I fear for your continued safety and health on this tour. However, I know of a skilled physician nearby who may be able to treat your wounds. The Wise [wise_woman_scope.GetWomanMan|U] of [wise_woman_barony_scope.GetNameNoTierNoTooltip] can cure anything!""
### TODO AGOT-ONLY: tour_travel.1007.desc.mid.ugly [AGOT: ]
 tour_travel.1007.desc.mid.ugly:0 ""If I may be so bold, [ROOT.Char.Custom('FormOfAddressForLiege')], some other members of your procession have been making remarks about your... appearance. However, fret not! There is a Wise [wise_woman_scope.GetWomanMan] nearby who can cure any affliction, so they say.""
 tour_travel.1007.desc.outro:0 "\n\nŞüphelerim var ancak [superstituous_courtier_scope.GetNameNoTooltip] bu mistik şifacının erdemine o kadar inanmış görünüyor ki, ziyaret etmek için can atıyorum."
 tour_travel.1007.a:0 "Ufak bir dolambaçtan zarar gelmez."
 tour_travel.1007.b:0 "Tamamen saçmalık!"
 go_see_wise_woman_tt:0 "Bilgin'i görmeye gidersiniz, bunun olumlu ya da olumsuz sonuçları olabilir."
 tour_travel.1008.title:0 "$tour_travel.1007.title$"
 tour_travel.1008.desc.intro:0 "Akşam karanlığında Bilgin'in loş ışıklı kulübesine giriyorum, maiyetim dışarıda kalıyor. İçeride topallayarak dolaşan bu eksantrik [Select_CString(wise_woman_scope.IsFemale, 'kadının', 'adamın' )] aradığım kişi olduğundan hiç şüphem yok.\n\n""Ah, ben de sizi bekliyordum. İçeri gelsenize! Ateşimi paylaşın, [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )]."" Ben daha bir kelime bile edemeden, buz gibi elleri ellerime dolandı." ### CQC
 tour_travel.1008.desc.mid.ill:0 "Geceyi tadı kötü siyah sıvıları höpürdeterek ve sarhoş edici tütsüleri koklayarak geçiriyorum ve sabah uyandığımda kendimi yeni biri gibi hissediyorum."
 tour_travel.1008.desc.mid.pregnant:0 "Geceyi her türlü garip yiyecekle beslenerek geçiriyorum: gözbebekleri, otlar ve daha önce hiç görmediğim meyveler, tüm bunlar olurken bu garip [Select_CString(wise_woman_scope.IsFemale, 'kadın', 'adam' )] her ihtiyacımla ilgileniyor. Sabah uyandığımda kendimi canlanmış hissediyorum!"
 tour_travel.1008.desc.mid.psychological:0 "Elleri, avını kavrayacak olan büyük bir canavarın elleri gibi kafatasımı kavramak için harekete geçiyor. Geceyi anlamadığım sözler söyleyerek geçiriyoruz ve sabah uyandığımda başımın hafiflediğini hissediyorum."
 tour_travel.1008.desc.mid.weakened:0 "Yaramı her türlü yapışkan sıvı ve yakıcı otla kaplıyor ve bu işlem acı verici olsa da, ertesi gün yaramın daha da kapandığını hissediyorum."
 tour_travel.1008.desc.mid.ugly:0 "Bütün geceyi yüzümü renkli macunlar ve kremlerle köpürterek, lekelerimi ve pürüzlü noktalarımı kaplayarak geçiriyor. Sabah, yansımama bakıyorum ve iffetlileri bile şehvetten kıpkırmızı yapacak yeni biri görüyorum!"
 tour_travel.1008.desc.outro:0 "\n\nHiçbir şüphem kalmadı ve hastalıklarım iyileşti."
 tour_travel.1008.a:0 "Tıpkı sihir gibi!"
 tour_travel.1008.b:0 "O benim hekimim olmalı!"
 tour_travel.1009.title:0 "[wise_woman_barony_scope.GetNameNoTierNoTooltip] Şarlatanı"
 tour_travel.1009.desc.intro:0 "$tour_travel.1008.desc.intro$"
 tour_travel.1009.desc.mid.ill:0 "Tüm geceyi dayanılmaz derece iğrenç kokular çekerek, rahatsız edici yapışkan sıvılar içerek ve vücudumu yakan otlarla kaplanarak geçiriyorum! Tüm bu deneyim mevcut rahatsızlığıma daha da fazla mide bulantısı ve acı ekliyor ve geceyi başladığımdan daha kötü hissederek bitiriyorum."
 tour_travel.1009.desc.mid.ugly:0 "Bütün geceyi yüzümü renkli macunlar ve kremlerle köpürterek, lekelerimi ve pürüzlü noktalarımı kaplayarak geçiriyor. Sabah, yansımama bakıyorum ve beni dönüştürdüğü canavarı görünce korku içinde bağırıyorum!"
 tour_travel.1009.desc.mid.nothing:0 "Kadının istediği her şeyi yapıyorum: Bitki çayları içiyorum, uzuvlarımı ovduruyorum, alevlerin üzerinde duruyorum ve bir insanı bayıltacak kadar bitki yiyorum. Ancak tüm bunların üzerimde çok az etkisi olmuş gibi görünüyor ve geldiğimden daha iyi hissetmiyorum."
 tour_travel.1009.desc.outro:0 "\n\n[superstituous_courtier_scope.GetNameNoTooltip] bu ""bilgin"" hakkında neler duydu bilmiyorum ancak onun sıradan bir şarlatandan fazlası olmadığı anlaşıldı." ### CQC
 tour_travel.1009.a:0 "Tam bir zaman kaybı."
 tour_travel.1009.b:0 "Bir [ROOT.Char.GetTitleAsNameNoTooltip|U] kandırıldı ve bu sonucu ölüm olan bir suçtur."
 tour_travel.9010.t:0 "Eşkıyalara Dikkat Edin!"
 tour_travel.9010.desc:0 "Maiyetim ile [next_destination.GetName] topraklarına doğru planladığımız rotada ilerlemeye devam ederken [travel_leader.GetName] bizi aniden durduruyor!\n\n""Durun, sizi aptallar! Bu yolun haydutlar ve alçaklar tarafından istila edildiği söyleniyor, başka yöne gitmeliyiz!""\n\nÖnerdiği rota daha uzun ama daha güvenli olduğunu garanti ediyor." ### CQC
 tour_travel.9010.a:0 "Güvenli yoldan gidelim."
 tour_travel.9010.b:0 "Bu alçakları adaletle buluşturmalıyız!"
 tour_travel.9010.success:0 "Haydutlar yenildi"
 tour_travel.9010.failure:0 "Haydutlar sizi bozguna uğrattı"
 tour_travel.9020.t:0 "Yerel Adalet"
 tour_travel.9020.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetName] içindeki küçük bir köye varıyoruz. Vardığımızda kasaba meydanında büyük bir kargaşa görünüyor. Talihsiz bir yaratığın etrafı öfkeli köylüler tarafından sarılmış, gözlerindeki kasvetli umutsuz bakış, alayımın yaklaştığını fark ettiğinde yerini umutla dolmuş aydınlığa bırakıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], yalvarırım! Onları dinlemeyin, ben masumum! Benim kraliyet adaleti ile yargılanmama izin vermeyecek misiniz?"\n\n"
 tour_travel.9020.desc.outro.guilty:0 "Doğru, kanıtlar ikinci dereceden gibi görünüyor ama sıradan bir köylü asla [Select_CString(ROOT.Char.IsFemale, 'leydisi', 'lordu' )] ile sorgusuz sualsiz konuşmamalıdır."
 tour_travel.9020.desc.outro:0 "Kanıtlar oldukça can sıkıcı görünüyor ve o da haddini aşarak konuştu."
 tour_travel.9020.a:0 "Adalet idamı gösteriyor."
 tour_travel.9020.b:0 "Deliller anlamsız, bırakın gitsin."
 tour_travel.9020.c:0 "Onun cezası bana hizmet etmek olacak."
 tour_travel.9030.t:0 "Günah Yuvası"
 tour_travel.9030.desc.intro:0 "Gece yarısı uykumdan uyandığımda, neşeli seslerin arkamdan yaklaştığını duyuyorum. [drunky_entourage.GetName|U] görünüyor"
 tour_travel.9030.desc.mid.hashish:0 "gözleri esrardan kıpkırmızı olmuş."
 tour_travel.9030.desc.mid:0 "nefesi [ROOT.Char.Custom('RegionalAlcoholicDrink')] kokuyor."
 tour_travel.9030.desc.outro:0 "\n\n"[drunky_entourage.GetFaith.HighGodName] aşkına! [Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )], sadece birkaç dakika ötede harika bir günah yuvası var. Bir süre burada kalmalı ve neşeyle aptallaşmalıyız!"" ### CQC
 tour_travel.9030.a:0 "Şenlik ve neşe, bekleyin geliyorum!"
 tour_travel.9030.b:0 "Dikkatimizi dağıtmamalıyız."
 tour_travel.9040.t: "En Büyük Kahraman"
 tour_travel.9040.desc: "Dinlenmek için durduğumuzda yerel halkla tanışmak için mütevazı bir mekâna giriyorum. Kendimi tanıtmadan alt sınıfın gürültülü konuşmalarını dinliyorum.\n\n[Select_CString(peasant.IsFemale, 'kadın', 'adam' )] arkadaşlarıyla konuşuyor, beraber en sevdikleri efsanevi kahramanların hikâyelerini paylaşıyorlar. "...Peki ya [ROOT.Char.GetPromotedLegend.GetProtagonist.GetName]? Bu '[ROOT.Char.GetPromotedLegend.GetName]' saçmalığının geri kalanını bir kenara bırakın, öyle birinin var olduğundan bile emin değilim!"" ### CQC
 tour_travel.9040.a: "Destanımı savunmalıyım!"
 tour_travel.9040.a.success: "Köylüler senin destanına övgüler düzüyor"
 tour_travel.9040.a.failure: "Dalga geçiyorlar"
 tour_travel.9040.b: "Belli ki hikâye bi' kulağından girip diğerinden çıkmış."
 tour_general.0001.title:1 "[visiting_liege.GetTitledFirstNameNoTooltip] Geliyor!"
 tour_general.0001.desc.intro:1 "Sonunda, [visiting_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] gezisi kapsamında [ROOT.Char.GetCapitalLocation.GetName] topraklarını ziyaret eden [visiting_liege.GetTitledFirstName] ve maiyeti kapımıza geldi."
 tour_general.0001.desc.type.majesty:0 "Gelenlerin görkemli kıyafetleri ve azametli sunumu, beni huşu içine sokma çabası gibi.\n\n"
 tour_general.0001.desc.type.intimidation:0 "Sert ve disiplinli muhafızlar, korkunun günün amacı olduğunu açıkça ortaya koyuyor.\n\n"
 tour_general.0001.desc.type.taxation:0 "Hazine arabası ve vergi tahsildarları, bu ziyaretin sonucunda daha fakir olacağımı gösteriyor.\n\n"
 tour_general.0001.desc.mid.hates_liege:1 "[visiting_liege.Custom2('InsultAdjective', ROOT.Char)|U] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] sonunda kasvetli sarayından çıkıp ülkenin gerçek yüzünü görecek."
 tour_general.0001.desc.mid.lover:0 "Ona sarılmayalı çok uzun zaman oldu, belki arayı kapatmak için fırsat olur..."
 tour_general.0001.desc.mid.friend:0 "Her ne kadar formaliteden işlerle uğraşsak da, böylesine iyi bir dostun ziyareti memnuniyetle karşılanır."
 tour_general.0001.desc.mid.close_family:0 "[ROOT.Char.Custom2('RelationToMePossessive', visiting_liege)] ile çok sık görüşemesek de gelmesi çok iyi oldu, görüşmek için nadir bir fırsat."
 tour_general.0001.desc.mid.house:0 "[ROOT.Char.Custom2('RelationToMePossessive', visiting_liege)] hem vasallık bağlarını hem de [ROOT.Char.GetHouse.GetBaseName] Hanesi bağlarımızı güçlendirmeye geldi."
 tour_general.0001.desc.mid.powerful_vassal:0 "Krallığın en güçlü vasallarından biri olarak, kapıma kadar gelmesi şaşırtıcı değil."
 tour_general.0001.desc.mid.default:1 "Diyarın [Select_CString(visiting_liege.IsFemale, 'leydisini', 'lordunu' )] kendi salonlarımda kabul etmek büyük bir onur olacaktır."
 tour_general.0001.desc.phase.tour_grounds:0 "\n\n[visiting_liege.GetTitleAsNameNoTooltip|U] ile [ROOT.Char.Custom('FortifiedBuilding')] içinde ve ayrıca [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] topraklarında gezeceğiz."
 tour_general.0001.desc.phase.dinner:0 "\n\n[visiting_liege.GetTitleAsNameNoTooltip] için tam ağzına layık lüks bir akşam yemeği düzenleyeceğim, bu [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] misafirperverliğini gösterme şansı."
 tour_general.0001.desc.phase.cultural_festival:0 "\n\n[visiting_liege.GetTitleAsNameNoTooltip] en iyi [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] eğlence ve performanslarının sergilendiği bir festivali izlemeli."
 tour_general.0001.desc.outro:1 "Maiyetine de eğlence ve kalacak yerler ayarlanmalı.\n\nTek soru, kapıları açıp onu içeri alacak mıyım?"
 tour_general.0001.a:1 "Hoş geldiniz [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )]! Hoş geldiniz!"
 tour_general.0001.b:1 "Evde yokmuşuz gibi yapalım..."
 tour_general.0500.title:0 "Evde Kimse Yok"
 tour_general.0500.desc.intro:0 "Planlarımın kesintiye uğradığı ve bir sonraki kraliyet ziyaretimi gerçekleştirmemin artık mümkün olmadığı haberi bana ulaştı.\n\nBu durum gezimin sonu olduğu anlamına gelmese de büyük bir hayal kırıklığı yarattı."
 tour_general.0500.desc.self:0 "[tour_location.GetName] topraklarının yeni [Select_CString(ROOT.Char.IsFemale, 'leydisi', 'lordu' )] ben oldum, kendimden başka misafir edecek kimsem yok."
 tour_general.0500.desc.already_visited:0 "Büyük Gezi sırasında daha önce [stop_host_scope.GetName] ile görüştük ve ona ayrıcalıklı bir muamele gösteremem. Bir kez ziyarette bulunduk, daha fazlasına gerek yok."
 tour_general.0500.desc.no_longer_liege:0 "[tour_location.GetNameNoTooltip] topraklarını yöneten [stop_host_scope.GetTitleAsNameNoTooltip|U] artık bana doğrudan yanıt vermiyor."
 tour_general.0500.desc.lowly_baron:0 "[tour_location.GetNameNoTooltip|U] toprakları şu an bir [stop_host_scope.GetTitleAsNameNoTooltip|U] tarafından yönetiliyor ve bu kadar düşük statüdekileri ziyaret etmek bana yakışmaz."
 tour_general.0500.desc.leading_army:0 "[stop_host_scope.GetName|U] askerlerinin başında savaşa gitti ve artık beni misafir edemiyor."
 tour_general.0500.desc.gone_travelling:0 "[stop_host_scope.GetName|U] evini terk etti ve bilinmeyen diyarlara doğru yola çıktı."
 tour_general.0500.desc.imprisoned_by_me:0 "[stop_host_scope.GetName|U] yakalandı ve şimdi zindanımda çürüyor."
 tour_general.0500.desc.imprisoned:0 "[stop_host_scope.GetName|U] yabancı zindanlarda çürüyor."
 tour_general.0500.desc.deadly_illness:0 "[stop_host_scope.GetName|U] ölümcül bir hastalığa yakalandı ve onu ziyaret edip de ortama yayılmış zehirli havayı soluma riskini göze alamam."
 tour_general.0500.desc.incapable:0 "[stop_host_scope.GetName|U] artık bazı yetilerini kontrol edemediğinden kötü bir ev sahibi olacaktır."
 tour_general.0500.desc.gone_adventuring:0 "[stop_host_scope.GetName|U] benim ulaşmak istemediğim topraklara doğru bir maceraya atıldı."
 tour_general.0500.desc.at_war:0 "[tour_location.GetNameNoTooltip] üzerine savaşın yıkıcı gölgesi düştü ve [stop_host_scope.GetName] beni oraya gitmemem konusunda uyarmıştı."
 tour_general.0500.desc.outro:0 "\n\nBu durum gezimin sonu anlamına gelmese de büyük bir hayal kırıklığı yarattı."
 current_phase_skipped_tt:0 "Sıradaki aşama atlandı."
 tour_general.0500.a:0 "Bunu dört gözle bekliyordum..."
 tour_general.0501.title:0 "Geri Çevrilmek"
 tour_general.0501.desc:1 "Maiyetim [stop_host_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier] kapıları önünde durduğunda, [stop_host_scope.GetName] beni karşılaması için çağrılıyor. Ancak uzun süreler beklememize rağmen beni selamlamaya bir hizmetçi bile gelmiyor. Çağrı birçok kez daha yapılıyor ancak kuş cıvıltıları ve rüzgâr sesinden başka yanıt alamıyoruz.\n\nBesbelli ki kapıdan geri çevrildim ve [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.GetTitleAsNameNoTooltip] bunu yaparak kraliyeti aşağıladı!"
 tour_general.0501.a:0 "Fazla uzatmayalım."
 tour_general.0501.b:0 "Bu hakaret kısa sürede unutulmayacaktır."
 tour_general.0501.c:0 "Kırın şu lanet kapıları!"
 tour_general.0501.liege_merciful:0 "[visiting_liege.GetFirstName] sizi affetti"
 tour_general.0501.liege_angry:0 "[visiting_liege.GetFirstName] aşağılandı"
 tour_general.0501.raid:0 "[visiting_liege.GetFirstName] mülkünüzü yağmaladı"
 tour_general.1001.title:0 "$activity_tour$: Nazik Bir Talep"
 tour_general.1001.title_theft:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Nazik Bir Talep"
 tour_general.1001.intro:0 "Fark ediyorum ki [visiting_liege.GetTitledFirstName] gözünü [tour_general_3001_target_courtier.Custom('GetCourtierTrait')] ile tanınan [tour_general_3001_target_courtier.GetTitledFirstName] üzerine dikmiş."
 tour_general.1001.desc:0 "\n\nKısaca [visiting_liege.GetTitleAsNameNoTooltip], [visiting_liege.GetTitleAsNameNoTooltip] adlı kişinin sarayına taşınmak istiyor."
 tour_general.1001.desc_theft_liege:0 "\n\nEndişelerimi pek dikkate almayan [visiting_liege.GetTitleAsNameNoTooltip], görünüyor ki gece boyunca [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] ile konuşup onu kendi sarayına taşınması için ikna etmeye çalışmış."
 tour_general.1001.outro:0 "\n\nBu kesinlikle ona yardımseverliğimi göstermek için bir fırsat!"
 tour_general.1001.outro_unusual_courtier:0 "\n\n[visiting_liege.GetTitleAsNameNoTooltip] gerekçelerini düzgün bir şekilde açıklamasa da, sarayımdan onu götürmesinden pek endişe etmiyorum."
 tour_general.1001.outro_unusual_host_unusual_courtier:0 "\n\n[tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] bana lazım ve burada kalması için #EMP birkaç neden#! sıralayabilirim. Ancak..."
 tour_general.1001.outro_theft_liege:0 "\n\nBunun beni birden fazla yönden rahatsız ettiğini söylemeye gerek bile yok."
 tour_general.1001.outro_theft_liege_unusual_courtier:0 "\n\n[visiting_liege.GetTitledFirstName], [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] ile ne yapacak, onu neden istiyor, sebebini anlayamıyorum ancak o #EMP benim#! [ROOT.Char.Custom2('RelationToMeShort', tour_general_3001_target_courtier )], lanet olsun."
 tour_general.1001.a:0 "Umarım [tour_general_3001_target_courtier.GetFirstNameNoTooltip] ona iyi hizmet eder."
 tour_general.1001.a_theft_liege:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] zaten hiçbir zaman işime yaramadı."
 tour_general.1001.b:0 "Her şey karşılıklı, [visiting_liege.GetTitledFirstNameNoTooltip]."
 tour_general.1001.b.tt:0 "[tour_general_3001_target_courtier.GetFirstName], [visiting_liege.GetTitledFirstName] adlı kişinin sarayına katılması karşılığında bir iyilik istiyorsunuz"
 tour_general.1001.c:0 "Eminim [visiting_liege.GetTitleAsNameNoTooltip] bunu benim için değerli kılabilir..."
 tour_general.1001.c.tt:0 "[tour_general_3001_target_courtier.GetFirstName], [visiting_liege.GetTitledFirstName] adlı kişinin sarayına katılması karşılığında biraz altın istiyorsunuz"
 tour_general.1001.d:0 "Demek [tour_general_3001_target_courtier.GetFirstNameNoTooltip] ile ilgileniyor. Bunun #EMP tek bir#! nedeni olabilir..."
 tour_general.1001.d.flavor:0 "Şımartalım."
 tour_general.1001.d.tt:0 "[visiting_liege.GetShortUIName] ile #EMP egzotik#! bir yemek yemeyi öneriyorsun"
 tour_general.1001.d.tt_extra:0 "[visiting_liege.GetShortUIName] ya daveti kabul edecek ya da yamyamlığınızı kınayacak"
 tour_general.1001.e:0 "#EMP Şimdi öleceksin!#!"
 tour_general.1001.e.flavor:0 "[ROOT.Char.GetFaith.DevilName|U] adına!"
 tour_general.1001.e.tt:0 "[visiting_liege.GetShortUIName] ile dövüşüyorsunuz"
 tour_general.1001.e.success:0 "Saldırınız başarılı"
 tour_general.1001.e.success.tt:0 "Hayatta kaldınız"
 tour_general.1001.e.success.desc:0 "Dövüşten sağ çıktınız."
 tour_general.1001.e.bodyguard.desc:0 "Korumanız sizi kurtarmak için araya girdi."
 tour_general.1001.e.slain.tt:0 "Katledildiniz"
 tour_general.1001.e.slain.desc:0 "Dövüşü kaybettiniz."
 tour_general.1001.e.failure:0 "Saldırınız başarısız oldu"
 tour_general.1001.e.bodyguard:0 "[tour_general_1001_bodyguard.GetTitledFirstNameNoTooltip] devreye giriyor"
 tour_general.1001.f:0 "Bu kötü bir fikir gibi görünüyor."
 tour_general.1001.f_theft_liege:0 "Şu anda bu talebi kabul etmekte #EMP zorlanıyorum#!."
 tour_general.1001.f.tt:0 "Saray mensubunuzdan vazgeçmek istemiyorsunuz"
 tour_general.1002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Korkunç Derecede Görkemli Bir Yemek"
 tour_general.1002.title_vassal:0 "$activity_tour$: Korkunç Derecede Görkemli Bir Yemek"
 tour_general.1002.desc_host:0 "Masadaki tabakların sunumunu bir kez daha gözden geçiriyorum. Aşçım o kadar iyi çalışmış ki [tour_general_3001_target_courtier.GetFirstName], her küçük parçası ile bize bir ziyafet olacak. Dekor mükemmel. \n\n[visiting_liege.GetTitledFirstName] anlaştığımız gibi tek başına odaya girerken arkamı dönüyorum. Yemeklerin kokusunu içine çekerken gözlemliyorum ve ağzının köşesinde titrek bir gülümseme beliriyor. İlerliyor ve masaya oturuyor. Ben de ona katılıyorum."
 tour_general.1002.desc_liege:0 "Odaya girdiğim anda, gösterinin yıldızının [tour_general_3001_target_courtier.GetFirstName] olduğunu anlıyorum.\n\n[stop_host_scope.GetTitledFirstName] hiçbir masraftan kaçınmamış ve [tour_general_3001_target_courtier.GetFirstNameNoTooltip] en ufak parçası ile bile tüm yemeklere katkıda bulunarak enfes bir masa hâline gelmiş.\n\nHatta [tour_general_3001_target_courtier.GetFirstNameNoTooltip] adlı kişinin kafası bile içi oyulup süzüldükten sonra yeşilliklerle süslenip, özenle masanın ucuna yerleştirilmiş. Her şeyi görebilmek için bir an duraksıyorum."
 tour_general.1002.a:0 "Bu #EMP ilahi#! bir şey!"
 tour_general.1002.b:0 "... belki de sadece ufak bir ısırık."
 tour_general.1002.c:0 "Bağışçımız [tour_general_3001_target_courtier.GetFirstNameNoTooltip] için!"
 tour_general.1002.a.flavor:0 "Yumulun."
 tour_general.3001.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Kıymet Bilenin Elinde"
 tour_general.3001.desc_gluttonous_cannibal:0 "#EMP Etin iyisinden#! anlarım ve [tour_general_3001_target_courtier.GetFirstName] bu konuda gerçekten gözleri üstüne topluyor. Etkileyici vücut kütlesi dizlerimin bağını çözüyor. Onu yemek yerken izlerken ellerim titriyor, tombul yanaklarında akan yağlar inci gibi parlıyor. \n\n#EMP Çok dolgun.#! Çenemi sıkıyorum. Bunun olması gerekiyor."
 tour_general.3001.desc_gluttonous:0 "[tour_general_3001_target_courtier.GetFirstName] gerçekten de hayattan nasıl keyif alacağını bilen bir insana benziyor. Sağlamlığına ve yemek yerken aldığı saf keyfe bakınca içimde hafif bir kıskançlık hissi oluşuyor.\n\n[stop_host_scope.GetTitledFirstName], [tour_general_3001_target_courtier.GetFirstNameNoTooltip] ve yemeklerinin kalitesi hakkında konuşup durdu."
 tour_general.3001.desc_insanity_courtier:0 "[tour_general_3001_target_courtier.GetFirstName] hakkında ilginç bir şey var. Tam olarak çıkaramıyorum. Ama bugünlerde nadiren rastlanan bir gizem ve açık sözlülük havası var. \n\n[ROOT.Char.GetFaith.DevilName] çoktan almamış olsaydı, sanki ruhumun olacağı yere bakıyormuş gibi hissediyorum. \n\nAnlıyor."
 tour_general.3001.desc_beauty:0 "[tour_general_3001_target_courtier.GetFirstName] gözüme gözükür gözükmez nefesim kesildi. Sanki [ROOT.Char.GetFaith.HighGodName] bizzat ona binlerce [ROOT.Char.Custom('get_region_flower_type_plural')] güzelliğinden bahşetmiş ve ben onun narin vücut hatlarına bakarken zaman duruyor. \n\nBöyle bir güzellik bu köylü ayaktakımında heba oluyor."
 tour_general.3001.desc_intellect:0 "[tour_general_3001_target_courtier.GetFirstName] zekâsıyla beni sürekli hayrete düşürdü. Gerçek bir düşünür, yeteneklerinde ve özelliklerinde büyük bir potansiyel var. Güneşi görmeyen bir bitki gibi burada solup gitmesini izlemek yerine, kesinlikle iyi bir şekilde kullanabilirim."
 tour_general.3001.desc_physique:0 "[tour_general_3001_target_courtier.GetFirstName] koridorda yerdeki bibloyu almak için öne doğru eğildiğinde, ben de derinin altında oynayan belirgin kaslara iyice bakmak için öne doğru eğildim. Bu tür bir fiziği satın alamazsınız. Ama belki de etrafımı böyle fit insanlarla daha fazla çevrelersem...\n\n"
 tour_general.3001.desc_martial:0 "[stop_host_scope.GetTitledFirstName] adlı kişinin sarayında dövüş hünerleri deyince akla ilk [tour_general_3001_target_courtier.GetFirstName] gelir. Saldırı planlarınızı, silahlarınızı ve zekânızı keskinleştirmek için en iyi yaklaşımı tartışmak istiyorsanız, ona gidersiniz. Bu çok aranan bir yetenek ve benim ilgimi çeken bir şey.\n\n"
 tour_general.3001.desc_diplomacy:0 "[tour_general_3001_target_courtier.GetFirstName], diplomatik becerileri ile beni hayrete düşürüyor. [ROOT.Char.GetFaith.ReligiousHeadName] ile bile çok rahat iletişim kurabiliyor ve hatta öyle ki bir seferinde ona donunun gözüktüğünü söylemişti ve buna rağmen karşılığında birkaç altın, bir gülümseme ve bir 'teşekkürler' alabildi."
 tour_general.3001.desc_stewardship:0 "[tour_general_3001_target_courtier.GetFirstName] zenginlik hakkında sonsuz bir bilgi hazinesidir. Bazı idarecilik konularında [stop_host_scope.GetTitledFirstName] ile tartıştıkları için pek çok fikrini uygulayamıyor. \n\nBöyle bir yeteneğin boşa gitmesi çok yazık olur."
 tour_general.3001.desc_intrigue:0 "[tour_general_3001_target_courtier.GetFirstName] tam tepeme gelene, [tour_general_3001_target_courtier.Char.Custom2('RelationToMePossessive', stop_host_scope )] [stop_host_scope.Char.Custom2('RelationToMeShort', visiting_liege )] için selam verene kadar onu fark etmedim. Şimdi onu saraydaki insan grupları arasında zahmetsizce hareket ederken gözlemliyorum. Gözleri sürekli açık, aynı anda her yöne bakıyor ama hiçbir yöne de bakmıyor. \n\nBu benim ilgimi çekiyor."
 tour_general.3001.desc_learning:0 "Bilgili biri olan [tour_general_3001_target_courtier.GetFirstName], az önce reddiyesini sunduğu bilimsel ifadeyi savunacak birisi var mı diye parlak gözleri ile odayı taradı. Ancak kimse meydan okumayı denemedi, bu da onu hayal kırıklığına uğrattı. \n\nTartışmanın yapılması gereken zekâ seviyesi düşünüldüğünde buna şaşmamak gerekir. Etkilendim. \n\nBu tür bir zekâya rastlamak zor."
 tour_general.3001.desc_prowess:0 "Çevik ve av üstündeki bir [ROOT.Char.Custom('GetAnimalType')] gibi odada yürüyen [tour_general_3001_target_courtier.GetFirstName], insanları etkilemekten geri kalmıyor. Koridorda gözden kaybolurken, gözlere bir senfoni gibi gelen hareketlerini takip ediyorum. \n\nNasıl da maharetli!"
 tour_general.3001.desc_outro:0 "Onu sarayıma #EMP almalıyım#!."
 tour_general.3001.a:0 "Artık sarayımın bir parçasısınız. Neşelenin."
 tour_general.3001.a.flavor:0 "Artık benim."
 tour_general.3001.a.tt:0 "Görev Yeri Değiştirilen Saray Mensubu"
 tour_general.3001.a_cannibal:0 "Ne kadar da lezzetli bir katkı!"
 tour_general.3001.a_cannibal.flavor:0 "İyi beslendiğinden emin olacağım..."
 tour_general.3001.a_insanity:0 "Yapılması gereken budur."
 tour_general.3001.a_insanity.flavor:0 "#EMP Biliyor!#!"
 tour_general.3001.b:0 "Eminim [stop_host_scope.GetTitledFirstNameNoTooltip] bunu dert etmeyecektir."
 tour_general.3001.b_host_decides.tt:0 "[stop_host_scope.GetShortUIName] bundan sonra ne olacağına karar verir"
 tour_general.3001.b.harmful_sideeffects.tt:0 "[stop_host_scope.GetShortUIName] adlı kişinin kişiliği nedeniyle bunun ölümcül sonuçları olabilir"
 tour_general.3001.b_liege_decides.tt:0 "[visiting_liege.GetShortUIName] bundan sonra ne olacağına karar verir"
 tour_general.3001.c:0 "Gecenin karanlığında #EMP kaybolabilirdi#!..."
 tour_general.3001.c.tt_success:0 "Gizlice Götürüldü"
 tour_general.3001.c.tt_failure:0 "Başarısız Girişim"
 tour_general.3001.c.tt_failure.desc:0 "Başarısızlığınız gözden kaçmadı."
 tour_general_3001_stolen_courtier:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] kimse fark etmeden sarayıma katıldı"
 tour_general_3001_failed_steal:0 "[stop_host_scope.GetTitledFirstNameNoTooltip] bunu öğrendi"
 tour_general.3001.d:0 "Bu çok saçma."
 tour_general.3001.d_cannibal:0 "Hayır. Diyete başlamam lazım."
 tour_general.3001.d_cannibal.flavor:0 "#EMP Cık cık cık#!""
 tour_general.3001.d_insanity:0 "Hayır. [ROOT.Char.GetFaith.random_EvilGodNames] ile kendim mücadele etmeliyim."
 tour_general.3001.d_insanity.flavor:0 "Artık her şey bana bağlı!"
 tour_general.3001.tt_positive:0 "[visiting_liege.GetShortUIName] Teklifinizi Kabul Etti"
 tour_general.3001.tt_negative:0 "[visiting_liege.GetShortUIName] Teklifinizi Reddetti"
 tour_general.3001.desc_negative:0 "[visiting_liege.GetShortUIName] saray mensubuna olan ilgisini kaybetti."
 tour_general.3002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Talep Kabul Edildi"
 tour_general.3002.title_denied:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Talep Reddedildi"
 tour_general.3002.intro:0 "[stop_host_scope.GetTitledFirstName] doğrudan benimle konuşuyor.\n\n'[stop_host_scope.Custom2('RelationToMeShort', ROOT.Char )], bu konu üzerinde düşündüm ve şu sonuca vardım, "
 tour_general.3002.desc_free:0 "[tour_general_3001_target_courtier.GetFirstName] memnuniyetle yüce sarayınıza katılacaktır.'"
 tour_general.3002.desc_hook:0 "burada yapacağınız bir iyiliğin karşılığını gelecekte bir iyilikle alabilirsiniz... ?'"
 tour_general.3002.desc_gold:0 "sevgili [tour_general_3001_target_courtier.GetFirstName] bizden giderse üzüntüsüne dayanamayız, belki biraz altın üzüntümüze iyi gelir."
 tour_general.3002.desc_cannibal:0 "Daha da iyi bir fikrim var. [tour_general_3001_target_courtier.GetFirstName] hoşunuza gittiyse buna #EMP bayılacaksınız#! [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Bunun için #EMP ölünür#!.'\n\n[tour_general_3001_target_courtier.GetFirstName] ile bakıştıktan sonra bir şey işaret etmek ister gibi doğrudan bana bakıyor."
 tour_general.3002.desc_declined:0 "Bu talebi kabul edemem. [tour_general_3001_target_courtier.GetFirstName] benim sarayım için çok değerli.'\n\nBakışları odanın içinde garip bir şekilde dolaşmaya başlar."
 tour_general.3002.a:0 "Çok minnettarım!"
 tour_general.3002.b:0 "#EMP Alabileceğim#! bir şey için neden takas yapayım?"
 tour_general.3002.b_declined:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] #EMP benim#!."
 tour_general.3002.c:0 "Bir iyilik mi? Kulağa adil geliyor."
 tour_general.3002.d:0 "Birazcık altın mı? Güzel anlaşma."
 tour_general.3002.e:0 "Şöyle bir düşündüm de..."
 tour_general.3002.f:0 "#EMP Amanın...#!"
 tour_general.3002.g:0 "Bu aşağılık davranış sona ermeli!"
 tour_general.3002.h:0 "Bu talihsiz bir durum."
 tour_general.3002.h.tt:0 "[visiting_liege.GetShortUIName] Memnun Değil"
 tour_general.3002.h.tt.desc:0 "[visiting_liege.GetShortUIName] kararınızdan memnun değil."
 tour_general.0510.title:0 "Bir Veda Talebi"
 tour_general.0510.desc:0 "[ROOT.Char.GetCurrentLocation.GetName] için düzenlediğim ziyaretini tamamladım ve şimdi kafilem yola çıkmak için hazırlanıyor.\n\n[stop_host_scope.GetName] ve maiyeti beni uğurlamak için düzgün bir şekilde sıraya giriyorlar ve herkesin hazır bulunması ile birlikte haraç toplama vakti geldi."
 tour_general.0510.a:0 "Haraç vakti."
 tour_general.0510.b:0 "Hiçbir talepte bulunmuyorum."
 tour_general.0511.title:0 "Bir Veda Hediyesi"
 tour_general.0511.desc:0 "[visiting_liege.GetName] için veda vakti geldi ve söylemeliyim ki cömert bir ev sahibi olduğumu hissediyorum.\n\nAncak görünen o ki [visiting_liege.GetName] ev sahipliğimin yeterli olmadığını düşünüyor ve benden bir talepte bulunuyor.\n\n"
 tour_general.0511.desc.kneel:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] önünde, tüm sarayın görebileceği şekilde diz çökmemi ve taca olan bağlılığımı göstermemi talep ediyor."
 tour_general.0511.desc.money:0 "Yolculuğu sırasında yaptığı tüm harcamalar için bana bir fatura sundu. Masrafların çoğu sahte görünse de, ödemek zorundayım."
 tour_general.0511.desc.factions:0 "Bana elini uzatıyor ve kraliyet iradesine asla karşı gelmeyeceğime yemin ederek kendisi için ve [visiting_liege.GetPrimaryTitle.GetName] için sadakat yemini etmemi istiyor."
 tour_general.0511.a:0 "Kabul ediyorum."
 tour_general.0511.gave_demand:0 "[stop_host_scope.GetName] boyun eğdi."
 tour_general.0511.b:0 "Böyle bir şey yapmayacağım!"
 tour_general.0512.title:0 "Bir Veda Vakti"
 tour_general.0512.desc:0 "[visiting_liege.GetName] için veda vakti geldi ve söylemeliyim ki, yüce gönüllü bir ev sahibi olduğumu hissediyorum.\n\nEv sahibi olarak gösterdiğim performanstan tamamen memnun görünüyor ve benden tekrar görüşebileceğimize dair söz istemekten başka bir şey talep etmedi."
 tour_general.0512.a:0 "Çok iyi."
 tour_general.0513.title:0 "Talep Reddedildi"
 tour_general.0513.desc:0 "[stop_host_scope.GetName] otoriteme meydan okudu ve taleplerime boyun eğmeyi reddetti. Şu anda yapabileceğim çok az şey var ama böyle bir hakaret sadece bana karşı değil, bizzat ülke karşısında da bir suç teşkil eder!"
 tour_general.0513.a:0 "Bu kısa sürede unutulmayacaktır."
 tour_grounds_events.1001.title:0 "Avcılık Hüneri"
 tour_grounds_events.1001.desc.intro:0 "[visiting_liege.GetName] ile arazimde gezerken, onu etkilemek için önümde pek çok fırsat var."
 tour_grounds_events.1001.desc.mid:0 "\n\nFırsatlardan biri de[touring_grounds_scope.GetNameNoTooltip] topraklarındaki av alanlarını göstermek ve belki de avcılık hünerlerimle efendimi etkilemek olabilir!"
 tour_grounds_events.1001.desc.outro:0 "Avcılık alanında kazanacağım bir zafer, diyarda değerli bir [ROOT.Char.GetTitleAsNameNoTooltip] olarak statümü kesinlikle sağlamlaştıracaktır. Ancak aynı şekilde bir başarısızlık da derin bir utanç olacaktır."
 tour_grounds_events.1001.a:0 "Asla ıskalamam!"
 tour_grounds_events.1001.b:0 "Belki başka bir şey onu etkileyebilir..."
 tour_grounds_events.1002.title:0 "Bir Komplo"
 tour_grounds_events.1002.desc:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] [touring_grounds_scope.GetNameNoTooltip] topraklarında dolaşırken, aklıma birden kurnazca bir şaka fikri geliyor. Sanki [ROOT.Char.GetFaith.TricksterGodName] zihnimi ele geçirmiş gibi birden bir suikast girişimi tasarlıyorum, tabi bu misafirlerimizi eğlendirecek bir tiyatro!\n\n[visiting_liege.GetNameNoTooltip] hikâyenin baş kahramanı olacak, partiye yapılan suikast girişimini engelleyecek ve "suikastçıyı" kaçırtacak! [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] düşmanlarının bir parodisi olacak bu hikâye eminim [visiting_liege.GetNameNoTooltip] tarafından beğenilecek ve gururunu okşayacak!"
 tour_grounds_events.1002.a:0 "Ayarlamalar yapılsın!"
 tour_grounds_events.1002.b:0 "Yapmayalım."
 tour_grounds_events.1003.title:0 "$murder_outcome.5001.t$"
 tour_grounds_events.1003.desc.intro:0 "[touring_grounds_scope.GetNameNoTooltip] topraklarındaki gezime devam ederken, etraftan tanıdık olmayan sesler duyuyorum. Birdenbire, tüm grubumun etrafının bıçakları ve yayları doğrudan bana doğrultulmuş kukuletalı adamlarla çevrili olduğunu görüyorum!\n\nSuikastçılardan biri bana doğru adım atıyor ve bıçağını sertçe yanıma bastırıyor. "Mutlu avlar, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. [ROOT.Char.GetTitleAsNameNoTooltip] avlamaya geldik!""
 tour_grounds_events.1003.desc.paranoid:0 "\n\nDonup kalmış bir hâldeyken kalbimin hızla çarptığını ve tüm vücudumu soğuk bir terin kapladığını hissediyorum. Suikastçı bana bilmiş bir şekilde göz kırpıyor ve silahını işaret ediyor, zaferleriyle övünüyor. Hayatım bir sonraki hamleme bağlı, ne yapmalıyım?"
 tour_grounds_events.1003.desc.not_paranoid:0 "\n\nİlk başta irkilsem de, bunun sadece bir oyun olduğunu hemen anlıyorum. "Suikastçı" bana göz kırpıyor ve silahlarının tamamen ahşaptan yapıldığını ve her iki tarafının kör olduğunu gösteriyor. Benden rol yapmamı ve hayatıma yönelik bu girişimi engellememi bekliyorlar."
 tour_grounds_events.1003.a.paranoid:0 "$murder_outcome.5001.not_my_time$"
 tour_grounds_events.1003.a:0 "Al bakalım, [fake_assassin_scope.Custom2('InsultNoun', ROOT.Char)]!"
 tour_grounds_1002.assassination_was_fake:0 "Suikast Sahteydi"
 tour_grounds_1002.liege_believed_it_was_real:0 "[visiting_liege.GetName] Suikastın Gerçek Olduğuna İnandı"
 tour_grounds_1002.liege_played_along:0 "[visiting_liege.GetName] Çok Eğlendi"
 tour_grounds_1002_likes_tt:0 "Eğer [visiting_liege.GetName] bundan eğlendiyse"
 tour_grounds_1002_dislikes_tt:0 "Eğer [visiting_liege.GetName] bunu beğenmediyse"
 tour_grounds_1002_murder_tt:0 "Eğer [visiting_liege.GetName] bunun gerçek olduğuna inanıyorsa"
 tour_grounds_events.1003.b:0 "Ben ozan değilim! Bırakın beni!"
 tour_grounds_1002.liege_begrudgingly_played_along:0 "[visiting_liege.GetName] Eğlenmedi"
 tour_grounds_events.1003.c:0 "Savaşmadan beni alamayacaklar!"
 tour_grounds_events.1004.title:0 "Yabanda Bir An"
 tour_grounds_events.1004.desc.intro:0 "Bir an için kendimi [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ile birlikte [touring_grounds_scope.GetNameNoTooltip] topraklarındaki avlanma alanında baş başa kalmış buluyorum. Ona olan tutkumun peşinden gitmeme fırsat veren çok nadir bir an."
 tour_grounds_events.1004.desc.already_shagging:0 "\n\nKalplerimiz ve bellerimiz zaten birbirimize ait olsa da, hükümdar olmak bize tutkularımızın peşinden gitmek için çok az zaman veriyor ancak şimdi vahşi doğadaki hayvanlar gibi olma fırsatımız var."
 tour_grounds_events.1004.desc.trying_to_shag:0 "\n\nBelki de bu, sonunda duygularımın bilinmesine izin verme fırsatımdır ve eğer o da aynı şeyi hissederse, sonunda sadece '[visiting_liege.GetTitleAsNameNoTooltip]' ve '[ROOT.Char.GetTitleAsNameNoTooltip]' değil, tutkunun sancılarını çeken iki aşık olabiliriz."
 tour_grounds_events.1004.desc.outro:0 "\n\nHayat anlardan oluşur ve böyle nadir anlara çok az rastlanır. Bu duygularla hareket edebilir miyim?"
 tour_grounds_events.1004.a:0 "Dürtülerime güveniyorum."
 tour_grounds_events.1004.b:0 "En iyisi boş vermek."
 tour_grounds_events.1005.title:0 "$tour_grounds_events.1004.title$"
 tour_grounds_events.1005.desc.intro:0 "Kendimi [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ile [touring_grounds_scope.GetNameNoTooltip] topraklarındaki avlanma alanında yalnız buluyorum, sadece ara sıra yakındaki bir hayvanın sesiyle bozulan sessizliğin tadını çıkarıyorum."
 tour_grounds_events.1005.desc.already_shagging:0 "[stop_host_scope.GetNameNoTooltip] birden vahşi bir [stop_host_scope.Custom('GetAnimalType')] gibi üzerime atılıyor, beni bir kayaya yaslarken gözlerindeki ateşi görüyorum.\n\n"Seni yalnız görebildiğim çok nadir oluyor [ROOT.Char.Custom('LoverPetName')] ve burada sadece kuşlar ve hayvanlar şahitken yalnız sayılırız. Sonunda birbirimize olan tutkularımızı kucaklayalım!""
 tour_grounds_events.1005.desc.trying_to_shag:0 "[stop_host_scope.GetNameNoTooltip], tıpkı avını süzen bir [stop_host_scope.Custom('GetAnimalType')] gibi bana bakıyor.\n\n"Sevgili [ROOT.Char.GetTitleAsNameNoTooltip], bu [touring_grounds_scope.Custom('TerrainTypeProvince')] boyunca gezdiğimiz yerlerde gördüğüm tüm yaratıklardan daha ilahi göründüğünüzü söylemeliyim."\n[stop_host_scope.GetNameNoTooltip] gözlerindeki o yırtıcı bakışla bana doğru geliyor ve çekimserliğimin çözüldüğünü hissediyorum."
 tour_grounds_events.1005.desc.outro:0 "\n\n[stop_host_scope.GetTitleAsNameNoTooltip] bana bakarken ben de şaşkına dönmüş bir hâlde onun baştan çıkarıcı gözlerine bakıyorum. Geziye çıkmış bir [ROOT.Char.GetTitleAsNameNoTooltip] böyle bir yerde tutku dolu bir an yaşabilir miydi gerçekten?"
 tour_grounds_events.1005.a:0 "Al beni!"
 tour_grounds.moment_in_the_woods:0 "[visiting_liege.GetName] Unutamayacağı Bir An Yaşadı"
 tour_grounds_events.1005.b:0 "Uzak dur benden seni şehvet düşkünü [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]!"
 tour_grounds.rebuffed_in_the_woods:0 "[visiting_liege.GetName] Tekliflerinizi Reddetti"
 tour_grounds_events.1006.title:0 "Patavatsız"
 tour_grounds_events.1006.desc.intro:0 "[touring_grounds_scope.GetNameNoTooltip|U] gezisi sırasında [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ile"
 tour_grounds_events.1006.desc.mid.martial:0 "savaşın ve çekişmenin görkemi hakkında konuşurken,"
 tour_grounds_events.1006.desc.mid.learning:0 "[ROOT.Char.GetFaith.HighGodNamePossessive] insanlık için ilahi planı hakkında konuşurken,"
 tour_grounds_events.1006.desc.mid.stewardship:0 "devlet yönetiminin ve muhasebenin incelikleri hakkında konuşurken,"
 tour_grounds_events.1006.desc.mid.diplomacy:0 "diplomasi ve yatıştırma sanatı hakkında konuşurken,"
 tour_grounds_events.1006.desc.mid.intrigue:0 "bilgi ve aldatmanın önemi hakkında konuşurken,"
 tour_grounds_events.1006.desc.outro:0 "konuyu benden daha iyi bildiğini düşünen [landless_courtier_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] tarafından lafımız bölündü.\n\nNe olursa olsun, sıradan bir saray mensubunun bir [visiting_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ile [ROOT.Char.GetTitleAsNameNoTooltip|U] arasındaki konuşmayı bölmesi son derece uygunsuzdur."
 tour_grounds_events.1006.a:0 "Kes sesini seni [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
 tour_grounds_events.1006.b:0 "Görmezden gel ve devam et."
 tour_grounds_events.1007.desc.intro:0 "[touring_grounds_scope.GetNameNoTooltip] gezisi sırasında [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ile"
 tour_grounds_events.1007.desc.outro:0 "saray mensuplarından biri tarafından lafı bölündü.\n\n[Select_CString(landless_courtier_scope.IsFemale, 'Kadın', 'Adam' )] efendisi tarafından susturuldu ancak konuşabildiği kısa sürede bile ettiği bilgelik dolu laflar, konu hakkında efendisinin hayal bile edebileceğinden çok daha fazlasını bildiğini kanıtlıyor.\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] onu dinlemek istemiyorsa, belki de benim sarayıma katılmaya istekli olabilir."
 tour_grounds_events.1007.a:0 "Sarayımda bana katıl!"
 tour_grounds_events.1007.b:0 "İnsan patavatsız olmamalı."
 tour_grounds_events.1007.c:0 "Bu apaçık bir suçtur!"
 tour_grounds.recruited_my_courtier:0 "[landless_courtier_scope.GetName] Ayrılmak İstedi"
 tour_grounds_events.1017.desc.outro:0 "saray mensuplarından biri tarafından lafı bölündü.\n\nSaray mensubu patavatsız konuşmasına rağmen [stop_host_scope.GetNameNoTooltip] garip bir şekilde onu azarlamadı ve doğrudan benimle konuşmasına izin verdi.\n\nSöyleyecekleri oldukça ilginç olsa da, bu sosyal görgü kurallarını çiğnemesi beni oldukça hazırlıksız yakaladı."
 tour_grounds_events.1017.a:0 "Dinleyeceğim."
 tour_grounds_events.1008.title:0 "Hayalet Hikâyeleri"
 tour_grounds_events.1008.desc.intro:0 "Gezimize ara verdiğimizde, genç [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )] hâlâ enerjik gözüküyor ve alayın geri kalanı dinlenirken eğlendirilmesini talep ediyor.\n\nNeyse ki [storyteller_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] hevesle bu görevi üstleniyor ve yerel efsaneleri anlatmaya başlıyor. "Bu [touring_grounds_scope.Custom('TerrainTypeProvince')], senin görebildiğinden daha fazlasına ev sahipliği yapıyor [visiting_liege.Custom('GetLassLad')]."
 tour_grounds_events.1008.desc.mid.banshee:0 "[touring_grounds_scope.GetNameNoTooltip] yabanlarına kudretli bir ölüm perisi musallat olmuş ve sizi uyarıyorum: onun sesini duyarsanız, yakınınızdaki birinin sonunun geleceğinden emin olabilirsiniz.""
 tour_grounds_events.1008.desc.mid.ghul:0 "[touring_grounds_scope.GetNameNoTooltip] mezarlıklarında korkunç bir hortlak dolaşıp insan eti yiyor ve sizi görürse menüsünde bir [visiting_liege.GetTitleAsNameNoTooltip|U] istediğine karar verebilir!""
 tour_grounds_events.1008.desc.mid.azdaha:0 "Büyük ve korkunç bir Azhdaha ayaklarımızın hemen altına gizlenmiş, bekliyor. Fırsatını bulduğunda, büyük ve keskin dişleriyle yerden fırlayacak ve sizi yutacak!""
 tour_grounds_events.1008.desc.mid.sasabonsam:0 "Korkunç Sasabonsam buralarda yaşıyor, muhtemelen şu anda biz konuşurken bizi izliyor, görüş alanımızın dışında. Gardınızı düşürürseniz, yukarıdan iner ve korkunç demir dişleriyle kanınızı emer, ta ki siz de onun kadar pembe ve kanlı olana kadar!""
 tour_grounds_events.1008.desc.mid.ankou:0 "Ankou'nun kendisi ölü arabasıyla buralarda dolaşıyor, kayıp ruhları topluyor ve onları Tanrı bilir nereye götürüyor. Gözünü dört aç [visiting_liege.Custom('GetLassLad')], yoksa seni de götürür.""
 tour_grounds_events.1008.desc.mid.witt_wieven:0 "Ak kadınlar burada aramızda yaşıyorlar ve yoldan çıkarmak için sizin gibi küçük [visiting_liege.GetLadyLord] arıyorlar. Geçmişte yaşamış cadıların hayaletleri sizi alıp götürecek ve [ROOT.Char.GetFaith.DevilNamePossessive] işini yapacaklar.""
 tour_grounds_events.1008.desc.mid.baba_yaga:0 "Korkunç cadı Baba Yaga buralarda sihir yapıyor. Buraya aitmiş gibi görünmeyen kulübelere dikkat edin, yoksa etinizi yer ve kemiklerinizle süsler.""
 tour_grounds_events.1008.desc.mid:0 "Buralarda dolaşan pek çok korkunç şey var, doğal olmayan şeyler. Ve hepsi de menüsüne küçük bir [visiting_liege.GetTitleAsNameNoTooltip|U] eklemekten çekinmez.""
 tour_grounds_events.1008.desc.outro:0 "\n\n[storyteller_scope.GetFirstNameNoTooltip] anlattığı şüpheli hikâyelerle [visiting_liege.GetFirstNameNoTooltip] üzerinde bir etki oluşturduğu bariz belli. Belki de müdahale etmeliyim."
 tour_grounds_events.1008.a:0 "Sonra ne olmuş?"
 tour_grounds_events.1008.b:0 "[storyteller_scope.GetFirstNameNoTooltip], sessizlik!"
 tour_grounds_events.1009.title:0 "$tour_grounds_events.1008.title$"
 tour_grounds_events.1009.desc.intro:0 "Kafilemizin yaşlı üyeleri gezintiye ara vermek için durdular ama ben daha yorulmadım ve bu halsiz moruklara karşı sabırsızlanmaya başlıyorum.\n\nNeyse ki [storyteller_scope.GetName] beni buradaki korkunç hikâyelerle eğlendirmeye hevesli görünüyor. "Bu [touring_grounds_scope.Custom('TerrainTypeProvince')], senin görebildiğinden daha fazlasına ev sahipliği yapıyor [visiting_liege.Custom('GetLassLad')]."
 tour_grounds_events.1009.desc.mid.finished:0 "\n\nÇok geçmeden [stop_host_scope.GetName] geliyor ve o da hikâyeler anlatmaya bşalıyor. Beni dehşete düşürmekten de öte, ikisinin hikâyesine kapılıyorum."
 tour_grounds_events.1009.desc.outro.interrupted:0 "\n\nTam hikâye ilginçleşmeye başlamıştı ki, [stop_host_scope.GetName] araya girdi ve artık durmamız için ısrar etti ve bütün hikâyenin saçmalıktan başka bir şey olmadığını söyledi."
 tour_grounds_events.1009.a:0 "Ne harika hikâye ama!"
 tour_grounds_events.1009.b:0 "Korkunçtu."
 tour_grounds_events.1009.c:0 "En güzel yerinde durdurdun!"
 tour_grounds_events.1009.d:0 "Çok şükür durdunuz."
 tour_grounds_events.1010.title:0 "[rival_courtier.GetFirstNameNoTooltip]: Sadık Küheylan"
 tour_grounds_events.1010.desc:0 "Bütün gün kendi bineklerimizle arazide gezinirken, birden aklıma ilham verici bir fikir geldi!\n\n[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ve [rival_courtier.GetName] arasındaki rekabeti herkes bilir, rakibini yakalayıp eyerleyip bir at gibi gezdirirsem [visiting_liege.GetTitleAsNameNoTooltip] bundan çok memnun kalır ve gözüne girerim!\n\nElbette tek zorluk onu buraya getirmek olurdu ama benim de kendi yöntemlerim var..."
 tour_grounds_events.1010.a:0 "Yapalım şu işi!"
 tour_grounds_events.1010.b:0 "Çok riskli."
 tour_grounds_events.1011.title:0 "$tour_grounds_events.1010.title$"
 tour_grounds_events.1011.desc:0 "[touring_grounds_scope.GetNameNoTooltip] topraklarında ilerlerken, aniden yolun ortasında ev sahibim [stop_host_scope.GetName] tarafından durduruluyorum.\n\nGörünüşe göre [rival_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] onun tarafından yakalanmış ve bir at gibi eyerlenmiş, binip de kırlarda sürmem için hazır!\n\nDoğuştan gelen üstünlüğümü göstermek için mükemmel bir fırsat olsa da, gerçekten bu kadar alçalacak mıyım?"
 tour_grounds_events.1011.a:0 "Elbette alçalacağım!"
 tour_grounds_events.1011.b:0 "[rival_courtier.GetFirstNameNoTooltip] dahi böyle bir aşağılanmayı hak etmiyor."
 tour_grounds_events.1012.title:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] Gibi Bir [stop_host_scope.Custom('get_region_root_vegetable')|U]"
 tour_grounds_events.1012.desc:0 "[visiting_liege.GetName] belki alışık olduğu konforu ve ihtişamı mütevazı evimizde bulamayabilir ancak savurganlıktaki eksikliğimizi konaklama ve cömertlikle fazlasıyla telafi edebiliriz.\n\n[visiting_liege.GetTitleAsNameNoTooltip] için hediyem olmadığı için endişeleniyordum, ancak birden mucizevi bir şekilde tıpkı [visiting_liege.GetNameNoTooltip] gibi gözüken bir [ROOT.Char.Custom('get_region_root_vegetable')] gördüm! [ROOT.Char.Custom('get_region_root_vegetable')|U] ikizini görünce [touring_grounds_scope.GetNameNoTooltip] gezini asla unutmaz! Yine de kendisini bir [ROOT.Char.Custom('get_region_root_vegetable')] ile kıyasladığım için kolayca gücenebilir."
 tour_grounds_events.1012.a:0 "Ben de mükemmel hediye diye bir şey yok sanıyordum."
 tour_grounds_events.1012.b:0 "[ROOT.Char.Custom('get_region_root_vegetable')|U] işime yaramaz."
 tour_grounds_events.1012.c:0 "Bu bir servet değerinde olmalı!"
 tour_grounds_events.1012.d:0 "Kendime saklayayım... kişisel kullanım için."
 turnip_that_looks_like_liege:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] Gibi Bir [ROOT.Char.Custom('get_region_root_vegetable')|U]"
 turnip_that_looks_like_liege_description:0 "Basit bir [ROOT.Char.Custom('get_region_root_vegetable')], [visiting_liege.GetName] ile çarpıcı derecede aynı gözüküyor."
 tour_grounds_events.1013.title:0 "$tour_grounds_events.1012.title$"
 tour_grounds_events.1013.desc:0 "[touring_grounds_scope.GetNameNoTooltip], medeni bir bölge olarak kabul edebileceğim bir yer olmaktan çok uzak. Neredeyse hiç kimse burayı evi olarak görmüyor ve imkânlar da arzulananı karşılamıyor.\n\nBugün [stop_host_scope.GetTitleAsNameNoTooltip] bana, tıpkı bana benzediğini iddia ettiği basit bir [stop_host_scope.Custom('get_region_root_vegetable')] hediye ederek beni etkilemeyi düşündü.\n\nİlk başta gözlerimi deviriyorum ama çok geçmeden benzerliği fark ediyorum..."
 tour_grounds_events.1013.a:0 "Ne muhteşem bir nesne!"
 tour_grounds.liege_impressed:0 "[visiting_liege.GetName] Etkilendi"
 tour_grounds_events.1013.b:0 "İğrenç. Kurtul şundan."
 tour_grounds.liege_insulted:0 "[visiting_liege.GetName] Hakarete Uğradı"
 tour_grounds_events.1014.title:0 "[visiting_liege.GetNameNoTooltip]: Küçük Avcı"
 tour_grounds_events.1014.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] [touring_grounds_scope.GetNameNoTooltip] topraklarında avlanmak ve zafer peşinde koşmak için tıpkı bir yetişkin gibi hevesli görünüyor.\n\nAncak, bu kadar küçük bir çocuğun bir [ROOT.Char.Custom('GetAnimalType')] tarafından canlı canlı parçalanabileceği bir yerde koşturmasına vicdanım el vermiyor.\n\nAncak, gerçek hayvanların tehlikesi olmadan sahte bir av düzenleyerek küçük [Select_CString(visiting_liege.IsFemale, 'leydinin', 'lordun' )] gururunu okşayabilirim."
 tour_grounds_events.1014.a:0 "Eminim ki o da sevecektir!"
 tour_grounds_events.1014.b:0 "Tam bir zaman kaybı."
 tour_grounds_events.1015.title:0 "Bir Gösteri Avı"
 tour_grounds_events.1015.desc:0 "Tıpkı bir [ROOT.Char.GetTitleAsNameNoTooltip] gibi açık havada dolaşmak ve kendime taze bir av yakalamak için can atıyordum ve şimdiye kadar büyüklerim ve koruyucularım tarafından bu fırsattan mahrum bırakıldım.\n\nAncak bugün [stop_host_scope.GetName] bana geldi ve gerçek bir avcı olarak [touring_grounds_scope.GetNameNoTooltip] topraklarında avlanmamı teklif etti!\n\nAvlanma yerine geldiğimde beni vahşi bir [stop_host_scope.Custom('GetAnimalType')] değil, [stop_host_scope.Custom('GetAnimalType')] gibi hazırlanmış bir tahta yığını karşıladı."
 tour_grounds_events.1015.a:0 "Canavarı öldüreceğim!"
 tour_grounds_events.1015.b:0 "Bu bir şaka mı?"
 tour_grounds_events.1015.c:0 "Öldürmek için gerçek [stop_host_scope.Custom('GetAnimalType')] talep ediyorum."
 tour_grounds_events.1016.title:0 "Gerçek Av"
 tour_grounds_events.1016.desc:0 "Taleplerim karşılandı ve kısa süre sonra öldürmem gereken gerçek bir canavarla karşılaştım. Emrimle canavar bağlarından kurtuluyor ve yayımla canavarı alt etmek için yalnız kalıyorum.\n\nDerin bir nefes alıp bırakıyorum ve okumun hedefine sadık kalması için dua ediyorum."
 tour_grounds_events.1016.a:0 "Hedefim sağlam!"
 tour_grounds.killed_boar:0 "Hayvanı Öldürüyorum"
 tour_grounds.mauled_by_boar:0 "Iskaladım"
 tour_grounds_events.3001.title:1 "[stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] Topraklarını Gezmek"
 tour_grounds_events.3001.desc.intro:1 "[stop_host_scope.GetTitledFirstName] beni [touring_grounds_scope.GetProvince.GetName] topraklarındaki [stop_host_scope.Custom('FortifiedBuilding')] önünde bir [ROOT.Char.GetTitleAsNameNoTooltip] karşılamasına uygun bir şekilde karşıladı"
 tour_grounds_events.3001.desc.type.majesty:0 "ve yerel halk, maiyetimin ihtişamı ve görkeminden çok etkilendi.\n\n"
 tour_grounds_events.3001.desc.type.taxation:0 "ve vergi tahsildarlarının ve sandık arabamın varlığı hemen fark edildi.\n\n"
 tour_grounds_events.3001.desc.type.intimidation:0 "ancak muhafızlarımın sıkı disiplini tebaamı biraz duraksatıyor.\n\n"
 tour_grounds_events.3001.desc.mid.hates_vassal:0 "Bu [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] ile görüşmek iğrenç bir zorunluluk, umarım kısa sürede sona erer."
 tour_grounds_events.3001.desc.mid.lover:0 "Sevgilimle bu kadar aleni formaliteler altında çalışmak zorunda kalmak bana acı veriyor, keşke baş başa görüşecek zamanımız olsaydı..."
 tour_grounds_events.3001.desc.mid.friend:0 "Formaliteler sırtımızda yük olsa da, iyi bir dostu ziyaret etmek her zaman iyidir."
 tour_grounds_events.3001.desc.mid.close_family:0 "[ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] ve ben kucaklaşıyoruz, olayın resmiyetini korumaya özen gösteriyoruz."
 tour_grounds_events.3001.desc.mid.house:0 "[ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)], [ROOT.Char.GetHouse.GetBaseName] Hanesi'nin asaletine uygun bir şekilde yaşıyor mu? Bunu görmek için güzel bir fırsat."
 tour_grounds_events.3001.desc.mid.powerful_vassal:0 "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] vasalları arasındaki önemini bir noktaya kadar takdir ediyorum..."
 tour_grounds_events.3001.desc.mid.default:1 "Vasalım beni gerekli tüm hürmetle karşıladı."
 tour_grounds_events.3001.desc.mid:2 "\n\n[stop_host_scope.GetFirstNameNoTooltip] planlanan geziyi özetliyor. Söylediğine göre [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] o kadar güzel bir yer ki sadece şehirlerini ve tarlalarını seyretmek bile çok eğlenceliymiş."
 tour_grounds_events.3001.desc.outro:1 "\n\nBunu zaman gösterecek."
 tour_grounds_events.3001.a:1 "Hadi başlayalım!"
 tour_grounds_events.3002.title:0 "Avcılık Hüneri"
 tour_grounds_events.3002.desc.intro:0 "[touring_grounds_scope.GetNameNoTooltip] topraklarında gezmeye devam ederken, ev sahibim avcılık hünerlerini sergilemeye karar veriyor. Herkes dikkatlice onu izlerken"
 tour_grounds_events.3002.desc.mid.crit:0 "[stop_host_scope.GetNameNoTooltip], bir [stop_host_scope.Custom('GetAnimalType')] buluyor ve tam kafatasında vurmayı başarıyor.\n\nHerkes etkilenmiş gibi görünse de, bu"
 tour_grounds_events.3002.desc.mid.succ:0 "[stop_host_scope.GetNameNoTooltip], bir [stop_host_scope.Custom('GetAnimalType')] buluyor ve çok az bir çaba ile öldürmeyi başarıyor.\n\nHerkes etkilenmiş gibi görünse de, bu"
 tour_grounds_events.3002.desc.mid.fail:0 "[stop_host_scope.GetNameNoTooltip], hedefini büyük bir farkla ıskalıyor, maiyetim bunu eğlenceli buluyor.\n\nHerkes gülse de bu"
 tour_grounds_events.3002.desc.outro:0 "ev sahibimi aşmak ve herkese bir [ROOT.Char.GetTitleAsNameNoTooltip] nasıl ok atarmış göstermek için harika bir fırsat!"
 tour_grounds_events.3002.a:0 "Ben daha iyi bir avcıyım!"
 tour_grounds_events.3002.b:0 "Tebrikler, [stop_host_scope.GetNameNoTooltip]."
 tour_grounds_events.3003.title:0 "Tehlikeli Av"
 tour_grounds_events.3003.desc.intro:0 "Av yayım yanımdayken, partimin bir üyesi beni bulunduğumuz yere yakın bir yamacın hemen altında bir [stop_host_scope.Custom('GetAnimalType')] olduğuna dair uyarıyor. Yamacın kenarında durursam kalbini delebilmeliyim.\n\n"
 tour_grounds_events.3003.desc.mid.high_skill:0 "Benim gibi yetenekli bir avcı için kolay olmalı ama risksiz değil."
 tour_grounds_events.3003.desc.mid.low_skill:0 "Zor bir atış gibi görünüyor ama başarırsam, şüphesiz tüm alayımı etkileyeceğim."
 tour_grounds_events.3003.desc.outro:0 "Zemin biraz dengesiz görünüyor ama dikkatli adımlarla yaratığı sorunsuzca öldürebilirim."
 tour_grounds_events.3003.a:0 "Bu kolay olmalı."
 tour_grounds_events.3003.b:1 "Atışı başkası yapsın."
 tour_grounds_events.3004.title:0 "Avcı [visiting_liege.GetTitleAsNameNoTooltip|U]"
 tour_grounds_events.3004.desc.intro:0 "Arazideki gezisi sırasında [visiting_liege.GetName] bir yamacın hemen aşağısındaki bir [stop_host_scope.Custom('GetAnimalType')] için riskli bir atış denedi."
 tour_grounds_events.3004.desc:0 "Bir an için düşecekmiş gibi görünse de, çabucak toparlandı ve yaratığı öldürerek onu hemen yere serdi.\n\n[visiting_liege.GetTitleAsNameNoTooltip|U], avcılık hünerleri ile tüm partiyi etkilemiş ve kendine hayran bırakmış gibi gözüküyor. Taze avından damlayan kanla bana yaklaşıyor ve bir tür tebrik bekliyor."
 tour_grounds_events.3004.a:0 "Mükemmel atış, [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )]."
 tour_grounds_events.3004.b:0 "Etkilenmem mi gerekiyor?"
 tour_grounds_events.3005.title:0 "Ödüllendirilmiş Bir Risk"
 tour_grounds_events.3005.desc.intro:0 "Tehlikeli yamacın kenarında tökezlemeden tek bir okla hayvanı yere serdiğimde, ayağımın yere sağlam bastığını ve nişanımın daha da sağlam olduğunu kanıtladım. Av partisi çok etkilenmiş görünüyordu, ortam arkadaşlarımın alkışlarıyla doldu.\n\n"
 tour_grounds_events.3005.desc.mid.congrats:0 "Ev sahibim [stop_host_scope.GetName] bizzat gelip avım için beni tebrik ediyor. Bu iş tamamlandıktan sonra, avımı diğerlerinin yanına atıyorum ve arazideki gezime devam ediyorum."
 tour_grounds_events.3005.desc.mid.insult: "Ancak ev sahibim [stop_host_scope.GetName] pek de etkilenmişe benzemiyor. Yüzü küçümseme ve kıskançlıkla dolu, atışımın hiç de etkileyici olmadığını iddia ediyor."
 tour_grounds_events.3005.a:0 "Mükemmel."
 tour_grounds_events.3005.a.bad:0 "Ne huysuz bir [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
 tour_grounds_events.3006.title:0 "Yuvarlanan [visiting_liege.GetTitleAsNameNoTooltip|U]"
 tour_grounds_events.3006.desc:0 "Bir an için gerçekten başarabilirmiş gibi göründü ama dengesini kaybetmeye başladığında, işin sonunda yaralar ve utanç ile karşılaşacağı anlaşıldı.\n\nElbette efendimi kurtarmak için dalabilirim ama bu benim de yaralanmam anlamına gelebilir."
 tour_grounds_events.3006.a:0 "Efendimi korumalıyım!"
 tour_grounds_events.3006.b:0 "Bırakalım düşsün."
 tour_grounds_events.3006.c:0 "Onu kenara itip atışı kendim yapacağım!"
 tour_grounds_events.3007.title:0 "$tour_grounds_events.3006.title$"
 tour_grounds_events.3007.desc.intro:0 "Ne yazık ki, ayaklarım yere yeterince sağlam basmıyor ve bedenimin yaratan [ROOT.Char.GetFaith.CreatorNamePossessive] merhametiyle yeryüzünü terk ettiğini hissediyorum.\n\n"
 tour_grounds_events.3007.desc.mid.protected:0 "Son anda [stop_host_scope.GetName] beni tutup yakalıyor ancak kurtarıcım cesur çabası sonucunda kendisi yüzüstü düşüyor."
 tour_grounds_events.3007.desc.mid.fell:0 "Düşerken havada son bir kez arkamı görüyorum, [stop_host_scope.GetName] orada boş boş durup [Select_CString(ROOT.Char.IsFemale, 'leydisinin', 'lordunun' )] düşüşünü izliyor. Bedenim yerle birleştiğinde, derimin yırtıldığını ve ilahi kanımın yere aktığını hissediyorum."
 tour_grounds_events.3007.desc.mid.took_the_shot:0 "Düşerken havada son bir kez arkamı görüyorum, [stop_host_scope.GetName] yerimi alıyor, beni kurtarmak için hiçbir şey yapmamakla kalmayıp bir de atışı da kendisi yapıyor! Yere çarptığımda kemiklerim çatırdarken bir yandan da alkış sesleri geliyor. Belli ki [stop_host_scope.GetNameNoTooltip] benim başaramadığımı başarıyor ve bana da acı ve utanç içinde kıvranmak kalıyor."
 tour_grounds_events.3007.a:0 "Sanırım bugünlük bu kadar yeter."
 tour_grounds_events.3008.title:0 "Bir Binicilik Olayı"
 tour_grounds_events.3008.desc:0 "Memnun kafamda neredeyse hiçbir düşünce olmadan [touring_grounds_scope.GetNameNoTooltip] topraklarında ilerliyorum.\n\nBir çocuğun atımın önüne atlamasıyla aniden gerçekliğe geri dönüyorum, [ROOT.Char.GetTitleAsNameNoTooltip] gördüğü için kollarını sallayarak saygıyla selam veriyor. Ortaya çıkışı o kadar ani oluyor ki, tepki verecek, hatta tanıdığım bir çocuk olup olmadığını anlayacak zamanım bile olmuyor. Terleyen ellerim dizginlerde, tepki vermeliyim!"
 tour_grounds_events.3008.a:0 "Kazayı engellemeliyim."
 tour_grounds_events.3008.b:0 "Önümde hiçbir şey duramaz."
 tour_grounds_events.3009.title:0 "Kraliyet Çiğnemesi"
 tour_grounds_events.3009.desc.intro:0 "[visiting_liege.GetName], atı ile gezisine devam ettiği bir başka gün, her şey güzel başlamışken birden [trampled_child_scope.GetName], atın önüne koşmuş ve at tarafından ezilerek ölmüş!\n\nEn şok edicisi ise [visiting_liege.GetNameNoTooltip] bunu engellemek için hiçbir girişimde bulunmamış."
 tour_grounds_events.3009.desc.mid.my_kid:0 "Kendi etimin ve kanımın canavar gibi bir atın ayakları altında çiğnenmesini izlemek zorunda bırakıldım."
 tour_grounds_events.3009.desc.mid.not_my_kid:0 "Zavallı çocuk bir canavarın ayakları altında ezilmeden önce zamanında müdahale edemedik."
 tour_grounds_events.3009.desc.outro.my_kid_dead:0 "At geçip gittikten sonra, yerdeki tanınamaz hâle gelen bedenin [ROOT.Char.Custom2('RelationToMeShort',trampled_child_scope)] olduğunu anlıyorum."
 tour_grounds_events.3009.desc.outro.not_my_kid_dead:0 "At geçip gittikten sonra görüyorum ki, zavallı çocuk kendi kanıyla dolu bir havuzun içinde hareketsiz bir şekilde yatıyor."
 tour_grounds_events.3009.desc.outro.alive:0 "Şükürler olsun ki [trampled_child_scope.GetNameNoTooltip] bu tehlikeli kazadan sağ çıkmayı başardı ancak yaralandı."
 tour_grounds_events.3009.a.callous:0 "Beni ilgilendirmiyor."
 tour_grounds_events.3009.a:0 "Ne kadar iğrenç!"
 tour_grounds_events.3009.b:0 "[visiting_liege.GetNameNoTooltip] bir canavar."
 tour_grounds.trampled_child_nemesis:0 "[stop_host_scope.GetNameNoTooltip] İntikam Yemini Etti"
 tour_grounds_events.3010.title:0 "Güvenilmez Bir At"
 tour_grounds_events.3010.desc.intro:0 "[touring_grounds_scope.GetNameNoTooltip] topraklarındaki gezintim, değerli atımın bir kayaya takılıp tökezlediğini hissettiğimde ani bir sarsıntıyla durdu. Her ne kadar çabuk toparlansa ve ben sadece bir anlığına dengemi kaybetsem de, kafilemdekilerin arkamdan kıs kıs güldüklerini duyabiliyordum.\n\n"
 tour_grounds_events.3010.desc.mid.irritable:0 "Sözde değerli atım tarafından başarısızlığa uğratıldım ve içimde bir aşağılanma ve öfke kaynadığını hissediyorum."
 tour_grounds_events.3010.desc.mid.calm:0 "Biraz utanıyorum ama aslında bunun hayvanın suçu olmadığını biliyorum."
 tour_grounds_events.3010.desc.outro:0 "Bir [ROOT.Char.GetTitleAsNameNoTooltip|U], erişilemez bir kraliyet havası yaymalı ve tüm tebasasının saygısını kazanması gerekir. Ancak bu olay benim mükemmel imajımı yerle bir etti."
 tour_grounds_events.3010.a:0 "Hayvanı öldürün ve bana yenisini getirin!"
 tour_grounds_events.3010.b:0 "Herkes hata yapar."
 tour_grounds_events.3011.title:0 "$tour_grounds_events.3010.title$"
 tour_grounds_events.3011.desc.intro:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ile birlikte arazide at sürerken, atı yerdeki bir kayaya takılıyor ve bir an dengesini kaybediyor. Alaydaki bazı kişiler kıs kıs gülmeye başlayınca [visiting_liege.GetNameNoTooltip] atından iniyor"
 tour_grounds_events.3011.desc.mid.irritable:0 "ve zavallı hayvanın boğazını duygusuzca keserek ölümünü izliyor."
 tour_grounds_events.3011.desc.mid.calm:0 "ve zavallı hayvanın gözlerinin arasına dikkatlice bir ok saplıyor."
 tour_grounds_events.3011.desc.outro:0 "\n\n"Beni hayal kırıklığına uğratan hayvanlara ya da tebaaya ihtiyacım yok. Her zaman başka bir tane bulabilirim.""
 tour_grounds_events.3011.a:0 "Size başka bir tane bulabilirim, [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )]!"
 tour_grounds_3011.vassal_paid_for_new_horse:0 "[stop_host_scope.GetNameNoTooltip] Yeni Bir At Almayı Önerdi"
 tour_grounds_events.3011.b:0 "Anlaşıldı."
 tour_grounds_3011.vassal_did_not_pay:0 "Yeni Bir At Aldım"
 tour_grounds_events.3012.title:0 "Kaçak Avcılar!"
 tour_grounds_events.3012.desc.intro:0 "Ben ve maiyetim at sürerken, arazide yankılanan mırıltılar duyuyorum. Bir çocuğa önden gitmesini emrediyorum ve geri döndüğünde bana hemen önümüzde bir kaçak avcı çetesi olduğunu bildiriyor.\n\n"
 tour_grounds_events.3012.desc.mid.sadistic:0 "Bu, masum ruhlara hak ettikleri acıyı çektirmek ve aynı zamanda [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ile ilişkimi güçlendirmek için güzel bir fırsat sunuyor."
 tour_grounds_events.3012.desc.mid:0 "Beni çok ilgilendirmese de araziyi bu kaçaklardan temizlersem [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] bundan etkilenir."
 tour_grounds_events.3012.desc.outro:0 "\n\nBu serserileri yakalayabilir, kafalarını ve ellerini pek sorun çıkmadan [stop_host_scope.GetNameNoTooltip] için koparabilirim."
 tour_grounds_events.3012.a:0 "Avlanma vakti."
 tour_grounds_events.3012.b:0 "Ücret karşılığında onları serbest bırakabiliriz."
 tour_grounds_events.3012.c:0 "Onlardan uzak durun."
 tour_grounds_events.3013.title:0 "İçi Dolu Çuvallar"
 tour_grounds_events.3013.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] bir süredir benden ayrıydı ve şimdi tekrar karşıma çıktığında yanında birkaç çuval olduğunu görüyorum. Çuvallar kırmızıya boyanmış ve damlatıyor.\n\nÇuvalları ayaklarımın dibine boşaltıyor ve bazı talihsiz ruhların kopmuş ellerinin ve kafalarının döküldüğünü görünce dehşete kapılıyorum, yüzleri bir dehşet ifadesine bürünmüş.\n\n"Topraklarınızı kaçak avcılardan ve hırsızlardan temizleme cüretini gösterdim. Bunlar hakkında endişe etmenize gerek kalmadı.""
 tour_grounds_events.3013.a:0 "Teşekkürler [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )]."
 tour_grounds.vassal_impressed:0 "[stop_host_scope.GetFirstNameNoTooltip] etkilendi"
 tour_grounds_events.3013.b:0 "Dehşet!"
 tour_grounds.vassal_horrified:0 "[stop_host_scope.GetFirstNameNoTooltip] dehşete düştü"
 tour_grounds_events.3014.title:0 "Vergilendirilebilir Savurganlık"
 tour_grounds_events.3014.desc:0 "[touring_grounds_scope.GetNameNoTooltip] topraklarında görülmesi gereken her yeri gezdikten sonra bir şey fark etmeye başlıyorum, her yer ve her şey çok zengin.\n\nSadece bir [stop_host_scope.GetTitleAsNameNoTooltip] olmasına rağmen [stop_host_scope.GetFirstNameNoTooltip] oldukça lüks içinde yaşıyor ve belli ki fazlasıyla parası var.\n\nKonutundaki pencere sayısına bakınca pencere vergisi aklıma geliyor. [stop_host_scope.GetTitleAsNameNoTooltip|U] olarak vergisini vermeli."
 tour_grounds_events.3014.a:0 "Pencere vergisi kulağa iyi geliyor."
 tour_grounds_events.3014.b:0 "Şimdilik gerek yok."
 tour_grounds_events.3015.title:0 "Pencere Vergisi"
 tour_grounds_events.3015.desc:0 "Çok iyi bir ev sahibi olduğumu düşünüyorum, [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)], [touring_grounds_scope.GetNameNoTooltip] topraklarında görebileceği tüm muhteşem yerleri gezdi ve gördü.\n\nAncak, dikkatini konutuma çevirdiğini ve kendi kendine bir şeyler mırıldanırken sağı solu işaret ettiğini fark ediyorum. Onu yokluyorum ve o da bana sırıtıyor.\n\n"Ah, ben de tam pencereleri sayıyordum. Zorunlu pencere vergisinden haberdarsınız, değil mi? Bu vergi [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] kurulduğundan beri var ve bu kadar çok pencerenin vergilendirilmemesine izin veremezdim.""
 tour_grounds_events.3015.a:0 "Tamam, pencere vergini ödeyeceğim."
 tour_grounds.vassal_paid_tax:0 "[stop_host_scope.GetName] Vergisini Ödedi"
 tour_grounds_events.3015.b:0 "Pencere neyi?"
 tour_grounds.vassal_refused_to_pay_tax:0 "[stop_host_scope.GetName] Vergiyi Reddetti"
 tour_grounds.vassal_won_tax_duel:0 "[stop_host_scope.GetName] Vergiyi Atlattı"
 tour_grounds_events.3016.title:0 "Bir Hatıra"
 tour_grounds_events.3016.desc:0 "[touring_grounds_scope.GetNameNoTooltip|U] vahşi doğasında sonunda kendimi yalnız buluyorum. Aklım birden [liege_lover_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ile ilgili düşüncelerle doluyor.\n\n[touring_grounds_scope.GetNameNoTooltip] çok güzel bir yer inkâr edemem, neredeyse sevgilim [liege_lover_scope.GetNameNoTooltip] ile boy ölçüşecek kadar güzel. Yolu [touring_grounds_scope.GetNameNoTooltip] üzerinden geçen herkesin sevgimi bilmesi için buraya bir iz bırakmak zorunda hissediyorum. Belki de onun ismini bir [touring_grounds_scope.Custom('get_carvable_surface')] üzerine kazımalıyım!"
 tour_grounds_events.3016.a:0 "Halledeceğim."
 tour_grounds_events.3016.b:0 "Hayır, burası olduğu gibi mükemmel."
 tour_grounds_events.3017.title:0 "Kirletilmiş"
 tour_grounds_events.3017.desc:0 "Sonunda [visiting_liege.GetTitleAsNameNoTooltip] ile aramdaki mesafeyi kapatıyorum. Geldiğimde onu, adını bir [touring_grounds_scope.Custom('get_carvable_surface')] üzerine kazırken görüyorum ve dehşete kapılıyorum.\n\nHiç şüphesiz bu [touring_grounds_scope.Custom('get_carvable_surface')] yerel halk için büyük bir manevi öneme sahip ve bir [visiting_liege.GetTitleAsNameNoTooltip] böylesine kutsal bir yere zarar verdiyse halk, [visiting_liege.GetName] ismini nesiller boyunca lanetleyecektir!"
 tour_grounds_events.3017.a:0 "Çok yazık."
 tour_grounds_events.3017.b:0 "Suçu ben üstleneceğim!"
 tour_grounds_events.3018.title:0 "$tour_grounds_events.3017.title$"
 tour_grounds_events.3018.desc:1 "Mutlu bir şekilde [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] yüzeyini oyarken hemen yanımda ani bir soluk duyuyorum.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yaptığım işi görünce dehşete kapılıyor ve açıklamak için yanıma yaklaşıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] bu [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')], [touring_grounds_scope.GetNameNoTooltip] halkı için kutsal bir nesene ve bunu bildiğinizden hiç şüphem yok!"
 tour_grounds_events.3018.desc.outro.took_the_blame:0 "Korkmayın, suçu ben üstleneceğim. Sadece bundan kimseye bahsetmeyin.""
 tour_grounds_events.3018.desc.outro.blamed_liege:0 "[touring_grounds_scope.GetNameNoTooltip] halkı ve din adamları, yaptığınız bu saygısızlık nedeniyle adınızı sonsuza dek lanetleyecektir!""
 tour_grounds_events.3018.a.took_blame:0 "Teşekkürler."
 tour_grounds_events.3018.a.was_blamed:1 "Bu altı üstü bir [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')], ne yaptım ki?"
 tour_grounds_events.3019.title:0 "Vergilendirilebilir Ekstralar"
 tour_grounds_events.3019.desc:0 "[touring_grounds_scope.GetNameNoTooltip] fazlasıyla varlıklı bir hükümdara sahip gerçekten zengin ve lüks bir yer.\n\nBaktığım her yerde tek bir şeye dair deliller görüyorum: beyan edilmemiş, vergilendirilebilir gelirler. Hayvan sayısı sarayıma bildirilenden çok daha fazla görünüyor, kendisi [stop_host_scope.GetTitleAsNameNoTooltip] olmasına karşın bir [ROOT.Char.GetTitleAsNameNoTooltip|U] için bile lüks bir yerde yaşıyor!\n\n[greedy_entourage_member.GetName] bu aşırılıkları vergilendirmemi öneriyor zira belli ki [stop_host_scope.GetName] vergisini düzgün ödemiyor."
 tour_grounds_events.3019.a:0 "[stop_host_scope.GetTitleAsNameNoTooltip|U] vergilendirilsin!"
 tour_grounds_events.3019.b:0 "Bunları şimdilik bir kenara yazacağım."
 tour_grounds_events.3020.title:0 "$tour_grounds_events.3019.title$"
 tour_grounds_events.3020.desc:0 "[visiting_liege.GetName] son zamanlarda biraz mesafeli ve dalgın görünüyor, ara sıra kendi kendine mırıldanıyor ve [greedy_entourage_member.GetName] ile fısıldaşıyor. Sonunda bana doğrudan yaklaştı ve aklından geçenleri açıkça söyledi.\n\n"Bir [stop_host_scope.GetTitleAsNameNoTooltip], efendiniz olan bana karşı mali yükümlülüklerinizin farkında olmalısınız. Evinizin tüm ihtişamına baktığımda, vergilerinizde biraz hile yaptığınızı düşünmeden edemiyorum. Belki de bunu düzeltsek iyi olur.""
 tour_grounds_events.3020.a:0 "Vergimi düzgün ödedim!"
 tour_grounds_events.3020.b:0 "Çok iyi."
 tour_grounds_events.3040.title:0 "Sadakatsiz Tebaa"
 tour_grounds_events.3040.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] halkının nasıl yaşadığını merak ettiğim için, yerlilerin oldukça sık göründüğü bir mekânı ziyaret ediyorum. Bir adam bir masanın üzerinde duruyor ve etrafındaki herkesin dikkatini üzerine çekiyor.\n\n"Bir [stop_host_scope.GetTitleAsNameNoTooltip|U]! Ona niye ihtiyacımız olsun ki? [stop_host_scope.GetFirstName]"
 tour_grounds_events.3040.desc.mid.wrong_language:0 "bizim dilimizi bile konuşamıyor,"
 tour_grounds_events.3040.desc.mid.wrong_culture:0 "kahrolası bir yabancı,"
 tour_grounds_events.3040.desc.mid.wrong_faith:0 "[angry_peasant.GetFaith.NegativeAfterLife] yolcusu bir [stop_host_scope.GetFaith.GetAdherentName],"
 tour_grounds_events.3040.desc.mid.shit_beer:0 "bize bu boktan [angry_peasant.Custom('RegionalAlcoholicDrink')] fıçılarını reva görüyor,"
 tour_grounds_events.3040.desc.mid.shit_weed:0 "bizi dandik esrarla uyutuyor ve sessiz kalmamızı bekliyor,"
 tour_grounds_events.3040.desc.mid.conscription:0 "kendi şöhreti üzerinde yatarken bizi savaşlarında savaştırıyor,"
 tour_grounds_events.3040.desc.mid.high_taxes:0 "bu dayanılmaz vergilerle iliğimizi sömürüyor,"
 tour_grounds_events.3040.desc.mid.just_plain_dislike_em:0 "gördüğüm en [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)],"
 tour_grounds_events.3040.desc.outro:0 "ama bizden sonsuz sadakat bekliyor!"\n\nTüm bina gümbür gümbür ve alkışlarla inliyor. Belli ki [stop_host_scope.GetTitleAsNameNoTooltip|U] kendi yurdunda pek popüler değil."
 tour_grounds_events.3040.a:0 "Bu hainleri tutuklayın!"
 tour_grounds_events.3040.b:0 "[stop_host_scope.GetTitleAsNameNoTooltip|U] hakkında kötü konuşamazsınız!"
 tour_grounds_events.3040.c:0 "Bu köylüler doğru konuşuyor."
 tour_grounds_events.3050.title:0 "Kabalaşmak"
### TODO AGOT-ONLY: tour_grounds_events.3050.desc [AGOT: ]
 tour_grounds_events.3050.desc:0 ""Give me my bloody money!"\n\nThe sound of splattering blood and cracking bones calls my attention to a lowly gutter, where I see an impoverished [beaten_peasant.GetWomanMan] being held up by the scruff of [beaten_peasant.GetHerHis] collar by some local ruffian.\n\nUsually, this type of thing would be below my head, but can I really allow such blatant crimes to happen right in front of my face?"
 tour_grounds_events.3050.a:0 "Muhafızlar! Tutuklayın şu aptalı!"
 tour_grounds_events.3050.b:0 "İyi bir [ROOT.Char.GetTitleAsNameNoTooltip|U], tebaasını korur!"
 tour_grounds_events.3050.b.success:0 "Dövüşü kazandınız"
 tour_grounds_events.3050.b.failure:0 "Dövüşü kaybettiniz"
### TODO AGOT-ONLY: tour_grounds_events.3050.c [AGOT: ]
 tour_grounds_events.3050.c:0 ""Hey, let me rough [beaten_peasant.GetHerHim] up a bit!""
 tour_grounds_events.3060.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U] En İyi Zamanlarında"
 tour_grounds_events.3060.desc.intro:0 "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bugün bana kışlalarını göstermeye karar verdi.\n\n"
 tour_grounds_events.3060.desc.light_infantry:0 "Sıra sıra dizilmiş hafif piyadeler zırhlarının içinde hazır olda durmuş, teftişime hazır bekliyorlar."
 tour_grounds_events.3060.desc.archers:0 "Sıra sıra dizilmiş okçular ellerinde yaylarıyla hazır bekliyorlar."
 tour_grounds_events.3060.desc.heavy_infantry:0 "Önümde parıldayan bir zırh denizi duruyor, her bir asker taşıdıkları ağırlık umurlarında değilmiş gibi görünüyor."
 tour_grounds_events.3060.desc.cavalry:0 "Atlar homurdanıyor ve kişniyor, binicilerinin onları hücuma kaldırmasını bekliyorlar."
 tour_grounds_events.3060.desc.camel_cavalry:0 "Develer, düşman süvarilerini korkutmak istercesine inliyor ve tepiniyor."
 tour_grounds_events.3060.desc.elephant_cavalry:0 "Fillerin büyüklüğü karşısında hayranlık duyuyorum ve ayakları altında ezilenlerin son anlarını hayal ederken dehşete kapılıyorum."
 tour_grounds_events.3060.desc.outro:0 "Bunlar gayet iyi askerler ancak bütün gün boşta kalmaları bir kayıp gibi görünüyor."
 tour_grounds_events.3060.a:0 "Suçun kökünü kazıyabilirler!"
 tour_grounds_events.3060.b:0 "Belki de daha verimli bir şekilde yönetilebilirler."
 tour_grounds_events.3060.b.success:0 "Kışlalar iyileştirildi"
 tour_grounds_events.3060.b.failure:0 "Tavsiyeniz işe yaramadı"
 tour_grounds_events.3060.b.vassal:0 "[visiting_liege.GetFirstName] birliklerinize müdahale ediyor"
 tour_grounds_events.3060.c:0 "Bunun gibi askerleri kullanabilirim."
 tour_grounds_events.3060.d:0 "Belki buradan bir şeyler öğrenebilirim."
 tour_grounds_events.3070.title:0 "Bir Anlık Sessizlik"
 tour_grounds_events.3070.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetName] toprakları dışındaki gezilecek yerleri maiyetim ile birlikte geziyoruz ve"
 tour_grounds_events.3070.desc.royal_garden:0 "[stop_host_scope.GetName] tarafından yönetilen muhteşem kraliyet bahçesine geliyoruz.\n\nBahçenin duvarları içinde benden, birkaç soyludan ve özenle düzenlenmiş bir bahçeden başka bir şey yok. Burada bir an için durmak beni nadiren deneyimleme fırsatı bulduğum bir huzurla dolduruyor."
 tour_grounds_events.3070.desc.royal_forest:0 "[stop_host_scope.GetName] tarafından yönetilen büyüleyici kraliyet ormanına geliyoruz.\n\nBu ormanda köylüler ya da soylular yok; sadece ben, en yakın sırdaşlarım ve [ROOT.Char.GetFaith.CreatorNamePossessive|U] yarattıkları var. Kendimi saf bir sükûnet diyarına, insanların felaket dolu kalplerinin yeryüzünü ahlaksızlık ve zayıflıkla kirletmesinden önceki bir zamana taşınmış hissediyorum."
 tour_grounds_events.3070.desc.leisure_palace:0 "[stop_host_scope.GetName] tarafından yönetilen yazlık saraya geliyoruz.\n\nSarayın dış cephesi muhteşem heykeller ve titiz ayrıntılarla düzenlenmiş yerel bitki örtüsüyle dekore edilmiştir ve iç kısmı da bir o kadar görkemli ve abartılıdır. Bu sarayda olmak ve manzarayı görmek tüm gergin ruhları sakinleştirir."
 tour_grounds_events.3070.desc.outro:0 "\n\nSonsuza kadar burada kalabilirim."
 tour_grounds_events.3070.a:0 "Buradan çok şey öğrenebilirim."
 tour_grounds_events.3070.b:0 "Burada yavaş bir gezinti güzel bir hediye gibidir."
 tour_grounds_events.3070.c:0 "Askerleri konuşlandırın, bu huzur korunmalı!"
 tour_grounds_events.3080.title:0 "Yerel Ordu"
 tour_grounds_events.3080.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetName|U] topraklarında dolaşırken birden kendimi daha çok askerî bir manzara içinde buluyorum. Burası [stop_host_scope.GetName] tarafından kontrol edilen "
 tour_grounds_events.3080.desc.military_academy:0 "askerî akademi̇.\n\nTüm akademide, savaşın her zaman ufukta olduğunu çok iyi bilen asil $knight_culture_player_plural_no_tooltip_lowercase$ pratik yaptığını ve becerilerini geliştirdiklerini görüyorum."
 tour_grounds_events.3080.desc.march:0 "Hudutlar.\n\nSınırın dört bir yanında, görüş alanlarına girecek herhangi bir işgalci ya da kanun kaçağı için hazırlık yapıyorlar."
 tour_grounds_events.3080.desc.siege_works:0 "Kuşatma Atölyeleri.\n\nKuşatma aletleri sürekli bakım ve onarım altında, bazıları onarılıyor, bazıları ise ilk kez monte ediliyor. Duvarları bu aletlerle karşılaşacak bir sonraki kötü adama acıyorum."
 tour_grounds_events.3080.desc.royal_armories:0 "Kraliyet Cephaneliği.\n\nİçeri girdiğimde Kraliyet Cephaneliği'ni kaplayan zırhların parıltısı odaya neredeyse doğaüstü bir parlaklık veriyor. Sıra sıra miğferler ve zırhlar tüm yüzeylerden sarkıyor, üzerlerinden hafif bir yağ kokusu yayılıyor."
 tour_grounds_events.3080.desc.jousting_lists:0 "Mızrak Dövüşü Alanı.\n\nAtların kişnemeleri ve homurtuları, mızrakların ani çarpışmaları ve parçalanmalarıyla noktalanıyor. Ben yaklaşırken gürleyen toynaklar kesik kesik bir ritim tutturuyor, tezahüratlar etrafımda yankılanıyor."
 tour_grounds_events.3080.desc.archery_ranges:0 "Okçuluk Alanları.\n\nOkların hedef tahtalarına çarparken çıkardığı #EMP güm-güm-güm#! seslerine yay kirişlerinin tıngırtısı eşlik ediyor. Hafif bir meltem esiyor ve daha sert estiğinde okçular arasında her türlü yaramazlığa neden oluyor."
 tour_grounds_events.3080.desc.outro:0 "\n\n[ROOT.Char.GetCurrentLocation.GetName] iyi bir askerî merkez ve benim onların uygulamalarından öğreneceğim çok şey olduğu açık."
 tour_grounds_events.3080.a:0 "Ve öğreneceğim."
 tour_grounds_events.3080.b:0 "Bu aylak adamlar suçluların peşine düşmeli!"
 tour_grounds_events.3080.c:0 "Belki de bir ders almalıyım."
 tour_grounds_events.3090.title:0 "Bir Çiftçinin Gururu"
 tour_grounds_events.3090.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetName] kırsalında dolaşırken, küçük bir yerleşim yerinde köylülerin toplandığına şahit oluyorum.\n\nGururlu çiftçiler,"
 tour_grounds_events.3090.desc.vegetables:0 "devasa büyüklükteki [farmer.Custom('RegionalRootVegetablePlural')] ile tezgâhlarını ve el arabalarını doldurmuşlar."
 tour_grounds_events.3090.desc.livestock:0 "tombul ve sağlıklı hayvanlarını otlatıyor, o kadar güzel gözüküyorlar ki çiğ çiğ bile yenirler!"
 tour_grounds_events.3090.desc.outro:0 "Köylüler zaman zaman ürünlerini kıyaslamak, büyüklüklerini ve sağlıklarını analiz etmek için toplanıyorlar. Bir tür festival düzenliyor gibi görünüyorlar ve beni fark eder etmez bana emeklerinin meyvelerini göstermeye hevesleniyorlar."
 tour_grounds_events.3090.a:0 "Bu toprakları incelemeliyiz."
### TODO AGOT-ONLY: tour_grounds_events.3090.b [AGOT: ]
 tour_grounds_events.3090.b:0 ""This is a waste of time! Get back to your fields!""
 tour_grounds_events.3090.c:0 "Çok güzel, jüri ben olacağım."
 tour_grounds_events.3100.title:0 "Sessiz Bir Gün"
 tour_grounds_events.3100.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetName] gezim sırasında, ev sahibim tarafından gezdirilmediğim veya herhangi bir yerde görünmemin beklenmediği nadir bir an buldum.\n\nİbadet yerlerinin gün için dolduğunu görüyorum,"
 tour_grounds_events.3100.desc.booze:0 "tavernalar ilk içkicilerini ağırlamaya başlıyor,"
 tour_grounds_events.3100.desc.hash:0 "gizemli figürler gizli haşhaş bahçelerine doğru yol alıyorlar,"
 tour_grounds_events.3100.desc.outro:0 "ve dilenciler sokaklarda yatıp yiyecek bir kırıntı için yalvarıyorlar."
 tour_grounds_events.3100.a:0 "Bu yerleşim yerinde bir nüfus sayımı yapılmalıdır."
 tour_grounds_events.3100.b:0 "Günü [ROOT.Char.GetFaith.HighGodNamePossessive] huzurunda geçirmeliyim."
 tour_grounds_events.3100.c:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural|U] nasıl ibadet ediyor görmeliyim."
 tour_grounds_events.3100.d:0 "Hayırseverlik için mükemmel bir fırsat."
 tour_grounds_events.3100.e:0 "Sadece rahatlamak istiyorum."
 friend_helped_me:0 "[CHARACTER.GetShortUIName|U], en çok ihtiyaç duyduğu anda [TARGET_CHARACTER.GetShortUIName] için yardımcı oldu"
 friend_helped_me_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], en çok ihtiyaç duyduğu anda [CHARACTER.GetShortUIName] için yardımcı oldu"
