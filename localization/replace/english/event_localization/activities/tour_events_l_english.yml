 tour_general.5010.desc.outro:0 "\n\nBunlar düpedüz saçmalık ama bir anlama geliyor olmalılar."
 tour_general.5010.a:0 "Garip şeyler olabilir."
 tour_general.5010.b:0 "Ruhlar hepimizi izliyor."
 tour_general.5010.c:0 "Tarihimiz sadece bir yalan."
 tour_general.5010.d:0 "Kendi elleriyle düşüyorlar."
 tour_general.5011.title:0 "$journal_events_prefix$ Grotesk"
 tour_general.5011.desc:0 "İşte bu kadar! Şifreyi takip ederek kitabın tamamını anlayabiliyorum. [ROOT.Char.Custom('GetGrotesquePlural')|U] gibi her türlü garipliğin doğasını açıklayan tuhaf bir açıklama gibi görünüyor.\n\nSomut bir şekilde doğalarını ve nerede bulunabileceklerini anlatıyor, şüphesiz uzak yerlere seyahat etmem durumunda önemli bir eser."
 tour_general.5011.a:0 "Ne tuhaf!"
 tour_general.5012.title:0 "$journal_events_prefix$ İleri Düzey Teoloji"
 tour_general.5012.desc:0 "İşte bu kadar! Şifreyi takip ederek kitabın tamamını anlayabiliyorum ve bu karmaşık bir teoloji kitabı! [ROOT.Char.GetFaith.PantheonTerm|U] hakkında açıklamalar içeriyor ve [ROOT.Char.GetFaith.PositiveAfterLife] ile [ROOT.Char.GetFaith.NegativeAfterLife] arasındaki ilişkiye dair büyüleyici fikirlere sahip.\n\nBu, [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] dünyasındaki en gelişmiş teolojik metin olabilir ve bu benim!"
 tour_general.5012.a:0 "Büyüleyici!"
 tour_general.5013.title:0 "$journal_events_prefix$ Gizli Tarih"
 tour_general.5013.desc:0 "İşte bu kadar! Şifreyi takip ederek kitabın tamamını anlayabiliyorum ve [ROOT.Char.GetPrimaryTitle.GetName] tarihini daha önce hiç duymadığım bir şekilde anlatıyor!\n\nEğer bu günlük doğruysa, ülkeye ve ona dair tarih anlayışımızı değiştiriyor. Kuruluşunda emeği geçen figürleri karalıyor!"
 tour_general.5013.a:0 "İnanılmaz!"
 tour_general.5014.title:0 "$journal_events_prefix$ Çatışma"
 tour_general.5014.desc:0 "İşte bu kadar! Şifreyi takip ederek kitabın tamamını anlayabiliyorum ve her türlü savaş senaryosunda gizli teknikler hakkında bilgi içeriyor. İster kılıç, ister göğüs göğüse, hatta ister at sırtında olsun, bu günlük rakibin yapabileceği her türlü hamleye nasıl karşı koyacağımı tam olarak açıklıyor.\n\nBu günlüğü düzgün bir şekilde inceleyerek ve talimatlarını uygulayarak, [ROOT.Char.GetPrimaryTitle.GetName] tarihindeki en büyük düellocu olmaya adayım!!"
 tour_general.5014.a:0 "İnanılmaz!"
 tour_grounds_events.3030.title:0 "Gizemli Harita"
 tour_grounds_events.3030.desc:0 "Bugün zamanımın çoğunu [touring_grounds_scope.GetNameNoTooltip] içlerinde gezerek, merkezi keşfederek geçirdim ve yerel halk tarafından sunulan hizmetlerle eğlendim.\n\nAz ötede, kalabalığın arasına karışmak için boşuna bir çaba sarf eden kapüşonlu bir figür görüyorum. Cebinden bir kâğıt düşüyor ve sanki bana güdümlenmiş gibi rüzgârda bana doğru uçuyor.\n\nBir çeşit harita gibi görünüyor, [touring_grounds_scope.GetNameNoTooltip] çevresindeki arazinin bir haritası!!"
 tour_grounds_events.3030.a:0 "Bakalım nereye varacak."
 tour_grounds_events.3030.got_lost:0 "Kayboldunuz"
 tour_grounds_events.3030.b:0 "Peh, ne zaman kaybı."
 tour_grounds_events.3031.title:0 "Gömülü Hazine"
 tour_grounds_events.3031.desc:0 "Haritayı sonuna kadar takip ettiğimde bir [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip] önüme çıkıyor. Burada özel bir önemi olmayan bir açıklık buluyorum.\n\nYine de etrafa baktığımda, sanki oraya bir şey gömülmüş gibi yerde bir dizi tümsek buluyorum. Tümsekler makul bir düzende görünüyor, belki de yerleştirilmelerinin arkasında bir mantık olduğunu gösteriyor..."
 tour_grounds_events.3031.a:0 "Hangisi olduğunu bulabilirim."
 tour_grounds_events.3031.fail_to_get_it_open:0 "Doğru noktayı bulamıyorsunuz"
 tour_grounds_events.3031.b:0 "Hepsini kazacağım!"
 tour_grounds_events.3031.c:0 "Bu izi yeterince takip ettim."
 tour_grounds_events.3032.title:0 "Gömülü Kitap"
 tour_grounds_events.3032.desc:0 "Sonunda doğru tümseği bulduğumu düşünüyorum ve kazdığımda ortaya garip bir kitap çıkıyor.\n\nKapağı yıpranmış ve neredeyse parçalanacak durumda; içinde ise sadece garip semboller ve bilmeceler var, bunlar da gizlenmiş bir gerçeği ima ediyor.\n\nBir süre sonra bunun bir şifreler kitabı olduğunu anlıyorum ama neyi deşifre etmek için var olduğu belirsiz."
 artifact_secret_cipher_description:0 "Bilmeceler ve şifrelerle dolu garip bir kitap."
 tour_grounds_events.3032.a:0 "Yanıma alacağım!"
 tour_grounds_events.3032.b:0 "$host_dinner_events.3132.b$"
 tour_grounds_events.3032.c:0 "$host_dinner_events.3132.c$"
 tour_grounds_events.3032.d:0 "Bulduğum yerde bırakmalıyım."
