 cultural_festival.9020.title:0 "Büyük Doruk Noktası"
 cultural_festival.9020.desc:0 "[ROOT.Char.GetCurrentLocation.GetName] bir başka gün batımına daha şahitlik yapıyor. Yerel halk son bir gösteri hazırlıyor gibi görünüyor. Harika bir ahşap direk kuruldu ve bundan sonra ne olacağını görmek için heyecanlıyım!\n\nBir süre sonra, zayıf bir [Select_CString(human_sacrifice.IsFemale, 'kadın', 'adam' )] tekmelenerek ve çığlıklar eşliğinde sürükleniyor ve direğe bağlanıyor. Karnına bir bıçak dayanıyor ve gözlerini kapattığında ölümle yüzleşmeye hazırlanıyor."
### TODO AGOT-ONLY: cultural_festival.9020.b [AGOT: ]
 cultural_festival.9020.b:0 ""Stop this madness in the name of your [ROOT.Char.GetTitleAsNameNoTooltip|U]!""
 cultural_festival.9030.title:0 "[ROOT.Char.GetFaith.GetAdherentNameNoTooltip|U] Gelenekleri"
 cultural_festival.9030.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bugünkü şenliklerden son derece etkilenmiş görünüyor. Dansçılar, sanatçılar ve komedyenler efendimi memnun etmeye çalışıyor ve bu süreç gayet mükemmel bir şekilde ilerliyor gibi görünüyor.\n\nBöylesine güzel bir ruh hâli içinde ve geleneklerimizle çevrili olan [visiting_liege.GetFirstName], belki de bu gelenekleri canlı tutmakla ilgilenmeye başlayabilir. [ROOT.Char.GetFaith.GetAdherentName|U] gelenekleri, din değiştirmeye karşı uygun yasal korumalar olmadan kesinlikle yok olacaktır."
### TODO AGOT-ONLY: cultural_festival.9030.a [AGOT: ]
 cultural_festival.9030.a:0 ""It would be a shame for these traditions to die, eh?""
