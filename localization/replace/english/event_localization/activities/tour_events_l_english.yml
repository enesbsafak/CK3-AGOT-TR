 cultural_festival.9050.t:0 "Erotik Dans"
 cultural_festival.9050.desc:0 "Bir diğer büyüleyici eğlence için yerime geçtim. Beklenen sessizliğin içinde birden perküsyon çalmaya başlıyor, davullar kalp atışı gibi çarpıyor.\n\nPerdelerin arkasında, vücudunu hem müstehcen hem de heyecan verici bir şekilde sergileyen muhteşem bir [sexy_dancer.GetWomanMan] beliriyor. Vücudunu şaşırtıcı bir biçimde benimkine yaklaştırıyor ve sonra göz kırpmaktan başka bir şey yapmadan beni bırakıp hayran kitlesine geri dönüyor."
 cultural_festival.9050.a:1 "O benim olmalı!"
 cultural_festival.9050.b:0 "Ne kadar komik!"
 cultural_festival.9060.t: "Efsanevi Bir Performans"
 cultural_festival.9060.desc: "Neşe içinde festivalde dolaşırken nihayet bir grup oyuncuya rastlıyorum. Bir şeyler için prova yapıyor gibi duruyorlar ve uzaktan izlerken bile harika bir performans sergileyeceklerini anlayabiliyorum.\n\nYeni bir eserden faydalanabileceklerini düşünmeye başlıyorum. Elbette, [ROOT.Char.GetPromotedLegend.GetName] böyle yetenekli bir grup oyuncu için ideal bir eser olur."
 cultural_festival.9060.a: "Benim destanımı canlandırmalılar!"
 cultural_festival.9060.a.success: "[stop_host_scope.GetFirstName] performansa ilgi gösterdi"
 cultural_festival.9060.a.failure: "Performans oldukça iyiydi"
 cultural_festival.9060.b: "Sadece sergiledikleri şeyin tadını çıkarsam yeter."
