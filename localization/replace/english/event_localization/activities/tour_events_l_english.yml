 tour_general.9999.type_majesty:0 "\n\n[host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] gerçek efendisinin ihtişamını ve zarafetini görecek."
 tour_general.9999.type_intimidation:0 "\n\n[host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] kime hizmet ettiğini görsün ve ihanetin cezasının nasıl bir şey olduğunu hatırlasın."
 tour_general.9999.type_taxation:0 "\n\nTüm [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] topraklarındaki lordlar ve leydiler bana borçlu oldukları vergileri ödeyecek."
 tour_general.9999.closing:0 "\n\nBeni bir [host.GetTitleAsNameNoTooltip|U] gibi karşılayacaklarını umut ediyorum."
