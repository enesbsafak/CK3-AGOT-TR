 attempt_to_solve_the_cipher_tt:0 "Şifreyi çözmeye çalışıyorsunuz"
 you_have_journal_1_tt:0 "Gizli Günlük sizde"
 you_have_journal_2_tt:0 "Bulmaca Anahtarı sizde"
 you_have_journal_3_tt:0 "Şifre sizde"
 artifact_journal_of_grotesques:0 "Groteskler Günlüğü"
 artifact_journal_of_grotesques_desc:0 "Bu şifreli günlük, grotesklerin incelenmesi ve nerede bulunabilecekleri hakkında bilgilerle dolu."
 artifact_journal_of_theology:0 "İleri Düzey Teoloji Günlüğü"
 artifact_journal_of_theology_desc:0 "Bu şifreli günlük, [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] teolojisi hakkında çığır açan açıklamalar içermektedir."
 artifact_journal_secret_history:0 "Gizli [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] Tarihi"
 artifact_journal_secret_history_desc:0 "Bu şifreli günlük, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] tarihi ve hükümdarları hakkında ayrıntılı bilgiler içerir."
 artifact_journal_of_martial_arts:0 "Dövüş Sanatları Günlüğü"
 artifact_journal_of_martial_arts_desc:0 "Bu şifreli günlük, kılıç dövüşünden çıplak elle dövüşe ve hatta at üstünde savaşa kadar her türlü dövüş sporu hakkında talimatlar içermektedir."
 cultural_festival.9010.title:0 "Aşırı Hevesli"
 cultural_festival.9010.desc:0 "Bugün [ROOT.Char.GetCurrentLocation.GetName] topraklarında festival var. Festivalin tadını çıkarıyorum ancak [weeb_child.Custom2('MyCharacterIntroduction', ROOT.Char)] kadar değil.\n\nDaha önce kendisinde hiç görmediğim bir coşku ve canlılıkla yerlilerle birlikte dans ediyor ve dönüyor. [festival_culture_scope.GetName|U] kültürünün yabancı geleneklerine tamamen kendini kaptırmış, tamamen evinde gibi görünüyor ve yerel halk da ona bayılıyor gibi görünüyor!"
 cultural_festival.9010.a:0 "Ne kadar hoş."
