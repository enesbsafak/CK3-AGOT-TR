 rival_insulted_me_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U], [CHARACTER.GetShortUIName] adlı karaktere hakaret etti"
 host_dinner_events.1001.title:0 "Kuru Bir Akşam Yemeği"
 host_dinner_events.1001.desc:0 "[visiting_liege.GetName] ile eğleniyorduk, gecemiz şimdiye kadar sarhoş eğlenceleri ve şakalarla doluydu. Gerçi belki de alkol stoğumu kullanırken fazla cömert davranmışımdır, çünkü bir hizmetçi bana "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] son damlasına kadar tükendi" dedi!\n\nEfendim sabırsızlıkla masanın diğer ucunda oturmuş, yeni doğmuş bir bebek gibi yanakları kıpkırmızı, kadehini masaya vuruyor.\n\n"Gelin! Gece daha yeni başladı! İçkiler nerede?""
### TODO AGOT-ONLY: host_dinner_events.1001.a [AGOT: ]
 host_dinner_events.1001.a:0 ""Refill the stores!""
 host_dinner_events.1001.replenished_stores:0 "[stop_host_scope.GetName] içki depolarını doldurdu"
 host_dinner_events.1001.b:0 "Yeterince içtin!"
 host_dinner_events.1001.didnt_replenish_stores:0 "[stop_host_scope.GetName] içki içmenizi azarladı"
 host_dinner_events.1001.c:0 "Belki de mekan değişikliği yapmamız gerekiyordur."
 host_dinner_events.1001.d:0 "İçkileri yenileyeceğim... bir iyilik karşılığında."
 host_dinner_events.1002.title:0 "Bir Ya Da İki Kadeh"
 host_dinner_events.1002.desc:0 "Ev sahibim [stop_host_scope.GetName], beni evinden çıkarıp yerel bir meyhaneye getirdi. Etrafta içki ve çapkınlıkla uğraşan sefil ve zayıf insanlar görüyorum ama [stop_host_scope.GetTitledFirstNameNoTooltip] bana bu mekânda servis edilen [ROOT.Char.Custom('RegionalAlcoholicDrink')], görüp görebileceğimin en iyisi olduğu konusunda ısrar ediyor.\n\nİlk kadeh dudaklarımdan boğazıma süzülürken, kendimi canlı hissediyorum. İçki sert bir tuğla gibi çarpıyor ve bu gecenin sonsuz bir şenlik gecesi olacağını hissediyorum."
 host_dinner_events.1002.a:0 "Gerçekten kendini aşmışsın [stop_host_scope.GetFirstNameNoTooltip]!"
 host_dinner_events.1002.b:0 "Biraz ölçülü olalım."
 host_dinner_events.1002.c:0 "Ölene kadar içeceğim."
 drank_too_much_toast:0 "Kendinizi sersemletecek kadar içtiniz"
 host_dinner_events.1003.title:0 "Uyuyan [visiting_liege.GetTitleAsNameNoTooltip|U]"
 host_dinner_events.1003.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] gecenin sonunda yattı ve odasında huzur içinde uyuyor, şüphesiz kalan tüm yiyecek ve içecek depolarımı daha da boşaltmanın hayalini kuruyor.\n\nBu belki de efendime sürpriz yapmak için iyi bir fırsattır. Belki biraz gece eğlencesi ya da uyanması için hoş bir şey..."
 host_dinner_events.1003.a:0 "Hadi bir hayalet oyunu ayarlayalım!"
 host_dinner_events.1003.b:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] her zaman iyi bir hediyedir!"
 host_dinner_events.1003.c:0 "Haşhaş kekleri onu memnun edecektir."
 host_dinner_events.1003.d:0 "Bir cariyenin dokunuşu uyanmak için iyi bir yoldur."
 host_dinner_events.1003.e:0 "Benim dostluğum onu kesinlikle memnun edecektir."
 host_dinner_events.1004.title:0 "Korkunç Bir Uyanış"
 host_dinner_events.1004.desc.intro:0 "[stop_host_scope.GetTitledFirstName], gece için en iyi yatak odasını bana verdi. Huzur içinde yatıyorum, aklımda ne bir telaş ne de bir endişe var. Ancak aniden, koridorun sonundan gelen yüksek sesli ve tehditkâr bir kıkırdama ile rüyasız uykumdan uyandım.\n\nLoş ışıkta mumumu titreten dengesiz elimle isteksizce dışarı çıkıyorum ve koridora bakıyorum."
 host_dinner_events.1004.desc.ghost:0 "Uzun ve karanlık koridorun sonunda gördüğüm şeyin bir tür kötü ruh olduğuna yemin edebilirim. Bana fısıldıyor, adımı söylüyor, [ROOT.Char.GetFaith.NegativeAfterLife] için hazır değilim, beni oraya götüremez! Her ne istiyorsa, kendimi kurtarmak için harekete geçmeliyim!"
 host_dinner_events.1004.desc.cynic:0 "Üzerine ince bir çarşaf örtülmüş bir hizmetkârdan biraz daha fazlası olduğunu gördüğümde korkum hemen dağılıyor. Sesler çıkarıyor ve adımı söylüyor ama bir çocuk bile bunun ruh olmadığını anlayabilir.\n\n[stop_host_scope.GetName] şaka yapmaya çalışıyor, hiç şüphem yok."
 host_dinner_events.1004.a:0 "Yardım çağırın!"
 host_dinner_events.1004.b:0 "Kapıya barikat kurun!"
 host_dinner_events.1004.c:0 "Ne eğlence ama"
 host_dinner_events.1004.enjoyed_spooky_ghost:0 "[visiting_liege.GetName] şakadan eğleniyor"
 host_dinner_events.1004.d:0 "[stop_host_scope.GetFirstNameNoTooltip] uykumda beni bunun için mi rahatsız etti?"
 host_dinner_events.1005.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] Hayaleti"
 host_dinner_events.1005.desc:0 "Şakam tahmin ettiğimden de iyi çalışmış gibi görünüyor çünkü [visiting_liege.GetName], onu kurtarmamız için küçük bir çocuk gibi çığlık atıyor ve beni çağırıyor.\n\nOdasına doğru koştum ve onu koridorun sonundaki "hayaleti" işaret ederken bulduğumda bir çarşaf kadar solgun gözüküyordu.\n\n"Çok şükür buradasın! [visiting_liege.GetFaith.NegativeAfterLife|U] için hazır değilim, beni almaya gelmiş kötü bir ruh var!""
 host_dinner_events.1005.a:0 "Ne aptal ama!"
 host_dinner_events.1004.mocked_me:0 "Benimle alay edildi"
 host_dinner_events.1005.b:0 "Bir iyilik karşılığında bu ruhu kovabilirim."
 host_dinner_events.1004.hooked_me:0 "[stop_host_scope.GetName] ruhu kovdu."
 host_dinner_events.1005.c:0 "Defol ruh!"
 host_dinner_events.1006.title:0 "Beklenmedik Uyandırma Çağrısı"
 host_dinner_events.1006.desc.intro:1 "[stop_host_scope.GetName] ile geçirdiğim huzurlu bir gecenin ardından uykumdan uyanıyorum. Bilincimi yeniden kazandığımda, yanımda daha önce olmayan ağır bir şey hissediyorum.\n\n"
 host_dinner_events.1006.desc.alcohol:0 "Tam bir fıçı [stop_host_scope.Custom('RegionalAlcoholicDrink')] sevgilim gibi yanıma devrilmiş, o kadar dolu ki her hareketimde gıcırdıyor ve çalkalanıyor."
 host_dinner_events.1006.desc.weed:0 "Yanımda, kendi vücut ağırlığımca yiyebileceğim kadar haşhaş keki var!"
 host_dinner_events.1006.desc.hedonist:0 "Parmağını merakla göğsümde gezdiren bir [Select_CString(concubine_scope.IsFemale, 'kadının', 'adamın' )] tanıdık dokunuşunu hissediyorum."
 host_dinner_events.1006.desc.vanity:0 "Döndüğümde [stop_host_scope.GetFirstNameNoTooltip] tamamen giyinik bir hâlde, yatağımın ucuna oturmuş bir hâlde olduğunu görüyorum.\n\n"Günaydın efendim. [ROOT.Char.GetTitleAsNameNoTooltip|U] için bir hediye vermenin akıllıca olacağını düşündüm ve benim sohbetimden daha güzel bir hediye olabilir mi ki?""
 host_dinner_events.1006.desc.outro:0 "\n\nBu hediye kesinlikle beklenmedik ama uyanmak için gerçekten hoş bir şey mi?"
 host_dinner_events.1006.a:0 "Uyanmak için ne harika bir yol."
 host_dinner_events.1006.liked_gift:0 "[visiting_liege.GetTitledFirstName] hediyeden memnun kaldı."
 host_dinner_events.1006.b:0 "Çekil gözümün önünden!"
 host_dinner_events.1006.refused_gift:0 "[visiting_liege.GetTitledFirstName] hakarete uğradı."
 host_dinner_events.3001.title:0 "İlginç Bir Öneri"
 host_dinner_events.3001.desc.intro:0 "[stop_host_scope.GetName] ve [stop_host_scope.Custom2('RelationToMeShort', lusty_spouse_scope)] [lusty_spouse_scope.GetName] ile sakin bir akşam yemeğinin tadını çıkarıyorum.\n\n[stop_host_scope.GetNameNoTooltip] mazeret bildirip masadan kalktıktan kısa bir süre sonra [lusty_spouse_scope.GetNameNoTooltip] kuduz bir köpek gibi üzerime atladı!"
 host_dinner_events.3001.desc.not_into_it:0 "Bu sapık [lusty_spouse_scope.Custom2('InsultAdjective', ROOT.Char)] aklımı iffetsiz düşüncelerle karıştırmaya çalışıyor ancak kendimden uzaklaştırmaya çalışıyorum."
 host_dinner_events.3001.desc.into_it:0 "Bu hareketleri beni şaşırtıyor ama ellerimi vücudunda gezdirmekten kendimi alıkoyamıyorum."
 host_dinner_events.3001.desc.mid:0 "[stop_host_scope.GetFirstNameNoTooltip] odadan çıkar çıkmaz [lusty_spouse_scope.GetFirstNameNoTooltip] odadaki en yakın kişi ile eşini aldatmayı düşünüyor. Bu beni şok ediyor, şaşkınlıktan dona kalıyorum."
 host_dinner_events.3001.desc.outro:0 "\n\n"Lütfen beni bu sıkıntıdan kurtar! [stop_host_scope.GetFirstNameNoTooltip] benim sevgilim değil. Kütük bile daha çok sevgi doludur. Beni al ve onun hiç sevmediği kadar sev.""
 host_dinner_events.3001.a:0 "Zevkle!"
 host_dinner_events.3001.b:0 "Bunu [stop_host_scope.GetTitledFirstNameNoTooltip] öğrenmeli, hemen!"
 host_dinner_events.3001.c:0 "Bunu kimseye anlatmayacağım ama bana borçlusun."
 host_dinner_events.3001.d:0 "Çekil üstümden, utanmaz fahişe!"
 host_dinner_events.3002.title:0 "[lusty_spouse_scope.GetFirstNameNoTooltip]: Zinacı"
 host_dinner_events.3002.desc:0 "Bir anlık aradan sonra yemeğe geri dönüyorum ve döndüğümde [lusty_spouse_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] ile [visiting_liege.GetName] huzursuz gözüküyorlar.\n\n"Ne yazık ki çok kötü haberlerim var. Siz yokken, bu utanmaz zampara benimle zina etmeye kalkıştı!""
 host_dinner_events.3002.a:0 "Bunlar boşanma gerekçeleridir."
 host_dinner_events.3002.b:0 "Bu aramızda kalsın."
 host_dinner_events.3002.c:0 "Bunu duymamış gibi davranacağım."
 host_dinner_events.3002.d:0 "Onu asla affetmeyeceğim."
 host_dinner_events.1007.title:0 "Unutulmaz Bir Performans"
 host_dinner_events.1007.desc:0 "Fark ettim ki son zamanlarda [visiting_liege.GetName] yanımdayken çok sıkılıyor, sıkıntıdan uykuya dalmak üzere bir hâle geliyor.\n\nOnun boş boş yemeğini itip kakmasını izlerken aklıma bir düşünce geliyor. O dolu dolu bir hayat yaşadı, belki de ünlü kahramanlıklarından birini bir oyun şeklinde yeniden yaratırsak gururu okşanır!\n\nTek soru şu: [visiting_liege.GetNameNoTooltip] ne tür bir oyunu daha eğlenceli bulurdu?"
 host_dinner_events.1007.a:0 "Elbette bir savaş oyunu!"
 host_dinner_events.1007.b:0 "Nefret ettiği düşmanının ölümü üzerine bir komedi!"
 host_dinner_events.1007.c:0 "Bir trajediden etkilenecektir."
 host_dinner_events.1007.d:0 "Evliliğin zevkleri üzerine bir şey!"
 host_dinner_events.1007.e:0 "Kötü bir fikir."
 host_dinner_events.1008.title:0 "$host_dinner_events.1007.title$"
 host_dinner_events.1008.desc.intro:0 "Görünüşe göre [stop_host_scope.GetName] bu akşam beni eğlendirmek için bir gösteri düzenlemeye karar vermiş. Ziyafet masasında oturmuş hevesle eğlencemi beklerken"
 host_dinner_events.1008.desc.mid.war_memory:0 "[stop_host_scope.GetNameNoTooltip] zırhıyla karşımda belirdi.\n\n"İşte karşınızda! Ben kudretli [loser.GetName] ve aşağılık [visiting_liege.GetNameNoTooltip] elimden kaçamaz!"\n\nBen cevap veremeden elime tahta bir kılıç tutuşturuldu. [memory_performance_scope.GetDescription], bu gösteri hiç şüphesiz o zamandan olmalı."
 host_dinner_events.1008.desc.mid.dead_rival_memory:0 "[stop_host_scope.GetNameNoTooltip] çirkin makyajı ve kalitesiz elbisesiyle çıkageldi.\n\n"Eyvahlar olsun! Ölümlü bedenime daha fazla tutunamayacağım. [visiting_liege.GetNameNoTooltip] rezil olmamalı!"\n\nGösteri çok fazla mide gurultusu ve alaycı acı sesleri içeriyor, [memory_performance_scope.GetDescription|l] sanırım o zamandan olmalı."
 host_dinner_events.1008.desc.mid.dead_positive_relation_memory:0 "[stop_host_scope.GetNameNoTooltip] sevgilim [dead_relation.GetName] gibi giyinmiş bir şekilde beliriyor.\n\n"Eyvah, [dead_positive_relation_memory_scope.dead_relation.GetFaith.PositiveAfterLife|U] beni çağırıyor. Sadece [visiting_liege.GetNameNoTooltip] ve onunla geçirdiğimiz tüm o harika zamanları düşünüyorum."\n\n[memory_performance_scope.GetDescription], sanırım o zamanı canlandıran içten bir trajik gösteri."
 host_dinner_events.1008.desc.mid.marriage_memory:0 "[stop_host_scope.GetNameNoTooltip], düğün günümüzde [spouse.GetName] nasıl giyindiyse neredeyse aynısını giyinmiş.\n\n"Gerçekten bu hayatımın en güzel günü! Harika [visiting_liege.GetNameNoTooltip] ile evleneceğim!"\n\n[stop_host_scope.GetName], elini tutup eşlik etmem için sahneye davet etti ama"
 host_dinner_events.1008.desc.outro:0 "Acaba buna izin vermeli miyim?"
 host_dinner_events.1008.a:0 "Ne kadar harika!"
 host_dinner_events.1008.b:0 "Bu bir hakarettir!"
 host_dinner_events.3003.title:0 "Yerel Bir Lezzet"
 host_dinner_events.3003.desc:0 "Bu akşamki yemek alışık olduğumdan biraz farklı. Aşçı kaseyi umursamaz bir şekilde önüme bırakıyor ve hemen hayatımda kokladığım en insanlık dışı aroma ile karşılaşıyorum.\n\n[ROOT.Char.GetFaith.NegativeAfterLife|U] çukurlarında bile yemek bundan iyi gözüküyordur. Sümüksü gri bir madde, soluk köpüklü et suyunun içinde bakımsız bir lazımlık gibi duruyor ve iştah açıcı görünmesi için beyhude bir çabayla üzerine tek bir bitki dalı yerleştirilmiş.\n\nTüm içgüdülerim beni bu şeyi en yakın pencereden dışarı atmaya zorluyor ama [stop_host_scope.GetNameNoTooltip] bunun [ROOT.Char.GetTitleAsNameNoTooltip] için özel yapılmış yerel bir lezzet olduğunu söylüyor."
 host_dinner_events.3003.a:0 "Bir şekilde yiyeceğiz!"
 host_dinner_events.3003.disgusting:0 "Yemek iğrençti"
 host_dinner_events.3003.delicious:0 "Lezzeti inanılmazdı"
 host_dinner_events.3003.b:0 "Bu pisliğin dilime değmesine izin vermeyeceğim."
 host_dinner_events.3003.c.my_dog:0 "Belki çaktırmadan köpeğime yedirebilirim."
 host_dinner_events.3003.c.lieges_dog:0 "[stop_host_scope.GetFirstNameNoTooltip] köpeğini getirmiş, belki gizlice ona yedirebilirim..."
 host_dinner_events.3003.unnoticed:0 "[stop_host_scope.GetNameNoTooltip] fark etmedi"
 host_dinner_events.3003.host_noticed:0 "[stop_host_scope.GetNameNoTooltip] fark etti"
 host_dinner_events.3004.title:0 "Erken Verilmiş Bir Söz"
 host_dinner_events.3004.desc.intro:0 "Bugün akşam yemeğine erken geldim ve [stop_host_scope.GetName] henüz gelmemiş ancak vârisi [stop_host_heir.GetName] burada."
 host_dinner_events.3004.desc.mid.child:0 "O daha genç ve anlaşılıyor ki aynı odada bir [ROOT.Char.GetTitleAsNameNoTooltip] ile durmaktan çekiniyor."
 host_dinner_events.3004.desc.mid.adult:0 "Onun güvene dayalı doğasından faydalanılabilir. Henüz daha bir çocuk gibi, kafası boş ve şekillendirilebilir ve onun küçük zihnini benim vizyonumla hizaya getirmek çok kolay."
 host_dinner_events.3004.desc.outro:0 "\n\nZavallıyı bana yasal sadakat yeminini erkenden vermesi için manipüle etmek çok kolay olurdu ama bu kesinlikle [stop_host_scope.GetNameNoTooltip] için üzücü olur."
 host_dinner_events.3004.a:0 "Hadi yapalım şu işi!"
 host_dinner_events.3004.a.caught:0 "Adaletsizlik girişiminiz fark edildi"
 host_dinner_events.3004.a.not_caught:0 "Sözler söylendi ve geri alınamaz"
 host_dinner_events.3004.b:0 "Sadece sohbet edeceğiz."
 host_dinner_events.3004.friendly_convo:0 "Dostça bir konuşma yaptınız"
 host_dinner_events.3004.awkward_convo:0 "Konuşma garipleşti"
 host_dinner_events.3005.title:0 "$host_dinner_events.3004.title$"
 host_dinner_events.3005.desc:0 "Yemek salonuna girdiğim sırada [visiting_liege.GetName] ve [stop_host_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] devlet meseleleri ve yükümlülükler hakkında konuşuyorlar\n\n[visiting_liege.GetName] onu yokluğumda kraliyete sadakat yemini etmesi için manipüle ediyor gibi görünüyor! Böyle bir yemin hayatı boyunca onun yakasını bırakmaz ancak [visiting_liege.GetName] bize astları olarak davranacağı için geleceğimizi sağlamlaştıracak!"
 host_dinner_events.3005.a:0 "Kendi iyiliğim için buna izin vereceğim."
 host_dinner_events.3005.hook_for_hook:1 "[stop_host_scope.GetName] bir bedel talep ediyor"
### TODO AGOT-ONLY: host_dinner_events.3005.b [AGOT: ]
 host_dinner_events.3005.b:0 ""Stop this madness at once!""
 host_dinner_events.3005.disallowed_hook:0 "Yakalandınız"
 host_dinner_events.3006.title:0 "Daha İyi Bir Yaşam Hayalleri"
 host_dinner_events.3006.desc.intro:0 "Bu akşam [runaway_courtier.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] ile yan yana oturuyorum. Özlemle tabağına doğru iç çekişini izliyorum.\n\n"
### TODO AGOT-ONLY: host_dinner_events.3006.desc.mid.concubine [AGOT: ]
 host_dinner_events.3006.desc.mid.concubine:0 ""Ah, I apologize for my melancholy, my [ROOT.Char.GetTitleAsNameNoTooltip|U]. [stop_host_scope.GetNameNoTooltip] probably seated me next to you to please you. [stop_host_scope.GetSheHe|U]'s like that, [stop_host_scope.GetSheHe] only sees me as some object to be ogled and played with. To tell the truth, I have been dreaming of coming back with you to [ROOT.Char.GetCapitalLocation.GetName].""
### TODO AGOT-ONLY: host_dinner_events.3006.desc.mid.neutral [AGOT: ]
 host_dinner_events.3006.desc.mid.neutral:0 ""Truly, I grow tired of life here in [stop_host_scope.GetCapitalLocation.GetName] and long to elevate my station in life. My talents are wasted here, and lately I've been thinking of slipping off with you back to [ROOT.Char.GetCapitalLocation.GetName] where I can really show what I'm worth!""
 host_dinner_events.3006.desc.outro:0 "\n\nYakınmaları samimi gözüküyor ancak [stop_host_scope.GetNameNoTooltip] sarayından birisini almama ne der?"
 host_dinner_events.3006.a:0 "Tabii ki, benimle gel!"
### TODO AGOT-ONLY: host_dinner_events.3006.b [AGOT: ]
 host_dinner_events.3006.b:0 ""I will appreciate more than your beauty.""
 host_dinner_events.3006.c:0 "En azından ağlaman için bir omuz olabilirim."
### TODO AGOT-ONLY: host_dinner_events.3006.d [AGOT: ]
 host_dinner_events.3006.d:0 ""Know your place, [runaway_courtier.Custom2('InsultNoun', ROOT.Char)]!""
 host_dinner_events.3007.title:0 "Çalınan Saray Mensubu"
 host_dinner_events.3007.desc.intro:0 "[visiting_liege.GetName] ve [runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] planladığım gibi yan yana oturdu, iyi bir fikir olduğunu düşünmüştüm ve beklediğimden de iyi çıktı."
 host_dinner_events.3007.desc.mid.concubine:0 "\n\n[runaway_courtier.GetNameNoTooltip] beni görünce yüzünü buruşturdu ve bakışlarını kaçırdı."
 host_dinner_events.3007.desc.mid.neutral:0 "\n\n[runaway_courtier.GetNameNoTooltip] beni görünce gözlerini deviriyor ve hemen bakışlarını kaçırıyor."
 host_dinner_events.3007.desc.outro:0 "O, [visiting_liege.GetName] için sarayımı terk etmeye kararlı görünüyor! Bunu durdurabilirim ama bu kesinlikle akşam yemeğinin tadını kaçıracaktır."
 host_dinner_events.3007.a:0 "Bunu yasaklıyorum!"
 host_dinner_events.3007.refused_to_let_them_go:0 "[stop_host_scope.GetName] gitmesine izin vermedi"
 host_dinner_events.3007.b:0 "Gitmesine izin ver."
 host_dinner_events.3008.title:0 "Biraz Merak"
 host_dinner_events.3008.desc:0 "Sabah oldu ve sabah güneşi aniden göz kapaklarımı delip geçerken isteksizce gözlerimi dünyaya açıyorum. Bir hizmetçinin odamda beceriksizce dolaştığını görüyorum, kahvaltımı yanıma koyarken sallanıyor. Derdinin ne olduğunu soruyorum ve bu kadar küçük bir kışkırtmayla bile kelimeler kusmaya başlıyor.\n\n"Ah benim bilge ve nazik [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )], bu duvarların dili olsa da konuşsa. Neler biliyorlar neler. Ben de öyle. Size söylersem [stop_host_scope.GetName] beni asla affetmez ama artık bu sırları kafamda tutamıyorum!""
### TODO AGOT-ONLY: host_dinner_events.3008.a [AGOT: ]
 host_dinner_events.3008.a:0 ""You must tell me at once!""
 host_dinner_events.3008.secret_discovered:0 "Bir sırrı ortaya çıkarıyor"
### TODO AGOT-ONLY: host_dinner_events.3008.b [AGOT: ]
 host_dinner_events.3008.b:0 ""Would some coin loosen those lips?""
 host_dinner_events.3008.acting_sussy:0 "[stop_host_scope.GetName] sizden şüpheleniyor"
### TODO AGOT-ONLY: host_dinner_events.3008.c [AGOT: ]
 host_dinner_events.3008.c:0 ""You should just keep your mouth shut.""
 host_dinner_events.1009.title:0 "Ekselansları"
 host_dinner_events.1009.desc:0 "Ana yemeklerimizi bitirdiğimizde, övgü ve onay için [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ile göz göze geliyorum ancak onun gözlerinde de beklenti dolu bir bakış olduğunu fark ediyorum. Belli ki sağladıklarım saygıdeğer konuğum için yeterli değil ama aşçılar zaten onlardan istediğim her şeyi yapmışlar ve servis edecek başka bir şeyimiz olduğundan bile emin olamıyorum.\n\nSonra aklıma kilerde hâlâ yenmeye hazır bir yığın haşhaş keki olduğu geliyor! Tek soru şu: Bu lezzeti [visiting_liege.GetTitleAsNameNoTooltip|U] ile paylaşmak istiyor muyum?"
 host_dinner_events.1009.a:0 "Kekleri getirin!"
 host_dinner_events.1009.b:0 "Eminim [ROOT.Char.Custom('GetExpensiveDessert')] yeterli olacaktır."
 host_dinner_events.1010.title:0 "Ekselansları"
 host_dinner_events.1010.desc:0 "Son yemeğimi bitirdiğimde, midemde tatlı olması gereken yerde bir boşluk varmış gibi hissetmekten kendimi alamıyorum. [stop_host_scope.GetName] aklımdan geçenleri okuyabiliyor gibi görünüyor, çünkü ben daha söylenmeye fırsat bulamadan, 'özel keklerini' getirmesi için bir hizmetçi çağırıyor.\n\n"[visiting_liege.GetTitleAsNameNoTooltip|U] için en iyi haşhaş kekleri!" derken tabağıma dağ gibi tatlı geliyor."
 host_dinner_events.1010.a:0 "Hepsini yiyeceğim!"
 host_dinner_events.1010.b:0 "Asla yemem!"
 host_dinner_events.1011.title:0 "Beslenme Farklılıkları"
 host_dinner_events.1011.desc.intro:0 "[visiting_liege.GetName] bir başka harika [ROOT.Char.GetPrimaryTitle.GetAdjective] mutfağı yemekleri için masaya oturduğunda, yemeklerimizden bıkmaya başladığını fark ediyorum.\n\n"
 host_dinner_events.1011.desc.vegetarian:0 "[ROOT.Char.GetFaith.CreatorName|U] bize bitkiler sunmuş ve biz sadece bu bitkileri servis ederiz. Asla kuş ya da hayvan eti yemeyiz. Ancak [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] topraklarında işler biraz farklı yürüyor. Daha misafirperver bir ev sahibi olmak için inançlarımdan ödün vermeli miyim? Menüye et eklemeli miyim?"
 host_dinner_events.1011.desc:0 "Biz bol bol et yesek de [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] topraklarında böyle bir şey tamamen yasak. Şimdiye kadar [visiting_liege.GetName] verilenleri yiyor ama etleri bir kenara bırakıyor. [visiting_liege.GetTitleAsNameNoTooltip|U] için uygunsuz yemekler veriyoruz! Bunun devam etmesine gerçekten izin verebilir miyim? Belki de [visiting_liege.GetTitleAsNameNoTooltip|U] etraftayken hepimiz etsiz bir diyet yapmalıyız."
 host_dinner_events.1011.a:0 "Bu beni onun gözüne sokacaktır."
 host_dinner_events.1011.b:0 "Eminim bu iyiliği unutmayacaktır."
 host_dinner_events.1011.c:0 "O buradayken, bizim yediğimiz gibi yiyecek!"
 host_dinner_events.1020.title:0 "Unutulmayacak Bir Pasta"
 host_dinner_events.1020.desc:0 "Başka bir gece, başka bir tatlı ve [visiting_liege.GetName] şimdiden [ROOT.Char.Custom('GetExpensiveDessert')] yemekten bıkmış gibi görünüyor. Belki de bu gece biraz farklı bir şey yapmanın zamanıdır.\n\nBelki de bu muammaya bir çözüm olarak aşçılarımdan ve fırıncılarımdan sevgili efendim için çok şey ifade eden bir tatlı hazırlamalarını isteyebilirim. Belki de hünerini simgeleyen bir kale ya da hiç beklemeyeceği bir şey..."
 host_dinner_events.1020.a:0 "Bir kale tabii!"
 host_dinner_events.1020.b:0 "[visiting_liege.GetFaith.ReligiousSymbol|U] harika bir şekil olurdu!"
 host_dinner_events.1020.c:0 "Belki de insan anatomisinin belli bir kısmı."
 host_dinner_events.1020.d:0 "Bu korkunç bir fikir."
 host_dinner_events.1021.title:0 "$host_dinner_events.1020.title$"
 host_dinner_events.1021.desc.intro:0 "Yemek masasında oturup tatlımı bekliyorum ve nihayet geldiğinde sevincimi zorlukla bastırabiliyorum!\n\n"
 host_dinner_events.1021.desc.mid.castle:0 "Önüme [ROOT.Char.GetCulture.GetName] kalesi şeklinde nefis bir pasta konuyor. Bu şey o kadar otantik ki, tatlımın duvarlarını aşmaya çalışan küçük ballı istilacıları hayal edebiliyorum."
 host_dinner_events.1021.desc.mid.religious:0 "[ROOT.Char.GetFaith.ReligiousSymbol|U] şeklinde düzgünce süslenmiş bir pasta tabağı önüme geldi. Bu şey o kadar inanılmaz dekore edilmiş ki sanki bizzat [ROOT.Char.GetFaith.CreatorName] benim için yapmış!"
 host_dinner_events.1021.desc.mid.lewd:0 "Kendimi daha fazla tutamıyorum ve et rengindeki pasta sütunu önüme konduğunda kontrolsüz bir kahkaha patlatıyorum. Korkunç büyüklükteki pastanın üzerindeki müstehcen detaylara [ROOT.Char.GetFaith.DevilName] bile utanır!"
 host_dinner_events.1021.desc.mid.lewd_woman:0 "Kendimi daha fazla tutamıyorum ve iki meyve konularak yapılmış 'meme ucuyla' süslenmiş, sallanan iki tatlı küresi önüme bırakıldığında kontrol edilemez bir kahkaha patlatıyorum. pastanın üzerindeki müstehcen detaylara [ROOT.Char.GetFaith.DevilName] bile utanır!"
 host_dinner_events.1021.desc.outro:0 "\n\nElbette hoşuma gidiyor ama tek soru şu: Minnettarlığımı en iyi nasıl gösterebilirim?"
 host_dinner_events.1021.a:0 "Bunu unutmayacağım!"
### TODO AGOT-ONLY: host_dinner_events.1021.b [AGOT: ]
 host_dinner_events.1021.b:0 ""I owe you one!""
 host_dinner_events.1022.title:0 "$host_dinner_events.1020.title$"
 host_dinner_events.1022.desc.intro:0 "Yemek masasında oturup tatlımı bekliyorum ve nihayet geldiğinde öfkemi zor zapt ediyorum!\n\n"
 host_dinner_events.1022.desc.mid.castle:0 "Önüme sanırım bir [ROOT.Char.GetCulture.GetName] kalesi şeklinde olması gereken ancak kendi ağırlığı altında ezilip büzülüp dağılmış bir pasta görünce dehşete düşüyorum. Bu benim hünerlerime karşı bir çeşit hakaret mi?"
 host_dinner_events.1022.desc.mid.religious:0 "[ROOT.Char.GetFaith.ReligiousSymbol|U] şeklinde bir pastaya benzeyen şeyi görünce şok oluyorum! Bu mutfak gösterisi bir küfürdür ve midemi o kadar bulandırıyor ki, ona dokunmakta zorlanıyorum!"
 host_dinner_events.1022.desc.mid.lewd:0 "Gördüğüm şey, bir tabağın üzerine yerleştirilmiş, açıkça müstehcen bir vücut parçası şeklinde yapılmış, et renginde iğrenç bir tümsek. [stop_host_scope.GetName] bu bayağılıktan etkilenmemi mi bekliyor?"
 host_dinner_events.1022.desc.outro:0 "\n\nBu şeye bakınca sadece hakarete uğramış hissediyorum ama belli ki [stop_host_scope.GetFirstNameNoTooltip] bunu samimi bir iltifat girişimi olarak planlamış."
 host_dinner_events.1022.a:0 "Oh, bayıldım!"
 host_dinner_events.1020.likes_it:0 "[visiting_liege.GetFirstName] beğendi"
### TODO AGOT-ONLY: host_dinner_events.1022.b [AGOT: ]
 host_dinner_events.1022.b:0 ""How dare you!""
 host_dinner_events.1020.hates_it:0 "[visiting_liege.GetFirstName] nefret etti"
 host_dinner_events.1030.title:0 "İstenmeyen Misafir"
 host_dinner_events.1030.desc:0 "Efendimin burada geçirdiği süre akşamlar boyunca yemeği hep hazırdı ve bu akşamki yemeği sanırım en iyisi! [visiting_liege.GetName], tabağını gördüğünde ağzı sulanıyor. Tam ilk lokmayı almak üzereyken [rival_scope.Custom2('NamePossessiveCharacterIntroduction', visiting_liege)] salona dalıyor ve düşmanının tabağına doğru koşuyor.\n\n"Bu akşamki yemek de ne güzelmiş! Böylesine alçak bir [visiting_liege.GetTitleAsNameNoTooltip], böylesine güzel bir yemeği kokuşmuş ağzına atarak ziyan edecek, çok yazık!"\n\n[visiting_liege.GetNameNoTooltip] hemen yüzünü ekşitti ve eğer bir şey yapmazsam yumruk yumruğa bir kavganın başlaması çok uzun sürmeyecek gibi gözüküyor."
### TODO AGOT-ONLY: host_dinner_events.1030.a [AGOT: ]
 host_dinner_events.1030.a:0 ""Guards! Remove this fool at once!""
 host_dinner_events.1030.b:0 "Belki de ikisini de kontrol altına alabilirim."
 host_dinner_events.1030.c:0 "[rival_scope.GetFirstNameNoTooltip] çok komik! Bırakın konuşalım!"
 host_dinner_events.1031.title:0 "$host_dinner_events.1030.title$"
 host_dinner_events.1031.desc.intro:0 "Kaldığım süre boyunca benim için her akşam yemek hazırlandı ve bu akşakmki gerçekten çok başarılı görünüyor! Bu sulu ve leziz gözüken yemeğe bakarken bile ağzım sulanıyor ve tam ilk lokmamı almak üzereyken rahatsız edici derecede tanıdık bir ses kulağımı tırmalıyor.\n\n[rival_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] belli ki iştahımı kaçırmak için gelmiş ve varlığı bile beni tiksindiriyor."
 host_dinner_events.1031.desc:0 "\n\n[stop_host_scope.GetName] bu baş belası [rival_scope.Custom2('InsultNoun', ROOT.Char)] ile ilgilenebileceğini söyledi ancak bir art niyeti olduğunu hissediyorum."
 host_dinner_events.1031.a:0 "Evet, evet, ne olursa olsun!"
 host_dinner_events.1031.b:0 "Daha kötülerine de katlandım."
 host_dinner_events.1030.liege_refuses:0 "[visiting_liege.GetFirstName] kozu reddetti"
 host_dinner_events.1032.title:0 "$host_dinner_events.1030.title$"
 host_dinner_events.1032.desc:0 "\n\nİşin daha da kötüsü [stop_host_scope.GetName] benim mutsuzluğuma sevinmiş gibi gözüküyor ve kraliyetin yeminli bir düşmanıyla gülüp şakalaşmaya başlıyor!"
 host_dinner_events.1032.a:0 "[stop_host_scope.GetFirstNameNoTooltip] tehlikeli bir oyun oynuyor."
 host_dinner_events.1032.b:0 "Diğer yanağımı dönmeliyim."
 host_dinner_events.3010.title:0 "Alışılmadık Bir Tat"
 host_dinner_events.3010.desc:1 "[stop_host_scope.GetName] beni bir süredir misafir ediyor. Bu akşam önüme bilmediğim bir yemek geliyor. Bıçağımla hafifçe vuruyorum, koyu renkli bilmediğim bir sos çamur gibi akıyor.\n\nBaşkentten bildiğim bir yemek için neler vermezdim. Sadece basit bir [ROOT.Char.Custom('GetExpensiveDessert')] bile olurdu. [stop_host_scope.GetTitledFirstNameNoTooltip] gücenecek olmasa bildiğim yemeklerden isteyebilirdim."
 host_dinner_events.3010.a:0 "Aslında sormakta sakınca olmaz."
 host_dinner_events.3010.b:0 "Eminim yerel yemekler iyidir."
 host_dinner_events.3011.title:0 "$host_dinner_events.3010.title$"
 host_dinner_events.3011.desc:1 "Bu yemeklerle kendimizi gerçekten aştık! Aşçılarım ağız sulandıran göz kamaştırıcı bir dizi yemek yaptılar ancak [visiting_liege.GetName] hiçbirine dokunmak istemiyor gibi görünüyor.\n\n"Bu yemek benim damak tadıma uygun değil. Bana biraz [ROOT.Char.Custom('GetExpensiveDessert')] getirebilir misiniz? Ah, dilimin üzerine kondurdukları tatlı öpücüklerini nasıl da özledim."\n\nBu biraz aşağılayıcı, bu davranışı kısa sürede unutulmayacaktır..."
 host_dinner_events.3011.a:0 "Tabii ki de!"
 host_dinner_events.3011.gave_local_food:0 "[stop_host_scope.GetName] kabul etti"
 host_dinner_events.3011.b:0 "Bu bir hakarettir!"
 host_dinner_events.3011.refused_local_food:0 "[stop_host_scope.GetName] hakarete uğradı"
 host_dinner_events.3020.title:0 "Yarışma"
 host_dinner_events.3020.desc:0 "Bu akşam neşeli, uzun ve harikulade bir şenlik oldu. Ev sahibim [stop_host_scope.GetName] ile kadehlerce [stop_host_scope.Custom('RegionalAlcoholicDrink')] içtik.\n\nAncak görünen o ki [stop_host_scope.GetTitledFirstNameNoTooltip] benden daha fazla içmeye çalışıyor, kendi kadehini her zaman benimkinden biraz daha fazla dolduruyor. Bu bir çeşit üstü kapalı meydan okuma mı? Belki de bahse girme vakti gelmiştir."
 host_dinner_events.3020.a:0 "Hünerlerimi küçümsüyorsun!"
 host_dinner_events.3020.b:0 "Sakın deneme."
 host_dinner_events.3021.title:0 "$host_dinner_events.3020.title$"
 host_dinner_events.3021.desc:0 "Bu akşam neşeli, uzun ve harikulade bir şenlik oldu. [visiting_liege.GetName] ile kadehlerce [stop_host_scope.Custom('RegionalAlcoholicDrink')] içtik.\n\nAncak, görünüşe göre biraz fazla içmişim ve [visiting_liege.GetTitledFirstNameNoTooltip] bunu bir meydan okuma olarak algılamış\n\n"Bir [visiting_liege.GetTitleAsNameNoTooltip|U] ile boy ölçüşebileceğini mi sandın? Benden daha çok içebileceğini düşünüyorsan bunu test etmeye ne dersin? Kazanan da şey yapar... şey, ödülü daha sonra düşünürüz ha?""
 host_dinner_events.3021.a:0 "Hadi içelim!"
 host_dinner_events.3021.b:0 "Gerçekten durmalıyım."
 host_dinner_events.3020.refused_to_drink:0 "[stop_host_scope.GetName] meydan okumayı reddetti"
 host_dinner_events.3030.title:0 "Bir Çırak"
 host_dinner_events.3030.desc:0 "Bu akşam [promising_child.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] ile oturdum ve çocuk gerçekten ilgimi çekti. Onunla konuştukça, hayalimdeki gibi şekillenme potansiyelini daha fazla görüyorum.\n\nİçimden onu evime götürmek geliyor ama [Select_CString(stop_host_scope.IsFemale, 'annesi', 'babası' )] olmadan böyle bir şey yapamam ve karşılığında o da benden bir şeyler isteyebilir."
 host_dinner_events.3030.a:0 "Sormalıyım."
 host_dinner_events.3030.b:0 "Zamanım yok."
 host_dinner_events.3031.title:0 "[promising_child.GetFirstNameNoTooltip]: [visiting_liege.GetTitleAsNameNoTooltip] Vasisi"
 host_dinner_events.3031.desc:0 "Görünüşe göre [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)], [promising_child.Custom2('MyCharacterIntroduction', ROOT.Char)] ile güzel vakit geçirmiş. İkili tüm akşam [visiting_liege.GetMotherFather] [promising_child.Custom('GetDaughterSon')] gibi konuşarak geçirdi!\n\n[visiting_liege.GetNameNoTooltip] yüzünde kocaman bir gülümsemeyle bana yaklaşıyor. "Bu çocuk ile konuşmak tam bir zevk! Onu eve götürüp başkentte yetiştirmekten başka bir şey istemem. Böylesine gelecek vaadeden bir genç tüm günlerini [ROOT.Char.GetCurrentLocation.GetName] topraklarında geçirmemeli, haksız mıyım?""
 host_dinner_events.3031.a:0 "Haklısın."
 host_dinner_events.3031.b:0 "Haksızsın!"
 host_dinner_events.3030.refused_to_allow_ward:1 "[stop_host_scope.GetFirstName], [promising_child.GetFirstName] adlı kişinin gitmesini yasaklıyor"
 host_dinner_events.3040.title:0 "Tüm Hamur İşlerini Kim Yedi?"
 host_dinner_events.3040.desc:0 "Beklediğim gibi bu akşam da yiyecekler üst üste yığılmıştı. Ancak, çok sevdiğim küçük hamur işleri yok gibi görünüyor. Yüzümde şaşkın bir ifadeyle [stop_host_scope.GetTitledFirstNameNoTooltip] ile bakışıyorum.\n\n"Hükümdarımız bundan daha fazlasını bekliyordu biliyorum. Her şey servis edilmek için hazırdı ancak aşçı her şeyin kaybolduğunu söyledi. Obur hırsızı bulmaya çalıştık ancak arkasında bir iz bırakmamış.""
 host_dinner_events.3040.a:0 "Ben bulurum!"
 host_dinner_events.3040.didnt_solve_mystery:0 "Hırsızı bulamadınız."
 host_dinner_events.3040.b:0 "Üzdü."
 host_dinner_events.3040.disappointed_in_vassal:0 "Kızgın değilim, sadece hayal kırıklığına uğradım"
 host_dinner_events.3041.title.deviant:0 "[pie_eater_scope.GetCulture.GetNameNoTooltip] Turta"
 host_dinner_events.3041.title:0 "Tüm Hamur İşini [pie_eater_scope.GetFirstNameNoTooltip] Yemiş!"
 host_dinner_events.3041.desc.deviant:0 "Koridor boyunca kırıntıların, yağ ve sos lekelerinin izini takip ederek sonunda suçluyu buluyorum. Ancak göreceğim şeye beni hiçbir şeyin hazırlayabileceğini sanmıyorum.\n\nİçeri girdiğimde [pie_eater_scope.GetTitledFirstName] tamamen çıplak ve sırtı dönük bir şekilde duruyor. Girdiğimde beni görmek için dönüyor ve tüm hamur işi bel hizasına denk gelecek şekilde önünde gözüküyor, tek bir turta ise uygunsuz yerinin üstünde durarak kapatıyor.\n\n"Ah! Ben... her şey göründüğü gibi değil, [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )]! Lütfen bunu kimseye söylemeyin!""
 host_dinner_events.3041.desc:0 "Kırıntıların, sos ve yağ lekelerinin izini koridor boyunca takip ediyorum ve sonunda suçluyu buluyorum!\n\nYatak odasına girdiğimde [pie_eater_scope.GetName], tüm hamur işleri ile birlikte tek başına oturuyor.\n\n"Ah! [Select_CString(visiting_liege.IsFemale, 'Leydim', 'Lordum' )], bunları elbette size getirecektim ama görüyorsunuz... yemek sırası bana gelinceye kadar hep bitiyorlar, ben de önceden bir iki tane gizlice alayım dedim. Lütfen bunu kimseye söylemeyin!""
 host_dinner_events.3041.a:0 "Bir iyilik karşılığında seni bırakacağım."
 host_dinner_events.3041.b:0 "Aramızda bir sır olarak kalsın."
 host_dinner_events.3041.c:0 "Kimseye söylemeyeceğim."
 host_dinner_events.3041.d:0 "Hah! Yakalandın, [pie_eater_scope.Custom2('InsultAdjective', ROOT.Char)] [pie_eater_scope.Custom2('InsultNoun', ROOT.Char)]."
 host_dinner_events.3041.e:0 "Ben de deneyebilir miyim?"
 host_dinner_events.3041.f:0 "Hadi paylaşalım!"
 host_dinner_events.3050.title:0 "İştahsızlık"
 host_dinner_events.3050.desc:0 "Bu akşamki yemeğin tadına doyum olmadı ancak şefler yemekleri üst üste yığmaya devam ederken fark ettim ki [non_eater_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] tabağına koyduğu az miktardaki yemeğe neredeyse hiç dokunmamış.\n\nİştahsızlık başka zaman olsa sorun olmazdı ama [stop_host_scope.GetName], maiyetimden birinin yemeklerini karıştırıp didiklemesinden dolayı hakarete uğramış gibi görünüyor."
### TODO AGOT-ONLY: host_dinner_events.3050.a [AGOT: ]
 host_dinner_events.3050.a:0 ""Eat something for [ROOT.Char.GetFaith.HighGodNamePossessive] sake!""
 host_dinner_events.3050.convinced_to_eat:0 "Yemesi için ikna ettiniz"
 host_dinner_events.3050.annoyed_courtier:0 "Onu kızdırdınız"
 host_dinner_events.3050.b:0 "Onun için bahaneler uyduracağım."
 host_dinner_events.3060.title:0 "Lezzetli Bir İkram"
 host_dinner_events.3060.desc:0 "Bu akşamki yemek gerçekten çok lezzetliydi. Tuzlu ve tatlı her türlü yiyecekle ziyafet çektim, ancak hiçbir şey iştahımı bu güzel [stop_host_scope.Custom('GetExpensiveDessert')] kadar açmadı!\n\nNe kadar çok yersem yiyeyim onlara doyamıyorum. Her ısırıkta kendimi hazzın içinde kaybolurken buluyorum, ağzımda patlayan lezzet bana sanki [ROOT.Char.GetFaith.PositiveAfterLife] gibi geliyor.\n\nMidem tıka basa dolu ve kıyafetlerim gergin olsa da, daha fazlasını yemeye mecbur hissediyorum."
 host_dinner_events.3060.a:0 "Yememek ayıp olur!"
 host_dinner_events.3060.satisfying_dessert:0 "Tatmin oldunuz"
 host_dinner_events.3060.too_much_dessert:0 "Çok fazla yediniz"
 host_dinner_events.3060.b:0 "Hayır, durmalıyım."
 host_dinner_events.3061.title:0 "Dönek Kalp"
 host_dinner_events.3061.desc:0 "Yemeğimin son kısmını da bitirdim ve gerçekten karnımı doyurdum. Midem beni biraz rahatsız etse de tatmin olmuş bir şekilde yatağa uzandım.\n\nYatakta uzanırken, yediğim tüm tatlıların kalbime ulaştığını ve biraz daha sert çarptığını hissediyorum. Her vuruşta yoğunluk artıyor, #EMP daha sert ve daha hızlı#!. Kalbimin göğsümden fırlamak üzere olduğunu hissediyorum. Tüm vücudumu soğuk bir ter kaplıyor ve nefeslerim köşeye sıkışmış bir [ROOT.Char.Custom('GetAnimalType')] gibi sığ ve hızlı hâle gelirken boğazım kuruyor!\n\nSonra aniden her şey duruyor."
 host_dinner_events.3061.a:0 "Zehirlenmiş olmalıyım!"
 host_dinner_events.3070.title:0 "[potential_friend_scope.GetFirstNameNoTooltip] İçin Hikâye"
 host_dinner_events.3070.desc:0 "Neşeli bir akşam daha sona eriyor ve kendimi [potential_friend_scope.GetName] ile sohbet ederken buluyorum.\n\nBirden sohbetimiz dışında oda sessizleşti ve herkes ağzımdan çıkacak sıradaki kelimeye kilitlendi. Biraz garip olsa da, buradaki herkesin hoşuna gidecek bir hikâye anlatabileceğime eminim!"
 host_dinner_events.3070.a:0 "Trajik bir şey anlatabilirim."
 host_dinner_events.3070.boring_story:0 "Hikâyeniz sıkıcıydı"
 host_dinner_events.3070.b:0 "İnsanları rahatlatacak bir şey olabilir."
 everyone_at_the_dinner:0 "Akşam yemeğindeki her karakter"
 host_dinner_events.3070.story_was_impressive:0 "Hikâyeniz çok etkileyiciydi."
 host_dinner_events.3080.title:0 "Bir Boğulma!"
 host_dinner_events.3080.desc:0 "Herkes yemekte eğleniyor ve ben de efsanevi şakalarımdan birini daha yapıyorum. Şakama kahkahalar ve alkışlar eşlik ediyor... ve bir de öksürük.\n\nEtrafıma telaşla baktığımda görüyorum ki [choking_character_scope.GetName] boğazını sıkıca tutmuş ve yüzü kıpkırmızı kesilmiş bir şekilde ağır ağır öksürüyor. Görünüşe göre şakam onun için biraz fazla iyi olmuş!\n\nElbette onu kurtarmak için atılabilirdim ama bu gerçekten beni ilgilendirir mi?"
 host_dinner_events.3080.a:0 "Onu kurtarabilirim!"
 host_dinner_events.3080.failed_to_save_them:0 "[choking_character_scope.GetFirstName] adlı kişiyi kurtaramadınız"
 host_dinner_events.3080.b:0 "Bu gerçekten benim sorunum değil."
 host_dinner_events.3081.title:0 "Hayat Kurtarıldı"
 host_dinner_events.3081.desc:0 "Hemen arkasına geçtim ve [choking_character_scope.GetName], ben sırtına vurdukça yüzü morarmaya başladı. Bir zamanlar gurmelerin ağzına layık bir yemek olan boğazına sıkışmış lokma birden ağzından fırlayarak pahalı bir sosun içine düştü.\n\n"Ah çok teşekkür ederim [Select_CString(visiting_liege.IsFemale, 'leydim', 'lordum' )]! Sonsuza dek size borçlu kalacağım..""
### TODO AGOT-ONLY: host_dinner_events.3081.a [AGOT: ]
 host_dinner_events.3081.a:0 ""You owe me nothing but your company.""
### TODO AGOT-ONLY: host_dinner_events.3081.b [AGOT: ]
 host_dinner_events.3081.b:0 ""Yes, you do owe me your life.""
 host_dinner_events.1040.title:0 "Sıkılmamak İçin Satranç"
 host_dinner_events.1040.desc:0 "[visiting_liege.GetName] geldiğinden beri her gece ziyafetler düzenleniyor ve her akşam karnını doyurduktan sonra gecenin geri kalanında odasına çekiliyor ve beni düşüncelerimle baş başa bırakıyor.\n\nAncak son günlerde satranç tahtamı çıkarıp [visiting_liege.GetTitleAsNameNoTooltip] ile bahse girme dürtüsü hissediyorum. Ödülün tam olarak ne olacağına henüz karar vermedim ama eminim bir şeyler düşünebiliriz."
 host_dinner_events.1040.a:0 "Hadi oynayalım!"
 host_dinner_events.1040.b:0 "Gerek yok."
 host_dinner_events.1041.title:0 "Meydan Okuma"
 host_dinner_events.1041.desc:0 "Yemeğimi bitirdiğimde, önüme başka bir tahta kondu ancak bu sefer yemek yerine, küçük oyun taşları ile kaplanmış.\n\n"Efendim, [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip] topraklarındaki en iyi satranç oyuncularından biri olarak ünlendiğimi eminim ki biliyorsunuzdur! Sizinle sadece eğlence için oynamak istemiyorum ancak belki bir bahse girerek işleri ilginç hâle getirebiliriz..."\n\n[stop_host_scope.GetName] bana sırıtıyor, bir taşı parmaklarının arasında boş boş çeviriyor, bir maç için sabırsızlanıyor."
 host_dinner_events.1041.a:0 "İlk hamle benim [stop_host_scope.GetFirstNameNoTooltip]."
 host_dinner_events.1041.b:0 "Bununla akşamımı mahvetmeyeceğim."
 host_dinner_events.1042.title:0 "İyilik"
 host_dinner_events.1042.desc:1 "Şah köşeye sıkıştığında galip ilan edilir.\n\n[bg_loser.GetName] beni takdir etti ve belirsiz ödülüm artık her an seçilmeye hazır.."
 host_dinner_events.1042.desc.loser:0 "Şah köşeye sıkıştığında galip ilan edilir.\n\n[bg_victor.GetName] tarafından tamamen yenilgiye uğratıldım ve belirsiz ödülü artık her an seçilmeye hazır."
 host_dinner_events.1042.a:0 "Mükemmel."
 host_dinner_events.1042.a.bad:0 "Hay aksi!"
 host_dinner_events.1050.title:0 "Boş Depolar"
 host_dinner_events.1050.desc:0 "Aşçılarım bana yiyecek depolarının oldukça azaldığını ve daha pahalı ve egzotik malzemelerimin çoğunun çoktan tükendiğini söylediler.\n\nYiyecek depolarını yenilemek için küçük bir servet harcamam gerekecek ve ekmek ve tereyağı dışında bir şey satın alma düşüncesi bile kalbimin gergin bir şekilde çarpmasına neden oluyor. [visiting_liege.GetName] bu akşamki yetersiz yemek masasından dolayı hayal kırıklığına uğrayabilir ama fazlasına gücüm yeter mi?"
 host_dinner_events.1050.a:0 "Ekmek ve su, yeterli."
 host_dinner_events.1050.b:0 "Daha iyisini karşılayabiliriz."
 host_dinner_events.1050.c:0 "Kullanabileceğim bağlantılarım var!"
 host_dinner_events.3090.title:0 "Kafatası"
 host_dinner_events.3090.desc:0 "Burada çok eğlendim ama korkulan ve saygı duyulan bir [ROOT.Char.GetTitleAsNameNoTooltip|U] olma görevimden bir süre uzak kaldım!\n\n[stop_host_scope.GetName], zindanlarının kötüler ve hainlerle dolup taştığını söylüyor ve durmak bilmeyen yiyecek ve su ihtiyaçlarıyla krallığın hazinesini emiyorlar. Belki de zarif ev sahibime bir iyilik yapabilir ve bir mahkûmu idam edip içi boşaltılmış kafatasından [stop_host_scope.Custom('RegionalAlcoholicDrink')] içerek kalbine bir anda korku salabilirim."
 host_dinner_events.3090.a:0 "Mükemmel bir fikir."
 host_dinner_events.3090.skobletted_my_prisoner:0 "[visiting_liege.GetName], [skoblet_target.GetFirstName] adlı kişinin kafatasını oyarak bir kadeh hâline getirdi"
 host_dinner_events.3090.b:0 "Bu çok acayip."
 host_dinner_events.3100.title:0 "Şüpheli Savurganlık"
 host_dinner_events.3100.desc:0 "Burada geçirdiğim zamanın tadını çıkarıyorum ancak burada bulunduğum süre boyunca her gün savurganlık içinde ziyafet çektiğimi fark etmekten kendimi alıkoyamıyorum. Belki de [stop_host_scope.GetName] başlangıçta hayal ettiğimden çok daha zengindir.\n\nEğer düşündüklerim doğru çıkarsa, [stop_host_scope.GetTitleAsNameNoTooltip|U] bana şimdiye kadar ödediğinden çok daha fazla altın borçludur. Bu durumda bir vergilendirme talep edebilirim."
 host_dinner_events.3100.a:0 "Geri ödemeler yapılmalıdır."
 host_dinner_events.3100.b:0 "Gelecekte daha fazla ödeme yapmalı."
 host_dinner_events.3100.c:0 "Bu konuyu kapatacağım."
 host_dinner_events.3101.title:0 "Vergilendirilebilir Savurganlık"
 host_dinner_events.3101.desc.intro:0 "Depolarımdaki en iyi yiyecekleri sunarak ve ona arzu edebileceği her şeyi vererek efendime mükemmel bir ev sahipliği yaptım.\n\nAncak görünen o ki bu bir hataydı çünkü şimdi üstün ev sahipliği becerilerimin vergi kaçırmaktan kaynaklandığına inanıyor!"
 host_dinner_events.3101.desc:0 "$host_dinner_events.3101.desc.intro$\n\n"Borcumun" toplu bir miktarını bir kerede ödememi talep ediyor."
 host_dinner_events.3101.a:0 "Öyle olsun."
 host_dinner_events.3101.b:0 "Bu bir rezillik!"
 host_dinner_events.3102.title:0 "$host_dinner_events.3101.title$"
 host_dinner_events.3102.desc:0 "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetName] bundan sonra vergilerimin artırılmasını talep ediyor!"
 host_dinner_events.3102.a:0 "Kabul ediyorum."
 host_dinner_events.3102.b:0 "[ROOT.Char.GetFaith.NegativeAfterLife] senin için var!"
 host_dinner_events.3110.title:0 "Yetenekli Bir Gezgin"
 host_dinner_events.3110.desc.intro:0 "Görünüşe göre [stop_host_scope.GetName] onur konuğu olarak sadece beni ağırlamıyor! Bu akşam [talented_pool_character.GetName] ile beraber oturduk ve çok büyüleyici birisi. Sohbetimiz beni çok mutlu etti.\n\n"
### TODO AGOT-ONLY: host_dinner_events.3110.desc.mid.claim [AGOT: ]
 host_dinner_events.3110.desc.mid.claim:0 ""Alas, I too should be among the landed class, fair [visiting_liege.GetTitleAsNameNoTooltip|U]. If the world were a just place, my righteous claim would be recognized and I too would have a great dining hall to serve you in.""
### TODO AGOT-ONLY: host_dinner_events.3110.desc.mid.martial [AGOT: ]
 host_dinner_events.3110.desc.mid.martial:0 ""My skills in the matter of war are legend, [visiting_liege.GetTitleAsNameNoTooltip|U]. If you'd have me, I'd gladly lend those skills to you!""
### TODO AGOT-ONLY: host_dinner_events.3110.desc.mid.learning [AGOT: ]
 host_dinner_events.3110.desc.mid.learning:0 ""None understand the world and the [talented_pool_character.GetFaith.ReligiousText] like I do, magnanimous [visiting_liege.GetTitleAsNameNoTooltip|U]. If you'd have me, I'd be honored to lend my skills to your court.""
### TODO AGOT-ONLY: host_dinner_events.3110.desc.mid.statecraft [AGOT: ]
 host_dinner_events.3110.desc.mid.statecraft:0 ""I am well versed in statecraft, but my skills are being wasted as I wander around from place to place. If you'd have me at your court, I'd be honored to call you my [visiting_liege.GetTitleAsNameNoTooltip|U].""
 host_dinner_events.3110.desc.outro:0 "\n\nBöylesine yetenekli bir insana himayesiz bir şekilde rastlamak nadir bir durumdur ama sarayımda onun için yer var mı?"
 host_dinner_events.3110.a:0 "Tabii ki var!"
 host_dinner_events.3110.b:0 "Defol."
 host_dinner_if_vassal_accepts_tt:0 "Eğer vasalınız kabul ederse"
 tour_grounds_if_vassal_rejects_tt:0 "Eğer vasalınız kabul etmezse"
 host_dinner_events.3100.vassal_accepts:0 "[stop_host_scope.GetFirstName] kabul eder"
 host_dinner_events.3100.vassal_refuses:0 "[stop_host_scope.GetFirstName] reddeder"
 host_dinner_events.1009.enjoyed_weed:0 "[visiting_liege.GetFirstName] haşhaşın tadını çıkardı"
 host_dinner_events.1009.didnt_enjoy_weed: "[visiting_liege.GetFirstName] haşhaşı beğenmedi"
 host_dinner_events.3020.won_drinking_duel:0 "İçki yarışmasını kazandınız"
 host_dinner_events.3020.lost_drinking_duel:0 "İçki yarışmasını kaybettiniz"
 host_dinner_events.1007.enjoyed_performance:1 "[visiting_liege.GetFirstName] gösteriden memnun kaldı"
 host_dinner_events.1007.disliked_performance:0 "[visiting_liege.GetFirstName] gösteriyi beğenmedi"
 host_dinner_events.1060.title:0 "Dinmeyen İştah"
 host_dinner_events.1060.desc.intro:0 "Yakın zamanda maiyetimdeki en büyük askerlerden birinin vefat ettiği haberini aldım, ancak vücudu yaralanma ya da hastalıkla lekelenmeden tertemiz kaldı.\n\n"
 host_dinner_events.1060.desc.cannibal_legal:0 "Elbette bir [ROOT.Char.GetTitleAsNameNoTooltip|U] olarak, benim için savaşan ve ölen bir askerin kalbini yiyerek onun savaşçı ruhuna ulaşmak benim en doğal hakkım,"
 host_dinner_events.1060.desc.secret_cannibal:1 "Yamyamlık eğilimlerim herkes tarafından bilinmese de, güvendiğim hizmetkârlarımdan bazıları benim tüketmem için onun kalbini çıkardılar bile,"
 host_dinner_events.1060.desc.outro:0 "ancak [visiting_liege.GetTitleAsNameNoTooltip|U] ziyarete geldiğine göre en iyi [ROOT.Char.GetPrimaryTitle.GetAdjective] savaşçılarından birinin kalbini yeme onurunu ona vermeliyim!"
 host_dinner_events.1060.a:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] bu kalbe layık!"
 host_dinner_events.1060.b:0 "Kalbi kendim yiyeceğim."
 you_ate_a_human_heart:0 "Bir insan kalbi yediniz"
 host_dinner_events.1061.title:0 "$host_dinner_events.1060.title$"
 host_dinner_events.1061.desc.intro:0 "Sıradaki yemeğim geldi. Güzel bir tabakta, kan sosu havuzunda yavaşça kızartılmış bir kalp oturuyor.\n\n"Güçlü bir savaşçının kalbi, [visiting_liege.GetTitleAsNameNoTooltip|U] buna layık! Onu yiyin ve siz de onun sahip olduğu cesarete ve ruha sahip olun."\n\n"
 host_dinner_events.1061.desc.cannibal_legal:1 "Kesinlikle enfes görünüyor, mükemmel pişmiş ve o kadar yumuşak ki bıçağıma uzanmama bile gerek yok."
 host_dinner_events.1061.desc.secret_cannibal:0 "Bu şeyi gördüğümde şok olmuş ve rahatsız olmuş gibi davranmaktan başka çarem yok. [stop_host_scope.GetName] bir şekilde sırrımı biliyor olabilir miydi?"
 host_dinner_events.1061.desc.mid:0 "Bu şeyi görünce neredeyse öğüreceğim! Eminim [stop_host_scope.GetName] bunun #EMP insan eti #! olduğunu söylemek istememiştir!"
 host_dinner_events.1061.desc.outro:0 "Ev sahibim beklentiyle bana bakıyor ve tabağı yavaşça bana doğru yaklaştırıyor."
 host_dinner_events.1061.a:0 "Lezzetli!"
 host_dinner_events.1061.b:0 "Hayır, sorun değil."
 host_dinner_events.1061.liege_ate_heart:0 "[visiting_liege.GetFirstName] kalbi yedi"
 host_dinner_events.1061.liege_refused_heart:0 "[visiting_liege.GetName] reddetti"
 host_dinner_events.1070.title:0 "Boşa Harcanan Potansiyel"
 host_dinner_events.1070.desc:0 "Bu akşam yemeğinde ayarlamaları [runaway_courtier.GetName] yanıma gelecek şekilde yaptığımda sonucunun böyle olacağını düşünememiştim ancak tabaklar gelip gittikçe bu iyi [Select_CString(runaway_courtier.IsFemale, 'kadının', 'adamın' )] giderek daha fazla ilgimi çektiğini fark ediyorum.\n\n"Ah, keşke başkentte de hayat bu kadar ilginç olsaydı. Çoğu gün sarayın etrafında yorgun ve tembel bir şekilde uzanıyorum. Burada sohbete doyuyorum. Beni saray mensubunuz olarak kabul eder misiniz?""
### TODO AGOT-ONLY: host_dinner_events.1070.a [AGOT: ]
 host_dinner_events.1070.a:0 ""Of course, join me!""
### TODO AGOT-ONLY: host_dinner_events.1070.b [AGOT: ]
 host_dinner_events.1070.b:0 ""No.""
 host_dinner_events.1071.title:0 "Saraylar Arası Değişim"
 host_dinner_events.1071.desc:1 "[runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U], bana gelerek [stop_host_scope.GetName] izin verdiği için artık onun sarayında hizmet edeceğini söyledi.\n\nBuna izin verirsem [stop_host_scope.GetTitleAsNameNoTooltip|U] bunu takdir edecektir ancak sarayımdan maiyetimi çalma hakareti gerçekten göz yumabileceğim bir şey mi?"
### TODO AGOT-ONLY: host_dinner_events.1071.a [AGOT: ]
 host_dinner_events.1071.a:0 ""[runaway_courtier.GetNameNoTooltip] is mine!""
 host_dinner_events.1071.refused_to_let_them_go:0 "[runaway_courtier.GetName] gidemez çünkü [visiting_liege.GetName] gitmesine izin vermedi"
### TODO AGOT-ONLY: host_dinner_events.1071.b [AGOT: ]
 host_dinner_events.1071.b:0 ""Go where your heart pleases.""
 host_dinner_events.1080.title:0 "Alçakça Bir Gösteri"
 host_dinner_events.1080.desc:0 "Herkes [visiting_liege.GetName] hakkında ne düşündüğümü bilir, o [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] yine de salonuma geldi. Yemeklerimi midesine indirmesini görürken nefretten kendimden geçiyorum ancak sonra aklıma bir fikir geliyor.\n\nEğer onun kötülüğünü gösterirsem ziyaretini unutulmaz kılabilirim!"
 host_dinner_events.1080.a:0 "Daha azını hak etmiyor."
 host_dinner_events.1080.b:0 "Bu kadar alçalmamalıyım."
 host_dinner_events.1081.title:1 "[ROOT.Char.GetFirstNameNoTooltip]: [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip] Kötülüğü"
 host_dinner_events.1081.desc:0 "Her zamanki gibi, yemeğim eğlenceyle birlikte geliyor. Aktörler harika akrobasi ve beceri gösterileri yapıyorlar ama sonra bir şey fark etmeye başlıyorum. Gösterileri boyunca tıpkı benimkine benzer kıyafetler giyen ve yüzüne dışkı bulaşmış gibi görünen biri sözde kötülüğüm hakkında şarkılar söylüyordu!\n\nŞok içinde [stop_host_scope.GetName] ile göz göze geliyorum. Onun bu alçak gösteriye kıkırdadığını görüyorum. Yemeğime dokunamıyorum, tüm sarayın benim bu alçakca taklidimle dalga geçmesini izliyorum ve dinliyorum."
 host_dinner_events.1081.a:0 "İntikamımı alacağım."
 host_dinner_events.1081.b:0 "Oldukça komik..."
 host_dinner_events.1081.liked_performance:0 "[visiting_liege.GetName] gösteriyi beğendi"
 host_dinner_events.3120.title:0 "Bir [stop_host_scope.GetTitleAsNameNoTooltip] İçin Uygun Hediye"
 host_dinner_events.3120.desc:0 "Akşam yemeğinde, heybetimi göstermek için bir fırsat buluyorum. Maiyetim değerli eşyalar ve yetenekli insanlarla dolu ve belki de arkamda kendimden küçük bir parça bırakırsam [stop_host_scope.GetName] bunu takdir eder.\n\nİyilikseverliğimden dolayı bahşedebileceğim pek çok şey var, belki de..."
 host_dinner_events.3120.a:1 "[courtier_gift.GetNameNoTooltip] burada kalabilir."
 host_dinner_events.3120.b:0 "[artifact_gift.GetNameNoTooltip] onun olabilir."
 host_dinner_events.3120.c:0 "Altın daima en iyi hediyedir."
 host_dinner_events.3120.d:0 "Gerçek dostluğun hediyesi!"
 host_dinner_events.3120.e:0 "Hediye borcum yok."
 host_dinner_events.3121.title:0 "$host_dinner_events.3120.title$"
 host_dinner_events.3121.desc.intro:0 "Yemek salonuna girdiğimde [visiting_liege.GetName] masanın başında oturuyor, ayaklarını masaya, yemeğinin yanına uzatmış.\n\n"Benim iyi vasalım!"
 host_dinner_events.3121.desc.courtier:0 "Söz veriyorum ki [courtier_gift.GetName] gelecekte size iyi hizmet edecek iyi ve sadık bir saray mensubunuz olacak."
 host_dinner_events.3121.desc.artifact:0 "Hazinem değerli kalıntılar ve eserlerle dolup taşıyor. Belki bu parçayı siz almak istersiniz: [artifact_gift.GetName]."
 host_dinner_events.3121.desc.gold_gift:0 "Büyük servetimin yükünü taşıyorum ve bu servetin bir kısmını en sadık vasalıma aktarmak istiyorum."
 host_dinner_events.3121.desc.best_friend:0 "Bir süredir arkadaşız ve belki de bunu bir sonraki seviyeye taşımanın zamanı gelmiştir. Benimle #EMP gerçek#! bir dostluk yemini etmek ister misiniz?"
 host_dinner_events.3121.desc.outro:0 "Bu benim size hediyem, karşılık beklemeden.""
### TODO AGOT-ONLY: host_dinner_events.3121.a [AGOT: ]
 host_dinner_events.3121.a:0 ""Thank you!""
 host_dinner_3120_gift_taken:0 "[stop_host_scope.GetFirstName] hediyeyi alıyor"
 host_dinner_3120_gift_refused:0 "[stop_host_scope.GetFirstName] hediyeyi reddediyor"
### TODO AGOT-ONLY: host_dinner_events.3121.b [AGOT: ]
 host_dinner_events.3121.b:0 ""We are friends, eternal.""
 host_dinner_events.3121.c:0 "Kabul etmeyeceğim."
 host_dinner_events.3130.title:0 "Göründüğü Gibi Değil"
 host_dinner_events.3130.desc:0 "Açlıktan kıvranarak uyanıyorum, öyle ki karnımın gurultusundan tekrar uyuyamıyorum.\n\nKaranlıkta mutfağa doğru yürüyorum ve odanın lambamın ışığı dışında bir şeyle biraz aydınlatıldığını görüyorum. Kiler rafları doğaüstü ama davetkâr bir altın rengiyle parlıyor.\n\nParıltının kaynağını bulamadığım için merakla dolup taşıyorum. Işığımın alevi söndüğünde, kilerin kenarlarını kontrol etmeye başlıyorum."
 host_dinner_events.3130.a:0 "Bu işin aslını #EMP öğrenmeliyim!#!"
 host_dinner_events.3130.b:0 "Şimdi etrafı kurcalayamam."
 host_dinner_events.3131.title:0 "Kilerin Arkasındaki Oda"
 host_dinner_events.3131.desc:0 "Biraz daha dikkatlı baktığımda dolabın durduğu zeminde çizikler fark ediyorum. Dolabın raflarından biri sürekli kullanılıyormuş gibi tozsuz gözüküyor. Elimi attığımda rafların anahtar görevi gören bir mekanizma olduğu ortaya çıkıyor ve biraz çabayla kileri duvardan kaydırarak gizli bir odayı ortaya çıkarıyorum!\n\nYüzeyi nemli taş duvarın ortasında, kolunda özenle süslenmiş bir asma kilit bulunan sağlam bir ahşap kapı var. İncelediğimde, kilidin üzerinde ne sayı ne de harf olduğunu, her türlü canavar ve grotesk diyagramı içerdiğini görüyorum."
 host_dinner_events.3131.a:0 "Bir bulmaca, önemsiz bir şey olmalı."
 host_dinner_events.3131.fail_to_get_it_open:0 "Kapıyı açmayı başaramadınız"
 host_dinner_events.3131.b:0 "Kapıya sağlam bir tekme atmak işe yarayacaktır!"
 host_dinner_events.3131.c:0 "Bununla mı uğraşacağım?"
 host_dinner_events.3132.title:0 "Gizli Kütüphane"
 host_dinner_events.3132.desc:0 "Kapı açıldığında her türlü garip maddenin yavaşça kaynadığı ve minik kafeslere hapsedilmiş küçük hayvanların bulunduğu ayrıntılı bir çalışma odası görüyorum. Odanın ortasında, bir kaide üzerinde yükselen tek bir kitap var; kapağı, odayı kilitleyen kilidin üzerindeki bulmacadaki aynı canavar ve grotesk çizimlerle parıldıyor.\n\nKitabı elime alıyorum ve parmağımı derimsi yüzeyinde gezdirirken içimi bir merak kaplıyor. Sonra ön yüzündeki kutsal olmayan sembollerin arasına gizlenmiş tek bir anlaşılabilir karakter görüyorum: bir rakamı. Kitabı açmaya çalışıyorum ama küçük üçgen bir bulmacayla sıkıca kilitlenmiş olduğunu görüyorum."
 host_dinner_events.3132.a:0 "Bu ne anlama geliyor olabilir?"
 host_dinner_events.3132.b:0 "Gizemin bir parçası daha."
 artifact_secret_journal_with_cipher_description:0 "Bir çift günlük, biri anlaşılmaz bir bulmacayla sıkı sıkıya kilitlenmiş, diğeri ise bir tür şifrelenmiş dille yazılmış. İkisi birbirine ait gibi görünüyor."
 artifact_secret_journal_with_puzzle_description:0 "Anlaşılmaz bir bulmacayla kilitlenmiş deri ciltli tuhaf bir günlük. Onunla birlikte, bulmacayı çözmenin anahtarını içeren başka bir günlük daha vardır."
 host_dinner_events.3132.c:0 "Sonunda hepsi bende."
 artifact_secret_journal_unsolved_description:0 "Gizem henüz çözülmemiş olsa da, her biri birbirinin gizemini çözecek farklı parçalara sahip üç günlük."
 host_dinner_events.3132.d:0 "Bunu burada bırakmalıyım."
 host_dinner_events.3133.title:0 "Gizli Zindan"
 host_dinner_events.3133.desc:0 "Kapı açılıyor ve bana görmemiş olmayı dileyeceğim bir şeyi gösteriyor...\n\nHer duvar tuhaf nesnelerle süslenmiş: kırbaçlar, kazıklar, tahta falluslar, bunlar gibi şeyler. Zeminde sadece su olduğunu #EMP umduğum#! bir ıslaklık var ama bu odadaki eşyalara bakınca, ne tür bir vücut sıvısı bulamacı olabileceğini düşünmekten korkuyorum."
 host_dinner_events.3133.a:0 "Artık bazı şeyleri biliyorum."
 host_dinner_events.3134.title:0 "Gizli Kasaplık"
 host_dinner_events.3134.desc:0 "Kapı çatırdayarak açıldığında, iğrenç ve keskin bir kokuyla ayağa fırlıyorum, popom taze kan gölüne batıyor.\n\nOda, yarı kesilmiş ve et kancalarına asılmış insan cesetleriyle dolu. İnsan derisi, bir zamanlar yapıştığı bedenin yanındaki kasap masasında yatıyor, yanında da kirli bir satır. Kurbanların yüzlerindeki çarpık dehşet ifadeleri odanın daimi demirbaşı."
 host_dinner_events.3134.a:0 "Artık gördüklerimi unutamam."
 host_dinner_events.3135.title:0 "Kaçış Tüneli"
 host_dinner_events.3135.desc:0 "Kapı çatlayarak açılıyor ve liken ve mantarlarla kaplı karanlık, yapışkan bir tünel ortaya çıkıyor. Gıcırdayarak geçiyorum ve bu mağarayı sonuna kadar takip ediyorum ve kendimi dışarıda, hiç ummadığım bir kırsal alanın patika yolunda buluyorum.\n\nBelli ki [stop_host_scope.GetName] burayı acil durumlarda kaçış için kullanıyor."
 host_dinner_events.3135.a:0 "Ne keşif ama!"
 host_dinner_events.3136.title:0 "Gizli Yatak Odası"
 host_dinner_events.3136.desc:0 "Kapı dehşet dolu bir solukla açılıyor! Kapıda duran deforme olmuş bir [quasimodo_child.Custom('GirlBoy')], gözlerinde tam bir şok ve dehşetle bana bakıyor.\n\nElleriyle yüzünü kapatırken "Bana bakma!" diye çığlık atıyor. "Ah, [Select_CString(stop_host_scope.IsFemale, 'annem', 'babam' )] beni gördüğünü öğrenirse senin sonun da böyle olur!"\n\n[stop_host_scope.GetNameNoTooltip] ile olan benzerliklerini o an fark ediyorum, bu onun gayrimeşru çocuğu!"
 host_dinner_events.3136.a:0 "Herkes bunu öğrenecek."
 host_dinner_events.3136.b:0 "Bunu kimse asla bilmeyecek."
 host_dinner_events.3140.title:0 "Lezzetli Bir Kombinasyon"
 host_dinner_events.3140.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] olarak hayat, tabağıma her türlü muhteşem ve fantastik yemeği getiriyor ancak son zamanlarda bu yemeklerin tatlarından ve dokularından sıkıldım. Gerçekten sıra dışı, gerçekten egzotik olanı arzuluyorum!\n\nBir yanımda [stop_host_scope.Custom('GetExpensiveDessert')], diğer yanımda ise haşlanmış sebzeler görüyorum. Peki ya bu iki farklı lezzeti alıp aynı anda tadabilseydim!"
 host_dinner_events.3140.a:0 "Değerli bir deney."
 host_dinner_events.3140.satisfying_taste:0 "Tadı muhteşemdi"
 host_dinner_events.3140.it_did_not_work:0 "Deney bir başarısızlıktı"
 host_dinner_events.3140.b:0 "Bu kadar cüretkar olamam."
 host_dinner_events.1090.title:0 "Zehir"
 host_dinner_events.1090.desc:0 "[visiting_liege.GetName] salonlarımı ziyaret ederek bana altın gibi bir fırsat sundu.\n\nUnutamayacağı bir yemek bulmayı umut ediyor ve biraz öğütülmüş itüzümü ile bir daha asla böyle bir akşam yemeği yaşayamayacağını garanti edebilirim!\n\nSaldırı zamanı yaklaşıyor, bu riski gerçekten alabilir miyim?"
 host_dinner_events.1090.a:0 "Tabii ki alabilirim!"
 host_dinner_events.1090.b:0 "Henüz doğru zaman değil."
 host_dinner_if_you_succeed_tt:0 "Eğer başarılı olursanız"
 host_dinner_if_you_fail_tt:0 "Eğer başarısız olursanız"
 host_dinner_events.1091.title:0 "Zehir!"
 host_dinner_events.1091.desc:0 "Hiç umursamadan [stop_host_scope.Custom('GetExpensiveDessert')] yiyorum. Midemdeki diğer harika yiyeceklerin yanına gidecek.\n\nAncak üst kattaki yatağıma yürürken kendimi halsiz hissetmeye başlıyorum, sanki vücudumdaki kan kalınlaşıyor, neredeyse damarlarımda pıhtılaşıyor. Daha merdivenlerin başına varmadan, hırıltılı bir şekilde nefes almaya çalışarak yere yığılıyorum. Gözlerim kararıyor, telaşla arkamı döndüğümde [stop_host_scope.GetName] ile göz göze geliyoruz ancak gördüğüm son şey onun bilmiş gülümesemesi oluyor."
 host_dinner_1091_murder_succesful:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] sizin tarafınızdan zehirlendi"
 host_dinner_events.1091.a:0 "Nasıl... yapabildin..."
 host_dinner_events.1092.title:0 "Cinayete Teşebbüs"
 host_dinner_events.1092.desc:0 "[stop_host_scope.Custom('GetExpensiveDessert')|U] çok lezzetli gözüküyor. Resmen yumuluyorum. Ancak bir süre sonra içimi rahatsız edici bir his kaplıyor. Ellerim duraksıyor.\n\nTatlıyı kurcalıyorum ve birkaç keskin koku alıyorum. Yemeğime zehir katıldığı besbelli! Başka bir açıklaması yok, [stop_host_scope.GetName] beni öldürmeye çalışıyor."
 host_dinner_events.1092.a:0 "Cavanar!"
 host_dinner_1091_murder_failed:0 "Cinayet girişiminiz başarısız oldu"
 host_dinner_events.1093.title:0 "$host_dinner_events.1092.title$"
 host_dinner_events.1093.desc:0 "Sadık çeşnicibaşım [food_taster_scope.GetName] görevine devam ediyor. Önündeki [stop_host_scope.Custom('GetExpensiveDessert')] ile bakıştıktan sonra tadına bakıyor ve bana bir onaylama işareti yaparak görevini tamamlıyor.\n\nAncak çok geçmeden zavallı [Select_CString(food_taster_scope.IsFemale, 'kadın', 'adam' )] boğulmaya, nefes almak için çırpınmaya ve yumruğunu masaya vurmaya başlıyor. Saniyeler içinde solarak maviye dönen dudaklarının arasından son nefesini veriyor ve ben tedirgin [stop_host_scope.GetName] ile baş başa kalıyorum."
### TODO AGOT-ONLY: host_dinner_events.1093.a [AGOT: ]
 host_dinner_events.1093.a:0 ""Murderer!""
 host_dinner_events.3150.title:0 "Bir Onur Meselesi"
 host_dinner_events.3150.desc:0 "Bütün akşam [stop_host_scope.GetName] ve onun sadık şövalyesi [joker_knight.GetName] ile oturdum ve belirtmeliyim ki bu şövalye ağzına gelen her espriyi söylemekten çekinmiyor. Keyifli bir aşkamdı.\n\n"Size söylüyorum, pek çok [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] tanıdım ama [ROOT.Char.GetName] aralarındaki en [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] olanı! Hah!"\n\n"[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )] hakkında ne söylemeye cüret ettin?" [humorless_knight.GetName] oturduğu yerden ayağa kalkar. "Sana meydan okuyorum, kötü adam!""
 host_dinner_events.3150.a:0 "Ne kadar eğlenceli!"
 host_dinner_events.3150.your_knight_wins:0 "[humorless_knight.GetName] galip geliyor!"
 host_dinner_events.3150.your_knight_loses:0 "[humorless_knight.GetName] kaybediyor"
 host_dinner_events.3150.b:0 "Yerine otur, aptal."
 host_dinner_events.3000.title:0 "Akşam Yemeği"
 host_dinner_events.3000.desc.intro:2 "Topraklarına geldiğimde [stop_host_scope.Custom('FortifiedBuilding')] kapısının önünde [stop_host_scope.GetTitledFirstName] tarafından gerçekten bir [ROOT.Char.GetTitleAsNameNoTooltip] gibi karşılandım."
 host_dinner_events.3000.desc.type.majesty:0 "Kervanımın ihtişamının büyük bir etki yarattığına şüphem yok.\n\n"
 host_dinner_events.3000.desc.type.taxation:0 "Hazine arabam ve vergi tahsildarları ziyaretimin amacını açıkça ortaya koyuyor.\n\n"
 host_dinner_events.3000.desc.type.intimidation:0 "Ağır silahlı korumalar arasından onu selamlayarak amacımı ortaya koydum.\n\n"
 host_dinner_events.3000.desc.mid.hates_vassal:0 "Bu [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] beni misafir ediyor, şimdiden iştahım kaçtı. En azından masada [ROOT.Char.Custom('FavoriteTreat')] olsun bari..."
 host_dinner_events.3000.desc.mid.lover:0 "Sevgili [stop_host_scope.Custom('RomanticComplimentNoun')] ile bu tür formaliteleri sürdürmek acımasız bir kader. Belki akşam yemeğinden sonra onu ziyaret ederim..."
 host_dinner_events.3000.desc.mid.friend:0 "Böylesine iyi bir dostla akşam yemeğine oturmayalı çok uzun zaman oldu! Diyarın dertlerini unutacağım nadir zamanlardan olacak!"
 host_dinner_events.3000.desc.mid.close_family:0 ""[ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)|U], sizi görmek çok güzel!" Resmen kucaklaşıyoruz ve aile bağlarını alenen gösteriyoruz."
 host_dinner_events.3000.desc.mid.house:0 "Bu, [ROOT.Char.GetHouse.GetBaseName] Hanesinin bir [Select_CString(stop_host_scope.IsFemale, 'kızıyla', 'oğluyla' )] birlikte eğlenip vakit geçirebileceğim nadir bir fırsat."
 host_dinner_events.3000.desc.mid.powerful_vassal:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|U] vasalları arasındaki en seçkin olanı olduğunu kabul etmeliyim, en azından insanların görebileceği bir şekilde..."
 host_dinner_events.3000.desc.mid.default:1 "Vasalım beni gerekli tüm hürmetle kabul etti."
 host_dinner_events.3000.desc.mid:2 "\n\n[stop_host_scope.GetFirstNameNoTooltip], planlanan akşam yemeği ziyafetini açıklıyor ve sunulacak eğlence ve yiyeceklerin kendi sarayımın akşam yemeklerinin standartlarına yakın olacağına söz veriyor."
 host_dinner_events.3000.desc.outro:0 "\n\n[stop_host_scope.GetName] bana bunun sunduğu en iyi yemek olduğunu garanti ediyor."
 host_dinner_events.3000.a:0 "Haydi başlayalım!"
