 tour_general.9999.desc:0 "Tura çıkıyorum ve yakında [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] istikametine doğru yola koyulacağız."
 tour_general.9999.phase_tour_grounds:0 "[ROOT.Char.Custom('FortifiedBuilding')|U] ve topraklarınızı inceleyeceğiz."
