 cultural_festival.9030.b:0 "Sessiz kalmalıyım."
 cultural_festival.9040.t:0 "Bir Servet İçin Bir Sikke"
 cultural_festival.9040.desc:0 "Festivalin uzak bir köşesinde, özenle dekore edilmiş bir çadır buluyorum. Malzemeler ve desenler bana yabancı, memlekette gördüklerimden çok farklı. Sahibi bir yabancı, birleştirdiği ellerinin üzerinden beni tanıyormuş gibi gülümsüyor.\n\n"Ah, bir [ROOT.Char.GetTitleAsNameNoTooltip|U]! Geleceğinde çok şey görüyorum, gel bana bir sikke ver ve her şeyi anlatayım.""
