 cultural_festival.9000.title:0 "Sahne Arkası"
 cultural_festival.9000.desc:0 "Kültür festivalinin tüm harikaları ve neşesi etrafımda devam ediyor, kendimi başka bir dünyada gibi hissediyorum.\n\nAncak kalabalığın çevresinde dolaşan ve gıcırdayan ahşap sahnenin arkasına gizlenmeye çalışan bazı kötü kılıklı kişilerin görüntüsü beni dünyevi âleme geri getiriyor.\n\nBu ahmak tiplerin tam olarak neyin peşinde olduklarını anlayamadığım için merakla dolup taşıyorum. Tam bu sırada bu tiplerin arasında [stop_host_scope.GetFirstName] gözüküyor."
 cultural_festival.9000.a:0 "Araştırmalıyım."
 cultural_festival.9000.host_noticed:0 "[stop_host_scope.GetFirstName] sizi gözetlerken yakaladı"
 cultural_festival.9000.b:0 "Hayır, uğraşmamalıyım."
 cultural_festival.9001.title:0 "Sahnenin Altındaki Kutu"
 cultural_festival.9001.desc:0 "Sahnenin arkasında küçük bir sandıktan başka bir şey bulamıyorum. Yapıldığı malzeme sağlam gibi duruyor ancak işçiliği garip bir şekilde mütevazı ve kalitesiz, bu ölçekteki bir festivalden beklenecek bir gösteri parçası değil.\n\nGrotesk ve her türden canavarın kaba oymalarıyla kaplı bir bulmaca kilidine benzeyen bir şeyle bağlanmış.\n\nZihnim merakla dolup taşıyor, içinde ne olduğunu mutlaka öğrenmeliyim!"
 cultural_festival.9001.a:0 "Kilidi kolaylıkla çözebilirim!"
 cultural_festival.9001.fail_to_get_it_open:0 "Kilidi çözmeyi başaramadınız"
 cultural_festival.9001.b:0 "Parçalayabilirim!"
 cultural_festival.9001.destroyed_what_was_inside:0 "İçinde ne varsa yok ettiniz"
 cultural_festival.9001.c:0 "Çok zahmetli."
 cultural_festival.9002.title:0 "Gizli Günlük"
 cultural_festival.9002.desc:0 "Sert ahşap kutunun içinden, sayfalarının arasına gelişigüzel kağıtlar doldurulmuş tozlu eski bir günlükten başka bir şey çıkmadı.\n\nGünlüğü açıyorum ve anlamsız saçmalıklar, yabancı sembolleri ve kitapta yer alan başka hiçbir şeyle ilgili görünmeyen matematiksel denklemlerden başka bir şey görmüyorum.\n\nBu günlük bir tür bulmacanın çözüm yöntemi olmalı ama bu tam olarak hangi bulmacanın?"
 artifact_secret_puzzle_description:0 "Bilinmeyen bir bulmacanın çözüm anahtarını içeren bir kitap."
 cultural_festival.9002.a:0 "Bunu yanıma alıyorum."
 cultural_festival.9002.b:0 "$host_dinner_events.3132.b$"
 artifact_secret_puzzle_with_cipher_description:0 "İki günlük, biri bir şifre içeriyor gibi görünüyor, diğeri ise bir bulmacayı çözmenin anahtarı gibi gözüküyor. Bu iki kitap birlikte bile hiçbir gizemi açığa çıkarmaz ancak her şeyi açığa çıkaran bir üçüncü günlük olmalı."
 cultural_festival.9002.c:0 "$host_dinner_events.3132.c$"
 cultural_festival.9002.d:0 "Hayır, bunu burada bırakmalıyım."
 cultural_festival.9003.title:0 "Bir Hançer"
 cultural_festival.9003.desc:0 "Sandığın içinde özenle süslenmiş bir hançer var. Kilidin dandik işçiliği ile arasında dağlar kadar fark var, hançer o kadar zengin detaylara sahip ki, ona baktığınız her an daha fazla detayı fark ediyorsunuz.\n\nGerçekten muhteşem bir parça."
 artifact_ornate_dagger_name:0 "Süslemeli Hançer"
 artifact_ornate_dagger_desc:0 "Karmaşık bir şekilde süslenmiş, grotesk ve her türden hayvanla kaplı bir hançer."
 cultural_festival.9003.a:0 "Ve artık benim!"
 cultural_festival.9003.b:0 "Bunu öylece çalamam!"
 cultural_festival.9004.title:0 "Hazine Kutusu"
 cultural_festival.9004.desc:0 "Kutu ağzına kadar altınla dolu! Hiç şüphesiz [stop_host_scope.GetFirstName] benden gizli bir hazine saklıyor."
 cultural_festival.9004.a:0 "$cultural_festival.9003.a$"
 cultural_festival.9004.b:0 "$cultural_festival.9003.b$"
 cultural_festival.9005.title:0 "Süslü Kolye"
 cultural_festival.9005.desc: "Sandığın içinde özenle süslenmiş bir kolye var. Kilidin dandik işçiliği ile arasında dağlar kadar fark var, kolye o kadar zengin detaylara sahip ki, ona baktığınız her an daha fazla detayı fark ediyorsunuz.\n\nGerçekten muhteşem bir parça."
 artifact_strange_necklace_name:0 "Garip Kolye"
 artifact_strange_necklace_desc:0 "Karmaşık bir şekilde süslenmiş bir kolye. Zincirin ucunda, garip uzantılarının arasında bir mücevher tutan bir grotesk figürü var."
 cultural_festival.9005.a:0 "$cultural_festival.9003.a$"
 cultural_festival.9005.b:0 "$cultural_festival.9003.b$"
 cultural_festival.9006.title:0 "Utanç Verici Bir Eşya"
 cultural_festival.9006.desc:0 "Sandığı açıyorum ve içinde bulduğum şey yüzümün kızarmasına neden oluyor.\n\nİnce bir ahşaptan yapılmış olan bu fallik nesne daha önce gördüklerime hiç benzemiyor, hatta bir insan #EMP uzvuna#! bile benzemiyor, daha ziyade efsanevi bir yaratığa ait olabileceğini tahmin ettiğim bir şey.\n\nGerçekten sapkın bir eşya."
 grotesque_wooden_phallus:0 "Efsanevi Ahşap Fallus"
 grotesque_wooden_phallus.desc:0 "Bilinmeyen mistik bir yaratığın fallusuna benzetilerek özenle oyulmuş bir nesne."
 cultural_festival.9006.a:0 "Ne orijinal bir şey!"
 cultural_festival.9006.b:0 "Yakın bunu!"
 decision_solve_the_journals:0 "Günlük Kilidini Çözmek"
 decision_solve_the_journals_desc:0 "Nihayet bulmacanın tüm parçalarını bir araya getirdim ve bu sayfalarda yazılanları keşfetmenin zamanı geldi!"
 decision_solve_the_journals_tooltip:0 "Günlükleri deşifre etmeye çalışacaksınız"
 decision_solve_the_journals_confirm:0 "Hadi yapalım şu işi."
 journal_events_prefix:0 "Günlüğü Anlamak:"
 tour_general.5000.title:0 "$journal_events_prefix$ Başarısızlık"
 tour_general.5000.desc:0 "Günlükleri bir araya getiriyorum, bulmaca kitabını baştan sona okuyorum ve düşüncelerim kadar hassas hareketlerle bunları kilide uyguluyorum.\n\nSonunda bir #EMP tıngırtı#! sesi geldi, sanırım çözdüm! Hayır, hâlâ kilitli ve inatçı."
 tour_general.5000.a:0 "Kahretsin!"
 tour_general.5000.b:0 "Tekrar deneyeceğim!"
 tour_general.5001.title:0 "$journal_events_prefix$ Bir Başka Başarısızlık"
 tour_general.5001.desc:0 "Bu sefer gerçekten çözdüğümü hissediyorum. Her şey mantıklı görünüyor, yanılıyor olmamın imkânı yok.\n\nBir kere sola çeviriyorum ve... bir #EMP tıngırtı!#! Günlük hâlâ kilitli ve inat etmeye devam ediyor."
 tour_general.5001.a:0 "Hay aksi!"
 tour_general.5001.b:0 "Lanet kilidi kırıp açacağım!"
 the_journal_is_destroyed_tt:0 "Kilitten daha fazlasını kırıyorsunuz"
 fail_to_open_journal_tt:0 "Günlüğü açmayı başaramadınız"
 more_mysteries_inside_tt:0 "Günlüğün içeriğini keşfediyorsunuz"
 tour_general.5010.title:0 "$journal_events_prefix$ Deşifre Etmek"
 tour_general.5010.desc.intro:0 "En sonunda günlüğün sayfaları bana kendilerini gösterdi ve deşifre etmeye başlayabilirim! Başlangıç şifresi "Nereye gidersem gideyim, gerçek iki adım geride kalır" diyor ve bununla ilk bulmacayı çözebilirim.\n\n"
