 court.4701.mental_health_cannot_be_trepanned_away:0 "$court.4701.trepanning_vices_operation$ \n\nHer ne kadar içten içe bu tedavinin ağrılarımı dindirmesini istesem de zihnimin bir iblise değil, bana ait olduğunu kabul etmek beni daha sağlıklı biri yapar." ### CQC
 court.4701.trepanning_success:0 "Çekiç, keskiyi kafamın içine gönderiyor. Bir anda bedenimin kapıları açılıyor. Çarpıntı başlıyor; ürperiyorum, titriyorum ve ıstırap veren bir ateşin yükseldiğini hissediyorum. Acı kıvılcımlarından oluşan bir yağmurun ortasından, daha önce hiç olmadığı kadar sakin yeni bir dünyaya çıkıyorum." ### CQC
 court.4701.trepanning_witch_power:0 "Keski yavaşça kafamın içine çakılırken korkmuyorum. Beynimdeki bu ürpertici acının ortasında hissedebiliyorum ki [ROOT.Char.GetFaith.WitchGodName|U] kahkaha atıyor ve bu aptal tedaviyle dalga geçiyor.\n\nKendime geliyorum. $court.4701.trepanning_no_result$" ### CQC
 court.4701.trepanning_vices_operation:0 "Çekiç kafatasıma çarpıyor fakat sandalyeyi kavradığım gibi kendime geliyorum. $court.4701.trepanning_no_result$"
 court.4701.trepanning_headache_operation:0 "Kendime geliyorum. $court.4701.trepanning_no_result$ Başımdaki ağrı geçmiş."
 court.4701.trepanning_mental_injury:0 "[trepanner.GetTitledFirstNameNoTooltip], sanki haşlanmış yumurtanın kabuğunu kırıyormuş gibi çekiçle hafifçe kafatasıma vuruyor." ### CQC
 court.4701.trepanning_incapable_injury:0 "Üzerimden bir parıltı geçiyor. Bir telaş hissediyorum ve geçmiş günleri ve yılları bir anda gözümün önünde görüyorum. Neredeyim? Neden başım ağrıyor? Benim adım ne? En sevdiğim pasta neyli?"
 court.4701.trepanning_possessed_injury:0 "Ruhları kafamdan atacağına söz vermiş olsa da birdenbire, ilk kez bir ruha tanık oluyorum. Yakışıklı kanatlı bir ruh, odanın karanlık köşelerinde dans ediyor ve bana sırıtıyor." ### CQC
 court.4701.trepanning_deviant_injury:0 "Kafama delik açılmaya başlandığında, boğuk iç organlarımın sesini dinlemeye başladım. Kafam biraz kurcalandıktan sonra aniden bir zekâ patlaması yaşadım! Gececi olmalıyım ve sadece ekmek kabuğu yemeliyim! Neden bir at gibi davranarak hiç sevişmedim?" ### CQC
 court.4701.trepanning_learning_penalty:0 "Keski kafamın içinde dönüp dururken ağlamamak için kendimi çok zor tutuyorum! Sonunda dönmesi durduğunda, zavallı zihnim bir cümle kurmak için sanki çamurun içinden geçmek zorundaymış gibi hissediyor."" ### CQC
 court.4701.trepanning_physical_injury:0 "İlk başta kafatasımı delen keski vücuduma öyle bir acı veriyor ki, omurgam ikiye bölünmüş gibi. Kazı derinleştikçe,"
 court.4701.trepanning_no_result:0 "Sonunda keski kafamdan çekildiğinde, açıkta kalan beynime hafif bir hava akımının esmesi dışında hiçbir fark hissetmiyorum."
 court.4701.trepanning_coordination_penalty:0 "Hiçbir şey hissetmemeye başlıyorum. Sonunda keski kafamdan çekildiğinde, bunu hissedemiyorum. Ayağa kalkmaya çalışırken vücudum zorlukla uyum sağlıyor." ### CQC
 court.4701.trepanning_blind_injury:0 "gözümün önüne aniden bir sis denizi iniyor. Sonraki an, sonsuz bir alacakaranlık diyarına girerken o sis için bile yas tutuyorum."
 court.4701.a:0 "Hehehehehe! Selamlar!"
 court.4701.b:0 "Seni şerefsiz! Sen n'aptın bana?"
 court.4701.c:0 "Kafatasım ağrıyor!"
 court.4701.d:0 "Kimmiş iyi şeytan? Evet sen!"
 court.4701.e:0 "Tüm iç çamaşırlarımı temizlemeliyim!"
 court.4701.f:0 "Harika! Benim saray hekimim olmaya ne dersin?"
 court.4701.g:0 "Sözde 'kötülüklerin' iblislerin işi olmadığının kanıtı"
 court.4701.h:0 "Sana bir borcum var... kafamdaki deliğe bir tıpa bulduğunda..."
 court.4701.i:0 "Dertli düşüncelerim, tek başıma yüzleşebileceğim bir düşman."
 court.4750.t:0 "Bir Kahraman Gerek"
### TODO AGOT-CHANGED: court.4750.desc [AGOT: I notice my poet pacing up and down my throne room. [poet.GetSheHe|U] has been yelling at anyone who crosses the line [poet.GetSheHe] treads.\n\nAs I approach, I am met with literary fury: | TR: Sarayıma yakın zamanda yeni bir misafir geldi: biraz üne sahip, tatlı dilli bir şair.\n\n]
 court.4750.desc:0 "I notice my poet pacing up and down my throne room. [poet.GetSheHe|U] has been yelling at anyone who crosses the line [poet.GetSheHe] treads.\n\nAs I approach, I am met with literary fury: "Cross not my path unless you are a descending muse! Oh-" the poet's face lights up in elation. "You may have the inspiration I crave. My [ROOT.GetCharacter.GetLadyLord], I am seeking a theme for my next work."\n\n"Could you tell me who your favorite hero is?""
