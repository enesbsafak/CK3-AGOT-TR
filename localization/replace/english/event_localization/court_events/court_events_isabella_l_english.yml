l_english:
 court.4001.t:0 "Sadece Bir Sıyrık"
 court.4001.desc:0 "Müttefikim [bleeding_diplomat_liege.GetName] tarafından gönderilen diplomat [bleeding_diplomat.GetName] ve etrafında oluşan kan havuzuna bakakaldım. Üzerinde durduğu güzelim halım, muazzam miktarda kanı emmeye bile yetmemiş; ortalık kan gölü olmuş. Anlaşılan o ki saatlerdir kanaması vardı.\n\n"Bu karışıklık için özür dilerim. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] topraklarına yaptığım yolculuk sırasında bir handayken, cücenin teki beni soymaya çalıştı ve biraz itiş kakış yaşadık. Ancak ben hâlâ ayakta durabildiğim sürece diplomatik ziyarete devam etmemem için bir sebep yok; kanamanın ölümcül boyuta ulaşmasına daha #EMP günler#! var!"" ### CQC
 court.4001.a:0 "Muhafızlar! Bu [Select_CString(bleeding_diplomat.IsFemale, 'kadını', 'adamı' )] saray hekimine götürün."
 court.4001.b:0 "Önümüzdeki haftaya kadar müsait değilim, o zamana kadar dayanabilir misin?"
 court.4001.c:0 "Şimdi konuşabiliriz ancak halımın parasını efendinin ödemesi gerekiyor."
 court.4001.carpet:0 "Halıyı temizlemeniz gerekiyor"
 court.4001.new_carpet:0 "Kanaması duracak gibi durmuyor, yeni bir halı almanız gerek."
 court.4001.toast:0 "[bleeding_diplomat.GetName] öldü"
 court.4001.toast_desc:0 "[bleeding_diplomat.GetName] kıymetli halınızı kan gölüne çevirdi."
 court.4001.cure_toast:0 "Saray hekimi diplomatı iyileştirdi"
 court.4100.t:0 "Alışılmadık Koro"
 court.4100.desc:0 "Saray müzisyenim yanıma yaklaşıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], dikkatinizi rica edebilir miyim? Sadece erkeklerden oluşan üst düzey bir koro hazırladım! Sadece şarkı söylemekle kalmıyorlar; tayt giyip parlak kuşaklarının üstüne kasıklık takıyor, bir de senkronize bir şekilde dans ediyorlar! Tüm bu gösteri tabii ki [ROOT.GetCharacter.GetFaith.HighGodName] adına minnetimizi ifade etmek için yapılıyor. Eminim bu büyük gösteriyi desteklersiniz; hem böyle gösteriler saray hanımlarının da çok hoşuna gider."" ### CQC
 court.4100.a:0 "Kusacağım galiba. Bu sapkını zindana atın!"
 court.4100.b:0 "Hanımlar bu taytları görmeye dayanamazlar bence."
 court.4100.c:0 "Aklımı çeldiniz, performansınızı izlemek için sabırsızlanıyorum!"
 court.4250.t:0 "Benim Kulem Seninkinden Daha Büyük!"

 court.4250.desc:0 ""Mızmız saraylılar, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]," [tower_challenger_rival.GetTitledFirstName] taht salonumun önüne öfkeyle yürür.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip] çamurda yuvarlanan bir domuz gibi debelenirken, ben [tower_challenger_rival.GetCapitalLocation.GetTitle.GetNameNoTier]'de bu lanetli dünyanın gördüğü en yüksek kuleyi diktim. [tower_challenger_rival.Custom('FortifiedBuilding')]'imden artık neredeyse gökten yıldızları toplayabilirim. Senin yıldızların nerede, [ROOT.Char.GetTitledFirstNameNoTooltip]?"\n\n[concerned_steward.GetCouncilTitle|l] [concerned_steward.GetTitledFirstName] temkinli bir eli omzuma koyar. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], [tower_challenger_rival.GetTitledFirstNamePossessiveNoTooltip] kulesi dört yüz ayaklık, yapısal olarak çürük kil ve macun. [tower_challenger_rival.GetHerHis] kışkırtmasını görmezden gelin ve çöküşünü bekleyin!""
 court.4250.a:0 "Çok beğendiysen kuleni, müsait bir yerine sokabilirsin!"
 court.4250.b:0 "Kulemizi sizinkinden bir metre daha uzun olacak şekilde uzatacağız!"
 court.4250.c:0 "#EMP Yüz elli metrelik#! bir kule yapılmasını emrediyorum!"
 court.4250.b.tt:0 "[THIS.GetCharacter.Custom('FortifiedBuilding')|U] tepesine çok uzun bir bayrak direği yerleştireceksiniz"
 court.4250.c.success.tt:0 "Muazzam bir kule inşa edeceksiniz"
 court.4250.c.failure.tt:0 "Kuleniz inşaat sırasında yıkıldı"
 court.4250.c.failure_toast_title:0 "İnşa ettiğiniz [ROOT.Char.Custom('FortifiedBuilding')] yıkıldı!"
 court.4250.c.accident.tt:0 "Korkunç bir kaza meydana geldi"
 court.4250.c.accident.tt.flavour:0 "Neyin yanlış gidebileceğini kim bilebilirdi ki..."
 court.4251.desc:0 "Sonunda yükselen kulemin tamamlandığı haberini duyunca tüm sarayı dışarıya, kuleyi seyretmeye davet ediyorum. Kule gökyüzünü delip geçiyor ama rüzgârda hafiften sallanıyor." ### CQC
 court.4251.desc_child_accident:0 "\n\nÇocuğum [crushed_child.GetName], şaşkın şaşkın bakan saray mensuplarımın arasından ulu kulenin dibine doğru ilerliyor ve tam yaklaşmışken nedense birden gözleri yuvalarından çıkacakmış gibi açılıp öylece kalakalıyor.\n\n[crushed_child.GetNameNoTooltip], çığlık atmaya vakit bile bulamadan temelinden çatlayıp devrilen kulenin altında kalıyor." ### CQC
 court.4251.desc_rival_accident:0 "\n\n[tower_challenger_rival.GetTitledFirstNameNoTooltip], ben kulenin zirvesine giden yolda ilerlerken bana katılıyor. Yukarı çıkarken birkaç kez ya manzaradan ya da merdivenlerden nefesi kesiliyor. Zirveye ulaştığımızda aşağıdaki saray mensuplarıma el sallıyorum, bu sırada o da korkuluklara yaslanıyor. Ancak yaslandığı an, cennete yolculuğu da başlıyor." ### CQC
 court.4251.desc_success:0 "\n\nŞaşkın şaşkın kuleye bakan saray mensuplarım hep birlikte kuleyi coşkulu alkışlarla karşılıyorlar. Ancak nedense hepsi kulenin gölgesinde durmaktan kaçınıyor.\n\n[tower_challenger_rival.GetTitledFirstNameNoTooltip], bana doğru fısıldayarak: "Yemin olsun ki bu kulenin #EMP iki katı#! bir kule ile geri döneceğim!"" ### CQC
 court.4251.a:0 "Ah [crushed_child.GetNameNoTooltip], sen benim ufak meleğimdin!"
 court.4251.b:0 "Sonunda uçmayı başardın [tower_challenger_rival.GetTitledFirstNameNoTooltip]."
 court.4251.c:0 "Peki ya şimdi kim çamurda yuvarlanıyor [tower_challenger_rival.GetTitledFirstNameNoTooltip]?"
 court.4300.t:0 "Quantum Praedecessores"
 court.4300.preaching_tour_bernard_of_clairvaux_intro:0 "Clairvaux'lu Bernard, dağları denizleri aşarak ilerlediği vaaz turnesi sırasında devam etmekte olan kutsal savaşın ateşini körüklemek için burada mola veriyor. Sarayımda görevli [bishop.GetCouncilTitle], ona Tapınak Şövalyeleri'nin Kutsal Tarikatı için doktrinlerin hazırlanmasında merkezî bir rol oynadığımı söyledi.\n\n" ### CQC

 court.4300.preaching_tour_bernard_of_clairvaux_theology:0 ""Teolojik kavrayışıyla ün kazanmış biriyle birlikte olmaktan heyecan duyuyorum. Yeni tarikatlarımız üzerine bir inceleme yazıyorum: 'Yeni Şövalyeliğin Övgüsü'. Bir göz atarsanız, [ghw_sponsor.GetTitledFirstName]'e kendi tarikatınızın desteklenmesi için bir ferman çıkarması gerektiğini bildireceğimden emin olabilirsiniz.""

 court.4300.preaching_tour_bernard_of_clairvaux_flea_excommunication:0 ""Misafirperverliğiniz için minnettarım. İyiliğinizin karşılığını vermek adına, saraylılarınızdan birkaçının bir dizi ısırık kaşıdığını fark ettim. Bir keresinde binlerce sinekten oluşan bir istilayı aforoz etmiştim ve anında ölmüşlerdi. Görünüşe göre kilise cezasına ihtiyaç duyan birkaç çürük pireniz var!""

 court.4300.preaching_tour_bernard_of_clairvaux_standard:0 ""Sormam gereken ağır bir iyilik var. [ROOT.GetCharacter.GetFaith.HighGodName] zihnimi kutsadı ama [ROOT.GetCharacter.GetFaith.HighGodNameSheHe] bağırsaklarımı kutsamadı. Dizginlerim böyleyken, altıma kazılmış bir hela olmadan vaaz veremem. Turuma İsa'nın çukur kazıcısı gibi eşlik edecek kimse var mı?""
 court.4300.preaching_tour_default:0 "Bir rahip taht odanızın girişini kapatıyor, içeri girenlerin kıyafetlerine yapıştırmaları için haç şeklinde kırmızı rozetler dağıtıyor.\n\n"[ROOT.GetCharacter.GetFaith.HighGodName], sana şükürler olsun! Kutsal savaşta vadedilen müttefiklerimizin ülkelerinde, askerlerini ve hazinelerini desteklemek için vaaz veriyorum."" ### CQC

 court.4300.a:0 ""Kalemim de kılıcım da senin!""

 court.4300.b:0 ""Bu dönek böcekleri aforoz edelim!""

 court.4300.c:0 ""[possible_latrine_digger.GetTitledFirstNameNoTooltip]'in yardım etmek için can attığından eminim!""

 court.4300.d:0 ""Hazinem gökyüzü kadar açık!""

 court.4300.e:0 ""Görevinde sana özel muhafızlarımdan bir refakatçi eşlik edecek.""
 court.4300.e.tt:0 "[bernard_guard_1.GetTitledFirstName] ve [bernard_guard_2.GetTitledFirstName], [right_portrait_character.GetTitledFirstName] için korumalık yapacak."
 court.4300.f:0 "Böyle yüce bir [Select_CString(right_portrait_character.IsFemale, 'kadınla', 'adamla' )] konuşmaya layık olmadığım için sessizce diz çöktüm."
 court.4300.g:0 "Haç rozeti oldukça kötü gözüküyor değil mi?"
 court.4300.a.tt:0 "Kutsal Tarikat kurmanın [piety|E] ve [gold|E] maliyeti büyük ölçüde azalır" ### CQC
 court.4350.t:0 "Safran Kervanı"
 court.4350.desc:0 "[concerned_marshal.GetCouncilTitle|U], taht odama topallayarak giren, elbiseleri yanmış bir çift tüccar ile yaptığı konuşmayı yeni bitirdi. "[caravan_attacker_liege.GetCapitalLocation.GetTitle.GetNameNoTier|U] topraklarından [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] topraklarına safran taşıyan ticaret kervanlarımızdan biri yağmalandı. Bunu yapanlar haydut değildi. Şövalye zırhı kuşanmış bir grup topraklı Hristiyan soyluydu."\n\n[concerned_marshal.GetCouncilTitle|U] derin bir iç çekiyor. "Mankafalar halkımızı katlederek bizi savaşa kışkırtmaya çalışıyorlar. Misilleme yaparsak, saray mensuplarının çok sevdiği lüks ürünler sebebiyle [caravan_attacker_liege.GetName] ile yaptığımız anlaşmadan taviz vermek zorunda kalabiliriz."" ### CQC
 court.4350.a:0 "Bu tür soytarılıkları görmezden gelmek zor ama ticaret daha önemli."
 court.4350.b:0 "Biz de onları yağmalayalım!"
 court.4350.c:0 "Şeker ticaretini durdurduğumuzda bu şebeklerin nasıl zırlayacaklarını göreceksiniz!"
 court.4350.c.tt:0 "#F [caravan_attacker_liege.GetNameNoTooltip] ile olan ticareti durduracaksınız#!"
 court.4355.t:0 "Sarazen ile Savaşmaya Kim Cesaret Eder?"

 court.4355.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," diye seslenir [reporting_marshal.GetCouncilTitle], "[caravan_attacker.GetTitledFirstName]'in, [caravan_attacker.GetSheHe] ve bir grup soylunun sıradan haydutlar gibi [attacked_liege.GetCapitalLocation.GetTitle.GetNameNoTier]'den şeker taşıyan kervanlara baskın düzenlediğiyle övündüğünü duydum. Bu köpekler kutsal savaşın salyasını akıtıyor ve [attacked_liege.GetTitledFirstName]'i kışkırtmaya çalışıyor. Ancak, bence ticaretin herhangi bir savaştan çok daha fazla işimize yaradığını öneriyorum—"\n\n"Yiyeceğe ihtiyacımız yok, sadece kâfirin kanını içmemiz gerek!" diye böğürür [caravan_attacker.GetTitledFirstNameNoTooltip] taht salonunun öteki ucundan."
 court.4355.a:0 "İyi iş! Kâfirleri yağmalamak da bir ibadet şeklidir!" ### CQC
 court.4355.a.tt:0 "Kervanlara daha çok baskın düzenlenmesini teşvik edeceksiniz"
 court.4355.b:0 "Muhafızlar! Şunu tövbe edene kadar şeker kasesiyle dövün."
 court.4355.c:0 "Muhtemelen ben ne söylersem söyleyeyim, yağmalamaya devam edecek."
 court.4355.c.tt:0 "#F Yağmalamaya devam edecek#!"
 court.4400.t:0 "Baş Belası"
 court.4400.desc:0 "Cübbeli [Select_CString(head_chasing_monk.IsFemale, 'kadınlardan', 'adamlardan' )] oluşan bir grup birden taht odamı bastı. Telaşla yerlere, masaların ve sandalyelerin altlarına, eteklerin içine bakınmaya başladılar.\n\nİçlerinden biri "[ROOT.Char.GetTitledFirstNameNoTooltip]!" diye bağırdı, "Bizim liderimiz Başsız [the_headless.GetTitledFirstNameNoTooltip]. Kendisi, [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] bir kehaneti sebebiyle kafası kesilmiş kutsal bir adam. Kutsal kişiliklerde sıkça olduğu gibi, kafası döne döne yuvarlanmaya başladı. Tam kafasını takip ediyorduk ki bir tepeyi aşıp size ait olan [ROOT.GetCharacter.Custom('FortifiedBuilding')] kapısından içeri girdi, burada olduğuna #EMP eminiz#!!"" ### CQC
 court.4400.a:0 "[ROOT.GetCharacter.Custom('FortifiedBuilding')|U] içini aramanız için izin veriyorum."
 court.4400.b:0 "Ben de bulmaya çalışayım!"
 court.4400.c:0 "Bir tarikatın sarayımı didik didik etmesine izin verecek değilim!"
 court.4400.b.discovery:0 "[THIS.GetCharacter.Custom('FortifiedBuilding')|U] içinde, çoktan herkesin unuttuğu bir kalıntı buluyorsunuz"
 court.4400.b.failure:0 "Tarikatçılar bir karışıklığa neden oluyor"
 court.4400.b.severed_head:0 "Kesilen kafa bulundu!"
 court.4400.c.backdown:0 "Tarikatçılar korkup geri çekildi"
 court.4400.c.refusal:0 "Tarikatçılar geri dönecek"
 court.4401.desc:0 "[ROOT.GetCharacter.Custom('FortifiedBuilding')|U] bodrumunda kabul etmeliyim ki çok fazla ıvır zıvır var."
 court.4401.desc_arbitrary:0 "[head_chasing_monk.GetName], dahiyane güvenlik planımı dinliyor. Tüm bu ıvır zıvır yığınları arasında neyin nerede olduğunu bilen tek kişi ben olursam nasıl soyulabilirim ki!"
 court.4401.desc_default:0 "[head_chasing_monk.GetName] ne zaman bir kapı açsa, bir antika yığınının altında ezilme tehlikesi atlatıyor. Burada [ROOT.Char.Custom('RandomPrivateObject')] olduğunu ben bile unutmuşum!" ### CQC
 court.4401.desc_object:0 "\n\nEtrafı didik didik aramamıza rağmen kafayı bir türlü bulamıyoruz ancak [head_chasing_monk.GetName] gördükleri karşısında hayran kalmış gibi. Uzun süredir unutulmuş olan [ROOT.Char.Custom('RandomWeirdObject')] elindeyken çok dikkatliydi. Gösterdiği inceliğe bakılırsa kendisi usta bir antikacı bile olabilir." ### CQC
 court.4401.desc_head:0 "\n\nİğrenç bir kokunun peşinden giderek, yer mantarı arayan bir domuz gibi döküntülerin arasından bir insan kafası çıkarıyor.\n\nAncak bodrumun ve zindanımın birbirine yakınlığını hesaba kattığımda bunun, zindanda unutulmuş bir mahkûma ait olduğunu düşünüyorum." ### CQC
 court.4401.a:0 "Aha, evet! Öhöm... İşte bu [the_headless.GetTitledFirstNameNoTooltip]! [ROOT.GetCharacter.GetFaith.HighGodName], sana şükürler olsun..." ### CQC
 court.4401.b:0 "Kesik ne kadar da temiz ve ustaca! Bu belli ki benim işim."

 court.4401.c:0 ""Geçimini çöplerimi karıştırarak kazanmak hoşuna gider mi?""
 court.4401.d:0 "Burası bakımsız ve pis bir yer. Temizlenmesini emretmeliyim."
 court.4402.desc:0 "Bir gece gözlerimi kırpıştırarak uyandığımda birden şok oldum. Bu gördüğüm hedonik bir rüya değildi. Taht odama giren cübbeli tarikat manyaklarından biri boğazıma neşter dayıyordu!\n\n"Kafayı aramamıza engel olmaya devam edersen, seninkini alabiliriz. O kadar yuvarlak ve parlak ki, güzelce yuvarlanacağına bahse girerim!"" ### CQC
 court.4402.a:0 "İstersen hemen şimdi aramaya başlayabiliriz."
 court.4402.a.tt:0 "Beraberce bodruma gideceksiniz"
 court.4402.b:0 "Ne kafası ne yuvarlanması? Çık git buradan!"
 court.4402.b.success:0 "Tarikat üyesi ile boğuştuktan sonra zindana gönderiyorsunuz"
 court.4202.b.success.tt:0 "[head_chasing_monk.GetName] sizin tarafınızdan zindana gönderilecek"
 court.4402.b.failure:0 "Yaralandınız ya da öldürüldünüz"
 court.4402.c:0 "O meyve bıçağıyla mı kafamı kesebileceksin?"
 court.4402.c2.tt:0 "Kafanızın bir kısmı kesildi"
 court.4402.c3.tt:0 "Kafanız tamamen kesildi"

 court.4500.t:0 "Seyyar Satıcı"
 court.4500.desc:0 "Pelerinli, üzerinde düzinelerce süs ve biblo taşıyan bir seyyar satıcı gözüme çarptı.\n\n"

 court.4500.bleeder:0 ""Zengin aptalları altınlarından etmek için eserler üretiyorum. Kulağıma fazla kanınız olduğu fısıltısı geldi. İçinde kanınızdan bir damla bulunan cam küreli bir broş almak isteyecek hayranlarınız olduğundan eminim."\n\n[artifact_peddler.GetSheHe|U] boynumdaki damarlara bakıyor. "İyi para öderim ve bir zavallı da kraliyet ihtişamından bir parça taşıdığını hisseder.""

 court.4500.psalter:0 ""Muhteşem bir Mezmurlar kitabım var - turkuaz boncuklarla süslenmiş oymalı fildişi kapaklı, tezhipli bir el yazması. İçinde aşık bir [ROOT.GetCharacter.GetWomanMan] ile bir [cheating_character.GetWomanMan]'in hikâyeleri var. Oyma işçiliği [cheating_character.GetTitledFirstNameNoTooltip]'i kesinlikle etkileyecektir, böylece [cheating_character.GetSheHe] bir daha başka biriyle yatmayı asla düşünmeyecek!""

 court.4500.chastity_belt:0 ""Diyardaki herkes, mancınıkla fırlatılmış bir katafraktın gücüne sahip, önlenemez arzularla boğuştuğunuzu biliyor. Yükünüzü hafifletecek bir eserim var."\n\n[artifact_peddler.GetSheHe|U] paslı dikenlerle süslenmiş bir iffet kemeri çıkarır."

 court.4500.holy_needle:0 ""Yanımda yalnızca sizin ellerinize layık değerli bir silah var. Andalos'un Kudretli Mızrağı, Demirci'nin bizzat Mızrağı! Bununla savaş alanında tüm düşmanlarınızı yerle bir edeceksiniz!"\n\n[artifact_peddler.GetSheHe|U] dikiş iğnesine benzeyen minicik bir metal parçası çıkarır."

 court.4500.finger_bones:0 ""Bana tecrübeli bir koleksiyoncu gibi görünüyorsun." [artifact_peddler.GetSheHe|U] akla gelebilecek her uzuvdan kemiklerle dolu, yıpranmış bir sandık çıkarıp açar.\n\n"En nadir sept on parmak kemiklerinden bazıları elimde, hatta bazıları altın kaplama. Tek tek satılırlar, ama on parçalık komple bir set için size özel fiyat uygularım.""

 court.4500.dead_chicken:0 ""Burada harikulade bir süs eşyam var! Bunu taşırsan, alandaki her düşman seni çoktan ölmüş sanacak! Bir koklasın, güvenliğiniz garantidir!"\n\n[artifact_peddler.GetHerHis] pelerininin derinliklerinden [artifact_peddler.GetSheHe] ölü bir tavuğun bütün cesedini çıkarır."

 court.4500.worm:0 ""[ROOT.GetCharacter.GetLadyLord]'im, büyük bir illüzyon eserim var; onunla herkesi büyülü güçlere sahip olduğunuza ikna edebilirsiniz.\n\n[artifact_peddler.GetSheHe|U] çok ince bir ipe bağlı rengârenk kumaştan bir solucan sallıyor. "İlk başta hareketsiz görünür, ama ipi oynatarak solucanın canlandığı illüzyonunu yaratabilirsiniz! Bunun saraydaki [dummy_gender.Custom('LadiesLords')]'i nasıl etkileyeceğini bir düşünün!""
 court.4500.a:0 "Kanım zaten zar zor vücudumda duruyor. Huzurumdan çekil!"
 court.4500.b:0 "Her şeyi denemeye hazırım."
 court.4500.c:0 "$court.4500.b$"
 court.4500.d:0 "Bunun canımı yakmaktan başka bir işe yarayabileceğini mi sanıyorsun..." ### CQC

 court.4500.e:0 "Bu Kaderin çağrısı olmalı!"
 court.4500.f:0 "Yalanlarını başka yerde sat!"

 court.4500.g:0 "Çoraplarımı tekrar örmek için İsa'nın bir kalıntısını kullanabilirim."
 court.4500.h:0 "Demek #EMP bu#! yüzden günümüzde pek çok köylünün dokuz parmağı var."
 court.4500.i:0 "Tüm bir butu sar bana oradan!"
 court.4500.j:0 "Ah, devam et o zaman."
 court.4500.k:0 "Zaten ölü taklidi yapmakta oldukça ustayım."
 court.4500.l:0 "Kuklacılık oynamayacağım!"
 court.4500.m:0 "Eğlenceli olabilir!"
 court.4500.n:0 "$court.4500.j$"
 court.4600.t:0 "İnsanlığın İçebileceği En İyi [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|U]"
 court.4600.desc:1 "Saray sakisi [cupbearer.GetTitledFirstName] ve arkadaşı [cupbearer_friend.GetTitledFirstName] hafifçe sallanıyorlar. En nadir içki şişelerimden birini açmışlar ve [cupbearer_friend.GetTitledFirstNameNoTooltip] için içki dolduruyorlar.\n\n"[ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|U] şişeleri tepe tepe birikmiş ve hepsinin de [ROOT.GetCharacter.GetTitledFirstName] için saklanıyor olması çok üzücü." ### CQC
 court.4600.desc_lover:0 "Sen çok tatlı biri olduğun için her şeyin tatlısını hak ediyorsun."
 court.4600.desc_friend:0 "Benim arkadaşlarım da [ROOT.Char.GetTitleAsNameNoTooltip] gibi içmeyi hak ediyor!"" 
 court.4600.desc_ending:1 "\n\nBeni gördüklerinde gözlerini bile kırpmıyorlar.\n\n"Ah, [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )]! Tüm içeceklerinizi sizden önce zehirli olup olmadığını diye test ediyoruz. Her damlasında kendimi tehlikeye atarak, yarın çekeceğim baş ağrısını sanki sizin için savaş meydanında çarpışırken aldığım bir yaraymış gibi şerefle çekeceğim!"" ### CQC
 court.4600.a:0 "Mahzenlerim uzunca süredir kapalıydı. Saraydaki herkese benden bir şişe!"
 court.4600.b:0 "Zavallı kıymetlilerim! Seni aşağılık hizmetkâr!" ### CQC
 court.4600.b.tt:0 "Hizmetkârlar içmeyi bırakırsa, bir sonraki ziyafetiniz daha ucuz olacak."

 court.4600.c:0 ""Depolar kapalı, zehirli [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] saklıyorum!""
 court.4600.c.tt:0 "İkili, saygısızlıklarından ders alacaklar ancak dünya zehirlerinize karşı dikkatli olacak."
 court.4600.c.t:0 "Saki Zehirlendi!"
 court.4600.d:0 "Panzehirin olduğu şişeyi getirin hemen!"
 court.4600.d.tt:0 "Aptalları gizlice iyileştirmeye ve zehirleri gizli tutmaya çalışacaksınız."
 court.4600.d.cure.t:0 "Panzehir zehri çözdü"
 court.4600.d.cure.tt:0 "Zehirleriniz sır olarak kalacak"
 court.4600.e:0 "Sanırım mahzenleri bir süreliğine kilitleyeceğim."
 court.4700.t:0 "Ruh Trepanasyonu"
 court.4700.desc_native_trepanning:0 "Hekim kılığında birisi elinde bir alet çantasıyla gelmiş gibi görünüyor; dikkatli baktığımda çantanın kenarından sarkan bir çekiç ve kazma gözüme ilişiyor.\n\n"[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )], ben trepanasyonda uzman bir hekimim." ### CQC
 court.4700.desc_foreign_medicine:0 "Yabancı bir ülkeden siyahlara bezenmiş bir kişi, heykeltıraş aletlerine benzeyen gizemli çekiçlerle dolu bir çantayla karşıma geldi.\n\n"Benim ülkemde, trepanasyon olarak bilinen bir uygulama var ve görünüşe göre sizin de buna ihtiyacınız var." ### CQC
 court.4700.desc_possessed:0 "Sizi ruh çarpmış, ruhlar zihninizin etrafında yüzer ancak gerçekten kalmak istemezler. $court.4700.desc_passage$ $court.4700.growth$""
 court.4700.desc_witch:0 "Bir okültist olarak güçleriniz kudretli olabilir ancak yine de etrafınızda size yardım edebilecek güçleri engelleyen bir bariyer var. Havanın ruhları kafatasınızın içine girebilseydi, büyüleriniz dünyayı fethedebilirdi.""
 court.4700.desc_melancholic:0 "Tüm ıstıraplarınızın basitçe vücudunuzdan çıkıp havaya karışabileceğini hayal edin. Hissettiğiniz bu acılar size ait değil; dilerseniz buna sebep olan ruhları sizden kovabilirim. $court.4700.growth$"" ### CQC
 court.4700.desc_heavy_mind:0 "Streslisiniz ancak bu yalnızca çok düşündüğünüz için. Kafanız, düşüncelerinizi tek tek kemiren ruhlarla dolu. $court.4700.growth$ $court.4700.desc_passage$""
 court.4700.desc_blind:0 "Siz aslında kör olmadınız, sadece görüşünüz bulutlandı, bulutlandırdılar. Gözlerinizin özünde yüzen ruhlar var. O yüzdükleri suyu kurutup gitmelerini sağlayabilirim.""
 court.4700.desc_lunatic:0 "Kararlarınızı kendiniz verdiğinizi sansanız da aslında onları kulağınıza fısıldayan birkaç ruh kafanıza sokuyor. $court.4700.growth$ Birkaç çivinin de yardımıyla onları dışarı çıkarabiliriz.""
 court.4700.desc_headache:0 "Dayanılmaz baş ağrılarından muzdarip olduğunuzu duydum. Hayatınız baskılarla dolduğundan, giderek daha fazla ruh bir araya geliyor ve kafanızdaki endişelerle ziyafet çekiyorlar. $court.4700.desc_passage$""
 court.4700.desc_trepanning_vices:0 "Üstünüze yıkılan suçlar size ait değil, sadece bazı kötü ruhların pençesi altındasınız. $court.4700.desc_passage$"" ### CQC
 court.4700.growth:0 "Hatta beyninizin kıvrımlarının içinde gizleniyor bile olabilirler." ### CQC
 court.4700.desc_passage:0 "Onları özgür kılmak için bir geçit açabilirim."
 court.4700.a:0 "Dalga mı geçiyorsun! Bu batıl inançlarla uğraşacak biri değilim ben!"
 court.4700.b:0 "Buna daha fazla dayanamıyorum, keskiyi getir ve başla!"
 court.4700.b.tt:0 "Trepanasyon operasyonu denenecek..."
 court.4700.c:0 "Ben suçlu değilim. Halkım yobaz!"
 court.4700.d:0 "Reddedeceğim ancak belki saray hekimim sizden nasıl yapıldığını öğrenebilir."
 court.4700.success:0 "Trepanasyondan yaralanmadan kurtuldunuz"
 court.4700.no_success:0 "Trepanasyonun bir etkisi olmadı"
 court.4700.removal:0 "Trepanasyon rahatsızlığınızı ortadan kaldırdı"
 court.4700.headache:0 "Tüm dertleriniz yok oldu"
 court.4700.witch_power:0 "Trepanasyon cadı güçlerinizi arttırdı"
 court.4700.mental_faculties:0 "Trepanasyon zihinsel yeteneklerinize zarar verdi"
 court.4700.physical_faculties:0 "Trepanasyon bedeninize zarar verdi"
 court.4701.physician_study:0 "[trepanner.GetTitledFirstName], yetenekli saray hekimim [court_physician.GetTitledFirstName] ve onun maharetli elleriyle bu işi daha iyi yapabileceğimizi söyledi. [trepanner.GetTitledFirstName] beni sandalyeye bağlarken, [court_physician.GetTitledFirstNameNoTooltip] arkamda beliriyor." ### CQC
 court.4701.no_physician:0 "[ROOT.Char.Custom('FortifiedBuilding')|U] derinliklerinde bizi kimselerin göremeyeceği arka odalardan birine geçtik. [trepanner.GetTitledFirstNameNoTooltip], saray mensuplarımın beni bir sandalyeye bağlı hâlde çığlık atarken görmesinin yalnızca sıkıntı doğuracağını söylüyor.\n\n"

 court.4701.physician_excited:0 ""Ah, güzel bir kafatası delme ameliyatını ne kadar severim!"\n\n"

 court.4701.physician_excited_2:0 ""Ne heyecanlı! Yeni bir prosedür!"\n\n"

 court.4701.physician_concerned:0 ""[ROOT.GetCharacter.GetHerHim]e dikkat et!"\n\n"

 court.4701.physician_concerned_2:0 ""Bu kaba yöntem başarısız olursa ben yardım ederim."\n\n"
 court.4701.mental_health_cannot_be_trepanned_away:0 "$court.4701.trepanning_vices_operation$ \n\nHer ne kadar içten içe bu tedavinin ağrılarımı dindirmesini istesem de zihnimin bir iblise değil, bana ait olduğunu kabul etmek beni daha sağlıklı biri yapar." ### CQC
 court.4701.trepanning_success:0 "Çekiç, keskiyi kafamın içine gönderiyor. Bir anda bedenimin kapıları açılıyor. Çarpıntı başlıyor; ürperiyorum, titriyorum ve ıstırap veren bir ateşin yükseldiğini hissediyorum. Acı kıvılcımlarından oluşan bir yağmurun ortasından, daha önce hiç olmadığı kadar sakin yeni bir dünyaya çıkıyorum." ### CQC
 court.4701.trepanning_witch_power:0 "Keski yavaşça kafamın içine çakılırken korkmuyorum. Beynimdeki bu ürpertici acının ortasında hissedebiliyorum ki [ROOT.Char.GetFaith.WitchGodName|U] kahkaha atıyor ve bu aptal tedaviyle dalga geçiyor.\n\nKendime geliyorum. $court.4701.trepanning_no_result$" ### CQC
 court.4701.trepanning_vices_operation:0 "Çekiç kafatasıma çarpıyor fakat sandalyeyi kavradığım gibi kendime geliyorum. $court.4701.trepanning_no_result$"
 court.4701.trepanning_headache_operation:0 "Kendime geliyorum. $court.4701.trepanning_no_result$ Başımdaki ağrı geçmiş."
 court.4701.trepanning_mental_injury:0 "[trepanner.GetTitledFirstNameNoTooltip], sanki haşlanmış yumurtanın kabuğunu kırıyormuş gibi çekiçle hafifçe kafatasıma vuruyor." ### CQC
 court.4701.trepanning_incapable_injury:0 "Üzerimden bir parıltı geçiyor. Bir telaş hissediyorum ve geçmiş günleri ve yılları bir anda gözümün önünde görüyorum. Neredeyim? Neden başım ağrıyor? Benim adım ne? En sevdiğim pasta neyli?"
 court.4701.trepanning_possessed_injury:0 "Ruhları kafamdan atacağına söz vermiş olsa da birdenbire, ilk kez bir ruha tanık oluyorum. Yakışıklı kanatlı bir ruh, odanın karanlık köşelerinde dans ediyor ve bana sırıtıyor." ### CQC
 court.4701.trepanning_deviant_injury:0 "Kafama delik açılmaya başlandığında, boğuk iç organlarımın sesini dinlemeye başladım. Kafam biraz kurcalandıktan sonra aniden bir zekâ patlaması yaşadım! Gececi olmalıyım ve sadece ekmek kabuğu yemeliyim! Neden bir at gibi davranarak hiç sevişmedim?" ### CQC
 court.4701.trepanning_learning_penalty:0 "Keski kafamın içinde dönüp dururken ağlamamak için kendimi çok zor tutuyorum! Sonunda dönmesi durduğunda, zavallı zihnim bir cümle kurmak için sanki çamurun içinden geçmek zorundaymış gibi hissediyor."" ### CQC
 court.4701.trepanning_physical_injury:0 "İlk başta kafatasımı delen keski vücuduma öyle bir acı veriyor ki, omurgam ikiye bölünmüş gibi. Kazı derinleştikçe,"
 court.4701.trepanning_no_result:0 "Sonunda keski kafamdan çekildiğinde, açıkta kalan beynime hafif bir hava akımının esmesi dışında hiçbir fark hissetmiyorum."
 court.4701.trepanning_coordination_penalty:0 "Hiçbir şey hissetmemeye başlıyorum. Sonunda keski kafamdan çekildiğinde, bunu hissedemiyorum. Ayağa kalkmaya çalışırken vücudum zorlukla uyum sağlıyor." ### CQC
 court.4701.trepanning_blind_injury:0 "gözümün önüne aniden bir sis denizi iniyor. Sonraki an, sonsuz bir alacakaranlık diyarına girerken o sis için bile yas tutuyorum."
 court.4701.a:0 "Hehehehehe! Selamlar!"
 court.4701.b:0 "Seni şerefsiz! Sen n'aptın bana?"
 court.4701.c:0 "Kafatasım ağrıyor!"
 court.4701.d:0 "Kimmiş iyi şeytan? Evet sen!"
 court.4701.e:0 "Tüm iç çamaşırlarımı temizlemeliyim!"
 court.4701.f:0 "Harika! Benim saray hekimim olmaya ne dersin?"
 court.4701.g:0 "Sözde 'kötülüklerin' iblislerin işi olmadığının kanıtı"
 court.4701.h:0 "Sana bir borcum var... kafamdaki deliğe bir tıpa bulduğunda..."
 court.4701.i:0 "Dertli düşüncelerim, tek başıma yüzleşebileceğim bir düşman."
 court.4750.t:0 "Bir Kahraman Gerek"

 court.4750.desc:0 "Sarayıma yakın zamanda yeni bir misafir geldi: biraz üne sahip, tatlı dilli bir şair.\n\n"

 court.4750.a:0 "Papa Joan'ın dönemini anlatan bir hikâye uydurun!"

 court.4750.b:0 "Leydi Godiva! Onun ata binişi hakkında bir balad!"

 court.4750.c:0 "Sinbad çok cesur bir figür!"

 court.4750.d:0 "Caligula... az takdir edilen ama ilgi çekici bir figürdü."

 court.4750.e:0 "Nasreddin Hoca fıkraları her zaman yüzümü güldürmüştür."

 court.4750.f:0 "Bana müjdeci şair Valmiki'den bahset!"
 court.4750.g:0 "Neden ki? En sevdiğim kahraman benim!"

 court.4750.h:0 "İsraf edecek ne altınım ne de zamanım var."

 court.4751.intro:0 "İsteğim üzerine yeni şair [poet.GetFirstName] bana"

 court.4751.topic.pope_joan:0 "Papa Joan'dan ilham aldığı bir eser getiriyor."

 court.4751.topic.lady_godiva:0 "Lady Godiva'dan ilham aldığı bir eser getiriyor."

 court.4751.topic.sinbad:0 "Sinbad'dan ilham aldığı bir eser getiriyor."

 court.4751.topic.caligula:0 "Caligula'dan ilham aldığı bir eser getiriyor."

 court.4751.topic.nasreddin:0 "Nasreddin Hoca'dan ilham aldığı bir eser getiriyor."

 court.4751.topic.valmiki:0 "Valmiki'den ilham aldığı bir eser getiriyor."
 court.4751.topic.ruler_hero:0 "benim kahramanca hayatımdan ilham aldığı bir eser getiriyor."
 court.4751.topic.unexpected:0 "Ama hiç de beklediğim gibi bir şey değil."
 court.4751.ruler_character:0 "\n\nTezhipli el yazmalarına kısa bir bakış attıktan sonra anlıyorum ki, beni bir kahramanın yanında yan karakter olarak gösteriyor!\n\n" ### CQC

 court.4701.pope_joan_desc:0 "\n\nÇizimlere baktığımda Joan'ın yüzü için benim yüzümden ilham alındığını fark ediyorum!\n\n[poet.GetTitledFirstNameNoTooltip|U] üzerime doğru eğiliyor."

 court.4701.ruler_hero_desc:0 "\n\nŞiir, bazıları diğerlerinden daha az gerçek olan ama hepsi de son derece etkileyici görkemli başarılarım ile ilgili."

 court.4751.topic.lady_godiva_desc:0 "Bu şiirde güzel Leydi Godiva'nın yanında at sürüyorum. Kendisi güzel ve aynı zamanda çırılçıplak!"

 court.4751.topic.sinbad_desc:0 "Ben Sinbad'ın maceralarında tekrar karşılaştığı gizemli bir karakterim. Ben devasa kuş Roc'un yumurtasından çıkan yaratığım. Ben yıllardır Sinbad'ın omuzlarına yapışan Denizin Yaşlı Adamıyım. Ben insan yiyen devin tutsağıyım."

 court.4751.topic.caligula_desc:0 "Ben metindeki bir karakterim, bilgelikle dolu ama tavsiyelerine kulak verilmeyen Caligula'nın yorgun danışmanıyım."

 court.4751.topic.nasreddin_desc:0 "Fıkralar, Nasreddin Hoca'nın ben saray görevlerimi hallederken benim peşimden geldiğini ve eşeğinin üzerinden her hareketime küçümseyici sözler söylediğini anlatıyor."

 court.4751.topic.valmiki_desc:0 "\n\nEfsanedeki gibi, bir avcı güzel bir kuş vuruyor ve elimde olmadan bir beyit söylemeye başlıyorum.\n\nMüjdeci şairin tesadüfen yazdığı ilk şiir gibi ben de gelişi güzel dizeler söylemeye başlıyorum."
 court.4751.a:0 "Enteresan bir şekilde eserinizin saygısızlığı onu daha çekici kılıyor..." ### CQC

 court.4751.b:0 "Belki de gözlerimi Papalığa dikmeliyim..."
 court.4751.c:0 "Normalde kızardım ama bunun bana hayranlar kazandıracağı kesin..."
 court.4751.c.tt:0 "İlgisini çektikleriniz mutlaka fark edeceklerdir..."
 court.4751.d:0 "Bu aklıma bazı saf olmayan düşünceler sokuyor."
 court.4751.e:0 "Onun şakalarının arkasında her zaman öğrenilecek bir şeyler vardır."
 court.4751.f:0 "Çok komikmiş, saray mensupları buna bayılacak."
 court.4751.g:0 "Olması gerektiği gibi!"
 court.4751.h:0 "Bu bir sonraki yangınım için en iyi çıra olacaktır."
 court.4800.t:0 "Uçuş Denemesi"

 court.4800.desc:0 ""Bir kez daha ses çıkar, soytarı, seni pencereden atarım!" Koruma görevlim [defenestrating_bodyguard.GetTitledFirstName]'in yanına geldiğimde, [defenestrating_bodyguard.GetSheHe]'in [defenestrated_character.GetTitledFirstName]'in arka tarafına eşlik ettiğini fark ediyorum; onu pencereden dışarı sarkıtıyor.\n\n[defenestrating_bodyguard.GetTitledFirstNameNoTooltip] dişlerini sıkar. "[defenestrated_character.GetSheHe|U] görev sırasında takındığım ciddi yüzle dalga geçiyordu. [defenestrated_character.GetSheHe|U] kompozisyonumu bozmak için kaz sesleri çıkarıp duruyordu. Bunun güvenliğinize bir tehdit olduğunu söylüyorum."\n\nTehlikeye rağmen, kurtulmak için boşuna çırpınışlar arasında [defenestrated_character.GetTitledFirstNameNoTooltip] bir kıkırtı salıveriyor. "#EMP Honk#!.""
 court.4800.a:0 "Bakalım soytarılar uçabiliyor mu?"
 court.4800.maimed_toast:0 "Kanatsız [defenestrated_character.GetTitledFirstName]"
 court.4800.death_toast:0 "[defenestrated_character.GetTitledFirstName] uçarken öldü"
 court.4800.b:0 "Abartmaya gerek yok! Nazikçe dövebilirsin."
 court.4800.c:0 "[defenestrated_character.GetTitledFirstNameNoTooltip] haklı. İyi bir koruma asla kışkırtmalara gelmez."
 court.4801.t:0 "Patlamaya Hazır"
 court.4801.desc:0 "Küçük [poopy_child.GetTitledFirstName] taht odamda oyun oynuyor ancak ben bunu görmeden çok önce, ne olduğu belli olan bir koku alıyorum.\n\n"Aaa, [ROOT.GetCharacter.Custom('GetMamaPapa')]! Seni gördüğüme çok sevindim!" derken sarılmak için bacağıma doğru atılıyor. Dolu bezinin ağırlığını diğer bacağımda hissediyorum.\n\nİki bacağım arasında sıkıştıkça bezinden sızmaya başlıyor. Kendi kendime soruyorum: Hizmetçi sayımız çok mu az da bez değiştirme gibi bir ayak işi bile bana kaldı?" ### CQC

 court.4801.a:0 ""Gel kollarıma, seni temizleyelim.""
 court.4801.b:0 "Bu pisliğe dokunmaktansa savaş meydanında mağlup olmayı tercih ederim."
 court.4802.t:0 "Zorla Eğitim"
 court.4802.desc:0 "Saray Öğretmenim [court_tutor.GetTitledFirstName], bir grup öğrencisini etrafına toplamış.\n\n"Öğretmenim, paralelkenar nedir?"\n\n"Öğretmenim 'sevişmek' ne demek?"\n\n"Öğretmenim, flütümün sesi iyi mi yoksa #EMP daha da yüksek#! sesle mi çalmalıyım?"\n\n[court_tutor.GetTitledFirstNameNoTooltip], bana yılmış bir şekilde bakıyor. "[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )], daha fazla dayanamıyorum. Lütfen beni bu görevden azat edin."" ### CQC
 court.4802.a:0 "Çok şeker değiller mi?"
 court.4802.b:1 "Sana bir trompet alacağım [child_2.GetTitledFirstNameNoTooltip]. Bunun sesi #EMP daha çok#! çıkar!"
 court.4802.c:0 "Anlıyorum, yeni bir Öğretmen arayacağız."
 court.4803.t:0 "Hayalet Kalem"
 court.4803.desc:0 "Şairim, her zaman yaptığı gibi beni görür görmez yüksek sesle konuşmaya başlıyor. "Ah, kıymetli [ROOT.GetCharacter.Custom('PetName')]! İlham perilerinin terk ettiği bir hayatı yaşamak çok zor olmalı."\n\n"Ordulara komuta edersiniz de kelimelere komuta edemezsiniz. İnsanlık daha önce bundan daha büyük bir trajediye tanık oldu mu?"\n\n"Size yardım etmeme izin verin. Sizin için konuşmalarınızdan bazılarını hazırlayabilirim. Bana konuyu söyleyin, ben de güzel bir konuşma hazırlayayım.""
 court.4803.a:0 "Konuşmalarımı güzelleştirmekten zarar gelmez."
 court.4803.b:0 "Bazen kendimi bir [ROOT.GetCharacter.GetTitleAsName] yerine daha çok şair gibi hissediyorum, yardıma gerek yok."
 court.4803.c:0 "Sevgilime benim adıma bir şiir yazmanı tercih ederim."
 court.4803.c.tt:0 "[lover.GetTitledFirstName|U] için şiir göndereceksiniz"
 court.4803.c.intrigue.tt:1 "[lover.GetFirstNameNoTooltip] yüksek [intrigue|E] yeteneğine sahip, başkası tarafından yazıldığını anlayabilir."
 court.4803.c.realize.tt:0 "[lover.GetFirstNameNoTooltip] gerçek yazarın kim olduğunu fark etti"
 court.4803.c.fooled.tt:0 "[lover.GetFirstNameNoTooltip], 'sizin' şiirinizden etkilendi"
 court.4803.d:0 "Kelimelerim çok iyi olmayabilir ancak kalbimden geliyorlar."
 court.4804.t:0 "Yatak Arkadaşları"
 court.4804.desc:0 "Her ikisinin de gözlerinin altında koyu halkalar olan, aynı odayı paylaşan iki saray mensubunun tartıştığını fark ettim.\n\n"[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )], [roomate_2.GetTitledFirstName] ile bir gece daha aynı yatağı paylaşamam. Bütün örtüyü kendine çeken doyumsuz bir domuz."\n\n"Bu hafta [roomate_1.GetTitledFirstName] her gece [ROOT.Char.Custom('RandomBadRoomate')]." [roomate_2.GetTitledFirstName] titriyor. "Yalvarırım [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )], bize daha iyi kalacak yerler bahşedin. Soğuk, boş bir yataktan başka bir şey istemiyorum."" ### CQC
 court.4804.a:0 "Hizmetçilere size yeni yataklar bulmalarını söyleyeceğim."
 court.4804.b:0 "Bu odalar bir [ROOT.GetCharacter.GetTitleAsNameNoTooltip] sarayına #EMP yakışmıyor#!."
 court.4804.c:0 "Herkese kendi odasını verecek yerimiz yok."
 court.4805.t:0 "Mihenk Taşı"
 court.4805.desc:0 "Mimarım [royal_architect.GetTitledFirstName], devasa bir çuvalı taht odama sürükleyerek getiriyor ve bu sırada sırıtıyor. Taht odamın zeminini sıyırıp çizerken irkiliyorum.\n\n"[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )], #EMP çok#! haddimi aşan bir şey yaptım ancak bunun sizi memnun edeceğini düşünüyorum."\n\nÇuvalı açarken müstehcen bir şeyler olmasını bekliyorum ancak çuvalın içinden irice, dikdörtgen bir kaya parçası çıkıyor. "Bu, yeminli düşmanınız [rival.GetTitledFirstName] ve onun [rival.Custom('FortifiedBuilding')] dibinden getirdiğim mihenk taşı. Bu sayede yapı tüm kıymetini kaybetti!"" ### CQC
 court.4805.a:0 "Hadi onunla bir domuz ahırı yapalım!"
 court.4805.b:0 "Gururla sergilenmesini istiyorum!"
 court.4805.c:0 "Onunla olan düşmanlığımdan pişmanım. Taşı aldığın yere geri koy."
 court.4805.d:0 "Neden bu pisliği bana getirdin? At gitsin!"
 court.4806.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip] Hayranı"
 court.4806.intro:0 "Taht odamda yeni bir yüz dolaşıyor; [ROOT.Char.GetCulture.GetNameNoTooltip] geleneklerini temsil eden bazı sanat eserlerine baktığında arada bir kıkırdayıp zıplıyor." ### CQC
 court.4806.hre_desc:0 "\n\n"Kalbim! [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip] gerçekten harika bir yer! [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] topraklarında yaşasam da, gerçek bir [ROOT.Char.GetCulture.GetName] olarak doğduğumu düşünüyorum! Her Prens-Piskoposu sayabilirim. Hatta baldırımda [ROOT.GetCharacter.GetTitledFirstNamePossessiveNoTooltip] yüzünün dövmesi var."\n\nÇantasının içine uzanıyor ve Reichskrone'un ucuz bir bronz kopyası gibi görünen bir şey çıkarıyor. "Çoğu gün bunu giyerim ve yanından geçtiğim insanlara 'Elektörlük için oyunuzu bana verin!' derim.""
 court.4806.byzantine_desc:1 "Heyecanlı ziyaretçi yaklaşırken, muhafızlar daha fazla yaklaşmaması için önünü kesiyor.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] topraklarında doğsam da, [ROOT.Char.GetCulture.GetCollectiveNoun] kültürünü kalbimin kaldırabileceğinden daha fazla seviyorum."\n\n"Ben hayatımı sizlerden biri gibi yaşamaya adadım, [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] öğrenmeye odaklandım."\n\n"Ben sadece mor iç çamaşırı giyerim. İmparatorluk çökerse, annemin ölümünden daha fazla üzülürüm. Ağlamamın asla sonu gelmez!""
 court.4806.general_desc:1 "Bu ziyaretçide bir tuhaflık olduğu yürüyüşünden belli. Yakınlaştıkça elinde kopya bir [ROOT.Char.Custom('signature_weapon')] taşıdığını görüyorum; ben onun aslı için canımı bile veririm.\n\n"Önünüzde diz çökmeden edemiyorum. [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier|u] topraklarında yaşasam da hayatımı [ROOT.Char.GetCulture.GetCollectiveNoun] kültürüne adadım. Sadece [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] konuşurum, [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.GetCharacter.Custom('GetExpensiveMeal')] yerim ve [ROOT.Char.GetCulture.GetName] tarzı kılıç eğitimi aldım."\n\n"Ailem beni evden kovdu. Kafayı [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip] ile bozduysam, orada yaşamam gerektiğini söylediler."" ### CQC
 court.4806.a:0 "Bu biraz tuhaf hissetirse de aslında bir yandan da gurur verici."
 court.4806.b:0 "Bana o eski püskü şeyi ver! Belki giyerim."
 court.4806.c:0 "Bu kadar hevesli biri sarayımıza katılmalı!"
 court.4806.c.byz:0 "Vatanseverliğinizden dolayı mor giymenize izin vereceğim.."
 court.4806.d:0 "Yalnızca bir [ROOT.Char.GetTitleAsNameNoTooltip] mor giyebilir! Atın şu serseriyi zindana!"
 court.4806.e:0 "[ROOT.Char.Custom('signature_weapon')|U] kopyasını ne cüretle yaparsın! Alın şunun elinden!"
