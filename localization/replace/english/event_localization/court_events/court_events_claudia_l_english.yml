 court.6071.desc:0 "#EMP D...e...ğ...e...r...l...i a...r...k...a...d...a...ş...ı...m,#!\n\n"Evet, iyi gözüküyor!"\n\nSayısız saatimi, [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] keskin bakışları altında alfabeyi çalışarak geçirdim ve görünüşe göre emeklerim meyvesini verdi! Diplomatik yazışmalar, konsey üyelerinin raporları ve vasalların yükümlülükleri artık benim için bir gizem değil!\n\nHemen bana kalem verin - daha fazla evrak imzalamak istiyorum!" ### CQC
 court.6071.a:0 "Fazla zekiyim."
 court.6071.b:0 "[tutor_6070.GetFirstNameNoTooltip] bir ödülü hak ediyor."
 court.6071.b.tt: "[tutor_6070.GetFirstNameNoTooltip] $court_tutor_court_position$ olarak Yatkınlık kazanıyor."
 court_language_teacher_desc: "Süzerene okuma yazmayı öğretti"
 court.6072.desc:0 "#EMP D...e...e...r...l...i A...r...a...d...a...ş,#!\n\n"Şuna bir göz atsana! Harika gidiyorum, değil mi?"\n\n[tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)|U] içini çekiyor ve ümitsiz bir şekilde başını sallıyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], isminizi yazmak yerine bu güzel ve parıldıyan mührü kullanmayı hiç düşündünüz mü?"\n\nGörünüşe göre, benim okuma yazma öğrenme yolunda katettiğim #EMP muazzam#! ilerleme onu tatmin edememiş."
 court.6072.a:0 "Harfler bu zamana kadar kimin işine yaramış!"
 court.6072.a.tt:0 "Kimse etkilenmedi"
 court.6072.b:0 "Pekâlâ, #EMP okuduğum#! kağıdı güzel bir mühürle imzalayayım."
 court.6072.b.tt:0 "Mühür gerçekten de güzel duruyor ancak bu imzaladıklarını okuyamadığın gerçeğini değiştirmiyor"
 court.6072.c:0 "Hepsi senin suçun, [tutor_6070.GetFirstNameNoTooltip]!"
 court.6080.t:0 "Cömert [6080_visitor.GetFirstNameNoTooltip]"
 court.6080.desc:0 "[6080_visitor.GetTitledFirstName] geçtiğimiz birkaç yıldır kutsal olduğunu söylediği bir bölgeye giderken yol üstündeki sarayımı ziyaret ediyor."
 court.6080.desc_middle: "\n\nGeldiğinden beri, haysiyetsizce altınlarını etrafa saçarak cömertliğiyle beni saray halkımın karşısında gölgede bırakıyor! Onu çevreleyip âdeta tapan saray halkını görünce canım iyice sıkılıyor. Neticede onlar #EMP BENİM#! saray halkım.\n\n"Sana ağzına kadar dolu bir kese armağan ediyorum, sevgili [beneficiary_1.GetFirstName]!" ### CQC
 court.6080.desc_liege: "Süzerenim [6080_visitor.GetTitledFirstName], son birkaç gündür [GetActivityType('activity_tour').GetName] nedeniyle sarayımı ziyaret ediyor."
 court.6080.desc_2:0 "Ve aynı zamanda sana da biraz para, nazik [beneficiary_2.GetFirstName]!"
 court.6080.desc_3:0 "Ve tatlı [beneficiary_child.GetFirstName] için tatlı kekler!"
 court.6080.desc_end:0 "Unutmayın, zenginlik paylaşmak demektir!""
 court.6080.a:0 "Ben #EMP daha#! cömert olabilirim!"
 court.6080.b:0 "Onun aptalca cömertliğini lehime kullanmalıyım!"
 court.6080.b.success:0 "[6080_visitor.GetFirstNameNoTooltip], bana para sökülmeye ikna oluyor"
 court.6080.b.success.tt:0 "[6080_visitor.GetFirstNameNoTooltip] ikna oldu!"
 court.6080.b.failure:0 "[6080_visitor.GetFirstNameNoTooltip], uğraşlarımdan hiç mi hiç etkilenmiyor"
 court.6080.b.failure.tt:0 "[6080_visitor.GetFirstNameNoTooltip] ikna olmadı"
 court.6080.c:0 "[6080_visitor.GetFirstNameNoTooltip] artık misafirlik sınırlarını aşmaya başladı..."
 court.6080.d:0 "Harcamaları onun yapması benim yapmamdan iyidir."
 court.6090.t:0 "Retorik"

 court.6090.desc:0 ""#EMP AMA ÇOK SIKILDIM!#!" [6090_child_a.Custom2('MyCharacterIntroduction', ROOT.Char)]'in yakınmacı sesini, yaramaz gözüme görünmeden hemen tanıyorum.\n\nSonra gözlerimin önünde bulduğum manzara oldukça acınası:"
 court.6090.desc.cp: "[6090_poet.Custom2('MyCharacterIntroduction', ROOT.Char)] ağlamanın eşiğine gelmiş gibi gözüküyordu."
 court.6090.desc.teacher: "Sarayımızı ziyaret eden, bölgede ünlü bir öğretmen olan [6090_poet.GetFirstName], bıkmış usanmış gibi gözüküyordu."
 court.6090.desc.middle: "[6090_child_a.GetFirstNameNoTooltip] ve [6090_child_b.GetFirstName] ise o genç yüzlerinde şimdiye kadar hiç görmediğim bir umursamazlıkla ona bakıyorlardı."
 court.6090.desc_other:0 "[6090_child_c.GetFirstName] bu esnada pencerenin oraya yönelmişti belli ki dışarıdaki #EMP herhangi bir şey#! daha fazla ilgisini çekiyordu."
 court.6090.desc_end:0 "\n\nOnunla göz göze geldiğimizde [6090_poet.GetFirstNameNoTooltip] bana dönerek: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP istirham ediyorum#!, ben sadece onlara soylu doğmalarından ötürü bilmeleri gereken retoriğin güzel sanatlarını açıklamaya çalışıyorum.""
 court.6090.a:0 "Dikkatinizi verin çocuklar! Bunu öğrenmeniz lazım."
 court.6090.b:0 "Bırakın da ben daha anlaşılır şekilde anlatayım."
 court.6090.b.success:0 "Çocuklar etkilenmiş duruyorlar"
 court.6090.b.failure:0 "[6090_poet.GetFirstNameNoTooltip] bile benden daha eğlenceli"
 court.6090.b.failure.tt:0 "Çocuklar hiçbir şey öğrenmiyorlar"
 court.6090.c:0 "Sorun sende [6090_poet.GetFirstNameNoTooltip]!"
 court.6090.c.tt: "#EMP Savaşmak#! genç soylular için çok daha değerli bir uğraştır! Gel benimle talim yap!"
