 court_6000_all_courtiers_and_guests:0 "Tüm [Concept('courtiers','Saray Mensuplarınız')|E] ve [Concept('guests','Misafirleriniz')|E]"
 court.6000.t:0 "Gizli Tarih"
 court.6000.desc_opening:1 "Odaya girdiğimde [courtier.GetFirstName], '[ROOT.Char.GetPrimaryTitle.GetNameNoTier] Ülkesinin Gizli Tarihi' adlı kitaba gömülmüş hâldeydi. Beni fark edince telaşa kapıldı; bir yandan kitabı gizlemeye çalışırken bir yandan da kekelemeye başladı." ### CQC
 court.6000.desc_liege:0 "\n\n"[SCOPE.sC('courtier').Custom2('RelationToMePossessive', ROOT.GetCharacter)]!"
 court.6000.desc_family:0 "\n\n"[SCOPE.sC('courtier').Custom2('RelationToMePossessive', ROOT.GetCharacter)]!"
 court.6000.desc_ending:0 "Düşündüğünüz gibi değil! Emin olun!" derken bir yandan da kitabı giysisinin içine doğru bastırmaya çalışıyordu.\n\nNihayet kitabı elinden aldığımda, kitapta [ROOT.Char.GetPrimaryTitle.GetNameNoTier] tahtındaki öncülümün sarayında yaşanan sözde ahlaksızlıklara dair ayrıntılı betimlemelerin yer aldığı bir sayfaya rastladım." ### CQC
 court.6000.a:1 "#EMP KABUL EDİLEMEZ!#! Bu yalanları kim yazmış olabilir?"
 court.6000.a.tt:0 "Casusbaşını araştırması için görevlendireceksiniz"
 court.6000.b:0 "Ooo, neler neler yapılmış!"
 court.6000.b.tt:0 "Birinin #EMP renkli#! geçmişini açığa çıkartma ihtimaliniz var"
 court.6000.c:1 "[predecessor.GetTitledFirstNameNoTooltip] nasıl biriymiş herkes bilsin!"
 court.6000.c.tt:0 "[predecessor.GetTitledFirstNameNoTooltip] benim hanedanıma yakışmayan [Select_CString(predecessor.IsFemale, 'biriydi', 'alçak herifin tekiydi' )]! Onun hakkında #EMP tam olarak#! ne düşündüğümü sana anlatayım..."
 court.6000.d:0 "Ne kadar da sıkıcı. Gerçekten anlayamıyorum."
 court.6000.e.tt:0 "Kendiniz bir araştırma başlatacaksınız."
 court.6000.f:0 "Yazılanlar doğru ancak olanları geride bırakmalıyız."
 court.6002.desc:0 "Kendimi devletler arası yazışmalara vermişken [spymaster.GetTitledFirstName] arkasındaki korkak bakışlı [author.GetTitledFirstName] ile birden içeri giriyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], öncülünüz [predecessor.GetTitledFirstName] hakkındaki o yalanlarla bezenmiş utanç verici kitabın yazarını buldum!""
 court.6002.b.desc_opening:0 "Geçtiğimiz aylarda boş vaktimin tamamını, öncülüm hakkındaki yanlışları derleyen o kitabı yazan sinsi yılanı aramakla geçirdim." ### CQC
 court.6002.b.desc_ending:2 "Çok sayıda uykusuz geçen gecenin ardından suçluyu buldum. İşte korkak burada karşımda!\n\n[author.GetTitledFirstName] önümde titreyerek beklerken, ne söyleyeceğime iki defa düşünmem gerektiğini hissediyorum." ### CQC
 court.6002.a:0 "Bu küstahça yalanlarından ötürü utanmalısın!"
 court.6002.a.tt:0 "Ya sözlerini geri alıp tövbe eder ya da..."
 COURT_OF_NO_SECRETS_VALUE: "Muhalefete Zulmedildi"
 court.6002.a.tt2: "Casusbaşının $task_find_secrets$ verimliliğini 15 yıl arttır."
 court.6002.b:0 "Muhafızlar, bu haini tutuklayın!"
 court.6002.c:0 "Bu sefer çizgiyi aştın, [author.GetFirstNameNoTooltip]..."
 court.6002.d:0 "Tahmin edeyim o günlüğü kaleme alırken kötü bir niyetin yoktu?"
 court.6003.desc:1 "Aylar geçmesine rağmen casusbaşım [spymaster.GetTitledFirstName], o alçak yazarı bulma görevinde hiçbir ilerleme kaydedemedi!\n\n[spymaster.GetFirstNameNoTooltip] huzuruma çıktığında gözlerindeki gergin ve suçluluk dolu bakışı fark etmemek zor olmuyor. "Efendim! Her yeri aradım ama yazarı bulamadım; sanki yer yarılmış da içine girmiş gibi! Belki sarayı terk etmiştir... Belki de onu koruyan birisi vardır ya da-"\n\nCasusbaşımın gevelemesini el işaretimle durduruyorum." ### CQC
 court.6003.b.desc_ending:0 "\n\nMaalesef verdiğim o kadar uğraş hiçbir neticeye ulaşmamış gibi görünüyor, suçlu ve izleri tamamen ortalıktan kaybolmuş. Sanırım gerçeği hiçbir zaman öğrenemeyeceğim."
 court.6003.a:0 "Kafana takma, çok da önemli değildi."
 court.6003.b:0 "Oldukça hayal kırıcı..."
 court.6003.c:2 "Siz #EMP hainler#! yazarı mı kolluyorsunuz yoksa?"
 court.6003.c.tt:0 "Saray ahalisine saldıracaksınız"
 court.6003.d:0 "Elinden geleni yaptığını biliyorum..."
 court.6003.e:0 "Öyleyse onun yerine seni cezalandırmam gerekecek!"
 court.6010.t:0 "Koridorlardaki Peygamber" ### CQC

 court.6010.desc:0 ""#EMP BUGÜN TÖVBE ET!#! EN DOĞRU GERÇEĞİ ÖĞREN! IŞIĞA ADIM AT!" \n\n[preacher.GetTitledFirstName] sarayıma katıldığından beri, [preacher.GetHerHis] herkesi [preacher.GetHerHis] yabancı tarikatına çevirme çabaları günlük hayatımın arka plan gürültüsü hâline geldi.\n\nGece gündüz [preacher.GetSheHe] avlularda sinsice dolaşıyor, koridorlarda devriye geziyor ve karanlık köşelerde şüphelenmeyen geçenleri bekliyor, onları [preacher.GetHerHis] ısrarlı ciyaklamalarıyla #EMP ikna etmeye#! hazır.\n\nSaraylılarım bitkin ve [preacher.GetFirstNameNoTooltip] beni hela yolunda pusuya düşürdükten sonra, onların hoşnutsuzluğuna katılma eğilimindeyim.""
 court.6010.a:0 "Hoşgörü gösterelim. Neticede [preacher.GetFirstNameNoTooltip] zararsız birisi."
 court.6010.b:1 "Bu budalayı sarayımdan gönderin!"
 court.6010.c:1 "Gitsin sıçanlara vaaz versin, beni ilgilendirmez."
 court.6010.c.tt:0 "Süzereni [preacher_liege.GeTitledFirstName], bu kararınızdan pek hoşnut kalmayacak."
 court.6010.c.tt2: "[chaplain.GetCouncilTitlePossessive|U] $task_conversion$ [councillor_task|E], [preacher.GetFaith.GetName] mezhebinden olan kontluklarda 20 yıl boyunca #P daha çok#! etkilidir"
 court.6010.c.tt3: "[chaplain.GetCouncilTitlePossessive|U] $task_conversion$ [councillor_task|E], [preacher.GetFaith.GetName] mezhebinden olan kontluklarda 20 yıl boyunca #N daha az#! etkilidir"
 court.6010.a_every_county: "[Concept( 'realm', 'Ülkenizdeki' )|E] her [preacher.GetFaith.GetName] [county|E] ([preacher_faith_counties_size])"
 court_6010_harsh_conversions: "Zoraki Din Değişimi"
 court_6010_tolerant_conversions: "Hoşgörülü Yaklaşım"
 court.6010.d:0 "Bu kadar #EMP SAPKINLIK#! YETER!!"
 court_6010_all_courtiers_and_guests_faith:0 "Tüm [preacher.GetFaith.GetAdjectiveNoTooltip] [Concept('courtiers','Saray Mensuplarınız')|E] ve [Concept('guests', 'Misafirleriniz')|E]"
 court.6011.desc_opening:0 "[preacher_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court.6011.desc_prisoner:0 "Maiyetimdeki bir din adamını - #EMP daha da önemlisi benim mezhebime mensup bir din adamını#! sarayınızda mezhebinin doğrularını anlatması sebebiyle cezalandırmanız gözümden kaçmadı.\n\nBunların hepsinin bir yanlış anlaşılmadan ibaret olduğuna, sizin de bu durumu aynı şekilde değerlendireceğinize ve daha fazla yanlış anlaşılmaya mahal vermeden bu hatayı en kısa sürede gidereceğinize olan inancım tam."
 court.6011.desc_executed:0 "Geçenlerde sarayınızda misafir ettiğiniz, maiyetimdeki bir din adamını sapkınlıkla suçlayarak idam ettiğiniz haberini aldım.\n\nBunu bir yanlış anlaşılma olarak değerlendirmek ve sizin bu hareketi #EMP bana ve inancıma#! karşı bir hareket olarak yapmadığınızı düşünmek isterim."
 court.6011.a:0 "Sizi kışkırtmak gibi bir niyetim yoktu, lütfen bu tazminatı kabul edin."
 court.6011.b:0 "Sarayımda sizin din adamlarınıza yer yoktur."
 court.6020.t:0 "Saraydaki Şeytan"
 court.6020.desc_opening:1 "[possessed_char.GetTitledFirstName] gizemli ve bir o kadar da dehşet verici bir hâlde." ### CQC

 court.6020.desc_chaplain:0 "\n\nSaray Rahibimin söylediğine göre"
 court.6020.desc_no_chaplain:0 "\n\nSöylentilere göre"
 court.6020.desc_middle:1 "şeytani bir varlık onun vücudunu ele geçirmiş ve kendisini bastırılamaz bir güçle açığa çıkarıyor. Bu olayların yoğunluğu ve sıklığı son zamanlarda benim dindar saray halkım arasında artan bir telaşa yol açıyor. Saraydaki dindarlar kötücül varlıkların bize musallat olacağına, etrafa korku ve ölüm yayacağına inanıyorlar." ### CQC
 court.6020.desc_physician:0 "\n\nSaray hekimine göre" ### CQC
 court.6020.desc_no_physician:0 "\n\n"
 court.6020.desc_ending:0 "[possessed_char.GetFirstNameNoTooltip], bu zamana kadar herhangi bir #EMP tehdit#! yaratmadı fakat saray ahalisi bir şeyler yapılması konusunda ısrar ediyor."
 court.6020.a:1 "[court_chaplain.GetTitledFirstNameNoTooltip], derhâl şeytanı kov!"
 court.6020.a.success:0 "[court_chaplain.GetFirstName] başarılı oldu"
 court.6020.a.success.tt:0 "Belli aralıklarla düzenlenen şeytan çıkarma ayinleri sonrasında [possessed_char.GetTitledFirstName] daha iyi görünüyor"
 court.6020.a.failure:0 "[court_chaplain.GetFirstName] başarısız oldu"
 court.6020.a.failure.tt:0 "[possessed_char.GetTitledFirstName] hâlâ eski durumunda"
 court.6020.b:0 "Telaşa kapılmayın! Bu tanrının bir lütfu!"
 court.6020.c:0 "Bu kutsal eşyanın gücü onu kurtaracak."
 court.6020.c.tt:0 "[6020_relic.GetNameNoTooltip], sahip olduğu güç ile her türlü rahatsızlığı tedavi edebilir."
 court.6020.d:1 "[court_physician.GetTitledFirstNameNoTooltip], ona yardımcı olabilecek herhangi bir şifalı bitki biliyor musunuz?"
 court.6020.d.tt:0 "[court_physician.GetFirstName], sahip olduğu tecrübe sayesinde onu iyileştirmeyi başarıyor"
 court.6020.d.tt.2:0 "[court_physician.GetFirstNameNoTooltip] bitkisel bir karışım deniyor"
 court.6020.e:0 "Bu basit bir beyin hastalığından ibaret. Değil mi [court_physician.GetFirstNameNoTooltip]?"
 court.6020.f:0 "Rahat bırakın [Select_CString(possessed_char.IsFemale, 'kadını', 'adamı' )]."
 court.6020.b.tt: "#EMP Kehanetler#! görmek bir $court_poet_court_position$, $court_musician_court_position$ veya $cave_hermit_court_position$ için oldukça faydalıdır"
 court_6020_all_courtiers_and_guests_christian:1 "Aynı dine sahip tüm [Concept('courtiers','Saray Mensuplarınız')|E] ve [Concept('guests','Misafirleriniz')|E]"
 court_6020_all_courtiers_or_guests_polith:1 "Diğer tüm (kuşkucu olmayan) [Concept('courtiers','Saray Mensuplarınız')|E] ve [Concept('guests','Misafirleriniz')|E]"
 court.6030.t:0 "Sarımsak [Select_CString(ROOT.Char.IsFemale, 'Kraliçenin', 'Kralın' )] Şarkısı" ### CQC

 court.6030.desc:0 ""#EMP Küçük kasabamızda bir hikâye var,\nSarımsak Tacı giyen bir [ROOT.Char.Custom('GetQueenKing')] hakkında,\n[ROOT.Char.Custom('GetUnbelieverNamePlural')] ile savaşmak için bir eşekle yola çıktı,\nama tek başarısı küçük bir maymuna karşıydı...#!"\n\nBu lanetli balad, gezgin ozanlar ve halk arasında çok popüler oldu - bana göre #EMP fazla popüler#!, çünkü kendimle onun kahramanı arasında rahatsız edici derecede çok benzerlik buldum... Ama [6030_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] tarafından yüzüme karşı utanmadan söylenmesini duymak fazla ileri gitmek!""
 court.6030.a:0 "Ama #EMP gerçekten#! komik bir hikâye!"
 court.6030.b:0 "Bu #EMP çok#! çok utanç verici..."
 court.6030.c:0 "#EMP Bunu komik mi buldun?!#!"
 court.6030.d:0 "Bu #EMP kabul edilemez#!."
 court.6030.d.tt:0 "Bu şarkının söylenmesi yasaklanacak, söyleyenler hapsedilmekle tehdit edilecek."
 court.6030.e:0 "Yeter. Bıktım... YETER!"
 court.6030.e.tt:0 "O aptal şarkıyı söylediğini gördüğünüz bir sonraki kişiye yumruğu yapıştıracaksınız."
 court.6030.f:0 "Bir noktadan sonra sıkılırlar herhâlde, değil mi?"
 court.6040.t:0 "Beleşçi"
 court.6040.desc:0 "[scrounger.GetTitledFirstName|U], resmen sarayımda bir demirbaş hâline geldi - üstelik #EMP pahalı#! bir demirbaş.\n\nHer şölende hazır ve nazır, her şeyi ayı gibi yerken bir yandan da kilerinin ne kadar boş olduğundan şikayet ediyor. Koca bir [ROOT.Char.Custom('GetExpensiveDrink')] fıçısını miğdeye indirirken geğirerek "Yine en iyi içecekleri ikram ediyorsunuz, [ROOT.Char.Custom('FormOfAddressForLiege')|l]!" diyor. "Siz en #EMP [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')]#!, en #EMP [ROOT.Char.Custom('ComplimentAdjective')]#!, #EMP EN [Select_CString(ROOT.Char.IsFemale, 'GÜZEL', 'YAKIŞIKLI' )]#! [Select_CString(ROOT.Char.IsFemale, 'Leydisiniz', 'Lordsunuz' )]!" diyor. Bir yandan da hiç bir zaman geri ödeyemeyeceği bariz bir borç için talepte buluyor.\n\nAçıkçası sinir bozucu bir para israfından ibaret fakat soytarılıkları kimi zaman eğlendirici olabiliyor."
 court.6040.a:0 "Madem bu kadar yerleştin, sana bir iş ayarlayalım!"
 court.6040.b:0 "Doğrusu onu bayağı eğlenceli buluyorum!"
 court.6040.c:1 "Bu asalağı gözümün önünden çekin."
 court.6041.desc:0 "[scrounger.GetTitledFirstName] kalmasına izin vermemden bu yana parazitvari hayat stilini sürdürmeye devam ediyor.\n\nAçıkçası alışıldık hâle gelen abartılı yoksulluk hikâyeleri ve sinir bozucu yağcılığından fazlasını beklemiyordum fakat geçenlerde hikâyelerinin daha komik, tekerlemelerinin daha oturaklı ve iltifatlarının daha mest edici hâle geldiğini fark ettim.\n\nHem misafirlerim hem de yabancı konuklarım ustaca işlenmiş sözleriyle oldukça eğlenmişlerdi. Acaba [scrounger.GetFirstNameNoTooltip] sonunda kendi amacını buldu mu?"
 court.6041.a:0 "Bir şekilde işe yarayabileceğini biliyordum."
 court.6041.b:0 "... bahse varım bundan da iyisini yaparsın!"
 court.6041.b.failure:0 "Tüm çabasına rağmen, [scrounger.GetFirstNameNoTooltip] yeteneğinin tepe noktasına zaten ulaşmış gözüküyor"
 court.6041.b.success:0 "[scrounger.GetFirstNameNoTooltip] harika bir iş için bir fikir ile çıkageliyor"
 court.6041.b.failure.tt:0 "[scrounger.GetFirstNameNoTooltip] kendisini daha fazla geliştiremedi"
 court.6041.b.success.tt:0 "[scrounger.GetFirstNameNoTooltip] ilham kazandı!"
 court.6041.c:0 "Sana yeterince zamanımı heba ettim."
 court.6050.t:0 "Müstehcen Hikâyeler" ### CQC
 court.6050.desc_opening:0 "Son zamanlarda genç kızların ve genellikle sert bir mizaca sahip askerlerin bir kitaptan mest olmuş bir şekilde kıkırdaşmaları dikkatimi çekiyor.\n\nGünün sonlarına doğru elinde mevzubahis kitapla [courtier.GetTitledFirstName] gözüme çarpıyor."

 court.6050.desc_byz:0 "Kitabın kapağı dualarla ilgili dinî bir kitap intibası bırakmasına rağmen biraz incelendiğinde kitabın yüzyıllar önce pagan atalarımızca yazılmış şehvet dolu bir roman olduğu anlaşılıyor. Başrolde güzel bir bakire, korsanlar, baştan çıkarma ve sapkın arzularla dolu şehvet dolu sayfalar..."

 court.6050.desc_islam:0 "Kitaba hızlıca bir göz attıktan sonra içeriğinin korsanlar, yarı çıplak kadınlar, lüks düşkünü krallar, şehvetli ve sinsi kraliçeler ile dolu olduğunu, bir cinin yardımıyla zengin olup prenses ile evlenen bir sokak çocuğuna dair bir hikâye barındırdığını görüyorum."

 court.6050.desc_sonetti:0 "Şiirlerle dolu bazı sayfalar, dışarıdan masum görünmelerine rağmen oldukça şehvetli bir yapıya sahiptiler. Her türden kadının meleksi güzelliğine atıfta bulunan sözcükler, şairin dünyevi arzularını gizlemede yetersiz kalıyordu..."

 court.6050.desc_chaucer:0 "Tüm hikâyeler kutsal bir yolculuğa çıkanlara odaklansa da; hikâyelerde ruhlarının irfana erişmesi değil, vahşi cinayetler ve yoldan çıkmış kadınlar ön plandaydı."
 court.6050.desc_generic:0 "Bu kitap açıkça şehvetle, dünyevi ihtiraslar ve çapkınlıklarla dolu..."

 court.6050.desc_ending:0 "\n\n[court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName], endişe dolu gözlerle vereceğim tepkiyi bekliyor."
 court.6050.a:0 "Ah gözlerim!"
 court.6050.b:0 "Bunu ancak ateşle temizleriz!"
 court.6050.b.tt:1 "Bu skandal kitabın tüm kopyalarını yakacaksınız ve sarayınızdan yasaklayacaksınız"
 court.6050.b.tt.2: "Sarayınızda eğitim gören çocukların [GetTrait('pensive').GetName( GetNullCharacter )], [GetTrait('chaste').GetName( GetNullCharacter )] veya [GetTrait('zealous').GetName( GetNullCharacter )] kişilikler geliştirmesi daha muhtemel olacak"
 court.6050.c:0 "Bu da bir kültürdür, bırakın okusunlar."
 court.6050.c.tt: "Sarayınızda eğitim gören çocukların [GetTrait('curious').GetName( GetNullCharacter )], [GetTrait('lustful').GetName( GetNullCharacter )] veya [GetTrait('cynical').GetName( GetNullCharacter )] kişilikler geliştirmesi daha muhtemel olacak"
 court.6050.c.unlock_text:0 "Bu seçenek yüksek [learning|E] beceriniz sebebiyle seçilebilir durumda"
 court.6050.d:0 "Ooo, çok iyiymiş!"
 court.6050.e:1 "Niye sadece okumakla yetinelim ki, [courtier.GetFirstNameNoTooltip]?"
 court.6050.e.tt:0 "Okuduklarınızdan ilham alacaksınız"
 court.6050.f:0 "Kitabı yok et, ben de hiç görmemişim gibi davranayım."
 court_6050_courtiers_or_guests:0 "Tüm iffet yoksunu [Concept('courtiers','Saray Mensuplarınız')|E] ve [Concept('guests','Misafirleriniz')|E]"
 court.6060.t:0 "Şarabın Zevkleri"

 court.6060.desc_opening:0 "Birdenbire, [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName] ve [court_physician.Custom2('MyCharacterIntroduction', ROOT.Char)] münakaşa hâlinde taht odama daldılar.\n\n"
 court.6060.desc_drunkard_courtier:1 "\n\n[courtier_drunkard.GetTitledFirstName] odanın bir köşesinden aniden fırlayarak tartışmaya farklı bir bakış açısı katıyor: "Şarabın faydalı olacağı miktar #EMP ELİNDEKİ MİKTARIN TAMAMIDIR!#!""
 court.6060.desc_ending:0 "\n\nPeki ya ben şaraba nasıl yaklaşıyorum?"
 court.6060.a:0 "Şarap bütün kötülüklerin anasıdır."
 court.6060.b:0 "Bir miktar şarap mizah anlayışını geliştirir."
 court.6060.c:0 "[courtier_drunkard.GetFirstNameNoTooltip|U], şerefe!"
 court.6060.c.tt: "[courtier_drunkard.GetFirstNameNoTooltip|U] sakladığı şişeleri açıyor!"
 court.6060.c.tt.2: "[courtier_drunkard.GetFirstNameNoTooltip] sayesinde şarap stoğumuz artıyor, 10 yıl boyunca Mutfak Saray İmkânları %50 daha ucuz olacak."
 court.6060.d:0 "Cevap kadehin sonunda saklı!"
 court.6070.t:0 "Harflerin Değeri"
 court.6070.desc:0 "Yavaş ve dikkatlice titrek kalemim ve kararsız elimle adımı yeni fermana yazarken saray mensuplarımın beni yargılayan bakışlarını hissedebiliyordum.\n\nİşin doğrusu #EMP yazıyorum#! denemez, daha çok kalemle ahşap bir tablete oyulmuş harflerin üzerinden geçiyorum. Elimden geldiği kadar. Bugün, [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] bile bana acımak ve iğrenmekten oluştuğunu tahmin ettiğim bir yüz ifadesiyle baktı.\n\nTam onu saygısızlığından dolayı azarlayacakken, umut dolu bir ses tonuyla konuşmaya başladı: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], belki de artık doğru düzgün okumayı ve yazmayı öğrenmenizin zamanı gelmiştir?""
 court.6070.a:0 "Bana #EMP hemen#! öğret!"
 court.6070.a.success:0 "Başarılı bir şekilde okuma yazma öğreniyorum"
 court.6070.a.failure:0 "Okuma yazma öğrenme serüvenim başarısızlıkla sonuçlanıyor"
 court.6070.a.tt.1:0 "Artık hiç kimse benimle alay edemeyecek"
