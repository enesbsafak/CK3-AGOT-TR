l_english:
 historical_commander_trait.reject.tt:1 "#F İlham almak için başka yerlere bakacaksınız #!"

 historical_commander_trait.0001.t:0 "Son Nehir Krallarının Çöküşü"

 historical_commander_trait.0001.desc:0 "Eski generallerin stratejilerini incelerken, İkinci Pön Savaşı'nda Hannibal Barca'nın üstün başarıları karşısında [ROOT.Char.Custom('surprised_reaction')]:\n\n#F 'Romanın Düşmanı' olarak bilinen Hannibal'ın en büyük başarısı aşağı yukarı 50.000 kişilik ordusuyla 86.000 kişiden daha kalabalık ve güçlü Roma ordusunu çevreleyerek üstünlük sağlamasıdır. Etrafı çevrilen ve geri çekilemeyen ordudan geriye sadece 3000 Romalı asker sağ çıkabilmiştir.#!"

 historical_commander_trait.0001.a:0 "Hannibal gibi bende düşmanlarımı yok edeceğim!"

 historical_commander_trait.0001.b:0 "Hannibal, Fabian taktiklerinin gerçek bir ustasıydı."

 historical_commander_trait.0001.c:0 "Çok yönlülük Hannibal'ın en büyük gücüydü."
 historical_commander_trait.0001.d:0 "Hah! Umutsuz bir savaş için mücadele veren aptalın tekiydi."
 historical_commander_trait.0001.d.good:0 "Acımasızlık savaş durumunda bile özenilecek bir özellik değildir."

 historical_commander_trait.0002.t:0 "Sezar'ın Zaferi"

 historical_commander_trait.0002.desc:0 "Eski generallerin stratejilerini incelerken, Sezar'ın Galya fethi sırasında sergilediği üstün başarıları memnuniyetle okudum.\n\n#F Sezar, Alesia kuşatması sırasında iyi tahkim edilmiş bir şehre doğrudan saldırmanın pahalıya mal olacağına karar verdi. Duvarlara saldırmak yerine ordusuna emir vererek şehri duvarlar ile sarıp kendi kalesini inşa etmelerini emretti. Düşman garnizonunu içeride açlığa mahkûm ederek, takviye kuvvetlerin savunuculara destek için gelmelerini engelledi.#!"

 historical_commander_trait.0002.a:0 "Kuşatma sırasında ufak bir yaratıcılık çok yol katetmeni sağlar."

 historical_commander_trait.0002.b:0 "Düşmanın sana gelmesini sağla! Beğendim!"

 historical_commander_trait.0002.c:0 "Sezar riskli bir plana kalkıştı. Ancak karşılığını aldı!"
 historical_commander_trait.0002.d:0 "Savaşlar artık böyle yapılmıyor..."

 historical_commander_trait.0003.t:0 "Durdurulamayan İskender"

 historical_commander_trait.0003.desc:0 "Eski generallerin stratejilerini incelerken, Büyük İskender'in Mezopotamya Seferi sırasında sergilediği üstün başarılar karşısında [ROOT.Char.Custom('surprised_reaction')].\n\n#F İskender, bir ada şehri olan Sur'a saldırmak için çevre kasabalardan birini yıkıp çıkan molozları kullanarak ana karadan şehrin duvarlarına uzanan bir geçit inşa ettirdi. Bu geçit kuşatma araçları ile şehrin duvarlarına saldırılmasını sağladı ancak yine de duvarlarda gedik açılmasını sağlayan donanmasıydı.#!"

 historical_commander_trait.0003.a:0 "Hiçbir su kütlesi ordularımı durduramaz!"

 historical_commander_trait.0003.b:0 "Bu geçit büyük bir yaratıcılık harikasıydı."

 historical_commander_trait.0003.c:0 "Düşmanın kaynaklarını onlara karşı kullanmak mı? Dâhice!"

 historical_commander_trait.0003.d:0 "Neden işe yaramayan stratejiler üzerine çalışarak vakit kaybedeyim?"

 historical_commander_trait.0004.t:0 "Chi-Ro Rüyası"

 historical_commander_trait.0004.desc:0 "Eski generallerin stratejilerini incelerken, Milvian Köprüsü Savaşında Konstantin'in aldığı zaferi öğrenince heyecanlanmıştım.\n\n#F Savaştan önceki gece Konstantin rüyasında, eğer askerlerin kalkanlarına İsa'nın sembolü olan Chi-Ro'yu çizerlerse savaşı kazanacaklarını gördü. Konstantin askerlerine bunu yapmalarını emretti ve ertesi gün gaspçı Maxentius'un birliklerini Tiber Nehri'ne gömdü.#!"

 historical_commander_trait.0004.a:0 "Hainler Tanrı'nın ordularına rakip olamaz!"

 historical_commander_trait.0004.b:0 "Konstantin gibi, hiçbir nehir zaferimizi erteletemez!"

 historical_commander_trait.0004.c:0 "Mantıklı konuşursak, esnek stratejiler ile bu savaş kazanıldı."

 historical_commander_trait.0004.d:0 "Moralleri yükseltmek için yapılan hileler savaşları kazanmak için yeterli değil!"

 historical_commander_trait.0005.t:0 "Allah'ın Kılıcı"

 historical_commander_trait.0005.desc:0 "Eski generallerin stratejilerini incelerken, Halid bin Velid'in İslam'ı kabul ettikten sonra kazandığı ilk zaferi okuduğumda düşüncelere daldım.\n\n#F Mute Muharebesi sırasında Halid, Bizans güçlerine karşı sayıca üçte biri kadar olan ve tereddüt içinde olan askerlerini hattı korumak için toparladı. Onun bu meydan okuyan duruşu, ordularını kesin ölümden kurtararak organize bir şekilde Medine'ye geri çekilmelerini sağlamıştır. Halid ve ordusu bu olaydan sonra Allah adına tüm Arabistanı feth etti!#!"

 historical_commander_trait.0005.a:0 "Allah adına savaşanlar galip gelecekler!"

 historical_commander_trait.0005.b:0 "Bağlılık, sayıca az olduğumuzda bize güç verir."

 historical_commander_trait.0005.c:0 "#EMP Ne zaman#! savaşacağını bilmek #EMP nasıl#! savaşacağını bilmek kadar önemlidir."

 historical_commander_trait.0005.d:0 "Neden utanç verici bir yenilgiyi kutlarsın?"
 historical_commander_trait.0006.t: "Bilge Kağan"
 historical_commander_trait.0006.desc: "Antik generallerin taktiklerini incelerken, Bilge Kağan'ın dört bir yana ulaşan fetihlerinin hikâyelerini keşfettiğimde ilham buldum.\n\nBaximi ve Gazhou üzerinden yaptığı akınlarda, Tang İmparatoru Xuanzong'un yüz binleri bulan ordusunu küçük düşürmüş. Gerçekten de gücümüzün çeviklik ve hareket kabiliyetinde yattığını göstermiş!\n\nBilge ve ordusu daha sonra Tengri'nin adıyla Khitanları ve Xi'yi de ezip geçmiş!"
 historical_commander_trait.0006.a: "Göklerin lütfuyla ayakta kalırız!"
 historical_commander_trait.0006.b: "$historical_commander_trait.0005.c$"
 historical_commander_trait.0006.c: "Hareketli bir ordu için esnek taktikler şart!"
 historical_commander_trait.0006.d: "Biz, basit oyunlardan daha iyiyiz!"
 historical_commander_trait.0007.t:0 "Sun Tzu"
 historical_commander_trait.0007.desc:0 "Yedi askerî klasiği incelerken, Sun Tzu'nun Boju Muharebesi'nde savaş teorilerinin değerini kanıtladığını öğrenince [ROOT.Char.Custom('surprised_reaction')].\n\n#F İlkbahar ve Sonbahar Döneminde, Sun Tzu'nun Wu ordularını zafere taşıdığı, artık iyice geliştirdiği askerî teoremlerini kullanarak sayıca üstün Chu kuvvetlerini bozguna uğrattığı iddia edilir.#!"
 historical_commander_trait.0007.a:0 "Düzensizlik ile düzen arasındaki çizgi, eşgüdümde yatar."
 historical_commander_trait.0007.b:0 "Düşmanı savaşmadan boyunduruk altına almayı hedeflemeliyim."
 historical_commander_trait.0007.c:0 "Harekete geçtiğinizde, bir yıldırım gibi inin!"
 historical_commander_trait.0007.d:0 "En büyük zafer, hiç muharebe gerektirmeyendir."
