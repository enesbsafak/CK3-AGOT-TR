### TODO AGOT-ONLY: historical_commander_trait.0001.t [AGOT: The Fall of the Last River Kings]
 historical_commander_trait.0001.t:0 "The Fall of the Last River Kings"
### TODO AGOT-CHANGED: historical_commander_trait.0001.desc [AGOT: While studying tactics from battles long past, I come across the account of King Tristifer IV Mudd. He was the last of the Kings of River and Hills during the Andal invasion and is said to have won ninety-nine battles agains the Andals only to fall on his hundredth. | TR: Eski generallerin stratejilerini incelerken, İkinci Pön Savaşı'nda Hannibal Barca'nın üstün başarıları karşısında [ROOT.Char.Custom('surprised_reaction')]:\n\n#F 'Romanın Düşmanı' olarak bilinen Hannibal'ın en büyük başarısı aşağı yukarı 50.000 kişilik ordusuyla 86.000 kişiden daha kalabalık ve güçlü Roma ordusunu çevreleyerek üstünlük sağlamasıdır. Etrafı çevrilen ve geri çekilemeyen ordudan geriye sadece 3000 Romalı asker sağ çıkabilmiştir.#!]
 historical_commander_trait.0001.desc:1 "While studying tactics from battles long past, I come across the account of King Tristifer IV Mudd. He was the last of the Kings of River and Hills during the Andal invasion and is said to have won ninety-nine battles agains the Andals only to fall on his hundredth."
### TODO AGOT-CHANGED: historical_commander_trait.0001.a [AGOT: Would I last ninety-nine battles? | TR: Hannibal gibi bende düşmanlarımı yok edeceğim!]
 historical_commander_trait.0001.a:0 "Would I last ninety-nine battles?"
### TODO AGOT-CHANGED: historical_commander_trait.0001.b [AGOT: The king must have had secure supply lines. | TR: Hannibal, Fabian taktiklerinin gerçek bir ustasıydı.]
 historical_commander_trait.0001.b:0 "The king must have had secure supply lines."
### TODO AGOT-CHANGED: historical_commander_trait.0001.c [AGOT: Versatility would be needed to win that many battles. | TR: Çok yönlülük Hannibal'ın en büyük gücüydü.]
 historical_commander_trait.0001.c:0 "Versatility would be needed to win that many battles."
 historical_commander_trait.0001.d:0 "Hah! Umutsuz bir savaş için mücadele veren aptalın tekiydi."
 historical_commander_trait.0001.d.good:0 "Acımasızlık savaş durumunda bile özenilecek bir özellik değildir."
### TODO AGOT-CHANGED: historical_commander_trait.0002.t [AGOT: The Hungry Wolf, The Flayer, and the Seven Stars | TR: Sezar'ın Zaferi]
 historical_commander_trait.0002.t:0 "The Hungry Wolf, The Flayer, and the Seven Stars"
### TODO AGOT-CHANGED: historical_commander_trait.0002.desc [AGOT: While studying the histories of Westeros I come across the story of King of the North Theon | TR: Eski generallerin stratejilerini incelerken, Sezar'ın Galya fethi sırasında sergilediği üstün başarıları memnuniyetle okudum.\n\n#F Sezar, Alesia kuşatması sırasında iyi tahkim edilmiş bir şehre doğrudan saldırmanın pahalıya mal olacağına karar verdi. Duvarlara saldırmak yerine ordusuna emir vererek şehri duvarlar ile sarıp kendi kalesini inşa etmelerini emretti. Düşman garnizonunu içeride açlığa mahkûm ederek, takviye kuvvetlerin savunuculara destek için gelmelerini engelledi.#!]
 historical_commander_trait.0002.desc:0 "While studying the histories of Westeros I come across the story of King of the North Theon "the Hungry Wolf" Stark. King Theon — along with the Boltons — turned the Andals at the Battle of the Weeping Water, killing Argos Sevenstar. Once they had repelled the invaders, King Theon sailed for Andalos, raiding along its coast. They took the heads of those they killed and placed them on pikes along the North's eastern coast as a warning."
### TODO AGOT-CHANGED: historical_commander_trait.0002.a [AGOT: He brought the fight to Andalos! | TR: Kuşatma sırasında ufak bir yaratıcılık çok yol katetmeni sağlar.]
 historical_commander_trait.0002.a:0 "He brought the fight to Andalos!"
### TODO AGOT-CHANGED: historical_commander_trait.0002.b [AGOT: He turned the Andals at the Battle of the Weeping Water! | TR: Düşmanın sana gelmesini sağla! Beğendim!]
 historical_commander_trait.0002.b:0 "He turned the Andals at the Battle of the Weeping Water!"
### TODO AGOT-CHANGED: historical_commander_trait.0002.c [AGOT: To trust old enemies like the Boltons, but it paid off! | TR: Sezar riskli bir plana kalkıştı. Ancak karşılığını aldı!]
 historical_commander_trait.0002.c:0 "To trust old enemies like the Boltons, but it paid off!"
 historical_commander_trait.0002.d:0 "Savaşlar artık böyle yapılmıyor..."
### TODO AGOT-CHANGED: historical_commander_trait.0003.t [AGOT: The Blood Red Kraken | TR: Durdurulamayan İskender]
 historical_commander_trait.0003.t:0 "The Blood Red Kraken"
### TODO AGOT-CHANGED: historical_commander_trait.0003.desc [AGOT: While studying the histories of Westeros, I come across a name still cursed by the people of the Westerlands. Dalton | TR: Eski generallerin stratejilerini incelerken, Büyük İskender'in Mezopotamya Seferi sırasında sergilediği üstün başarılar karşısında [ROOT.Char.Custom('surprised_reaction')].\n\n#F İskender, bir ada şehri olan Sur'a saldırmak için çevre kasabalardan birini yıkıp çıkan molozları kullanarak ana karadan şehrin duvarlarına uzanan bir geçit inşa ettirdi. Bu geçit kuşatma araçları ile şehrin duvarlarına saldırılmasını sağladı ancak yine de duvarlarda gedik açılmasını sağlayan donanmasıydı.#!]
 historical_commander_trait.0003.desc:0 "While studying the histories of Westeros, I come across a name still cursed by the people of the Westerlands. Dalton "the Red Kraken" Greyjoy thrived in the chaos of the Dance, his support of the Blacks allowed him to raid the Westerlands in Rhaenyra's name."
### TODO AGOT-CHANGED: historical_commander_trait.0003.a [AGOT: To attack from the sea! | TR: Hiçbir su kütlesi ordularımı durduramaz!]
 historical_commander_trait.0003.a:0 "To attack from the sea!"
### TODO AGOT-CHANGED: historical_commander_trait.0003.b [AGOT: He took both Kayce and Faircastle! | TR: Bu geçit büyük bir yaratıcılık harikasıydı.]
 historical_commander_trait.0003.b:0 "He took both Kayce and Faircastle!"
### TODO AGOT-CHANGED: historical_commander_trait.0003.c [AGOT: The wealth he must have taken! | TR: Düşmanın kaynaklarını onlara karşı kullanmak mı? Dâhice!]
 historical_commander_trait.0003.c:0 "The wealth he must have taken!"
### TODO AGOT-CHANGED: historical_commander_trait.0003.d [AGOT: A monster in history that none should idolize. | TR: Neden işe yaramayan stratejiler üzerine çalışarak vakit kaybedeyim?]
 historical_commander_trait.0003.d:0 "A monster in history that none should idolize."
### TODO AGOT-CHANGED: historical_commander_trait.0004.t [AGOT: The Falcon Knight | TR: Chi-Ro Rüyası]
 historical_commander_trait.0004.t:0 "The Falcon Knight"
### TODO AGOT-CHANGED: historical_commander_trait.0004.desc [AGOT: While studying the histories of Westeros, I come across a tome that told the final battle between the First Men of the Vale and their Andal Invaders. The Andals were lead by Artys | TR: Eski generallerin stratejilerini incelerken, Milvian Köprüsü Savaşında Konstantin'in aldığı zaferi öğrenince heyecanlanmıştım.\n\n#F Savaştan önceki gece Konstantin rüyasında, eğer askerlerin kalkanlarına İsa'nın sembolü olan Chi-Ro'yu çizerlerse savaşı kazanacaklarını gördü. Konstantin askerlerine bunu yapmalarını emretti ve ertesi gün gaspçı Maxentius'un birliklerini Tiber Nehri'ne gömdü.#!]
 historical_commander_trait.0004.desc:0 "While studying the histories of Westeros, I come across a tome that told the final battle between the First Men of the Vale and their Andal Invaders. The Andals were lead by Artys "the Falcon Knight" Arryn — and through the use of a goat path and a clever decoy, Artys won the battle. The First Men houses submitted to Artys as he was crowned King of Mountain and Vale. "
### TODO AGOT-CHANGED: historical_commander_trait.0004.a [AGOT: The strength of faith! | TR: Hainler Tanrı'nın ordularına rakip olamaz!]
 historical_commander_trait.0004.a:0 "The strength of faith!"
### TODO AGOT-CHANGED: historical_commander_trait.0004.b [AGOT: Clever, leading a army along a goat's path. | TR: Konstantin gibi, hiçbir nehir zaferimizi erteletemez!]
 historical_commander_trait.0004.b:0 "Clever, leading a army along a goat's path."
### TODO AGOT-CHANGED: historical_commander_trait.0004.c [AGOT: The decoy was an unusual tactic, but effective. | TR: Mantıklı konuşursak, esnek stratejiler ile bu savaş kazanıldı.]
 historical_commander_trait.0004.c:0 "The decoy was an unusual tactic, but effective."
### TODO AGOT-CHANGED: historical_commander_trait.0004.d [AGOT: The bards and septons have distorted this tale. | TR: Moralleri yükseltmek için yapılan hileler savaşları kazanmak için yeterli değil!]
 historical_commander_trait.0004.d:0 "The bards and septons have distorted this tale."
### TODO AGOT-CHANGED: historical_commander_trait.0005.t [AGOT: The Queen and Her Ten-Thousand Ships | TR: Allah'ın Kılıcı]
 historical_commander_trait.0005.t:0 "The Queen and Her Ten-Thousand Ships"
### TODO AGOT-CHANGED: historical_commander_trait.0005.desc [AGOT: While everyone in Westeros knows of Queen Nymeria, I find myself enthralled while reading a passage on her journey. After the fall of Prince Garin to Valyria, Nymeria gathered her people and sailed to find a new home. Though the journey was long, with several failed attempts at a new home, they eventually arrived at Dorne. Queen Nymeria joined with House Martell, and together they were able to unite Dorne. | TR: Eski generallerin stratejilerini incelerken, Halid bin Velid'in İslam'ı kabul ettikten sonra kazandığı ilk zaferi okuduğumda düşüncelere daldım.\n\n#F Mute Muharebesi sırasında Halid, Bizans güçlerine karşı sayıca üçte biri kadar olan ve tereddüt içinde olan askerlerini hattı korumak için toparladı. Onun bu meydan okuyan duruşu, ordularını kesin ölümden kurtararak organize bir şekilde Medine'ye geri çekilmelerini sağlamıştır. Halid ve ordusu bu olaydan sonra Allah adına tüm Arabistanı feth etti!#!]
 historical_commander_trait.0005.desc:0 "While everyone in Westeros knows of Queen Nymeria, I find myself enthralled while reading a passage on her journey. After the fall of Prince Garin to Valyria, Nymeria gathered her people and sailed to find a new home. Though the journey was long, with several failed attempts at a new home, they eventually arrived at Dorne. Queen Nymeria joined with House Martell, and together they were able to unite Dorne."
### TODO AGOT-CHANGED: historical_commander_trait.0005.a [AGOT: Some on the Greenblood still worship the Rhoynar faith. | TR: Allah adına savaşanlar galip gelecekler!]
 historical_commander_trait.0005.a:0 "Some on the Greenblood still worship the Rhoynar faith."
### TODO AGOT-CHANGED: historical_commander_trait.0005.b [AGOT: The Rhoynar fought valiantly, even killing dragons. | TR: Bağlılık, sayıca az olduğumuzda bize güç verir.]
 historical_commander_trait.0005.b:0 "The Rhoynar fought valiantly, even killing dragons."
### TODO AGOT-CHANGED: historical_commander_trait.0005.c [AGOT: To prepare for such a journey must have been daunting. | TR: #EMP Ne zaman#! savaşacağını bilmek #EMP nasıl#! savaşacağını bilmek kadar önemlidir.]
 historical_commander_trait.0005.c:0 "To prepare for such a journey must have been daunting."
### TODO AGOT-CHANGED: historical_commander_trait.0005.d [AGOT: Regardless of the journey, it is a tale of flight. | TR: Neden utanç verici bir yenilgiyi kutlarsın?]
 historical_commander_trait.0005.d:0 "Regardless of the journey, it is a tale of flight."
 historical_commander_trait.0006.t: "Bilge Kağan"
 historical_commander_trait.0006.desc: "Antik generallerin taktiklerini incelerken, Bilge Kağan'ın dört bir yana ulaşan fetihlerinin hikâyelerini keşfettiğimde ilham buldum.\n\nBaximi ve Gazhou üzerinden yaptığı akınlarda, Tang İmparatoru Xuanzong'un yüz binleri bulan ordusunu küçük düşürmüş. Gerçekten de gücümüzün çeviklik ve hareket kabiliyetinde yattığını göstermiş!\n\nBilge ve ordusu daha sonra Tengri'nin adıyla Khitanları ve Xi'yi de ezip geçmiş!"
 historical_commander_trait.0006.a: "Göklerin lütfuyla ayakta kalırız!"
 historical_commander_trait.0006.b: "$historical_commander_trait.0005.c$"
 historical_commander_trait.0006.c: "Hareketli bir ordu için esnek taktikler şart!"
 historical_commander_trait.0006.d: "Biz, basit oyunlardan daha iyiyiz!"
 historical_commander_trait.0007.t:0 "Sun Tzu"
 historical_commander_trait.0007.desc:0 "Yedi askerî klasiği incelerken, Sun Tzu'nun Boju Muharebesi'nde savaş teorilerinin değerini kanıtladığını öğrenince [ROOT.Char.Custom('surprised_reaction')].\n\n#F İlkbahar ve Sonbahar Döneminde, Sun Tzu'nun Wu ordularını zafere taşıdığı, artık iyice geliştirdiği askerî teoremlerini kullanarak sayıca üstün Chu kuvvetlerini bozguna uğrattığı iddia edilir.#!"
 historical_commander_trait.0007.a:0 "Düzensizlik ile düzen arasındaki çizgi, eşgüdümde yatar."
 historical_commander_trait.0007.b:0 "Düşmanı savaşmadan boyunduruk altına almayı hedeflemeliyim."
 historical_commander_trait.0007.c:0 "Harekete geçtiğinizde, bir yıldırım gibi inin!"
 historical_commander_trait.0007.d:0 "En büyük zafer, hiç muharebe gerektirmeyendir."
