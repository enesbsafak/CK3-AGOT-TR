 learning_scholarship.1101.t:0 "Okuyup Yazamamak"
### TODO AGOT-ONLY: learning_scholarship.1101.desc [AGOT: ]
 learning_scholarship.1101.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], it has come to my attention that you might require some tutelage in the art of... deciphering written communication," [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] says, presenting me with a scroll.\n\n"If it would please my [ROOT.Char.GetLadyLord] I would be willing to instruct you; I have the perfect text right here.""
 learning_scholarship.1101.a:0 "K-kralın büyük bi-bir tacı vardı..."
 learning_scholarship.1101.b:0 "Ben okumayı zaten biliyorum!"
 learning_scholarship.1201.t:0 "Ötücü Kuş"
 learning_scholarship.1201.desc:0 "Işıltılı metalden yapılma tüyleri, değerli taşlardan yapılma gözleri ve çıkarttığı ahenkli müzikle [bird_sender.Custom2('MyCharacterIntroduction', ROOT.Char)] tarafından hediye edilen bu yapay kuş âdeta bir başyapıt!\n\n"Bu kuş [bird_sender.GetPrimaryTitle.GetNameNoTierNoTooltip] diyarının en yetenekli zanaatkârlarının elinden çıktı..." diye belirtiyor [bird_sender.GetTitledFirstNameNoTooltip] mektubunda ve ekliyor:\n"Umarım hediyemi beğenirsiniz.""
 learning_scholarship.1201.a:0 "Satın gitsin."
 learning_scholarship.1201.b:0 "Sergileyelim."
 learning_scholarship.1201.c:0 "İçini kurcalayın ve nasıl çalıştığını öğrenin."
 learning_scholarship.1201.c.success:0 "[bird_sender.GetTitledFirstNameNoTooltip] işini bilen biri."
 learning_scholarship.1201.c.failure:0 "[bird_sender.GetTitledFirstNameNoTooltip] hakarete uğradığını düşünecek."
 learning_scholarship.1401.t:0 "Camdan Taş"
 learning_scholarship.1401.desc:0 "Önümdeki parşömenin küçük harflerini okumaya çalışırken yine başım deli gibi ağrımaya başladı. Yazarlar neden bu kadar küçük yazmak zorundalar?!\n\nGözlerimi kısıyorum ve tekrar deniyorum.\n\n"... bu buluş cam taşının yardımı ile yaşlı bunağın teki bile bu küçük yazıları okuyabilir!""
 learning_scholarship.1401.a:1 "Bana bunlardan bir tane bulup getirin!"
 learning_scholarship.1401.b:0 "Madem okunmuyorlar atın gitsin şunları."
 learning_scholarship.1401.c:0 "[bishop.GetTitledFirstNameNoTooltip], yardımına ihtiyacım var"
 learning_scholarship.3001.t:0 "İlahi Görüler"
 learning_scholarship.3001.desc:0 "[chaplain.GetTitledFirstName], karanlık bir odada ahşap direkler üzerine dizilmiş bakır küreler ve mumlardan oluşan bir daire içinde bana eşlik ediyor. Ortamı sakinleştirmek için yaktığımız tütsüler kısa sürede gözümüzü yakmaya başlıyor. "İşte bu şekilde gözümüzün ucuyla meleklerin anlaşılmaz biçim ve hallerini göreceğiz."\n\n[chaplain.GetFirstNameNoTooltip] birdenbire durdu ve "Böyle iş olmaz. Bu ilahi varlıkları bizim ölümlü gözlerimiz görmemeli." dedi."
 learning_scholarship.3001.a:0 "Sen istersen çık, öyle ya da böyle ben bunun sonunu getireceğim!"
 learning_scholarship.3001.b:0 "Sanırım haklısın, bu yaptığımız günah olmasa bile saçmalık."
 learning_scholarship.3001.c:0 "İnan bana kötü bir niyetim yok."
 learning_scholarship.3001.c.tt1:0 "[chaplain.GetFirstName] bana yardım edecek."
 learning_scholarship.3001.c.toast.tt1:0 "[chaplain.GetFirstName] ikna oluyor"
 learning_scholarship.3001.c.tt2:0 "[chaplain.GetFirstName] ikna olmayacak."
 learning_scholarship.3001.c.toast.tt2:0 "[chaplain.GetFirstName] amacıma inanmıyor"
 book_translation_story: "Büyük Bir Çeviri"
 book_translation_story_desc: "Büyük bir çalışmanın çevirisi, başkalarının da bu bilgelikten faydalanabilmesini sağlar. Bu entelektüel başarı zekânızın bir yansıması olurken, başarısızlık ise sizi beceriksiz biri olarak gösterecek."
 TRANSLATION_STORY: "[Story.GetOwner.Custom('TranslationBookLong')] çevirisi yapıyorsunuz"
 TRANSLATION_QUALITY: "Çeviri Kalitesi"
 POOR_TRANSLATION: "Zayıf"
 EXCELLENT_TRANSLATION: "Mükemmel"
 DURATION_LEFT: "Kalan Süre"
 PROGRESS_TOWARDS_CYNICISM: "Kuşkuculuk İlerlemesi"
 CYNICISM: "Kuşkuculuk"
 ZEALOTRY: "Dindarlık"
 learning_scholarship_special.2001.t:0 "Yeni Bir Çeviri"
 learning_scholarship_special.2001.desc:0 "Bir şeyleri öğrenme isteğim ve öğrenmek için verdiğim çabalar bana hiçbir şey bilmediğimi fark ettiriyor. Çağlar boyunca, kitaplar eskiyip diller unutuldukça ne bilgiler kaybolmuştur kim bilir...\n\nBelki de klasik eserlerden birinin çevirisini yaparsam bilim dünyasına bir katkım dokunur?\n\nGerçi neyi çevirebilirim ki...?"
