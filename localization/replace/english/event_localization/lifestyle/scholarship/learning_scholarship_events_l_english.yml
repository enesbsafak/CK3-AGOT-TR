 learning_scholarship_special.2011.desc:0 "[ROOT.Char.Custom('TranslationBook')|U] çevirim bitmek üzere ama bir yerde takılıp kaldım.\n\nKâtiplerim sayfada geçen bir kelimenin "iki ayak ile avcıların kıyılarında da ruhların yükselişi" anlamına geldiğini söylüyor.\n\nBu doğru değildir herhâlde, değil mi?"
 learning_scholarship_special.2011.a:0 "Daha iyi uyacak bir anlam bulabilirim."
 learning_scholarship_special.2011.a.success:0 "Daha iyi bir şekilde çevirmeyi başardım"
 learning_scholarship_special.2011.a.failure:0 "Sanırım beceremedim ve metin anlamını kaybetti"
 learning_scholarship_special.2011.b:0 "Metnin lafzına sadık kalacağız!"
 learning_scholarship_special.2011.c:0 "Ne demek istediği bariz, bu işi bana bırakın."
 learning_scholarship_special.2012.desc:0 "[ROOT.Char.Custom('TranslationBook')|U] kitabından bir cümle kaç gündür çeviri yaparken beni sinir edip duruyor. Arada sırada kendimi bu cümleyi mırıldanırken buluyorum.\n\n[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('realm_priest'))|U] "Hâlâ bununla uğraşıyorsun, ha?" diyerek eski ve ağır bir kitabı masama bıraktı. "Sadece nereye bakacağınızı bilmeniz gerekiyor.""
 learning_scholarship_special.2012.a:0 "Bunu çözmeme yardım et [realm_priest.GetFirstNameNoTooltip]!"
 learning_scholarship_special.2012.a.success:0 "[realm_priest.GetShortUINameNoTooltip] çözümü buldu"
 learning_scholarship_special.2012.a.failure:0 "[realm_priest.GetShortUINameNoTooltip] çözümü bulamadı"
 learning_scholarship_special.2012.b:0 "Oyunlara vaktim yok. Neyi aramam gerektiğini söyle yeter."
 learning_scholarship_special.2012.c:0 "Göstermek ister misin, eski dostum?"
 learning_scholarship_special.2012.c.friendship_tooltip:0 "[realm_priest.GetFirstNameNoTooltip] ile olan arkadaşlığınız sayesinde bu seçeneği seçebiliyorsunuz"
 learning_scholarship_special.2013.desc:0 "[ROOT.Char.Custom('TranslationBook')|U] çevirim ile ilgili notlar alırken aklıma aniden bir şey geldi. "Kâtipler! Hemen yazın şunu...""
### TODO AGOT-ONLY: learning_scholarship_special.2013.a [AGOT: ]
 learning_scholarship_special.2013.a:0 ""Unlike [ROOT.Char.GetFaith.ReligiousText], this work posits that...""
### TODO AGOT-ONLY: learning_scholarship_special.2013.b [AGOT: ]
 learning_scholarship_special.2013.b:0 ""As evident from the will of [ROOT.Char.GetFaith.HighGodName]...""
 learning_scholarship_special.2014.desc:0 "[ROOT.Char.Custom('TranslationBook')|U] çevirim ile ilgili notlar alırken...\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]? Lütfen beni bağışlayın, ama... uyuya mı kaldınız?!"\n\nBıktım bu işlerden artık, klasik eserler tam bir işkence!"
 learning_scholarship_special.2014.a:0 "Yine de, zorla da olsa bitireceğim!"
 learning_scholarship_special.2014.b:0 "Katiplerimin biraz sorumluluk alma zamanı geldi..."
 learning_scholarship_special.2014.c:0 "Bütün bunlara biraz ara verip dinlenmem gerek."
 learning_scholarship_special.2015.desc:0 "Kendimi mumun çelimsiz ışığı eşliğinde [ROOT.Char.Custom('TranslationBook')|U] çevirisi ile saatler boyunca uğraşırken buluyorum. Çeviri yaparken zamanın nasıl geçtiğini anlamak mümkün değil! Kâtibim bana hatırlatıyor;\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], neredeyse sabah olmak üzere, artık biraz dinlenseniz?""
### TODO AGOT-ONLY: learning_scholarship_special.2015.a [AGOT: ]
 learning_scholarship_special.2015.a:0 ""No, we have to keep going until I feel done!""
### TODO AGOT-ONLY: learning_scholarship_special.2015.b [AGOT: ]
 learning_scholarship_special.2015.b:0 ""Yes, some sleep will do us all good.""
### TODO AGOT-ONLY: learning_scholarship_special.2015.c [AGOT: ]
 learning_scholarship_special.2015.c:0 ""You can all keep working while I rest.""
 learning_scholarship_special.2016.desc:0 "Kâtiplerimden biri [ROOT.Char.Custom('TranslationBook')|U] çevirimde bana sormadan birtakım düzenlemeler yapmış!\n\n"Sadece çevirinin olabildiğince iyi olmasını istedim! Yaptıklarımı kendi işiniz sanarken gayet mutluydunuz!""
 learning_scholarship_special.2016.a:0 "Bir daha asla katiplik yapmayacaksın, ne benim ne de başkasının yanında!"
 learning_scholarship_special.2016.b:0 "Asıl sana yapacaklarımdan sonraki mutluluğumu gör!"
### TODO AGOT-ONLY: learning_scholarship_special.2016.b.flavor [AGOT: ]
 learning_scholarship_special.2016.b.flavor:0 ""The rest of you scribes better take a lesson from this!""
 learning_scholarship_special.2016.c:0 "Aslında... hiç de fena olmamış."
 learning_scholarship_special.2017.desc:0 "Sürekli [ROOT.Char.Custom('TranslationBook')|U] çevirisi ile uğraşmak gerçekten çok yorucu. Sürekli odaklanmak, metinleri anlamak ve yaratıcılık kullanarak kendi dilimize aktarmaya çalışmak beni tüketiyor."
 learning_scholarship_special.2017.a:0 "Şimdi bu gece birkaç sayfa yapsam sabah da birazcık çevirsem..."
 learning_scholarship_special.2017.b:0 "Bu iş bitene kadar kendimi diğer tüm dikkat dağıtıcı şeylerden soyutlamalıyım."
 learning_scholarship_special.2017.c:0 "Bu çeviri işi biraz bekleyebilir."
 learning_scholarship_special.2097.t:0 "Mükemmel Bir Çeviri"
 learning_scholarship_special.2097.opening:0 "[ROOT.Char.Custom('TranslationBook')|U] çevirim nihayet bitti. Özenle çevirdiğim kelimelerim güzel yaldız ve resimlerle süslenmiş bir şekilde sayfanın yüzünde çok zarif duruyorlar, bütün sayfalar çevirinin önemine binaen güzel bir kapak ile korunuyor. "
 learning_scholarship_special.2097.conclusion:0 "\n\nBu eser kitaplığımda hak ettiği değeri görüyor. Onu okuyan her [ROOT.Char.GetFaith.PriestNeuter] yaptığım iş ve verdiğim emeği saygıyla takdir ediyor. Bazıları çoktan çevirinin kendileri için bir kopyasını yapmak için benden izin istemeye başladı."
 learning_scholarship_special.2097.a:0 "Bu çeviri bana çok şey öğretti."
 learning_scholarship_special.2098.t:0 "Çevirim Tamamlandı"
 learning_scholarship_special.2098.opening:0 "Sonunda [ROOT.Char.Custom('TranslationBook')|U] kitabının çevirisini bitirdim. Özenle çevirdiğim kelimelerim güzel yaldız ve resimlerle süslendi bu da pek emin olmadığım kısımlardan dikkatleri uzaklaştırıyor."
 learning_scholarship_special.2098.conclusion:0 "\n\nBazı yerleri anlamak hâlâ zor ama çevirinin hayâti bir ihtiyacı karşıladığı su götürmez bir gerçek. [ROOT.Char.GetFaith.DevoteeNeuterPlural] çokca okunduğu kitaplığımda sabırsız bir şekilde kitabımın ilk kopyasını yapmak isteyecek birilerini bekliyorum."
 learning_scholarship_special.2098.a:0 "Bu çeviriden birçok şey öğrendim!"
 learning_scholarship_special.3001.t:0 "Kurşundan Altına"
 learning_scholarship_special.3001.desc_opening:0 "Simyacıların kurşunu altına dönüştürme hayali neredeyse tarih kadar eskidir. Yüzyıllar boyunca pek çoğu bu büyük hayali gerçek yapmaya çalıştı ama hiçbiri başaramadı.\n\n"
 learning_scholarship_special.3001.desc_alchemist:0 "Buna rağmen [alchemist.Custom2('MyCharacterIntroduction', ROOT.Char)], bitkiler hakkında yazılmış bir kitabın köşelerinde çok ilginç notlara rastladığı söylüyor. Bu notlara göre kurşun asetatı filtreden geçmiş bir yosun külü çözeltisinde kaynatırsan altın elde edebilirmişsin."
 learning_scholarship_special.3001.desc:1 "Buna rağmen bitkiler hakkında yazılmış bir kitabın köşelerinde çok ilginç notlara rastladım. Bu notlara göre kurşun asetatı filtreden geçmiş bir yosun külü çözeltisinde kaynatırsan altın elde edebilirmişsin.\n\n"
 learning_scholarship_special.3001.desc_ending:0 "\n\nAcaba bu gerçek olabilir mi?"
 learning_scholarship_special.3001.a:0 "Hiç değilse araştırmaya değer..."
 learning_scholarship_special.3001.b:0 "Bu metinler eşek şakasından başka bir şey olamaz."
 learning_scholarship_special.3001.c:0 "Böyle bir zenginlik arayışı dinimizce yasaktır!"
 learning_scholarship_special.3001.d:0 "Büyücü hurafelerinin beni baştan çıkarmasına izin vermeyeceğim!"
 learning_scholarship_special.3002.desc_alchemist:0 "Gereken ilk malzeme kurşun asetat, şarapları tatlandırmak için kullanılan bir malzeme.\n\nİhtiyacımız olanları getirmesi için bir tedarikçi ile anlaşabiliriz ama biraz pahalıya patlayabilir. Ya da metal kurşunu yakıp küllerini sirke içinde çözerek kendim ucuza mal edebiliriz..."
 learning_scholarship_special.3002.desc:0 "Gereken ilk malzeme kurşun asetat, şarapları tatlandırmak için kullanılan bir malzeme.\n\nİhtiyacım olanları getirmesi için bir tedarikçi ile anlaşabilirim ama biraz pahalıya patlayabilir. Ya da metal kurşunu yakıp küllerini sirke içinde çözerek kendim ucuza mal edebilirim..."
 learning_scholarship_special.3002.a:0 "Para kazanmak için önce para harcamak gerek!"
 learning_scholarship_special.3002.b:0 "Tüm işi başkaları yaparken nasıl bir şeyler öğrenebilirim!?"
 learning_scholarship_special.3002.b_alchemist:0 "Tüm işi başkaları yaparsa biz nasıl bir şeyler öğreneceğiz?"
 learning_scholarship_special.3002.a.success:1 "Kurşun asetatı sıkıntı çıkmadan üretmeyi başardım"
 learning_scholarship_special.3002.a.failure:1 "Kurşunun buharları başımı ağrıtmaya başladı"
 learning_scholarship_special.3002.tt:1 "Kurşun asetatı elde ettim"
 learning_scholarship_special.3002.c:0 "Tekrar düşününce galiba yapmasam daha iyi..."
 learning_scholarship_special.3003.desc_alchemist:0 "İhtiyacımız olan ikinci malzeme deniz yosunu. Kilolarca, parçalanıp kurutulmuş deniz yosununa ihtiyacımız var. Bu kadar çok deniz yosununu nereden bulabiliriz?"
 learning_scholarship_special.3003.desc:0 "İkinci gerekli malzeme deniz yosunu. Kilolarca, parçalanıp kurutulmuş deniz yosununa ihtiyacım var. Bu kadar çok deniz yosununu nereden bulabilirim?"
 learning_scholarship_special.3003.a:0 "Çeşitli sahil kasabalarından satın alalım."
 learning_scholarship_special.3003.b:0 "Deniz yosunu vergisi çıkaralım!"
 learning_scholarship_special.3003.c:0 "Deniz yosunu yerine kurşun da olur herhâlde..."
 learning_scholarship_special.3003.tt:1 "Deniz yosununu elde ettim"
 learning_scholarship_special.3004.desc_alchemist:0 "Nihayet altın yapmak için gerekli olan tüm malzemelere sahibiz!\n\nKurşun asetat su geçirmez fıçılarda güvenli bir şekilde depolanmışken kilolarca kurutulmuş deniz yosunu fırında pişirme işlemi için hazır bekliyor.\n\nBu bizim başyapıtımız mı olacak?"
 learning_scholarship_special.3004.desc:0 "Nihayet altın yapmak için gerekli olan tüm malzemelere sahibim!\n\nKurşun asetat su geçirmez fıçılarda güvenli bir şekilde depolanmışken kilolarca kurutulmuş deniz yosunu fırında pişirme işlemi için hazır bekliyor.\n\nBu benim başyapıtım mı olacak?"
 learning_scholarship_special.3004.a:0 "Neyi bekliyoruz o zaman!"
 learning_scholarship_special.3004.a.success:1 "Altın üretmeyi başardım!"
 learning_scholarship_special.3004.a.success.tt:1 "Zenginlik, şan, şöhret, hepsi benim olacak!"
 learning_scholarship_special.3004.a.failure:0 "Formül işe yaramadı"
 learning_scholarship_special.3004.a.failure.tt:1 "Altın yaratmadığım kesin, peki yerine ne yarattım?"
 learning_scholarship_special.3004.b:0 "...Ne yapıyorum ben yahu? Bu deneyin hiçbir mantıklı tarafı yok."
 learning_scholarship_special.3005.desc_alchemist:0 "Karışıma kurşun asetatı ekledik ve karışımın rengi birden altın sarısına döndü! Kaynadıktan sonra rengi berraklaşınca bir an endişelendik ama soğuduktan sonra şişede küçük altın renkli kristaller oluştuğunu gördük.\n\nBiraz karışımı inceledikten sonra açıkça belli ki ortaya çıkan şey gerçek altın değil, zira altın olmak için fazla şeffaf. Ama bu reaksiyonun altın yaratmak için gerekli 12 hayati süreçten biri olması gayet mümkün!"
 learning_scholarship_special.3005.desc:0 "Karışıma kurşun asetatı ekledim ve karışımın rengi birden altın sarısına döndü! Kaynadıktan sonra rengi berraklaşınca bir an endişelendim ama soğuduktan sonra şişede küçük altın renkli kristaller oluştuğunu gördüm.\n\nBiraz karışımı inceledikten sonra açıkça belli ki ortaya çıkan şey gerçek altın değil, zira altın olmak için fazla şeffaf. Ama bu reaksiyonun altın yaratmak için gerekli 12 hayati süreçten biri olması gayet mümkün!"
 learning_scholarship_special.3005.a:0 "Gerçekten altın üretmeye yaklaştım mı yoksa?"
 learning_scholarship_special.3005.a_alchemist:0 "Gerçekten altın üretmeye yaklaştık mı yoksa?"
 learning_scholarship_special.3006.desc_alchemist:0 "Kurşun asetatı kaynatılmış deniz yosunu külü ile karıştırdık ve karışımın rengi birden altın sarısına döndü!\n\nOrtaya çıkan şey gerçek altın değil ama safranla boy ölçüşebilecek bir boya maddesi! Bu boyayı satmak hiç değilse harcamalarımızın bir kısmını karşılayabilir."
 learning_scholarship_special.3006.desc:0 "Kurşun asetatı kaynatılmış deniz yosunu külü ile karıştırdım ve karışımın rengi birden altın sarısına döndü!\n\nOrtaya çıkan şey gerçek altın değil ama safranla boy ölçüşebilecek bir boya maddesi! Bu boyayı satmak hiç değilse harcamalarımın bir kısmını karşılayabilir."
 learning_scholarship_special.3006.a:0 "Üretmesi pek kârlı değil ama güzel bir renk."
 learning_scholarship_special.3007.desc_alchemist:0 "Deniz yosunu yakıp su ile karıştırdıktan sonra oldukça yüksek miktarda kahverengi çamurumsu bir madde elde ettik. Bu noktadan sonra ne yapmamız gerektiğinden emin değiliz, karışıma biraz kurşun asetat eklesek de herhangi bir değişiklik olmadı.\n\nBu karışımı olsa olsa bahçeme gübre diye dökerim artık."
 learning_scholarship_special.3007.desc:0 "Deniz yosunu yakıp su ile karıştırdıktan sonra oldukça yüksek miktarda kahverengi çamurumsu bir maddeyle baş başa kaldım. Bu noktadan sonra ne yapmam gerektiğinden emin değildim ve karışıma biraz kurşun asetat ekledim ama herhangi bir değişiklik olmadı.\n\nBu karışımı olsa olsa bahçeme gübre diye dökerim artık."
 learning_scholarship_special.3007.a:0 "Sanırım bu yıl mahsullerden iyi verim alacağız?"
 learning_scholarship_special.3099.termination.toast:0 "Dönüşüm bozuldu"
 learning_scholarship_special.3099.termination.desc.prison:0 "Deneylerime zindanda devam edemem."
 learning_scholarship_special.3099.termination.desc.incapable:0 "Bu yetersiz hâlim ile deneylerime devam edemem."
 learning_scholarship.4000.t:1 "Dışarı Çık!"
 learning_scholarship.4000.desc:0 "Havanın kararmasıyla birlikte klasik dil bilgisi üzerine yazılmış yapıtlardan birini okumak üzere [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'çadırıma', 'odama')] çekiliyorum. Benden önce kitabı okuyan bir kişi tarafından bırakılmış notları okuyup gülerken bir anda eşim [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'çadıra', 'odaya')] giriyor.\n\n"Kepaze [Select_CString( ROOT.Char.IsFemale, 'kadın', 'herif' )]! Sabahtan akşama kadar kitap okumak dışında bir şey yaptığın yok! Ya kafanı o tozlu parşömenlerden kaldır ya da bu gece kendine uyuyacak başka bir yer bul!""
 learning_scholarship.4000.a:0 "Sen nasıl istersen [Select_CString( spouse_uninterested_in_study.IsFemale, 'karıcığım', 'kocacığım' )]."
 learning_scholarship.4000.b:0 "Belki birlikte okuyabiliriz?"
 learning_scholarship.4000.c:0 "[child_educated.GetFirstNameNoTooltip] için dersler hazırlamam gerekiyor, o yüzden bu kadar uzun çalışıyorum."
 learning_scholarship.4000.c.tt:0 "[spouse_uninterested_in_study.GetFirstName], [child_educated.GetFirstNameNoTooltip] adlı kişinin [Select_CString(spouse_uninterested_in_study.IsFemale, 'annesi', 'babası' )] değil."
 learning_scholarship.4000.d:0 "Seninle yatmaya ihtiyacım yok. Bilginin kucağı yeter bana!"
 bibliomancy_chain_header:0 "Kutsal Metin:"
 learning_scholarship.5000.t:0 "Kutsal Bir Metin"
 learning_scholarship.5000.desc:0 "Pazarda öylesine dolaşırken bir tüccar bana seslenerek ilgimi çekeceğini düşündüğü bir şeye sahip olduğunu söylüyor.\n\nTezgâha yaklaştıkça kurumuş bitki ve yabancı tütsülerin kokusunun ağırlaştığını hissediyorum. Tüccar tozlu tomarlar ve kitaplar arasına gömülmüş durumda, bir şey arıyor.\n\nBir süre uğraştıktan sonra "Aha" sesi çıkarttığını duyuyorum, eski görünen bir kitabı alıp bana uzatıyor ve kitaba "yakın zamanda" ihtiyaç duyacağımı söylüyor."
 learning_scholarship.5000.a:0 "Hadi bakalım, dediğin gibi olsun."
 learning_scholarship.5000.b:0 "Belki makul bir anlaşma yapabiliriz."
 learning_scholarship.5000.c:0 "Sadece ihtiyacım olanları almaya geldim."
 learning_scholarship.5000.d:0 "Kitapların benim ne işime yarayacak?"
 learning_scholarship.5000.b.success:0 "Pazarlık yaparak ücreti indirdiniz"
 learning_scholarship.5000.b.failure:0 "Ücreti indirmek için yaptığınız pazarlık başarısız oldu"
 bibliomancy_book_purchased:0 "Bir kitap [Concept( 'artifact', 'Esere' )|E] sahip olacaksınız"
 learning_scholarship_sacred_artifact_obtained:0 "Kutsal bir metin elde ettiniz"
 learning_scholarship.5001.t:0 "$bibliomancy_chain_header$ Kehanet"
 learning_scholarship.5001.desc:0 "Yeni edindiğim [sacred_text.GetName] adlı kitabı kütüphaneme koyarken, arasından bir kağıt parçasının yere düştüğünü fark ediyorum. Kağıdın üstünde kitaplara bakarak kehanetlerde bulunmaya yönelik çeşitli bilgiler yer alıyor.\n\nYapmam gereken tek şey rastgele bir şekilde kitabı açmak ve açılan sayfadaki ilk cümleyi okumak."
 learning_scholarship.5001.a:0 "Denemesem olmaz."
 learning_scholarship.5001.b:0 "Bu sapkın düşüncelere itibar edemem."
 learning_scholarship.5002.t:0 "$bibliomancy_chain_header$ Geleceğe Dair"
 learning_scholarship.5002.desc:0 "Kağıdın üstündeki talimatları takip edip, gözlerimi kapatıp rastgele bir şekilde kitabı açıyorum. Gözlerimi açtığımda karşımda şu cümle yer alıyor.\n\n#EMP Asıl ölüm korkunun kendisidir. Korkak biri hayatı boyunca binlerce kez ölür, cesur bir adam ise sadece bir kez.#!\n\nBundan ne çıkarmalıyım?"
 learning_scholarship.5002.a:0 "Korku, asıl yok oluşu beraberinde getiren küçük bir ölümdür."
 learning_scholarship.5002.b:0 "İlginç. Biraz daha araştırmalıyım."
 learning_scholarship.5002.b.success:0 "Cümlenin asıl anlamını keşfediyorum"
 learning_scholarship.5002.b.failure:0 "Cümlenin asıl anlamını kavrayamıyorum"
 learning_scholarship.5002.c:0 "Saçmalamışlar resmen!"
 learning_scholarship.5002.c.tt:0 "Cümleyi görmezden geleceksiniz"
 learning_scholarship.5002.d:0 "$antiquarian_court_position$ [antiquarian.GetTitledFirstNameNoTooltip], bir bakıversin."
 learning_scholarship.5003.t:0 "$bibliomancy_chain_header$ Kehanet"
 learning_scholarship.5003.desc:0 "Vasalım [bibliomancy_antagonist.GetName] bir süredir benim liderlik vasfıma dair şüphelere sahipti. Vekilharcım son zamanlarda bu şüphelerini daha sert bir dille dile getirdiğini bildiriyor. Kendisi diğer vasallarım üzerinde de nüfuz sahibi ve istemesi hâlinde hayatımı cehenneme dönüştürebilir.\n\nAcaba [sacred_text.GetName] sayfalarındaki o cümle buna mı atıfta bulunuyordu? Ne demişti? Asıl ölüm korkunun kendisidir..."
 learning_scholarship.5003.a:0 "Korkularımla yüzleşmemin vakti geldi."
 learning_scholarship.5003.a.tt:0 "[bibliomancy_antagonist.GetName] ile halka açık bir yerde yüzleşeceğim."
 learning_scholarship.5003.b:0 "İnce bir yaklaşım benimsemeliyim."
 learning_scholarship.5003.b.tt:0 "[bibliomancy_antagonist.GetName] ile resmî bir şekilde görüşeceğim."
 learning_scholarship.5003.c:0 "Bu meseleyi sonra konuşalım."
 learning_scholarship.5003.vassal.tt:0 "Tüm vasallar"
 learning_scholarship.5003.a.success:0 "Vasalınıza karşı tartışmayı kazanacaksınız"
 learning_scholarship.5003.a.failure:0 "Vasalınıza karşı tartışmayı kaybedeceksiniz"
 learning_scholarship.5003.b.success:0 "Vasalınızı mutlu etmede başarılı olacaksınız"
 learning_scholarship.5003.b.failure:0 "Vasalınızı mutlu etmede başarısız olacaksınız"
 learning_scholarship.5004.t:0 "$bibliomancy_chain_header$ Anlam Karmaşası"
 learning_scholarship.5004.desc:0 "Ne yaparsam yapayım, bir türlü [sacred_text.GetName] sayfalarındaki denk geldiğim o cümleyi kavrayamıyorum.\n\nAsıl ölüm korkunun kendisidir... Neyi kastediyor olabilir? Neyden korkmalıyım? #EMP Fark etmediğim bir şey mi var#!?\n\nBelki de bu konuda başkasına danışmalıyım."
### TODO AGOT-CHANGED: learning_scholarship.5004.a [AGOT: [court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNicknamedNoTooltip] will know the answer. | TR: [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstNameNoTooltip] yardımcı olacaktır.]
 learning_scholarship.5004.a:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNicknamedNoTooltip] will know the answer."
### TODO AGOT-CHANGED: learning_scholarship.5004.b [AGOT: My courtier [target_courtier.GetTitledFirstNameNoTooltip] will help me. | TR: [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Takipçim', 'Saray mensubum')] [target_courtier.GetTitledFirstNameNoTooltip] işini bilir.]
 learning_scholarship.5004.b:0 "My courtier [target_courtier.GetTitledFirstNameNoTooltip] will help me."
 learning_scholarship.5004.c:0 "Vazgeçme vakti geldi."
### TODO AGOT-CHANGED: learning_scholarship.5004.a.success [AGOT: [court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNicknamedNoTooltip] clarifies the passage | TR: [court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] cümleyi açıklıyor]
