 learning_scholarship.5004.b.success:0 "[target_courtier.GetFirstNameNoTooltip] cümleyi açıklıyor"
 learning_scholarship.5004.b.failure:0 "[target_courtier.GetFirstNameNoTooltip] cümleyi anlamıyor"
 learning_scholarship.5005.t:0 "$bibliomancy_chain_header$ Korkusuz"
 learning_scholarship.5005.desc:0 "Nihayet [sacred_text.GetName] sayfalarındaki o cümleyi kavramayı başardım ve artık kendimi çok daha bilge hissediyorum. O tüccar sayesinde, kaderin ipleri çok daha berrak bir şekilde anlaşılır hâle geldi.\n\nAsıl ölüm korkunun kendisi olabilir ama ben korkularımla yüzleşmeyi başardım."
 learning_scholarship.5005.a:0 "Korkusuz olan bir kez ölür."
 learning_scholarship.5006.t:0 "$bibliomancy_chain_header$ Paranoya"
 learning_scholarship.5006.desc:0 "Bu ne idüğü belirsiz, belli ki anlaşılmaması için yazılmış cümleye günlerce kafa yorduktan sonra nihayet vazgeçtim. Cümlenin anlamına dair en ufak bir fikrim yok ve tüm bu olay inanılmaz derecede canımı sıkmış durumda.\n\nBaşıma bir şey mi gelecek? Bir şeyden korkmam mı gerekiyor? #EMP Bundan böyle#!? korku içerisinde mi yaşamalıyım?"
 learning_scholarship.5006.a:0 "Korku, asıl yok oluşu beraberinde getiren küçük bir ölümdür."
 learning_scholarship_paranoid_trait.tt:0 "[sacred_text.GetName] sayfalarındaki cümleyi kavrayamadığınız için bu özelliği edindiniz"
 learning_scholarship_paranoid_trait_possible:0 "[GetTrait('paranoid').GetName( GetNullCharacter )] [Concept( 'trait', 'Özelliğini' )|E] edinebilirsiniz"
 learning_scholarship.6000.t:0 "Eğitimsiz Kişi"
 learning_scholarship.6000.desc:0 "Görünüşe göre [teacher.Custom2('HerHisCharacterIntroduction',illiterate)] her şeyi denemesine rağmen, [illiterate.GetName] hâlâ köyün delisinden daha bilgili değil.\n\n"Bilge ve aydın [ROOT.Char.GetTitleTierName]," diyor [teacher.GetFirstNameNoTooltip] ve ekliyor: "Süzerenimi daha fazla okumaya nasıl teşvik edebilirim?""
 learning_scholarship.6000.willing_pupil:0 "\n\nBıkkınca iç çekiyor.\n\n"[illiterate.GetTitleAsNameNoTooltip] okumaya değil saatlerini, dakikalarını bile ayırmak istemiyor...""
 learning_scholarship.6000.holy_book_insult:0 "\n\nUfak bir tereddütten sonra kısık sesle devam ediyor:\n\n"[illiterate.GetTitleAsNameNoTooltip] [illiterate.GetFaith.ReligiousText] okurken, daha doğrusu o kutsal satırların ilk birkaçından anlam çıkarmaya çalıştıktan sonra söyledikleri ne kutsal ne de aydınca cümlelerdi...""
 learning_scholarship.6000.poetry_insult:0 "\n\nYüzünü buruşturarak devam ediyor:\n\n"[illiterate.GetTitledFirstNameNoTooltip] ona verdiğim zarif bir [illiterate.GetCulture.GetNameNoTooltip] şiirini okurken... , daha doğrusu ilk birkaç dizeden anlam çıkarmaya çalışırken söyledikleri... inanın bana, söyledikleri kesinlikle zarif değildi.""
 learning_scholarship.6000.very_willing_pupil:0 "\n\nBenim bilgeliğime atıf yaparak:\n\n"[illiterate.GetTitleTierName] okumayı beceremeyeceğinden ve sizin gibi bir bilgeliğe asla ulaşamamaktan korkuyor.""
 learning_scholarship.6000.a:0 "[illiterate.GetCouncilTitle] uzaklardaki insanların yaşamına ilişkin bir kitap okumalı."
 learning_scholarship.6000.b:0 "[illiterate.GetCouncilTitle] saray dedikodularıyla dolu bir kronoloji kitabı okumalı."
 learning_scholarship.6000.c:0 "[illiterate.GetCouncilTitle] savaşçı hikâyeleri okumalı."
 learning_scholarship.6000.d:0 "[illiterate.GetCouncilTitle] adalet üzerine bir tez okumalı."
 learning_scholarship.6000.e:0 "[illiterate.GetCouncilTitle] maneviyatı öven bir kaside okumalı."
 learning_scholarship.6000.f:0 "[ROOT.Char.GetTitleTierName] tarafından gönderilen metni okuyacak."
 learning_scholarship.6000.f.tt:0 "Yönetmekten kaytarmak için güzel bahane!"
 learning_scholarship.6000.f.success:0 "Yazdıklarınız oldukça eğiticiydi"
 learning_scholarship.6000.f.failure:0 "Vasalınız amaçsız ve sıkıcı yazınızla dalga geçiyor"
 learning_scholarship.6000.g:0 "[illiterate.GetTitleAsNameNoTooltip], çok meşgul bir insan olduğundan böyle şeylere vakit ayıramaz."
 learning_scholarship.6000.g.tt:0 "O bir eylem insanı — bırakın okumayı diğerleri yapsın!"
 learning_scholarship.6000.h:0 "Küfür mü? Biraz daha anlat..."
 learning_scholarship.6000.h.tt:0 "[illiterate.GetTitleAsNameNoTooltip] tarafından söylenen sözlerin #EMP küfür#! gibi algılanmasını sağlayabilirsin"
 learning_scholarship.6000.non_believer:0 "[illiterate.GetTitledFirstName] kişisinin İnançsız olduğunu gösteren delil elde ediyorsunuz"
 learning_scholarship.6000.i:0 "Ona ilham vermek için bolca [illiterate.GetCulture.GetNameNoTooltip] şiiri okuyacağım."
 learning_scholarship.6000.i.tt:0 "Sarayınızda [illiterate.GetCulture.GetNameNoTooltip] şiirleri sıklıkla okunacak"
 learning_scholarship.6000.j:1 "Bilgelik her kelimenin içindeki mucizeleri görmektir..."
 learning_scholarship.6000.j.tt:1 "...her kelimeyi okumak istemektense."
 learning_scholarship.6000.k:0 "Bu budala hiçbir şey öğrenemez!"
 learning_scholarship.6000.k.tt:0 "Bir keçiye astronomi anlatsan daha başarılı olursun!"
 high_learning_custom:1 "[GetTrait('compassionate').GetName( GetNullCharacter )] olmayan ve yüksek [learning|E] becerisine sahip tüm vasallar"
