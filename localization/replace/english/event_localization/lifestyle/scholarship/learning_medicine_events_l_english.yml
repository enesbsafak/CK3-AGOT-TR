l_english:
 learning_medicine.2001.t:0 "Doğanın Sırları"
 learning_medicine.2001.pool.desc:0 "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bana bir mektup gönderdi. Kendisinin tecrübeli bir şifacı olduğunu ve bildiklerini ona kalacak bir yer sağlamam karşılığında benimle paylaşabileceğini söylüyor."
 learning_medicine.2001.no_pool.desc:0 "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] yetenekli bir şifacı, yararlı ve zararlı bitkiler hakkında bilgi sahibi. Bilgilerini benimle paylaşmak için de oldukça ısrarcı."
 learning_medicine.2001.chaplain_hates_herbs.desc:1 "\n\nTeklif oldukça ilgi çekici ama biliyorum ki, [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] tılsım ve iksirlerden hiç haz etmez. Ona göre [ROOT.Char.GetFaith.DevilName] bunları kendi kötü emelleri için kullanıyor... "
 learning_medicine.2001.a:0 "Yeni şeyler öğrenmeye her zaman istekliyim."
 learning_medicine.2001.b:0 "[flower_receiver.GetFirstNameNoTooltip] kendine gönderdiğim bu nadir çiçeğe bayılacaktır."
 learning_medicine.2001.c:0 "Kutsal bitkileri ekeceği bir bahçe düzenleyebilir."
 learning_medicine.2001.d:1 "Toz toprak ile uğraşacak zamanım yok."
 learning_medicine.2001.d.chaplain_hates_herbs:0 "Bu konuda [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetNameNoTooltip] ne karar verirse ona saygı duyacağım."
 learning_medicine.2002.start.desc:0 "[herbalist.GetFirstName] ile bir geceyi daha bitkiler ve iksirler üzerine çalışarak geçiriyoruz. Onun eski püskü kitabının sayfalarında dolaşırken bir paragrafa rastlıyorum ki"
 learning_medicine.2002.chaplain_hates_herbs.desc:0 "[chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] görse küplere biner!"
 learning_medicine.2002.not_witchcraft_accepted.desc:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')] görseler küplere binerler!"
 learning_medicine.2002.witchcraft_accepted.desc:0 "Çok ilgi çekici bir tarif. Otların böyle güçleri olduğunu hiç bilmezdim..."
 learning_medicine.2002.a:0 "Bu gizli bilginin derinine inmeliyim!"
 learning_medicine.2002.a.success.t:0 "[herbalist.GetFirstNameNoTooltip] bir cadı"
 learning_medicine.2002.a.failure.t:0 "[herbalist.GetFirstNameNoTooltip], neyi ima ettiğimi anlayınca dehşete düştü."
 learning_medicine.2002.b:0 "Eğer bir şeyler gizliyorsa ne olduğunu öğreneceğim."
 learning_medicine.2002.b.success.t:0 "[herbalist.GetFirstNameNoTooltip] hakkındaki gerçekleri öğrendim"
 learning_medicine.2002.b.success.tt:0 "[herbalist.GetShortUIName] eğer cadıysa bu gerçeği ortaya çıkaracağım"
 learning_medicine.2002.b.success.witch.t:0 "[herbalist.GetFirstNameNoTooltip] bir cadı"
 learning_medicine.2002.b.success.no_witch.t:0 "[herbalist.GetFirstNameNoTooltip] cadı değil"
 learning_medicine.2002.b.success.no_witch.desc:1 "Kesinlikle eminim, [herbalist.GetTitledFirstName] masum"
 learning_medicine.2002.b.inconclusive.t:0 "Soruşturmalarım sonuçsuz kaldı"
 learning_medicine.2002.b.inconclusive.desc:0 "Cadılıkla ilgili hiçbir ize rastlamadım"
 learning_medicine.2002.b.failure.t:0 "[herbalist.GetFirstNameNoTooltip] beni kendisini gözetlerken yakaladı"
 learning_medicine.2002.c:0 "Efsaneler ve kulaktan dolma bilgiler ile dikkatimin dağılmasına izin vermeyeceğim."

 learning_medicine.2003.desc:0 ""Öğrenmek istediğim şey bu," diyorum [herbalist.GetFirstName]'e cildi uzatırken. "Bana öğretir misin?"\n\n[herbalist.GetSheHe|U] bana uzun ve sert bir bakış atıyor. "Gerçekten hazır mısın, [ROOT.Char.GetFirstNameNoTooltip]? [herbalist.GetFaith.WitchGodName]'in kutsaması karşılığında [herbalist.GetFaith.WitchGodHerHis|U] kendini [herbalist.GetFaith.WitchGodName]'e adayacak mısın?""
 learning_medicine.2003.a:0 "Daha çok arzuladığım hiçbir şey yok."
 learning_medicine.2010.t:0 "Sıkıntılı Çeviri"
 learning_medicine.2010.start.desc:0 "Kapının eşiğine doğru ilerlerken [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('court_physician'))] [court_physician.GetFirstName] ile karşılaştım. Kendisi odasında okuduğu kitaba gömülmüş bir hâldeydi.\n\n"Şu"

 learning_medicine.2010.galen.desc:0 "Galen'in"

 learning_medicine.2010.hippocrates.desc:0 "Hipokrat'ın"

 learning_medicine.2010.herophilus.desc:0 "Herofil'in"

 learning_medicine.2010.hildegard.desc:0 "Bingenli Hildegard'ın"

 learning_medicine.2010.mundinus.desc:0 "Mundinus'un"

 learning_medicine.2010.avicenna.desc:0 "İbn-i Sina'nın"

 learning_medicine.2010.trota.desc:0 "Salernolu Trota'nın"
 learning_medicine.2010.sun_simiao.desc: "Sun Simiao'nın"
 learning_medicine.2010.zhan_zhongjing.desc: "Zhang Zhongjing'in"
 learning_medicine.2010.hua_tuo.desc: "Hua Tuo'nun"
 learning_medicine.2010.tamba_yasuyori.desc: "Tamba Yasuyori'nin"
 learning_medicine.2010.bianque.desc: "[Glossary( 'Bian Que', 'BIAN_QUE_GLOSS' )]'nin"
 learning_medicine.2010.fallback.desc:0 "Bir otopsi raporunun"
 learning_medicine.2010.end.desc:0 "çevirisi de çok kötü olmuş," dedi yakınarak. "Eğer bu talimatlara uysaydım tedavi ettiğim hasta kadarını da öldürürdüm.""
 learning_medicine.2010.a:0 "Bir bakayım..."
 learning_medicine.2010.a.success.desc:0 "Ona çeviride yardımcı olacağım."
 learning_medicine.2010.a.failure.desc:0 "Kendimi aptal durumuna düşürüyorum."
 learning_medicine.2010.b:0 "Sana daha iyi bir çevirisini alacağım."
 learning_medicine.2010.c:0 "[ROOT.Char.GetFaith.ReligiousText|U] iyi bir kaynak olabilir."
 learning_medicine.2021.t:0 "[ROOT.Char.Custom('FormalComplimentAdjective')|U] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 learning_medicine.2021.desc:0 "Benim adım [physician.GetTitledFirstNameNoTooltip] ve doğurganlık sorunları konusunda uzman biriyim.\n\nBelki size ve eşinize yardımcı olabilirim. Tabii cüzi bir ücret karşılığında."
 learning_medicine.2021.a:0 "Belki işime yarayabilirsin..."
 learning_medicine.2021.a.tt:0 "Doğurganlık tedavisini kabul edeceksiniz."
 learning_medicine.2021.b:0 "Becerikli hekimlere kapımız her zaman açıktır."
 learning_medicine.2021.b.tt:0 "Doğurganlık tedavisini reddedeceksiniz."
 learning_medicine.2021.c:0 "Benim böyle #EMP sıkıntılarım#! yok!"
 learning_medicine.2022.t:0 "Doğurganlık Sıkıntıları"
 learning_medicine.2022.old_physician.desc:0 "[physician.GetTitledFirstName], sülüklerden çürüyen bedenlere kadar birçok şeyle ilgilenmiş deneyimli bir hekim fakat kendisini ilk defa bu kadar endişeli görüyorum.\n\n"Hekiminiz olarak sağlığınızla ilgilenmek benim görevim" dedi, gözlerini kaçırarak. "Buna #EMP üreme sağlığınız da#! dâhil. Dilerseniz size ve eşinize yardımcı olacak bir ilaç hazırlayabilirim. Ayrıca umut veren bazı deneysel tedaviler hakkında da bir şeyler okumuştum.""
 learning_medicine.2022.new_physician.desc:0 "Yeni hekimime yerleşmesi için biraz süre tanımaya karar vermiştim ama birkaç saat sonra [physician.GetFirstName] büyük bir kutuyu sürükleyerek birden odama daldı ve elindeki kutuyu #EMP çat#! diye masamın üstüne koydu.\n\n"Siz ve eşinizin birkaç seçeneği var [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Elimizde denenmiş ve işe yarayan bazı ilaçlar var ama eğer arzu ederseniz henüz geliştirilmekte olan yeni bir tekniği de deneyebiliriz.""
 learning_medicine.2022.b:0 "Basit bir ilaç işe yarar gibi duruyor."
 learning_medicine.2022.b.success:0 "Tedavi işe yarayacak."
 learning_medicine.2022.b.failure:0 "Tedavi işe yaramayacak."
 learning_medicine.2022.a:0 "Ülkemin geleceği söz konusu! Gereken her şeyi deneyeceğim!"
 learning_medicine.2022.a.success:0 "Tedavi çok başarılı olacak."
 learning_medicine.2022.a.unexpected:0 "Tedavinin bazı tuhaf yan etkileri olacak."
 learning_medicine.2022.a.failure:0 "Tedavinin bazı kötü yan etkileri olacak."
 learning_medicine.2022.c:0 "Aslında sadece birkaç tavsiye istemiştim."
 learning_medicine.2022.a.unexpected.tt:0 "Beklenmedik bir şeyler olabilir."

 learning_medicine.2023.urine.desc:0 ""Bedenleriniz senkronize değil, [ROOT.Char.Custom('FormOfAddressForLiege')], ama bunun bir çaresi var. [spouse.Custom('WifeHusbandPossessive')]'inizin idrarını içmelisiniz, [spouse.GetSheHe] de sizinkini. Bir hafta boyunca her gece, yatmadan önce. O zaman enerjileriniz kesinlikle hizalanacak!"\n\nUzun bir haftaydı.""
 learning_medicine.2023.unpleasant_end.desc:0 "\n\nTedavi pek hoş olmasa da,"

 learning_medicine.2023.pig_testicles.desc:0 ""[location.GetNameNoTooltip]'deki en güçlü domuzu edindim ve testislerini kurutup toz haline getirttim. İki hafta boyunca şaraba karıştırıp için, doğurganlığınız on kat artacak!""
 learning_medicine.2023.pig_testicles_end.desc:0 "\n\nBu testis tozu şaraba küflü bir renk katsa da bu hafta genel olarak şaşırtıcı bir şekilde hoş geçti."

 learning_medicine.2023.udder.desc:0 ""Süt hayat verir, bu yüzden kaynağına gitmeliyiz. Aşçılar ikiniz için haşlanmış inek memesi yapacak. Bir hafta başka hiçbir şey yemeyin, ödüllendirileceğinizden emin olabilirsiniz."\n\nUzun bir haftaydı.""

 learning_medicine.2023.female_orgasm.start.desc:0 ""Bildiğiniz gibi, kadının hazzı erkeğinki kadar önemlidir.""
 learning_medicine.2023.female_orgasm.female.desc:1 "Tohumlarınızı yaymalı ve eşinizinkiler ile birleştirmelisiniz. Eşiniz bu kitapları okuyup, yatak tekniklerine çalışmalı."\n\nDaha iyi bir tedavi olamazdı.\n\n"
 learning_medicine.2023.female_orgasm.male.desc:0 "Eşinizin tohumlarını yaymasını ve sizinkiler ile birleşmesini sağlamanız gerek. Bu kitapları okuyup yatak tekniklerine çalışın."\n\nBu alışılmadık teknikleri uygulamak için çok ter dökmek gerekiyor ama ben başardım. Tabii eğer eşimin verdiği tepkileri doğru anlıyorsam!\n\n"

 learning_medicine.2023.milk_bath.desc:0 ""Bütün süt hayat verir ve keçi sütü özellikle güçlüdür. [spouse.Custom('WifeHusband')] ile ne zaman çocuk yapmayı denerseniz, önce keçi sütünde yıkanmalısınız. Hatta küvette eğlenmeyi bile deneyebilirsiniz!""
 learning_medicine.2023.milk_bath_end.desc:0 "\n\nSütün çok ağır bir #EMP kokusu#! var ama"
 learning_medicine.2023.end.desc:0 "[physician.GetFirstNameNoTooltip] sonuçlar hakkında oldukça umutlu ve ben de kendimi çok iyi hissediyorum! Hekim bana sabırlı olmamı söylemişti ama ben inanıyorum ki yakında ailemizin yeni ufak bir üyesi daha olacak."
 learning_medicine.2023.a:0 "Haydi [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'çadırımıza', 'odamıza')] gidelim sevgili [spouse.GetFirstNameNoTooltip]..."
 learning_medicine.2024.end.desc:0 "\n\n[physician.GetFirstName] bana sabırlı olmamı söylemesine rağmen ve şüphelerim artıyor. Midem bulanıyor, yorgun hissediyorum ve eşim üç gündür yataktan kalkamıyor."
 learning_medicine.2024.a:0 "Sadece dinlenmek istiyorum..."
 learning_medicine.2024.b:0 "Muhafızlar! Yakalayın şu şarlatanı!"

 learning_medicine.2025.start.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], harika haberlerim var! Daha erken ama, [spouse.Custom('WifeHusband')]'iniz hamilelik belirtilerinin hepsini gösteriyor!"\n\nÖnce mutluluk ve rahatlama dalgası kaplıyor içimi, ama ardından hızla kafa karışıklığı geliyor. "Ama tedavinizi henüz uygulamadınız, [physician.GetFirstName]," diyorum imalı bir şekilde.\n\n"

 learning_medicine.2025.fertilitygod.desc:0 ""[physician.GetFaith.FertilityGodName]""

 learning_medicine.2025.the_universe.desc:0 ""Evren""
 learning_medicine.2025.end.desc:0 "aklımızın almadığı bir şekilde çalışır [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Bazen bu lütufları açıklamaya çalışmak yerine kucaklamalıyız.""
 learning_medicine.2025.b:0 "Bilgece laflar!"
 learning_medicine.2025.a:0 "[spouse.GetFirstNameNoTooltip]. Derhâl konuşmalıyız. Özel olarak."
 learning_medicine.2025.a.tt:0 "[spouse.GetShortUIName] ile yüzleştim"
 learning_medicine.2030.t:0 "Ağır Bir Taç"
 learning_medicine.2030.desc:0 "Zamanla [ROOT.Char.GetTitleAsNameNoTooltip] olarak üstüme yüklene sorumluluklarım ağır gelmeye başladı. Bir insan nasıl bütün [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ülkesini tek başına sırtında taşıyabilir ki?\n\nBelki de bazı yükleri tek başıma sırtlanmak zorunda değilimdir. Keşke güvenebileceğim birisi olsaydı..."
 learning_medicine.2030.a:0 "[confider_target.GetFirstName] genelde işe yarar tavsiyeler veriyor."
 learning_medicine.2030.a.message:0 "Paylaşmak beni rahatlatıyor"
 learning_medicine.2030.b:0 "[confider_target_2.GetFirstNameNoTooltip] çok iyi bir dinleyici."
 learning_medicine.2030.c:0 "Birbirimizin en karanlık sırlarını saklayabiliriz."
 learning_medicine.2030.d:0 "Başkalarına güvenmek beni sadece zayıf kılar."
 learning_medicine.2030.c.tt:0 "Eğer [confider_target.GetShortUIName] bir [secret|E] sahibi ise benden ne olduğunu saklamayacaktır."
 learning_medicine.2030.c.message:0 "[confider_target.GetFirstNameNoTooltip] bir sırrını sizinle paylaştı."
 learning_medicine.2040.t:0 "Akıl ve Vücut"
 learning_medicine.2040.start.desc:0 "Eğitimimde ilerledikçe zihin ve beden arasındaki bağlantı çok daha belirgin hâle geldi. Çok endişelenmek seni hasta edebilir ve sağlam kafa sağlam vücutta olur!\n\n"
 learning_medicine.2040.athletic_friend.desc:0 "Değerli dostum [friend.GetTitledFirstName] egzersiz yaparak stres atıp rahatladığını söylüyor. Ayrıca günlük tutmanın da stres konusunda yardımcı olduğuna dair bir şeyler okumuştum."
 learning_medicine.2040.journaller_friend.desc:0 "Değerli dostum [friend.GetTitledFirstName] günlük tutarak stresini kontrol altında tuttuğunu ve rahatladığını söylüyor. Ayrıca egzersiz yapmanın da stres konusunda yardımcı olduğuna dair bir şeyler duymuştum."
 learning_medicine.2040.no_friend.desc:0 "Yönetmenin zorluklarıyla başa çıkmak için sağlıklı ve istikrarlı bir rahatlama yöntemine ihtiyacım var. Bu doğrultuda günlük tutmanın ve egzersiz yapmanın oldukça faydalı olduğuna dair şeyler okudum."
 learning_medicine.2040.a:0 "[friend.GetFirstNameNoTooltip] ile egzersiz yapmalıyım."
 learning_medicine.2040.b:0 "[friend.GetFirstNameNoTooltip] bana günlük tutma tavsiyeleri verebilir."
 learning_medicine.2040.c:0 "Koşuya çık."
 learning_medicine.2030.c.trait:0 "Egzersiz beni rahatlatıyor"
 learning_medicine.2030.c.modifier:0 "Rahatladığımı değil güçlendiğimi hissediyorum"
 learning_medicine.2040.d:0 "Öğleden sonrasını günlük tutarak geçir."
 learning_medicine.2030.d.trait:0 "Günlük tutmak beni rahatlatıyor"
 learning_medicine.2030.d.modifier:0 "Rahatlamış hissetmiyorum ama yazı yazma yeteneğim gelişti"
 learning_medicine.2040.e:0 "Bu günlük kendime izin vermeliyim."
 learning_medicine.2050.t:0 "Kanama"
 learning_medicine.2050.start.desc:0 "[SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Kamp', 'Kışla')] revirlerini teftiş ettiğim sırada ağır yaralı bir asker içeri getiriliyor. "Çok kan kaybediyor! Hekim nerede?!"\n\n"
 learning_medicine.2050.physician.desc:0 "[physician.GetTitledFirstName] bulunamıyor."
 learning_medicine.2050.no_physician.desc:0 "Hiçbir yerde hekim bulamadık."
 learning_medicine.2050.end.desc:0 "Gerçeği idrak etmemle bir anda bir ürperti hissediyorum. Bu askerin tek umudu #EMP ben#! olabilirim.\n\n[helper.Custom2('MyCharacterIntroduction', ROOT.Char)] aniden rüzgâr gibi koşup yanıma geldi, ellerini sıvadı ve bana baktı."
 learning_medicine.2050.a:0 "Sargı bezini uzatın!"
 learning_medicine.2050.a.success:0 "[helper.GetFirstNameNoTooltip] ve ben askeri kurtarmayı başardık"
 learning_medicine.2050.a.failure:0 "Bütün çabalarımıza rağmen ne yazık ki askeri kaybettik"
 learning_medicine.2050.b:0 "#EMP Geri çekil!#! Bu #EMP benim#! hastam!"
 learning_medicine.2050.b.success:0 "Askeri tek başıma kurtarmayı başarıyorum"
 learning_medicine.2050.b.failure:0 "Askeri kurtarmayı başaramıyorum"
 learning_medicine.2050.c:0 "Ölmesine izin verin, burada zayıflara ihtiyacımız yok."
 learning_medicine.2051.start_our.desc:0 ""
 learning_medicine.2051.start.desc:0 "Hastanın çığlıkları yeri göğü inletiyordu. Üç tane asker onu tutmaya çalışıyordu ama her adım bir savaş gibiydi."
 learning_medicine.2051.middle.desc:0 "Ama [helper.GetTitledFirstName] sakin kaldı ve nihayet biraz odaklanıp işimizi yapmaya başladık.\n\nNasıl becerdik bilmiyoruz ama askerin hayatını kurtarmayı başardık. "Bu kimsenin beklemediği bir başarıydı,"

 learning_medicine.2051.my_ladylord.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U],""
 learning_medicine.2051.firstname.desc:1 "[ROOT.Char.GetFirstNameNoTooltip],""
 learning_medicine.2051.end.desc:0 ""Lordum" diyor [helper.GetFirstNameNoTooltip] yorgun bir gülümsemeyle, "Sizinle çalışmak benim için bir onurdu.""
 learning_medicine.2051.a:0 "Bunu sensiz başaramazdım."
 learning_medicine.2052.middle.desc:0 "\n\nÇılgınlar gibi çalıştık, etrafa emirler yağdırıp elimizden gelen her şeyi yaptık. Askerin durumu umutsuzdu ve ona hayat veren kan yavaşça parmaklarımızın arasından kayıp gitti.\n\n"Yapabileceğimiz her şeyi yaptık"
 learning_medicine.2052.end.desc:0 "dedi [helper.GetFirstNameNoTooltip] askerin cesedi taşınırken. "O asker en başından beri umutsuz bir vakaydı.""
 learning_medicine.2052.a:0 "Haklısın, teşekkür ederim [helper.GetFirstNameNoTooltip]."
 learning_medicine.2052.b:0 "Senin acımana ihtiyacım yok!"
 learning_medicine.2053.start_my.desc:0 ""
 learning_medicine.2053.desc:0 "Neyse ki bildiklerim beni yarı yolda bırakmadı, ellerim oldukça sakin.\n\nNasıl yaptığımdan tam emin değilim ama askerin hayatını kurtarmayı başardım. Askerin silah arkadaşları teker teker bana sarılıp teşekkür ettiler. "Size minnettarız [ROOT.Char.Custom('FormOfAddressForLiege')|l], siz olmasaydınız arkadaşımız ölmüş olurdu!""
 learning_medicine.2053.a:0 "Bugün bir hayat kurtardım!"
 learning_medicine.2054.desc:0 "\n\nÇılgınlar gibi çalıştım, etrafa emirler yağdırıp elimden gelen her şeyi yaptım. Ne yaparsam yapayım askerin durumu umutsuzdu, üstüm başım kan içinde kalmıştı.\n\nAskerin cesedi taşınırken [helper.GetFirstName]"
 learning_medicine.2054.disgust.desc:0 "gizlemeye tenezzül etmediği bir tiksintiyle gözlerimin içine baktı ve"
 learning_medicine.2054.pity.desc:0 "acıyarak bana baktı ve "
 learning_medicine.2054.a:0 ""keşke ben bir baksaydım..." dedi."

 learning_medicine.2110.t:0 "Kekler Üzerine Bir Tartışma"
 learning_medicine.2110.desc:0 "Dostlarım ve ben kısa bir baskından [capital.GetNameNoTooltip] bölgesine dönüyorken, ansızın başkentimde ne aradığı bilinmeyen [hashish_vassal_or_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] ve askerleri ile karşılaşıyoruz.\n\n"

 learning_medicine.2110.desc_good_terms:0 ""Ah, [ROOT.Char.GetFirstNameNoTooltip]! Sana denk gelmeyi umuyordum. Gel, buradan biraz ileride en keyifli küçük meyhaneyi buldum. Bana #italic akşam gölgesi#! tadı eşlik etmek ister misin?""
 learning_medicine.2110.desc_bad_terms:0 "Havadaki gerginlik aşikârdı, iki tarafın muhafızları da silahlarına sarılmak için işaret bekliyorlardı. "[ROOT.Char.Custom('FormOfAddressForLiege')|U]", diye fısıldadı arkamdan genç bir asker, "Belki biraz sakinleşmek için şuradaki ufak tavernada haşhaşlı kek yiyebiliriz?"\n\nİki grup da derin sessizliğe gömüldü ve [hashish_vassal_or_liege.GetFirstNameNoTooltip] cevabımı beklemeye başladı."
 learning_medicine.2110.desc_neutral_terms:0 "Bu ani karşılaşmanın etkisiyle kısa süren bir sessizlik ortama hâkimken [hashish_vassal_or_liege.GetFirstNameNoTooltip] dikkatli gözlerle arkamdaki bir şeye bakıyordu.\n\n"Ah efendim, belki de bu tatsız karşılaşmayı unutmak adına [ROOT.Char.Custom('GetExpensiveDrink')] içip haşhaşlı kek yemeye bana katılmak istersiniz?""
 learning_medicine.2110.a.good_terms:0 "Üzgünüm gitmeliyim."
 learning_medicine.2110.a.bad_terms:0 "Bu [Select_CString(hashish_vassal_or_liege.IsFemale, 'kadınla', 'adamla')] mı? Asla!"
 learning_medicine.2110.a.neutral_terms:0 "Üzgünüm bir yere geç kaldım gitmeliyim."
 learning_medicine.2110.b.good_terms:0 "Belki de ufak bir kaçamağa ikna edilebilirim..."

 learning_medicine.2110.b.bad_terms:0 "Peki. Ama #EMP sadece bir#! parça kek."

 learning_medicine.2110.b.neutral_terms:0 "Belki birkaç kek yiyebiliriz..."

 learning_medicine.2110.b.flavour:0 "Bir kek bakarsın iki olur, sonra üç olur, sonra dört olur..."
 cosmic_insights_modifier:0 "Kozmik Sezgiler"

 cosmic_insights_modifier_desc:0 "Uzun bir gece haşiş yedikten sonra bu karakter doğayı hissedip evrenin gerçeklerini sezebilmeye başladı."
 learning_medicine.2110.c.good_terms:0 "Yetişmeye çalış dostum!"
 learning_medicine.2110.c.bad_terms:0 "Bende peygamber sabrı var!"
 learning_medicine.2110.c.neutral_terms:0 "Sabahlar olmasın!"

 learning_medicine.2110.c.tt_success:0 "Haşiş anlaşılan onun çenesini düşürmüş."
 learning_medicine.2110.c.tt_fail:0 "İpleri salınca ben boşboğaz biri oluyorum..."
 learning_medicine_special.1001.t:0 "Vücudun Sırları"
 learning_medicine_special.1001.desc:0 "Bazen uzun uzun üzerine kafa yorup kendimi insan vücuduna ve bizim bilmediğimiz bütün sırlara hayran kalmış buluyorum. Kafamın içinde daima yaşam ve ölüm hakkında sorular dolaşıyor.\n\nBu konuyla ilgili metinleri okumak oldukça güzel fakat fiziksel bir araştırma yaparsam çok daha fazla şey öğrenebileceğim düşüncesi sürekli aklımda."
 learning_medicine_special.1001.a:0 "Hastalıkların etkilerini cesetler üzerinde inceleyeceğim."
 learning_medicine_special.1001.b:0 "Ölülere saygısızlık edemeyiz!"
 learning_medicine_special.1002.desc:0 "Sümüksü, leş kokan dağılmış iç organları incelerken nefesimi tutmaya çalışıyorum ama nafile. Çürümüş et parçalarının kokusu ciğerlerimin içine doluyor ve midemi kaldırıyor.\n\nBen zar zor nefes almak için uğraşırken cesede bir şeyler oluyor ve sarı iğrenç bir irin bütün ameliyat masasına yayılıyor.\n\n"O da neydi #EMP öyle#!?""
 learning_medicine_special.1002.a:0 "Belki [scoped_physician.GetTitledFirstNameNoTooltip] bana yardım edebilir"
 learning_medicine_special.1002.a.good:0 "[scoped_physician.GetTitledFirstName] araştırmamda bana yardımcı oluyor"
 learning_medicine_special.1002.a.bad:0 "[scoped_physician.GetTitledFirstName] deneylerim karşısında dehşete düşüyor"
 learning_medicine_special.1002.b:0 "Bir şekilde daha fazla ceset bulmalıyım..."
 learning_medicine_special.1002.c:0 "Yeter artık! Daha fazlasını midem kaldırmayacak!"
 learning_medicine_special.1003.desc_physician:0 "[scoped_physician.GetTitledFirstName] insan anatomisine yönelik yeni merakımla ilgili bir şeyler öğrenmeye çok ilgiliydi. Onun yardımlarıyla birlikte insan vücudu hakkındaki bilgi ve anlayışımı önemli ölçüde geliştirdim."
 learning_medicine_special.1003.desc_fallback:0 "Doğru ceplere giren birkaç altın parça ve ağzı sıkı hizmetçilerim sayesinde, deneyimi devam ettirmek için yeterince fazla ceset bulabildim. Ne yazık ki cesetlerin çoğunu tabiri caizse katlediyorum ve kullanılamayacak hâle geliyorlar. Yine de, hata yapmadan nasıl doğrusunu öğrenebilirim?"
 learning_medicine_special.1003.desc_ending:0 "\n\nKeşke bu lanet kokudan kurtulmanın bir yolu olsaydı... Bu kötü havanın sağlığım için pek iyi olmayacağından şüphelenmeye başladım."
 learning_medicine_special.1003.a:0 "Belki güzel kokulu bir demet çiçek yardımcı olur?"
 learning_medicine_special.1003.a.good:0 "Önlemlerim beni hastalıktan koruyacaktır"
 learning_medicine_special.1003.a.bad:0 "Sanırım bu kadavraların kokusu sağlığımı etkilemeye başladı..."
 learning_medicine_special.1003.b:0 "Sanırım bu deneylerden yeterince şey öğrendim."
 learning_medicine_special.1004.desc:0 "[scoped_physician.GetTitledFirstName] deneylerimin içeriğini öğrenmekten hiç mi hiç memnun olmadı. Bana yardım etmeyi kesinlikle reddetti ve [ROOT.Char.GetTitleTierName] olmanın bu tür şeyleri yapmayı meşru kılmadığını da ekledi."
 learning_medicine_special.1004.unavailable.desc:0 "[scoped_physician.GetTitledFirstName] yardım etmeden insan anatomisi üzerine deneylerimi devam ettirmem pek mümkün gözükmüyor."
 learning_medicine_special.1004.a:0 "Belki de haklısın..."
 learning_medicine_special.1004.unavailable.a:0 "Tüh."
 learning_medicine_special.1004.unavailable.tt:0 "İnsan kadavralarını incelemeyi bırakacaksın."
 learning_medicine_special.1005.desc:0 "Neyse ki çiçeklerin doğru kullanımı, tütsü ve havalandırma, kadavraların yaydığı kötü buharların vücudum üzerindeki etkilerini azaltmaya yardımcı olmuş gibi görünüyor.\n\nNihayet çalışmalarıma sağlığıma zarar vermeden devam edebilirim."
 learning_medicine_special.1005.a:0 "Bilim aşkının önüne kimse duramaz!"
 learning_medicine_special.1006.desc_opening:0 "Günlerdir çalıştığım beden üzerinde çalışmaya devam ederken bir anda başım dönmeye başladı. Yine."
 learning_medicine_special.1006.desc_death:0 "Çok sürmeden öksürükler de başladı, acıdan kıvranırken ağzımdan kan geldiği fark ettim.\n\nGözüm karardı ve kendimi yerde buldum. Zar zor nefes alıyordum, daha fazla dayanamadım. Göz kapaklarım ağır ağır kapandı..."
 learning_medicine_special.1006.desc:0 "Artık bedenimin ihtiyaçlarını göz ardı edemem, bu işleri bırakıp bir süre dinlenmeliyim..."
 learning_medicine_special.1006.a:0 "Ölümün kokusu sağlığımı çok kötü etkiledi!"
 learning_medicine_special.2100.t:0 "Mucizevi Bir Balık"
 learning_medicine_special.2100.desc:1 "Yerel bir balıkçı olan ve [hallucinogenic_fish_county.GetNameNoTierNoTooltip] tarafında yaşayan [fish_alchemist.GetName] büyülü bir yemek yapabildiğini söylüyor.\n\nSöylediğine göre balığını gizli bir yerden tutuyor ve üstünde tuhaf ritüeller yapıyormuş. Kafalarını yememiz için getirip bize sunacakmış ve bu kafaların her biri yenildikten günler sonra dahi inanılmaz şeyler görmemizi sağlayacakmış.\n\nBalıkçı açgözlülük ve korku ile parlayan gözlerle bana doğru bakıyor."
 learning_medicine_special.2100.a:0 "Hazırla bakalım senin şu büyülü balığı."
 learning_medicine_special.2100.a.tt_success:0 "[ROOT.Char.GetFaith.PositiveAfterLife|U] içinde çiçek topluyorum sanki"
 hallucinogenic_visions_uplifting_modifier:0 "Öteki dünyanın heyecan verici görüleri"
 hallucinogenic_visions_uplifting_modifier_desc:0 "Bu karakter öbür dünyada seçilmişleri bekleyen muhteşem şeyleri gördü."
 learning_medicine_special.2100.a.tt_failure:0 "[ROOT.Char.GetFaith.NegativeAfterLife|U] nasıl bir yermiş kendi gözlerimle gördüm"
 hallucinogenic_visions_terrifying_modifier:0 "Öteki dünyanın dehşet verici görüleri"
 hallucinogenic_visions_terrifying_modifier_desc:0 "Bu karaktere öteki dünyanın dehşet verici görüleri ile âdeta işkence edildi."
 learning_medicine_special.2100.b:0 "Bu balıkların sırrını bana öğretmelisin..."
 learning_medicine_special.2100.b.tt_success:0 "Köylü sırrını açıklar"
 learning_medicine_special.2100.b.tt_success.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] sarayıma sadık bir hizmetkâr olarak katılır"
 learning_medicine_special.2100.b.tt_fail:0 "Köylü ile amansız bir kavgaya tutuştum"
 learning_medicine_special.2100.b.tt_failure.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] sarayımdan öfkeli bir şekilde kaçtı"
 associates_with_strange_peasants_modifier:0 "Garip Köylüler ile İlişkiler"
 associates_with_strange_peasants_modifier_desc:0 "Bu karakterin statüsünün altındaki insanlar ile mânâsız tartışmalara girdiği biliniyor..."
 learning_medicine_special.2100.c:0 "Cadının tekinin bu kadar sorun çıkarmasına göz yumulmaz!"
 learning_medicine_special.2100.c.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] kazığa bağlanıp yakıldı"
 learning_medicine_special.2100.d:0 "Birisi şu köylüyü nazikçe dışarı atabilir mi?"
 learning_medicine_special.2100.d.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] sarayımdan atıldı"
 aloof_from_the_commoners_modifier:0 "Köylülerden Uzak"
 aloof_from_the_commoners_modifier_desc:0 "Bu karakter zaman kaybı köylüleri dinlemeden geri çevirmesiyle bir ün kazanmıştır."
