 learning_theology.1301.desc_regula_pastoralis:0 ""A local merchant has a copy of the influential Regula Pastoralis but refuses to sell it to me."
### TODO AGOT-ONLY: learning_theology.1301.desc [AGOT: ]
 learning_theology.1301.desc:0 ""A local merchant has a copy of The Compendious Book on Calculation by Completion and Balancing but refuses to sell it to me."
 learning_theology.1301.desc_ending:0 "Yaptığının yanlış olduğunu anlamasını sağlarsanız size minnettar kalırım!""
 learning_theology.1301.a:0 "Kitabın sana ulaşmasını sağlayacağım."
 learning_theology.1301.b:0 "Hmm, ilginç bir kitap gibi gözüküyor..."
 learning_theology.1301.c:0 "Bu daha çok #EMP senin#! problemin gibi."
