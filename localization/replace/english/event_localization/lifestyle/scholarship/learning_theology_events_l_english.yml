### TODO AGOT-CHANGED: learning_theology.2020.desc [AGOT: [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNicknamed] often quotes passages from the [ROOT.Char.GetFaith.ReligiousText] about the holy virtues. I should prove I have paid attention by quoting a passage of my own — preferably one which compliments [court_chaplain.GetHerHis] personality.\n\nI will memorize and recite a section on... | TR: [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] sıklıkla söylediklerini desteklemek adına kutsal metinlerden pasajlar alıntılıyor. Gözüne girmek için belki ben de doğru zamanı kollayıp bir alıntı yapabilirim — tercihen onu pohpohlayan bir alıntı.\n\nYapmam gereken tek şey ne hakkında bir pasaj olması gerektiğine karar vermek...]
