### TODO AGOT-ONLY: learning_theology.3051.desc.my_immortal [AGOT: ]
 learning_theology.3051.desc.my_immortal:0 ""$learning_theology.3051.my_immortal$.""
 learning_theology.3051.desc.outro:0 "\n\nGiriş ücreti epey pahalı ama [passion_playwright.GetNameNoTooltip] tarafından yazılan bir oyuna tanıklık etme fırsatı hayatta ayağına bir kez gelir!"
 learning_theology.3051.a:0 "Bu akşam tiyatroya gidelim o zaman!"
 learning_theology.3051.b:0 "[ROOT.Char.GetFaith.CreatorNamePossessive] yarattıklarıyla dalga geçilmemeli."
 learning_theology.3052.desc: "Oyun gözlerimin önünde devam ederken [passion_playwright.GetName] neden edebî bir dâhi olarak anılıyor çabucak anladım.\n\nSenaryo, performans... [ROOT.Char.GetFaith.ReligiousText] içinde yazan olaylar gözlerimin önünde gerçekleşiyordu, [ROOT.Char.GetFaith.CreatorName] tarafından yaratılanları kendi gözlerimle izliyordum sanki!\n\nOyun sona erdiğinde [passion_playwright.GetNameNoTooltip] ile yalnız kaldığımı fark ettim."
 learning_theology.3052.a:0 "Bu [ROOT.Char.GetFaith.ReligiousText] yorumunu nasıl yaptığını öğretmelisin!"
 learning_theology.3052.b:0 "Ben bundan daha iyi yazabilirdim!"
 learning_theology.3053.desc:1 "Oyunu baştan sona izledim ve palavralarla dolu olduğunu söyleyebilirim. Az önce izlediğim şeye edebiyat demek edebiyata hakaret olur.\n\nHikâyede genç bir bilgin [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] mistikliği ve cadılığı üzerine çalışıyor bu sırada da sevgiliden sevgiliye koşuyor.\n\nOyunun [ROOT.Char.GetFaith.ReligiousText] ile uzaktan yakından alakası yok. Diğer izleyiciler [passion_playwright.GetName] tarafından sergilenen kalitesiz yazarlığı şimdiden yuhalamaya başladı bile."
 learning_theology.3053.a:0 "Yuuuuuh!"
 learning_theology.3053.b:0 "Kendi oyunumu kaleme alacağım!"
 learning_theology.3053.c:0 "Bu aptallar [passion_playwright.GetFirstNameNoTooltip] gibi dâhilerden ne anlasın!"
 learning_theology.3054.t:0 "Kendi [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] Oyunum"
 learning_theology.3054.desc.intro: "[passion_playwright.GetName] tarafından ortaya konan düşük kalite eseri geride bırakmaya ant içeli çok zaman geçti. Kâtiplerimin mürekkebi kurudukça kendi eserime hayranlıkla bakıyorum.\n\n"
 learning_theology.3054.desc.outro:0 "mütevazı tahminlerime göre "şaheser" olarak anılmayı hak edecek bir yapıt.\n\nPeki ya başrolü kim oynayacak?"
 learning_theology.3054.a:0 "Kılık değiştirerek ben oynayacağım elbette!"
 learning_theology.3054.b:0 "[family_actor.GetFirstNameNoTooltip] sahneye çıkacak!"
 learning_theology.3054.c:0 "[ROOT.Char.Custom2('RelationToMePossessive', random_actor)|U], [random_actor.GetTitledFirstNameNoTooltip] doğuştan yetenekli."
 learning_theology.3055.t:0 "Dramatik Çıkış"
 learning_theology.3055.desc.intro.solo:0 "Derin bir nefes alıp oyunumu sergilemeye hazırlandım, eserin dindar mesajını kusursuzca ileteceğim."
 learning_theology.3055.desc.intro.hired_actor:0 "İzleyicilerin arasına oturdum ve [lead_actor.GetName] şaheserimi sergilemeye koyulduğunda onu dikkatlice izlemeye başladım."
 learning_theology.3055.desc.victory.solo: "\n\nDerin bir nefes aldım ve sözlerimi hata yapmadan söyledim, etrafımı saran izleyiciler âdeta sözlerimin esiri olmuştu.\n\n[ROOT.Char.GetFaith.ReligiousText|U] üzerinde yer alan öyküleri ustalıkla yorumlayarak onları aydınlattım."
 learning_theology.3055.desc.defeat_writing.solo:0 "\n\nSözlerimi hata yapmadan söylememe rağmen izleyicilerin beklentiyle bakan yüzleri sert ve şaşkın bir hâl aldı."
 learning_theology.3055.desc.defeat_acting.solo: "\n\nAçılış sözlerini okumaya çalıştım ama kelimeler boğazımda düğümlendi. Kendim yazmama rağmen hiçbir satırını hatırlayamadım. İzleyicilerim merhamet göstermeyip beni yuhalamaya başladı!"
 learning_theology.3055.desc.victory.hired_actor:0 "\n\nNeyse ki sadece benim yazılarıma değil [ROOT.Char.GetFaith.HighGodNamePossessive] kendisine de yaraşır bir performans gösterdi!"
 learning_theology.3055.desc.defeat_writing.hired_actor:0 "\n\nYazdığım sözleri aynı düşündüğüm gibi söylemesine rağmen izleyiciler mükemmel performansını beğenmeyip yuhalamaya başladı!"
 learning_theology.3055.desc.defeat_acting.hired_actor:0 "\n\nKorkarım ki kelimeler boğazında düğümlendi ve elle tutulur bir performans bile sergileyemedi. Büyük eserim bu şekilde mahvedilirken kanım kaynıyordu, izleyicilerin yuhalamalarını engellemekten âciz biçimde koltuğumda oturuyordum."
 learning_theology.3055.desc.victory_outro: "Etraf kalabalığın alkışlarına boğulduğunda [passion_playwright.GetName] gerçek bir [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] oyununun nasıl yazılacağını görmüştür!"
 learning_theology.3055.desc.defeat_outro.solo:0 "\n\nBir şekilde ivme kazanıp bu performansı kurtarırım diye çabalamaya devam ettim ancak işe yaramadı. Daha sona bile gelmeden tiyatrodaki nerdeyse herkes ayrılmıştı. Rezil oldum."
 learning_theology.3055.desc.defeat_outro.hired_actor:0 "\n\n[lead_actor.GetTitledFirstNameNoTooltip|U] oyunu bir şekilde kurtarabilmek için çabalamaya devam etse de gösteri başarısızlıkla sonuçlandı. Daha sona bile gelmeden tiyatrodaki nerdeyse herkes ayrılmıştı. Rezil oldum."
 learning_theology.3055.a:0 "Tüm [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] için güzel bir gece!"
 learning_theology.3055.b:0 "Belki de oyun yazmak bana göre değildir..."
 learning_theology.3054.a.tt:0 "[passion_playwright.GetName] ile [Concept( 'diplomacy_skill', 'Diplomasi Becerinizi' )|E] kullanarak yapacağınız düelloyu kazanmaya çalışacaksınız."
 learning_theology.3054.b.tt:0 "[family_actor.GetName], [passion_playwright.GetName] ile yaptığı düelloyu [Concept( 'diplomacy_skill', 'Diplomasi Becerinizi' )|E] kullanarak kazanmaya çalışacak."
 learning_theology.3054.c.tt:0 "[random_actor.GetName], [passion_playwright.GetName] ile yaptığı düelloyu [Concept( 'diplomacy_skill', 'Diplomasi Becerinizi' )|E] kullanarak kazanmaya çalışacak."
 learning_theology_special.1001.t:0 "Apokrif"
 learning_theology_special.1001.desc:0 "Bilgiye bastırılamayan susuzluğum beni eski, tuhaf bir kitapla karşılaştırıyor.\n\nResmî kaynaklarda adına pek rastlanmayan bir din bilimci tarafından kaleme alınmış bu kitapta [ROOT.Char.GetFaith.GetName] inancına dair bu zamana kadar hiçbir yerde duymadığım bazı kaideler ve öğretiler yer alıyor."
 learning_theology_special.1001.d:0 "Bu eski uygulamaları diriltmeliyiz."
 learning_theology_special.1001.d.success:0 "Bulgularımı başarıyla [THIS.Char.GetFaith.GetAdjective] inancına dâhil ettim"
 learning_theology_special.1001.d.failure:0 "Ruhban sınıfı söylediklerimi kâle almadı"
 learning_theology_special.1001.d.failure.toast:0 "Doğruluğü şüpheli metni kabul ettirme girişimim başarısız oldu"
 learning_theology_special.1001.e:0 "[vassal_pope.GetTitledFirstNameNoTooltip] haberdar edilmeli!"
 learning_theology_special.1001.e.success:0 "[vassal_pope.GetTitledFirstName] bulgularımı [THIS.Char.GetFaith.GetAdjective] inancına dâhil etmeye ikna oldu"
 learning_theology_special.1001.e.failure:0 "[vassal_pope.GetTitledFirstNameNoTooltip] metnin sahih olduğuna inanmadı"
 learning_theology_special.1001.e.failure.toast:0 "[vassal_pope.GetTitledFirstName] metni bir sapkın tuzağı olarak nitelendirdi"
 learning_theology_special.1001.a:0 "[bishop.GetTitledFirstNameNoTooltip] bu metni anlamama yardımcı olabilir."
 learning_theology_special.1001.a.desc:0 "[bishop.GetTitledFirstName] ne kadar dindarsa"
 learning_theology_special.1001.a.success:0 "Araştırmama yardım edecek"
 learning_theology_special.1001.a.success.toast:0 "[bishop.GetTitledFirstName] bulgularımdan dolayı beni kutladı"
 learning_theology_special.1001.a.failure:0 "Kitabın yakılmasını emretti"
 learning_theology_special.1001.a.failure.toast:0 "[bishop.GetTitledFirstName] sapkınlık yayan bu kitabın yakılmasını sağladığım için beni kutladı"
 learning_theology_special.1001.b:0 "Bu metne gizli bir yerde çalışmalıyım..."
 learning_theology_special.1001.c:0 "Bu sapkın paçavra yanacack!"
 learning_theology_special.1002.t:0 "Yeni Kaideler"
 learning_theology_special.1002.a.desc:0 "Bulduğum eski kitaptaki içerikleri güncel [ROOT.Char.GetFaith.GetAdjective] öğretilerine ekleyerek inancımızın tarihinde sonraki nesillerin taklit etmeyi umut dahi edemeyeceği bir iz bıraktım.\n\nRuhban sınıfının önde gelen bazı isimleri hâlâ inancımızın öğretilerinde yaşanan bu sıradışı değişikliği sindirmekte güçlük çekse de, çoğunluk yaptığım reformun meşruluğuna ikna olmuş durumda."
 learning_theology_special.1002.b.desc:0 "İlk başta [vassal_pope.GetTitledFirstName] metnin doğruluğuna inanmaya pek istekli görünmüyordu, aynı şekilde onun altında bulunan [ROOT.Char.GetFaith.GetAdjective] mezhebinin diğer önemli isimleri de bunların hurafeden ibaret olduğuna kanaat getirmişti. Her şeye rağmen tutkulu konuşmalarım ve dinî meselelere hâkimiyetimle onları ikna etmeyi başardım.\n\nRuhban sınıfının önde gelen bazı isimleri hâlâ inancımızın öğretilerinde yaşanan bu sıradışı değişikliği sindirmekte güçlük çekse de, çoğunluk yaptığım reformun meşruluğuna ikna olmuş durumda."
 learning_theology_special.1002.a:0 "Şüphesiz ki bu kitabı bulmamı bizzat [ROOT.Char.GetFaith.HighGodName] sağladı."
 learning_theology_special.1003.a.desc:0 "Sahip olduğu bilgeliğin bir göstergesi olarak [player_pope.GetTitledFirstName], [ROOT.Char.GetFaith.GetAdjective] öğretilerinin baştan yorumlanmasını gerektirecek antik bir metin keşfetti.\n\nBulgularını ruhban sınıfının önde gelen isimleriyle tartıştıktan sonra, kitabın içeriğini mezhebin resmî öğretilerine dâhil etmeye karar verdi."
 learning_theology_special.1003.b.desc:0 "Saatlerce süren yorucu bir araştırmanın ardından [pope_liege.GetTitledFirstName], [ROOT.Char.GetFaith.GetAdjective] öğretilerinin baştan yorumlanmasını gerektirecek antik bir metin keşfetti.\n\nBulgularını [vassal_pope.GetTitledFirstName] ile paylaştıktan sonra, kitabın içeriğini mezhebin resmî öğretilerine dâhil etmeye karar verdi."
 learning_theology_special.1003.a:0 "Peki bu bizim için ne anlama geliyor?"
 learning_theology_special.1101.t:0 "Tefsirler"
### TODO AGOT-ONLY: learning_theology_special.1101.desc [AGOT: ]
 learning_theology_special.1101.desc:0 ""Blessings upon you, [ROOT.Char.Custom('FormOfAddressForLiege')]. My name is [scholar.GetTitledFirstName]." The rabbi before me gives a respectful bow.\n\n"I have dedicated my life to studying and writing commentaries on the Tanakh and the Talmud. Perhaps my writings and my guidance would be of use to you in your own studies of the [ROOT.Char.GetFaith.ReligiousText].""
