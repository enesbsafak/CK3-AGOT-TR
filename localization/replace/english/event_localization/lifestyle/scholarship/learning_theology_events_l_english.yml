 learning_theology_special.1101.desc.fallback:0 ""Greetings, [ROOT.Char.Custom('FormOfAddressForLiege')]. My name is [scholar.GetTitledFirstName]." The priest before me gives a respectful bow.\n\n"I have dedicated my life to studying and writing the [ROOT.Char.GetFaith.ReligiousText]. Perhaps my writings and my guidance would be of use to you in your own studies.""
 learning_theology_special.1101.a:0 "[ROOT.Char.GetFaith.ReligiousText|U] için bir tefsir yazalım!"
 learning_theology_special.1101.b:0 "#emp Gerçek#! dünyada daha önemli işlerim var."
 learning_theology_special.1101.c:0 "Kâfirlere evimi açmayacağım!"
 learning_theology_special.1102.desc:0 "Masanın dört bir yanına dağılmış kâğıtların arasında günler süren çalışmaların ardından nihayet [ROOT.Char.GetFaith.ReligiousText] için ayrıntılı ve kapsamlı bir tefsir ortaya çıkarmayı başardık. [scholar.GetTitledFirstName] sayesinde [ROOT.Char.GetFaith.ReligiousText] hakkında artık çok daha fazla şey biliyorum."
 learning_theology_special.1102.desc_dead:0 "Masanın dört bir yanına dağılmış kâğıtların arasında günler süren çalışmaların ardından nihayet [ROOT.Char.GetFaith.ReligiousText] için ayrıntılı ve kapsamlı bir tefsir ortaya çıkarmayı başardım. Keşke [scholar.GetTitledFirstName] çalışmalarımızın meyvesini görebilseydi."
 learning_theology_special.1102.desc_ending:0 "\n\nRuhban sınıfı bu çalışmamı ilgiyle karşılayacaktır!"
 learning_theology_special.1102.a.success:0 "[scholar.GetTitledFirstNameNoTooltip] devam etmek için ikna oldu"
 learning_theology_special.1102.a.failure:0 "[scholar.GetTitledFirstNameNoTooltip] ikna olmadı"
 learning_theology_special.1102.b:0 "Başarımı niye başkasıyla paylaşayım?"
 learning_theology_special.1102.c:0 "[scholar.GetFirstNameNoTooltip] olmasa böyle bir çalışma olmazdı"
 learning_theology_special.1102.c.rl_desc:1 "[scholar.GetTitledFirstNameNoTooltip] ne kadar onurluysa"
 learning_theology_special.1102.c.success:0 "Çalışmamızın başarısını benimle paylaştı"
 learning_theology_special.1102.c.failure:0 "Çalışmamızın tüm başarısını kendisine mâl etti"
 learning_theology_special.1102.c.success.toast:0 "[scholar.GetTitledFirstName] başarıyı benimle paylaştı"
 learning_theology_special.1102.c.failure.toast:0 "[scholar.GetTitledFirstName] tüm başarıyı kendine mâl etti"
 learning_theology_special.1102.b.success:0 "[scholar.GetShortUINameNoTooltip] alt edildi"
 learning_theology_special.1102.b.failure:0 "[scholar.GetShortUINameNoTooltip] sahtekarlığımı açığa çıkardı"
 learning_theology_special.1102.d:0 "En azından çok şey öğrendim!"
