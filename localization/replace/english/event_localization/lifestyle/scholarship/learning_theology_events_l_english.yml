### TODO AGOT-CHANGED: learning_theology.2021.desc [AGOT: I am sure [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNicknamed] has said something about the virtues of being [SCOPE.Custom('virtue_choice')]. I cannot recall his exact words, so I allow myself some creativity.\n\nUnfortunately, the [court_chaplain.GetCouncilTitle|U] is rather conservative. | TR: [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] yakın bir zamanda [SCOPE.Custom('virtue_choice')] olmanın erdemliliğine dair kutsal metinlerden bir alıntı yapmıştı. Tam olarak ne dediğini hatırlayamıyorum, bu sebeple cümleyi doğaçlama yaparak tamamlıyorum. Görünen o ki [court_chaplain.GetCouncilTitle|U] yaratıcılığımdan pek hazzetmiyor.]
 learning_theology.2021.desc:0 "I am sure [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNicknamed] has said something about the virtues of being [SCOPE.Custom('virtue_choice')]. I cannot recall his exact words, so I allow myself some creativity.\n\nUnfortunately, the [court_chaplain.GetCouncilTitle|U] is rather conservative. "What are you talking about?" [court_chaplain.GetSheHe] sneers. "Those are not the words of [ROOT.Char.GetFaith.HighGodName]!""
 learning_theology.2021.a:0 "Belki de [ROOT.Char.GetFaith.ReligiousText] okumalarına daha fazla zaman ayırmalıyım..."
 learning_theology.3002.t:0 "Kıyamet Vakti"
### TODO AGOT-CHANGED: learning_theology.3002.desc [AGOT: I have been studying the ancient religious texts and the writings of scholars, and they all seem to agree that [ROOT.Char.Custom('WorldDeadline')]. By my calculations we are less than a century away.\n\nHowever, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))], [chaplain.GetFirstNameNicknamedNoTooltip], urges me to keep it to myself. | TR: Bir süredir antik dinî metinleri ve âlimlerin yazılarını inceliyorum... Neredeyse hepsi [ROOT.Char.Custom('WorldDeadline')] konusunda hemfikir. Yaptığım hesaplamalara göre kıyamet tarihine yüz yıldan az bir süre kalmış durumda.\n\n[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('chaplain'))|U] [chaplain.GetTitledFirstName] ise bu bilgiyi kendime saklamam gerektiğini düşünüyor.]
 learning_theology.3002.desc:0 "I have been studying the ancient religious texts and the writings of scholars, and they all seem to agree that [ROOT.Char.Custom('WorldDeadline')]. By my calculations we are less than a century away.\n\nHowever, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))], [chaplain.GetFirstNameNicknamedNoTooltip], urges me to keep it to myself. "Leave it to the [ROOT.Char.GetFaith.AltPriestTermPlural] and avoid panic. What if your calculations are wrong?""
 learning_theology.3002.a:0 "Herkes gerçeği öğrenmeyi hak ediyor!"
 learning_theology.3002.b:0 "Haklısın, [chaplain.GetFirstNameNoTooltip]."
 learning_theology.3002.c:0 "Bu meseleyi [ROOT.Char.GetFaith.PriestNeuterPlural] ile konuşmalıyım."
 learning_theology.3003.t:0 "Yıldızların Altında"
 learning_theology.3003.desc:0 "Yıldızları izlerken bu zamana kadar sadece kitaplarda denk geldiğim bir şeye bizzat şahit oluyorum.\n\nYıldızlar farklı hızlarda hareket ediyorlar ve farklı zamanlarda ama görünüşe göre büyük gruplar hâlinde rotalarını tersine çeviriyorlar. Tüm bunlar ait oldukları gökküresine bağlı bir biçimde gerçekleşiyor. Bu kapsamda, hesaplamalarımı doğru yaparsam onların hareketlerini öngörebilirim.\n\nÖte yandan [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('chaplain'))] bu düşüncemi pek de onaylıyor gibi gözükmüyor. "[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )], göklerle uğraşmayın. Cennet'in sırları sadece [ROOT.Char.GetFaith.AltPriestTermPlural] tarafından bilinmelidir.""
 learning_theology.3003.a:0 "Aradığım cevapları cennette bulacağım."
 learning_theology.3003.b:0 "Haklı, dünyevi meselelere odaklanmalıyım."
 learning_theology.3011.t:0 "Dünyevi Zenginlik"
 learning_theology.3011.desc_friend:0 "[temple_county.GetName] civarlarındaki bir [ROOT.Char.GetFaith.HouseOfWorship] çıkışında [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('believer'))] [believer.GetTitledFirstName] ile birlikte bir grup tüccarla karşılaşıyoruz."
 learning_theology.3011.desc:0 "[temple_county.GetName] civarlarındaki bir [ROOT.Char.GetFaith.HouseOfWorship] çıkışında [believer.GetTitledFirstName] ve bir grup tüccarla karşılaşıyorum."
 learning_theology.3011.ending:0 "Görünüşe göre din ve zenginlik üzerine hararetli bir tartışmanın ortasındalar. Tam yanlarına geldiğimde tüccarlardan biri şöyle bir cümle kuruyor:\n\n"Yahu, #EMP elbette#! [ROOT.Char.GetFaith.HouseOfWorship] için bağışta bulunurum ama [ROOT.Char.GetFaith.WealthGodNamePossessive] gerçekten istediğinin bu olduğu ne malum?""
 learning_theology.3011.a_friend:0 "Onları [ROOT.Char.GetFaith.WealthGodNamePossessive] bu yönde işaretler verdiğine ikna edeceğiz!"
 learning_theology.3011.a:0 "Onları ikna etmeme yardım et, [believer.GetTitledFirstNameNoTooltip]!"
 learning_theology.3011.a.success:0 "Tüccarlar ikna oldu"
 learning_theology.3011.a.failure:0 "[ROOT.Char.GetFaith.HouseOfWorship|U] tek bir kuruş göremedi"
 learning_theology.3011.b:0 "Altınlarını daha iyi kullanabileceğin başka bir yer biliyorum..."
 learning_theology.3021.t:0 "Kutsal Mektup"
 learning_theology.3021.desc_opening:0 "Teoloji üzerine bir süredir yaptığım çalışmalar, [ROOT.Char.GetFaith.HighGodNamePossessive] yeryüzündeki vekillerini daha fazla takdir etmeme yol açtı. Bu takdir duygumu ifade etmek için [compliment_receiver.GetTitleAsName] [compliment_receiver.GetFirstName] adresli bir mektup yazmak istiyorum.\n\n"
 learning_theology.3021.desc_friend:0 "Bunun için [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('believer'))] [believer.GetTitledFirstName] ile birlikte masanın başına geçiyorum. "
 learning_theology.3021.desc:0 "Bunun için bir kâtiple birlikte masanın başına geçiyorum. "
 learning_theology.3021.desc_christian:0 "Yapmamız gereken ilk şey mektupta Papa cenaplarının hangi özelliğini vurgulayacağımıza karar vermek."
 learning_theology.3021.desc_other:0 "Yapmamız gereken ilk şey hazretlerinin hangi özelliğini vurgulayacağımıza karar vermek."
 learning_theology.3021.success.tt:0 "[believer.GetTitledFirstNameNoTooltip] karar verecek:"
 learning_theology.3021.b:0 "[ROOT.Char.GetFaith.HighGodName|U] ondan daha önemli!"
 learning_theology.3022.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3022.desc:0 "Mektubunuzu memnuniyetle karşıladım! Hem [ROOT.Char.GetFaith.HighGodNamePossessive|U] buyruklarına, hem de insan tabiatına olan hakimliğiniz takdire şayan."
 learning_theology.3022.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] büyüktür!"
 learning_theology.3023.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3023.desc:0 "Uhrevi bilgilerinizden etkilendiğimi söylemeliyim, ne yazık ki aynı şeyi insan tabiatına olan hâkimiyetiniz için söyleyemeyeceğim."
 learning_theology.3023.a:0 "Pekâlâ."
 learning_theology.3024.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3024.desc:0 "[ROOT.Char.GetFaith.HighGodNamePossessive] örnek bir kuluymuş gibi davranma girişimlerinizi ne yazık ki pek inandırıcı bulmadım. İnsan tabiatına dair çarpık anlayışınız sizi ele veriyor."
 learning_theology.3024.a:0 "Kahretsin!"
 learning_theology.3031.t:0 "Mezhepsel Farklılıklar"
 learning_theology.3031.desc_opening:0 "[county.GetNameNoTier] yerleşiminde halkın çoğunluğu [county.GetProvince.GetCounty.GetFaith.GetNameNoTooltip] mezhebine mensup.\n\n"
 learning_theology.3031.desc_bishop:0 "[bishop.GetCouncilTitle|U] [bishop.GetFirstName] bu durumu açıkça bir sapkınlık olarak nitelendirirken, bölge halkı bizden inançlarına anlayış göstermemizi bekliyor..."
 learning_theology.3031.desc:0 "Çoğu kişi onları sapkın olarak nitelendirse de, bölge halkı bizden inançlarına anlayış göstermemizi bekliyor..."
 learning_theology.3031.a:0 "Nasıl ibadet ettikleri beni ilgilendirmez."
 learning_theology.3031.b:0 "Öyle ya da böyle doğru yola gelecekler!"
 learning_theology.3031.b_confucian: "Yolu takip edecekler!"
 learning_theology.3031.b_tt:1 "$task_conversion$ konsey görevi ilerleme kazanacak"
 learning_theology.3031.b_tt2:0 "30 yıl boyunca [county.GetNameNoTooltip] Kontluğunda Din Değiştirmek daha kolay olacak"
### TODO AGOT-CHANGED: learning_theology.3041.t [AGOT: Higher Mysteries | TR: Kadim Bilgiler]
 learning_theology.3041.t:0 "Higher Mysteries"
 learning_theology.3041.desc:0 "[ROOT.Char.GetFaith.HighGodName|U] ile iletişime geçmek adına transa geçen [ROOT.Char.GetFaith.DevoteeNeuterPlural] hakkında bilgilere rastlıyorum.\n\nBen de benzer bir ilahi bağ kurabilir miyim?"
 learning_theology.3041.a:0 "Ayinlerini uygularsam ne olur acaba?"
### TODO AGOT-CHANGED: learning_theology.3041.a.tt [AGOT: You test the higher mysteries | TR: Kadim ayinleri deneyeceksiniz]
 learning_theology.3041.a.tt:0 "You test the higher mysteries"
 learning_theology.3041.b:0 "Diğer metinler ne diyor?"
 learning_theology.3041.b.tt:0 "Mevzubahis ayinler hakkında daha fazla bilgi toplamaya çalışacaksınız"
 learning_theology.3042.desc:0 "Tuhaf tütsülerle dolu bir odaya kendimi kilitledim. Tamamen dumanaltı bir ortamda tüm benliğimle dünyevi gerçekliğin ötesine geçmeye odaklanmış durumdayım.\n\nNe kadar süre geçtiğini bilmiyorum fakat birdenbire anlaşılamayan ışık hüzmeleri gözümü alıyor ve titrek bir ses duyuyorum. Tüm bunlar bir hayalden mi ibaretti, yoksa ilahın bir tezahürü müydü? İkisini birbirinden ayırt etmek mümkün mü?"
 learning_theology.3042.a:0 "Tekrar denemeliyim!"
 learning_theology.3042.a.tt:0 "Deneye devam edeceksiniz"
 learning_theology.3042.b:0 "İlginç. Bulgularımı kâğıda dökmeliyim."
 learning_theology.3043.desc:0 "Deneyler yapmaya devam ettikçe, meselenin özünü daha net bir şekilde görmeye başlıyorum. Artık ayine başlar başlamaz o aradığım duyguyu hissedebiliyorum.\n\nDünya denen kaos etrafımda dönmeye devam ederken huzur ve rahatlığı bu ayinlerde buluyorum."
 learning_theology.3043.a:0 "İşte aradığım şey bu!"
 learning_theology.3043.b:0 "Tanrısal değil ama rahatlatıcı olduğu kesin!"
 learning_theology.3044.desc:0 "Kadim metinleri karıştırmaya devam ettikçe daha fazla bilgiye erişiyorum. Antik [ROOT.Char.GetFaith.DevoteeNeuterPlural] ve onların bu uygulamaları [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] dininin dahi öncesine dayanıyor olabilir mi?\n\nBu olağanüstü bir bilgi..."
 learning_theology.3044.a:0 "İşte şimdi taşlar yerine oturuyor!"
 learning_theology.3044.b:0 "Biraz deney yapmaktan zarar gelmez..."
### TODO AGOT-CHANGED: learning_theology.3045.desc [AGOT: This is so frustrating! Whatever I do, I cannot capture the feeling I got from my first experiments into the higher mysteries.\n\nThat sense that #EMP something#! is there, just out of reach, is simply gone, no matter what I do! | TR: Artık bıktım! Ne yaparsam yapayım yaptığım ilk deneyde yaşadığım hisleri tekrar yaşayamıyorum.\n\nAradığım şey, görülebilenin ötesinde #EMP bir şeyler#! varmış duygusu... Beni tamamen terk etti!]
 learning_theology.3045.desc:0 "This is so frustrating! Whatever I do, I cannot capture the feeling I got from my first experiments into the higher mysteries.\n\nThat sense that #EMP something#! is there, just out of reach, is simply gone, no matter what I do!"
 learning_theology.3045.a:0 "O hissi tekrar yaşamalıyım!"
 learning_theology.3045.b:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] ile iletişime geçmek için duadan fazlasına ihtiyaç yok."
### TODO AGOT-CHANGED: learning_theology.3046.desc [AGOT: I have been seeking knowledge in the higher mysteries and experience for so long now, and yet... nothing! The only answer I have left is to go back to the very beginning, and perfectly recreate the conditions of my experiment.\n\nI need to commune with the divine. Am I being intentionally ignored?! | TR: Kadim bilgilere vakıf olmak adına kendimi harap etsem de elime hiçbir şey geçmedi! Tüm uğraşlarımın ardından başladığım yere dönmüş durumdayım. Belki de olmam gereken yer burasıdır, en başa dönüp ilk deneyimin şartlarını yeniden sağlamak...\n\nİlahilerle iletişime geçmenin bir yolunu bulmalıyım. Yoksa beni kasten görmezden mi geliyorlar?!]
 learning_theology.3046.desc:0 "I have been seeking knowledge in the higher mysteries and experience for so long now, and yet... nothing! The only answer I have left is to go back to the very beginning, and perfectly recreate the conditions of my experiment.\n\nI need to commune with the divine. Am I being intentionally ignored?!"
 learning_theology.3046.a:0 "Cevaplara ihtiyacım var!"
 learning_theology.3046.a.success:0 "Başarılı bir deney"
 learning_theology.3046.a.success.tt:1 "[GetTrait('lifestyle_mystic').GetName( GetPlayer )] özelliği kazanabilirsiniz"
 learning_theology.3046.a.failure:0 "Ne yapsam nafile!"
 learning_theology.3046.a.failure.tt:0 "Deneyleriniz delirmenize sebep olacak"
 learning_theology.3046.b:0 "Ne yapıyorum ben... Bu saçmalığa bir son vermenin vakti geldi."
 learning_theology.3047.desc:0 "İlahi olanla iletişime geçmek için antik ayinlere ihtiyacım yok. O zaten benimle konuşuyor. Duyabiliyorum. Endişelenmem gereken hiçbir şey yok, aramam gereken hiçbir şey yok. Hep benimle birlikte, her sabah, her akşam ve her gece.\n\nSadece benimle konuşuyor ve benim adımı zikrediyor!"
 learning_theology.3047.a:0 "[ROOT.Char.GetFaith.HighGodName] beni seçti! Ben seçilmiş kişiyim!"
 learning_theology.3051.t:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] Toprağındaki [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] Oyunu"
 learning_theology.3051.desc.intro:1 "Meşhur bir [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] oyun yazarı olan [passion_playwright.GetName] yeni eserini sergilemek istiyor:"
 learning_theology.3051.passion:0 "[ROOT.Char.GetFaith.random_GoodGodNames] Tutkusu"
 learning_theology.3051.arabian_nights:0 "İki Bin [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), ROOT.Char.GetCulture.GetNameNoTooltip, ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip ) ] Gecesi"
 learning_theology.3051.inferno:0 "[ROOT.Char.GetFaith.random_EvilGodNames] Cehennemi"
 learning_theology.3051.my_immortal:0 "[passion_playwright.GetRandomPositiveTrait]"
