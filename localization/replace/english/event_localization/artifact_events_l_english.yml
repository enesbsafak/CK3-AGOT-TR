 artifact.1001.t:0 "Her Şey Zamanla Eskir"
 artifact.1001.desc.antiquarian:1 "Antikacım [antiquarian.GetTitledFirstName] elinde bana ait olan [this_artifact.GetName] ile yanıma geldi."
 artifact.1001.desc.servant:2 "Bir hizmetkârım elinde bana ait olan [this_artifact.GetName] ile yanıma geldi."
 artifact.1001.desc.weapon:0 "\n\n"Süzerenim, cephaneliği temizlerken fark ettim ki bu [SCOPE.Custom('ThisArtifactType')] üzerinde hiçbir temiz nokta kalmayacak şekilde paslanmış. Bununla ilgili ne yapalım?'"\n\n[SCOPE.Custom('ThisArtifactType')|U] benim tarafımdan incellendi ve maliyeti fark etmeksizin yapılacak herhangi bir yeniden dövme işleminin bu eseri savaşa uygun hâle getiremeyeceğine karar verdim, tabii ki marjinal bir ücret ile sergilenmesi için temizlenebilir."
 artifact.1001.desc.other:0 "\n\n"Süzerenim kileri temizlerken fark ettim ki bu [SCOPE.Custom('ThisArtifactType')] Çok eskimiş ve dağılıyor! Bununla ilgili ne yapalım?'"\n\n[SCOPE.Custom('ThisArtifactType')] benim tarafımdan incelendi ve maliyeti fark etmeksizin yapılacak herhangi onarma işleminin bunu yeniden giyilebilir yapamayacağına karar verdim, tabii ki marjinal bir ücret ile sergilenmesi için temizlenebilir."
 artifact.1001.a:0 "Yapmaya değer bir çaba."
 artifact.1001.a.tt.free:0 "#instruction Bu [artifact|E] bedavaya dönüştürülebilir!#!"
 artifact.1001.a.tt:1 "[this_artifact.GetName] sadece [grandeur|E] ve [prestige|E] sağlayan [court_artifact|E] hâline gelir"
 artifact.1001.b:0 "Hayır, çok pahalı."


 manhunter:0 ""#EMP "Manhunter"#!""


 heartseeker:0 ""#EMP "Heartseeker"#!""
 artifact.1001.desc.kills_none:0 "[this_artifact.GetDesc]\n\nBu silah hiçbir zaman savaşta kullanılmadı, sadece küçük bir asilzadenin duvarında dekorasyon olarak hizmet ediyor."
 artifact.1001.desc.kills_one:0 "[this_artifact.GetDesc]\n\nBir kere düşmanını öldürmek için savaşta kullanılmış bir silah, süzerenin salonun gösterilmeye değer olduğunu kanıtladı."
 artifact.1001.desc.kills_some:0 "[this_artifact.GetDesc]\n\n[ROOT.Var('num_kills').GetValue|V0] düşmanı canından edip büyük bir savaşçının veya süzerenin salonunda yerini kazandı."
 artifact.1001.desc.kills_many:0 "[this_artifact.GetDesc]\n\nArtık savaşmak için uygun olmasa da aldığı [ROOT.Var('num_kills').GetValue|V0] can bu silahı büyük bir savaşçının salonunda sergilenmeye uygun bir güç sembolü hâline getirdi."
 artifact.1001.desc.kills_tons:0 "[this_artifact.GetDesc]\n\nArtık savaşmak için uygun olmasa da aldığı [ROOT.Var('num_kills').GetValue|V0] can bu silah görünüşüyle ona bakan herkeste korku ve huşu uyandıran bir efsane hâline getirdi."
 artifact.3000.t:0 "Parçalanmış Eser: Yeniden Kullanım"
 artifact.3000.desc.armorer_intro:0 "$armorer_camp_officer$ [antiquarian.GetTitledFirstName] yüzünde endişeli bir ifadeyle yanıma geldi.\n\n"[Select_CString(ROOT.GetCharacter.IsFemale, 'Leydim', 'Lordum' )], giderek [this_artifact.GetName] ve içinde bulunduğu durumdan dolayı daha çok endişelenmeye başladım. Kelimenin tam manasıyla dökülüyor!"
 artifact.3000.desc.antiquarian_intro:0 "$antiquarian_court_position$ [antiquarian.GetTitledFirstName] yüzünde endişeli bir ifadeyle yanıma geldi.\n\n"[Select_CString(ROOT.GetCharacter.IsFemale, 'Leydim', 'Lordum' )], giderek [this_artifact.GetName] ve içinde bulunduğu durumdan dolayı daha çok endişelenmeye başladım. Kelimenin tam manasıyla dökülüyor!"
 artifact.3000.desc.antiquarian:0 "\n\n"Onarmak için çok geç olabilir ama bu tamamen bir kayıp değil. Bana izin verirseniz, kırıp kullanışlı parçaları gelecek eserler için saklayabilirsiniz!""
 artifact.3000.desc.servant_intro:1 "Hizmetkârım yüzünde suçlu bir ifade ve arkasında sakladığı bir şeyle yanıma geldi.\n\n"[Select_CString(ROOT.GetCharacter.IsFemale, 'Leydim', 'Lordum' )], eser koleksiyonunuzu her zamanki gibi temizlerken fark ettim ki [this_artifact.GetName] onarılmanın mümkün olmadığı bir hâle gelmiş."


 artifact.3000.desc.servant:0 ""Sarayda bir uzman olmadan eski ihtişamına kavuşturmak mümkün olmayabilir, ama parçaları yeni bir eserde kullanılmak üzere saklasak iyi olur...""
 artifact.3000.a:0 "Bunu yapmak canımı acıtıyor ama parçalayın."
 artifact.3000.b:0 "Hâlâ kurtarılabilir!"
 artifact.3000.c:0 "İddiaya varım #EMP sen#! bu hâle getirdin!"
 artifact.3001.t:0 "İlham: Yeniden Kullanım"
 artifact.3001.desc:0 "[inspiration_owner.GetFirstName|U] bugün fırlayarak yanıma geldi.\n\n"[Select_CString(ROOT.GetCharacter.IsFemale, 'Leydim', 'Lordum' )]! Eski eşya odasında ilham için atılmış eşyaları ve kırık ıvır zıvıları araştırırken beklenmedik bir hazineye denk geldim. Görünüşe göre gelecekte kullanmak için bir eserden bazı parçalar bırakmışsınız... Yani, fırsat ayağınıza geldi!\n\nEğer bu parçaları projemde kullanırsam kaliteyi bozmadan malzemeler için gerekli altının bir kısmını size geri kazandırabilirim!""
 artifact.3001.a:0 "Harika bir haber!"
 artifact.3010.t:0 "Parçalanmış Eser: Satma"
 artifact.3010.desc.antiquarian:0 "\n\n"Muhtemelen bir hurdacı bu malzemeleri uygun bir fiyata almakla ilgilenebilir...""
 artifact.3010.desc.servant:0 "\n\n"Tamamen tanınmaz ve işe yaramaz hâle geldi! Biraz para kazanmak için hurda koleksiyoncusuna satabilirsiniz...""
 artifact.3010.a:0 "Olur, Zaten ihtiyacım yoktu."
 artifact.3010.a.tt:0 "[this_artifact.GetNameNoTooltip|U] tüccara satılır ve sonsuza kadar kaybolur."
 artifact.3010.b:0 "Bu eser #EMP BANA AİT!#!"
 artifact.3020.t:0 "Parçalanmış Eser: Uyarlama"
 artifact.3020.desc:0 "\n\n"Bir daha asla eski kullanımını kazanamayabilir ama bana müsaade ederseniz en azından geçmiş ihtişamının bir kısmını kurtarabilirim! Sonuçta bir süredir gücünüzün bir sembolü oldu...""
 artifact.3020.a:0 "En azından hâlâ bazı kullanımları var..."
 artifact.3020.b:0 "Sadece işini yap ve tamir et!"
 keepsake_trinket_name:0 "[this_artifact.GetNameNoTooltip] Yadigarı"
 keepsake_trinket_description:0 "[this_artifact.GetNameNoTooltip] parçaları [owner.GetTitledFirstNameNoTooltip] için $antiquarian_court_position$ tarafından yadigar olarak yeniden oluşturuldu."
 artifact.3030.t:0 "Parçalanmış Eser: Muhafaza"
 artifact.3030.desc:0 "\n\n"Eseri nasıl kurtaracağıma dair bir fikrim var. Geçenlerde gezgin panayırda gizemli bir adamdan zar oyununda eski bir parşömen kazandım. İçeriği simyaya ilgi duymamı sağladı! Parşömenin içeriğinde #EMP herhangi bir eseri#! yeni gibi yapacak gizli bir iksirden bahsediliyor. Lütfen denememe izin verin!""
 artifact.3030.a:0 "Olur, nasıl olsa bundan daha kötü olamaz..."
 artifact.3030.b:0 "#EMP Asla#! bu zırvalıklarla eserime dokunma!"
 artifact.3030.a.bigsuccess:0 "Eser herzamankinden daha temiz ve daha güçlü"
 artifact.3030.a.bigsuccess.t:0 "Eser onarılıp geliştirildi"
 artifact.3030.a.success:0 "Eser onarıldı"
 artifact.3030.a.success.t:0 "Eser onarıldı"
 artifact.3030.a.failure:0 "Onarma başarısız oldu"
 artifact.3030.a.failure.t:0 "Etkisiz onarma"
 artifact.3030.a.bigfailure:0 "Eser yok edildi"
 artifact.3030.a.bigfailure.t:0 "Eser yok edildi!"
 artifact.3040.t:0 "Parçalanmış Eser: Bir Teklif"


 artifact.3040.desc.antiquarian:0 ""$antiquarian_court_position$'ım [antiquarian.GetTitledFirstName], [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] eşliğinde yanıma yaklaşıyor.\n\n"[ROOT.GetCharacter.GetLadyLord], dikkatime [this_artifact.GetName]'inizin berbat durumda olduğu getirildi... Tüm çabalarıma rağmen, yeterli finansman olmadan onu korumak için yapabileceğim hiçbir şey yok!\n\nYine de, hazinenizi koruyacak olası bir çözüm buldum. [vassal.GetTitledFirstNameNoTooltip|U] minnettarlığınızın küçük bir nişanesi karşılığında masrafları üstlenmeyi teklif etti.""
 artifact.3040.desc.no_antiquarian:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yüzünde sahte bir pişmanlık ifadesi ile yanıma geldi.\n\n""[Select_CString(ROOT.GetCharacter.IsFemale, 'Leydim', 'Lordum' )], Bu tam bir #EMP utanç#!. Harika hazineniz [this_artifact.GetName] toz tutmaya terk edilmiş! Lütfen onarım masraflarını üstlenmeme izin verin – küçük bir iyilik karşılığında.""
 artifact.3040.a:0 "Bu işin içinde bir iş var... Ama tamam!"
 artifact.3040.b:0 "Ödeşmiş olduk."
 artifact.3040.c:0 "Senin yardımına ihtiyacım yok."
 artifact.3050.t:0 "Parçalanmış Eser!"
 artifact.3050.desc:0 "Elinizdeki yüksek kaliteli eser – [this_artifact.GetName] – [Concept( 'durability', 'dayanıklılığı' )|E] #N 0'a#! yaklaşıyor ve yok olabilir!"
 artifact.4000.t:0 "Lanet Söylentileri"
 artifact.4000.desc.antiquarian_intro:0 "$antiquarian_court_position$ [antiquarian.GetTitledFirstName] sonunda yanıma gelene kadar birkaç gündür endişeli görünüyordu.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], değerli varlıklarınızdan biri ile ilgili rahatsız edici bir haber aldım, eseriniz [this_artifact.GetName]. Saray bu eser ile ilgili dedikodularla çalkalanıyor, misafirler ve maiyetiniz ona korku ve şüpheyle bakıyor... #EMP Lanetli!#! olduğunu söylüyorlar,"
 artifact.4000.desc.servant_intro:0 "Birkaç gün geçtikten sonra fark ettim ki ben geldiğimde herkes konuşmayı kesse de hanemde bu söylentinin vızıltıları alışılmadık bir şekilde giderek artıyor.\n\nSonunda ne olduğunu anlamak için bir hizmetçiyi yakaladığımda bana şöyle cevap verdi: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], bilmiyor musunuz? Bu sizin eseriniz [this_artifact.GetName] ile alakalı! Herkes açıkça biliyor ki o eser #EMP lanetli!#!"
 artifact.4000.desc.stolen:0 "hiç kimse ona gerçekten sahip olamaz çünkü kaderinde her zaman çalınıp ve sorun çıkarmak var!"
 artifact.4000.desc.assassinated:0 "sahiplerine büyük talihsizlikler ve acımasız ölümler getirir!"
 artifact.4000.desc.ghost:0 "öfkeli bir ruha ev sahipliği yapıyor!"
 artifact.4000.desc.fallback:0 "[ROOT.Char.GetFaith.DevilName|U] adına kötü bir güçle lekelenmiş!"
 artifact.4000.desc.end:0 "\n\n"Belki aziz veya azizenin müdahalesi herkesi rahatlatabilir...""
 artifact.4000.cursed_name:1 "Lanetli [this_artifact.GetNameNoTooltip]"
 artifact.4000.cursed_desc:1 "[this_artifact.GetDesc]\n\nLanetli olmakla ünlenen bu eserin karşısında soylular ve köylüler sessizliğe kapılır ya da ilahi koruma için dua ederler."
 artifact.4000.a:0 "Hemen böyle bir kişiyi bulun!"
 artifact.4000.b:0 "Bırakalım herkes önünde korkudan dehşete düşsün!"
 artifact.4001.t:0 "Parçalanmış Eser: Kutsal Davet"


 artifact.4001.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ilgimi talep ediyor,""


 artifact.4001.desc.servant_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," telaşlı bir hizmetkâr, ciddi görünümlü bir karakter eşliğinde yanıma yaklaşıyor,""


 artifact.4001.desc:0 ""istediğiniz gibi, [this_artifact.GetName]'inizi kutsaması için kutsal bir [holy_man.GetWomanMan] bulundu. \n\n"Size [holy_man.GetFirstName]'i tanıtayım. Eminim [holy_man.GetHerHis] müdahalesi laneti kaldıracak ve herkesin gönlünü ferahlatacaktır.""
 artifact.4001.a:0 "[holy_man.GetFirstNameNoTooltip|U], elinden gelen en iyisini yap..."
 artifact.4001.a.success:0 "Lanet Kaldırıldı"
 artifact.4001.a.failure:0 "Lanet Devam Ediyor"
 artifact.4001.a.success.desc:0 "Lanet temizlendi"
 artifact.4001.a.failure.desc:0 "Lanet devam ediyor"
 artifact.4002.t:0 "Lanet Söylentileri: Karanlık Bir Ateş"
 artifact.4002.desc.antiquarian_intro:0 "[ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] yüzünde düşünceli bir ifade ile bana seslendi.""
 artifact.4002.desc.servant_intro:0 "Bir grup korkmuş hizmetkâr odama doğru giderken beni durdurdu ve onlardan biri dedi ki:"
 artifact.4002.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eseriniz [this_artifact.GetName] için oluşan kötü itibar yıllar geçtikçe artıyor bunun hakkında uyanık olmalısınız... Sizin maiyetiniz, hizmetkârlarınız ve hatta misafirler onun tarafından dehşete düşüyor!\n\nBir aziz veya azize çağırıp bu dehşete düşmüş hizmetkârlarınızın sonunda biraz rahat etmesini kabul edebilir misiniz?"
 artifact.4010.t:0 "Ölümcül Bir Silah Şöhret"


 artifact.4010.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], haberi duydunuz mu?" [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] yanıma yaklaşıyor.""
 artifact.4010.desc.servant_intro:0 "Salondaki hizmetkârlarınız arasındaki küçük bir gruptan heyecanlı bir ses duydum."
 artifact.4010.desc:1 "\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip|U] ve elindeki [this_artifact.GetName] için oluşmuş şöhret giderek daha uzaklara yayılıyor ve gittikçe büyüyor! Düşmanlarını çiçekmiş gibi kesen yenilmez [SCOPE.Custom('ThisArtifactType')] ve onun şanlı sahibi herkesin dillerinde!""
 artifact.4010.a:0 "Harika bir haber!"
 artifact_killer_1_name:1 "[this_artifact.Custom('RandomWeaponTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_2_name:1 "[this_artifact.Custom('RandomWeaponTitle2')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_3_name:1 "[this_artifact.Custom('RandomWeaponTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_4_name:1 "[this_artifact.Custom('RandomWeaponTitle4')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_1_desc:0 "[this_artifact.GetDesc]\n\nSavaş alanında 15'den fazla zafere eşlik eden bu silah sahibinin hünerlerini gösterir."
 artifact_killer_2_desc:0 "[this_artifact.GetDesc]\n\nSavaş alanında 30'dan fazla zafere eşlik eden bu silah düşmanlarına çile çektirir."
 artifact_killer_3_desc:0 "[this_artifact.GetDesc]\n\nSavaş alanında 50'den fazla zafere eşlik eden bu silah her zaman sahibini zafere taşır."
 artifact_killer_4_desc:0 "[this_artifact.GetDesc]\n\nSavaş alanında 100'den fazla zafere eşlik eden bu silah insanların dillerinde anılan bir efsane hâline gelmiştir."
 artifact.4020.t:0 "Ünlü Bir Zırh"
 artifact.4020.desc:1 "\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip|U] ve üzerindeki [this_artifact.GetName] ile savaş alanındayken yanlarında ölümsüz bir kahramanın yürüdüğünün herkes farkında!""
 artifact.4020.a:0 "Harika Bir Haber!"
 artifact_armor_1_name:1 "[this_artifact.Custom('RandomArmorTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_2_name:1 "[this_artifact.Custom('RandomArmorTitle2')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_3_name:1 "[this_artifact.Custom('RandomArmorTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_4_name:1 "[this_artifact.Custom('RandomArmorTitle4')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_1_desc:0 "[this_artifact.GetDesc]\n\nSavaşlarda sahibini 15'den fazla kez korumuş olan bu zırh giderek daha çok tanınıyor."
 artifact_armor_2_desc:0 "[this_artifact.GetDesc]\n\nSavaşlarda sahibini 30'dan fazla kez korumuş olan bu zırh savaş alanında isim yapmış."
 artifact_armor_3_desc:0 "[this_artifact.GetDesc]\n\nSavaşlarda sahibini 50'den fazla kez korumuş olan bu zırh hem dostları hem de düşmanları korkutuyor."
 artifact_armor_4_desc:0 "[this_artifact.GetDesc]\n\nSavaşlarda sahibini 100'den fazla kez korumuş olan bu zırh efsanevi eşyalarla karşılaştırılabilir."
 artifact.4030.t:0 "Halkımızın Tacı"


 artifact.4030.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName], yüzünde kocaman bir gülümseme ve elinde [this_artifact.GetName]'imle yanıma yaklaşıyor.""
 artifact.4030.desc.servant_intro:0 "Benim en değerli varlıklarımı temizlemekle görevli olan hizmetkârım elinde [this_artifact.GetName] ile birlikte yanıma geldi."
 artifact.4030.desc_emperor:1 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.GetTitleTierName] içinde çok sayıda nesil geçtikten sonra bu tacın artık imparatorluğun gücünün bir sembolü olarak görüldüğünü biliyor muydunuz?""
 artifact.4030.desc_kingdom:1 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.GetTitleAsNameNoTooltip] içinde çok sayıda nesil geçtikten sonra bu tacın artık [primary_title_scope.GetBaseNameNoTierNoTooltip] ile özdeşleşmiş bir parça olarak görüldüğünü biliyor muydunuz?""
 artifact_emperors_crown_name:1 "İmparatorluk [this_artifact.GetNameNoTooltip]"
 artifact_emperors_crown_desc:1 "[this_artifact.GetDesc]\n\nNesiller boyunca bu taç imparatorlara eşlik etti ve otoritenin bir sembolü hâline geldi."
 artifact_crown_special_name:1 "[primary_title_scope.GetNameNoTierNoTooltip] [this_artifact.GetNameNoTooltip]"
 artifact_crown_special_desc:1 "[this_artifact.GetDesc]\n\nBu taç uzun nesiller boyunca aynı unvana sahip hükümdarlar tarafından giyildi ve onların gücünün bir sembolü hâline geldi."
 artifact.4040.t:0 "Uzmanın Gözü"
 artifact.4040.desc:0 "Gözlerinden kıvılcımlar saçarak [helpful.Custom2('MyCharacterIntroduction', ROOT.Char)] yanıma geldi.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], fark ettim ki [this_artifact.GetName] fevkalade bir işçilik ile yapılmış... Yine de sadece benim gibi savaş alanınını deneyimlemiş gerçek bir uzman küçük ayarlamalar ile savaş için daha etkili bir silah hâline getirebilir!"\n\n[helpful.GetFirstNameNoTooltip|U] etrafta #EMP simetri#!, #EMP denge#! ve #EMP keskinlik#! hakkında bir o konuya bir bu konuya geçerken onu gözledim. Genel olarak #EMP minnettarlığımın naçizane bir göstergesi#! karşılığında eseri geliştireceğini anladım."
 artifact.4040.a:0 "Tamam, yapacağını yap."
 artifact.4040.a.tt:0 "[this_artifact.GetName|U] geliştirilir!"
 artifact.4040.b:0 "Yardımına ihtiyacım yok."
 artifact.4050.t:0 "Öfke Patlaması"
 artifact.4050.desc:0 "Bir süredir stres sanki üstüme bir dağ oturmuş gibi beni eziyor. Kaynama noktasına ulaşmışım gibi hissediyorum sadece patlamak için bir mazeret arıyorum.\n\nBugün büyük salona girdiğimde ahalinin dedikoduları, saray mensuplarının gevezelikleri ve danışmanların dikkatimi çekmek için rekabet etmesi... Bunların hepsi üst üste biniyor ve artık dayanamıyorum.\n\n"Elime aldığım ilk şeyi duvara çıldırmış gibi fırlatırken #EMP YETER!#!" diyerek bağırıyorum.\n\nSessizlik odayı kaplarken yerde paramparça bir hâle gelmiş olan [this_artifact.GetName] dikkatimi çekiyor. Aniden öfkemin yerini dehşetin aldığını hissediyorum..."
 artifact.4050.a:0 "Kahretsin!"
 artifact.4060.t:0 "[ROOT.Char.GetFaith.HighGodName|U] Adına Kutsanmış [SCOPE.Custom('ThisArtifactType')|U]"


 artifact.4060.desc:0 ""size [holy_man.GetFirstName]'i tanıtayım; topraklarınızda nam salmış, büyük bir takva sahibi [holy_man.GetWomanMan].\n\n"[holy_man.GetSheHe|U] dindar ve adil bir hükümdar olarak ününüzden derinden etkilendi ve hazinelerinizden birine ilahi koruma sağlamak istiyor."\n\n"İzin verir misiniz?""
 artifact.4060.a:0 "Teklifinizi alçakgönüllülükle kabul ediyorum."
 artifact.4060.b:0 "Gerekli değil."
 artifact_4060_blessed_artifact_name:1 "Kutsanmış [this_artifact.GetNameNoTooltip]"
 artifact_4060_blessed_artifact_desc:0 "[this_artifact.GetDesc]\n\nGeleneksel bir hikâyeye göre bu eşya bir aziz veya azize tarafından kutsanmış ve ilahi koruma sağlanmıştır. Bilgeler insansalarda inanmasalar da doğaüstü olaylara karışamazlar."
 artifact.4070.t:0 "İhlal Edilmiş Kutsal Emanet"
 artifact.4070.desc:0 "Kâfirleri kontrol etmek için mücadelede kullandığım değerli hazinem [this_artifact.GetName] beni [ROOT.Char.GetFaith.HighGodNamePossessive] gözünde daha iyi bir pozisyona getirmiş olmalı, yine de saraydaki bazı seslerle birlikte içimi kaplayan bir huzursuzluk duygusu var.\n\n#EMP "Kâfirler kutsal emanetmizi kirletti!" "Onu lanetlediler!" "Kim bilir onu hangi sapkın ayinlerde kullandılar!"#!\n\nMuhtemelen abartıyorlar ama "arındırmak" için süslü dinî bir tören yapmanın kimseye zararı olmaz."
 artifact.4070.a:0 "Hemen organize etmeye başlayalım!"
 artifact.4070.b:0 "Hayır, bunlar sadece batıl inanç."
 artifact.4080.t:0 "Usta Bir Düelistin Silahı"
 artifact.4080.desc:0 "\n\n"Herkes [ROOT.Char.GetTitledFirstNameNoTooltip] tarafından sahip olunan [this_artifact.GetName] hakkında konuşuyor! Görünüşe göre kimin kullandığı fark etmeksizin kullanan kişi asla düello kaybetmez! Ayrıca silahın sadece seçtiği kişilerin onu kullanmasına izin verdiğini duydum! Hatta geçen gün gezgin bir tüccarın şöyle dediğini işittim: bu yenilmez silahın şöhreti taaa memleketime kadar ulaştı!""
 artifact_duel_weapon_1_name:1 "[this_artifact.Custom('RandomDuelTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_duel_weapon_2_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle2')]"
 artifact_duel_weapon_3_name:1 "[this_artifact.Custom('RandomDuelTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_duel_weapon_4_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle4')]"
 artifact_duel_weapon_1_desc:0 "[this_artifact.GetDesc]\n\nDüelloda düşmanlarını en az 5 kez bozguna uğratmış bir silah, güvenilir ve şanslı olduğunu kanıtladı."
 artifact_duel_weapon_2_desc:0 "[this_artifact.GetDesc]\n\nDüelloda düşmanlarını en az 10 kez bozguna uğratmış bu silahın şöhreti giderek uzak diyarlara yayılıyor."
 artifact_duel_weapon_3_desc:0 "[this_artifact.GetDesc]\n\nDüelloda düşmanlarını en az 20 kez bozguna uğratmış bu silah ürkütücü bir itibar kazandı."
 artifact_duel_weapon_4_desc:0 "[this_artifact.GetDesc]\n\nDüelloda düşmanlarını en az 30 kez bozguna uğratmış bu silah arkasında sonsuza kadar hatırlanacak bir efsane bıraktı."
 artifact.6001.t:0 "Düşman Bayrağı"
 artifact.6001.desc.commander:1 "Bu savaşın nasıl hatırlanacağını düşünürken savaş alanını inceliyorum ve yerde yatan cansız cesetlere bakıyorum. Bu sırada bir grup asker yanıma geliyor ve beni kibarca selamlıyorlar.\n\n"
 artifact.6001.desc:0 "[combat_location.GetName|U] savaşı hayret verici bir zaferle sonuçlandı! Hevesle komutan [friendly_commander.GetTitledFirstName] tarafından yazılan raporu ulak aracılığı ile dinlerken aniden askerler bana döndü.\n\n"

 artifact.6001.desc.looting:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Savaş alanını... 'temizlerken' düşman sancağına rastladık! Onu geride bırakmak yazık olurdu diye düşündük, belki onu bir zafer anısı olarak saklamak istersiniz?""

 artifact.6001.desc.killed_defender:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Kalan düşmanları yiğitçe direnirken köşeye sıkıştırdık. Bu sancağı korurken canlarını verdiler.""
 artifact.6001.a:0 "Koleksiyonumda güzel bir parça olacak!"
 artifact.6001.b:0 "Kutlama ateşine atın, böyle işe yaramaz bir şeye ihtiyacım yok."
 artifact.6001.toast:0 "[combat_location.GetNameNoTooltip] topraklarında Sancak Kaybedildi"
 artifact.7000.a.boil_skull:0 "[skull_to_boil.GetFirstName], [skull_boiler.GetFirstName] tarafından parçalandı. Kafasını alıp kaynattı ve bir [Concept( 'court_artifact', 'saray eserine' )|E] dönüştürdü"
 artifact_rival_skull:0 "[ROOT.Char.GetTitledFirstName] için uzun zamandır sorun çıkaran rakibi [skull_to_boil.GetTitledFirstName] idam edildi ve [skull_boiler.GetFirstName] tarafından cesedi parçalara ayırıldı. Kafatası alınıp iyice kaynatılıp temizlendikten sonra alnına şu sözler kazıldı: "[skull_to_boil.Custom2('InsultAdjective', ROOT.Char)|U] [skull_to_boil.Custom2('InsultNoun', ROOT.Char)]"."
 artifact.7000.t:0 "Sonsuz Düşmanlar"
 artifact.7000.desc:0 "Oh, tanrıya şükürler olsun [skull_to_boil.GetFirstName] idam edildi üstelik #EMP benim#! emrim ile!\n\nZindanımda çıkardığı acı dolu çığlıkları özleyeceğimi itiraf etmeliyim... Belki de onun bir parçasını tutmalıyım bu sayede sinirlendiğimde hakaretler savurabileceğim bir şeyim olur?\n\nNasıl olsa [skull_boiler.GetFirstName] için yapacak daha önemli bir iş yok..."
 artifact.7000.a:0 "[skull_boiler.GetFirstNameNoTooltip], benim için kafatasını pişirip temizle. Hemen."
 artifact.7000.b:0 "Hayır #EMP bekleyemem#!, [skull_to_boil.GetFirstNameNoTooltip] ile ilgili her şeyi hemen yok et!"
 artifact.4090.t:0 "Elde Bir Kutsal Eser..."
 artifact.4090.desc.antiquarian:0 "Antikacım [antiquarian.GetTitledFirstName] bana tuhaf bir fikirle geldi. [that_artifact.GetName], [this_artifact.GetName] ile tek bir parça olacak şekilde birleştirilseydi, silahı elime her aldığımda [ROOT.Char.GetFaith.HighGodNamePossessive] kudretini daha yakından hissedebilirmişim....\n\n"Silah elinizdeyken ilahi bir güce sahip olacaksınız." diyor [antiquarian.GetTitledFirstNameNoTooltip], iman arzusuyla parlayan gözleri neredeyse odayı aydınlatıyordu."
 artifact.4090.desc:0 "[that_artifact.GetName] karşısında oturmuş ve güzelliğini takdir ederken aklıma bir fikir geliyor. [this_artifact.GetName] kabzasının içine bu kutsal eseri koyarsam silahı her elime aldığımda [ROOT.Char.GetFaith.HighGodNamePossessive] kudretini hissedebilirim."
 artifact.4090.a:0 "[ROOT.Char.GetFaith.HighGodName] için yapacağım bunu."
 artifact.4090.b:0 "Pek uygun olmayabilir."
 artifact.4090.a.tt:0 "Kutsal Eser ve Silah Birleştirildi"
 artifact_weapon_relic_desc:0 "[this_artifact.GetDesc]\n\nBir [ROOT.Char.GetFaith.GetName] kutsal eseri olan [that_artifact.GetNameNoTooltip], silahın kabzasının içinde yer alıyor."
