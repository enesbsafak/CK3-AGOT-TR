l_english:
 stress_threshold_cooldown_message:1 "[SCOPE.ScriptValue('stress_threshold_cooldown_duration_in_years')|V0] yıl sonra hâlâ [stressed|E] iseniz tekrar [Concept( 'mental_break', 'Sinir Krizine' )|E] girebilirsiniz."
 stress_threshold.0010.toast:2 "Stresle Başa Çıkılamıyor"
 stress_threshold.0010.text:0 "[stress_level|E] kazandınız"
 stress_threshold.0400.toast:2 "[stress|E] limitinizin üstüne çıktınız ve 3. [Concept( 'stress_level', 'Stres Seviyesine' )|E] ulaştınız"
 stress_threshold.1001.t:0 "Sinir Krizi: Karanlık Düşünceler"
 stress_threshold.1001.desc:0 "Suçluluk ve utanç duygusu peşimi bırakmıyor. Tüm günahlarım, tüm kusurlarım, tüm başarısızlıklarım... bu karanlık düşünceler yüzünden sabahları işime odaklanamıyorum, geceleri ise gözüme uyku girmiyor.\n\nBu düşünceleri aklımdan çıkartmak için bir şey yapmam gerek gibi hissediyorum ama ne yapabilirim ki?"
 stress_threshold.1001.contrite.gain:0 "Tüm günahlarımı itiraf etmeliyim!"
 stress_threshold.1001.contrite.effect:0 "Sırlarımı daha fazla saklayamam!"
 stress_threshold.1001.flagellant.gain:0 "Kamçı darbeleri günahlarımı silip süpürecektir."
 stress_threshold.1001.flagellant.effect:0 "Cezalandırılmayı hak ediyorum! Yaptığım her şey için!"
 stress_threshold.1001.improvident.gain:0 "Günahlarımın kefaretini ödemeliyim."
 stress_threshold.1001.improvident.effect:0 "Altına benden daha çok ihtiyacı olanlar var."
 stress_threshold.1001.drunkard.gain:0 "Birkaç kadeh içki beni kendime getirir..."
 stress_threshold.1001.drunkard.effect:0 "Zihnimi rahatlatana kadar içeceğim."

 stress_threshold.1001.hashishiyah.gain:0 "Biraz haşiş zihnimi rahatlatır..."

 stress_threshold.1001.hashishiyah.effect:0 "Bir kâse dolusu haşiş keki beni kendime getirir."
 stress_threshold.1001.journaller.gain:0 "Endişelerimi kâğıda dökmek odaklanabilmemi sağlar."
 stress_threshold.1001.journaller.effect:0 "Odamda bir süre yalnız kalacağım."
 stress_threshold.1001.endure:0 "Güçlü olup bu düşüncelere teslim olmayacağım!"
 stress_threshold.1011.t:0 "Sinir Krizi: Ahlaksız Düşünceler"
 stress_threshold.1011.desc:0 "Son zamanlarda aklımı şehvetli düşüncelerden ve erotik fantezilerden alamıyorum. Gündelik hayatımın zorluğu beni bu rahatlatıcı hayallere itiyor, bu hayallerin içinde kaybolduğumu hissediyorum.\n\nSon zamanlarda bu düşünceler işime odaklanamamama sebep olmaya başladı, bir şeyler yapmam gerekiyor."
 stress_threshold.1011.rakish.gain:0 "Geneleve uğramanın vakti geldi!"
 stress_threshold.1011.rakish.effect:0 "Geneleve bu gece benden başkası alınmayacak."
 stress_threshold.1011.rakish.tt:0 "Bu tür eylemler kendi içerisinde belli riskler taşır..."
 stress_threshold.1011.reclusive.gain:0 "Şehvetten kendimi kurtarmak için inzivaya çekilmeliyim!"
 stress_threshold.1011.reclusive.effect:0 "Sadece inzivada huzur bulabilirim!"
 stress_threshold.1011.conversion.interfaith:0 "Belki [new_faith.HighGodName] bana yardımcı olur?"
 stress_threshold.1011.conversion.intrafaith:0 "Belki [new_faith.HighGodName], [ROOT.Char.GetFaith.HighGodNamePossessive] beni terk ettiği durumlarda bana yardım eder."
 stress_threshold.1011.conversion.judaism:0 "Eski emirler beni koruyacaktır."
 stress_threshold.1011.conversion.christianity:0 "İsa mesih, beni bu günahlardan koru!"
 stress_threshold.1011.exercise.gain:0 "Belki de koşu rotamı değiştirmemin vakti gelmiştir..."
 stress_threshold.1001.exercise.effect:0 "İyi bir egzersiz şehvetle başa çıkmamı sağlar."
 stress_threshold.1011.endure:0 "Duygularımı kontrol altına alıp odaklanmaya çalışmalıyım!"
 stress_threshold.1501.t:0 "Sinir Krizi: Tekdüzelik"
 stress_threshold.1501.intro.desc:0 "Yataktan kalkıp gündelik işlerime odaklanmak her geçen gün daha zor bir hâl alıyor."
 stress_threshold.1501.helper.desc:0 "[scoped_helper.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] beni her zamanki gibi kahvaltı sofrasında beklese de, sözlerinin artık beni rahatlatmayacağını biliyorum."
 stress_threshold.1501.nohelper.desc:0 "Yataktan zar zor çıksam da ne günlük [ROOT.Char.Custom('GetCourt')] işleriyle, ne de kahvaltı yapmakla uğraşmak istiyorum."
 stress_threshold.1501.faith.desc:0 "\n\n[scoped_ruler.GetFaith.AltPriestTermPlural|U] bile her gün aynı teraneleri anlatıyor gibi."
 stress_threshold.1501.fallback.desc:0 "\n\nHayatın tekdüzeliğine dayanacak gücüm kalmadı."
 stress_threshold.1501.a:0 "Ona daha fazla dayanamıyorum!"
 stress_threshold.1501.b:0 "Sanırım yine kahvaltıyı atlayacağım."
 stress_threshold.1501.c:0 "Tek istediğim yalnız bırakılmak."
 stress_threshold.1501.d:0 "Hiçbir şeyin tadı yokken neden yemek yiyeyim ki?"
 stress_threshold.1501.e:0 "Bu karanlık düşüncelerin beni esir almasına izin veremem."
 stress_threshold.1501.f:0 "[scoped_ruler.GetFaith.GetAdherentName] olmanın bir anlamı kalmadı."

 stress_threshold.1501.g:0 "Neden görünüşümü korumak zorundayım?"

 stress_threshold.1501.h:0 "Artık #italic düzgün#! davranmaya zahmet edemem."
 stress_threshold.1502.t:0 "Sinir Krizi: Bıkkınlık"
 stress_threshold.1502.intro.desc:0 "Niye her şeyi kendim yapmak zorundayım? [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Kampımın', 'Sarayımın')] yarısı onlara emredileni yerine getirmekten âciz, diğer yarısı ise dediklerimi dahi anlamıyorken nasıl [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] için iyi bir lider olabilirim ki?"
 stress_threshold.1502.courtier.desc:0 "\n\nÖzellikle [scoped_courtier.GetFirstName], son zamanlarda iyice canımı sıkmaya başladı. Ne zaman görsem bir kenarda sızlanıyor, sürekli bir şeylerden şikâyet ediyor! Bir de [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_courtier'))] olacak!"

 stress_threshold.1502.nocourtier.desc:0 "$BULLET$[GetTrait('varangian').GetName( GetNullCharacter )] [GetCourtPositionType('bodyguard_court_position').GetName()]sı [Concept( 'aptitude', 'Yatkınlığını' )|E] arttırır ([aptitude|E] seviyesine bağlıdır)\n$BULLET$Şartları sağlayan [Concept( 'courtiers', 'Saray Mensuplarından' )|E] [GetTrait('varangian').GetName( GetNullCharacter )] ve [GetTrait('loyal').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliklerini' )|E] kazananların sayısı artar\n$BULLET$Daha çok Vareg Muhafızı belirir\n@warning_icon! #X Basileus'un ölümünden sonra Vareg Muhafızları bir miktar [gold_i] altın talep eder.#!"
 stress_threshold.1502.a:0 "Tam bir [scoped_courtier.Custom2('InsultAdjective', ROOT.Char)] [scoped_courtier.Custom2('InsultNoun', ROOT.Char)]!"
 stress_threshold.1502.b:0 "Gardiyan! Bana başka bir mahkûm getir!"

 stress_threshold.1502.c:0 ""Neden hepiniz beceriksiz #EMP aptallar#!sınız?!""
 stress_threshold.1502.d:0 "[ROOT.Char.Custom('GetDungeon')] ziyaretiyle kafamı dağıtmalıyım..."
 stress_threshold.1502.e:0 "Bu günler de geçecek."
 stress_threshold.1502.f:0 "Belki de talihsizliklerimi kâğıda dökmeliyim."
 stress_threshold.1502.g:0 "[scoped_ruler.GetFaith.HighGodName] aşkına, bir şeyler içmem lazım!"

 stress_threshold.1502.h:0 "Belki de etrafında bulunulmaz biri olurum!"
 stress_threshold.1503.t:0 "Sinir Krizi: Boşluk"
 stress_threshold.1503.desc:0 "Artık hiçbir şey beni tatmin etmiyor. Ne kadar uğraşırsam uğraşayım ne mutlu olabiliyorum ne de huzurlu. Hayatımda bir şeyler eksik.\n\nRuhumu emen bu boşluğu neyle doldurabilirim ki?"
 stress_threshold.1503.a.a:0 "Belki birkaç yeni mücevherle?"
 stress_threshold.1503.a.b:0 "Daha büyük bir taç yaptırmalıyım!"
 stress_threshold.1503.a.c:0 "Giysilerimden sıkıldım..."
 stress_threshold.1503.a.d:0 "Yeni, güçlü bir at almalıyım!"
 stress_threshold.1503.a.e:0 "Ünlü bir sanatçıya tablomu yaptırmanın vakti geldi!"
 stress_threshold.1503.b:0 "Bu acıyı giderse giderse [scoped_ruler.Custom('GetExpensiveMeal')] giderir." #krutygetarts
 stress_threshold.1503.e:0 "Keşke yapabileceğim bir şey olsaydı..."
 stress_threshold.1504.t:0 "Sinir Krizi: Sonsuzluk"
 stress_threshold.1504.desc:0 "Bazen sanki tüm dünya benim omuzlarım üstündeymiş gibi geliyor. [scoped_ruler.GetTitleAsNameNoTooltip] olarak sorumluluklarım, ilgilenmem gereken meseleler, vermem gereken kararlar bir türlü bitmiyor gibi.\n\nBir türlü kendime zaman ayıramıyorum."
 stress_threshold.1504.a:0 "Bir an olsun beni yalnız bırakamaz mısınız?!"
 stress_threshold.1504.b:0 "Bir şekilde zihnimi toparlamalıyım..."
 stress_threshold.1504.e:0 "Eh, benim görevim bu sonuçta."
 stress_threshold.1504.f:0 "Etrafım ahmaklarla çevrili!"
 stress_threshold.1504.g:0 "Düşüncelerimi kâğıda dökerek kendimi toplamaya çalışacağım."
 stress_threshold.1504.h:0 "Atımı hazırlayın, biraz dolaşmam gerek!"
 stress_threshold.1504.i: "Düşünmek için sessizliğe ihtiyacım var."

 stress_threshold.1504.j:0 "Sadece rahatlamam lazım... #EMP *osuruk*#!"
 stress_threshold.1601.t:0 "Sinir Krizi: Allak Bullak"
 stress_threshold.1601.desc:0 "Bir türlü odaklanamıyorum, kafam allak bullak! Önce [ROOT.Char.Custom('GetCourt')|l] ile ilgilenmem lazım, ondan sonra birliklerle ilgilenmem lazım, iş üstüne iş!\n\nKendi zihnim dahi bana ihanet ederken nasıl dinlenebilirim ki?!"
 stress_threshold.1601.profligate.gain:0 "Belki şık bir şey satın almam yeniden odaklanabilmemi sağlar..."
 stress_threshold.1601.profligate.effect:0 "Güzel bir şey satın aldıktan sonra her zaman daha iyi odaklanıyorum!"
 stress_threshold.1601.inappetetic.gain:0 "Yemekler dikkat dağıtmaktan başka bir şey yapmıyor."
 stress_threshold.1601.inappetetic.effect:0 "Dikkatimi dağıtan her şeyden kurtulacağım!"
 stress_threshold.1601.comfort_eater.gain:0 "Dolu bir mide odaklanabilmemi sağlar."
 stress_threshold.1601.comfort_eater.effect:0 "Karnım tokken her zaman daha iyi odaklanıyorum."
 stress_threshold.1601.rakish.gain:0 "Belki kendimi şehvete verebilirim..."
 stress_threshold.1601.rakish.effect:0 "Geneleve uğramak kafamı toplamamı sağlar."
 stress_threshold.1601.reclusive.gain:0 "Belki tek başıma kalırsam konsantre olabilirim..."
 stress_threshold.1601.reclusive.effect:0 "Yalnız kaldığımda daha iyi odaklanıyorum..."

 stress_threshold.1601.uncouth.gain:0 "Belki görünüşe daha az zaman ayırırsam daha iyi düşünebilirim..."

 stress_threshold.1601.uncouth.effect:0 "Başkalarının benim hakkımda ne düşündüğünü umursamadığımda çok daha iyi odaklanabiliyorum."
 stress_threshold.1601.irritable.gain:0 "Belki etrafımdaki herkes bir #EMP sussa#! odaklanabilirim!"
 stress_threshold.1601.irritable.effect:0 "Herkese #EMP sessiz olmalarını#! söyleyeceğim!"

 stress_threshold.1601.confider.gain:0 ""[friend.GetFirstNameNoTooltip], dostum, düşüncelerimi toplamama yardım et!""

 stress_threshold.1601.confider.effect:0 ""[friend.GetFirstNameNoTooltip], lütfen her zamanki gibi beni dinle!""
 stress_threshold.1601.athletic.gain:0 "Sağlam kafa sağlam vücutta olur demişler..."
 stress_threshold.1601.athletic.effect:0 "Hiçbir şey beni egzersiz kadar sakinleştirmiyor!"
 stress_threshold.1601.contrite.gain:0 "Günahlarımı itiraf ederek zihnimi yatıştıracağım."
 stress_threshold.1601.contrite.effect:0 "Günahlarımı itiraf etmeliyim ancak bu şekilde kendimi kurtarabilirim."
 stress_threshold.1601.flagellant.gain:0 "Acı zihni keskinleştirir demişler..."
 stress_threshold.1601.flagellant.effect:0 "Acı zihnimi berraklaştırır."
 stress_threshold.1601.improvident.gain:0 "Belki de hayırseverlik yaparak zihnimi yatıştırabilirim?"
 stress_threshold.1601.improvident.effect:0 "Hayırseverlik her zaman sakinleşmemi sağlar."
 stress_threshold.1601.drunkard.gain:0 "Belki birkaç kadeh içkiden sonra kendime gelirim..."
 stress_threshold.1601.drunkard.effect:0 "Ayık değilken daha iyi odaklandığım bir gerçek."

 stress_threshold.1601.hashishiyah.gain:0 "Biraz haşişle zihnimi yatıştırabilirim...."

 stress_threshold.1601.hashishiyah.effect:0 "Hiçbir şey haşiş kekleri gibi zihnimi yatıştıramıyor."
 stress_threshold.1601.journaller.gain:0 "Düşüncelerimi kâğıda dökmek kafamı toplamamı sağlayacaktır."
 stress_threshold.1601.journaller.effect:0 "Yazmak her zaman daha iyi odaklanabilmemi sağlıyor!"
 stress_threshold.1601.burdened.gain: "Daha iyi bir yerde olduğumun hayalini kuracağım."
 stress_threshold.1601.burdened.effect: "İyi şeyleri hayal etmek her zaman yardımcı olur!"
 stress_threshold.1601.endure_no_option:0 "Dayanmalıyım... Yapabileceğim başka bir şey yok!"
 stress_threshold.1602.t:0 "Sinir Krizi: İçimdeki Fırtına"
 stress_threshold.1602.desc:0 "Duygularım her geçen gün daha da istikrarsız bir hâl alıyor. Neşe dolu duygularım yerini bir anda derin bir kedere bırakıyor. Bu durum etrafımdakilerin dahi dikkatini çekmiş durumda.\n\nKeşke ruhumdaki fırtınayı sakinleştirmemin bir yolu olsaydı!"
 stress_threshold.1602.profligate.gain:0 "Yeni ve parlak bir şey beni kendime getirir."
 stress_threshold.1602.profligate.effect:0 "Gerçek neşeye ancak bu şekilde ulaşabilirim!"
 stress_threshold.1602.inappetetic.gain:0 "Bir şey yemezsem, bir şey hissedecek enerjim olmaz..."
 stress_threshold.1602.inappetetic.effect:0 "Duygularımı açlıkla bastıracağım."
 stress_threshold.1602.comfort_eater.gain:0 "En azından yiyecekler beni daha iyi hissettiriyor."
 stress_threshold.1602.comfort_eater.effect:0 "Yemek yemek gibisi yok."
 stress_threshold.1602.rakish.gain:0 "Güçlü bir şehvet duygusu diğer duygularımı bastırır."
 stress_threshold.1602.rakish.effect:0 "Tutku ve şehvet gibi beni kendime getiren bir şey yok!"
 stress_threshold.1602.reclusive.gain:0 "Belki yalnız kalarak sakinleşebilirim..."
 stress_threshold.1602.reclusive.effect:0 "Kafamı toplamamın tek yolu bir süreliğine yalnız kalmak."

 stress_threshold.1602.uncouth.gain:0 "Belki kendimi bırakırsam bu daha kolay olur..."

stress_threshold.1602.uncouth.effect:0 "Kendimi bıraktığımda çok daha iyi hissediyorum."
 stress_threshold.1602.irritable.gain:0 "İnsanlar beni #EMP rahat bıraksalar#! her şey daha kolay olurdu!"
 stress_threshold.1602.irritable.effect:0 "Onlara benim #EMP peşimi bırakmalarını#! söyleyeceğim!"
 stress_threshold.1602.confider.gain:0 "[friend.GetFirstNameNoTooltip] ile konuşarak kendime gelebilirim."
 stress_threshold.1602.confider.effect:0 "[friend.GetFirstNameNoTooltip] ile konuşmak bana iyi geliyor."
 stress_threshold.1602.athletic.gain:0 "Kendime gelene kadar koşacağım."
 stress_threshold.1602.athletic.effect:0 "İyi bir koşu her zaman sakinleşmemi sağlar."
 stress_threshold.1602.contrite.gain:0 "Günahlarımı itiraf edersem sakinleşebilirim..."
 stress_threshold.1602.contrite.effect:0 "İtiraf ettikten sonra kendimi daha iyi hissediyorum."
 stress_threshold.1602.flagellant.gain:0 "Acıyla diğer duyguları bastırabilirim..."
 stress_threshold.1602.flagellant.effect:0 "Acı dışında başka bir şey hissetmezsem ortada sorun kalmaz."
 stress_threshold.1602.improvident.gain:0 "Hayırseverliğin sağladığı minnet tüm fırtınaları dindirecek güçtedir."
 stress_threshold.1602.improvident.effect:0 "Bağış yapmak bana huzur veriyor..."
 stress_threshold.1602.journaller.gain:0 "Kendime gelene kadar duygularımı kâğıda dökeceğim."
 stress_threshold.1602.journaller.effect:0 "Yazmak beni sakinleştiriyor."
 stress_threshold.1602.drunkard.gain:0 "Yeteri kadar içkiyle bastırılamayacak duygu yoktur..."
 stress_threshold.1602.drunkard.effect:0 "Duygularımı bastırmak için tek ihtiyacım olan şey içki."

 stress_threshold.1602.hashishiyah.gain:0 "Belki biraz haşiş zihnimi sakinleştirir..."

 stress_threshold.1602.hashishiyah.effect:0 "Haşiş her zaman beni rahatlatıyor."
 stress_threshold.1602.burdened.gain: "Başka bir şey üzerine düşünebilsem, #EMP herhangi#! bir şey."
 stress_threshold.1602.burdened.effect: "Başka şeyler üzerine düşünürsem sakinleşebilirim."
 stress_threshold.2001.t:0 "Sinir Krizi: Nankörlük"
 stress_threshold.2001.desc:0 "Nankör yaratıklar! Onlar için yaptığım bunca fedakârlıktan haberleri yok mu?\n\nGünbegün [ROOT.Char.Custom('GetRealmOrDomicile')|l] daha iyi olsun diye kendimi paralıyorum, buna rağmen aldığım yegâne karşılık daha fazla şikâyet ve bitmek tükenmek bilmeyen taleplerden ibaret!\n\nŞimdi de [victim.GetFirstName] benim emirlerimi sorguluyor!"
 stress_threshold.2001.arbitrary.gain:0 "[ROOT.Char.GetTitleAsNameNoTooltip] benim, burada benim sözüm geçer!"
 stress_threshold.2001.arbitrary.effect:0 "Burada her şeye ben karar veririm!"
 stress_threshold.2001.imprison_victim:0 "Bakalım [victim.GetFirstNameNoTooltip] bir [ROOT.Char.Custom('GetDungeon')] içinde yatıp kalkarken nasıl hissedecek!"
 stress_threshold.2001.endure:0 "Sabırlı olmak benim görevim..."
 stress_threshold.2101.t:0 "Sinir Krizi: Soğukluk"
 stress_threshold.2101.desc:0 "Kimi zamanlar [ROOT.Char.Custom('GetCourt')|l] içerisinde kendimi bir yabancı gibi hissediyorum.\n\n[ROOT.Char.Custom('GetCourtierPlural')] bana yan yan bakıyor, nereye gidersem gideyim tuhaf bir sessizlik oluyor... Ne oldu bana? Niye artık kendi halkım tarafından dışlanıyorum?"
 stress_threshold.2101.witch.gain:0 "Tıpkı [ROOT.Char.GetFaith.WitchGodName] gibi, kimsesizin tekiyim."
 stress_threshold.2101.witch.effect:0 "En azından [ROOT.Char.GetFaith.WitchGodName] beni anlayacaktır."
 stress_threshold.2101.drunkard.effect:0 "Tek gerçek dostum [ROOT.Char.Custom('RegionalAlcoholicDrink')]."

 stress_threshold.2101.hashishiyah.effect:0 "En azından haşiş keklerim beni yargılamıyor."
 stress_threshold.2101.endure:0 "Belki de tüm bunlar benim kafamda kurduğum şeylerdir..."
 stress_threshold.2201.t:0 "Sinir Krizi: Kızgınlık"

 stress_threshold.2201.desc.insult_adventurer:0 ""Saraylım olabilirsin, [character_to_yell_at.GetFirstName], ama aynı zamanda [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)]'sin!"\n\n"

 stress_threshold.2201.desc.insult:0 ""[character_to_yell_at.GetTitleAsName] olabilirsin, [character_to_yell_at.GetFirstName], ama aynı zamanda [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)]'sin!"\n\n"
 stress_threshold.2201.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('character_to_yell_at'))|U] şaşkın bir yüz ifadesiyle bana bakıyor... Son zamanlarda çok #EMP sinirli#! hissediyorum ve herkes benim sinirimi daha da arttırıyor.\n\n"

 stress_threshold.2201.desc_liege:0 ""Ne oldu sana, [ROOT.Char.GetTitledFirstNameNoTooltip]?! Bu davranış kabul edilemez.""

 stress_threshold.2201.desc_vassal:0 ""Hükümdarım, bu davranışın anlamı ne?!""
 stress_threshold.2201.desc.calm:0 " Normalde çok da sakin birisiniz...""

 stress_threshold.2201.desc.ending:0 """
 stress_threshold.2201.a:0 "Ne dediğimi duydun!"
 stress_threshold.2201.save:0 "Diyelim ki biri böyle dedi, nasıl bir yanıt verirdin?"
 stress_threshold.2201.save_tt:0 "Onu deniyormuşum gibi yapacağım."
 stress_threshold.2201.liege:0 "Özür dilerim efendim, kendime hâkim olmaya çalışacağım."
 stress_threshold.2201.c:0 "Özür dilerim, kendime daha iyi hâkim olmaya çalışacağım."
 stress_threshold.2202.t:0 "Kızgınlık"
 stress_threshold.2202.desc.liege:0 "Süzerenim [stress_character.GetTitledFirstName], bugün hiçbir şey yokken bir anda öfkeli bir biçimde etrafındakilere bağırmaya başladı."
 stress_threshold.2202.desc.vassal:0 "Vasalım [stress_character.GetTitledFirstName], bugün hiçbir şey yokken bir anda öfkeli bir biçimde etrafındakilere bağırmaya başladı."
 stress_threshold.2202.desc.other_relationship:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('stress_character'))|U] [stress_character.GetTitledFirstName] bugün hiçbir şey yokken bir anda öfkeli bir biçimde etrafındakilere bağırmaya başladı."
 stress_threshold.2202.desc:0 "Kendisi son zamanlarda stresli günler geçiriyor fakat"
 stress_threshold.2202.desc.rival:0 "kendisini açıklaması istendiğinde hakaretler yağdırmaya devam etmesi herkesi şaşkına çevirdi."
 stress_threshold.2202.desc.other:0 "böyle davranması da ona hiç yakışmadı..."
 stress_threshold.2202.a:0 "Ben de ona aynı şekilde yanıt vereceğim. [stress_character.Custom2('InsultNoun'), ROOT.Char]!"
 stress_threshold.2202.b:0 "Demek ki o bile zor günler geçirebiliyor..."
 stress_threshold.3001.t:0 "Sinir Krizi: Gaipten Sesler"
 stress_threshold.3001.desc:0 "[SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Kampım', 'Sarayım')] yalanlar ve sahtekârlıklardan başka bir şey bilmeyedursun, koşulsuz şartsız gerçeği söyleyecek kişileri buldum bile.\n\nOnlar benimle yaşıyorlar. Kafamın içinde.\n\nGerçeği bildiklerini söylüyorlar...\n\nAma gerçekten biliyorlar mı?"
 stress_threshold.3001.possessed.gain:0 "Evet, sadece bu sesler bana gerçeği söylüyor!"
 stress_threshold.3001.possessed.effect:0 "Evet, gerçeği, gerçek gerçeği biliyorlar..."
 stress_threshold.3001.naked_run:0 "Çıplak koşarak içimdeki şeytanlardan kurtulmalıyım!"
 stress_threshold.3001.endure:0 "Bu sesleri dinlememeliyim..."
 stress_threshold.3101.t:0 "Sinir Krizi: Yanlışlar"
 stress_threshold.3101.desc:0 "Her şey... yanlış. Bu [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'çadır', 'oda')] yanlış. Zemin yanlış. Hava bile yanlış!\n\nNiye her şey böyle? Kim yaptı bunları?\n\nHer şeyi yanlış yapan kim!?"
 stress_threshold.3101.kill_victim:0 "[victim.GetFirstNameNoTooltip]! Kesin onun işi!"
 stress_threshold.3101.lunatic.gain:0 "[ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')|U]... O küçük canavarlar yaptı!"
 stress_threshold.3101.lunatic.effect:0 "Hain [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] geri dönmüş!"
 stress_threshold.3101.lunatic.tt:0 "#F Bir meşale getirin!#!"
 stress_threshold.3201.t:0 "Sinir Krizi: Fazla Yük"
 stress_threshold.3201.desc:0 "Artık her şey çok fazla geliyor, niye uğraşıyorum ki?\n\nAkşam yemeğinde bile rahat yok. [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Kampın', 'Sarayın')] mali durumuyla ilgilenmem gerek, bir düzine anlaşmazlığı gidermem gerek, gerek de gerek!\n\n"İyi misiniz?" diye seslendi [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName], kaygılı bir ses tonuyla."
 stress_threshold.3201.depressed.gain:0 "Ne fark eder ki? Vazgeçtim..."
 stress_threshold.3201.depressed.effect:0 "Hayatta hiçbir şeyin anlamı yok..."

 stress_threshold.3201.help:0 ""[vassal.GetFirstNameNoTooltip]... Lütfen bana yardım et.""

 stress_threshold.3201.wrathful.gain:0 ""Hayır, seni [vassal.Custom2('InsultAdjective', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)], ben #EMP iyi#! değilim!""

 stress_threshold.3201.wrathful.effect:0 ""Sana kimin #EMP iyi#! olduğunu göstereceğim, seni [vassal.Custom2('InsultAdjective', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)]!""
 stress_threshold.3201.wrathful.effect.success:0 "[vassal.GetTitledFirstName] güzel bir dayak yedi"
 stress_threshold.3201.wrathful.effect.failure:0 "[vassal.GetTitledFirstName] sizi defetmeyi başardı"
 stress_threshold.3301.t:0 "Sinir Krizi: Kalp Acısı"
 stress_threshold.3301.desc_man:0 "Ansızın göğsüme keskin bir acı saplandı. Tutunacak bir yer bulmaya çalışırken acının sol koluma yayıldığını hissettim. Başım dönüyor...\n\nBenim... buna zamanım yok! Yapacak işlerim var!\n\nAdım atmaya çalışmamla birlikte yere yığıldım. Yardım için seslenmeye çalıştığımda dudaklarımdan çıkan yegâne şey hafif bir mırıltı.\n\nGöğsümdeki acı büyüdükçe karanlık gözlerimi karartmaya başlıyor, kalbimin teklediğini #EMP hissediyorum#!."
 stress_threshold.3301.desc_woman:0 "Bir süredir mide yanmasıyla baş ediyorum. Tüm önerileri denedim, karnımın üstüne yumuşak yün koydum, yavaş yürüyüşler gerçekleştirdim...\n\nBirden nefes alamadığımı fark ettim, tutunacak bir yer arıyorum. Ne- ne oluyor?! Yardım için seslenmeye çalıştığımda dudaklarımdan çıkan yegâne şey hafif bir mırıltı.\n\nCanım çok #EMP acıyor#!! Dayanılmaz acı omuzlarımdan sol koluma doğru uzanırken kayarak yere düşüyorum.\n\nBir anda gözlerim kararıyor."
 stress_threshold.3301.a:0 "#EMP #DIE1 Ah...!#!#!"
