l_english:
 stress_trait_ongoing.0501.t:0 "Rahatlatıcı Bir Akşam"
### TODO AGOT-CHANGED: stress_trait_ongoing.0501.desc [AGOT: The business of ruling the realm has been so stressful, recently. If it's not this, it's that, if it's not that, it's this. An endless parade of peasants, priests, and problems, all expecting #EMP me#! to solve their every petty concern.\n\nI deserve a day to myself, with no suiters or petitioners, no diplomats or judges. Just me and this cup with a bit of milk of the poppy... | TR: Ülke yönetme işi son zamanlarda iyice stresli bir hâl aldı. Tam işler yoluna girdi diyorsun başka bir sorun patlak veriyor, o sorunu çözüyorsun başka bir problem çıkıyor. Bitmek tükenmek bilmeyen köylüler, rahipler ve onların problemleri. Hepsi en ufak problemlerini dahi #EMP benim#! çözmemi bekliyor.\n\nArtık bir oturup dinlenmemin vakti geldi. Sırada bekleyen köylüler, diplomatlar veya yargıçlar olmaksızın, sadece ben ve bir kâse dolusu haşişli kek...]
 stress_trait_ongoing.0501.desc:0 "The business of ruling the realm has been so stressful, recently. If it's not this, it's that, if it's not that, it's this. An endless parade of peasants, priests, and problems, all expecting #EMP me#! to solve their every petty concern.\n\nI deserve a day to myself, with no suiters or petitioners, no diplomats or judges. Just me and this cup with a bit of milk of the poppy..."
 stress_trait_ongoing.0501.a:0 "İşe dönme zamanı!"
 stress_trait_ongoing.0501.b:0 "Bir günden bir şey olmaz..."
 overworking_diplomacy_modifier:0 "Fazla Mesai: Diplomasi"
 overworking_diplomacy_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_martial_modifier:0 "Fazla Mesai: Askeriye"
 overworking_martial_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_stewardship_modifier:0 "Fazla Mesai: İdare"
 overworking_stewardship_modifier_desc:0 "Bu karakter işini zihinsel sağlığının önüne koyuyor."
 overworking_intrigue_modifier:0 "Fazla Mesai: Entrika"
 overworking_intrigue_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 overworking_learning_modifier:0 "Fazla Mesai: Öğrenim"
 overworking_learning_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
 stress_trait_ongoing.0506.t:0 "Rahatlama"
 stress_trait_ongoing.0506.desc_leper:0 "Bu hastalık bedenimi yavaşça tüketiyor, günden güne vücudumun zayıfladığını hissediyorum. İnsanlar bana baktıklarında bir [ROOT.GetCharacter.GetTitleAsNameNoTooltip] değil, çaresiz bir cüzzam hastası görüyor."
 stress_trait_ongoing.0506.desc_gout_ridden:0 "Uzuvlarım her geçen gün daha fazla ağrıyor. Saatler süren ağrılar günbegün dayanılmaz bir ızdırap yaşamama sebep oluyor. Bazen bu ağrı işkence misali bir artıp bir azalmaktansa, hep aynı şiddette olsaydı daha iyi mi olurdu diye düşünüyorum."
 stress_trait_ongoing.0506.desc_cancer:0 "Haftalar geçip giderken her gün acaba bugün ne hâle düşeceğim diye düşünerek uyanıyorum. Bazı günler dayanılabilir olsa da, diğer günler güçlükle hareket edebiliyorum. Nefesim her geçen gün ağırlaşıyor. Bu dünyada geri kalan vaktimin her geçen gün sonuna yaklaştığımı hissedebiliyorum. Ömrüm, içten içe beni mahveden kanser tarafından çalındı."
 stress_trait_ongoing.0506.desc_disfigured:1 "Vücudumdaki yaralar iyileşmiş olabilir ama ruhumdaki yaralar olduğu gibi duruyor. Yüzümün geldiği hâlin acısı hâlâ taze. Izdırap dolu anlara geri dönmek için parmağımı eski yaralarımın üstünde gezdirmem yeterli."
 stress_trait_ongoing.0506.desc_maimed:0 "Öksürdüğümde yere bir miktar mukus ve kan dökülüyor. Bu yeni bir hastalık mı yoksa eski hastalıklarımın bir gelişimi mi onu bile bilmiyorum. Tek bildiğim çektiğim ağrıların zayıf bedenimi her geçen gün yok ettiği." #krutygetarts
 stress_trait_ongoing.0506.desc_one_eyed:0 "Eskiden gözümün olduğu boşluk hâlâ acı vermeye devam ediyor. Keskin bir acı. Kötü günlerimde tuhaf görüntüler ve doğal olmayan silüetler görüyorum."
 stress_trait_ongoing.0506.desc_one_legged:0 "Parmaklarımı bacağımdan kalan boğumlu kısımda gezdiriyorum. Kimi zaman özellikle alışık olduğum yollarda yürüdüğümde sanki bacağım varmış gibi hissettiğim oluyor. Sonra tekrardan bacağımı kaybetmeme sebep olan acıyı hissediyorum, sanki gerçekmişcesine, zihnim o andan kurtulamıyor."
 stress_trait_ongoing.0506.desc_wounded:0 "Parmaklarım yaralarıma dokunduğunda dayanılmaz bir acı çekiyorum. Kollarım yara kabuklarından gelen kırmızı ve siyah tozlarla kaplı. Acılarım yaralarımın hâlâ taze olduğunu her gün bana hatırlatıyor."
 stress_trait_ongoing.0506.desc_fallback:0 "Ağrılar vücudumu mahvediyor, tüm bunlar yorulmuş zihnim için çok fazla. Bir şekilde rahatlamaya ihtiyacım var."
### TODO AGOT-CHANGED: stress_trait_ongoing.0506.desc [AGOT: \n\nMilk of the poppy should ease the pain, for a time. The only question is whether to consume it alone, or if company would help cheer me. [medication_friend.GetTitledFirstName] did ask if I wanted a companion this evening... | TR: \n\nHaşiş bir süreliğine de olsa ağrılarımı hafifletecektir. Asıl soru tek başıma mı yoksa başka biriyle birlikte mi alacağım. [medication_friend.GetTitledFirstName] bu akşam boş olup olmadığımı sormuştu...]
 stress_trait_ongoing.0506.desc:0 "\n\nMilk of the poppy should ease the pain, for a time. The only question is whether to consume it alone, or if company would help cheer me. [medication_friend.GetTitledFirstName] did ask if I wanted a companion this evening..."
 stress_trait_ongoing.0506.a:0 "Bir süre yalnız kalmaya ihtiyacım var."
 hashish_alone_modifier:0 "Yalnız Rahatlama"
### TODO AGOT-CHANGED: hashish_alone_modifier_desc [AGOT: This character is managing their pain with milk of the poppy in the evenings. | TR: Bu karakter acısıyla baş etmek için akşamları haşişli kekler yiyor.]
 hashish_alone_modifier_desc:0 "This character is managing their pain with milk of the poppy in the evenings."
 stress_trait_ongoing.0506.b:0 "Belki [medication_friend.GetFirstNameNoTooltip] benimle paylaşmak ister?"
 hashish_with_friend_modifier:0 "Bir Dostla Birlikte Rahatlama"
### TODO AGOT-CHANGED: hashish_with_friend_modifier_desc [AGOT: This character is spending their evenings with a good friend and shared milk of the poppy. | TR: Bu karakter akşamlarını dostuyla birlikte haşiş tüketerek geçiriyor.]
 hashish_with_friend_modifier_desc:0 "This character is spending their evenings with a good friend and shared milk of the poppy."
 stress_trait_ongoing.0511.t:0 "Her Zaman Olduğu Gibi"
### TODO AGOT-CHANGED: stress_trait_ongoing.0511.desc [AGOT: I am enjoying a cool evening in the gardens of [hashishiyah_capital.GetNameNoTierNoTooltip], sat casually sipping milk of the poppy, when I suddenly feel the heavy, spittle-flecked breath of an enraged [crusty_old_person.GetTitledFirstName] on my cheek.\n\n | TR: Önümde haşişli kek dolusu bir kâse ile güzel bir akşam geçiriyorum. Bir anda [crusty_old_person.GetTitledFirstName] önümde beliriyor ve öfkeli bir biçimde konuşmaya başlıyor.\n\n]
 stress_trait_ongoing.0511.desc:0 "I am enjoying a cool evening in the gardens of [hashishiyah_capital.GetNameNoTierNoTooltip], sat casually sipping milk of the poppy, when I suddenly feel the heavy, spittle-flecked breath of an enraged [crusty_old_person.GetTitledFirstName] on my cheek.\n\n"Put down that accursed-cup, [ROOT.GetCharacter.GetFirstNameNoTooltip], and cease clouding your mind! [crusty_old_person.GetFaith.HighGodName] did not put you on this Earth so that you could waste your time away in a stupor!""
 stress_trait_ongoing.0511.a:0 "Haklısın! Derhâl bu işe bir son vermeliyim."
### TODO AGOT-CHANGED: stress_trait_ongoing.0511.a_flavour [AGOT: You pour out the milk of the poppy | TR: Haşişli kekleri atacaksınız.]
 stress_trait_ongoing.0511.a_flavour:0 "You pour out the milk of the poppy"
 stress_trait_ongoing.0511.b:0 "<derin bir nefes> Haklısın, #EMP ihtiyar#!."
### TODO AGOT-CHANGED: stress_trait_ongoing.0511.b_flavour [AGOT: Pour another cup. | TR: Bütün. Kekleri. Yemeliyim.]
 stress_trait_ongoing.0511.b_flavour:0 "Pour another cup."
 stress_trait_ongoing_0516.t:0 "Gezgin Zih—"
### TODO AGOT-ONLY: stress_trait_ongoing_0516.desc [AGOT: ]
 stress_trait_ongoing_0516.desc:0 ""—nd that is why this meeting is so important".\n\nWuh? Oh, right, yes, the meeting with [important_guest.GetTitledFirstName]. About... Something. What #EMP were#! we talking about? [important_guest.GetSheHe|U] looks very serious about it, whatever it was.\n\nI reach out, pour another cup of milk of the poppy, and begin sipping thoughtfully. [important_guest.GetFirstNameNoTooltip] raises an eyebrow at my vacant pause, and it dawns on me that maybe I've had a few #EMP too#! many swallows."
 stress_trait_ongoing.0516.a:0 "Evet ya, çok önemli bir görüşme..."
 stress_trait_ongoing.0516.a.tt_success:0 "[important_guest.GetFirstNameNoTooltip] sakin ve tutarlı yanıtlarınızdan etkilendi."
 stress_trait_ongoing.0516.a.tt_fail:0 "Bariz sarhoşluğunuzdan gücendi."
 stress_trait_ongoing.0516.b:0 "Kusura bakmayın, kendimi pek iyi hissetmiyorum."
 stress_trait_ongoing.0516.b_flavour:0 "Görüşmeden erken bir şekilde çıkıp dinleneceksiniz."
### TODO AGOT-CHANGED: stress_trait_ongoing.0516.c [AGOT: Loosen up, [important_guest.GetFirstNameNoTooltip]. Have a cup! | TR: Gevşe biraz [important_guest.GetFirstNameNoTooltip]. Al biraz haşiş ye!]
 stress_trait_ongoing.0516.c:0 "Loosen up, [important_guest.GetFirstNameNoTooltip]. Have a cup!"
### TODO AGOT-CHANGED: stress_trait_ongoing.0516.c_flavour [AGOT: You have a servant bring in more milk of the poppy | TR: Hizmetçiye daha fazla haşiş getirmesini söyleyeceksiniz.]
 stress_trait_ongoing.0516.c_flavour:0 "You have a servant bring in more milk of the poppy"
 stress_trait_ongoing.1501.t:0 "Meftun"
 stress_trait_ongoing.1501.desc_1_a:0 "Bu sabah yanımdan geçen [obsession.GetTitledFirstName] ve davetkâr dekoltesi dikkatimden kaçmadı."
 stress_trait_ongoing.1501.desc_1_b:0 "Bu sabah yanımdan geçen [obsession.GetTitledFirstName] ve giysisindeki davetkâr çıkıntı dikkatimden kaçmadı."
 stress_trait_ongoing.1501.desc_1_c:0 "Bu sabah yanımdan geçen [obsession.Custom2('MyCharacterIntroduction', ROOT.Char)] ve davetkâr gülümsemesi dikkatimden kaçmadı."
 stress_trait_ongoing.1501.desc_1_d:0 "Bu sabah yanımdan geçen [obsession.GetTitledFirstName] ve etkileyici vücudu dikkatimden kaçmadı."
 stress_trait_ongoing.1501.bridge:0 "O zamandan beri ne yaparsam yapayım aklımı ondan alamıyorum, uçuk fantezilerim yüzünden bir türlü işime odaklanamıyorum.\n\n"
 stress_trait_ongoing.1501.desc_2_a:0 "O dik göğüsleri yok mu..."
 stress_trait_ongoing.1501.desc_2_b:0 "O geniş kalçaları yok mu..."
 stress_trait_ongoing.1501.desc_2_c:0 "O baştan çıkarıcı erkekliği yok mu..."
 stress_trait_ongoing.1501.desc_2_d:0 "O ince beli yok mu..."
 stress_trait_ongoing.1501.desc_2_e:0 "O geniş omuzları yok mu..."
 stress_trait_ongoing.1501.desc_2_f:0 "O çekici fiziği yok mu..."
 stress_trait_ongoing.1501.desc_3_a:0 "O çevik bedeninin süzülüşü yok mu..."
 stress_trait_ongoing.1501.desc_3_b:0 "O kıvırta kıvırta yürüyüşü yok mu..."
 stress_trait_ongoing.1501.desc_3_c:0 "O yürürken kaslarının hareket edişi yok mu..."
 stress_trait_ongoing.1501.desc_3_d:0 "O sakinliği ve ağırbaşlılığı yok mu..."
 stress_trait_ongoing.1501.desc_3_e:0 "O sinsi sinsi dolaşması yok mu..."
 stress_trait_ongoing.1501.desc_3_f:0 "O ahenk içerisinde yürümesi yok mu..."
 stress_trait_ongoing.1501.end:0 "Artık dayanamıyorum! Bu sevdadan bir şekilde kendimi uzaklaştırmalıyım, yoksa adamakıllı hiçbir şey yapamayacağım!"
 stress_trait_ongoing.1501.warning:0 "\n\nHeyhat... Biliyorum ki [obsession.GetFirstName] [ROOT.Char.GetWomenMen] ile, dolayısıyla benimle ilgilenmiyor."
 stress_trait_ongoing.1501.a:0 "O da aynı şekilde hissediyor mu öğrenmeliyim!"
 stress_trait_ongoing.1501.a.flavor:0 "Bu öyle ya da böyle bu meseleyi çözecek."
 stress_trait_ongoing.1501.a.success:0 "[obsession.GetTitledFirstName] bana karşı duygular besliyor"
 stress_trait_ongoing.1501.a.failure:0 "[obsession.GetTitledFirstName] beni tersledi"
 stress_trait_ongoing.1501.b:0 "Hayal kurmaktan kime zarar gelmiş, değil mi?"
 stress_trait_ongoing.1501.b.flavor:0 "Biraz yalnız kalmak geçici de olsa rahatlamamı sağlayacaktır."
 stress_trait_ongoing.1501.c:0 "Geneleve gidip kafamı dağıtmalıyım..."
 stress_trait_ongoing.1501.c.flavor:0 "Orada bunu aşmamı sağlayacak #EMP birileri#! illa vardır."
 stress_trait_ongoing.1501.d:0 "Ona böyle yaklaşmamalıyım, bu #EMP yanlış#!!"
 stress_trait_ongoing.1501.d.flavor:0 "Bu saplantı bana zarar verdiği kadar onun için de bir haksızlık."
 stress_trait_ongoing.4501.t:0 "Bir Lokma Bile Yok"
 stress_trait_ongoing.4501.desc:0 "Stresli geçen son birkaç haftanın ardından istediğim tek şey bir kâse dolusu [ROOT.Char.Custom('FavoriteTreat')]... hatta birkaç kâse de olur...\n\nKahretsin, bütün masayı doldurun! Ben [ROOT.GetCharacter.GetTitleAsNameNoTooltip] değil miyim?! İstediğim kadar yerim!\n\nBüyük bir iştahla sandalyemde beklerken aşçı gerekli malzemelere sahip olmadığını söylüyor."
 stress_trait_ongoing.4501.a:0 "Al sana para. Fiyatına falan bakma, çabucak al gel!"
 stress_trait_ongoing.4501.b:0 "Açlığımı yatıştıracak #EMP hiç mi#! bir şeyin yok? "
 stress_trait_ongoing.4501.b.success:0 "Yeni favori tatlınızı keşfedeceksiniz."
 stress_trait_ongoing.4501.b.cannibal:0 "İnsan etine ilgi duyduğunuzu keşfedeceksiniz."
 stress_trait_ongoing.4501.b.failure:0 "Açlığınız bastırılmayacak."
 stress_trait_ongoing.4501.c:0 "Eh... Aç kaldık desene."
 stress_trait_ongoing.4502.t:0 "Açlık"
 stress_trait_ongoing.4502.desc:0 "Stresli geçen son birkaç haftanın ardından istediğim tek şey, sulu bir et parçası. Belki fileto, belki pirzola?\n\nDüşüncesi bile ağzımı sulandırıyor. Bu sefer açlığımı bastıramayacak gibiyim."
 stress_trait_ongoing.4502.a:0 "[prisoner.GetTitledFirstNameNoTooltip] ansızın ortadan kaybolsa kim fark eder ki?"
 stress_trait_ongoing.4502.b:0 "[courtier.GetTitledFirstNameNoTooltip] son zamanlarda kaşınıyordu..."
 stress_trait_ongoing.4502.c:0 "[hapless_village.GetNameNoTier] sokaklarında dolaşma vakti!"
 stress_trait_ongoing.5001.t:0 "Niyet Ziyafeti"
### TODO AGOT-ONLY: stress_trait_ongoing.5001.desc [AGOT: ]
 stress_trait_ongoing.5001.desc:0 ""Come with me [ROOT.Char.GetTitledFirstName]; I have a surprise for you!" [giver.Custom2('MyCharacterIntroduction', ROOT.Char)] says excitedly. "I noticed you haven't been eating well, so I spent weeks seeking out the rarest delicacies I could find!"\n\nFollowing [giver.GetHerHim], I see a table piled with a wide variety of gourmet dishes. [ROOT.Char.Custom('GetExpensiveMeal')|U] and [ROOT.Char.Custom('GetExpensiveMealAlt')]... [ROOT.Char.Custom('GetExpensiveDessert')]... the smell alone makes my stomach turn.\n\n"Well? Dig in, [ROOT.Char.Custom('FormOfAddressForLiege')]!""
### TODO AGOT-ONLY: stress_trait_ongoing.5001.a [AGOT: ]
 stress_trait_ongoing.5001.a:0 ""It is, uh... really good. Mmm. So tasty.""
 stress_trait_ongoing.5001.a.flavor:0 "Nezaketen yemeği yiyeceğim."
### TODO AGOT-ONLY: stress_trait_ongoing.5001.b [AGOT: ]
 stress_trait_ongoing.5001.b:0 ""You shouldn't have... no, really. #EMP Servants!#! Take this away.""
 stress_trait_ongoing.5001.c.dog:0 "Yiyormuş gibi yapıp yemeği yere dökeyim de [ROOT.Char.Custom('DogStoryName')] yesin."
 stress_trait_ongoing.5001.c.cat:0 "Yiyormuş gibi yapıp yemeği yere dökeyim de [ROOT.Char.Custom('CatStoryName')] yesin."
 stress_trait_ongoing.5001.c.no_pet:0 "Yiyormuş gibi yapıp yemeği masanın altındaki köpeğe vereyim."
 stress_trait_ongoing.5001.c.success:0 "[giver.GetTitledFirstName] yemeği beğendiğimi düşünecek."
 stress_trait_ongoing.5001.c.failure:0 "[giver.GetTitledFirstName] yemeği yemediğimi fark edecek."
