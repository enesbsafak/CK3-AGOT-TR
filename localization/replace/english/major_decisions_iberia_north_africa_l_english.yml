 iberia_north_africa.2001.a.learning:0 "felsefe kitabı"
 iberia_north_africa.2001.a.martial:0 "askeri kitap"
 iberia_north_africa.2001.a.stewardship:0 "ekonomi kitabı"
 iberia_north_africa.2001.a.diplointrigue:0 "hitabet kitabı"
 iberia_north_africa.2001.a.end:0 "için hiç bir şeyi esirgemem."
 iberia_north_africa.2001.a.a:0 "En düşük özelliğini geliştirmek için bir kitap istiyorsunuz."
 iberia_north_africa.2001.b:0 "Seni destekleyeceğim işe yarar bir şeyler yap."
 iberia_north_africa.2001.b.a:0 "[generated_actor.GetFirstNameNoTooltip] size rastgele bir [Concept( 'skill', 'becerinizi' )|E] geliştirecek bir kitap verecek"
