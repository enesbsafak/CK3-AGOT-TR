 iberia_north_africa.2100.t: "Eski Vaskonya Yeniden Kuruldu"
 iberia_north_africa.2100.desc: "Biz Basklar yüzyıllar boyunca talihsizliklerimizin üstesinden azim ve kararlılıkla geldik. Sanki kadim Pirenelerin taşlarından yontulmuş gibi, sayısız istilaya karşı dimdik durduk ve saldırmak için uygun anı bekledik.\n\nO karanlık günler geride kaldı ve nihayet atalarımızın topraklarını geri almayı başardık; şimdi yeni, özgür bir Navarra'nın kalbini oluşturan topraklar.\n\nTarihin en acı derslerini almış bir halk olarak, bir daha asla evlerimizden kovulmamıza izin vermeyeceğime şahsen yemin ediyorum."
 iberia_north_africa.2100.a: "Benim liderliğim ile her şeyi başarabiliriz!"
 iberia_north_africa.2100.b: "Tekrar sindirilmeyeceğiz!"
 iberia_north_africa.2101.desc: "Basklar yüzyıllar boyunca Pireneler'de sürekli köşeye sıkıştırıldı ve her iki taraftan da istilacılar tarafından taciz edildiler.\n\nŞimdi, atalarının topraklarının büyük bir kısmı alan [founder.GetTitledFirstNameRegnal], kendini [GetTitleByKey('k_navarra').GetNameNoTier] topraklarında [founder.Custom('QueenKing')] ilan etti. Ayrıca kaybedilen toprakların yeni Bask krallığının bir parçası olduğunu iddia ediyor.\n\nKomşuları bu değişikliği bölgenin tarihindeki basit bir sapma olarak görüyor ve bu üzüntüyü gidermek için ilk fırsatı kolluyorlar..."
 iberia_north_africa.2101.b: "Dağlarda kalmalıydılar!"
 iberia_north_africa.2101.c: "Gerçekten bir sürpriz."
