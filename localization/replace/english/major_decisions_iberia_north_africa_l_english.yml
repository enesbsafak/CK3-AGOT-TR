### TODO AGOT-ONLY: iberia_north_africa.2002.desc [AGOT: ]
 iberia_north_africa.2002.desc:0 ""My liege, please make this fool listen! This Red Hand healer performed a cataract operation on my right eye but now refuses to fix my left!" exclaims [patientzero.GetTitledFirstName]. "The operation was only successful because the conjunction of the stars was perfect. You #italic must#! wait twelve more years to ensure another successful operation!" replies the frustrated doctor, [generated_actor.GetFirstName].\n\nAs ruler, it is my duty to settle such matters. Should I interfere with astrology and risk a botched surgery?"
 iberia_north_africa.2002.a:0 "Bu [child_offering.GetFirstNameNoTooltip] için mükemmel bir fırsat, kendini tıp alanında geliştirmek için daha iyi bir şans bulamazdı!"
 iberia_north_africa.2002.a.flavor:0 "Çocuğunuz [child_offering.GetFirstName], [patientzero.GetFirstName] adlı kişinin katarakt operasyonunda yardımcı olacak."
 iberia_north_africa.2002.a.a:0 "[child_offering.GetFirstName] operasyonda yardımcı oluyor"
 iberia_north_africa.2002.a.b:0 "Katarakt Operasyonunun Sonuçları"
 iberia_north_africa.2002.b:0 "Yıldızların senin yeteneğine bir etkisi yok, operasyonu gerçekleştir!"
 iberia_north_africa.2002.b.a:0 "Risklerin farkında olarak operasyonun gerçekleşmesini talep ediyorsunuz."
 iberia_north_africa.2002.c:0 "Evet, şartların uygun olmasını beklemek en iyisi olacak."
 iberia_north_africa.2002.d:0 "#italic Aslında#!, #italic bu#! yönden bakarsan yıldızlar mükemmel konumda!"
 iberia_north_africa.2003.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Çatışan Doğalar"
### TODO AGOT-CHANGED: iberia_north_africa.2003.desc [AGOT: Many scholars have come and passed through [playerprovince.GetNameNoTooltip] since granting my sponsor, but two of them have stuck out to me. Perhaps it is because they are both individuals of vast intellect, perhaps it is because they #italic won't shut up#! and stop arguing about minute differences of belief in middle of my court.\n\n | TR: İlim yapanların hamisi olduğum için [playerprovince.GetNameNoTooltip] pek çok alim ağırladı ama iki tanesi dikkatimi çok çekiyor. Belki ikisi de büyük dehalar olduğundan, belki ikisi de bir türlü #italic çenelerini kapatıp#! bir dakika olsun tartışmayı kesemediğinden.]
 iberia_north_africa.2003.desc:0 "Many scholars have come and passed through [playerprovince.GetNameNoTooltip] since granting my sponsor, but two of them have stuck out to me. Perhaps it is because they are both individuals of vast intellect, perhaps it is because they #italic won't shut up#! and stop arguing about minute differences of belief in middle of my court.\n\n"I #italic refuse#! to work with a fool such as [generated_actor_r.GetFirstName]!" exclaims [generated_actor_k.GetFirstName] before [generated_actor_r.GetFirstName] replies with "Fine by me, I'd never work with someone as stubborn as #italic you!#!"\n\n"[ROOT.Char.GetTitledFirstName], what do you believe? Is it the role of the maester to explain the natural world or does it fall under the authority of the septon?""
 iberia_north_africa.2003.a:0 "Benim otoriteme girer. Şimdi işe koyul."
 iberia_north_africa.2003.a.flavor:0 "İki alimi de gücendirip birbirlerini değil de sizi küçümsemelerini sağlıyorsunuz."
