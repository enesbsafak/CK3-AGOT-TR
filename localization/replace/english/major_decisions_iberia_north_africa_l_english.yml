l_english:
 iberia_north_africa.0005.t:0 "Birleşmiş İspanya"
 iberia_north_africa.0005.desc:0 "İspanya tahtı bir kez daha tek bir [ROOT.Char.GetTitleAsNameNoTooltip] altında birleşti. Sahte kralların tahtları alındı ve [ROOT.Char.GetPrimaryTitle.GetNameNoTier] adı gururla göklere çıkarıldı.\n\nBir gün bu dünyadan göçüp [ROOT.Char.GetFaith.DivineRealm] kapısından içeri gireceğim ama dünyadaki mirasım sonsuza dek yaşayacak. Bana [ROOT.Char.GetTitledFirstNameNoTooltip] diyecekler, yani İspanya'nın [Select_CString( ROOT.Char.IsFemale, 'Anası', 'Atası' )].'"
 iberia_north_africa.0005.a:1 "Yeni bir çağın başlangıcı."
 iberia_north_africa.0006.start.desc:0 "İspanyol krallıkları teker teker [spain_uniter.GetPrimaryTitle.GetNameNoTier] kontrolüne girdi."
 iberia_north_africa.0006.relation_former.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', spain_uniter)|U] [spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.former.desc:0 "[spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.end.desc:0 "kendisini İspanya'nın [Select_CString( spain_uniter.IsFemale, 'Anası', 'Atası' )] ilan etti.'\n\nAdı yüzyıllarca unutulmayacak ama kendisi bir kahraman mı yoksa bir tiran olarak mı hatırlanacak? Sadece [ROOT.Char.GetFaith.FateGodName] bilir."
 iberia_north_africa.0010.t:0 "Bir Afrika"
 iberia_north_africa.0010.start.desc:0 "Kimse mümkün olduğunu düşünmüyordu. Ben artık [ROOT.Char.GetTitleAsNameNoTooltip] hükümdarıyım."
 iberia_north_africa.0010.vassals.desc:0 "Atlantik kıyısından Doğu Okyanusu'na kadar her kabile, her [vassal_1.GetTitleAsNameNoTooltip] ve her [vassal_2.GetTitleAsNameNoTooltip] artık benim emrimde."
 iberia_north_africa.0010.spirits.desc:0 "\n\n[africa_uniter.Custom('DefaultPriestTitlePlural')] bana ruhların memnun olduğunu söylüyor. Topraklarımız sonunda özgür! Hâlâ yapmamız gereken işler var ama bugün kutlama günü!"
 iberia_north_africa.0010.ancestors.desc:0 "\n\n[africa_uniter.Custom('DefaultPriestTitlePlural')] bana ataların memnun olduğunu söylüyor. Topraklarımız sonunda özgür! Hâlâ yapmamız gereken işler var ama bugün kutlama günü!"
 iberia_north_africa.0010.generic.desc:0 "\n\nVasallarım her türlü farklı inanç ve gelenekten geliyor ama ben hepimizi bir araya getirip yeni bir yol açacağım. Bugünden sonra [ROOT.Char.GetFaith.HighGodNamePossessive] buyruğunda tek bir ülkeyiz."
 iberia_north_africa.0010.a:0 "Şanlı Afrika!"
 iberia_north_africa.0011.start.desc:0 "Afrika'nın tüm halkları, en küçük kabilesinden en büyük hükümdarına kadar artık hepsi [africa_uniter.GetPrimaryTitle.GetNameNoTier] kontrolünde."
 iberia_north_africa.0011.relation_former.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', africa_uniter)|U] [africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.former.desc:0 "[africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.end.desc:0 "herkesi [africa_uniter.GetFaith.GetAdjective] sancağı altında birleştirdi.\n\nBöylesine büyük bir ülke zamana karşı koyabilir mi, yoksa bu birlik eninde sonunda yıkılacak mı? Sadece [ROOT.Char.GetFaith.FateGodName] bilir."
 decision_unite_africa_confirm:0 "Afrika'yı Birleştir"
 iberia_north_africa.0015.t:0 "Şehitlerin İntikamı"
 iberia_north_africa.0015.part1.desc:0 "Tours'a giden Şehitler Yolu'nda binlerce cesur Müslüman hayatını kaybetti. Daha iyi bir gelecek, gerçek müminler için yeni bir altın çağ için savaşıyorlardı. Bugün, sonunda amaçlarına ulaştık." #krutygetarts
 iberia_north_africa.0015.part2.desc:0 "\n\nAvrupa'da sağlam bir konuma sahibiz, şanlı fethim daha yeni başlıyor..."
 iberia_north_africa.0015.a:0 "Allahu ekber."
 iberia_north_africa.0016.t:0 "Geçmişin Yankıları"
 iberia_north_africa.0016.relation_former.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMePossessive', avenger)|U] [avenger.GetTitledFirstName]"
 iberia_north_africa.0016.former.desc:0 "\n\n[avenger.GetTitledFirstName]"
 iberia_north_africa.0015.islam.desc:0 "askerlerini eski Frank krallığının kalbine getirip karşısına çıkan herkesi bozguna uğrattı. Sağlam konumu nedeniyle İslam'ın geleceği her zamankinden daha parlak gözüküyor."
 iberia_north_africa.0016.christianity.a:0 "Tanrı hepimize merhamet göstersin."
 iberia_north_africa.0016.generic.desc:0 "Yıllar önce Tours'a giden yolda, Hristiyan Frank güçleri Emevîlerin Avrupa istilasına son verdi. Charles Martel ve adamları tarihin akışını değiştirdi.\n\nAma hiçbir şey sonsuza kadar sürmez. [avenger.GetName] askerlerini eski Frank krallığının kalbine getirip krallığı ele geçirdi. Artık Avrupa'da sahip olduğu konum nedeniyle bundan sonra ne yapacağını bir tek [ROOT.Char.GetFaith.FateGodName] bilir..."
 iberia_north_africa.0001.t:0 "Portekiz Krallığı"
 iberia_north_africa.0001.start.desc:0 "Bu gün sonsuza kadar büyük Portekiz Krallığı'nın yükselişi olarak hatırlanacak."
 iberia_north_africa.0001.christian.desc:0 "Halkımı yüzyıllardır Müslümanların emrinde acı çekti. Ama artık buna son verdik. [ROOT.Char.GetFaith.WarGodNamePossessive] önderliğindeki görkemli fetihlerimiz sayesinde artık özgür bir [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ülkesiyiz!\n\n"
 iberia_north_africa.0001.muslim.desc:0 "[ROOT.Char.GetFaith.WarGodNamePossessive] kudreti sayesinde bu toprakları fethettik ve artık gururlu bir şekilde İberya yarımadasının batı kıyısına evimiz diyebiliriz. [ROOT.Char.GetFaith.GetName] burada yüzyıllarca refah içinde yaşayacak!\n\n"
 iberia_north_africa.0001.end.desc:0 "Geçtiğimiz bin yıl boyunca bu topraklara birçok uygarlık geldi. Bunların hepsi şu an sahip olduğu karmaşık kültürel mirasa katkıda bulundu. Bugün kendi özgün kimliğimize sahibiz ve bu yeni krallığı kurarken kendimize gururlu bir şekilde Portekizli diyebiliyoruz!"
 iberia_north_africa.0001.a:0 "Asıl şimdi başlıyoruz!"
 iberia_north_africa.0002.start.desc:0 "İberya yarımadasında yeni bir çağ!"
 iberia_north_africa.0002.relation_former.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', portugal_former)|U] [portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.former.desc:0 "[portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.end.desc:0 "batı kıyısında Portekiz Krallığı'nı kurdu. Yüzyıllarca süren göçlerden ve savaşlardan sonra [portugal_former.GetTitledFirstNameNoTooltip] liderliğindeki bir Portekiz halkı ortaya çıktı.\n\nBu genç ülke istediği ihtişama ulaşabilecek mi yoksa başka bir fethe daha yenik mi düşecek? Sadece zaman gösterecek."
 iberia_north_africa.0002.a1:0 "Şanlı [ROOT.Char.GetFaith.WarGodName]!"
 name_alas:0 "Tüh."
 name_i_see:0 "Anladım."
 iberia_north_africa.0002.b:0 "[ROOT.Char.GetFaith.WarGodName|U] Portekiz'i korusun!"
 iberia_north_africa.0002.c:0 "Ne derlerse desin benim kültürüm hâlâ [ROOT.Char.GetCulture.GetNameNoTooltip]."
 iberia_north_africa.9101.t:0 "Kanarya Adaları Krallığı"
 iberia_north_africa.9101.desc.intro:0 "Zamanın başlangıcından beri adalardan her biri kendini krallık saydı. Ancak [canarias_former.GetTitledFirstName] sayesinde bu krallıkların hepsi tek bir taç altında birleşti.\n\n"
 iberia_north_africa.9101.desc.iberian:1 "Kâfir Guançe krallarının son hezimeti nedeniyle adada [canarias_former.GetFaith.GetName] inancının yayılmasını engelleyen bir güç kalmadı. [canarias_former.GetTitledFirstNameNoTooltip] tüm adalara hükemdecek. [title_k_canarias.GetNameNoTierNoTooltip], bir [title_k_canarias.GetTierAsNameNoTooltip] olarak ilan edildi. [canarias_former.GetTitleAsNameNoTooltip] unvanına sahip olacak ilk isim de [canarias_former.GetName]!"
 iberia_north_africa.9101.desc.guanche:1 "Ufuğun ötesine gittikçe bizden katbekat büyük krallıkların olduğunu görüyoruz. Yabancı istilacılara karşı kendimizi savunmak istiyorsak kendi kaderimizi kendimiz belirlemeli ve bir taç altında birleşmeliyiz. [canarias_former.GetName], [title_k_canarias.GetNameNoTierNoTooltip] topraklarındaki ilk [canarias_former.GetTitleAsNameNoTooltip] olarak taç giydiği zaman adada yaşayanların ilham alabileceği bir simgeye sahip olacağız."
 iberia_north_africa.9101.desc.outro:0 "\n\n[title_k_canarias.GetNameNoTierNoTooltip] topraklarının kaderi hâlâ belirsiz fakat yeni bir [title_k_canarias.GetTierAsNameNoTooltip] elbette adalar ve Kuzey Afrika için yeni bir çağın başlangıcı olacaktır."
 iberia_north_africa.9101.a:0 "Yeni bir krallığın doğuşu!"
 iberia_north_africa.9101.b:0 "[title_k_canarias.GetNameNoTierNoTooltip] topraklarının kaderi İberya'da yatıyor!"
 iberia_north_africa.0101.t:0 "Aziz Petrus'un Tahtına Bağlılık"
 iberia_north_africa.0101.desc:0 "Kolay olmadı ama ailem sonunda ruhban sınıfımızın en rütbelilerini toplamak için yeterli [religious_leader.GetFaith.GetAdjective] toprak ve ruhani otoriteye erişti. Akıttığımız kan, ter ve gözyaşı sonunda meyvesini verdi.\n\n[religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] kalesinde toplanmış [religious_leader.GetFaith.PriestNeuterPlural] kalenin salonlarında arada teolojik yumruklaşmalarla tatlanan izlenmesi gereken politikaları tartışıyor. [pope.GetTitledFirstName] ve Roma'ya bağlı kalmak istediğimizi biliyoruz ama daha fazlasını da istiyoruz.\n\nHaftalarca sonuçsuz devam eden tartışmaların ardından, orta yolu bulmak ev sahibi ve [religious_leader.GetTitleAsNameNoTooltip] olarak bana düşüyor."
 iberia_north_africa.0101.a:0 "Tek millet, tek inanç!"
 iberia_north_africa.0101.a.tt:0 "Daha $doctrine_pluralism_righteous_name$ bir yol izlenmesi gerektiğini savunuyorsunuz"
 iberia_north_africa.0101.b:0 "Kendimizi savunmak için gücü ele geçirmemiz gerekiyorsa #EMP geçiririz#!."
 iberia_north_africa.0101.b.tt:0 "Daha $doctrine_pluralism_fundamentalist_name$ bir yol izlenmesi gerektiğini savunuyorsunuz"
 iberia_north_africa.0101.c:0 "[religious_leader.GetFaith.ReligiousText] hâlâ yoruma ihtiyaç duyuyor..."
 iberia_north_africa.0101.c.tt:0 "Daha da $doctrine_pluralism_pluralistic_name$ bir yol izlenmesi gerektiğini savunuyorsunuz"
 iberia_north_africa.0102.t:0 "[religious_leader.GetFaith.GetAdjectiveNoTooltip] $iberia_north_africa.0101.t$"
 iberia_north_africa.0102.desc.intro:0 "Dini ve siyasi nüfuz peşinde geçen uzun yılların ardından, [religious_leader.GetTitledFirstName] inancın geleceğini tartışmak için [religious_leader.GetFaith.GetAdjective] inancının en önde gelen isimlerini başkenti olan [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] kalesinde topladı.\n\nHaftalarca süren ateşli tartışmaların ardından, toplanan din adamları [pope.GetTitledFirstName] adına ettikleri bağlılık yeminlerini yenilemeye karar verdi ama birkaç ufak değişiklikle...\n\nBu değişiklikler temelde"
 iberia_north_africa.0102.desc.fundamentalist:0 "inançlılara yapılan yanlışlar ve bu yanlışların nasıl sadece eldeki bütün imkânlarla toplanacak dünyevi güç ile engellenebileceğine yoğunlaşıyor."
 iberia_north_africa.0102.desc.righteous:0 "içe dönmeye ve Kiliseye bağlı kültürler arasındaki homojenliği sağlamaya yoğunlaşıyor."
 iberia_north_africa.0102.desc.pluralist:0 "[religious_leader.GetFaith.ReligiousText] ve diğer dinî metinlerin çalışılması için titizce bir metodoloji yöntemi oluşturmaya ve olası sapmalara karşı cevap vermek için resmi yollar geliştirmeye yoğunlaşıyor."
 iberia_north_africa.0102.a.same_faith:0 "Kendimizi savunmamız gerek!"
 iberia_north_africa.0102.a.same_religion:0 "#EMP Bizi#! tehdit olarak mı görüyorlar?"
 iberia_north_africa.0102.a.misc:0 "Fanatikler!"
 iberia_north_africa.0102.b.same_faith:0 "Kendimize ait bir inanç!"
 iberia_north_africa.0102.b.same_religion:0 "Ne kadar bencilce..."
 iberia_north_africa.0102.b.misc:0 "Bize bulaşmadıkları sürece sorun yok."
 iberia_north_africa.0102.c.same_faith:0 "[religious_leader.GetFaith.ReligiousText] ve diğer dinî metinlerin titizce çalışılması hepimizin yararına."
 iberia_north_africa.0102.c.same_religion:0 "Ne kadar manasız, bu kadar yanlış bir temel üstüne bu kadar çalışmak..."
 iberia_north_africa.0102.c.misc:0 "Doktrinden sapmaya karşı çözümleri doktrini daha da mı saptırmak?"
 iberia_north_africa.0111.t:0 "Roma'nın Zincirlerinden Kurtulma"
 iberia_north_africa.0111.desc:0 "Bu toplantıyı düzenleyebilmek için gereken siyasi ve ruhani birliği sağlamak yıllar sürdü ama sonunda [pope.GetTitledFirstName] sahtekarını gerçekten alaşağı edebilecek kuvvete ulaştım. \n\nŞimdi [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] kalesinin koridorları ve misafir odaları tartışmacı din adamları ve tutkulu piskoposlarla; Roma'nın yüzüne bakmadan geri çevirdiği her [religious_leader.GetFaith.PriestNeuter] ve keşişle kaynıyor. \n\nBütün bu tartışmalar meşruiyet için elzem ama [religious_leader.GetFaith.GetAdjective] inancının en kudretli hükümdarı olarak son söz #EMP benim#! olacak."
 iberia_north_africa.0111.a:0 "Tanrı'nın oğlu barışın elçisiydi, biz de onun ayak izlerini takip edeceğiz"
 iberia_north_africa.0111.a.tt:0 "$iberia_north_africa.0101.a.tt$"
 iberia_north_africa.0111.b:0 "Roma olsun olmasın, biz kendimizden olanı korumanın önemini biliriz!"
 iberia_north_africa.0111.b.tt:0 "$iberia_north_africa.0101.b.tt$"
 iberia_north_africa.0111.c:0 "İslam da kitabi bir din değil mi?"
 iberia_north_africa.0111.c.tt:0 "$iberia_north_africa.0101.c.tt$"
 mozarabic_break_with_rome_decision.tt.you_gain_a_hof:0 "[religious_leader.GetFaith.GetName] için yeni bir [Concept( 'title', 'unvan' )|E] oluşturuldu"
 mozarabic_break_with_rome_decision.tt.new_hof_id:0 "[new_religious_head.GetTitledFirstName] yeni [Concept( 'head_of_faith', 'dini lideriniz' )|E]"
 iberia_north_africa.0112.t:0 "[religious_leader.GetFaith.GetAdjectiveNoTooltip] Kilisesi ve [pope.GetFaith.GetNameNoTooltip] Arasında Ayrılık"
 iberia_north_africa.0112.desc.intro:0 "Büyük çabalar sonucu [religious_leader.GetTitledFirstName] sonunda gerekli siyasi ve dinî nüfuza erişti ve [religious_leader.GetFaith.GetAdjective] Kilisesini tek bir amaç uğrunda birleştirdi:[pope.GetTitledFirstName] ve onun inanç üzerindeki diktatörlüğünü yıkmak.\n\nToplanan kilise konseyi Roma sonrası doğacak boşluğu nasıl dolduracaklarını bazen [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] salonlarında yumruklaşmaların eşlik ettiği ateşli tartışmalarla çözmeye çalışıyorlar ama nafile.\n\n Bu düğüm, onu çözebilecek tek kişi olan [religious_leader.GetTitledFirstNameNoTooltip] tarafından gelen müdahale ile çözülüyor ve konsey"
 iberia_north_africa.0112.desc.fundamentalist:0 "kutsal bölgelere seyahat edenleri gerekirse güç kullanarak koruma görevini üstlenmeye odaklanıyor."
 iberia_north_africa.0112.desc.righteous:0 "[religious_leader.GetFaith.GetReligion.GetName] topluluğunu enfekte etmiş şiddet düşkünlüğüne çözüm bulmaya odaklanıyor.\n\nOna göre [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] kâfirlerin kanını akıtarak [religious_leader.GetFaith.PositiveAfterLife] yolunu bulmaya çalışmak yerine basitçe daha iyi bir şekilde yaşamaya çalışmalı."
 iberia_north_africa.0112.desc.pluralist:0 "Müslüman komşularıyla daha rahat geçinmelerini engelleyen yasakları gevşetmeye ve dinlerarası ilişkilerde daha uzlaştırıcı bir tutum takınmaya odaklanıyor."
 iberia_north_africa.0112.a.same_faith:0 "[religious_leader.GetFaith.HighGodName] bizi savunacak!"
 iberia_north_africa.0112.a.same_religion:0 "Bizi #EMP kutsal#! bölgelerimize gitmekten alıkoymaya çalışmasınlar da!"
 iberia_north_africa.0112.a.misc:0 "Kılı kırk yarıyorlar..."
 iberia_north_africa.0112.b.same_faith:0 "Barış için savaş!"
 iberia_north_africa.0112.b.same_religion:0 "Sanırım bizden iyi olduklarını düşünüyorlar..."
 iberia_north_africa.0112.b.misc:0 "Bakalım #EMP bu#! onlar için nasıl sonuçlanacak..."
 iberia_north_africa.0112.c.same_faith:0 "Paylaştıklarımız paylaşmadıklarımızdan çok daha fazla."
 iberia_north_africa.0112.c.same_religion:0 "Endişe verici..."
 iberia_north_africa.0112.c.islam:0 "Umarım bu hak dine geçişin ilk aşamasıdır..."
 iberia_north_africa.0112.c.misc:0 "Hibrit bir inanç mı oldular şimdi?"
 iberia_north_africa.0121.t:0 "Doğaya Dönüş"
 iberia_north_africa.0121.desc.intro:0 "[old_faith.GetAdjective] inancıyla sorunlarım olduğu bir sır değil"
 iberia_north_africa.0121.desc.excommunicated:0 "Aforoz edilmek benim için kolay olmadı, haksızca ruhuma ağır bir yük bindirildi ve diğer [old_faith.GetAdherentNamePluralNoTooltip] ile ilişkim onarılamayacak derecede zedelendi."
 iberia_north_africa.0121.desc.rivalry_with_hof:0 "[old_faith.GetReligiousHead.GetTitledFirstName] ile girdiğimiz bitmek bilmeyen ve açıkçası onun girmeye tenezzül dahi etmemesi gereken tartışmalar beni büyük hayal kırıklığına uğrattı ve inancımı zayıflattı."
 iberia_north_africa.0121.desc.negative_piety_level:0 "Yaptıklarım beni inancı kolayca kenara koyabilen bir günahkâr olarak damgaladı. Bunun ne kadar izole edici olduğunu inkâr etmenin anlamı yok."
 iberia_north_africa.0121.desc.lorgar:0 "İnancımın kuvvetiyle yalnızca güneş yarışabilir ama yine de evrendeki tek gücün [old_faith.HighGodName] olmayabileceği düşüncesini içimden atamıyorum. Cevaplara ihtiyacım var."
 iberia_north_africa.0121.desc.sinful_traits:0 "Sanki yaptığım her şey, her düşüncem ve hatta yaşam biçimim içkin olarak günahkâr."
 iberia_north_africa.0121.desc.virtuous_basque_pagan_traits:0 "Bazen bunları bir zamanlar nasıl sevdiğimi sorguluyorum, çünkü düşününce bunlardan tamamen farklı bir şey için #EMP yaratılmış#! gibiyim."
 iberia_north_africa.0121.desc.naked_cynicism:0 "Sıkıcı buluyorum ve daha kötüsü, kendimi üzerinde hiçbir kontrolümün olmadığı güçlerin emrinde hissediyorum."
 iberia_north_africa.0121.desc.outro:0 "\n\nSonunda [basque_faith.GetName] ile huzuru buldum. Bu ufak mezhebin kırsaldaki temsilcileri beni yargılamıyor, hatta yerel bir hikâye anlatıcısından öteye geçme ihtimali onları heyecanlandırıyor.\n\nBu heyecan ve beklenti onları önerilere biraz daha açık kılıyor..."
 iberia_north_africa.0121.a:0 "[basque_faith.GetNameNoTooltip] tekrar savaşçıların inancı olacak!"
 iberia_north_africa.0121.a.tt:0 "Daha $doctrine_pluralism_fundamentalist_name$ bir yol izlenmesi gerektiğini savunuyorsunuz"
 iberia_north_africa.0121.b:0 "Doğayla uyum komşularla uyumdan evladır."
 iberia_north_africa.0121.b.tt:0 "Daha $doctrine_pluralism_righteous_name$ bir yol izlenmesi gerektiğini savunuyorsunuz"
 iberia_north_africa.0121.c:0 "Geleneklerimizi paylaşabileceğimiz daha değerli inançlar var."
 iberia_north_africa.0121.c.tt:0 "Yine $doctrine_pluralism_pluralistic_name$ ama öncekinden farklı bir yol izlenmesi gerektiğini savunuyorsunuz"
 iberia_north_africa.0121.d:0 "Eğer değişimi zorla getirirsem, [old_faith.GetNameNoTooltip] ile aramda ne fark kalır?"
 iberia_north_africa.0121.d.tt:0 "İnancı olduğu gibi bırakıyorsunuz"
 iberia_north_africa.0122.t:0 "$iberia_north_africa.0121.t$"
 iberia_north_africa.0122.desc.intro:0 "Görünüşe göre [religious_leader.GetTitledFirstName]"
 iberia_north_africa.0122.desc.excommunicated:0 "[old_faith.GetName] yetkililerince sürekli aforoz edilmekten sıkıldı."
 iberia_north_africa.0122.desc.rivalry_with_hof:0 "ile [old_faith.GetReligiousHead.GetTitledFirstName] arasındaki düşmanlık onları geri dönülemez bir ayrıma getirdi."
 iberia_north_africa.0122.desc.negative_piety_level:0 "[old_faith.GetName] otoritelerini önceki davranışlarını solda sıfır bırakacak bir şey planlıyor."
 iberia_north_africa.0122.desc.lorgar:0 "daha ilkel bir şey için duyduğu şehvet haddinden fazla güçlendi ve onu küfür yoluna sevk etti."
 iberia_north_africa.0122.desc.sinful_traits:0 "sonunda günahların baştan çıkarıcılığına yenik düştü ve [old_faith.GetAdjective] inancını terk etti."
 iberia_north_africa.0122.desc.virtuous_basque_pagan_traits:0 "yavaşça ama emince pastoral hayatın cazibesine kapıldı ve artık sona geldi."
 iberia_north_africa.0122.desc.naked_cynicism:0 "ülkesinin ruhani yaşamı üzerinde daha fazla kontrol sahibi olma isteğine yenik düştü."
 iberia_north_africa.0122.desc.midtro:0 "\n\nAçıkça bir delilik anında [religious_leader.GetTitleAsNameNoTooltip|U] Pirenelerin unutulmaya yüz tutmuş yerel bir inancını mezarından kaldırdı ve [religious_leader.GetPrimaryTitle.GetNameNoTier] ülkesinin yeni dini yaptı.\n\n"
 iberia_north_africa.0122.desc.fundamentalist:0 "Başlarda barışçıl olsa da [religious_leader.GetTitledFirstNameNoTooltip], köktenci siyasetini destekleyecek ve onun için savaşacak herkese büyük ganimet ve başka ödüller vaadederek yeni filizlenen mezhebi bir çılgınlığa sürükledi."
 iberia_north_africa.0122.desc.righteous:0 "Ufak mezhebin Hristiyanlıkla olan yakın ilişkilerini koparmak isteyen [religious_leader.GetTitledFirstNameNoTooltip], mezhebin Pagan kökenli unsurlarına dönüşü teşvik ediyor."
 iberia_north_africa.0122.desc.pluralist:0 "Her ne kadar bu küçük mezhep yüzyıllar boyunca Hristiyanlıkla pek çok alışveriş yapsa da, [religious_leader.GetTitledFirstNameNoTooltip] kayda değer nüfuzunu kullanarak yapabildiği ölçüde İsevi ritüelleri İslami olanlarla değiştiriyor."
 iberia_north_africa.0122.desc.unchanged:0 "Teolojik çevrelerin artan ilgisine rağmen tarihin karanlık dehlizlerinden tam çıkamayan bu mezhep temelde geleneksel Vaskonya mitolojisi ve yüzyıllarca süren komşuluk esnasında enjekte edilmiş Hristiyan dogmalarının evliliğinden ibaret."
 iberia_north_africa.0122.a:0 "Biliyor musun, O çok da haksız değil..."
 iberia_north_africa.0122.b.same_faith:0 "Bu düpedüz küfür!"
 iberia_north_africa.0122.b.same_religion:0 "Bu yalnızca yok olmalarıyla sonuçlanabilir."
 iberia_north_africa.0122.b.respects_fellow_warmongers:0 "En azından savaşmaktan korkmuyorlar."
 iberia_north_africa.0122.b.misc:0 "Ötede savaşsınlar da."
 iberia_north_africa.0122.c.same_faith:0 "[religious_leader.GetFirstNameNoTooltip] birkaç ağaç için mi [old_faith.HighGodNamePossessive] yolundan saptı?!"
 iberia_north_africa.0122.c.same_religion:0 "[religious_leader.GetFirstNameNoTooltip] bizden #EMP iyi#! olduğunu mu sanıyor?"
 iberia_north_africa.0122.c.believes_in_harmony_with_nature:0 "En azından doğanın mucizesini takdir ediyorlar."
 iberia_north_africa.0122.c.misc:0 "Hmm. Ağaçlarla mı konuşuyorlar yani?"
 iberia_north_africa.0122.d.muslim:0 "En azından [basque_faith.GetAdherentNamePluralNoTooltip] [islam_religion.GetNameNoTooltip] ile yakınlaşıyor."
 iberia_north_africa.0122.d.same_faith:0 "Bu bizi ikinci terk edişleri!"
 iberia_north_africa.0122.d.same_religion:0 "Kabul Edilemez!"
 iberia_north_africa.0122.d.syncretised_with_islam:0 "Heh. En azından kafayı tamamen sıyırmamışlar"
 iberia_north_africa.0122.d.misc:0 "Bize hava hoş."
 iberia_north_africa.0122.e.same_faith:0 "Demek #EMP hoşgörünün#! ölçütü bu."
 iberia_north_africa.0122.e.same_religion:0 "Endişe verici..."
 iberia_north_africa.0122.e.syncretised_with_christianity:0 "$iberia_north_africa.0122.d.syncretised_with_islam$"
 iberia_north_africa.0122.e.misc:0 "Açıkçası çok da önemli bir değişiklik gibi durmuyor."
 iberia_north_africa.0131.t:0 "Ebro'nun Çocukları"
 iberia_north_africa.0131.desc.intro:0 "[k_aragon.GetDefinitiveName] unvanını elde ederek, [aragonese_culture.GetName] kültürünün ülkemdeki şehir ve kasabalarda serpilmesini ve gelişmesini tetikledim. Yalnızca anavatanımız $d_aragon$ içinde değil, ayrıca"
 iberia_north_africa.0131.desc.duchy.one:0 "[duchy_a.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.two:1 "[duchy_a.GetBaseNameNoTier] ve [duchy_b.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.three:0 "[duchy_a.GetBaseNameNoTier], [duchy_b.GetBaseNameNoTier] ve [duchy_c.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.outro:0 "bölgelerinde de benim ve insanlarımın etkisi hızlıca yayılıyor.\n\nAma yine de, bazen [founder_culture.GetName] olmanın bazı yanlarını özlüyorum. Hayatımın merkezinde artık yeri olmayabilir ama benim mevkimdeki bir insan için tamamen geride kalması da gerekmiyor."
 form_the_kingdom_of_aragon_decision.tt.x_random_counties_in_d_aragon:0 "$d_aragon$ bölgesinde 3 rastgele [counties|E]:"
 iberia_north_africa.0131.a:0 "Bu insanlar benim insanlarım ve benim için kâfidir."
 iberia_north_africa.0131.b:0 "[founder_culture.GetNameNoTooltip] o kadar da kötü değil..."
 iberia_north_africa.0131.c:0 "Bizim için gerçekten önemli olan değişmedi."
 iberia_north_africa.0131.d:0 "Dünya isterse dört bir yana dönsün, köklerimizi unutamayız!"
 iberia_north_africa.2105.t:0 "Akdeniz'in Hükümdarları"
 iberia_north_africa.2105.desc:0 " [mallorca.GetNameNoTier], [sardinas.GetNameNoTier] ve [sicily.GetNameNoTier] ele geçirildikten sonra kendimizi Akdeniz'in gerçek hükümdarları olarak ilan ettik. Elçilerimiz bu görkemli başarımızı duyurmak için dünyanın dört bir yanına yelken açtı.\n\nBu deniz ve dokunduğu her şey bize ait!"
 iberia_north_africa.2105.a:0 "Kimse karşımızda duramaz!"
