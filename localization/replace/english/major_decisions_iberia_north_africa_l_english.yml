 iberia_north_africa.2011.desc_merge_into:0 "The resting warrior sits up at my voice then rises as they recognize my station before offering a quick bow,"
 iberia_north_africa.2011.desc_soldier:0 "$iberia_north_africa.2011.desc_merge_into$ "Ben [generated_actor.GetName] adında yolunu kaybetmiş bir savaşçıyım. [generated_actor.GetFaith.HighGodName] beni neden terk etti öğrenmek ve kılıcımı bundan sonra kime karşı sallamam gerektiğini öğrenmek için [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] yollarına düştüm.""
 iberia_north_africa.2011.desc_captain:0 "$iberia_north_africa.2011.desc_merge_into$ "Belki öyleyim. Ama ben kendimi daha çok kayıp bir ruh olarak tanımlıyorum. Adım [generated_actor.GetName], kutsal bir tarikatın lideriydim, şimdi ise [generated_actor.GetFaith.HighGodName] ve uğrunda savaşacak daha büyük bir amaç arayan basit bir gezginim.""
