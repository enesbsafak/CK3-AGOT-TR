 iberia_north_africa.2001.desc:0 "A traveling maester, [generated_actor.GetFullName], has arrived at my court after hearing that I was sponsoring the research. "If it is knowledge you seek, the best can be found in books of old. For while it may be forgotten, it does not hold any less true." states the translator.\n\n"I have with me many books that remain untranslated, if you sponsor me, you will surely benefit from it too!""
