### TODO AGOT-CHANGED: iberia_north_africa.2012.desc_student [AGOT: I am a student seeking the knowledge of the gods and... higher mysteries at the Citadel and Starry Sept. Don't we all wish to better understand the world granted to us by [generated_actor.GetFaith.HighGodName]? I would even be willing to trade you my travelling notes as you are a fellow [generated_actor.GetFaith.GetAdjective]! | TR: Ben [generated_actor.GetFaith.HighGodName] tarafından bize bahşedilmiş bu dünyayı daha iyi anlamaya çalışan bir teoloji öğrencisiyim. Hatta [generated_actor.GetFaith.GetAdjective] kardeşime duyduğum minneti göstermek için isterseniz seyahat notlarımı size verebilirim!]
 iberia_north_africa.2012.desc_student:0 "I am a student seeking the knowledge of the gods and... higher mysteries at the Citadel and Starry Sept. Don't we all wish to better understand the world granted to us by [generated_actor.GetFaith.HighGodName]? I would even be willing to trade you my travelling notes as you are a fellow [generated_actor.GetFaith.GetAdjective]!""
### TODO AGOT-CHANGED: iberia_north_africa.2012.desc_architect [AGOT: I study the architect's trade and I have come to see the wonders that lay at the end of the roseroad... and perhaps learn from the well-kept works at [chosen_holy_site_for_pilgrim_roads.GetNameNoTier]. If you have the coin I would even be willing to part with my notes on architecture! | TR: Ben bir mimarlık öğrencisiyim, bu kadar yolu [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] bölgesinin ünlü yapılarını görmek ve bir şeyler öğrenmek için geldim. Tüm hayatımı bu işe adadım. Eğer bana birkaç bozukluk verirseniz çizimlerimi size verebilirim!]
 iberia_north_africa.2012.desc_architect:0 "I study the architect's trade and I have come to see the wonders that lay at the end of the roseroad... and perhaps learn from the well-kept works at [chosen_holy_site_for_pilgrim_roads.GetNameNoTier]. If you have the coin I would even be willing to part with my notes on architecture!""
 iberia_north_africa.2012.a:0 "Bu bilgi işime yarayabilir. Pekâlâ, bu anlaşmaya onay veriyorum."
