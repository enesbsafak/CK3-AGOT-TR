 iberia_north_africa.2012.b:0 "Why trade for your notes when I could have you?"
 iberia_north_africa.2012.b.flavor:0 "Öğrenciye sarayınızda iyi bir iş teklif edip onu şaşırtıyorsunuz."
 iberia_north_africa.2012.c:0 "Pazarlık yok. Bir [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] olarak sana yardım etmek benim görevim."
 iberia_north_africa.2013.t:0 "Hacılar için bu yolu açan kişinin şerefine."
 iberia_north_africa.2013.desc:0 "[chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip] kutsal bölgesine erişim için yaptığın iş muazzam. Bunun için seni ödüllendirmekle yükümlüyüm.\n\nSöyle, istediğin bir şey var mı?"
 iberia_north_africa.2013.a:0 "Övgünüze mazhar olmuş olmak bana yeter, [fp2_iberia_north_africa_2013_head_of_faith.GetFaith.ReligiousHeadName]."
