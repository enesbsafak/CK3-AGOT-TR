### TODO AGOT-CHANGED: iberia_north_africa.2011.desc [AGOT: As I wander through the [chosen_location_for_pilgrim_roads.GetName], I come upon an old oak whose cool shade tempts me to rest beneath its branches. I leave my retainers to sit there alone for a moment when I notice the legs of a [generated_actor.GetWomanMan] lying in the grass on the other side. With a light step, I round the trunk to ask softly, | TR: [chosen_location_for_pilgrim_roads.GetName] civarında dolaşırken altında dinlenmem için âdeta bana yalvaran büyük bir ağaç görüyorum ve usulca [Select_CString(generated_actor.IsFemale, 'kadının', 'adamın' )] yanındaki serin gölgelik yere oturuyorum.]
 iberia_north_africa.2011.desc:0 "As I wander through the [chosen_location_for_pilgrim_roads.GetName], I come upon an old oak whose cool shade tempts me to rest beneath its branches. I leave my retainers to sit there alone for a moment when I notice the legs of a [generated_actor.GetWomanMan] lying in the grass on the other side. With a light step, I round the trunk to ask softly, "Are you a pilgrim as well?""
