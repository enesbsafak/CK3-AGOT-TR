l_english:
 feature_tapestry_scene_hunt:0 "Duvar halısı bir av sahnesini tasvir ediyor. Yay ve mızraklarla donanmış birkaç avcı yaralı bir hayvanı çevreliyor ve son darbelerini vurmak üzereler."
 feature_tapestry_scene_myth:0 "Mitolojik bir sahneyi betimleyen bu duvar halısı üzerine antik tanrılar, hayranlık uyandıran canavarlar ve korkusuz kahramanlar işlenmiş."
 feature_tapestry_scene_battle:0 "Duvar halısı, muzaffer [Artifact.GetOwner.GetTitledFirstName] ve mağlup [Artifact.GetOwner.MakeScope.Var('epic_loser').Char.GetTitledFirstName] arasında geçen [Artifact.GetOwner.MakeScope.Var('epic_battle_location').Province.GetName] savaşından bir sahneyi gösteriyor."
 feature_tapestry_scene_banquet:0 "Duvar halısı, [Artifact.GetOwner.GetTitledFirstName] ve sarayındaki görkemli bir ziyafeti tasvir ediyor: ünlü konuklar zengin bir masada otururken, göstericiler müzik çalıp dans ediyor."
 feature_tapestry_scene_garden:0 "Duvar halısı üzerine muhteşem bir bahçe tasvir edilmiş. Çimenler yemyeşil, çiçekler bol bol ve rengarenk ve meyvelerle dolu ağaçlar gökyüzüne ulaşıyor gibi görünüyor."
