 artifact_pedestal_koh_i_noor_name:0 "Işık Dağı"
 artifact_pedestal_koh_i_noor_description:0 "Benzersiz boyutta ve şeffaflıkta bir elmas. Güneydoğu Hindistan'daki madenlerden geldiği söyleniyor, ancak muhtemelen gerçek kökeni bilinmiyor."
 artifact_jewelled_danda_name:0 "Mücevherli Danda"
 artifact_jewelled_danda_description:0 "Hindistan'dan gelen, Kraliyet otoritesinin ve hükümdarın tebaasını cezalandırabileceğini simgeleyen süslü mücevherli bir asa."
 artifact_aruval_name:0 "Antik Aruval"
 artifact_aruval_description:0 "Söylentiye göre bu uzun Aruval o kadar eski ki Karuppa Sami tarafından bizzat kullanılmış olması mümkün."
 artifact_khanda_name:0 "Tören Khandası"
 artifact_khanda_description:0 "Savaştan ziyade törenler için yapılan bu Khanda nesiller boyunca cehalet perdesini kesmeyi simgelemek için kullanıldı."
 artifact_makarakundala_name:0 "Makarakundala"
 artifact_makarakundala_description:0 "Bu küpeler âdeta tanrılar tarafından kullanılmış gibi. Hatta kimilerine göre bir zamanlar kutsal varlıklardan insanlara hediye edilmiş."
 artifact_cintamani_name:0 "Çintamani Taşı"
 artifact_cintamani_hindu_description:0 "Bir zamanlar gökten geldiği söylenen taş. Bazıları bu taşın Vişnuya veya Naga Kralı'na ait olduğunu söylüyor ve taşa sahip olanın büyük bir refaha kavuştuğu iddia ediliyor."
 artifact_cintamani_buddhist_description:0 "Bir zamanlar gökten geldiği söylenen taş. Bazıları bu taşın Bodisattvas Avalokiteşvara ve Ksitigarba'ya ait olduğunu, taşa sahip olanların dileklerinin yerine getirildiğini iddia ediyor."
 artifact_navaratna_name:0 "Navaratna"
 artifact_navaratna_description:0 "Hinduizm'deki dokuz gök tanrısını simgeleyen, ortasında büyük bir yakut bulunan dokuz mücevherden oluşan bir zincir."
 artifact_shankha_conch_name:0 "Şankha Kabuğu"
 artifact_shankha_conch_description:0 "Tanrı Vişnu'nun simgesi olan eski Şanhka Kabuğu, dinî törenlerde bir borazan olarak kullanılır, ayrıca refah ve erdemi simgelediği söylenir."
 artifact_pedestal_great_diamond_name:0 "Büyük Elmas"
 artifact_pedestal_great_diamond_description:0 "Bu muazzam mücevherin, açgözlü bir misafir tarafından çalınmadan önce bir tapınak heykelinini süslediği söylenir."
 al_taj_crown_name:0 "el-Taç el-Şerif"
 al_taj_crown_description:0 "Fâtımî halifelerinin geleneksel tören tacı olan 'Onurlu Taç' veya 'Saygı Lütfü' muazzam bir mücevher olan 'el Yatima' ile süslenmiştir."
 qadib_al_mulk_name:0 "Kadıb el-Mülk"
 qadib_al_mulk_description:0 "Fâtımî Halifeliğine ait altınla kaplanmış, inci ve mücevherlerle süslenmiş tören asası."
 ryukyu_shaku_name: "Üç Dağın Shaku'su"
 ryukyu_shaku_description: "Kutsal ada sedirinden oyulmuş, cilalanmış bir törensel baton, klanların tek bir ilahi buyruk altında birleşmesini simgeler."
 ryukyu_crown_name: "Ejder Tacı"
 ryukyu_crown_description: "Mercan kakmalarla bezenmiş bu parça, bilgelik incisinden pençesiyle kavrayan altın bir deniz ejderiyle taçlandırılmıştır. İhtişamı dalgalar boyunca yankılanır, kudret ve refahın bir sembolüdür."
 al_sayf_al_khass_name:0 "el-Saif el-Hass"
 al_sayf_al_khass_description:0 "Bu mücevherli kılıcın yıldırım ile dövüldüğü söylenir. Halife için törensel önemi olduğundan altın işlemeli bir kılıfta muhafaza ediliyor."
 al_dawat_name:0 "el-Davat"
 al_dawat_description:0 "Altın ve mercandan yapılmış bir hokka. Uzun yıllar Hilafet törenlerinde özel bir yeri vardır."
 al_hafir_name:0 "el-Hafir"
 al_hafir_description:0 "El-Hafir veya bilinen adıyla 'Toynak' dünya üzerinde ender görülen bir kalitede yakuttur. Etrafı zümrüt çubuklarla süslenerek bir ipeğe dikilmiştir. Geleneksel olarak Halife'ye ait olan atın yüzünü süslemektedir."
 artifact_wall_banner_thankfulness_name:0 "Minnettarlık Sancağı"
 artifact_wall_banner_thankfulness_description:0 "Bu beyaz ipek sancağın üzerinde altın renkli yazılar vardır ve sancağın kendisi de altın bir mızrağa sarılmıştır. Bu sancak ve ikizi geleneksel olarak Halife törenlerinde kullanılmıştır."
 artifact_arms_of_alex_name:0 "İskender'in Zırhı"
 artifact_arms_of_alex_description:0 "Bu antik, katmanlı ketenden yapılmış zırh takımının bir zamanlar Büyük İskender'e ait olduğu söylenir. Her ne kadar kuşanmaya uygun olmasa da zırhın kendisi Akdeniz'den Hindistan'a uzanan büyük fatihin mirasını taşıyor."
 artifact_pedestal_al_jabal_name:0 "el-Jabal"
 artifact_pedestal_al_jabal_description:0 "El-Jabal veya bilinen adıyla 'Dağ' büyük bir yakutla süslenmiş bir yüzüktür. Yüzüğün üzerindeki taş muazzam büyüklüktedir ve bir zamanlar Sasani imparatorlarının parmağını süslediği söylenir."
 artifact_pedestal_al_yatima_name:0 "el-Yatima"
 artifact_pedestal_al_yatima_description:0 "el-Yatima (Yetim) olarak bilinen bu muazzam incinin dünyada bulunan hiçbir inciye benzemediği söylenir."
 artifact_dagger_of_rostam_name:0 "Rostam'ın Hançeri"
 artifact_dagger_of_rostam_description:0 "Bu giriftli hançerin, bir zamanlar beyaz Daeva'yı öldürmek için Rostam tarafından kullanıldığı söylenir."
 artifact_spear_of_ascalon_name:0 "Ascalon"
 artifact_spear_of_ascalon_description:0 "Bu eski ve kırık mızrak, bir zamanlar Beyrut Ejderhası'nı öldürmek için Aziz George tarafından kullanıldığı söylenir."
 artifact_zomorrodnegar_name:0 "Zomorrodnegar Şemşiri"
 artifact_zomorrodnegar_description:0 "Bu zümrüt işlemeli efsanevi kılıcın, bir zamanlar iblis Fulad-zereh'i öldürmek için Hz. Süleyman tarafından kullanıldığı söylenir."
 artifact_muhammads_epistles_name:0 "Hz. Muhammed'den Gelen Mektup"
 artifact_muhammads_epistles_description:1 "Bu mektup, Hz. Muhammed ile [newly_created_artifact.Custom('EpistleReciever')] hükümdarları arasındaki diplomasinin bir parçasıdır."
 epistle_syria:0 "Suriye"
 epistle_arabia:0 "Arap kabileleri"
 epistle_persia:0 "İran"
 epistle_byzantium:0 "Doğu Roma İmparatorluğu"
 epistle_bahrain:0 "Bahreyn"
 artifact_kaves_apron_name:0 "Kave'nin Önlüğü"
 artifact_kaves_apron_description:0 "Bu yıpranmış bayrağın, İranlı demirci Kave tarafından halkını şeytanı güçlere karşı birlik olması için kendi önlüğünden yaptığı efsanevi sancak olduğu söylenir."
 artifact_joyeuse_name:0 "Joyeuse"
 artifact_joyeuse_description:1 "Şarlman'ın kılıcı, Longinus'un mızrağından bir parça eklenerek dövülmüştür. Joyeuse hem şövalyelik cesaretini hem de Şarlman'ın büyük kraliyet imparatorluğunu simgeler."
 artifact_durendal_name:0 "Durendal"
 artifact_durendal_description:0 "Bu kısa ve ağır kılıcın, Roland tarafından kraliyet tacını düşmanlarından korumak için ölmeden önce sakladığı efsanevi Durendal olduğu söylenir."
 artifact_curtana_name:0 "Curtana"
 artifact_curtana_description:0 "Bu kılıcın Merhametin Kılıcı olan Curtana olduğu iddia ediliyor. Bu efsanevi kılıç, bir zamanlar Morholt ile mücadele etmek için Tristan tarafından kullanılmıştır. Kılıcın kaybolan ucu İrlanda'daki bir devin kafatasının içinde kalmış olabilir."
 artifact_ring_angelica_name:0 "Angelica'nın Yüzüğü"
 artifact_ring_angelica_description:0 "Bu yüzüğün Roland ve Şarlman'ın efsanelerinden bilinen Prenses Angelica'ya ait olduğu söylenir. Takana görünmezlik bahşettiği iddia edilse de zamanla bahşettiği güçler solup gitmiş olmalı. Ancak yine de efsanevi prensesi simgeleyen bir yüzük."
 artifact_olifant_name:0 "Olifant"
 artifact_olifant_description:0 "Detaylı oymalar ile kaplı büyük bir fildişi boru. Kimileri Roncevaux Savaşı'nda Roland tarafından ölmeden önce yardım çağırmak için üflendiği söyler."
 artifact_colada_name:0 "Colada"
 artifact_colada_description:0 "El Cid'in kılıçlarından biri olduğu söylenen bu kılıç, onun şövalyelik düsturuna bağlı olanlar için bir ilham kaynağıdır."
 artifact_aram_name:0 "Aram"
 artifact_aram_description:0 "Bu eski ve kararmış mızrak birçok neslin gelip geçtiğine şahit oldu. O kadar eski ki kimileri onun Jangar'ın hikâyelerinden bilenen efsanevi mızrak Aram olduğuna inanır."
 artifact_ikenga_name:0 "İkenga"
 artifact_ikenga_description:0 "Bu küçük boynuzlu heykelin sahibine başarı ve zafer bahşettiğine inanılıyor."
 artifact_mmaagha_kamalu_name:0 "Mmaagha Kamalu"
 artifact_mmaagha_kamalu_description:0 "Çok eski, süslü bir tören kılıcı. Bir zamanlar İgbo savaş tanrısı olan Kamula'ya ait olduğu iddia ediliyor."
 artifact_bronze_head_name:0 "Bronz Baş"
 artifact_bronze_head_description:0 "Bu natüralist bronz heykel, geçmiş zamanlarda ölmüş bir hükümdarın suratını ayrıntılı bir şekilde göstermektedir. Baş, tasvir ettiği hükümdarın konumunu belirtmek için bir taç ile süslenmiştir."
 artifact_crystal_carving_name:0 "Kristal Oyma"
 artifact_crystal_carving_description:0 "Bu diktörtgen kristal parçası neredeyse şeffaftır ve yüzeyi iç içe girmiş oymalar ile kaplıdır. Ne işe yaradığı bilinmese de hoş bir görüntüye sahiptir."
 artifact_ibeji_name:0 "İbeji"
 artifact_ibeji_description:0 "Bu tahtadan oyulmuş ve zamanında ölmüş ikizleri betimleyen heykel söylenenlere göre ona sahip olanlara büyük bir şans ve zenginlik getirecektir. Özenle ve ayrıntılı bir şekilde işlenmiştir."
 artifact_kantele_name:0 "Antik Kantele"
 artifact_kantele_description:0 "Bu ahşaptan yapılma bir tür telli çalgı olan Kantele nesilden nesile aktarılmıştır. Söylentilere göre geçmişi Väinämöinen'in yaşadığı günlere dayanmaktadır."
 artifact_sledovik_name:0 "Sledovik"
 artifact_sledovik_description:0 "Bu büyük kayanın yüzeyi ayak izleri ile doludur. Uzun yıllar dinî bir mabet olarak kullanılmıştır ve ayak izlerinin yerel din adamlarına ait olduğu söylenir."
 artifact_nagelring_name:0 "Nagelring"
 artifact_nagelring_description:0 "Bu eski kılıç, söylentilere göre efsanevi Dietrich von Bern'e aittir."
 artifact_kladenets_name:0 "Kladenets"
 artifact_kladenets_description:1 "Eski günlerde olduğu kadar güzel gözükmese de bu kılıcın kendi kendine hareket eden efsanevi Kladenets olduğu söyleniyor. Şu anki durumunda onu kullanmak mümkün olmasa da varlığı, doğaüstü geçmişine inanlar arasında büyük bir saygı görmesine neden oluyor."
 artifact_legbiter_name:0 "Bacak Isıran"
 artifact_legbiter_description:0 "Kabzası fildişinden oyulma son derece keskin bir kılıç. Norveç'in büyük kralı Magnus Olafsson'a ait olduğu söyleniyor."
 artifact_quernbiter_name:0 "Değirmen Isıran"
 artifact_quernbiter_description:0 "Bu kılıç bir zamanlar Kral Haakon'a aitti ve söylenenlere göre kılıç o kadar keskindi ki bir taşı ortadan ikiye bölebilirdi."
 artifact_dragvandil_name:0 "Dragvandil"
 artifact_dragvandil_description:0 "Egill Saga'dan bilinen çiftçi, şair ve savaşçı Egil Skallagrimsson'a ait olduğu söylenen kılıç."
 artifact_szczerbiec_name:0 "Szczerbiec"
 artifact_szczerbiec_description:1 "Kiev'in altın kapılarına saldırmak için bir melek tarafından Kral Cesur Boleslaw'a verildiği söylenen kılıç. Sembolik anlamı çok büyüktür."
### TODO AGOT-CHANGED: artifact_chinese_caligraphy_name [AGOT: YiTish Calligraphy | TR: Çin Kaligrafisi]
 artifact_chinese_caligraphy_name:1 "YiTish Calligraphy"
 artifact_chinese_caligraphy_description: "Bu narin kâğıt parçası güzel ve son derece muntazam yazılarla kaplıdır. Kâğıttan berraklık ve zarafet yayılır. Bunu kimin kaleme aldığı bilinmese de mükemmel bir işçiliğe sahiptir."
### TODO AGOT-CHANGED: artifact_ruyi_name [AGOT: Jade Scepter | TR: Ruyi]
 artifact_ruyi_name:0 "Jade Scepter"
 artifact_ruyi_description:0 "Üzeri sembollerle ile dekore edilmiş küçük bir yeşim asa. Mükemmel bir işçiliğe sahiptir."
 turquoise_throne_name:0 "Turkuaz Taht"
 turquoise_throne_description:0 "Bu mücevherler ile kaplı kraliyet tahtı, Şahname'nin Pers krallarına ait olan efsanevi tahta benzetilerek yapılmıştır. Abanozdan yapılma iskeleti, turkuazın dışında saf altından yapılma plakalarla dekore edilmiştir. Bakanın nefesini kesen bu güzellik ancak alanında ustalaşmış zanaatkârların elinden çıkabilirdi."
 peacock_throne_name:0 "Tavuskuşu Tahtı"
 peacock_throne_description:0 "Hiçbir masraftan kaçınılmadan yapılan bu taht, Cemşit'in kraliyet tahtına benzetilmeye çalışmıştır. Dünyanın dört bir yanından getirtilen zanaatkârlar bir araya gelerek altın, gümüş ve sayısız değerli taşı şimdi karşımızda duran tahtta bir araya getirdikleri söylenir."
 artifact_banner_islam_name:0 "Hz. Muhammed'in Kutsal Sancağı"
 artifact_banner_islam_description:0 "Müslüman inancının sembolü olan bu eski bayrağın Hz. Muhammed'in Kutsal Sancağı olduğu iddia edilir."
 artifact_spear_of_the_prophet_name:0 "Peygamber'in Mızrağı"
 artifact_spear_of_the_prophet_description:0 "Söylentilere göre Habeş hükümdarı al-Zubayr bin al-Awwam tarafından hediye edilen Hz. Muhammed'in Mızrağı."
 artifact_mantle_of_the_prophet_islam_name:0 "Peygamber'in Hırkası"
 artifact_mantle_of_the_prophet_description:0 "Peygamber'in Hırkası, asırlarca bir halifeden diğerine miras kalmıştır. Halife tarafından tüm bayramlarda üzerine giyilir, ona şeref ve huzur havası katar. "
 afarganyu_name:0 "Afarganyu"
 artifact_afarganyu_description:0 "Bu büyük tas, Zerdüşt inancının törenlerinde merkezî olan ateşin yakıldığı yerdir. Üzerindeki eski yazı, tasın kimin tarafından hediye edildiğinden bahseder."
 siddhachakra_name:0 "Siddhachakra"
 artifact_siddhachakra_description:0 "Jainler tarafından ibadet için kullanılan mistik bir diyagram. Kral Şripala ve karısı Mayanasundari'nin efsanesiyle bağlantılı olan bu eser, merkezinde bir nilüfer barındırır ve etrafı taç yaprakları üzerine çizilmiş tanrılar ile çevrilidir."
 artifact_staff_kakusandha:0 "Kakusandha'nın Asası"
 artifact_staff_kakusandha_desc:0 "Şimdiki Kalpa'nın ilk budası olan Kakusandha, sahip olduğu bu asa ile tehlikeli hayvanları savuşturur. Aynı zamanda diğer keşişler tarafından ezilmesinler diye küçük hayvanları kovalar."
 water_filter_konagamana:1 "Koṇāgamana'nın Su Filtresi"
 water_filter_konagamana_desc:0 "Şimdiki Kalpa'nın ikinci budası olan Koṇāgamana yolculuğa çıktığı zaman yanında bu su filtresini taşırdı. Basit bir bez parçası olan bu filtre ona hem temiz su verir hem de suyun içindeki böcekleri ayırmasını sağlardı."
 robe_kassapa:2 "Kassapa'nın Cübbesinden Parça"
 robe_kassapa_desc:0 "Şimdiki Kalpa'nın üçüncü Budası olan Kassappa günlük yaşamının büyük bölümünü bu cübbeyi giyerek geçirirdi. Tuhaf bir şekilde kaba kumaştan yapılmış cübbe, bir Buda tarafından giyildiği bilenen tek cübbedir ve bu cübbeye büyük bir saygı duyulmasına neden olur."
 gilded_rats_tail:0 "Altın Kaplamalı Fare Kuyruğu"
 gilded_rats_tail.desc:0 "Fakir adamın mücevheri."
 quail_eggshell_gem:0 "Bıldırcın Yumurta Kabuğundan Yapılma "Mücevher""
 quail_eggshell_gem.desc:0 "Bir mücevher olarak sayılan renkli bir yumurta kabuğu."
 stained_glass_shard:0 "Kutsal "Lekeli" Cam Parçası"
 stained_glass_shard.desc:0 "Üzerinde ilginç bir şekilde kan rengine benzeyen lekeler var..."
 xylospongium:0 "Süngerli Çubuk"
 xylospongium.desc:1 "Nereden geldiği ve ne işe yaradığı belirsizdir. Ancak güzel bir koku yayar."
