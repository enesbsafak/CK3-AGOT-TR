 naked_tapestry_name:0 "Erotik Duvar Örtüsü"
 naked_tapestry_description:0 "Bu tasvir, [inspiration_owner.GetTitledFirstName] bir vaha kenarında iken çizilmiş. Üzerinde kristal gibi parlayan su damlacıkları varken kendini bir yelpaze ile serinletiyor."
 frogspawn_jar_name:0 "Kurbağa Yumurtası Kavanozu"
 frogspawn_jar_description:0 "Kurbağa yumurtaları ve iribaşlarla dolu bir kavanoz. Dışarıdaki dehşetin bir göstergesi olarak [inspiration_owner.GetTitledFirstName] tarafından [ROOT.Char.GetTitledFirstNameNoTooltip] için gönderildi.\n\nKıpır kıpırlar!"
 beaver_book_name:1 "Kunduzların Sarayları"
 beaver_book_description:0 "Kunduz mimarisi ve inşaat teknikleri üzerine, [inspiration_owner.GetTitledFirstName] tarafından seyahatleri sırasında çizdiği eskizlerle yazılmış bir kitap."
 crocodile_tapestry_name:0 "Timsah Duvar Örtüsü"
 crocodile_tapestry_description:0 "[inspiration_owner.GetTitledFirstName], elinden geldiği en iyi şekilde hazırladığı timsahtan yapılma duvar örtüsü. Yaratık parlak bir kırmızı renkte. Birkaç kat dişe, zehirli püstüllere ve dikenli bir kuyruğa sahiptir. Bir şelalenin arkasındaki bir mağarada bir yumurta yığını ile çevrilidir."
 mountain_rock_name:0 "Dağdan Getirilen Kaya"
 mountain_rock_description:0 "[mountain_location.GetName] tepesinden [inspiration_owner.GetTitledFirstName] tarafından sürüklenerek getirilmiş büyük bir kaya."
 reichskrone_name:0 "Reichskrone"
 reichskrone_description:1 "Bu, Kutsal Roma İmparatoru makamının amblemidir. Her geçen dükün dikkatini çekmesi garanti."
 nikephoros_crown_name:0 "II. Nikiforos Fokas'ın Tacı"
 nikephoros_crown_description:2 "Bu, imparatorluk soyunun gördüğü en iyi taktikçilerden birinin tacı. İmparatorluğun batısındaki savaşlarda başarısız olsa da doğuda gerçek bir fatihtir."
 skull_cap_charlemagne_name:0 "Şarlman'ın Kafatası"
 skull_cap_charlemagne_description:0 "Şarlman'ın kafası bu kutunun içinde. Belki de Şarlman'ın bilgeliği bu kutunun sahibine de geçer."
 papal_tiara_name:0 "Papalık Tacı"
 papal_tiara_description:1 "Bu, Papalık Makamı'nı simgeleyen altın taçlı mücevherli piskopos tacıdır. Kafanızın üzerinde çok da görkemli görünmez miydi?"
 essen_crown_name:0 "Kinderkrone"
 essen_crown_description:1 "Kimileri bu tacın III. Otto'nun Essen'deki taç giyme töreni için yapıldığını, kimileri de Bakire heykelini taçlandırmak için üretildiğini söylüyor. Her iki durumda da oldukça küçük bir taç olduğu kesin. Belki kafanıza iyice bastırıp giymeyi deneyebilirsiniz."
 monomachus_crown_name:1 "Monomakos Tacı"
 monomachus_crown_description:1 "Bu IX. Konstantinos Monomakos, karısı Zoe, kız kardeşi Theodora ve bazı alegorik dans figürlerini betimleyen altın panelli portrelerden oluşan bir taç."
 edmund_head_name:1 "Aziz Edmund'un Kafası"
 edmund_head_description:0 "Edmund, doğduğu andan itibaren bir Aziz olmak isterdi. Efsaneler halkının Vikingler tarafından katledilmesine izin vermek yerine Vikinglere gönüllü olarak kurban olan bir Doğu Angliya Kralı olduğunu söyler."
 dhammapada_name:0 "Dhammapada"
 dhammapada_description:1 "Bu, Buda'nın güzel bir palmiye yaprağı el yazmasında ciltlenmiş sözlerinden oluşan bir koleksiyon."
 excalibur_name:0 "'Ekskalibur'"
 excalibur_description:0 "İngiltere'de gerçek Ekskalibur'a sahip olduğunu iddia etmeyen bir hükümdar yoktur. Savaşlar Ekskaliburların el değiştirmesi ile biter."
 vinaya_pitaka_name:0 "Vinaya Pitaka"
 vinaya_pitaka_description:0 "Pali Derlemesi'nin üç eserinden biri olan Budist kutsal kitabı. Bu metin, keşişler ve rahibeler için manastır davranışları sözleşmesini anlatır."
 sutta_pitaka_name:0 "Sutta Pitaka"
 sutta_pitaka_description:1 "Buda'nın ölümünden sonra düzenlenen ilk Budist konseyine dayanan bir Theravada Budist metni. Buda ve öğrencilerine atfedilen birçok şiir ve vaaz içerir. Pali Derlemesi'nin bir parçası."
 abhidhamma_pitaka_name:0 "Abhidhamma Pitaka"
 abhidhamma_pitaka_description:0 "Buda'nın öğretilerini analiz eden ayrıntılı bir öğretici çalışma. Pali Derlemesi'nin bir parçası."
