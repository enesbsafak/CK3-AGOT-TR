 easteregg_artifact_map_lohmander: "Eski Seyahatname"
 easteregg_artifact_map_lohmander_description: "Bu deri ciltli küçük kitapta, İskandinav bir kâtibin Batı'dan Hindistan'a yaptığı yolculuğun hikâyeleri yer alıyor. Tehlikeleri, yolları, yolculuğu yapan kişilerin hangi aletlere ihtiyaç duyucağını, nereden su getireceğini ve nerede hangi çizmelerin giyilmesi gerektiğine dair ayrıntılarıyla anlatıyor. Ayrıca yerel yemekler veya danslar hakkında da birçok bilgi içeriyor.\n\nİçinde ayrıca Hindistan'ın yanı sıra diğer birçok yeri tasvir eden, uzak yerler ve geçmiş çağlardaki isimleri hakkında notlar içeren bir dizi katlanmış harita bulunuyor."
 easteregg_artifact_jason_sword:0 "Aziz Martin'in Kılıcı"
 easteregg_artifact_jason_sword_description:0 "Kılıcın oluğuna birisi beceriksiz bir şekilde bu kelimeleri kazımış: "Ben olduğum gibiyim.""
