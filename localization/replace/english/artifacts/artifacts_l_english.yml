### TODO AGOT-CHANGED: artifact_oxus_bracelet_description [AGOT: This bracelet of wonderful craftmanship is said to hail from the land of Hyrkoon. Though its inlay of enamel and semi-precious stones is long lost, the gold retain its luster. Bracelets like this were gifts of honor at the courts of the kings of Sarnor in ages past, so perhaps it was once worn by a great lord. | TR: Kusursuz bir işçilik eseri olan bu bileziğin $k_transoxiana$ topraklarından geldiği söylenir. Değerli taşlardan oluşan kakması çoktan kaybolmuş olsa da, altın kısımları parlaklığını ilk günkü gibi korumaktadır. Bu tarz bilezikler antik çağda Kralların Kralının sarayındaki soylular tarafından giyilirdi, belki bu bilezik de bir zamanlar Babil'de yüce bir lord tarafından giyilmiştir.]
 artifact_oxus_bracelet_description: "This bracelet of wonderful craftmanship is said to hail from the land of Hyrkoon. Though its inlay of enamel and semi-precious stones is long lost, the gold retain its luster. Bracelets like this were gifts of honor at the courts of the kings of Sarnor in ages past, so perhaps it was once worn by a great lord."
