 tiny_sculpture_trinket_description:1 "[statue_owner.GetTitledFirstNameNoTooltip] için yapılmış, kendisinin minik heykeli. Cep boy ve hükmetmeye hazır. [inspiration_owner.GetTitledFirstNameNoTooltip] tarafından yapılmış."
 tiny_box_trinket_name:0 "Minyatür Kutu"
 tiny_box_trinket_description:0 "Küçük ama gizemli bir kutu. Belki açıldığında neler olacağını kimse bilemez. [inspiration_owner.GetTitledFirstNameNoTooltip] tarafından yapılmış."
 tiny_chest_trinket_name:0 "Minyatür Sandık"
 tiny_chest_trinket_description:0 "Küçük, kilitli bir sandık ama başparmak büyüklüğünde. Sallandığında tıkırdıyor. [inspiration_owner.GetTitledFirstNameNoTooltip] tarafından yapılmış."
 tiny_cabinet_trinket_name:0 "Minyatür Dolap"
 tiny_cabinet_trinket_description:0 "Minicik bir dolap, üzerine basılmasını önlemek için muhtemelen başka bir dolapta saklanmalıdır. [inspiration_owner.GetTitledFirstNameNoTooltip] tarafından yapılmış."
 tiny_throne_trinket_name:0 "Minyatür Taht"
 tiny_throne_trinket_description:0 "Bir farenin veya başka bir kemirgenin hüküm sürmesi için uygun bir taht. [inspiration_owner.GetTitledFirstNameNoTooltip] tarafından yapılmış."
 prince_archivist_love_poem_name:0 "Ben Ay'ım, Sen de Güneş"
 prince_archivist_love_poem_description:0 "Birbirine aşık iki adamın şarkısı. Bir prens ve bir arşivci. Bir kulenin tepesinde, meraklı gözlerden uzakta ve birlikte yıldızları seyrederken. Söylentilere göre yazar [inspiration_owner.GetTitledFirstNameNoTooltip], arşivci karakteri kendi deneyimlerine dayanarak yazmış."
 witch_queen_love_poem_name:0 "Yıkılan Bir Kalp"
 witch_queen_love_poem_description:0 "Birbirine aşık iki kadını anlatan bir şiir. Bir cadı ve cadının ormandaki kulübesinin etrafında kaybolmuş bir kraliçe. İkisi de toplumdan uzakta rahata eriyorlar. Söylentilere göre yazar [inspiration_owner.GetTitledFirstNameNoTooltip], cadıyı yazarken kendinden ilham almış."
