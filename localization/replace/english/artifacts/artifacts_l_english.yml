 mysterious_lamp:0 "Gizemli Lamba"
 mysterious_lamp_description:0 "Değerli taşlarla süslenmiş altın bir lamba. Lambayı elinize aldığınızda kozmik bir gücün varlığını hissediyorsunuz."
 mysterious_puzzle:0 "Gizemli Yapboz"
 mysterious_puzzle_description:0 "Yabancı dilde yazılar barındıran, altın işlemeli abartılı bir yapboz. Bir zamanlar güçlü bir oyun ustasına ait olduğu söyleniyor."
