 improvised_dagger_desc:0 "Bu hançer, tarlada kullanılan bir aleti değiştirerek yapılmış. Kavraması kolay ve hâlâ keskin."
 improvised_billhook_desc:0 "Bu tek elli keski çalılıklardan dal kesmek için kullanılmış. Bir krala yakışmasa da eğri bıçağı zırhtaki savunmasız yerleri bulmada iyi iş çıkarıyor."
