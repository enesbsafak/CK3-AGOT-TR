### TODO AGOT-CHANGED: easteregg_artifact_veronica_book_description [AGOT: A thinly-veiled reference, in book form. Written in a language long lost beyond the sea. | TR: Kitap hâlindeki açık bir gönderme. Güzel bir Portekizce ile yazılmış.]
