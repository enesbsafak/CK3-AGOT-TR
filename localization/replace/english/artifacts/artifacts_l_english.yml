### TODO AGOT-CHANGED: artifact_sassanian_replica_sword_name [AGOT: Sarnori Style Sword | TR: Sasani Tarzındaki Kılıç]
 artifact_sassanian_replica_sword_name: "Sarnori Style Sword"
 sassanian_sword_description_base: "titizlikle işlenmiş süslemeleriyle"
 famed_replica_sassanian_sword_description: "Geçmişin görkemli dönemlerinden alınan ilhamla ortaya çıkarılan bu kılıç, yaratıcısının atalarının kahramanlık dolu hikâyelerini anımsatır. Kılıç $sassanian_sword_description_base$ kusursuz bir görüntüye sahiptir. Eski çağın efsanevi kralları tarafından kuşanılacak güzelliktedir."
 masterwork_replica_sassanian_sword_description: "Antik çağdaki silahlardan esinlenerek ortaya çıkarılan bu kılıç, yaratıcısının atalarının tarihî kahramanlıklarına atıfta bulunur. Kılıç $sassanian_sword_description_base$ kusursuz bir görüntüye sahiptir. Kuşananı unutulmuş bir dönemin önemli bir hükümdarı gibi hissettirebilir."
 common_replica_sassanian_sword_description: "Yaratıcısının atalarının kuşandığı silahlardan esinlenerek ortaya çıkardığı bu kılıç ucuz taşlar ve özensiz süslemelere sahiptir. Bu kılıcı taşıyanlar, kılıçla beraber çoktan geride kalmış bir döneme geri dönmeyi arzulayan budalalar gibi görünme riskini de taşır."
 artifact_magnificent_crown_name: "Muhteşem Taç"
 artifact_magnificent_crown_description: "Bu tacın telkari işlemeleri ve ince işlenmiş desenleri, varlığının gerçek sebebini yansıtma amacı güdüyor: [ROOT.Char.GetFirstNamePossessive] ataları sahip oldukları kudreti ona bahşediyor ve onun kudreti sergileniyor."
 artifact_splendid_necklace_name: "Görkemli Kolye"
 artifact_splendid_necklace_description: "[artifact.GetOwner.GetHouse.GetBaseName] hanesinin armasını taşıyan bu kolye, kolyeyi takanın meşruluğunun en büyük kanıtı."
 artifact_fine_brooch_name: "Güzel Broş"
 artifact_fine_brooch_description: "Bu broşun köşelerinde süslü harflerle [artifact.GetOwner.GetHouse.GetBaseName] hanesinin adı yer alıyor, bu da broşu takanın meşruluğunu gösteriyor."
 medicine_jar: "İlaç Kavanozu"
 medicine_jar_desc: "Bu kavanozun içerisinde nadir bulunan fakat bir o kadar da etkili şifalı bitkiler, iyileştirici taşlar ve kurutulmuş hayvan parçaları bulunuyor. Hekimler bu parçaları hastalıkları tedavi etmek için kullanıyorlar."
 whale_fat_candles_name: "Balina Yağı Mumları"
 whale_fat_candles_description: "Bu mumlar korkunç bir deniz canavarının yağından üretilmiştir. Sivri uçlarıyla korkutucu duruyor."
 warenne_coin: "Warenne Sikkesi"
 warenne_coin_description: "Bu sikkenin ön yüzünde Warenne hanedanının mavi-sarı damalı amblemi yer alır. Kenarında ise koyu bir kan lekesi."
 traitors_head: "Hainin Kafası"
 traitors_head_description: "Sahibinden özenle kesilmiş, bedensiz bir kafa. Süsten çok mesaj işlevi görüyor."
 artifact_: "Yok Edilmiş Eser"
 artifact_slot_untyped: "Yok Edilmiş Eser             " # Yes the tabs are intended
 artifact_tale_of_genji: "Genji'nin Hikâyesi"
 artifact_tale_of_genji_description: "Minamoto $TO_ru$ hayatından alınan ilhamla yazıldığı söylenen Genji'nin Hikâyesi, Leydi Murasaki tarafından kaleme alınmış roman benzeri bir eserdir. İmparatorun oğlu hayalî Prens Genji'nin yaşamını ve aşklarını anlatır."
 artifact_pillow_book: "Yastıkname"
 artifact_pillow_book_description: "Şair ve saray hanımı Sei Shōnagon'un kişisel günlüğü olarak yazdığı Yastıkname, Japon aristokrasisinin gündelik dedikodularına, aşklarına ve entrikalarına dair bir pencere aralar."
