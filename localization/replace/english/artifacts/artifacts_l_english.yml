 lavender_jade_pendant:0 "Eflatun Renginde Yeşim Kolye"
 lavender_jade_pendant.desc:0 "Zengin mor rengiyle bezenmiş şeritler çarpıcı görünüyor."
 sekhmet_ring:0 "Eski Mühür Yüzüğü"
 sekhmet_ring.desc:0 "Altın yüzüğün üzerinde tuhaf bir miğferle poz veren bir insan motifi bulunmaktadır."
 scarab_brooch:0 "Antik Bokböceği Broşu"
 scarab_brooch.desc:0 "Bokböceği şeklinde narin bir broş. Üzerinde bulunan zümrüt işlemelerin sağlığa iyi geldiği söylenir."
 easteregg_artifact_elisabeth_plush:0 "Elisabeth'in Doldurdulmuş Tilkisi"
 easteregg_artifact_elisabeth_plush_description:0 "Elisabeth'in doldurulmuş tilkisi en sevdiği oyuncaktı ve hayatı boyunca arkadaş olmuşlardı. İşverenleri için karmaşık sözler yazarken sık sık tilkisiyle konuşurdu. Huzur verir ve sahibine tilki gibi kurnaz olmayı hatırlatır."
 easteregg_artifact_nicks_redolence: "Son Koku"
 easteregg_artifact_nicks_redolence_description: "İçinde [ROOT.Char.Custom('GetComplexColor')] renkte bir sıvı bulunan küçük bir şişe. Şişenin kapağı açıldığında o kadar keskin bir koku yayılıyor ki kadınlar kadar erkeklerin de dikkatini çekiyor. Şişenin üzerinde #EMP "Ve şimdi, sonunuz yakın..."#! yazıyor."
