 terracotta_toy_fowl:0 "Çömlekten Yapılma Oyuncak Tavuk"
 terracotta_toy_fowl.desc:0 "Aşınmış bir yüzey, bir zamanlar sevilerek oynanmış bir oyuncağın hikâyesini anlatıyor."
 stewardship_general.2001.artifact.potsherd_holy:0 "Kırık Çömlek Parçası"
 stewardship_general.2001.artifact.potsherd_holy.desc:0 "Eski bir çömlek parçası. Söylentilere [trinket_holy_site.GetNameNoTierNoTooltip] kutsal bölgesinden geliyor."
