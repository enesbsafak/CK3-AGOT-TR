 fp3_incense_burner_sculpture_desc: "Kedi şeklindeki bu tütsü yakıcı, sahip olduğu deliklerden hoş kokulu dumanlar çıkarır. Mücevher işlemeli gözlere sahip kafa kısmında, içine yanan tütsü yerleştirilebilmesi için özel bir bölme yer almaktadır."
