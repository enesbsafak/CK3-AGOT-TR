 coronation_events.0150.t: "Bozulan Yemin: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0150.desc: "Kapalı kapılar ardında fısıldaşmalarını duyuyorum. Gözlerine kazınmış hayal kırıklığını görüyorum ve üzerime çöken utancın ağırlığını hissediyorum.\n\nHepsi biliyor... Başaramadım. Tüm tebaama verdiğim bir sözü, yerine getireceğime yemin ettiğim yemini bozdum.\n\nŞimdi onlarla nasıl yüzleşirim? Bu yüz karasını nasıl taşırım?"
 coronation_events.0150.desc_honest: "Güç, verilen sözle birlikte geldi. Diyarın önünde durup onların inandığı bir yemini, #emp benim#! de inandığım bir yemini ettim.\n\nŞimdi taht, oturaktan ziyade bir mezar gibi. Her nefeste benimle alay eden soğuk, yaldızlı bir kafes. Ve en kötüsü de, tüm bunların benim kendi hatam olduğunu bilmek."
 coronation_events.0150.desc_deceitful: "Bırak fısıldaşsınlar. Yaralı gururları ve boş hayal kırıklıklarıyla gözdağı versinler. Görüyorum. Hükümlerini sırtımda bir bıçak gibi hissediyorum.\n\nAma utanç mı? Hayır, utanç ancak sözünü tutmayı hiç gerçekten amaçlayanlar içindir.\n\nYemin, yalnızca ahmaklar için kutsaldır."
 coronation_events.0150.a: "Ne utanç verici..."
 coronation_events.0150.a_honest: "Bu utançla nasıl yaşayacağım?"
 coronation_events.0150.a_deceitful: "Olan oldu."
 coronation_events.150.custom_list_tooltip: "Her [vassal|E], [courtier|E] ya da [guest|E]"
 coronation_events.0175.t: "Yerine Getirilen Yemin: [SCOPE.Custom('GetOathSpecific')|V]"
 coronation_events.0175.desc: "İşim bitti, her şey tam da söylediğim gibi oldu. Yemin ettiğimde başarısız olacağıma inananların küçümseyen seslerini duymuştum.\n\nAma yanıldıklarını kanıtladım. Şüphecilerimin sesleri değişti, artık erişilmez sandıkları onuru bana layık görüyorlar.\n\nYeni bir gün doğuyor..."
 coronation_events.0175.a: "Ve daha güçlü bir [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], yeni günle yüzleşmeye hazır!"
