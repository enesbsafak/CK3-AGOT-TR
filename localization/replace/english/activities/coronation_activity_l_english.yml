﻿l_english:
 activity_coronation: "Taç Giyme Töreni"
 activity_coronation_host_desc: "$BULLET_WITH_TAB$@law_icon![GetLaw('crowned_king').GetName] veya [GetLaw('crowned_emperor').GetName] [Concept('law', 'Yasası')|E]\n$BULLET_WITH_TAB$@faction_icon![factions|E] Taç Giyme Töreni esnasında Talepte bulunamazlar\n$BULLET_WITH_TAB$[opinion_i][opinion|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i][legitimacy|E]\n$BULLET_WITH_TAB$Güçlü bir [oath|E] [Concept('decision', 'Kararı')|E]\n\n@warning_icon! #X @faction_icon![factions|E] ve diğer düşmanlar Taç Giyme Töreninin [Concept('coronation_magnificence', 'Şaşaasına')|E] zarar verecek#!"
 activity_coronation_guest_desc: "$BULLET_WITH_TAB$Katılımcılar diğer katılımcılara karşı [opinion_i][opinion|E] kazanabilir\n$BULLET_WITH_TAB$Katılımcılar [Concept('intent', 'Niyetlerine')|E] göre benzersiz fırsatlar elde edebilir"
 activity_coronation_desc: "Tahta çıkışınıza tanıklık etmeleri için ülkenin önde gelenlerini davet edin. Bu, uzun ve başarılı bir hükümdarlığın temellerini atacaktır."
 activity_coronation_conclusion_desc: "[GetActivityType( 'activity_coronation' ).GetName] sona erdi."
 activity_coronation_selection_tooltip: "Tahta çıkışınıza tanıklık etmeleri için ülkenin önde gelenlerini davet edin. Bu, uzun ve başarılı bir hükümdarlığın temellerini atacaktır.\n\nÖngörülen Ödüller:\n$activity_coronation_host_desc$"
 activity_coronation_destination_selection: "\nBir [coronation|E] genellikle [Concept('host', 'Ev Sahibinin')|E] [Concept('realm', 'Ülkesinde')|E] yapılmalıdır, istisna olarak [anointments|E] uygun [Concept('holy_sites', 'Kutsal Bölgelere')|E] sahiplerse [Concept('head_of_faith', 'Mezhep Liderinin')|E] topraklarında yapılabilir."
 activity_coronation_guest_help_text: "Taç Giyme Töreni, bağlar kurmak ve hem [vassals|E] hem de diğer [rulers|E] üzerinde etki bırakmak için harika bir fırsattır.\n\nTörene katılan her misafir, diğer misafirlerle karşılıklı [opinion|E] arttırma fırsatlarına sahip olur ve [Concept('activity', 'Etkinliğin')|E] [host|E] ile özel etkileşim şansları elde eder."
 invite_to_activity_flavor_coronation: "Sizi, ülkenin geri kalanıyla beraber yaklaşan taç giyme törenim için [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] topraklarında bana katılmaya içtenlikle davet ediyorum."
 activity_coronation_underage_tt: "En az #V 12#! yaşında #bold değilsiniz#!\n#flavor Taç başınıza büyük geliyor#!"
 activity_coronation_not_approved_anointment: "[GetPlayer.GetFaith.GetReligiousHead.GetTitledFirstName] bu [Concept('anointment', 'Kutsanmayı')|E] onaylamadı, [request_anointment|E] [Concept('interaction', 'Etkileşimiyle')|E] onayını isteyin"
 activity_coronation_province_desc: "Taç Giyme Töreni [ROOT.Province.GetName] topraklarında düzenlenecek"
