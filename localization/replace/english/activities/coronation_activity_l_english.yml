 coronation_type_normal: "Taç Giyme Töreni"
 coronation_type_normal_desc: "$BULLET_WITH_TAB$[Concept('legitimacy', 'Meşruiyetinizi')|E] kanıtlayın\n$BULLET_WITH_TAB$Bir [oath|E] ederek hükümdarlığınızın seyrini yönlendirin\n$BULLET_WITH_TAB$[Concept('vassals', 'Vasallarınızla')|E] [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'coronation_type_tributaries' )] aranızdaki [Concept('opinion', 'Görüş')|E] artabilir\n$BULLET_WITH_TAB$[Concept('vassals', 'Vasallarınız')|E] @faction_icon![Concept('factions', 'Örgütleşmelerden')|E] ayrılabilir\n$BULLET_WITH_TAB$Fazladan [Concept('prestige', 'Prestij')|E] kazanmak için kendinizi taçlandırabilirsiniz\n\n#weak $coronation_type_normal_flavor$#!"
 coronation_type_normal_flavor: "Görkemli bir merasim, hükmünüzün meşruiyetini ispatlayacak ve krallığınızın azameti, egemenliğinizin sembolü olacaktır."
 coronation_type_tributaries: "ve [Concept('tributaries', 'Haraçgüzarlarınızla')|E]"
 coronation_type_anointment: "Kutsanma"
 coronation_type_anointment_desc: "$BULLET_WITH_TAB$[Concept('legitimacy', 'Meşruiyetinizi')|E] tartışmasız biçimde kanıtlayın\n$BULLET_WITH_TAB$[Concept('piety', 'Dindarlık')|E], @fervor_icon![Concept('fervor', 'Coşku')|E] ve [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] [Concept('vassals', 'Vasalların')|E] desteğini kazanın\n$BULLET_WITH_TAB$[oath|E] ederek hükümdarlığınızın seyrini yönlendirin\n$BULLET_WITH_TAB$[Concept('vassals', 'Vasallarınızla')|E] [Concept('opinion', 'Görüş')|E] kazanırsınız\n$BULLET_WITH_TAB$Diğer [Concept('rulers', 'Hükümdarlarla')|E] [Concept('opinion', 'Görüş')|E] kazanırsınız\n$BULLET_WITH_TAB$[Concept('vassals', 'Vasallar')|E] @faction_icon![Concept('factions', 'Örgütleşmelerden')|E] ayrılabilir\n$BULLET_WITH_TAB$@alert_icon! #alert_trial Tören, [Concept('faith', 'Mezhebinizin')|E] bir [Concept('holy_site', 'Kutsal Bölgesinde')|E] düzenlenmelidir#!\n\n#weak $coronation_type_anointment_flavor$#!"
 coronation_type_anointment_flavor: "Gerçek bir hükümdar, kutsal bir gayeyle çevrelenmiş ve ilahi lütufla tahta çıkarılmış olmalıdır. Dünyevi güç, bunun yerini tutamaz."
 anointment_minimum: "[Concept('activity_option', 'Etkinlik Seçeneği')|E] [Concept('anointment', 'Kutsanma')|E] için mevcut değil"
 ceremony_size: "Tören"
 coronation_small_ceremony: "Sade Ayinler"
 coronation_small_ceremony_desc: "$EFFECT_LIST_BULLET$ [Concept('coronation_magnificence', 'Şaşaa')|E] azalır\n$EFFECT_LIST_BULLET$ Yabancı [Concept('rulers', 'Hükümdarlar')|E] [Concept('activity', 'Etkinliğe')|E] katılmaz\n$EFFECT_LIST_BULLET$ Eğer [Concept('coronation_magnificence', 'Şaşaa')|E] etkinlik sona erdiğinde #high 50#!'nin altındaysa, #high 10 yıl#! boyunca [GetModifier('ach_coronation_low_ceremony_modifier').GetNameWithTooltip] etkisini kazanırsınız\n\n#weak Ben zaten hükümdarım, değil mi? Neden bu kadar insanı diyarları bu basit formaliteye davet edeyim?#!"
 coronation_medium_ceremony: "Saygın Tören"
 coronation_medium_ceremony_desc: "$EFFECT_LIST_BULLET$[Concept('coronation_magnificence', 'Şaşaa')|E] artar\n$EFFECT_LIST_BULLET$ [Concept('activity_guests', 'Konukların')|E] katılma ihtimali bir miktar yükselir\n\n#weak Hükümdarlığın kutsal yeminleri, asaletin görkemiyle ve saygı dolu büyük bir toplanmayla uyum içinde olmalıdır.#!"
 coronation_large_ceremony: "İhtişam ve Görkem"
 coronation_large_ceremony_desc: "$EFFECT_LIST_BULLET$[Concept('coronation_magnificence', 'Şaşaa')|E] büyük ölçüde artar\n$EFFECT_LIST_BULLET$ [Concept('activity_guests', 'Konukların')|E] katılma ihtimali önemli ölçüde yükselir\n\n#weak Kutsal emanetler, ışıltılı mücevherler ve büyüleyici müzik eşliğinde tüm akrabalarım, vasallarım ve uzak diyarlardan saygın misafirler burada olacak.#!"
 ceremony_feast_type: "Kutlamalar"
 ceremony_feast_type_austere: "Sade Merasim"
 ceremony_feast_type_austere_desc: "$EFFECT_LIST_BULLET$[Concept('coronation_magnificence', 'Şaşaa')|E] azalır\n$EFFECT_LIST_BULLET$ Eğer [Concept('coronation_magnificence', 'Şaşaa')|E] etkinlik sona erdiğinde #high 50#!'nin altındaysa, #high 10 yıl#! boyunca [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_coronation_low_feast', 'generic_coronation_low_feast' )] etkisini kazanırsınız\n\n#weak Bu tarihi ana tanıklık etmek başlı başına bir şeref değil mi? Daha ne istiyorlar?#!"
 generic_coronation_low_feast: "[GetModifier('ach_coronation_low_feast_modifier').GetNameWithTooltip]"
 mandala_coronation_low_feast: "[GetModifier('mandala_coronation_low_feast_modifier').GetNameWithTooltip]"
 ceremony_feast_type_regular: "Layık Şölen"
 ceremony_feast_type_regular_desc: "$EFFECT_LIST_BULLET$[Concept('coronation_magnificence', 'Şaşaa')|E] artar\n\n#weak Soylulara layık bu buluşmada ve tören sonrası ziyafetlerde cimriliğe yer yok.#!"
 ceremony_feast_type_lavish: "İhtişamlı Ziyafet"
 ceremony_feast_type_lavish_desc: "$EFFECT_LIST_BULLET$[Concept('coronation_magnificence', 'Şaşaa')|E] büyük ölçüde artar\n$EFFECT_LIST_BULLET$Olumsuz olay yaşama riski azalır\n\n#weak Sonu görünmeyen kadehlerle enfes kokulu lezzetler konukları bekliyor, bu ziyafet hükümdarın ihtişamının bir göstergesi.#!"
 ach_coronation_low_ceremony_modifier: "Sönük Tahta Çıkış"
 ach_coronation_low_ceremony_modifier_desc: "Halk, bu hükümdarın gerçekten kendi efendileri olduğunu neredeyse bilmezken, soylular da bu cılız tahta çıkış merasimini unutalı çok oldu."
 ach_coronation_low_feast_modifier: "Aşağılanmış Soylular"
 ach_coronation_low_feast_modifier_desc: "Bu hükümdarın taç giyme törenindeki utanç verici derecede sönük kutlamalar, katılımcıların aşağılanmış hissetmesine sebep oldu."
 mandala_coronation_low_feast_modifier: "Aşağılanmış Tebaa"
 mandala_coronation_low_feast_modifier_desc: "$ach_coronation_low_feast_modifier_desc$"
 coronation_hof_guest: "Mezhep Lideri"
