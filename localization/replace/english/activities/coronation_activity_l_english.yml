 coronation_events.0210.t: "Ziyafet"
 coronation_events.0210.desc.host: "Seremoniler tamamlandı, hükümdarlığın şereflerinin her biri bana bahşedildi. Bir kez daha ayağa kalkıyorum, bu kez vadetmek ve buyurmak için değil, misafirlerime görkemli zevkler sunmak için.\n\n"Sofralar donatılsın. Kadehler kaldırılsın ve bu salon sorumluluk bilinci kadar neşeyi ve mutluluğu da hatırlasın."\n\nUzun ve gösterişli ayinlerden aç düşmüş misafirlerden onaylarcasına bir uğultu yükseliyor. En azından şimdilik de olsa dikkatlerini benim dışımda bir şeye verebiliyorlar."
 coronation_events.0210.desc.guest: "Seremoninin sona ermesiyle birlikte ev sahibi bir kez daha ayağa kalkınca, bu kez törenin sonunu ve daha rahat bir kısmın başlangıcını sezen misafirler arasında mırıltılar yükseliyor.\n\n[host.GetTitleAsName], yüksek bir sesle: "Dostlarım, ayinler tamamlandı. Sofralar donatılsın, kadehler kaldırılsın ve bu salon sorumluluk bilinci kadar neşeyi ve mutluluğu da hatırlasın."\n\nSözleri iyi karşılanıyor ve gerçek kutlamalar başlıyor."
 coronation_events.0210.a: "Nihayet, biraz yemek!"
 coronation_events.0210.b: "Nihayet, tören bitti."
 coronation_events.0300.t: "Onurlu Bir Makam"
 coronation_events.0300.desc: "Taç giyme töreni ilerlemeden önce, kutsal ayinlere kimin başkanlık edeceğine karar vermeliyim. [ROOT.Char.GetFaith.AltPriestTermPlural|U] sınıfının teveccühünü kazanacaksam, törene kendi içlerinden birinin nezaret etmesine izin vermek, yalnızca onların verebileceği kutsiyet ve kutsamayı kazandırmak açısından akıllıca olacaktır.\n\nYine de içimin bir köşesi fısıldıyor: Araya kimse girmeden, hakkımı herkesin önünde ilan ederek tacı kendi ellerimle takmam daha görkemli bir hikâye olmaz mı?"
