 martial_oath_2_tooltip: "#V Ülkeyi Genişletmek#! için bir [oath|E] ederim:\n\t$EFFECT_LIST_BULLET$[realm|E] en az [host.MakeScope.ScriptValue('oath_conquest_value_1')|V0] büyüklüğe ulaşmalı #low (Şu anda [host.MakeScope.ScriptValue('oath_conquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$#V 20 yıl#! içinde tamamlanmalı\n$EFFECT_LIST_BULLET$[capital|E] için bir bonus ile [de_jure|E] kayması yaşayacak [titles|E] arasında seçim yap\n$EFFECT_LIST_BULLET$Ödüller: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E] ve [GetModifier('oath_of_conquest').GetNameWithTooltip] etkisi"
