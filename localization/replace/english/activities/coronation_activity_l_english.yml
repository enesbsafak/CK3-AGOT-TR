 coronation_events.0205.b_flavor_infirm: "...Taç giyme törenine gidecek takati zar zor kalmışken."
 coronation_events.0205.b_improved: "Ama neyse ki böylesi ihtişam içinde bunu pek az kişi fark edecek!"
 coronation_events.0205.c_low_magnificence_east_admin: "Yaşayanlar daha iyi bilir!"
 coronation_events.0205.c_low_magnificence: "Daha dikkatli bakın, hödükler! [activity.GetHost.GetTitleAsNameNoTooltip] dediğin böyle olur."
