 coronation_events.0110.t: "Yemin"
 coronation_events.0110.desc.intro: "Herkes onun yeminini beklerken [activity.GetHost.GetFirstName] kalabalığın önünde dimdik duruyor ve konuşmasına başlıyor:\n\n"
 coronation_events.0110.desc.diplomacy_oath_1: "#emp Hiçbir diyar tek başına gelişmez. Güç yalnız ordularda değil, güven bağlarında, söz ve iradeyle kurulan antlaşmalardadır.\n\n[activity.GetHost.GetCapitalLocation.GetName] şehrinden dostluk elini uzatacak, [activity.GetHost.GetPrimaryTitle.GetNameNoTier] topraklarını nesiller boyu koruyacak ittifaklar öreceğim.#!"
 coronation_events.0110.desc.diplomacy_oath_2: "#emp Bir diyarın kudreti yalnız kazanılan ittifaklarda değil, sürekliliğin sessiz vaadinde yatar. [activity.GetHost.GetHouse.GetName] hanesinin devamlılığını temin ederek, diyarımıza taş gibi sarsılmaz bir temel sağlayacağım.\n\nEvlatlarımızla, [activity.GetHost.GetHouse.GetName] soyu kesintisiz sürecek, istikrarı muhafaza edecek ve ülkemizin gelecekteki sorunlara göğüs gerebilmesini sağlayacak.#!"
 coronation_events.0110.desc.martial_oath_1: "#emp Bugün yalnız hükmetmek için değil, inşa etmek için ayağa kalkıyorum. Olanı korumak için değil, olabilir olanı yaratmak için buradayım. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] ne hatıralara sığar ne de haritalara, büyümek zorundadır.\n\nGeleceğimiz için, halkımızın geleceği için.#!"
 coronation_events.0110.desc.martial_oath_2: "#emp [activity.GetHost.GetPrimaryTitle.GetNameNoTier] topraklarının bir kısmı uzun zamandır alçakların elinde acı çekiyor. Mülkiyeti meşruiyet sananların elinde.\n\nArtık devran değişecek. [activity.GetHost.GetCapitalLocation.GetName] şehrinden, gerçek idarenin ne olduğunu öğrenecekler. Onlara bunu ben göstereceğim.#!"
 coronation_events.0110.desc.stewardship_oath_1: "#emp Bir hükümdarın görevi yalnızca sınırları savunmak değildir, sınırların içinde hayatı yaşanmaya değer kılmaktır. Ben barışı koruyacak, diyarı gözetip büyütecek ve savaş için değil, refah için plan yapacağım.\n\n[activity.GetHost.GetCapitalLocation.GetName] şehrinden tüm [activity.GetHost.GetPrimaryTitle.GetNameNoTier] topraklarını yeni bir altın çağa taşıyacağım.#!"

 coronation_events.0110.desc.stewardship_oath_2:0 "#emp "Not all legacies are born in war. Some are crafted in stone, with sweat and purpose. I will reshape [activity.GetHost.GetPrimaryTitle.GetNameNoTier] with monuments worthy of the future.\n\nFrom [activity.GetHost.GetCapitalLocation.GetName], I will raise a realm not just to endure, but one that enters a golden age shaped by care and vision."#! "

 coronation_events.0110.desc.learning_oath_1:0 "#emp "Let no ruler mistake ignorance for strength. A realm guided by insight shall outlast any built on fear alone.\n\nFrom [activity.GetHost.GetCapitalLocation.GetName], I will gather the finest minds, and through their counsel, shape the future of [activity.GetHost.GetPrimaryTitle.GetNameNoTier]."#!"
 coronation_events.0110.desc.purge_pretenders_oath: "#emp [activity.GetHost.GetPrimaryTitle.GetName] tahtında sahte hak iddia edenler, lağımdaki sıçanlar gibi çoğaldı. Ve haşerat gibi, hepsi kökünden temizlenmeli.#!"
 coronation_events.0110.desc.end_the_struggle_oath: "#emp [activity.GetHost.GetCulture.GetCollectiveNoun] nesillerdir [activity.GetHost.MakeScope.Var('end_the_struggle_oath_type_var').Struggle.GetName] tarafından tüketiliyor. Artık yeter. Bu anlamsız kaynak israfına kesin bir son verecek ve bölgede ortak refahın yeni bir çağını başlatacağım, [activity.GetHost.GetFaith.HighGodName] yardımcım olsun.#!"
 coronation_events.0110.desc.greatest_hunter_oath: "#emp Av yalnızca bir maharet sınavı değil, hayatın ve tabiatın bir kutlamasıdır. En büyük avcı, yabanın efendisi, [activity.GetHost.GetPrimaryTitle.GetNameNoTier] topraklarının ehlileşmemiş yurtlarının gerçek hükümdarı ben olacağım.#!"
 coronation_events.0110.desc.heir_preparation_oath: "#emp Layık bir vâris olmadan [activity.GetHost.GetDynasty.GetName] yok oluşa mahkûmdur. Vârisimin eğitimine bizzat yön verecek, [activity.GetHost.GetDynasty.GetName] hanesini yeni zirvelere taşıyacak değer ve hikmeti aşılayacağım.#!"
 coronation_events.0110.desc.install_claimants_oath: "#emp Meşru hak sadece kan meselesi değil, aynı zamanda bir adalet meselesidir. Hak sahiplerini tahtlarına oturtacak, gaspçıları devirecek ve nizamı iade edeceğim.#!"
 coronation_events.0110.desc.mend_the_fracture_oath: "#emp Diyarımızdaki kültürel çatlaklar fazlasıyla uzun zamandır bölünmeye sebep oldu. Kimliklerini muhafaza ederek, halkları ortak [activity.GetHost.GetHouse.GetName] sancağı altında birleştireceğim.#!"
 coronation_events.0110.desc.provide_for_the_warriors_oath: "#emp [activity.GetHost.GetPrimaryTitle.GetNameNoTier] savaşçıları benim kılıcım ve kalkanımdır. İyi teçhizatlanmalarını ve topraklarımızı savunmaya her daim hazır olmalarını sağlayacağım.#!"
 coronation_events.0110.desc.provide_for_the_faithful_oath: "#emp [activity.GetHost.GetPrimaryTitle.GetNameNoTier] müminleri diyarımın belkemiğidir. Dünyevi ihtiyaçlarının giderilmesini temin edecek, böylece [ROOT.Char.GetFaith.HighGodName] yolunda adanmış kullar olarak topraklarımızın kurtuluşuna odaklanabilmelerini sağlayacağım.#!"
 coronation_events.0110.desc.provide_for_the_poor_oath: "#emp [activity.GetHost.GetPrimaryTitle.GetNameNoTier] yoksulları yeryüzünün tuzu, dünyanın ışığıdır. Sessizce herkesin faydası için didinirler. Diyarımda en yoksulların dahi onur ve umutla yaşayabilmesini temin edeceğim.#!"
 coronation_events.0110.desc.repent_oath: "#emp Bir insanın tabiatını ne değiştirebilir? İradem yeter mi? Diğer [activity.GetHost.GetFaith.GetAdherentNamePlural], [activity.GetHost.GetFaith.HighGodName] yolunda gerçekten günahlarıma tövbe ettiğime ikna olacak mı? Denemek ahmaklık olabilir ama denememek en ağır günah olurdu.#!"
 coronation_events.0110.desc.fallback_compassionate: "#emp "[activity.GetHost.GetPrimaryTitle.GetAdjective] halkının kanun ve törelerine riayet edeceğime, merhamet ve bilgelikle hükmedeceğime yemin ederim."#!"
 coronation_events.0110.desc.fallback_honorable: "#emp "[activity.GetHost.GetFaith.HighGodNamePossessive] barışını ve ahengini [activity.GetHost.GetPrimaryTitle.GetNameNoTier] içinde koruyacağıma ve halkımın hürriyetleriyle haklarını şerefim üzerine muhafaza edeceğime yemin ederim."#!"
 coronation_events.0110.desc.fallback_feckless: "#emp "Ben... şey... [activity.GetHost.GetPrimaryTitle.GetNameNoTier] topraklarındaki [activity.GetHost.GetTierAsName] olarak münasip yeminleri ederim... bundan böyle [activity.GetHost.GetFaith.AltPriestTermPlural] ne talep ederse yapacağım ve ülke [activity.GetHost.GetTierAsNameNoTooltip] için feryat ettiğinde cevap vereceğim falan filan..."#!"
 coronation_events.0110.desc.fallback: "#emp "Hükmüm üzerine, [activity.GetHost.GetPrimaryTitle.GetNameNoTier] için talih, halklarının törelerine hürmet ve ülkeye şan getireceğime yemin ederim."#!"
 coronation_events.0110.regular: "Bakalım beklentileri karşılayabilecek mi..."
 coronation_events.0110.no_oath: "Sıradan tören konuşması..."
