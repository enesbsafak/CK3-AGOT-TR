 purge_pretenders_oath_tooltip: "#V Taht Taliplerini Ortadan Kaldırmak#! için bir [oath|E] ederim:\n\t$EFFECT_LIST_BULLET$[Concept('primary_title', 'Birincil Unvanınız')|E] için [Concept('children', 'Çocuklarınız')|E] dışında hiçbir [claimant|E] kalmamalı\n\t$EFFECT_LIST_BULLET$#V 50 yıl#! içinde tamamlanmalı\n\t$EFFECT_LIST_BULLET$Ödüller: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E] ve [GetModifier('oath_of_purge_pretenders').GetNameWithTooltip].\n\t$EFFECT_LIST_BULLET$[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'purge_pretenders_oath_nomad', '')][SelectLocalization(GetPlayer.GetGovernment.IsType('administrative_government'), 'purge_pretenders_oath_admin', '')][SelectLocalization(Not(Or(GetPlayer.GetGovernment.IsType('nomad_government'), GetPlayer.GetGovernment.IsType('administrative_government'))), 'purge_pretenders_oath_default', '')] etkisi"
