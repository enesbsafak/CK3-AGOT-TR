 coronation_events.0200.t: "Başlangıç"
 coronation_events.0200.desc.host: "Misafirler geldi. Yakından, uzaktan, sadakatten yahut meraktan herkes tören alanında toplanmış vaziyette. Kalabalık, beklenti, hesap ve kimi yüzlerde belli belirsiz bir samimiyetle gülümsüyor.\n\nSesimi yalnızca katılanları yatıştıracak kadar yükseltip taç giyme törenime hoş geldiniz diyorum."
 coronation_events.0200.desc.guest: "Tören beklendiği kadar görkemli. Tanıdık ve yabancı yüzler birbirine karışıyor, kulaklarıma nezaket icabı yeterince sıcak selamlar çalınıyor. Ev sahibi konuştuğunda salon susuyor.\n\n"Dostlarım, vassallarım, akrabalarım, varlığınız benim için herhangi bir taçtan daha büyük bir onurdur. Tören başlayana dek yiyin, için, dilediğinizce konuşun... ve her birinizi gördüğümü, bugün yanımda duranları unutmayacağımı bilin."\n\nİnsanın duyuşuna göre nazik bir vaat, yahut usul bir uyarı."
 coronation_events.0200.a: "Hepiniz hoş geldiniz!"
 coronation_events.0200.b: "Pekâlâ, başka kimler burada?"
