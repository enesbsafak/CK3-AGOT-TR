 greatest_hunter_oath_tooltip: "#V En Büyük Avcı#! olmak için bir [oath|E] ederim:\n\t$EFFECT_LIST_BULLET$En az #V 1#! #V Efsanevi#! [Concept( 'activity', 'Av' )|E] düzenleyip başarıyla tamamlamanız ya da en az #V 10#! normal [Concept( 'activity', 'Av' )|E] tamamlamanız gerekir. Bu [oath|E] aktifken #V Efsanevi İz Yakalama#! olasılığı artar.\n\t$EFFECT_LIST_BULLET$#V 40 yıl#! içinde tamamlanmalı\n\t$EFFECT_LIST_BULLET$Ödüller: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], #V Yay#! [Concept('artifact', 'Eseri')|E] için benzersiz [modifiers|E] ve [GetModifier('oath_greatest_hunter').GetNameWithTooltip] etkisi"
 heir_preparation_oath_tooltip: "#V Vârisi Hazırlamak#! için bir [oath|E] ederim:\n\t$EFFECT_LIST_BULLET$[Concept('primary_heir', 'Birincil Vârisin')|E] tüm [Concept('skills', 'Becerileri')|E] #V 10+#! ve en az iki [Concept('skills', 'Becerisi')|E] #V 14+#! olmalıdır.\n\t$EFFECT_LIST_BULLET$#V 40 yıl#! içinde tamamlanmalı\n\t$EFFECT_LIST_BULLET$Ödüller: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E] ve [GetModifier('oath_heir_preparation').GetNameWithTooltip]. [primary_heir|E], [GetModifier('oath_heir_preparation_heir').GetNameWithTooltip] kazanır"
 install_claimants_oath_tooltip: "#V Hak Sahiplerini Tahta Çıkartmak#! için bir [oath|E] ederim:\n\t$EFFECT_LIST_BULLET$En az #V 3#! [claimant|E] [Concept('wars', 'Savaşı')|E] kazanılmalı\n\t$EFFECT_LIST_BULLET$#V 20 yıl#! içinde tamamlanmalı\n\t$EFFECT_LIST_BULLET$Ödüller: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_install_claimants').GetNameWithTooltip] etkisi ve tahta çıkarılan her [claimant|E] üzerinde bir [perpetual_hook|E], [Concept('primary_heirs', 'Birincil Vârisleri')|E] üzerinde ise [weak_hook|E]."
 mend_the_fracture_oath_tooltip: " #V Çatlağı Onarmak#! için bir [oath|E] ederim:\n\t$EFFECT_LIST_BULLET$[Concept('realm', 'Ülkemin')|E] #V %40#!'ından fazlasını oluşturan bir [culture|E] ile en az #V 70#! [Concept('cultural_acceptance', 'Kültürel Kabullenmeye')|E] sahip olmalıyım.\n\t$EFFECT_LIST_BULLET$#V 20 yıl#! içinde tamamlanmalı\n\t$EFFECT_LIST_BULLET$Ödüller: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [GetModifier('oath_mend_the_fracture').GetNameWithTooltip] ve her iki kültür de [GetCultureTradition('oath_mend_the_fracture_tradition').GetName] [culture_tradition|E] kazanır."
