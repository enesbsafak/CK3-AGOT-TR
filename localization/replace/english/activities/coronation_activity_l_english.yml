 coronation_hof_guest_desc_for_host: "[Concept('anointment', 'Kutsanma')|E] töreninin [Concept('legitimate', 'Meşru')|E] sayılması için [Concept('head_of_faith', 'Mezhep Liderinin')|E] [Concept('activity_guest', 'Konuk')|E] olarak hazır bulunması gerekir.\n\n[Concept('anointment_request', 'Kutsanma Talebi')|E] [Concept('interaction', 'Etkileşimi')|E] ile Mezhep Liderininin desteğini güvence altına alın."
 doctrine_coronation_name: "Taç Giyme Geleneği"
 doctrine_no_anointment_name: "Kutsanma Yok"
 doctrine_no_anointment_desc: "Bu mezhepte, hükümdarların alnına kutsal yağ değmez, kutsanma ya da ilahi ayinler olmaksızın iktidara uzanırlar."
 doctrine_anointment_permitted_name: "Kutsanma İzin Verilmiş"
 doctrine_anointment_permitted_desc: "İmparatorlar bile tek bir ayine boyun eğmezler, Mezhep Lideri törene başkanlık etse dahi taç giyme seçimi tahtın kendisine aittir."
 doctrine_imperial_anointment_name: "İmparatorluk Kutsanması"
 doctrine_imperial_anointment_desc: "Bir imparator, tartışmasız bir hüküm sürmek için otoritesini ona bahşedecek Mezhep Liderinin huzurunda diz çökmelidir."
 doctrine_parameter_no_anointment: "[Concept('characters', 'Karakterler')|E], [Concept('coronation_anointment', 'Taç Giyme Kutsanması')|E] [Concept('activity_option', 'Etkinlik Seçeneğine')|E] erişemez"
 doctrine_parameter_theocratic_coronation: "[Concept('characters', 'Karakterler')|E], [Concept('coronation_anointment', 'Taç Giyme Kutsanması')|E] [Concept('activity_option', 'Etkinlik Seçeneğine')|E] erişebilir"
 doctrine_parameter_imperial_anointment: "[Concept('empire', 'İmparatorluk')|E] [Concept('title_tier', 'Unvan Seviyesinde')|E] veya daha yüksek olan [Concept('characters', 'Karakterler')|E], [GetLaw('crowned_emperor').GetName] [Concept('law', 'Yasasını')|E] elde etmek için [Concept('coronation_anointment', 'Taç Giyme Kutsanması')|E] [Concept('activity_option', 'Etkinlik Seçeneğini')|E] kullanmak zorundadır"
