 coronation_impress_attendees: "Konukları Etkileme"
 coronation_impress_attendees_desc: "Bir hükümdarın sureti olursunuz, [Concept('legitimacy', 'Meşruiyet')|E], [Concept('cultural_acceptance', 'Kültürel Kabullenme')|E] ve [coronation_i][Concept('coronation_magnificence', 'Şaşaa')|E] kazanırsınız.\n#EMP #low Bu [Concept('intent', 'Niyet')|E], [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] ve [GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName] [Concept('vassals', 'Vasallar')|E] arasında hoş karşılanır.#!#!"
 coronation_embrace_supporters: "Destekçileri Kucaklama"
 coronation_embrace_supporters_desc: "Hükümdarlığınız [Concept('prestige', 'Prestij')|E] kazanma, [Concept('relations', 'İlişkiler')|E] kurma ve [Concept('realms', 'Ülkelerini')|E] zenginleştirme yoluyla sadıkların omuzlarında yükselir.\n#EMP #low Bu [Concept('intent', 'Niyet')|E], [Concept('coronation_supporters', 'Taht Destekçileri')|E] arasında beğeni toplar, bilhassa [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] ve [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] [Concept('vassals', 'Vasallar')|E] arasında hoş karşılanır.#!#!"
 coronation_weaken_detractors: "Muhalifleri Zayıflatma"
 coronation_weaken_detractors_desc: "Taç giymenizle birlikte [Concept('claimants', 'Hak İddiacıları')|E] zayıflamaya, [Concept('factions', 'Örgütleşmeler')|E] ve [Concept('confederations', 'Konfederasyonlar')|E] dağılmaya başlar.\n#EMP #low Bu [Concept('intent', 'Niyet')|E] [Concept('coronation_detractors', 'Taht Muhaliflerine')|E] zarar verir, [Concept('coronation_detractor', 'Taht Muhalifi')|E] olmayan [GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName] [Concept('vassals', 'Vasallar')|E] tarafından hoş karşılanır.#!#!"
 coronation_exalt_crown: "Tahtı Yüceltme"
 coronation_exalt_crown_desc: "Yetkinize duyulan saygı neticesinde [Concept('coronation', 'Taç Giyme')|E] mekânları, [Concept('artifacts', 'Eserler')|E] ve [Concept('oaths', 'Yeminler')|E], [Concept('dynasty_prestige', 'İhtişam')|E] gibi kalıcı faydalar sağlar.\n#EMP #low Bu [Concept('intent', 'Niyet')|E], [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName] [Concept('vassals', 'Vasallar')|E] arasında hoş karşılanır.#!#!"
 coronation_bear_witness: "Şahitlik Etme"
 coronation_bear_witness_desc: "Bu tarihi olaya tanıklık ederek [Concept('piety', 'Dindarlık')|E], [Concept('legitimacy', 'Meşruiyet')|E] ve [Concept('cultural_acceptance', 'Kültürel Kabullenme')|E] kazanmayı umarsınız."
 coronation_seize_advantages: "Fırsatları Kollama"
 coronation_seize_advantages_desc: "[SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_administrative' ), 'seize_advantages_admin', 'seize_advantages_non_admin' )]"
 seize_advantages_admin: "Keskin bir gözle fırsat kollarsınız, kendiniz için [Concept('gold', 'Altın')|E], [Concept('influence', 'Nüfuz')|E] veya [Concept('claims', 'Hak İddiaları')|E] elde etmeye çalışırsınız."
 seize_advantages_non_admin: "Keskin bir gözle fırsat kollarsınız, kendiniz için [Concept('gold', 'Altın')|E], [Concept('prestige', 'Prestij')|E] veya [Concept('claims', 'Hak İddiaları')|E] elde etmeye çalışırsınız."
 coronation_offer_support: "Destek Sunma"
 coronation_offer_support_desc: "Tahta güçlü bir destek vererek, [Concept('opinion', 'Görüş')|E] kazanmayı, [Concept('relation', 'İlişki')|E] kurmayı ya da hükümdarla bir [Concept('alliance', 'İttifak')|E] kurmayı umarsınız."
 coronation_advocate_domain: "Mülkü Savunma"
 coronation_advocate_domain_desc: "Hükümdarınıza, alt-[Concept('realm', 'Ülkenizde')|E] [Concept('development', 'Gelişmişlik')|E], [Concept('control', 'Kontrol')|E] ve [Concept('county_opinion', 'Kontluk Görüşünü')|E] arttıracak politikalar benimsemesi için baskı yaparsınız."
