 coronation_events.0301.desc: "Taç giyme törenimin yürütücüsü, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('dead_officiator'))] [dead_officiator.GetFirstName] [dead_officiator.GetDeathReason]. Koltuğu boş, kutsal ayin ise tamamlanmamış duruyor.\n\nSaygın bir [first_candidate.GetFaith.GetAdherentName] [first_candidate.GetFaith.PriestNeuter] olan [first_candidate.GetFirstName] öne çıkıyor. "[first_candidate.GetFaith.HighGodName] tek bir canın göçüyle sarsılmaz," diye ciddi bir sesle söylüyor. "Uygun görürseniz ayini ben tamamlayacağım.""
