 coronation_events.0100.desc.opening: "Konukların gözü benim üzerimde. Kimi umutla, kimi şüpheyle, hepsi benim hükümdarlığımdan söz etmemi ve geleceğe dair yemin etmemi bekliyor. Akıllarından geçenleri tahmin edebiliyorum. Adil olacak mıyım? Hakkaniyetli davranacak mıyım?"
 coronation_events.0100.desc.previous_ruler_close_family: "Ben, [ROOT.Char.Custom2( 'RelationToMePossessive', previous_ruler )] ile boy ölçüşebilecek miyim?"
 coronation_events.0100.desc.previous_ruler_not_family_no_house: "Selefim [previous_ruler.GetFirstNameNicknamed] ile boy ölçüşebilecek miyim?"
 coronation_events.0100.desc.previous_ruler_not_family: "Selefim [previous_ruler.GetFullNameNoTooltip] ile boy ölçüşebilecek miyim?"
 coronation_events.0100.desc.first_ruler: "Bu topraklardaki ilk [ROOT.Char.GetTitleAsNameNoTooltip|l] olarak nasıl hükmedecek, nasıl yöneteceğim?"
 coronation_events.0100.desc.outro: "\n\nBen burada [ROOT.Char.GetTitleAsNameNoTooltip|l] olarak onların beklentilerini karşılamakla mükellef değilim. Buraya kendi yolumu seçmeye ve hükümdarlığım için bir yol haritası çizmeye geldim.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTier] ülkesini neler bekliyor... Benim kaderim nasıl olacak? İşte her şey bu anla başlayacak."
