 coronation_events.0310.t: "Hükümdarın Niyeti"
 coronation_events.0310.desc.high_magnificence: "Taç giyme törenimin görkemini yüceltmek, şaşaasını artırmak için durmaksızın çalıştım. Konuklar burada tanık olduklarına hayranlıkla bakıyorlar. Bu, bir [ROOT.Char.GetTitleAsNameNoTooltip|l] olarak hükümdarlığıma yaraşır bir başlangıç oldu.\n\n"
 coronation_events.0310.desc.mid_magnificence: "Artık gerçek bir [ROOT.Char.GetTitleAsNameNoTooltip|l] olduğum söylenebilir. Taç giyme törenim makamıma yaraşır bir şekilde gerçekleşti, konuklar için güzel bir gösteriydi ve birçoğu hâlâ birkaç söz umuduyla oyalanıyor.\n\n"
 coronation_events.0310.desc.low_magnificence: "Kutlamalar sona yaklaşıyor. Kaos, gerilim ve alelacele düzenlenen bu tören hakkında pek çok fısıltı vardı. Şimdi kulaklarımda iftiraların çınlaması ve midemde ekşimiş yemekle ayakta duruyorum... Ama önemli olan tek şey, nihayet tam teşekküllü bir [ROOT.Char.GetTitleAsNameNoTooltip|l] olmam.\n\n"
 coronation_events.0310.desc.impress_attendees: "Baştan sona, dost düşman ayırt etmeksizin tüm katılımcıları etkilemek için hiçbir çabadan kaçınmadım! Fakat adil duruşum, bu büyük buluşmanın başarısına tam konsantrasyonum...\n\nBütün bunlar ne içindi?"
 coronation_events.0310.desc.weaken_detractors: "Küstah, [first_char.Custom('InsultAdjective')] muhalifler, başta [first_char.GetName] ve [second_char.GetName] olmak üzere taç giyme törenime katılma cüretini gösterdiler... Ve ben onlara hak ettiklerini verdim. Zayıflıklarımı deşmeye geldiler ama buldukları yalnızca soğuk bir küçümseme ve çelikten bir iradeydi.\n\nBelki de son, yakıcı bir darbe daha indirmeliyim..."
 coronation_events.0310.desc.embrace_supporters: "Her fırsatta tacıma en sadık olanları kolladım. Destekçilerimle birlikte planlar yaptık, birbirimizin liyakatini yücelttik. [first_char.GetName], [second_char.GetName] ve diğerleri çekirdek çevrem oldu.\n\nGüvenleri daha somut bir şeye dönüşebilir."
 coronation_events.0310.desc.exalt_crown: "Tahtın görkeminin her şey olduğuna dair inancıma sadık kaldım. Bu yerde karşılaştığım sınavlar, küçük hizipleşmeler, bunların hepsi gelip geçici dertler ama [ROOT.Char.GetPrimaryTitle.GetNameNoTier] baki kalacak! Bu büyük inancı konuklarıma aşıladım ve diyarın geleceğine olan inançları arttı.\n\nAma bu yüceltme nereye varmalı?"
