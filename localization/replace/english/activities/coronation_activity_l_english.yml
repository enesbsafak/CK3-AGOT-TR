 coronation_events.0205.cheers: "\n\nAlkışlar ve yüceltmeler eşliğinde,"
 coronation_events.0205.desc.host_east_asian: "[ROOT.Char.Custom('GetTitleTierAdjective')] alayım, [host.Custom('GetFighterTermPlural')] ve görevlilerin sıra sıra dizildiği safların arasından ilerliyor. Arkamızda, günün ilk ayinlerinin icra edildiği ailemin atalar mabedini bırakıyoruz."
 coronation_events.0205.desc.guest_east_asian: "[host.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetTitleTierAdjective')] alayı, [host.Custom('GetFighterTermPlural')] ve görevlilerinin sıra sıra dizildiği safların arasından ilerliyor. Arkamızda, günün ilk ayinlerinin icra edildiği [host.GetTitleAsNameNoTooltip] atalar mabedini bırakıyoruz."
 coronation_events.0205.desc.host: "alayım, kalabalığı yarıyor: En seçkin [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] önden ilerliyor, hanem arkadan takip ediyor."
 coronation_events.0205.desc.guest: "[host.GetTitledFirstNamePossessive] alayı kalabalığı yararken, maiyetim onursal yerimizde peşi sıra gidiyor."
 coronation_events.0205.desc.low_magnificence_east_asian: "\n\nAyinlerin üzerine uğursuz bir gölge çökmüş gibi. [host.GetDynastyHouseName] ataları, böylesine belirsiz bir tahta çıkış karşısında nasıl utanç duymasın?"
 coronation_events.0205.desc.medium_magnificence_east_asian: "\n\nHavada umut dolu bir his asılı. Sabah boyu süren hürmet ayinleri uğurlu tesirini gösterdi ve bu merasimi kadim geçmişe bağladı."
 coronation_events.0205.desc.high_magnificence_east_asian: "\n\nSabah ayinleri, hoş kokulu tütsülerle yükselen ve [host.GetDynastyHouseName] atalarının sarsılmaz gururundan doğan harikulade bir huşuyla yüceldi."
 coronation_events.0205.desc.low_magnificence: "Bazı [host.Custom('GetLocalCommonerTermPlural')] bize boş gözlerle bakıyor, bazıları alaycı bir şekilde mırıldanıyor. İçlerinden biri #EMP "Sahte [host.GetTitleAsName]!"#! diye bağırıyor ve güruh öne atılıyor, yolu sıralayan az sayıdaki [host.Custom('GetFighterTermPlural')] onları güçlükle tutuyor."
 coronation_events.0205.desc.medium_magnificence: "[host.Custom('GetLocalCommonerTermPlural')|U], yakında hükümdarları olacak kişiyi bir an görebilmek için taşmış durumda. Kalabalığın arasında, anne babalarının omuzlarında [location.GetCulture.GetName] çocukları sırıtarak bakıyorlar."
 coronation_events.0205.desc.high_magnificence: "Borazanlar derinden çalıyor! Sancaklar, o cesur [host.GetPrimaryTitle.GetAdjective] renklerinde dalgalanıyor! [host.Custom('GetLocalCommonerTermPlural')|U] hükümdarlarını överken, kadınlar bu görkemli alay karşısında sevinçten gözyaşı döküyor."
 coronation_events.0205.a_low_magnificence_east_admin: "Ne faniler destekliyor, ne de ölüler..."
 coronation_events.0205.a_low_magnificence: "[ROOT.Char.GetFaith.HighGodName], bu güruhun arasından bana yol göster..."
 coronation_events.0205.a_high_magnificence: "Ve taç giyme törenim #EMP daha yeni başlıyor#!"
 coronation_events.0205.a: "En büyük an yaklaşıyor."
