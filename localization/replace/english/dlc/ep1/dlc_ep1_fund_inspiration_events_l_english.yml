### TODO AGOT-ONLY: fund_inspiration.1011.desc [AGOT: ]
 fund_inspiration.1011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me with a wide grin, sweat dripping down [inspiration_owner.GetHerHis] forehead, and soot smeared across [inspiration_owner.GetHerHis] face. "I have toiled over the forge many days and nights, but finally my work is done!"\n\n[inspiration_owner.GetSheHe|U] presents me with an object wrapped in cloth, and as I unveil what is hidden within my eyes grow wide.\n\n"
### TODO AGOT-ONLY: fund_inspiration.1021.desc_opening_1 [AGOT: ]
 fund_inspiration.1021.desc_opening_1:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] waves me over with a wide grin, gesturing towards a covered armor stand. "I have toiled over the forge many days and nights, but finally my work is done!""
### TODO AGOT-ONLY: fund_inspiration.1021.desc_opening_2 [AGOT: ]
 fund_inspiration.1021.desc_opening_2:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] waves me over to a covered armor stand. [inspiration_owner.GetSheHe|U] is trying hard to keep a professional demeanor, but I can see the fire in [inspiration_owner.GetHerHis] eyes as [inspiration_owner.GetSheHe] tells me [inspiration_owner.GetHerHis] work is done."
 fund_inspiration.1021.desc:0 "\n\nGösterişli bir hareket ile üstündeki kumaşı yırtıyor ve gözlerime inanamıyorum.\n\n"
