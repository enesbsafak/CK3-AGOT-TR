 fund_inspiration.8001.t:0 "$fund_inspiration.title$ Metalik Büyülenme"
 fund_inspiration.8001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], bir kabın üstüne eğilmişken onu buluyorum. Kabın içinde iglniç sarı bir toz var, etrafı ise parşömenler ve bir çeşit maden numunesi var.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Bir göz atın, kükürdün rengi nasıl değişiyor görüyor musunuz? Bu dönüşümün işaretidir. Gümüş ve belki de altın yaratabilir! Ya da buraya bakın, cıva ile nasıl tepkime gösteriyor görüyor musunuz? Müthiş... Bir de bu madene bakın, arseniğin doğadaki hâli ve o da– öhm, özür dilerim, süzerenim. Bunlar üstünde çalışmak için biraz fazla! Belki de çok fazla.""
 fund_inspiration.8001.a:0 "Altın ile alakalı ne demiştin?"
 fund_inspiration.8001.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmalarında altın yaratmaya odaklanacak"
 fund_inspiration.8001.b:0 "Gümüş diyorsun yani?"
 fund_inspiration.8001.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmalarında gümüş yaratmaya odaklanacak"
 fund_inspiration.8001.c:0 "Cıva gerçekten etkileyici."
 fund_inspiration.8001.c.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmalarında cıva üzerine odaklanacak"
 fund_inspiration.8001.d:0 "Arsenik mi dedin?"
 fund_inspiration.8001.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmalarında arsenik üzerine odaklanacak"
 fund_inspiration.8011.t:0 "$fund_inspiration.title$ Altın Hayaller"
 fund_inspiration.8011.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], beni laboratuvarına çağırdı, araştırmasına büyük bir ilerleme hakkında zırvalıyordu.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], geldiniz! Harika. Lütfen, bunu için." [inspiration_owner.GetFirstNameNoTooltip], beni odaya alıyor, üstü parşömenler ve kaplar dolu bir masaya götürüyor. İçinde altın renkte bir karışım olan kaplardan birini bana içirtiyor. "Şimdi bu hâlâ üzerinde çalıştığım bir şey tabii ama göze çarpan bir [Concept('modifier', 'Etkisi')|E] #EMP olmalı#!!"\n\nSaatlerce bekledikten sonra hissettiğim şeyler sırasıyla başımın çatlaması, mide bulantısı ve baş dönmesi."
 fund_inspiration.8011.a:0 "Bu saçmalık umarım sana bir şeyler öğretmiştir."
 fund_inspiration.8011.b:0 "Bu şarlatanı zindanlara atın!"
 fund_inspiration.8011.c:0 "Ne cüretle beni zehirlersin?! Bunun için asılacaksın!"
 fund_inspiration.8012.t:0 "$fund_inspiration.title$ Kilise ve Şarlatanlar"
 fund_inspiration.8012.desc:0 "Bir masaya doğru eğiliyorum, bu sırada simyacım [inspiration_owner.GetTitledFirstName] bana son deneyini açıklıyor, tam bu sırada ise [court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] odaya dalıyor.\n\n"Demek ki doğruymuş, zamanını bununla #EMP geçiriyorsun#!... bu #EMP kâfirle#!!" [court_chaplain.GetFirstNameNoTooltip], önümüzdeki kapları ve çizimleri inceledikten sonra gözleri fal taşı gibi açılıyor.\n\n"Bu artık durmalı, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Bu şarlatan sizi yoldan saptırıyor!""
 fund_inspiration.8012.a:0 "Öyle mi? Bunu nasıl yaparsın?! Ülkemden defol."
 fund_inspiration.8012.b:0 "O beni aydınlatıyor!"
 fund_inspiration.8012.b.success:0 "[court_chaplain.GetFirstNameNoTooltip] ikna oluyor"
 fund_inspiration.8012.b.failure:0 "[court_chaplain.GetFirstNameNoTooltip] ikna olmuyor"
 fund_inspiration.8012.c:0 "Kesinlikle kâfir değil."
 fund_inspiration.8013.t:0 "$fund_inspiration.title$ Simya Hazinesi"

 fund_inspiration.8013.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," Simyacım [inspiration_owner.GetTitledFirstName] bir çocuk gibi sevinçle neredeyse koşarak yanıma gelir.\n\n"Bu kitabı [barony_market.GetName] pazarını ziyaret ederken buldum. Efsanevi simyacı Cabir bin Hayyan'a atfedilen bir kitap – ustanın kendisine! En azından tüccara göre... Neyse, içindeki bilgi hazinesini bir düşünün!""
 fund_inspiration.8013.a:0 "Teşekkürler, kitabı inceleyeceğim."
 fund_inspiration.8013.a_tt:0 "Kitabı kendinize saklıyorsunuz"
 fund_inspiration.8013.b:0 "Kitapla iyi bir iş çıkaracağına güveniyorum."
 fund_inspiration.8013.b_tt:0 "[inspiration_owner.GetShortUINameNoTooltip] Kitabı kendine saklıyor"
 fund_inspiration.8013.c:0 "Aferin sana! Güzel para eder bu."
 fund_inspiration.8014.t:0 "$fund_inspiration.title$ Düşünen [Select_CString(inspiration_owner.IsFemale, 'Kadın', 'Adam' )]"
 fund_inspiration.8014.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], hiçbir deney yapmıyor ya da kayda değer hiçbir şey üretmiyor gibi gözüküyor. Her gün pencerenin önünde duruyor ve dışarıyı izliyor.\n\nBenim için ne yapacağını sorduğumda ise omuzlarını kaldırıp pencereden dışarıyı işaret ediyor. "Dünyanın doğasına kafa yoruyorum, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Dünya büyük, bu yüzden düşünecek çok şey var!""
 fund_inspiration.8014.a:0 "Sana burada boş boş otur diye para vermiyorum!"
 fund_inspiration.8014.b:0 "Acelesi yok."
 fund_inspiration.8014.c:0 "Paramı bu saçmalık için harcamayacağım!"
 fund_inspiration.8014.c.tt:0 "Simya için aldığınız tüm ekipmanları satıyorsunuz"
 fund_inspiration.8015.t:0 "$fund_inspiration.title$ Yasta"

 fund_inspiration.8015.desc:0 ""Simyacılar tüm maddeler üzerinde güce sahiptir, harikalar yaratabilirler, peki hayat neden farklı olsun? [loved_one.GetFirstName] neden farklı olsun?!"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] kederimi umursamadan sadece [inspiration_owner.GetHerHis] başını sallar. Bana bu tek dileği bahşedemiyorsa bilimin ne faydası var?\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o tür bir mucize yaratamam. Ama şunu buldum ki, keder baş gösterdiğinde kulak veren bir çift kulak kendi başına bir tür büyüdür. Lütfen, oturun.""
 fund_inspiration.8015.a:0 "Ama– Ben– Haklısın... Teşekkür ederim."
 fund_inspiration.8015.b:0 "Hayır. Onu bana geri getireceksin!"
 fund_inspiration.8015.b.tt:0 "[inspiration_owner.GetShortUINameNoTooltip] imkânsızı deneyecek"
 fund_inspiration.8016.desc:0 "Simyacım [inspiration_owner.GetTitledFirstName] ve laboratuvarına doğru sessiz adımlarla gidiyorum. Ah [loved_one.GetFirstName], sana tekrardan kavuşacağım! Fakat [inspiration_owner.GetTitledFirstNameNoTooltip] kapıyı açtığında yüzündeki bakış kalbime ağırlık basmasına sebep oluyor. Ve neden beni odaya sokmuyor?\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sizi hayal kırıklığına uğrattım. Lütfen, girme–"\n\nBir kenara itip laboratuvara giriyorum ve gördüğüm şeyi... Sindiremiyorum. Kaslar, et yığınları, tozlar ve bitkiler, hepsi kana bulanmış ve yerdeki bir dairenin etrafına dağıtılmış. Ve hepsinin üstünde ise [loved_one.GetFirstNamePossessiveNoTooltip] ile aynı renkte bir tutam saç."
 fund_inspiration.8016.a:0 "Sanırım... Sanırım kusacağım."
 fund_inspiration.8016.b:0 "Kederimle dalga mı geçiyorsun? Muhafızlar! Tutuklayın!"
 fund_inspiration.8017.t:0 "$fund_inspiration.title$ Çalışma Grubu"
 fund_inspiration.8017.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ve [court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] bir masanın başında yan yana dururken denk geliyorum. Görünüşe göre taşları karşılaştırıyorlar.\n\n"Görebileceğin üzere," diyor [inspiration_owner.GetFirstNameNoTooltip]. "Bu tozu ısıttığında ilk önce kararıyor ama #EMP sonra#!– Ah, iyi günler efendim."\n\n[court_tutor.GetFirstNameNoTooltip], kafasını kaldırıyor ve en azından mahcup olma gayretini gösteriyor, yarının derslerini hazırlıyor olmalıydı."
 fund_inspiration.8017.a:0 "Aranızda bilgilerinizi paylaşmanız güzel."
 fund_inspiration.8017.b:0 "İkinize de yazıklar olsun, doğru işinizin başına!"
 fund_inspiration.9000.t:0 "$fund_inspiration.title$ Yoldaki Çapulcular"

 fund_inspiration.9000.desc:0 ""Hükümdarım, maceracı [adventurer.GetFirstName] haber gönderdi!" diye haykırır hizmetkâr, bir mektup uzatarak.\n\n"On gün on gecedir ekibimle saklanıyoruz. Haydut [bandit.GetLadyLord] [bandit.GetFirstName] gitmemiz gereken yolu kapatmış — ne önerirsiniz? İhtiyat mı? Yoksa [adventurer.GetFaith.HighGodName]'in bizi koruyacağına güvenip onlarla savaşmalı mıyız? İmza: [adventurer.GetFirstName]." diye okur parşömen.\n\n[adventurer.GetSheHe] gerçekten zor bir durumda görünüyor."
 fund_inspiration.9000.a:0 "Saklanmaya devam edin, eninde sonunda giderler."
 fund_inspiration.9000.b:0 "Cesaretiniz yoksa, şanınız da olmaz! Zamanımı harcadıkları için günlerini gösterin."
 fund_inspiration.9000.c:0 "Bu altın geçişinizi sağlayacak miktarda bir rüşvet olacaktır."
 artifact_bandit_skull:0 "Maceracı [creator.GetTitledFirstName] tarafından [background_wilderness_scope.GetName] diyarlarında öldürülen ve daha sonra [owner.GetTitledFirstName] için hediye edilen [killed.GetTitledFirstName] adlı kişinin kafatası. Korkunç bir gülümsemesi ve boş, cansız göz boşlukları var."
 fund_inspiration.9000.b.critical_success:0 "[bandit.GetFirstNameNoTooltip], [adventurer.GetFirstNameNoTooltip] tarafından cesurca katledildi"
 fund_inspiration.9000.b.boil_skull:0 "[adventurer.GetFirstNameNoTooltip], [bandit.GetFirstNameNoTooltip] adlı kişinin kafatasını kaynatıp temizledi ve size [court_artifact|E] olarak kullanmanız için gönderdi"
 fund_inspiration.9000.b.success:0 "[adventurer.GetFirstNameNoTooltip], çapulcuları başarılı şekilde uzaklaştırdı"
