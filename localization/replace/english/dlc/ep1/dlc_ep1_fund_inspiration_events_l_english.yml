 fund_inspiration.1031.desc_nemesis_died:0 ""[nemesis.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] aramızdan ayrılmış olabilir, ama bu kitap [nemesis.GetHerHim]e karşı hissettiğiniz nefretin kanıtıdır."\n\n"

 fund_inspiration.1031.desc_cat_died:0 ""Sevgili kediniz aramızdan ayrılmış olabilir, ama bu kitap [inspiration_owner.Custom('CatStoryName')] adlı kediyi kimsenin asla unutmamasını sağlayacak!"\n\n"

 fund_inspiration.1031.desc_dog_died:0 ""Sevgili köpeğiniz aramızdan ayrılmış olabilir, ama bu kitap [inspiration_owner.Custom('DogStoryName')] adlı köpeği kimsenin asla unutmamasını sağlayacak!"\n\n"

 fund_inspiration.1031.desc_low_content_quality:0 ""Kitap bitti. Umarım tamamlanmış eser, konu hakkındaki bilgi eksikliğimi gölgeler. Lütfen, bir bakın!"\n\n"

 fund_inspiration.1031.desc:0 ""Kitabım– #EMP başyapıtım#! bitti! İşte."\n\n"
 fund_inspiration.1031.a:0 "Etkilendim!"
 fund_inspiration.1032.t:0 "Yazıya Dökülmüş Hisler"

 fund_inspiration.1032.desc:0 ""[ROOT.Char.Custom('LoverPetName')]'im, sana bir sürprizim var!"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bana güzel bir kitap uzatır ve sayfaları çevirdikçe gözlerime inanamıyorum. [inspiration_sponsor.GetSheHe|U] #EMP ikimiz#! hakkında bir kitap yazdırmış!\n\n"Ciltler senin güzelliğin karşısında sönük kalıyor, içerik de senin sohbetinle kıyaslanamaz, ama bu sayfalar sana olan aşkımın özünü taşıyor.""
 fund_inspiration.1032.a:0 "[inspiration_sponsor.Custom('LoverPetName')|U]!"

 fund_inspiration.1033.desc:0 ""Sana bir sürprizim var!"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bana güzel bir kitap uzatır, ama sayfaları çevirdikçe gözlerime inanamıyorum. [inspiration_sponsor.GetSheHe|U] sırf #EMP beni#! karalamak için bir kitap yazdırmış!\n\n"Yeryüzünde sana duyduğum nefreti anlatacak kelime yok, yüzündeki kusuru doğru çizecek resim de, ama yine de denedim. Bütün dünya bunu okuyacak ve ne kadar aşağılık olduğunu bilecek.""
 fund_inspiration.1033.a:0 "Vay [inspiration_sponsor.Custom2('InsultNoun', ROOT.Char)]!"
 fund_inspiration.1033.a_proud:0 "En azından beni #EMP tanıyacaklar#!!"

 fund_inspiration.1041.desc:0 ""Burada, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [inspiration_owner.GetHerHis] dokuma atölyesinin kapısını işaret eder; [inspiration_owner.GetSheHe] aylardır benim siparişim için orada çalışıyor. Kapıdan içeri adım attığımda, önümde asılı duran işi görünce nefesim kesilir.\n\n"

 fund_inspiration.1051.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gelişini şaşırtıcı derecede gür bir sesle duyurur. [inspiration_owner.GetSheHe|U] beze sıkıca sarılmış bir paketi gururla havaya kaldırır.\n\n"[inspiration_owner.Custom('InspirationAdventureDestination')]'den yolculuğumdan bir eserle dönüyorum!"\n\nHacimli paketi ellerime alır, ipleri gevşetir ve kat kat bezi sıyırırım. İçeride"

 fund_inspiration.1051_throne.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gelişini şaşırtıcı derecede gür bir sesle duyurur. [inspiration_owner.GetSheHe|U] tahtınıza doğru büyük bir alayı gururla yönetir. [inspiration_owner.GetHerHim]in arkasında kabul salonunuza doğru itilen bir araba vardır.\n\n"[inspiration_owner.Custom('InspirationAdventureDestination')]'den kraliyet erdeminin büyük bir sembolüyle dönüyorum!"\n\nAraba yaklaştıkça bir taht taşıdığını fark ederim."

 fund_inspiration.1051_ark_covenant.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gelişini şaşırtıcı derecede gür bir sesle duyurur. [inspiration_owner.GetSheHe|U] tahtınıza doğru büyük bir alayı gururla yönetir. [inspiration_owner.GetHerHim]in arkasında birkaç yardımcı kocaman bir kutuya benzeyen şeyi taşıyor.\n\n"[inspiration_owner.Custom('InspirationAdventureDestination')]'den yolculuğumdan bir ödülle dönüyorum!"\n\nDevasa kutuya doğru yürürüm; yardımcılardan biri hazinesini saklayan tahtaları söker. İçeride"

 fund_inspiration.1051_cupboard.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gelişini şaşırtıcı derecede gür bir sesle duyurur. [inspiration_owner.GetSheHe|U] iki yardımcının taşıdığı bir mobilya parçasını gururla işaret eder.\n\n"Yolculuğumdan bir eserle dönüyorum!"\n\nEserin yanına gider, [inspiration_owner.GetWomanMan]'in [inspiration_owner.Custom('InspirationAdventureDestination')]'den bana getirdiği şeyi incelerim."
 fund_inspiration.1051.desc.skull:1 "[newly_created_artifact.GetFeatureText( 'animal_skull_type' )] kafatası var. [inspiration_owner.GetFirstNameNoTooltip], benimle detayları paylaşıyor ve bu devasa yaratığı nasıl alt ettiğini anlatıyor."
 fund_inspiration.1051.desc.goblet:0 "bir kadeh var. [inspiration_owner.GetFirstNameNoTooltip], bunu nereden buldun diyorum ve bana bir yabancıyla girdiği tüyleri diken diken eden iddiadan bahsediyor. İddianın kaybedeninin zehir içmesiyle son bulmuş."
 fund_inspiration.1051.desc.box:0 "bir kutu var. Yerel bir zanaatkâr bunu [inspiration_owner.GetFirstNameNoTooltip], onu bir grup vahşi hayvandan kurtardıktan sonra vermiş. Bana hayvanları nasıl kandırıp öldürdüğünü anlatıyor."
 fund_inspiration.1051.desc.hide:1 "[newly_created_artifact.GetFeatureText( 'animal_hide_type' )] derisi var. [inspiration_owner.GetFirstNameNoTooltip], ben getirdiği muazzam deriyi incelerken vahşi hayvanları nasıl katlettiğini analtıyor."
 fund_inspiration.1051.desc.tapestry:0 "bir dokuma var. [inspiration_owner.GetFirstNameNoTooltip], göğsünü kabartarak yolculuğu sırasında ona eşlik eden usta bir dokumacıdan bahsediyor. Birlikte geçirdikleri macera dokumanın üstündeki motifleri esinlendirmiş."
 fund_inspiration.1051.desc.epic:0 "daha önce gördüğüm hiçbir şeye benzemeyen bir eser var.\n\n[inspiration_owner.GetFirstNameNoTooltip], gururlu bir şekilde gülümsüyor: "[epic.GetDesc]""
 fund_inspiration.1051.desc.epic.ark:0 "büyük taş bir sandık, içinde ise birkaç taş tablet var\n\n[inspiration_owner.GetFirstNameNoTooltip], gururlu bir şekilde diyor ki: "Ahit Sandığı! İçerisinde ise İsrailoğullarına Musa'nın verdiği taş tabletler var."\n\n[inspiration_owner.GetFirstNameNoTooltip], saraya [inspiration_owner.Custom('InspirationAdventureDestination')] diyarlarında geçirdiği macerayı anlatmaya kaldığı yerden devam ediyor. Anlattığı hikâye karanlık emelleri olan hasımlar ve ziyaret edilen ilginç mekanlar içeriyor."
 fund_inspiration.1051.desc.epic.throne:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip], gururla gösteriyor: "[epic.GetDesc]""
 fund_inspiration.1051.desc.epic.cupboard:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip], yüzünde büyük bir gülümseme ile: "[epic.GetDesc]""
 fund_inspiration.1051.desc.regalia:0 "krallara layık takılar var.\n\n[inspiration_owner.GetFirstNameNoTooltip], gülümsüyor ve nasıl [inspiration_owner.GetCurrentLocation.GetNameNoTooltip] diyarındaki yerel bir hükümdarın minnettarlığını kazandığını uzun uzadıya anlatıyor ve hükümdarın efendisine götürmesi için takdim ettiği [newly_created_artifact.GetName] ile sona eriyor."
 fund_inspiration.1051.desc.regalia_2:0 "krallara layık takılar var.\n\n[inspiration_owner.GetFirstNameNoTooltip], gururlu bir şekilde gülümsüyor ve bu hediyeyi uzak diyarlardan sarayımın görkemini duyan bir hükümdarın gönderdiğini söylüyor."
 fund_inspiration.1051.desc.armor:0 "zırh takımı var.\n\n[inspiration_owner.GetFirstNameNoTooltip], saraya bu zırh takımını nasıl elde ettiğini ve bu zırhı bana takdim ettiğini anlatıyor."
 fund_inspiration.1051.desc.weapon:0 "bir [newly_created_artifact.GetName] var.\n\n[inspiration_owner.GetFirstNameNoTooltip], bu silahı nasıl elde ettiğini anlatıyor. Anlattığı hikâye oldukça inişli ve çıkışlı, bazı kısımlarına ise inanmak güç."
 fund_inspiration.1051.desc.necklace:0 "bir kolye var.\n\n[inspiration_owner.GetFirstNameNoTooltip], bu ödülü size takdim etmekten hoşnut fakat nasıl elde ettiğini anlatma konusunda çekingen gözüküyor."
 fund_inspiration.1051.a:0 "Muhteşem!"
 fund_inspiration.1051.b:0 "'İşinin ehli' insanlar tarafından bakılmalı"

 fund_inspiration.1061.desc_floor_bound_artifact:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yüzünde kocaman bir sırıtışla beni kumaşla örtülü bir nesnenin yanına çağırır. "Günlerce ve gecelerce çalıştım, sonunda işim bitti!"\n\n[inspiration_owner.GetSheHe|U] örtüyü sıyırır ve altında gizleneni görünce gözlerim kocaman olur.\n\n"

 fund_inspiration.1061.desc:0 ""Buraya, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] kocaman bir sırıtışla beni yanına çağırır. "Günlerce ve gecelerce çalıştım, sonunda işim bitti!"\n\n[inspiration_owner.GetSheHe|U] bana beze sarılı bir nesne uzatır ve bezi kaldırdığımda gözlerim kocaman olur.\n\n"

 fund_inspiration.1081.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yüzünde kocaman bir sırıtışla beni [inspiration_owner.GetHerHis] dağınık masasına çağırır."

 fund_inspiration.1081.immortality_fail_desc_opening:0 ""Hayatı sonsuza dek uzatmanın bir yolunu bulabileceğimi söylemiştim, ama maalesef kısmet değilmiş.""
 fund_inspiration.1081.immortality_fail_desc_young:0 ""Lakin yaşlanmanızı engelleyecek bir iksir üretmeyi başardım! En azından bir nebze. Lütfen, tadına bakın ya da en azından çalışmamın meyvesini inceleyin."\n\n"
 fund_inspiration.1081.immortality_fail_desc_old:0 ""Lakin eski kuvvetinizi bir nebze geri getirecek bir iksir üretmeyi başardım! Lütfen, tadına bakın ya da en azından çalışmamın meyvesini inceleyin."\n\n"

 fund_inspiration.1081.elixir_desc_desc_young:0 ""Deneylerim meyvesini verdi. İşte, yaşlanmayı önleyecek bir iksir! Bir dereceye kadar. Lütfen, bir bakın, hatta belki bir tadın."\n\n"

 fund_inspiration.1081.elixir_desc_desc_old:0 ""Deneylerim meyvesini verdi. İşte, kaybettiğiniz dinçliğin bir kısmını geri getirecek bir iksir! Lütfen, bir bakın, hatta belki bir tadın."\n\n"

 fund_inspiration.1081.panacea_desc:0 ""Mür, safran, afyon, engerek eti ve daha birçok bileşen içeren, köklü tiryak geleneğine dayanan bir her derde devadır. Yüzyıllardır son derece etkili olduğunu kanıtlamıştır, ben de onu daha da mükemmelleştirdim! Bir bakın."\n\n"

 fund_inspiration.1081.metals_philosophers_stone_desc:0 ""Başardım! Felsefe taşını yarattım! Bu benim Başyapıtım, altın mirasım. Lütfen, şahit olun!"\n\n"

 fund_inspiration.1081.metals_mercury_desc:0 ""Bir şişede cıvayı kükürtle ısıttım; bu, karışımın buharlaşmasına ve şişenin tepesinde yeniden yoğunlaşmasına yol açtı. Şişeyi kırıp elde edilen bileşiği öğüttüğümde parlak ve canlı kırmızı bir sülyen elde ettim! İşte, bulgularımı kaydettim."\n\n"

 fund_inspiration.1081.metals_arsenic_desc:0 ""Biraz arsenik cevheri ısıttım; bu, suda çözünen beyaz bir toz ortaya çıkardı. Yutulduğunda ölümcül olduğundan eminim, ama hiçbir tat ya da koku izi bırakmayacak! İşte, bulgularımı kaydettim."\n\n"

 fund_inspiration.1081.metals_gold_desc:0 ""Altın yarattım! Benden önceki büyük zekâların kuramlaştırdığı gibi, kurşunun kusuru nem ve ısı eksikliğiymiş."\n\nSüreci gözlemlemek istediğimde [inspiration_owner.GetSheHe] masadaki küçük altın parçasının kendi kendini anlattığında ısrar eder. "Ama elbette bulgularımı kaydettim, bir bakın."\n\n"

 fund_inspiration.1081.metals_silver_desc:0 ""Gümüş yarattım! Benden önceki büyük zekâların kuramlaştırdığı gibi, gümüş bakırın ve diğer adi metallerin beyazlaşana dek ısıtılmasından doğar."\n\nSüreci gözlemlemek istediğimde [inspiration_owner.GetSheHe] masadaki küçük gümüş parçasının kendi kendini anlattığında ısrar eder. "Ama elbette bulgularımı kaydettim, bir bakın."\n\n"

 fund_inspiration.1081.metals_fallback_desc:0 ""Adi metallerle ilgili tüm içgörülerimi ve dönüşüm bilgimi bu cilde topladım. İşte, bir bakın."\n\n"
 fund_inspiration.1081.a_elixirs:0 "Hemen tadına bakayım!"
 fund_inspiration.1081.a:0 "Büyüleyici!"

 fund_inspiration.1091.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yüzünde hoşnut bir gülümsemeyle yanıma yaklaşır. "Tezgâhın başında günlerce ve gecelerce çalıştım, ama sonunda işim bitti!"\n\n[inspiration_owner.GetSheHe|U] bana beze sarılı bir nesne uzatır ve içindeki gizli şeyi açtığımda gözlerim kocaman olur.\n\n"
 fund_inspiration.1091.a: "İnce işçilik! Çok iyi!"
