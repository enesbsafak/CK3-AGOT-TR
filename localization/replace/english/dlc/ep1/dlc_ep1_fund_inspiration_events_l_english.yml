 fund_inspiration.2060.piety:0 ""Most holy [ROOT.Char.GetTitleAsNameNoTooltip]!"
### TODO AGOT-ONLY: fund_inspiration.2060.saoshyant [AGOT: ]
 fund_inspiration.2060.saoshyant:0 ""Heavenly Saoshyant!"
### TODO AGOT-ONLY: fund_inspiration.2060.savior [AGOT: ]
 fund_inspiration.2060.savior:0 ""Holy savior!"
### TODO AGOT-ONLY: fund_inspiration.2060.saint [AGOT: ]
 fund_inspiration.2060.saint:0 ""Revered saint!"
### TODO AGOT-ONLY: fund_inspiration.2060.prestige [AGOT: ]
 fund_inspiration.2060.prestige:0 ""Oh, superb [ROOT.Char.GetTitleAsNameNoTooltip]!"
### TODO AGOT-ONLY: fund_inspiration.2060.grandeur [AGOT: ]
 fund_inspiration.2060.grandeur:1 ""Oh, peerless [ROOT.Char.GetTitleAsNameNoTooltip]!"
 fund_inspiration.2060.desc_outro:0 ""Yaptırdığınız [inspiration_owner.Custom('GetInspirationTypeObject')] harikâymış diye duyduk ve [inspiration_owner.Custom('GetInspirationOwnerType')] için cüzi bir miktarda bağış yapmak istedik. Umarım bu onuru bize bahşedersiniz efendim, aylardır bunun için para biriktiriyoruz!""
### TODO AGOT-ONLY: fund_inspiration.2060.a [AGOT: ]
 fund_inspiration.2060.a:0 ""It is #EMP I#! who am honored.""
### TODO AGOT-ONLY: fund_inspiration.2060.b.religious [AGOT: ]
 fund_inspiration.2060.b.religious:0 ""No, please kind [donator.Custom('NunMonk')], keep it.""
### TODO AGOT-ONLY: fund_inspiration.2060.b.prestige [AGOT: ]
 fund_inspiration.2060.b.prestige:0 ""No, I refuse! Keep it, friend!""
