 fund_inspiration.9100.desc:0 ""[ROOT.Char.GetLadyLord|U], maceracınız [adventurer.GetFirstName]'den bir mesaj." der hizmetkâr, bana bir parşömen uzatarak.\n\n"Arayışım beni [background_wilderness_scope.Custom('TerrainTypeProvince')] olan [background_wilderness_scope.GetName]'e götürdü. Burası [adventurer.Custom('GetAnimalType')] kaynıyor olmasıyla ünlü, ama hedefime yakın olduğuma inanmak için iyi nedenlerim var! Yakında dönüşümü bekleyin. İmza: [adventurer.GetFirstNameNoTooltip]" diye okur parşömen.\n\n[adventurer.GetSheHe|U] bu kadar riskli bir yol seçmekle gerçekten hırslı olmalı..."
 fund_inspiration.9100.a:0 "[adventurer.GetFirstNameNoTooltip] ve bilgisi onu güvende tutmaya yeterli olmalı..."
 fund_inspiration.9100.b:0 "[ROOT.Char.GetFaith.HighGodName] aşkına, umarım biriyle mücadele etmek zorunda kalmaz!"
 fund_inspiration.9100.c:0 "[adventurer.GetFirstNameNoTooltip] dikkatlidir, etrafından dolaşan uzun yolu tercih eder."
