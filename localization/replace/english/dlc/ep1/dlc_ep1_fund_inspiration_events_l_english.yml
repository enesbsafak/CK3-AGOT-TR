 fund_inspiration.2100.t:0 "$fund_inspiration.title$ İmrenen Zanaatkâr"
 fund_inspiration.2100.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetTitledFirstName], desteklediğim diğer kişi [other_inspiration_owner.GetTitledFirstName] ile olan çekişmesini oturmuş düşünüyor. \n\nGenelde bu düşüncelerden hemen sıyrılıp odasındaki çalışmasına geri dönse de bu sefer [inspiration_owner.GetFirstNameNoTooltip], akşam yemeğindeki havayı mahvetti. \n\nBu akşam sonunda kafayı sıyırdı:"
### TODO AGOT-ONLY: fund_inspiration.2100.desc.funds [AGOT: ]
 fund_inspiration.2100.desc.funds:0 ""Why does [other_inspiration_owner.GetFirstNameNoTooltip] receive more funds than me? '[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]'! So what?""
### TODO AGOT-ONLY: fund_inspiration.2100.desc.rival [AGOT: ]
 fund_inspiration.2100.desc.rival:0 ""I can't believe you drain your coffers for that [other_inspiration_owner.Custom2('InsultNoun', SCOPE.sC('inspiration_owner'))], [other_inspiration_owner.GetFirstNameNoTooltip], you'd get better results from the gong-farmers!""
### TODO AGOT-ONLY: fund_inspiration.2100.desc.fallback [AGOT: ]
 fund_inspiration.2100.desc.fallback:0 ""You should drop this dead weight, my liege; [other_inspiration_owner.GetFirstNameNoTooltip] doesn't know the right end of a [other_inspiration_owner.Custom('GetInspirationTypeTool')], let alone [other_inspiration_owner.GetHerHis] way around a [other_inspiration_owner.Custom('GetInspirationTypeRoom')].""
### TODO AGOT-ONLY: fund_inspiration.2100.a [AGOT: ]
 fund_inspiration.2100.a:0 ""Your work is valuable to me, [inspiration_owner.GetFirstNameNoTooltip].""
