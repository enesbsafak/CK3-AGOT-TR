 fund_inspiration.0044.t:0 "$commission_artifact_decision$: Duvara Asma"
 fund_inspiration.0044.desc:0 "Antikacım [antiquarian.GetTitledFirstName], çalışması için parasını almaya zamanında geliyor. "Duvarlarınız için yeni şeyler almanın vakti geldi de geçiyor!" deyip bana bakıyor.\n\n"Öhm, yetenekli bir dokumacı bulacağım efendim... ne yapılmasını istiyordunuz?" Kararımı beklerken elindeki keseyi çevirip duruyor."
 fund_inspiration.0044.option_tapestry:0 "Salonum için güzel bir dokuma."
 fund_inspiration.0044.option_banner:0 "Yeni bir sancağa ihtiyacım var."
