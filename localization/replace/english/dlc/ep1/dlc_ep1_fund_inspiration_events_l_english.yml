 fund_inspiration.1011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] kocaman bir sırıtışla yanıma yaklaşır, [inspiration_owner.GetHerHis] alnından terler damlıyor, [inspiration_owner.GetHerHis] yüzü ise is içinde. "Ocağın başında günlerce ve gecelerce çalıştım, ama sonunda işim bitti!"\n\n[inspiration_owner.GetSheHe|U] bana bezle sarılı bir nesne uzatır ve içindeki gizli şeyi açtığımda gözlerim kocaman olur.\n\n"

