 fund_inspiration.7100.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Değerli eseriniz üzerindeki çalışma iyi ilerliyor!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bugün çok iyi bir ruh hâlinde görünüyor.\n\n"Söz vermiyorum ama... gerçek bir başyapıt üretmeyi başarırsam, elime yol göstermesini hangi fikri istersiniz?""
 fund_inspiration.7100.a:0 "#EMP Onlara#! daha çok zayiat verdirirken, #EMP bizim#! zayiatımızı azaltmasını."
