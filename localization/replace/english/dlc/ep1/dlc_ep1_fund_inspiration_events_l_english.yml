 fund_inspiration.1042.desc:0 ""Hemen şurada, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [inspiration_owner.GetHerHis] dokuma atölyesinden bir rulo kumaşla çıkan iki hizmetkâra işaret eder. \n\n[inspiration_owner.GetSheHe|U] başını sallar. Sancak, ahşap askısından kaldırılarak açılır. İnce ayrıntılara ve kusursuz çizgilere hayran kalmadan edemiyorum.\n\n"

 fund_inspiration.0043.desc:0 ""Evet [ROOT.Char.GetLadyLord]'im, sizin için kudretli bir sancak öreceğim!" [inspiration_owner.GetTitledFirstName] benim için çalışacağı için gerçekten heyecanlı. "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]'nin soyluları işimi iyi bilir, ama bu yeni bir onur!"\n\n"Güvenin bana, bu sıradan bir kumaş sancak olmayacak, en asil kumaştan bir süs olacak! Tek bilmem gereken, hangi armayı işlememi istersiniz?""
 fund_inspiration.0043.option_title:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] silahları."
