 fund_inspiration.7100.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! The work on your precious artifact is proceeding well!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] seems in a very good mood today.\n\n"I'm not making any promises but... if I managed to produce a true masterpiece, what idea would you like to guide my hand?""
 fund_inspiration.7100.a:0 "#EMP Onlara#! daha çok zayiat verdirirken, #EMP bizim#! zayiatımızı azaltmasını."
 fund_inspiration.7100.a.tt:0 "[Concept('artifact', 'Eseriniz')|E] [Concept('casualties', 'Zayiat')|E] [Concept('modifier', 'Etkisi')|E] kazanabilir." 
