 fund_inspiration.9002.desc:1 "Felaket! [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], zindana atıldığı için"
 fund_inspiration.9002.desc_weapon:0 "silah yaratma hayalini gerçekleştiremeyecek."
