### TODO AGOT-ONLY: fund_inspiration.9100.desc [AGOT: ]
 fund_inspiration.9100.desc:0 ""My [ROOT.Char.GetLadyLord|U], a message from your adventurer, [adventurer.GetFirstName]." the servant says, handing me a scroll.\n\n"My search has led me to the [background_wilderness_scope.Custom('TerrainTypeProvince')] of [background_wilderness_scope.GetName]. They are notoriously [adventurer.Custom('GetAnimalType')]-infested, but I have good reason to think that my goal is near! Expect my return soon. Signed, [adventurer.GetFirstNameNoTooltip]" the scroll reads.\n\n[adventurer.GetSheHe|U] surely is ambitious to choose such a risky path..."
 fund_inspiration.9100.a:0 "[adventurer.GetFirstNameNoTooltip] ve bilgisi onu güvende tutmaya yeterli olmalı..."
 fund_inspiration.9100.b:0 "[ROOT.Char.GetFaith.HighGodName] aşkına, umarım biriyle mücadele etmek zorunda kalmaz!"
 fund_inspiration.9100.c:0 "[adventurer.GetFirstNameNoTooltip] dikkatlidir, etrafından dolaşan uzun yolu tercih eder."
 fund_inspiration.9100.a.success:0 "[adventurer.GetFirstNameNoTooltip], hiçbir [adventurer.Custom('GetAnimalType')] ile karşılaşmıyor"
 fund_inspiration.9100.a.failure:0 "[adventurer.GetFirstNameNoTooltip], bir [adventurer.Custom('GetAnimalType')] tarafından vahşice saldırıya uğruyor"
 fund_inspiration.9100.b.success:0 "[adventurer.GetFirstNameNoTooltip], vahşi bir [adventurer.Custom('GetAnimalType')] katlediyor"
 fund_inspiration.9100.b.failure:0 "[adventurer.GetFirstNameNoTooltip], vahşi bir [adventurer.Custom('GetAnimalType')] saldırıya uğruyor"
 fund_inspiration.9100.b.maimed:0 "[adventurer.GetFirstName], [adventurer.Custom('GetAnimalType')] saldırısı nedeniyle sakat kalıyor"
