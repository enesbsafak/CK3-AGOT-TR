 fund_inspiration.9003.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] artık saray mensubum değil, bu yüzden desteğimi kaybedecek ve"
 fund_inspiration.9004.desc:0 "[inspiration_owner.GetTitledFirstName], gitmesinin üstünden çok bir süre geçmeden geri döndü"
 fund_inspiration.9004.desc_adventurer_tired_of_europe:0 "\n\nSarayıma geri döndüğü gibi eğilip yeri, ardından da ayağımı öpüyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], medeniyete geri dönmeme izin verdiğiniz için sonsuza kadar size minnettar olacağım... beni Avrupa denen pislik içinde yüzen iğrenç topraklardan kurtardınız.""
 fund_inspiration.9004.desc_adventurer_stuck_in_swamp:0 "Toprak, yaprak ve çamur yığınından oluşan bir varlık sarayıma geldi. Zamanımın dolduğunu hissediyorum. Belki de yeterince dua etmedim. Fakat hizmetkârlarım bir kova su fırlattığında pisliğin altından [inspiration_owner.GetTitledFirstName] çıkıyor, bataklıktan geri dönmüş. Ayaklarımı öpmek için hemen koşuyor. "Daha fazla dayanamazdım ve medeni dünyaya geri döndüğüm için son derece minnettarım."\n\nBöylelikle"
 fund_inspiration.9004.a:0 "Kendine çekidüzen ver."
