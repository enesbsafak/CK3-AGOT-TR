 fund_inspiration.2004.desc_fallback:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], look at that! I have never seen such fine materials.""
 fund_inspiration.2004.desc:0 "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], pazar alayımızdan ayrılıp gözüne çarpan malı satan tüccarla heyecanlı bir şekilde konuşmaya başlıyor.\n\n"Bununla birlikte çalışmam yeni bir seviyeye ulaşabilir. Gerçekten #EMP fevkalade#! bir şey yaratabilirim! Efendim lütfen, bu armağanı bana çok görmeyin.""
 fund_inspiration.2004.a:0 "Çalışmaların her türlü yatırıma değer!"
 fund_inspiration.2004.b:0 "Tabii ki ama daha adil bir fiyattan alabiliriz değil mi?"
 fund_inspiration.2004.b.success:0 "Tüccar fiyatları düşürmeye ikna oluyor"
 fund_inspiration.2004.b.failure:0 "Tüccar ikna olmuyor"
 fund_inspiration.2004.c:0 "Kesinlikle. Muhafızlar, [inspiration_owner.GetFirstNameNoTooltip] neye ihtiyaç duyuyorsa el koyun."
 fund_inspiration.2004.d:0 "Oradan para basıyor gibi mi gözüküyorum?"
 fund_inspiration.2005.t:1 "$fund_inspiration.title$ Yeni Dökümhane"
 fund_inspiration.2005.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], bana asık bir surat, yanmış kaşlar ve eğik metaller ile geliyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], saygısızlık etmek istemem ama bu dökümhaneniz de yani..."
 fund_inspiration.2005.desc_weapon:0 "Demem o ki [inspiration_owner.Custom('ArtifactWeaponType')] kullanışlı olsun istiyorsanız"
 fund_inspiration.2005.desc_armor:1 "Demem o ki [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] kullanışlı olsun istiyorsanız"
 fund_inspiration.2005.desc_smith:0 "Demem o ki [inspiration_owner.Custom('InspirationSmithType')] bir şeye benzsesin istiyorsanız"
 fund_inspiration.2005.desc_ending:0 "yeni bir dökümhaneye yatırım yapmanız gerekiyor.""
 fund_inspiration.2005.a:0 "Tabii ki, nasıl istersen."
 fund_inspiration.2005.b:0 "Oldukça kusursuz bir dökümhane!"
 fund_inspiration.2006.t:0 "$fund_inspiration.title$ Gezgin Bilgin"
 fund_inspiration.2006.desc:0 "Emrimdeki [inspiration_owner.Custom('GetInspirationOwnerType')] [inspiration_owner.GetTitledFirstName], gülümseyerek ve övgülerle karşıma birini getiriyor.\n\n"Bu [scholar_character.GetTitledFirstName], alanında oldukça saygı duyulan bir bilgin."\n\nTanıttığı kişi önümde diz çöküyor ve aynı anda hem memnun hem de mahcup gözükmeyi başarıyor. "Lütfen, şatafatlı sözler ile zaatımı mahcup eylemeyin. Zira buraya teşrif etmemin sebebi size hizmetimi sunmaktır, tabii bu sizi memnun edecekse, [ROOT.Char.Custom('FormOfAddressForLiege')|U].""
 fund_inspiration.2006.a:0 "Memnun eder. Lütfen [inspiration_owner.GetFirstNameNoTooltip] ile birlikte çalışın."
 fund_inspiration.2006.b:0 "Tabii ki. Bizzat benim öğretmenim olacaksınız."
 fund_inspiration.2006.c:0 "Burada yeriniz yok."
 fund_inspiration.2021.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], benim şanıma layık bir zırh yapmak için daha fazla maddi desteğe ihtiyacı olacağını söylüyor.\n\n"[inspiration_owner.Custom('ArtifactArmorTypeLowercase')|U], yapması kolay bir şey değil, malzemesi bile... Tutumlu olmanın vakti değil!""
 fund_inspiration.2021.a:0 "İstediğin desteği alacaksın."
 fund_inspiration.2021.b:0 "Sana beş kuruş daha vermem."
 fund_inspiration.2030.t:0 "$fund_inspiration.title$ Dostça Bir Söz"
 fund_inspiration.2030.desc:0 "Dostum [friend.GetTitledFirstName] yüzünde gülümsemeyle beni durduruyor.\n\n"[ROOT.Char.GetFirstNameNoTooltip]! İşte #EMP buradasın#!! Daha şimdi [inspiration_owner.GetTitledFirstName] ile konuştum! Duydum ki senin için [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')]. Bir ziyarette bulunmaktan kendimi alıkoyamadım!" \n\n"Onunla senin beklentilerini nasıl karşılayabileceği hakkında konuştum, bence sonuçları beğeneceksin!""
### TODO AGOT-ONLY: fund_inspiration.2030.a [AGOT: ]
 fund_inspiration.2030.a:0 ""Oh! Thanks [friend.GetFirstNameNoTooltip]!""
 fund_inspiration.2040.t:0 "$fund_inspiration.title$ Sabotaj"
 fund_inspiration.2040.desc:0 "[inspiration_owner.GetTitledFirstName] ve şiddetli çığırışları normalde sakin olan bir anı mahvediyor: "[inspiration_owner.Custom('GetInspirationTypeTool')|U] sürekli kaybolurken işimi nasıl yapabilirim ki?!" \n\nBana doğru koşuyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], her ilerleme katettiğimde sürekli bir şeyler yanlış gidiyor! Eminim ki saraydaki biri işime karışıyor!" \n\n[inspiration_owner.Custom('GetInspirationOwnerType')|U] öfkeli bir şekilde odasına dönüyor."
 fund_inspiration.2040.a:0 "Tam bir amatör."
 fund_inspiration.2040.b:0 "Sana kaliten için para veriyorum, zırlaman için değil!"
 fund_inspiration.2040.c:0 "Olabilir mi... olamaz... #EMP [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.c.tt:0 "Sabotajcı tutuklandı"
 fund_inspiration.2040.c.flavor:0 "Tuzak kurma vakti!"
 fund_inspiration.2040.c.success:0 "Sabotajcıyı yakalıyorsunuz"
 fund_inspiration.2040.c.failure:0 "Sabotajcı elinizden kaçıyor"
 ep1_fund_inspiration_2040_scheme_modifier:0 "Gizli İşler"
 ep1_fund_inspiration_2040_scheme_modifier_desc:0 "Bu karakter kendini kanıtlamış bir ajan."
 fund_inspiration.2041.desc:0 "Akşam yemeğinden sonra [inspiration_owner.GetTitledFirstName] ve odasının yanında birkaç muhafız ile bekliyorum, [ROOT.Char.Custom('FortifiedBuilding')] üstüne gece çökerken koridorları izliyorum. \n\nTam vazgeçmeye karar verdiğimde, koridorda hareket eden bir ışık görüyorum, peşinden ise pelerinli bir silüet çıkıyor.\n\nKaranlık figur kapıyı açıyor ve son bir kaçamak bakıştan sonra odaya dalıyor, yüzü titreyen alevlerden ötürü açık bir şekilde belli oluyor bu [rival.GetTitledFirstName]!"
### TODO AGOT-ONLY: fund_inspiration.2041.a [AGOT: ]
 fund_inspiration.2041.a:0 ""A-ha! To the dungeons!""
### TODO AGOT-ONLY: fund_inspiration.2041.b [AGOT: ]
 fund_inspiration.2041.b:0 ""Throw [rival.GetHerHim] out of the [ROOT.Char.Custom('FortifiedBuilding')]!""
 fund_inspiration.2041.c:0 "Bunu kendi yöntemlerimle halledeceğim..."
 fund_inspiration.2050.t:0 "$fund_inspiration.title$ Fikir Değerlendirildi"
 fund_inspiration.2050.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetTitledFirstName] ilerlemesi hakkında beni bilgilendiriyor ve sürekli kendisine yetmeyen [inspiration_owner.Custom('GetInspirationTypeTool')] ve [inspiration_owner.Custom('GetInspirationTypeStation')] hakkında şikayet ediyor. Bu sırada aklım [inspiration_owner.Custom('GetInspirationTypeObject')] ile ilgili fikirlerle dolu... \n\nİşi bizzat #EMP ben#! yapmıyorum ama bu, paranın nasıl harcanacağı hakkında söz sahibi olmadığım anlamına gelmiyor!"
 fund_inspiration.2050.a:0 "Birkaç tavsiyem var..."
 fund_inspiration.2050.b:0 "Geçmişim bana özel bir bakış açısı sağlıyor."
 fund_inspiration.2050.c:0 "Hiç #EMP bu#! açıdan bakmış mıydın?"
 fund_inspiration.2050.d:0 "Çalışmalarına bir bakayım..."
 fund_inspiration.2050.e:0 "Hayır. [inspiration_owner.GetFirstNameNoTooltip], ne yaptığını bilir."
 fund_inspiration.2050.success:0 "Fikirleriniz işe yarıyor"
 fund_inspiration.2050.nothing:0 "Fikirleriniz umursanmıyor"
 fund_inspiration.2050.failure:0 "Fikirleriniz iyi değil"
 fund_inspiration_half_refund_tt:0 "Yatırımınızın yarısını geri kazanacaksınız:"
 fund_inspiration_quarter_refund_tt:0 "Yatırımınızın çeyreğini geri kazanacaksınız:"
 fund_inspiration.2060.t:0 "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip] ve Hazinesi"
 fund_inspiration.2060.desc.religious:0 "İnancıma bağlılığım en güçlü kraldan en fakir dilenciye kadar herkes için bir örnek teşkil ediyor. Bu da saraya bazı hayranlar getiriyor."
 fund_inspiration.2060.desc.fame:0 "Yaptıklarım yabancı saraylardan köy hanlarına kadar tüm dünyada hürmet ve imrenme ile anılıyor. Bu da saraya bazı hayranlar getiriyor."
 fund_inspiration.2060.desc.court:0 "Gösterişli sarayım tüm dünyada biliniyor ve tanınıyor, herkes onun zenginliklerine sahip olmak ya da en azından zenginliklerinin tadına bakabilmek istiyor. Bu da saraya bazı hayranlar getiriyor."
 fund_inspiration.2060.desc:0 "\n\nBugün [donator.GetTitledFirstName] geldi,"
 fund_inspiration.2060.desc.brotherhood:0 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki [barony_scope.GetNameNoTierNoTooltip] diyarlarından ufak bir [donator.GetFaith.GetAdjectiveNoTooltip] kardeşliğini temsil ediyormuş.\n\n"
 fund_inspiration.2060.desc.abbey:0 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki bir [barony_scope.GetAdjectiveNoTooltip] [donator.GetFaith.GetAdjectiveNoTooltip] ibadethanesini temsil ediyormuş.\n\n"
 fund_inspiration.2060.desc.mercenary:1 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki [barony_scope.GetNameNoTierNoTooltip] diyarlarından ufak bir [donator.GetCulture.GetNameNoTooltip] paralı asker grubunu temsil ediyormuş.\n\n"
 fund_inspiration.2060.desc.guild:0 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki [barony_scope.GetNameNoTierNoTooltip] diyarlarından ufak bir [donator.Custom('dummy_peasant_profession')] loncasını temsil ediyormuş.\n\n"
