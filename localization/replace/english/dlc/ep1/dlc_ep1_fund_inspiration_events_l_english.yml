 fund_inspiration.2001.b:0 "Elindekiyle yetin."
 fund_inspiration.2002.t:0 "$fund_inspiration.title$ Malzeme... İsteği"
 fund_inspiration.2002.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], beni leş kokan odasına çağırmaya cüret ediyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ilerleme katediyoruz fakat biraz daha malzemem olsaydı... #EMP insan#! malzemem, #EMP gerçekten etkileyici#! bir şey yaratabilirdim. Bu şahsa hayatta ihtiyacım var, en azından başlarken."\n\n[inspiration_owner.GetFirstName], isteğini dile getirdikten sonra, "
 fund_inspiration.2002.desc.fingernails:0 "bakışlarım masasının üzerindeki kızıla boyanmış aletler ve koparılmış tırnaklara gidiyor."
 fund_inspiration.2002.desc.potions:1 "bakışlarım hayvan parçaları, renkli sıvılar ve tehlikeli gözüken bitkilerle dolu masalar ve raflara kayıyor."
 fund_inspiration.2002.desc.blind:0 "Odada başka birinden gelen hafif inlemeleri ve ağlamaları duyuyorum. Birkaç hıçkırığın ardından, kulağa acı verici gelen bir öğürmeyle birlikte asidik kusmuk kokusunu alıyorum."

 fund_inspiration.2002.a:0 ""Zindanlarımdaki insanları dilediğiniz gibi kullanın.""

 fund_inspiration.2002.b:0 ""Alın, birkaç köylüyü kaçırmanız için biraz para.""

 fund_inspiration.2002.c:0 ""Sınır uzak değil. Gidip yabancı köylülerden birkaçını kaçırın.""
 fund_inspiration.2002.toast_outcome.negative:0 "Kanıtlar kayıp köylülerin sebebinin siz olduğunu açığa çıkarıyor"
 fund_inspiration.2002.toast_outcome.positive:0 "Köylülerin kaçırılmasının sebebinin siz olduğu açığa çıkmıyor"
 fund_inspiration.2002.d:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] ve isteğini reddet."
 fund_inspiration.2003.t:0 "$fund_inspiration.title$ Aksamalar"

 fund_inspiration.2003.desc:0 ""#EMP [inspiration_owner.GetFaith.HighGodName]#! aşkına, [previous_inspired.GetWomanMan]! Beni rahat bırak!"\n\n[inspiration_owner.GetFirstName] avluya öfkeyle dalıp bağırınca huzurlu atmosfer bozulur. [previous_inspired.GetFirstName] hemen arkasından gelir, ama [previous_inspired.GetSheHe] beni görünce durur.\n\n"[ROOT.Char.Custom2('RelationToMeAddress', previous_inspired)|U], lütfen [inspiration_owner.GetFirstNameNoTooltip]'e aklını başına toplatın! [inspiration_owner.GetHerHim]e yardım etmeye çalışıyorum çünkü [inspiration_owner.GetHerHis] işini geliştirebilecek tecrübem var!""
 fund_inspiration.2003.a:0 "Birlikte çalışmaları için ikna edeceğim."

 fund_inspiration.2003.b:0 ""Gelin, en azından [previous_inspired.GetHerHim]i dinleyin.""
 fund_inspiration.2003.c:0 "Onu rahat bırakmasını emredeceğim."
 fund_inspiration.2003.toast_outcome.positive:0 "[inspiration_owner.GetFirstNameNoTooltip], [previous_inspired.GetFirstNameNoTooltip] ne diyorsa ona kulak verecek"
 fund_inspiration.2003.toast_outcome.refusal:0 "[inspiration_owner.GetFirstNameNoTooltip], dinlemeyi reddediyor"
 fund_inspiration.2003.toast_outcome.negative:0 "[previous_inspired.GetFirstNameNoTooltip], kötü önerilerde bulunuyor"
 fund_inspiration.2004.t:0 "$fund_inspiration.title$ En Yüksek Kalite"

 fund_inspiration.2004.desc_metal:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu metale bakın! Daha önce hiç bu kadar kaliteli görmemiştim.""

 fund_inspiration.2004.desc_fabric:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu kumaşa bakın! Lifler, renk derinliği... Daha önce hiç bu kadar kaliteli görmemiştim.""

 fund_inspiration.2004.desc_thread:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu ipliğe bakın! Daha önce hiç bu kadar kaliteli görmemiştim.""
 fund_inspriation.2004.desc_paint: ""Efendim, şu renge bakın! Hiç bu kadar kalitelisini görmemiştim.""

 fund_inspiration.2004.desc_wood:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu ahşaba bakın! Damarlar, yoğunluk... Daha önce hiç bu kadar kaliteli görmemiştim!""

 fund_inspiration.2004.desc_paper:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu kâğıda bakın! Daha önce hiç bu kadar kaliteli görmemiştim.""

 fund_inspiration.2004.desc_ink:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu mürekkebe bakın! Renkler, doygunluk... Daha önce hiç bu kadar kaliteli görmemiştim!""

 fund_inspiration.2004.desc_alchemy_metal:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şuna bakın! Daha önce hiç bu kadar saf cevher görmemiştim.""

 fund_inspiration.2004.desc_elixirs:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şu balonlara bakın! Daha önce hiç bu kadar duru cam görmemiştim.""

 fund_inspiration.2004.desc_fallback:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], şuna bakın! Daha önce hiç bu kadar ince işlenmiş malzeme görmemiştim.""
 fund_inspiration.2004.desc:0 "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], pazar alayımızdan ayrılıp gözüne çarpan malı satan tüccarla heyecanlı bir şekilde konuşmaya başlıyor.\n\n"Bununla birlikte çalışmam yeni bir seviyeye ulaşabilir. Gerçekten #EMP fevkalade#! bir şey yaratabilirim! Efendim lütfen, bu armağanı bana çok görmeyin.""
 fund_inspiration.2004.a:0 "Çalışmaların her türlü yatırıma değer!"
 fund_inspiration.2004.b:0 "Tabii ki ama daha adil bir fiyattan alabiliriz değil mi?"
 fund_inspiration.2004.b.success:0 "Tüccar fiyatları düşürmeye ikna oluyor"
 fund_inspiration.2004.b.failure:0 "Tüccar ikna olmuyor"
 fund_inspiration.2004.c:0 "Kesinlikle. Muhafızlar, [inspiration_owner.GetFirstNameNoTooltip] neye ihtiyaç duyuyorsa el koyun."
 fund_inspiration.2004.d:0 "Oradan para basıyor gibi mi gözüküyorum?"
 fund_inspiration.2005.t:1 "$fund_inspiration.title$ Yeni Dökümhane"
 fund_inspiration.2005.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], bana asık bir surat, yanmış kaşlar ve eğik metaller ile geliyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], saygısızlık etmek istemem ama bu dökümhaneniz de yani..."
 fund_inspiration.2005.desc_weapon:0 "Demem o ki [inspiration_owner.Custom('ArtifactWeaponType')] kullanışlı olsun istiyorsanız"
 fund_inspiration.2005.desc_armor:1 "Demem o ki [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] kullanışlı olsun istiyorsanız"
 fund_inspiration.2005.desc_smith:0 "Demem o ki [inspiration_owner.Custom('InspirationSmithType')] bir şeye benzsesin istiyorsanız"
 fund_inspiration.2005.desc_ending:0 "yeni bir dökümhaneye yatırım yapmanız gerekiyor.""
 fund_inspiration.2005.a:0 "Tabii ki, nasıl istersen."
 fund_inspiration.2005.b:0 "Oldukça kusursuz bir dökümhane!"
 fund_inspiration.2006.t:0 "$fund_inspiration.title$ Gezgin Bilgin"
 fund_inspiration.2006.desc:0 "Emrimdeki [inspiration_owner.Custom('GetInspirationOwnerType')] [inspiration_owner.GetTitledFirstName], gülümseyerek ve övgülerle karşıma birini getiriyor.\n\n"Bu [scholar_character.GetTitledFirstName], alanında oldukça saygı duyulan bir bilgin."\n\nTanıttığı kişi önümde diz çöküyor ve aynı anda hem memnun hem de mahcup gözükmeyi başarıyor. "Lütfen, şatafatlı sözler ile zaatımı mahcup eylemeyin. Zira buraya teşrif etmemin sebebi size hizmetimi sunmaktır, tabii bu sizi memnun edecekse, [ROOT.Char.Custom('FormOfAddressForLiege')|U].""
 fund_inspiration.2006.a:0 "Memnun eder. Lütfen [inspiration_owner.GetFirstNameNoTooltip] ile birlikte çalışın."
 fund_inspiration.2006.b:0 "Tabii ki. Bizzat benim öğretmenim olacaksınız."
 fund_inspiration.2006.c:0 "Burada yeriniz yok."
 fund_inspiration.2021.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], benim şanıma layık bir zırh yapmak için daha fazla maddi desteğe ihtiyacı olacağını söylüyor.\n\n"[inspiration_owner.Custom('ArtifactArmorTypeLowercase')|U], yapması kolay bir şey değil, malzemesi bile... Tutumlu olmanın vakti değil!""
 fund_inspiration.2021.a:0 "İstediğin desteği alacaksın."
 fund_inspiration.2021.b:0 "Sana beş kuruş daha vermem."
 fund_inspiration.2030.t:0 "$fund_inspiration.title$ Dostça Bir Söz"
 fund_inspiration.2030.desc:0 "Dostum [friend.GetTitledFirstName] yüzünde gülümsemeyle beni durduruyor.\n\n"[ROOT.Char.GetFirstNameNoTooltip]! İşte #EMP buradasın#!! Daha şimdi [inspiration_owner.GetTitledFirstName] ile konuştum! Duydum ki senin için [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')]. Bir ziyarette bulunmaktan kendimi alıkoyamadım!" \n\n"Onunla senin beklentilerini nasıl karşılayabileceği hakkında konuştum, bence sonuçları beğeneceksin!""

 fund_inspiration.2030.a:0 ""Ah! Teşekkürler [friend.GetFirstNameNoTooltip]!""
 fund_inspiration.2040.t:0 "$fund_inspiration.title$ Sabotaj"
 fund_inspiration.2040.desc:0 "[inspiration_owner.GetTitledFirstName] ve şiddetli çığırışları normalde sakin olan bir anı mahvediyor: "[inspiration_owner.Custom('GetInspirationTypeTool')|U] sürekli kaybolurken işimi nasıl yapabilirim ki?!" \n\nBana doğru koşuyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], her ilerleme katettiğimde sürekli bir şeyler yanlış gidiyor! Eminim ki saraydaki biri işime karışıyor!" \n\n[inspiration_owner.Custom('GetInspirationOwnerType')|U] öfkeli bir şekilde odasına dönüyor."
 fund_inspiration.2040.a:0 "Tam bir amatör."
 fund_inspiration.2040.b:0 "Sana kaliten için para veriyorum, zırlaman için değil!"
 fund_inspiration.2040.c:0 "Olabilir mi... olamaz... #EMP [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.c.tt:0 "Sabotajcı tutuklandı"
 fund_inspiration.2040.c.flavor:0 "Tuzak kurma vakti!"
 fund_inspiration.2040.c.success:0 "Sabotajcıyı yakalıyorsunuz"
 fund_inspiration.2040.c.failure:0 "Sabotajcı elinizden kaçıyor"
 ep1_fund_inspiration_2040_scheme_modifier:0 "Gizli İşler"
 ep1_fund_inspiration_2040_scheme_modifier_desc:0 "Bu karakter kendini kanıtlamış bir ajan."
 fund_inspiration.2041.desc:0 "Akşam yemeğinden sonra [inspiration_owner.GetTitledFirstName] ve odasının yanında birkaç muhafız ile bekliyorum, [ROOT.Char.Custom('FortifiedBuilding')] üstüne gece çökerken koridorları izliyorum. \n\nTam vazgeçmeye karar verdiğimde, koridorda hareket eden bir ışık görüyorum, peşinden ise pelerinli bir silüet çıkıyor.\n\nKaranlık figur kapıyı açıyor ve son bir kaçamak bakıştan sonra odaya dalıyor, yüzü titreyen alevlerden ötürü açık bir şekilde belli oluyor bu [rival.GetTitledFirstName]!"

 fund_inspiration.2041.a:0 ""A-ha! Zindanlara!""

 fund_inspiration.2041.b:0 ""[rival.GetHerHim]i [ROOT.Char.Custom('FortifiedBuilding')]den atın!""
 fund_inspiration.2041.c:0 "Bunu kendi yöntemlerimle halledeceğim..."
 fund_inspiration.2050.t:0 "$fund_inspiration.title$ Fikir Değerlendirildi"
 fund_inspiration.2050.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetTitledFirstName] ilerlemesi hakkında beni bilgilendiriyor ve sürekli kendisine yetmeyen [inspiration_owner.Custom('GetInspirationTypeTool')] ve [inspiration_owner.Custom('GetInspirationTypeStation')] hakkında şikayet ediyor. Bu sırada aklım [inspiration_owner.Custom('GetInspirationTypeObject')] ile ilgili fikirlerle dolu... \n\nİşi bizzat #EMP ben#! yapmıyorum ama bu, paranın nasıl harcanacağı hakkında söz sahibi olmadığım anlamına gelmiyor!"
 fund_inspiration.2050.a:0 "Birkaç tavsiyem var..."
 fund_inspiration.2050.b:0 "Geçmişim bana özel bir bakış açısı sağlıyor."
 fund_inspiration.2050.c:0 "Hiç #EMP bu#! açıdan bakmış mıydın?"
 fund_inspiration.2050.d:0 "Çalışmalarına bir bakayım..."
 fund_inspiration.2050.e:0 "Hayır. [inspiration_owner.GetFirstNameNoTooltip], ne yaptığını bilir."
 fund_inspiration.2050.success:0 "Fikirleriniz işe yarıyor"
 fund_inspiration.2050.nothing:0 "Fikirleriniz umursanmıyor"
 fund_inspiration.2050.failure:0 "Fikirleriniz iyi değil"
 fund_inspiration_half_refund_tt:0 "Yatırımınızın yarısını geri kazanacaksınız:"
 fund_inspiration_quarter_refund_tt:0 "Yatırımınızın çeyreğini geri kazanacaksınız:"
 fund_inspiration.2060.t:0 "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip] ve Hazinesi"
 fund_inspiration.2060.desc.religious:0 "İnancıma bağlılığım en güçlü kraldan en fakir dilenciye kadar herkes için bir örnek teşkil ediyor. Bu da saraya bazı hayranlar getiriyor."
 fund_inspiration.2060.desc.fame:0 "Yaptıklarım yabancı saraylardan köy hanlarına kadar tüm dünyada hürmet ve imrenme ile anılıyor. Bu da saraya bazı hayranlar getiriyor."
 fund_inspiration.2060.desc.court:0 "Gösterişli sarayım tüm dünyada biliniyor ve tanınıyor, herkes onun zenginliklerine sahip olmak ya da en azından zenginliklerinin tadına bakabilmek istiyor. Bu da saraya bazı hayranlar getiriyor."
 fund_inspiration.2060.desc:0 "\n\nBugün [donator.GetTitledFirstName] geldi,"
 fund_inspiration.2060.desc.brotherhood:0 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki [barony_scope.GetNameNoTierNoTooltip] diyarlarından ufak bir [donator.GetFaith.GetAdjectiveNoTooltip] kardeşliğini temsil ediyormuş.\n\n"
 fund_inspiration.2060.desc.abbey:0 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki bir [barony_scope.GetAdjectiveNoTooltip] [donator.GetFaith.GetAdjectiveNoTooltip] ibadethanesini temsil ediyormuş.\n\n"
 fund_inspiration.2060.desc.mercenary:1 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki [barony_scope.GetNameNoTierNoTooltip] diyarlarından ufak bir [donator.GetCulture.GetNameNoTooltip] paralı asker grubunu temsil ediyormuş.\n\n"
 fund_inspiration.2060.desc.guild:0 "[barony_scope.GetDeJureLiege.GetNameNoTier] içerisindeki [barony_scope.GetNameNoTierNoTooltip] diyarlarından ufak bir [donator.Custom('dummy_peasant_profession')] loncasını temsil ediyormuş.\n\n"

 fund_inspiration.2060.piety:0 ""En kutsal [ROOT.Char.GetTitleAsNameNoTooltip]!""

 fund_inspiration.2060.saoshyant:0 ""İlahi Saoshyant!""

 fund_inspiration.2060.savior:0 ""Kutsal kurtarıcı!""

 fund_inspiration.2060.saint:0 ""Saygıdeğer aziz!""

 fund_inspiration.2060.prestige:0 ""Ah, muhteşem [ROOT.Char.GetTitleAsNameNoTooltip]!""

 fund_inspiration.2060.grandeur:0 ""Ah, eşsiz [ROOT.Char.GetTitleAsNameNoTooltip]!""
 fund_inspiration.2060.desc_outro:0 ""Yaptırdığınız [inspiration_owner.Custom('GetInspirationTypeObject')] harikâymış diye duyduk ve [inspiration_owner.Custom('GetInspirationOwnerType')] için cüzi bir miktarda bağış yapmak istedik. Umarım bu onuru bize bahşedersiniz efendim, aylardır bunun için para biriktiriyoruz!""

 fund_inspiration.2060.a:0 ""Onurlanan #EMP ben#!im.""

 fund_inspiration.2060.b.religious:0 ""Hayır, lütfen nazik [donator.Custom('NunMonk')], sizde kalsın.""

 fund_inspiration.2060.b.prestige:0 ""Hayır, kabul etmiyorum! Sende kalsın, dostum!""

 fund_inspiration.2060.c:0 ""Hepsi bu kadar mı?""
 ep1_fund_inspiration_2070_accept_modifier:0 "Hediye Kabul Edildi"
 ep1_fund_inspiration_2070_accept_modifier_desc:0 "Bu kontluk hükümdarının eserinin yapımında paya sahip olmaktan memnun."
 ep1_fund_inspiration_2070_refuse_modifier:0 "Hediye Reddedildi"
 ep1_fund_inspiration_2070_refuse_modifier_desc:0 "Bu kontluk hediyelerinin reddedilmesinden ötürü memnun değil ama artık bolca paraları var."
 ep1_fund_inspiration_2070_mock_modifier:0 "Hediye ile Dalga Geçildi"
 ep1_fund_inspiration_2070_mock_modifier_desc:0 "Bu kontluk hükümdarlarının hediyeleri ile delge geçmesinden ötürü memnun değil."
 fund_inspiration.2070.t:0 "$fund_inspiration.title$ Kusurlu Mücevher"
 fund_inspiration.2070.desc:0 "Saray işleriyle meşgulken [inspiration_owner.Custom('GetInspirationOwnerType')] [inspiration_owner.GetTitledFirstName] ve bana vereceği haberler de ertelendikçe ertelendi."
 fund_inspiration.2070.desc.stalled:0 "[inspiration_owner.Custom('GetInspirationTypeObject')|U] üzerindeki çalışma tamamen durdu ve görünüşe göre bunun tek sorumlusu ben değilim...\n\n"
 fund_inspiration.2070.desc.wasted:0 "[inspiration_owner.Custom('GetInspirationTypeObject')|U] üzerindeki haftalarca çalışma boşa harcandı ve görünüşe göre bunun tek sorumlusu ben değilim...\n\n"
 fund_inspiration.2070.desc.lunatic:0 "[inspiration_owner.GetFirstNameNoTooltip], saçma davranışları ve sinir bozucu tavrıyla benim kulağıma kadar geldi. Sürekli fikrini değiştiriyor ve en baştan başlıyormuş ve tuhaf bir [inspiration_owner.Custom('GetInspirationTypeTool')] tekniği varmış."
 fund_inspiration.2070.desc.possessed:0 "[inspiration_owner.GetFirstNameNoTooltip], sürekli değişen hâl ve tavırlarıyla benim kulağıma kadar geldi, en kötüsü ise bunlar tüm çalışmalarının boşa gidip baştan başlamasına sebep olması."
 fund_inspiration.2070.desc.depressed:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], günlerini yataktan çıkmadan bitmek bilmeyen bir hüzün içerisinde geçiriyormuş."
 fund_inspiration.2070.desc.drunkard:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], maddi desteğimi [ROOT.Char.Custom('RegionalAlcoholicDrink')] içmek ve [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] hanlarında gezmek için harcıyormuş."
 fund_inspiration.2070.desc.hashishiyah:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], maddi desteğimin büyük kısmını büyük oranda haşiş almak için harcıyormuş, ardından ise kendini karanlık bir yere kilitleyip oradan çıkmıyormuş."
 fund_inspiration.2070.desc.rakish:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], zamanının çoğunu çalışma odasından uzakta, benden aldığı paralarla [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] genelevlerinde geçiriyormuş."
 fund_inspiration.2070.desc.profligate:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], pazarda yaptığı lüzumsuz harcamalar ile benden aldığı maddi desteğin çoğunu hiçbir yere varmayan fikirlere harcamış."
 fund_inspiration.2070.desc.improvident:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], benden aldığı maddi desteği işine harcayacağına, millete yardım etmek için bağışlarda kullanıyormuş."
 fund_inspiration.2070.desc.irritable:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], öfke problemlerini kontrol etmek için ben olmadığımda kendisine yardım edebilecek herkesi uzaklaştırmış."
 fund_inspiration.2070.desc.comfort_eater:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], bitmek bilmeyen iştahı ile benden aldığı maddi desteğin büyük kısmını pazardan aldığı keklere ve diğer tatlı şeylere harcıyormuş."
 fund_inspiration.2070.desc.reclusive:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], son toplantımızdan bu yana neredeyse hiç görülmemiş, kendini çalışma odasına kapatıp hiçbir yönlendirme almadan başına buyruk bir şekilde çalışmalarına devam etmiş ve anlaştığımız plandan tamamen sapmış."
 fund_inspiration.2070.desc.wounded:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], açık yaraları yüzünden acılar içinde yatağa mahsur kalmış ben ise kendimi [ROOT.Char.GetFaith.DeathDeityName] ona bir süre daha müddet tanısın diye dua ederken buluyorum..."
 fund_inspiration.2070.desc.pregnant:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], hamileliğinden kaynaklı sancılar yüzünden hareket edemiyormuş bu da işini yapamamasına sebep olmuş..."
 fund_inspiration.2070.desc.sick:0 "Dediklerine göre [inspiration_owner.GetFirstNameNoTooltip], sürekli hastalanıyor, bu da onu sık sık yatağa mahkûm ediyor ve işini yapamayacak hâle getiriyor."
 fund_inspiration.2070.desc_outro:0 "\n\nDaha fazla dayanamayıp huzuruma çıkarılmasını emrediyorum."

 fund_inspiration.2070.a:0 ""İşlerin yoluna girmesini sağla.""

 fund_inspiration.2070.b:0 ""Elinden gelenin en iyisini yaptığını biliyorum, [inspiration_owner.GetFirstNameNoTooltip].""

 fund_inspiration.2070.c:0 ""Bir başyapıt olsa iyi olur, hem de yakında!""

 fund_inspiration.2070.d:0 ""Bu [ROOT.Char.Custom('FortifiedBuilding')]den derhal çık, sersem.""
 fund_inspiration.2080.t:0 "$fund_inspiration.title$ Yaratıcı Özgürlük"
 fund_inspiration.2080.antiquarian:0 ""Bu saçmalık!", diyor [rival.GetTitledFirstName], "[ROOT.Char.GetTitleAsNameNoTooltip] ve kişisel koleksiyonunun koruyucusu olarak işinizin belli bir kalitede olmasını sağlamakla yükümlüyüm!""
 fund_inspiration.2080.artificer:0 ""Bu saçmalık!", diyor [rival.GetTitledFirstName], "[ROOT.Char.GetTitleAsNameNoTooltip], beni bu işe güvendiği için atadı! Yaptığın işe bakmama izin verirsen yardımcı olabilirim!""
 fund_inspiration.2080.desc:0 "\n\n"Bittiğinde göreceksin!" diye çıkışıyor [inspiration_owner.GetTitledFirstName]. "Birisi krallara layık [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|l] ise işine karışılmamalı!""

 fund_inspiration.2080.a:0 ""[rival.GetFirstNameNoTooltip] kalitesini #EMP garanti edecek#!, [inspiration_owner.GetFirstNameNoTooltip].""

 fund_inspiration.2080.b:0 ""Kendi görevine bak, [rival.GetFirstNameNoTooltip].""
 fund_inspiration.2080.success:0 "[rival.GetFirstNameNoTooltip], yardımcı oldu"
 fund_inspiration.2080.failure:0 "[rival.GetFirstNameNoTooltip], yardımcı olmadı"
 fund_inspiration.2080.c:0 "Yeni bir sayfa açma vakti."
 fund_inspiration.2090.t:0 "$fund_inspiration.title$ Eş Eli Değmiş Gibi"
 fund_inspiration.2090.desc:0 "Eşim [event_spouse.GetFirstName], [inspiration_owner.GetTitledFirstName] ile heyecanlı bir şekilde muhabbet ederken gözüme çarpıyor, konuşması sırasında [inspiration_owner.Custom('GetInspirationTypeObject')] için fikirlerini sunuyor. [inspiration_owner.Custom('GetInspirationOwnerType')|U] eşimin fikirlerini hor görüyor ve işine karışmasından memnun olmadığını gösteriyor.\n\n"...bu yüzden büyük atalarımın eskiden sahip olduğu [inspiration_owner.Custom('GetInspirationTypeObject')] ile benzer olsa iyi olur!" \n\n[inspiration_owner.GetFirstNameNoTooltip] söylenilenlerden sonra ruhundan bir parça kaybetmiş gibi gözüküyor."

 fund_inspiration.2090.a:0 ""İyi dinle [inspiration_owner.GetFirstNameNoTooltip] — [event_spouse.GetWifeHusband]im duyulmak zorunda!""

 fund_inspiration.2090.b:0 ""Gel canım, işi uzmanına bırakalım.""
 fund_inspiration.2090.success:0 "[event_spouse.GetFirstNameNoTooltip], yardımcı oldu"
 fund_inspiration.2090.failure:0 "[event_spouse.GetFirstNameNoTooltip], yardımcı olmadı"
 fund_inspiration.2100.t:0 "$fund_inspiration.title$ İmrenen Zanaatkâr"
 fund_inspiration.2100.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetTitledFirstName], desteklediğim diğer kişi [other_inspiration_owner.GetTitledFirstName] ile olan çekişmesini oturmuş düşünüyor. \n\nGenelde bu düşüncelerden hemen sıyrılıp odasındaki çalışmasına geri dönse de bu sefer [inspiration_owner.GetFirstNameNoTooltip], akşam yemeğindeki havayı mahvetti. \n\nBu akşam sonunda kafayı sıyırdı:"

 fund_inspiration.2100.desc.funds:0 ""Neden [other_inspiration_owner.GetFirstNameNoTooltip] benden daha fazla fon alıyor? '[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]'! Neymiş yani?""

 fund_inspiration.2100.desc.rival:0 ""Hazineni şu [other_inspiration_owner.Custom2('InsultNoun', SCOPE.sC('inspiration_owner'))] için boşalttığına inanamıyorum, [other_inspiration_owner.GetFirstNameNoTooltip], lağımcılardan daha iyi sonuç alırdın!""

 fund_inspiration.2100.desc.fallback:0 ""Bu yükü bırakmalısınız, hükümdarım; [other_inspiration_owner.GetFirstNameNoTooltip] bir [other_inspiration_owner.Custom('GetInspirationTypeTool')]nin doğru ucunu bilmez, [other_inspiration_owner.Custom('GetInspirationTypeRoom')]nde yolunu bulması bir yana.""

 fund_inspiration.2100.a:0 ""Çalışman benim için değerli, [inspiration_owner.GetFirstNameNoTooltip].""

 fund_inspiration.2100.b:0 ""Fonunu eşitleyeceğim, memnun musun?""

 fund_inspiration.2100.c:0 ""Gel, derdin ne?""

 fund_inspiration.2100.d:0 ""Bu saçmalığı kes.""
 fund_inspiration.2100.c.leave:0 "[inspiration_owner.GetFirstNameNoTooltip], işini bırakıyor"
 fund_inspiration.2100.c.worse:0 "[inspiration_owner.GetFirstNameNoTooltip], motivasyon kaybediyor"
 fund_inspiration.2100.success:0 "İşleri düzeltiyorsun"
 fund_inspiration.2100.failure:0 "İşleri daha kötü yapıyorsun"
 fund_inspiration.2110.t:0 "$fund_inspiration.title$ İşinin Erbabı"
 fund_inspiration.2110.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('generous_vassal'))|U] [generous_vassal.GetTitledFirstName], bana yaklaşarak konuşmaya başlıyor: "Sizi görmek ne güzel, [generous_vassal.Custom2('RelationToMePossessive', ROOT.Char)]! [inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetFirstName] için yaptığınız yardım herkesin dilinde. Desteğiniz karşılığında majestelerine layık [inspiration_owner.Custom('InspirationTypeDescription')|l] diye duydum."\n\n"Lütfen, bu altın kesesini ona iletin.""
 fund_inspiration.2110.desc.part.2: "Böyle bir şaheserin ortaya çıkarılmasına yardım etme şansını kaçırmak istemem!\n\n"
 fund_inspiration.2110.desc.part.2.research: "Bilimsel bir buluşun ortaya çıkarılmasına yardım etme şansını kaçırmak istemem!\n\n"
 fund_inspiration.2110.desc.generous:0 "[generous_vassal.GetFirstNameNoTooltip], cömertliğiyle tanınıyor ve görünüşe göre harcama yapmak için yeni bir şey bulmuş..."
 fund_inspiration.2110.desc.dweeb:0 "[generous_vassal.GetFirstNameNoTooltip], pek çok şeye ilgi duyuyor, bunların arasında değerli eserler ve onları yaratan zihinler de var..."
 fund_inspiration.2110.desc.dweeb.research: "[generous_vassal.GetFirstNameNoTooltip] pek çok şeye ilgi duyuyor, bunların arasında bilimsel buluşlar ve onları ortaya çıkaran zihinler de var..."
 fund_inspiration.2110.desc.friend:0 "[generous_vassal.GetFirstNameNoTooltip], elinde bir torba altınla birlikte gülümsüyor."
 fund_inspiration.2110.desc.rich:0 "Zavallı [generous_vassal.GetFirstNameNoTooltip] harcayamayacağı kadar çok paraya sahip olmalı..."

 fund_inspiration.2110.a:0 ""Ne cömertsin!""

 fund_inspiration.2110.b:0 ""Ah, #EMP emin olun#! [inspiration_owner.GetSheHe] alacak!""
 fund_inspiration.2110.b.flavor:0 "Bu güzel oldu..."

 fund_inspiration.2110.c:0 ""Hayır, lütfen, sizde kalsın!""
 fund_inspiration.2120.t:0 "$fund_inspiration.title$ Gecenin Körü"
 fund_inspiration.2120.desc:0 "[inspiration_owner.GetFirstName], odasında çalışırken zaman uçup gidiyor. [ROOT.Char.Custom('RegionalAlcoholicDrink')|U] içerken, benim için yaptığı [inspiration_owner.Custom('GetInspirationTypeObject')] hakkında konuşuyoruz. Hayal mi görüyorum yoksa açıklayamadığım bir... yakınlık mı var? \n\n"
 fund_inspiration.2120.desc.me:0 "Hayallere dalıyorum, vücudunun ufak hareketlerinde, gülümseyen dudaklarında kayboluyorum... Elimi üzerine koyuyorum. Ben mest edici gözlerinede kaybolmuşken titreyen ellerindeki [inspiration_owner.Custom('GetInspirationTypeTool')] yere düşüyor.\n\n"
 fund_inspiration.2120.desc.them:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] ara verdiğinde ve [inspiration_owner.Custom('GetInspirationTypeTool')] bir kenara konduğunda saat çoktan geç olmuştu. Kadehinden büyük bir yudum alıp bana mesaj verir gibi gülümsüyor. Acaba... O... ? \n\n"
 fund_inspiration.2120.desc.them_into_alot:0 "Bir hayvan gibi kollarıma atlıyor, [inspiration_owner.Custom('GetInspirationTypeStation')] odanın bir tarafına fırlıyor."
 fund_inspiration.2120.desc.them_into:1 "Onda da aynı arzuyu buluyorum: kendini kollarıma bırakıyor..."
 fund_inspiration.2120.desc.me_zealous_homosexuality:0 "Bu yanlış, [ROOT.Char.GetFaith.HighGodNamePossessive] lütfen, bu günahkâr düşüncelere dalmama izin verme..."
 fund_inspiration.2120.desc.me_zealous_adultery:0 "Hayır, [ROOT.Char.GetFaith.ReligiousText] oldukça açık! Zina günahtır! [ROOT.Char.GetFaith.DevilName] beni tuzağa düşürmeye çalışıyor!"
 fund_inspiration.2120.desc.me_unattracted:0 "[inspiration_owner.GetFirstNameNoTooltip] aniden ileri adım atıp beni kollarına alıyor! Kollarım hızlıca onu durduruyor, belki fazla sert bir şekilde... Sıcaklığı anında gidiyor, yerini şaşkınlık ve korkuya bırakıyor."
 fund_inspiration.2120.desc.me_chaste:0 "İleri adım atıp beni kollarının arasına almaya çalışıyor. Vücudum evet dese de, kalbim hayır diyor..."
 fund_inspiration.2120.desc.me_into:0 "İçimde bir şeylerin kıpırdadığını reddedemem, kalp atışlarım hızlanıyor ve birbirimizi bir diğerinin kollarında buluyoruz... Neler #EMP oluyor#!?"
 fund_inspiration.2120.desc.me_into_alot:0 "Arzuladığı şey hakkında şüphem yok! [inspiration_owner.Custom('GetInspirationTypeStation')] ne ara yana fırladı hiçbir fikrim yok, kendimi durduramıyorum."

 fund_inspiration.2120.a:0 ""Buraya gel, tatlım.""

 fund_inspiration.2120.e:0 ""Ah... [inspiration_owner.GetFirstNameNoTooltip]...""

 fund_inspiration.2120.f.chaste:0 ""Bu bana göre değil...""

 fund_inspiration.2120.f:0 ""Ben... gitmeliyim!""

 fund_inspiration.2120.h:0 ""Çabuk, kapı!""

 fund_inspiration.2120.i:0 ""Ah! Ben...""

 fund_inspiration.2120.j:0 ""Hayır! [ROOT.Char.GetFaith.ReligiousText] bu birliği yasaklıyor...""

 fund_inspiration.2120.k.me:0 ""Hayır! Yapamam... zina günahtır!""

 fund_inspiration.2120.k.them:0 ""Hayır, [inspiration_owner.GetHerHim]i zinaya sürükleyemem...""

 fund_inspiration.2120.l:0 ""Bir dakika... buna nasıl #EMP cüret#! edersin?!""

 fund_inspiration.2120.m:0 ""Bırak beni, sefih günahkâr!""
 fund_inspiration.2120.leave_flavor:0 "Aceleyle çıkıyorsunuz"
 fund_inspiration.2130.t:0 "$fund_inspiration.title$ Gelmeyen Fikirler"
 fund_inspiration.2130.desc:1 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] [inspiration_owner.GetTitledFirstName] bayağı kasvetli görünüyor, umuyorum ki yakın zamanda bitmesi gereken muhteşem [inspiration_owner.Custom('GetInspirationTypeObject')] ile alakalı kötü haberler getirmez.\n\n"Efendim, ben de sizi arıyordum... Çalışmalarım sırasında bir engele takıldım diyebilirim, çok büyük bir şey değil tabii! Üzerimdeki baskı arttıkça fikirlerim kayboluyor gibi bir şey!".\n\n"Biraz... ilhama ihtiyacım var! Yüce [ROOT.Char.GetTitleAsNameNoTooltip], bana aktarabileceğiniz... geçmiş tecrübeleriniz var mıdır acaba?""

 fund_inspiration.2130.a.library:0 ""Kütüphaneye!""

 fund_inspiration.2130.a.armory:0 ""Silahhaneye!""

 fund_inspiration.2130.a.hall:0 ""Büyük salona!""
 fund_inspiration.2130.a.tt:0 "[inspiration_owner.GetFirstNameNoTooltip] tarafından sahip olunan [Concept( 'inspiration', 'İlhamın' )|E] kalitesi ya da ilerlemesi artabilir"
 fund_inspiration.2130.a.flavor:0 "Yardım edecek bir şey bulmak zorundayız!"

 fund_inspiration.2130.b:0 ""Ne gerektiğini biliyorum!""
 fund_inspiration.2130.b.great:0 "[inspiration_owner.GetFirstNameNoTooltip] yeni fikirler buluyor"
 fund_inspiration.2130.b.good:1 "[inspiration_owner.GetFirstNameNoTooltip] fikirlerini hatırlıyor"
 fund_inspiration.2130.b.nothing:0 "[inspiration_owner.GetFirstNameNoTooltip] fikirlerini hatırlamıyor"
 fund_inspiration.2130.b.bad:0 "[inspiration_owner.GetFirstNameNoTooltip] fikirlerini unutuyor"
 fund_inspiration.2130.b.terrible:0 "[inspiration_owner.GetFirstNameNoTooltip] fikirlerini tamamen unutuyor"
 fund_inspiration.2130.b.flavor:0 "Ne eğleneceğiz ama!"

 fund_inspiration.2130.c:0 ""Ah, tam da aradığım tonik var.""
 fund_inspiration.2130.c.dead:1 "[inspiration_owner.GetFirstNameNoTooltip], yere yığılıyor"
 fund_inspiration.2130.c.flavor:0 "Nerede şu kırmızı şişe..."

 fund_inspiration.2130.d:0 ""Gerçek ilham içeriden gelir.""
 fund_inspiration.2131.t:0 "$fund_inspiration.title$ Yeni Yüzler"
 fund_inspiration.2131.desc_library_unused:0 "Son bir nefesten sonra [inspiration_owner.GetTitledFirstName] ve ben tozlu kütüphaneme giriyoruz, nadiren girme sebebim olan bir odaya.\n\n"
 fund_inspiration.2131.desc_library:0 "[inspiration_owner.GetTitledFirstName], bakımlı kütüphaneme benimle birlikte giriyor. Ona bazı önemli ciltleri ve iksirleri gösteriyorum.\n\n"
 fund_inspiration.2131.desc_armory_unused:0 "Şaşıran bir asker [inspiration_owner.GetTitledFirstName] ve bana cephanelik demek için bin şahit isteyen bir yer gösteriyor. Buraya hayatımda ilk kez geliyorum!\n\n"
 fund_inspiration.2131.desc_armory:0 "[inspiration_owner.GetTitledFirstName] ve ben geniş cephaneliğime götürülüyoruz, ona en sevdiğim parçaları gösterip hikâyelerini anlatıyorum.\n\n"
 fund_inspiration.2131.desc_great_hall_low:0 "[inspiration_owner.GetTitledFirstName], büyük salonumda gezinirken, büyük salonumun aslında o kadar da büyük olmadığını fark ediyorum.\n\n"
 fund_inspiration.2131.desc_great_hall:0 "[inspiration_owner.GetTitledFirstName] ile büyük salonumu geziyorum, gösterişli halini gördükçe göğsüm kabarıyor."
 fund_inspiration.2131.desc_antiquarian:0 "[second.GetTitledFirstName] gelmekte ısrar etti ve uzaktan izliyor. Her eşya yanlış bir şekilde tutulduğunda ya da yanlış isimlendirildiğinde öfkesi yüzünden belli oluyor.\n\n"
 fund_inspiration.2131.artificer:0 "[second.GetTitledFirstName] memnuniyetle bizimle geliyor, diğer insanların yaratıcılıklarını nasıl kullandığını hep merak ettiğini söylüyor.\n\n"
 fund_inspiration.2131.desc_equipped:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] sanki şaşırmış gibi bir an duruyor, gözlerinin önünde ise [artifact_1.GetName]. "Gerçekten çok iyi süzerenim... Acaba... Acaba bunun yapıldığı [inspiration_owner.Custom('GetInspirationMaterialType')] hâlâ varsa birazını alabilir miyim?""
 fund_inspiration.2131.desc_unequipped:0 "[inspiration_owner.Custom('GetInspirationOwnerType')|U] gezerken aniden duruyor, yakından incelediğiş şey ise [artifact_1.GetName]. "Evet... aradığım şey [inspiration_owner.Custom('GetInspirationMaterialType')] gibi gözüküyor... Acaba... hâlâ bunu istiyor musunuz? Süzerenim?""
 fund_inspiration.2131.desc_fallback:1 "Odada birkaç tur attıktan sonra başı öne eğik bir şekilde bana geliyor. "Süzerenim, burada ilgimi çeken hiçbir şey yok... başka bir şey var mı?""

 fund_inspiration.2131.a:0 ""[artifact_1.GetNameNoTooltip] mi? Pekâlâ...""

 fund_inspiration.2131.b:0 ""Peki ya [artifact_2.GetNameNoTooltip]?""

 fund_inspiration.2131.c:0 ""Ortalıkta bir sürü ıvır zıvır olmalı...""
 fund_inspiration.2131.c.good:0 "Kaliteli [inspiration_owner.Custom('GetInspirationMaterialType')] buluyorsunuz"
 fund_inspiration.2131.c.nothing:0 "Hiçbir şey bulamıyorsunuz"
 fund_inspiration.2131.c.bad:0 "Dandik [inspiration_owner.Custom('GetInspirationMaterialType')] buluyorsunuz"

 fund_inspiration.2131.d:0 ""Sadece bir göz atıyorsun.""
 fund_inspiration.2131.d.great:1 "[inspiration_owner.GetNameNoTooltip], harika bir şey buluyor"
 fund_inspiration.2131.d.good:1 "[inspiration_owner.GetNameNoTooltip], [inspiration_owner.Custom('GetInspirationMaterialType')] buluyor"
 fund_inspiration.2131.d.nothing:1 "[inspiration_owner.GetNameNoTooltip], hiçbir şey bulamıyor"
 fund_inspiration.2131.d.bad:1 "[inspiration_owner.GetNameNoTooltip], kalitesiz [inspiration_owner.Custom('GetInspirationMaterialType')] buluyor"
 fund_inspiration.2131.d.terrible:1 "[inspiration_owner.GetNameNoTooltip], dandik [inspiration_owner.Custom('GetInspirationMaterialType')] buluyor"

 fund_inspiration.2131.e:0 ""[second.GetFirstNameNoTooltip]! Bir önerin var mı?""

 fund_inspiration.2131.f:0 ""Ne büyük zaman kaybı!""
 fund_inspiration.3001.t:0 "$fund_inspiration.title$ Kâfirce Yazılar"
 fund_inspiration.3001.desc_opening:0 "[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U], odaya elinde bir sürü sayfa ile dalıyor, peşinde ise yanakları kıpkırmızı olan [inspiration_owner.GetTitledFirstName] girip elindeki sayfaları almaya çalışıyor.\n\n"

 fund_inspiration.3001.desc_witch:0 ""Bu [inspiration_owner.GetWomanMan] [ROOT.Char.GetFaith.WitchGodName] hakkında yazıyor. #EMP [ROOT.Char.GetFaith.WitchGodName]#!!""

 fund_inspiration.3001.desc_cannibal:0 ""Bu [inspiration_owner.GetWomanMan] #EMP insan eti yemek#! hakkında yazıyor!""

 fund_inspiration.3001.desc_torturer:0 ""Bu [inspiration_owner.GetWomanMan] anlatılamaz, sadistçe faaliyetler hakkında yazıyor!""

 fund_inspiration.3001.desc_lustful:0 ""Bu [inspiration_owner.GetWomanMan] anlatılamaz, sapkın faaliyetler hakkında yazıyor!""

 fund_inspiration.3001.desc_other:0 ""Bu [inspiration_owner.GetWomanMan] dinsizce şeyler hakkında yazıyor!""
 fund_inspiration.3001.desc_ending:0 ""Hem de çizimlerle! Tek tahminim bunun hakkında hiçbir fikrinizin olmadığı, [ROOT.Char.Custom('FormOfAddressForLiege')|l]."\n\n[inspiration_owner.GetTitledFirstNameNoTooltip] dudak büküyor ve sayfaları elinden almak için son bir hamle daha yapıyor fakat [court_chaplain.Custom('CouncilPosition')], ondan kaçıyor.\n\n"Şimdi bu alçak yazar ortaya çıktığına göre kitabın [ROOT.Char.GetFaith.HighGodName], olması gerektiği şekilde, adına yazılmasını sağlayacaksınız değil mi?""
 fund_inspiration.3001.a:0 "Tabii ki, o tarz şeyler yazdığı hakkında hiçbir fikrim yok."
 fund_inspiration.3001.a_tt:0 "[inspiration_owner.GetShortUIName], [inspiration_owner.Custom('ArtifactBookSubject')] yerine inanç ile alakalı bir kitap yazacak"
 fund_inspiration.3001.b:0 "Ne olması gerektiği şekilde olurdu biliyor musun? Onu yalnız bırakman!"
 fund_inspiration.3001.c:0 "O çizimler pek güzel gözükmüyor... Bu parayla yeni mürekkep al."
 fund_inspiration.3011.t:0 "$fund_inspiration.title$ Askeriye Meseleleri"
 fund_inspiration.3011.desc_opening_1:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], ben onu bulduğumda tomarlar ve müsveddeler ile sarılmış şekilde oturuyor, öfkeli bir şekilde sayfaları geçiyor.\n\n"
 fund_inspiration.3011.desc_opening_2:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], ben onu bulduğumda tomarlar ve müsveddeler ile sarılmış şekilde başı ellerinin arasında oturuyor.\n\n"
 fund_inspiration.3011.desc_opening_3:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], avuçları tomarlar ve müsveddeler ile dolu şekilde bana yaklaşıyor.\n\n"

 fund_inspiration.3011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Savaş sanatında dikkate değer o kadar çok alan var ki. Strateji, ordu düzeni, savaşın kendisi... Nereden başlayacağımı bile bilmiyorum!""
 fund_inspiration.3011.a:0 "Kitabın ordu için eğitici ya da işe yarar olmasını istiyorum."
 fund_inspiration.3011.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının strateji ve ordu kompozisyonu ile alakalı olmasını sağlayacak"
 fund_inspiration.3011.b:0 "Belki de meselenin daha soylu alanlarına değinmelisin."
 fund_inspiration.3011.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının kahramanlık ve dövüş ile alakalı olmasını sağlayacak"
 fund_inspiration.3011.d:0 "Senin gönlün ne hakkında yazmak istiyor?"
 fund_inspiration.3011.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının konusunu kendi belirleyecek"
 fund_inspiration.3012.t:0 "$fund_inspiration.title$ Diplomasi Meseleleri"

 fund_inspiration.3012.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Diplomaside dikkate değer o kadar çok alan var ki. Saray adabı, ilişkiler, #EMP şiir#!... Nereden başlayacağımı bile bilmiyorum!""
 fund_inspiration.3012.a:0 "Belki de saray hayatına değinen bir şey."
 fund_inspiration.3012.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının ittifaklar ve konuşma sanatı ile alakalı olmasını sağlayacak"
 fund_inspiration.3012.b:0 "Kitabın eğlenceli olmasını istiyorum!"
 fund_inspiration.3012.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının macera ve eğlence ile alakalı olmasını sağlayacak"
 fund_inspiration.3013.t:0 "$fund_inspiration.title$ Öğrenim Meseleleri"

 fund_inspiration.3013.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Dikkate değer o kadar çok alan var ki. Din, eğitim... Yazma sanatının kendisinden bahsetmiyorum bile!""
 fund_inspiration.3013.a:0 "Bu amaç [ROOT.Char.GetFaith.HighGodName] uğruna olmalı!"
 fund_inspiration.3013.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının teoloji ve dualar ile alakalı olmasını sağlayacak"
 fund_inspiration.3013.b:0 "Kitabın eğitici ya da en azından eğlenceli olmasını istiyorum!"
 fund_inspiration.3013.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının tarih ve şiir ile alakalı olmasını sağlayacak"
 fund_inspiration.3014.t:0 "$fund_inspiration.title$ İdare Meseleleri"

 fund_inspiration.3014.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Yönetimde dikkate değer o kadar çok alan var ki. Yasalar, ticaret, #EMP para#!... Nereden başlayacağımı bile bilmiyorum!""
 fund_inspiration.3014.a:0 "Ülke yönetmeyle alakalı meselelere odaklan."
 fund_inspiration.3014.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının kanun ve yönetim ile alakalı olmasını sağlayacak"
 fund_inspiration.3014.b:0 "Gelişim ile ilgileniyorum!"
 fund_inspiration.3014.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının binalar ve vergiler ile alakalı olmasını sağlayacak"
 fund_inspiration.3015.t:0 "$fund_inspiration.title$ Entrika Meseleleri"

 fund_inspiration.3015.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Entrikada dikkate değer o kadar çok alan var ki. Komplolar, baştan çıkarma, manipülasyon... Nereden başlayacağımı bile bilmiyorum!""
 fund_inspiration.3015.a:0 "#EMP Herkesin#! bir adım önünde olmak istiyorum!"
 fund_inspiration.3015.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının planlar ve manipülasyon ile alakalı olmasını sağlayacak"
 fund_inspiration.3015.b_men:0 "Erkekler önümde sıra olsun istiyorum!"
 fund_inspiration.3015.b_women:0 "Kadınlar önümde sıra olsun istiyorum!"
 fund_inspiration.3015.b_both:0 "Herkes beni arzulasın istiyorum!"
 fund_inspiration.3015.b_none:0 "Baştan çıkarmada ustalaşmak istiyorum."
 fund_inspiration.3015.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], çalışmasının şehvet ve baştan çıkarma sanatı ile alakalı olmasını sağlayacak"
 fund_inspiration.3030.t:0 "$fund_inspiration.title$ Soğuyan Nefret"
 fund_inspiration.3030.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], benim için yazdığı kitabın konusunu tartışmak için beni davet etti.\n\n"

 fund_inspiration.3030.desc:0 ""Seninle [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] arasındaki düşmanlığın soğuduğunu fark etmeden edemiyorum. Bu kitabı hâlâ [prev_nemesis.GetHerHim]e duyduğun nefrete adamak istiyor musun?""

 fund_inspiration.3030.desc_dead:0 ""Madem [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] aramızdan ayrıldı, bu kitabı hâlâ [prev_nemesis.GetHerHim]e duyduğun nefrete adamak istiyor musun?""
 fund_inspiration.3030.a:0 "Ona olan nefretim o kadar da azalmadı."
 fund_inspiration.3030.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], [prev_nemesis.GetTitledFirstName] ile aranızdaki düşmanlık hakkında yazmaya devam edecek"
 fund_inspiration.3030.b:0 "Uğraşmaya değmez."
 fund_inspiration.3031.t:0 "$fund_inspiration.title$ Solan Aşk"

 fund_inspiration.3031.desc:0 ""[prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)]'ün artık gözündeki #EMP en yüksek#! makamda olmadığını fark etmeden edemiyorum, [ROOT.Char.Custom('FormOfAddressForLiege')]. Bu kitabı hâlâ [prev_soulmate.GetHerHim]e duyduğun aşka adamak istiyor musun?""

 fund_inspiration.3031.desc_dead:0 ""[prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)]'ü kaybetmenin acısı çok taze olmalı... Bu kitabı hâlâ [prev_soulmate.GetHerHim]e duyduğun aşka adamak istiyor musun?""
 fund_inspiration.3031.a:0 "Özlem ve kayıp olmadan aşk nedir ki?"
 fund_inspiration.3031.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], [prev_soulmate.GetTitledFirstName] ile olan aşkınız hakkında yazmaya devam edecek"
 fund_inspiration.3031.b:0 "Uğraşmaya değmez."
 fund_inspiration.4001.t:0 "$fund_inspiration.title$ Kes Biç"

 fund_inspiration.4001.desc:0 ""[inspiration_owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] yeni kıyafetimi #EMP mahvetti#!!"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] odaya öfkeyle dalar, peşinde dokumacı. [courtier.GetSheHe]'in elinde tuttuğu giysi o kadar kötü kesilmiş ki bir zamanlar ne olduğunu anlayamıyorum.\n\n"Abartıyorsun! Sadece kumaşın dokumasını inceliyordum, projem için önemli.""
 fund_inspiration.4001.a:0 "İpin ucunu kaçırmışsın, illa yapacaksan kendi kıyafetlerin üzerinde yap!"
 fund_inspiration.4001.b:0 "Gerekli diyorsa, gereklidir."
 fund_inspiration.4010.t:1 "$fund_inspiration.title$ Kırmızı, Mavi ve [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.4010.desc:0 "Dokumacımın atölyesine gidip benim için yaptığı dokumanın nasıl gittiğine bakıyorum. İçeride ise birkaç saray mensubum var. Hepsi kolları arkalarında, duvarları inceliyor. Mevcut dokumalar sadece kendine özgü boya darbelerinden oluşuyor. Birinin orasında burasında biçimsiz lekeler var. Biri tamamen beyaz ve bazı yerlerinde kareler var. Birinde birbirine dolaşmış çizgiler var. Bu sanat mı şimdi?\n\n[artistic_courtier_1.GetTitledFirstNameNoTooltip], leke gibi gözüken bir yeri işaret ediyor. "Beyazın yanındaki bu pis kahverengi, insanın doğasında yatan vahşeti yansıtmıyor mu sizce de?"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] kafasını onaylar şekilde sallıyor. "Bence [inspiration_owner.GetTitledFirstNameNoTooltip] ve çocukluğu arasındaki çatışmayı yansıtıyor - bak, şu annesine benziyor gibi.""
 fund_inspiration.4010.a:0 "Onaylar şekilde başını salla ve sanatçıyı öv"

 fund_inspiration.4010.b:0 ""İğrenç! Gidip biraz geleneksel sanat izlemeliyim.""
 fund_inspiration.4010.b.tt:0 "Yatırımınız geri verildi ve sipariş iptal edildi"

 fund_inspiration.4010.c:0 ""[child.GetTitledFirstNameNoTooltip] bile bunu yapabilirdi!""

 fund_inspiration.5011.desc:0 ""Macerama çıkma zamanım geldi, [ROOT.Char.GetTitleTierName]'im." [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ağır çantaların altında ezilirken elinden geldiğince eğilir.\n\n"Ayrılmadan önce lütfen söyleyin, yolculuğum sırasında göz kulak olmamı istediğiniz belirli bir şey var mı?""
 fund_inspiration.5011.a:0 "Bana egzotik bir hayvanın kafatasını ya da derisini getir."
 fund_inspiration.5011.b:0 "Burada bulamayacağımız malzemeler istiyorum."
 fund_inspiration.5011.c:0 "Keşke orada olsaydım dedirtecek bir dokuma ya da sanat parçası."
 fund_inspiration.5011.d:0 "Bana güzel bir şey getirmen için sana güveniyorum."
 fund_inspiration.5011.e:0 "Gerçekten özel bir şeye sahip olmak istiyorum!"
 fund_inspiration.5021.t:0 "$fund_inspiration.title$ Rota Değişikliği"
 fund_inspiration.5021.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tarafından işe alındığını iddia eden bir gezgin huzuruma çıkarıldı, maceracıdan gelen bir mesaj taşıyormuş.\n\n"Endişelenmeyin efendim, zira [inspiration_owner.GetTitledFirstNameNoTooltip] ve sıhhati oldukça yerinde. Size daha büyük bir macerayı destekleyebileceğiniz havadislerini getiriyorum! Şöyle diyeyim, [inspiration_owner.GetTitledFirstNameNoTooltip], macerası sırasında bir yanlış dönüş yapmış ve bu yüzden şu an [adventuring_location.GetNameNoTier] yakınlarında."\n\nYolculuğunda eşlik eden kişi kirli bir harita çıkarıp nereye gittiklerini gösteriyor. "Sahip olduğu para [inspiration_owner.Custom('InspirationAdventureDestination')] diyarlarına planladığımız gibi varmak için yeterli fakat dediğine göre fazladan para ile yerel bir söylentiyi takip edip size gerçekten ihtişamlı bir eser getirebilirmiş!""
 fund_inspiration.5021.a:0 "Bu saçmalık! #EMP Kafalarına buyruk seyahatlerinin#! parasını ödemeyeceğim!"
 fund_inspiration.5021.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], yapmak için yola çıktığı şeyi yapacak."
 fund_inspiration.5021.b:0 "Hayat bir macera, bölgeyi eserler için arayın!"
 fund_inspiration.5021.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip], [adventuring_location.GetNameNoTierNoTooltip] topraklarını keşfedecek."
 fund_inspiration.6001.t:0 "Bozkır ve eğer kalbimde dörtnala koşuyor,"
 fund_inspiration.6001.desc:1 "Aylardır bitmek bilmeden at sürüyorum. Ardım bu acıyı asla unutmayacak! Mayalanmış kısrak sütü ve açık gece altında zaman geçirmek hoşuma gitmeye başladı.\n\nBu kurye ile size Morin Huur'un oyulmuş başını yolluyorum, enstrümanların üstüne koydukları dekoratif bir at başı. Belki hoşunuza gider."
 fund_inspiration.6001.a:0 "Bunu saklayacağım!"
 fund_inspiration.6001.b:0 "Saray Müzisyenine gönderin."
 fund_inspiration.6002.t:0 "Hindistan seyahatim son hız devam ediyor!"
 fund_inspiration.6002.desc:0 "Ziyaret ettiğim her sarayın bana gösterdiği farklı değerli taşları gördükçe gözlerime inanamıyorum. Kendimi seyahatin pisliğini ararken buluyorum.\n\nSize bana verilen tatsız bir hediyeyi kurye ile yolladım, üstünde kaplan başı oymalı bir yüzük, gözleri ise değerli taşlardan yapılmış. Hiç bu kadar rahatsız edici bir şey görmüş müydünüz?"
 fund_inspiration.6002.a:0 "Ben oldukça beğendim, kendi kaybı."
 fund_inspiration.6002.b:0 "Berbat! Parçalayıp taşları satın."
 fund_inspiration.6003.t:0 "Çölü hayal ediyorum,"
 fund_inspiration.6003.desc:0 "Süzerenim, Afrika'daki seyahatim devam ediyor, bu süreçte bir gezgin deve kafilesine katıldım.\n\nSize benim gibi bir gezginin bana verdiği mücevherleri yolluyorum, devekuşu yumurtası parçaları ile süslenmiş oldukça güzel bir kolye. Tahminimce hiç devekuşu görmemişsinizdir."
 fund_inspiration.6003.a:0 "Oldukça güzel! Bizzat giyeceğim."
 fund_inspiration.6003.b:1 "Bunu [event_spouse.GetTitledFirstNameNoTooltip] ile paylaşacağım."
 fund_inspiration.6004.t:0 "Gezgin olmak,"
 fund_inspiration.6004.desc:0 "Orta Doğu'ya olan seyahatimin çoğu başıma üşüşen seyyar satıcıları kovmakla geçti.\n\nÇoğu kez beni oyalamamaları için sattıkları ufak şeylerden birini alıp başımdan def ediyorum. Satın aldığım şeylerden bazılarını size kurye ile gönderdim. Belki hoşunuza gider."
 fund_inspiration.6004.a:0 "Hepimizin bildiği yoldan giden bir maceracı neye yarar ki?"
 fund_inspiration.6004.b:0 "Bunlar da bayağı güzel şeylermiş..."
 fund_inspiration.6005.t:0 "Maceralarım sıkıcı,"
 fund_inspiration.6005.desc:0 "[ROOT.Char.Custom('FormOfAddressForLiege')], maceralarım sırasında birkaç banal hatıra buldum ve size bu kurye ile gönderdim fakat bundan sonra neler bulabilirim bilmiyorum.\n\nAvrupalılar, hayatımda karşılaştığım en pis kokan canlılar. Ufak bir çocukken yeşil ve güzel çayırlar hayal ederdim fakat eminim ki bu dünyanın yarısı çamurdan yapılmış. Lütfen bana merhamet edip geri çağırın."
 fund_inspiration.6005.a:0 "Tatil yapmaya gitmedin! Yolculuğa devam!"
 fund_inspiration.6005.b:0 "Zavallı şey, sanırım gönderdiği şeyler yeterli olur."
 fund_inspiration.6005.b.tt:0 "[inspiration_owner.GetTitledFirstName], dönsün diye izin veriyorsunuz"
 fund_inspiration.6006.t:0 "Anadoludan esenlikler,"
 fund_inspiration.6006.desc:0 "Küçük Asya'daki seyahatlerim, kuzu etine, yoğurda ve patlıcana karşı bir iştah beslememi sağladı ve kurye ile birlikte size birkaç tarif yolladım.\n\nBeni ağırlayan biri bana denizatı süslemeli altın bir broş hediye etti, onu da size gönderdim. Eminim ki seyahatim sırasında daha nice güzellikler ile karşılaşacağım."
 fund_inspiration.6006.a:0 "Şeflerimize söyleyin, bu yemekleri hemen yapsınlar!"
 fund_inspiration.6006.b:0 "Amma da eğleniyor gibi gözüküyor..."
 fund_inspiration.6100.t:1 "$fund_inspiration.title$ Örnek Hükümdar"
 fund_inspiration.6100.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], neşeli bir şekilde dikkatimi çekiyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], istediğiniz sandığın minyatür bir prototipini tamamladım, çalışan bir kilidi bile var."\n\nBana avucunu uzatıyor, ortasında ise ufak bir sandık var, yanında ise tahıl tanesi kadar ufak bir anahtar.\n\n"İçinde bir parça mücevher var, açıp bakın isterseniz." Bana uzatmaya çalışırken anahtar parmaklarının arasından kayıp düşüyor. Her yeri arasa da anahtardan iz yok."
 fund_inspiration.6100.a:0 "Bu saçmalığı bir kenara bırak, sandığı kır ve mücevherimi geri ver!"
 fund_inspiration.6100.b:0 "Yine de güzel bir sandık, sanırım saklayacağım."
 fund_inspiration.6101.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], ufak bir kutu tutuyor, üstündeki kıl kadar ince oymalar bile belli oluyor. "Son isteğinizin bir prototipi. Boşa gitmesini istemiyorum. Bu ufak şey için bir kullanım alanı bulabiliriz."\n\n[antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] aklına gelen fikirle dikiliyor. "İçine zamanımızdan bir hatıra koyup gömebiliriz, geleceğin çocukları için ortaya çıkarılacak bir yadigar olur!""
 fund_inspiration.6101.a:0 "İçine ufak bir portremi koyacağım."
 fund_inspiration.6101.b:0 "Ufak bir şiir yazıp içine koyacağım."
 fund_inspiration.6101.c:0 "Bende kalmasını tercih ederim."
 fund_inspiration.6102.desc:0 "Yatmak için hazırlık yapıyorum, bu sırada ayağımda keskin bir acı hissediyorum.\n\nBiraz inceledikten sonra fark ediyorum ki ayak tabanıma saplanan minyatür bir heykel var.\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], bana kapı ağzından melun bir şekilde bakıyor. "Özür dilerim, bu son isteğinizin bir prototipiydi. Düşürmüş olmalıyım.""

 fund_inspiration.6102.a:0 ""Çıkarın şunu ve gözümün önünden kaldırın!""

 fund_inspiration.6102.b:0 ""Bunu hekim halledebilir.""
 fund_inspiration.6102.c:0 "Kendin çıkar ve cebine koy."
 fund_inspiration.6102.cure_toast:0 "Minyatür güvenli bir şekilde çıkarıldı"
 fund_inspiration.6102.failure_toast:0 "İnatçı minyatür"
 fund_inspiration.6102.failure_toast_desc:0 "Kolunun bir parçası ayağınızın içinde kayboldu"
 fund_inspiration.6103.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] eğiliyor. "Sizin için yaptığım dolabı inceleyip fikirlerinizi paylaşmanızı oldukça isterim, [ROOT.Char.Custom('FormOfAddressForLiege')|l]."\n\nBeni çalışma odasına götürüyor, odada ise sadece tozlu, kırık dökük bir dolap var.\n\n"Ha, o değil." Dolabı açıp içinden ufak bir dolap modeli çıkarıyor, süslü ve gösterişli ama bir parmağım kadar. "Ne düşünüyorsunuz?""
 fund_inspiration.6103.a:0 "Umarım bu sadece prototiptir."
 fund_inspiration.6103.b:0 "Muhteşem! Bayıldım!"
 fund_inspiration.6104.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], ufak bir kutu getiriyor ve yüzünde gülümseme ile bana veriyor.\n\nHediyeyi açtığımda bir mücevher, yüzük ya da bir oyma görmeyi bekliyorum fakat içinde bulduğum şey minyatür bir taht, hem de o kadar küçük bir taht ki üstüne bir fare oturabilir.\n\n"Yeni tahtınız için bir prototip, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Hoşunuza gider diye düşündüm.""
 fund_inspiration.6104.a:0 "Ne kadar hoş! Bunu saklayacağım!"
 fund_inspiration.6104.b:0 "İyi güzel ama işinin başına dön."
 fund_inspiration.6104.c:0 "Oyuncaklarla oynamak için #EMP oldukça#! fazla büyüdüm."
 fund_inspiration.6105.desc:1 "Minyatür eşya kutumu gururla [ROOT.Char.Custom('FortifiedBuilding')] içerisinde taşıyorum, en iyi nerede sergileyebileceğimi düşünürken [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ile karşılaşıyorum.\n\nKutunun içini gördüğünde, gözünden bir damla yaş süzülüyor. "İşte zevkleri olan birisi, benimle gelin."\n\nBeni çalışma odasına götürüyor ve gizli bir kutu çıkarıyor. İçinde ise düzinelerce minyatür sahne, figür ve eşya var. "Bir oyun icat ettim, hayali bir kuşatma. Bana katılır mıydınız?""
 fund_inspiration.6105.a:0 "Hiç sormayacaksın sanmıştım!"
 fund_inspiration.6105.b:0 "Ee, belki başka zaman."
 fund_inspiration.6200.t:1 "$fund_inspiration.title$ Kırmızı, Mavi ve [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.6200.desc:2 "Dokumacımın atölyesine gidip benim için yaptığı dokumanın nasıl gittiğine bakıyorum. İçeride ise birkaç saray mensubum var. Hepsi kolları arkalarında, duvarları inceliyor. Mevcut dokumalar sadece kendine özgü boya darbelerinden oluşuyor. Birinin orasında burasında biçimsiz lekeler var. Biri tamamen beyaz ve bazı yerlerinde kareler var. Birinde birbirine dolaşmış çizgiler var. Bu sanat mı şimdi?\n\n[artistic_courtier_1.GetTitledFirstName], leke gibi gözüken bir yeri işaret ediyor. "Beyazın yanındaki bu pis kahverengi, insanın doğasında yatan vahşeti yansıtmıyor mu sizce de?"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] kafasını onaylar şekilde sallıyor. "Bence [ROOT.Char.GetTitledFirstNameNoTooltip] ve çocukluğu arasındaki çatışmayı yansıtıyor - bak, şu annesine benziyor gibi.""
 fund_inspiration.6200.a:0 "Onaylar şekilde başını salla ve sanatçıyı öv"

 fund_inspiration.6200.b:0 ""İğrenç! Gidip biraz geleneksel sanat izlemeliyim.""
 fund_inspiration.6200.b.tt:0 "Yatırımınız geri verildi ve sipariş iptal edildi"

 fund_inspiration.6200.c:0 ""[child.GetTitledFirstNameNoTooltip] bile bunu yapabilirdi!""
 fund_inspiration.6300.t:0 "$fund_inspiration.title$ Mutsuz Kıta"
 fund_inspiration.6300.intro:0 "[inspiration_owner.GetTitledFirstName], masasının başındayken denk geliyorum, önünde müsvetteler ile pencereden dışarı bakıyor.\n\n"

 fund_inspiration.6300.no_relationship_desc:0 ""Birinin beni sevmesi ihtimali imkânsız. Duygularımı karşılık bulan birine hiç fısıldamadım."\n\n"Bu yüzden senin için yazmıyordum — yalnızca biriyle yattığımdan bu yana geçen akşamları sayıp karamsarlığa kapılıyorum.""

 fund_inspiration.6300.no_love_desc:0 ""Genellikle beni yazılı kelimeden daha çok heyecanlandıran bir şey olmaz, ama şaşırtıcı şekilde şu an hiçbir arzulu duygu hissetmiyorum."\n\n"Özür dilerim, [ROOT.Char.Custom('FormOfAddressForLiege')], aşk üzerine yazamam, ilham perisi beni terk etti.""

 fund_inspiration.6300.homosexual_desc:0 ""Ah, [ROOT.Char.Custom('FormOfAddressForLiege')]. Saatlerdir himayenize değer bir romantik eser bestelemeye çalışmama rağmen, kendimi parşömenimin başında ağlamaktan başka bir şey yaparken bulamadım."\n\n"Benden imkânsızı istiyorsunuz. Benim aşkım, yazılmadan kalması gereken türden.""
 fund_inspiration.6300.a:0 "Güzel! Bu acılı düşüncelerini yazdığın şeye yansıt!"
 fund_inspiration.6300.a.failure:0 "[inspiration_owner.GetShortUIName], artık aşktan nefret ediyor."
 fund_inspiration.6300.a.success:0 "[inspiration_owner.GetShortUIName], aşk hakkında yazmaya ikna oldu."
 fund_inspiration.6300.b:0 "Napalım, yarım saatim var, anlat bakalım."
 fund_inspiration.6300.c:0 "İmkânsız! Dünya nasıl olur da sözlerini kullanma şeklinin güzelliğini anlamaz?"
 fund_inspiration.6300.d:0 "Lakin aşktır yaşamak."
 fund_inspiration.6300.e:0 "Gönlünden geçeni yaz, her ilham benim için sanattır."
 fund_inspiration.6300.f:0 "Bir şeyler uydur! Aşk hakkında yazan herkes sahtekâr zaten."
 fund_inspiration.6301.t:0 "$fund_inspiration.title$ Sevgili dostum,"
 fund_inspiration.6301.lover_desc:0 "Kalbimden ne geliyorsa onu yazmamı söylediğin geceden beri, aklıma gelen tek şey isminin heceleri. Günahsa seni sevmek, istemiyorum cennete gitmek."
 fund_inspiration.6301.friend_desc:0 "Sen aşkı nasıl hissediyorsan ona göre yaz dediğinden beri kelimelerim sular gibi akıyor."
 fund_inspiration.6301.female_desc:0 "\n\nKulübesinin yakınlarında kaybolan kraliçeye aşık olan cadının şiiri."
 fund_inspiration.6301.male_desc:0 "\n\nHer gece kütüphanecisi ile birlikte yıldızları izleyip, göklerde aşk yaşamak isteyen prensin şarkısı."
 fund_inspiration.6301.crime_desc:0 "Ne güzel suç."
 fund_inspiration.6301.a:0 "Bunu atmayacağım ama gizli tutmam gerekiyor."
 fund_inspiration.6301.b:0 "Batsın dünya, bunu halka okutacağım!"
 fund_inspiration.6400.t:1 "$fund_inspiration.title$ Han Müdavimi"
 fund_inspiration.6400.desc:0 "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] hanlarından birini ziyaretimde, handaki müşterilerin hepsinin dikkatini çeken birini inceliyorum.\n\nDiğer tüm müşterilerden daha sarhoş olduğu apaçık ortada, hem de sanki günlerdir buradan çıkmamış gibi kokuyor. En üzücü kısım ise maceracım [inspiration_owner.GetTitledFirstName], olduğunu fark ediyorum, görünüşe göre aylarca benden aldığı paraya rağmen vatandan bile çıkmamış!\n\n"Sonraki seyahatimde ise tek yudumda Kızıldenizi geçeceğim!" deyip elindeki kırmızı şarap dolu bardağı tek seferde kafasına dikiyor ve handaki herkes alkışlıyor."
 fund_inspiration.6400.a:0 "Defol buradan ve yola çık!"
 fund_inspiration.6400.b:0 "Şarlatan! İçmen için beş kuruş daha vermeyeceğim!"
 fund_inspiration.6400.a.success:0 "Maceracıyı kendini toplamasına ikna ediyorsunuz"
 fund_inspiration.6400.a.success_continue:0 "Macera devam ediyor!"
 fund_inspiration.6400.a.failure:0 "Maceracı paranızla birlikte kaçıyor!"
 fund_inspiration.6500.t:0 "$fund_inspiration.title$ Vahşi Ormanda Müzik"
 fund_inspiration.6500.introduction:0 "Maceracımdan, kelimelerini ustaca kullandığı bir mektup alıyorum. O kadar güzel betimlemiş ki, onun gördüklerini kendi zihnimde canlandırabiliyorum."
 fund_inspiration.6500.desc:0 "\n\n'Vahşi ormanda ayakta dikiliyorum. Kuşların çığlıkları kafamın içinde yankılanıyor. Buradaki birkaç yerli, en hoş müziğin burada olduğunu söylüyorlar. Belli ki [court_musician.GetTitledFirstNameNoTooltip] müzik yaparken onu hiç dinlememişler.\n\n'Saz kamışlarından biriyle onun melodilerinden birini çalmaya çalıştım. Ancak yerliler beni kasabalarından kovaladılar ve zehirli bir bıçakla yaraladılar. Yine de hayatta kaldım. "Vahşi ormana saray müziği getirken öleceksem de, ölümüm böyle olsun!" dedim."
 fund_inspiration.6500.action:0 "\n\n'Muhtemelen daha sonra ne yaptığımı hayal edebiliyorsunuzdur...'"
 fund_inspiration.6500.a:0 "Şarkı söylemeye başladın ve onları kazandın!"
 fund_inspiration.6500.b:0 "Daha medeni topraklara kaçtın!"
 fund_inspiration.6500.c:0 "Dev bir kedi senin ve yerlilerin arasına atladı!"
 fund_inspiration.6500.a.success:0 "Maceracı vahşi orman sakinlerini etkiliyor"
 fund_inspiration.6500.a.failure:0 "Maceracı vahşi orman sakinlerini rahatsız ediyor"
 fund_inspiration.6500.b.success:0 "Maceracı hızla uzaklaşıyor"
 fund_inspiration.6500.b.failure:0 "Maceracı yeterince hızlı kaçamıyor"
 fund_inspiration.6500.c.tt:0 "Maceracı leoparla savaşmaya yardım ediyor"
 fund_inspiration.6500.c.tt_failure:0 "Maceracı kaçmaya çalışırken yaralanıyor"
 fund_inspiration.6501.t:0 "$fund_inspiration.title$ Karada Yolculuk"
 fund_inspiration.6501.desc:1 "\n\n'Dolambaçlı tepelerin etrafını dolaşan nehirlerde yelken açıyoruz. Bir kuraklıktan sonra, yerliler bize seyahat ettiğimiz nehrin diğer ucunun kuruduğunu söylediler.\n\n'Pes etmek ya da geri dönmek yerine, imkânsızı başarmayı denedik. Mürettebatıma bir ray ve makara sistemi kurmaya başlamalarını emrettim ve teknemizi karadan bir sonraki nehre doğru sürüklemeye başladık. Ot ve papatya denizinde yol aldık."
 fund_inspiration.6501.a:0 "Umarım geri dönersin ve kayıplarını azaltırsın."
 fund_inspiration.6501.b:0 "Tekne yolculuktan zar zor kurtuldu."
 fund_inspiration.6501.b.success:0 "Maceracı tekneyi uçurumdan yukarı sürüklüyor"
 fund_inspiration.6501.b.failure:0 "Maceracı mahsur kalıyor ve kırık tekneyi tamir ediyor"
 fund_inspiration.6501.c:0 "Yerliler halinize acıyor ve size ucuza yeni bir tekne veriyor."
 fund_inspiration.6502.t:0 "$fund_inspiration.title$ Yakıcı Susuzluk"
 fund_inspiration.6502.desc:0 "\n\n'Çölde değilim, bir rüyalar ülkesindeyim. Uyanıklık ve uyku arasındaki fark ortadan kalktı. Rehberim sanrılarında gördüğün şey, en çok arzuladığındır diyor. Bir cennet, kenarı hazinelerle bezenmiş elmas gibi parıldayan bir su havuzu.\n\n'Bunun yerine [ROOT.Char.Custom('FormOfAddressForLiege')|l], tek gördüğüm sizsiniz. Her seferinde bir kum tepesi ileride. Devam etmem için beni çağırıyorsunuz. Ve o seraba doğru attığım her adımın, beni gerçek sizden bir adım daha uzaklaştırdığını bilmek parçalıyor.'"
 fund_inspiration.6502.a:0 "Ah, çölde olmamama rağmen kendimi susamış hissettim."
 fund_inspiration.6502.b:0 "Büyük bir ödül getirirsen dikkatimi çekersin."
 fund_inspiration.6502.c:0 "Başına sıcak geçmiş olmalı."

 fund_inspiration.6503.t:0 "$fund_inspiration.title$ Pontus Fısıltıları"

 fund_inspiration.6503.desc:0 "\n\n'İskitlerden kalma eski bir Kurgan'ı araştırdım. Uzun zaman önce telef olmuş yüzlerce at, içi doldurulmuş, korunmuş ve dik durmak için duvarlara kazıklanmış, her birinin kendi odası var. Zamana yenik düşen lanetliler için bir ahır.\n\n'Krallığımız için bilgi arama görevimi biliyorum. Bu yüzden size getirmek için rehberim izlemezken mezardan bir kalıntı çalmayı düşündüm."
 fund_inspiration.6503.a:0 "Süslerden birini cebine atıyorsunuz."
 fund_inspiration.6503.b:0 "Çalışmamız için atların eyerlerinden birini getiriyorsunuz."
 fund_inspiration.6503.c:0 "Ölüleri rahatsız etmeye cesaret edemiyorsunuz."
 fund_inspiration.6504.t:0 "$fund_inspiration.title$ [inspiration_owner.GetLadyLord|U] [inspiration_owner.GetFirstNameNoTooltip] ve Sevgilisi"
 fund_inspiration.6504.desc:0 "\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U], seyahatlerim sırasında [adventurer_lover.GetTitledFirstName] ile bir çiftlikte kaldım."
 fund_inspiration.6504.pregnant:0 "\n\n'O çiftlikte güzel bir eser yarattım! Yani, bir çocuk! Bu her ne kadar istenmeyen bir misafir olsa da, bu durumdayken [adventurer_lover.GetTitledFirstName] benimle seyahatlerine devam edemezdi. Kendisinin çok az varlığı var ve umarım sarayda ona göz kulak olabiliriz.'"
 fund_inspiration.6504.female_lover:0 "\n\n'Yolda tek başıma geçirdiğim onca ayın ardından fantastik bir canlıymış gibi kalbimi pır pır ettiriyor. Belki de benim görevim onu bulmaktı."
 fund_inspiration.6504.male_lover_homosexual:0 "\n\n'Saraydaki gözlerden uzak, gecelerce bir adamın kollarında yatabildim."
 fund_inspiration.6504.male_lover:0 "\n\n'Ben ona aşığım. Saraydaki herhangi bir ziyafet sırasında o gübre küreklese bile ben onu izlerdim."
 fund_inspiration.6504.lover_ultimatum:0 "Onu bir daha asla öpemeyeceğimi biliyorum, bu çiftlikten ayrılamam. Ya saraya katılmasına izin verirsiniz ya da benim yolculuğum burada biter.'"
 fund_inspiration.6504.a:0 "Bana böyle saygısızlık edeceksen defol!"
 fund_inspiration.6504.a.tt:0 "[inspiration_owner.GetTitledFirstName] çiftlikte kalacak."
 fund_inspiration.6504.b:0 "İzin vereceğim ama rezalet çıkarsa benim suçum değil."
 fund_inspiration.6504.c:0 "Çocuk fakirliği hak etmiyor."
 fund_inspiration.6504.d:0 "KÖYLÜLER? BENİM SARAYIMDA? SANMAM."
 fund_inspiration.6505.t:0 "$fund_inspiration.title$ Sahil Bölümü"
 fund_inspiration.6505.desc:0 "\n\n'Çöl sıcağında nefes nefese kalmışken, görür görmez üzerimi çıkarıp içine atlamak istediğim tertemiz sular keşfettim. Rehberim gücenmek yerine sessizce kıkırdadı ve bir sayfaya vücudumu çizmeye başladı. Gezideki diğer dostlarımız beni serinletmek için palmiye yapraklarıyla yellemeye başladılar.\n\n'Etrafa su sıçratarak birkaç mutlu saat geçirdik. Bir sonraki köyde, cennetteki bu anı görebilmeniz için bir dokumacı tuttum ve bir kurye ile size bir hatırayı gönderiyorum.'"
 fund_inspiration.6505.a:0 "Gözlerim! Gözlerim!"
 fund_inspiration.6505.a_blind:0 "Zaten kör olmasaydım muhtemelen gözlerimi oyardım."
 fund_inspiration.6505.a_one_eyed:0 "Gözüm! Gözüm!"
 fund_inspiration.6505.b:0 "Bunu yatak odama asıyorum!"
 fund_inspiration.6505.c:0 "Bütün saray bu egzotik eğlenceyi öğrenecek!"
 fund_inspiration.6505.d:0 "Ahh, halkımız için kutsal bir görüntü!"
 fund_inspiration.6506.t:0 "$fund_inspiration.title$ Mantıksız Derecede Sefillik"
 fund_inspiration.6506.introduction:0 "Maceracımdan bir mektup geldi. O kadar çamurlu ki, bıçakla kesip açmam gerekiyor.\n\n"
 fund_inspiration.6506.desc:1 "'Efendim, sulak bir bataklığın içindeyim ve bunca yıllık eğitimim beni buna hazırlamadı. Gece gündüz cıvık çamurların içinden yürüyorum. Dün gece rüyamda sevgilimi gördüm ve uyandığımda dudaklarımda sevgilimin dudağı yerine semender vardı.\n\n'Daha #EMP medeni#! bir yere gitme imkânımın olup olmadığını merak ediyorum. Buranın ne kadar pis bir yer olduğunun bir göstergesi olarak, yumurtasını sırılsıklam çizmelerimin içine koymuş bir kurbağayı da mektubumla birlikte bir kavanozda gönderdim.'"
 fund_inspiration.6506.a:0 "Karakterini geliştirir!"
 fund_inspiration.6506.b:0 "Elbette daha gelişmiş topraklara gidebilirsin."
 fund_inspiration.6507.t:0 "$fund_inspiration.title$ Arılar Olmasın!"
 fund_inspiration.6507.introduction:1 "Maceracımdan bir mektup geldi. Satılardaki mürekkep kanla karışmış."
 fund_inspiration.6507.desc:0 "\n\n'Gezdiğim ovalar ve çayırlar muhteşem bir şekilde vahşi yaşamla dolu. Atımdan inip bir çiçeği koklamak için eğildiğimde, üzerime [grumpy_liege.GetTitledFirstName] diye birisinin gölgesi düştü. Bu kişi sizin egemenliğinizi tanımıyor ve bu toprakların efendisi olduğunu iddia ediyor.\n\n'"[ROOT.Char.GetTitledFirstNameNoTooltip] ve onun köpekleri benim çayırlarımda gezemeyecek." diye bağırarak muhafızlarına beni yakalamalarını emretti. İçinde arı kovanı olan bir kutu çıkardılar ve kafamı içine daldırdılar! Arılar her yerimi #EMP soktu#!! Gözümde bir iğne hâlâ duruyor!'"
 fund_inspiration.6507.a:0 "Ona bir kınama mektubu yazacağım!"
 fund_inspiration.6507.b:0 "Onun kellesini alacağım!"
 fund_inspiration.6507.c:0 "Yara izlerin oldukça çekici görünecek!"
 fund_inspiration.6508.t:0 "$fund_inspiration.title$ Doğanın Mühendisleri"
 fund_inspiration.6508.introduction:0 "Maceracımdan bir mektup geldi. Kendisi bir süredir tayga ormanlarındaydı.\n\n"
 fund_inspiration.6508.desc:0 "'Bir inşaat ustasının isteyebileceği en iyi arkadaşla vakit geçirdim. Bir kunduz kolonisi ile! Bu kuryec ile size kunduzların sularda balık tutmak için kullandıkları yapıların eskizlerini içeren bir kitap gönderiyorum! Yarı suda yaşayan bir kemirgen olmak ne büyük mutluluk!'\n\n"
 fund_inspiration.6508.architect_desc:0 "'En azından [court_architect.GetTitledFirstName], kendisinden daha zeki hayvanlardan bir iki şey öğrenebilir.'"
 fund_inspiration.6508.a: "Bu kitap üzerinde iyice çalışacağım."
 fund_inspiration.6508.b:0 "Gerçekten de [court_architect.GetTitledFirstNameNoTooltip] bu kitaptan bir şeyler çıkarabilir."
 fund_inspiration.6508.b.tt:0 "[court_architect.GetTitledFirstNamePossessive] mimarlık yeteneği biraz artıyor"
 fund_inspiration.6508.c:1 "Ne #EMP sevimli#! hayvanlar! [child.GetFirstNameNoTooltip] bu kitabı okumalı!"
 fund_inspiration.6508.d:0 "Güzel iş, seyahatlerini uzatman için para göndereceğim."
 fund_inspiration.6509.t:0 "$fund_inspiration.title$ Bir Canavarın Fısıltıları"
 fund_inspiration.6509.intro_desc:0 "Bir sal üzerinde taşkın yataklarında sürüklenen maceracımdan bir mektup geldi."
 fund_inspiration.6509.desc:0 "\n\n'Efendim, seyahatlerimiz sırasında o kadar korkunç bir yaratık tarafından gafil avlandık ki, bunu yazmaktan neredeyse utanıyorum.\n\n'On insan boyunda bir timsah, katırlarımızdan birini tek lokmada midesine indirdi. Ok şeklinde gövdesi, uzun bir ağzı ve çıngıraklı kuyruğu olan ince bir canavardı. Derisindeki kabartılar ve pullar, dokunanı zehirliyor.'"
 fund_inspiration.6509.a:0 "Bu canavarın gobleni ile ziyaretçileri etkileyeceğiz!"
 fund_inspiration.6509.b:0 "Gerçek olamayacak kadar korkunç!"
 fund_inspiration.6509.c:0 "Timsahın ne olduğunu biliyorum ahmak!"
 fund_inspiration.6510.t:0 "$fund_inspiration.title$ Salaklar Prensi"
 fund_inspiration.6510.intro_desc:0 "Ormanlarda dolaşan maceracımdan bir mektup geldi."
 fund_inspiration.6510.desc:1 "\n\n'Özür dilerim [ROOT.Char.Custom('FormOfAddressForLiege')|l] ama ormanda sizin gibileri soyan kanunsuz bir çeteyle karşılaştım. Yerel bir tiran olan [enemy_liege.GetTitledFirstName] ve onun hükmüne karşı çıkıyorlar. Soyluları pusuya düşürerek ne bulabilirlerse çalıyorlar. Bu çete hoşuma gitti ve saraya geri döneceğimi sanmıyorum.\n\n'Taytları da sarayınızım modasından çok daha iyi ve bana daha çok yakışıyor.'"
 fund_inspiration.6510.a:0 "Belki de fakirler için daha fazlasını yapmama yardım edebilirsin?"
 fund_inspiration.6510.b:0 "Eğer geri dönmezsen, peşinden bir suikastçı göndereceğim!"
 fund_inspiration.6510.b.toast_outcome.positive:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] korkutuldu"
 fund_inspiration.6510.b.toast_outcome.positive.continue:0 "Macera devam ediyor"
 fund_inspiration.6510.b.toast_outcome.positive.flee:0 "Sarayınızdan kaçıyor"
 fund_inspiration.6510.b.toast_outcome.refusal:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] etkilenmedi"
 fund_inspiration.6510.c:0 "Sefil hayatının tadını çıkar!"
 fund_inspiration.6511.t:0 "$fund_inspiration.title$ Kar Denizindeki Gezgin"
 fund_inspiration.6511.intro_desc:0 "Maceracımdan bir mektup geldi ve ilk birkaç satırı okuduktan sonra anlıyorum ki bu son mektubu olacak."
 fund_inspiration.6511.old_age:0 "\n\n'Bu yaşıma gelene kadar pek çok mucizeye tanık oldum. Şimdi bu sözleri karlı bir dağın zirvesinden yazıyorum. Biliyorum ki şu an bu sis denizinde yaşayan tek canlı benim ve hayatımın geri kalanında böyle bir güzelliği bir daha asla göremeyeceğim.\n\n'Dağdan inmeyi düşünmedim ve muhtemelen sen bu satırları okurken bedenim buzla bir olmuştur. Ağlama, çünkü başka türlüsü olamazdı. [inspiration_owner.GetFaith.PositiveAfterLife|U] beni bekliyor ve bir buzul gibi yavaş ama emince ilerliyorum.'"
 fund_inspiration.6511.poor_health:0 "\n\n'Sağlığım ve vücudum bana ihanet ettiği için şimdi sefil, çarpık bir hâldeyim. Böyle bir hâldeyken bu karla kaplı krallığı, bu bulutları ve sis denizini bir dağın tepesinden görebileceğim hiç aklıma gelmemişti. Solan bir çiçek böyle bir güzelliği hak etmiyor.'\n\n'Her an ölüme kavuşabileceğimi bilerek, kendimi buzların üzerine bırakmaya karar verdim. Belki de soğuk, beni bozulmamış bir hâlde koruyacaktır."
 fund_inspiration.6511.winter:0 "\n\n'Dağların en acımasız olduğu zamanda bir dağın tepesindeydim. Donmuş yanağıma konan her kar tanesi, kışın kahkahasıydı. Savaş nasıl bir şeydir bilirim ancak kendi vücudumdaki kanla savaşmak kadar sert bir savaş hiç görmedim. Baskın elim bu mektubu yazacak kadar iyi hâlde ancak diğer elim için aynısı söylenemez.\n\n'Bilmenizi isterim ki, pek çok insandan iyi bir hayat yaşadım ve dünyayı deneyimlediğim için mutluyum.'"
 fund_inspiration.6511.a:0 "Bu, tehlikenin şimdiye kadarki en romantik tanımı!"
 fund_inspiration.6512.t:0 "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip|U] Dağı"
 fund_inspiration.6512.intro_desc:0 "Maceracımdan bir mektup aldım. Mektubun üzeri, dağlık çöllerdeki yolculuğundan gelen kırmızı tozla kaplı."
 fund_inspiration.6512.desc:1 "\n\n'Bir dağın zirvesine daha ulaştım ve başka bir insanın bu kayaya daha önce ayak bastığına dair hiçbir işaret görmedim. Bugün, şu ana kadar tırmandığım en yüksek dağa tırmanmaya cesaret ettim.\n\n'Bence bu dağ, evrendeki en iyi [ROOT.Char.GetTitleAsNameNoTooltip] tarafından desteklenen bu maceranın başarısını anmak için değerli bir ismi hak ediyor.'"
 fund_inspiration.6512.a:0 "Eminim ki yerliler bu dağa çoktan bir isim vermiştir."
 fund_inspiration.6512.b:0 "'Kaya' olsun!"
 fund_inspiration.6512.c:0 "'[ROOT.Char.GetFaith.WarGodNamePossessive] Kılıcı'"
 fund_inspiration.6512.d:0 "'[ROOT.Char.GetFaith.FateGodNamePossessive] Eli'"
 fund_inspiration.6512.e:0 "Sevgilimin adı olsun, [lover.GetFirstNameNoTooltip]."
 fund_inspiration.6512.f:0 "Kral Dişi!"
 fund_inspiration.6512.g:0 "Kraliyet Sopası!"
 fund_inspiration.6512.h:0 "Düşmanların Felaketi!"
 fund_inspiration.6512.i:0 "Boş ver. Bana biraz taş getir!"
 fund_inspiration.7001.t:0 "$fund_inspiration.title$ Unutulmayacak İsim"
 fund_inspiration.7001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], düşünceli bir görüntüyle bana yaklaşıyor. "Sizin için özel birisi var mı, [ROOT.Char.Custom('FormOfAddressForLiege')|l]?"\n\nSorduğu sorunun saçmalığına sinirlendiğimi yüzümden anlamış olacak ki: "Yani demek istiyorum ki yaptırmak istediğiniz eseri adamak istediğiniz birisi var mı? Bayağı güzel bir şey ortaya çıkıyor fakat anlamlı bir ibare daha da kişisel olmasını sağlar!""
 fund_inspiration.7001.a:1 "Sevgili [dedication_a.GetFirstNameNoTooltip] adına olsun!"
 fund_inspiration.7001.b:1 "[dedication_b.GetFirstNameNoTooltip] anısına olsun..."
 fund_inspiration.7001.c:0 "Benim için özel olan tek bir şey var, o da [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 fund_inspiration.7001.d:0 "Birine adamamıza gerek yok."
 artifact_dedication_inscribed_a:0 "[newly_created_artifact.GetDesc]\n\nYanındaki ufak ama şık bir ibarede yazıyor ki "Sevgili, [dedication_a.GetFirstName] Adına"."
 artifact_dedication_written_a:0 "[newly_created_artifact.GetDesc]\n\nİlk sayfasındaki ufak ama şık bir ibarede yazıyor ki "Sevgili, [dedication_a.GetFirstName] Adına"."
 artifact_dedication_woven_a:0 "[newly_created_artifact.GetDesc]\n\nAna sahnenin altına dokunan ufak ama şık bir ibarede yazıyor ki "Sevgili, [dedication_a.GetFirstName] Adına"."
 artifact_dedication_inscribed_b:0 "[newly_created_artifact.GetDesc]\n\nYanındaki ufak ama şık bir ibarede yazıyor ki "[dedication_b.GetFirstName] Anısına"."
 artifact_dedication_written_b:0 "[newly_created_artifact.GetDesc]\n\nİlk sayfasındaki ufak ama şık bir ibarede yazıyor ki "[dedication_b.GetFirstName] Anısına"."
