 fund_inspiration.1001.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me with a wide grin. "I have toiled many days and nights, and finally my work is done!"\n\n[inspiration_owner.GetSheHe|U] presents me with an object wrapped in cloth, and as I unveil what is hidden within my eyes grow wide.\n\n"
