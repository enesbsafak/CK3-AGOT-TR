 fund_inspiration.7003.t:0 "$fund_inspiration.title$ Etkilenecek Kişi"
 fund_inspiration.7003.desc:0 "Son zamanlardaki etkileme girişimlerim başarısız oldu..."
 fund_inspiration.7003.desc_e:0 "[dedication_e.GetTitledFirstName] ile olan dostluğum diken üstünde."
 fund_inspiration.7003.desc_f:0 "[dedication_f.GetTitledFirstName|U], hâlâ beni reddediyor."
 fund_inspiration.7003.desc_end:0 "Her şey kötü gidiyor olabilir.\n\nFakat harika bir fikrim var. [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U], yaptığı şahesere özel bir ibare eklesin diye haber göndereceğim! Kimin adını yazdırırsam gururlanacak ve cömertliğim karşısında oldukça duygulanacak, bunun sonucunda ise beni sevmekten başka seçeneği olmayacak!"
 fund_inspiration.7003.a:0 "[dedication_e.GetFirstNameNoTooltip] adına!"
 fund_inspiration.7003.b:0 "[dedication_f.GetFirstNameNoTooltip] adına!"
 fund_inspiration.7003.c:0 "Etkilemek istediğim kişiler için başka yollar bulacağım."
