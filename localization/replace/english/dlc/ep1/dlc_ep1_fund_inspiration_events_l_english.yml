 fund_inspiration.9005.desc_intro:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('inherited_insp_owner'))|U] [inherited_insp_owner.GetTitledFirstName], verasetin karmaşası sırasında benimle konuşmak istiyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [old_ruler.GetTitledFirstNameRegnal], vefatından önce çalışmalarımı desteklemişti, onun için [inherited_insp_owner.Custom('InspirationTypeDescription')] iken ölümüyle çalışmalarım yarıda kaldı." \n\n"
