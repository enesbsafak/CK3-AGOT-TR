### TODO AGOT-ONLY: fund_inspiration.1032.desc [AGOT: ]
 fund_inspiration.1032.desc:0 ""My [ROOT.Char.Custom('LoverPetName')], I have a surprise for you!"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] presents me with a beautiful book, and as I leaf through it I can scarcely believe my eyes. [inspiration_sponsor.GetSheHe|U] commissioned a book about #EMP us#!!\n\n"The bindings pale in the face of your beauty, and the content is nothing compared to your company, but these pages hold the essence of my love for you.""
 fund_inspiration.1032.a:0 "[inspiration_sponsor.Custom('LoverPetName')|U]!"
### TODO AGOT-ONLY: fund_inspiration.1033.desc [AGOT: ]
 fund_inspiration.1033.desc:0 ""I have a surprise for you!"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] presents me with a beautiful book, but as I leaf through it I can scarcely believe my eyes. [inspiration_sponsor.GetSheHe|U] commissioned a book for the sole purpose of defaming #EMP me#!!\n\n"While no words on this earth can convey the contempt I feel for you, and no illustration can accurately portray the blight that is your face, I made an attempt. The whole world will read this and know how vile you are.""
 fund_inspiration.1033.a:0 "Vay [inspiration_sponsor.Custom2('InsultNoun', ROOT.Char)]!"
 fund_inspiration.1033.a_proud:0 "En azından beni #EMP tanıyacaklar#!!"
### TODO AGOT-ONLY: fund_inspiration.1041.desc [AGOT: ]
 fund_inspiration.1041.desc:0 ""In here, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gestures to the door of [inspiration_owner.GetHerHis] weavery, where [inspiration_owner.GetSheHe] has been toiling for months on my commission. Stepping through the doorway, I gasp as I gaze upon the work hanging in front of me.\n\n"
### TODO AGOT-ONLY: fund_inspiration.1051.desc [AGOT: ]
 fund_inspiration.1051.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly holds up a package securely wrapped in cloth.\n\n"I return from [inspiration_owner.Custom('InspirationAdventureDestination')] with an artifact from my journey!"\n\nI take the bulky bundle into my hands and loosen the cords before peeling layer after layer of fabric. Inside"
### TODO AGOT-ONLY: fund_inspiration.1051_throne.desc [AGOT: ]
 fund_inspiration.1051_throne.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly leads a great procession up to your throne. Behind [inspiration_owner.GetHerHim] a cart is being rolled into your audience hall.\n\n"I return from [inspiration_owner.Custom('InspirationAdventureDestination')] with a great symbol of royal virtue!"\n\nAs the cart comes nearer I realize that it carries a throne."
### TODO AGOT-ONLY: fund_inspiration.1051_ark_covenant.desc [AGOT: ]
 fund_inspiration.1051_ark_covenant.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly leads a great procession up to your throne. Behind [inspiration_owner.GetHerHim] a number of helpers are carrying what looks to be an enormous box.\n\n"I return from [inspiration_owner.Custom('InspirationAdventureDestination')] with a prize from my journey!"\n\nI walk up to the giant box, as one of the helpers break away the boards that hide its' treasure. Inside"
### TODO AGOT-ONLY: fund_inspiration.1051_cupboard.desc [AGOT: ]
 fund_inspiration.1051_cupboard.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly points to a piece of furniture being carried by two helpers.\n\n"I return with an artifact from my journey!"\n\nI walk up to the artifact, inspecting what my [inspiration_owner.GetWomanMan] has brought me from [inspiration_owner.Custom('InspirationAdventureDestination')]."
 fund_inspiration.1051.desc.skull:1 "[newly_created_artifact.GetFeatureText( 'animal_skull_type' )] kafatası var. [inspiration_owner.GetFirstNameNoTooltip], benimle detayları paylaşıyor ve bu devasa yaratığı nasıl alt ettiğini anlatıyor."
 fund_inspiration.1051.desc.goblet:0 "bir kadeh var. [inspiration_owner.GetFirstNameNoTooltip], bunu nereden buldun diyorum ve bana bir yabancıyla girdiği tüyleri diken diken eden iddiadan bahsediyor. İddianın kaybedeninin zehir içmesiyle son bulmuş."
 fund_inspiration.1051.desc.box:0 "bir kutu var. Yerel bir zanaatkâr bunu [inspiration_owner.GetFirstNameNoTooltip], onu bir grup vahşi hayvandan kurtardıktan sonra vermiş. Bana hayvanları nasıl kandırıp öldürdüğünü anlatıyor."
 fund_inspiration.1051.desc.hide:1 "[newly_created_artifact.GetFeatureText( 'animal_hide_type' )] derisi var. [inspiration_owner.GetFirstNameNoTooltip], ben getirdiği muazzam deriyi incelerken vahşi hayvanları nasıl katlettiğini analtıyor."
 fund_inspiration.1051.desc.tapestry:0 "bir dokuma var. [inspiration_owner.GetFirstNameNoTooltip], göğsünü kabartarak yolculuğu sırasında ona eşlik eden usta bir dokumacıdan bahsediyor. Birlikte geçirdikleri macera dokumanın üstündeki motifleri esinlendirmiş."
 fund_inspiration.1051.desc.epic:0 "daha önce gördüğüm hiçbir şeye benzemeyen bir eser var.\n\n[inspiration_owner.GetFirstNameNoTooltip], gururlu bir şekilde gülümsüyor: "[epic.GetDesc]""
 fund_inspiration.1051.desc.epic.ark:0 "büyük taş bir sandık, içinde ise birkaç taş tablet var\n\n[inspiration_owner.GetFirstNameNoTooltip], gururlu bir şekilde diyor ki: "Ahit Sandığı! İçerisinde ise İsrailoğullarına Musa'nın verdiği taş tabletler var."\n\n[inspiration_owner.GetFirstNameNoTooltip], saraya [inspiration_owner.Custom('InspirationAdventureDestination')] diyarlarında geçirdiği macerayı anlatmaya kaldığı yerden devam ediyor. Anlattığı hikâye karanlık emelleri olan hasımlar ve ziyaret edilen ilginç mekanlar içeriyor."
 fund_inspiration.1051.desc.epic.throne:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip], gururla gösteriyor: "[epic.GetDesc]""
 fund_inspiration.1051.desc.epic.cupboard:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip], yüzünde büyük bir gülümseme ile: "[epic.GetDesc]""
 fund_inspiration.1051.desc.regalia:0 "krallara layık takılar var.\n\n[inspiration_owner.GetFirstNameNoTooltip], gülümsüyor ve nasıl [inspiration_owner.GetCurrentLocation.GetNameNoTooltip] diyarındaki yerel bir hükümdarın minnettarlığını kazandığını uzun uzadıya anlatıyor ve hükümdarın efendisine götürmesi için takdim ettiği [newly_created_artifact.GetName] ile sona eriyor."
 fund_inspiration.1051.desc.regalia_2:0 "krallara layık takılar var.\n\n[inspiration_owner.GetFirstNameNoTooltip], gururlu bir şekilde gülümsüyor ve bu hediyeyi uzak diyarlardan sarayımın görkemini duyan bir hükümdarın gönderdiğini söylüyor."
 fund_inspiration.1051.desc.armor:0 "zırh takımı var.\n\n[inspiration_owner.GetFirstNameNoTooltip], saraya bu zırh takımını nasıl elde ettiğini ve bu zırhı bana takdim ettiğini anlatıyor."
 fund_inspiration.1051.desc.weapon:0 "bir [newly_created_artifact.GetName] var.\n\n[inspiration_owner.GetFirstNameNoTooltip], bu silahı nasıl elde ettiğini anlatıyor. Anlattığı hikâye oldukça inişli ve çıkışlı, bazı kısımlarına ise inanmak güç."
 fund_inspiration.1051.desc.necklace:0 "bir kolye var.\n\n[inspiration_owner.GetFirstNameNoTooltip], bu ödülü size takdim etmekten hoşnut fakat nasıl elde ettiğini anlatma konusunda çekingen gözüküyor."
 fund_inspiration.1051.a:0 "Muhteşem!"
 fund_inspiration.1051.b:0 "'İşinin ehli' insanlar tarafından bakılmalı"
### TODO AGOT-ONLY: fund_inspiration.1061.desc_floor_bound_artifact [AGOT: ]
 fund_inspiration.1061.desc_floor_bound_artifact:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gestures me over to an object covered in fabric with a wide grin on [inspiration_owner.GetHerHis] face. "I have toiled many days and nights, and finally my work is done!"\n\n[inspiration_owner.GetSheHe|U] whips the covering off and my eyes grow wide as I see what's hidden beneath.\n\n"
### TODO AGOT-ONLY: fund_inspiration.1061.desc [AGOT: ]
 fund_inspiration.1061.desc:0 ""Over here, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] waves me over with a wide grin. "I have toiled many days and nights, and finally my work is done!"\n\n[inspiration_owner.GetSheHe|U] presents me with an object wrapped in cloth, and as I lift the fabric my eyes grow wide.\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.desc_opening [AGOT: ]
 fund_inspiration.1081.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gesture me over to [inspiration_owner.GetHerHis] cluttered desk with a huge grin on [inspiration_owner.GetHerHis] face."
### TODO AGOT-ONLY: fund_inspiration.1081.immortality_fail_desc_opening [AGOT: ]
 fund_inspiration.1081.immortality_fail_desc_opening:0 ""I know I said I could discover a way to prolong life indefinitely, but sadly that was not meant to be."
 fund_inspiration.1081.immortality_fail_desc_young:0 ""Lakin yaşlanmanızı engelleyecek bir iksir üretmeyi başardım! En azından bir nebze. Lütfen, tadına bakın ya da en azından çalışmamın meyvesini inceleyin."\n\n"
 fund_inspiration.1081.immortality_fail_desc_old:0 ""Lakin eski kuvvetinizi bir nebze geri getirecek bir iksir üretmeyi başardım! Lütfen, tadına bakın ya da en azından çalışmamın meyvesini inceleyin."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.elixir_desc_desc_young [AGOT: ]
 fund_inspiration.1081.elixir_desc_desc_young:0 ""My experiments have borne fruit. Behold, an elixir that will prevent aging! To some extent. Please, have a look, and perhaps even a taste."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.elixir_desc_desc_old [AGOT: ]
 fund_inspiration.1081.elixir_desc_desc_old:0 ""My experiments have borne fruit. Behold, an elixir that will return some of your lost vigor! Please, have a look, and perhaps even a taste."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.panacea_desc [AGOT: ]
 fund_inspiration.1081.panacea_desc:0 ""It's a panacea based on the established tradition of theriac, containing myrrh, saffron, opium, viper's flesh, and a number of other ingredients. It has proven itself most efficient for centuries, and I have perfected it even more! Have a look."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.metals_philosophers_stone_desc [AGOT: ]
 fund_inspiration.1081.metals_philosophers_stone_desc:0 ""I have done it! I have created the philosopher's stone! This is my Magnum Opus, my golden legacy. Please, behold!"\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.metals_mercury_desc [AGOT: ]
 fund_inspiration.1081.metals_mercury_desc:0 ""I heated a mix of quicksilver with sulfur in a flask which caused it to vaporize and recondense at the top of the flask. When I then broke the flask and ground the resulting compound I had created vermilion, bright red and vibrant! Here, I have recorded my findings."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.metals_arsenic_desc [AGOT: ]
 fund_inspiration.1081.metals_arsenic_desc:0 ""I heated some arsenic ore, which produced a white powder that is solvable in water. I am positive that it is fatal when ingested, but it will leave no trace of taste or smell! Here, I have recorded my findings."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.metals_gold_desc [AGOT: ]
 fund_inspiration.1081.metals_gold_desc:0 ""I have created gold! As great minds before me had theorized it was a lack of moisture and heat that was the fault with lead."\n\nWhen I ask to observe the process [inspiration_owner.GetSheHe] insists that the small piece of gold on the table speaks for itself. "But of course I have recorded my findings, have a look."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.metals_silver_desc [AGOT: ]
 fund_inspiration.1081.metals_silver_desc:0 ""I have created silver! As great minds before me had theorized silver is born from heating copper and other base metals until they turn white."\n\nWhen I ask to observe the process [inspiration_owner.GetSheHe] insists that the small piece of silver on the table speaks for itself. "But of course I have recorded my findings, have a look."\n\n"
### TODO AGOT-ONLY: fund_inspiration.1081.metals_fallback_desc [AGOT: ]
 fund_inspiration.1081.metals_fallback_desc:0 ""I have gathered all my insights into base metals and knowledge about transmutations into this tome. Here, have a look."\n\n"
 fund_inspiration.1081.a_elixirs:0 "Hemen tadına bakayım!"
 fund_inspiration.1081.a:0 "Büyüleyici!"
### TODO AGOT-ONLY: fund_inspiration.1091.desc [AGOT: ]
 fund_inspiration.1091.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me with a satisfied smile drawn across [inspiration_owner.GetHerHis] face. "I have toiled over the workbench many days and nights, but finally my work is done!"\n\n[inspiration_owner.GetSheHe|U] presents me with an object wrapped in cloth, and as I unveil what is hidden within my eyes grow wide.\n\n"
 fund_inspiration.1091.a: "İnce işçilik! Çok iyi!"
