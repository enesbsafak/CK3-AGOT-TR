l_english:
 fp3_clan.8000.t: "Birlik Karşıtı Tefecilik"
 fp3_clan.8000.desc: "[concerned_one.GetName] endişeli görünen bir hâlde bana yaklaşıyor. "Duyduğuma göre [usurer.GetTitledFirstName], mali sıkıntı içerisindeki saray mensuplarına fahiş bir faiz oranıyla borç vererek onların bu durumundan faydalanıyormuş. Herkes onun bir tefeci olduğunu ve yaptıklarının karşılığını görmesi gerektiğini söylüyor."\n\nSuçların muhatabı olan [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('usurer'))] ile yüzleştiğimde bu iddialara şiddetle karşı çıkıyor. "Bu çok çirkin bir iftira! Bazı arkadaşlarımın benden maddi yardım istedikleri kısmı doğru ama kötü bir niyet taşımadığım gibi hakkım olandan fazlasını da onlardan istemiş değilim.\n\n[concerned_one.GetTitledFirstNameNoTooltip] bile bana borçlu. Bu meseleye burnunu sokmasının sebebi de bu.""
 fp3_clan.8000.a: "Zindanda geçireceğin vakitlerde belki yöntemlerini gözden geçirirsin [usurer.GetFirstName]."
 fp3_clan.8000.b: "Haksız kazancından pay verirsen bu konuyu unutabiliriz."
 fp3_clan.8000.c: "Kendi aranızda çözmeniz gereken bir mesele gibi duruyor."
 fp3_relations_reaction_to_imprisonment.tt: "[usurer.GetTitledFirstNameNoTooltip] ile iyi ilişkilere sahip klan üyeleri ve vasallar bu durumu olumsuz karşılayacak."
 fp3_clan.8001.t: "Aşiret Anlaşmazlığı"
 fp3_clan.8001_beginning: "[bickerer_1.GetTitledFirstName] ve [bickerer_2.GetTitledFirstName] şahsi bir tören esnasında bir tartışmaya giriştiler ve her ikisi de kendi taraflarında tartışmaya dâhil olmam konusunda ısrar ediyorlar."
 fp3_clan.8001_faith_schism: "Anlaşmazlıkları, [bickerer_1.GetFaith.PantheonTerm] doğası hakkında alevlenen bir tartışmadan başlamışa benziyor.\n\n"[bickerer_2.GetFirstNameNoTooltip], [bickerer_1.GetFirstNameNoTooltip] #EMP son derece#! radikal fikirleri savunuyor", iddiasında bulunuyor. "Yerinizde olsam onu derhâl saraydan kovdururdum!"\n\n"[bickerer_2.GetFirstNameNoTooltip] ve öne sürdüğü sözde argümanların korkunç detaylarını size anlatmaya değer görmüyorum", [bickerer_1.GetFirstNameNoTooltip] karşı çıkıyor, "ama inanın bana bu tartışmada kutsallara dil uzatan kişi #EMP ben#! değilim...""
 fp3_clan.8001_generic_fallback: "Tam olarak ne yaşandığı belli olmasa da her ikisinin de bir diğeri hakkında ne düşündüklerini söylemeye istekli oldukları açık.\n\n"[bickerer_2.GetFirstNameNoTooltip] soysuz bir [Select_CString(bickerer_2.IsFemale,'kadın','hödük')], açık ve net", [bickerer_1.GetFirstNameNoTooltip] karşı çıkıyor.\n\n"Kes sesini [bickerer_1.Custom2('InsultNoun', SCOPE.sC('bickerer_2'))]", [bickerer_2.GetFirstNameNoTooltip] karşılık olarak homurdanıyor.\n\nBu noktada aralarını bulmaya çalışmak gereksiz bir uğraş gibi dursa da hiçbir şey yapılmaması hâlinde işler daha da kötüye gidebilir."
 fp3_clan.8001.a: "Herkesin iyiliği için bu meseleyi geride bırakmanın vakti geldi."
 fp3_clan.8001.b: "[bickerer_1.GetFirstNameNoTooltip] aslında bazı mantıklı noktalara değindi..."
 fp3_clan.8001.c: "Yapacak önemli bir işim var... şeyde."
 fp3_clan.8001.d: "Beni bu işe karıştırmayın."
 fp3_clan_making_conflict_worse_flavor: "[bickerer_1.GetFirstNameNoTooltip] ve [bickerer_2.GetFirstNameNoTooltip] arasındaki ihtilafı daha da kızıştırmaya çalışıyorsunuz."
 fp3_clan.8001.b.success: "Manipülasyonunuza kanıyorlar"
 fp3_clan.8001.b.failure: "Aldatmacanızı fark ediyorlar"
 fp3_clan.8001.b.success.tt: "Aşirette bir ihtilafa sebep oldunuz"
 fp3_clan.8001.b.failure.tt: "Anlaşmazlık tohumları ekmeyi başaramadınız"
 fp3_clan.8001.a.success: "Bu ihtilafı başarıyla giderdiniz"
 fp3_clan.8001.a.success.tt: "Ara buluculuğunuz başarılı oldu"
 fp3_clan.8001.a.failure: "İşleri daha da kötü hâle getirdiniz"
 fp3_clan.8001.a.failure.tt: "Ara buluculuğunuz başarısız oldu"
 fp3_clan.8002.t: "İnanç Bağları"
### TODO AGOT-ONLY: fp3_clan.8002.desc [AGOT: ]
 fp3_clan.8002.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]", my [chaplain.GetCouncilTitle] [chaplain.GetFirstName] says apprehensively, "we must talk about spiritual matters." [chaplain.GetSheHe|U] pauses, to make sure we are alone.\n\n"I overheard [clan_member.GetName] gossip about how rarely you visit the [ROOT.Char.GetFaith.HouseOfWorship].\n\nNow, I would not deign to speculate as to your personal relationship with the divine, oh [ROOT.Char.GetTitleTierName]. But how pious you are #EMP perceived#! to be is paramount to those you rule.""
 fp3_clan.8002.a: "Belki de bocaladım ve görevimi ihmal ettim..."
 fp3_clan.8002.b: "Yerel [ROOT.Char.GetFaith.HouseOfWorship] için bir bağış ayrılacak."
 fp3_clan.8002.c: "Bırak bu ahmaklar umurumda olduğunu #EMP düşünsün#!..."
 fp3_clan.8002.d: "[clan_member.GetFirstNameNoTooltip] dedin değil mi? Onun dilini kopartacağım..."
 fp3_clan.8002.e: "Ne kadar inançlı olduğum konusunda yalan söylemeye gerek yok."
 fp3_pretending_to_be_pious_flavor: "[ROOT.Char.GetFaith.HouseOfWorship] içerisinde daha fazla vakit geçiriyorsunuz ya da insanların öyle düşünmesini sağlıyorsunuz."
 fp3_clan.8002.b.success: "Aldatmacanız başarılı oldu"
 fp3_clan.8002.b.failure: "Kimseyi inandıramadınız"
 fp3_clan.8002.b.success.tt: "Dindarlığınıza kimse laf edemez"
 fp3_clan.8002.b.failure.tt: "Sahte dindarlığınız ortaya çıktı"
 fp3_clan.8003.t: "Bir İsmin Gücü"
### TODO AGOT-ONLY: fp3_clan.8003_fear_opening [AGOT: ]
 fp3_clan.8003_fear_opening: ""[ROOT.Char.GetName], you have become great among [ROOT.Char.Custom('LevyMenWomen')], and your deeds and your name respected...and feared." [righteous_caliph.GetTitledFirstNamePossessive] envoy [hof_emissary.GetFirstName] pauses in trepidation.\n\n"
### TODO AGOT-ONLY: fp3_clan.8003_respect_opening [AGOT: ]
 fp3_clan.8003_respect_opening: ""[ROOT.Char.GetName], you have become great among [ROOT.Char.Custom('LevyMenWomen')], and your deeds and your house are respected and honored by all." [righteous_caliph.GetTitledFirstNamePossessive] envoy [hof_emissary.GetFirstName] pauses solemnly.\n\n"
### TODO AGOT-ONLY: fp3_clan.8003_ending [AGOT: ]
 fp3_clan.8003_ending: ""This was the words of the [righteous_caliph.GetTitleTierName]", [hof_emissary.GetSheHe] then declares, "and [righteous_caliph.GetSheHe] has decided to bestow upon you a great honor. Your name will be read during the weekly prayers, in [caliphal_location.GetName] itself. All the [righteous_caliph.GetTitleTierName] asks in return is that you do not forget [righteous_caliph.GetHerHis] benevolence in granting you this boon..."\n\n[hof_emissary.GetHerHis|U] voice trails away, as if to emphasize a hidden meaning in those words."
 fp3_clan.8003.a: "Bu bir onurdur."
 fp3_clan.8003.b: "Bir kez okunması yeterli olacaktır." 
 fp3_clan.8003.c: "Bunu hak etmiyorum."
 fp3_clan.8004.t: "Korku Bağları"
 fp3_clan.8004.desc: "[murder_enthusiast.Custom('GetCouncilOrCourtPosition')] [murder_enthusiast.GetFirstName] suratında endişeli bir ifade ile benimle özel bir görüşme gerçekleştirmek istiyor.\n\nNeredeyse fısıldar bir tonda: "Dinleyin [ROOT.Char.GetTitleTierName] hazretleri" diyor ve devam ediyor, "[clan_member.GetName] bir işler çeviriyor ve muhtemelen size karşı yine birtakım komplolar peşinde. Belki de bir uyarı olması için ona yakın birine karşı hamle yapmanın zamanı gelmiştir. Duyduğuma göre özel ilgi gösterdiği bir hizmetkârı varmış..."" 
 fp3_clan.8004.a: "Hamle yap ama temkinli ol."
 fp3_clan.8004.b: "Temkinli olmaya gerek yok, alenen öldür gitsin."
 fp3_clan.8004.c: "Hayır. Bir daha asla bu konuyu açma."
 fp3_clan.8004.a.success: "[clan_member.GetTitledFirstNameNoTooltip] karşısında yaptığınız hamle başarıyla gözdağı veriyor"
 fp3_clan.8004.a.success.tt: "Klanda korkulur hâle geldiniz"
 fp3_clan.8004.a.failure: "Entrikanız geri tepiyor" 
 fp3_clan.8004.a.failure.tt: "[clan_member.GetTitledFirstNameNoTooltip] etkilenmiyor"
 fp3_clan.8005.t: "Uygun Bir Pozisyon"
### TODO AGOT-ONLY: fp3_clan.8005.desc [AGOT: ]
 fp3_clan.8005.desc: ""It is not fair", [ambitious_consort.GetTitledFirstName] complains, finally giving voice to resentment that seems to have been pent-up for a long time.\n\n"[heir_child.GetFirstName], the spoiled [heir_child.Custom('GetDaughterSon')] of [heir_parent.GetTitledFirstName], will inherit the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], while my clever [empowered_child.Custom('GirlBoy')], [empowered_child.GetFirstName], will get almost nothing.\n\nI want you to grant [empowered_child.GetFirstNameNoTooltip] the [title_to_grant.GetName] at once so [empowered_child.GetSheHe] has a chance to prove [empowered_child.GetHerselfHimself] just as capable as [empowered_child.GetHerHis] peers."" 
 fp3_clan.8005.a: "#EMP Asla#!, duydun mu beni? Ayrıca sakın bir daha bu konuyu açma."
 fp3_clan.8005.b: "Saçma ama peki, öyle olsun..."
 fp3_clan.8005.d: "O bir unvana sahip olmak için çok genç!"
 fp3_clan.8005.e: "Sana söz veriyorum, zamanı gelince unvan alacak."
 original_heir_upset_flavor: "Eğer bunu yaparsanız unvanın şu anki vârisinin hoşuna gitmeyecek."
 fp3_clan.8005.e.success: "[ambitious_consort.GetFirstNameNoTooltip], sözlerinize güveniyor"
 fp3_clan.8005.e.success.tt: "[ambitious_consort.GetFirstNameNoTooltip], sözlerinizle yatışıyor"
 fp3_clan.8005.e.failure: "Sözlerinize ikna olmuyor"
 fp3_clan.8005.e.failure.tt: "[ambitious_consort.GetFirstNameNoTooltip], size güvenmiyor"
 fp3_empowered_child.tt: "Eğer [empowered_child.GetFirstNameNoTooltip] unvana sahip durumda kalmaya devam ederse birkaç yıl içerisinde mevcut [Concept( 'traits', 'Özelliklerine' )|E] bağlı olarak [Concept( 'skill', 'Becerilerinde' )|E] gelişim sağlayacak."
 fp3_8007_studies_pay_off_toast: "[empowered_child.GetFirstName] umut vadediyor"
 fp3_clan.8006.t: "Minik Casuslar"
 fp3_clan.8006.desc: "[paranoia_enthusiast.Custom('GetCouncilOrCourtPosition')] olan [paranoia_enthusiast.GetName] son zamanlarda [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('sneaky_child'))] [sneaky_child.GetFirstName] üzerine özel bir ilgi gösteriyor gibi gözüküyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.GetDynastyHouseNameNoTooltip] hanesi içerisindeki durum gittikçi gergin bir hâl alıyor. Akrabalarınız sürekli size karşı komplo kuruyor." diyerek [sneaky_child.GetFirstNameNoTooltip] adlı çocuğu öne çıkması için dürtüyor. \n\n"Ama ben fayda sağlamanız için yaşı küçük muhbirlerden oluşan bir ağ kuruyorum. Öyle ya minik casusların pek çok faydası vardır... Bu çocuklar halktan olsalar da küçük [sneaky_child.GetLadyLord] [sneaky_child.GetFirstNameNoTooltip] birtakım dikkat çekici kabiliyetlere sahip ve sizin işinize yarayabilir...""
 fp3_clan.8006.a: "Benim evladım zavallı bir casus değil bir asildir!"
 fp3_clan.8006.b: "Hadi bakalım ufaklık, hanemizdeki olası ihanetler için gözünü dört aç..."
 fp3_clan.8006.c: "Al şu parayı birkaç casus tut ama ailemden uzak dur."
 fp3_clan.8008.t: "Donuna Kadar Almak"
 fp3_clan.8008.desc: "Acımasız vergi tahsildarım [ambitious_tax_collector.GetName], son zamanlarda mum ışığında kapalı odalarda çok fazla zaman harcadı. Fakat karşıma geldiğine göre sonunda çalışmaları meyve vermeye başlayacak gibi duruyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], vasallarınız ödemeleri gereken miktarda vergi ödememek için binbir türlü bahane uydurup durmaktalar. Fakat ben de... #italic bahaneler#! üretebilirim..."\n\nEski püskü gözüken bir belge çıkartarak: "Bu senedin ortaya koyduğu verilere göre [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beleaguered_clan_member'))] [beleaguered_clan_member.GetTitledFirstName], size önceden düşündüğümüz miktardan çok daha fazla bir miktar borçlu. Hatta diğer tebaanız için de elimde bu şekilde belgeler var...""
 fp3_clan.8008.a: "Ne kadar çok, o kadar iyi!"
 fp3_clan.8008.b: "[beleaguered_clan_member.GetTitledFirstNameNoTooltip], odağımızın merkezinde olsun."
 fp3_clan.8008.c: "Açgözlülüğün hanemde ihtilafa sebep olmasına izin veremem."
 unlock_extortion.tt: "20 yıllığına [extort_subjects|E] [Concept( 'decision', 'Kararını' )|E] açar."
 fp3_clan.8009.t: "Halk Tarafından Sevilen"
### TODO AGOT-ONLY: fp3_clan.8009.desc [AGOT: ]
 fp3_clan.8009.desc: ""Furthermore, [corrupt_mayor.GetName] is quite a capable administrator, and popular with the people both in [corrupt_mayor.GetHerHis] own holding and all of [fawazil_county.GetNameNoTier]. However, [corrupt_mayor.GetSheHe] is in the habit of surreptitiously deducting significant amounts from the taxes [corrupt_mayor.GetSheHe] sends you, as we can clearly see in the top left column of the last year's income."\n\n[righteous_tax_collector.GetNamePossessive] extensive and exhaustive tax report ends with quite a revelation."
 fp3_clan.8009.a: "Benden mi çalıyormuş? Onu çarmıha gerdireceğim!"
 fp3_clan.8009.b: "Hukuk bizden yana, onu görevinden alacağım."
 fp3_clan.8009.c: "Aman, ağzımızın tadını kaçırmaya değmez."
 fp3_clan.8009.a.success: "[corrupt_mayor.GetFirstNamePossessiveNoTooltip] takipçileri korkarak size itaat ediyor"
 fp3_clan.8009.a.failure: "Halk korkmak yerine sinirleniyor"
 fp3_clan.8009.a.success.tt: "Zulmünüz meyvesini veriyor"
 fp3_clan.8009.a.failure.tt: "Zulmünüz boşa gidiyor"
 fp3_clan.8009.a.eccentric: "Ne cüret!"
 fp3_clan.8010.t: "Daha Çok Hâkim"
 fp3_clan.8010_muslim.t: "İşinin Ehli Kadılar"
### TODO AGOT-ONLY: fp3_clan.8010.desc_beginning [AGOT: ]
 fp3_clan.8010.desc_beginning: ""I cannot work like this", my tax collector [competent_tax_collector.GetName] exclaims, frustrated and dejected.\n\n"
### TODO AGOT-ONLY: fp3_clan.8010_muslim_version [AGOT: ]
 fp3_clan.8010_muslim_version: ""Every #italic sharia#! court of the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] is a wretched hive of incompetence, hampering all my efforts. Good tax farming needs competent #italic qadis#!, to keep the local magnates in check, to make your rule just in the eyes of [ROOT.Char.GetFaith.HighGodNameAlternate] and your claim to the bulk of the taxes righteous.\n\nYou must give me funds to employ more and better people for the courts, and the authority to fire the corrupt old qadis.""
### TODO AGOT-ONLY: fp3_clan.8010_non_muslim_version [AGOT: ]
 fp3_clan.8010_non_muslim_version: ""Every court of the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] is a sad place where greed reigns over efficiency and justice, hampering all my efforts. Good tax farming need competent magistrates, to keep the local magnates in check, to make your rule seem righteous and your claim to taxes justified.\n\nYou must give me funds to employ more and better people for the courts, and the authority to fire the imbeciles currently housed there.""
 fp3_clan.8010.a: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('capable_magistrate_candidate'))|U] [capable_magistrate_candidate.GetFirstNameNoTooltip] bu işin ehlidir. Onunla yetin."
 fp3_clan.8010.b: "Elbette, ihtiyacın olanı sağlayacağım."
 fp3_clan.8010.c: "Oradan altın yumurtuluyor gibi mi duruyorum?"
 tax_farming_capable_courtier_flavor: "[capable_magistrate_candidate.GetFirstNameNoTooltip], hâkim olmak üzere gönderiliyor."
 increase_aptitude.tt: "Bu etki [competent_tax_collector.GetFirstNamePossessiveNoTooltip] [aptitude|E] özelliğini artırabilir"
 fp3_clan.8011.t: "Düzgün Bir Maaş Sorumlusu"
 fp3_clan.8011.desc: "Ülkenin gelirlerinin nasıl arttırılabileceği konusunda her zaman yeni fikirler üretebilme yeteneğine sahip olan [competent_tax_collector.GetName], rutin bir birlik teftişi gerçekleştirirken bana yaklaşıyor.\n\n"[ROOT.Char.GetTitleTierName] hazretleri, Kendi topraklarınızdaki kodamanların birlik maliyeti adı altında sürekli keselerini doldurmaya çalıştıklarını fark ettim. Bana askerlerin ödemelerini denetleme yetkisi vermenizi öneririm. Böylece ben yolsuzlukla mücadele ederek ordunuzun daha verimli bir şekilde finanse edilmesini sağlayabilirim."\n\n"Fakat askerlerinizle ilgili her şey şimdiye kadar onun yetki alanında olduğu için [concerned_marshal.GetTitledFirstName], bu durumu hoş karşılamayabilir.""
 fp3_clan.8011.a: "Zaten şimdiye kadar bu işin ekmeğini çok yedi..."
 fp3_clan.8011.b: "Bu sorumluluğu aranızda paylaşabilirsiniz."
 fp3_clan.8011.c: "Hayır, işler olduğu gibi kalsın."
 fp3_clan.8011.b.success: "[competent_tax_collector.GetFirstNameNoTooltip] ve [concerned_marshal.GetFirstNameNoTooltip] isteksizce birlikte çalışmayı kabul ediyor"
 fp3_clan.8011.b.failure: "İkisi de bu reformdan nefret ediyor"
 fp3_clan.8011.b.success.tt: "Bir uzlaştırma yolu buldunuz"
 fp3_clan.8011.b.failure.tt: "Uzlaştırma çabanız başarısız oldu"
 fp3_clan.8012.t: "Uğurlu Hırs"
### TODO AGOT-ONLY: fp3_clan.8012.desc [AGOT: ]
 fp3_clan.8012.desc: ""Sometimes, [ROOT.Char.Custom('FormOfAddressForLiege')], windfalls happen." My tax collector [greedy_tax_collector.GetName] rubs [greedy_tax_collector.GetHerHis] hands in barely contained satisfaction.\n\n"I stumbled upon witnesses willing to testify that [extorted_vassal.GetTitledFirstName] owed you a significant sum, in conveniently #italic forgotten#! land taxes on perennial trees and water-wheels. I took the liberty of collecting them.\n\nOne of my retainers had trouble escorting the gold out of [extorted_vassal.GetCapitalLocation.GetName] though, harried by the local guards as they were, so you might have to keep an eye on [extorted_vassal.GetFirstNameNoTooltip]..."" 
 fp3_clan.8012.a: "Aferin!"
 fp3_clan.8012.b: "Parayı [ROOT.Char.GetFaith.HouseOfWorship] için kullanmak üzere verin. O zaman itiraz edemez."
 fp3_clan.8012.c: "Paranın bir kısmını ona geri vererek cömertliğimi göstereceğim." 
 fp3_clan.8013.t: "İltizamın Yükü"
 fp3_clan.8013.desc: "[ROOT.Char.Custom('ResidenceBuilding')|U] içerisinde yürürken kütüphanenin önünden geçmekteyken morali bozuk bir hâlde oturan vergi tahsildarım [stressed_tax_collector.GetName] gözüme ilişti.\n\nKendi kendine şöyle söyleniyordu: "Ey Yüce [ROOT.Char.GetFaith.HighGodNameAlternate]", Bunu yapmam mümkün değil. Bu vergi hukuku belgeleri çok eski, çok belirsiz ve çok düzensiz. Burada bir şeyi nasıl bulacağım ki?"\n\nTekrar taşraya dönmeden önce sadece küçük bir detayı kontrol etmek istemiştim...""
 fp3_clan.8013.a: "Sakin ol, beraber inceleyebiliriz."
 fp3_clan.8013.b: "İşini yap yoksa seni kırbaçlattırırım!"
 fp3_clan.8013.c: "Yürüyüşüme devam edeceğim..."
 fp3_clan.8013.a.success: "[stressed_tax_collector.GetFirstNameNoTooltip], sözlerinizle yatışıyor"
 fp3_clan.8013.a.failure: "Umutsuzluğu devam ediyor"
 fp3_clan.8013.b.success: "[stressed_tax_collector.GetFirstNameNoTooltip] adlı kişiyi daha fazla çalışması için korkutuyorsunuz"
 fp3_clan.8013.b.failure: "Gözdağı verme çabanız etkisiz kalıyor"
 fp3_clan.8013.a.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] yeni bir odak kazandı"
 fp3_clan.8013.a.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] ihmalkâr davranıyor"
 fp3_clan.8013.b.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] sizden korkuyor"
 fp3_clan.8013.b.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] tehdidinizin temelsiz olduğunu fark ediyor"
 fp3_clan.8015.t: "Rezil Evlat"
 fp3_clan.8015.desc: "[concerned_parent.GetName], önüne kattığı pek de mutlu gözükmeyen çocuğu [scandalous_scion.GetFirstName] ile birlikte odama giriyor.\n\n[concerned_parent.GetFirstNameNoTooltip] "[ROOT.Char.GetTitleTierName] Hazretleri!" diyerek söze başlıyor ve "Çocuğumun neler yaptığını belki duymuşsunuzdur, kasabanın etrafında sürten ve ne idiği belirsiz hanlarda içkiler içen serseri savaşçıların toplandığı #EMP fütüvvet#! kulüplerindekilerle arkadaşlık eder olmuş." diyerek derin bir iç çekiyor.\n\n"Bunun kamuya açık bir skandala dönüşmemesi için itibarını korumamız gerekiyor. Onun burada kalıp sarayda görgü kurallarını öğrenebileceğini düşünüyordum."" 
 fp3_clan.8015.a: "Pekâlâ, sarayımda kalabilir."
 fp3_clan.8015.b: "Bu senin fırlama çocuğun benim değil."
 fp3_clan.8016.t: "Hamam Vukuatı"
 fp3_clan.8016.opening_desc: "[chaplain.GetCouncilTitle] [chaplain.GetFirstName] ile rahatlatıcı bir banyonun tadını çıkarırken bir anda ciddi bir konuya giriyor.\n\nFısıldar bir hâlde şunları söylüyor: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], dün gece [scandalous_clan_member.GetName] bu hamamdaydı. Yanında da paçoz, imansız"
fp3_clan.8016.deviant_desc: " sapıklar ve bir eşek vardı."
fp3_clan.8016.drunkard_desc: " sarhoşlar ve keşler vardı."
fp3_clan.8016.rakish_desc: " fahişeler ve soysuzlar vardı."
fp3_clan.8016.hashishiyah_desc: " ve kafayı bulmuş suçlular vardı."
fp3_clan.8016.ending_desc: "Daha sonra tarif edemeyeceğim eylemlere giriştiler ve hamamı terk etmeyi de reddettiler. Ayrıca bu [scandalous_clan_member.GetFirstNamePossessiveNoTooltip] ilk vukuatı da değil." derken [chaplain.GetFirstNameNoTooltip] endişeli gözüken bir tavırla duraksıyor.\n\n"Bu eğilimleri tüm bir hanenin adına leke sürmededen önce onu uyarmalısınız."" 
fp3_clan.8016.a: "Pekâlâ, onu azarlayacağım"
fp3_clan.8016.b: "Hayır, ne tür şeylerle eğlenirlerse eğlensinler aile üyelerimin yanındayım."
fp3_clan.8017.t: "Şaibeli Makam"
### TODO AGOT-ONLY: fp3_clan.8017.opening_desc [AGOT: ]
fp3_clan.8017.opening_desc: ""[tax_collector.GetName] has served for a while now as your tax collector in my lands, and done decent enough work, but [tax_collector.GetSheHe] has also begun to act as supervisor of public morals."\n[unclan_taxpayer.GetTitledFirstName] looks worried, and perhaps a bit guilty.\n\n"
### TODO AGOT-ONLY: fp3_clan.8017.overly_eager.desc [AGOT: ]
fp3_clan.8017.overly_eager.desc: ""[tax_collector.GetSheHe|U] has been overly diligent, flogging subjects for the slightest infraction - from harmless drunken antics, to playing music in the streets, or men and women momentarily intermingling in the baths...""
fp3_clan.8017.corrupt.desc: "Ne yazık ki ne adil ne de dürüst bir şekilde davranarak bazı şeyleri görmezden gelme karşılığında cebini gümüşle doldurur hâle gelmiş."
fp3_clan.8017.cruel.desc: "Maalesef en ufak bir suç için bile kırbaçlamayı ve hatta taşlamayı reva görerek oldukça zalim olduğunu kanıtladı.."
fp3_clan.8017.generic.desc: "Gayretli biri olmak; ahlaksızlık, yozlaşmışlık ya da zalimlik değildir. Fakat yerel halkın ondan nefret etmesine sebep olur.""
fp3_clan.8017.ending.desc: "\n\n"Lütfen! Onun haşmetmeaplarının [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('tax_collector'))] olduğunu biliyorum ama ona durmasını söylemelisiniz.""
fp3_clan.8017.a: "O, [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] emrini yerine getiriyor."
fp3_clan.8017.b: "[tax_collector.GetNameNoTooltip] ortaya çıkarır diye korktuğun şey ne?"
fp3_clan.8017.c: "Pekâlâ ama bu iyiliğimi unutma."
fp3_clan.8017.d: "Bunu kendi aranızda çözmelisiniz."
fp3_clan_protect_kinsman_flavor: "Bu suçlamalar karşısında [tax_collector.GetNameNoTooltip] tarafında yer alarak onu korkuyorsunuz"
fp3_clan_accuse_accuser_flavor: "[unclan_taxpayer.GetTitledFirstNameNoTooltip] adlı kişiyi tehdit etmek, talebini yeniden gözden geçirmesine sebep olur"
 fp3_clan.3000.t: "Harap Olmuş Laleler"
 fp3_clan.3000.desc: "Bugünkü güzel hava beni bahçeye çıkmaya itti.\nSıra sıra en güzel çiçekler [fp3_clan_3000_loc_loc.GetNameNoTooltip] içerisinde benim kişisel zevkim için özenle buraya dikildi.\n\nAncak kıymetli lalelerimi ziyarete geldiğimde tüm keyfim kaçtı. Çocuğum [fp3_clan_3000_bad_child.GetFirstName], laleleri [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMePossessive', SCOPE.sC('fp3_clan_3000_random_family_member'))] için hediye olsun diye merhametsizce koparmış. "Bak! Bir sürü güzel çiçek buldum. Bence [fp3_clan_3000_random_family_member.GetFirstName] bunları çok sevecek!""
 fp3_clan.3000.a: "Çok güzel. [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMePossessive', SCOPE.sC('fp3_clan_3000_random_family_member'))] onlara bayılacak!"
 fp3_clan.3000.b: "Bahçemden çık! #italic Ver bakayım şu elindekileri de!!#!"
 fp3_clan.3000.c: "Bir dahaki sefere çiçekleri beraber dikmeye ne dersin?"
 fp3_clan.3000.c.flavor: "[fp3_clan_3000_bad_child.GetFirstNameNoTooltip] bahçe işlerinin zevkini öğrensin diye ortaya çıkan bu fırsatı değerlendiriyorsunuz"
 fp3_clan.3000.d: "Yeter artık. #italic Şimdi seni gübre olarak kullanacağım.#!"
