### TODO AGOT-CHANGED: fp3_yearly.8053.desc [AGOT: Days and weeks have passed, and my heart aches to think of what I must do, my cherished [SPOUSE.GetName], will be given to the flame! I must do R'hllor's biding! | TR: Günler ve haftalar geçti, gözcülerim şimşekten çıkan ateş için diyarı taradı ama boşuna. Yine de umutsuzluğa kapılmaya başlamışken, aniden uzaklarda kara bulutlar belirdi ve uzaklardan gelen gök gürültüsü sesi yankılandı. [ROOT.Char.Custom('ResidenceBuilding')] dışına aceleyle çıkıyorum, hizmetkârlar da yanımda ve gerçekten de sanki görünmez bir el tarafından işaret edilmiş gibi yaklaşıyor.\n\nSonra, tam önümde, parlak ışık bulutları deliyor ve [ROOT.Char.GetFaith.DivineRealm] diyarından bir mızrak gibi fırlayarak yalnız bir ağaca çarpıyor. Kuru odun bir anda tutuşuyor, beyaz bir alevle yanıyor, #italic fravaşi#! ruhları kadar saf. Onu buldum, Zafer Ateşi'ni. O bana geldi!]
 fp3_yearly.8053.desc: "Days and weeks have passed, and my heart aches to think of what I must do, my cherished [SPOUSE.GetName], will be given to the flame! I must do R'hllor's biding!" 
 fp3_yearly.8053.a: "Buna inanamıyorum..."
