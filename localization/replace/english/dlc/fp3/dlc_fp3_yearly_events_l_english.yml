 fp3_mediation_succeeds.tt: "Arabuluculuğunuz başarılı oldu"
 fp3_poet_leaves.tt: "[snubbed_poet.GetNameNoTooltip] [former_employer.GetFirstNamePossessiveNoTooltip] sarayına taşınacak, ancak [opinion|E] ve [prestige|E] kazanacaksınız" 
 fp3_promise_to_pay_for_book.tt: "Bittiğinde kitap için 495 [gold|E] ödemeye söz veriyorsunuz."
 fp3_mediate_between_them.flavor: "[snubbed_poet.GetNameNoTooltip] ve [former_employer.GetFirstNameNoTooltip] arasındaki durumu düzeltmeye çalışıyorsunuz."

 fp3_yearly.8028.t:0 "Oktarkların Kitabı"
### TODO AGOT-CHANGED: fp3_yearly.8028.desc [AGOT: It is completed, [snubbed_poet.GetName] declares, | TR: Tamamlandı]
 fp3_yearly.8028.desc: "It is completed, [snubbed_poet.GetName] declares, "as I promised, all 990 chapters, epic tales of Ghiscari heroism and wonders in ages long ago. I poured my soul into this work, and never again shall I make its like. I am but a humble mortal poet. Yet, thanks to your patronage, perhaps my book can last through the ages, and become beacon of resurgent pride for Ghis."\n\n"Now...you had promised me 495 pounds of gold?""
 fp3_yearly.8028.a: "Onlar senin ve kalıp bana hizmet etmelisin."
 fp3_yearly.8028.b: "Evet, al onları ve git köyüne yardım et."
### TODO AGOT-CHANGED: fp3_yearly.8028.c [AGOT: Is #italic #! what I paid for? What a disappointment. | TR: Parasını ödediğim şey #italic bu#! mu? Ne büyük bir hayal kırıklığı.]
 fp3_yearly.8028.c: "Is #italic #! what I paid for? What a disappointment."

 shahnameh_name:0 "Oktarkların Kitabı"
### TODO AGOT-CHANGED: shahnameh_desc [AGOT: This massive tome tells, in exquisite verse and detail, the mythical history of the Old Ghiscari Empire from the creation of the empire until the Valryiran conquest. It seems to stir the heart of every Ghiscari who reads it. | TR: Bu devasa eser, dünyanın yaratılışından Müslümanların fethine kadar Pers İmparatorluğu'nun efsanevi tarihini enfes dizeler ve ayrıntılarla anlatır. Onu okuyan her Pers'in kalbini heyecanlandırıyor gibi görünüyor.]
 shahnameh_desc: "This massive tome tells, in exquisite verse and detail, the mythical history of the Old Ghiscari Empire from the creation of the empire until the Valryiran conquest. It seems to stir the heart of every Ghiscari who reads it." 
