### TODO AGOT-CHANGED: fp3_frontier_story_cycle.0002_letter [AGOT: I regret my behavior during the affair with the nomads. They have indeed left [nomads_county.GetNameNoTier], and I hear the conflicts between them and the farmers have abated. While I still insist that you should take the nomad threat seriously, I would like to offer you these beautiful gold coins, minted in the Lengii Empire long ago, as a token of my respect. | TR: Göçebelerle olan ilişkim sırasındaki davranışlarımdan dolayı pişmanım. Gerçekten de [nomads_county.GetNameNoTier] bölgesini terk ettiler ve çiftçilerle aralarındaki çatışmaların azaldığını duydum. Göçebe tehdidini ciddiye almanız gerektiği konusunda hâlâ ısrar etsem de, size saygımın bir göstergesi olarak uzun zaman önce Kuşan İmparatorluğu'nda basılmış bu güzel altın sikkeleri sunmak istiyorum.]
 fp3_frontier_story_cycle.0002_letter: "I regret my behavior during the affair with the nomads. They have indeed left [nomads_county.GetNameNoTier], and I hear the conflicts between them and the farmers have abated. While I still insist that you should take the nomad threat seriously, I would like to offer you these beautiful gold coins, minted in the Lengii Empire long ago, as a token of my respect." 
 fp3_frontier_story_cycle.0002.a: "Güzel bir hediye. Her şey affedildi."
 fp3_frontier_story_cycle.0002.b: "Senin ıvır zıvırına ihtiyacım yok, mazeretini de kabul etmiyorum."
