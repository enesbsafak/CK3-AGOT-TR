### TODO AGOT-CHANGED: fp3_yearly.8052.desc [AGOT: The [ROOT.Char.GetFaith.AltPriestTermPlural] have been constantly reminding me of my pledge to find a Fire of Sacrfice for the temple in [sacred_fire_province.GetName]. Not that I have forgotten... I ponder who to sacrifice, but can not bring myself to plunge any I care for into the flame. | TR: [ROOT.Char.GetFaith.AltPriestTermPlural] bana [sacred_fire_province.GetName] topraklarındaki tapınak için bir Zafer Ateşi bulma sözümü sürekli hatırlatıyor. Unuttuğumdan değil... Fırtına aramak için her yöne gözcüler gönderdim, [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] işaretlerini bulmaları için. Ama yıldırım pek ortaya çıkmak istemiyor gibi.\n\nŞimdi uzaklarda gök gürlerken ve kara bulutlar arasında şimşekler çakarken [ROOT.Char.Custom('ResidenceBuilding')] eteklerinin hemen dışında duruyorum. Hizmetkârlarım etrafta koşuşturup yıldırımları uzun direklerle yakalamaya çalışırken, ben de araziye bakıp alevlere dair bir ipucu arıyorum. Çabalarımız boşuna - bulutlar kısa sürede dağılıyor ve şimşek yüksek göklerde kayboluyor.\n\n[ROOT.GetCharacter.GetFaith.HighGodNamePossessive] istediği gerçekten bu mu? Aradığım ateşi asla bulamayacak mıyım?]
 fp3_yearly.8052.desc: "The [ROOT.Char.GetFaith.AltPriestTermPlural] have been constantly reminding me of my pledge to find a Fire of Sacrfice for the temple in [sacred_fire_province.GetName]. Not that I have forgotten... I ponder who to sacrifice, but can not bring myself to plunge any I care for into the flame."
