 fp3_frontier_story_cycle.0003_ending: ""This is not fair", protests [turkic_leader.GetFirstNameNoTooltip]. "I dedicated one hundred horse archers to your service, as well as myself. If you refrain from taxing us in this way, I promise not to forget the favor.""  
 fp3_frontier_story_cycle.0003.a: "Kabilenizin sakladığı tüm paraları bulacağız."
 fp3_frontier_story_cycle.0003.b: "Hayır, [greedy_chaplain.GetFirstNameNoTooltip] haklı, vergilendirilmelisiniz."
 fp3_frontier_story_cycle.0003.c: "Pekâlâ, [turkic_leader.GetFirstNameNoTooltip], bu kulağa adil geliyor."
 resentful_nomads.toast: "Göçebeler üzgün"
 fp3_frontier_story_cycle.0004.t: "[turkic_leader.GetCulture.GetNameNoTooltip] tarafınca yetim bırakıldı"
 fp3_frontier_story_cycle.0004.desc: "[orphan_girl.GetName] gerçekten de perişan görünüyor, tıpkı her türlü talihsizlikten muzdarip görünen küçük erkek kardeşi [orphan_boy.GetName] gibi.\n\n"Lütfen, [ROOT.Char.GetTitleTierName]" diyor titrek bir sesle, "bir haftadır yemek yemedik. Biraz ekmek isteyebilir miyim? Küflü olması önemli değil, verseniz yeter..."\n\nDaha fazla sorgulandığında, ailesinin talihsizliği için kimin suçlanacağını tam olarak bilmiyor gibi görünüyor. "Atlılar gelip ekinlerimizi biçtiler ve koyunlarımızı çaldılar... sonra da ortadan kayboldular. Şimdi bize ne olacak bilmiyorum ama [upset_vassal.GetTitledFirstName] bu önemsiz meseleyle sizi rahatsız ettiği için çok üzgünüm."
 fp3_frontier_story_cycle.0004.a: "Üzülmeyin, sizi alacağım."
 fp3_frontier_story_cycle.0004.b: "[turkic_leader.GetFirstNameNoTooltip], sizi kabilesine kabul etmeli gibi görünüyor."
### TODO AGOT-CHANGED: fp3_frontier_story_cycle.0004.c [AGOT: I will send you to a temple. | TR: Seni bir manastıra göndereceğim.]
 fp3_frontier_story_cycle.0004.c: "I will send you to a temple."
 fp3_frontier_story_cycle.0004.d: "[upset_vassal.GetFirstNameNoTooltip], benden ne bekliyor hiçbir fikrim yok. Git bir yetimhane bul."
 fp3_pay_for_upkeep_flavor: "Onların bakım masraflarını ödemeniz gerekecek."
 fp3_frontier_story_cycle.0005.t: "İki Yüz Atlı"
 fp3_frontier_story_cycle.0005.desc: "Ben strateji ve savaşlar üzerine düşünürken, [turkic_leader.GetName] yüzlerce atlıyla birlikte geldi.\n\n"[Select_CString(ROOT.Char.IsFemale, 'Leydim', 'Lordum' )]", diyor eğilerek, "Tüm kabilem gibi ben de sizi destekleyeceğime söz vermiştim. Şimdi savaşta olduğunuza göre, size iki yüz yetenekli atlı okçu daha sunabiliriz, ancak onları yalnızca devam eden çatışma için ayırabiliriz. Ortalık sakinleştiğinde, yurtlarına ve ailelerine geri dönecekler. Karşılığında sizden tek istediğimiz bu iyiliği unutmamanız.""
 fp3_frontier_story_cycle.0005.a: "Bunu kabul edebilirim."
 fp3_frontier_story_cycle.0005.b: "Bu iyilik konuşmalarından bıktım!"
 fp3_frontier_story_cycle.0005.c: "Hayır, teşekkür ederim, onlarsız da idare edebilirim."
 fp3_frontier_story_cycle.0006.t: "Yoldan Çıkmış Bir Ok"
 fp3_frontier_story_cycle.0006_beginning: "[one_eyed_child.GetName], her zaman yaptığı gibi [ROOT.Char.Custom('ResidenceBuilding')] içerisinde etrafta koşturuyordu ki felaket çıkageldi. [turkic_leader.GetName] bazı savaşçılarıyla okçuluk talimi yapıyordu ve hedefinden sapan bir ok yüzünden [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('one_eyed_child'))] gözünden vuruldu."
### TODO AGOT-ONLY: fp3_frontier_story_cycle.0006_has_court_physician [AGOT: ]
 fp3_frontier_story_cycle.0006_has_court_physician: ""[one_eyed_child.GetSheHe|U] will be fine, I believe", my physician [scoped_physician.GetFirstName] says, "but alas, will walk through life with one eye less. May I humbly caution you to have less arrows flying over the courtyard in the future?"\n\n"
 fp3_frontier_story_cycle.0006_no_court_physician: "Aceleyle çağrılan yerel bir hekim onun iyileşeceğini doğruladı, ancak gözü sonsuza dek sakat kalacak.\n\n"
### TODO AGOT-ONLY: fp3_frontier_story_cycle.0006_ending [AGOT: ]
 fp3_frontier_story_cycle.0006_ending: ""It was an accident", [turkic_leader.GetFirstName] pleads. "Do not be too eager to punish me, [ROOT.Char.Custom('FormOfAddressForLiege')]. If we don't practice, how are we to defend your lands?""
 fp3_frontier_story_cycle.0006.a: "Zindanda okçuluk becerileriniz üzerine düşünebilirsiniz."
 fp3_frontier_story_cycle.0006.b: "Bundan böyle [ROOT.Char.Custom('ResidenceBuilding')] çevresinde okçuluk yasaklanmıştır."
 fp3_frontier_story_cycle.0006.c: "Sanırım bu [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] isteğiydi."
 fp3_frontier_story_cycle.0007.t: "Kervan Felaketi"
### TODO AGOT-ONLY: fp3_frontier_story_cycle.0007.desc [AGOT: ]
 fp3_frontier_story_cycle.0007.desc: ""Oh [ROOT.Char.GetTitleTierName]", my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))] [warmonger_councillor.GetFirstName] says, "merchants in the [bandits_county.GetName] speak of raids by bandits on horseback. Now the caravans make detours from that land, hurting our trade on the roads. I pray you send me to investigate this matter."\n\n"No", [turkic_leader.GetName] interjects fiercely, "I can send my warriors to safeguard the caravan ways permanently - if we may graze our horses in [bandits_county.GetNameNoTierNoTooltip] henceforth. Surely that would be a better course of action?"\n\nBut [warmonger_councillor.GetFirstNameNoTooltip] protests. "Beware, [ROOT.Char.Custom('FormOfAddressForLiege')] - the farmers loathe when you let nomads roam freely.""
 fp3_frontier_story_cycle.0007.a: "Yine de [turkic_leader.GetFirstNameNoTooltip] ve planı kulağa daha iyi geliyor."
 fp3_frontier_story_cycle.0007.b: "Yeterince adil, size bu şansı vereceğim."
 fp3_frontier_story_cycle.0007.c: "Eğer beklersek, tüccarlar eninde sonunda geri dönecektir."
 fp3_investigating_attacks_successful: "[warmonger_councillor.GetFirstNameNoTooltip] saldırıları durduruyor ve bundan ders çıkarıyor"
 fp3_investigating_attacks_dismal_failure: "[warmonger_councillor.GetFirstNameNoTooltip] sonuç alamadan geri dönüyor"
 fp3_investigating_attacks_toast_successful: "[bandits_county.GetNameNoTierNoTooltip] güvenli"
 fp3_investigating_attacks_toast_dismal_failure: "Haydutlar [bandits_county.GetNameNoTierNoTooltip] topraklarında hüküm sürüyor"
 attacks_abated.toast: "Haydut saldırıları azaldı"
 fp3_frontier_story_cycle.0099.t: "[turkic_leader.GetFirstNameNoTooltip] Tımarı"
### TODO AGOT-ONLY: fp3_frontier_story_cycle.0099.desc [AGOT: ]
 fp3_frontier_story_cycle.0099.desc: ""Long have I served you loyally, my liege, and given much support to your cause, at great personal expense." [turkic_leader.GetName] looks like [turkic_leader.GetSheHe] has been biding [turkic_leader.GetHerHis] time for this moment, and one does not have to be a [Select_CString(turkic_leader.IsFemale,'seeress','seer')] to realize what is coming next.\n\n"It is long overdue that you give me the reward, and the responsibility, that is my due. Grant me the [title_to_grant.GetName], to hold in perpetuity, and my tribe will serve the [ROOT.Char.GetDynastyHouseName] house for ages to come. It is far from your richest land, but in dire need of more direct governance. Honor me in this way, or I might take my warriors elsewhere.""
 fp3_frontier_story_cycle.0099.a: "Senin say."
 fp3_frontier_story_cycle.0099.b: "Bunun yerine [extra_title_to_grant.GetNameNoTooltip] topraklarına ne dersiniz?"
 fp3_frontier_story_cycle.0099.c: "Size [extra_extra_title_to_grant.GetNameNoTierNoTooltip] topraklarını verebilirim ama hepsi bu."
 fp3_frontier_story_cycle.0099.d: "Hayır."
 fp3_yearly.8019.t: "Işık Sığınağı"
 fp3_yearly.8019.desc: "[hateful_ruler.GetTitleTierName] [hateful_ruler.GetFirstName] topraklarında kalan [manichean_leader.GetFaith.GetAdherentNamePlural] için bir zulüm başlattı. Bu kuşatılmış inancın liderlerinden biri olan [manichean_leader.GetName], şimdi elinde büyük bir yığın tozlu kitapla beni arıyor.\n\n"Yüce [ROOT.Char.GetTitleTierName]", diyor, "benim inancım eski bir inançtır, henüz gençken Hristiyanlığa rakip olmuştur. Maddenin bu düşmüş dünyası hakkında çok fazla bilgiye ve hatta ışığın daha yüksek dünyasına dair bazı mütevazı içgörülere sahibiz. Yurttaşlarımızdan bazıları çoktan [refuge_of_light.GetNameNoTier] topraklarına yerleşti - takipçilerimin de yerleşmesine izin verebilir misiniz?"\n\n"Karşılığında, burada kalıp size hizmet edebilir ve Bağdat'taki ve düşmeden önce Tizpon'daki kadim kütüphanelerimizde bulunan bu bilgi hazinesini sizinle paylaşabilirim.""
 fp3_yearly.8019.a: "Bu teklifi memnuniyetle kabul ediyorum."
 fp3_yearly.8019.b: "Hepiniz [refuge_of_light.GetNameNoTierNoTooltip] topraklarına yerleşebilirsiniz - eğer uygun vergiyi öderseniz."
 fp3_yearly.8019.c: "Sizi topraklarımda barındırmayacağım."
 manicheans_sent_away.tt: "[manichean_leader.GetFaith.GetAdherentNamePlural] tarafınızca gönderiliyor"
 fp3_yearly.8020.t: "Toprağın Hanımı"
 fp3_yearly.8020.desc: "[temple_county.GetNameNoTier] topraklarında, büyük [imam_husayn.GetTitledFirstName] ile evlenen Sasani prensesi [bibi_shahrbanu.GetFirstName]'ya adanmış bir türbe var. Kerbela Savaşı'ndan at sırtında kaçarken, [bibi_shahrbanu.GetFirstNameNoTooltip] kurtuluş için haykırdığı ve bir dağın açılıp onu içine aldığı söylenir. O zamandan beri pek çok kadın hacı ona hürmet etmek için o bölgeye gelmiştir.\n\nAncak [righteous_caliph.GetTitledFirstName] türbenin aslında pagan tanrısı [GetFaithByKey('mazdayasna').FertilityGodName] için adanmış olduğunu ve orada sergilenen bağlılığın çarpık ve dinsiz olduğunu iddia etmektedir.\n\n"Bunu yapamazsınız" diye yalvarıyor [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('pious_woman'))] [pious_woman.GetFirstName]. "[bibi_shahrbanu.GetFirstNameNoTooltip] İran'daki tüm kadınlar için bir simgedir. Tapınağın olmasına izin vermelisiniz.""
 fp3_yearly.8020.a: "Senin hatırın için onu koruyacak muhafızlar bile bulacağım."
 fp3_yearly.8020.b: "O bir Pers #italic prensesiydi#!! Kimse o tapınağa zarar veremez." 
 fp3_yearly.8020.c: "Ne yazık ki, yok edilmeli."
 supporting_womens_faith_flavor: "[bibi_shahrbanu.GetFirstNameNoTooltip] kültünü desteklemeye başlıyorsunuz."
 fp3_sharhabanu_devotees_angry.tt: "Sarayınızdaki [bibi_shahrbanu.GetFirstNameNoTooltip] adanmışları bununla ilgili sorun yaşayabilir"
 fp3_yearly.8021.t: "Asidik Bir Kaza"
 fp3_yearly.8021.desc: "Birkaç gün önce, [alchemy_enthusiast.GetName], [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('upset_vassal'))] bilgili [alchemy_enthusiast.Custom2('RelationToMe', SCOPE. sC('upset_vassal'))] [upset_vassal.GetFirstName], ünlü simyacı [enthusiastic_alchemist.GetName] tarafından hazırlanan vitriol yağı ile yapılan bir deneye katıldı. Görünüşe göre, bir şeyler korkunç bir şekilde ters gitmiş.\n\n"[enthusiastic_alchemist.GetFirstNameNoTooltip] ciddi bir şekilde cezalandırmalı", diyor [upset_vassal.GetTitledFirstNameNoTooltip], "[alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] ne hâlde bir bakın!"\n\n"Hayır, [ROOT.Char.GetTitleTierName]", diye yalvarıyor [enthusiastic_alchemist.GetFirstNameNoTooltip], "Ben sadece bilgeler tarafından uzun zamandır aranan bir formülü mükemmelleştirdim. [alchemy_enthusiast.GetTitledFirstNameNoTooltip] yeryüzünde şimdiye kadar görülmüş en aşındırıcı madde olan #italic okka#! ile dikkatsiz davranmışsa bu benim suçum değil." 
 fp3_acid_delving_deeper_tooltip: "[upset_vassal.GetFirstNameNoTooltip] ve şikayetlerini, [enthusiastic_alchemist.GetNameNoTooltip] ve keşiflerini dinlemek için görmezden geliyorsunuz."
 fp3_yearly.8021.a: "[enthusiastic_alchemist.GetNameNoTooltip], bana bu keşifler hakkında daha fazla bilgi verin..."
 fp3_yearly.8021.b: "Pekâlâ, [upset_vassal.GetTitledFirstNameNoTooltip], onu öldürteceğim."
 fp3_yearly.8021.c: "Zindanımda bu cılız simyacı için yerim var..."
 fp3_yearly.8021.d: "Burada kimsenin suçu yok, birbirinizi affetmelisiniz."
 fp3_yearly.8022.t: "Vitriolik Vizyonlar"
### TODO AGOT-ONLY: fp3_yearly.8022.desc [AGOT: ]
 fp3_yearly.8022.desc: ""What I have invented is derived from a glassy mineral the Qaathi and Ghiscari of old called #italic vitriol#!", [enthusiastic_alchemist.GetName] explains. "By meticulously roasting green vitriol in an iron retort, I created this corrosive substance. I could see both scholarly and medicinal uses for it, but beware my [ROOT.Char.GetLadyLord], it is not to be trifled with, as [alchemy_enthusiast.GetTitledFirstName] has learnt. Perhaps you might sponsor my further research?""
 fp3_yearly.8022.a: "Maddeyi bizzat inceleyeceğim!"
 fp3_yearly.8022.b: "Herhangi bir...#italic askerî#! kullanımı olabilir mi?"
 fp3_yearly.8022.c: "Aferin ama bu işime yaramaz."
 fp3_studying_acid_ominously_tooltip: "Daha fazla araştırma yapıyorsunuz..." 
 fp3_yearly.8022.b.flavor: "[enthusiastic_alchemist.GetNameNoTooltip] daha fazla araştırma yapmak için sarayınızda kalıyor."
 fp3_yearly.8022.c.flavor: "[enthusiastic_alchemist.GetNameNoTooltip] bilgisini başka bir yere götürüyor."
 fp3_yearly.8023.t: "Aşındırıcı Muammalar"
 fp3_yearly.8023.desc: "Uğursuz bir şekilde cızırdayan sıvıları şişeden şişeye yavaşça dökerken, [enthusiastic_alchemist.GetName] bana endişeyle bakıyor.\n\n"Hükümdarım", diyor ve ekliyor, "Ben esas olarak bir tarih ve teoloji bilginiyim, sizinle karşılaştırıldığında, simyada sadece bir amatörüm gibi görünüyor. Yine de deneyimlerim şimdilik daha fazla bir şey öğrenemeyeceğimizi söylüyor. Yarattığım bu kezzap yağını denemeyi bırakmalıyız, yoksa korkarım [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] kibrimiz yüzünden bizi cezalandıracak. Belki de böyle bir asit bu dünyaya konulmamalıydı.""
 fp3_yearly.8023.a: "Hayır, bunu sonuna kadar götüreceğim."
 fp3_yearly.8023.b: "Belki de haklısın. Yine de kalıp bana hizmet etmelisin."
 fp3_yearly.8023.c: "Nasıl istersen. Git ve asidini de yanında götür."
 experimenting_with_acid_toast.failure: "Deneyleriniz başarısız oldu"
 experimenting_with_acid_toast.success: "Deneyleriniz iyi gitti"
 fp3_horrible_accident.flavor: "Korkunç bir kaza riski taşıyorsunuz."
 fp3_yearly.8024.t: "Gökyüzüne Dönüş"
 fp3_yearly.8024.desc: "Ateşi ve titremesi kısa bir süreliğine azalırken, [dying_consort.GetFirstName] bana solgun bir gülümsemeyle bakıyor. "Sevgili eşim, bu dünyada fazla zamanım kalmadı. En iyi hekimler bile kaçınılmaz olanı ancak erteleyebilir, bunu hissedebiliyorum." bir süre daha bilincini koruması büyük çaba gerektiriyor gibi görünüyor.\n\n"Dinle", diyor soluk bir sesle, "çünkü bu benim son arzum. Bedenimin atalarımın yaptığı gibi leş kuşlarına verilmesini istiyorum, böylece ruhum cennetteki meskenine geri götürülebilsin. Gömülmek ya da yakılmak yok, lütfen, sana yalvarıyorum. Öteki dünyayı ateşli rüyalarımda gördüm... Eski şekilde, Pers'in gerçek bir çocuğu olarak son bulmak istiyorum.""
 fp3_yearly.8024.a: "Bunun yapıldığından emin olacağım, söz veriyorum."
 fp3_yearly.8024.b: "Seni gizlice gökyüzüne gömebilirim ama ülkenin kalanı asla bilmemeli."
 fp3_yearly.8024.c: "Ne yazık ki [ROOT.GetCharacter.GetFaith.HighGodNameAlternatePossessive] öğretilerine böyle bir hakarette bulunamam."
 fp3_relations_care_about_sky_burial.tt: "[Concept( 'courtiers', 'Saray Mensuplarınızın' )|E], [Concept( 'vassals', 'Vasallarınızın' )|E] ve [Concept( 'close_family_members', 'Yakın Aile Mensuplarınızın' )|E] bu konuda fikirleri olacaktır."
 hiding_sky_burial_toast.success: "Gökyüzü Defnini sakladınız"
 hiding_sky_burial_toast.failure: "Gökyüzü Defniniz açığa çıktı"
 fp3_hidden_sky_burial.tt: "Ayini gizlice gerçekleştiriyorsunuz"
 fp3_unhidden_sky_burial.tt: "Ritüel olaydan sonra keşfedildi"
 fp3_helpful_courtier.tt: "[helpful_courtier.GetName] bu çabanızda size yardımcı olacaktır"
 fp3_yearly.8025.t: "Dördüncü Şafak"
 fp3_yearly.8025.desc: "[dying_consort.GetName] bedeni tüm uygun törenlerle eski bir #italic dahme'nin#! oyuklarında, gökyüzüne ve üzerinde dönüp duran bozkır akbabalarına açık bir şekilde toprağa verildi.\n\nVefatının üzerinden üç gün geçti ve kendimi güneş doğana kadar dahme'nin yanında oyalanırken buldum. Eski efsanelere göre, ölümden sonraki dördüncü şafakta, ruh yüksek dünyadaki #italic fravaşi#! ruhuna geri dönerdi. Orada, kötülüğe karşı ebedi savaşta yardımcı olmak için hayatta öğrendiği her şeyi fravaşisine aktarırdı. Ama dahme'nin solmuş duvarlarından cennete doğru yükselen bir ruh görmüyorum, sadece yükselen güneşin soluk ışığına karşı leş kuşlarının karanlık silüetini görüyorum." 
 fp3_yearly.8025.a: "Diğer kıyıya huzur içinde geçsin."
 fp3_yearly.8025.b: "Onun ölüm dileğini onurlandırdım."
 fp3_yearly.8026.t: "Gizli Dahme"
 fp3_yearly.8026.desc: "[ROOT.Char.Custom('ResidenceBuilding')] yapısının çok dışında, bozkırlardan gelen soğuk rüzgarlarla yavaş yavaş yıkılan eski bir #italic dahme#!, bir Sessizlik Kulesi var. Görünüşe göre burada meraklı gözler yok ve [helpful_courtier.GetFirstName] ile birlikte [dying_consort.GetTitledFirstName], dileğine ulaşabilsin diye içindeki solmuş oyuklardaki son dinlenme yerine taşıyorum. Bozkır akbabalarının kara bir bulut gibi inişini sessizce izliyorum ve bir an için nereden geldiklerini merak ediyorum - eski tanrılar tarafından mı yoksa [ROOT.Char.GetFaith.DevilName] tarafından mı gönderildiler? Asla bilemeyeceğim.\n\n[helpful_courtier.GetFirstNameNoTooltip] sessiz kalıyor, görünüşe göre kasvetli havadan etkilenmiş." 
 fp3_yearly.8026.a: "Umarım kimse bunu fark etmez..."
 fp3_yearly.8026.b: "Emin olmak için [helpful_courtier.GetFirstNameNoTooltip] sonsuza dek susmalı..."
 fp3_yearly.8027.t: "Dokuz Yüz Doksan Bölüm Altın"
### TODO AGOT-CHANGED: fp3_yearly.8027.desc [AGOT: The celebrated writer [snubbed_poet.GetName] has had a falling out with his long-time patron, [former_employer.GetName].\n\n[former_employer.GetSheHe|U] promised me nine hundred and ninety pounds of gold | TR: Ünlü yazar [snubbed_poet.GetName], uzun süredir destekçisi olan [former_employer.GetName] ile bir sıkıntı yaşamış.\n\n]
 fp3_yearly.8027.desc: "The celebrated writer [snubbed_poet.GetName] has had a falling out with his long-time patron, [former_employer.GetName].\n\n[former_employer.GetSheHe|U] promised me nine hundred and ninety pounds of gold", [snubbed_poet.GetFirstNameNoTooltip] tells me, "one for every chapter in the epic poem I have long prepared on [former_employer.GetHerHis] behalf. I had planned to use it to restore the collapsed aqueducts in my home village. But when I was in the bathhouse, a courier came with my promised reward - but the coins were of #italic silver#!! Upset by this betrayal, I gave it all to the courier, the bathhouse host, and a juice peddler. Now I need a new employer, while I finish the last chapters, and I hear you have enough gold to match the previous offer...""
 fp3_yearly.8027.a: "Kitabın bittiğini gördüğümde size bu miktarın #italic yarısını#! vereceğim."
 fp3_yearly.8027.b: "Bu [former_employer.GetTitledFirstNameNoTooltip] ile ilgili bir yanlış anlaşılma olmalı..."
 fp3_yearly.8027.c: "Beni müsrif mi sanıyorsun? Başka bir yere git."
