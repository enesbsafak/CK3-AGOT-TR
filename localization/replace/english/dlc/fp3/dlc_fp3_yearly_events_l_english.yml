 persian_epic_desc: "This book is crammed full of epic poetry celebrating the deeds and destinies of Ghiscari heroes in days of old."
 fp3_yearly.8029.t: "Eski Zaferin Öyküsü"
### TODO AGOT-CHANGED: fp3_yearly.8029.desc [AGOT: [snubbed_poet.GetName] hands me his script, and many pages already decorated with fine miniatures drawn with a skilled hand. Here is the book that I promised you | TR: [snubbed_poet.GetName] bana senaryosunu ve yetenekli bir elle çizilmiş ince minyatürlerle süslenmiş birçok sayfayı uzatıyor.]
 fp3_yearly.8029.desc: "[snubbed_poet.GetName] hands me his script, and many pages already decorated with fine miniatures drawn with a skilled hand. Here is the book that I promised you", [snubbed_poet.GetSheHe] declares triumphantly. "And with what humble skill I may possess, I promise you will not find it lacking. It tells of heroes like Hizdahr the Archer, Krazdak the Dragon-Slayer, beautiful princesses and Ghis' ancient glory. I even made a couplet tying your great dynasty to it all..."\n\n"Now, we said something about 495 pounds of gold?""
 fp3_yearly.8029.a: "Onlar senin ve burada kalıp bana hizmet etmelisin."
 fp3_yearly.8029.b: "Evet, al onları ve git köyüne yardım et."
 fp3_yearly.8029.c: "#italic Bunun#! için bu kadar altın mı?!"
 fp3_yearly.8030.opening: "[former_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
### TODO AGOT-CHANGED: fp3_yearly.8030.desc [AGOT: Do you take me for a fool?  [snubbed_poet.GetName] spent my riches on wretched street peddlers and degenerate bath house hosts, and though he now claims that he received silver, I have been told by people more trustworthy than you that indeed, it was gold. Yet he stole away with the book I was promised, to #italic you#!. May [former_employer.GetFaith.HighGodNameAlternate] remove you form the garden of paradise! | TR: Beni aptal mı sanıyorsun? [snubbed_poet.GetName] servetimi sefil sokak satıcılarına ve yozlaşmış #italic hamam#! ev sahiplerine harcadı ve şimdi gümüş aldığını iddia etse de, senden daha güvenilir insanlar tarafından aslında altın olduğu söylendi. Yine de bana vadedilen kitabı #italic sana#! çaldı. Umarım [former_employer.GetFaith.HighGodNameAlternatePossessive] cennet bahçesine giremezsin!]
 fp3_yearly.8030.desc: "Do you take me for a fool?  [snubbed_poet.GetName] spent my riches on wretched street peddlers and degenerate bath house hosts, and though he now claims that he received silver, I have been told by people more trustworthy than you that indeed, it was gold. Yet he stole away with the book I was promised, to #italic you#!. May [former_employer.GetFaith.HighGodNameAlternate] remove you form the garden of paradise!"
 fp3_yearly.8030.a: "Mantıklı düşünememeniz ne yazık..."
 fp3_yearly.8031.opening: "[former_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 fp3_yearly.8031.desc: "Gerçekten de, kindar bir saray mensubumun bana ihanet ettiği ve [snubbed_poet.GetName] için söz verdiğimden daha azını verdiği ortaya çıktı. Benimle şair arasındaki bu yanlış anlaşılmayı giderdiğiniz için teşekkür ederim, kendisi artık hizmetime geri dönecek. Bu dünyanın diğer yöneticilerine sizin hakkınızda iyi şeyler söyleyeceğim."
 fp3_yearly.8031.a: "Benim için bir zevkti."
 fp3_yearly.8032.t: "Ölülerin On Günü"
 fp3_yearly.8032.desc: "Eski Pers takvim yılının sonu yaklaşırken, ölülerin ruhlarını anmak için düzenlenen eski bir festival olan #italic Fravardigan# zamanı geldi. [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('death_enthusiast'))] [death_enthusiast.GetTitledFirstName] fark edilir derecede sessizleşti ve neredeyse umutsuzluğa kapıldı, kapıların yanında atalarının ruhları için yiyecek adakları bırakıyor. \n\n"Gidip lambaları yakmalısın," diyor bana, "#italic fravaşi#! ruhlarını karşılamak için, çünkü kesinlikle ataların şimdi bizi izliyor, bu maddi dünyanın ince duvarlarının ötesinde. [ancestor_1.GetName] ve hanenizin diğer kudretli atalarını düşünün.""
 fp3_yearly.8032.a: "Ne yazık ki pagan ritüellerini kutlamıyorum."
 fp3_yearly.8032.b: "Elbette canım."
 fp3_yearly.8032.c: "[ROOT.Char.GetDynastyHouseName] hanesi oldukça görkemli, şimdi sen bahsetmişken..."
 fp3_yearly.8032.d: "Gerçekten de... hayat kısa bir mum gibidir, çok kolay söner."
 fp3_yearly.8033.t: "Dondurulmuş Lezzetler"
 fp3_yearly.8033.desc: "Herkesten önce, keskin gözlü ve tatlı dişli [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('sorbet_enthusiast'))] [sorbet_enthusiast.GetTitledFirstName] yemek masalarında göze çarpan bir eksiklik fark etti.\n\n"Hiç #italic falude#! kalmamış!" diye haykırıyor, her İranlının sevdiği erişte, şurup ve gül suyundan oluşan soğuk tatlıya atıfta bulunarak. "Tedarikçiyi çağırdım", diye devam ediyor, "[yakhchal_county.GetNameNoTier] topraklarındaki #italic yakhchal#! buz evlerinin bir depremde yıkıldığını söylediler. Bir an önce bir şeyler yapmalıyız, yoksa tüm saray acı çekecek ve bizi Doğulu mistikler sanacak kadar bitkin düşeceğiz!""
 fp3_yearly.8033.a: "Hâlâ yapabiliyorken krallığın tüm falude arzını güvence altına almalıyım!"
 fp3_yearly.8033.b: "Bu tür fazlalıklara ne benim ne de sizin ihtiyacınız var." 
 fp3_yearly.8033.c: "Haklısın. Buz evleri restore etmek için altın göndereceğim." 
 fp3_yearly.8033.d: "Bir dahaki sefere beni #italic gerçek#! bir sorunla rahatsız et." 
 fp3_yearly.8034.t: "Heftalit Hazinesi"
### TODO AGOT-ONLY: fp3_yearly.8034.desc [AGOT: ]
 fp3_yearly.8034.desc: ""Listen, my [ROOT.Char.GetTitleTierName]", [wronged_vassal.GetName] begs before me. "A month ago, I was surveying lands next to a river in [hephthalite_hoard_province.GetNameNoTier], when I came upon a magnificent golden treasure. I could see from the elongated skull shapes of the kings depicted on the coins, that the treasure must have been hidden by a Hunnic people, perhaps the Imperial Hephthalites, who ruled my lands not too long ago. Now, being descended from their stock, I think it is within my right to claim this treasure. But my liege [greedy_vassal.GetTitledFirstName] is contesting this. [greedy_vassal.GetSheHe|U] is trying to take the treasure from me, claiming it [greedy_vassal.GetHerHis] right as the successor to the Hephthalite overlordship of those lands. Please support me.""
 fp3_yearly.8034.a: "Bunu kolaylaştıracağız - altını #italic ben#! alacağım." 
 fp3_yearly.8034.b: "Hepsini [greedy_vassal.GetFirstNameNoTooltip] alacak." 
 fp3_yearly.8034.c: "Bir uzlaşmaya ihtiyaç var - [hephthalite_hoard_province.GetNameNoTierNoTooltip] halkına verin." 
 fp3_yearly.8034.d: "Sende kalmasına izin vereceğim - ama bu hareketimi unutma." 
 fp3_yearly.8035.t: "Kalp ve Yaratıcı"
 fp3_yearly.8035.desc: "Mehtaplı gecede huzursuzca yürürken, [sufi_mystic.GetTitledFirstName] bana katılıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", diyor, "[ROOT.GetCharacter.GetFaith.HighGodNameAlternatePossessive] sevgisine yaklaşmak ister misin? Horasan'dan bir Sufi mistikle tanıştım, bana #italic murakabe#! meditasyonunu öğretti. Bu yol kolay değildir, ancak bu sayede temel ölümlü içgüdülerinizden arınabilir, gizli bilgileri açığa çıkarabilir ve [ROOT.Char.GetFaith.ReligiousText] ve evrenle birliğin mutluluk verici hallerine yükselebilirsiniz. Size rehberlik etmeme izin verecek misiniz?""
 fp3_yearly.8035.a: "Evet, denemeye hazırım." 
 fp3_yearly.8035.b: "Bu her ne ise, kutsal olmayan bir şey olmalı." 
 fp3_yearly.8035.c: "Uyumayı tercih ederim, teşekkürler."
 fp3_unlock_meditation.tt: "İnzivada Meditasyon Yap [Concept( 'decision', 'Kararının' )|E] kilidini açar" 
 learning_muraqaba_toast.success: "#italic Murakabenin#! temellerini öğrendiniz!"
 learning_muraqaba_toast.failure: "#italic Murakabenin#! temellerini öğrenmede başarısız oldunuz!"
 fp3_yearly.8036.t: "Ağızsızlar Şehri"
 fp3_yearly.8036.desc: "Güneş battı, ben [spooky_county.GetNameNoTier]topraklarının dışında, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('superstitious_councillor'))] [superstitious_councillor.GetTitledFirstName] ile birlikte vahşi doğada ilerliyorum.\n\nAyın kasvetli ışığında, daha önce duyduğum bir yere geliyoruz. Dikili taşlardan oluşan geniş bir labirent - pürüzlü ve aralıklı - uzun zaman önce unutulmuş bir halk için bir mezar yeri veya kutsal alan görevi görmüş olmalı. Ancak taşların içine, ağızlarının olmaması dışında insan suretleri oyulmuş. Biz geçmeye çalışırken bu solmuş putlar bize soğuk soğuk bakıyor ve neredeyse hareket ediyor gibi görünüyorlar." [superstitious_councillor.GetFirstNameNoTooltip] titreyerek, "Burada oyalanmayalım," diyor. Yine de merak etmeden duramıyorum - kimdi bu insanlar? Gerçekten hayaletler var mı?"
 fp3_yearly.8036.a: "Bir süre kalıp burayı incelemeliyiz."
 fp3_yearly.8036.b: "Buradan aceleyle ayrılalım ve daha fazla muhafız bulalım..." 
 fp3_yearly.8036.c: "Sakin ol, [superstitious_councillor.GetFirstNameNoTooltip]. Bunlar sadece gölgeler ve toz." 
 fp3_yearly.8036.d: "Emin olmak için bir dua okumalıyım."
 fp3_yearly.8037.t: "Acedia için Bir Tedavi"
 fp3_yearly.8037.desc: "Ay ışığında kayıtsızca dolaşırken, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] yaklaşıyor.\n\n"Büyük [ROOT.Char.GetTitleAsNameNoTooltip]", diyor, "Son zamanlarda oldukça kederli görünüyorsunuz. Kendimi tutamadım ve bir teşhis koymaya çalıştım. Acedia'dan muzdarip olduğunuza inanıyorum, genellikle münzevileri ve bilge insanları etkileyen o sefil keyifsizlik hali. Ama benden çok daha iyi bir hekim olan bilgin [persian_polymath.GetName] var. Yakın zamanda zihin rahatsızlıkları hakkında bir kitap yazdı ve sizi tedavi edebilir.""
 fp3_yearly.8037.a: "O zaman onu getirtin, fiyatı neyse artık."
 fp3_yearly.8037.b: "Beni yalnız bırak."
 fp3_yearly.8038.t: "Kara Safra"
 fp3_yearly.8038.desc: "[SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Kampa', 'Saraya')] geldiğimden beri beni dikkatle gözlemleyen [persian_polymath.GetFirstName], artık bir teşhis koydu.\n\n"Beyinde fazla miktarda kara safra var, hükümdarım. Eskiler bile bu durumun temellerini anladılar ama Horasan ve Harezm'deki alim dostlarım uzun zamandır bunu inceliyorlar. Biz buna #italic Malihülya#! diyoruz ve sizi neşesiz ve umutsuz yapıyor. Bazı hastalar iştahsız olur ya da hayvanların davranışlarını taklit eder, ancak belki de o kadar talihsiz olmayanlar yeniliklere ve zekâya da yatkın hâle gelebilir."\n\n"Ama konudan sapıyorum... tuzlu balık ve kereviz sapından oluşan bir diyet dener misiniz? Deneyimlerimiz bunun etkili olabileceğini gösteriyor.""
 fp3_yearly.8038.a: "Pekâlâ, deneyeceğim."
 fp3_yearly.8038.b: "#italic Bu#! en iyi tedaviniz mi? Başka birini bulacağım..."
 lackluster_diet.tt: "Bu diyetteyken Kendini Yemeğe Ver [Concept( 'decision', 'Kararını' )|E] alamayacaksınız"
 fp3_yearly.8039.t: "Otlar ve Keyif"
 fp3_yearly.8039.desc: "[persian_polymath.GetFirstName] derin düşüncelere dalmış. "Reçete ettiğim diyetin bir etkisi olmamış gibi görünüyor, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Yine de ay ve yıldızlarda, muskalarda ve bu tür ilkel ilaçlarda teselli aramaktan kaçınmalısınız, çünkü bunların hiçbir etkisi yoktur. Rezene sapı, salatalık ve buhur gibi bazı şifalı bitkilerin günlük olarak tüketilmesini öneriyorum. Bunlar kara safraya karşı koyabilir, keyfinizi yerine getirebilir ve ruhani gücünüzü artırabilir ki bu da size kesinlikle fayda sağlayacaktır.""
 fp3_yearly.8039.a: "Denemeye değer gibi görünüyor."
 fp3_yearly.8039.b: "Diyetime olan inancımı korumayı tercih ederim, bunu biraz daha sürdürelim."
 fp3_yearly.8039.c: "Etkisiz çarelerinizden bıktım. Bırakın beni."
 fp3_yearly.8040.t: "Psişik Güç"
### TODO AGOT-ONLY: fp3_yearly.8040.desc [AGOT: ]
 fp3_yearly.8040.desc: ""Alas, [ROOT.Char.Custom('FormOfAddressForLiege')]", [persian_polymath.GetFirstName] says. "While I do think we have seen some improvement in your mood and your bodily condition, I have not yet cured your melancholia. Diseases of the mind are stubborn foes. Yet, there are still remedies to attempt. In my book, I stipulated that the human psyche is an independent system, that influences [persian_polymath.GetHerHis] physical aspect. We must improve your psychic potency, by proving to your subconscious that the spirit is eternal, unmarred by death. Simply put - you must reaffirm your faith in [ROOT.GetCharacter.GetFaith.HighGodNameAlternate].""
 fp3_yearly.8040.a: "Sufi öğretilerini araştıracağım."
 fp3_yearly.8040.b: "[court_chaplain.GetTitledFirstName] ile bir konuşacağım."
 fp3_yearly.8040.c: "Benim inancım hiç sarsılmadı. Beni kim sanıyorsunuz?"
 fp3_yearly.8040.d: "Bu anlamsız, git ve "çarelerini" başka yerde sat."
 fp3_refusing_faith_treatment_flavor: "Bu tedaviyi reddediyorsunuz ama [persian_polymath.GetFirstNameNoTooltip] çabalarına devam edebilir."
 fp3_yearly.8041.t: "Sessizliğin Tesellisi"
### TODO AGOT-ONLY: fp3_yearly.8041.desc [AGOT: ]
 fp3_yearly.8041.desc: ""This would be a difficult path", [sufi_mystic.GetName] declares after having been told about my troubles.\n\n"The ways of the #italic tariqa#! Sufi orders can bring great understanding about the self and the universe, but it takes tremendous discipline to attain it. I am but an initiate on the path, myself. Nevertheless, my [ROOT.Char.GetTitleTierName], we could try to achieve #italic fana#!, that state of meditation when you, being just a small drop of water in [ROOT.GetCharacter.GetFaith.HighGodNameAlternatePossessive] dream, become aware of the ocean around you. I think it could bring you a new perspective on this brief life.""
 fp3_yearly.8041.a: "Ben hazırım."
 fp3_yearly.8041.b: "Başka bir çarenin peşinden gitmeyi tercih ederim..."
 fp3_yearly.8042.t: "Ölmeyen Ruh"
### TODO AGOT-ONLY: fp3_yearly.8042.desc [AGOT: ]
 fp3_yearly.8042.desc: ""Indeed", my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName] says, "our travails and vexations in this earthly life are but fleeting things, but your spirit will endure. Though I understand, [ROOT.Char.Custom('FormOfAddressForLiege')], if that statement alone is not enough to console you."\n\n[court_chaplain.GetSheHe|U] rolls out a scroll. "This is a part of the [ROOT.Char.GetFaith.ReligiousText2], transcribed by holy [ROOT.Char.Custom('LevyMenWomen')] much wiser than us. It contains vivid descriptions of the hereafter, and verses that may contain some clues as to the meaning of it all. I suggest you study it, many times if necessary, until your soul is at peace. But if reading is not to your liking, you might visit the [ROOT.Char.GetFaith.HouseOfWorship], for an inner dialogue with [ROOT.GetCharacter.GetFaith.HighGodName].""
 fp3_yearly.8042.a: "Metinler yeterli olacaktır."
 fp3_yearly.8042.b: "Belki de [ROOT.Char.GetFaith.HouseOfWorship] benim için daha uygundur."
 fp3_yearly.8042.c: "Görünüşe göre bana yardım edemeyeceksiniz."
 fp3_yearly.8043.t: "Çözümlerin Sonu"
 fp3_yearly.8043.desc: "[persian_polymath.GetFirstName] beni haftalardır derin düşünceler içinde gözlemliyor.\n\n"Ne yazık ki, aklımın sonuna geldim, büyük [ROOT.Char.GetTitleTierName]. Sahip olduğum tüm bilgi ve beceriyi kullandım, ancak daha önce de söylediğim gibi, zihin hastalıklarını tedavi etmek çok zordur. Yine de ilerleme kaydettiğimizi düşünüyorum, çünkü huylarınız daha dengeli görünüyor ve ruhunuz güçlendi. Sabırlı olursanız ve sağlıklı miktarda balık ve reçete ettiğim bazı bitkileri tüketmeye devam ederseniz, [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] isterse, #italic Malihülya'yı#! alt edebileceğinizi düşünüyorum!"\n\n"Ama gitmeliyim, çünkü başka bir yerde peşine düşmem gereken bilgiler var.""
 fp3_yearly.8043.a: "Sana istediğin tüm kitapları alacağım. Sana hâlâ ihtiyacım var."
 fp3_yearly.8043.b: "Belki de başından beri umutsuzdu."
 fp3_polymath_stays_flavor: "[persian_polymath.GetFirstNameNoTooltip] sizin sarayınızda kalıyor."
 fp3_yearly.8044.t: "Dünyanın Işığı"
 fp3_yearly.8044.desc: "Uzun zamandır dünya bana sıkıcı ve kederli geliyordu. Eskiden zevk aldığım şeyler, anlam ve içerikten yoksun, geçici oyalanmalar gibi görünüyordu. Düşüncelerim karanlık ve kasvetli bölgelerde dolaşırdı ve rüyalarım korku doluydu. Ancak uzun süredir devam eden bu umutsuzluk kaybolmaya başladı.\n\nÇevremdeki topraklara baktığımda, bulutları delen ışığı görüyorum. Dünyanın güzelliğini ve tüm gizemlerini görüyorum. Belki asıl çözüm[persian_polymath.GetFirstName] ve bana reçete ettiği tüm tedavilerdi, belki de başka bir şey. Asla bilemeyebilirim. Ama içimde bir şeyler değişti. Kendimi yeniden bütün hissediyorum." 
 fp3_yearly.8044.a: "Bu hissin kıymetini bilmeliyim, uzun sürmeyebilir."
 fp3_yearly.8045.t: "Gizemli Paket"
### TODO AGOT-CHANGED: fp3_yearly.8045.desc [AGOT: During a moonlit stroll, I encounter my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName], cradling a bundle the size of an infant. But looks can be deceiving — odd sounds emanate from the wrappings and [buzina_enthusiast.GetNamePossessiveNoTooltip] face bears myriad scratches.\n\nThis is not a child, [ROOT.Char.Custom('FormOfAddressForLiege')], but a monkey, | TR: Mehtaplı bir gezinti sırasında, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName] ile elinde bebek büyüklüğünde bir kundakla gezerken karşılaşıyorum. Ancak görünüş aldatıcı olabilir - sargılardan tuhaf sesler çıkıyor ve [buzina_enthusiast.GetNamePossessiveNoTooltip] yüzünde sayısız çizikle kalıyor.\n\n]
 fp3_yearly.8045.desc: "During a moonlit stroll, I encounter my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName], cradling a bundle the size of an infant. But looks can be deceiving — odd sounds emanate from the wrappings and [buzina_enthusiast.GetNamePossessiveNoTooltip] face bears myriad scratches.\n\nThis is not a child, [ROOT.Char.Custom('FormOfAddressForLiege')], but a monkey," [buzina_enthusiast.GetSheHe] whispers. "While collecting taxes for the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], I accepted her as payment in lieu of gold. It is said that she previously belonged to a great Essosi king who taught her to play cyvasse. But alas, she has fallen ill and become somewhat... aggressive."\n\n[buzina_enthusiast.GetSheHe|U] hands me the bundle and continues. "Yet assuredly, under your care, she shall soon regain her health.""
 fp3_yearly.8045.a: "Hekimimin muhtemelen bir çaresi vardır..."
 fp3_yearly.8045.b: "Size altın toplamanız için para ödüyorum, #EMP maymunlar#! için değil!"
 fp3_yearly.8045.c: "Bunu bilmiyorum..."
 sick_monkey_flavor_desc: "Satranç oynayabilen bir maymun kesinlikle eğlenceli olurdu"
 playing_with_monkey.tt: "Maymunla Oyna [Concept( 'decision', 'Kararını' )|E], maymuna sahip olduğunuz sürece açar"
 fp3_inspired_tax_collector: "[buzina_enthusiast.GetShortUIName] vergi toplamada daha iyi olmak için çabalıyor"
 fp3_yearly.8046.t: "Maymun Tıbbı"
### TODO AGOT-ONLY: fp3_yearly.8046.desc [AGOT: ]
 fp3_yearly.8046.desc: ""As far as I know", [court_physician.GetName] says, "monkeys are the spawn of Rizdak, the first man. Their bodily condition is similar to our own, and perhaps their spiritual condition too. Some, I've heard, can even talk!"\n\n"I should be able to cure this little one of her ailment, but the best method would be a concoction of herbs that is expensive to procure. The alternative would be a diet of salted fish and frankincense..."\n\n[court_physician.GetSheHe|U] eyes the monkey's razor-like claws with great concern."
 fp3_yearly.8046.a: "Hiçbir masraftan kaçınmayın."
 fp3_yearly.8046.b: "O güçlü, sağlıklı bir diyet yeterli olacaktır."
 fp3_wait_and_see.tt: "Tedavinin etkili olup olmadığını sadece zaman gösterecek"
 monkey_recover_better_chances_tt: "Maymunun iyileşme şansı artacak"
 playing_chess_with_monkey.tt: "Artık maymun yaşadığı sürece Masa Oyununda Meydan Oku [Concept( 'interaction', 'Etkileşimini' )|E] kullanabilirsiniz."
 fp3_yearly.8047.t: "Daha İyi Hissetmek"
 fp3_yearly.8047.desc: "Hekimim, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName] tarafından daha önce getirilen hasta maymunu tutarak bana geliyor.\n\n"Efendim, maymunun yaşama sevincini yeniden kazandığını ve öfkesinin yumuşadığını bildirmekten mutluluk duyuyorum. Her ne kadar satrançta bir #EMP usta#! gibi görünmese de, oyunu bir şekilde oynamak için eğitildiği kesin."\n\nBu maymun oyunda usta olmasa bile, insanlar böyle bir eğitim harikasına tanık olmak için çok uzaklardan gelecekler..."
 fp3_yearly.8047.a: "Davetiyeleri gönderme zamanı!"
 monkey_died_from_sickness_toast: "Evcil maymununuz hastalığı yüzünden öldü."
 fp3_yearly.8050.t: "Ölülerin Kaderi"
 fp3_yearly.8050_zoroastrian.desc: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] olarak çürümenin daeva'sı Nasu'nun etkisiyle savaşmak gibi kutsal bir görevimiz var. Bu nedenle [dakhma_enthusiast.GetCouncilTitle] [dakhma_enthusiast.GetFirstName], [dakhma_county.GetName] topraklarından getirdiği haberlerle oldukça ilgili görünüyor." 
 fp3_yearly.8050_unzoroastrian.desc: "[dakhma_county.GetName] topraklarındaki Zerdüşt tebaamın cenaze uygulamaları hakkında şikayetler var ve [dakhma_enthusiast.GetCouncilTitle] [dakhma_enthusiast.GetFirstName] özellikle endişeli görünüyor."
 fp3_yearly.8050_early_period.desc: "\n\n"Bilge hükümdarım, geçmişte" diye başlıyor, "gelenek, ölülerin cesetlerini üç kutsal elementi kirletemeyecekleri vahşi doğada açıkta bırakmaktı. "\n\n"Ancak [dakhma_county.GetNameNoTierNoTooltip] topraklarında yerleşim büyüdükçe, artık yeterli alan kalmadı ve insanlar yanlışlıkla ölüleri rahatsız etmeye başladı. Ölülerin güvenli bir şekilde barındırılabileceği, sadece toz kalana kadar köpeklere ve leş kuşlarına maruz kalabileceği bir #italic dahme#!, bir Sessizlik Kulesi inşa etmeliyiz.""
 fp3_yearly.8050_late_period.desc: "\n\n"Uzun zaman önce, bilge hükümdarım" diye lafa giriyor, "[dakhma_county.GetNameNoTierNoTooltip] topraklarında küçük bir #italic dahme#! inşa edildi, burada ölü bedenler elementlere ve leş kuşlarına maruz kalabiliyordu. Ancak bu kule eski ve yıkılmaya yüz tutmuş durumda ve cesetlerin dışarı sızarak üç kutsal elementi kirletmesinden endişe ediliyor."\n\n"Yerel halk, ölülerinin güven içinde yaşayabileceği yeni bir kule inşa etmelerine yardımcı olursak çok memnun olacaktır.""
 fp3_yearly.8050.a: "Mimarım [architect.GetFirstNameNoTooltip] bazı konularda yardımcı olabilir..."
 fp3_yearly.8050.b: "Elbette, hazinemin bir kısmıyla buna katkıda bulunabilirim."
 fp3_yearly.8050.c: "O kâfirler ölülerini bir hendeğe bırakabilirler, umurumda değil."
 fp3_yearly.8050.d: "Kulağa pahalı geliyor. Geçmişte işe yarayan şey şimdi de işe yarayabilir."
 fp3_zoroastrian_courtiers_and_vassals_happy: "Dindar [GetReligionByKey('zoroastrianism_religion').GetAdjective] [courtiers|E], [guests|E] ve [Concept( 'vassals', 'Vasalların' )|E] sizin hakkınızdaki [Concept( 'opinion', 'görüşü' )|E] artacaktır."
 building_a_dakhma.failure: "[architect.GetFirstName], hatalı bir Sessizlik Kulesi tasarladı" 
 building_a_dakhma.success: "[architect.GetFirstName], işlevsel bir Sessizlik Kulesi tasarladı" 
 fp3_cheap_architecture_flavor: "Ne kadar ucuz o kadar iyi!"
