### TODO AGOT-CHANGED: fp3_scholarship.1000.desc [AGOT: The prestige of Qartheen mathematics have reached my ears, uttered by even the lowliest students of arithmetic. Were I to fill my court halls with [nearby_indian_ruler.GetCulture.GetName] scholars, then perhaps [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] could become a center of mathematics in its own right.\n\nI might ask [nearby_indian_ruler.GetTitledFirstName] to send me several such scholars, but would [nearby_indian_ruler.GetSheHe] accept such a proposal? | TR: Hint matematiğinin saygınlığı kulaklarıma ulaştı, en düşük seviyedeki aritmetik öğrencileri tarafından bile dile getirildi. Saray salonlarımı [nearby_indian_ruler.GetCulture.GetName] bilginleriyle doldurursam, belki [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] kendi başına bir matematik merkezi hâline gelebilir.\n\n[nearby_indian_ruler.GetTitledFirstName], bana böyle birkaç bilgin göndermesin diye istekte bulunabilirim ama böyle bir teklifi kabul eder mi?]
 fp3_scholarship.1000.desc: "The prestige of Qartheen mathematics have reached my ears, uttered by even the lowliest students of arithmetic. Were I to fill my court halls with [nearby_indian_ruler.GetCulture.GetName] scholars, then perhaps [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] could become a center of mathematics in its own right.\n\nI might ask [nearby_indian_ruler.GetTitledFirstName] to send me several such scholars, but would [nearby_indian_ruler.GetSheHe] accept such a proposal?"
 fp3_scholarship.1000.a: "İsteğimi kesinlikle reddetmeyecektir."
 fp3_scholarship.1000.b: "Cömert bir hediye teklifi tatlandıracaktır."
 fp3_scholarship.1000.c: "[ROOT.Char.GetCulture.GetNameNoTooltip|U] âlimlerinin [nearby_indian_ruler.GetCulture.GetNameNoTooltip] yardımına ihtiyacı yoktur!"
 fp3_scholarship.1000.duel_success: "[nearby_indian_ruler.GetNameNoTooltip] isteğimi kabul ediyor"
 fp3_scholarship.1000.duel_success_tt: "Birkaç [nearby_indian_ruler.GetCulture.GetNameNoTooltip] matematikçi kısa süre içinde sarayıma gelecek"
 fp3_scholarship.1000.duel_failure: "[nearby_indian_ruler.GetNameNoTooltip] küstahlığımla alay ediyor"
 fp3_scholarship.1000.gift_failure: "[nearby_indian_ruler.GetNameNoTooltip] hediyemi kendine saklıyor"
 fp3_scholarship.1000.native_tt: "[SCOPE.GetRootScope.GetCharacter.GetCulture.GetNameNoTooltip] kültüründen bir Matematikçi, maddi desteğimiz sayesinde saraya yükseltilecek."
 fp3_scholarship.1001.t: "Matematikçi Geldi"
 fp3_scholarship.1001.desc: "[mathematician.GetTitledFirstName], [nearby_indian_ruler.GetTitledFirstNameNoTooltip] tarafından sarayıma katılması için gönderildi."
 fp3_scholarship.1001.native.desc: "[mathematician.GetTitledFirstName] sarayıma katıldı."
 fp3_scholarship.1000.d: "Bunun için ne zamanım ne de isteğim var."
 fp3_scholarship.1010.t: "Yalnız Büyücü"
### TODO AGOT-ONLY: fp3_scholarship.1010.desc_dying_faith [AGOT: ]
 fp3_scholarship.1010.desc_dying_faith: ""We merely wish to practice our faith in peace to the last of our days. Should you promise us this, I personally will serve you until my heart beats no more."\n\nThough the [magus_faith.GetName] faith is surely dying, still the errant worshipers seem to persist in the abandoned fire temples of [magus_county.GetProvince.GetCounty.GetName]. This priest has now thrown himself before my [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], begging for my mercy.\n\n"
### TODO AGOT-ONLY: fp3_scholarship.1010.desc_living_faith [AGOT: ]
 fp3_scholarship.1010.desc_living_faith: ""Have mercy! We merely wish to honor our ancestors. Should you grant us protection, then I promise to personally serve you until my dying day."\n\nThe [magus_faith.GetName] faith remains a thorn in my side, it seems the fire temples of [magus_county.GetProvince.GetCounty.GetName] grow hot once more under the cover of night. My [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] and I seem to have caught a renegade magus in his inscrutable rituals, but rather than flee he bravely throws himself before me."
 fp3_scholarship.1010.a: "Asla, [ROOT.Char.GetFaith.HighGodName] senin düşüşünü emrediyor!"
 fp3_scholarship.1010.b: "[magus_county.GetNameNoTooltip] için koruma sağlayacağım."
 fp3_scholarship.1010.b.tt: "[magus_county.GetNameNoTooltip] toprağının 20 yıl boyunca mezhebi değiştirilemez\n[magus.GetShortUINameNoTooltip] adlı kişinin mezhebi asla değiştirilemez"
 fp3_scholarship.1010.c: "Gelecek için söz veremem ama gitmenize izin verebiliriz."
 fp3_scholarship.2000.t: "Ağırlığına Değer"
 fp3_scholarship.2000.desc: "Doğu'dan gelen kağıt arzı neredeyse tamamen kurudu, bazı küçük şairler düşüncelerini kaydetmek için palmiye yapraklarına ve ağaç kabuklarına başvuruyor. Yakında Saray Alimim [court_scholar.GetTitledFirstName] bile altın yaprakları güvenilir bir şekilde elde edemeyecek."\n\n"Parşömene geri dönebilirim, sanırım ama bu günlerde elde etmek çok zor. Daha fazla kağıt kesinlikle daha iyi bir çözüm olurdu...""
 fp3_scholarship.2000.a: "Amaçlarınız için tüm kağıtlara el konulacaktır."
 fp3_scholarship.2000.b: "O zaman kağıdı ithal etmeliyiz."
 fp3_scholarship.2000.c: "Elinizdekilerle yetinmek zorunda kalacaksınız."
 fp3_scholarship.2010.t: "Sıvı Bilgelik"
 fp3_scholarship.2010.desc: "Denetçilerimin dediğine göre bana Saray Alimim [court_scholar.GetTitledFirstName], yabancı bir alimle gizlice içki içerken görülmüş.\n\nBaşka biriyle olsaydı, anlaşmayı bozar ve [court_scholar.GetTitledFirstNameNoTooltip] asla unutamayacağı bir ders alırdı. Ancak irfan arkadaşı ile aydınlatıcı bir sohbete dalmış gibi görünüyor ya da bana öyle söylendi."
 fp3_scholarship.2010.a: "[ROOT.Char.GetFaith.HighGodNamePossessive] karşısındaki sorumluluklarımız her şeyden önce gelir."
 fp3_scholarship.2010.b: "Belki de sadece çay içiyorlardır?"
 fp3_scholarship.2020.t: "Dehşet Verici Bulgular"
### TODO AGOT-ONLY: fp3_scholarship.2020.desc [AGOT: ]
 fp3_scholarship.2020.desc: ""My studies have hit an impasse," my Court Scholar [court_scholar.GetTitledFirstNameNoTooltip] tells me [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', court_scholar)]. "There is only so much to be gleaned from books. But if you only lend me [specimen.GetTitledFirstName] for a short while, then I'm sure that we can reach a breakthrough together."\n\n[court_scholar.GetSheHe|U] cannot guarantee [specimen.GetTitledFirstNamePossessiveNoTooltip] safety."
 fp3_scholarship.2020.a: "Tam iznimi aldınız."
 fp3_scholarship.2020.b: "Çarpık deneylerinizi notlarınızın içinde saklayın."
 fp3_scholarship.2030.t: "Bulgular Yayınlandı"
### TODO AGOT-ONLY: fp3_scholarship.2030.desc [AGOT: ]
 fp3_scholarship.2030.desc: ""...and so it is with great pleasure that I can report on my steady progress in understanding [ROOT.Char.Custom('education_conversation_subject')]."\n\nSometimes it can be hard to justify keeping scholars on our payroll. Their work so rarely directly benefits the realm.\nNo doubt this is something my Court Scholar [court_scholar.GetName] is quite aware of [court_scholar.GetHerselfHimself]. Today's detailed progress report is delivered with such enthusiasm that it borders on the insincere."
 fp3_scholarship.2030.a: "İlerleme sadece iyi bir şey olabilir"
 fp3_scholarship.2030.tt: "[court_scholar.GetNameNoTooltip] sizin bölgenizdeki yüksek öğrenim merkezlerinden yararlandı."
 fp3_research_project_title: "Araştırma:"
 fp3_scholarship_research_success_loss_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] #N daha düşük#! başarı ihtimaline sahip olacak"
 fp3_scholarship_research_success_slight_loss_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] #N biraz daha düşük#! başarı ihtimaline sahip olacak"
 fp3_scholarship_research_success_gain_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] #P daha yüksek#! başarı ihtimaline sahip olacak"
 fp3_scholarship_research_success_slight_gain_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] #P biraz daha yüksek#! başarı ihtimaline sahip olacak"
 fp3_scholarship.8000.t: "Yeni Bir $game_concept_research_project$"
### TODO AGOT-CHANGED: fp3_scholarship.8000.desc [AGOT: My Court Scholar [court_scholar.GetName] rushes to me with several servants in tow, all of them carrying books, scrolls, or ancient parchments.\n\nI believe I can reach a breakthrough, if only given enough time, ample funds, and enough ink to color the Rhoyne black. | TR: Saray Alimim [court_scholar.GetName] yanında birkaç hizmetkârla bana doğru koşuyor, hepsinin elinde kitaplar, tomarlar veya eski parşömenler var.\n\n]
 fp3_scholarship.8000.desc: "My Court Scholar [court_scholar.GetName] rushes to me with several servants in tow, all of them carrying books, scrolls, or ancient parchments.\n\nI believe I can reach a breakthrough, if only given enough time, ample funds, and enough ink to color the Rhoyne black."
 fp3_scholarship.8000.a: "Dizginleri eline al, [court_scholar.GetFirstNameNoTooltip]."
 fp3_scholarship.8000.b: "Belki başka bir zaman?"
 fp3_scholarship.8000.a.tt: "[court_scholar.GetFirstNameNoTooltip] bir [research_project|E] üstlenmeye başlayacak."
 fp3_scholarship.8500.t: "Altının Cazibesi"
### TODO AGOT-ONLY: fp3_scholarship.8500.desc [AGOT: ]
 fp3_scholarship.8500.desc: ""I am certain that I can uncover the secrets of creation itself, if you will only supply me with the right tools and assistants!"\n\n[court_scholar.GetName], my Court Scholar, has been talking for some time now. [court_scholar.GetSheHe|U] is imploring me to let [court_scholar.GetHerHim] spend #EMP my gold and silver#!, on trying to uncover the secrets of how elements, such as #EMP gold#! and #EMP silver#!, are made.\n\n[court_scholar.GetFirstNameNoTooltip] is clearly very excited, and it is very impressive that [court_scholar.GetSheHe] has managed to make any sense of such cryptic notes as the ones [court_scholar.GetSheHe] has deciphered on this subject, but it is not clear if this will be a profitable endeavor"
 fp3_scholarship.8500.a.tt: "[court_scholar.GetFirstNameNoTooltip] bir Simya [Concept( 'inspiration', 'İlhamına' )|E] başlayacak"
 fp3_scholarship.8600.t: "Yazılı Sözün Gücü"
### TODO AGOT-ONLY: fp3_scholarship.8600.desc [AGOT: ]
 fp3_scholarship.8600.desc: ""Your continued support is very noble and selfless as it is, but brilliant observations that are not written down risk being forgotten! Who will know of my thoughts when I am dead and can no longer speak of them? The world would be a poor place if they were not preserved."\n\n[court_scholar.GetName], my Court Scholar has a new project. [court_scholar.GetSheHe|U] wants to convince me to fund the creation of a new book. A lavish manuscript which [court_scholar.GetSheHe] claims will make my rivals pale with envy.\nPerhaps this idea is as much for [court_scholar.GetHerHis] prestige as it is for mine, but that does not mean it is necessarily a bad idea..."
 fp3_scholarship.8600.a.tt: "[court_scholar.GetFirstNameNoTooltip] bir Kitap yazmak için [inspiration|E] elde edecek"
 fp3_scholarship.8999.tt_failure: "[court_scholar.GetShortUINameNoTooltip] ve yaptığı araştırma yararlı bir şey üretemiyor"
 fp3_scholarship.8999.tt_success: "[court_scholar.GetShortUINameNoTooltip], [THIS.Char.GetHouse.GetNameNoTooltip] hanesi için küçük bir bilimsel atılım yapıyor"
 fp3_scholarship.8999.tt_crit_success: "[court_scholar.GetShortUINameNoTooltip], [THIS.Char.GetCulture.GetName] kültürü için yeni bir buluş keşfetti"
 fp3_scholarship.8100.t: "$fp3_research_project_title$ Daha İyi Bir Kütüphane"
 fp3_scholarship.8100.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sararmış parşömenler ve solmuş kitaplardan oluşan bir yığın getirerek kraliyet kütüphanesinin durumundan durmadan şikayet etti.\n\n"Bu metinlerden bazıları yüzlerce yıl, hatta daha da geride kaldı. Böyle antik kitaplarla en son araştırmaları nasıl yürütebilirim?""
 fp3_scholarship.8100.a: "Kraliyet kütüphanesi gönlünüzce donatılacaktır."
 fp3_scholarship.8100.b: "Kraliyet kütüphanesi hâlihazırda mükemmeldir."
 fp3_scholarship.9000.t: "$fp3_research_project_title$ Başarısızlık"
### TODO AGOT-ONLY: fp3_scholarship.9000.desc [AGOT: ]
 fp3_scholarship.9000.desc: ""It's no use!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] cries out to me. [inspiration_owner.GetHerHis|U] eyes are dark from countless sleepless nights.\n\n"I can't see beyond the seas of numbers. I'll have to abandon this project, at least for the time being.""
 fp3_scholarship.9000.a: "Pekâlâ o zaman."
 fp3_scholarship.9000.b: "Sana araştırma yapman için para ödüyorum, bahane uydurman için değil!"
 fp3_scholarship.9100.t: "$fp3_araştırma_proje_başlığı$ Yeni Bir Keşif"
### TODO AGOT-ONLY: fp3_scholarship.9100.desc [AGOT: ]
 fp3_scholarship.9100.desc: ""[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]! My work is done."\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] goes at length about their discoveries, and how it might affect our realm. I try to get a word in edge-wise, but to no avail.\n\nWhen [inspiration_owner.GetSheHe] finally sits down, I can see my own confusion reflected in the eyes of my courtiers, but I still give the only answer I can think of."
 fp3_scholarship.9100.a: "Aferin, [inspiration_owner.GetShortUINameNoTooltip]."
 fp3_scholarship.9200.t: "$fp3_research_project_title$ Yeni Bir Buluş"
### TODO AGOT-ONLY: fp3_scholarship.9200.desc [AGOT: ]
 fp3_scholarship.9200.desc: ""[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]!" cries out to me. I turn and find [inspiration_owner.GetHerHis] eyes weary with joy and arms full with scrawlings; [inspiration_owner.GetHerHis] work is done.\n\nI will only understand later the significance of [inspiration_owner.GetHerHis] discovery, and I will not live long enough to see them change all of history. But for now, it suffices for me to say:"
 fp3_scholarship.9200.a: "Çok iyi iş çıkardınız." 
 fp3_scholarship.9900.t: "$fp3_research_project_title$ Çöpe Gitti"
 fp3_scholarship.9900.tt: "[court_scholar.GetShortUIName|U] vefat etti ve araştırmasına devam edemiyor."
 fp3_scholarship.9901.tt: "[court_scholar.GetShortUIName|U] artık benim Saray Alimim değil ve araştırmasına devam edemiyor."
 fp3_h_yearly.0001.t: "Al-Khul'un Cazibesi"
 fp3_h_yearly.0001.desc.main: "Elimde bir bardak [ROOT.Char.Custom('RegionalAlcoholicDrink')] ile [ROOT.GetCharacter.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip] topraklarındaki [ROOT.Char.Custom('FortifiedBuilding')] içindeki sakin bir köşede dinlenirken, [ROOT.Char. Custom2('RelationToMePossessive', ulema_member)] [ulema_member.GetName] sert bir ifadeyle yaklaşıyor.\n\n"#italic al-khul#! takıntınız utanç verici!\nBu saraydaki insanların yarısı size olan saygısını kaybetti ve diğer yarısı da kendi ahlak anlayışını kaybetti! Sokaklarda ahlaksızlar inancımızın kurallarını açıkça çiğniyor, bu saraydaki efendilerinin günahlarının bir yansıması!"\n\n[ulema_member.GetNameNoTooltip|U] şimdi öfkeleniyor, bağırıyor ve dikkat çekiyor. Bazı saray mensupları öfkeli din adamının dikkatini çekmemek için kendi bardaklarını sessizce yere bırakıyor."
 fp3_h_yearly.0001.a: "Bir başka [ulema_member.Custom('RegionalAlcoholicDrink')] kölesi için cesur sözler!"
 fp3_h_yearly.0001.a.notif.t: "Dediğimi yap, yaptığımı değil!"
 fp3_h_yearly.0001.b: "[ROOT.Char.Custom('RegionalAlcoholicDrink')] zihni engelleyebilse de, ruhu rahatlatır."
 fp3_h_yearly.0001.bb: "İçki içmek her [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] için neşe kaynağıdır. Bu zevk olmadan var olamayız!"
 fp3_h_yearly.0001.b.desc: "[ulema_member.GetFirstNameNoTooltip] ve sarayınızı içki içmenin faydalı olabileceğine ikna etmeye çalışıyorsunuz"
 fp3_h_yearly.0001.b.success: "[ulema_member.GetFirstNameNoTooltip] üzerindeki küçük düşürme girişiminiz başarılı oldu"
 fp3_h_yearly.0001.b.failure: "Kendini aptal yerine koyuyorsunuz"
 fp3_h_yearly.0001.c: "Hayırsever bir bağış yapmak istiyorum"
 fp3_h_yearly.0001.c.tt: "[ulema_member.GetNameNoTooltip] için rüşvet vermeye çalışıyorsunuz."
 fp3_h_yearly.0001.c.success: "Bağış [ulema_member.GetNameNoTooltip] ve itirazlarını susturuyor."
 fp3_h_yearly.0001.c.failure: "[ulema_member.GetNameNoTooltip] rüşveti reddediyor"
 fp3_h_yearly.0001.d: "Ben sadece bir günahkârım ama kendimi iyileştirmeye çalışacağım."
 fp3_h_yearly.0001.e: "Sessizlik! Kiminle konuştuğunu unutuyorsun."
 fp3_story_cycle_seljuks_invasion_events.0001.t: "Umutsuz Göçebeler"
 fp3_story_cycle_seljuks_invasion_events.0001.desc: "[lead_seljuk.GetCulture.GetNameNoTooltip] sınır topraklarından gelen göçebeler önümde yalvarmaya geldiler. [fp3_seljuk_settle_target.GetNameNoTier] topraklarına"
 fp3_story_cycle_seljuks_invasion_events.0001.desc_vassal: " benim tebaam olarak yerleşmek istiyorlar, "büyük gölgemde dinlenmek" karşılığında sadakatlerini ve savaştaki uzmanlıklarını sunuyorlar."\n\nÇaresizlikleri ortada. Gidebilecekleri başka bir yer olmadığından, isteklerini reddetmek kaçınılmaz olarak çatışmaya yol açacaktır."
 fp3_story_cycle_seljuks_invasion_events.0001.desc_independent: " benim yeni komşularım olarak yerleşmek istiyorlar, karşılığında savaştaki uzmanlıklarını sunuyorlar.\n\nÇaresizlikleri ortada. Ancak acımasız ordularına bakarsak bir istek değil de bir ültimatom gibi duruyor."
 fp3_story_cycle_seljuks_invasion_events.0001.a_liege: "Efendinin çağrısına cevap verdiğin sürece, [fp3_seljuk_settle_target.GetNameNoTierNoTooltip] senin olacak."
 fp3_story_cycle_seljuks_invasion_events.0001.a: "[fp3_seljuk_settle_target.GetNameNoTierNoTooltip] artık senin. Hoşgeldin komşum!"
 fp3_story_cycle_seljuks_invasion_events.0001.b: "Asla! Topraklarımın sizin pisliğiniz tarafından işgal edilmesine izin vermeyeceğim!"
fp3_story_cycle_zanj_rebellion_events.0002.t: "Açıksözlü Asi"
fp3_story_cycle_zanj_rebellion_events.0002.desc: "[outspoken_rebel.GetName], daha önce Bahreyn'de isyan girişiminde bulunduğu bilinen karizmatik bir isyancı, şimdi [outspoken_rebel.GetCurrentLocation.GetCounty.GetName] topraklarında görüldü.\n\nKendini kutsal ilan eden bu adam tuzlu bataklıklarda dolaşıyor ve yerel halkla sorun çıkarıyor. Bunların arasında Afrika'nın doğu topraklarından gelen ve çoğu köle ya da özgür olarak çalışan Zenc halkı da var. Bu, onu yakalamak ve cezalandırmak için bir şans olabilir."
fp3_story_cycle_zanj_rebellion_events.0002.a: "Onun için bir tuzak kuracağız."
fp3_story_cycle_zanj_rebellion_events.0002.a.success: "Ayaktakımını tutukluyorsunuz"
fp3_story_cycle_zanj_rebellion_events.0002.a.failure: "Elinizden kaçıyor"
fp3_story_cycle_zanj_rebellion_events.0002.a.failure.tt: "Davası daha fazla takipçi kazanacak"
fp3_story_cycle_zanj_rebellion_events.0002.c: "Onu görmezden gelin, zararsızdır."
fp3_story_cycle_zanj_rebellion_events_cause_strengthened_tt: "[outspoken_rebel.GetName] ve davası güçlendi"
fp3_story_cycle_zanj_rebellion_events_cause_greatly_strengthened_tt: "[outspoken_rebel.GetName] ve davası büyük ölçüde güçlendi"
fp3_zanj_rebellion_opressed_me: "Sizin tarafınızdan ezildi"
fp3_story_cycle_zanj_rebellion_leaves_for_baghdad: "[outspoken_rebel.GetName] Bağdat için ayrılıyor"
fp3_story_cycle_zanj_rebellion_events.0004.t: "İlahiyat İddiaları"
fp3_story_cycle_zanj_rebellion_events.0004.desc: "[zanj_leader.GetName], kötü şöhretli bir baş belası, Bağdat'ta ortaya çıktı. Başarısız bir isyan başlatma girişiminden sonra Basra'dan kaçtı. Bu küstah kışkırtıcı, Zeyd bin Ali'nin soyundan geldiğini ve dolayısıyla Peygamber'in hanesinin bir parçası olduğunu iddia ediyor.\n\nBu iddialar gülünç olsa da, düşmanlarım bunlara itibar etmeyi ve bu sonradan görmenin kendi yönetimimin meşruiyetine dair şüpheler uyandırmasını uygun bulabilir."
fp3_story_cycle_zanj_rebellion_events.0004.a: "Onun iddialarını çürüteceğim."
fp3_story_cycle_zanj_rebellion_events.0004.a.success: "Onun sahtekar olduğunu kanıtlıyorsunuz"
fp3_story_cycle_zanj_rebellion_events.0004.a.failure: "Onun abartılı iddiasının yanlış olduğunu kanıtlayamıyorsunuz"
fp3_story_cycle_zanj_rebellion_events.0004.b: "Bu aptalı görmezden geleceğim."
fp3_story_cycle_zanj_rebellion_events.0006.t: "Bir Zenc İleri Adım Atıyor"
fp3_story_cycle_zanj_rebellion_events.0006.desc.a: "[zanj_representative.GetName], Basra'nın tuzlu bataklıklarını kurutmakla görevli Zenc işçilerinin lideri, daha iyi çalışma koşulları için yalvararak bana geliyor. Nesillerdir bölgede bulunuyorlar ve Basra'da önemli bir azınlık oluşturuyorlar.\n\n"
fp3_story_cycle_zanj_rebellion_events.0006.desc.b: "[zanj_leader.GetName] ve asi söylemlerinin artan hoşnutsuzluklarıyla bir ilgisi olabileceğinden şüpheleniyorum.\n\n"
### TODO AGOT-ONLY: fp3_story_cycle_zanj_rebellion_events.0006.desc.c [AGOT: ]
fp3_story_cycle_zanj_rebellion_events.0006.desc.c: ""My [ROOT.Char.GetTitleAsName], please, does [ROOT.Char.GetFaith.HighGodName] not value the dignified treatment of workers, regardless of their origin?""
fp3_story_cycle_zanj_rebellion_events.0006.a: "Sıkı çalışmanızın karşılığını alacaksınız."
fp3_rival_gave_title_away: "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName] adlı kişiye ait araziyi verdi."
fp3_landed_zanj_reason: "Barış için toprak takası"
fp3_story_cycle_zanj_rebellion_events.0006.b: "Küçük tavizler verebilirim..."
fp3_zanj_rebellion_interfered_with_my_workers: "[CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName] adlı kişinin iş gücüne müdahale etti."
fp3_story_cycle_zanj_rebellion_events.0006.c: "Zenc'in hayattaki kaderi budur."
fp3_rival_stayed_out_of_my_business: "[CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.GetShortUIName] işinden uzak durdu."
fp3_story_cycle_zanj_rebellion_events.0008.t: "Zenc İsyanı"
fp3_story_cycle_zanj_rebellion_events.0008.desc.a: "Basra'nın tuzlu bataklıklarında açık isyan haberleri bana ulaştı."
fp3_story_cycle_zanj_rebellion_events.0008.desc.b: "[zanj_leader.GetName], birçok kişinin zararsız bir şarlatan olduğunu düşündüğü, memnuniyetsiz Zenc işçilerini ve asi Arap kabilelerini sancağı altında birleştirmeyi başardı. [zanj_leader.GetCulture.GetName] olmasına ve bir Zenc olmamasına rağmen, isyancılar onu bir lider olarak görmeye başladılar."
fp3_story_cycle_zanj_rebellion_events.0008.desc.c: "[zanj_leader.GetName], özellikle açık sözlü bir Zenc, aşırı çalışan işçileri ve asi Arap kabilelerini sancağı altında birleştirdi. [zanj_leader.GetCulture.GetName] olmasına ve Arap olmamasına rağmen, isyancılar onu bir lider olarak görmeye başladılar."
fp3_story_cycle_zanj_rebellion_events.0008.desc.d: "\n\nBasra'ya doğru nehirde yüzen bir mavna ayarladılar ve üzerine Zenc'in öldürülen efendilerinin başlarını koydular. Otoriteme karşı açık bir meydan okuma."
fp3_story_cycle_zanj_rebellion_events.0008.a: "Arvand bir kan nehri olacak."
