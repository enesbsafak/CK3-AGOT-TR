 fp3_yearly.2060.t_madrasas: "Temple Schools"
 fp3_yearly.2060.t_houses_of_worship: "[ROOT.Char.GetFaith.HouseOfWorship|U] Okulları"
 fp3_yearly.8000.t: "Yoldan Sapmış Gazi"
 fp3_yearly_non_islamic.t: "Sınır İçin Bir Savaşçı mı?"
 fp3_yearly.8000.desc_opening: "[raging_ghazi.GetFirstName] dinsizlerle savaşmak için sınıra giden, kendine özgü #italic gazilerden#! biriydi."
 fp3_yearly.8000.desc_unislamic_opening: "[raging_ghazi.GetFirstName], barbarlarla savaşmak için sınıra giden #italic [ROOT.Char.GetFaith.WarGodNamePossessive] askerlerinden#! biriydi."
 fp3_yearly.8000_dancing_girl.desc: "[murder_barony.GetNameNoTier] kasabasında içki alemine gittiğinde. Orada, çok sarhoş bir hâlde, bir kavgaya karıştı ve bir hancıyı, dans eden bir kızı ve evcil maymununu öldüresiye dövdü.\n\n"
 fp3_yearly.8000_bath_inspector.desc: "[murder_barony.GetNameNoTier] kasabasında fahişeler ve alçaklarla eğlenmeye gittiğinde. Bu itibarsız toplulukta, bir muhafız ve bir hamam müfettişi ile tartışmaya girdi ve ikisini de bıçaklayarak öldürdü.\n\n"
 fp3_yearly.8000_townsfolk.desc: "[murder_barony.GetNameNoTier] kasabasında bazı boğucu şarlatanlar tarafından kandırılıp soyulduğunda. Öfkesini yerel pazarda çıkardı, bir çay satıcısını ve bir eşeği yastıklı bir tabure ile öldüresiye dövdü.\n\n"
### TODO AGOT-ONLY: fp3_yearly.8000.desc [AGOT: ]
 fp3_yearly.8000.desc: ""This [raging_ghazi.GetWomanMan] must be punished severely", my upstanding [righteous_marshal.GetCouncilTitle] [righteous_marshal.GetFirstName] says, "to appease the good townsfolk of [murder_barony.GetNameNoTierNoTooltip]."\n\n"No", [raging_ghazi.GetFirstNameNoTooltip] begs, hanging from chains in my dungeon, "you must allow me to go to the frontier, for that is [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] purpose.""
 fp3_yearly.8000.a: "Ben de kutsal yolda yürüdüm - huzur içinde git."
 fp3_yearly.8000.b: "Sadece senin için yeni ve güzel bir hücrem var!"
 fp3_yearly.8000.c: "Senin gibi yetenekli bir adamı kullanabilirim..."
 fp3_yearly.8000.flavor.a.tt: "[raging_ghazi.GetFirstNameNoTooltip], şehitlik arayışına devam edebilsin diye izin veriyorsun."
 fp3_yearly.8000.flavor.b.tt: "Bu kasaba halkını yatıştıracaktır."
 fp3_yearly.8001.t: "Sınır Kalesi Hayırseveri"
 fp3_yearly.8001.desc: "İhtiyatlı [concerned_councillor.GetCouncilTitle] [concerned_councillor.GetFirstName] son zamanlarda sınır savunmalarımızın durumu konusunda endişelenmeye başladı.\n\n"Bir an önce [frontier_fort_county.GetName] topraklarındaki kaleleri ziyaret etmelisiniz, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Bu, aksi takdirde oldukça umutsuzluğa kapılan askerlerinizin moralini büyük ölçüde düzeltecektir."\n\nDuraksıyor. "Ancak küçük bir hastalık salgını hakkında tamamen asılsız söylentiler olduğunu da belirtmeliyim...""
 fp3_yearly.8001.a: "Pekâlâ, ben gideyim."
 fp3_yearly.8001.b: "Eşim [dutiful_spouse.GetFirstName] daha fazla göreve ihtiyaç duyuyor, kendisi gidebilir."
 fp3_yearly.8001.c: "Birkaç gün içinde gideceğim..."
 fp3_yearly.8001.d: "Sınır askerler ve yerleşimciler içindir, benim için değil."
 convincing_councillor_toast.success: "[concerned_councillor.GetFirstName] size güveniyor"
 convincing_councillor_toast.failure: "[concerned_councillor.GetFirstName], onu aptal yerine koyduğunuzu düşünüyor"
 delegated_fortress_inspection_toast.success: "[dutiful_spouse.GetFirstName] askerler üzerinde iyi bir izlenim bıraktı"
 delegated_fortress_inspection_toast.failure: "[dutiful_spouse.GetFirstName] askerleri cesaretlendirmede başarısız oldu"
 fp3_yearly.8001.flavor.b.tt: "[concerned_councillor.GetFirstNameNoTooltip], [Select_CString(dutiful_spouse.IsFemale, 'Kadınların', 'Erkeklerin' )] savaş rollerinde olmasını onaylamıyor."
 fp3_yearly.8001.flavor.c.tt: "Aslında niyetiniz bu değil."
 fp3_yearly.8002.t: "Sınırda İnanç"
 fp3_yearly.8002.desc: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('concerned_person'))|U] [concerned_person.GetFirstName], [frontier_fort_county.GetName] topraklarındaki kalelerde konuşlandırılmış askerler hakkında kötü şeyler duymuş.\n\n"Gizlice [regional_heresy.GetName] ve onun iğrenç sapkınlığına döndüler", diyor titreyen bir sesle. "Liderlerinin kim olduğunu bilmesem de, bir şeyler yapılmazsa yakında parasını ödediğiniz silahları alıp sizi devirmeye çalışacaklarından korkuyorum.""
 fp3_yearly.8002.a: "Hepsini yakacağım ve toprakları tuzlayacağım."
 fp3_yearly.8002.b: "[regional_heresy.GetNameNoTooltip] demek? Kulağa ilginç geliyor..."
 fp3_yearly.8002.c: "Madem bu kadar endişelisin, #italic sen#! gidip onları geri döndürebilirsin."
 fp3_yearly.8002.d: "Beklemeli ve durumun nasıl gelişeceğini görmeliyiz."
 dealing_with_soldier_heresy_toast.success: "[concerned_person.GetNameNoTooltip] sapkınları tekrar bir araya getirdi."
 dealing_with_soldier_heresy_toast.failure: "[concerned_person.GetNameNoTooltip] askerleri ikna etmeyi başaramadı."
 fp3_county_pacified.tt: "Sapkınlar dağıldı"
 fp3_county_converted.tt: "[concerned_person.GetNameNoTooltip] askerleri gerçek inanca geri getiriyor"
 fp3_county_galvanized.tt: "Kâfirler birlik oldu"
 frontier_heresy_eased: "Sapkınlık azaldı"
 frontier_heresy_mega_outbreak: "Sapkınlık yayıldı"
 fp3_yearly.8003.t: "Yabancı Üzerlik"
 fp3_yearly.8003.desc: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('superstitious_consort'))] [superstitious_consort.GetFirstName], kötü güçleri uzaklaştırmak için #italic Üzerlik#! tohumlarını yakma alışkanlığına sahip. Ama şimdi [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('cruel_consort'))] [cruel_consort.GetFirstName] onu nazarla lanetlediğini ve üzerlik tohumlarını çaldığını iddia ediyor. [cruel_consort.GetFirstNameNoTooltip], elbette bu konudaki tüm bilgileri reddediyor. Ancak [superstitious_consort.GetFirstNameNoTooltip], kendisini bu sözde lanetten kurtarmak için tamamen yeni üzerlik tohumları edinmeye odaklanmış görünüyor.\n\n"Lütfen, [ROOT.Char.Custom('FormOfAddressForLiege')|l]", diye yalvarıyor, "Bir büyücü bana [espad_mountain_province.GetName] topraklarındaki kutsal bir dağdan bahsetti, en iyi üzerlik çiçekleri sadece orada açar. Onlar için birilerini göndermelisin.""
 fp3_yearly.8003.a: "İnancınızı [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] kudretine adayın, aptalca batıl inançlara değil."
 fp3_yearly.8003.b: "Altının satın alabileceği en iyi izcileri göndereceğim."
 fp3_yearly.8003.c: "Onu sizin için alması için [quest_chaplain.GetCouncilTitle] [quest_chaplain.GetFirstName] gidecek."
 fp3_yearly.8003.d: "Herkes gibi normal üzerlik seçemez misin?"
 questing_for_espand_toast.success: "[quest_chaplain.GetFirstName] en iyi üzerlik tohumlarıyla geri döndü."
 questing_for_espand_toast.failure: "[quest_chaplain.GetFirstName] eli boş döndü."
 fp3_espand_found.tt: "[quest_chaplain.GetFirstNameNoTooltip] kutsal üzerlik otlarını buldu"
 fp3_espand_unfound.tt: "[quest_chaplain.GetFirstNameNoTooltip] görevinde başarısız oldu"
 fp3_closer_to_love.tt: "Siz ve [superstitious_consort.GetFirstNameNoTooltip] yakınlaşıyorsunuz"
 fp3_yearly.8004.t: "Sınır Çağırıyor"
### TODO AGOT-CHANGED: fp3_yearly.8004.desc [AGOT: To some who dwell in the splendid cities of this land, the wailing winds of the Dothraki Sea still echo in their hearts. For good or ill, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))] [fp3_child_to_leave.GetFirstName] has begun to feel this call.\n\n | TR: Bu toprakların görkemli şehirlerinde yaşayan bazıları için kuzey bozkırlarının feryat eden rüzgarları hâlâ kalplerinde yankılanıyor. İyi mi kötü mü tarışılır ama, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('fp3_child_to_leave'))] [fp3_child_to_leave.GetFirstName] bu çağrıyı hissetmeye başladı.\n\n]
 fp3_yearly.8004.desc: "To some who dwell in the splendid cities of this land, the wailing winds of the Dothraki Sea still echo in their hearts. For good or ill, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))] [fp3_child_to_leave.GetFirstName] has begun to feel this call.\n\n"[parent.GetMotherFather|U], you must let me leave. I want to hone my mind and my sword on the wild frontier, travel with caravans and traders, and perhaps even see the #italic Mother of Mountains#! of legend."\n\nBut [worried_relation.GetFirstName] loves [fp3_child_to_leave.GetFirstNameNoTooltip] dearly, and is begging me to refuse [fp3_child_to_leave.GetHerHis] request."
 fp3_yearly.8004.a: "Silahına davran, seni yaramaz!"
 fp3_yearly.8004.b: "[worried_relation.GetFirstNameNoTooltip] gitmene çok üzülür ama?"
 fp3_yearly.8004.c: "Eğer gidersen, senin gibi çocuğum yok."
 fp3_yearly.8004.d: "Ben de bu çağrıyı hissettim. Gitmelisin, evladım."
 fp3_yearly.8004.c.flavor: "Eğer [fp3_child_to_leave.GetFirstNameNoTooltip] ayrılırsa onu verasetten men edeceksiniz."
 fp3_yearly.8004.a.tt: "#V Düello#! [fp3_child_to_leave.GetFirstName] adlı kişinin kalmasını sağlamak için!\n#weak Bu düello ölümüne DEĞİLDİR.#!\nEğer kazanırsan, [prestige_i] [prestige|E] elde edeceksiniz\n\nSizin [prowess|E] yeteneğiniz: [prowess_i]#V [parent.GetProwess]#!\n[fp3_child_to_leave.GetFirstNamePossessive] [prowess|E] yeteneği: [prowess_i]#V [fp3_child_to_leave.GetProwess]#!"
 fp3_yearly.8004.b.success: "[fp3_child_to_leave.GetFirstNameNoTooltip], macera hayallerinden vazgeçiyor"
 fp3_yearly.8004.b.failure: "[fp3_child_to_leave.GetFirstNameNoTooltip], ayrılmaya kararlı"
 fp3_yearly.8007.t: "[ROOT.Char.GetCulture.GetName] Ebeveynlik"
### TODO AGOT-ONLY: fp3_yearly.8007.desc [AGOT: ]
 fp3_yearly.8007.desc: ""I yield! I yield, [parent.GetMotherFather]! No more!" My [fp3_child_to_leave.Custom('GetDaughterSon')] pulls back.\n\n"If this is how much you want me to stay, I will do so. I shall be the obedient [fp3_child_to_leave.Custom('GetDaughterSon')] you want me to be. [ROOT.Char.GetFaith.HighGodNameAlternate] will judge you in the end.""
 fp3_yearly.8007.a: "Noksan kalmayacağım."
 fp3_yearly.8007.b: "Güzel. Senin için #italic gerçek#! sorumluluklarım var."
 fp3_yearly.8007.c: "Ve şimdi evlenmelisin!"
 fp3_yearly.8008.t: "Rezil Bir Yenilgi"
### TODO AGOT-CHANGED: fp3_yearly.8008.desc [AGOT: I stumble backwards, bloodied and exhausted, as [fp3_child_to_leave.GetFirstNameNoTooltip] approaches me with weapon in hand.\n\nI told you already, [parent.GetMotherFather], I #italic will#! leave. I will travel to the frontier, as my heart desired, far away in the Dothraki Sea, and #italic you#! will pay for it. | TR: [fp3_child_to_leave.GetFirstNameNoTooltip] elinde silahla bana yaklaşırken kanlar içinde ve bitkin bir hâlde geriye doğru sendeliyorum.\n\n]
 fp3_yearly.8008.desc: "I stumble backwards, bloodied and exhausted, as [fp3_child_to_leave.GetFirstNameNoTooltip] approaches me with weapon in hand.\n\nI told you already, [parent.GetMotherFather], I #italic will#! leave. I will travel to the frontier, as my heart desired, far away in the Dothraki Sea, and #italic you#! will pay for it."\n\nI can do nothing but watch as my [fp3_child_to_leave.Custom('GetDaughterSon')] leaves, head held high, with a bag of gold and silver from my treasury."
 fp3_yearly.8008.a: "Çocuğumu kaybedebilirim ama altınımı da mı kaybedecektim?"
 fp3_yearly.8008.b: "Hadım olsam daha iyiydi..."
 fp3_yearly.8008.c: "Kader seni bana geri getirecek, göreceksin..."
 fp3_yearly.8009.t: "[ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip] Endişeler"
 fp3_yearly.8009.desc_beginning: "Doğu Sınırı uzun zamandır dinsizler ve garip mezhepler için bir sığınak olmuştur. Ancak [caliphal_location.GetName] topraklarındaki [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] bu konuda giderek daha fazla endişe duymaya başladı.\n\n"[very_heretic_county.GetCountyData.GetFaith.GetAdherentNamePlural] topraklarında tuhaf ritüeller uygulayan [very_heretic_county.GetName] hakkında duyumlar aldık." [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip] elçisi [hof_emissary.GetName], alçak ve endişe dolu bir sesle devam etmeden önce cesaretini topluyormuş gibi duraksıyor. "Bazıları #italic cinsel#! ritüellerinden bile bahsediyor. Yeter artık." 
 fp3_yearly.8009.desc_muslim_or_jewish_insult_ending: "[righteous_caliph.GetTitleTierName] bu ahlaksızlarla ilgilenmenizi istiyor.""
 fp3_yearly.8009.desc_other_insult_ending: "[righteous_caliph.GetTitleTierName] bu yıkanmamış kâfirlerle ilgilenmenizi istiyor.""
 fp3_yearly.8009.qurans.flavor: "[righteous_caliph.GetFaith.ReligiousText], [righteous_caliph.GetCulture.GetLanguage.GetNameNoTooltip] dilinde yazılsın diye destek oluyorsunuz."
 fp3_yearly.8009.a: "Onlardan ibret alınacak."
 fp3_yearly.8009.b: "Uygun dildeki kutsal yazılar onlara yol gösterecek."
 fp3_yearly.8009.c: "[loyal_chaplain.GetCouncilTitle] [loyal_chaplain.GetFirstName] onlara vaaz vermek için gidecek."
 fp3_yearly.8009.d: "Ne yazık ki, daha acil endişelerim var."
 cultural_acceptance_gain_arabic_books: "Arapça kitaplar üretti"
 dealing_with_frontier_heresy_toast.success: "[loyal_chaplain.GetTitledFirstNameNoTooltip] görevinde biraz başarılı oldu"
 dealing_with_frontier_heresy_toast.failure: "[concerned_person.GetTitledFirstNameNoTooltip] kimseyi ikna edemedi"
 fp3_county_listened.tt: "Yerel halktan bazıları gerçek inanca döndürüldü"
 fp3_county_unfazed.tt: "Yerel halk umursamadı"
 fp3_gross_persecutions_toast: "Kâfirler dağıldı"
 fp3_galvanized_heretics_toast: "Kâfirler birlik oldu"
 fp3_yearly.8010.t: "Savaş Yurdu"
 fp3_yearly.8010.desc_muslim: "Mezopotamya âlimleri dünyayı üç kısma ayırmışlardır. İnananların #italic Darültevhid'inden#!, müttefiklerimizin #italic Darülsulh'ünden#! ve aynı zamanda #italic Darülharb'den#!, sınırdan, Savaş Yurdu'ndan bahsederler. [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] bu dünya görüşüne çok inanıyor ve Doğu tehdidi konusunda sürekli endişe duyuyor.\n\n"Bir [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] olarak pagan sınırını dikkatimiz altına almak senin görevin", diyor. "Çok uzun zamandır [pagan_ruler.GetTitledFirstName] ve onun putperest uygulamalarına müsamaha gösterdik. Size sadık #italic gazi#! birlikleri ve Türk paralı askerler göndereceğim, böylece [pagan_county.GetNameNoTier] topraklarını onun yönetiminden kurtarabilirsiniz.""
 fp3_yearly.8010.desc_not_muslim: "[righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName], dünyayı medeniyet ve barbarlık arasında sonsuz bir mücadele olarak gören bir görüşe çok inanıyor ve sürekli olarak evcilleşmemiş Doğu'da gizlenen ve komplo kuran inançsız düşmanlardan endişe duyuyor.\n\n"Bir [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] olarak göreviniz," diyor bana, "pagan sınırını ihtiyatınız altına almak. Çok uzun zamandır [pagan_ruler.GetTitledFirstName]ve onun putperest uygulamalarına müsamaha gösterdik. Size sadık #italic gazi#! birlikleri ve Türk paralı askerler göndereceğim, böylece [pagan_county.GetNameNoTier] topraklarını onun yönetiminden kurtarabilirsiniz.""
 fp3_yearly.8010.a: "Ona gecikmeden saldıracağım!"
 fp3_yearly.8010_warmonger.tt: "[pagan_county.GetNameNoTier] topraklarını #bold beş yıl#! içinde ele geçirmeniz bekleniyor!"
 fp3_yearly.8010.b: "Bu savaşı finanse etmeme yardım edin, ben de başlayayım."
 fp3_yearly.8010.c: "Yüce [righteous_caliph.GetTitleTierName], zamanın doğru olmadığını görmelisiniz."
 fp3_yearly.8010.d: "Topraklarım üzerinde hiçbir yetkiniz yok."
 convincing_the_caliph_toast.success: "[righteous_caliph.GetTitleTierName], yeniden düşünsün diye ikna ettiniz"
 convincing_the_caliph_toast.failure: "Argümanlarınız kimseyi ikna edemedi"
 fp3_caliph_convinced.tt: "[righteous_caliph.GetTitleTierName] şimdilik savaştan kaçınacak."
 fp3_caliph_unconvinced.tt: "[righteous_caliph.GetTitleTierName] zayıflığınıza öfkeleniyor."
 fp3_caliph_dead.title: "Sözünüz Geçerliliğini Yitirdi"
 fp3_caliph_dead.desc: "Önceki mezhep lideriniz artık hayatta değil ve verdiğiniz fetih sözü geçersiz hâle geldi."
 fp3_yearly.8012.t: "Yerine Getirilen Bir Söz"
### TODO AGOT-ONLY: fp3_yearly.8012.desc [AGOT: ]
 fp3_yearly.8012.desc: ""It seems", the [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] declares, "that you did not delay in fulfilling your pledge to conquer [pagan_county.GetNameNoTier] in the name of our faith. You have proven yourself to be a trustworthy ruler and a devout [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip], and we shall not soon forget it."" 
 fp3_yearly.8012.a: "Her [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ne yaparsa onu yaptım."
 become_faith_warrior.toast: "Sen [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] şampiyonu oldun."
 fp3_yearly.8013.t: "[ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip] Hayal Kırıklığı"
### TODO AGOT-ONLY: fp3_yearly.8013.desc [AGOT: ]
 fp3_yearly.8013.desc: ""Five years ago", the [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] declares, "you promised before us to deliver [pagan_county.GetNameNoTier] from the heathens. How can it then be, that this has not come to pass?"" 
 fp3_yearly.8013.a: "Üzgünüm, şartlar asla istediğim gibi olmadı."
 fp3_yearly.8013.b: "Ne sizi tanıyorum ne de verilen sözü."
 fp3_yearly.8014.t: "Çaydanlığın Sırları"
 fp3_yearly.8014.desc: "Uzun zamandır sarhoş edici içeceklere olan sevgimi dindar [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] bakış açısıyla bağdaştırmak için mücadele ediyorum. Neyse ki, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('smart_courtier'))] [smart_courtier.GetFirstName] bir çözüm buldu.\n\n"Osrushana'daki eski insanlardan öğrendim ki," diyor, "soğuk iklimle başa çıkmak için belirli bir miktar içkiye ihtiyaç duyuyorlarmış. Ve tabii ki genel olarak eğlenmek için. İçkilerini bakır bir tencereye dökme alışkanlıkları var, böylece aşırı inançlı herhangi bir izleyici şarap değil çay içtiklerini varsayacaktır. Bir süredir ben de böyle yapıyorum ve oldukça kullanışlı.""
 fp3_yearly.8014.a: "Ne kadar iyi bir fikir!"
 fp3_yearly.8014.b: "İnsanlar beni yargılamayabilir ama [ROOT.Char.GetFaith.HighGodNameAlternate] yargılayacaktır."
 fp3_yearly.8014.c: "Bunu yapmayacağım ve #italic sen de yapmayacaksın#!!"
 f3_yearly.8014_forbidding_teapot_alcohol_flavor: "[smart_courtier.GetNameNoTooltip], günahlarını saklamayı bırakmaya tarafınızca zorlanıyor."
 fp3_yearly.8016.t: "Unutulmuş Taşlar"
### TODO AGOT-CHANGED: fp3_yearly.8016.desc [AGOT: My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hyrcanian_vassal'))] [hyrcanian_vassal.GetFirstName] has invited me to take a look at a triad of strange carved stones, deep in the woods on his domain.\n\nThey must have been erected by a lost expedition of the #italic Hairy Men#! | TR: [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hyrcanian_vassal'))] [hyrcanian_vassal.GetFirstName], beni kendi alanındaki Hyrkani ormanının derinliklerinde bulunan üç adet garip oyma taşa bakmaya davet etti. \n\n]
 fp3_yearly.8016.desc: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hyrcanian_vassal'))] [hyrcanian_vassal.GetFirstName] has invited me to take a look at a triad of strange carved stones, deep in the woods on his domain.\n\nThey must have been erected by a lost expedition of the #italic Hairy Men#!", [hyrcanian_vassal.GetSheHe] tells me. "Now, the local forest-dwellers have taken a liking to these stones, and believe that their unknown makers will descend upon them from the Shivering Sea with swift and bloody vengeance should the stones be destroyed. But I do not believe such tales. Though I cannot read the letters on these stones, they for sure are foriegn idols, and must be smashed to pieces. Is it not so, my liege?""
 fp3_yearly.8016.a: "Bana bir balyoz verin!"
 fp3_yearly.8016.b: "Hayır, orman sakinlerini dinleyeceğiz."
 fp3_yearly.8016.c: "Onları kaldırtacağım ve [ROOT.Char.Custom('ResidenceBuilding')] dışında yeniden dikeceğim..."
 fp3_hyrcanian_vassal_convinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip] bu çözümü kabul ediyor."
 fp3_hyrcanian_vassal_unconvinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip] neden böyle bir şey yaptığınızı merak ediyor."
 convincing_the_hyrcanian_vassal_toast.success: "[hyrcanian_vassal.GetTitledFirstName] teklifinizi kabul etti."
 convincing_the_hyrcanian_vassal_toast.failure: "[hyrcanian_vassal.GetTitledFirstName] taşların sürüklenip götürülmesini somurtkan bir sessizlik içinde izledi."
 fp3_yearly.8017.t: "Hyrkani Felaketi"
 fp3_yearly.8017.desc: "Felaket vurdu! Öfkeli #italic Rus#! savaşçıları, cesetlerin üzerine üşüşen leş kuşları gibi [runestone_county.GetNameNoTier] üzerine üşüştüler ve gördükleri herkesi katlettiler. [hyrcanian_vassal.GetTitledFirstName], bir balta darbesiyle kesildi ve ciddi şekilde sakatlandıktan sonra kritik bir durumda. Ancak yağmacılar geldikleri gibi hızla teknelerine döndüler ve Hazar Denizi'nde sabah sisi içinde gözden kayboldular.\n\nSaldırganların yıllar önce Rus runik taşlarına [hyrcanian_vassal.GetFirstNameNoTooltip] tarafından yapılan saygısızlık nedeniyle intikam almak istemiş olabileceğine dair hayatta kalanlar arasında söylentiler yayılıyor..."
 fp3_yearly.8017.a: "[ROOT.Char.GetFaith.HighGodNameAlternate], seni kızdıracak ne yaptık?"
 fp3_yearly.8017.b: "Ne işe yarayacaksa yarasın, biraz altın göndereceğim."
 fp3_yearly.8017.c: "Bu kötü bir alamet... Taşları [runestone_county.GetNameNoTierNoTooltip] topraklarına geri götürmeliyim."
 fp3_yearly.8018.t: "Cennetten Bir At"
 fp3_yearly.8018.desc_eunuch: "Ben [ROOT.Char.Custom('WarhorseStoryName')] ile antrenman yaparken, uzaklardan bir yolcu bana yaklaşıyor. Dikkatlice ölçülmüş ince hareketlerle selam veriyor, görkemli saraylarda uzun bir kariyeri olduğunu ima ediyor.\n\n"Büyük bir leydiye hizmet ediyorum" diyor, "Çin'de, bu büyük dağların ötesinde. Hanımım hevesli bir #italic çevgan#! oyuncusu ama aynı zamanda övünmeye de eğilimli ve arkadaşlarına bir sonraki oyunda cennetin altındaki en iyi ata bineceğini söyledi. Halkım uzun zamandır ülkenizin #italic cennetlere layık atlarına#! değer veriyor ve öyle görünüyor ki [ROOT.Char.Custom('FormOfAddressForLiege')|l], siz hepsinin en iyisine sahipsiniz. Ama aynı zamanda bazı #italic finansal#! zorluklarınız olduğunu da biliyorum..."\n\n"Öyleyse ne dersiniz, bu harika [ROOT.Char.Custom('HorseStoryMareStallion')] benim olabilir mi?""
 fp3_yearly.8018.desc_grand_old_lady: "[ROOT.Char.Custom('WarhorseStoryName')] ile antrenman yaparken, egzotik giysiler içindeki hoş bir hanımefendi maiyetiyle birlikte bana yaklaşıyor."\n\n"Çin'in büyük saraylarından geliyorum" diyor. Son zamanlarda, sizin küçük krallığınızda bile popüler olan atlı spor #italic çevgan#! ile ilgilenmeye başladım. Ama bir sonraki oyun için, halkımın Ölümsüzlük Hapı'ndan bile daha çok değer verdiği, Fergana'nın kan ter içinde atları olan #italic cennet atına#! binmeye söz verdim. Şimdi, bu bölgelerin küçük [Select_CString(ROOT.Char.IsFemale, 'Leydisi', 'Lordu' )] olan sizin diğerlerinden daha iyi bir [ROOT.Char.Custom('HorseStoryMareStallion')] sahibi olduğunu öğrendim. Ayrıca borçlu olduğunuzu da öğrendim..."\n\nSize ağır bir kese altın uzatıyor ve niyeti çok açık." 
 fp3_yearly.8018.a: "Pekâlâ, sana atımı satacağım."
 fp3_yearly.8018.b: "Ben [ROOT.Char.Custom('WarhorseStoryName')] ile asla ayrılmam."
 fp3_yearly.8018.c: "Çekil gözümün önünden, seni atsız kocakarı!"
 fp3_yearly.8888.t: "Bir Otlatma Şikayeti"
 fp3_yearly.8888.desc: "[upset_vassal.GetName] beni arıyor, gözle görülür bir şekilde üzgün.\n\n"Efendim", diyor, "[turkic_leader.GetName] tarafından yönetilen [turkic_leader.GetCulture.GetName] kabilesi [nomads_county.GetNameNoTier] topraklarındaki tüm otlakları çalıyor ve genellikle iyi, yerleşik halk için sorun yaratıyor. Onları kovmak için #italic gazi#! savaşçıları göndermeyi denedim, ancak onlar sadece geri çekiliyor ve bir ay sonra geri dönmek üzere ıssız arazilerde saklanıyorlar. Bu yıkanmamış barbarları kovmama yardım etmelisiniz - kalıcı olarak."\n\n"Onlarla başa çıkabilirim", diyor [possibly_capable_marshal.GetCouncilTitle] [possibly_capable_marshal.GetFirstName], "beni [nomads_county.GetNameNoTierNoTooltip] topraklarına gönderin.""
 fp3_yearly.8888.a: "Hayır, gidip onlarla kendim ilgileneceğim."
 fp3_yearly.8888.b: "Pekâlâ, [possibly_capable_marshal.GetFirstNameNoTooltip] - birliklerinizi [nomads_county.GetNameNoTierNoTooltip] topraklarına götürün."
 fp3_yearly.8888.c: "[upset_vassal.GetTitledFirstNameNoTooltip], bu seninle [turkic_leader.GetFirstNameNoTooltip] arasında."
 fp3_fighting_turks.success.tt: "[possibly_capable_marshal.GetFirstName] göçebe liderini yakaladı"
 fp3_fighting_turks.failure.tt: "Askerlerinizden kaçıyorlar"
 fp3_treating_with_turks.success.tt: "[turkic_leader.GetCulture.GetName] görüşmeyi kabul ediyor"
 fp3_treating_with_turks.failure.tt: "Onları ikna etmekte başarısız oluyorsunuz"
 fp3_treating_with_turks_toast.failure: "Göçebeler sizinle anlaşmayı reddetti."
 fp3_fighting_turks_toast.failure: "[possibly_capable_marshal.GetTitledFirstName] asi göçebeleri yenmeyi başaramadı."
 fp3_yearly.8889.t: "Herkese Yetecek Kadar Çim"
 fp3_yearly.8889.desc: "[turkic_leader.GetName] beni unvanımın gerektirdiği tüm misafirperverlikle karşılıyor, çay, kurutulmuş at eti ve taze kaynak suyu ikram ediyor. Ama laf [upset_vassal.GetName] olunca küçümseyerek konuşuyor.\n\n"[upset_vassal.GetTitledFirstNameNoTooltip] yalan söylüyor," diyor göçebe lideri bana, "herkese yetecek kadar ot var. Halkımın [nomads_county.GetNameNoTierNoTooltip] topraklarında kalmasına izin verin, biz de yaylarımızı ve kılıçlarımızı ordularınıza ödünç verebiliriz. Hatta sarayınıza gelir ve [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] olarak hizmet ederim."
 fp3_yearly.8889.a: "Kulağa mantıklı geliyor."
 fp3_yearly.8889.b: "Burada kalamazsınız, ancak [nomads_new_county.GetNameNoTierNoTooltip] topraklarına gelip otlayabilirsiniz."
 fp3_yearly.8889.c: "Ne yazık ki böyle bir anlaşma olamaz."
 fp3_yearly.8890.t: "Bir Şefin Kaderi"
 fp3_yearly.8890.desc_beginning: "Önümde sürüklenen göçebe reisi [turkic_leader.GetName] oldukça çaresiz görünüyor. Burada çok az müttefiki var, eğer hiç varsa tabii."\n\n"[turkic_leader.GetCulture.GetName], pusuya düştü," diye açıklıyor [possibly_capable_marshal.GetFirstName], "bu şahsı ve bazı savaşçılarını ele geçirdik."\n\n"
### TODO AGOT-ONLY: fp3_yearly.8890_brutal_demands [AGOT: ]
 fp3_yearly.8890_brutal_demands: ""Take their heads", [upset_vassal.GetName] insists, "for these savages have killed many of my subjects."\n\n"
