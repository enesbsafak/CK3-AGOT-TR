﻿l_english:
 fp3_yearly.2000.t: "Gün Işığına Kadar Saklanmak"
 fp3_yearly.2000.desc_drinking: "Bütün gece boyunca vasallarım ve lütufkar yoldaşlarımla içtim. Sabahın son kadehinin tadını çıkarırken,"
 fp3_yearly.2000.desc_hashish: "Bütün gece, güneş doğana kadar vasallarım ve nimet yoldaşlarımla haşiş paylaştım. Ben son haşiş keklerini çalarken,"
 fp3_yearly.2000.desc_warning: "[cautious_vassal.GetTitledFirstName], beni kafam iyiyken bir kenara çekiyor:\n\n"Eğer [prudish_liege.GetTitledFirstNamePossessive] #italic muhtesibi#! seni çarşıda böyle görürse, seni tutuklatır ve kırbaçlatır. #italic Öğle#! namazına kadar burada kapalı bir yerde dinlenin ve sonra ayıldığınızda gidin.""
 fp3_yearly.2000.a: "Evet, en iyisini sen bilirsin."
 fp3_yearly.2000.b: "[prudish_liege.GetTitleAsNameNoTooltip] beni asla tutuklamaz!"
 fp3_yearly.2000.b_flavor: "[prudish_liege.GetTitledFirstName], [prudish_liege.GetFaith.GetAdjective] yasası adına bana kasten zarar vermeyecektir."
 fp3_yearly.2000.b_success: "Eve sağ salim dönüyorum"
 fp3_yearly.2000.b_failure: "[prudish_liege.GetTitledFirstNamePossessiveNoTooltip|U] #italic muhtasibi#! beni yakalıyor ve kırbaçlatıyor"
 fp3_yearly.2001.t: "Ulu Orta Sarhoşluk"
 fp3_yearly.2001.desc_intro: "#italic Muhtesibim#! bana [intoxicated.Custom2('MyCharacterIntroduction', ROOT.Char)] adlı kişinin çarşıda dolaştığını bildirdi,"
 fp3_yearly.2001.desc_drinking: "tökezliyor ve geveleyerek konuşuyormuş,"
 fp3_yearly.2001.desc_hashish: "kıkırdıyor ve bulutlara bakıyormuş"
 fp3_yearly.2001.desc_outro: "hem de güpegündüz!"\n\nBu ahlaksız davranışın normal cezasının, bu asi mümini tutuklayıp kırbaçlamak olduğunu söylediler."
 fp3_yearly.2001.a: "Sopayı bırak..."
 fp3_yearly.2001.b: "[ROOT.Char.GetFaith.HighGodName] onu affedecektir, bu seferliğine."
 fp3_yearly.2010.t: "Tahıl Sepetleri"
 fp3_yearly.2010.desc: "Kulağıma hiçbir kuraklık ya da kıtlık haberi gelmedi ama yine de [bakers_county.GetNameNoTier] halkı ekmeğin aşırı pahalı olmasından şikayetçi." [random_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] bana "Bu sizin kraliyet fırıncınız [greedy_baker.GetFirstName]," diyor. "Şehre giren her buğday ve un yükünü satın aldı ve kendimiz için tek bir #italic sepet#! almamıza bile izin vermiyor.""
 fp3_yearly.2010.a: "O alçak"
 fp3_yearly.2010.a.tt: "[greedy_baker.GetFirstName], hayvanların altında ezildi ve yerel halkı yatıştırmak için yerel buğday eksikliği giderildi"
 fp3_yearly.2010.a_elephants: "fillerin altında can verecek!"
 fp3_yearly.2010.a_camels: "develerin altında can verecek!"
 fp3_yearly.2010.a_horses: "atların altında can verecek!"
 fp3_yearly.2010.b: "İlgi çekici, onu kendime yakın tutmalıyım."
 fp3_yearly.2010.c: "Asıl suç bu kazançları benden saklamak."
 fp3_yearly.2020.t: "Ölçeği Ayarla"
 fp3_yearly.2020.desc_intro: "Efendimin tahsildarı [sinful_tax_collector.GetTitledFirstName] erdemli bir insan olmaktan çok uzak."
 fp3_yearly.2020.desc_greedy: "Altın sevgisi sadece, yaşam sevgisiyle eşleşir; borcundan bir gümüş parça daha fazla toplamak için her şeyi yapacaktır."
 fp3_yearly.2020.desc_arbitrary: "Adaleti sevmez; vergileri keyfine göre toplar ve zahmetli bulduğu düzenlemeleri görmezden gelir."
 fp3_yearly.2020.desc_cynical: "Dini konulara çok az ilgi gösterir ve [ROOT.Char.GetFaith.HighGodNamePossessive] öğretilerine saygı duymaz; sabah namazlarında uyur ve Ramazan boyunca lokma çalarken bulunabilir."
 fp3_yearly.2020.desc_contrite: "Sağduyusuna güvenilemez ve herhangi birinin mali kaynaklarını özgürce paylaşır; öncesinde dokuz farklı kişinin kulağına ulaşmadan efendimin kulaklarına hiçbir şey ulaşmaz."
 fp3_yearly.2020.desc_outro: "\n\nBöyle bir insana nasıl olur da hem ülkenin hem de benim mali işleri emanet edilebilir?"
 fp3_yearly.2020.a: "[liege.GetTitledFirstNameNoTooltip], [sinful_tax_collector.GetTitledFirstNameNoTooltip] ve günahlarının hesabını vermeli."
 fp3_yearly.2020.a_success: "[sinful_tax_collector.GetTitledFirstNameNoTooltip], kovuldu"
 fp3_yearly.2020.a_failure: "Şikayetlerim dikkate alınmıyor"
 fp3_yearly.2020.a_failure.tt: "[sinful_tax_collector.GetTitledFirstNameNoTooltip] benim için sorun yaratmaya başlayabilir."
 fp3_yearly.2020.b: "Ülkenin iyiliği için [sinful_tax_collector.GetTitledFirstNameNoTooltip] ve yaptıklarını ihbar etmeliyim."
 fp3_yearly.2020.b.t: "İhbar Edilen Tahsildar"
 fp3_yearly.2020.b.desc: "Bu, vasalınız [denouncing_taxpayer.GetShortUIName], [sinful_tax_collector.GetShortUIName] adlı kişinin günahkârlığını ihbar ettiği için oldu."
 fp3_yearly.2020.c: "Onun için dua edeceğim."
 fp3_yearly.2021.desc_intro: "Tahsildarım [sinful_tax_collector.GetTitledFirstName] yeterince yetenekli biri olmasına rağmen, [denouncing_taxpayer.GetName] bana aksi yönde güçlü çekincelerle geldi.\n\n"
### TODO AGOT-ONLY: fp3_yearly.2021.desc_greedy [AGOT: ]
 fp3_yearly.2021.desc_greedy: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] is entirely self-interested, driven by love of money rather than justice. [sinful_tax_collector.GetSheHe|U] commonly collects more than what is due and gives nothing to the alms-tax.""
### TODO AGOT-ONLY: fp3_yearly.2021.desc_arbitrary [AGOT: ]
 fp3_yearly.2021.desc_arbitrary: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] rarely heeds any laws or regulations, instead collecting taxes based on [sinful_tax_collector.GetHerHis] whims. The peasants are often troubled by [sinful_tax_collector.GetHerHis] inconsistent collections.""
### TODO AGOT-ONLY: fp3_yearly.2021.desc_cynical [AGOT: ]
 fp3_yearly.2021.desc_cynical: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] is not fearful of [ROOT.Char.GetFaith.HighGodName], frequently sleeping through morning prayers and stealing morsels during fasting. All of us fear [ROOT.Char.GetFaith.HighGodNamePossessive] justice on [sinful_tax_collector.GetHerHis] account.""
### TODO AGOT-ONLY: fp3_yearly.2021.desc_contrite [AGOT: ]
 fp3_yearly.2021.desc_contrite: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] cannot be trusted with discretion; [sinful_tax_collector.GetSheHe] will share the realm's finances with anyone who will only listen. It is only a matter of time until this information lands in the hands of the enemy.""
 fp3_yearly.2021.desc_outro: "\n\n[denouncing_taxpayer.GetTitledFirstNameNoTooltip] [denouncing_taxpayer.Custom('quirk_pos_present')], açıkça bu ihlalleri için [sinful_tax_collector.GetTitledFirstNameNoTooltip] adlı kişiyi kovmamı bekliyor."
### TODO AGOT-CHANGED: fp3_yearly.2021.a [AGOT: [sinful_tax_collector.GetTitledFirstNameNoTooltip|U] will be dismissed, gods willing. | TR: [sinful_tax_collector.GetTitledFirstNameNoTooltip|U] görevden alınacak inşallah.]
 fp3_yearly.2021.a: "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] will be dismissed, gods willing."
 fp3_yearly.2021.b: "Sözlerinizi aklımda tutacağım."
 fp3_yearly.2030.t: "Güzel Bir Kural"
 fp3_yearly.2030.desc_intro: "Aynadaki görüntüme bakıyor ve üzerinde beliren"
 fp3_yearly.2030.desc_beauty_bad: "korkunç çirkinliği inceliyorum,"
 fp3_yearly.2030.desc_spindly: "ince, yumrulu uzuvları inceliyorum,"
 fp3_yearly.2030.desc_disfigured: "maskenin ardındaki işkence görmüş yüzü inceliyorum,"
 fp3_yearly.2030.desc_scaly: "lekeli, kaşıntılı cildi inceliyorum,"
 fp3_yearly.2030.desc_albino: "hayalet gibi bir cilt ve şeytani gözleri inceliyorum,"
 fp3_yearly.2030.desc_hunchbacked: "talihsiz çıkıntıyı inceliyorum,"
 fp3_yearly.2030.desc_inbred: "bükülmüş vücudu inceliyorum,"
 fp3_yearly.2030.desc_outro: "Hoş olmayan görünüşüm nedeniyle halkımın benden nefret edeceğinden endişeleniyorum. İşte o zaman [reassuring_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] bilgeliğini sunuyor:\n\n"Altını düşman olarak kabul edersen, tüm insanlar seni dostları olarak görecektir."
 fp3_yearly.2030.a: "O zaman tüm diyarla dost olmama izin ver."
 fp3_yearly.2030.b: "Teşekkür ederim, [reassuring_courtier.GetNameNoTooltip]."
 fp3_yearly.2030.c: "Sadakâtlerini sevgi değil korku satın alacak."
 fp3_yearly.2030.d: "Zamanla beni tanıyacaklar."
 fp3_yearly.2040.t: "Sadıkların Komutanı"
 fp3_yearly.2040.desc_attacker_is_muslim: "Kim bana karşı çıkarsa Peygamber'in kendisine karşı çıkmış olur ve yine de [infidel.Custom2('InsultNoun', ROOT.Char)] [infidel.GetTitledFirstName], bana savaş ilan etmeye cüret etti.\n\nAncak herkes bu kadar dinsiz değildir. Eğer [infidel.GetTitledFirstNameNoTooltip] ve ordusunun önünde durup onlara Peygamber'in kendisinden gelen yetkimi hatırlatsaydım, o zaman kesinlikle bazı askerler geri çekilirdi."
 fp3_yearly.2040.desc_attacker_is_not_muslim: "Peygamber'in sözlerinden habersiz olan [infidel.Custom2('InsultNoun', ROOT.Char)] [infidel.GetTitledFirstName] bana savaş ilan etti ve ilahi saltanatımı yok etmeye çalışıyor.\n\nAncak herkes bu kadar dinsiz değil: [infidel.GetTitledFirstNamePossessiveNoTooltip] topraklarında [caliph.GetFaith.HighGodNamePossessive] sözlerine itaat edenler var. Eğer ben onların karşısına dikilip Peygamber'ein kendisinden gelen yetkimi hatırlatacak olsaydım, kesinlikle geri adım atarlardı."
 fp3_yearly.2040.a: "Peygamber bana yol gösterecek!"
 fp3_yearly.2040.a.flavor: "Dindarlığım ve [caliph.GetFaith.ReligiousText] hakkındaki bilgim sözlerime rehberlik edecek."
 fp3_yearly.2040.a_success: "Askerler otoritenize itaat ediyor"
 fp3_yearly.2040.a_failure: "Askerler yalvarışınızı küçümsüyor ve sizi yere seriyor"
 fp3_yearly.2040.b: "Elçi [imam.GetTitledFirstName] için rehberlik edecektir."
 fp3_yearly.2040.b.flavor: "[imam.GetTitledFirstNameNoTooltip] dinî konularda benden daha bilgili."
 fp3_yearly.2040.b_success: "Askerler [imam.Custom('MyPriestTitle')] olduğunuz için saygı duyuyor."
 fp3_yearly.2040.b_failure: "Askerler [imam.Custom('MyPriestTitle')] olmanızı umursamıyor"
 fp3_yearly.2040.c: "Hayır, bu çok riskli."
 fp3_yearly.2041.desc_cynical: "[caliph.GetTitledFirstName|U], [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] askerlerimin, kendisinin Peygamber'in gerçek halefi olduğu doğrultusunda geri çekilmesini emretti ve bu aptallar ona itaat ettiler!\n\nKıçımın halefi, senin ne olduğu kimin umurunda ki? Tekmeyi oturttuktan sonra neyin halefi olduğunu göreceğiz."
 fp3_yearly.2041.desc_fallback: "Ben de [caliph.GetName] karşısındaki savaşımın [ROOT.Char.GetFaith.HighGodName] tarafından onaylandığını biliyorum. Yine de [caliph.Custom2('InsultNoun', ROOT.Char)] [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] askerlerimi, Peygamber'in halefi olduğu için geri çekilmeleri ve evlerine dönmeleri gerektiğine ikna etmeyi başardı.\n\nAskerlerimin çoğu buna uydu ve şimdi sadık ama daha küçük bir ordunun sonuçlarıyla uğraşmak zorundayım..."
 fp3_yearly.2041.a: "Lanet olsun [caliph.Custom2('InsultNoun', ROOT.Char)]!"
