 fp3_yearly.8051_opening.desc: "Eskiden [sacred_fire_province.GetName] tapınağında yanan kutsal ateş yakın zamanda"
 fp3_yearly.8051_torrential_rain: "tapınağın çatısındaki çatlaklardan sızarak aşağıdaki yangına ulaşacak kadar şiddetli bir yağmurla söndürüldü."
 fp3_yearly.8051_earthquake: "tapınağı etkileyen ve binayı neredeyse ikiye bölen bir depremle söndürüldü."
 fp3_yearly.8051_sandstorm: "tapınağın kapılarını kıracak kadar şiddetli bir kum fırtınası tarafından söndürüldü."
 fp3_yearly.8051_gust_of_wind: "muhtemelen tapınak duvarlarındaki gizli bir çatlaktan gelmiş olan buz gibi soğuk bir rüzgar tarafından söndürüldü."
### TODO AGOT-CHANGED: fp3_yearly.8051_islamic_zealots [AGOT: extinguished by foriegn zealots, who broke into the temple and desecrated it in very creative ways. | TR: tapınağa giren ve çok yaratıcı yollarla tapınağa saygısızlık eden Müslüman fanatikler tarafından söndürüldü.]
 fp3_yearly.8051_islamic_zealots: "extinguished by foriegn zealots, who broke into the temple and desecrated it in very creative ways."
 fp3_yearly.8051_invisible_hand: "görünmez bir el tarafından oldukça gizemli bir şekilde söndürüldü."
 fp3_yearly.8051_ending.desc: "Bu kötü alamete rağmen [magi.GetName] umutsuzluğa kapılmış görünmüyor.\n\n"Ateşi yeniden alevlendirmeliyiz," diyor. "Tüm alevlerin en safı ve en büyüğü #italic Ateş-i Behram#! olurdu, bulutların arasında şimşekten doğan Zafer Ateşi. Ama burası daha küçük bir tapınak olduğu için, belki de bir kuyumcu ocağının bize verebileceği #italic Atash Adaran#!, Ateşlerin Ateşi ile yetinmeliyiz. Ya da en düşük dereceli, herhangi bir alevden kutsanabilen #italic Atash Dadgah#!""
### TODO AGOT-CHANGED: fp3_yearly.8051.a [AGOT: Only a sacrifice will do. I will find someone for you. | TR: Sadece yıldırım işe yarar. Onu senin için bulacağım.]
