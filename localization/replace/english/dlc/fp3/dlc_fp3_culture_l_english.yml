 tradition_fp3_jirga_name: "Cirge"
 tradition_fp3_jirga_desc: "Bu kültürün yaşlıları ve liderleri antik kabile kurallarına uyacak şekilde sorunları çözmek ve diyarın kralını taçlandırmak için toplanırlar. "
 tradition_fp3_pragmatic_creed_name: "Pragmatik Yemin"
 tradition_fp3_pragmatic_creed_desc: "Bu kültürün savaşçıları göşteriş yapmakla uğraşmaz, ve sıradan askerin değeri ve uyum sağlama yeteneğini atlı elitlerin pahasına öne çıkarırlar." 
 tradition_fp3_fierce_independence_name: "Şiddetli Bağımsızlık"
 tradition_fp3_fierce_independence_desc: "Uzun yıllardır birçok tiran bu kültürü yok etmeye çalıştı. Ama direnci ve askerî başarılarıyla varlığını sürdürdü." 
