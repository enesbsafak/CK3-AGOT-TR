l_english:
 asawira: "Asavira"
 asawira_flavor: "#F Asaviranın safları hem mızrak hem de yay kullanmada yetenekli İranlı soylulardan oluşuyor. Yeniden kurulan bu askerî birlik Fars'ın düşmanlarına saldırmaya hazır.#!"
 tarkhan: "Tarkanlar"
 tarkhan_flavor: "#F Bozkırlaın elit süvarisi Tarkanlar mızrak, topuz ve yaylarıya neredeyse her savunmayı yok edebilir.#!"
 zupin_warrior: "Zupin Mızraklısı"
 zupin_warrior_flavor: "#F Bu Deylemli savaşçılar son derece değişken bir kuvvettir, hem güçlü kalkan duvarları oluşturabilirler hem de yayılıp mızraklarını düşmana fırlatabilirler.#!"
 tawashi: "Tavaşi"
 tawashi_flavor: "#F Bu esnek süvari gücü dağlık vatanlarını yabancılardan korumak için kılıç, mızrak ve yay kullanıyorlar.#!"
 master_assassin_court_position: "Usta Suikastçı"
 master_assassin_court_position_desc: "İnanç veya yeminle bağlı olan Usta Suikastçı efendisine savaş, casusluk, terör ve cinayet konularında sıradışı yaklaşımla yardım eder."
 has_no_particular_noble_roots_trigger: "[Concept( 'lowborn', 'Alt tabakadan' )|E] [lowborn|E] veya önemsiz bir [Concept( 'dynasty', 'hanedandan' )|E]"
 court_scholar_court_position: "Saray Bilgini"
 court_scholar_court_position_desc: "Ülkeninizin entellektüel zümresini temsil eden Saray Bilgini gelecek [Concept( 'innovations', 'buluşların' )|E] keşfine yardım eder."
 building_type_sar_i_sang_mines_01: "Saresang Madenleri"
 building_type_sar_i_sang_mines_01_desc: "Dünyanın laciverttaşının ana kaynağı olan Saresang tarih öncesi dönemlerden beri açıktı, ve laciverttaşları antikitenin tüm saraylarında görülebilir. Yerel işçiler gece gündüz yeri o güzel laciverttaşları çıkarmak için kazıyor."
 building_sar_i_sang_mines_01: "Saresang Antik Madeni"
 building_sar_i_sang_mines_01_desc: "$building_type_sar_i_sang_mines_01_desc$"
 building_sar_i_sang_mines_02: "Saresang Onarılmış Madeni"
 building_sar_i_sang_mines_02_desc: "Antik tüneller genişletildi ve güvenceye alındı, mühendisler yeni bir tünlelle yeni olanaklar açmak için görevlendirildi."
 building_sar_i_sang_mines_03: "Genişletilmiş Saresang Madeni"
 building_sar_i_sang_mines_03_desc: "Maden operasyonlarıyla birlikte madenin kendisi de büyüyor. Daha çok giriş açıldı ve antik tünel derinleştikçe derinleşiyor."
 building_sar_i_sang_mines_04: "Saresang Maden Kompleksi"
 building_sar_i_sang_mines_04_desc: "Laciverttaşı kazısı binlerce işçi ile neredeye endüstriyel bir seviyeye çıktı. Bu antik uzak dağ artık canlı bir ekonominin merkezi." 
 tradition_fp3_frontier_warriors_name: "Hudut Savaşçıları"
 tradition_fp3_frontier_warriors_desc: "Bu kültür sürekli vahşi hudutları ehlileştirmeye çabalıyor, bu uğraş için elit askerler, paralı kabile askerleri, ve fanatik gönüllülerin karışımını kullanıyorlar."
 tradition_fp3_irrigation_experts_name: "Sulama Uzmanları"
 tradition_fp3_irrigation_experts_desc: "Bu kültür su teknolojisinin ustasıdır, yenilikçi ve toplu çabalarıyla en kuru çölü bile yeşertebilirler."
 tradition_fp3_beacon_of_learning_name: "Öğrenim Feneri"
