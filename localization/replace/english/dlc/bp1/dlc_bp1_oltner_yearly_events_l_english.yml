l_english:
 bp1_yearly.4000.t:0 "Aile Anısı"
 bp1_yearly.4000.desc:0 "[family_memory.GetDescription|U]. O gün dün gibi aklımda, ah [family_memory_participant.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMePossessivet', SCOPE.sC('family_memory_participant'))]...\n\n"
 bp1_yearly.4000.desc.alive:0 "Bu gibi hatıralar zor zamanlarımda beni rahatlatıyor. Biliyorum ki, ne olursa olsu ailem her zaman yanımda ve [ROOT.Char.GetHouse.GetName] Hanesi dimdik ayakta."
 bp1_yearly.4000.desc.dead:0 "Keşke hâlâ yanımızda olsaydın. Birlikte gülünecek nice şaka, uzlaşılacak nice farklılık, oluşturulacak nice yeni anılar vardı. [ROOT.Char.GetHouse.GetName] hanesi sen yokken eskisi gibi değil."
 bp1_yearly.4000.desc_end:0 "\n\nHuşu içinde fısıldıyorum: #EMP "[ROOT.Char.GetHouse.GetMotto]."#!"
 bp1_yearly.4000.a:0 "Keşke sen de burada olsaydın..."
 bp1_yearly.4000.b:0 "Bu anın tadını çıkarmalıyım."
 bp1_yearly.4000.c:0 "Hatırana yönelik bir şiir yazacağım!"
 bp1_yearly.4000.c.success:0 "Aileniz bu jestinize minnettar kaldı"
 bp1_yearly.4000.c.failure:0 "Üzüntüden şiiri tamamlayamadınız"
 bp1_yearly.4000.d:0 "[family_memory_participant.GetFirstNameNoTooltip] sadakati için bir hediyeyi hak ediyor."
 bp1_yearly.4000.family_first:0 "[ROOT.Char.GetHouse.GetNameNoTooltip] hanesi adına!"
 bp1_yearly.4001.desc:0 "Yakınlarım etrafımda toplandıktan sonra şiirime başlıyorum:\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n"
 bp1_yearly.4001.desc.success_poem:0 "Etrafımdakilerin gözlerinin yaşardığını görebiliyorum. Umarım hatırana sahip çıkabilmişimdir, [family_memory_participant.GetFirstNameNoTooltip]."
 bp1_yearly.4001.desc.fail_poem:0 "...elimden bu kadarı geldi, daha ne yapayım?"
 bp1_yearly.4001.a:0 "Huzur içinde yat."
 bp1_yearly.4001.b:0 "Hatırana saygısızlık ettim!"
 bp1_yearly.4010.t:0 "Daha İyi Vasi"
### TODO AGOT-ONLY: bp1_yearly.4010.desc [AGOT: ]
 bp1_yearly.4010.desc:0 ""My dear [ROOT.Char.GetWifeHusband], I am worried for our [child_to_change_guardian.Custom('GetDaughterSon')] [child_to_change_guardian.GetFirstNamePossessive] education." My [parent_that_want_guardian_change.GetWifeHusband] [parent_that_want_guardian_change.GetFirstName] says, with concern in [parent_that_want_guardian_change.GetHerHis] voice.\n\n"
### TODO AGOT-ONLY: bp1_yearly.4010.desc.root [AGOT: ]
 bp1_yearly.4010.desc.root:0 ""The truth is... you're simply #EMP too busy#! to raise [child_to_change_guardian.GetHerHim]. "
### TODO AGOT-ONLY: bp1_yearly.4010.desc.other [AGOT: ]
 bp1_yearly.4010.desc.other:0 ""That [current_guardian.Custom2('InsultNoun', SCOPE.sC('parent_that_want_guardian_change'))] [current_guardian.GetFirstName] is not a good guardian. [current_guardian.GetSheHe|U] is simply too... #EMP [current_guardian.Custom2('InsultAdjective', SCOPE.sC('parent_that_want_guardian_change'))]!#! "
### TODO AGOT-CHANGED: bp1_yearly.4010.desc_end [AGOT: Our [child_to_change_guardian.Custom('GetDaughterSon')] needs a good, dedicated guardian, someone like my [proposed_guardian.Custom('ComplimentAdjective')] [parent_that_want_guardian_change.Custom2('RelationToMeShort', SCOPE.sC('proposed_guardian'))] [proposed_guardian.GetFirstName]! | TR: [Select_CString(child_to_change_guardian.IsFemale, 'Kızımız', 'Oğlumuz' )] daha iyi, kendini ona adayan bir vasiyi hak ediyor. Mesela [proposed_guardian.Custom('ComplimentAdjective')] [child_to_change_guardian.Custom2('RelationToMePossessive', SCOPE.sC('proposed_guardian'))] [proposed_guardian.GetFirstName]!]
 bp1_yearly.4010.desc_end:0 "Our [child_to_change_guardian.Custom('GetDaughterSon')] needs a good, dedicated guardian, someone like my [proposed_guardian.Custom('ComplimentAdjective')] [parent_that_want_guardian_change.Custom2('RelationToMeShort', SCOPE.sC('proposed_guardian'))] [proposed_guardian.GetFirstName]!" [parent_that_want_guardian_change.GetSheHe|U] continues.\n\n"Should I make the arrangements?" [parent_that_want_guardian_change.GetSheHe|U] says, looking at me hopefully."
 bp1_yearly.4010.a:0 "Elbette canım, [proposed_guardian.GetFirstNameNoTooltip] bu iş için uygun."
 bp1_yearly.4010.a_effect:0 "[child_to_change_guardian.GetFirstName] [Concept( 'education', 'eğitiminde' )|E] ilerliyor"
 bp1_yearly.4010.b:0 "[current_guardian.GetFirstNameNoTooltip] seçildiyse bir sebebi var!"
 bp1_yearly.4010.b_alt:0 "Hadi oradan! Onu tek başıma eğitebilirim!"
 bp1_yearly.4010.c:0 "Benim tercihim daha iyi, emin ol."
 bp1_yearly.4010.c_effect:0 "[child_to_change_guardian.GetFirstName] [Concept( 'education', 'eğitiminde' )|E] ciddi bir şekilde ilerliyor"
 bp1_yearly.4020.t:0 "Şairane Bir Dostluk"
### TODO AGOT-ONLY: bp1_yearly.4020.desc [AGOT: ]
 bp1_yearly.4020.desc:1 ""[ROOT.Char.GetFirstNameNoTooltip], my dear friend, I was once again reminded of your victory against [war_memory_participant.GetTitledFirstName] — so I decided to write a poem about your triumph!" [poetry_friend.GetFirstName] says, clearing [poetry_friend.GetHerHis] throat:\n\n[poetry_artifact.GetName]\n[poetry_artifact.GetDesc]"
 bp1_yearly.4020.a:0 "Bu şiiri [ROOT.Char.Custom('GetCourt')]a dinleteceğim!"
 bp1_yearly.4020.b:0 "Teşekkürler, bu şiiri yanımda taşıyacağım."
 bp1_yearly.4020.c:0 "Hah! [war_memory_participant.GetFirstNameNoTooltip] dâhil herkese bu şiiri gönderin!"
 bp1_yearly.4020.d:0 "Abartmışsın, sadece [ROOT.Char.GetFaith.HighGodName] bu kadar övgüye layıktır."
 bp1_yearly.4020.poetry:0 "[poetry_friend.Custom('GeneratePoem_Intro_Rhyming')]\n[poetry_friend.Custom('GeneratePoem_Outro_Rhyming')]"
 bp1_yearly.4020.poetry_title:0 "[poetry_friend.Custom('GeneratePoem_Title')]"
 artifact_poetry_name:0 "$bp1_yearly.4020.poetry_title$"
 artifact_poetry_description:1 "[ROOT.Char.GetTitledFirstNamePossessive] [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [war_memory_participant.GetTitledFirstName] karşısında aldığı zaferin şerefine [ROOT.Char.GetFirstNameNoTooltip] ile olan yakın dostluğuyla bilinen [poetry_friend.GetTitledFirstName] tarafından kaleme alınan bir şiir.\n\n$bp1_yearly.4020.poetry$"
 poetry_artifact_appended_desc:0 "[ROOT.Char.GetTitledFirstNamePossessive] [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [war_memory_participant.GetTitledFirstName] karşısında aldığı zaferin şerefine, [ROOT.Char.GetFirstNameNoTooltip] ile olan yakın dostluğuyla bilinen [poetry_friend.GetTitledFirstName] tarafından kaleme alınan bir şiir.\n\nŞiir şu şekilde:\n$artifact_poetry_description$"
 bp1_yearly.4020.a_effect:0 "[newly_created_artifact.GetName] bir [court_artifact|E] hâline getirilecek ve [grandeur|E] etkisi kazanacak"
 bp1_yearly.4020.b_effect:0 "[newly_created_artifact.GetName] adlı bir [artifact|E] elde edeceksiniz"
 bp1_yearly.4030.t:0 "Etkileyici Rakip"
### TODO AGOT-ONLY: bp1_yearly.4030.desc [AGOT: ]
 bp1_yearly.4030.desc:0 ""[ROOT.Char.Custom('CulturalCurse')|U]!" I shout as I read the letter.\n\nThat [marriage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marriage_rival'))] of mine, [marriage_rival.GetFirstName] — I spit on your name!"
 bp1_yearly.4030.desc_bond_broken:0 "\n\nBinbir çeşit hile ve hurdayla vasalım [marriage_vassal.GetTitledFirstName] ile evlenerek onun [spurned_partner.GetFirstName] ile olan bağını koparmakla kalmadın, aynı zamanda onu bana karşı kışkırttın!"
 bp1_yearly.4030.desc_no_broken_bonds:0 "\n\nBinbir çeşit hile ve hurdayla vasalım [marriage_vassal.GetTitledFirstName] ile evlenmekle kalmadın, aynı zamanda onu bana karşı kışkırttın!"
 bp1_yearly.4030.desc_end:0 "\n\nSenin yılan dilinden yalandan başka bir şey çıkmıyor... [marriage_vassal.GetFirstNameNoTooltip] senin umurunda değil, senin tek derdin bana #EMP acı çektirmek!#!"
 bp1_yearly.4030.a:0 "Onun ne kadar kötü biri olduğunu [marriage_vassal.GetFirstNameNoTooltip] bilmeli!"
 bp1_yearly.4030.b:0 "Demek evlilik bağını kopardı? [ROOT.Char.GetFaith.PriestNeuterPlural|U] gerekeni yapacaktır!"
 bp1_yearly.4030.c:0 "Belki de [spurned_partner.GetFirstNameNoTooltip] işime yarayabilir..."
 bp1_yearly.4030.d:0 "Peh! O [marriage_rival.Custom2('InsultNoun', ROOT.Char)] ateş olsa cürmü kadar yer yakar!"
 distrustful:0 "Güvensiz"
 bp1_yearly.4030.a.success:0 "[marriage_vassal.GetTitledFirstName] ikna edildi ve pişman oldu"
 bp1_yearly.4030.a.failure:0 "[marriage_vassal.GetTitledFirstName] yalan söylediğini düşündü"
 bp1_yearly.4030.b.success:0 "[marriage_vassal.GetTitledFirstName] yaptığı hatayı anladı"
 bp1_yearly.4030.b.failure:0 "[marriage_vassal.GetTitledFirstName] [ROOT.Char.GetFaith.PriestNeuterPlural] ile olan münakaşasında haklı çıkmayı başardı"
 bp1_yearly.4040.t:0 "Sevgili [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('kindly_grandmother'))|U]"
### TODO AGOT-ONLY: bp1_yearly.4040.desc.intro.1 [AGOT: ]
 bp1_yearly.4040.desc.intro.1:0 ""Oh, my dear, dear [ROOT.Char.GetFirstNameNoTooltip] — I love you so!" My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] says to me, carrying a plate of delectable treats. "I've made you some [ROOT.Char.Custom('FavoriteTreatDemand')], I know it's your favorite!"\n\nOh, [kindly_grandmother.GetSheHe] knows me so well! Of course, it's below [kindly_grandmother.GetHerHis] stature to make such things by hand, but... who am I to say no?"
### TODO AGOT-ONLY: bp1_yearly.4040.desc.intro.2 [AGOT: ]
 bp1_yearly.4040.desc.intro.2:0 ""More [ROOT.Char.Custom('FavoriteTreatDemand')] for my big [ROOT.Char.Custom('GirlBoy')]!" My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] bellows from the kitchen. "Come now, eat up!"\n\nMmm, it smells wonderful... just another bite couldn't hurt?"
### TODO AGOT-ONLY: bp1_yearly.4040.desc.feeding.1 [AGOT: ]
 bp1_yearly.4040.desc.feeding.1:0 ""[ROOT.Char.GetFirstNameNoTooltip], you enjoying my [ROOT.Char.Custom('FavoriteTreatDemand')] makes me the happiest [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] in the world!" [kindly_grandmother.GetFirstName] happily yells from the kitchen. "I've made an #EMP extra#! large batch today! Eat it all up now!"\n\n#flatulence Uurp..!#! Oh, it never stops... But I can't say no and hurt my dear [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))], can I?"
### TODO AGOT-ONLY: bp1_yearly.4040.desc.feeding.2 [AGOT: ]
 bp1_yearly.4040.desc.feeding.2:0 ""I've shaped this one like [ROOT.Char.Custom('GetLivestockFowlIndef')]!" My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] sings, carrying yet another plate of [ROOT.Char.Custom('FavoriteTreatDemand')]. "Look, it's flying right for your mouth!"\n\nOh dear [ROOT.Char.GetFaith.HighGodName], this is too much! But... [kindly_grandmother.GetHerHis] feelings, I must think of them..."
### TODO AGOT-ONLY: bp1_yearly.4040.desc.feeding.3 [AGOT: ]
 bp1_yearly.4040.desc.feeding.3:0 ""[ROOT.Char.GetFirstNameNoTooltip], where are you? I've boiled this batch of [ROOT.Char.Custom('FavoriteTreatDemand')] in butter!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] whispers, [kindly_grandmother.GetHerHis] gaze searching the kitchen for me.\n\nThis is getting well out of hand... #EMP What should I do!?#!"
### TODO AGOT-ONLY: bp1_yearly.4040.desc.feeding.4 [AGOT: ]
 bp1_yearly.4040.desc.feeding.4:0 ""Who knew that [ROOT.Char.Custom('FavoriteTreatDemand')] went so well with [ROOT.Char.Custom('GetExpensiveMeal')] — your favorite #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))]#! did, of course!" [kindly_grandmother.GetFirstName] shouts, carrying a plate with the most vile dish I've seen in my life. "Supper's ready, [ROOT.Char.GetFirstNameNoTooltip]!"\n\nNo matter how well I hide, [kindly_grandmother.GetSheHe] always finds me! Oh, my poor, bloated, body!"
 bp1_yearly.4040.a:0 "Tabii ki yerim!"
 bp1_yearly.4040.b:0 "Almayayım, teşekkürler."
 bp1_yearly.4040.c:0 "Bir ısırıktan zarar gelmez!"
 bp1_yearly.4040.d:0 "Yeter artık!"
 bp1_yearly.4040.e:0 "Onun duygularını kıramam..."
 bp1_yearly.4040.f:0 "Fiziksel olarak yemem #EMP mümkün#! değil!"
 bp1_yearly.4040.desc.dead:0 "Ah sevgili [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('kindly_grandmother'))], vefatın sonrası bitmek tükenmek bilmeyen çörek tabakları da durdu. Geriye dönüp baktığımda, sonsuza dek aramızdan ayrılmandansa, bir tabak daha çörek yemeyi tercih ederdim.\n\nElveda [kindly_grandmother.GetFirstName], huzur içinde yat."
 bp1_yearly.4040.dead:0 "Belki de senin şerefine birkaç çörek yemeliyim."
 bp1_yearly.4040.family_first:0 "Keşke biraz daha seninle konuşabilseydik."
