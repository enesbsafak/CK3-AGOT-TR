 epidemic_events.5004.desc: "Bir kükreme, bir gürültü, taht odasının kapıları ardına kadar açılıyor ve içeri bir köylü seli doluşuyor. Yaşlısı, genci, hastası, tüm gözler bana çevrilmiş durumda.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]," diye yalvarıyor içlerinden biri, "Bizi [epidemic_scope.GetName] felaketinden koruyun. Korumanız gerek."\n\nMuhafızlarım hazır bekliyor, emrimi gözlüyor."
