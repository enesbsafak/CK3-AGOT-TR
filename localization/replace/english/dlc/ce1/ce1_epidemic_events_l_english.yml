 epidemic_events.5002.desc: "Birlikte yürürken [steward.GetFirstName], [coastal_province.GetName] topraklarındaki salgına dair bazı bilgiler veriyor. Uzaktan baktığımızda kıyıya dizilmiş bedenleri görebiliyoruz. Yanında ise terk edilmiş bir bot kıyıya vurmuş bir şekilde bekliyor. Bir anda ona dönmemle beraber, meraklı bir yüz ifadesiyle bana baktığını görüyorum.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], isterseniz şu bedenlerden kolaylıkla kurtulabiliriz."\n\nTekrardan yüzünü bota çevirmesiyle neyi kastettiğini anlıyorum. Nihayetinde bot terk edilmiş ve bir şekilde bu bedenleri ortadan kaldırmak gerekiyor..."
 epidemic_events.5002.a: "Bu su hangi yöne akıyordur acaba?"
 epidemic_events.5002.a.tt: "Belki de bu botu #EMP başkasının#! problemi hâline getirebiliriz..."
