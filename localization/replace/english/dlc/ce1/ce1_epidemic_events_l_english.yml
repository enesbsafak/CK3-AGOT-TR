 epidemic_events.5901.t: "Dirsek Derinliği"
 epidemic_events.5901.desc: "Kadavra bir masanın üzerine yerleştirilmiş, masanın etrafında ürkütücü ekipmanlar, ben ve hekimim [physician.GetFirstName] duruyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], emin değilim..." diyor [physician.GetFirstNameNoTooltip] gözleri ayaklarına sabitlenmiş bir şekilde, gerginliğini gizleyemiyor. "Bu kadavradan ne öğrenebileceğimizi bilmiyorum..."\n\nNe öğrenebileceğimizi o çok iyi biliyor, sadece bunu ondan sormamı istemiyor. Hastalık taşıyan birinin kadavrasını incelemek hastalıkla başetmede çok önemli bilgiler verebilir. Tek mesele, bu incelemeyi yaparken hastalığı kapma ihtimalinin olup olmadığı..."
