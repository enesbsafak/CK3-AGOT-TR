 epidemic_events.5000.t: "Bir Şeyler Yap!"
 epidemic_events.5000.desc: "[infected_county.GetName] bölgesinden bir kara haber daha geldi.\n\n[church_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] raporu uzatıyor. "Halk harekete geçmemizi istiyor!" diyor. "Yaratıkları temizleyin, [epidemic.GetName] onlar tarafından yayılıyor! [ROOT.Char.GetFaith.HighGodName] böyle buyuruyor!"\n\nParşömene göz atıyorum. Gözleri amaçla parlıyor. Benimkilerse... şüpheyle."
 epidemic_events.5000.a: "Şu fareler yeterince pis görünüyorlar..."
 epidemic_events.5000.b: "Kediler #EMP her yere#! giriyor, kesin onların işi!"
 epidemic_events.5000.c: "Köpekler sürekli çamur içerisinde, onlardan kurtulalım!"
 epidemic_events.5000.d: "Koyunları kesmenin vakti geldi."
 epidemic_events.5000.e: ""Gerek yok.""
 epidemic_events.5001.t: "Kapıları Kapatın!"
 epidemic_events.5001.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U], gözleri fal taşı gibi açılmış, kucak dolusu [ROOT.Char.Custom('GetWritingMaterial')] ile içeri dalıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], [epidemic_county.GetNameNoTier] cesetlere boğulmuş durumda! Sokaklar ceset dolu!" Mektupları hışımla önüme bırakıyor. Telaşla hazırlanmış yığının içinde göz gezdiriyorum.\n\nEn son duyduğumda [epidemic_scope.GetName] kontrol altındaydı..."
