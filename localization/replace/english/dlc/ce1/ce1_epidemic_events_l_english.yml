 epidemic_events.5009.desc: "Pazar yeri genel olarak pis kokuyor ama tezgâhlardan birinden tuhaf derecede hoş bir koku geliyor.\n\n"Taze kokulu kesecikler! En iyi otlar!" diye sesleniyor tüccar. "[epidemic_scope.GetName] yokmuş gibi davranın!"\n\nDoğrusu umut verici kokuyor... gerçi fiyatı da bir hayli yüksek."
