 epidemic_events.1000.t: "[cult_epidemic.GetNameNoTooltip] Tarikatı"
 epidemic_events.1000.desc: "[charismatic_priest.GetFirstName] ismindeki bir rahibe göre [cult_epidemic.GetName] bize Tanrı tarafından gönderilen ilahi bir ceza ve bizi bu salgından sadece [charismatic_priest.GetFaith.HighGodNamePossessive|U] merhameti kurtarabilir. Kalabalıklar, ateş ve korkunun etkisiyle her geçen gün onun söylemlerine daha fazla ilgi gösteriyor.\n\nDizginlenmezse, bu veba tarikatı [infected_county.GetName] topraklarındaki [ROOT.Char.GetFaith.GetAdjective] yönetimini devirebilir."
 epidemic_events.1000.a: "Bu deliyi yakın!"
 epidemic_events.1000.b: "Bir sıkıntı görmüyorum."
 epidemic_events.1000.c: "Nihayet, işte [charismatic_priest.GetFaith.HighGodName|U]!"
 epidemic_events.1010.t: "Hayalet Sevgilim"
 epidemic_events.1010.desc: "[epidemic_scope.GetName|U] topraklarımı kasıp kavuruyor, şimdi de [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('superstitious_courtier'))] [superstitious_courtier.GetFirstName] kötü haberlerle geliyor.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip|U]," diye yalvarıyor: "[dead_lover.GetFirstName] için duyduğunuz aşk biliniyor. Ama veba ölülerle yayılır. Onun tabutunu mühürlemeli, kapağını çivileyip kapatmalıyız. Yoksa geri dönebilir ve vebayı yayabilir.""
### TODO AGOT-ONLY: epidemic_events.1010.a [AGOT: ]
 epidemic_events.1010.a: ""How dare you!""
 epidemic_events.1010.b: "Ya haklıysa..."
 epidemic_events.1010.c: "Tüm tabutlara çivi çakın!"
 all_realm_county_epidemic_scope: "[epidemic_scope.GetName] bulunan tüm [realm|E] [Concept( 'county', 'Kontlukları' )|E]"
 epidemic_events.1020.t: "[epidemic_county.GetNameNoTierNoTooltip|U] Dolaylarında Kötü Kokular"
 epidemic_events.1020.desc: "[epidemic_county.GetNameNoTier] bölgesinde ticaret durma noktasına geldi. [miasma_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U], ölümün miazmasını suçluyor ve tuhaf bir çare öneriyor.\n\n"Eğer güzel kokulu [epidemic_province.Custom('get_region_flower_type_plural')] ekersek, bu hoş koku vebayı kovabilir."\n\nTuhaf. Ama belki de vebanın kendisinden daha tuhaf değildir.""
 epidemic_events.1020.a: "Denemeye değer."
 epidemic_events.1020.b: "Hadi canım oradan."
 epidemic_events.1030.t: "Sülükler!"
 epidemic_events.1030.desc: "[leeched_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U], gözleri fal taşı gibi açılmış halde elinde bir çuval sülükle içeri dalıyor.\n\n"[epidemic_scope.GetName] felaketini durdurmanın tek yolu sülüklerdir!" diye haykırıyor.\n\nBunların yalnızca uzman gözetiminde kullanılması gerektiği söyleniyor fakat çaresiz zamanlardan geçtiğimiz ortada. Gerçekten beklemeyi göze alabilir miyiz?""
 epidemic_events.1030.a: "Herkese sülük dağıtalım!"
 epidemic_events.1030.a.success: "Sülükler başarılı oldu"
 epidemic_events.1030.a.failure: "Sülükler zarar verdi"
 epidemic_events.1030.b: "Hekimlerin sözünden çıkmamalıyız."
 epidemic_events.1040.t: "Kamçıcı Kült"
 epidemic_events.1040.desc.intro: "[epidemic_scope.GetName|U] yayılırken fanatikler ortaya çıkıyor. Sokaklarda kendilerini kırbaçlıyor, bunun ilahî merhameti getirdiğini iddia ediyorlar.\n\n"
 epidemic_events.1040.desc.mid.approves: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('chaplain'))|U] [chaplain.GetFirstName] gözleri parlayarak yaklaşıyor. "Süzerenim, bu ilahî kefaretin vücut bulmuş hâlidir. Davalarını kutsamalıyız!""
 epidemic_events.1040.desc.mid: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] öfkeden deliye dönmüş durumda. "Bu bir sapkınlık! Bunu mahkûm etmelisiniz."\n\nKalabalığın haykırışları daha da yükseliyor."
 epidemic_events.1040.a: "Bu sapkınlığı durdurmalıyız!"
 epidemic_events.1040.b: "Yalnızca kendilerine zarar veriyorlar."
 epidemic_events.1040.c: "Eğer doğruyu söylüyorlarsa, öyleyse ben de kendimi kırbaçlayacağım!"
 epidemic_events.1050.t: "Kıyamet"
 epidemic_events.1050.desc: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('chaplain'))|U] [chaplain.GetFirstName] ile dışarıda volta atarken karşılaşıyorum. Yüzü solmuş, perişan hâlde. "[ROOT.Char.GetTitleAsNameNoTooltip|U], sapkınlar [epidemic_scope.GetName] felaketinin [ROOT.Char.GetFaith.HighGodNamePossessive] gazabı olduğunu, kıyametin yaklaştığını haykırıyor!"\n\nŞiddet.. Panik... Sokaklarda kıyamet vaaz eden fanatikler.\n\n"Bir şey yapmalıyız. Yoksa delilikleri, geriye kalan şu kadarcık düzeni de yutacak.""
 epidemic_events.1050.a: "Yobazları ortadan kaldırın!"
 epidemic_events.1050.b: "Din adamları göndererek haksız olduklarını kanıtlayalım!"
 epidemic_events.1050.b.tt.success: "Kıyamet korkusu sona erdi"
 epidemic_events.1050.b.tt.failure: "Halk ikna olmadı"
 epidemic_events.1050.c: "Belki de haklılardır..."
 story_plague_trials_title: "Veba Yargılamaları:"
 epidemic_events.1060.t: "$story_plague_trials_title$ Veba Taşıyıcıları"
 epidemic_events.1060.desc.intro: "[epidemic_scope.GetName] yayılırken, korku deliliği doğuruyor.\n\n"
 epidemic_events.1060.desc.mid.cats: "Fısıltılar, vebayı kedilerin getirdiğini söylüyor. Köylüler kedileri kuyularda boğuyor ya da sepetlerin içinde yakıyor. Bir zamanlar haşerat avlarlarken, şimdi kendileri avlanıyor."
 epidemic_events.1060.desc.mid.dogs: "Köylüler şimdi köpeklerin vebayı taşıdığını, gözlerinin lanetli bir ışıkla parladığını iddia ediyor. Sürüler hâlinde avlanıyor, göstermelik yargılamalara çıkarılıyor, hatta yakılıyorlar."
 epidemic_events.1060.desc.mid.faith: "[faith_to_blame.GetAdherentNamePlural], uzun zamandır hoş görülenler artık bir lanet olarak görülüyor. "Gökleri öfkelendirdiler," diyor köylüler, "ve şimdi bunun acısını biz çekiyoruz." Mabetleri tahrip ediliyor. Duaları kendi aleyhlerine çevriliyor."
 epidemic_events.1060.desc.mid.trait: "Yasak arzular, tuhaf âdetler ya da hor görülen rezillikler sergileyen herkes yakalanıyor. Gevşek bir bilek, edepsiz bir şaka, üstü kapalı bir suçlama — mahvolmaları için yeterli."
 epidemic_events.1060.desc.mid2.witches: "Cadıların toprağı lanetlediğini söylüyorlar — bilge kadınlar, ebeler, dışlanmışlar. Komşuları tarafından suçlanıyor, evlerinden sürükleniyor, çığlıktan başka yargılama olmaksızın mahkûm ediliyorlar."
 epidemic_events.1060.desc.mid2.sin: "Köylüler toplum olarak günahkârlaştığımızı ve ancak sert cezalar ve tövbeler ederek [ROOT.Char.GetFaith.HighGodName] tarafından tekrar kabul edilebileceğimizi iddia ediyor."
 epidemic_events.1060.desc.outro: "\n\nBu düşünceler [ROOT.Char.GetFaith.PriestNeuterPlural|U] tarafından kınansa da, ölümler artarak devam ediyor."
 epidemic_events.1060.a: "Yapacak bir şey yok."
 epidemic_events.1060.b: "Onları durdurun!"
 epidemic_events.1060.c: "Belki de [ROOT.Char.GetFaith.ReligiousText|U] bize yol gösterir."
 witch_trial_story_tt: "#EMP Kötü günleri geride bıraktık şimdi sırada daha kötü günler var...#!"
 epidemic_events.1061.t: "$story_plague_trials_title$ Hayvan Ateşi"
 epidemic_events.1061.desc.intro: "Gökyüzünün turuncuya bürünmüş hâline ve havayı boğan dumana uyanıyorum. Köylüler kasabayı ateşe mi verdi?\n\n"
 epidemic_events.1061.desc.mid.cats: "Hayır, kedileri yakmışlar. [chaplain.GetTitledFirstName], [epidemic_scope.GetName] belasını savuşturmak için canlı canlı yakıldıklarını söylüyor."
 epidemic_events.1061.desc.mid.dogs: "Hayır, köpekleri yakmışlar. [chaplain.GetTitledFirstName], [epidemic_scope.GetName] belasını savuşturmak için canlı canlı yakıldıklarını söylüyor."
 epidemic_events.1061.desc.outro: "\n\n"Korkunç bir görüntü," diye homurdanıyor. "Ama bir o kadar da rağbet görüyor.""
 epidemic_events.1061.a: "Yapacak bir şey yok."
 epidemic_events.1061.a.success: "Hayvanları yakmanın bir faydası olmadı"
 epidemic_events.1061.a.failure: "Hayvanları yakmak salgını daha da şiddetlendirdi"
 epidemic_events.1061.b: "Derhâl onları durdurun!"
 epidemic_events.1061.c: "Hayvanlara zarar vermek suç sayılmalı."
 epidemic_events.1062.t: "$story_plague_trials_title$ Yakalayıcılar"
 epidemic_events.1062.desc.intro: "Ter ve duman kokan bir grup kaçak avcı, [ROOT.Char.Custom('GetCourt')] salonuna giriş yapıyor.\n\n"
### TODO AGOT-ONLY: epidemic_events.1062.desc.mid.cats [AGOT: ]
 epidemic_events.1062.desc.mid.cats: ""My liege, it's the cats. Slippery beasts — too many eyes, never sleep. Folk say they bring the plague with their purring.""
### TODO AGOT-ONLY: epidemic_events.1062.desc.mid.dogs [AGOT: ]
 epidemic_events.1062.desc.mid.dogs: ""My [ROOT.Char.GetTitleAsNameNoTooltip|U], the dogs are cursed. Everyone knows it. Let us finish the purge — every beast, every mutt, until the plague ends.""
 epidemic_events.1062.desc.outro: "\n\nKan çoktan çizmelerine bulaşmış halde, sırıtarak sizin onayınızı bekliyorlar."
 epidemic_events.1062.a: "Hepsini öldürün."
 epidemic_events.1062.a.no_effect: "Hayvanları öldürmenin bir faydası olmadı"
 epidemic_events.1062.a.success: "Salgın hafifledi"
 epidemic_events.1062.a.failure: "Salgın daha da şiddetlendi"
 epidemic_events.1062.b: "Onları yakalayıp başkente getirin."
 epidemic_events.1062.b.no_effect: "Bunun bir etkisi olmadı"
 epidemic_events.1062.b.failure: "Başkent vahşi hayvanlarla doldu"
 epidemic_events.1063.t: "$story_plague_trials_title$ Tövbe Et!"
 epidemic_events.1063.desc.intro: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U] merkezine yakın bir yerde bir kalabalık toplanmış, havaya panik hakim. Gürültünün içinden sert ve gür bir sese sahip yalnız bir vaizin sesi yükseliyor.\n\n"Tövbe edin! Tövbe edin!""
 epidemic_events.1063.desc.mid.faith: "Bu salgında [faith_blamed.GetAdherentNamePlural] suçsuz!"
 epidemic_events.1063.desc.mid.sin: "Bu salgın günahlarımız sebebiyle [ROOT.Char.GetFaith.HighGodName|U] tarafından gönderilen bir ceza."
 epidemic_events.1063.desc.mid.witch: "Gözümüzü cadılara değil, kendimize çevirmeliyiz."
 epidemic_events.1063.desc.mid.cats: "Bu salgından kediler gibi acınası ve zavallı hayvanları mesul tutmak doğru değil."
 epidemic_events.1063.desc.mid.dogs: "Bu salgından köpekleri mesul tutmak doğru değil."
 epidemic_events.1063.desc.outro: "Yalnızca [virtuous_trait.GetName(ROOT.Char)] olmaya çabalayarak vebanın sona ermesini umut edebiliriz."\n\nİnsanlar onaylarcasına mırıldanıyor. Doğrusu, içimin bir yanı onların haklı olup olmadığını merak ediyor. Günahım derin, hem de yüksek sesle itiraf edeceğimden daha derin. Ve eğer bu veba bir hükümse... o hâlde belki de benimle başlıyordur."
 epidemic_events.1063.a: "Tövbe ediyorum!"
 epidemic_events.1063.b: "Saçma sapan laflar."
 epidemic_events.1063.c: "Basit bir sokak vaizini alt edebilirim."
 epidemic_events.1063.c.success: "Vaizi alt ettiniz"
 epidemic_events.1063.c.failure: "Rezil oldunuz"
 epidemic_events.1064.t: "$story_plague_trials_title$ Arınma Ateşleri"
 epidemic_events.1064.desc.intro: "Hurafeleri bastırma çabalarıma rağmen, ülke çapında cadı yargılamaları artarak devam ediyor. En şiddetlileri ise [witch_trial_county.GetNameNoTier] bölgesinde yaşanıyor. [epidemic_scope.GetName] o bölgede korkuyu iyice öfkeye dönüştürmüş vaziyette.\n\n"
 epidemic_events.1064.desc.mid.sin: "Aramızda [trait_blamed.GetName(ROOT.Char)] olanları kökünden kazıma adına masumları suda boğuyor, hastaları yakıyorlar. Her bir ateş yığını, topraklarımı daha yoksul ve daha korkmuş bırakıyor."
 epidemic_events.1064.desc.mid.witch: "Masumları suda boğuyor, hastaları yakıyorlar, hepsi de arınma adına. Her bir ateş yığını, topraklarımı daha yoksul ve daha korkmuş bırakıyor."
 epidemic_events.1064.desc.outro: "\n\nEğer bu adaletse, ne [ROOT.Char.GetFaith.HighGodName|U] ne de taç bundan bir fayda görüyor."
 epidemic_events.1064.a: "[witch_trial_county.GetNameNoTierNoTooltip] bölgesine mübaşirleri gönderin. Bu iş orada bitecek."
 epidemic_events.1064.b: "Yargılamaları durdurun!"
 epidemic_events.1064.c: "Bu uygulamaya son verilmesi çağrısında bulunacağım."
 epidemic_events.1064.c.success: "Çağrınız kabul gördü"
 epidemic_events.1064.c.failure: "Yargılamalar devam ediyor"
 epidemic_events.1065.t: "$story_plague_trials_title$ Utanç"
 epidemic_events.1065.desc.intro: "Korkunun vebası artık kendi haneme de dokunuyor.\n\nVaizler güruhu gözlerini [shamed_buddy.Custom2('MyCharacterIntroduction', ROOT.Char)] üzerine çevirdi. Dediklerine göre"
 epidemic_events.1065.desc.mid.sin: "[trait_blamed.GetName(shamed_buddy)] olmakla suçluymuş,"
 epidemic_events.1065.desc.mid.witch: "cadıymış"
 epidemic_events.1065.desc.outro: "ve [ROOT.Char.GetFaith.EvilGodNames] ile düşüp kalkıyormuş. Şimdi de alenen cezalandırılmasını istiyorlar.\n\nOnları reddetmek isyan tehlikesi doğurur. Boyun eğmekse tacı utandırır."
 epidemic_events.1065.a: "Ne istiyorlarsa verin."
 epidemic_events.1065.b: "Olmaz!"
 epidemic_events.1065.c: "Onun yerine ben gideceğim."
 epidemic_events.1066.t: "$story_plague_trials_title$ Sürgün"
 epidemic_events.1066.desc: "Hiçbir söz köylüleri yola getirmeyecek gibi görünüyor. Her şeye rağmen [epidemic_scope.GetName] felaketinden [faith_blamed.GetAdherentNamePlural] sorumlu diye düşünüyorlar. Tüccarlar tacize uğruyor, evleri tahrip ediliyor. Birçoğu kaçtı ve ticaret zarar gördü.\n\nDaha da kötüsü, bazı köylerde avlanıyorlar.\n\nBu zulüm sürerse ülkem daha büyük zarar görebilir, hem de vebadan değil, korkudan."
 epidemic_events.1066.a: "Bu davranışı cezalandırmalıyız."
 epidemic_events.1066.b: "Yapabileceğim bir şey yok."
 epidemic_events.1066.c: "Başkentte onlar için bir yer ayarlayacağım."
 epidemic_events.1067.t: "[faith_blamed.GetAdjectiveNoTooltip|U]"
