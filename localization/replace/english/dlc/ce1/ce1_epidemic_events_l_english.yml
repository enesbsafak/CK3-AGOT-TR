 epidemic_events.1068.t: "$story_plague_trials_title$ Borç Meselesi"
 epidemic_events.1068.desc: "[epidemic_scope.GetName] felaketinden [faith_blamed.GetAdherentNamePlural] sorumlu diyenler, ülke çapında ticareti adeta durma noktasına getirdi.\n\n[loneless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U], bir dilenciye dönmüş hâlde sendeleyerek içeri giriyor. "Bu zulüm borç verenleri kaçırdı, [ROOT.Char.GetTitleAsNameNoTooltip|U]. Hastalık korkusu ve bunların zulmü, parayı kaçırdı. Tefecilik ortadan kayboldu. Hazinem kurudu.""
