 epidemic_events.1110.t: "Sokaklardaki Bedenler"
 epidemic_events.1110.desc: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U], yüzü sapsarı kesilmiş hâlde geliyor.\n\n"Efendim, ölüler sokaklarda çürüyor. Onları yeterince hızlı gömemiyoruz, miazma yoğunlaştı. [graveyard_county.GetName] bölgesindeki [GetBuilding('burial_site_01').GetName] bir an önce açılmalı."\n\nİzin istemiyor. Adeta buna yalvarıyor."
 epidemic_events.1110.a: "Pekala."
 epidemic_events.1110.b: "Orası sadece benim için.."
 epidemic_events.1120.t: "Şeytani Fikir"
 epidemic_events.1120.desc: "[flung_corpse_location.GetName] topraklarına girerken aklıma şeytani bir fikir geliyor. [epidemic_scope.GetName] etkisini iyiden iyiye askerler üzerinde de göstermeye başladı. Aklıma gelen fikir sayesinde, öldüklerinde dâhi bana hizmet edebilirler.\n\nCesetlerden yükselen kötü koku daha fazla askerimin hayatını yitirmesine sebep olacak, bu sebeple bu cesetlerden kurtulmanın bir yolunu bulmam gerekiyor. Belki de bir mancınık yardımıyla bu cesetlerin bir kısmını [corpse_flingee.GetName] taraflarına fırlatabilirim..."
 epidemic_events.1120.a: "Cesetleri yükleyin!"
 epidemic_events.1120.b: "Yok artık!"
 epidemic_events.1121.t: "Gökten Gelen Hediye"
 epidemic_events.1121.desc: "[corpse_flinger.GetName] topraklarıma doğru hareket ederken bir anda ordusunu durduruyor, anlaşılan kuşatmaya hazırlıkları yapıyorlar.\n\nBir süre sonra dışarıdan büyük bir patlama sesinin geldiğini duyuyorum, böylesine bir sesin neyden gelmiş olabileceğini anlamak için dışarıya baktığımda gördüklerim dehşete düşmeme sebep oluyor.\n\nİç içe geçmiş et ve kemik parçaları, bir kasabın deposundan toplanıp fırlatılmış gibi. Bu cesetler şüphesiz ki tanınmamış bir hastalıktan muzdaripler ve hemen harekete geçmezsek salgına sebebiyet verebilirler."
 epidemic_events.1121.a: "Geri yollayın!"
 plague_averted_tt: "Salgın atlatıldı"
 plague_still_infects_tt: "Cesetler hareket ettirilemiyor"
 epidemic_events.1121.b: "Cesetleri karantina altına alın ve burayı temizleyin!"
 epidemic_events.1121.b.success: "Karantina başarılı oldu"
 epidemic_events.1121.b.failure: "Karantina başarısız"
 epidemic_events.1121.c: "Benden uzak tutun yeter!"
 epidemic_events.1122.t: "İade-i Ziyaret"
 epidemic_events.1122.desc: "[flung_corpse_location.GetName] surlarının arkasından önce bir ıslık sesi geliyor. Islık sesini takip eden bir obje havada bir süre hareket ettikten sonra kampın ortasına isabet ediyor.\n\nYere düşmesiyle birlikte etrafa et parçaları, kemikler ve dişler savruluyor. Anlaşılan 'hediyemizi' beğenmeyip iade etmek istemişler."
 epidemic_events.1122.a: "Onu tekrar göndermemiz mümkün değil."
 epidemic_events.1122.b: "Cesetleri bir araya getirip tekrar fırlatın!"
 epidemic_events.1122.b.success: "Cesetleri bir araya getirmeyi başarıyorsunuz"
 epidemic_events.1122.b.failure: "$plague_still_infects_tt$"
 epidemic_events.1123.t: "Et Yağmuru"
 epidemic_events.1123.desc: "Penceremden gelen, yağmuru andıran tuhaf bir ses dikkatimi çekiyor. En son baktığımda gökyüzünde bulut yoktu, tekrar pencerenin yanına gittiğimde ilk olarak masmavi gökyüzünün tadını çıkarıyorum.\n\nArdından elimde bir ıslaklık hissi oluşuyor, tutunduğum yere baktığımda parmaklarımın kahverengi kana boyandığını görüyorum. Evlerin çatıları et ve kemik parçalarıyla dolu. Anlaşılan cesetler bir kere daha mancınıkla şehre fırlatılmış ve artık tamamen ayırt edilemez bir et yığınına dönüşmüşler."
 epidemic_events.1123.a: "Felaket."
