 epidemic_events.5906.t: "Kamçıcılar"
 epidemic_events.5906.desc: "Muhafızlar konsey odasına girmeden evvel genelde birkaç kere düşünürler fakat bugün önlerinde mareşalim [marshal.GetFirstName] ile birlikte bir anda rahatlıkla içeriye dalıyorlar. Arkalarında elinde kamçı taşıyan çekik gözlü tuhaf biri dikkatimi çekiyor.\n\n"Onu [doomsday_province.GetName] dolaylarında bulduk, elindeki şeyle kendini dövüyordu." [marshal.GetFirstNameNoTooltip|U] gözleriyle kırbacı işaret ediyordu. "Bölge halkında ciddi bir rahatsızlığa sebep olmuş, herkese büyük bir salgının geldiğini ve herkesin tövbe edip günahlarından arınması gerektiğini söylüyormuş.""
