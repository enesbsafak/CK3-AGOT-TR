 epidemic_events.5003.desc: "[location.GetName] sokaklarına çamur ve sefalet sinmiş durumda. Bir anda köylünün teki bana doğru hareket ediyor, yanında küçük bir çocuk var.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], lütfen," diye yalvarıyor. "Çocuğum çok hasta. Sizin asil dokunuşunuz onu iyileştirebilir..."\n\nÇocuk sendeleyip duruyor." 
