 epidemic_events.5005.desc: "Altın kıyılardan akar, [epidemic_scope.GetName] felaketi de öyle.\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bir plan öneriyor: Tüccarların mallarını boşaltmadan önce karantina altına alınması. "Bu bizi güvende tutar," diye ısrar ediyor.\n\nKarantina uygulamak daha az vergi demektir. Güvenlik bu bedele değer mi?"
