 epidemic_events.5006.t: "Gülüşmeler"
 epidemic_events.5006.desc: "Kahkahalar salonlarda yankılanıyor, [epidemic_scope.GetName] felaketi dışarıda hâlâ kol gezerken oldukça tuhaf bir manzara.\n\n[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] ile gözgöze geliyorum: "Bu kadar komik olan ne?"\n\nSırıtarak cevap veriyor: "Hekimler, hastalığın kötü ruh hâlinden geldiğini söylüyor... biz de onu gülerek defediyoruz!""
