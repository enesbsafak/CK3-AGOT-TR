 epidemic_events.2001.t: "İki Cepheli Savaş"
 epidemic_events.2001.desc: "[pleading_vassal.GetName|U], titreyerek dizlerinin üzerine çöküyor.\n\n"Süzerenim, iki ayrı vebanın pençesindeyim. [epidemic_scope.GetName|U] halkımı yiyip bitiriyor. Şimdi de [attacking_vassal.GetName] topraklarımın peşine düştü. İkisiyle birden savaşamam."\n\nGetirebildiği her şey olan küçük bir altın sandığını önüne koyuyor.\n\n"Yalvarırım. İki diyar da ayakta kalamaz hâle gelmeden önce bu savaşı sona erdirmeme yardım edin.""
 epidemic_events.2001.a: "Bu saçmalığa derhâl bir son vereceğim."
 epidemic_events.2001.b: "Ne cüretle [epidemic_scope.GetNameNoTooltip] ile kapıma gelirsin?"
 epidemic_events.2001.b.desc: "Muhafızlar! Bu gafili #EMP dikkatlice#! yakalayın ve dokunduğu her şeyi #EMP daha da dikkatlice#! yıkayın!"
 epidemic_events.2001.c: "[attacking_vassal.GetTitledFirstNameNoTooltip] ile konuşarak bu işi çözebiliriz."
 epidemic_events.2001.c.success: "[attacking_vassal.GetFirstNameNoTooltip] savaşı sonlandırması için ikna ediliyor"
 epidemic_events.2001.c.failure: "[vassal_war.GetName] devam ediyor"
 epidemic_events.2001.epidemic_spread.t: "[epidemic_scope.GetName] yayılmaya başladı!"
 epidemic_events.2001.danger: "#color_red Eğer savaş bir an önce sona ermezse, büyük bedelleri olabilir...#!"
 epidemic_events.2002.t: "İki Cepheli Savaş: Bedel"
 epidemic_events.2002.desc: "[vassal_war.GetName|U] uzadıkça uzuyor. Adamlar toprak uğruna ölüyor ve toprak da onları yığınlar hâlinde geri veriyor.\n\nŞimdi [epidemic_scope.GetName] daha da hızlı yayılıyor, çürüyen cesetlerden, boşalmış köylerden ve kuşatmanın deliliğinden besleniyor. Bu savaşın kazananı yok. Herkes ölüyor."
 epidemic_events.2002.a: "Yazık."
 epidemic_events.2003.t: "Görünmez Düşman"
### TODO AGOT-ONLY: epidemic_events.2003.desc [AGOT: ]
 epidemic_events.2003.desc: ""Our soldiers fall without a fight. [epidemic_scope.GetName|U] has taken more than any blade."\n\n[marshal.GetName] speaks harshly, but he's right. From [first_epidemic_province.GetName] to [second_epidemic_province.GetName], the barracks lie empty. There are no warriors left — only peasants and plague."
 epidemic_events.2003.a: "Yapılacak bir şey yok, bırakın ölsünler."
 epidemic_events.2003.a.flavor: "İyi askerler her zaman altın bulsa da, altın iyi askeri nadiren bulur."
 epidemic_events.2003.b: "Gerekirse tarlalardaki köylüleri orduya çağırın."
 epidemic_events.2003.b.flavor: "Köylüler kimi zaman yetenekli savaşçıların yerine geçebilir - özellikle çok dikkat verilmiyorsa.."
 epidemic_events.2003.c: "Kışlaların kapısını kapatın."
 epidemic_events.2003.c.flavor: "Günlük talimleri olmadan askerlerim daha verimsiz olacaktır fakat bu önlem onların hayatta kalmalarını sağlayabilir."
 epidemic_events.2005.t: "İlaç Kavanozu"
 epidemic_events.2005.desc: "Kendimi sık sık [physician.GetName] ile konuşurken buluyorum. [epidemic_scope.GetName] felaketinin dehşeti her zaman aklımın bir köşesinde. Bugün onun çalışma odasını ziyaret ettiğimde tuhaf bir kavanoz gözüme ilişiyor.\n\n"Bu kavanoz beni koruyor," diyor. "Hastalığa karşı bir kalkan.""
 epidemic_events.2005.a: "Tehlikelerden asıl korunması gereken kişi ben değil miyim?"
 epidemic_events.2005.a.success: "[physician.GetFirstName] kavanozundan ayrılıyor."
 epidemic_events.2005.a.failure: "[physician.GetFirstName] ikna olmadı."
 epidemic_events.2005.b: "Bu kavanoz hayat mı kurtarıyor? Öyleyse benim olmalı!"
 epidemic_events.2005.b.success: "Boğuşarak kavanozu alıyorsunuz"
 epidemic_events.2005.b.failure: "Kavanoz kırılıyor!"
 epidemic_events.2005.c: "Öyle diyorsan öyle olsun."
 epidemic_events.2006.t: "Dans Hastalığı"
 epidemic_events.2006.desc: "Bir köylü avlumda kıvranıyor, ayaklarıyla toprağı durmaksızın, delirten bir ritimle dövüyor.\n\n"Onu bağışlayın, Süzerenim," diyor yanındakilerden biri. "[dance_victim.GetFirstName], günlerdir dinlenmeden dans ediyor, hatta ona katılanlar bile var. Ne yaptıysak durmasını sağlayamadık."\n\nYüzü acı ve sevinçle buruşuyor. Delilik ya da daha beteri onu bir şekilde pençesine almış durumda."
 epidemic_events.2006.a: "Sebepsiz yere dans etmek mi? #EMP Harikulade!#!"
 epidemic_events.2006.b: "Her dansın bir sonu vardır. #EMP Değil mi?#!"
 epidemic_events.2006.c: "Halat getirin de şunu bağlayalım!"
 epidemic_events.2006.d: "[ROOT.Char.GetFaith.HighGodName] aşkına yerinde dur be [Select_CString(dance_victim.IsFemale, 'kadın', 'adam' )]!"
 epidemic_events.3000.t: "$travel_danger_prefix$ Kapıdaki Kan"
 epidemic_events.3000.desc: "[epidemic_location.GetName] boydan boya kırmızıya boyanmış. Öksürükten başka bir şeyin sesi duyulmuyor. Atlarımızla ilerliyoruz fakat [companion.GetTitledFirstName] özellikle düne nazaran daha solgun görünüyor, dudaklarında hiç kan kalmamış gibi.\n\n"Yardım edin..." Ceset zannettiğimiz bedenlerden birisi hareket ediyor, vücudu tamamen [sick_peasant.Custom('disease_desc_short')]."
