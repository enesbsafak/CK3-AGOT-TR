 epidemic_events.5904.d: ""Don't listen to [doomsday_preacher.GetHerHim]!""
 epidemic_events.5904.d.tt: "[doomsday_province.GetName] ile komşu tüm baronluklar #color_white 15%#! ihtimalle aynı etkiye sahip olur"
 epidemic_events.5905.t: "Sinirleri Yatıştırma"
 epidemic_events.5905.desc: "Beni görmelerinin yarattığı şok insanlar üzerindeki etkisini yitirdikten sonra, bu meyhane dinlenmek için oldukça güzel bir yer hâline geldi. Her şeye rağmen hancı biraz gergin görünüyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], büyük salgını duydunuz değil mi? İnsanlara neler yaptığını duydunuz mu? Söylenene göre hastalığa kapılanlar #EMP [ROOT.GetCharacter.Custom('GetPlagueEffect')]!#!" Hancının içerisinde olduğu panik hâli yüzünden okunuyor. "Yani dediklerine göre öyleymiş! Eğer doğruysa, nasıl hayatta kalacağız?!"\n\nHancı tüm bu konuşmasıyla meyhanedekilerin dikkatini çekmeyi başarmış, herkes benim ne diyeceğimi bekliyor..."
