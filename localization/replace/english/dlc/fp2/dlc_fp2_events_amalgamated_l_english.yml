 fp2_struggle.1011.e:0 "Şanlı, #italic Süheyl#!."

 fp2_struggle.1011.f:0 "Kesici, #italic Bettâr#!."

 fp2_struggle.1011.g:0 "Sağlam, #italic Kazib#!."

 fp2_struggle.1011.h:0 "Kör eden zümrüt gibi, #italic Zümurrüd#!."

 fp2_struggle.1011.i:0 "Gök gürültüsü gibi, #italic Ortzi#!."

 fp2_struggle.1011.j:0 "Gecenin ruhu, #italic Gaueko#!."

 fp2_struggle.1011.k:0 "Kızıl, #italic Gorri#!."

 fp2_struggle.1011.l:0 "Küçük bıçak, #italic Aiztoto#!."

 fp2_struggle.1011.m:0 "Sivri, #italic Escremire#!."

 fp2_struggle.1011.n:0 "Yaprak, #italic Folha#!."

 fp2_struggle.1011.o:0 "Mert, #italic Proeza#!."

 fp2_struggle.1011.p:0 "İşkenceci, #italic Trebalhar#!."

 fp2_struggle.1011.q:0 "Eski dönemlerin kahramanı gibi, #italic Sufax#!."

 fp2_struggle.1011.r:0 "Ak kılıç, #italic Toumellalt#!."

 fp2_struggle.1011.s:0 "Boyunduruk, #italic Ayugu#!."
 fp2_struggle.1011.u:0 "Tabii ki, #italic Demir Ruh#!."
 fp2_struggle.1011.v:0 "#italic Ökseotu#! hoşuma gidiyor..."

