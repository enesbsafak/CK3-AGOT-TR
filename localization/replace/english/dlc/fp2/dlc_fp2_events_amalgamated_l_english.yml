 fp2_struggle.2003.desc:0 "Yaralı ve hayal kırıklığına uğramış bir paralı asker grubu [fp2_2003_county_town.GetName] topraklarına ulaştı. Halk, paralı askerlerin"
 fp2_struggle.2003.a:0 "Ayrılmalarını rica et."
 fp2_struggle.2003.a.a.notif:0 "Haydutlar Ricanızı Görmezden Geliyor"
 fp2_struggle.2003.a.b.notif:0 "Barışçıl Çözüm"
 fp2_struggle.2003.b:0 "Onlara şehir garnizonunda bir iş teklif et."
 fp2_struggle.2003.b.desc:0 "Garnizon bu tecrübeli birlikleri kullanabilir ve yaralı bir canavarı beslemek onu evcilleştirmenin en hızlı yoludur"
