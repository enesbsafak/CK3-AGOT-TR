 fp2_btw_struggle.0501.t:0 "Duvar Ötesi $btw_struggle$"

 fp2_btw_struggle.0501.desc:0 "Duvar'ın ötesindeki özgür halkın birbirinden farklı boyları, köklü geçmişinden doğan bir çatışmayla kargaşa içinde. Gece Nöbeti bu toprakları keşif seferleriyle tehdit ederken, diğerleri sıcaklık ve barış umuduyla güneye kaçıyor. Ama bu topraklarda doğup ölenler, kaderini sonunda belirleyecek.\n\n"

 fp2_btw_struggle.0501.desc.involved:0 "Sur'un kuzeyindeki Yabanıllar binlerce yıldır kendi aralarındaki çatışmalarda tükeniyor. Kendilerine Özgür Halk derler ama vahşilerden başka bir şey değiller.\n\nGece Nöbetçileri, Sur'un ötesindeki Yabanıl sürülerine karşı son umuttur. Ben karanlıktaki kılıcım. Ben Sur'daki gözcüyüm. Ben insan diyarlarını koruyan kalkandım.\n\n"

 fp2_btw_struggle.0501.desc.interloper:0 "Sur'un kuzeyindeki Yabanıllar binlerce yıldır kendi aralarındaki çatışmalarda tükeniyor. Kendilerine Özgür Halk derler ama vahşilerden başka bir şey değiller.\n\nGece Nöbetçileri, Sur'un ötesindeki Yabanıl sürülerine karşı son umuttur. Ben karanlıktaki kılıcım. Ben Sur'daki gözcüyüm. Ben insan diyarlarını koruyan kalkandım.\n\n"

 fp2_btw_struggle.0501.desc.mottocall:0 "[ROOT.Char.GetHouse.GetMotto]!"

 fp2_btw_struggle.0501.a:0 "Kaderin dizginlerini eline al!"

 fp2_struggle.0900.t:0 "$struggle_iberia_ending_hostility_decision$"

 fp2_struggle.0900.opening.basque:0 "[ROOT.Char.GetCulture.GetNameNoTooltip] halkı olarak yüzyıllarca saldırganlara karşı dayandık: Vizigotlara, Galyalılara, Mağriplilere... ama hepsi zamanla karşımızda devrildi. Şimdi, İberya'nın kaderi bir kere daha #EMP bizim#! elimizde."

 fp2_struggle.0900.opening.andalusian:0 "Halkımızın tarihî farklılıklarımız kadar karışık ve güçlü olduğumuz kadar zengin. İberya'nın geleceği bir kez daha Emevilerin haleflerince belirlenecek."

 fp2_struggle.0900.opening.iberian:0 "İberya halkları Mağribi işgalcilerden çok fazla çekti; artık yüzyıllar önce Roma'nın gerçek vârislerinin kaybettiği umudu geri getireceğiz."

 fp2_struggle.0900.opening:0 "İberya'nın geçtiğimiz yüzyıllarda yaşadığı kaos, bölgedeki tüm halkların derinden yaraladı. Bugün yarımadanın tarihi yeniden yazılacak..."

 fp2_struggle.0900.desc:0 "\n\nArtık İberya'da ne [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] hâkimiyetine, ne de [ROOT.Char.GetFaith.HighGodName] ve [ROOT.Char.GetCulture.GetName] medeniyetine karşı çıkacak kimse kalmadı.\n\nGeriye kalan tek şey zaferimizi ilan edip bu toprakları nasıl yöneteceğimize karar vermek."
 fp2_struggle.0900.a:0 "Bu topraklar [ROOT.Char.GetFaith.HighGodNameAlternate] adına yönetilecek!"

 fp2_struggle.0900.b:0 "Bu topraklara yerleşmek en büyük odağımız olacak."

 fp2_struggle.0900.c:0 "[ROOT.Char.GetFaith.HighGodName], bu toprakları [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] halkına bahşetti!"
 fp2_struggle.0910.opening.involved:0 "Farklı bir diyardan olsa da yüzyıllardır belirsizlik içinde olan bu bölgenin kurtuluşu sonunda gelmiş olabilir..."

 fp2_struggle.0910.opening:0 "İber yarımadasındaki gelişmeler hakkındaki havadisler sarayımıza ulaştı, bölgeyi kasıp kavuran çatışmaların son bulduğu söyleniyor."

 fp2_struggle.0910.desc:0 "\n\n[struggle_ender.GetName], yarımadanın çoğunluğunu kontrol ettiğinden ötürü kendini yüzyıllar önce Mağribiler tarafından ortaya çıkan bu mücadelenin yegâne galibi ilan etti.\n\n"

 fp2_struggle.0910.closing.faith:0 "İberya'nın [struggle_ender.GetFaith.GetAdjective] toprağı olduğunu ve [struggle_ender.GetFaith.HighGodName] adına, tüm kâfirleri diyarından süreceğini söylüyor."

 fp2_struggle.0910.closing.culture:0 "İberya'nın [struggle_ender.GetCulture.GetName] toprağı olduğunu ve tüm yabancı işgalcilerin ve halkların bu gerçeği kabul etmesi gerektiğini söylüyor."

 fp2_struggle.0910.closing.combined:0 "İberya'nın [struggle_ender.GetPrimaryTitle.GetNameNoTier] ile ayrıştırılamaz olduğunu ve [struggle_ender.GetFaith.HighGodName] tarafından [struggle_ender.GetFaith.GetAdjective] [struggle_ender.GetCulture.GetName] halkına emanet edildiğini söylüyor..."
 fp2_struggle.0910.a:0 "Bu iş burada bitmez."
 fp2_struggle.0910.b:0 "Oldukça ilginç."

 fp2_struggle.0901.t:0 "$struggle_iberia_ending_compromise_decision$"

 fp2_struggle.0901.desc:0 "\n\nOldukça açık ki bu kıyım döngüsünü kendi hâline bırakırsak hiçbir şey sonuçlanmayacak; bu yarımada asla birleşmeyecek.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ile yetinmeli ve İberya'daki diğer hükümdarları kendi hâline bırakmalıyız - en azından şimdilik..."
 fp2_struggle.0901.a:0 "En iyisi bu."
 fp2_struggle.0901.tt:0 "[THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier], [de_jure|E] [empire|E] oldu"

 fp2_struggle.0911.desc:0 "\n\n[struggle_ender.GetTitledFirstName], yarımadayı tek bir sancak altında birleştirme amacından vazgeçti ve bunu iddia edecek herkesi de gayrimeşru kıldı.\n\nYüzyıllarca işgale ve fetihlere maruz kalmış bu topraklar artık birleşmek için fazla ayrıştı."

 fp2_struggle.0911.a:0 "Hispanya hayalini unutmayacağız..."

 fp2_struggle.0902.t:0 "$struggle_iberia_ending_conciliation_decision$"

 fp2_struggle.0902.desc:0 "\n\nArtık sadece benim iradem bölgenin halklarının hayatlarını istediği gibi yaşamalarını sağlayacak kadar güçlü.\n\n[ROOT.Char.GetFaith.HighGodNamePossessive] buyruğuyla, mazinin savaşları mazide kalacak ve tüm İberyalı hükümdarlar bu uzlaşmanın meyvelerini yiyecek."
 fp2_struggle.0902.a:0 "Elçileri gönderin."

 fp2_struggle.0912.desc:0 "\n\n[struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip] elçileri, herkes için gezme ve inanç özgürlüğü garantisi ile geldi. Bunları tüm halka [struggle_ender.GetTitledFirstName] sağlayacak.\n\nPek çoğu İberya'daki kıyıma bir son diliyordu; belki de #EMP bu#! barış ilelebet sürer."
 fp2_struggle.0912.a:0 "Sürpriz olduğu kesin."

 fp2_yearly.1001.t:0 "Satranç İki"

 fp2_yearly.1001.desc:0 "Kendime karşı bir başka satranç oyunu daha kazandıktan sonra düşünmeden duramıyorum, belki de sahip olduğum keskin zekâyla oyunu daha iyi bir hâle getirebilirim.\n\nİlk önce neyi değiştirmeliyim?"
 fp2_yearly.1001.a:0 "Şah kesinlikle çok zayıf."

 fp2_yearly.1001.b:0 "Fil daha güçlü olmalı."

 fp2_yearly.1001.c:0 "Neden piyonlara işkence edemiyorum ki?"
 fp2_yearly.1002.t:0 "Uzlaşmacı Yaklaşım"
 fp2_yearly.1002.desc:1 "Gecenin köründe koridorun diğer ucundaki bir odadan sesler duyuyorum. Kapıyı aralayıp baktığımda görüyorum ki [ROOT.Char.Custom2('RelationToMePossessive', deviant_courtier)] çıplak ve bağlanmış bir şekilde, benim eski kıyafetlerimi giyen bir hizmetçiden dayak yiyor. Bu yeterince tuhaf değilmiş gibi bir de hoşuna gidiyor gibi gözüküyor.\n\nDarbeler arasında çığlık atıyor "Evet! Cezalandır beni [ROOT.GetCharacter.GetTitledFirstNameNoTooltip]!""
 fp2_yearly.1002.b:0 "Şantaj malzemesi kokusu alıyorum."
 fp2_yearly.1002.c:0 "Eğlenceli gözüküyor!"
 fp2_yearly.1002.a:0 "Görmemiş gibi yapacağım."
 fp2_yearly.1003.t:0 "Devlere... Kafa Tutmak mı?"
 fp2_yearly.1003.desc:0 "Bir grup köylü sırtlarında [injured_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] ile geldiğinde saray avlusundaki kargaşa dikkatimi çekiyor. Görünüşe göre şövalye ciddi bir şekilde yaralanmış.\n\nNe olduğunu sorduğumda köylüler onu bir arazide bulduklarını, başına ne geldiğini sorduklarında onlara az önce bir devle dövüştüğünü söylediklerini belirtiyor.\n\nHikâye bittikten sonra şövalyenin yaveri beni bir kenara çekiyor, "İşin aslı, bir yeldeğirmeni ile mızrak dövüşü yapmaya çalıştı ve yenildi efendim ama bu köylüler devle dövüşme hikâyesini yutmuş gibi gözüküyor.""
 fp2_yearly.1003.a:0 "Herkes cesur şövalyenin önünde diz çöksün, ona yeni bir binek alacağım."
 fp2_yearly.1003.b:0 "Sarayımda masallar anlatılmasına tahammül etmeyeceğim."
 fp2_yearly.1004.t:0 "Kureyş Şahini"
 fp2_yearly.1004.desc:0 ""Kureyş Şahini" olarak da bilinen [hawk_of_quraysh.GetName] ile alakalı bir tarih kitabı okuyorum.\n\nHayatı hakkında bir şeyler öğrenmek oldukça ilham verici. [abbasid_dynasty.GetName] hanedanından kaçması, İberya'da [hawk_dynasty.GetName] hanedanını kuruşu... Yaptığı bazı şeyleri bizzat uygulamam gerektiğini düşünmeden edemiyorum."
 fp2_yearly.1004.a:0 "Ben de askerlerime aynı onun Carmona'da yaptığı gibi ilham vereceğim."
 fp2_yearly.1004.b:0 "Yemenliler ile yaptığı diplomatik antlaşmalar çok etkileyici."
 fp2_yearly.1004.c:0 "Akrabayız!"
 nick_the_hawk_of_quraysh:0 "Kureyş Şahini"
 fp2_hawk_of_quraysh_martial_modifier:0 "Askerî İlham"
 fp2_hawk_of_quraysh_martial_modifier_desc:0 "Bu karakter Kureyş Şahini'nden askerî ilham kazandı."
 fp2_hawk_of_quraysh_diplomacy_modifier:0 "Diplomatik İlham"
 fp2_hawk_of_quraysh_diplomacy_modifier_desc:0 "Bu karakter Kureyş Şahini'nden diplomatik ilham kazandı."

 fp2_yearly.1005.t:0 "Kayıp Viking"

 fp2_yearly.1005.desc:0 "Zorluk çıkaran ve sürekli bir şekilde böğüren biri huzuruma getiriliyor. [Select_CString(hidden_viking.IsFemale, 'Kadının', 'Adamın' )] bir Viking yağmacısı olduğu aşikâr ve onun gibiler yıllardır ülkemize zarar veriyor.\n\n"
 fp2_yearly.1005.a:1 "Belki hikâyelerinle saray mensuplarımı eğlendirebilirsin."
 fp2_yearly.1005.b:0 "Bir iyilik bin kötülüğü karşılamaz — öleceksin."
 fp2_yearly.1005.c:0 "Köye hizmet ettiğine göre hayatta kalabilirsin."

 fp2_yearly.1006.t:0 "Viking Peyniri?"
 fp2_yearly.1006.desc:0 "Yol kenarında basit yiyecekler satan bir tezgâhın önünde duruyorum. Tüccar [cheese_trader.GetName], önüme mallarını yığdıktan sonra tezgâhın altından oymalı bir kutu çıkarıyor.\n\n"Sizin için efendim, bu gördüğünüz tüm diyardaki en iyi peynirdir." Ufak bir parça kesip bana uzatıyor ve kulağıma tuhaf bir şekilde fısıldıyor, "Bu peyniri, İberya'daki peynirci Vikingler yaptı."\n\nBu tuhaf yoruma dışında peynir gerçekten de lezzetli."
 fp2_yearly.1006.a:0 "Peyniri alacağım ama saçma hikâyen sende kalsın."
 fp2_yearly.1006.b:0 "Şu "Peynirci Vikingleri" bulmalıyım..."
 fp2.1006.b.tt:0 "Adamlarınızı "Peynirci Vikingleri" bulmaları için gönderiyorsunuz"
 fp2_yearly.1006.c:0 "Tamamen saçmalık."
 fp2_yearly.1007.t:0 "$fp2_yearly.1006.t$"

 fp2_yearly.1007.desc:0 "Önüme bir deri bir kemik biri getiriliyor. Önüme getirilen zavallı bırak Vikingi, peynirciye bile benzemiyor.\n\n"
 fp2_yearly.1007.a:0 "En azından gizemi ortaya çıkardım."
 fp2_yearly.1007.b:0 "Kârının ve peynirinin yarısını istiyorum."
 fp2_respected_clergy_chess:0 "Satranç Konusunda Ruhbanlara Saygı Duyuldu"
 fp2_respected_clergy_chess_desc:0 "Satrancın kurallarını Ruhban sınıfına daha saygı duyacak şekilde değiştirdi."
 fp2_cheese_artifact:0 "Eski Peynir"

 fp2_cheese_artifact_desc:0 "Söylentilerin aksine, peynir Vikingler tarafından yapılmamış. Ama yine de oldukça lezzetli."
 fp2_yearly.1008.t:0 "Peyniri Yeme Vakti"
 fp2_yearly.1008.desc: "Zamanı geldi. Depomun en derinliklerinde dünyadaki en iyi peynirlerden biri bulunuyor, yavaş yavaş yıllanıyor, lezzeti artıyor.\n\nVe şimdi onu yiyeceğim."
 fp2_yearly.1008.a:0 "[ROOT.Char.GetFaith.HealthGodName|U] gurur duyardı. Peynir cidden çok lezzetli."
 fp2_yearly.1008.b:0 "Aslında, peynir biraz daha yıllansa iyi olur."
 stoke_tension_toast.success:0 "Nefret yayma girişiminiz başarılı oldu."
 stoke_tension_toast.failure:0 "Dâhiliyetiniz açığa çıkarıldı."
 delegated_stoke_tension_toast.success:0 "[tension_councillor.GetTitledFirstName] nefret yaydı."
 ease_tension_toast.success:0 "Arabulma girişiminiz başarılı oldu."
 ease_tension_toast.failure:0 "Girişiminiz başarısız oldu."
 bad_intrigue.tt:0 "Bu seçenek düşük Entrika yeteneğinizden ötürü seçilebiliyor."
 fp2_struggle.1000.t:0 "Ateşe Odun Atma"
 fp2_struggle.1000.desc:1 "[tension_county.GetName] topraklarında [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ve [tension_county.GetCountyData.GetFaith.GetAdjectiveNoTooltip] gruplar arasında son zamanlarda çatışmalar olduğu herkes tarafından biliniyor. "Bunu bir fırsat olarak kullanabiliriz" dedi [tension_councillor.GetCouncilTitle] [tension_councillor.GetFirstName] ve ekledi: "[ROOT.Char.GetFaith.GetAdherentNameNoTooltip] milislerinden ordumuza asker katabiliriz. Ayrıca kontluklarında hasımlarıyla yaptıkları #italic talimler#! işimize gelir, hatta bunu #italic teşvik#! bile edebiliriz..."\n\nBu vahşi yobazları orduya katmak için [tension_county.GetNameNoTierNoTooltip] topraklarını feda mı edeceğim?"
 fp2_struggle.1000.a:0 "Aralarına biraz nefret yayalım... gizlice."
 fp2_struggle.1000.b:0 "Bunu senin ellerine bırakıyorum"
 fp2_struggle.1000.c:0 "Hayır, aralarındaki sorunu çözmeye çalışmalıyız."
 fp2_struggle.1000.d:0 "Bu deliliği sonlandıramıyorsam, belki de [minority_courtier.GetFaith.GetAdherentNameNoTooltip] bir hükümdar sonlandırabilir."
 not_my_problem_toast:0 "Diyarınızdaki dul anneler ve çocukları yıllarca aç kalacak."
 fp2_struggle.1001.t:0 "Savaş Dulları"
 fp2_struggle.1001.desc:0 "[expectant_courtier.GetTitledFirstName], karnı burnunda huzurunuza çıkıp [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'kampınızda', 'diyarınızdaki')] annelerin durumunu size özetliyor. Son zamanlardaki savaşlardan ötürü çocuklarını tek başlarına yetiştirmek zorunda kalan kadınlar iyice sefil hâle düşmüş durumda. "Özel bir bütçe ayırabiliriz, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Böylelikle durumu olmayan çocuklu annelere destek sağlayabiliriz. Sonuçta, çocuk bakmanın diğer işlerden aşağı kalır yanı yok.""
 fp2_struggle.1001.a:0 "İyi fikir! Gerekli çalışmalar yapılsın."
 fp2_struggle.1001.b:1 "Sadece dulları destekleyeceğim."
 fp2_struggle.1001.b.tt:0 "İnancınız evlilik dışı doğum yapan kadınları tasvip etmiyor."
 fp2_struggle.1001.c:0 "[SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Kampıma', 'Sarayıma')] gelebilirler! Bizde yemek bol!"
 fp2_struggle.1001.c.tt:0 "Ülkenizdeki tüm fakir dul anneleri [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'kampınıza', 'sarayınıza')] çağırıyorsunuz."
 fp2_struggle.1001.d:0 "Eminim ki hayırsever vasallarım bana bu konuda destekte bulunacak."
 fp2_struggle.1001.e:0 "Hayır kurumu mu burası?"
 fp2_struggle.1001.specialdescpositive:0 "Ödeme yapmaktan memnun vasallar size karşı #positive_value 10#! #color_light_blue Görüş#! kazanacak"
 fp2_struggle.1001.specialdescnegative:0 "Ödeme yapmaktan memnun olmayan vasallar size karşı #negative_value 10#! #color_light_blue Görüş#! kaybedecek"
 reading_avicenna_toast.success:0 "Tıp konusunda büyük bir kitap okuyorsunuz."
 reading_avicenna_toast.failure:0 "Bir şeyleri yanlış anlamış olabilirsiniz..."
 reading_hippocrates_toast.success:0 "Galen'in tüm çalışmalarını okuyorsunuz."
 reading_hippocrates_toast.failure:0 "Yunanca niye bu kadar zor?"
 rolling_in_filth_toast:0 "Sarayınız sağlığınızı etkileyecek kadar kötü bir durumda."
 fp2_struggle.1002.t:0 "[xenophilic_culture.GetNameNoTooltip] İlerlemeleri"
 fp2_struggle.1002.desc_early_golden_age:0 "[xenophilic_culture.GetNameNoTooltip] bilginleri kısa süre önce tıp konusunda oldukça büyük atılımlar gerçekleştirdi. Buna karşın [great_physician.GetFirstName] yakın zamanda sadece bir #italic şiir#! yüzünden, [ROOT.GetCharacter.Custom2('RelationToMePossessive', SCOPE.sC('neighboring_ruler'))] [neighboring_ruler.GetTitledFirstName] tarafından saraydan atılmış. Bu nedenle hünerlerini sergileyecek yeni bir yer arıyor. \n\n"
 fp2_struggle.1002.desc_late_golden_age:0 "[xenophilic_culture.GetNameNoTooltip] bilginleri uzun süredir kendini tıpa adıyor. Şimdi ise [great_physician.GetFirstName], sarayımda görev almak istiyor ama kendisi kısa süre önce [ROOT.GetCharacter.Custom2('RelationToMePossessive', SCOPE.sC('neighboring_ruler'))] [neighboring_ruler.GetTitledFirstName] tarafından belli olmayan sebeplerden ötürü saraydan atılmış. \n\n"
 fp2_struggle.1002.desc_post_golden_age_christian:0 "Averroes ve Albucasis uzun süre önce hayatını kaybetmiş olsa da, [xenophilic_culture.GetNameNoTooltip] hekimleri hâlâ hünerlerini sergiliyor. Şimdi ise [great_physician.GetFirstName], çalışmak için yeni bir yer arıyor, yakın zamanda [ROOT.GetCharacter.Custom2('RelationToMePossessive', SCOPE.sC('neighboring_ruler'))] [neighboring_ruler.GetTitledFirstName] tarafından belli olmayan sebeplerden ötürü saraydan atılmış. \n\n"
 fp2_struggle.1002.desc_post_golden_age_unchristian:0 "İbn Rüşd ve Zehrâvî uzun süre önce hayatını kaybetmiş olsa da, [xenophilic_culture.GetNameNoTooltip] hekimleri hâlâ hünerlerini sergiliyor. Şimdi ise [great_physician.GetFirstName], çalışmak için yeni bir yer arıyor, yakın zamanda [ROOT.GetCharacter.Custom2('RelationToMePossessive', SCOPE.sC('neighboring_ruler'))] [neighboring_ruler.GetTitledFirstName] tarafından belli olmayan sebeplerden ötürü saraydan atılmış. \n\n"

 fp2_struggle.1002.desc_albucasis:0 ""Becerilerim mütevazıdır," der, "bir zamanlar kendi boğazını kesmiş bir köle kızın hayatını kurtardım, sonrasında sesinde yalnızca hafif bir kısıklık kaldı. Ayrıca sizden temizlik alışkanlıklarınızda bazı değişiklikler yapmanızı rica edeceğim..." \n\n"

 fp2_struggle.1002.desc_avenzoar:0 ""Hayatım boyunca hekimlik yaptım," der, "ve sağlıklı bir yaşam için perhiz üzerine bir kitap yazdım. Ama ben batıl inançların ve cadılar ile yıldız falcılarının sattığı sahte ilaçların yeminli düşmanıyım, o yüzden sizden bu tür şeyleri yasaklamanızı rica edeceğim..." \n\n"

 fp2_struggle.1002.desc_tufail:0 ""Hem gökyüzünü, hem zihni, hem de bedenin hastalıklarını incelerim," der [great_physician.GetSheHe]. "Ama ben insan bedeninin #italic ölüm sonrası#! incelenmesinin faydalarının savunucusuyum... Bunu sürdürmem için bana fırsat sağlar mısınız?" \n\n"

 fp2_struggle.1002.desc_no_historical_physician_early:0 ""Antiklerin eserlerinden çok şey öğrendim," der [great_physician.GetSheHe], "ama onların bilgisini uzun lafların uçurumundan kurtardım ve sizin yararınıza kullanabilirim." \n\n"

 fp2_struggle.1002.desc_no_historical_physician_late:0 ""Al-Zahrawi ve İbn Sina'nın eserlerinden çok şey öğrendim," der [great_physician.GetSheHe], "ama tekniklerini daha da geliştirdim. Katarakt ve çıban ameliyatı yapabilir, eskiden tedavi edilemez sanılan hastalıkları tedavi edebilirim." \n\n"
 fp2_struggle.1002.desc_has_physician_and_is_christian:0 "Mevcut hekimim [scoped_physician.GetTitledFirstName], kendisinin yerine bu kâfiri almamam için ısrar ediyor."
 fp2_struggle.1002.desc_has_physician_but_not_christian:0 "Mevcut hekimim [scoped_physician.GetTitledFirstName], kendisinin yerine bu acayip tipi almamam için ısrar ediyor."
 fp2_struggle.1002.desc_has_no_physician_but_is_christian:0 "Bazı saray mensuplarım bu kâfiri almamam için ısrar ediyor."
 fp2_struggle.1002.desc_has_no_physician:0 "Bu şahsa sarayımda yer vermeli miyim?"
 fp2_struggle.1002.a:0 "Yeni bir hekim fena olmazdı..."
 fp2_struggle.1002.b:1 "Kitaplar alıp kendim öğrenebilirim."
 fp2_struggle.1002.b.tt:0 "Büyük tıp kitaplarından öğrenmeyi deniyorsunuz."
 fp2_struggle.1002.c:0 "Sana niye ihtiyacım olsun ki? Ben Yunanca okuyabiliyorum."
 fp2_struggle.1002.c.tt:1 "Galen'in çalışmalarını alıp okumaya çalışıyorsunuz."
 fp2_struggle.1002.d:0 "Seni dosdoğru geldiğin yere geri göndereceğim... Zincirler içinde."
 fp2_struggle.1002.e:0 "Sıhhatim hâlihazırda yerinde, teşekkürler."
 fp2_struggle.1002.f:0 "Defol, yenilik sadece Tanrı'dan gelmeli."
 fp2_struggle.1002.physicianleaves:0 "[great_physician.GetFirstName], başka bir yerde hünerlerini sergileyecek"
 fp2_struggle.1001.physician_imprisoned:0 "[great_physician.GetFirstName], belli sebeplerce [neighboring_ruler.GetName] tarafından hapse atıldı."
 fp2_struggle.1010.t:0 "Demir İrade"

 fp2_struggle.1010.desc:0 "[great_swordsmith.GetName] adında bir demirci sarayıma geldi, iddia ettiğine göre gezip görmüş, işinde oldukça usta biriymiş.\n\n"

 fp2_struggle.1010.a:0 "Hayır, lonca ile birlikte hepimizin yararı için çalışacaksın."
 fp2_struggle.1010.b:1 "Ne bilgiye sahipsen, onu alacağım..."
 fp2_struggle.1010.c:1 "Ordum için kılıçlar yaparsan lonca senindir."

 fp2_struggle.1010.d:0 "Bana İberya'nın en iyi kılıcını yap, lonca senin olsun."

 fp2_struggle.1010.e:0 "Senin kibrin için lonca ile aramı bozmayacağım."

 fp2_struggle.1010.smithgoesaway:0 "[great_swordsmith.GetNameNoTooltip], demirci loncasının kontrolünü almaya gidiyor."
 fp2_struggle.1010.paranoid_rivals:1 "Askerlerinizi silahlandırmak bazı komşu hükümdarları endişelendirebilir."
 fp2_struggle.1010.smithmakesweapon:1 "[great_swordsmith.GetNameNoTooltip], istediğiniz kılıcı yaparken sarayınızda kalacak."
 fp2_struggle.1010.swordsmith_imprisoned:0 "Sırlarını öğrenmek için [great_swordsmith.GetNameNoTooltip], tarafınızca zindana atılıp işkenceye uğrayacak"
 fp2_struggle.1010.compassionate_courtiers:0 "Tüm saray mensuplarınız bunu hoş görmeyebilir"

 toledo_compromise_flavor:0 "[great_swordsmith.GetNameNoTooltip] ve lonca arasında arabuluculuk yapıyorsunuz."
 fp2_struggle.1010.swordsmith_leaves:0 "[great_swordsmith.GetNameNoTooltip], başka bir saraya gidiyor."

 fp2_struggle.1011.t:0 ""[blacksmith_county.GetNameNoTierNoTooltip]'in Kılıcı""

 fp2_struggle.1011.desc:0 ""Bitti," der [great_swordsmith.GetName], ama garip bir şekilde yorgun görünüyor.\n\n"Belki de atalarımın hayaletleri dövme sırasında bana yol gösterdi, çünkü bu yarattığım en iyi kılıç. Bir daha böylesini yapmayacağım, bu diyarda kimse de yapamayacak, çünkü yapımının sırlarını mezara götüreceğim. Şimdi gidip bana söz verdiğiniz makamı alacağım, ama o zafer şimdi tuhaf bir şekilde içi boş hissettiriyor. Her neyse, sizin için dövdüğüm kılıca bir ad koymalısınız.""

