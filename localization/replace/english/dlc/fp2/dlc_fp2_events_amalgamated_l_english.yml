 fp2_struggle.2050.t_muslim_two:0 "$fp2_struggle.2050.t_about_muslim$ $fp2_struggle.2050.title_main_ni$"
 fp2_struggle.2050.t_muslim_three:0 "$fp2_struggle.2050.t_about_muslim$ $fp2_struggle.2050.title_main_san$"
 fp2_struggle.2050.t_muslim_four:0 "$fp2_struggle.2050.t_about_muslim$ $fp2_struggle.2050.title_main_shi$"
 fp2_struggle.2050.desc_court:0 "Fısıltılar hızla tüm sarayımda yayılıyor. Sanki çevremdeki herkes, [fp2_2050_el_cid.GetFullName] arkamdan iş çeviriyormuş gibi düşünüyor.\n\nGasp edilen haraçlar, yetkisiz savaşlar ve otoritemin sarayım tarafından sorgulanmasına neden olan diğer eylemler ve söylentileri. [fp2_2050_el_cid.GetFirstName] dürüst biri, bundan hiç şüphem yok ancak böyle kötü söylentileri kendine çeken bir adamı sarayımda tutabilir miyim? Söylentileri durdurmak için artık çok geç ve yakında harekete geçmezsem zayıf görüneceğim."
 fp2_struggle.2050.desc_knights:0 "[ROOT.GetCharacter.Custom('FortifiedBuilding')] koridorlarında yürürken bütün fark ettim ki, [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] yüzü asık gözüküyor. [fp2_2050_el_cid.GetFullNameNicknamed], varlığı ile sıradan askerlere büyük başarılar elde etmesi için ilham veriyor ancak soylu [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] onun ışıltısı yanında sönük kalıyorlar.\n\n[fp2_2050_el_cid.GetFirstNameNicknamed] yetenekli bir komutan ve masallara layık bir savaşçı, saflarıma kattığı değeri inkâr edemem ancak bir adamın gücü diğerlerini zayıflatıyorsa... Sarayımdaki soylu [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] böyle devam edebilirler mi? Buna izin verebilir miyim?"
 fp2_struggle.2050.desc_nobles:0 "Krallığın dört bir yanından soylular, [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] [fp2_2050_el_cid.GetFirstNameNicknamed] hakkındaki endişelerini, dedikodularını ve açıkça düşmanlıklarını paylaşmak için gecenin geç saatlerine kadar sarayımda sıraya dizildiler. Soyluların [fp2_2050_el_cid.GetFirstName] için yaptığım olumlu muameleden hoşlanmadığı çok açık ve onlara göre sıradan halk, onu taklit ederek bir şeylere kalkışmadan önce bu yeni [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] sürgün edilmeli. [fp2_2050_el_cid.GetFirstName] bir zamanlar asil biri olabilir ancak şimdi kendi kendine başarıya ulaşmış bir [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] ve krallığı sosyal hiyerarşisine bir tehdit.\n\nKarar benim ancak [fp2_2050_el_cid.GetFirstName] etrafta olduğu sürece soylular ile ilişkim tehlikeye giriyor."
 fp2_struggle.2050.desc_faith:0 "Gittiğim her yerde [ROOT.Char.Custom('DefaultPriestTitlePlural')] bana saygısızca bakıyor. Toprağa ve altına olan susuzluğumun, [ROOT.GetCharacter.GetFaith.HighGodName] yolundan saptırdığına ve [fp2_2050_el_cid.GetFirstNameNicknamed] gibi kimin tarafında savaştığının hiçbir önemi olmayan, inançsız bir paralı askerin safına geçtiğime dair asılsız söylentiler var.\n\nOnların aptal kafaları, yalnızca dindarların inancı savunduğu şövalye savaşının romantikleştirilmiş yanılgılarıyla dolu, aslında gerçekte [fp2_2050_el_cid.GetFirstNameNicknamed] gibi insanlar sayesinde yaşam tarzımız güvende. Ne olursa olsun, din adamları ile arayı iyi tutmam gerekiyorsa [fp2_2050_el_cid.GetFirstName] sürgün edilebilir, bu fikri düşünmeliyim."
 fp2_struggle.2050.a:0 "[ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] için güvenim tam, kalacak!"
 fp2_struggle.2050.a.serve_tooltip:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] size hizmet etmeye devam edecek."
 fp2_struggle.2050.a.notif.t:0 "[fp2_2050_el_cid.GetNicknameNoTooltip|U] Kalıyor"
 fp2_struggle.2050.b:0 "[fp2_2050_el_cid.GetFirstNameNoTooltip] ne olursa olsun bana hizmet etmeye devam edecek!"
 fp2_struggle.2050.c:0 "Belki de gitmesine izin vermenin zamanı gelmiştir..."
 fp2_struggle.2050.c.notif:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] başka yerde iş arayacak..."
 fp2_struggle.2051.t:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip]"
 fp2_struggle.2051.desc:0 ""[fp2_2050_el_cid.GetNicknameNoTooltip|U]" olarak da bilinen [fp2_2050_el_cid.GetFullName] adında ünlü bir şövalye, hizmet edecek yeni bir lord aramak için sarayıma geldi. Şüphesiz yetenekli bir komutan ve efsanelere yaraşır bir savaşçı.\n\n[fp2_2050_el_cid.GetFirstNameNoTooltip], ona kollarını açarak karşılamaya istekli biriyle çalışmaktan çekinmiyor. Bu, savaşın gidişatını kendi başına değiştirebilecek bir şövalyeyi işe almak için harika bir fırsat."
 fp2_struggle.2051.a:0 "Ah hoş geldin! Sarayımda yüksek bir makamı hak ediyorsun."
 fp2_struggle.2051.b:0 "Senin yeteneklerine sahip bir adam krallığımda her zaman hoş karşılanır."
 fp2_struggle.2051.c:0 "Başka yerlerde efendini ara [fp2_2050_el_cid.GetFirstNameNoTooltip]."
 fp2_struggle.2004.t:0 "Büyük Bir Armada"
 fp2_struggle.2004.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2004_scoped_steward'))] [2004_scoped_steward.GetFirstName], vakanüvislerinin denizler boyunca kullanılan denizcilik teknolojileri üzerine çalışmalarının sona erdiğini bildirdi. Yeterli bütçe sağlandığı takdirde komşularımızınkileri geride bırakacak bir gemi tasarlayabileceğimizi ve bunun [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] için denizlerde hâkimiyet kurulan bir çağın habercisi olacağını belirtiyor.\n\nÖte yandan [2004_scoped_marshal.GetCouncilTitleFirstName] bu bütçeyi ticaret gemilerinden başka şeylere harcamayı öneriyor."
 fp2_struggle.2004.a:0 "Girişimi destekleyeceğim."
 fp2_struggle.2004.a.a.desc:0 "Yeni gemiler suya indirildi"
 fp2_struggle.2004.a.b.desc:0 "[fp2_2004_dockyards.GetNameNoTierNoTooltip] toprağındaki gemi yapımcıları nam saldı"
 fp2_struggle.2004.b:0 "O parayı başka yerlerde kullanabiliriz."
 fp2_struggle.2004.b.desc:0 "[2004_scoped_steward.GetFirstNameNoTooltip] reddedildi ve parayı elinizde tuttunuz"
 fp2_struggle.2004.c:0 "Yeni bir tasarıma gerek yok, saf gümüşten bir gemi istiyorum!"
 fp2_struggle.2004.c.desc:0 "Olağanüstü bir üne kavuşmak için paranızı riske atarak en büyük zanaatkârları imkânsızı inşa etmeleri için bir araya getirdiniz: Saf gümüşten bir gemi."
 fp2_struggle.2005.t:0 "Zamanının Ötesinde Bir Armada"
 fp2_struggle.2005.t.alt:0 "Usta [fp2_2004_dockyards.GetNameNoTier] Zanaatkârları"
 fp2_struggle.2005.desc:0 "Yeni gemilerin tasarımı aşağıdaki gibi:"

 fp2_struggle.2005.desc.intro:0 ""Hükümdarım, nihayet gemilerimiz denize açılmaya hazır!" der [2005_scoped_steward.GetFirstName]. "Sanırım tasarımı son derece hoş bulacaksınız."\n\n"
 fp2_struggle.2005.desc.cirt.notif:0 "Yeni tasarımlar son derece başarılı oldu! Hatta [fp2_2004_dockyards.GetNameNoTier] kıyısında sırf bu yeni ve son teknoloji gemilerden inşa etmesi için bir tersane kuruldu.\n\n"
 fp2_struggle.2005.desc.cirt.a.notif:0 "Ne yazık ki inşaat başladıktan sonra [fp2_2004_dockyards.GetName], [fp2_2004_dockyards.GetHolder.GetName] tarafından ele geçirildi. Gemi tasarımlarını elimizde tutmayı başarsak da tersaneler artık onların kontrolünde.\n\n"
 fp2_struggle.2005.desc.newdesigner.notif:0 "Tasarımın sahibi olan [2004_scoped_steward.GetFirstName] artık aramızda olmasa da [2005_scoped_steward.GetFirstNameNicknamed] işin başına geçerek projeyi o olmadan tamamlayabildi.\n\n"
 fp2_struggle.2005.desc.bottom.generic:0 "Gemi,"
 fp2_struggle.2005.desc.bottom.a:1 "$fp2_struggle.2005.desc.bottom.generic$ durgun suda sarsılmadan ilerlenebilmesine olanak tanıyan düz tabanlı bir tekne. "
 fp2_struggle.2005.desc.bottom.b:1 "$fp2_struggle.2005.desc.bottom.generic$ hasar alındığında batmayı engelleyen su geçirmez bir bölmeye sahip. "
 fp2_struggle.2005.desc.bottom.c:1 "$fp2_struggle.2005.desc.bottom.generic$ inanılmaz bir hızla dalgaları kesebilecek, keskin ve derin bir tekne! "
 fp2_struggle.2005.desc.bottom.d:1 "$fp2_struggle.2005.desc.bottom.generic$ hem dayanıklı hem de hafif bir gövde sağlayan bindirmeli bir omurgaya sahip. "
 fp2_struggle.2005.desc.unique.init:0 "Aynı zamanda,"
 fp2_struggle.2005.desc.unique.a:0 "$fp2_struggle.2005.desc.unique.init$ rakipsiz bir sarsılmazlık sunan devasa çift uskundra barındırıyor. "
 fp2_struggle.2005.desc.unique.b:0 "$fp2_struggle.2005.desc.unique.init$ okçuların düşmanların üstüne ok yağdırmasına olanak tanıyan, gövdenin her bir ucunda bulunup zeminden yüksek olan burçlar barındırıyor. "
 fp2_struggle.2005.desc.unique.c:0 "$fp2_struggle.2005.desc.unique.init$ güvertede heybetli ve kale benzeri bir yapı bulunuyor. "
 fp2_struggle.2005.desc.unique.d:0 "$fp2_struggle.2005.desc.unique.init$ bordalamaları engelleyen, dikenlerle kaplı, ahşap bir çatıya sahip. "
 fp2_struggle.2005.desc.unique.e:0 "$fp2_struggle.2005.desc.unique.init$ doğrudan bir karşılaşmada düşman gemilerini delmesi için ön kısımda bir koçbaşı bulunuyor. "
 fp2_struggle.2005.desc.sails.init:0 "Son olarak gemi,"
 fp2_struggle.2005.desc.sails.a:0 "$fp2_struggle.2005.desc.sails.init$ denizcilerin birçoğunu hayran bırakacak, kare flamalar barındırıyor."
 fp2_struggle.2005.desc.sails.b:0 "$fp2_struggle.2005.desc.sails.init$ kuvvetli gemilere yakışan devasa ve üst üste binen aşırma yelkenlere sahip."
 fp2_struggle.2005.desc.sails.c:0 "$fp2_struggle.2005.desc.sails.init$ üstün manevra kabiliyeti için baştan sona büyük bir yelkene sahip."
 fp2_struggle.2005.desc.sails.d:0 "$fp2_struggle.2005.desc.sails.init$ çok sayıda kürek barındırıyor. Bu kürekler gemiyi mürettebatının iradesi kadar sarsılmaz kılıyor."
 fp2_struggle.2005.desc.outro:0 "\n\n"Epey etkileyici, sizce de öyle değil mi?" dedi [2005_scoped_steward.GetFirstNameNicknamed]."
 fp2_struggle.2005.desc.outro.crit:0 "\n\n"Bu sayede denizlere hükmettiğimiz bir çağ başlayacak!" [2005_scoped_steward.GetFirstNameNicknamed] gururlu bir şekilde cümlesine son verdi."
 fp2_struggle.2005.a:0 "İyi iş çıkardın."
 fp2_struggle.2005.a.a:0 "Tersanelere yazık oldu, en azından gemiler bizde."
 fp2_struggle.2005.desc.alt.a:1 "Batık Hazine"
 fp2_struggle.2005.desc.alt.a.desc:0 "Üzgünlüğü yüz ifadesinden okunan [2005_scoped_steward.GetFirstName], gümüşten gemi girişimimizin sonucunu bildirmek için dikkatlice yaklaştı.\n\n"Çabalarımıza rağmen metalden bir gemi yapma fikrinin tamamen bir delilik olduğunu söylemek zorundayım. Gemiyi tamamladık, dikkatli bir şekilde suya indirdik, indirdiğimiz gibi denizin dibini boyladı! Hazinemizin büyük kısmı artık zalim dalgaların altında yatıyor. Üzgünüm efendim."\n\n"
 fp2_struggle.2005.desc.alt.b:1 "Gümüş Gemiler"
 fp2_struggle.2005.desc.alt.b.desc:0 "[2005_scoped_steward.GetFirstName] bunun bir gösteri malzemesi olduğunu ve saygınlık kazanmak için yapıldığını biliyordu. Metalden yapılan gemiler teknoloji ne kadar ilerlerse ilerlesin yüzmez.\n\nBundan ötürü görevi ciddiye alıp imkânsızı yapmaya teşebbüs etmek yerine izleyicileri kandırmak için ahşap bir geminin üzerini kalın bir gümüş tabakayla kaplamış. Ben ve yeni "gümüş gemim" herkesin dilindeyiz ve herkes bizi kıskanıyor!\n\n"
 fp2_struggle.2006.t:0 "İnancın Sınırları"
 fp2_struggle.2006.desc:0 "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('fp2_2006_vassal_in_crisis'))|U] [fp2_2006_vassal_in_crisis.GetTitledFirstName] kuşkulu bir yüz ifadesiyle bana yaklaştı.\n\n[fp2_2006_foreign_faith.GetNameNoTooltip] sınırındaki görevi esnasında düşmanla dostane ilişkiler kurduğundan ve bu ilişkiler doğrultusunda inancının sarsıldığından bahsetti. Ciddiyeti her hâlinden belli oluyordu. En ufak bir hata dahi onu [ROOT.Char.GetFaith.HighGodName] yolundan uzaklaştırbilir.\n\nYine de bu hem şevkimizi hem de ilişkimizi kuvvetlendirmek için güzel bir fırsat."

 fp2_struggle.2006.a:0 ""Birisi bir rahip çağırsın!""
 fp2_struggle.2006.a.a:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] şüphe duymaya devam ediyor"
 fp2_struggle.2006.a.b:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip], [2006_scoped_chaplain.GetTitledFirstNameNoTooltip] tarafından tehdit edilmiş hissediyor"
 fp2_struggle.2006.a.c:0 "[2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip], [fp2_2006_vassal_in_crisis.GetTitledFirstNamePossessiveNoTooltip] inancını tazeledi"
 fp2_struggle.2006.a.desc:1 "Bu durumu çözmesi için [2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] ile görüşeceksiniz. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] ihanete uğramış hissedecek çünkü mahremini başkasıyla paylaştınız."
 fp2_struggle.2006.b:0 "Şevkini bizzat kendim canlandıracağım."
 fp2_struggle.2006.b.a.desc:0 "[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] teşebbüsten ötürü gücendi"
 fp2_struggle.2006.b.b.desc:0 "[fp2_2006_vassal_in_crisis.GetFirstNamePossessiveNoTooltip] inancını tazelediniz" 

 fp2_struggle.2006.c:0 ""İstediğin inancı seç, yeter ki #emphasis bana#! #BER hizmet et#!.""
 fp2_struggle.2006.c.desc:0 "[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] istediği mezhebi seçsin diye izin veriyorsunuz."
 fp2_struggle.2006.c.notif.t:0 "Arkadaşlığın Özgürlüğü"
 fp2_struggle.2006.d:0 "Onu sapkın olduğunu ilan etmekle tehdit edin."
 fp2_struggle.2006.d.notif.t:0 "Korkuyla Şüpheye Karşı Savaşmak"

 fp2_struggle.2006.e:0 ""İnanç meselelerini unut, #emphasis cadılığı kucakla!#!""
 fp2_struggle.2006.e.alreadywitch:0 "[fp2_2006_vassal_in_crisis.GetFirstName] zaten bir cadıydı! Bu bir inanç krizi değildi. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] kendini anlayan birine ihtiyaç duyuyordu sadece."
 fp2_struggle.2006.generic.notif.a.t:0 "Vasal [fp2_2006_foreign_faith.GetNameNoTooltip] mezhebini benimsedi"
 fp2_struggle.2006.generic.notif.b.t:0 "Vasal İnançlı Kaldı"
 fp2_struggle.2006.e.notif.t:0 "Samimi Cadılar"
 fp2_struggle.2006.e.tacticalwitchfaithchange:0 "Zulümden kaçınmak için [fp2_2006_foreign_faith.GetName] mezhebine geçti"
 fp2_flavor.3001.t:0 "Ölüm Döşeği"
 fp2_flavor.3001.desc:0 "Rüzgâr her geçen gün daha soğuk esiyor, günler her geçen gün daha karanlık, daha kısa ve daha sessiz. Taht ilk gün gördüğümdeki gibi. Taht belki yıpranmadı ama ben çok yıprandım.\n\nArtık kaçınılmaz olana hazırlanma vaktim geldi. Huzur içerisinde bu diyardan ayrılmak için bir mezar yazıtı yazdıracağım."

 fp2_flavor.3001.a:0 "[SCOPE.Custom('IberiaSacredLanguage')] yazılmalı."

 fp2_flavor.3001.b:0 "Herkes o dili anlamıyor, [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] yazılmalı."

 fp2_flavor.3001.c:0 "Ayrım yapmaya gerek yok. Hem [SCOPE.Custom('IberiaSacredLanguage')] hem [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] yazılsın."
 fp2_flavor.3001.d:0 "Bu toprakların tek sakini biz değiliz."
 IberiaSacredLanguage_hebrew:0 "İbranice"
 IberiaRomanceLanguage_castilian:0 "Kastilyaca"
 IberiaRomanceLanguage_sephardi:0 "Sefaradça"
 IberiaRomanceLanguage_mozarabic:0 "Mozarapça"
 fp2_epitaph_modifier:0 "Çok Dilli Mezar Yazıtı"
 fp2_flavor.3011.t:0 "Beklenmedik Hamle"
 fp2_flavor.3011.desc:0 "Yakın dostum [fp2_flavor_3011_best_friend.GetFirstName] beni ziyaret ettiğinde genellikle kendini duyurma ihtiyacı hissetmez. Kapıdan girmesiyle birlikte gülümsemesi her zaman olduğu gibi günümü güzelleştirmeye yetiyor. Ama... bugün bir şeylerin farklı olduğunu hissediyorum. Saçlarını yapmaya çok uğraşmış, giysileri desen biraz fazla özenli...\n\n"[ROOT.Char.GetFirstNameNoTooltip], sevgili dostum! Böyle bir [ROOT.Char.Custom('ResidenceBuilding')] içinde yaşarken burada yalnız başınasın! Seninle zaman geçirmek kadar keyif aldığım başka bir şey yok. Ah keşke, tüm gündüzlerimi ve gecelerimi bu [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'çadırda', 'odada')] seninle geçirebilsem.""
 fp2_flavor.3011.a:0 "[SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'Çadırda', 'Odada')] tek bir yatak var..."
 fp2_flavor.3011.b:0 "Sana layık bir [ROOT.Char.Custom('GetRoom')] bulacağım."
 fp2_flavor.3011.c_spouse:0 "Ben evliyim!"
 fp2_flavor.3011.c:0 "Yalnızsam bir sebebi var."
 fp2_flavor.3021.t:0 "Tatsız Akşam"
 fp2_flavor.3021.desc:0 "Yakın dostum [fp2_flavor_3021_best_friend.GetFirstName] beni öyle bir akşam yemeğine davet etti ki, açıkçası zamanımı bir mağarada ıslak deri kemirerek geçirmeyi yeğlerdim.\n\nBaşımı bir çeviriyorum, misafirlerden birisi iltihaplı yarasını açmış bir şeyler anlatıyor: "Bak bu tuvaletteyken oldu!"\n\n"Ne güzel bir akşam, değil mi?" diyor [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] elinde kadehle. Gülümsemesi baygın sohbetleri ve lezzetsiz yemekleri unutturacak cinsten."
 fp2_flavor.3021.a:0 "Daha güzel olamazdı!"
 fp2_flavor.3021.b:0 "Aynen, [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip]... Hiç sorma..."
 fp2_flavor.3021.c:0 "Ona karşı dürüst olmalıyım."
 fp2_flavor.3021.d:0 "Nihayet gitme vakti geldi."
 fp2_flavor.3021.b.success_tt:0 "[fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] endişelerinizi anlıyor"
 fp2_flavor.3021.b.success:0 "Başarılı Diyalog"
 fp2_flavor.3021.b.fail:0 "Utanç Verici Diyalog"
 fp2_james.0001.t:0 "[fp2_james_0001_thriving_community.GetNameNoTierNoTooltip] Topraklarındaki [fp2_james_0001_jewish_trader.GetFaith.GetAdherentNameNoTooltip] Topluluğu"
 fp2_james.0001.desc:0 "[fp2_james_0001_thriving_community.GetNameNoTier] kıyılarındaki ticaret limanlarının yükselişi bu bölgeyi tüm İberya'daki Yahudi halklar için önemli bir merkez hâline getirdi.\n\nÖnde gelen [fp2_james_0001_jewish_trader.GetCulture.GetName] tüccar ailelerinden birisi, her geçen gün kendi halkından daha fazla insanı İberya'ya getiriyor.\n\nBu bölge yakında tüm İberya'daki Yahudi ticaret ağının merkez noktası hâline gelebilir."
 fp2_james.0001.a:0 "[ROOT.Char.GetFaith.GetReligion.GetAdjective] olmayanlara burada onlara yer yok!"
 fp2_james.0001.b:0 "Belki de o [fp2_james_0001_thriving_community.GetNameNoTooltip] lordu olmalıdır!"
 fp2_james.0001.c:0 "Ne kadar da güzel bir gelişme!"
 fp2_thriving_jewish_community_modifier:0 "Büyüyen Yahudi Topluluğu"
 fp2_thriving_jewish_community_modifier_desc:0 "Bu kontluk bölgede ticaret ağları kuran Yahudiler sayesinde büyük bir ekonomik patlama yaşıyor."
 fp2_jewish_community_denied_modifier:0 "Zulüm Gören Yerliler"
 fp2_jewish_community_denied_modifier_desc:0 "Bu bölgenin sosyal ve ekonomik büyümesi dinî azınlıklara ayrımcılık yapan yasalar sebebiyle engellendi."
 fp2_conversos_persecution_modifier:0 "Zulme Uğrayan Konversolar"
 fp2_conversos_persecution_modifier_desc:0 "Her ne kadar Hristiyanlığa dönmüş olsalar da, Yahudiler ve onların soyu eziyete uğramaya devam ediyor."
 fp2_james.0002.t:0 "Sahte Din Değişimi"
 fp2_james.0002.desc:0 "Bir dizi sözde [fp2_james_0002_conversos_character.GetFaith.GetAdherentName], [fp2_james_0002_jewish_faith.PriestNeuterPlural] tarafından [fp2_james_0002_jewish_faith.GetName] inancını ve öğretilerini devam ettirdiklerine dair itirafta bulunmalarının talep edildiğini dile getiriyor.\n\nEğer bu söylenenler doğruysa bu İberya'daki Yahudi topluluklarını Hristiyanlığa döndürmek için yapılan tüm çabalar beyhude olacaktır.\n\nSöylentilere göre [fp2_james_0002_conversos_character.GetName], Yahudi öğretilerini teşvik eden isimler arasında geliyor."
 fp2_james.0002.a:0 "Zerre umurumda değil."
 fp2_james.0002.a.tt:0 " [fp2_james_0002_conversos_character.GetNameNoTooltip] istediği gibi hareket edecek"
 fp2_james.0002.b:0 "Bu sapkını sorgulamalıyım."
 fp2_james.0002.c:0 "Doğru veya değil, [fp2_james_0002_conversos_character.GetNameNoTooltip] zindanımda çürüyecek!"
 fp2_james.0003.t:0 "[fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNameNoTooltip] Mülteciler"
 fp2_james.0003.desc:0 "[fp2_james_003_jewish_refugee_leader.GetName], bir grup [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNamePluralNoTooltip] eşliğinde [fp2_james_003_intolerant_ruler.GetPrimaryTitle.GetNameNoTier] ülkesinden kaçmış.\n\nHalkına yuva sağlamam ve onları zulümden korumam karşılığında memnuniyetle [fp2_james_003_jewish_refugee_leader.GetPrimaryTitle.GetAdjective] tacına bağlılık yemini edeceğini söylüyor."
 fp2_james.0003.a:0 "[fp2_james_0003_province_to_convert.GetNameNoTooltip] birkaç yerleşimciden faydalanabilir."
 fp2_james.0003.b:0 "Başka bir yere bakmalı."
 fp2_james.0002.b.succesful_interrogation:0 "Sorgu Başarılı Geçti"
 fp2_james.0002.b.failed_interrogation:0 "Sorgu Tam Bir Felaketti"
 fp2_james_0002.b.failed_interrogation.tt:0 "Kontluktaki tüm Hristiyanlar ve Yahudiler"
 fp2_james.0002.a.offended_conversos:0 "Konversolar Gücendirildi"
 fp2_james.0002.a.jewish_communities_thrive:0 "Yahudi topluluğu büyüyor!"
 fp2_james.0002.a.nothing_happened_toast:0 "Konversolar gerçek Hristiyanlardır"
 cultural_acceptance_gain_conversos_tolerance:0 "Konverso Hoşgörüsü"
 cultural_acceptance_loss_conversos_tolerance:0 "Konverso Hoşnutsuzluğu"
 fp2_james.0004.t:0 "[fp2_james_0004_place_of_murder.GetAdjectiveNoTooltip] Geceleri"
 fp2_james.0004.desc:0 "[fp2_james_0004_place_of_murder.GetName] barındırdığı farklı inançlar ve yönetimler sebebiyle oldukça serkeş bir yer. Her cemaatin kendine has bir lideri var, bu durum daha fazla devam etmesi mümkün olmayan karmaşık bir hiyerarşiyle sonuçlanıyor. Hepsi [ROOT.Char.GetFaith.HighGodName] yolunda yürüseydi, hepsi aynı lidere bağlı olsaydı şüphesiz ki bu durum bölgedeki nüfuzumu güçlendirirdi.\n\n[fp2_james_0004_murder_baron.GetName] ileri doğru bir adım atarak bölgenin yeni lideri olmaya hazır olduğunu ilan etti ve yakın zamanda düzenleyeceği bir ziyafette tüm yerel dinî liderleri kılıçtan geçireceğini söyledi."
 fp2_james.0004.a:0 "Çığlıklarını duymak için sabırsızlanıyorum."
 fp2_james.0004.b:0 "#EMP O kadar da#! değil yahu."
 fp2_james.0005.t:0 "Bakış Açısı"
 fp2_james.0005.desc.intro:0 "[fp2_james_angry_priest.GetName] kızgın bir yüz ifadesiyle yanıma geldi ve yakın zamanda dönüştürülen [ROOT.Char.GetFaith.HouseOfWorship] binasının yanlış yöne baktığını söyledi."
 fp2_james.0005.desc.christian:0 "\n\nDaha önceleri cami olan bu binada sadece Mihrap Mekke yönünde doğuya bakarken, artık bir kilise olması sebebiyle tüm binanın doğuya bakması gerektiğini söylüyor."
 fp2_james.0005.desc.muslim:0 "\n\nDaha önceleri kilise olan bu cami doğuya bakıyor, bu da Mihrabın Mekke'nin yönünü gösterecek şekilde inşa edilmesini engelliyor!"
 fp2_james.005.desc.outro:0 "\n\n[fp2_james_angry_priest.GetNameNoTooltip] şu anki durumda hizmetin sürdürülmesinin imkânsız olduğunu söylüyor ve binayı döndürmek için bir miktar fon ayırmanızı istiyor."
 fp2_james.0005.a:0 "İnanç için her şey yapılabilir!"
 fp2_james.0005.b:0 "Zamanımı boşa harcıyorsun."
 fp2_toledo_nights_modifier:0 "Yerel Yönetici Katledildi"
 fp2_toledo_nights_modifier_desc:1 "Bu kontluktaki yerel dinî liderler yakın zamanda kılıçtan geçirildi."
 fp2_toledo_nights_fallout_modifier:0 "Ruhban Katli"
 fp2_toledo_nights_fallout_modifier_desc:0 "Yakındaki bir kasabadaki dinî liderler yakın zamanda kılıçtan geçirildi."
 fp2_correctly_facing_church:0 "Doğru Yöne Bakan İbadethane"
 fp2_correctly_facing_church_desc:1 "Bu kontluktaki ibadethane tuğla tuğla doğru yöne doğru dönecek şekilde yeniden yapıldı."
 fp2_yearly.4001.t:0 "Altıncı Saat"
 fp2_yearly.4001.desc:0 "Aman aman! [ROOT.Char.GetTitleAsNameNoTooltip] olmak gerçekten de tüm gücünü tüketiyormuş. Her şeyi kontrol altında tutmak için gece gündüz çabalamam gerekiyor. Köylüler bu bakımdan huzurlu bir hayat yaşıyor; omuzlarında böyle bir yük yok ve rehavet içinde yaşayıp gidiyorlar!\n\nBelki de biraz kestirmek iyi gelir? Öğle yemeğinin yorgunluğunu atıp günün geri kalanı için hazır olabilirim!"
 fp2_yearly.4001.a:0 "Olmaz! Yapacak işlerim var!"
 fp2_yearly.4001.b:0 "Mm, #EMP iyi fikir.#!"
 fp2_yearly.4002.t:0 "Uyum İçinde Yaşamak"
 fp2_yearly.4002.desc:0 "[realm_priest.GetCouncilTitle] [realm_priest.GetTitledFirstName] öyle bir yüz ifadesiyle odaya girdi ki, ister istemez birazdan duyacağım dini meselelere kendimi hazırlamaya başladım.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ülkenizde bir an önce çözülmesi gereken önemli bir mesele var. [interfaith_province.GetCounty.GetName] toprakları hak mezhebe inanmayan insanlarla dolu. Yetmezmiş gibi bu sapkınlar inananlarla birlikte yaşıyorlar! Ve - ve afedersiniz ama birbirleriyle #EMP zina yapıyorlar#!, daha da kötüsü...\n\nGözlerimi kapatmamla birlikte konuşmasına ara veriyor. Eğer bir şeyler yapmazsam sonsuza dek bir şeyler anlatabilir."
 fp2_yearly.4002.a:0 "Bırakalım huzur içinde yaşasınlar, [realm_priest.GetFirstNameNoTooltip]."
 fp2_yearly.4002.b:0 "Haklısın. Bu böyle sürmemeli."

 fp2_yearly.4003.t:0 "Yıldızlı Tapınak"

 fp2_yearly.4003.desc:0 "Kutsal şehir Santiago de Compostela her yerden hacıları kendine çeker. Ona çıkan yol da buna uygun olarak işlek bir yoldur, Pirenelerin eteğinden kutsal bölgeye doğru uzanır. Elbette bu kutsal bölgeye seyahat edecek kadar zengin olanlar var olduğu sürece, Tanrı'ya olan güvenlerinden kâr sağlamaya çalışanlar da olacaktır.\n\nTopraklarımda gerçekleşen beşinci kanlı soygunun ardından [steward.GetCouncilTitle] [steward.GetFirstName], çaresiz bir yüz ifadesiyle huzuruma çıktı."
 fp2_yearly.4003.a:0 "[ho_province.GetProvince.GetCounty.GetNameNoTooltip] toprağındaki kutsal savaşçılarla iletişime geçeceğim!"
 fp2_yearly.4003.b:0 "Yolun bir kısmını koruması için muhafız tutun."
 fp2_yearly.4003.c:0 "[ROOT.Char.GetFaith.HighGodName] kendine yardım edenlere yardım eder..."
 fp2_yearly.4003.tt:0 "Yerel [holy_order|E], kontluklarından geçen yolda devriye gezecek."
 fp2_yearly.4004.t:0 "Gezgin Usta"
 fp2_yearly.4004.desc:0 "Tam da taht odama doğru ilerlerken bir kavgayı andıran bir uğultu duyuyorum. İri yarı bir [Select_CString(mozarab_wanderer.IsFemale, 'kadının', 'adamın' )] etrafı muhafızlarım tarafından sarılmış hâlde. [Select_CString(mozarab_wanderer.IsFemale, 'Kadın', 'Adam' )] çevresini süzdükten sonra ustaca hamlelerle muhafızlarımı silahsız hâle getirmeyi başarıyor ve kılıcıyla bana selam veriyor.\n\nElimle daha fazla muhafızın gelmesi için işaret verirken, yabancı söze giriyor: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], hizmet edeceğim birisi yok. Muhafızlarınızın hâline bakılırsa korumanız olarak size faydam dokunabilir."\n\nBoynuna taktığı haçtan bir [mozarab_wanderer.GetFaith.GetAdherentName] olduğunu anlıyorum."
 fp2_yearly.4004.a:0 "Senin kadar yetenekli biri mi? Tabii ki!"
 fp2_yearly.4004.b:0 "Korumalarımın [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] olmalarını yeğlerim."
 fp2_yearly.4004.c:0 "Defol, kâfir!"
 fp2_yearly.4004.tt:0 "[mozarab_wanderer.GetName] mezhep değiştirmeyi reddetti ve tekrar yola koyuldu"
 fp2_yearly.4004.b.succ:0 "[mozarab_wanderer.GetName] sarayınıza katıldı"
 fp2_yearly.4004.b.fail:0 "[mozarab_wanderer.GetName] mezhep değiştirmeyi reddetti ve tekrar yola koyuldu"
 fp2_yearly.4004.c.tt:0 "[mozarab_wanderer.GetName] tekrar yola koyuldu"
 fp2_yearly.4005.t:0 "[mozarab_merchant.GetFaith.GetAdherentName] Mahallesi"
 fp2_yearly.4005.desc.christian:0 "[mozarab_merchant.GetFaith.GetAdherentNamePlural], İberya toplumunda kendilerine has önemli bir yere sahip. "
 fp2_yearly.4005.desc.muslim:0 "[mozarab_merchant.GetFaith.GetReligion.GetAdjectiveNoTooltip|U] vasallar İberya toplumunda kendilerine has önemli bir yere sahip. "
 fp2_yearly.4005.desc:0 "Yerel tüccarlardan birinin benimle görüşmek istemesi alışılmış bir şey değil.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], biz [mozarab_merchant.GetFaith.GetAdherentNamePlural] hayatlarımızı yaşarken... çeşitli zorluklarla karşılaşmaya alışmış bir milletiz." dedi tüccar. Sakinliğini korusa da, cümlelerinin ağırlığı hissediliyordu.\n\n"Sizden isteğimiz, [mozarab_quarter.GetName] topraklarında birkaç mahallenin bize tahsis edilmesi. Böylelikle bu mahalleleri kendimizin olarak görebilir, kendi aramızda yaşayabiliriz. Buraya bu naçizane isteğimizi iletmek için geldim.""
 fp2_yearly.4005.a:0 "Şehirlerimde her zaman yeriniz var."
 fp2_yearly.4005.b:0 "Şehirlerimi kirletmenize müsaade etmeyeceğim!"
 fp2_yearly.4006.t:0 "[ROOT.Char.GetFaith.HighGodNamePossessive] Mimarı"

 fp2_yearly.4006.desc:0 "[ROOT.Char.GetFaith.HouseOfWorship] kapısından çıkarken bana yaklaşmak gerçekten cesaret gerektiren bir iş ve [Select_CString(mozarab_wanderer.IsFemale, 'kadının', 'adamın' )] teki tam olarak bunu yapıyor. Konuşmaya başladığında boynundaki haç kolyeyi fark ediyorum.\n\n"
 fp2_yearly.4006.a:0 "Onay veriyorum. Kendinize [mozarab_priest.GetFaith.HouseOfWorshipPlural] inşa edin."
 fp2_yearly.4006.b:0 "Benim topraklarımda #EMP asla#! o kâfir yuvalarından inşa edemezsiniz!"
 fp2_yearly.4007.t:0 "Deniz Kabuğu"
 fp2_yearly.4007.desc:0 "[realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] ile yürürken yerde beyaz bir ışıltı görüyorum. Eğildiğimde kemik beyazı, sert, yuvarlak bir cisim beliriyor: bir deniz kabuğu.\n\nBu deniz kabukları Santiago'ya çıkan bu yolu takip eden hacıların habercisidir. Bunlardan birine sahip olanlar, özellikle üzerinde Santiago'nun işareti bulunanalar, meşakkatli yolculuğu tamamlamış demektir.\n\nDeniz kabuğuyla oynarken [realm_priest.GetFirstNameNoTooltip] ile göz göze geliyorum. Aklımdaki fikri onaylamadığı her hâlinden belli oluyor."
 fp2_yearly.4007.a:0 "Bunu alacağım, sen de çeneni kapalı tutacaksın."
 fp2_yearly.4007.b:0 "Tamam. #EMP Tamam!#! Bulduğum yere bırakıyorum."
 fp2_yearly.4007.c:0 "...kime inanacaklarını sanıyorsun, [realm_priest.GetFirstNameNoTooltip]?"
 fp2_yearly.4007.c.tt.flavour:0 "Eğer bu deniz kabuğunu alırsam gerçek #EMP olmadığını#! kim söyleyebilir ki?"
 fp2_yearly.4007.c.tt.success:0 "İnandırıcı olan deniz kabuğunu aldınız"
 fp2_yearly.4007.c.tt.fail:0 "[realm_priest.GetFirstNameNoTooltip] deniz kabuğunun sahte olduğunu ortaya çıkardı"
 fp2_yearly.4008.t:0 "Ateş Masalları"

 fp2_yearly.4008.desc.intro:0 "Ateş çıtırdıyor, hizmetkârların kaldığı odaların duvarlarına uzun gölgeler düşürüyordu. Buruşuk, ihtiyar bir kadın çocukları masallarıyla heyecanlandırıyordu.\n\n"
 fp2_yearly.4008.desc.ending:0 "\n\nYaşlı kadın hikâyesini bitirdiğinde ateş sönmek üzereydi ve çocuklar yataklarına yöneldi."
 fp2_yearly.4008.a:0 "Amma eğlenceli bir masalmış!"
 fp2_yearly.4008.b:0 "Ha! Saçma sapan hayalet hikâyeleri işte!"
 fp2_yearly.4008.c:0 "Güzel bir masal anlattın!"
 fp2_yearly.4009.t:0 "Ak Lord"
 fp2_yearly.4009.desc:0 "Bugün özel bir gün. Köşeyi döndüğümde Jaun Zuria efsanesindeki izini sürdüğüm Malato Ağacı'nı gördüm. Bir orduyu durdurmayı başaran genç bir savaşçının öyküsü her bir [root_culture.GetName] çocuğun aklına kazınmıştır.\n\nElimi yumrulu gövdesinin üzerinde gezdiriyordum ki bir parmak büyüklüğündeki bir boşluğa denk geldim. Efsanelere göre Ak Lord'un takipçileri tarafından onu her yerde takip etme azimlerine tanık olmaları için buraya bir kılıç yerleştirilmiş."
 fp2_yearly.4009.a:0 "Ben de halkımızın düşmanlarını ortadan kaldıracağım!"
 fp2_yearly.4009.b:0 "Yalnız bir [root_culture.GetNameNoTooltip] değilim, çok daha fazlasıyım."
 fp2_yearly.4009.c:0 "Bugüne dair ufak bir hatıra güzel olurdu."
 fp2_yearly.4010.t:0 "Taştan Domuzlar"
 fp2_yearly.4010.desc:0 "[verraco_county.GetName] topraklarında sıradan bir gezi esnasında sıradışı bir şeye rastlıyorum.\n\nDomuz şeklindeki büyük taştan heykeller önümde duruyor. Yıprandıklarına göre gerçekten antik olmalılar. Eğer gerçekten bu kadar eskilerse bir domuz heykeli yapmalarına ne sebep olmuş olabilir?"

 fp2_yearly.4010.a:0 "Belki de bunlar... azizlerin türbeleridir?"
 fp2_yearly.4010.a.success:0 "İnsanlar teorinizi yuttu"
 fp2_yearly.4010.a.fail:0 "İnsanlar bunun hiçbir dayanağının olmadığını söyledi"
 fp2_yearly.4010.b:0 "Bunların hiçbir anlamı yok. Hepsini sökün."
 fp2_yearly.4010.c:0 "Bunlar kâfir işi heykeller! Hepsini yıkın!"
 fp2_yearly.4010.d:0 "Tüm bu domuz konuşmaları beni sıktı."
