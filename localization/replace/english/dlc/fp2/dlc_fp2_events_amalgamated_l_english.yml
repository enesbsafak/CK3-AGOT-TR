 fp2_struggle.2003.d:0 ""Hepiniz bana çok iyi çiftlik işçisi adayı gibi görünüyorsunuz!""

 fp2_struggle.2003.d.desc:0 "Yerel halktan tarım arazisi ve ekipman satın almayı ve paralı askerlere vermeyi teklif ediyorsunuz"
 fp2_struggle.2003.e:0 "Bırakın yerliler halletsin."
 fp2_struggle.2003.e.desc:0 "Gerilim zaten yeterince yüksek, birde onları kışkırtmak sadece daha büyük tehlikelere yol açar."

