 fp2_struggle.2007.t:0 "İberya'ya Layık Bir Kale"
 fp2_struggle.2007.desc.main:1 "gelişim için yeterince olgunlaştı," diyor [fp2_2007_scoped_steward.GetCouncilTitleFirstName]. "Sizin sağlayacağınız finansman ile, [fp2_2007_free_real_estate.GetCounty.GetTitle.GetNameNoTier] topraklarını bekleyen düşmanlarımıza karşı #emphasis çok daha#! düşük bir maliyetle güvence altına alabiliriz. [2007_vassal_sponsor.GetTitledFirstName], buraya [fp2_2007_foreign_faith.GetAdjective] tarzı bir [ROOT.Char.Custom('FortifiedBuilding')] inşa edilmesi için, kendi cebinden biraz altın önerdi. Ancak diğer vasallarınız yerel [ROOT.Char.GetFaith.GetAdjective] mimarisine bağlı kalınmasını istiyor. Kimi seçerseniz seçin, bu krallığı bütün olarak güçlendirmek için altın bir fırsat olacak." Tek sorun, bu altın fırsat için #EMP kim#! seçilecek..."

 fp2_struggle.2007.desc.a:0 ""Topraklarınız $fp2_struggle.2007.desc.main$""

 fp2_struggle.2007.desc.b:0 ""[fp2_2007_castle_holder.GetTitledFirstName]'in toprakları $fp2_struggle.2007.desc.main$""
 fp2_struggle.2007.a:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U] bir mimar işe alacağım."
 fp2_struggle.2007.a.castile:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] mimar mı? [fp2_2007_foreign_faith.GetAdjectiveNoTooltip] mimar mı? Bir [fp2_2007_allegedprotocastilean.GetNameNoTooltip] mimar istiyorum!"
 fp2_struggle.2007.a.notif:0 "[fp2_2007_free_real_estate.GetName] topraklarında bir kale inşaatına başlanacak."
 fp2_struggle.2007.a.major_vassal_flavor:0 "Aynı inanca sahip önemli vasallar hâli hazırda bir beklenti içinde olduklarından size karşı olan görüşleri değişmeyecek."
 fp2_struggle.2007.a.castile.favor:0 "Örnek mimarlar oldukları için [fp2_2007_allegedprotocastilean.GetNameNoTooltip] mimarisine karşı çıkamaz"
 fp2_struggle.2007.b:0 "[fp2_2007_foreign_faith.GetAdjectiveNoTooltip] bir mimar işe alacağım."
 fp2_struggle.2007.b.flavor:0 "Bu eylem, inançtan bağımsız bir eylem olarak görülecektir."
 fp2_struggle.2007.c:0 "Kaleyi kendim tasarlayacağım, ne kadar zor olabilir ki?"
 fp2_struggle.2007.c.flavor:0 "Servet harcamadan bir kale tasarlamak, çok zor bir girişimdir."
 fp2_struggle.2007.c.roco:0 "$royal_architect_court_position$ bu görevi üstlenecek"
 fp2_struggle.2007.c.notif.a.t:0 "Çürümüş Temel, Dağılan Yapı"
 fp2_struggle.2007.c.notif.a.desc:0 "Kale planlarınıza başarısızlık musallat oluyor"
 fp2_struggle.2007.c.notif.b.desc:0 "Tasarım başarılı"
 fp2_struggle.2007.d:1 "Hiçbir kaleyi finanse #EMP etmeyeceğim#!, özellikle benim olmayacaklarsa!"
 fp2_struggle.2007.d.alt:0 "Bu toprakların kaleye ihtiyacı yok, kendi hâline bırakın."
 fp2_struggle.2008.t:0 "[fps_2008_misdeed_actor.GetCouncilTitle] Kötülükleri"
 fp2_struggle.2008.desc:0 "Akşamları [fps_2008_misdeed_actor.GetCouncilTitleFirstName], loş bir konsey odasında oturur. Bu akşam, bakışları ve tüy kalemi göze çarpmayan harcama raporlarına odaklanmıştı. Yanında krallık damgalı kil kalıplar da vardı, bunlar ancak krallığı dolandırmayı amaçlıyorsa gerekli olacaktı. Onun konumunda bir [Select_CString(fps_2008_misdeed_actor.IsFemale,'kadının','adamın')] [ROOT.Char.GetFaith.HighGodName] karşısında bu kadar rezilce davranmaya cüret edeceğini düşünmek!\n\nUtanç verici... ancak ustaca. Onu suçüstü yakalamasaydım, kimse onun bu planlarına karşı daha akıllıca davranamazdı."
 fp2_struggle.2008.a:0 "Yeterince gördüm, zindanlara!"
 fp2_struggle.2008.b.a:0 "Bana sahte belge yapmayı öğret, sana merhamet göstereyim."
 fp2_struggle.2008.b.flavor:1 "Sahtecilik sanatı hakkında aldığınız bilgiler karşılığında kanıtları ortadan kaldırıyorsunuz."
 fp2_struggle.2008.c:0 "Bu altın tahsil belgeleri benim için... değil mi?"
 fp2_struggle.2008.c.flavor:0 "Kanıtları görmezden geliyor ve yolsuzluk planına ortak oluyorsunuz."
 fp2_struggle.2008.d:0 "Şehir meydanında herkesin gözü önünde teşhir edileceksin."
 fp2_struggle.2008.d.flavor:0 "İnsanlara onun yaptıklarını ifşa ediyorsunuz ki, kendileri onu yargılasınlar. Vasal ve konsey üyelerinizin tutarsız arzularına karşı."
 fp2_struggle.2009.t:0 "Efsane Hırsızlarını Yakalamak"

 fp2_struggle.2009.desc:0 ""Yanlış kaleye girmişsin, aptal!" diye bağırır kumandanım, [fp2_2009_marshal.GetSheHe] korkmuş davetsiz misafiri kılıçla tehdit ederken.\n\nKumandanımın daha fazla baskısı altında, genç [fp2_2009_garduna_young_thief.GetWomanMan] [fp2_2009_garduna_young_thief.GetSheHe]'in [fp2_2009_involved_ruler.GetPrimaryTitle.GetName]'den gelen ve korkulan [fp2_2009_garduna_guild_master.GetFullNameNicknamed] tarafından yönetilen büyük bir suç örgütünün parçası olduğunu anlatır. "Yani, tam burnumun dibinde yeni bir hırsız loncası kurmaya çalışıyorsun, öyle mi?" diye sorarım; hırsız sadece başını sallar. [fp2_2009_garduna_young_thief.GetSheHe|U] hayatı karşılığında daha fazla bilgi vermeye istekli.""
 fp2_struggle.2009.a:0 "Bu krallık #EMP iki#! [Select_CString(ROOT.Char.IsFemale,'kraliçe','kral')] için yeterince büyük değil."
 fp2_struggle.2009.a.flavor:0 "Liderlerinin konumu karşılığında hırsızın gitmesine izin veriyorsunuz, ardından onları yenmek ve "Hırsız Katili" unvanını kazanmak için bir göreve başlıyorsunuz."
 fp2_struggle.2009.b:0 "Bana suç ortaklarının nerede saklandığını söyle, ben de canını bağışlayayım."
 fp2_struggle.2009.b.blues:0 "Arkadaşlarını sattıktan sonra #TUT_KW [GetTrait('depressed_1').GetName(GetNullCharacter)]#! [Concept( 'trait', 'Özelliğini' )|E] kazanır"
 fp2_struggle.2009.c:0 "Bu sizin hırsız loncanız... #emphasis vergilendirilebilir#! gibi geliyor."
 fp2_struggle.2009.d:0 "Benim için çalış, [fp2_2009_involved_ruler.GetPrimaryTitle.GetNameNoTooltip] ile olan anlaşmanı boz."
 fp2_struggle.2009.d.flavor.st:0 "Hırsızlar loncasına topraklarını terk etmesi için para ödüyorsun"
 fp2_struggle.2009.e:0 "[fp2_2009_involved_ruler.GetTitledFirstNameNoTooltip], kesik kafanı hediye olarak alacak."
 fp2_struggle.2009.e.a:0 "Hırsızlar loncası rastgele bir kontlukta istikrarsızlaştırma ile misilleme yapabilir"
 fp2_struggle.2010.t:0 "Kaya Sansarını Avlamak"
 fp2_struggle.2010.desc:0 "[fp2_2009_involved_capital_county.GetNameNoTierNoTooltip] yolculuğumun sonunda, terk edilmiş bir kiliseye giriyorum. [fp2_2009_garduna_guild_master.GetNameNoTooltip] benim gelmemi bekliyordu.\n\n"Sizin [ROOT.Char.GetFirstNameNoTooltip] olduğunuzu tahmin ediyorum. Elinizdeki [ROOT.Char.Custom('signature_weapon')], bana buraya teklifte bulunmaya gelmediğiniz gösteriyor. Ancak hırsızlar meslek olarak tüccarlara askerlerden daha yakındır. Bana ödeme yaparsanız ikimiz de yolumuza gidebiliriz. Ödemeniz durumunda bizim de ülkenizle bir işimiz kalmaz.""
 fp2_struggle.2010.b:0 "Yılanın kafası küçükken ezilir!"
 fp2_struggle.2010.c:0 "Koruma parası ödemek, kavga etmekten daha mantıklı gözüküyor..."
 fp2_struggle.2011.desc:0 "[fp2_2009_garduna_guild_master.GetFirstName] öldü ve onun ölümü ile birlikte hırsızlar loncası ve onların operasyonları sekteye uğratıldı."
 fp2_struggle.2011.a:0 "#DIE2 Hırsızların#! [Select_CString(ROOT.Char.IsFemale,'Kraliçesi','Kralı')] Olmak Güzel"
 fp2_struggle.2012.t:0 "Yerel kaynaklardan rapor:"
 fp2_struggle.2012.desc:0 "[fp2_2009_involved_capital_county.GetNameNoTierNoTooltip] civarında yağmalarda bulunan bir grup acımasız hırsız var. Birinin bu suçluları bize karşı hareket etmeleri için kasten finanse ettiği açık. Şimdilik bölgeyi emniyete almak için bir mareşal atamak akıllıca olur."
 fp2_struggle.2012.a:0 "Bunun ardında her kim varsa kalleşlik yapıyor!"
 fp2_struggle.2012.t.alt:1 "Sevgili [ROOT.Char.GetFullNameRegnal]"
 fp2_struggle.2012.desc.alt:0 "Bu mektubun yanında, her ikimizin krallığının da etrafında başıboş dolaşan hırsızlardan birinin kopmuş kafasını bulacaksınız. Onu idam ettim ve [fp2_2009_involved_capital_county.GetNameNoTier] garnizonunuza suç ortaklarının bulunduğu yeri bildirdim."
 fp2_struggle.2012.a.alt:0 "[fp2_2009_has_gifted_head.GetFirstNameNoTooltip] bana güzel bir hediye getirdi!"
 fp2_struggle.2013.t:0 "Özgürlüğün Sırrı"
 fp2_struggle.2013.desc:0 "[fp2_2013_prisoner_with_a_secret.GetFullNameRegnal] merhametime kalmış bir mahkûm. Bunun çok iyi farkında olarak, çaresiz bir savunma yapıyor... "Beni serbest bırakırsanız, [fp2_2013_secret_owner.GetFullNameRegnal] hakkında bir sır söylerim.""
 fp2_struggle.2013.a:0 "Bana sırrını söyle ve özgürlüğüne kavuş."
 fp2_struggle.2013.a.a:0 "#TUT_KW [fp2_2013_secret_owner.GetFirstName] hakkında#! bir sır öğreneceksiniz"
 fp2_struggle.2013.b:0 "Sana işkence yapabilecekken neden pazarlık yapayım ki?"
 fp2_struggle.2013.b.b:0 "[fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] işkenceye direniyor"
 fp2_struggle.2013.c:0 "Hain yılan! [fp2_2013_secret_owner.GetFirstNameNoTooltip] bu teklifini öğrenecek!"
 fp2_struggle.2013.c.desc:0 "Sırrı öğrenmeden [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] hainini, cezasını vermesi için [fp2_2013_secret_owner.GetFirstNameNoTooltip] ve onun adaletine teslim etmeye karar veriyorsunuz."
 fp2_struggle.2013.c.a:0 "[fp2_2013_secret_owner.GetFirstName], [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] haininin kaderini belirleyecek"
 fp2_struggle.2013.d:0 "Söz vermiyorum, önce bir söyle, sonra belki düşünürüm..."
 fp2_struggle.2014.t:0 "Adil [ROOT.Char.GetNameNoTooltip] için:"
 fp2_struggle.2014.desc.start:0 "[fp2_2013_prisoner_with_a_secret.GetNameNoTooltip] hakkında kararımı vermem için bana gönderdiğiniz için teşekkür ederim, "
 fp2_struggle.2014.desc.light:0 "ancak cezayı hak edecek bir şey yaptığına inanmıyorum. Zarar verilmeden salınmasına izin verdim.$fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.start:0 "Bu domuzun kendi derisini kurtarmak için sırlarımı satmaya çalıştığını anlıyorum."
 fp2_struggle.2014.desc.heavy.outcome.prison:0 "$fp2_struggle.2014.desc.heavy.start$ Ne onun ne de sırlarımın bir daha gün ışığını görememesini sağlayacağım.$fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.outcome.death:0 "$fp2_struggle.2014.desc.heavy.start$ Ben de işkenceciye derisini yüzmesini emrettim!$fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.end:0 "\n\nBana iyilik yaptınız, bunu unutmayacağım. Teşekkürler."
 fp2_struggle.2014.b:0 "[fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] darağacına gitmedi diye üzüldüm ancak en azından bir iyilik kazandım."
 fp2_struggle.2015.t:0 "Arkadaki Mektup"
 fp2_struggle.2015.desc:0 "Sarayımda yürürken tanımadığım bir kişinin bana yaklaştığını fark ettim. "[ROOT.Char.Custom('ComplimentAdjective')|U] efendim, ben [fp2_struggle_2015_peasant_to_murder.GetFirstName], eskiden [fp2_struggle_2015_murder_requester_vassal.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)] için çalışan bir saray mensubuydum. Benden kendimi size sunmamı ve sarayınıza katılmamı istedi. Ayrıca bana sadece sizin okuyabileceğiniz bir takdim mektubu verdi." dedikten sonra bir mektup uzattı.\n\nMührü kırdıktan sonra, mektupda şöyle yazıyordu: "#EMP Sevgili [ROOT.Char.GetFirstName], lütfen bu mektubun taşıyıcısını öldürün#!. - [fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip]""

 fp2_struggle.2015.a:0 ""Hoş geldin! Gel, biraz #DIE2 (zehirli)#! [ROOT.Char.Custom('GetExpensiveDrink_Singular')] iç.""
 fp2_struggle.2015.a.a:0 "Zehirleme girişimini berbat ettiniz"
 fp2_struggle.2015.a.murder_scheme:0 "[fp2_struggle_2015_murder_requester_vassal.GetTitledFirstName], [fp2_struggle_2015_peasant_to_murder.GetFirstName] için olan öldürme planlarına devam edecek"
 fp2_struggle.2015.a.b:0 "Saray mensubu zehirlendi!"
 fp2_struggle.2015.b:0 "Mektubu dikkate almayın ve [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] yeni saray mensubunuz olsun."

 fp2_struggle.2015.c:0 ""Ölümle damgalandın, kaçabilirken kaç.""
 fp2_struggle.2015.c.a:0 "[fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] kaçmayı "gizemli bir şekilde başaramaz""
 fp2_struggle.2015.c.b:0 "[fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] artık [fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip] için dert değil, öldüğü yönünde kandırılır"
 fp2_struggle.2016.t:0 "Aptal [ROOT.Char.GetFirstNameNoTooltip] için,"
 fp2_struggle.2016.desc:0 "En sevdiğim elçim [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip], #DIE2 (isteğim üzerine)#! senin tarafından öldürüldüğünü biliyorum. Ama endişelenme, sadık vasalın olarak bu sırrı aramızda tutacağım. İyi arkadaşlar gibi birbirimize yardım etmeye devam ettiğimiz sürece."
 fp2_struggle.2016.a:0 "Kandırıldım! [fp2_struggle_2015_murder_requester_vassal.Custom2('InsultNoun', ROOT.Char)]!"
 fp2_struggle.2018.t:1 "Arkadaş için Satranç"
 fp2_struggle.2018.t.outcome.a:0 "Arkadaşlık Kurmak"
 fp2_struggle.2018.t.outcome.b:0 "Zevkli Arkadaşlık"
 fp2_struggle.2018.t.outcome.c:0 "Bir Zevksiz Zaman"
 fp2_struggle.2018.desc.desc_combat_clarification:0 "Zihnimde kılıçlarımız çarpıştı, yoğun bir stratejik analiz ve saf kararlılık savaşı.\n\nBiz sadece bir tahta üzerinde piyonları hareket ettiriyorduk ancak yoğun konsantrasyon odayı ve tahtayı eter içinde yok ederek bizi hayal gücümüzün yarattığı bir savaş alanına götürdü. Büyük bir şevk ile mücadele ettiğim her piyonda zafere adım adım ilerliyorum...\n\n"
 fp2_struggle.2018.desc.desc_intro:0 "Dakikalar saatlere dönüşüyor ve alacakaranlık, birlikte geçirdiğimiz zamanın sona erdiğini gösterirken [fp2_2017_gamervassal.GetFirstNameNoTooltip] konuşuyor... "

 fp2_struggle.2018.desc.good_intro_match:0 ""Ah, nefis bir maç!""

 fp2_struggle.2018.desc.bad_intro_match:0 ""Of, nasıl maçtı ama... Gerçekten daha sık idman yapmalısın, hamlelerin basit ve tahmin edilebilirdi, kendini savunamayan bir rakibe karşı oynamanın hiçbir zevki yok. ""
 fp2_struggle.2018.desc.fought_hard:0 "$fp2_struggle.2018.desc.good_intro_match$ Dişinle, tırnağınla savaştığın kesin, buna saygı duyabilirim. "
 fp2_struggle.2018.desc.was_creative:0 "$fp2_struggle.2018.desc.good_intro_match$ Şah kanadından hipopotam savunması açılışıyla beni şaşırttın, ne cüretkar bir hareketti bu! "
 fp2_struggle.2018.desc.match_end_win:0 "Ve de sen kazandın, hak ettin! "
 fp2_struggle.2018.desc.match_end_loss:0 "Ama sonunda, yine de ben kazandım. "
 fp2_struggle.2018.desc.match_end_loss_noticed:0 "Yine de kazanmayı başardım, ancak baştan beri planın buymuş gibi hissediyorum. "
 fp2_struggle.2018.desc.social_pre_intro:0 "Yakın köylerdeki basit işlerden [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] arasındaki düelloların sonuçlarına kadar çeşitli konularda içki içip konuşarak vakit geçiriyoruz."
 fp2_struggle.2018.desc.social_pre_intro_crit:0 "[fp2_2017_gamervassal.GetFirstName] resmen sohbetin esiri olmuştu, masamızdaki tüm konularla ilgilendi ve büyük bir tutkuyla tartıştı."
 fp2_struggle.2018.desc.social_pre_intro_good:0 "[fp2_2017_gamervassal.GetFirstName] gayet memnun gözüküyordu, konuşmanın ve misafirperverliğin tadını çıkardığı çok açıktı.\n\n"
 fp2_struggle.2018.desc.social_pre_intro_bad:0 "[fp2_2017_gamervassal.GetFirstName] belli ki sıkılmıştı ve tüm sohbet boyunca dalgındı...\n\n"

 fp2_struggle.2018.desc.social_intro:0 ""Sanırım içeceğim kadar içtim. ""
 fp2_struggle.2018.desc.social_good:0 "[ROOT.Char.Custom('GetExpensiveDrink_Singular')|U] harikaydı, teşekkür ederim. "
 fp2_struggle.2018.desc.outcome_0:0 "Çok eğlendim, seni daha sık ziyaret etmeliyim!""
 fp2_struggle.2018.desc.outcome_1:0 "Eğlenceliydi, belki bir ara tekrar ziyaret ederim.""
 fp2_struggle.2018.desc.outcome_2:0 "Gitmeliyim, muhtemelen [SCOPE.sC('fp2_2017_gamervassal').Custom2('RelationToMe', SCOPE.sC('fp2_2017_questgiver'))] beni özlüyordur. Hoşça kal [ROOT.Char.GetFirstNameNoTooltip].""
 fp2_struggle.2018.a:0 "Başardıım! Onu yendim!"
 fp2_struggle.2018.b:0 "Pek arkadaş olduk sayılmaz ama çok eğlendik!"
 fp2_struggle.2018.c:0 "Ah, pek de iyi gitmedi..."

 fp2_struggle.2020.t:0 "Açò és or, xata!"
 fp2_struggle.2020.desc:0 "[fp2_2020_valencia.GetName] topraklarından geçen köylü bir kadın bana daha önce tattığım her şeyden daha tatlı, ferahlatıcı bir bardak süt sunuyor. "Bana ikram ettiğin bu harika içecek nedir?" soruma, "Yer bademi sütü." diye yanıt veriyor.\n\nSıcak bir yaz gününde bu karışımın cazibesine karşı koyabilecek hiç kimse yoktur. Bu içecekten bir bardak teklif ediliğinde kimsenin yüzünden gülümseme eksik olmaz. Hiçbir Valensiyalı buna karşı koyamaz. #EMP Bu içecek süt değil, altın!#!"

 fp2_struggle.2020.a:0 ""Bundan böyle, [fp2_2020_valencia.GetNameNoTooltip] yalnızca yer bademi yetiştirecek!""
 fp2_struggle.2020.a.desc:0 "Köylüleri sadece yer bademi yetiştirmeye zorlarsınız, başkentiniz için lüks ürünler yaratırsınız."

 fp2_struggle.2020.b:0 ""Tüm fıçılarını bana ver, bu bir sonraki şölenimin merkezinde olacak!""

 fp2_struggle.2020.c:0 ""Bu içkinin cazibesine kapılmayacağım, defol!""
 fp2_struggle.2020.c.desc:0 "Karamsar bir şekilde horchata arzusundan kurtulursunuz. Şeytana uymayarak kötü ün kazanırsınız."
 fp2_struggle.2020.d:0 "Tarlalarda daha fazla yer bademi ekimi için bütçe ayırın."
 fp2_struggle.2021.t:0 "Hırsızlar Kralının Dönüşü"

 fp2_struggle.2021.desc:0 ""Merhaba [ROOT.Char.GetFirstName], bahse girerim beni bir daha görmeyi beklemiyordun. ""
 fp2_struggle.2021.desc.alt.cutout:0 "Özellikle yıllar önce çetemi yok ettikten sonra. Ama bir şeyi kırmak, yeniden bir araya getirmek kadar kolay ve daha fazla farenin kediden saklandığı gibi saklanmak istemiyorum. Bana [fp2_2021_old_napoly.GetNameNoTier] topraklarına güvenli geçiş izni ver ve bir daha birbirimizi görmeyelim. Hırsızlar loncası ise sen ve senin zenginliklerinden uzakta yeniden kurulacak.""
 fp2_struggle.2021.desc.alt.paidoff:0 "Özellikle de seni daha fazla rahatsız etmemek için bir anlaşma yapmamızdan sonra. Ancak kesem yine hafifledi ve rahatım yerinde değil. Buralar suç için verimli topraklar olabilir ama suçu örgütleyebilmek için pek verimli değil. Adamlarım ve ben [fp2_2021_old_napoly.GetNameNoTier] topraklarına gitmek istiyoruz, bize güvenli geçiş izni sağla ve daha sonra bizim için bir daha hiç endişelenme.""
 fp2_struggle.2021.desc.alt.work:0 "Ancak geçen sefer sizinle birlikte çalışmak oldukça hoştu ve güvenilir insan bulmak da oldukça zor. Artık emekli olmak istiyorum, bana [fp2_2021_old_napoly.GetNameNoTier] topraklarına güvenli geçiş garantisi verebilir misiniz?""
 fp2_struggle.2021.desc.alt.behead:0 "Buraya [fp2_2009_garduna_young_thief.GetFirstName] için öc almaya gelmedim, emekli olmaya geldim. Onun kellesi bedeninden ayrıldı ve sıradaki kelle benim kellem olabilir. [fp2_2021_old_napoly.GetNameNoTier] topraklarına gidebilmem için bana güvenli bir geçiş sağlayın ve bir daha birbirimizi hiç görmeyelim. Bu toplantının kanla bitmesine gerek yok.""
 fp2_struggle.2021.desc.outro:1 "Diye konuşuyor [fp2_2009_garduna_guild_master.GetFullNameNicknamed], bir elinde altın kesesi, bir elinde de saklamaya çalıştığı silahı."

 fp2_struggle.2021.a:0 ""Pekâlâ, İtalya'ya gitmene yardım edeceğim.""

 fp2_struggle.2021.a.alt:0 ""Onun yerine, İtalya'ya çekilmeye ne dersin?""
 fp2_struggle.2021.a.a:0 "[fp2_2009_garduna_guild_master.GetFirstName] [fp2_2021_old_napoly.GetName] topraklarına yola çıkar ve gözden kaybolur"

 fp2_struggle.2021.b:0 ""Aslında, bunun yerine saflarıma katılmaya ne dersin?""

 fp2_struggle.2021.c:0 ""Kulağa yorucu geliyor, suçlu olmak yerine casus olmaya ne dersin?""
 fp2_struggle.2021.c.flavor:0 "[fp2_2009_garduna_guild_master.GetFirstNameNoTooltip] için yeterli parayı teklif ederek bir casus ağı kurmasını ve böylece sizin adınıza sır aramalarını sağlayabilirsiniz."
 fp2_struggle.2021.c.a:0 "Casus ağı, mücadeleye dâhil olan diğer hükümdarlardan iki sır arayacak ve rapor edecek"
 fp2_struggle.2021.c.spynet.a:0 "Casus Ağı Sır Buldu:"
 fp2_struggle.2021.c.spynet.b:0 "Casus ağı sır bulamadı"
 fp2_struggle.2021.c.spynet.b.desc:0 "[fp2_2009_garduna_guild_master.GetFirstName] tarafından idare edilen casus ağı, ilgili herhangi bir sır bulamadı ancak casusbaşı deneyimlerinden çok şey öğrendi..."

 fp2_struggle.2021.d:0 ""Hayır, bu sefer kaçamayacaksın! Kendini hazırla!""
 fp2_struggle.2021.d.alt:0 "Haklısın, sıradaki senin kellen #EMP olacak#!! #BER Geber!#!"
 fp2_struggle.2021.d.a:0 "Eski Düşmanları Öldürmek"
 fp2_struggle.2021.d.b:0 "@warning_icon! [dueltarget.GetFirstName] ile ölümcül bir düelloya gireceksiniz"
 fp2_struggle.2023.t:0 "Bir Ozan İçin Bir Kral"
 fp2_struggle.2023.desc:1 "Krallıklarımız arasındaki gerilimi ölçmek için [fp2_2023_foreign_king.GetPrimaryTitle.GetName] sınırındaki bir ordugâhta çadırdayım. Aniden bir [Select_CString(fp2_2023_enemy_knight.IsFemale, 'kadın', 'adam' )] içeri giriyor ve "yeni komutanı" görmek istiyor. İçgüdüsel olarak öne çıkıyorum.\n\n"Demek yeni komutan sensin? Pekâlâ, bir meydan okuma seç, kaybeden bu gece diğer kampın içkilerini öder!" diyor karşı ordugâhın komutanı [fp2_2023_enemy_knight.GetFirstName]. Sadece askerî bir lider değil, [ROOT.Char.GetFirstNameRegnal] olduğum gerçeğinden habersiz."
 fp2_struggle.2023.a.desc:0 "Askerlere kim olduğunuzu söylüyorsunuz, eğlenceyi dağıtıyorsunuz ve görev başında düşmanla dostluk yapmanın cezası olarak birliklerinizi tek ayak üzerinde çöktürüyorsunuz."

 fp2_struggle.2023.a.a:0 ""Seni aptal, ben [ROOT.GetCharacter.GetFullNameNoTooltip]'im!""

 fp2_struggle.2023.b:0 ""Birbirinizin hükümdarları hakkında en iğrenç şiirinizi ortaya koyun!""
 fp2_struggle.2023.b.desc:0 "İkiniz de karşı diğer hükümdar hakkında iğreçlikler içeiren şiirler yazıyorsunuz, sonra onları neşeli kalabalığa yüksek sesle okuyorsunuz."
 fp2_struggle.2023.b.a:0 "[fp2_2023_foreign_king.GetFirstNameRegnal] ile alay ediyorsun"
 fp2_struggle.2023.b.b:0 "Şiiriniz alay konusu oluyor"

 fp2_struggle.2023.c:0 ""Bunu dostça bir müsabakayla çözelim, garde!""
 fp2_struggle.2023.c.desc:0 "Daha sonra içkilerin parasını kimin ödeyeceğine karar vermek için düşman komutanıyla ölümcül olmayan bir düeolloya girersiniz."
 fp2_struggle.2023.c.exptooltip:0 "Maçtan ek olarak [martial_lifestyle|E] Tecrübesi kazanacaksınız."
 fp2_struggle.2023.c.a:0 "Düşman Komutanı Alt Etmek"
 fp2_struggle.2023.c.b:0 "[fp2_2023_enemy_knight.GetNameNoTooltip] Tarafından Alt Edilmek"

 fp2_struggle.2023.d:0 ""Meyhaneyi neden bekleyelim? Bira içerek yarışalım!""
 action_considered_haram_warning:0 "@warning_icon! #italic Bu eylem #X haram#! kabul edilir#!"
 fp2_struggle.2023.d.a:0 "Sızıyorsunuz"
 fp2_struggle.2023.d.b:0 "Bir fıçıyı içiyorsunuz"
 fp2_struggle.2025.t:0 "Başarıdan Gelen Izdırap"
 fp2_struggle.2025.desc:1 "Güneşin sıcak parıltısının altında güneşlenen, düzensiz tarlaları ve dökülen binaları olan bir toprak parçası, rüzgâr, yıpranmış taşlarının arasından yalnızlığın feryatlarını fısıldıyor. Burası [fp2_2025_razed_land.GetNameNoTier] civarındaki buna benzer pek çok köyden biri, savaş geldiğinde gidenler savaş bittiğinde asla geri dönmedi. Üzerinde [ROOT.Char.GetPrimaryTitle.GetName] bayrağı dalgalanmaya başladı.\n\n"Çok güzel, değil mi?" diye sordu [ROOT.Char.Custom2('RelationToMe', fp2_2025_marshal)] [fp2_2025_marshal.GetFirstName], "Açık arazi burası, yeniden inşa etmek için ideal. Başarımız için tam burada bir anıt dikebiliriz.""
 fp2_struggle.2025.a:0 "Yeni tebaamızın yas tutmak için zamana ihtiyacı var, kavga etmeye değil..."
 fp2_struggle.2025.b:0 "Çok iyi fikir! Burada anıtların en büyüğü duracak!"
 fp2_struggle.2025.c:0 "Bu şehri eski hâline döndüreceğiz."
 fp2_struggle.2025.d:0 "Yeni arazilerimi korumak için burada geçici karakollar kuracağım."
 fp2_struggle.2050.title_main_ichi:0 "Tedirginlik"
 fp2_struggle.2050.title_main_ni:0 "Saray Dedikoduları"
 fp2_struggle.2050.title_main_san:0 "Düşmancıl Fısıltılar"
