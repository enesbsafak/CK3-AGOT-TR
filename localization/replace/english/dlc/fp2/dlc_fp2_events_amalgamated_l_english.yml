 awesome_toledo_sword_name:1 "[great_swordsmith.GetTitledFirstNameNoTooltip] ve Kılıcı"
 awesome_toledo_sword_desc:0 "Bu kılıç [toledo_county.GetNameNoTierNoTooltip] topraklarından gelen [great_swordsmith.GetName] adlı demircinin en iyi çalışmasıydı. Kılıç, kendiyle birlikte mezarına götürdüğü gizli teknikler kullanılarak dövüldü. Yetenekli olduğu kadar kibirli olan bu demircinin ruhunun bir kısmını kılıca akıttığı söylenir zira kılıç, kuşanana demirden bir irade sağlıyor."
 fp2_struggle.1012.t:1 "Başyapıt"

 fp2_struggle.1012.desc:0 ""Bitti," der [great_swordsmith.GetName].\n\n"Bu size söz verdiğim kılıç, en iyi işlerimden biri. Namlusu, ancak İberya'da yapılabilecek, hayal edilebilecek en iyi alaşımdan. Gerçekten de, dedikleri gibi, #italic demir bir ruha#! sahip. Sizin gibi bir [Select_CString(ROOT.Char.IsFemale,'asil hanımefendi','büyük lord')]e yakışır bir kılıç.""
 fp2_struggle.1012.a:0 "Oldukça...zarif. İstediğin yere gidebilirsin. "
 fp2_struggle.1012.b:0 "Muhteşem. Burada kalıp bana hizmet etmeye ikna edemez miyim?"
 fp2_struggle.1012.swordsmith_leaves:1 "Çalışmasını tamamladıktan sonra [great_swordsmith.GetName], söz verdiğiniz şekilde demirci loncasının kontrolünü almaya gidiyor."
 fp2_struggle.1012_swordsmith_stays:1 "[great_swordsmith.GetName], sarayınızda kalıyor"
 toledo_sword_name:0 "Toledo Kılıcı"
 toledo_sword_desc:0 "Bu kılıç Toledo çeliğinden üretilmiş bir başyapıt, oldukça güçlü ve dayanıklı. Kılıcın tabaındaki bir yazıda #italic büyük demirci#! [great_swordsmith.GetName] tarafından [blacksmith_county.GetNameNoTierNoTooltip] topraklarında dövüldüğü yazıyor."
 fp2_struggle.1050.t:0 "Kıyamet Rüyaları"
 fp2_struggle.1050.desc_opening:1 "[visionary_spouse.GetTitledFirstName], gecenin köründe beti benzi atmış ve ateşli bir şekilde yanıma geliyor. "Çok kötü rüyalar gördüm" diyor, "Bir ölüm denizinin ortasındaydım."

 fp2_struggle.1050.desc_christian:0 "Evlerimiz yıkıldı, ölülerimiz dirildi, erkeklerimiz, kadınlarımız ve çocuklarımız karanlıkça yutuldu."

 fp2_struggle.1050.desc_islamic:0 "Evlerimiz yıkıldı, ölülerimiz dirildi, erkeklerimiz, kadınlarımız ve çocuklarımız karanlıkça yutuldu."

 fp2_struggle.1050.desc_rampaging_barbarian_heathen:0 "Evlerimiz yıkıldı, ölülerimiz dirildi, erkeklerimiz, kadınlarımız ve çocuklarımız karanlıkça yutuldu."

 fp2_struggle.1050.desc_non_barbarian_heathen:0 "Evlerimiz yıkıldı, ölülerimiz dirildi, erkeklerimiz, kadınlarımız ve çocuklarımız karanlıkça yutuldu."

 fp2_struggle.1050.desc_islamic_heritage:0 "Bilinen her şeyin buzca yutulduğunu ve hiç bitmeyen bir gecenin başlangıcını gördüm."\n\n"

 fp2_struggle.1050.desc_christian_bling_reference_drop:0 "Bilinen her şeyin buzca yutulduğunu ve hiç bitmeyen bir gecenin başlangıcını gördüm."\n\n"

 fp2_struggle.1050.desc_middle_neutral_version:0 "Bilinen her şeyin buzca yutulduğunu ve hiç bitmeyen bir gecenin başlangıcını gördüm."\n\n"

 fp2_struggle.1050.desc_love_and_warmth_ending:0 ""Lütfen, sevgilim, bana yardım et. Rüyalarımın gerçek olduğundan, bu şeylerin gerçekleşeceğinden çok korkuyorum. Sarıl bana, çok üşüyorum.""

 fp2_struggle.1050.desc_no_love_and_warmth_ending:0 ""Sevgili [ROOT.Char.GetWifeHusband], lütfen dinle. Bana musallat olan sıradan bir hastalık değil. Rüyalarımın gerçek olduğundan, bu şeylerin gerçekleşebileceğinden korkuyorum. Lütfen, izin verme. Bizi Uzun Gece'den kurtarmalısın.""
 fp2_struggle.1050.a:0 "Sen cadı mısın?"
 fp2_struggle.1050.b:0 "Kendine gel. [ROOT.GetCharacter.GetFaith.HighGodName], inancını sorguluyor."
 fp2_struggle.1050.c:0 "Gel, gördüklerini bana biraz daha anlat."
 fp2_struggle.1050.d:0 "Beni yalnız bırak, sıradaki fethimi planlıyorum."
 fp2_struggle.1050.spouse_imprisoned:0 "Cadı olduğunu düşündüğünüzden [visionary_spouse.GetTitledFirstNameNoTooltip], tarafınızca zindana atılacak"
 fp2_struggle.1050.condition_might_improve:0 "[visionary_spouse.GetTitledFirstNameNoTooltip] ve durumu daha iyi olabilir"
 fp2_struggle.1050.condition_might_get_worse:0 "[visionary_spouse.GetTitledFirstNameNoTooltip] ve durumu daha kötü olabilir"
 fp2_struggle.1050.condition_might_get_very_worse:0 "[visionary_spouse.GetTitledFirstNameNoTooltip] ve durumu çok daha kötü olabilir"
 comforting_spouse_visionary_toast.success:0 "[visionary_spouse.GetTitledFirstName], sayenizde daha iyi"
 comforting_spouse_visionary.failure:0 "[visionary_spouse.GetTitledFirstName], sayenizde daha kötü"
 fp2_yearly.8004.t:0 "[translation_capital.GetNameNoTierNoTooltip] Çevirmen Okulu"

 fp2_yearly.8004.desc_opening:0 "İberya'da uzlaşma ruhu hüküm süregelirken, tüm bölgedeki bilginler ülkedeki kütüphaneleri ziyaret ediyor. Belki de uğraşlarını işe yarar bir şeye yönlendirebilirim...\n\n"

 fp2_yearly.8004.desc_chaplain:0 "[translation_enthusiast.GetCouncilTitle] [translation_enthusiast.GetTitledFirstName], bir fikre sahip."
 fp2_yearly.8004.desc_wanderer:0 "Gezgin [translation_enthusiast.GetTitledFirstName] bir fırsat sunuyor. "[ROOT.Char.Custom('FormOfAddressForLiege')|U]" diyor ve ekliyor, "Bir düzine dilde ustayım ve bir çevirmen ekibi kurmanıza yardımcı olabilirim. Diyarı yetenekli çevirmenler bulmak için gezelim ve size hizmet etmeleri için görevlendirelim. [translation_capital.GetNameNoTierNoTooltip], gerçek bir aydınlanma merkezi olabilir.""
 fp2_yearly.8004.a:0 "İşinin ehli insanları bulma konusunda tek bir kuruş dahi #italic esirgemeyeceğim#!."
 fp2_yearly.8004.b:0 "Madem o kadar yeteneklisin tüm çevirileri #italic sen#! yapabilirsin."
 fp2_yearly.8004.c:0 "Kütüphaneler hep boşa uğraş..."
 recruiting_brilliance_toast.success:0 "Harika çevirmenler buluyorsunuz"
 recruiting_mediocrity_toast.failure:0 "Ortalama çevirmenler buluyorsunuz"

 fp2_yearly.8005.t:0 "Fıstıkçamının Gölgesinde"
 fp2_yearly.8005.desc_opening:0 "Kavurucu öğlen güneşine karşın büyük bir fıstık çamının gölgesinde oturuyor, ud ve flüt çalıyorlar."
 fp2_yearly.8005.desc_iberian:0 "Galiçya-Portekizcesinde ve Katalanca şarkılar söylüyorlar. Yaşam, ölüm ve zorlu aşktan bahsediyorlar."
 fp2_yearly.8005.desc_arabic:0 "Arapça şarkılar söylüyorlar. Güzellik, şan ve kaybedilip tekrar bulunan aşktan bahsediyorlar."
 fp2_yearly.8005.desc_language_neutral:0 "Pek çok dilde şarkı söylüyorlar ama yine de sözlerini yürekten anlıyorum."
 fp2_yearly.8005.desc_middle_part:0 "Balkondan onları dinliyorum, ruhuma ilaç gibi geliyorlar.\n\nMüzisyenlerin kim olduğunu bilmiyorum ve büyük sarayımdan çıkıp ağaca yaklaştığımda çoktan gitmiş olduklarını görüyorum."

 fp2_yearly.8005.desc_post_troubadours:0 "Sadece Oksitan ozanların bu kadar yetenekli olduğunu sanırdım, meğerse yanılmışım...\n\nBu lanet #italic hisleri#! ne yapacağım?"
 fp2_yearly.8005.desc_pre_troubadours:0 "\n\n[ROOT.Char.GetFaith.PositiveAfterLife|U] bahçelerinden mi gönderildiler acaba? Yoksa [ROOT.Char.GetFaith.DevilName] tarafından beni tuzağa düşürmek için mi gönderildiler? Sanmıyorum... ama bu lanet #italic hisleri#! ne yapacağım?"
 fp2_yearly.8005.a:0 "[courtly_lover.GetFirstNameNoTooltip] için olan hislerim kalbime müzik gibi geliyor."
 fp2_yearly.8005.b:0 "Çok güzel..."
 fp2_yearly.8005.c:0 "Daha fazla müzisyeni desteklemeliyim!"
 fp2_yearly.8005.d:0 "Yeter! Şu lanet ağacı kestireceğim."
 fp2_yearly.8002.t:0 "Caiz"
 fp2_yearly.8002.desc:0 "İki çocuk [beached_whale_province.GetName] sahillerinde deniz kabuğu toplarken devasa bir ceset ile karşılaşmışlar. Sahile uğrayan sakinler ölü deniz yaratığının etinin hâlâ temiz olduğunu ve #italic oldukça#! lezzetli olduğunu söylüyor. Ama [preoccupied_ulama.GetCouncilTitle] [preoccupied_ulama.GetFirstName], konsey toplantısı sırasında beni endişeli bir şekilde kenara çekiyor.\n\n"Balina eti, biz [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] için caiz midir?", diyor. "Buna ben karar veremem. Görüşleri geçerli bir bilginin karar vermesini beklemeliyiz. Ama her ihtimale karşın insanların hayvanın etini yemesini yasaklamalısınız...""
 fp2_yearly.8002.a:0 "Evet ama #italic ben#! karar verebilirim."
 fp2_yearly.8002.b:0 "Bana şu etten biraz verin! Tadına bakmak #italic zorundayım#!."
 fp2_yearly.8002.c:0 "Pekâlâ, kararı bekleyelim."
 fp2_yearly.8002.d:0 "#italic Katiyen#! yenilmemeli. Bizzat gidip yakacağım."
 exploding_whale_toast:0 "Ceset gizemli bir şekilde patladı!"
 exploding_whale.tt:0 "Ceset patladı!"
 healthy_whale_toast:0 "Tadı oldukça güzeldi"
 unhealthy_whale_toast:0 "Bir şeyler yanlış..."
 fp2_yearly.8003.t:0 "Kuşlar Gibi Süzülmek"
 fp2_yearly.8003.desc:0 "Meşhur mucit [flying_polymath.GetFirstName], bana elinde odun ve kumaştan yapılma bir çift kanat ile oldukça tuhaf bir arzuhâlde bulunmaya geldi. \n\n"İnsanlar ezelden beri gökyüzünde uçmayı dilemiştir [ROOT.Char.Custom('FormOfAddressForLiege')|l]" diyor. "Bazı hesaplamalar yaptım. Uçabileceğimizi kanıtlayacağım! İzin verin [ROOT.Char.Custom('ResidenceBuilding')] içindeki en yüksek kuleden zıplayayım ve daha sonrasında size sadık bir şekilde hizmet edeyim." \n\nNe yazık ki [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('enthusiastic_child'))] [enthusiastic_child.GetTitledFirstName] bunu duymuş ve muciti uçarken izlemesine izin vermemi istiyor. "
 fp2_yearly.8003.a:0 "Pekâlâ, izin vereceğim."
 fp2_yearly.8003.b:0 "Ver şu kanatları bana - #italic ben#! uçacağım."
 fp2_yearly.8003.c:0 "Hayır, bu bir saçmalık."
 flight_attempt_toast.success:0 "Bir kartal gibi uçtunuz"
 flight_attempt_toast.failure:0 "Yere çakıldınız"
 fp2_yearly.8003_child_reaction:0 "[enthusiastic_child.GetFirstNameNoTooltip], buna nasıl tepki verecek bilmek mümkün değil."
 polymath_flight_attempt_toast.success:0 "[flying_polymath.GetFirstNameNoTooltip] uçtu!"
 polymath_flight_attempt_toast.failure:0 "[flying_polymath.GetFirstNameNoTooltip] yere çakıldı."
 fp2_yearly.8001.t:0 "Cortes"
 fp2_yearly.8001.desc:0 "[commoner_enthusiast.GetCouncilTitle] [commoner_enthusiast.GetTitledFirstName], ekonomik durum üzerine uzunca düşündü ve artık #italic cortes#! kurmanın vakti olduğunu düşünüyor. Cortes, özerk yönetimi olan yerlerin seçtiği kişilerin toplandığı ve saray konseyindeki tartışmalara dâhil olabildiği yeni bir meclis türü.\n\n"Bu ayrıcalık karşılığında", diyor ve ekliyor "şehirlerden daha fazla vergi alabiliriz. Ve gerçekten altına ihtiyacımız varsa, o kadar da aciz olmayan birkaç köylüyü bile alabiliriz ama bunu yapmanızı önermem zira bu soyluları oldukça hoşnutsuz kılabilir.""
 fp2_yearly.8001.a:0 "Şehirlerin temsilcilerini davet edin."
 fp2_yearly.8001.b:0 "Herkesi davet edin! Hem de #italic herkesi#!."
 fp2_yearly.8001.c:0 "Hayır, soylular en iyisini bilir, her zaman bildiğimiz gibi."
 fp2_flavor.8001_vassal_opinion:0 "Kendi ayrıcalıklarını gözeten vasallar bunu beğenmeyecek"
 fp2_yearly.8000.t:0 "Üzümü Yeme Bağını Yak"
 fp2_yearly.8000.desc_muslim_opening:0 "İberya'da üretilen kaliteli şarap buraya yerleşen inançlılar tarafından uzun yıllardır tüketiliyor. Yine de [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName], bunun sona ermesi gerektiğine karar vermiş.\n\n"Şarap #italic haramdır#!", diyor [hof_emissary.GetTitledFirstName] ve ekliyor "Bundan sonra üretimine de tüketimine de katiyen izin verilmeyecektir. Bundan mütevellit [vineyard_county.GetName] topraklarındaki üzüm bağlarını yakmalısınız."
 fp2_yearly.8000.desc_jewish_opening:0 "İberya'da üretilen kaliteli şarap buraya yerleşen atalarımız tarafından uzun yıllardır tüketiliyor. Yine de [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName], bunun sona ermesi gerektiğine karar vermiş.\n\n"Şarap koşer değildir", diyor [hof_emissary.GetTitledFirstName] ve ekliyor "Bundan sonra üretimine de tüketimine de katiyen izin verilmeyecektir. Bu yüzden [vineyard_county.GetName] topraklarındaki üzüm bağlarını yakmalısınız."
 fp2_yearly.8000.desc_jerez:0 "Ama [jerez_vineyards.GetNameNoTier] şehrinizdeki üzüm bağları tüm İberya'daki en iyileri olduğundan, kaybınızı anlıyoruz ve [vinoclast_caliph.GetTitleTierName], bu fedakârlığınızı asla unutmayacak. Ama ne olursa olsun, üzüm bağları yanmalı!""
 fp2_yearly.8000.desc_not_jerez:0 "[vinoclast_caliph.GetTitleTierName], durumun şarap üreticileri için etkisini anlıyor ama bir düşünün, açılan topraklar çok daha iyi ve haklı işler için kullanılabilir! Üzüm bağları yok edilmeli.""
 fp2_yearly.8000.a:0 "Kaliteli şaraba son mu verelim? [vinoclast_caliph.GetTitleTierName] delirmiş mi?"
 fp2_yearly.8000.b:0 "Geriye sadece külleri kalacak!"
 fp2_yearly.8000.c:0 "Hayır, şarap üreticilerini korumalıyım."
 fp2_struggle.1020.t:0 "Bir Konsey Üyesinin Ölümü"
 fp2_struggle.1020_desc_opening:1 "Felaket! [unrest_capital.GetNameNoTierNoTooltip] topraklarındaki kargaşa sırasında, konsey mensubum [minority_councillor.GetTitledFirstName], bir [minority_councillor.GetFaith.GetAdherentNameNoTooltip] olduğu için, bir grup öfkeli [unrest_capital.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] tarafından günah keçisi ilan edilmiş."
 fp2_struggle.1020_desc_beaten_by_mob:0 "[minority_councillor.GetNameNoTooltip], benim yanıma gelmek için yoldayken, öfkeli grup üstüne çullanmış ve linç etmişler.\n\n"
 fp2_struggle.1020_desc_burned_by_mob:0 "Gecenin köründe [ROOT.Char.Custom('ResidenceBuilding')] içine sızıp, onu bir kazığa bağlamış ve yakmışlar.\n\n"
 fp2_struggle.1020_desc_hanged_and_disemboweled_by_mob:0 "Bir konsey toplantısına gelmek için yoldayken yakalayıp, [ROOT.Char.Custom('ResidenceBuilding')] kapısına asmışlar ve iç organları yere dökülsün diye karnını yarmışlar.\n\n"
 fp2_struggle.1020_desc_crucified_by_mob:0 "[minority_councillor.GetNameNoTooltip], [unrest_capital.GetNameNoTierNoTooltip] topraklarındaki bir dostunu ziyaret ederken öfkeli grup onu yakalayıp çarmıha çivilemişler, kısa süre sonra da hayatını kaybetmiş.\n\n"
 fp2_struggle.1020_desc_defenestrated_by_mob:0 "Amansız bir öfke ile [ROOT.Char.Custom('ResidenceBuilding')] içine dalmışlar ve [minority_councillor.GetNameNoTooltip], ellerine geçtiği gibi bir camdan ölümüne fırlatmışlar.\n\n"
 fp2_struggle.1020_desc_molten_silver_by_mob:0 "Amansız bir öfke ile [minority_councillor.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom('ResidenceBuilding')] içindeki odasında istirahat ederken içeri dalmışlar ve mücevherlerini eritip boğazından aşağı akıtmışlar.\n\n"
 fp2_struggle.1020_desc_torn_to_pieces_by_mob:0 "[minority_councillor.GetNameNoTooltip], kaplıcalardan [ROOT.Char.Custom('ResidenceBuilding')] tarafına dönerken öfkeli grup üstüne çullanmış. Nefretlerinden gelen kuvvetleriyle onu çıplak ellerle parçalara ayırmışlar.\n\n"
 fp2_struggle.1020_desc_councillor_had_family:0 "Ailesi olanlar için beni suçluyor. [councillor_executor.Custom2('HerHisCharacterIntroduction', minority_councillor)|U] önümde duruyor ve [minority_councillor.GetDynastyName] hanesine yapılmış bu saygısızlık için af dilememi istiyor."
 fp2_struggle.1020_desc_councillor_had_no_family_faith:0 "Halkı olanlar için #italic beni #!suçluyor gibi gözüküyor. [minority_councillor.GetFaith.GetAdherentNameNoTooltip] topluluk liderlerinden [councillor_executor.GetTitledFirstName] ise [unrest_capital.GetNameNoTierNoTooltip] topraklarının [minority_councillor.GetFaith.GetAdherentNamePluralNoTooltip] halkına tazminat vermemi istiyor."
 fp2_struggle.1020.a:0 "[minority_councillor.GetDynastyNameNoTooltip] hanedanından af dile."
 fp2_struggle.1020.b:0 "Halk ile arayı düzelt."
 fp2_struggle.1020.c:0 "Suçluları bul."
 fp2_struggle.1020.d:0 "[unrest_capital.GetNameNoTierNoTooltip] topraklarında asayişi sağlamaları için askerleri gönder."
 fp2_yearly.8006.t:0 "Sikliba Yerleşimcileri"
 fp2_yearly.8006.desc:0 "Bir grup beyaz tenli #italic Sikliba#!, Avrupa'nın doğusundan gelen köle insanlar, [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('former_master'))] [former_master.GetTitledFirstName] hükmünden kaçmışlar. Ordu konusunda ne büyük işler başardıklarından ve haremi nasıl süslediklerinden biraz fazla bahsetseler de topraklarıma gelip özgürlüklerini kazanmak için ne tür tehlikelere göğüs gerdikleri apaçık ortada.\n\n"Hepimizin yaraları var." diyor liderleri [saqaliba_leader.GetFirstName]. "Vücudumuzda ya da çok daha derinde. Ancak güçlü ve azimliyiz. Kendi ata dilimizi rahatça konuşabileceğimiz, bize ait topraklar arzuluyoruz. [saqaliba_barony.GetName] topraklarına yerleşmemize izin verirseniz toprakları refaha kavuşturmak için var gücümüzle çalışacağız.""
 fp2_yearly.8006.a:0 "Seni vali bile yapabilirim..."
 fp2_yearly.8006.b:0 "Sen kalabilirsin ama dostların buradan gitmeli."
 fp2_yearly.8006.c:0 "Sizi efendinize geri göndereceğim."
 furious_rival_8006.desc:0 "Rakibiniz [former_master.GetTitledFirstNameNoTooltip], [saqaliba_county.GetName] topraklarında [Concept( 'claim', 'Hak İddiasını' )|E] bastırabilir"
 fp2_yearly.8006.flavor.b.tt:0 "İstemeyerek de olsa, [saqaliba_leader.GetFirstNameNoTooltip] sarayınızda kalıyor ve takipçilerini kaderlerine terk ediyor."
 fp2_yearly.8006.flavor.c.tt:0 "Sikliba zorla geri gönderiliyor."
 fp2_struggle.3001.t:0 "Savaşın Bedeli"
 fp2_struggle.3001.desc:0 "[struggle_3001_steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U], kasvetli bir yüz ifadesiyle odaya giriyor. "Efendim" diyor ve ekliyor "Cebimizde beş paramız yok. Böyle zamanlar tehlikelidir." Daha fazla bir şey söylemesine mahal vermeden ters bir bakış atıyorum. "Ama [ROOT.Char.Custom('FormOfAddressForLiege')|l]..." derken yavaş adımlarla odayı terk ediyorum."
 fp2_struggle.3001.desc_no_war_intro:0 "\n\nSahip olduğum tek şey bu taç. Bu taç ve onun verdiği sorumlulukları yerine getirmek. Tacı koruyacak zenginlik yoksa ona sahip olmanın ne anlamı var ki?"
 fp2_struggle.3001.desc_war_intro:0 "\n\nSahip olduğum tek şey bu taç. Bu taç ve onun verdiği sorumlulukları yerine getirmek. Yenildiğimde elimden kayıp gidecekse, ona sahip olmanın ne anlamı var ki?"
 fp2_struggle.3001.desc_outro:0 "Parmaklarımı tacıma götürdüğümde altının soğukluğunu hissediyorum.\n\nBuna iyi para verecek tüccarlar vardır..."
 fp2_struggle.3001.a:0 "Yapmam gerekeni yapacağım."
 fp2_struggle.3001.a_flavour:0 "Tacınızı kaybedeceksiniz."
 fp2_struggle.3001.b:0 "Ama şu diğer taç..."
 fp2_struggle.3001.c:0 "Bekle! Burada tacı olan tek kişi ben değilim."
 fp2_struggle.3001.c_flavour:0 "Eşiniz tacını kaybedecek."
 fp2_struggle.3001.d:0 "Bu taç ben ölene kadar başımın üstünde olacak!"
 struggle_3001_spouse_crown_modifier:0 "Tacı Satıldı"
 fp2_struggle.3011.t:0 "Yardıma Muhtaç Kadınlar"

 fp2_struggle.3011.desc:0 ""[ROOT.GetCharacter.GetLadyLord]'im! Akla hayale gelmeyecek bir şey oldu!" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nefesini toplamak için bir an duraksar, [struggle_3011_marshal.GetHerHis] alnı terle kaplı. "[struggle_3011_county_town.GetNameNoTier] hanımları şehri savunmak için kendileri silahlanmış.""

 fp2_struggle.3011.desc_men:0 ""[ROOT.GetCharacter.GetLadyLord]'im! Akla hayale gelmeyecek bir şey oldu!" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nefesini toplamak için bir an duraksar, [struggle_3011_marshal.GetHerHis] alnı terle kaplı. "[struggle_3011_county_town.GetNameNoTierNoTooltip] delikanlıları şehri savunmak için kendileri silahlanmış.""
 fp2_struggle.3011.desc_outro:0 "\n\n[bishop.GetTitledFirstName] odaya dalıyor. "Efendim aman, sakın izin vermeyin!" diye yakarıyor ve konuşmasına devam ediyor: "Savaşmalarına izin verirsek yakında toprak da isterler, o zaman çocukları kim yetiştirecek?"\n\n"Kılıç, kılıçtır," diyor [struggle_3011_marshal.GetFirstNameNoTooltip] net bir şekilde. "Siz de bana katılıyorsunuz değil mi, efendim?""
 fp2_struggle.3011.a:0 "Keşke tüm halkım topraklarımızı korumaya bu kadar istekli olsa!"
 fp2_struggle.3011.b:0 "Kadınların taşıması gereken tek şey bebekleridir."
 fp2_struggle.3011.b_men:0 "Erkeklerin taşıması gereken tek şey bebekleridir."
 fp2_struggle.3011.c:0 "Cadılar! #EMP Cadılar!#!"
 fp2_struggle.3011.d:0 "Ah zavallı hanımlar! Onları bu kötülükten kurtaracağım!"
 fp2_order_of_the_hachet_modifier:0 "Yardıma Muhtaç Değil"
 fp2_order_of_the_hachet_modifier_desc:0 "Bu kontluğun erkekleri ve kadınları savunmak için eşit hareket ediyor."
 fp2_punished_order_of_the_hachet_modifier:0 "Kadınlar Yardıma Muhtaç Edildi"
 fp2_punished_order_of_the_hachet_modifier_desc:0 "Bu kontluklarda süzerenlerinden izinsiz topraklarını savunanlar, saldıranlardan daha büyük zararı süzerenlerinden görüyor."
 fp2_struggle.3021.t:0 "Cennetin Öfkesi"
 fp2_struggle.3021.desc:0 "Kışlalara vardığımda [struggle_3021_knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U], suratında korku ile beni karşılıyor. [struggle_3021_courtier.GetTitledFirstName], ona yardım etmeye çalışıyor ve beni gördüğünde bir kaşını kaldırıyor.\n\n"En azından [Select_CString(ROOT.Char.IsFemale, 'Leydine', 'Lorduna' )] ne olduğunu söylemeyecek misin?"\n\n[struggle_3021_knight.GetFirstNameNoTooltip], hemen başını kaldırıyor. "E- Efendim... Görülmemesi gereken şeyler gördüm. Bazıları siperlerden siyah tozdan yapılmış taşlar fırlatıyordu. Taşlar alev aldı ve düşmanlarına çarparken gök gürültüsü gibi gürlediler. Efendim, bir adam ikiye ayrıldı!"\n\n[struggle_3021_courtier.GetFirstNameNoTooltip], ilgisini çekmiş bir şekilde kafasını sallıyor. "Belki... bu güce biz de sahip olabiliriz...""
 fp2_struggle.3021.a:0 "Kesinlikle araştırmaya değer."
 fp2_struggle.3021.b:0 "Bunun ne gibi tehlikeler açacağını kim bilebilir."
 fp2_struggle.3021.c:0 "Siyah toz diyorsun ha... yeni ve ateşli bir baharat."
 fp2_struggle.3021.d:0 "Bu ilahi bir cezalandırmadır!"
 fp2_struggle.3021.e:0 "Yıldırım tanrısı için yıldırım."
 bad_struggle_3021_courtier_desc:0 "[struggle_3021_courtier.GetTitledFirstName], araştırmasından ötürü ölüyor"
 good_struggle_3021_courtier_desc:0 "[struggle_3021_courtier.GetTitledFirstName], araştırmasında başarılı oluyor"
 bad_stone_research_title:0 "Çarpılmış"

 good_stone_research_title:0 "Başarılı Araştırma!"
 fp2_lightning_stones_modifier:0 "Yıldırım Taşları"
 stone_poisoning_discovered:0 "Geri Tepme"
 stone_poisoning_worked:0 "Ateşli Baharat"
 stone_poisoning_worked_desc:0 "Gizemli siyah tozu başarılı bir şekilde araştırdınız."
 fp2_lightning_stones_poison_modifier:0 "Siyah Toz Zehri"
 fp2_struggle.2000.t:0 "Düzensiz Pazar"
 fp2_struggle.2000.desc:0 "Pazar sokaklarında incelemelerde bulunurken, seyyar satıcılar arasında pazar düzenlemelerini uygulamaya çalışan endişeli bir muhtesip olan [fp2_2000_market_inspector.GetFullName] ile karşılaştım. "Düzensiz tezgâhlar, cami kapısının kenarında yağ, derisi yüzülmemiş tavşanlar ve kaselerde peynir! Allah'a yemin olsun ki şu anda beni dinlemezseniz çok kötü olur!"\n\nBu muhtesip, pazar düzenlemelerine uymayanları gerekirse şiddetle #emphasis cezalandırmalıdır#!. Ancak, açgözlü kör tüccarlar tarafından görmezden geliniyor.\n\nOna yardım etmek için ne yapabilirim?"
 fp2_struggle.2000.a:0 "Olaylara müdahale ederek bir kadı çağırmakla tehdit et."
 fp2_struggle.2000.a.desc:0 "Muhtesip sapkın tacirlerin hatalarını düzeltir,\nKadı ise hükümlere göre cezalandırır"
 fp2_struggle.2000.a.a:0 "Tüccarlar sözünüze uyuyor ancak ikna olmuyorlar"
 fp2_struggle.2000.a.a.notif:0 "Yükselen Bürokrasi"
 fp2_struggle.2000.a.b:0 "Durumu medeni bir şekilde çözersiniz"
 fp2_struggle.2000.a.b.notif:0 "Kabul Edilebilir Uzlaşma"
 fp2_struggle.2000.b:0 "Hepsine sert bir azar çek!"
 fp2_struggle.2000.b.desc:0 "Tüccarın fiziksel cezasının sorumluluğunu üzerime alıyorum."
 fp2_struggle.2000.b.notif:0 "Çalışkanlık Gösterisi"
 fp2_struggle.2000.b.notif.desc:0 "Bir muhtesibin azarlandığını gören tüccarlar, çabucak pazarı boşalttı."
 fp2_struggle.2000.d:0 "Kurallar neden ticaretin önüne geçsin?"
 fp2_struggle.2000.d.desc:0 "Kural endişesi olmadan ticarete izin vermek ticareti arttıracak ancak yavaş yavaş piyasayı istikrarsızlaştıracaktır"
 fp2_struggle.2000.e:0 "Bu itaatsizliğe katlanmayacağım! Muhafızlar!"
 fp2_struggle.2000.f:0 "Madem hazırız, neden biz de bir genelev inşa etmiyoruz?"
 fp2_struggle.2000.f.desc:0 "Gerginliği azaltmak için tüccarları ihtisabı daha fazla ihlal etmeye teşvik ediyorsunuz"
 fp2_struggle.2000.f.notif:0 "Yabancı Tüccarlara Hoşgörü"
 fp2_struggle.2000.f.notif.desc:0 "Pazar ihlalleri sadece şimdilik arttı, muhtesip düzenlemeleri uygulamaktan vazgeçti"
 fp2_struggle.2001.t:0 "Terkedilmiş Köy"
 fp2_struggle.2001.desc:0 "[ROOT.GetCharacter.Custom('FortifiedBuilding')|U] topraklarımı gezerken bir yaşlı köylü yanıma yaklaşıyor.\n\n"Ulu [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )], lütfen bize merhamet edin ve köyümüzü [fp2_2001_desperate_county.GetHolder.GetName] ve onun zulmünden kurtarın. Yerleşimimizi çok uzun süre boyunca ihmal etti. Halk yeni bir hükümdarın özlemini çekiyor, sizi özlüyorlar [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )].""
 fp2_struggle.2001.desc.extra.a:0 "[fp2_2001_desperate_county.GetName|U] toprakları müttefikiniz [fp2_2001_desperate_county.GetHolder.GetName] tarafından yönetiliriyor. İsyancılara askerî destek sağlamak bir saldırganlık eylemi olacaktır.\n\n"
 fp2_struggle.2001.desc.extra.b:0 "[fp2_2001_desperate_county.GetName] topraklarının sahibi [fp2_2001_desperate_county.GetHolder.GetName] ile mevcut barış anlaşmanız bulunuyor. Köylülere yardım etmek bu anlaşmanın ihlali olur."
 fp2_struggle.2001.a:0 "Söz veriyorum, [fp2_2001_desperate_county.GetNameNoTierNoTooltip] topraklarını özgürleştireceğiz!"
 fp2_struggle.2001.a.desc:0 "#bold Beş yıl#! içinde [fp2_2001_desperate_county.GetNameNoTier] topraklarını elegeçirmeniz bekleniyor"
 fp2_struggle.2001.a.a.desc:0 "Başarısız olursanız [2001_scoped_chaplain.GetTitledFirstName] büyük ölçüde hayal kırıklığına uğrayacak"
 fp2_struggle.2001.a.notif:0 "Hak İddianız Verildi"
 fp2_struggle.2001.b:0 "Bunun için dininden vazgeçmeye razı mısın?"
 fp2_struggle.2001.b.desc:0 "#bold On yıl#! içinde [fp2_2001_desperate_county.GetNameNoTier] topraklarını ele geçirmeniz bekleniyor"
 fp2_struggle.2001.b.notif:0 "[fp2_2001_desperate_county.GetNameNoTierNoTooltip] toprakları [ROOT.Char.GetFaith.GetNameNoTooltip] dinine çevrilecek"
 fp2_struggle.2001.b.notif.desc:0 "İster kendi özgür seçimleriyle olsun ister çaresizliklerinden, [fp2_2001_desperate_county.GetNameNoTier] toprakları [ROOT.Char.GetFaith.GetName] dinini benimsedi"
 fp2_struggle.2001.c:0 "Verdiğiniz kararı bana kanıtlayın, silahlarınızı kuşanın ve [fp2_2001_desperate_county.GetHolder.GetFirstNameNoTooltip] adamlarının karşısına geçin!"
 fp2_struggle.2001.d:0 "Belki de yeni [Select_CString(ROOT.Char.IsFemale, 'leydinize', 'lordunuza' )] haraç ödeyerek başlayabilirsiniz..."
 fp2_struggle.2001.d.notif:0 "Çaresiz Köylüler Kurtuluş Bedelini Ödüyor"
 fp2_struggle.2001.d.notif.desc:0 "[fp2_2001_desperate_county.GetName|U] köylüleri, kurtuluşun bedelini ödemek için sahip oldukları değerli her şeyi bir araya getirdiler"
 fp2_struggle.2001.e:0 "Üzgünüm ancak kendi başınızın çaresine bakmak zorundasınız."
 fp2_struggle.2001.e.desc:0 "[fp2_2001_desperate_county.GetHolder.GetName] ve onun yönetimi altında köylüleri kaderlerine terk ettiniz."
 fp2_struggle.2001.f:0 "[fp2_2001_desperate_county.GetHolder.GetTitleAsNameNoTooltip] benim desteğime sahip ve ihanetinizi ona bildireceğim!"
