 fp2_other_decisions.1000.t:0 "$secure_iberian_foothold_decision_title$: [iberian_footholder.GetPrimaryTitle.GetAdjectiveNoTooltip] Bütünleşmesi"

 fp2_other_decisions.1000.involved_religion:0 "İberya'nın huysuz prensliklerinin savaşları, bölgenin [ROOT.Char.GetFaith.GetReligion.GetAdjective] krallıklarını neredeyse dize getirdi.\n\nEğer müdahale etmeseydi, [ROOT.Char.GetFaith.HighGodNamePossessive] müminleri nihayetinde kâfirler tarafından yarımadadan sürülecekti.\n\n"

 fp2_other_decisions.1000.desc:0 "İberya'nın bölünmüş mezhepleri ve halkları birbirleri ile savaşmakla o kadar meşguller ki [ROOT.Char.GetFaith.GetReligion.GetAdjective] istilasına karşı koyamayacakları bir fırsat yakaladık."
 fp2_other_decisions.1000.involved_faith:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] koruması altında güvende olan, batıdaki [ROOT.Char.GetFaith.GetAdherentName] inancının meşru savunucularıyız."
 fp2_other_decisions.1000.uninvolved_faith:0 "[ROOT.Char.GetFaith.GetName] aydınlığını getirmek bizim üzerimize düştü; [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] sınırları içindeyken bu topraklar bir kez daha refah ve huzur dolu olacak."
 fp2_other_decisions.1000.closing:0 "\n\nSahte tanrılarının devrinin sona erdiğini görecekler ve [ROOT.Char.GetFaith.HighGodNamePoessessive] bölgenin kurtuluşunu [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ile getirdiği gördüklerinde sevinecekler."

 fp2_other_decisions.1000.a:0 "İberya'ya yeni bir kan gerekiyordu."

 fp2_other_decisions.1001.involved_religion:0 "İberyalı Hristiyanlar ve Mağribiler arasındaki yüzyıllarca süren savaştan sonra, zorba [iberian_footholder.GetPrimaryTitle.GetAdjective] mücadelemize müdahale etti.\n\n"

 fp2_other_decisions.1001.desc:0 "Oyalama, kıskançlık ve ihmalkârlık ile biz İberyalılar, [iberian_footholder.GetPrimaryTitle.GetAdjective] müdahillerinin anavatanımızı bölmesine ve yarımadanın tarihi krallıklarını işgal etmesine izin verdik."

 fp2_other_decisions.1001.involved_faith:0 "[iberian_footholder.GetTitledFirstName] zaferlerini, İberya'nın zor durumdaki [iberian_footholder.GetFaith.GetAdjectiveNoTooltip] krallıkları üzerindeki meşruiyetinin kanıtı olarak kullanarak kendisini yarımadanın meşru [iberian_footholder.GetFaith.GetReligion.GetAdjective] lideri ilan etti."

 fp2_other_decisions.1001.same_uninvolved_faith:0 "[iberian_footholder.GetFaith.GetName] yolundan çıktığımız için [ROOT.Char.GetFaith.HighGodName] tarafından cezalandırıldığımız ve [ROOT.Char.GetFaith.GetReligion.GetAdjective] İberya'nın meşru liderinin [iberian_footholder.GetTitledFirstName] olduğu iddia ediliyor..."

 fp2_other_decisions.1001.uninvolved_faith:0 "[iberian_footholder.GetTitledFirstName] kazandığı zaferlerle [iberian_footholder.GetFaith.GetAdjective] inancını gerçek [iberian_footholder.GetFaith.GetReligion.GetAdjective] yolu olarak ilan etti. Tüm yarımadayı [iberian_footholder.GetFaith.HighGodNamePossessive] hükmü altında birleştirecekmiş."

 fp2_other_decisions.1001.closing:0 "\n\n[iberian_footholder.GetTitledFirstName] konumunu sağlamlaştırırken, Müslümanların ve Hristiyanların geçmişteki farklılıkları [iberian_footholder.GetFaith.GetAdjective] işgali karşısında kaybolmaya başlıyor..."
 fp2_other_decisions.1001.a:0 "Her işe de burnunu sokuyor bunlar."
