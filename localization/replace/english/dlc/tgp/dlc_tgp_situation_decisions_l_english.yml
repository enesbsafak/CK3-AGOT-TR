 favor_dynastic_cycle_era_hegemon_desc: "Devletin yükleri omuzlarımda ağırlaşıyor. [mandate_of_heaven|E] olmak ve ülkeyi ayakta tutmak benim görevim. [GetSituation('dynastic_cycle').GetName] çarkları, aldığım her kararla kaçınılmaz bir biçimde dönüyor. Gök kubbenin altında yaşayan herkesin geleceği ellerimde, geleceğimiz barış ve refah mı olacak, yoksa kazanılan zaferler ve boyun eğdirilen yabancı hükümdarlar mı?"
 favor_dynastic_cycle_era_chaos_desc: "Bir gün [mandate_of_heaven|E] olmanın kutsal sorumluluğunu kabul edeceksem, bir hükümdar gibi davranmalı ve Gök kubbenin altındaki tüm toprakların efendisi olarak bana bakacak kalabalıkların kaderini düşünmeliyim. O gün gelirse hayır, #EMP o gün geldiğinde#! onların geleceği barış ve refah mı olacak, yoksa kazanılan zaferler ve boyun eğdirilen yabancı hükümdarlar mı?"
