l_english:
 tgp_dynastic_cycle_events.0001.t: "İleriye Doğru Yol"
 tgp_dynastic_cycle_events.0001.desc: "Bahçe durgun; yalnızca esen rüzgârda yaprakların hışırtısı duyuluyor. Bu sessizlikte, düşüncelerim [my_situation.GetTopCurrentPhase.GetName|l] çağında ülkenin hâline kayıyor.\n\nSadece dayanmak yeterli mi? Ülke, bu bahçe kadar durgunken ayakta kalabilir mi?\n\nHizmetkârımın tepsisindeki çay çoktan soğuyor."
 tgp_dynastic_cycle_events.0001.aa: "[my_movement.GetNameNoTooltip] aydınlanma getirecek!"
 tgp_dynastic_cycle_events.0001.a: "Vakti gelince dostlara ihtiyacım olacak..."
 tgp_dynastic_cycle_events.0001.a.potential_friend: "#EMP Güvenilir [potential_friend.GetTitledFirstNameNoTooltip] için bir mektup yazmalıyım#!\n"
 tgp_dynastic_cycle_events.0001.a.friend: "#EMP Sevgili [friend.GetTitledFirstNameNoTooltip] için bir mektup yazmalıyım#!\n"
 tgp_dynastic_cycle_events.0001.b: "İlerleme zamanı #EMP geldi#!."
 tgp_dynastic_cycle_events.0001.c: "Gelecekte yaşayamayız."
 friend_together_in_preparation: "[CHARACTER.GetShortUIName], ülke yeniden istikrara kavuştuğunda birlikte olacaklarına dair [TARGET_CHARACTER.GetShortUIName] için bir mektup gönderdi."
 friend_together_in_preparation_corresponding: "[TARGET_CHARACTER.GetShortUIName], ilerleme geldiğinde birlikte olacaklarına dair [CHARACTER.GetShortUIName] tarafından bir mektup aldı."
 tgp_advancement_focus_modifier: "İlerlemeye Odaklanma"
 tgp_advancement_focus_modifier_desc: "Bu karakter, genişlemeci uğraşları bir kenara bırakıp ülkesini ilerletmeye odaklanıyor."
 tgp_dynastic_cycle_events.0010.t: "Baskı Altında"
 tgp_dynastic_cycle_events.0010.desc: "Neferim [disciple.GetTitledFirstName] beni ziyarete geliyor ama gelişi sevinçli bir sebepten değil.\n\n"Üstat... ülke fırtınadaki bir gemi gibi savruluyor. Her gün yeni bir anlaşmazlık, yeni düşmanlar getiriyor. [my_situation.GetTopCurrentPhase.GetName] büyüyor. Yarın nasıl olacak, neler olacak... bilmiyorum." \n\nEllerinin titrediğini fark etmemem mümkün değil."
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0010.a [AGOT: ]
 tgp_dynastic_cycle_events.0010.a: ""I will not have them say that [ROOT.Char.GetFirstNamePossessiveNoTooltip] disciple is a weakling!""
 tgp_dynastic_cycle_events.0010.b: "Zavallı çocuk. Onu teselli etmeliyim."
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0010.c [AGOT: ]
 tgp_dynastic_cycle_events.0010.c: ""Through hardship is how you learn.""
 tgp_dynastic_cycle_events.0020.t: "Açlığın Cüretkâr Eli"
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0020.desc [AGOT: ]
 tgp_dynastic_cycle_events.0020.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ill news." My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetName] approaches me, [marshal.Custom('quirk_pos_pp')].\n\n"In the dead of night, the peasants of [peasant_county.GetName] forced open the grain stores. If I could hire more guards we may be able to still find them."\n\nEven our realm is not safe from [my_situation.GetTopCurrentPhase.GetName]."
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0020.a [AGOT: ]
 tgp_dynastic_cycle_events.0020.a: ""My agents will find them. And #EMP end#! them.""
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0020.b [AGOT: ]
 tgp_dynastic_cycle_events.0020.b: ""Hire those guards!""
 tgp_dynastic_cycle_events.0020.c: "Çaresiz insanlar çaresiz şeyler yapar."
 tgp_executed_peasants_county_modifier: "İdam Edilmiş Köylüler"
 tgp_executed_peasants_county_modifier_desc: "Bu kontluk, aç köylülerine reva görülen muameleyi unutmuyor."
 tgp_dynastic_cycle_events.0030.t: "Yol Değişimi"
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0030.desc [AGOT: ]
 tgp_dynastic_cycle_events.0030.desc: ""The time of [my_situation.GetTopCurrentPhase.GetName] is #EMP now#!!"\n\nMy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetNamePossessive] thundering strides announce [marshal.GetHerHis] presence better than words.\n\n"I admire your dedication to the civilian path, but [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] demmands boldness! Remember the story of [ROOT.Char.Custom('GetRandomAnnalsPassage')] and lead the way for our armies!""
 tgp_dynastic_cycle_events.0030.a: "Cesur olma vakti!"
### TODO AGOT-ONLY: tgp_dynastic_cycle_events.0030.b [AGOT: ]
 tgp_dynastic_cycle_events.0030.b: ""I am eager to learn, but not to change.""
 tgp_dynastic_cycle_events.0030.c: "Sivil valilikten daha yüce bir onur yok."
 tgp_dynastic_cycle_events.0050.t: "Lütfun El Değiştirmesi"
 tgp_dynastic_cycle_events.0050.desc: "[favored_movement.GetName] tahttaki tutuşu sıkılaşıyor; öğütleri, siyaseti kendi isteklerine göre biçimlendiriyor.\n\nDavamda ilerleyeceksem, itibarlarını zayıflatmam gerekiyor. Aleni bir münazara sarayın hükmünü, belki de hükümdarımızın fikrini bile değiştirebilir.\n\nAma onlara meydan okumak; sözlerim sendelediğinde, aşağılanma riskini göze almak demek."
 tgp_dynastic_cycle_events.0050.a: "Şüphe etme lüksüm yok."
 tgp_dynastic_cycle_events.0050.b: "[my_movement.GetNameNoTooltip] kendi erdemiyle öne çıkar."
 tgp_dynastic_cycle_events.0050.c: "Hareket uğruna neden kendi haysiyetimi riske atayım?"
