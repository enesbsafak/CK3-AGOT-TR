 game_concept_movement_desc: "Ortak çıkarları ve [dynastic_cycle|E] vizyonunu paylaşan [characters|E] topluluğudur. Her Hareket üyesi, döngüyü etkilemek için farklı [interactions|E] ve [Concept('decisions', 'Kararlara')|E] erişebilir. Bir [movement_leader|E], [Concept('son_of_heaven','Göklerin Oğlu')|E] nezdinde [Concept('movement','Hareketin')|E] çıkarlarını temsil eden sözcüdür."
 game_concept_movement_power: "Hareket Gücü"
 game_concept_movement_power_i: "@movement_power_icon!"

