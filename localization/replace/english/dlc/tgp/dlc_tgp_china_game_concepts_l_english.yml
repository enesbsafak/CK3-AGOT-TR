 game_concept_minister_of_rites_desc:0 "$game_concept_minister_of_rites$, dinî ve manevi işlerden sorumlu [Concept('minister', 'Bakandır')|E] ve [Concept('governors', 'Valilere')|E] [examination|E] düzenlemelerinde yardımcı olabilir.\n\n$minister_of_rites_action_breakdown$"
 game_concept_minister_of_rites_possessive: "$councillor_court_chaplain_celestial_government_imperial_possessive$"
 minister_of_rites_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$[GetGreatProjectType('minister_project_culture').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[Concept('vassals', 'Vasallara')|E] [examination|E] düzenlemelerinde yardımcı olmak\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek\n$BULLET$[faith_hostile|E] veya [faith_evil|E] [Concept('faiths', 'Mezheplere')|E] mensup [characters|E] üzerinde #V $demand_conversion_minister_rites_interaction$#! etkileşimini kullanmak#!#!"
 game_concept_minister_of_war: "$minister_war$"

 game_concept_minister_of_war_desc:0 "$game_concept_minister_of_war$, askerî idare ve birliklerin yönetiminden sorumludur. Bağlı [governors|E] askerî yardıma ihtiyaç duyduğunda, onlara Askerî Valiler gönderen kişi bu bakandır.\n\nBakan aktif bir [commander|E] değildir ve birlikleri komuta etmez, bu görev [minister_grand_marshal|E] tarafından gerçekleştirilir.\n\n$minister_of_war_action_breakdown$"
 game_concept_minister_of_war_possessive: "$minister_war_possessive$"
 minister_of_war_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$#V $celestial_request_military_aid_interaction$#! etkileşimini kullanabilen [Concept('vassals', 'Vasallara')|E] [Concept('war', 'Savaşlarında')|E] yardım etmek\n$BULLET$[Concept('military_governors', 'Askerî Valilere')|E] diğer [Concept('governors', 'Valilerin')|E] [Concept('wars', 'Savaşlarına')|E] katılmalarını emretmek\n$BULLET$[GetGreatProjectType('minister_project_train_troops').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$#V $pay_treasury_debt_interaction$#! [Concept('interaction', 'Etkileşimi')|E] aracılığıyla [Concept('military_governors', 'Askerî Valilerin')|E] [Concept('treasury_debt', 'Hazine Borcunu')|E] ödeyerek #V '$catalyst_cleared_treasury_debt$'#! [Concept('dynastic_cycle_catalyst', 'Hanedan Döngüsü Tetikleyicisini')|E] tetiklemek\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek#!#!"
 game_concept_minister_of_justice: "$minister_justice$"

 game_concept_minister_of_justice_desc:0 "$game_concept_minister_of_justice$, hukuk işlerinden sorumlu [Concept('minister', 'Bakandır')|E] ve [Concept('son_of_heaven','Göklerin Oğluna')|E] adil bir yönetim sürdürmesinde yardımcı olur.\n\n$minister_of_justice_action_breakdown$"
 game_concept_minister_of_justice_possessive: "$minister_justice_possessive$"
 minister_of_justice_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$[GetGreatProjectType('minister_project_establish_control').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[vassals|E] ve [courtiers|E] üzerinde, reddedilemeyecek şekilde #V $imprison_interaction$#! [Concept('interaction', 'Etkileşimini')|E] kullanmak\n$BULLET$[crime|E] işlemiş [characters|E] üzerinde #V $pardon_interaction$#! [Concept('interaction', 'Etkileşimini')|E] kullanmak\n$BULLET$$censor_find_secrets_interaction$ [Concept('interaction', 'Etkileşimini')|E] kullanarak [vassal|E] [Concept('courts', 'Saraylarında')|E] [secrets|E] bulmak ve bilinen [Concept('criminals', 'Suçluları')|E] [Concept('imprison', 'Hapsetmek')|E] veya affetmek\n$BULLET$[secret|E] açığa çıkararak $catalyst_minister_exposed_secret$ [Concept('dynastic_cycle_catalyst', 'Hanedan Döngüsü Tetikleyicisini')|E] tetiklemek\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek#!#!"
 game_concept_minister_of_works: "$minister_works$"

 game_concept_minister_of_works_desc:0 "$game_concept_minister_of_works$, [Concept('realm','Ülke')|E] genelindeki inşaat ve kalkınmadan sorumludur ve [Concept('great_projects','Büyük Projeler')|E] başlatabilir.\n\n$minister_of_justice_action_breakdown$"
 game_concept_minister_of_works_possessive: "$minister_works_possessive$"
 minister_of_works_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$[GetGreatProjectType('minister_project_development').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[GetGreatProjectType('grand_canals').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[GetGreatProjectType('great_wall').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[realm|E] içinde [buildings|E] ve [holdings|E] inşa etmek\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] [Concept('dynastic_cycle_era_short', 'Devrinde')|E] [Concept('son_of_heaven', 'Göklerin Oğlunun')|E] [Concept('tributaries', 'Haraçgüzarlarının')|E] topraklarında [buildings|E] ve [holdings|E] inşa etmek\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek#!#!"
 game_concept_grand_secretariat_director: "Genel Sekreter"
 game_concept_grand_secretariat: "Büyük Sekreterlik"
 game_concept_grand_secretariat_possessive: "Büyük Sekreterliğin"

 game_concept_grand_secretariat_director_desc:0 "Genel Sekreter, [Concept('son_of_heaven','Göklerin Oğlu')|E] için bir tür [Concept('diarch', 'Diarktır')|E] ve yüce hükümdara [realm|E] yönetiminde yardımcı olur.\n\nSekreterin kim olacağı, yürürlükteki [GetLawGroup('grand_secretariat_laws').GetName|V] [Concept('law','Yasasına')|E] bağlıdır. Bu görev [minister_grand_chancellor|E], [minister_grand_marshal|E] veya [minister_censor|E] tarafından üstlenilebilir.\n\nSekreter, belirli [ministers|E] ve Göklerin Oğlu tarafından başlatılabilen birçok [Concept('great_projects','Büyük Projeyi')|E] başlatma yetkisine sahiptir."
 game_concept_ministry_obligation: "Bakanlık Yükümlülüğü"
 game_concept_ministry_obligations: "Bakanlık Yükümlülükleri"
 game_concept_ministry_obligations_desc: "$game_concept_ministry_obligations$, yalnızca [ministers|E] için geçerli özel bir [Concept('vassal_obligations', 'Vasal Yükümlülükleridir')|E].\n\nTüm sivil bakanların varsayılan bir seçeneği vardır, [minister_grand_marshal|E] ise ona [title_men_at_arms|E] sağlayan kendine özgü bir seçeneğe sahiptir.\n\nBu yükümlülükler değiştirilemez."
 game_concept_civilian_career_path: "Sivil Kariyer Yolu"
 game_concept_civilian_career_path_i: "@celestial_standard_administration!"
 game_concept_civilian_career_path_desc: "[Concept('civilian_career_path','Sivil Kariyer Yolunu')|E] izleyen [rulers|E], askerî kurnazlıktan ziyade idarî becerilere odaklanır. Sivil bölgelerde görevlendirilirler ve [Concept('buildings','Binalar')|E] inşa ederek topraklarını geliştirir, [Concept('taxes','Vergileri')|E] arttırarak [Concept('liege', 'Süzerenlerine')|E] ödedikleri pay üzerinden gösterdikleri başarıya göre [Concept('merit','Liyakat')|E] kazanırlar."
 game_concept_civilian_career: "Sivil Kariyer"
 game_concept_civilian_career_short: "Sivil"
 game_concept_military_career_path: "Askerî Kariyer Yolu"
 game_concept_military_career_path_i: "@celestial_military_administration!"
 game_concept_military_career_path_desc: "[Concept('military_career_path','Askerî Kariyer Yolunu')|E] izleyen [rulers|E], idarî işlerden ziyade savaş sanatına ve askerî becerilere odaklanır. Askerî bölgelerde görevlendirilirler ve [Concept('title_men_at_arms','Unvan Düzenli Askerleri')|E] toplama ve onların masraflarını karşılama yeteneklerine göre [Concept('merit','Liyakatleri')|E] artar."
 game_concept_military_career: "Askerî Kariyer"
 game_concept_military_career_short: "Askerî"
 game_concept_civilian_governor: "Sivil Vali"
 game_concept_civilian_governors: "Sivil Valiler"
 game_concept_civilian_governor_short: "Sivil"
 game_concept_civilian_governor_desc: "Bir Sivil Vali, sivil [Concept('vassal_obligations','vassal yükümlülüklerine')|E] sahip bir [Concept('governor', 'Validir')|E]. [Concept('military_governors', 'Askerî Valilerin')|E] aksine [title_men_at_arms|E] çıkaramaz ve yalnızca idarî işlere, yönettikleri toprakları geliştirmeye odaklanırlar.\n\n[civilian_career_path|E] izleyen [characters|E], Sivil Vali olabilir."
 game_concept_military_governor: "Askerî Vali"
 game_concept_military_governors: "Askerî Valiler"
 game_concept_military_governor_short: "Askerî"
 game_concept_military_governor_desc: "Bir Askerî Vali, askerî [Concept('vassal_obligations','vassal yükümlülüklerine')|E] sahip bir [Concept('governor', 'Validir')|E]. [Concept('civilian_governors', 'Sivil Valilerden')|E] farklı olarak [title_men_at_arms|E] çıkarabilir ve bunları [Concept('realm','ülkeyi')|E] dış istilalardan korumak veya askerî yardıma ihtiyaç duyan diğer valilere destek olmak için kullanabilirler.\n\n[military_career_path|E] izleyen [characters|E], Askerî Vali olabilir."
 game_concept_great_project: "Büyük Proje"
 game_concept_great_projects: "Büyük Projeler"
 game_concept_great_project_i: "@great_project_icon!"
 game_concept_great_project_possessive: "Büyük Projenin"
 game_concept_great_project_desc: "Büyük Projeler, [Concept('realm','Ülkenin')|E] tüm kaynaklarını seferber eden büyük girişimlerdir.\n\nBazı Büyük Projeler bir [Concept('great_building','Büyük Bina')|E] inşa etmeyi içerirken, bazıları bir [Concept('natural_disaster','Doğal Felaketten')|E] kurtulmayı amaçlar.\n\n[ruler|E] projeyi denetlerken, [subjects|E] projeye destek olmak için [Concept('great_project_contributions','Katkılar')|E] sunabilir."
 game_concept_great_project_contribution: "Katkı"
 game_concept_great_project_contributions: "Katkılar"
 game_concept_great_project_contribute: "Katkıda Bulun"
 game_concept_great_project_contributed: "Katkıda Bulundu"
 game_concept_great_project_contribution_desc: "Katkılar, birden fazla [Concept('rulers', 'Hükümdarın')|E] bir [Concept('great_project', 'Büyük Projenin')|E] gelişimine yardımcı olmasını ve karşılığında çeşitli faydalar elde etmesini sağlar.\n\nBazı katkılar, Büyük Projenin başlaması için zorunludur, bazıları ise isteğe bağlıdır. İsteğe bağlı katkılar, ilerleme başladıktan sonra da belirli bir süreye kadar yapılabilir."
 game_concept_great_project_contributor: "Katkı Sağlayan"
 game_concept_great_project_contributors: "Katkı Sağlayanlar"
 game_concept_great_project_contributor_possessive: "Katkı Sağlayanın"
 game_concept_great_project_contributors_possessive: "Katkı Sağlayanların"
 game_concept_great_project_contributor_desc: "Katkı Sağlayanlar, bir [great_project|E] için en az bir [great_project_contribution|E] masrafını üstlenmeyi taahhüt eden [Concept('rulers', 'Hükümdarlardır')|E] ve karşılığında çeşitli faydalar kazanırlar.\n\n[Concept('great_project_contributions', 'Katkıların')|E] çoğuna [Concept('realm', 'Ülkedeki')|E] herhangi bir [subject|E] katkı sağlayabilir."
 game_concept_dynastic_cycle: "Hanedan Döngüsü"
 game_concept_dynastic_cycle_possessive: "Hanedan Döngüsünün"
 game_concept_dynastic_cycle_desc: "$game_concept_dynastic_cycle$, Çin İmparatorluğunun toplumsal ve siyasî durumunu betimler, bu durum istikrar, kargaşa ve kaos [Concept('situation_dynastic_cycle_phases','devirleri')|E] arasında döngüsel biçimde akar.\n\n$game_concept_dynastic_cycle$nün anahtarı, İmparator'un sahip olduğu bir tür [Concept('legitimacy','Meşruiyet')|E] olan [Concept('mandate_of_heaven', 'Göklerin Buyruğudur')|E]. Bu buyruk kaybedilirse, Çin İmparatorluğu #N parçalanır#! tâ ki Göklerin Oğlu olmaya lâyık biri tarafından yeniden birleştirilene dek.#!"

