 game_concept_disciples: "Neferler"
 game_concept_disciple_possessive: "Neferin"
 game_concept_disciples_possessive: "Neferlerin"
 game_concept_disciple_desc: "$game_concept_disciples$, bir [Concept('elder','Bilgenin')|E] öğretilerini belirli bir [disciple_limit_short|E] dâhilinde takip eden [Concept('characters', 'Karakterlerdir')|E].\n\n#high $request_mentoring_interaction$#! [Concept('character_interaction', 'Etkileşimi')|E] #weak (Plan)#! aracılığıyla [Concept('skills', 'Becerilerini')|E] geliştirebilirler, ayrıca #high $celestial_request_elders_support_interaction$#! [Concept('character_interaction', 'Etkileşimi')|E] ile [gold|E], [courtiers|E] ve daha fazlasını elde edebilirler.\n\n$disciple_elder_benefits_tt$"

 disciple_elder_benefits_tt:0 "Bir $game_concept_disciple$ ile bir [elder|E]:\n$BULLET_WITH_TAB$Daha fazla [merit|E] kazanır\n$BULLET_WITH_TAB$Birbirlerine karşı [hostile_schemes|E] kullanma olasılıkları azalır\n$BULLET_WITH_TAB$Birbirlerinden gelen [interaction|E] tekliflerini kabul etme olasılıkları artar\n$BULLET_WITH_TAB$Birbirlerine dostane [interactions|E] kullanma eğilimindedirler #weak (örneğin $gift_interaction$, $invite_to_council_position_interaction$ vb.)#!\n$BULLET_WITH_TAB$Her ikisi de $game_concept_elder_possessive$ [Concept('movement', 'Hareketine')|E] mensuptur."
 game_concept_disciple_limit: "Nefer Sınırı"
 game_concept_disciple_limit_short: "Sınır"
 game_concept_disciple_limit_desc: "$game_concept_disciple_limit$, bir [Concept('elder', 'Bilgenin')|E] aynı anda sahip olabileceği [disciple|E] sayısını belirler.\n\nVarsayılan sınır [EmptyScope.ScriptValue('disciples_limit_base_value')|V0] olmakla beraber, [Concept('domicile', 'Konutun')|E] belirli [Concept('domicile_buildings','Konut Binalarıyla')|E] geliştirilmesiyle bu sınır arttırılabilir."
 game_concept_elder: "Bilge"
 game_concept_elders: "Bilgeler"
 game_concept_elder_possessive: "Bilgenin"
 game_concept_elders_possessive: "Bilgelerin"
 game_concept_elder_desc: "$game_concept_elder$, bir veya daha fazla [Concept('disciples', 'Nefere')|E] sahip olan, öğretilerinin takip edildiği [Concept('character', 'Karakterdir')|E].\n\n$disciple_elder_benefits_tt$"
 game_concept_disaster: "Felaket"
 game_concept_disasters: "Felaketler"
 game_concept_natural_disaster: "Doğal Felaket"
 game_concept_natural_disasters: "Doğal Felaketler"
 game_concept_disaster_desc: "$game_concept_natural_disasters$, [Concept('floods','Seller')|E] ve [Concept('earthquakes','Depremler')|E] gibi olayları kapsar.\n\nBir $game_concept_natural_disaster$, etkilenen [Concept('counties', 'Kontluklarda')|E] birçok [Concept('characters', 'Karakterin')|E] ölümüne yol açar ve felaketin şiddetine bağlı olarak [development|E], [county_opinion|E] ve [control|E] üzerinde ciddi olumsuz etkiler bırakır.\n\nBir $game_concept_natural_disaster$in yarattığı tahribat, bir Yardım [Concept('great_project', 'Projesinin')|E] tamamlanmasıyla giderilebilir ve toprak yeniden canlandırılabilir."
 game_concept_earthquake: "Deprem"
 game_concept_earthquakes: "Depremler"
 game_concept_earthquake_desc: "$game_concept_earthquake$, az sayıda [Concept('counties', 'Kontlukta')|E] ani ve ağır yıkıma neden olan bir [natural_disaster|E] türüdür.\n$game_concept_earthquakes$, yalnızca sismik etkinliğe daha yatkın bölgelerde meydana gelebilir."
 game_concept_flood: "Sel"
 game_concept_floods: "Seller"
 game_concept_flooded: "Sular Altında"
 game_concept_flood_desc: "$game_concept_flood$, çok sayıda [Concept('counties', 'Kontlukta')|E] giderek artan hasara neden olan bir [natural_disaster|E] türüdür.\n$game_concept_floods$, yalnızca büyük nehirlerin kıyılarında meydana gelebilir."
 game_concept_government_bureaucratic_type: "Bürokratik"
 game_concept_government_bureaucratic_type_desc: "Bazı [governments|E], $game_concept_government_bureaucratic_type$ niteliktedir. Bunlar genellikle [governors|E], [appointment|E] ve topraksız [noble_families|E] aracılığıyla [Concept('realm','Ülke')|E] içindeki [Concept('provinces', 'Eyaletleri')|E] yöneten yüksek merkezîleşmeye sahip yönetimlerdir.\n\nDiğer yaygın özellikleri arasında [domiciles|E], [influence|E] ve [title_men_at_arms|E] bulunur.\n\nBirkaç $game_concept_government_bureaucratic_type$ yönetim vardır:\n$BULLET_WITH_TAB$[GetGovernment('administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('celestial_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('meritocratic_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('japan_administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('steppe_admin_government').GetNameWithIcon]"
 game_concept_government_bureaucratic_gov: "Bürokratik Yönetim"
