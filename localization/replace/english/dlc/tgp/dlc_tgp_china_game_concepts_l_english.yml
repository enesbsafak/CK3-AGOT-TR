 game_concept_movement_leader_desc:0 "[Concept('movement','Hareketi')|E] yöneten, [Concept('son_of_heaven','Göklerin Oğlu')|E] ile doğrudan konuşma yetkisine sahip tek karakterdir, [GetDecision('movement_petition_decision').GetName] [Concept('decision', 'Kararını')|E] kullanarak [Concept('movements', 'Hareketin')|E] emellerini gerçekleştirir.\n\n#help Lider olmak için, önceki liderin ölümünden sonra en yüksek [movement_power_i][movement_power|E] değerine sahip olmalı ya da mevcut lideri [GetActivityType('activity_debate').GetName] [Concept('activity', 'Etkinliğinde')|E] yenmelisiniz.#!"
 game_concept_favored_era: "Gözde Devir"
 game_concept_favored_era_possessive: "Gözde Devrin"
 game_concept_favored_era_desc: "$game_concept_favored_era$, [Concept('son_of_heaven','Göklerin Oğlu')|E] tarafından [Concept('dynastic_cycle', 'Hanedan Döngüsünün')|E] seyri üzerine tezahür eden Göklerin iradesidir. [dynastic_cycle_era_type_unstable|E] sona erdikten sonra hangi [dynastic_cycle_era_type_stable|E] devrinin başlayacağını belirler."
 game_concept_favored_movement: "Gözde Hareket"

 game_concept_favored_movement_desc:0 "$game_concept_favored_movement$, [Concept('son_of_heaven','Göklerin Oğlunun')|E] desteğini kazanmış olan [Concept('movement','Harekettir')|E].\n$BULLET_WITH_TAB$Üyeler, [SelectLocalization(GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china')] ülkesindeki herhangi bir [title|E] için fazladan [candidate_scores|E] elde eder\n$BULLET_WITH_TAB$[GetDecision('movement_petition_decision').GetName] [Concept('decision', 'Kararı')|E] üzerinden yapılan arzuhâllerin kabul edilme olasılığı artar\n$BULLET_WITH_TAB$[Concept('dynastic_cycle','Hanedan Döngüsü')|E] [Concept('situation_catalyst_catalysts','Tetikleyicileri')|E], hangi [Concept('movement', 'Hareketin')|E] desteklendiğine göre tetiklenir\n$BULLET_WITH_TAB$[GetDecision('favored_movement_consults_heaven_decision').GetName] [Concept('decision', 'Kararı')|E] açılır\n\n#help Gözde Hareket olmak için mevcuttaki Gözde Hareketin liderini [GetActivityType('activity_debate').GetName] [Concept('activity', 'Etkinliğinde')|E] yenmelisiniz.#!"

