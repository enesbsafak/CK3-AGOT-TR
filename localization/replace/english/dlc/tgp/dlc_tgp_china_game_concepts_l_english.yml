l_english:
 game_concept_celestial_government: "Semavi Yönetim"
 game_concept_celestial: "Semavi"
 game_concept_celestials: "Semaviler"
 game_concept_celestial_i: "@government_type_celestial!"
 game_concept_celestial_government_desc: "$game_concept_celestial$, [Concept('liege', 'Süzerenin')|E] karakterleri [governor|E] olarak atadığı, [civilian_governor_short|E] ve [military_governor_short|E] olmak üzere iki türü bulunan bir [Concept('government_bureaucratic_type', 'Bürokratik')|E] [Concept('government_form', 'Yönetim Biçimidir')|E].\n\nKarakterler [influence|E], [noble_families|E], [family_estates|E] ve [Concept('treasury', 'Hazineye')|E] erişebilir.\n\nBağımsız [rulers|E] [legitimacy|E] sahibidir, [vassals|E] ise [merit|E] elde etmeye odaklanır."
 game_concept_merit: "Liyakat"
 game_concept_meritorious: "Liyakatli"

 game_concept_merit_desc:0 "Bir [character_possessive|E] $game_concept_merit$i, bir sonraki [Concept('merit_level', 'Liyakat Kademesine')|E] ilerleyişini gösterir. Bir [Concept('elder', 'Bilgesi')|E] veya [Concept('disciples', 'Neferi')|E] olan tüm karakterler pasif $game_concept_merit$ kazancı üretir.\n\n[governors|E], atandıkları [Concept('holdings', 'Yerleşimlerde')|E] [buildings|E] inşa ederek, bir [inspection|E] [Concept('activity', 'Etkinliğine')|E] çıkarak, bir [GetActivityType('activity_debate').GetName]ya katılarak ve [Concept('examinations', 'Sınavlara')|E] girerek $game_concept_merit$lerini arttırabilirler.\n\n[GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )] valiler, [Concept('liege', 'Süzerenlerine')|E] fazladan [tax|E] ödeyerek aylık liyakat kazançlarını arttırır, [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] valileri ise [men_at_arms|E] birlikleri oluşturarak arttırır.\n\n$game_concept_governor$ olmayanlar, [examinations|E] girerek arttırmayı deneyebilir."
 game_concept_merit_i: "@merit_icon!"
 game_concept_merit_level: "Liyakat Kademesi"
 game_concept_merit_level_desc: "Bir [character_possessive|E] $game_concept_merit_level$, Doğu Asya [Concept('administrative_governments', 'İdari Yönetimlerinde')|E] [governor|E] olmaya ne kadar layık olduğunu gösterir.\n\nSahip oldukları [merit|E] miktarı üzerinden, Konfüçyusçu ideallere göre kayıtlı başarılarını ve ahlâkî tutumlarını temsil eder.\n\nYüksek $game_concept_merit_level$e sahip bir memurun [Concept('candidate_score', 'Adaylık Skoru')|E] ve [Concept('governor_salary', 'Vali Maaşı')|E] daha yüksektir.\n\nKademeler şunlardır:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
 game_concept_merit_levels: "Liyakat Kademeleri"
 game_concept_merit_level_impact: "Liyakat Kademesi Faktörü"
 game_concept_merit_level_impact_desc: "Liyakat Kademesi Faktörü, mevcut [Concept('merit_level', 'Liyakat Kademesinden')|E] kazanılan [Concept('modifiers', 'Etkileri')|E] güçlendirir veya zayıflatır."
 game_concept_imperial_examination: "Mülkiye Sınavı"
 game_concept_imperial_examinations: "Mülkiye Sınavları"
 game_concept_examination: "Sınav"
 game_concept_examinations: "Sınavlar"
 game_concept_imperial_examination_desc: "$game_concept_imperial_examinations$, [GetGovernment('celestial_government').GetName|E] ve [GetGovernment('meritocratic_government').GetName|E] [Concept('governments', 'Yönetim Biçimlerinin')|E] [administrative|E] işleyişinde kilit rol oynar.\n\nSınav sistemi bürokratların soydan ziyade [merit|E] ile atanmasını sağlar, böylece en parlak âlimler, kökeni ne olursa olsun, [governorship|E] atamaları elde edebilir.\n\nSınav seviyeleri:\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Çocuk Sınavı#!: Ebeveynler, [EmptyScope.ScriptValue('child_exam_min_age')] yaşından itibaren çocuklarını $send_child_to_examination_interaction$ [Concept('interaction', 'Etkileşimi')|E] ile sınava sokabilir.#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Eyalet Sınavı#!: [landed|E] olmayan karakterler, [GetActivityType('activity_local_examination').GetName] [Concept('activity', 'Etkinliği')|E] aracılığıyla Sınavların ikinci seviyesine girmeyi deneyebilir.#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Şehir Sınavı#!: [GetGovernment('celestial_government').GetName|E] [Concept('government', 'Yönetimi')|E] tarafından [GetActivityType('activity_imperial_examination').GetName] etkinliğiyle yapılır.#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Saray Sınavı#!: $activity_imperial_examination$nda sona kalan [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] aday, kraliyet sarayındaki bir ziyafete davet edilir, burada [son_of_heaven|E] ile tanışır ve liyakatini gösterir.#!"
 game_concept_exam_cheat: "Sınav Kopyası"
 game_concept_exam_cheat_desc: "$game_concept_exam_cheat$, yaklaşan sınavı atlatmak için kullanılabilecek seçenekleri açar. Ancak dikkat edin, yakalanmanın bedeli ağırdır."
 game_concept_childrens_examination_i: "@child_exam_icon"
 game_concept_childrens_examination: "Çocuk Sınavı"
 game_concept_childrens_examination_desc: "İlk seviye [imperial_examination|E], [EmptyScope.ScriptValue('child_exam_min_age')] yaşından itibaren girilebilir. Ebeveynler çocuklarını $send_child_to_examination_interaction$ [Concept('interaction', 'Etkileşimi')|E] aracılığıyla bu sınava gönderebilirler."
 game_concept_provincial_examination_i: "@provincial_exam_icon"
 game_concept_provincial_examination: "Eyalet Sınavı"
 game_concept_provincial_examination_desc: "İkinci seviye [imperial_examination|E], [GetActivityType('activity_local_examination').GetName] [Concept('activity', 'Etkinliği')|E] aracılığıyla girilir.\n\n#S Geçildiğinde:#!\n[GetModifier('tgp_passed_provincial_exam_modifier').GetDescWithEffects]."
 game_concept_metropolitan_examination_i: "@metropolitan_exam_icon"
 game_concept_metropolitan_examination: "Şehir sınavı"
 game_concept_metropolitan_examination_desc: "Üçüncü seviye [imperial_examination|E]. [GetGovernment('celestial_government').GetName|E] [Concept('government', 'Yönetimi')|E] tarafından [GetActivityType('activity_imperial_examination').GetName] [Concept('activity', 'Etkinliği')|E] aracılığıyla düzenlenir.\n\n#S Geçildiğinde:#!\n[GetModifier('tgp_passed_metropolitan_exam_modifier').GetDescWithEffects]."
 game_concept_palace_examination_i: "@palace_exam_icon"
 game_concept_palace_examination: "Saray Sınavı"
 game_concept_palace_examination_desc: "Dördüncü ve son [imperial_examination|E]. [GetActivityType('activity_imperial_examination').GetName]nda sona kalan [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] katılımcı, sarayda düzenlenen bir ziyafete davet edilir, burada [Concept('son_of_heaven', 'Göklerin Oğlu')|E] karşısında yere kapanarak liyakatlerini gösterirler.\n\n#S Geçildiğinde:#!\n[GetModifier('tgp_passed_palace_exam_modifier').GetDescWithEffects]."
 game_concept_exam_advantage: "Sınav Avantajı"
 game_concept_exam_advantage_desc: "$game_concept_exam_advantage$, bir [imperial_examination|E] sırasında soru yanıtlama ve yetenek gösterme gibi çeşitli eylemlerde başarı şansını arttırır."
 game_concept_exam_score: "Sınav Puanı"

 game_concept_exam_score_desc:0 "$game_concept_exam_score$, bir adayın [imperial_examination|E] sınavını geçme olasılığını belirler.\n\nBaşlangıç puanı, adayın [GetTrait('confucian_education').GetName(GetNullCharacter)] [Concept('trait', 'Özelliğine')|E] ve $game_concept_examination$ın odağına bağlı olarak [learning|E], [stewardship|E] ve [martial|E] [Concept('skills', 'Becerilerine')|E] göre hesaplanır.\n\nYalnızca [GetActivityType('activity_imperial_examination').GetName] [Concept('activity', 'Etkinliğindeki')|E] en yüksek puan sahibi on aday @palace_exam_icon! #V Saray Sınavı#!'na katılabilir."
 game_concept_merit_pool: "Aday Listesi"
 game_concept_merit_pools: "Aday Listeleri"
 game_concept_merit_pool_possessive: "Aday Listesinin"
 game_concept_merit_pool_desc: "$game_concept_merit_pool$, belirli türde [Concept('appointment', 'Atamalar')|E] yoluyla [title|E] kazanma hakkına sahip tüm potansiyel [Concept('characters', 'Karakterleri')|E] içerir.\n\nAdaylar, [Concept('candidate_score', 'Adaylık Skorlarına')|E] göre sıralanır. Bazı [appointment_succession_laws|E], [merit|E] kullanır, bu durumda adaylar önce [Concept('merit_level', 'Liyakat Kademelerine')|E], ardından $game_concept_candidate_score$na göre sıralanır.\n\n$game_concept_appointment$lı bir unvanın [Concept('holder', 'Sahibi')|E] öldüğünde, unvan aday listesinde en yüksek sıradaki karaktere geçer. Eğer karakterin hâlihazırda bir unvanı varsa, yeni unvanın daha yüksek bir [Concept('appointment_prominence', 'Öneme')|E] sahip olması gerekir, aksi hâlde bir sonraki adaya geçer."
 game_concept_appointment_prominence: "Önem"
 game_concept_appointment_prominence_desc: "$game_concept_appointment_prominence$, uygun adaylar için bir [Concept('title', 'Unvanın')|E] ne kadar cazip olduğunu gösterir.\n\nHâlihazırda bir Unvan sahibi olan bir aday, aynı [title_tier|E] seviyesinde yeni bir unvana ancak onun $game_concept_appointment_prominence$ değeri daha yüksekse atanabilir.\n\n$game_concept_appointment_prominence$ genellikle yerel zenginlik ve [Concept('realm_capital', 'Ülke Başkentine')|E] yakınlık esas alınarak belirlenir ancak [military_governors|E] için [Concept('title_men_at_arms', 'Unvan Düzenli Askerlerinin')|E] büyüklüğü gibi farklı faktörler de Önemi etkileyebilir."
 game_concept_entrant: "Katılımcı"
 game_concept_entrants: "Katılımcılar"
 game_concept_entrant_desc: "$game_concept_entrants$, [imperial_examination|E] [Concept('activity', 'Etkinliğinde')|E] yeteneklerini sınayan karakterlerdir."
 game_concept_subject_standing: "Tebaa İtibarı"
 game_concept_subject_standing_desc: "$game_concept_subject_standing$, bir [tributary|E] ya da [Concept('vassal', 'Vasala')|E] [Concept('suzerain', 'Efendisi')|E] veya [Concept('liege', 'Süzereni')|E] tarafından bahşedilen itibarı temsil eder."
 game_concept_imperial_grace: "İmparatorluk Lütfu"
 game_concept_imperial_grace_desc: "$game_concept_imperial_grace$, bir [Concept('tributary', 'Haraçgüzara')|E] [son_of_heaven|E] tarafından bahşedilen itibarı temsil eder.\n\nYüksek $game_concept_imperial_grace$, [Concept('tribute_missions', 'Haraç Seferleri')|E] sırasında $game_concept_tributary$a özel ayrıcalıklar tanınmasını sağlayabilir. Düşük $game_concept_imperial_grace$ seviyelerinde, $game_concept_son_of_heaven$ sizden #EMP zorla#! haraç alabilir, sıfıra ulaşması hâlinde ise ilişkinin sona ermesi anlamına gelebilir."
 game_concept_seal_of_investiture: "İmparatorluk Mührü"

 game_concept_seal_of_investiture_desc:0 "Hem hukukî bir belge hem de Göklerin Oğlu'nun lütfunun kutsal bir sembolü olan $game_concept_seal_of_investiture$, sahibinin [SelectLocalization(GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china')] ülkesinin sadık ve gözde bir [Concept('tributary','Haraçgüzarı')|E] olarak özel statüsünü simgeler.\n\nBir $game_concept_seal_of_investiture$, yüksek [Concept('imperial_grace','İmparatorluk Lütfuna')|E] sahip $game_concept_tributaries$a, başarılı bir #bold Haraç Seferinin#! kapanış töreninde verilebilir."

 game_concept_seal_of_investiture_desc_ingame:0 "[GetTitleByKey('h_china').GetDefinitiveName]"
 HAS_SEAL_OF_INVESTITURE: "[Concept('seal_of_investiture','İmparatorluk Mührü')|E] sahibisiniz"
 NO_SEAL_OF_INVESTITURE: "[Concept('seal_of_investiture','İmparatorluk Mührü')|E] sahibi değilsiniz"
 SUBJECT_STANDING_CONCEPT: "[subject_standing|E]"
 SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT: "[imperial_grace|E]"
 IMPERIAL_GRACE_ICON: "@imperial_grace!"
 IMPERIAL_GRACE_LOSS_STABILITY: "[dynastic_cycle|E] şu anda $situation_dynastic_cycle_phase_stability$ evresinde olduğundan, tüm #EMP $tributaries_celestial$#! her yıl @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V1] [imperial_grace|E] kaybeder."
 IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION: "[dynastic_cycle|E] şu anda $situation_dynastic_cycle_phase_stability_expansion$ evresinde olduğundan, tüm #EMP $tributaries_celestial$#! her yıl @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V1] [imperial_grace|E] kaybeder."
 IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT: "[dynastic_cycle|E] şu anda $situation_dynastic_cycle_phase_stability_advancement$ evresinde olduğundan, tüm #EMP $tributaries_celestial$#! her yıl @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V1] [imperial_grace|E] kaybeder."
 IMPERIAL_GRACE_LOSS_INSTABILITY: "[dynastic_cycle|E] şu anda $situation_dynastic_cycle_phase_stability_advancement$ evresinde olduğundan, tüm #EMP $tributaries_celestial$#! her yıl @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V1] [imperial_grace|E] kaybeder."
 IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST: "[dynastic_cycle|E] şu anda $situation_dynastic_cycle_phase_instability_conquest$ evresinde olduğundan, tüm #EMP $tributaries_celestial$#! her yıl @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V1] [imperial_grace|E] kaybeder."
 IMPERIAL_GRACE_LOSS_CHAOS: "[dynastic_cycle|E] şu anda $situation_dynastic_cycle_phase_chaos$ evresinde olduğundan, tüm #EMP $tributaries_celestial$#! her yıl @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V1] [imperial_grace|E] kaybeder."
 game_concept_mandate_of_heaven: "Göklerin Yetkisi"
 game_concept_mandate_of_heaven_mandate: "Yetki"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$, yalnızca [Concept('son_of_heaven', 'Göklerin Oğluna')|E] özgü özel bir [legitimacy|E] türüdür. Hükümdarın hükmetme hakkını ve gökyüzünün altındaki en yüce hükümdarın kim olduğunu temsil eder.\n\nBu yetki, [dynastic_cycle|E] ile yakından bağlantılıdır. Döngü, mevcut hükümdarın Meşruiyet kazanma biçimini etkiler ve hükümdarın yetki seviyesine bağlı olarak [Concept('situation_dynastic_cycle_phase', 'Hanedan Döngü Çağını')|E] değiştirebilir."
 game_concept_son_of_heaven: "Göklerin Oğlu"
 game_concept_son_of_heaven_possessive: "Göklerin Oğlunun"
 game_concept_son_of_heaven_desc: "$game_concept_son_of_heaven$, Çin'in [Concept('hegemon', 'Hegemonu')|E] ve [Concept('celestial_government', 'Semavi Yönetimin')|E] [Concept('top_liege', 'Ana Süzerenidir')|E].\n\n$game_concept_son_of_heaven$, [mandate_of_heaven|E] adı verilen özel bir [legitimacy|E] biçimine ve yalnızca $game_concept_son_of_heaven$ olarak adlandırılan özel bir [Concept('situation_participant_group', 'Katılımcı Grubuna')|E] sahiptir."
 game_concept_treasury_i: "@treasury_icon!"
 game_concept_treasury: "Hazine"
 game_concept_treasury_desc: "Bazı [Concept('administrative_governments','İdari Yönetim')|E] sistemlerinde Hazine, kişisel [Concept('gold','Altın')|E] varlığınızdan farklı olarak yalnızca devlet işlerinde kullanılabilecek kaynakları temsil eder.\n\n$BULLET$#indent_newline:2 Bir [Concept('vassal','Vasal')|E] olarak, [Concept('liege','süzereninizden')|E] [Concept('tax','Vergi')|E] katkılarınıza ve diğer yükümlülüklerinize göre Hazine alırsınız#!\n$BULLET$#indent_newline:2 Hazine, [Concept('top_liege','Ana Süzeren')|E] tarafından yaratılır, bu kişi [Concept('taxation','Vergi')|E] gelirinin bir kısmını Hazineye dönüştürür#!\n$BULLET$#indent_newline:2 Dilediğiniz zaman [Concept('gold','Altınınızı')|E] Hazineye aktarabilirsiniz#!\n$BULLET$#indent_newline:2 Hazine, bir [Concept('holder','Sahibi')|E] değiştiğinde [Concept('title','Unvanla')|E] birlikte kalır#!"
 game_concept_imperial_treasury_i: "$game_concept_treasury_i$"
 game_concept_imperial_treasury: "İmparatorluk Hazinesi"
 game_concept_imperial_treasury_desc: "$game_concept_treasury_desc$"
 game_concept_treasury_vassal_development: "Vassal Gelişimi"
 game_concept_treasury_vassal_development_desc: "Vergi katkıları ve diğer [Concept('obligations','yükümlülükleri')|E] doğrultusunda [Concept('liege','Süzerenleri')|E] tarafından doğrudan [Concept('vassals','vasallara')|E] gönderilen Hazine."
 game_concept_treasury_ministry_budget: "Bakanlık Bütçesi"
 game_concept_treasury_ministry_budget_short: "Bakanlık"
 game_concept_treasury_ministry_budget_desc: "[Concept('ministries','Bakanlıkları')|E] finanse etmek amacıyla merkezî hükûmet tarafından [Concept('vassals','vassallara')|E] gönderilen Hazine. [Concept('top_liege','Ana Süzerenin')|E] [Concept('treasury','hazine')|E] gelirinin belli bir kısmı periyodik olarak Bakanlık Bütçesine tahsis edilir."
 game_concept_treasury_salary_budget: "Maaş Bütçesi"
 game_concept_treasury_salary_budget_short: "Maaş"
 game_concept_treasury_salary_budget_desc: "Merkezî hükûmet tarafından [Concept('vassals','vasallara')|E] gönderilen Hazine, bunlar kişisel maaş olarak kullanılmak üzere [Concept('gold','Altın')|E] şeklinde alınır. [Concept('top_liege','Ana Süzerenin')|E] [Concept('treasury','Hazine')|E] gelirinin belli bir kısmı periyodik olarak Maaş Bütçesine tahsis edilir."
 game_concept_treasury_military_budget: "Askerî Bütçe"
 game_concept_treasury_military_budget_short: "Askerî"
 game_concept_treasury_military_budget_desc: "Merkezî hükûmet tarafından askerî [Concept('province','eyalet')|E] [Concept('vassals','vasallarına')|E] ek askerî faaliyetleri finanse etmek amacıyla gönderilen Hazine. [Concept('top_liege','Ana Süzerenin')|E] [Concept('treasury','Hazine')|E] gelirinin belli bir kısmı periyodik olarak Askerî Bütçeye tahsis edilir."
 game_concept_governor_salary: "Vali Maaşı"
 game_concept_governor_salary_desc: "[Concept('gold','Altın')|E] ile [Concept('treasury','Hazine')|E] arasında ayrım yapan [Concept('administrative_governments','İdarî yönetim')|E] sistemlerinde, [Concept('governors','Valiler')|E] maaşlarını $game_concept_gold$ olarak alırlar."
 game_concept_treasury_budgeting: "Hazine Bütçelemesi"
 game_concept_treasury_budget: "Hazine Bütçesi"
 game_concept_treasury_budgeting_desc: "Merkezî fonların belirli [Concept('vassals','vasallara')|E] ve alt-vasallara belirli oranlarda dağıtımından sorumlu sistem.\n\nBir bütçe uygulandığında, mevcut [Concept('treasury_budget_capacity','Bütçe Kapasitesine')|E] göre her [Concept('treasury_budget_category','Bütçe Kategorisi')|E] için vasal başına bir [Concept('treasury_budget_base_rate','Temel Oran')|E] hesaplanır.\n\n@alert_icon! Hesaplanan temel oran yeni bir bütçe hazırlanana kadar #bold değişmez#!. Dolayısıyla yeni alıcılar eklerseniz bütçe maliyetiniz artacaktır."
 game_concept_treasury_budget_capacity: "Bütçe Kapasitesi"
 game_concept_treasury_budget_capacity_desc: "[Concept('treasury_budgeting','Hazine Bütçelemesi')|E] için aylık kullanılabilir [Concept('treasury','Hazine')|E] miktarıdır. Hazine gelirinden, [Concept('treasury_vassal_development','Vasal Gelişimi')|E] ve [Concept('court_amenities','Saray İmkânları')|E] gibi bütçeleme dışı düzenli giderlerin çıkarılmasıyla hesaplanır."
 game_concept_treasury_budget_category: "Bütçe Kategorisi"
 game_concept_treasury_budget_category_desc: "[Concept('treasury_budgeting','Hazine Bütçelemesi')|E] sisteminde bütçe tahsisi alabilecek ayrı bölümler Bütçe Kategorisi olarak adlandırılır. Her bütçe kategorisinin farklı alıcıları olabilir ve bazıları ödemeyi [Concept('treasury','Hazine')|E] yerine [Concept('gold','Altın')|E] olarak alabilir."
 game_concept_treasury_budget_base_rate: "Bütçe Temel Oranı"
 game_concept_treasury_budget_base_rate_short: "Temel Oran"
 game_concept_treasury_budget_base_rate_desc: "Bir [Concept('treasury_budget_category','Bütçe Kategorisinin')|E] standart bir alıcısının aldığı miktardır. Alıcılar, [Concept('title_rank','Unvan Kademeleri')|E], [Concept('merit_level','Liyakat Kademeleri')|E] veya diğer değişkenlere bağlı olarak temel orandan fazla ya da az alabilirler."
 game_concept_treasury_budget_category_trend: "Bütçe Kategorisi Eğilimi"
 game_concept_treasury_budget_category_trend_short: "Eğilim"
 game_concept_treasury_budget_category_trend_desc: "Bir [Concept('treasury_budget_category','Bütçe Kategorisinin')|E] önceki bütçeye kıyasla alacağı [Concept('treasury','Hazine')|E] farkını gösterir."
 game_concept_treasury_budget_unallocated: "Tahsis Edilmemiş Hazine Bütçesi"
 game_concept_treasury_budget_unallocated_short: "Tahsis Edilmemiş"
 game_concept_treasury_budget_unallocated_desc: "Tahsis edilmemiş herhangi bir Hazine bütçesi genel [Concept('treasury','Hazine')|E] gelirine eklenir."
 game_concept_treasury_budget_deficit: "Hazine Bütçesi Açığı"
 game_concept_treasury_budget_deficit_short: "Açık"
 game_concept_treasury_budget_deficit_desc: "[Concept('treasury_budget_capacity','Bütçe Kapasitesi')|E]nden fazla harcama yapıldığında, aylık [Concept('treasury','Hazine')|E] gelirinden bir miktar düşülür."
 game_concept_celestial_bureaucracy: "Semavi Bürokrasi"
 game_concept_celestial_bureaucracy_desc: "$game_concept_celestial_bureaucracy$, [Concept('celestial','Semavi')|E] [Concept('realm_possessive','ülkenin')|E] merkezîleşme düzeyini ve [Concept('ruler','Hükümdarın')|E] [vassals|E] üzerindeki genel gücünü temsil eder.\n\nYalnızca [top_liege|E], $game_concept_celestial_bureaucracy$yi değiştirebilir. Semavi $game_concept_vassals$, $game_concept_liege$lerinin seviyesini kullanır.\n\n$game_concept_celestial_bureaucracy$nin dört seviyesi vardır:\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_3$\n\n$game_concept_celestial_bureaucracy$yi yükseltmek, [realm_size|E] ve hükümdarın [learning_skill|E] seviyesine bağlı olarak belirli miktarda [prestige|E] gerektirir."
 game_concept_minister: "Bakan"
 game_concept_ministers: "Bakanlar"
 game_concept_minister_possessive: "Bakanın"
 game_concept_ministers_possessive: "Bakanların"
 game_concept_minister_desc: "$game_concept_ministers$, [Concept('son_of_heaven','Göklerin Oğlunun')|E] [Concept('council','Konseyinde')|E] ya da [Concept('ministry','Bakanlığında')|E] görev yapan bir tür [Concept('councillors', 'Konsey Üyesidir')|E].\n\nHer bakanın, [Concept('great_projects','Büyük Projeler')|E] finanse etmek veya [Concept('governors', 'Valilere')|E] çeşitli şekillerde yardım etmek gibi birçok sorumluluğu vardır."
 game_concept_ministry: "Bakanlık"
 game_concept_ministries: "Bakanlıklar"
 game_concept_ministry_possessive: "Bakanlığın"
 game_concept_ministries_possessive: "Bakanlıkların"
 game_concept_ministry_desc: "$game_concept_ministry$, yalnızca [Concept('son_of_heaven','Göklerin Oğluna')|E] özgü bir [council|E] türüdür.\n\nDokuz [minister|E] vardır, her biri hükûmetin en üst düzeyini temsil eder ve belirli bir idare kolunun başıdır. Sahip oldukları hiyerarşi doğrultusunda, daha düşük seviye bir Bakan, [Concept('title', 'Unvanın')|E] [Concept('appointment_prominence', 'Önemi')|E] doğrultusunda daha yüksek seviye bir pozisyona terfi edebilir.\n\n$game_concept_ministers$ şunlardır:\n$EFFECT_LIST_BULLET$[minister_grand_chancellor|E]\n$EFFECT_LIST_BULLET$[minister_censor|E]\n$EFFECT_LIST_BULLET$[minister_grand_marshal|E]\n$EFFECT_LIST_BULLET$[minister_of_personnel|E]\n$EFFECT_LIST_BULLET$[minister_of_war|E]\n$EFFECT_LIST_BULLET$[minister_of_revenue|E]\n$EFFECT_LIST_BULLET$[minister_of_justice|E]\n$EFFECT_LIST_BULLET$[minister_of_rites|E]\n$EFFECT_LIST_BULLET$[minister_of_works|E]"
 game_concept_minister_grand_chancellor: "$councillor_chancellor_celestial_government_imperial$"

 game_concept_minister_grand_chancellor_desc:0 "$game_concept_minister_grand_chancellor$, en yüksek rütbeli [minister|E] olup diplomatik meselelerden sorumludur. Genellikle [grand_secretariat_director|E] görevine atanır.\n\nŞansölye #V [GetLawGroup('grand_secretariat_laws').GetName]#! [Concept('law', 'Yasasına')|E] göre [grand_secretariat_director|E] olarak atanabilir.\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_chancellor_possessive: "$councillor_chancellor_celestial_government_imperial_possessive$"
 minister_grand_chancellor_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$[GetDecision('favored_movement_consults_heaven_decision').GetName|V] [Concept('decision', 'Kararını')|E] kullanmak\n$BULLET$[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [Concept('decision', 'Kararı')|E] aracılığıyla [courtier|E] davet etmek\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için daha düşük maliyetli özel seçeneklere erişmek\n$BULLET$[GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [Concept('great_project', 'Büyük Projesini')|E] başlatmak#!#!"
 game_concept_minister_censor: "$councillor_spymaster_celestial_government_imperial$"

 game_concept_minister_censor_desc:0 "$game_concept_minister_censor$, entrika ve istihbarat işlerinden sorumlu [Concept('minister', 'Bakandır')|E].\n\nSadakatsiz bir Sansürcünüz olursa size ve [Concept('close_family','Yakın Ailenize')|E] karşı [Concept('schemes','Entrikaları')|E] kolayca gizleyip bunlara katılabilir!\n\nSansürcü [GetLawGroup('grand_secretariat_laws').GetName|V] [Concept('law', 'Yasasına')|E] göre [grand_secretariat_director|E] olarak atanabilir.\n\n$minister_censor_action_breakdown$"
 game_concept_minister_censor_possessive: "$councillor_spymaster_celestial_government_imperial_possessive$"
 minister_censor_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$#V $censor_find_secrets_interaction$#! [Concept('interaction', 'Etkileşimiyle')|E] [vassal|E] [Concept('courts', 'Saraylarında')|E] [Concept('liege', 'Süzerene')|E] [gold_i][gold|E] ödülü karşılığında vermek üzere [secrets|E] bulmak veya [hooks|E] kazanmak\n$BULLET$[blackmail|E] yapmak #V '$catalyst_minister_blackmailed$'#! [Concept('dynastic_cycle_catalyst', 'Hanedan Döngüsü Tetikleyicisini')|E] tetikler\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek#!#!"
 game_concept_minister_grand_marshal: "$minister_grand_marshal$"

 game_concept_minister_grand_marshal_desc:0 "$game_concept_minister_grand_marshal$, [Concept('realm','Ülkenin')|E] en yüksek rütbeli komutanıdır ve [Concept('title_men_at_arms','Unvan Düzenli Askerlerinden')|E] oluşan bir [Concept('army','Orduya')|E] komutanlık eder.\n\nMareşal #V [GetLawGroup('grand_secretariat_laws').GetName]#! [Concept('law', 'Yasasına')|E] göre [grand_secretariat_director|E] olarak atanabilir.\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_minister_grand_marshal_possessive: "$minister_grand_marshal_possessive$"
 minister_grand_marshal_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$#V Büyük Sefer#! [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[GetGreatProjectType('construct_great_barracks').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$[GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] ve [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName] [Concept('dynastic_cycle_eras_short', 'Devirlerinde')|E] #V $CHINA_SEIZE_COUNTY_CB_NAME$#! ve #V $CHINA_SEIZE_DUCHY_CB_NAME$#! [Concept('casus_bellis', 'Savaş Sebeplerini')|E] kullanmak\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek#!#!"
 game_concept_minister_of_personnel: "$minister_personnel$"

 game_concept_minister_of_personnel_desc:0 "$game_concept_minister_of_personnel$, [Concept('appointments','Atamalar')|E] ile ilgili tüm işlerden sorumlu [Concept('minister', 'Bakandır')|E] ve diğer [Concept('characters', 'Karakterlerin')|E] [Concept('candidate_score','Adaylık Skorlarını')|E] büyük ölçüde etkileyebilir.\n\n$minister_of_personnel_action_breakdown$"
 game_concept_minister_of_personnel_possessive: "$minister_personnel_possessive$"
 minister_of_personnel_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$[GetLawGroup('celestial_retirement_law').GetName] [Concept('law', 'Yasası')|E] fark etmeksizin #V $force_governor_removal_interaction$#! [Concept('interaction', 'Etkileşimi')|E] aracılığıyla [Concept('governors', 'Valileri')|E] kovmak\n$BULLET$[GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [Concept('decision', 'Kararı')|E] aracılığıyla [courtier|E] davet etmek\n$BULLET$#V $offer_courtier_interaction$#! ve #V $demand_courtier_interaction$#! [Concept('interactions', 'Etkileşimlerini')|E] kabul etmeye zorlamak\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için daha düşük maliyetli özel seçeneklere erişmek#!#!"
 game_concept_minister_of_revenue: "$councillor_steward_celestial_government_imperial$"

 game_concept_minister_of_revenue_desc:0 "$game_concept_minister_of_revenue$, [Concept('taxation','Vergilendirme')|E] işlerinden sorumlu [Concept('minister', 'Bakandır')|E] ve [Concept('son_of_heaven','Göklerin Oğluna')|E] [treasury|E] yönetiminde yardım eder.\n\n$minister_of_revenue_action_breakdown$"
 game_concept_minister_of_revenue_possessive: "$councillor_steward_celestial_government_imperial_possessive$"
 minister_of_revenue_action_breakdown: "#indent_newline:4 #weak Bu konumdaki bir bakan örneğin şunları yapabilir:\n$BULLET$#V $celestial_request_treasury_interaction$#! etkileşimini kullanabilen [Concept('vassals', 'Vasallara')|E] yardım etmek\n$BULLET$[GetDecision('tgp_suggest_budget_change_decision').GetName|V] [Concept('decision', 'Kararını')|E] kullanmak\n$BULLET$[GetGreatProjectType('minister_project_conduct_census').GetName|V] [Concept('great_project', 'Büyük Projesi')|E] başlatmak\n$BULLET$#V $pay_treasury_debt_interaction$#! [Concept('interaction', 'Etkileşimi')|E] aracılığıyla [Concept('civilian_governors', 'Sivil Valilerin')|E] [Concept('treasury_debt', 'Hazine Borçlarını')|E] ödeyerek #V '$catalyst_cleared_treasury_debt$'#! [Concept('dynastic_cycle_catalyst', 'Hanedan Döngüsü Tetikleyicisini')|E] tetiklemek\n$BULLET$#V $influence_meritorious_career_interaction$#! [Concept('interaction', 'Etkileşimi')|E] için özel seçeneklere erişmek#!#!"
