l_english:
 silk_road_situation: "İpek Yolu"
 silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"
 situation_silk_road_situation_desc: "$silk_road_situation_desc$"
 game_concept_silk_road_situation: "İpek Yolu"
 game_concept_silk_road: "$game_concept_silk_road_situation$"
 game_concept_silk_road_situation_desc: "$game_concept_silk_road_situation$ tek bir yol değil, uygarlığın en uzak köşelerini altın, mal ve fikir alışverişi için birbirine bağlayan koca bir ağdır. İpek Yolu'na erişim, dünyanın tüm zenginliklerine erişim demektir.\n\nİpek Yolu'na farklı erişim seviyeleri, değişen [gold|E] bonusları sağlar ve egzotik [innovations|E] açmak için benzersiz fırsatlar sunabilir. İpek Yolu üzerinde dolaşan altın ve bilginin miktarı, yolun refahına bağlı olarak değişir, bu refah savaşlar, olaylar ve Çin'in [dynastic_cycle|E] gibi birçok etkenden etkilenir."
 game_concept_situation_silk_road_phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
 game_concept_situation_silk_road_phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
 game_concept_situation_silk_road_phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
 game_concept_situation_silk_road_phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
 game_concept_situation_silk_road_phase_hardship: "$situation_silk_road_phase_hardship$"
 game_concept_situation_silk_road_phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"
 situation_silk_road_phase_exceptional_bounty: "Olağanüstü Bereket"
 situation_silk_road_phase_exceptional_bounty_desc: "İpek Yolu'nda işler iyi gittiğinde büyük hazineler elde edilebilir, en büyük kârlar yapılabilir ve fikirler ile yenilikler en geniş biçimde yayılır."
 situation_silk_road_phase_steady_trading: "İstikrarlı Ticaret"
 situation_silk_road_phase_steady_trading_desc: "Kâr edilir, pazarlık yapılır ve işler her zamanki gibi sürer. Başka yerlerde daha kârlı seçenekler olabilir ama İpek Yolu her zaman daha güvenilirdir."
 situation_silk_road_phase_hardship: "Sıkıntı"
 situation_silk_road_phase_hardship_desc: "Savaş, felaket ve kaderin öngörülemez dönemeçleri yüzünden İpek Yolu durma noktasındadır. Ne para ne de fikir hareket eder, İpek Yolu'nun güzergâhlarını izlemenin kazandırdığı tek şey sefalet ve yoksulluktur."
 phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
 phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
 phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
 phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
 phase_hardship: "$situation_silk_road_phase_hardship$"
 phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"
