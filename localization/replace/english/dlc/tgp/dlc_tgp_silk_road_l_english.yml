 silk_road_situation_sub_region_region_silk_road_proper_china: "Çin"
 silk_road_situation_sub_region_region_silk_road_proper_china_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Doğudan ipek ve çay, tüccarlar tarafından satın alınır ve dışarıya doğru yavaş yolculuğuna başlar. Bu mallarla birlikte tüccarlar bir şeyi daha beraberinde getirir: yeni #italic fikirler#!.#!"
 silk_road_situation_sub_region_region_silk_road_proper_tibet: "Tibet"
 silk_road_situation_sub_region_region_silk_road_proper_tibet_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Tibet Platosu çetin bir coğrafyadır ama bölgenin dağınık vadileri ve geçitleri arasında ticaret yolları bulunabilir.#!"
 silk_road_situation_sub_region_region_silk_road_proper_india: "Hindistan"
 silk_road_situation_sub_region_region_silk_road_proper_india_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Ticaret bu bölgeden, Ganj ile İndus'un suları gibi akar; çekilir, coşar ama hep vardır.#!"
 silk_road_situation_sub_region_region_silk_road_proper_central_asia: "Orta Asya"
 silk_road_situation_sub_region_region_silk_road_proper_central_asia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Uyanık gözler bozkırlara bakıp önlerinde uzanan sayısız açık patikayı seçebilir. Fırsat her zaman vardır, tüccarlar için de akıncılar için de.#!"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia: "Hazarötesi"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Hazar Denizi ve Karadeniz, ticaret ve yolculuk için benzersiz fırsatlar sunar. Nehirler bu suları kuzey topraklarına bağlar, kendilerine ait ticaret ağları ve zenginlik ile talih için kendi fırsatları vardır.#!"
 silk_road_situation_sub_region_region_silk_road_proper_occident: "Batı"
 silk_road_situation_sub_region_region_silk_road_proper_occident_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Büyük kervanların nihai varış noktalarına ulaştığı, servetlerin kazanılıp kaybedildiği yer burasıdır.#!"
