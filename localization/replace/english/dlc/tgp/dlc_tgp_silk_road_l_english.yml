 silk_road_situation_sub_region_region_silk_road_proper_central_asia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Uyanık gözler bozkırlara bakıp önlerinde uzanan sayısız açık patikayı seçebilir. Fırsat her zaman vardır, tüccarlar için de akıncılar için de.#!"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia: "Hazarötesi"
 silk_road_situation_sub_region_region_silk_road_proper_transcaspia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Hazar Denizi ve Karadeniz, ticaret ve yolculuk için benzersiz fırsatlar sunar. Nehirler bu suları kuzey topraklarına bağlar, kendilerine ait ticaret ağları ve zenginlik ile talih için kendi fırsatları vardır.#!"
