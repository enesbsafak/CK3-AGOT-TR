 emperor_imperial_examination.800.t: "Haraç Hadımı"

 emperor_imperial_examination.800.desc:0 ""Cömert [ROOT.Char.GetTitleAsNameNoTooltip], mütevazı hizmetkârınız bu kesinti için af diliyor," der [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], bir gongshou ile belini bükerek. "Bu [examination_character_1.GetFirstName] — [examination_character_2.GetHouse.GetName] hanesine uzun süredir sadık, son derece becerikli bir [GetTrait('eunuch_1').GetName( GetNullCharacter )]."\n\n"Hizmetini saraya sunuyoruz ki [ROOT.Char.GetPrimaryTitle.GetNameNoTier] lütfunuz altında serpilsin.""
 emperor_imperial_examination.800.a: "Ona bir görev buluruz."
 emperor_imperial_examination.800.b: "Bir sınav görevlisi olabilir."
 emperor_imperial_examination.800.c: "Hizmetkârını yanında tut."
 becomes_imperial_examiner.tt: "Bir Sınav Görevlisi olur"
 emperor_imperial_examination.900.t: "[examination_character_2.Custom('ComplimentAdjective')|U] Bir Hizmetkâr"

 emperor_imperial_examination.900.desc:0 ""Göksel [ROOT.Char.GetTitleAsNameNoTooltip], bu şölen için teşekkür ederiz," der [ROOT.Char.Custom2('RelationToMeShort', examination_character_1)], [examination_character_1.GetTitledFirstName], yanında bir hizmetkârla belini bükerek. "Bu benim [examination_character_1.Custom2('RelationToMeShort', examination_character_2)]'im, [examination_character_2.GetFirstName] — mütevazı bir hediyenin taşıyıcısı: memleketim [origin_county.GetNameNoTier]'den [examination_character_1.Custom('GetExpensiveDrink')]."\n\n"Ama içkiden de öte, [examination_character_2.GetHerHis] hizmetini sunuyorum. [examination_character_2.GetHerHis|U] [examination_character_2.Custom('highest_skill_noun')] bilgisi saraya hizmet edecek.""
 emperor_imperial_examination.900.a: "Becerileri memnuniyetle karşılayacağız."
 emperor_imperial_examination.900.b: "O sana daha iyi hizmet eder."
 emperor_imperial_examination.1000.t: "Yabancı Yetenek"

 emperor_imperial_examination.1000.desc:0 ""Bilge [ROOT.Char.GetTitleAsNameNoTooltip], huzurunuza mütevazı bir takdirle geliyorum," der saray adayı [examination_character_2.GetTitledFirstName], kusursuz [chinese.GetLanguage.GetName] konuşarak. "Doğuştan ve dilimle [examination_character_2.GetCulture.GetName] olsam da, lütfunuz sayesinde buraya kadar geldim — ve [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'e hizmet etmekten başka bir şey istemiyorum."\n\n"Bu yüzden [examination_character_2.GetCulture.GetName] alçakgönüllülüğünün bir nişanesi olarak göklerin dilini — [chinese.GetLanguage.GetName]'i — öğrendim.""
 emperor_imperial_examination.1000.a: "Çabaların takdir edilecek."
 emperor_imperial_examination.1000.b: "[examination_character_2.GetCulture.GetNameNoTooltip] taklidi burada yersiz."
