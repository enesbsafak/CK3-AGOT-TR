l_english:
 emperor_imperial_examination.100.t: "Hayranlık İçinde"

 emperor_imperial_examination.100.desc:0 ""En yüce ve bilge [ROOT.Char.GetTitleAsNameNoTooltip], huzurunuzda durmak en büyük onurdur." [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], hayranlıkla konuşuyor. "Bu sınav, benim sadık hizmetkârınız olduğumu kanıtlasın."\n\n"[ROOT.Char.GetPrimaryTitle.GetNameNoTier]'in kudreti ve ihtişamı ile Cennet'in [ROOT.Char.Custom('GetDaughterSon')|U] on bin yıl yaşasın!""
 emperor_imperial_examination.100.a: "Sadakat, her şeyin üstünde bir erdemdir."
 emperor_imperial_examination.100.b: "Övgü geçicidir, asıl olan eylemdir."
 imperial_examination.advantage.other.tt: "Bir [exam_advantage|E] kazanılır"
 imperial_examination.advantage.dynasty_legacy.tt: "[GetDynastyPerk( 'tgp_chinese_legacy_1' ).GetName] Hanedan Mirasını açtığınız için etkinliğe bir [exam_advantage|E] ile başlayacaksınız"
 emperor_imperial_examination.200.t: "Seçkin Bir Güzellik"

 emperor_imperial_examination.200.desc:0 ""Saygıdeğer majesteleri," [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], hürmetle konuşuyor. "[concubine_origin.GetNameNoTier] seyahatlerimde saygın bir aileyle, [examination_character_1.GetHouse.GetName] ile tanıştım ve [examination_character_1.GetCulture.GetName] ileri gelenleriyle görüştüm."\n\n"İç sarayda size hizmet etmesi için bir [examination_character_1.GetLadyLord] seçmem için dilekçe verdiler — nadir zarafete sahip bir [examination_character_1.GetWomanMan] olan [examination_character_1.GetFirstName]'i seçtim. [examination_character_1.GetSheHe]'in sizi memnun etmesini umuyoruz, ey Cennet'in [ROOT.Char.Custom('GetDaughterSon')|U].""
 emperor_imperial_examination.200.a: "[examination_character_1.GetSheHe|U] hareme katılabilir."
 emperor_imperial_examination.200.b: "Bana bunun yerine seyahatlerinden bahset."
 emperor_imperial_examination.200.c: "Burası saray mı genelev mi?"
 emperor_imperial_examination.300.t: "Aile Yadigârı"

 emperor_imperial_examination.300.desc:0 ""Yüce [ROOT.Char.GetTitleAsNameNoTooltip], bilge lütfunuz uçsuz bucaksız." [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], önümde [examination_character_2.GetHerselfHimself] yerlere kapanıyor. "Mütevazı bir adak getiriyorum, sarayda sergilenmek üzere bir eser."\n\n"Bu [newly_created_artifact.GetName], [examination_character_2.GetHouse.GetName] hanesinin bir yadigârı. Egemen majestelerinin bizi sadık hizmetkârlar olarak tanımasından başka bir şey istemiyoruz.""
 emperor_imperial_examination.300.a: "Layık bir armağan."
 emperor_imperial_examination.300.b: "Kötü işçilik; atın gitsin."
 emperor_imperial_examination.300.c: "[examination_character_2.GetHouse.GetNameNoTooltip] hanesi sınava odaklanmalı."
 emperor_imperial_examination.400.t: "Vakanüvislerden Okumak"
 emperor_imperial_examination.400.desc: "Sınav görevlileri ve saraya kabul edilecekler bir arada toplanmış, hararetle okuyup fısıldaşıyorlar; hepsi gergin, hepsi tetikte. Göklerin Oğlu olarak zamansız bir hikmet sunmam yerinde olur. İşaretimle oda hayranlık içinde sessizliğe bürünüyor.\n\nElimle raflardaki..."
 emperor_imperial_examination.400.a: "...[ROOT.Char.Custom('GetRandomAnnalsPassage')] Yıllıklarını işaret ediyorum"
 emperor_imperial_examination.400.b: "...[ROOT.Char.Custom('GetRandomPoetryPassage')] işaret ediyorum."
 emperor_imperial_examination.400.c: "...[ROOT.Char.Custom('GetRandomRitesPassage')] işaret ediyorum."
 every_palace_entrant: "Her Saray Adayı"
 custom_every_examiner: "Her Sınav Görevlisi"
 emperor_imperial_examination.500.t: "[examination_character_2.GetFirstNameNoTooltip] ve Şiirleri"

 emperor_imperial_examination.500.desc:0 ""Göksel majesteleri, sınırsız lütfunuzun onuruna bir şiir yazdım." [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], bir kitap açar ve okur:\n\n#EMP "[examination_character_2.Custom('GetAdventureNameBand')|l] of [examination_character_2.Custom('GeneratePoem_Title_Fragment_Season')], the [examination_character_2.Custom('GetAdventureNameBand')|l] of [examination_character_2.Custom('GetAdventureNameSuffix')|l] and [examination_character_2.Custom('GetAdventureNameSuffix')|l] — [examination_character_2.Custom('GetAdventureNamePrefixes')|l] in the [poetry_province.Custom('GetTerrainTypePlural')], the [examination_character_2.Custom('GetRandomSmallPreciousItem')] in their hands. From [poetry_county.GetNameNoTier], in [poetry_province.Custom('ProvinceCompliment')] [examination_character_2.Custom('GeneratePoem_Title_Fragment_Noun')|l], within the [examination_character_2.Custom('FormalComplimentAdjective')|l] [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."#!\n\n[examination_character_2.GetSheHe|U] kararımı hevesle bekliyor.""
 emperor_imperial_examination.500.a: "Dizeleriniz ölçülü ama manayla dolu."
 emperor_imperial_examination.500.b: "Liyakatiniz gibi kelimeleriniz de yetersiz."
 emperor_imperial_examination.600.t: "Neşeli Bir An"
 emperor_imperial_examination.600.desc: "Kalabalığı denetlerken adaylardan biri, olan [examination_character_2.GetTitledFirstName], öyle şakaya dalıyor ki nereye gittiğini bile fark etmiyor. Geri geri yürürken bilmeden bana yaklaşıp ve şöyle diyor: "...ve işte [examination_character_2.Custom('GetAdventureNameBand')|l], [examination_character_2.Custom('GetAdventureNameSuffix')|l]'ı böyle kaybetti!"\n\nHafifçe öksürürüyorum.\n\nÖnündeki kalabalık susuyor. [examination_character_2.GetFirstNameNoTooltip] korkuyla donakalıyor."
 emperor_imperial_examination.600.a: "Eğlenceliymiş."
 emperor_imperial_examination.600.b: "Yeter, sınava odaklan."
 emperor_imperial_examination.600.c: "Bu bir saygısızlık, derhâl defol."

 emperor_imperial_examination.700.t:0 "$BULLET$[GetTrait('varangian').GetName( GetNullCharacter )] [GetCourtPositionType('bodyguard_court_position').GetName()]sı [Concept( 'aptitude', 'Yatkınlığını' )|E] arttırır ([aptitude|E] seviyesine bağlıdır)\n$BULLET$Şartları sağlayan [Concept( 'courtiers', 'Saray Mensuplarından' )|E] [GetTrait('varangian').GetName( GetNullCharacter )] ve [GetTrait('loyal').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliklerini' )|E] kazananların sayısı artar\n$BULLET$Daha çok Vareg Muhafızı belirir\n@warning_icon! #X Basileus'un ölümünden sonra Vareg Muhafızları bir miktar [gold_i] altın talep eder.#!"

