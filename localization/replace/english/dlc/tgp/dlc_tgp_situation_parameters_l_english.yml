 dynastic_cycle_participant_group_other_rulers_desc: "[GetSituation('dynastic_cycle').GetTopSubRegion.GetName] içindeki, [GetTitleByKey('h_china').GetDefinitiveName] [Concept('vassals', 'Vasalı')|E] olmayan tüm [rulers|E]"
 dynastic_cycle_participant_group_advancement_movement: "İlerlemeci $game_concept_movement$"
 dynastic_cycle_participant_group_advancement_movement_desc: "[Concept('dynastic_cycle', 'Hanedan Döngüsünü')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] [Concept('situation_dynastic_cycle_phase', 'Devrine')|E] doğru itmek isteyen [GetTitleByKey('h_china').GetDefinitiveName] [Concept('vassals', 'Vasalları')|E].\n\n[development|E] arttırarak, [great_projects|E] tamamlayarak, [innovations|E] keşfederek ve [examinations|E] yoluyla [merit|E] kazanarak Çin'in merkezî eyaletlerini zenginleştirmeyi amaçlarlar.\n$unlockables_advancement$"
 dynastic_cycle_participant_group_expansion_movement: "Genişlemeci $game_concept_movement$"
 dynastic_cycle_participant_group_expansion_movement_desc: "[Concept('dynastic_cycle', 'Hanedan Döngüsünü')|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] [Concept('situation_dynastic_cycle_phase', 'Devrine')|E] doğru itmek isteyen [GetTitleByKey('h_china').GetDefinitiveName] [Concept('vassals', 'Vasalları')|E].\n\nYabancı toprakların fethini kolaylaştırmak için, [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] [Concept('governors', 'Valilerini')|E] güçlendirmeye, [Concept('prowess', 'Dövüş Becerilerini')|E] arttırmaya, [martial_lifestyle|E] eğitimine ve [commander_traits|E] öğrenmeye odaklanırlar.\n$unlockables_expansion$"
 dynastic_cycle_participant_group_pro_hegemon_movement: "[SelectLocalization( GetPlayer.IsValid, 'pro_hegemon_movement_in_game_name', 'Hanedan' ) ] Yanlısı $game_concept_movement$"
 pro_hegemon_movement_in_game_name: "[GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]"
 dynastic_cycle_participant_group_pro_hegemon_movement_desc: "[GetTitleByKey('h_china').GetDefinitiveName] [Concept('vassals', 'Vasalları')|E] arasından, [Concept('son_of_heaven', 'Göklerin Oğlunun')|E] iradesini yakından takip edenler.\n\n[situation.GetTopParticipantGroupByKey('hegemon_ruler').GetNameNoTooltip] hararetle desteklenir, nüfuzlu birer [governors|E] ve [ministers|E] olmayı amaçlarlar. $situation_parameter_pro_hegemon_interaction_boost$ özelliğine sahiptirler."
 dynastic_cycle_participant_group_conservative_movement: "Muhafazakâr $game_concept_movement$"
 dynastic_cycle_participant_group_conservative_movement_desc: "Soyluluğu güçlendirmek isteyen [GetTitleByKey('h_china').GetDefinitiveName] [Concept('vassals', 'Vasalları')|E].\n\n[powerful_families|E] ve şöhretli [dynasties|E] lehine reformlara ve değişimlere odaklanırlar, [merit|E] yerine geleneği yüceltirler.\n$unlockables_conservative$"
 unlockables_advancement: "$BULLET_WITH_TAB$#V $boost_efficiency_interaction$#! [Concept('interaction', 'Etkileşimi')|E] açılır\n$BULLET_WITH_TAB$$scholarly_inspiration_frequency_desc$\n$BULLET_WITH_TAB$[GetCourtPositionType('court_poet_court_position').GetName] [court_position|E] için [aptitude|E] artar\n$BULLET_WITH_TAB$[GetDecisionWithKey('tgp_japan_become_a_poet_decision').GetName] [Concept('decision', 'Kararı')|E] açılır\n$BULLET_WITH_TAB$[GetDecisionWithKey('diligent_development_focus_decision').GetName] [Concept('decision', 'Kararı')|E] açılır"
 unlockables_expansion: "$BULLET_WITH_TAB$#V $damage_efficiency_interaction$#! [Concept('interaction', 'Etkileşimi')|E] açılır\n$BULLET_WITH_TAB$#V $fp3_request_turkic_invasion_interaction$#! [Concept('interaction', 'Etkileşimi')|E] açılır\n$BULLET_WITH_TAB$#V $spar_with_knight_interaction$#! [Concept('interaction', 'Etkileşimi')|E] açılır"
 unlockables_conservative: "$BULLET_WITH_TAB$#V $damage_efficiency_interaction$#! [Concept('interaction', 'Etkileşimi')|E] açılır\n$BULLET_WITH_TAB$[GetDecisionWithKey('movement_petition_decision').GetName] [Concept('decision', 'Kararıyla')|E] [GetLawGroup('candidate_score_laws').GetName] [law|E] grubunu değiştirmeyi talep edebilir\n$BULLET_WITH_TAB$[GetDomicileBuilding('east_asian_estate_reception_hall_01').GetName] [domicile_building_upgrade|E] inşa edebilir"
 dynastic_cycle_participant_group_undecided_movement: "Tarafsız"
 dynastic_cycle_participant_group_undecided_movement_desc: "[GetTitleByKey('h_china').GetDefinitiveName] [Concept('vassals', 'Vasalları')|E] arasından, mevcut [dynastic_cycle|E] durumuna dair henüz bir taraf seçmemiş olanlardır.\n\nİkna edilerek herhangi bir başka [Concept('movement', 'Harekete')|E] katılabilirler."
