 dynastic_cycle: "$game_concept_dynastic_cycle$"
 dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
 situation_dynastic_cycle: "$game_concept_dynastic_cycle$"
 situation_dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
 situation_dynastic_cycle_phase_stability_expansion: "Genişleme"
 situation_dynastic_cycle_phase_stability_expansion_icon: "@tgp_dynastic_cycle_expansion_icon! $situation_dynastic_cycle_phase_stability_expansion$"
 situation_dynastic_cycle_phase_stability_expansion_desc_short: "Bu [Concept('dynastic_cycle_era_short', 'Devirde')|E] İmparatorluk, ülke sınırlarının dışına odaklanarak güçlenmeyi amaçlar: sınırları yatıştırmak, askerî güç, [tributaries|E] ve [silk_road|E] aracılığıyla nüfuzunu genişletmek ister."
 situation_dynastic_cycle_phase_stability_expansion_desc: "$situation_dynastic_cycle_phase_stability_expansion_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Bu nedenle, Çin'i [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] devrinden bu devre reforme etmek için, önce [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName] devrine girilmesi gerekir."
 situation_dynastic_cycle_phase_stability_advancement: "İlerleme"
 situation_dynastic_cycle_phase_stability_advancement_icon: "@tgp_dynastic_cycle_advancement_icon! $situation_dynastic_cycle_phase_stability_advancement$"
 situation_dynastic_cycle_phase_stability_advancement_desc_short: "Bu [Concept('dynastic_cycle_era_short', 'Devirde')|E] İmparatorluk, ülke sınırlarının içine odaklanarak kendini geliştirmeye odaklanır: [innovations|E], kültürel mükemmeliyet, halkın refahı ve [meritorious|E] bir [GetReligionByKey('confucianism_religion').GetAdjective] idaresi kurmak ister."
 situation_dynastic_cycle_phase_stability_advancement_desc: "$situation_dynastic_cycle_phase_stability_advancement_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Bu nedenle, Çin'i [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] devrinden bu devre reforme etmek için, önce [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName] devrine girilmesi gerekir."
 SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA: "Yeterince [situation_catalyst_catalyst|E] tetiklenirse, Çin bu devre [Concept('dynastic_cycle_era_type_unstable', 'Çalkantılı Devirlerden')|E] sonra girer."
 situation_dynastic_cycle_phase_instability_conquest: "Fetih"
 situation_dynastic_cycle_phase_instability_conquest_icon: "@tgp_dynastic_cycle_conquest_icon! $situation_dynastic_cycle_phase_instability_conquest$"
 situation_dynastic_cycle_phase_instability_conquest_desc_short: "Yabancı bir gücün Çin'i fethetmesinin ardından yaşanan bir [dynastic_cycle_era_short|E]."
 situation_dynastic_cycle_phase_instability_conquest_desc: "$situation_dynastic_cycle_phase_instability_conquest_desc_short$\n\nBu devre girebilmek için, Çin'in [Concept('hegemony', 'Hegemonyası')|E] #bold [GetGovernment('celestial_government').GetName|E] [government|E] biçimine sahip olmayan#! ya da #bold $heritage_chinese_name$ olmayan#! bir [Concept('heritage', 'Mirasa')|E] sahip bir [Concept('ruler', 'Hükümdarın')|E] eline geçmeli."
 situation_dynastic_cycle_phase_instability: "Gerilim"
 situation_dynastic_cycle_phase_instability_icon: "@tgp_dynastic_cycle_instability_icon! $situation_dynastic_cycle_phase_instability$"
 situation_dynastic_cycle_phase_instability_desc: "$situation_dynastic_cycle_phase_instability_desc_short$ Eğer [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName] önlenirse, Çin'in [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] veya [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] devrine ulaşması mümkündür.\n\nYeterince [situation_catalyst_catalyst|E] tetiklenirse, Çin bu devre [dynastic_cycle_era_type_stable|E] devrinden sonra girer."
 situation_dynastic_cycle_phase_instability_desc_short: "Bu, huzursuzluğun ama aynı zamanda fırsatın da [Concept('dynastic_cycle_era_short', 'Devridir')|E]. Yolsuzluk, halk ayaklanmaları ve istilalar tehdit olsa da, bilge bir yönetim Çin'i reforme edebilir."
 situation_dynastic_cycle_phase_chaos: "Bölünme"
 situation_dynastic_cycle_phase_chaos_icon: "@tgp_dynastic_cycle_chaos_icon! $situation_dynastic_cycle_phase_chaos$"
 situation_dynastic_cycle_phase_chaos_desc_short: "Yalnızca güçlü bir [Concept('ruler', 'Hükümdarın')|E] Çin'i birleştirebileceği, savaş lordlarının hüküm sürdüğü bir [dynastic_cycle_era_short|E]."
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\nBu devir şu durumlarda başlar:\n$EFFECT_LIST_BULLET$Herhangi bir [dynastic_cycle_era_type_unstable|E] devrinde, yeterince [situation_catalyst_catalyst|E] tetiklenirse\n$EFFECT_LIST_BULLET$Mevcut [son_of_heaven|E], [Concept('mandate_of_heaven', 'Göklerin Buyruğunu')|E] kaybederse\n\n#S Bu devir başladığında#!\n$BULLET$#indent_newline:2 Çin'in [hegemony|E] [Concept('title', 'Unvanı')|E] yok edilir ve önceki [son_of_heaven|E] [Concept('deposed', 'Tahttan İndirilir')|E]#!\n$BULLET$#indent_newline:2 [de_jure|E] hiyerarşisindeki [empire|E] ve [kingdom|E] [Concept('title_tier', 'Seviyesindeki')|E] [titles|E] eğer [Concept('holders', 'Sahiplerinin')|E] [movement_power_i][movement_power_short|E] imparatorlar için [EmptyScope.ScriptValue('high_movement_power_value')], krallar için [EmptyScope.ScriptValue('medium_movement_power_value')] değerlerinin altındaysa yok edilir#!\n$BULLET$#indent_newline:2 Bağımsız [rulers|E], [Concept('elders', 'Bilgelerine')|E] veya [Concept('movement_leaders', 'Hareket Liderlerine')|E] bağlılık yemini eder ya da haraç öder\n$BULLET$Her bağımsız [ruler|E], #V $dynastic_cycle_participant_group_other_rulers$#! [Concept('situation_participant_group', 'Katılımcı Grubuna')|E] katılır#!\n$BULLET$Diğer tüm [Concept('situation_participant_group', 'Katılımcı Grupları')|E] dağıtılır"
 situation_dynastic_cycle_phase_stability: "İstikrar"
 situation_dynastic_cycle_phase_stability_desc: "#D Bu Aşama gösterilmemelidir#!"
