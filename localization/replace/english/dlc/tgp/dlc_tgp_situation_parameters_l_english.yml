 dynastic_cycle_sub_region_peripheries_desc: "[GetSituation('dynastic_cycle').GetSubRegionByKey( 'core' ).GetName] bölgesinin parçası olmayan, ancak hâlâ [son_of_heaven|E] tarafından yönetilen tüm [counties|E]"
