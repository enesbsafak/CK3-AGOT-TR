 game_concept_reinforce_soldiers: "Manuel Takviye"
 game_concept_reinforcements: "Takviyeler"
 game_concept_reinforce_soldiers_desc: "[adventurers|E] and [nomads|E] [men_at_arms|E] sahibi olabilirler fakat bu birlikler [landed|E] [Concept('rulerpossessive', 'Hükümdarlardan')|E] farklı olarak otomatik bir şekilde takviye almaz. Bunun yerine etkileşimler yoluyla yeni askerlerin teşvik edilmesi gerekir."
 game_concept_adventurer_siege_replenishment: "Kuşatma Yenilemesi"
 game_concept_adventurer_siege_replenishment_desc: "[adventurers|E] bir [Concept('holding', 'Yerleşimi')|E] başarıyla [Concept('sieges', 'Kuşattığında')|E], sahip oldukları [Concept('men_at_arms', 'Düzenli Askerlerin')|E] bir kısmı yenilenir.\n\nYerleşimin [loot|E] değerinin #V 2 katıyla#! [army|E] içerisindeki tüm Düzenli Asker [Concept('regiments', 'Birlikleri')|E] yenilenir.\n\n#weak Bu yenilenme yeni askerler alınması veya yerel halkın zorla orduya dâhil edilmesi şeklinde gerçekleşir.#!"
 game_concept_investment_cap: "Yatırım Kapasitesi"
 game_concept_investment_cap_desc: "Bu, karakterin bir [governorship|E] için kendisinin veya başkasının [Concept('candidate_score', 'Adaylık Skoruna')|E] ne kadar yatırımda bulunabileceğini ifade eder.\n\nYaş, [powerful_family_rating_mid|E], [influence_level|E] ve [estate_buildings|E] bu limitte belirleyicidir. Çocukların limiti normalin altındayken, yetişkinlerin yaşları ilerledikçe limiti yükselir."
 game_concept_appointment_succession_law: "Atama Veraset Yasası"
 game_concept_appointment_succession_laws: "Atama Veraset Yasaları"
 game_concept_appointment: "Atama"
 game_concept_appointments: "Atamalar"
 game_concept_appointment_succession: "Atama Veraseti"

 game_concept_appointment_succession_law_desc:0 "$game_concept_appointment_succession_law$ kapsamında [title|E] ve ona bağlı [holdings|E], en yüksek [Concept('candidate_score', 'Adaylık Skoruna')|E] sahip Aday tarafından miras alınır.\n\nTürleri şunlardır:\n$EFFECT_LIST_BULLET$[GetLaw('appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('acclamation_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_ministry_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_grand_marshal_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('japanese_appointment_succession_law').GetName]"
 game_concept_appointment_level: "Atama Seviyesi"
 game_concept_appointment_levels: "Atama Seviyeleri"
 game_concept_appointment_level_desc: "$game_concept_appointment_level$, bazı [Concept('appointment_succession_laws', 'Atama Veraset Yasalarında')|E] [Concept('characters', 'Karakterlerin')|E] geçerli bir aday olma şartıdır.\n\nSeviyeler, belirli bir kaynağa göre belirlenir ve her yasa, şart olarak farklı bir kaynak kullanabilir. Daha yüksek kademedeki bir [title|E] genellikle daha yüksek bir seviye gerektirir.\n\n#weak Örneğin: [GetLaw('celestial_appointment_succession_law').GetName], [merit|E] gerektirir, bir [Concept('duchy', 'Düklüğe')|E] atanmak için [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] veya üstü bir [merit_level|E] gerekirken, bir [Concept('kingdom', 'Krallığa')|E] atanmak için [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] veya üstü gerekir.#! "
 game_concept_seize_peripheral_duchy: "Çevre Düklüğü Ele Geçirme"
 game_concept_seize_peripheral_duchy_desc: "[government_bureaucratic_type|E] [Concept('government_form', 'Yönetim Biçimine')|E] sahip bir [realm|E] ile sınır komşusu olan [rulers|E] tarafından kullanılabilen bir [casus_belli|E].\n\nSavunanın başkentinin [de_jure|E] hiyerarşisinin dışında kalan, komşu bir [Concept('duchy', 'Düklüğün')|E] saldıran tarafından ele geçirilmesine olanak tanır."
