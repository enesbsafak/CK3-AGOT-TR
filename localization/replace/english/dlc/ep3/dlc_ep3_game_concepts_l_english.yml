l_english:
 game_concept_governor: "Vali"
 game_concept_governors: "Valiler"
 game_concept_governed: "Vali"
 game_concept_strategos: "Strategos"
 game_concept_governor_desc: "$game_concept_governor$, [Concept('government_bureaucratic_gov', 'Bürokratik Yönetimlere')|E] sahip [Concept('liege', 'Süzerenlerin')|E] başlıca vasalıdır. Süzeren tarafından, [Concept('realm', 'Ülkenin')|E] belli bir bölümünü yönetmek üzere atanırlar ve sahip oldukları [Concept('governor_efficiency', 'Vali Verimliliğinden')|E] faydalanırlar.\n\n$game_concept_governor$nin [Concept('title', 'Unvanı')|E], beraberindeki [counties|E] ile birlikte [province|E] olarak adlandırılır. Eyalet içerisinde [governance_issues|E] belirebilir, $game_concept_governor$ olarak bu meseleleri çözmeniz gerekir.\n\n$game_concept_governors$ [influence|E] biriktirerek diğer $game_concept_governorships$in [Concept('succession', 'Verasetini')|E] manipüle edebilir."
 game_concept_estate: "Malikâne"
 game_concept_estates: "Malikâneler"
 game_concept_estate_desc: "$game_concept_estate$, [administrative|E] [Concept('realms', 'Ülkelerde')|E] [Concept('noble_families', 'Soylu Ailelerin')|E] [house_head|E] tarafından sahip olunan bir [domicile|E] türüdür. [landed|E] bir [Concept('title', 'Unvandan')|E] bağımsız olarak sahip olunan kişisel mülkleri yansıtırlar.\n\nAilenin servetini ve [Concept('influence', 'Nüfuzunu')|E] güçlendirmek adına burada [estate_buildings|E] inşa edilebilir, sonraki nesiller $game_concept_estate$yi miras olarak devralırlar."
 game_concept_camp: "Kamp"
 game_concept_camps: "Kamplar"
 game_concept_adventurer_camp: "Maceracı Kampı"
 game_concept_adventurer_camps: "Maceracı Kampları"
 game_concept_camp_desc: "$game_concept_camps$, seyyar çadırlar, yük hayvanları ve insanlardan oluşur. Küçük gruplar şeklinde olabilecekleri gibi, devasa bir ordu hâlinde de olabilirler.\n\nHer [GetGovernment( 'landless_adventurer_government' ).GetName], [domicile|E] olarak haritada onlarla beraber hareket eden bir $game_concept_camp$a sahiptir.\n\n[camp_buildings|E], bir bakıma [Concept('counties', 'Kontlukların')|E] görevini görerek $game_concept_adventurers$ için güçlü bonuslar sağlar. [followers|E], örneğin [Concept('family', 'Akrabaları')|E] ve [knights|E], $game_concept_camp$ ile beraber hareket ederler ve [officers|E] olarak atanabilirler.\n\n#WEAK Tıpkı [courts|E] gibi, $game_concept_camps$ da isimsiz bazı [Concept('characters', 'Karakterlere')|E] ev sahipliği yapabilir.\n\n$game_concept_counties$ arasında [Concept('traveling', 'Seyahat')|E] etmedikleri zamanlarda dahi, $game_concept_camps$ bulundukları [Concept('location', 'Konumda')|E] sabit bir şekilde durmazlar, birkaç günde bir yer değiştirirler.#!"
 game_concept_follower: "Takipçi"
 game_concept_followers: "Takipçiler"
 game_concept_follower_desc: "Bir [Concept('adventurer', 'Maceracıya')|E] eşlik eden [unlanded|E] karakterlere $game_concept_follower$ denir.\n\nMekanik olarak [courtiers|E] ile benzeşirler fakat liderlerinden hazzetmemeleri durumunda saygı göstermeye ve sabretmeye daha az meyillidirler.\n\n$game_concept_followers$in karaktere olan ortak [Concept('opinion', 'Görüşü')|E] [Concept('camp_temperament', 'Kamp Huzurunu')|E] belirler.\n\n$game_concept_followers$:\n$BULLET_WITH_TAB$[officer|E] olarak hizmet edebilir\n$BULLET_WITH_TAB$[commander|E] veya [knight|E] olarak [Concept('armies', 'Orduda')|E] hizmet edebilir\n$BULLET_WITH_TAB$[adventurer|E] karakterler tarafından [claims|E] [Concept('war', 'Savaşta')|E] ele geçirilebilir"
 game_concept_camp_temperament: "Kamp Huzuru"
 game_concept_camp_temperament_desc: "$game_concept_camps$, [Concept('court', 'Saraylardan')|E] farklı olarak katı bir hiyerarşiye sahip değildir ve Kampa liderlik eden [adventurer|E] #EMP dışındaki#! önemli [Concept('characters', 'Karakterlerin')|E] homurdanmaları ciddi rahatsızlıklara sebep olabilir.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$, $game_concept_adventurer$ için pozitif [character_modifiers|E] sağlarlar. Bunun için tüm [Concept('characters', 'Karakterlerin')|E] çoğunluk [Concept('opinion', 'Görüşünün')|E] [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] veya yukarısında olması gerekir.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$, $game_concept_adventurer$ için negatif $game_concept_character_modifiers$ verir. Bunun için tüm [Concept('characters', 'Karakterlerin')|E] çoğunluk [Concept('opinion', 'Görüşünün')|E] [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] veya altında olması gerekir.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_opinion$ü bu iki sınırın arasında olan $game_concept_camps$ herhangi bir $game_concept_modifiers$ vermezler.\n\n#WEAK $game_concept_camp_temperament$nun etkisi $game_concept_adventurer_possessive$ [prestige_level|E] ile doğru orantılıdır. $game_concept_adventurer$, ne kadar tanınıyorsa, $game_concept_camp$ın potansiyel faydaları - ve zararları da o kadar keskin olur.#!"
 game_concept_adventurer: "Maceracı"
 game_concept_adventurers: "Maceracılar"
 game_concept_adventurer_desc: "Bir [Concept('camp', 'Kampa')|E] liderlik eden [unlanded|E] [Concept('character', 'Karakterlere')|E] $game_concept_adventurer$ denir.\n\n[vassals|E] yoktur ve normal yöntemlerle gelir elde etmezler, bunun yerine para kazanabilmek için [Concept('task_contracts', 'Sözleşmeler')|E] yapmaları gerekir veya [contact_list|E] üzerinden yardım isteyebilir.\n\n$game_concept_adventurers$ haritada özgürce dolaşabilirler. Öncelikli kaygıları, hayatta kalabilmek için yeterli [Concept('provisions', 'Erzaka')|E] sahip olmaktır.\n\n[crown_authority|E] yerine, çoğu $game_concept_adventurers$ bir [Concept('camp_purpose', 'Kamp Amacına')|E] sahiptir. Bu, ne tür bir grup olduklarını ve neden birlikte olduklarını gösterir.\n\n#WEAK Bu gezginler miras şansı olmayan yedinci çocuklar, hırslı göçebeler, hırçın firariler, meraklı âlimler, kurnaz paralı askerler ve sürgün edilmiş soylular olabilir.\n\nBunları bir araya getiren yegâne unsur, bilinmezlik dolu bir hayattan daha fazlasını arzulamaları ve bunun için yola koyulmuş olmalarıdır.#!"
 game_concept_powerful: "Önemli"
 game_concept_contractor: "İşveren"
 game_concept_contractors: "İşverenler"
 game_concept_contractor_desc: "$game_concept_task_contract$ veren [Concept('character', 'Karakterlere')|E] $game_concept_contractor$ denir.\n\nVerdikleri $game_concept_task_contract$ genellikle onları etkileyecek türden olacaktır ve genellikle [adventurer_possessive|E] ücretini onlar karşılar.\n\n#N [criminal_task_contracts|E] genellikle $game_concept_contractor$ tarafından #BOL verilmez#!, onun yerine onları suistimal etmeye odaklanır - örneğin kolay güvendiğini belli eden birini kandırarak [Concept('gold', 'Altınını')|E] almak gibi.#!"
 game_concept_contract_scheme: "Sözleşme Planı"
 game_concept_contract_schemes: "Sözleşme Planları"
 game_concept_contract_scheme_contract: "Sözleşme"
 game_concept_contract_scheme_desc: "$game_concept_task_contracts$in birçoğu, [Concept('adventurers', 'Maceracıların')|E] bir [Concept('scheme', 'Planı')|E] başarıyla yerine getirmesi gerekir.\n\nBunlar zarar verici planlar olabileceği gibi (mesela [contractor_possessive|E] [Concept('rival', 'Rakibini')|E] ortadan kaldırmak), keyif verici planlar da olabilir (birkaç ay boyunca [Concept('court', 'Saraylarında')|E] eğlendirici hikâyeler anlatmak) veya sıradan planlar olabilir (onlar için çeviri yapmak).\n\nEğer $game_concept_scheme$ başarısız olursa veya bir sebepten terk edilirse, $game_concept_task_contract$ de başarısız olmuş sayılır."
 game_concept_camp_purpose: "Kamp Amacı"
 game_concept_camp_purposes: "Kamp Amaçları"
 game_concept_camp_purpose_purpose: "Amaç"
 game_concept_camp_purpose_purposes: "Amaçlar"
 game_concept_camp_purpose_desc: "$game_concept_camp_purposes$, [Concept('camps', 'Kampların')|E] özgür ruhlu yaşantılarında yasaya en yakın şeydir.\n\n$game_concept_camp$ üyelerini bir arada kalmaya motive eden ana unsuru yansıtır; bu bilimsel bir araştırma, paralı asker hizmeti veya meşru hükümdarı tekrardan tahta geçirmek olabilir.\n\nFarklı $game_concept_camp_purpose_purposes$, farklı [Concept('camp_buildings', 'Kamp Geliştirmelerine')|E] (dolayısıyla farklı [Concept('officers', 'Görevlilere')|E]) sahiptir. Bunlar farklı olayları ve olay seçeneklerini tetikler, hangi [Concept('task_contracts', 'Sözleşmelerin')|E] belireceğini etkiler.\n\n#WEAK $game_concept_camp_purpose$ aynı zamanda $game_concept_adventurer_possessive$ unvanını ve [Concept('followers', 'Takipçilerinin')|E] giyimini etkiler.#!"
 game_concept_mercenary_task_contract: "Paralı Asker Sözleşmesi"
 game_concept_mercenary_task_contracts: "Paralı Asker Sözleşmeleri"
 game_concept_mercenary_task_contract_desc: "$game_concept_mercenary_task_contract$, bir [Concept('character', 'Karaktere')|E] devam etmekte olan bir [Concept('war', 'Savaşı')|E] kazandırmak veya sizin desteğinizle başlatacağı savaşı kazandırmaya odaklanır. Ücret [war_contribution|E] doğrultusunda ve alınan nihai sonuca göre belirlenir."
 game_concept_transport_task_contract: "Taşımacılık Sözleşmesi"
 game_concept_transport_task_contracts: "Taşımacılık Sözleşmeleri"
 game_concept_transport_task_contract_desc: "$game_concept_transport_task_contract$, genellikle [artifacts|E] başta olmak üzere çeşitli eşyaların bir yerden bir yere taşınmasını veya [wards|E] gibi bazı önemli karakterlerin bir yerden bir yere güvenli bir şekilde götürülmesine odaklanır."
 game_concept_treasure_map_task_contract: "Hazine Haritası Sözleşmesi"
 game_concept_treasure_map_task_contracts: "Hazine Haritası Sözleşmeleri"
 game_concept_treasure_map_task_contract_desc: "Yaşlı bir maceracıyı hayatının son hazinesini bulmaya götür."
 game_concept_task_contract: "Sözleşme"
 game_concept_task_contracts: "Sözleşmeler"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ [Concept('adventurers', 'Maceracıların')|E] [gold|E] veya [prestige|E] kazanmasının başlıca yoludur. Bunlara ek olarak [provision|E], [piety|E] ve hatta [artifacts|E] elde edilebilir.\n\nSözleşmeler yerel bir [ruler|E] tarafından gerçekleştirilmesi istenen, genellikle $game_concept_adventurer$nın ücret karşılığında bir [scheme|E] tamamlamasını, [travel|E] tamamlamasını veya onlara içerisinde bulundukları [Concept('war', 'Savaşta')|E] yardım etmesini gerektiren görevlerdir. Sözleşme tamamlandığında [Concept('contractor', 'İşveren')|E] [Concept('contact_list', 'Bağlantı Listesinde')|E] yer edinir.\n\nUzun seyahatler sonrasında veya yeni [Concept('kingdoms', 'Krallıklara')|E] seyahat edilmesiyle yeni $game_concept_task_contracts$ belirir.\n\n$game_concept_task_contract$ öneren $game_concept_ruler$ın [Concept('title_tier', 'Kademesi')|E] ne kadar yüksekse, $game_concept_task_contract_possessive$ [Concept('task_contract_tier_tier', 'Kademesi')|E] de o kadar yüksektir. Yüksek kademe sözleşmeler #EMP çok daha fazla#! ücrete sahiptir.\n\n#alert_trial [Concept('criminal_task_contracts', 'Suç Sözleşmelerine')|E] dikkat edin: ücretleri harikadır fakat dünya [landed|E] bir [Concept('liege', 'Süzerene')|E] nazaran evsiz bir haydutun işlediği suçlara karşı çok daha az sabır gösterir.#!"
