 game_concept_treasure_map_task_contract_desc: "Yaşlı bir maceracıyı hayatının son hazinesini bulmaya götür."
 game_concept_task_contracts_i: "@task_contract_icon!"
 game_concept_task_contract: "Sözleşme"
 game_concept_task_contracts: "Sözleşmeler"
 game_concept_task_contract_possessive: "Sözleşmenin"
 game_concept_task_contracts_possessive: "Sözleşmelerin"
 game_concept_task_contract_desc: "$game_concept_task_contracts$ [Concept('adventurers', 'Maceracıların')|E] [gold|E] veya [prestige|E] kazanmasının başlıca yoludur. Bunlara ek olarak [provision|E], [piety|E] ve hatta [artifacts|E] elde edilebilir.\n\nSözleşmeler yerel bir [ruler|E] tarafından gerçekleştirilmesi istenen, genellikle $game_concept_adventurer$nın ücret karşılığında bir [scheme|E] tamamlamasını, [travel|E] tamamlamasını veya onlara içerisinde bulundukları [Concept('war', 'Savaşta')|E] yardım etmesini gerektiren görevlerdir. Sözleşme tamamlandığında [Concept('contractor', 'İşveren')|E] [Concept('contact_list', 'Bağlantı Listesinde')|E] yer edinir.\n\nUzun seyahatler sonrasında veya yeni [Concept('kingdoms', 'Krallıklara')|E] seyahat edilmesiyle yeni $game_concept_task_contracts$ belirir.\n\n$game_concept_task_contract$ öneren $game_concept_ruler$ın [Concept('title_tier', 'Kademesi')|E] ne kadar yüksekse, $game_concept_task_contract_possessive$ [Concept('task_contract_tier_tier', 'Kademesi')|E] de o kadar yüksektir. Yüksek kademe sözleşmeler #EMP çok daha fazla#! ücrete sahiptir.\n\n#alert_trial [Concept('criminal_task_contracts', 'Suç Sözleşmelerine')|E] dikkat edin: ücretleri harikadır fakat dünya [landed|E] bir [Concept('liege', 'Süzerene')|E] nazaran evsiz bir haydutun işlediği suçlara karşı çok daha az sabır gösterir.#!"
 game_concept_task_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_task_contract_tier: "$TASK_CONTRACT_CONTRACT$ Kademesi"
 game_concept_task_contract_tier_tier: "Kademe"
 game_concept_task_contract_tier_desc: "$game_concept_task_contract_tier$ [Concept('contractor', 'İşverenin')|E] [Concept('title_tier', 'Unvan Kademesini')|E] yansıtır.\n\n[barons|E] ve [counts|E] bir yıldızdır, [dukes|E] iki yıldızdır, [kings|E] ve [emperors|E] ise üç yıldızdır.\n\n$game_concept_contractors$ [Concept('rank', 'Kademeleri')|E] için yetersiz [Concept('prestige_level', 'Şöhret Seviyesine')|E] sahip [Concept('adventurers', 'Maceracılara')|E] iş vermezler. #EMP Ancak ve ancak#! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] olmanız durumunda [kings|E] ve [emperors|E] tarafından muhatap alınırsınız.\n\n$game_concept_task_contract_tier$ ne kadar yüksekse, yapılan işin ücreti de o kadar yüksek olur, bununla beraber genellikle yapılan işin zorluğu da yükselir.\n\n#WEAK [personality|E] ücretin belirlenmesinde rol oynar: [GetTrait('greedy').GetName( GetNullCharacter )] [characters|E] normalin altında ödeme yaparken, [GetTrait('generous').GetName( GetNullCharacter )] veya [GetTrait('profligate').GetName( GetNullCharacter )] $game_concept_characters$ normalden fazla ödeme yaparlar.#!"
 game_concept_governance_issue_i: "@task_contract_icon!"
 game_concept_governance_issue: "$TASK_CONTRACT_ISSUE$"
 game_concept_governance_issues: "$TASK_CONTRACT_ISSUE_PLURAL$"
 game_concept_governance_issue_possessive: "$TASK_CONTRACT_ISSUE_POSSESSIVE$"
 game_concept_governance_issues_possessive: "$TASK_CONTRACT_ISSUE_POSSESSIVE_PLURAL$"
 game_concept_governance_issue_desc: "$game_concept_governance_issue$, [Concept('governor', 'Valilerin')|E] ilgilenebileceği meselelerdir.\n\nBirkaç yılda bir [Concept('province', 'Eyalette')|E] yeni bir mesele belirir ve bu meseleler genellikle $game_concept_governor$ tarafından çözülmesi gereken bir probleme dayanır. Meseleler kendi içerilerinde yeni fırsatlar da doğurabilirler.\n\nMeseleleri başarıyla çözmek [gold|E], [influence|E] ve [GetTrait('governor').GetName(GetNullCharacter)] [Concept('trait', 'Özelliği')|E] için tecrübe kazandırır. Meselenin konusuna bağlı olarak farklı ödüller de olabilir.\n\nHer $game_concept_governance_issue$ sunduğu ödülleri etkileyen bir [Concept('governance_issue_tier_tier', 'Kademeye')|E] sahiptir."
 game_concept_governance_issue_tier_i: "@task_contract_tier_icon!"
 game_concept_governance_issue_tier: "$TASK_CONTRACT_ISSUE$ Kademesi"
 game_concept_governance_issue_tier_tier: "Kademe"
 game_concept_governance_issue_tier_desc: "Her [governance_issue|E], başarıyla çözüldüğünde sunduğu ödülü etkileyen bir $game_concept_governance_issue_tier$ne sahiptir. Yüksek kademedeki Meseleleri çözmek genellikle daha yüksek miktarda [gold|E] veya [influence|E] kazanılmasıyla ve [GetTrait('governor').GetName(GetNullCharacter)] [Concept('trait', 'Özelliği')|E] için daha fazla tecrübe elde edilmesiyle sonuçlanır."
 game_concept_criminal_task_contract: "Suç Sözleşmesi"
