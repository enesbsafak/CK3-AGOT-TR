 game_concept_criminal_task_contract_desc: "$game_concept_criminal_task_contract$, karanlık ama bir o kadar da kazançlı sözleşmelerdir ve tamamlandıklarında @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E] kazandırır.\n\n$trait_gallowsbait$ [Concept('trait', 'Özelliğinde')|E] tecrübe kazanmak tüm dünyanın sizden nefret etmesini ve zaman içerisinde davranışlarınızı tasvip etmeyen [Concept('followers', 'Takipçilerinizin')|E] yanınızdan ayrılmasını beraberinde getirir.\n\n#WEAK $trait_gallowsbait$ negatif bir $game_concept_trait$tir, karakterin düşük seviye bir suçlu olduğunu gösterir. Sarayda işlenen bir cinayet dâhi en azından bir #EMP tarz#! içerir.\n\n[GetDecisionWithKey('wipe_slate_decision').GetName] [Concept('decision', 'Kararı')|E] ile itibarınız temizlenebilir.#!"
