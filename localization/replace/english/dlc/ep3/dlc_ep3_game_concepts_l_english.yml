 game_concept_provincial_army_desc: "Eyalet orduları [administrative|E] [Concept( 'government', 'Yönetime' )|E] sahip [Concept( 'realm', 'Ülkelerde' )|E] bir [governor|E] tarafından yaratılan ve takviye edilen ordulardır.\n\nTamamen [Concept( 'title_men_at_arms', 'Unvan Düzenli Askerlerinden' )|E] oluşur ve [levy|E] yoktur. [Concept( 'men_at_arms', 'Düzenli Askerlerin' )|E] verimliliği [Concept( 'governor', 'Valinin' )|E] [Concept( 'governor_efficiency', 'Verimliliği' )|E] ile belirlenir.\n\n[liege|E], [influence|E] harcayarak orduların kontrolünü elde edebilir.\n\n[governors], başka bir vali ile [allied|E] olmak veya başka bir valinin üzerinde [hook|E] sahibi olmak gibi çeşitli durumlarda askerleri ödünç alabilir.\n\nÖdünç alınan Ordu, ödünç alan [character] ölürse veya tüm süregelen [wars|E] sona ererse geri verilir. Ordular aynı zamanda manuel olarak geri verilebilir."
