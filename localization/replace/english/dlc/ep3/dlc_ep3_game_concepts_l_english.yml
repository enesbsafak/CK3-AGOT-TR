l_english:

 game_concept_administrative_government:0 "İdari Yönetim"

 game_concept_administrative_governments:0 "İdari Yönetimler"

 game_concept_administrative:0 "Özgür Şehir"
 game_concept_administrative_i: "@government_type_administrative!"
 game_concept_administrative_desc: "$game_concept_administrative$, [Concept('characters', 'Karakterlerin')|E] [province|E] adı verilen bölgelere [governor|E] olarak atandıkları ve [Concept('liege', 'Süzerenleri')|E] adına atandıkları bölgeyi idare ettikleri [government_bureaucratic_type|E] bir [Concept('government_form', 'Yönetim Biçimidir')|E].\n\n$game_concept_administrative$ Karakterler [influence|E] sahibidir ve bir [Concept('family_estate', 'Aile Malikânesine')|E] sahip olabilir.\n\n$game_concept_administrative$ [Concept('realm', 'Ülkelerde')|E] sadece [independent|E] [rulers|E] [legitimacy|E] sahibidir, [Concept('vassals', 'Vasalların')|E] Meşruiyeti yoktur.\n\n$admin_cannot_declare_internal_wars$"
 game_concept_imperial_bureaucracy: "İmparatorluk Bürokrasisi"
 game_concept_imperial_bureaucracy_desc: "$game_concept_imperial_bureaucracy$, [administrative|E] [Concept('realms', 'Ülkelerin')|E] merkezileşme seviyelerini ve [Concept('ruler', 'Hükümdarın')|E] [Concept('vassals', 'Vasalları')|E] üzerindeki gücünü yansıtır.\n\nSadece [top_liege|E] $game_concept_imperial_bureaucracy$ni değiştirebilir. İdari $game_concept_vassals$, $game_concept_liege$ ile aynı seviyede sayılırlar.\n\n$game_concept_imperial_bureaucracy$ dört seviyeye sahiptir:\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_3$\n\n$game_concept_imperial_bureaucracy$ni yükseltmek [Concept('realm_size', 'Ülke Büyüklüğüne')|E] ve hükümdarın [Concept('learning_skill', 'Öğrenim Becerisine')|E] göre değişen bir [prestige|E] maliyetine sahiptir."
 game_concept_governor: "Vali"
 game_concept_governor_possessive: "Valinin"
 game_concept_governors: "Valiler"
 game_concept_governors_possessive: "Valilerin"
 game_concept_governed: "Vali"
 game_concept_strategos: "Strategos"
 game_concept_strategos_possessive: "Strategos'un"
 game_concept_strategoi: "Strategoi"
 game_concept_strategoi_possessive: "Strategoi'nin"
 game_concept_governorship: "Valilik"
 game_concept_governorships: "Valilikler"
 game_concept_governor_desc: "$game_concept_governor$, [Concept('government_bureaucratic_gov', 'Bürokratik Yönetimlere')|E] sahip [Concept('liege', 'Süzerenlerin')|E] başlıca vasalıdır. Süzeren tarafından, [Concept('realm', 'Ülkenin')|E] belli bir bölümünü yönetmek üzere atanırlar ve sahip oldukları [Concept('governor_efficiency', 'Vali Verimliliğinden')|E] faydalanırlar.\n\n$game_concept_governor$nin [Concept('title', 'Unvanı')|E], beraberindeki [counties|E] ile birlikte [province|E] olarak adlandırılır. Eyalet içerisinde [governance_issues|E] belirebilir, $game_concept_governor$ olarak bu meseleleri çözmeniz gerekir.\n\n$game_concept_governors$ [influence|E] biriktirerek diğer $game_concept_governorships$in [Concept('succession', 'Verasetini')|E] manipüle edebilir."
 game_concept_candidate_score: "Adaylık Skoru"
 game_concept_candidate_scores: "Adaylık Skorları"
 game_concept_candidate_score_desc: "[Concept('administrative_government', 'İdari Yönetimlerde')|E] bir [Concept('title', 'Unvanın')|E] [Concept('line_of_succession', 'Veraset Sırasında')|E] bulunan [Concept('characters', 'Karakterlerin')|E] bir $game_concept_candidate_score$ bulunur.\n\n[succession|E] durumunda unvanı kimin devralacağı bu skora göre belirlenir ve [schemes|E] yaparak veya [influence|E] kullanarak skorlar değiştirilebilir."
 game_concept_influence: "Nüfuz"
 game_concept_influence_desc: "$game_concept_influence$, [Concept('administrative_government', 'İdari Yönetim Biçimine')|E] sahip [Concept('realm', 'Ülkelerde')|E] [character_possessive|E] siyasi gücünü ve otoritesini temsil eder. \n\n$game_concept_influence$ önemli bir araçtır ve çeşitli yollarla elde edilebilir. Örneğin [governor|E] olarak, [Concept('estate', 'Malikânenizi')|E] geliştirerek veya [Concept('noble_family', 'Soylu Bir Ailenin')|E] [house_head|E] ile müttefik olarak nüfuz kazanabilirsiniz.\n\n$game_concept_influence$ harcayarak yapabileceğiniz öncelikli şeylerden birisi [governorship|E] elde etmektir, bunun yanı sıra diğer Karakterlere istediklerinizi yaptırmanız için önemli bir kaynaktır.\n\nBir karakter $game_concept_influence$ kazandığında, bir sonraki [Concept('influence_level', 'Nüfuz Seviyesine')|E] doğru ilerleme kateder."
 game_concept_influence_i: "@influence_icon!"
 game_concept_influential: "Nüfuzlu"
 game_concept_influence_level: "Nüfuz Seviyesi"
 game_concept_influence_level_desc: "[character_possessive|E] Nüfuz Seviyesi, sahip oldukları siyasi gücü ve imkânı gösterir.\n\nKarakterler [influence|E] kazandıkça, bir sonraki $game_concept_influence_level$ için ilerleme katederler.\n\nNüfuz Seviyeleri şu şekildedir:\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_5' ).GetNameWithTooltip|L]"
 game_concept_influence_levels: "Nüfuz Seviyeleri"
 game_concept_influence_level_impact: "Nüfuz Seviyesi Etkisi"
 game_concept_influence_level_impact_desc: "Nüfuz Seviyesi Etkisi, sahip olduğunuz [Concept('influence_level', 'Nüfuz Seviyesinin')|E] [Concept('modifiers', 'Etkilerini')|E] güçlendirir veya zayıflatır."
 game_concept_title_men_at_arms: "Unvan Düzenli Askerleri"
 game_concept_title_men_at_arms_desc: "$game_concept_title_men_at_arms$, bir [Concept('title', 'Unvana')|E] bağlı [Concept('men_at_arms', 'Düzenli Askerlerdir')|E]. [ruler|E] tarafından kişisel olarak sahip olunmak yerine, belli bir $game_concept_title$a aittirler. Bu durum, $game_concept_title$a sahip olan Karakterin aynı zamanda Unvana bağlı birliklere de sahip olacağı anlamına gelir.\n\n$game_concept_title_men_at_arms$, [administrative|E] başta olmak üzere spesifik [Concept('government_forms', 'Yönetim Biçimlerinde')|E] bulunur."
 game_concept_domicile: "Konut"
 game_concept_domiciles: "Konutlar"
 game_concept_domicile_desc: "$game_concept_domicile$, [administrative|E] ve [adventurer|E] gibi belirli [Concept('government_form', 'Yönetim Biçimine')|E] sahip [Concept('characters', 'Karakterlerin')|E] özel mülküdür.\n\n$game_concept_domicile$, [holdings|E] yerine sahiplerinin öncelikli güç merkezi rolünü oynar ve [domicile_buildings|E] ile geliştirilebilir.\n\nHer $game_concept_domicile$ bir [barony|E] dâhilinde bulunur ve farklı bir konuma taşınabilir. Bu noktada $game_concept_domicile$ Türüne göre çeşitli kısıtlamalar uygulanabilir.\n\nHer $game_concept_domicile$ özel bir topraksız [Concept('title', 'Unvana')|E] sahiptir ve onun [Concept('succession', 'Verasetini')|E] takip eder."
 game_concept_domicile_building: "Konut Binası"
 game_concept_domicile_buildings: "Konut Binaları"
 game_concept_domicile_building_desc: "Tüm [domiciles|E] belirli $game_concept_domicile_buildings$ ile geliştirilebilir, bu binalar [prestige|E] gibi kaynakların yanı sıra, konut sahibine çeşitli faydalar sağlar.\n\nHangi binaların inşa edilebileceği $game_concept_domicile$ türüne bağlıdır ve her tür kendine has farklı bina zincirlerine sahiptir.\n\nBazı $game_concept_domicile_buildings$ [Concept('internal_upgrades', 'İç Geliştirmelere')|E] sahip olabilir."
 game_concept_domicile_build_speed: "[domicile_building|E] İnşaat Süresi"
 game_concept_domicile_travel_speed: "[domicile|E] Hareket Hızı"
 game_concept_domicile_building_upgrade: "İç Geliştirme"
 game_concept_domicile_building_upgrade_desc: "Bazı $game_concept_domicile_buildings$ $game_concept_internal_upgrades$ ile güçlendirilebilir.\n\nGeliştirmeler, diğer $game_concept_domicile_buildings$ ile benzeşse de, sadece spesifik bir bina için inşa edilebilirler. Geliştirmelerin her biri inşa edilebildikleri bina için özeldir."
 game_concept_domicile_building_slot: "$game_concept_domicile_building$ Bölmesi"
 game_concept_domicile_building_slots: "$game_concept_domicile_building$ Bölmeleri"
 game_concept_domicile_building_slot_slot: "Bölme"
 game_concept_domicile_building_slot_slots: "Bölmeler"
 game_concept_domicile_building_slot_desc: "Her [domicile|E], yeni binalar inşa edilebilecek sınırlı sayıda $game_concept_domicile_building_slot_slots$e sahiptir.\n\n[Concept('estate', 'Malikânelerdeki')|E] [GetDomicileBuilding('estate_main_01').GetName] binası veya [Concept('camp', 'Kamplardaki')|E] [GetDomicileBuilding('camp_main_01').GetName] binası gibi ana $game_concept_domicile_building$nın geliştirilmesiyle yeni $game_concept_domicile_building_slot_slots$ aktifleştirilebilir.\n\n#WEAK Kilitli $game_concept_domicile_building_slot_slots$ $game_concept_domicile$ arayüzünden görüntülenebilir, burada görünen $game_concept_domicile_building_slot_slots$den fazlasını edinmek mümkün değildir.#!"
 game_concept_internal_upgrades: "İç Geliştirmeler"
 game_concept_estate: "Malikâne"
 game_concept_estates: "Malikâneler"
 game_concept_family_estate: "Aile Malikânesi"
 game_concept_family_estates: "Aile Malikâneleri"
 game_concept_estate_desc: "$game_concept_estate$, [administrative|E] [Concept('realms', 'Ülkelerde')|E] [Concept('noble_families', 'Soylu Ailelerin')|E] [house_head|E] tarafından sahip olunan bir [domicile|E] türüdür. [landed|E] bir [Concept('title', 'Unvandan')|E] bağımsız olarak sahip olunan kişisel mülkleri yansıtırlar.\n\nAilenin servetini ve [Concept('influence', 'Nüfuzunu')|E] güçlendirmek adına burada [estate_buildings|E] inşa edilebilir, sonraki nesiller $game_concept_estate$yi miras olarak devralırlar."
 game_concept_estate_building: "Malikâne Binası"
 game_concept_estate_buildings: "Malikâne Binaları"
 game_concept_estate_building_desc: "$game_concept_estate_buildings$, [noble_family_possessive|E] [Concept('estate', 'Malikânesinde')|E] yapabileceği özel ve kalıcı geliştirmelerdir.\n\nMalikâne sahibine gelir sağlamak, ailenin [Concept('influence', 'Nüfuzunu')|E] arttırmak, özel [Concept('decisions', 'Kararlara')|E], [Concept('interactions', 'Etkileşimlere')|E] ve daha fazlasına erişim sağlamak adına birçok farklı bina inşa edilebilir."
 game_concept_camp: "Kamp"
 game_concept_camps: "Kamplar"
 game_concept_adventurer_camp: "Maceracı Kampı"
 game_concept_adventurer_camps: "Maceracı Kampları"
 game_concept_camp_desc: "$game_concept_camps$, seyyar çadırlar, yük hayvanları ve insanlardan oluşur. Küçük gruplar şeklinde olabilecekleri gibi, devasa bir ordu hâlinde de olabilirler.\n\nHer [GetGovernment( 'landless_adventurer_government' ).GetName], [domicile|E] olarak haritada onlarla beraber hareket eden bir $game_concept_camp$a sahiptir.\n\n[camp_buildings|E], bir bakıma [Concept('counties', 'Kontlukların')|E] görevini görerek $game_concept_adventurers$ için güçlü bonuslar sağlar. [followers|E], örneğin [Concept('family', 'Akrabaları')|E] ve [knights|E], $game_concept_camp$ ile beraber hareket ederler ve [officers|E] olarak atanabilirler.\n\n#WEAK Tıpkı [courts|E] gibi, $game_concept_camps$ da isimsiz bazı [Concept('characters', 'Karakterlere')|E] ev sahipliği yapabilir.\n\n$game_concept_counties$ arasında [Concept('traveling', 'Seyahat')|E] etmedikleri zamanlarda dahi, $game_concept_camps$ bulundukları [Concept('location', 'Konumda')|E] sabit bir şekilde durmazlar, birkaç günde bir yer değiştirirler.#!"
 game_concept_camp_building: "Kamp Geliştirmesi"
 game_concept_camp_buildings: "Kamp Geliştirmeleri"
 game_concept_camp_building_desc: "$game_concept_camp_buildings$, [camps|E] için özel geliştirmelerdir.\n\nMekanik olarak [domicile_buildings|E] gibi çalışırlar fakat binalardan ziyade sosyal alışkanlıkları veya $game_concept_camps$ için çeşitli odak noktalarını yansıtırlar.\n\nKamp Geliştirmeleri sayesinde aşağıdaki faydalar elde edilebilir:\n$EFFECT_LIST_BULLET$ Yeni [officers|E] açılabilir.\n$EFFECT_LIST_BULLET$ [followers|E] için Güçlü [skill|E] bonusları.\n$EFFECT_LIST_BULLET$ [men_at_arms|E] gücünde artış.\n$EFFECT_LIST_BULLET$ [landed|E] [Concept('rulers', 'Hükümdarların')|E] sahip olduğu bazı eylemleri açmak.\n\n#WEAK [adventurer|E] karakter [landed|E] olduğunda, $game_concept_camp_buildings$ için yapılmış harcamanın bir kısmı [gold|E] olarak iade edilir.#!"
 game_concept_follower: "Takipçi"
 game_concept_followers: "Takipçiler"
 game_concept_following: "Takip Ediyor"
 game_concept_follower_desc: "Bir [Concept('adventurer', 'Maceracıya')|E] eşlik eden [unlanded|E] karakterlere $game_concept_follower$ denir.\n\nMekanik olarak [courtiers|E] ile benzeşirler fakat liderlerinden hazzetmemeleri durumunda saygı göstermeye ve sabretmeye daha az meyillidirler.\n\n$game_concept_followers$in karaktere olan ortak [Concept('opinion', 'Görüşü')|E] [Concept('camp_temperament', 'Kamp Huzurunu')|E] belirler.\n\n$game_concept_followers$:\n$BULLET_WITH_TAB$[officer|E] olarak hizmet edebilir\n$BULLET_WITH_TAB$[commander|E] veya [knight|E] olarak [Concept('armies', 'Orduda')|E] hizmet edebilir\n$BULLET_WITH_TAB$[adventurer|E] karakterler tarafından [claims|E] [Concept('war', 'Savaşta')|E] ele geçirilebilir"
 game_concept_camp_temperament: "Kamp Huzuru"
 game_concept_camp_temperament_desc: "$game_concept_camps$, [Concept('court', 'Saraylardan')|E] farklı olarak katı bir hiyerarşiye sahip değildir ve Kampa liderlik eden [adventurer|E] #EMP dışındaki#! önemli [Concept('characters', 'Karakterlerin')|E] homurdanmaları ciddi rahatsızlıklara sebep olabilir.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! $game_concept_camps$, $game_concept_adventurer$ için pozitif [character_modifiers|E] sağlarlar. Bunun için tüm [Concept('characters', 'Karakterlerin')|E] çoğunluk [Concept('opinion', 'Görüşünün')|E] [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] veya yukarısında olması gerekir.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! $game_concept_camps$, $game_concept_adventurer$ için negatif $game_concept_character_modifiers$ verir. Bunun için tüm [Concept('characters', 'Karakterlerin')|E] çoğunluk [Concept('opinion', 'Görüşünün')|E] [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] veya altında olması gerekir.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! $game_concept_opinion$ü bu iki sınırın arasında olan $game_concept_camps$ herhangi bir $game_concept_modifiers$ vermezler.\n\n#WEAK $game_concept_camp_temperament$nun etkisi $game_concept_adventurer_possessive$ [prestige_level|E] ile doğru orantılıdır. $game_concept_adventurer$, ne kadar tanınıyorsa, $game_concept_camp$ın potansiyel faydaları - ve zararları da o kadar keskin olur.#!"
 game_concept_adventurer: "Maceracı"
 game_concept_adventurers: "Maceracılar"
 game_concept_adventurer_possessive: "Maceracının"
 game_concept_adventurers_possessive: "Maceracıların"
 game_concept_adventurer_i: "@government_type_adventurer!"
 game_concept_adventurer_desc: "Bir [Concept('camp', 'Kampa')|E] liderlik eden [unlanded|E] [Concept('character', 'Karakterlere')|E] $game_concept_adventurer$ denir.\n\n[vassals|E] yoktur ve normal yöntemlerle gelir elde etmezler, bunun yerine para kazanabilmek için [Concept('task_contracts', 'Sözleşmeler')|E] yapmaları gerekir veya [contact_list|E] üzerinden yardım isteyebilir.\n\n$game_concept_adventurers$ haritada özgürce dolaşabilirler. Öncelikli kaygıları, hayatta kalabilmek için yeterli [Concept('provisions', 'Erzaka')|E] sahip olmaktır.\n\n[crown_authority|E] yerine, çoğu $game_concept_adventurers$ bir [Concept('camp_purpose', 'Kamp Amacına')|E] sahiptir. Bu, ne tür bir grup olduklarını ve neden birlikte olduklarını gösterir.\n\n#WEAK Bu gezginler miras şansı olmayan yedinci çocuklar, hırslı göçebeler, hırçın firariler, meraklı âlimler, kurnaz paralı askerler ve sürgün edilmiş soylular olabilir.\n\nBunları bir araya getiren yegâne unsur, bilinmezlik dolu bir hayattan daha fazlasını arzulamaları ve bunun için yola koyulmuş olmalarıdır.#!"
 game_concept_officer: "Görevli"
 game_concept_officers: "Görevliler"
 game_concept_officer_desc: "$game_concept_officers$, bulundukları [camp|E] için belli bir rol üstlenmiş [Concept('followers', 'Takipçilerdir')|E].\n\nMekanik olarak [court_positions|E] ile benzeşirler ve tıpkı onlar gibi $game_concept_officers$in faydası, sahip oldukları [aptitude|E] doğrultusunda belirlenir.\n\n$game_concept_court_positions$ndan farklı olarak, $game_concept_officers$ ücretsiz olarak atanabilir ve aylık bir maaş giderleri yoktur. Buna karşın bir Görevlinin Görevini almak aynı şekilde [prestige|E] kaybı ile sonuçlanır.#!\n\n#WEAK $game_concept_officers$ birçok farklı [camp_buildings|E] ile açılırlar.#!"
 game_concept_imperial_family: "İmparatorluk Ailesi"
 game_concept_imperial_families: "İmparatorluk Aileleri"
 game_concept_imperial: "İmparatorluk"
 game_concept_imperial_family_desc: "$game_concept_imperial_family$ [administrative|E] [Concept('realm', 'Ülkelerde')|E] en güçlü [Concept('house', 'Hanedir')|E]."
 game_concept_noble_family: "Soylu Aile"
 game_concept_noble_families: "Soylu Aileler"
 game_concept_noble_family_possessive: "Soylu Ailelerin"
 game_concept_noble_family_desc: "$game_concept_noble_families$, [administrative|E] [Concept('realm', 'Ülkelerde')|E] güç sahibi [Concept('houses', 'Hanelerdir')|E]. [house_head|E] tarafından yönetilen bir [Concept('estate', 'Malikâneye')|E] sahiptirler ve her zaman bulundukları Ülkenin bir parçası olarak hareket eder, [Concept('influence', 'Nüfuzlarını')|E] arttırmaya ve [provinces|E] edinmeye çalışırlar.\n\nNüfuz sahibi $game_concept_noble_family$ [powerful_family|E] veya [dominant_family|E] olabilirler."
 game_concept_powerful_family: "Önemli Aile"
 game_concept_powerful_families: "Önemli Aileler"
 game_concept_powerful: "Önemli"
 game_concept_powerful_family_desc: "$game_concept_powerful_family$, [administrative|E] [Concept('realm', 'Ülkelerde')|E] nüfuz sahibi [houses|E] ve [Concept('noble_families', 'Soylu Aileleri')|E] temsil eder.\n\nEş zamanlı olarak sadece belli sayıda $game_concept_powerful_family$ bulunabilir ve bunlar [Concept('powerful_family_rating_short', 'Skorları')|E] neticesinde en önde gelen $game_concept_noble_families$ arasından seçilir. [Concept('top_liege', 'Ana Süzerenin')|E] hanesi istisnai olarak her zaman Önemli sayılır.\n\n$game_concept_powerful_family$ üyeleri [Concept('political_schemes', 'Siyasi Planlarda')|E] daha beceriklidir ve diğer [Concept('characters', 'Karakterlerle')|E] olan [Concept('interacting', 'Etkileşimlerinde')|E] istediklerini elde etme ihtimalleri daha fazladır.\n\nÜlke topraklarının önemli bir kısmını kontrol eden Aileler [dominant_family|E] olabilir."
 game_concept_dominant_family: "Baskın Aile"
 game_concept_dominant_families: "Baskın Aileler"
 game_concept_dominant: "Baskın"
 game_concept_dominant_family_desc: "Geniş bir hâkimiyet alanına sahip [Concept('powerful_family', 'Önemli Aileler')|E] $game_concept_dominant_family$ olurlar. Bulundukları [Concept('realm', 'Ülkenin')|E] en yüksek nüfuz sahibi [Concept('house', 'Haneleri')|E] onlardır.\n\n$game_concept_dominant_family$ üyeleri [Concept('political_schemes', 'Siyasi Planlarda')|E] daha beceriklidir ve diğer [Concept('characters', 'Karakterlerle')|E] olan [Concept('interacting', 'Etkileşimlerinde')|E] istediklerini elde etme ihtimalleri daha fazladır.\n\nBir $game_concept_house$, Baskın olabilmesi için Ülkenin [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] kadarını kontrol etmesi gerekir."
 game_concept_house_attribute: "Hane Niteliği"
 game_concept_house_attribute_desc: "Bazı [government|E] biçimlerinde [houses|E], Hane üyelerini etkileyen bir $game_concept_house_attribute$ sahibi olabilir.\n\nFarklı Hane Nitelik türleri şunlardır:\n$EFFECT_LIST_BULLET$[powerful_family_attribute|E]\n$EFFECT_LIST_BULLET$[house_aspiration|E]\n$EFFECT_LIST_BULLET$[mandala_aspect|E]"
 game_concept_powerful_family_attribute: "Önemli Aile Niteliği"
 game_concept_family_attribute: "Aile Niteliği"
 game_concept_powerful_family_attribute_desc: "$game_concept_powerful_family_attribute$, [administrative|E] bir [realm|E] içindeki bir [Concept('house', 'Haneyle')|E] ilişkilendirilen bonuslar bütünüdür. Bu nitelik, $game_concept_house$ üyelerine ve [Concept('liege', 'Süzerene')|E] fayda sağlar.\n\nBu nitelikler, yalnızca $game_concept_house$ bir [powerful_family|E] olarak görüldüğü sürece etkin olur, ayrıca[Concept('dominant_family', 'Baskın Ailelerin')|E] için Aile Nitelikleri, [Concept('liege', 'Süzerene')|E] fayda sağlamaz.\n\n[house_head|E], bu niteliği dilediği an değiştirebilir."
 game_concept_powerful_family_rating: "Önemli Aile Skoru"
 game_concept_powerful_family_rating_short: "Skor"
 game_concept_powerful_family_rating_mid: "Aile Skoru"
 game_concept_powerful_family_rating_desc: "$game_concept_powerful_family_rating$ bir [Concept('powerful_family', 'Önemli Ailenin')|E] ne kadar nüfuz sahibi olduğunu gösterir.\n\nAilenin $game_concept_powerful_family_rating_short$unu arttırmanın birden fazla yolu olsa da, en önemli faktör elde tutulan [governorship|E] sayısıdır.\n\nBir [house|E], Önemli sayılabilmesi için en az [GetDefine('NHouse', 'POWERFUL_HOUSE_MINIMUM_POWER')|V0] $game_concept_powerful_family_rating_short$a sahip olması gerekir."
 game_concept_admin_confirmation: "$admin_confirmation_decision$"
 game_concept_admin_confirmation_desc: "[governors|E], atamalarının [Concept('liege', 'Süzerenleri')|E] resmen ve kamuoyuna açık bir şekilde onaylatılmasını sağlayabilir."
 game_concept_ep3_become_landless_adventurer_decision: "$become_landless_adventurer_decision$ Kararı"
 game_concept_ep3_become_landless_adventurer_decision_desc: "Küçük bir [realm|E] [Concept('ruler', 'Hükümdarının')|E] gönüllü bir şekilde ayrılarak [adventurer|E] olmasını sağlayan, belli [traditions|E] ile açılan [decision|E]"
 game_concept_ep3_purchase_land_interaction: "$purchase_land_interaction$"
 game_concept_ep3_purchase_land_interaction_desc: "[adventurer|E] Karakterin, bir [Concept('ruler', 'Hükümdardan')|E] toprak alarak onun [Concept('realm', 'Ülkesine')|E] yerleşmesini sağlayan [interaction|E]"
 game_concept_ep3_negotiate_settlement_interaction: "$negotiate_settlement_interaction$"
 game_concept_ep3_negotiate_settlement_interaction_desc: "Bir [Concept('ruler', 'Hükümdarın')|E] yerleşim izni tanıyarak [adventurer|E] bir Karakterin [Concept('realm', 'Ülkesine')|E] yerleşmesini sağlayan [interaction|E]"
 game_concept_ep3_laamp_adventurer_invasion_war: "$EP3_LAAMP_INVASION_CB_NAME$"
 game_concept_ep3_laamp_adventurer_invasion_war_desc: "[adventurer|E] Karakterin [war|E] ilan ederek yeni bir [realm|E] kurmasını sağlayan [casus_belli|E]"
 game_concept_contractor: "İşveren"
 game_concept_contractors: "İşverenler"
 game_concept_contractor_possessive: "İşverenin"
 game_concept_contractors_possessive: "İşverenlerin"
 game_concept_contractor_desc: "$game_concept_task_contract$ veren [Concept('character', 'Karakterlere')|E] $game_concept_contractor$ denir.\n\nVerdikleri $game_concept_task_contract$ genellikle onları etkileyecek türden olacaktır ve genellikle [adventurer_possessive|E] ücretini onlar karşılar.\n\n#N [criminal_task_contracts|E] genellikle $game_concept_contractor$ tarafından #BOL verilmez#!, onun yerine onları suistimal etmeye odaklanır - örneğin kolay güvendiğini belli eden birini kandırarak [Concept('gold', 'Altınını')|E] almak gibi.#!"
 game_concept_contract_scheme: "Sözleşme Planı"
 game_concept_contract_schemes: "Sözleşme Planları"
 game_concept_contract_scheme_possessive: "Sözleşme Planının"
 game_concept_contract_schemes_possessive: "Sözleşme Planlarının"
 game_concept_contract_scheme_contract: "Sözleşme"
 game_concept_contract_scheme_desc: "$game_concept_task_contracts$in birçoğu, [Concept('adventurers', 'Maceracıların')|E] bir [Concept('scheme', 'Planı')|E] başarıyla yerine getirmesi gerekir.\n\nBunlar zarar verici planlar olabileceği gibi (mesela [contractor_possessive|E] [Concept('rival', 'Rakibini')|E] ortadan kaldırmak), keyif verici planlar da olabilir (birkaç ay boyunca [Concept('court', 'Saraylarında')|E] eğlendirici hikâyeler anlatmak) veya sıradan planlar olabilir (onlar için çeviri yapmak).\n\nEğer $game_concept_scheme$ başarısız olursa veya bir sebepten terk edilirse, $game_concept_task_contract$ de başarısız olmuş sayılır."
 game_concept_contact_list: "Bağlantı Listesi"
 game_concept_contact_list_contacts: "Bağlantılar"
 game_concept_contact_list_contact: "Bağlantı"
 game_concept_contact_list_desc: "[Concept('adventurers', 'Maceracıların')|E] [Concept('land', 'Toprağı')|E] yoktur fakat bu onların #EMP bağlantılarının#! da olmadığı anlamına gelmez.\n\n$game_concept_contact_list$, başarıyla [task_contract|E] tamamladıkları ve onları desteklemek için bir sebebi olabilecek, örneğin yüksek [opinion|E] sahibi [Concept('family', 'Akrabalar')|E], [friends|E], [lovers|E] ve diğer tüm [Concept('character', 'Karakterlerin')|E] listesidir.\n\n$contact_list_request_interaction|V$ [Concept('character_interaction', 'Etkileşimi')|E] sayesinde $game_concept_contact_list_contacts$dan ekstra olarak faydalanılabilir."
 game_concept_camp_purpose: "Kamp Amacı"
 game_concept_camp_purposes: "Kamp Amaçları"
 game_concept_camp_purpose_purpose: "Amaç"
 game_concept_camp_purpose_purposes: "Amaçlar"
 game_concept_camp_purpose_desc: "$game_concept_camp_purposes$, [Concept('camps', 'Kampların')|E] özgür ruhlu yaşantılarında yasaya en yakın şeydir.\n\n$game_concept_camp$ üyelerini bir arada kalmaya motive eden ana unsuru yansıtır; bu bilimsel bir araştırma, paralı asker hizmeti veya meşru hükümdarı tekrardan tahta geçirmek olabilir.\n\nFarklı $game_concept_camp_purpose_purposes$, farklı [Concept('camp_buildings', 'Kamp Geliştirmelerine')|E] (dolayısıyla farklı [Concept('officers', 'Görevlilere')|E]) sahiptir. Bunlar farklı olayları ve olay seçeneklerini tetikler, hangi [Concept('task_contracts', 'Sözleşmelerin')|E] belireceğini etkiler.\n\n#WEAK $game_concept_camp_purpose$ aynı zamanda $game_concept_adventurer_possessive$ unvanını ve [Concept('followers', 'Takipçilerinin')|E] giyimini etkiler.#!"
 game_concept_mercenary_task_contract: "Paralı Asker Sözleşmesi"
 game_concept_mercenary_task_contracts: "Paralı Asker Sözleşmeleri"
