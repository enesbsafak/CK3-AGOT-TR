 ep3_laamps.8103.t: "$laamp_legitimist_support_contract$ — Tartışma"
 ep3_laamps.8103.intro_1: "[petitioned_ruler.GetName], sandalyesinde kıpırdanıyor, bakışı sizi delip geçiyor.\n\n"
 ep3_laamps.8103.intro_2: "Hava gergin, zira mesele ciddi. [petitioned_ruler.GetName] duruşuyla bu meselenin onun için ne kadar önemli olduğunu gösteriyor.\n\n"
 ep3_laamps.8103.intro_3: "Mumlar değiştirildi, içecekler tazelendi. [petitioned_ruler.GetName] için hizmet edenler, üstlerinin konuşması için gereksiz bir söz söylemeden ayrıldı.\n\n"

 ep3_laamps.8103.no_more_turns_flavor:0 ""Yeterince konuştuk" — der [petitioned_ruler.GetSheHe] sertçe. — "Bu son teklifimiz. Kabul ederek bilgeliğinizi gösterebilirsiniz.""

 ep3_laamps.8103.mid_1:0 ""Bunu önümüzdeki parlak gelecek için bir temel olarak görüyoruz. Teslim edebilecek kapasitede olduğunuzu düşünüyoruz, hayal kırıklığına uğratmayacaksınız. Biz de böyle yargılarda hata yapmayız.""

 ep3_laamps.8103.mid_2:0 ""Evet, evet, bu işe yarayabilir. [petitioned_ruler.GetFaith.HighGodNamePossessive] lütfuyla işe yarayacak! Neden bize daha önce gelmediniz? Başarılı olacaksanız, zamanlamanız üzerinde çalışmalısınız kesin.""

 ep3_laamps.8103.mid_3:0 ""Ha! Askerlerimizle [capital_barony.GetNameNoTier]'e yürüdüğünüzde [claimed_title.GetHolder.GetName]'in yüzünün ifadesini görmeyi çok isterdim. Lütfen biri her ayrıntıyı yazsın.""
