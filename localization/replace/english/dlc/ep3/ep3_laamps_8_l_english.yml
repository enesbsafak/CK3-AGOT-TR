 ep3_laamps.8200.t: "Kampta Yeni Bir Yüz"

ep3_laamps.8200.desc_1:0 "Bir sonraki hareketimizin lojistiğini ölçmeye çalışırken, yoldan geçen devasa biri arabalarımızdan birini zahmetsizce kaldırıyor. Takipçilerimden biri, bu güç gösterisiyle açıkça eğlenmiş, bana koşuyor ve yalvarıyor:\n\n"

ep3_laamps.8200.desc_2:0 "Gece gökyüzü kampımı korkuyla dolduruyor, sadece titreyen kamp ateşiyle aydınlanıyor. Gözümü açtığım anlarda takipçilerimin kasvetli, yorgun yüzlerini görüyorum. Macera arzusu bu gece acı gerçekle buluşuyor, suyla dolu pabuçların, geçen haftanın artıklarını yemenin ve ormanda sürekli hışırtı yapan hayvanlar yüzünden uykumuz bölünüyor.\n\nTek bir kahkaha karanlığı kırıyor. Sonra bir tane daha ve ciddi takipçilerimi kahkaha atan çocuklara dönmüş görüyorum. Böyle bir karanlıkta neşe nadir bir şeydir. Kargaşanın kaynağını arıyorum ve biri önümde saygısını göstermek için eğiliyor ve dansına devam ederek konuşuyor:\n\n"

ep3_laamps.8200.desc_3:0 "Bir süredir [location.county.GetNameNoTier] topraklarının [location.county.GetCulture.GetName] kısımlarında kalıyoruz. Yerel halk kampımızı sık sık ticaret yapmak ya da sadece takılmak için ziyaret ediyor. Son zamanlarda, diğerlerinden daha uzun süre oyalanan birini gördüm. Sanki köyüne geri dönmemek için bir bahane arıyor, bizimle kalıp yeni topraklara seyahat etmek istiyor gibiydi.\n\nKampımda çalışabilecek kuvvete sahip biri için her zaman iş vardır ama her başıboş köpeği davet etmeli miyiz? Bugün, yeterli cesareti topladı ve hazırladığı bu sözlerle önümde durdu:\n\n"

ep3_laamps.8200.a:0 "Hoş geldin, [new_person.GetFirstNameNoTooltip]!"
 ep3_laamps.8200.b: "Lütfen uzaklaş."
 ep3_laamps.8200.c: "Git ve herkese söyle: Uzak durun!"
 ep3_laamps.8200.c.tt: "Önümüzdeki 20 yıl boyunca kimse kampınıza rastgele katılmaya çalışmayacak"
