 ep3_laamps.8103.support_6: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip], #EMP #color_yellow Devasa #!destek sözü verdi - #color_yellow 1800 altın ve 3000 elit asker.#!"
 ep3_laamps.8103.support_5: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip], #EMP #color_yellow Müthiş #!destek sözü verdi - #color_yellow 1500 altın ve 2500 elit asker.#!"
 ep3_laamps.8103.support_4: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip], #EMP #color_yellow Büyük Ölçekli #!destek sözü verdi - #color_yellow 1200 altın ve 2000 elit asker.#!"
 ep3_laamps.8103.support_3: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip], #EMP #color_yellow Önemli #!destek sözü verdi - #color_yellow 900 altın ve 1500 elit asker.#!"
