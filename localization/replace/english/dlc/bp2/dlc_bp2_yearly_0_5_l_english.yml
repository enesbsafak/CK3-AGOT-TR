 bp2_yearly.0631.desc.rationale.nemesis: ""...that odious little worm is surely plotting your downfall, [ROOT.Char.GetFirstNameNoTooltip], just as [rival_successor.GetSheHe]'s plotting mine, and the sundering of all [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]!""
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.warmonger [AGOT: ]
 bp2_yearly.0631.desc.rationale.warmonger: ""... [rival_successor.GetSheHe]'s a fiend and a warmonger, [ROOT.Char.GetFirstNameNoTooltip], one whose appetite for unjust destruction knows no bounds. [rival_successor.GetSheHe|U]'ll plunge all [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] into civil war if given the slightest chance!""
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.rival [AGOT: ]
 bp2_yearly.0631.desc.rationale.rival: ""... the [rival_successor.GetWomanMan]'s a cad of the highest order, [ROOT.Char.GetFirstNameNoTooltip] — a liar, a thief, and a scoundrel intent on sowing strife and discord in your realm"."
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.revenge [AGOT: ]
 bp2_yearly.0631.desc.rationale.revenge: ""... that screeching agent of [regent.GetFaith.DevilName] has committed unspeakable crimes against me and mine, [ROOT.Char.GetFirstNameNoTooltip], and will surely turn [rival_successor.GetHerHis] wrathful spirit against all [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] given the chance"."
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.criminality [AGOT: ]
 bp2_yearly.0631.desc.rationale.criminality: ""... [rival_successor.GetSheHe]'s a known criminal, [ROOT.Char.GetFirstNameNoTooltip], a criminal doubtless looking for more opportunities for sin and vice. The power afforded [rival_successor.GetHerHim] were [rival_successor.GetSheHe] to become [ROOT.Char.GetDiarchTitle]...""
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.opposing_traits [AGOT: ]
 bp2_yearly.0631.desc.rationale.opposing_traits: ""... even speaking to [rival_successor.GetHerHim] for more than a moment could drive a [regent.GetWomanMan] to madness, [ROOT.Char.GetFirstNameNoTooltip] — it's astounding how one [rival_successor.GetWomanMan] can be so very, incredibly wrong about #EMP everything#!"."
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.sins [AGOT: ]
 bp2_yearly.0631.desc.rationale.sins: ""... I cannot countenance sharing a table with the [rival_successor.GetWomanMan], no good [regent.GetFaith.GetAdherentName] could — and you shouldn't either [ROOT.Char.GetFirstNameNoTooltip], not unless you want [rival_successor.GetHerHis] sins imprinting on your frail young heart"."
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.petty_opinions [AGOT: ]
 bp2_yearly.0631.desc.rationale.petty_opinions: ""... it's not even any particular incident, [ROOT.Char.GetFirstNameNoTooltip], it's simply everything about the way the [rival_successor.GetWomanMan] comports [rival_successor.GetHerselfHimself] — given time, [rival_successor.GetSheHe] will turn all [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] against you from sheer irritation alone"."
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.hideousness [AGOT: ]
 bp2_yearly.0631.desc.rationale.hideousness: ""... I mean just #EMP look#! at the [rival_successor.GetWomanMan]! If '[rival_successor.GetWomanMan]' [rival_successor.GetSheHe] can be said to be — I've seen better looking frogs half-squashed by the wheels of carts. Such ugliness doubtless indicates all manner of base sinful urges, bubbling up through [rival_successor.GetHerHis] wretched skin"."
### TODO AGOT-ONLY: bp2_yearly.0631.desc.rationale.generic [AGOT: ]
 bp2_yearly.0631.desc.rationale.generic: ""... wherever [rival_successor.GetSheHe] goes, [rival_successor.GetSheHe] makes enemies, [ROOT.Char.GetFirstNameNoTooltip], myself amongst them. Treat the [rival_successor.GetWomanMan] too kindly, and [rival_successor.GetSheHe]'ll surely take advantage of your generosity and betray you in short order"."
 bp2_yearly.0631.desc.outro: "\n\n"Şimdi ona karşı durmazsanız, benim yerime geçmenin ve size #EMP kalıcı#! zarar vermenin bir yolunu bulabilir.""
 bp2_yearly.0631.a: "Eğer en iyisinin bu olduğunu düşünüyorsan..."
 bp2_yearly.0631.b: "Asla! Bunlar söylediğin çarpık yalanlardan başka bir şey değil!"
 bp2_yearly.0631.b.tt: "[rival_successor.GetFirstNameNoTooltip] hakkında ters bir şey düşünmüyorsunuz."
 bp2_yearly.0631.c.rowdy: "Kişisel bir husumet olduğunu anlayacak kadar yaşlıyım."
 bp2_yearly.0631.c.charming: "İş oraya gelirse onu ikna edebileceğime eminim."
 bp2_yearly.0631.c.curious: "İkinizin de sözüne güvenemem [regent.GetFirstNameNoTooltip]."
 bp2_yearly.0631.c.pensive: "Benim... Benim bunu düşünmem gerekecek."
 bp2_yearly.0631.c.bossy: "Kişisel sorunlarınızı #EMP bana#! getirmeyin."
 bp2_yearly.0641.t: "Taviz"
### TODO AGOT-ONLY: bp2_yearly.0641.desc.intro.request_boilerplate [AGOT: ]
 bp2_yearly.0641.desc.intro.request_boilerplate: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], as your [ROOT.Char.GetDiarchTitle], I need a little extra authority to take care of a matter of some import."
 bp2_yearly.0641.desc.intro.tribal: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)], küçük çalışma odasına girerken peşinden yaşlı bir kanun sözcüsü de girer.\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Bu tanık sizin yemininizi doğrulayacaktır."\n\n"
 bp2_yearly.0641.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] kendinden emin adımlarla küçük çalışma odasına girdi, elinde bir tomar parşömen tutuyordu.\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Rica etsem, bu belgeleri imzalayıp mühürleyebilir misiniz?"\n\n"
### TODO AGOT-ONLY: bp2_yearly.0641.desc.midtro [AGOT: ]
 bp2_yearly.0641.desc.midtro: ""Of course, I'd never approach you empty handed! For this small favor, I'll"
 bp2_yearly.0641.desc.vs_courtly: "en sofistike vasallarınızla konuşacağım ve onların gözüne girmenizi sağlayacağım.""
 bp2_yearly.0641.desc.vs_glory_hound: "en kana susamış vasallarınızla konuşacağım ve onları şanlı kaderinizden emin tutacağım.""
 bp2_yearly.0641.desc.vs_parochial: "en dar görüşlü vasallarınızla konuşacağım ve başkentin onların endişelerinden haberi olduğunu bildireceğim.""
 bp2_yearly.0641.desc.vs_zealot: "en inançlı vasallarınızla konuşacağım ve onları [ROOT.Char.GetFaith.HighGodName] adına olan dindarlığınız konusunda temin edeceğim.""
 bp2_yearly.0641.desc.vs_minority: "daha eklektik vasallarınızla konuşacağım ve diyarınızın çeşitliliğini sabit tutacağım.""
 bp2_yearly.0641.desc.vs_baron: "daha küçük vasallarınızla konuşacağım, soyluların en aşağısını hizaya getireceğim""
 bp2_yearly.0641.desc.dynasty: "en uzaktaki aile üyelerinize bile sizin adınıza gurur verici mektuplar yazdıracağım.""
 bp2_yearly.0641.desc.fellow_vassals: "[ROOT.Char.GetLiege.GetTitledFirstName] vasallarına dostluk mektupları yazacağım ve sizi [ROOT.Char.GetLiege.GetPrimaryTitle.GetDefinitiveName] için sevilen bir dost yapacağım.""
 bp2_yearly.0641.desc.powerful_vassal: "topraklarınızdaki en ileri gelen zenginlerle konuşup seslerinin duyulmasını sağlayacağım.""
 bp2_yearly.0641.desc.hof: "[ROOT.Char.GetFaith.HighGodNamePossessive] seçilmiş temsilcisinin yanındaki konumunuzu güçlendirmek için [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] ile mekutplaşacağım ve övgü dolu şeyler yazacağım.""
 bp2_yearly.0641.desc.realm_priest: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName] ile konuşacağım ve din adamlarıyla iyi ilişkiler içinde kalmanızı sağlayacağım.""
 bp2_yearly.0641.desc.maa_maintenance: "evdeki askerleriniz için fazladan para bulup bulamayacağımıza bakacağım.""
 bp2_yearly.0641.desc.cowed_vassal: "en korkunç vasallarınızdan daha fazla #EMP katkı#! ayarlayacağım.""
 bp2_yearly.0641.desc.war_income: "bu zor zamanlarda toplanacak bir savaş vergisi ayarlayacağım.""
 bp2_yearly.0641.desc.free_ho_hire: "hükmünüz boyunca kullanılmak üzere inancımızın en azılı savaşçılarından bazılarının hizmetlerini ayarlayacağım.""
 bp2_yearly.0641.desc.mercenary_cost_reduction: "topraklarınıza akın eden paralı askerlerden bazılarına indirim ayarlayacağım. Tabii ki hükmünüz boyunca kullanılmak üzere.""
 bp2_yearly.0641.desc.raid_speed: "size zengin yabancı ganimetleri getirmeleri için savaş gruplarınıza katılacak deneyimli akıncılar ayarlayacağım.""
 bp2_yearly.0641.desc.outro.tribal: "\n\nTek yapmam gereken kelimeleri söylemek."
 bp2_yearly.0641.desc.outro.fallback: "\n\nTek yapmam gereken bir mektup karalamak."
 bp2_yearly.0641.a: "Madem öyle diyorsunuz..."
 bp2_yearly.0641.b: "Fazla ileri gidiyorsun, [regent.GetFirstNameNoTooltip]."
 bp2_yearly.0641.c.rowdy: "[ROOT.Char.GetDiarchTitle|U] sensin, kendin hallet!"
 bp2_yearly.0641.c.charming: "En iyisini sen bilirsin, bununla #EMP sen#! ilgilenemez misin?"
 bp2_yearly.0641.c.curious: "Ne kadar sıkıcı, başka bir şey hakkında konuşamaz mıyız?"
 bp2_yearly.0641.c.pensive: "Korkarım ilgilenmem gereken derslerim var."
 bp2_yearly.0641.c.bossy: "Bu beni aşar, istediğinizi yapın."
 bp2_yearly.0641.c.tt: "[regent.GetFirstNameNoTooltip] istediğini yapmakta özgür kalıyor ancak sizin onayınız yok"
 bp2_yearly.0651.t: "Ona Ne Zaman İhtiyacınız Olursa"
 bp2_yearly.0651.desc.intro: "[ROOT.Char.GetDiarchTitle|U] [regent.GetFirstName] hikâyemi dikkatle dinliyor ve"
 bp2_yearly.0651.desc.story.rowdy.invented_game: "yeni icat ettiğim top oyununun kurallarını ayrıntılı olarak açıklarken gözleri ilgi ve şefkâtle parlıyor. Bundan #EMP çok#! gurur duyuyorum."
 bp2_yearly.0651.desc.story.rowdy.climbed_roof: "yeni kuleye çıkmak için izlediğim rotayı anlatırken gözleri ilgi ve şefkâtle parlıyor. Oldukça tehlikeli ama [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] topraklarındaki en iyi tırmanıcı benim."
 bp2_yearly.0651.desc.story.rowdy.prank: "yaptığım son eşek şakasını anlatırak kıkırdarken gözleri ilgi ve şefkâtle parlıyor. Tek gülen ben olabilirim ama #EMP çok#! gülüyordum."
 bp2_yearly.0651.desc.story.charming.composed_poem: "yazdığım bir şiirin ardındaki sembolizmi ve anlamı anlatırken gözleri ilgi ve şefkâtle parlıyor. Sanırım bugüne kadarki en iyi şiirim, ancak henüz kendime şair diyebilir miyim bilmiyorum."
 bp2_yearly.0651.desc.story.charming.new_friend: "ona, oyunlarımla büyülenmiş gibi görünen hizmetçinin çocuklarından birinden bahsederken gözleri ilgi ve şefkâtle parlıyor. Sanırım bir arkadaş edindim, en azından bu sezon için."
 bp2_yearly.0651.desc.story.charming.new_word: "yeni icat ettiğim kelimenin nasıl telaffuz edileceğini açıklarken gözleri ilgi ve şefkâtle parlıyor. Tebaam bu kelimeyi #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! kullanırken gördüğünde çabucak yayılacak."
 bp2_yearly.0651.desc.story.curious.distant_land: "Ona yakın zamanda öğrendiğim uzak diyarlarda yaşayan, garip ve tuhaf insanlardan bahsederken gözleri ilgi ve şefkâtle parlıyor."
 bp2_yearly.0651.desc.story.curious.book_gift: "küçük vasallarımdan birinin benim için aldığı bir kitabın içeriğini ayrıntılı olarak açıklarken gözleri ilgi ve şefkâtle parlıyor. Çok görkemli bir eser değil ama içeriğini büyük bir zevkle okudum."
 bp2_yearly.0651.desc.story.curious.strange_bird: "çizdiğim garip kuşun nasıl tuhaf bir şekilde hareket ettiğini, tüylerinin neye benzediğini anlatmaya çalışarak çizimimin farklı kısımlarını gösteriyorum ve ötüşünü en iyi şekilde taklit ediyorum. Beni dinlerken gözleri ilgi ve şefkâtle parlıyor."
 bp2_yearly.0651.desc.story.pensive.distant_letter: "hakkında hikâyeler duyduğum uzak bir soylu için özenle hazırladığım mektuptan bahsederken gözleri ilgi ve şefkâtle parlıyor. Mektubumun onlara ulaşıp ulaşmayacağını bilmiyorum ama cevap yazabilecekleri düşüncesi bile çok hoş."
 bp2_yearly.0651.desc.story.pensive.foreign_custom: "ona son zamanlarda duyduğum garip bir yabancı geleneği anlatırken gözleri ilgi ve şefkâtle parlıyor. Bu geleneğin [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] topraklarında da olmasını çok isterdim."
 bp2_yearly.0651.desc.story.pensive.draft_law: "taslağını hazırlamaya çalıştığım yasayı gösterirkens gözleri ilgi ve şefkâtle parlıyor. Henüz #EMP tam#! olarak bitmedi ama bu kadar ilerlemiş olmaktan gurur duyuyorum."
 bp2_yearly.0651.desc.story.bossy.servants_caught: "ona tembellik yaparken yakaladığım hizmetçilerden ve onları iş konusundaki gevşek tutumları nedeniyle nasıl titizlikle disipline ettiğimden bahsederken gözleri ilgi ve şefkâtle parlıyor."
 bp2_yearly.0651.desc.story.bossy.court_protocol: "uygulamak istediğim yeni saray protokolünü detaylandırıp ve gösterirken gözleri ilgi ve şefkâtle parlıyor. Bunun [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] topraklarındaki tek [ROOT.Char.GetTitleAsName] olarak saygınlığımı göstereceğini düşünüyorum."
 bp2_yearly.0651.desc.story.bossy.organised_game: "sahadaki diğer çocuklarla nasıl bir oyun düzenlediğimi, onları takımlara ayırdığımı ve her şeyi tek başıma yürüttüğümü anlatırken gözleri ilgi ve şefkâtle parlıyor."
 bp2_yearly.0651.desc.rationale.predecessor: "\n\n"Küçük [ROOT.Char.GetFirstNameNoTooltip], bu şekilde konuştuğunda aynı [predecessor.GetFirstName] gibi oluyorsun", diye iç çekiyor. Belli ki söylediklerim ile anılarına yolculuk yapmış; "aynı [ROOT.Char.Custom2('RelationToMeShort', predecessor)] gibisin.""
 bp2_yearly.0651.desc.rationale.loyalty: "\n\n"Beni gururlandırıyorsun, bunu biliyor musun? Bir çocuk olarak seni korumaktan gurur duyuyorum ve bir gün yetişkin olduğunda yine sana hizmet etmekten gurur duyacağım.""
 bp2_yearly.0651.desc.rationale.compassion: "\n\n"Sana hizmet ettiğim için kendimi çok şanslı hissediyorum, küçük [ROOT.Char.GetFirstNameNoTooltip]" diye iç geçiriyor, "büyüdüğünü görebildiğim için şanslıyım.""
 bp2_yearly.0651.desc.rationale.fallback: "\n\n"Küçük [ROOT.Char.GetFirstNameNoTooltip], bir gün [ROOT.Char.GetTitleAsNameNoTooltip] topraklarının gördüğü gelmiş geçmiş en büyük [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] olacaksın. Dönüştüğün [Select_CString(ROOT.Char.IsFemale, 'kadınla', 'adamla' )] gurur duyuyorum.""
 bp2_yearly.0651.desc.outro: "\n\n"Her zaman yanınızda olacağım [Select_CString(ROOT.Char.IsFemale, 'leydim', 'lordum' )]. [regent.GetFaith.random_NegativeAfterLife|U] yer yüzüne inse bile bana güvenebilirsiniz.""
 bp2_yearly.0651.a: "Ve bana asla ihanet etmeyeceğine yemin mi ediyorsun?"
 bp2_yearly.0651.b: "[ROOT.Char.GetFirstNameNoTooltip] ve [regent.GetFirstNameNoTooltip], sonsuza dek arkadaş!"
 bp2_yearly.0651.c: "Bu güzel ama ben bir hikâye anlatıyordum."
 bp2_yearly.0651.d: "Hadi, gidip saraya günümün nasıl geçtiğini anlatalım!"
 bp2_yearly.0661.t: "Kullanmak için Bir Araç"
### TODO AGOT-ONLY: bp2_yearly.0661.desc [AGOT: ]
 bp2_yearly.0661.desc: ""#EMP The [offended_family.Custom2('GetWomanManGirlBoy', ROOT.Char)] is my [offended_family.Custom2('RelationToMeShort', ROOT.Char)]!#!" shouts [offended_family.GetFirstName], confronting my [ROOT.Char.GetDiarchTitle] [regent.GetFirstName] in one of the many empty halls of [ROOT.Char.GetCapitalLocation.GetName], "you cannot keep me from [ROOT.Char.GetHerHim] like this".\n\nI had not meant to eavesdrop, stumbling across the conversation accidentally whilst chasing a servant, but now I linger just out of sight as the two argue.\n\n"[ROOT.Char.GetSheHe|U] may be your [offended_family.Custom2('RelationToMeShort', ROOT.Char)], but [ROOT.Char.GetSheHe] is #EMP my#! charge, until I deem [ROOT.Char.GetHerHim] ready to manage [ROOT.Char.GetHerHis] own affairs. Till then, I speak for [ROOT.Char.GetTitledFirstName], and in my opinion, your sort is the worst kind of influence on a young mind"."
 bp2_yearly.0661.a: "[regent.GetFirstNameNoTooltip] haklı, kendinden utan [offended_family.GetFirstNameNoTooltip]!"
 bp2_yearly.0661.b: "[offended_family.GetFirstNameNoTooltip] benim [ROOT.Char.Custom2('RelationToMePossessive', offended_family)] ve ona saygı duyacaksın."
 bp2_yearly.0661.c.rowdy: "Bırakayım onlar halletsin, gitmem gereken yerler var."
 bp2_yearly.0661.c.charming: "Burada birisini kayırmanın hiçbir faydası yok."
 bp2_yearly.0661.c.curious: "Büyüleyici ama şu hizmetçi hakkında..."
 bp2_yearly.0661.c.pensive: "Bu tartışmanın bir parçası olmak istemiyorum."
 bp2_yearly.0661.c.bossy: "Gerçekten [ROOT.Char.GetTitleAsNameNoTooltip] olduğumda bu ikisiyle başa çıkabilirim."
