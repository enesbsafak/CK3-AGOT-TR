 bp2_yearly.0601.t: "Doğru Yönetim"
 bp2_yearly.0601.desc.intro: "Bağlı olduğum [ROOT.Char.GetDiarchTitle], [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] bana kendi yönetim metodlarını öğretmeye istekli duruyor."
 bp2_yearly.0601.desc.rationale.disloyal.likes_you: "Bir [ROOT.Char.GetDiarchTitle] olmasına rağmen bu işlerden anlamıyor gibi, yine de iyi bir eğitmen olduğu belli.\n\n"
 bp2_yearly.0601.desc.rationale.neutral.likes_you: "En iyi [ROOT.Char.GetDiarchTitle] sayılmasa da, en azından bana bir şeyler öğretmek için zaman ayırıyor.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.predecessor_hook: "Bir ders geçmiyor ki gelip bana edilen yeminlerden bahsetmesin.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.loyalty_hook: "Dersler başlarken sürekli bana eğitimim dâhil her konuda dürüst olacağına dair yemin ediyor.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.honourable: "Farklı yöntemler konuşulsa da konu sürekli onurlu olmaya bağlanıyor. Öyle ya da böyle nasıl onurlu olunur ve nasıl hayata dâhil edilir onu konuşunuyoruz.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.fallback: "Dersler uzun ama bana kalbinin güzellendiğinden kaynaklanıyor gibi geliyor, en azından onun iyi niyetini hissediyorum.\n\n"
 bp2_yearly.0601.desc.rationale.fallback: "Neden böyle yapıyor ki? Çalışacak zamanım dahi olmadı ama bazen çok üzerime geliyor.\n\n"
 bp2_yearly.0601.desc.skill.boilerplate: "Bugünün dersinde #EMP daha da fazla#!"
 bp2_yearly.0601.desc.diplomacy.arrogant: "devlet yönetimi var. Ona göre her şey yerinde ağırdır, gücünü artır ihtişamın da artsın. Kelimeler gerçek üstünlüğü kurmak için gerekli araçlar olarak kullanılmalıdır."
 bp2_yearly.0601.desc.diplomacy.humble: "devlet yönetimi var. Ona göre esas anahtar empati yapmakta, konuştuğun kişi senden daha önemsiz biri olabilir ama diplomaside alçakgönüllü olmak yüceliği de beraberinde getirir ki, yücelik de gücün göstergesidir."
 bp2_yearly.0601.desc.diplomacy.fallback: "devlet yönetimi var. İyi bir duruş, kaliteli konuşma, retorik, müzakere yeteneği... hepsi yaşlı politikacılar tarafından abartılan fasa fiso şeyler."
 bp2_yearly.0601.desc.martial.wrathful: "askerî teori var. Düşmana merhamet vatana ihanet şiarı ile yola çıkıp, savaş alanında hızlı ve sert olmak gerektiğini savunuyor. En ufak bir laçkalık mağlubiyete sebep olabilir."
 bp2_yearly.0601.desc.martial.calm: "askerî teori var. Her şey sakince muhakeme edilmeli ve adım adım planlama yapılmalı. Ani ve üzerine düşünülmeden alınan aksiyonlar geri dönüşü olmayan sonuçlara sebebiyet verebilir. Kendisinin bu düşünceleri onu dikkatli ve sakin bir savaş stratejisi yürütmeye teşvik ediyor."
 bp2_yearly.0601.desc.martial.fallback: "askerî teori var. Çok temel şeylerden başladı anlatmaya. Nereye kamp kurulur, çok sayıdaki at sahada nasıl idare edilir, hangi düzen ne işe yarar falan filan felan fişmekan..."
 bp2_yearly.0601.desc.stewardship.greedy: "ticaret ve vergiler var. Belli ki para hakkındaki her şey kendisini neşelendirebiliyor. Yüzündeki ifade gerçekten kendine özgü bir para hırsının göstergesi. Daha fazla gümüşün nasıl elde edileneceğine dair kaç tane planı varsa hepsini teker teker saatlerce sayıyor."
 bp2_yearly.0601.desc.stewardship.generous: "ticaret ve vergiler var. Ona göre gümüş sadece bir araç, hiç bir zaman gereğinden fazla değer verilmemeli. Ancak ve ancak çok gerekli olduğu zaman yönetici tarafından toplanmalı, ilk fırsatta da geri verilmeli."
 bp2_yearly.0601.desc.stewardship.fallback: "ticaret ve vergiler var. Her türlü dalaverenin döndüğü, hem soyluların hem de en fakirlerin bile birbirlerinden nasıl çalacaklarını anlatan sayısız yol var. Bu noktada tüm bu yöntemler hayat için gereksiz kandırmacadan başka bir şey değiller."
 bp2_yearly.0601.desc.intrigue.compassionate: "politik hameleler var. Ona göre asıl mesele elini kana bulamadan amacına ulaşmayı bilmekten geçiyor."
 bp2_yearly.0601.desc.intrigue.callous: "politik hameleler var. Ona göre keskin ve net hamleler hedefe ulaşmakta en etkili yolu oluşturur. Gerekli ise amaca ulaşmakta her yol mübahtır. Hiç bir zaman gereksiz merhamet göstermemek gerek ama yanlış aptalca cezalandırmalardan da kaçınılmalı."
 bp2_yearly.0601.desc.intrigue.sadistic: "politik hameleler var. Sürekli rakiplerini nasıl süründüreceğine dair kafa patlatıyor. En ufak bir merhamet olmamakla beraber hamlelerini en fazla ün yayacak şekilde olmasını istiyor. Sevilen biri olmaktansa korkulan biri olmanın her zaman daha iyi bir yol olduğunu söylüyor."
 bp2_yearly.0601.desc.intrigue.fallback: "politik hameleler var. Komplolarla mücadele etme, ima yollarını anlama, gizli grupları çözme... Daha da kötüsü, aslında o anlama gelmeyen birçok söylem ve çıkarımdan bahsediliyor. Bunların hepsi kafa karıştırıcı saçmalıklar."
 bp2_yearly.0601.desc.learning.shy: "felsefe ve teoloji var. Sessizce konuştuğu için sesi zar zor duyuluyor. Ancak geçmiş tecrübelerin ışından yararlanmak adına uzun konuşmalarına dikkat kesilmekten çekinmiyorum."
 bp2_yearly.0601.desc.learning.gregarious: "felsefe ve teoloji var. Neşeli ve samimi tavırlarıyla favori tarihçilerinin ve filozoflarının isimlerini sıralıyor. Ünlü akademisyenler, bolca tartışılmış teoriler ve yönetici olmanın faydaları benzer şekilde yönetme yöntemlerinden bahsediliyor."
 bp2_yearly.0601.desc.learning.fallback: "felsefe ve teoloji var. Tarihin ve felsefenin çok uzak diyarlarda bile tanınan akademisyenlerin isimleriyle sıkıcı bir sohbet geçiyor. Hep aynı konular ama dediğine göre eğitimli bir yönetici halkı daha da çok mutlu edermiş."
 bp2_yearly.0601.desc.child_reaction.disgust: "\n\nBu bana çok yanlışmış gibi geliyor. Öğrencilerine hep böyle davrandığını ve bu tarzının da #EMP iyi#! bir şey olduğunu sanması çok korkutucu bir şey."
 bp2_yearly.0601.desc.child_reaction.admiration: "\n\nBu anlattıkları çok akla yatkın geliyor. Kendisi işin ilmini çözmüş ve bunu karşı tarafa da nasıl #EMP kaliteli#! bir şekilde aktaracağını çok iyi biliyor."
 bp2_yearly.0601.desc.child_reaction.boredom: "\n\nOnun anlatım tarzını #EMP acayip#! sıkıcı ve sığ buluyorum. Ama derse katılmaktan başka çarem de yok. İyi de [ROOT.Char.GetTitleAsNameNoTooltip] olduğumda zaten tüm bunlara ayıracak çok zamanım olmayacak mı?"
 bp2_yearly.0601.option.skill: "Teknik detaylara dikkatini ver."
 bp2_yearly.0601.option.perk: "Tavsiyelerin ruhuna odaklan."
