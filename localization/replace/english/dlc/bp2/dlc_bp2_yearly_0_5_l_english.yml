 bp2_yearly.0611.t: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] Ülkesinin İkinci Başkenti"
 bp2_yearly.0611.desc.intro.bad_history: "Bana geçmişte yapılan şeylere rağmen, [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] halâ benim için [ROOT.Char.GetDiarchTitle] konumunda. Öyle olsa bile, nadiren [regent_capital.GetBaseNameNoTier] dışına çıkıyor.\n\n"
 bp2_yearly.0611.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [ROOT.Char.GetDiarchTitle] olarak çok çalışıyor ve [regent_capital.GetBaseNameNoTier] topraklarındaki ofisinden çıkmıyor.\n\n"
 bp2_yearly.0611.desc.regent_opinion.positive: "Onu beni korumaya çalıştığını ve yetişkin bir [ROOT.Char.GetWomanMan] olana kadar yanımda olacağını biliyorum ama yine de beni her ziyaret ettiğinde daha çok"
 bp2_yearly.0611.desc.regent_opinion.negative: "Beni pek umursamadığını biliyorum ama her ziyaret ettiğinde"
 bp2_yearly.0611.desc.regent_opinion.fallback: "Benim sadece bir çocuk olduğumu düşündüğünü biliyorum ama yine de biraz zaman ayırmaya değer olmalıyım, değil mi? Bunun yerine, ziyaretlerinde tamamen"
 bp2_yearly.0611.desc.government.tribal: "kabile işleriyle ilgileniyor gibi görünüyor. Yetkili biriyle konuşmak, konseye danışmak, resmi mesajları iletmek ya da... ya da..."
 bp2_yearly.0611.desc.government.fallback: "alakasız işlerle ilgileniyor gibi görünüyor. Bazı belgeleri almak, hane mührünü kullanmak, birkaç resmi kişiyle konuşmak ya da... ya da..."
 bp2_yearly.0611.desc.outro: "\n\nBazen onun [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] hakkında değil, sadece #EMP beni#! düşünmesini istiyorum."
 bp2_yearly.0611.a: "Belki samimi bir mektup yazarsam onu ikna edebilirim..."
 bp2_yearly.0611.b: "#BER Ben bir [ROOT.Char.GetTitleAsNameNoTooltip] olarak sözümün dinlenilmesini istiyorum!"
 bp2_yearly.0611.b.tt: "[regent.GetFirstNameNoTooltip] seni önemli toplantılara dâhil edene kadar öfke krizleri geçiriyorsun"
 bp2_yearly.0611.c: "Banane, dışarıda oynamak için daha fazla zaman kalıyor!"
 bp2_yearly.0611.d: "Bir fırsat seziyorum."
 bp2_yearly.0611.d.tt.success: "Ondan zorla bir telafi sözü alıyorsunuz"
 bp2_yearly.0611.d.tt.failure: "Mızmızlanmalarınıza gıcık oldu"
 bp2_yearly.0611.d.tt.failure.deceitful: "[personality|E] olduğundan mütevellit, [regent.GetFirstNameNoTooltip] girişimine saygı gösteriyor"
 bp2_yearly.0611.e: "O uzaklara gittiğinde özel evinde neler olduğunu merak ediyorsunuz"
 bp2_yearly.0611.f.young: "Bana okuyacak başka birini bulacağım!"
 bp2_yearly.0611.f.fallback: "Meh, o olmadan da tarih okuyabilirim."
 bp2_yearly.0611.g: "Hıh, kendi eğlencemi kendim düzenleyebilirim."
 bp2_yearly.0611.g.tt: "Sonraki düzenleyeceğin [GetActivityType('activity_playdate').GetName] [activity|E] ücretsiz olacak ve [characters|E] daha çok katılmak isteyecekler."
 bp2_yearly.0621.t.close_family: "[ROOT.Char.GetTitleAsNameNoTooltip] için hediyeler"
 bp2_yearly.0621.t.fallback: "[regent.Custom('GetAuntUncle')|U] [regent.GetFirstNamePossessiveNoTooltip] Hediyeleri"
 bp2_yearly.0621.desc.intro.bad_history: "Geçmişte [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] bana çok haksızlık yaptı, şimdi de çeşitli hediyelerle bu durumu telafi etmeye kararlı görünüyor.\n\n"
 bp2_yearly.0621.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] son zamanlarda özellikle düşünceli görünüyor. Her zaman bana en iyi hediyeleri getiriyor gibi görünüyor, bu onu tanıdığım en iyi [ROOT.Char.GetDiarchTitle] yapıyor.\n\n"
### TODO AGOT-ONLY: bp2_yearly.0621.desc.midtro [AGOT: ]
 bp2_yearly.0621.desc.midtro: ""Ah, there you are young [ROOT.Char.Custom('MistressMaster')]," [regent.GetSheHe] laughs as I bound into the courtyard, where the [regent.GetWomanMan] awaits with something covered in cloth. "Today, I've got something very special for you", [regent.GetSheHe] whispers, conspiratorially.\n\nWith that, the cloth falls away to reveal"
 bp2_yearly.0621.desc.gift.gold: "bir taç şeklinde şekillendirilmiş gümüş ve altın sikke yığınları."
 bp2_yearly.0621.desc.gift.prestige: "ileri geri atlayarak etrafımda dönen ve benim hakkımda bestelenmiş bir şarkıyı seslendiren şarkıcılar ve dansçılardan oluşan bir grup."
 bp2_yearly.0621.desc.gift.piety: "karmaşık bir [ROOT.Char.GetFaith.HouseOfWorship] modeli ve bağışımla inşa edilecek yeni bir levha."
 bp2_yearly.0621.desc.gift.event_troops: "zırhlı bir görevli, diz çöküp bana sadakat yeminiyle elini uzatıyor."
 bp2_yearly.0621.desc.gift.dog: "sırılsıklam soylu bir tazı, kuyruğunu hızla sallıyor."
 bp2_yearly.0621.desc.gift.cat: "zarif bir kedi, bir elini yukarıda tutarak, beni gördüğü kadar şaşırmış gibi görünüyor."
 bp2_yearly.0621.desc.gift.eagle: "kanatlarını genişçe açmış, bir standa tüneyen kurnaz bir kartal yavrusu."
 bp2_yearly.0621.extra_stuff.success: "[regent.GetFirstName], kısa süre içinde daha fazla hediye bulacak."
 bp2_yearly.0621.extra_stuff.failure: "Elindekilerle yetinmeyi bilmelisin"
 bp2_yearly.0621.a: "Ne güzel bir sürpriz!"
 bp2_yearly.0621.b: "Hmmm... ikiye katlamak için bilek güreşine ne dersin?"
 bp2_yearly.0621.c: "Ufak bi şeyi unutmuş gibi değil misin?"
 bp2_yearly.0621.d: "Bi yerlerde daha fazlasını saklıyorsun, biliyorum..."
 bp2_yearly.0621.e: "Büyük hediyeler vermenin şans getirdiğine dair bir şey okumuştum..."
 bp2_yearly.0621.f: "Tek hediye bu olamaz değil mi?"
 bp2_yearly.0621.g.bad_blood: "Sevgimi satın alamazsın, #EMP [regent.GetFirstNameNoTooltip]#!."
 bp2_yearly.0621.g.good_terms: "Teşekkür ederim ama bende zaten bir tane var. Muhtemelen."
 bp2_yearly.0631.t: "Fısıldanan Sözler"
 bp2_yearly.0631.desc.intro.positive: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U], sadık bir [ROOT.Char.GetDiarchTitle] olduğunu kanıtlamıştır, onun önerileri her zaman benim için en iyisini sağlamaya yönelik olmuştur.\n\nBu yüzden, bana [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] hakkında anlattığı tüm kötü küçük günahlar ve suçlamalar oldukça ciddi ve endişe verici bir durum oluyor.\n\n"
 bp2_yearly.0631.desc.intro.negative: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bir [ROOT.Char.GetDiarchTitle] olarak karışık bir sicile sahip... O, benim kalkanım ve koruyucum olmalıydı ancak daha çok kendi zenginleşmesiyle ilgilenmiş gibi görünüyor.\n\nBu yüzden bana [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] hakkında anlattığı tüm kötü küçük günahlar ve suçlamaları duyunca şaşırtıcı olmayan bir şekilde kuşkuyla karşılıyorum.\n\n"
 bp2_yearly.0631.desc.intro.vague: "[regent.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)|U], söz verdiği gibi bir [ROOT.Char.GetDiarchTitle] olamadı; bazen bana yardım ediyor ama çoğu zaman da sadece kendini düşünüyor gibi görünüyor.\n\nBu yüzden, bana [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] hakkında anlattığı tüm kötü küçük günahlar ve suçlamalar karşısında çok emin olamıyorum, arada kalıyorum.\n\n"
