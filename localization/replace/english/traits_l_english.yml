 trait_despoiler_of_byzantium_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] antik bir Hristiyan imparatorluğunu fetheden ve harabeye çeviren korkunç Latin lordlardan biridir."
 trait_campeador: "Campeador"
 trait_campeador_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] tarafından savaşta gösterilen uzmanlık onun "Savaş Meydanı Şampiyonu" unvanını almasını sağladı."
 trait_violet_poet: "Menekşe Şair"
 trait_violet_poet_desc: "Bir kalbin şarkı söylemesini ve bir sesin gürlemesini aşkın kendisinden daha fazla ne sağlayabilir? [ROOT.GetCharacter.GetFirstNameNoTooltip] bunu oldukça iyi biliyor."
 trait_track_violet_poet: "Coşkulu Ozan"
 trait_track_violet_poet_desc: "Bir şair kendisini yalnızca kelimelerle değil, aynı zamanda ruhu ve bedeniyle de ifade edebilir.\n\n#weak Bu [trait|E] iki farklı şekilde yükseltilebilir: şiir yazarak veya daha #UND şehvetli#! yollara başvurarak."
 trait_knight_errant: "Gezgin Şövalye"
 trait_knight_errant_character: "Gezgin $knight_culture_player_no_tooltip$"
 trait_knight_errant_desc: "Şöhretli bir şövalye olan bu karakter zayıfları savunur, silahsızları korur ve kötüleri yener."
 trait_knight_errant_character_desc: "Şöhretli bir $knight_culture_player_no_tooltip_lowercase$ olan [ROOT.GetCharacter.GetFirstNameNoTooltip] zayıfları savunur, silahsızları korur ve kötüleri yener."
 trait_track_knight_errant: "Doğruyu Yapan"
 trait_track_knight_errant_desc: "Erdemli olduğunu iddia etmek yeterli değildir, kişinin bunu göstermesi gerekir.\n\n#weak Bu [trait|E], onurlu niteliklere sahip Adalet, Dövüş ve Askerî [Concept( 'task_contracts', 'Sözleşmeleri' )|E] tamamlayarak yükseltilebilir."
 the_wake: "Uyanık"
 trait_track_the_wake: "Fens İzcisi"
 trait_track_the_wake_desc: "Kader ağlarını örüyor. Hakkım olanı gerekirse güç kullanarak elde edeceğim.\n\n#weak Bu özellik #BOL $norman$#! [Concept('culture', 'Kültürüne')|E] sahip [Concept('characters', 'Karakterleri')|E] [Concept('battle', 'Muharebede')|E] veya [Concept('single_combat_duel_plural', 'Düelloda')|E] yenilgiye uğratarak yükseltilir.#!"
 the_wake_1: "Sürgün"
 the_wake_2: "Kanunsuz"
 the_wake_3: "Kasap"
 the_wake_4: "Ankou"
 the_wake_5: "$the_wake$"
 the_wake_1_desc: "Zavallı genç Hereweard, sürgündeki soylu. Amacı olmayan bir adam, kaygısız bir serseri. O kadar çok şey yapabilir ki."
 the_wake_2_desc: "Bir amaç bulundu ama yapılması gereken çok iş var. Çamurlu Fens yabancıların kanıyla kıpkırmızı olana kadar devam edecek bir iş."
 the_wake_3_desc: "Daha önemsiz kişiler bu adamın geldiği pis kokulu bataklıklarda debelenir ve boğulur. Bazıları onun bataklıkların üzerinde yürüyebildiğini bile iddia ediyor."
 the_wake_4_desc: "Küçük çocuklara, evlerinden fazla uzaklaşmamaları için Fens'te sinsice dolaşan bir canavarın masalları anlatılır."
 the_wake_5_desc: "Karanlığın içindeki gölge, her zaman uyanık, her zaman tetikte etrafta dolaşır. Kanlı Hereweard, Korkulan Hereweard. Uyanık Hereweard."
 norman_opinion: "Norman Görüşü"
 TRAIT_FLAG_DESC_can_raid: "[Concept( 'raiding', 'Yağma' )|E] yapmaya izin verir"
 trait_immortal: "Ölümsüz"
 trait_immortal_desc: "Bu karakter insanlığın geri kalanından farklıdır. Yıllar geçse de yaşlanmaz ve güçten düşmez."
 trait_immortal_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] insanlığın geri kalanından farklıdır. Yıllar geçse de yaşlanmaz ve güçten düşmez."
 trait_lifestyle_wayfarer: "Yolcu"
 trait_lifestyle_wayfarer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] için seyahat etmek sadece bir araç değildir. Her seferinde günlerce ortadan kaybolup uzak yerler, yüksek dağlar, karanlık mağaralar veya derin ormanlarla ilgili fantastik hikâyeler anlatmak için geri döner."
 trait_lifestyle_voyager: "Seyyah"
 trait_lifestyle_voyager_desc: "En görkemli şehirler, tarihî kalıntılar, uzak diyarların kralları ve kraliçeleri. [ROOT.GetCharacter.GetFirstNameNoTooltip] hepsini görmüştür ve tecrübelerini başkalarıyla paylaşmaktan mutluluk duymaktadır."
 trait_lifestyle_surveyor: "Müfettiş"
 trait_lifestyle_surveyor_desc: "Ülke [ROOT.GetCharacter.GetFirstNameNoTooltip] gözetiminde gelişiyor. İdare anlayışına işleyen seyahat tutkusuyla, vasalları şahsen denetliyor ve yönetimin zorluklarını aşarak toprakların refah olmasını sağlıyor."
 trait_lifestyle_surveyor_adventurer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] arazide seyahat etme konusundaki uzmanlığıyla tanınır. Vahşi doğayı avucunun içi gibi bilir, düşman ordularının etrafından dolaşabilir, pusular kurabilir, bir şehirden diğerine güvenli bir şekilde gidip gelebilir."
 trait_nomadic_philosophy: "Göçebelik"
 trait_nomadic_philosophy_desc: "Bu karakter, bozkırın çetin hayatında doğup büyümüş ve o koşullarda yoğrulmuştur. Yerleşik halklara garip gelse de, göçebelik eşsiz bir güç ve kurnazlık kazandırır.\n\n#weak $nomadic_philosophy_ender$#!"
 trait_nomadic_philosophy_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], bozkırın çetin hayatında doğup büyümüş ve o koşullarda yoğrulmuştur. Yerleşik halklara garip gelse de, göçebelik eşsiz bir güç ve kurnazlık kazandırır.\n\n#weak $nomadic_philosophy_ender$#!"
 nomadic_philosophy_ender: "Kardeşlerime karşı kendim için. Kuzenlerime karşı kardeşlerimle beraber. Diğer boylara karşı kuzenlerim ve kardeşlerimle. Dünyaya karşı ise tüm boyların yanında. "
 trait_lifestyle_seasoned_pastor: "Tecrübeli Çoban"
 trait_lifestyle_seasoned_pastor_desc: "Bu karakter hayvancılıkta ustalaşmıştır ve sürüsünün otlakları en verimli biçimde kullanmasını sağlar."
 trait_lifestyle_seasoned_pastor_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], hayvancılıkta ustalaşmış ve sürüsünün otlaklardan en iyi şekilde faydalanmasını sağlıyor."
