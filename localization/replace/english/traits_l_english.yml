 trait_golden_lineage: "Altın Soy"
 trait_golden_lineage_desc: "Bu karakterin soyundan gelenlerin dünyaya yaptıkları asla unutulamaz. O, ateşin ve fethin altın bir dalıdır."
 trait_golden_lineage_character_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] soyunun dünyaya yaptıkları asla unutulamaz. Onlar ateşin ve fethin altın bir dalıdır."
 descendants_gain_golden_lineage_female: "[golden_lineage.GetShortUIName] adlı karakterin soyundan gelen tüm kadınlar ve onların çocukları"
 descendants_gain_golden_lineage_male: "[golden_lineage.GetShortUIName] adlı karakterin soyundan gelen tüm erkekler ve onların çocukları"
 trait_track_confucian_education: "Konfüçyusçuluk"
 trait_track_confucian_education_desc: "Ölçülülük ve iyilikseverlik sayesinde birlikte daha iyi bir toplum kurabiliriz.\n\n#weak Bu [trait|E], #V $request_mentoring_interaction$#! [character_interaction|E] ya da #V $grand_mentor_court_position$#! veya #V $court_tutor_court_position$#! [Concept('court_positions', 'Saray Pozisyonlarının')|E] [court_position_tasks|E] ile seviye atlayabilir#!"
 trait_confucian_education_character_desc: "Bu karakter, bilgelik yolundaki yolculuğuna yeni başladı."
 trait_confucian_education: "Konfüçyusçuluk Eğitimi"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], bilgelik yolundaki yolculuğuna yeni başladı."
 trait_confucian_education_1: "Hakiki Konfüçyusçu"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], Konfüçyusçu Yol'un engin bilgeliğine bir nebze de olsa tanık olmuştur."
 trait_confucian_education_2: "Çalışkan Klasikçi"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], Konfüçyus'un öğretilerini tevazu ile gündelik yaşamında uygular."
 trait_confucian_education_3: "Erdemli Ahlakçı"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], erdemli bir Konfüçyusçu olmanın ne anlama geldiğini kavramaya başlamıştır."
 trait_confucian_education_4: "Ahlaki Örnek"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], gerçek bir rol modeli olarak Yol'a yaraşır şekilde yaşamaktadır."
 trait_confucian_education_5: "Kusursuz Bilge"
 trait_confucian_education_5_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], Konfüçyusçu çevrelerde adeta bir azizdir. Dört bir yandaki diğer Konfüçyusçular onun ahlaki ve etik kudretini bilir."
