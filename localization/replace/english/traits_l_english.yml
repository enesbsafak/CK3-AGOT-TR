 game_concept_withering_mind_mitigation_desc: "[GetTrait('withering_mind').GetName( GetNullCharacter )] ilerlemesini önlemek mümkün olmasa da, şunlarla yavaşlatabilirsiniz:\n$EFFECT_LIST_BULLET$[friend|E] sahibi olmak #weak (ne kadar çoksa o kadar iyi)#!\n$EFFECT_LIST_BULLET$[lover|E] sahibi olmak #weak (ne kadar çoksa o kadar iyi)#!\n$EFFECT_LIST_BULLET$[Concept('stress', 'Stresi')|E] düşük tutmak\n$EFFECT_LIST_BULLET$[GetTrait('family_first').GetName( GetNullCharacter )] veya [GetTrait('seducer').GetName( GetNullCharacter )] [Concept('traits', 'Özelliklerine')|E] sahip olmak\n$EFFECT_LIST_BULLET$[Concept('traveling', 'Seyahat')|E] etmek ve [Concept('activities', 'Etkinliklere')|E] katılmak\n\nBu etkenlerin çoğu, ilk başta bu [Concept('trait', 'Özelliği')|E] kazanma olasılığını da azaltır."
 game_concept_infirm_mitigation: "Yatalaklığı Hafifletmek"
 game_concept_infirm_mitigation_desc: "Sağlıklı kalmak, yatalaklığı savuşturmanın başlıca yoludur.\n\n[GetTrait('infirm').GetName( GetNullCharacter )] [Concept('trait', 'Özelliği')|E], bir [illness|E] geçirdiğinizde tam bir seviye ve yıllık olarak az miktarda ilerler.\n\nUzun süre hasta kalırsanız, [trait_level_track|E] yıllık olarak çok daha hızlı ilerlemeye başlar. Ayrıca 65 yaşın üzerindeyseniz de ilerleme hızı artar."
 game_concept_elder_traits: "Yaşlılık Sağlık Özellikleri"
 game_concept_elder_traits_desc: "[characters|E] yaşlandıkça, [GetTrait('faltering_heart').GetName( GetNullCharacter )] veya [GetTrait('fragile_bones').GetName( GetNullCharacter )] gibi yaşlılığa bağlı [traits|E] kazanabilir. Bunlar normalde #V 50#! yaş civarında ortaya çıkar ama daha erken de görülebilir.\n\nŞunlara sahipseniz bu özellikleri edinme ihtimaliniz azalır:\n$BULLET_WITH_TAB$İyi [health|E]\n$BULLET_WITH_TAB$[GetTrait('athletic').GetName( GetNullCharacter )], [GetTrait('physique_good_1').GetName( GetNullCharacter )] veya [GetTrait('whole_of_body').GetName( GetNullCharacter )] olmak\n$BULLET_WITH_TAB$#indent_newline:6 [GetTrait('withering_mind').GetName( GetNullCharacter )] için: [GetTrait('family_first').GetName( GetNullCharacter )] ve [GetTrait('seducer').GetName( GetNullCharacter )] özellikleri, [language|E] bilmek, çok sayıda [friend|E] ve [lover|E] sahibi olmak#!\n\nŞunlara sahipseniz bu özellikleri edinme ihtimaliniz artar:\n$BULLET_WITH_TAB$Kötü [health|E]\n$BULLET_WITH_TAB$[GetTrait('drunkard').GetName( GetNullCharacter )] veya [GetTrait('reclusive').GetName( GetNullCharacter )] özellikleri\n$BULLET_WITH_TAB$[GetModifier( 'obese_modifier' ).GetNameWithTooltip] veya [GetModifier( 'malnourished_modifier' ).GetNameWithTooltip] etkileri\n$BULLET_WITH_TAB$Yüksek [stress|E]\n$BULLET_WITH_TAB$Bu özelliklere sahip ebeveynler veya büyük ebeveynler"
