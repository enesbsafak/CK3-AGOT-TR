 innovation_motte: "Toprak Siperi"
 innovation_motte_desc:0 "Basit ama etkili. Kalelerimizi yükseltilmiş topraklar üzerine kurmak düşmanlarımız üzerinde 'üstünlük' sağlamanın en iyi yoludur."
 innovation_motte_chinese: "Hāng Tu" # 夯土
 innovation_motte_chinese_desc: "Basit ama etkili. Tahkimatlarımızı yükseltilmiş topraklar üzerinde 'üstünlük' sağlamanın en iyi yoludur."
 innovation_motte_actual_motte: "Motteler"
 innovation_motte_actual_motte_desc: "$innovation_motte_desc$"
 innovation_catapult:0 "Onager"
 innovation_catapult_desc:0 "Yeniden doldurmak ve ateş etmek yavaş olsa da bunun gibi gücünü bükülmüş iplerden alan katapultlar, düşman tahkimatlarına okçuların menzilinin dışındayken saldırabilmemizi sağlıyor."
 innovation_catapult_chinese: "Kuşatma Arbaleti"
 innovation_catapult_chinese_desc: "Çekiş mesafesini ve gücünü arttırmak için birden fazla yay kullanan, çoğu zaman hareket kabiliyeti için tekerlekli bir çerçeveye monte edilen büyük taşınabilir arbaletler."
 innovation_barracks:0 "Kışlalar"
 innovation_barracks_desc:0 "Askerlerimizin kalabileceği özel binalar inşa ederek büyüyen ordumuzu barındıracak bir alan yaratabiliriz."
 innovation_mustering_grounds:0 "Talim Alanları"
 innovation_mustering_grounds_desc:0 "Savaşmak isteyen askerlere sahip olmak savaşları kazanmak için yeterli değil. Askerlerin bir araya gelip talim yapabileceği alanlar sayesinde daha tecrübeli askerler yetiştirebiliriz."

 innovation_bannus:0 "Bannus"

 innovation_bannus_desc:0 "Muharebede asker komuta etme yetkisi anlamına gelen 'bann', hükümdarlarımıza askerlerin onlar için savaşmasını teşvik eden bir güç veriyor. Böylece büyük ordular kurmak için yasal bir dayanağımız da olur."
 eligible_accolade_vanguard_attribute_ACCOLADES_DLC:0 "Bu [Concept( 'culture', 'kültüre' )|E] mensup [knights|E] [GetAccoladeType('vanguard_attribute').GetName] [Concept( 'accolade', 'mükâfatıyla' )|E] mükâfatlandırılabilir."
 eligible_accolade_vanguard_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_footmen: "[Concept( 'men_at_arms', 'Düzenli Asker' )|E] olarak [GetMaA('armored_footmen').GetName] üretilebilir"
 unlock_maa_onager: "[GetMaA('onager').GetName] [Concept( 'men_at_arms', 'Düzenli Askerini' )|E] açar"
 innovation_quilted_armor:0 "Dolgulu Zırh"
 innovation_quilted_armor_desc:0 "Birçok keten kumaş katmanını birbirine dikerek oluşturulan bu montlar en ağır okları bile durdurabilir. Böylece bir birliğin hepsine ucuza zırh verebiliriz."
 innovation_gavelkind:0 "Eşit Bölünme"
 innovation_gavelkind_desc:0 "İstikrar ve refah birbirini takip eder. Eski hükümdar öldüğünde vasalların güç için savaşması yerine daha önceden belirlenmiş ve eşit bir sistem getirebiliriz. Böylece veraset sırasında yaşanan iç kavgalar ortadan kalkar."
 innovation_crop_rotation:0 "Tarla Rotasyonu"
 innovation_crop_rotation_desc:0 "İki tarla sisteminden üçlü tarla rotasyonuna geçerek her yıl tarlalarımızdaki toprakları kurutmadan daha fazla mahsul alabiliriz."
 innovation_city_planning:0 "Şehir Planlama"
 innovation_city_planning_desc:0 "Şehirlerimizi inşa etmeye başlamadan önce tasarlayarak, eskiden rastgele ortaya çıkan yerleşimler yerine stratejik bölgelere konuşlanmış daha işlevsel ve güzel yerleşimler kurabiliriz."
 innovation_casus_belli:0 "Savaş Sebebi"
 innovation_casus_belli_desc:0 "Güçlü olan haklıdır ilkesi uzun zamandır hüküm sürmüş olsa da savaşlarımız için bir sebep bularak komşularımızın öfkesini üzerimize çekmekten kurtuluruz."
 innovation_plenary_assemblies:0 "Genel Meclisler"
 innovation_plenary_assemblies_desc:0 "Etkili bir şekilde hüküm sürmek için ülkedeki tüm özgür adamları bir araya getirip yasama sorunlarını çözmeliyiz. Bu toplantılara katılmak zorunludur, katılmayanlar ceza alır ve alınan kararları etkileyemez."
 innovation_development_01:0 "Kamu İşleri"
 innovation_development_01_desc:0 "Yollar, okullar ve su kemerleri gibi kamu için yararlı yapıları inşa ederek yerleşimlerimizin daha fazla büyümesini ve refaha kavuşmasını sağlayabiliriz."
 innovation_currency_01:0 "Para Birimi"
 innovation_currency_01_desc:0 "Takas yapmak yavaş ve verimsiz. Deniz kabuğu veya metal parçacıkları gibi resmî olarak tanınan bir para birimi belirleyerek ülkemiz içindeki ticareti arttırabilir, fikirlerin daha hızlı yayılmasını sağlayabiliriz."
 innovation_ledger:0 "Hesap Defteri"
 innovation_ledger_desc:0 "Topraklarımız büyüdükçe neye sahip olduğumuzu gösteren daha iyi bir yola ihtiyacımız var. Varlıklarımızın defterini tutmak o anda sahip olduğumuz kaynakları kolayca görebilmemizi sağlar."
 innovation_viking_tradition:0 "Viking Taktikleri"
 innovation_viking_tradition_desc:0 "Kuzeyliler ticarette olduğu kadar korsanlıkta da oldukça yeteneklidir. Pek azı aniden nehir kıyısında beliren bir tehdide karşı koyabilir ve viking savaşçıları bu gibi taktiklerde ustalaşmıştır."
 innovation_longboats:1 "Uzun Gemiler"
 innovation_longboats_desc:1 "Uzun gemilerimiz neredeyse her yere gidebilir ve hava durumu kötü olduğunda bile denize açılmamıza izin verir. Bu gemilerin sayesinde denizlerde olağanüstü bir hareketliliğe sahip oluruz."
 innovation_war_camels:0 "Savaş Develeri"
 innovation_war_camels_desc:0 "Develer doğal olarak çöl arazilerinde yaşamaya yatkındırlar ama muharebe hayvanları değillerdir. Yetiştiricilerimiz ve eğitmenlerimiz bunu düzeltip bize kumlar üzerinde hâkimiyet kurabileceğimiz bir süvari gücü verecek."
 eligible_accolade_camelry_attribute_ACCOLADES_DLC:0 "Bu [Concept( 'culture', 'kültüre' )|E] mensup [knights|E] [GetAccoladeType('camelry_attribute').GetName] [Concept( 'accolade', 'mükâfatıyla' )|E] mükâfatlandırılabilir."
 eligible_accolade_camelry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"
 innovation_elephantry:0 "Filcilik"
 innovation_elephantry_desc:0 "Filleri esaret altındayken yetiştirmek zordur, bu nedenle her fil binici kendi vahşi filini yakalayıp eğitmelidir. Bu demek oluyor ki bu devasa canavarları muharebede kullanmanın bir sanatı var, biz de bu sanat üzerinde ustalaşmak istiyoruz."
 eligible_accolade_elephantry_attribute_ACCOLADES_DLC:0 "Bu [Concept( 'culture', 'kültüre' )|E] mensup [knights|E] [GetAccoladeType('elephantry_attribute').GetName] [Concept( 'accolade', 'mükâfatıyla' )|E] mükâfatlandırılabilir."
 eligible_accolade_elephantry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 innovation_wootz_steel:0 "Wootz Çeliği"
 innovation_wootz_steel_desc:0 "Hinduwani veya Seric çeliği olarak da bilinir, karbonu zengin olan bu metal silah yapmak için harikadır. Wootz çeliği dünyadaki en iyi çelik olarak alınıp satılır. Tarih boyunca Arap, Mısırlı, Çinli ve hatta Romalı tüccarların ilgisini çekmiştir."
 innovation_african_canoes:0 "Batı Afrika Kanoları"
 innovation_african_canoes_desc:0 "Batı Afrika'nın büyük kanoları nehirlerden geçmek ve gereken yere hızlıca asker göndermek için iyidir."
 innovation_table_of_princes:0 "Prensler Masası"
 innovation_table_of_princes_desc:0 "Prensler Masası, Bohemyalı hükümdarların tahtıdır ve masada oturan kişi meşru hükümdar olarak kabul edilir. Hane büyüklüğü kanununa göre unvanlar hanedanın en yaşlı mensubuna verilir."
 unlock_single_heir_dynasty_house_changing:0 "$single_heir_dynasty_house$ yasasını tüm [crown_authority|E] seviyelerinde seçebilir"
 tradition_visigothic_codes_name:0 "$innovation_visigothic_codes$"
 tradition_visigothic_codes_desc:0 "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes:0 "Vizigot Kanunları"
 innovation_visigothic_codes_desc:0 "Vizigotların diğer eski gelenekleri dünyadan silinmiş olsa da Pirenelerin çocukları antik kuralları unutmadı. Topraklar erkek çocuklar ve kızlar arasında pratik ve eşit bir şekilde dağıtılıyordu."
 unlock_equal_succession_changing:0 "$equal_law$ veraset [Concept( 'law', 'Yasasını' )|E] tüm [crown_authority|E] seviyelerinde seçebilir"
 innovation_battlements:0 "Dış Surlar"
 innovation_battlements_desc:0 "Kalenin dışına da bir sur örerek buraya konuşlandırdığımız okçular ile savunmamızı arttırabiliriz."
 innovation_mangonel:0 "Mangonel"
 innovation_mangonel_desc:0 "Önemli bir katapult gelişimi olan çekiş güçlü mangoneller, gücünü bükmeyle alan kuşatma silahlarından daha hızlı yeniden doldurulabilir ve ateş edilebilirdi."
 innovation_mangonel_chinese: "Bulut Merdivenleri"
 innovation_mangonel_chinese_desc: "Kalkanlar, çıkrıklar, tırmanma kancaları ve makaralı kaldırma düzenekleriyle donatılan menteşeli katlanır kuşatma merdivenleridir. Kuşatmalar sırasında gözlem için yüksek bir gözetleme noktası olarak da kullanılabilir."
 eligible_accolade_besieger_attribute_ACCOLADES_DLC:0 "Bu [Concept( 'culture', 'kültüre' )|E] mensup [knights|E] [GetAccoladeType('besieger_attribute').GetName] [Concept( 'accolade', 'mükâfatıyla' )|E] mükâfatlandırılabilir."
 eligible_accolade_besieger_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"
 innovation_burhs: "Taş Tahkimatlar"
 innovation_burhs_desc: "Dağınık bir şekilde inşa edilen toplanma yerleri ve yönetim merkezleri sağlam taş duvarlarla korunmaktadır."
 innovation_burhs_japan: "Suki" # 柵
 innovation_burhs_japan_desc: "İmparator Tenji hükümdarlığında #italic Mizuki#!'nin inşa edilmesiyle birlikte tahkimatın önemi daha iyi anlaşılır oldu. Bu tür tahkimli merkezleri hem asker toplama yeri hem de yönetim merkezi olarak kullanabiliriz."
 innovation_burhs_chinese: "Wū Bì" # 塢壁
 innovation_burhs_chinese_desc: "Şehirden uzak bölgelere dağınık bir şekilde inşa edilen Wū Bìler hem asker toplama yeri hem de yönetim merkezi olarak kullanabileceğimiz savunaklı yerleşimlerdir."
 innovation_burhs_anglo_saxon: "Burhlar"
 innovation_burhs_anglo_saxon_desc: "Dağınık bir şekilde inşa edilen burhlar, asker toplama yeri ve yönetim merkezi olarak kullanabileceğimiz savunaklı yerleşimlerdir." 
 innovation_burhs_latin: "Castra"
 innovation_burhs_latin_desc: "Eski tahkimat ilkeleri bugün de geçerliliğini korur, bu tür tahkimli merkezleri hem asker toplama yeri hem de yönetim merkezi olarak kullanabiliriz."
 innovation_house_soldiers:0 "Hane Askerleri"
 innovation_house_soldiers_desc:0 "Soylu ailelerimizin gücü arttıkça emirlerini yerine getirecek daha fazla askere ihtiyaç duyuyorlar. Soylular için özel hane askerleri yetiştirerek normal milislerden daha iyi eğitimli ve teçhizatlı askerler elde edebiliriz."
 innovation_horseshoes:0 "Nallar"
 innovation_horseshoes_desc:0 "Toynakları çatlayan atlar kısa sürede topal kalıp çalışamazlar ve muharebeye sürülemezler. Atlarımıza bronzdan veya demirden nallar yaparak toynaklarını sağlıklı ve korunaklı tutabiliriz."
 innovation_arched_saddle:0 "Kavisli Eyer"
 innovation_arched_saddle_desc:0 "Hafif süvari korkulan bir güçtür ama savaş atlarının gerçek potansiyeline ulaşamazlar. Kargılı, ağır zırhlı savaşçılarımız kavisli eyerler sayesinde ata binebilir ve düşman hatlarına hücum ederken hızlarından faydalanabilir."
 eligible_accolade_lancer_attribute_ACCOLADES_DLC:0 "Bu [Concept( 'culture', 'kültüre' )|E] mensup [knights|E] [GetAccoladeType('lancer_attribute').GetName] [Concept( 'accolade', 'mükâfatıyla' )|E] mükâfatlandırılabilir."
 eligible_accolade_lancer_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_horsemen: "[GetMaA('armored_horsemen').GetName] [Concept( 'men_at_arms', 'Düzenli Askerini' )|E] açar"
 innovation_hereditary_rule:0 "Kalıtsal Yönetim"
 innovation_hereditary_rule_desc:0 "Ülkeyi tüm meşru vârisler arasında eşit bir şekilde bölmek halkımızın birlikteliğini bozuyor. Her verasette ülkelerimizi parçalamak yerine kalıtsal bir sistem kurarak refah içinde yaşayan ve istikrarlı bir ülkeye kavuşabiliriz."
 innovation_manorialism:0 "Derebeylik"
 innovation_manorialism_desc:0 "Topraklar soylularımız arasında toplandığı için birçok insan iş bulmada sıkıntı çekiyor. Özgür insanların kira karşılığında tarlalarımızda çalışmasına izin veren ve kirayı ödeyemeyenleri bizlere bağımlı serfler hâline getiren bir sistem getireceğiz."
 innovation_royal_prerogative:0 "Hükümdar İmtiyazları"
 innovation_royal_prerogative_desc:0 "Hükümdarlarımızın ülkeyi yönetme sorumluluğu çok ağır geldiği için sadece onlara özel imtiyazlar vereceğiz."
 innovation_chronicle_writing:0 "Vakayiname Yazımı"
 innovation_chronicle_writing_desc:0 "Ailelerimizin başarıları artık sadece sözlü bir şekilde nesilden nesile geçmeyecek. Hem gelecek nesilleri etkilemek hem de toprakları üzerindeki haklarımızı kanıtlamak için başardığımız her şeyin kaydını tutacağız."
 innovation_armilary_sphere:0 "Küresel Usturlap"
 innovation_armilary_sphere_desc:0 "Hareket eden yüzüklerden oluşan küresel aletler sayesinde cennetlerin hareketini tahmin edebiliriz. Kendi başına oldukça büyüleyici bir astronomik buluş olmasının yanında, karadan uzaktaki sularda yelken açan kaptanlarımıza da yardımcı olacak."
 innovation_baliffs: "Hükümdar Temsilcileri"
 innovation_baliffs_desc: "Bir hükümdar aynı anda her yerde olamaz. Hükümdarın kanunlarını uygulamak için temsilciler atayarak daha büyük bir ülkeyi daha verimli bir şekilde yönetebiliriz."
 innovation_baliffs_bailiffs: "Nezaretçiler"
 innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"
 innovation_baliffs_latin: "Potestas"
 innovation_baliffs_latin_desc: "Antik Roma'da kanun oluşturma, kanunu uygulama ve yargılama yetkisine #italic potestas#! adı verilirdi. Bu konsept devlet görevlilerinin ülke genelinde kanunu uygulama yetkisine zemin olarak oluşturulmuştu. Yerel görevlilere #italic potestas#! vererek, daha geniş bir alanı daha etkili bir şekilde idare edebiliriz."
 innovation_development_02:0 "Halk İdaresi"
 innovation_development_02_desc:0 "Büyük kasabalar sık sık daha karmaşık hâle gelen sorunlarla karşılaşıyor. Halk konseylerine bir miktar otorite vererek kral dâhil olmadan sorunlarını çözebilirler."
 innovation_currency_02:0 "Para Basma"
 innovation_currency_02_desc:0 "Düzensiz para birimlerini kontrol etmek zorlaştı. Belli ağırlıklara sahip olacak şekilde basılan madeni paraları mühürleyerek ticaretin daha güvenli olmasını sağlarız."
 innovation_reconquista:1 "Ruhsal Genişlemecilik"
 innovation_reconquista_desc:0 "İçimizde savaşırken Hispanya'daki kâfirlere uzun süre göz yumduk. Ordularımızı birleştirip onları bu topraklardan sonsuza kadar atmanın vakti geldi!"
 innovation_stem_duchies:0 "Stammesherzogtum"
 innovation_stem_duchies_desc:0 "Farklı kabilelerden gelsek bile iş birliğinin ve bütünlüğün önemini anlıyoruz. İstikrarın güvenliği ve refahı sağladığı yerde özgürlük önemli değildir."
 innovation_ghilman:0 "Gulam"
 innovation_ghilman_desc:0 "Savaştan alınan esirleri köle askerler yaparak ortaya çıkan gulamlar, paralı askerlerden daha ucuz ve daha sadıktır."
 innovation_hoardings:0 "Tahta Bölmeler"
 innovation_hoardings_desc:0 "Burçların ve surların üzerine konulan bu tahta yapılar, surların üstünden dışa doğru uzanır.\n\nOnların sayesinde düşman okçularından korunurken düşmana ok atabilir, taş atabilir veya kaynar yağ dökebiliriz."
 innovation_trebuchet:0 "Trebüşe"
 innovation_trebuchet_desc:0 "Bir mühendislik harikası olan karşı ağırlıklı trebüşeler sayesinde daha önce gelmiş tüm kuşatma silahlarından daha uzağa daha ağır taşlar atabiliriz."
 innovation_trebuchet_chinese: "Seyyar Kuleler"
 innovation_trebuchet_chinese_desc: "Düşmanın taş kulelerini ele geçirmek için, bu tekerlekli uzun ahşap kuleler onlara doğru itilir, askerlerin düşman surlarına bir nebze de olsa güvenli bir şekilde ulaşabilmesi sağlanırdı."
 innovation_castle_baileys:0 "Kale Avluları"
 innovation_castle_baileys_desc:0 "İç kale, kalelerin kalbi olsa da tek önmeli yapı değildir. Ahır ve cephanelik gibi binaları korunan bir alanda inşa ederek her an milislerimizi silahlandırabiliriz."
 innovation_knighthood:0 "Şövalyelik"
 innovation_knighthood_desc:0 "En iyi savaşçılarımızı şövalye yapıp para yerine toprak vererek hem hak ettiklerini almalarını hem de bize sadık olmalarını sağlarız."
 innovation_advanced_bowmaking:0 "İleri Yay Yapıcılığı"
 innovation_advanced_bowmaking_desc:0 "Tarihsel olarak okçular kendi yaylarını yapıp tamir etmiş olsalar da zanaatkârlar daha güçlü ve karmaşık yaylar yapmaya başladı. Yeni tasarımları benimseyerek uzman yay yapıcıları ordumuzun önemli bir parçası yapabiliriz."
 unlock_maa_crossbowmen: "[GetMaA('crossbowmen').GetName] [Concept( 'men_at_arms', 'Düzenli Askerini' )|E] açar"
 eligible_accolade_crossbower_attribute_ACCOLADES_DLC:0 "Bu [Concept( 'culture', 'kültüre' )|E] mensup [knights|E] [GetAccoladeType('crossbowmen_attribute').GetName] [Concept( 'accolade', 'mükâfatıyla' )|E] mükâfatlandırılabilir."
 eligible_accolade_crossbower_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"
 innovation_heraldry:0 "Armacılık"
 innovation_heraldry_desc:0 "Soylu ailelerimizle özleştireceğimiz armalar tasarlayarak aile üyeleri kendileri daha büyük bir şeyin parçası olarak görebilir. Böylece şahsi çıkarları yerine hanedanın itibarını da geliştirmeye çalışırlar."
 innovation_windmills:0 "Yel Değirmenleri"
 innovation_windmills_desc:0 "Dikey yel değirmenlerinin icadı sayesinde rüzgârın gücünü daha iyi kullanabilir, tahılları öğütmek ve hammaddeleri işlemek için daha az işgücü ayırabiliriz."

 innovation_divine_right:0 "Kutsal Hak"

 innovation_divine_right_desc:0 "Hükümdarlarımızı tahta getiren şeyin kutsal irade olduğunu kabul etmeliyiz, onlara karşı çıkanlar kutsallığın kendisine de karşı çıkar."
 innovation_land_grants:0 "Toprak İzinleri"
 innovation_land_grants_desc:0 "Toprak bize bağlı olanlara verebileceğimiz en değerli varlıktır fakat doğrudan sahip olduğumuz toprak miktarı o kadar da fazla değil. Şu ilerideki işlenmemiş topraklar üzerinde tarla kurma izni verirsek kim karşı çıkabilir ki? Herhangi bir çatışma çıksa bile vasallarımızı koruduğumuz için haklı tarafta oluruz!" #krutygetarts
 innovation_scutage:0 "Asker Vergisi"
 innovation_scutage_desc:0 "Her zaman vasallarımızdan ordumuza hizmet etmelerini bekledik ama bazıları ya istemiyor ya da hizmet edemiyor. Yükümlülüklerini çelik yerine altınla yerine getirmelerine izin vererek herkesten hakkımız olanı alabiliriz."
 innovation_guilds:0 "Loncalar"
 innovation_guilds_desc:0 "Topraklarımızın genişledikçe gerçekleşen ticareti de doğrudan kontrol etmek verimsiz bir hâl alıyor. Tüccar ve zanaatkâr topluluklarına lonca kurma izni vererek onların kendi işleri üzerindeki özerkliğini arttırabilir, kârımızı da yükseltebiliriz."
 innovation_development_03:0 "Şehirleşme"

 innovation_development_03_desc:0 "Büyük Roma, Byzantium ve Delhi şehirleri mükemmel ve emsalsiz bir mirasın anıtları olarak ayakta duruyor. Altyapımız geliştikçe ve nüfusumuz arttıkça artık bu antik şehirlere rakip olacak yeni yerleşimler kurmaya başlayabiliriz."
 innovation_currency_03:0 "Bankacılık"
 innovation_currency_03_desc:0 "Büyük ve pahalı alım satımlar için çok miktarda ağır madenî para gerekiyor. Paraları güvenli hazinelerde saklayıp bunları fiziksel olarak hareket ettirmeden sadece sahipliğini değiştirmek büyük miktarlardaki malların daha kolay alınıp satılmasını sağlar."
 innovation_east_settling:0 "Ostsiedlung"
 innovation_east_settling_desc:0 "Doğumuzdaki doğal kaynaklarla dolu topraklarda çok fazla kişi yaşamıyor. Oraya doğru genişlemek ve orada yerleşimler kurmak için bir girişim başlatarak halkımızın refahını arttırabiliriz."
 innovation_seigneurialism:0 "Derebey Mülkleri"
 innovation_seigneurialism_desc:0 "Yerel soylulara daha fazla sorumluluk vererek hem onları mutlu yapabilir hem de kendi mülkümüze daha çok zaman ayırabiliriz."
 innovation_muladi:0 "Muladi"
 innovation_muladi_desc:0 "Savaşlar, yağmalar ve yargılanmalar sonucu tüm dünyada insanlar evlerinden oluyor. Geçmişte ne yaptıklarına bakmadan bu tür kişilere kucak açarak zengin ve refah bir toplum oluşturabiliriz."
 innovation_french_peerage:0 "Soyluluk Rütbeleri"
 innovation_french_peerage_desc:0 "Ülkemizin soylu vasallarının en şanlı olanlarını tanıyarak tahta daha sadık olmalarını sağlayabiliriz."
 innovation_machicolations: "Tepe Mazgalları"
 innovation_machicolations_desc: "Tahta bölmelerin bir geliştirmesi olan tepe mazgalları, aynı işlevi görürken daha dayanıklı ve korunaklı bir hâl aldı."
 innovation_gunpowder: "Barut"
 innovation_gunpowder_desc: "Patlayıcı barutların geliştirilmesi yeni silah türleri ve bunları kullanacak yeni savaşçı tiplerini de beraberinde getirdi. Bu güçlü silahların muharebe alanına sürülmesi, geçmişte düşünülemeyen üretim ve tedarik zincirlerini gerektirse de bu yeni teknolojinin açığa çıkardığı güç, tüm bu maliyetlere değecek kadar etkili."
 innovation_royal_armory:0 "Kraliyet Cephaneliği"
 innovation_royal_armory_desc:0 "Ordularımızın büyüklüğü artarken her askerin iyi bir şekilde zırhlanıp silahlandığından emin olmalıyız. Ordularımızın tüm ekipmanlarını üretebileceğimiz ve depolayabileceğimiz kraliyet cephanelikleri sayesinde amacımıza ulaşabiliriz."
 innovation_standing_armies:0 "Kalıcı Ordular"
 innovation_standing_armies_desc:0 "Milisler sayesinde kalabalık ordulara sahip olsak da ne kadar çalışırsak çalışalım bu askerler düzenli olanlardan her zaman daha kötü durumda olacaktır. Büyük bir kalıcı ordu kurarak ülkemizin çıkarlarını en iyi savaşçıların göz etmesini sağlayabiliriz."
 innovation_sappers:0 "Lağımcılar"
 innovation_sappers_desc:0 "Düşman duvarlarının altı kazılabiliyorsa ne kadar sağlam olduklarının bir önemi yok. Lağımcılar ile düşman savunmalarına alttan ulaşabilir ve en çetin duvarları aşabiliriz."
 innovation_plate_armor:0 "Plaka Zırh"
 innovation_plate_armor_desc:0 "Kişisel korumanın en üstün hâli olan plaka zırhlara boğumlu eklemler ekleyerek daha önceki zırhlardan daha iyi hareket alanı sağlayan ve düşman silahlarının geçmesinin neredeyse imkânsız olduğu zırhlar elde edebiliriz."
 innovation_primogeniture:0 "İlk Doğan Hakkı"
 innovation_primogeniture_desc:0 "Bir krallık, bir vâris. Hükümdarımızın küçük çocukları, miras alamadıkları için terk edilmiş hissedebilir ama veraset krizleriyle bölünmeyen istikrarlı bir ülke kurmanın en iyi yolu bu."
 innovation_cranes:0 "Vinçler"

 innovation_cranes_desc:0 "Unutulmuş bir mühendislik harikası olan ayak değirmenli vinçler, Romalılar tarafından imparatorluklarını inşa ederken kullanılmıştı. Şimdi biz de aynısını yapacağız."
 innovation_noblesse_oblige:0 "Asalet Bunu Gerektirir"
 innovation_noblesse_oblige_desc:0 "Soyluluk sadece sahip olunan imtiyazlar ve haklar değildir. Soyluların ayrıca ülkeye karşı bir görevi, düzgün ve adaletli davranma yükümlülüğü vardır. Soylularımızdan ne beklediğimizi açık bir şekilde belirterek hep birlikte erdemli bir yol izlemeye çalışabiliriz."
 innovation_rightful_ownership:0 "Haklı Mülkiyet"
 innovation_rightful_ownership_desc:0 "Yasal topraklarımıza sahip olmak bizim kutsal hakkımız. Dünyanın da bunu tanıma vakti geldi. Zamanı geçmiş kurallar ve 'terbiyeler' artık bizi durduramaz."
 innovation_ermine_cloaks: "Egzotik Kraliyet Eşyaları"
 innovation_ermine_cloaks_desc: "Herkes bir unvan üzerinde hak sahibi olduğunu iddia edebilir ancak gerçek bir hükümdar olmak için vasallar üzerinde büyüleyici ve ihtişamlı bir etki kurulmalı. Yeni kakım kürklü pelerinler de dâhil olmak üzere kraliyet elbiseleri sayesinde bunu başarabiliriz."
 innovation_ermine_cloaks_ermine: "Kakım Pelerinler"
 innovation_ermine_cloaks_ermine_desc: "Herkes bir unvan üzerinde hak sahibi olduğunu iddia edebilir ancak gerçek bir hükümdar olmak için vasallar üzerinde büyüleyici ve ihtişamlı bir etki kurulmalı. Yeni kakım kürklü pelerinler de dâhil olmak üzere kraliyet elbiseleri sayesinde bunu başarabiliriz."
 innovation_court_officials:0 "Saray Görevlileri"
 innovation_court_officials_desc:0 "Ülkemiz o kadar büyüdü ki artık küçük soylular bile her şeyi etkili bir şekilde idare edemiyor. Basit saray görevlerinden sorumlu olan daha fazla yetkili atayarak yönetimin pürüzsüz bir şekilde işlemeye devam etmesini sağlayabiliriz. "

 innovation_development_04:0 "Rönesans Fikirleri"

 innovation_development_04_desc:0 "Bilim, felsefe ve mantıktaki ilerlemeler ile şehirlerimiz eğitimin ve keşfin merkezi hâline geldi. Teknoloji ve kültür alanlarında gerçekleştirdiğimiz büyük atılımlar sayesinde daha önce hayal bile edemediğimiz şeyleri başarabiliriz."
 innovation_currency_04:0 "Adi Senet"
 innovation_currency_04_desc:0 "Daha önceki bankacılık sistemlerinin bir gelişimi olan kâğıt adi senetler ile vatandaşlarımız ticaret mallarını ve hizmetlerini büyük mesafeler üzerinden sorunsuzca alıp satabilir."
 innovation_wierdijks:0 "Wierdijkler"
 innovation_wierdijks_desc:0 "Deniz seviyesinin altında yaşamak istiyorsak güçlü ve güvenilir su setleri inşa etmek önemli. Toprak setleri yosun hasırlarla güçlendirme tekniği sayesinde bunu gerçekleştirebiliriz."
 innovation_condottieri:0 "Condottieri"
 innovation_condottieri_desc:0 "Zengin ve merkezî konumu nedeniyle İtalya, aktif bir savaşta olmayan paralı askerlerin konakladığı bir yer oldu. Zaten burada oldukları için onları daha ucuza kiralayabiliriz."
 innovation_deccan_unity:0 "Dekan Birliği"
 innovation_deccan_unity_desc:0 "Topluluğumuzu etkileyen yeni inançlar ve dinler bize gösterdi ki eski bölgecilik anlayışımız yanlışmış. Dinimizden olanlar ile bir araya gelip dış baskılara karşı birlikte savaşmalıyız."
 students_of_knighthood:1 "[Concept( 'education', 'Eğitimlerini' )|E] [martial|E] [education_focus|E] ile tamamlayan çocuklar bir $trait_education_martial_prowess$ [Concept( 'trait', 'özelliği' )|E] kazanır."
 fp3_innovation_mural_sextant: "Duvar Sekstantı"
 fp3_innovation_mural_sextant_desc: "Bu aygıt gök cisimlerinin konumlarını hassas bir şekilde ölçmek için kullanılıyor."
 fp3_innovation_fritware: "Taş Hamuru"
 fp3_innovation_fritware_desc: "Doğudan gelen porselenleri anımsatan bu güzel taş kuvars ve cam gibi malzemelerin karıştırılmasıyla yapılıyor. Değerli ticaret ürünleri olabilecekleri gibi etkileyici birer hediye olurlar."
 fp3_innovation_fritware_tooltip: "[send_gift|E] etkileşiminin [opinion|E] etkisi: #P +20%#!"
 innovation_fire_medicine: "Ateş İlacı" # 'Huoyao,' 火藥
 innovation_fire_medicine_desc: "Hayatın gizemlerini araştırmak bazen ölüm saçan şeyleri de ortaya çıkarabilir. Kükürt, güherçile ve yanıcı bir maddeden oluşan güçlü bir karışım olan ateş ilacı, patlayıcı bir şiddetle yanan ölümcül bir alev yaratır."

 innovation_champa_rice:0 "Çampa Pirinci"

 innovation_champa_rice_desc:0 "Pirinç genellikle bolca zaman ve su gerektirir, Çampa pirinci bunun en büyük istisnasıdır. Bu tür daha hızlı büyür, kuraklığa daha iyi dayanır ve bilinen hemen her pirinç çeşidinden daha bol ürün verir. Hatta kimi zaman yılda iki kez bile hasat edilebilir. Doğru bakıldığında bu pirinç tarlaları güçlendirebilir ve nüfus patlamasına sebep olabilir."
 culture_parameter_champa_rice_wet_land_paddies: "[GetBuilding('paddy_fields_01').GetTypeName|V] ve [GetBuilding('farm_estates_01').GetTypeName|V] zincirlerindeki [buildings|E] [GetTerrain( 'wetlands' ).GetName] [terrain|E] türünde inşa edilebilir"
 culture_parameter_champa_rice_building_bonuses: "[GetBuilding('paddy_fields_01').GetTypeName|V] zincirindeki [buildings|E] ek faydalar sağlar"
 building_paddy_fields_requirement_terrain_tt: "Şunlardan biri geçerli olmalı:\n$EFFECT_LIST_BULLET$[province|E], [GetTerrain( 'terraced_hills' ).GetName] araziye sahip\n$EFFECT_LIST_BULLET$[province|E], [GetTerrain( 'floodplains' ).GetName] araziye sahip ve [GetGeographicalRegion('paddy_fields_region').GetName] [Concept('region', 'Bölgesi')|E] içinde\n$EFFECT_LIST_BULLET$[province|E], [GetTerrain( 'wetlands' ).GetName] araziye sahip ve [Concept('culture', 'Kültürü')|E] #V $innovation_champa_rice$#! [Concept('innovation', 'Buluşuna')|E] sahip\n$EFFECT_LIST_BULLET$[province|E], [GetTerrain( 'hills' ).GetName] veya [GetTerrain( 'jungle' ).GetName] araziye sahip ve [Concept('culture', 'Kültürü')|E] [GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V] [Concept('tradition', 'Geleneğine')|E] sahip"
 innovation_sericulture: "İpekçilik"
 innovation_sericulture_desc: "İpek üretme sanatı karmaşık ama son derece kazançlı bir süreçtir. İpekçilikteki ustalıklarından kâr edenler bu bilginin başkalarına geçmesini engellemeye çalışırlar."
 culture_parameter_unlocks_silk_buildings_parameter: "[GetDomicileBuilding('silk_01').GetNameNoTooltip|V] [Concept('domicile_building_upgrade', 'İç Geliştirmesini')|E] açar"

 innovation_dragon_kiln:0 "Ejderha Fırınları"
 innovation_dragon_kiln_desc: "En iyi porselenler ancak değerli maden yataklarının yakınında bulunan son derece sofistike fırınlarda üretilebilir. Bu fırınlar mümkün olan en sert seramikleri pişirmek için bir ısı girdabı oluşturmaya yardımcı olan dik yamaçlara inşa edilir. İnşa edilmeleri zor olsa da ürettikleri ürünler saraylar için en gözde ve en kârlı seramikler arasındadır."
 innovation_rocket_cart: "Roket Arabaları"
 innovation_rocket_cart_chinese: "Huochē" # 火車 (Huǒchē)
 innovation_rocket_cart_koreanic: "Hwacha" # 火車 (화차)
 innovation_rocket_cart_desc: "Pahalı toplardan daha kaba patlayıcı formüller kullanılarak, tek bir düzenekten devasa bir ateş oku atışları yapılabilir. Bu ateş okları nihayetinde... birer oktan ibaret oldukları için surlara #italic karşı#! ateş etmektense surların #italic üzerinden#! ateş edildiklerinde çok daha etkili olurlar."
 innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
 innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"
 innovation_compass: "Pusula"
 innovation_compass_desc: "Basit bir mıknatıstaşı parçasıyla bir kişi hangi yönde ilerlediğini her zaman bilebilir. Zamanla ve daha fazla geliştirmeyle, bir gün yol sormak için hiç durmadan ilerlemek dahi mümkün olabilir."
 culture_parameter_cheaper_adventure_inspiration: "Macera [inspiration|E] Maliyeti: #P -50%#!"
 innovation_block_printing: "Blok Baskı"
 innovation_block_printing_desc: "Oyulmuş ahşap bloklardan oluşan bir dizi sayesinde uygun herhangi bir malzeme üzerine aynı sözcükleri ve imgeleri basmak için kullanılabilecek bir kalıp takımı oluşturmak mümkündür. Bu, kitap üretimi sürecini büyük ölçüde kolaylaştırır, maliyetleri düşürür ve yazılı bilgiyi herkes için çok daha erişilebilir kılar."
 culture_parameter_block_printing_scriptorium_bonuses: "[SelectLocalization( HasDlcFeature( 'legends' ), 'culture_parameter_block_printing_scriptorium', 'blank_line' )]"
 culture_parameter_block_printing_scriptorium: "[GetBuilding('scriptorium_01').GetTypeName|V] zincirindeki [buildings|E] ek faydalar sağlar"
 culture_parameter_block_printing_university_bonuses: "[SelectLocalization( HasDlcFeature( 'wards_and_wardens' ), 'culture_parameter_block_printing_university_bonuses_text', 'blank_line' )]"
 culture_parameter_block_printing_university_bonuses_text: "[GetActivityType('activity_adult_education').GetName] Çalışma Materyali Maliyeti: #P -50%#!"
 innovation_grenades: "El Bombaları"
 innovation_grenades_desc: "Savaşta kaydedilen tüm ilerlemelere rağmen kadim bir araç hâlâ paha biçilmezdir: kol. Yanıcı ya da patlayıcı bir maddeyle doldurulmuş küçük kaplar fırlatma tekniği düzgün olan herkes tarafından uzağa atılabilir. Savaştan önce askerlere dağıtılan el bombaları, onlara düşmana saldırmak için ikinci bir yol sağlayabilir."
 innovation_cupellation: "Kupelasyon"
 innovation_cupellation_desc: "Yüksek sıcaklıklı fırınlar, maden numunelerindeki kıymetli metalleri eritip cevherleri ayırabilir ve incelenebilecek arıtılmış bir numune üretebilir. Kurşun madeninden alınan cevheri kupelasyondan geçirmek, o madenin gümüş oranını belirlemenin en iyi yoludur. Altının kupelasyonu ise olası sikke basımı için saflığını belirleyebilir."
 culture_parameter_cupellation_mine_building_bonuses: "#V Maden#! [special_building|E] bulunan [Concept('baronies', 'Baronluklarda')|E] [holding|E] Vergileri: #P @gold_icon![EmptyScope.ScriptValue('innovation_cupellation_mine_tax_bonus_value')|%0+=]#! "
 innovation_lacquered_armor: "Reçineli Zırh"
 innovation_lacquered_armor_desc: "Belirli reçinelerin zırhlara titizlikle uygulanması onları epey güçlendirir ve daha ağır demir plakaların hava şartlarına dayanmasını sağlar. Bu işlem bir süredir biliniyor olsa da kullanım alanı büyük ölçüde sandıklar, şişeler ve diğer eşyalarla sınırlıydı. Reçineli zırh, hem askerleri hem de teçhizatlarını korumanın yeni bir yolunu temsil eder."
 culture_parameter_higher_quality_armor_artifacts_parameter: "[sponsored|E] [inspirations|E] ve [GetDecision('commission_artifact_decision').GetName] ile elde edilen zırh [Concept('artifacts', 'Eserleri')|E] daha yüksek Kalitede olur"
 innovation_double_entry_bookkeeping: "Çift Taraflı Muhasebe"
 innovation_double_entry_bookkeeping_desc: "Kayıtlar, maliyenin ve ekonominin giderek büyüyen karmaşıklığına ayak uydurmalıdır. Tüm para girişlerini ve tüm para çıkışlarını ayrı kayıtlar hâlinde tutmak, güvenilir bilançoların korunmasına ve hesaplar incelenirken kayıtların kazara ya da "kazara" gözden kaçmamasına yardımcı olur."
 culture_parameter_bookkeeping_collect_taxes_bonus: "$task_collect_taxes$ [councillor_task|E]: [gold_i]#P +10%#!"
 innovation_waterworks: "Su Yapıları"
 innovation_waterworks_desc: "Su yaşam verir ancak susuzluğu gidermek ya da tarlaları sulamak dışında da pek çok kullanım alanına sahiptir. Hünerle dizginlendiğinde, gökten düşen bu kaynak herhangi bir hayvandan katbekat güçlü makineleri çalıştırabilir, insan yapımı kanallar boyunca yolculuk ve ticareti kolaylaştırabilir ya da en azından kalabalık sokakları temiz ve yaşanabilir tutabilir."
 culture_parameter_unlocks_waterworks_buildings: "[GetBuilding('waterworks_01').GetTypeName|V] zincirindeki [buildings|E] açılır"
 innovation_tiefutu: "$tiefutu$"
 innovation_tiefutu_desc: "$tiefutu_flavor$"
 innovation_bulkheads: "Su Geçirmez Bölmeler"
 innovation_bulkheads_desc: "Bir geminin batmasını önlemenin en kesin yolu, en başta gövdesinin delinmemesini önlemektir. Gövdesi su alsa dahi gövde araları su geçirmez duvarlarla ayrılmışsa gemi yine de kurtarılabilir. Gemi hasar alsa bile su geçirmez bölme suyun gemiyi tümüyle batırmasını önleyebilir ve böylece adamları, erzakı ve geminin kendisini kurtarır."
 innovation_coking: "Koklaştırma"
 innovation_coking_desc: "Odun kömürü demirciliğin hayati bir parçasıdır ancak odunu bu temel yakıta dönüştürmek için yakınlarda bol orman gerektirir. Kömür ise, odun kömürü fırınına benzer bir düzende ısıtılarak kok kömürüne dönüştürülebilir. Kok kömürü, bütün bir ormanı kesmeyi gerektirmeden, demircilikte ve diğer sanayi ateşlerinde odun kömürü kadar kullanışlıdır."
 culture_parameter_coking_smith_bonuses: "[GetBuilding('smiths_01').GetTypeName|V] ve [GetBuilding('blacksmiths_01').GetTypeName|V] zincirindeki [buildings|E] ek faydalar sağlar"
 innovation_composite_crossbow: "Kompozit Tatar Yayları"
 innovation_composite_crossbow_desc: "Basit yaylarda olduğu gibi, bir yayın kolunun gücü çekişinin muhtemel kuvvetini belirler. Yayın kolunu boynuzla hatta çelikle güçlendirerek, bir tatar yayının çekiş ağırlığı ve dolayısıyla menzili ile gücü herhangi bir ahşap muadilinden katbekat yüksek hâle getirilebilir, ayrıca daha dayanıklı ve daha uzun ömürlü olur."

 innovation_pharmacopoeia:0 "Farmakope"
 innovation_pharmacopoeia_desc: "İyi bir hekim doğru ilaçları doğru zamanda, doğru malzemeleri doğru şekilde ve doğru miktarlarda hazırlayarak üretmeyi bilmelidir. Bu bilgi çoğu zaman ustadan çırağa bireysel olarak aktarılsa da, belirli ilaçların nasıl hazırlanacağını #italic yazıya dökmek#! farklı tedavilerin hazırlanışını standartlaştırıp yaygınlaştırmada son derece yardımcı olabilir."
 culture_parameter_physician_pharmacopoeia_bonus: "[GetCourtPositionType('court_physician_court_position').GetName()] [court_position|E] Tedavi Etkinliği: #P +20%#!"
