 tradition_tgp_court_machinations_name: "Saray Entrikaları"
 tradition_tgp_court_machinations_desc: "Sarayın labirenti andıran koridorlarında hadımlar nüfuz sahibidir, cariyeler iltifat için yarışır, ihanet fısıltıları ise yaldızlı odalarda yankılanır."
 tradition_tgp_art_of_war_name: "Savaş Sanatı"
 tradition_tgp_art_of_war_desc: "Bu kültür bin yıldır askerî teoriyi incelemiş, bu kültürdeki generaller ve mareşaller, zengin bir askerî el kitapları ve ders kitapları birikimine sahip olmuştur. Bu bilgi zenginliğini gölgede bırakan tek şey, sağlam zırhlar ve silahlar yapmaya dair büyük teknik maharetleridir."
