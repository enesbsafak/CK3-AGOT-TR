 culture_emergence_events.0005.t: "Romanş Romansı"
 culture_emergence_events.0005.desc: "[county_scope.GetNameNoTierNoTooltip] bölgesinde [new_culture_scope.GetName] kültürü kutlanırken, bu toprakların daha #italic taşralı#! kesiminde [new_culture_scope.GetNameNoTooltip] ile pek de benzeşmeyen bir lehçe konuşulduğunu fark ediyorum.\n\nYoldan geçerken tarlalarda biriyle gevezelik eden bir köylüye rastlıyorum. "Sen, oradaki!" diye sesleniyorum. "Bu konuştuğun dil neyin nesidir?"\n\nKöylü duraksıyor. "Sanırım," diyerek [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] dilinde ağır ağır yanıtlıyor, "biz bu dile #italic Romanş#! deriz."\n\n'Romanş,' ha? Halkım gerçekten de bu mu?"
 culture_emergence_events.0005.a: "Dillerimiz de yüreklerimiz kadar Romanş olmalı."
 culture_emergence_events.0005.a.tt: "[new_culture_scope.GetNameNoTooltip] #bold yalnızca#! Romanş isimlerini kullanacak"
 culture_emergence_events.0005.b: "Romanş, [new_culture_scope.GetName] mozaiğinin bir parçası olacak."
 culture_emergence_events.0005.b.tt: "[new_culture_scope.GetNameNoTooltip] mevcut isimlerine #bold ek olarak#! Romanş isimlerini de kullanacak"
 culture_emergence_events.0005.c: "Bu köylü dili [new_culture_scope.GetName] için hiçbir değer taşımaz!"
 culture_emergence_events.0005.c.tt: "[new_culture_scope.GetNameNoTooltip] olduğu gibi kalacak"
