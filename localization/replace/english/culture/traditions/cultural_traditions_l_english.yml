 culture_tradition_events.0100.t:0 "Kültür ve İnancın Çatışması"
 culture_tradition_events.0100.desc:0 "[head_of_faith.GetTitledFirstName] bir mektup yollamış. Mektup nazik hasbihal sözleriyle başlıyor ve [culture_scope.GetName] insanının gözündeki değerimin altını çiziyor.\n\n"

 culture_tradition_events.0100.tradition_monogamous:0 ""Anlamalısınız ki, halkınız tek eşliliği sürdürdüğü sürece [faith_scope.GetAdjective] doktrinini ihlal ediyorsunuz! Ben yalnızca kurtuluşunuzu istiyorum. Her iyi [faith_scope.GetAdjectiveNoTooltip]'in görevi tek bir eşle yerine getirilemez." diye okunur mektupta.""

 culture_tradition_events.0100.tradition_polygamous:0 ""Çok eşlilik uygulamanız [faith_scope.GetAdjective] doktrinine kesin bir karşıtlık içinde ve [faith_scope.HighGodName]'in gözünde bir günahtır! Ben yalnızca kurtuluşunuzu istiyorum. Lütfen, halkınızı ışığa yönlendirin ve fazladan eşlerinizden kurtulun!" diye okunur mektupta.""

 culture_tradition_events.0100.tradition_concubines:0 ""Cariyelik uygulamanız [faith_scope.GetAdjective] doktrini tarafından desteklenmiyor; yalnızca uygun evlilik yoluyla [faith_scope.HighGodName] halkınıza gülümseyecek! Ben yalnızca kurtuluşunuzu istiyorum. Hepimizin iyiliği için cariyelerinizi bir kenara bırakın." diye okunur mektupta.""
 culture_tradition_events.0100.end:0 "\n\nKesinlikle bir ikilem... hangisine daha çok değer veriyorum? Halkımın örf ve âdetlerine mi yoksa dinimizin ilkelerine mi?"
 culture_tradition_events.0100.a:0 "[faith_scope.GetAdjectiveNoTooltip] ilkesini her şeyin önüne koymalıyız."
 culture_tradition_events.0100.b:0 "Halkımın örf ve âdetleri daha önemli!"
 culture_tradition_events.0101.t:0 "Bir Mistiğin Aklındakiler"
 culture_tradition_events.0101.desc:0 "Dalkavuklar ya da devlet meseleleriyle meşgul edilmeden yemeğimi huzur içinde yediğim zamanları bir elin parmaklarıyla saymak mümkün ama sanırım bugün o günlerden birisi. Huzurlu, sakin bir akşam yemeği ve sosyal kaslarımı dinlendirmek için bir fırsat.\n\nMutluluk içinde yemeğimi yerken kaçınılmaz son gerçekleşiyor ve bir [mendicant_mystic.GetFaith.PriestNeuter] hızlıca açılan kapıdan içeriye dalıyor. Elinde eğri büğrü, kapıyı tek vuruşta kırmaktan ahşap kıymıklarla dolu bir baston var.\n\n"Soylu [ROOT.Char.GetTitleAsNameNoTooltip], size bir teklifim var! Cüzi bir ücret karşılığında ben, #EMP [mendicant_mystic.GetFirstName]#! insanlarımın kadim bilgilerini sarayınızdaki çocuklarla paylaşmaya hazırım!""
 culture_tradition_events.0101.a:0 "Tabii ki, soylu [mendicant_mystic.GetFaith.PriestNeuter]. Lütfen elindeki dayak sopasını yere bırak."
 culture_tradition_events.0101.a.tt:0 "Sarayınızdaki bütün [Concept( 'children', 'Çocuklar' )|E] hâlihazırda devam eden [Concept( 'education', 'Eğitimlerine' )|E] ufak bir katkı alacak"
 culture_tradition_events.0101.b:0 "Bu miktar [mendicant_mystic.GetFaith.HighGodName] işi için biraz fazla değil mi?"
 culture_tradition_events.0101.b.tt.success:0 "Mistiği işi daha az para karşılığı yapmaya ikna ediyorsunuz"
 culture_tradition_events.0101.b.tt.failure:0 "Mistik tiksintiyle sarayınızdan ayrılıyor"
 culture_tradition_events.0101.c:0 "Uzaklaş dilenci, burada yemek yemeye çalışıyorum!"
 culture_tradition_events.0111.t:0 "Mistiğin Konuşması"

 culture_tradition_events.0111.desc:0 ""...işte bu yüzden hayatımızın her anında kendimizi [mendicant_mystic.GetFaith.HighGodName]'in iyiliğine teslim etmeliyiz. Anladınız mı? Devam edeyim mi?"\n\nİki. Saat. Boyunca.\n\n[mendicant_mystic.GetName]'in [mendicant_mystic.GetHerHis] yolunu odalarıma nasıl bulduğunu bile bilmiyorum, ama [mendicant_mystic.GetFaith.PriestNeuter] bana [mendicant_mystic.GetFaith.GetName] teolojisinin incelikleri hakkında #EMP tam iki saat boyunca#! ders verdi.\n\nNihayet, [mendicant_mystic.GetWomanMan] susuyor ve benden bir cevap bekliyor. Gözümün seğirmeye başladığını hissediyorum.""
 culture_tradition_events.0111.a:0 "İlham verici sözler!"
 culture_tradition_events.0111.b:0 "Söyleyeceğini söyledin, sıra bende..."
 culture_tradition_events.0111.a.tt.success:0 "Mistiğin argümanlarını çökertiyorsunuz"
 culture_tradition_events.0111.a.tt.failure:0 "Doğru kelimeler ağzınızdan bir türlü çıkmıyor"
 culture_tradition_events.0111.c:0 "Bu serseriyi evime kim aldı? Muhafızlar, yardım!"
 culture_tradition_events.0121.t:0 "Bir Mistiğin Hizmeti"
 culture_tradition_events.0121.desc:0 "Bu işi yapan birinden hiç beklenmeyecek şekilde [mendicant_mystic.GetFirstName] ben onu usulüne uygun bir şekilde kabul edene kadar usulca beklemiş.\n\n[mendicant_mystic.GetFaith.PriestNeuter] odaya girdiğimde oldukça tedirgin gözüküyor ama beni görür görmez aceleyle konuşmasına başlıyor.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], çok uzun zamandır yollardayım ve her ne kadar bu iş [mendicant_mystic.GetFaith.HighGodNamePossessive] işi de olsa ruhu beslediği kadar vücut ve aklı yoruyor."\n\n"Eğer izin verirseniz, asamı asıp sarayınızda size hizmet etmeye hazırım. B-beni kabul edecek misiniz?""
 culture_tradition_events.0121.a:0 "Senin becerilerine sahip biri sarayımda her zaman hoş görülür..."
 culture_tradition_events.0121.b:0 "Sadık bir [mendicant_mystic.GetFaith.PriestNeuter] diyorsun..."
 culture_tradition_events.0121.c:0 "Böyle görünüp, böyle #EMP kokup#! burada yaşayabileceğini mi sanıyorsun?"
 culture_tradition_events.0131.t:0 "Mistiğin Gazabı"

 culture_tradition_events.0131.desc:0 ""[ROOT.Char.GetTitleAsNameNoTooltip]? Sen kendi çürümüşlüğünün #EMP pisliğinde kıvranan#! bir solucansın! Günahlarından [mendicant_mystic.GetFaith.HighGodName] önünde tövbe et! Kudretli [mendicant_mystic.GetFaith.HighGodName]! Yanılmayan [mendicant_mystic.GetFaith.HighGodName]! Saldırılamaz [mendicant_mystic.GetFaith.HighGodName]!"\n\nKahretsin bu sinir bozucu [mendicant_mystic.GetFaith.PriestNeuter]'i. [mendicant_mystic.GetSheHe] sokak köşesindeyken yeterince kötüydü! [mendicant_mystic.GetFirstName]'i #EMP evime#! kimin aldığını #EMP bir#! öğrenirsem gözlerini isterim; [mendicant_mystic.GetSheHe] burada on dakikadan azdır ve şimdiden başım ağrımaya başladı.\n\nBu dilencinin nutkunun daha fazlasına dayanamam, [mendicant_mystic.GetHerHis] atıp tutmasında doğal bir duraksama olurken hızlıca harekete geçmeliyim.""
 culture_tradition_events.0131.a:0 "#EMP Benim#! günahlarım? Biraz #EMP seninkiler#! hakkında konuşalım."
 culture_tradition_events.0131.a.tt.success:0 "Mistiğin ikiyüzlü olduğunu kanıtlıyorsunuz"
 culture_tradition_events.0131.a.tt.failure:0 "Mistik sizi aptal gibi gösteriyor"
 culture_tradition_events.0131.b:0 "Bana... bana daha iyi olmayı öğretir misin?"
 culture_tradition_events.0131.b.tt.success:0 "Mistik size hatalarınızın üstesinden gelmeyi öğretiyor"
 culture_tradition_events.0131.b.tt.failure:0 "Manevi ıstırap sizi ele geçiriyor"
 culture_tradition_events.0131.c:0 "#EMP Pislikte kıvranmak?#! Bu deliyi en yakın lağım çukuruna atın!"
 culture_tradition_events.0141.t:0 "Mistikle Pazarlık"

 culture_tradition_events.0141.desc:0 ""Görmüyor musun, [ROOT.Char.Custom('FormOfAddressForLiege')], bu... [ROOT.Char.GetFaith.GetName] fikriyle ruhunu nasıl riske attığını? Gerçek [mendicant_mystic.GetFaith.GetAdjective] inancının ışığına girmene ve seni ebedî sefaletten kurtarmama izin ver!"\n\nBir dilenci [mendicant_mystic.GetFaith.PriestNeuter] olarak [mendicant_mystic.GetFirstName], inanmayan [ROOT.Char.GetCulture.GetName] halkına vaaz vermeye alışkın, ama köylüler üzerinde işe yarayan teknikler soylular üzerinde işe yaramayabilir.\n\nAramıza sessizlik çöküyor ve kendimi [mendicant_mystic.GetWomanMan]'in gözlerinin derinliklerine bakarken buluyorum, arkalarında umut ve açlık ışıklarının dans edip titrediğini izliyorum.""
 culture_tradition_events.0141.a:0 "Sözlerini ikna edici buldum, [mendicant_mystic.GetFaith.PriestNeuter]."
 culture_tradition_events.0141.b:0 "[ROOT.Char.GetFaith.GetNameNoTooltip] inançları hakkında seni aydınlatmama izin ver..."
 culture_tradition_events.0141.b.tt.success:0 "[mendicant_mystic.GetFirstNameNoTooltip] sözlerinizden etkileniyor"
 culture_tradition_events.0141.b.tt.failure:0 "Ortak bir noktada buluşamıyorsunuz"
 culture_tradition_events.0141.c:0 "[mendicant_mystic.GetFaith.HighGodName]! Merak ediyorum, bu "tanrının" kaç askeri var?"
