 tradition_tgp_ephemeral_grace_name: "Fâni Zarafet"
 tradition_tgp_ephemeral_grace_desc: "#EMP Mono no Aware#! estetik felsefesi, gelip geçici anların fâni güzelliğini yüceltir. Doğayla derin bir uyumu ve sanatın, yaşamın geçiciliğine dair tefekkürlü bir takdiri besler."
 culture_parameter_stress_loss_bonus_from_harmonious_traits: "[GetTrait('temperate').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] ve [GetTrait('compassionate').GetName( GetNullCharacter )] [Concept('traits', 'Özellikleri')|E] daha fazla [stress|E] azaltır"
 tradition_tgp_imperial_peace_name: "Kırılgan Barış"
 tradition_tgp_imperial_peace_desc: "Deniz sayesinde büyük ölçüde istiladan korunmuş olsa da kuzeyden gelen akınlara karşı koymak ve Kanmu'nun barışını taht iddiacılarına ya da cüretkâr valilere karşı muhafaza etmek, hâlâ yetenekli savaşçılar ve sıkı bir teşkilat ister."
 culture_parameter_unlock_mounted_samurai_units: "[men_at_arms|E] olarak [GetMaA('japanese_horse_archers').GetName] çıkarılabilir"
 tradition_tgp_rice_cultivators_name: "Pirinç Yetiştiricileri"
 tradition_tgp_rice_cultivators_desc: "Pirinç, bu kültürün can damarıdır. Çalışkan bir işçilik ve tarımsal maharet sayesinde, ürünleri için uygun toprakları denetimlerinde tuttukları sürece hasatları bereketlidir. Bunun neticesinde, iktisadî refahları ve askerî kudretleri komşularının çok ötesine yükselir."
 tradition_tgp_inward_perfection_name: "İç Güzelliği"
 tradition_tgp_inward_perfection_desc: "Bu kültür, yabancı tesirden ziyade kendine yetmeyi ve iç erdemleri zenginleştirmeyi yeğler. Diplomatik bağlar solabilir lakin bilgi ve içe dönüş, dingin bir yalnızlıkla serpilir."
 tradition_tgp_fortified_strongholds_name: "Tahkimli Kaleler"
 tradition_tgp_fortified_strongholds_desc: "Bu kültür, dinsel, askerî ve idarî işlevleri yerine getiren büyük tahkimli şehirlerle tanınır. Bu kültürel kalelerin korunması hayati önemdedir, yenilerini kurmak ise büyük bir itibar meselesidir."
