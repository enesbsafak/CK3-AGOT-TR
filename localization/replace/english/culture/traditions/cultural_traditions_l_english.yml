 mpo_siberian_permafrost_modifier:0 "Sibirya Donu"

 mpo_siberian_permafrost_modifier_desc:0 "Toprak binlerce yıldır donmuş halde; yer altı suyuna erişim yok ve bitki örtüsü seyrek. Sürekli çözülüp tekrar donması sebebiyle zemin her yıl değişiyor. Bu toprakları sahiplenebilmek için, yerli halkın yüzyıllarca süren adaptasyonu gerekiyor. Diğer herkes ve her şey ise yok olup, buzun altındaki kadim ölülerle buluşuyor.\n\n#weak Bu etki, #V $feudalize_holding_interaction$#! veya #V $demand_admin_interaction$#! [Concept('interaction', 'Etkileşimleriyle')|E] veya tüm Kuzeyi fethettikten sonra #V $dlc_mpo_steppe_siberia_further_expansion_tooltip$#! için #V $expand_the_steppe_decision_generic$#! [Concept('decision', 'Kararı')|E] ile kaldırılabilir.#!\n\n"
