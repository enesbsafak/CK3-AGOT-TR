 recruit_hill_specialist_decision_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] hayvanlarını otlattıkları ve vahşi hayvanları kolaylıkla püskürttükleri tepeler ve vadilerde kendilerini evlerinde hisseder. Bir orduyu da aynı sürüyü yönettiği ustalıkla yönetecek çoban eksiğimiz yok."
 recruit_hill_specialist_decision.tt:0 "Yüksek [martial|E] sahibi ve [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliğine' )|E] sahip bir [commander|E] [Concept( 'court', 'Sarayınıza' )|E] katılır"
