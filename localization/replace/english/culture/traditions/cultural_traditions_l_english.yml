 tradition_cultivation_name: "Kendini Yetiştirme"
 tradition_cultivation_desc: "Yüreğin çamuru dibe çökene ve iç erdem berrak su gibi yükselene dek bedeni, nefesi ve zihni ayarlamak."
 tradition_intensive_farming_name: "Yoğun Tarım"
 tradition_intensive_farming_desc: "Bu kültür, nüfusunu destekleyen geniş bir çiftçi sınıfına büyük değer verir. Bin yılların tecrübesiyle buğdayın ve pirincin verimini büyük ölçüde arttırmayı başarmışlardır."
 oath_mend_the_fracture_tradition_name:0 "Yeminli Uzlaştırmanın Mirası"
 oath_mend_the_fracture_tradition_desc:0 "Öfke ve kanlı güvensizlikten bir uzlaşma doğdu. Yeminli hükümdarın önderliğinde, bu kültür ülkedeki diğer halklarla arasındaki bölünmeyi onarmış; sulh ve refaha ermiştir."
