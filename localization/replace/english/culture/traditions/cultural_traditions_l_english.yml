 recruit_forest_specialist_decision:0 "Orman Savaşçısı Bul"
 recruit_forest_specialist_decision_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] için orman ikinci bir ev gibidir. Koruma, barınak ve yakacak sağlar. Askerlerime derin ve tehlikeli ormanlarda askerlerime öncülük edecek biri gerekiyorsa söylemem yeterli, sayısız avcı hevesle çağrımı cevaplayacaktır."
 recruit_forest_specialist_decision.tt:0 "Yüksek [martial|E] sahibi ve [GetTrait('forest_fighter').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliğine' )|E] sahip bir [commander|E] [Concept( 'court', 'Sarayınıza' )|E] katılır"
