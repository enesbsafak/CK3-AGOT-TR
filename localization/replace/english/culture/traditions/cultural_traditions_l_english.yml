 culture_parameter_reaver_gives_buffs_to_horse_archers: "[GetTrait('reaver').GetName( GetNullCharacter )] [Concept('traits', 'Özelliği')|E], [archer_cavalry|e] [men_at_arms|e] birlikleri için güçlendirmeler sağlar"
 tradition_chinese_arts_name: "Çin Sanatları"
 tradition_chinese_arts_desc: "Kalemin yolu, fırçanın yolu... hepsi bu kültür için mühimdir. Çinliler yalnızca askerî kudrete ya da karmaşık idareye bel bağlamak yerine, her tür sanatı mükemmeliyete eriştirmeye önem verir."
