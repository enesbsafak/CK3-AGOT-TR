 tradition_ep3_audacious_cadets_name: "Cesur Asker Adayları"
 tradition_ep3_audacious_cadets_desc: "Gençlerden oluşan akıncılar bu kültürü tanımlar. Cesur ve vicdansız olan bu atlılar macera, paralı askerlik ve görkemli fetih hayallerinin peşinden koşarlar."
 culture_parameter_ambitious_trait_more_common: "[GetTrait('ambitious').GetName( GetNullCharacter )] [Concept( 'trait', 'Özelliği' )|E] daha yaygındır"
