 tradition_tgp_esoteric_power_name: "Ezoterik Kudret"
 tradition_tgp_esoteric_power_desc: "Bu kültürde asaleti özetleyen iki sıfat vardır: ilahi ve gizemli. Buyruklarını güvence altına almak isteyen hükümdarlar, ritüellere girişmeli ve ilahi eserleri sergileyerek kudretlerini gözler önüne sermelidir."
