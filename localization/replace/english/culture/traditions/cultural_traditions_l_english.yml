 recruit_open_specialist_decision_desc:0 "Çim denizinde manevra yapmanın önünde neredeyse hiçbir engel bulunmaz ve [ROOT.Char.GetCulture.GetCollectiveNoun] bu manevra kabiliyetinden en iyi şekilde istifade etmeyi bilir. İhtiyaç duyulduğu takdirde ordularımızı da bu faydalardan yararlandıracak kumandanları aramızdan kolaylıkla çıkarabiliriz."
 recruit_open_specialist_decision.tt:0 "Yüksek [martial|E] sahibi ve [GetTrait('open_terrain_expert').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliğine' )|E] sahip bir [commander|E] [Concept( 'court', 'Sarayınıza' )|E] katılır"
