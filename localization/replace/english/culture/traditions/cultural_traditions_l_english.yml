 recruit_mountain_specialist_decision:0 "Dağ Savaşçısı Bul"
 recruit_mountain_specialist_decision_desc:0 "Benim zorlu insanlarım, [ROOT.Char.GetCulture.GetCollectiveNoun] en tehlikeli dağ geçitlerinin dahi rahatlıkla geçmeyi iyi bilir. Eğer askerlerimi dağlık bölgelerde hareket ettirmek ve savaştırmam gerekirse kolaylıkla tecrübeli bir rehber bulabilirim."
 recruit_mountain_specialist_decision.tt:0 "Yüksek [martial|E] sahibi ve [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliğine' )|E] sahip bir [commander|E] [Concept( 'court', 'Sarayınıza' )|E] katılır"
