 culture_emergence_events.0001.t:0 "Kültürlerin Harmanı"
 culture_emergence_events.0001.desc:0 "Ben [ROOT.Char.GetCulture.GetName] kültüründenim ama başkentimin insanları [hybdridization_offer_culture.GetName]. Son zamanlarda [hybdridization_offer_culture.GetNameNoTooltip] tebaamdan bazıları benim ve [ROOT.Char.GetCulture.GetNameNoTooltip] geleneklerinin bazılarını taklit ediyorlar.\n\nGeleneklerimizi harmanlıyorlar. Bazıları eski bazıları yeni ama en önemlisi şu: artık benim yönetimime daha sıcaklar!\n\nBelki de onları teşvik etmeliyim?"
