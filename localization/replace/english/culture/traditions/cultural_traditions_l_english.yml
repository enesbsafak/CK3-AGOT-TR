 recruit_dry_specialist_decision_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] tepelerinde yakıcı güneşle yaşamaya alışıktır ve onun altında uzun mesafeler kat edebilirler. Eğer askerlerimi kızgın sıcaklarda onları öldürmeden hareket ettirmek istersem, kolaylıkla bunu sağlayabilecek bir rehber bulabilirim."
