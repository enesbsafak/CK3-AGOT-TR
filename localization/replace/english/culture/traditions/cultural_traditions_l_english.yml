 culture_emergence_events.0002.t:0 "Yeni Bir Kimlik"
 culture_emergence_events.0002.desc:0 "Halkım, [ROOT.Char.GetCulture.GetCollectiveNoun] gururlu ve kalabalık bir millet.\n\nAma ne kadar benzersek benzeyelim, tebaamın başka ülkelerdeki [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ile bir o kadar da farklılaştığı açık. Bazen ülkeyi ziyaret eden [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ile ülkedekiler arasında ufak çatışmalar dahi yaşanıyor.\n\nYeni bir kimlik geliştiriyoruz. [ROOT.Char.GetCulture.GetNameNoTooltip] olabiliriz - ama aynı zamanda değiliz de. Sanırım sonraki adımı atmanın vakti geldi."
 culture_emergence_events.0002.a:0 "Yeni, daha güçlü bir kimlik inşa edeceğiz!"
 culture_emergence_events.0002.b:0 "Bizim kimliğimiz [ROOT.Char.GetCulture.GetNameNoTooltip]. Aksini düşünmeyin!"
 new_divergent_culture_tt:0 "[ROOT.Char.GetCulture.GetName] [Concept( 'culture', 'kültürü' )|E] ile birçok [Concept( 'traditions', 'geleneği' )|E] ve [Concept( 'culture_pillars', 'kültürel özelliği' )|E] paylaşan ama yeni [Concept( 'ethos', 'değerlere' )|E] ve birkaç farklı geleneğe sahip bir [divergent_culture|E] ortaya çıkacak."
 culture_emergence_events.0002.new_divergence:0 "Halkınızla beraber [Concept('divergent_culture', 'Ayrışan Kültürü')|E] benimseyeceksiniz"
