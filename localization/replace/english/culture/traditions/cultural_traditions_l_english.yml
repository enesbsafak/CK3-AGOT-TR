 recruit_winter_specialist_decision:0 "Kış Savaşçısı Bul"
 recruit_winter_specialist_decision_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] soğukta doğmuş, soğukla yoğrulmuş insanlardır. Askerlerime amansız kış şartlarında liderlik edecek birisi arıyorsam, söylemem yeterli. Ülkede çağrımı cevaplayacak soğuk tarafından ısırılmış gazi kıtlığı yok."
 recruit_winter_specialist_decision.tt:0 "Yüksek [martial|E] sahibi ve [GetTrait('winter_soldier').GetName( GetNullCharacter )] [Concept( 'traits', 'Özelliğine' )|E] sahip bir [commander|E] [Concept( 'court', 'Sarayınıza' )|E] katılır"
