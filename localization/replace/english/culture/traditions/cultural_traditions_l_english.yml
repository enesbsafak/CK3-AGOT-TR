 tradition_tgp_barangay_confederations_desc: "Bu kültürün hükümdarları, nehir ağızları boyunca ve kıyılara serpilmiş pek çok ayrı şehir devletine önderlik eder. Bu irili ufaklı devletler genellikle konfederasyonlar hâlinde birleşir ve bu konfederasyonlara, üyelerin [Glossary( 'Datu', 'DATU_GLOSS' )]ları arasından seçilen bir şef önderlik eder."
