 culture_tradition_events.3000.t: "Ayı İzi"
 culture_tradition_events.3000.desc: "[bear_sighting.GetName] avcıları, [bear_sighting_county.Custom('GetAnimalGroup')] hâlinde bir [bear_sighting_county.Custom('GetAnimalType')] sürüsünün [bear_sighting.Custom('GetTerrainTypePlural')] içinde dolaştığını görmüş. Çamurda geniş izlere, pençeyle çizilmiş ağaçlara ve kırılmış çalılıklara rastlamışlar.\n\nEğer [GetActivityType('activity_hunt').GetName|l] yapar da birini öldürür yahut ele geçirirsem, ruhlar elbet gayretimi fark eder."
 culture_tradition_events.3000.a: "Mızrağımı hazırlamalıyım..."
 bear_sacrifice_war_modifier: "Savaş İçin Ayı Kurbanı"
 bear_sacrifice_war_modifier_desc: "Bu karakter bir ayı kurban etmiş ve bu sebeple savaşta başarıyla kutsandığına inanıyor."
 bear_sacrifice_authority_modifier: "Otorite İçin Ayı Kurbanı"
 bear_sacrifice_authority_modifier_desc: "Bu karakter bir ayı kurban etmiş ve bu sebeple kutsandığına inanıyor."
 sacrifice_bear_decision_effect: "[piety_i][piety|E], [GetModifier('bear_sacrifice_war_modifier').GetNameWithTooltip] ya da [GetModifier('bear_sacrifice_authority_modifier').GetNameWithTooltip] arasında seçim yapın"
 culture_tradition_events.3100.t: "Ayı Kurbanı"
 culture_tradition_events.3100.desc: "Ulu ayıyı sessizlik içinde bağlıyoruz. Avcılar kısık sesle konuşuyor, ladin kokusuyla duman yükseliyor.\n\nDiz çöküp, alnımı burnuna dayıyor ve bıçak inmeden önce minnettarlığımı fısıldıyorum. Gücü aramızda yaşasın diye etini paylaşacağız."
 culture_tradition_events.3100.a: "Şölen kuralım!"
 culture_tradition_events.3100.b: "Düşmanlarımız yere serilsin!"
 culture_tradition_events.3100.c: "İtaat edin zira ayı ruhu yanımda."
 tradition_ordo_riders_name: "Ordo Binicileri"
 tradition_ordo_riders_desc: "Sürü ihtiyacı ve kabilenin birliğini pekiştirme mecburiyeti, bu kültürün hordasının çoğunu çetin savaşçılara dönüştürmüştür. Hem saldırıları püskürtebilir hem de halk için etkin bir biçimde erzak toplayabilirler."
