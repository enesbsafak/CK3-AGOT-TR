 culture_tradition_events.0002.t:0 "[GetPlayer.Custom( 'KnightCultureNoTooltip' )] ile antrenman yap: Sonuç"
 culture_tradition_events.0002.desc:0 "Silahımı indirip [recipient.GetTitledFirstName] ile göz göze geldikten sonra ona geleneksel selamı veriyorum. O da aynısını yapıyor.\n\n"

 culture_tradition_events.0002.desc_actor_victor_good:0 ""İyi dövüştün, [actor.GetTitleTierName|U]'im! Beni hakkaniyetle yendin." der [recipient.GetFirstNameNoTooltip].\n"Bu gelenek, [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]'in geleceğinde savaş olursa bize kesinlikle iyi hizmet edecek."\n\nBu canlandırıcıydı, kendimi dinç ve hazır hissediyorum!""

 culture_tradition_events.0002.desc_actor_victor_bad:0 ""İyi dövüştün, [actor.GetTitleTierName|U]'im, tamamen yenildim." diye sızlanır [recipient.GetFirstNameNoTooltip].\n"Yine de hatırla, bu zaferin başını döndürmesine izin verme. Ben senin düşmanın değilim, onlar hâlâ orada."\n\nPöh! Kendimi gayet iyi hissediyorum!""

 culture_tradition_events.0002.desc_recipient_victor_good:0 ""İyi dövüştün, [actor.GetTitleTierName|U]'im, bu turu ben kazandım!" der [recipient.GetFirstNameNoTooltip] sportmen bir tonda. "Artık her şeyle yüzleşmeye hazırız!"\n\nGerçekten de öyleyiz, belki bir sonraki fetihimi düşünmeliyim?""

 culture_tradition_events.0002.desc_recipient_victor_bad:0 ""İyi dövüştün, [actor.GetTitleTierName|U]'im. Sana zarar verdiysem üzgünüm. Kısa bir an için kendimden geçmiştim — ben ve silahım bir olmuştuk..." der [recipient.GetFirstNameNoTooltip] özür dilercesine.\n"Belki biraz dinlenmeye ihtiyacın vardır?"\n\nSaçmalık, kasap köpeği gibi dinçim!""
