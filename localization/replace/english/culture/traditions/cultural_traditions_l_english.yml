 tradition_ep3_imperial_tagmata_name: "İmparatorluk Tagmaları"
 tradition_ep3_imperial_tagmata_desc: "Elit ve iyi zırhlı birlikler bu kültürün askerî seferlerinin bel kemiğini oluşturur. Bu kendini beğenmiş askerler küçük önemsiz soylulara, pervasız ve bencil kahramanlık eylemlerine pek saygı duymazlar; bunun yerine disipline ve birliklerinin kutsal isimlerine saygı gösterirler. #EMP Exkoubitoi! Scholai! Hikanatoi!#!"
 domain_counties_with_stables_desc: "[culture_head|E], [Concept( 'holdings', 'Yerleşimlerde' )|E] $building_type_stables_01$ inşa edilmiş #high 8#! [Concept( 'counties', 'Kontluğa' )|E] sahip değil"
 tradition_ep3_roman_ceremonies_name: "Roma Törenleri"
 tradition_ep3_roman_ceremonies_desc: "Geçmişin imparatorları bu kültüre kalıcı bir ihtişam, görkemli törenler, imparatorluk makamına duyulan hayranlık ve huzursuzluklarla dolu bir yaşam bahşetmişlerdir."
 tradition_ep3_palace_politics_name: "Saray Politikaları"
 tradition_ep3_palace_politics_desc: "Nüfuzlu hadımlar ve ipek cübbeli dalkavuklar muazzam bir siyasi aygıtı yönetiyor, birbirlerini süslerle etkiliyor, onurlarla pohpohluyor ve yükselebilmek için acımasızca komplolar kuruyorlar."
