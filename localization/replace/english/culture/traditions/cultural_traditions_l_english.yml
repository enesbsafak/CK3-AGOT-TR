 tradition_tgp_warrior_monks_name: "Savaşçı Keşişler"
 tradition_tgp_warrior_monks_desc: "Ahlâklı yaşamaya adanmışlık, hele ki dinî topluluğu rakip mezheplerden ve yozlaşmış memurlardan korumak yahut muhtaçları savunmak söz konusu olduğunda, kuvvet kullanmayı da gerektirebilir."
 culture_parameter_unlock_warrior_monk_units: "[men_at_arms|E] olarak [GetMaA('warrior_monks').GetName] çıkarılabilir"
 tradition_scholar_officials_name: "Bilgin Memurlar"
 tradition_scholar_officials_desc: "Kalem kılıçtan keskindir... Bu kültür, nüfuzun soylu sanatlarda eğitilmiş sadık memurlara verildiği bir ideale yürekten inanır."
