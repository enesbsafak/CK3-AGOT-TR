 tradition_fortress_mastery_desc: "Bu kültür, yurdunu korumak ve istilacıları geri püskürtmek için yerel araziyi kullanarak savunma maharetinde köklü bir geleneğe sahiptir. Bu beceriyi, yay ustalığı ve her düşmanı alt edebilecek kadar çevik birliklerle birleştirirler."
 culture_parameter_governor_trait_gives_counter_resistance: "[GetTrait('governor').GetName( GetPlayer )] [Concept('trait', 'Özelliğinin')|E] her kademesi [EmptyScope.ScriptValue('governor_trait_counter_bonus_value')|+%0] $MOD_COMBAT_COUNTER_RESISTANCE|V$ kazandırır"
 tenet_takamin_name: "Takamin"
 tenet_takamin_desc: "Ayıların tanrıların bir tezahürü olduğuna inanılır, bu hayvanların kutsallığına hürmet edilmeli ve avlarda birini öldürmek gerekirse, bu saygıyla yapılmalıdır."
