 tradition_tgp_bushido_name: "Bushidō"
 tradition_tgp_bushido_desc: "Onur ve askerî disiplin mirasına kök salmış bu gelenek, hürmet ve yiğitlik gösterileriyle efendi ile vasal arasındaki bağı yüceltir. Karakter sağlamlığı ve dürüstlükle işlenmiş icraatlar, sarsılmaz bir sadakat ve saygı doğurur."
