 culture_era_early_medieval:0 "Iron Age"
### TODO AGOT-CHANGED: culture_era_early_medieval_desc [AGOT: The Iron Age has seen the emergence of iron and the further growth of institutions, such as the development of feudalism. Military organization and equipment have begun to allow larger states to be formed than what was once though possible, such as bureaucratic empires. | TR: Erken Orta Çağ profesyonel idarecilerin ortaya çıktığı, sahip olduğu önemli [innovations|E] ile [Concept( 'culture', 'Kültürün' )|E] Karanlık Çağları geride bırakmasını sağlayan bir dönemdir.]
 culture_era_early_medieval_desc:0 "The Iron Age has seen the emergence of iron and the further growth of institutions, such as the development of feudalism. Military organization and equipment have begun to allow larger states to be formed than what was once though possible, such as bureaucratic empires."
