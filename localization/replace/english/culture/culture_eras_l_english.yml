 culture_era_tribal:0 "Kabile"

 culture_era_tribal_desc:0 "[Concept( 'culture', 'Kültürün' )|E] Kabile Dönemi yazılı yasaların ve kurumsallaşmış hükûmetlerin öncesine dayanır. [tribal_government|E] ve [nomadic_government|E] yönetim biçimine sahip Hükümdarlar sadece Kabile Dönemi [innovations|E]ından faydalanabilir."

 culture_era_early_medieval:0 "Erken Orta Çağ"

 culture_era_early_medieval_desc:0 "Erken Orta Çağ profesyonel idarecilerin ortaya çıktığı, sahip olduğu önemli [innovations|E] ile [Concept( 'culture', 'Kültürün' )|E] Karanlık Çağları geride bırakmasını sağlayan bir dönemdir."

 culture_era_high_medieval:0 "Yüksek Orta Çağ"

 culture_era_high_medieval_desc:0 "Yüksek Orta Çağ büyük teknolojik ve idari ilerlemelerin dönemidir. Kasabalar artık birer şehirlere dönüşmüş, aristokrasi tüm gücünü korurken yeni bir şehirli sınıfı ortaya çıkmıştır."

 culture_era_late_medieval:0 "Geç Orta Çağ"

 culture_era_late_medieval_desc:0 "Geç Orta Çağ feodal dünyanın zirvesidir. Bürokratlar, zanaatkârlar ve tefeciler, Hükümdarlar dışında geçmişte ayrıcalıklı olan sınıfların gücünü yavaş yavaş elinden almaya başlamıştır."
