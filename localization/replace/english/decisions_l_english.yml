 epidemic_events.0100.t: "İzolasyon"
 epidemic_events.0100.desc: "Gece geç saatlerde başkentin pis kokusundan uzaklaşan ben ve ailem, ortaya çıkmanın doğru olacağı bir zamana kadar diyarın insanlarından uzak kalmalıyız.\n\nİletişim sınırlı olacak ve yokluğum hissedilecek ancak dört mütevazı duvarımızın ötesindeki ölüm ve çürümeden uzak kalmalıyız."
