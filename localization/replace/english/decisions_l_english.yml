 minor_decisions.0003.desc.maimed:0 "Karşımdaki [Select_CString(barrel_character.IsFemale, 'kadın', 'adam' )] hayatta epey bir zulüm görmüşe benziyor. Vücudunda yediği her yumruğun, derisini kesen her kılıcın izleri tazeliğini koruyor."
 minor_decisions.0003.desc.criminal:0 "Karşımdaki [Select_CString(barrel_character.IsFemale, 'kadın', 'adam' )] belli ki az önce zindandan çıkarılmış, yetenekleri karşılığında krallığa karşı işlediği suçlardan affedilmeyi umuyor."
 minor_decisions.0003.desc.ewan:0 "Karşımda neredeyse insanı dahi andırmayan bir [Select_CString(barrel_character.IsFemale, 'kadın', 'adam' )] duruyor. Hastalıklarla, sakatlıklar ve bozulmalarla öylesine boğuşmuş ki, karşımda durabiliyor olması başlı başına bir mucize!"
 minor_decisions.0003.desc.criminal_bridge:0 "\n\nSuçlu bir hain olsa da, kendisi"
 minor_decisions.0003.desc.bridge_1:0 "\n\nTüm bu olumsuzluklara rağmen kendisi"
 minor_decisions.0003.desc.bride_2:0 ""
 minor_decisions.0003.desc.educated:0 "hayattaki düşük konumuna rağmen yazılı dilde kendini eğitmiş önemli bir alim. [barrel_character.GetNameNoTooltip] sarayımda din, ilim veya sağlık gibi alanlarda yararlı olabilir gibi görünüyor."
 minor_decisions.0003.desc.cunning:0 "aynı zamanda yetenekli bir dolandırıcı. Öyle ki kurnazlığı ve ince zekâsıyla yerel halkı soyup soğana çevirmeyi başarmış. Belki de bu zekâsından faydalanabilir, yeteneklerini krallığın düşmanlarına karşı kullanabilirim."
 minor_decisions.0003.desc.charismatic:1 "akıcı bir şekilde [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] konuşabilen bir diplomat! Karizması ve sıradışı görüntüsü, sarayımı ziyaret eden yabancı soyluların dikkatini çekecektir."
 minor_decisions.0003.desc.organised:0 "düşük imkânlarına rağmen para yönetiminde harikalar yaratmış bir tüccar. Şüphesiz ki [ROOT.Char.GetFaith.HighGodName] vergisi yeteneklere sahip bu [Select_CString(barrel_character.IsFemale, 'kadın', 'adam' )] soyluluğa yükseltilmesi durumunda meziyetlerini benim için değerlendirebilir."
 minor_decisions.0003.desc.strong:0 "adamlarıyla sayısız yağmaya ve sokak kavgasına karışmış gerçek bir lider. Sokak arasında çamura bulanmış hâlde anlamsız kavgalara girişmektense, temiz giysiler kuşanıp sarayıma katılmalı!"
 minor_decisions.0003.desc.outro:0 "Konseyim [barrel_character.GetNameNoTooltip] için en iyi rolü belirlemiş durumda, geriye onu konseye kabul edip etmemem kalıyor."
