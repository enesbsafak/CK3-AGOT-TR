 roman_restoration.1211.t: "Jüstinyen'in Hayalleri Yıkıldı"
 roman_restoration.1211.desc.intro: "Bizans yüzlerce yıldır İtalyan yarımadasındaki son kalelerine tutunmuş, kanlı pençelerini toprağa geçirmiş ve ne kadar uğraşsak da pes etmemişlerdi.\n\nArtık işler değişti. Sonsuza dek bu topraklardan atılabilecek kadar zayıfladılar. Tüm dünya bunu bilecek.\n\n"
 roman_restoration.1211.desc.body.emperor_exists: "[emperor.GetTitledFirstNameNicknamed] i̇stediği kadar öfkelensin ve gürlesin - eğer rahat sarayından uzaktaki topraklarının kayboluşunu umursama zahmetine bile katlanabiliyorsa - ama beni durdurmak için hiçbir şey yapamaz."
 roman_restoration.1211.desc.body.emperor_absent: "İlanıma karşı çıkacak bir imparator bile yok. Gerçekten acınası."
 roman_restoration.1211.desc.outro: "\n\nGeriye kalan tek soru... [GetTitleByKey('k_sicily').GetNameNoTier] kime bağlı olacak?"
 roman_restoration.1211.a: "Sonsuza dek kuzeydeki kardeşlerimize bağlıyız."
 roman_restoration.1211.b: "Sicilya'nın kaderi her zaman olduğu gibi denizlerin ötesinde yatmaktadır."
 roman_restoration.1211.c: "Tabii ki [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ile!"
 roman_restoration.1212.t: "$roman_restoration.1211.t$"
 roman_restoration.1212.desc.intro: "Antik vatanımızın son kalıntılarını da yağmalayan her türden barbar sürülerine karşı yüzlerce yıl süren inatçı ve kararlı direnişin ardından, [taker.GetTitledFirstName] sonunda diğerlerinin yapamadığını yaptı.\n\nAdi köpek, batı yarımadasındaki son Roma kalıntılarını da ortadan kaldırdı,"
 roman_restoration.1212.desc.new_empire.italia: "toprakları [GetTitleByKey('e_italy').GetNameNoTier] ile bağlı hâle getirdi."
 roman_restoration.1212.desc.new_empire.maghreb: "toprakları [GetTitleByKey('e_maghreb').GetNameNoTier] ile Afrika bölgesine dâhil etti."
 roman_restoration.1212.desc.new_empire.own: "bölgeyi [taker.GetPrimaryTitle.GetBaseNameNoTier] toprağı yaptı."
 roman_restoration.1212.desc.outro.territory_left: "\n\nElimizde kalan dağınık ve az sayıdaki karakollar bu rezalete karşı gerçek bir direniş gösteremiyor."
 roman_restoration.1212.desc.outro.no_territory_left: "\n\nGüneyde bize ait tek bir iskele bile yokken bu adaletsizliğe direnmek için yapabileceğimiz hiçbir şey yok."
 roman_restoration.1212.a: "Küstah hödük!"
 roman_restoration.1213.t: "$roman_restoration.1211.t$"
 roman_restoration.1213.desc.intro: "Yüzyıllar boyunca İtalyan toprakları için denizler dolusu kan dökmelerine rağmen, [taker.GetTitledFirstNameNicknamed] sayesinde Romalılar sonunda [GetTitleByKey('k_sicily').GetNameNoTier] topraklarını kaybettiklerini kabullendi.\n\n"
 roman_restoration.1213.desc.new_empire.italia: "Topraklar yarımadanın kuzeyine bağlandı."
 roman_restoration.1213.desc.new_empire.maghreb: "Kendilerini [GetTitleByKey('e_maghreb').GetNameNoTier] boyunca yaşayan insanların uzaktan kuzenleri olarak gördükleri için topraklar artık Afrika'ya bağlı hâle geldi."
 roman_restoration.1213.desc.new_empire.own: "Bölge #EMP yeni#! bir imparatorluk olarak [taker.GetPrimaryTitle.GetBaseName] topraklarının bir parçası oldu."
 roman_restoration.1213.desc.body.emperor_exists: "[emperor.GetTitledFirstName] küçük bir bölgenin kaybı için beklenebilecek kadar şikayet ediyor, daha fazlasını yapmıyor."
 roman_restoration.1213.desc.body.emperor_absent: "Şikayetini dile getirecek bir imparator bile olmadan Roma İtalyası hafif bir inlemeyle ortadan kalkıyor."
 roman_restoration.1213.desc.outro.territory_left: "\n\nAdriyatik'te imparatorluktan geriye kalan birkaç toprak şimdi her zamankinden daha fazla tehlike altında görünüyor."
 roman_restoration.1213.desc.outro.no_territory_left: "\n\nBölgede tek bir Roma şehri bile kalmadığından, Jüstinyen'in hayalinin yasını tutacak hiçkimse kalmadı."
 roman_restoration.1213.a: "Çok şükür!"
 roman_restoration.1213.b: "Ne karanlık zamanlarda yaşıyoruz..."
