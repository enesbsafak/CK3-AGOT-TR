 epidemic_events.0101.t: "Kafesten Çıkış"
 epidemic_events.0101.desc: "Güneş tenimde yabancı ve düşmanca bir his uyandırıyor, rüzgar soğuk ve ihlal edici geliyor.\n\nEn son ne zaman temiz hava solumuştum?"
