 write_muwashshah_poem_decision_tooltip: "Para karşılığında satmak, kendinize saklamak ya da ücretsiz dağıtmak için yeni bir şiir yazın.\n\n$EFFECT_LIST_BULLET$Şiiri satmak bir miktar [gold_i][gold|E] kazandıracak\n$EFFECT_LIST_BULLET$Şiiri saklamak Çift Dolunay Kitabı [Concept( 'artifact', 'Eserine' )|E] etki ekleyecek\n$EFFECT_LIST_BULLET$Şiiri dağıtmak fazladan [prestige_i][prestige|E] verecek"
