 epidemic_events.0101.b: "Kapıyı kapatın cereyan yapıyor!"
 natural_disaster.0110.t: "İnziva"
 natural_disaster.0110.desc: "Gecenin geç saatlerinde başkentin kalbinden usulca uzaklaşıyoruz. Ailemle birlikte doğal düzen kendini toparlayana dek daha güvenli bir yerde, ülke halkından uzakta kalmalıyız.\n\nİletişim sınırlı olacak ve yokluğum hissedilecek ama doğanın gazabından güvende olmalıyız."
