 major_decisions.3300.t: "Kartaca'nın Yükselişi"
 major_decisions.3300.desc: "Tuzlanmış topraklardan, eski ihtişamına kavuşturulmuş yeni bir imparatorluk yükseliyor. Çok geçmeden tüccar gemileri limanları zenginlikle dolduracak ve Akdeniz üzerindeki hâkimiyet bizim olacak.\n\nBüyük Hannibal'ın acı bir yenilgiyle düştüğü yerde, ben mirasımızı geri almak için yükseleceğim. Dünya bir kez daha Kartaca'nın gerçek kudretini tanıyacak.\n\nDaha yapılacak çok iş var ama şimdilik #EMP zafer benimdir! #!"
 major_decisions.3300.a: "Kadim gelenekleri benimseyeceğim."
 major_decisions.3300.b: "İmparatorluğu uygun gördüğüm gibi şekillendireceğim."
 major_decisions.3600.t: "Kozakların Yükselişi"
 major_decisions.3600.desc: "Nesiller boyunca ister maceracı, ister sürgün, ister suçlu olsun, özgür erkekler ve kadınlar Hazar bozkırlarına yolunu buldu.\n\nBazen 'Kazak' diye de anılan bu insanlar kendi yasalarıyla yaşadı. Yine de Kumanlar bu özgür insanları boyunduruğu altında tuttu ve bozkırlara hükmetti. Benim idarem altındaki [founder_culture.GetCollectiveNoun], bu Kazakları kendinden sayıyor ve her gün daha fazlasını aramıza kabul ediyoruz.\n\nBelki de yeni bir kaderi birlikte kucaklamanın vakti gelmiştir?"
 major_decisions.3600.a: "Biz Kozaklar sonsuz göklerin altında özgürce yaşayacağız."
 major_decisions.3600.b: "Onlara hükmedeceğim ama eski usulleri koruyacağım."
