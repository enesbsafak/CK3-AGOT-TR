 proving_grounds_horse_run_domicile_building: "At Çiftliği"
 proving_grounds_horse_run_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nAtların da tıpkı insanlar gibi egzersiz ve antrenman yapması gerekir."
 proving_grounds_camel_run_domicile_building: "Deve Çiftliği"
 proving_grounds_camel_run_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nDayanıklı ve kavgacı olabilirler, tüm bunlar develerimizi sürekli bir şekilde eğitmek için daha fazla sebep yaratıyor."
 proving_grounds_elephantry_reserve_domicile_building: "Yedek Savaş Filleri"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\n[GetPlayer.GetFaith.CreatorNamePossessive] yarattığı hayvanların en büyüğü ve en yücesi olan fillere sahip olmak birçok #EMP kralın#! dahi böbürlenebileceği bir şey değil."
 proving_grounds_nightly_barding_drills_domicile_building: "Zırhlı At Talimleri"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nBağlar bükülür, deriler yırtılır, plakalar paslanır ve yapılmış talimler tıpkı herkes gibi seçkin süvari birlikleri tarafından bile zamanla unutulabilir."
 proving_grounds_life_in_the_saddle_domicile_building: "Eyer Üstünde Yaşam"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nBazıları bunun için doğar, diğerleri hayatlarının ilerleyen dönemlerinde buna göre yetiştirilir."
 proving_grounds_life_in_the_saddle_horse_archers_tt: "En az bir [archer_cavalry|E] [Concept('regiment', 'Birliğine')|E] sahibi olmalısınız"
 proving_grounds_the_stump_domicile_building: "Kütük"
 proving_grounds_the_stump_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nŞunu görüyor musun? Üzerindeki hedefi görüyor musun? Bugün hedef alacağınız yer orası. Yayları hazırlayın!"
 proving_grounds_personal_bouts_domicile_building: "Kişisel Dövüşler"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nDaha önce yaşanmış bir kafatası travması, daha sonraları alınabilecek kafatası travmaları için bir direnç oluşturabilir."
 proving_grounds_training_circle_domicile_building: "Eğitim Çemberi"
 proving_grounds_training_circle_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nBeceri sahibi #EMP olmak#! için talim yapmanız gerekmez, becerilerinizi #EMP korumak#! için talim yapmanız gerekir."
 proving_grounds_mock_battle_drills_domicile_building: "Muharebe Tatbikatları"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nMızraklardan oluşan duvar, her şeye rağmen duvardır. Ya birlikte güçlü kalır ya da birlikte çöker."
 proving_grounds_lockwagon_domicile_building: "Kilitli Yük Arabası"
 proving_grounds_lockwagon_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nBiz birlikte hareket eden, birlikte savaşan, birlikte #EMP yağmalayan#! bir grubuz. Her şey ortaya konur, oradan paylaşacağımızı paylaşırız."
 proving_grounds_martial_study_domicile_building: "Askerî Eğitim"
 proving_grounds_martial_study_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nHer muharebe daha önce yapılmış bir muharebenin benzeridir, her savaş bir başka savaşın sonucudur. Neden tarihten faydalanmayalım ki?"
 proving_grounds_the_stick_game_domicile_building: "Sopa Oyunu"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nSopayı kırmadan ilk yakalayan kazanır: Hedefe ulaşana kadar vurmaya devam edilir, keskin bir bıçağa izin verilmez ve vurulan kişi oyundan elenir."
 proving_grounds_bodyguard_drills_domicile_building: "Koruma Talimleri"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak ([GetDomicileBuilding('proving_grounds_01').GetName] gerektirir)#!\nMevcut #EMP durumumuz#!, özel birtakım tehditleri beraberinde getiriyor. Bunları ciddiye almak zorundayız."
