 baggage_train_ample_steeds_domicile_building: "At Bolluğu"
 baggage_train_ample_steeds_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nAtlar da tıpkı insanlar gibi yorulurlar. Fazladan ata sahip olmak, en ihtiyaç duyulan zamanlarda yorulanların dinlenebilmesine olanak tanır."
 baggage_train_porters_domicile_building: "Yetenekli Hamallar"
 baggage_train_porters_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nTaşıyamadıklarımızı arkamızda bırakmamız gerekir, bu sebeple taşıyabildiğimiz kadarını taşımalıyız."
 baggage_train_trackers_domicile_building: "Etkili İz Sürücüler"
 baggage_train_trackers_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nYollarda izi sürülecek bir şey her zaman vardır, bunlar kimi zaman boğalar olabileceği gibi kimi zamansa haydutlar olabilir."
 baggage_train_kennel_domicile_building: "Köpek Kulübeleri"
 baggage_train_kennel_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nKöpekler zaten bizi takip edip duruyordu, onlardan faydalansak iyi olacak."
 baggage_train_siege_engineers_domicile_building: "Kuşatma Mühendisleri"
 baggage_train_siege_engineers_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nSeyahat esnasında kuşatma için gerekli kaynaklara ve uzmanlara sahip olmak oldukça zordur. Buna kendinizi adamadığınız sürece."
 baggage_train_shrine_domicile_building: "Taşınabilir Mabet"
 baggage_train_shrine_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nDin nereye gidersek gidelim bizim yanımızdadır, yine de onun için bir yer belirlemek fena olmaz."
 baggage_train_scribes_domicile_building: "Sadık Kâtipler"
 baggage_train_scribes_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nParşömen lüks olabilir, ancak uygun yardımla bazıları için kullanışlı bir araca dönüşebilir."
 baggage_train_bartering_grounds_domicile_building: "Pazarlık Alanı"
 baggage_train_bartering_grounds_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nKampta zaten ticaret yapılıyor, onu belli bir yere odaklamak daha düzenli yapılabilmesini sağlar."
 baggage_train_proof_of_claims_domicile_building: "İddiaların Kanıtı"
 baggage_train_proof_of_claims_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nHerkes bir şeyler iddia edebilir, önemli olan bu iddiaları daha inandırıcı hâle getirmektir."
 baggage_train_ransom_cages_domicile_building: "Fidye Kafesleri"
 baggage_train_ransom_cages_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nTutsakların güvenli bir şekilde taşınması ve sergilenmesi, onlara en iyi fiyatı almanın önemli bir parçasıdır."
 baggage_train_negotiators_domicile_building: "Uzman Müzakereciler"
 baggage_train_negotiators_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nSaygınlık zedelenebilir veya arttırılabilir, özellikle bu konuda çaba sarfederseniz."
 baggage_train_ascetics_domicile_building: "Başıboş Sofular"
 baggage_train_ascetics_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nRuhani bir arayış içerisinde olanlar, seyyah grupları arasında pek görülen kişiler olmasa da, onlara saygınlık ve bilgelik kazandırır."
 baggage_train_pleasure_tents_domicile_building: "Özel Çadırlar"
 baggage_train_pleasure_tents_domicile_building_desc: "#weak ([GetDomicileBuilding('baggage_train_01').GetName] gerektirir)#!\nÇoğu konuttan bile fazla olarak kamplar genellikle ortak alanlardır ve özel kullanıma uygun değildir. Takipçilerin birçoğu birlikte #EMP yalnız#! kalabilecekleri bir yere sahip olmayı memnuniyetle karşılar."
 mess_tent_01_domicile_building: "Yemek Çadırı"
 mess_tent_01_domicile_building_desc: "Ocaktan gelen mis gibi kokular, yemek yiyenlerin çıkardığı sesler, kırık tahta kaselere doldurulan kahverengi renkteki et suyu - yolda bundan daha fazla ne isteyebilirsiniz ki?"
