 mess_tent_bakers_domicile_building: "Gezgin Fırıncılar"
 mess_tent_bakers_domicile_building_desc: "#weak ([GetDomicileBuilding('mess_tent_01').GetName] gerektirir)#!\nFırından yeni çıkmış taze ekmek, güne başlamanın en güzel yollarından birisidir."
 mess_tent_cooks_domicile_building: "Yetenekli Aşçılar"
