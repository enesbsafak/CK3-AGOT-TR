 barber_tent_surgeons_tools_domicile_building_desc: "#weak ([GetDomicileBuilding('barber_tent_01').GetName] gerektirir)#!\nHassasiyet sağlık için #EMP şart#! değildir fakat fayda sağlayacağı kesindir."
 barber_tent_dentists_tools_domicile_building: "Dişçi Aletleri"
 barber_tent_dentists_tools_domicile_building_desc: "#weak ([GetDomicileBuilding('barber_tent_01').GetName] gerektirir)#!\nDiş çürüklerine karşı iyidir, ok uçlarına karşı etkili, bir tartışmayı sonuca bağlamak için ise #EMP mükemmel#! bir yoldur."
 barber_tent_torturers_tools_domicile_building: "İşkenceci Aletleri"
 barber_tent_torturers_tools_domicile_building_desc: "#weak ([GetDomicileBuilding('barber_tent_01').GetName] gerektirir)#!\nKamp alanı gibi birbirine yakın çadırlarda, insan çığlığının nasıl hızlı yayıldığını tahmin edemezsiniz."
 barber_tent_reference_corpus_domicile_building: "Referans Kitaplığı"
 barber_tent_reference_corpus_domicile_building_desc: "#weak ([GetDomicileBuilding('barber_tent_01').GetName] gerektirir)#!\nBirçok farklı durumda faydalanılabilecek bir kitap, kılavuz veya parşömen vardır. Genellikle beraberlerinde yararlı çizimler de içerirler."
