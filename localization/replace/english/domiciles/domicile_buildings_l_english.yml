 mess_tent_herbalists_domicile_building_desc: "#weak ([GetDomicileBuilding('mess_tent_01').GetName] gerektirir)#!\nNeyin yenmesinin güvenli olduğu, neyin zehirli olabileceği, neyin kanamalı şiddet dolu bir ölüme sebep olabileceğini bilmek her zaman fayda sağlar."
 mess_tent_brewers_domicile_building: "Seyyar Biracılar"
