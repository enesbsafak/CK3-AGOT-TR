 camp_fire_trailing_musicians_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nElindeki enstrümanı çalmasını #EMP bilen#! birini dinlemek, bilmeyen birini dinlemeye nazaran çok daha keyifli."
 camp_fire_wandering_poets_domicile_building: "Gezgin Şairler"
 camp_fire_wandering_poets_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nCiddiyet, kelime oyunları, derin bir hissiyat. İyi bir şair bunların hepsine ve bunların daha fazlasına ihtiyaç duyar."
 camp_fire_capering_fools_domicile_building: "Muzip Hokkabazlar"
 camp_fire_capering_fools_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nŞaklabanlık pek saygı uyandıran bir meziyet olmayabilir fakat biri kafasını tahtaya çarptığında gülmemek mümkün değil."
 camp_fire_libations_for_the_lost_domicile_building: "Kaybedilenler İçin İçkiler"
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nBurada bir daha göremeyeceklerimiz için toplanır, henüz kaybetmediklerimizin yüzlerini hatırlarız."
 camp_fire_local_hangers_on_domicile_building: "Yerel Dalkavuklar"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nBir yere bağlı yaşamak, en ufak bir dedikodunun dahi motive edilmesine sebep olabilir."
 camp_fire_future_dreams_domicile_building: "Büyük Hırslar"
 camp_fire_future_dreams_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nUzun vadeli hedefleri unutmak kolaydır, tabii ki yapılan her işe, her konuşmaya onu dâhil etmezseniz."
 camp_fire_nightly_debates_domicile_building: "Akşam Tartışmaları"
 camp_fire_nightly_debates_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nİki bilgine bir konu hakkında ne düşündüklerini sorun, birbiriyle çatışan beş farklı fikir duyarsınız."
 camp_fire_juicy_rumors_domicile_building: "İlginç Dedikodular"
 camp_fire_juicy_rumors_domicile_building_desc: "#weak ([GetDomicileBuilding('camp_fire_01').GetName] gerektirir)#!\nEğer oyunu doğru oynarsanız, kullanılabilecek çok sayıda #EMP malzeme#! var."
