 historical_char_creation_events.1.a: "Onun kaderinde neler olduğunu merak ediyorum..."
 historical_char_creation_events.1.b: "Bana çok iyi hizmet edeceğinden şüphem yok!"
 historical_char_creation_events.1.c: "[historical_character.GetFullNameNoTooltip]? Kimin umurunda!"
 historical_char_creation_events.2.t: "Dinî Reform: Başarı"
 historical_char_creation_events.2.desc: "[inspiration_owner.GetFullName] gecesini gündüzüne katarak kitaplar ve parşömenler arasında hummalı bir çalışma yürüttü. Kendisi sorgulanamaz bir dehaya sahip ve yazdıklarını okurken...\n\nGözlerime inanamıyorum. Bu, bu yazılanlar #EMP her şeyi#! değiştirebilir."
 historical_char_creation_events.2.a: "Bu kutsal yazılar her yere dağıtılmalı!"
 religious_reformer_modifier: "Dinî Reformcu"
 religious_reformer_modifier_desc: "Büyük bir dehanın yardımıyla, bu karakter yeni bir mezhep yaratmaya hazırlanıyor.\n\nYeni [faith|E] oluşturulduğunda bu etki silinir"
 mass_conversion_tt: "Bir kereliğine #V $legendary_conversion$#! [Concept('decision', 'Kararını')|E] kullanma hakkı tanır"
 religious_inspiration: "Dinî İlham"
 religious_inspiration_desc: "Dinî ilham sahibi karakterler, kalplerini ve ruhlarını kağıda akıtarak [Concept('faith', 'Mezhebin')|E] inceliklerini ve gizemlerini öğrenmeye çalışırlar. Genellikle reformcu veya dinî hareketlerin lideri olarak görülürler. Bu ilham türüne #EMP çok nadir#! rastlanır."
 historical_character.karunakara: "Karunakara, Chola kralı Kulottunga'nın ünlü bir generaliydi ve Chola davasına karşı olan düşmanları ve hainleri ezmiştir. Karunakara'nın yaşamı, Kalinga'yı hâkimiyeti altına alıp ardından Kulottunga'ya bağlılığını göstermesini destansı bir şekilde anlatan Kalinkkattuparani adlı şiirde yüceltilir."
 historical_character.sekkilhar: "Dahi bir çocuk olarak Sekkilhar, Raja Kulothunga tarafından genç yaşta bakan ve devlet adamı olarak görevlendirilmiştir. 63 Şaiva Nayanar azizinin yaşam öyküsünü 4253 dizede anlatan Periya Puranam'ı yazmasıyla ünlüdür. Zamanla Sekkilhar da kutsal bir figür haline gelmiş ve bugün hâlâ bölgesinde yapılan tören alaylarında bir ilahî sembol olarak taşınır."
 historical_character.omar_khayyam: "Omar Hayyam, 11. yüzyılda yaşamış bir İranlı bilgin, şair, matematikçi ve astronomdur. Günümüzde en çok 'Rubaiyat' şiirleriyle tanınsa da, Cebir ve astronomi alanlarında önemli katkılar yapmıştır. Kübik denklemleri sınıflandırması ve çözümündeki başarıları, matematik tarihinde anıtsal bir değere sahiptir."
 historical_character.bhaskaracharya: "Bhaskaracharya, 12. yüzyılda yaşamış bir Hintli matematikçi ve astronomdur. 'Siddhanta Shiromani' adlı eseri aritmetik, cebir, gezegen matematiği ve küresel trigonometriyi kapsayan bir başyapıttır. Hesap (kalkülüs) üzerine çalışmaları Newton ve Leibniz'den yüzyıllar öncesine dayanır."
 historical_character.joseph_rabban: "Joseph Rabban, 9. yüzyılda Malabar'da öne çıkan Yahudi cemaatinin önemli bir lideriydi. Çera kralının Koçin'deki Yahudi topluluğuna tanıdığı hak ve ayrıcalıklar sayesinde Rabban, Yahudilerin Güney Hindistan'daki varlığını ve etkisini güvence altına almıştır. Ticari ve kültürel katkılarıyla özerklik ve saygı görmelerini sağlamıştır."
 historical_character.atisha: "Atisha, Orta Çağ Budizmi'nin en büyük isimlerinden biridir. Bengal asıllı olup Bihar'daki Vikramashila manastırıyla özdeşleşmiştir. Mahayana ve Vajrayana Budizmi'ni Güneydoğu Asya ve Tibet'e yayarak bu bölgelerde Budizm'in gelişmesinde kritik rol oynamıştır."
 historical_character.hemachandra: "Hemachandra, 12. yüzyılda yaşamış Hintli bir bilgin, çok yönlü âlim ve Jain keşiştir. Matematik, gramer, vezin (prosodi) ve felsefe alanlarında önemli katkılar yapmıştır. 'Siddhahem' adlı eseri Jain literatüründe kilit bir metin olup Jain eğitimini ve uygulamalarını derinden etkilemiştir."
 historical_character.kshemendra: "Kshemendra, 11. yüzyılın Keşmirli bir şair ve bilginidir. Eserlerinde hiciv, parodi ve dinî metinler gibi geniş bir yelpaze bulunmaktadır. 'Samaya Matrika' ve 'Darpadalana' gibi eserleriyle dönemin toplumsal adetlerini mizahi bir dille eleştirerek Sanskrit edebiyatında özgün bir konum edinmiştir."
 historical_character.akka_mahadevi: "Akka Mahadevi, 12. yüzyılda Karnataka'da yaşamış bir şair ve Lingayat Bhakti hareketinin önde gelen bir figürüdür. Vachana adlı şiirsel düzyazılarıyla tanınır; dünyevi hayatı reddederek kadınların manevi uygulamalardaki eşitliğini savunmuş ve toplumsal normlara meydan okumuştur."
 historical_character.namdev: "Namdev, 13. yüzyılda yaşamış bir Marathi aziz ve şair olup Vithoba'ya adadığı ilahileriyle ünlüdür. Halk arasında büyük saygı gören Namdev, Maharashtrada Bhakti hareketine güç katmış ve Marathi dilinin dinî şiirlerdeki prestijini artırmıştır."
 historical_character.madhvacharya: "Madhvacharya, 13. yüzyılda Hindistan'da Vedanta'nın Dvaita (ikicilik) ekolünü savunan başlıca filozoftur. Ruh (Atman) ile Tanrı (Brahman) arasındaki ayrımı vurgulayarak, dönemin egemen teklikçi felsefelerine karşı yeni bir düşünce okulu geliştirmiştir. Eserleri, Hindu teolojisinde kalıcı bir etki bırakmıştır."
 historical_character.vidyapati: "Vidyapati, 14. yüzyılda Bihar'da yaşamış bir şair ve bilgindir. Aşk şiirleri ve Şiva'ya adadığı ilahileriyle tanınır; bu eserler Bhakti hareketini derinden etkilemiştir. Duygusal yoğunluğu ve lirik güzelliğiyle Vidyapati, Orta Çağ Hint edebiyatının önemli figürlerindendir."
 historical_character.abhinavagupta: "Abhinavagupta, 10.-11. yüzyılda Keşmir'de yaşamış bir Hint filozof ve mistiktir. Özellikle İkicilik karşıtı Şaivizm'de büyük saygınlığa sahiptir. Estetik ve maneviyat üzerine geliştirdiği teoriler 'Abhinavabharati' adlı yorumunda yer alır ve Hindu felsefesini derinden şekillendirmiştir."
 historical_character.basava: "Basava, 12. yüzyılda Hint toplumunda köklü değişimler başlatan bir filozof ve sosyal reformcudur. Lingayatizm hareketinin kurucusu olarak kast sistemine karşı çıkmış, Shiva'ya duyulan sadakate dayalı bir maneviyatı savunmuştur. Vachana adı verilen şiirsel metinleriyle manevi eşitlik fikrini yaymıştır."
 historical_character.hildegard: "Hildegard von Bingen, 12. yüzyılda yaşamış bir Alman rahibe, mistik, yazar ve bestecidir. Dinî vizyonları, teolojik, tıbbi ve müzikal metinleriyle Orta Çağ Hristiyan düşüncesine katkıda bulunmuş, litürjik besteleri ve oyunlarıyla ruhani ve bütüncül şifa anlayışını vurgulamıştır."
 historical_character.thomas_aquinas: "Thomas Aquinas, 13. yüzyılda yaşamış Dominiken bir teolog ve filozoftur. 'Summa Theologica' adlı eserinde Aristotelesçi felsefeyi Hristiyan teolojisiyle sentezlemiş, akıl ile inancı uyumlu kılmıştır. Hristiyan doktrini, doğal hukuk ve etiğin gelişiminde kalıcı bir etkiye sahiptir."
 historical_character.dante_alighieri: "Dante Alighieri, 'İlahi Komedya' adlı eseriyle ünlü İtalyan şairdir. Cehennem, Araf ve Cennet yolculuğunu anlatan bu epik yapıt, Batı edebiyatı ve Hristiyan teolojisinde derin izler bırakmıştır. Dante, 'İtalyan dilinin babası' olarak kabul edilir."
 historical_character.thomas_becket: "Thomas Becket, İngiltere Kralı II. Henry ile Kilise hakları konusunda çatışan bir başpiskopos ve azizdir. Kilise'nin egemenliğini savunması, 1170'te Canterbury Katedrali'nde katledilmesiyle sonuçlanmıştır. Şehitliği, Canterbury'i önemli bir hac merkezi haline getirmiştir."
 historical_character.maimonides: "Maimonides (İbn Meymun), 12. yüzyılda yaşamış bir Yahudi filozof ve bilgindir. 'Mişne Tora' adlı hukuk kodu ve 'Delalette el-Ha'irin' (Şaşırmışlara Rehber) adlı eseriyle tanınır. Din ile felsefe arasındaki ilişkiyi ele alarak Yahudi düşüncesine yön vermiştir."
 historical_character.chretien_de_troyes: "Chrétien de Troyes, Orta Çağ Fransız edebiyatında Arthur efsanesine büyük katkılarda bulunmuş bir yazardır. 'Lancelot' ve 'Perceval' gibi eserlerinde Kutsal Kase'yi ve saray aşkını edebiyata kazandırarak şövalye romans geleneğini şekillendirmiştir."
 historical_character.egil_skallagrimrsson: "Egil Skallagrímsson, Viking dönemi İzlanda destan kahramanlarından biridir. 'Egil'in Destanı'nda savaşçı-şair olarak tasvir edilen Egil, sert mizacı, güçlü şiirleri ve İngiltere'ye yapılan baskınlardaki rolüyle hatırlanır."
 historical_character.gunnlaug_ormstunga: "Gunnlaug Ormstunga, 'Gunnlaug'un Yılan Dilli Destanı'nın baş kahramanı, seyahatleri ve şiirsel rekabetleriyle bilinen bir Viking savaşçı-şairdir. Destan, trajik aşk hikâyesi ve şöhret uğruna verilen mücadelesi etrafında şekillenir."
 historical_character.torbjorg_the_seeress: "Kahin Þorbjörg, 'Eirik Raudi Destanı'nda kehanet gücüyle tanınan bir figürdür. Spá (kehanet) ve seiðr (büyü) uygulamalarıyla Nors inanışında önemli bir yere sahiptir ve törensel sahnelerde geleceği öngörür."
 historical_character.erik_rode: "Erik Röde (Kızıl Erik), Grönland'a ilk İskandinav yerleşimlerini kuran ünlü bir Viking kâşifdir. Maceracı ruhu ve liderliği sayesinde Grönland'da uzun süreli yerleşim topluluklarının oluşmasını sağlamıştır."
 historical_character.alhazen: "Hasan el-Heysem (Alhazen), 11. yüzyılda yaşamış bir Arap matematikçi ve fizikçidir. 'Optik Kitabı' ile modern optiğin temellerini atmış, deneysel yöntemi vurgulamış ve İslam'ın Altın Çağı'nda bilime katkı sunmuştur."
 historical_character.ibn_battuta: "İbn Battuta, 14. yüzyılda yaşamış Faslı bir seyyahdır ve 120.000 km'yi aşan yolculuklarıyla ünlenmiştir. 'Rihla' adlı seyahatnamesinde İslam dünyasını ve ötesini ayrıntılı şekilde anlatarak dönemin kültür ve toplumları hakkında değerli bilgiler sunmuştur."
 historical_character.william_of_ockham: "William of Ockham, 14. yüzyılda yaşamış bir İngiliz filozof ve teologdur. 'Ockham'ın Usturası' olarak bilinen ilkeyi geliştirerek basit açıklamaları tercih etmiştir. Kilise otoritesini sorgulayan fikirleri, mantık, bilim ve siyaset düşüncesini etkilemiştir."
 historical_character.geoffrey_chaucer: "Geoffrey Chaucer, 14. yüzyılda yaşamış İngiliz şair ve yazardır. 'Canterbury Hikâyeleri' adlı eseriyle Orta Çağ İngiliz toplumunu canlı karakterlerle resmeder. Mizahı, çeşitliliği ve gerçekçi anlatımıyla Chaucer, İngiliz şiirinin temelini atan isimdir."
 historical_character.aaron_of_lincoln: "Aaron of Lincoln, 12. yüzyılda İngiltere'de yaşamış varlıklı bir Yahudi finansçıdır. Asillere ve Kilise'ye katedral inşaları gibi projelerde büyük krediler sağlamıştır. Ölümünden sonra Kral II. Henry, onun muazzam servetine el koymuştur."
 historical_character.john_wycliffe: "John Wycliffe, 14. yüzyılda yaşamış İngiliz bir teolog ve erken dönem reformcudur. İncil'in İngilizce'ye çevrilmesi gerektiğini savunmuş, böylece Protestan Reformu'nun temellerini atmıştır. Kilise otoritesini sorgulayan görüşleri Lollard hareketine ve Luther gibi sonraki reformculara ilham vermiştir."
 historical_character.roger_bacon: "Roger Bacon, 13. yüzyıl İngiliz filozof ve Fransiskan keşiştir. Deneysel yöntemi savunarak gözlem ve deneye dayalı bilim anlayışının öncülerinden olmuştur. Optik ve simya alanlarındaki çalışmalarıyla Orta Çağ'da deneysel bilimin yükselişine katkı sağlamıştır."
 historical_character.heloise_dargenteuil: "Héloïse d'Argenteuil, 12. yüzyılda yaşamış bir Fransız entelektüel, rahibe ve Peter Abelard ile ünlü mektuplarıyla tanınan bir figürdür. Bu mektuplar derin entelektüel ve duygusal içerikleriyle Orta Çağ aşk ve felsefe anlayışını yansıtır."
 historical_character.peter_abelard: "Peter Abelard, 12. yüzyılda yaşayan Fransız filozof ve teologdur. 'Sic et Non' adlı eseriyle teolojik soruları diyalektik yöntemle ele almış, skolastik düşünceyi etkilemiştir. Héloïse ile yaşadığı dramatik aşk öyküsü Orta Çağ'da ünlü bir anlatı haline gelmiştir."
 historical_character.petrarch: "Petrarch, 14. yüzyılda yaşamış İtalyan bilgin ve şairdir. 'Hümanizmin Babası' sayılan Petrarch, 'Canzoniere' adlı şiir derlemesinde Laura'ya duyduğu aşkı ifade etmiş, antik klasiklere dönüşü savunarak Rönesans hümanizmini beslemiştir."
 historical_character.christine_pizan: "Christine de Pizan, 14. yüzyılda yaşamış Fransız yazar ve şairdir. Kadın hakları ve eğitimi savunan eserleriyle öne çıkar. 'Kadınlar Kentinin Kitabı' adlı eserinde dönemin kadın karşıtı önyargılarını eleştirerek feminist düşüncenin öncülerinden biri sayılır."
 historical_character.giotto_di_bondone: "Giotto di Bondone, 13.-14. yüzyıl İtalyan ressam ve mimardır. Bizans üslubundan uzaklaşıp perspektif ve realizme vurgu yaparak Rönesans resminin zeminini hazırlamıştır. Padua'daki Scrovegni Şapeli freskleri en ünlü eserlerindendir."
 historical_character.fibonacci: "Leonardo Fibonacci, 12.-13. yüzyılda yaşamış bir İtalyan matematikçidir. Hint-Arap rakam sistemini Avrupa'ya tanıtan 'Liber Abaci' adlı eseri ve Fibonacci Dizisi'ni ortaya koymasıyla ünlüdür. Bu dizinin doğadaki örüntülerle ilişkisi, matematikte kalıcı bir etki bırakmıştır."
 historical_character.giovanni_boccaccio: "Giovanni Boccaccio, 14. yüzyıl İtalyan yazar ve şairidir. 'Decameron' adlı eseri, Veba'dan kaçan on kişinin anlattığı öykülerden oluşur. Karakter çeşitliliği, mizahı ve insan doğasını incelemesiyle Rönesans edebiyatına yön vermiş, Chaucer gibi yazarlara esin kaynağı olmuştur."
 historical_character.snorri_sturluson: "Snorri Sturluson, 13. yüzyıl İzlandalı tarihçi, şair ve politikacıdır. 'Nesir Edda' ve 'Heimskringla' gibi eserleriyle Nors mitolojisi ve tarihi hakkında temel kaynaklar sunarak günümüzün Nors kültür anlayışını şekillendirmiştir."
 historical_character.hrotsvitha: "Hrotsvitha, 10. yüzyıl Alman bir kanoniz, şair ve oyun yazarıdır. Hristiyan döneminin ilk kadın oyun yazarı kabul edilir. Klasik etkileri Hristiyan temalarla harmanlayan eserleri, Orta Çağ'da kadın entelektüel gücünün nadir örneklerindendir."
 historical_character.ramanuja: "Ramanuja, 11. yüzyılda yaşamış bir Hint teolog ve Sri Vaishnavizm geleneğinin kurucusudur. Brahman ile Atman arasındaki nitelikli ikiciliği savunarak o dönemin hakim monist felsefelerine karşı yeni bir yorum getirmiştir. Bu yaklaşımı Hindu teolojisinde kalıcı izler bırakmıştır."
 historical_character.arnaldus_de_villa_nova: "Arnaldus de Villa Nova, 13. yüzyıl Katalan hekim, simyacı ve bilgin olup tıp ve kimyada erken bilimsel yöntem savunusuyla tanınır. Çalışmaları Avrupa tıp düşüncesini ve kimyanın gelişimini etkilemiştir."
 historical_character.ibn_khaldun: "İbn Haldun, 14. yüzyılda Tunuslu bir bilgin, tarihçi ve sosyologdur. 'Mukaddime' adlı eseriyle tarihi, toplumsal ve ekonomik dinamikler üzerinden analiz ederek modern sosyoloji, tarih yazımı ve iktisadın öncülerinden biri kabul edilir."
 historical_character.rumi: "Mevlânâ Celâleddîn-i Rûmî, 13. yüzyıl İranlı şair, düşünür ve Sufi mutasavvıf. 'Mesnevî' adlı eseri, ilahi aşkı, sabrı ve hakikati vurgulayarak tasavvuf geleneğine yön vermiştir. Öğretileri sevgi, hoşgörü ve ilahi hakikat arayışını esas alır."
 historical_character.avicenna: "İbn Sina (Avicenna), İslam'ın Altın Çağı'nda yaşamış çok yönlü bir İranlı bilgin, hekim, astronom ve filozoftur. 'El-Kanun fi't-Tıb' ve 'Kitab el-Şifa' adlı eserleri, hem İslam dünyası hem de Avrupa'da yüzyıllarca tıp eğitiminin temelini oluşturmuştur."
 historical_character.averroes: "İbn Rüşd (Averroes), 12. yüzyıl Endülüs'te yaşamış bir filozof ve kadıdır. Aristoteles felsefesini İslami gelenekle bağdaştırmaya çalışmış, akıl ile vahiy arasında uyum aramıştır. Hem İslam hem de Latin Hristiyan dünyasında etkili olarak Rönesans düşüncesini etkilemiştir."
 historical_character.al_biruni: "El-Birûnî, 11. yüzyılda İranlı bir bilgin ve çok yönlü âlimdir. Astronomi, matematik ve coğrafya alanlarında yazdığı eserlerle ünlüdür. Hindistan'ın dinleri ve felsefelerini objektif bir gözle inceleyerek kültürlerarası anlayışa katkı sağlamıştır."
 historical_character.rashi: "Rashi (Şlomo Yitzchaki), 11. yüzyılda yaşamış bir Fransız haham ve Yahudi âlimidir. Talmud ve Tevrat'a yaptığı kapsamlı yorumlar, Yahudi hukuk ve eğitiminde temeldir. Rashi'nin eserleri geleneksel Yahudi öğreniminin vazgeçilmez kaynaklarıdır."
 historical_character.yehuda_halevi: "Yehuda Halevi, 12. yüzyılda Endülüs'te yaşamış bir Yahudi şair ve filozoftur. 'Kuzari' adlı eserinde Yahudiliğin felsefi temellerini ele almış, şiirlerinde Siyon özlemini işlemiştir. Duygusal ve derin lirik tarzıyla Orta Çağ İbranî edebiyatında öne çıkar."
 historical_character.shaprut: "Hasdai ibn Shaprut, 10. yüzyılda İslamî İspanya'da bir Yahudi hekim, diplomat ve bilgin olarak hizmet etmiştir. Kurtuba Halifesi III. Abdurrahman'ın danışmanı olarak, Yahudi ve İslam âlimleri arasında kültürel alışverişi teşvik etmiş, entelektüel diyalogu güçlendirmiştir."
 historical_character.gersonides: "Levi ben Gershon (Gersonides), 14. yüzyıl Fransız Yahudi filozof, astronom ve matematikçidir. Mantık, matematik ve astronomi alanlarında çalışmalar yapmış, özgür irade ve ilahi bilgi üzerine felsefi tartışmalarıyla sonraki düşünürlere ilham vermiştir."
 historical_character.ezra: "Abraham ibn Ezra, 12. yüzyılda yaşamış bir Yahudi bilgini, şairi ve kâşifidir. İbranice İncil'e yaptığı derin yorumlar, astroloji ve matematik konusundaki yazıları Akdeniz çevresindeki entelektüel çevrelerde yankı bulmuştur."
 historical_character.gabriol: "Şelemo ibn Gabirol (Solomon ibn Gabirol), 11. yüzyıl Endülüs Yahudi filozof ve şairidir. Yeni-Platoncu 'Hayat Pınarı' eserinde Tanrı ve evrenin doğasını sorgulamış, İbranice şiirleriyle Yahudi ve Hristiyan düşüncesine kalıcı etkiler bırakmıştır."
 historical_character.nachmanides: "Nachmanides (Musa ben Nahman, Ramban), 13. yüzyıl Yahudi bilgin, teolog ve mistiktir. Tevrat'a yaptığı yorumlar hukuku, mistik düşünceyi ve etiği birleştirir. 1263'te Barselona Tartışması'nda Yahudiliği cesurca savunarak Yahudi düşüncesine katkıda bulunmuştur."
 historical_character.crescas: "Hasdai Crescas, 14. yüzyıl Yahudi filozofudur. Aristotelesçi felsefeye meydan okuyan 'Or Adonai' adlı eseriyle modern Yahudi felsefesinin temellerini atmış, Spinoza gibi sonraki düşünürlere esin kaynağı olmuştur."
 historical_character.saadia: "Saadia Gaon, 10. yüzyılda yaşamış bir Yahudi filozof, teolog ve bilgindir. 'Emunot ve-Deot' (İnançlar ve Görüşler) adlı eseri, Yahudi teolojisini İslami ve Yunan felsefesiyle harmanlayan ilk sistematik girişimlerden biridir."
 historical_character.awkal: "Yusuf ibn 'Awkal, 10. yüzyılda yaşamış bir Yahudi tüccar ve seyyahdır. Akdeniz, Yakın Doğu ve Afrika'da gerçekleştirdiği ticari yolculuklarla ticaret, kültürel etkileşim ve Yahudi topluluklarının durumu hakkında ayrıntılı bilgiler sunmuştur."
 historical_character.benjamin_of_tudela: "Tudelalı Benjamin, 12. yüzyılda yaşamış bir Yahudi seyyah ve kâşiftir. 'Benjamin Seyahatnamesi' adlı eseriyle Avrupa, Asya ve Afrika'daki Yahudi cemaatlerini ve bölgesel kültürleri, ekonomik koşulları ayrıntılı şekilde aktarır."
 historical_character.marco_polo: "Marco Polo, 13. yüzyıl Venedikli bir tüccar, kâşif ve yazardır. İpek Yolu üzerinden Çin ve Uzak Doğu'ya yaptığı seyahatleri 'Marco Polo'nun Seyahatleri' adlı eserinde anlatmış, böylece Avrupalılara Asya hakkındaki bilgiyi zenginleştirerek kültürlerarası etkileşime katkı sağlamıştır."
 historical_character.bridget_of_sweden: "İsveçli Aziz Bridget, 14. yüzyılda yaşamış bir mistik ve azizedir. Kocasının ölümünden sonra kendini dine adamış, Brigittin Tarikatı'nı kurmuş, vizyonları ve dinî metinleriyle Hristiyan maneviyatına katkı yapmıştır."
 historical_character.meister_eckhart: "Meister Eckhart, 13. yüzyıl Alman bir teolog, filozof ve mistiktir. Vaazları ve yazılarıyla Tanrı-insan ilişkisini sorgulamış, ruhun ilahi hakikatle birleşimini vurgulamıştır. Manevî tecrübeyi merkezine alan düşünceleri sonraki mistiklere ilham vermiştir."
 historical_character.jangar: "Jangar, Oyrat 'Jangar Destanı'nın efsanevi kahramanıdır. Şambhala benzeri bir ütopya kurup halkını bilgelik ve cesaretle yönetir. Mücadeleleri ve idealleri Oyrat halkının güçlükler karşısındaki direnç ve umutlarını yansıtır."
 historical_character.zawisza: "Kara Zawisza, 15. yüzyıl Polonyalı bir şövalye ve komutandır. Cesareti ve şövalyelik erdemleriyle tanınan Zawisza, 1410 Grünwald Muharebesi'nde sivrilmiş ve 1428'de Golubac kalesinin kuşatmasında kahramanca can vermiştir."
 historical_character.theophanes_the_greek: "Yunan Theophanes, Bizans kökenli ünlü bir ressamdır. Duygusal derinlik katarak Rus ikonografisini dönüştürmüş, klasik Bizans tarzından daha hareketli ve duygusal bir ifade biçimi geliştirmiştir. Novgorod ve Moskova'da yaptığı freskler en bilinen örneklerdir."
 historical_character.nicetas_choniates: "Nicetas Choniates, 12.-13. yüzyıl Bizans devlet adamı ve tarihçisidir. 'Kronik' adlı eseri 1118-1207 dönemi Bizans siyaseti, toplumu ve Dördüncü Haçlı Seferi olayları hakkında ayrıntılı bilgi sunar, Bizans'ın çöküş sürecini belgelemiştir."
 historical_character.michael_psellos: "Michael Psellos, 11. yüzyılda Bizans'ta filozof, siyasetçi ve tarihçidir. Sarayda birçok imparatora danışmanlık yapmış, Yunan felsefe ve bilimlerinin canlanmasında rol oynamıştır. 'Chronographia' adlı eseri saray entrikalarını ve siyaseti detaylıca anlatır."
 historical_character.john_tzetzes: "John Tzetzes, 12. yüzyıl Bizans âlimi, edebiyatçı ve eleştirmenidir. Klasik edebiyat, gramer, mitoloji ve tarih konularında yazılar yazmış, 'Chiliades' adlı eseriyle mitolojik ve tarihsel anekdotlar derlemiştir."
 historical_character.theophylact_of_ohrid: "Theophylact, 11. yüzyılda Ohri Başpiskoposu ve Bizans âlimidir. Görev süresince bölgenin dini ve kültürel yaşamında etkin olmuş, Doğu Ortodoks teolojisine katkı sağlamıştır."
 historical_character.eustathius_of_thessalonica: "Eustathius, 12. yüzyılda Selanik Başpiskoposu, âlim ve teologdur. Homeros'a yazdığı detaylı şerhler ve Sicilian istilasından sonra kentin yeniden yapılandırılması için gösterdiği çabalarla tanınır."
 historical_character.nicephorus_blemmydes: "Nicephorus Blemmydes, 13. yüzyıl Bizans filozof ve teologudur. Kendi okulu ve manastırında felsefe, teoloji ve bilim öğreterek klasik fikirleri Hristiyan doktrinle uzlaştırmaya çalışmıştır."
 historical_character.georgius_pachymeres: "Georgius Pachymeres, 13. yüzyıl Bizans tarihçisi ve bilginidir. 'Historia Byzantina' adlı eseri, 1255-1308 yıllarını kapsayan Bizans tarihine ışık tutar, özellikle Palaiologos hanedanı dönemini ayrıntılı şekilde anlatır."
 historical_character.manuel_moschopoulos: "Manuel Moschopoulos, 13.-14. yüzyıl Bizans dilbilimci ve âlimdir. Antik Yunan metinlerini açıklığa kavuşturmak, gramer konularında yazmak ve klasik edebiyatı korumak için çalışmıştır."
 historical_character.theodore_metochites: "Theodore Metochites, 14. yüzyılda çok yönlü bir Bizans düşünürü, astronom, matematikçi ve sanat hamisidir. İmparator II. Andronikos Palaiologos'un başdanışmanı olarak Khora Kilisesi'ndeki mozaik ve fresklerin yaptırılmasıyla ünlüdür."
 historical_character.michael_choniates: "Michael Choniates, 12. yüzyılda Atina Başpiskoposu, şair ve bilgin olarak görev yapmıştır. Bizans hâkimiyetinin zayıfladığı bu dönemde, kentin entelektüel geleneklerini sürdürmeye çabalamıştır."
 historical_character.joseph_tarchaneiotes: "Joseph Tarchaneiotes, 11. yüzyılda Bizans generali olup Selçuklulara karşı yürütülen askeri operasyonlarda rol oynamıştır. İmparator I. Alexios Komnenos döneminde Nikaea savunmasında kilit rol üstlenmiştir."
 historical_character.gemistus_pletho: "Gemistus Plethon, 15. yüzyıl Bizans filozofudur. Neoplatonizmi diriltmiş, Floransa Konsili'nde Ortodoks ile Katolik Kiliselerin birleşmesini savunarak Osmanlı tehdidine karşı Hristiyan birliğini amaçlamıştır. Bu fikirleri Rönesans düşüncesine temel hazırlamıştır."
 historical_character.arethas_of_caesarea: "Kayserili Arethas, 10. yüzyılda bir başpiskopos, bilgin ve el yazması koleksiyoncusudur. Antik Yunan eserlerini derleyerek Bizans Rönesansı'na ön ayak olmuş, klasik bilgiyi gelecek nesillere aktarmıştır."
 historical_character.basil_lekapenos: "Basil Lekapenos, 10.-11. yüzyılda Bizans sarayında görev yapan güçlü bir hadım devlet adamıdır. İmparator I. Romanos Lekapenos'un gayrimeşru oğlu olarak parakoimomenos makamına yükselmiş, saray siyasetinde büyük nüfuz kazanmıştır."
 historical_character.john_the_orphanotrophos: "Yetimhaneci John, 11. yüzyılda Bizans sarayında önemli bir hadım ve devlet adamıdır. Yetimhane ve yoksulların refahından sorumlu olarak imparator IV. Mihail'in yükselişine destek vermiştir."
 historical_character.samonas: "Samonas, 9.-10. yüzyılda Bizans sarayında hadım ve parakoimomenos olarak hizmet etmiş, İmparator VI. Leo döneminde siyasi etkisini arttırarak saray entrikalarında önemli bir rol oynamıştır."
 historical_character.peter_the_eunuch: "Hadım Peter, 10. yüzyılda Bizans'ta savaşçı güçleriyle dikkat çeken bir hadım ve askerî komutandır. Özellikle İmparator II. Basil döneminde Bardas Skleros isyanının bastırılmasında etkili olmuştur."
 historical_character.constantine_the_paphlagonian: "Paflagonyalı Konstantin 9. yüzyılda Bizans'ta etkili bir saray görevlisi ve hadımdır. Bilge İmparator VI. Leo'nun parakoimomenos'u, yani kâhyası, olarak görev yapmıştır. Saraydaki siyasi entrika ve hizipçilik döneminde istikrarı koruma çabalarıyla tanınır."
 historical_character.peter_the_stratopedarches: "Peter 'Stratopedarches', 10. yüzyılda önemli bir komutan ve "bedensel gücü bol olan" bir hadımdı. İmparator II. Basil döneminde, özellikle de Bardas Skleros isyanı sırasında önemli bir rol oynamıştır."
 historical_character.basilios_bessarion: "Basilios Bessarion, 15. yüzyılda yaşayan bir bilgin, filozof ve kardinaldir. Ortodoksluktan Katolikliğe geçerek Floransa Konsili'nde iki kilisenin birleşmesini savunmuş, bu da Hristiyan dünyasının Osmanlı tehdidine karşı birlik arayışını yansıtmıştır."
 historical_character.demetrios_kydones: "Demetrios Kydones, 14. yüzyılda yaşamış Bizanslı çevirmen, âlim ve diplomattır. Latin skolastik filozofların eserlerini Yunancaya çevirerek Doğu-Batı düşünceleri arasında köprü kurmuş, Katolik geleneklerine ilgi duymuştur."
 historical_character.manuel_holobolos: "Manuel Holobolos, 13. yüzyıl Bizans âlimi ve devlet görevlisidir. Edebi üslubu ve hitabet yeteneğiyle tanınan Holobolos, mektuplar, konuşmalar ve denemeler yazarak dönemin entelektüel hayatına katkı sağlamıştır."
 historical_character.john_axuch: "John Axuch, 12. yüzyılda Bizans generali ve II. Ioannes Komnenos'un en güvendiği danışmanıdır. Aslen Selçuklu kökenli bir çocuk esir olarak saraya giren Axuch, sadakat ve askeri becerisiyle imparatorun en yakın destekçisi haline gelmiştir."
 historical_character.mkhitar_gosh: "Mkhitar Gosh, 12. yüzyıl Ermeni bilgin, ruhani ve hukukçudur. Ermeni hukuku üzerine yazdığı 'Datastanagirk' adlı eserle Ermeni hukuk düşüncesine yön vermiştir."
 historical_character.shota_rustaveli: "Şota Rustaveli, 12. yüzyıl Gürcü şairidir. 'Kaplan Postlu Şövalye' adlı eseri Gürcü edebiyatının ulusal başyapıtı sayılır ve şiirinde kahramanlık, onur ve sevgi temalarını işlemiştir."
 historical_character.grigor_tatevatsi: "Grigor Tatevatsi, 14. yüzyıl Ermeni filozof, teolog ve eğitimcidir. Tatev Manastırı'nda eğitmen ve lider olarak Ermeni düşünce ve dinî yaşamında etkili olmuştur."
 historical_character.sargis_pitsak: "Sargis Pitsak, 14. yüzyıl Ermeni el yazması ustası ve müzehhibidir. El yazması sanatında gösterdiği beceri, Orta Çağ Ermeni kültüründe kitap yazımının gelişimine katkı sağlamıştır."
 historical_character.medici: "Averardo de' Medici (Bicci), Medici ailesinin erken dönem atalarından olup ailenin Floransa'da politik ve sosyal nüfuz elde etmesinde temel rol oynamıştır."
 historical_character.borgia: "Alfonso de Borgia, 1455'te III. Callixtus adıyla papalık makamına gelmiş bir İspanyol kardinal ve diplomattır. Papalığı öncesinde önemli siyasi anlaşmazlıklarda arabuluculuk yapmıştır."
 historical_character.william_wallace: "William Wallace, 13. yüzyılda İskoçya Bağımsızlık Savaşları'nda İngiltere'ye karşı direnişiyle ünlü bir şövalye ve liderdir. Stirling Köprüsü Muharebesi'ndeki zaferiyle ün kazanmış, İskoçya'nın Koruyucusu unvanını almıştır."
 historical_character.la_hire: "Étienne de Vignolles (La Hire), Yüzyıl Savaşları'nın son evrelerinde Jan d'Arc komutasındaki Fransız ordusunda öne çıkan bir komutandır. Cesareti ve askeri becerisiyle tanınır."
 historical_character.bar_sauma: "Rabban Bar Sauma, Yuan Hanedanı döneminde Çin'den gelen bir Nestûrî keşiş ve diplomattır. Kudüs'e hac yolculuğu başarısız olunca Bağdat'ta yıllar geçirmiş, ardından Moğol elçisi olarak Avrupa hükümdarları, Bizans İmparatoru ve Papa ile Franco-Moğol ittifakı konusunda görüşmeler yapmıştır."
 historical_character.hodja: "Nasreddin Hoca, Türk ve komşu kültürlerde bilinen efsanevi bir halk bilgesi ve mizahi karakterdir. Nükteli hikâyeleriyle günlük yaşamın absürtlüğünü ortaya çıkarır, halk bilincinde yüzyıllardır canlı tutulur."
 historical_character.widukind_of_corvey: "Corveyli Widukind, 10. yüzyıl Sakson keşiş, tarihçi ve müzik kuramcısıdır. 'Res gestae Saxonicae' adlı eseriyle Saksonların ve özellikle İmparator Otto I döneminin tarihini kaydetmiştir."
 historical_character.roger_de_flor: "Roger de Flor, 13.-14. yüzyılda bir paralı asker kaptanı ve maceracıdır. İlk başta Tapınak şövalyesi olan Roger, Katalan Birliği'nin başına geçerek Andronikos II ve Michael IX'a hizmet etmiştir. Etkisinin artması sonucunda suikasta uğramıştır."
 historical_character.regino_of_prum: "Regino of Prüm, 9. yüzyıl Benediktin keşişi, tarihçi ve müzik kuramcısıdır. Prüm Manastırı'nın abbotu olarak görev yapmış, sonra Trier'e geçmiştir. 'Chronicon' adlı eseriyle ünlüdür."
 historical_character.geoffrey_of_monmouth: "Geoffrey of Monmouth, 12. yüzyıl Galli rahip ve yazardır. "Historia Regum Britanniae" adlı eseriyle Britanya krallarının kurgusal tarihini anlatmış, Arthur efsanesinin temellerini sağlamlaştırmıştır."
 historical_character.raiktor: "1081'de I. Alexios Komnenos'un tahta çıkışı sonrası kargaşa sırasında keşiş Raiktor, tahttan indirilen İmparator VII. Mikhail olduğunu iddia etmiştir. Norman dükü Robert Guiscard bu sahte iddiayı Balkanlar'a saldırı gerekçesi yapmış, Dürrachion önlerinde Raiktor'u kullanmış ancak foyası ortaya çıkınca Raiktor'u terk etmiştir. Sonunda Raiktor sessizce ortadan kaldırılmıştır."
 historical_character.nichiren: "Japon Budizminin radikal ve tavizsiz bir reformcusu olan $Nichiren$, Lotus Sutrası'na adanmışlığı kurtuluşa giden yegâne yol ilan etti. Rakip mezhepleri ve siyasî rehaveti acımasızca eleştirdiği için, öğretileri yüzünden sürgüne gönderildi ve suikast girişimlerine maruz kaldı. Mirası, günümüze kadar varlığını sürdüren kendine özgü, milliyetçi bir Budizm ekolünün doğmasına yol açtı."
 historical_character.dogen: "Japonya'da Zen Budizmi'nin Sōtō ekolünün kurucusu olan Dōgen, meditasyon öğretileri ve Japon Zen felsefesini şekillendiren başyapıtı Shōbōgenzō ile saygıyla anılır."
 historical_character.kokan_shiren: "Kamakura dönemi Rinzai ekolüne mensup Zen keşişi, şairi ve de tarihçisidir; dikkat çekici bir Budist tarih metni olan Zenrin Kokuhōki'yi ve Zen içgörüsünü edebî zarafetle harmanlayan şiir antolojileri neşretmiştir."
 historical_character.jeong_mong_ju: "Geç Goryeo döneminin devlet adamı, âlimi ve şairi Chŏng Mong-ju, hanedanın son günlerindeki sarsılmaz sadakatiyle saygı görmüştür. Neo-Konfüçyusçu düşünce ve diplomaside usta olan Chŏng, Joseon rejiminin yükselişine karşı çıkmış ve ilkeleri uğruna suikastla öldürülmüştür. Sarsılmaz vefayı dile getiren son şiiri, Kore'nin en ünlü dizelerinden biri olarak kalır."
 historical_character.yi_saek: "Geç Goryeo döneminin kilit Konfüçyusçu âlimi Yi Saek, Zhu Xi'nin Neo-Konfüçyusçuluğunu Kore'ye tanıtmış ve geleceğin Joseon reformcularından bir kuşağı yetiştirmiştir. Eğitim reformunu desteklese de Goryeo hanedanına sadık kalmış, ardılları altında görev almayı reddetmiştir. Etkisi iki hanedanı birbirine bağlamış ve yüzyıllar boyunca Kore düşüncesini şekillendirmiştir."
 historical_character.jinul: "Goryeo döneminin vizyoner bir Seon keşişi olan $Ji_nul$, meditasyon uygulaması ile doktrinel çalışmayı birleştirerek Kore Budizmi'ni reforme etmeyi amaçladı. Songgwangsa'da Jogye Tarikatı'nı kurarak manastır disiplini içinde kişisel aydınlanmayı vurguladı. Öğretileri, Zen içgörüsünü ilmî derinlikle kaynaştırarak bugün uygulanan Kore Seon'u için temel oluşturdu."
 historical_character.prapanca: "Majapahit Cava'sında saray şairi ve tarih yazarıydı; Majapahit'in ihtişamını ve coğrafyasını ayrıntılandıran destansı şiir Nagarakretagama'nın (1365) yazarıdır. Yapıtı, Cava tarihi ve devlet idaresi üzerine başlıca kaynaklardan biridir."
 historical_character.tantular: "Ünlü bir Cava şairi olan Mpu Tantular, Kakawin Sutasoma'yı yazarak daha sonra Endonezya'nın ulusal mottosu olarak benimsenen "Bhinneka Tunggal Ika" ("Çeşitlilik İçinde Birlik") ifadesini literatüre kazandırdı."
 historical_character.kanwa: "Kral Airlangga'nın saltanatında saray şairi olan Mpu Kanwa, Hindu mitolojisini Cava idealleriyle harmanlayan destansı şiir Kakawin Arjunawiwaha'yı kaleme aldı."
 historical_character.sedah: "Kral Jayabhaya'nın siparişiyle Mpu Sedah, Mahabharata'nın bir uyarlaması olan Kakawin Bhāratayuddha'yı yazmaya başladı; eser daha sonra Mpu Panuluh tarafından tamamlandı."
 historical_character.panuluh: "Mpu Panuluh, Kakawin Bhāratayuddha'yı tamamladı ve Kakawin Hariwangsa'yı kaleme alarak Cava edebî geleneğine önemli katkılarda bulundu."
 historical_character.dharmaja: "Kral Airlangga'nın saltanatında yaşayan bir şair olan Mpu Dharmaja, sonraki Cava edebiyatını etkileyen Kakawin Smaradahana'yı yazmasıyla tanınır."
 historical_character.monaguna: "Mpu Monaguna, Hindu anlatılarını Cava kültürüyle kaynaştıran şiirsel bir yapıt olan Kakawin Sumanasantaka'yı kaleme almakla anılır."
 historical_character.kuturan: "Bali tarihinin saygıdeğer bir dinî figürü olan Mpu Kuturan, Bali'deki Hinduizm'in çeşitli mezheplerini birleştirmesi ve dinî ile örfî hukuk kurallarını bütünleştiren Desa Adat sistemini kurmasıyla anılır."
 historical_character.dwijendra: "Lombok ve Bali'de Hinduizm'in yayılmasında önemli rol oynayan ruhani lider Mpu Dwijendra, öğretileri ve adalar boyunca kurduğu tapınaklarla tanınır."
 historical_character.kavindrarimathana: "Kavindrarimathana, Kral Rajendravarman II döneminde öne çıkan bir mimar ve mühendisti. Pre Rup ve East Mebon dâhil önemli tapınakların tasarımına imza atarak Khmer İmparatorluğu'nun mimari kudretini sergiledi."
 historical_character.daun_penh: "14. yüzyılın saygı duyulan bir dul kadını olan Daun Penh'in, Tonlé Sap'ta yaşanan bir sel sırasında su üstünde sürüklenen bir koki ağacının içinde kutsal Buddha heykelleri bulduğu rivayet edilir. Bunu ilahî bir işaret sayarak tepe üzerindeki bir tapınak olan Wat Phnom'u inşa etti ve bu kutsal emanetleri de oraya yerleştirdi. Onun bu ibadet eylemi, adını taşıyan Phnom Penh kentinin doğuşuna zemin hazırladı."
 historical_character.yue_fei: "Çin'in en çok kutlanan generallerinden biri olan Yue Fei, mütevazı kökenlerden yükselerek istilacı Curçen Jin'e karşı Güney Song'un sarsılmaz savunucusu oldu. İmparatora ve ulusal birliğin idealine olan sadakatinden ödün vermedi; yozlaşmış görevlilerce ihanete uğrayıp haksız yere idam edildi. Mirası, hâlâ vatanseverlik ve doğruluğun simgesi olarak yaşamayı sürdürür."
 historical_character.wen_tianxiang: "Güney Song'un son döneminin saygıdeğer bir bilgin-generali olan Wen Tianxiang, Moğol fethine karşı direnişin sembolüydü. Hanedanı savunma girişimi başarısız olunca esir düştü; Yuan'a hizmet etmeyi reddederek bir şehit olarak öldü. Özellikle hapiste kaleme aldığı şiirleri, bilhassa "Doğruluk Türküsü", onu erdem ve sadakatin timsali haline getirdi."
 historical_character.fan_zhongyan: "Kuzey Song'un devlet adamı, şansölyesi ve Neo-Konfüçyusçu âlimi Fan Zhongyan, "Önce kaygılanan, en son huzur bulan" şeklindeki ünlü özdeyişiyle tanınır; yönetimi ve toplumsal refahı geliştirmek için uyguladığı reformlar, mihenk taşı niteliğindedir."
 historical_character.li_qingzhao: "Çin'in en büyük kadın şairlerinden biri olan Li Qingzhao, kişisel kaybı ve geçmiş çağın zarafetini dokunaklı biçimde dile getiren Song dönemine ait Ci türündeki lirik şiirleriyle ünlüdür."
 historical_character.qiu_chuji: "Saygı gören bir Taoist üstat (Kuzey'in Yedi Gerçek Taoisti'nden biri) ve Cengiz Han'ın danışmanıydı; Han'a yönetim ve uzun ömür üzerine öğüt vermek için Kuzey Çin'den Orta Asya'ya seyahat etmiş, erken Yuan'ın dinî politikasının şekillenmesine katkı sağlamıştır."
 historical_character.chu_van_an: "Trần hanedanının saygın Konfüçyusçu öğretmeni ve Thăng Long'daki İmparatorluk Akademisi'nin başı olan Chu Văn An; dürüstlüğü, eğitim reformları ve kralı yozlaşmış görevlileri ortadan kaldırmaya çağıran "Yedi Kellenin Kesilmesi" dilekçesiyle tanınır."
 historical_character.nguyen_thuyen: "13. yüzyılda yaşamış şair-memur Nguyễn Thuyên, edebiyatta Nôm yazısının (Vietnamca halk yazısı) kullanımına öncülük etmesiyle anılır. Efsaneye göre yazdığını dizeler timsahları uzaklaştırırdı; bu da Vietnam dilinin ve öğreniminin kudretini simgeler."
 historical_character.pham_ngu_lao: "13. yüzyılda Trần hanedanı adına birden çok Moğol istilasının püskürtülmesine yardım eden ünlü bir generaldi. Köylü kökenli olmasına rağmen cesaretiyle yükselmiş ve vatanseverliğin simgelerinden biri hâline gelmiştir (bu olaylar adanmışlığını öven ünlü bir şiirin de konusudur)."
 historical_character.sakata_kintoki: "Sagami dağlarından çıkan kudretli bir savaşçı olan $dynn_Satake$ $Kin_toki$'nin, $dynn_Minamoto$ $Yorimitsu$'ya büyük güç ve sadakatle hizmet ettiği söylenir. "Kintarō" olarak anlatılan efsanevi hünerleri arasında ayılarla güreşmek, ağaçları kökünden sökmek ve savaşa atılmak vardır."
 historical_character.takezaki_suenaga: "Kamakura şogunluğunun son derece sadık bir samurayı olan $dynn_Takezaki$ $Suenaga$, Japonya'nın Moğol istilaları sırasında gösterdiği yiğitlikle ün kazandı. Hizmetinin hakkıyla takdir edilmesini isteyen $Suenaga$, başarılarını kayda geçiren resimli tomarlar hazırlatmıştır."
 historical_character.eisai: "Bir tapınak ailesinde doğan $Eisai$ keşiş oldu; ancak Budizm'in baskın Pundarika ya da Tendai ekollerinden hoşnut kalmayarak Dhyana, yani Chan, düşünürlerinin öğretilerini öğrenmek için Çin'e gitti. Dönüşünde bu fikirleri Japonya'ya taşıdı; Zen'in Rinzai ekolünü kurdu, ilk tapınağını inşa ettirdi ve yeşil çayı yeniden popülerleştirdi."
 historical_character.ippen: "$Ippen$ küçük yaşlardan itibaren kutsal metinleri inceledi; ancak bir süre sonra dünyevi hayata döndü. Kumano'ya hac yolculuğu sırasında Tanrı ona aydınlanma yolunu gösterdi: [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]'nun vecd içinde yankılanması. İlahi esinle $Ippen$, adanmış bir Saf Toprak keşişi ve öğretmeni olarak yeniden keşişliğe döndü; coşkulu takipçilerden oluşan bir grupla Japonya'yı dolaştı ve Ji-shū ekolünü kurdu."
 historical_character.myoe: "Çocukken yetim kalan $MyO_e$, öğretmenleri arasında $Mongaku$ ve $Eisai$'nin de bulunduğu çeşitli ekollerde eğitim gördü; fakat bunlar onu pek tatmin etmedi. Manastırların tartışmalarından uzak bir sükûnet arayarak bir zamanlar gözde olan Kegon öğretilerine geri döndü; onları Shingon ve Tendai düşüncesinden esintilerle canlandırdı ve [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]'ya duyulan hayranlığı reddetti."
 historical_character.honen: "$HO_nen$, babası suikasta kurban gittikten sonra çocuk yaşta rahipliğe adandı ve Tendai ruhbanlığında hızla yükseldi. Keşişlerin büyük rahatlığına karşın halkın sefaleti arasındaki tezat onu rahatsız edince, [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]'nun kapsayıcı bir öğreti olduğunu fark etti ve önde gelen bir Saf Toprak öğretmeni haline geldi. Radikal fikirleri sonucunda diğer mezheplerin öfkesini üzerine çekerek Jogen takibatı sırasında sürgüne gönderildi."
 historical_character.shinran: "Çocuk yaşta yetim kalan $Shinran$, genç yaşta rahipliğe adandı; ancak ruhbanlıkta zorlandı. Bir görüde keşiş arkadaşı $HO_nen$'i aramaya yönlendirilen $Shinran$, önde gelen bir müridi oldu ve Jogen takibatında sürgün acısı çekti. Halka [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] Saf Toprak öğretilerini coşkuyla vaaz etmeyi sürdürerek nihayet kendi ekolü olan Jōdo Shinshū'yü, yani Gerçek Saf Toprak Mezhebi'ni kurdu; bu ekol bugün Japonya'da en yaygın biçimde uygulanandır."
 historical_character.mibu_tadamine: "Mütevazı kökenlerine rağmen $Tadamine$, bir yarışmada boy gösterip imparatorluk görevlendirmesi ile Fujiwara ailesinin himayesi altına girmesinden sonra waka şiirleriyle büyük ün topladı. Oğlu $Tadami$ ile birlikte, imparatorluk antolojilerine girdiği düşünülen seksen birden fazla şiiriyle Japonya'nın Otuz Altı Ölümsüz Şairi arasında sayılır."
 historical_character.murasaki: "Ünlü şair Fujiwara Kanesuke'nin torununun torunu olan Leydi Murasaki, bilgin Yoshikado ailesinde doğdu; İmparator Ichijo'nun imparatoriçesi Fujiwara Shōshi'nin nedimesi olarak hizmet etti. Şiire olan yeteneği kısa sürede fark edildi ve Otuz Altı Ölümsüz Kadın Şair arasında sayıldı. Günümüzde en çok günlüğü, şair #EMP Sei Shōnagon#! ile rekabeti ve belki de en erken roman olan #EMP Genji'nin Hikâyesi#! ile tanınır."
