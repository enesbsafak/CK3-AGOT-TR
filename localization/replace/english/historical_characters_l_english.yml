 nick_la_hire_desc: ""La Hire" lakabının kökenine dair birden fazla açıklama vardır. Bazıları İngilizlerin onu "the Hire-God" (Tanrı'nın Gazabı) olarak adlandırdıklarını söyler, Eski Fransızca'daki "hīra," günümüz İngilizcesinde öfke veya hiddet anlamına gelen "ire" olarak geçmiştir. Alternatif olarak ismi Fransızcada "kirpi" anlamına gelen "heérisson" kelimesinden de geliyor olabilir."
