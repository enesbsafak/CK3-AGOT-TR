l_english:
 TOTAL_MERIT: "Toplam [merit|E]: $VALUE|V0$"
 MERIT_EFFECTS_BREAKDOWN: "#S Etkiler:#![AddTextIf( Not( StringIsEmpty(GetMeritLevelEffects( Character.GetMeritLevel )) ), '\n' )][GetMeritLevelEffects( Character.GetMeritLevel )]"
 MERIT_PROGRESSBAR_MARKER_TOOLTIP: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\n[GetMeritLevelThreshold( ComplexBarItem.GetIndex )|V^] $game_concept_merit$ gerektirir\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[movement_power|E]: [movement_power_i] [Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
 MERIT_TOOLTIP_COMPLETED_EXAMINATIONS: "Tamamlanmış [imperial_examinations|E]"
 MERIT_TOOLTIP_EXAMINATION_DISCLAIMER: "[Concept('governors', 'Valilerin')|E] daha fazla sınava girmek için önce görevden çekilmeleri gerekir"
 MERIT_TOOLTIP_EXAMINATION_PASSED_CHILD_EXAM: "@child_exam_icon! #T Çocuk Sınavı#!\n$CHILDRENS_EXAMINATION_PASSED_FAIL$\n\n$tgp_china_attend_child_exam_decision$ [Concept('decision', 'Kararıyla')|E] girilir"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PROVINCIAL_EXAM: "@provincial_exam_icon! #T Eyalet Sınavı#!\n[SelectLocalization( HasPassedProvincialExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedProvincialExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S Geçildiğinde:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithBulletPointEffects]\n\n[GetActivityType('activity_local_examination').GetName] [Concept('activity', 'Etkinliğinde')|E] devlet görevlileri tarafından düzenlenir"
 MERIT_TOOLTIP_EXAMINATION_PASSED_METROPOLITAN_EXAM: "@metropolitan_exam_icon! #T Şehir Sınavı#!\n[SelectLocalization( HasPassedMetropolitanExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedMetropolitanExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S Geçildiğinde:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithBulletPointEffects]\n\n[GetActivityType('activity_imperial_examination').GetName] [Concept('activity', 'Etkinliğinde')|E] [GetGovernment('celestial_government').GetName|E] [government|E] tarafından düzenlenir"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PALACE_EXAM: "@palace_exam_icon! #T Saray Sınavı#!\n[SelectLocalization( HasPassedPalaceExamination(Character), 'EXAMINATION_PASSED', 'EXAMINATION_NOT_TAKEN' )]\n\n#S Geçildiğinde:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithBulletPointEffects]\n\n[GetActivityType('activity_imperial_examination').GetName] [Concept('activity', 'Etkinliğinde')|E] [Concept('son_of_heaven', 'Göklerin Oğlunun')|E] huzurunda düzenlenir"
 CHILDRENS_EXAMINATION_PASSED_FAIL: "[SelectLocalization( HasPassedChildrenExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedChildrenExamination(Character), SelectLocalization(Character.IsAdult, 'EXAMINATION_FAILED_NO_RETAKE' , 'EXAMINATION_FAILED') ,'EXAMINATION_NOT_TAKEN') )]"
 EXAMINATION_PASSED: "@passed_examination!#P Geçildi#!"
 EXAMINATION_FAILED_NO_RETAKE: "@failed_examination!#N Geçilmedi#!" 
 EXAMINATION_FAILED: "$EXAMINATION_FAILED_NO_RETAKE$ #weak (yeniden girilebilir)#![AddLocalizationIf(And(And(Character.IsMeritCapped, Character.IsAdult), Or(ObjectsEqual(GetPlayer, Character.GetWarden.Self), Character.IsLocalPlayer)), 'EXAMINATION_WOULD_TAKE')]"
 EXAMINATION_NOT_TAKEN: "#weak Sınava Girilmedi#![AddLocalizationIf(And(And(And(Character.IsMeritCapped, Character.CanImproveMeritRank), Character.IsAdult), Or(ObjectsEqual(GetPlayer, Character.GetWarden.Self), Character.IsLocalPlayer)), 'EXAMINATION_WOULD_TAKE')]"
 EXAMINATION_WOULD_TAKE: "\n\n[Select_CString(Character.IsLocalPlayer, '', Character.GetShortUIName )][Select_CString(Character.IsLocalPlayer, 'M', ' adlı kişinin m' )]aksimum [Concept('merit_level', 'Liyakat Kademe')|E][Select_CString(Character.IsLocalPlayer, 'niz', 'si' )], bu [Concept('examination', 'Sınava')|E] girilmediği için kısıtlı. [SelectLocalization(Character.IsLocalPlayer, 'EXAMINATION_WOULD_TAKE_ME', 'EXAMINATION_WOULD_TAKE_OTHER')]"
 EXAMINATION_WOULD_TAKE_ME: "Bu sınava girmelisiniz."
 EXAMINATION_WOULD_TAKE_OTHER: "Sınava girerseniz ve uygunsa, size katılacak."
 MERIT_GOVERNOR_APPOINTMENT_SCORE_POSITIVE: "$BULLET$[candidate_score|E]: @appointment_score!#P +[Character.GetGovernorAppointmentScoreByMerit]#!"
 MERIT_GOVERNOR_APPOINTMENT_SCORE_NEGATIVE: "$BULLET$[candidate_score|E]: @appointment_score!#N [Character.GetGovernorAppointmentScoreByMerit]#!"
 MERIT_MOVEMENT_POWER: "$BULLET$[movement_power|E]: [movement_power_i] [Character.GetMovementPowerByMerit|+=0]"
 MERIT_PROGRESS_HEADING: "Bir sonraki $game_concept_merit_level$ne ilerleme"
 MAX_MERIT_RANK_BREAKDOWN_TOOLTIP: "#T Maksimum [merit_level|E]#!\n[PlayerValueItem.GetMaxLevelBreakdown( Character.Self )]"
 MERIT_CAP_OVERFLOW_WILL_COUNT: "#weak Liyakat sınırındayken kazanılan liyakat, Sınavlar geçildiğinde daha yüksek seviyelere doğru sayılır.#!"
 MERIT_RANK_CAP_TT: "#T Liyakat Sınırında#!\n[SelectLocalization( Character.GetGovernment.IsType( 'celestial_government' ), 'MERIT_RANK_CAP_CELESTIAL_TT', 'MERIT_RANK_CAP_MERITOCRATIC_TT')]"
 MERIT_RANK_CAP_CELESTIAL_TT: "[AddLocalizationIf( Character.ShouldShowExaminationRequirement( '(int32)3' ), 'MERIT_RANK_CAP_CELESTIAL_PROVINCIAL_EXAMINATION_TT' )][AddLocalizationIf( Character.ShouldShowExaminationRequirement( '(int32)5' ), 'MERIT_RANK_CAP_CELESTIAL_METROPOLITAN_EXAMINATION_TT' )][AddLocalizationIf( Character.ShouldShowExaminationRequirement( '(int32)7' ), 'MERIT_RANK_CAP_CELESTIAL_PALACE_EXAMINATION_TT' )]\n\n$MERIT_CAP_OVERFLOW_WILL_COUNT$"
 MERIT_RANK_CAP_MERITOCRATIC_TT: "[AddLocalizationIf( Character.ShouldShowExaminationRequirement( '(int32)4' ), 'MERIT_RANK_CAP_MERITOCRATIC_PROVINCIAL_EXAMINATION_TT' )]\n\n$MERIT_CAP_OVERFLOW_WILL_COUNT$"
 MERIT_RANK_CAP_NO_EXAMINATION_TT: "Herkes @merit_level_1_icon![GetModifier( 'merit_level_1' ).GetNameWithTooltip|L] kademesine ulaşabilir"
 MERIT_RANK_CAP_CELESTIAL_PROVINCIAL_EXAMINATION_TT: "@merit_level_3_icon![GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] kademesine ulaşmak için Eyalet Sınavını (veya daha üstünü) tamamlamış olmak gerekir"
 MERIT_RANK_CAP_CELESTIAL_METROPOLITAN_EXAMINATION_TT: "@merit_level_5_icon![GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] kademesine ulaşmak için Şehir sınavını (veya daha üstünü) tamamlamış olmak gerekir"
 MERIT_RANK_CAP_CELESTIAL_PALACE_EXAMINATION_TT: "@merit_level_7_icon![GetModifier( 'merit_level_7' ).GetNameWithTooltip|L] kademesine ulaşmak için Saray Sınavını tamamlamış olmak gerekir"
 MERIT_RANK_CAP_MERITOCRATIC_PROVINCIAL_EXAMINATION_TT: "@merit_level_4_icon![GetModifier( 'merit_level_4' ).GetNameWithTooltip|L] kademesine ulaşmak için Eyalet Sınavını (veya daha üstünü) tamamlamış olmak gerekir"
 career_path_none: "Kariyer Yolu seçilmedi"
 SORT_MERIT: "$game_concept_merit$"
