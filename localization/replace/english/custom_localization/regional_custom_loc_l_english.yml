 PIXIE_GLOSS: "Kelt ve Britanya folklorunda yer alan, oyunbaz şakaları ve gezginleri yoldan çıkarmasıyla bilinen küçük, kanatlı bir ruhtur."
 KOBOLD_GLOSS: "Alman folklorunda yer alan, ev işlerine yardım edebildiği gibi gücendiğinde muzip oyunlar da yapabilen bir ev ruhudur."
 KABOUTER_GLOSS: "Hollanda masallarında geçen, kimi zaman işlere yardım eden, kimi zaman da saygısızlık gördüğünde oyunlar oynayan cüce benzeri bir yaratıktır."
 LUTIN_GLOSS: "Fransız folklorunda yer alan küçük bir ev ya da orman ruhudur, saçları düğümlemek ve eşyaları saklamak gibi yaramazlıklarıyla bilinir."
 DUENDE_GLOSS: "İber folklorunda yer alan, evlerde küçük çaplı kargaşaya yol açan küçük ve ele avuca sığmaz bir hilebaz ruhtur."
 TOMTE_GLOSS: "İskandinav inanışlarında çiftlikleri ve hayvanları koruduğu söylenen ama öfkelendiğinde yaramazlığa meyleden bir ruhtur."
 DOMOVOI_GLOSS: "Slav folklorunda evi koruyan fakat gücendirildiğinde ya da ihmal edildiğinde muziplikler yapan bir ev ruhudur."
 DJINN_GLOSS: "Orta Doğu folklorunda dumansız ateşten yaratılmış, biçim değiştirebilen ve aldatmacaya başvurabilen bir ruhtur."
 RAKSHASA_GLOSS: "Hint mitolojisinde yer alan, yanılsama ve kurnazlıkta usta, kötücül bir biçim değiştiricidir."
 IFRIT_GLOSS: "Kuzey Afrika folklorunda yer alan, aldatma ve güçle ilişkilendirilen, başına buyruk bir ruhtur."
 NINKI_NANKA_GLOSS: "Batı Afrika bataklıklarınde yer alan ve onu görenlere ölüm getirdiğine inanılan korkunç, ejderha benzeri bir ruhtur."
 POPOBAWA_GLOSS: "Svahili folklorunda yer alan, biçim değiştirerek ve zihinsel dehşet yayarak geceleri korku saldığı söylenen yarasa benzeri bir ruhtur."
 GULYABANI_GLOSS: "Türk folklorunda yer alan, ıssız yerlerde dolaşması ve geceleri yalnız yolculara musallat olmasıyla bilinen uzun boylu bir gulyabanidir."
 KUTKH_GLOSS: "Sibirya geleneklerinde görülen, hem yaratıcı hem de muzip bir düzenbaz olan kuzgun ruhudur."
 ROLANGS_GLOSS: "Tibet folklorunda sert hareketleri ve kötücül niyetiyle tanınan yeniden canlanmış bir cesettir."
 HULIJING_GLOSS: "Çin folklorunda yer alan, biçim değiştirme gücüne sahip, aldatıcı ve baştan çıkarıcı oyunlarıyla meşhur bir tilki ruhudur."
 KUMIHO_GLOSS: "Kore mitolojisinde geçen, insanları aldatması ve onlara musallat olmasıyla bilinen dokuz kuyruklu bir tilki ruhudur."
 TANUKI_GLOSS: "Japon folklorunda yer alan, yanılsama ve oyunbaz yaramazlıklarıyla tanınan, biçim değiştirebilen bir rakun-köpek ruhudur."
 KAMAITACHI_GLOSS: "Kuzey Japon efsanelerinde geçen, eti acı vermeden biçmesiyle bilinen, rüzgâr üstünde gezen bir gelincik ruhudur."
 PHITAIHONG_GLOSS: "Tay geleneğinde ani ya da şiddetli bir ölümden doğduğu söylenen, musallat olup insanları yoldan çıkaran intikamcı bir hayalettir."
 PENANGGALAN_GLOSS: "Malezya folklorunda geçen, gündüzleri aldatıcı biçimde insan gibi görünen, geceleri ise dehşet saçan yüzen bir baş ruhudur."
 EBU_GOGO_GLOSS: "Endonezya folklorunda yer alan, insan konuşmasını taklit etmesi ve köylerden yiyecek ya da küçük eşyalar çalmasıyla bilinen küçük orman ruhlarıdır."
 TIKBALANG_GLOSS: "Filipin folklorunda yolcuları yoldan çıkarması ve ormanlarda oyunlar oynamasıyla bilinen uzun boylu, at başlı bir ruhtur."
 ORANG_BUNIAN_GLOSS: "Borneo folklorunda insanlarla etkileşime giren, kimi zaman onları yoldan çıkaran, kimi zaman da yaramazlık eden görünmez orman ruhlarıdır."
 JIN_KURCACI_GLOSS: "Maluku folklorunda geçen, ormanlarda ve dağlarda yaşadığı söylenen, karşılaştıklarına kimi zaman rehberlik, kimi zaman da yaramazlık sunan küçük, insan benzeri varlıklardır."
 MAZAPEGUL_GLOSS: "İtalyan folklorunda, yatak odalarına musallat olması, atların yelelerini örmesi ve uyuyanların göğsüne çökerek kâbuslara yol açmasıyla bilinen muzip bir gece ruhudur."
 KALLIKANTZAROS_GLOSS: "Noel'in on iki günü boyunca ortaya çıkıp yaramazlık ve kargaşaya yol açtığı söylenen kötücül bir goblindir."
 MRENH_KONGVEAL_GLOSS: "Kmer folklorunda geçen, oyunbaz şakaları ve hayvanlarla yolcular üzerindeki koruyucu rolleriyle tanınan küçük, ele avuca sığmaz ruhlardır."
