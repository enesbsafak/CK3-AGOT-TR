l_english:
 martial_good_trait_match_good_outcome:0 "Aktif ve hevesli bir çocuk olan [ROOT.Char.GetFirstName], herkesin beklediği gibi savaş ve dövüş eğitimlerinde başarılı oldu."
 martial_bad_trait_match_good_outcome:0 "Asi bir çocuk olan [ROOT.Char.GetFirstName] için savaş hayatına uygun değil demek yetersiz kalır ancak o bütün beklentilere rağmen başarılı oldu."
 martial_neutral_trait_match_good_outcome:0 "Yeterli eğitim ile [ROOT.Char.GetFirstName] gibi savaşa pek ilgi göstermeyen çocuklar bile başarılı olabilir."
 education_martial_3_outcome_description:0 "Hem savaş taktiklerinde hem de ordu yönetiminde büyük bir yetenek gösterdi. Gelecekte iyi bir komutan olacağına eminim."
 education_martial_3_outcome_description_not_commander:0 "Hem savaş taktiklerinde hem de ordu yönetiminde büyük bir yetenek gösterdi. Asla bir komutan olamayacak olması utanç verici."
 education_martial_4_outcome_description:0 "Bu kadar genç bir insanda böylesi bir yetenek görmek oldukça etkileyici. Sahip olduğu anlayış bazı tecrübeli komutanlarda bile yok!"
 martial_good_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName], enerjik doğası ile savaşa ve dövüşe yatkın biri olduğu izlenimi veriyordu ancak görünen o ki asi birinden öte değilmiş."
 martial_bad_trait_match_bad_outcome:1 "[ROOT.Char.GetFirstName] hiçbir zaman savaşa pek ilgi duymamıştır ancak bunun sadece bir geçiş evresi olduğunu düşünüyordum. Çok safmışım."
 martial_neutral_trait_match_bad_outcome:1 "Uzun zamandır savaş konusunda iyi bir eğitimin [ROOT.Char.GetFirstName] için yeterli olacağını umuyordum. Çok safmışım."
 education_martial_1_outcome_description:2 "Konuya pek ilgisi yoktu ancak en azından kılıcı doğru yöne tutmayı biliyor ve hatta belki de bir $knight_culture_player_no_tooltip_lowercase$ ile sıradan bir piyadeyi ayırt edebilir."
 education_martial_2_outcome_description:1 "Konuyla ilgili temelden öteye pek gidemedi ancak en azından ordu yönetiminin temellerini öğrendi. Umarım geri kalanı tecrübe ile birlikte oturmaya başlar."
 education_martial_prowess_1_outcome_description:1 "\n\nGörünen o ki $knight_culture_player_adjective_no_tooltip_lowercase$ eğitimlerinden pek bir şey öğrenemedi ve birebir dövüşlerde sürekli tökezliyor."
 education_martial_prowess_2_outcome_description:1 "\n\nBirkaç küçük grup isyankâr köylüye karşı başarılı bir şekilde savaşarak bir $knight_culture_player_no_tooltip_lowercase$ olmak için yeterli kapasiteye sahip olduğunu gösterdi."
 education_martial_prowess_3_outcome_description:0 "\n\nKılıç tutuşu ve kişisel askerlerini idare edebilme becerisiyle başarılı bir yakın mesafe savaşçısı olduğunu gösterdi."
 education_martial_prowess_4_outcome_description:0 "\n\nGeleneksel [ROOT.Char.GetCulture.GetNameNoTooltip] dövüş sanatlarının en zor hareketlerinde bile ustalaşıp, kendisinin inanılmaz yetenekli bir savaşçı olduğunu gösterdi."
 diplomacy_good_trait_match_good_outcome:0 "[ROOT.Char.GetFirstName] çocukken bile ağzı iyi laf yapan birisiydi. Bu yüzden diplomatik ilişkiler ile ilgili eğitimlerinde başarılı olması hiç de şaşarıtıcı olmadı."
 diplomacy_good_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] konuşkan bir çocuk olmasına rağmen bazen insanlar ile iletişim kurmakta zorluk çekebiliyor."
 diplomacy_bad_trait_match_good_outcome:0 "Diğer çocuklar ile pek anlaşamayan [ROOT.Char.GetFirstName], diplomatik manevralar konusunda şaşırtıcı bir yetenek gösterdi."
 diplomacy_bad_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] her zaman kendi isteklerine odaklanan biri olduğundan diğer insanları etki altına almayı öğrenmekte zorlanması kimseyi şaşırtmadı."
 diplomacy_neutral_trait_match_good_outcome:0 "Yeterli eğitim ile [ROOT.Char.GetFirstName] gibi diplomatik ilişkilere pek ilgi göstermeyen çocuklar bile başarılı olabilir."
 diplomacy_neutral_trait_match_bad_outcome:0 "Uzun zamandır diplomasi alanında iyi bir eğitimin [ROOT.Char.GetFirstName] için yeterli olacağını umuyordum ancak tüm çabalarım boşa gitti."
 stewardship_good_trait_match_good_outcome:0 "Doğuştan bir yönetici olarak görülen [ROOT.Char.GetFirstName], ülke yönetimi hakkında aldığı derslerdeki başarıları ile bunu kanıtladı."
 stewardship_good_trait_match_bad_outcome:0 "Sürekli otorite ve düzen arayan biri olarak görülen [ROOT.Char.GetFirstName], toprak ve halk yönetiminde beklenildiği kadar başarılı olamadı."
 stewardship_bad_trait_match_good_outcome:0 "Ülkenin vergilerinden ve nüfusundan çok dedikodularına önem veren [ROOT.Char.GetFirstName] beklenmedik bir şekilde yönetim konusunda yetenekli çıktı."
 stewardship_bad_trait_match_bad_outcome:0 "İnsanların hayatlarındaki en ufak bir detaya bile takılan [ROOT.Char.GetFirstName], şaşırtıcı olmayan bir şekilde ülke yönetimi konusundaki anlayışını pek geliştiremedi."
 stewardship_neutral_trait_match_good_outcome:0 "Yeterli eğitim ile [ROOT.Char.GetFirstName] gibi yönetim konularına pek ilgi göstermeyen çocuklar bile başarılı olabilir."
 stewardship_neutral_trait_match_bad_outcome:0 "Uzun zamandır yönetim alanında iyi bir eğitimin [ROOT.Char.GetFirstName] için yeterli olacağını umuyordum ancak tüm çabalarım boşa gitti." #krutygetarts
 intrigue_good_trait_match_good_outcome:0 "Zeki bir çocuk olan [ROOT.Char.GetFirstName], eğitimleri boyunca plan kurmaya doğuştan yetenekli olduğunu tekrar tekrar gösterdi."
 intrigue_good_trait_match_bad_outcome:0 "Çocukken sıkça yalan söyleyen [ROOT.Char.GetFirstName] ne yazık ki bu yaratıcılığını yapılandırılmış bir plan kurmak için kullanamadı."
 intrigue_bad_trait_match_good_outcome:0 "Çoğunlukla kendi düşüncelerine dalan ve içine kapanık bir çocuk olan [ROOT.Char.GetFirstName], manipülasyon sanatına büyük bir ilgi göstermeye başladı."
 intrigue_bad_trait_match_bad_outcome:0 "Sessiz ve uysal bir çocuk olan [ROOT.Char.GetFirstName], insanları etkileme konusuna hiç ilgi göstermedi."
 intrigue_neutral_trait_match_good_outcome:0 "Yeterli eğitim ile [ROOT.Char.GetFirstName] gibi plan kurmaya pek ilgi göstermeyen çocuklar bile başarılı olabilir."
 intrigue_neutral_trait_match_bad_outcome:0 "Uzun zamandır planlama alanında iyi bir eğitimin [ROOT.Char.GetFirstName] için yeterli olacağını umuyordum ancak tüm çabalarım boşa gitti."
 learning_good_trait_match_good_outcome:0 "Her zaman meraklı ve bilgiye aç bir çocuk olan [ROOT.Char.GetFirstName], daha erken yaşta iyi bir âlim olacağını belli etmişti."
 learning_good_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] her zaman meraklı ve bilgiye aç bir çocuk olmasına rağmen yaşı ilerledikçe ilgisi başka yerlere kaydı."
 learning_bad_trait_match_good_outcome:0 "[ROOT.Char.GetFirstName] ilgisiz bir çocuk olmasına rağmen âlimlik için odaklanmış çalışmanın o kadar da önemli olmadığını herkese kanıtladı."
 learning_bad_trait_match_bad_outcome:0 "İlgisiz bir çocuk olan [ROOT.Char.GetFirstName] için neden âlimlik ile uğraşmakta zorluk çektiğini anlamak pek zor olmaz."
 learning_neutral_trait_match_good_outcome:0 "Yeterli eğitim ile [ROOT.Char.GetFirstName] gibi bilime pek ilgi göstermeyen çocuklar bile başarılı olabilir."
 learning_neutral_trait_match_bad_outcome:0 "Uzun zamandır bilim alanında iyi bir eğitimin [ROOT.Char.GetFirstName] için yeterli olacağını umuyordum ancak tüm çabalarım boşa gitti."
 education_diplomacy_1_outcome_description:1 "Nazik ve onurlu davranışlar sergilemek onun için zor olsa da en azından basit görgü kurallarını biliyor."
 education_diplomacy_2_outcome_description:1 "Saraydaki çok az kişi onun görgü anlayışından etkilenir ancak en azından kibar bir ortamda sırıtmayacak kadar başarılı."
 education_diplomacy_3_outcome_description:0 "Tüm görgü kurallarını mükemmel bir şekilde kavrayışı, tüm eğlence çeşitlerine olan anlayışı ve bunların yanında laf yapan ağzıyla saray hayatı boyunca neredeyse hiç zorluk çekmeyecek."
 education_diplomacy_4_outcome_description:0 "Kontların ve Kralların aklını çelebilecek tam bir tatlı dilli! Ne zaman konuşsa bütün saray onu dinlemek için sessizliğe bürünür."
 education_stewardship_1_outcome_description:0 "Para sayma sanatında ustalaştığı için şanslı sayılabilir çünkü idareciliğin diğer yönleri ona pek uğramamış."
 education_stewardship_2_outcome_description:1 "Çok az kişi konu üzerindeki yetkinliğinden etkilenir ancak en azından yönetimin temellerine hâkim."
 education_stewardship_3_outcome_description:0 "Para ve insan akışını çok iyi kavramasının yanında bu meseleler ile ilgilenirken hayran verici bir yaratıcılık da sergiliyor."
 education_stewardship_4_outcome_description:0 "Paranın akışından anlamamasına rağmen ne olacağını tahmin edebiliyor ve bundan bir şekilde kazanç sağlamanın yolunu buluyor."
 education_intrigue_1_outcome_description:0 "Sabır ve kurnazlık eksiliğnden dolayı uzun vadeli planlar yapmakta zorlanıyor. En azından plan yapmaya çalışıyor."
 education_intrigue_2_outcome_description:1 "Küçük planlar yapmakta gayet iyi olduğunu göstermiş olsa da bazıları bu planların ince ayrıntılara sahip olmadığını söylüyor. Neyse ki ince ayrıntılar her zaman ihtiyacınız olan bir şey değildir."
 education_intrigue_3_outcome_description:0 "İstediği şeyi elde etmek için pek çok yol biliyor. En önemlisi ise bu isteklerinin doğuracağı politik sonuçların farkında."
 education_intrigue_4_outcome_description:0 "Yapması için görevlendirildiği her iş başkaları tarafından ondan daha önce tamamlandı ve artık eskisi gibi inandırıcı yalanlar da söyleyemiyor. Belki de göründüğü kadar akıllı biri değildir."
 education_learning_1_outcome_description:0 "Bilginin peşinden koşma alışkanlığı onun zihninde hiçbir zaman tam bir yer edinemedi ve artık kitaplar ve parşömenler ile geçirdiği zaman onun için bir eğlenceden çok angarya bir işe dönüşmüş durumda."
 education_learning_2_outcome_description:0 "Çok çalışkan biri olmasa da en azından klasik eserlerden birkaç önemli parçayı ezberlemeyi başardı. Belki de hiçbir zaman büyük bir teorem yazamayacak ancak en azından yazılmış olanlardan bazılarını okuyabilir."
 education_learning_3_outcome_description:0 "Hevesli bir öğrenci olarak geçirdiği eğitimden sonra tam bir bilgi kaynağına dönüştü ve ileri seviye teorik ve teolojik argümanlar oluşturabilecek kadar yetenekli biri olduğunu kanıtladı."
 education_learning_4_outcome_description:0 "Felsefi ve teorik çalışmalara karşı bakışı olukça etkileyici ve önceki öğretmenleri ile sık sık tartışmalara girmekte. Bu kadar genç yaşta bile, yeni fikirleri ve teorileri desteklemek için en bilinmedik yazılardan alıntılar yapabiliyor."

